prompt: |-
  I teach a third-year philosophy of mind seminar, 16 students, and they've all read the Dennett material on the four kinds of creatures -- Darwinian, Skinnerian, Popperian, Gregorian -- but they've clearly just memorised it as a ladder from dumb to smart. I want a 90-minute in-class game that makes them feel what the ladder is actually tracking: where selection happens and who pays for a wrong guess, not how clever anybody is. Room has tables, index cards, a couple of dice, and a whiteboard. No projector, no laptops or phones, no real money.

  Here's the spine I want. Four teams of four, all trying to figure out and exploit the same hidden structure for points, but each team runs on a different architecture that you build into the *rules* rather than into a description they read:

  - one team is hardwired. they get a fixed strategy card they aren't allowed to deviate from, and I want it to pay off spectacularly in one phase and then fall apart in the next, so they get to experience a competence they can't revise
  - one team can only learn from real outcomes -- every probe costs them points, but the cost buys them the true answer, so they converge and they pay for it
  - one team gets a sandbox: free or nearly-free practice trials, except the sandbox differs from the real task in exactly one respect they cannot detect from the inside, so their internal model ends up confidently wrong
  - one team gets handed an artifact at the start -- a note or table the sandbox team produced in an earlier phase -- and skips discovery entirely. Their borrowed competence should look like genius right up until the point where they inherit the artifact's error, and only then

  Payoffs on paper, and the accounting has to be simple enough that nobody spends the session doing arithmetic instead of thinking. Give me a seperate one-pager of rules per role, the full hidden structure of the task plus what the real rules are (so I can run it without lying to them by accident), the materials list, a minute-by-minute timeline, and the debrief. They shouldn't hear any of the four names until the debrief -- till then they're just teams. The debrief should map specific things that will have happened in the room onto the four architectures, and onto the question of what a Gregorian creature is really doing when it looks smart, i.e. renting someone else's selection history and getting the errors that come with it.

  Then the honest part: tell me what predictably goes wrong the first time I run this -- sandbox team getting suspicious about why their trials are free, hardwired team getting bored and breaking character, artifact team finishing early and heckling -- and what to actually do about each. And be straight with me about which of the four architectures the game can only imitate rather than instantiate, given that every student in the room is already a language-using creature role-playing something else, plus what I'd have to supply myself in discussion to cover that gap. If 90 minutes isn't enough for all four teams, tell me what to cut rather than squeezing it.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** 3rd-year Philosophy of Mind seminar, 16 students.
      *   **Topic:** Dennett's four kinds of creatures (Darwinian, Skinnerian, Popperian, Gregorian).
      *   **Problem:** Students view it as a simple "dumb to smart" ladder.
      *   **Goal:** A 90-minute in-class game to experientially demonstrate *where selection happens* and *who pays for errors*, not just "cleverness."
      *   **Constraints:** 4 teams of 4. Room has tables, index cards, dice, whiteboard. No tech, no money.
      *   **Structure:**
          *   Team 1 (Darwinian): Hardwired strategy. Works then fails. Can't change.
          *   Team 2 (Skinnerian): Learn from outcomes. Probes cost points. Converge slowly.
          *   Team 3 (Popperian): Sandbox/Practice. Free trials, but environment differs slightly (hidden trap). Confident but wrong.
          *   Team 4 (Gregorian): Inherit artifact from Team 3. Skip discovery. Look smart until artifact error hits.
      *   **Deliverables:** Rules per role (1-pager), Hidden Structure/Real Rules, Materials List, Timeline, Debrief, Troubleshooting (what goes wrong), Limitations (what can't be instantiated).
      *   **Tone:** Practical, honest, pedagogical, direct.

  2.  **Deconstruct the Game Mechanics:**
      *   *The Task:* Needs to be simple enough to learn quickly but complex enough to have a "hidden structure." A pattern recognition or prediction game works best. Let's use a "Market Prediction" or "Environment Navigation" metaphor. Let's go with **"The Oracle's Sequence."** It's abstract enough to avoid domain knowledge bias.
      *   *The Hidden Structure:* A sequence of numbers or symbols generated by a rule.
      *   *The Twist:* The rule changes halfway through, or there's a specific exception.
      *   *Team Mechanics:*
          *   **Team 1 (Darwinian):** Pre-written algorithm on a card. "Always guess Odd." "Always guess High." Needs to work initially, then fail. Let's make the rule: "Guess the number is > 5." If the sequence starts high, they win. If it shifts low, they die.
          *   **Team 2 (Skinnerian):** They guess. If wrong, they lose points *and* see the answer. If right, they gain points. They learn by punishment/reward.
          *   **Team 3 (Popperian):** They get a "Simulation Mode." They can test hypotheses without point loss. *Crucial:* The simulation has a bug. Maybe the simulation excludes a specific number that appears in the real game.
          *   **Team 4 (Gregorian):** They get Team 3's "Rule Book" at the start. They don't simulate. They just play. They inherit Team 3's bug.

      *   *Refining the Task:* "The Oracle's Sequence" might be too abstract. Let's make it **"The Resource Harvest."**
      *   *Setup:* There are 4 "Zones" (A, B, C, D). Each round, one Zone yields resources (points). Teams bet on which Zone.
      *   *Hidden Rule:* The Zones cycle A -> B -> C -> D.
      *   *The Shift:* After Round 5, the cycle reverses or skips one.
      *   *Wait, simpler:* A dice roll determines the winner, but the dice are loaded based on a hidden rule.
      *   *Best Option:* **Pattern Prediction.** The Instructor generates a sequence of 0s and 1s (or Left/Right). Teams predict the next one.
      *   *Hidden Rule:* Alternating (0, 1, 0, 1...) for Round 1-5. Then Double Alternating (0, 0, 1, 1...) for Round 6-10.
      *   *Team 1 (Darwinian):* Card says "Always predict 0." (Wins 50% initially, then crashes). Or better: "Predict the opposite of the last one." (Works for Alt, fails for Double Alt). Let's go with "Predict the opposite of the last one."
      *   *Team 2 (Skinnerian):* Predict. If wrong, -2 pts, see answer. If right, +1 pt.
      *   *Team 3 (Popperian):* Get 3 "Test Rounds" before scoring starts. *The Trap:* In Test Rounds, the sequence is pure Alternating. In Real Rounds, it shifts. They derive the wrong rule.
      *   *Team 4 (Gregorian):* Get Team 3's written rule. "It always alternates." They start scoring immediately.

      *   *Correction on Team 3 & 4:* The prompt says Team 4 gets an artifact Team 3 produced *in an earlier phase*. This implies sequential play or pre-prepared material. Since it's simultaneous class time, I (the instructor) must simulate Team 3's output for Team 4, OR Team 3 plays Phase 1, writes a rule, hands it to Team 4, then Phase 2 starts.
      *   *Timeline Constraint:* 90 minutes. Sequential phases eat time.
      *   *Solution:* Team 3 does "Simulation" *while* Team 4 watches or waits? No, that's boring.
      *   *Better Solution:* Team 3 gets a "Manual" that *claims* to be the truth but has a specific error embedded by me (representing a previous generation's best guess). Team 4 gets the *same* Manual but is told "This is the wisdom of your ancestors."
      *   *Wait, the prompt specifies:* "one team gets handed an artifact at the start -- a note or table the sandbox team produced in an earlier phase."
      *   *Implementation:* I need to fake this. I will collect Team 3's "Best Theory" at minute 30, photocopy it (or just hand a pre-made one that looks like student writing) to Team 4. Or, simpler: Team 3 spends the first 20 mins in "Sandbox" (no points, just testing). They write a "Strategy Guide." I hand that Guide to Team 4. Then everyone plays the "Real Game" for 40 mins.
      *   *Actually, to save time:* Team 3 gets a "Training Deck" of cards. Team 4 gets a "Strategy Card" derived from a *previous* class's Training Deck (prepared by me in advance to look authentic). This ensures the error is guaranteed.
      *   *Let's refine the "Error":* The Training Deck (Team 3) follows Rule A. The Real Game (Everyone) follows Rule A *except* for specific Exception X. Team 3 learns Rule A perfectly. Team 4 inherits Rule A. Both fail at Exception X. Team 2 (Skinnerian) learns Exception X through pain. Team 1 (Darwinian) dies at Exception X because they can't change.

  3.  **Drafting the Materials:**
      *   **Task:** "The Color Market." 4 Colors (Red, Blue, Green, Yellow). Each round, one Color pays out.
      *   **Hidden Rule:**
          *   Rounds 1-6: Cycle R -> B -> G -> Y -> R...
          *   Rounds 7-12: Cycle R -> B -> *Skip G* -> Y -> R... (The "Green Glitch").
      *   **Team 1 (Darwinian):** Fixed Card: "Bet on the color that won 2 rounds ago." (Works for simple cycle, fails on skip).
      *   **Team 2 (Skinnerian):** Standard betting. Lose points on wrong guess, see result.
      *   **Team 3 (Popperian):** First 4 rounds are "Simulation." They don't lose points. *Crucial:* In Simulation, the Green Glitch *does not happen*. They derive the Simple Cycle rule.
      *   **Team 4 (Gregorian):** Given Team 3's "Final Report" (Pre-written by me to look like a student summary: "Pattern is R-B-G-Y repeat"). They start betting immediately.

  4.  **Addressing the "Honest Part" (Troubleshooting & Limitations):**
      *   *Troubleshooting:*
          *   Darwinian team boredom: They need to feel the frustration of being right then suddenly wrong without agency.
          *   Popperian suspicion: Why is simulation free? Make it sound like "R&D Budget."
          *   Gregorian heckling: They will feel superior until they crash.
      *   *Limitations:* Real students are Gregorian. They are role-playing Darwin/Skinner/Popper. They can't *actually* stop using language or internal simulation. The game simulates the *constraints*, not the cognition. I need to emphasize this in the debrief.

  5.  **Refining the Timeline (90 Mins):**
      *   0-10: Setup & Rules (No names yet).
      *   10-30: Phase 1 (Team 3 Sandbox, Others wait or Team 1/2/4 start?).
      *   *Correction:* To make it flow, everyone plays the same rounds simultaneously.
      *   *Revised Flow:*
          *   Rounds 1-4: "Calibration." Team 3 gets free trials (no score impact). Team 1 follows card. Team 2 bets (costly). Team 4 reads Artifact.
          *   Rounds 5-12: "The Market." Scoring active for all. Rule Shift happens at Round 7.
      *   *Wait, Team 4 needs the Artifact from Team 3.* If Team 3 is in the room, they haven't finished learning yet.
      *   *Fix:* I (Instructor) provide the Artifact to Team 4, claiming it is "Ancestral Wisdom" (from a previous cohort). This is honest enough for the sake of the game mechanics and saves 30 minutes of waiting. I will note this in the "Instructor Secrets."
      *   *Revised Timeline:*
          *   0-15: Setup.
          *   15-45: The Game (12 Rounds).
          *   45-60: Scoring & Reaction.
          *   60-90: Debrief & Mapping.

  6.  **Developing the Debrief:**
      *   Map experiences to Dennett's terms.
      *   Darwinian: Selection happens over generations (the card is the genome). You pay with death (loss of game).
      *   Skinnerian: Selection happens in lifetime. You pay with punishment (points).
      *   Popperian: Selection happens in head (sandbox). You pay with time/effort, but risk model error.
      *   Gregorian: Selection happened in *someone else's* head/lifetime. You pay with inherited blind spots.
      *   Key Insight: Gregorian isn't "smarter," it's "leveraged."

  7.  **Review against Constraints:**
      *   16 students? Yes, 4 teams of 4.
      *   No tech? Yes, cards/dice/board.
      *   Simple accounting? Use tokens or tally marks.
      *   One-pager rules? Yes.
      *   Hidden structure? Yes.
      *   Troubleshooting? Yes.
      *   Limitations? Yes.

  8.  **Final Polish:**
      *   Ensure the "Green Glitch" is clear.
      *   Make sure the Darwinian card is specific enough to work then fail.
      *   Ensure the Gregorian artifact looks convincing.
      *   Check tone: Professional, helpful, slightly cynical about the "smart ladder" misconception.

      *(Self-Correction during drafting)*: If Team 3 does sandbox rounds 1-4, and the rule shift is at Round 7, Team 3 learns the *old* rule. Team 4 inherits the *old* rule. Team 1 is stuck with the *old* rule (if hardwired to it). Team 2 learns the *new* rule through pain.
      *Wait, Team 1 (Darwinian)* needs to be hardwired to a strategy that *matches* the initial environment. If they are hardwired to "Follow the Cycle," they win rounds 1-6. Then they lose 7-12. This demonstrates "competence without comprehension" that is environment-relative.
      *Team 4 (Gregorian)* inherits the "Follow the Cycle" rule. They also win 1-6, lose 7-12.
      *Differentiation:* Team 4 *thinks* they understand. Team 1 *knows* they are just following orders. The crash feels different. Team 4 feels betrayed by the artifact. Team 1 feels nothing (they can't change).
      *Actually, to make Team 4 distinct:* Team 4 should do *better* than Team 1 initially because they don't have to figure out *how* to execute the rule, they just trust it. But the crash is the same.
      *Better differentiation:* Team 1 is "Always Bet Red." (Too dumb?). Team 1 is "Mirror the previous winner." (Works for cycle, fails on skip). Team 4 gets the written rule "The Cycle is R-B-G-Y."
      *Let's stick to the prompt's request:* Team 1 "fixed strategy card." Team 4 "artifact."
      *Okay, the "Green Glitch" is the key.*
      *Rounds 1-6:* R, B, G, Y, R, B.
      *Rounds 7-12:* G, Y, R, B, G, Y. (Wait, if I skip G in the sequence, the pattern breaks).
      *Let's simplify:*
      *Rule:* The winner is always the color clockwise from the last winner. (R->B->G->Y->R).
      *Glitch:* At Round 7, the wheel breaks. The winner is the *same* as the last winner (Repeat).
      *Team 1 Card:* "Always bet Clockwise."
      *Team 3 Sandbox:* Experiences only Clockwise.
      *Team 4 Artifact:* "Rule: Always Clockwise."
      *Team 2:* Learns whatever happens.

      *Wait, one more check:* The prompt asks for Team 4 to get an artifact Team 3 produced *in an earlier phase*. If I fake it, I must admit it in the "Instructor Secrets." I will advise the instructor to pre-write the artifact to save time, as running Team 3 sequentially kills the 90-minute limit. I will be honest about this in the "Limitations" section.

      *Accounting:* Use index cards as money. Start with 10 cards. Bet 1 card per round. Win = +2. Lose = -1. Simple.

      *Let's write it.*
answer: |-
  # Seminar Game: The Color Market

  ## 1. Materials List
  *   **Whiteboard:** Draw a 4x12 grid (4 Teams x 12 Rounds) for scoring.
  *   **Index Cards (approx. 100):**
      *   60 blank (for currency/betting).
      *   16 "Handout" cards (Rules per team, see Section 2).
      *   4 "Artifact" cards (Pre-written by you, see Section 3).
      *   1 "Master Sequence" card (For your eyes only, see Section 3).
  *   **Dice:** 2d6 (for tie-breaking or random noise if needed, though the game is deterministic).
  *   **Pens:** For recording bets and scores.

  ## 2. The Hidden Structure (Instructor Only)
  **Do not show this to students.**

  **The Task:** Each round, one of four Colors wins: **Red, Blue, Green, Yellow.**
  Teams bet 1 "Token" (index card) on a Color.
  *   **Win:** Gain 2 Tokens.
  *   **Lose:** Lose 1 Token.
  *   **Starting Endowment:** 10 Tokens each.

  **The Master Sequence (12 Rounds):**
  *   **Rounds 1–6 (The Cycle):** Red → Blue → Green → Yellow → Red → Blue.
      *   *Logic:* Clockwise rotation.
  *   **Rounds 7–12 (The Glitch):** Green → Green → Yellow → Red → Blue → Green.
      *   *Logic:* At Round 7, the sequence **stutters** (Green repeats), then resumes clockwise.
      *   *Note:* Round 7 is the trap. The pattern *looks* like it should be Green (following Yellow), and it *is* Green, but Round 8 is *also* Green. This breaks the "Always Clockwise" rule.

  **The Four Architectures (Implemented via Rules):**

  1.  **Team 1 (Darwinian):** **Hardwired.** They receive a Strategy Card they cannot alter.
      *   *Card Text:* "STRATEGY: Always bet on the color that is clockwise from the previous winner. (Red→Blue→Green→Yellow→Red). If you lose, do not change strategy."
      *   *Experience:* They win Rounds 1-6 effortlessly. They lose Rounds 7-12. They are forbidden from adapting.
  2.  **Team 2 (Skinnerian):** **Operant.** They receive no strategy.
      *   *Rule:* They must bet every round. If they lose, they lose the token *and* you announce the correct color immediately. If they win, they keep the token + profit.
      *   *Experience:* They will likely lose tokens in Rounds 1-3 figuring it out. They master the Cycle by Round 6. They will get crushed at Round 7/8 and have to relearn via pain.
  3.  **Team 3 (Popperian):** **Sandbox.**
      *   *Rule:* Rounds 1-4 are "Simulation." They do not bet tokens. They guess, you tell them the answer. No points gained/lost. Rounds 5-12 are Real.
      *   *The Trap:* In Rounds 1-4 (Simulation), you feed them the **Cycle** (R, B, G, Y). You do *not* show them the Glitch yet. They will derive the "Always Clockwise" rule with high confidence.
      *   *Experience:* They feel genius in Round 5-6. They crash at Round 8. They realize their model was overfitted.
  4.  **Team 4 (Gregorian):** **Cultural.**
      *   *Rule:* At the start, hand them the **Artifact Card** (Pre-written by you to look like a student note from a "previous cohort").
      *   *Artifact Text:* "ANCESTRAL NOTE: We cracked the market. It's a simple clockwise rotation. R-B-G-Y. Don't overthink it. Just follow the wheel."
      *   *Experience:* They start betting Round 1 with full confidence. They win 1-6. They crash at 7-8. They feel betrayed by the artifact, not their own reasoning.

  ## 3. Student Handouts (One-Pagers)

  **Cut these out and hand one to each team. Do not let them share.**

  ---
  **TEAM 1 RULES**
  1.  **Goal:** Maximize Tokens.
  2.  **Constraint:** You are issued a **Fixed Strategy Card**. You must follow the instruction on it exactly for all 12 rounds. You are not allowed to discuss changing the strategy.
  3.  **Betting:** Bet 1 Token per round.
  4.  **Feedback:** If you win, +2 Tokens. If you lose, -1 Token. You will be told the correct color after every round.
  5.  **Note:** Your strategy is your biology. You cannot change it.

  **(Attach Fixed Strategy Card to this sheet: "ALWAYS BET CLOCKWISE FROM LAST WINNER.")**

  ---
  **TEAM 2 RULES**
  1.  **Goal:** Maximize Tokens.
  2.  **Constraint:** None. You may discuss any strategy you like.
  3.  **Betting:** Bet 1 Token per round.
  4.  **Feedback:** If you win, +2 Tokens. If you lose, -1 Token **AND** you are told the correct color.
  5.  **Note:** Mistakes are costly, but they teach you the truth.

  ---
  **TEAM 3 RULES**
  1.  **Goal:** Maximize Tokens.
  2.  **Constraint:** **Phase 1 (Rounds 1-4):** This is R&D. You do not bet tokens. You guess the color, Instructor tells you the truth. Use this to build a model.
      **Phase 2 (Rounds 5-12):** Real Market. You bet 1 Token. Win +2, Lose -1.
  3.  **Deliverable:** At the end of Round 4, write down your "Theory of the Market" on an index card.
  4.  **Note:** Your simulation is safe, but is it the whole truth?

  ---
  **TEAM 4 RULES**
  1.  **Goal:** Maximize Tokens.
  2.  **Constraint:** You are issued an **Ancestral Artifact**. You should base your decisions primarily on this artifact.
  3.  **Betting:** Bet 1 Token per round starting Round 1. Win +2, Lose -1.
  4.  **Feedback:** You are told the correct color after every round.
  5.  **Note:** You stand on the shoulders of giants. Trust the artifact.

  **(Attach Artifact Card to this sheet: "ANCESTRAL NOTE: We cracked the market. It's a simple clockwise rotation. R-B-G-Y. Don't overthink it. Just follow the wheel.")**

  ---

  ## 4. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10: Setup & Seeding**
  *   Divide class into 4 teams of 4.
  *   Hand out Rule Sheets + 10 Token Cards each.
  *   **Crucial:** Do not use the words Darwin, Skinner, Popper, or Gregor. Call them Teams 1-4.
  *   Tell Team 3: "You have a 5-minute R&D phase before scoring starts."
  *   Tell Team 4: "Your Artifact is from a previous seminar. It is valuable."

  **00:10 – 00:25: Phase 1 (The Calibration)**
  *   **Rounds 1-4:**
      *   Team 3 calls out guesses (no tokens exchanged). You announce results (R, B, G, Y). Team 3 writes their "Theory."
      *   Teams 1, 2, 4 bet tokens normally.
      *   *Instructor Note:* Keep the pace brisk. 1 minute per round. Write scores on the whiteboard.
  *   **End of Round 4:** Collect Team 3's "Theory" card. (Glance at it, nod, put it aside. You don't actually need it, but it makes the game real for them).

  **00:25 – 00:55: Phase 2 (The Market)**
  *   **Rounds 5-12:** All teams bet tokens.
  *   **Round 7 (The Glitch):** The winner is Green (matches Cycle).
  *   **Round 8 (The Crash):** The winner is Green again (Breaks Cycle).
      *   *Watch the room:* Team 1 will check their card and bet Clockwise (Yellow). Team 4 will check the Artifact and bet Clockwise (Yellow). Team 3 will trust their Model and bet Yellow. Team 2 will be confused.
      *   **Result:** Teams 1, 3, 4 lose. Team 2 loses too but is used to pain.
  *   **Rounds 9-12:** Continue sequence. Team 2 may start recovering. Teams 1, 3, 4 will spiral or stubbornly hold the line.

  **00:55 – 01:05: Accounting & Reaction**
  *   Count tokens.
  *   Ask each team for a one-sentence summary of "What went wrong?" or "Why did we win?"
  *   Write key phrases on the board (e.g., "Card made me do it," "The note lied," "I learned the hard way").

  **01:05 – 01:30: The Debrief (The Dennett Map)**
  *   **Reveal the Names:** Map Teams 1-4 to Darwinian, Skinnerian, Popperian, Gregorian.
  *   **Discussion Points:**
      1.  **Where did selection happen?**
          *   Team 1: Before the game (on the card).
          *   Team 2: During the game (in the market).
          *   Team 3: In the sandbox (in their heads).
          *   Team 4: In a *previous* game (in the artifact).
      2.  **Who paid for the error?**
          *   Team 1: The organism (lost tokens).
          *   Team 2: The organism (lost tokens).
          *   Team 3: The organism (lost tokens after R&D).
          *   Team 4: The ancestor (who wrote the wrong note) + Organism.
      3.  **The Gregorian Illusion:** Team 4 looked like geniuses in Rounds 1-6. They weren't smarter than Team 2; they were *leveraged*. But leverage amplifies errors too.
      4.  **The Ladder Myth:** Dennett isn't saying Gregorian is "better." He's saying Gregorian is *different*. It offloads the cost of trial-and-error to the culture. But if the culture is wrong (the Artifact), the Gregorian creature is more vulnerable than the Skinnerian one, because the Skinnerian knows how to learn, and the Gregorian only knows how to copy.

  ## 5. Instructor Secrets & Troubleshooting

  **What Predictably Goes Wrong (And How to Fix It)**

  1.  **The Darwinian Revolt:** Team 1 students are philosophy majors. They will argue that following a losing strategy is irrational. They will try to "hack" the rule.
      *   *Fix:* Be a tyrant. "The card is your genome. You literally cannot change it. If you deviate, you are disqualified." Make it a constraint of the physics of the game, not a suggestion.
  2.  **The Popperian Suspicion:** Team 3 will suspect the "Free Rounds" are a trap. They might hesitate to trust their model.
      *   *Fix:* Validate them. "R&D is expensive for the university, so it's subsidized." Keep the simulation *perfectly* consistent with the first phase of the real game. The betrayal must come later (Round 8), not during the sandbox.
  3.  **The Gregorian Heckling:** Team 4 will finish their betting quickly (since they have a rule) and start commenting on other teams' struggles.
      *   *Fix:* Require Team 4 to record *why* they made each bet on a sheet. "Cite the Artifact." This keeps them busy and creates evidence for the debrief when the Artifact fails.
  4.  **Time Creep:** 12 rounds can drag if you let them deliberate.
      *   *Fix:* Use a timer. 60 seconds per round. "Bets down." If a team hasn't bet, they lose a token automatically.

  **The Honest Limitation (What You Must Supply)**

  *   **The "Darwinian" Gap:** Your students are not Darwinian creatures. They are Gregorian creatures role-playing Darwinian ones. They *understand* the rule on the card. A real Darwinian creature (e.g., a bacteria) does not understand the rule; it *is* the rule.
      *   *In Debrief:* Acknowledge this. "You felt frustration when the card failed. A real Darwinian creature feels nothing. It just dies. You are simulating the *structure* of selection, not the *phenomenology*."
  *   **The "Gregorian" Gap:** Team 4 received the Artifact from *you*, not from Team 3. In reality, Gregorian creatures inherit from their own community.
      *   *In Debrief:* Admit you faked the Artifact to save time. "In the real world, Team 4 would have watched Team 3 fail in a previous generation. Here, I compressed time. The point is the *dependency*, not the provenance."
  *   **The "Ladder" Trap:** Students will still ask, "But isn't Gregorian ultimately the best?"
      *   *In Debrief:* Point to Round 8. "When the environment shifts faster than culture updates, the Gregorian creature is the most vulnerable. It has forgotten how to learn (Team 2) and is stuck with broken tools. Dennett's ladder is about *options*, not *superiority*."

  **If You Run Out of Time:**
  *   **Cut Rounds 9-12.** Stop at Round 8 (The Crash).
  *   The lesson is learned at the crash. Watching them recover is less important than watching them fail.
  *   Use the saved 15 minutes for the Debrief. The mapping to Dennett is more important than the game mechanics.

  ## 6. Debrief Script Highlights (For the Board)

  Draw this table during the discussion:

  | Team | Dennett Type | Where Selection Happens | Who Pays for Error? | Failure Mode |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Darwinian** | Generations (The Card) | The Individual (Death) | Environmental Shift |
  | **2** | **Skinnerian** | Lifetime (The Market) | The Individual (Pain) | Cost of Learning |
  | **3** | **Popperian** | Inner Sandbox (The Head) | The Individual (Time) | Model Overfitting |
  | **4** | **Gregorian** | Cultural History (The Artifact) | The Ancestor + Individual | Inherited Blindspots |

  **Closing Question:** "Team 4 looked smartest in Round 5. Team 2 looked dumbest. By Round 8, who was actually safest? What does that tell us about the value of 'intelligence' versus 'adaptability'?"
