  **MEMORANDUM**

  **TO:** Oversight Panel, Campus Forecasting Platform
  **FROM:** [Your Name], Undergraduate Panel Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendations Regarding Gen-Ed Contract Anomaly and Charter Revisions

  **Introduction**

  This memo addresses the irregular trading activity on the general-education review contract and proposes resolutions for three pending questions: whether to set aside the closing price, whether to sanction the student trader, and how to regulate future trading by campus employees. My recommendations rely on an epistemic analysis of the platform's design, specifically drawing on social epistemology literature regarding market efficiency and information aggregation.

  **Epistemic Analysis of the Trade**

  The platform is designed as a knowledge-aggregating institution, yet the current incentive structure undermines this function. According to the Milgrom and Stokey no-trade theorem, rational agents with a common prior should not trade unless they possess private information. Here, trade occurred heavily. The four sellers knew the buyer's identity (a provost office worker) yet sold because the price was "too good to pass up." Under Aumann's agreement theorem, rational agents with common priors cannot agree to disagree. If the sellers believed the buyer was rational and possessed superior information regarding the postponement, they should have updated their beliefs rather than selling.

  Their decision to sell indicates that their rationality is oriented toward maximizing play-money balance for the semester prize, not toward truth-seeking. Consequently, the price does not reflect a consensus of probabilistic judgment but rather a liquidity transfer driven by game-theoretic incentives unrelated to the underlying event. This confirms the market is not functioning as designed.

  Furthermore, regarding Grossman and Stiglitz, prices cannot be fully informationally efficient because agents must be compensated for the cost of acquiring information. In a play-money environment, financial risk is absent, but the "cost" here is access. The trader claims he used public signals, but his employment grants him interpretive proximity to those signals that other students lack. If the platform allows employment-based asymmetry without disclosure, it risks becoming a channel for leaking administrative deliberations rather than aggregating independent forecasts. The price of seventy-four cents may reflect genuine information, but it is epistemically corrupted by the potential that it constitutes an advance announcement rather than a prediction.

  **Recommendations**

  **1. Set Aside the Price.**
  I recommend the panel vote to set aside the seventy-four-cent price and withhold it from the provost's office. The price is not the result of independent information aggregation but of a skewed incentive structure where sellers prioritized balance accumulation over epistemic accuracy. Transmitting this price risks the platform influencing the outcome it was supposed to measure; if the provost interprets this price as a leak from within his office rather than a student forecast, it compromises administrative deliberation.

  **2. Do Not Sanction the Trader.**
  I recommend no sanction be issued against the student. While his trading activity highlights a vulnerability, the charter currently defines neither "corruption" nor restrictions on employee trading. To sanction him now would be to punish conduct that was permissible under the rules in force. Two colleagues have suggested treating the charter's silence as a prohibition enforceable retroactively; this violates the principle of *nullum crimen sine lege* (no crime without law). The trader's defense—that he reasoned from public signals—is plausible. We cannot penalize him for exploiting a gap we failed to close.

  **3. Adopt New Rules for Employee Participation.**
  We must close this loophole for future semesters. I propose the following rule language be added to the charter:

  > *Section X: Employment and Information Disclosure*
  > *Participants employed by the University administration must disclose their department and role upon registration. Participants employed within an office directly responsible for the outcome of a specific contract question are prohibited from trading on that contract until forty-eight hours after the relevant decision is publicly announced. Failure to disclose employment status or violation of this trading blackout will result in forfeiture of play-money balances and removal from the platform.*

  This rule balances the need for information aggregation with the necessity of preventing insider influence. It imposes a cooling-off period rather than a blanket ban, acknowledging that employees may still hold valuable interpretive insights without compromising confidentiality.

  **The Strongest Case Against These Recommendations**

  The strongest argument against setting aside the price and refusing sanctions is that the platform *worked* exactly as a prediction market should. Proponents of this view would argue that Grossman and Stiglitz demonstrate markets need informed traders to become efficient. This student, by virtue of his job, had superior access to signals (even if public) and better interpretive skills. By trading heavily, he moved the price from eighteen cents to seventy-four cents, thereby revealing information the market otherwise lacked. To set aside the price is to reject valuable data because of its source, effectively blinding the provost to a probability assessment grounded in reality. Furthermore, refusing to sanction him encourages future participants to bring private information to the market, increasing liquidity and efficiency. Punishing him creates a chilling effect that renders the market sterile.

  **Why This Argument Fails**

  This argument fails because it assumes the platform's goal is purely epistemic efficiency in a vacuum. It is not. The platform operates under a standing agreement where prices serve as *advisory input* to administration. If the price reflects information known only to an insider within the provost's own office, the market is not predicting the future; it is leaking the present. This transforms the platform from a forecasting tool into a workaround for administrative transparency protocols. Additionally, the prize structure (highest balance vs. best calibration) means the sellers did not update on the insider's information but rather liquidated for game points. Therefore, the price does not represent a stable consensus of rational agents, violating the conditions required for the Milgrom and Stokey theorem to validate the trade as informationally productive. We must prioritize the integrity of the advisory relationship over the theoretical efficiency of the market mechanism.

  **Conclusion**

  We should void the price to protect the platform's advisory integrity, refrain from retroactive punishment to uphold fairness, and immediately adopt the proposed disclosure and blackout rules. This preserves the market's epistemic value while preventing it from becoming a vehicle for institutional leakage.
