      *   Provide specific cutting instructions.

      *Self-Correction on Accuracy:* I need to be careful about the "ticket" claim. Berkeley *does* use the word "ticket" or "counter" in *The Querist*. Query 35: "Whether money be not only a ticket or counter..." So that's safe.
      *Self-Correction on Calculus:* The connection is widely cited in Berkeley scholarship (e.g., *Berkeley's Querist and the Analyst*). It's not projection, but it is dense.
      *Self-Correction on Chartalism:* MMT folks might argue Berkeley *is* a chartalist precursor. The distinction is nuanced. Better to soften the claim or cut it to avoid "monetary historian wince."
      *Cutting:* To get from 2k to 1.2k, killing D and E is the easiest path. They are the most abstract. A and B can be compressed. F should be the ending, not a separate section.

      *Plan:*
