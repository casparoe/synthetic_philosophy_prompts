answer: |-
  You have stumbled onto the central tension in contemporary metaphysics and the philosophy of language, specifically regarding the debate between **Epistemicism** (the view you described first) and **Supervaluationism** or **Many-Valued Logic** (the "gaps" view). The specific defender of the view you're describing is almost certainly **Timothy Williamson** (particularly in his book *Vagueness*, 1994).

  You are right to feel that standard labels like "self-sealing" or "unfalsifiable" miss the mark. "Self-sealing" implies an *ad hoc* rescue mission—a patch applied after a counter-example arises. What you are describing is a theory where the unknowability is **architectural**, not accidental. It is built into the foundations, derived from the very principles that make the theory work (e.g., Williamson's "Margin for Error" principles).

  Here is the carving you are looking for.

  ### 1. The Nearest Existing Concepts (and why they fall short)

  **A. Verification-Transcendent Truth**
  *   **The Concept:** The idea that a proposition can be true even if no one can verify it.
  *   **Why it fits:** Both the baldness theory and the two-spheres theory claim there are truths that transcend our ability to verify them.
  *   **Why it falls short:** This describes the *status of the truth*, not the *structure of the argument*. It doesn't capture the specific move where the theory *derives* the impossibility of verification as a theorem. A religious claim might be verification-transcendent, but not because the theology proves evidence is impossible; just because God is hidden. Your case is stronger: the theory says "Given how language works, evidence *cannot* exist."

  **B. Underdetermination of Theory by Evidence**
  *   **The Concept:** Two competing theories account for all possible data equally well.
  *   **Why it fits:** You noted the Epistemicist and Gap theories match on every testable sentence.
  *   **Why it falls short:** Underdetermination is a relationship *between* theories. It doesn't describe the internal machinery of *one* theory that explains *why* it is underdetermined. It also doesn't help you distinguish legitimate underdetermination (quantum interpretations) from illegitimate it (metaphysical idleness).

  **C. Kantian Noumena**
  *   **The Concept:** Things-in-themselves that exist independently of our perception but are fundamentally unknowable.
  *   **Why it fits:** This is the historical ancestor of your shape. Kant argues we can think the noumenon but not know it.
  *   **Why it falls short:** Kant was generally skeptical about claiming *knowledge* of noumena. The Epistemicist is bolder: they claim we can know *that* there is a boundary, and know *why* we can't locate it. It is a "positive" claim about a "negative" limitation.

  ### 2. The Carving: Explanatory Idleness vs. Explanatory Leverage

  The edge you are sensing—the difference between the "legitimate" physics cases and the "suspicious" metaphysics cases—is **Explanatory Leverage**.

  A theory that posits an unreachable fact is legitimate if that fact **does work** in the theory. It is illegitimate if it is **ontologically idle**.

  *   **Legitimate (Physics):** We posit particles we cannot see (quarks) or times we cannot visit (the Big Bang). We accept these because they exert **causal or structural influence** on the things we *can* see. The unobservable fact changes the probability distribution of observable events. If the quark didn't exist, the detector would click differently.
  *   **Illegitimate (Baldness/Spheres):** The precise cutoff for baldness exerts **no causal influence** on anything. If the cutoff were at 5,000 hairs instead of 5,001, no speaker's behavior, no brain scan, and no linguistic usage would change. The fact is "inert." It floats above the world without touching it.

  The distinctive shape you found is a theory that posits **Constitutively Unknowable Facts**. But the critique of that shape relies on **Explanatory Idleness**.

  ### 3. Coining the Term: **Theoretically Insulated Realism**

  Since no existing term captures the "derived untestability" without the negative connotation of "dogmatism," let's define this structure as **Theoretically Insulated Realism**.

  **Definition:** A realist theory is *Theoretically Insulated* when it posits the existence of a fact $F$, and includes as a theorem of the theory that no evidence $E$ can probabilify $F$ over $\neg F$, *and* defends this insulation as a necessary feature of reality rather than an epistemic limitation.

  **The Boundary Condition (The Carving):**
  A Theoretically Insulated Realist claim is **Virtuous** if $F$ provides the *best explanation* for why the evidence looks the way it does, even if $F$ itself is hidden.
  A Theoretically Insulated Realist claim is **Vicious** if $F$ is **Explanatorily Idle**—meaning the rival theory (which denies $F$) explains the evidence just as well without positing $F$.

  ### 4. Addressing Your Specific Questions

  **Q: Physics seems full of claims nobody can check... why are those different?**
  **A:** Because of **Counterfactual Dependence**.
  In physics, if the unobservable fact were different, the observable world would be different. If the mass of the prehistoric asteroid were half as much, the crater would be smaller. The fact is unreachable *in practice* (we can't go back in time), but not *in principle* regarding its effects.
  In the baldness case, if the cutoff were different, the observable world (usage, assent, brain states) would be *identical*. The fact is unreachable *in principle* because it has no footprint.

  **Q: Does it matter that the unreachable part is the *only* difference between the two rivals?**
  **A:** Yes, critically. This is the condition of **Empirical Equivalence**.
  If the unreachable fact were just one detail among many testable ones, we could use the testable ones to build confidence in the theory as a whole (Inference to the Best Explanation). We could say, "This theory got 1,000 predictions right, so we trust its 1,001st prediction even if we can't check it."
  When the unreachable fact is the *only* difference, you cannot build that bridge. You are forced to choose based purely on metaphysical preference (e.g., a preference for Classical Logic/Bivalence vs. a preference for Verificationism). This makes the theory much more vulnerable to **Occam's Razor**. If two theories explain everything equally, but one posits a mysterious, unknowable fact and the other doesn't, the latter is usually preferred.

  **Q: Does anything change if the unreachability iterates? (Higher-Order Vagueness)**
  **A:** It deepens the "Vicious" classification but doesn't change the structure.
  Williamson (the Epistemicist) accepts this iteration. He argues there is a sharp boundary between "bald" and "not bald," and a sharp boundary between "definitely bald" and "not definitely bald."
  If a theory admits that *even our ignorance has a sharp boundary we can't locate*, it reinforces the idea that the theory is describing a **metaphysical structure** rather than an **epistemic landscape**. For critics, this looks like multiplying mysteries. For defenders, it looks like consistency. It doesn't solve the problem of Explanatory Idleness; it just makes the idle machinery more complex.

  ### 5. Boundary Cases

  To test this carving, we need a case that looks like **Theoretically Insulated Realism** but belongs on the other side of the line.

  **The "Looks Like It Belongs But Doesn't" Case: Bohmian Mechanics (Pilot Wave Theory)**
  *   **The Setup:** In quantum physics, standard Copenhagen interpretation says particles don't have definite positions until measured. Bohmian Mechanics says they *do* have definite positions (like the baldness line), but the theory is constructed such that you can never measure them without disturbing the system (like the baldness margin for error).
  *   **Why it looks like the Baldness Case:** It posits a fact (particle position) that is fundamentally hidden. It is empirically equivalent to standard Quantum Mechanics.
  *   **Why it might be Legitimate (The Edge):** Proponents argue it removes "wavefunction collapse," providing a smoother *explanation* of the dynamics, even if the positions are hidden.
  *   **Why it might be Vicious (The Verdict):** Critics argue it is **Explanatorily Idle**. If it predicts exactly the same outcomes as standard QM, but adds hidden variables that do no work, it is "ontological surplus." This is the exact same debate as the baldness cutoff. It sits right on the boundary.

  **The "Legitimate" Case: The Event Horizon of a Black Hole**
  *   **The Setup:** We cannot see past the event horizon. Information from inside cannot reach us.
  *   **Why it looks like the Baldness Case:** It is a sharp boundary that is permanently unreachable to an outside observer.
  *   **Why it is Legitimate:** The existence of the horizon has massive **causal effects** on the outside universe (gravitational lensing, accretion disks, orbital mechanics). The "unreachable fact" (what's inside) explains the "reachable facts" (how stars move outside). It has Explanatory Leverage.

  ### Summary

  You have identified **Theoretically Insulated Realism**.
  *   **The Structure:** A theory that derives its own evidential opacity as a theorem.
  *   **The Test:** Is the opaque fact **Explanatorily Idle**?
  *   **The Verdict:** If the fact does no work (Baldness, Two Spheres), it is metaphysically suspect (Vicious). If the fact structures the observable world (Black Holes, Prehistoric Events), it is scientifically robust (Virtuous).

  The reason the baldness argument nags at you is that it asks you to accept a **metaphysical difference without a functional difference**. In science, we usually only accept the former if it buys us the latter. Epistemicism asks for the former on the grounds of logical purity (preserving Bivalence) alone. Whether that trade is worth it is the central debate of your reading.
