      *   *Pricing (2):* Keeping (2) means acknowledging money is a measure, not a commodity. The cost is restricting lending to models where the lender shares risk (equity/partnership) rather than charging rent on consumption. For a credit union, this might mean profit-sharing loans or stricter justification that interest covers administrative cost/risk, not "money breeding."

