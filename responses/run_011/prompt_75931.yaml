answer: |-
  Your reading is perceptive, and your doubt regarding the neutrality of the Definitions is well-founded. The standard pedagogical approach often treats the Definitions as mere glossary entries and the Scholium as the first site of philosophical argument. However, the text itself does not support a clean separation between the technical and the metaphysical in this way. The Definitions establish the dynamical concepts that make the metaphysical claims of the Scholium intelligible.

  Here is an analysis of your three questions, keeping strictly to the textual logic and indicating where interpretive consensus ends and debate begins.

  ### 1. The "Endeavour" in the Sling Passage: Name or Striving?

  In the explication of Definition V, Newton describes the stone's "endeavour to recede" (*conatus recedendi*). Textually, this is not presented merely as a name for the tension, but as the **dynamical cause** of the tension. Newton writes that *by* that endeavour, the sling is distended. The tension is the measurable effect; the endeavour is the physical propensity of the body to persist in its rectilinear path (as per Definition III, *vis insita*) against the constraint of the cord.

  **Does this require a standard of non-acceleration independent of other bodies?**
  Textually, yes, but with a caveat. For the "endeavour to recede" to have a determinate magnitude (which varies with velocity), there must be a fact of the matter about the stone's deviation from a straight line. If "straight line" were defined only relative to the hand or the sling, the stone is not moving in a straight line at all; it is circling. For Newton to claim the stone *endeavours* to go straight (and thus pulls on the sling), he must presuppose a standard of rectilinearity that the stone is failing to meet.

  **Interpretive Status:**
  It is settled that Newton treats this as a real striving (a causal power inherent in the body's state of motion). It is **contested** whether this *logically entails* substantivalism (absolute space) or merely a privileged class of reference frames.
  *   **The Substantivalist Reading:** The "straight line" the stone endeavours to follow is defined by absolute space. The force is real because the acceleration is absolute.
  *   **The Relationist Reading:** The "straight line" is defined relative to the fixed stars or the bulk of matter in the universe. The tension is real, but it measures rotation relative to the cosmic frame, not an invisible container.

  The text of Definition V itself does not explicitly rule out the relationist option *here*; it simply asserts the existence of the force and its dependence on velocity. However, it sets the trap: if the velocity is "true" velocity (as the Scholium will argue), then the space must be absolute. If the velocity is merely relative to the hand, the physics breaks (since the stone is stationary relative to the hand in the radial dimension). Thus, the passage presupposes a standard of motion that is not exhausted by the immediate vicinity of the stone.

  ### 2. Your Hypothesis: Are the Definitions Metaphysically Loaded?

  Your hypothesis is that the Definitions are not neutral because the tension varies with the stone's "true rotation," which is not fixed by surrounding bodies.

  **Assessment:**
  You are **correct** that the Definitions are not metaphysically neutral, but you must distinguish between *presupposing* absolute space and *requiring* a distinction between true and relative motion.

  *   **Where you are right:** Definition V states the centripetal force retains the stone in its orbit "because it is directed to the hand as the centre." If the magnitude of this force depends on the velocity "as it is revolved," and if that velocity is not the velocity relative to the hand (which is zero in the radial direction and constant in the tangential relative to the hand's frame), then Newton is already invoking a kinematic standard that transcends the immediate relational frame. He is treating the rotation as a fact about the stone's state, not just its position relative to the hand.
  *   **Where caution is needed:** You ask if you are reading the Scholium backwards into the text. In a strict logical sense, the Definitions define the *quantities* (force, mass, motion) that will be used to *prove* the nature of space in the Scholium. One could argue the Definitions are "operational" (telling us how to measure force) while the Scholium is "ontological" (telling us what space is). However, your insight holds because the operational definitions *only work* if the ontological distinction is already assumed. You cannot measure the "true" velocity required for the formula in Definition V without already assuming there is a difference between true and apparent motion.

  **Verdict:** Your hypothesis rests on a strong textual reading, not a conflation. The Definitions encode the *dynamical criteria* for absolute motion (i.e., motion that generates forces). They do not explicitly argue for absolute space (that is the Scholium's job), but they are not neutral because they define motion in terms of causes (forces) that Newton believes cannot be reduced to mere changes of vicinity. Interpreters disagree on whether this makes the Definitions "circular" (assuming absolute space to define force, then using force to prove absolute space) or "foundational" (establishing dynamics as the primary reality, from which the nature of space is inferred).

  ### 3. True Rest, Observability, and Relationist Accommodation

  The closing sentence of the explication of Definition III states: *"nor are those bodies always truly at rest, which commonly are taken to be so."*

  **Does this commit Newton to unobservable true rest?**
  Yes, textually. Newton distinguishes between "commonly conceived" (relative) rest and "truly" rest. Since he admits that bodies taken to be at rest (e.g., the Earth, or a room) are not *truly* at rest, he is committed to a state of affairs that is not immediately evident to the senses. However, Newton does not concede this state is *in principle* unobservable. He argues in the Scholium that it is observable *indirectly* through its effects (forces). So, it is unobservable by simple inspection of position, but observable by dynamical testing.

  **Can a relationist accept these passages?**
  This is the core of the historical and philosophical dispute.
  *   **Yes, a relationist can accept the dynamical facts:** A relationist can agree that the stone pulls on the sling and that this pull varies with speed. They can agree that "true rest" is a useful label for "rest relative to the center of mass of the solar system" or "rest relative to the fixed stars."
  *   **No, a relationist cannot accept Newton's *implication*:** Newton uses these passages to build a case that "true" motion is a intrinsic property of the body's relation to space itself, not just to other matter. Definition III defines *vis insita* as proportional to the body, exercised only in a change of state. If "state" is purely relative, *vis insita* becomes a relation between bodies. Newton treats it as a property of the body *in* space.

  **How much substantivalism is licensed here vs. the Scholium?**
  *   **In the Definitions:** The text licenses the **distinction** between true and relative motion/rest. It establishes that forces (like the tension in the sling or resistance in *vis insita*) are the markers of true motion. It does not yet explicitly describe the *nature* of the container (Absolute Space) in which this motion occurs.
  *   **In the Scholium:** The text explicitly posits **Absolute Space** as the entity that grounds the distinction made in the Definitions. The Scholium argues that because the forces described in the Definitions exist (e.g., the water rising in the bucket, the tension in the sling), and because these forces do not correlate with motion relative to surrounding bodies, there must be an absolute frame of reference.

  **Candour on Interpretive Status:**
  It is a matter of genuine disagreement whether the Definitions *alone* constitute a substantivalist argument.
  *   **One school** argues the Definitions are merely nominal definitions of terms to be used in the axioms (Laws of Motion), and the metaphysics is entirely contained in the Scholium. On this reading, you are projecting the Scholium's conclusion onto the Definitions.
  *   **The opposing school** (which aligns with your hypothesis) argues that the Definitions are already substantive physical claims. By defining "innate force" and "centripetal force" in terms of deviations from true rectilinear motion, Newton has already smuggled in the ontology. The Scholium merely makes explicit what is implicit in the dynamical concepts.

  **Conclusion on Question 3:**
  Definition III commits Newton to a fact of the matter about "true rest" that is distinct from "relative rest." It does not, in isolation, fully articulate the ontology of Absolute Space, but it denies the relationist reduction of motion to change of vicinity. A relationist can accept the *phenomena* described (tension, resistance) but must reject Newton's claim that these phenomena prove the existence of "true" motion independent of all material relations. Newton claims the phenomena *entail* the ontology; the relationist claims the phenomena can be grounded differently. The Definitions state the entailment; the Scholium argues for it.

  ### Summary

  1.  **Endeavour:** It is a real striving (cause of tension), not just a name. It implies a standard of rectilinearity that is not defined by the immediate surroundings, leaning toward substantivalism, though a relationist could attempt to ground that standard in distant matter.
  2.  **Hypothesis:** You are correct that the Definitions are not neutral. They encode the dynamical criteria for absolute motion. You are not reading backwards, but identifying the dynamical commitments that necessitate the Scholium's metaphysics.
  3.  **True Rest:** The text commits Newton to "true rest" as physically distinct from "apparent rest." The Definitions establish the *criteria* (forces) for this distinction; the Scholium establishes the *ontological ground* (Absolute Space). A relationist can accept the criteria while denying the ground, but Newton presents them as inseparable.
