      *   *Section 2 (The Hypothesis):* Validate the hypothesis but nuance it. The Definitions set the *criteria* (forces) for true motion. They don't fully argue for the *nature* of space. You aren't reading backwards, but you are seeing the *function* of the Definitions which is completed by the Scholium. The "velocity" in Def V is ambiguous without the Scholium's clarification of "true" vs. "apparent."
      *   *Section 3 (True Rest/Relationism):* Def III explicitly asserts "true rest." This is anti-relationist regarding the *definition* of motion. However, a relationist can accept the *phenomena* (forces) without the *ontology* (absolute space). Newton thinks the phenomena *entail* the ontology. The Scholium makes that entailment explicit. The Definitions lay the groundwork by distinguishing the concepts.
      *   *Conclusion:* Summarize the status. The Definitions are dynamical commitments that *lead to* substantivalism, but the full metaphysical argument is in the Scholium.

  8.  **Final Review against Constraints:**
