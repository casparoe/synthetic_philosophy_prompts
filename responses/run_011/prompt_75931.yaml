      *   *Verdict:* Definition III commits Newton to "true motion/rest" as a physical reality distinct from relative appearance. It does not, in isolation, fully articulate the ontology of Absolute Space (that comes in the Scholium), but it denies the relationist reduction of motion *just* to change of vicinity.

  6.  **Synthesize and Refine (Self-Correction/Constraint Check):**
