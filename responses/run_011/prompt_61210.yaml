  **Mechanism:** The divergence arises from the security and conditionality of the entitlements rather than their market value or subjective yield.

  **Scenario**
  Elias and Jonah, colleagues with equal income, occupy identical municipal housing units at identical subsidized rent. Elias holds a statutory lifetime tenancy inherited from a parent; Jonah holds a standard renewable five-year lease, consistently renewed under current policy. Both report equal satisfaction with their homes and neighborhood. Jonah values the easier relocation process his lease affords should he find work elsewhere; Elias values the stability. Neither faces eviction risk under present conditions. Elias may modify his unit's interior without permission; Jonah requires written consent for structural changes, granted routinely but discretely. Institutions function normally; no legal repression exists. The market value of their tenure rights is assessed as equal by independent auditors. Both possess equal access to legal counsel. The administrative burden for Jonah's renewal is negligible. They live in a stable democracy with normal property laws.

  **Analysis**

  The case generates the required verdicts by isolating the *structure* of entitlement from its *value*. The welfarist egalitarian finds no inequality because both agents report equal informed well-being. Jonah is not anxious; he values the exit option inherent in his lease. Since welfarism measures informed preference satisfaction, and both agents prefer their own bundle to the other's (or are indifferent), there is no deficit to correct. The resourcist finds the envy test passes because the bundles are of equal market value and tailored to preference. Jonah would not swap for Elias's lifetime tenure because he loses flexibility; Elias would not swap because he loses security. Since neither envies the other's resource bundle, and the inequality stems from optional contract types within a fair market, no compensation is owed. The capability theorist, however, identifies a remediable inequality. Elias possesses the secure capability to plan long-term domestic functionings (e.g., installing permanent ramps, planting trees) without seeking permission. Jonah's capability to achieve these same functionings is contingent on administrative discretion. For Sen, freedom is not just the achievement of a functioning but the real opportunity to achieve it; Jonah's opportunity is revocable, making his freedom less robust even if currently unexercised.

  The feature doing the work is the **conditionality of the holding**. Applying the subtraction test: if we remove the conditionality (granting both lifetime tenure), the capability inequality vanishes, and all three theorists agree justice is satisfied. If we remove the flexibility preference (forcing Jonah to value stability), the welfarist might detect inequality (Jonah becomes unhappy), collapsing the case into a standard preference-adaptation problem. The current design avoids this by keeping both agents satisfied.

  The resourcist's best attack is that security is itself a resource. If Jonah lacks secure tenure, he holds fewer resources, regardless of his choice. Dworkin argues that brute luck inequalities (like market structures limiting tenure types) should be insured against. However, this attack fails here because the scenario stipulates equal market value and voluntary choice between contract types. The resourcist must respect the agent's valuation of the bundle; if Jonah values flexibility over security, the resource bundle is equal *to him*. The welfarist's attack is that the capability theorist overrides the agents' own informed judgments. If Jonah judges his life to be equally good, correcting his tenure imposes an external metric of the good. This attack succeeds against perfectionist capability accounts but fails against Sen's opportunity-focused view, which distinguishes between *being* free and *feeling* free.

  A refinement concerns the **expected welfarist**, who measures opportunity for well-being rather than realized states. They might argue Jonah faces a risk (however small) of non-renewal, lowering his expected well-being. The verdict pattern survives only if the risk is objectively negligible (as stipulated by "consistently renewed" and "stable democracy"). If the risk is significant, the welfarist would detect an inequality, collapsing the case into a standard risk-compensation scenario. Therefore, the design relies on the risk being structurally present but probabilistically null.

  Finally, regarding **Sen versus Republicanism**: Sen's notion of capability as "real opportunity" is sufficient to register the difference only if "opportunity" includes durability. If capability is merely the momentary absence of constraints, Jonah is equal to Elias. To find a "serious" inequality, the capability theorist must argue that an opportunity subject to arbitrary revocation is not a *real* freedom. This aligns closely with Pettit's republican freedom as non-domination. Sen's framework implies this robustness condition but does not explicitly center domination. To secure the verdict without borrowing from republicanism, the capability theorist must emphasize that the *process* of seeking consent itself diminishes the agency involved in the functioning, not just the risk of denial. Without this refinement, the capability verdict risks appearing paternalistic, suggesting the theorist must indeed borrow the republican emphasis on status and security to fully justify the inequality as unjust rather than merely different.
