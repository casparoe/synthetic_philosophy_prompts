  - Metacontrast masking where subjects report the target as a smeared fragment and orientation priming survives anyway: Orwellian.
  - Attentional blink, T2 missed outright, no priming, forced-choice at chance: Stalinesque.
  - Flash-lag: "mis-posed -- that's a when question and the distinction only bites on what questions."

  Friday she has to rule on the new one. We ran a color-phi variant with a short SOA (~60 ms), so timing-wise the second dots information arrives early enough that the whole mid-path color change could plausibly have been composed before it went anywhere reportable. But we also added an implicit probe -- orientation discrimination on the first dot after the trial -- and it's reliably above chance, so the first dot's features were definitely encoded and retained. Both stories still predict the identical free report and the identical probe performance.

