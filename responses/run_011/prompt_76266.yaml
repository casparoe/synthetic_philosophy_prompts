prompt: |-
  So, I sit on a small environmental review board — eleven of us, mostly part-time, one lawyer, one ecologist, zero philosophers — and next quarter we have to rule on something that has completely wrecked my sleep. A company wants to release gene-drive modified mosquitoes across an island group to knock out a locally transmitted disease that kills a couple dozen people a year and puts a few thousand in the hospital. Their models say the drive stays on the target islands. Two ecologists who read the filing say the models can't rule out spread across the whole species range, with knock-on effects nobody has quantified, and that once it's out you don't get to call it back. The company points out that a no vote is also a decision with a body count attached. As far as I can tell both sides are being honest, and the numbers they hand us for the bad case aren't just imprecise, they're not even in the same units — one side is talking about expected annual deaths, the other about a one-in-nothing chance of an ecosystem rearranging. Our enabling statute says we must act precautionarily and doesn't define the word.

  Before I read another position paper I want to know what I should even be demanding of a formulation. Write me the desiderata: the full spec of what any adequate version of the principle has to deliver — which cases it must get right, which distinctions it must not collapse (serious vs irreversible vs merely bad; uncertainty vs ignorance vs experts disagreeing about what the possible outcomes even are; a precaution that is itself a risk), which results or structural facts it can't contradict, and what it owes us on burden of proof and on thresholds of harm. For each requirement give the case or consideration behind it, and lean on cases like ours where you can, plus the usual torture cases: the ban that causes the famine, the precaution that manufactures the new hazard, the one-shot commitment vs the decision you get to revisit in five years with better data, the cost falling on people who never get the benefit. Be explicit about which requirements are non-negotiable for anything that deserves the name and which are really one camp's preferences wearing a criteria costume — in particular I want a ruling on whether "must be statable without ever mentioning a probability" is a genuine desideratum or a tribal badge. Then tell me whether some subset of the list is jointly unsatisfiable. My hunch is that never-paralyzes, plus shift-the-burden-onto-the-proponent, plus take-unknown-unknowns-seriously can't all be had at once, and if you think I'm wrong I want the version that gets all three. Last, name the single requirement that does the most work knocking out candidates.

  Two constraints. Purpose: I need something eleven part-timers can apply in a three hour public meeting and write reasons for that would surive a court looking over our shoulder, so administrability and public statability are requirements in their own right here, not afterthoughts — a principle whose output can only be expressed as a footnote to a model is disqualified for my use even if it's philosophically lovely. And no citations, no reading lists, no as-and-so-argued: I can't look anything up and I'd rather have nothing than a guessed-at attribution. Describe families of approach instead (the lexical-dominance ones, the procedural burden-shifting ones, the only-require-precautions-you'd-want-anyway ones, the expected-value-with-fat-tails ones) and spend a couple of sentences each on how they do against your list. Keep that part short — the list is what I actually want.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Member of an 11-person environmental review board (part-time, mixed expertise, no philosophers).
      *   **Problem:** Ruling on gene-drive mosquitoes. High stakes (human lives vs. ecological uncertainty/irreversibility). Statute mandates "precautionary principle" but doesn't define it.
      *   **Task:** Write the *desiderata* (specifications) for an adequate formulation of the precautionary principle.
      *   **Specific Requirements:**
          *   List cases it must get right (famine/ban, precaution-as-hazard, one-shot vs. revisitable, cost/benefit distribution).
          *   Dinctions it must not collapse (serious vs. irreversible, uncertainty types, precaution-as-risk).
          *   Structural facts it can't contradict.
          *   Burden of proof and harm thresholds.
          *   Explicitly label non-negotiable vs. preference/tribal.
          *   Address the "no probability" constraint (genuine desideratum or tribal badge?).
          *   Address the "Joint Unsatisfiability" hunch (never-paralyzes + shift-burden + unknown-unknowns).
          *   Identify the single most effective requirement for knocking out bad candidates.
          *   **Constraint 1 (Administrability):** Must be usable by 11 part-timers in 3 hours, defensible in court. No footnotes-to-models.
          *   **Constraint 2 (No Citations):** No reading lists, no "as X argued." Describe families of approaches instead.
          *   **Tone:** Practical, rigorous, direct, respectful of the gravity of the decision.

  2.  **Deconstruct the Precautionary Principle (PP):**

      *   The core tension is between *action* (preventing known harm, e.g., disease) and *restraint* (preventing unknown/potential harm, e.g., ecological collapse).
      *   The user's specific dilemma: Quantifiable human death (disease) vs. Unquantifiable ecological risk (gene drive spread).
      *   The "Strong" PP often leads to paralysis (ban everything risky).
      *   The "Weak" PP often leads to rubber-stamping (act unless proven harmful).
      *   The goal is a *decision procedure*, not just a philosophical stance.

  3.  **Drafting the Desiderata (The Spec):**

      *   *Requirement 1: Action-Guidance (Non-Paralysis).* It must yield a decision. "Be careful" isn't a ruling.
      *   *Requirement 2: Symmetry of Risk.* It must treat the risk of *acting* and the risk of *not acting* with the same seriousness. (Crucial for the mosquito case: banning also kills).
      *   *Requirement 3: Irreversibility Sensitivity.* It must distinguish between reversible mistakes and one-way doors. (Gene drive is likely irreversible).
      *   *Requirement 4: Uncertainty Taxonomy.* It must distinguish between risk (known probs), uncertainty (unknown probs), and ignorance (unknown outcomes).
      *   *Requirement 5: Burden of Proof Allocation.* Who has to prove what? Proponent of change usually bears the burden, but not an impossible one.
      *   *Requirement 6: Proportionality.* The strictness of precaution must match the severity/plausibility of the threat.
      *   *Requirement 7: Distributive Justice.* Who bears the cost vs. who gets the benefit? (Islanders get health, global ecosystem gets risk).
      *   *Requirement 8: Administrability.* Can 11 laypeople use this in 3 hours?

  4.  **Addressing Specific Prompts:**

      *   *Probability:* Is "no probability" a requirement? No, it's a tribal badge. You can't make decisions without implicit or explicit likelihood assessments. The requirement should be "robust to imprecise probability," not "ban probability."
      *   *Joint Unsatisfiability:* The user suspects "Never Paralyzes" + "Shift Burden" + "Take Unknowns Seriously" are incompatible.
          *   *Analysis:* If you take unknowns *very* seriously (Strong PP), you shift the burden so high it paralyzes. If you want to never paralyze, you must lower the burden or ignore some unknowns.
          *   *Resolution:* They *are* jointly unsatisfiable in their absolute forms. The solution is a *procedural* compromise (e.g., adaptive management, monitoring) rather than a static binary rule. I need to be honest about this trade-off.
      *   *Single Knockout Requirement:* Which one kills the most bad theories? Likely "Symmetry of Risk" (treating inaction as a decision with consequences). Most PP formulations ignore the risk of *not* acting.

  5.  **Evaluating Families of Approaches:**

      *   *Lexical-Dominance (Safe Minimum Standards):* Good for irreversibility, bad for trade-offs (paralysis).
      *   *Procedural/Burden-Shifting:* Good for administrability, but can be gamed.
      *   *Expected Value with Fat Tails:* Mathematically sound, fails administrability (part-timers can't calculate fat tails).
      *   *Proportionality/Reasonableness:* Best for court defense, but vague.

  6.  **Refining for Administrability (The 3-Hour Test):**

      *   The output needs to be a checklist or a set of questions the board can answer "Yes/No/Uncertain" to.
      *   Court defensibility means showing *reasoned consideration*, not necessarily perfect science.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the gravity.
      *   *The Desiderata List:* Group them logically (Decision Quality, Risk Handling, Fairness, Process).
      *   *Non-Negotiable vs. Preference:* Be sharp here.
      *   *The Probability Question:* Crush the "no probability" myth.
      *   *The Trilemma:* Address the unsatisfiability hunch directly.
      *   *The Knockout:* Identify Symmetry.
      *   *Families of Approach:* Briefly assess them against the spec.

  8.  **Self-Correction/Review against Constraints:**

      *   *No Citations:* Check. (No mentioning Rawls, Sunstein, etc.)
      *   *Administrability:* Ensure the desiderata aren't too abstract.
      *   *Tone:* Keep it professional, not academic.
      *   *Mosquito Case:* Keep referencing it to ground the theory.

  9.  **Final Polish:**

      *   Make sure the distinction between "uncertainty" and "ignorance" is clear.
      *   Ensure the "Symmetry" point lands hard, as it's the key to the user's specific dilemma (disease death vs. ecological risk).
      *   Clarify the "Joint Unsatisfiability" — don't promise a magic bullet if one doesn't exist, but offer the *least bad* compromise (Adaptive Management).

  10. **Final Output Structure:**
      *   Introduction (Acknowledging the bind).
      *   The Desiderata (Categorized).
      *   Non-Negotiable vs. Preference (Including the Probability ruling).
      *   The Trilemma (Unsatisfiability analysis).
      *   The Single Knockout Requirement.
      *   Assessment of Approach Families.
      *   Closing advice for the meeting.

  *(Self-Correction during drafting)*: I initially thought about suggesting "Adaptive Management" as the solution. But the prompt asks for desiderata for the *principle*, not necessarily the mitigation strategy. However, the principle must *allow* for adaptive management to solve the paralysis issue. I will frame the desiderata to require the principle to accommodate monitoring/reversibility where possible.

  *(Refining the Probability point)*: The user asks if "must be statable without ever mentioning a probability" is a genuine desideratum. It is definitely not. It's a hallmark of the "Strong Precautionary Principle" crowd who want to avoid cost-benefit analysis. I need to be firm: you cannot decide without weighing likelihoods, even if qualitative.

  *(Refining the Trilemma)*: The user thinks "Never Paralyzes + Shift Burden + Unknowns Seriously" is impossible. They are right. I need to confirm this but explain *how* to relax one slightly to make it work (usually relaxing "Shift Burden" from "Prove Safe" to "Demonstrate Reasonable Care + Monitor").

  *(Final check on Administrability)*: The desiderata must be things the board can *check*. "Does the formulation force us to count the deaths from inaction?" is a check. "Does it require a p-value?" is a check.

