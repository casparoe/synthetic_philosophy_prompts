prompt: |-
  I run a Thursday lunch-and-learn at my company — mostly backend engineers, no econ or philosophy background, me included (I only know this stuff from hacking on the game tree in python over a weekend). Next week it's 30 minutes at a whiteboard on backward induction and the centipede game, and what I want from you is the plan for the explanation, not the explanation.

  Two complications you should build around. One: I already ran a toy version on my team, 6 nodes, playing for coffee credits, and basically nobody took at node 1 — most games died around node 4 or 5, two ran to the end. I want to use my own numbers, so I need to know where in the sequence they land and what I'm actually entitled to claim from them. Two: I'm pretty sure the room's first reflex will be to patten-match this to minimax — these people write alpha-beta for fun — and I think that reflex is exactly wrong here, but I can't articelate why, so that one needs a designated spot in the talk rather than a shrug.

  So give me: what has to be true in their heads before the paradox is even statable, and what depends on what — I genuinely can't tell whether common knowledge of rationality has to come before the recursion, after it, or not at all; the one tree that should carry the whole thing, and what it needs and what would break it; the misconceptions in the order they'll actually show up (I'm expecting "the experiments just prove people are irrational", "backward induction assumes everyone's a selfish jerk", and "this is the prisoner's dilemma with extra steps") and the exact beat where each gets headed off; one question I can ask at the end that would tell me it landed instead of polite nodding; and what I should openly refuse to get into at this level.
reasoning: |-
  Here's a thinking process that leads to the suggested plan:

  1.  **Analyze the Request:**
      *   **Audience:** Backend engineers (no econ/philosophy background, comfortable with algorithms/recursion/game trees).
      *   **Speaker:** Runs the session, learned via Python hacking, not formal training.
      *   **Topic:** Backward Induction (BI) and the Centipede Game.
      *   **Format:** 30 minutes, whiteboard.
      *   **Goal:** A *plan* for the explanation, not the explanation itself.
      *   **Constraint 1 (Empirical Data):** The speaker already ran a 6-node experiment. Nobody took at Node 1. Most died at 4 or 5. Two went to the end. The plan must incorporate *these specific results* and help the speaker interpret/claim them.
      *   **Constraint 2 (The Minimax Reflex):** Engineers will try to map this to Minimax/Alpha-Beta. The speaker suspects this is wrong but needs to articulate *why* and where to address it in the flow.
      *   **Deliverables:**
          *   Prerequisites (what must be in their heads).
          *   Dependency chain (Common Knowledge of Rationality vs. Recursion).
          *   The One Tree (structure and failure modes).
          *   Misconception Management (order of appearance + deflection strategy).
          *   The "Did it land?" Question.
          *   Scope Boundaries (what to explicitly avoid).

  2.  **Deconstruct the Core Concepts:**
      *   **Centipede Game:** Sequential, perfect information, alternating turns, payoffs increase as you pass, but taking ends the game with a slightly better payoff for the taker than if they passed and the other took next.
      *   **Backward Induction:** Solving from the end. If rational at $N$, take. If rational at $N-1$, know $N$ takes, so take at $N-1$. Unravels to Node 1.
      *   **The Paradox:** BI says take at Node 1. Humans (and the speaker's team) usually pass.
      *   **Minimax vs. BI:** Minimax is for zero-sum (my gain = your loss). Centipede is non-zero-sum (cooperation yields more total utility, but individual incentive is to defect). This is the crucial distinction.
      *   **Common Knowledge of Rationality (CKR):** This is the engine of BI. I know you're rational. You know I know. I know you know I know... If this breaks, BI breaks.

  3.  **Address Constraint 1 (The Experiment Results):**
      *   *Observation:* Nobody took at Node 1. Most at 4/5. Two at end.
      *   *Interpretation:* This is classic Centipede behavior. It contradicts the Nash Equilibrium (NE) derived via BI.
      *   *Claim:* The speaker can claim that the *theory* predicts Node 1, but the *model assumptions* (specifically CKR) failed in the room. It doesn't mean engineers are "irrational" in a general sense, it means the specific definition of rationality required for BI wasn't common knowledge.
      *   *Integration:* Use the actual data to show the "unraveling" didn't happen.

  4.  **Address Constraint 2 (The Minimax Reflex):**
      *   *Why it's wrong:* Minimax optimizes for worst-case scenario in *adversarial* (zero-sum) settings. Centipede looks adversarial (you take from me), but it's actually a trust game. If I treat you as an adversary minimizing my payoff, I take early. If I treat you as a potential co-operator maximizing joint payoff, I pass.
      *   *Wait, actually:* BI *looks* like Minimax on a tree. You propagate values up.
      *   *The Nuance:* In Minimax, Player A maximizes, Player B minimizes (A's payoff). In Centipede, Player A maximizes A, Player B maximizes B. They are *both* maximizing, just different variables.
      *   *The Trap:* Engineers think "Opponent = Enemy = Minimize My Score." In Centipede, "Opponent = Rational Agent = Maximize Their Score."
      *   *Placement:* Address this early, right after defining the tree structure, before doing the induction.

  5.  **Drafting the Plan - Section by Section:**

      *   **Prerequisites:** They need to understand Payoff Vectors $(A, B)$, not single scores. They need to understand "Rationality" as "Maximizing Expected Utility" (greedy local optimization), not "Being Smart."
      *   **Dependencies:** CKR is the *fuel*, Recursion is the *engine*. You can't run the engine without the fuel. CKR must be established *before* the recursion starts, otherwise the base case doesn't propagate.
      *   **The One Tree:** Needs 6 nodes (to match their experiment). Payoffs must be visible. Needs to show the "Take" vs "Pass" branches clearly.
      *   **Misconceptions:**
          1.  "Minimax" (Address early).
          2.  "People are irrational" (Address after showing the data vs. theory).
          3.  "Selfishness" (Address when discussing why passing happens).
          4.  "Prisoner's Dilemma" (Address at the end as a distinction).
      *   **The "Did it land?" Question:** Needs to test if they understand *why* the induction stopped, not just *that* it stopped.
      *   **Scope Boundaries:** Don't get into Quantal Response Equilibrium, epistemic logic formalisms, or infinite horizons.

  6.  **Refining the "Minimax" Distinction:**
      *   This is the trickiest part. In Minimax, you assume the opponent plays to *hurt you*. In Centipede BI, you assume the opponent plays to *help themselves*. Sometimes helping themselves hurts you, but not always (if they pass, both win more).
      *   *Correction:* In Centipede, if I pass, I rely on *you* passing later. If you are rational (selfish), you will take later. So I should take now.
      *   *The Engineer Brain:* "I'll assume the opponent plays the move that minimizes my outcome." -> This leads to Take at 1.
      *   *The BI Logic:* "I assume the opponent plays the move that maximizes *their* outcome." -> This *also* leads to Take at 1 (in the standard payoff structure).
      *   *Wait, are they the same?* In Centipede, the move that maximizes their outcome *does* minimize yours at the final node. But at earlier nodes, passing maximizes *both*.
      *   *Key Distinction:* Minimax assumes *hostility*. BI assumes *self-interest*. In Centipede, self-interest *looks* like hostility at the end, but cooperation is possible in the middle.
      *   *Better angle:* Minimax is for Zero-Sum. Centipede is Non-Zero-Sum. The value propagation is different. In Minimax, value is single scalar. In Centipede, value is a tuple $(P1, P2)$. You can't just `max()` and `min()` a tuple without specifying *whose* max it is.
      *   *Decision:* Place this right after drawing the tree. "Check your data structures."

  7.  **Refining the Experiment Data:**
      *   Node 1 Take = 0%. Node 4/5 Take = High. Node 6 Take = 2 games.
      *   *Claim:* The theory predicts 100% Node 1. Reality was ~0% Node 1.
      *   *Why:* The "Common Knowledge" chain broke. If I think there's a 5% chance you're altruistic, I pass. If you know I think that, you pass.
      *   *Entitlement:* You are entitled to claim that *under the strict assumptions of the model*, the code (BI) is correct, but the *input data* (human rationality) didn't match the spec.

  8.  **Structuring the 30 Minutes:**
      *   0-5: Setup & The Tree (Payoff Vectors).
      *   5-10: The Minimax Trap (Crucial intervention).
      *   10-15: The Backward Induction (The "Correct" Solution).
      *   15-20: The Experiment Reveal (The Conflict).
      *   20-25: Diagnosing the Break (CKR).
      *   25-30: Q&A + The One Question.

  9.  **Developing the "One Question":**
      *   Bad: "Do you understand?"
      *   Bad: "What is the Nash Equilibrium?"
      *   Good: "If I tell you Player 2 is definitely rational, but Player 2 isn't sure if *you* are rational, where does the game end?" (Tests understanding of the *common* in Common Knowledge).

  10. **Review against Constraints:**
      *   *Plan, not explanation:* Check.
      *   *Use specific experiment data:* Check.
      *   *Address Minimax:* Check.
      *   *CKR dependency:* Check.
      *   *Misconceptions:* Check.
      *   *Scope:* Check.

  11. **Final Polish:** Ensure tone is appropriate for engineers (pragmatic, structural, avoiding jargon where possible, using analogies like "stack overflow" or "base cases"). Make sure the distinction between "Rationality" (math def) and "Rationality" (colloquial def) is clear.

  *(Self-Correction during drafting)*: I need to be careful about the Minimax point. Engineers might argue "Minimax with alpha-beta pruning is just optimizing a tree." The distinction is the *evaluation function*. In Minimax, eval is relative to root player. In Centipede, eval switches perspective at every depth. I need to make sure the plan highlights the *switching perspective* vs *fixed perspective*.

  *(Refining the Experiment Claim)*: The speaker asks "what I'm actually entitled to claim." They are entitled to claim that the *model* failed to predict the *system*, not that the *math* is wrong. It's a spec mismatch.

  *(Refining CKR)*: CKR isn't just "everyone is rational." It's "Everyone knows everyone is rational, everyone knows everyone knows..." It's the recursion depth of the *belief*, not just the game tree.

  Let's assemble the plan.cw
answer: |-
  Here is the battle plan for your 30 minutes. It is structured to leverage your audience's mental models (recursion, data structures, specs vs. implementation) while insulating you from the econ/philosophy traps.

  ### 1. The Prerequisites (What must be loaded in memory)
  Before you draw the first node, you need to ensure three concepts are instantiated in their heads. If these are missing, the paradox won't compile.

  *   **Payoff Vectors, not Scalars:** Engineers think in single scores (minimax values). You must enforce that every node holds a tuple `(P1_payoff, P2_payoff)`.
      *   *Why:* If they think in scalars, they assume Zero-Sum (my gain is your loss). Centipede is Non-Zero-Sum (passing increases the total pool).
  *   **"Rationality" as a Function, not a Virtue:** Define "Rational" strictly as `argmax(expected_utility)`. It does not mean "smart," "logical," or "selfish." It means "greedy."
      *   *Why:* If they think "rational" means "seeing the big picture," they will think passing is rational. You need them to accept that taking the money is the "rational" move in the model.
  *   **Perfect Information:** Both players see the whole tree and all past moves.
      *   *Why:* Removes hidden state as an excuse for deviation.

  ### 2. The Dependency Chain (CKR vs. Recursion)
  You asked whether Common Knowledge of Rationality (CKR) comes before or after the recursion.
  *   **The Dependency:** CKR is the **Base Case**. Backward Induction is the **Recursion**.
  *   **The Order:** You must establish CKR *before* you start the induction walk.
  *   **The Logic:** You cannot solve Node $N-1$ unless you are certain how Node $N$ behaves. You are only certain how Node $N$ behaves if you know the player at $N$ is Rational. But you also need to know that the player at $N$ knows *you* are Rational, otherwise they might think you'll punish them later.
  *   **The Analogy:** CKR is the **Type Safety** of the variables. If the types (rationality assumptions) aren't guaranteed across all function calls (nodes), the recursion throws a runtime error (the game doesn't unravel).

  ### 3. The One Tree (Whiteboard Spec)
  Draw a 6-node horizontal line.
  *   **Nodes:** 1 (You), 2 (Them), 3 (You), 4 (Them), 5 (You), 6 (Them).
  *   **Branches:** At each node, `Take` (game ends) or `Pass` (move to next node).
  *   **Payoffs:** Write the `(You, Them)` tuple next to the `Take` branch for every node.
      *   *Crucial:* Ensure the payoffs strictly increase as you go right, but at every node, `Take` gives the current player slightly more than `Pass` would if the *next* player takes immediately.
      *   *Example:* Node 1 Take: (1, 0). Node 2 Take: (0, 2). Node 3 Take: (3, 1)... Node 6 Take: (0, 64).
  *   **Failure Mode:** If the payoff gap between "Take now" and "Pass and they Take next" is too small, the "cost of trust" is low. If it's too big, it looks like a scam. Keep the ratio consistent (e.g., doubling).

  ### 4. The Minimax Reflex (The Intervention)
  **Where:** Immediately after drawing the tree, *before* solving it.
  **The Reflex:** "This is a game tree. I solve it with Alpha-Beta. I assume the opponent minimizes my score."
  **The Correction:**
  *   **Minimax:** Opponent minimizes *your* utility. (Adversarial/Zero-Sum).
  *   **Centipede:** Opponent maximizes *their* utility. (Strategic/Non-Zero-Sum).
  *   **The Code Diff:** In Minimax, you propagate `max` then `min` on the *same* value. In Centipede, you propagate `max(P1)` then `max(P2)` on *different* indices of the tuple.
  *   **The Soundbite:** "In Minimax, the opponent is a bug trying to crash your code. In Centipede, the opponent is a separate process trying to optimize its own CPU usage. Sometimes that aligns with you, sometimes it doesn't. Don't hardcode hostility."

  ### 5. Misconception Management (Order of Operations)
  Engineers will raise these objections. Here is where you preempt them.

  1.  **"This is just Minimax."**
      *   *Beat:* Addressed in Section 4 (Tree Setup).
      *   *Deflection:* "If you code this as Minimax, you get the right answer for the wrong reason. You need to swap the evaluation function at every depth."
  2.  **"The experiments prove people are irrational."**
      *   *Beat:* After you reveal your team's data (Node 4/5 avg vs. Theory Node 1).
      *   *Deflection:* "No. It proves the *spec* didn't match the *implementation*. The math holds if CKR holds. The humans didn't satisfy the CKR constraint. The code is correct; the input data was out of spec."
  3.  **"Backward Induction assumes everyone's a selfish jerk."**
      *   *Beat:* When explaining why the unraveling happens.
      *   *Deflection:* "It assumes everyone is a *predictable optimizer*. If you were altruistic, BI would predict you pass. But if I *know* you're altruistic, I take. The unraveling happens because we can't commit to not taking at the end."
  4.  **"This is the Prisoner's Dilemma with extra steps."**
      *   *Beat:* Q&A / Wrap-up.
      *   *Deflection:* "Prisoner's Dilemma is simultaneous (one shot). Centipede is sequential (iterative). In PD, you can't react. In Centipede, you can punish/reward, which *should* allow cooperation, but BI says it doesn't. That's why the paradox is deeper."

  ### 6. Your Experiment Data (The Claim)
  You asked what you are entitled to claim from your 6-node run (0% Node 1, most Node 4/5, 2x Node 6).

  *   **The Claim:** "Our team's behavior demonstrates that **Common Knowledge of Rationality has a half-life.**"
  *   **The Interpretation:**
      *   The fact that nobody took at Node 1 means nobody believed the CKR chain went all the way to Node 6.
      *   The fact that most took at 4/5 means the CKR chain held for about 2-3 steps of recursion, then broke.
      *   The 2 games that went to the end were likely "noise" or players who explicitly decided to ignore the payoff maximization function (i.e., they changed the utility function to include "winning the game" as a variable).
  *   **Entitlement:** You are entitled to say the **Nash Equilibrium** (Node 1) is a *theoretical bound*, not a *behavioral prediction*. You are entitled to treat BI as a "best case for selfishness" benchmark, against which you measure trust.

  ### 7. The "Did It Land?" Question
  Do not ask "Does this make sense?" (They will lie).
  Do not ask "What is the equilibrium?" (They will Google it).

  **Ask this:**
  > "If I guarantee you that I am perfectly Rational, but I am not sure if *you* are Rational, do I Take at Node 1 or Pass?"

  *   **Correct Answer:** "It depends on the probability, but strictly speaking, if you aren't sure I'm rational, you might Pass to test me." (Or more precisely: The BI unraveling stops immediately if CKR is broken. If I don't know you're rational, I can't predict your move at Node 2, so I can't solve Node 1).
  *   **What you're looking for:** You want them to realize that **my** rationality isn't enough. It requires **my knowledge of your rationality**. If that link breaks, the recursion stack unwinds.

  ### 8. Scope Boundaries (What to Refuse)
  You have 30 minutes. If these come up, park them in the "Parking Lot" (literally draw a box on the board) and move on.

  *   **Quantal Response Equilibrium:** (The econ fix for "people make mistakes").
      *   *Refusal:* "That's a probabilistic model. We're doing deterministic logic today."
  *   **Epistemic Logic Formalisms:** (The $K_i K_j K_i$ notation).
      *   *Refusal:* "We're treating Common Knowledge as a boolean flag, not a modal logic proof."
  *   **Infinite Centipede:** (What if the game never ends?).
      *   *Refusal:* "Stack overflow. We need a base case."
  *   **Altruism/Utility Functions:** (What if I get joy from you winning?).
      *   *Refusal:* "Then change the numbers in the tuple. The algorithm stays the same. We're debugging the algorithm, not the psychology."

  ### Summary of Flow (30 Mins)
  1.  **0-5:** Draw Tree. Define Tuples. **Kill Minimax.**
  2.  **5-10:** Run Backward Induction on the board. Show it crashes to Node 1.
  3.  **10-15:** Reveal your Team's Data. Highlight the conflict (Node 1 vs Node 4/5).
  4.  **15-20:** Diagnose the break. Introduce CKR as the missing dependency.
  5.  **20-25:** Discuss what the data actually means (Trust > Theoretical Max).
  6.  **25-30:** The One Question + Parking Lot.
