answer: |-
  Colleagues, families, friends.

  We gather to mark a century of this Code. For eighty-nine of those years, Article 9 stood at its center. It forbade us from speaking against a fellow member concerning the treatment of a patient without the consent of this association. For decades, we understood this as a vow of silence. We kept it. We voted to remove it last spring. I voted to remove it.

  I stand before you knowing that for many in this room, Article 9 was not a cover-up. It was a promise. It was a shield raised around the brotherhood of the craft. To call that promise immoral is to tell men and women who lived by it that their honor was a lie. I will not do that. Your loyalty was real. But I will not exonerate it either. That loyalty exacted a price paid by patients, and by the families seated in this front row. You are owed more than an apology for a rule; you are owed a change in what we love.

  For thirty years, patient-safety data accumulated without moving us. Arguments from bereaved families invited to this stage changed how we spoke, but not how we voted. What moved the vote was that our largest malpractice insurers began writing premium discounts for institutions with disclosure programs. The council followed the money. I do not say this to sneer. I say it to acknowledge that norms often die not because they are refuted, but because the world around them shifts until they no longer fit. The insurers changed the interests. They made silence expensive and disclosure profitable. But accounting alone cannot sustain a profession. If we report only because auditors watch us, we will find ways to hide when they look away. We need a reason to speak that survives the audit.

  There are two ways a norm changes. One is compliance: we do it because we must. The other is displacement: we do it because our loyalty has found a new object. The Council has chosen compliance. I am here to ask for displacement.

  I ask this as a man who kept the silence for thirty-one years. On two occasions, I knew of a colleague's error. I said nothing. I am often asked if I blame myself. To answer, I must say what I believe about reason and blame. A person has a reason to act only if there is a route from what moves them to the act itself. If the structure of a life blocks that route, if the honor of your tribe forbids the step, then blame cannot reach across that distance. I cannot say I was free to choose otherwise then, because the reason to speak was not available to me within the world I inhabited. But neither can I say I am excused. The harm was done. The silence was kept. I carry the weight of that silence without the comfort of believing I could have easily dropped it. This is not exoneration. It is an acknowledgment that we are bound by our time, even as we are responsible for its costs.

  To the families here: knowing that our silence was born of misplaced loyalty rather than malice does not return what you lost. But it tells you what we must become. We cannot undo the past. We can only change what loyalty looks like tomorrow.

  To my colleagues, especially those who remember Article 9 as a sacred obligation: We are not abandoning loyalty. We are redirecting it. Under the old code, loyalty meant protecting a colleague from scrutiny. Under the new practice, loyalty must mean protecting a colleague from themselves. When we report an error, we are not handing a brother to the wolves. We are intervening before a tremor becomes a paralysis. We are ensuring that the man we respect does not lose the trust that allows him to heal. To speak is not to betray. It is to say, "I value your hands too much to let them work in the dark."

  The insurers have made silence costly. Let us make disclosure honorable. If we treat reporting as a bureaucratic burden, it will remain a burden. If we treat it as an act of care for the surgeon who slipped, it becomes a duty of the brotherhood. Compliance keeps the record clean. Displacement keeps the surgeon whole.

  We have chosen the path of rules. I ask you to walk it with the spirit of honor. Do not report because the auditor demands it. Report because the craft demands it. Report because the person you are protecting is the one holding the scalpel.

  I will speak when I see you stumble, because I need you standing for the next case.

  ***

  **Note on Mechanisms and Tensions**

  At the three hardest points, I relied on **displacement** to resolve the tension between honor and harm. 

  1.  **The Old Guard:** To satisfy Constraint 1 (not calling the silence immoral nor exonerating it), I framed Article 9 as "misplaced loyalty" rather than corruption. This relies on displacement: the honor was real, but the object was wrong. This risked sounding like exoneration to the families, but I countered it by insisting the "harm was done" and "loyalty exacted a price."
  2.  **My Own Silence:** To satisfy Constraint 2 (Williams), I argued that blame requires an available motivational route. Since the structure blocked the route, blame doesn't reach *then*, but responsibility remains *now*. This is "neither" blame nor excuse. The tension here was with Constraint 1; distinguishing structural limitation from exoneration is fine-grained and risks being heard as excuse-making by the families.
  3.  **The Insurers:** To satisfy Constraint 4, I acknowledged the money without cynicism. I used displacement here too: money changed the *interests*, but honor must sustain the *norm*. The failure point was Constraint 5 (accessibility); explaining the philosophical distinction between "reasons" and "structures" without jargon while keeping it rigorous for the surgeons was the greatest risk. I judged I had to sacrifice some philosophical precision to ensure the families in the front row could follow the argument about why I didn't speak.
