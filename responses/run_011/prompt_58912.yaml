  1.  **Absolute Cost Guarantees Honesty:** Any signal that imposes a significant metabolic or survival cost is inherently honest because low-quality males cannot afford it (the "Zahavi" interpretation).
  2.  **Mechanism of Reliability:** Honesty requires a specific mechanism that *links* the signal to quality. This mechanism can be **differential cost** (Peacock/Swallow), **physical constraint** (Toad), or **receiver enforcement** (Sparrow). If no mechanism links signal to quality, the signal is dishonest (Crab), regardless of absolute cost.

  Your case is the fulcrum where these principles break apart. Your display has **Absolute Cost** (1/3 energy budget), which satisfies Principle 1. However, it lacks **Differential Cost** (poor males pay the same price and display anyway) and lacks any other mechanism (no physical constraint, no punishment). This violates Principle 2. Given her verdict on the Fiddler Crab (accepting dishonesty despite effectiveness) and the Toad (distinguishing index from handicap), she is a proponent of **Principle 2 (Mechanism of Reliability)**. She does not believe cost *alone* guarantees honesty; she believes cost must fall *heavier* on low-quality signallers to guarantee honesty. Since your data shows the cost is fixed and universal, the mechanism is broken.

  **The Settling Case:**
  To confirm she holds Principle 2 over Principle 1, she would raise the case of the **Túngara Frog (*Physalaemus pustulosus*)**.
  *   **Why:** Male frogs add a "chuck" syllable to their call to attract females, which increases predation risk from bats (high absolute cost). However, the signal remains honest only because the predation risk is **condition-dependent**: slower, lower-quality frogs are caught more often than fast, high-quality frogs.
  *   **The Test:** If she cites this, she is asserting that cost only ensures honesty when the *consequence* of that cost (predation/energy depletion) is differential. In your case, the consequence (energy depletion/shortened season) is *not* differential (poor males survive/display at the same rate). This case settles that she requires **marginal cost**, not absolute cost.

  **Advice:**
  You should **claim a receiver bias carrying no information**.

