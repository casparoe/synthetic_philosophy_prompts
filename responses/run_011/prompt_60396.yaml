answer: |-
  The booth smelled of ozone and recycled air, the same as always. Elara slid the headset on, adjusted the haptic gloves, and waited for the handshake protocol to green-light. She was a Level 4 Factor, one of the thousands who kept the city's nervous system firing. She didn't make decisions. She processed nodes.

  Today's tree was deep. She could tell by the initialization sequence; the branching factor was high, sixteen-way splits at the base. That meant a heavy decision. Something about infrastructure, usually. Or zoning.

  The first prompt appeared on the retinal display.

  *Query 894-B: Verify structural load capacity of Span 4 against standard flood surge (3.5m).*
  *Material Provided: Engineering schematics, stress test logs (Date: T-minus 6 months).*
  *Constraint: Yes/No only.*

  Elara scanned the logs. The numbers were green. The margins were safe. She tapped *Yes*.

  Ten seconds later, the next leaf.

  *Query 894-C: Confirm population density of Sector 7 against evacuation threshold (5,000 units).*
  *Material Provided: Census data (Date: T-minus 1 year).*
  *Constraint: Yes/No only.*

  She checked the density map. 4,200 registered units. She tapped *Yes*.

  This was the beauty of the System, the official line said. No single genius could be trusted with the weight of a drowning city. Geniuses had egos, biases, blind spots. But a thousand ordinary people, each answering a tiny, verifiable truth? That was pure. The geometry of the tree was secret, so no volunteer knew where their leaf sat in the whole. You couldn't game the system because you didn't know the equation.

  Elara blinked away the prompt. She had done three hundred sessions this year. She knew the texture of the questions. Usually, they were random noise. A question about sewage output followed by a question about park bench durability. But today, the texture was consistent. Concrete. Water. People. Movement.

  *Query 894-F: Assess viability of Route B for mass transit.*
  *Material Provided: Topographical map, width measurements.*
  *Constraint: Yes/No only.*

  Route B. She knew that designation. It ran through the Old Quarter. The map showed the width was sufficient for buses. She tapped *Yes*.

  *Query 894-G: Verify presence of mobility impediments on Route B.*
  *Material Provided: Maintenance logs.*
  *Constraint: Yes/No only.*

  The logs listed stairs, narrow turnings, heritage cobblestones. But the query asked about *impediments* defined by municipal code 44. Under Code 44, stairs were not impediments; they were architectural features. Only broken lifts counted. The logs showed no broken lifts.

  She tapped *No*.

  Her heart gave a strange thud. She sat back, the haptic gloves humming softly against her palms.

  *Yes. Yes. Yes. No.*

  Load capacity safe. Population below threshold. Route viable. No impediments.

  She closed her eyes. The System forbade reconstruction. It was the primary security protocol. If a Factor could build the root question from the leaves, they could anticipate the verdict, and anticipation was a form of corruption. But Elara wasn't trying to corrupt it. She was just listening.

  If Span 4 needed flood surge protection, the water was coming. If Sector 7 was being checked against an evacuation threshold, someone was leaving. If Route B was being assessed for mass transit in conjunction with flood data, it was an evacuation route.

  The root question wasn't *How do we fix the levee?*
  The root question was *Do we sacrifice the Old Quarter to save the Basin?*

  She opened her eyes. The booth was silent. She was just one leaf. Somewhere above her in the tree, a volunteer was being shown two answers: *Route Viable* vs *Route Compromised*. They would pick one. They wouldn't know why. Higher up, another volunteer would weigh *Evacuation Feasible* against *Containment Possible*.

  And at the root, a final volunteer would pick *Flood* or *Hold*.

  Elara looked at the next prompt.

  *Query 894-H: Confirm availability of medical transport for Sector 7.*
  *Material Provided: Fleet inventory.*
  *Constraint: Yes/No only.*

  The inventory listed forty ambulances. The threshold for "availability" was defined as "functional engines." All forty had engines.

  She tapped *Yes*.

  But she knew the Old Quarter. She had grown up there before the gentrification codes changed the names. She knew Sector 7 wasn't just registered units. It was the St. Jude Hospice. It was three hundred bedridden elderly who couldn't walk down the cobblestones she had just certified as non-impediments. It was undocumented workers living in the basements, invisible to the census data she had verified as complete.

  Here was the error. It wasn't a lie. It wasn't corruption.

  She had answered sincerely. The engines *were* functional. The width *was* sufficient. The load *was* safe. Every leaf was true. But the truth of the leaf did not guarantee the truth of the tree.

  The error was in the factoring itself. The system had decomposed "Can we save them?" into "Can the buses fit?" and "Are there buses?" It had factored out *ability to board*. That variable had never become a leaf. It was lost in the branching logic, discarded as "subjective" or "complex" during the initial decomposition phase.

  So the tree would grow upward on a trunk of perfect, honest lies. The volunteers above her would choose between options that looked robust but were hollow. They would choose to flood the Quarter because the math said the evacuation was viable. And when the water came, three hundred people would drown not because anyone wanted them dead, but because "mobility" was a variable too messy to fit into a ten-minute task.

  No one was responsible. The genius councilors were gone. The corrupt mayor was gone. There was only the geometry. You couldn't arrest a tree. You couldn't shame a branching factor.

  Elara stared at the *Yes* glowing on her screen. She could fail the verification. She could tap *No*.

  But if she tapped *No*, the system would flag the inconsistency. Her node would be discarded, replaced by a new volunteer given the same data. Someone else would tap *Yes*. The data didn't change. The definition of "impediment" didn't change. Her dissent would be noise, filtered out by the majority vote of the leaf layer.

  The System was better than the alternative. It was faster. It was immune to bribes. It saved the Basin every time. It just couldn't see the things that didn't have data fields.

  The timer chimed. Session complete. Credits transferred.

  Elara pulled off the headset. The silence of the booth rushed back in, heavier than before. She stood up, her legs stiff, and walked to the airlock.

  Outside, the sky was a bruised purple, heavy with the promise of rain. The city sprawled before her, sleek and efficient. Somewhere down there, the Old Quarter was dry. For now.

  She walked to the railing of the platform and looked down at the streets. A maintenance drone buzzed past, checking a sensor on the levee wall. It moved with perfect, unthinking precision.

  Elara reached into her pocket and pulled out a small, smooth stone she'd kept from the Old Quarter before the codes changed. She turned it over in her hand, feeling the rough edge where the mortar had crumbled.

  She held it over the railing. The wind tugged at her coat.

  She didn't throw it. There was no point. The stone wouldn't break the machine. It wouldn't stop the water. It would just add debris to the drain.

  She put the stone back in her pocket. She buttoned her coat against the coming wind and walked toward the transit station, stepping carefully over the grate where the rainwater was already beginning to pool.
