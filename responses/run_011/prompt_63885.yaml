answer: |-
  He gave us a cosmos of pressureless **dust**,
  Homogeneous, bound by no finite **radius**,
  Where matter follows a closed timelike **curve**,
  And physics dissolves the imperative **now**.
  There is no centre to designate **home**,
  Only the null converging cones of **light**.

  You must travel outward to catch your own **light**,
  Past the limit where the particles of **dust**
  Loop back to arrive before they leave **home**.
  It requires a specific critical **radius**
  To invalidate the passing of **now**,
  Making every trajectory a closed **curve**.

  Geometry permits this closed timelike **curve**,
  Though no signal exceeds the speed of **light**.
  The distinction collapses between then and **now**,
  Since every event is embedded in **dust**.
  There is no boundary, no maximum **radius**,
  Just the path that inevitably brings **home**.

  You return to the station you called **home**,
  Standing on your own past along the **curve**.
  Governed by that same critical **radius**,
  And the negative constant tilting **light**.
  Nothing observed rotates like this **dust**,
  Yet the equations erase the privileged **now**.

  He argued the lapse is not real, only **now**
  Is a habit of creatures needing **home**.
  If the field equations allow such **dust**,
  Then time is merely a geometric **curve**.
  The block is static, unaffected by **light**,
  Regardless of the coordinate **radius**.

  We know our universe lacks this **radius**,
  No evidence kills the experience of **now**.
  But the solution stands clear as **light**,
  For the traveler who cannot reach **home**,
  Trapped on a causal closed timelike **curve**,
  All physical reality dissolves to **dust**.

  Beyond the critical **radius** there is no **home**,
  Only the static block denying **now** and **curve**,
  Where physics ends and we are left with **light** on **dust**.
