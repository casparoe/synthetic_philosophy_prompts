answer: |-
  **Brainstorming**

  The concept of manipulation must cover a widening field: from the surgeon withholding a grim prognosis to spare a patient despair, to the algorithmic feed that radicalizes a user through incremental recommendations, to the fundraiser who leverages a donor's grief. Theoretical pressure comes from two sides. First, the need to distinguish manipulation from legitimate persuasion; if every influence is manipulation, the concept loses its critical bite. Second, the need to distinguish manipulation from coercion; if every pressure is manipulation, we lose the ability to condemn threats separately from tricks. The core tension lies between defining manipulation by its mechanism (how it works on the mind) versus its normative outcome (why it is wrong). Mechanistic definitions struggle with benign cases (a parent tricking a child into medicine); normative definitions struggle with circularity (defining manipulation as wrongful influence).

  Intuitions pull in opposite directions regarding transparency and agency. We intuitively feel that hidden influence is more suspect than open influence, yet a disclosed predatory loan term is still manipulative, while a surprise party is covert but benign. This suggests transparency determines wrongness, not the nature of the act. Furthermore, the board's docket is dominated by structural forces—defaults, interfaces, legacy code—where no single human intends the outcome. Traditional accounts require a manipulator with an intention to bypass deliberation. If the account cannot handle agentless systems, it is useless for this board. If it expands to cover systems, it risks labeling all causal influences as manipulation.

  Finally, the board requires actionability. A definition that relies on counterfactuals about what a target *would* have decided absent the influence is theoretically clean but administratively impossible. We cannot run controlled trials on every campaign. The account must offer criteria that can be inspected from the outside, based on design and content rather than hidden psychological states. Yet, if we rely only on observable features, we risk condemning effective communication simply because it is effective. The specification must balance philosophical coherence with regulatory feasibility, ensuring that the definition identifies the specific defect in the influence without requiring mind-reading or collapsing into a prohibition on all persuasion.

  **The Specification**

  1.  **Persuasion Distinction**
      *   **Requirement:** The account must distinguish influence that engages the target's reasoning capacities from influence that circumvents or corrupts them, without classifying all effective communication as manipulation.
      *   **Motivation:** A closing argument moves a jury; a phishing email moves a victim. Both are effective. An account that defines manipulation by effectiveness prohibits persuasion.
      *   **Violation Consequence:** The account collapses the distinction between education and indoctrination, rendering legitimate advocacy impermissible.
      *   **Status:** Non-negotiable.

  2.  **Frame Neutrality**
      *   **Requirement:** The account must acknowledge that all communication involves framing and selection, and must not define manipulation merely as the presence of a frame.
      *   **Motivation:** There is no frameless disclosure. Stating survival rates versus mortality rates changes choices, but one frame is not inherently manipulative.
      *   **Violation Consequence:** The account implies that silence or incomprehensible data dumps are the only ethical forms of communication.
      *   **Status:** Non-negotiable.

  3.  **Attempt Sensitivity**
      *   **Requirement:** The account must locate the property of manipulation in the design or intention of the influence, such that a failed attempt remains manipulative even if the target is unmoved.
      *   **Motivation:** A clumsy lie is still a lie; a transparent scam is still a scam. Moral evaluation depends on the attempt, not just the success.
      *   **Violation Consequence:** The account exonerates clumsy manipulators and condemns only those who are psychologically vulnerable to the influence.
      *   **Status:** Strongly preferred.

  4.  **Transparency Agnosticism**
      *   **Requirement:** The account must treat transparency as a mitigating factor for wrongness, not as a defining criterion for whether an act is manipulation.
      *   **Motivation:** Disclosed predatory terms are still manipulative; covert surprise parties are not. Hiddenness correlates with wrongness but does not constitute the act.
      *   **Violation Consequence:** The account licenses open exploitation and condemns benign secrecy.
      *   **Status:** Non-negotiable.

  5.  **Structural Applicability**
      *   **Requirement:** The account must apply to influence generated by systems, defaults, or algorithms where no single human agent holds a specific intention to manipulate.
      *   **Motivation:** The board's docket consists largely of interface designs and ranking objectives inherited from legacy systems, not interpersonal pitches.
      *   **Violation Consequence:** The account renders the board silent on its primary workload, restricting jurisdiction to interpersonal conduct only.
      *   **Status:** Non-negotiable (for this board).

  6.  **Normative Baseline**
      *   **Requirement:** The account must specify a normative baseline for normal pressure or vulnerability, distinguishing exploitation of a weakness from reasonable accommodation of human limits.
      *   **Motivation:** Exploiting grief is manipulative; accommodating fatigue is not. Without a baseline, any appeal to emotion counts as exploitation.
      *   **Violation Consequence:** The account cannot distinguish between preying on addiction and offering support to an addict.
      *   **Status:** Strongly preferred.

  7.  **Non-Normative Core**
      *   **Requirement:** The account must define manipulation via a descriptive mechanism (e.g., bypassing deliberation) rather than defining it as "wrongful influence," allowing for benign or authorized cases.
      *   **Motivation:** If manipulation is defined by its wrongness, one cannot explain *why* it is wrong without circularity. Benign manipulation (medical sleight of hand) must be conceptually possible.
      *   **Violation Consequence:** The account becomes tautological and cannot explain the specific wrong-making feature of the act.
      *   **Status:** Non-negotiable.

  8.  **Observability**
      *   **Requirement:** The criteria for identifying manipulation must be inspectable from the design, content, or context of the influence without requiring access to the target's private psychological states or counterfactual decisions.
      *   **Motivation:** Regulators cannot run controlled trials on every user to see if their deliberation was bypassed.
      *   **Violation Consequence:** The standard is administratively useless, relying on evidence that cannot be gathered.
      *   **Status:** Strongly preferred (Regulatory import).

  **Assessment of Requirements**

  First, regarding genuine versus imported requirements: **Persuasion Distinction**, **Frame Neutrality**, **Transparency Agnosticism**, and **Non-Normative Core** are genuine conceptual requirements. Any account failing these fails to describe manipulation *at all*. **Observability** and **Structural Applicability** are imported demands. **Observability** is a requirement of regulation, not metaphysics; a true theory of manipulation could rely on unobservable mental states and still be true, merely unenforceable. **Structural Applicability** is a demand of sociology and law; traditionally, manipulation is an interpersonal concept involving agency. Extending it to structures is a necessary fiction for this board, not a conceptual truth. **Attempt Sensitivity** is borderline; while morally intuitive, a purely effect-based account of manipulation is conceptually coherent, even if unjust. I demote **Attempt Sensitivity** and **Observability** to regulatory preferences.

  Second, the single requirement that eliminates the largest number of otherwise attractive accounts is **Structural Applicability**. Most philosophical accounts define manipulation as an intentional act where an agent seeks to bypass another's deliberation. Algorithms, defaults, and market structures do not have intentions. To satisfy this requirement, an account must either attribute fictional agency to systems or redefine manipulation as a property of effects rather than intentions. This kills the dominant intentionalist family of theories outright. It is costly because it forces us to abandon the link between manipulation and moral responsibility at the source, shifting the focus entirely to the victim's experience or the system's design properties.

  Third, there is a joint unsatisfiability between **Attempt Sensitivity** and **Structural Applicability**. **Attempt Sensitivity** requires an attempt, which implies an agent with an intention to succeed. **Structural Applicability** requires the account to cover cases where there is no agent and thus no intention. You cannot have an attempt without an attempter. If the account prioritizes **Structural Applicability**, it must treat manipulation as a state of affairs or a causal pathway, rendering **Attempt Sensitivity** incoherent (a system cannot "attempt" anything). If it prioritizes **Attempt Sensitivity**, it cannot cover algorithmic defaults without positing a responsible human somewhere in the chain, which often does not exist in legacy systems. The board must abandon **Attempt Sensitivity**. Manipulation in structural contexts must be defined by the capacity to bypass deliberation, regardless of whether that capacity was intentionally designed or merely emergent.

  **Assessment of Account Families**

  **Mechanism accounts** (influence via non-rational routes) fail **Structural Applicability** first. They rely on identifying a designer's intent to bypass reasoning, which is absent in algorithmic systems. **Transparency accounts** (influence the target could not endorse) fail **Transparency Agnosticism**. They define manipulation by secrecy, licensing disclosed exploitation and condemning benign covert acts like medical placebos. **Leverage accounts** (exploiting vulnerability) fail **Normative Baseline**. Without a clear standard for what counts as a vulnerability versus a normal human condition, they cannot distinguish exploitation from accommodation, condemning all appeals to emotion or need.
