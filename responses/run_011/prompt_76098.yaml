          *   *Strain:* Ros isn't committed to the null; he's committed to the game.
      *   **The "Time Stopped" Hypothesis:**
          *   Identify as **Pseudoreplication** / **Lack of Independence**.
          *   Connect to Replication Crisis: "Replication" that shares the same hidden confounds (e.g., same software bug, same cultural moment) isn't independent $N$. It's one datum repeated.
      *   **Divine Intervention vs. Loaded Coin:**
          *   Correct the instructor. Divine Intervention isn't saving the Null; it's positing a Deterministic Alternative.
          *   Loaded Coin *is* considered (bias), but rejected as insufficient for the magnitude.
          *   Duhemian point: It's an auxiliary assumption, but it changes the logic from stochastic to deterministic.
      *   **The Meta-Truth (The Script):**
          *   This is the strongest philosophical point.
          *   Bayesian vulnerability: The "Unconceived Alternatives" problem (Stanford). If $H_{\text{truth}}$ has prior 0, posterior is 0.
          *   Frequentist vulnerability: No "long run" exists outside the script.
