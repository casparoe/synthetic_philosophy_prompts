  3.  **Evaluate the Statistical Analogy (Sharpen/Reject):**
      *   *Ros as Frequentist:* This holds up well *structurally*. A strict frequentist *must* maintain that $P(\text{HH...H} | \text{Fair}) = P(\text{HT...T} | \text{Fair})$. Ros's indifference mirrors the technical truth that the past sequence doesn't change the *next* flip's probability (Gambler's Fallacy avoidance), but his lack of concern about the *parameter* estimation is the key. He accepts the null until proven otherwise by a formal test (which hasn't happened).
      *   *Guil as Bayesian:* Also holds up. He updates his credence in "Fair Coin" downward rapidly. He considers alternative models (bias, supernatural, time). This is model comparison.
