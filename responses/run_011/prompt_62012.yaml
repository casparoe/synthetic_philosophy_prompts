      *   **The Math:** I need to pre-calculate the scenarios to ensure the "Zero Point" flip works.
          *   Scenario A: Lottery L1 vs L2.
          *   Individuals have $U_i$. Social $W = \sum U_i$.
          *   If we shift $U_i' = U_i + k$, does $W$ change order?
