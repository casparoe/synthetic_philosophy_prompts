answer: |-
  # Seminar Design: The Invisible Weights

  ## 1. Blunt Feasibility Assessment
  Before you commit, here is the contact report:
  *   **The "Zero-Point Flip" Claim:** Mathematically, for a fixed population, adding a constant to everyone's utility function ($U_i' = U_i + k$) adds a constant to the social sum ($W' = W + nk$). It **does not** flip social rankings. Only changing the *scale* (multiplying) flips rankings. Students who know basic algebra will spot this. **Fix:** Frame it as "Normalization" (fixing both zero and unit). The activity below forces them to choose a normalization protocol. The *choice of protocol* (which hinges on where they set zero) determines the weights.
  *   **Deriving Linearity:** Students will not derive $W = \sum a_i U_i$ from axioms in 40 minutes. They will observe that the *only* way to satisfy Pareto + Consistency is to sum numbers. That is sufficient for a seminar.
  *   **The CGT Student:** If you don't give them a job, they will hijack the room. The "Auditor" role below is mandatory.
  *   **Incentives:** If the payoff is trivial, they will treat it as a puzzle, not a decision. The chocolate/charity split must be real.

  ## 2. Materials & Incentives
  *   **The Pot:** 24 high-quality chocolates (or a £50 voucher split between two charities, e.g., *Against Malaria Foundation* vs. *Local Food Bank*). Let's assume Chocolate for immediacy.
  *   **Worksheets:** 3 distinct sheets per student (Phase 1, 2, 3).
  *   **The "Ledger":** A whiteboard or projected spreadsheet visible to all.
  *   **The CGT Kit:** A clipboard, a red pen, and a copy of the "Pareto Violation Checklist."
  *   **Incentive Scheme:**
      *   **Individual:** The 3 students with the most "Internally Consistent" rankings (Phase 1) get 2 chocolates each.
      *   **Group:** The final group decision determines how the remaining 18 chocolates are distributed between two "Recipients" (Charity A / Charity B) OR kept by the class.
      *   **CGT Bonus:** If the Auditor finds a Pareto violation before the debrief, they get 4 chocolates.

  ## 3. Timeline (120 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00:00 - 00:10** | **Setup** | Distribute materials. Assign CGT student as "Compliance Auditor." Explain the Chocolate Pot. **No jargon.** |
  | **00:10 - 00:40** | **Phase 1** | **Individual Preferences.** Students rank lotteries over distributions. Check consistency. |
  | **00:40 - 01:20** | **Phase 2** | **Aggregation.** Group must produce one ranking. Derive the "Weights." The Normalization Trap. |
  | **01:20 - 01:50** | **Phase 3** | **Ex-Ante vs. Ex-Post.** The Coin Flip Collision. |
  | **01:50 - 02:00** | **Debrief** | Reveal Harsanyi. Map the pain points to the axioms. |

  ## 4. The Activity Rules

  ### Phase 1: Individual Preferences (30 mins)
  **Context:** There are two recipients, **Alice** and **Bob**. You are deciding how to distribute a pot of resources.
  **Task:** Rank the following 5 Prospects from Best (1) to Worst (5).
  *Note: Prospects involve risk. A "50/50" means a coin is flipped.*

  1.  **Certain:** Alice gets 10, Bob gets 10.
  2.  **Certain:** Alice gets 15, Bob gets 5.
  3.  **Certain:** Alice gets 5, Bob gets 15.
  4.  **Risky:** 50% chance (Alice 20, Bob 0); 50% chance (Alice 0, Bob 20).
  5.  **Risky:** 50% chance (Alice 15, Bob 5); 50% chance (Alice 5, Bob 15).

  **Consistency Check (The Trap):**
  On the back of the sheet, answer:
  *   If you prefer #2 over #3, must you prefer #5 over a Certain (10, 10)?
  *   *Instructor Note:* Collect sheets. The CGT Auditor checks if anyone violated transitivity or Independence (e.g., preferring #2 to #3 but #3 to #5 when #5 is a mix of #2 and #3).
  *   **Scoring:** Assign "Utility Points" (0 to 100) to the outcomes for Alice and Bob *as if you were them*. (This is the first hidden assumption: you can quantify their welfare).

  ### Phase 2: Aggregation & The Weights (40 mins)
  **Task:** The class is now the "Social Planner." You must produce **one** master ranking of the 5 Prospects to decide the Chocolate distribution.
  **Constraint 1 (Pareto):** If everyone prefers A to B, the Group must prefer A to B.
  **Constraint 2 (Consistency):** The Group ranking must respect the same logic you used individually (no rank reversals with identical lotteries).

  **The Process:**
  1.  Project the class's average "Utility Points" for Alice and Bob from Phase 1.
  2.  Ask the class to sum these points to rank the Prospects.
  3.  **The Intervention:** Stop them. Point out that Student X used a 0-10 scale and Student Y used a 0-100 scale. Student Y has 10x the voting power.
  4.  **The Fix:** Ask them to "Normalize."
      *   *Round A:* Set "Worst Possible Outcome for Anyone" = 0. "Best Possible" = 1.
      *   *Round B:* Set "Worst Possible Outcome for *Me*" = 0. "Best Possible" = 1.
  5.  **The Shock:** Recalculate the Group Ranking using Round A numbers, then Round B numbers.
      *   *Design:* Ensure Round A favors the "Equal Split" prospects. Ensure Round B favors the "High Variance" prospects (because high-sensitivity students anchor their zero higher).
  6.  **The Question:** "Which normalization is correct? Your individual preferences didn't change. Why did the Group Choice flip?"

  ### Phase 3: The State-Contingent Collision (30 mins)
  **Task:** Re-evaluate Prospect #4 (The 50/50 Coin Flip: (20,0) or (0,20)) vs Prospect #1 (Certain: 10,10).
  **Scenario:** The coin has **not** been flipped yet (Ex-Ante).
  *   Most students (risk neutral) should be indifferent or prefer Certain.
  **Scenario:** The coin **has** been flipped, but you don't know the result yet. You are now evaluating the *states*.
  *   State 1: Alice has 20, Bob has 0.
  *   State 2: Alice has 0, Bob has 20.
  **Task:** Rank the inequality in State 1 vs the Certain (10,10).
  *   Almost everyone prefers (10,10) to (20,0) *within a state*.
  **The Collision:**
  *   Ex-Ante: You accepted the risk (Indifferent).
  *   Ex-Post (State-by-State): You reject the inequality.
  *   **Question:** "If you prefer (10,10) in *every* possible state, why did you accept the lottery beforehand? Did the group ranking violate Pareto in the states?"

  ## 5. The Debrief (10 mins)
  *Do not start this until the clock hits 01:50.*

  1.  **Reveal the Theorem:** "You just walked through **Harsanyi's Aggregation Theorem**."
  2.  **Map the Pain:**
      *   **Phase 1:** You assumed **vNM Rationality** (Independence/Sure-Thing).
      *   **Phase 2:** You assumed **Pareto Efficiency**.
      *   **The Result:** The only mathematical function that satisfies both is a **Weighted Sum of Utilities** ($W = \sum a_i U_i$).
      *   **The Trap:** The theorem proves the *form* (linear sum), but it **does not pin down the weights** ($a_i$).
      *   **The Zero-Point:** The weights only appeared when you chose a **Normalization**. Changing the "Zero" (baseline) changed the "Unit" (scale), which changed the weights. This is the **Interpersonal Comparison of Utility** problem. Harsanyi assumes we can compare; you just proved we can't without arbitrary rules.
      *   **Phase 3:** This was the **Diamond Critique**. Harsanyi says respect Ex-Ante Pareto. But Ex-Post, the lottery creates inequality nobody wants. If you care about fairness *within* states, you violate Harsanyi's Ex-Ante conclusion.

  ## 6. Failure Modes & Recovery

  | Failure Mode | Prediction | Recovery |
  | :--- | :--- | :--- |
  | **CGT Spoiler** | They announce "It's just linear algebra" at min 15. | **Pre-empt:** Tell them privately: "Your job is to verify the *normative* weight, not the math. If you explain the theorem early, the class fails the learning objective, and you lose your Auditor Bonus." |
  | **Math Glut** | Phase 2 normalization takes too long. | **Cut:** Skip Round B normalization. Just show the raw scores vs. normalized scores. The point is "Arbitrary Scale," not "Two types of Zero." |
  | **Apathy** | They don't care about Alice/Bob. | **Pivot:** Remind them the Chocolate Pot depends on the Group Ranking. If they don't rank, the Instructor decides (and you hate the Instructor's preferences). |
  | **Zero-Point Confusion** | They argue adding a constant doesn't change order. | **Concede:** "You are right mathematically. But in practice, we normalize 0-to-1. Changing the '0' changes the '1'. That's the trap. The *protocol* is arbitrary, even if the math isn't." |

  ## 7. Frank Note: What This Activity Cannot Reproduce
  You must supply this verbally in the debrief, because the activity cannot simulate it:

  **The Uniqueness of Weights:**
  Harsanyi's theorem states that if individual utilities are fixed, the social weights are unique *up to a common scale factor*. The activity shows the weights change when *individual* scales change.
  **The Missing Piece:** The theorem assumes individual utility functions are **given and fixed** (cardinal). In your seminar, the students *constructed* their utility functions on the fly.
  **The Truth:** The activity demonstrates the **Measurement Problem** (how do we know $U_i$?), not the **Aggregation Problem** (given $U_i$, what is $W$?).
  **Why it matters:** Harsanyi solves the Aggregation Problem assuming the Measurement Problem is solved. Your students just proved the Measurement Problem is unsolvable without arbitrary norms. This is actually a *stronger* critique than Harsanyi intended, but you must clarify that Harsanyi takes utility as an input, not a process.

  ## 8. Specific Numbers for the "Flip" (Phase 2)
  To ensure the normalization flip works in Phase 2, use this data structure for the "Average Class Utility":

  **Raw Scores (Unnormalized):**
  *   **Student A (Egalitarian):** (10,10)=100, (20,0)=50.
  *   **Student B (Libertarian):** (10,10)=10, (20,0)=100.
  *   **Sum:** (10,10)=110, (20,0)=150. **Winner: Inequality.**

  **Normalized (0=Worst, 1=Best):**
  *   **Student A:** (10,10)=1, (20,0)=0.
  *   **Student B:** (10,10)=0, (20,0)=1.
  *   **Sum:** (10,10)=1, (20,0)=1. **Tie.**

  **Normalized (0=Status Quo, 1=Best):**
  *   *Assume Status Quo is (5,5).*
  *   **Student A:** (10,10)=1, (20,0)= -1 (Loss).
  *   **Student B:** (10,10)=0.5, (20,0)=1.
  *   **Sum:** (10,10)=1.5, (20,0)=0. **Winner: Equality.**

  *Instruction:* In Phase 2, guide half the class to use "Worst Possible" as 0, and the other half to use "Current Endowment" as 0. Then sum them. The result flips. This simulates the "Arbitrary Zero" problem effectively.

  ## 9. Instructions for the Competitive Game Theorist (CGT)
  *Hand this note to them privately at the start.*

  > **ROLE: COMPLIANCE AUDITOR**
  > **MISSION:** The class is attempting to build a Social Welfare Function. They will likely fail.
  > **YOUR JOB:**
  > 1.  Do not reveal the name "Harsanyi" or "Utilitarianism." If you do, you void the experiment and lose your bonus.
  > 2.  Check the Phase 2 Aggregation. If the Group Ranking violates **Pareto** (i.e., ranks X > Y when every student ranked Y > X), circle it in red.
  > 3.  Check Phase 3. If the Group prefers the Lottery Ex-Ante, but prefers the Certain Outcome in *both* Ex-Post states, mark this as a "Dynamic Inconsistency."
  > 4.  **REWARD:** If you identify a violation before the Instructor does, you receive 4 Chocolates. If the class successfully builds a consistent function, you get 1.
  > **HINT:** Watch how they normalize the utility scales. That's where the bug is.

