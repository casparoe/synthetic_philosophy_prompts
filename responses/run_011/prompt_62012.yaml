      *   *Stage 3 (Ex-Ante/Ex-Post):* The (10,0)/(0,10) vs (5,5) example is classic Diamond (1967) critique of Harsanyi, not Harsanyi itself. Harsanyi says Ex-Ante Pareto dominates. The prompt wants them to collide with the fact that Ex-Post evaluation differs. This is the "Different Zero Points" insight. I need to ensure the utility functions allow for this flip.
