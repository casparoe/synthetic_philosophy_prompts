      *   **Materials:** Keep it low tech. Worksheets, pens, maybe a projected spreadsheet for the "Social Planner."
      *   **Incentives:** "Social Impact Tokens." At the end, the group's final decision determines a donation split between two charities (or just chocolate distribution). Let's go with Chocolate. It's immediate.
      *   **Timeline:** 120 mins.
          *   Intro/Setup (10)
          *   Phase 1: Individual Preferences (30)
          *   Phase 2: Aggregation & Weights (40)
          *   Phase 3: The Zero-Point Shock (30)
