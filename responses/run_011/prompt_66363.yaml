answer: |-
  Thank you all for coming.
  Look at this room. Look at the light grid above us.
  To our donor and his family, this is a miracle.
  You have given us a tool we did not know we could hold.
  You grew up two blocks from the fairgrounds.
  You know what this town sounds like in August.
  This building is a permanent gift to the future.
  To the drama students, I see your faces.
  You have never stood on a stage with a curtain before.
  You deserve this chance to learn the craft properly.
  You need the fly space. You need the lighting board.
  You need to know how a professional house works.
  But a building is not just a shelter for art.
  It instructs us on how to behave.
  There was a philosopher who wrote a long letter about this.
  He argued that a theater is not good or bad in itself.
  It depends on the place where you put it.
  He thought a theater suited Paris because Paris was already distant.
  He thought it suited Geneva poorly because Geneva was small and close.
  His reason was about what each place already was.
  He looked at customs and scale before he looked at plays.
  Kettle River is not Paris. We are not Geneva either.
  We are a town that knows where everyone sat in the parking lot.
  The philosopher worried about the spectators themselves.
  He disliked the idea of hundreds of people sitting still in the dark.
  He disliked them not speaking to each other for three hours.
  He worried about the actor whose trade is being someone else for money.
  In the dark room, we become passive.
  We watch rather than join.
  That is useful for training. It is not the only way to gather.
  He also said that theater business is to please, not to correct.
  It flatters what an audience already finds funny.
  It makes the smooth operator get the laugh.
  It makes the honest, blunt person the joke.
  Think about Dale. He has played three roles since 1979.
  He blows lines. He refuses to give them up.
  That is not a bug. It is a feature of our history.
  If we move the Pageant indoors, we will light it correctly.
  We might smooth out the rough edges until the truth is gone.
  We might make the town laugh at the wrong things.
  The philosopher had a counter-proposal instead of a ban.
  He imagined an open-air festival where the crowd is itself the show.
  He pictured a stake stuck in the ground in a public square.
  People gathered round it, and each other as the spectacle.
  The flatbed trailer in the fairgrounds is that stake.
  But we must be careful.
  The kind of gathering where everyone is the spectacle is not innocent.
  It is also the kind of thing a town can use to exclude.
  It can make the family that didn't participate feel it.
  So we cannot simply reject this building.
  The drama kids are right about something real.
  They need the tech. They need the proscenium.
  But the Pageant chair is right too.
  The Pageant cannot be fixed without breaking it.
  We need a mechanism to let them coexist.
  Here is the specific proposal.
  The Kettle River Arts Council will codify the August Exemption.
  The Pageant remains outdoors on the second weekend of August.
  The management firm provides sound equipment but cannot change the script.
  Script changes require a vote from the Pageant Veterans Committee.
  Three veterans hold veto power over any indoor adaptation.
  The Council must ratify this by the first of June.
  A joint committee of five members will oversee the transition.
  This keeps the stake in the ground.
  It lets the students have their season.
  It lets Dale keep his roles.
  It lets the donor see his gift used wisely.
  We do not choose between the dark room and the sun.
  We use both for what they are.
  This building opens in six weeks.
  The Pageant opens in six months.
  Let us sign the agreement before the first ticket is sold.
  Thank you.

