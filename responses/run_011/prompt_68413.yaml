  ### 2. The Rule That Best Fits

  The rule that best fits your six verdicts is the **Constrained Nash Bargaining Solution**.

  **The Rule:**
  Given an estate $E$, claims vector $c$, and fallback (disagreement) vector $d$:
  1.  Define the feasible set $S$ as all awards $x$ such that $\sum x_i = E$ and $d_i \le x_i \le c_i$.
  2.  Select the award $x$ that maximizes the Nash product: $\prod (x_i - d_i)$.
