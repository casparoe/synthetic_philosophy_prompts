  *   **Case 2 ($c=(60, 90), E=100 \rightarrow x=(40, 60)$):**
      *   **Nash Bargaining Solution (NBS):** With disagreement point $d=(0,0)$, NBS maximizes the product of gains $x_A \cdot x_B$ subject to $x_A+x_B=100$. The unconstrained maximum is $(50, 50)$. Since $(50, 50)$ satisfies the claim constraints ($50 \le 60, 50 \le 90$), NBS predicts **$(50, 50)$**. Your verdict was **$(40, 60)$**.
