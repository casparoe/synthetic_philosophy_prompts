answer: |-
  Here is a decision procedure designed for your specific constraints. It is grounded in the "Achievement View" of authorship (Jerrold Levinson, Arthur Danto) rather than the "Textual View."

  **The Philosophical Load-Bearing Wall:**
  We are discarding the idea that a book is just a string of words (the "Textual View"). If that were true, a ghostwritten book would be indistinguishable from an authored one, and prizes would be meaningless. Instead, we are adopting the **Achievement View**: A literary prize rewards the *action* of a specific human being overcoming the difficulty of writing a book at a specific time. If the action didn't happen as claimed, the achievement is void, regardless of the text's quality.

  **What We Are Deliberately Ignoring:**
  1.  **The "Death of the Author" (Barthes):** We cannot afford this. For a prize, the Author is everything.
  2.  **Ontological Forgery (Goodman):** In literature, a perfect copy *is* the work. We are not policing forgeries; we are policing *misrepresentation of agency*.
  3.  **Quality:** This procedure does not judge if the book is good. It judges if the entry is valid.

  Below is the printable protocol for your jury, followed by the failure mode analysis and the test cases.

  ***

  # PROTOCOL: AUTHORSHIP INTEGRITY CHECK (AIC)
  **For Internal Jury Use Only | Time Limit: 20 Minutes**

  **TRIGGER:** This protocol is initiated only when a specific, credible allegation regarding authorship is raised (e.g., ghostwriting, posthumous submission, undisclosed AI, identity fraud). Do not use for general quality assessment.

  **BURDEN OF PROOF:** Once an allegation is flagged, the burden shifts to the **Entrant**. They must satisfy the Jury that their authorship claim is accurate. Vague answers count against the Entrant.

  ### STEP 1: CATEGORISE THE FLAG
  Identify which category the concern falls into. This determines the eligibility baseline.

  *   **Type A: Agency Dispute.** (e.g., "Someone else wrote parts of this," "AI generated this.")
  *   **Type B: Identity/Eligibility Dispute.** (e.g., "The author is dead," "This is a pseudonym for an established writer.")

  ### STEP 2: THE WRITTEN INQUIRY
  Send the following standard questions to the entrant. Allow 72 hours for response.

  1.  **Specific Contribution:** "Please detail the specific contributions of any other individuals or tools to the final manuscript, chapter by chapter. If no assistance was received, please state 'Sole Author, no external drafting assistance.'"
  2.  **Process Description:** "Describe your drafting process for the section in question [cite specific section]. What was the state of the draft before the final revision?"
  3.  **Claim Verification:** "Do you claim full and sole responsibility for the creative choices, narrative structure, and prose of the submitted work? If not, please specify exactly what you claim responsibility for."

  ### STEP 3: EVALUATE THE RESPONSE
  Compare the response against the Flag.

  **PASS (Proceed to Judging)**
  *   Answer is specific, consistent, and plausible.
  *   Disclosures match the submission notes.
  *   *For Type A:* Assistance is disclosed and falls within Prize Rules (e.g., standard editing).
  *   *For Type B:* Identity is verified as eligible (Living, first/second book, etc.).

  **FAIL (Disqualify)**
  *   **Non-Answer:** Evasive language ("My spouse helped like any spouse would," "It was a collaborative effort" without details).
  *   **Contradiction:** Response contradicts submission notes or known facts.
  *   **Ineligibility:** Author is deceased, or the work is not a "second book" by a living author.
  *   **Undisclosed Generation:** Significant portions generated by AI or ghostwriter without prior disclosure.

  **UNRESOLVED (Escalate to Board)**
  *   The Entrant's answer is plausible but cannot be verified, and the Jury is split 2-1.
  *   *Note:* Do not use this to avoid a hard vote. Use only if the allegation is legally sensitive (e.g., copyright ownership of a dead author's work).

  ### STEP 4: THE POLICY VOTE (If applicable)
  If the Entrant passes Step 3 but the nature of the assistance is novel (e.g., heavy AI use that was disclosed), the Jury must vote on **Policy**, not Fact.

  *   **Question:** "Does this level of assistance align with the Prize's mission to reward *human* literary achievement?"
  *   **Vote:** Simple Majority.
  *   **Outcome:** If Majority says "No," Disqualify. If "Yes," Accept.

  ***

  # FAILURE MODE ANALYSIS
  *Read this before using the Protocol.*

  **1. The "Skilled Liar" Problem**
  *   **Risk:** A ghostwriter and author can coordinate their answers to match.
  *   **Mitigation:** We rely on specificity. Liars tend to be vague ("we worked together"). Truth-tellers can describe process ("I wrote the scene in a cafe, he fixed the dialogue").
  *   **Reality:** This procedure cannot catch a perfect conspiracy. It catches inconsistencies and evasions.

  **2. The "Clumsy Truth" Problem**
  *   **Risk:** An honest author might be bad at explaining their process and sound evasive.
  *   **Mitigation:** The Jury must distinguish between *inarticulate* and *evasive*. If the text is brilliant but the email is confused, grant one extension for clarification.

  **3. The "Aesthetic Smuggle"**
  *   **Risk:** Jurors disliking a book will scrutinize authorship more heavily than a book they love.
  *   **Mitigation:** Step 1 requires a "credible allegation." A hunch is not enough. There must be an external trigger (a rumor, a submission note, a stylistic break).

  **4. The "Policy Clothes"**
  *   **Risk:** Step 4 looks like a fact check but is actually a value judgment.
  *   **Mitigation:** The Protocol explicitly marks Step 4 as a Policy Vote. Do not pretend it is factual.

  ***

  # TEST CASES: APPLYING THE PROTOCOL

  Here is how the procedure runs on your three scenarios.

  ### CASE 1: THE SPOUSE (Agency Dispute)
  *   **Flag:** Type A (Agency). Rumor: Husband wrote last third "line by line."
  *   **Inquiry:** You send the Step 2 questions.
  *   **Response:** She replies: "He read it and made suggestions, as any spouse would. The words are mine."
  *   **Evaluation (Step 3):**
      *   **Specific Contribution:** She claims "suggestions." The allegation is "line by line."
      *   **Process Description:** She does not describe the drafting state of the last third, only the spousal role.
      *   **Claim Verification:** She claims "The words are mine."
      *   **Analysis:** This is a **Non-Answer/Evasive**. "Suggestions" is compatible with editing; "Line by line" is ghostwriting. By refusing to address the specific nature of the changes in the last third, she fails to meet the Burden of Proof shifted to her in the Protocol header.
  *   **Verdict:** **FAIL (Disqualify).**
  *   **Reasoning:** We are not ruling that he *did* write it (we can't know). We are ruling that she failed to demonstrate she *didn't* misrepresent the authorship when presented with a specific credibility gap. The Achievement View requires us to trust the agent; the trust is broken by evasiveness.
  *   **Outcome:** **Against you.** (You wanted to let it through/were unsure; the procedure forces a disqualification based on integrity, not proof of guilt).

  ### CASE 2: THE BOX (Identity/Eligibility Dispute)
  *   **Flag:** Type B (Identity). Author died in 1971.
  *   **Inquiry:** You send Step 2 questions to the Academic.
  *   **Response:** Academic confirms: "Author died 1971. I prepared the text."
  *   **Evaluation (Step 3):**
      *   **Eligibility Check:** The prize is for a "Second Book." Implicit in literary prizes of this nature (career development, £10k, festival circuit) is a **Living Author**.
      *   **Analysis:** A dead author cannot achieve anything *now*. This is not a fraud case; it is an eligibility case. The "Achievement" belongs to a historical figure, not a contemporary contender.
      *   **Policy Check:** Even if the text is superb (as you say), awarding this changes the prize from "Best Second Book by a Living Writer" to "Best Posthumous Discovery." That requires Board approval, not Jury discretion.
  *   **Verdict:** **FAIL (Disqualify/Refer to Board).**
  *   **Reasoning:** Under the Achievement View, the prize rewards the *current* career step of a living writer. A dead writer has no career to advance.
  *   **Outcome:** **Against you.** (You love the book and told the bookseller it would win. The procedure protects you from awarding a prize to a corpse, which would be a PR disaster for a "second book" prize).

  ### CASE 3: THE AI ONE (Policy Vote)
  *   **Flag:** Type A (Agency). Disclosed AI use.
  *   **Inquiry:** You send Step 2 questions.
  *   **Response:** Entrant is fully transparent. "AI drafted 30%, I rewrote dialogue and cut."
  *   **Evaluation (Step 3):**
      *   **Consistency:** Response matches submission notes.
      *   **Disclosure:** Full.
      *   **Result:** Passes Step 3 (Fact Check).
  *   **Step 4: The Policy Vote:**
      *   **Question:** "Does this level of assistance align with the Prize's mission to reward *human* literary achievement?"
      *   **Juror 1 (You):** Yes. (Text is good, no lies).
      *   **Juror 2 (Bookseller):** No. (Prize is for writers, not prompters).
      *   **Juror 3 (Teacher):** No. (The 'difficulty overcome' was too low).
      *   **Vote:** 2-1 Against.
  *   **Verdict:** **FAIL (Disqualify via Policy Vote).**
  *   **Reasoning:** The text is valid, but the *achievement* does not meet the Jury's consensus on what the prize honors. Because the Protocol forces this to be a Policy Vote (Step 4) rather than a Fact Hunt, the dissenters can vote based on principle without accusing the author of fraud.
  *   **Outcome:** **Against you.** (You wanted it in; the majority view on "Human Achievement" rules it out).

  ***

  # CHAIR'S NOTE: WHY THIS HURTS (AND WHY IT HELPS)

  You asked for a procedure that wouldn't be a rubber stamp. To do that, it has to be willing to kill books you like.

  1.  **The Box:** This is the most important kill. If you award a posthumous book in a "Second Book Prize," you invalidate the category for every living writer next year. The procedure makes this an eligibility fact, not an aesthetic choice, saving you from your own taste.
  2.  **The Spouse:** This is the integrity kill. You cannot prove the husband wrote it. But you *can* rule that the Entrant's explanation was insufficient given the rumor. This protects the prize from looking naive without requiring legal proof.
  3.  **The AI:** This is the culture war kill. By making it a Policy Vote (Step 4), you allow your jurors to vote their conscience on "what is writing" without accusing the entrant of cheating.

  **Implementation Advice:**
  Print the **Protocol** section only for your jurors. Keep the **Failure Mode** and **Test Cases** for yourself. When you introduce this to the bookseller and the teacher, frame it as "Protecting us from lawsuits and bad press," not "Philosophical purity." They will sign up for risk mitigation; they might not sign up for Levinson.

  If you run this, you will likely lose the book you love (The Box). That is the cost of having a rulebook. But it ensures the prize survives to run next year.
