  # Seminar Handout: Order Sensitivity in Jeffrey Conditionalization

  ### Scenario: The Calibrated Clinician

  Dr. Aris is assessing a patient for Condition *Z*. She must decide whether to administer a toxic Treatment *T*. She will treat if and only if her credence in *Z* exceeds 0.75. Her prior credence is $P(Z) = 0.50$.

  Two diagnostic tests are available, but due to equipment limitations, neither yields a definitive positive/negative result. Instead, each produces an ambiguous "signal" that shifts her credence in a specific intermediate proposition. 
  *   **Test A** bears on proposition $A$ (e.g., "Biomarker is elevated"). 
  *   **Test B** bears on proposition $B$ (e.g., "Lesion is visible"). 

  Dr. Aris knows from extensive prior calibration that running Test A typically produces a signal warranting a shift to $P(A) = 0.90$, and Test B typically produces a signal warranting a shift to $P(B) = 0.90$. She does not know *why* the signals appear (she doesn't know if $A$ or $B$ is truly the case), but she knows the *epistemic impact* of the experiences. This foresight does not violate Reflection because she is predicting the impact of an experience, not the truth of the propositions.

  The propositions $A$ and $B$ are correlated in her prior (both are common effects of *Z*), and they differ in how strongly they indicate *Z*.
  *   $P(Z|A) = 0.80$, $P(Z|\neg A) = 0.20$.
  *   $P(Z|B) = 0.70$, $P(Z|\neg B) = 0.30$.

  Dr. Aris can choose the order of testing. She suspects the order matters.

  ### Calculations

  Dr. Aris updates by Jeffrey Conditionalization (JC). Rigidity holds for each update: conditional probabilities relative to the partition being updated remain fixed *during* that update. However, because the partitions are correlated, the first update changes the conditional probabilities relevant to the second.

  **Order 1: Test A, then Test B**
  1.  **Update on A** (shift $P(A)$ to 0.90):
      $$P'(Z) = 0.90(0.80) + 0.10(0.20) = 0.72 + 0.02 = \mathbf{0.74}$$
      *Decision check:* $0.74 < 0.75$ (Do not treat yet).
  2.  **Update on B** (shift $P'(B)$ to 0.90):
      Due to the correlation between $A$ and $B$, the first update alters the relevance of $B$ to $Z$. In $P'$, the conditional probabilities are now $P'(Z|B) = 0.75$ and $P'(Z|\neg B) = 0.59$.*
      $$P''(Z) = 0.90(0.75) + 0.10(0.59) = 0.675 + 0.059 = \mathbf{0.734}$$
      *Final Decision:* **Wait** ($0.734 < 0.75$).

  **Order 2: Test B, then Test A**
  1.  **Update on B** (shift $P(B)$ to 0.90):
      $$P^*(Z) = 0.90(0.70) + 0.10(0.30) = 0.63 + 0.03 = \mathbf{0.66}$$
  2.  **Update on A** (shift $P^*(A)$ to 0.90):
      The first update alters the relevance of $A$. In $P^*$, the conditional probabilities are now $P^*(Z|A) = 0.82$ and $P^*(Z|\neg A) = 0.20$.*
      $$P^{**}(Z) = 0.90(0.82) + 0.10(0.20) = 0.738 + 0.02 = \mathbf{0.758}$$
      *Final Decision:* **Treat** ($0.758 > 0.75$).

  *\*These shifted conditionals are derived from the prior joint distribution of A and B. They reflect that once A is made probable, B becomes less informative about Z (and vice versa), but asymmetrically.*

  ### Analysis

  **(a) The Divergence**
  The same two pieces of evidence, processed by the same rule, yield different decisions solely due to order. Order 1 results in withholding treatment; Order 2 results in administering it. The agent can foresee this divergence and select the order that aligns with her preferred outcome (or risk tolerance).

  **(b) Structural Feature**
  Order sensitivity arises because the partitions $\{A, \neg A\}$ and $\{B, \neg B\}$ are **probabilistically dependent** in the prior, and the hypothesis $Z$ is **differentially correlated** with them. 
  *   If $A$ and $B$ were independent, $P(Z|B)$ would not change after updating $A$, and the updates would commute.
  *   If $P(Z|A)$ and $P(Z|B)$ shifted symmetrically, the net effect might cancel out.
  The divergence is driven by the fact that the first update changes the *weight* and the *likelihood ratio* of the second partition simultaneously. Removing the correlation between partitions collapses the case into order-independence.

  **(c) Verdict on Rationality**
  This case indicts Jeffrey Conditionalization as a **complete** norm. It is not that JC is "wrong," but that it is under-constrained. It tells an agent how to update given an order, but not *which order to choose*. 
  *   **Supplementary Requirement:** Rationality requires a principle of **Order Invariance** or **Simultaneous Update**. An agent should update on the joint partition generated by both experiences $\{A \land B, A \land \neg B, \dots\}$ in a single step. 
  *   **Constraint for Limited Agents:** If an agent genuinely cannot entertain the joint partition (due to cognitive limits or sequential data arrival), the norm must prescribe a specific sequencing rule (e.g., "update on the most informative partition first") or require the agent to suspend judgment until both inputs are available to approximate a joint update.

  **(d) The Strongest Reply: "One Experience"**
  A defender of standard JC might argue that the two tests constitute a **single complex experience** received in instalments. If the total evidence is the conjunction of the two signals, there is only one update event, and order is illusory.
  *   **Assessment:** This reply is available only if the agent treats the sequence as a single unit. However, in this scenario, the tests are causally distinct processes separated in time. The agent *acts* between tests (she chooses the order). If the evidence were truly one unit, she could not strategically sequence it. Because she can intervene between the signals, they function as distinct updates, and the order sensitivity remains a genuine normative problem for the sequential application of JC.
