prompt: |-
  I'm a third-year PhD student in philosophy of cognitive science, and I've been asked to write a review of a new trade book on AI and common sense for our department's blog. The author is a well-known science writer, not a philosopher, and the first chapter is a big deflationary swipe at the frame problem. I need to be fair in print, so I want to know exactly what I can push back on and what I'd just be nitpicking.

  Here's the passage I'm stuck on (I'm paraphrasing closely but the wording is his, and it's all one continuous argument):

  'When McCarthy and Hayes coined the term in 1969, the frame problem was a bookkeeping headache with a price tag. A logic-based robot had to be told explicitly that pulling a wagon out of a room changes what's on the wagon but not the colour of the walls, and the number of these non-change axioms multiplies with every new fluent and every new action, so the whole enterprise was doomed by arithmetic. Their own diagnosis was that this is really the qualification problem: you can never finish listing the conditions under which an action works. Philosophers then took a technical curiosity and inflated it into a deep puzzle about relevance and meaning — how does any system decide which of the indefinitely many things that stay the same are worth checking? — and Dennett's story about a robot blown up by a bomb it failed to notice made that inflated version famous. But the inflation was a mistake, and I want to seperate three things people run together: the bookkeeping problem, the relevance problem, and the meaning problem. Only the first is the frame problem, and what I'll call the persistence tax — the cost of stating what doesn't change — was always just a scaling problem. Nonmonotonic logics and Reiter's situation calculus discharged it in the eighties, and the Yale Shooting Problem was the moment the community admitted the residue was computational rather than conceptual: you can always write down a consistent set of defaults, you may just need a lot of them. So the philosophers were chasing a ghost, and Dennett's robot that carefully derived where the bomb was but never derived that this mattered is a parable about a bug, not about the human condition. Today's large language models finish the job, because their weights encode a vast stock of learned defaults about what normally stays the same; they pay no persistence tax at all, since they never enumerate frame axioms.'

  Can you go through this claim by claim and tell me what someone who actually works on this would accept, what's a defensible simplification I shouldn't complain about, and what's wrong? A few things I specifically can't pin down:

  - Is his three-way split (bookkeeping / relevance / meaning) a fair way to carve up the literature, or does it quietly decide the question by stipulating that only the first one gets the name? What's the actual history of the term here — who used it narrowly, who broadened it, and is there a respectable reason to keep it narrow?
  - He says McCarthy and Hayes's diagnosis was that the frame problem is really the qualification problem. Are those the same thing, or has he collapsed two distinct problems (and if so, which is which)?
  - The robot story. Which robot fails for which reason, and does his description of the one that "derived where the bomb was but never that this mattered" match any of them? It feels off to me but I've only read the story secondhand, so I want to be sure before I say it in print.
  - "You can always write down a consistent set of defaults" — is that true, and what did the Yale Shooting Problem actually show? He's using it as evidence that the residue is computational; can it bear that weight?
  - Did the situation calculus really "discharge" the narrow problem, or does the successor-state-axiom approach buy the result with an assumption about the action description that's doing quiet work? If it's the latter, how much work?
  - Does the LLM conclusion follow from anything he's actually established, or only from the redefinition? And what's the strongest version of his argument — I want to steelman it in the review, because im sympathetic to the idea that a lot of the philosophy writing on this is unmoored from how the technical problem was actually handled.

  Finally: mark the spots where his framing is a live position with real defenders rather than a mistake, so I don't review the book as if it were confused when it's actually taking a side.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Third-year PhD student in philosophy of cognitive science.
      *   **Task:** Writing a review of a new trade book on AI and common sense for a department blog.
      *   **Constraint:** Needs to be fair in print (avoid nitpicking, identify genuine errors vs. defensible simplifications vs. live philosophical positions).
      *   **Input:** A paraphrased passage from the book's first chapter regarding the Frame Problem.
      *   **Specific Questions:**
          1.  Three-way split (bookkeeping/relevance/meaning): Fair carving or stipulative? History of the term?
          2.  McCarthy & Hayes diagnosis: Frame vs. Qualification problem. Collapsed or distinct?
          3.  The Robot Story (Dennett's robots): Which robot failed why? Does the description match?
          4.  "Consistent set of defaults" & Yale Shooting Problem (YSP): True? What did YSP show? Computational vs. Conceptual?
          5.  Situation Calculus/Successor State Axioms: Did they "discharge" the problem? Hidden assumptions?
          6.  LLM Conclusion: Does it follow? Strongest version (steelman)?
          7.  Live Positions: Identify where the author is taking a contested but defensible stance vs. making a factual error.

  2.  **Deconstruct the Passage & Address Specific Questions:**

      *   **Claim 1: The Three-Way Split (Bookkeeping/Relevance/Meaning).**
          *   *Analysis:* The author distinguishes the "logical frame problem" (persistence tax) from the "philosophical frame problem" (relevance/meaning).
          *   *History:* McCarthy & Hayes (1969) defined it technically (representing change without listing non-changes). Philosophers (Dennett, Fodor, Pylyshyn) broadened it to epistemic relevance (how to know what matters).
          *   *Verdict:* This is a *live position*. Many AI researchers (e.g., Shanahan, Thielscher) agree the technical problem is solved. Philosophers argue the *generalized* frame problem remains. The author is stipulating a narrow definition to declare victory, but it's not historically inaccurate to say the term broadened.
          *   *Advice:* Don't call it a mistake. Call it a terminological choice that sidelines the philosophical challenge.

      *   **Claim 2: McCarthy & Hayes Diagnosis (Frame = Qualification).**
          *   *Analysis:* The author claims M&H said Frame is *really* Qualification.
          *   *Fact Check:* M&H (1969) distinguished them. The Frame Problem is about *what stays the same*. The Qualification Problem is about *preconditions* (what could go wrong). They are siblings, not identical.
          *   *Verdict:* This is a factual error/conflation. M&H treated them as distinct though related representation issues.
          *   *Advice:* Push back gently. They are distinct "taxes" on representation.

      *   **Claim 3: Dennett's Robot Story.**
          *   *Analysis:* "Derived where the bomb was but never derived that this mattered."
          *   *Fact Check:* Dennett's fable (1984, "Cognitive Wheels") has three robots.
              *   R1D1: Deduces side effects (pulling wagon moves wall color). Runs out of time.
              *   R2D1: Tries to ignore irrelevant side effects. Runs out of time considering relevance.
              *   The point is *computational intractability of relevance*, not missing the bomb's location.
          *   *Verdict:* The author's description ("derived where the bomb was but never that this mattered") is slightly off. The robots failed because they were overwhelmed by *deductions*, not because they missed the relevance of the bomb specifically (they knew the bomb was dangerous, they couldn't filter the *implications* of their actions in time).
          *   *Advice:* Correct the detail. The point of the fable is the *explosion of relevance*, not a specific failure to link bomb to danger.

      *   **Claim 4: "Consistent set of defaults" & Yale Shooting Problem (YSP).**
          *   *Analysis:* Author says YSP showed residue is computational, not conceptual. "You can always write down a consistent set."
          *   *Fact Check:* YSP (Hanks & McDermott, 1987) showed that *early* nonmonotonic logics (like default logic) yielded *ambiguous* or *wrong* results (the gun might be unloaded at the end even if not stated). It wasn't just computational cost; it was semantic correctness. Later solutions (minimization of change, etc.) fixed it.
          *   *Verdict:* Misleading. YSP showed that naive defaults fail *logically*, not just computationally. However, the author is right that solutions were found (Sandewall, etc.).
          *   *Advice:* Nuance this. YSP showed the *logical* solutions were harder than thought, not just scaling. But yes, technical solutions exist.

      *   **Claim 5: Situation Calculus / Successor State Axioms (SSAs).**
          *   *Analysis:* Author says Reiter's SSAs "discharged" the problem.
          *   *Fact Check:* Reiter (1991) provided a systematic way to generate SSAs *if* you have a complete list of effect axioms. This solves the *representational* frame problem (writing the axioms). It assumes the "completeness of the action description."
          *   *Verdict:* Defensible simplification for a trade book, but philosophically significant. It solves the problem *given* omniscience about effects. It doesn't solve how to *get* those axioms in an open world.
          *   *Advice:* Acknowledge the technical success but note the "closed world" assumption hidden inside.

      *   **Claim 6: LLMs and the Persistence Tax.**
          *   *Analysis:* LLMs encode defaults in weights, pay no persistence tax.
          *   *Fact Check:* LLMs don't explicitly represent frame axioms. They predict tokens based on statistical regularities. They *implicitly* handle persistence (walls don't usually change color).
          *   *Verdict:* This is the "steelman" opportunity. The argument is: Connectionism bypasses the symbolic frame problem.
          *   *Critique:* LLMs have their own "hallucination" frame problems (they don't *know* what persists, they guess). They fail at long-horizon planning where persistence matters.
          *   *Advice:* Steelman as "dissolving" the symbolic problem, but note that empirical evidence shows LLMs struggle with physical common sense (the *generalized* frame problem).

  3.  **Synthesize and Structure the Response:**
      *   **Tone:** Professional, collegial, precise (PhD to PhD).
      *   **Structure:**
          1.  **Executive Summary:** Overall assessment (mix of technical accuracy and philosophical stipulation).
          2.  **Claim-by-Claim Breakdown:** Address the 6 specific bullet points from the prompt.
          3.  **Live Positions vs. Errors:** Explicitly categorize what is a debate vs. what is wrong.
          4.  **Steelmanning the LLM Argument:** How to present the strongest version of his conclusion.
          5.  **Review Strategy:** How to write the review fairly.

  4.  **Drafting the Content (Iterative refinement):**
      *   *Refining the M&H point:* Make sure to distinguish Frame (effects) from Qualification (preconditions). The author says M&H diagnosed Frame *as* Qualification. That's wrong. M&H named both.
      *   *Refining Dennett:* Ensure the distinction between R1D1 and R2D1 is clear. The author conflates them.
      *   *Refining YSP:* Emphasize that YSP was a *failure of semantics* in nonmonotonic logic, not just complexity.
      *   *Refining Reiter:* Highlight the "completeness assumption."
      *   *Refining LLMs:* Distinguish between "not paying the tax" (true, no axioms) and "solving the problem" (debatable, they fail differently).

  5.  **Final Review against User Constraints:**
      *   Did I answer the specific bullet points? Yes.
      *   Did I mark live positions? Yes.
      *   Is the tone appropriate? Yes.
      *   Did I help them avoid nitpicking while maintaining rigor? Yes.

  6.  **Final Polish:** Check for clarity and ensure the distinction between the "Technical Frame Problem" (AI) and "Philosophical Frame Problem" (Cognitive Science) is clear, as this is the crux of the user's dilemma. (Self-correction: Ensure I mention that the "Philosophical Frame Problem" is often associated with Fodor's global relevance problem, which is distinct from McCarthy's).

  7.  **Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a classic "two cultures" moment: the author is writing from the perspective of *technical AI history* (where the frame problem is largely considered a solved engineering hurdle), while you are reviewing from *philosophy of cognitive science* (where the frame problem is often treated as an open conceptual challenge regarding relevance and context).

  The author is not "confused" in a way that warrants a takedown, but he is making specific terminological and historical choices that privilege the AI engineering narrative over the philosophical one. Below is a claim-by-claim breakdown to help you distinguish between **factual errors**, **defensible simplifications**, and **live philosophical disputes**.

  ### 1. The Three-Way Split (Bookkeeping / Relevance / Meaning)
  *   **The Claim:** The author separates the "bookkeeping problem" (persistence tax), the "relevance problem" (what to check), and the "meaning problem" (semantics). He asserts only the first is the *real* Frame Problem.
  *   **Verdict:** **Live Position / Terminological Stipulation.**
  *   **Analysis:** This is the crux of the disagreement.
      *   **History:** McCarthy and Hayes (1969) defined the Frame Problem narrowly as the representational issue of specifying what *does not* change without writing infinite axioms.
      *   **Broadening:** In the 1980s, philosophers (most notably Daniel Dennett in "Cognitive Wheels" and Jerry Fodor in *The Modularity of Mind*) generalized the term. For them, the "Frame Problem" became the problem of *global relevance*: how does a cognitive system determine which of indefinitely many facts are relevant to a specific action without checking them all?
      *   **The Author's Move:** By insisting the term applies *only* to the 1969 logical bookkeeping issue, the author can declare the problem "solved" (because AI solved the bookkeeping issue). By excluding the philosophical relevance problem from the definition, he sidesteps the harder cognitive science question.
  *   **Review Advice:** Do not call this a mistake. Call it a **restrictive definition**. You can note that while this matches the AI engineering consensus (e.g., positions held by Murray Shanahan or Erik Sandewall), it explicitly brackets out the epistemological problem that motivates most philosophers of cognitive science. It's not nitpicking to point out that the "Generalized Frame Problem" is the reason the term remains famous in your department.

  ### 2. McCarthy & Hayes: Frame vs. Qualification
  *   **The Claim:** "Their own diagnosis was that this is really the qualification problem."
  *   **Verdict:** **Factual Error.**
  *   **Analysis:** McCarthy and Hayes distinguished these clearly in the 1969 paper.
      *   **Frame Problem:** How to represent what *stays the same* after an action (the "persistence tax").
      *   **Qualification Problem:** How to list all the *preconditions* required for an action to succeed (e.g., to start a car, the battery must work, there must be gas, the key must turn, aliens must not have disabled the engine, etc.).
  *   **Why it matters:** They are siblings, not identical. The Qualification Problem is generally considered *harder* and less "solved" than the Frame Problem. Collapsing them suggests the author thinks solving persistence solves qualification, which is not the case.
  *   **Review Advice:** This is a legitimate correction. You can note that while they are related representation issues, conflating them obscures the fact that the Qualification Problem remains a significant hurdle for open-world reasoning.

  ### 3. Dennett's Robot Story
  *   **The Claim:** "Dennett's robot that carefully derived where the bomb was but never derived that this mattered..."
  *   **Verdict:** **Inaccurate Description.**
  *   **Analysis:** In Dennett's 1984 fable ("Cognitive Wheels"):
      *   **R1D1:** Designed to consider side effects. It deduces that pulling the wagon changes the wall color. It runs out of time before acting because it deduces *too many* true but irrelevant facts.
      *   **R2D1:** Designed to ignore irrelevant side effects. It runs out of time *trying to determine what is irrelevant*.
      *   **The Point:** Both robots explode. The failure isn't that they didn't know the bomb mattered (they were designed to save themselves); the failure is that the *computational cost of filtering relevance* was too high.
  *   **Review Advice:** The author's phrasing ("never derived that this mattered") implies a failure of semantic understanding. Dennett's point was a failure of *computational tractability*. This is a subtle but important distinction. If the robot knew it mattered but couldn't compute the implication in time, that supports the author's "scaling problem" view. If the robot didn't know it mattered, that supports the "meaning" view. Dennett meant the former, but the author's phrasing leans toward the latter.

  ### 4. "Consistent Set of Defaults" & The Yale Shooting Problem (YSP)
  *   **The Claim:** "You can always write down a consistent set of defaults... YSP was the moment the community admitted the residue was computational rather than conceptual."
  *   **Verdict:** **Defensible Simplification (with caveats).**
  *   **Analysis:**
      *   **YSP (Hanks & McDermott, 1987):** This actually showed that early nonmonotonic logics (like Default Logic) produced *ambiguous* or *incorrect* extensions (the gun could be magically unloaded). It was a **semantic** failure, not just a computational one. It showed that "minimizing change" wasn't enough; you needed to minimize change *causally*.
      *   **Resolution:** Later work (Sandewall, Gelfond & Lifschitz) did resolve YSP using more sophisticated semantics (e.g., Action Languages).
      *   **The Author's Point:** He is right that the community eventually found consistent logical formalisms. He is glossing over the fact that YSP showed the *initial* solutions were conceptually flawed, not just slow.
  *   **Review Advice:** Accept the conclusion (the technical problem was solved) but correct the history slightly. YSP showed the *logical* solutions were harder than anticipated, requiring causal minimization, not just default rules.

  ### 5. Situation Calculus & Successor State Axioms (SSAs)
  *   **The Claim:** "Reiter's situation calculus discharged it... you can always write down a consistent set."
  *   **Verdict:** **Defensible Simplification (The "Closed World" Catch).**
  *   **Analysis:** Ray Reiter's SSAs (1991) are the standard solution to the representational frame problem. They allow you to generate frame axioms automatically *if* you have a complete list of effect axioms.
      *   **The Catch:** This assumes **completeness of the action description**. You must know *all* the ways an action can change the world to write the SSA that says everything else stays the same.
      *   **Philosophical Work:** This buys the solution at the price of assuming a closed world. It solves the problem for a robot that knows all the rules, not for a learner in an open world.
  *   **Review Advice:** This is a strong point for your review. Acknowledge Reiter's success but note that it relies on the assumption that the agent already possesses a complete causal model. It solves the *representation* of persistence, not the *acquisition* of knowledge about persistence.

  ### 6. The LLM Conclusion
  *   **The Claim:** "Today's large language models finish the job... weights encode a vast stock of learned defaults... they pay no persistence tax."
  *   **Verdict:** **Live Position (The "Dissolution" Argument).**
  *   **Analysis:** This is the strongest part of his argument to steelman.
      *   **The Argument:** Connectionist systems do not represent frame axioms explicitly. They learn statistical correlations of persistence from data. Therefore, the "tax" of writing axioms is bypassed.
      *   **The Counter:** LLMs do not *know* what persists; they predict tokens. They hallucinate changes (e.g., in long context windows, they forget object permanence). They solve the *representational* frame problem by ignoring representation, but they inherit a *probabilistic* frame problem (reliability).
  *   **Review Advice:** Steelman this as: "The author argues that deep learning dissolves the symbolic frame problem by shifting the burden from explicit axiomatization to implicit statistical learning." Then, critique it empirically: "However, recent benchmarks suggest LLMs struggle with physical common sense reasoning precisely where frame assumptions are required (e.g., reasoning about object permanence over long horizons)."

  ---

  ### Summary: Where to Push Back vs. Where to Yield

  | Claim | Status | How to Handle in Review |
  | :--- | :--- | :--- |
  | **3-Way Split (Bookkeeping vs. Relevance)** | **Live Position** | Acknowledge this is the AI consensus (e.g., Shanahan), but note it excludes the Fodor/Dennett "Generalized Frame Problem" which remains open in cog sci. |
  | **Frame = Qualification** | **Error** | Gently correct. M&H distinguished them. Qualification (preconditions) is distinct from Frame (effects). |
  | **Dennett's Robot** | **Inaccurate** | Clarify the robots failed due to *combinatorial explosion of relevance*, not failure to see the bomb mattered. |
  | **YSP = Computational Residue** | **Simplification** | Note YSP was initially a semantic failure, later solved by causal minimization. |
  | **Reiter/SSAs "Discharged" It** | **Qualified Truth** | Accept for symbolic AI, but note the "completeness assumption" (closed world) required to make it work. |
  | **LLMs Solve It** | **Speculative** | Steelman as "dissolving the symbolic burden," but question if statistical prediction equals common sense understanding. |

  ### Strategic Advice for the Review

  1.  **Validate the Technical History:** Start by conceding that the author is correct that *symbolic AI* largely solved the *representational* frame problem (via Reiter, Sandewall, etc.). This establishes your credibility and fairness. You aren't a philosopher who ignores the tech.
  2.  **Pivot to the Generalized Problem:** Frame your critique not as "you are wrong," but as "you have chosen the narrow definition." Write something like: *"The author is right that the 1969 logical puzzle has technical solutions. However, by restricting the definition to the logical puzzle, he sidesteps the epistemological puzzle that keeps philosophers awake: how does a system learn which axioms to write in the first place?"*
  3.  **The LLM Steelman:** Give him credit for the LLM argument. It is a genuine hypothesis in cognitive science that connectionism bypasses symbolic bottlenecks. Your critique should be empirical: *"While LLMs avoid the persistence tax of axioms, they pay a 'hallucination tax' of reliability. Whether this is a trade-off we accept is the real question."*
  4.  **Tone:** Avoid "The author misunderstands Dennett." Instead use: "The author's retelling of Dennett's fable emphasizes the computational cost, which serves his argument, though Dennett's original point also highlighted the difficulty of defining relevance itself."

  By taking this approach, you respect the author's technical accuracy on the AI history while maintaining the philosophical rigor required for your department's blog. You aren't nitpicking; you're contextualizing.
