answer: |-
  ### 1. The Principle: Diagnosable Evolutionary Independence

  You are not using the Biological Species Concept (reproductive isolation), the Phylogenetic Species Concept (monophyly), or the Morphological Species Concept (physical difference) in isolation. You are applying a weighted hybrid I will call **Diagnosable Evolutionary Independence (DEI)**.

  **The Rule:** A population constitutes a "species" for the purpose of legal protection if it represents a **separate evolutionary trajectory** that is **diagnosably distinct** from other such trajectories, where "diagnosable" prioritizes ecological/behavioral mechanisms over raw genetic distance.

  **The Clauses:**

  *   **Clause A (The Engine): Independent Trajectory.** The population must be evolving separately from others, evidenced by long-term isolation or intrinsic barriers.
      *   *Handled Cases:* **Lake Fish** (allopatry/time ensures independent fate); **Marsh Grass** (polyploidy creates instant independent trajectory); **Neanderthals** (extinct lineage, distinct fate despite leakage).
  *   **Clause B (The Evidence): Diagnosable Discontinuity.** There must be a non-arbitrary gap in phenotype, behavior, or ecology that maintains the separation. Genetic divergence alone is not a gap.
      *   *Handled Cases:* **Forest Birds** (song barrier); **Ducks (1 in 7)** (stable contact zone implies strong selection maintaining difference); **Gut Bacteria** (tight genetic cluster implies ecological niche distinctness); **Neanderthals** (morphological/behavioral distinctness).
  *   **Clause C (The Exclusion): Genetic Divergence Insufficiency.** Deep genetic clades do not warrant species status if there is no phenotypic/ecological discontinuity and gene flow persists.
      *   *Handled Cases:* **Widespread Beetle** (refused to split despite clades); **Island Lizards** (lumped despite genetics because migrants exchanged).
  *   **Clause D (The Exception): Gene Flow Permissibility.** Current or historical gene flow does not negate species status if Clause B (Discontinuity) is maintained by selection or behavior.
      *   *Handled Cases:* **Neanderthals** (introgression ignored); **Ducks (1 in 7)** (hybridization ignored); **Salamanders** (the "two ends" half of your intuition).

  *   **Clause E (The Administrative Save):** *This clause exists solely to handle the Bacteria case.* In asexual or highly recombinant taxa, "Diagnosable Discontinuity" is met by statistical genetic clustering that correlates with ecological function, even without reproductive isolation.

  ### 2. Running the Principle on New Cases

  **(a) Mountain Butterfly (Stable Hybrid Belt)**
  *   **Verdict:** **Two Species.**
  *   **Reasoning:** Fits Clause A and B. The hybrid belt is stable and hybrids do badly. This indicates strong selection *against* mixing, meaning the two populations are maintaining distinct evolutionary trajectories despite contact. The "fixed different wing pattern" satisfies Diagnosable Discontinuity.
  *   **Principle Check:** Consistent with the Ducks (1 in 7) case.

  **(b) Asexual Freshwater Snails (Dozen Distinct Lineages)**
  *   **Verdict:** **Twelve Species.**
  *   **Reasoning:** Fits Clause A and E. Without sex, "reproductive isolation" is meaningless. Each lineage is a separate evolutionary trajectory (Clause A). If they are "distinct-looking," they satisfy Diagnosable Discontinuity (Clause B).
  *   **Principle Check:** Consistent with the Bacteria case.

  **(c) Aquarium Fish Lineage (60 Years, Visible Change, Fertile with Wild)**
  *   **Verdict:** **Not a Species.**
  *   **Reasoning:** Fails Clause A. Sixty years is negligible evolutionary time, and the "lineage" is maintained by artificial selection, not independent natural trajectory. Crucially, it "breeds fine with wild stock," meaning no intrinsic barrier exists and the distinctness is not maintained in the wild. It is a morph, not a lineage.
  *   **Principle Check:** Consistent with the Beetle case (genetics/looks aren't enough without independent fate).

  **(d) Fossil Bones (3 Million Years Old)**
  *   **Verdict:** **Provisional Species (Morphospecies).**
  *   **Reasoning:** Fits Clause B as a proxy for Clause A. We cannot test gene flow or ecology. We must assume morphological discontinuity in the fossil record correlates with independent evolutionary trajectory. You vote "Yes" but annotate it as "based on morphological distinctness only."
  *   **Principle Check:** Consistent with Neanderthals (where morphology/history outweighs genetic leakage).

  ### 3. The Sacrifice: Drop the "One Species" Half of the Salamander Case

  You have one genuine contradiction in your record: the Ring Salamanders. You want to call them *one* species (because of the ring) and *two* species (because the ends don't mix). You cannot do both on a legal list.

  **The Verdict to Overturn:** Drop the intuition that they are **One Species**. Vote **Two Species** for the terminal populations.

  **Reasoning:**
  Your DEI principle prioritizes *current* evolutionary trajectory and diagnosable discontinuity (Clauses A & B). The "One Species" verdict relies on the *historical* connection via the northern ring. But that connection is geographically remote and functionally irrelevant to the two ends where they meet. At the point of contact (the south), they behave as strangers (your description). They are not exchanging genes there. They are on separate trajectories *at the point of sympatry*.

  For a landowner whose creek gets regulated, "Species" means "Unit of Conservation." If the southern end is distinct and non-interbreeding, it is a distinct unit of conservation. Protecting the "Ring" as one unit might allow the distinct southern end to be lost if the northern ring is abundant. Splitting them protects the distinct evolutionary fate. The "Ring" is a fascinating biological *process*, but the "Ends" are the legal *entities*.

  ### 4. Ontology: Hypotheses, Not Chunks

  **The Claim:** Species are not immutable "chunks" of the world waiting to be found, nor are they arbitrary "bookkeeping" lines drawn for convenience. They are **scientific hypotheses about causal processes.**

  When you vote "Yes," you are not saying "I found the essence of this animal." You are saying: *"I hypothesize that these two populations are now causally distinct systems that will continue to evolve separately even if they come into contact."*

  **Does this change how you vote?**
  Yes. It shifts your burden of proof from **Difference** to **Independence**.
  *   **Difference alone is insufficient:** This stops you from splitting the Beetles just because genetics show clades. Clades are history; species are current processes.
  *   **Independence is sufficient:** This allows you to split the Lake Fish (allopatry guarantees independence) and the Neanderthals (distinct lineage despite leakage).

  **Why this matters for the Committee:**
  When a landowner asks, "Why is this duck a species when it breeds with that duck?", you do not say, "Because the book says so." You say: *"Because the evidence shows that despite occasional mixing, natural selection keeps them on separate paths. If we regulate them as one, we risk losing one of those paths forever."*
  This justifies the Duck (1 in 7) verdict over the Duck (1 in 40) verdict. In the first, selection maintains the gap (Independence). In the second, the gap is trivial (paleness) and likely drifting (no Independence).

  ### 5. Flagging Sneaky Work in Your Descriptions

  You have quietly built the answers into three of your case descriptions. Be careful with these in future hearings:

  1.  **The Ducks:** You described the 1-in-7 pair as staying "clean everywhere else" but the 1-in-40 pair as differing by a "slightly paler head." You smuggled **selection strength** into the first case and **drift/triviality** into the second. If the 1-in-40 pair differed in *song* but not color, you might have voted differently. Be explicit that *mechanism* matters, not just the hybridization rate.
  2.  **The Salamanders:** You wrote that the ends "behave like strangers." This is the heavy lifter. If they merely *looked* different but tried to mate and failed only due to geography, your "Two Species" intuition would be weaker. "Behaving like strangers" implies behavioral isolation, which triggers Clause B.
  3.  **The Neanderthals:** You state "Separate species, still, no hesitation." This relies on the hindsight that they are extinct and we are not (divergent fates). If Neanderthals were alive today and hybridizing at 2%, your hesitation would likely increase. Your verdict leans on the *completed* separation, not the process.

  **Final Advice:**
  Adopt the **Diagnosable Evolutionary Independence** principle. It matches 90% of your intuition but forces you to resolve the Salamander paradox. Tell the committee: *"We are not voting on whether these animals are different. We are voting on whether they are separate. If they are separate systems, they get separate protection."* That is a defensible position for a landowner, a biologist, and a lawyer.
