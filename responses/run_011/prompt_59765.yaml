  You're a professional philosopher of mind who's done a lot of podcast interviewing — act like one, and think carefully before answering: start by brainstorming, in three or four lines, the places where this position is most exposed, then write the questions.

  I host a small podcast and next week's guest has written a book that flips the standard reading of sphexishness. Hofstadter coined the term from Fabre's digger wasp and treats consciousness as antisphexishness taken to the highest degree, with rigidity and flexibility as two ends of one continuum. My guest says that gets it backwards: the paradigm of agency isnt the capacity to re-optimise but the routines that refuse to re-optimise — keeping a promise, applying a rule of law the same way twice, staying with someone you no longer feel like staying with. She also leans on the fact that Fabre's wasp anecdote (Souvenirs Entomologiques, first volume, 1879) has been challenged as entomologically questionable, and argues that even if the wasp were as rigid as advertised, that wouldn't make rigidity a mark of the non-agential.

  Draft eight to ten interview questions, each with a follow-up keyed to the answer she's most likely to give. Nothing generic — no "what drew you to this topic," no requests to restate the view. I want at least one question on each of:

  - whether her binding rigidity and Hofstadter's antisphexishness are genuinely distinct properties, or the same property under a flattering name;
  - the regress: if a routine can be overridden by a monitoring routine, isn't the monitor sphexish too — does she dissolve the homunculus regress or just move it upstairs;
  - how you can tell flexible from rigid behaviour in advance rather than only calling it flexible once it worked;
  - weakness of will, and whether the person who caves in counts on her view as freer than the one who holds out;
  - what all this implies about a system that re-derives its values in every new context — the ideal or the nightmare;

  and end with one question about what observation would count against her account.

  She's slippery. When pressed she tends to say "flexibility is just rigidity at a longer timescale." Structure the final three questions so that reply becomes progressively harder to reach for.
