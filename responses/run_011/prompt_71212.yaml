  The dust in the garage hung in the shafts of light, settling on the clipboard between us. I tapped the pen against the line for *Item 1*.

  "The bicycle," I said. "One item."

  "Twenty-six," said Mara, the nihilist. She was crouched by the wheel hub, tracing the rim. "Twenty-six simples arranged bicycle-wise. To count them as one is to lie to the court about what exists."

  "The court doesn't want a metaphysics lesson, Mara. They want to know what gets distributed. If I write 'twenty-six metal and rubber simples,' the executor sells the parts individually. He wants to sell a bike."

  "And if the bike is broken?" Mara stood, wiping grease on her jeans. "You'd write 'broken bicycle.' But on my view, that sentence is true only because the simples are arranged *brokenly*. The chain simples are disconnected from the gear simples. There is no bicycle to bear the property of brokenness."

  "So you deny the truth of 'The bicycle is broken'?"

  "No. I deny the ontology. The truth-maker is just the spatial relations of the parts. Take the jar of screws." She pointed to the workbench. "You'd say there are more screws in the left jar than the right. I say there are more screw-shaped simples arranged jar-wise on the left than on the right. The count holds without the composites."

  I leaned against the unfinished shelving unit. It was a skeleton of pine and brackets, leaning precariously. "But consider this shelf. You'd say it's unfinished. How do you paraphrase that without implying a whole that *could* be finished?"

  Mara didn't blink. "The simples are arranged in a pattern that lacks the completion simples required for stability. It's a description of gaps, not a failed object."

  I pressed my pen into the clipboard. "You keep using the word 'arranged.' If there are no objects, what is doing the arranging? Is the arrangement itself a thing? If it is, you've smuggled composition back in. You've got simples plus an arrangement relation composing a state of affairs. If it isn't a thing, how does it ground the truth of your paraphrases?"

  Mara hesitated, looking at the dust motes. "The relation is internal. It costs me nothing ontologically. But I concede this: my paraphrases are cumbersome. They lose the functional unity your count captures. When I say 'simples arranged bicycle-wise,' I lose the modal force that the bike *could* be ridden. I have to add more clauses about potential interactions. It costs me the elegance of my own ontology."

  "Fair," I said. "But look at the shelf again. On my view, the shelving unit exists. But so does the mere sum of its parts. They are in the same place at the same time. Coincidence. Ontologically, that's two items. The sum exists regardless of function; the shelf exists because of function. If I count for the court, do I list both? If I list only the shelf, I'm ignoring the sum. If I list both, I'm inflating the estate."

  "You're conflating ontology with pragmatics," Mara said. "But isn't that your problem? You believe everything composes. The sum of the bike and the jar exists. Why isn't that Item 2?"

  "Because the court cares about sortals. Functional units. I count bikes and jars, not arbitrary sums."

  "Then your count isn't driven by your metaphysics. It's driven by human interest."

  "Exactly. Which brings us to the middle ground." I gestured to the dust. "Some say composition occurs only where the result is a life. An organism. That would save us counting the shelf or the bike. Only the uncle would have counted, while he lived."

  Mara shook her head. "I reject that. There are no lives, strictly speaking. Only simples arranged organism-wise. To privilege biological arrangements is arbitrary mysticism. If simples don't compose for wood, they don't compose for flesh."

  "And I reject it," I said, "because it's too restrictive. Why should biology be the magic glue? If any parts can compose, why not tables? But I concede your point on the count. My ontology allows for infinite objects in this garage—the sum of the left half of the bike and the right jar, and so on. Metaphysics doesn't dictate the inventory number. Pragmatics does. It costs me the idea that my universalism solves the counting problem. It creates it."

  "So we agree on the number?" Mara asked.

  "For the court, yes. One bike. One jar. One shelf."

  "But we disagree on why."

  "You think you're counting patterns of simples," I said. "I think you're counting functional objects out of an infinite sea of sums."

  "Then who is worse off?" Mara asked, looking at the shelf. "I have to paraphrase every claim. You have to explain why you ignore most of what exists."

  "I have to explain why the court doesn't care about the sums," I said. "You have to explain why the court cares about the patterns. But the court acts on function. They sell the bike. They don't sell the arrangement."

  "Then the metaphysics is silent," Mara said. "It doesn't help us fill the form."

  "It prevents us from filling it wrong," I said. "If I believed only the shelf existed and not the sum, I might miss the parts. If you believed the bike was a substance, you might not see it's salvageable."

  Mara picked up a bracket from the floor. "Item 27?"

  "Item 27," I said, writing it down. "Bracket."

  "Simple," she said.

  "Functional unit," I corrected.

  We signed the page. The garage remained full of things, or arrangements, waiting to be moved.
