answer: |-
  (a) **Exam Question Stem**

  **Midterm Examination: The Psychology of Moral Disagreement**
  **Time Allowed:** 40 Minutes
  **Total Marks:** 20
  **Conditions:** Closed book. No notes, devices, or materials permitted.

  **Question 1**

  Consider the following three stipulated findings regarding moral judgment:

  *   **Study 1:** A survey administered in twenty-four countries finds that in every one of them, harm-based and fairness-based considerations predict condemnation of a described act more strongly than considerations of loyalty, authority, or purity. In every one of them, respondents placing themselves on the political right endorse all five kinds of consideration more evenly than respondents on the left, who concentrate on harm and fairness. The pattern holds both within societies and across them.
  *   **Study 2:** The same instrument is re-administered with only the fairness items rewritten. When fairness is operationalized as proportionality of reward to contribution, the left–right difference on fairness is at its largest; when it is operationalized as equality of outcome, that difference disappears entirely. Nothing else in the instrument is altered.
  *   **Study 3:** Participants are presented with purity violations stipulated to involve no identifiable victim and no plausible harm to anyone. A substantial proportion nevertheless condemn the acts as morally wrong. Asked to justify the condemnation, they can offer nothing beyond the act's being degrading, revolting, or unnatural; a minority, having exhausted every reason they can think of and been shown that the reason does not apply, refuse to withdraw the judgment. Disgust-sensitivity scores predict condemnation here even after controlling for religiosity and political orientation.

  **Task:**
  Mere recitation of the theory underlying these studies will receive minimal credit. Similarly, answers that simply invoke the distinction between descriptive and normative claims to conclude that no inference is possible will receive minimal credit.

  Taking Studies 1–3 as given:
  1.  State exactly what further premise or premises would be required for the asymmetry in Study 1 to count as evidence that one moral profile (liberal or conservative) is more accurate than the other.
  2.  Formulate the most defensible version of such a premise you can.
  3.  Identify one consideration, drawn from Study 2 or Study 3, that would undermine this premise, and explain why it does so.

  ***

  (b) **Model Answer**

  To move from the descriptive asymmetry in Study 1 to a normative verdict regarding which moral profile is more accurate, one must supply a bridge premise linking psychological prevalence to moral truth. Study 1 establishes that harm and fairness concerns are more universally predictive of condemnation than loyalty, authority, or purity concerns, and that liberal psychology aligns more closely with this universal pattern. However, the fact that a judgment is more common, or more strongly predicted by certain variables, does not logically entail that the judgment is correct. To conclude that the liberal profile is normatively superior based on Study 1, one must adopt a premise such as: *Moral truths are those that resonate with the most stable, cross-culturally universal psychological dispositions.* Alternatively, one might argue: *Moral progress consists in the prioritization of concerns that minimize identifiable suffering over concerns regarding social order or sanctity.*

  The most defensible version of this bridge premise avoids claiming that popularity equals truth. Instead, it might claim that *foundations which are robust across diverse cultural contexts are more likely to track objective moral properties than foundations that are culturally variable.* This appeals to a form of moral realism where psychological universality is evidence of tracking mind-independent moral facts, similar to how perceptual universality might track physical objects. If harm avoidance is universal, it suggests harm is objectively bad. If purity concerns vary more by politics or culture, they might be local conventions rather than moral truths.

  However, Study 2 severely undermines this premise by challenging the stability of the constructs themselves. In Study 1, "fairness" appears to be a universal foundation favored by liberals. But Study 2 reveals that this universality is fragile; it depends entirely on how fairness is defined. When fairness means equality, liberals and conservatives agree. When it means proportionality, they diverge. This suggests that the "universal" foundation identified in Study 1 is not a stable psychological tracker of a single moral property, but rather a label covering distinct, conflicting intuitions. If the psychological disposition is not stable across operationalizations, it cannot serve as the robust anchor required by the bridge premise. The asymmetry in Study 1 may reflect semantic disagreement rather than a difference in moral accuracy, rendering the inference from psychology to truth invalid.

  Furthermore, Study 3 highlights a symmetry in the genetic fallacy that threatens any attempt to use psychology to debunk one side while vindicating the other. A proponent of the liberal view might use Study 3 to argue that purity judgments are unreliable because they are driven by disgust and lack articulable reasons. They might argue that because these judgments persist even when reasons are exhausted, they are mere emotional artifacts. However, if we dismiss purity judgments because they arise from non-inferential processes like disgust, we must apply the same standard to harm and fairness judgments. If the origin of a belief (e.g., evolutionary disgust sensitivity) undermines its justification, then the evolutionary origin of harm-avoidance (e.g., empathy or distress sensitivity) undermines it equally. To claim that disgust debunks purity but empathy vindicates harm is to presuppose the verdict one is trying to prove.

  Therefore, the bridge premise required to validate Study 1 is either falsified by the construct instability shown in Study 2, or it commits the genetic fallacy highlighted by Study 3. To assert that the liberal profile is more accurate because it relies on "universal" foundations presupposes that universality tracks truth, a claim Study 2 weakens. To assert it because conservative foundations rely on "irrational" disgust presupposes that liberal foundations do not rely on similar non-inferential processes, which Study 3 suggests they likely do. Without a premise that can survive these empirical challenges without begging the question, the descriptive data cannot bear the normative weight.

  ***

  (c) **Marking Scheme (20 Marks)**

  **1. Identification of the Inferential Gap (3 Marks)**
  *   **Full Marks:** Explicitly states that Study 1 provides descriptive data (prevalence/prediction) which cannot yield a normative verdict (accuracy/truth) without an additional assumption.
  *   **Partial:** Mentions the gap but treats it as a hard stop (Is/Ought dismissal) rather than a hurdle to bridge.
  *   **Zero:** Recites MFT findings without addressing the inference problem.
  *   *Common Botch:* Students treat the Is/Ought distinction as a conversation-ender rather than identifying the specific *type* of premise needed to cross it.

  **2. Formulation of a Bridge Premise (4 Marks)**
  *   **Full Marks:** Proposes a specific premise linking psychology to truth (e.g., "Universality implies objectivity" or "Stable dispositions track moral facts").
  *   **Partial:** Offers a vague premise (e.g., "Psychology matters for ethics") without specifying the mechanism.
  *   **Zero:** No premise offered; jumps straight from data to conclusion.
  *   *Common Botch:* Students assume the premise is "Majority rule" rather than a claim about the *epistemic status* of universal dispositions.

  **3. Deployment of Study 2 (Construct Validity) (4 Marks)**
  *   **Full Marks:** Uses Study 2 to argue that the "fairness" foundation is not a stable construct, undermining the premise that universality equals truth.
  *   **Partial:** Notes the difference in fairness definitions but treats it as a measurement error rather than a conceptual threat.
  *   **Zero:** Ignores Study 2 or claims it is irrelevant to the normative question.
  *   *Common Botch:* Treating the disappearance of the fairness gap in Study 2 as a mere measurement nuisance rather than as a threat to the claim that the foundations are genuinely distinct constructs rather than facets of a single disposition plus item content.

  **4. Deployment of Study 3 (Genetic Fallacy Symmetry) (4 Marks)**
  *   **Full Marks:** Argues that using Study 3 to debunk purity (via disgust/lack of reasons) requires applying the same debunking logic to harm/fairness, creating a symmetry that blocks the normative verdict.
  *   **Partial:** Notes that purity judgments lack reasons but fails to apply the same standard to liberal judgments.
  *   **Zero:** Claims Study 3 proves purity judgments are not moral judgments.
  *   *Common Botch:* Treating the failure to articulate reasons in Study 3 as showing that purity judgments are not moral judgments, rather than as showing only that such judgments need not issue from articulable inference.

  **5. Assessment of Circularity/Question-Begging (3 Marks)**
  *   **Full Marks:** Concludes that any premise defending the liberal profile as "more accurate" likely presupposes the definition of morality that favors the liberal profile.
  *   **Partial:** Mentions circularity but does not explain how the premise presupposes the verdict.
  *   **Zero:** Claims the data definitively proves one side is right.
  *   *Common Botch:* Reading Study 1's cross-national regularity as either establishing that the foundations track real moral properties or establishing that they are evolutionary artifacts, when both readings require precisely the premise the question is after.

  **6. Synthesis and Clarity (2 Marks)**
  *   **Full Marks:** Argument flows logically; conclusion directly answers the prompt's three sub-tasks.
  *   **Partial:** Disorganized or misses one sub-task.
  *   **Zero:** Incoherent or illegible.

  **Differentiation Guide:**
  *   **A Range (17-20):** Successfully identifies a defensible bridge premise, then dismantles it using the specific empirical threats in Studies 2 and 3. Recognizes the symmetry of the genetic fallacy (Study 3 applies to both sides).
  *   **B Range (13-16):** Identifies the need for a bridge premise but leaves it undefended or unchallenged. Often spots the genetic fallacy regarding purity (Study 3) but fails to notice it blocks the vindicating reading of Study 1 just as surely.
  *   **C Range (9-12):** Recites the theory or stops at the Is/Ought distinction. Uses Studies 2 or 3 descriptively without connecting them to the normative inference.
