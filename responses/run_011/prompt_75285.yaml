answer: |-
  Dear colleague,

  I share your unease, and I think your instincts are sharper than you give them credit for. It is a familiar phenomenon in our field to find a room full of smart people nodding along to an argument that feels clean in the abstract but curdles upon contact with the actual world. The handout you describe is a classic reconstruction of the epistemic defense of democracy, and it is seductive because it tries to do too much work with a theorem that is much more fragile than it appears. You asked me to identify the single step to reject, and while there are weaknesses throughout, the fatal flaw lies in step five. This is the step that claims positive correlation among voters only slows convergence rather than reversing or halting it, and it is the bridge that allows the author to walk from the mathematics of step one to the political conclusion of step seven.

  The reason step five looked so innocuous to your seminar group is that it appeals to a robust mathematical intuition about large numbers. When we hear that an electorate contains a hundred million people, we instinctively feel that there must be enough independence somewhere in that mass to satisfy the theorem. The author relies on this intuition to suggest that correlation is merely a frictional cost, like air resistance on a falling object, which slows the descent but does not change the direction of gravity. However, in formal social epistemology, this is precisely where the Condorcet Jury Theorem breaks down when applied to real political bodies. The theorem requires conditional independence, meaning that given the state of the world, one voter's error tells you nothing about another's. In reality, voters are not independent draws from an urn; they are participants in a shared information environment. When you note the case of a million people reading the same two headlines, you have identified a common cause of belief. If the error arises from the signal itself rather than individual noise, the errors are perfectly correlated. In that scenario, the effective sample size is not one million; it is the number of independent information sources, which in your example is two. The majority verdict does not converge to certainty; it converges to the reliability of the common signal. If that signal is biased, the majority will be confidently wrong, and increasing the number of voters adds no epistemic value whatsoever. Step five disguises this structural vulnerability by treating correlation as a minor dampener rather than a potential ceiling on reliability.

  Rejecting step five comes at a cost, but it is a cost the epistemic democracy project should be willing to pay. If you remove the guarantee of asymptotic infallibility, you lose the strong conclusion in step seven that you ought to always defer to the majority over your own informed judgment. Without the independence assumption, the majority is not magically transformed into a super-expert; it is merely a aggregation of potentially correlated errors. This means the project cannot rest on the bare fact of voting alone. However, rejecting step five does not kill epistemic democracy; it merely forces it to grow up. It shifts the focus from aggregation to the conditions that generate independence and competence. Instead of assuming independence exists because the group is large, the theory must argue for institutional designs that foster diverse information pools, deliberation that breaks up common biases, and protections for minority viewpoints that might hold unique evidence. The payoff shifts from a guarantee of correctness to a claim about comparative advantage: under the right conditions, a diverse group can outperform a homogenous expert, but only if those conditions are actively maintained. This is a weaker claim than the handout offers, but it is far more robust and aligns better with the actual practice of democratic justification.

  You also asked about the damage done by step eight, the coda. This step is attempting to perform a reductio ad absurdum on the idea that the electorate's competence is below chance, but it is logically circular in a way that undermines its own force. The argument claims that because it is absurd to think democracy is systematically wrong, we must assume voters are competent. But this assumes the legitimacy of democracy to prove the competence of voters, which is the very thing the argument was supposed to establish. It blocks the escape route only by burning the bridge behind it. If the electorate is systematically misled by propaganda or structural bias, their competence could indeed be below half, and the theorem would correctly predict that the majority verdict converges on falsehood. Step eight tries to rule this out by fiat rather than evidence. It does not save the argument from the failure of step five; it merely attempts to paper over the empirical uncertainty of step two by declaring the opposite impossible. Recognizing this circularity helps you see that the handout is not proving democracy works; it is assuming democracy works to prove the math applies.

  So, where does this leave you with step seven and your own thesis? Once you reject step five, the derivation of step seven collapses. You are no longer compelled to defer to a million people who read the same headlines over one person who read the study, because the million people do not constitute a million independent tests of the truth. They constitute one test repeated a million times. This validates your instinct that the conclusion is false without requiring you to abandon the broader hope that democracy can have epistemic value. You can maintain that democratic procedures are valuable for reasons of legitimacy, stability, or even limited epistemic gain through diversity, without accepting the strong deference principle that would render expertise irrelevant. The handout's author likely found step five innocuous because it is technically true that some correlation allows convergence, but misleading because it implies any amount of correlation is survivable given a large enough n. In political reality, the correlation is often too high for the theorem to bite.

  Your instinct to suspect step five was correct. It is the hinge upon which the entire argument turns, and it is the point where the mathematical model fails to map onto the sociological reality. Step one is mathematically sound, step two is empirically debatable but possible, and step six is a normative claim you can accept or reject on moral grounds. But step five is the engine that drives the absurdity, and it fails because it misunderstands the nature of political information. By rejecting it, you save yourself from having to defend the indefensible position that ignorance aggregated is superior to knowledge held individually, and you open the space for a more nuanced view where the quality of information flow matters just as much as the count of votes. I hope this helps you pick at the handout with more confidence in your own critique.

  Warmly,

  Your colleague
