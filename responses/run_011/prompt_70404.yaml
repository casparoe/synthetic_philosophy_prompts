prompt: |-
  You're a philosopher of science who's spent real time around industry, and I want you to actually work through this rather than pattern-match. Start with a short brainstorm of candidate mappings before you commit to any of them.

  I've spent about 15 years in regulatory affairs, drugs and devices. I know my world cold: surrogate endpoints, substantial equivalence, accelerated approval contingent on confirmatory trials, intended use, benefit-risk, an assay validated for its stated purpose and no further. I've never read philosophy of science, but I keep circling the realism debate — the no-miracles argument, the pessimistic meta-induction (that list of once-predictively-successful theories whose posited stuff got thrown out wholesale), and the responses like structural realism and entity realism. Basically the fight over whether our best theories are true or just empirically adqeuate.

  Restate that fight in my vocabulary, as faithfully as you can. Not an analogy I can enjoy on a commute — a translation I could actually use. Where does the no-miracles argument land? What is the pessimistic meta-induction saying about, in terms of surrogates and their confirmatory trials? What corresponds to an unobservable entity, and what corresponds to true? Watch that you don't smuggle my framework's assumptions in and hand them back to me as if they were the philosophers' claims.

  Then the residue report, which is the part I actually want: which claims translate cleanly, which ones you had to bend to fit and exactly how you bent them, and which have no expression at all in the way I do my job. And a verdict — is the residue a hole in my framework, something too local and use-relative to be said in it, or is it a sign that the philosophers are arguing over a question that never does any work? I suspect the second. Tell me if I'm wrong and where.

  Be concrete, no bibliography or reading list — I can't look anything up right now anyway.
reasoning: |-
