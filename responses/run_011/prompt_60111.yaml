  **MEMORANDUM**

  **TO:** Committee on Cultural Life
  **FROM:** [Your Name], Department of Philosophy
  **DATE:** [Current Date]
  **SUBJECT:** Allocation of the Cultural Formation Bequest: Proposal A vs. Proposal B

  As we prepare for Thursday's vote, I want to clarify the philosophical stakes underlying our budgetary constraint. We are not merely choosing between two line items; we are interpreting the donor's restriction regarding "the aesthetic and moral formation of students." This phrase is not decorative. It imposes a teleological requirement on our spending: we must fund practices that cultivate specific capacities in our student body. The question is not which program is more popular, but which better fulfills this dual mandate of aesthetics and morals within the reality of our campus community.

  To decide, we must separate an empirical question from a conceptual one. The committee has collapsed these annually. The empirical question is: *Does watching professional theater change specific policy views?* The internal survey suggests it does not. However, treating policy alignment as the metric for moral formation is a category error. Moral formation is not synonymous with political persuasion. It involves the cultivation of attention, the capacity for shared vulnerability, and the ability to witness complex human situations without immediate demand for utility. If we accept the conceptual claim that spectatorship is a moral practice—a discipline of listening and seeing—then the survey's failure to show policy shifts is irrelevant. Proposal A facilitates this contemplative encounter. Proposal B, by contrast, prioritizes production. While making art is valuable, the argument that creation is inherently more formative than reception rests on the assumption that art is primarily a tool for self-expression rather than an object of shared truth. We should not accept that assumption without evidence.

  This brings us to the first serious objection we must weigh: the issue of accessibility and equity. We cannot treat the concern that Proposal B favors the "energetic and already confident" as a minor logistical hurdle. It is a moral veto. A bequest dedicated to the moral formation of *students* implies a formation available to the student body as a whole, not merely those with specific physical capacities or flexible schedules. The data indicates that students with mobility limits, chronic energy constraints, or rigid work-study obligations can access Proposal A but are effectively excluded from Proposal B. If we choose B, we are formally deciding that the moral formation of disabled students and working students is less prioritized than that of their peers. There is no philosophical defense for using restricted funds to deepen inequality of access. Proposal A's provision of chartered buses and fixed seating ensures that the barrier to entry is interest, not physical capacity or spare time. In a liberal arts community committed to equity, the moral clause of the bequest demands we choose the option that does not systematically exclude the vulnerable.

  The second objection concerns the nature of art and our external obligations. Colleagues have worried that prioritizing student participation over professional performance is puritanical and hostile to art itself. This critique holds weight. There is a distinct value in encountering work that exceeds our own capacities, crafted by professionals who devote their lives to the discipline. Proposal A sustains a regional ecosystem of professional artists, ensuring students encounter art as a serious vocation rather than solely as a curricular exercise. While the donor's phrase restricts us to student formation, meaning we cannot subsidize the local economy for its own sake, the existence of a professional theater nearby is a precondition for the aesthetic formation we promise. If we defund the regional company, we diminish the cultural ecosystem our students inhabit post-graduation. Proposal B risks instrumentalizing art, turning it into a vehicle for engagement metrics rather than an end in itself. We must resist the notion that art only matters when students are the ones making it. That stance devalues the very excellence we claim to want them to appreciate.

  Therefore, the donor's phrase does real work here. It prevents us from funding Proposal A solely to subsidize local employment, but it also prevents us from funding Proposal B solely to boost participation numbers. It forces us to ask which model best forms students aesthetically and morally. Given the accessibility constraints and the value of professional encounter, Proposal A is the superior fit.

  However, I recognize the desire to support student creation. The chair's floating of a fifty-fifty split attempts to hedge this bet, but it fails the financial reality that the proposals together cost three times our available funds. A fifty-fifty split would render both programs unsustainable, violating our fiduciary duty. If we were to split, it would need to be asymmetrical to ensure viability. Nevertheless, given the "one way" constraint necessitated by the budget, I recommend we allocate the full $185,000 to **Proposal A**.

  This recommendation is contingent on one modification: we must require the theater company to refine the talk-back sessions. Rather than aiming for policy persuasion, these discussions should focus on the aesthetic choices and ethical dilemmas presented in the work, aligning the assessment with the actual goal of moral formation. We should not abandon the ambition of Proposal B entirely; I suggest we seek separate funding for a small-scale pilot of student workshops next year, rather than cannibalizing this bequest.

  To conclude, I want to specify the conditions under which this recommendation would be wrong. First, if evidence emerges that the accessible seating and transport provided in Proposal A are insufficient in practice, rendering it exclusionary despite intent, we must reconsider. Second, if the regional theater company fails to program work that challenges students aesthetically, reducing the seasons to mere entertainment, the claim of "aesthetic formation" collapses. Finally, if we discover that student participation in creation is the only viable path to moral development for a significant majority of the student body, excluding spectatorship entirely, then our defense of reception fails. Absent these findings, Proposal A remains the only choice consistent with our ethical and aesthetic obligations.
