answer: |-
  1. **Kepler's reform as a set of moves**

  Kepler's reform consists of six structural moves. First, ontological pruning: he discarded the traditional twelve houses, zodiacal signs, and planetary dignities while retaining angular configurations between bodies. Second, mechanism substitution: he replaced the idea of mechanical physical influence with a harmonical faculty based on geometric ratios, akin to how the ear responds to musical consonance. Third, target migration: he shifted predictions from specific political events to general weather patterns and human temperaments, outcomes that occur more frequently and are harder to falsify definitively. Fourth, internal validation: he gathered historical weather and nativity records to test the new aspects against the old, creating a self-contained evidence loop. Fifth, rhetorical positioning: he positioned himself between superstitious practitioners and wholesale rejecters, arguing both extremes were wrong and that value lay in the center. Sixth, economic continuity: he maintained his income as court mathematicus by continuing to produce prognostications, ensuring the reformed art remained financially viable despite theoretical changes.

  2. **Diagnostic table**

  | Move | Kepler | Vendor | Question |
  | :--- | :--- | :--- | :--- |
  | **Pruning** | Cut houses/signs, kept angles | Cut discredited variables, kept core | Which retained parameters lack independent causal justification outside the model? |
  | **Mechanism** | Geometry/Harmony soul | New math/ML story | Is the mechanism falsifiable without using the outcome data it claims to predict? |
  | **Target** | Weather/Temperament | Broad indices/behavior | Does target vagueness inflate apparent accuracy rates compared to specific losses? |
  | **Validation** | Own records | Vendor backtests | Who constructed the test dataset and outcome definitions, and can we access them? |
  | **Positioning** | Between zealots/skeptics | Sober middle | What evidence exists outside your own narrative framework and proprietary data? |
  | **Economics** | Court income | Sales/Retention | Does the business model require the tool to remain opaque to protect revenue? |

  3. **Implications for the panel**

  1.  **Demand independent causal justification for retained variables.** Kepler retained aspects because of geometric purity, not merely because they fit past data; vendors often retain variables solely because they correlate in backtests. We must refuse to count a variable as valid simply because it survived an amputation process; we require a causal story that stands without the outcome data.
  2.  **Require mechanism separability.** Kepler's harmonical mechanism was tied to his broader physics, yet remained distinct from the astrological predictions; vendors often conflate the model's math with the mechanism itself. We will not accept a mechanism story that is only constructed after the signal is found; the mechanism must be testable independently of the model's predictive success.
  3.  **Penalize target migration.** Kepler moved to weather because political events were too hard to predict reliably; vendors often shift to vague behavioral indices when credit defaults are too noisy. We must downgrade scores for models that define success using broad, high-base-rate targets rather than the specific financial losses we intend to insure.
  4.  **Insist on validation independence.** Kepler gathered his own records, which allowed him to control the definitions of success; vendors similarly control their backtest environments. We will require third-party replication of results on our own data before voting, treating vendor-provided backtests as hypotheses rather than evidence.
  5.  **Treat rhetorical moderation as neutral.** Kepler argued truth lay between the zealots and the skeptics, a move designed to disarm criticism without adding proof; vendors use this same "sober middle" positioning to deflect scrutiny. We must not grant credibility to a pitch simply because it acknowledges the flaws of its predecessors; admitting fault is a sales tactic, not evidence of validity.
  6.  **Assess economic incentives for opacity.** Kepler needed to keep casting charts to earn his salary, which incentivized keeping the reformed art usable; vendors need to protect intellectual property to sell licenses. We must record any conflict of interest where the vendor's revenue model depends on the model remaining a black box that we cannot fully audit.

  4. **Where the analogy breaks**

  Three respects limit the transferability of this lesson. First, Kepler's harmonical commitments were feeding a research programme that was simultaneously producing genuine, independently checkable astronomical results, such as the laws of planetary motion; modern vendors rarely have adjacent scientific successes that validate their theoretical framework. Second, Kepler operated as a solitary scholar within a patronage system that valued open discourse among peers, whereas vendors operate as corporations protecting proprietary IP, actively preventing the peer review Kepler implicitly invited. Third, astrology was a socially accepted framework in Kepler's time, allowing him to reform it from within, whereas alternative data models face regulatory scrutiny that treats the entire lineage as potentially discriminatory, regardless of internal reforms.

  5. **Bottom line**

  We will not vote to adopt any instrument where the retained variables lack causal justification independent of the backtest. We will treat claims of being a "sober middle" as neutral rhetoric rather than evidence of validity. We require third-party replication on our own data before considering any vendor-provided backtest as evidence. We must record conflicts of interest where revenue depends on model opacity.
