      *   **User's Hunch:** Statistical worry = selection effects on finite samples; Bayesian puzzle = support relation between fixed propositions. Are these separate?
      *   **Tone:** Intellectual, rigorous, slightly informal (flatmate debate context), philosophical but technically grounded.

