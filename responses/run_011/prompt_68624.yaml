answer: |-
  This is a classic philosophical standoff: **Luck Egalitarianism (Nadia)** vs. **Libertarian/Intuitionist Desert (Marcus).** It's the sort of argument that doesn't end because they are arguing on different planes—he is arguing from *experience and agency*, she is arguing from *causality and structure.*

  Here is the refereeing, move by move, followed by the missing piece that could deepen your scene.

  ### The Breakdown

  **Move 1: Marcus (The Claim of Sacrifice)**
  *Argument:* I sacrificed (time, sleep, youth); therefore, I own the reward.
  *Verdict:* **Marcus wins the room; Nadia wins the logic.**
  *Why:* Marcus is appealing to a fundamental human intuition: pain buys value. It feels just. However, philosophically, this is weak. As Nadia is about to point out, the ability to endure pain is not evenly distributed. But in a dinner setting, Marcus's appeal to "I suffered for this" is emotionally bulletproof. He is claiming ownership of his own history.

  **Move 2: Nadia (The Chain of Causality)**
  *Argument:* Your capacity to sacrifice was given to you (genes, stability, temperament). You didn't choose the chooser.
  *Verdict:* **Nadia is right.**
  *Why:* This is the hard determinist checkmate. Philosophically, you cannot take credit for the tools you used to build the life, because you didn't build the tools. If Marcus had a chronic illness or a traumatic home life at twelve, his "decade of training" might have been impossible. Nadia correctly identifies that "grit" is often a privilege in disguise. Marcus is claiming credit for a lottery win he calls "willpower."

  **Move 3: Marcus (The Moral Collapse)**
  *Argument:* If nobody deserves anything, the worker and the slacker are identical, and patients don't deserve care. Your logic eats the world.
  *Verdict:* **Marcus is slippery here (Strawman), but identifies a real danger.**
  *Why:* Marcus is conflating *moral worth* with *outcome utility*. Nadia never said patients don't deserve care; she said the *surgeon* doesn't morally deserve the income. However, Marcus spots the nihilistic risk. If we remove "desert" entirely, we risk removing the moral distinction between effort and neglect. He is arguing that her philosophy destroys the motivation structure of society. He's wrong on the logic, but right to fear the consequence.

  **Move 4: Nadia (Distribution without Desert)**
  *Argument:* We don't need "desert" to justify pay. We pay for contribution, need, and incentives.
  *Verdict:* **Nadia is right.**
  *Why:* She successfully pivots from *backward-looking* justice (did you earn this?) to *forward-looking* utility (does paying you this produce good results?). She is describing a functionalist society. We pay surgeons well not because they are holy, but because we want people to become surgeons. This is a robust philosophical position (Rawlsian), separating entitlement from moral virtue.

  **Move 5: Marcus (The Market Definition)**
  *Argument:* "Contribution" is just a fancy word for "market price." You're circling back to what I have.
  *Verdict:* **Marcus is cynical; Nadia is precise.**
  *Why:* Marcus tries to trap her by defining "contribution" strictly as "what the market will bear." He wants to force her to admit that the market is the only true measure of value. He is trying to collapse her moral distinction back into cold economics. It's a defensive move to protect his income from her moral critique.

  **Move 6: Nadia (Price vs. Value)**
  *Argument:* Market price $\neq$ Contribution. (Nurse vs. Derivatives). Dropping "desert" allows us to see the market is wrong.
  *Verdict:* **Nadia wins the point.**
  *Why:* She successfully decouples *price* from *value*. If "desert" is the metric, the derivatives trader must be morally superior to the nurse because he earns more. By dropping "desert," she frees herself to say the trader is overpaid and the nurse is underpaid based on actual human impact. Marcus has no counter to this other than "that's not how the world works," which concedes her philosophical point while asserting his pragmatic one.

  ***

  ### The Missing Piece: "The Necessary Fiction"

  Neither of them said the thing that resolves the tension without surrendering the ground. They are arguing about whether Desert is **True**. Neither asked if Desert is **Useful**.

  **What should have been said:**
  > "It doesn't matter if desert is metaphysically true. It matters that believing it is true is the only way to get people to do the hard things."

  **Why this matters for your scene:**
  Marcus is defending the *psychology of agency*. If he truly believes Nadia—that his grit is just luck—his identity collapses. He isn't just defending his paycheck; he is defending his sense of self as an autonomous actor.
  Nadia is defending the *architecture of justice*. She wants a society that acknowledges systemic luck.

  **The Synthesis:**
  A society that tells Marcus he deserves *nothing* will produce fewer surgeons. A society that tells Marcus he deserves *everything* produces inequality and arrogance. The truth is that "Desert" is a **pragmatic fiction**. We must pretend people earn their outcomes to sustain the effort required to create them, even if we know privately that luck played a hand.

  **For your novel:**
  The fight isn't about money. It's about **dignity**.
  *   **Marcus** needs to feel like the author of his life. Nadia is telling him he is just a vessel for circumstance.
  *   **Nadia** needs to feel like the system is fixable. Marcus is telling her the system is just natural law (effort = reward).

  **The line that ends the argument:**
  If you want a character to step in (or an internal realization), have them point out that Marcus is right that he *feels* he earned it, and Nadia is right that he *didn't* earn the capacity to earn it. The tragedy is that we have to pay him *as if* he did, while knowing he didn't, so that he keeps cutting people open.

  That is the uncomfortable silence neither of them could afford to sit in. Marcus can't admit his grit is luck without losing his drive. Nadia can't admit the fiction is necessary without compromising her demand for justice. That is where your scene lives.
