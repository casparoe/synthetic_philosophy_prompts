prompt: |-
  For forty years I worked in non-abelian gauge theories, where a local symmetry is treated without anxiety as a redundancy of description and no one concludes that determinism has been lost; only in retirement have I come across the claim that general covariance has precisely this consequence for general relativity. Before I read the candidates, I want the specification.

  Write the desiderata for an account of the ontology of spacetime in a generally covariant theory: what such an account must deliver to count as resolving the hole argument. For each requirement, give the case or consideration that motivates it and say whether it is non-negotiable or a demand peculiar to one camp. I suspect that Leibniz equivalence, the prohibition on haecceitistic differences, and the demand that points be individuable without reference to the metric are not equally binding, and I want to know which of them are load-bearing. The list must cover vacuum solutions, where there is no matter field to anchor the points; spacetimes lacking isometries; the constraint that the account leave the count of physical degrees of freedom untouched; and what becomes of the account under quantization.

  Two judgements I want stated explicitly: whether any subset of these requirements is jointly unsatisfiable, in which case the list is itself a result, and which single requirement excludes the most candidates. End with a short application to manifold substantivalism, relationalism, and sophisticated substantivalism, and tell me where the analogy with an ordinary Yang–Mills gauge symmetry breaks down — in particular, whether the obstruction to choosing a global gauge section, the failure of any smooth gauge condition to select exactly one representative per orbit, has a counterpart here, and if so whether it belongs among the requirements.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** A retired theoretical physicist (40 years in non-abelian gauge theories). They understand gauge symmetry, redundancy, determinism, and the technical nuances of field theory. They are skeptical of claims that General Relativity (GR) is fundamentally different from Yang-Mills (YM) regarding determinism and ontology. They want a rigorous, technical specification of what a solution to the Hole Argument must achieve.
      *   **Task:** Write desiderata for an ontology of spacetime in a generally covariant theory (specifically to resolve the Hole Argument).
      *   **Specific Requirements:**
          *   List requirements with motivations and status (non-negotiable vs. camp-specific).
          *   Address specific cases: vacuum solutions, spacetimes without isometries, degrees of freedom count, quantization.
          *   Evaluate specific concepts: Leibniz Equivalence, haecceitism, point individuation without metric.
          *   Make two explicit judgments: (1) Is any subset jointly unsatisfiable? (2) Which single requirement excludes the most candidates?
          *   Apply to: Manifold Substantivalism, Relationalism, Sophisticated Substantivalism.
          *   Address the YM analogy: Where does it break down? (Global gauge sections, gauge fixing).
      *   **Tone:** Professional, precise, philosophically informed but physically grounded, respectful of the user's expertise.

  2.  **Deconstruct the Hole Argument & Ontology:**
      *   *The Hole Argument:* Given a manifold $M$ and metric $g$, a diffeomorphism $\phi$ that is identity outside a hole $H$ but non-identity inside creates $(M, \phi^*g)$. If points have independent identity (substantivalism), these are distinct physical states. If the theory is generally covariant, both satisfy the field equations given the same boundary data. Hence, indeterminism.
      *   *The Standard Solution:* Identify $(M, g)$ and $(M, \phi^*g)$ as the same physical state (Leibniz Equivalence). This requires rejecting naive substantivalism.
      *   *The User's Insight:* In YM, gauge transformations are redundancies. We don't lose determinism. Why is GR different? The user suspects the difference might be overstated or that the ontological demands are confused.

  3.  **Drafting the Desiderata (The "Specification"):**
      *   *Requirement 1: Determinism Recovery.* The account must restore determinism to the Einstein Field Equations (EFE).
          *   *Motivation:* The Hole Argument is essentially an indeterminism proof.
          *   *Status:* Non-negotiable.
      *   *Requirement 2: Gauge Invariance of Observables.* Physical quantities must be diffeomorphism-invariant.
          *   *Motivation:* Analogy with YM. If coordinates/gauge are redundant, observables can't depend on them.
          *   *Status:* Non-negotiable (for a covariant theory).
      *   *Requirement 3: Point Individuation.* How are manifold points identified?
          *   *Motivation:* The crux of the Hole Argument. If points are "bare," we get indeterminism.
          *   *Status:* Contested (Substantivalists vs. Relationalists).
      *   *Requirement 4: Degrees of Freedom.* Must match the standard count (2 per point in 4D).
          *   *Motivation:* Empirical adequacy (gravitational waves).
          *   *Status:* Non-negotiable.
      *   *Requirement 5: Vacuum/Isometry Handling.* Must work without matter fields (Einstein algebras/point-coincidences).
          *   *Motivation:* GR exists in vacuum. Matter shouldn't be ontologically necessary for spacetime.
          *   *Status:* Non-negotiable for GR specifically.
      *   *Requirement 6: Quantization Compatibility.* Must not obstruct canonical or path integral quantization.
          *   *Motivation:* Future physics.
          *   *Status:* Highly desirable, but maybe not strictly "ontological" for classical GR. Let's mark as strong desideratum.

  4.  **Evaluating the Specific Concepts:**
      *   *Leibniz Equivalence:* Identifying isomorphic models. Essential for determinism. Non-negotiable for resolving the Hole Argument *as an indeterminism proof*.
      *   *Haecceitism:* Belief in "thisness" of points. Must be rejected to save determinism. Non-negotiable *if* one wants to keep GR as is.
      *   *Individuation without Metric:* This is the trap. If points are individuated *before* the metric, you get the Hole Argument. So, the requirement should be that points are *not* individuated independently of the field.

  5.  **Addressing the Two Judgments:**
      *   *Unsatisfiable Subset?* The tension lies between "Points exist independently" (Substantivalism) and "Determinism/Leibniz Equivalence." You can't have naive substantivalism + Determinism. But *Sophisticated* Substantivalism tries to have both. Is it satisfiable? Yes, if you accept isomorphism classes as the ontology.
      *   *Most Exclusionary Requirement:* "Point Individuation independent of the metric." This kills Naive Substantivalism. Or perhaps "Observables must be local diffeomorphism invariants" (which is notoriously hard in GR, unlike YM). Let's focus on the ontological commitment: The rejection of haecceitistic distinctness is the biggest bullet to bite.

  6.  **Addressing the YM Analogy:**
      *   *Similarity:* Both are gauge theories. Redundancy $\to$ no indeterminism.
      *   *Difference:* In YM, the base manifold (spacetime) is fixed background. In GR, the "gauge field" (metric) *defines* the geometry of the base manifold. Diffeomorphisms move points *and* fields. Internal gauge transformations move fiber values *at* points.
      *   *Global Sections:* In YM, principal bundles might not admit global sections (topological obstruction). In GR, the "bundle" is the frame bundle over $M$. The issue isn't just topology; it's that the "gauge group" (Diff(M)) acts on the base space itself.
      *   *Gauge Fixing:* In YM, we fix $A_\mu$. In GR, we fix coordinates or metric components. The obstruction to a *unique* smooth gauge selection (Gribov ambiguities in YM, similar issues in GR) is technical, not ontological.
      *   *The Breakdown:* The user asks if the obstruction to choosing a global gauge section belongs in the requirements. It shouldn't be an ontological requirement, but a technical constraint on the *formulation*. The real breakdown is that in YM, spacetime points are antecedently individuated (background dependence). In GR, they are not (background independence).

