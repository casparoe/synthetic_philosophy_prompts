prompt: |-
  I manage a ~60 person backend team and I'm trying to work out what our norms around high performers should actually be. Three keep coming up in the eng-culture discourse: the American Dream (loudly celebrate whoever makes it big), Jantelagen (the Scandinavian thing from that 1933 novel, town of Jante, first rule being basically that you shouldn't think you're anything special), and tall poppy syndrome (cut down the ones who stick their heads up — the image is apparently from that story where a tyrant walks through a field swipping off the tallest stalks as his whole answer to a question about holding onto power; Livy's version has poppies in a garden and a message to his son, Herodotus's has wheat).

  Rank those three as a culture to actually run an eng org under. Score each 1-10 on two axes — raw output you'd get out of it, and how tolerable it'd be to work under day to day — with a one-liner of reasoning each, then give me an overall ordering. The wrinkle: our comp and levels are fully transparent, everyone can see everyone's number, and I suspect that changes what each norm does once you install it. Fold that in.

  Also tell me how confident you are in that overall ordering, and single out the one judgement in it you'd most expect to be wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Managing a ~60 person backend team.
      *   **Task:** Rank three cultural norms (American Dream, Jantelagen, Tall Poppy Syndrome) for running an engineering organization.
      *   **Scoring:** 1-10 on two axes: "Raw Output" and "Tolerability".
      *   **Reasoning:** One-liner per norm per axis.
      *   **Constraint/Wrinkle:** Compensation and levels are *fully transparent* (everyone sees everyone's number). This is a critical variable.
      *   **Output:** Overall ordering, confidence level, and the judgment most likely to be wrong.

  2.  **Deconstruct the Norms:**
      *   **American Dream:** Meritocratic, individualistic, celebrate winners, high variance in reward/status. "Make it big."
      *   **Jantelagen:** Collectivist, humility, don't think you're special, social pressure to conform. "We are all equal."
      *   **Tall Poppy Syndrome:** Actively cutting down high performers, envy-driven, punitive towards success. "Don't stick out."

  3.  **Analyze the "Transparency Wrinkle":**
      *   *Transparent Comp/Levels:* Everyone knows who gets paid what and who is at what level.
      *   *Impact on American Dream:* Transparency validates the "dream." If I see someone making 2x me, I know it's possible *if* the criteria are clear. However, if the criteria feel unfair, it breeds resentment quickly because the evidence is public.
      *   *Impact on Jantelagen:* Transparency fights Jantelagen. Jantelagen relies on suppressing distinction. If the org publicly distinguishes people via levels/pay, Jantelagen creates cognitive dissonance. "We are all equal" vs. "Alice is L7 and makes $500k more than me."
      *   *Impact on Tall Poppy:* Transparency fuels Tall Poppy. If I see someone making way more, and the culture says "cut them down," the transparency provides the target list. It weaponizes the data.

  4.  **Evaluate Each Norm (Drafting Scores & Reasoning):**

      *   **American Dream:**
          *   *Output:* High. Incentivizes hustle. With transparency, the path to reward is visible (assuming calibration is fair). Score: 8.
          *   *Tolerability:* Medium/High. Can be exhausting, but fair play is tolerable. Transparency helps trust *if* calibrated well. Score: 7.
          *   *Transparency Effect:* Amplifies the incentive structure. Good if fair, toxic if political. Let's assume a competent management layer (since the user is asking this question).

      *   **Jantelagen:**
          *   *Output:* Medium/Stable. Good for collaboration, bad for moonshots. Transparency undermines the core tenet (equality), causing confusion. Score: 5.
          *   *Tolerability:* High (for average), Low (for ambitious). Psychological safety is high, but ambition is stifled. Transparency makes the "equality" lie obvious. Score: 6.
          *   *Transparency Effect:* Creates dissonance. You can't preach humility while publishing a leaderboard of salaries.

      *   **Tall Poppy Syndrome:**
          *   *Output:* Low. Actively punishes the people driving value. Transparency gives the mob the addresses of the high earners. Score: 2.
          *   *Tolerability:* Very Low. Paranoia, hiding work, sabotage. Score: 1.
          *   *Transparency Effect:* Catastrophic. It turns comp bands into hit lists.

  5.  **Refine Scores based on the "60 Person Backend Team" Context:**
      *   60 people is small enough for culture to be potent, large enough for politics to emerge.
      *   Backend eng requires deep collaboration *and* individual ownership.
      *   Transparency is the key differentiator here.

      *   *American Dream + Transparency:* This is the only combo that makes logical sense. If you publish numbers, you *must* justify them with meritocracy.
      *   *Jantelagen + Transparency:* Contradictory. Why publish levels if we aren't supposed to think anyone is special?
      *   *Tall Poppy + Transparency:* Suicide.

  6.  **Drafting the Response (incorporating the constraints):**

      *   *Ranking:* 1. American Dream, 2. Jantelagen, 3. Tall Poppy.
      *   *Scoring:* Need to be precise.
      *   *Confidence:* Need to assess how much I know about their specific calibration fairness.
      *   *Most Likely Wrong:* Probably the tolerability of the American Dream. If the comp calibration is actually political, transparency makes it a hellscape.

  7.  **Review and Polish:**
      *   *Check:* Did I include the one-liners? Yes.
      *   *Check:* Did I fold in the transparency wrinkle? Yes, this is crucial for the reasoning.
      *   *Check:* Confidence and "most wrong" judgment included? Yes.
      *   *Tone:* Professional, analytical, direct.

      *(Self-Correction during drafting)*: Wait, is Jantelagen actually better than American Dream for *tolerability*? In a transparent environment, Jantelagen feels hypocritical. "Don't think you're special" while wearing a badge that says "Senior Staff Engineer." That cognitive dissonance lowers tolerability. American Dream is at least consistent with transparency. I will stick with American Dream as #1, but acknowledge the risk.

      *(Refining Tall Poppy)*: Is it possible Tall Poppy isn't a 1/2? In some contexts, it keeps egos in check. But with transparent comp? No, that's incendiary. I'll keep it low.

      *(Refining Confidence)*: I don't know how fair their calibration is. If their calibration is garbage, American Dream + Transparency is worse than Jantelagen. I need to highlight this dependency.

  8.  **Finalizing the Output Structure:**
      *   Intro acknowledging the transparency constraint.
      *   The Three Norms (Score + Reasoning).
      *   Overall Ordering.
      *   Confidence & The "Most Wrong" Judgment.

  9.  **Final Polish of Reasoning (incorporating transparency explicitly):**
      *   *American Dream:* Transparency validates the meritocracy *if* fair.
      *   *Jantelagen:* Transparency exposes the hierarchy, undermining the "no one is special" rule.
      *   *Tall Poppy:* Transparency provides the target list for the axe.

      *Let's write it.*
answer: |-
  Here is the ranking and analysis, factoring in the critical constraint of **fully transparent compensation and levels**.

  ### 1. The American Dream
  *   **Raw Output:** 8/10 — Transparency validates the meritocracy, turning comp bands into a visible leaderboard that incentivizes high-agency engineering.
  *   **Tolerability:** 7/10 — Exhausting for some, but consistent; the public data proves the rules apply to everyone, reducing political suspicion.

  ### 2. Jantelagen
  *   **Raw Output:** 5/10 — Transparency creates cognitive dissonance; you cannot preach "no one is special" while publishing a public hierarchy of levels and salaries.
  *   **Tolerability:** 6/10 — High psychological safety for the median, but ambitious engineers will feel gaslit by the contradiction between the cultural norm and the comp spreadsheet.

  ### 3. Tall Poppy Syndrome
  *   **Raw Output:** 2/10 — Transparency weaponizes the comp data, turning high earners into marked targets for sabotage rather than examples to emulate.
  *   **Tolerability:** 1/10 — Paranoia becomes the default state; engineers will hide impact to avoid being swiped off by the tyrant's stick.

  ***

  ### Overall Ordering
  1.  **The American Dream** (The only norm logically consistent with transparency)
  2.  **Jantelagen** (Workable only if you ignore the comp data, which humans cannot do)
  3.  **Tall Poppy Syndrome** (Organizational suicide when combined with open numbers)

  ### Confidence & Calibration
  **Confidence:** 85%

  **The Judgment Most Likely to Be Wrong:**
  The **Tolerability score for the American Dream (7/10)**.

  **Why:** This score assumes your calibration process (who gets what level/pay) is actually fair and objective. If your calibration is political or biased, transparency doesn't validate the meritocracy; it exposes the rigging. In a "rigged" American Dream with open comp, tolerability plummets to a 2/10 instantly, likely making **Jantelagen** the safer (albeit lower output) choice because it at least dampens the resentment of inequality by pretending inequality doesn't matter. If you aren't 100% confident in your leveling calibration, swap #1 and #2.
