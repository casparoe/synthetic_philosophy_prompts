      *   *Correction on Q6:* The prompt asks if a role-individuated state occupying two incompatible roles is determinately any one state. If the state is *defined* by the role, and it holds two roles, is it two states? James would likely say it's one portion of stuff entering two functional contexts. For the seminar, the key is that the *mental* aspect is the role, not the stuff. If the stuff plays the 'knower' role, it is mental *in that relation*.

