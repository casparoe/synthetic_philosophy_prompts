answer: |-
  **TO:** Forecasting Tournament Committee
  **FROM:** Chair, Scoring Subcommittee
  **DATE:** October 24, 2023
  **SUBJECT:** Decision on Probability Coherence Rules for Upcoming Season

  **Bottom Line:** I recommend we **adopt a narrowed coherence rule** limited to strict, structural entailments defined in question metadata. We will not police semantic overlaps or duplicates. Violations will trigger a warning and required revision before submission closes, not score docking.

  **The Debate: Betting vs. Fairness**
  Proponents of a full coherence rule rely on the "Dutch book" argument: incoherent probabilities allow a bettor to construct a guaranteed loss against the forecaster. Theoretically, they are correct. A forecaster assigning 0.58 to >1.5C warming and 0.71 to >2.0C warming is mathematically inconsistent; the latter entails the former. Rewarding this undermines the tournament's epistemic integrity. If we ignore this, we validate noise over signal.

  However, the strongest case against policing—which I take seriously—is the cognitive load argument. Forecasting 300 questions is not market-making. Human beliefs are not naturally probability distributions closed under logical consequence. Punishing users for missing obscure entailments privileges those with time to map logic trees over those with superior substantive insight. A blanket rule risks driving away our best domain experts who treat this as a judgment exercise rather than a logic puzzle. Furthermore, as our computer scientist noted, screening a whole assignment over 300 interlocking questions for joint consistency is computationally intractable for our current staffing.

  **Resolution**
  We split the difference. We acknowledge the betting argument holds for *structural* necessities (math/thresholds) but fails for *semantic* judgments (definitions/duplicates). We will enforce coherence only where the logic is undeniable and machine-readable.

  **Operational Procedure**
  1.  **Scope:** Checks apply only to pairwise relationships explicitly tagged in the question metadata (e.g., Q13 entails Q12). We will not run global consistency checks across the full question set.
  2.  **Tolerance:** A violation exists only if P(Entailment) > P(Base) + 0.01. This accounts for rounding noise and minor uncertainty.
  3.  **Pre-Resolution:** Submissions violating strict rules trigger an automatic warning. The forecaster must revise or affirm the error (affirming locks the forecast). No score docking occurs for initial errors.
  4.  **Post-Resolution:** No clawbacks. Once questions resolve, scores stand. Retroactive penalties create trust issues and administrative nightmares.

  **Specific Cases**
  *   **Duplicates (Q7/Q19):** These are **excluded** from coherence checks. If resolution criteria differ slightly, that is a resolution team error, not a forecaster inconsistency. We will not flag divergent probabilities here. Treating these as coherence violations would punish forecasters for ambiguity created by the tournament itself.
  *   **Ambiguous Entailments:** Cases dependent on unresolved definitions (e.g., "recession") are **excluded**. We only police entailments that are true by definition regardless of resolution criteria. If the entailment relies on a specific definition the resolution team may not use, it is not a strict logical necessity.

  **Next Steps**
  This approach protects the tournament from obvious mathematical absurdities without punishing honest cognitive overload. It respects the fairness concerns of the second group while satisfying the integrity concerns of the first. Please review this framework before Thursday's meeting.
