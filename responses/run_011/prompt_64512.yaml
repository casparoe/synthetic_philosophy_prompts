answer: |-
  Christopher Nolan's *Oppenheimer* is not Anscombian but rather a tragic study of consequentialist burden displaced onto psychological guilt and political legacy.

  Regarding the four episodes you identified, each answers a question different from the one Anscombe poses. In the Oval Office scene, Truman physically enacts the ownership of the decision while verbally dismissing Oppenheimer's moral distress as naivety; this presses the question of political accountability but sidesteps Anscombe's question of moral permission, treating the deed as a statecraft necessity rather than a potential murder. The gymnasium address, where Oppenheimer's applause dissolves into hallucinations of peeling skin and stampeding crowds, answers the question of how the deed feels to the agent, whereas Anscombe is indifferent to the agent's feelings and concerned solely with the objective moral quality of the act. The film's refusal to enter Hiroshima or Nagasaki, keeping the victims as names on a target list or images in a magazine, avoids the concrete reality of the innocents Anscombe demands we recognize, thereby making it easier to treat the deaths as abstract costs rather than specific violations. Finally, the atmosphere wager, where physicists calculate the probability of igniting the air, is pure risk assessment; it asks whether the gamble is survivable, whereas Anscombe would ask whether subjecting the world to such a gamble is itself a choice to kill the innocent that cannot be justified by any probability calculation.

  The film's moral grammar remains consequentialist even when it condemns. The indictment leveled against the bombing and the subsequent arms race is ultimately that the calculation was bad or that the consequences were catastrophic, not that the calculation was the wrong sort of thing to make. Oppenheimer's guilt is framed as the burden of having "blood on his hands," which implies responsibility for outcomes rather than violation of a natural law against killing innocents. When the film critiques the decision, it does so through the lens of the hydrogen bomb escalation and the loss of security clearance, suggesting the error was in losing control of the technology rather than in the initial use of the atomic bomb against civilians. Even Oppenheimer's famous line about chaining the world to destruction focuses on the future consequence of the precedent set, not the intrinsic wrong of the act itself.

  The film resists Anscombe most significantly in its displacement of the bombing by the hydrogen bomb debate and the security hearing. By shifting the moral climax to Oppenheimer's opposition to the H-bomb and his subsequent persecution, the film allows the atomic bombings of Hiroshima and Nagasaki to stand as a completed, if tragic, historical fact rather than an open moral wound requiring judgment. This structural choice costs Anscombe her primary target, which is the public honor given to Truman for the specific act of killing innocents in 1945. Furthermore, while the film touches on Anscombe's concession regarding foreseeing and unscrupulous inquiry, it does not engage her distinction rigorously; Oppenheimer is shown worrying about target selection, but the film treats the failure to pursue alternatives like a demonstration as a military or political oversight rather than a moral failure that converts foreseeing death into choosing it. The film also makes Oppenheimer impressive precisely through his suffering and brilliance, whereas Anscombe insists that spectacular wickedness does not make a mediocre person impressive; Nolan aestheticizes the guilt in a way that risks making the moral failure look like tragic grandeur.

  What the film shows that the pamphlet cannot is the bureaucratic and psychological machinery that diffuses responsibility. Anscombe's argument is logical and declarative, pinpointing Truman as the moral agent, but the film dramatizes how a state apparatus allows a leader like Truman to wipe his hands clean while the scientist retains the stain. It visualizes the separation between the political decision-maker who treats the act as a lever of power and the technical agent who must visualize the human cost, revealing how modern war separates the choice to kill from the experience of killing.

  For your seminar, you should screen the Oval Office meeting between Truman and Oppenheimer, the gymnasium speech sequence, and the Trinity test assembly where the atmosphere bet is made. In the Oval Office scene, students should look at Truman's physical gestures of ownership and his dismissal of Oppenheimer's guilt to see how political responsibility is claimed without moral admission. In the gymnasium speech, they should observe the juxtaposition of public acclaim with private horror to analyze how the film locates morality in subjective experience rather than objective act. During the Trinity assembly, they should focus on the casual normalization of existential risk in the atmosphere wager to identify the consequentialist logic that Anscombe rejects.
