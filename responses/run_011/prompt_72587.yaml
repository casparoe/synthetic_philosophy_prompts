answer: |-
  1. The account must define a stable mapping rule between physical stimulus time and reported time that remains invariant under changes in bodily posture, because arm-crossing reverses order judgments without altering stimulus physics. This is non-negotiable for valid psychophysical inference, threatening global-workspace-style broadcast theories that treat report as a direct readout of a unitary conscious state.

  2. The account must explain how later-arriving neural signals can alter the temporal content of an earlier experience without erasing the earlier experience entirely, because phenomena like color phi contain information unavailable at the onset of the first stimulus. This is non-negotiable given flash-lag and color phi data, threatening discrete perceptual-moment accounts that deny continuous temporal integration across processing latencies.

  3. The account must distinguish between probes that constitute the temporal property of the experience and probes that merely measure a downstream decision variable, because temporal-order and simultaneity judgments disagree for the very same stimulus pairs. This status is relative to the interpretation camp, threatening the first-person-operationalist line that equates judgment with experience rather than treating judgment as evidence for it.

  4. The account must accommodate differential neural latencies across modalities without positing a modality-specific consciousness that fails to unify in behavior, because what a stimulus is experienced as can depend on what arrives after it across different senses. This is non-negotiable for multisensory integration, threatening specious-present and retention accounts that rely on a modality-neutral window without mechanistic latency adjustment.

  5. The account must resolve the inconsistency in your suspected triad by denying that there is a determinate fact about when an experience occurs independent of the probe used to reveal it, because maintaining all three renders the Orwellian and Stalinesque distinctions empirically undecidable. This requirement is non-negotiable because your triad is correct that those claims cannot be held together, and it eliminates the largest number of accounts by threatening realist timing models that rely on a single finish line without privileged access.
