              3.  Object of preference (option vs. outcome vs. experience)?
              4.  Paying to remove options (preferences vs. meta-preferences)?
              5.  Description changes affecting preference (framing)?
          *   **Scoring Key:** Map patterns to descriptively named positions (leaves). Required leaves: Choice = Preference; Preferences = Inner Causes; Preferences = Assembled; Sequential Agents; Welfare = Felt Quantity; Dispute = Idle (Prediction); Good = Preference Satisfaction.
          *   **Three Additions:**
