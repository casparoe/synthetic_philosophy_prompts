      *   *Preferences are assembled during the act of choosing:* Constructivist view. Preference doesn't exist until the moment of decision.
      *   *The chooser is a sequence of distinct agents over time:* Multiple Selves/Temporal Disagreement (Thaler, Schelling). Sunday self vs. Wednesday self.
      *   *Welfare is a felt quantity independent of any choice:* Hedonism/Experienced Utility (Kahneman). How it *felt* matters more than what was picked.
      *   *The whole dispute is idle provided prediction is unaffected:* Instrumentalism/Positive Economics (Friedman). Does it help predict? If yes, who cares?
