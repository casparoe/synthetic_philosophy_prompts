  To: Historic Preservation Commission
  From: [Commissioner Name]
  Re: The Stone Church Grant Request

  We face three paths, and each merely relocates the difficulty rather than resolving it. Refusing the grant protects the separation of church and state but abandons the building to decay, losing the historic fabric and the civic memory held within its walls. Approving the grant saves the fabric but risks using tax money to maintain a place of prayer, validating the separationists' fear that we are subsidizing belief. Acquiring the building secures public access and preservation but risks alienating the congregation, turning a living community into a museum piece managed by bureaucrats. None are clean. Each choice trades one risk for another. Refusal protects the treasury but loses the history; approval saves the history but risks the principle; acquisition saves both but risks the community. We must choose the least damaging imperfection, acknowledging that no solution leaves our hands entirely clean.

  Our ordinance funds structures of historic significance open to the public. The principle here is stewardship: public money requires public benefit. We are not funding belief; we are funding stone and glass that tell our town's story. The windows and the 1963 voter-registration arrests are secular history embedded in sacred space. Can they be separated? Physically, no. Politically, yes, if the access is guaranteed and the ownership reflects the public stake. We owe the congregation respect for their stewardship over decades, but we owe the town preservation of its heritage. When private capacity fails—as it has here, with a dwindling congregation and a massive deficit—public intervention becomes permissible, provided the public interest is secured permanently, not temporarily. We must define "public benefit" not as occasional tours, but as guaranteed access to the historic fabric itself.

  Consider the strongest case for refusal, voiced by our separationist colleagues: "To pay for this roof is to subsidize worship. If the state maintains the shell, it enables the function. The food pantry could move to the library; the prayers cannot. We must not set a precedent where tax dollars support religious infrastructure, regardless of historic value. If we fund this, what stops us from funding a new steeple?" This is principled and serious. It loses only because it treats the building as merely religious, ignoring its civic role during the 1963 civil rights struggle and its current function as a food pantry hub for non-members. Refusal punishes the town's history to protect a theoretical boundary. However, this objection imposes a constraint: any approval must ensure the public benefit is not incidental but structural. We cannot rely on goodwill.

  My brother in Heidelberg pays taxes that fund his church directly, viewing it as fair because the church provides social services the state would otherwise fund. Does this differ from our case-by-case grant? Yes. A systematic levy is a contractual exchange for services rendered; a discretionary grant is a subsidy. The German model integrates church and state function; ours seeks to separate them. The Heidelberg system is universal and regulated; our grant is singular and discretionary. Comparing them should make us less comfortable writing the cheque. We cannot rely on the church to provide public welfare as a justification for infrastructure support unless that welfare is guaranteed independently of worship. The Heidelberg model works because it is a state church arrangement; we are not a state church. We must not confuse a social contract with a heritage subsidy. The machinery differs, but the principle differs more: one is payment for service, the other is gift.

  Therefore, I recommend the town acquire the building and lot for a nominal sum. The town undertakes repairs, keeping the congregation on a license to worship and mandating public access weekdays. This separates ownership (public) from use (mixed). It secures the fabric permanently against future neglect. Conditions: The congregation must agree within sixty days; the license must be renewable annually based on public access compliance; the food pantry must remain on-site. If they refuse, we fall back to approval with a strict covenant ensuring public access, but acquisition is preferred to ensure the "public" requirement of our ordinance is met in deed, not just word.

  Our town attorney must confirm the legal viability of acquiring religious property and the licensing terms before we vote. We need to ensure no constitutional barriers exist regarding the nominal sum transfer.

  For future cases, apply these criteria: First, is the historic significance independent of current religious doctrine? Second, is the public access guaranteed by legal covenant, not just promise? Third, does the secular benefit (meals, archives) require this specific fabric? If the answer to any is no, the grant must be refused. We are preserving history, not habit.
