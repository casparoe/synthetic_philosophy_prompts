  *(Self-Correction on B's Darwinian Point)*: Make sure B articulates *why* the lack of natural selection matters for the ladder specifically, not just generally. Dennett's ladder is about *evolutionary* design processes. If the design is top-down (engineers), does the ladder apply?

  *(Self-Correction on Ending)*: Ensure they don't agree. They need to state their crux and remain disagreed.

