      *   **The Art:** Courtroom sketches/studies of the accused. Considered his "best work."
      *   **The Conflict:**
          *   Researcher argues the art's quality is *directly* downstream from the harm (access gained via informing).
          *   Family A (victim of wrongful conviction): Wants sketches pulled.
          *   Family B (other accused, seeking innocence petition): Wants them kept as evidence.
          *   Museum: Makes money/prestige off this work.
          *   Technical constraint: Can't cleanly remove (stub pages, external curriculum links).
      *   **The Core Question:** Can one separate the art's excellence from the monstrous act ("the drawings are excellent and what he did was monstrous"), or is that moral cowardice? Should the user distrust their own aesthetic reaction? What should they argue for in the meeting?
