          1.  Validate the difficulty (this is a hard problem).
          2.  Address the "Separability" question directly (The Researcher is mostly right).
          3.  Address the "Beauty" question (Your reaction is valid but data, not a verdict).
          4.  Propose a framework for the meeting (Consequences > Aesthetics).
          5.  Technical/Practical suggestions (Metadata, Context, Access).
