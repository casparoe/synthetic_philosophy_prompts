      4.  *Substrate independence (Functionalism).* (Silicon = Conscious).
      5.  *Lookup Table (LUT) = No Consciousness.* (Needs process/activity).
      6.  *Branching (Copy + Original) = Quasi-concern.* (Copy is twin, not future self).
