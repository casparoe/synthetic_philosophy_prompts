      *   Avoid "on the one hand, on the other." Pick a side.
      *   Check for verbal disputes (e.g., definition of "survival").

      *(Self-Correction during drafting)*: I need to be careful not to just say "Parfit disagrees." I need to show how the *user's* list contradicts itself.
      *   User says: "Identity isn't what matters" (1).
      *   User says: "Destructive scan is death... nothing there for *me* to survive into" (2).
      *   If Identity isn't what matters, then PCC *is* what matters.
