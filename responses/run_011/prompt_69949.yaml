prompt: |-
  In November, voters in my city of roughly 210,000 approved a charter amendment establishing a standing Citizens' Budget Panel with power to redirect up to $4 million of discretionary capital spending each fiscal year. The amendment is remarkably thin. It provides only that: the panel consists of twenty-one members seated in three cohorts of seven; each cohort serves a single term of eighteen months, with a new cohort seated every six months; members are drawn "by lot from the residents of the city"; no person who currently holds or has held within the previous five years an elected office, a paid city position, or a state lobbying registration may serve; no member may ever be reselected, under any circumstances; and the panel's adopted recommendations take effect unless the council rejects them within ninety days by a two-thirds vote.

  Everything the amendment left blank now falls to me. I direct the office of civic engagement, which will run two selection cycles a year in perpetuity. The council's rules committee will consider my operating regulations in January, after which the city attorney must certify any provision touching eligibility or exclusion. My resources are $60,000 per cycle, one part-time analyst who can run descriptive statistics but has no training in survey sampling, eight weeks from the first mailing to the first session, and no power to compel anyone to serve. Quorum is a majority of seated members.

  Please write the selection-and-composition procedure my office can adopt as a regulation and run every cycle. I want it as an ordered sequence of steps, each stating its inputs, the decision it makes, and what would count as a sufficient resolution rather than a deferral. Where the procedure should halt and refuse to seat, say so and say why. Where the question is normative rather than empirical and must therefore go to a person, name the person and specify exactly what that person is being asked to decide, so that the choice is visible rather than buried in my office's discretion.

  The procedure should confront three structural problems head-on rather than assuming them away. First, the panel's legitimacy rests on its resemblance to the city, but resemblance is purchased from a pool of people who volunteer, and the two come apart; I need a defensible rule for how much divergence from citywide targets my office tolerates, applied against what, and on what basis. Second, the one-term-only rule caps every member's tenure at eighteen months, which means the only people who accumulate knowledge of how this process works across cycles are the unelected staff and any consultants we hire — the rule meant to prevent entrenchment guarantees that the entrenchment, such as it is, will be unelected. State plainly who carries continuity, by what mechanism, and what that costs. Third, because the panel's recommendations survive unless two-thirds of the council votes them down, opponents who cannot reliably command that vote have every incentive to shape the selection procedure itself instead. I therefore want the procedure to specify what must be fixed, published, and unalterable before the city knows which items are on the coming cycle's agenda, and what may legitimately be adjusted afterward — treating the design as something that must be pre-committed to be credible.

  Then run the procedure on three cases:

  1. A cycle whose agenda includes capital items for school facilities, announced in the same month the district proposes closing an elementary school. Response volume triples, and the respondent pool is roughly two-thirds drawn from two neighborhoods, heavily weighted toward people who have already organized publicly on the closure.
  2. A council member requests that a retired city engineer, who is ineligible for elective office and has no lobbying history, be seated on the coming cohort, on the ground that the panel would otherwise make a technical error about drainage.
  3. The stratum for residents aged 18 to 29 in rental households returns four respondents against a target of nine, and one of the four served on the first cohort and asks to serve again.

  At least one of these should produce an outcome I will find unwelcome, and I would rather be told so directly than handed a compromise that conceals the cost. I also want to know which of my office's likely practices would require an amendment rather than a regulation — for instance whether I may exclude close relatives of current council members, whether I may reserve seats, and whether a former member could be seated in a non-voting procedural capacity without violating the clause against reselection. Where the answer depends on the city attorney, tell me what to ask him.

  Finally, include a short closing section on the limits of what you have given me: which steps will misfire, which look mechanical but are in fact value choices wearing a number, and what the procedure cannot settle at all. Do not give me a reading list, citations, or names of studies; put the reasoning inline, and write for a reader who understands the general case for and against selection by lot, and the general case for and against amateur legislatures, but has never had to design one under a budget and a deadline.
reasoning: |-
  Here's a thinking process that leads to the suggested selection-and-composition procedure:

  1.  **Analyze the Request:**

      *   **Role:** Director of the Office of Civic Engagement.
      *   **Context:** City of ~210,000. Charter amendment created a Citizens' Budget Panel (CBP).
      *   **Panel Structure:** 21 members, 3 cohorts of 7, 18-month terms, staggered every 6 months. Selected by lot from residents.
      *   **Exclusions:** No current/former elected officials (5 yrs), no paid city employees, no registered lobbyists. No reselection ever.
      *   **Power:** Can redirect up to $4M discretionary capital spending. Recommendations stand unless Council rejects by 2/3 vote within 90 days.
      *   **Constraints:** $60k budget per cycle, 1 part-time analyst (stats, no sampling), 8 weeks timeline, no power to compel service. Quorum = majority of seated members.
      *   **Task:** Write a selection-and-composition procedure (regulation) as an ordered sequence of steps (Inputs, Decision, Resolution).
      *   **Key Challenges to Address:**
          1.  *Legitimacy vs. Volunteer Bias:* How to handle divergence from city demographics when the pool is self-selected volunteers.
          2.  *Institutional Memory:* One-term limit creates staff/consultant entrenchment. Who carries continuity?
          3.  *Political Manipulation:* Opponents might game the selection process. What must be pre-committed vs. adjustable?
      *   **Test Cases:**
          1.  School closure controversy (biased pool).
          2.  Council member wants ineligible expert seated.
          3.  Underrepresented stratum (18-29 renters) + former member wants to return.
      *   **Legal/Regulatory Boundary:** Distinguish between what needs an amendment vs. regulation (relatives, reserved seats, non-voting returnees). Ask City Attorney specific questions.
      *   **Closing:** Limits of the procedure (mechanical steps hiding value choices, what can't be settled).
      *   **Tone:** Direct, pragmatic, no fluff, no citations, inline reasoning.

  2.  **Deconstruct the Procedure Design:**

      *   *Timeline:* 8 weeks is tight. Needs to be efficient.
      *   *Budget:* $60k/cycle. Need to pay stipends, mailings, venue, maybe a facilitator.
      *   *Sampling:* "By lot from residents" implies sortition. But you can't summon people like a jury (no power to compel). So it's *stratified random sampling from volunteers*. This is the crux of the legitimacy problem.
      *   *Stratification:* Need to match city demographics (Age, Race, Ward/Neighborhood, Housing Status).
      *   *Selection:* Random draw within strata.
      *   *Vetting:* Eligibility check (Charter exclusions).
      *   *Orientation:* Training on budget/process.

  3.  **Address the Three Structural Problems:**

      *   *Problem 1 (Legitimacy/Volunteer Bias):* Since we can't compel, we rely on volunteers. If the volunteer pool is skewed (e.g., Case 1), we must decide: Do we lower the bar to fill seats, or leave them empty? *Decision:* Leave seats empty rather than compromise representativeness, but define a "tolerance threshold" (e.g., pool must be within X% of city demographics to proceed, or we accept the skew but document it). Better: Define a minimum pool size per stratum. If not met, the seat remains vacant. This preserves legitimacy over functionality.
      *   *Problem 2 (Continuity):* Staff cannot influence decisions. Continuity must be procedural, not personal. *Decision:* A permanent "Process Clerk" (staff) maintains records and rules, but a rotating "Panel Clerk" (selected from *previous* panel members?) No, former members can't serve. *Decision:* Continuity lies in the *Documentation and Rules*, maintained by the Office, but audited by an external third party (e.g., University partner or Auditor) to prevent staff capture. Or, simpler: The Office retains institutional memory, but the *rules* prevent staff from advising on substantive budget choices.
      *   *Problem 3 (Pre-commitment):* To prevent gaming, the selection rules (strata, weights, thresholds) must be fixed *before* the budget agenda is published. *Decision:* The "Selection Protocol" is adopted annually in January, before the Fiscal Year budget cycle begins.

  4.  **Drafting the Steps (Iterative Process):**

      *   *Step 1: Pre-Commitment.* Fix the rules before the agenda is known.
      *   *Step 2: Invitation.* Random mailers to residents to generate a volunteer pool. (Crucial: You can't just take walk-ins, that biases toward activists).
      *   *Step 3: Stratification.* Define the target demographics based on Census/City data.
      *   *Step 4: Vetting.* Check exclusions (Charter).
      *   *Step 5: Selection.* Random draw from eligible volunteers to match targets.
      *   *Step 6: Seating.* Confirmation.
      *   *Step 7: Continuity.* How knowledge is transferred.

  5.  **Handling the Test Cases:**

      *   *Case 1 (School Closure):* Pool is skewed. If we stick to the rules, we might not get enough non-activist parents or other neighborhoods. *Outcome:* If the pool doesn't meet the geographic stratification minimums, seats remain vacant. Quorum might be at risk. This is the "unwelcome outcome."
      *   *Case 2 (Council Member/Engineer):* Charter says no "paid city position" within 5 years. Retired engineer is likely okay *unless* "paid city position" implies pensioners or if the Charter defines it broadly. But the Council Member is asking to *seat* them. Staff selects, not Council. *Outcome:* Reject. Council has no appointment power. Eligibility is binary.
      *   *Case 3 (Young Renters + Former Member):* Stratum underfilled. Former member wants back. Charter says "no member may ever be reselected." *Outcome:* Seat remains vacant. Former member cannot return even as non-voting (likely violates spirit/letter of "reselection").

  6.  **Legal/Regulatory Boundaries (City Attorney Questions):**

      *   *Relatives:* Charter doesn't say. Regulation can exclude to prevent nepotism/conflict of interest.
      *   *Reserved Seats:* Charter says "by lot from residents." Reserving seats for specific groups (e.g., "one teacher") might violate "by lot." Reserving for demographics (stratification) is usually okay as part of the "lot" process.
      *   *Non-voting returnee:* "Reselected" usually implies membership. A non-voting advisor might be a loophole. Attorney needs to rule on "member" definition.

  7.  **Refining the Procedure (Self-Correction/Nuance):**

      *   *Budget:* $60k is tight for 7 people + stipends + mailings. Need to be efficient.
      *   *Analyst:* Can run stats, can't design samples. I need to provide the sampling frame logic.
      *   *Continuity:* The prompt asks "State plainly who carries continuity." It can't be the staff alone (entrenchment risk). It can't be members (term limits). *Solution:* The *Record*. The Office publishes a "Cycle Report" that becomes the binding precedent for procedure, not substance.
      *   *Pre-commitment:* The "Selection Protocol" must be published before the Budget Agenda.

  8.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the constraints.
      *   **The Procedure:** Numbered steps. Inputs, Decision, Resolution.
      *   **The Three Problems:** Explicitly addressed within the procedure or as preamble. (Better to embed in procedure logic).
      *   **Test Cases:** Apply the procedure strictly.
      *   **Legal Boundaries:** What needs Amendment vs. Regulation.
      *   **Closing:** Limits of the design.

  9.  **Specific Focus on "Unwelcome Outcome":**
      *   Case 1 is the best candidate. If the pool is 2/3 from two neighborhoods, and we have geographic quotas, we cannot fill the seats. The panel convenes with vacancies. Quorum is still possible (majority of *seated* members), but legitimacy is dented. I must state this clearly: *We do not fill seats with unrepresentative volunteers.*

  10. **Refining the "Continuity" Mechanism:**
      *   The prompt warns against staff entrenchment. If staff are the only ones who know how it works, that's bad.
      *   *Idea:* A "Procedural Auditor." An external entity (e.g., local university political science dept or League of Women Voters) reviews the selection process for compliance. They don't advise on budget, only on *process integrity*. This breaks the staff monopoly on knowledge.
      *   *Wait, budget:* $60k. Can we afford an external auditor? Maybe a simplified version.
      *   *Better:* The "Process Manual." It must be so detailed that any competent temp could run it. Continuity is in the *text*, not the *person*. The Office Director (me) owns the text, but the City Attorney certifies it.

  11. **Final Review against Constraints:**
      *   8 weeks? Mailing takes time. Need to start immediately.
      *   $60k? Stipends are key to getting people.
      *   Analyst? Use them for the randomization and demographic matching.
      *   Tone? Professional, direct, bureaucratic but honest.

  12. **Writing the Response:** (Mental check of the prompt's specific formatting requests: "ordered sequence of steps, each stating its inputs, the decision it makes, and what would count as a sufficient resolution rather than a deferral.")

      *   *Step Structure:* Step X | Input | Decision | Resolution.
      *   *Halting Conditions:* Explicitly state when to stop.
      *   *Normative Questions:* Assign to specific roles (Director, Attorney, Council).

      *(Self-Correction during drafting)*: Make sure to distinguish between the *Selection Protocol* (fixed annually) and the *Cycle Execution* (variable based on pool).
      *(Self-Correction on Case 2)*: The Charter excludes "paid city position." A retired engineer is likely fine *unless* they are receiving a pension that counts as a "position" or if the 5-year clock is running. But the main issue is *who asks*. The Council Member cannot request seating. That violates the "by lot" and independence.
      *(Self-Correction on Case 3)*: "No member may ever be reselected." Does "reselected" mean "seated as a member"? Yes. Can they be an observer? Attorney needs to decide. I will assume no to be safe, but flag it.

      *(Final Polish)*: Ensure the "Unwelcome Outcome" is highlighted. Ensure the "Continuity" answer is explicit. Ensure the "Pre-commitment" is clear.

      *Let's build the Procedure.*
      1. Define Strata (Pre-commitment).
      2. Generate Pool (Random Invitation).
      3. Vet Eligibility (Charter).
      4. Stratified Draw (Matching).
      5. Confirm & Seat (Logistics).
      6. Continuity (Documentation).

      *Let's address the Legal Questions.*
      *   Relatives: Regulation (Conflict of Interest).
      *   Reserved Seats: Amendment (violates "by lot").
      *   Non-voting returnee: Attorney (Definition of "member").

      *Let's write the Closing.*
      *   Mechanical steps hiding values (e.g., defining strata).
      *   What can't be settled (Political will).

      *Ready to write.*
answer: |-
  # Citizens' Budget Panel: Selection and Composition Regulation

  **Effective Date:** January 15 (Annually)
  **Authority:** Office of Civic Engagement (OCE)
  **Certification:** City Attorney

  ## Part I: The Selection Procedure

  This procedure is designed to be executed every six months. To prevent gaming (Structural Problem 3), **Steps 1 through 3 must be completed and published before the City Council finalizes the Capital Budget Agenda for the upcoming fiscal year.** Once the Budget Agenda is public, no changes to selection criteria are permitted for that cycle.

  **Step 1: Stratification Protocol Definition**
  *   **Input:** Most recent U.S. Census Bureau ACS 5-year estimates for the city; City Ward boundaries; prior cycle's demographic report.
  *   **Decision:** The OCE Director sets the target demographic strata for the seven (7) seats. Strata must include: (1) Geographic Ward (proportional to population), (2) Age Cohort (18-29, 30-50, 51+), and (3) Housing Status (Owner/Renter).
  *   **Resolution:** A published "Selection Matrix" defining the exact number of seats allocated to each stratum intersection (e.g., "Ward 3, Renter, Age 18-29").
  *   **Normative Choice:** *OCE Director.* You are deciding which demographic markers constitute "representation." This is not empirical; it is a political choice about what resemblance means.
  *   **Pre-commitment:** This Matrix is locked upon publication. It cannot be altered to accommodate a specific volunteer pool later.

  **Step 2: Random Invitation (Pool Generation)**
  *   **Input:** City voter registration list and utility customer database (merged and deduplicated).
  *   **Decision:** The OCE Analyst generates a random sample of 2,000 residents. Mailing invites them to volunteer for the Panel. No open applications are accepted.
  *   **Resolution:** A volunteer pool generated solely from random invitation.
  *   **Rationale:** Open applications favor the organized and wealthy (Structural Problem 1). Random invitation is the only defensible method to approximate a representative pool from a volunteer base.
  *   **Halting Condition:** If the mailing vendor cannot guarantee delivery within 10 days, halt cycle. The 8-week timeline cannot absorb mailing delays.

  **Step 3: Eligibility Vetting**
  *   **Input:** Volunteer responses; City Clerk's database of elected officials/employees; State Lobbying Registry.
  *   **Decision:** The City Attorney certifies each volunteer's eligibility against the Charter exclusions (no elected office/paid city position/lobbyist within 5 years).
  *   **Resolution:** A list of "Eligible Volunteers."
  *   **Halting Condition:** If a volunteer fails eligibility, they are removed. No appeals process.
  *   **Legal Boundary:** See Part III regarding relatives of Council members.

  **Step 4: Stratified Random Selection**
  *   **Input:** List of Eligible Volunteers; Selection Matrix (from Step 1).
  *   **Decision:** The OCE Analyst runs a random draw within each stratum to fill the allocated seats.
  *   **Resolution:** A list of 7 Selected Members and 7 Alternates.
  *   **Structural Problem 1 (Legitimacy):** If a stratum in the Selection Matrix has fewer eligible volunteers than seats allocated (e.g., Matrix requires 1 Ward 3 Renter 18-29, but only 0 volunteers exist), **the seat remains vacant.** Do not fill the seat from a different stratum. Do not lower the bar.
  *   **Unwelcome Outcome:** It is preferable to seat a panel with vacancies than to seat a panel that violates its own representational rules. If vacancies reduce seated members below quorum (4 members), the cycle is **cancelled**.

  **Step 5: Confirmation and Seating**
  *   **Input:** Selected Members list.
  *   **Decision:** OCE contacts selected members. They must confirm attendance at the orientation within 5 days.
  *   **Resolution:** Seated members sign a conflict-of-interest disclosure. Alternates are notified they are on standby.
  *   **Halting Condition:** If a selected member declines, an alternate from the *same stratum* is offered the seat. If no alternate exists, the seat remains vacant (see Step 4).

  **Step 6: Continuity and Institutional Memory**
  *   **Input:** Cycle records, budget data, procedural logs.
  *   **Decision:** The OCE Director compiles a "Cycle Record." This record is archived and made public.
  *   **Resolution:** A permanent, searchable public archive of all Panel decisions, voting records, and procedural rulings.
  *   **Structural Problem 2 (Continuity):** Continuity is carried by the **Public Record**, not by staff or returning members. The OCE Analyst is prohibited from advising the Panel on *substantive* budget choices (e.g., "Project A is better than Project B"). The Analyst may only advise on *procedural* compliance (e.g., "This vote exceeds the $4M cap").
  *   **Cost:** This limits the Panel's efficiency. They will relearn basic budget mechanics every cycle. This is the price of the one-term rule.

  ---

  ## Part II: Application to Test Cases

  **Case 1: The School Closure Skew**
  *   **Scenario:** Agenda includes school facilities. Pool is 2/3 from two neighborhoods due to activism.
  *   **Procedure Application:** Apply Step 1 (Matrix) and Step 4 (Stratified Selection).
  *   **Outcome:** If the Selection Matrix requires representation from Wards without schools or neighborhoods not involved in the closure, and those strata yield no volunteers, **those seats remain vacant.**
  *   **Unwelcome Result:** The Panel may convene with only 5 members instead of 7. If the activists dominate the volunteer pool in the *remaining* strata, the Panel will likely recommend spending focused on the schools, reflecting the bias of the available pool.
  *   **Directive:** Do not attempt to "balance" the panel by hand-picking moderates. The legitimacy of the lot is that it accepts the risk of bias inherent in the volunteer pool, provided the *invitation* was random. If the random invitation fails to generate a diverse pool, the Panel is weakened, but the process remains clean. If vacancies drop the panel below quorum, **cancel the cycle.** It is better to have no recommendation than a compromised one.

  **Case 2: The Council Member's Engineer**
  *   **Scenario:** Council member requests a retired city engineer be seated to prevent technical errors.
  *   **Procedure Application:** Apply Step 3 (Eligibility) and Step 4 (Selection).
  *   **Outcome:** **Reject the request.**
  *   **Reasoning:**
      1.  **Eligibility:** If the engineer retired within 5 years, they are ineligible by Charter. If >5 years, they are eligible *only* if randomly selected.
      2.  **Selection:** No individual, including Council members, may request seating. This violates the "by lot" clause.
      3.  **Technical Error:** The Panel is an amateur body. Technical errors are a feature, not a bug, of a citizen check on capital spending. If technical expertise is required, the Council should hire staff, not stack the Panel.
  *   **Directive:** Inform the Council Member that the Office has no authority to seat specific individuals. Any attempt to influence selection is a violation of the Charter's independence clause.

  **Case 3: The Underfilled Stratum and Former Member**
  *   **Scenario:** Target 9 young renters, get 4. One is a former member.
  *   **Procedure Application:** Apply Step 4 (Vacancies) and Charter (Reselection).
  *   **Outcome:**
      1.  **Stratum:** 5 seats in this stratum remain **vacant**. Do not fill them from other age/housing groups.
      2.  **Former Member:** The former member is **ineligible**. The Charter states "no member may ever be reselected, under any circumstances."
  *   **Directive:** The former member cannot serve, even as a non-voting advisor. To allow it creates a two-tier class of membership and violates the spirit of the term limit. The knowledge they possess is lost. This is the cost of the amendment.

  ---

  ## Part III: Regulatory vs. Amendment Boundaries

  You asked where your authority ends and the Charter begins. The following determinations require City Attorney certification.

  **1. Exclusion of Close Relatives**
  *   **Question:** May the OCE exclude spouses or children of current Council members?
  *   **Analysis:** The Charter lists specific exclusions (office, employment, lobbying). It does not list relatives.
  *   **Recommendation:** **Regulation.** You may add this as a conflict-of-interest standard in Step 3.
  *   **Ask the Attorney:** "Does the Office of Civic Engagement have the regulatory authority to establish conflict-of-interest exclusions beyond those explicitly listed in the Charter, provided they do not contradict the Charter's text?"

  **2. Reserved Seats (Set-Asides)**
  *   **Question:** May we reserve one seat specifically for a "public school teacher" or "union member"?
  *   **Analysis:** The Charter says members are drawn "by lot from the residents."
  *   **Recommendation:** **Amendment Required.** Stratifying by demographics (age, race, ward) is generally accepted as refining the "resident" pool. Stratifying by *occupation* or *affiliation* likely violates "from the residents" by creating classes of citizenship.
  *   **Ask the Attorney:** "Does stratifying the random draw by occupation or organizational membership constitute a violation of the 'by lot from the residents' clause?"

  **3. Non-Voting Returnees**
  *   **Question:** May a former member return as a non-voting procedural advisor?
  *   **Analysis:** Charter says "no member may ever be reselected."
  *   **Recommendation:** **Attorney Ruling.** If "member" is defined as "voting participant," a non-voting advisor might be legal. However, this creates the exact entrenchment the Charter forbids.
  *   **Ask the Attorney:** "Does the phrase 'no member may ever be reselected' prohibit a former voting member from serving in a non-voting, advisory capacity within the Panel's proceedings?"
  *   **My Advice:** Do not do this. It undermines the term limit's purpose (Structural Problem 2). Let the knowledge die; rely on the written record.

  ---

  ## Part IV: Limits of This Procedure

  This procedure is a machine, but it runs on fuel you cannot manufacture. Here is where it will misfire.

  **1. The "Volunteer" Contradiction**
  Step 2 relies on random invitation, but Step 5 relies on voluntary confirmation. You cannot compel service. This means your "representative" panel is always, in reality, a panel of *people who had the time and inclination to say yes.*
  *   **The Hidden Value:** When you set the stipend amount (within your $60k budget), you are deciding who can afford to serve. A $500 stipend attracts students and retirees. A $5,000 stipend attracts working parents. This is a budgetary decision that functions as a demographic filter. I have not fixed the stipend in this regulation; you must set it annually. Know that this number determines your class composition more than your random draw does.

  **2. The Illusion of Neutrality**
  Step 1 (Stratification) looks mathematical, but it is normative. If you choose to stratify by "Ward," you privilege geography. If you stratify by "Race," you privilege identity. If you stratify by "Income," you privilege class. You cannot match the city on all dimensions simultaneously.
  *   **The Hidden Value:** By choosing the Census variables for Step 1, you are deciding which fractures in the city matter. If you do not stratify by renter status, renters (who are often transient and harder to mail) will be underrepresented. I have included it in Step 1, but you must defend that choice to the Council every January.

  **3. The Power of the Agenda**
  The Panel can only redirect *discretionary capital spending.* This procedure selects the people, but it does not control the menu. The City Manager and Council define what is "discretionary."
  *   **The Limit:** If the Council classifies 95% of the capital budget as "mandatory" or "emergency," the Panel's $4 million power becomes trivial. This procedure ensures the Panel is legitimate, but it cannot ensure the Panel is powerful. That depends on the Council's willingness to define "discretionary" broadly.

  **4. The Staff Entrenchment Risk**
  I have assigned continuity to the "Public Record" (Step 6). In practice, the OCE Analyst will become the de facto interpreter of that record. Over time, the Analyst will gain soft power over the Panel simply by knowing where the files are.
  *   **The Limit:** No regulation can fully prevent staff capture. The only check is transparency. You must publish the Analyst's procedural memos alongside the Panel's votes. If the Analyst begins advising on substance, you must fire them. There is no middle ground.

  **Final Instruction:**
  Adopt this regulation in January. Publish the Selection Matrix before the Budget Agenda is released. When the unwelcome outcomes occur (vacant seats, cancelled cycles, angry Council members), refer them to this text. Do not apologize for the vacancies. They are the proof that the process is not rigged.
