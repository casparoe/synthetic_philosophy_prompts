answer: |-
  You are not drafting a legal code for pixels; you are drafting a **constitution for a social space.** Your sister is right that the *objects* are pixels, but she is wrong that the *stakes* are. The stakes are human time, identity, and trust. Your appeal letter isn't asking for objective truth; he is asking for **predictability**. He wants to know that if he follows the rules, he won't be punished by "vibes."

  You can save almost all your verdicts without a baroque monster, but you must make one distinction clear: **Peer-vs-Peer** rules are different from **Platform-vs-Player** realities.

  Here is the principle that generates your verdicts, the clauses that codify it, and the application to your hard cases.

  ### The Principle: Stewardship of Anchored Agency

  **Core Statement:** *Moderation protects the human investment (time, money, identity, consent) of players from interference by other players, but does not insure players against the risks of game mechanics or platform authority.*

  This principle distinguishes between **harm inflicted by a person** (which you moderate) and **loss incurred by a system** (which you do not).

  #### The Clauses

  **Clause 1: The Labor & Asset Protection Clause**
  *   **Rule:** A player's invested time, skill, or real money constitutes protected property. Deliberate destruction or theft of this property by another player is a violation.
  *   **Motivated By:**
      *   *The Jacket Hack:* (Verdict: Wrong). This was peer interference with invested labor.
      *   *The Real Money Lamp:* (Verdict: Taking). Real-world tether makes the loss actionable.
      *   *The 400-Hour Build:* (Verdict: Protect). High labor investment creates a "social artifact."
  *   **Exception:** This protection does not apply to losses resulting from intended game mechanics (RNG, Duels) or Developer actions (Patches).
      *   *Motivated By:* *The Fair Duel* (Verdict: No Wrong), *The Dev Patch* (Verdict: Not a Wrong), *The Regenerated Build* (Verdict: Nothing Lost). In these cases, the loss was systemic or authoritative, not malicious peer interference.

  **Clause 2: The Identity & Context Clause**
  *   **Rule:** A player's real-world identity, likeness, and reasonable expectation of privacy are inviolable, regardless of in-game tools used. Harm is scaled by immediacy and inescapability.
  *   **Motivated By:**
      *   *The Deepfake Avatar:* (Verdict: Wrong). Violates identity/likeness rights even if private/victim unaware.
      *   *The Voice Assault:* (Verdict: Assault). Voice is immediate/inescapable; Text is avoidable. The *channel* defines the harm.
      *   *The AI Companion:* (Verdict: Grief Valid, NPC Unharmed). Acknowledges human emotion without granting rights to code.

  **Clause 3: The Signal vs. Noise Clause**
  *   **Rule:** Actions that cause no direct harm but violate community norms of decency may be flagged for monitoring rather than punishment, to assess risk to human safety.
  *   **Motivated By:**
      *   *The NPC Killing:* (Verdict: Monitor). No human harmed, but signals potential for future human harm. Distinguishes "Crime" from "Concern."

  ---

  ### Running the Flip-Flop Cases

  **Case A: The Rigged Casino**
  *   **Facts:** Player-run, in-game currency only, rigged, teenagers lost a year of grinding.
  *   **Analysis:**
      *   Is it "just game mechanics"? **No.** It is a player-created exploit, not a dev feature. It bypasses the "System Risk" exception.
      *   Is there "Investment"? **Yes.** A year of grinding counts as Labor under Clause 1, even if the currency isn't real money.
      *   Is there Consent? **No.** Rigging violates the implicit contract of fair play.
  *   **Verdict:** **Bannable Offense (Fraud).**
  *   **Reasoning:** This is not "losing a duel"; this is theft by deception. It violates Clause 1 (Labor) because the loss was not due to intended mechanics, but due to peer manipulation.

  **Case B: The Private Recording**
  *   **Facts:** Private voice chat recorded and posted to outside forum.
  *   **Analysis:**
      *   Does it matter that the material is "just game"? **No.** Clause 2 protects *Context* and *Privacy*.
      *   Where did the wrong happen? **Outside.** But the breach originated from a violation of in-world social contract (expectation of privacy).
  *   **Verdict:** **Bannable Offense (Privacy Violation).**
  *   **Reasoning:** The tool (recorder) is neutral; the breach of context is the violation. You protect the *social safety* of the voice room, not just the audio data.

  ---

  ### The Discriminating Case (To Test Your Mods)

  To ensure your mods understand the difference between **Labor Protection** and **Paternalism**, give them this scenario:

  **The Case:** A player spends 300 hours building a house. They accidentally use a valid game tool to demolish it themselves. They appeal for a rollback, crying that their labor is lost.
  *   **Correct Verdict:** **Deny Appeal.**
  *   **Why:** Clause 1 protects labor from *peer interference*, not from *player agency*. Restoring it removes consequence and treats the player as incapable.
  *   **The Trap:** If a mod restores it out of pity, they are prioritizing "Feelings" over "Agency." If they deny it, they uphold the principle that players own their mistakes as well as their creations.
  *   **Contrast:** If *another player* had demolished it, you would restore it. The *source* of the loss dictates the ruling, not the *amount* of loss.

  ---

  ### The "One Mistake" Option

  If this feels too heavy, you must drop one verdict to keep the rule clean. The weak link is **The Deepfake (Private Instance).**

  *   **The Conflict:** You ruled it "Wrong" even though the victim never knew and no real-world harm occurred. This relies on an abstract concept of "Dignity" that is hard to codify without becoming moral police.
  *   **The Sacrifice:** Admit that if the victim is unaware and the content never leaves the private instance, it is **Non-Actionable.**
  *   **Why:** It aligns better with Clause 2 (Harm requires a breach of context/privacy *to the subject*). It stops you from policing thoughts/private acts that have no social fallout.
  *   **The Gain:** Your rule becomes strictly about **Observable Harm to Agency.** It makes the doc easier to defend. "We punish what hurts the community or the individual, not what *might* be morally icky in a vacuum."

  ---

  ### Addressing the Appeal & The "Social Convention" Question

  You asked if this is just local social convention. **Yes.** But that does not make it "etiquette."

  *   **Etiquette** is "don't chew with your mouth open." (Preference)
  *   **Convention** is "we drive on the right side of the road." (Coordination)
  *   **Law** is "if you drive drunk, you lose your license." (Consequence)

  Your community is operating on **Convention** that needs to function like **Law** for the sake of trust. The appeal letter is valid because "vibes" are arbitrary, and arbitrariness is abuse of power.

  **How to answer the appeal:**
  Do not try to prove your original ban was "objectively true." Prove it was **consistent with the written standard.**

  > *"You were correct that our past rulings were inconsistent. We have since codified our standards. Under our new Clause 1 (Labor & Asset Protection), your action [insert specific action] constituted interference with another player's invested time/property outside of intended game mechanics. We are applying this standard consistently moving forward. We apologize that this standard was not clear at the time of your ban."*

  This admits the "vibes" problem without undermining the ban. It tells him: *The game has changed. The rules are now written. You broke the written rule.*

  **Final Advice:**
  Put the **Principle of Stewardship of Anchored Agency** at the top of your doc. Then list the Clauses. Then list the "Precedents" (your cases). Tell your mods: *"If a case isn't in the doc, ask. If it is, follow it even if your vibe says otherwise. Consistency is more important than perfection."*

  Perfection is impossible. Consistency is how you keep the 600 regulars trusting you.
