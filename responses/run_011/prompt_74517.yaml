answer: |-
  **Mark: 13/20 (High 2:1)**

  **Feedback Comments**

  Here is a point-by-point breakdown of the essay to help you justify the mark and guide your marginal comments. I have focused on the philosophical accuracy of each move, as requested.

  **Paragraph 1: Setting out the objection**
  *   **Quote:** *"The cluelessness objection starts from the fact that what we do ripples out much further than we can see."*
      *   **Verdict:** **Right.** Accurate, concise summary of the core intuition (Lenman/Goodin).
  *   **Quote:** *"So this is an epistemic objection rather than a metaphysical one: it doesn't say the act with the best consequences isn't the right one, it says we can never tell which act that is."*
      *   **Verdict:** **Right.** This is the most important distinction in this topic (criterion of rightness vs. decision procedure). Excellent clarity here for a second-year student.

  **Paragraph 2: Self-Defeat and Rule-Following**
  *   **Quote:** *"But otherwise it is basically the self-defeat problem: a theory which, if everyone followed it, would make its own aims worse achieved."*
      *   **Verdict:** **Wrong/Conflated.** This is a significant philosophical slip. Cluelessness (we *cannot know* the outcomes) is distinct from Self-Defeat (trying to maximize *causes* worse outcomes, e.g., the hedonic paradox). They often lead to the same solution (indirect strategies), but they are not the same problem. You should note this in the margin.
  *   **Quote:** *"And once you see that, the reply is the same reply that gets given to self-defeat — don't follow the theory act by act, adopt rules or dispositions..."*
      *   **Verdict:** **Right-but-underdeveloped.** The move to Indirect Consequentialism is the correct standard response. However, because the student conflated the problem with self-defeat, the justification is shaky. It succeeds as a decision procedure, but the student doesn't explain *why* rules solve cluelessness (i.e., rules track *expected* value based on past data rather than future prophecy).

  **Paragraph 3: False vs. Decision Procedure & 'Every Moral Theory'**
  *   **Quote:** *"Does it show consequentialism is false? No. Whoever presses the objection is not claiming the criterion of rightness is contradictory, only that it cannot guide anyone."*
      *   **Verdict:** **Right.** Correctly answers the specific prompt question regarding falsity vs. guidance.
  *   **Quote:** *"Also, the objection is not a specifically consequentialist one. Every moral theory has to care about consequences somewhere... so if cluelessness refutes consequentialism it refutes everything, which means it refutes nothing."*
      *   **Verdict:** **Wrong/Weak Argument.** This is the second major philosophical issue (and the paragraph you were unsure about).
          1.  It is not true that *every* theory cares about consequences in the same way (e.g., strict deontology judges the act itself, not the outcome).
          2.  Even if they did, Consequentialism is *more* vulnerable because consequences are the *sole* determinant of rightness. Ignorance hurts C more than it hurts Kantianism. This is a *tu quoque* fallacy; just because others have a problem doesn't mean C doesn't have a fatal one.

  **Paragraph 4: Two Responses**
  *   **Quote:** *"(1) the rule or disposition response described above, and (2) simply maximise expected value using subjective probabilities..."*
      *   **Verdict:** **Right.** These are the two standard responses in the literature (Indirect Consequentialism and Subjective/Expected Value Consequentialism).
  *   **Quote:** *"A third response would be to discount the far future so it matters less, but that looks ad hoc."*
      *   **Verdict:** **Right.** Good evaluative comment on the third option.
  *   **Quote:** *"...say how far each one succeeds."* (Prompt requirement)
      *   **Verdict:** **Underdeveloped.** The student claims Response 1 means "you are not required to predict" and Response 2 means "we act on the best estimate." They do not critically evaluate the *limits*. (e.g., Expected Value still requires probability assignments which cluelessness suggests are impossible for 'unknown unknowns'). They assert success rather than arguing for it.

  ***

  **TA Notes: Addressing Your Specific Doubts**

  You mentioned you were unsure about the **Rule-Following** paragraph and the **'Every Moral Theory'** paragraph. Here is the breakdown so you can defend the mark:

  1.  **The Rule-Following Paragraph:** The student gets credit for identifying Indirect Consequentialism as the solution. However, they lose marks for claiming Cluelessness *is* the Self-Defeat problem. They are distinct arguments that converge on the same solution. If a student conflates them, they haven't fully mastered the literature (Lenman specifically distinguishes his objection from standard self-defeat arguments). This prevents the essay from being a First.
  2.  **The 'Every Moral Theory' Paragraph:** Your instinct to question this was correct. This argument is philosophically weak. It attempts to dismiss the objection by spreading it around (*tu quoque*), but it fails to recognize that Consequentialism bears a heavier burden of proof regarding consequences than Deontology does. A Kantian can say "I didn't know the lie would start a war, but the lie was still wrong." A Consequentialist says "I didn't know, therefore I don't know if it was right." The epistemic burden is higher for C. The student's claim that "it refutes nothing" is logically unsound.

  **Summary for the Student:**
  "Strong grasp of the core distinction between criterion and decision procedure. However, be careful not to conflate 'cluelessness' with 'self-defeat'—they are distinct objections that happen to share a solution. Also, the argument that 'all theories face this' overlooks that consequentialism is uniquely vulnerable to it because consequences are constitutive of rightness, not just relevant. More critical evaluation of the limits of the 'expected value' response was needed to push this higher."
