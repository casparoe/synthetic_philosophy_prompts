          *   *Analysis:* **Weak/Controversial.** This is the paragraph the TA was unsure about. Is it true *every* theory cares about consequences *in the relevant way*? Deontology often focuses on the act itself (lying is wrong *prima facie* regardless of outcome). While consequences matter for *some* deontological constraints (catastrophic consequences might override), the *weight* given to consequences is the differentiator. Cluelessness hits Act Consequentialism hardest because consequences are the *sole* determinant of rightness. For a Kantian, if the maxim is universalizable, the unknowable future consequences might not change the deontic status of the act. So, saying it "refutes nothing" is an overstatement. It's a *stronger* objection to consequentialism than to deontology.

