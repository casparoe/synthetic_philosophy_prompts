answer: |-
  You are experiencing the standard friction between **Welfare Utilitarianism** (minimize total suffering/duration) and **Relational Ethics** (what do we owe animals specifically because of our relationship to them). Your intuitions are not broken; they are switching between these two frameworks depending on the case.

  For an SOP that survives an audit, you cannot use a baroque theory that saves every intuition. Auditors need measurable standards, not philosophical nuance. You need a **Custodial Duty Principle**.

  Here is the principle, broken down by clause, mapped to your cases, followed by the cost you must pay to hold it.

  ### The Principle: Custodial Duty of Care

  **Core Statement:** *Harm is permissible only when necessary for a vital human end (food/health), and within that necessity, we prioritize preventing harms we directly inflict over harms we merely permit, weighted by our confidence in the animal's sentience.*

  #### Clause 1: The Necessity Test (Vital vs. Frivolous)
  *Harm inflicted for non-vital human ends is impermissible, regardless of magnitude.*
  *   **Motivating Case:** **Catch-and-Release vs. Farming.** Hooking a fish for sport (frivolous) is worse than farming/killing for food (vital), even if the farmed fish suffers more total duration.
  *   **Motivating Case:** **Cooking Video vs. Culling.** Killing a healthy fish for a video (frivolous) is banned. Culling deformed fry (vital for stock health/resource allocation) is permitted.
  *   **SOP Application:** Any procedure not directly linked to harvest, health, or survival of the stock must be flagged for removal.

  #### Clause 2: The Imposition Hierarchy (Direct vs. Environmental)
  *Harms directly inflicted by human action take moral priority over harms resulting from environmental conditions, even if the environmental harm is chronic.*
  *   **Motivating Case:** **Eyestalk Ablation vs. Crowded Tanks.** Ablation is a direct surgical manipulation for production efficiency. Crowding is an environmental condition. Your intuition that ablation is "more wrong" fits here: it is an active violation of integrity, whereas crowding is a passive constraint.
  *   **Motivating Case:** **Cleaner Fish vs. Peroxide Bath.** Feeding cleaners to salmon is using one animal as a tool (direct instrumentalization). Peroxide is a chemical stressor applied to the patient. The death of the cleaner is a direct imposition of predation; the stress of the bath is a side effect of treatment.
  *   **SOP Application:** Protocols must minimize active manipulation (surgery, forced predation) even if it means tolerating higher baseline environmental stress (density), provided baseline stress stays within legal limits.

  #### Clause 3: The Acute/Chronic Trade-off (Death Method)
  *In killing, acute suffering (intensity) outweighs chronic suffering (duration) because death ends the capacity to suffer.*
  *   **Motivating Case:** **Percussive Blow vs. Gasping.** A hard blow is instant. Gasping is prolonged. The "mediocre life" is identical, so the difference is entirely in the death event.
  *   **Motivating Case:** **CO2 Stunning.** CO2 causes aversion/thrashing (acute distress) before unconsciousness. Percussion does not. Therefore, percussion is preferred.
  *   **SOP Application:** Stunning methods must render immediate insensibility. Any method causing aversion behavior (thrashing, escape attempts) prior to insensibility is non-compliant.

  #### Clause 4: The Sentience Weighting
  *Uncertainty about sentience defaults to caution, but confidence scales the strictness of the duty.*
  *   **Motivating Case:** **Octopus vs. Shrimp.** You ban octopus farming because confidence in their sentience/cognitive capacity is high. You are agnostic on shrimp, so the rules are looser, but not non-existent.
  *   **Motivating Case:** **Fishmeal (Wild Fish vs. Shrimp).** You accept fishmeal for salmon (fish feeding fish) but hesitate for shrimp. This implies you weight vertebrate suffering higher than invertebrate suffering.
  *   **SOP Application:** Vertebrates (salmon, wrasse) get higher welfare thresholds than invertebrates (shrimp), but invertebrates are not exempt from humane killing standards.

  ---

  ### The Cost: What You Must Give Up

  You asked me to be blunt. To use this principle in an audit-proof SOP, you have to drop two of your intuitions.

  **1. Drop the "Wild vs. Farmed Shrimp" Preference.**
  *   **Your Intuition:** Wild shrimp had a worse life, but you'd rather eat them.
  *   **The Principle's Verdict:** If the kill method is identical, and the wild life was worse (predation, starvation, environmental stress), the wild shrimp is the *ethical* choice. Your preference for wild shrimp is likely **moral distancing** (you feel less responsible for the wild catch), not welfare logic.
  *   **The Fix:** Admit you prefer wild shrimp because you don't sign their death warrant, not because they suffered less. In your SOP, treat farmed shrimp kill methods with the same rigor you wish wild catch had.

  **2. Resolve the "Ice Slurry" Inconsistency.**
  *   **Your Intuition:** Chilling shrimp = Not Fine. Chilling salmon = Fine.
  *   **The Principle's Verdict:** This is empirically inconsistent unless the *endpoint* differs.
      *   If salmon are chilled for **sedation** then percussively killed: This is Fine (anesthesia).
      *   If shrimp are chilled **to death** in slurry: This is Not Fine (thermal shock/suffocation).
      *   If you chill salmon **to death**: That is also Not Fine.
  *   **The Fix:** Your SOP must specify that cold is for *sedation only*. Killing by thermal shock is non-compliant for both species. If your shrimp protocol kills by slurry, you need to change it to match the salmon standard (sedate then kill), or admit you are applying a double standard based on species bias.

  **The Deal:** Take the **Simple Principle** (Custodial Duty). It costs you the "Wild Shrimp" comfort and forces you to align the Shrimp/Salmon cold protocols. A baroque theory that saves those intuitions will collapse under audit scrutiny because it relies on "feelings" rather than "duty of care."

  ---

  ### Application to New Cases

  **1. Farming Decapods (Shrimp/Prawns) for Fishmeal.**
  *   **Verdict:** **Impermissible.**
  *   **Reasoning:** Clause 1 (Necessity) and Clause 4 (Sentience). Feeding high-trophic farmed fish (salmon) with farmed decapods adds a trophic layer of suffering for no human food gain (the decapods aren't eaten). It multiplies the "headcount" of death without vital necessity.
  *   **SOP:** Do not source feed containing decapod meal if fishmeal/algae alternatives exist.

  **2. Disease Outbreak (40% Mortality).**
  *   **Verdict:** **Welfare Harm of the System, not Bad Luck.**
  *   **Reasoning:** Clause 2 (Imposition). By placing animals in high-density pens, you created the *risk* environment. An outbreak is a realization of that risk.
  *   **SOP:** Mortality >5% in a week triggers a welfare review. It is a system failure, not an act of God. You must log it as a welfare breach, not just a biological event.

  **3. Slower-Growing, Hardier Strain (More Fish-Days).**
  *   **Verdict:** **Welfare Improvement.**
  *   **Reasoning:** Clause 3 (Acute/Chronic). A hardier strain suffers less from disease/environmental stress. Even if they live longer (more total "fish-days" of life), the *intensity* of suffering per day is lower. Utilitarian "total suffering" is less relevant than "suffering rate."
  *   **SOP:** Prioritize stock strains with documented disease resistance over growth speed, provided economic viability holds.

  **4. Supermarket Live Lobsters (Boiled to Order).**
  *   **Verdict:** **Relevantly Different (and Worse).**
  *   **Reasoning:** Clause 1 (Necessity) and Clause 3 (Acute). Boiling to order is often for freshness perception (marketing), not strict food safety (lobsters can be cooked post-kill). It involves acute suffering (boiling alive) for a trivial gain (perceived freshness) in a retail setting where stunning is feasible.
  *   **SOP:** Your shrimp unit should not do this. If you kill shrimp, it must be stunned first. Boiling live is non-compliant with your own CO2/Percussion standard.

  ---

  ### Settled Science vs. Contested Norms

  You asked to separate what is fact from what is value. This is critical for your audit defense.

  #### Settled / High Consensus (Empirical)
  *   **Fish Sentience:** It is settled among veterinary and biological scientists that teleost fish (salmon) possess nociceptors and opioid receptors, and exhibit trade-off behaviors indicating pain experience, not just reflex. *Confidence: High.*
  *   **CO2 Aversion:** Salmonids actively avoid CO2-rich water. Thrashing in CO2 stunning is an aversion response, not just spinal reflex. *Confidence: High.*
  *   **Eyestalk Ablation:** Increases stress hormones (serotonin/cortisol equivalents) and mortality in broodstock. Being phased out in EU/ASC certified farms. *Confidence: High.*
  *   **Cleaner Fish Mortality:** Significant mortality occurs in sea pens (predation by salmon, starvation, handling). Estimates vary, but "a big fraction die" is accurate. *Confidence: High.*
  *   **Fish-In-Fish-Out (FIFO):** Ratios vary wildly. 1.5kg wild fish per 1kg salmon is an optimistic industry average; 3:1 is more realistic if you count bycatch and trimmings properly. *Confidence: Medium (numbers fluctuate).*

  #### Contested / Live Debate (Empirical & Normative)
  *   **Crustacean Sentience:** Legally recognized in the UK (Animal Welfare Sentience Act 2022) and EU. Scientifically, evidence is strong (learning, avoidance), but some industry bodies contest the *degree* of pain vs. reflex. *Status: Legally Settled, Scientifically Debated.*
  *   **Ice Slurry Killing:** Is it anesthesia or pain? For shrimp, evidence suggests thermal shock is painful. For fish, it's considered a sedative *if* followed by rapid kill. Using it as the sole kill method is increasingly contested. *Status: Live Debate.*
  *   **Stocking Density:** What constitutes "crowding"? There is no universal biological threshold for "psychological stress" in fish, only physiological stress markers (cortisol, gill damage). *Status: Normative/Regulatory.*
  *   **Stunning Efficacy:** Whether a percussive blow renders *immediate* insensibility depends on the operator. 10% of blows may miss or be insufficient. *Status: Operational Risk.*

  #### Normative (Values)
  *   **"Natural" vs. "Farmed":** There is no scientific basis that wild death is "better" than farmed death. This is purely a human value judgment about nature.
  *   **Headcount vs. Capacity:** Is it worse to kill 1,000 shrimp or 1 salmon? Science can tell you about their nervous systems; it cannot tell you which death matters more. That is your ethical choice (Clause 4).
  *   **Culling:** Is it kinder to kill a deformed fry or let it be outcompeted? Science says both involve stress. Ethics says active killing is more responsible.

  ### Final Advice for the SOP

  When writing the protocol, do not write "We do this because it feels right." Write:
  1.  **Method X is selected** because it minimizes time to insensibility (cite AVMA/OIE guidelines).
  2.  **Procedure Y is avoided** because it induces aversion behavior (cite specific study on CO2/Thermal shock).
  3.  **Monitoring Z is required** because operator error rates on stunning are estimated at 5-10% (cite audit data).

  You are not writing a moral treatise; you are building a guardrail. Use the **Custodial Duty** principle to justify the guardrails. If the auditor asks why you banned ice-slurry killing for shrimp but allow it for salmon sedation, your answer is: *"Sedation is not killing. Killing by thermal shock is not compliant with our standard for immediate insensibility."*

  Keep it operational. Keep it defensible. And accept that you are responsible for the farmed shrimp in a way you aren't for the wild ones—that's not hypocrisy, that's the job description.
