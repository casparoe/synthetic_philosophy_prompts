  4.  **Fleshing out the Content:**

      *   *Replicator/Interactor Distinction:* Dawkins (*The Extended Phenotype*) admits selection acts on phenotypes. He calls genes the *beneficiaries*. Sober & Wilson (*Unto Others*) argue that if group properties cause differential survival, groups are units of selection, regardless of whether they "replicate" in the gene sense *yet*.
      *   *The "Dissolving Group" Objection:* The user mentions trait groups dissolving. This is MLS1 (individuals differ in fitness based on group membership) vs. MLS2 (groups reproduce as wholes). Sober & Wilson accept MLS1 is often just gene selection re-described, *but* they argue MLS2 is possible (e.g., insect colonies, volvox). Dawkins is skeptical of MLS2.
