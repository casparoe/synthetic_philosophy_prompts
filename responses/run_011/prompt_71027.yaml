      *   **Correction 2: Formal Equivalence $\neq$ Causal Equivalence.** Just because Price Equation partitions balance doesn't mean the *causal story* is the same. Analogy: Ptolemy vs. Copernicus (predictively similar, causally distinct).
      *   **Correction 3: The Empirical/Stakes Question.** It's not just verbal. It matters for *Evolutionary Transitions in Individuality* (ETI). When does a group become a Darwinian individual?
