answer: |-
  ### Desiderata for an Adequate Account of Looping Effects

  1.  **Mechanism of Interaction:** The account must specify the pathway by which classification knowledge alters the classified token (e.g., via self-narrative, behavioral adjustment, or clinician expectation). *Requirement:* Without a mechanism, "looping" is indistinguishable from merely counting a pre-existing kind more accurately.
  2.  **Causal Directionality:** The account must provide non-experimental criteria for establishing that the label caused the change, not vice versa (e.g., temporal lag between publication and prevalence spike, or regional divergence). *Requirement:* Committees cannot withhold diagnosis to test counterfactuals; they need observational heuristics for direction.
  3.  **Specificity against Confounds:** The account must distinguish looping from measurement reactivity, stigma-driven reporting, treatment access changes, or underlying prevalence shifts. *Requirement:* Policy decisions fail if they treat increased access or reduced stigma as ontological change in the disorder.
  4.  **Temporal Bounds:** The account must explain latency (why effects take time) and cessation (how a kind dies while symptoms persist). *Requirement:* An account that cannot explain "dead kinds" cannot predict the lifespan of new ones.
  5.  **Heterogeneity of Effect:** The account must permit a single classification to stabilize tokens in one subgroup while destabilizing them in another. *Requirement:* Uniform effect models fail when faced with political contestation or cultural variance within a diagnosis.
  6.  **Normative Neutrality:** The account must not equate "looping" with "unreal" or "constructed" in a pejorative sense. *Requirement:* A looping kind can be as medically urgent as an indifferent one; the account must not prejudice treatment obligations.
  7.  **Reflexivity:** The account must locate the classifier/researcher as a node within the causal network, not an external observer. *Requirement:* Ignoring the classifier's role in sustaining the loop leads to blind spots in prediction and maintenance.
  8.  **Intentionality Distinction:** The account must distinguish between therapeutic stabilization (beneficial looping) and deliberate case recruitment (manipulative looping). *Requirement:* Ethical deployment requires knowing whether the loop serves the patient or the system.

  ### Test Cases

  **Case 1: The Current Proposal (Invented)**
  An adequate account applies Desiderata 3, 4, and 5. The pre-label rise (6 years prior) suggests either an underlying prevalence shift (Desid 3) or anticipatory looping via draft criteria leaks (Desid 4). The regional divergence (quadruple vs. flat) confirms the label is the causal variable, not the underlying behavior (Desid 2). The mixed subjective reports (stabilizing vs. dissolving) and political fighting require the account to model the kind as heterogeneous (Desid 5): the label acts as a stabilizer for those seeking legitimacy and a destabilizer for those rejecting the script. The account validates the loop without invalidating the distress.

  **Case 2: The Dead Kind (Neurasthenia)**
  Neurasthenia functioned as a recognizable kind from 1869 to the mid-20th century. An adequate account (Desid 1 & 4) explains that while fatigue and pain persist, the *kind* is now inaccessible because the cultural script and clinical reinforcement loop dissolved. One cannot "have" Neurasthenia today because the feedback mechanism between symptom, label, and self-conception is broken. The account implies that reviving the label would not restore the old kind but generate a new, distinct interactive kind.

  ### Meta-Level Analysis

  **Non-Negotiable vs. Camp Preferences**
  *   **Non-Negotiable:** *Causal Directionality* (2) and *Specificity against Confounds* (3). Without these, the account offers no decision procedure for the committee.
  *   **Biomedical Realist Preferences:** *Normative Neutrality* (6) (often pushed to mean "looping doesn't reduce reality") and *Mechanism of Interaction* (1) (preferred as biological/neurological rather than discursive).
  *   **Constructionist Preferences:** *Reflexivity* (7) and *Heterogeneity* (5) (emphasizing that the classifier creates the reality and that effects are never uniform).

  **Most Eliminative Requirement**
  You suspect *Direction of Causation* (2). I agree, but with a caveat: it is the theoretical bottleneck, but *Specificity against Confounds* (3) is the practical killer. Most accounts fail because they cannot distinguish a loop from a simple reduction in stigma increasing reporting rates. However, Causation is the deeper philosophical filter; if you cannot establish direction, you cannot claim a loop exists at all.

  **Incompatible Pair**
  The pair **Stability of Kind Identity** vs. **Generativity of Loop** is unsatisfiable.
  *   *Reasoning:* If the loop is genuinely generative (it changes what the kind *is*), then the kind post-loop is not identical to the kind pre-loop. If you demand the kind remain stable across the loop to track it as "one thing," you must deny the loop is constitutive, reducing it to mere noise or error. You cannot have a kind that changes essentially while remaining numerically identical. The committee must choose: are we tracking a moving target (generative) or fixing a measurement error (stability)?

  ### Scorecard

  **Hacking:** Captures interaction/normativity well; lacks metrics for direction/confounds.
  **Network:** Models dynamics/heterogeneity well; struggles with normative status of nodes.
  **Biomedical:** Fails interaction (treats looping as error); strong on confounds.
  **Constructionist:** Captures generativity/reflexivity; fails stability (cannot distinguish kind change from noise).
