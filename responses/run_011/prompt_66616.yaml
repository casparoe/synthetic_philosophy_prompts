answer: |-
  Brainstorming:
  1. Protagonist: Ingrid, 48, CFO. Highly competent, historically overlooked for boards.
  2. Conflict: The offer arrives Dec 2007. Is it merit or math?
  3. Staging: The moment she sees the board list. She realizes she is one of four women. The math is too perfect.
  4. Detail: Press calling them "The Golden Skirts."
  5. Boring Scene: Reviewing director indemnity insurance premiums.
  6. Choice: Ingrid works best because she needs the external validation to calibrate her own worth. The moment she notices is when the Chairman discusses the "slate" not as people but as compliance units.

  ***

  The rain in Oslo that December wasn't falling so much as hanging in the air, a wet grey suspension that coated the windows of the Hegdehaugsveien office. Ingrid sat with the letter of appointment on her desk. It was heavy stock, embossed logo, the kind of paper that used to mean something. *Norsk Industri ASA*. A seat on the board.

  She was forty-eight. She had run finance for two subsidiaries during the dot-com crash without blinking. She knew the weight of a balance sheet better than she knew the faces of her own cousins. For twenty years, she had waited for this signal. The market was a cold judge, but an honest one. If they called you, it meant you were visible. If they didn't, you were invisible. It was a binary system she trusted.

  Now the phone rang. It was Henrik, the Chairman of the Nominating Committee.

  "Ingrid," he said. His voice was tired, stripped of the usual ceremonial warmth. "We need to finalize the indemnity insurance before the new year. The deadline is the thirty-first."

  "Send the forms," she said. "I'll review the coverage limits."

  "Good. Also, the press is asking for comment on the slate. We're at thirty-seven percent female representation. We just need your signature to hit the requirement."

  "I see."

  "We're pleased to have you."

  He hung up before she could respond. Ingrid looked out the window. A delivery bike skidded on the wet cobblestones. She picked up the letter again. Before 2006, this paper would have been a mirror. It would have reflected her competence back at her, validated by the scarcity of the offer. Now it felt like a receipt. She had been purchased to fill a gap, not to fill a role. The signal was dead. The market wasn't judging her; it was judging the company's compliance.

  The nominating committee meeting was scheduled for a Tuesday morning in January, after the law had technically taken hold but before the annual general meeting would ratify the changes. The conference room smelled of stale coffee and wool coats. There were five of them: Henrik, two other men, Ingrid, and one other woman, Signe, who sat three seats away.

  Henrik opened a folder. "Item four. Director fees. We need to align with the ASA standard given the increased liability."

  He slid a spreadsheet across the table. The numbers were mundane. Annual retainer, meeting fees, committee premiums. Ingrid traced the row with her finger. It was boring. It was the kind of bureaucracy that usually lulled her into a sense of stability. This was the machinery of governance, the dull gear-turning that kept capital safe.

  "Are we keeping the audit committee separate?" Signe asked. Her voice was flat.

  "Yes," Henrik said. "Ingrid will take the audit chair. Signe, you'll join compensation."

  They weren't asking. They were assigning slots based on a grid. Ingrid looked at the spreadsheet again. There was a column for 'Compliance Status'. It was checked 'Green'.

  She thought about the morning news. *Aftenposten* had run a piece about the "Golden Skirts," a nickname for the handful of women who now sat on multiple boards to meet the quotas. They were treated like rare commodities, trading seats like collectible cards. Ingrid wasn't in that club yet, but she was on the list. She knew her CV was solid. She knew she could dissect a cash-flow statement better than anyone in this room. But knowing it herself wasn't the same as being chosen for it.

  She needed the choosing to be free.

  "Is Lars standing for re-election?" Ingrid asked. She nodded toward the empty chair where the senior independent director usually sat.

  Henrik paused, his pen hovering over the fee schedule. "Lars decided not to renew. Personal reasons."

  It wasn't personal. Ingrid knew Lars. He had been on the board for twelve years. He loved the status. He loved the fees. He stepped down because the math required a vacancy to be filled by a woman to avoid dissolving the company status. He had vacated the seat so the equation would balance. He had made himself invisible so she could be visible.

  "His loss is our gain," Henrik said. He didn't look up from the paper.

  "It's a loss of experience," Ingrid said.

  "We have plenty of experience," Henrik said. He tapped the compliance column. "We have the right mix now. That's what the shareholders care about. Stability."

  Stability. The word hung in the air, heavier than the rain outside. Ingrid looked at Signe. Signe was looking at her coffee cup, stirring it without drinking. They were the ballast. They were there to keep the ship from sinking under the weight of the law, not to steer it.

  Ingrid picked up her pen. She needed to sign the acceptance of the insurance terms. It was a routine administrative task. Sign here, date here, initial the liability clause.

  Her hand hovered over the paper. She thought about her own internal metric. For years, she had measured her worth by the friction of the world against her. If she pushed and the world pushed back, she was real. If she pushed and the world opened the door, she was valued. Now the door was held open by a hydraulic arm. There was no friction. There was no resistance.

  If she succeeded here, would it be because she was good? Or because the alternative was dissolution? If she failed, would it be because she was incompetent? Or because she was set up to be a token? The data was corrupted. She couldn't trust the outcome to tell her anything about herself.

  "Ingrid?" Henrik said. "The insurance broker is waiting."

  She signed. The ink was black and wet. It looked final.

  "Thank you," Henrik said. He closed the folder. "We'll adjourn. There's lunch in the hallway if anyone wants it. Sandwiches."

  He stood up. The others stood. Ingrid remained seated for a moment. She looked at the signature. It was her name, written in her hand, but it felt like it belonged to someone else. Someone who existed only in relation to a percentage.

  She stood up and put the pen in her bag. She walked out into the hallway. The catered lunch was laid out on a table covered in a white cloth. There were platters of brown cheese and sliced ham, plastic cups of water. A man from HR was counting the plates to make sure there were enough.

  Ingrid took a napkin. She didn't want the cheese. She didn't want the ham. She took a glass of water and walked to the window. The rain had stopped, but the sky was still the color of bruised steel. Down on the street, a bus pulled away from the curb. People pressed against the windows, looking out, waiting for the next stop.

  She drank the water. It was cold and tasteless. She put the glass down on the windowsill and left it there.

  ***

  If I wrote this from the Chair's point of view, the tension would shift from internal validation to external pressure; Henrik would be less a villain and more a man trying to keep a viable company alive while navigating a law he didn't write, focusing on the risk of dissolution rather than the morality of the quota. The epistemic loss would be invisible to him, replaced by the logistical burden of compliance.
