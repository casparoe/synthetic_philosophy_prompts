answer: |-
  1. **Correct me first** (~120 words)
  Stop saying he defended his mother using astrology; he used legal briefs and rationality, which ironically aligns with your modern view. Also, he didn't fully reject specific predictions; he argued they were theoretically possible but practically unknowable due to too many variables. Don't call it "belief"—to him, it was a working hypothesis within natural philosophy. Finally, he didn't just blame bad practitioners; he argued skeptics ignored the signal because they hated the noise. You're safe on the Wallenstein and calendar income points. Just remember: he wasn't trying to save astrology from science, he was trying to save it from itself. He viewed himself as a reformer cleaning up a dirty industry, not a magician casting spells for fun.

  2. **Where the tension actually is** (~150 words)
  The core tension is between his demand for mathematical certainty and astrology's inherent fuzziness. He wants astronomy's precision to validate astrological effects, but those effects are qualitative (temperament), not quantitative (position). Secondly, there's a theological trap: if planetary aspects incline the soul, does that absolve sinners? He needs influence without determinism. Finally, he despises "vulgar" astrologers yet relies on their income stream. He's reforming a system that pays his rent while claiming it's mostly nonsense. Your questions should press where his precision fails to match his claims. You want to expose the gap between his rigorous math and his loose conclusions. That is where the drama lives for your audience. You are not interviewing a mystic; you are interviewing a modeler who lacks ground truth.

  3. **Warm-up** (2 questions)
  1. You earn your bread casting nativities for patrons like Wallenstein. How much of that work is genuine inquiry, and how much is providing the answer they hired you to find?
  2. You compare planetary aspects to musical harmonies. Is that a physical vibration moving through the ether, or just a metaphor for how the soul perceives order?

  4. **The hard middle** (5 questions)
  1. **Mechanism:** You claim geometry influences the soul without contact. In my work, models need a causal link. Is this a testable hypothesis, or a nice story to explain correlations?
  **He'll say:** The soul perceives harmony instinctively, like hearing a chord. It's natural, not mechanical.
  **Follow-up:** If it's natural, why do only some people feel it? Is the fault in the stars, or is the soul's reception broken?

  2. **Scoring:** I build forecasting models; we track error rates. Do you keep a ledger of misses? How do you distinguish a failed prediction from a misinterpreted one?
  **He'll say:** Nature is complex; free will alters outcomes. We look for general tendencies, not specific dates.
  **Follow-up:** If every miss is explained by complexity or will, what specific data would actually falsify your model?

  3. **Money:** You criticize astrologers who sell certainty, yet you sell annual prognostications. Does patronage pressure you to find significant aspects where there are none?
  **He'll say:** I warn readers of uncertainty. I sell caution, not destiny.
  **Follow-up:** But if you tell a patron there's no danger, they stop paying. Where is the honest line between caution and telling them what they need to hear?

  4. **Responsibility:** You defended your mother against witchcraft charges. If celestial influence shapes temperament, where does personal responsibility begin?
  **He'll say:** The stars incline, they do not compel. Reason can overcome impulse.
  **Follow-up:** Then why blame the witch? If impulse is celestial, is her crime not just a strong aspect manifesting physically?

  5. **Modern Data:** If I gave you decades of weather records and birth outcomes, would you run the regression? What if the data showed zero correlation?
  **He'll say:** I would welcome the data. Truth is God's will.
  **Follow-up:** But if the math kills the theory, do you abandon the harmony, or assume the data is simply too crude to hear the music?

  5. **Closing question** (1)
  If your harmonic model is true, it should sing louder with better data. If it stays silent, are you willing to say the universe is deaf, or will you decide the math is simply beyond us?

  6. **Cut list** (~80 words)
  Drop the Mother question (too biographical, slows momentum), the Modern Data question (too anachronistic for character immersion), and the Money question (softball compared to Scoring). Keep Mechanism, Scoring, and Responsibility. These strike at the core of his scientific integrity and theological risk, which is where the real drama lies for your audience. You want to leave them wondering if his math was brilliant but applied to the wrong problem. That is the tragic hook.
