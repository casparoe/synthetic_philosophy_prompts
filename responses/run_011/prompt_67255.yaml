answer: |-
  You are asking a very sharp question that cuts to the heart of modern political theory. You are right that on a purely arithmetic level, 53% is a majority, and in a binary referendum, it is the decisive outcome. If the criticism were simply "53% isn't enough," that would be sore losing.

  However, when political scientists and philosophers object to the rhetoric you described, they are not objecting to the **math**; they are objecting to the **moral claim** being attached to the math.

  The distinction between "we won a majority" and "we alone represent the people" is not just semantics. It is the difference between **Majoritarianism** (a procedural rule for making decisions) and **Anti-Pluralist Populism** (an ideology about who belongs in the political community).

  Here is the breakdown of the conceptual distinction the academics are making.

  ### 1. "The Majority" vs. "The People"
  In liberal democratic theory, "The People" (the *demos*) consists of **everyone** with citizenship: the 53% who voted Yes, the 47% who voted No, and those who didn't vote.

  *   **The Majoritarian Claim:** "We received more votes than the other side. Therefore, according to the rules, our policy preference becomes law."
  *   **The Anti-Pluralist Claim:** "We are the *true* People. The 47% who voted against us are not legitimate participants in the national will; they are obstacles, elites, or traitors."

  The objection is that the winning side is conflating a **temporary coalition of voters** with the **permanent sovereign entity**. By saying "the people have spoken," they imply a singular, homogeneous voice. But 53% is not a singular voice; it is a slim margin of conflicting interests united only by that specific vote.

  When the winners say the losers "were never really part of the people anyway," they are engaging in **exclusionary identity politics**. They are redefining citizenship. In a pluralist democracy, you can be a citizen in good standing and still be on the losing side of a vote. In an anti-pluralist framework, being on the losing side suggests you are morally outside the community.

  ### 2. The Claim to Moral Monopoly
  The political theorist Jan-Werner Müller defines populism not by its policy content (left or right), but by this specific claim: **Populists claim a moral monopoly on representation.**

  *   **Pluralist View:** "I represent the 53% who voted for me. The other party represents the 47%. Both groups are legitimate parts of the nation, and we must find a way to govern together."
  *   **Anti-Pluralist View:** "I represent the *Real People*. Anyone who opposes me is, by definition, against the People."

  This is why academics call it anti-pluralist. Pluralism accepts that society is divided into different groups with legitimate, conflicting interests. Anti-pluralism insists there is only *one* legitimate interest (the will of the "true" people) and anyone opposing it is illegitimate.

  ### 3. Why This Matters (Beyond Sore Losing)
  You asked if this is just a fancy term for being on the losing side. The reason pluralists worry about this rhetoric is that it changes how democracy functions in the future.

  If the 47% are told they are not part of "the people," three dangerous things happen:

  1.  **Loyalty Erosion:** Democracy relies on the losing side accepting defeat today because they believe they have a chance to win tomorrow and that their rights will be protected in the meantime. If they are told they aren't *really* part of the nation, they have less reason to stay loyal to the democratic system.
  2.  **End of Compromise:** You can compromise with a political opponent. You cannot compromise with an "enemy of the people." If the winners believe they hold a moral monopoly, they view compromise as corruption or betrayal of the "will of the people."
  3.  **Minority Rights:** In a system where the majority *is* the People (capital P), there is no theoretical limit to what they can do to the minority. Pluralism insists that even the 53% cannot violate the fundamental rights of the 47%, because the 47% are also part of the sovereign.

  ### 4. The Condorcet Point
  You mentioned that the winning option is the Condorcet winner (beating the alternative head-to-head). That is technically correct for a binary referendum. However, the Condorcet criterion measures **preference aggregation**, not **political legitimacy**.

  Just because Option A beats Option B 53-47 does not mean the 47% consent to be governed exclusively by the worldview of Option A. In a pluralist system, the 53% gets to set the policy, but they must still acknowledge the 47% as equal partners in the polity. The rhetoric you are hearing denies that partnership.

  ### Summary
  The criticism is not that the winners shouldn't implement their policy. They won; they should implement the policy.

  The criticism is that they are using an arithmetic victory (53%) to make a metaphysical claim (that they are the *only* legitimate voice of the nation).

  *   **"We won the vote"** = A factual statement about the count. (Pluralist/Democratic)
  *   **"We are the People"** = A moral statement about identity and legitimacy. (Anti-Pluralist/Populist)

  So, no, it is not just a fancy term for losing. It is a warning that the winners are attempting to change the rules of the game from "majority rule with minority rights" to "majority identity with minority exclusion." Whether that actually happens depends on what the winners *do*, but the rhetoric is the first step in that direction.
