answer: |-
  There is no single established term in linguistics, legal theory, or moral philosophy that precisely captures the systematic, architectural phenomenon you have described. While components of it appear in discussions of legal formalism, bureaucratic rationality, and speech act theory, the specific pattern of generating robust moral conviction through the exclusive use of non-moral syntax across an entire document remains unnamed.

  The closest rhetorical ancestor is the **enthymeme** (a syllogism with an unstated premise), but as you noted, standard enthymemes are local and cancellable. Your phenomenon is global and structural. The closest sociological concept is **reification** (treating social constructs as natural facts), but this describes the *effect* on the reader, not the *mechanism* of the text.

  For the purposes of your style guide, I propose coining the term **Institutional Normative Ellipsis (INE)**.

  Below is a rigorous definition, a differentiation from the neighboring concepts you identified, an analysis of your boundary cases, and an account of its relationship to expressivism and institutional integrity.

  ### 1. Definition: Institutional Normative Ellipsis (INE)

  **Institutional Normative Ellipsis** is a discursive strategy in which a document produces a normative conclusion (e.g., a sanction, censure, or prohibition) by systematically omitting explicit moral premises, relying instead on institutional authority, stipulated definitions, and procedural analogies to bridge the gap between descriptive facts and normative outcomes.

  **Necessary Conditions:**
  1.  **Normative Output:** The document results in a decision that carries moral weight (blame, penalty, exclusion).
  2.  **Descriptive/Procedural Input:** The explicit premises are restricted to empirical claims, procedural history, or stipulated definitions.
  3.  **Elliptical Bridge:** The moral premise required to validly derive the output from the input (e.g., "Violating this definition is *wrong*") is never asserted, yet is successfully transmitted to the reader.
  4.  **Systematicity:** The omission is not accidental or local but is maintained throughout the document's architecture.

  ### 2. Differentiation from Neighboring Concepts

  You correctly identified why standard concepts fall short. Here is how INE differs precisely:

  *   **Vs. The Frege–Geach Problem:** Frege–Geach concerns the *semantic consistency* of moral terms when embedded in unasserted contexts (e.g., conditionals). INE is not a semantic problem but a *pragmatic* one. It does not ask how moral terms keep their meaning; it asks how moral *force* is generated without moral *terms*. Expressivism is not troubled by INE; in fact, INE is a practical realization of quasi-realism, where moral function is achieved without realist assertion.
  *   **Vs. Plausible Deniability / Innuendo:** These require a *strategic intent* to deceive or evade accountability. INE can occur (and in your case, does occur) without deceptive intent. The authors may sincerely believe they are merely applying rules. INE is a structural feature of bureaucratic rationality, not necessarily a tactic of individual evasion.
  *   **Vs. Conversational Implicature:** Implicature relies on the violation of Gricean maxims (e.g., being obscure to suggest something else) and is *cancellable* (the speaker can say, "I didn't mean that"). INE is *non-cancellable*. If the committee chair said, "This suspension implies no moral wrongdoing," the sanction would lose its legitimacy. The moral force is constitutive of the act, not an implied suggestion.
  *   **Vs. Presupposition:** Presupposition is typically sentence-level (e.g., "Have you stopped beating your wife?"). INE is *document-level*. There is no single sentence to challenge; the normative load is distributed across the relationship between the definition, the facts, and the verdict.
  *   **Vs. Legal Formalism:** Formalism is a jurisprudential theory claiming law is a closed system. INE is the *linguistic mechanism* by which formalism maintains its appearance. Formalism is the ideology; INE is the syntax.

  ### 3. Boundary Testing (For the Style Guide)

  To operationalize INE in your guide, you must distinguish it from legitimate administrative drafting.

  *   **Case A: A judicial opinion arguing wholly by analogy to settled cases.**
      *   *Verdict:* **This is INE.**
      *   *Reasoning:* If the opinion never asserts *why* the settled cases were rightly decided (the normative premise), but merely asserts "this is like that," it relies on the reader to import the moral weight of the precedent. It displaces the moral justification onto the history of the institution.
  *   **Case B: A document quoting a professional code verbatim and applying it.**
      *   *Verdict:* **This is NOT INE (provided the Code itself is treated as authority).**
      *   *Reasoning:* If the document states, "The Code prohibits X; you did X; therefore you are sanctioned," it is a valid syllogism where the major premise is the *rule*, not a moral claim. However, if the Code's prohibition is itself moral (e.g., "Do not act dishonestly") and the document treats "dishonestly" as a purely technical term without defining it, INE creeps back in. The boundary lies in whether the code is treated as a *convention* (valid without moral assertion) or a *moral truth* (requiring assertion).
  *   **Case C: A purely descriptive audit report routinely used to justify sanctions.**
      *   *Verdict:* **This is INE (by extension).**
      *   *Reasoning:* If the audit report is distinct from the sanction letter but is the *sole basis* for the sanction, the *system* is employing INE, even if the individual document does not issue the sanction. The "document" in the definition of INE should be understood as the *determinative record*.

  ### 4. Expressivism and the "No-Pronouncements" Remit

  You asked whether this is a difficulty for expressivism. It is not. In fact, your committee's practice is **consistent with sophisticated expressivism**.

  Expressivism (e.g., Blackburn, Gibbard) holds that moral sentences do not describe facts but express attitudes or plans for action. When your committee suspends a researcher, it is *expressing* an attitude of disapproval and enacting a plan of exclusion. The fact that the text avoids the *word* "wrong" is irrelevant to the expressivist; the *act* of suspension is the moral expression. The text is merely the administrative wrapper.

  **The "No-Pronouncements" Paradox:**
  You asked whether a committee operating under an express "no-pronouncements on ethics" remit can avoid INE.
  **The answer is no.**
  If the committee has the power to sanction, it is necessarily making a moral pronouncement. A sanction is a moral speech act. To sanction someone for "extractive arrangements" (as in your first specimen) is to judge that extraction is prohibited and culpable.
  *   **If you ban INE:** You force the committee to either stop sanctioning (rendering it useless) or openly admit it is making moral judgments (violating its remit).
  *   **If you allow INE:** You allow the committee to function, but you institutionalize a fiction that it is not doing what it is doing.

  ### 5. Normative Assessment: Is INE Objectionable?

  For your style guide, you must decide whether to curb INE or codify it.

  **Arguments Against INE (The Transparency Objection):**
  *   **Epistemic Dishonesty:** It obscures the actual grounds of decision. If the real reason for a sanction is a shifting moral consensus, hiding behind a "stipulated definition" prevents members from debating the morality of the definition itself.
  *   **Accountability:** If the committee denies it is making moral claims, it cannot be held accountable for moral errors. It shields itself behind "procedure."

  **Arguments For INE (The Stability Objection):**
  *   **Institutional Cohesion:** Explicit moral argument invites dissent on first principles. Procedural argument invites dissent only on application. The latter is easier to resolve without fracturing the association.
  *   **Remit Compliance:** If the charter forbids ethical pronouncements, INE is the only linguistic tool that allows the committee to comply with the letter of the charter while fulfilling its function.

  ### 6. Recommendation for the Style Guide

  Do not attempt to eliminate INE; you cannot, because the committee's function is inherently normative. Instead, **regulate** it.

  **Proposed Guideline:**
  > **Section 4.2: Normative Transparency**
  > Panels are reminded that while determinations should rely on established policy and precedent, the Committee acknowledges that sanctions carry normative weight.
  > 1.  **Stipulated Definitions:** When using stipulated definitions (e.g., "extractive"), panels must explicitly note that the definition is a tool for policy application, not an exhaustive moral description.
  > 2.  **Analogical Reasoning:** When relying on analogy to past cases, panels should briefly identify the *principle* shared by the cases, rather than implying the past decision itself constitutes the justification.
  > 3.  **Avoidance of Moral Cryptography:** Panels should not use procedural language to mask substantive ethical disagreements. If a determination rests on a novel ethical interpretation, this should be noted as a development of standards, not merely a procedural finding.

  **Summary:**
  You have identified **Institutional Normative Ellipsis**. It is not a bug in your committee's writing; it is the feature that allows a bureaucratic body to perform moral work without claiming moral authority. It is consistent with expressivism (which locates morality in the act, not the sentence). It cannot be eliminated without dismantling the committee's power, but it can be managed to ensure the "ellipsis" does not become a vacuum where accountability disappears.
