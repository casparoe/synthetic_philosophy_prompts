prompt: |-
  I've got three hours with a mixed room — mostly planners from a city council, plus two local historians and a couple of consultants who work for developers — and the session is nominally on path dependence. Half of them already use the phrase, usually to mean "this is how it's always been round here". My actual goal is narrower than that: by the end they should be able to look at a live local policy and say whether it's genuinely path dependent or merely old, and be willing to *not* use the phrase when it isn't earning its keep. Don't explain path dependence to me. Plan how I should build it.

  What I need:

  - The order the pieces have to go in, and what depends on what. I keep trying to open with the positive-feedback / increasing-returns idea and it lands like a wet sandwhich, so tell me whether that's because there's a step missing underneath it that I've never thought to give them, or because it genuinely can't come first.
  - Which single case should carry the three hours. I'm torn between the tram network my own city ripped out in the sixties and something they all have opinions about already — parking minimums. Pick one and say why, and tell me what the carrying example has to have and what it mustn't have. I suspect a case where the lock-in is transparently efficient, like a plug standard or a paper size, teaches them nothing at all, but I can't articulate why.
  - The misconceptions, and the exact point in the sequence where each one gets headed off. My list so far: "path dependence just means history matters"; "it means we're stuck with something inefficient"; "if a thing is path dependent then nothing can be changed, so don't bother"; "the trigger has to have been tiny and random, otherwise it's just a decision". Also tell me which of these is not really a mistake but someone groping at something true, so I should welcome it and redirect rather than squash it.
  - One thing I'm not sure of myself, so be blunt rather than balanced: if a city would have ended up car-dependent anyway, only by a different route and a decade later, is the case still path dependent? I want an answer I can use in the room, not a hedge, and I want to know what to do with the person who immediately spots the problem with it.
  - A closing check that would actually show the idea landed — something I can get them to do to a real proposal sitting in front of them, not "any questions".
  - What I should deliberately leave out, and say out loud that I'm leaving out. I'm assuming the formal non-ergodicity business and the whole row about whether locked-in outcomes are inefficient are both off-limits at this level, but tell me if cutting either one looses me something I'll need later in the session.

  British English throughout, please, and keep it to a plan I could actually work from — headings, sequence, timings if you like — rather than a script of what to say.
