  7.  **Final Polish:** Ensure the distinction between "old" and "path dependent" is the through-line. The key is *contingency* + *lock-in mechanism*.

      *(Self-Correction during drafting)*: I need to make sure I explicitly answer *why* the positive feedback opening fails. It fails because it explains the *engine* before showing the *car*. They need to see the car stuck in the mud first.

