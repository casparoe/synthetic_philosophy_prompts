answer: |-
  # Session Plan: Diagnosing Path Dependence in Local Policy
  **Duration:** 3 Hours
  **Audience:** Planners, Historians, Developer Consultants
  **Goal:** Distinguish genuine path dependence from mere inertia; reduce terminological misuse.

  ---

  ## 1. Sequence & Architecture
  **Why "Positive Feedback" fails as an opener:**
  It lands like a wet sandwich because it offers a *mechanism* before establishing a *problem*. Planners and historians deal in outcomes and narratives, not system dynamics. If you start with "increasing returns," they hear jargon. They need to feel the *contingency* first—the frustration that "this specific outcome happened because of that specific past event, and it might not have otherwise."

  **The Order of Play:**
  1.  **Phenomenon first:** Show a policy that looks stuck. Ask *why* it's stuck.
  2.  **Counterfactuals:** Establish that it could have been different (contingency).
  3.  **Mechanism:** Only now introduce positive feedback/lock-in as the explanation for *why* it stayed stuck.
  4.  **Diagnostic:** Turn the mechanism into a checklist for live policy.

  **Timing Breakdown:**
  *   **00:00 – 00:30:** The Hook & The Distinction (Old vs. Locked-in)
  *   **00:30 – 01:30:** The Carrying Case (Deep Dive)
  *   **01:30 – 01:45:** Break
  *   **01:45 – 02:25:** The Mechanism (Why it sticks)
  *   **02:25 – 03:00:** Live Application & Close

  ---

  ## 2. The Carrying Case: Parking Minimums
  **Pick:** **Parking Minimums.**
  **Reject:** The Tram Network.

  **Why:**
  The tram network is a *post-mortem*. It allows participants to be wise after the event. Parking minimums are *live*. Your developers and planners are currently fighting over them.
  *   **Trams** teach that history happened.
  *   **Parking** teaches how to diagnose *current* constraints.
  *   **Crucially:** Parking minimums are often *not* path dependent; they are often actively renewed political choices. This makes them a harder, better test case. If you use trams, everyone agrees it's path dependence. If you use parking, the developers might argue it's market demand, the historians might argue it's zoning legacy, and the planners might argue it's political risk. That friction is where the learning happens.

  **What the case must have:**
  *   **A Critical Juncture:** A specific moment (e.g., the 1950s zoning code adoption) where the rule was set.
  *   **A Feedback Loop:** e.g., "We require parking -> streets widen -> public transport becomes less viable -> more people drive -> we require more parking."
  *   **A Cost to Change:** It's not just that the rule exists; it's that removing it now is disproportionately expensive or politically difficult compared to the initial adoption.

  **What it must not have:**
  *   **Transparent Efficiency:** Do not use a case where the lock-in is obviously the best solution (e.g., standardised voltage). If the outcome is clearly optimal, they won't question why it persists. You need a case where the *continued* existence is debatable.
  *   **Pure Nostalgia:** Avoid cases where the emotional attachment (trams) masks the structural lock-in.

  ---

  ## 3. Misconceptions Map
  Map these to the specific moment in the sequence where they arise. Head them off *before* they solidify.

  | Misconception | When to Head It Off | Strategy |
  | :--- | :--- | :--- |
  | **"Path dependence just means history matters."** | **00:30 (Case Intro)** | **Welcome & Redirect.** This is the one "groping at truth." It is a necessary condition but not sufficient. Acknowledge it: "You're right, history is the raw material. But path dependence is the *recipe* that makes the cake impossible to un-bake." |
  | **"The trigger has to have been tiny/random."** | **00:45 (Critical Juncture)** | **Correct.** It doesn't need to be random, just *contingent*. A deliberate decision can create path dependence if later constraints prevent reversing it. Distinguish "Decision" from "Lock-in". |
  | **"It means we're stuck with something inefficient."** | **01:55 (Mechanism)** | **Nuance.** PD *can* lead to inefficiency, but not always. Focus on the *resistance to change*, not the *quality of the outcome*. |
  | **"If it's PD, nothing can be changed."** | **02:45 (Application)** | **Squash.** PD explains the cost of change, not the impossibility. Use the phrase "Path creation" to counter "Path dependence." |

  ---

  ## 4. The Blunt Answer: "Car Dependence Anyway"
  **The Question:** If the city would have ended up car-dependent anyway (due to geography, technology, culture), only by a different route or a decade later, is the case still path dependent?

  **The Answer:** **No.**
  **What to say in the room:** "If the outcome is robust to the historical trigger, it is **Structural Determinism**, not Path Dependence. Path dependence requires that *this specific history* produced *this specific outcome*. If the technology or geography forces the outcome regardless of the policy choices, you are describing a constraint, not a path."

  **Handling the Objector:**
  Someone will spot the nuance (e.g., "But the policy accelerated it!").
  *   **Your move:** Concede the acceleration, but hold the line on the definition. "Acceleration is not lock-in. If we repealed the policy tomorrow and the car dominance remained due to geography, the policy wasn't the lock-in mechanism. Don't use 'path dependence' to hide structural problems you don't want to solve."

  ---

  ## 5. Closing Check: The "Lock-in Audit"
  Do not ask "Any questions?". Do not run a quiz.
  Give them a live document (e.g., a draft Local Plan policy on housing density or transport).

  **The Exercise (15 mins):**
  In pairs, apply the **Three-Question Diagnostic** to the text. They must report back "Path Dependent," "Inertia," or "Structural Constraint."

  1.  **Contingency:** Could a plausible alternative policy have existed at the start without catastrophic cost? (If No → Structural Constraint).
  2.  **Mechanism:** Is there a specific feedback loop (financial, legal, or physical) that makes reversing this *harder now* than it was *then*? (If No → Mere Inertia).
  3.  **Cost:** Is the cost of switching now disproportionately higher than the cost of the original decision? (If Yes → Path Dependence).

  **Success Metric:**
  You know it landed when a planner says, "This isn't path dependent, it's just politically inconvenient," or a historian says, "This looks old, but there's no feedback loop keeping it here."

  ---

  ## 6. Deliberate Omissions
  State these explicitly at the start (00:10) to manage expectations and protect your flank.

  **1. Non-Ergodicity:**
  *   **Say:** "We are not discussing the statistical properties of stochastic processes today. We are talking about policy constraints."
  *   **Risk if included:** You lose the historians and planners immediately. It adds zero diagnostic value for their goal.

  **2. The Efficiency Debate (Arthur vs. Liebowitz/Margolis):**
  *   **Say:** "Academics argue about whether path-dependent outcomes are always inefficient. We are not settling that. We are asking: *Is this policy stuck because of its history, or because it's still useful?*"
  *   **Risk if cut:** If you don't mention it, they might assume PD *always* means 'bad policy'. By framing it as "Stuck vs. Useful," you bypass the academic fight while keeping the practical distinction.

  **3. Remediation Strategies:**
  *   **Say:** "We are diagnosing the disease, not prescribing the cure. Today is about knowing *what* you are looking at."
  *   **Risk if cut:** Planners will want to know "How do we break the path?" immediately. Park this for a future session. If you try to solve it now, the diagnostic rigor collapses into solutioneering.

  ---

  ## 7. Facilitator Notes: The "Wet Sandwich" Fix
  When you move from the Case Study (01:30) to the Mechanism (01:45), use this bridge:

  *"You've just identified that the parking rule persists not because everyone loves it, but because changing it breaks something else (finance, traffic flow, political capital). That 'breaking something else' is the mechanism. In theory, we call this 'positive feedback' or 'increasing returns'. In this room, call it 'The Cost of Switching'. If the cost of switching rises the longer you stay on the path, you have path dependence. If the cost stays flat, you just have tradition."*

  This translates the abstract theory into the planners' currency (cost/risk) immediately after they have felt the problem in the case study.
