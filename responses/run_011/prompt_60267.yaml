          *   1 Philosopher (Bernard Williams/Appiah, honor vs. dignity).
      *   **Chapter Argument:** Dueling in Britain (1800-1860) didn't end due to moral persuasion or honor $\to$ dignity shift. It ended because the *audience* for honor changed. Reputational labor moved from local/physical (seconds, messmates) to institutional/print (army/navy/civil service rules, newspapers). The "referee" shifted, not the underlying logic.
      *   **Evidence:** 400 coded reported challenges/near-challenges (who was insulted, whose judgment settled it).
      *   **Weakness:** Claims to generalize but only has the dueling case (no slavery/abolition case study, though the room cares about norms/institutions).
      *   **Tone:** American English, pragmatic, strategic, acknowledging vulnerabilities ("Mark the ones where my reply is soft").

  2.  **Deconstruct the Audience & Potential Objections:**

      *   **Economic Historians:** Care about selection bias, endogeneity, incentives, markets, and quantifiable data. They will ask if the "audience" is just a proxy for changing incentives or costs. They'll worry about the newspaper data (selection bias in reporting).
      *   **Historical Sociologists:** Care about mechanisms vs. outcomes, state formation, institutional isomorphism. They will ask if "audience" is just a functionalist description of state centralization.
      *   **Legal Historian:** Care about the law on the books vs. law in action. Why aren't the statutes the cause? Why did enforcement change?
      *   **Philosopher:** Care about conceptual clarity (Honor vs. Dignity). Is "audience" just a semantic shift? Is this actually a moral change disguised as structural?
      *   **General/Interdisciplinary:** The "Generalization" problem (Slavery/Abolition). Why claim a broader theory of norms without testing it on the biggest norm shift of the era (slavery)?
      *   **The "Rational Choice" Trap:** If the argument sounds too much like "people maximized reputation utility," it betrays the cultural history framing.

  3.  **Drafting the Objections (Ranking by Damage):**

      *   *High Damage:* The "Incentives Renamed" objection (Econ/Soc). If "audience" = "incentives," the cultural contribution vanishes.
      *   *High Damage:* The "Generalization/Abolition" objection. If the theory claims to explain norm change but fails on the era's biggest norm change, the theory is weak.
      *   *Medium-High Damage:* The "Functionalist Mechanism" objection (Sociologists). Describing *what* happened vs. *how*.
      *   *Medium Damage:* The "Legal Statutes" objection (Legal Historian). Easy to deflect if the argument is about enforcement/social practice vs. black-letter law.
      *   *Medium Damage:* The "Honor vs. Dignity" objection (Philosopher). Needs conceptual precision, but manageable if sticking to social practice.
      *   *Medium-Low Damage:* Data/Selection Bias (Econ Historians). Acknowledge limitations, pivot to qualitative pattern.

  4.  **Developing the Responses (The "90 Seconds"):**
      *   Need to be conversational but precise.
      *   Need to identify what to concede (don't fight losing battles) and what to hold (the core thesis).
      *   Need to flag "soft" replies.

  5.  **Addressing Specific Constraints:**
      *   *American English.*
      *   *Mark soft replies.*
      *   *Flag the "Rational Choice Smuggling" risk.*
      *   *Identify the "Prayer" objection.*

  6.  **Refining the Content (Iterative Process):**

      *   *Objection 1 (The Econ/Soc Hybrid):* "Isn't 'audience' just incentives?" This is the big one. If I say "no," I need to explain *why* cultural logic matters. *Risk:* Smuggling rational choice. *Strategy:* Concede incentives changed, but argue the *meaning* of the action changed because the *validator* changed.
      *   *Objection 2 (The Generalization):* "You say this explains norm change, but what about slavery?" *Risk:* Overclaiming. *Strategy:* Concede I'm not explaining abolition *here*, but arguing about the *mechanism* of reputational shift. Don't pretend I have the data.
      *   *Objection 3 (The Sociologist):* "Functionalist mechanism." *Strategy:* Distinguish between the state absorbing function vs. the social meaning shifting.
      *   *Objection 4 (The Legal Historian):* "Statutes." *Strategy:* Statutes existed earlier. Enforcement relied on social buy-in.
      *   *Objection 5 (The Philosopher):* "Honor vs. Dignity." *Strategy:* It's not a moral swap, it's a structural relocation of the judge.
      *   *Objection 6 (The Econ Historian - Data):* "Newspaper selection bias." *Strategy:* Concede it. 400 cases is a sample, not a population. But the *shift* in the sample is the signal.

  7.  **Final Review against User Prompt:**
      *   Did I rank by damage? Yes.
      *   Did I phrase them like the specific disciplines? Yes (Econ = endogeneity, Soc = mechanism, Phil = Williams/Appiah).
      *   Did I include the "Concede/Hold/Reply" structure? Yes.
