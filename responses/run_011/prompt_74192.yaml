  The principle you seek is **The Principle of Intended Psychological Continuity.**

  It states that a character $C_2$ in a later work or draft is numerically identical to a character $C_1$ in an earlier work if and only if:
  1.  **The Custody Clause:** The creative agency responsible for $C_2$ intends to refer to $C_1$ (preserving the designator's lineage).
  2.  **The Essence Clause:** $C_2$ retains the *salient psychological profile* (temperament, moral disposition, voice) of $C_1$.
  3.  **The Reconciliation Clause:** Any contradictions in accidental properties (history, name, physical appearance) are either negligible or narratively reconciled within the fictional truth.

  Here is how this principle earns its keep across your five verdicts:

  *   **The Bio Rewrite:** The **Essence Clause** is satisfied (temper survives), and the **Reconciliation Clause** permits the history to change because it is treated as a correction, not a contradiction. The **Custody Clause** is held by you. **Verdict: Same.**
  *   **The Name Change:** The **Essence Clause** is satisfied (everything else intact). The **Reconciliation Clause** categorizes "Name" as an accidental property, subordinate to psychology. **Verdict: Same.**
  *   **The War-less Protagonist:** The **Custody Clause** is technically held (you wrote him), but the specific intent is modal ("show what he might have been"), which triggers a *Counterpart* designation rather than an *Identity* designation. Furthermore, the **Essence Clause** fails (he is crueller and happier). **Verdict: Different.**
  *   **The Continuation:** The **Custody Clause** is fractured (another writer). Even with your blessing, the **Essence Clause** fails (a temperament you "could never have given her"). Lineage alone cannot sustain identity without psychological continuity. **Verdict: Different.**
  *   **The Liar:** The **Custody Clause** is held (your author's note). The **Reconciliation Clause** is invoked aggressively: the incompatible histories are reconciled by attributing the falsehood to the character herself. **Verdict: Same.**

  ### Implications for Unraised Cases

  **1. A translation in which the name has been altered.**
  *   **Verdict:** Same Character.
  *   **Reasoning:** The **Essence Clause** (psychology/voice) remains intact. The **Reconciliation Clause** treats the name change as a linguistic accident necessary for the new medium, not a fictional contradiction. Custody is maintained through the chain of publication.

  **2. An unfinished manuscript whose thirty-year-old contradicts the fifty-year-old of the published book.**
  *   **Verdict:** Same Character, Distinct Instantiation.
  *   **Reasoning:** The **Custody Clause** is held (you are the author of both). However, because the contradiction is not narratively reconciled (it is a revision, not a lie), they cannot occupy the same ontological space. They are the same *designated* character, but the published version supersedes the draft as the *canonical* instantiation. They are identical in reference, but not in truth-conditions.

  **3. A production in which two actresses alternate in the role.**
  *   **Verdict:** Same Character.
  *   **Reasoning:** The **Essence Clause** refers to the fictional construct, not the physical embodiment. The **Reconciliation Clause** categorizes the actor's body as an external property of performance, not an internal property of the character. Custody lies with the script/director, not the performer.

  ### The Verdict It Cannot Save

  This principle cannot save **your fifth verdict (The Liar)** without straining the definition of "Reconciliation."

  Strictly speaking, if two histories are *incompatible* (e.g., in Novel A she is an only child; in Novel B she has a brother), they describe logically distinct individuals. Stipulating that "she lied" is a meta-fictional patch, not a resolution of psychological continuity. If she lied about her history in Novel A, then the Novel A *character* is a liar, but the Novel B *history* belongs to a different truth-set. To declare them "one woman" requires you to privilege the **Author's Note** over the **Textual Evidence**.

  ### Is the Price Too Baroque?

  **Yes.**

  To save all five verdicts, specifically the fifth, you must add a **Meta-Fictional Override Clause**: *Authorial stipulation in paratext (notes, interviews) can overrule logical contradictions in the text.*

  This renders the criterion baroque and practically useless for anyone but you. It makes character identity dependent on hidden mental states (Intent) and external documents (Notes) rather than the text itself. It implies that a character is not a coherent construct within the story, but a legal entity managed by copyright and authorial decree.

  **The Plain Truth:**
  Your verdicts reveal that you do not hold a single metaphysical theory of character identity. You hold a **Contextualist** one.
  *   When revising drafts, you prioritize **Psychological Essence** (Cases 1 & 2).
  *   When exploring themes, you prioritize **Narrative Causality** (Case 3).
  *   When protecting your creation, you prioritize **Authorial Voice** (Case 4).
  *   When building a mythos, you prioritize **Canonical Unity** (Case 5).

  There is no single principle that delivers all these without becoming a Rube Goldberg machine of clauses. You should not look for one. The identity of your character is not a fact to be discovered, but a tool to be wielded. When you need them to be the same, they are the same. When you need them to be different, they are different. The inconsistency is not a flaw in your philosophy; it is a feature of your craft.
