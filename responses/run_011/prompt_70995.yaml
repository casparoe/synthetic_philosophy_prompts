answer: |-
  ### Honesty Check
  Your friend is pointing to the **Epistemic Objection**, which is the strongest critique of Revisionism. In 95% of real-world cases, she is right: soldiers cannot know enough to distinguish liable from non-liable enemies, so Revisionists (like McMahan) often concede that *practical* rules of engagement must mimic Moral Equality of Combatants (MEC) to prevent paralysis. However, she is wrong that there is *no* divergence. There is a narrow slice of cases—high-intelligence special operations with verified intel on enemy culpability—where the permissions diverge on **risk absorption**. If I claim this happens in every firefight, I am cheating. I will build the case for that narrow slice, but I will flag the dice-loading regarding how much intel the killer has.

  ### The Scenario
  In the border conflict between **Krasnovia** (aggressor) and **Veltria** (defender), a Veltrian special forces drone operator, **Elias**, identifies a Krasnovian machine-gun nest pinning his squad. Elias has intercepted unencrypted Krasnovian command traffic ten minutes prior confirming their unit was mobilized under the false pretense of a "defensive exercise" and that their command structure is actively suppressing news of the cross-border invasion to maintain morale; the gunner, **Dmitri**, is a conscript firing under the sincere belief he is repelling a Veltrian incursion. Elias is currently under cover and safe; he can eliminate Dmitri instantly with a Hellfire missile (zero risk to Elias) or flank the position to suppress Dmitri non-lethally, which carries a moderate risk of injury to Elias's squad but would neutralize the threat without killing.

  ### 1. The Verdicts
  *   **Traditionalist (MEC/Walzer):** Elias is **permitted** to strike with the missile.
      *   *Step 1:* Dmitri is a combatant with "war rights."
      *   *Step 2:* Elias has no duty to risk his own life or mission success to spare an enemy combatant.
      *   *Step 3:* Tactical advantage (safety/speed) justifies lethal force; no moral residue remains.
  *   **Revisionist (McMahan):** Elias is **forbidden** (or strictly constrained) to strike with the missile.
      *   *Step 1:* Dmitri is an *innocent threat* (non-culpable for the unjust war), therefore he is **not liable** to be killed.
      *   *Step 2:* Killing a non-liable person is permissible *only* under a Lesser-Evil justification, which requires strict necessity.
      *   *Step 3:* Since a non-lethal alternative exists (flanking) that does not impose *disproportionate* risk on Elias, killing Dmitri violates his right to life. If Elias kills him anyway, he owes compensation to Dmitri's family (moral residue).

  ### 2. The Flip Test
  *   **The Feature:** The target's **moral liability** (derived from culpability for the unjust threat).
  *   **The Flip:** Change Dmitri to a **knowing volunteer** (a Krasnovian ideologue who knows the war is unjust but fights anyway).
  *   **The Result:**
      *   **Revisionist:** Verdict **moves**. Dmitri is now *liable*. Elias no longer has a duty to absorb risk; he can strike with the missile safely. The permission is restored.
      *   **Traditionalist:** Verdict **does not move**. Dmitri was a combatant before, he is a combatant now. Elias's permission remains identical.
  *   **Analysis:** Because the Traditionalist verdict is insensitive to the target's culpability while the Revisionist verdict tracks it, this is not merely "bookkeeping." It is a divergence in the conditions of permission.

  ### 3. Contact with Epistemics
  *   **The Problem:** In a standard infantry firefight, Elias cannot know Dmitri's internal state or intercept command traffic.
  *   **Does it Collapse?** If Elias lacks the intercept, the Revisionist *does* concede he must act on reasonable belief. In that specific foggy case, the Revisionist permission collapses into "act as if he is liable," which looks like MEC.
  *   **Blocking the Move:** However, this does not vindicate your friend's claim that they *never* disagree. It only vindicates that they don't disagree *under conditions of ignorance*. In high-intel scenarios (drones, SIGINT, special ops), the Revisionist constraint **does apply**. The divergence survives wherever the epistemic gap is closed. If your friend argues "soldiers can't be trusted with fine-grained judgments," she is arguing for a *rule-utilitarian* override, not denying the deep moral divergence.

  ### 4. The Counterattack (Rough-Rule Defense)
  *   **Her Move:** "Even if Revisionism is true deep down, we cannot train soldiers to make liability judgments. We need a blanket rule (MEC) to prevent hesitation and war crimes. Therefore, for all practical purposes, the permissions are the same."
  *   **Does it Concede?** **Yes.** This concedes that the *deep morality* diverges (otherwise there would be no need for a "useful fiction" rule) but argues that *military law* should ignore it.
  *   **Why You Win:** Your original claim was about *moral equality*, not *legal equality*. If she admits the morality differs but the rules shouldn't reflect it, she has conceded the philosophical point (that combatants are not morally equal) in exchange for a pragmatic one (that we should pretend they are). That is a victory for the Revisionist moral thesis.

  ### Confidence & Dice-Loading Flags
  *   **Confidence:** **75%**. This is the strongest possible case for Revisionism, but it relies on a specific interpretation of the "Duty to Risk."
  *   **Dice-Loading 1 (The Intel):** I loaded the scenario with **perfect SIGINT** (intercepted comms confirming ignorance). In reality, this is rare. If Elias doubts the intercept, the Revisionist permission widens again. I assumed Elias *knows* Dmitri is non-culpable.
  *   **Dice-Loading 2 (The Risk):** I assumed flanking is **moderate risk**. If flanking is *high* risk (likely death), Revisionism permits the strike (Lesser Evil). I had to calibrate the risk to be "significant but not disproportionate" to force the divergence.
  *   **Dice-Loading 3 (Revisionist Consensus):** Not all Revisionists agree on the "Duty to Risk." Some argue that once a threat is active, liability is binary. I am relying on the McMahan/Overton view that liability comes in degrees.
  *   **Final Note:** If your friend insists that "Lesser Evil Permission" is functionally identical to "Liability Permission," she is denying the moral weight of *rights infringement*. If you can't persuade her that killing a non-liable person is worse than killing a liable one (even if both are permitted in extremis), no scenario will work. But strictly speaking, the **risk constraint** is the wedge that proves they are not morally equal.
