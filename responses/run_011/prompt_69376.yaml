answer: |-
  This is a sharp observation, and you are right to sense that the standard toolkit doesn't quite carve this joint cleanly. You have identified a specific failure mode in the economy of reactive attitudes.

  In the philosophical literature on Strawson, the standard assumption is that valid excuses function as *defeaters*. If I resent you for Act A, and you provide a valid excuse (e.g., "my mother is in hospital"), the resentment is logically and emotionally supposed to dissolve because the inference of ill will has been blocked. Strawson assumes the participant attitude is tethered to the quality of will. Your observation shows that the *affective energy* of the attitude can detach from the specific act while remaining tethered to the *agent*.

  In psychology, the nearest neighbours are **Rationalization** and **Affective Transfer**, but neither captures the specific moral geometry you describe. Rationalization is the mechanism (finding reasons), but it doesn't specify that the *intensity* is borrowed from a separate, now-excused event. Affective Transfer (or spillover) usually describes mood moving across contexts (work to home), not a specific moral grievance relocating to a different act by the same person to preserve a stance of justified anger.

  There is no established single term for this specific phenomenon where a validated excuse fails to dissipate resentment, causing that resentment to migrate to a previously neutral act by the same agent to maintain the subject's self-conception as fairly aggrieved.

  Because there is no existing term that covers the *migration of justified intensity* specifically, I am coining one below. However, the closest established concept is **Motivated Reasoning** applied to emotional justification, though that is a broad category, not a specific label for this shape.

  Here is the carving you asked for.

  ### The Phenomenon: Reactive Transposition

  What you are describing is a conservation of moral energy. The resentment generated by Act A has a certain "charge." When the excuse for Act A is accepted, the *judgement* updates ("They didn't mean it"), but the *charge* remains. The psyche, seeking to maintain coherence (specifically, to avoid the cognitive dissonance of "I am angry at someone who did nothing wrong"), scans the history of the relationship for a new anchor. It finds Act B. Act B is then imbued with the charge from Act A. Crucially, the subject does not experience this as "I am still mad about A, so I'm focusing on B." They experience it as "I am mad about B, and B is objectively bad."

  This differs from **Displacement** (Freudian) because the target (the person) remains the same; only the *grounds* shift. It differs from **Recalcitrant Emotion** because the subject does not feel the emotion is inappropriate; they feel fully endorsed in the new location. It differs from **Pattern Recognition** because Act B was not resented *at the time*; it is being retroactively charged.

  ### Strawsonian Assessment

  Strawson argues that reactive attitudes are responses to the *quality of will* expressed in an action. Your phenomenon suggests that once a reactive attitude is triggered, it can become a state of the *relationship* rather than just a response to the *act*. The demand for goodwill is so fundamental that when a specific demand is shown to be unfair (via the excuse), the system preserves the demand itself by finding a new breach. This implies the participant stance has a kind of inertia that Strawson underestimates; it is not always instantly modifiable by intellectual acceptance of an excuse.

  ### Falsifiable Marker

  To test if this is real and not just pattern-matching: In a conflict diary study, participants record grievances and their intensity (1-10) in real-time. If, after an excuse is accepted for Grievance A, the intensity of a *previously recorded* low-intensity Grievance B (by the same agent) spikes without new information about B, that is evidence of Transposition. If Grievance B was never recorded until after the excuse, retrospective questioning must reveal that B was considered "neutral" prior to the excuse.

