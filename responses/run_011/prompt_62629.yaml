answer: |-
  Your friend is right, and your model contains several dangerous category errors. You have correctly identified that expected value (EV) maximisation is disastrous for compounding bankrolls, but you have incorrectly concluded that this makes Kelly 'objective' rather than a specific expression of preference. You are conflating the mathematics of growth with the philosophy of value.

  Here is the breakdown of where your picture is wrong, addressing your two specific questions and the broader framework.

  ### 1. The Logarithm and Utility (Your Second Question)

  You asked what the log is doing if Kelly is 'objectively correct' rather than a preference. The answer is blunt: the log *is* the utility function.

  When you maximise the time-average growth rate of a compounding bankroll, you are mathematically maximising the expected value of the logarithm of wealth ($E[\log W]$). This is not a coincidence; it is an identity.
  $$ \text{Growth Rate} = E[\log(1 + \text{return})] $$
  In standard decision theory, an agent who maximises $E[\log W]$ is defined as having logarithmic utility. This implies a specific coefficient of relative risk aversion (equal to 1).

  Your claim that 'Kelly isn't a risk preference' is semantically incoherent. To say you prefer Kelly over a strategy with lower growth but lower volatility is to say you value growth more than stability. That is a preference. The ergodicity argument (popularised by Ole Peters) attempts to frame this as 'objective' by arguing that ensemble averages (EV) are irrelevant for non-ergodic processes (like your single bankroll trajectory). While it is true that EV maximisation leads to ruin in compounding scenarios, this does not abolish utility theory; it simply identifies that log-utility is the specific utility function required to maximise long-term geometric growth.

  If you care about anything other than the asymptotic growth rate of your bankroll—for example, if you need to withdraw money for rent, if you have a finite time horizon, or if you simply sleep better with less volatility—then Kelly is not objectively optimal. It is only optimal for the specific goal of maximising geometric growth. Choosing that goal is a preference.

  ### 2. The Half-Kelly Rule of Thumb (Your First Question)

  Your friend likely baulked at your formulation because 'half the variance' is imprecise, but the intuition is roughly sound. Here is the actual maths.

  The growth rate curve is very flat near the optimum. If $f^*$ is the full Kelly fraction, the growth rate $G(f)$ can be approximated quadratically near the peak.
  *   **Growth:** Betting half-Kelly ($0.5f^*$) retains approximately **75% of the *excess* growth rate** (the growth above the risk-free rate), not 75% of the total growth. Since the edge is usually small, the difference in total wealth accumulation is negligible compared to the reduction in volatility.
  *   **Volatility:** The volatility (standard deviation) of the log-wealth scales linearly with the fraction bet. So, half-Kelly gives you **50% of the volatility** of full Kelly.
  *   **Variance:** Since variance is the square of volatility, half-Kelly gives you **25% of the variance** of full Kelly.

  So, the rule of thumb is actually better than you stated: you get three-quarters of the *edge* for one-quarter of the variance. This is not a 'free lunch'; it is a trade-off along the efficient frontier. It is popular because estimation error is the real killer. If you overestimate your edge and bet full Kelly, you are effectively overbetting. Overbetting Kelly reduces growth and increases ruin risk; betting more than double Kelly leads to negative expected growth (certain ruin). Half-Kelly provides a massive safety margin against overestimating your edge.

  ### 3. The 'Probability 1' and Drawdown Fallacy

  You wrote: 'in the long run Kelly beats any other fixed fraction with probability 1... so anyone worrying about being 60% down is just not taking the limit seriously.'

  This is the most dangerous part of your reasoning. The limit $t \to \infty$ is a mathematical abstraction; your solvency is a finite reality.

  1.  **Finite Time Ruin:** While Kelly maximises the probability of being ahead in the *very* long run, the path is not monotonic. With full Kelly, there is a 50% probability that your bankroll will drop to 50% of its peak value at some point. There is a 10% chance it will drop to 10%. If you have liabilities, margin calls, or psychological limits, you may be forced to stop before the asymptotic dominance kicks in. 'Probability 1' does not mean 'never experiences severe drawdown'.
  2.  **Parameter Uncertainty:** The Kelly criterion assumes you know the true probabilities and payoffs. You do not. You have an *estimated* edge. If your true edge is zero or negative, Kelly betting guarantees ruin. Even if your edge is positive but you overestimate it by a small margin, full Kelly can turn a winning strategy into a losing one. The 'probability 1' victory only holds if the inputs are exact. In the real world, fractional Kelly is not just about risk preference; it is about robustness to model error.
  3.  **Non-Ergodicity of Life:** You argue that worrying about drawdowns is ignoring the limit. But human utility is not linear in time. Losing 60% of your bankroll in year 2 might prevent you from betting in year 3. The 'time average' assumes you can ride out any storm. If your capital structure or psychology cannot withstand the variance of full Kelly, then full Kelly is objectively suboptimal for *you*, regardless of the asymptotic maths.

  ### 4. Where Expected Utility Still Rules

  You claimed maximising expected value is a mistake because it averages over 'imaginary parallel copies'. This is a compelling narrative (ergodicity economics), but it does not invalidate expected utility theory (EUT).

  EUT does not require you to maximise monetary EV. It requires you to maximise expected *utility*. If your utility function is logarithmic, EUT prescribes Kelly. If your utility function is linear, EUT prescribes EV maximisation (which, as you noted, leads to ruin in compounding scenarios). If your utility function is more concave than log (higher risk aversion), EUT prescribes betting less than Kelly.

  The error in your thinking is believing that because EV maximisation fails for compounding bankrolls, utility theory is broken. Utility theory is not broken; you were just using the wrong utility function (linear money) for the problem (compounding wealth). Once you switch to log wealth, utility theory and Kelly are identical.

  ### Summary of Corrections

  1.  **Kelly is not 'objective':** It is the optimal strategy *only* for an agent with logarithmic utility who faces no constraints, has infinite time, and knows true probabilities. Choosing it is expressing a preference for log-wealth over other distributions.
  2.  **Risk Aversion is not an error:** It is a valid parameter in your utility function. If you care about the path, not just the limit, you are rationally justified in betting less than Kelly.
  3.  **Half-Kelly:** It gives ~75% of excess growth for 25% of the variance (50% volatility). It is primarily a hedge against estimation error, not just volatility reduction.
  4.  **The Limit:** Asymptotic dominance does not protect you from ruin in finite time. 'Probability 1' applies to the limit; it does not guarantee safety on the journey.

  Your friend is correct. You have mistaken a specific solution (Kelly) for a universal law. It is a specific solution to a specific optimisation problem (maximising geometric growth). If your problem includes surviving a bad run of luck, paying rent, or tolerating uncertainty in your edge, Kelly is not the answer. Fractional Kelly is not 'wrong'; it is the rational response to a more complex utility function.
