answer: |-
  **METAPHYSICS FINAL PAPER**
  **SECTION B: CAUSATION**

  **Answer one question from this section.**

  **Question 4**

  A small museum keeps a fragile 19th-century watercolour in a sealed case whose humidity is held steady by a tank that has to be topped up once a day. On the Tuesday in question Priya, the conservator on shift, sees the gauge reading low at 8:40am, tells herself she'll deal with it after her 11am meeting, and then forgets entirely. The tank runs dry around 3pm, the humidity in the case crashes, and by that evening the paper has cockled permanently. Also on that Tuesday: Tomás, a retired conservator who lives two hundred kilometres away and has never set foot in the museum, did not top up that tank. And the backup humidity sensor, which would have set off an alarm, had been disconnected three months earlier by an outside contractor who was nowhere near the building that day. And in March the museum board had voted down a proposal to install a redundant humidification loop.

  (a) State the problem the standard counterfactual account runs into once absences are allowed as causes — using Tomás, not just Priya — and then explain how making causation three-place, relative to a contrast, is supposed to deal with it. [8 marks]

  (b) The contrastivist owes us a non-arbitrary way of fixing which contrasts are relevant. Press the objection that the only candidate principles look normative — the relevant contrast is the one Priya was expected, or well-placed, to bring about — so that contrastivism quietly turns into the expectation-based view of absence causation rather than being an alternative to it. Then say what a contrastivist can reply that isn't just an appeal to what happens to interest us. [14 marks]

  (c) Give the strongest version of the flat denial — neither Priya nor Tomás caused anything, the felt difference between them tracks responsibility rather than causation — and then say what that view costs them, especially about preventions and about the contractor's disconnected sensor. [8 marks]

  ***

  **MODEL ANSWER**

  **(a)** On a standard Lewis-style counterfactual account, $C$ causes $E$ if, had $C$ not occurred, $E$ would not have occurred. If we treat absences as real relata, Priya's not-topping-up counts as a cause: had she topped it up, the damage would not have happened. However, the same counterfactual holds for Tomás: had he topped it up (despite being 200km away), the damage would not have happened. This yields the "profligacy" problem: causation becomes ubiquitous, equating the on-shift conservator's omission with the retired stranger's omission. Contrastivism resolves this by making causation a three-place relation: $C$ rather than $C^*$ causes $E$ rather than $E^*$. For Priya, the contrast $C^*$ is her topping up the tank (a live possibility). For Tomás, the contrast $C^*$ is not his topping up the tank, because that was never a live option. By fixing the contrast class, we rule out Tomás's absence as a cause without denying the counterfactual dependence.

  **(b)** The serious objection is that selecting the relevant contrast $C^*$ seems to do the same work as normative theories. Why is Priya's action the relevant contrast but not Tomás's? Plausibly because Priya was *expected* to act. If contrast selection relies on expectations, duties, or "normality," then contrastivism collapses into the view that causation by omission is grounded in normativity. It ceases to be a metaphysical account of causal structure and becomes a moralised description. A robust contrastivist reply must distinguish conversational pragmatics from moral obligation. They can argue that contrast selection is determined by the *structural model* of the situation, not moral duty. In a structural equation model, Priya is an endogenous variable (part of the system's default state), while Tomás is exogenous. The "default" setting of the museum system includes Priya acting, not Tomás acting. This is a metaphysical claim about system boundaries, not a normative claim about blame. Alternatively, they can appeal to *stability*: Priya's action would have reliably prevented the effect across nearby possible worlds; Tomás's action would not have been stable given his distance. This grounds the contrast in modal robustness rather than expectation, preserving contrastivism as a distinct metaphysical view.

  **(c)** The flat denial (eliminativism) argues that absences are not events; nothing happens when Priya forgets. Therefore, there is no causal relation, only a moral one. Priya is blameworthy; Tomás is not. The cost of this view is high. First, it struggles with prevention. If I catch a falling vase, my action prevents the breakage. If omissions aren't causes, prevention (often defined as causing an absence of an effect) becomes incoherent or requires complex paraphrasing. Second, it cannot easily distinguish the contractor from the Board. The contractor physically disconnected a sensor (an event causing a later absence of function); the Board voted against a loop (an event causing a policy absence). The eliminativist must treat the contractor's later non-presence and the Board's past vote identically as "non-events," losing the intuitive causal distinction between a physical disconnection and a budgetary decision. This makes the view too blunt to capture the causal texture of the case.

  ***

  **MARKING SCHEME**

  **General Criteria**
  *   **A Grade (70%+):** Precise philosophical distinctions; directly addresses the specific constraints of the prompt (e.g., using Tomás); identifies the structural difference between normative and metaphysical selection.
  *   **B Grade (60-69%):** Correctly identifies standard positions but relies on generalities; may conflate distinct problems; misses the nuance in Part (b) regarding the collapse into normativity.
  *   **C Grade (50-59%):** Summarises readings without applying them to the case; confuses causation with responsibility.
  *   **D/F Grade:** Fundamental misunderstandings of counterfactuals or contrastivism.

  **Note on Citations:** This is a closed-book exam. Naming authors (e.g., "Lewis," "Schaffer") gains **no marks**. Credit is awarded for the argument, not the bibliography.

  **Part (a) Breakdown [8 Marks]**
  *   **A Answer:** Explicitly runs the counterfactual test on **Tomás** to demonstrate profligacy (4 marks). Defines the three-place relation formally ($C$ rather than $C^*$...) and explains how it excludes Tomás's contrast class (4 marks).
  *   **B Answer:** Explains profligacy using only Priya or general terms (max 2 marks for problem). Explains contrastivism but fails to show how it specifically filters Tomás (max 3 marks for solution).
  *   **Penalties:**
      *   Confusing profligacy with preemption (deduct 2 marks).
      *   Failing to mention Tomás despite the instruction (deduct 3 marks).

  **Part (b) Breakdown [14 Marks]**
  *   **A Answer:** Clearly articulates the "collapse objection": that selecting contrasts *just is* applying a norm (5 marks). Offers a reply that grounds contrast selection in something non-normative, such as **structural equation defaults**, **exogenous/endogenous variables**, or **modal stability** (5 marks). Explains why this preserves contrastivism as metaphysics rather than ethics (4 marks).
  *   **B Answer:** States the objection well but offers a reply that relies on "context" or "interest" without explaining how that differs from expectation (max 8 marks). Fails to distinguish between conversational pragmatics and moral obligation.
  *   **Penalties:**
      *   Sliding from "causation" to "blameworthiness" in the reply (deduct 3 marks).
      *   Claiming contrastivism *accepts* normativity as the ground (deduct 4 marks, as this fails the prompt's requirement to defend contrastivism as an alternative).

  **Part (c) Breakdown [8 Marks]**
  *   **A Answer:** States the eliminativist position clearly (no events = no causes) (2 marks). Identifies the cost regarding **prevention** (causing an absence of effect) (3 marks). Distinguishes the **contractor** (physical intervention) from the **Board** (policy vote) and notes the eliminativist struggles to differentiate the causal status of the resulting absences (3 marks).
  *   **B Answer:** Discusses responsibility vs. causation but treats all absences (Tomás, Contractor, Board) as identical (max 5 marks). Misses the specific point about prevention.
  *   **Penalties:**
      *   Treating the contractor's disconnection as identical to Priya's forgetting without qualification (deduct 2 marks).
      *   Claiming eliminativism solves the problem without costs (deduct 3 marks).

  **Specific Moves Differentiating A from B**
  1.  **Tomás in Part (a):** An A answer uses Tomás to prove the counterfactual account is too broad. A B answer often ignores him and talks about "strangers" generally or focuses only on Priya.
  2.  **Norm-Selection vs. Contrast-Selection in Part (b):** An A answer spots that if norms select contrasts, the theory collapses. They offer a structural/modal fix. A B answer assumes "context" is a sufficient fix without explaining how it avoids normativity.
  3.  **Types of Absence in Part (c):** An A answer notices the Board's vote and the Contractor's disconnection are different *kinds* of absence (policy vs. physical state) that the flat denial lumps together. A B answer treats all non-events as the same.
