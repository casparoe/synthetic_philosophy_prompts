      *   *Section 2: Verbal vs. Real.* Argue it's real. It's about the logic of counterfactuals (Stalnaker vs. Lewis semantics applied to game trees).
      *   *Section 3: The Experiment.* Be honest. It's underdetermined. Cheap talk + behavioral data = infinite rationalizations. Explain *why* Camp A and B can both claim it (Utility shift vs. Belief shift).
      *   *Section 4: What Counts as Progress?*
