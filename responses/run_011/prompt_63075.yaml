  9.  **Final Polish:** Ensure the language is clear enough to be adapted into the write-up but precise enough to satisfy the user's analytical request. (The user is the minute-taker, writing the proposal summary). *Wait, the user asked me to give them a list they can put into the write-up.* I should format it so they can lift sections or understand the logic to write it themselves. I will provide the analysis clearly so they can synthesize it.

