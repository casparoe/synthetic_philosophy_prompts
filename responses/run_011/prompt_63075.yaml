      *   *Truth Values:* Be nuanced. "False" is strong. "Overstated" or "Context-dependent" is better.
      *   *The "Eyes" Study:* This is crucial. It suggests *symbolic* watching works. Does a camera count as symbolic? Yes, but it implies punishment, not just social pressure.

