      *   **Theoretical Framework:** Robert Nozick's *Entitlement Theory* (Justice in Acquisition, Justice in Transfer, Rectification of Injustice).
      *   **Task:** Answer six specific sub-questions (a) through (f) plus a final concluding identification.
      *   **Constraint:** The tone should be philosophical, analytical, and precise, isolating the philosophical question from technical legal apparatus.

  2.  **Deconstruct the Doctrines:**
