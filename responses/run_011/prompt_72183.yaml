answer: |-
  (a) **Reconstruction of Entitlement**
  The bundle presupposes a **hybrid entitlement theory** that modifies strict historical principles with a **pragmatic constraint on rectification**. A pure historical theory (like Nozick's idealized version) holds that a holding is just only if every step in its chain of custody was just. Under that view, a theft never cures; the title remains tainted forever. The doctrines described, however, treat time as a curative agent.

  To reconcile this with Nozick, one must locate the extinguishment of stale claims inside the **principle of rectification**. Nozick left rectification undeveloped, but these doctrines suggest a specific rule of rectification: *when the epistemic or social costs of undoing an injustice exceed the injustice itself, rectification is deemed satisfied by the stabilization of the current holding.* Thus, entitlement is not purely historical in its *application*, though it remains historical in its *structure*. The validity of title turns on time not because time creates value, but because time creates a presumption that the cost of rectification (social disruption, evidentiary uncertainty) has outweighed the duty to restore the *status quo ante*. The practice presupposes that entitlement is historical *unless* the claim becomes "stale," at which point the duty of rectification expires.

  (b) **Candidate Rationales**
  The doctrine **strictly requires** the **independent value of repose and settled expectations**.
  *   **Decay of evidence:** This sits comfortably with the doctrine but is not strictly required. In many adverse possession cases, the record is perfect (e.g., a recorded deed showing the true owner, and open admission by the possessor), yet the statute of limitations still runs. The law bars the claim even if evidence is pristine.
  *   **Labor/Use:** This sits comfortably with adverse possession (improving land) but fails to explain the limitation on movables (Point 2). A possessor of stolen jewelry may add no labor to it, yet still acquire title.
  *   **Repose:** This is the necessary engine. The law explicitly prioritizes the security of current transactions and the psychological peace of the possessor over the abstract correctness of the historical record. Without the normative value of repose, there is no reason to stop unwinding the chain of title regardless of evidence or labor.

  (c) **The Basketball-Player Gap**
  Yes, the difference exposes a **structural gap** in the Wilt Chamberlain example. Nozick's example illustrates the **principle of transfer**: given a just starting distribution, voluntary exchanges preserve justice. It assumes a clean chain. The doctrines here address the **principle of acquisition and rectification** within a tainted chain. The Chamberlain example cannot handle "laundering"—the process by which an unjust origin is cleansed by subsequent passage of time or good-faith intermediaries. Nozick's theory lacks a mechanism to explain why a voluntary transfer from a thief (or a thief's heir) eventually yields a just title. The doctrines imply that justice is not merely preserved by transfer but can be *created* by the passage of time, a dynamic the Chamberlain example was never built to handle.

  (d) **Inconsistency vs. Graded Theory**
  The bundle presupposes a **graded historical theory**, not an inconsistent one. The strength of a historical claim scales with the **moral gravity of the originating wrong**.
  *   **Ordinary theft/trespass (Points 1 & 2):** Treated as private wrongs where the social cost of disruption eventually outweighs the owner's right.
  *   **Persecution/Genocide (Point 3):** Treated as public/moral catastrophes where the gravity of the wrong is so high that it resists the normal "statute of limitations" on justice.
  *   **Principled or Political?** It claims to be **principled**. The distinction rests on the nature of the violation: a breach of property law versus a breach of human rights. However, in application, it often functions politically, as the "identifiability of victims" and "involvement of public institutions" are contingent on historical record-keeping and diplomatic pressure. Philosophically, it suggests that historical entitlement has a "half-life" determined by the severity of the initial sin.

  (e) **Rival Accounts and Discriminating Detail**
  *   **Utilitarian security of expectations:** Licenses most of the practice (Points 1, 2, and 4). It explains why we quiet titles and prioritize stability over historical accuracy.
  *   **Strict entitlement:** Licenses Point 3 (Nazi art), but fails Points 1 and 2.
  *   **Labor-mixing:** Licenses Point 1 (adverse possession via improvement), but fails Point 2 (movables) and Point 3.
  *   **End-state distributive:** Licenses none of these specifically, as none aim at a pattern of distribution (e.g., equality).

  The single doctrinal detail that best discriminates among them is **Point 3 (The Persecution Exception)**.
  *   **Why:** Pure Utilitarianism cannot explain why we disrupt settled expectations for old crimes in Point 3 while maintaining them in Points 1 and 2. Pure Strict Entitlement cannot explain why we *don't* disrupt them in Points 1 and 2. The existence of the exception proves the system is not purely Utilitarian (stability isn't absolute) nor purely Historical (history isn't absolute). It forces a choice between theories based on the *moral weight* of the history, which only a graded historical account can accommodate.

  (f) **Pure Historical Entitlement and the Breaking Point**
  A system of pure historical entitlement would require **infinite traceability**. Every current holding would need a chain of title traceable to a just initial acquisition (Lockean mixing or voluntary transfer) without a single link of theft or coercion.
  *   **What breaks first:** The **epistemic baseline for rectification**. Given that many current titles originate in conquest, colonial dispossession, or feudal seizure for which no defensible "just baseline" survives (we cannot know what the distribution would have been absent the injustice), the system would face **radical indeterminacy**.
  *   **Result:** Almost all current holdings would be presumptively illegitimate. The system would collapse into chaos because the "counterfactual history" required for Nozickian rectification is impossible to construct for deep historical wrongs.

  **Final Commitment**
  The commitment whose abandonment would force the largest change in actual doctrine is the **commitment to Limitation Periods (Repose/Time as a cure)**.

  *   **Direction of Change:** Abandoning this commitment moves the system toward **Strict Historical Entitlement (Rectification/Restitution)**.
  *   **Impact:** This would invalidate the majority of current property titles (Points 1 & 2), triggering massive restitution claims (indigenous land claims, heirs of ordinary theft, colonial assets). While Point 3 (Nazi art) shows the system *can* handle historical claims, it is currently the exception. Making it the rule would upend the utilitarian stability that currently undergirds the global property system. The doctrine currently balances History against Time; removing Time leaves only History, which the modern world cannot sustain without catastrophic disruption.
