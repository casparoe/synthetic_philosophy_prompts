answer: |-
  # The Sieve

  The equation on the blackboard looked like a cage. Elena stood before it, the chalk dust settling on her knuckles, tracing the inequality that bound the measure of the set to the time required to recognize it. On the left, the density of functions possessing the property. On the right, the complexity of the test. They were tied together by a constant she had derived three nights ago, a coefficient that refused to vanish. To prove the set was large, she had to assume the test was efficient. To prove the test was efficient, she had to count the set. She could not cut the wire between them.

  Outside the window of the institute, the winter dark was already complete. It was four in the afternoon. The heating system in the building groaned, a rhythmic shudder that vibrated through the floorboards and into the soles of her shoes. She wiped the board, but not the inequality. She wiped the space around it, clearing away the failed attempts to decouple the recognition procedure from the counting argument. There were none. Every time she made the property harder to recognize, the measure shrank. Every time she forced the measure to stay large, the recognition time dropped into the quasipolynomial range.

  Her phone buzzed on the desk behind her. An automated notification from the documentation project. *Certificate renewal due in thirty days.* She did not turn to look at it. She knew the parameters by heart because she had chosen them. Two years ago, she had sat in a room much like this one with the project's security lead, a man who trusted her because she spoke about entropy the way others spoke about prayer. She had recommended the specific pseudorandom function family. She had signed off on the key lengths. She had told them the margin was sufficient.

  Now she held a lemma that suggested the margin was an illusion.

  She capped the chalk and walked to the window. The institute was unglamorous, a brick block set back from the university proper, populated by researchers who worked on problems too dry for grants and too difficult for tenure tracks. She was thirty-four. She had been working on the sieve for eighteen months. It was a combinatorial property of Boolean functions, a way to measure scatter. She had not given it a public name. In her notes, it was the sieve. It caught functions with structure. It let random functions pass through.

  If the sieve was useful, it meant that functions generated by small circuits—like the ones used in encryption protocols—would get caught. They would look different from random functions to anyone who knew how to run the sieve. If the sieve was constructive, it meant running it was fast. She had proved it was large. She believed she could prove it was useful.

  The door to the office opened. It was Mark from cryptography. He held a mug that said *SECURITY THROUGH OBSCURITY* in peeling letters. He was the only person in the building who knew enough complexity theory to understand what she was doing and enough cryptography to understand what it meant.

  "You're still here," he said. He didn't wait for an invitation. He leaned against the doorframe. "Darius emailed me. He's excited about the preprint."

  "Darius is excited about everything," Elena said. She turned back to the board. "He thinks we're close to P not equal to NP."

  "Are we?"

  "I have the largeness lemma. It's circulating. The usefulness proof is... pending."

  Mark took a sip of coffee. He watched the inequality on the board. He didn't ask what the variables stood for. He knew the shape of a natural proof when he saw one. Everyone in complexity knew the shape. It was the shape of a door that had been welded shut twenty years ago.

  "You know the barrier," Mark said. It wasn't a question.

  "I know the theorem," Elena said.

  "Razborov and Rudich," Mark said. "If strong pseudorandom functions exist, no natural property can be useful against P/poly. You know the contrapositive. If you prove a natural property is useful, you prove pseudorandom functions don't exist."

  Elena picked up the eraser. She held it against the board but didn't wipe. "I know."

  "So if you finish this," Mark said, gesturing with the mug toward the inequality, "you aren't separating complexity classes. You're breaking crypto. You're saying the world is not Cryptomania. You're saying we're in Heuristica, or maybe Pessiland. You're saying secrets don't hold."

  "I'm saying the proof exists," Elena said.

  "There's a modal confusion here, Elena." Mark stepped into the room. He set the mug on her desk, next to the phone. "You're treating the theorem like it's a switch you can flip. It's not. It's a description of the terrain. Either the property isn't useful, in which case you publish a failed technique and nothing is lost. Or pseudorandomness of the required strength does not exist. If that's the case, the archive was never protected by anything but ignorance. Your paper didn't remove a protection that was there to be removed."

  He was right. Logically, he was flawless. The state of the mathematical world was fixed. Either one-way functions existed or they did not. Her proof could not change the ontology of integers. It could only reveal it.

  "The archive uses the parameters I recommended," Elena said. Her voice was flat.

  "Then if the sieve works, the parameters were bad," Mark said. "But you didn't make them bad. You just found out. There's a difference between a fact obtaining and a fact being usable. Between something being possible and its being in hand."

  "I have it in hand," Elena said.

  "You have a draft," Mark corrected. "You have a belief. If you publish, and you're wrong, you look foolish. If you publish, and you're right, you reveal that the lock was open. But you didn't open it. You're worried about the cost of discovery. But the cost was paid when the parameters were chosen. You're taking responsibility for the measurement, not the error."

  Elena turned from the board. She looked at him. He was standing in the patch of light from the hallway, his face half in shadow. He looked reasonable. He looked like a man who believed that truth was neutral.

  "It's not about the lock," Elena said. "It's about the key."

  Mark frowned. "If the lock is broken, the key doesn't matter. Anyone can walk in."

  "If I publish the sieve, I give them the key."

  "You give them the description of the lock," Mark said. "If the lock is broken, someone else finds the key. Maybe tomorrow. Maybe in ten years. You think withholding the proof preserves the security? It preserves the ignorance. There's a difference."

  "I know the difference," Elena said.

  "Do you?" Mark picked up his mug. "Impagliazzo's worlds. We talk about them like they're places we can visit. They're not. They're conditions. We live in one of them. We don't get to choose. You're acting like you can vote. You can't. You can only report."

  He left the mug on the desk. He walked out into the hallway. The light clicked off as he moved down the corridor, leaving Elena in the dim glow of the office lamp.

  She stood alone with the inequality. The silence of the building returned, heavier than before. She walked to the desk and looked at the phone. The notification screen was dark now, but the memory of the text remained. *Certificate renewal.* The witnesses were still inside the country. The testimony was still encrypted. The identities were still hidden behind the keys she had approved.

  Mark was right about the logic. If the pseudorandom functions existed, her proof had a bug. It had to. The theorem was unconditional on the existence of the barrier. If the world was secure, her sieve was useless. It would fail the usefulness test. She would publish a paper saying she found a large, constructive property that didn't separate circuits from random functions. It would be a null result. A footnote.

  But she didn't think it was a bug. She had checked the reduction three times. The sieve caught the circuits. She could feel the structure in the numbers. It felt like truth.

  If she was right, the world was not secure. The pseudorandom functions did not exist. The archive was vulnerable. But vulnerability was not exposure. Exposure required an agent. It required someone to run the sieve.

  Mark said she was confusing the fact with the usage. He said the danger was inherent. But she knew that mathematics was not physics. A uranium deposit does not become a bomb until someone enriches it. A proof does not become an attack until it is implemented. By publishing, she enriched the uranium. She made the attack efficient. She made the distinction between *possible* and *in hand* vanish.

  She sat down at the computer. The screen woke up, casting a blue light over her hands. She opened the submission portal for the workshop. The deadline was eleven days out, but the system opened early for pre-registration. She had the draft ready. Darius was expecting it. He had written the introduction. He thought they were on the verge of a breakthrough. He thought they were going to separate P from NP.

  He didn't know about the audit. He didn't know about the witnesses. He thought this was pure math.

  Elena opened the file. The text scrolled past. The definition of the sieve. The lemma on largeness. The sketch of the usefulness proof. It was all there. If she uploaded it, it would be timestamped. It would be public. It would be citable.

  If she deleted it, she would have to tell Darius. She would have to explain why a proof they had worked on for two years was being withdrawn. She would have to lie, or she would have to tell him about the archive. If she told him, the secret spread. If she lied, she damaged her career. She was at an unglamorous institute. She needed the publication. She needed the tenure track.

  But the tenure track was in a world where secrets could be kept.

  She hovered the cursor over the upload button. The inequality on the board behind her seemed to pulse in the peripheral vision. The constant that tied the counting to the recognition. The cost of the proof was the cost of the secret. They were the same quantity measured twice.

  Mark said she couldn't choose the world. He said she could only report. But reporting changed the world. Knowing the lock was broken changed the behavior of the people who relied on it. If she published, and she was right, the project would have to migrate. They would have to change protocols. They would have to move the data. Movement created risk. Transit was where people were caught.

  If she didn't publish, and she was right, someone else might find the sieve. But maybe not. The sieve was strange. It required a specific way of looking at the truth table. It required seeing the scatter as structure. Maybe she was the only one who saw it. Maybe the world was secure because no one looked closely enough.

  That was Pessiland. A world where problems were hard, but no secrets could be kept because the hardness was average, not worst-case. Or a world where secrets could be kept, but no proofs could be found.

  She thought about the witnesses. She had never met them. She knew them as rows in a database. Encrypted blobs. But she knew what was inside. She had read the redacted summaries. She knew what happened to people when the encryption failed.

  Mark said the danger was inherent. He said the lock was already open. But a lock that is open is not the same as a door that is pushed.

  She clicked the upload button.

  The system asked for confirmation. *Submit manuscript to workshop proceedings?*

  She looked at the board. The chalk dust was settling again. The inequality held. It was beautiful. It was terrible. It was true.

  She typed *Yes*.

  The screen spun. The progress bar moved across the white space. It did not tell her which world she was in. It did not tell her if the proof would hold. It did not tell her if the keys would turn. It only told her that the file was transferring.

  When the bar reached the end, the screen changed. *Submission Received.* A reference number appeared. A timestamp.

  Elena sat back. The room was quiet. The heating system groaned. Outside, the winter dark pressed against the glass. She did not know if she had just proven a theorem or broken a promise. She did not know if the archive was safe or if it was already gone. She only knew that the sieve was no longer hers. It belonged to the world now.

  She closed the laptop. She walked to the board and picked up the eraser. She wiped away the inequality. The black surface was blank, reflecting the light of the lamp. She could not see her own face in it. She put the eraser down and turned off the lamp.
