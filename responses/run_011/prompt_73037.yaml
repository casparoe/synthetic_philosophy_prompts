  Ok so here's a case I keep circling back to and I want someone to actually work through it with me instead of giving me the usual summary.

  Louisiana's Road Home program after Katrina, the big homeowner grant scheme, mostly federal money administered by the state, meant to let people rebuild, sell, or relocate. My understanding of the design, which you should feel free to correct or sharpen but which I'm fairly confident about in broad outline: the grant came out of a formula that took the lesser of the home's pre-storm market value and the cost of rebuilding it, subject to a cap. So two families with identically destroyed houses got different amounts depending on what the market said their house was worth before the storm, and because neighborhood values in New Orleans track decades of segregation and disinvestment, the shortfall landed heavily on Black homeowners in the lower-valued areas. There was litigation and public pressure, and the state eventually changed how it computed grants and put more money in.

  I want this analyzed through luck egalitarianism, the brute luck versus option luck way of thinking, where the question is supposed to be whether a disadvantage flows from choices someone made or from circumstances they didn't.

  Do the mapping first and be strict about it. What exactly is the relevant disadvantage here: the flood damage, or the shortfall in compensation? Whos choices are the candidates for turning it into option luck, buying in a flood-prone city, buying in a cheap neighborhood, not carrying flood insurance, not evacuating? And here's the bit I can't resolve on my own. The market value of a house in a segregated city is not a gift of nature and it isn't the owner's choice either. It's a record of other people's decisions and of past policy. So a formula that keys payouts to that value makes your compensation depend on something that looks an awful lot like an endowment rather than a choice, which seems to be exactly what luck egalitarians say a distribution ought to be insensitive to. Does that make Road Home a violation of the theory's own ideal, or is there a respectable luck-egalitarian defense of the formula, something about budget limits, the cap, or holding people to the house they actually chose to buy?

  Then run it in the other direction, because that's the part I care about more. What does the case do to the theory? Does it suggest the brute/option distinction is just the wrong tool, on the grounds that the interesting injustice is structural and the individual-choice framing can't see it, which I take to be the relational or democratic equality complaint plus the harshness worry about leaving people to drown in the consequences of their own bad bets? Or does the case hand luck egalitarianism a win it doesn't usually get credit for, since the theory has its own resources for saying the formula was endowment-sensitive and therefore unjust? I'd also like to know where the theory simply goes quiet. Is there anything in the episode, say whether the money should have been spent rebuilding a city that will flood again, or how to weigh homeowners against renters who got nothing comparable, on which luck egalitarianism has no verdict at all rather than a contested one.

  One more thing, and please take it seriously. Keep me honest about the state of the field: where there's a settled or near-settled view among people who work on this, say so plainly, and where it's genuinely contested, including contested among luck egalitarians themselves about what the responsibility condition even amounts to, flag it as contested and don't sell me one side as the consensus. I'd rather have the seams showing than a confident-sounding answer that's really one faction's house position.

  Please write it as one continuous piece of prose, like an email to a friend, no headings, no bullet points, no bold, no tables, nothing that breaks the flow. I'm reading it on my phone on the train. And no references or bibliography, I can't look anything up anyway, I just want the reasoning laid out. Also keep the settled stuff seperate from the speculative stuff as you go, in the sentences themselves rather than in any structural markup.
