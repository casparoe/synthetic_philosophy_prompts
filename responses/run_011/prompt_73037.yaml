answer: |-
  Hey, I've been thinking about that Road Home case you sent over and I agree it's the perfect stress test for this stuff, so let's walk through it together without trying to tidy it up too much. To map this strictly through luck egalitarianism we have to start by pinning down exactly what counts as the disadvantage we're trying to correct, because the theory turns on whether that disadvantage flows from brute luck, which is unchosen circumstance, or option luck, which is the result of a gamble you voluntarily took. There is a broad consensus among luck egalitarians that the hurricane itself and the resulting flood damage are paradigmatic cases of brute luck, since no homeowner chose for the levees to fail or the storm to hit, so the baseline disadvantage is the loss of the home. The tricky part is whether the shortfall in compensation counts as a new disadvantage or just a failure to mitigate the first one, and most working in this field would treat the compensation scheme as the mechanism meant to neutralize the brute luck of the damage, meaning the formula itself becomes the object of scrutiny. When you look at the choices involved, you have to separate the decision to live in New Orleans from the decision to live in a specific neighborhood, and while there is a settled view that choosing to live in a hurricane-prone region involves some element of option luck, there is significant contention over whether choosing a specific neighborhood in a segregated city counts as a free choice or a constrained circumstance. If you buy into the stricter view that market value is largely a record of historical policy and segregation rather than individual merit or choice, then tying the grant to that value makes the compensation sensitive to an endowment rather than a choice, which is a direct violation of the core luck egalitarian ideal that distribution should be insensitive to endowments.

  That leads us to the question of whether there is a respectable luck-egalitarian defense of the formula, and here the waters get murkier because you run into the practical constraints of implementation versus the ideal theory. A defense might argue that the cap and the formula were necessary due to budget limits, and while luck egalitarianism is primarily about justice rather than efficiency, there is an ongoing debate about whether justice demands full compensation regardless of cost or if it permits triage when resources are scarce, which is definitely contested territory. Another defense might claim that homeowners chose their asset value when they bought the house, so the lower payout is just respecting their option luck, but this collapses if you accept the premise that segregated market values are structural constraints rather than free choices, and among contemporary luck egalitarians it is increasingly accepted that structural racism functions as brute luck rather than option luck because it limits the meaningfulness of the choice itself. So if you hold that view, which is gaining traction but not yet universal, the Road Home formula was unjust on luck egalitarian grounds because it penalized people for the brute luck of being located in a devalued market caused by historical disinvestment, effectively treating a social endowment as a personal choice.

  Now running it in the other direction to see what the case does to the theory, I think this episode actually hands luck egalitarianism a win it doesn't usually get credit for, because it shows the theory has the resources to identify structural injustice even when it focuses on individual compensation. The common critique from relational or democratic egalitarians is that luck egalitarianism is too individualistic to see structural racism, but here the theory's insistence on distinguishing endowment from choice forces you to admit that market value in a segregated city is an endowment, so the theory itself demands the correction that the litigation eventually achieved. However, there are places where the theory goes quiet or struggles to give a verdict, particularly regarding the renters who received nothing comparable to the homeowners, because luck egalitarianism has a settled commitment to compensating for brute luck but no consensus on whether property ownership creates a stronger claim to compensation than tenancy when both lose their shelter. Some argue that homeowners lost an asset while renters only lost a service, but others argue the brute luck of being displaced is the same, and this remains a contested point where the theory doesn't offer a clear directive without additional premises about property rights. There is also a silence on the question of whether money should have been spent rebuilding a city that will flood again, since luck egalitarianism is focused on rectifying past disadvantages rather than managing future risk, leaving it unclear whether justice requires rebuilding despite the danger or relocating people to safer ground regardless of their attachment to the city.

  I want to keep you honest about the state of the field here because it's easy to conflate the different camps, so let's be plain about where the lines are drawn. It is settled among luck egalitarians that the goal is to compensate for brute luck and not option luck, and it is settled that racial segregation is generally considered a circumstance rather than a choice, so the verdict that the original formula was unjust is likely the majority view among scholars today. However, it is genuinely contested how much weight to give to budget constraints when they conflict with full compensation, and it is also contested whether the theory can handle the relational harm of the stigma involved in receiving aid, which is more the domain of relational egalitarianism. There is also a live debate among luck egalitarians themselves about the responsibility condition, specifically whether people should be held responsible for choices made under conditions of significant inequality, which directly impacts how you judge the decision to buy in a lower-valued neighborhood. So while the theory might seem to have a clear verdict on the surface, the application depends on which faction's view of responsibility you adopt, and I don't think we can say there is a single consensus on how strictly to apply the choice constraint in cases of deep structural inequality. Ultimately though, this case suggests the brute versus option luck distinction isn't the wrong tool, but rather that it needs to be applied with a robust understanding of what counts as a choice, and if you do that, the theory actually validates the intuition that the Road Home program was unjust without needing to abandon its core framework. It doesn't solve the problem of the renters or the future flood risk, and those silences are real limitations, but on the specific question of the grant formula and the market value disparity, luck egalitarianism has a clear and arguably correct verdict that aligns with the moral intuition that people shouldn't pay for the history of segregation with their recovery funds. I hope that helps you circle back to the case with a clearer map of where the theory stands and where it still has work to do, and let me know if you want to dig into the renter question specifically since that feels like the biggest gap in the literature.
