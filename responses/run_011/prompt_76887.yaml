  ### The Winner

  **Candidate 2: The Attitudinal Account.**

  You should defend this one because it is the only positive account of unity that survives your hard cases while satisfying your advisor's constraint to find "what all pleasures have in common." Candidate 4 scores higher on the cases but violates your assignment constraints by denying there *is* a common property, which risks failing the prompt itself.

  ### The Trap and The Escape

  **The Hole:** A panelist will ask: "How can you have an attitude of 'liking' or 'wanting' toward a flow state (Case D) or a retrospective memory (Case A) if you aren't consciously thinking about it at the time?"

  **The Rebuttal:** Distinguish between **occurrent** attitudes (conscious thinking) and **dispositional** attitudes (what you would endorse if asked). Argue that pleasure is a dispositional pro-attitude toward experience, which allows you to be absorbed in the activity without monitoring your enjoyment, yet still count it as pleasure because you wouldn't want it to stop.
