  I'm writing the take-home for a grad formal-epistemology seminar and I want one question on imprecise credences that can't be aced by reciting the usual talking points. Setup I have in mind: an agent's credal set over a coin's bias is the open interval (1/4, 3/4), tosses iid; she's offered a $1 bet on heads for the *second* toss at 50 cents, and separately she watches the first toss land heads. The question should make students (a) see why the interval for the second toss is exactly as wide after that observation as before, (b) say whether thats a reductio of imprecise credences or just what an honest agent should expect from a deliberately vague prior, and (c) work out what maximin, E-admissibility and gamma-maximin each recommend about the bet, and whether those recommendations sit well with what she expects herself to do once she's seen a toss. Model answer around 700 words, then a marking scheme out of 25 naming the specific moves an A answer has to make — e.g. dilation is not the same thing as failing to update, nor the same as nonconglomerability, and the width of the credal set is load-bearing for whether it happens — plus the mistakes that should cost marks, especially treating "my interval didn't shrink" as "I learned nothing". Don't require any name-dropping or references; I want the mechanics.
