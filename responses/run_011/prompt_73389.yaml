answer: |-
  # Exam Question: Imprecise Credences and Sequential Tosses

  **Scenario:** An agent's credal state regarding the bias $\theta$ (the objective chance of Heads) of a coin is represented by the open interval $(1/4, 3/4)$. This credal set $\mathcal{M}$ contains every precise probability function $P_\theta$ such that $P_\theta(\text{Heads}) = \theta$ for some $\theta \in (1/4, 3/4)$. The agent knows tosses are independent and identically distributed (iid) conditional on $\theta$.

  She is offered a bet: pay \$0.50 to win \$1.00 if the **second** toss lands Heads. Before deciding, she observes the **first** toss land Heads ($H_1$).

  **Questions:**
  1.  **Updating:** Show formally why the lower and upper probabilities for Heads on the second toss ($H_2$) remain $1/4$ and $3/4$ after observing $H_1$.
  2.  **Interpretation:** Is this stability a *reductio ad absurdum* of imprecise credences, or a consequence of representing ignorance? Specifically, distinguish between "the interval did not shrink" and "the agent learned nothing."
  3.  **Decision:** Calculate the recommendations for **Maximin**, **E-admissibility**, and **$\Gamma$-maximin** regarding the bet. Do these recommendations violate dynamic consistency (i.e., would she have made a different plan before seeing $H_1$)?

  ***

  # Model Answer

  **1. Updating and Interval Stability**
  Let $\mathcal{M} = \{P_\theta : \theta \in (1/4, 3/4)\}$. For any specific $P_\theta \in \mathcal{M}$, the tosses are iid. Therefore, $P_\theta(H_2 | H_1) = P_\theta(H_2) = \theta$. Generalized conditioning updates the credal set to $\mathcal{M}^{H_1} = \{P_\theta(\cdot | H_1) : P_\theta \in \mathcal{M}\}$. Since $P_\theta(H_2 | H_1) = \theta$, the set of predictive probabilities for $H_2$ after observation is exactly $\{\theta : \theta \in (1/4, 3/4)\}$. Consequently, the lower envelope $\underline{P}(H_2 | H_1) = \inf(\mathcal{M}^{H_1}) = 1/4$ and the upper envelope $\overline{P}(H_2 | H_1) = \sup(\mathcal{M}^{H_1}) = 3/4$. The interval width is unchanged.

  **2. Interpretation: Reductio or Feature?**
  This stability is not a *reductio* but a feature of the specific representation of ignorance. The interval fails to shrink because the model lacks a second-order distribution over $\theta$. In a precise Bayesian model with a uniform prior over $(1/4, 3/4)$, observing $H_1$ would shift probability mass toward higher $\theta$, narrowing the predictive interval. Here, $\mathcal{M}$ treats every $\theta$ in the range as equally possible without weighting. Observing $H_1$ does not rule out any $\theta \in (1/4, 3/4)$ (since likelihood $P(H_1|\theta) = \theta > 0$ for all). Thus, no precise measure is eliminated from $\mathcal{M}$.

  Crucially, "the interval did not shrink" does not mean "the agent learned nothing." The agent learned $H_1$ occurred. However, given the iid assumption and the coarse prior, $H_1$ provides no leverage to distinguish between the biases within the set. The stability reflects an honest admission that a single toss cannot refine bounds when the prior is merely a range of chances rather than a distribution over them.

  **3. Decision Rules and Consistency**
  The bet $B$ costs \$0.50 and pays \$1.00 on $H_2$. The net utility is $+0.50$ if $H_2$ and $-0.50$ if $T_2$.
  For any $P_\theta$, Expected Utility $EU_\theta(B) = 0.5\theta - 0.5(1-\theta) = \theta - 0.5$.
  Since $\theta \in (1/4, 3/4)$, the range of expected utilities is $(-0.25, 0.25)$.

  *   **Maximin:** Maximizes the minimum EU. $\min(EU) = -0.25$. Rejecting the bet guarantees \$0. Since $-0.25 < 0$, Maximin recommends **Reject**.
  *   **E-admissibility:** An option is admissible if it maximizes EU for at least one $P \in \mathcal{M}$. Accepting is optimal for $\theta > 0.5$; Rejecting is optimal for $\theta < 0.5$. Both are **E-admissible**.
  *   **$\Gamma$-maximin:** Maximizes the minimum EU (same as Maximin in this binary choice). Recommends **Reject**.

  **Dynamic Consistency:** Before observing $H_1$, the predictive interval for $H_2$ was already $(1/4, 3/4)$ because tosses are iid. Thus, the ex-ante recommendations are identical to the ex-post recommendations. The agent suffers no dynamic inconsistency; she plans to reject (or remain undecided) and does so. The puzzle is not inconsistency, but the intuition that evidence $H_1$ should have made acceptance more attractive. Under this imprecise model, it does not.

  ***

  # Marking Scheme (Total: 25 Points)

  **Part 1: Updating Mechanics (6 Points)**
  *   **2 pts:** Correctly identifies that for any precise $P_\theta$, $P(H_2|H_1) = \theta$ due to iid structure.
  *   **2 pts:** Correctly derives that the set of posteriors is identical to the set of priors $\{\theta : \theta \in (1/4, 3/4)\}$.
  *   **2 pts:** Explicitly states lower/upper probabilities remain $1/4$ and $3/4$.
  *   *Deduction:* -2 pts for claiming this is "Dilation" (Dilation requires widening; this is stability/non-contraction).

  **Part 2: Interpretation & Learning (7 Points)**
  *   **3 pts:** Argues this is a feature of the "vacuous" within-interval prior (lack of second-order weighting), not necessarily a fatal flaw.
  *   **4 pts:** **Critical Distinction:** Successfully distinguishes between "interval stability" and "learning nothing." Must note that $H_1$ is observed (learning occurred) but likelihoods are non-zero for all $\theta$, so no priors are eliminated.
  *   *Deduction:* -3 pts for equating stable intervals with "evidence was ignored" or "no updating happened." Updating *did* happen ($P(\cdot|H_1)$), it just coincides with $P(\cdot)$ for iid processes.

  **Part 3: Decision Theory (7 Points)**
  *   **2 pts:** Correctly calculates EU range $(-0.25, 0.25)$.
  *   **3 pts:** Correctly identifies recommendations: Maximin/$\Gamma$-maximin = Reject; E-admissibility = Indeterminate (both admissible).
  *   **2 pts:** Correctly assesses Dynamic Consistency (Ex-ante and Ex-post intervals are identical, so plans match).
  *   *Deduction:* -2 pts for claiming dynamic inconsistency exists.

  **Part 4: Synthesis (5 Points)**
  *   **3 pts:** Connects the decision rule to the interval width. (e.g., Maximin rejects *because* the lower bound $1/4 < 0.5$).
  *   **2 pts:** Coherent argument on whether the agent should trust these rules given the "stubborn" interval.
  *   *Deduction:* -2 pts for name-dropping authors without explaining the mechanics (e.g., "Walley says..." without derivation).

  **General Penalties**
  *   **Math Errors:** -1 pt per calculation error.
  *   **Confusion of Terms:** -2 pts for conflating "bias $\theta$" with "probability of $H_2$" without conditioning context.
  *   **Length:** -1 pt if significantly under 500 words (lacks detail) or over 900 words (lacks concision).
