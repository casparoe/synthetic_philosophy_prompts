  # Session Design: The Bell Protocol

  ## Overview
  **Title:** The Bell Protocol: Certification & Conflict
  **Duration:** 90 Minutes
  **Participants:** 16 First-Year MA Students
  **Facilitator Role:** Silent Registrar (keeping the ledger) & Arbiter of Revelations
  **Philosophical Target:** Conventionalism about Identity (via Sortal Relativity and Material Constitution)

  ## Materials List
  1.  **Case File Packets (3 types):** Distinct envelopes for each of the three bodies (Listing, Diocese, Insurer). Contains their specific Remit, Evidence Photos, and Initial Data.
  2.  **Certificate Forms (16 copies):** A4, formal layout, requiring a signature and a specific checkbox selection.
  3.  **Authority Tokens (48 total):** Poker chips or heavy card counters. 16 per group.
  4.  **The Revelation Envelope:** Sealed, marked "URGENT ASSAY UPDATE."
  5.  **Facilitator Ledger:** A grid with columns for *Group*, *Verdict*, *Criterion Invoked*, *Token Cost*.
  6.  **Whiteboard/Flipchart:** For the final debrief mapping.
  7.  **Timer:** Visible to all.

  ## The Remits (Printable Text)

  **Group A: The Listing Authority (Historic England Analogue)**
  *   **Remit:** You protect the national heritage. Your designation depends on **physical fabric**. If the material is not original, the historic status is compromised. You cannot list "new metal" as "historic."
  *   **Admissible Evidence:** Metallurgical assays, weight records, casting dates.
  *   **Required Output:** A certificate stating whether the Tenor Bell is "Designated Historic Fabric" or "Modern Replacement."
  *   **Budget:** 16 Tokens. Each contradiction with physical evidence costs 2 tokens.

  **Group B: The Diocesan Committee (Church)**
  *   **Remit:** You protect the liturgical life. Your designation depends on **functional continuity and dedication**. If the bell rings in the same frame, bears the same name, and serves the same worship, it is the same bell. Material is secondary to function.
  *   **Admissible Evidence:** Service records, dedication inscriptions, frame continuity, ringing logs.
  *   **Required Output:** A certificate stating whether the Tenor Bell is "The Consecrated Tenor" or "A New Instrument."
  *   **Budget:** 16 Tokens. Each contradiction with functional continuity costs 2 tokens.

  **Group C: The Insurer's Valuers (Commercial)**
  *   **Remit:** You protect financial interest. Your designation depends on **distinct asset identification**. You cannot double-count value. If the metal is split between the Tower Bell and the Handbells, you must identify where the value lies. One object, one number.
  *   **Admissible Evidence:** Valuation schedules, metal market prices, asset registers.
  *   **Required Output:** A certificate identifying the "Insured Historic Asset" (Tenor, Handbells, or Both).
  *   **Budget:** 16 Tokens. Each instance of double-counting costs 4 tokens.

  ## The Certificates (Printable Text)

  **CERTIFICATE OF IDENTITY & STATUS**
  **Case Ref:** TENOR-1888-REC
  **Date:** [Today's Date]

  **We, the undersigned representatives of ________________________, hereby certify that:**

  [ ] **The Tenor Bell** is the continuous historic object.
  [ ] **The Handbell Set** contains the historic identity.
  [ ] **Neither object** retains historic identity; both are new.
  [ ] **Both objects** share divided historic identity.

  **Primary Criterion Invoked:**
  [ ] Material Continuity
  [ ] Functional Continuity
  [ ] Financial/Legal Distinctness

  **Signed:** ________________________
  **Tokens Remaining:** _______

  ## Minute-by-Minute Timeline

  **00:00 – 00:10 | Introduction & Sorting**
  *   Facilitator introduces the case briefly (the fracture, the recast, the conflict).
  *   Sort students into three groups (5, 5, 6). The extra student in Group C acts as "Chief Actuary" to break ties.
  *   Distribute Case Packets, Tokens, and Blank Certificates.
  *   **Rule:** You must sign a certificate by minute 35. You start with 16 tokens. You lose tokens for internal inconsistency or violating your remit.

  **00:10 – 00:35 | Phase 1: Deliberation**
  *   Groups review evidence. They must agree on a verdict.
  *   Facilitator circulates silently, noting arguments on the **Ledger** (e.g., "Group A arguing metal mass," "Group B arguing dedication").
  *   **Constraint:** Groups cannot talk to each other yet.

  **00:35 – 00:40 | The First Signing**
  *   Groups submit signed certificates.
  *   Facilitator collects them but does not read them aloud yet.
  *   Facilitator tallies token costs based on internal consistency (e.g., if Insurer claims "Both" but says "One Object," cost tokens).

  **00:40 – 00:45 | The Revelation**
  *   Facilitator opens the **URGENT ASSAY UPDATE** envelope and reads aloud (or projects):
      *   *"Metallurgical analysis confirms the 1888 recast was not a simple melt. The fracture surface reveals high phosphorus content inconsistent with 18th-century ore. Furthermore, the 60/40 split was volumetric, not mass. By mass, 90% of the original 1888 metal was lost as dross. The new Tenor is 95% new metal. The Handbells were cast from entirely new stock to fund the work; the '40% original metal' claim was an accounting fiction to boost sale value. The only surviving original metal is in the discarded slag heap."*
  *   **Impact:** Material continuity is effectively zero. Functional continuity is unchanged. Financial value of "historic metal" is zero.

  **00:45 – 01:00 | Phase 2: Renegotiation**
  *   Groups are allowed to confer across tables *only* to resolve token deficits.
  *   They may revise their certificates.
  *   **Scarcity Mechanism:** If a group finishes with fewer than 5 tokens, their certificate is "Provisional" (worth half credit). If 0 tokens, "Void" (failure).
  *   **Conflict:** To save tokens, groups must align. But their Remits forbid alignment. (e.g., Listing cannot say "Historic" if metal is gone; Diocese must say "Historic" if function remains).
  *   Facilitator continues logging criteria invoked during arguments.

  **01:00 – 01:05 | The Reading**
  *   Facilitator reads the three final certificates aloud. They will likely contradict (e.g., Listing says "New," Diocese says "Historic," Insurer says "Neither").
  *   Facilitator announces the token counts.

  **01:05 – 01:30 | The Debrief (Philosophical Mapping)**
  *   See detailed sequence below.

  ## The Debrief Sequence

  **1. The Ledger Reveal (5 mins)**
  *   Project the Facilitator Ledger. Show the class the specific phrases they used.
  *   *Column A (Listing):* "Mass," "Alloy," "Original Fabric."
  *   *Column B (Diocese):* "Role," "Name," "Consecration," "Frame."
  *   *Column C (Insurer):* "Asset," "Value," "Distinct Item."
  *   **Point:** You were not arguing about the bell. You were arguing about the *rules for counting* the bell.

  **2. Mapping to Philosophy (15 mins)**
  *   **Material Constitution:** When Listing said, "It's not the bell because the metal is new," they treated the bell as identical to the lump of metal. (Write: *Identity = Constitution*).
  *   **Sortal Relativity:** When Diocese said, "It is the bell because it rings," they treated 'Bell' as a functional sortal, not a material one. The object persists under different conditions depending on the sortal concept used. (Write: *Identity is Sortal-Dependent*).
  *   **Differing Modal Properties:** Ask: "Could the Tenor Bell have been melted down?" Listing says No (destroyed). Diocese says Yes (recast is fine). The same object has different modal properties depending on who is asked. (Write: *Leibniz's Law Violation?*).
  *   **Conventionalism:** When the Insurer said, "We need one number," they imposed a boundary where nature provided none. The revelation showed there is no "fact of the matter" in the metal. The identity is stipulated by our interests (heritage vs. worship vs. money). (Write: *Conventionalism*).

  **3. The Vertigo (5 mins)**
  *   Ask: "Which certificate is true?"
  *   Wait for silence.
  *   Conclude: "None. And all. The conflict isn't in the tower; it's in the criteria. You are conserving the criteria, not just the object."

  ## Candid Account: What Will Go Wrong

  **1. The Pragmatic Collapse (Minute 50)**
  *   **Risk:** Students will realize that if they all agree "It's Complicated," they save tokens. They will collude to write vague certificates that satisfy all remits superficially.
  *   **Steer:** The Remits must have **mandatory checkboxes**. You cannot write "Complicated." You must choose "Historic" or "New." The Facilitator must reject vague wording during Phase 2 strictly.
  *   **Fix:** Add a rule: "Ambiguous certificates cost 5 tokens immediately."

  **2. The Philosophy Leak (Minute 20)**
  *   **Risk:** One student knows philosophy and says, "This is the Ship of Theseus." The vertigo vanishes because it becomes a puzzle to solve rather than a experience to feel.
  *   **Steer:** Pre-brief the room: "Technical terms from outside this room are inadmissible evidence." Treat it as a procedural breach costing tokens.

  **3. The Revelation Ignored (Minute 45)**
  *   **Risk:** Groups ignore the assay report because they've already committed socially to a verdict.
  *   **Steer:** The Token Cost for ignoring the new evidence must be explicit. "If your certificate claims Material Continuity after the Assay, you lose all remaining tokens."

  ## Frank Assessment

  **1. Synchronic Coincidence vs. Diachronic Persistence**
  *   **Verdict:** This activity stages **Sortal Relativity of Identity** primarily, masquerading as Diachronic Persistence.
  *   **Explanation:** The students are deciding what the object *is now* (Synchronic) based on a history of change. They are not watching the change happen (Diachronic). They are classifying the aftermath.
  *   **To get Diachronic Persistence:** You would need a second round where you physically remove tokens (parts) from the "Bell" pile and replace them with "New Metal" tokens over time, asking at each step "Is it still the bell?" This is logistically difficult in 90 minutes. The current design relies on the *report* of change, not the *experience* of change.

  **2. Structural Limitation**
  *   **Feature:** **Four-Dimensionalism (Perdurance).**
  *   **Limitation:** The activity forces a choice: "Is it X or Y?" It structurally cannot reproduce the view that the bell is a spacetime worm composed of temporal parts, where the 1888 stage and the 2024 stage are both parts of the whole without requiring strict identity between them.
  *   **Facilitator Supply:** You must assert this in the debrief. "You were forced to choose 'Same' or 'Different.' A four-dimensionalist says both are true relative to different temporal parts. You will have to supply that intuition; the game forces 3D thinking."

  **3. Confidence Level**
  *   **Confidence:** **85%** that the conflict will surface.
  *   **Reasoning:** The scarcity mechanism (tokens) combined with incompatible remits creates a prisoner's dilemma. They *want* to keep tokens, but their remits *force* contradiction. The only way to keep tokens is to argue fiercely for their specific criterion.
