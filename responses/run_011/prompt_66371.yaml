  - `problem_type` — one of: misrepresents_williams, internal_inconsistency, unsupported_premise, strawman, redundancy, unclear, none
  - `chief_problem` — one sentence naming the single most serious problem in that section
  - `minimum_fix` — the smallest concrete change that would resolve it

  Then give a single JSON object with exactly these fields:

  - `thesis_as_written` (string): the claim the essay currently makes, in one sentence
