  - `worst_unanswered_objection` (string)
  - `dilemma_in_5_is_false` (boolean)
  - `how_to_rescue_5` (string)
  - `recommended_order` (string): the section sequence you would use, e.g. "1,2,3,5,4,6,7"
  - `attribution_checks` (array of objects with keys `claim` (string), `correct` (boolean), `correction` (string)) — covering at least my McDowell hedge and my characterisation of externalism in §2
