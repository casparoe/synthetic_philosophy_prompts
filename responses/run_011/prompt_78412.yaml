answer: |-
  Here is a comparison designed for your reading group notes. It avoids the "money vs. accuracy" shorthand and focuses on the normative structure revealed by your cases.

  ### The Core Distinction
  The Dutch Book Argument (DBA) is a **pragmatic consistency** argument. It argues that your credences are irrational because they lead to *actions* that are self-defeating.
  The Accuracy-Dominance Argument (ADA) is an **alethic consistency** argument. It argues that your credences are irrational because they are *representations* that are unnecessarily distant from the truth.

  The difference is not just the currency (money vs. accuracy points); it is the **locus of the failure**. DBA locates the failure in the interface between mind and world (action). ADA locates the failure inside the mind (representation).

  ---

  ### Case 1: Dev (The Non-Better)
  **Setup:** Dev has incoherent credences ($C(P)=0.6, C(\neg P)=0.6$). Dev has a phobia against betting and will never accept a wager.

  **The Dutch Book Argument on Dev**
  The DBA proceeds in two steps:
  1.  **Mathematical:** If credences sum to $>1$, there exists a set of bets guaranteeing a loss.
  2.  **Bridge Principle:** If you have credence $x$ in $P$, you are disposed to buy/sell a bet on $P$ at price $x$.

  **Verdict:** The DBA **fails to condemn Dev**.
  Because Dev rejects the Bridge Principle (he will not bet), the guaranteed loss never materializes. He is pragmatically safe.
  *   **Stipulation Flag:** The DBA *must* stipulate that rational agents are *willing* to translate credences into betting dispositions. If you treat credences as purely internal states with no necessary link to action, the DBA has no grip.
  *   **Result:** The DBA can only say: "Dev is irrational *conditional on him being a bettor*." It cannot call him irrational *simpliciter*.

  **The Accuracy Argument on Dev**
  The ADA proceeds in two steps:
  1.  **Mathematical:** If credences are incoherent, there exists an alternative coherent set of credences that is strictly more accurate (closer to the truth values) in *every* possible world.
  2.  **Bridge Principle:** Rational agents ought to minimize the inaccuracy of their doxastic states (the Alethic Norm).

  **Verdict:** The ADA **condemns Dev**.
  Dev's phobia is irrelevant. Regardless of what he *does*, his mental state is objectively further from the truth than it needs to be. There is a "better" set of numbers he could hold that would be more accurate whether $P$ is true or false.
  *   **Stipulation Flag:** The ADA *must* stipulate that accuracy is a constitutive norm of belief (i.e., beliefs *aim* at truth).
  *   **Result:** The ADA calls Dev epistemically irrational, independent of his behavioral dispositions.

  **Takeaway for the Group:** The DBA assesses the *instrumental value* of credences (do they guide action well?). The ADA assesses the *intrinsic value* of credences (do they represent the world well?). Dev shows that you can be instrumentally safe but intrinsically flawed.

  ---

  ### Case 2: Rani (The Risk-Averter)
  **Setup:** Rani has coherent credences (Probabilistic). However, she has sharply diminishing marginal utility for money. Her buy/sell prices diverge, allowing a bookie to money-pump her.

  **The Dutch Book Argument on Rani**
  **Verdict:** The DBA **risks a false positive**.
  A naive DBA says: "If you are bookable, your credences are incoherent." Rani is bookable. Therefore, the naive DBA implies her credences are flawed.
  But her credences *are* probabilistic. The vulnerability comes from her *utility function*, not her beliefs.
  *   **Stipulation Flag:** To work correctly, the DBA *must* stipulate **linear utility for money** (or that stakes are vanishingly small).
  *   **Result:** If the DBA ignores utility, it conflates pragmatic rationality (maximizing utility) with epistemic rationality (coherent credences). It condemns Rani for having a risk-averse utility function, mistaking it for a belief error.

  **The Accuracy Argument on Rani**
  **Verdict:** The ADA **exonerates Rani**.
  The ADA looks only at the distance between Rani's credences and the truth. Since her credences are probabilistic, no other credence function accuracy-dominates hers. Her utility function is invisible to the accuracy measure.
  *   **Stipulation Flag:** The ADA *must* stipulate that epistemic value is **utility-invariant**.
  *   **Result:** The ADA correctly identifies that Rani's *beliefs* are fine, even if her *decisions* are exploitable. It isolates the epistemic norm from the pragmatic context.

  **Takeaway for the Group:** The DBA is "contaminated" by pragmatic factors (utility, risk aversion). The ADA is "hygienic"; it isolates the epistemic state from the agent's practical circumstances.

  ---

  ### Technical Question: Non-Additive Measures
  **The Challenge:** Suppose we define the inaccuracy of a whole credence function not as the sum of errors ($\sum I_i$), but as the *maximum* error on any single proposition ($\max I_i$). Does the dominance argument still go through?

  **The Answer:** **No.**
  The Joyce-style dominance theorems rely on the geometry of **Bregman divergences**, which presuppose additivity (or at least specific convexity properties that summing guarantees).
  If you use a Max rule (Minimax), it is possible to construct incoherent credence functions that are *not* accuracy-dominated by any coherent function. An incoherent set might "hedge its bets" such that its worst-case error is lower than the worst-case error of any coherent alternative.

  **What this tells us:**
  This reveals that the ADA is not just "Coherence is good." It is "Coherence is good *relative to an aggregative conception of epistemic value*."
  *   **Stipulation Flag:** The ADA *must* stipulate that epistemic value aggregates across propositions. You cannot simply say "accuracy matters"; you must say "total accuracy matters more than worst-case accuracy."
  *   **Implication:** Much of the work in the ADA is done by the **scoring rule**, not just the coherence requirement. If your group member insists on a Max rule, the argument for Probabilism collapses. This makes the ADA more sensitive to axiological assumptions than the DBA (which only assumes money is valuable).

  ---

  ### The Verdict

  **1. Which is the better argument for Probabilism?**
  **Verdict:** The **Accuracy-Dominance Argument** is superior.
  **Why:** As Dev and Rani show, the DBA conflates epistemic norms with pragmatic constraints.
  *   Dev shows DBA is too weak (it misses irrational agents who don't bet).
  *   Rani shows DBA is too strong (it catches rational agents with non-linear utility).
  The ADA isolates the *epistemic* defect. It explains why Probabilism is a norm of *belief*, not a norm of *betting*.

  **2. Does the answer flip for Conditionalization?**
  **Verdict:** **No, but the gap narrows.**
  You suspected that DBA generalizes more gracefully to updating rules (Dynamic Dutch Book). It is true that the math for a Dynamic Dutch Book (Lewis 1999) is historically more straightforward than the math for Accuracy-Based Conditionalization (Greaves & Wallace 2006).
  *   **The DBA Strength:** It shows that if you update by any rule *other* than Conditionalization, you are *guaranteed* to lose money over time (given certain setups).
  *   **The DBA Weakness:** It suffers the same Dev/Rani problems diachronically. If you refuse to bet tomorrow (Dev), or if your utility changes (Rani), the Dynamic Dutch Book loses its normative force. It proves you are pragmatically vulnerable, not necessarily epistemically flawed.
  *   **The ADA Strength:** It shows that Conditionalization is the unique updating rule that maximizes *expected accuracy* from the perspective of your prior. It keeps the focus on truth.
  *   **The ADA Weakness:** It relies on the agent's *own* prior expectations to justify the update rule. Some argue this is circular (using probabilities to justify the probability update rule).

  **Final Pushback on your Suspicion:**
  While the DBA is *mathematically* easier to generalize to updating, it is not *conceptually* better. If your reading group cares about **epistemic** rationality (what we ought to believe), the ADA remains the gold standard for both Probabilism and Conditionalization. The DBA is better only if you care about **pragmatic** rationality (how we ought to act).

  **Summary for your notes:**
  *   **DBA:** Pragmatic, action-based, sensitive to utility/betting dispositions. Good for showing *consequences* of incoherence.
  *   **ADA:** Alethic, state-based, sensitive to scoring rules/aggregation. Good for showing *nature* of incoherence.
  *   **Winner:** ADA for epistemic norms, because beliefs are not bets.
