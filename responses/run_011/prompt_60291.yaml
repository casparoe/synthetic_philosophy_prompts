      *   Outsiders get a card with only the 2 obvious rules.
      *   Visitors get no card.
      *   *Crucial:* Insiders are told: "If the protocol is broken, the trade is void, and you lose a token." (This creates the *fear* of the norm).
      *   Outsiders are told: "Trade efficiently."
      *   Visitors are told: "Just chat and trade."

      *Wait, this requires me to adjudicate.* I want *them* to adjudicate.
      *Better:* The tokens are physical. To give a token, you must perform the ritual. If you don't, the receiver is instructed (secretly) to reject it.
      *No, that's too mechanical.*
      *Let's go with the "Committee" idea but focused on a specific action.*
      *Actually, the "Fake Custom" needs to be about *behavior*, not just game mechanics.*
      *Let's try: "The Seating Arrangement."* No, too static.
      *Let's try: "The Contribution."*
      *Okay, let's stick to the "Exchange" but make the norm about *how* you offer help.*

      *Final Design Choice:* **The Resource Pool.**
      *   Central pot of tokens.
      *   Groups of 4-5.
      *   Task: Maximize group score.
      *   Mechanism: Propose moves.
      *   The Norm: A specific verbal phrase or gesture required to "validate" a proposal.
      *   The Twist: Only some are told this validation is required. Others think it's optional.
      *   The Pressure: If a proposal isn't validated, the group *cannot* accept it (according to the Insiders).
      *   This creates the "User's Dilemma": I want to help (propose a move), but I don't know the secret handshake. The Insiders feel I am breaking the rules.

      *Let's refine for the specific philosophical points:*
      1.  *Coordination vs. Obligation:* Is the rule there to help us win (coordination) or is it wrong to break it (obligation)?
      2.  *Threshold:* If only 1 person insists on the rule, it's annoying. If 4 insist, it's law.
      3.  *Fake vs. Real:* The rule is arbitrary, but feels real because Insiders enforce it.

      *Activity:* **"The Procedure."**
      *   Groups of 5.
      *   Task: Solve a simple logic puzzle or allocate resources.
      *   Constraint: "Local Procedure" must be followed for decisions to count.
      *   Roles:
          *   *Stewards (2 per group):* Given the "Procedure" (includes the fake rule). Told: "This is essential for validity. If ignored, the group fails."
          *   *Members (2 per group):* Given "Guidelines" (vague, omits fake rule).
          *   *Guests (1 per group):* Given nothing. Just "Join in."
      *   The Fake Rule: "Before accepting a proposal, the group must tap the table once." (Simple, observable, arbitrary).
      *   The Stewards believe this is essential. They will correct Members/Guests.
      *   The Members think it's optional/weird.
      *   The Guests are confused.
      *   *Scoring:* Group gets points for solutions. But Stewards are told *they* lose personal points if the Procedure is violated. This makes them enforce it.

      *Wait, 90 minutes includes tea.* So 45 min activity, 45 min debrief? No, need time for setup.
      *Timeline:*
      *   0-10: Intro & Grouping.
      *   10-15: Secret Briefing (Crucial).
      *   15-45: The Task.
      *   45-55: Tea.
      *   55-90: Debrief.

      *Materials:* Paper, pens, tokens (dried beans or buttons), envelopes for briefs.
      *Debrief:* Needs to draw out the feelings. "Who felt frustrated?" "Who felt righteous?" "Was the rule real?"

      *Addressing the Risks:*
      *   *The Skeptic:* "This is silly." -> Acknowledge it, ask why it feels silly compared to real life.
      *   *The Competitor:* "I'm winning." -> Redirect to the *process*, not the score.
      *   *The Collapse:* "We ignored the rule." -> Good! Discuss why the norm failed to launch.
      *   *The "It wasn't real" objection:* This is the big one. Need to pivot to "But the frustration was real."

      *Addressing the Limitations:*
      *   No long-term consequences.
      *   No outside surveillance.
      *   Need to explicitly mention this in debrief.

  4.  **Drafting the Content:**

      *   *Title:* The Protocol.
      *   *Roles:* Stewards (Insiders), Members (Outsiders), Guests (Visitors).
      *   *The Fake Rule:* "The Acknowledgement." (e.g., Must say 'Agreed' before moving a bean).
      *   *Briefs:* Need to be written clearly.
      *   *Debrief Questions:* Structured to move from experience -> theory.
      *   *Risk Management:* Specific scripts for the facilitator.

  5.  **Refining the "Fake Custom":**
      *   It needs to be subtle enough not to be immediately obvious as a "game rule" but obvious enough to be enforced.
      *   *Idea:* When passing a token, you must slide it, not hand it.
      *   *Better:* When making a suggestion, you must preface it with "For the group."
      *   *Best:* **The "Ratification" Tap.** Before a decision is final, someone must tap the center of the table.
      *   *Why:* It's physical, observable, and easy to miss.
      *   *Steward Instruction:* "Decisions are invalid without the Tap. You lose credit if you accept an un-tapped decision."
      *   *Member Instruction:* "Make decisions efficiently."
      *   *Guest Instruction:* "Help the group."

  6.  **Developing the Debrief:**
      *   Start with the Guests. "How did it feel?" (Confused, excluded).
      *   Move to Members. "Did you notice the Tap?" (Maybe, maybe not). "Did you care?"
      *   Move to Stewards. "Why did you insist?" (Because I was told it mattered).
      *   Connect to User's Story: The Colleague (Steward), The User (Guest/Member).
      *   Introduce Vocabulary: *Constitutive Rules*, *Pluralistic Ignorance*, *Normative Force*.

  7.  **Checking Constraints:**
      *   Stationery cupboard? Yes (paper, pens, envelopes, beans).
      *   90 mins? Yes.
      *   No budget? Yes.
      *   Circle of chairs? Yes, break into small circles within the big circle for the activity, then reform.

  8.  **Final Polish:**
      *   Ensure the tone is supportive but firm on the facilitation.
      *   Make sure the "Risk" section is honest.
      *   Ensure the "Limitations" section addresses the "real life" gap (consequences/repetition).

      *(Self-Correction during drafting)*: I need to make sure the Stewards don't just dominate and ruin the fun. They need to feel *anxious* about the rule, not just powerful. The brief should emphasize *their* loss if the rule is broken, not just the group's failure. This makes them enforce it out of self-preservation/norm compliance, not tyranny.

      *(Refining the "Fake Rule")*: Let's make it about **Token Transfer**.
      Task: Move beans from a central pot to individual piles based on some criteria.
      Rule: To take a bean, you must knock twice on the table.
      Stewards: Told this is mandatory. If someone takes without knocking, the Steward must return the bean or lose a point.
      Members: Told to collect beans.
      Guests: Told to help.
      This creates direct conflict. Steward says "You didn't knock." Member says "It doesn't matter." Guest says "What's happening?"

