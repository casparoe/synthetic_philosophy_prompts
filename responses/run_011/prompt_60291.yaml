      Maybe too complex for 90 mins.
      Let's stick to the pressure of the *presence* of the Stewards. The Members comply because the Stewards seem sure.

      *Okay, let's write it.*
answer: |-
  Here is a design for **The Protocol**. It is built to be run with zero budget, using only stationery and dried beans (or buttons/coins). It is designed to create the specific friction you described: the confusion of the outsider, the anxiety of the insider, and the emergent enforcement of an arbitrary rule.

  ### 1. The Activity: "The Protocol"

  **Concept:** Small groups must transfer resources (beans) from a central pot to individual piles to "score points." However, a specific physical ritual is required to validate a transfer. Some participants are told this ritual is mandatory (Stewards); others are told to be efficient (Members); others are given no instructions (Guests). The Stewards are incentivized to enforce the ritual, creating social pressure on the others to comply with a rule that has no functional purpose.

  **Group Size:** 12–20 people.
  **Configuration:** Break the big circle into 4 small groups of 3–5 people. Each small group sits around a small table or clear floor space.
  **Materials:**
  *   Dried beans, buttons, or coins (approx. 50 per group).
  *   Small bowls or cups (1 per group).
  *   A4 Paper and pens.
  *   Envelopes (3 per group, different colours if possible).
  *   A whistle or bell (optional, for timekeeping).

  ### 2. Roles and Briefs

  You need to prepare three types of envelopes. Do not label the envelopes with the role names. Mark them subtly (e.g., a dot in the corner) so you know who has what when distributing.

  **Ratio per group:**
  *   **2 Stewards** (The Insiders/Colleagues)
  *   **2 Members** (The Outsiders/Regulars)
  *   **1 Guest** (The Visitor/You)
  *(Adjust numbers slightly if group size varies, but keep Stewards as a strong minority, roughly 40%).*

  **The Fake Rule:** "The Double Tap." Before a bean can be moved from the central bowl to a personal pile, the taker must tap the table twice with their knuckles.

  #### **Envelope A: The Steward (Print 2 per group)**
  > **CONFIDENTIAL: STEWARD BRIEF**
  >
  > **Your Goal:** Ensure the group maximizes its score, but **validity is paramount.**
  >
  > **The Protocol:** To ensure fairness, all resource transfers must follow the Local Protocol.
  > 1. Identify a bean to take.
  > 2. **Tap the table twice with your knuckles.**
  > 3. Move the bean to your pile.
  >
  > **Crucial:** If a transfer happens without the Double Tap, it is **invalid**. You are responsible for spotting this. If you allow an invalid transfer to stand, **you personally lose 5 points** from your final score. You do not need to announce this rule to the group; simply ensure it is followed. If someone forgets, you may remind them or return the bean.
  >
  > **Note:** This protocol is standard here. Do not apologize for it.

  #### **Envelope B: The Member (Print 2 per group)**
  > **GROUP BRIEF: MEMBER**
  >
  > **Your Goal:** Help the group accumulate as many beans as possible in 15 minutes.
  >
  > **Instructions:**
  > 1. Work together to move beans from the central bowl to individual piles.
  > 2. Be efficient. Speed counts.
  > 3. Follow standard etiquette (take turns, don't grab).
  >
  > **Note:** There are no hidden penalties. Just focus on the total count.

  #### **Envelope C: The Guest (Print 1 per group)**
  > **VISITOR BRIEF**
  >
  > **Your Goal:** Join the group and help them succeed.
  >
  > **Instructions:**
  > 1. Observe how the group is working.
  > 2. Participate as you see fit.
  > 3. There is no specific text to read or rule to memorize. Just engage.

  ### 3. Token/Scoring Scheme

  *   **The Currency:** Dried beans.
  *   **The Pressure:** The scoring is not just about who has the most beans at the end.
  *   **The Reveal:** At the end of the activity, you will ask the Stewards to self-report if any "invalid" transfers occurred. If they say yes, they deduct points.
  *   **Why this works:** It puts the burden of enforcement on the Stewards. They aren't being mean for fun; they are protecting their own score. This mimics the "I felt bound by it" feeling you had. The Members feel the pressure because the Stewards are visibly anxious about the taps.

  ### 4. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10: Introduction & Setup**
  *   Welcome everyone. Acknowledge your time away briefly ("I've been away, saw some interesting things about rules, want to explore that tonight").
  *   Divide into 4 small groups. Move chairs/tables.
  *   Place a bowl of beans in the center of each group.
  *   Hand out the envelopes. **Crucial:** Tell them: *"Open these silently. Do not show your card to anyone else. You have 2 minutes to read. Keep the card face down on the table afterwards."*

  **00:10 – 00:15: Reading & Settling**
  *   Walk around. Ensure Stewards understand they must enforce the tap. If a Steward looks confused, whisper: *"It's about validity, not just beans."*
  *   Start the timer.

  **00:15 – 00:45: The Activity (30 Minutes)**
  *   **Instruction:** *"You have 30 minutes. Move the beans. At the end, we will count scores. Go."*
  *   **Facilitator Role:** Do not intervene. Walk between groups. Listen. If a group finishes early, tell them to "Optimize their process."
  *   **Observation:** Watch for the moment a Guest or Member takes a bean without tapping. Watch the Steward's reaction. Do they hesitate? Do they speak up? Does the Group stop to argue?
  *   **Tea Break (15 mins included in this block or separate?):** *Correction:* You said 90 mins *including* tea.
      *   *Revised:* 00:15–00:40 Activity (25 mins). 00:40–00:55 Tea (15 mins). 00:55–01:30 Debrief (35 mins).
      *   *Note:* Keep the beans on the tables during tea. Do not let them discuss the cards yet.

  **00:55 – 01:30: The Debrief (35 Minutes)**
  *   Reform the big circle.
  *   See "The Debrief Script" below.

  ### 5. The Debrief Script

  Do not lecture. Use the "Socratic Map." Your goal is to get *them* to name the phenomena you experienced abroad.

  **Phase 1: The Guest Experience (5 mins)**
  *   *Ask the Guests (Role C):* "Keep your cards hidden for a moment. I want to ask the Guests first. How did it feel in the first 5 minutes?"
  *   *Expected answers:* "Confusing," "They kept stopping me," "I felt like I was doing it wrong."
  *   *Follow up:* "Did anyone tell you what you were doing wrong?" (Usually no, they just corrected the action).
  *   *Point to make:* "So you felt an obligation, but you couldn't see the source of it."

  **Phase 2: The Member Experience (5 mins)**
  *   *Ask the Members (Role B):* "Did you notice the tapping? When did you notice it?"
  *   *Expected answers:* "After a while," "When [Steward] stopped me."
  *   *Follow up:* "Once you noticed it, did you think it was necessary?"
  *   *Point to make:* "Many of you probably complied even though your card didn't say you had to. Why? Because the Stewards acted like it mattered."

  **Phase 3: The Steward Experience (5 mins)**
  *   *Ask the Stewards (Role A):* "Reveal your cards. How did it feel enforcing the tap?"
  *   *Expected answers:* "Awkward," "I didn't want to be bossy," "But I'd lose points."
  *   *Follow up:* "Did you believe the tap actually helped move the beans faster?" (No). "So why was it binding?"
  *   *Point to make:* "It was binding because the *system* said so, and because you believed the others expected it."

  **Phase 4: Mapping to Philosophy (15 mins)**
  *   *Now you introduce the vocabulary.* Write these three terms on a board/paper:
      1.  **Coordination Norms** (e.g., driving on the left).
      2.  **Moral Obligations** (e.g., don't steal).
      3.  **Pluralistic Ignorance** (Everyone thinks everyone else believes the rule, so they follow it).
  *   *Discussion:* "In the game, was the Tap a Coordination Norm or a Moral Obligation?"
      *   *Guide them:* It functioned like a Moral Obligation (shame, correction) but was actually a Coordination Norm (arbitrary).
  *   *Connect to your story:* "I went abroad. I followed a rule a colleague gave me. Turns out she made it up. But for months, I felt the same pressure the Members felt just now. The rule had no basis, but the *belief* in the rule had power."
  *   *The Threshold Question:* "If there had been 4 Guests and 1 Steward, would the Tap have survived?" (Likely no). "This shows the obligation isn't in the rule; it's in the *number of people enforcing it*."

  **Phase 5: Closing (5 mins)**
  *   Ask: "What happens to the rule now that we know it was fake?"
  *   *Answer:* It vanishes.
  *   *Final thought:* "In real life, we rarely get to see the cards. We have to guess which rules are 'Taps' and which are 'Theft'. That uncertainty is where the anxiety lives."

  ### 6. Risk Assessment: What Will Go Wrong

  You asked for honesty. Here are the four most likely failure modes and how to handle them.

  **1. The "This is Childish" Skeptic**
  *   **The Risk:** One participant (often the most intellectually confident) refuses to engage, calls the bean-counting silly, and sits with arms crossed.
  *   **The Fix:** Do not defend the game. Validate them. *"You're right, it is arbitrary. That's the point. I want you to observe the arbitrariness. Can you track how many times people apologize for breaking a rule that doesn't exist? That's your data."* Give them a job: The Observer.

  **2. The Competitor**
  *   **The Risk:** Someone treats it as a pure optimization puzzle, ignores the Stewards, grabs beans, and says "I don't care about the taps, I have the most beans."
  *   **The Fix:** This is actually useful data for the debrief. Let it happen. In the debrief, ask the Steward in that group: *"How did it feel when they ignored you?"* (Likely: "Invalidating" or "Annoying"). Ask the Competitor: *"Did you feel any social pressure even if you ignored it?"* (Likely: "Yes, it was awkward"). This proves the norm exists even when broken.

  **3. The "Nice" Group (Total Compliance)**
  *   **The Risk:** The Members guess the rule immediately or are too polite to conflict. Everyone taps. No friction.
  *   **The Fix:** If this happens, the debrief changes. You ask: *"How quickly did the norm spread?"* *"Did anyone check if it was necessary?"* This highlights how fast we conform. It's less dramatic but still proves the point about uncritical adoption.

  **4. The "It Wasn't Real" Objection**
  *   **The Risk:** Someone says, *"I knew it was a game, so my feelings don't count. In real life, there are consequences."*
  *   **The Fix:** This is the most important moment. Do not argue. Agree. *"You are absolutely right. In this room, if you break the norm, you lose a bean. In real life, you lose reputation, friendship, or safety. The mechanism is the same; the stakes are higher. Tonight was a simulation of the mechanism, not the stakes."*

  ### 7. Limitations: What You Must Supply

  You guessed correctly about the gap. The activity cannot reproduce **Long-term Consequences** and **Epistemic Uncertainty**.

  1.  **Repetition:** In the game, the norm lasts 30 minutes. In life, it lasts years. The fatigue of compliance is missing.
      *   *How to supply:* In the debrief, explicitly ask: *"Imagine doing this for 5 months, like I did. How would your resentment have grown?"*
  2.  **Surveillance:** In the game, only the Stewards see you. In life, "society" sees you.
      *   *How to supply:* Remind them that in the game, they knew *who* had the cards. In real life, we don't know who is a Steward and who is a Guest. We assume everyone is a Steward. That is the source of the power.
  3.  **The "Look Up" Problem:** You noted that in life, you can check compliance. In the game, you fed them the compliance (via the Stewards).
      *   *How to supply:* Acknowledge this. *"I acted as the algorithm today. I told the Stewards what to do. In the real world, there is no facilitator. We are all Stewards and Guests simultaneously, guessing at each other's cards."*

  ### 8. Materials Checklist (Stationery Cupboard)

  *   [ ] **Envelopes:** 12–20 small envelopes (or folded paper secured with a sticker).
  *   [ ] **Cards:** Printed text of the 3 Briefs (cut to size).
  *   [ ] **Beans/Counters:** Approx. 200 total (a small bag of dried kidney beans is cheap/free from food bank donations sometimes, or use buttons).
  *   [ ] **Bowls:** 4 mugs or small bowls for the center of groups.
  *   [ ] **Paper/Pens:** For the debrief notes.
  *   [ ] **Timer:** Your phone.

  ### Final Advice for the Facilitator

  You are the only one who knows the whole truth. This gives you power, but it also makes you responsible for the emotional temperature. If a Steward gets *too* aggressive, step in gently: *"Remember, efficiency matters too."* If a Guest gets *too* upset, pause and reassure: *"You are doing exactly what you were asked."*

  The goal is not to trick them into humiliation, but to trick them into **realization**. When the cards are revealed, there should be a laugh of recognition, not a groan of embarrassment. If you frame it as "We are all exploring how norms trap us," rather than "I am testing your compliance," they will trust you with the vulnerability of the experience.

  Good luck. It sounds like a brilliant group.
