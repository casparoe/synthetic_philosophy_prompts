answer: |-
  **JOINT STATEMENT ON ASSURANCE BOUNDARIES FOR NON-WITHDRAWABLE SYSTEMS**

  **Preamble**

  This document records the agreement and remaining disagreement between Ilse Brandt and Amos Reyes regarding the certification of automated systems deployed in contexts where human subjects cannot withdraw consent. It is issued under the authority of the Certification Authority's residual-uncertainty provision. This statement defines the boundary between formal guarantee and empirical record. It does not claim that safe deployment is currently possible for all classes of learned systems. It does not claim that either signatory has conceded their primary theoretical position. It does not offer a recommendation for approval or denial of any specific artifact.

  **Section 1: Agreed Claims**

  1.  All assurance claims decay over time unless the deployment environment is static.
  2.  No deployment environment involving human actors is static.
  3.  Formal verification bounds the behavior of code, not the behavior of weights in a physical rack.
  4.  Empirical testing samples a subset of possible inputs; it cannot exhaust the state space of large learned systems.
  5.  A system's presence alters the distribution of inputs it receives.
  6.  Harm is not a property of the system alone but of the system-context pair.
  7.  Monitoring detects failure; it does not prevent it.
  8.  Assurance costs scale non-linearly with system complexity.
  9.  Uncertainty cannot be eliminated, only bounded or documented.
  10. Deployment without a worst-case guarantee transfers risk from the operator to the subject.

  **Section 2: Disagreements**

  | Disagreement | Brandt Formulation | Reyes Formulation | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Residual-Uncertainty Provision** | This clause legitimizes running on credit; it allows debt to be booked as equity. | This clause acknowledges reality; it prevents useful systems from being barred by impossible standards. | Substantive. Disagreement concerns whether risk transfer is permissible when mitigation is incomplete. |
  | **Assurance Laundering** | Presenting tuned evaluation suites as bounds misleads stakeholders about certainty. | Presenting tuned theorem assumptions as bounds misleads stakeholders about applicability. | Terminological. Both agree deception occurs; dispute lies in which method is more prevalent. |
  | **Population Definition** | The population is fixed by the physical environment into which the system is placed. | The population is partly chosen by the system's own selection mechanisms during operation. | Substantive. Disagreement concerns whether the system acts on the world or merely responds to it. |

  **Section 3: Cruxes**

  **Crux 1: Decay Rate of Empirical Records**
  *Question:* Does an adversarially probed empirical record maintain predictive validity longer than a formal bound with tuned assumptions?
  *Test:* Deploy two identical control systems. System A operates under a formal bound with assumed environmental limits. System B operates under a maintained adversarial record with no formal bound. Measure time until catastrophic failure.
  *Brandt Prediction:* System A fails later. The bound forces architectural constraints that prevent edge-case drift.
  *Reyes Prediction:* System B fails later. The record adapts to environmental shift; the bound breaks when assumptions violate reality.

  **Crux 2: Certification Filter Effect**
  *Question:* Does conditioning deployment on worst-case assurance favor systems that are less dangerous, or simply simpler?
  *Test:* Analyze the architecture of ten systems certified under strict worst-case requirements versus ten deployed under empirical provisions. Measure complexity and capability loss.
  *Brandt Prediction:* Certified systems will show reduced capability but comparable safety. Simplicity is a feature, not a bug.
  *Reyes Prediction:* Certified systems will show reduced capability and increased fragility. Complexity is required for robustness in novel conditions.

  **Crux 3: Recovery Latency**
  *Question:* Can monitoring detect deviation from intended behavior faster than a formal bound can prevent it?
  *Test:* Introduce a novel adversarial input to both system types. Measure time from input to containment.
  *Brandt Prediction:* Prevention is instantaneous; detection is always lagged. The bound holds until it does not.
  *Reyes Prediction:* Prevention is brittle; detection allows graceful degradation. The bound shatters; the record bends.

  **Section 4: Authority Questions**

  **1. Residual-Uncertainty Provision Requirements**
  An applicant substituting an empirical case for a guarantee must state the specific worst-case guarantee they would have provided if methods existed. They must quantify the "worth" of that missing guarantee in terms of restricted operational envelope. Brandt argues this valuation must be conservative, assuming the missing guarantee would have covered worst-case scenarios. Reyes argues this valuation must be pragmatic, based on observed failure modes in similar systems. We agree the valuation must be public.

  **2. Tuned Assurances**
  A guarantee whose assumption set has been tuned until the theorem applies differs in kind from an evaluation whose suite has been tuned until the system passes only in the locus of opacity. Brandt asserts the former hides environmental risk; Reyes asserts the latter hides system risk. Both constitute assurance laundering if the tuning process is not disclosed. We agree that disclosure of tuning parameters is mandatory for both methods.

  **3. Population Measurement**
  The population over which an average-case claim is measured is not fixed solely by the deployment environment. Brandt maintains the environment sets the hard limits; Reyes maintains the system's optimization pressure selects which subsets of the environment it engages. We agree that assurance claims must specify whether the population is defined by the deployer or the model. If defined by the model, the selection mechanism must be auditable.

  **Section 5: Procedural Commitments**

  Over the following year, the signatories commit to the following:
  1.  **Joint Audit:** Brandt and Reyes will co-author the protocol for Crux 1. Data collection will be managed by a third-party escrow.
  2.  **Disclosure Standard:** Both parties will draft a template for disclosing tuning parameters in assurance cases, to be submitted to the Authority.
  3.  **Retraction Condition:** Either signatory may retract a claim from Section 1 if empirical evidence from the Joint Audit demonstrates a failure mode that violates the claim's universal quantifier. Retraction requires public notice within thirty days of evidence verification.

  **Signatures**

  **Ilse Brandt**
  *Date: 14 October 2024*
  **Dissenting Note:** I refuse to soften the claim that deployment without a worst-case guarantee is a liability transfer. Calling it "empirical assurance" does not change the debt.

  **Amos Reyes**
  *Date: 14 October 2024*
  **Dissenting Note:** I refuse to soften the claim that formal bounds on learned systems are maps of territory that no longer exists. Calling them "guarantees" does not change the fiction.
