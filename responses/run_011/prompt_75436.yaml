  ### Prediction
  She will say **YES**, the AI assistant counts as part of her mind.

  The weight of her precedents leans heavily toward functional reliance in the cognitive domain. The Alzheimer's notebook is the strongest anchor: if an external store is trusted, accessible, and constitutive of memory, it's mental. The AI assistant fits this profile (she can't reconstruct the meeting without it) even better than the notebook, as it actively processes rather than just stores. The Smartwatch exception is the only outlier, but that hinges on *emotion*, whereas the AI is doing *cognitive* work (summarizing, drafting).

  ### Candidate Rules
  Here are the two rules that best fit her track record but diverge on the AI case:

  **1. The "Cognitive Functionalism" Rule**
  *   **Definition:** The mind extends to any external tool that performs a *cognitive* function (memory, calculation, reasoning) which the agent relies on automatically and trusts. *Affective* states (emotions, stress) are excluded from extension, regardless of reliance.
  *   **Fit:** Explains the Notebook, Phone, Calculator, and Cochlear (perception/cognition) as YES. Explains the Smartwatch as NO (emotion is not cognition). Explains the Library as NO (not reliably trusted/accessible).
  *   **Verdict on AI:** **YES.** The AI is performing cognitive labor (summarizing, drafting) that she relies on.

  **2. The "Content Origin" Rule**
  *   **Definition:** The mind extends to external tools only if the *content* stored or processed originated from the agent's own prior mental activity. Tools that *generate* novel content via external algorithms do not count, even if relied upon.
  *   **Fit:** Explains the Notebook and Phone Notes as YES (she wrote the notes). Explains the Library as NO (other people's books). Explains the Calculator as YES (math is universal, but she initiates the query; also, 12x12 is NO because she already possesses the content internally, making the tool redundant). Explains the Smartwatch as NO (the stress signal originates in the body, the watch merely reads it; it adds no *her*-generated content).
  *   **Verdict on AI:** **NO.** The email drafts and meeting summaries are generated by the AI's algorithm, not retrieved from her prior mental states. She edits them, but the source is external.

  ### Where They Come Apart
  These rules come apart on the AI assistant case because the AI is **functionally cognitive** (satisfying Rule 1) but **generatively alien** (violating Rule 2).

  *   Under **Cognitive Functionalism**, the source of the processing doesn't matter, only the role it plays. Since the AI acts as a memory/reasoning scaffold she cannot function without, it is part of the mind.
  *   Under **Content Origin**, the *provenance* of the thought matters. Since the AI is drafting the emails (creating content she didn't previously hold), it is a collaborator or tool, not a part of her mind. The Alzheimer's notebook works under this rule because Otto wrote the notes *before* the dementia; the AI writes the notes *now*.

  ### The Settling Case
  To determine which rule she is actually running, you need a case that isolates **Function** from **Origin** within the **Cognitive Domain**. The Smartwatch case muddies the water by introducing emotion; the AI case muddies it by introducing generative algorithms. You need a case that is purely cognitive, purely relied upon, but clearly lacks "her" origin.

  **The Case: The "False Memory" Implant**
  Propose this scenario to her:
  > "Imagine you have a neural implant that functions exactly like a biological hippocampus. It stores and retrieves memories perfectly. However, due to a glitch, half the memories it retrieves are *false*—they are fabricated scenarios that never happened to you, but you cannot tell the difference. You rely on these memories to make life decisions, plan your week, and understand your identity, just like you rely on the AI for emails. When the implant is turned off, you have total amnesia."

  **Why this settles it:**
  *   **If she says YES (It is part of her mind):** She is on **Cognitive Functionalism**. She believes that if the *role* is cognitive and relied upon, it constitutes the mind, even if the *content* is factually wrong or externally generated. This confirms her AI verdict will be YES.
  *   **If she says NO (It is not part of her mind):** She is on **Content Origin** (or a "Truth/Ownership" variant). She believes that for something to be *her* mind, the content must be causally rooted in *her* actual history/experience. This suggests her AI verdict might actually be NO (or that she views the AI as merely a tool she owns, not a part of her cognition).

  **Why this is better than testing emotion:**
  Testing emotion (e.g., a mood-inducing implant) would only tell you why she rejected the Smartwatch. It wouldn't tell you how she weighs *generative algorithms* vs. *storage* in the cognitive realm. The False Memory Implant forces her to choose between "Does it *act* like memory?" (Function) vs. "Is it *my* past?" (Origin). That is the exact tension lurking in her AI assistant verdict.
