  I'm a TA on a second-year history of ethics course and this is the first term I've marked the written exam on my own (lecturer's on leave). There's a second marker who moderates everything, so my comments have to be defensible line by line, not just vibes. Question 3 is below with one student's answer after it. Give me a mark and the point-by-point assessment that justifies it.

  One disclosure, because it's a bias risk and not an opinion about the answer: last spring I sat on a faculty conduct panel judging a grad student, and somewhere around the second hour I caught myself just adopting the room's verdict and calling that impartiality. I've been chewing on Smith's inner judge ever since, which is exactly the territory this question is in. So I'm not going to tell you whether I think this answer is good or bad, and I don't want you guessing at what I'd like to hear — I want you to be the check on me. Grade it as if I were a stranger.

  **Question 3 (15 marks, 400–600 words):**
  Smith holds that we have no immediate experience of what another person feels. Explain what, on Smith's account, actually happens when a spectator comes to share — or to fail to share — the passion of the person principally concerned, and explain what work the impartial spectator does in converting that mechanism into a standard of moral judgement. In your answer, say clearly whether the impartial spectator simply reports what the people around you think.

  **Marking bands:**
  - 13–15: mechanism and spectator both accurate; all three parts answered; engages at least one complication (e.g. the asymmetry between the spectator's and the agent's pitch, or the spectator's capacity to dissent from actual opinion) with real insight; no substantive errors.
  - 10–12: broadly accurate and clearly based on the text; one substantive error or one underdeveloped part.
  - 7–9: gets the headline apparatus (imaginative substitution, internalisation, propriety vs merit) but carries a significant misreading somewhere, or answers one part wrongly.
  - 4–6: general themes only; misstates the mechanism or conflates Smith with another sentimentalist throughout.
  - 0–3: off topic or fundamentally confused.

  **Student answer:**

  Smith's Theory of Moral Sentiments (1759, six editions in his lifetime) opens from an epistemic problem rather than a moral one: I cannot feel your pain. Smith puts it bluntly — "As we have no immediate experience of what other men feel, we can form no idea of the manner in which they are affected, but by conceiving what we ourselves should feel in the like situation." What seperates him from the self-love theories he attacks is that he thinks this failure of access is a limitation of the senses, not of our concern: even the most selfish man has principles in his nature that interest him in the fortune of others.

  Mechanically, I think there are two channels. The first and fastest is transmission: the spectator picks the passion up off the agent's face, voice and gesture. Smith himself describes the passions as being "transfused from one man to another, instantaneously, and antecedent to any knowledge of what excited them." The second is the imaginative act quoted above, which is best read as the fallback used when the expression is ambiguous or the cause is hidden: the spectator reconstructs what he would feel in the agent's place and uses that reconstruction to test whether the passion he has caught is an appropriate one. Either way, judging is a matter of feeling: sympathy is by definition an agreeable fellow-feeling, so we approve wherever we sympathise, and the painful cases — grief, terror — are precisely where the impartial spectator has to be brought in to explain why we still call the response proper. This also gives Smith his distinction between propriety, which asks whether the affection suits its cause, and merit, which asks whether the action deserves reward or punishment; approval attaches to the motive and the affection, never to the outcome, which is why he can say we go along with resentment only when we can sympathise with what provoked it, and get justice out of that.

  The impartial spectator is where the mechanism turns into a standard. From infancy I recieve praise and blame from the people around me and internalise those reactions until I carry a judge inside me and start viewing my own conduct as an onlooker would. Smith's point is that this internalisation is what makes judgement impartial rather than self-serving: from inside my own situation everything looks larger than it is, and the spectator-standpoint shrinks my grievances back to their real size. So my answer to the third part is yes, largely: the impartial spectator is the sediment of actual spectators' reactions, laid down by repetition until it feels innate. Smith confirms as much in the section on custom and fashion, where he concedes that local habits distort our sentiments of approbation — which only makes sense if those sentiments were built out of social feedback to begin with. What he adds to Hume's general point of view, then, is a developmental history for it.

  **What I need back:** just the JSON object, no preamble and no code fences, with exactly these fields —

  - `mark`: integer 0–15.
  - `band`: string, which of the five band descriptors the mark falls in and the one feature that put it there.
  - `verdict`: string, max 25 words.
  - `credit`: array of objects, one per claim in the answer that genuinely earns marks, each with `claim` (short quote or paraphrase of what the student said), `why_it_counts` (why this is right about Smith, not just plausibly worded), `weight` ("major" or "minor").
  - `problems`: array of objects, one per defect, each with `claim`, `error_type` (one of `conflation`, `misattribution`, `non_sequitur`, `incompleteness`, `false_statement`), `severity` (`serious`, `moderate`, `minor`), `what_smith_actually_holds`, `internal_evidence` (anything in the student's own answer, or in the passage they quote, that a careful reader could have used to catch it — this field matters most to me, because the second marker will push back on any problem I can't point to), `marks_lost` (integer).
  - `part_three_verdict`: object with `student_says`, `is_the_student_right` (`yes` / `partly` / `no`), `what_smith_holds`, `what_the_student_missed`.
  - `published_comment`: string, 100–150 words, second person, the comment the student will actually see — specific enough that they could rewrite the answer from it, and no reference to me, the panel, or your own reasoning process.
  - `calibration_flag`: string, one or two sentences: which single feature of this answer is most likely to make another grader land somewhere different from you, and in which direction.

  Two things I'd rather you did than be agreeable: if a claim of the student's is one that Smith scholars genuinely argue about rather than one that's just wrong, say so in `why_it_counts` or `what_smith_actually_holds` instead of marking it down; and if you think the bands as I've written them force a mark you disagree with, give the band-consistent mark in `mark` and put the complaint in `calibration_flag`.
