  2. **Arthāpatti (8/10)** — Nyāya attempts to fold postulation into inference (anumāna), yet the Mīmāṃsā reply holds that the immediate grasp of inconsistency driving the cognition lacks the formal universal premise required for strict inference.
  3. **Pratyakṣa (6/10)** — While conceptualists argue all perception is laden with universals, Nyāya posits a non-conceptual (nirvikalpaka) stage to secure direct contact with particulars, though this scores lower here as both sides concede perception’s validity.
  4. **Anumāna (5/10)** — Empiricists reduce inference to memory of regularity, but Nyāya insists on vyāpti (necessary connection) as a distinct object of knowledge, yet this scores lower as it is uncontested common ground in this debate.
  5. **Upamāna (2/10)** — The reductionist case treats comparison as mere memory plus recognition, and while Nyāya argues for a distinct cognition of similarity, the epistemological work here is easily absorbed by śabda and anumāna without significant loss.
