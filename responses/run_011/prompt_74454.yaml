answer: |-
  Your historian friend is right that the spine is tidy, but they are wrong that this is a weakness. In a novel about the suppression of truth, tidiness is the lie your characters are fighting. The official story is always tidy; the ground is always messy. Your thesis isn't a summary of history; it's the mechanism of the cover-up.

  Here is the argument for keeping the spine exactly as it is, without thinning it.

  ### 1. The Strong Version Survives the German Objection
  The awkward material you cited—West Germany's 1950s rehabilitation of Nazis, Japan's immunity deals, the South's 1877 Compromise—does not break the thesis. It proves it.

  Your thesis states: *Looking happens only when the people who did the thing lose the keys.*
  It does *not* state: *Looking happens immediately after the war ends.*

  In West Germany, the keys did **not** change hands in 1945. Denazification was largely theater by 1948. By the mid-1950s, the judiciary, the civil service, and the police were heavily repopulated by former party members. The "Economic Miracle" was built on the labor and expertise of the old regime. Consequently, the state did **not** look. The 1950s were silent.

  The "turn" in the 1960s (the Auschwitz Trials, the student movement) was not the state finally deciding to be brave. It was a generational coup. The grandchildren didn't wait for the keys to be given; they picked the locks. They forced the archives open *despite* the people holding them. The delay in reckoning corresponds exactly to the duration of the old guard's hold on the bureaucracy. The thesis holds: The silence lasted exactly as long as the perpetrators held the filing cabinets.

  In Japan, the Occupation Authority (SCAP) made a calculated decision to retain the Emperor and the bureaucracy to ensure stability against communism. They left the keys in the ignition. The result was a state that could not officially acknowledge the Rape of Nanking or Unit 731 because the institutional memory required to validate those crimes was the same memory protecting the post-war leadership. The silence is structural, not accidental.

  In the American South, the window of reckoning (Reconstruction) coincides perfectly with the window of lost keys (Federal occupation). The moment the keys were returned (1877), the reckoning was un-produced. Monuments went up, textbooks were rewritten, and the archive was sealed.

  The mechanism is not "repentance." It is **archival control**. The people who did the thing know where the bodies are buried because they buried them. If they keep the surveyor's maps, no one else can find the plot.

  ### 2. The Cost of Thinning the Spine
  You asked what gets lost if you thin the claim from "the people who did the thing" to "the people who decide what's true."

  If you thin it, you lose the **blood**.

  *   **Narrative Voice:** If the spine is about *institutional continuity*, your grandchildren are fighting bureaucrats. They are digging through zoning laws and school board minutes. The antagonist is "The System." This is a sociological novel.
  *   **Narrative Voice (Strong Version):** If the spine is about *perpetrator continuity*, your grandchildren are fighting their grandparents. They are digging through attics and diaries. The antagonist is "The Family." This is a tragedy.

  If you thin the claim, the tension becomes intellectual: *How does the state construct memory?*
  If you keep the strong claim, the tension becomes moral: *How does a grandfather sleep at night knowing he holds the key to his own crime?*

  The "awkward material" (like German judges in the 50s) is actually more dramatic in the Strong Version. It means the grandfather isn't just a passive beneficiary of a system; he is an active participant in the silence. He isn't just a civil servant; he is a man who signed a death warrant in 1943 and a school budget in 1953. The continuity of the *person* is what makes the silence personal.

  Do not thin it. The "tidiness" your friend objects to is the sharp edge of the knife. If you blur the line between "perpetrator" and "administrator," you give your characters a place to hide. You want them to have nowhere to hide.

  ### 3. The Mechanism: Why It Survives
  The reason this claim survives the awkward history is that it identifies the specific tool of suppression: **Classification.**

  It is not enough to hide the evidence; you must control the *categories* by which evidence is judged.
  *   **Germany:** In the 50s, the legal category of "excess" was used to prosecute only the most egregious outliers, while "following orders" protected the machinery. The judges who defined "excess" were the same men who wrote the orders.
  *   **Mississippi:** The category of "States' Rights" or "Local Custom" was used to reclassify federal civil rights mandates as external aggression. The sheriffs who enforced Jim Crow were the same sheriffs who wrote the reports on "unrest."
  *   **Turkey:** The category of "National Security" or "Founding Principles" made the Armenian event legally unspeakable. The republicans were the unionists in new uniforms.

  The mechanism is the **monopoly on definition**. As long as the perpetrators hold the keys, they get to define what counts as a "crime," what counts as "war," and what counts as "truth." Reckoning only becomes possible when a new group seizes the power to redefine the categories.

  ### 4. The Fourth Case: Diagnostic or Decorative?
  You asked if this claim predicts anything or if it is just an elegant arrangement of stories you already liked.

  **The Test Case: Spain.**
  I am not suggesting you write about Spain. I am suggesting you apply your spine to the Spanish Transition (1975–1978) to see if it holds water.

  **The Prediction:**
  If your thesis is diagnostic, it predicts that Spain would **fail** to achieve a state-sponsored reckoning regarding the Civil War and Francoism, specifically because the Transition was a negotiated pact where the Francoist apparatus (judiciary, military, police) retained their keys in exchange for democracy.

  **The Reality:**
  This is exactly what happened. The *Pacto del Olvido* (Pact of Forgetting) was not a cultural accident; it was a structural necessity of the Transition. The 1977 Amnesty Law protected both the Republicans and the Francoists, but in practice, it froze the Francoist narrative because the Francoists still held the courts. Exhumations of mass graves were legally blocked for decades not by "culture," but by judges appointed under the old regime interpreting laws written to protect them. Reckoning has only begun recently (the *Historical Memory Law* of 2007 and subsequent efforts) as that generation of key-holders has literally died off and been replaced.

  **The Verdict:**
  Your claim is **diagnostic**.

  It is not just an elegant arrangement. It predicts the *conditions* under which truth becomes possible. It correctly identifies that moral courage (brave chancellors, schooling) is insufficient without structural dispossession of the perpetrators.

  In your novel, this means your grandchildren cannot simply "find" the truth. They cannot just dig hard enough. They must confront the fact that the truth is being actively guarded by the people who love them. The "tidy" spine is the trap. The mess is the digging.

  Keep the spine. It holds the weight.
