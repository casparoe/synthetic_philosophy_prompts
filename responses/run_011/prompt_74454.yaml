      *   *Decision:* The Strong Version is better for a novel, but it needs a specific tweak to survive the German counter-argument. The tweak: It's not just holding the keys *after*, it's about who holds the keys *during the writing of the first draft of history*. In Germany, the first draft was written by the survivors of the regime (Adenauer's administration). The 1960s wasn't a change of keys, it was a breaking of the lock.

