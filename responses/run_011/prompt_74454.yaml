      Okay, I will choose **South Africa**. Why? Because it is the common counter-argument. "What about the TRC?" If my thesis holds, the TRC happened *because* the ANC took the keys. If the National Party had kept the police and courts during the transition, there would be no TRC. This confirms the mechanism.
