      *   *Japan:* The Emperor is the Master Key. Keeping him kept the lock.
      *   *Mississippi:* 1877 is the key handover. The Compromise gave the keys back to the Confederates.
      *   *The Mechanism:* It's not just power; it's *archival power*. The power to classify.
      *   *Thinning:* If you thin it, you lose the *guilt*. You lose the specific tension of the grandchild asking, "Did you do this?" and the grandparent saying, "I can't answer that because I file the answers."
      *   *Recommendation:* Keep the Strong Version. It creates better conflict. The "awkwardness" is the friction of the plot.

  6.  **The Fourth Case (Diagnostic Test):**
