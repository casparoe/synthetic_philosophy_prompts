      *   **Task:** Analyze the 2019 prorogation case through the lens of Negative Liberty (Non-interference), Positive Liberty (Self-government), and Republican Liberty (Non-domination).
      *   **Specific Constraints:**
          *   Treat case names/constitutional details as given (don't invent facts, flag missing details if crucial).
          *   **Step 1: Fix the Cast.** Identify Agent, Interfered-with, and Interference (noting MPs weren't individually blocked, but the institution was; Queen's role as convention-bound).
          *   **Step 2: Theory Verdicts.**
