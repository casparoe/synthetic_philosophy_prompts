  *(Refining the Republican verdict)*: The user asks if it's a legal enactment of non-domination OR a proportionality inquiry. The Court said the *standard* of review is whether it frustrates functions. This looks like proportionality. But the *reasoning* is that the prerogative is not unlimited. If it's unlimited, it's arbitrary. By limiting it, they remove the arbitrariness. So it *creates* non-domination where there was potential domination. I need to articulate that nuance.

  *(Refining the Capability Analogy)*: The colleague says "capability left unrevoked." The user says "principal is disputed." In security, the principal is the root user. In constitution, the principal is "The People" or "Parliament." The Court decided who the principal was (Parliament > PM). That's the key difference. In code, you don't argue about who owns the server during the incident response. Here, that *was* the incident.

