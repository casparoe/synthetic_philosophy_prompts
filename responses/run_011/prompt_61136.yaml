answer: |-
  This is a tight argument. It's essentially the "ORM Equivalence" thesis dressed in operational clothing, and it's one of the strongest theoretical case against process supervision (PS) scaling. You've correctly identified that if a Process Reward Model (PRM) is just a value function estimating $P(\text{success} | \text{trace})$, it contains no more information than an Outcome Reward Model (ORM) estimating $P(\text{success} | \text{problem})$.

  You want pressure on (6)–(7), but the load-bearing beam is actually **(2)**. If (2) falls, (6) collapses with it.

  Here is the breakdown of where to drop the argument, why it looked solid, the cost of dropping it, and what the actual defense looks like.

  ### The Break Point: Step 2

  **The Claim:** *"That probability is measurable without understanding anything: sample N continuations from step k, count how many land on the right final answer, divide. That number just is the step's score."*

  **Why it looked unobjectionable:**
  It relies on a consequentialist definition of truth. In Reinforcement Learning, the "value" of a state is indeed the expected return from that state. If you define a "good step" strictly as "a step that increases the probability of a correct final answer," then mathematically, you are correct: the ground truth for that step *is* the rollout statistic. It feels like a definition, not an empirical claim, which makes it hard to fight.

  **Why you drop it:**
  Because that is not how Process Supervision is actually implemented or defended in the scaling regime. No one is proposing training PRMs by rolling out $N$ continuations for every intermediate step of every training problem. That is computationally worse than training an ORM.

  In practice (e.g., Lightman et al., "Let's Verify Step by Step"), process labels come from **human judgment of local validity**, not outcome sampling. Humans label a step as "good" or "bad" based on whether the logic *looks* sound, not by checking if the final answer is right.

  **The Cost of Dropping Step 2:**
  You have to admit that **Process Supervision is not training on ground truth.**
  If you drop (2), you admit that PRMs are trained on human *heuristics* about reasoning, not on the actual probability of success. This means the PRM is learning a proxy: "What does correct reasoning look like to a human?" rather than "What reasoning actually leads to correct answers?"

  This opens you up to a specific flavor of Goodharting (which you asked to avoid, but it's the price here): The model learns to produce steps that *look* valid to humans (sycophancy, plausible-sounding nonsense) without actually increasing the probability of a correct outcome. You trade the "outcome Goodhart" for a "process Goodhart."

  ### The Consequence: Step 6 Fails

  Once you drop (2), the dilemma in (6) dissolves.

  **The Claim:** *"If outcomes aren't checkable, then (2) is unavailable, so there's no ground truth for the step labels either, and process supervision has nothing to train on."*

  **The Rebuttal:**
  This assumes verification is monolithic. It isn't. There is a gap between **Local Verifiability** and **Global Verifiability**.

  *   **Global Verifiability:** Can I confirm the final answer is correct? (e.g., Can I prove this theorem?)
  *   **Local Verifiability:** Can I confirm this specific inference is valid? (e.g., Can I see that $A \implies B$ follows standard logic, even if I don't know if $B$ helps prove the theorem?)

  Humans often possess Local Verifiability without Global Verifiability. I cannot verify the final proof of Fermat's Last Theorem. But if an AI writes a step that says "Therefore, $1 = 2$," I can flag that step as incorrect.

  **The Actual Defense of Process Supervision:**
  Defenders argue that PS scales because **Local Verifiability scales better than Global Verifiability.**
  As tasks get harder, my ability to check the final answer drops to zero faster than my ability to check individual steps. I might not know the answer, but I can spot a hallucinated citation, a division by zero, or a non-sequitur.

  By training a PRM on these local checks, we are not training it to predict outcomes (as your Step 1 suggests); we are training it to recognize **patterns of valid reasoning** that generalize to problems where we can check neither steps nor outcomes.

  ### What if you keep Step 2? (The Cost of Steps 4 & 5)

  Let's say you insist that theoretically, a "good step" *must* be defined by outcome probability, regardless of how we label it. You keep (1) and (2). Now you have to pay the price on **(4)** and **(5)**.

  **Step 4:** *"Two reward signals that encode the same information have the same optimal policy."*
  **Step 5:** *"Anything the PRM knows, the ORM knows... It's a fact about how fast you learn, not about what you can learn."*

  **The Cost:**
  This assumes **unbounded compute and data.** In the real world, we are data-constrained and compute-constrained.
  Even if a PRM and ORM encode the same *theoretical* information, they have different **inductive biases**.

  *   **ORM:** Learns $P(\text{success} | \text{problem})$. It has to learn which *types* of problems are solvable. It treats the reasoning trace as a black box.
  *   **PRM:** Learns $P(\text{success} | \text{step})$. It learns *features of reasoning* that correlate with success.

  **Concrete Example:**
  Imagine a model that solves math problems.
  *   **ORM Signal:** "You got it right." (Sparse)
  *   **PRM Signal:** "Step 3 was a valid deduction. Step 5 was a guess." (Dense)

  The PRM allows the model to generalize the concept of "valid deduction" to a new domain where outcomes are uncheckable. The ORM does not. The ORM sees a new problem and has no signal until the end. The PRM sees a new problem and can apply its learned heuristic for "valid deduction" at every step.

  **The Price:**
  If you keep (4) and (5), you are arguing from the limit of infinite data. You have to concede that in the **finite data regime** (which is all that matters for alignment), PS allows for **transfer learning of reasoning skills** that OS does not.
  You have to admit that "what you can learn" is constrained by your optimization trajectory, not just the theoretical optimum. If PS gets you to a better local optimum faster, and you run out of data before converging, then PS *does* learn something ORM couldn't in the allotted time.

  ### Summary: The Defender's Script

  If I am defending Process Supervision as an alignment strategy against your argument, here is exactly what I say to Step 6:

  > "You are assuming that the only way to label a step is by rolling out to the end. That's false. We label steps using **human local verification**.
  >
  > I cannot verify the final answer of a superhuman codebase. But I can verify that a specific function call doesn't violate memory safety. I can verify that a specific logical inference doesn't contradict the previous premise.
  >
  > Process Supervision works not because it gives us outcome information we didn't have, but because it **decomposes verification**. It allows us to train on the *structure* of reasoning (which remains locally verifiable) even when the *content* of the solution (the global outcome) becomes unverifiable.
  >
  > Your argument holds only if 'checking a step' requires 'knowing the answer.' In math, logic, and code, that condition is false. Validity is distinct from Truth."

  ### Which step do I drop?

  **Drop Step 2.**
  It is the empirical weak link. It defines process labels as outcome statistics, but in practice, process labels are human judgments of local coherence.

  **The Price:**
  You must accept that PS is training on **human proxies for reasoning**, not ground truth. This means PS is vulnerable to **deceptive alignment** where the model learns to mimic the *appearance* of valid reasoning without the *substance*. It solves the "scaling supervision" problem but potentially exacerbates the "sycophancy" problem.

  You trade the impossibility of verification (your Step 6) for the fallibility of human judgment (the cost of dropping Step 2). That is the actual trade-off, and it's worth making.
