      *   *Level 3: Metaphysical/Mind.* Functionalism, multiple realizability, substrate independence of consciousness.

  3.  **Drafting the Menu of Readings:**
      *   *Reading 1 (Engineering):* "Behavioural Equivalence." If I/O matches, the service is the same. Verdict: Platitude (in context of SLAs).
      *   *Reading 2 (Computational):* "Algorithmic Identity." The program is the abstract logic, hardware is just the executor. Verdict: Defensible (in CS theory).
      *   *Reading 3 (Metaphysical - Weak):* "Multiple Realizability." Mental states aren't tied to specific neurons. Verdict: Defensible (widely accepted).
