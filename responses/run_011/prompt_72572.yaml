          *   Provide a verdict for each (platitude, defensible, doubtful, false).
          *   Address two specific inferences: (1) arbitrary substrate suffices for mentality, (2) speed/timing doesn't matter.
          *   Address the gap between negative claims (multiple realizability) and positive claims (functionalism).
          *   Address the distinction between *implementing* and *simulating* (hypervisor vs. weather model).
          *   Explain arguments/counter-examples fully (no name-dropping without explanation).
