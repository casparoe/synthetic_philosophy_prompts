answer: |-
  Here is the audit you asked for.

  ### The Fake Problems
  You are right to suspect **1 vs. 2** and **8 vs. 1**.
  *   **1 vs. 2 (Record vs. Memory as Evidence):** These are compatible. Principle 1 governs *ontology* (what happened to the bridge). Principle 2 governs *sociology* (what happened to the town). You can follow the archive for the fire while following the memory for the relief money. This is not a conflict; it is a scope definition.
  *   **8 vs. 1 (No Paratext vs. Record Priority):** These are aligned. An author's note would undermine the "unmarked register" by telling the reader how to solve the tension you are asking them to feel. Keeping it out protects the aesthetic of Principle 1.
  *   **4 vs. 5 (Epistemic Freedom vs. No Falsehoods):** This is philosophical friction, not operational. Principle 4 is your legal defense; Principle 5 is your moral code. You can have a right to do something and choose not to. This tension is healthy; it keeps you honest.

  ### The Real Conflicts (Ranked by Damage)

  **1. Principle 1 vs. Principle 6 (The Adjudication vs. The Promise)**
  *   **The Conflict:** Principle 1 says "go with the record." The record suggests Vane is innocent. Principle 6 says "leave it unsettled." If you go with the record, you have settled it. You have exonerated Vane. That closes the loop for the memorial, the town, and the family, violating the specific request to keep the story "going."
  *   **Damage:** Catastrophic. This breaks your contract with the living subjects (6) and collapses the thematic tension of the book (1). It turns a novel about memory into a procedural about exoneration.
  *   **Cost to Fix:** You must surrender the idea that the novel's job is to *correct* the town's memory. You have to accept that the novel's job is to *house* the contradiction.
  *   **What you give up:** The satisfaction of being the one who "found the truth." You become the curator of the conflict, not the resolver of it.

  **2. Principle 3 vs. Principle 5 (Unmarked Register vs. No Confident Falsehoods)**
  *   **The Conflict:** In a flat, unmarked third-person, statements read as facts. If you write "Ezra Vane lit the match" (the town's memory) without marking it as belief, the text asserts it as fact. Since you are confident that is false (9 in 10), you violate Principle 5. If you write "Ezra Vane was at the quarry" (the record), you violate Principle 6 (settling it).
  *   **Damage:** High. This threatens your ethical baseline. If the reader finishes the book believing Vane burned the bridge because the narrative voice never questioned it, you have let a confident falsehood stand as fact.
  *   **Cost to Fix:** You must ensure the text never asserts the *event*, only the *testimony*. But in an unmarked register, testimony looks like event.
  *   **What you give up:** The purity of the "unmarked" voice. To save Principle 5, you may need to allow the context to subtly mark the memory as memory, which bleeds into violating Principle 3.

  **3. Principle 3 vs. Principle 6 (Unmarked Register vs. The Promise)**
  *   **The Conflict:** The Unmarked Register (3) relies on the reader synthesizing the two tracks into a single experience. The Vane Promise (6) requires the reader to *not* synthesize them. You are asking the reader to feel a seam (3) but not pick a side (6). Human cognition prefers resolution. Most readers will pick the version that offers better narrative closure (usually the myth).
  *   **Damage:** Medium. This risks the reader experience. If they resolve it themselves, they violate the promise for you.
  *   **Cost to Fix:** You have to write in a way that actively resists resolution, which can feel frustrating or artificial.
  *   **What you give up:** Narrative flow. Ambiguity requires friction; friction slows reading.

  ### The One Change That Buys the Most Peace

  **Abandon Principle 1.**

  Change it from: *"Where the record and the town's memory disagree, the novel goes with the record."*
  To: *"Where the record and the town's memory disagree, the novel holds them in equal weight."*

  **Why this works:**
  1.  **It saves Principle 6:** By refusing to prioritize the record, you keep the verdict unsettled. You keep your word to the Vanes.
  2.  **It mitigates Principle 5:** If you are not asserting the record as the *winner*, you are not asserting the memory as the *loser*. You are asserting that *both exist*. You are no longer letting a falsehood stand as *the* fact; you are letting it stand as *a* fact of the town's history.
  3.  **It preserves Principle 3:** You can still write both tracks in the same flat voice. "The bridge burned. Ezra Vane lit the match. The quarry book shows Vane nineteen miles upriver." None are marked. None are privileged. The seam remains the reader's to feel.
  4.  **It costs the Project:** You lose the moral superiority of the archive. You are no longer the outsider correcting the town. You become the mirror showing the town its own fracture. This is actually a stronger book. The "project" shifts from *correction* to *confrontation*.

  ### The Single Sentence Front Matter

  > *"The town has two histories, this is both of them."*

  **Do not use it.**

  It is a hiding place. It functions as an author's note disguised as an epigraph. It tells the reader how to do the work you have asked the text to do. If the Unmarked Register (3) is the reason the book exists, you cannot hand the reader a key before they enter the room. It signals that you do not trust your own execution. It weakens the risk. If you make the change to Principle 1 above, the text itself will demonstrate that there are two histories. Let the reader write the sentence for you in their head when they finish.
