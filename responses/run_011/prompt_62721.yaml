  ### Part 4: Logical Space Analysis

  The following table maps the five core dimensions (derived from the 8 questions) to show which combinations are occupied by the leaves above, and which are empty.

  | Dimension 1: Asymmetry | Dimension 2: Repugnance | Dimension 3: Critical Level | Dimension 4: Suffering Priority | Dimension 5: Variable Value | Occupied By | Diagnosis of Empty Cells |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | No | Yes (Accept Z) | No | No | No | **Total Util** | |
  | No | No (Prefer A) | No | No | No | *Empty* | **Unattractive-but-coherent:** Rejects Repugnance but has no mechanism (like Critical Level or Variable Value) to explain why. |
  | No | No (Prefer A) | Yes | No | No | **Critical-Level** | |
  | No | No (Prefer A) | No | No | Yes | **Variable Value** | |
  | No | No (Prefer A) | Implicit | No | No | **Average Util** | |
  | Yes | No (Prefer A) | Yes | No | No | **Asymmetry View** | |
  | Yes/No | No (Prefer A) | No | Yes | No | **Suffering-Focused** | |
  | No | Yes (Accept Z) | Yes | No | No | *Empty* | **Incoherent:** You cannot accept the Repugnant Conclusion while insisting on a Positive Critical Level (Z-lives are below critical level). |
  | No | No (Prefer A) | No | No | No | *Empty* | **Merely Unexplored:** A view that rejects Repugnance solely on transitivity grounds without changing value structure. |
  | **Any** | **No (Prefer A)** | **Any** | **Any** | **Any** | **UNNAMED** | **Unattractive-but-coherent:** Accepts the Sadistic Conclusion (Case 8) to avoid Repugnance. Defended by no one, but logically possible. |

  **Indistinguishable Leaves:**
  *   **Total Utilitarianism vs. Variable Value (in finite cases):** In small-scale cases (like Q1-Q7), Total and Variable Value views often yield identical prescriptions. They only diverge in the limit (infinite populations) or at scales larger than Case 3 (Long Dusk). This handout cannot separate them definitively without asking about mathematical limits, which violates the "concrete case" constraint.
  *   **Average vs. Critical-Level:** In many finite scenarios, Average Utilitarianism mimics a Critical-Level view where the critical level is set at the current average. Without asking about changing population sizes dynamically (Case 4 helps, but isn't definitive), these two can overlap.

  **The "Awkward Commitment" Note for Each Leaf:**
  1.  **Total Utilitarian:** "You must admit that a world of quadrillions of people with lives barely worth living is better than a world of billions with magnificent lives."
  2.  **Average Utilitarian:** "You must admit that adding a very happy person is morally wrong if they are slightly less happy than the current average."
  3.  **Critical-Level:** "You must defend a specific number (the critical level) that seems arbitrary and varies depending on how you frame the population."
  4.  **Variable Value:** "You must explain why the moral value of a happy life depends on how many other people are already alive."
  5.  **Asymmetry View:** "You must explain why we have a duty to avoid creating miserable people but no duty to create happy people, despite the symmetry of their experiences."
  6.  **Suffering-Focused:** "You must accept that preventing a minor headache for a vast number of people could outweigh saving one person from death, if the headache aggregation is large enough." (Or conversely, that no amount of pleasure outweighs torture).
  7.  **UNNAMED:** "You must accept that it is better to create people who suffer slightly than to create people who are happy, simply to keep the population count down."

  ***

  ### Part 5: Instructor's Note on Independence

  I have checked the eight questions for double-barreling.
  *   **Q1 (Asymmetry)** is independent of **Q7 (Suffering Weight)** because Q1 asks about *creation* (non-identity), while Q7 asks about *intervention* on existing states.
  *   **Q3 (Repugnance)** and **Q5 (Variable Value)** are linked but distinct: one can reject the Repugnant Conclusion (Q3) via Average Utilitarianism without accepting Variable Value (Q5).
  *   **Q2 (Critical Level)** and **Q4 (Dilution/Average)** are the most likely to conflate. I have phrased Q2 to focus on the *absolute* level of a single life, and Q4 to focus on the *relative* impact on a group, to ensure they measure different commitments.

  If a student answers inconsistently (e.g., accepts Repugnance in Q3 but rejects it in Q8), flag them for the "UNNAMED" leaf or mark them as holding an unstable cluster. This instability is the pedagogical hook for week five.
