answer: |-
  ### Session Plan: Access, Phenomenality, and the Global Workspace

  **Time:** 75 Minutes
  **Goal:** Decouple "Global Broadcast/Access" from "Phenomenal Experience" to properly situate Block's distinction and evaluate GWT.
  **Constraint:** Do not define Access/Phenomenal until the conflation is broken.

  ---

  ### I. Logical Dependencies (Order of Operations)

  1.  **Elicit the Conflation:** Establish that students currently equate *Global Broadcast* (GWT) with *Consciousness* (Period).
  2.  **Break the Link (The Wedge):** Demonstrate a case where information is globally available for use (Access) but lacks subjective feel (Phenomenality). **This must happen before Block's definitions are introduced.** If you define them first, students will map both onto their existing "Broadcast = Conscious" schema.
  3.  **Introduce Block's Distinction:** Now that the conceptual space is open, label the two sides (A-Consciousness vs. P-Consciousness).
  4.  **Situate GWT:** Place GWT explicitly as a theory of Access, leaving Phenomenality as an open question.
  5.  **Apply to Neuroethics:** Re-evaluate the "covert command-following" patient using the new distinction.

  ---

  ### II. The Carrying Case

  **Selected Case:** **Subliminal Error Correction (Masked Priming with Motor Adjustment).**
  *Specifically: A paradigm where a masked stimulus (unseen) triggers a conflict, the system detects the conflict, slows response time, and corrects the motor output, all without the subject reporting awareness of the stimulus.*

  **What it must CONTAIN:**
  *   **Functional Availability:** The information from the stimulus must be shown to influence high-level cognitive systems (conflict monitoring, motor planning). This satisfies the students' criterion for "Access" (it is used by the system).
  *   **Behavioral Complexity:** It cannot be a simple reflex (like a knee jerk). It must involve decision-level adjustment (e.g., slowing down a button press because of subliminal conflict).
  *   **Negative Report:** The subject must reliably report *no experience* of the stimulus (chance-level discrimination).

  **What it must LACK:**
  *   **Retrospective Uncertainty:** It cannot be a case where the student argues, "Maybe they saw it but forgot" (the fatal flaw of Sperling/Iconic Memory). The masking must be tight enough to preclude conscious perception.
  *   **Definitional Controversy:** It cannot be a case where the *nature* of the feeling is debated (the fatal flaw of Pain Asymbolia, where students argue "If they don't mind the pain, it's not pain").
  *   **Science-Fiction Distance:** It cannot be a hypothetical robot or homunculi-headed population (the fatal flaw of the "Philosophical Zombie" or "China Brain," which upper-division cognitivists dismiss as intuition pumps).

  **Why the Usual Candidates Fail in This Room:**
  *   **Sperling/Iconic Memory:** Your students will argue that the unreported letters *were* conscious, just fleeting. They conflate *availability for report* with *experience*. This case reinforces their bias rather than breaking it.
  *   **Unfelt Pain (Asymbolia):** Your neuroethics students will treat pain as a natural kind. They will argue that if the nociception is broadcast, the pain is felt, regardless of affective reaction. It drags the session into medical semantics.
  *   **Population/Robot:** Your students are empirical cognitivists. They will reject the "Zombie" intuition as dualist baggage. You need a human brain doing human things without the "light on."

  **Why Error Correction Works:**
  It mirrors the neuroethics problem at a micro-scale. If a brain can process "Conflict," broadcast it to motor control, and adjust behavior *without* feeling the conflict, then "Command Following" (macro-scale adjustment) does not logically guarantee "Feeling" (macro-scale experience).

  ---

  ### III. Session Timeline & Misconception Interception

  #### 0:00 – 0:15: The Trap (Eliciting the Conflation)
  *   **Activity:** Briefly sketch Global Workspace Theory (GWT). Information comes in $\rightarrow$ Ignition/Broadcast $\rightarrow$ Report/Action.
  *   **Question:** "If a state is broadcast to the global workspace, is it conscious?"
  *   **Expected Response:** "Yes. That's what consciousness *is*."
  *   **Interception Point 1 (The Reportability Fallacy):**
      *   *Student Claim:* "If it's broadcast, you can report it. If you can report it, you're conscious of it."
      *   *Instructor Move:* Do not correct them yet. Write "Broadcast = Report = Conscious" on the board. Acknowledge this is the standard working hypothesis in their neuroethics rotation.
      *   *Goal:* Make the conflation explicit so it can be targeted.

  #### 0:15 – 0:35: The Wedge (Breaking the Link)
  *   **Activity:** Present the **Subliminal Error Correction** case. Show data: Stimulus is masked (Report = 0), but Reaction Time slows and Accuracy adjusts (Access/Use = 1).
  *   **Question:** "The motor system received the broadcast. The conflict monitor received the broadcast. The subject reports nothing. Where did the consciousness go?"
  *   **Interception Point 2 (The 'Fringe' Defense):**
      *   *Student Claim:* "They must have felt a *urge* or a *hunch*. That's consciousness."
      *   *Instructor Move:* Intercept immediately. "Grant the data: forced-choice discrimination is at chance. If there was a hunch, they could bet on it. There is *use* without *feel*."
      *   *Goal:* Force them to admit that *Functional Availability* (Access) can come apart from *Subjective Feel* (Phenomenality).
  *   **Transition:** "We need names for these two things that just came apart."

  #### 0:35 – 0:50: Block's Distinction & GWT
  *   **Activity:** Define **Access Consciousness (A)**: Availability for reasoning, report, control. Define **Phenomenal Consciousness (P)**: What it is like to be in the state.
  *   **Placement:** Place GWT firmly as a theory of **A-Consciousness**.
  *   **Interception Point 3 (The 'Hard Problem' Dodge):**
      *   *Student Claim:* "If you explain Access fully, you've explained Phenomenality. P is just A from the inside."
      *   *Instructor Move:* "That is a substantive philosophical claim (Illusionism/Functionalism), not a definition. Block's point is that GWT *as currently formulated* explains the broadcasting mechanism, not why broadcasting feels like anything. We are analyzing the theory's scope, not solving metaphysics today."
      *   *Goal:* Prevent the session from dissolving into a debate on physicalism. Keep focus on the *distinction*.

  #### 0:50 – 1:05: The Neuroethics Application
  *   **Activity:** Return to the "Covert Command-Following" patient (e.g., Owen's fMRI tennis task).
  *   **Re-framing:** Previously, they saw: *Command Follow $\rightarrow$ Broadcast $\rightarrow$ Conscious.*
  *   **New Model:** *Command Follow $\rightarrow$ Broadcast (Access).* **Phenomenality?**
  *   **Discussion:** If GWT explains Access, and the patient shows GWT signatures, we know they have Access. Do we know they have P?
  *   **Interception Point 4 (The Ethical Shortcut):**
      *   *Student Claim:* "For ethics, it doesn't matter. If they follow commands, we must treat them as conscious."
      *   *Instructor Move:* "That is a prudent *policy*, but it is not a *metaphysical* fact. If you conflate the two, you cannot even formulate the risk of 'Smart Zombies' (patients who process commands without suffering). To assess the risk, you must keep the concepts distinct."
      *   *Goal:* Validate their ethical instinct while preserving the conceptual gap required for the seminar.

  #### 1:05 – 1:15: Assessment & Close
  *   **Activity:** Distribute/Project the Closing Question. Silent writing (3 mins). Brief share-out.
  *   **Wrap:** Reiterate that GWT is a powerful theory of Access, but Block's challenge remains: Access $\neq$ Phenomenality.

  ---

  ### IV. What to Decline (And Announce It)

  **The Topic:** **The "Hard Problem" Solution.**
  **The Announcement:** "I am explicitly declining to argue whether Phenomenal Consciousness *actually* exists separate from Access, or whether GWT *could* be extended to solve the Hard Problem. Those are metaphysical debates for a philosophy of mind seminar. Today, we are doing conceptual hygiene: ensuring we do not use 'Access' data to prove 'Phenomenal' conclusions without an additional bridge principle. We are analyzing the *gap*, not filling it."

  **Why:** Your students will want to argue for Functionalism (Access exhausts Phenomenality) or Panpsychism. This will consume the hour. By declaring this out of bounds, you keep the focus on Block's distinction as an analytical tool for their cognitive science/neuroethics work.

  ---

  ### V. The Closing Question

  **Do not ask:** "Define Access and Phenomenal Consciousness." (Tests memory).
  **Do not ask:** "Does GWT explain consciousness?" (Too vague).

  **Ask this:**
  > "A patient in a disorder of consciousness exhibits neural signatures of Global Ignition (GWT) and successfully modulates behavior to follow a command.
  >
  > **Identify one specific piece of evidence that would confirm they possess Access Consciousness but leave their Phenomenal Consciousness an open question.**
  >
  > *Explain why that evidence fails to settle the Phenomenal claim.*"

  **Grading Rubric (Mental Check):**
  *   **Memorized:** "Access is report, Phenomenal is feeling." (Fails the "evidence" part).
  *   **Grasped:** "Evidence of information integration for task performance (e.g., correct fMRI pattern) confirms Access. However, without a first-person report or behavioral indicator of *subjective valence* (e.g., avoidance of pain), we cannot confirm Phenomenality, because the system could be processing the command via unconscious broadcast mechanisms (like the error correction case)."
  *   **Failed:** "If they follow commands, they are phenomenal." (Misses the point of the session).
