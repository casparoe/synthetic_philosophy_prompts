          *   *Unfelt Pain (Asymbolia):** Students think "If they don't care, they don't feel it," or "If they say 'ouch', they feel it."
          *   *Homunculi/Population:* Too abstract, feels like a zombie intuition pump they reject.
      *   *The Winner:* **Blindsight vs. Covert Command Following (The Neuroethics Hook).**
          *   *Wait, refinement:* Blindsight is usually Phenomenality *without* Access (no report, but forced choice). The students are obsessed with Command Following (Access).
          *   *Better Case:* **Anesthesia Awareness / Locked-in vs. Vegetative.**
          *   *Best Case for *this* specific conceptual gap:* **The "Philosophical Patient" (Hypothetical but grounded).** A patient who exhibits neural signatures of Global Broadcast (P3b, ignition) and behavioral command following, *but* where we have independent reason to doubt the integration of qualitative feel.
          *   *Actually, let's go deeper:* The prompt asks for *one* carrying case that does the work. The best case to break "Broadcast = Conscious" is **Subliminal Priming / Masking that looks like Access.**
          *   *No, the Neuroethics angle is too strong to ignore.* Let's use **The "Smart" Vegetative Patient (Owen et al. fMRI studies)** but twist it.
