      *   **Context:** Upper-division cognitive science seminar, one 75-minute session.
      *   **Topic:** Ned Block's Access Consciousness (A-consciousness) vs. Phenomenal Consciousness (P-consciousness), specifically in relation to Global Workspace Theory (GWT).
      *   **Student Profile:** Can reproduce labels but don't grasp the *conceptual gap*. They conflate broadcast/access with phenomenality (reportability = experience). Half are on a neuroethics rotation (focused on disorders of consciousness, covert command-following). They assume positive command-following proves "what it is like."
      *   **Instructor Goal:** Break the conflation *before* stating the distinction. Use the neuroethics interest rather than suppress it. Reject standard examples (iconic memory, unfelt pain, etc.) as insufficient for *this* group.
