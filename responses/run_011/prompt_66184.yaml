  2.  **Deconstruct the Core Problem:**
      *   The students think: $Broadcast \rightarrow Access \rightarrow Consciousness$.
      *   Block wants: $Access \neq Phenomenality$.
      *   The Neuroethics Hook: If a patient follows commands (Access), do they feel pain (Phenomenality)? The students say "Yes." The philosophical problem is "Maybe not."
      *   The Challenge: How to make the gap visible without getting bogged down in zombie arguments or obscure psychophysics that they dismiss as "just reportability."

  3.  **Determine the Sequence (Dependencies):**
      *   *Step 1: Disarm the Definition.* If I start with Block's definitions, they will map them onto their existing schema (Access = Reportable, Phenomenal = Reportable). I need to break the link between Global Broadcast and "What It's Like" *first*.
      *   *Step 2: The Carrying Case.* I need an example where Access is present but Phenomenality is dubious (or vice versa), but it *must* resonate with the neuroethics crowd. Standard examples (Sperling) fail because they think partial report is just limited access, not lack of experience. Unfelt pain fails because they think pain is definitionally phenomenal.
      *   *Step 3: GWT's Claim.* Once the gap is open, place GWT. Is GWT a theory of Access or Phenomenality? (Block says Access).
      *   *Step 4: Neuroethics Application.* Return to the patients. If GWT explains Access, does solving the GWT puzzle solve the ethical puzzle?
      *   *Step 5: Assessment.* The closing question.

  4.  **Develop the "Carrying Case":**
      *   *Requirement:* Must show Access without Phenomenality (or the doubt thereof) in a way that isn't dismissed as "just lack of report."
      *   *Standard Candidates & Why They Fail:*
