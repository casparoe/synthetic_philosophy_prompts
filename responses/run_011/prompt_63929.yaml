  # The Standing Arrangement

  The inspector left before the pass closed, his boot prints already filling with snow as he descended the trail. He had taped the charter to the wall beside the bunk where I sleep, the paper stiff with cold. He asked for a single line in the log beneath his signature: a standing arrangement for the season. Lamp on or off. Whistle played or silent. Four combinations possible. He said the office considered the appended clause unobjectionable. He said we should agree.

  We did not agree.

  The first night, I turned the lamp off. It was my right. The charter stated that the keeper of the log held sole authority over the illumination. I lay in the dark, pen hovering over the book, waiting for the sound. Vance had the whistle. The charter gave him sole authority over the music after lights-out. He played. The notes drifted through the cabin, thin and bright against the wind outside. It was the arrangement I ranked first: dark and music. I could lie still and let the sound fill the valley without the lamp reminding me of the columns still to fill.

  Vance stopped halfway through the second hour. He sat up in his bunk, the springs creaking.

  "It's not right," he said into the dark.

  "You have authority," I said. "Play if you wish."

  "Not when you're trying to work. I can hear you breathing. You're holding the pen."

  "I'm resting."

  "You're judging." He put the whistle in the box. "I'm not playing in the dark if you're awake. It's unforgivable."

  He exercised his authority. The hut went silent. The arrangement shifted to lamp off, whistle silent. I lay there with the log open on my chest. Too dark to write. Too still to enjoy. A wasted night. I ranked it third. Vance ranked it first. He slept. I watched the faint glow of the embers in the stove die out.

  In the morning, I wrote the date. I left the arrangement line blank.

  The second night, I turned the lamp on. I had to work. The snow gauge data would not record itself. With the light on, the silence was proper. A working night. Light enough to write, quiet enough to think. I ranked it second. Vance ranked it third. He lay with his arm over his eyes, the light cutting through his eyelids.

  "Turn it off, Elias."

  "I have the log."

  "I have the night."

  "You have the whistle," I said. "Use it."

  He didn't. He respected the silence. But the light cost him his sleep. I could see him shifting, the resentment building in the small room. We were two men in a box, measuring the wind and the snow, unable to measure the distance between the bunks.

  On the third night, Vance took the whistle out. The lamp was on. I was writing. He began to play.

  The charter said he could. He ranked lamp on and whistle playing as his second choice. He would play only to a waking companion; the light was the sign that I was up and, in effect, willing. To him, it was a gift given and received.

  To me, it was the worst of both. The light pinned me to the log while the music made the log impossible. The numbers swam. The melody demanded attention I could not give. I ranked it fourth. I put the pen down.

  "This doesn't work," I said.

  "You're awake," Vance said. He lowered the whistle. "You're looking at me."

  "I'm trying to write."

  "Then write."

  "I can't."

  We sat in the glare of the lamp, the music hanging in the air. We both hated it. I hated the distraction; he hated the resistance. It was the only arrangement we both ranked lower than another. I preferred the dark and silence to this. He preferred the dark and silence to this.

  Vance looked at the charter on the wall. He read the inspector's appended clause aloud. His voice was flat. *"Where both residents would rather have one arrangement than another, the arrangement both prefer is to be preferred. Neither man is to be held in a state they agree is worse."*

  "We agree this is worse," he said.

  "Yes."

  "Then we move."

  "To what?"

  "Dark and silent. We both prefer it to this."

  It was the only time the second clause touched the winter. It was legitimate. We were both mired in a state we agreed was inferior. The charter demanded we leave it. Vance put the whistle away. I reached for the switch.

  The lamp went off. The hut returned to the dark and the silence. We were back to the second night's arrangement. I ranked it third. Vance ranked it first. It was not a compromise; it was a retreat.

  "Try a vote," I said the next morning. "Majority rules."

  Vance shook his head. "Charter says no vote between the two of us may overrule sole authority. You own the light. I own the sound. A vote steals from us both."

  "A rota," I suggested. "Nights alternate."

  "Charter says what I decide stands. What you decide stands. If I decide to play on your light night, you can't stop me. If you decide to light on my silent night, I can't stop you. A rota requires us to surrender authority. We asked for this."

  We had asked for it. Before the snows came, we had signed the papers. We wanted control over our own domains. We wanted the assurance that no vote could strip us of our rights. We had not anticipated that our domains overlapped in the air of the room.

  That night, I turned the lamp off again. I wanted to see if the silence would hold. It did. Vance slept. I stared at the ceiling.

  The next night, I turned the lamp on. I had to write. Vance lay still. The light burned.

  The next night, Vance played. The lamp was on. The music filled the room. I put the pen down. We looked at each other. We both knew what the charter required. We moved back to the dark and the silence.

  It became a rhythm. The lamp on. The whistle playing. The mutual agreement that it was unbearable. The clause invoked. The return to dark and silent. The lamp on again. The whistle playing again.

  We tried to break it. I offered to surrender my authority over the lamp. "You decide both," I said.

  "No," Vance said. "Then I'm a tyrant. And you'll hate me. And I'll hate myself for playing in the dark."

  "You decide both," he offered.

  "No. Then I'm a prisoner. And you'll hate me for the light."

  We wrote letters to the inspector, but the pass was closed. The snow was ten feet deep. We were alone with the charter and the four arrangements. We inhabited them all. The dark and playing, the first night, before the shame. The dark and silent, the refuge we returned to. The light and silent, the work I demanded. The light and playing, the gift that became a burden.

  The winter ran out. The sun began to linger past the ridge. The snow softened. But the log remained open on the desk. The line for the standing arrangement was blank. We could not mark a thing final. Every night's arrangement was displaced by a complaint the charter protected. Every solution dissolved into the next complaint.

  We sat at the table on the last morning. The lamp was off. The whistle was in the box. We were in the dark and the silence. We both preferred it to the light and the music. But I preferred the light and the silence to this. And he preferred the light and the music to this.

  There was no place to stand.

  I picked up the pen. I dated the page. I looked at the line where the arrangement should be recorded. I could not write *Off*. I could not write *On*. I could not write *Silent*. I could not write *Playing*. Any mark would be a lie, or a command that would be overturned by the morning.

  I wrote the date. I wrote the weather. I left the rest for the next man.

  *Status pending.*
