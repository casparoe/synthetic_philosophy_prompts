  I. Deriving the Space: Load-Bearing Questions
      A. Ontology of Preference
          1. Is a preference a pre-existing mental state that causes choice, or is it constituted by the choice itself?
          2. Does inconsistency reveal measurement error, or does it prove the non-existence of stable orderings?
      B. Normative Authority
          1. Does every observed choice carry equal weight for welfare analysis, or do some choices (errors, commitments) count for nothing?
          2. When choice conflicts with reported experience, which bearer of welfare dominates: the deciding self or the experiencing self?
      C. Agency and Delegation
          1. Does a choice executed by an algorithm configured in the past count as a current expression of preference?
          2. Is framing-dependence a disqualifying bias or an informative feature of context-dependent valuation?
      D. Scope of Motivation
          1. Do choices driven by sympathy or moral commitment map onto personal welfare, or do they represent a distinct category of action?
          2. Is the goal of regulation to satisfy stated desires or to optimize objective well-being metrics?

  II. Branch Nodes: Interview Questions for Working Economists
      A. Node 1 (The Gym Contract): A person signs a costly annual gym contract in January but never attends. Do you treat the January signature as a revealed preference for gym access, or as an error in prediction?
      B. Node 2 (Framing): Identical clinical data is presented as 90% survival or 10% mortality, shifting patient choices. Do you treat these as two different preferences or one preference measured with noise?
      C. Node 3 (Algorithmic Shopper): A shopper's basket is assembled by an algorithm she configured three years ago and never updated. Is this transaction evidence of her current welfare?
      D. Node 4 (Ethical Premium): A customer pays more to avoid a supplier she disapproves of, reducing her material consumption. Does this choice increase her welfare relative to the cheaper option?
      E. Node 5 (Menu Ordering): A diner's ranking of menu items shifts depending on the order in which they are read aloud. Is the resulting choice valid for welfare analysis?
      F. Node 6 (Wretched Treatment): A patient chooses a painful treatment decisively but reports being wretched throughout it. Did this choice maximize her welfare?
      G. Node 7 (Algorithmic Drift): An algorithm continues to purchase goods for a user whose income has dropped, following old mandates. Is the regulator obligated to intervene?
      H. Node 8 (Repeated Inconsistency): A subject chooses A over B today, and B over A tomorrow, with no new information. Is this a violation of rationality axioms?
      I. Node 9 (Commitment): A smoker pays to lock away their cigarettes. Is the payment a cost or an investment in welfare?
      J. Node 10 (Default Effects): Employees stay in a pension default they admit they don't understand. Is this inertia or consent?

  III. Terminal Leaves: Theoretical Positions
      A. Samuelsonian Revealed Preference
          1. Awkward Commitment: Must assert the gym signer preferred not attending all along, rendering "mistake" meaningless.
          2. Sorting Node: Node 1 forces the operationalist denial of mental error.
      B. Representation-Theorem Orthodoxy
          1. Awkward Commitment: Must posit real mental states that exist only insofar as they satisfy consistency axioms.
          2. Sorting Node: Node 8 distinguishes this from operationalism by demanding axiomatic coherence.
      C. Hausman's Preference-Satisfaction
          1. Awkward Commitment: Must judge which preferences are "informed" enough to count, inviting paternalism.
          2. Sorting Node: Node 2 separates this from pure revealed preference by allowing measurement noise.
      D. Bernheim and Rangel (Behavioural Welfare)
          1. Awkward Commitment: Must discard data from "ambiguous" choices, leaving large gaps in welfare maps.
          2. Sorting Node: Node 5 sorts this view by rejecting context-dependent choices as normative evidence.
      E. Sen's Commitment and Sympathy
          1. Awkward Commitment: Must accept that people systematically choose against their own welfare for moral reasons.
          2. Sorting Node: Node 4 isolates this position by validating ethical premiums as non-welfare maximizing.
      F. JDM Constructionism
          1. Awkward Commitment: Must claim preferences do not exist until the moment of elicitation, undermining policy stability.
          2. Sorting Node: Node 2 forces the admission that framing creates rather than reveals value.
      G. Hedonist Revisionism (Kahneman)
          1. Awkward Commitment: Must override the agent's own decisive choice if their experienced utility is negative.
          2. Sorting Node: Node 6 is the definitive sorter, prioritizing experience over decision utility.
      H. Libertarian Paternalism
          1. Awkward Commitment: Must assume errors exist to justify nudges while claiming to respect choice architecture.
          2. Sorting Node: Node 10 sorts this by treating defaults as potential errors requiring correction.
      I. Eliminativism
          1. Awkward Commitment: Must abandon welfare economics entirely as based on a folk-psychological fiction.
          2. Sorting Node: Node 1 rejects the premise that any choice reveals a coherent preference state.
      J. Algorithmic Stewardship (Unnamed)
          1. Awkward Commitment: Must grant regulatory authority over private code based on temporal drift in mandates.
          2. Sorting Node: Node 7 isolates this by treating past configuration as decaying evidence.

