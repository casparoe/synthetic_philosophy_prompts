      A. Unoccupied Answer Combinations
          1. Node 1 (Error) + Node 8 (Rational): Incoherent. One cannot claim the gym contract was a mistake while insisting all repeated choices are rational.
          2. Node 6 (Experience Dominates) + Node 4 (Ethical Premium Ignored): Unattractive. A regulator who overrides pain but ignores moral satisfaction is inconsistently paternalistic.
          3. Node 3 (Algorithm Invalid) + Node 10 (Default Valid): Unexplored. Few distinguish between active algorithmic delegation and passive inertia despite similar welfare implications.
      B. Indistinguishable Leaf Pairs
          1. Libertarian Paternalism vs. Bernheim/Rangel: Substantive overlap. Both recommend intervening on "ambiguous" choices; disagreement is merely about whether to call it "welfare" or "choice architecture."
          2. Samuelsonian vs. Representation-Theorem: Verbal disagreement. In policy modeling, both treat the choice function as the object of analysis; the ontology of the mind is irrelevant to the regulator's math.
          3. Hausman vs. Hedonist Revisionism: Policy convergence. Both justify overriding choices, one via "true preference" and the other via "experience," leading to identical regulatory interventions in health markets.

