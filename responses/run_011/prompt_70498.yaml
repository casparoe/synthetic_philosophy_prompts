  9.  **Final Polish:** Check against the "Don't give me a balanced menu" constraint. Be decisive.

      *   *Decision:* The piece works. The theory is accurate enough. The central claim is strong. The metric paragraph needs to be sharper. The originality lies in the *log* artifact, not the philosophy itself.

      *   *Wait, one nuance:* The user asked "Did I mangle Savulescu or Habermas?" I need to be specific.
