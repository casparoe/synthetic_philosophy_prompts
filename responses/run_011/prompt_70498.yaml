      *   *On the "Metric":* The phrase "laundered preference" is good. But the argument that "you can only rank on one scale" is technically debatable (multi-criteria decision analysis exists), but for a lit mag, it's acceptable poetic truth. I should point out it's slightly reductive but works rhetorically.
