answer: |-
  "The estimator $\mathbb{H}$ is ready for review," Elena said, sliding the manuscript across the table. "It satisfies the trilemma. First, monotonicity: $\mathbb{H}(A \land B) \le \min(\mathbb{H}(A), \mathbb{H}(B))$. Second, the independence default: if no correlation is known, $\mathbb{H}(A \land B) = \mathbb{H}(A)\mathbb{H}(B)$. Third, asymptotic recovery: if the true density exists, $\mathbb{H}$ converges to it."

  Marcus didn't open the file. "It's elegant, Elena, but it licenses falsehoods. Take the prime triplets. Let $P(n)$ be '$n$ is prime'. Your default says $\mathbb{H}(P(n) \land P(n+2) \land P(n+4))$ is roughly $1/(\ln n)^3$. Summing that over $n$ diverges. Your estimator predicts infinitely many such triples."

  "But there is only one: 3, 5, 7."

  "Exactly," Marcus said. "Your independence presumption asserts a correlation of zero where there is a massive negative correlation. One of every three consecutive odd numbers is divisible by three. If $n > 3$, one of $n, n+2, n+4$ must be composite. Your estimator predicts infinity; reality gives unity. Condition two breaks."

  Elena leaned forward. "That's a local obstruction. We correct for small moduli. The Hardy-Littlewood singular series handles the mod 3 dependency. We multiply by a factor of zero for that specific congruence class. The estimator recovers the finite count."

  "Did you know to apply that correction *before* you knew the answer?" Marcus pressed. "Or is this an ad hoc rescue visible only in hindsight? If your 'presumption of independence' requires you to manually patch every modulus where the integers conspire against you, it's not a default rule. It's a lookup table of known theorems."

  "It's a principled hierarchy," Elena countered. "We check for congruence obstructions first. That's part of the 'known correlation' clause. If a correlation is structurally accessible via modular arithmetic, it's known. If not, we presume independence."

  "Structurally accessible?" Marcus scoffed. "That's the loophole. Maier's theorem. Cramér's random model assumes primes are distributed independently in short intervals, subject only to the global density $1/\ln n$. It's the probabilistic incarnation of your Condition Two. But Maier proved that in intervals of size $(\ln n)^\lambda$, the count of primes fluctuates wildly more than Cramér's model predicts. The integers have long-range correlations that aren't captured by small moduli."

  "Maier shows the model needs refinement, not abandonment," Elena said. "We can incorporate matrix methods to adjust the variance."

  "But when?" Marcus snapped. "If you incorporate Maier's correction only after Maier proves the theorem, you violate Condition Three. You aren't recovering the density from the heuristic; you're calibrating the heuristic to the density. If you claim the correction is 'accessible' before the proof, you're claiming you could have derived Maier's theorem from your estimator. Can you?"

  Elena paused. "The presumption of independence isn't an ontological claim that the integers *are* random. It's an epistemic rule about the burden of proof. If you cannot demonstrate a correlation, you must budget as if they are independent. Otherwise, mathematics halts. We couldn't conjecture the twin prime constant without assuming independence modulo large primes."

  "But that's the rub," Marcus said, tapping the table. "Is the presumption a claim about the integers that could turn out false, or merely a rule about who bears the burden? If it's the former, Maier proves it false. The integers *are* correlated in short intervals, regardless of our knowledge. If it's the latter, your Condition Three fails. You can't claim to recover the 'true' asymptotic density if your rule forces you to ignore hidden structure that defines that density."

  "I'm arguing it's a rule of inference," Elena insisted. "It tells us what we are licensed to believe given our current state. If Maier reveals new structure, the state changes, and the estimator updates. The estimator isn't static; it's a function of the available proof state."

  "Then it's not a heuristic for discovery, it's a mirror of proof," Marcus said. "It tells you nothing you don't already know. If you need to know the correlation to avoid the error, the default is useless. Look back at the triplets. You said the mod 3 obstruction is 'accessible.' Why is mod 3 accessible but Maier's matrix structure isn't? Both are properties of the integers. You're drawing an arbitrary line between 'simple' correlations that your estimator respects and 'complex' ones that break it."

  "The line is computational complexity," Elena said. "Congruence checks are polynomial time. Maier's fluctuations require analyzing the distribution of primes in a way that currently exceeds our proof capabilities. The heuristic is designed to work where proof is absent."

  "So it works only where the integers behave simply," Marcus concluded. "But the interesting number theory is exactly where they don't. You want Condition Two to drive discovery, but you retreat to Condition Three whenever Condition Two leads to a contradiction like the triplets or Maier's intervals. You can't have it both ways. You can't default to independence and claim to track truth when independence is factually wrong."

  "I don't claim it's factually true," Elena repeated, frustration rising. "I claim it's the only rational prior. If I assume correlation without evidence, I introduce bias. If I assume independence, I introduce variance. Maier shows high variance, yes, but the mean might still hold."

  "The mean doesn't hold in Maier's intervals," Marcus corrected. "The error term dominates. Your estimator would assign a confidence interval that excludes the actual count. That's not variance; that's systematic error. It means your 'rational prior' is systematically misleading about the arithmetic landscape."

  "Then we refine the prior," Elena said. "We add a condition: independence holds unless a correlation is *provably* detectable within a specific formal system."

  "And there you are," Marcus said. "Now your estimator depends on the limits of that formal system. If the system is weak, you get the triplet error. If it's strong enough to prove Maier, you don't need the heuristic. You're chasing a ghost. To save this project, you have to reconcile the 'default' with the 'recovery'."

  Elena sighed, closing the manuscript. "So what is the burden? What do I need to establish for this to survive?"

  Marcus leaned back, folding his arms. "You need to define 'known correlation' without circularity. You must show there exists a class of correlations $\mathcal{C}$ such that: one, every correlation in $\mathcal{C}$ is detectable without knowing the asymptotic density of the claim itself; and two, every correlation *not* in $\mathcal{C}$ is negligible enough that presuming independence doesn't violate Condition Three asymptotically. Essentially, you must prove that the only correlations that matter are the ones you can easily find. Until you prove the integers don't hide significant structure in the blind spots of your detection algorithm, your presumption of independence is just a gamble disguised as a calculus."

  "A gamble we have to take," Elena said softly.

  "Perhaps," Marcus replied. "But don't call it evidence until you've bounded the risk."
