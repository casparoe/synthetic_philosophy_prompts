      *   *Bias:* Apophenia (finding patterns/meaning), emotional need for continuity (mom isn't gone if "I" is one), authority bias (it's *her* book).
      *   *Discount Factor:* Significant. A neutral reader would be more skeptical.
      *   *Neutral Credence:* If I were reading for fun, I'd be more dismissive. Maybe 5% on the conjunction. The user is at 15-20% effectively because of the emotional weight. I need to be gentle but firm.

