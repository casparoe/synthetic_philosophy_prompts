      *   **The Task:** Evaluate the truth of Schrödinger's claim (One Mind vs. Many Minds) and whether it's a substantive claim or just relabeling.
      *   **Constraints:** Give actual credence numbers (probabilities) for (a), (b), and their conjunction. Decompose the reasoning with terms/justifications. Identify sensitivity. Assess the user's bias due to grief/context.
