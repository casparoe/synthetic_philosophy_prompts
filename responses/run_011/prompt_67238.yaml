      *   *Linear Stage Theory:* Hegel, Marx, Comte. Teleological.
      *   *The "One Lap" problem:* A linear stage theory is distinct because it has a *telos* (end goal). A cycle implies potential repetition (even if not realized).

  4.  **Drafting the Response - Section by Section:**

      *   **Validation:** Acknowledge the user's insight. It's a sharp observation that often gets glossed over in intro seminars.
      *   **The Terminology:**
          *   There isn't *one* magic word, but the distinction is usually drawn between **Substantive Cyclicity** (Polybius) and **Morphological/Structural Cyclicity** (Spengler/Toynbee).
          *   I need to introduce the concept of **Homology** (from biology, used by Spengler) vs. **Identity**.
          *   I should propose a working term if none fits perfectly. "Structural Recurrence" vs. "Substantive Recurrence." Or better: **Iterative Identity** vs. **Isomorphic Sequence**. Let's stick to the philosophical distinction: *Token Recurrence* vs. *Type Recurrence*. Actually, the best fit is **Substantive Recurrence** vs. **Formal Homology**.
      *   **Defining the Edges (The "Data Engineering" approach):**
          *   *Criterion 1: Interchangeability.* In Polybius, you can swap a Roman Tyrant for a Greek Tyrant and the model holds. In Spengler, you cannot swap a Faustian Magian for an Apollinian one.
          *   *Criterion 2: Predictive Specificity.* Polybius predicts the *kind* of regime. Spengler predicts the *feeling/shape* of the era, not the specific policy.
          *   *Criterion 3: The Telos Test.* Linear theories have an end state (Communism, Liberal Democracy). Cycles do not (they reset).
      *   **The "One Lap" Question:**
          *   Linear stage theory is distinct because of *directionality* and *accumulation*. History learns. Cycles forget. If a theory says "Stage 1 -> Stage 2 -> Stage 3 (End)," it's linear. If it says "Stage 1 -> Stage 2 -> Stage 3 -> Stage 1," it's cyclic. If it says "Culture A: 1->2->3. Culture B: 1->2->3," that's *serial morphology*, not necessarily a cycle unless Culture C emerges from the ashes of B. Spengler is actually distinct here: Cultures die and don't come back. So is Spengler cyclic? He says history is a collection of biographies, not one big cycle. This is a crucial nuance. The *internal* life of a culture is cyclic/organic, but *world history* is not a single wheel.
      *   **Classifying the Authors:**
