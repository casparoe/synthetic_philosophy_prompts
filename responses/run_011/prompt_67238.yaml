answer: |-
  You are not missing a term, and you are not about to look stupid in section. You have identified a genuine category error that often gets glossed over in introductory historiography because it requires disentangling metaphysics from mechanics.

  The short answer is: **No, there is no single standardized noun that cleanly separates "Substantive Recurrence" from "Structural Homology" in the way you're describing.** Most textbooks lump them under "Cyclical Theories" because they both reject the Enlightenment/Christian notion of linear progress.

  However, in the philosophy of history and systems theory, the distinction you are grasping for is real. It is the difference between **Token Recurrence** (Polybius) and **Type Homology** (Spengler/Toynbee).

  Here is the breakdown you need for your audit, structured to give you the edges and criteria you asked for.

  ### 1. The Terminology: Substantive vs. Morphological

  Since there isn't one perfect word, you need to use a pair of concepts to draw the line.

  **A. Substantive Recurrence (The Polybian Model)**
  *   **Definition:** The *variables* of the system return to previous states. The content is interchangeable across time.
  *   **The Claim:** A "Tyranny" in 400 BCE Syracuse is functionally identical to a "Tyranny" in 1st Century BCE Rome. The regime types are universal constants.
  *   **The Cycle:** It is a closed loop. If you wait long enough, the *exact same political configuration* reappears.
  *   **Data Analogy:** A state machine where `State_A` always transitions to `State_B`, and the properties of `State_B` are identical every time the function is called.

  **B. Morphological Homology (The Spenglerian Model)**
  *   **Definition:** The *relationships* between variables recur, but the variables themselves are unique. The content is incommensurable.
  *   **The Claim:** The "Winter" of the Faustian culture (Imperialism) is *analogous* to the "Winter" of the Apollinian culture, but they are not the *same thing*. You cannot swap them.
  *   **The Cycle:** It is not a wheel of history; it is a series of parallel biological lifespans. History does not cycle; *organisms* cycle.
  *   **Data Analogy:** A class definition (`Culture`) that is instantiated multiple times (`Egyptian`, `Faustian`, `Mayan`). Each instance runs the same methods (`.grow()`, `.decay()`, `.die()`), but the internal data structures (`.art`, `.math`, `.religion`) are unique to that instance and cannot be compared directly.

  **The Term You Want:** If you need a label for section, call it **Isomorphic Sequencing** (Spengler/Toynbee) vs. **Iterative Recurrence** (Polybius).

  ### 2. The Criteria for "Sameness"

  You asked: *What would have to be true of two phases for them to count as the same phase when nothing in them is the same?*

  For a theory to claim **Substantive Recurrence** (Polybius), two conditions must be met:
  1.  **Interchangeability:** You could take a variable from Cycle 1 and plug it into Cycle 2 without breaking the model. (A Roman Consul functions like a Spartan Ephor).
  2.  **State Reset:** The end of the cycle returns the system to the *initial conditions* of the start. (Chaos leads back to Monarchy).

  For a theory to claim **Morphological Homology** (Spengler), the criteria are:
  1.  **Positional Equivalence:** Phase X is defined only by its position relative to Birth and Death, not by its empirical content.
  2.  **Incommensurability:** You explicitly *cannot* compare the content. (Spengler argues that comparing "Democracy" in different cultures is a scientific error because the word means something totally different in each).

  ### 3. The "One Lap" Problem: Cycle vs. Linear Stage Theory

  You asked if a stage theory (Marx, Hegel, Rostow) is just a cycle with one lap taken out. **No.** The distinction is not geometric; it is **teleological**.

  *   **Linear Stage Theory:** Has a *Telos* (End Goal). The stages accumulate. Knowledge, capital, or spirit is preserved and built upon. Stage 3 is "higher" or "final" compared to Stage 1. You cannot go back to Stage 1 without catastrophic loss of the accumulated value.
  *   **Cyclical Theory:** Has a *Reset*. Social capital is lost. The system forgets. The end state is functionally equivalent to the start state (e.g., disorder/chaos requiring a new strongman).
  *   **Morphological Theory:** Has a *Lifespan*. It doesn't go back to the start, and it doesn't progress to a higher plane. It simply expires.

  **The Edge Case:** Toynbee is actually a hybrid here. He uses morphological phases (Challenge/Response, Breakdown), but he believes religious truth *accumulates* across civilizations. So Toynbee is a **Spiral**: the shape of the civilizations is cyclic, but the spiritual trajectory of humanity is linear.

  ### 4. Auditing Your Four Authors

  Here is where you can likely contribute to your seminar, because your intuition on Spengler is sharper than the standard summary.

  **Polybius: Substantive Recurrence (True Cycle)**
  *   **Verdict:** He is the only one on your list proposing a literal wheel.
  *   **Why:** He believes human nature is constant. Therefore, political forms are constant. If you wait, the exact same constitution will reappear.
  *   **Edge:** If Polybius is right, history is predictable in *content*.

  **Ibn Khaldun: Sociological Recurrence (Generational Cycle)**
  *   **Verdict:** Closer to Polybius, but limited scope.
  *   **Why:** His cycle (Asabiyyah) is based on generational time (approx. 120 years). It is substantive: luxury *always* weakens solidarity. However, it applies to dynasties, not necessarily "Civilizations" as a whole. It is a cycle *within* history, not a cycle *of* history.
  *   **Edge:** It is empirical and sociological, not metaphysical like Spengler.

  **Oswald Spengler: Morphological Homology (Parallel Lifecycles)**
  *   **Verdict:** **Not a cyclical theorist in the strict sense.** This is the trap.
  *   **Why:** Spengler explicitly argues there is no "History," only "Histories." The Faustian culture dies and does not come back. The *pattern* repeats across cultures, but the *timeline* does not loop.
  *   **Edge:** If you call Spengler "cyclical," a strict reader will correct you. He is a **morphological parallelist**. The "cycle" exists only inside the sealed box of a single Culture.
  *   **Your Intuition:** You were right to feel that "nothing in the world you could point at twice." That is the definition of his morphology.

  **Arnold Toynbee: Morphological Spiral**
  *   **Verdict:** Structural Homology with Linear Teleology.
  *   **Why:** Like Spengler, he sees civilizations going through birth/growth/breakdown/disintegration. Unlike Spengler, he believes the "Universal State" and "Universal Church" allow spiritual progress to survive the crash.
  *   **Edge:** The "Breakdown" phase is structurally identical across civilizations, but the *outcome* can be different (survival vs. death).

  ### 5. Epistemological Utility: Is "Sequence-Only" Just Noise?

  You asked: *If only the sequence recurs and never the content, is there any way at all to distinguish such a theory from a straight line plus noise?*

  Yes. The distinction is **Topological**.

  *   **Line + Noise:** The vector is unidirectional. Deviations are random. If you zoom out, the slope is positive (or negative).
  *   **Morphological Sequence:** The vector is bounded. It has a ceiling (Civilization) and a floor (Disintegration). If you plot "Social Cohesion" or "Artistic Vitality" over time, a Linear theory expects a trend line. A Morphological theory expects a **wave function**.

  **Does the label do work?**
  *   **Predictive Power:** Substantive cycles (Polybius) claim to predict *events* (e.g., "Oligarchy is next"). Morphological cycles (Spengler) claim to predict *moods* (e.g., "We are entering a period of Caesarism and artificiality").
  *   **Diagnostic Power:** Morphology is better at diagnosis. It tells you *where* you are in the lifespan, even if it can't tell you *what* will happen next Tuesday.
  *   **Falsifiability:** This is the weak point. If the content never repeats, how do you prove the structure is real? Spengler avoids this by declaring his method intuitive/physiognomic rather than scientific. Toynbee tries to make it empirical and gets bogged down in cherry-picking civilizations.

  ### Summary for Section

  If you want to frame this in discussion:

  1.  **Acknowledge the grouping:** "We tend to group these as 'Cyclical' because they all reject linear progress."
  2.  **Draw the distinction:** "But there is a functional difference between **Iterative Recurrence** (Polybius), where the system state resets, and **Morphological Homology** (Spengler), where only the lifecycle shape repeats across incommensurable instances."
  3.  **The Spengler Correction:** "Strictly speaking, Spengler isn't cyclical. He denies a single history. He proposes parallel biographies. Calling him cyclical implies the wheel turns back to the start of *History*, whereas he argues History ends when the Culture dies."
  4.  **The Line Test:** "The difference between a Stage Theory and a Cycle isn't geometry; it's accumulation. If the system forgets its previous state, it's a cycle. If it builds on it, it's a stage. If it builds on it but the building process itself has a rhythmic pulse, it's a spiral (Toynbee)."

  You aren't missing a term; you're noticing that "Cyclical History" is a bucket that holds three very different mechanical models. Pointing that out won't make you look stupid; it will show you're reading the texts rather than the summary.
