      *   **Constraints:** No bare labels. No "that's just morphology." No "that's typology" (user explicitly rejected these). Needs depth and precision.

  2.  **Deconstruct the Historiographical Problem:**
      *   *Polybius (Anacyclosis):* Literal recurrence. Regime types are universal categories. A tyranny in Rome is functionally equivalent to a tyranny in Greece. The *substance* of the political form is the same.
      *   *Spengler (Morphology):* Organic metaphor. Cultures are distinct organisms. They go through birth, growth, decay, death. The *stages* correspond (Spring, Summer, Autumn, Winter), but the *content* (Art, Math, Politics) is unique to the Culture's "Prime Symbol." A "Winter" phase in the Faustian culture (Imperialism/Caesarism) is analogous to a "Winter" phase in the Apollinian culture, but they are not the *same thing* empirically.
      *   *Toynbee (Challenge and Response):* Similar to Spengler but more granular (Civilizations vs. Cultures). Breakdowns look different empirically but share a structural position in the lifecycle.
      *   *Ibn Khaldun (Asabiyyah):* This is tricky. It's often grouped with cycles, but is it? It describes a generational rhythm of tribal solidarity turning into sedentary luxury and collapsing. It repeats *within* a dynasty, but does it repeat across different civilizations in the same way Polybius does? It's closer to a sociological law of generational decay.

  3.  **Search for Terminology (Mental Database & Verification):**
