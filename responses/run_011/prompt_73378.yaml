      *   *Commitment Problem:* Peace deal needs stability over 2 cycles (approx. 8-10 years). Simple majority repeal is a risk.
      *   *Enforcement:* No independent judiciary. Entrenchment via courts is impossible.
      *   *Budget:* Annual passage required. Shutdown risk is real.
      *   *Hybrids:* User wants to evaluate mixed systems (e.g., constructive vote of no confidence with supermajority threshold initially).

  3.  **Drafting the Requirements List (The "Spec"):**
      *   *Requirement 1: Coalition Stability vs. Flexibility.* Needs to explain how governments form and survive in fragmented legislatures.
      *   *Requirement 2: Commitment Credibility.* How to bind future majorities without courts.
      *   *Requirement 3: Deadlock Resolution.* What happens when Executive and Legislature disagree (especially on budget).
      *   *Requirement 4: Removal Mechanisms.* Distinguish between losing support vs. misconduct/incompetence.
      *   *Requirement 5: Hybrid Evaluability.* Must handle intermediate forms, not just ideal types.
      *   *Requirement 6: Accountability Clarity.* Who gets blamed?
      *   *Requirement 7: Regime Survival Empirics.* Must align with data on coups/collapses.

  4.  **Analyzing Consensus vs. Contestation (The "Politics of Theory"):**
      *   *Consensus:* Fragmented legislatures make coalition governance harder. Budget shutdowns are bad. Judicial independence matters for entrenchment (but here it's absent).
