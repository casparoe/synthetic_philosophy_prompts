      *   *Hybrid Tension:* Supermajority removal protects the executive but makes budget blackmail easier.

  6.  **Selecting the "Most Work" Requirement:**
      *   *Commitment Credibility without Judiciary.* This is the unique constraint. Most theories assume courts or parties enforce deals. Here, the institutional design *is* the enforcement.

  7.  **Addressing the Hybrid Constraint:**
      *   Agree with the user. Standard Linz/Shugart frameworks often binarize. A good theory *must* handle continuous variables (thresholds, timing).

