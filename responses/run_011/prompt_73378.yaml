answer: |-
  Here is the specification list for a theory of institutional choice tailored to your constraints, followed by the consensus/dispute mapping, the incompatibility analysis, and the scorecard.

  ### The Specification: Requirements for the Theory

  A defensible theory must satisfy the following seven requirements before issuing a recommendation.

  **1. The Fragmentation-Deadlock Distinction**
  *   **Requirement:** The theory must distinguish between systemic deadlock (institutional rules prevent action) and electoral deadlock (party system prevents action).
  *   **Consideration:** A 61-seat legislature with three equal blocs is electurally prone to stalemate regardless of rules. A theory that blames "presidentialism" for deadlock that would exist under parliamentarism (due to the 33/33/33 split) is invalid. It must isolate the *marginal* effect of the executive form on an already fragmented electorate.

  **2. The Entrenchment-without-Judiciary Mechanism**
  *   **Requirement:** The theory must explain how policy commitments (the peace deal) survive simple legislative majorities without judicial review.
  *   **Consideration:** Standard theories assume courts strike down repeals or parties internalize norms. Here, courts are partisan. The institutional design itself must raise the transaction cost of repeal (e.g., supermajorities, timed locks) without relying on external enforcement.

  **3. The Budget-Veto Interface**
  *   **Requirement:** The theory must model the interaction between executive tenure security and legislative budget power.
  *   **Consideration:** If the civil service stops getting paid, the state fails. If the executive has fixed tenure but the legislature has a simple-majority budget veto, the legislature can hold the state hostage to unwind the peace deal indirectly. The theory must account for "shutdown" risks as a form of policy reversal.

  **4. The Removal Threshold Differentiation**
  *   **Requirement:** The theory must distinguish between removing an executive who has lost coalition support vs. one who has committed malfeasance.
  *   **Consideration:** In your hybrid proposal (2/3 vote for 4 years), the goal is to prevent removal due to shifting coalition math while allowing removal for gross failure. A binary theory (vote of no confidence vs. impeachment) cannot score this nuance. The theory must treat removal thresholds as continuous variables, not binary switches.

  **5. The Hybrid Continuum Capability**
  *   **Requirement:** The theory must be able to score mixed systems (semipresidentialism, constructive no-confidence, supermajority thresholds) rather than ranking only "pure" presidentialism and "pure" parliamentarism.
  *   **Consideration:** As you noted, standard typologies (Linz, Shugart & Mainwaring) often binarize. A theory that goes quiet on your specific hybrid mechanism fails the utility test. It must handle *degrees* of executive rigidity.

  **6. The Accountability Clarity Test**
  *   **Requirement:** The theory must define "accountability" operationally (who gets blamed by voters) rather than normatively (who *should* get blamed).
  *   **Consideration:** Presidentialists argue fixed terms clarify accountability; Parliamentarists argue coalition responsibility clarifies it. The theory must predict voter behavior in a regional-bloc system, not just assert a principle.

  **7. Empirical Regime Survival Consistency**
  *   **Requirement:** The theory cannot contradict established statistical regularities regarding regime collapse in developing, fragmented democracies.
  *   **Consideration:** It must align with data on coup risk and democratic breakdown. If a recommendation increases the probability of military intervention (due to perceived deadlock), it fails this requirement.

  ***

  ### Consensus vs. Contestation Map

  Here is where the "science" ends and the "camp preferences" begin. You need to know which lines you can draw in the sand and which are negotiable.

  | Requirement | Status | Notes on Dispute |
  | :--- | :--- | :--- |
  | **1. Fragmentation-Deadlock** | **Broad Consensus** | Almost all scholars agree party system fragmentation drives instability more than executive type does. |
  | **2. Entrenchment w/o Judiciary** | **Live Dispute** | *Consensus:* Courts are the standard enforcement. *Dispute:* Whether political entrenchment (supermajorities) works without courts. Some argue it just moves the conflict to the street. |
  | **3. Budget-Veto Interface** | **Broad Consensus** | Agreement that budget shutdowns are catastrophic. Disagreement on which system mitigates this better in fragmented legislatures. |
  | **4. Removal Thresholds** | **Contested Preference** | *Parliamentarist View:* Low thresholds ensure responsiveness. *Presidentialist View:* High thresholds ensure stability. Treating one as "neutral" smuggles in a preference for stability over responsiveness or vice versa. |
  | **5. Hybrid Continuum** | **Methodological Gap** | *Consensus:* Hybrids exist. *Dispute:* Most canonical theories (Linz) are binary. Insisting on a hybrid-capable theory is a valid critique of the literature, not a consensus requirement. |
  | **6. Accountability Clarity** | **Smuggled Preference** | **High Risk.** Presidentialists claim fixed terms = clarity. Parliamentarists claim coalition bargaining = clarity. This is often a normative claim dressed as empirical. |
  | **7. Regime Survival** | **Broad Consensus** | Agreement that frequent government collapse correlates with democratic erosion. Disagreement on whether *executive* collapse or *legislative* gridlock is the stronger predictor. |

  **Specific Warning on "Clarity of Accountability":**
  Be explicit with the lawyers that this is the primary vector for smuggled preferences. If a theorist argues "Presidentialism is better because voters know who to blame," they are assuming voters prioritize executive performance over legislative coalition building. In a regional-bloc system (your case), voters may blame the *bloc*, not the executive form. Treating "clarity" as an objective good often privileges presidentialism.

  **Specific Warning on "Fixed Terms":**
  Similarly, framing fixed terms as "stability" is a presidentialist preference. Framing them as "rigidity" is a parliamentarist preference. A neutral spec must treat term length as a variable affecting *commitment credibility* vs. *error correction*, not as "stable" vs. "unstable."

  ***

  ### The Incompatible Subset (The Trilemma)

  Given your facts (3 blocs, no courts, peace deal needs 2-cycle survival, annual budget), you cannot satisfy these three requirements simultaneously:

  1.  **Executive Rigidity:** The executive cannot be removed easily (to protect the peace deal).
  2.  **Legislative Sovereignty:** The legislature can pass/repeal laws (including budgets) by simple majority (to reflect the 33/33/33 reality).
  3.  **Continuous Functioning:** The budget must pass annually without shutdown.

  **Why:** If the Executive is rigid (Requirement 1) but the Legislature is sovereign (Requirement 2), a coalition of two blocs (33+33) can refuse the budget to force policy changes, causing a shutdown (violating Requirement 3). If you prevent the shutdown (e.g., automatic continuing resolution), you reduce Legislative Sovereignty (violating Requirement 2). If you allow the Executive to be removed by simple majority to resolve the budget, you lose Executive Rigidity (violating Requirement 1).

  **Resolution:** You must sacrifice one. Your hybrid proposal (2/3 removal threshold) attempts to sacrifice *Legislative Sovereignty* (making it harder to remove the executive) to preserve *Executive Rigidity* and *Continuous Functioning*. The theory must explicitly acknowledge this trade-off rather than claiming it solves all three.

  ***

  ### The Single Most Narrowing Requirement

  **Requirement 2: The Entrenchment-without-Judiciary Mechanism.**

  This is the bottleneck. Most comparative politics literature assumes either judicial review or strong party discipline enforces long-term deals. In your scenario, neither exists. This requirement eliminates any theory that relies on "norms," "courts," or "party discipline" as the primary stabilizer. It forces the analysis onto *mechanical* constraints (supermajorities, timed locks, budget automaticities). It narrows the field from "standard constitutional forms" to "engineered commitment devices."

  ***

  ### Scorecard of Contenders (Against the Spec)

  **Pure Parliamentarism**
  *   **Pros:** Solves Budget-Veto (govt falls if budget fails, forcing deal). High Hybrid Continuum score (coalition math is flexible).
  *   **Cons:** Fails Entrenchment (new coalition can unwind peace deal in Year 2). Fails Executive Rigidity (PM removed by simple majority shift).

  **Pure Presidentialism**
  *   **Pros:** Solves Executive Rigidity (fixed term protects peace deal architect). High Accountability Clarity (single head).
  *   **Cons:** Fails Budget-Veto (high risk of shutdown/blackmail by 2-bloc coalition). Fails Entrenchment (cannot stop legislature from repealing laws, only vetoing).

  **Proposed Hybrid (Supermajority Removal + Fixed Term)**
  *   **Pros:** Scores high on Executive Rigidity and Entrenchment (hard to remove, hard to replace policy). Handles Hybrid Continuum well.
  *   **Cons:** High risk on Budget-Veto (Legislature cannot remove exec, so it uses budget as weapon). Requires explicit "automatic budget" clause to survive the Incompatible Subset.

  **Settled vs. Live Note for the Room:**
  Tell the lawyers it is **settled** that fragmentation makes all systems harder. Tell them it is **live/disputed** whether your hybrid removal threshold creates stability or simply incentivizes legislative sabotage of the budget. That is the empirical question the theory cannot answer without local data.
