          Elias smoothed the letter against the truck's hot hood. Below them, the valley floor shimmered, half-shadowed by the ridge where the old pines stood black and silent. Three years ago, their father died leaving them the dirt and each other, with a will that spoke of stewardship but defined nothing. They had fought for a year, then bargained.

          Mara wanted the trees. Not for timber, not for carbon credits, but because she believed the stand was a witness that could not be replaced. Elias wanted the sun. Not for greed, but for the clinic downstream that the county wouldn't fund, a place where broken hips and diabetic feet could be treated without bankruptcy.

          The compromise was signed last winter. Panels on the southern slope, below the tree line. The revenue would build the clinic and maintain it for a decade. Mara kept the trees. Elias got the social good. It was, by every accountant and ethicist's measure, a win-win. Comparative advantage applied to conscience.

          Yet, every time Elias drove past the fenced-off ridge, he felt a hitch in his chest, a need to apologize to the dirt. Mara, meanwhile, kept the contract in a safe, not a frame, and visited the trees less often, as if her presence confirmed a betrayal.

          Now the letter from Helios Utility sat between them. They weren't interested in the south slope. They wanted the whole valley. The number written at the bottom was not merely larger than the solar projection; it was obscene. It could build ten clinics. It could endow a wing of the hospital. It could make Mara rich enough to buy a forest preserve in perpetuity elsewhere.

          "It's not the same," Mara said. She wasn't looking at the number. She was looking at the pines.

          "It's the same logic," Elias said. "We traded security for sanctity. Now we're being offered more security. Does the sanctity have a limit?"

          "If I say no to this, does that mean I sold the first deal?" Mara asked. "If I say yes, I admit the first deal was just haggling."

          That was the stain. The first compromise had felt clean at the time, a rational exchange of preferences. But this offer stripped the paint off. It suggested that their moral boundary wasn't a wall, but a price point they hadn't yet reached. If the trees were truly sacred, Helios's offer should be irrelevant, an insult. But it wasn't an insult; it was a temptation, and the mere fact that they were discussing it proved the trees had a price.

          Elias thought of the clinic. The solar array was fragile. Hail, policy shifts, grid failures. The Helios cash was immediate, immutable capital. He could secure care for generations. To refuse was to prioritize wood over people, again. But to accept was to admit that Mara's sacred stand was just an asset class she had temporarily withheld from market.

          "If we sell," Elias said, "we admit we were never partners. We were vendors waiting for a better bid."

          "If we don't," Mara said, "we admit we value a view more than a cure. Again."

          They stood in the heat. The wind moved through the pines, a sound like static, like mass spec instruments warming up, waiting for stability that never quite came. They had thought the first bargain cleared the debt. Instead, it had only established the exchange rate.

          Elias picked up the pen. He didn't open the cap. He looked at Mara. She didn't nod, didn't shake her head. She just waited, her hand resting on the truck bed, knuckles white. The debt was still there, accruing interest. Whether they signed or walked away, the transaction had already happened the moment they considered the number. The valley wasn't theirs anymore; it was quoted.

          Elias capped the pen. He left it on the letter. The sun beat down on the south slope, waiting for the panels that might never come, or the ones that would cover everything. Mara closed her eyes. Neither spoke. The choice was no longer about the land, but about whether they could live with the knowledge that everything, eventually, comes to auction.

