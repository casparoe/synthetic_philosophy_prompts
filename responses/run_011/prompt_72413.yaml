          7.  Identify the single reply that *must* land.
          8.  Identify the "hope nobody asks" question.

  2.  **Analyze the Proposal:**
      *   **Mechanism 1:** Citizen Initiative retained.
      *   **Mechanism 2:** Double Majority (Popular + Majority of Districts). Modeled on Switzerland/Australia.
      *   **Mechanism 3:** The "Twist" (Jury Fallback). If Popular Yes + District No $\rightarrow$ Citizens' Jury.
      *   **Jury Function:** Hears experts, has 1 year to enact modified version OR let lapse.
      *   **Rationale:** Geographic buy-in + Deliberative second chance (avoiding grievance).

  3.  **Analyze the Audience & Their Biases:**
      *   **Election Lawyers (4):** Focus on administrability, litigation risk, clarity, constitutional conflicts, ballot language, certification. *Bias: "If it's hard to count or sue over, it's bad."*
      *   **Quant Political Scientists (2):** Focus on data, incentives, gerrymandering effects, voter behavior, empirical precedents. *Bias: "Where's the data? How does redistricting affect this?"*
      *   **County Party Chairs (2):** Focus on power dynamics, party influence, mobilization, grassroots impact. *Bias: "Does this help or hurt my party's ability to turn out voters?"*
