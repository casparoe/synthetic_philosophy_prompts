      *   *Objection 6 (Justice):* Rights Violation. Minority rights vs. Double Majority. What if the district majority suppresses a minority right?
      *   *Objection 7 (Lawyers):* Ballot Confusion. Voters won't understand the "Jury Fallback."
      *   *Objection 8 (Party Chairs/Quants):* Turnout/Engagement. Does this depress turnout if people know a jury might override them?

      *Refining for "Damage" and "Voice":*
      *   *Highest Damage:* The Constitutional/SEP issue (Justice). If it's illegal, it's dead.
      *   *High Damage:* The Gerrymandering issue (Quants). If districts are corrupt, the double majority is corrupt.
      *   *High Damage:* The "Jury as Legislature" issue (Lawyers). Administerability.
