  4.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Justice/Lawyers):* Constitutionality/Separation of Powers. A jury enacting law? That's legislative power.
      *   *Objection 2 (Quants):* Gerrymandering. If districts are rigged, the district majority is meaningless or weaponized.
      *   *Objection 3 (Lawyers):* Administering the Jury. How do you select? Who pays? What if they miss the deadline? Litigation magnet.
