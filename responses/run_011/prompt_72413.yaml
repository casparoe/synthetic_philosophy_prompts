      *   *Low:* Turnout effects (Quants).

      *Let's select and polish the top 8.*

      1.  **Justice:** Non-delegation doctrine. Jury = Legislature?
      2.  **Quants:** Gerrymandering poison pill.
      3.  **Lawyers:** The "Modified Version" ambiguity. Litigation nightmare.
      4.  **Party Chairs:** Lobbying the Jury. Dark money shift.
      5.  **Lawyers:** Ballot Language/Comprehension.
      6.  **Justice:** Equal Protection (One person, one vote).
      7.  **Quants:** Status Quo Bias/Deadlock.
      8.  **Party Chairs:** Undermining Party Mobilization.

  5.  **Drafting Replies & Identifying Weaknesses:**
      *   Need to be concise (2 mins spoken is ~250-300 words).
      *   Weakness needs to be honest.

  6.  **Strategic Advice (Concessions, Critical Reply, Dread Question):**
      *   *Concede:* Gerrymandering is a risk. Don't pretend districts are perfect.
      *   *Critical Reply:* The Jury isn't a legislature; it's a safety valve. It preserves the *will* of the majority while addressing *impact* concerns.
      *   *Dread Question:* What happens if the Jury enacts something the Legislature hates? Conflict of laws.

  7.  **Review against Constraints:**
