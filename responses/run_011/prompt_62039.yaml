prompt: |-
  Weird ask, but bear with me.

  Two years ago I helped start a mutual credit scheme at our community centre — about 90 households, our own printed scrip, one note = one hour of somebody's labour, spent at the monthly swap night. It's dying and I'm the one who has to say so out loud. Over the last six months people stopped spending their notes and started stuffing them in drawers for a rainy day, swap night went from forty-odd people to nine, and now nobody wants to do work for notes that nobody else will take. In three weeks I stand up in front of the whole membership and tell them either we change the rules or we fold, and I don't want to be guessing when I do it.

  Trying to work out what went wrong, I fell down a hole and ended up reading Berkeley on money — not the idealism, the economics. Mostly the Querist (first published 1735 and reworked after that; the query numbering is a mess between editions so don't trust mine) and his 1721 essay from after the South Sea crash. And the guy is describing my town. Wealth isn't the tokens, it's the four elements plus human labour. Query 5: "Whether money be not only so far useful, as it stirreth up industry, enabling men mutually to participate the fruits of each other's labour?" Query 23 asks whether the true idea of money, as such, "be not altogether that of a ticket or counter." He also asks whether less money circulating fast isn't effectively the same as more money circulating slow. And from the 1721 essay: "Money is so far useful to the public as it promotes industry, and credit having the same effect is of the same value with money; but money or credit circulating through a nation from hand to hand, without producing labour and industry in the inhabitants, is direct gaming." Plus his stuff about fashion and manufactured wants being what actually gets a population moving, and the sketch at the back of the Querist for a national bank issuing paper notes on good security rather than gold (land, I think, but don't quote me on that).

  Separately — and this is why I'm asking you instead of just moping — I teach a Thursday-evening adult philosophy class at the community college. 18 enrolled, 13 or 14 show up, ages 19 to 71, two of them are actual accountants who will definately notice if my numbers don't add up. Two hours, minus about 15 minutes of admin and announcements.

  Next session is money. I want a game, not a talk. Design an in-class game where they discover Berkeley's picture of money by living it, and where they don't hear his name or get told that money is just a counter until the debrief.

  What I need:

  - rules, roles and a timeline, plus a payoff/scoring scheme that doesn't use real money. I can bring a bag of poker chips, about 60 index cards, markers, and maybe $10 of coffee and candy if you want something for them to spend on.
  - participants should have to actually produce something, some cheap little task, so there's a genuine industry for the tokens to circulate against. Otherwise its just chips changing hands and nobody learns anything.
  - at least one round that reproduces what happened to us: hoarding, the market quietly suffocating, everyone acting sensibly on their own while the whole thing dies anyway. I want them to feel the dead loss, not be told about it afterwards.
  - something that also stages the velocity point and the wants-have-to-be-created point, not just the hoarding point. Those are the two bits my members never got and I think they're the ones that matter.
  - a debrief that maps specific moments of the game onto specific claims of his, including the moments where they were already reasoning like him without knowing it.
  - what will predictably go wrong the first time I run it and how to handle it. I've never facilitated anything with real stakes in it, and one of my regulars is a committed rules lawyer.
  - an honest line on which part of Berkeley's view a classroom token game flat out cannot reproduce, so I know what I have to supply myself.

  Last thing, and it's maybe the real reason I'm writing. End the session with the class having to decide whether a local scrip like mine can be rescued by rule changes or is doomed — but not as an opinion poll. Set it up so they have to argue from what just happened to them in the game, and tell me how to turn that into something I can carry into the membership meeting without it being "my philosophy class said so."
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the User and Request:**
      *   **User:** Community organizer (mutual credit scheme founder), Adult Philosophy Instructor.
      *   **Problem:** Their mutual credit scheme (local scrip) is failing due to hoarding/low velocity. They need to announce its potential closure/restructure soon.
      *   **Goal:** Design a 2-hour philosophy class session (18 students, mixed ages/backgrounds) where students *experience* George Berkeley's theory of money (from *The Querist* and 1721 essay) through a game, without knowing it's Berkeley until the end.
      *   **Specific Requirements:**
          *   Rules, roles, timeline, scoring (no real money, use chips/cards/candy).
          *   Must involve actual production (labor), not just trading chips.
          *   Must simulate hoarding/collapse (velocity crash).
          *   Must simulate "creating wants" (demand stimulation).
          *   Debrief mapping game moments to Berkeley's queries.
          *   Troubleshooting (rules lawyers, facilitation issues).
          *   Limitations (what the game *can't* show).
          *   **Crucial Ending:** A decision mechanism for the class to vote/argue on the fate of the user's real scrip scheme, based *only* on game evidence, providing the user with actionable data/arguments for their community meeting.

  2.  **Deconstruct Berkeley's Monetary Theory (for the Game Design):**
      *   *Core Idea:* Money is a ticket/counter to stimulate industry. It has no intrinsic value.
      *   *Velocity:* Less money moving fast = More money moving slow. (Circulation is key).
      *   *Hoarding:* Money kept out of circulation kills industry (Query 5, 1721 Essay).
      *   *Wants/Industry:* Money needs "manufactured wants" or fashion to drive the labor. If no one wants anything, no one works.
      *   *Credit:* Credit is as good as money *if* it circulates.

  3.  **Game Design - "The Token Economy":**
      *   *Concept:* A closed loop economy where students produce "goods" (paper origami, drawings, solutions to puzzles) to earn tokens, and spend tokens to buy "needs/wants" or privileges.
      *   *Phases:*
          1.  **Boom:** High velocity, clear wants.
          2.  **Bust:** Introduce a reason to hoard (uncertainty/scarcity).
          3.  **Recovery/Policy:** Introduce mechanisms to stimulate velocity or wants.
      *   *Roles:* Producers, Consumers, Banker (facilitator), Auditors (the accountants).
      *   *Production:* Folding paper cranes (simple, tangible, time-consuming).
      *   *Currency:* Poker chips.
      *   *Goods:* Candy/Coffee (immediate gratification) + "Certificates" for future privileges (grade boost? extra break? - *Wait, keep it ethical. Maybe just "VIP status" or "Choice of music"*). Let's stick to Candy/Coffee for immediate spend, and "Raffle Tickets" for a bigger prize to simulate savings/investment.
      *   *The Twist:* To simulate the user's specific problem, the "Bust" phase needs to be triggered by *fear* or *lack of opportunity*, not just rules.
      *   *Refinement:* Let's make the "Goods" limited. If there's nothing to buy, tokens become useless. If people think tokens will be worthless later, they spend now. If they think tokens are the *only* security, they hoard.
      *   *Better Twist for Hoarding:* The "Tax" or "Fee" mechanism. Or simply limiting the "Shop" hours.
      *   *Best Twist for *This* Scenario:* The "Rainy Day" mechanic. Announce that in the final round, tokens *might* be worthless, OR announce a "Bank Holiday." Actually, the user's problem is people *choosing* to hoard because they don't trust others to spend.
      *   *Revised Game Flow:*
          *   Round 1: Standard production/trade.
          *   Round 2: Introduce "Uncertainty" (Rumor of shop closing). Watch hoarding start. Production drops because no one spends.
          *   Round 3: Introduce "Fashion/New Wants" (New desirable item) OR "Demurrage" (Tokens lose value if held).
      *   *Wait, the prompt asks for specific Berkeley points:* Velocity, Hoarding, Creating Wants.
      *   *Game Structure:*
          *   **Phase 1: The Engine.** Earn chips by folding cranes. Spend chips on candy. (Establishes money = labor ticket).
          *   **Phase 2: The Freeze.** Stop selling candy. Tell them chips can be saved for a "Grand Prize" at the end. (Induces hoarding). Watch production stop. (Establishes hoarding kills industry).
          *   **Phase 3: The Spark.** Introduce a new "Want" (Auction for something unique) OR a rule that chips rot (Demurrage). Let's go with "New Want" first (Fashion), then maybe mention Demurrage in debrief as a solution. Actually, to match Berkeley's "fashion/wants," we need to *create* a desire.
          *   *Correction:* To match the user's specific pain point (people stuffing notes in drawers), Phase 2 needs to feel safe but stagnant.
          *   *Let's try this:*
              *   **Round 1:** Open Market. Produce -> Earn -> Spend on Candy. High velocity.
              *   **Round 2:** The "Safety" Trap. Announce candy is gone. Chips can be redeemed for a *big* prize at the very end. (Simulates "Rainy Day" saving). Result: No one spends, no one produces (because no one needs chips *now* to buy candy, and they already have enough for the prize).
              *   **Round 3:** The "Fashion" Injection. Introduce a limited edition "Gold Crane" or "VIP Pass" that can *only* be bought from other students, not the teacher. This forces circulation.

  4.  **Drafting the Rules & Logistics:**
      *   *Materials:* Poker chips (60), Index cards (for "contracts" or "goods"), Markers, Candy/Coffee.
      *   *Time:* 105 mins total (15 admin, 75 game, 15 debrief).
      *   *Roles:* Workers (everyone), Bank (Teacher), Shop (Teacher + 1 volunteer).
      *   *Production:* Folding index cards into specific shapes.
      *   *The "Accountants":* Give them the job of tracking the "Money Supply" vs. "GDP" (Cranes folded). This keeps them busy and validates their expertise.

  5.  **Addressing the "Real Stakes" & User's Community Meeting:**
      *   The class needs to output a verdict on the user's real scheme.
      *   *Mechanism:* "The Policy Council." At the end, present the *actual* stats from the user's community scheme (anonymized). Ask the class to prescribe a remedy based *only* on what worked in the game.
      *   *Output:* A "Manifesto of Findings." Not "We think," but "The simulation demonstrates."

  6.  **Troubleshooting:**
      *   *Rules Lawyer:* Pre-empt them. Make them the "Judge" or "Auditor." Give them ownership of the rules.
      *   *Nothing goes wrong:* If they don't hoard, force the "Uncertainty."
      *   *Ethical check:* Don't gamble with grades. Use candy/privileges.

  7.  **Berkeley Mapping:**
      *   Chips = Counters (Query 23).
      *   Folding = Industry (Query 5).
      *   Hoarding Phase = "Money... without producing labour... is direct gaming."
      *   Velocity = Less money fast vs. More money slow.
      *   Creating Wants = "Fashion and manufactured wants."

  8.  **Limitations:**
      *   Game is closed loop; real world has external trade.
      *   Game is short term; real trust takes years to build/break.
      *   Berkeley's theological/moral underpinnings (Providence) won't show up.

  9.  **Refining the "Verdict" for the Community Meeting:**
      *   The user needs ammo. The class shouldn't just say "Save it." They should say "If X condition is met, it survives. If not, it dies."
      *   The user can take this conditional logic to the meeting. "The economic logic suggests..."

  10. **Final Review against Constraints:**
      *   *Rules/Roles/Timeline:* Included.
      *   *Production:* Paper folding/tasks.
      *   *Hoarding Round:* Yes (The "Savings" trap).
      *   *Velocity/Wants:* Yes (The "Auction" or "Circulation" requirement).
      *   *Debrief:* Maps to Queries.
      *   *Troubleshooting:* Rules lawyer, apathy.
      *   *Limitations:* Honesty section.
      *   *Community Meeting:* The "Policy Memo" output.

  11. **Self-Correction during drafting:**
      *   *Initial thought:* Let them trade chips amongst themselves.
      *   *Correction:* Keep it simple. Teacher is the Bank/Shop. Students are Labor/Consumers.
      *   *Hoarding Mechanism:* If I just say "Save for a prize," they might still work to get *more* chips than others (competition). I need to make sure they stop working because there's *nothing to spend on*.
      *   *Better Hoarding Mechanism:* "The Shop is closed for 10 minutes. Keep your chips safe." Then reopen, but prices have doubled? No, that's inflation.
      *   *Best Hoarding Mechanism:* "Uncertainty." Tell them the Shop *might* run out of candy. Rational actors hoard. But if everyone hoards, the Shop closes early because no sales.
      *   *Wait, the user's problem:* People stopped spending because *others* stopped spending. It's a coordination failure.
      *   *Game Fix:* In Round 2, make the "Shop" dependent on volume. "If we don't sell 20 items this round, the Shop closes forever." If people hoard, the shop closes. This mirrors the mutual credit death spiral.

  12. **Final Polish:** Ensure the tone is empathetic to the organizer's burnout but rigorous for the philosophy class. (The user is tired; give them a script that runs itself).

  *(Self-Correction on the "Verdict"):* The user wants to know if the scheme is doomed. The class can't know for sure. The class can identify *conditions for survival*. The user can take those conditions to the meeting. "We survive IF we do X." That's actionable.

