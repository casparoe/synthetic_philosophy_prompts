answer: |-
  Mrs. Halloway stood to contradict the vote,
  Her bonnet trimmed, her voice a known amount.
  Mr. Jensen wrote the letter in his hand,
  And walked the market square to give account.

  The compositor picked the leaden type,
  The subscriber paid the coin upon the desk.
  One argued for the harvest and the price,
  Another claimed the war was growing less.

  The ink dries black without a master's name,
  And he who wrote it vanishes from sight.
  The argument is severed from the shame,
  It drifts away from where the speaker treads.

  Remarks are made the tax is far too high,
  The view is held without a signature.
  No face is turned to meet the questioning eye,
  No hand is raised to verify the error.

  Views are circulated through the street,
  Agreed upon by those who pass them on.
  There is no person left for blame to meet,
  The source of speech is already gone.

  We gather what the morning sheet has said,
  We hold the thoughts that hang in common air.
  No single head is liable to be led,
  The time has come to change what happens here.
