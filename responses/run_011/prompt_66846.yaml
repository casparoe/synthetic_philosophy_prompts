  "I define it narrowly," Elena said. "A stretch, not a moment. Years nine to fourteen in our case. A structural feature of the life, not a contingent accident. It has to be woven into the identity."

  "But you stipulated the life is worth living overall," Marcus said. "So the threshold is porous. If some suffering vetoes and some doesn't, you need a metric. And if you have a metric, you're weighing. If you're weighing, the veto is just a heavy weight. You're back to scalar. The word 'veto' is decoration."

  Elena was silent for a moment as the train slowed. "Maybe. But the weight is infinite. It breaks the scale."

  "Okay," Marcus said, sensing an opening. "Drop the second embryo. The unaffected one is gone. Now the choice is the affected child or no child at all. The stipulation still holds: their life is better than non-existence. They will thank you later. Does the veto still hold?"

  "Yes," Elena said softly.

  "Why? The alternative was the only thing that made the veto matter before. If the choice is A or Nothing, and A is net positive, you're denying them existence based on a stretch of pain they themselves will later judge worth enduring. You're privileging the nine-year-old's 'no' over the forty-year-old's 'yes'."

  "Because the nine-year-old cannot consent to the forty-year-old's judgment," Elena said. "The veto protects the temporal slice that cannot speak for the whole."

  "But there is no one to protect if you don't create them," Marcus said. "You're saying you won't create a person because a future version of them will suffer temporarily. That's not protecting them. That's avoiding the act."

  "It's avoiding the violation," Elena said. "Even if the victim later forgives the violator, the violation occurred."

  "But who is the victim?" Marcus asked again. "You keep circling this. If the veto is person-affecting, there must be a person. If there's no person, it's impersonal. If it's impersonal, why no duty to create the happy? You haven't solved the claimlessness problem. You've just named it."

  Elena looked out at the dark platform. "I concede the impersonal story is weak. I don't think it's impersonal. I think it's about the act's integrity. But you're right that without an alternative, it feels like I'm punishing the potential child for suffering."

