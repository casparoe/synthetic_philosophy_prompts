  "Imposition on whom?" Marcus pressed. "On the non-existent? That's metaphysical nonsense. Or is it on us, the creators? If it's on us, it's just a scalar weight on our conscience. You're using deontic vocabulary—'veto,' 'exclusionary'—to dress up a very steep utilitarian cost. You haven't explained the kind difference, only the intensity."

  "It's not a cost," Elena insisted. "It's a boundary. Think of the threshold. You asked about 'uncompensated.' I mean strictly: suffering that the subject, *while enduring it*, would not accept for any reason. Not later reconciliation. Not whole-life calculation. At the time, it is pure loss."

