      The train lurched forward from the second stop, the carriage half-empty and humming with the fatigue of late hours.
      Marcus loosened his tie. "Let's reset the case. You have two embryos. One carries the condition, one doesn't. We stipulate the affected child's life, overall, is slightly better than the unaffected child's. Yet you say the veto forbids the affected one."
      Elena nodded, watching the tunnel lights streak. "Because of the stretch between nine and fourteen. Pain they wouldn't accept at the time. That episode is uncompensated *in the moment*. It vetoes the creation."
      "So," Marcus said, "if I have a world with ten billion wonderful lives, and one person with that specific stretch of pain, your veto forbids the world?"
      "It forbids the act of creating that person within that world, yes."
      "That's the scale objection. You're letting one episode of suffering trump ten billion flourishing lives. That's not an asymmetry; that's a lexically priority view that leads to a repugnant conclusion of its own. You'd rather have zero lives than ten billion plus one sufferer?"
      "I'm not saying the world is worse," Elena corrected. "I'm saying the *option* is closed. The reason against creating the sufferer is exclusionary. It doesn't weigh against the happiness of others; it removes the candidate from the sum. The ten billion don't justify the one vetoed entry."
      "But who is the veto for?" Marcus leaned forward. "That's the claimlessness problem. If you don't create them, no one exists to be better off. If you do create them, they say later it was worth it. So who is wronged by the creation? If no one, the veto is impersonal. But if it's impersonal, why isn't there an impersonal reason to create the happy ones? You said reasons to create are merely contributory. You can't have impersonal vetoes without impersonal mandates."
      "The veto isn't about a victim's complaint," Elena said. "It's about the structure of the agency. To create a life is to impose a history. If that history contains a chapter that cannot be endorsed from within its own timeframe, the imposition is impermissible. The happy life doesn't impose anything; it offers a gift. You can't be owed a gift, but you can be protected from an imposition."
      "Imposition on whom?" Marcus pressed. "On the non-existent? That's metaphysical nonsense. Or is it on us, the creators? If it's on us, it's just a scalar weight on our conscience. You're using deontic vocabulary—'veto,' 'exclusionary'—to dress up a very steep utilitarian cost."
      "It's not a cost," Elena insisted. "It's a boundary. Think of the threshold. You asked about 'uncompensated.' I mean strictly: suffering that the subject, *while enduring it*, would not accept for any reason. Not later reconciliation. Not whole-life calculation. At the time, it is pure loss."
      "And how common is that?" Marcus countered. "That's the threshold objection. Almost every life has moments of pure, unredeemed agony. A broken bone, a heartbreak, a panic attack. If that triggers the veto, procreation is generally impermissible. You're not defending an asymmetry; you're defending anti-natalism."
      "I define it narrowly," Elena said. "A stretch, not a moment. Years nine to fourteen in our case. A structural feature of the life, not a contingent accident. It has to be woven into the identity."
      "But you stipulated the life is worth living overall," Marcus said. "So the threshold is porous. If some suffering vetoes and some doesn't, you need a metric. And if you have a metric, you're weighing. If you're weighing, the veto is just a heavy weight. You're back to scalar."
      Elena was silent for a moment as the train slowed. "Maybe. But the weight is infinite. It breaks the scale."
      "Okay," Marcus said, sensing an opening. "Drop the second embryo. The unaffected one is gone. Now the choice is the affected child or no child at all. The stipulation still holds: their life is better than non-existence. They will thank you later. Does the veto still hold?"
      "Yes," Elena said softly.
      "Why? The alternative was the only thing that made the veto matter before. If the choice is A or Nothing, and A is net positive, you're denying them existence based on a stretch of pain they themselves will later judge worth enduring. You're privileging the nine-year-old's 'no' over the forty-year-old's 'yes'."
      "Because the nine-year-old cannot consent to the forty-year-old's judgment," Elena said. "The veto protects the temporal slice that cannot speak for the whole."
      "But there is no one to protect if you don't create them," Marcus said. "You're saying you won't create a person because a future version of them will suffer temporarily. That's not protecting them. That's avoiding the act."
      "It's avoiding the violation," Elena said. "Even if the victim later forgives the violator, the violation occurred."
      "But who is the victim?" Marcus asked again. "You keep circling this. If the veto is person-affecting, there must be a person. If there's no person, it's impersonal. If it's impersonal, why no duty to create the happy? You haven't solved the claimlessness problem. You've just named it."
      Elena looked out at the dark platform. "I concede the impersonal story is weak. I don't think it's impersonal. I think it's about the act's integrity. But you're right that without an alternative, it feels like I'm punishing the potential child for suffering."
      "So the veto depends on alternatives?" Marcus asked. "If the unaffected embryo exists, the affected one is vetoed. If it doesn't, is it still vetoed? If yes, you're an anti-natalist. If no, then the veto isn't about the suffering itself, but about the availability of better options. That makes it scalar again. It's just a very high cost of choosing the worse option."
      "It's not scalar," Elena said, though her voice lacked its earlier certainty. "The presence of the unaffected embryo makes the suffering *gratuitous*. Without it, the suffering is necessary for the existence. But..." She paused. "If I say it's permissible without the alternative, I admit the veto isn't absolute. It's sensitive to context."
      "And if it's sensitive to context, it's weighable," Marcus said. "And if it's weighable, it's not a veto. It's just a heavy reason. You wanted a kind difference, not a degree difference. I think the threshold objection drew blood there. You can't define 'uncompensated' without weighing."
      "I still think the kind is different," Elena said. "But I concede that without the alternative, the veto loses its force. I can't forbid existence itself based on a stretch of pain the person will later endorse. That would be arrogance."
      "So the asymmetry collapses into a requirement to choose the best embryo," Marcus said. "Which is standard ethics. You don't need a veto for that."
      "You need it to explain why we don't regret the happy people we never had," Elena said. "Contributory reasons don't generate regret when unfulfilled. Exclusionary reasons generate relief when obeyed. That part stands."
      "But only if there's an option to exclude," Marcus said. "If the only option is creation, you create. So the veto is conditional."
      "Conditional," Elena agreed. "But still exclusionary when triggered."
      "Then it's not the suffering that vetoes," Marcus said. "It's the avoidability. And that's just standard harm avoidance."
      The train halted at their station. They stood, gathering their coats.
      "You didn't answer the claimlessness," Marcus said, opening the door. "Who is the veto for?"
      "I don't know," Elena said, stepping onto the platform. "But I know the nine-year-old shouldn't endure it for the sake of the forty-year-old. Even if the forty-year-old says thanks."
      "Then you're not talking about procreation," Marcus said. "You're talking about sacrifice. And no one exists to sacrifice until you create them."
      They walked into the night, the argument suspended but the fault lines clear. The scale objection had bounced; the veto held against the ten billion. But the threshold had blurred, and the claimlessness remained a ghost in the machine, haunting the defender's certainty.

