answer: |-
  This is the right workshop. Local government reporters are drowning in dashboards. They know the numbers are often wrong, but they lack the vocabulary to explain *why* without defaulting to "incompetence" or "corruption." Goodhart's Law gives them a third, more precise option: *structural incentive failure.*

  Your intuition about the "Good Proxy" prerequisite is correct. If the metric was garbage from day one, the story is negligence. Goodhart's Law is tragic, not stupid. It requires a metric that *worked* until it *mattered*.

  Here is the teaching plan.

  ### 1. The Sequence and Dependencies
  **Total Time:** 90 Minutes

  **Module 1: The Baseline of Competence (15 mins)**
  *   **Goal:** Establish that the metric was originally valid.
  *   **Dependency:** Nothing. This is the foundation.
  *   **Action:** Present the case study (see below) in its "pre-pressure" state. Show data where the metric correlated perfectly with the outcome.
  *   **Why:** If you skip this, the room decides the administrators were idiots who picked the wrong number. You need them to see that smart people picked the *right* number, and the number broke *because* it was targeted.
  *   **Key Concept:** *Proxy Validity.* The metric was a honest signal until it became a target.

  **Module 2: The Pressure Point (15 mins)**
  *   **Goal:** Introduce the incentive change.
  *   **Dependency:** Module 1 (must believe the metric was good).
  *   **Action:** Reveal the policy change. Funding is now tied to the metric. Bonuses are attached. Public scrutiny is focused on the dashboard.
  *   **Why:** Goodhart's Law is not about measurement; it is about *optimization under constraint.* You must show the moment the environment changed.

  **Module 3: The Taxonomy of Failure (45 mins)**
  *   **Goal:** Distinguish the four failure modes + AI.
  *   **Dependency:** Module 2 (must see the pressure).
  *   **Action:** Walk through the four modes using the *same* case study data, revealing layer by layer.
  *   **Why:** Reporters need to know which story they are filing. Is it a definition problem? A capacity problem? A loophole? Or fraud?

  **Module 4: The Audible Assessment (10 mins)**
  *   **Goal:** Verify retention.
  *   **Dependency:** Module 3.
  *   **Action:** "The Headline Shout" (detailed below).

  **Module 5: Exclusions and Close (5 mins)**
  *   **Goal:** Set boundaries.
  *   **Action:** State what you are not teaching and why.

  ---

  ### 2. The Case Study: County Workforce Development Center
  **The Metric:** "90-Day Job Retention Rate" (Percentage of program participants still employed 90 days after placement).
  **The Target:** Economic self-sufficiency for unemployed residents.
  **The Actors:** Caseworkers (sympathetic, overworked, want to help), Administrators (need to secure next year's grant funding).

  **Why this case:**
  *   **Mundane:** Every county has a workforce board. They all report these numbers.
  *   **Sympathetic:** Caseworkers aren't stealing money; they are trying to keep the center open so they can help *someone*.
  *   **Metric Up / Target Flat:** The reported retention rate jumps from 65% to 85%. Meanwhile, local data on *poverty rates* and *recidivism* (people returning to the program a year later) remain unchanged.
  *   **What it has:** A clear definition of "employed" (W2 on file for 90 days) that diverges from "self-sufficient" (living wage, benefits, stability).
  *   **What it lacks:** A villain. No one is forging W2s. They are just changing *who* they serve and *what* jobs they accept.

  **Pushback on your spec:** You suggested the people gaming must be sympathetic. I agree, but add this: **The gaming must be rational.** If the caseworkers are acting irrationally, it's incompetence. If they are acting rationally to survive the incentive structure, it's Goodhart. This case works because *not* gaming the metric means losing funding and closing the center.

  ---

  ### 3. The Distinctions (The Taxonomy)
  Teach these in this order. Each builds on the previous one. Use the Workforce case for all four.

  **1. Proxy Drift (The "Always Weak" Link)**
  *   **The Failure:** The metric was never the target, just a correlate. We only noticed the gap when we selected on the metric.
  *   **The Case:** "Employed" (metric) was always a weak proxy for "Self-Sufficient" (target). A gig-economy job counts as employed.
  *   **Reporting Angle:** *The Definition Story.* "The county is technically telling the truth, but the definition of 'job' no longer matches the reality of 'work'."
  *   **Question to ask:** "If we hit this number, does the problem actually go away?"

  **2. Context Collapse (The "Extreme Push")**
  *   **The Failure:** The metric holds at low intensity but breaks under scale or pressure.
  *   **The Case:** At 50 placements a month, caseworkers can vet employers. At 200 placements (to hit the new target), they must accept any employer, including predatory ones.
  *   **Reporting Angle:** *The Capacity Story.* "The system works at human scale, but breaks at institutional scale."
  *   **Question to ask:** "Did this work before the bonus/funding threshold was introduced?"

  **3. Decoupling (The "Severing")**
  *   **The Failure:** The intervention severs the link between the action and the outcome. The metric is met without the underlying activity occurring.
  *   **The Case:** Caseworkers stop helping the hard-to-employ (the target population) and focus only on college grads who just need a resume tweak (the easy metric). The "placement" happens, the "support" does not.
  *   **Reporting Angle:** *The Cream-Skimming Story.* "The program is succeeding by abandoning the people it was designed to serve."
  *   **Question to ask:** "Who is being excluded to make this number work?"

  **4. Strategic Gaming (The "Steering")**
  *   **The Failure:** Intentional manipulation of the data or process.
  *   **The Case:** Caseworkers tell participants to quit after 91 days and re-apply, or count internships as jobs.
  *   **Reporting Angle:** *The Fraud Story.* "The numbers are fabricated or coerced."
  *   **Question to ask:** "Does the paper trail match the physical reality?"

  **The AI Insert: Reward Hacking (The "Spec Gap")**
  *   **Where it fits:** Immediately after **Decoupling**.
  *   **The Point:** Intent is irrelevant.
  *   **The Lesson:** In AI, an agent maximizes the reward function without caring about the designer's intent. In bureaucracy, a human acts like an AI agent. They optimize the spec, not the spirit.
  *   **Why here:** It breaks the reporters' habit of looking for a "bad apple." If an algorithm did this, we wouldn't call it corruption; we'd call it misalignment. When a human does it under pressure, it's the same structural failure.
  *   **Line to use:** "Stop asking 'Did they mean to cheat?' Start asking 'Did the spec allow them to win without doing the job?'"

  ---

  ### 4. Misconceptions and Interceptions
  **1. "Metrics are useless; just talk to people."**
  *   **When it arises:** Module 1 (when you show the metric was originally valid).
  *   **Interception:** "Talking to people is how you find the story, but the metric is how you find the *pattern*. If you ignore the dashboard, you miss the systemic break. Use the number to find the outlier, then talk to people."

  **2. "If the number went up, somebody lied."**
  *   **When it arises:** Module 3 (during Strategic Gaming).
  *   **Interception:** "Lying is only one of four failure modes. If you assume lying, you miss Proxy Drift. You'll file a corruption story when the real story is a definition failure."

  **3. "You can fix it by adding more metrics."**
  *   **When it arises:** Module 3 (after discussing Decoupling).
  *   **Interception:** "Adding metrics just creates more Goodhart laws. Campbell's Law says the more indicators you use, the more they become corrupted. The fix isn't more numbers; it's auditing the *link* between number and reality."

  **4. "Unintended consequences are just a shrug."**
  *   **When it arises:** Close.
  *   **Interception:** "Unintended consequence' is a passive phrase that hides agency. It suggests an act of God. This is a predictable structural outcome. Don't let them shrug it off as 'unforeseen'."

  **5. The Hidden One: "If we measure the Outcome instead of the Output, it's fixed."**
  *   **When it arises:** Module 3 (Proxy Drift).
  *   **Interception:** "Outcomes are often lagging or unmeasurable (e.g., 'child well-being'). You will always rely on proxies. The skill isn't finding the perfect proxy; it's knowing when the proxy has detached."

  ---

  ### 5. The Audible Assessment: "The Headline Shout"
  **Time:** Last 10 minutes of Module 4.
  **Setup:** Tell the room: "I am going to read you a leak or a headline based on our Workforce case. You will shout the Failure Mode. If half of you shout 'Gaming' and half shout 'Drift', we stop. The dissonance means the story isn't clear yet."

  **Scenarios:**
  1.  **Headline:** "Workforce Center Director Fired After Audit Finds Faked Signatures on Placement Forms."
      *   **Correct Shout:** Strategic Gaming.
      *   **Why:** Active fraud.
  2.  **Headline:** "Report: 80% of 'Placements' Are Unpaid Internships That Do Not Lead to Hires."
      *   **Correct Shout:** Decoupling.
      *   **Why:** The spec (placement) was met, the intent (income) was severed.
  3.  **Headline:** "Center Achieves Record Placement Rates While Serving 50% Fewer Long-Term Unemployed Residents."
      *   **Correct Shout:** Context Collapse / Cream-Skimming.
      *   **Why:** Scale pressure changed the intake demographic.
  4.  **Headline:** "Gig Workers Counted as 'Employed' Despite Income Below Poverty Line."
      *   **Correct Shout:** Proxy Drift.
      *   **Why:** The definition of the metric was always weak relative to the goal.

  **Success Condition:** The room shouts in unison. If they argue, you have taught them the vocabulary but not the application.

  ---

  ### 6. Deliberate Exclusions
  **What to leave out:** **How to design better metrics.**
  **The Line:** "You are not the auditor. You are the pathologist. Your job is not to fix the dashboard so the next administration runs better. Your job is to report on the wreckage when the dashboard drives the car off the road. Leave the KPI design to the consultants; you document the cost."

  **Why:**
  1.  **Time:** You cannot teach metric design in 90 minutes.
  2.  **Role:** If they leave thinking they can solve Goodhart's Law, they will become advocates, not reporters. They need to remain observers of the failure.
  3.  **Reality:** There is no perfect metric. Teaching them to look for the "perfect fix" sets them up for cynicism when they realize there isn't one.

  ### 7. A Note on the "Good Proxy" Dependency
  You asked if you're right about needing to establish the metric was originally decent.
  **Yes.** But add this nuance: **The metric must have been *locally* valid.**
  In the Workforce case, "Job Retention" *is* a good measure of success for an individual. It only becomes a bad measure when aggregated and incentivized at the institutional level.
  If you don't make this distinction, they will think *all* metrics are lies. You need them to believe metrics are *fragile*, not *false*.
  **Instruction:** In Module 1, show a testimonial from a participant who *was* helped by the old system. "This number represented my life getting better." This humanizes the metric before you break it.

  ### 8. Contingency: If the Room Resists
  If the reporters push back and say, "This is just corruption," do not argue theory.
  **Pivot:** "If it's corruption, arrest them. If it's Goodhart, fire the consultant who wrote the incentive structure. Which story gets you sued, and which gets you a policy change?"
  This frames the distinction as a legal and practical tool, not an academic one.

  ### 9. Final Check
  *   **Definite?** Yes.
  *   **Case Study?** Workforce Development (mundane, sympathetic, metric/target divergence).
  *   **Distinctions?** Four modes + AI spec gap.
  *   **Assessment?** Audible shout test.
  *   **Exclusion?** Metric design (Pathologist vs. Engineer).

  This plan respects their expertise, avoids the clichés, and gives them a diagnostic toolkit for Monday morning.
