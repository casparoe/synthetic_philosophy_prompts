answer: |-
  DECISION TREE: NORMATIVE POSITIONS ON CROSS-BORDER REPRODUCTION

  Q1. Imagine a woman signs a contract to carry a child for a fee. She is healthy, has independent legal advice, and is paid well above her local average wage. Is the contract morally void simply because money has touched the transaction, regardless of how fair the terms are?
      Yes (Money Degrades) -> Go to Q1b.
      No (Money Neutral) -> Go to Q2.

      Q1b. If the contract is morally void, should the state treat the parties as criminals deserving prison, or merely as people who made an unenforceable civil agreement?
          Criminals -> Leaf 1: The Abolitionist.
          Civil Only -> Leaf 2: The Inalienabilist.

  Q2. Is selling genetic material (eggs) morally identical to renting bodily capacity (gestation for nine months), or is one fundamentally more invasive than the other?
      Different -> Go to Q2b.
      Identical -> Go to Q3.

      Q2b. Which one is permissible?
          Eggs Yes, Gestation No -> Leaf 3: The Tissue Vendor.
          Eggs No, Gestation Yes -> Leaf 4: [Unnamed].

  Q3. Assume both eggs and gestation can be sold. If the deal is arranged through a profit-seeking agency that advertises, matches, and packages the service, does that middleman make the arrangement exploitative even if the direct deal would be fine?
      Yes (Agencies Corrupt) -> Leaf 5: The Brokerage Critic.
      No (Agencies Neutral) -> Go to Q4.

  Q4. Assume agencies are permissible. Is the arrangement unethical specifically because it requires the commissioning parents to travel to a jurisdiction with lower wages and weaker safety nets to complete it?
      Yes (Travel Exports Risk) -> Leaf 6: The Neocolonial Critic.
      No (Travel Neutral) -> Go to Q5.

  Q5. Assume the arrangement is permissible domestically and abroad. The child is born, and the gestator bonds with the baby and refuses to hand it over. Should the court force the handover based on the pre-birth contract, or does the gestator's physical labor give her the final say?
      Gestator Keeps Child -> Go to Q5b.
      Commissioners Keep Child -> Go to Q6.

      Q5b. Is the gestator permitted to keep the child only if the arrangement was unpaid, or even if she was paid?
          Unpaid Only -> Leaf 7: The Altruist.
          Paid Allowed -> Leaf 8: The Protectionist.

  Q6. Assume the commissioners keep the child based on the contract. If a citizen arranges this in a country where it is lawful, should their home country prosecute them for a crime upon return?
      Yes (Law Follows Citizen) -> Leaf 9: The Extraterritorialist.
      No (Law Stops at Border) -> Go to Q7.

  Q7. In a lawful commercial arrangement, should the state set price floors, mandate specific medical screening, and supervise the transfer, or should the price and terms be set entirely by the market?
      State Supervision -> Leaf 10: The Regulated Commercialist.
      Free Market -> Leaf 11: The Contractarian.

      (Note: To ensure 12 leaves, we split the "Different" branch in Q2b further or add a specific variance on Q3. Let us add a variance on Q3 regarding State Monopoly).
      
      Q3b. (Alternative Branch from Q3 No). If agencies are permissible, should only state-run clinics be allowed to match parties, banning private profit entirely?
          Yes -> Leaf 12: The State Monopolist.
          No -> Return to Q4.

  LEAVES OF THE TREE

  Leaf 1: The Abolitionist
      Awkward Commitment: This view must argue that a wealthy woman who pays a friend to carry her child to spare her own medical risk is as morally culpable as a trafficking ring.
      Vignette: At the dinner table, the Abolitionist calls for the arrest of the commissioning mother who just returned from abroad; the Inalienabilist next to her argues the mother should be pitied and the contract simply voided, not punished.

  Leaf 2: The Inalienabilist
      Awkward Commitment: This view permits the act but offers no remedy if the agency keeps the money and delivers nothing, leaving the vulnerable party without legal recourse.
      Vignette: When the clinic shuts down and vanishes with the escrow funds, the Inalienabilist tells the women they cannot sue to recover losses because the court cannot recognize the debt; the Abolitionist says they should have been protected by criminal law in the first place.

  Leaf 3: The Tissue Vendor (Egg Yes, Womb No)
      Awkward Commitment: This view must explain why removing cells from an ovary is labor, but carrying a fetus that alters blood, bone, and organ function for nine months is not.
      Vignette: The Tissue Vendor signs a consent form to sell her eggs for tuition but refuses to sign a surrogacy contract for the same money; the Contractarian asks why her body is a shop for parts but not a vessel for service.

  Leaf 4: [Unnamed] (Egg No, Womb Yes)
      Awkward Commitment: This view treats the womb as a service provider but the egg as a sacred potential human, struggling to explain why the genetic contributor has fewer rights than the gestational one.
      Vignette: This character argues the egg donor should remain anonymous and unpaid to protect the child's identity, while insisting the gestator deserves a full salary and a named contract; the Tissue Vendor calls this a fetishization of genetics over labor.

  Leaf 5: The Brokerage Critic
      Awkward Commitment: This view struggles to explain why a private lawyer who matches a couple to a carrier for a fee is criminal, while a non-profit clinic doing the exact same matching is virtuous.
      Vignette: When two friends arrange a surrogacy using a paid lawyer to draft the terms, the Brokerage Critic objects to the lawyer's fee but not the mother's compensation; the Contractarian asks why the facilitator is the villain when the buyer and seller consent.

  Leaf 6: The Neocolonial Critic
      Awkward Commitment: This view must forbid a wealthy citizen from using a clinic in a poorer country even if that clinic is safer and better regulated than any domestic option.
      Vignette: The Critic condemns a couple for going to a jurisdiction with universal post-natal care for carriers; the Extraterritorialist agrees they should be punished, but the Regulated Commercialist argues the safety standards prove the act itself isn't inherently exploitative.

  Leaf 7: The Altruist
      Awkward Commitment: This view relies on a supply of women willing to undergo pregnancy risks for free, which often results in long waiting lists that pressure friends or family into unpaid service.
      Vignette: When a sister offers to carry for free, the Altruist praises the bond; the Protectionist whispers that the sister is now unable to say no to future requests, turning love into a debt that cannot be quantified or discharged.

  Leaf 8: The Protectionist (Paid but Unenforceable)
      Awkward Commitment: This view allows the payment but removes the commissioners' guarantee of the child, making the financial transaction a gift rather than a purchase, which confuses the tax and legal status.
      Vignette: When the gestator decides to keep the baby after taking the fee, the Protectionist says she is within her rights; the Contractarian points out this effectively legalizes theft of the intended parents' genetic material and medical investment.

  Leaf 9: The Extraterritorialist (The Italian Model)
      Awkward Commitment: This view asserts that a citizen's moral duty to home law overrides the sovereignty of the host nation where the act was explicitly legal.
      Vignette: At the border, the Extraterritorialist hands the parents' passports to the police for a crime committed in a country that celebrated their parenthood; the Neocolonial Critic agrees with the result but argues the crime is the exploitation, not the breach of domestic statute.

  Leaf 10: The Regulated Commercialist
      Awkward Commitment: This view requires a bureaucracy to assess "psychological suitability" for parenthood, granting state officials veto power over who is fit to raise a child.
      Vignette: The Regulated Commercialist supports a judge denying a transfer because the commissioners' income fluctuated during the pregnancy; the Contractarian argues that market risk should not disqualify parental rights once the child is born.

  Leaf 11: The Contractarian
      Awkward Commitment: This view must accept that a gestator could be forced to undergo a medical procedure (like a C-section) if it was stipulated in the contract as necessary to secure the "goods."
      Vignette: When the contract specifies a C-section for scheduling convenience, the Contractarian says the signature binds the body; the Protectionist recoils, arguing no signature can validly consent to surgical coercion, regardless of payment.

  Leaf 12: The State Monopolist
      Awkward Commitment: This view concentrates all reproductive matching in government hands, creating a single point of failure where political shifts can halt all family formation.
      Vignette: When the government freezes matching due to a budget shortfall, the State Monopolist accepts the delay as necessary for oversight; the Brokerage Critic argues that private matching would have allowed the desperate couples to proceed safely without profit.

  UNEXPLORED CELLS (Combinations permitted by the tree but unheld)

  1.  The "Domestic Crime, Foreign Immunity" Position (Q1b: Criminalize / Q6: No Extraterritoriality).
      Classification: Merely Unattractive.
      Reasoning: This position holds that surrogacy is so harmful it should be a crime at home, but citizens should be free to commit it abroad without penalty. It is logically consistent (jurisdictional modesty) but politically unstable, as it effectively licenses citizens to evade moral prohibitions by traveling.

  2.  The "Paid but Genetic Primacy" Position (Q5: Commissioners Keep / Q2: Eggs No, Womb Yes).
      Classification: Unexplored.
      Reasoning: This view allows paid gestation but argues the egg donor (not the gestator, not the commissioners) should have custody rights if disputes arise. It treats gestation as labor but genetics as identity. It is unexplored likely because it destabilizes the commissioning couple's claim entirely, creating a three-party custody battle nobody wants to legislate.

  3.  The "Agency OK, Direct Deal Forbidden" Position (Q3: Agencies Neutral / Q3b: Private Match Criminal).
      Classification: Incoherent.
      Reasoning: This view would permit a profit-seeking middleman to arrange the deal but forbid the parties from finding each other directly. It assumes intermediaries reduce harm while simultaneously restricting the freedom of the parties they serve, creating a monopoly without a state actor.

  INDISTINGUISHABLE LEAVES (Empirical vs. Normative)

  Leaf 6 (Neocolonial Critic) and Leaf 9 (Extraterritorialist).
      These two leaves often vote the same way (prosecute the traveling parents) and use similar language about harm. However, they differ on an empirical premise: The Neocolonial Critic believes the act is inherently harmful due to global inequality (Normative: The act is wrong). The Extraterritorialist believes the act may be lawful abroad but violates domestic sovereignty (Normative: The breach of law is wrong). In a scenario where the foreign country is wealthier than the home country, the Neocolonial Critic might permit the travel, while the Extraterritorialist would still prosecute.

  Leaf 10 (Regulated Commercialist) and Leaf 11 (Contractarian).
      These leaves agree on enforceability and payment. They differ on the empirical premise of whether state supervision actually reduces coercion. If a study proved regulation increased black markets, the Regulated Commercialist might migrate to Contractarianism; if a study proved free markets increased maternal mortality, the Contractarian might migrate to Regulation. Their normative commitment to "enforceable contracts" is identical; their disagreement is on the machinery of safety.

  CLOSING NOTE

  The branching question doing the most work is Q5 (Conflict Resolution: Who keeps the child?). This is the fulcrum where abstract theory meets human consequence; it separates those who view the child as a product of contract from those who view the child as an extension of the gestator's bodily autonomy. It is the point where "autonomy" and "exploitation" cease to be slogans and become custody rulings.

  The tree is most unstable at Q3 (Intermediaries). A small change in wording from "profit-seeking agency" to "third-party facilitator" would collapse Leaf 5 (Brokerage Critic) into Leaf 12 (State Monopolist) or Leaf 10 (Regulated Commercialist), as the moral objection shifts from *profit* to *interference*. This is where a character might slide from one leaf to another without realizing they have changed their mind, simply by redefining what counts as a "middleman."
