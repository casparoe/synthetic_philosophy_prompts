  10. **Final Polish:** Ensure tone is appropriate for a reading group prep (rigorous, charitable, precise). Make sure to explicitly answer the "ranked tension" and "single revision" prompts.

      *(Self-Correction on the "Single Revision"):* If I tell them to fix (2), does that solve (4) and (7)? Yes, because (4) and (7) become exceptions to a narrower rule. If I tell them to fix (4), it solves the tension with (2) but weakens the political stance. Fixing (2) is the "least cost" because (2) as written is technically false (self-defense).

      *(Wait, one more check on (1)):* "Sedition... falls most heavily on the one who starts it." Aquinas says the *tyrant* is often the real seditious person (because he disrupts the unity of the common good). The private killer is *also* seditious. The user says the killer is the "worst party." This might be a point of contention. Aquinas (*De Regno*) suggests the tyrant is guilty of sedition. I should flag this.

      *(Refining the "Single Revision"):* Actually, the biggest logical hole is (2). It's too broad. But the biggest *political* vulnerability is (4). However, logically, (2) contradicts (4). So (2) must be the one to move.

