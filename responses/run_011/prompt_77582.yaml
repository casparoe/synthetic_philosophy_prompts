      *   (2) *Private people may never kill.* Requires public authority or direct divine command.
      *   (3) *Biblical cases (Judith, Ehud) = special commission.* Not private citizens acting privately.
      *   (4) *Killing a usurper (no title) = permitted/required by anyone.*
      *   (5) *Tyrant (with title) has genuine authority.* Unjust rule is still genuine rule. Hence, no private killing.
      *   (6) *Intending evil as means is forbidden.* Killing innocent = intending evil. (Seems like a side constraint, mostly consistent with standard NL).
      *   (7) *Deposed ruler/legitimately overthrown = loses immunity.* Can be killed by private persons (no public authority needed).

  3.  **Initial Consistency Check (Mental Sandbox):**

      *   *Tension A:* (2) says private people *never* kill without public authority/divine command. (4) says private people *can* kill a usurper. (7) says private people *can* kill a deposed ruler.
          *   *Resolution:* (4) and (7) imply the target lacks authority, so the killer isn't usurping public authority. But (2) says "taking a life requires... public authority." Does this mean the *killer* must have authority, or the *act* must be authorized? Usually, Thomists mean the killer must act *as* an instrument of public authority. If the target is a usurper/outlaw, are they outside the political community? If so, does the killer need public authority?
      *   *Tension B:* (1) says private tyrannicide is sedition. (5) says the tyrant has real authority. This hangs together well (attacking real authority = sedition).
      *   *Tension C:* (4) vs. (5). (4) Usurper (no title) -> Kill. (5) Tyrant (has title) -> Don't Kill. This is a standard distinction (Tyrant *ex defectu tituli* vs. Tyrant *ex parte exercitii*).
      *   *Tension D:* (7) vs. (2). If a ruler is deposed, who deposed him? If subjects threw him off, did they act as a public body or private mob? If private, how did they depose him without violating (2)? If public, who holds authority now? If no one holds authority (state of nature/anarchy), can private individuals kill?

  4.  **Addressing the User's "Two Things to Engage With":**

      *   *Question 1:* If target in (4)/(7) has no authority, is there a superior missing? What work is (2) doing?
          *   *Analysis:* (2) is the general rule: *Vindictive justice* belongs to the public. (4) and (7) are exceptions based on the *status of the target*, not the *authority of the agent*. In Thomistic terms, a usurper/outlaw is like a dangerous animal or an invading soldier. You don't need a judge's warrant to kill an invading soldier in self-defense/defense of community. So (2) applies to *judicial/executive* killing within a polity. (4)/(7) apply to *defensive* killing against an external/internal threat that lacks legal standing.
          *   *Risk:* If (4) allows *anyone* to kill a usurper, does that invite the sedition of (1)? How do we distinguish a "usurper" from a "tyrant with title"? This is the practical friction point.
      *   *Question 2:* What makes (1) true given (5)? Who is the seditious party?
          *   *Analysis:* If the regime is unjust, why is attacking it sedition? Because "sedition" is against the *unity of the multitude*, not necessarily the justice of the ruler. Aquinas (ST II-II, Q42) says sedition is contrary to the unity of the multitude. Even a bad unity is better than civil war (usually). The seditious party is the private individual who fractures the social order. The *tyrant* sins against justice; the *tyrannicide* sins against charity/peace.
          *   *Risk:* This sounds like quietism. Needs careful phrasing about "public authority" being the only remedy.

  5.  **Identifying Misstatements of Source (Thomistic Accuracy):**

      *   (1) *Sedition is always mortal.* Aquinas says sedition is a mortal sin *ex genere suo* (by its kind), but acknowledges nuances. Calling the tyrannicide the "worst party" is strong. Aquinas says tyrannical government is worse than sedition? No, he says sedition is worse than the tyranny it opposes? Actually, Aquinas is cautious. He says deposing a tyrant is not sedition *if* done by public authority. Private action is problematic.
      *   (2) *Private people may never kill.* Self-defense is the obvious exception (ST II-II, Q64, A7). The user probably means "political killing" or "vindictive killing." Needs clarification.
      *   (4) *Killing a usurper... required.* This is strong. Suarez and Vitoria discuss this. It's generally *permitted*, "required" is a high bar.
      *   (7) *Deposed ruler... loses immunity.* This is tricky. If he's deposed, who deposed him? If private persons, they violated (2). If public body, then the killer is acting on behalf of that body? Or is the ruler now an outlaw?

  6.  **Ranking Tensions:**

      *   *High:* (2) vs. (4)/(7). (2) says private people *never* kill (without public authority). (4)/(7) say they *can* kill usurpers/deposed rulers. This is a direct contradiction unless "public authority" is redefined in (4)/(7) to mean "the community acting defensively."
      *   *Medium:* (1) vs. (5). Why is it sedition to kill an unjust ruler? (Explained above, but needs nuance).
