          *   Propose a single revision to clean up the most issues.
          *   *Crucially:* Engage with two specific hard questions (Authority in 4/7 vs. 2; Sedition in 1 vs. 5).
          *   Check for misstatements of sources (Aquinas, Suarez, Vitoria, etc.).

  2.  **Analyze the 7 Commitments:**

