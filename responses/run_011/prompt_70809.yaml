answer: |-
  The normative divergence between the Nash and Kalai–Smorodinsky solutions centers on how bargaining power is conceptualized: is it derived from the local trade-offs at the agreement (Nash), or from the global structure of potential gains (Kalai–Smorodinsky)?

  (a) The ideal point functions as a normative anchor for *potential* bargaining power. By fixing the slope of the bargaining ray to the ideal point, the Kalai–Smorodinsky solution ensures that if a player's maximum possible payoff increases (expanding the feasible set in their favor), their actual agreement payoff does not decrease. This monotonicity intuition captures the idea that leverage is derived from available opportunities, not just the immediate frontier; having a higher "ceiling" strengthens one's position even if the ceiling is unreachable. Nash's Independence of Irrelevant Alternatives (IIA) suppresses this, insisting that options not chosen should not influence the outcome. The objection that Kalai–Smorodinsky allows a player to improve their share by acquiring "phantom options" (unused alternatives that merely raise the ideal point) is peculiar to Kalai–Smorodinsky. Nash satisfies IIA by definition, so unused options cannot alter the Nash solution. For Kalai–Smorodinsky, this sensitivity is not fatal; it is the deliberate price of satisfying monotonicity, prioritizing the reward of improved potential over strict consistency across sub-problems.

  (b) The equal-proportions rule does not presuppose that the spans measure comparable amounts of well-being; this presupposition is avoided by the affine-invariance requirement. Because each player's utility can be rescaled independently without changing the solution, the ratio of actual gain to ideal gain is a dimensionless number internal to each player's scale. Equating these ratios asserts a fairness principle based on relative satisfaction within the specific bargaining context, rather than requiring a universal metric to compare Player 1's utility units against Player 2's. The comparison is structural (relative to the problem's bounds) rather than substantive (relative to a common hedonic scale).

