    "phantom_options": "not_fatal",
    "comparability_presupposed": false,
    "comparability_reasoning": "Affine invariance ensures the ratios are normalized individually, so equating them requires no common unit of utility across persons.",
    "bottom_line": "I would surrender Independence of Irrelevant Alternatives.",
    "justification": "Monotonicity better captures the normative intuition that bargaining power should increase when a player's potential maximum payoff increases."
  }
  ```
