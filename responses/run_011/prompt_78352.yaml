answer: |-
  **1. Written Opinion**

  **To:** The Appeals Tribunal
  **From:** [Member Name]
  **Subject:** Determination of Appeal – Growers' Cooperative
  **Date:** [Current Date]

  **Recommendation**
  I recommend we dismiss the appeal. The cap applies to the claim as lodged, not per member. The cooperative is the applicant; its members are not. Consequently, the eleven stayed claims must be determined consistently with this ruling, and the agency's guidance manual requires formal amendment to reflect this reasoning.

  **Reasons**
  The operative provision grants a rebate "up to a maximum of fifty thousand dollars per applicant in any year." The cooperative lodged a single claim. The text does not say "per member" or "per enterprise underlying the applicant." It says "per applicant." In law and in ordinary usage, a cooperative filing a claim is the applicant. The member farms are constituents of that applicant, not applicants themselves. To read the provision otherwise requires us to insert words that are not there. We are not permitted to rewrite the scheme to match what we think is fairer; we are tasked with applying the scheme as written.

  My first colleague argues that the meaning was fixed in 1981 and our task is merely to declare it. I agree that our function is declaratory, not legislative. However, I acknowledge the force in my second colleague's objection: no prior decision tested this specific configuration. For forty-four years, the cap never bitten because no single applicant exceeded it. This is the first time the structure of the cap matters. My colleague argues that because the text has never been tested on this point, the meaning was indeterminate until now. On that view, we are making a rule, not finding one, and fairness dictates we apply it only prospectively.

  I reject the prospective-only approach. If the text governs, it governed yesterday as much as today. To rule prospectively would be to admit we are legislating, which exceeds our mandate. It would also create unequal treatment between this cooperative and the eleven stayed claimants, violating the principle that like cases be treated alike. If the cap applies to the applicant, it applied to this applicant when they filed. The novelty of the claim does not suspend the operation of the text. The silence of the drafting record regarding joint claims is not evidence of ambiguity; it is evidence that joint claims were not anticipated. When they arise, the existing text must resolve them. The text resolves this case by identifying the applicant.

  A third view suggests the meaning of the provision is simply the settled disposition of those who apply it, documented by the officer's practice and the 2009 footnote. This is attractive because it respects administrative stability. It treats the law as a prediction of what officials will do. However, this cannot explain why we are here. We are here because the disposition is contested. A disposition is a fact about what people *will* say; our question is what they *ought* to say. The 2009 footnote records the habits of people who never faced this question. Basing a determination that costs this applicant $31,000 on the habits of officials who never considered the issue is a thin foundation. We must justify the outcome by reason, not merely by habit.

  The purpose of the scheme is defraying the costs of small operators. The eligibility clause confines this to enterprises with fewer than 250 employees. The cooperative itself has eleven employees. It qualifies as a small operator. The members also qualify. But the rebate is administered through the applicant. Allowing multiple caps for one applicant would effectively bypass the maximum intended to limit liability per entity. The maximum exists to constrain the scheme's cost per recipient. The cooperative is the recipient.

  **Orders**
  1. The appeal is dismissed. The rebate is capped at $50,000.
  2. The eleven stayed claims are to be determined on the same basis.
  3. The agency must amend the guidance manual to replace the 2009 footnote with a reasoned explanation reflecting this decision.

  ***

  **2. Reasons a Dissenting Colleague Could Actually Engage With**

  To my colleague who argues for a prospective-only ruling: I accept your premise that where the text offers no answer, we make law rather than find it. I accept that fairness usually warns against retroactive changes where reliance is reasonable. Your strongest point is that the cooperative filed this claim in a landscape where the cap had never bitten, and no prior guidance explicitly warned them that aggregating members would trigger a single cap. They relied on the silence of the scheme.

  However, reliance on silence is weak where the text is specific. The text says "per applicant." It does not say "per unit of expenditure" or "per member." A reasonable applicant reads the text before filing. If the text says "per applicant," a cooperative knows it is one applicant. The reliance interest here is not on a settled interpretation of ambiguity, but on a hope that the agency would not enforce the plain text against a novel structure.

  Furthermore, your proposal creates a deeper unfairness. If we rule for the cooperative now but protect the stayed claims, we treat identical legal entities differently based solely on the timing of our decision. This undermines the integrity of the scheme. If the text means "per applicant," it meant that when the stayed claims were filed. To say otherwise is to say the law changes when we speak, not when the legislature wrote it. I prefer to bear the hardship of correcting a misunderstanding now rather than institutionalize unequal treatment across the cohort of stayed claimants. We must choose between disappointing this cooperative or treating all applicants unequally. I choose the former.

  ***

  **3. Annex**

  **Subject: Found vs. Made**

  For the quarrel between "we found the answer" and "we made the answer" to be merely a difference in description, two things would have to be true. First, the text would need to be genuinely silent, offering no criteria to distinguish between the readings. Second, our decision would need to function purely as a tie-breaker without altering the legal landscape prior to this moment.

  I do not think this is the case. The text offers a criterion: "applicant." The disagreement is whether that word covers the members. That is a question of meaning, not policy. If we decide "applicant" includes members, we are claiming that was always the meaning. If we decide it does not, we claim the same. We are not admitting the text is empty; we are fighting over what it contains. Therefore, the disagreement is genuine. We are not describing the same action differently; we are disagreeing on whether the text provided the solution before we spoke. I believe it did.
