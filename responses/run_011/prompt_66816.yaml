answer: |-
  ### Restatement in Modeling Vocabulary

  **Claim 1 (Williams):**
  The existence of a logical contradiction between a population's accepted constraint set (principles) and a current equilibrium strategy (practice) is insufficient to drive a transition to a new basin of attraction. In standard replicator or best-response dynamics, agents should eliminate dominated strategies or resolve cognitive dissonance to minimize utility loss. Williams claims this does not happen. Instead, the transition requires an exogenous shock to the material payoff matrix (economic change) or a drift in the weighting parameters of the utility function (sensibility) that precedes the shift in equilibrium. The argument from inconsistency is a post-hoc rationalization, not the causal mechanism of the state change.

  **Claim 2 (Appiah):**
  Norm transitions are coordination shifts driven specifically by the reputation term in the payoff function. A practice collapses when the correlation between the strategy and social standing flips sign (from positive to negative). This reputation term is not a private valuation but a function of public observability and aggregate belief (common knowledge within a reference network). The motive "honor" is modeled as a utility component that is zero if the action is private and strictly positive/negative if public. The transition is discontinuous: it occurs when the critical mass required to sustain the old signaling equilibrium is breached, redefining the strategy's status value for the whole population.

  ***

  ### Residue Report

  #### Claim 1: Williams on Inconsistency and Sensibility

  *   **Clean Mapping:**
      *   **Exogenous Payoff Shocks:** Williams's "social and economic change" maps cleanly to exogenous shocks to the material base of the payoff function ($\pi_{material}$).
      *   **Parameter Drift:** "Sensibility" maps to a slow drift in the weighting coefficients of the utility function (e.g., increasing $\beta$ on reputation terms relative to $\alpha$ on material terms).

  *   **Distortion:**
      *   **The Inefficacy of Logic:** In your framework, if an agent's strategy is inconsistent with their constraints, and that inconsistency carries a cost (even a small one), selection pressure should eventually remove it. Williams claims agents *tolerate* high-cost inconsistency indefinitely. To model this, you must impose an **inertia term** or a **blind spot** in the update rule where agents do not perceive the inconsistency as a cost until the "sensibility" parameter shifts. This is an interpretive imposition: you are modeling bounded rationality not as computational limits, but as a structural inability to access certain payoff comparisons.

  *   **No Expression:**
      *   **Post-hoc Rationalization:** Your models track causal mechanisms. Williams claims the "moral argument" is epiphenomenal. There is no variable in your framework for "stated justification" that is decoupled from "actual payoff driver." You can model agents lying about payoffs, but you cannot model a population-wide discourse that has zero causal weight on the dynamics until the dynamics have already resolved.

  #### Claim 2: Appiah on Honor and Standing

  *   **Clean Mapping:**
      *   **Reputation Terms:** Honor maps to the reputation/social utility component ($\pi_{social}$).
      *   **Tipping Thresholds:** The "rewriting of the code" maps to a shift in the basin of attraction boundary.
      *   **Network Topology:** The requirement for "public recognition" maps to constraints on network visibility (local vs. global updating).

  *   **Distortion:**
      *   **Constitutive vs. Additive:** In your framework, honor is an *additive* term in the utility function ($U = \pi_{mat} + \pi_{soc}$). Appiah implies honor is *constitutive* of the agent's identity within the network. In modeling terms, this suggests the reputation term should not be additive but **multiplicative** or **conditional**: if standing drops below a threshold, the agent's ability to participate in other payoff-generating interactions drops to zero (exclusion). Treating it as a simple additive bonus underestimates the stakes Appiah describes.

  *   **No Expression:**
      *   **Dynamic Strategy Sets:** Appiah claims practices become "unintelligible." In your framework, the strategy set $S$ is fixed exogenously. Agents choose $s \in S$. Appiah claims that during a moral revolution, $S$ itself shrinks or expands (a strategy is removed from the feasible set). Your framework can model a strategy having infinite cost, but not a strategy being *unavailable* to cognition.

  ***

  ### Defect vs. Padding: The Tripartite Distinction

  You asked whether the distinction between **permissible**, **honorable**, and **intelligible** is rhetorical padding or a genuine structural difference expressible in your terms.

  **It is not padding.** It maps to three distinct structural elements in an agent-based architecture, though standard implementations often conflate them.

  1.  **Intelligible (Strategy Set $S_i$):** Whether $s$ exists in the agent's lookup table.
      *   *Standard Model:* $S_i$ is fixed for all $t$.
      *   *Appiah:* $S_i$ is dynamic. If a practice becomes "unintelligible," $P(s) = 0$ because $s \notin S_i$, not because $U(s)$ is low.
  2.  **Permissible (Constraint/Penalty):** Whether $s$ triggers a sanction.
      *   *Standard Model:* High negative payoff in $\pi_{social}$.
      *   *Appiah:* This is the "costing standing" phase.
  3.  **Honorable (Reward/Weight):** Whether $s$ triggers a status bonus.
      *   *Standard Model:* Positive payoff in $\pi_{social}$.
      *   *Appiah:* This is the "conferring standing" phase.

  **Verdict:** The residue is a **defect of your current vocabulary** only if you treat the strategy set as static and utility as purely additive. If you allow for dynamic strategy sets and non-linear utility (exclusion thresholds), the distinction is structurally robust.

  **On the "Empty Claim" Question:**
  If honor is just a reputation payoff, does the Williams–Appiah thesis reduce to "preferences changed for exogenous reasons"?

  **No.** It retains structural content.
  1.  **Public vs. Private:** It specifies *which* payoff term changes. A standard preference change might be private (I no longer like sugar). An honor change is strictly public (I no longer respect sugar-eaters). This requires the update rule to depend on *observed* frequencies, not just experienced payoffs.
  2.  **Discontinuity:** It specifies the *shape* of the transition. Ordinary preference drift is gradual. Honor flips are coordination shifts (bistability). The model predicts hysteresis: restoring the old honor code requires a larger shock than broke it, because the *meaning* (the correlation between action and status) has flipped.
  3.  **Reference Group:** It specifies *whose* opinion matters. "Standing" implies a specific sub-network (the "gentlemen," the "community"). Ordinary tipping might depend on global density; honor tipping depends on the density within the status-granting subgraph.

  ***

  ### Modeling Requirements and Distinct Predictions

  To represent the Williams–Appiah account as a substantive structural claim rather than a label for exogenous shocks, your model requires three specific modifications:

  1.  **Endogenous Strategy Availability:**
      *   *Mechanism:* A strategy $s$ is removed from $S_i$ if the local frequency of $s$ falls below a cognitive threshold $\theta_{intelligible}$.
      *   *Why:* To capture Appiah's claim that practices become "unthinkable."

  2.  **Status-Dependent Access:**
      *   *Mechanism:* Payoff is $U_i = \pi_{mat} \cdot \mathbb{I}(\text{Standing}_i > \tau) + \pi_{soc}$. If standing drops below $\tau$, material payoffs are zero (exclusion).
      *   *Why:* To capture the constitutive nature of honor (loss of standing = loss of agency), distinguishing it from a simple fine.

  3.  **Inconsistency Friction:**
      *   *Mechanism:* Agents do not update on logical inconsistency unless $\Delta U > \epsilon_{sensibility}$. $\epsilon$ decreases only after exogenous economic shocks.
      *   *Why:* To capture Williams's claim that logic alone does not drive change.

  **Distinct Predictions (Honor-Driven vs. Ordinary Tipping):**

  If you implement these structures, the honor-driven transition yields predictions distinguishable from ordinary belief-updating tipping:

  1.  **Hysteresis Loop:** In ordinary tipping, if you reverse the payoff shock, the population returns to the original equilibrium along roughly the same path. In an honor-driven model, reversing the shock does *not* restore the practice. The strategy has been removed from $S_i$ (unintelligible) or the standing correlation has flipped. You need a *larger* reverse shock to make the strategy intelligible/honorable again.
  2.  **Core-Periphery Timing:** In ordinary tipping, adoption often spreads spatially or randomly. In honor-driven transitions, the flip must occur in the **high-degree nodes** (the status granters) first. If the periphery abandons the practice but the core retains it, the honor value remains positive. The model predicts a cascade originating specifically from the high-centrality cluster, not just a critical mass of any agents.
  3.  **Discourse-Decoupling:** Following Williams, the model should show a period where public discourse (modeled as a cheap-talk signal) condemns the practice, but behavioral frequency remains high. Ordinary rational choice models cannot sustain this equilibrium (cheap talk should be ignored, or behavior should align). This model sustains it via the "Inconsistency Friction" term.

  **Summary:** The philosophers are not merely describing preference changes. They are describing a specific topology of payoff interdependence (public/constitutive) and a specific friction in the update rule (tolerance of inconsistency). Your framework can capture this, but only if you stop treating strategy sets as fixed and reputation as a simple additive bonus.
