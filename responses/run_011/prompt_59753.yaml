answer: |-
  ### Desiderata for Model Truthlikeness Specification

  The following specification constrains any proposed formula for ranking the archive. It is derived strictly from the dual mandate: (1) selection for a policy-facing ensemble, and (2) defensibility to contributing modelers. Philosophical virtues unrelated to these ends (e.g., metaphysical explanation, aesthetic simplicity) are excluded.

  | # | Desideratum | Motivating Case (Archive Features & Uses) | Status |
  | :--- | :--- | :--- | :--- |
  | **1** | **Ontological Neutrality** | **Feature 1 (Omission vs. Error):** Models vary in variables included. For policy (Use 1), a variable omitted is functionally equivalent to claiming it has zero effect. The measure must treat omission as a specific claim about value (e.g., coefficient = 0) to allow comparison with models that include the variable but estimate it poorly. We cannot rank silence against error; we must convert silence to a claim. | **Non-negotiable** |
  | **2** | **Representational Invariance** | **Feature 2 (Redescription):** Modelers may reparameterize (e.g., splitting infection rates) or change units without changing empirical content. For defense (Use 2), a modeler must not be penalized for mathematical style. The ranking must remain identical under bijective transformations of variables or logical equivalences that preserve observable output. | **Non-negotiable** |
  | **3** | **Informative Proximity** | **Feature 3 (Weak Truth vs. Strong Error):** A tautology (e.g., "pathogen spread ≥ 0") is 100% true but useless for policy (Use 1). A specific model wrong by 3% is highly useful. The measure must value *content* (specificity) alongside *accuracy*. A model that risks being wrong to say something precise must rank higher than a model that guarantees truth by saying nothing, provided the error is within policy tolerances. | **Non-negotiable** |
  | **4** | **Observable Supervenience** | **Feature 4 (Unobservables):** Two models match outputs but differ on internal mechanisms. For policy (Use 1), only outputs matter. For defense (Use 2), we cannot adjudicate unobservable mechanisms without data. The ranking must depend *only* on observable consequences. Claims about hidden structure that do not alter outputs cannot influence the score. | **Non-negotiable** |
  | **5** | **Statistical Stability** | **Feature 5 (Unknown Truth/Noisy Data):** The truth is latent; we have finite, noisy observations. A measure requiring knowledge of the true state is unusable. The estimator for the ranking must be robust to sampling error. Small changes in the validation dataset must not cause large rank swaps, or the list cannot be defended (Use 2). | **Non-negotiable** |
  | **6** | **Error Decomposability** | **Feature 6 (Appeals):** A single scalar is opaque. To defend the list (Use 2), modelers must see *where* they lost points (e.g., spatial error vs. temporal error). The account must provide a vector of distances, not just a magnitude, allowing modelers to identify specific failures. | **Non-negotiable** |

  ***

  ### The Single Requirement That Eliminates the Most Candidates

  **Requirement 5 (Statistical Stability)** eliminates the vast majority of formal accounts of truthlikeness.

  Most philosophical definitions of verisimilitude assume the "Truth" is a known object—a specific state of affairs or a set of truth-values for all propositions—against which models are compared. They define distance *from* the Truth. In our context, the Truth is unknown and accessible only through noisy, finite sampling. Any account that requires knowing the truth-value of every proposition in the model's language, or the exact state of the world at every time step, is functionally dead. It forces us to treat our noisy validation data *as* the truth, which violates the stability constraint: if the measure is sensitive to the difference between the data and the truth, the ranking will fluctuate with sampling noise. Only accounts that define truthlikeness as a statistical property (e.g., expected loss, predictive accuracy) rather than a logical relation to a known fact survive this cut.

  ***

  ### Joint Unsatisfiability and Resolution

  There is a tension between **Requirement 2 (Representational Invariance)** and **Requirement 6 (Error Decomposability)**.

  **The Conflict:**
  Decomposability requires locating error in specific variables or dimensions (e.g., "you failed on soil moisture"). However, Invariance acknowledges that variables can be re-expressed (e.g., "soil moisture" vs. "drought index," or linear vs. log scales). If a modeler transforms their variables, the *location* of the error in the decomposition vector changes, even if the total scalar distance remains the same. If we allow modelers to choose their own decomposition basis to minimize apparent error, Invariance is violated. If we fix the decomposition basis rigidly, we violate the spirit of Invariance for modelers who work in natural but non-canonical coordinates.

  **The Resolution:**
  To make the list satisfiable, **Requirement 6 must be restricted**. Decomposability is not a right to decompose error along *model-internal* variables, but only along *policy-canonical* variables.

  **What is Lost:**
  By dropping the right to decompose via internal model structure, we lose the ability to help modelers diagnose *mechanical* failures inside their code. They can see that the output was wrong in terms of policy metrics (e.g., "total infected area"), but they cannot use the truthlikeness score to determine if their internal infection-rate parameter was the culprit versus their dispersal kernel. The account becomes a verdict on *outputs* rather than a diagnostic tool for *theory*. Given Use 1 (Policy Ensemble), this is an acceptable loss; the archive needs to know *if* the model works, not necessarily *why* it failed internally.

  ***

  ### Evaluation of Broad Accounts

  Two families of accounts dominate the literature on truthlikeness. Here is how they fare against the desiderata above.

  **Content-Based Accounts**
  These views define truthlikeness as a balance of true consequences versus false consequences. A model is better if it entails more truths and fewer falsehoods.
  *   **Performance:** This family fails **Requirement 5 (Stability)** and **Requirement 2 (Invariance)**. Because they rely on counting true/false sentences, they are highly sensitive to how the language is carved up (the "language dependence" problem). Changing the logical grammar or variable definitions changes the count of consequences, violating Invariance. Furthermore, determining the truth-value of every consequence against noisy data is statistically unstable; a single outlier observation can turn a "true" consequence into a "false" one, causing wild rank swings.
  *   **Verdict:** Unsuitable. They treat models as logical theories rather than quantitative approximations, making them brittle in the face of noise and reparameterization.

  **Similarity-Based Accounts**
  These views define truthlikeness as the distance between the model's state and the true state within a geometric space of possibilities.
  *   **Performance:** This family performs significantly better. It naturally handles **Requirement 1 (Omission)** by treating omitted variables as coordinates with default values. It satisfies **Requirement 3 (Informative Proximity)** because distance metrics penalize both vagueness (large error bars) and inaccuracy (offset from target). It aligns well with **Requirement 5 (Stability)** because distance can be defined via statistical expectation (e.g., mean squared error) rather than binary truth values. It also supports **Requirement 6 (Decomposability)** naturally via vector components.
  *   **Weakness:** It struggles slightly with **Requirement 2 (Invariance)** if the metric is not carefully chosen (e.g., Euclidean distance is not scale-invariant). However, this is solvable by normalizing the space.
  *   **Verdict:** Superior fit. By treating models as points in a state space rather than sets of sentences, similarity accounts align with the quantitative, policy-oriented nature of the archive. They prioritize *accuracy of representation* over *logical correctness*, which matches the dual use of ensemble selection and fair defense.

  **Conclusion:** The archive should mandate a **Similarity-Based** account, specifically one defined over the space of policy-relevant observables, with a metric normalized for scale and parameterization. This is the only path that satisfies the stability and invariance constraints required for public policy defense.
