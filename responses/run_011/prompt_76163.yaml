prompt: |-
  Taking a seminar on testimony this term and my reading group is split down the middle: half of us think there's something specifically defective about coming to hold your moral beliefs on someone else's say-so, and half of us think that's a philosopher's fantasy and moral testimony is just testimony like any other. Our prof made us produce the joint statement both sides could actually sign after a good-faith adversarial collaboration, and I drew the short straw. Draft it for me.

  I want the claims both camps can genuinely endorse — including on whether moral testimony transmits knowledge at all, because I think that's one place we've been arguing past each other, with one side hearing "knowledge" and the other hearing "understanding" — and then the residual disagreements worded so each side would happily sign its own row. Take seriously a distinction I threw out in section: whether you're *borrowing* a moral judgment (taking it now, holding it provisionally, intending to work out the reasons later) versus *outsourcing* it (handing the question over for good). Then run a concrete case through both views: someone who's told by a person they deeply trust that a thing they said was cruel, accepts it without argument, and can't for the life of them see why. Does borrowing-vs-outsourcing predict different verdicts about that person, and is that a real crux both sides accept or just a redescription?

  For each crux you land on, name a case or line of argument both sides would agree bears on it, and write each side's prediction down in advance. Flag anything you think is really only a verbal dispute, and say which part. Don't adjudicate — I want a document both camps could put their names to, not a verdict. Format: numbered agreed-claims section, then a disagreements table, then cruxes with predictions.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Context:** A seminar on testimony. The reading group is split 50/50 on the permissibility/nature of moral testimony (Defect View vs. Parity View).
      *   **Task:** Draft a joint statement both sides can sign after adversarial collaboration.
      *   **Key Requirements:**
          *   Include claims both camps genuinely endorse (including on knowledge transmission vs. understanding).
          *   Include a specific distinction: *Borrowing* (provisional, reasons later) vs. *Outsourcing* (permanent deference).
          *   Run a concrete case through both views (Trusted friend says "That was cruel," agent accepts but doesn't see why).
          *   Identify cruxes where sides disagree, name cases/arguments bearing on them, and write predictions for each side.
          *   Flag verbal disputes.
          *   **Do not adjudicate.** The goal is consensus on the *structure* of the disagreement, not the resolution.
          *   **Format:** Numbered agreed-claims section, Disagreements Table, Cruxes with Predictions.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Defect View (Pessimists):** Moral testimony is problematic. It might transmit knowledge/justification, but it fails to provide *understanding*, or it violates a duty of moral autonomy, or it leads to fetishism of de re moral properties. Key names: Hopkins, Hills, Callahan.
      *   **Parity View (Optimists):** Moral testimony is like any other testimony (math, science, geography). If the source is reliable and the hearer has no defeaters, belief is justified. Key names: Jones, Lackey, Sliwa (nuanced).
      *   **The "Knowledge vs. Understanding" Gap:** Optimists often argue "Yes, you get knowledge." Pessimists argue "Yes, you get knowledge, *but* you lack understanding, which is required for moral worth/action." This needs to be clarified in the agreement section.
      *   **Borrowing vs. Outsourcing:** This is the user's specific contribution.
          *   *Borrowing:* "I trust you, so I'll believe $p$ for now while I figure out why." (Generally more acceptable to Pessimists).
          *   *Outsourcing:* "I trust you, so I believe $p$ and don't need to know why." (The main target of Pessimists).

  3.  **Drafting Section 1: Agreed Claims (The Common Ground):**
      *   Need to find the overlap. Both sides agree testimony *can* cause belief. Both agree reliability matters. Both agree there's a difference between mere true belief and something richer (understanding/autonomy).
      *   *Claim 1 (Transmission):* Moral testimony can transmit justification/knowledge *in some sense*. (Optimists: Full knowledge. Pessimists: Propositional knowledge, but maybe not understanding). Let's phrase it carefully: "Moral testimony can generate justified true belief..."
      *   *Claim 2 (The Value of Understanding):* Both sides agree that *understanding why* an action is wrong is better than just knowing *that* it is wrong.
      *   *Claim 3 (Borrowing vs. Outsourcing):* Endorse the distinction. Both agree Borrowing is less problematic than Outsourcing.
      *   *Claim 4 (Non-Moral Parity):* In non-moral domains (e.g., history, science), Outsourcing is often fine. The debate is specific to the *moral* domain.
      *   *Claim 5 (The Concrete Case):* In the "Cruelty" case, both agree the agent forms a belief. The disagreement is on the *normative status* of that belief/action.

  4.  **Drafting Section 2: Disagreements Table:**
      *   Need to contrast the views clearly without bias.
      *   *Columns:* Issue, Defect View (Pessimists), Parity View (Optimists).
      *   *Rows:* Nature of the Defect, Scope of the Prohibition, Relationship to Autonomy, Value of Moral Action.

  5.  **Drafting Section 3: Cruxes and Predictions:**
      *   Need specific test cases or arguments where the predictions diverge.
      *   *Crux 1: The "Good Action" Test.* If an agent acts on outsourced testimony, is the action morally worthy?
          *   Defect: No (fetishism/lack of grasp).
          *   Parity: Yes (right action for right reason, even if reason is testimonial).
      *   *Crux 2: The "Math/Logic" Analogy.*
          *   Defect: Moral truths are not like math truths (require engagement).
          *   Parity: Moral truths are relevantly similar to complex math (expert testimony is fine).
      *   *Crux 3: The Borrowing Transition.* If a borrower never figures out the reasons, does it retroactively become defective?
          *   Defect: Yes, the provisional nature was a placeholder that expired.
          *   Parity: No, the initial justification stands.
      *   *Verbal Dispute Flag:* Is "Knowledge" the fight? Yes. Optimists use "Knowledge" = JTB + Anti-Gettier. Pessimists use "Knowledge" = JTB + Understanding/Grasp. Need to flag this.

  6.  **Refining the Concrete Case (The "Cruelty" Scenario):**
      *   Scenario: Agent A says something. Trusted Friend B says "That was cruel." A believes B but doesn't see the cruelty.
      *   *Borrowing interpretation:* A says "Okay, I'll take your word while I reflect."
      *   *Outsourcing interpretation:* A says "Okay, you're the expert, I won't worry about it."
      *   *Prediction:* Defect view says Outsourcing here is morally deficient (A fails to develop moral sensitivity). Parity view says Outsourcing is fine if B is reliable (A avoids further harm).

  7.  **Review and Polish:**
      *   *Tone:* Academic, neutral, collaborative.
      *   *Formatting:* Follow the requested structure (Numbered Claims, Table, Cruxes).
      *   *Check Constraints:* Did I avoid adjudicating? Yes. Did I include the Borrowing/Outsourcing distinction? Yes. Did I flag verbal disputes? Yes.
      *   *Self-Correction on "Knowledge":* The prompt specifically asks to address the "knowledge vs. understanding" argument in the agreed claims. I need to make sure the agreement acknowledges that *something* is transmitted, even if they disagree on whether it counts as full "moral knowledge" in the robust sense.
      *   *Refining the "Verbal Dispute" Flag:* The prompt asks to flag anything that is *only* a verbal dispute. I should be careful not to dismiss the whole debate as verbal, but point out where definitions of "knowledge" might be driving the heat.

  8.  **Final Polish of the Text:** (Mental check of the drafted content against the prompt's specific phrasing requests).
      *   "Draft it for me." -> Voice should be the student/group rep.
      *   "Format: numbered agreed-claims section, then a disagreements table, then cruxes with predictions." -> Strict adherence.
      *   "Don't adjudicate." -> Ensure the language remains descriptive of the positions, not evaluative of their truth.

      *(Self-Correction during drafting)*: Make sure the "Borrowing vs. Outsourcing" distinction is integrated into the Agreed Claims as a shared conceptual tool, not just a point of contention. Both sides agree the distinction *exists* and is *useful*, even if they disagree on whether Borrowing fully solves the Defect View's worries.

      *(Refining the Concrete Case)*: Ensure the predictions are specific. Not just "Side A thinks X," but "Side A predicts that in case Y, judgment Z will obtain."

      *(Final check on Verbal Dispute)*: The prompt asks to "Flag anything you think is really only a verbal dispute." I need to identify if the "Knowledge" debate is merely verbal. It's likely *partly* verbal. I will flag the definition of "Moral Knowledge" as a potential verbal dispute while noting substantive disagreement remains on the *value* of that state.

      Let's assemble the document.cw
answer: |-
  **JOINT STATEMENT ON THE STATUS OF MORAL TESTIMONY**
  **Seminar on Epistemology and Ethics | Reading Group Collaboration**
  **Date:** October 26, 2023
  **Signatories:** The Defect View Camp & The Parity View Camp

  ### I. AGREED CLAIMS
  *The following propositions are endorsed by all members of the reading group, regardless of their position on the permissibility of moral testimony.*

  1.  **Transmission of Justification:** Moral testimony can transmit *some* epistemic warrant. We agree that hearing a reliable testifier say "X is wrong" provides the hearer with more epistemic support than mere guessing, even if we disagree on whether this support amounts to full "knowledge" in the robust sense.
  2.  **The Knowledge/Understanding Distinction:** We agree that there is a conceptual distinction between *knowing that* a proposition is true (propositional knowledge) and *understanding why* it is true (grasping the explanatory reasons). We agree that, ceteris paribus, understanding is epistemically and morally preferable to mere propositional belief.
  3.  **Borrowing vs. Outsourcing:** We adopt the following distinction as a shared analytical tool:
      *   **Borrowing:** Accepting a moral judgment provisionally on testimony, with the intention and expectation of grasping the underlying reasons later.
      *   **Outsourcing:** Accepting a moral judgment on testimony with no intention of grasping the underlying reasons, treating the testifier as a permanent proxy for moral reasoning.
      *   *Consensus:* We agree that Borrowing is less problematic than Outsourcing. We disagree on whether Borrowing is *sufficient* to clear the defect, and whether Outsourcing is *always* impermissible.
  4.  **Domain Specificity:** We agree that the debate is specific to the *moral* domain. In non-moral domains (e.g., history, complex physics, geography), Outsourcing is widely accepted as permissible. The disagreement is whether morality is relevantly different from these domains.
  5.  **The "Cruelty" Case Baseline:** Regarding the case where an agent is told by a trusted friend that a remark was cruel, accepts it, but cannot see why:
      *   We agree the agent forms a true belief (assuming the remark was cruel).
      *   We agree the agent lacks first-order grasp of the cruelty.
      *   We agree the normative evaluation of this agent is the primary site of our disagreement.

  ### II. DISAGREEMENTS TABLE
  *The following table maps the divergent commitments of the two camps. Each side endorses their respective column.*

  | Issue | **The Defect View (Pessimists)** | **The Parity View (Optimists)** |
  | :--- | :--- | :--- |
  | **Core Claim** | There is something specifically defective about forming moral beliefs via testimony that does not exist (or is less prevalent) in non-moral domains. | Moral testimony is relevantly similar to non-moral testimony; there is no *sui generis* defect in moral deference. |
  | **Nature of the Defect** | The defect lies in the **moral worth of action** or **moral autonomy**. Acting on outsourced testimony fails to engage the agent's moral sensibilities, leading to "moral fetishism" or a lack of virtue. | Any defect is purely **epistemic** (e.g., reliability of the source) and applies equally to non-moral cases. There is no special threat to autonomy. |
  | **Status of Outsourcing** | Outsourcing is generally impermissible in core moral cases, even if the source is reliable, because it bypasses the duty to engage with moral reasons. | Outsourcing is permissible whenever the testifier is sufficiently reliable and the hearer has no defeaters. |
  | **Value of Action** | An action performed solely on outsourced testimony lacks full moral worth, even if the action is objectively right. | An action performed solely on outsourced testimony can have full moral worth if the belief is justified and the motivation is right. |
  | **Role of Understanding** | Understanding is a **necessary condition** for full moral competence. Testimony cannot provide this understanding. | Understanding is **valuable but not necessary** for justified belief or right action. Testimony can provide the justification needed for competence. |

  ### III. CRUXES AND PREDICTIONS
  *For each crux, we identify a specific case or argument line, flag potential verbal disputes, and record the divergent predictions each side makes.*

  #### Crux 1: The "Moral Worth" Test Case
  **Scenario:** An agent donates to an effective charity solely because a trusted moral expert told them to, without understanding *why* the charity is effective or *why* helping is good. They would not have donated without the testimony.
  **Verbal Dispute Flag:** **Partial.** If "Moral Worth" is defined by Optimists as "Right Action + Justified Belief" and by Pessimists as "Right Action + Grasped Reasons," we are talking past each other. We agree to define "Moral Worth" for this test as: *The degree to which the agent is praiseworthy for the action.*

  *   **Defect View Prediction:** The agent is **less praiseworthy** (or not praiseworthy at all) compared to an agent who donated based on their own grasp of the reasons. The action is "hollow."
  *   **Parity View Prediction:** The agent is **equally praiseworthy**, provided the expert was reliable. The source of the justification (testimony vs. reasoning) does not diminish the virtue of acting on a justified moral belief.

  #### Crux 2: The "Borrowing Expiration" Case
  **Scenario:** An agent *Borrows* a moral judgment ("Segregation is wrong") from a parent at age 10, intending to work out the reasons later. At age 30, they still hold the belief but still cannot articulate the reasons, having never revisited the question.
  **Verbal Dispute Flag:** **None.** This is a substantive disagreement about the temporal stability of justification.

  *   **Defect View Prediction:** The agent's moral standing has **degraded**. The provisional license to Borrow has expired. By age 30, the belief is now defectively held (effectively Outsourced), rendering their moral stance on segregation epistemically/morally deficient.
  *   **Parity View Prediction:** The agent's moral standing is **unchanged**. The initial justification was valid; the failure to later generate independent reasons is a missed opportunity for understanding, but it does not retroactively defect the belief or the actions taken based on it.

  #### Crux 3: The "Cruelty" Concrete Case (Sensitivity vs. Reliability)
  **Scenario:** (As described in Section I) Agent says something. Trusted Friend says "That was cruel." Agent accepts this but reports, "I trust you, but I genuinely don't see what was cruel about it."
  **Argument Line:** Does this state of affairs indicate a failure of *moral sensitivity* (Defect) or a rational reliance on *social data* (Parity)?

  *   **Defect View Prediction:** This agent is **morally deficient** in this moment. By accepting the verdict without seeing the cruelty, they are treating morality as a set of rules to be followed rather than features of the world to be perceived. They are at risk of repeating the cruelty in slightly different forms because they lack the underlying principle.
  *   **Parity View Prediction:** This agent is **epistemically rational** and morally permissible. Recognizing one's own blindness and deferring to a more sensitive observer is a virtue (humility). It prevents further harm more effectively than insisting on independent verification they are incapable of making.

  #### Crux 4: The Mathematical Analogy
  **Argument Line:** Pessimists argue morality is unlike math because morality requires motivation/sensitivity. Optimists argue morality is like complex math where laypeople must defer to experts.
  **Verbal Dispute Flag:** **High.** This hinges on the definition of "Moral Truth." If moral truths are mind-dependent (requiring engagement) vs. mind-independent (discoverable facts).

  *   **Defect View Prediction:** The analogy **fails**. In math, getting the right answer is sufficient. In morality, *responding* to the reason is required. Testimony gives the answer but not the response.
  *   **Parity View Prediction:** The analogy **holds**. In advanced math, we accept theorems we cannot prove. In advanced morality (e.g., complex bioethics), we should accept judgments from those with more processing power/sensitivity. The "response" is the action, which testimony can successfully guide.

  ***

  **Statement Prepared By:** [Your Name/Group Rep]
  **Acknowledgement:** Both camps acknowledge that this document accurately reflects the current state of our dialectic without resolving the substantive normative disagreement.
