      *(Self-Correction during drafting)*: Is 7 too generous? The prompt asks "whether (i) actually supports (ii)." The student says "yes." Many philosophers (e.g., Weber, Tucker) argue (i) does *not* support (ii) because we can model robust causal mechanisms even in complex systems. However, the student's argument for "yes" is technically coherent *until* the overdetermination paragraph. The contradiction is the main penalty. I'll stick with 7 but emphasize the contradiction heavily. Actually, looking closer at "Counterfactuals... neither true nor false," that's a massive metaphysical claim dropped without argument. Maybe 6.5? Let's split the difference and say 7, but note the heavy penalty on the second half.

