answer: |-
  # Axes

  *   **Temporal Orientation:** Is the sanction justified by what *happened* (past wrongdoing) or what *will happen* (future safety/utility)?
  *   **Target Audience:** Is the sanction primarily for the *offender* (reform/retribution) or the *community* (deterrence/norm affirmation)?
  *   **Constraint vs. Goal:** Is "just deserts" (proportionality) the *goal* of punishment, or merely a *limit* on how much we can punish for utility?
  *   **Instrumental vs. Expressive:** Is the ban a tool to change behavior (instrumental) or a statement of values (expressive), regardless of behavioral outcomes?
  *   **Agency:** Do we treat the offender as a rational agent to be reasoned with (communicative) or a risk vector to be managed (consequentialist)?

  # The quiz

  **1. A user drops a severe slur during a heated debate. First offense.**
  A) Issue a 7-day ban. It fits the severity of the insult, regardless of their intent.
  B) Issue a 3-day ban and a private note explaining why this harms the community.
  C) Issue a 14-day ban. We need to signal clearly that this language isn't welcome here.

  **2. A repeat offender is also your single best technical help-giver.**
  A) Ban them for the standard duration. Their contribution doesn't erase the violation.
  B) Reduce the ban duration. We need their help, and a shorter ban might correct them without losing them.
  C) Ban them publicly. The community needs to see that expertise doesn't exempt you from rules.

  **3. Someone breaks a rule that nobody has enforced for years.**
  A) Warn them privately. Enforcing it fully now feels like a trap since nobody expected it.
  B) Enforce the standard sanction. The rule exists, so breaking it deserves the standard response.
  C) Enforce the sanction publicly. We need to remind everyone that this rule is still active.

  **4. A user makes a very public apology, then breaks the same rule a week later.**
  A) Double the previous sanction. They showed they couldn't uphold their own promise.
  B) Issue a permanent suspension... wait, scratch that. Issue the maximum temporary ban allowed. They've exhausted our trust.
  C) Skip the ban, require a mediated discussion. They clearly want to be good but lack the tools to manage it.

  **5. An offense happens in a low-traffic subforum. Nobody saw it but the victim.**
  A) Sanction privately. There's no public norm to reaffirm, so just fix the harm.
  B) Sanction publicly anyway. The record matters more than the audience.
  C) Sanction proportionately. The lack of witnesses doesn't change the wrongdoing.

  **6. A user finds a technical loophole to harass someone without breaking literal rules.**
  A) Sanction them. The spirit of the rule was broken, so the desert is the same.
  B) Don't sanction. No rule was broken, so there's no basis for punishment.
  C) Sanction and announce it. We need to show that loophole abuse violates community trust.

  **7. A veteran member insults a new member.**
  A) Heavier sanction. Veterans should know better and hold higher responsibility.
  B) Standard sanction. The rule break is the same regardless of tenure.
  C) Lighter sanction. A private chat might work better than alienating a long-term contributor.

  **8. A user claims they didn't know the rule. It's plausible.**
  A) Warn only. Punishing ignorance doesn't prevent future errors effectively.
  B) Standard sanction. Ignorance isn't an excuse; the desert is based on the act.
  C) Standard sanction + public note. We need to clarify the rule for everyone else's sake.

  **9. Two users fight. Both broke rules, but one was provoked.**
  A) Sanction both equally. The rule break is the objective fact.
  B) Sanction the provocateur more heavily. Their moral culpability is higher.
  C) Sanction the reactor more heavily. They escalated the situation to a bannable level.

  **10. A user commits an offense during a major site event vs. quiet Tuesday.**
  A) Heavier sanction during the event. The potential harm and visibility were greater.
  B) Same sanction. The wrongdoing is identical regardless of timing.
  C) Lighter sanction during the event. They got caught because of traffic, not because they were worse.

  # Scoring key

  Tally your answers. Most frequent letter indicates your primary orientation.

  *   **Mostly A (Desert-Constrained):** You focus on **Backward-looking Proportionality**. The sanction must fit the crime. Consequences matter, but only within the limits of what the offender deserves. You are the "Hybrid" view: desert sets the limits, utility chooses inside them.
  *   **Mostly B (Pure Forward-Looking):** You are a **Consequentialist**. The only question is what makes things better going forward. If a warning works better than a ban, you warn. If ignoring a rule prevents drama, you ignore it. Effects are everything.
  *   **Mostly C (Communicative/Expressive):** You view sanctions as **Public Statements**.
      *   If you leaned towards " signaling to community" (Q1C, Q2C, Q3C, Q6C, Q8C), you are **Norm Affirmation**. The sanction speaks to the community about values.
      *   If you leaned towards "moral understanding/tools" (Q1B, Q4C, Q7C), you are **Moral Education**. The sanction speaks to the offender to reform their character.

  *Note:* Pure Retribution (Backward-looking only) is rare in volunteer mods. If you chose "Standard Sanction" regardless of utility (Q2B, Q5C, Q7B, Q9A, Q10B), you hold a **Strict Desert** view.

  # Blind spots

  **Indistinguishable Positions:**
  The quiz struggles to separate **Pure Forward-Looking (Consequentialism)** from **Moral Education (Communicative to Offender)**. Both often recommend lighter, reform-focused sanctions (e.g., Q4C).
  *   *Extra Question:* "If you knew for certain the offender would never return to the forum, would you still sanction them?"
      *   Forward-looking: No (no future utility).
      *   Moral Education/Retributive: Yes (they still need to learn/pay).

  **Unoccupied Combinations:**
  *   *High Desert + High Community Expression + Zero Future Concern:* Logically possible (punish severely to make a point even if it hurts the community), but practically unoccupied. Volunteer mods rarely admit to wanting harm without benefit.
  *   *High Future Utility + Zero Desert Constraints:* Logically possible (punish an innocent person if it stops a riot), but morally repugnant to almost all mods. You likely found no options here because policy drafts usually exclude "punish innocents" explicitly.

  # Settled vs contested

  In philosophical literature, the distinction between the *General Justifying Aim* of punishment (why have the system?) and *Distribution* (who gets punished/how much?) is settled as a useful framework (Hart). Most theorists agree pure retribution without any regard for consequences is untenable in public policy, and pure consequentialism without desert constraints (punishing innocents) is morally forbidden.

  However, the *weight* given to each is fiercely contested. There is no consensus on whether desert is merely a side-constraint or a positive goal. Similarly, the "Communicative" theory (punishment as moral dialogue) is a live competitor to Utilitarianism, not a settled subset. Many policy drafters assume "deterrence" works empirically; philosophers dispute this heavily. Finally, whether volunteer communities should prioritize "care/reform" over "justice/desert" is a normative live wire, not a settled fact. Do not treat the "Hybrid" view as the default correct answer; it is merely the most common compromise.
