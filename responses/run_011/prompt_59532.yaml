      *   *Correction on Q3:* "Judge" might also imply "hold accountable." Make sure to distinguish between cognitive judgment and moral imputation.
      *   *The Recluse:* This is the strongest point. Kant's system *does* condemn the recluse, but for reasons the user (as a physiologist) might find unsatisfying (it's about the human's soul, not the dog's nerves). I need to make sure this distinction is sharp.

