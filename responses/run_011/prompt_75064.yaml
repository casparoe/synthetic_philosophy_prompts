      *(Self-Correction on Move 2)*: Dev says "Herding can be perfectly rational... nobody in the cascade is being stupid." This is the definition of a BHW cascade. Rosie implies it's bad. Dev says "calling it a cascade is a slur." He's fighting the connotation.

