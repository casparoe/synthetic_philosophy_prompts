      *   **The Conflict:** Rosie argues this is an "information cascade" (potentially fragile, possibly false). Dev argues this is rational Bayesian updating/herding based on strong evidence (potentially robust, true).
      *   **Task:**
          1.  Analyze the argument move-by-move (1-8).
          2.  Determine who is right at each step (specifically addressing the user's confusion about Move 2 and Move 6).
          3.  Declare an overall winner.
