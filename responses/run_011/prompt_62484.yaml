prompt: |-
  I am a second-year master's student in a seminar on international criminal law, and I also work roughly ten hours a week on the research desk of a small documentation NGO. We publish two situation briefs a week on ongoing mass-atrocity situations, and the question the desk has never been able to answer is when we are permitted to write that genocide is occurring, has occurred, or is at serious risk. Our briefs are quoted by wire services and read into the record by a parliamentary committee, so both errors are costly in ways that pull against each other: over-labeling destroys our credibility and lets the governments we cover cast us as advocates, while under-labeling, as our director puts it, is one way of making an atrocity disappear. We also have a consistency problem. A brief last year used the word; this year, in a case that looks comparable to me, the desk declined to, and the only explanation anyone could give is that the composition of the room had changed. I would like a procedure that removes that variable.

  The constraints are these. The analysts are students with no legal training. Evidence is open-source only: satellite imagery, humanitarian reporting, survivor testimony, officials' public statements, broadcast and social media. There is no subpoena power, no forensics, no access to closed intelligence. A staff lawyer reads each brief before publication but has perhaps fifteen minutes and will only approve or veto, so the reasoning has to be the analyst's. Some briefs concern ongoing situations and others are retrospective assessments of completed episodes, and I suspect the two should not be held to the same threshold.

  Please write the procedure as a sequence of questions an analyst runs down the page. For each question, state what counts as a sufficient answer from open sources and what that answer licenses: a flat assertion, an assertion with an explicit qualifier, a formulation confined to risk, a formulation that describes the conduct without naming the crime, or no publication at all. Mark clearly where the procedure stops and hands the decision to the director because what remains is a question about our mission rather than about the facts. Be candid about which steps are judgment calls wearing a procedural costume — above all, how one infers an intent to destroy a group from pattern and rhetoric when no official says so aloud, and how one decides whether the part of a group being targeted is a substantial part.

  It should also tell us what to do where the legal category and the moral or sociological one come apart, since the concept Lemkin was working with was considerably wider than the treaty definition we are bound to describe: it took in the destruction of a group's language, institutions and cultural life, and it was not limited to groups defined nationally, ethnically, racially or religiously. Specifically: may a brief say that something is genocide in the wider sense while stating that the legal elements are not made out, and if so, how do we stop readers from hearing only the first clause?

  Then run the procedure on three cases and give me the operative sentence each brief would carry. I expect the second to come out against us, and I would rather see that now than discover it in print.

  1. A religious minority in a besieged region. Documented killings of its members by security forces; systematic sexual violence against its women; a state broadcaster running months of dehumanizing messaging about the group; a cabinet minister recorded calling for the region to be emptied of that population; humanitarian access blocked for five months with credible reporting of starvation in the sealed towns. The government maintains it is fighting an armed insurgency embedded in the civilian population.

  2. A government targets a region defined by open support for an armed opposition movement, using deliberate starvation, destruction of markets, wells and clinics, and mass forced displacement; the death toll is in the hundreds of thousands. Most of the affected population shares an ethnicity that would fall within the protected categories, but the sources we rely on describe the targeting as political — allegiance to the movement rather than ancestry — and there is no official rhetoric invoking ethnic identity at all.

  3. Over a decade, a state has sterilized women of an ethnic minority without informed consent and removed a large share of its children to state boarding schools where their language is banned and their given names replaced. Deaths are few. The state describes the program as development and integration.

  Finally, tell me what the procedure cannot do even when followed correctly, and which of its steps would break first under our actual deadline and staffing. I am not looking for authorities or citations — our lawyer handles those — I need reasoning an analyst can run from the documents in front of them.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Second-year master's student in international criminal law (ICL), working at a small documentation NGO (10 hrs/week).
      *   **Task:** Create a decision-making procedure (checklist/flowchart style) for analysts to determine when to use the term "genocide" in situation briefs.
      *   **Constraints:**
          *   Analysts are students (no legal training).
          *   Evidence is open-source only (OSINT, humanitarian reports, testimony, public statements).
          *   No subpoena/forensics/intelligence.
          *   Staff lawyer review is limited (15 mins, veto/approve only).
          *   Need consistency (remove "composition of the room" variable).
          *   Distinguish between ongoing vs. retrospective assessments.
          *   Address the gap between legal definition (1948 Convention) and sociological/moral definition (Lemkin's broader concept).
          *   Must be a sequence of questions with specific licensing outcomes (assertion, qualified assertion, risk, conduct-only, no publication).
          *   Must identify where the Director decides (mission vs. facts).
          *   Must be candid about judgment calls (inferring intent, "substantial part").
          *   Must apply the procedure to three specific cases and provide the operative sentence for each.
          *   Must explain limitations and failure points under pressure.
      *   **Tone:** Professional, candid, practical, legally grounded but accessible to non-lawyers.

  2.  **Deconstruct the Legal Standard (1948 Genocide Convention):**
      *   *Actus Reus:* Killing, causing serious bodily/mental harm, inflicting conditions of life calculated to bring about physical destruction, imposing measures to prevent births, forcibly transferring children.
      *   *Mens Rea:* Specific intent (*dolus specialis*) to destroy, in whole or in part, a national, ethnical, racial, or religious group, as such.
      *   *Protected Groups:* National, ethnical, racial, religious. (Excludes political groups).
      *   *Threshold:* "Substantial part" (qualitative or quantitative).

  3.  **Drafting the Procedure (The "Genocide Determination Protocol"):**
      *   *Goal:* Step-by-step questions.
      *   *Structure:*
          1.  Threshold/Admissibility (Is this even a potential genocide case?).
          2.  Actus Reus (Are the prohibited acts happening?).
          3.  Protected Group (Is the target one of the four?).
          4.  Specific Intent (The hardest part: inferring *dolus specialis*).
          5.  Substantiality (Is the part targeted significant?).
          6.  Temporal Context (Ongoing vs. Retrospective).
          7.  Sociological vs. Legal (Handling the Lemkin gap).
          8.  Director Escalation (Mission/Policy calls).
      *   *Licensing:* For each step, define what evidence allows what wording.
      *   *Candor:* Acknowledge where inference replaces proof.

  4.  **Refining the "Intent" Question (The Core Challenge):**
      *   Since analysts can't read minds, they must look for *patterns*.
      *   *Indicators:* Dehumanizing rhetoric, systematic nature of violence, targeting of specific demographics (women/children), blocking of aid, statements by officials.
      *   *Alternative Explanations:* Must rule out "collateral damage" or "counter-insurgency" if possible, or acknowledge the ambiguity.

  5.  **Refining the "Sociological vs. Legal" Question:**
      *   The prompt asks if we can say "genocide in the wider sense" while admitting legal elements aren't met.
      *   *Risk:* Readers hear "Genocide" and ignore the qualifier.
      *   *Solution:* Strict syntax. "Cultural genocide" is not a legal crime. Use "genocidal acts" or "destructive processes" if legal intent isn't met. *Decision:* Do not allow the word "genocide" as a noun if legal elements fail. It creates too much confusion. Allow "genocidal violence" or describe the destruction without the label. *Correction:* The prompt asks specifically how to handle this. I need to provide a rule. Best practice for NGOs (like HRW/Amnesty) is usually to stick to the legal definition to maintain credibility, but acknowledge the broader harm. I will recommend *against* using the noun "genocide" if the legal test fails, to prevent the "heard only the first clause" problem.

  6.  **Developing the Three Cases:**

      *   *Case 1 (Religious Minority, Siege, Starvation, Rhetoric):*
          *   Acts: Killing, sexual violence, starvation (conditions of life).
          *   Group: Religious (Protected).
          *   Intent: Minister statement ("empty region"), dehumanizing media, blocking aid. Strong inference of intent to destroy.
          *   Outcome: High confidence.
          *   *Operative Sentence:* Needs to be firm but precise.

      *   *Case 2 (Political Targeting, Ethnic Correlation, Starvation):*
          *   Acts: Starvation, displacement (Conditions of life).
          *   Group: Political (Not protected). Ethnicity correlates but sources say targeting is political.
          *   Intent: No ethnic rhetoric.
          *   Legal Hurdle: Political groups are excluded from the Convention.
          *   Outcome: Cannot legally call it genocide.
          *   *Operative Sentence:* Must describe crimes against humanity or war crimes, not genocide. This is the "comes out against us" case the user expects.

      *   *Case 3 (Sterilization, Child Transfer, Assimilation):*
          *   Acts: Preventing births, transferring children.
          *   Group: Ethnic (Protected).
          *   Intent: "Integration/Development" vs. Destruction.
          *   Temporal: Retrospective/Long-term.
          *   Legal Hurdle: Intent to *physically/biologically* destroy vs. assimilate. Child transfer *is* a genocidal act under Art 2(e), but intent matters.
          *   Outcome: Strong case for "measures to prevent births" and "transfer of children."
          *   *Operative Sentence:* Needs to reflect the specific acts.

  7.  **Addressing Limitations and Failure Points:**
      *   *What it can't do:* Prove intent beyond reasonable doubt (that's for courts). It assesses risk and reasonable grounds.
      *   *Failure Points:* The "Intent" step takes the most time. Under deadline, analysts will skip nuance. The "Director Escalation" might get bypassed. The 15-minute lawyer review is a bottleneck/risk.

  8.  **Review against Constraints:**
      *   *Sequence of questions?* Yes.
      *   *Sufficient answer defined?* Yes.
      *   *Licensing defined?* Yes.
      *   *Director hand-off marked?* Yes.
      *   *Candid about judgment calls?* Yes.
      *   *Sociological vs. Legal addressed?* Yes.
      *   *Three cases run?* Yes.
      *   *Limitations explained?* Yes.

  9.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Case 2:* Make sure to emphasize *why* it fails (political group exclusion). This is a common point of confusion.
      *   *Self-Correction on Case 3:* Ensure the distinction between "cultural genocide" (not law) and "forcible transfer of children" (is law) is clear.
      *   *Tone Check:* Ensure it sounds like a protocol for students, not a court judgment. Use terms like "Reasonable Grounds" rather than "Proof."
      *   *Director Hand-off:* Make sure the "Mission vs. Facts" distinction is clear. E.g., if the legal test is met, but the risk to staff is too high, that's a Director call. Or if the legal test is *almost* met but the moral imperative is high.

  10. **Final Polish:** Check the "Operative Sentences" for precision. Ensure the "Sociological vs. Legal" section directly answers the user's worry about readers ignoring qualifiers. (Decision: Advise against using the noun "genocide" if legal elements fail, propose alternative phrasing).

  *(Self-Correction during drafting)*: I need to make sure I don't give legal advice, but rather a *procedure* for the NGO. The prompt asks me to write the procedure. I will frame it as "The NGO Genocide Determination Protocol."

  *(Refining the "Intent" step)*: This is the hardest part for students. I need to give them a "Totality of Circumstances" test. If X, Y, and Z are present, intent can be inferred.
  *(Refining the "Substantial Part" step)*: Quantitative vs. Qualitative. Leaders + Women/Children often counts as qualitative substantiality.

  *(Refining the Sociological/Legal gap)*: The prompt asks: "may a brief say that something is genocide in the wider sense while stating that the legal elements are not made out?" My advice should be: No, not using the noun. It invites the exact misinterpretation the user fears. Use "genocidal acts" or "destructive processes."

  *(Final check on Case 2)*: The prompt says "I expect the second to come out against us." This implies the NGO *wants* to call it genocide, but the procedure should stop them. I must ensure the procedure is rigorous enough to block this if the legal elements (Protected Group) aren't there.

  *(Final check on Limitations)*: Be honest about the 15-minute lawyer review. That is a single point of failure.

