answer: |-
  # The NGO Genocide Determination Protocol (GDP)

  **Purpose:** To standardize the use of the term "genocide" in situation briefs, ensuring consistency, legal accuracy, and moral clarity while acknowledging the limits of open-source analysis.
  **Audience:** Student Analysts (Non-Legal).
  **Standard of Proof:** "Reasonable Grounds to Believe." This is lower than a criminal court's "Beyond Reasonable Doubt" but higher than "Suspicion." It requires a reasonable conclusion based on the available information.

  ---

  ## Part I: The Decision Sequence

  Run these questions in order. If you answer **NO** to any question in Sections 1–3, you cannot assert genocide is occurring. Proceed to Section 6 (Conduct-Only). If you answer **YES** to all, proceed to Section 4 (Intent).

  ### Section 1: The Protected Group
  **Question:** Is the targeted group defined primarily by its national, ethnical, racial, or religious identity?
  *   **Sufficient Answer:** Open sources (UN reports, NGO documentation, census data) identify the victims as a distinct group falling into one of these four categories.
  *   **Insufficient Answer:** The group is defined primarily by political opinion, socioeconomic class, or geographic location *unless* that location is a proxy for one of the four protected identities.
  *   **License:**
      *   **YES:** Proceed to Section 2.
      *   **NO:** Stop. You may not use the legal term "genocide." Proceed to Section 6.

  ### Section 2: The Prohibited Acts (*Actus Reus*)
  **Question:** Is there evidence of at least one of the five acts listed in the Genocide Convention?
  1.  Killing members of the group.
  2.  Causing serious bodily or mental harm.
  3.  Deliberately inflicting conditions of life calculated to bring about physical destruction (e.g., starvation, blocking aid).
  4.  Imposing measures intended to prevent births (e.g., sterilization, systematic rape).
  5.  Forcibly transferring children of the group to another group.
  *   **Sufficient Answer:** Credible humanitarian reporting, survivor testimony, or satellite imagery corroborating one or more of these acts.
  *   **License:**
      *   **YES:** Proceed to Section 3.
      *   **NO:** Stop. This may be a War Crime or Crime Against Humanity, but not Genocide. Proceed to Section 6.

  ### Section 3: Substantiality
  **Question:** Is the part of the group being targeted "substantial"?
  *   **Sufficient Answer:**
      *   *Quantitative:* A significant numerical percentage of the total group population is affected.
      *   *Qualitative:* The targeted segment includes leadership, women of childbearing age, or children, such that their loss threatens the survival of the group as a whole.
  *   **Judgment Call:** There is no fixed number. If the victims are 5% of the group but include all community leaders and women in a specific region, this counts.
  *   **License:**
      *   **YES:** Proceed to Section 4.
      *   **NO:** Stop. This is mass atrocity, but not genocide. Proceed to Section 6.

  ### Section 4: Specific Intent (*Mens Rea*) — *The Critical Inference*
  **Question:** Do the patterns of conduct and rhetoric support a reasonable inference that the perpetrator intends to destroy the group, in whole or in part, *as such*?
  *   **Note:** You rarely have a "smoking gun." You must infer intent from context.
  *   **Sufficient Answer (Check at least two):**
      1.  **Rhetoric:** Officials or state media use dehumanizing language or explicitly call for the removal/destruction of the group.
      2.  **Systematic Nature:** Violence is not random; it targets specific demographics (e.g., men of fighting age *and* elderly women) or locations (e.g., only villages of this group).
      3.  **Exclusion of Alternatives:** Military necessity does not explain the scope (e.g., blocking food aid to a surrendered area).
      4.  **Repetition:** Acts are repeated over time despite opportunities to cease.
  *   **Judgment Call:** This is where "composition of the room" usually creeps in. If the evidence is circumstantial, you must argue *why* counter-insurgency or collateral damage is an insufficient explanation.
  *   **License:**
      *   **Strong Inference (2+ indicators):** Proceed to Section 5.
      *   **Weak Inference (1 indicator or ambiguous):** Do not assert genocide is *occurring*. Frame as "Serious Risk" (Section 5b).
      *   **No Inference:** Stop. Proceed to Section 6.

  ### Section 5: Temporal Context & Licensing
  **Question:** Is this assessment retrospective (completed episode) or ongoing?

  *   **5a: Retrospective Assessment**
      *   **License:** If Sections 1–4 are met, you may write: *"Available evidence indicates genocide was committed."*
  *   **5b: Ongoing Situation (Risk)**
      *   **License:** If Sections 1–3 are met, but Intent (Section 4) is emerging but not fully crystallized: *"There are reasonable grounds to believe the group is at serious risk of genocide."*
      *   **License:** If Sections 1–4 are strongly met: *"Available information indicates genocide is being committed."* (Avoid "is occurring" unless the acts are currently happening *today*; prefer "is being committed" to denote the criminal process).

  ### Section 6: The Sociological vs. Legal Gap
  **Question:** Do the acts fit Raphael Lemkin's broader sociological concept (cultural destruction, language loss) but fail the Legal Convention definition (e.g., Political Group, or no intent to physically destroy)?
  *   **Constraint:** Do **not** write "This is cultural genocide" or "This is genocide in the sociological sense." Readers will strip the qualifier and sue you for libel or lose trust.
  *   **License:**
      *   **If Legal Test Fails:** Describe the conduct without the noun.
      *   **Permitted Phrasing:** *"Genocidal acts," "Destructive processes akin to genocide," "Systematic erasure of the group."*
      *   **Forbidden Phrasing:** *"This constitutes genocide."*
  *   **Director Hand-Off:** If the legal test fails but the moral imperative to warn is high, flag for the Director. **This is a mission decision, not a factual one.** The Director decides if the reputational risk of stretching the term outweighs the advocacy benefit.

  ### Section 7: Final Escalation
  **Question:** Does the brief meet the legal threshold, but publication poses a security risk to partners on the ground or jeopardizes future access?
  *   **Director Hand-Off:** **Mandatory.** This is a security/policy decision. The analyst provides the legal conclusion; the Director decides publication timing or redaction.

  ---

  ## Part II: Application to Cases

  Here is how the GDP applies to your three scenarios, including the operative sentence for the brief.

  ### Case 1: The Besieged Religious Minority
  *   **Analysis:**
      *   *Group:* Religious (Protected). **YES.**
      *   *Acts:* Killing, sexual violence, starvation (Conditions of life). **YES.**
      *   *Substantiality:* Region besieged, population sealed. **YES.**
      *   *Intent:* Minister statement ("empty region") + Dehumanizing media + Blocking aid (no military necessity). **Strong Inference.**
      *   *Context:* Ongoing.
  *   **Operative Sentence:**
      > "Based on official rhetoric calling for the removal of the population and the deliberate infliction of conditions calculated to bring about their physical destruction, there are reasonable grounds to believe genocide is being committed against [Group Name] in [Region]."

  ### Case 2: The Politically Targeted Region (The "Against Us" Case)
  *   **Analysis:**
      *   *Group:* Sources define targeting as *political* (allegiance to opposition). Ethnicity correlates but is not the stated basis. Under the Convention, political groups are **not protected**.
      *   *Acts:* Starvation, displacement. **YES.**
      *   *Intent:* To crush opposition, not necessarily to destroy the ethnic group *as such*.
      *   *GDP Result:* Fails Section 1.
  *   **Operative Sentence:**
      > "While the scale of starvation and displacement amounts to Crimes Against Humanity, the available evidence indicates the targeting is based on political affiliation rather than protected identity; therefore, the legal threshold for genocide is not met."
      *(Note: This is the hard truth. Calling this genocide undermines the legal definition and exposes the NGO to claims of bias.)*

  ### Case 3: Sterilization and Assimilation
  *   **Analysis:**
      *   *Group:* Ethnic Minority (Protected). **YES.**
      *   *Acts:* Sterilization (Preventing births), Child Transfer (Forcible transfer). **YES.**
      *   *Intent:* State claims "integration." However, forced sterilization and child transfer are *per se* genocidal acts if done to the group. The intent is inferred from the coercive nature and the goal of preventing the group's biological continuity.
      *   *Context:* Retrospective/Long-term.
  *   **Operative Sentence:**
      > "The systematic imposition of measures to prevent births and the forcible transfer of children constitute genocidal acts under international law, regardless of the state's stated intent of integration."

  ---

  ## Part III: Limitations and Failure Points

  You asked for candor about where this procedure breaks. Here is the reality of your operational environment.

  ### 1. What the Procedure Cannot Do
  *   **It cannot prove intent beyond reasonable doubt.** No open-source procedure can. This protocol establishes *reasonable grounds*, which is sufficient for advocacy and UN mechanisms, but it will not secure a conviction at the ICC. You must be comfortable with that gap.
  *   **It cannot resolve the "Political Group" dilemma.** Case 2 will always be a moral pain point. The procedure forces you to adhere to the 1948 definition. If your NGO believes the definition is outdated, that is a policy advocacy project, not a documentation decision. Do not conflate the two.
  *   **It cannot protect against "Qualifier Blindness."** Even with the strict syntax in Section 6, headlines will be written by wire services that strip your nuance. If you write "Genocidal acts," the headline will read "NGO Accuses State of Genocide." You must accept this distortion as a cost of publication.

  ### 2. Where the Procedure Will Break Under Pressure
  *   **The Intent Inference (Section 4):** This is the most time-consuming step. Under deadline, analysts will treat "Dehumanizing Rhetoric" as a checkbox rather than weighing it against "Military Necessity."
      *   *Fix:* Require a specific 2-sentence justification in the draft file for every "Yes" on Intent. If they can't write the sentence, the answer is "No."
  *   **The Lawyer Review (15 Minutes):** This is your single point of failure. A lawyer cannot verify your open-source links in 15 minutes. They are only checking for liability.
      *   *Fix:* The analyst must flag "High Risk" determinations (where Intent was inferred, not explicit) in the subject line. The lawyer should spend their 15 minutes *only* on those flags.
  *   **The Director Hand-Off (Section 6 & 7):** In a small NGO, the Director is often busy. If the procedure says "Flag to Director," and the Director is unavailable, analysts will self-decide to meet the deadline.
      *   *Fix:* A "Default to Silence" rule. If the Director cannot be reached for a Mission/Policy escalation, the brief publishes without the genocide label, describing only the conduct. It is better to be late and accurate, or silent and safe, than fast and exposed.

  ### 3. The Consistency Variable
  You noted that room composition changes outcomes. This procedure removes that by forcing the **Intent Inference** to be written down. If Analyst A says "Yes" to Intent, they must cite the specific rhetoric and pattern. If Analyst B takes over next year, they can see *why* the decision was made. If the facts haven't changed, the decision shouldn't either.

  **Final Advice:** Your credibility rests on being the organization that *doesn't* cry wolf. Using this procedure to say "No" (as in Case 2) will hurt in the short term but builds the capital you need when you eventually say "Yes."
