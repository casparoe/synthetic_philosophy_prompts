          *   *Check V8:* Distinguishes pain badness from meta-distress. Confirms pain badness is local to the pain experience's motivational tone.

  3.  **Drafting Part (a): Prediction on New Vignette:**
      *   *New Vignette:* Reports pain as awful/wants stop (Explicit Aversion). BUT no behavior, no stress, accepts money to continue (Implicit/Behavioral Indifference/Approach).
