              *   *Imperativism:* Pain = Command. Asymbolics feel pain but no motivation. Imperativist says: They don't feel the *imperative* part, just the sensory part. So Asymbolia supports Imperativism (dissociation shows the imperative component is distinct). The student argues Asymbolia *threatens* Imperativism because "they shrug... don't have pains in the relevant sense." This is a misunderstanding of how imperativists typically handle asymbolia. They usually say the imperative content is missing. The student claims the imperativist must say "command is present but cut off from behaviour... basically to give up the view." This is a weak reading of imperativism.
              *   *Evaluativism:* Pain = Representation of Badness. Asymbolics feel pain but don't find it bad. Evaluativist says: They represent damage, but not *as bad*. This fits well. The student says "The evaluative view does better... It can say the A-patient retains an interoceptive awareness... but has lost the representation of that disturbance as bad." This is actually the standard Evaluativist line (e.g., Bain). The student says this "costs the evaluativist something... gives up the idea that pain is essentially bad." This is a fair criticism but acknowledges the view accommodates the data.
              *   *Desire View:* Pain = Desire to cease. Asymbolics feel pain, no desire to cease. Desire theorist says: No desire, no unpleasantness. Student says: "The desire view accommodates group A most easily." This is generally accepted.
