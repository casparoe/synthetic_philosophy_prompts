answer: |-
  Your paraphrase is remarkably sturdy. You haven't mangled the core argument; you've just run into the density that makes Sidgwick the last great Victorian moral philosopher worth reading.

  Here is the straight talk you need for your column, breaking down your specific questions.

  **1. Is the time move independent work, or just a runway for the person move?**
  It is primarily a runway, but a structural one. Sidgwick is building an analogical argument. He first establishes a principle of **Temporal Neutrality** (my future self is not less *me* than my present self) to pave the way for **Personal Neutrality** (another person is not less *a locus of value* than I am).

  He needs the time argument to work first because it is intuitively easier to swallow. It is harder to argue that *I* matter more than *you* than it is to argue that *now* matters more than *later*. By forcing the reader to concede that mere position in time is irrelevant to value, he makes it much harder to argue that mere position in personhood is relevant to value. If you accept the first, the second follows by analogy. So, the time move does independent logical work, but its strategic purpose is to support the universalist claim.

  **2. Does the uncertainty/vividness concession gut the anti-discounting point?**
  No. This is the most important distinction for your economic readers. Sidgwick distinguishes between **Pure Time Preference** and **Instrumental Discounting**.

  *   **Pure Time Preference:** Valuing a pleasure less *solely* because it occurs later. Sidgwick calls this irrational ("not reasonable").
  *   **Instrumental Discounting:** Valuing a pleasure less because you might die before getting it (uncertainty) or because you can't emotionally grasp it yet (vividness). Sidgwick accepts this as practical prudence.

  A defender of pure time preference cannot claim Sidgwick has handed them everything. Sidgwick explicitly says that if the future pleasure is certain and can be imagined vividly, there is *no rational ground* to discount it. The concession saves the *practice* of planning (we must account for risk), but it does not save the *principle* of pure discounting. For Sidgwick, a dollar in 50 years is worth exactly a dollar today, provided the probability of receipt is 100% and the utility is identical.

  **3. Where exactly is the line between a rational discount and a merely psychological one?**
  The line is **objective probability vs. subjective position.**
  *   **Rational:** "I discount this future benefit because there is a 20% chance I will be dead, or the government will collapse." (This is a change in the *expected value* of the good).
  *   **Irrational/Psychological:** "I discount this future benefit because it is far away on the timeline." (This is a change in the *value* of the good based solely on its coordinate).

  Sidgwick argues that time itself is not a value-altering property. Risk and imagination are.

  **4. Is the "Point of View of the Universe" doing argumentative work or is it decoration?**
  It is doing heavy argumentative lifting. It is not poetic decoration; it is the methodological definition of Utilitarianism. To aggregate goods across persons, you must adopt a vantage point where persons are not privileged.

  However, you have correctly identified the crack in the foundation. Sidgwick admits he cannot *prove* that an individual *ought* to adopt this point of view if it conflicts with their own self-interest (Rational Egoism). He famously concludes that the "Dualism of Practical Reason" (Prudence vs. Benevolence) is unresolved. He can only reconcile them if we assume a "moral ordering of the world" (essentially, that God ensures virtue pays). So, the standpoint is necessary for Utilitarianism to function, but Sidgwick confesses he lacks a purely rational proof that we are obligated to stand there.

  **5. How much of Pigou, Ramsey, and Parfit is already sitting in this paragraph?**
  Almost all of it.
  *   **Pigou's "telescopic faculty":** This is Sidgwick's "vividness" point.
  *   **Ramsey's "failure of imagination":** This is a direct echo of Sidgwick's claim that we discount because we imagine the future less vividly, not because it is less real.
  *   **Parfit:** *Reasons and Persons* is essentially a 400-page commentary on this specific Sidgwickian analogy between time and persons.

  Sidgwick provides the philosophical DNA; the economists provided the mathematical formalism. You can responsibly trace the lineage directly back to this text.

  **6. The Verdict: Can you say Sidgwick thought pure time preference was irrational?**
  Yes. You can state this plainly. His famous formulation is: **"Hereafter as such is to be regarded neither less nor more than Now."**

  He argues that regarding a future moment as less important *merely because* it is future is "irrational" (or in his Victorian phrasing, "not reasonable").

  **One nuance for your column:**
  Be careful not to imply Sidgwick thought *all* discounting was irrational. He thought discounting for **uncertainty** and **capacity for enjoyment** was rational. He thought discounting for **time itself** was irrational. Most economic debates on this topic (like the Stern Review on climate change) are fights over exactly this Sidgwickian distinction: are we discounting because the future might not happen (uncertainty), or because it is far away (pure time preference)? Sidgwick says the latter is ethically indefensible.

  **Summary for your piece:**
  Your paraphrase holds up. Sidgwick uses temporal neutrality to argue for personal neutrality. He allows for discounting based on risk and imagination, but condemns pure time preference as irrational. The "Point of View of the Universe" is the necessary vantage point for this conclusion, even if Sidgwick admits he can't force a selfish rational agent to adopt it without theological help. The modern economic debate is largely a technical elaboration of the intuition Sidgwick laid out in that paragraph.
