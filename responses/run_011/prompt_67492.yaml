  *   **"...if the set of possible deals grows so that one player's best case improves while the other's doesn't, the player whose options improved shouldn't end up with less."**
      *   **Verdict: Solid.**
      *   **Why:** This is an accurate plain-English definition of Individual Monotonicity.

  *   **"Their rule is beautifully concrete: mark the disagreement point and the utopia point... draw a straight line between the two, and take the last efficient deal that line runs through."**
      *   **Verdict: Solid.**
      *   **Why:** This is the correct geometric construction of the KS solution.

  *   **"In the example below both players land 60 percent of the way from breakdown to their ideal, which is what fairness amounts to here: an equal split of the pie."**
      *   **Verdict: Misleading/Pop-Sci Fluff.**
      *   **Why:** They land 60% of the way to their *ideal*, not an equal split of the *pie*. As you noted, $(3,3)$ is an equal split of payoffs. KS gives $(5.4, 1.8)$. This is "equal proportional concession," not "equal split." Calling it an equal split of the pie obscures the fact that Player 1 gets three times as much as Player 2.

  *   **"It's the only rule that is efficient, symmetric, unaffected by rescaling the payoffs, and monotone..."**
      *   **Verdict: Solid.**
