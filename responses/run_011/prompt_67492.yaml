  *   **"...which is why its the deal arbitrators and courts actually hand down..."**
      *   **Verdict: Unsubstantiated.**
      *   **Why:** There is no empirical consensus that courts use KS. Many use "split the difference" (Egalitarian) or simple efficiency arguments. This is a common trope in pop-econ books to make the math feel "real," but it shouldn't be taken as fact.

  *   **"...and unlike Nash's formula it can't be gamed by threatening to take options off the table."**
      *   **Verdict: Wrong.**
      *   **Why:** This is the second half of the swap. Because KS depends on the *utopia point* (the boundary of the set), removing options that define the utopia point (even if they aren't the solution) *will* change the KS outcome. Nash is *immune* to this (provided the old solution remains feasible). The author claims KS is robust to this; it is actually fragile.

  ### 2. The "Equal Split" and Arithmetic Check

  You are correct to be suspicious of the "equal split" language.

  *   **The Arithmetic:** The author's numbers are **correct**.
      *   **Utopia Point:** Max $x_1 = 9$, Max $x_2 = 3$. Point $u = (9,3)$.
      *   **KS Line:** From $(0,0)$ to $(9,3)$. Slope $1/3$. Equation $x_2 = x_1/3$.
      *   **Pareto Frontier:** The line segment from $(3,3)$ to $(9,0)$. Equation $x_2 = -0.5x_1 + 4.5$.
      *   **Intersection:** $x_1/3 = -0.5x_1 + 4.5 \Rightarrow 5x_1 = 27 \Rightarrow x_1 = 5.4$. Then $x_2 = 1.8$.
      *   **Nash:** Maximize $x_1 x_2$ on the frontier. Max $x_1(4.5 - 0.5x_1)$. FOC $4.5 - x_1 = 0 \Rightarrow x_1 = 4.5$. Then $x_2 = 2.25$.
      *   **Result:** KS $(5.4, 1.8)$, Nash $(4.5, 2.25)$. The math checks out perfectly.

  *   **The "Fairness" Claim:**
      *   KS equalizes the ratio of gain to maximum possible gain:
          *   Player 1: $(5.4 - 0) / (9 - 0) = 0.6$
          *   Player 2: $(1.8 - 0) / (3 - 0) = 0.6$
      *   This is **equal proportional gain**.
      *   However, calling it an "equal split of the pie" suggests $x_1 = x_2$. Since $(3,3)$ is feasible and efficient, a true "equal split" solution (like the Egalitarian solution) would pick $(3,3)$. KS picks $(5.4, 1.8)$, which is highly unequal in absolute terms. The author is using "fairness" to mean "proportional fairness," but phrasing it in a way that suggests distributive equality.

  ### 3. The IIA and "Gaming" Claim (Concrete Example)

  This is the most important part. The author claims Nash is vulnerable to adding/removing irrelevant options, and KS is immune. **The truth is the exact opposite.**

  **Nash satisfies IIA:** If you remove options that are not the solution, the Nash solution stays the same.
  **KS violates IIA:** If you remove options that define the utopia point (even if they are not the solution), the KS solution changes.

  **Let's use your feasible region to prove the author is wrong about KS.**

  *   **Original Set $S$:** Corners $(0,0), (9,0), (3,3), (0,3)$.
      *   Utopia: $(9,3)$.
      *   **KS Solution:** $(5.4, 1.8)$.
      *   **Nash Solution:** $(4.5, 2.25)$.

  *   **The "Threat":** Player 1 threatens to remove the option $(9,0)$. Suppose they delete that corner and replace it with $(6,0)$. Let's call this new set $S'$.
      *   Player 1 argues: "I'm taking $(9,0)$ off the table. Nobody was going to pick it anyway (Player 2 gets 0), so it's irrelevant."

  *   **Effect on KS:**
      *   New Utopia for $S'$: Max $x_1$ is now 6. Max $x_2$ is still 3. New Utopia $(6,3)$.
      *   New KS Line: From $(0,0)$ to $(6,3)$. Slope $1/2$. Equation $x_2 = 0.5 x_1$.
      *   New Frontier: Segment $(3,3)$ to $(6,0)$. Equation $x_2 = 6 - x_1$.
      *   New Intersection: $0.5 x_1 = 6 - x_1 \Rightarrow 1.5 x_1 = 6 \Rightarrow x_1 = 4$.
      *   **New KS Solution:** $(4, 2)$.
      *   **Result:** Player 1's payoff dropped from **5.4 to 4**.
      *   **Conclusion:** Player 1 was punished for removing an option $(9,0)$ that they never would have accepted (since it gives Player 2 zero). KS is **vulnerable** to this threat. The author claimed KS *can't* be gamed this way. The author is wrong.

  *   **Effect on Nash:**
      *   Does the Nash solution change?
      *   Old Nash Solution: $(4.5, 2.25)$.
      *   Is $(4.5, 2.25)$ still feasible in $S'$?
      *   Check frontier of $S'$: $x_2 \le 6 - x_1$.
      *   At $x_1 = 4.5$, max $x_2 = 1.5$.
      *   The old Nash point $(4.5, 2.25)$ is **no longer feasible**.
      *   *Correction for a clean IIA test:* To test IIA properly, we must remove options such that the *old solution remains feasible*.
      *   Let's try a different removal. Keep the frontier near $(4.5, 2.25)$ intact, but chop off the far right tail.
      *   Suppose we restrict $x_1 \le 8$. The point $(9,0)$ is gone. The Utopia becomes $(8,3)$.
      *   The old Nash point $(4.5, 2.25)$ is still feasible (it's well inside $x_1 \le 8$).
      *   **Nash:** Since the old solution is feasible and the set is smaller, IIA dictates the Nash solution **stays at $(4.5, 2.25)$**. (The Nash product is still maximized there relative to the local curvature).
      *   **KS:** The Utopia point moved from $(9,3)$ to $(8,3)$. The ray from $(0,0)$ becomes steeper. The intersection with the Pareto frontier moves. The KS solution **changes**.
      *   **Conclusion:** Nash is immune to the removal of "irrelevant" options (options that don't contain the solution). KS is sensitive to them. The author has it backwards.

  ### 4. Uniqueness and Conditions

  *   **"Only rule that is efficient, symmetric... monotone"**
      *   **Verdict: Theoretically Solid.**
      *   This is the standard Kalai–Smorodinsky Theorem.
      *   **Conditions:** It assumes the standard bargaining domain (compact, convex, comprehensive sets). It assumes 2 or more players (holds for $n$-players).
      *   **"Rescaling":** This refers to **Scale Invariance** (invariance to affine transformations of utility). This is the correct terminology for the axiom, though "rescaling" is an acceptable pop-sci shorthand.
      *   **Symmetry:** Note that KS is symmetric *only if* the problem is symmetric. If the utopia points are asymmetric (as in your example), the solution is asymmetric. The axiom requires that *if* the set and disagreement point are symmetric, *then* the solution is symmetric. The author's phrasing is slightly loose but acceptable in context.

  ### 5. The "Courts and Arbitrators" Claim

  *   **Verdict: Fiction.**
  *   There is no robust empirical literature suggesting courts specifically implement the Kalai–Smorodinsky solution. Legal settlements often gravitate toward "split the difference" (Egalitarian) or focal points based on precedent. While KS is "fair" in a proportional sense, claiming it is the *actual* standard in courts is a narrative device used by the author to sell the elegance of the math.

  ### Summary for your Seminar

  You can confidently tell your seminar colleagues that the pop book got the **arithmetic and geometry right**, but the **game theory backwards**.

  1.  **Nash satisfies IIA;** it is *not* vulnerable to adding/removing irrelevant options.
  2.  **KS violates IIA;** it *is* vulnerable to changes in the utopia point caused by adding/removing extreme options.
  3.  The author swapped these properties.
  4.  "Equal split of the pie" is misleading; it's "equal proportional gain," which can result in highly unequal payoffs (as seen in the 5.4 vs 1.8 split).

  Your skepticism was well-founded. The author knows the formula but doesn't seem to understand the strategic implications of the axioms.
