  # Diagnostic Instrument: The Rigidity & Appraisal Tree

  **Instructions:** Proceed through the nodes sequentially. Select the option that best matches your intuition about the *case*, not the label you think it produces.

  *   **Node 1 (Axis 1: Source of Rigidity):** Consider the wasp who loops when the cricket is moved.
      *   **A:** The looping is a specific sensory mismatch; change the perturbation, she adapts. *(Relational)* → Go to Node 2.
      *   **B:** The looping reveals a hard ceiling on error-correction depth common to all her behaviors. *(Intrinsic)* → Go to Node 2.
      *   **C:** The case is designed to provoke a gut feeling about mechanisms, not to track a fact. *(Deflationary-Emotional)* → **Leaf 1**.
      *   **D:** The case relies on a linguistic confusion about "routine" vs. "reflex." *(Deflationary-Linguistic)* → **Leaf 2**.

  *   **Node 2 (Axis 2: Flexibility Metric):** Consider the Lookup Table (vast but finite) vs. the Chess Engine (novel sacrifice).
      *   **A:** Both map inputs to outputs; the difference is storage size, not kind. *(Degrees)* → Go to Node 3.
      *   **B:** One retrieves, one computes; there is a cliff-edge between them. *(Threshold)* → Go to Node 3.
      *   *(Note: If you chose **Intrinsic** at Node 1 and **Degrees** here, your view is likely **Leaf 9**, as an intrinsic ceiling contradicts smooth scaling.)*

  *   **Node 3 (Axis 3 & Trade-off: Appraisal Basis):** Consider the Chess Engine's novel move vs. a person revising a conviction installed by hypnosis.
      *   *Trade-off:* You previously weighed the Engine's novelty (Axis 2). Now: If the Engine's rules were installed by a trick, does the novelty still count?
      *   **A:** Yes, current operation validates the move; origin is irrelevant. *(Structure)* → **Leaves 3, 4, 7**.
      *   **B:** No, origin taints the output; flexibility is secondary. *(History)* → **Leaves 5, 6, 8**.
      *   **C:** Only if the installation was biological does origin matter. *(Hybrid)* → **Leaf 10**.

  ---

  ### Leaves (Logical Space & Positions)

  1.  **Rhetorical Reflex** (Mandatory Deflationary)
      *   *Awkward Commitment:* Philosophical arguments about wasps are merely poetry masquerading as proof.
      *   *Confabulating Patient:* Neither praiseworthy nor blameworthy; the question is malformed.
  2.  **Semantic Quietism** (Deflationary-Linguistic)
      *   *Awkward Commitment:* Disagreements vanish if we define "routine" precisely, leaving no substantive debate.
      *   *Confabulating Patient:* Blameworthy only for imprecise speech, not for the act.
  3.  **Relational Functionalism** (Relational + Degrees + Structure)
      *   *Awkward Commitment:* A sufficiently large lookup table deserves the same credit as a human.
      *   *Confabulating Patient:* Praiseworthy if the invented reason works functionally.
  4.  **Intrinsic Functionalism** (Intrinsic + Threshold + Structure) *[Unexplored]*
      *   *Awkward Commitment:* There is a hard limit on flexibility, but history doesn't matter once crossed.
      *   *Confabulating Patient:* Praiseworthy if he crosses the flexibility threshold.
  5.  **Relational Historicism** (Relational + Degrees + History)
      *   *Awkward Commitment:* A flexible system deserves no credit if its rules were installed by another.
      *   *Confabulating Patient:* Blameworthy because the reason was not truly his own.
  6.  **Historical Essentialism** (Intrinsic + Threshold + History) (Mandatory Flexibility-Irrelevance)
      *   *Awkward Commitment:* A real difference in flexibility exists but leaves the core appraisal untouched.
      *   *Confabulating Patient:* Blameworthy regardless of how well he rationalizes the act.
  7.  **Pure Output Gradualism** (Relational + Degrees + Structure) *[Variant]*
      *   *Awkward Commitment:* Moral credit scales linearly with parameter count.
      *   *Confabulating Patient:* Praiseworthy in proportion to the coherence of the confabulation.
  8.  **Threshold Purism** (Intrinsic + Threshold + History)
      *   *Awkward Commitment:* Only biological systems that cross the complexity threshold count.
      *   *Confabulating Patient:* Blameworthy only if biologically human.
  9.  **The Category Error** (Intrinsic + Degrees) *[Incoherent]*
      *   *Awkward Commitment:* Rigidity is a fixed ceiling, yet flexibility is a smooth slope.
      *   *Confabulating Patient:* Response undefined; view collapses under scrutiny.
  10. **Bio-Hybrid Realism** (Hybrid Origin) *[Unexplored]*
      *   *Awkward Commitment:* Artificial flexibility counts, but artificial *origin* does not, unless biological.
      *   *Confabulating Patient:* Praiseworthy if the confabulation arises from biological neural tissue.

  ---

  ### Indistinguishable Pair Flag
  **Leaves 3 (Relational Functionalism) and 7 (Pure Output Gradualism)** cannot be separated by this tree. Both accept the Lookup Table as equivalent to the Chess Engine given sufficient scale. To separate them, one must lift the vocabulary ban and ask: *"Does the system possess **semantic understanding** of the moves, or merely syntactic manipulation?"* The tree diagnoses behavioral commitment; it cannot diagnose internal intentionality.

  ### Handling Inconsistent Participants
  In the pilot, one-third of participants produced inconsistent paths (e.g., claiming flexibility is a *Threshold* at Node 2 but treating the Lookup Table as *Degrees* equivalent at Node 3). Do not discard these maps. The inconsistency usually clusters at **Node 3 (The Trade-off)**. When a participant flags their own inconsistency, ask them to prioritize: *"If you had to sacrifice either the system's **capacity to adapt** (Axis 2) or the **authenticity of its origin** (Axis 3) to save your intuition about the wasp, which would you drop?"* This forces the latent hierarchy of their commitments to surface, often converting the inconsistency into a stable **Historical Essentialist** or **Functionalist** position. Treat the inconsistency not as an error, but as the primary data point indicating where the conceptual tension is felt most acutely.
