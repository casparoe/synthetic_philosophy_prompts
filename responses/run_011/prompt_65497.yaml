  3. Historians say credit and states came before coin, not barter inconvenience, so is Aristotle's origin story false? If you say it's a rational reconstruction rather than history, what specific phenomenon is that reconstruction supposed to explain and how would we know if it failed the job?

  4. Does Aristotle's account require the City-State to back the currency, or can Bitcoin fit his model of agreed value? If you say the State is necessary, what makes one agreement authoritative and another just a fad, and if you say no, what remains that is specifically Aristotelian rather than just generic contract theory?

