prompt: |-
  A chapter in a trade book on the origins of morality — not an academic work, but the author is a well-regarded science journalist — devotes several pages to Adam Smith, and I want to know how much of it to carry away. I have read perhaps a quarter of *The Theory of Moral Sentiments* myself, enough to feel that something is off in places but not enough to say where. Here is the passage, which I have transcribed in full:

  > "Smith's starting point is sympathy, by which he means the pity or compassion we feel on seeing another person suffer — a natural fellow-feeling that even the most hardened people possess in some degree. Because we cannot feel what others feel, we imagine ourselves in their place and compare what we would feel with what they appear to feel; where the two coincide we approve of their reaction, and where they diverge we disapprove. Our own case, however, is the one we care about most, so sympathy by itself cannot generate morality. For that Smith needs the impartial spectator: an internal tribunal we construct out of the approval and disapproval of the people around us, society's voice installed in the breast, which is all that conscience ever amounted to. Once the spectator is in place, the moral question is no longer what an action will bring about but whether one's motives would strike a detached onlooker as respectable, and Smith duly dismisses utility as having any bearing on approval at all. It is an elegant piece of moral psychology, and it does justice to the phenomenology of guilt. The difficulty is that it cannot escape its own premises: if the spectator is assembled from the actual attitudes of one's community, then a slaveholder's conscience is simply the conscience of a slaveholding community, and Smith has no standpoint from which to condemn it. He half saw the problem, and his solution was to abandon morality — in his later book the sympathetic man of the treatise gives way to the self-interested trader, and readers have been trying to reconcile the two Smiths ever since."

  Please audit this claim by claim rather than giving me a general verdict. For each sentence, tell me whether a Smith scholar would regard it as accurate, as a defensible simplification, as a conflation of two things Smith keeps distinct, as an overstatement of a modest thesis, or as simply false — and where it is a conflation, name the two claims being run together. Two specific worries of my own, which may or may not be well founded:

  - I have a hunch that the author is sliding between what people around the agent actually approve of and what they would approve of if they were better placed and less involved, and that this slippage is doing all the work in the relativism charge. But I cannot tell whether Smith himself draws that distinction, or whether I am importing it.
  - I was told once that Smith's 'sympathy' is not the same thing as pity, though I cannot reconstruct why anyone would think the distinction mattered. Does it matter here?

  Then take up the conclusions. Does the charge that the impartial spectator collapses into communal relativism survive once the summary is corrected? Say what resources Smith has for resisting it, and be honest about what those resources cost him — I would rather know where the objection retains residual force than be handed a clean defence. Is the sentence about utility and consequences wrong, and if so what is Smith's actual position on the role of usefulness in approval? And is there anything at all to the claim that he abandoned the moral book for the self-interested one, or is the supposed inconsistency between the two works a piece of folklore? I had thought he went on revising the moral book for years after the economic one appeared; tell me if that is right or if I am misremembering.

  Finally, rewrite the passage in five or six sentences so that it would survive this audit, keeping whatever the author gets right — including any point he is making badly with the wrong vocabulary.

  Write in British English. I am not looking for a bibliography, and please do not supply one; if you are confident about where in the book a given point sits, indicate it by part or section rather than by page, but do not guess. Where Smith's own view is genuinely disputed among interpreters, say that it is disputed rather than presenting one reading as settled.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Audit a specific passage from a trade book about Adam Smith's *The Theory of Moral Sentiments* (TMS).
      *   **Format:** Claim-by-claim analysis (sentence by sentence), followed by a discussion of conclusions (relativism, utility, Adam Smith Problem), and finally a rewrite of the passage.
      *   **Tone/Style:** British English, no bibliography, indicate location by Part/Section if confident (no guessing), acknowledge scholarly disputes where they exist.
      *   **User's Specific Worries:**
          1.  Slippage between actual approval vs. idealised approval (well-placed spectator).
          2.  Definition of 'sympathy' (pity vs. fellow-feeling).
      *   **Key Questions to Answer:**
          *   Does the relativism charge survive correction?
          *   What are Smith's resources against it, and what do they cost?
          *   Is the utility claim wrong?
          *   Is the "Adam Smith Problem" (abandoning morality for self-interest) folklore?
          *   Did Smith revise TMS after *Wealth of Nations* (WN)?

  2.  **Sentence-by-Sentence Audit:**

      *   *Sentence 1:* "Smith's starting point is sympathy, by which he means the pity or compassion we feel on seeing another person suffer — a natural fellow-feeling that even the most hardened people possess in some degree."
          *   **Analysis:** This is the classic definition error. Smith explicitly defines sympathy in TMS I.i.1.1 as "fellow-feeling with *any* passion whatever," not just suffering/pity.
          *   **Verdict:** False/Conflation. Conflates 'sympathy' (fellow-feeling) with 'pity/compassion' (specific to distress).
          *   **User Worry:** Confirmed. It matters because sympathy drives approval of joy/anger/ambition too, not just suffering.

      *   *Sentence 2:* "Because we cannot feel what others feel, we imagine ourselves in their place and compare what we would feel with what they appear to feel; where the two coincide we approve of their reaction, and where they diverge we disapprove."
          *   **Analysis:** This is a reasonably accurate summary of the mechanism of sympathy (changing places in fancy).
          *   **Verdict:** Accurate/Defensible simplification.

      *   *Sentence 3:* "Our own case, however, is the one we care about most, so sympathy by itself cannot generate morality."
          *   **Analysis:** Smith does argue we are more affected by our own feelings (TMS I.ii.1). Sympathy alone isn't enough for *moral judgement*; we need a standard.
          *   **Verdict:** Defensible simplification.

      *   *Sentence 4:* "For that Smith needs the impartial spectator: an internal tribunal we construct out of the approval and disapproval of the people around us, society's voice installed in the breast, which is all that conscience ever amounted to."
          *   **Analysis:** "Construct out of... people around us" is the dangerous bit. The spectator is *impartial*. It is informed by social interaction but transcends actual local opinion. "All that conscience ever amounted to" is reductionist.
          *   **Verdict:** Conflation/Overstatement. Conflates the 'actual spectator' (people around us) with the 'impartial spectator' (the idealised judge within).
          *   **User Worry:** Confirmed. This is the crux of the relativism charge.

      *   *Sentence 5:* "Once the spectator is in place, the moral question is no longer what an action will bring about but whether one's motives would strike a detached onlooker as respectable, and Smith duly dismisses utility as having any bearing on approval at all."
          *   **Analysis:** First half is okay (motives > consequences). Second half ("dismisses utility... at all") is too strong. Smith acknowledges utility pleases, but says it's not the *primary* source of moral approval (sentiment comes first, utility is secondary/refined).
          *   **Verdict:** Overstatement. Smith says utility is not the *first* principle, not that it has *no* bearing.

      *   *Sentence 6:* "It is an elegant piece of moral psychology, and it does justice to the phenomenology of guilt."
          *   **Analysis:** Subjective but fair.
          *   **Verdict:** Defensible simplification.

      *   *Sentence 7:* "The difficulty is that it cannot escape its own premises: if the spectator is assembled from the actual attitudes of one's community, then a slaveholder's conscience is simply the conscience of a slaveholding community, and Smith has no standpoint from which to condemn it."
          *   **Analysis:** This follows from the error in Sentence 4. If the spectator is just internalised local opinion, yes, relativism follows. But Smith argues the spectator corrects local opinion. However, Smith *does* struggle with this (e.g., infanticide, exposure of children).
          *   **Verdict:** Valid critique *if* the premise were true, but the premise is a caricature. It retains residual force because Smith's mechanism for correcting local bias is somewhat vague (appeal to 'humanity' or 'higher tribunal').

      *   *Sentence 8:* "He half saw the problem, and his solution was to abandon morality — in his later book the sympathetic man of the treatise gives way to the self-interested trader, and readers have been trying to reconcile the two Smiths ever since."
          *   **Analysis:** This is the "Adam Smith Problem." Modern scholarship largely rejects this. Smith revised TMS significantly after WN. He didn't abandon morality.
          *   **Verdict:** False/Folklore.

  3.  **Addressing the Conclusions:**

      *   **Relativism:** Does it survive? Yes, but in a weaker form. Smith relies on the 'well-informed' spectator. But where does the information come from? If everyone is biased, how does the spectator get unbiased? Smith appeals to a universal standard of 'propriety' and eventually to the 'Judge of all the world' (God/Nature). Cost: He has to posit a universal human nature that transcends culture, which is philosophically costly and empirically debatable.
      *   **Utility:** Smith's position is nuanced. Utility contributes to the *beauty* of a system and secondary approval, but the *primary* moral sentiment arises from sympathy with motives. The passage claims he dismisses it "at all," which is wrong (TMS Part IV).
      *   **Adam Smith Problem:** It is folklore. Smith added significant material to TMS in the 6th edition (1790), long after WN (1776). He saw them as compatible parts of a larger system of jurisprudence and morals.

  4.  **Drafting the Response (incorporating British English & constraints):**

      *   *Tone:* Professional, analytical, slightly academic but accessible (matching the user's level).
      *   *Structure:*
          1.  Sentence-by-sentence audit.
          2.  Addressing specific worries (Sympathy definition, Spectator slippage).
          3.  The Conclusions (Relativism, Utility, Adam Smith Problem).
          4.  The Rewrite.

      *   *Refining the Audit:*
          *   S1: False. Sympathy = fellow-feeling with *any* passion.
          *   S2: Accurate.
          *   S3: Defensible.
          *   S4: Conflation. Actual vs. Impartial spectator.
          *   S5: Overstatement. Utility is secondary, not non-existent.
          *   S6: Defensible.
          *   S7: Valid *conditional* critique, but based on the S4 error. Residual force remains regarding cultural bias.
          *   S8: False. The 'Problem' is largely discredited.

      *   *Refining the Conclusions:*
          *   Relativism: Smith uses the 'well-informed' spectator. But how do we know what is well-informed? He appeals to universal principles. Cost: Potential circularity or reliance on theological/natural assumptions.
          *   Utility: Part IV of TMS. Utility pleases, but isn't the root of virtue.
          *   ASP: Discredited. 6th Edition TMS (1790) post-dates WN (1776).

      *   *Refining the Rewrite:*
          *   Must fix 'sympathy' definition.
          *   Must fix 'impartial spectator' origin (not just local opinion).
          *   Must fix utility claim.
          *   Must remove the 'abandonment' claim.
          *   Keep the core insight (sympathy -> spectator -> motive focus).

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I use British English? (e.g., 'fellow-feeling', 'programme', 'centre', 'honour').
      *   *Check:* Did I avoid a bibliography? Yes.
      *   *Check:* Did I address the user's specific hunches? Yes, explicitly validate them.
      *   *Check:* Is the distinction on 'sympathy' clear? Yes, it's crucial because one can sympathise with a benefactor's joy, not just a victim's pain.
      *   *Check:* On the relativism point, be honest. Smith *does* struggle with this. He condemns infanticide in some cultures but acknowledges custom's power. Don't give a "clean defence."
      *   *Check:* On the Adam Smith Problem. Be firm. It's 19th-century German scholarship largely rejected now.

  6.  **Final Polish:** Ensure the transition between the audit and the thematic discussion is smooth. Make sure the rewrite sounds like a trade book (flowing, not dry) but is accurate. (Self-correction: Ensure I mention that Smith *does* revise TMS *after* WN, confirming the user's memory).

  7.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ### Audit of the Passage

  **Sentence 1:** *"Smith's starting point is sympathy, by which he means the pity or compassion we feel on seeing another person suffer — a natural fellow-feeling that even the most hardened people possess in some degree."*
  **Verdict:** **False.**
  This is a definitional error. In Part I, Section I, Chapter I of *The Theory of Moral Sentiments* (TMS), Smith explicitly defines sympathy not as pity, but as 'our fellow-feeling with *any* passion whatever'. One may sympathise with another's joy, anger, or ambition, not merely their distress. While pity is a *form* of sympathy, equating the two truncates Smith's mechanism, which relies on our ability to enter into the sentiments of the agent as well as the beneficiary.

  **Sentence 2:** *"Because we cannot feel what others feel, we imagine ourselves in their place and compare what we would feel with what they appear to feel; where the two coincide we approve of their reaction, and where they diverge we disapprove."*
  **Verdict:** **Accurate.**
  This is a defensible summary of Smith's mechanism of 'changing places in fancy'. It correctly identifies that moral approval arises from the concord between the spectator's imagined feelings and the agent's actual feelings.

  **Sentence 3:** *"Our own case, however, is the one we care about most, so sympathy by itself cannot generate morality."*
  **Verdict:** **Defensible simplification.**
  Smith argues in Part I, Section II that our own passions are naturally more intense than those we observe in others. Consequently, raw sympathy is unstable; we require a standard to regulate our own self-preference and to judge others fairly.

  **Sentence 4:** *"For that Smith needs the impartial spectator: an internal tribunal we construct out of the approval and disapproval of the people around us, society's voice installed in the breast, which is all that conscience ever amounted to."*
  **Verdict:** **Conflation.**
  This runs together two distinct claims: (1) that the spectator is developed through social interaction, and (2) that it is merely an internalisation of *actual* local opinion. Smith's spectator is 'impartial' precisely because it is *not* bound by the actual attitudes of the community. It represents how a well-informed, detached person *would* judge, not necessarily how one's neighbours *do* judge. Your hunch here is well-founded: Smith distinguishes between the 'man without' (actual spectators) and the 'man within' (the idealised judge).

  **Sentence 5:** *"Once the spectator is in place, the moral question is no longer what an action will bring about but whether one's motives would strike a detached onlooker as respectable, and Smith duly dismisses utility as having any bearing on approval at all."*
  **Verdict:** **Overstatement.**
  The first clause is accurate; Smith prioritises motives and propriety over consequences. The second clause, however, is too strong. In Part IV, Smith acknowledges that the utility of actions does please us and contributes to our sense of beauty and approbation, but he argues it is not the *primary* or *original* source of moral sentiment. He demotes utility; he does not dismiss it 'at all'.

  **Sentence 6:** *"It is an elegant piece of moral psychology, and it does justice to the phenomenology of guilt."*
  **Verdict:** **Defensible simplification.**
  Smith's account of remorse (the horror of the 'man within' turning against us) is widely regarded as a high point of the book.

  **Sentence 7:** *"The difficulty is that it cannot escape its own premises: if the spectator is assembled from the actual attitudes of one's community, then a slaveholder's conscience is simply the conscience of a slaveholding community, and Smith has no standpoint from which to condemn it."*
  **Verdict:** **Valid conditional critique, but based on a false premise.**
  Because Sentence 4 conflated the actual and the impartial spectator, this conclusion follows logically from the text provided but misrepresents Smith. However, the objection retains residual force. Even if the spectator is idealised, Smith admits (in Part V) that custom and fashion can corrupt moral sentiments. His resource against this is an appeal to universal human nature or a 'higher tribunal' (God), but he offers no algorithm for distinguishing a corrupted conscience from a correct one other than an appeal to the 'natural' sentiments of humanity. This is philosophically costly, as it relies on a contentious view of human nature.

  **Sentence 8:** *"He half saw the problem, and his solution was to abandon morality — in his later book the sympathetic man of the treatise gives way to the self-interested trader, and readers have been trying to reconcile the two Smiths ever since."*
  **Verdict:** **False.**
  This is the 'Adam Smith Problem', a piece of nineteenth-century folklore largely rejected by modern scholarship. Smith did not abandon the project of TMS; he revised it significantly. The sixth and final edition of TMS was published in 1790, fourteen years after *The Wealth of Nations* (1776). In it, he added substantial material (including the discussion of the 'nature of that philosophy which aims at establishing the principles of morals') suggesting he viewed the two works as compatible parts of a larger system of jurisprudence and morals.

  ***

  ### Discussion of Conclusions

  **The Relativism Charge**
  Your suspicion regarding the slippage between actual and ideal approval is correct and central. Smith attempts to resist relativism by insisting the impartial spectator is not a mirror of local opinion, but a correction of it. He argues that while custom can warp our judgement, there are natural principles of approbation that remain constant across cultures (e.g., the horror of gratuitous cruelty).
  *   **Resources:** Smith appeals to the 'natural' sentiments of mankind and, ultimately, to the 'Supreme Being' as the final judge.
  *   **Cost:** This forces Smith into a difficult position. If the spectator is constructed from social experience, how does it transcend social bias? Smith must posit a universal human nature that is accessible despite cultural distortion. He admits that in some cases (such as the exposure of infants in ancient Greece), custom can overwhelm natural sentiment entirely. Thus, the defence is not clean: Smith has no secular, procedural method for guaranteeing the spectator's impartiality other than an earnest attempt to view things 'as they really are'.

  **The Role of Utility**
  The passage is wrong to claim Smith dismisses utility. Smith's position is that while we *do* approve of useful things, our *sense* of that approval is derived from sympathy. We sympathise with the happiness of those benefited by the useful object. Utility is a secondary enhancer of virtue, not its foundation. To say he dismisses it 'at all' ignores Part IV of TMS, where he explores the 'beauty' of utility at length.

  **The 'Adam Smith Problem'**
  Your memory is correct. Smith continued to revise *The Theory of Moral Sentiments* long after publishing *The Wealth of Nations*. The claim that he abandoned morality for economics is a caricature. In Smith's view, the 'self-interested trader' operates within a moral and legal framework established by the principles in TMS. The two books address different spheres of his system (morals and jurisprudence vs. political economy), not contradictory anthropologies.

  ***

  ### Rewritten Passage

  Smith's starting point is sympathy, by which he means the fellow-feeling we experience when we imagine ourselves in another's situation, whether they are suffering or rejoicing. Because we cannot directly access another's emotions, we judge their conduct by comparing their feelings with what we imagine we would feel in their place; where these sentiments coincide, we approve. Yet, since we naturally favour our own interests, Smith argues we require an 'impartial spectator': an internalised judge that corrects our local biases by representing the view of a well-informed, detached onlooker. Once this tribunal is established, moral approval depends less on the utility of an action than on the propriety of the motives behind it. This framework offers a compelling psychology of conscience, though it faces the enduring challenge of ensuring the spectator transcends the prejudices of the very society that formed it. Contrary to the notion that Smith later abandoned this moral system for economics, he continued to revise his theory of sentiments throughout his life, viewing it as the necessary foundation for his wider work on society.
