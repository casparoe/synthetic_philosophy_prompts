      *   **Constraint:** Defend occasionalism (no necessary connection between cause and effect, only habitual sequence created by God). Acknowledge the philosophers' elegance but deny necessity. Don't retreat into mystery; provide an actual account.
      *   **Opponent:** A grad student (bright, allergic to theology, read enough Avicenna to be dangerous).
      *   **Scenario:** Office hours rehearsal.
