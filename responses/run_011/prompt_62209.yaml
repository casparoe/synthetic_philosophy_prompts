  Vote to take the family.

  Your record supports three competing rules: "Last Resort" (2016, 2018), "Capacity Fit" (2015, 2017), and "Queue Priority" (2014, 2021). The 2021 decision belongs to "Queue Priority," overriding the "Last Resort" logic of 2016 despite committee discomfort. The closest precedent is 2021, where other groups were interested, though 2017 warns against taking those with existing support.

  The three-versus-four file problem should not move you. In 2019, you took a woman with no file at all, establishing that bureaucratic imperfection is secondary to human need. The nurse detail is not bias; it satisfies "Capacity Fit" (unlike 2015) without triggering 2017's "does not need us" clause, because a family with children differs from a single engineer.

  If you vote Take, you adopt the principle of "Stewardship of Opportunity": we use our capacity where it fits best, regardless of whether others could also help. If you vote Decline, you adopt "Safety Net of Last Resort": we only intervene when no other path exists. The record doesn't fully decide this tension because 2021 fractured the "Last Resort" rule without replacing it.

  To settle the rule next year, you need a referral that forces a choice between Queue and Last Resort. The tiebreaker referral would be: a family waiting fifteen years with moderate medical needs we can meet, but with a guaranteed government placement in another city already secured. Taking them confirms "Queue Priority" as the dominant rule. Declining them confirms "Last Resort" remains the standard, rendering 2021 an anomaly.

  Your lean to take is consistent with the most recent precedent (2021) and the strongest capacity match in your history. The "committed housing" elsewhere is the only deviation from 2021, but since that placement is three hours away and your community offers language support and immediate housing, you are offering a *better* fit, not just a duplicate option. This distinguishes it from 2017's job offer, which was local. You are not duplicating support; you are optimizing it.
