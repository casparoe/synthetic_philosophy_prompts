      **Project Statement:** This project investigates whether Aristotle's distinction between natural slaves and free women in Politics Book I turns on legal standing rather than psychological capacity.

      **The Research Question**
      Does the term *akuron*, used by Aristotle to describe the deliberative faculty of free women, denote a lack of authoritative force rather than a defect in deliberative function? This question is framed to allow a negative outcome. If the evidence shows *akuron* refers primarily to internal cognitive weakness in this context, the hypothesis fails. If it refers to external ratification or standing, the hypothesis holds. The inquiry avoids presuming that Aristotle's household hierarchy is strictly psychological; instead, it treats the vocabulary of authority as potentially juridical. This framing ensures the project is an investigation rather than a confirmation of a preferred reading.

      **Existing Positions and the Stalemate**
      Current scholarship on natural slavery falls into three camps, all of which leave this question open. The first argues the doctrine is self-undermining, claiming Aristotle cannot coherently describe a human who perceives reason but cannot originate it. The second treats the doctrine as an ideological artifact, dismissing the philosophical coherence in favor of exposing its function in justifying Athenian oppression. The third derives the doctrine from Aristotle's general account of rule for the sake of the ruled, arguing the slave benefits from the master's direction. Despite their differences, all three positions share a critical assumption: they read the deficiencies of the slave, woman, and child as internal psychological states. They assume the debate is about what kind of soul these subjects possess.

      This shared assumption creates a stalemate. If the deficiency is psychological, the critics of coherence win: the distinction between apprehending and having reason is untenable. If the deficiency is juridical, the coherence problem dissolves. The slave lacks deliberation entirely; the woman has deliberation but lacks the standing to make it final; the child has deliberation that is immature. This recasts the household not as a collection of distinct psychologies but as a single distributed agency where content and finality are allocated to different members. The existing positions cannot see this because they do not test the lexical register of *akuron*. They assume the word describes a faculty rather than a status. My project tests this assumption directly.

      **Method and Timeline**
      The project will unfold over fourteen weeks in three phases. Weeks one through four focus on lexical groundwork. I will examine the usage of *akuron* and its antonym *kyrios* in fourth-century Greek, specifically looking for occurrences in legal, political, and contractual contexts. The primary check is whether these terms describe decrees, verdicts, or agreements that are unratified or void. If *akuron* consistently denotes a lack of standing rather than a lack of function in contemporary usage, the first condition for the hypothesis is met. I will also survey Aristotle's usage outside the *Politics* to see if he employs this juridical register elsewhere when discussing authority.

      Weeks five through nine focus on textual pressure points within *Politics* Book I. I will analyze the passage where Aristotle distinguishes the slave, woman, and child, alongside the description of the slave as a living separated part of the master's body. Crucially, I will examine the claim that the master's knowledge is nothing grand because he only needs to know how to order, not how to do. If the master contributes ratification rather than content, his expertise should appear thin, consistent with the ability to delegate it to a steward. I will map whether the text supports this division of labor. If the lexical evidence from phase one goes against me—showing *akuron* is primarily psychological in Aristotle—I will pivot in phase two. Instead of proving the juridical reading, I will investigate why Aristotle mixes juridical language with psychological description, treating the ambiguity itself as the object of study.

      Weeks ten through fourteen are reserved for synthesis and writing. I will draft the article, ensuring the argument moves from the lexical evidence to the philosophical implications. This phase includes internal review to ensure the distributed agency model does not overreach the text.

      **Defense Against Objections**
      Two obvious objections anticipate this approach. The first is that it imports contemporary machinery about group and distributed agency into a fourth-century text. This objection assumes that describing a household as a single agency requires modern sociological theory. However, the project does not impose external theory but extracts the structure from Aristotle's own metaphors, specifically the slave as a part of the master's body. If the slave is a bodily part, the household acts as a single organism. The question is merely how the nervous system of that organism is described. The second objection is that the whole doctrine is better dismissed than reconstructed. Critics may argue that natural slavery is so morally repugnant that analyzing its coherence is pointless. However, dismissing the doctrine prevents us from understanding how such justifications functioned philosophically. Reconstructing the logic reveals how authority was naturalized, which is vital for understanding the history of political thought. Understanding the mechanism of the error is more valuable than simply noting the error exists.

      **Success and Failure Conditions**
      A successful result will demonstrate that *akuron* functions primarily as a marker of legal standing in this context, supporting the view that the master provides ratification rather than deliberative content. This would resolve the coherence problem regarding the natural slave by shifting the ground from psychology to status. However, the project must define clear failure conditions. First, the project fails if lexical evidence shows *akuron* is strictly psychological in Aristotle's corpus, with no juridical overlap. Second, it fails if textual analysis shows the master contributes specific content to decisions rather than merely ordering them. Third, it fails if the distributed model collapses when applied to the slave, who lacks deliberation entirely; if the slave cannot be a "part" in the relevant sense, the household agency model breaks. These conditions ensure the project remains falsifiable.

      **Scope and Assessment**
      This project is scoped for one semester of teaching relief. The primary risk is expansion into the *Nicomachean Ethics* or comparative analysis with Plato. While relevant, these would make the project too large alongside remaining departmental obligations. If time becomes constrained, I will cut comparative analysis first, sticking strictly to *Politics* Book I. I will also limit the lexical survey to Aristotle and his immediate contemporaries rather than expanding to the broader corpus of Attic Greek. This ensures the project remains manageable. The teaching relief is essential because the lexical phase requires sustained concentration that fragmented scheduling prevents. Without this block of time, the nuanced lexical work would likely be rushed, compromising the foundation of the argument.

      **Stakes and Committee Concerns**
      I address directly the suspicion that this is a lexical quibble dressed up as a philosophical problem. It is not. If the deficiency of the woman is psychological, Aristotle is making a claim about human nature. If it is juridical, he is making a claim about political structure. Getting this right changes how we understand the foundation of Aristotle's political naturalism. It shifts the debate from whether Aristotle was right about women's minds to how he structured authority within the household. This has implications beyond one chapter. It affects how we read the transition from household to city, and whether the city is composed of distinct individuals or composite agencies. If the household is a distributed agency, the city may be as well. This changes the ontology of the political community. Therefore, the lexical detail is not pedantry; it is the hinge on which the interpretation of Aristotle's practical philosophy turns. Resolving this determines whether we read the *Politics* as a treatise on psychology or a treatise on power.

