answer: |-
  **AUTOMATION PROPOSAL ASSESSMENT PROCEDURE (DRAFT v1.0)**
  **To:** Service Delivery Team Leads
  **From:** Service Delivery Manager
  **Subject:** Decision Framework for Automation Proposals

  This document sets out the procedure for assessing automation proposals within the fortnight review window. It is not a policy document; it is a testing rig. Its purpose is to separate factual claims from value judgements before a proposal reaches the Managing Director or the Staff Forum.

  We are not asking whether technology *can* do the work. We are asking what happens to the work, and the people doing it, when the technology *does* do it.

  ### PART 1: THE DISTINCTIONS (TESTABLE VS. JUDGEMENT)

  You need to know which of our core concerns can be settled with data in two weeks, and which cannot. Do not pretend you can measure the unmeasurable.

  **1. Tasks vs. Jobs (Economist's View)**
  *   **Status:** Testable.
  *   **Method:** Task mapping. Compare the current task list for the role against the proposed post-automation task list.
  *   **Pass Condition:** We can list exactly which tasks move to the system and which remain with the human. If the vendor cannot specify this in writing, the procedure stops.

  **2. Role Hollowing vs. Role Disappearance**
  *   **Status:** Partially Testable.
  *   **Method:** Skill audit. Compare the skill level required for the *remaining* tasks against the current job grade.
  *   **Pass Condition:** The remaining tasks require equal or higher cognitive load than the removed tasks.
  *   **Escalation:** If the title remains but the skill requirement drops, this is 'Hollowing'. This is a factual finding, but the decision on whether to accept it is a value judgement for the MD/Forum.

  **3. The Apprenticeship Ladder**
  *   **Status:** Testable.
  *   **Method:** Cohort analysis. Identify if the automated tasks are the primary training ground for junior staff (Band 2/3 equivalents).
  *   **Pass Condition:** There is a verified alternative training pathway for juniors that does not rely on the automated tasks.
  *   **Fail Condition:** The automation removes the only mechanism by which juniors learn the craft. This is a hard stop unless a training plan is attached.

  **4. Recognition and Attribution**
  *   **Status:** Testable.
  *   **Method:** Output signing. Who signs the final report? Who is named in the audit trail?
  *   **Pass Condition:** The human retains final sign-off authority and is credited in the metadata.
  *   **Fail Condition:** The system is the primary author and the human is an invisible corrector.

  **5. Counterfactual Contribution**
  *   **Status:** Not Testable (in a fortnight).
  *   **Reasoning:** Determining whether the work would be noticeably worse without *this specific person* requires longitudinal data or A/B testing we do not have time for.
  *   **Action:** This must be flagged for the Staff Forum. It is a question of professional worth, not efficiency.

  ---

  ### PART 2: THE PROCEDURE

  Run the proposal through these five gates in order. If a gate is failed, the proposal either stops or is escalated with a specific warning label.

  **GATE 1: THE TASK MAP**
  *   **Question:** Can the vendor or internal lead list every task being transferred to the system, and every task remaining with the staff?
  *   **Required Evidence:** A side-by-side workflow diagram (Current vs. Proposed).
  *   **Stop Condition:** If the answer is "It learns as it goes" or "We'll see once it's live," bin the proposal. We do not pilot on live patient data without a defined scope.
  *   **Outcome:** If passed, proceed to Gate 2.

  **GATE 2: THE LADDER CHECK**
  *   **Question:** Are the tasks being automated the primary training tasks for junior staff (0–18 months tenure)?
  *   **Required Evidence:** Training logs showing where current seniors learned their craft.
  *   **Stop Condition:** If yes, and there is no funded, scheduled alternative training programme attached to the proposal.
  *   **Outcome:** If passed, proceed to Gate 3. If failed, escalate to MD with 'Apprenticeship Risk' flag.

  **GATE 3: THE HOLLOWING AUDIT**
  *   **Question:** Do the remaining human tasks require the same clinical coding qualification level as the current role?
  *   **Required Evidence:** Job description comparison (Pre- vs. Post-automation).
  *   **Stop Condition:** If the remaining work is purely administrative (checking boxes) rather than clinical (interpreting notes), the role is being hollowed.
  *   **Outcome:** If passed, proceed to Gate 4. If failed, escalate to Staff Forum with 'Deskilling Risk' flag.

  **GATE 4: ATTRIBUTION TEST**
  *   **Question:** In the final output sent to the Trust, is the human coder/transcriber identifiable as the responsible party?
  *   **Required Evidence:** Sample output report.
  *   **Stop Condition:** If the output is branded as 'System Generated' with no human sign-off.
  *   **Outcome:** If passed, proceed to Gate 5.

  **GATE 5: THE COUNTERFACTUAL FLAG**
  *   **Question:** If this person were removed entirely, would the error rate rise significantly?
  *   **Required Evidence:** None required (cannot be proven in fortnight).
  *   **Action:** This question must be explicitly placed on the agenda for the Staff Forum consultation. It cannot be answered by the Team Lead.
  *   **Outcome:** Proposal is ready for MD review, provided Gates 1–4 are passed or flagged appropriately.

  ---

  ### PART 3: CASE STUDY RUN-THROUGH

  Here is the procedure applied to the three live proposals currently on your desk.

  **CASE 1: Automated First-Pass Coding (Outpatient Letters)**
  *   **Proposal:** System codes 90% of routine letters. Coder checks a 10% sample.
  *   **Gate 1 (Task Map):** Pass. Tasks are clearly defined (Auto-code vs. Sample Check).
  *   **Gate 2 (Ladder):** **FAIL.** First-pass coding is how juniors learn clinical terminology and note interpretation. If the system does the first pass, juniors only see pre-digested data. There is no alternative training plan listed.
  *   **Gate 3 (Hollowing):** **FAIL.** The coder moves from 'Interpreter' to 'Sampler'. The skill requirement drops from Clinical Coding Qualification to Quality Assurance Checker. The title 'Coder' remains, but the substance is gone.
  *   **Gate 4 (Attribution):** **FAIL.** The system generates the code. The human checks a sample. If an error slips through the 90%, who is liable? The audit trail will likely show 'System' as the primary actor.
  *   **Verdict:** **DO NOT PROCEED.** This proposal fails on Ladder, Hollowing, and Attribution. It preserves the headcount but destroys the profession.

  **CASE 2: Query Letter Drafting System**
  *   **Proposal:** System drafts queries to clinicians. Coder reads, amends, and sends.
  *   **Gate 1 (Task Map):** Pass. Drafting vs. Reviewing.
  *   **Gate 2 (Ladder):** **FLAG.** Writing queries is a key learning step for understanding clinical ambiguity. However, reviewing and amending still requires that understanding. It is a risk, but not a total block.
  *   **Gate 3 (Hollowing):** Pass. The coder must still validate the clinical logic. The cognitive load remains high.
  *   **Gate 4 (Attribution):** Pass. The coder sends the letter. The signature is human.
  *   **Verdict:** **PROCEED WITH CAUTION.** Escalate to Staff Forum with a note on 'Training Impact'. The efficiency gain is real, but we must ensure juniors aren't just rubber-stamping AI drafts.

  **CASE 3: Scrap Junior Transcription QA**
  *   **Proposal:** Error rates fell after new software. Remove two junior QA roles. Redeploy to 'Exception Handling'.
  *   **Gate 1 (Task Map):** Pass. QA role removed. Exception Handling created.
  *   **Gate 2 (Ladder):** **FAIL.** Junior QA is the entry point for transcriptionists. Removing it removes the bottom rung. 'Exception Handling' is not a defined training role.
  *   **Gate 3 (Hollowing):** N/A (Role is disappearing, not hollowing).
  *   **Gate 4 (Attribution):** **FLAG.** Error rates fell because the software is good. The humans are now only seeing the failures. Their contribution becomes invisible unless they catch a mistake. They become failure detectors, not quality assurers.
  *   **Verdict:** **ESCALATE TO MD & FORUM.** This is the answer you won't like. The data says it's efficient (error rates are down). The procedure says it's structurally unsound. You are trading long-term workforce sustainability for short-term metric gains. If you approve this, you must accept that you have no pipeline for new transcriptionists.

  ---

  ### PART 4: THE UNPLEASANT TRUTH

  **Case 1 is the critical failure.**

  I know you want to approve it. It promises the biggest efficiency gain and keeps everyone employed, which keeps the MD happy and the unions quiet. But the procedure identifies it as 'Hollowing'.

  If you implement Case 1, you keep the 'Coder' titles on the door, but within two years, you will not have any staff capable of coding without the system. You are converting a skilled workforce into a system-monitoring workforce. When the system fails (and it will), you will have no one left who knows how to do the work manually. You are mortgaging your business continuity for a quarterly efficiency target.

  The procedure demands you reject it unless the vendor funds a separate training academy. They won't. So you must bin it.

  ---

  ### PART 5: LIMITS AND BIASES

  Do not treat this procedure as a machine that produces truth. It has blind spots.

  **1. The Lag Bias**
  This procedure is systematically over-optimistic about benefits and under-optimistic about harms. Why? Because the benefits (time saved, cost cut) are immediate and measurable in a fortnight. The harms (skill atrophy, morale decay, loss of institutional knowledge) take months or years to surface. The procedure flags them, but the financial pressure to ignore the flags will be immense.

  **2. The 'Exception Handling' Trap**
  In Case 3, 'Exception Handling' is a euphemism. In practice, this often expands to fill the time saved (Parkinson's Law). The procedure treats it as a new role, but it may well be make-work. We cannot test for 'make-work' in two weeks. This is a judgement call for the Team Lead who knows the team culture.

  **3. Judgement Disguised as Procedure**
  Gate 3 (Hollowing) looks objective ('Does it require the same qualification?'). It is not. A task can require a qualification but be soul-destroying. A role can be technically skilled but lack autonomy. The procedure counts the skills; it cannot measure the satisfaction. That is why the Staff Forum sign-off is mandatory. Do not try to bypass them by claiming the 'data says it's fine'.

  **4. The Counterfactual Blind Spot**
  We cannot answer the 'Counterfactual Contribution' question. We don't know if the work would be worse without the person until the person is gone. By then, it's too late. This procedure forces that question into the room, but it cannot answer it. It relies on the Staff Forum to represent the 'value of the person' against the 'value of the output'.

  **Final Instruction:**
  Print this. Use it. If a vendor or internal lead cannot answer Gate 1, do not book the meeting with the MD. Save us all the time.

  **Signed,**
  **Service Delivery Manager**
