answer: |-
  **The Scenario**

  A workforce agency randomized 2,000 applicants to "Intensive Coaching" (Treatment) or "Job Board Access" (Control). The outcome is employment at six months. The design documents specify that "Job Complexity" (High/Low) was recorded at month three, after Coaching began. Coaching is known to help applicants secure more complex roles.

  **Employment Rates by Job Complexity**

  | Group | Low Complexity (N) | Rate | High Complexity (N) | Rate | Total (N) | Rate |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Control** | 800 | 50% | 200 | 90% | 1,000 | 58% |
  | **Coaching** | 200 | 40% | 800 | 80% | 1,000 | 72% |

  The Director must decide whether to fund Coaching next year. The aggregate table shows Coaching increases employment by 14 points. The stratified tables show Control outperforming Coaching in both Low (50% vs 40%) and High (90% vs 80%) complexity roles. Your friend argues the stratified tables reveal the truth: Coaching is harmful within every job type, and the aggregate gain is an artifact of Coaching merely shifting people into harder jobs. You argue the aggregate table is the only valid basis for funding.

  ***

  **The Analysis**

  Your friend's rule fails because "Job Complexity" is a **post-treatment variable**. Randomization ensures the groups were exchangeable at baseline, but Coaching *caused* the shift in complexity. By stratifying on Complexity, you condition on a mediator. You block the very pathway through which Coaching works (getting people better jobs) and introduce selection bias: the Control group's "High Complexity" workers are elite naturals, while the Coaching group's "High Complexity" workers include marginal candidates lifted by the program.

  The aggregate comparison is an unbiased estimate of the **Intent-to-Treat (ITT)** effect—the total causal impact of offering the program. Acting on the stratified tables is worse because it recommends cutting a program that genuinely creates 140 more jobs per 1,000 applicants. The within-stratum comparison is not a causal contrast; it compares non-exchangeable subgroups selected by the treatment itself.

  ***

  **The Honest Part**

  **The Single Feature:** The stratifying variable is measured *after* randomization and is *affected* by the treatment. If Job Complexity had been measured at baseline (pre-treatment), your friend's rule would be correct. In that case, stratification would adjust for confounding (ability), and the aggregate would be the artifact of mixing high- and low-ability applicants. The verdict flips entirely based on the timeline of measurement.

  **Distinction from Berkeley:** The Berkeley data were observational; department choice was a **pre-treatment confounder** (applicants self-selected). Your case is experimental; complexity is a **post-treatment mediator**. In Berkeley, stratification removed bias. Here, stratification creates it.

  **Your Friend's Best Reply:**
  1.  **Transportability:** He might argue that if the program scales to a population where Coaching cannot secure High Complexity jobs (e.g., a recession), the aggregate benefit vanishes. The stratified rates predict performance in that new context better than the aggregate.
  2.  **Direct Effect:** He might claim there is a legitimate scientific question: "Does Coaching improve retention *holding job complexity constant*?" The stratified tables answer this; the aggregate does not.

  **Verdict:** Your case survives on the specific decision at hand ("Fund this program for *this* population"). The aggregate ITT is the correct quantity for policy decisions. However, his reply forces a qualification: if the goal is understanding *mechanism* or predicting impact in a *different* context where the mediator distribution changes, the stratified analysis (properly modeled as mediation, not confounding) becomes relevant. You are right about the decision; he is right about the mechanism.
