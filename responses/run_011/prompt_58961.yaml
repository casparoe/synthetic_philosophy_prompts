answer: |-
  **The Scenario**

  In a specialised cardiac theatre, a stable sequence of instrument transfer persists across decades despite total staff turnover. No written protocol dictates the order; senior surgeons never instruct juniors on the sequence. Yet, every operation proceeds with identical efficiency. When Nurse Alpha works with Surgeon One, she anticipates needs based on visual cues of muscle tension; when Nurse Beta works with Surgeon Two, she relies on auditory cues in breathing patterns. Sometimes the surgeon signals verbally, sometimes non-verbally. The sequence of tools handed over remains invariant across these dyads. New staff integrate within weeks, adopting the sequence without being taught the rule, simply by adjusting to the flow. The pattern survives even when the specific psychological triggers differ between pairs, provided the structural position in the workflow remains constant. No committee mandates this; no sanction punishes deviation, yet deviation never stabilises.

  ***

  **The Demonstration**

  **The Explanandum**
  The phenomenon to be explained is the *invariance of the instrument sequence* across different personnel pairings and over time, despite the absence of explicit rules or shared psychological mechanisms among the actors.

  **The Individual-Level Causal Account**
  A methodological individualist provides a complete causal history by detailing the specific mental states of each actor. In Dyad One, Nurse Alpha sees muscle tension (belief), desires efficiency (preference), and hands the scalpel (action). In Dyad Two, Nurse Beta hears changed breathing (belief), desires efficiency (preference), and hands the scalpel (action). Every event is causally grounded in the neurophysiology and psychology of specific individuals. There is no causal gap; nothing happens that is not pushed by an individual's reason-responsive mechanism.

  **The Macro-Level Addition**
  The social ontologist argues that citing the "Surgical Workflow" explains the *invariance* that the individual account misses. The individual account must list distinct psychological causes for each dyad (visual vs. auditory). The macro account identifies a single structural constraint that dictates the sequence regardless of the psychological medium. The macro explanation captures the counterfactual stability: had the cues been tactile instead of visual or auditory, the sequence would have remained the same. The individual story cannot generate this counterfactual without enumerating every possible psychological variation, whereas the social story captures the pattern directly.

  **Types of Reduction**
  To clarify the disagreement, we must distinguish three forms of reduction:
  1.  **Ontological Reduction:** The claim that social entities are nothing over and above individuals. Both instructors agree here; **supervenience** (the principle that there can be no social difference without an individual difference) is accepted. There are no group minds.
  2.  **Causal Reduction:** The claim that all causal powers reside in individuals. Both agree here; the workflow does not push hands independently of nurses.
  3.  **Explanatory Reduction:** The claim that explaining the parts explains the whole *without loss*. This case is designed to defeat explanatory reduction. The individualist story is causally complete but explanatorily lossy; it fails to capture the generalisation that holds across different micro-realizations.

  **The Critical Feature**
  The feature doing the work is **multiple realisability** (the property that the same macro-state can be produced by distinct micro-states). Inside the case, this is exhibited by the visual versus auditory cues producing the identical transfer sequence. If this feature were removed—for instance, if every nurse relied exclusively on visual tension—the micro-explanation would perfectly mirror the macro-explanation. The individualist could then say, "The pattern is just shared visual psychology." Once multiple realisability is present, the micro-explanation becomes a disjunction of unrelated psychological states, while the macro-explanation remains a unified law. If the feature is weakened (e.g., most nurses use visual cues, only one uses auditory), the individualist gains ground, arguing the exception is noise. The case relies on the distinctness being substantial and systematic.

  **The Co-Instructor's Best Reply**
  Your co-instructor should reply as follows: "I accept every descriptive claim. However, I deny that explanatory loss constitutes ontological significance. I can construct a **disjunctive micro-explanation**: 'Handover occurs if (Visual Cue AND Desire) OR (Auditory Cue AND Desire)...' This list is long, but it is still an individual-level explanation. You claim the macro-account is better because it is shorter, but brevity is a pragmatic virtue, not a metaphysical one. You have shown that social explanations are *convenient*, not that they are *irreducible* in any sense that threatens individualism. To insist otherwise is to confuse our descriptive interests with the furniture of the world."

  **Assessment of the Reply**
  This reply is a genuine answer, not a refusal. It concedes the pragmatic utility of social explanations while denying they track distinct causal structures. It rests on the claim that any valid macro-explanation must be translatable into a (perhaps cumbersome) micro-explanation without losing truth conditions.

  **Empirical Distinction and Residual Disagreement**
  No intervention, measurement, or experimental result within this case can distinguish the two programmes. Both agree on who did what, why they did it, and what would happen if they stopped. The residual disagreement is normative: it concerns what counts as a *good* explanation. The individualist prioritises **mechanistic transparency** (showing the gears turning); the holist prioritises **generality and counterfactual robustness** (showing the pattern holds regardless of the gears). Once all empirical content is agreed upon, the debate collapses into a disagreement about whether convenience and generality are sufficient grounds to treat social properties as explanatorily autonomous, or whether only the fundamental micro-level story is strictly legitimate.
