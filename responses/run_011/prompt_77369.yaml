prompt: |-
  I am a junior at a public high school, and together with a classmate I co-run a small student-led club that our faculty advisor lets call itself Decisions and Dilemmas; we meet for one 40-minute period each week, and on any given day between 12 and 22 students show up, ages 15 to 18, with widely uneven preparation (two of them are on the math team and have seen expected-value calculations, most have never drawn a probability tree). A few weeks ago a friend left a battered library copy of Hofstadter's Metamagical Themas in my locker, and I read the column about superrationality that ends in the mail-in lottery he proposed to Scientific American readers, where a fixed prize was divided by the total number of entries submitted, so that every additional ticket any reader mailed in made the prize worse for everyone, including himself, and the entries escalated until the prize was worth nothing. That column also describes the related problem in which a group is offered a large prize conditional on exactly one member acting, and nobody acting also forfeits it. I want our club session to be built around those two structures. Two constraints from our advisor: no cash or cash-equivalent prizes, and nothing that lets a student profit at another's expense in a way she cannot supervise, so our pot will be a fixed 400 Club Credits that students trade in at the end of the term for slices of the club pizza party; credits cannot be created, borrowed, or added mid-activity. Phones go in a bin for the period, which is school policy anyway and which I think helps here.

  Here is the design I want you to build out and stress-test, because I can see the shape of it but not the mechanics. Two linked rounds in one session. Round one should reproduce the dilution structure: each student privately submits some number of entries on a sealed slip, all entries go into one pool, and one entry is drawn at random to win the pot divided by the total number of entries. Round two should reverse it: the pot carries over in a way you specify, and now exactly one student must make a particular kind of choice for anyone to be paid, with more than one such choice, or none at all, forfeiting everything. I want the two rounds connected so that what happens to the pot in round one is visibly caused by the aggregate of individually sensible decisions, and so that round two begins from a number the students themselves produced. Please give me: the exact split and carry-over rule you recommend and why it is the one that makes the arithmetic bite; the verbatim text of the one-page instruction sheet handed out at the start of each round, since half the failures of activities like this come from ambiguous rules; a materials list; a minute-by-minute timeline that fits in 40 minutes including the debrief; and a physical method for drawing the winning entry fairly when different students have submitted different numbers of entries, without a computer. Then handle the four problems I expect: a student who writes a number far too large to be represented by physical slips at all; whether submissions are auditable afterward or only honor-based, and how that choice changes the game; whether the advisor should be allowed to play as a participant, given that superrational reasoning seems to require that everyone be in a symmetric position, and if she is excluded, whether that exclusion should be announced before or after round one; and what to do if a coalition forms beforehand, since these students text each other and I cannot realistically forbid pre-meeting conversation, though I can forbid talking during the submission window. I would also like a short anonymous prediction poll before each round, in which every student writes down what they think the total will be, and I want your view on whether publishing the distribution of those guesses helps the reasoning or destroys the very feature I am trying to expose.

  The names should not be spoken until the debrief. In it, I need each moment of the activity mapped onto the idea it was supposed to produce, and I need one diagnostic question, asked on paper after round two and read aloud in aggregate, that separates two things my friends keep conflating: reasoning that predicts what other people will do, and reasoning that treats one's own conclusion as the conclusion anyone else doing the reasoning carefully would reach. If the activity cannot tell those apart, say so, because one of my friends insists the whole thing is just altruism with extra steps and the other insists it is incoherent since my decision cannot affect anyone else's, and I want the debrief to give me something to say to both of them in student language rather than a lecture. Tell me plainly what will go wrong the first time I run this with teenagers who like each other, and how to recover in the room without abandoning the point. Finally, tell me which feature of these dilemmas the activity cannot reproduce no matter how well I run it, and which I as facilitator will simply have to supply in words afterward.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**

      *   **User:** Junior high school student, co-runs a club ("Decisions and Dilemmas").
      *   **Audience:** 12-22 students, ages 15-18, mixed math background (some know expected value, most don't).
      *   **Constraints:** 40-minute period, no cash/prizes (400 Club Credits total for pizza), no phones, faculty advisor supervision (no unsupervised profit at expense of others).
      *   **Core Concept:** Hofstadter's *Metamagical Themas* column on Superrationality (specifically the Platonia Dilemma and the Lottery/Dilution paradox).
      *   **Goal:** Two linked rounds. Round 1: Dilution (tragedy of the commons/lottery). Round 2: Coordination (Platonia Dilemma/Exactly One).
      *   **Deliverables:**
          1.  Split/Carry-over rule (mathematical bite).
          2.  Verbatim instruction sheets (Round 1 & 2).
          3.  Materials list.
          4.  Minute-by-minute timeline (40 mins).
          5.  Physical drawing method (weighted random selection).
          6.  Handling 4 specific problems (Huge numbers, Auditing, Advisor participation, Coalitions).
          7.  Prediction Poll (publish distribution?).
          8.  Debrief plan (mapping moments to ideas, diagnostic question).
          9.  Failure modes & recovery (teenagers who like each other).
          10. Limitations (what the activity *can't* show).

  2.  **Deconstruct the Mathematical Structure:**

      *   *Round 1 (Dilution):* Pot $P$. $N$ students. Each chooses tickets $t_i$. Total tickets $T = \sum t_i$. Winner chosen randomly from $T$ tickets. Payoff = $P / T$.
          *   *Incentive:* If I add a ticket, my chance of winning goes up ($\frac{t_i+1}{T+1} > \frac{t_i}{T}$), but the prize value goes down for *everyone* ($\frac{P}{T+1} < \frac{P}{T}$).
          *   *Nash Equilibrium:* Everyone maximizes tickets until prize is negligible.
          *   *Superrational Goal:* Everyone submits 1 ticket (or 0, but 1 ensures someone wins).
      *   *Round 2 (Coordination/Platonia):* Pot $P'$. Condition: Exactly one student must submit a "Claim". If 0 or >1 claim, everyone gets 0. If exactly 1, that person gets $P'$.
          *   *Incentive:* If I think no one else will claim, I should claim. If I think someone else will claim, I shouldn't.
          *   *Superrational Goal:* Everyone randomizes with probability $1/N$.
      *   *Linkage:* The pot for Round 2 must depend on Round 1's outcome to make the loss visceral.
      *   *Constraint:* Total credits = 400. Cannot create/destroy credits *mid-activity* (but can forfeit them).
      *   *Design Choice:* Let's start with a fixed pot for Round 1 (say 200 credits). Whatever is *not* paid out in Round 1 (due to dilution) carries to Round 2? No, the prompt says "pot will be a fixed 400 Club Credits... credits cannot be created, borrowed, or added mid-activity." This implies the 400 is the *maximum* available.
      *   *Refined Design:*
          *   Total Bank: 400 Credits.
          *   Round 1 Pot: 200 Credits.
          *   Round 2 Pot: 200 Credits + (200 - Round 1 Payout).
          *   *Wait, simpler:* Let's make the Round 1 payout *reduce* the Round 2 pot.
          *   *Better:* Let's make the Round 1 outcome determine the Round 2 *starting* pot.
          *   *Best for "Arithmetic Bite":*
              *   Start with 400 Credits in a visible jar.
              *   Round 1: Pot is 200. If total tickets $T$ is high, the winner gets $200/T$. The *remainder* ($200 - 200/T$) is burned/removed from the game. This hurts.
              *   Round 2: Pot is the remaining 200 + whatever survived Round 1? No, that rewards dilution.
              *   *Correction:* The prompt says "Round two should reverse it... pot carries over in a way you specify."
              *   *Idea:* Round 1 Pot = 200. Round 2 Pot = 200.
              *   *Link:* If Round 1 total tickets $T > N$ (where $N$ is number of students), the Round 2 pot is reduced by $(T-N) \times 5$ credits. This punishes the "greed" of Round 1 directly impacting Round 2's potential.
              *   *Actually, let's stick to the prompt's "visible cause":* "what happens to the pot in round one is visibly caused by the aggregate of individually sensible decisions."
              *   *Proposed Mechanism:*
                  *   Total Credits: 400.
                  *   Round 1: Pot is 200. Winner gets $200 / \text{Total Tickets}$. The rest of the 200 is *returned* to the bank only if Total Tickets $\le$ Number of Students. Otherwise, the excess is burned.
                  *   Round 2: Pot is the remaining bank (200 + saved Round 1 funds). Condition: Exactly one "Volunteer".
                  *   *Why:* This makes the dilution in Round 1 directly shrink the opportunity in Round 2.

  3.  **Addressing Specific Constraints & Problems:**

      *   *Physical Drawing:* If Student A submits 10 slips and Student B submits 1 slip, how to draw fairly without counting thousands of slips?
          *   *Solution:* Numbered raffle tickets. Student writes name on a master sheet corresponding to ticket numbers they take. Or, simpler: Each student gets a distinct color of paper? No, too easy to identify.
          *   *Best Solution:* "The Bucket Method." Each student puts their slips in a personal envelope, then dumps into the big bin. To draw: Mix well. Pull one. If it's illegible or weird, redraw.
          *   *Huge Numbers:* Cap the entries. "Max 10 entries per student." If someone writes "1,000,000", it counts as 10. This prevents disruption without needing to police intent.
      *   *Auditing:* Honor system is best for flow. Auditing kills trust and takes time. Use the "Cap" to limit damage.
      *   *Advisor:* Advisor should *not* play. They hold the pot. Symmetry is broken if an authority figure plays. Announce this *before* Round 1 to establish the "student-only" closed system.
      *   *Coalitions:* Cannot stop pre-meeting talk. Mitigation: Emphasize in debrief that agreements without enforcement are cheap talk. The game tests *trustless* coordination.
      *   *Prediction Poll:* Publish the *average* guess, not the distribution. Publishing distribution allows meta-gaming ("Everyone thinks low, so I go high"). Publishing average anchors expectations. Actually, for Superrationality, knowing others are thinking like you is key. Let's collect guesses, calculate average, write it on board *after* submission but *before* drawing. This shows the "gap" between expectation and reality.
      *   *Debrief Diagnostic:* Need to separate "Predicting others" (Game Theory/Nash) vs "Treating own reasoning as typical" (Superrationality).
          *   *Question:* "Did you choose your number based on what you thought others *would* do, or based on what you thought others *should* do if they reasoned exactly like you?"

  4.  **Drafting the Content - Section by Section:**

      *   *Math Check:* 20 students. Round 1 Pot 200.
          *   Ideal (Superrational): Everyone submits 1. Total = 20. Winner gets 10 credits. Remainder 190 saved.
          *   Nash (Greedy): Everyone submits 10 (cap). Total = 200. Winner gets 1 credit. Remainder 0 saved.
          *   Round 2 Pot: 200 + Saved. Range: 200 to 390.
          *   This creates enough variance to matter for Pizza Credits.
      *   *Timeline:* 40 mins is tight.
          *   0-5: Intro & Rules.
          *   5-15: Round 1 (Write, Submit, Poll, Count).
          *   15-25: Round 2 (Write, Submit, Poll, Reveal).
          *   25-40: Debrief & Diagnostic.
          *   *Risk:* Counting slips takes time. Need a fast counting method.
          *   *Fix:* Pre-printed slips. Students take $n$ slips. Put unused back. Count unused to determine submitted. Much faster than counting a bin of paper.
      *   *Drawing Method:* If using pre-printed slips with unique IDs? No, that tracks who submitted how many.
      *   *Revised Drawing:* Students write name on *each* slip they submit. Mix bin. Draw one.
      *   *Huge Number Fix:* "You may take up to 10 slips from the stack." Physical limitation solves the infinity problem.
      *   *Instruction Sheets:* Need to be crisp. No ambiguity.
      *   *Debrief:* Map the feelings. "I wanted to win" vs "We lost value."
      *   *Limitations:* Real life has reputation/repetition. This is one-shot. Cannot reproduce "Shadow of the Future."

  5.  **Refining the "Arithmetic Bite":**

      *   The prompt asks for the pot to carry over in a way that makes the arithmetic bite.
      *   If Round 1 payout is $200/T$, and $T$ is large, payout is small.
      *   To make it bite: The *unwon* portion of Round 1 is destroyed.
      *   Round 2 Pot = 200 (Fixed) + Bonus.
      *   Bonus = Max(0, 200 - (Total Tickets $\times$ 1)).
      *   Wait, if Total Tickets = 20 (1 per student), Bonus = 180. Total R2 Pot = 380.
      *   If Total Tickets = 200 (10 per student), Bonus = 0. Total R2 Pot = 200.
      *   This links the rounds perfectly. Greed in R1 shrinks R2.

  6.  **Refining the Diagnostic Question:**

      *   Friend A: "It's just altruism." (False, it's self-interest aligned with group).
      *   Friend B: "My decision can't affect others." (False, in Superrationality, my decision *correlates* with others).
      *   Question needs to force them to admit if they treated their reasoning as *causal* or *correlative*.
      *   "When you decided, did you assume that choosing 1 ticket would *cause* others to choose 1 ticket, or did you assume that because you chose 1 ticket, others *likely did too*?"
      *   Actually, Hofstadter's point is the latter: "I am a sample of the group."
      *   Let's craft a specific paper question.

  7.  **Reviewing Constraints:**

      *   "Credits cannot be created, borrowed, or added mid-activity."
      *   My design uses a fixed 400. 200 allocated to R1, 200 to R2. The "Bonus" is just unspent R1 funds moving to R2. This complies.
      *   "No cash or cash-equivalent." Club Credits for Pizza is fine.
      *   "Advisor... nothing that lets a student profit at another's expense in a way she cannot supervise." The advisor holds the credits. The game determines distribution. This is supervised.

  8.  **Final Polish:**

      *   Tone: Respectful of the student's intelligence, practical for a high school setting.
      *   Formatting: Clear headings, bold text for emphasis.
      *   Check the "Physical Method" again. If students write names on slips, and one student submits 10 slips, their name is in 10 times. Drawing one slip identifies the winner. This works.
      *   Check the "Huge Number" again. Limit physical slips available. "Take up to 10." This physically enforces the cap.
      *   Check the "Advisor" role. Advisor is Banker/Judge. Not player.
      *   Check the "Coalition" issue. Acknowledge it in debrief.

  9.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Timeline:* 40 minutes is very short for 2 rounds + debrief. I need to be ruthless with timing. Counting slips is the bottleneck.
      *   *Solution:* Don't count slips individually. Have students place slips into labeled envelopes (1-22). Weigh the envelopes? No, too techy.
      *   *Better:* Pre-counted stacks. "Take 1 to 10 slips." When submitting, they drop them in. To count total: Count the *remaining* slips in the source pile. Total Available - Remaining = Total Submitted. This is instant.
      *   *Drawing:* Mix the submitted bin. Draw one. Read name.
      *   *Round 2:* "Volunteer" slip. Just one slip per person max.
      *   *Prediction Poll:* Do this *before* submission to avoid anchoring, collect, then reveal *after* submission but before result. This highlights the miscalibration.

  10. **Final check on the "Diagnostic Question":**
      *   Needs to distinguish Nash (I optimize given their move) vs Superrational (I optimize assuming my reasoning is their reasoning).
      *   Draft: "Did you choose your move to *beat* what you thought others would do, or to *match* what you thought a rational person should do?"

  11. **Final check on "What will go wrong":**
      *   Giggling/Collusion.
      *   Someone submitting 0 in Round 2 when they should have (fear).
      *   Someone submitting 10 in Round 1 (spite/greed).
      *   Recovery: Lean into it. "Look at the data."

  12. **Final check on "Limitations":**
      *   Cannot reproduce *communication*. Superrationality often assumes no communication. Real life allows talk.
      *   Cannot reproduce *iteration*. One-shot vs repeated game.

  Okay, ready to write.
answer: |-
  Here is the complete design for your session. It is built to fit the 40-minute window, adhere to your advisor's constraints, and isolate the specific logical tension you want to explore.

  ### 1. The Arithmetic Structure: Split and Carry-Over

  **The Setup:**
  *   **Total Bank:** 400 Club Credits (visible in a clear jar at the front).
  *   **Round 1 Allocation:** 200 Credits.
  *   **Round 2 Allocation:** 200 Credits + **The Round 1 Dividend.**

  **The Rule:**
  In Round 1, the 200 Credits are divided by the **Total Number of Slips Submitted** by the whole group.
  *   *Example:* If the group submits 20 slips total, the winner gets 10 credits. The remaining 190 credits are **not paid out**; they are returned to the bank to augment Round 2.
  *   *Example:* If the group submits 200 slips total, the winner gets 1 credit. The remaining 199 credits are **burned** (removed from the jar permanently).

  **Why this bites:**
  This creates a visible "Tax on Greed." Every extra slip a student adds increases their chance of winning Round 1 slightly but decreases the *value* of winning for everyone, and crucially, it destroys credits that would have funded the Round 2 pot. If Round 1 goes poorly (high ticket count), Round 2 begins with a depleted pot (minimum 200, maximum 390). This makes the aggregate loss of Round 1 immediately felt in the stakes of Round 2.

  ---

  ### 2. Instruction Sheets (Verbatim)

  *Print these on half-sheets of paper. Hand out Round 1 sheet at the start. Hand out Round 2 sheet only after Round 1 submission is closed.*

  **ROUND 1: THE LOTTERY**
  1.  **Take Slips:** Go to the front table. Take between **1 and 10** white slips of paper. Leave any extras in the tray.
  2.  **Label:** Write your **First Name** clearly on *every* slip you took.
  3.  **Submit:** Fold them and place them in the **ROUND 1 BIN**.
  4.  **Predict:** On the blue card, write your guess for the **Total Number of Slips** the whole class will submit. Put this in the **PREDICTION BIN**.
  5.  **Silence:** No talking from the moment you pick up slips until the bin is sealed.
  *   **Payoff:** One slip will be drawn at random. The winner receives **200 Credits divided by the Total Slips Submitted**. All unused credits from this 200 are added to Round 2's pot.

  **ROUND 2: THE VOLUNTEER**
  1.  **Take a Slip:** Take exactly **one** yellow slip.
  2.  **Choose:** You have two options:
      *   **CLAIM:** Write your **First Name** on the slip and put it in the **ROUND 2 BIN**.
      *   **PASS:** Leave the slip blank and put it in the **ROUND 2 BIN**.
  3.  **Predict:** On the blue card, write how many **CLAIMS** you think the class will make (0, 1, 2, etc.). Put this in the **PREDICTION BIN**.
  4.  **Silence:** No talking from the moment you pick up the slip until the bin is sealed.
  *   **Payoff:** The Round 2 Pot is **(200 + Round 1 Savings)**.
      *   If exactly **ONE** name is in the bin: That person wins the whole Pot.
      *   If **ZERO** or **MORE THAN ONE** names are in the bin: **Everyone gets 0.** The Pot is burned.

  ---

  ### 3. Materials List

  *   **Credits:** 400 physical tokens (poker chips, laminated cards, or written ledger) in a clear jar.
  *   **Slips:**
      *   250 small white slips (pre-cut).
      *   25 small yellow slips (pre-cut).
      *   25 blue prediction cards.
  *   **Bins:** 4 labeled boxes/envelopes (Round 1 Submissions, Round 2 Submissions, Round 1 Predictions, Round 2 Predictions).
  *   **Writing:** 5 pens/pencils.
  *   **Board:** Whiteboard/chalkboard to track the "Bank" balance.
  *   **Timer:** Visible countdown timer.

  ---

  ### 4. Minute-by-Minute Timeline (40 Minutes)

  *   **0:00–0:05 (Intro):** Advisor locks phone bin. You introduce the 400 Credits. Explain they are for the end-of-term pizza. Explain the Advisor holds the bank; you run the game. Hand out Round 1 sheets.
  *   **0:05–0:15 (Round 1):** Students take slips, write, submit, predict. **Crucial:** Count the *remaining* white slips at the front tray to instantly calculate Total Submitted (250 start - X remaining = Total). Calculate payout. Update Bank on board.
  *   **0:15–0:17 (Transition):** Announce Round 1 Winner (draw one slip from bin). Announce Round 2 Pot size. Hand out Round 2 sheets.
  *   **0:17–0:27 (Round 2):** Students choose Claim/Pass, submit, predict. Count "Claim" slips openly. Determine payoff.
  *   **0:27–0:35 (Debrief):** Map the activity to the concepts (see Section 8).
  *   **0:35–0:40 (Diagnostic):** Students answer the paper question. Collect. Read aggregate results aloud. Dismiss.

  ---

  ### 5. Physical Drawing Method (Weighted Random)

  Since students submit varying numbers of slips (1 to 10), the probability must be proportional to slips submitted.

  **The Method:**
  1.  **Mix:** Pour the Round 1 Bin into a large opaque bag or deep bucket. Agitate thoroughly for 30 seconds.
  2.  **Draw:** Have a neutral student (or the Advisor) reach in and pull **one** slip without looking.
  3.  **Verify:** Read the name on the slip aloud.
  4.  **Why this works:** If Alice submitted 10 slips and Bob submitted 1, Alice's name is physically present 10 times more often in the mix. This requires no complex math during the draw, only honest mixing.

  ---

  ### 6. Handling the Four Problems

  **1. The "Infinity" Student (Huge Numbers)**
  *   **Fix:** The physical cap. The instructions say "Take between 1 and 10 slips." There are only 250 slips in the tray. A student cannot submit 1,000 entries because the paper does not exist.
  *   **Recovery:** If a student writes "1000" on a single slip, rule it as **1 entry**. State this rule before Round 1 begins: "One name per slip. One slip per entry. Max 10 slips per person."

  **2. Auditing vs. Honor System**
  *   **Choice:** **Honor System.** Auditing (checking every slip against a master list) consumes 15 minutes and destroys the flow.
  *   **Impact:** This introduces "Noise." A cheater might take 11 slips.
  *   **Mitigation:** In the debrief, acknowledge this. "If someone cheated, they lowered the pot for everyone. That is part of the risk of a trust-based system." The physical limit (10 slips max) minimizes the damage one cheater can do.

  **3. The Advisor's Role**
  *   **Decision:** **Advisor does not play.**
  *   **Timing:** Announce this **before Round 1**.
  *   **Reasoning:** Superrationality requires symmetry. If the Advisor plays, they hold authority over the credits, breaking the symmetry. If they sit out, they are the "Bank," which is necessary for supervision.
  *   **Announcement:** "The Advisor holds the credits to ensure fairness. Only students are players."

  **4. Coalitions (Pre-meeting Texts)**
  *   **Reality:** You cannot stop this.
  *   **Mitigation:** In the debrief, address it directly. "If you agreed via text to all submit 1 slip, did anyone break that agreement? If so, why?"
  *   **Lesson:** This highlights the difference between a *binding contract* (enforceable) and *superrational agreement* (unforceable). If the coalition held, great. If it broke, that proves the dilemma exists.

  ---

  ### 7. The Prediction Poll

  **Procedure:** Collect the blue prediction cards *before* the draw/reveal.
  **Publishing:** Calculate the **Median Guess** and write it on the board *after* submissions are locked but *before* the results are revealed.
  **Why:** Publishing the *distribution* (histogram) allows students to meta-game Round 2 ("Everyone guessed low, so I should claim"). Publishing only the **Median** anchors the group's expectation without giving away the variance. It shows if the group was collectively optimistic or pessimistic.

  ---

  ### 8. The Debrief & Diagnostic

  **Mapping Moments to Ideas:**
  1.  **Round 1 Dilution:** "When you added that 2nd or 3rd ticket, you increased your odds, but you lowered the prize for everyone, including yourself. That is the **Tragedy of the Commons**. Individually rational, collectively stupid."
  2.  **Round 2 Coordination:** "In Round 2, you needed exactly one person. If you all reasoned 'I should claim because no one else will,' you failed. If you all reasoned 'I shouldn't claim because someone else will,' you failed. You needed to randomize."
  3.  **The Link:** "Look at the board. The credits burned in Round 1 are gone forever. Your individual choice to 'win' Round 1 made Round 2 harder."

  **The Diagnostic Question:**
  *Print this on the back of the Round 2 prediction card. Collect them. Read the count aloud.*

  > **Question:** In Round 2, why did you choose CLAIM or PASS?
  > A) I tried to guess what *specific people* in this room would do.
  > B) I tried to decide what *any rational person* in my position should do.

  **Interpreting the Results:**
  *   **Mostly A:** They are playing **Nash Equilibrium** (predicting others' moves).
  *   **Mostly B:** They are attempting **Superrationality** (treating their own reasoning as a sample of the group).
  *   **Your Reply to Friend A (Altruism):** "Look at the scores. If this were altruism, everyone would have passed in Round 2 to let someone else win. But passing guarantees everyone loses. This wasn't kindness; it was logic."
  *   **Your Reply to Friend B (Incoherent):** "If your decision doesn't affect others, why did the pot shrink in Round 1? Your decision correlates with others because you all share the same brain and the same rules. That correlation is the only thing that saves us."

  ---

  ### 9. Failure Modes & Recovery

  **What will go wrong:**
  1.  **Giggling/Collusion:** Students will whisper during the "Silence" phase.
      *   *Recovery:* Do not scold. Say, "Talk costs credits. Every word you speak is a slip you didn't submit."
  2.  **Round 2 Failure (0 or 2+ Claims):** This is the most likely outcome.
      *   *Recovery:* **Do not fix it.** Let the pot burn. The pain of losing the pizza credits is the lesson. Say: "This is the Platonia Dilemma. Without a way to randomize together, we crash."
  3.  **One Student Hogs Round 1:** One student takes 10 slips, others take 1.
      *   *Recovery:* Highlight this in the debrief. "One person optimized for themselves. Did they win? Yes. Did the group lose? Yes. Is that a society you want to live in?"

  **What the Activity Cannot Reproduce:**
  1.  **The Shadow of the Future:** In real life, you play these games repeatedly with the same people. Reputation matters. Here, it is one-shot. You must supply this in words: "In the real world, you would be punished next week for burning the pot today. Here, there is no next week."
  2.  **True Randomization:** Humans are bad at generating random numbers (1/N probability). You cannot force them to roll dice in their heads. You must supply this: "Superrationality requires you to act like a die roll. You probably didn't. That's why we failed."

  ### Final Facilitator Note
  You are not teaching them to win. You are teaching them to recognize why they lost. If the group wins both rounds perfectly, they will think it's easy. If they lose (which is likely), they will feel the logic in their pockets (or lack of pizza credits). **Lean into the loss.**
