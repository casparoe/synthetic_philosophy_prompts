  *(Refining the "mrrjjj" example)*: In *Fluid Concepts and Creative Analogies*, $mrrjjj$ is treated as having a "length" abstraction. If a user ignores length and just does letter substitution ($nsskkk$), is that a different chain cost? Yes. But if they do $mrrjjk$ (just change last letter), that's surface similarity. If humans prefer $mrrjjk$ despite the structural elegance of $mrrjjjj$, that hurts the structural view.

