          *   *Content Bias:* Letters aren't abstract nodes. 'A' is special.
          *   *Directionality Bias:* Left-to-right reading order isn't just structural; it's cognitive habit.
          *   *The "Unlicensed Slip":* When a logically cheap slip feels wrong because of semantic meaning (e.g., $cat \to cat$).
      *   **Section 2: The "Awkward" Challenges (Dismissible Costs).** Things a defender can explain away with tuning.
          *   *Individual Differences:* Some people see $ijk \to ijl$, others $ijk \to djk$.
          *   *Complexity Threshold:* When strings get too long, working memory fails, forcing surface heuristics.
      *   **Section 3: The Unfalsifiability Critique.** Is "conceptual distance" just a fudge factor?
