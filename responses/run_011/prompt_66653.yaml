  My cousin has a small podcast and next month's guest is a philosopher who thinks pain asymbolia shows pain isn't bad in itself — on his view the awfulness isn't build into the sensation, it's a separate wanting-it-to-stop state that normally switches on automatically, so an asymbolic who says he feels the pain but isn't bothered by it is just reporting what's left over when that second state is missing. Can you give me like seven questions that actually dig in instead of letting him run through the view again? I want at least one on how these people still say they feel pain — doesn't that word already smuggle the unpleasantness in with it, so what are they even describing? One on people who go out of their way to hurt themselves on purpose (chili heads, marathoners, masochists) — is his answer just that they've got the wanting switched on, and isn't that a stretch? And one on the ugly upshot: if the badness is really just that extra state, is it fine to drug or operate people into indifference, and how does he answer the "you didn't put out the fire, you just cut the alarm" line? For each question also give me the follow up to use against whatever answer he's most likely to give, since he's good at talking past stuff.
