answer: |-
  They ask for ram and bull and scorpion's tail,
  For houses built on no foundation stone,
  I draw the circle round the living thing.
  But these are marks we carve to sell for coin,
  A ledger kept for dukes who want to know
  If war will favor them this coming spring.
  I gag upon the predictions I must write,
  For stars do not care for the soldier's rank.
  Yet there is force within the geometry,
  Not in the beast, but in the angle's sweep.
  When Mars divides the sphere by third or half,
  The constructible line becomes a law.
  What cannot be constructed cannot move,
  For God knows only what He can define.
  The earth herself is not a dead stone lump,
  But breathes and feels the weather of the sky.
  As tides obey the moon without a word,
  So souls attend the stimulus unseen.
  The physician scoffs, the courtier trusts too far.
  And both despise the middle path I walk.
  One calls it magic, one calls it pure chance.
  I draw the circle round the living thing.
  If earth perceives the angle as a nerve,
  Then what is superstition, and what law?
  Is it a faith to say the matter hears?
  Or science to describe the form it takes?
  I hold the compass tight against the page,
  And wait to see if heaven strikes the wire.
  The orbit breaks the circle, yet it sings,
  And I am left to tune the instrument.
