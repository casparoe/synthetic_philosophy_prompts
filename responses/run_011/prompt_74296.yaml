answer: |-
  Your objection is sharp because it identifies the precise seam where Strawson's naturalism stitches itself to the fabric of human psychology. You are right to press the claim that Strawson converts a metaphysical problem into an empirical one. When Strawson argues that a life conducted wholly in the objective attitude would be "too impoverished," he is not invoking a logical contradiction but a psychological cost. He is betting on our stamina, not our coherence.

  To see why this is the natural reading, look at how Strawson defends the participant stance. He does not argue that it is unintelligible to treat humans as objects; he argues that it is impossible to sustain such a view while remaining engaged in ordinary interpersonal relationships. He appeals to "our nature" and the "general framework of human life." These are contingent facts about the species *Homo sapiens*, not necessary truths about rational agency. If the impossibility were conceptual, Strawson would argue that the objective stance undermines the very meaning of "person." Instead, he argues it leads to isolation. Isolation is a harm, not a nonsense. By grounding the defense of responsibility in the avoidance of impoverishment, Strawson admits that the participant stance is a functional requirement for a flourishing life, not a logical precondition for thought. This makes his claim vulnerable to any evidence that flourishing might look different, or that the capacity for participation is fragile. Your aunt's experience suggests the latter: that the participant stance is a resource that can be mined until exhaustion.

  The weakest link in your argument is indeed the inference from local depletion to global possibility. A skeptic will say your aunt is an outlier, a single data point in a sea of resilient humanity. However, this objection misunderstands the nature of capacities. If a cognitive or emotional module can be fatigued in one instance due to structural pressure, it implies the module relies on finite resources. The probation office is not merely a workplace; it is a micro-society structured around the objective stance. It demands the systematic suspension of reactive attitudes in favor of assessment and management. If one person can internalize this structure to the point where it colonizes their private life, it demonstrates that the participant stance is not a fixed point but a habit maintained by specific social conditions.

  The step from local to global, then, is not a prediction that everyone will burn out tomorrow, but a proof of concept regarding social organization. If a society were structured sufficiently like a probation office—hyper-bureaucratized, focused on risk management and causal explanation over moral engagement—the collective maintenance cost of the participant stance might exceed its utility. The inference holds because capacities are scalable. If the stance requires maintenance, and if social structures can demand its suspension, then a global shift in social organization could theoretically render the stance globally unsustainable. It transforms the question from "Can we conceive of a world without resentment?" to "Can we build a world where resentment is too expensive to afford?"

  If this step goes through, Strawson loses the insulation he worked so hard to build. His goal was to make the truth of determinism irrelevant to responsibility. He wanted to say: "Even if determinism is true, we can't stop holding people responsible." But if holding people responsible is a contingent psychological capacity with a maintenance cost, then determinism becomes relevant again. If a deterministic worldview encourages the objective stance—by making us see actions as caused events rather than choices—it might lower the cost of abandoning the participant stance. Strawson wants to protect responsibility from metaphysics, but if responsibility relies on a psychological stamina that metaphysics can erode, the protection fails. The incompatibilist doesn't need to prove we *must* abandon responsibility; they only need to prove that under determinism, the cost of keeping it becomes prohibitive. Strawson's optimism becomes a gamble on human resilience rather than a conceptual truth.

  Now, consider the objections your friends will raise. The first is that attitudes and their affective tone come apart. They might argue your aunt still held the participant stance toward her children but merely failed to feel the associated heat. This is weak. Strawson defines reactive attitudes by their susceptibility to feelings like resentment and gratitude. To strip the feeling is to strip the stance. If she was performing resentment without the vulnerability to injury that defines it, she was not holding her children responsible; she was managing them.

  The second objection is that this is merely occupational burnout, a pathology to be treated. This is more serious but ultimately misses the point. Pathology reveals the limits of normal function. If a bone breaks under sufficient pressure, we learn something about the bone's structure, not just the accident. Your aunt's burnout reveals the structural limits of the participant stance. It shows that the stance is not immune to environmental pressure. Treating it as a medical anomaly protects Strawson only by ignoring the sociological causes of the anomaly.

  The third objection is the most damaging: Strawson's claim is about what we can *seriously contemplate*, which concerns reasons rather than stamina. Your friends will argue that a person too worn out to hold the participant stance hasn't shown that we could *rationally* give it up. Strawson is arguing that we have no reason to abandon the stance, not that we are physically incapable of doing so. If your aunt lost the capacity due to exhaustion, she didn't make a rational choice; she suffered a failure. Therefore, her case doesn't show that the objective stance is a coherent alternative, only that the participant stance is fragile.

  This objection wins the point on Strawson's specific intent. Strawson is indeed arguing about the rationality of our commitments, not just their psychological durability. He claims we couldn't *choose* to abandon the stance because it constitutes our relationships. However, even if this objection holds, your argument retains significant force. Even if we cannot *rationally* choose to abandon the stance, your aunt shows that we can be *forced* out of it by structural pressures. This means the participant stance is not as insulated from the causal world as Strawson hopes. If determinism promotes a culture of explanation over engagement, it might not give us a *reason* to drop the stance, but it might erode our *ability* to keep it.

  So, while your friends are right that exhaustion isn't a rational argument, they are wrong to think that makes it irrelevant. Strawson wanted to close the door on metaphysics by locking it inside our nature. Your aunt shows that the lock is made of wood. It might hold, but it can be broken. And if it can be broken, the metaphysical worry doesn't disappear; it just changes shape. It is no longer about whether we are free, but about whether we can afford to believe we are.
