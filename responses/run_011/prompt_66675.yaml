answer: |-
  **JOINT STATEMENT ON THE COMPUTATIONAL NATURE OF COGNITIVE SYSTEMS**
  **Prepared for the End-of-Term Workshop on Philosophy of Mind**

  **I. AGREED CLAIMS AND MUTUAL DEBTS**

  We, the undersigned representatives of the classical computationalist and dynamical/embodied cognitivist traditions, submit this statement to clarify the terrain of our disagreement. After extensive adversarial collaboration, we endorse the following claims as common ground, distinguishing established formal facts from substantive empirical hypotheses.

  1.  **Formal Inter-translatability:** We agree that discrete symbolic models and continuous dynamical models are often mathematically inter-translatable. A system of differential equations can be approximated by discrete steps, and discrete state transitions can be modeled as limits of continuous functions. Therefore, the mere ability to describe a system using one formalism does not logically preclude describing it using the other.
  2.  **The Triviality Constraint:** We agree that without constraints on the mapping between physical states and formal descriptions, the claim that "the brain computes" risks triviality. If any physical system can be mapped onto any finite-state automaton given a sufficiently gerrymandered interpretation of its states, then the label "computer" carries no explanatory weight. Both sides agree that a viable theory must restrict admissible mappings to those that respect the system's causal structure.
  3.  **The Abstraction Objection:** We acknowledge that comparing a specific concrete mechanism (such as a centrifugal governor) to an abstract class of machines (such as a Turing Machine) is a category error. The relevant comparison is not between specific devices, but between modeling frameworks: one that privileges discrete, sequential, rule-based explanations, and one that privileges continuous, simultaneous, trajectory-based explanations.
  4.  **Mutual Debts:**
      *   **The Computationalist Debt:** The classical side owes the dynamical side a non-vacuous criterion for *implementation*. It must specify why the brain implements a specific algorithm (e.g., for language parsing) rather than any of the infinite other algorithms compatible with the same physical noise, without simply stipulating that the relevant states are those that look like symbols.
      *   **The Dynamical Debt:** The dynamical side owes the classical side an account of *productivity and systematicity*. It must explain how a system of coupled differential equations, without discrete constituent structure, generates the capacity for infinite recombinability in thought and language, or demonstrate that such capacity is an illusion produced by observational limitations.

  **II. MATRIX OF RESIDUAL DISAGREEMENTS**

  The following table isolates the specific points of contention. We distinguish between verbal disputes (turning on the definition of terms) and substantive disputes (turning on the causal structure of the world).

  | Disagreement | Statement of Position (Own Words) | Verbal or Substantive? | The Crux Sub-Question | Concrete Case / Argument | Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Definition of Computation** | **Comp:** Computation is the manipulation of content-bearing vehicles according to syntactic rules.<br>**Dyn:** Computation is any medium-independent causal process describable formally; brains are medium-specific coupled oscillators. | **Mostly Verbal** (with substantive downstream effects) | Does the utility of the label depend on the *mechanism* (syntax) or the *description* (formalism)? | **Neural Coding:** Can neural spike trains be decoded as discrete symbols predicting behavior better than as continuous phase variables? | **Comp:** Discrete decoding will succeed for high-level tasks.<br>**Dyn:** Decoding success is an artifact of binning continuous data. |
  | **2. The Reality of Content** | **Comp:** Internal states genuinely carry semantic content; this content is causally relevant to processing.<br>**Dyn:** Content is ascribed by observers; the system merely tracks environmental affordances via coupling. | **Substantive** | Is representation a natural kind found in the brain, or a stance taken by the theorist? | **Error Processing:** How does the system detect "misrepresentation"? Is there a neural error signal distinct from dynamical instability? | **Comp:** Specific error-signaling circuits exist.<br>**Dyn:** "Error" is just deviation from an attractor basin, requiring no semantic gloss. |
  | **3. The Locus of Explanation** | **Comp:** Explanation lies in the internal algorithm; the environment is input/output.<br>**Dyn:** Explanation lies in the agent-environment loop; the brain is merely a component. | **Substantive** | Can cognitive regularities be predicted by brain states alone, or only by brain-plus-environment states? | **Tool Use:** When using a cane or interface, does the cognitive boundary extend to the tool? | **Comp:** The tool is processed as an object *within* the model.<br>**Dyn:** The tool becomes part of the dynamical system itself. |
  | **4. The Triviality Worry** | **Comp:** Triviality is avoided by constraining mappings to causal roles that mirror logical structure.<br>**Dyn:** Triviality proves that *any* formal mapping is arbitrary; only physical coupling is real. | **Substantive** (Methodological) | Does the existence of many valid formal descriptions imply none are privileged? | **Multiple Realizability:** Can the same cognitive function be realized by radically different physical substrates? | **Comp:** Yes, because the algorithm is substrate-neutral.<br>**Dyn:** No, because cognition is constituted by specific physical dynamics. |

  **III. FALSIFICATION CONDITIONS AND DIAGNOSIS**

  To conclude this collaboration, each party specifies what would compel them to abandon their core stance, followed by a joint diagnosis of the verbal versus substantive elements of our debate.

  **Classical Computationalist Falsification Condition:**
  We would abandon the view that the brain is a computer if it were demonstrated that discrete symbolic models consistently fail to predict behavioral latency and error patterns in domains requiring systematicity (e.g., language or logic), while continuous dynamical models succeed without resorting to discretization. Specifically, if neural data reveals that information is encoded in phase relationships or oscillatory frequencies that cannot be binned into discrete states without losing the variance required to explain cognitive flexibility, the computationalist model must be rejected.

  **Dynamical Cognitivist Falsification Condition:**
  We would abandon the view that computation is a metaphor if it were demonstrated that internal neural states operate causally in isolation from the environment in a way that strictly mirrors formal syntactic rules. Specifically, if we find neural mechanisms that manipulate vehicles based solely on their shape or structure, independent of their sensorimotor history or current environmental coupling, and if these mechanisms are necessary for higher-order cognition, we must concede that the brain implements a genuine computer.

  **Diagnosis of the Dispute:**

  We conclude that a significant portion of our conflict is **verbal**, specifically regarding the label "computation."

  1.  **The Verbal Slice:** If "computation" is defined broadly as *any process describable by a formal model*, the Classical Computationalist wins by stipulation, but the victory is empty. Under this definition, a waterfall, a governor, and a brain all compute. This renders the claim "the brain is a computer" trivially true but explanatorily useless. The Dynamical side is correct that this broad usage obscures the specific causal mechanisms at play.
  2.  **The Substantive Core:** However, once the terminology is fixed, a hard **substantive** disagreement remains. It is not about whether the brain *can be described* formally, but about **causal structure and representation**.
      *   The Classical side claims the brain contains internal vehicles that *are* representations, causally driving behavior in virtue of their content.
      *   The Dynamical side claims the brain contains states that *covary* with the world, driving behavior in virtue of physical coupling, with "content" being a post-hoc ascription.

  This substantive disagreement is not resolved by defining computation. It is an empirical question about whether cognitive regularities are best explained by internal rule-following or by system-wide stability maintenance. The "Abstraction Objection" noted in Section I reinforces this: we are not arguing about whether the brain is a Turing Machine (it is not), but whether the *logic* of Turing Machines (discrete, sequential, content-sensitive manipulation) is the *logic* of the brain.

  **Final Consensus:**
  We agree to stop asking "Is the brain a computer?" as a binary question. Instead, we will ask: "To what extent does the brain's causal organization respect the constraints of discrete symbolic processing versus continuous dynamical coupling?" This reframing preserves the Computationalist's demand for mechanistic specificity while honoring the Dynamicalist's insistence on embodiment and continuous time. The dispute is no longer about the metaphor, but about the mathematics of the mechanism.
