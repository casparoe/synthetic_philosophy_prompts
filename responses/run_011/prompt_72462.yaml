  Some of you in this room sat on the committee that made that finding. You know the weight of it. You know the letter was sent. You know he accepted the sanction and continued his work. I do not speak to change that record. I do not speak to soften it. I speak to acknowledge that it stands alongside everything else we say today. It is part of the history of this department. It is part of his history. It is part of ours.

  For twenty years after the sanction, he taught. Many of you sit here because he taught you. You know the Thursday reading group. You know the front room. You know he bought the books. You know he listened to your drafts when he was not required to. You know he was generous. He gave time and money he did not have to spend. He showed up. This is also true. It is not a counterweight. It is not a payment. It is not evidence that the earlier matter was resolved. It is simply another part of the man we are remembering. We cannot separate the teacher from the colleague. We cannot separate the generosity from the harm.

  He had a rule for that Thursday table. He did not permit anyone to apologize. He said an accepted apology ended an argument before it had finished. He wanted the argument to finish. He wanted the work to stand on its own. He lived by that rule in his professional life as well. He did not offer apologies. He did not accept them. He wanted the work to remain. He believed that looking backward stopped the forward motion.

  Today, I break that rule. I do not offer an apology he refused to give. I am not the one who owes it. It is not mine to give. But I will not pretend that none was owed. I will not let the argument end simply because he has died. To do so would be to leave the room. It would be to look at him as a case to be managed. It would be to treat you as people who need comfort. It would be to step outside the relationship we had with him. We are still in it. We are still bound to him by what he did and what he gave.

  There is a woman in this room who asked me not to tell a comfortable story. She asked for nothing else. I will not name her. I will not make her the object of your attention. She is here as a mourner. She is here as a colleague. But I acknowledge that she is here. I acknowledge that she carries a part of this history that none of us can lift from her. Her presence is a fact. Her silence is a choice. I respect both.

  We are left with two things. We are left with the harm he caused. We are left with the good he gave. We cannot trade one for the other. We cannot say the good erases the harm. We cannot say the harm negates the good. We have to hold both. We have to stay in the relationship even when the relationship is broken. We have to be grateful for the books and the Thursdays without pretending the price was not paid. We have to acknowledge the wrong without pretending it was the only thing he did.

  This is not a resolution. There is no peace in this. There is only the fact of him, and the fact of us, and the fact that we are still here to speak the truth about both. He is gone. We remain. The argument continues.
