answer: |-
  **Project Title:** The Architecture of Deterrence: From Intentional Threats to Structural Hazards

  **Research Question and Criterion**
  Standard deterrence theory treats nuclear threats as problems of rational intention. The central puzzle, articulated by Kavka and Parfit, is how an agent can rationally form an intention to perform an act (mass retaliation) that it would be irrational or impermissible to execute when the time comes. Solutions typically involve conditional intentions, separate evaluations of forming versus acting, or rule-based assessments. These approaches share a foundational assumption: that the threat remains a communicative act anchored in the discretionary will of a unitary decider.

  This project challenges that assumption. Modern command and control (C2) architectures are explicitly designed to remove discretion at the moment of decision through pre-delegation, compressed warning times, and automated retaliatory systems (e.g., "Dead Hand" mechanisms). When execution is distributed across personnel and procedures arranged to prevent reconsideration, the threat ceases to function as a promise and begins to function as a structural hazard—a trap installed in advance.

  The primary research question is: **Does the delegation and automation of launch authority transform the moral ontology of deterrent threats from intentional promises to structural hazards, and if so, does this transformation resolve or exacerbate the rationality and permissibility paradoxes standard in deterrence theory?**

  To answer this determinately, I propose a criterion of **Moral Attributability**. The criterion is normative, though it relies on decision-theoretic facts about agency. A threat changes "kind" when the link between the principal's contemporaneous will and the harmful outcome is severed such that the outcome can no longer be attributed to a specific act of will at the time of execution. If the criterion is met, the threat is a hazard; if not, it remains a promise. The question is settled if we can demonstrate whether standard paradoxes (e.g., the Toxin Puzzle) dissolve when the object of analysis is a hazard rather than a promise. If the paradoxes persist despite the removal of agency, the problem is deeper than intention; if they vanish, the literature has been analyzing a phantom agent.

  **Critique of Existing Positions**
  Current philosophical defenses of deterrence fail to engage the architecture of execution, thereby begging the question of agency.

  1.  **The Conditional Intention Reply:** This view holds that one can intend to retaliate *if* attacked, without intending to retaliate *unconditionally*. This relies on the agent retaining the capacity to evaluate the condition at the moment of truth. C2 systems that delegate authority to submarine commanders or automate launch upon loss of signal remove this capacity. The condition is evaluated by a protocol, not a moral agent.
  2.  **The Separate Evaluation Reply:** This argues that forming the intention is rational even if acting is not. However, if the "acting" phase is automated, there is no second evaluation point. The "act" is the installation of the system, not the launch. This shifts the moral burden entirely to the installation phase, which standard theory does not adequately address.
  3.  **The Lesser-evil Defense:** This consequentialist argument justifies the risk of catastrophe to prevent war. It treats the mechanism of risk as neutral. It fails to distinguish between risking a catastrophe via a discretionary threat versus risking it via a non-discretionary trap. The latter may impose different moral costs regarding the treatment of one's own personnel and the stability of crisis bargaining.
  4.  **Policy-Based Evaluation:** Some suggest evaluating the standing policy rather than individual acts. While closer to the mark, this often assumes a central authority maintaining the policy. It does not account for systems designed to function *after* that authority is destroyed.

  In sum, existing positions assume a "Unitary Decider" who retains discretion at the moment of truth. Empirical evidence on nuclear C2 suggests this decider does not exist in the relevant scenarios. By ignoring the distribution of execution authority, current theory analyzes a idealized agent rather than the actual strategic environment.

  **Methodology and Timeline**
  The project will proceed over twelve months using a comparative taxonomy method. I will construct a taxonomy of four threat-structures:
  1.  **Promissory:** Centralized authority, full discretion (Classic Theory).
  2.  **Delegated:** Authority pre-assigned to field officers (e.g., submarine captains).
  3.  **Procedural:** Strict checklists and time-compression removing meaningful choice.
  4.  **Automated:** Retaliation triggered by sensors or loss of communication (Dead Hand).

  I will run three standard philosophical tests against each structure: the Toxin Puzzle (rationality of intention), Schelling's Brinkmanship (credibility of risk), and *Jus in Bello* proportionality (moral permissibility). This will be supported by two constructed case studies based on open-source descriptions of US and Soviet/Russian C2 postures during the Cold War and present day.

  **Timeline:**
  *   **Months 1–3:** Finalize taxonomy and review philosophical literature on collective agency and automation.
  *   **Months 4–6:** Develop case studies. Map empirical C2 features to the four threat-structures.
  *   **Months 7–9:** Apply philosophical tests. Determine which paradoxes survive which structures.
  *   **Months 10–12:** Drafting and revision of the monograph/article series.

  **Justification of Method:**
  A purely game-theoretic model is insufficient because it treats the "black box" of the state as a rational actor, obscuring internal architecture. A historical study of C2 would describe the systems but lack the normative tools to evaluate the shift from promise to hazard. A straight applied-ethics essay on automation usually focuses on tactical AI (drones) rather than strategic C2; this project fills the gap at the strategic level. The taxonomy method is necessary to isolate the variable of *discretion* while holding the *outcome* (retaliation) constant.

  **Success and Failure Conditions**
  **Success:** The project succeeds if it establishes the claim: "Deterrence credibility in high-alert postures relies on the elimination of agency, rendering intention-based moral critiques category errors." A well-informed opponent would have to engage this by either proving agency is retained in these systems or demonstrating that intention-based critiques apply even to non-agential hazards.

  **Failure:** The primary failure mode is **Probability Collapse**. From the adversary's point of view, a trap and a promise may both reduce to a subjective probability $P$ of retaliation. If strategic interaction depends only on $P$, the internal architecture is strategically inert. If the distinction between promise and trap is ontologically real but strategically irrelevant, the project's significance diminishes.
  *   *Mitigation:* Even if strategically inert, the distinction remains morally vital. If a trap is less attributable, it may lower the threshold for permissible installation while raising the horror of execution. I will argue that strategic irrelevance does not entail moral irrelevance.

  **Scope and Empirical Limits**
  To finish in twelve months, I must cut two areas. First, I will not adjudicate the general permissibility of nuclear deterrence; I assume the debate sits where it currently does and focus on the *mechanism* of the threat. Second, I will not analyze specific treaty law or warhead yields.

  Regarding empirical claims: A philosopher cannot become an amateur historian. I will treat empirical descriptions of C2 (e.g., pre-delegation policies, automated permissive action links) as "stylized facts" drawn from established security studies literature (e.g., Sagan, Schelling, Kristensen). I will not conduct archival research but will rely on consensus descriptions of system architectures. If a specific empirical claim is contested, I will model the philosophical implications of both possibilities rather than resolving the historical dispute. This ensures the philosophical work remains robust even if empirical details shift.

  ***

  **Confidence Statement**
  I am highly confident that the question is genuinely open; the literature overwhelmingly focuses on intention rather than architecture, and the "promissory-versus-trap" contrast is not standard under another name. I am also confident the project is tractable in twelve months given the restricted scope to launch authority rather than general nuclear ethics. The point on which I am least sure is the **Probability Collapse**. It is possible that for the purposes of both strategy and morality, the internal mechanism of the threat is irrelevant compared to the expected outcome. If the distinction between a hazard and a promise yields no difference in rational choice or moral attribution, the taxonomy will hold but the stakes will be low. I would change my mind on this if preliminary modeling shows that adversaries respond differently to delegated versus centralized threats in crisis simulations, or if moral intuition tests reveal a strong divergence in blame attribution for automated versus manual retaliation.
