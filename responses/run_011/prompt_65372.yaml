answer: |-
  # Joint Statement on Decision-Theoretic Foundations
  **Date:** 24 May 2024
  **Parties:** The Causal Camp (CC) & The Updateless Camp (UC)
  **Subject:** Adversarial Collaboration on Normative Decision Theory

  ## 1. Agreed Claims
  After twelve months of dialectic, the undersigned camps affirm the following propositions as common ground. These claims form the basis upon which our disagreements rest.

  1.  **Consequentialism:** The normative goal of decision-making is to bring about the best possible state of affairs. A decision procedure is instrumentally rational to the extent that it secures higher expected value.
  2.  **Omega's Reliability:** In the thought experiments discussed (Counterfactual Mugging, XOR Blackmail, and the Retrospective Coin), we stipulate that 'Omega' is a predictor of such high fidelity that, for all practical purposes, its predictions are accurate. We agree to treat Omega's claims about its own past predictions as truthful reports of historical facts, subject only to the logical constraints of the specific case.
  3.  **Ex Ante Commitment:** Both camps agree that, *before* a coin is flipped or a prediction is made, an agent would rationally commit to a policy of paying in Counterfactual Mugging scenarios. We agree that possessing a disposition to pay yields higher expected utility from the prior perspective than possessing a disposition to refuse.
  4.  **Dynamic Inconsistency:** We agree that Causal Decision Theory (CDT) admits dynamic inconsistency in these cases. A CDT agent at $t_0$ wishes to bind their future self at $t_1$, but upon reaching $t_1$ and acquiring new evidence (e.g., the coin landed Tails), the CDT agent no longer wishes to follow the $t_0$ plan. The Updateless Camp views this as a defect; the Causal Camp views this as a rational response to new information.
  5.  **No Backward Causation:** We agree that there is no physical, time-travelling causation. An action taken today cannot send a physical signal to the past to alter a coin flip or a neural state that occurred a year ago.
  6.  **The Goal of this Document:** We acknowledge that our dispute is not merely semantic. We disagree on which action actually yields the best outcome in specific fixed scenarios, not merely on the definition of the word 'rational'.

  ## 2. Disagreements Table
  The following table catalogues our precise points of divergence. Each side has drafted their position to ensure they can sign their own column without reservation.

  | Issue | Causal Camp Position (CC) | Updateless Camp Position (UC) | Crux | Condition for Settlement |
  | :--- | :--- | :--- | :--- | :--- |
  | **Counterfactual Mugging**<br>*(Coin Tails, Omega asks for $100)* | **Refuse.** The $10,000 reward is contingent on a Heads outcome which did not occur. The prediction is a past fact. Paying $100 now causally reduces your wealth by $100 and changes nothing else. | **Pay.** You are not choosing an act in isolation; you are selecting the output of your decision algorithm. That algorithm determines Omega's past prediction in the counterfactual Heads branch. Paying secures the $10,000 in the branch where it matters for expected value. | **The Relevance of Counterfactual Branches.**<br>Does a rational agent maximise utility relative to their current posterior credence (CC) or their prior credence over policies (UC)? | If the CC can identify a case where ignoring counterfactual branches leads to strictly dominated outcomes *even from the posterior perspective*, or if the UC accepts that known indexical facts sever logical ties to counterfactuals. |
  | **XOR Blackmail**<br>*(Letter received, pay to stop harm)* | **Refuse.** The letter has already been sent based on past facts (whether the rumour is true and your disposition). Paying correlates with harm but does not causally prevent the letter's sending. | **Pay.** Your decision to pay is logically linked to the condition that caused the blackmailer to send the letter. By paying, you make it the case that the blackmailer's algorithm would not have sent the letter (in the relevant logical sense). | **Logical vs. Causal Dependence.**<br>Is the blackmailer's action causally fixed by the past, or logically dependent on your current decision procedure? | A formal demonstration that 'logical dependence' entails a payoff structure indistinguishable from causal influence, or a proof that treating it as such leads to exploitation (e.g., by malicious predictors). |
  | **Normative Weight of Evidence** | **Update.** All available evidence, including indexical information ("I am in the Tails world"), must be conditionalised upon before choosing an act. To ignore evidence is irrational. | **Ignore Indexicals.** Indexical information regarding which branch of the probability tree one occupies should not be used to update the policy selection. The policy is chosen from behind a veil of ignorance. | **The Principle of Reflection.**<br>Should an agent's current beliefs align with their anticipated future beliefs, or with their prior beliefs? | If the UC concedes that some indexical information (e.g., "I am about to die") must be conditionalised on, or if the CC concedes that some evidence (e.g., "Omega predicted I would do X") must be ignored. |

  ## 3. Unity of the Quarrel
  **Verdict:** This is **one quarrel**, not two.

  Both the Counterfactual Mugging and XOR Blackmail disputes stem from a single foundational disagreement: **The Normative Status of Indexical Information.**

  *   The Causal Camp holds that once an agent knows *which* world they are in (e.g., "The coin is Tails" or "The letter has been sent"), they must maximise utility within that specific world. Counterfactual worlds are irrelevant to current choice because they are causally disconnected.
  *   The Updateless Camp holds that an agent is an instance of a general algorithm. The agent must maximise utility across all worlds weighted by the *prior*, because the algorithm's output is logically correlated across those worlds.

  We flag one potential **verbal dispute**: Both camps use the word "rational". The CC defines it as "procedurally correct reasoning from current evidence". The UC defines it as "winning (securing high utility) consistently". However, because this verbal difference maps onto a disagreement about *which action to take* (Pay vs. Refuse), we classify the core dispute as substantive, not merely linguistic.

  ## 4. The Retrospective Coin Case
  *The following analysis addresses the specific scenario proposed by the reading group to test the breaking point of our collaboration.*

  **The Case:**
  A year ago, Omega flipped a fair coin.
  *   **Heads:** Omega gives a stranger $10,000 *if* Omega predicted you would pay Omega $100 today.
  *   **Tails:** Stranger gets nothing.
  *   **Current State:** The coin came up Tails. The stranger got nothing. Omega informs you: "My prediction a year ago was that you would refuse to pay today."
  *   **Decision:** Do you pay Omega $100 today?

  ### 4.1 Camp Positions

  **The Causal Camp (CC): Refuse.**
  *   **Reasoning:** The coin flip is a past physical event; it is Tails. The stranger received nothing. Omega's prediction is a past neural event; it was 'Refuse'. Your action today cannot causally influence the coin flip, the stranger's wealth, or Omega's past mental state. Paying $100 results in a net loss of $100 with no compensatory gain. The fact that you *would have* been rewarded had the coin been Heads is irrelevant, because the coin is not Heads.
  *   **Critique of UC:** The Updateless Camp is engaging in magical thinking. They are pretending that their current action can reach back in time to alter Omega's prediction. They are throwing away money to satisfy a ghost of a counterfactual.

  **The Updateless Camp (UC): Pay.**
  *   **Reasoning:** Omega's prediction was based on your decision algorithm. Omega's statement ("I predicted Refuse") is a report on what your algorithm *would* output. If you choose to Pay now, you demonstrate that your algorithm is of the 'Pay' type. If your algorithm is of the 'Pay' type, then Omega (being accurate) *must* have predicted 'Pay'. Therefore, by Paying, you make it the case that the condition for the stranger's reward *would have been met* in the Heads counterfactual. You are not changing the past; you are selecting which logical past is consistent with your present choice. To refuse is to confirm you are a 'Refuse' type, guaranteeing you lose the $10,000 in the 50% of worlds where the coin was Heads.
  *   **Critique of CC:** The Causal Camp is suffering from dynamic inconsistency. They are letting the accidental fact of the coin landing Tails blind them to the structural fact that their decision rule determines their payoff across the multiverse of possibilities. They are leaving expected value on the table.

  ### 4.2 Falsification Conditions
  *What evidence would each camp accept as proof they are wrong in this specific case?*

  **For the Causal Camp:**
  *   **Evidence:** A repeated trial of this exact scenario (or a structurally identical one) where agents who Pay consistently end up with higher total wealth *from the perspective of the agent making the decision*, even after conditioning on the coin being Tails.
  *   **Specifically:** If Omega offers a contract *today*: "If you Pay $100 now, I will reveal that the coin was actually Heads, or I will compensate you for the counterfactual loss." (i.e., if the counterfactual value can be cashed out in the actual world).
  *   **Admission:** "If it can be shown that Paying influences the probability that the coin *was* Heads (via some retrocausal mechanism we denied), we will concede."

  **For the Updateless Camp:**
  *   **Evidence:** A demonstration that Paying in this specific instance (where Omega has explicitly stated the prediction was 'Refuse') leads to a lower payoff than Refusing, without any penalty in future interactions.
  *   **Specifically:** If Omega is proven to be a 'fixed-record' predictor (i.e., Omega's prediction is a physical inscription that cannot be logically retroactively altered by your current choice). If Omega says "I wrote 'Refuse' on this paper a year ago" and shows you the paper, and Paying does not change the ink on the paper.
  *   **Admission:** "If it is proven that Omega's prediction is causally decoupled from our current algorithm (i.e., Omega predicted based on data that cannot be changed by our current reasoning), we will concede that the logical link is broken."

  ## 5. Signatories

  **For the Causal Camp:**
  *"We sign this acknowledging that while we may envy the Updateless agent's ex ante wealth, we cannot justify acting on evidence we know to be false (that the coin might be Heads) or on causal links that do not exist."*

  **For the Updateless Camp:**
  *"We sign this acknowledging that the Causal Camp's position is internally consistent given their premise that indexical information severs logical ties. We maintain that their premise is the error, not their logic."*

  ***

  **End of Document**
