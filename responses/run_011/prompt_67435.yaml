      *   **Para 4 (Price-Specie-Flow Mechanism):**
          *   *Claim:* Self-correcting through trade. Too much money = dear goods = exports fall/imports rise = coin flows out. Too little = cheap goods = exports rise = coin flows in. Applies within country (capital vs. provinces). Level settled by art/industry. Money follows industry.
          *   *Assessment:* Accurate. Covers the mechanism well. The "capital vs. provinces" analogy is a nice specific detail from Hume's text.

      *   **Para 5 (Bank Notes/Paper Credit):**
          *   *Claim:* Bank notes substitute cheaper instrument for dearer one. Every note drives out equal gold/silver sent abroad. Total purchasing power unchanged. Paper economises cost. Hume indifferent between paper/metallic. Worry is instability, not size. Mechanism is about specie, nothing to say about credit/exchange.
