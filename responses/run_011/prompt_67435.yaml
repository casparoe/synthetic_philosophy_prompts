      *   This script is very coherent. The Para 3 argument is actually quite sophisticated, even if debatable. It shows independent thought. In many HET contexts, linking Hume to modern inflation targeting is seen as a clever synthesis, provided it's flagged as an interpretation ("On this reading..."). The student *does* flag it ("On this reading..."). So maybe penalize less.
