      *   *Setpoint:* The desired cultural "temperature" (balance of safety/creativity).
      *   *Temperature:* The actual observed behavior/norm strength (compliance vs. deviance).
      *   *Sensor:* Metrics (reports, churn, engagement) + Community feedback.
      *   *Heat Source:* User interaction/conflict (the energy driving the system).
      *   *Cooling Source:* Moderation action (removing heat).

  4.  **Analyzing Disanalogies (The "Audit"):**
      *   *Threatening Disanalogies:*
          *   **Hysteresis/Irreversibility:** You can't just turn the dial back. Users who leave don't come back. Trust once lost isn't regained by turning the heat back up.
          *   **Multiple Zones:** A house has one temperature; a platform has subcultures. Halving enforcement in one area might freeze another.
          *   **The "Heat" Source:** In a house, heat is external/mechanical. In a community, "heat" (conflict/engagement) is generated by the users *in response* to the rules.
          *   **Norm Internalization:** Rules aren't just external constraints; they become internal values. Weakening enforcement weakens *belief*, not just compliance.
      *   *Inelegant Disanalogies:*
          *   **Lag Time:** Thermostats react quickly; culture shifts slowly.
