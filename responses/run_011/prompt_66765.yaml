      *   **Operation:** Multiply change in score × number of people × duration = "wellbeing years".
      *   **Operation:** Convert to money using a fixed rate.
      *   **Operation:** Compare disparate policies (road junction vs. bereavement counselling).
      *   **Underlying Assumptions:**
          *   Cardinality: The numbers represent magnitudes, not just ranks.
          *   Interpersonal Comparability: A 1-point change for Person A = 1-point change for Person B.
          *   Unidimensionality: All values (satisfaction, worthwhileness, happiness, anxiety) can be collapsed into a single metric (or at least traded off).
          *   Temporal Additivity: Wellbeing over time is the sum of momentary states (or annual averages).
          *   Welfarism: Wellbeing is the sole ultimate good for policy.
          *   Hedonism/Pleasure Theory?: Not necessarily strict hedonism, but definitely *mental statism* (wellbeing consists in mental states).

  3.  **Identify the Theoretical Commitments:**
      *   **Strictly Required:**
          *   *Cardinal Interpersonal Comparability:* To sum across people, a unit must be comparable.
          *   *Unidimensionality (for the final sum):* To get a single "wellbeing year" count, all dimensions must be reducible to one scale.
          *   *Linearity/Additivity:* To multiply points × years × people, the scale must be interval-like and additive.
          *   *Mental Statism:* Wellbeing is determined by subjective reports, not objective lists (though "worthwhile" complicates this).
      *   **Not Strictly Required (but often implied):**
          *   *Hedonism:* You don't need to believe wellbeing is *pleasure* specifically. You could believe it's "desire satisfaction" or "objective list" but measure it via SWB proxies. However, the *arithmetic* treats them as felt quantities.
