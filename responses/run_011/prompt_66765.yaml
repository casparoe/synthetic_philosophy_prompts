      *   **Core Concern:** What theory of pleasure/wellbeing does this machinery presuppose? What bits are strictly required (e.g., single quantity, interpersonal comparability, hedonism) vs. optional? Where does the practice contradict itself (e.g., "worthwhile" vs. feelings, non-monetized boxes)? What happens if "happy states" have nothing in common (nominalism)?
      *   **Constraint:** Bottom line in the very first sentence. No preamble. Don't restate the question.

  2.  **Deconstruct the Policy Machinery:**
