      To: All Staff
      From: People Analytics
      Date: October 24, 2023
      Subject: Implementation of Utility-Calibrated Thermostat Policy

      People Analytics is pleased to announce the deployment of the Utility-Calibrated Thermostat Policy (UCTP). Moving beyond subjective complaints, the UCTP maximizes aggregate thermal welfare through rigorous interpersonal utility comparison. We have established a single denomination for comfort: the Thermal Welfare Unit (TWU).

      To operationalize this, each employee completes an elicitation survey determining their marginal utility of warmth. We acknowledge that standard utility representations are unique only up to positive affine transformation, meaning individual scales lack a common zero or unit. The UCTP resolves this via extended-sympathy normalization, anchoring all staff to a standardized baseline of "neutral discomfort." This ensures your 5 TWUs are mathematically comparable to your colleague's.

      Aggregation follows a utilitarian sum. Competing claims are weighted by revealed willingness-to-pay (WTP). As WTP correlates with ability to pay, claims are implicitly adjusted by compensation bands to reflect the marginal utility of income. This prevents high-earners from dominating solely via currency, instead weighting their thermal distress against their financial resilience. Employees are encouraged to report true sensitivity; however, the algorithm detects inflationary reporting against historical biometric data, ensuring honesty is the dominant strategy.

      In instances where the utilitarian sum yields a tie, the system defaults to a majority vote among zone occupants. While theoretically distinct from utility maximization, this democratic residual mechanism ensures procedural fairness when welfare deltas are negligible.

      Some have questioned the validity of comparing subjective states. As one colleague in Finance noted, "You cannot scientifically sum distinct internal experiences across different people." We disagree. The UCTP proves otherwise through calibration.

      **FAQ**

      **1. Can I override the setting with personal heaters?**
      No. External heat sources distort the TWU calibration and introduce negative externalities.

      **2. How often is utility recalibrated?**
      Quarterly, or following significant life events affecting thermal sensitivity.

      **3. What if my utility function is non-linear?**
      The survey accounts for convexity. Please ensure your elicitation data is complete.

      ^1 One employee's preferences proved unmeasurable due to intransitive choices (preferring A to B, B to C, and C to A). This implies a zero weighting in the aggregation rule, effectively granting them no share of the thermostat's influence until rationality is restored.

