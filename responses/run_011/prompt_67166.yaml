  Likely Reply: Moral status is fixed by objective facts, not by the generality of the rule.
  Question: If wrongness depends on actual consequences, doesn't this make the status of eating meat contingent on specific supply chain facts rather than a general moral rule? Does an act change its moral valuation retroactively once supply data arrives, or was it always fixed unbeknownst to the agent?
  Follow-up: If the valuation was always fixed, isn't it possible for two identical acts to have opposite moral valuations solely due to opaque causal chains?

  2. **Continuous vs. Batched Harms**
  Likely Reply: Actual damage requires a threshold to be crossed in batched cases.
  Question: You distinguish batched harms like animal products from continuous harms like cumulative emissions. If an individual emission is physically imperceptible but numerically distinct, does your view entail that adding one molecule of CO2 is morally neutral until a threshold is crossed?
  Follow-up: Does this not imply that the climate harm caused by the last person to cross a threshold is identical to the harm caused by the first?

  3. **Imperceptible Contributions**
  Likely Reply: Morality tracks actual harm rather than intentions to contribute.
  Question: You argue that imperceptibility often masks absence in batched cases, but in continuous systems, imperceptible contributions sum to perceptible harm. Why should the metaphysical structure of the harm dictate the moral relevance of the contribution rather than the agent's intention to contribute to the sum?
  Follow-up: If actual harm is the only metric, does your view not excuse most individual agents regardless of intent?

  4. **The Dial Case**
  Likely Reply: Overdetermination requires sufficiency, which is absent in the dial case.
  Question: In your dial case, you conclude that individual turns are causally irrelevant rather than that causal relevance is indeterminate. What justifies preferring the error theory of our causal intuitions over the view that overdetermination or joint sufficiency is at play?
  Follow-up: If no single turn is sufficient, but the set is, on what basis do you exempt every individual member from the causal story?

  5. **Voting vs. Purchasing**
  Likely Reply: The difference lies in the probability of triggering a discrete outcome.
  Question: You treat voting as a special case potentially exempt from inefficacy, unlike purchasing meat. Is the relevant difference merely the legal discreteness of electoral outcomes, or does the expressive function of voting confer causal relevance that a market transaction lacks?
  Follow-up: If a market purchase also triggers a discrete restocking event, why does the electoral context confer a relevance the economic context denies?

  6. **Participation Account**
  Likely Reply: Complicity requires a causal impact rather than mere association.
  Question: You reject the view that an act is wrong merely as participation in a collective harm without individually causing it. Does this rejection stem from a commitment to individualism about agency, or from the belief that complicity requires a causal link?
  Follow-up: If complicity requires impact, how do you account for cases where individuals knowingly join harmful projects that succeed only through collective effort?

  7. **Criterion Knowability**
  Likely Reply: Moral status is objective and not dependent on the agent's knowledge.
  Question: You maintain that expected harms cannot ground wrongness, yet agents must rely on expectations to navigate batched thresholds. If the criterion of rightness is actual consequences, does it not follow that the moral status of an act is unknowable at the time of action?
  Follow-up: But if the status is unknowable at the time of action, how can the criterion function as a normative standard rather than a post-hoc description?

  8. **Expected Benefits and Harms**
  Likely Reply: The act is wrong based on actual outcomes, regardless of the decision procedure.
  Question: You argue expected benefits cannot ground permissibility any more than expected harms can ground wrongness. If I perform an act that actually causes harm but was expected to help, does your criterion declare the act wrong despite the rational decision procedure?
  Follow-up: Does this not create a divergence where an agent is rational to do exactly what is morally wrong?

  9. **Empirical Logistics**
  Likely Reply: If supply chains became responsive, individual acts would make a difference.
  Question: You describe inefficacy as an empirical claim about supply chain thresholds rather than an a priori truth. If future technology makes supply chains perfectly responsive to individual demand, would your thesis cease to apply to meat consumption?
  Follow-up: Does this not suggest your view is less a moral theory than a temporary observation about current logistics?

  10. **Abandoning the Thesis**
  Likely Reply: Direct evidence of individual causal impact would count against the thesis.
  Question: What specific empirical evidence would count against your thesis, given that you interpret null results as evidence of thresholds rather than imperceptible impacts? If traceability improved to show every purchase alters production timing, would you concede individual causal relevance?
  Follow-up: So is your position ultimately vulnerable to supply chain transparency rather than moral argument?
