      *   *Claim 3 (von Neumann Replication):* Dual use of description (data vs. instruction) explains compact replication (like quines).
      *   *Claim 4 (Incompleteness = Mutation):* Verification regress implies a hard floor on error. Mutation is biological incompleteness.
