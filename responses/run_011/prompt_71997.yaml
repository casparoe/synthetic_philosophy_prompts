answer: |-
  Grandmother died Tuesday, nine days after her eighty-eighth birthday. She would want those numbers exact. She would not want me to say "about eighty-eight." She spent forty-one years as a bank teller and another twenty keeping the parish books in pencil. She taught us that numbers are promises. If you say a thing costs forty dollars, you show the receipt. If you make a mistake, you erase the whole line. You do not round off. You do not approximate.

  But life does not balance like a ledger.

  For the last seven years, the counting went first. She would get three words into a sentence and the numbers would wander. The sentence would go somewhere else. She would look annoyed. She knew the sum was wrong, even if she couldn't find the error.

  We have spent these years trying to find the line where the account closed. Some of us say she left us in 2019, when the names started to slip. Some of us say she stayed until Tuesday, when the breathing stopped. We want a date. We want a receipt for this. We want to know if we were visiting her, or visiting a house she used to live in.

  She hated the word "about." But these years were all "about."

  If I stand here and say she was gone, I ignore the hand that squeezed mine last week. It was weak, but it answered pressure with pressure. That is a transaction. That is a connection. If I stand here and say she was fully here, I ignore the eyes that looked through me, searching for a name that wasn't there. That is a absence. That is a loss.

  We are looking for a border that isn't on the map. We want to point to a single Tuesday and say "This is where she stopped." But she wasn't a light switch. She was a pencil mark.

  When you press hard enough with graphite, you leave an indent in the paper. Even when you erase the lead, even when the grey is gone, the pressure remains. You can feel it with your finger. Is it writing? Yes. Is it ink? No. It is both and neither. It is the shape of the force she applied to the world.

  For the last year, I have watched her hum along to the hymns. She didn't know the words. She didn't know the tune's name. But she found the pitch. She held the note. Was she singing? If you need the words, then no. If you need the music, then yes. To ask which one is true is to ask the wrong question. The sound was in the room. The vibration was real.

  We are tempted to choose a side. To say the hum was just noise, or to say the hum was the whole song. But the truth is not a single line item. It is the total sum.

  The sum includes the woman who balanced the parish books to the penny. It includes the woman who got annoyed when her sentences broke. It includes the woman who squeezed your hand without knowing your name. These are not contradictions. They are columns in the same book.

  We do not need to decide when she left. We only need to acknowledge that she was here, in all the ways she could be, until she wasn't.

  There is a comfort in knowing that a statement can be true even when the parts are unclear. It is true that she changed. It is true that she remained. To hold only one is to drop the weight. We are here to carry the whole of it.

  Now we close the book. The casket is closing. We are not losing her; she is not a set of keys. We are finishing the count. The numbers add up. The pencil is put down. The indent remains.

  Thank you.
