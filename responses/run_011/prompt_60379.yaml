              *   If her credence is 1/3, she should reject bets at 1:1 odds (requires > 2:1 to accept).
              *   So Thirder credence aligns with rejecting the bet.
          *   *Problem:* The definition of credence as betting odds (Claim 2) often runs into trouble with self-locating belief if the betting setup counts bets per awakening vs per experiment.
