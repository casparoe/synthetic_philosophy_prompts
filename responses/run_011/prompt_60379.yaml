          *   So CDT + SIA -> Accept PP bet.
          *   Claim 4 says "I am prepared to write the check." Claim 6 says "I am CDT."
          *   This is consistent.
          *   *Severity:* Low.

      *   **Tension 4: Credence = Betting Odds (Claim 2) + No Stakes-Relativity (Claim 3).**
          *   This is the core philosophical friction.
          *   If credence is *defined* as betting odds (operationalism), then if betting odds change due to stakes (utility), credence changes.
          *   Claim 3 says credence should *not* change due to stakes.
          *   Therefore, for Claim 2 and 3 to hold, betting odds must *never* change due to stakes, only due to evidence.
          *   But in decision theory, optimal betting odds *do* depend on utility functions (risk aversion, etc., though usually credence is defined for risk-neutral).
