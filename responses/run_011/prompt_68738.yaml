  7.  **Final Polish:** Check for any "wincing" language. Ensure the Design faction doesn't sound like they think the Measurement faction is naive, and vice versa. The Measurement faction shouldn't sound dogmatic, just realist. The Design faction shouldn't sound nihilistic, just constructivist.

