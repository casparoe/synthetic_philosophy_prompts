answer: |-
  **TO:** Lab Director, Internal Review Committee
  **FROM:** Senior Research Group (Measurement & Design Factions)
  **DATE:** October 24, 2023
  **SUBJECT:** Joint Statement on Inferred Reward and Assistant Posture

  ### 1. Agreed Claims

  The undersigned factions affirm the following propositions as the baseline for our collaborative work. Where the rationale for agreement differs, this is noted in parentheses.

  1.  **Behavioral Sufficiency:** In the absence of explicit instruction, observed behavior (reaches, acceptances, refusals) is the only available signal for inferring user goals. (Measurement: Behavior is the observable effect of latent preferences. Design: Behavior is the only material we have to construct a goal function.)
  2.  **Model Dependence:** Any inferred reward function is contingent on the chosen hypothesis class, the planner model (e.g., discount factor, noise temperature), and the selection of training episodes. (Measurement: These are control variables for accurate estimation. Design: These are constitutive choices that determine the output.)
  3.  **Invariance:** Reward functions are identifiable only up to positive affine transformation and transformations that leave the optimal policy set unchanged. (Measurement: The equivalence class under these transformations constitutes the preference. Design: Only the resulting policy is real; the reward surface is a calculational tool.)
  4.  **The Thermos Case:** In the forty-day arm-control dataset, Model M1 (stable preference against burden) and Model M2 (myopic planner regarding social friction) achieve statistically indistinguishable predictive accuracy on held-out choices, yet prescribe divergent actions regarding assistance-requiring reaches.
  5.  **Validity Gap:** High predictive accuracy on future choices does not guarantee that the user endorses the system's autonomous actions taken on the basis of those predictions. (Measurement: This indicates a failure of the model to capture long-term preferences. Design: This indicates that prediction is the wrong metric for assistance.)
  6.  **Cooperative Uncertainty:** Explicitly modeling uncertainty about the reward and querying the user reduces the risk of catastrophic error compared to acting on a point estimate. (Measurement: Queries reduce entropy about the true reward. Design: Queries allow the user to participate in defining the reward.)
  7.  **Normative Goal:** The ultimate objective of the system is to improve the user's welfare, not merely to minimize prediction loss. (Measurement: Welfare is maximized by satisfying stable preferences. Design: Welfare is maximized by aligning with the user's reflective endorsement.)

  ### 2. Disagreements Table

  | Issue | Measurement Faction Formulation | Design Faction Formulation | Judgment |
  | :--- | :--- | :--- | :--- |
  | **Ontology of Reward** | The fitted reward function estimates a latent psychological quantity (preference) that exists independently of the model used to recover it. | The fitted reward function is a proposal generated by the model; it does not exist independently of the hypothesis class and planner assumptions. | **Verbal** (regarding the label "preference"); **Substantive** (regarding stability across model classes). |
  | **Reward–Planner Entanglement** | The ambiguity between reward and planner is an epistemic problem solvable in principle with richer data (e.g., varying contexts, queries) that breaks the degeneracy. | The ambiguity between reward and planner is a principled underdetermination; no amount of behavioral data can separate them without normative assumptions about rationality. | **Substantive** |
  | **Validity Criterion** | The gold standard is out-of-sample predictive accuracy of choices; user endorsement is a noisy signal of the same underlying preference. | The gold standard is the user's informed retrospective endorsement of outcomes; predictive accuracy is merely a constraint on system usability. | **Substantive** |
  | **Default Posture** | When the model confidence exceeds a threshold, the assistant should defer to the inferred reward as a stand-in for user judgment. | Regardless of model confidence, the assistant must treat the inferred reward as a draft requiring user inspection and ratification. | **Substantive** |
  | **Cooperative Queries** | Queries are measurements designed to reduce uncertainty about the fixed target (the true reward). | Queries are interventions that shape the user's understanding of their own options and thereby alter the target. | **Verbal** (regarding "measurement" vs. "intervention"); **Substantive** (regarding whether queries converge). |

  **Note on Vocabulary:** We acknowledge that a portion of this dispute is verbal. If both sides agree to reserve the word "preference" solely for *reflectively endorsed valuations* (Design) and use "behavioral valuation" for *model-fitted reward functions* (Measurement), the ontological disagreement diminishes. However, the disagreement over **Default Posture** remains substantive even under this shared vocabulary: the Measurement faction argues for deferring to high-confidence behavioral valuations; the Design faction argues for withholding action until reflective endorsement is obtained.

  ### 3. The Cruxes

  To move from stalemate to resolution, we identify the following sub-questions. Settling these empirically would require at least one faction to revise its position.

  **Crux 1: Stability of the Assistance Weight (Thermos Case)**
  *   **Experiment:** Deploy the arm in three blocked conditions: (A) Caregiver present (high social cost), (B) Caregiver absent (low social cost), (C) Caregiver present but protocolized to remove "burden" friction (neutralized social cost).
  *   **Measurement Prediction:** The fitted weight on "requiring assistance" will remain stable and negative across all three conditions. The user's post-hoc endorsement will align with M1 (avoiding assistance) even in condition C, confirming the preference is against the act itself, not the friction.
  *   **Design Prediction:** The fitted weight on "requiring assistance" will vanish or flip positive in Condition C. The user's post-hoc endorsement will align with M2 (accepting assistance) when friction is removed, confirming the original behavior was a planning artifact, not a preference.
  *   **Falsification:** If the weight remains stable but users consistently reject the arm's avoidance of assistance in Condition C, Measurement must abandon the claim that behavioral fit equals welfare. If the weight vanishes but users still report feeling "burdened," Design must abandon the claim that friction explains the avoidance.

  **Crux 2: Identifiability via Querying**
  *   **Experiment:** Implement a cooperative inverse reinforcement learning (CIRL) agent that queries the user when reward uncertainty is high. Track whether the posterior distribution over rewards converges to a narrow peak or oscillates indefinitely as the user's answers adapt to the query framing.
  *   **Measurement Prediction:** The posterior will converge. Repeated queries will reduce entropy, yielding a stable reward function that predicts choices better than the prior.
  *   **Design Prediction:** The posterior will not converge to a unique solution. The user's answers will shift based on the options presented (preference construction), meaning the "true reward" distribution is ill-defined.
  *   **Falsification:** If Measurement observes non-convergence despite orthogonal queries, they must admit principled underdetermination. If Design observes convergence to a reward function that predicts *new* behaviors without further ratification, they must admit discovery is possible.

  **Crux 3: The Cost of Ratification**
  *   **Experiment:** Compare user welfare (self-reported fatigue, task completion time, satisfaction) between a "Deference Policy" (high-confidence automation) and a "Ratification Policy" (always confirm inferred goals) over 30 days.
  *   **Measurement Prediction:** The Ratification Policy will increase cognitive load and fatigue, reducing welfare. The Deference Policy will yield higher welfare because it respects the user's time and implicit competence.
  *   **Design Prediction:** The Deference Policy will accumulate "automation surprises" (actions the user dislikes but didn't catch), eroding trust and welfare. The Ratification Policy will sustain trust and welfare despite the overhead.
  *   **Falsification:** If Deference yields higher satisfaction scores without increased reports of "unwanted actions," Design must concede that ratification is not always required. If Ratification yields higher trust without increased fatigue reports, Measurement must concede that deference is risky.

  ### 4. Conditions for Falsification

  **Measurement Faction:**
  We would abandon our position if we observe that increasing the quantity and variety of behavioral data (including cross-contextual data) leads to *less* stability in the inferred reward parameters rather than more. Specifically, if adding data from the "neutralized social cost" condition in the Thermos Case causes the "assistance aversion" parameter to fluctuate wildly rather than converge, we must accept that the quantity we are measuring is not a stable psychological trait.

  **Design Faction:**
  We would abandon our position if we identify a specific model class and planner configuration that consistently produces autonomous actions which users endorse retrospectively *without* prior ratification, across varied contexts. If we find that a "discovered" reward function predicts user satisfaction better than a "co-constructed" one, we must accept that inference can be discovery rather than proposal.

  ### 5. Note on Fluctuating Capacity

  Approximately half of our user base experiences significant fluctuations in cognitive or physical capacity to endorse system actions (due to fatigue, medication, or progression of condition). For the **Measurement Faction**, this complicates the signal-to-noise ratio: the "true preference" exists but is obscured by capacity fluctuations, requiring the model to filter for high-capacity moments to estimate the reward accurately. For the **Design Faction**, this is not noise but a fundamental constraint: if the capacity to endorse is absent, the "preference" cannot be constructed or ratified in that moment, meaning the system must default to a conservative safety prior rather than an inferred reward. Both sides agree that in low-capacity states, the default posture must shift toward preservation of option value (keeping future choices open) rather than optimization for a specific inferred goal, but they disagree on whether this is a temporary suspension of measurement or a permanent acknowledgment of the limits of design.
