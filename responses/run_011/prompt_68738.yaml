          *   *Claim 4 (Thermos):* M1 and M2 fit equally well but imply different actions.
          *   *Claim 5 (Goal):* The system must improve user welfare, not just fit data.
          *   *Refinement:* Ensure parentheticals capture the *why* without breaking the agreement.

      *   **Section 2: Disagreements Table:**
          *   *Issue:* Ontology of Reward. Measurement: Real quantity. Design: Model-relative proposal.
          *   *Issue:* Entanglement. Measurement: Practical identifiability. Design: Principled underdetermination.
          *   *Issue:* Validity. Measurement: Predictive accuracy. Design: Retrospective endorsement.
          *   *Issue:* Deference. Measurement: Default to model confidence. Design: Default to user ratification.
          *   *Judgment:* This is crucial. Is it verbal? The "preference" label is likely verbal. The "deference vs. override" is substantive. I need to be precise here.

      *   **Section 3: The Cruxes:**
          *   Need specific experiments.
          *   *Thermos Prediction:*
              *   Measurement: Varying cost of asking changes the *weight* on assistance, but the *structure* (aversion to burden) remains stable across contexts. Endorsement tracks the M1 reward.
              *   Design: Varying cost changes the *optimal model specification* (M1 vs M2). Endorsement will track the *outcome* of M2 (less assistance avoidance) even if M1 fit the past data.
          *   *Entanglement:* If we fix the planner, does the reward stabilize? (Measurement: Yes. Design: No, because planner is always wrong.)
          *   *Queries:* Do queries converge? (Measurement: To truth. Design: To a stable equilibrium.)

      *   **Section 4: Falsification Conditions:**
          *   Measurement: If better data leads to *less* stability in inferred rewards, or if users consistently reject "confident" inferences.
          *   Design: If a specific model class consistently yields outcomes users endorse *without* needing ratification loops (suggesting the "proposal" was actually a "discovery").

      *   **Section 5: Fluctuating Capacity:**
          *   How does dementia/fatigue change this?
          *   Measurement: Preferences exist but are hard to access.
          *   Design: Preferences are co-constructed in the moment; capacity *is* the design constraint.

  4.  **Refining Tone and Vocabulary:**
      *   Avoid "Subject A says X, Subject B says Y." Use "The Measurement Faction," "The Design Faction."
      *   Ensure the "Thermos Case" is central.
      *   Check constraints: No references. No literature survey.
