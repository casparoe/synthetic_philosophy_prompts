      *   **Context:** Building assistive systems that infer user wants from actions (robotic arms, schedulers).
      *   **The Conflict:**
          *   *Measurement Faction:* Inferred reward = estimate of real psychological quantity (preferences). Default posture = deference.
          *   *Design Faction:* Inferred reward = proposal relative to model choices. Default posture = inspect and ratify.
      *   **Required Technical Matters:** Invariance results, Reward-Planner Entanglement, Validity Criterion, Cooperative Formulation (uncertainty/querying).
      *   **Required Case Study:** The "Thermos Case" (SCI user, robotic arm, assistance cost vs. myopia).
      *   **Required Structure:**
          1.  Numbered section of agreed claims (with parentheticals for different reasons/qualifications).
          2.  Disagreements table (Issue, Measurement Formulation, Design Formulation, Substantive/Verbal judgment).
          3.  The Cruxes (Sub-questions, evidence/experiments, specific predictions for Thermos case).
          4.  Closing section (Evidence against own position).
          5.  Paragraph on fluctuating capacity to endorse.
      *   **Constraints:** No literature survey/references. Be willing to call out verbal disputes vs. substantive ones. Tone must be neutral enough for both to sign without wincing.

  2.  **Deconstruct the Positions & Find Common Ground:**
      *   *Common Ground:* Both want the system to help the user. Both agree behavior is data. Both agree models are imperfect. Both agree the Thermos case is the testbed. Both agree "preference" is a loaded term.
      *   *Measurement:* Ontological realism about preferences. Epistemic optimism (we can measure them). Normative deference.
      *   *Design:* Constructivism/Instrumentalism about rewards. Epistemic caution (underdetermination). Normative partnership (ratification).
      *   *Technical Bridges:*
          *   *Invariance:* Both agree utility is ordinal/affine. Measurement says the *ordering* is the preference. Design says the *ordering* is a model artifact.
          *   *Entanglement:* Measurement says it's a practical identifiability problem (solve with more data/constraints). Design says it's principled underdetermination (no true reward exists independent of the planner).
          *   *Validity:* Measurement prioritizes prediction of choice. Design prioritizes endorsement of outcome.
          *   *Cooperative:* Measurement sees queries as reducing uncertainty about the *true* reward. Design sees queries as part of the *construction* of the reward.

  3.  **Drafting - Section by Section:**

      *   **Header:** Needs to look like an internal lab document.
