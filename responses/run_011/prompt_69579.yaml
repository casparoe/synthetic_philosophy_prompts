  # THE VAGUENESS MAP
  **Philosophy Club — Decision Tree**

  **The Cruxes**
  Before you begin, note the five fault lines that divide the positions you might reach. This tree sorts you based on your answers to specific cases, not on which labels you like.
  *   **The Break Point:** Does the argument fail at the first step, the small steps, or the logic itself?
  *   **The Hidden Fact:** Is there a sharp cutoff, and is it possible in principle to know it?
  *   **The Fuzzy Edge:** Is "clearly a heap" just as vague as "heap"?
  *   **The Shifting Target:** Does the meaning change depending on who is judging or what else is around?
  *   **The Truth Status:** Can a borderline sentence be neither true nor false, or even both?

  ***

  **THE TREE**
  *Start at Node 1. Follow the path that matches your honest commitment.*

  **1. The Sand Heap (The Step)**
  Imagine a heap of 1,000 grains with a counter. You remove one grain.
  *   **A.** I insist that removing one grain *never* turns a heap into a non-heap. (Go to 2)
  *   **B.** I insist that at some specific removal, it does turn into a non-heap. (Go to 4)

  **2. The Sand Heap (The Zero)**
  If you keep removing grains until only one is left:
  *   **A.** I would still call that single grain a "heap." (Go to 9)
  *   **B.** I would call that single grain a "non-heap." (Go to 3)

  **3. The Logic Check**
  You said one grain never matters (1A), but one grain is not a heap (2B). Consider this rule: *Modus Tollens* (if one thing guarantees another, and the other is false, the first must be false).
  *   **A.** I accept this rule; I must stop saying one grain never matters. (Go to 4)
  *   **B.** I reject this rule; I keep both my claims even if they clash. (**Leaf: Dialetheism**)

  **4. The Student (The Fact)**
  A student is measured every morning for a year. They grow from "not tall" to "tall."
  *   **A.** There is one specific morning where they became tall, even if we can't name it. (Go to 5)
  *   **B.** There is no single morning; "tall" fades in gradually. (Go to 6)

  **5. The Student (The Knowledge)**
  Regarding that specific morning in 4A:
  *   **A.** A perfect mind could know exactly which day it was. (**Leaf: Epistemicism**)
  *   **B.** Even a perfect mind could not know; there is no fact to find. (Go to 10)

  **6. The Bell (The Degrees)**
  A bell is rung more and more faintly until it is silent.
  *   **A.** There is a state where it is genuinely "half-silent" or partly ringing. (**Leaf: Degree Theory**)
  *   **B.** No, it is either making sound or it is not; there are no partial truths. (Go to 7)

  **7. The Color Strip (The Gaps)**
  Look at the 200 patches, from red to orange. At the exact middle patch:
  *   **A.** The sentence "This is red" is neither true nor false; it has no status. (**Leaf: Supervaluationism**)
  *   **B.** It must be one or the other, even if we can't tell which. (Go to 8)

  **8. The Vehicle Ordinance (The Context)**
  A town bans "vehicles." A moped is in the park. A tank replica is also there.
  *   **A.** Whether the moped counts as a "vehicle" shifts depending on what else is in the park. (**Leaf: Contextualism**)
  *   **B.** The moped is what it is; the surroundings don't change the word's meaning. (Go to 9)

  **9. The Vehicle Ordinance (The Usage)**
  Given the trouble with cars, mopeds, wheelchairs, and tanks:
  *   **A.** We should stop using the word "vehicle" in laws entirely; it is too broken. (**Leaf: Nihilism**)
  *   **B.** The word works well enough; we shouldn't ban it. (Go to 10)

  **10. The Source (The Psychology)**
  Where does the fuzziness come from?
  *   **A.** It is a fact about our human brains and limits, not the words themselves. (**Leaf: Psychological View**)
  *   **B.** It is a fact about the words and meaning themselves. (Go to 11)

