  # SCORING KEY & ANALYSIS

  **The Leaves (Where You Landed)**
  *   **Epistemicism:** There is a sharp cutoff (e.g., a specific grain or day), but it is impossible for humans to know where it is.
  *   **Supervaluationism:** Borderline sentences (like "This middle patch is red") are neither true nor false because our language is not precise enough.
  *   **Degree Theory:** Truth comes in degrees; a fading bell can be "0.5 true" for ringing.
  *   **Contextualism:** The meaning of "vehicle" or "tall" shifts depending on the situation or what else is being compared.
  *   **Dialetheism:** Some borderline claims are both true and false; we must reject standard logic to save our intuitions.
  *   **Nihilism:** Vague words like "heap" or "vehicle" are too defective to apply to reality; we should revise our language.
  *   **Psychological View:** The world and words are sharp, but our perception or attention is fuzzy.

  **Indistinguishable Leaves**
  *   **Epistemicism vs. Psychological View:** These two are hard to separate with cases alone. Both say there is a fact we cannot find. Epistemicism says the *meaning* is sharp; the Psychological View says the *perception* is fuzzy. If you landed on either, ask yourself: Is the fuzziness in the dictionary or in my eyes?

  **Empty Cells (Combinations No One Defends)**
  1.  **Sharp Cutoff + Unknowable + Logic Broken:** (Nodes 4A, 5B, 3B). *Incoherent.* If you accept a sharp fact exists, you don't need to break logic to explain why you can't find it.
  2.  **Degrees + Gaps:** (Nodes 6A, 7A). *Incoherent.* A statement cannot be "half-true" (Degree) and "no-truth-value" (Gap) at the same time.
  3.  **Context Matters + Ban the Word:** (Nodes 8A, 9A). *Unattractive.* If context solves the problem (8A), there is no need to ban the word (9A).

  **Repair Menu (For Inconsistent Answers)**
  If you found yourself insisting that *every* statement is true or false, but also that *removing one grain never makes a difference*, you have hit the classic paradox. You cannot hold both. To repair your view, you must abandon one commitment:

  *   **Option 1: Abandon "One grain never matters."**
      *   *Cost:* You must accept **Epistemicism**. There is a magic grain where the heap vanishes, even if it seems crazy.
  *   **Option 2: Abandon "Every statement is true or false."**
      *   *Cost:* You must accept **Supervaluationism** or **Degree Theory**. You allow that some sentences lack a truth value or come in degrees.
  *   **Option 3: Abandon Standard Logic.**
      *   *Cost:* You must accept **Dialetheism**. You allow contradictions to be true in borderline cases.

  **Note on the Logic Node (Node 3)**
  The two members with logic exposure may spot the *Modus Tollens* structure. If you reject the rule there, you are choosing to save your intuition about heaps at the expense of classical logic. This is a valid philosophical move, but it is expensive: it changes how you reason about everything, not just heaps.

  **A Final Word**
  If you landed on **Unstable/Residual**, congratulations. You have identified the exact tension that makes vagueness a philosophical problem. The goal of this club is not to escape the tension, but to understand why it is so hard to resolve.
