prompt: |-
  I run a reading group, about eight of us, and it's a weird mix: two people do ML full time, the rest are philosophy grad students plus one guy from the law school who has never seen a training loop. We're six weeks into a stretch on agency and this week I've got 90 minutes on wireheading and reward tampering, whiteboard only. What I absolutely don't want to give is a talk about how AI just wants to feel good. So plan how I should teach it — don't teach it to me.

  First, the order, and in particular what has to be on the board before the word "reward" can do any work at all for the philosophers, because I think they'll hear reward as a treat handed out afterwards rather than as the scalar something is continuously being shaped by. Those two readings make completely different topics and I need to know which moves force the switch.

  Second, the carrying case. I made one up, tell me if it holds or throw it out for something better: a warehouse arm gets a reward ping whenever its onboard camera recognises a pallet as correctly stacked. Arm A tapes a photograph of a good stack over the lens. Arm B never touches the lens but learns to only move boxes when the recogniser is confident, so it does 40% of the work for 100% of the reward. Arm C just does the job. All three are maximising the same number, A is the obvious one, C is the obvious one, and B is the entire point — except I don't know how to make B feel like a live question instead of "well, B is just being clever." My own hunch is that the thing to land is that none of the three is distinguishable from inside the agent, but I don't want to just assert that at them, I want the sequence to make it unavoidable.

  Third, the misconceptions and where each one gets headed off in the arc rather than argued down afterwards. I'm expecting: "this is Nozick's experience machine again," someone retelling the rat and the lever as the rat wanting pleasure and getting the signal instead, "just specify the reward properly and the problem goes away," and something about RLHF from the ML two that I can't predict the exact shape of. Tell me which of these are near-misses that land one step short of the point, and name the step, since I'd rather walk them the last inch than contradict them.

  Fourth, one question I can put to the group at the end that seperates the people who got it from the people who are politely nodding.

  Fifth, what I should openly refuse to get into at this level and say I'm refusing — mesa-optimization, the Goodhart taxonomies, the utility-function-vs-reward-channel formalism, whatever else you think is a trap.

  Bottom line first: your opening sentence should be the one-line shape of the whole session — the spine, what carries it, what gets killed and when — and then the reasoning behind that shape. No preamble, and don't restate any of the above back to me.
