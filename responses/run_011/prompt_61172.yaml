          *   *Analysis:* BIL is invoking the classic "static paradox" of self-deception (how can one know the truth to hide it from oneself?). Sister is using the folk-psychological definition.
          *   *Verdict:* BIL has the stronger philosophical/logical point here regarding the *definition*, but Sister has the stronger observational point regarding the *behavior*.

      *   **Move 2 (Sister):** Fine, call it mistake. But then explain the difference between him and someone who simply misread evidence. He rearranges life around the belief, treats anniversary as normal, attacks challengers.
