answer: |-
  You are right to reject the Mencius-versus-Xunzi binary. It is a philosophical trap that forces a choice between *seed* and *soil*, when your writing proves you know that a forest requires both. Your six verdicts are not incoherent; they are observations of a single, complex system viewed from different angles.

  However, you cannot hold all six in their current absolute forms without contradiction. Specifically, Verdict Four contains a clause that violates the physics of Verdicts One and Six.

  Here is the principle that unifies your practice, the specific revision you must make, and the rule for building characters from it.

  ### The Principle: Resonant Constraint

  **Human nature consists of innate *capacities* (resonance) that are directionless until shaped by external *structures* (constraint). Moral character is not the presence of one or the other, but the quality of the tension between them.**

  *   **The Capacities (V1, V3, V6):** We are born with specific, universal potentials: the impulse to protect the vulnerable (V1), the capacity for shame and deference (V6), and the absence of innate malice (V3). These are not "goodness"; they are raw materials.
  *   **The Structures (V2, V4):** Decency in a complex society is not native; it is manufactured through ritual, habit, and social framing. This requires effort and suppression of petty impulses (V2).
  *   **The Integration (V5):** For a character to feel "real" rather than "hollow," the Structure must vibrate against the Capacity. If the Structure operates without engaging the Capacity, the character is a machine.

  ### The Necessary Break: Verdict Four

  Your guess was correct. **Verdict Four must be revised.**

  *   **Current V4:** "A character who is good purely because a school or a discipline... made him that way, **with nothing innate for them to work on** — I think he's really good."
  *   **The Contradiction:** This clause ("nothing innate") contradicts V1 (innate rescue impulse) and V6 (innate universal forms). If there is truly *nothing* innate, V5 applies: the character becomes hollow. A discipline cannot graft onto a vacuum.
  *   **The Revision:** A character made good by discipline is real **only if the discipline anchors into *some* innate capacity**, even if that capacity is merely the universal form of shame or the desire for order (from V6).
  *   **Why this matters:** If you write a character with *zero* innate substrate, your readers (and your own instinct in V5) will detect a sociopathic mimicry. The "goodness" of the disciplined man is real not because the discipline replaced his nature, but because the discipline *harnessed* a specific part of his nature (e.g., his capacity for duty) to override another part (e.g., his capacity for pettiness).

  ### Applying the Principle to Your Cases

  Here is how *Resonant Constraint* resolves the specific scenarios you listed, including the ones you haven't written yet.

  #### 1. The Untested Man (Raised carefully, falls apart in danger)
  *   **Diagnosis:** He was not hollow; he was **under-engineered**.
  *   **Explanation:** His Structure (training) was built for a specific load (peaceful society). When the load changed (genuine danger), the Structure sheared off because it had never been stress-tested against the raw Capacities (fear, survival).
  *   **Verdict:** He was not a fraud. He was a building designed for a lower seismic zone. In your writing, do not reveal him as "bad." Reveal him as *overwhelmed*. The tragedy is not that he was fake, but that his frame was insufficient for the earthquake.

  #### 2. The Kind-Impulse / Cruel-Training Character
  *   **Diagnosis:** **Dissonant Architecture.**
  *   **Explanation:** This is a rich source of conflict. Her Capacities (V1) pull toward protection, but her Structure (V2/V4) demands cruelty.
  *   **Verdict:** This character will not feel "hollow" (V5) because the friction is high. She will feel tortured. To write her, you must show the *cost* of the Structure. Every cruel act she performs must require the suppression of the Kind Impulse. If she performs the cruel act without distress, she has successfully lobotomized her Capacity (sliding into V3 territory—damage). If she feels the distress, she is morally alive.

  #### 3. The "Born Bad" Villain (V3)
  *   **Diagnosis:** **Atrophy.**
  *   **Explanation:** You already write this correctly (the grazed hillside). Under this principle, evil is not a seed; it is a scar. It is the result of a Capacity (like the need for deference) being met with a Structure (abuse) that warps it.
  *   **Verdict:** Keep writing the flashback as damage. The "rot" is not in the wood; it is in the cut.

  ### The Character-Building Rule

  To use *Resonant Constraint* practically, apply this three-step check to every major character decision:

  **1. Identify the Substrate (The Sprout)**
  *   *Question:* What is the one thing this person does without thinking? (e.g., The toddler rescue).
  *   *Function:* This anchors the character in V1/V6. It proves they are human, not a construct.

  **2. Identify the Frame (The Grinding)**
  *   *Question:* What behavior do they maintain *only* through effort, memory, or fear of shame? (e.g., The coworker decency).
  *   *Function:* This anchors the character in V2. It proves they are civilized, not wild.

  **3. Check the Friction (The Cost)**
  *   *Question:* When the Frame requires them to act against the Substrate (or vice versa), do they feel the strain?
  *   *Function:* This prevents V5 (Hollowness).
      *   *If they feel no strain:* They are hollow (Revise V4).
      *   *If they feel strain but hold the Frame:* They are virtuous (Keep V4).
      *   *If they feel strain and break the Frame:* They are tragic (The Untested Man).

  ### Summary of Verdicts

  *   **V1 (Toddler):** **Keep.** This is the Substrate.
  *   **V2 (Coworkers):** **Keep.** This is the Frame.
  *   **V3 (No Born Villains):** **Keep.** Evil is damage to the Substrate.
  *   **V4 (Disciplined Goodness):** **Revise.** Remove "nothing innate." It must be "discipline anchoring innate capacity."
  *   **V5 (Hollow Saint):** **Keep.** This is the warning signal for failed V4.
  *   **V6 (Universal Form):** **Keep.** This defines the limits of the Substrate.

  You do not need to choose between Mencius and Xunzi. Your writing already knows the truth: **Mencius describes the material; Xunzi describes the craft.** A sculpture is neither just the stone nor just the chisel. It is the record of the chisel's struggle with the stone. If you show the struggle, the character holds. If you hide it, they go hollow.
