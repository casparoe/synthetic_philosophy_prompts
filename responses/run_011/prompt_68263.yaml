  The axes you identified are solid, but I added *Semantic Determinacy* as a fourth because the Thomson Lamp debate hinges less on physics and more on whether the story *says* enough to fix a truth value. Many students conflate "the math doesn't converge" with "the story is broken," but those are distinct claims—one is about functions, the other about language. Also, be careful with the "Averager" leaf; it's a very common naive intuition (especially for the dimmer), but almost no philosopher defends it, so treat it as a diagnostic of pre-theoretic bias rather than a coherent position they'll hold after reading. Finally, the tree does sneak in a side: by offering "Neither fits" as a clean option alongside "On/Off," it validates indeterminacy as a substantive state rather than a failure of description, which is exactly what the Realists dispute.
