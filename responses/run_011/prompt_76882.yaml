  | Sentence assent underdetermined. | Phil | 5 | Quine grants stimulus meaning of observation sentences is fixed by concurrent behavior. Indeterminacy enters at theoretical terms, not basic assent. | Holism might leak analytic/synthetic distinction into sentences. |
  | Compositionality requires reference. | Phil | 5 | If terms lack reference, how do sentences have truth conditions? You claim sentences are determinate while terms are not; this violates compositionality. | **Load-bearing wall.** |
  | Embeddings capture reference. | ML | 4 | Embeddings map stimulus correlations, not objects. Vectors align behavioral dispositions across languages, not worldly referents. | Hard to prove vectors aren't surrogate objects. |
  | Proxy functions scramble sentences. | Phil | 4 | Proxy functions operate on terms, systematically preserving sentence truth values. Sentence-level determinacy remains intact despite term-level scrambling. | Requires strict compositionality to hold. |
  | Loss convergence = Truth. | ML | 3 | Convergence shows consistency across runs, not unique reference. Multiple incompatible manuals can minimize loss equally well. | Practitioners equate optima with reality. |
  | Zero-shot proves shared meaning. | ML | 3 | Zero-shot shows shared behavioral dispositions, not shared reference. Models mimic assent patterns without fixing ontology. | Pragmatic success feels like semantic identity. |
  | Why care about reference? [CONCEDE] | ML | 2 | Science requires ontology for explanation, not just prediction. Translation without reference is mere parrotry, useful but not truth-apt. | Might concede utility over truth. |

  **Concession Strategy:** Concede Objection 8 in your intro. Admit models lack ontology but retain utility. This disarms the "parrotry" charge before Q&A and builds trust with ML folks who care about utility over truth. Do not fight the utility point; fight the truth point.

  **The Killer Objection:** Objection 3. If reference is inscrutable, sentence truth conditions lack components. You claim sentences are determinate while terms are not; this violates compositionality. If you can't explain how determinate sentences compose from indeterminate terms, the thesis collapses. This attacks the coherence of your "local indeterminacy" claim. Prepare a holistic reply: sentences are primary, terms are derivatives.
