          *   *Conflict:* If it's a *wrong* to blame hypocritically, then you *do* lack the standing/right to do so in that context. (2) denies standing exists. (3) affirms the functional equivalent of standing (a constraint on who can blame whom).
          *   *Severity:* High. Direct contradiction on the nature of "standing."

      *   **Tension C: (4) vs. (3).**
          *   (3) says hypocrisy treats the target as unequal.
          *   (4) says private self-appallment fixes this ("doing that silently costs you nothing").
          *   *Conflict:* If the wrong in (3) is about *invoking a rule against you that I don't accept for myself*, how does *silent* self-appallment change the external invocation? If I blame you while having sinned, even if I hate myself for it, I am still invoking a rule I am currently breaking. (4) suggests internal attitude cures the external relational wrong. That's shaky.
          *   *Severity:* Medium. It's more about the mechanism of repair.

      *   **Tension D: (5) & (6) vs. (1) & (2).**
          *   (1)/(2) say if the target is at fault, blame is correct/allowed regardless of the blamer.
