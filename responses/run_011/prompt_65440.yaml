      *   So the verdict relies on the *truth* of (4). If (4) is true, User isn't hypocritical. If User isn't hypocritical, Brother's accusation is false.
      *   *Problem:* (4) is very weak philosophically. "Silent self-appallment" rarely cures hypocrisy in the eyes of others.
      *   *Audit finding:* (7) relies on (4) being objectively true and morally sufficient, which is the shakiest part of the system.

      *Let's finalize the "Single Change".*
