  4.  **Drafting the Audit:**

      *   *Structure:*
          1.  Executive Summary (Coherence Check).
          2.  Real Conflicts (Ranked).
          3.  Apparent Conflicts.
          4.  The (7) Specific Analysis (Smuggling Check).
          5.  The Single Best Change.

      *   *Refining the Conflicts:*
