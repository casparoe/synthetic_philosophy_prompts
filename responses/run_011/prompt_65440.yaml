      *   (4) **Confession/Cure:** Confessing to earn standing is "moral theater" (wrong). Private self-appallment is enough; it costs nothing. You don't forfeit standing by sinning if you privately hold the standard.
      *   (5) **Busybodies:** Spotlessly honest strangers commenting on private conduct is *objectionable*. Truth + Faultlessness $\neq$ License.
      *   (6) **Relationship License:** Relationship licenses blame (family, friends, shared projects). Strangers don't get a say.
