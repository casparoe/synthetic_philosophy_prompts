prompt: |-
  I'm trying to write down what an account of emergence has to actually deliver before I trust anyone's claim that X is emergent, and I want the spec, not the candidates. The case driving it: a lab grows sheets of cultured heart cells. One cell fires erratically; a sheet of a million settles into a stable reentrant spiral. Zapping any single cell does nothing to the spiral, but killing 5% of the sheet relocates the spiral's anchor point and it stays there for hours. Nobody can currently derive the spiral from single-cell channel kinetics plus geometry, and the group that simulates it admits they hand-tune a coupling constant to get it.

  Give me the requirements list: what a theory of emergence has to get right about this case and about the concept in general — the distinctions it can't collapse, the verdicts it has to be able to return (including "not emergent, and here's what would show it"), the results from physics or biology it can't contradict — with the consideration behind each, and a mark for which are non-negotiable vs. which are just the hobby of one camp. Tell me which single requirement does the most damage to the popular accounts, and whether any subset is jointly unsatisfiable; I suspect demanding that emergence be gradable and demanding a clean epistemic/ontic cut can't both be met, so argue with me if Im wrong. Crucially: what would count as evidence *against* an emergence claim like the spiral one? If your desiderata can't say, say so plainly — I think that's a hole in most of the literature and I want to know whether it's fixable. Then in a couple of sentences each, how a multiple-realizability-based nonreductive physicalism, a strong emergentist view with real downward causal powers, and the deflationary line that everything is weakly emergent given enough compute time do against the list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **Goal:** Create a specification (requirements list) for a theory of emergence.
      *   **Context:** A specific biological case (cultured heart cell sheets, erratic single cell vs. stable spiral wave, robustness to single-cell zapping, sensitivity to 5% mass kill, inability to derive from first principles without tuning).
      *   **Output:** A list of requirements with considerations, marked as Non-Negotiable (NN) vs. Camp-Specific (CS).
      *   **Critical Analysis:** Identify which requirement damages popular accounts the most. Address the tension between "gradable emergence" and "clean epistemic/ontic cut" (is it unsatisfiable?).
      *   **Falsifiability:** What counts as evidence *against* an emergence claim in this specific case? (Crucial point).
      *   **Evaluation:** Briefly evaluate three specific philosophical positions against the list (Nonreductive Physicalism, Strong Emergentism, Deflationary/Computational Emergence).
      *   **Tone:** Rigorous, analytical, no fluff, "spec sheet" style.

  2.  **Analyze the Case Study (Cardiac Spiral Waves):**

      *   *Micro:* Ion channels, action potentials, cell-to-cell coupling.
      *   *Macro:* Reentrant spiral wave, anchor point, stability.
      *   *Key Features:* Robustness (single cell death $\neq$ spiral death), Sensitivity (5% kill moves anchor), Derivation Gap (can't derive without tuning coupling), Downward Influence (macro state constrains micro behavior).
      *   *Problem:* Is this *real* emergence or just complexity we haven't solved yet?

  3.  **Drafting the Requirements (The Spec):**

      *   *Requirement 1: Distinction from Aggregation.* Mere summation isn't emergence. The spiral isn't just "more beating."
      *   *Requirement 2: Robustness/Invariance.* The macro property persists despite micro perturbations (zapping one cell).
      *   *Requirement 3: Derivability Status.* Can it be derived? If yes, is it trivial? If no, is it impossible or just hard? (The tuning constant issue).
      *   *Requirement 4: Causal Autonomy/Downward Influence.* Does the spiral *do* anything the cells wouldn't do alone? (Anchor point stability).
      *   *Requirement 5: Falsifiability Conditions.* What would prove it *isn't* emergent?
      *   *Requirement 6: Scale/Gradability.* Is emergence a binary switch or a slider?

      *Refining for the "Spec" feel:* Needs to be sharper.
      *   R1: Non-Additivity (The whole $\neq$ sum of parts).
      *   R2: Micro-Insensitivity/Macro-Stability (Robustness).
      *   R3: Derivation Cost/Transparency (The "Hand-Tuning" test).
      *   R4: Causal Exclusion Avoidance (Does the macro cause anything?).
      *   R5: Falsification Criteria (The "Reduction Success" test).

  4.  **Addressing the Tension (Gradable vs. Binary):**

      *   User suspects "gradable emergence" and "clean epistemic/ontic cut" are incompatible.
      *   *Analysis:* If emergence is ontic (real new stuff), it's usually binary (it exists or it doesn't). If it's epistemic (hard to predict), it's gradable (harder vs. hardest).
      *   *Verdict:* The user is right. You can't have a sharp ontic boundary *and* a smooth epistemic gradient without a bridging principle that usually collapses one into the other. I need to argue this clearly.

  5.  **Addressing Falsifiability (The "Hole"):**

      *   Most emergence claims are unfalsifiable because "we just haven't computed enough yet."
      *   *Solution:* Evidence *against* emergence in this case would be a successful *ab initio* derivation without phenomenological tuning constants that predicts the anchor shift *and* the stability threshold precisely. If the micro-theory + geometry predicts the macro without "coupling constants" fitted to macro data, the claim of *ontic* emergence weakens significantly.

  6.  **Evaluating the Three Philosophies:**

      *   *Nonreductive Physicalism (NRP):* Good on multiple realizability, struggles with causal power (exclusion problem).
      *   *Strong Emergentism:* Good on causal power, struggles with physical closure (energy conservation).
      *   *Deflationary/Computational:* Good on consistency, trivializes the concept (everything is emergent if computation is hard).

  7.  **Drafting the Content (Iterative refinement):**

      *   *Requirement 1 (Non-Additivity):* NN. If it sums linearly, it's not emergent.
      *   *Requirement 2 (Robustness):* NN. The spiral survives cell death.
      *   *Requirement 3 (Derivation Transparency):* NN. The "hand-tuning" is a red flag. A theory must explain *why* tuning is needed.
      *   *Requirement 4 (Falsification):* NN. Must specify what reduces it.
      *   *Requirement 5 (Ontic/Epistemic Clarity):* NN. Don't mix them.
      *   *Requirement 6 (Gradability):* CS. Some want binary, some want continuous.

      *Critical Conflict:* The "Derivation Transparency" vs. "Ontic Cut." If we can derive it eventually, was it ever ontically emergent?
      *   *Most Damaging Requirement:* R4 (Falsification). Most theories protect themselves from being proven wrong.
      *   *The Tension:* User is correct. A clean cut implies a threshold. Gradability implies a spectrum. You can have a spectrum of *epistemic* emergence (predictive difficulty) but *ontic* emergence usually demands a binary state (novel causal power exists or doesn't). Trying to have both leads to category errors.

