  *(Self-Correction during drafting)*: I need to be careful with the term "Strong Emergentism." In philosophy of mind, this often implies violation of physical closure. In physics/complexity, it often just means "unpredictable." I should clarify I'm using the philosophical definition (downward causation that isn't reducible) as requested ("real downward causal powers").

  *(Refining the Falsification point)*: The prompt asks what counts as evidence *against*. I need to be specific. It's not just "deriving it." It's deriving it *without phenomenological parameters*. The hand-tuned coupling constant is the weak link.

