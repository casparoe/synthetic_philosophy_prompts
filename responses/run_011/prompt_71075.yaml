answer: |-
  ### The Specification: Requirements for a Theory of Emergence

  This spec distinguishes between **Non-Negotiable (NN)** requirements (any account claiming to describe reality must satisfy these to be meaningful) and **Camp-Specific (CS)** preferences (metaphysical commitments that vary by school).

  #### 1. Non-Additivity & Qualitative Distinction (NN)
  *   **Requirement:** The macro-property ($M$) cannot be expressed as a linear sum or trivial aggregation of micro-properties ($m_1...m_n$). $M$ must exhibit behaviors or predicates inapplicable to $m$.
  *   **Case Application:** A single cell fires or doesn't. The sheet sustains a *spiral geometry* and an *anchor point*. "Anchor point" is a predicate meaningless for a single cell.
  *   **Consideration:** Prevents labeling mere complexity or aggregation as emergence.
  *   **Verdict:** If the spiral is just "many cells firing in sequence," it fails. If the spiral has topological properties (winding number) the cells lack, it passes.

  #### 2. Micro-Insensitivity / Macro-Robustness (NN)
  *   **Requirement:** $M$ must remain stable under specific perturbations of $m$ that do not cross a critical threshold.
  *   **Case Application:** Zapping one cell does not kill the spiral. Killing 5% moves the anchor but preserves the spiral.
  *   **Consideration:** Distinguishes emergent stability from fragile coincidence. Emergence implies a buffer between micro-noise and macro-state.
  *   **Verdict:** The spiral passes. A theory must explain *why* the micro-details are screened off.

  #### 3. Parameter Independence (The "Hand-Tuning" Test) (NN)
  *   **Requirement:** Derivation of $M$ from $m$ cannot rely on phenomenological constants fitted to $M$ itself. The coupling parameters must be measurable at the micro-level independently of the macro-outcome.
  *   **Case Application:** The group hand-tunes a coupling constant to get the spiral. This is a failure of derivation.
  *   **Consideration:** If you tune the micro-rules to match the macro-behavior, you haven't derived emergence; you've encoded it.
  *   **Verdict:** Current simulation fails this. A valid theory must predict the coupling strength from gap-junction chemistry, not spiral stability.

  #### 4. Falsification Conditions (NN)
  *   **Requirement:** The theory must specify what evidence would demonstrate $M$ is **not** emergent.
  *   **Case Application:** Evidence against emergence here would be a successful *ab initio* simulation using *only* independently measured ion-channel kinetics and gap-junction conductances (no tuned constants) that predicts the spiral's anchor shift and stability threshold exactly.
  *   **Consideration:** Most emergence claims are unfalsifiable because they retreat to "we haven't computed enough yet." This requirement forces a deadline on reductionism.
  *   **Verdict:** If the micro-theory + geometry predicts the macro without residue, the claim of *ontic* emergence collapses into *epistemic* complexity.

  #### 5. Causal Accountability (NN)
  *   **Requirement:** The account must specify where the causal power for $M$'s effects resides without violating physical closure (conservation of energy/momentum).
  *   **Case Application:** The spiral anchor dictates cell firing patterns (downward constraint). Does the spiral *force* the cells, or do the cells *constitute* the spiral which simply describes their behavior?
  *   **Consideration:** Avoids "spooky action." Downward causation must be compatible with micro-physical laws.
  *   **Verdict:** If the spiral is claimed to add energy to the system to move the anchor, it fails physics. If it constrains micro-states via boundary conditions, it passes.

  #### 6. Gradability vs. Binary Cut (CS)
  *   **Requirement:** The theory must declare whether emergence is a matter of degree (gradable) or a distinct ontological category (binary).
  *   **Consideration:** Complexity scientists prefer gradable (more or less emergent). Metaphysicians often demand binary (emergent or not).
  *   **Verdict:** **Camp-Specific.** You may choose, but you cannot equivocate.

  ---

  ### Critical Analysis

  #### The Most Damaging Requirement
  **Requirement 4 (Falsification Conditions)** does the most damage to popular accounts.
  Most accounts of emergence (especially in complex systems biology) are shielded by the limit of computation. They claim $X$ is emergent because we *currently* cannot derive it. By demanding a specification of what would count as *reduction* (e.g., "successful prediction without tuned parameters"), you strip the emergentist of the "not yet" defense. If the spec demands that emergence be a permanent feature of the world (ontic) rather than a temporary feature of our knowledge (epistemic), the inability to define the reduction condition renders the claim vacuous.

  #### The Tension: Gradability vs. Ontic Cut
  **You are correct; this subset is jointly unsatisfiable for a single definition.**
  *   **Argument:** If emergence is **ontic** (a real feature of the world, like mass or charge), it is binary. A system either possesses the novel causal power or it does not. There is no "half a causal power."
  *   **Argument:** If emergence is **gradable** (a matter of degree), it is necessarily **epistemic**. It measures the difficulty of prediction, the opacity of the derivation, or the degree of robustness.
  *   **The Conflict:** You cannot have a "sharp ontic cut" that is also "gradable." If you argue for a phase-transition style threshold (where it snaps from non-emergent to emergent), you preserve the ontic cut but lose gradability. If you argue for a spectrum of emergence, you admit it is a measure of descriptive utility, not ontology.
  *   **Conclusion:** Demanding both forces the theory to equivocate between "hard to predict" (epistemic) and "new stuff exists" (ontic). A rigorous spec forces a choice.

  #### Evidence *Against* the Spiral Claim
  To falsify the claim that the spiral is emergent (in the strong/ontic sense):
  1.  **Measure, Don't Fit:** Measure the gap-junction conductance and ion channel kinetics independently of the sheet behavior.
  2.  **Simulate:** Run the simulation using *only* those measured values.
  3.  **Result:** If the simulation produces the exact spiral frequency, anchor stability, and response to 5% ablation *without* adjusting a coupling constant to match the macro-behavior, the emergence claim is demoted to **Weak/Epistemic**. It proves the macro was fully contained in the micro-description, merely obscured by computational complexity. The "emergence" was a lack of computing power, not a feature of nature.

  ---

  ### Evaluation of Philosophical Positions

  **1. Multiple-Realizability Nonreductive Physicalism**
  *   **Performance:** Passes R1 (Non-Additivity) and R2 (Robustness) well; the spiral can be realized in different cell types.
  *   **Failure:** Struggles with R5 (Causal Accountability). It asserts the macro constrains the micro but often cannot explain *how* without overdetermining the micro-causes (the Exclusion Problem). It satisfies the spec but leaves the mechanism of downward constraint vague.
  *   **Verdict:** Safe but mechanistically incomplete.

  **2. Strong Emergentism (Real Downward Causal Powers)**
  *   **Performance:** Passes R5 (Causal Accountability) by asserting top-down power explicitly.
  *   **Failure:** Risks violating physical closure (conservation laws) unless it posits new forces. In the heart cell case, if the spiral "moves" the anchor, Strong Emergentism must explain where the energy comes from without violating the biophysics of the ion channels. It often fails R4 (Falsification) by making the downward power undetectable by micro-measurement.
  *   **Verdict:** High risk of contradicting established physics.

  **3. Deflationary / Computational Emergence (Weak Emergence)**
  *   **Performance:** Passes R4 (Falsification) and R5 (Causal Accountability) perfectly. Everything is emergent if the computation is incompressible.
  *   **Failure:** Fails R1 (Distinction) by trivialization. If *everything* sufficiently complex is emergent, the term loses explanatory power. It turns the heart spiral into the same category as a random number generator, differing only in simulation steps.
  *   **Verdict:** Scientifically safe, philosophically empty.
