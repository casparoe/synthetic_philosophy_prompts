answer: |-
  You have described a specific, documented sociological phenomenon with remarkable precision. You are right to suspect that standard labels like "moral progress" or "persuasion" fail here. You are also right that the dueling analogy is not just adjacent; it is the structural twin of what you are seeing.

  Here is the carving you asked for.

  ### 1. The Mechanism: Reputational Pricing, Not Persuasion
  The mechanism that did the work is **Reputational Pricing**.

  In your OR, the "price" of shouting was previously low (social tolerance, "that's just how he is") and the "price" of objecting was high (being labeled weak, career stagnation). The market shifted. The cost of shouting became reputational suicide (staff loss, referral loss, public shame).

  This is distinct from **persuasion** (changing the mind) and distinct from **bribery** (paying someone to stop). It is **compliance via cost imposition**. The surgeons are not behaving better because they value safety more; they are behaving better because the *tax* on bad behavior exceeded their willingness to pay.

  ### 2. The Vocabulary Check
  You mentioned hearing fragments. Here is how they map to your observation, and where they fall short:

  *   **Preference Falsification (Timur Kuran):** This is the state your staff and surgeons were in for a decade. People publicly supported a norm (silence/tolerance) that privately repulsed them. This explains the *before* and the *retroactive rewriting*, but it doesn't fully explain the *trigger* of the change.
  *   **Pluralistic Ignorance:** This is why your staff said nothing. Everyone hated the shouting, but everyone assumed everyone else was okay with it. The "leak" (techs quitting, public posts) shattered this ignorance.
  *   **Norm Cascade:** This describes the *speed* of the change once the threshold was crossed. But a standard cascade usually implies some internalization. Yours did not.
  *   **Displacement (or Hydraulic Pressure):** This is the migration of aggression to unpoliced channels (chart comments, hallway venting). When you block one outlet for pressure without reducing the pressure itself, it finds the path of least resistance.

  ### 3. The Coined Term: The Dueling Equilibrium
  Since no single existing term captures the *belief-stasis* combined with the *cost-driven behavioral shift* and the *displacement*, I will coin the term you need for your policy work: **The Dueling Equilibrium**.

  **Definition:** A social state where a harmful public behavior is abandoned not because private moral beliefs have changed, but because the external reputational cost of the behavior has exceeded its utility, resulting in public compliance without private acceptance, often accompanied by behavioral displacement.

  **Why this fits:** As you noted, dueling did not end because men suddenly believed violence was wrong. It ended because being known as a duelist got you excluded from the clubs, careers, and marriages that mattered. The *honor* remained in the private belief; the *price* changed in the public square.

  ### 4. Sorting Your Sub-Questions
  You asked which questions are the same wearing different hats. Here is the consolidation:

  **A. The Signaling Cluster (Same Question)**
  *   *The Converts:* "The ones enforcing the new rule hardest are... two guys who used to shout themselves."
  *   *The Memory:* "People who used to say the perfectionist line now say we all saw it coming."
  *   *The Distinction:* These are both **Legitimacy Signaling**. When a norm flips, the most vulnerable people are those with a record of violating it. To prove they belong to the new order, they must enforce it more zealously than the natives. The memory rewrite is the same mechanism: rewriting the past to align with the present is a signal of loyalty to the current regime. It is not necessarily conscious hypocrisy; it is social survival.

  **B. The Structure Cluster (Same Question)**
  *   *The Migration:* "Behavior didn't vanish, it relocated."
  *   *The Rule:* "Our new rule is about visible conduct... none of this touches it."
  *   *The Distinction:* This is **Goodhart's Law** applied to culture. When a measure (visible shouting) becomes a target, it ceases to be a measure of the underlying problem (aggression/disrespect). The migration is evidence that the change was *shallow* regarding belief, but it is also evidence that *any* rule has edges. The distinction matters: if the goal is patient safety, the migration might not matter. If the goal is a healthy workplace, the migration is fatal.

  **C. The Moral Cluster (The Core Question)**
  *   *The Belief:* "Not one person's moral belief changed."
  *   *The Progress:* "Is what happened here moral progress at all?"
  *   *The Distinction:* This is the difference between **Consequentialist Progress** (outcomes improved, patients are safer) and **Virtue Ethics Progress** (people became better). You achieved the former without the latter.

  ### 5. Boundary Cases: Where It Shades Into Something Else
  To use **The Dueling Equilibrium** effectively in policy, you need to know where it stops being this thing and starts being something else.

  *   **Boundary 1: Internalization.** If, after five years of compliance, a new generation of surgeons grows up never seeing shouting and begins to genuinely believe it is wrong, the Equilibrium has dissolved into **Normative Internalization**. The price is no longer needed; the belief has caught up to the behavior. You are not there yet.
  *   **Boundary 2: Hypocrisy.** If the surgeons publicly apologize for shouting but privately reward it in closed sessions (e.g., promoting residents who tolerate abuse), the Equilibrium has rotted into **Institutional Hypocrisy**. The price is only being paid in public currency.
  *   **Boundary 3: Collapse.** If the reputational cost drops (e.g., the hospital system becomes a monopoly and surgeons know they can't be replaced), the behavior will snap back. This proves it was a Dueling Equilibrium, not a moral shift.

  ### 6. The Reverse Mechanism
  You asked if the same mechanism running the other way would produce a norm change everyone would call bad. **Yes.**

  If the reputational cost of *kindness* were to rise (e.g., if efficiency metrics became so brutal that taking time to comfort a patient was punished by administration, and peers mocked "soft" nurses), you would see a **Negative Dueling Equilibrium**. Nurses would stop comforting patients not because they became cruel, but because the price of compassion became too high. The behavior would change, the belief would stay, and the "care" would migrate to unpoliced channels (doing favors off the clock that aren't recorded).

  ### 7. Policy Implications
  You are the Nurse Manager. You have to write the policy. Here is the risk of mislabeling this:

  If you write policy assuming **Moral Progress**, you will write training modules about "empathy" and "respect." These will fail because the surgeons do not believe they need empathy; they believe they need to avoid liability.

  If you write policy assuming **The Dueling Equilibrium**, you will write mechanisms that maintain the *price*.
  *   **Don't** rely on "culture change" initiatives.
  *   **Do** rely on transparent reporting structures that maintain the reputational cost.
  *   **Do** close the displacement channels. If chart comments are the new shouting, chart comments must be policed. If hallway venting is the new shouting, the hallway behavior must be codified.

  ### Summary
  *   **Mechanism:** Reputational Pricing (Cost > Benefit).
  *   **State:** Preference Falsification (Public compliance, private dissent).
  *   **Outcome:** Behavioral Displacement (Hydraulic pressure).
  *   **Term:** **The Dueling Equilibrium**.
  *   **Moral Status:** Consequentialist gain, Virtue stagnation.

  You are not managing a culture that has healed. You are managing a market that has been regulated. Your policy must assume the regulation is the only thing holding the line.
