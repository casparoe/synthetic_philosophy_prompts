  2.  **Analyze the Exam Question & Data:**
      *   **Scenario:** RCT (Randomized Controlled Trial) with 800 students (400 Treatment/Tutoring, 400 Control).
      *   **Intervention:** After-school numeracy tutoring (Tues/Thurs 5-7 PM).
      *   **Post-Treatment Variable (Collider/Mediator/Confounder?):** Evening study workshop (Tues/Thurs 6-8 PM). *Crucial Detail:* The workshop overlaps with the tutoring (5-7 vs 6-8). If you are in tutoring, you physically cannot attend the workshop for the overlapping hour, or it is much harder. This makes workshop attendance a *post-treatment* variable, likely affected by the treatment assignment.
      *   **Data:**
          *   Overall: Treatment (62.5%) < Control (74%).
          *   Workshop Attendees: Treatment (92.5%) > Control (90%).
          *   Non-Attendees: Treatment (55%) > Control (50%).
      *   **Phenomenon:** Simpson's Paradox (reversal of association upon conditioning).
      *   **Causal Structure:**
          *   $Z$ (Random Assignment) $\rightarrow$ $X$ (Tutoring).
          *   $X$ (Tutoring) $\rightarrow$ $Y$ (Pass).
          *   $X$ (Tutoring) $\rightarrow$ $W$ (Workshop Attendance). (Because tutoring overlaps, tutoring *causes* lower workshop attendance).
          *   $W$ (Workshop Attendance) $\rightarrow$ $Y$ (Pass). (Workshop helps passing).
          *   $Z$ is randomized, so no backdoor paths from $Z$ to $Y$ *except* through $X$ and colliders.
      *   **Key Causal Inference Concept:** Conditioning on a post-treatment variable (a mediator or a collider, or simply a variable affected by treatment) introduces bias. Here, $W$ is affected by $X$. Conditioning on $W$ blocks part of the causal effect of $X$ on $Y$ (if $W$ is a mediator) or opens a backdoor path (if $W$ is a collider). In this specific case, since Tutoring *prevents* Workshop attendance (time conflict), $W$ is a descendant of $X$. Conditioning on a descendant of the treatment generally biases the estimate of the total causal effect. The "Overall" comparison preserves randomization. The "Subgroup" comparison breaks randomization because the subgroups are no longer comparable (selection bias).

  3.  **Analyze the Student Response:**

      *   **Part (a): Describe pattern & Explain reversal.**
          *   *Claim:* Overall Control > Treatment, Subgroups Treatment > Control. (Correct).
          *   *Claim:* This is Simpson's paradox. (Correct).
          *   *Claim:* Arises because arms not distributed same way across workshop groups (20% vs 60%). (Correct).
          *   *Claim:* Pass rates differ between groups (90% vs 50%). (Correct).
          *   *Claim:* Control pulled up by high-passing group, Treatment pulled down by low-passing group. (Correct).
          *   *Claim:* Reversal is a weighting artifact/arithmetic. (Correct).
          *   *Assessment:* The student correctly identifies the statistical phenomenon and the arithmetic mechanism (imbalance in subgroup sizes + subgroup outcome differences).
          *   *Missing/Nuance:* Does the student identify *why* the distribution is different? They note it *is* different, but don't explicitly state that the treatment *caused* the difference in attendance (due to time conflict). However, for Part (a), describing the pattern and the arithmetic explanation of Simpson's Paradox is usually sufficient. The causal explanation is more relevant for Part (b).
          *   *Score:* High. Maybe full marks for (a).

      *   **Part (b): Which figures to report? Justify.**
          *   *Claim:* Report workshop-specific figures. (**WRONG**).
          *   *Claim:* Workshop attendance is a confounder. (**WRONG**).
          *   *Claim:* Confounder test: associated with assignment and outcome. (Technically true for confounders, but $W$ is not a confounder here).
          *   *Claim:* Randomization failed to balance factors, so adjust to restore it. (**WRONG**). Randomization worked on *baseline* covariates. $W$ is a post-treatment variable. Randomization does not guarantee balance on post-treatment variables because the treatment affects them.
          *   *Claim:* Program is effective in every subgroup, therefore effective for population. (**WRONG** inference in this context).
          *   *Correct Treatment:* The "Overall" figures (Intent-to-Treat or Average Causal Effect) are the correct ones to report for the effect of *assignment* or the *program* as implemented. Conditioning on $W$ (Workshop) induces selection bias because $W$ is affected by the treatment (Tutoring overlaps with Workshop). By conditioning on $W$, you are comparing different types of students (those who can/will attend evening sessions vs those who don't) across the two arms. In the Treatment arm, only those *not* burdened by tutoring (or who skipped it) attended the workshop. In Control, anyone could attend. This is "post-treatment bias" or "collider bias" (depending on the exact DAG, but definitely post-treatment bias).
          *   *Assessment:* This is a critical failure in causal reasoning. The student treats a post-treatment variable as a pre-treatment confounder. This is the core lesson of causal inference regarding RCTs and mediators/colliders.
          *   *Score:* Low. They identified the paradox but drew the wrong causal conclusion.

      *   **Part (c): Further information?**
          *   *Claim:* Want to know attendance compliance (assigned to tutoring but never attended). (Good point - relates to ITT vs TOT).
          *   *Claim:* Want lottery records to rule out defect in randomization because of the 40-point gap. (**WRONG** reasoning). A 40-point gap in a *post-treatment* variable is expected if the treatment affects that variable. It does not suggest randomization failure. Randomization ensures baseline balance, not post-treatment balance.
          *   *Assessment:* The first point is reasonable (compliance). The second point reveals the fundamental misunderstanding identified in Part (b) (thinking the post-treatment imbalance implies randomization failure).
          *   *Score:* Partial. One good point, one point revealing the misconception.

  4.  **Drafting the Grading & Feedback:**

      *   **Tone:** Constructive, precise, pedagogical.
      *   **Structure:** Score summary, then Part (a), Part (b), Part (c) with specific claim evaluations.
      *   **Key Correction:** Must emphasize the distinction between pre-treatment confounders and post-treatment variables (mediators/colliders). The time overlap (5-7 vs 6-8) is the smoking gun that $X \rightarrow W$.

      *   **Scoring Breakdown:**
          *   **Part (a) [8 pts]:** Student correctly identifies Simpson's Paradox and explains the arithmetic weighting issue. They describe the data accurately. *Score: 7-8/8.* Let's give 8/8 because the prompt asks to describe the pattern and explain the opposite directions (arithmetic explanation). They did this well.
          *   **Part (b) [8 pts]:** Student chooses the wrong estimator (subgroup vs overall) and provides a fundamentally flawed causal justification (treating post-treatment variable as confounder). This is the main learning objective of the unit. *Score: 1-2/8.* Let's go with 2/8 for correctly identifying that there is a choice to be made and attempting a justification, even if wrong. Actually, since the conclusion is the opposite of the correct causal inference principle, maybe 1/8. Let's settle on 2/8 to acknowledge they understood there *was* a conflict to resolve, but the resolution was incorrect.
          *   **Part (c) [4 pts]:** One good point (compliance/ITT), one bad point (randomization check on post-treatment var). *Score: 2/4.*
