answer: |-
  **Total Score: 12 / 20**

  **Part (a): 8 / 8 points**
  **Part (b): 2 / 8 points**
  **Part (c): 2 / 4 points**

  ---

  ### Point-by-Point Comments and Feedback

  #### Part (a) [8 points]
  **Score: 8/8**

  *   **Claim:** "The overall figures and the figures within each workshop group disagree... This is Simpson's paradox."
      *   **Evaluation:** **Correct.** You accurately identified the statistical phenomenon.
  *   **Claim:** "It arises because the two arms are not distributed the same way across the workshop groups... and because pass rates differ sharply between those groups."
      *   **Evaluation:** **Correct.** You correctly identified the two necessary conditions for Simpson's Paradox: (1) imbalance in subgroup sizes across treatment arms, and (2) association between the subgroup variable and the outcome.
  *   **Claim:** "The control arm's overall rate is therefore pulled up by having most of its students in the high-passing group... The reversal is a weighting artifact..."
      *   **Evaluation:** **Correct.** Your arithmetic explanation for the reversal is precise. You correctly noted that the overall mean is a weighted average of the subgroup means, and the weights differ significantly between arms.

  **Comment:** This is an excellent statistical description of the data. You fully earned the points for this section by correctly diagnosing the paradox and explaining the mechanical reason for the reversal.

  #### Part (b) [8 points]
  **Score: 2/8**

  *   **Claim:** "The district should report the workshop-specific figures."
      *   **Evaluation:** **Wrong.** The correct treatment is to report the **overall** figures (the Intent-to-Treat estimate).
      *   **Correction:** In a randomized trial, the overall comparison preserves the benefits of randomization. The workshop-specific figures introduce **post-treatment bias**. Because the tutoring program (5:00–7:00 PM) overlaps with the workshop (6:00–8:00 PM), assignment to tutoring *causes* a reduction in the ability to attend the workshop. Therefore, workshop attendance is a descendant of the treatment, not a pre-treatment confounder. Conditioning on it blocks part of the causal pathway or induces selection bias, rendering the subgroups non-comparable.
  *   **Claim:** "Workshop attendance is associated both with assignment... and with the outcome, and that is the standard test for a confounder..."
      *   **Evaluation:** **Partially Correct / Misapplied.** While it is true that a confounder must be associated with both assignment (in observational studies) or cause assignment (in structural terms) and the outcome, association alone does not make a variable a confounder.
      *   **Correction:** A confounder must be a *cause* of the treatment assignment (or share a common cause with it) and a cause of the outcome. Here, the treatment assignment causes the workshop attendance (due to the schedule conflict). This makes it a **mediator** or a **post-treatment variable**, not a confounder.
  *   **Claim:** "Randomization is supposed to balance factors of this kind between the arms, so its failure to do so here means the overall comparison is not the comparison randomization was designed to deliver..."
      *   **Evaluation:** **Wrong.** Randomization guarantees balance on **baseline** (pre-treatment) covariates in expectation. It does *not* guarantee balance on variables that are affected by the treatment.
      *   **Correction:** The 40-point gap in workshop attendance is an *effect* of the treatment, not a failure of randomization. The overall comparison *is* the comparison randomization was designed to deliver (the Average Causal Effect of assignment). Adjusting for the workshop attendance destroys the randomization, it does not restore it.
  *   **Claim:** "...therefore effective for the population as a whole."
      *   **Evaluation:** **Wrong.** Because the subgroups are not causally comparable (the "non-attendees" in the treatment group are different from the "non-attendees" in the control group because the *reason* for non-attendance differs), you cannot simply aggregate the subgroup effects to claim population-wide effectiveness.
  *   **Missing for Full Credit:** A full-credit answer would identify that workshop attendance is a **post-treatment variable** (specifically, affected by the time conflict). It would argue that conditioning on post-treatment variables introduces bias (often called "collider bias" or "selection bias" in this context). It would conclude that the **overall** difference (62.5% vs 74%) is the unbiased estimate of the causal effect of the program assignment, even if that effect is negative.

  **Comment:** This section contains a fundamental misunderstanding of causal structure. You treated a variable affected by the treatment ($W$) as if it were a pre-existing confounder. In causal inference, we never condition on post-treatment variables when estimating the total effect of an intervention. Because the tutoring overlaps with the workshop, the tutoring *causes* lower workshop attendance. By comparing only workshop attendees, you are comparing control students (who could attend freely) with treatment students (who managed to attend despite the conflict). These are not comparable groups.

  #### Part (c) [4 points]
  **Score: 2/4**

  *   **Claim:** "I would want to know how many students in each arm were assigned to tutoring but never attended..."
      *   **Evaluation:** **Correct.** This is relevant for distinguishing between the Intent-to-Treat (ITT) effect and the Treatment-on-the-Treated (TOT) effect. Compliance is always relevant information in an RCT.
  *   **Claim:** "I would also want the lottery records: a forty-point gap in workshop attendance between two randomly assigned arms is large enough that I would want to rule out a defect in the randomization itself."
      *   **Evaluation:** **Wrong.** As noted in Part (b), this gap is expected because the treatment affects attendance.
      *   **Correction:** You do not need to check lottery records to explain imbalance in a *post-treatment* variable. Randomization ensures baseline balance, not post-treatment balance. Investigating the lottery records would not explain the gap; the schedule conflict explains the gap.
  *   **Missing for Full Credit:** A full-credit answer might ask about **baseline covariates** (e.g., prior math scores) to confirm randomization worked on pre-treatment factors. Alternatively, it might ask about the **mechanism** of the overlap (e.g., "Were tutoring students explicitly forbidden from attending the workshop?") to confirm the causal direction between tutoring and workshop attendance.

  **Comment:** You earned half credit here. The question about compliance is excellent and shows good thinking about implementation. However, the request to check randomization records based on post-treatment imbalance reveals the same conceptual error from Part (b): the assumption that randomization must balance all variables, rather than just baseline variables.

  ---

  ### Summary for the Student
  You have a strong grasp of the statistical mechanics of Simpson's Paradox (Part a). You correctly identified the weighting issue and the arithmetic reversal. However, your causal analysis (Part b) inverts the correct inference. In causal inference, **timing and directionality matter**. Because the tutoring program physically overlaps with the workshop, the program *causes* changes in workshop attendance. This makes workshop attendance a **post-treatment variable**, not a confounder.

  **Key Takeaway:** In a Randomized Controlled Trial, you generally report the **overall** comparison (Intent-to-Treat). Do not adjust for variables that are affected by the treatment, even if they are imbalanced. Adjusting for them breaks the randomization and introduces bias. The imbalance in workshop attendance is a *result* of the program, not a flaw in the study design.
