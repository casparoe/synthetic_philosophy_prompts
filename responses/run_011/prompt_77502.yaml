      *Refining Case A:* If it's a game, Good's theorem doesn't apply directly because the "state" includes the other player's move which depends on your move/info. This is the "Value of Information in Games" literature (sometimes negative). I should mention this.

      *Refining Case B:* Dilation is the specific technical term. I should use it.

      *Refining the "Concession":* The user worries that "model the info generation" makes the theorem trivial. I need to argue it makes it *robust*, not trivial, provided the modeling cost isn't the issue.

