      *Wait, one nuance on Case A:* The user says "recipient does not observe the choice rule." If the rule is unobserved, it is a hidden variable. A Bayesian puts a prior on it. If the Bayesian integrates over the prior, Good's theorem holds *for the joint distribution*. The only way to lose is if the Bayesian *fails* to put a prior on it (ignores the selection effect). That is a coherence failure. So Case A is a coherence failure, not a theorem failure. *However*, if the "rule" is determined by an adversary *after* seeing the agent's strategy, that's Game Theory. I need to distinguish "Unknown Fixed Rule" vs "Adversarial Adaptive Rule." The prompt implies "choice depends on the state," which sounds like a fixed strategy by the sender, just unknown. If unknown, it's uncertainty. If the sender optimizes against the receiver, it's a game. I will address both.

