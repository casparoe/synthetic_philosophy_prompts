answer: |-
  You have identified a methodological pathology that is endemic to interdisciplinary work between paleoclimatology and archaeology, yet it lacks a single, settled label. You are correct that existing concepts like "false precision" or "post hoc ergo propter hoc" fail to capture the specific mechanics of what you are describing. The issue is not that the numbers are wrong, but that the *ontology of time* differs between the records, and the record with the sharper ontology is granted causal priority by default.

  There is no single Latin term or universally agreed-upon phrase for this specific configuration. However, the three versions you describe map onto distinct but related concepts in chronometry, statistics, and the philosophy of science. Below is an analysis of the existing terminology, where it falls short, and a proposal for how to conceptualize the unified phenomenon.

  ### 1. Mapping the Three Versions to Existing Concepts

  **Version 1: The Resolution Mismatch (Sharp Natural vs. Blunt Social)**
  *   **Nearest Concept:** *Asymmetric Uncertainty* or *Resolution Bias*.
  *   **The Shortfall:** These terms describe the data state but not the inferential leap. In statistics, this touches on *errors-in-variables* models, where one variable is treated as fixed (the ice core) and the other as stochastic (the radiocarbon), leading to biased regression. In archaeology, this is often discussed under **"Chronological Mismatch,"** but that phrase is too passive. It implies a failure of alignment rather than an active manufacturing of sequence.
  *   **Philosophical Root:** This is a specific form of **Underdetermination**. The data underdetermines the sequence (many orderings are possible within the error bars), but the *precision asymmetry* forces a determination.

  **Version 2: The Circular Dating (Tephra as Date and Cause)**
  *   **Nearest Concept:** *Circular Reasoning* or *Tautology*.
  *   **Specific Term:** **"Chronological Circularity"** or **"Tautological Dating."**
  *   **The Shortfall:** This is the most easily named of the three. However, in practice, it is often masked as "cross-dating." The specific sin here is treating a *correlative marker* (the tephra) as an *explanatory agent* (the eruption) without independent evidence that the eruption caused the disruption visible in the stratigraphy.
  *   **Distinction:** This is logically distinct from Version 1. Version 1 is a bias of inference; Version 2 is a flaw in experimental design.

  **Version 3: The Binning Sensitivity (MAUP/MTUP)**
  *   **Nearest Concept:** **The Modifiable Temporal Unit Problem (MTUP).**
  *   **The Fit:** This is the exact statistical term for Version 3. Just as the Modifiable Areal Unit Problem (MAUP) describes how spatial aggregation changes correlation, MTUP describes how temporal binning or smoothing windows create or destroy relationships in time-series data.
  *   **The Shortfall:** MTUP is a statistical property. It does not capture the *narrative* consequence you describe: that the choice of bin width is often driven by the desire to align with the high-resolution natural record, thereby privileging the environmental driver.

  ### 2. The Unified Phenomenon: Is there a name?

  There is no settled term that encompasses all three versions as a single causal logic. However, in recent critiques of "climate archaeology" (particularly regarding the 4.2k BP event), scholars like Nick Brooks, Graham Philip, and others have gestured toward this without naming it.

  If a term is required to carve out this specific space, the most accurate descriptor is **Asymmetric Chronological Constraint**.

  However, to capture the *causal* implication you highlight (that the sharp record becomes the cause *because* it is sharp), I propose the term **Resolution-Induced Causal Ordering (RICO)**.

  **Definition:** *Resolution-Induced Causal Ordering occurs when a causal sequence is inferred between two events primarily because the chronological uncertainty of the putative cause is significantly lower than that of the putative effect, allowing the former to be positioned as antecedent within the error distribution of the latter, despite the data permitting simultaneity or reverse causality.*

  **Why this distinguishes it from ordinary sins:**
  *   **Vs. False Precision:** False precision claims a date is `1200 BC` when it is `1200 ± 100`. RICO accepts `1200 ± 100` but treats a concurrent event dated `1201 ± 1` as the *anchor*, forcing the `1200` event to be "after."
  *   **Vs. Post Hoc:** Post hoc assumes causation from sequence. RICO *manufactures* the sequence from precision.
  *   **Vs. Correlation:** Correlation implies simultaneity. RICO insists on directionality derived from the *texture* of the time records, not the events themselves.

  ### 3. The Common Structure

  The common structure across your three versions is **Epistemic Privilege of the Natural Record.**

  1.  **Ontological Inequality:** The natural record (ice, tree rings) is treated as having "real" time (calendar years), while the social record (radiocarbon, ceramics) is treated as having "fuzzy" time (probability distributions).
  2.  **Anchoring:** The "real" time is used as a fixed anchor point.
  3.  **Absorption:** The "fuzzy" time is stretched or shifted to accommodate the anchor.
  4.  **Narrative Collapse:** The uncertainty of the social record is acknowledged in the data section but collapsed in the discussion section, where the sequence is presented as a historical fact.

  ### 4. The Genuine Non-Instance

  You asked for a description of a case where a sharp natural record and a blunt social record are legitimately combined, and the causal direction is *earned*. This is the critical boundary condition.

  A genuine non-instance of Resolution-Induced Causal Ordering requires **Independent Chronological Tightening** or **Probabilistic Sequence Testing**.

  **Scenario A: Independent Tightening**
  The social event is dated *without reference* to the natural event, using a method that narrows the social window to approach the natural resolution.
  *   *Example:* A settlement abandonment is dated not just by bulk radiocarbon (century resolution) but by dendrochronology on the last construction timbers or a tight seriation of imported ceramics with known historical dates. If the social termination date is independently resolved to a decade, and the volcanic event is a specific year, and the social date consistently follows the volcanic date across multiple sites, the causal ordering is not an artifact of resolution mismatch.

  **Scenario B: Bayesian Probability of Sequence**
  The paper does not assert "Eruption then Abandonment." Instead, it uses Bayesian chronological modeling (e.g., OxCal) to calculate the *probability* of the sequence.
  *   *The Test:* The model treats both the eruption and the abandonment as probability distributions. It calculates the percentage of iterations in which the eruption precedes the abandonment.
  *   *The Non-Instance:* If the model shows that in only 60% of iterations the eruption precedes the abandonment, but the paper claims a causal link, it is RICO. If the model shows 95%+ probability *despite* the wide social error bars (perhaps because the social event is tightly bounded *after* the eruption by other constraints), the causal direction is earned.
  *   *Crucially:* A genuine instance must report the **Overlap Probability**. If the 95% confidence interval of the social change encompasses the natural event, the paper must explicitly discuss the possibility of simultaneity or pre-existing decline.

  ### 5. Summary for Refereeing

  When you encounter this in review, you are likely seeing **Asymmetric Chronological Constraint** masquerading as historical sequence.

  *   **If it is Version 1:** Ask the authors to model the sequence probabilistically. Ask: "Does the social probability distribution *exclude* the possibility of pre-eruption decline, or does it merely encompass the eruption?"
  *   **If it is Version 2:** Flag the **Tautological Dating**. The tephra provides a *terminus post quem* or *ante quem*, not a cause. The cause must be argued via material evidence of destruction (ash fall, seismic damage), not just temporal coincidence.
  *   **If it is Version 3:** Demand an **MTUP Sensitivity Analysis**. Show the correlation at 50-year, 100-year, and 200-year bins. If the relationship vanishes at a different resolution, the causal claim is unsupported.

  The phenomenon you describe is the **reification of methodological asymmetry**. It is the moment where the superior clock of the natural sciences is allowed to dictate the history of the social sciences, not because the history happened that way, but because the clock ticks louder.
