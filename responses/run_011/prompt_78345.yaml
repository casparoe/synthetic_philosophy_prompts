      *   *Correction on Cryonics:* Does cryonics *require* Psychological Continuity? Strictly, it requires *Reconstructability*. You could be a "Soulist" who believes the soul stays with the brain structure. But practically, it aligns with Patternism. I should emphasize the distinction between *Identity* and *Evidence of Identity*. Cryonics assumes the evidence *is* the identity.
      *   *The PVS Surrogate Point:* This is crucial. The law allows the *dead* (psychologically) person's wishes to kill the *living* (biologically) body. This implies the *Psychological Person* has property rights over the *Biological Organism*. This actually aligns slightly with Cryonics (Psych > Bio), but the timing is reversed.
