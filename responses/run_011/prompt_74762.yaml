answer: |-
  **TO:** The Rules Committee
  **FROM:** The Chair
  **DATE:** [Current Date]
  **SUBJECT:** Opinion on the Validity of Amendment 214 and Proposed Amendment 215

  **1. RECOMMENDATION AND DISPOSITION**

  The Committee should certify Amendment 214 in **severed part**.

  **Instructions to the Secretary:** Enter Rule 111 into the official rulebook effective immediately. Do not enter Rule 118 or Rule 119. Mark them as "Declared Void by Committee Determination under Rule 106."

  **Instructions to the Chair:** At the next general meeting, announce that Rule 111 is now binding law: no member may be removed or deprived of a vote except at their own written request. State clearly that Rules 118 and 119 are void because they conflict with the fundamental amendment framework. Consequently, Rule 111 remains subject to the standard amendment process in Rule 101.

  **2. THE SCOPE OF RULE 101**

  The petition argues that Rule 101 confers a power to amend, not a power to withdraw that power from future members. I accept this argument in part, but refine it.

  Rule 101 grants the membership the power to change the text of the rules. It is silent on whether those changes can limit future changes. However, Rule 104 states: "These rules may be amended in no other way." This implies that *all* rules are amendable via Rule 101. If a rule were unamendable, Rule 104 would be false regarding that rule.

  Therefore, I reject the argument that Rule 101 excludes entrenchment by silence. Silence is not exclusion. However, I accept the argument that a body exercising a conferred power cannot use that power to destroy the source of the power. Rule 118 attempts to remove Rule 111 from the scope of Rule 101. This creates a conflict between Rule 104 (all rules amendable via 101) and Rule 118 (Rule 111 is not amendable).

  **3. THE PARADOX OF SELF-REFERENCE**

  We must grapple directly with whether Rule 118 can protect itself. Rule 118 states it cannot be amended, "including by any amendment of Rule 118." This is a logical lock. If valid, it freezes Rule 111 and itself forever.

  However, Rule 119 attempts to enforce this by declaring future amendments void. Rule 119 is itself a rule. Under Rule 101, Rule 119 could be repealed by a future two-thirds vote. If Rule 119 can be repealed, it cannot validly declare future repeals void. If it cannot be repealed, it contradicts Rule 104.

  We cannot have a rulebook where some rules are more real than others. Rule 106 gives us the authority to resolve this conflict. We must choose between a rulebook that functions indefinitely (continuing power) and one that can freeze (self-embracing power). I rule that the Society's continuity depends on the continuing power. A rule that claims to be immune from the amendment process contradicts the definition of a "rule" in this society, which is a provision subject to Rule 101.

  Therefore, Rule 118 is void for conflicting with Rule 104. Because Rule 118 is void, Rule 119 has no substantive breach to police and is also void. The severability clause in 214 saves Rule 111, which stands on its own merits.

  **4. THE MEMBERSHIP FORM**

  The petition notes that nine members joined recently and did not sign the founding documents. They signed the membership form agreeing to be bound by rules "as amended from time to time."

  Does this clause validate Rule 118? I rule that it does not carry the weight the proponents desire. The phrase "as amended from time to time" presupposes the existence of the amendment process. It means members agree to the rules resulting from Rule 101. It does not mean members agree to the abolition of Rule 101 regarding specific rights.

  When a new member signs, they join the *game*. The game is defined by the ability to change rules. If the rules change to prevent further change, the nature of the game changes fundamentally. A member agrees to the *system* of rules, not to a specific future outcome that locks the system. To interpret "as amended" as allowing the termination of the amendment power would render the membership agreement meaningless, as there would be no standard "rules" to agree to, only the whim of a past majority.

  **5. FUTURE STANDARD AND AMENDMENT 215**

  To guide future Committees, I establish the following standard: **An amendment is valid only if it leaves the amendment power intact.** A proposal may change any substantive right or procedure, provided it does not prevent the membership from using Rule 101 to change it back.

  We apply this standard to Amendment 215, which proposes to repeal the entire rulebook and vest all authority in a single arbiter.

  Amendment 215 fails this standard. By repealing the rulebook, it repeals Rule 101 and Rule 104. By vesting authority in a single arbiter, it removes the two-thirds vote requirement. This does not amend the rules; it dissolves the current Society and creates a new entity. Rule 104 permits amendment, not dissolution by majority vote.

  Therefore, Amendment 215 is out of order. If it passes the vote, the Committee will declare it void under Rule 106 for contradicting Rule 104. The membership may vote to dissolve the Society, but that requires unanimous consent or a specific dissolution clause, neither of which exists. They may not use the amendment power to end the amendment power.

  **CONCLUSION**

  We certify Rule 111 to honor the will of the twenty-four members who seek protection from expulsion. We void Rules 118 and 119 to honor the will of the Society to remain a game of Nomic. We protect the members' rights without surrendering the members' sovereignty.

  This preserves the game for the next nineteen years.
