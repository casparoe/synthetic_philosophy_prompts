  Here is the principle that reconciles your seven verdicts, followed by the diagnosis of where your intuition is likely leading you astray.

  ### The Principle: Super-Linear Critical-Level Convex Utilitarianism

  **The Functional Form:**
  The value $V$ of a population $P$ consisting of $N$ persons is given by:

  $$ V(P) = N^{\alpha} \times \left[ \frac{1}{N} \sum_{i=1}^{N} \int_{0}^{T_i} \phi(w_i(t)) \, dt \right] $$

  Which simplifies to:
  $$ V(P) = N^{\alpha - 1} \sum_{i=1}^{N} \int_{0}^{T_i} \phi(w_i(t)) \, dt $$

  **The Parameters:**
  1.  **$\alpha > 1$ (Population Super-Linearity):** The value of a population grows slightly faster than the number of people in it. This captures the intuition that a world with more people is not just a sum of parts, but gains a "social" or "existence" multiplier.
  2.  **$\phi(w)$ (Convex Transformation):** $\phi(w) = (w - C)^k$ for $w \ge C$, and $\phi(w) = -\lambda |w - C|^k$ for $w < C$.
      *   **$C \approx 30$ (Critical Level):** The threshold for a life contributing positive value.
      *   **$k \approx 2$ (Convexity):** Momentary welfare has increasing marginal value. A year at 100 is worth more than two years at 50.
      *   **$\lambda \gg 1$ (Negative Penalty):** Welfare below zero (or below $C$) incurs a disproportionate penalty.

  ---

  ### How It Captures Your Verdicts

  *   **Case 1 (Repugnant Conclusion):** 10B @ 1 vs 100M @ 100.
      *   *Mechanism:* $C$ and $\lambda$. Lives at level 1 are below $C$. $\phi(1)$ is negative. 10 billion negative lives, even with the $N^{\alpha}$ boost, cannot outweigh 100 million highly positive lives (where $\phi(100)$ is large due to convexity $k$).
      *   *Verdict:* 100M @ 100 wins.

  *   **Case 2 (Quantity vs Quality):** 100M @ 100 vs 150M @ 70.
      *   *Mechanism:* $\alpha$. The integral of welfare is lower for the 150M group (due to $k=2$), but the $N^{\alpha-1}$ term boosts the total value of the larger population enough to overtake the quality loss.
      *   *Verdict:* 150M @ 70 wins.

  *   **Case 3 (The Negative Life):** 100 @ 99 + 1 @ 90 vs 100 @ 100 + 1 @ -1.
      *   *Mechanism:* $\lambda$ and $N$. $N$ is identical (101), so $\alpha$ cancels. We compare sums. The penalty $\lambda$ on the -1 life is so severe it outweighs the small convexity loss of dropping 100 people from 100 to 99.
      *   *Verdict:* Opt 1 wins. (Your grad students miss the non-linear penalty $\lambda$).

  *   **Case 4 (Length vs Quality):** 1000 people, 80y @ 100 vs 120y @ 70.
      *   *Mechanism:* $k$ and constant $N$. Since $N$ is constant, $\alpha$ cancels. We compare integrals. Due to convexity ($k=2$), $80 \times 100^2 > 120 \times 70^2$ (800,000 vs 588,000).
      *   *Verdict:* 80y @ 100 wins.

  *   **Case 5 (Extension):** 80y @ 100 vs 80y @ 100 + 40y @ 70.
      *   *Mechanism:* Additivity of the integral. The second option strictly contains the first plus positive value.
      *   *Verdict:* Extension wins.

  *   **Case 6 (Shape):** Flat 50 vs Hill 20-80.
      *   *Mechanism:* Convexity ($k > 1$). By Jensen's Inequality, the average of the squares is greater than the square of the average. The peak adds disproportionate value.
      *   *Verdict:* Hill wins.

  *   **Case 7 (Critical Level):** Add @ 5 (Neutral) vs Add @ 55 (Good).
      *   *Mechanism:* $C$. If $C \approx 30$, $\phi(5)$ is negative. However, if the negative value is small, it might be treated as "neutral" in rough comparison, or we set $C$ higher (e.g., 50). If $C=50$, $\phi(5)$ is negative, $\phi(55)$ is positive.
      *   *Verdict:* Matches threshold intuition.

  ---

  ### The Illusion: Which Verdict to Overturn

  **Case 2 is the illusion.**

  You should overturn the verdict that *150 million lives at 70 is better than 100 million lives at 100*.

  **Why:** The parameter $\alpha$ (Super-Linearity) is the most metaphysically suspect component of the principle. It asserts that the *fact* of there being more people generates value independently of their experiential content, enough to offset significant quality losses. While this saves your intuition in Case 2, it creates a fragile bridge between "People" and "Time."

  In Case 4, you rightly recognize that more *time* at lower quality is not better than less *time* at high quality (due to convexity). There is no principled reason why more *people* should be treated differently than more *time* if the welfare experience is identical. A life is a sequence of moments in time; a population is a sequence of lives. If convexity makes time quality matter more than quantity, it should make life quality matter more than population quantity.

  Case 2 is likely a cognitive bias: "150 million" sounds impressively large in a way that "120 years" does not. You are reacting to the magnitude of the number, not the ethics of the trade-off. If you drop $\alpha$ (set $\alpha = 1$), Case 4 and Case 2 align (both favor the higher quality option), and the principle becomes more robust, even if it contradicts your current Case 2 intuition.

  ---

  ### The New Case: The Ecstatic Minute

  **The Case:** $10^{12}$ people living 1 ecstatic minute (Level 100) vs. $10^9$ people living 80 years at Level 70.

  **Running the Principle:**
  1.  **Group A (Minute People):** $N = 10^{12}$. Welfare Integral per person is tiny ($\approx 0$).
  2.  **Group B (Long Lives):** $N = 10^9$. Welfare Integral per person is large ($80 \times \phi(70)$).
  3.  **The Calculation:**
      *   Value A $\approx (10^{12})^{\alpha} \times \text{Tiny}$.
      *   Value B $\approx (10^9)^{\alpha} \times \text{Large}$.
      *   Ratio of $N^{\alpha}$: $(1000)^{1.7} \approx 130,000$.
      *   Ratio of Integrals: 80 years is $\approx 42$ million minutes. The integral ratio is roughly $42,000,000 : 1$ (favoring Group B).
      *   **Result:** The Integral ratio (42 million) overwhelms the Population Boost (130,000).
      *   **Verdict:** **The Billion Long Lives (Group B) are better.**

  **How do I know this isn't just the principle giving the answer it was built to give?**
  Because the principle was calibrated on Case 2, where the population ratio was only 1.5x. In that context, $\alpha$ was strong enough to flip the verdict. In this New Case, the population ratio is 1000x, but the *time* ratio is 42,000,000x. The principle does not blindly favor population; it weighs the $N^{\alpha}$ boost against the welfare integral. Here, the welfare deficit of a one-minute life is so catastrophic (it is barely a life) that even the super-linear population bonus cannot rescue it. This suggests the principle has genuine predictive power beyond its calibration points: it respects the "Minimum Threshold of a Life" implicit in the integral.

  ---

  ### Where I Am Most Likely Wrong

  **The Vulnerability:** I am treating **Case 3** as solid data when it is likely the source of the $\lambda$ (Negative Penalty) parameter, which is the most unstable part of the function.

  **Why:** Your grad students call Case 3 incoherent because it violates **Transitivity** or **Dominance** in standard aggregation. You prefer Opt 1 (Total Welfare $\approx 9990$) over Opt 2 (Total Welfare $\approx 9999$). This implies a lexical priority to avoiding negative welfare.
  However, if $\lambda$ is high enough to save Case 3, it risks making *any* population with a single suffering person worse than a population of happy people, regardless of size. This leads to a "Sadistic Conclusion" where we might avoid adding a billion happy people because doing so might statistically guarantee one unhappy person.

  **The Collapse:** If you lean on Case 3, you force $\lambda$ to be near-infinite. If $\lambda$ is near-infinite, Case 1 becomes trivial (any negative life ruins the world), but Case 7 becomes hard to manage (is level 5 negative enough to trigger $\lambda$?).
  I suspect **Case 3 is the confused verdict**. You are reacting to the *symbolism* of the -1 life ("a life not worth living") rather than the arithmetic. In a real-world context, avoiding a -1 life at the cost of 100 units of high-quality welfare is likely not the rational choice if the -1 life is short or isolated. You find it compelling because "Negative Welfare" triggers a deontological alarm bell that "Lost Positive Welfare" does not, but in a consequentialist framework (which this seminar assumes), the alarm bell is an illusion.

  **Summary:**
  1.  **Principle:** Super-Linear Critical-Level Convex Utilitarianism.
  2.  **Illusion:** Case 2 (Quantity should not beat Quality for people if it doesn't for time).
  3.  **New Case:** Billion Long Lives win (Time integral outweighs Population boost).
  4.  **Weak Point:** Case 3 (The lexical avoidance of negative welfare is likely an emotional heuristic, not an ethical axiom).
