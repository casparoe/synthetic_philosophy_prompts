prompt: |-
  I am a novelist — four books, the last of them a family saga told from inside five heads — and for the past twelve years I have also taught a graduate fiction workshop and done two paid manuscript assessments a month for a literary agency. The two jobs have converged on a single problem, which I should like your help solving properly. Week after week I find myself writing some version of the same note in the margin of someone's pages: *she doesn't want it enough*; *the motive is asserted rather than earned*; *he does this because the plot requires him to*. I have come to distrust these formulations, because I now think they cover at least three quite different complaints that call for quite different remedies: that nothing in the character's actual psychology leads to the action; that such a path exists but the text has failed to show it; and that I simply disapprove of the character's motives and would prefer he had better ones. I want a diagnostic procedure that will let me tell those apart before I write anything down.

  The theory I want it grounded in is the internal/external reasons distinction — Williams's argument that a claim of the form "A has a reason to φ" is made true, when it is true at all, by something in A's own subjective motivational set together with whatever a sound deliberative route from that set would reach (including correcting A's false beliefs, imagining what A has not imagined, weighing consequences A has not weighed), and that the contrary way of speaking — insisting that someone has a reason he cannot feel, as when Williams's own illustration, if I recall it correctly, is borrowed from Henry James and involves a young man whose family maintains he has every reason to take up the military career he loathes — is doing something other than reporting a fact of the same kind. Please build me a procedure a working critic can actually run: an ordered set of questions to ask of a passage in which a character acts, what in the text counts as a sufficient answer to each, what a failure at each step licenses me to say, and where the procedure stops and hands the decision back to the writer because what remains is a question of what the book is for rather than of whether the motive is there. I want two layers in the deliverable — the reasoning behind each step, for my own use, and a single plain-sentence marginal comment for the student or the client, who has not read any philosophy and should not have to. It must be runnable in about twenty-five minutes per manuscript, and it must not need me to consult a bibliography; if the thing ever becomes an essay I will supply references myself.

  Then run it on three cases and show me the notes it produces. First, a student story in which a woman walks out on two small children in a single paragraph, and the workshop's instinct is that the departure is unmotivated, while my own hunch is that a deliberative route exists through imagination and through a belief of hers that is simply false. Second, a client's manuscript in which a man remains in a dead marriage for two hundred pages, and I want to write that he has reason to leave — I expect your procedure to tell me this is the wrong note to write, and I would rather it did so bluntly, since a rule that only confirms my prejudices is worth nothing to me. Third, a narrator whose subjective motivational set is genuinely thin — a six-year-old, or a character well into dementia — where the procedure may not be able to run at all, and should say so rather than manufacture a verdict.

  Finally, two things I will hold you to. Be explicit about which steps are judgment calls wearing the uniform of procedure, and about what the procedure cannot do even when it works: it can tell me whether a motive exists on the page, not whether that motive is interesting, and I assume it has nothing to say about the deliberate withholding that makes some fiction better than others. And tell me how confident you are that what you have built preserves the distinction as it is actually drawn rather than a tidier version of it; single out the one step where you are least sure you have not quietly substituted something more convenient, and note where your procedure leans on a contested reading — in particular, how far the sound deliberative route can be stretched before the notion stops doing any work.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Persona:** Experienced novelist (4 books, including a complex family saga), graduate fiction workshop instructor (12 years), paid manuscript assessor for a literary agency.
      *   **The Problem:** Overuse of vague feedback like "she doesn't want it enough" or "motive is asserted." The user suspects this covers three distinct issues:
          1.  No psychological path to action (internal void).
          2.  Path exists but isn't shown (external gap).
          3.  Assessor disapproves of the motive (normative judgment).
      *   **Theoretical Framework:** Bernard Williams's Internal vs. External Reasons (from "Internal and External Reasons"). Key concept: A reason exists only if it connects to the agent's *subjective motivational set* (S) via a *sound deliberative route* (correcting false beliefs, imagining consequences, etc.). External reasons (claims about reasons the agent cannot feel) are rejected or treated differently.
      *   **Deliverable:** A diagnostic procedure (ordered questions) for a working critic.
          *   Two layers: Reasoning (for the user) + Plain-sentence marginal comment (for student/client).
          *   Time limit: ~25 minutes per manuscript.
          *   No bibliography needed.
          *   Must handle three specific test cases (Woman leaving children, Man staying in marriage, Thin motivational set/child/dementia).
          *   Constraints/Meta-commentary: Explicitly identify judgment calls, limitations (interesting vs. existent motives, deliberate withholding), confidence level in preserving Williams's distinction, and the "stretch" limit of the deliberative route.

  2.  **Deconstruct Williams's Theory for Fiction Criticism:**

      *   *Subjective Motivational Set (S):* Desires, projects, commitments, dispositions. In fiction, this is what's on the page (thoughts, dialogue, backstory, behavior).
      *   *Sound Deliberative Route:* The logical/psychological bridge from S to Action $\phi$. Includes correcting false beliefs and imagining unseen consequences.
      *   *Internal Reason:* Exists if the bridge connects S to $\phi$.
      *   *External Reason:* Claims $\phi$ is reasonable regardless of S (e.g., "You *ought* to leave him"). Williams says these aren't true reasons *for the agent* unless they can be internalized.
      *   *Application:* The critic isn't asking "Is this action moral/logical?" but "Does this action flow from *this* character's S via a deliberative route visible or inferable from the text?"

  3.  **Drafting the Procedure (The "Williams-Wright Diagnostic"):**

      *   *Goal:* Distinguish between (1) No S, (2) No Route, (3) Critic's Disapproval.
      *   *Step 1: Identify S.* What does the text explicitly say the character wants/feels/believes *before* the action?
      *   *Step 2: Identify $\phi$.* What is the specific action?
      *   *Step 3: Check the Route (Beliefs/Imagination).* Can I trace a line from S to $\phi$ if I correct false beliefs or allow for imagined consequences?
      *   *Step 4: Check for External Imposition.* Is the action happening because the plot needs it, or because the *author* thinks it's "right," rather than the character?
      *   *Step 5: The Stop Condition.* When does it become a question of the book's purpose (genre, theme) rather than motive?

      *Refining for Time (25 mins):* Needs to be punchy. Not a full exegesis per scene, but a targeted scan of the pivotal action.

  4.  **Developing the Two Layers:**

      *   *Layer 1 (Critic's Logic):* Technical application of Williams.
      *   *Layer 2 (Marginalia):* Plain English, actionable, non-philosophical.

  5.  **Running the Test Cases:**

      *   *Case 1 (Woman leaving children):* Workshop says unmotivated. User hunches false belief/imagination issue.
          *   *Analysis:* S exists (misery? fear?). Route blocked by false belief (e.g., "They are better off without me") or lack of imagination (cannot see the pain).
          *   *Verdict:* Route exists but relies on a false belief or imaginative failure *within the character*.
          *   *Marginalia:* Needs to show the specific distortion in her thinking, not just the act.
      *   *Case 2 (Man staying in marriage):* Critic wants to say "He has reason to leave."
          *   *Analysis:* This is an *External Reason* claim. Williams says this is invalid if it doesn't connect to his S. If his S is "fear of change" + "duty," staying is internally rational.
          *   *Verdict:* Procedure must flag this as the critic's preference, not a character flaw.
          *   *Marginalia:* Don't tell him he *should* leave; ask what binds him.
      *   *Case 3 (Thin S - Child/Dementia):*
          *   *Analysis:* S is too thin or non-deliberative. Williams's model assumes agency.
          *   *Verdict:* Procedure halts. Motive isn't the point; experience is.
          *   *Marginalia:* Shift focus from "why" to "what it feels like."

  6.  **Addressing the Meta-Constraints:**

      *   *Judgment Calls:* Identifying S is interpretive. Defining "sound deliberation" in fiction (vs. logic) is subjective.
      *   *Limitations:* Doesn't judge *quality* of motive, only *existence*. Doesn't account for mystery/withholding.
      *   *Confidence/Williams Fidelity:* The trickiest part is "Sound Deliberative Route." Williams allows for correcting false beliefs. How far can we stretch "what the character *would* believe if rational" before it becomes the *author* imposing rationality? This is the weak point.
      *   *Contested Reading:* Williams's rejection of external reasons is controversial (Korsgaard, etc.). I need to acknowledge this limits the procedure to *internal coherence* rather than *moral truth*.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Professional, peer-to-peer, rigorous but practical.
      *   *Structure:*
          1.  Introduction (Acknowledging the task).
          2.  The Procedure (Step-by-step with dual layers).
          3.  The Test Cases (Applied output).
          4.  The Meta-Commentary (Limitations, Confidence, Williams Fidelity).

      *(Self-Correction during drafting)*: Make sure the marginal comments sound like an editor talking to a writer, not a philosopher. Avoid "motivational set." Use "what we know about them."
      *(Refining the "Stop Condition")*: Ensure the procedure knows when to quit. If the text is deliberately opaque (Kafkaesque), the procedure shouldn't force a motive.
      *(Refining Williams)*: Ensure I don't confuse "Internal Reason" with "Good Reason." A villain has internal reasons. The procedure must validate evil/stupid motives if they are *internal*.

  8.  **Final Review against Constraints:**
      *   25 mins runnable? Yes, 5 steps.
      *   Two layers? Yes.
      *   Three cases? Yes.
      *   Meta-commentary on judgment calls/Williams fidelity? Yes.
      *   No bibliography? Yes.

  9.  **Final Polish:** Check the voice. The user is a novelist/academic hybrid. The response should match that intellectual weight without being pretentious. (e.g., using "S" and "$\phi$" in the reasoning layer but plain English in the marginalia).

  *(Self-Correction on Case 2)*: The user specifically wants the procedure to tell them *bluntly* that writing "he has reason to leave" is the wrong note. I need to make sure Step 4 of the procedure explicitly catches "Critic's External Reason."

  *(Self-Correction on Case 3)*: The procedure needs a "Fail State" where it admits it cannot apply.

  *(Self-Correction on Williams Fidelity)*: The biggest risk is conflating "Sound Deliberative Route" with "Plot Logic." I need to emphasize that the route must be *psychological*, not just causal.

  Let's assemble.
answer: |-
  Here is the diagnostic procedure, grounded in Bernard Williams's distinction between internal and external reasons, designed for your specific workflow.

  ### The Internal Coherence Diagnostic (ICD)

  **Time Cost:** ~25 minutes per manuscript (focused on pivotal actions).
  **Purpose:** To distinguish between a missing motive, a missing explanation, and a critic's normative disagreement.

  #### The Procedure

  **Step 1: Isolate the Subjective Motivational Set (S)**
  *   **Reasoning:** Williams argues reasons must stem from the agent's *S* (desires, projects, commitments, dispositions). You must inventory what the text explicitly establishes about the character's psychology *prior* to the action.
  *   **Question:** What specific desires, fears, or commitments does the text attribute to the character before the action occurs?
  *   **Pass Condition:** You can list at least two distinct elements of *S* supported by text (dialogue, thought, prior action).
  *   **Fail Condition:** *S* is empty or defined solely by the author's need for the plot to move.
  *   **Marginal Comment:** "I can't find what drives this character yet; the action arrives before we know what they want."

  **Step 2: Define the Action ($\phi$)**
  *   **Reasoning:** Vague feedback arises from vague targets. You must isolate the specific behavior being questioned.
  *   **Question:** What is the specific physical or verbal act?
  *   **Pass Condition:** The act is discrete (e.g., "walks out the door," not "acts self-destructively").
  *   **Marginal Comment:** (None needed, this is for your clarity).

  **Step 3: Trace the Deliberative Route**
  *   **Reasoning:** An internal reason exists if a "sound deliberative route" connects *S* to $\phi$. This includes correcting false beliefs or imagining consequences the character hasn't weighed. *Crucially:* The route must be psychological, not logical. A villain's route can be sound even if the act is evil.
  *   **Question:** If I assume the character's beliefs are true (even if factually false) and follow their emotional logic, does $\phi$ follow?
  *   **Pass Condition:** You can articulate the bridge: "Because she believes X (even if wrong), and wants Y, she does $\phi$."
  *   **Fail Condition:** The jump from *S* to $\phi$ requires the character to act against their own established psychology without a stated shift.
  *   **Marginal Comment:** "The leap from how she feels to what she does is too wide; I need to see the thought that bridges them."

  **Step 4: Check for External Imposition**
  *   **Reasoning:** This catches your third complaint ("I disapprove of the motive"). If the route only makes sense because *you* think the action is "right" or "necessary for the theme," but it contradicts *S*, you are positing an External Reason.
  *   **Question:** Am I wanting this action because it fits the plot/morality, or because it fits the character?
  *   **Pass Condition:** The action feels inevitable *for this character*, even if surprising.
  *   **Fail Condition:** You find yourself thinking, "A good person wouldn't do this," or "The plot needs him to stay."
  *   **Marginal Comment:** "This feels like the plot demanding the action rather than the character choosing it."

  **Step 5: The Stop Condition (Agency Check)**
  *   **Reasoning:** Williams's model requires a deliberating agent. If *S* is non-existent (dementia, infancy) or the text relies on deliberate opacity (Kafkaesque absurdity), the procedure fails.
  *   **Question:** Is this character capable of deliberation, and is the text promising psychological realism?
  *   **Pass Condition:** Character is an agent; genre is realism/psychological fiction.
  *   **Fail Condition:** Character lacks agency or text is deliberately obscure.
  *   **Marginal Comment:** "We are past motive here; focus on the sensory experience of the event, not the 'why'."

  ---

  ### Test Cases

  Here is the ICD applied to your three scenarios, generating the specific marginal notes.

  #### Case 1: The Woman Leaving the Children
  *   **Context:** Student story. Woman walks out on two small children in one paragraph. Workshop says "unmotivated." You suspect a false belief/imagination gap.
  *   **ICD Run:**
      *   *Step 1 (S):* Text shows exhaustion, a specific fear of becoming her own mother, a belief that her presence is toxic. (Pass)
      *   *Step 2 ($\phi$):* Walking out the door. (Pass)
      *   *Step 3 (Route):* If she believes "My presence harms them more than my absence," leaving is rational *within her S*. The workshop calls it unmotivated because the belief is factually false (abandonment harms more). But Williams allows false beliefs in the deliberative route. The text fails to show *her* holding that belief strongly enough.
      *   *Step 4 (External):* Not an external imposition; the character owns the logic, but the text hides the premise.
      *   *Step 5 (Agency):* Adult agent. (Pass)
  *   **Verdict:** Complaint 2 (Path exists but text failed to show it). The motive is internal but relies on a delusion the text hasn't earned.
  *   **Marginal Note:** "She wouldn't leave unless she believed staying was worse. You haven't shown us that belief yet, so it looks like cruelty rather than desperation."

  #### Case 2: The Man in the Dead Marriage
  *   **Context:** Client manuscript. Man stays for 200 pages. You want to write "He has reason to leave."
  *   **ICD Run:**
      *   *Step 1 (S):* Text shows fear of loneliness, financial dependency, religious commitment to vows. (Pass)
      *   *Step 2 ($\phi$):* Staying. (Pass)
      *   *Step 3 (Route):* Given *S* (fear/duty), staying is the rational output.
      *   *Step 4 (External):* Your urge to say "He has reason to leave" is an *External Reason* claim. It appeals to objective well-being, not his *S*. Williams says this is not a reason *for him*. The procedure flags *your note* as the error.
      *   *Step 5 (Agency):* Adult agent. (Pass)
  *   **Verdict:** Complaint 3 (You disapprove of the motive). The motive exists internally; you just dislike it.
  *   **Marginal Note:** "He stays for reasons that make sense to him (fear/duty). Don't tell us he should leave; show us the cost of staying so we feel the trap."

  #### Case 3: The Thin Motivational Set (Child/Dementia)
  *   **Context:** Narrator is six years old or dementia patient.
  *   **ICD Run:**
      *   *Step 1 (S):* *S* is fragmented, reactive, or non-verbal.
      *   *Step 3 (Route):* Deliberative route cannot be constructed. There is no "sound deliberation," only impulse or confusion.
      *   *Step 5 (Agency):* **FAIL.** The character lacks the capacity for the kind of reason-tracking Williams describes.
  *   **Verdict:** Procedure Halts. Applying "motive" here is a category error.
  *   **Marginal Note:** "Don't worry about explaining 'why' here. A child/dementia patient doesn't deliberate. Just give us the immediate sensation of the moment."

  ---

  ### Meta-Commentary & Constraints

  You asked for explicitness regarding the limitations of this tool and its fidelity to Williams. Here is the audit.

  **1. Judgment Calls Wearing the Uniform of Procedure**
  *   **Identifying *S* (Step 1):** Determining what counts as part of the "subjective motivational set" is interpretive. A subtextual desire counts as much as a stated one. If I decide a character's silence implies "fear" rather than "indifference," I have altered the outcome of the diagnostic. This is unavoidable; the procedure organizes your intuition, it does not replace it.
  *   **Defining "Sound" (Step 3):** Williams allows for correcting false beliefs. In fiction, determining whether a belief is a "false belief held by the character" or "bad writing by the author" is a judgment call. I have tried to constrain this by asking if the belief is *supported by the text*, but the line is porous.

  **2. What the Procedure Cannot Do**
  *   **Quality vs. Existence:** The ICD confirms if a motive *exists*, not if it is *interesting*. A cliché motive (jealousy) passes the ICD just as easily as a novel one. It protects against incoherence, not banality.
  *   **Deliberate Withholding:** Some fiction (Pinter, Knausgaard) thrives on the *absence* of clear motive. The ICD will flag this as a "Fail" at Step 3. You must override the procedure when opacity is the aesthetic goal. The tool assumes transparency is the default; it cannot detect artistic mystery.

  **3. Confidence in Williams Fidelity**
  *   **Confidence Level:** High (85%). The procedure preserves the core distinction: Internal Reasons (grounded in *S*) vs. External Reasons (grounded in objective fact or critic preference).
  *   **The Weakest Link (Step 3):** This is where I am least sure I have not substituted convenience for rigor. Williams's "sound deliberative route" allows for *imagining* consequences the agent hasn't weighed. In fiction, how much imagination can we attribute to a character before we are simply writing their thoughts for them?
      *   *Risk:* If I allow too much "imagined consequence," I can rationalize any action, turning the procedure into a apologia for bad writing.
      *   *Safeguard:* I have constrained this in Step 3 by requiring the belief to be *textually supported*. We can correct their facts, but we cannot invent their values.
  *   **Contested Reading:** Williams's rejection of External Reasons is philosophically contested (e.g., by Christine Korsgaard). Some argue moral obligations *are* reasons regardless of *S*. By adopting Williams, this procedure explicitly sidelines moral truth in favor of psychological coherence. It will tell you a villain's action is "motivated" if it fits their *S*, even if it is morally abhorrent. This is a feature, not a bug, for a fiction editor, but it means the procedure is amoral. It diagnoses *truth to character*, not *truth to life*.

  **4. The Stretch Limit**
  *   The "Sound Deliberative Route" stops doing work when the correction of false beliefs requires changing the character's fundamental identity. If a character is cowardly, and you argue they *would* act bravely if they "corrected their belief about danger," you have stepped outside Williams. You are no longer correcting a belief; you are swapping the *S*. The procedure halts if the route requires the character to become someone else.

  This tool should allow you to categorize your marginalia with precision: **"Show the belief"** (Case 1), **"Respect the trap"** (Case 2), or **"Drop the why"** (Case 3).
