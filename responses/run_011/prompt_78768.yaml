  **Scratch work (not for circulation)**

  *   **Crux 1:** The proposal treats distrust as ignorance (epistemic bubble: structure of omission) rather than reasoned rejection (echo chamber: structure of distrust); this is a category error.
  *   **Coinage Verdict:** "Credential capture" is doing genuine explanatory work; it describes how institutional neutrality becomes evidence of bias within conspiracy networks. "Asymmetric risk" is decorative but points to a real mechanism of weaponized skepticism.
  *   **Crux 2:** The workshop teaches a skill (lateral reading) that functions differently depending on the user's prior trust hierarchy; it is not neutral technology.
  *   **Self-Serving Risk:** My analysis risks elitism by assuming the "correct" epistemic stance is known to the institution; however, the branch manager's local data outweighs the proposal's theoretical framework.
  *   **Decision Logic:** Protecting long-term institutional trust outweighs the pilot's potential success; we must participate without endorsing.

  ***

  **MEMORANDUM**

  **TO:** Board of Trustees, County Library System
  **FROM:** Public Programs Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Memo: *Reading Across the Divide* Pilot Proposal

  **Recommendation**

  Approve with Conditions. The proposal as written assumes patrons lack information, whereas our highest-risk communities suffer from cultivated distrust. Proceeding without modification risks converting the library from a neutral host into a partisan participant. We authorize the $85,000 pilot only if staff remove all institutional endorsements of specific sources and externalize facilitation. This shifts the library's role from arbiter of truth to provider of tools. If these conditions cannot be met within the existing budget, reject the proposal. To approve as written is to ignore the specific epistemic environment of our rural branches.

  **What the proposal is actually for**

  We must diagnose what each component actually affects. First, the "Across the Aisle" display targets *epistemic bubbles*, social structures where people miss information due to isolation. It assumes exposure to opposing views corrects ignorance. It does not address *echo chambers*, structures where outside sources are actively discredited by trusted insiders. For patrons in chambers, this display is not new information; it is enemy propaganda.

  Second, the "Check the Source" workshop teaches lateral reading, a technique where one opens new tabs to verify an outlet's reputation. In a bubble, this reveals credibility. In a chamber, where a ranked list of "compromised" sources already exists, this skill allows patrons to efficiently confirm their existing distrust lists rather than revise them.

  Third, the facilitated conversations target affective polarization, or emotional hostility toward opponents. This assumes contact reduces fear. However, if participants view the facilitator as a county agent, the conversation reinforces the "library as arm of the state" narrative. Each component addresses a symptom of polarization but misdiagnoses the underlying cause in our most vulnerable communities.

  **The case for approving as written**

  Proponents argue that some patrons are genuinely in bubbles, not chambers. For these residents, exposure to diverse viewpoints functions as intended, broadening their informational diet. The library has a mandate to provide access to diverse viewpoints; withholding them due to fear of misuse is paternalistic. Furthermore, silence is not neutral; if the library does not curate, algorithms will. The proposal signals institutional commitment to truth-seeking, which may resonate with the "exhausted majority" who are not in either extreme [Staff should verify this demographic exists in sufficient numbers locally]. Finally, the pilot is time-limited. Even failure provides data we currently lack about how our specific population reacts to structured exposure. Doing nothing preserves the status quo, which is already fracturing.

  **The case against**

  The branch manager's diagnosis is superior for the highest-risk communities. In an echo chamber, the library is already suspect. By stamping sources as "verified" or explaining why they were selected, the library enters the conspiracy network as a villain. This is *credential capture*: our endorsement becomes evidence against the source. The workshop asymmetry survives scrutiny; teaching someone to check sources gives them tools to dismiss us more efficiently if their trusted network has already pre-validated those dismissals. If the goal is social cohesion, this proposal may deepen fractures by making distrust more sophisticated. Evidence from similar field experiments suggests exposure can harden views rather than soften them [Staff should verify generalizability of this claim to local context]. We risk spending $85,000 to teach people how to ignore us better.

  **Conditions**

  To mitigate these risks, staff must implement the following modifications within the existing budget:

  1.  **Display Modification:** Remove all explanatory cards justifying why specific outlets were selected. Let the titles stand alone without library commentary. *Owner: Collections Manager. Date: Pre-launch.* Rationale: This removes the library's epistemic endorsement, reducing credential capture risk. We provide access, not validation.
  2.  **Workshop Refocus:** Do not evaluate specific news outlets during sessions. Teach the *method* of lateral reading using non-political historical examples (e.g., historical claims rather than current events). *Owner: Program Director. Date: Curriculum review 30 days out.* Rationale: Prevents the workshop from becoming a public list of "bad" sources that patrons can weaponize.
  3.  **Facilitator Sourcing:** Contract external facilitators for conversations, not library staff. *Owner: HR/Board Chair. Date: Hiring complete 60 days out.* Rationale: Staff are county employees; in rural branches, this confirms the "county arm" conspiracy. External neutrals bypass this institutional baggage.
  4.  **Cut:** Any language implying the library has "verified" the truthfulness of displayed materials. If the proposal requires the library to vouch for truthfulness, cut the component.
  5.  **Monitoring:** Branch managers must have veto power to pause programming if local tension spikes. *Owner: Board Chair. Date: Immediate.*

  **Reversal triggers**

  We must know when this memo's reasoning is wrong, not just when the project fails. First, if attendance is exclusively from one political demographic despite balanced recruitment, the "bridge" claim is false. Second, if branch managers report increased hostility toward staff linked to the program, the trust cost is too high. Third, if post-workshop surveys show increased confidence in dismissing *all* outside sources rather than evaluating them, the skill is being weaponized. Finally, if the "exhausted majority" does not materialize in sign-ups, the premise of moderate engagement is wrong. Any two of these triggers require immediate suspension of the pilot for review.
