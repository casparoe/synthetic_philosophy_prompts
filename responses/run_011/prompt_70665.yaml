prompt: |-
  After thirty-five years in a university physiology department I have retired and taken up philosophy, and I now convene a fortnightly reading group composed largely of former colleagues — experimentalists, a statistician, two retired engineers — none of whom has any formal training in the subject. In five weeks it is my turn to lead, and I have chosen Scanlon's contractualism: the criterion of wrongness in terms of principles for the general regulation of behaviour that no one could reasonably reject, together with the aggregation problem that criterion appears to generate. I have forty-five minutes and a whiteboard. What I require is not an explanation of the material but a plan for how I should explain it.

  Specifically: what must already be in place before the criterion can be stated intelligibly to this audience, and what depends on what in the order of introduction; which single case should carry the whole session, and what such a case must have and must conspicuously lack. I had intended to open with a decision from my own working life — whether to accept a small cumulative risk of serious injury to one technician in exchange for forty researchers each losing a modest amount of bench time — and I suspect this is a mistake, though I cannot articulate precisely why. Tell me how the concession that complaints of comparable magnitude may sometimes be weighed together should be introduced so that the group does not conclude the theory has been patched up ad hoc. Map the misconceptions I should expect from people with this training — I anticipate that the statistician will immediately reach for a sum, and that someone will object that the theory therefore always sacrifices the many to the one — and mark the point in the sequence at which each must be headed off.

  Close with one question I can put to the room that would reveal whether the idea has landed, and state plainly what I ought to leave out at this level and announce that I am leaving out.
reasoning: |-
  Here's a thinking process that leads to the suggested plan:

  1.  **Analyze the User and Context:**
      *   **User:** Retired physiology professor (35 years), now leading a philosophy reading group.
      *   **Audience:** Former colleagues (experimentalists, statistician, retired engineers). No formal philosophy training. Scientific/pragmatic mindset.
      *   **Task:** Lead a 45-minute session on Scanlon's contractualism (criterion of wrongness + aggregation problem).
      *   **Constraints:** 45 minutes, whiteboard available. Needs a *plan*, not an explanation of the material.
      *   **Specific Concerns:**
          *   What prerequisites are needed before stating the criterion?
          *   Order of introduction (dependency).
          *   Selecting *one* core case (and what it must/must not have).
          *   Evaluating the user's proposed opening case (lab risk vs. bench time) – suspect it's a mistake, need to explain why.
          *   How to introduce aggregation/concessions without looking *ad hoc*.
          *   Anticipating misconceptions (statistician summing, "sacrificing many to one").
          *   Closing question to test understanding.
          *   What to explicitly exclude/bracket.

  2.  **Deconstruct Scanlon's Contractualism (for this audience):**
      *   *Core Idea:* An act is wrong if it violates principles no one could reasonably reject.
      *   *Key Feature:* Individualistic grounding. Reasons must be personal.
      *   *The Problem:* Aggregation. If many people suffer small harms vs. one person suffering a great harm, utilitarianism sums them. Scanlon initially seems to say "No, compare individual vs. individual." This leads to the "Number Problem" (saving 1 vs. saving 5).
      *   *The Solution (later Scanlon):* Relevance of numbers in certain contexts (saving lives), but not simple summation of utility.

  3.  **Evaluate the User's Proposed Opening Case:**
      *   *Case:* Small cumulative risk of serious injury to 1 technician vs. 40 researchers losing modest bench time.
      *   *Why it's problematic:*
          *   It mixes *risk* with *certainty* (or high probability).
          *   It mixes *safety/health* with *productivity/time*.
          *   It invites a Utilitarian calculation immediately (40 units of time vs. 1 unit of injury risk).
          *   It's too institutional/hierarchical (PI vs. Tech).
          *   *Crucially:* It obscures the *interpersonal justification* aspect. It sounds like a risk assessment matrix (engineering/safety), not a moral justification between equals.
          *   *Better approach:* Needs a case where the *reasons* for rejection are clear and comparable, without immediate recourse to "greater good."

  4.  **Develop the Session Plan (45 Minutes):**

      *   **Phase 1: Setup (10 mins).** Need to establish the "moral landscape" before the definition.
          *   Concept: Justification to others.
          *   Concept: Reasonable Rejectability (not actual rejection).
          *   Prerequisite: The idea of "standards of justification" rather than "maximizing outcomes."
      *   **Phase 2: The Criterion (5 mins).** State it clearly on the whiteboard.
      *   **Phase 3: The Core Case (15 mins).** Needs to be the "Rescue Case" (Save 1 vs. Save 5). It's the standard for a reason. It isolates the aggregation problem perfectly.
          *   *Why not the Lab Case?* (See above).
          *   *What the case must have:* Clear competing claims, life/death or significant burden, no hidden variables.
          *   *What it must lack:* Uncertainty, institutional authority, different *types* of goods (keep it homogeneous, e.g., life vs. life).
      *   **Phase 4: The Aggregation Problem & Solution (10 mins).** Address the Statistician's urge to sum. Explain the "complaint" model. Introduce the concession (numbers count when claims are *similar* in nature).
      *   **Phase 5: Closing (5 mins).** The diagnostic question.

  5.  **Addressing Specific Prompts:**

      *   *Prerequisites:* "Morality as justification" vs. "Morality as optimization." The status of the participants (free and equal).
      *   *Order:* Motivation -> Criterion -> Application (Case) -> Problem (Aggregation) -> Refinement.
      *   *The Case:* The "Rescue Case" (burning building or lifeboat). It must lack *uncertainty* (unlike the lab risk) and *institutional hierarchy*.
      *   *The Lab Case Critique:* It frames the issue as *management*, not *morality*. It invites cost-benefit analysis (engineering), which is exactly what Scanlon wants to bypass.
      *   *Aggregation Concession:* Don't patch it. Frame it as "Relevance of numbers to the strength of the *individual* complaint." If I am one of five, my situation is relevantly different than if I am the only one.
      *   *Misconceptions:*
          *   Statistician (Summing): Head off early by defining "Reasonable Rejectability" as *individual* veto power, not group sum.
          *   "Sacrificing Many to One": Address during the Aggregation phase. Clarify that Scanlon allows saving the many, but for different *reasons* than Utilitarianism.
      *   *Closing Question:* Needs to test if they grasp the *reasoning*, not just the outcome.
      *   *Exclusions:* Ideal theory details, historical context (Kant/Rousseau), meta-ethics.

  6.  **Refining the Plan (Self-Correction/Nuance):**
      *   *Tone:* Respectful of their scientific background. Use their language (variables, controls) but map it to philosophical concepts.
      *   *Whiteboard:* Use it for the structure of the argument, not just definitions.
      *   *The "Concession":* This is tricky. Scanlon's *What We Owe to Each Other* view vs. later revisions. Stick to the core WWOE view but acknowledge the "Number Problem" solution simply: Numbers matter when the *type* of harm is the same.
      *   *Lab Case:* I need to be very clear why the user's intuition that it's a mistake is correct. It's a *policy* decision, not a *moral* justification between equals.

  7.  **Drafting the Response:**
      *   *Structure:* Follow the user's request order (Prerequisites/Order, The Case, The Lab Case Critique, Aggregation/Concession, Misconceptions, Closing, Exclusions).
      *   *Style:* Concise, authoritative, tailored to an academic peer.

      *(Self-Correction during drafting)*: Wait, the user asked specifically about the *concession* regarding aggregation. Scanlon's initial view was very strict on non-aggregation. Later he softened it (the "Relevance View"). I should advise sticking to the core tension first, then introducing the nuance as a refinement, not a patch. The key is distinguishing *summing burdens* vs. *strengthening individual claims via numbers*.

      *(Refining the Closing Question)*: It shouldn't be "Is this right?" It should be "How would you justify X using this framework?"

      *(Refining the Lab Case)*: The problem is the *incommensurability*. Time vs. Injury. Scanlon works best when comparing like with like (Life vs. Life) to isolate the *number* variable.

  8.  **Final Polish:** Check against the 45-minute constraint. Ensure the flow is logical. Ensure the "Scientific/Engineering" mindset is leveraged, not fought. (e.g., treat "Reasonable Rejectability" like a control condition).

      *Let's structure the advice:*
      1.  **Preconditions:** What concepts must land first.
      2.  **The Core Case:** Why the Rescue Case is better than the Lab Case.
      3.  **The Lab Case Critique:** Why the user's intuition was right.
      4.  **Aggregation/Concession:** How to frame it non-ad-hoc.
      5.  **Misconception Management:** When to intercept the Statistician and the Utilitarian.
      6.  **Closing:** The diagnostic question.
      7.  **Exclusions:** What to cut.

      *Time allocation:*
      0-10: Setup (Justification vs. Optimization).
      10-15: The Criterion (Whiteboard).
      15-30: The Case (Rescue) & The Problem.
      30-40: Aggregation & Concession.
      40-45: Closing Question.

      *Wait, one nuance:* The user is a physiologist. They understand *mechanism*. Philosophy is often about *normativity*. I need to emphasize the shift from "What works?" to "What is justifiable?"

      *Okay, ready to write.*
answer: |-
  Here is a plan for your forty-five minutes, designed to leverage the analytical strengths of your audience while sidestepping the specific traps their training sets for them.

  ### 1. Prerequisites and Order of Introduction
  Before you write the criterion on the whiteboard, you must establish the **moral ontology**. Your colleagues are trained to look for optimal outcomes (physiology/engineering) or population parameters (statistics). Scanlon is not offering an optimization algorithm; he is offering a test of justification.

  **The Sequence:**
  1.  **The Motivation (5 mins):** Do not start with the definition. Start with the *purpose* of morality. For Scanlon, morality is not about maximizing good states of affairs; it is about relating to others on terms they could not reasonably reject.
      *   *Whiteboard:* Draw two columns. Left: "Optimization (Utilitarianism)." Right: "Justification (Contractualism)."
      *   *Key distinction:* Optimization asks, "What produces the best result?" Justification asks, "Can I defend this action to each person affected?"
  2.  **The Status of Participants (5 mins):** Establish that the "contractors" are free and equal. This is vital for your engineers and experimentalists who work in hierarchies. In the moral space, the technician and the professor have equal veto power regarding *reasonable rejection*.
  3.  **The Criterion (5 mins):** Now state it: *An act is wrong if it violates principles for the general regulation of behaviour that no one could reasonably reject.*
      *   *Clarify:* "Reasonably" does not mean "rationally self-interested." It means "appealing to generic reasons that others must acknowledge."

  ### 2. The Core Case: Why Your Lab Example is a Mistake
  Your intuition is correct: discard the lab risk case.

  **Why it fails:**
  1.  **Incommensurability:** It pits *safety/health* against *productivity/time*. This invites a cost-benefit analysis (engineering), which is exactly the utilitarian calculus Scanlon opposes.
  2.  **Institutional Hierarchy:** It frames the problem as *management policy* rather than *moral relation*. Your colleagues will immediately revert to "duty of care" regulations or institutional risk matrices.
  3.  **Probability vs. Certainty:** It introduces risk assessment (statistics), which distracts from the core moral question of competing claims.

  **The Case You Should Use: The Rescue Case.**
  *   **Scenario:** You are on a patrol. You learn that a rockslide has trapped people in two locations. Location A has one person. Location B has five people. You have time to save only one group. All six are strangers. All will die without help.
  *   **What it must have:** Homogeneity of harm (death vs. death). Certainty of outcome (no probabilities). Equality of relationship (strangers, no special duties).
  *   **What it must lack:** Any possibility of saving everyone. Any difference in the *type* of suffering.
  *   **Why this works:** It isolates the variable of *number*. It forces the question: Does the fact that there are five people in B allow the one person in A to reasonably reject a principle that says "Save the Many"?

  ### 3. The Aggregation Problem and the Concession
  This is the technical heart of the session. You must prevent the group from viewing Scanlon's handling of numbers as a patch.

  **The Problem (10 mins):**
  *   Ask: Can the single person in Location A reasonably reject a principle that says "Save the Greater Number"?
  *   *Strict Scanlon:* If we compare individual complaints one-to-one, the one person's complaint (I die) is just as strong as any single one of the five's complaints (I die). Therefore, the one person *can* reject the principle. This implies flipping a coin, not saving the five.
  *   *The Statistician's Trap:* The statistician will say, "But 5 deaths > 1 death." You must interrupt this. In Scanlon's framework, you cannot sum the complaints. You compare the strongest individual complaint against the strongest individual complaint.

  **The Concession (10 mins):**
  *   Do not present this as "Scanlon changed his mind." Present it as refining the *description of the complaint*.
  *   *The Move:* The complaint of an individual in the group of five is not just "I will die." It is "I will die, and I am one of five who could be saved."
  *   *The Logic:* Numbers do not aggregate *value* (utilitarianism); they affect the *strength of the individual's reason* to want the principle adopted. If I am one of five, I have a stronger reason to want a "Save the Many" principle than the single person has to want a "Flip a Coin" principle, because the "Save the Many" principle is more likely to save *me* ex-ante.
  *   *Whiteboard:* Draw a scale. On one side, "Complaint of the One." On the other, "Complaint of One of the Five." Show that the *content* of the complaint changes when numbers are introduced, without summing the harms.

  ### 4. Mapping Misconceptions
  You must preempt these objections at specific points in the sequence.

  **1. The Statistician's Sum (Utilitarianism)**
  *   *Objection:* "Why can't we just sum the suffering? 5 units of pain outweigh 1."
  *   *Intercept Point:* **Phase 1 (Motivation).** Before stating the criterion, explicitly rule out "maximizing the good." State that contractualism is *agent-relative*. We owe justification to *individuals*, not to "the world."
  *   *Response:* "Summing treats people as containers of value. Scanlon treats them as authors of justification."

  **2. The "Tyranny of the One"**
  *   *Objection:* "So this theory says we should let the five die to respect the one? That's absurd."
  *   *Intercept Point:* **Phase 4 (The Concession).** This is where you solve it.
  *   *Response:* "No. The theory allows saving the five, but the *reason* is not that the five are worth more. The reason is that the principle 'Save the Many' is one that the single person could not reasonably reject, given that they too would want that principle to apply if they were in the majority."

  **3. The "Ideal Theory" Objection**
  *   *Objection:* "Real people aren't reasonable. They are selfish."
  *   *Intercept Point:* **Phase 1 (Prerequisites).**
  *   *Response:* "We are not describing psychological fact. We are defining a standard of right and wrong. Just as frictionless planes don't exist in physics but define the laws of motion, 'reasonable' agents define the laws of morality."

  ### 5. The Closing Question
  Do not ask, "Does this make sense?" Ask a question that forces them to apply the *structure* of the reasoning, not just the outcome.

  **The Question:**
  > "If we change the Rescue Case so that the one person in Location A is your spouse, does the contractualist criterion change the *principle*, or does it change who is entitled to *reject* it?"

  **Why this works:**
  *   If they say "It changes the principle," they haven't understood (the principle remains general).
  *   If they say "It changes who can reject," they understand that special relationships create specific grounds for reasonable rejection that override generic principles.
  *   It reveals if they grasp that the "contract" is sensitive to the specific relational context, not just a rigid algorithm.

  ### 6. What to Leave Out
  You have 45 minutes. You must explicitly announce what you are bracketing to prevent questions from derailing the session.

  **State plainly at the start:**
  1.  **Meta-ethics:** "We are not discussing whether moral truths exist. We are discussing how we determine right and wrong assuming we want to live together."
  2.  **Global Justice/Non-Humans:** "Scanlon's framework is for 'what we owe to each other' as rational agents. We are not discussing animals or future generations today."
  3.  **The 'Ideal' vs. 'Non-Ideal':** "We are discussing the standard of rightness, not the psychology of how to motivate people to follow it."

  ### Summary of Whiteboard Plan
  1.  **Left Side:** Optimization (Sum of outcomes) vs. Justification (Individual veto).
  2.  **Center:** The Criterion ("No one could reasonably reject").
  3.  **Right Side:** The Rescue Case (1 vs. 5).
      *   *Below:* The Complaint of the One vs. The Complaint of One-of-Five.
      *   *Below:* The Solution (Numbers strengthen individual reasons, they do not sum harms).

  This plan respects their intelligence while controlling the variables of the discussion, much like a well-designed experiment.
