answer: |-
  Your configuration is coherent. It is not incoherent, and it is not merely a misunderstanding of how conditional markets settle. Your third twist—the counterfactual opacity—is a genuine structural feature of governance by prediction, not a bug you have failed to solve.

  Your friend is likely gesturing at **Reflexivity** (Soros/Popper) or the **Lucas Critique** (1976). She calls it "old" because the mechanism—expectations altering outcomes—has been discussed for seventy years. But you are right to feel that these terms are "wrong by a small amount." Reflexivity describes the *distortion* of reality by belief, but it does not inherently describe the *loss of the ability to verify* that distortion. The Lucas Critique describes the *instability of parameters* under policy changes, but it is framed around econometric modeling, not the specific epistemic trap of a system that consumes its own ground truth.

  Because you have already vetted the standard taxonomy and found it wanting, and because your specific triad (Self-Fulfilling + Self-Defeating + Counterfactual Opacity) creates a unique governance failure mode, I will not force an existing label that requires you to stretch its definition.

  I diagnose this as **Epistemic Foreclosure**.

  ### The Diagnosis: Epistemic Foreclosure

  **Definition:** A systemic configuration in which the authority required to implement a prediction undermines the conditions required to verify it. Reliability is a decreasing function of credibility because the act of trusting the instrument alters the causal branch necessary to test the instrument.

  **Necessary Conditions:**
  1.  **Governance Link:** The prediction is not merely observed; it is binding or authoritative (e.g., policy adoption, market settlement).
  2.  **Reflexive Feedback:** The publication of the prediction alters the probability of the predicted event (e.g., the bank run, the ceasefire collapse).
  3.  **Counterfactual Opacity:** The adoption of the recommendation precludes observation of the alternative branch, making the *comparative* accuracy of the decision rule unverifiable in the single instance.

  **Explicit Exclusions (Why the other names fail):**
  *   **Goodhart's Law:** Excluded because it requires *optimization* or *gaming* of the metric. In Epistemic Foreclosure, the corruption is passive; it happens simply through belief and adoption, not adversarial manipulation.
  *   **Self-Fulfilling Prophecy:** Excluded because it is binary (False -> True). Epistemic Foreclosure includes self-*defeating* prophecies (True -> False, as in your ceasefire example) and, crucially, the *unverifiability* of the counterfactual.
  *   **Performativity:** Excluded because performativity (MacKenzie/Callon) often implies the model *engineers* accuracy (making the world fit the theory). Epistemic Foreclosure implies the model *consumes* the ground truth required to judge its accuracy.
  *   **The Lucas Critique:** Excluded because Lucas focuses on *structural parameter drift* in econometric models. While related, Lucas does not capture the *ontological* foreclosure of the counterfactual branch in a governance decision.

  **Boundary Cases:**
  *   **Fits (Epistemic Foreclosure):** A Central Bank issuing "Forward Guidance." If the Bank says "Inflation will be 2%," markets adjust, inflation becomes 2%, and the Bank looks accurate. But we cannot know if inflation would have been 2% *without* the guidance. The credibility of the guidance forecloses the test of the guidance.
  *   **Does Not Fit (Simple Reflexivity):** A rumor that a bridge is unsafe causes people to avoid it, saving it from collapse. The prediction changed the outcome, but there is no *governance authority* binding the decision, and no *counterfactual test* required for legitimacy.
  *   **Does Not Fit (Goodhart):** A school is rated on test scores, so teachers teach to the test. Scores go up, learning stays flat. This is gaming the metric, not the metric destroying its own verifiability through credibility.

  ### What I Give Up By Saying So

  By coining **Epistemic Foreclosure** rather than deferring to **Reflexivity** or the **Lucas Critique**, I give up the shorthand authority of an established economic term. Your friend can point to a 1976 paper and say "It's old." I am telling you that while the *components* are old, the *configuration* you have built for your novel is a specific architectural flaw in futarchy that existing terms blur.

  Using **Epistemic Foreclosure** allows your characters to distinguish between "the market was manipulated" (Goodhart), "the market changed the outcome" (Reflexivity), and "the market made it impossible to know if it was right" (Foreclosure). This distinction is vital for your third act, where the crisis is not that the market lied, but that it became *unknowable*.

  Your friend is half-right: the *mechanism* is old. But the *governance trap* you have identified is specific enough to deserve its own name. Use **Epistemic Foreclosure**. It gives you the precision you need without forcing you to misapply Lucas or Goodhart.
