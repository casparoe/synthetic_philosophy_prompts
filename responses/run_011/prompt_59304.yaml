answer: |-
  There isn't a single, universally agreed-upon word for this specific configuration, because it sits at the intersection of game theory, political science, and sociology. However, there are several precise concepts that, when layered together, describe exactly what you're seeing.

  The most accurate technical term is a **Non-Credible Threat**, but that only describes the *strong* party's constraint. To capture the *weak* party's behavior and the structural lock-in, you need to combine that with **Latent Power** and **Anticipatory Conformity**.

  Here is the breakdown of the concept, the boundaries you asked for, and how it differs from related ideas.

  ### 1. The Core Concepts

  **A. Game Theory: The Non-Credible Threat**
  In game theory, a threat is only "credible" if it is in the threatener's interest to carry it out *after* the threat has been ignored. In your examples (company town, trade partner), carrying out the threat (firing everyone, closing the border) is suicidal for the threatener. Therefore, rational actors know the threat is **non-credible**.
  *   **The Nuance:** If the threat is perfectly non-credible, the power *should* vanish. But it doesn't. Why? Because of **Strategic Uncertainty** (Thomas Schelling). The weaker party can never be 100% sure the stronger party is perfectly rational. The boss might be angry; the neighbor might have a political hardliner take over. The power exists in the *sliver of risk* that the strong party might act against their own interest.

  **B. Political Science: Latent Power (The Second Face of Power)**
  Political scientist Steven Lukes described three "faces" of power.
  1.  **Decision-making:** A makes B do X.
  2.  **Agenda-setting:** A keeps X off the table so it's never decided.
  3.  **Preference-shaping:** B wants what A wants.
  Your scenario is a variation of the **Second Face**. The strong party doesn't need to issue orders. The mere *existence* of the structural capability keeps certain topics off the agenda. This is **Latent Power**: power that is effective precisely because it is *not* exercised.

  **C. Sociology: Anticipatory Conformity**
  This describes the behavioral outcome you noted ("the weaker party still ends up not raising certain topics"). The weaker party internalizes the constraint. They don't wait for a threat; they pre-emptively align their behavior to avoid triggering the "sleeping dragon." This is often driven by **Hegemony** (Gramsci): the weaker party accepts the hierarchy as "natural" or "inevitable," even if the strong party is actually constrained.

  ### 2. Is there a label for the relationship?

  If you need a noun for the relationship itself, the closest established terms are:

  *   **Symmetric Vulnerability:** This captures the structural reality. Power is asymmetric (one can fire the other), but vulnerability is symmetric (both die if they do).
  *   **Mutual Hostage:** Both parties hold something the other needs to survive.
  *   **Locked-In Interdependence:** Emphasizes that neither can exit the relationship without catastrophic cost.
  *   **Economic Mutually Assured Destruction (MAD):** Often used in trade wars. It borrows from nuclear strategy to describe a situation where the weapon exists but cannot be used without self-annihilation.

  ### 3. The Boundaries: Where does "Power" end?

  You asked where the line is drawn between "too costly to exercise" and "not power at all." This is the **Credibility Threshold**.

  *   **Zone 1: Credible Power.** The cost of using power is less than the benefit of submission. (e.g., Firing one disruptive employee costs little, ensures order).
  *   **Zone 2: Latent / Non-Credible Power (Your Scenario).** The cost of using power is high, but not infinite. The weaker party complies because of *risk aversion*. They fear the 1% chance the strong party acts irrationally. **Power still exists here.**
  *   **Zone 3: Structural Constraint (Not Power).** The cost of using power is absolute (suicide). If the company owner *knows* firing everyone means he literally loses his house and starves, and the workers *know* he knows that, the "power to fire" ceases to be power. It becomes a **Binding Constraint**. The owner is no longer a ruler; he is a prisoner of the payroll.

  **The Line:** Power evaporates when the weaker party realizes the strong party *cannot* act without self-destruction, and they stop engaging in **Anticipatory Conformity**. If the workers start making 5-year plans assuming the factory will stay open *regardless* of the owner's whims, the owner's power has turned into **Dependency**. He now depends on them more than they depend on him.

  ### 4. How it differs from related concepts

  *   **Vs. Deterrence:** Deterrence relies on the threat being *credible* ("If you cross this line, I *will* crush you, and I can afford to"). Your scenario is **Self-Deterrence** ("If I crush you, I crush me, so I won't, but don't test me").
  *   **Vs. Ordinary Dependence:** Dependence is usually one-way (A needs B). Your scenario is **Reciprocal Dependence** with asymmetric leverage.
  *   **Vs. A Lopsided Bargain:** A bargain implies negotiation. In your scenario, there is no negotiation. The terms are set by the structural reality. The weaker party doesn't negotiate; they **accommodate**.
  *   **Vs. Countervailing Power (Galbraith):** Countervailing power implies the weak party organizes (unions, alliances) to check the strong. In your scenario, the weak party doesn't need to organize; the strong party's *own self-interest* checks their power.

  ### Summary
  If you need a phrase to use in writing, **"Latent Power within Symmetric Vulnerability"** is the most precise.

  If you want a metaphor, it is **"The Sword of Damocles with a Broken Hilt."** The sword hangs over the weaker party's head, and they still bow because it *might* fall, but the stronger party knows that pulling the string cuts their own hand off.

  The phenomenon persists not because the strong party *can* wield power, but because the weak party cannot prove the strong party *won't*. The moment the weak party stops acting as if the power is real, the power ceases to exist, and the relationship flips into **Hostage Dynamics** where the "weak" actually hold the "strong" captive.
