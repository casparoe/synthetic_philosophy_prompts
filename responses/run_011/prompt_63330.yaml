answer: |-
  **Count 1: Common Plan or Conspiracy — Score: 0.9**
  This count is most exposed because it imported an Anglo-American common law doctrine into international jurisprudence without precedent in continental or customary law, a novelty the Tribunal itself largely repudiated by refusing to convict on conspiracy for counts other than crimes against peace.

  **Count 2: Crimes Against Peace — Score: 0.8**
  While the Kellogg-Briand Pact outlawed war, establishing *individual criminal liability* for state aggression required significant judicial construction, as prior treaties imposed obligations on states rather than punishable duties on leaders.

  **Count 4: Crimes Against Humanity — Score: 0.6**
  Although the 1915 Allied declaration on the Armenian massacres provided moral pedigree, it created no binding individual liability; however, the Tribunal mitigated retroactivity by enforcing the Charter's nexus requirement, excluding pre-war domestic persecution unless linked to the war plan.

  **Count 3: War Crimes — Score: 0.1**
  This count is essentially immune, as the charged conduct (murder of POWs, plunder, etc.) violated the Hague and Geneva Conventions and customary international law clearly binding on Germany prior to 1939.

  ***

  **Does the ordering shift for Tokyo?**
  The relative ranking remains the same, but the exposure for Counts 1 and 2 intensifies. The Tokyo majority embraced a far broader, continuous conspiracy theory than Nuremberg (pushing Count 1 closer to 1.0), and while command responsibility murder charges rested on custom, the dissent by Justice Pal argued that *all* counts, including war crimes, were *ex post facto* applications of victor's justice, challenging the legitimacy of the entire legal framework more aggressively than at Nuremberg.

  **On which count is the retroactivity charge a red herring?**
  The retroactivity charge is a red herring for **Count 3 (War Crimes)**. Because the substantive law was well-established, claiming *nullum crimen* obscures the more serious complaint of "Victor's Justice": the jurisdictional exclusion of Allied conduct, such as area bombing and unrestricted submarine warfare, which violated the same statutes applied to the defendants.
