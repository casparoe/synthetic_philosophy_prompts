answer: |-
  ### 1. Reconstructed Candidate Rules

  Based on the nine verdicts, three distinct candidate rules emerge. They differ not only in how much they allow the realist to keep but in what they take to be the *source* of realist entitlement.

  **Rule 1: The Causal-Load Principle (Structural Realism)**
  *   **Definition:** A realist is entitled to retain only those components of a theory that were causally responsible for its specific empirical successes and which survive (formally or functionally) in the successor theory. Heuristic framing or ontology that is not "load-bearing" for the success is discarded.
  *   **Driving Verdicts:** This rule does the heavy lifting for **Caloric** (math survived, fluid story did not), **Fresnel** (equation survived, medium did not), **Newton** (field equations survived, absolute space did not), and **Ether** (equations survived, stress/strain did not). It explains why accurate bookkeeping (Caloric) or accurate prediction (Ptolemy) is insufficient without the right ontological driver.
  *   **Awkward Fit:** **Phlogiston.** On this rule, Phlogiston should be a total loss because the "substance" was imaginary and the direction of transfer was wrong. To accommodate the "partly retained" verdict, the rule must be bent to allow *relational structure* (transfer occurs) to count as load-bearing even if the *relata* (the substance itself) are misidentified.
  *   **Adaptation for Live Theory:** Since there is no successor theory yet, this rule must be projected forward. It asks: "Is this component indispensable for the *current* predictive success, such that removing it would collapse the explanation?" It shifts from "what survived" to "what would have to survive."

  **Rule 2: The Manipulation Threshold (Entity Realism)**
  *   **Definition:** A realist is entitled to retain the existence of theoretical objects only when those objects have moved from being inferred causes to being manipulable tools. Confirmation via prediction is insufficient; causal interaction ("steering") is required.
  *   **Driving Verdicts:** This is the explicit engine of the **Electrons** verdict ("We stopped reasoning about electrons and started steering them"). It also supports **Dalton** (discrete units combining in ratios implies a manipulable granularity) and arguably **Continental Drift** (we can map and measure the continents directly, even if we couldn't steer them).
  *   **Awkward Fit:** **Fresnel** and **Continental Drift.** We do not "steer" light waves in the 19th-century sense, nor did geologists steer continents in the 1930s. To accommodate these, the rule must be softened to allow "direct observability" or "robust causal isolation" to substitute for active manipulation.
  *   **Adaptation for Live Theory:** For a present-day case, this rule is binary and strict. If direct detection or manipulation has not occurred, entitlement is zero. It does not easily accommodate degrees of belief.

  **Rule 3: The Dialectical Restraint Principle (Pragmatic/Epistemic Caution)**
  *   **Definition:** Realist entitlement is constrained by the epistemic context of the practitioners. If practitioners treated components as instrumental devices, or if live rivals offered equivalent phenomenological fit, the realist must suspend judgment on the ontology and retain only the phenomenological regularities.
  *   **Driving Verdicts:** This rule drives **Ptolemy** (practitioners didn't assert the epicycles as real), **Continental Drift** (live rivals narrowed the claim to the shift, not the mechanism), and **Caloric** (phenomenology pre-dated the hypothesis). It explains why accuracy alone (Ptolemy) or mathematical utility (Ether) does not grant ontological rights.
  *   **Awkward Fit:** **Electrons.** By the time electrons were "steered," there were still interpretive rivals (e.g., regarding wave-particle duality). To accommodate the "retained outright" verdict, this rule must assume that manipulation overrides dialectical ambiguity, or that the rivals were not "technically sophisticated" in the way MOND is today.
  *   **Adaptation for Live Theory:** This rule is naturally suited for live cases. It requires surveying the current sociological and theoretical landscape: Are there rivals? Is avowal split? It treats the "split avowal" mentioned in the prompt as a decisive negative factor.

  ### 2. Predictions for Dark Matter Levels (a, b, c)

  **Rule 1: The Causal-Load Principle**
  *   **Level (a) Bulk Claim:** **Suspend/Reject.** The gravitational anomalies (the success) can be modeled by Modified Gravity rivals without positing non-standard matter. Therefore, the "matter" ontology is not uniquely load-bearing for the success.
  *   **Level (b) Dynamical Characterization:** **Retain.** The "cold, collisionless fluid" description is indispensable for the simulations that successfully reproduce large-scale structure. Even if it isn't matter, the *dynamical behavior* is load-bearing for the predictive success of the cosmological model.
  *   **Level (c) Particle Claim:** **Reject.** WIMP specifics are not load-bearing for the cosmological success; the simulations work with any cold dark matter, not just thermally produced weak-scale particles. This is heuristic framing, like the ether's stress.
  *   *Trigger:* The distinction between what is required for the simulation to work (b) versus the specific physical identity of the source (a, c).

  **Rule 2: The Manipulation Threshold**
  *   **Level (a) Bulk Claim:** **Reject.** No direct detection; no steering.
  *   **Level (b) Dynamical Characterization:** **Reject.** We observe the effects, but we do not interact with the dynamical source directly.
  *   **Level (c) Particle Claim:** **Reject.** No detection.
