  **Rule 3: The Dialectical Restraint Principle**
  *   **Level (a) Bulk Claim:** **Suspend.** The "split avowal" (stuff vs. parameter) mirrors Ptolemy's instrumentalism. The existence of "live and technically sophisticated rivals" (Modified Gravity) mirrors Continental Drift's contractionists. Entitlement is narrowed to the phenomenon, not the ontology.
  *   **Level (b) Dynamical Characterization:** **Retain (as Phenomenology).** Similar to the "continents have shifted" verdict. We are entitled to say the universe *behaves as if* this dynamical profile exists, without committing to it being "matter."
  *   **Level (c) Particle Claim:** **Reject.** This is the "mechanism" analogue to Drift's "what shifted them." With rivals offering different mechanisms, specific particle claims are irresponsible.
  *   *Trigger:* The presence of rivals and the split in practitioner avowal.

  ### 3. Best Guess at Her Verdict

  She will likely adopt a hybrid of **Rule 1 (Causal-Load)** and **Rule 3 (Dialectical Restraint)**, resulting in the following verdict:

  *   **Level (a): Suspend.** She will deny that a realist is currently entitled to the claim that it *is* matter.
  *   **Level (b): Retain (Structurally).** She will endorse the dynamical profile as a robust structural posit required for the simulations.
  *   **Level (c): Reject.** She will dismiss the WIMP hypothesis as premature ontological speculation.

  **Reasoning:**
  Her track record shows a consistent preference for **narrowing entitlement** when rivals exist (Continental Drift) or when avowal is instrumental (Ptolemy). While the **Electrons** verdict highlights manipulation, she explicitly contrasts this with theories that are merely "well confirmed." Dark Matter is well confirmed but not manipulated. If manipulation were her sole criterion, she would have had to reject Continental Drift's "shift" claim, which she did not. Therefore, she allows retention without manipulation *only* when the phenomenon is undeniable and rivals are weak. Here, rivals are "technically sophisticated."

  Furthermore, her **Caloric** and **Ether** verdicts show she is willing to sever mathematical success from ontological commitment if the ontology isn't distinctively load-bearing. Since the simulations are "neutral between the two readings" (matter vs. parameter), she will treat the "matter" label (Level a) as the dispensable ontology (like the ether) and the "dynamical profile" (Level b) as the surviving structure (like the wave equation). She will treat Level (c) as she treated the specific mechanism of Continental Drift: a claim to which one is "entitled to no claim whatever" while rivals persist.

  ### 4. Assessment of Underdetermination

  Yes, the nine verdicts genuinely underdetermine this case. The tension lies between the **Electrons** precedent and the **Continental Drift** precedent.

  *   **The Commitment:** By ruling *against* Level (a) (the existence of the stuff), she adopts the commitment that **gravitational anomalies do not entail material causes** until direct detection occurs. This aligns her with a stricter form of entity realism than her Drift verdict suggests.
  *   **The Strain:** This adoption puts strain on her **Continental Drift** verdict. In the 1930s, she allowed the claim "continents have shifted" (an ontological claim about landmasses) despite live rivals and no manipulation. If she denies "dark matter exists" (an ontological claim about mass) despite similar rivalry and no manipulation, she is treating "matter" differently than "continents."
  *   **Resolution:** To resolve this strain without changing her mind, she would have to argue that "continents" were observable entities whose *motion* was disputed, whereas "dark matter" is an *unobservable* entity whose *existence* is disputed. This distinction is not explicit in the nine verdicts but is necessary to make them consistent. If she does not make this distinction, her verdict on Dark Matter contradicts her verdict on Drift.

  ### 5. Discriminating Case

  The case that best discriminates among these rules is **the Neutrino between 1930 (Pauli's proposal) and 1956 (Cowan-Reines detection).**

  *   **Context:** Postulated to preserve conservation of energy/momentum in beta decay. No direct detection for 25 years. A live rival existed (Niels Bohr suggested energy conservation might only be statistical/invalid at the quantum scale). Practitioner avowal was split (some treated it as a "desperate remedy," others as a real particle).
  *   **Rule 1 (Causal-Load):** **Retain.** The neutrino was load-bearing for the conservation laws, which were the successful core of physics. The rival (abandoning conservation) was too costly to the overall structure.
  *   **Rule 2 (Manipulation):** **Reject.** Until 1956, the neutrino was not steered or detected. A strict application of the Electrons precedent demands suspension of belief during this period.
  *   **Rule 3 (Dialectical Restraint):** **Suspend.** Because Bohr's rival was respectable and avowal was split, a realist should have retained the *phenomenon* (missing energy) but suspended judgment on the *entity* (neutrino) until detection.

  **Discrimination:** If she argues that physicists were entitled to believe in the neutrino *before* 1956, she prioritizes Rule 1 (Load-Bearing) over Rule 2 and 3. If she argues they should have waited for detection, she prioritizes Rule 2 (Manipulation) or Rule 3 (Rivals). Given her emphasis on the "Electrons" distinction as a "standing illustration," her resolution of the Neutrino case would reveal whether manipulation is a necessary condition for entity realism or merely a sufficient one.
