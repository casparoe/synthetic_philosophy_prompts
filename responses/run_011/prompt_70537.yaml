          2.  Technology requires specific social organization (e.g., Nuclear power requires hierarchy).
      *   *The Challenge:* Staff won't read theory. Need operational definitions.
      *   *The Solution:* Translate philosophical concepts into engineering/procurement checks.

  3.  **Drafting the Procedure (The "TRoP" - Technical Review of Politics):**

      *   *Labels:* Need 4.
          1.  **Standard (S):** No political content detected.
          2.  **Disclosure (D):** Political consequence exists but is acknowledged/transparent.
          3.  **Redesign (R):** Political consequence is hidden or avoidable via alternative design.
          4.  **Referral (V):** The spec decides a fundamental value question reserved for the Council.
          *   *Refinement:* Let's align closer to Winner.
              1.  **Neutral:** No significant consequence.
              2.  **Embedded Authority:** Requires specific hierarchy (Winner Type 2).
              3.  **Settled Issue:** Forecloses an open question (Winner Type 1).
