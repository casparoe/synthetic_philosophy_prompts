              2.  **Structural:** Requires specific organization (Winner Type 2).
              3.  **Settling:** Forecloses an open community question (Winner Type 1).
              4.  **Contested:** Both apply or unclear high stakes.
      *   *Ordered Questions:* Start with the easiest "No."
          1.  Is there an alternative that achieves the technical goal without the social consequence? (Forced Choice)
          2.  Does the spec lock in a governance structure? (Structural)
          3.  Does the spec decide a value question silently? (Settling)
