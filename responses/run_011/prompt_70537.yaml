answer: |-
  # TECHNICAL REVIEW OFFICE: PROCEDURE TRoP-45
  **Subject:** Political Consequence Screening for Capital Specifications
  **Time Allowance:** 45 Minutes
  **Output:** One-Page Classification & Disposition

  ## I. CLASSIFICATION LABELS
  Assign exactly one label. If criteria for multiple labels are met, assign the **Compound** label.

  1.  **ROUTINE:** The specification imposes no significant distributional consequences and requires no specific social hierarchy to operate.
  2.  **SETTLING (Winner Type 1):** The design settles an issue of power or access within a community by foreclosing a question that would otherwise remain open (e.g., *who may use this space?*).
  3.  **STRUCTURAL (Winner Type 2):** The system's normal operation *requires*, rather than merely permits, a specific form of social organization (e.g., centralized authority, expert hierarchy, vendor dependency).
  4.  **COMPOUND:** Both Settling and Structural conditions are met.

  **Distinction: Requiring vs. Encouraging**
  *   **Encouraging:** The system works efficiently with a specific organization but can function (perhaps less optimally) under others. -> *Label: Routine.*
  *   **Requiring:** The system cannot function safely or at all without the specific organization (e.g., a nuclear plant *requires* a military-style chain of command; a proprietary data platform *requires* single-vendor access). -> *Label: Structural.*

  ## II. ORDERED QUESTIONS & STOPPING RULES
  *Ask in order. If a Stopping Rule is triggered, terminate and assign the indicated label.*

  **Q1. The Forced-Choice Audit (Constraint Verification)**
  *   **Question:** Is the contested requirement dictated by physics, building code, or binding interoperability standard?
  *   **Evidence Required:** Citation of specific code section, law, or published interface standard. "Industry standard" or "best practice" is insufficient.
  *   **Stopping Rule:** If **YES** (Genuinely Forced) → Terminate. **Label: ROUTINE.**
  *   **Time Cost:** 10 minutes.

  **Q2. The Ten-Year Test (Reversibility)**
  *   **Question:** If the Council changes its policy in ten years, can this decision be reversed without demolishing or replacing the asset?
  *   **Threshold:** Reversal cost < 20% of original capital cost.
  *   **Stopping Rule:** If **YES** (Reversible) → Proceed to Q3. If **NO** (Irreversible) → Proceed to Q3 (but note high stakes).
  *   **Time Cost:** 10 minutes.

  **Q3. The Silence Rule (Consequence Disclosure)**
  *   **Question:** Is the specification silent about a social consequence the artifact will inevitably produce?
  *   **Test:** Compare the *Stated Purpose* in the file against the *Predicted Function* of the artifact.
  *   **Stopping Rule:** If **NO** (Consequence is stated and acknowledged) → **Label: SETTLING** (Go to Dispositions). If **YES** (Consequence is hidden/omitted) → **Label: COMPOUND** (Go to Dispositions).
  *   **Time Cost:** 15 minutes.

  **Q4. The Organization Check (Hierarchy Verification)**
  *   **Question:** Does the procurement lock the city into a specific vendor, data structure, or management hierarchy for >5 years?
  *   **Stopping Rule:** If **YES** → Upgrade Label to **STRUCTURAL** (or **COMPOUND** if Q3 was also triggered). If **NO** → Maintain current label.
  *   **Time Cost:** 10 minutes.

  **Default Verdict:** If time expires or file is silent on Q1 evidence → **Label: COMPOUND** (Err on the side of referral).

  ## III. DISPOSITIONS
  *The Review Office classifies; it does not veto. Dispositions are mandatory referrals.*

  | Label | Disposition | Action |
  | :--- | :--- | :--- |
  | **ROUTINE** | **Clear** | Forward to Purchasing. No note. |
  | **SETTLING** | **Redesign** | Return to Project Manager. Require Alternatives Analysis showing a design that achieves technical goals without foreclosing the social question. |
  | **STRUCTURAL** | **Disclosure** | Forward to Purchasing. Attach **Plain-Language Disclosure Note** warning of long-term organizational dependency. |
  | **COMPOUND** | **Referral** | Hold Procurement. Refer to Council Committee as **Open Question of Values**. |

  **Reviewer Politics & Attorney Review**
  *   **Leak Point 1 (Q3):** Determining whether a social consequence is "significant" enough to count as "Settling." *Attorney Cannot Absorb:* This is a value judgment, not a legal one.
  *   **Leak Point 2 (Q4):** Determining if a vendor lock-in is "required" or just "preferred." *Attorney Cannot Absorb:* This is a technical/political judgment.
  *   **Attorney Role:** The City Attorney signs the flag to certify *procedural compliance* (that the review was done), not to certify the *political validity* of the finding.

  ## IV. HONEST ACCOUNTING OF TRANSLATION

  **Preserved Distinctions**
  *   **Consequence over Intent:** We dropped Winner's interest in the *author's* intent. We care only about the *artifact's* effect. This is safe because procurement files rarely prove intent, but always reveal function.
  *   **Hierarchy over Ideology:** We preserved the requirement for specific social organization (Winner Type 2) but translated "ideology" into "vendor contract terms" and "data governance."

  **Dropped Distinctions**
  *   **Feenberg's Technical Code:** We excluded Andrew Feenberg's concept that specifications encode the *worldview* of the drafter.
      *   *Reason:* Untestable in 45 minutes by non-theorists.
      *   *Substitute:* We use the **Forced-Choice Audit**. If a vendor claims a constraint is technical, we demand proof. If they cannot provide it, we treat it as a preference masquerading as code.
  *   **Cumulative Reshaping:** This procedure cannot see slow, cumulative changes (e.g., a single zoning spec doesn't look like sprawl, but 1,000 do).
      *   *Risk:* We will miss systemic bias that emerges only at scale.
      *   *Mitigation:** The **Ten-Year Test** forces a look at long-term lock-in, catching some cumulative effects.

  **Blind Spots**
  *   **Budget as Politics:** We do not review the *amount* spent, only the *specification*. A $10M project that is "Routine" clears; a $250k project that is "Settling" flags. This is a known limitation of the office's mandate.

  ***

  # CASE APPLICATIONS

  ## CASE 1: Downtown Plaza Benches
  **Input:** Fixed center armrests, spacing prevents lying down. File states purpose: "Deterring overnight occupancy."
  **Hypothetical:** File is silent on intent (Purpose listed only as "Seating").

  **Procedure Run:**
  1.  **Q1 (Forced-Choice):** Are armrests required by code/physics? *No.* (Vendor could build flat benches). **Continue.**
  2.  **Q2 (Ten-Year):** Can we change this in 10 years? *Yes.* Benches are movable assets. **Continue.**
  3.  **Q3 (Silence Rule):** Is the spec silent about a consequence?
      *   *Actual File:* No, it states "deterring occupancy."
      *   *Hypothetical Silent File:* **Yes.** The artifact answers "Who may rest here?" (Sitters only, not sleepers). The file does not state this policy.
      *   *Finding:* **SETTLING.** The spec forecloses the question of public rest without Council authorization.
  4.  **Q4 (Organization):** Does this require a specific hierarchy? *No.* **Maintain SETTLING.**

  **Verdict:** **SETTLING** (Even if file is silent).
  **Disposition:** **Redesign.**
  **Reasoning:** The procedure catches this without intent because the *Silence Rule* focuses on the gap between *Stated Purpose* ("Seating") and *Actual Function* ("Exclusion"). The artifact decides who belongs in the plaza. That is a policy decision, not a design constraint.
  **Outcome:** Return to Project Manager. Require alternatives (e.g., increased patrols, social services outreach) that do not physically exclude populations.

  ***

  ## CASE 2: Water-Utility Advanced Metering
  **Input:** Remote shutoff valves. 15-year single-vendor data platform. Shutoff logic in vendor system. Replaces court order process.
  **File:** Justified by billing accuracy/leak detection. Silent on disconnection policy.

  **Procedure Run:**
  1.  **Q1 (Forced-Choice):** Is remote shutoff required for leak detection? *No.* (Leak detection can be passive; shutoff is active). Is single-vendor required? *No.* **Continue.**
  2.  **Q2 (Ten-Year):** Can we reverse this in 10 years? *No.* 15-year contract + proprietary logic embedded in vendor cloud. **High Stakes.**
  3.  **Q3 (Silence Rule):** Is the spec silent about a consequence? *Yes.* The artifact enables disconnection without court orders. The file mentions only "billing accuracy."
      *   *Finding:* **SETTLING.** (Forecloses due process question).
  4.  **Q4 (Organization):** Does this require a specific hierarchy? *Yes.* It shifts authority from Municipal/Court to Vendor/Algorithm. It *requires* the vendor to manage the shutoff logic.
      *   *Finding:* **STRUCTURAL.**

  **Verdict:** **COMPOUND.**
  **Disposition:** **Referral.**
  **Reasoning:** This changes the legal relationship between citizen and utility (Settling) and locks the city into a vendor-managed hierarchy for critical infrastructure (Structural).
  **Action:** Hold procurement. Refer to Council. Question: "Does the Council authorize shifting disconnection authority from the Courts to a private vendor's algorithm?"

  ***

  ## CASE 3: Adaptive Traffic-Signal Procurement
  **Input:** Continuous vehicle/pedestrian detection. 10-year single-vendor analytics contract. Federal grant deadline (9 weeks).
  **File:** Justified by emissions/safety. Mayor announced project.

  **Procedure Run:**
  1.  **Q1 (Forced-Choice):** Is single-vendor analytics required by the Federal Grant?
      *   *Missing Fact:* Does the grant mandate the specific vendor, or just "adaptive signal technology"?
      *   *Call:* Project Manager.
      *   *Scenario A (Grant mandates vendor):* **ROUTINE.** (Forced by external funding law).
      *   *Scenario B (Grant allows competition, PM chose single-vendor for speed):* **Continue.**
      *   *Assumption for Review:* Scenario B is the norm. Grants rarely mandate specific commercial vendors, only performance standards. Proceeding under Scenario B.
  2.  **Q2 (Ten-Year):** Can we reverse in 10 years? *No.* 10-year contract + proprietary data format likely locks out competitors.
  3.  **Q3 (Silence Rule):** Is the spec silent about a consequence? *Yes.* Continuous detection creates a surveillance record. File cites "safety," not "data retention/policy."
      *   *Finding:* **SETTLING.**
  4.  **Q4 (Organization):** Does this require a specific hierarchy? *Yes.* Centralized analytics managed by one vendor for a decade.
      *   *Finding:* **STRUCTURAL.**

  **Verdict:** **COMPOUND.**
  **Disposition:** **Referral.**
  **Honest Assessment:** The procedure does **not** clear this. The pressure (Mayor/Grant) does not override the Structural lock-in and the Settling of privacy norms.

  **Draft Referral Note to Council:**
  > **Subject:** Referral of Traffic Signal Analytics Procurement (Grant ID #XXXX)
  > **Finding:** COMPOUND (Settling + Structural)
  >
  > The Technical Review Office flags this specification not on the merit of safety or emissions reduction, but on the governance structure required to achieve them. The current procurement locks the City into a single-vendor data environment for ten years. This creates a structural dependency where traffic management relies on proprietary algorithms we cannot audit. Furthermore, the continuous detection capability settles a privacy question—specifically, the retention of movement data—that the Council has not yet debated.
  >
  > We recommend the Council explicitly vote on two questions before authorization: (1) Does the City accept a ten-year dependency on a single vendor for traffic logic? (2) What data retention policy applies to the pedestrian and vehicle tracking this system enables? If the answer to either requires further study, the procurement must be paused to avoid cementing a policy decision by technical default.

  **Missing Fact & Outcome Variance:**
  *   **Fact:** Does the Federal Grant *actually* require the single-vendor solution?
  *   **Who to Call:** Federal Grants Administrator (not Project Manager, who may be optimistic).
  *   **Outcome if YES:** Label becomes **ROUTINE** (Forced by external law). The political consequence is absorbed by the Federal mandate.
  *   **Outcome if NO:** Label remains **COMPOUND**. The speed of the grant deadline does not justify foreclosing Council policy on data privacy and vendor lock-in.
