  **The Unused Room**

  The fever burns the forehead through the night,
  And grief arrives upon the scheduled train.
  A scraped knee weeping in the fading light,
  The one sure promise that is kept is pain.

  I grant the warmth of sun upon the skin,
  The taste of fruit, the comfort of a bed.
  The laughter rising from the deep within,
  Where love is spoken and the fear is fled.

  Think of the house where no one draws a breath,
  There is no hurt waiting in the hall.
  This safety is not canceled out by death,
  It stands as gain, though no one hears the call.

  The joy unwitnessed is no debt unpaid,
  For there is no one left to feel the slight.
  Unless I love the shadow I have made.
