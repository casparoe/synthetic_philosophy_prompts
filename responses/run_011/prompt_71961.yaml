  Two apples shine exactly red,
  Bound by a question in the air,
  What lies beneath the colorful spread?

  One pattern hangs above the air,
  Distinct, and walking its own way,
  To claim the many as its share.

  But if it walks the selfsame way,
  Wholly here and wholly there,
  Not divided by the light of day.

  Or say each redness waits elsewhere,
  A unique particular tint and face,
  No duplicate exists anywhere.

  Just clusters grouped by similar face,
  Creatures with hearts mark out the part,
  Though kidneys fill the selfsame space.

  What binds the member to the part?
  A tie that holds the bundle near?
  Or does the binding tear apart?

  Nothing lies beyond what's here.
