answer: |-
  This is one of the most debated questions in Thomistic political philosophy. You have read the texts closely, but the conclusion that Aquinas gives a "green light" for private assassination is one he explicitly pulls back from in the very same chapter.

  While Aquinas acknowledges that tyranny is a grave evil and that resisting it is not necessarily sedition, he **does not** authorize a private individual to assassinate a tyrant on their own authority. He maintains the principle that the power of the sword belongs to public authority, but he redefines who holds that authority when a king becomes a tyrant.

  Here is how Aquinas squares the circle in *De Regno* (On Kingship) I.6 and the *Summa Theologiae*.

  ### 1. The Public Authority Constraint
  You are correct that Aquinas holds the principle (from *Summa* II-II, q. 64, a. 3) that killing is lawful only for someone acting under public authority. A private person killing another is murder, even if the victim is wicked, because the private person lacks the commission to act for the common good.

  The question, then, is: **Does a tyrant forfeit his authority in such a way that it reverts to every private individual?**

  Aquinas says **no**. It does not revert to *individuals*; it reverts to the **community** or a **superior authority**.

  In *De Regno* I.6, Aquinas outlines a hierarchy of remedies:
  1.  **Appeal to a Superior:** If the tyrant is a subordinate ruler (e.g., a duke under an emperor), the proper recourse is to appeal to the higher authority to depose him.
  2.  **Action by the Community:** If there is no earthly superior (e.g., the king is the supreme authority), Aquinas argues that if the community originally had the right to *elect* the king, they retain the right to *depose* him.

  This is the crucial distinction regarding your question about the "crowd." For Aquinas, the community acting to depose a tyrant is not a "mob" acting privately; it is the **corporate body politic** exercising its residual public authority. It is a public act of justice, not a private act of violence.

  ### 2. The Biblical Examples (Ehud, Judith, etc.)
  You noted that Aquinas brings up Ehud (Aod) and Judith without condemning them. This is true, but his treatment of them is descriptive, not prescriptive for normal political life.

  Aquinas views these figures as acting under **extraordinary divine inspiration**, not as precedents for human law.
  *   In the *Summa* (II-II, q. 64, a. 3, ad 2), when discussing whether it is lawful to kill sinners, he notes that private individuals may do so only if moved by "instinct of the Holy Spirit," citing Phinehas and Elijah.
  *   In *De Regno*, he cites the Old Testament examples to show that God sometimes delivers people from tyrants through singular individuals. However, he does not derive a political right from this. He treats these as miracles of providence, not a legal statute for citizens.

  To Aquinas, a private citizen cannot claim to be the next Judith unless they have a revelation equivalent to hers. Since such revelation cannot be verified politically, it cannot be the basis of a political theory.

  ### 3. The Prudential Warning (Why not assassinate?)
  In *De Regno* I.6, Aquinas actually argues *against* private assassination on prudential grounds. He writes:

  > "For it often happens that when a tyrant is deposed by a subject, another succeeds who is worse than the first... Moreover, it frequently happens that while someone attempts to kill a tyrant, he is killed himself, and then the tyrant, becoming more fearful and more cruel, oppresses the people more severely."

  Here, Aquinas applies his consequentialist caveat found in the *Summa* on sedition (II-II, q. 42, a. 2). There he says resisting a tyrant is not sedition *unless* the resistance causes greater disorder than the tyranny itself. Private assassination, he argues, almost always causes greater disorder (civil war, worse successors, martyrdom without liberation).

  ### 4. Is the "Community" route just a crowd?
  You asked: *Is the "the community can depose him" route just the same act done by a crowd instead of one guy, or something different in kind?*

  For Aquinas, it is **different in kind**.
  *   **Private Assassination:** An individual acts on private judgment. This violates the natural order where the part (individual) cannot judge the whole (the ruler).
  *   **Public Deposition:** The community acts as the source of authority. If the king's authority is derived from the consent of the community (a proto-social contract view Aquinas flirts with), then when the king violates the terms of the kingship (the common good), the authority flows back to the source.

  When the community deposes the king, they are not acting as a collection of private individuals; they are acting as the **public authority** that originally constituted the king. It is a judicial act, not an act of war or murder.

  ### 5. Summary: How it Squares
  Aquinas resolves the tension between "killing requires public authority" and "tyrants may be removed" as follows:

  1.  **The Tyrant's Status:** A tyrant rules for private gain, not the common good. Therefore, his rule is not fully legitimate.
  2.  **The Transfer of Authority:** Because his rule is illegitimate, the authority to use force against him does not belong to private individuals (who never had it) but returns to the **public body** (the community) or a **higher sovereign**.
  3.  **The Prohibition:** A private individual acting on their own initiative commits murder/sedition because they usurp a judgment that belongs to the public.
  4.  **The Exception:** The only exception is direct divine command (Biblical judges), which is outside the scope of political philosophy.

  ### Conclusion
  Aquinas does **not** give a green light for private assassination. He gives a green light for **public deposition**.

  If you read *De Regno* I.6 carefully, you will see he spends more time warning against the dangers of private attempts than encouraging them. He concludes the chapter by saying the best remedy is to *choose a good king in the first place* so you don't have to depose a bad one.

  Later Scholastics (like Juan de Mariana in the 16th century) would go further and argue for private tyrannicide under specific conditions, but they were aware they were moving beyond Aquinas's caution. Aquinas keeps the sword in the hand of the *res publica* (the public thing), even when that public must act against its own head.
