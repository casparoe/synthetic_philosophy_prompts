  # Brainstorming Pass

  *   **Candidate Diagnoses:**
      *   (g) **Metaphysical Vagueness:** "Cognitive system" is a vague predicate like "heap." The debate tries to force a sharp boundary on a sorites series.
      *   (h) **Explanatory Pragmatism:** The dispute isn't about what *is* the mind, but which individuation strategy yields better scientific models. The stalemate exists because both sides claim equal explanatory power without rigorous comparison.
      *   (i) **Normative Disguise:** The debate is covertly about responsibility and agency. If the notebook is part of the mind, M. is responsible for its errors in a way she isn't for a library book. The metaphysics is a proxy for ethics.
      *   (j) **Vehicle/Content Conflation:** Hypothesis (e) is strong. Critics assume vehicles must be neural; proponents argue content determines vehicle. The stalemate is a category error regarding vehicles.
  *   **Candidate Tie-Breakers:**
      *   **Intervention Stability:** Does manipulating the notebook produce changes in behavior identical to manipulating neural tissue? If yes, favors extension.
      *   **Prediction Error:** Does modeling M. as an extended system reduce prediction error regarding her retrieval failures compared to an internalist model?
      *   **Pathology Response:** How does each side handle M.'s distrust of specific drawers? Internalism says "internal skepticism." Extensionalism says "partial system failure."
      *   **Case M. Specific:** The graded trust and domain-specificity suggest the "system" boundary shifts with task context. This supports (f) and (h) over (a) or (c). If the boundary moves, it's not a natural kind (refuting critics) but not merely verbal (refuting trivializers).
      *   **Universal Accommodation:** If every diagnosis fits Case M., it suggests the case is underdetermined by the metaphysics. This would imply the debate lacks empirical traction entirely.

  # The Diagnosis Proper

  The stalemate persists not because the arguments are weak, but because the debate is structured as a metaphysical dispute over individuation while functioning as a methodological dispute over explanation. Both sides beg the question, but at different levels. The critics (Adams and Aizawa) beg the question by assuming that the "mark of the cognitive" must be intrinsic to the organism—typically neural or biological. This is not an empirical finding but a metaphysical constraint imposed prior to analysis. When they charge the coupling-constitution fallacy, they are asserting that causal interaction cannot constitute identity. This is only true if one assumes a substance metaphysics where boundaries are fixed by material continuity rather than functional organization.

  The proponents (Clark and Chalmers) beg the question in the opposite direction. They assume that functional isomorphism or complementarity is sufficient for constitutive relevance. By relying on the parity principle, they presuppose that the location of a process is irrelevant to its cognitive status, provided the input-output profile matches. This ignores the possibility that internal processes have properties (e.g., phenomenal unity, biological regulation) that external processes lack, regardless of functional output. When they retreat from isomorphism to complementarity, they loosen the criteria so much that the "cognitive" label risks losing discriminatory power, inviting the bloat objection.

  Case M. illuminates this structural impasse. Her relationship with the catalogue is graded (drawer-by-drawer trust) and domain-relative (effective in specialty, misfiring in politics). For the proponent, this is evidence that cognitive systems are dynamic and task-specific; the boundary of M.'s mind expands and contracts based on integration levels. The graded trust fits a model of varying coupling strength. For the critic, this is evidence that the notebook is *not* part of the mind. If it were constitutive, trust should be uniform (like trust in one's own memory), or the failure in the political domain should count as a cognitive deficit of the *system*, not just the tool. The critic sees the domain-specificity as proof that the catalogue is a tool used by a mind, not part of the mind itself.

  Crucially, both sides can accommodate Case M. without changing their core position. The proponent says the system is "partially extended" or "extended relative to a task." The critic says the system is "coupled" but not "constituted." Because both sides can describe the exact same empirical phenomena (the retrieval success, the graded trust, the domain failure) using their own terminology, no empirical data about M.'s neural firing or lookup times will settle the dispute. This confirms hypothesis (d) and (f) but deepens them: the disagreement is about *individuation principles* required for explanation, not the empirical facts of coupling. The question-begging occurs because neither side accepts the other's principle of individuation as legitimate. The critic demands intrinsic boundaries; the proponent demands functional boundaries. Since neither principle is empirically falsifiable on its own, the debate cycles endlessly.

  # Account of Progress

  Given this diagnosis, progress cannot come from better intuition pumps or more detailed empirical data about coupling dynamics. Data alone cannot dictate metaphysics. Progress requires shifting the question from "Where is the mind?" to "What individuation principle yields the most robust explanatory models?" We must treat system boundaries as hypothesis-dependent rather than discovery-dependent.

  To achieve this, we need a formal criterion of system individuation that is explicitly interest-relative. Instead of asking if the notebook is *really* part of the mind, we ask: "Does modeling M. plus the catalogue as a single unit reduce computational complexity or increase predictive accuracy regarding her historical retrieval compared to modeling them as separate units?" Progress looks like a pragmatic framework where 'extended cognition' is a modeling stance, not a metaphysical claim.

  Decisive refutation of the extended mind thesis would not come from showing that notebooks lack consciousness or intrinsic properties. It would come from demonstrating that treating external resources as constitutive leads to systematic *explanatory failures* that internalist models avoid. For example, if modeling M. as an extended system consistently fails to predict her retrieval errors in the political domain (because the model assumes integration where there is none), while an internalist model (treating the catalogue as a distinct variable) successfully predicts the error based on mismatched schemas, then the extended model is pragmatically inferior. Refutation requires showing that the extended stance is *less* scientifically useful, not that it is metaphysically false. Conversely, if the extended model allows for successful interventions (e.g., modifying the catalogue structure to improve neural retrieval) that the internalist model cannot conceive, the extended stance gains validity. The tie-breaker is explanatory utility, not ontological truth.

  # Statement of Diagnosis

  I defend a refined version of hypothesis (f) combined with (d): the debate is stalled because it seeks a binary metaphysical boundary for a phenomenon that is graded and interest-relative, while masking a methodological disagreement about explanatory individuation as an ontological dispute. I am highly confident in this diagnosis because it explains why empirical data fails to move the needle: the parties are arguing over the rules of modeling, not the data being modeled. Your framing is largely fair, but it leans slightly towards the extensionalist perspective by characterizing the critic's demand for a "mark of the cognitive" as an insistence rather than a legitimate methodological constraint for certain types of scientific explanation. Additionally, hypothesis (a) is dismissed too quickly; while not merely verbal, the dispute is verbally mediated because the term "cognitive" is doing too much work, carrying both ontological and explanatory weight that should be separated. The stalemate is not a failure of argument but a signal that the question "Is it part of the mind?" is the wrong question for cognitive science to ask.
