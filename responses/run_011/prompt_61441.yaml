answer: |-
  ### Brainstorming Candidate Concepts

  Before isolating the pattern, I need to test it against existing taxonomies in informal logic, philosophy of mind, and evidence theory. Below are the nearest conceptual neighbors, evaluated against the three specific features you identified: (1) Retroactive withdrawal (it was an illusion), (2) The prior error fuels skepticism (bias evidence), and (3) The reversal in unmodeled cases (absence of mechanism = presence of mind).

  1.  **Argument from Ignorance (*Ad Ignorantiam*)**
      *   *Fit:* Captures Feature 3 perfectly. Claiming "no mechanistic account exists, therefore mind exists" is a classic appeal to ignorance (lack of evidence for $A$ is treated as evidence for $B$).
      *   *Miss:* Fails to capture Features 1 and 2. An argument from ignorance doesn't necessarily require retroactively declaring past attributions illusory, nor does it inherently use past errors to lower baselines. It is usually a one-way move (gap -> truth), not a oscillating standard.

  2.  **God of the Gaps**
      *   *Fit:* Strong fit for Feature 3. This is the theological/scientific version of appealing to ignorance where "mind" or "consciousness" fills the explanatory vacuum left by current science.
      *   *Miss:* Like the above, it doesn't capture the *eliminativist* swing (Feature 1). A "God of the Gaps" proponent usually holds that the gap *always* indicates the special property. Your colleagues hold that the gap indicates mind *only until* a model appears, at which point the mind vanishes. The "God of the Gaps" is usually stable; your pattern is volatile.

  3.  **Special Pleading**
      *   *Fit:* Captures the asymmetry. Applying one standard to the corvid/chatbot (mechanism kills mind) and another to the unmodeled task (lack of mechanism saves mind) is a form of special pleading.
      *   *Miss:* Too general. "Special Pleading" describes the *structure* of unfairness but doesn't capture the *content* (mechanistic explanation) or the *retroactive* nature of the elimination. It doesn't explain *why* the standard shifts, only that it does.

  4.  **Moving the Goalposts**
      *   *Fit:* Captures the shifting standards. When a model appears, the requirement for "mind" shifts from "performance" to "lack of mechanism."
      *   *Miss:* Usually implies shifting standards to *save* a hypothesis from falsification. Here, the standards shift to *kill* a hypothesis (mind) when a model appears, and *save* it when one doesn't. It's a双向 (two-way) manipulation, not just a defensive retreat.

  5.  **Misapplication of Morgan's Canon**
      *   *Fit:* Highly relevant to your field. Morgan's Canon advises preferring lower-level explanations if they suffice. Your colleagues use this to withdraw attribution (Feature 1).
      *   *Miss:* Morgan's Canon is a heuristic for *choice between competing live hypotheses*. It does not license the claim that the higher faculty was an *illusion* retrospectively, nor does it license inferring the higher faculty simply because the lower one hasn't been modeled yet (Feature 3). It warns against over-attribution, not under-attribution in the absence of models.

  6.  **Eliminative Materialism**
      *   *Fit:* Captures Feature 1. The view that folk-psychological categories (like "understanding") are false and will be replaced by neuro/mechanistic accounts.
      *   *Miss:* Eliminativists are consistent. They would say the mind *never* exists, even in the unmodeled cases (Feature 3 violation). Your colleagues attribute mind when the model is missing. This is not consistent eliminativism; it is *conditional* eliminativism.

  7.  **Inference to the Best Explanation (IBE) Failure**
      *   *Fit:* The reasoning purports to be IBE. When mechanism exists, it's the best explanation. When it doesn't, mind is.
      *   *Miss:* In proper IBE, the *evidence* (the behavior) remains constant while hypotheses compete. In your pattern, the *evidential weight of the behavior itself* changes. In the modeled case, the behavior proves nothing; in the unmodeled case, it proves everything. This violates the stability of evidence required for valid IBE.

  **Conclusion of Brainstorming:** No single established term captures the tripartite structure (Retroactive Elimination + Bias Fueling + Gap-Filling Reversal). Existing terms cover fragments (God of the Gaps covers the reversal; Eliminativism covers the withdrawal), but the *dynamic interplay*—where the evidential value of behavior is inversely proportional to the availability of a mechanistic account—is unique. It requires a new designation.

  ***

  ### 1. Verdict on Naming

  There is no established concept in the literature that covers this pattern in its entirety. The closest cluster is a combination of **Special Pleading** and **God of the Gaps**, filtered through a misapplication of **Morgan's Canon**, but these do not capture the retroactive erasure of prior attributions or the specific dependency on the *state of the literature* rather than the *state of the evidence*.

  I propose coining the term: **The Explanatory Availability Double Standard (EADS)**.

  **Definition:**
  The Explanatory Availability Double Standard is a reasoning pattern in which the evidential weight assigned to a behavioral capacity for inferring mentality is made inversely dependent on the current availability of a mechanistic model for that capacity. It is characterized by three conjoint moves:
  1.  **Retroactive Elimination:** When a mechanistic model becomes available, prior mental attributions based on the behavior are declared not merely incorrect but illusory.
  2.  **Bias Amplification:** The prior error is cited as evidence of a systemic human tendency to over-attribute, lowering the baseline for future attributions in that category.
  3.  **Gap-Dependent Affirmation:** In cases where no mechanistic model exists, the behavior is treated as decisive evidence for mentality, precisely because the mechanistic rival is absent.

  This definition is tight enough to apply to new cases: If a researcher treats behavior $B$ as proof of Mind $M$ only when Model $A$ is unknown, and treats $B$ as proof of *no* Mind once $A$ is known, while claiming the prior belief was a delusion, they are employing EADS.

  ### 2. The Central Question: Legitimacy vs. Defect

  You ask whether this pattern is ever a legitimate inference. The short answer is: **No, not in the form you described.** While the individual steps mimic valid reasoning, the combination violates the principles of stable evidence and logical compatibility.

  **Why the whole is bad:**
  The defect lies in treating **explanatory sufficiency** as **ontological exclusion**.
  When a mechanistic account (e.g., reinforcement learning) successfully reproduces a behavior, it demonstrates that the mechanism is *sufficient* for the behavior. It does not demonstrate that the mechanism is *incompatible* with the mental state (e.g., understanding). In cognitive science and philosophy of mind, the dominant view is **multiple realizability** or **constitution**: mental states are often realized *by* mechanistic processes. Finding the mechanism explains *how* the mind works; it does not prove the mind is absent.

  The EADS becomes fallacious because it assumes a **Zero-Sum Game** between Mechanism and Mind.
  *   **Legitimate Move:** "A mechanistic account exists; therefore, we cannot infer mind *solely* from this behavior anymore because the behavior is ambiguous." (This lowers confidence).
  *   **Fallacious Move (EADS):** "A mechanistic account exists; therefore, the mind *was never there*, and the behavior is now evidence of nothing." (This zeroes the evidence).
  *   **Fallacious Move (EADS Reverse):** "No mechanistic account exists; therefore, the mind *must* be there." (This maximizes the evidence).

  **Conditions for Warranted Differential Standards:**
  A differential standard is only warranted if **Logical Incompatibility** is established, not just explanatory competition.
  1.  **Incompatibility:** You must show that the presence of Mechanism $A$ logically precludes Mental State $M$. (e.g., If $M$ is defined as "non-mechanical causation," then finding mechanical causation eliminates $M$. But this is a definition stipulation, not an empirical discovery).
  2.  **Fixed Criteria:** The standard for what counts as evidence must be fixed *before* the model is found. You cannot say "Behavior counts unless explained," because that makes the evidence hostage to the state of the literature rather than the state of the animal/system.
  3.  **Symmetry:** The standard must apply to the attributor's own case. If the absence of a mechanistic model for *human* chess reasoning is not taken as proof of human "mind" (because we assume humans have mechanisms we don't yet understand), then using that absence as proof of "mind" in corvids is special pleading.

  The pattern is question-begging because it defines "Mind" as "That which remains unexplained by mechanism." This guarantees that Mind will never be found in a modeled system, and will always be found in an unmodeled one, rendering the concept empirically vacuous. It protects the conclusion (either "no mind" or "mind") by adjusting the evidential rules to ensure the data always fits the desired ontological slot.

  ### 3. Operational Markers

  To distinguish a genuine differential standard (cautious inference) from the EADS (conclusion-protecting), a referee or reader should look for the following markers in the argumentation. These are designed to be usable by non-philosophers.

  **Marker 1: The Counterfactual Test**
  *   *Question:* "If a mechanistic model for this unmodeled capacity were published tomorrow, would you withdraw the mental attribution and call your current belief an illusion?"
  *   *EADS Response:* "Yes, obviously. Then we'd know it was just mechanics." (Indicates the attribution is contingent on ignorance).
  *   *Legitimate Response:* "No. The model would show *how* the capacity is implemented, but the capacity itself (and the associated mental state) would remain real." (Indicates compatibility).

  **Marker 2: The Compatibility Query**
  *   *Question:* "Is the mechanistic explanation proposed as a *rival* to the mental state, or as an *implementation* of it?"
  *   *EADS Response:* Treats them as rivals. "It's either cues OR understanding."
  *   *Legitimate Response:* Treats them as levels. "It's understanding *implemented via* cues."

  **Marker 3: The Baseline Consistency Check**
  *   *Question:* "Do you apply the 'absence of mechanism = presence of mind' rule to human cognition where the mechanism is also unknown?"
  *   *EADS Response:* "Humans are different; we know we have minds." (Without appealing to introspection, relying only on the lack of a full mechanistic model of human intuition).
  *   *Legitimate Response:* "I don't use absence of mechanism as proof for humans either; I use first-person access." (Acknowledges the evidential difference).

  **Marker 4: The Retroactivity Audit**
  *   *Question:* "When the model appeared, did you say 'We were uncertain before' or 'We were wrong before'?"
  *   *EADS Response:* "We were wrong/fooled." (Implies the evidence never existed).
  *   *Legitimate Response:* "We were uncertain/overconfident." (Implies the evidence was ambiguous).

  ### 4. The Edges

  Here are three cases that resemble the pattern but are not instances of EADS, clarifying the boundaries.

  **Case 1: Logical Incompatibility (Not EADS)**
  *   *Scenario:* A researcher claims a device moves via "telekinetic force." A mechanistic account shows it moves via hidden magnets. The researcher withdraws the attribution of telekinesis and says it was an illusion.
  *   *Why it's not EADS:* Telekinesis is *defined* as non-mechanical. The mechanism is logically incompatible with the claim. Withdrawing the attribution is correct. EADS applies when the mental term (e.g., "understanding") is compatible with mechanism, but treated as if it were not.

  **Case 2: Honest Anti-Reductionism about Phenomenology (Not EADS)**
  *   *Scenario:* A philosopher argues that no mechanistic account of neural firing can explain the *qualitative feel* (qualia) of pain. They argue that because mechanism explains function but not feel, the feel is a distinct ontological category.
  *   *Why it's not EADS:* This position holds even if a perfect mechanistic model of the brain exists. They are not waiting for a gap to appear; they are arguing the gap is *permanent* and principled (The Hard Problem). They do not withdraw the attribution of pain when mechanisms are found; they insist the mechanism doesn't capture the *whole* story. EADS withdraws the attribution entirely; Anti-Reductionism preserves it alongside the mechanism.

  **Case 3: Methodological Behaviorism (Not EADS)**
  *   *Scenario:* A strict behaviorist says, "I never attribute minds, only behaviors. Whether a model exists or not, I describe only the input-output relations."
  *   *Why it's not EADS:* This is a consistent denial of mental attribution across the board. EADS requires the *oscillation*: attributing mind when the model is missing, denying it when the model is present. The behaviorist never attributes, so they do not flip.

  ### 5. Your Instance (The Chess Program vs. Self)

  You asked for a direct answer regarding your own asymmetry: denying understanding to the program (because mechanism is known) while affirming it for yourself (because mechanism is unknown/unavailable).

  **Verdict:** This **is** an instance of the Explanatory Availability Double Standard, unless you can ground your self-attribution in something other than the absence of a mechanistic account.

  **Analysis:**
  You state: "I am now sure [the program] does not [understand]... I am equally sure that I understand chess, and I would not defend that claim by pointing at my moves."

  *   **The Trap:** If your certainty that *you* understand rests on the fact that *you cannot explain your own cognition mechanistically* (i.e., "I just 'see' the move"), then you are employing Feature 3 of EADS (Gap = Mind). You are treating the opacity of your own neural processing as evidence of a non-mechanical mental state.
  *   **The Defense:** You hint at a defense: "I would not defend that claim by pointing at my moves." This suggests you rely on **first-person phenomenology** (introspection). You feel understanding. The program does not report feelings.
  *   **The Problem:** If you rely on introspection, the asymmetry is justified by **access**, not by **mechanistic availability**. However, most researchers who fall into EADS do not admit they are using the gap. They say, "The program is just calculation; I am not." But if pressed on *how* they know they are not just calculation, they often reply, "Because I can't reduce my thought to calculation."
  *   **Direct Answer:** If your claim "I understand" relies on the premise "My cognition cannot be fully modeled mechanically," you are committing the fallacy. If your claim relies on "I have immediate access to my intentional states which is distinct from behavioral output," you are making a Cartesian claim. This avoids EADS but invites other philosophical problems (privilege of the first-person).
  *   **Recommendation:** To avoid the pattern, you must acknowledge that the *presence* of a mechanistic account for the program does not logically entail the *absence* of understanding, unless you define understanding as "non-mechanical." If you accept that humans are also mechanistic systems (whose mechanisms are just less known), then the program's mechanism should not eliminate its understanding, only explain it. The asymmetry is defensible only if you claim **privileged access** to your own mind, not if you claim **ignorance of your own mechanism** is proof of your mind.

  The pattern is seductive because it feels like scientific rigor (demanding mechanisms) while preserving human exceptionalism (we have minds when we can't be modeled). But logically, it makes "mind" a placeholder for "what we haven't figured out yet," which ensures it will disappear as soon as we do.
