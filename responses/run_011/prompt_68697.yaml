  # Diagnostic Decision Tree: De Re Modality

  **Fixed Starting Point:** All participants grant that some singular modal claims are true and others false (e.g., *This candidate might have won, but could not have been an octave taller*), and that quantifying over possible worlds is a legitimate way of systematizing such facts. This tree maps disagreements about *what makes* those claims true.

  **Instructions:** Proceed through the nodes in order. At each node, select the option that best matches your pre-theoretical intuition about the described scenario. Record your path (e.g., 1A, 2B, 3A...) to locate your leaf at the end.

  ---

  ### Node 1: The Truthmaker
  **Scenario:** Consider the claim "You could have been taller."
  **Question:** What makes this claim true?
  *   **(A)** It is made true by a brute power or potentiality inherent in you, without needing to point to a distinct world.
  *   **(B)** It is made true by a relation between you and individuals or states of affairs at other worlds.

  ### Node 2: The Duplicate (Case a)
  **Scenario:** A world contains exactly one individual who matches your entire qualitative history and intrinsic nature (memories, shape, matter), but originated from different gametes.
  **Question:** When we say "You could have lived there," is that true because that individual *is* you (one and the same person), or because they are *sufficiently like* you?
  *   **(A)** Is You.
  *   **(B)** Sufficiently Like.

  ### Node 3: The Sortal Shift (Case e)
  **Scenario:** Consider the claim "You could have been made of entirely different matter." Evaluate this claim first regarding you as a *Person*, then regarding you as a *Human Organism*.
  **Question:** Does the truth-value of the claim change depending on which description we use?
  *   **(A)** Changes.
  *   **(B)** Stays Same.

  ### Node 4: The Twins (Case c)
  **Scenario:** A world contains two near-duplicates of you. One achieves what you desire; the other fails.
  **Question:** Is the claim "You could have succeeded" simply true, or does its truth depend on which duplicate is being focused on?
  *   **(A)** Simply True.
  *   **(B)** Depends on Focus.

  ### Node 5: The Spheres (Case b)
  **Scenario:** A world contains exactly two qualitatively indiscernible iron spheres. In one possibility, they persist as they are. In another, their future roles are exchanged with no qualitative difference anywhere.
  **Question:** Is the exchanged scenario a *different* possibility than the unexchanged one?
  *   **(A)** Different Possibility.
  *   **(B)** Same Possibility.

  ### Node 6: The Grounding
  **Scenario:** (For those who answered "Is You" at Node 2 and "Same Possibility" at Node 5). If the same individual exists in two worlds, what explains this?
  **Question:** Is it explained by the individual sharing fundamental properties across worlds, or is it a primitive fact with no further explanation?
  *   **(A)** Explained by Properties.
  *   **(B)** Primitive Fact.

  ### Node 7: The Presence (Orthogonal Axis)
  **Scenario:** You exist in another world.
  **Question:** Do you exist there as a living, breathing entity, or as a constituent of a maximal description/story?
  *   **(A)** Living Entity.
  *   **(B)** Constituent of Description.
  *(Note: This node tracks an ontological axis often treated as orthogonal to the modal dispute, but included here to isolate a required position.)*

  ### Node 8: The Nesting (Case f)
  **Scenario:** At a world containing your duplicate, consider what *that duplicate* could have gone on to do next.
  **Question:** Does that depend on facts about *you* in the actual world, or only on facts at the duplicate's world?
  *   **(A)** Depends on Actual You.
  *   **(B)** Only Their World.

  ---

  ### Key: Mapping Paths to Leaves

  **Leaf 1: Primitivist / Modalist**
  *   **Path:** 1A.
  *   **Description:** De re modal claims are made true by the individuals themselves (powers/potentialities), with no relation of identity or resemblance to other worlds doing the work.
  *   **Status:** Standard characterization.

  **Leaf 2: Contextual Counterpart**
  *   **Path:** 1B → 2B → 3A.
  *   **Description:** A counterpart-style view on which the relation in force varies with the question asked (e.g., person vs. organism). Truth-values shift with conversational context.
  *   **Status:** Standard characterization (Lewisian contextualism).

  **Leaf 3: Fixed Counterpart**
  *   **Path:** 1B → 2B → 3B → 4A → 8B.
  *   **Description:** A counterpart-style view with a single contextually fixed similarity relation. Multiplicity is handled by 'best match'; nesting is internal.
  *   **Status:** Standard characterization.

  **Leaf 4: Externalist Counterpart (Unnamed)**
  *   **Path:** 1B → 2B → 3B → 4A → 8A.
  *   **Description:** A counterpart-style view where what a duplicate can do depends on relations to the actual world. Coherent but rarely defended as a standalone system.
  *   **Status:** Coherent but unattractive/unexplored.

  **Leaf 5: Haecceitist TWI**
  *   **Path:** 1B → 2A → 5A.
  *   **Description:** A view that accepts the swap possibility in (b). Individual essences or thisnesses ground recurrence across worlds.
  *   **Status:** Standard characterization.

  **Leaf 6: Bare TWI**
  *   **Path:** 1B → 2A → 5B → 6B.
  *   **Description:** Transworld identity with no further individuating machinery. It is just you, with no properties explaining the identity.
  *   **Status:** Contested reconstruction (some argue this collapses into Haecceitism).

  **Leaf 7: Concrete Essentialist TWI**
  *   **Path:** 1B → 2A → 5B → 6A → 7A.
  *   **Description:** A view that denies the swap while keeping transworld identity. You recur across concrete worlds in virtue of shared fundamental properties.
  *   **Status:** Standard characterization (e.g., Kripkean).

  **Leaf 8: Actualist TWI**
  *   **Path:** 1B → 2A → 5B → 6A → 7B.
  *   **Description:** An actualist leaf on which worlds are abstract and the very same individuals recur in them (as constituents of descriptions).
  *   **Status:** Standard characterization (e.g., Plantinga).

  ---

  ### Empty Combinations & Diagnostics

  **Combination:** 1B → 2B → 3B → 4B (Counterpart, Fixed, Multiplicity False).
  *   **Diagnosis:** **Incoherent.** If truth is based on similarity (2B) and context is fixed (3B), the existence of a successful duplicate should make the claim true. Denying this contradicts the similarity basis.

  **Combination:** 1B → 2A → 5A → 6A (Haecceitist + Property Grounding).
  *   **Diagnosis:** **Incoherent.** If the swap is a different possibility (5A), then properties cannot individuate the spheres (since they are indiscernible). Grounding identity in properties (6A) contradicts accepting the swap (5A).

  **Combination:** 1B → 2A → 5B → 6B → 7B (Bare TWI + Actualist).
  *   **Diagnosis:** **Coherent but Unattractive.** Combining Bare Identity with Actualism removes the motivation for Actualism (which usually relies on essences to individuate abstract constituents). Nobody finds this attractive, though it is not logically impossible.

  ---

  ### Indistinguishable Leaves & Housekeeping

  **Pair:** Leaf 5 (Haecceitist TWI) and Leaf 6 (Bare TWI).
  *   **Issue:** Both accept Transworld Identity. Haecceitism *is* a form of "thisness," which Leaf 6 denies ("no further machinery"). However, in practice, accepting the Swap (Leaf 5) usually commits one to thisnesses.
  *   **Resolution:** These are one position under two descriptions for most purposes. Leaf 6 is included to capture the intuition that identity might be brute *without* committing to swap possibilities (e.g., if one denies the Swap for other reasons).
  *   **Extra Question:** "If two individuals share all properties across all worlds, are they one or two?" (Yes=Haecceitist, No=Qualitative Essentialist).

  **Pair:** Leaf 7 (Concrete Essentialist) and Leaf 8 (Actualist TWI).
  *   **Issue:** Both are TWI + Essences. They differ only on the concreteness of worlds.
  *   **Resolution:** As noted in Node 7, this axis is orthogonal to the *de re* modality dispute. The tree separates them only to satisfy the leaf inventory requirement. Modal intuitions (Nodes 1-6) will be identical for both.

  **Epistemic Housekeeping:**

  *   **Leaf 1 (Primitivist):** Standard. Live dispute exists on whether this is a distinct view or merely a refusal to analyze modality.
  *   **Leaf 2 (Contextual CT):** Standard. Live dispute: whether context-sensitivity undermines the utility of the theory.
  *   **Leaf 3 (Fixed CT):** Standard. Live dispute: whether a single similarity metric can handle all sorts of modal claims.
  *   **Leaf 4 (Externalist CT):** Unnamed. Marked as unexplored.
  *   **Leaf 5 (Haecceitist TWI):** Standard. Live dispute: whether Case (b) is fatal to qualitative views or merely counterintuitive.
  *   **Leaf 6 (Bare TWI):** Contested reconstruction. Some argue "Bare TWI" is unintelligible without Haecceities.
  *   **Leaf 7 (Concrete Essentialist):** Standard. Live dispute: whether concrete recurrence is metaphysically possible (Principle of Identity of Indiscernibles).
  *   **Leaf 8 (Actualist TWI):** Standard. Live dispute: whether abstract worlds can support *de re* reference without collapsing into Counterpart Theory.
  *   **Case (a) Fatalness:** It is a matter of live dispute whether the Duplicate Scenario is fatal to TWI views or merely an awkwardness they can absorb (via contingent identity or similar moves). This tree treats it as a sorting intuition, not a refutation.
  *   **Essence vs. Thisness:** It is a matter of live dispute whether the Essence-grounded leaf collapses into the Bare TWI leaf. This tree treats them as distinct based on the "Grounding" node.
