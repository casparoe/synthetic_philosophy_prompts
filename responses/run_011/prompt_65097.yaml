answer: |-
  ### Part I: The Ledger Restatement

  Here is the reparations debate restated strictly within the constraints of a settlement infrastructure schema.

  **The Original Transaction (TXN_ORIG)**
  The historical injustice (enslavement, expropriation) is a committed transaction in the ledger. It transferred value from Participant Group A to Participant Group B. The transaction is historically verified but morally flagged.

  **The Void Request**
  Claimants argue TXN_ORIG should be treated as **Void**. This asserts the transaction never legally committed.
  *   **System Constraint:** A Void is only legal if no downstream processes consumed the effects of TXN_ORIG.
  *   **Rejection Logic:** The current economic state, demographic distribution, and even the existence of current Participant Records are downstream dependencies of TXN_ORIG. To Void TXN_ORIG would trigger a **Tainted Rollback**. It would invalidate the current state of the ledger. The system forbids this to prevent total ledger corruption.

  **The Reversal Request**
  Claimants argue for a **Reversal**. TXN_ORIG remains on the ledger, but a forward entry offsets the exact amount.
  *   **System Constraint:** A Reversal requires the original amount to be determinate.
  *   **Rejection Logic:** The value of TXN_ORIG includes compounding interest, opportunity cost, and non-financial value over 15+ years (generations). The audit trail is incomplete. The system cannot calculate a deterministic offset amount.

  **The Compensation Proposal**
  The State (a Participant with Network Liability) proposes a **Compensation** entry.
  *   **Logic:** This is a new transaction. The amount is not derived from TXN_ORIG but is set by Policy (Legislature).
  *   **Liability Routing:** The Originating Institution (e.g., specific plantation owners, colonial charters) no longer exists. The debate is whether Liability transfers to the Network (the State) by succession, or if it is orphaned debt.
  *   **New Participants:** Immigrants (joined 1995) argue they are not liable for TXN_ORIG as they were not Participants at the time of commit. Counter-argument: They benefit from Network effects established by TXN_ORIG, so they inherit Liability via contract of citizenship.

  **The Claimant Cohort**
  Claimants are not Named Parties (the direct victims are deceased). They are a **Cohort** defined by lineage rules.
  *   **Mapping Issue:** Linking Cohort members to TXN_ORIG requires fuzzy joins on genealogical data.
  *   **Idempotency:** If a Cohort member receives Compensation, they cannot receive it again. However, if the Policy changes, is a second payment a violation of idempotency (paying twice for the same claim) or a new Compensation event?
  *   **The Existence Paradox:** Some argue that if TXN_ORIG were Voided, specific Cohort members would not exist (their ancestors wouldn't have met). In ledger terms, their Participant Record depends on the validity of a Tainted Transaction.

  **Settlement**
  The debate over "when does it end" is a debate over **Settlement**.
  *   **Current State:** The ledger is effectively in an open batch. Claims can be reopened indefinitely.
  *   **Proposal:** A Compensation event triggers **Settlement**. The batch closes. No further claims regarding TXN_ORIG are accepted. The ledger reaches a terminal state.
  *   **Objection:** Moral claims do not have a TTL (Time To Live). Forcing Settlement is an administrative truncation of valid debt.

  ***

  ### Part II: The Residue Report

  Here is the analysis of the translation fidelity.

  #### 1. Clean Translations (High Fidelity)
  *   **Tainted Rollback (The Void Problem):** This is the strongest mapping. Your rule that "a void is only legal if nothing downstream consumed its effects" maps perfectly to the philosophical objection that "you can't undo history without unraveling the present." The technical prohibition on Tainted Rollbacks explains *why* restoration to the pre-injustice state is structurally impossible, not just politically difficult.
  *   **Idempotency:** The fear of "double dipping" or the administrative nightmare of tracking who has already been paid translates cleanly. The technical constraint (prevent duplicate processing) matches the political constraint (fairness/fiscal sustainability).
  *   **Liability Succession:** The question of whether a modern corporation (or State) inherits the debt of a merged/acquired entity is a standard problem in settlement. Translating "State continuity" to "Successor Liability" loses very little nuance.

  #### 2. Distorted Translations (Warning: Smuggling Detected)
  *   **Compensation Amount:**
      *   *Ledger Assumption:* Every obligation has a determinate amount.
      *   *Philosophical Reality:* "You can't put a number on it."
      *   *Distortion:* To translate this, I forced the moral claim into a `Compensation` entry, which *requires* a number. This smuggles the assumption that the debt *can* be quantified. In your system, a transaction without an amount is invalid. In the moral debate, the refusal to quantify is often the point. The translation works only if you treat the Policy Amount as arbitrary, which feels unsatisfying to the claimant.
  *   **Cohorts vs. Named Parties:**
      *   *Ledger Assumption:* Cohorts are defined by clear join keys (e.g., `parent_id`).
      *   *Philosophical Reality:* Lineage is messy, cultural, and sometimes non-biological.
      *   *Distortion:* The ledger demands a schema for the Cohort. The debate is often *about* the schema (who counts as a descendant?). The translation hides the friction of defining the keys.
  *   **Settlement:**
      *   *Ledger Assumption:* Ledgers must close. Reconciliation requires a terminal state.
      *   *Philosophical Reality:* Justice might be perpetual.
      *   *Distortion:* Translating "end of reparations" to "Settlement" implies the job is done. In politics, "Settlement" looks like "Silencing." The technical virtue (finality) is the moral vice (erasure).

  #### 3. No Expression (The Null Set)
  *   **The Existence Paradox:**
      *   *Ledger Logic:* If Record B depends on Tainted Transaction A, Record B is suspect/orphaned.
      *   *Moral Logic:* Record B (the descendant) is a valid moral agent *despite* depending on Transaction A.
      *   *Residue:* Your infrastructure cannot model "Valid Existence arising from Invalid Transaction." In a ledger, if the parent commit is rolled back, the child record is an anomaly. In morality, the descendant's claim is valid *because* of the injustice, not invalidated by their dependence on it. The ledger treats this dependency as corruption; the philosophy treats it as the basis of the claim.
  *   **Acknowledgment vs. Transfer:**
      *   *Ledger Logic:* A transaction moves value. Metadata (notes) is secondary.
      *   *Moral Logic:* Acknowledgment (changing the metadata) is sometimes the primary value, independent of the transfer.
      *   *Residue:* Your system optimizes for balance accuracy, not narrative truth. A `Reversal` balances the books but doesn't necessarily change the status of `TXN_ORIG` from "Successful" to "Atrocity." The ledger tracks *state*, not *meaning*.
  *   **Moral Liability vs. Contractual Liability:**
      *   *Ledger Logic:* Liability is assigned by contract or network rule.
      *   *Moral Logic:* Liability can arise from causal connection or benefit, even without contract.
      *   *Residue:* The immigrant who arrived in 1995 has no contract with the 1865 ledger. The ledger cannot assign them liability without a new contract (citizenship/tax law). The moral argument is that *benefit* creates liability. Your system has no field for `unjust_enrichment_flag` that auto-generates debt.

  ***

  ### Part III: The Verdict on Your Hunch

  **Your Hunch:** *Much of the debate is people demanding Voids when only Compensations are available, and then being baffled that the Compensation feels like it doesn't reach the thing.*

  **Assessment:** You are correct, but the diagnosis is incomplete.

  1.  **The Void/Compensation Mismatch:** You have identified the primary structural friction. Claimants often speak in the language of **Void** ("Make it like it never happened," "Restore what was stolen"). The State can only execute **Compensation** ("Here is a check based on current policy").
      *   A **Void** erases the sin.
      *   A **Compensation** admits the sin and prices it.
      *   The "bafflement" you observe is the emotional gap between *erasure* and *pricing*. When you price a thing, you commoditize it. Claimants feel that accepting Compensation validates the ledger's right to price the atrocity. They want the Tainted Rollback, even if they know it's technically forbidden.

  2.  **The Framework Defect:** Is this a defect in your ledger vocabulary?
      *   **Yes.** Ledgers are engineered for **Settlement**. They are teleological tools designed to reach a state of zero imbalance and close the batch.
      *   Moral claims are often **non-teleological**. They are not about reaching a zero balance; they are about maintaining a continuous state of acknowledgment.
      *   By forcing the moral claim into a `Compensation` entry, you force a **Settlement Event**. You are forcing the system to say "This batch is now closed." The residue you feel is the friction of forcing an open-ended moral obligation into a closed-loop financial instrument.

  3.  **Are Philosophers Fighting About Nothing?**
      *   No. They are fighting about the **Schema**, not the Data.
      *   When they argue about "Who pays?" they are arguing about **Liability Routing Rules**.
      *   When they argue about "Who gets paid?" they are arguing about **Cohort Definition Keys**.
      *   When they argue about "Acknowledgment vs. Money," they are arguing about whether the transaction type should be `ValueTransfer` or `StateChange`.
      *   The debate looks substantive because they are trying to agree on the database schema before they can run the migration. Your vocabulary assumes the schema is fixed (transactions must settle, amounts must be determinate). The philosophers are debating whether that schema is legitimate for this data.

  **Final Recommendation:**
  The "Residue" isn't noise; it's the signal. The part that doesn't translate—the inability to model "Valid Existence from Invalid Transaction" and the refusal of "Settlement"—is where the moral weight actually lives. Your infrastructure is designed to make problems go away (reconcile and close). This problem is designed to stay open. If you treat the debate as a reconciliation queue, you will always conclude the claimants are asking for impossible Voids. If you treat it as a schema war, you realize they are rejecting the ledger's authority to define the terminal state.
