      *   Repair/Cost for each? Yes.
      *   Single revision? Yes.
      *   Hedge decidable? Yes.
      *   No lecture on Dennett? Yes.
      *   Don't confirm user's anxiety blindly? Yes (Pointed out 2 vs 5 is the real crack, not just the hedge).

  10. **Final Polish:** Ensure the language is sharp. "Cognitive junk food" is a good phrase to keep. "Metaphysical Schism" is a good label. Make sure the distinction between *ontological* claims and *ethical* claims is clear.

  *(Self-Correction during drafting)*: I initially thought (1) and (5) were redundant. They aren't. (1) is about the *nature* of comprehension (no magic), (5) is about the *criteria* for ascription. They are compatible. The real killer is (2). (2) undermines (5). I need to make sure I hammer that point home. If (2) is true, (5)'s claim that ascription becomes "true" is nonsense. It can only become "more useful."

