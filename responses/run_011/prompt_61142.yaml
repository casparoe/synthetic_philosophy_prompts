  *   **Under Rule 2 (Agency/Residue):** T is trapped. If she follows the draw, she knows B will lose access due to a cap she knows is artificial; her inaction makes her complicit in the VP's injustice against a specific child. If she overrides, she actively breaks a promise to A, creating a specific debt to that family. Like the Politician, even if overriding is the "right" thing (saving the kid who loses out forever), the act of taking from A creates moral residue. Like the Botanist, T is the one "pulling the trigger" (making the final cut). **Verdict: Real Dilemma.**

