  Here is the breakdown of N's moral architecture, the prediction for case T, and the analysis of her underlying metaphysics.

  ### (a) Candidate Principles

  Based on the seven verdicts, N is not running a single monolithic theory (like pure utilitarianism or pure deontology). She is running a **hybrid rule set that prioritizes "Moral Residue" over "Decision Procedures."** Two competing principles emerge from her record that will disagree on case T:

  **Rule 1: The Procedural/Algorithmic Shield**
  *   **Definition:** A situation is *not* a real dilemma if a pre-existing fair procedure, consent mechanism, or aggregative metric (like numbers) resolves the conflict without requiring the agent to personally violate a specific obligation.
  *   **Support:** *Rescue Boat* (numbers settle it), *Surgeon* (consent/role settles it), *Moving Friends* (communication protocol settles it).
  *   **Prediction for T:** **Not a Dilemma.** The random draw was the agreed-upon procedure. The families consented to the draw. T's job is to administer the protocol, not correct for the VP's cap. Overriding the draw is simply rule-breaking, not a moral tragedy.

  **Rule 2: The Agency/Residue Threshold**
  *   **Definition:** A situation *is* a real dilemma if *any* available action requires the agent to personally inflict harm on, or betray, a specific identifiable individual, leaving the agent with a moral debt ("dirty hands") regardless of whether the action was objectively necessary or correct.
  *   **Support:** *Williams's Botanist* (Utilitarianism says shoot, but pulling the trigger creates residue), *Politician* (Torture may be necessary, but the debt remains), *Sophie* (Choosing either child leaves a stain), *Sartre's Student* (Incommensurable obligations).
  *   **Prediction for T:** **Real Dilemma.** T must choose between betraying A (active revocation of a promised slot) or abandoning B (passive allowance of loss due to known unjust scarcity). Both options involve specific harm to identifiable kids where T is the causal bottleneck.

  ### (b) Application to Case T

