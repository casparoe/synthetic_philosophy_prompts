  5.  **Drafting the Audit (Iterative Process):**

      *   *Ranking:*
          1.  **The Causal Mechanism Gap (1/5 vs 2/6):** If events are inert and we can't know decisions, how does weather cause revolt? This is the fatal flaw.
          2.  **The Determinism Trap (2 vs 3):** "Necessary condition" flirts heavily with determinism.
          3.  **The Evidence Paradox (4 vs 2):** Serial data proves price spikes, not necessarily specific revolts' causes without narrative evidence.

      *   *Analyzing the "Cut":*
          *   Option A: Soften (1) & (5). Admit events/decisions matter. *Loss:* Braudel purity, methodological confidence.
          *   Option B: Soften (2) & (6). Make it about structural vulnerability, not specific causation. *Loss:* The punch of the chapter.
