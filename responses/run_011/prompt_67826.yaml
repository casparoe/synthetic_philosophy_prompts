      *   **The Cut:** Analysis of dropping/modifying specific points.
      *   **The Single Revision:** The high-leverage fix.

  7.  **Review against Constraints:**
      *   No Annales lecture? Check.
      *   Cost both directions? Check.
      *   Audit tone? Check.
      *   Rank worst to mildest? Check.
      *   Specifics on what goes/why/loss? Check.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe tell them to drop Braudel (1).
      *   *Correction:* No, they asked to cost both directions. I need to show what happens if they keep Braudel vs. if they keep the Case Study.
      *   *Initial thought:* Is (4) a problem?
      *   *Correction:* (4) is methodological preference. It conflicts with (2) only if (2) requires non-serial evidence. Riots usually leave narrative traces (court records). If they only use prices, they can't prove riots happened, only that prices were high. This is a big evidentiary gap. I need to highlight (4) vs (2).
      *   *Wait, (5) is the bigger epistemic claim.* (4) says what I trust. (5) says what is *knowable*. (5) is the stronger blocker.
      *   *Determinism (3):* This is the political/ethical guardrail. It's hard to "cut" this without looking bad. Better to refine the definition of "necessary condition."

