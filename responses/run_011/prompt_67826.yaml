      *   (3) **Anti-Determinism:** Environmental determinism is wrong/rotten. Constraint yes, determination no.
      *   (4) **Serial Evidence Only:** Trust price series, registers, etc. (long-term data). Individual documents = anecdotes.
      *   (5) **Epistemic Silence:** Archives of slow layers are silent on individual decision-making. Can't know what specific actors (intendant/magistrate) did.
      *   (6) **Single Case Causality:** This *is* a causal claim about a single case (that valley, that decade), not a comparative statistical study. Weather made the difference *here*.

  3.  **Identify Tensions/Conflicts:**

      *   **Tension A: (1) & (5) vs. (2) & (6).**
          *   (1) says events are inert foam. (2) & (6) say specific weather events caused specific riots/revolts.
          *   (5) says we can't know individual decisions. (2) implies a mechanism where weather -> human reaction (riots). If we can't know the decision-making, how do we establish the causal link between weather and revolt without falling into determinism?
          *   *Severity:* High. This strikes at the core of the argument's logic.

      *   **Tension B: (2) & (6) vs. (3).**
          *   (2) says weather was a *necessary condition* for the revolt. (3) says no environmental determinism.
          *   If weather is necessary, did it determine the outcome? Or just constrain it? The line is thin. If you say "no harvest failure = no revolt," that looks a lot like determinism unless you explain the human agency gap.
