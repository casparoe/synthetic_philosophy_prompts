      *   **Tension C: (4) & (5) vs. (2) & (6).**
          *   (4) & (5) privilege serial data and deny access to individual agency. (2) & (6) make a specific causal claim about a specific time/place (conjoncture/événement).
          *   Serial data shows trends (prices went up). It doesn't inherently show *causation of a specific revolt* without narrative evidence of the revolt itself (which usually involves individual decisions/documents).
          *   *Severity:* Medium. Methodological consistency.

      *   **Tension D: (1) vs. (6).**
          *   (1) Events are foam. (6) I am arguing about a specific event/decade cluster.
          *   Braudel allows for *conjoncture* (medium term), not just *longue durée*. The 1690s is conjoncture, not necessarily pure événement. But calling the riots "foam" in (1) undermines their importance in (2).
          *   *Severity:* Medium. Terminological precision.

  4.  **Evaluate "Badly Stated" vs. "Real Conflict":**
      *   (1) "Explanatorily almost inert" is strong Braudel, but might be too strong for someone arguing weather caused riots.
      *   (3) "Determination no" is standard, but needs to be reconciled with "Necessary condition."
