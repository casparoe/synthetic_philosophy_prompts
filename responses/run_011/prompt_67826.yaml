      *   *Wait, let's look at (1) again.* "Events... explanatorily almost inert." If the PhD chapter is *about* the riots (events), and they are inert, what is the chapter explaining? It's explaining the *cause* of the event. Braudel says events don't explain *history* (long term). They don't say events don't *happen* or *have causes*. So (1) is likely badly stated.
