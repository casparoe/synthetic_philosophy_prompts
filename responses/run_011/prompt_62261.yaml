answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** Draft Bill on Retail of Foreign Meat Products
  **Participants:** The Devlinite Position and The Hartian Position

  **1. AGREED CLAIMS**

  The undersigned acknowledge that while our theoretical foundations remain distinct, the following claims are agreed for the purposes of this exercise. These concessions are load-bearing and do not represent conversion.

  1.  **The Expressive Function of Law:** Both sides accept that criminal law inevitably expresses societal values. The Hartian concedes that law is not morally neutral in its operation; the Devlinite concedes that expression alone does not justify coercion.
  2.  **Limits on Enforcement:** The Devlinite accepts that not every immorality warrants criminalisation. There must be a threshold of public intolerance, indignation, and disgust before the law intervenes. The Hartian accepts that "harm" is not limited to physical injury and may include psychological distress, though the status of such distress is contested.
  3.  **The Nature of Distress:** Both agree that distress caused merely by the knowledge of others' conduct counts as a negative experience for the sufferer. They disagree on whether this constitutes a "harm" sufficient for state intervention or merely a preference frustration.
  4.  **Empirical Failure of Disintegration:** Both sides accept that, on the evidence available regarding this bill, the disintegration thesis is not empirically verified. Society has not demonstrably begun to crumble due to the current legality of imported meat.
  5.  **Selective Enforcement:** Both agree that if enforcement falls disproportionately on small independent butchers while large importers absorb costs via margin compression (currently estimated at 0.4 per cent), this raises a significant issue of justice. They disagree on whether this invalidates the norm itself or merely the drafting.

  **2. DISAGREEMENTS TABLE**

  | The Crux | Devlinite Wording (Unsigned by Hartian) | Hartian Wording (Unsigned by Devlinite) | What Each Accepts as Bearing on the Crux | Predictions (Recorded in Advance) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Shared Morality** | The 71 per cent who call the practice wrong, with 62 per cent deeming it seriously wrong, constitute a settled public morality sufficient for legal protection. | A bimodal distribution where under-30s split 50/50 and only 14 per cent support custodial penalties indicates fragmented values, not a shared morality. | Both accept the polling data is accurate. Both accept that age and geography (rural vs urban) correlate with moral intuition. | **Devlinite:** The majority view will stabilise as the norm shifts. <br> **Hartian:** The majority view will fracture further as environmental concerns supersede cruelty concerns. |
  | **2. Harm Principle Scope** | The harm principle is incomplete. If society is entitled to protect its moral fabric, the erosion of welfare standards abroad is a harm to the domestic collective identity. | The harm principle disposes of this case. No domestic person is harmed, and animals are outside the jurisdiction. Legal moralism has no work to do here. | Both accept the animals are outside the jurisdiction. Both accept no domestic person claims direct harm. | **Devlinite:** Consumption will drop slightly, validating the moral signal. <br> **Hartian:** Consumption will move by only a couple of percentage points, proving the law is ineffective. |
  | **3. Intolerance as Evidence** | Measured intolerance is evidence of a threat to society's existence. The intensity of the 62 per cent who feel serious wrongness is the metric that matters. | Measured intolerance is merely the intensity of a preference. Disgust does not equal damage. The 58 per cent who prefer labelling show intolerance is not absolute. | Both accept the disparity between moral disapproval (62 per cent) and support for criminal penalties (14 per cent). | **Devlinite:** Intolerance will grow if the bill fails. <br> **Hartian:** Intolerance will fade as labelling norms shift, as seen in other jurisdictions. |
  | **4. Disintegration Thesis** | The thesis is conceptual. Even if society does not collapse tomorrow, the law must prevent the loosening of bonds that holds the community together. | The thesis is empirical. If society does not dissolve in the face of this conduct, the justification for coercion vanishes. | Both accept that in two comparable jurisdictions, criminalisation changed consumption minimally while labelling shifted norms. | **Devlinite:** Labelling is insufficient to maintain the moral bond. <br> **Hartian:** Labelling achieves welfare goals without coercive overreach. |
  | **5. Selective Enforcement** | The burden on small butchers is a drafting problem. The norm is valid; the mechanism requires subsidy or adjustment to protect small traders. | The burden on small butchers is a reason to reject the norm. If enforcement relies on crushing independent traders, the law is unjust regardless of intent. | Both accept compliance costs will fall almost entirely on small independent butchers who cannot absorb them. | **Devlinite:** The market will adjust to support compliant butchers. <br> **Hartian:** Small butchers will exit the market, reducing competition. |

  **3. VERBAL VERSUS SUBSTANTIVE DISPUTES**

  We identify three terms doing double duty that obscure our substantive differences.

  First, **Society**. For the Devlinite, society is a moral community bound by shared ideas; if those ideas loosen, society is literally less itself. For the Hartian, society is a collection of individuals coexisting; unless their physical or psychological security is threatened, the collective remains intact. When we argue about disintegration, the Devlinite speaks of moral cohesion while the Hartian speaks of civil order. This is largely verbal, but it drives the substantive disagreement on whether the state exists to save souls or secure rights.

  Second, **Harm**. The Hartian uses harm to mean a setback to interests that can be objectively identified, typically excluding mere upset. The Devlinite uses harm to include damage to the moral environment which individuals rely upon for meaning. When we argue about the animals outside the jurisdiction, the Hartian sees no victim within the legal circle. The Devlinite sees a victim in the public conscience. This is substantive: it determines whether the state has standing to act.

  Third, **Public Morality**. The Devlinite treats this as an objective fact discoverable by the reasonable man's reaction. The Hartian treats this as an aggregate of subjective preferences. When we look at the 71 per cent disapproval rate, the Devlinite sees a mandate; the Hartian sees a statistic. This is substantive because it dictates whether majority feeling translates directly into legislative authority or requires filtration through a principle of liberty.

  **4. CONDITIONS FOR REVISION**

  **The Devlinite**
  *   **What would move us:** Empirical evidence that allowing this trade actively accelerates the breakdown of other domestic moral standards, demonstrating a causal link between this specific immorality and social fragmentation.
  *   **What would not move us:** Economic cost-benefit analysis. The financial impact on small butchers or importers is irrelevant to the moral necessity of the law, though it may require administrative mitigation.

  **The Hartian**
  *   **What would move us:** Evidence that labelling and civil fines fail to prevent tangible psychological harm to the public that amounts to a recognised injury, rather than mere offence.
  *   **What would not move us:** The intensity of public disgust. Unless that disgust can be linked to a secular harm independent of the moral judgment itself, the volume of the majority's shouting is legally irrelevant.

  **Signed for the purposes of the exercise:**

  *The Devlinite Position*
  *The Hartian Position*
