prompt: |-
  For four years I have served on a volunteer panel at a mid-sized logistics company that decides whether an employee gets modified duties, and somewhere around the second year it became clear to me that nearly every argument we have comes down to a disagreement nobody on the panel can state cleanly. Roughly half of us behave as though whether something is a disease is settled by the body: if a part of you is doing what parts like it statistically typically do in people of your age and sex, you are healthy, and whatever else we want to say is preference dressed up as fact. The other half behave as though that formulation is a smokescreen — as though calling something a disease always carries a judgment about how a life ought to go, and as though the supposedly neutral statistics were compiled by somebody with an interest in the result.

  I have no academic training in any of this. I have read what I could get hold of, including a theory that defines health as normal functioning relative to a reference class, and the two objections that stuck with me: that it quietly imports values anyway, and that the choice of reference class looks arbitrary. What I want from you is the document our panel should have produced three years ago — the joint statement of an adversarial collaboration between a committed defender of the factual, statistical account of disease and a committed defender of the view that disease is irreducibly value-laden. Neither may be a strawman. Both should be people I would recognize from my own table, and both should be writing to end an argument rather than to win it.

  The document should contain:

  1. A numbered list of claims both sides can genuinely sign. Substantive ones, not "both take suffering seriously." If they can agree that a condition can be a disease without being painful, or that the same bodily state can be pathological in one environment and unremarkable in another, or that a person can be diseased while feeling perfectly well, say so, and note in one line why each side accepts it for its own reasons.

  2. A table of the disagreements that survive the exercise. For each row: the shared description of the case, then the two positions worded so that each side would accept the wording of its own row without flinching. For at least three rows, state whether you judge the dispute to be partly verbal rather than about the world; if it is, name the word doing the damage and say what remains once the verbal part is stripped away.

  3. The cruxes. My own guess is that there are exactly three, and I want to be told if that is wrong. First: whether the statistical account can fix its reference class without already making a value judgment. My test case, which I invented and which you should treat as a hypothetical rather than as something you need to look up — an isolated community in which nearly everyone carries a variant that prevents them from metabolizing the local dietary staple, so that what is statistically typical there is precisely what makes people sick, while a newcomer with ordinary metabolism is the outlier. Which side does that case favor, and can either side absorb it without giving up its central claim? Second: whether the value-laden account can explain why we decline to call ordinary human limitations — poor pitch, short stature, the slow healing of old age — diseases, without sliding into the position that a disease is whatever a given society happens to disvalue. Third: what the two accounts actually disagree about when they hand down practical verdicts. Name a real category of case in which they come out differently, or concede in the document that they never do and explain what that would mean for the debate.

  4. For each crux, the test both sides agree bears on it — a case, an argument, or a settled piece of diagnostic or epidemiological practice — with each side's prediction recorded in advance, before anyone runs the test. I want to be able to put this in front of two people and have them argue about the prediction rather than about the framing of the question.

  5. A short closing clause stating what each side would count as evidence against its own view, and whether there is anything at all that both agree would move the dispute.

  Write the document itself, not guidance about how to write it. Where you need a term of art or the proper name of a position, introduce it in parentheses the first time it appears, since I will not have come across it.
reasoning: |-
  Here's a thinking process that leads to the document above:

  1.  **Analyze the Request:**
      *   **Context:** A volunteer panel at a logistics company deciding on modified duties for employees.
      *   **Problem:** A persistent, unstated disagreement about the definition of "disease" (biostatistical vs. value-laden/normative).
      *   **Task:** Create a "joint statement of an adversarial collaboration" between a defender of the factual/statistical account (Biostatistical Theorist) and a defender of the value-laden account (Normativist).
      *   **Tone:** Professional, collaborative, precise, non-strawman, aimed at ending the argument or clarifying the stalemate.
      *   **Requirements:**
          1.  Numbered list of agreed claims (substantive, with reasons for each side).
          2.  Table of surviving disagreements (shared description, two positions, verbal vs. substantive analysis for at least three).
          3.  The Cruxes (three specific hypotheticals/issues provided by the user: Reference Class/Isolated Community, Ordinary Limitations, Practical Verdicts).
          4.  Agreed Tests/Predictions for each crux.
          5.  Closing Clause (falsification conditions).
      *   **Constraint:** Write the document itself, not guidance. Define terms in parentheses.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Side A: Biostatistical Theory (BST).** Associated with Christopher Boorse. Health is normal functioning (statistical typicality) relative to a reference class (age, sex, species). Disease is a value-free biological fact.
      *   **Side B: Normativism/Value-Laden Theory.** Associated with thinkers like Lennart Nordenfelt or more critical social constructionists. Health/Disease concepts inherently involve judgments about well-being, goals, and social values. Statistics themselves are chosen based on values.
      *   **Goal:** Make them sound like reasonable colleagues, not caricatures. They need to agree on *some* things to show collaboration, but disagree sharply on the *foundations*.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need substantive agreement, not platitudes.
      *   *Idea 1:* Asymptomatic disease. (BST: Function is impaired even if felt fine. Normativist: Risk of future harm justifies the label.)
      *   *Idea 2:* Environmental context. (BST: Function is relative to environment. Normativist: Environment determines the harm/value.)
      *   *Idea 3:* Pain is not necessary. (BST: Function loss is key. Normativist: Interference with life goals is key, pain is just one way.)
      *   *Idea 4:* Distinction from injury/normal aging (maybe too contentious? Let's stick to the prompt's suggestions).
      *   *Refinement:* Ensure the "Why" distinguishes their underlying logic.

  4.  **Drafting Section 2: Table of Disagreements:**
      *   Need clear rows.
      *   *Row 1: The Reference Class.* (BST: Natural kinds. Normativist: Chosen for social reasons.)
      *   *Row 2: The "Harm" Condition.* (BST: Harm is downstream, not definitional. Normativist: Harm is constitutive.)
      *   *Row 3: Mental Health/Psychiatry.* (Good testing ground for values.)
      *   *Verbal vs. Substantive:* Need to identify if they are just using words differently.
          *   *Example:* "Disease." BST uses it as "sub-optimal function." Normativist uses it as "bad state to be in."
          *   *Residue:* If we strip the word "disease," do they still disagree on *action*? Yes, usually on eligibility for accommodation.

  5.  **Drafting Section 3: The Cruxes (The User's Specific Tests):**
      *   *Crux 1: The Isolated Community (Reference Class).*
          *   Scenario: Everyone has a metabolic variant making them sick on local food. Newcomer is healthy but statistical outlier.
          *   BST Challenge: If stats define health, the sick locals are "healthy." BST must argue reference class should be *species-wide* not local, or admit stats aren't enough.
          *   Normativist View: The locals are sick regardless of stats because they suffer/harm.
          *   *Resolution:* BST usually fixes this by choosing the "natural" reference class (all humans), not the local population. This saves BST but raises the "arbitrary choice" objection.
      *   *Crux 2: Ordinary Limitations.*
          *   Scenario: Short stature, bad pitch.
          *   Normativist Challenge: Why aren't these diseases? If it's about values, why do we exclude them?
          *   BST Answer: They are statistically normal.
          *   Normativist Answer: We don't value height/pitch enough to medicalize them.
      *   *Crux 3: Practical Verdicts.*
          *   Do they actually differ in the logistics company context?
          *   If BST says "impaired function" and Normativist says "disvalued state," do they flag the same employees?
          *   *Real difference:* Conditions that are statistically normal but disvalued (e.g., infertility in a pronatalist society? Or perhaps gender dysphoria?). Or statistically abnormal but not disvalued (e.g., high IQ? No, that's not a disease). Let's look at *risk factors*. High cholesterol (statistically abnormal function, no symptoms). BST: Disease. Normativist: Only disease if we value avoiding heart attacks.
          *   *Better difference:* "Disabilities" that aren't diseases. Deafness. BST: Pathology of ear. Normativist (some): Cultural identity, not disease.
          *   *Decision:* Let's focus on *accommodation eligibility*. BST focuses on mechanical repair. Normativist focuses on social integration.

  6.  **Drafting Section 4: Agreed Tests/Predictions:**
      *   Need specific predictions *before* the test.
      *   *Test 1 (Reference Class):* Epidemiological standard setting.
      *   *Test 2 (Limitations):* Medicalization trends.
      *   *Test 3 (Verdicts):* Panel voting patterns on specific cases (e.g., chronic pain with no biomarker).

  7.  **Drafting Section 5: Closing Clause (Falsification):**
      *   What would make BST give up? If "function" cannot be defined without goals.
      *   What would make Normativist give up? If we find a biological marker that dictates health regardless of social context.
      *   Common ground: If the definition stops helping patients.

  8.  **Review and Refine:**
      *   *Check Tone:* Is it too academic? Keep it accessible but precise (user has read some theory).
      *   *Check Constraints:* Did I define terms in parentheses? Yes. Did I address the specific "Isolated Community" hypothetical? Yes.
      *   *Check User's "Three Cruxes" guess:* The user guessed exactly three. I should confirm if that is right or wrong. I will structure it as three, as they are robust, but acknowledge in the text that they are the *foundational* three.
      *   *Check "Verbal vs Substantive":* Ensure at least three rows in the table have this analysis.
      *   *Check "Joint Statement" format:* Needs a header, signatories, date.

  9.  **Self-Correction during drafting:**
      *   *Correction on Crux 1:* The user's hypothetical is tricky. If *everyone* in the community is sick, BST usually argues the reference class is the *species*, not the *community*. I need to make sure the BST defender articulates this standard move, while the Normativist attacks the *choice* of species as the class.
      *   *Correction on Crux 3:* The user asks if they ever come out differently. If I say "No," the debate is purely semantic. If I say "Yes," I need a concrete example. In a logistics company, "modified duties" is the key. BST: Can they lift? Normativist: Is it fair to ask them to lift given their pain experience? Actually, a better split is *psychosomatic* or *chronic fatigue*. BST struggles to find the "function failure." Normativist accepts the "life disruption." I will use "Medically Unexplained Symptoms" as the divergence point.

  10. **Final Polish:** Ensure the voices sound distinct. BST should sound precise, biological, defensive of objectivity. Normativist should sound pragmatic, ethical, defensive of patient experience.

  *(Self-Correction on Term Definitions)*: Make sure to define "Biostatistical Theory" and "Normativism" early or in parentheses as requested.

  *(Self-Correction on User's Crux 1)*: The user asks: "Which side does that case favor, and can either side absorb it without giving up its central claim?" I need to answer this explicitly in the text.

  *(Self-Correction on User's Crux 3)*: "Name a real category of case in which they come out differently, or concede... they never do." I will name a category: "Subjective Functional Impairment without Biomarker."

