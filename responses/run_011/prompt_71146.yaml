answer: |-
  **JOINT STATEMENT ON THE CONCEPT OF DISEASE IN OCCUPATIONAL ASSESSMENT**

  **Date:** October 26, 2023
  **Parties:**
  *   **The Biostatistical Working Group (BST):** Defenders of the view that health is a matter of objective, species-typical functional capacity.
  *   **The Normative Assessment Group (NAG):** Defenders of the view that health and disease are concepts inherently tied to human values, goals, and social context.

  **Preamble**
  We, the undersigned members of the Employee Duty Modification Panel, acknowledge that for two years our deliberations have been stalled by a foundational disagreement. We disagree on whether "disease" is a fact discovered in the body or a judgment made about a life. Rather than continue to talk past one another, we have engaged in an adversarial collaboration to map the exact contour of this dispute. This document records where we stand together, where we stand apart, and how we propose to test our differences.

  ***

  ### 1. Substantive Claims of Agreement

  We affirm the following propositions. While we sign them jointly, our justifications differ.

  1.  **A condition can be a disease without causing pain.**
      *   *BST Reason:* Disease is a failure of functional design; pain is merely a signaling mechanism that may itself be broken.
      *   *NAG Reason:* A condition counts as a disease if it threatens future goals or well-being, regardless of current subjective suffering.
  2.  **A person can be diseased while feeling perfectly well (asymptomatic pathology).**
      *   *BST Reason:* Physiological systems can fail statistically (e.g., early-stage hypertension) even if the organism reports no distress.
      *   *NAG Reason:* We label these states as diseases because we value the prevention of future harm, not because of present experience.
  3.  **The same bodily state can be pathological in one environment and unremarkable in another.**
      *   *BST Reason:* Function is defined relative to the environment in which the organism is expected to survive; a lung function sufficient for a sedentary life may be insufficient for high-altitude logistics work.
      *   *NAG Reason:* The "harm" of a condition is determined by the demands of the environment; without a context that makes the state a disadvantage, there is no disease.
  4.  **Statistical rarity alone is insufficient to define disease.**
      *   *BST Reason:* High intelligence or exceptional height are statistically rare but represent superior, not failed, functioning.
      *   *NAG Reason:* We do not disvalue high intelligence or height; rarity only becomes disease when coupled with a negative evaluation of the state.
  5.  **The goal of medical intervention is not always the elimination of the underlying biological state.**
      *   *BST Reason:* Sometimes we cannot restore typical function, so we manage the downstream effects to keep the organism alive.
      *   *NAG Reason:* Sometimes the "disease" label is retained to justify support, even if the biological state is accepted (e.g., managing diabetes rather than "curing" it).

  ***

  ### 2. Table of Surviving Disagreements

  The following disagreements remain unresolved. For each, we provide a shared description of the case, followed by the specific interpretation offered by each side.

  | Case Description | BST Position (Biostatistical) | NAG Position (Normative) | Verbal or Substantive? |
  | :--- | :--- | :--- | :--- |
  | **1. The Choice of Reference Class**<br>When determining "normal" function, we must compare the employee to a group (e.g., males, 40-50, logistics workers). | The reference class is a matter of biological natural kinds (age, sex, species). Choosing otherwise corrupts the science. | The reference class is a policy choice. Selecting "all humans" vs. "local population" is a value judgment about who counts. | **Partly Verbal.**<br>*Word:* "Natural."<br>*Residue:* Even if we agree on the word, we disagree on *which* biological traits determine the class. The substantive fight is over who has authority to set the class. |
  | **2. Medically Unexplained Symptoms**<br>Employee reports debilitating fatigue/pain; all biomarkers and functional tests are within statistical norms. | This is not a disease. It is either a misunderstanding of normal variation or a psychological issue distinct from physiological pathology. | This is a disease. The inability to pursue life goals is the primary fact; the lack of a biomarker is a failure of our measurement, not the patient. | **Substantive.**<br>*Word:* N/A.<br>*Residue:* We will vote differently on accommodation. BST denies the claim; NAG grants it based on reported disability. |
  | **3. The "Harm" Condition**<br>Does a condition need to cause harm to be a disease, or is harm a consequence of disease? | Harm is a consequence. A tumor is a disease because it disrupts function; the fact that it kills you is secondary to the functional disruption. | Harm is constitutive. Without the judgment that this state is "bad" for the person, it is merely a biological anomaly, not a disease. | **Partly Verbal.**<br>*Word:* "Disease."<br>*Residue:* If we rename BST's category "Pathology" and NAG's category "Illness," do we still fight? Yes, over eligibility. BST denies eligibility for non-harmful pathologies; NAG requires harm for eligibility. |
  | **4. Aging and Decline**<br>Loss of muscle mass and bone density in a 70-year-old employee. | This is normal functioning for the reference class "elderly humans." It is not a disease, though it may be a risk factor. | This is a disease if we value the maintenance of independence. Calling it "normal" is a way of withholding care from the old. | **Substantive.**<br>*Word:* "Normal."<br>*Residue:* BST sees aging as a biological given; NAG sees it as a site of potential medical intervention depending on social values. |

  ***

  ### 3. The Cruxes

  You hypothesized that there are exactly three cruxes. We agree. These are the pivot points upon which our entire collaboration turns.

  **Crux 1: The Reference Class Problem (The Isolated Community)**
  *The Test Case:* An isolated community where nearly everyone carries a genetic variant preventing metabolism of the local dietary staple. Statistically, the "sick" locals are typical; a healthy newcomer is the outlier.
  *   **Which side does this favor?** It favors the **NAG**.
  *   **Can BST absorb it?** The BST can absorb this only by insisting the reference class must be *the entire species*, not the local population.
  *   **The Conflict:** The NAG argues that choosing "the entire species" over "the local population" is itself a value judgment (valuing universal biology over local context). The BST argues that choosing "the local population" makes the concept of disease useless for identifying biological failure.
  *   **Status:** The BST holds that the reference class is fixed by evolutionary design. The NAG holds that the reference class is fixed by our interest in comparison.

  **Crux 2: The Boundary of Ordinary Limitations**
  *The Test Case:* Poor pitch discrimination, short stature, slow healing in old age.
  *   **The Conflict:** The NAG challenges the BST to explain why these are not diseases without admitting that "disease" implies "bad." If health is just "statistical typicality," and short stature is statistically typical for some groups, why isn't it health?
  *   **BST Defense:** These are not failures of internal design; they are variations within the range of efficient function.
  *   **NAG Counter:** "Efficient function" is a value-laden phrase. We exclude short stature because we do not *care* enough to medicalize it, not because biology dictates it.
  *   **Status:** The dispute is whether we can define "design function" without referencing what we want humans to *do*.

  **Crux 3: Practical Verdicts (Do We Actually Disagree?)**
  *The Test Case:* Eligibility for modified duties in a logistics setting.
  *   **The Conflict:** Do the two accounts ever yield different votes on this panel?
  *   **Verdict:** **Yes.** They diverge on **Subjective Functional Impairment without Biomarker** (e.g., Chronic Fatigue Syndrome, Fibromyalgia, some Mental Health conditions).
  *   **BST Outcome:** Deny modification. If the body parts are functioning within statistical norms, there is no disease to accommodate. The employee is either malingering or unhappy.
  *   **NAG Outcome:** Grant modification. If the employee cannot live a standard life due to a bodily state, that is a disease, regardless of the biomarker.
  *   **Meaning:** If we admit this divergence, the debate is not semantic. It determines who gets support and who gets dismissed.

  ***

  ### 4. Agreed Tests and Predictions

  For each crux, we propose a specific test. We record our predictions here, prior to reviewing the data or cases.

  | Crux | The Test | BST Prediction | NAG Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Reference Class** | Review epidemiological standards used by the WHO and CDC for defining "outbreaks" vs. "endemic" states in isolated populations. | We predict these agencies will default to species-wide baselines, ignoring local statistical typicality when defining pathology. | We predict these agencies will adjust thresholds based on local social impact and resource allocation, not just biology. |
  | **2. Ordinary Limitations** | Analyze the history of ICD (International Classification of Diseases) codes over 50 years regarding aging and stature. | We predict new codes are added only when a specific *mechanism* of failure is identified, not merely when disvalue increases. | We predict new codes are added as social tolerance for certain limitations decreases (e.g., infertility, ADHD), regardless of biological change. |
  | **3. Practical Verdicts** | Blind review of 50 past panel cases involving "pain without objective finding." | We predict that cases where BST members dominated resulted in lower accommodation rates and higher return-to-work mandates. | We predict that cases where NAG members dominated resulted in higher accommodation rates and longer-term modified duty. |

  ***

  ### 5. Closing Clause: Conditions for Falsification

  We agree that a theory is useless if it cannot be wrong. We commit to the following:

  *   **The BST Group** will abandon the Biostatistical Theory if it is demonstrated that *no* reference class can be selected without explicit appeal to social values (e.g., if "species-typical function" is proven to be incoherent without referencing what the species *values* doing).
  *   **The NAG Group** will abandon the Normative Theory if a biological marker is discovered that predicts mortality and morbidity perfectly, regardless of social context or patient values, rendering the "judgment" component redundant.
  *   **Joint Concession:** We agree that if the Practical Verdicts test (Crux 3) shows no statistical difference in our panel's outcomes over the next year, the debate is purely philosophical and should not influence operational HR policy. In that event, we will adopt a hybrid definition for the sake of administrative consistency.

  **Signed,**

  *The Biostatistical Working Group*
  *The Normative Assessment Group*
