answer: |-
  Good evening. For eleven years I have had the privilege of standing in Vera Lindqvist's shadow. When I started here, I thought I was learning how to manage a budget. I was wrong. I was learning how to stand between a river and a town. If you have spent any time in our lobby, you know the plaque that defines her tenure. It bears a single line she has used for thirty years in council meetings and grant applications. You can't stop the river. You build the dykes before the rain.

  She got that line from a boss in the Army Corps who handed her a paperback in 1993. He told her to read one chapter on fortune and skip the rest. She has been reading that chapter ever since. It became our district's compass. It was even, unforgivably, printed on a safety poster. I still have to explain to new interns why a picture of a hard hat comes with a quote about fate, but there it is.

  For a long time, I thought I understood what that line meant. I thought it meant that if we worked hard enough, we could keep the water out. I thought it was a promise of control. But lately, I have come to understand that Vera was carrying a heavier truth than that. The line on the plaque is only half of what that book argues. The other half is harder to swallow.

  The dykes do not prevent the flood. They only make it less ruinous when the water comes. Fortune is overwhelming precisely where nothing has been ordered to resist her. Preparation does not win the fight. It changes what the disaster costs. The argument also says that a person's way of proceeding either suits the times or it does not. The cautious man is undone when the moment calls for impetuosity. The impetuous man is undone when the moment calls for caution. No one can change their own nature. The temperament that saved you in one decade is the same temperament that ruins you in the next. You could not have been otherwise.

  I tell you this not to correct her, but to relieve her. For thirty years, Vera carried the weight of stopping the water. I am here to tell you that was never the job. The job was to make sure that when the water came, we were still here to sweep it out. She built the dykes. She ordered the resistance. She made sure that when fortune turned, we were not erased.

  In August 2017, the water came anyway. The pumps at the Ellsworth station failed. Nine blocks stood in water for four days despite the choices made to spare the rest. We live with the ground that water covered. We live with the dry houses and the wet ones.

  This is what I want her successors to understand. I cannot promise you control. The next flood will come in a form your preparation was not designed for. The dykes you build today will not match the river of tomorrow. Your work will not prevent the ruin. It will only measure it. You must build anyway.

  I know the reputation of the book Vera read. People expect advice on how to seize power. Vera only used it to figure out how to keep the water out. She never cared for the power. She cared for the ground.

  There is a name for the author of that book. I will not use it often. Machiavelli wrote that fortune is a river that cannot be stopped. But he also wrote that we are bound by our own nature. Vera, you were bound to be the one who built the dykes. You could not have been otherwise. And because you were who you were, this district is still standing.

  Some of you are here because your streets stayed dry. Some of you are here because your basements filled up. Both truths sit in this room. Both truths belong to her legacy. We do not need to resolve that tension to honor the work. We only need to acknowledge that the water rises, and she stood in front of it.

  Vera, you have carried the half of the argument that requires hope. You built before the rain. Tonight, we hand you the other half. You do not have to stop the river anymore. You have done enough. The rest is up to the water. Thank you.

  ***

  **Note to the Deputy Director**

  I compressed the chapter's argument on temperament and times into the idea that nature is fixed and suitability is luck. The actual text argues more dynamically that prudent men fail because they cannot switch modes when the times change, not just because they are fixed. I made this compression to keep the speech focused on Vera's constancy rather than the mechanics of failure. It simplifies the philosophy for a general audience without losing the fatalistic core.

  By omitting the claim that fortune is a woman who yields to the impetuous, you lose Machiavelli's specific preference for boldness over caution. That metaphor is where he argues that aggression can master luck. Leaving it out softens him significantly. It removes the suggestion that Vera might have been too cautious. Instead, the speech frames her caution as necessary preparation. This protects her legacy among the flood victims, as it avoids implying that a bolder approach would have saved their homes. It makes her restraint a virtue of stability rather than a potential failure of nerve.
