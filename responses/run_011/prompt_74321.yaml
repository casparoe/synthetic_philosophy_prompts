      *   Para 2: Tackle the progressiveness. Empirical progress is necessary but not sufficient for long-term vitality. A parasite can grow fat before the host dies. But the scientist *knows* they are parasitic. This isn't retrospective sociology; it's immediate methodological awareness.
      *   Para 3: Demand clarification on the hard core. If the core is different, but the heuristic is stolen, P is living on borrowed time. But tell me: when P modifies the borrowed auxiliaries, do they do it to save their core or simply because Q told them to? This distinction is crucial for your case.

      *Wait, check the "Kuhn" constraint:* I must not concede that my methodology is Kuhn's sociology with better manners. I need to emphasize the rational/logical aspect over the social aspect.
      *Check the "Retrospective" constraint:* I must not concede that appraisal is purely retrospective. I need to argue it has heuristic value for the scientist.

      *Drafting content:*
      You come into my rooms with a tidy little fable about alloys and expect me to choke on it? It is sharp, I grant you, sharper than most of what I see from the graduate students these days. But you have made a category mistake in your setup. You speak of a research programme as if it were defined solely by its hard core, like a theological dogma. I have always insisted that the positive heuristic—the hint on how to change the protective belt—is part of the programme's very identity. If P is truly stealing Q's heuristic lock, stock, and barrel, then P is not a rival programme at all; it is a degenerating appendage of Q, wearing a different hat. You cannot claim independence while begging for your tools.

      However, let us grant your fiction for the sake of the argument. You ask if P is progressive. My answer is: it is empirically progressive, yes, but theoretically suspect. And do not think this distinction is merely for the historian looking back with a ledger. The working scientist knows when they are innovating and when they are scavenging. If a physicist knows their predictions rely entirely on a rival's machinery, they know their own core is exposed. This is not Kuhn's mob psychology, where truth is decided by consensus; it is a logical assessment of content. A programme that cannot generate its own auxiliaries is like a man who can only walk using another's legs. He moves, yes, but cut the cord and he falls.

