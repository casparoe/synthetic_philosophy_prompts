  However, let us grant your fiction for the sake of the argument. You ask if P is progressive. My answer is: it is empirically progressive, yes, but theoretically suspect. And do not think this distinction is merely for the historian looking back with a ledger. The working scientist knows when they are innovating and when they are scavenging. If a physicist knows their predictions rely entirely on a rival's machinery, they know their own core is exposed. This is not Kuhn's mob psychology, where truth is decided by consensus; it is a logical assessment of content. A programme that cannot generate its own auxiliaries is like a man who can only walk using another's legs. He moves, yes, but cut the cord and he falls.

