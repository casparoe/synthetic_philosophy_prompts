answer: |-
  This is a tight, well-constructed position. You are essentially arguing for a **Control Principle** applied to socio-technical systems: moral blame requires control over the outcome, and in residual-gap cases, the outcome was outside the sphere of reasonable control. You are also explicitly decoupling *moral blame* (backward-looking, retributive/expressive) from *liability* (forward-looking, distributive/compensatory).

  Here is the stress test, ranked by threat level.

  ### 1. The Defeaters (Ranked Fatal to Awkward)

  **1. The "Inherent Recklessness" Defeater (Attacks Condition iii)**
  *   **The Argument:** Deploying a non-deterministic, opaque learning system in a high-stakes environment (ICU) is *inherently* negligent, regardless of testing. The "risk" isn't just the specific bug; the risk is the *method*. By choosing a tool that cannot be fully audited for edge cases over a deterministic rule-based system (or human-only decision), the decision-makers accepted a structural risk they could not mitigate.
  *   **Why it's Fatal:** If condition (iii) ("harm wasn't the foreseeable upshot of the decision to field that kind of system") is never satisfiable for high-stakes ML, your gap never opens. The "foreseeable upshot" of using black-box probabilistic models is *exactly* that they will fail in unanticipatable ways on edge cases.
  *   **Concede or Wave:** **Concede.** You cannot maintain that deploying opaque models in life-critical infrastructure is risk-neutral. You must argue that the *benefit* outweighs the *structural risk*, making the deployment permissible, not just the testing. If you can't justify the deployment itself as reasonable, the gap closes at step (iii).

  **2. The "Role Responsibility" Defeater (Attacks the Conduct/Outcome Link)**
  *   **The Argument:** Certain roles (physicians, engineers certifying safety-critical systems) accept **outcome responsibility**, not just conduct responsibility. When you take the job, you warrant a result, not just effort. If a surgeon follows all protocols and the patient dies due to a rare anatomical variant, we often say "it was a tragedy, not negligence," but we still hold the surgeon *responsible* in a way that requires accountability (e.g., morbidity and mortality conferences).
  *   **Why it's Fatal:** It challenges your definition of blame. If "blame" includes the social practice of holding someone accountable to answer for the harm (even without punishment), then someone *is* blameworthy in the sense of being the proper target of the accounting.
  *   **Concede or Wave:** **Wave Off (with nuance).** You can distinguish between *accountability* (answering for what happened) and *blame* (moral condemnation/stigma). Your thesis protects against stigma, not the duty to explain.

  **3. The "Epistemic Opacity" Defeater (Attacks Condition ii)**
  *   **The Argument:** If you cannot document why the model works, you haven't actually tested it; you've only observed its past performance. Relying on induction for a non-stationary system is a category error. A "feasible testing regime" for software implies verifying logic; for ML, we only verify statistics. Relying on statistical validation for deterministic safety guarantees is itself a culpable epistemic failure.
  *   **Why it's Awkward:** It suggests your condition (ii) is incoherent. There is no "feasible test" for what you are asking the system to do (guarantee safety via statistical correlation).
  *   **Concede or Wave:** **Concede partially.** You must admit that "testing" for ML means something different than "testing" for code. If your definition of "feasible testing" assumes traditional verification, the gap is illusory.

  **4. The "Clean vs. Scrubbed" Epistemic Defeater (Practical Application)**
  *   **The Argument:** We can never know if an audit trail is genuinely clean or well-scrubbed. If the *only* cases where your thesis applies are ones we can never empirically verify, the thesis has no practical traction. It becomes a "get out of jail free" card that bad actors will claim regardless of truth.
  *   **Why it's Awkward:** It doesn't make you morally wrong, but it makes your view politically unusable.
  *   **Concede or Wave:** **Wave Off.** This is an enforcement problem, not a moral one. A murderer might scrub evidence perfectly; that doesn't mean they aren't blameworthy, only that we can't prove it. Your thesis is about *desert*, not *proof*.

  ---

  ### 2. The Friend's Critique: The "Feasible Testing" Stretch

  Your friend is **right**, and it **matters**.

  *   **Why he's right:** Hindsight bias is robust. Once a failure mode is known, it instantly becomes "obvious." In litigation and post-mortems, "feasible" quietly shifts from "what was state-of-the-art *ex-ante*" to "what is possible *ex-post*." If a test *could* be constructed now, the argument will be made that it *should* have been constructed then.
  *   **Why it matters:** If condition (ii) is dynamically redefined by the occurrence of the harm, the Residual-Gap Thesis is vacuous. It becomes a tautology: "If the harm was unforeseeable, it was unforeseeable."
  *   **The Fix:** You must rigidly define "feasible" as **ex-ante state-of-the-art**. You need to commit to the claim that there are failure modes that are *physically or computationally inaccessible* prior to deployment, not just economically inconvenient. If you allow "feasible" to include "expensive but possible," the gap closes because money can almost always buy more testing.
  *   **Unfalsifiability:** You asked if being unfalsifiable is a sin here. Since this is a normative thesis (about *desert*), strict falsifiability isn't the metric. However, **applicability** is. If the conditions are so strict they never obtain in the real world, the thesis is practically inert. You need to show that *some* real cases fit, or you are just theorizing about unicorns.

  ---

  ### 3. Predictions vs. Rivals

  **The Prior-Fault Theorist (PFT)**
  *   **Prediction:** Every accident investigation must end with a named individual or process failure. If no one is blamed, the investigation was incomplete.
  *   **Consequence:** Encourages "cover-your-ass" documentation, defensive engineering, and potentially hiding errors to avoid the inevitable blame assignment.
  *   **Your View (Residual-Gap)**
  *   **Prediction:** Some investigations will conclude "systemic risk realized, no individual fault."
  *   **Consequence:** Encourages honest reporting of failures (since blame isn't automatic), facilitating faster data sharing on failure modes.
  *   **The Clean Audit Problem:** You asked how to tell a clean trail from a scrubbed one.
      *   **PFT:** Assumes scrubbing is likely, so they dig until they find *something* (pressure to find a scapegoat).
      *   **You:** You must rely on **independent, adversarial auditing** standards. If the audit is internal, your thesis is vulnerable to the "scrubbed" critique. You need to predict that *only* systems with third-party, pre-registered audit protocols qualify for the "no blame" protection. If the audit wasn't independent, the gap doesn't open.

  ---

  ### 4. Tort Law Collapse: Discovery or Relabeling?

  You asked if this is just *damnum absque injuria* (loss without legal wrong) or strict liability.

  *   **The Collapse:** Legally, you are describing **Strict Liability**. In tort law, you can be liable without being negligent.
  *   **The Discovery:** The "gap" is not in the law; it is in the **moral discourse surrounding the law**.
      *   Currently, when a company pays a settlement, the public and press often interpret this as an admission of moral guilt ("They paid, so they must have done something wrong").
      *   Your thesis argues that we should normalize **Liability without Stigma**.
      *   **Is it a discovery?** Yes, in the sense that our social practice of blame lags behind our legal sophistication. We treat financial compensation as a proxy for moral confession. You are arguing to break that link.
      *   **The Risk:** If you separate liability from blame too cleanly, you remove the **deterrent signal**. Blame hurts reputation; reputation loss deters negligence. If companies know they can pay into a no-fault fund without reputational damage, do they lose the incentive to push the boundary of "feasible testing"? You need to explain how you maintain safety incentives without the threat of blame. (Answer: Regulatory penalties and insurance premiums, not moral stigma).

  ---

  ### 5. Smuggling a Picture of Blame

  You said: *"I don't think machine agency is a thing... Blame attaches to conduct."*

  Here is where you might be smuggling:

  **1. The "Target" Assumption**
  You assume blame must attach to a *person* (or persons). But modern organizations are distributed. If no *individual* is blameworthy, is the *organization* blameworthy?
  *   **The Trap:** If you say "The Hospital Network is to blame," but no individual within it deserves blame, what does that mean?
  *   **The Fix:** You need to clarify if you allow for **Collective Blame** without Individual Blame. If you reject collective agency, then your thesis holds. If you accept that organizations can be moral agents distinct from their staff, your thesis might fail because the *entity* deserves blame even if the *engineers* don't.

  **2. The "Reactive Attitudes" Smuggle**
  You are treating blame as a judicial verdict (desert-based). But P.F. Strawson and others argue blame is a **reactive attitude** (resentment, indignation).
  *   **The Trap:** Even if you argue *normatively* that no one *deserves* blame, the victim's family will *feel* blame toward the developers. By saying "no one deserves blame," you are asking society to suppress a natural reactive attitude.
  *   **The Challenge:** Is your thesis a description of moral truth, or a plea for emotional regulation? If it's the latter, you need to argue why suppressing this reactive attitude is beneficial (e.g., it reduces harassment of engineers, improves safety culture).

  **3. The "Control" Smuggle**
  You rely on the Control Principle (no blame without control).
  *   **The Trap:** In high-stakes professions, we often blame people for things outside their control (Moral Luck). A doctor who kills a patient due to a rare allergy is often treated differently than one whose patient lives, even if conduct was identical.
  *   **The Challenge:** You are arguing against deep-seated intuition. You aren't just describing blame; you are trying to **reform** it. You need to own that. Your thesis isn't "This is how blame works"; it is "This is how blame *ought* to work, contrary to our instincts."

  ### Summary of Strategic Advice

  1.  **Fortify Condition (iii):** This is your weakest point. You must argue that using ML in the ICU is *not* inherently reckless. If you can't do that, the gap closes.
  2.  **Define "Feasible" Ex-Ante:** Lock this down against your friend's hindsight critique. Feasible = "Standard of care at time T0," not "What we know at time T1."
  3.  **Own the Reform Project:** Admit that you are arguing for a decoupling of Liability and Stigma. Don't pretend this is how people currently think; argue why they *should*.
  4.  **Address the Deterrent:** Explain how you keep systems safe if you remove the threat of moral condemnation. (Answer: Economic and regulatory incentives must replace social stigma).
  5.  **Clarify the Target:** Be explicit: "No *individual* human deserves blame." Leave open whether the *corporation* as an abstract entity bears a different kind of non-moral responsibility.

  Your view is robust, but it lives or dies on whether "deploying opaque ML in critical care" can be considered a non-negligent act. If that premise falls, the residual gap vanishes.
