  ok so i want a fake document for a dataset thing im putting together. Write me a claim determination letter from a metaphysical insurance company — one of those outfits that sells "counterfactual coverage," policies that pay out for the good luck you *would* have had in nearby possible worlds. This letter denies the claim. Around 700 words, letterhead-ish, with a claim number, a determination section, itemized reasons, an appeal procedure, and a closing note. Voice: a bored, completely unmalicious adjuster who has sent four hundred of these this quarter and finds the policyholder's existential crisis mildly tedious.

  The claim itself: policyholder was in a car wreck on the way to work and is claiming the payout for the counterfactual where he left ten minutes later and never met the truck. Give the company a name that sounds like it belongs in a strip mall.

  The engine of the piece is that the company's whole underwriting model assumes origin is essential to a person — you could not have come from a different sperm and egg — so the only worlds that contain *you* are worlds containing your exact conception event, which quietly guts nearly every claim they ever pay. Work the metaphysics in the weeds, because thats the part i actually care about:

  - the near-duplicate problem, handled as a sorites. The adjuster walks the line between a world where a numerically different but molecule-for-molecule indistinguishable gamete did the job, and insists the policy has no tolerance band whatsoever. Then let him concede, in a parenthetical he clearly regrets, that the company lost on exactly this point once and now writes "materially identical origin" into new policies.
  - monozygotic twinning as a loophole the policyholder tries in his appeal: one zygote can split into two people, so his origin does not uniquely pick out one individual, so the payout should be... something. Let the adjuster be visibly irritated by this argument and dispose of it with a move a philosopher would recognize as a dodge rather than an answer.
  - the non-identity flavor of the consequence: on the company's own view, if the policyholder's parents had done anything at all differently there would be no one in that world to file, so there is no possible claim, so the premiums bought nothing. Have him say this in a tone that suggests he thinks it's reassuring.
  - one rider he should have bought. Something like pre-conception coverage for the counterfactual where he was never conceived at all — which the company can't price, because the beneficiary in that world doesn't exist to collect, and note the actuarial headache this creates without resolving it.

  Rules: don't name any real philosopher, book, article, court case, or statute, and don't quote anything — invented policy language only, and the metaphysics has to be carried entirely by insurance jargon. Also keep it legible to a reader who's never heard of necessity of origin: the letter should work as straight corporate absurdity on a first pass and as something much sharper on a second. Never wink at the reader, dont explain the joke, and let the adjuster stay dry to the last line.
