  *   Willingness to be the person who could have stopped it, even if you couldn't.

  **What We Offer**
  *   Competitive salary with hazard weighting for high-profile incidents involving loss of life.
  *   Comprehensive legal indemnity, void if gross negligence is proven by internal audit.
  *   Media training focused on remorse modulation and body language during crisis conferences.
  *   Post-incident counselling to manage the psychological burden of being the sole liable party.
  *   Career progression into Senior Liability or Reputational Management.
  *   The satisfaction of providing society with the appearance of justice, ensuring bereaved families have someone to hold accountable.

  **How to Apply**
  Submit CV and a 500-word statement on your relationship with culpability to careers@kore.auto. Deadline 30th November.

  **Candidate FAQ**
  **Will I be trained to understand the systems I'm answerable for?**
  No. Technical understanding is unnecessary and may complicate your acceptance of responsibility. Your function is symbolic, not causal. Knowing how it works might suggest you could have intervened, which undermines the role.

  **What happens if two serious incidents land in the same quarter?**
  We view this as a volume issue. Wellness support is scaled accordingly, though liability caps remain fixed. You are contracted for the role, not the frequency of tragedy. Burnout is managed via rotation.

  **Does the indemnity cover me after I've left?**
  Coverage ceases upon termination. However, most reputational damage is immediate. We find former associates rarely face litigation after six months. The statute of limitations is your friend.

  **Can the system itself be held responsible?**
  This is a category error. Machines cannot suffer sanctions or feel regret. You can. We do not entertain discussions on machine personhood as it complicates the insurance model.
