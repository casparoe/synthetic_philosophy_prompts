answer: |-
  ### I. Underlying Assumptions

  Before adjudicating the specific moves, we must expose the bedrock assumptions each speaker is standing on. They are not arguing from the same map.

  **Dale assumes a "Biological-Volitional" model of agency and a "Discrete Event" model of injustice.**
  *   **About the City:** He treats the city council as a collection of current individuals. If the specific humans who made the decision are gone, the agent who acted is gone. For Dale, institutions are shells; only the people inside have moral capacity.
  *   **About Apology:** He views apology as a psychological state (remorse) externalized. If the current humans don't feel the remorse (because they didn't do the act), the speech act is a lie. He also treats the injustice as a closed historical event (the bulldozing in the 60s), meaning the direct victims are the only ones owed moral repair.

  **Naomi assumes a "Corporate-Functional" model of agency and a "Structural" model of injustice.**
  *   **About the City:** She treats the city as a persistent legal and moral person that transcends its personnel. It holds assets, keeps benefits (the highway, the tax base), and operates under a continuous charter. Therefore, it holds continuous liability.
  *   **About Apology:** She views apology as a public speech act that alters the normative landscape. It is not about feeling bad; it is about changing the official record from "this was progress" to "this was a crime." She sees the injustice as a flowing river—the initial displacement created a current of wealth inequality that drowns descendants today.

  ***

  ### II. Adjudication of Moves

  Here is the rating of each claim, from **Clearly Wrong** to **Clearly Right**.

  **1. Dale: The council can't apologize for something it didn't do; an apology from someone who wasn't the wrongdoer is confused.**
  *   **Rating:** **Mostly Wrong.**
  *   **Justification:** Institutions possess moral continuity beyond their personnel; if they retain the benefits of the past act, they inherit the standing to address its wrongs.

  **2. Dale: An apology with no reparations is free moral credit, and that's worse than silence.**
  *   **Rating:** **Plausible.**
  *   **Justification:** It risks "cheap grace" that closes the book morally without opening it materially, though "worse than silence" depends on whether the apology invites further claims.

  **3. Naomi: The city is one continuing agent — same charter, same assets — so it inherits the liability.**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** Legal and political philosophy recognize corporate continuity precisely to ensure obligations survive personnel changes.

  **4. Naomi: Apology isn't payment, it's acknowledgment, and money with no admission leaves the record intact.**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** Material compensation settles a debt, but only public acknowledgment corrects the historical narrative and validates the victim's experience.

  **5. Dale: An institution has neither remorse nor commitment... and descendants didn't suffer the wrong anyway.**
  *   **Rating:** **Mostly Wrong.**
  *   **Justification:** Institutions can commit procedurally via policy, and descendants do suffer the compounded structural harms of historical dispossession.

  **6. Naomi: The harm didn't stop in the 60s... descendants are victims in their own right... admission becomes ammunition for later claims.**
  *   **Rating:** **Clearly Right.**
  *   **Justification:** Structural injustice creates present-day victims, and official admission shifts the burden of proof in future political or legal struggles.

  **7. Dale: If the apology's value is mainly as a stepping stone to money, then... the families are being used as a means to a policy end.**
  *   **Rating:** **Plausible.**
  *   **Justification:** Instrumentalizing the apology for budgetary leverage risks treating the victims' dignity as a bargaining chip rather than an end in itself.

  ***

  ### III. Diagnosis: One Disagreement or Two?

  Dale and Naomi are not having one argument; they are having **two distinct arguments tangled together**, which is why they are talking past one another.

  **Argument A is Metaphysical (The Identity of the City).**
  Dale argues the city *cannot* apologize because the city *is not* the same entity that sinned. Naomi argues the city *must* apologize because the city *is* the same entity that profited. Dale is wrong here on standard institutional theory, but his intuition points to a real democratic deficit: the current voters didn't authorize this debt.

  **Argument B is Ethical (The Function of Apology).**
  Dale argues apology is about *guilt* (backward-looking, requires remorse). Naomi argues apology is about *responsibility* (forward-looking, requires acknowledgment). Dale is wrong to demand psychological remorse from a bureaucracy, but he is right to worry that "responsibility" without "guilt" can become hollow administration. Naomi is right that acknowledgment is a distinct good, but she risks overstating its utility if it remains purely symbolic.

  **The Tangle:** Dale attacks the *act* (apology) by undermining the *agent* (the city). Naomi defends the *act* by redefining the *agent*. They never actually debate whether *this specific apology* was well-constructed; they debate whether *any such apology* is possible.

  ***

  ### IV. What Both Are Missing

  Both Dale and Naomi are missing the **political dimension of the speech act itself.**

  They are treating the apology as a transaction: either a purchase of moral credit (Dale) or a down payment on future claims (Naomi). Both miss that an official apology is a **constitutive act of citizenship.**

  1.  **The Missing Obligation:** Neither addresses that a valid institutional apology *must* bind the future. It is not enough to admit the past (Naomi) or worry about the past (Dale). The apology is only valid if it creates a specific, enforceable constraint on future policy (e.g., "no future infrastructure project shall displace neighborhoods without X consent"). Without that forward-looking binding, Naomi's "ammunition" is just paper, and Dale's "theater" critique is confirmed.
  2.  **The Missing Process:** Both assume a top-down dynamic (Council speaks *at* families). They miss that the *authority* to apologize comes from the process of its creation. If the descendants helped draft the apology, Dale's "theater" charge fails even if no money changes hands, because the agency was shared. If the Council voted in a closed session, Naomi's "acknowledgment" is indeed just a record-entry with no democratic weight.

  **Verdict:** Naomi wins on the metaphysics of the city and the nature of structural harm. Dale wins on the risk of moral co-option. But the real question isn't whether they *can* apologize, but whether this apology *binds* them to do anything differently tomorrow.
