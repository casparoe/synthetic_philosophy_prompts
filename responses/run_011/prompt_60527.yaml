prompt: |-
  You're a philosopher who works on paternalism, nudging, and the ethics of choice architecture. Please think this through carefully rather than pattern-matching to the closest famous concept — I'd like you to spend a few lines at the top brainstorming candidate labels and throwing most of them out before you commit to anything.

  Some context on me: I'm not an academic, I have no philosophy training, and I don't want a reading list or citations from you (I couldn't check them anyway). I run employee benefits for a mid-sized nonprofit, and a couple of years ago I read one of those popular books about nudging, which sent me down a rabbit hole. Here's the thing I keep running into and have no word for.

  Example one. We auto-enrol people in our retirement savings plan, with an opt-out. Five years in, we surveyed everyone who'd been defaulted: about nine in ten said they were glad, said they'd choose it again, and said they'd recommend it to a friend. When I describe this setup to friends, a couple of them call it paternalistic, and my stock reply is that nobody was forced, everyone can leave, and look — the people it happened to overwhelmingly say they want it. But lately the reply has started to feel hollow. The survey measures people who have already been through the thing. The money has been sitting there for five years, it feels like theirs, and the person who would have objected in 2019 is the same person who is sincerely delighted in 2024 — not because anyone gave them an argument, but because the situation rearranged their feelings.

  Example two. A utility company in my state flipped everyone onto a green tariff by default. Two years later, polling shows much stronger support for green energy in that service area than before the switch, and the company points to that as evidence the default matched what customers really valued. Same shape as my case, different industry: the intervention happens, then the preferences get measured, then the measurement is offered as the justification for the intervention.

  So the pattern I want a name for is this. A change to the choice situation alters what people want, or at least what they report wanting, and then the fact that people want it gets cited as the reason the change was legitimate. The warrant is produced by the thing it's supposed to warrant. And it's unusually hard to attack, because you can't observe what people would have wanted otherwise — there's no clean baseline, and every survey you could run gets run on people who've already been through the machine.

  What I don't mean, because I want the edges sharp:

  It's not the general complaint that people's tastes get shaped by advertising or by growing up with less. I know there's a whole literature-ish thing about preferences adjusting to your circumstances, and it's adjacent. But that objection targets the psychology — whether a preference is authentically the person's. What I'm describing is an argumentative move, a way of discharging a justificatory burden, and it can go through even when the psychology is completely fine and everyone is perfectly sincere.

  It's not manipulation either, at least not in the usual sense. Nobody lied, the survey questions were honest, the respondents weren't deceived about anything.

  And it's not the point that you can't read off what's right from what people happen to want, because the people making the argument agree with that. They explicitly say the standard is what people would want for themselves if they weren't being herded — they just think their post-hoc survey meets that standard.

  So: does this have a name? If there's an established concept that covers it, tell me and tell me honestly how good the fit is. If there are two or three near misses, rank them and say exactly where each one stops short of what I described. And if nothing fits, coin something — I want a term with a real definition and stated boundaries, not just a slogan.

  The part I most need is the carve, because I have to make decisions with this. Sometimes being enrolled teaches you something true: I find out that saving 6 percent wasn't actually painful, and that's real information I didn't have before. Other times it just makes me comfortable with a situation I'd have hated if I'd had to walk into it deliberately. What distinguishes those two? Give me a line I could apply to a new case, not a vibe.

  Don't hand me a menu. Take a position — either name the established concept that best covers this and commit to it, or say flat out that there isn't one and commit to your own term. I'd rather have one answer I can argue with than five options I have to choose between myself.

  Please use exactly these sections, in this order:

  1. Warm-up — about 100 words. The candidate labels you considered and discarded, one line each, with why they don't quite land.
  2. Short answer — 3 or 4 sentences. What this is called, or what you're calling it.
  3. Nearest established concepts — around 300 words. Ranked, with the specific point where each one runs out.
  4. The definition — around 250 words. The term, a definition tight enough to apply, what clearly falls inside it, and what looks similar but falls outside.
  5. The benign/bad line — around 200 words. Your test for telling apart a nudge that teaches someone something true about themselves from one that just acclimates them.
  6. Where I might have described this wrong — around 150 words. Whether my two examples are really one phenomenon or two seperate ones, and what I'd have to change about the description to make your answer fit better.
