  Outside the boundary: Standard education. A teacher changes a student's mind about math, but justifies it by test scores showing competence, not just satisfaction. Fraud. A liar changes preferences, but the justification relies on deception, not post-hoc surveys. Pure coercion. No survey is taken; force is admitted.
  The core boundary is the source of the warrant. If the warrant relies on data generated by the intervention itself without a counterfactual baseline, it is bootstrapping.

  5. The benign/bad line
  To distinguish learning from acclimation, apply **The Equal-Friction Test**. Imagine resetting the scenario so that opting in and opting out require identical effort and attention. If the individual still chooses the intervention's path, they have learned something true about their values (benign). If they drift away when the default inertia is removed, their preference was merely acclimation to the path of least resistance (bad).
  In your retirement case, if removing the default makes people stop saving, they were held by inertia. If they actively re-enroll, they discovered they could afford it. The key is whether the preference survives the removal of the architectural advantage. Bootstrapping hides behind the friction; genuine welfare survives frictionless choice.

  6. Where I might have described this wrong
  Your two examples are structurally identical regarding the argumentative loop, but they may differ mechanistically. The retirement case might involve informational learning (I discovered I could afford 6%), whereas the green tariff is purely valuative alignment (I feel good about being green).
  To make my definition fit tighter, you should clarify whether the intervention provided new information or just new friction. If the default taught you something you couldn't have known otherwise (like your own budget flexibility), it's less bootstrapping and more scaffolding. If it merely relied on inertia to shift values, it's pure bootstrapping. Distinguishing information from inertia sharpens the ethical edge.
