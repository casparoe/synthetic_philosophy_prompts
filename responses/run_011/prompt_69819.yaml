          6.  **Evidential Act:** "It" is the act as evidence; "Everybody" is similar reasoners; claim is an evidential conditional. **Substantive but defensible.** Choosing to volunteer raises the probability others do, but in Leg Two, this evidence lowers expected utility unless constrained by symmetry.
          7.  **Schelling Coordination:** "It" is the salient solution; "Everybody" is the actual 24; claim is a focal point mechanism. **Needs extra premises.** 1/24 is salient only if everyone knows everyone knows the game theory, which isn't guaranteed.
          8.  **Causal Control:** "It" is the act; "Everybody" is the group; claim is magical causation. **False.** This is literally the "magical-thinking chaser" the second-year accused the supervisor of holding.

      *   *Which reading buys the mixed strategy:*
