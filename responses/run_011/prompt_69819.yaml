      *   *Reading 3: Hofstadterian Superrationality.* Relata: Reasoning procedure. Everybody: Similar reasoners. Type: Evidential correlation. (Substantive/Defensible).
      *   *Reading 4: Causal Decision Theory (CDT).* Relata: Act. Everybody: Actual 24. Type: Causal mechanism. (False/Trivial - my act doesn't cause theirs).
