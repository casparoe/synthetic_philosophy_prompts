          2.  **Kantian Maxim:** "It" is the underlying maxim (e.g., "I will volunteer"); "Everybody" is all rational agents; claim is a moral consistency test. **Needs extra premises.** Moral consistency doesn't guarantee payoff maximization without assuming others share your specific maxim derivation.
          3.  **Hofstadterian Reasoning:** "It" is the reasoning procedure; "Everybody" is agents sufficiently similar to you; claim is an evidential correlation. **Substantive but defensible.** If you are superrational, your conclusion evidences theirs, making cooperation/volunteering correlated without causation.
          4.  **Strategy Symmetry:** "It" is the probability distribution (p=1/24); "Everybody" is the actual 24 subjects; claim is a symmetric equilibrium condition. **Substantive but defensible.** If everyone adopts the same mixed strategy, p=1/24 maximizes expected utility, avoiding the 24-volunteer crash.
