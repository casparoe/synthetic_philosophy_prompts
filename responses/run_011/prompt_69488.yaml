  ok so we're on weakness of will in my philosophy of action seminar this week and I keep going back and forth on something, would love your actual number on it. The claim: that quasi-hyperbolic / β-δ discounting gives the *correct* explanation of paradigmatic akrasia — the Davidson-style case where someone acts against their own all-things-considered judgment. Not "it's a useful modeling device," correct explanation, i.e. if you had the full story of what's going on in the agent, discount-rate-shape stuff would be in it and the judgment stuff would either drop out or be reducible to it.

