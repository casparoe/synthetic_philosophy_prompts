  (a) whether people's discounting is actually hyperbolic-ish rather than roughly exponential in the domains where akrasia shows up — my sense from the readings is that measured discount rates vary by orders of magnitude depending on how you elicit them, which seems bad for the model;
  (b) whether a preference reversal between a far-sighted self and a near-sighted self can even count as acting against *your own* better judgment, or whether that framing dissolves the phenomenon by quietly replacing one agent with two agent-ish temporal parts;
  (c) whether first-person reports carry any evidential weight here, since "I knew it was wrong but I did it anyway" could easily be post-hoc reconstruction rather than a description of an occurrent judgment at the moment of action;
  (d) whether akrasia is one phenomenon at all, or a grab-bag (procrastination, addiction, the second slice of cake) that happens to share a label, in which case a single discounting story would be the wrong kind of answer.

  Give each a probability and a line or two of why, then show me how you're combining them and what the bottom line is. Then say which term the total is most sensitive to and what would genuinely move it — real evidence or a real argument, not "more research is needed." And if you think I've stated the claim badly enough that it doesn't have a truth value, say that instead and give me a repaired version plus your credence on that one.
