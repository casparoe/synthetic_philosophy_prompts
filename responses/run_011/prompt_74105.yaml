answer: |-
  **MEMORANDUM**

  **TO:** State Sentencing Commission
  **FROM:** Commissioner [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Purposes Clause Amendments (Draft A vs. Draft B)

  **Recommendation**

  We are not merely editing statutory text; we are choosing the moral architecture of state punishment. The choice between Draft A and Draft B is not pragmatic but philosophical. Draft A adopts a forward-looking, risk-based model akin to public health quarantine. Draft B retains a backward-looking desert model constrained by necessity. Both drafts contain fatal flaws if adopted in isolation. Draft A fails to prevent disproportionate confinement based on algorithmic risk; Draft B fails to sufficiently constrain punitive excess.

  I recommend we reject both and adopt **Draft C**, a modified hybrid. Draft C retains desert as a ceiling to ensure proportionality but adopts Draft A's forward-looking review mechanisms to drive sentence length downward within that ceiling. This opinion explains why this synthesis is the only path that satisfies our legal obligations and moral commitments.

  **The Philosophical Stakes**

  To decide, we must understand what each side views as the fundamental *injustice* of the other. This is not about what works, but what is right.

  Defenders of Draft A (aligned with philosopher Gregg Caruso) argue that because no one chooses their genetics, upbringing, or neural architecture, no one truly deserves suffering. To them, the injustice of Draft B is treating human beings as moral authors when they are merely products of causal chains. Punishing based on desert is akin to punishing someone for having cancer. Confinement is only legitimate to protect the public, like quarantining a carrier of a dangerous disease.

  Defenders of Draft B (aligned with Daniel Dennett) argue that treating people as responsible agents is necessary to cultivate the very capacities we value: reason-recognition and impulse control. To them, the injustice of Draft A is treating offenders like objects or patients rather than citizens. If we stop holding people answerable, we dissolve the competence required for them to become better. A code that ignores desert treats humans as broken machines rather than moral participants.

  However, both camps in this room have misunderstood the philosophers they cite. First, Dennett is not a desert-maximizer. He supports holding people responsible, but only insofar as it serves social utility; he accepts necessity constraints. Second, Caruso's quarantine analogy is not a license for indefinite containment. Quarantine ethics demand necessity, the least restrictive means, and immediate release when the danger passes. Draft A's sponsors have ignored these constraints, while Draft B's sponsors have ignored Dennett's utilitarian limits.

  **Resolving the Deadlocks**

  Three specific issues have deadlocked us. Draft C resolves them by integrating the strengths of both positions.

  **1. Asymmetry and Internal Limits**
  Under Draft A, a person convicted of a low-level property offense but assessed as high-risk could be confined longer than a person convicted of a violent offense assessed as low-risk. The sponsor argues the statutory maximum prevents this. Opponents correctly reply that a maximum caps a class of offenses, not the relationship between them. Draft A exchanges a desert ceiling for an actuarial one, lacking a principled internal limit. A purely forward-looking rationale cannot explain why a shoplifter should not be held longer than an assailant if the shoplifter is deemed riskier.

  Draft C resolves this by retaining the current clause's proportionality language as a *limiting principle*. Desert sets the ceiling; risk assessment determines the length within that ceiling. This prevents the asymmetry where a minor offense yields a major sentence solely due to algorithmic risk scores.

  **2. Retroactivity and the Petitioner Problem**
   Roughly 1,400 people are serving terms under the current clause. Draft A bars any review that would lengthen a term. However, we must address the hypothetical petitioner whom the new criteria would entitle to *more* time because their risk score is higher than their original sentence assumed.

  The Commission must recommend that no petitioner receives more time than originally imposed. Liberty interests trump risk assessments in retroactive application. To lengthen a sentence based on new criteria violates ex post facto principles and basic fairness. If the new system is more humane, it should apply fully to reduce sentences, but never to increase them. The state cannot bargain away liberty based on rules enacted after the fact.

  **3. Address and Demographic Skew**
  Victim representatives argue that if terms are set by scores, the process stops asking anything of the offender. There is no acknowledgment, apology, or restitution, only management. Furthermore, risk instruments carry documented demographic skews that will fall hardest on the communities reform is meant to help.

  Draft C addresses this by making offender engagement a statutory criterion for risk reduction. A risk score cannot be the sole determinant; the panel must assess active efforts at restitution and rehabilitation. This restores the "address" victims demand—requiring the offender to act as a moral agent—while mitigating demographic skew by weighting static historical factors less heavily than dynamic behavioral changes.

  **Operative Language for Draft C**

  The Purposes Clause shall read:

  > "The purposes of sentencing are to protect the public, rehabilitate the offender, and repair the harm caused. The sanction imposed shall be proportionate to the seriousness of the offense and the offender's culpability, serving as a maximum ceiling for confinement. Within this ceiling, the length of a custodial term shall be set by an assessment of the offender's continuing risk and need for rehabilitation. No sentence may be more severe than is required to achieve these purposes. Custodial terms shall be reviewed periodically by a panel, considering the offender's efforts at restitution and acknowledgment of harm."

  **Review Panel Criteria**

  To operationalize this, the review panel must apply three specific criteria to individual petitions for modification or release:

  1.  **Dynamic Risk Reduction:** Has the offender demonstrably reduced dynamic risk factors (e.g., substance abuse, employment status) since sentencing, distinct from static historical factors?
  2.  **Restorative Engagement:** Has the offender made good-faith efforts toward restitution or victim acknowledgment, where feasible, indicating moral reintegration?
  3.  **Least Restrictive Means:** Is there a non-custodial alternative available that satisfies the public protection purpose without exceeding the proportionality ceiling?

  **Phased Timetable**

  Implementation requires stability. We propose a phased timetable across the next two legislative sessions:

  *   **Session 1 (Immediate):** Enact Draft C purposes clause. Establish the review panel. Begin pilot reviews for the 1,400 current inmates, focusing solely on sentence reduction where risk is low. Commission a study on demographic skew in risk instruments.
  *   **Session 2 (Following Year):** Full implementation of periodic review for all custodial terms. Enact statutory adjustments to statutory maximums to align with the new proportionality ceiling. Publish the demographic study and mandate instrument adjustments if bias is confirmed.

  **The Strongest Objection**

  The strongest reason to reject Draft C is uncertainty. By blending desert and risk, we create a system that is harder to predict than pure determinate sentencing (Draft B) and less streamlined than pure risk management (Draft A). Judges and victims may find the hybrid model confusing. It requires judges to weigh moral culpability against actuarial risk, potentially leading to inconsistent rulings during the transition.

  This objection does not prevail because the certainty of the status quo is an illusion. Our current system already mixes these goals inconsistently, often hiding risk assessments behind desert rhetoric. Draft C makes the tension explicit and manageable. The cost of administrative complexity is outweighed by the moral cost of imprisoning people longer than they deserve (Draft B's risk) or imprisoning people without regard for their culpability (Draft A's risk). We must choose the complexity of justice over the simplicity of error.

  **Conclusion**

  We cannot adopt a system that treats offenders as mere vectors of disease (Draft A), nor can we retain a system that punishes beyond what is necessary (Draft B). Draft C acknowledges that while we may not be metaphysically free in the way retributivists hope, we are socially responsible in the way compatibilists require. It uses desert to protect the offender from the state, and risk assessment to protect the state from the offender, within those bounds.

  I urge the Commission to vote for Draft C. It is the only option that respects the offender as an agent, the victim as a stakeholder, and the public as the beneficiary of a just system.
