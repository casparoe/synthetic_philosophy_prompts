answer: |-
  1. The shipowner is the sovereign people, while the brawling sailors represent partisan legislators competing for popular favor. The true navigator corresponds to the independent expert panel, reading the stars of empirical constraint rather than political wind. The destination is the statutory target set by legislature, and the voyage is the technical implementation of policy within those bounds.

  2. The critical disanalogy is that a ship's destination is empirically distinct from the means of sailing, whereas political goals like climate targets inherently embed contested distributive choices about who bears the cost. When experts define the viable paths to a target, they inevitably select between value-laden trade-offs that belong to the political realm, not the technical one. This collapses the means-ends distinction his entire delegation model relies upon to remain democratic.

  3. Objections that experts lack democratic legitimacy or may be fallible miss that his model retains legislative override and restricts experts to predefined statutory targets. Similarly, claiming citizens differ from passengers ignores his concession that this mechanism applies only where functional consensus on goals already exists. These critiques attack pure epistocracy, but his hybrid design explicitly builds in democratic safety valves against those specific risks.

  4. By insisting legitimacy flows from agreed targets, he silently shifts the normative weight from the navigator's knowledge of the stars to the shipowner's choice of port. If the experts' veto power allows them to reject routes based on feasibility, they effectively gain veto power over the destination itself whenever targets are ambitious. The expertise claim thus becomes a Trojan horse for agenda-setting, disguising value judgments about trade-offs as neutral technical constraints.

  5. A construction safety inspector better captures the arrangement, as they can halt work that violates physical constraints without deciding what building gets erected. This analogy licenses a veto only on clear violations of established safety codes, not on broader policy judgments about utility or cost distribution. Unlike the ship, this acknowledges that while physics is non-negotiable, the value of the building remains entirely with the owner.
