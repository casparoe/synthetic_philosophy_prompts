answer: |-
  This is an exceptionally clean reconstruction of a standard and powerful objection to Confucian role ethics (often called the "Collapsing Argument"). Your friend has successfully formalized the worry that particularism either collapses into universalism or dissolves into arbitrariness.

  Here is the diagnosis: **The argument is valid, but it is unsound.** It fails because it imports a legalistic, rule-based metaphysics into a system that operates on an aesthetic, cultivation-based metaphysics.

  To save role ethics without conceding to impartialism, you should **reject Premise (2)**, while simultaneously refining Premise (1) and blocking the inference in Premise (7).

  Here is the detailed breakdown of why this is the correct move, what it costs, and how it affects the three parties you mentioned.

  ### 1. The Diagnosis: A Category Mistake
  Your friend's argument assumes that "roles" function like **job descriptions** or **legal contracts**. In that model, a role is a set of rules ($R_1, R_2, R_3$). If Role A demands $X$ and Role B demands $\neg X$, you have a logical contradiction. To resolve it, you need a meta-rule (Premise 2). If you don't have a meta-rule, the choice is arbitrary (Premise 5).

  However, in the Ames–Rosemont program (and classical Confucianism), roles are not rule-sets; they are **ongoing performances of relationship**. The normative force does not come from the "description" of the role, but from the **quality of the enactment** (*Ren* / *Yi*).

  Therefore, Premise (2) is false: *"If obligations have no standing outside the roles that generate them, nothing internal to the theory can rank one role's demands against another."*

  This is false because Confucian ethics possesses an internal mechanism for resolving conflict that is not an "external standpoint": **_Quan_ (權), or discretionary weighing.**

  ### 2. Rejecting Premise (2): The Mechanism of *Quan*
  In Confucian ethics, when roles conflict, one does not consult a hierarchy of roles (Son > Ruler). One consults the **contextual appropriateness** (*Yi*) of the action in that specific situation.

  *   **The Correction:** The theory *does* have a way to rank demands, but it is not algorithmic. It relies on the cultivated judgment of the moral agent. The "standing" comes not from outside the roles, but from the **coherence of the total life narrative**.
  *   **The Cost:** You lose codifiability. You cannot write a handbook that says "Always prioritize Father over King." You must instead cultivate the wisdom to know when the Father's demand violates the *Dao* so severely that preserving the relationship requires abdication (Shun) rather than corruption.
  *   **Why this saves (1):** You keep the claim that obligations arise from roles. You simply deny that roles are static rule-buckets. They are dynamic fields of force. The "ranking" is not a theoretical hierarchy but a situational resolution.

  ### 3. Re-interpreting the Shun Case (Addressing your second doubt)
  Your suspicion about Premise (4) is correct and supports the rejection of (2).

  Shun does not rank "Son" above "Ruler." If he did, he would use his power as Ruler to pardon his father (corrupting the Ruler role to serve the Son role). Instead, he **abandons the Ruler role** to fulfill the Son role.
  *   **Implication:** This is not a ranking of roles within the system; it is a recognition that **the roles have become incompatible in this specific context.**
  *   **The Logic:** To remain a moral person (*Junzi*), one cannot hold two roles that demand contradictory moral actions. Shun chooses the role that allows him to remain human (Son) and discards the one that requires him to become inhuman (a Ruler who protects a murderer).
  *   **Result:** This is not a "brute preference" (Premise 4). It is a judgment based on the constitutive nature of the roles. The role of "Son" is ontologically prior to "Ruler" in Confucian metaphysics (family is the root of the state), but this is not an external impartial standard; it is an internal claim about what makes a human life cohere.

  ### 4. Blocking Premise (7): The Normative Filter
  Premise (7) claims: *"Whatever social position one occupies generates whatever obligations it carries... one who occupies the role of hired killer owes the employer the killing."*

  This is the easiest premise to block, and doing so protects Premise (8) (that arbitrariness is intolerable).

  *   **The Distinction:** Confucian role ethics distinguishes between **constitutive roles** (The Five Relations: Father/Son, Ruler/Minister, etc.) and **contingent positions** (Hired Killer, Corrupt Magistrate).
  *   **The Filter:** A "role" only generates moral obligations if it contributes to human flourishing (*Ren*). A "hired killer" is not a valid moral role in Confucianism; it is a perversion of relationship. Therefore, the obligation to kill is not a *moral* obligation, even if it is a *contractual* one.
  *   **Why this works:** This does not appeal to an "impartial standpoint." It appeals to the internal definition of what counts as a humanizing role. Impartialism asks, "Is this rule universalizable?" Role Ethics asks, "Is this relationship humanizing?"
  *   **Result:** You avoid the "intolerable" conclusion of (7) without needing an external impartial standard. You simply deny that the "hired killer" has a moral role to begin with.

  ### 5. Summary of Costs and Benefits

  If you reject (2) and refine (1) and (7) as above, here is how the three parties fare:

  **A. The Confucian (Role Ethicist)**
  *   **Gains:** Avoids collapsing into impartialism. Preserves the distinctiveness of partial obligations.
  *   **Loses:** The ability to provide a decision procedure. You cannot tell a student *in advance* how to resolve every conflict. You can only train their character (*Yi*) to weigh correctly (*Quan*).
  *   **Status:** Survives as a distinct third way (neither impartialist nor arbitrary).

  **B. The Impartialist**
  *   **Gains:** Can claim that *Quan* (weighing) secretly relies on a conception of the Good, which looks suspiciously like a universal standard.
  *   **Loses:** The claim that Role Ethics is *just* impartialism in disguise. The "standard" being used is not neutral/universal (e.g., Utility or Categorical Imperative) but is deeply embedded in a specific conception of relational human nature.
  *   **Status:** Forced to admit that their "impartiality" also rests on a substantive (non-neutral) view of human flourishing.

  **C. Ordinary Morality (Parents/Lawyers)**
  *   **Gains:** Validates the intuition that a parent *should* favor their child, and a lawyer *should* zealously defend, without calling it "arbitrary."
  *   **Loses:** The comfort of thinking these duties are absolute. Just as Shun had to abdicate, a lawyer may have to withdraw if the defense requires suborning perjury. The role has limits defined by the *Dao* (human flourishing), not just the job description.
  *   **Status:** Vindicated, but with the caveat that professional roles are subordinate to constitutive human roles.

  ### 6. Recommendation
  You said you want to keep (1) and (8).
  *   **Keep (1)** but clarify that "roles" are not static rule-sets but dynamic relational processes.
  *   **Keep (8)** by using the "Normative Filter" to block the Hired Killer objection.
  *   **Reject (2).** This is the cheapest cost. It costs you algorithmic certainty, but that is a price Confucianism is already willing to pay.

  **The Final Diagnosis:** Your friend's argument is a **category error**. It treats an **aesthetic/coherence** system (Confucianism) as if it were a **legal/logical** system (Kantianism/Utilitarianism). In a legal system, conflicting laws require a higher court (external standard). In an aesthetic system, conflicting elements require a rebalancing of the whole (internal judgment). Shun's abdication is not a legal ruling; it is an aesthetic resolution to preserve the integrity of the composition.

  Tell your friend: *"You have proven that Role Ethics cannot be a Rule Ethics. But Confucians never claimed it was."*
