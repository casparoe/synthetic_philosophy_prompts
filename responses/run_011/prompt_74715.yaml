  2.  **$C_2$ (Macro-Truth):** Vagueness in aggregate boundaries (e.g., "cycle start") does not prevent statements from being truth-apt via operationalization. (0.95)
      *   *Justification:* Simulation logs allow precise filtering (e.g., Fourier transforms on price indices), rendering macro-claims empirically decidable.
  3.  **$C_3$ (Derivation Existence):** A mathematical derivation from micro-rules to macro-period exists "in principle," even if computationally irreducible. (0.85)
      *   *Justification:* The system is algorithmic; the code *is* the derivation, even if a closed-form analytic solution is unavailable.
  4.  **$C_4$ (Explanatory Loss):** A micro-level explanation captures the pattern's robustness across parameter sweeps "without loss" of understanding. (0.50)
      *   *Justification:* Micro-explanations are typically brittle to parameter changes; capturing invariance usually requires abstracting away from individual heuristics.

  **Combination Logic:**
  I treat P as the conjunction of A and B ($P \approx A \times B$), assuming explanatory reduction presupposes entailment. A is the product of the scope and truth-aptness conditions ($A = C_1 \times C_2 = 0.98 \times 0.95 = 0.93$). B is the product of the existence of a derivation and the preservation of explanatory power ($B = C_3 \times C_4 = 0.85 \times 0.50 = 0.425 \approx 0.43$). Thus, $P(P) = 0.93 \times 0.43 = 0.3999 \approx 0.40$.

