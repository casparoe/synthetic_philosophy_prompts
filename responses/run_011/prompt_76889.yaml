  #### 4. Motivation for Item 5

  **Derivation Status:**
  Item 5 cannot be derived from Item 4. It is an unmotivated verdict within your current package. In the literature, the $1/2$ verdict is usually motivated by a **Principle of Antecedent Stability**: learning a conditional should not change the probability of its antecedent unless the conditional contradicts prior facts.

  **Repair:**
  To preserve C5, you must restrict C4.
  *   **Restriction:** MRE applies only to constraints on factual probabilities. Conditional testimony imposes a constraint on conditional probabilities *plus* a constraint of **Independence** between the conditional information and the antecedent's probability.
  *   **Cost:** This is ad hoc. You are effectively building the verdict ($P(N)$ doesn't change) into the rule. You must argue why conditional testimony carries this independence presumption while factual testimony (e.g., "The company is in the Hills or South") does not.
  *   **Price:** You abandon the "uniform norm" claim in C4. You now have two update rules: one for facts (MRE), one for conditionals (Adams Update + Stability).

