  # The Evening Plan: The Ticket Auction

  ## The Currency: Raffle Tickets
  **What it is:** On arrival, every member receives **10 Tickets**. These are physical slips of paper, numbered or stamped. At the very end of the evening, all tickets held by the group are put into a drum. One ticket is drawn. The holder wins the **£15 cash prize**.

  **Why this bites:**
  1.  **It is not cash:** Nobody feels they are gambling their own money from their wallet. This lowers the barrier to entry.
  2.  **It has value:** Every ticket represents a share of the £15. If there are 140 tickets in the room (14 people × 10), each ticket is worth roughly 10p. Burning a ticket feels like throwing away 10p.
  3.  **It creates scarcity:** Once you spend a ticket, it is gone. You cannot earn more. If you run out, you cannot win the prize. This makes the loss feel real without opening a purse.

  ## The Game: The All-Pay Auction
  **The Setup:** You place a **£5 note** in a clear envelope on the table.
  **The Rule:** Players bid Tickets for the envelope.
  **The Trap:** The highest bidder wins the £5 note. **However, every player who places a bid must pay the tickets they bid.** (If Alice bids 5 tickets and Bob bids 10, Bob gets the £5, but *both* Alice and Bob lose their tickets to the house).
  **The Way to Play Well:** Bid 1 Ticket. If anyone bids against you, stop immediately. You lose 1 Ticket (approx 10p value) rather than escalating. This is the rational "cut your losses" move.
  **The Fool's Play:** Bidding more than 50 Tickets. Since 50 Tickets is roughly the value of the £5 note (given the raffle odds), bidding 60 Tickets means you are paying £6 worth of chances to win £5.

  ## The Two Versions
  You will run this auction twice in the same evening. The prize (£5) and the currency (Tickets) remain the same. Only **one feature** changes.

  *   **Round 1 (Open Outcry):** Players bid by raising hands and calling out numbers. Everyone knows who is bidding and how much.
  *   **Round 2 (Sealed Bids):** Players write their bid on a slip of paper and hand it to you privately. You open them all at once. Nobody knows what anyone else bid until the winner is announced.

  **Why this difference matters:**
  This isolates **Hunch 1 (The Audience)**.
  *   If **Hunch 1** is the true driver, Round 1 will see much higher bidding than Round 2. People will escalate because they do not want to be seen "walking away" in front of the group. In Round 2, with no eyes on them, they should bid sensibly.
  *   If **Hunch 1** is *not* the driver, the bidding in Round 1 and Round 2 will be roughly the same. This proves the mechanism is internal (Hunch 2 or 3), not social.

  ## Signatures Table: What to Watch For
  Use this table during the game and the debrief to judge which hunch is at work.

  | Hunch | If this is the true explanation, you will see... | If one of the others is true, you will see... |
  | :--- | :--- | :--- |
  | **1. The Audience** | **Round 1 bids will be much higher than Round 2.** In Round 1, players will look at each other, hesitate, or say things like "I'm not letting him win it." In Round 2, bids will drop sharply because the shame is removed. | Bidding remains high in both rounds. People do not seem to care who is watching; they are fighting the game, not the room. |
  | **2. The Story** | **Players talk about "finishing" or "principle".** They say things like "I've come this far," or "I'm not leaving it unfinished." This happens in both rounds equally. | Players talk about numbers and odds. They do not mention the narrative of the game, only the value of the tickets. |
  | **3. The Arithmetic** | **Players focus on the "next step".** They say "It's only one more ticket," ignoring the tickets already spent. They calculate the chance of winning the next bid, not the total loss. | Players realise the total cost. They say "I've already lost too much," and stop. They see the total picture, not just the margin. |

  ## The Debrief Questions
  *Do not explain the theory until after these questions are answered. Read them exactly as written.*

  1.  "In the first game, when you put your hand up to bid, what was going through your mind about the other people in the room?"
  2.  "In the second game, when you wrote your number down, did you feel differently about spending the tickets? Why?"
  3.  "At what point did you decide to stop bidding? Was it a number, or was it a feeling?"
  4.  "If you could have your tickets back, would you play the same way again? If not, what would you change?"
  5.  "Did anyone feel that stopping early meant admitting they had made a mistake?"

  ## Run Sheet (90 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00:00 – 00:10** | **Arrival & Setup** | Hand out 10 Tickets to each person. Put the £15 prize envelope on display (unopened). Explain the Ticket Raffle rules clearly. |
  | **00:10 – 00:15** | **Game 1 Instructions** | Place the £5 note in the clear envelope. Explain the All-Pay rule: *"Highest bidder wins the £5. Everyone who bids pays their bid. Tickets go in the burn box."* |
  | **00:15 – 00:40** | **Game 1 (Open Outcry)** | Run the auction. Encourage bidding if it stalls ("Do I hear 2?"). Stop when bidding ceases. Collect losing tickets visibly. |
  | **00:40 – 00:50** | **Reset** | Return remaining tickets to players (ensure they know how many they have left). Do not discuss the game yet. |
  | **00:50 – 00:55** | **Game 2 Instructions** | Explain the change: *"Same prize, same cost. But this time, write your bid on this slip. Hand it to me. I won't open them until everyone has bid."* |
  | **00:55 – 01:15** | **Game 2 (Sealed Bids)** | Collect slips. Open them. Announce winner. Collect losing tickets. |
  | **01:15 – 01:25** | **The Debrief** | Ask the five questions listed above. Let the group discuss. Take notes on their answers. |
  | **01:25 – 01:30** | **The Reveal** | Explain what you were testing. Read out the three hunches. Tell them the name of the pattern (see end of this document). Draw the raffle for the £15. |

  ## Materials List
  1.  **140 Raffle Tickets:** You can make these from stiff card. Cut 140 rectangles (approx 3cm x 5cm). Stamp or number them if you like, but plain is fine.
  2.  **Two Clear Envelopes:** One for the £5 note (to show it's real), one for the £15 prize.
  3.  **Cash:** £5 note for the game, £15 note for the final prize.
  4.  **Slips of Paper & Pens:** 14 of each, for the Sealed Bid round.
  5.  **A "Burn Box":** A small tin or bowl to collect the spent tickets. Seeing the pile grow is part of the pressure.
  6.  **Printed Questions:** Have the five debrief questions on a card so you don't forget the wording.

  ## Troubleshooting: What Will Go Wrong
  **1. The Spotter:** Someone will realise the trap in the first five minutes of Game 1 and announce it.
  *   **Fix:** Thank them, and say, "That's a very sharp eye. For the sake of the experiment, I need to see how the rest of the room reacts without that knowledge. Can you sit this round out and help me watch?" Give them a job (timing the rounds).

  **2. The Grudge Match:** Two people turn it into a personal duel and burn all their tickets.
  *   **Fix:** Intervene before tickets run out. "Gentlemen, remember the tickets are for the £15 prize at the end. If you burn them all now, you're out of the running for the main prize. Is this £5 worth losing the £15 chance?" This usually cools them down.

  **3. The Refuser:** One person refuses to play, saying it's a trick.
  *   **Fix:** Let them opt out. They are valuable. In the debrief, ask them: "You saw through it straight away. What did you see that the rest of us missed?" Their answers often highlight the Arithmetic hunch.

  **4. The Quiet Room:** Nobody wants to bid in Game 1.
  *   **Fix:** You must seed the pot. Bid 1 Ticket yourself to get the ball rolling. Then step back. Do not bid again.

  **5. Time Run-Over:** The discussion drags on.
  *   **Fix:** Cut the second game short. If Game 1 took 25 minutes, limit Game 2 to 10 minutes. The lesson is learned in the first game; the second is just for comparison.

  ## Limitation: The Untestable Hunch
  This activity **cannot test Hunch 2 (Keeping the Story Unfinished)** with any certainty.

  **Why:** Your van project lasted four years; the neighbour dispute lasted two. Those were sagas. This game lasts twenty minutes. It is too short for a "story" to develop in the way you experienced it. In a short game, "stopping" feels like a tactical decision, not a life narrative.

  **What you would have to supply:** To test Hunch 2 properly, you would need a game that spans *multiple evenings*. You would need to start a project in Week 1, invest tickets, have it stall, and see who returns in Week 2 to "finish what they started." That requires a commitment from your group you cannot demand for a single design. You will have to rely on their answers to Question 5 ("Did stopping feel like admitting a mistake?") to guess at this one.

  ## The Name
  The pattern you have walked into, and the mechanism you have tested tonight, is known in academic circles as the **Sunk Cost Fallacy**, often linked to **Escalation of Commitment**.
