prompt: |-
  so i was up until 2am arguing with a friend about conscription and i lost the argument in real time, which means i now get to lose it again next week in front of a room. Help.

  The setup: I'm giving a paper at our department's political theory workshop. About 18 people. Mostly liberal egalitarians of a broadly Rawlsian bent who treat bodily autonomy as close to a trump and who will smell a consequentialist move from across the room. Two just war theorists who care almost entirely about jus ad bellum and will not let me smuggle a deterrence argument in where a right-intention argument should be. One comparativist who works on civil-military relations and has actually done fieldwork inside two NATO militaries — she has data and I have intuitions. And one guy in the program who did eight years as an E-6 before coming back to school, who will not say anything for forty minutes and then say the most damaging thing in the room. Nobody there does Swiss or Nordic politics as their thing.

  The thesis, so you know what they'll be shooting at. I am explicitly NOT arguing that conscript armies fight better. I concede capability, retention, and basically every number in a readiness report to the professional force, up front, in the first three minutes. My claim is narrower and weirder: the all-volunteer force is best understood as a moral-hazard machine. It lowers the political price of going to war precisely at the point where that price is doing the most epistemic work, because the electorate no longer has to hand over any of its own children in order to authorize a war. Conscription on the Swiss/Nordic model is then a precommitment device — a democracy deliberately and visibly raises its own cost of aggression in advance — and that device does double duty: a domestic check on war-making, and a credible signal to adversaries, which is the armed-neutrality porcupine function. The hinge, and the place my friend actually got me, is that those two functions can come apart. If you only want the signal, a much smaller and cheaper force gets you most of it. If you want the check, you might have to keep conscription even where it is militarily suboptimal and where your own general staff hates it. I argue the check wins. That last move is where the paper lives and also where it's thinnest.

  Give me my Q&A prep sheet. Exactly nine numbered items and nothing else — no intro, no wrap-up, no paragraph before item 1.

  Items 1 through 8 are the objections this particular room will raise, ordered by how much damage they do to me, not by how interesting they are. For each: the objection phrased the way that person would actually phrase it (the Rawlsian will not say "you're instrumentalizing citizens," she'll say something else — get the register right; the just war people will go at the intention/authority end, not the casualty-count end; the comparativist will go empirical and will reach for Sweden turning conscription off and then back on again, and Finland keeping theirs and then joining an alliance, and Switzerland not having fought anyone in a very long time with terrain that made invasion expensive anyway). Not the objections I'd get from a military history audience or from a libertarian one. Each item gets my reply in the two minutes I'll actually have, and then a flag on exactly where the reply is soft — the bit I'd rather they didn't press on. Put the tag [load-bearing] on the single reply that has to land for the paper to survive at all. One of the eight should be the objection I am praying nobody raises, and say which one that is inside the item.

  Item 9 is for you, not for me: tell me which of the eight you think genuinely beats me, and what would change your mind about that — i.e. what I would have to show or argue for you to move it from fatal to survivable. If you think none of them beats me, say which one comes closest and where your own reading of my argument is most likely to be wrong, because you're reconstructing a thesis from one paragraph and I don't want you to be confident about a strawman you built yourself.
