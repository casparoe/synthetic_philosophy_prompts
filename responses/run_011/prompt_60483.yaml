answer: |-
  ### The Argument (In Plain Words)

  You are standing in the middle of a fight between two ways of seeing how rules work. You don't need the names, just the mechanic.

  **Side A says:** A rule is a tool. If the membership voted for it, it exists. It doesn't matter if it's cruel, forgotten, or stupid. If the committee starts deciding which rules "count" based on whether they seem nice, the committee becomes the boss. You lose predictability. The cure for a bad rule is to change the rule, not to ignore it.

  **Side B says:** A rule is a promise. If you have a rule that says "three absences = out," but for ten years you've never kicked anyone out for absences, you have broken the promise. You have told workers, by your actions, that the rule doesn't exist. To suddenly enforce it is a trap. A rule that is secret, impossible to follow, or enforced only when convenient isn't a rule; it's a weapon.

  **The Usable Truth:** In a co-op, Side B is usually more important for survival. Co-ops run on trust, not coercion. If you enforce a "zombie rule" (one that exists on paper but is dead in practice), you teach the membership that the bylaws are a minefield, not a guardrail. However, if you let the committee decide too freely which rules are "zombies," you invite bias (e.g., "I like Sarah, so her rule violation doesn't count").

  The procedure below tries to balance this. It forces you to validate the *rule* before you judge the *person*.

  ***

  ### The Procedure: Rule Validity Check

  Run this *before* you look at the evidence of what the worker did. If the rule fails this check, the case is dismissed regardless of guilt.

  **Step 1: Authority & Access**
  *   **Question:** Is this rule written in the current, ratified bylaws or policy handbook? Was it accessible to the worker at the time of the incident?
  *   **Pass:** It is in the current document, and the document was available (digital or physical) to all owners.
  *   **Fail:** It is in an old version, a draft, a meeting minute that was never adopted, or a section that was renumbered/hidden without notice.
  *   **⚠️ JUDGMENT CALL:** "Accessible." If it was buried in a 200-page PDF no one reads, is that accessible? *Decision:* If the specific policy was never highlighted in onboarding or a memo, mark this as **Warning**. Two Warnings = Fail.

  **Step 2: Congruence (The "Zombie" Test)**
  *   **Question:** Has this rule been enforced consistently in the last [X] years?
  *   **Pass:** It has been enforced at least once in the last 3 years, OR there has been a explicit reminder to staff in the last year that "we are enforcing this."
  *   **Fail:** No one can recall this being enforced in 5+ years, and no reminders were sent.
  *   **⚠️ JUDGMENT CALL:** Defining "Enforced." Does a verbal warning count? *Decision:* Only documented sanctions count. If you have to guess, the rule is dead.

  **Step 3: Clarity & Scope**
  *   **Question:** Does the text of the rule clearly cover the specific action taken?
  *   **Pass:** A neutral third party would read the rule and agree this action fits the definition.
  *   **Fail:** You have to stretch the definition, use analogies, or assume intent to make it fit.
  *   **⚠️ JUDGMENT CALL:** "Neutral third party." You are not neutral. *Decision:* If two committee members disagree on whether the action fits the text, you fail this step. Do not vote on it. If you can't agree on what the words mean, the rule is too vague to punish.

  **Step 4: Possibility**
  *   **Question:** Was it physically or practically possible for the worker to comply?
  *   **Pass:** Compliance required standard effort/time.
  *   **Fail:** Compliance required impossible knowledge, superhuman speed, or violating a *higher* rule (e.g., safety law, labor law).
  *   **⚠️ JUDGMENT CALL:** "Practically possible." *Decision:* If the staffing schedule made compliance impossible (e.g., "Do safety check" but you were the only person on floor during a rush), the rule fails here.

  **Step 5: The "Stop" Trigger**
  *   **Condition:** If the rule passes Steps 1-4, but the mandatory penalty is expulsion/termination.
  *   **Action:** You do not decide guilt yet. You flag the case for the **Membership Vote** with a recommendation. You cannot finalize an expulsion yourselves.
  *   **⚠️ JUDGMENT CALL:** The Recommendation. This is where your values enter. You can recommend "Expulsion," "Probation," or "Warning." But you must write the rationale.

  ***

  ### Thresholds: When is a Rule "Not a Rule"?

  Use this to guide your **Step 2 (Congruence)** and **Step 3 (Clarity)** decisions.

  **Treat as NOT A RULE (Dismiss Case):**
  1.  **The Secret Rule:** It was never communicated, or it lives in a document version that was superseded.
  2.  **The Ghost Rule:** It hasn't been enforced in 5+ years and no one knew it was active. (This protects the Absence Lady).
  3.  **The Contradiction:** Following this rule requires breaking another rule.
  4.  **The Retroactive:** You are punishing an act that wasn't a violation when it happened.

  **Treat as BAD RULE (Enforce, but Flag for Membership):**
  1.  **The Harsh Rule:** It is known and enforced, but the penalty feels too high for the crime. (This captures the Bread Guy).
  2.  **The Unpopular Rule:** The membership hates it, but they haven't voted to change it yet.
  3.  **The Inconsistent Rule:** It is enforced, but sometimes people get warnings and sometimes they don't. (Fix the consistency, don't toss the rule).

  ***

  ### Running the Cases

  Here is how the procedure handles your three scenarios.

  #### Case 1: The Absence Clause (The Zombie Rule)
  *   **Step 1 (Access):** It is in the bylaws, but renumbered twice. *Warning.*
  *   **Step 2 (Congruence):** Not enforced in 10 years. No reminders. **FAIL.**
  *   **Step 3 (Clarity):** Clear text. *Pass.*
  *   **Step 4 (Possibility):** Kid in hospital makes it practically impossible to prioritize shifts. *Warning/Fail.*
  *   **Outcome:** **Rule Invalid.**
  *   **Rationale:** The committee refuses to hear the case. The rule is deemed abandoned by the membership through long-term non-enforcement. The worker keeps their standing. The committee sends a note to the next membership meeting: "Bylaw Section X is dead. Please vote to remove it so we don't have this confusion again."
  *   **Verdict:** You will like this. It saves the worker.

  #### Case 2: The Bread (The Harsh Rule)
  *   **Step 1 (Access):** Rule is posted, in handbook, discussed in onboarding. *Pass.*
  *   **Step 2 (Congruence):** Enforced twice in last 3 years. *Pass.*
  *   **Step 3 (Clarity):** "Removing product without paying." He took a loaf, didn't pay/ring. *Pass.* (Intent doesn't change the act).
  *   **Step 4 (Possibility):** He could have rung it up. He forgot. *Pass.*
  *   **Step 5 (Stop Trigger):** Penalty is expulsion.
  *   **Outcome:** **Rule Valid. Violation Confirmed. Recommendation: Expulsion.**
  *   **Rationale:** "The member admitted to removing inventory without processing. Bylaw Y states this is grounds for termination of ownership. While the member cites forgetfulness, the integrity of inventory control relies on strict adherence. We recommend expulsion but note the member's long history of good standing."
  *   **Verdict:** **You will hate this.** It feels cruel to fire someone for a loaf of bread. But the procedure forces you to admit that if you make an exception here, you break the rule for the next person who steals a $50 steak and claims it was a "mistake." The procedure protects the *system*, not the *individual*. The mercy must come from the Membership Vote, not your committee. You are the guardrails, not the judge.

  #### Case 3: The No-Rule (The Invention)
  *   **Step 1 (Access):** No text exists. **FAIL.**
  *   **Outcome:** **Case Dismissed.**
  *   **Rationale:** "No existing bylaw or policy covers this conduct. The committee cannot create policy ad hoc."
  *   **Verdict:** You will feel frustrated. Someone did something wrong, maybe even harmful, but you have to let them walk.
  *   **Why:** If you punish without a rule, you are a mob, not a committee. The fix is to write the rule for *next time*, not to burn this person to establish it.

  ***

  ### What This Procedure Cannot Do (The Misfires)

  You need to tell your committee this upfront. This checklist is not magic.

  **1. It cannot fix power imbalances.**
  If a popular founder breaks a rule, the committee will feel pressure to "interpret" Step 3 (Clarity) loosely to save them. If a disliked worker breaks the same rule, you will interpret it strictly. The checklist doesn't stop bias; it just makes you write down where you exercised it. *Mitigation:* Publish your rationale templates anonymously before the vote.

  **2. It cannot handle "Spirit of the Law" emergencies.**
  Sometimes breaking a rule saves the co-op (e.g., breaking a cash-handling rule to rush an injured customer to the hospital). Step 4 (Possibility) might catch this, but often it won't. *Mitigation:* Add a "Necessity Defense" clause to Step 4: "Did the violation prevent greater harm to people or the business?"

  **3. It creates a "Tick-Box" morality.**
  Your committee might feel that if you followed the steps, you are absolved of the outcome. You aren't. If you recommend expulsion for the Bread Guy, you own that recommendation. The checklist ensures you were *consistent*, not that you were *kind*.

  **4. It relies on accurate records.**
  Step 2 (Congruence) fails if your record-keeping is trash. If you can't prove the Absence Rule wasn't enforced, you might have to enforce it. *Mitigation:* If records are missing, default to the worker's benefit.

  **5. It stops at the Membership.**
  This is the hardest part. You might do all this work, recommend expulsion for the Bread Guy, and the Membership votes to keep him. That feels like your work was wasted. It isn't. You established the facts and the rule. They exercised their sovereignty. That is how a co-op works. You are the judiciary; they are the legislature. Do not confuse the two.

  ### Final Word

  The "Hate" outcome (Case 2) is the price of the job. If you cannot recommend expulsion for a clear violation of a known rule because the penalty feels too high, you are not a conduct committee; you are a mercy committee. If you want to save the Bread Guy, your job is not to twist the rules in the committee room. Your job is to go to the Membership *before* the next crisis and say: "The zero-tolerance theft policy is causing unjust outcomes. We propose amending it to allow for warnings on first offenses under $20."

  Change the law. Don't break it. That's the only way to keep the trust of the 45 owners who are watching to see if the rules apply to everyone, or just the ones you like.
