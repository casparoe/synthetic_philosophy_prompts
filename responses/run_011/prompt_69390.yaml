prompt: |-
  I am in the third week of a moral psychology course, and we have been working through moral foundations theory in detail — including the questionnaire itself rather than only the textbook summaries. I would like you to treat the instrument and its standard interpretation as a single practice and tell me what theory of morality it presupposes. Three features have been troubling me, and I suspect they are entangled.

  First, the questionnaire asks respondents two kinds of question: how relevant various considerations are to their moral judgments — whether someone suffered, whether someone was denied a right or treated unfairly, whether someone showed a lack of respect, whether someone did something disgusting — and whether they agree with a set of general moral statements. Both require a person to step back and articulate the grounds of a disapproval. The same research program, however, argues from dumbfounding vignettes involving incest or the eating of a dog killed by a car that moral judgment is produced by fast intuition, with verbal reasoning largely an after-the-fact justification. What has to be true about the relation between intuition and self-report for a reflective relevance rating to count as a measurement of an intuitive module? Is there a coherent account on which the measurement strategy and the theory that motivates it stand together, or does the first quietly contradict the second?

  Second, the criteria offered for admitting something to the list of foundations are of this sort: an immediate emotional response, presence across many cultures, a plausible biological predisposition, and a plausible adaptive function. Nothing in that list concerns harm or fairness. Does it therefore already settle the dispute with critics who hold that authority and purity violations are social conventions that some cultures have moralized rather than moral concerns in themselves? And is the taxonomy exposed to refutation in that direction, given that it has only ever been expanded — an original hierarchy ethic split into loyalty and authority, a liberty foundation added later — and never reduced?

  Third, the foundations are said to be universal, yet results are reported as continuous individual differences, and the familiar conclusion is that conservatives draw on all five while liberals draw chiefly on two, glossed as a difference in the breadth of a person's moral sensibility rather than as a disagreement about what morality consists in. That gloss seems to require that a liberal who scores low on sanctity nevertheless possesses the sanctity foundation and merely neglects it — a claim about a latent module, not about a person's values. What rival view does the gloss rule out? And what does the slide from adaptive function to genuine moral standing presuppose about the connection between the two, when the evidence offered for the group-oriented foundations is that they helped groups cohere?

  Please reconstruct the implicit theory as a whole; separate what the design strictly presupposes from what merely sits comfortably with it; mark the places where the practice is philosophically underdetermined, such that several rival theories would license the same items and the same scoring; and then say concretely what would have to change — the items, the scoring, or the conclusions drawn from the left-right asymmetry — if that implicit theory were replaced by a harm-based account on which the remaining foundations are derivative. Finally, since the question my course keeps circling is whether this psychology can tell us anything about which side is right: does the instrument's own design settle that question in advance, and if so, in which direction?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Context:** Third week of a moral psychology course, focusing on Moral Foundations Theory (MFT) and its questionnaire (MFQ).
      *   **Task:** Treat the instrument (MFQ) and its standard interpretation as a single practice. Identify the *implicit theory of morality* it presupposes.
      *   **Specific Concerns (Three Features):**
          1.  *Method vs. Theory:* Self-report (reflective) vs. Social Intuitionist Model (fast intuition/justification). How can self-report measure intuition? Is there a contradiction?
          2.  *Criteria for Foundations:* Emotional response, cross-cultural, biological, adaptive. No requirement for harm/fairness. Does this beg the question against critics (conventionalists)? Is the taxonomy unfalsifiable (only expands, never reduces)?
          3.  *Universality vs. Individual Differences:* Foundations are universal modules, but results show liberal/conservative splits (2 vs. 5+). The gloss is "neglect" vs. "absence." What rival views does this rule out? What does the slide from "adaptive function" to "moral standing" presuppose?
      *   **Required Output:**
          1.  Reconstruct the implicit theory as a whole.
          2.  Separate strict presuppositions from comfortable fits.
          3.  Mark philosophically underdetermined areas (where rival theories fit the same data).
          4.  Concrete changes needed if replaced by a harm-based account (monism).
          5.  Address the normative question: Does the design settle who is right (liberals vs. conservatives)?

  2.  **Analyze Feature 1: Method vs. Theory (Self-Report vs. Intuition):**

      *   *The Tension:* Haidt's Social Intuitionist Model (SIM) says reasoning is post-hoc. The MFQ asks people to report on their reasoning/relevance.
      *   *The Resolution (Implicit Theory):* The theory assumes *accessibility*. While the *trigger* is intuitive, the *content* of the intuition is accessible to consciousness as a "feeling of relevance." It presupposes a "weak introspectionism." It assumes that while people can't trace the causal chain, they can accurately report the *phenomenology* of the trigger.
      *   *Contradiction?* Not necessarily a logical contradiction, but a methodological gamble. It assumes the "press secretary" (conscious reasoning) can accurately report the "president's" (intuition) priorities, even if the press secretary lies about *why*.
      *   *Strict Presupposition:* Moral intuitions have distinct phenomenological signatures that can be mapped to verbal descriptors.
      *   *Underdetermined:* A skeptic could say the self-report measures *endorsed norms*, not *intuitive triggers*.

  3.  **Analyze Feature 2: Criteria for Foundations (The "Moral" Definition):**

      *   *The Criteria:* Emotion, Culture, Biology, Adaptation.
      *   *The Implication:* This is a *naturalistic* definition of morality, not a *normative* one. It defines morality by *origin* and *function*, not by *content* (like harm).
      *   *Begging the Question?* Yes, against Kantians or Harm-Monists. If you define morality as "what binds groups," then authority/purity are moral. If you define it as "what prevents suffering," they aren't. The MFQ presupposes the former (functionalist/pluralist).
      *   *Falsifiability:* The user notes it only expands. This suggests a "just-so story" risk. If a new emotion is found, it becomes a foundation.
      *   *Strict Presupposition:* Morality is a natural kind discoverable by evolutionary psychology, not a philosophical concept definable by necessary conditions like "harm."

  4.  **Analyze Feature 3: Universality vs. Individual Differences (The Liberal/Conservative Gap):**

      *   *The Claim:* All humans have the *capacity* (the module), but cultures/individuals *tune* them differently.
      *   *The Gloss:* Liberals "neglect" Sanctity/Authority; Conservatives use all.
      *   *Rival View Ruled Out:* The view that Liberals *lack* the module or that the module is a *delusion* imposed by culture. It rules out the idea that Authority/Purity are *mistakes* rather than *options*.
      *   *Adaptive Function to Moral Standing:* This is the Is-Ought slide. Just because a trait helped groups cohere (Is) doesn't mean it *ought* to be weighted equally in modern morality (Ought). The theory presupposes that evolutionary fitness confers normative weight (moral realist leanings based on function).
      *   *Strict Presupposition:* The latent structure is uniform; variance is in activation thresholds.

  5.  **Synthesize the Implicit Theory:**

      *   *Name:* Evolutionary Moral Pluralism (or Functionalist Pluralism).
      *   *Core:* Morality is a set of innate, modular psychological systems selected for group cohesion.
      *   *Epistemology:* Introspective access to intuitive relevance is valid data.
      *   *Ontology:* Moral foundations are real psychological entities, not just social constructs.

  6.  **Address the "Harm-Based Account" Counterfactual:**

      *   *If Harm-Monism were true:* Authority/Purity are derivatives of Harm/Fairness (e.g., purity violations are seen as harmful to the soul/community).
      *   *Changes needed:*
          *   *Items:* Remove direct questions about "purity" or "authority" as intrinsic. Ask about *consequences* of those violations.
          *   *Scoring:* Factor analysis should show Purity/Authority loading onto Harm/Care.
          *   *Conclusions:* The Liberal/Conservative gap isn't "breadth," it's "accuracy." Liberals see the harm; Conservatives are confused by surface features.

  7.  **Address the Normative Question (Who is Right?):**

      *   *Does the design settle it?* Yes, implicitly.
      *   *Direction:* It favors the Conservative view (or at least validates it as "complete"). By defining morality as *whatever foundations exist*, and finding Conservatives use more of them, the instrument defines Conservatism as "more moral" (or at least "more morally sensitive").
      *   *Bias:* It builds pluralism into the measurement. A harm-monist would fail the test by design.

  8.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Academic, precise, philosophical, respectful of the student's deep engagement.
      *   *Structure:* Follow the user's prompt structure (Reconstruction, Separation, Underdetermination, Counterfactual, Normative Settlement).
      *   *Key Concept:* Distinguish between *Descriptive Psychology* (what is) and *Normative Ethics* (what ought to be). The MFQ blurs this.
      *   *Refining the "Self-Report" point:* Use the analogy of tasting food. You can't taste the chemistry (causal), but you can taste "sweet" (phenomenological). MFT assumes moral intuition is like taste.
      *   *Refining the "Falsifiability" point:* Acknowledge the "expansion only" critique. This is a weakness in the research program.
      *   *Refining the "Is-Ought" point:* This is crucial. The move from "adaptive" to "moral" is the biggest philosophical leap.

  9.  **Final Review against constraints:**
      *   Did I answer all three specific troubles? Yes.
      *   Did I reconstruct the implicit theory? Yes.
      *   Did I separate presuppositions from comfortable fits? Yes.
      *   Did I mark underdetermined areas? Yes.
      *   Did I specify changes for a harm-based account? Yes.
      *   Did I answer the "who is right" question? Yes.

      *(Self-Correction during drafting)*: Make sure not to simply bash MFT. The prompt asks to reconstruct the *implicit theory*, not just critique it. I need to show how the practitioners *think* it holds together, even if there are tensions. The tension between SIM and Self-Report is the trickiest part. I need to explain how they reconcile it (phenomenological access).

      *(Refining the "Harm-Based" section)*: Be specific. If Harm is the only foundation, the MFQ items on Sanctity are measuring *misperceived* harm. So the scoring would need to control for belief in harm.

      *(Refining the "Who is Right" section)*: The instrument doesn't prove conservatives are *morally* right, but it proves they are *psychologically* more representative of the species' toolkit. But by framing "morality" as the toolkit, it implicitly validates the conservative view as "more moral." This is the "naturalistic fallacy" trap.

  10. **Final Polish:** Ensure clear headings and precise philosophical terminology (e.g., "phenomenological access," "naturalistic fallacy," "construct validity").

      *(Final check of the prompt's specific phrasing)*: "Tell me what theory of morality it presupposes." "Reconstruct the implicit theory as a whole." "Separate what the design strictly presupposes from what merely sits comfortably with it." "Mark the places where the practice is philosophically underdetermined." "Say concretely what would have to change." "Does the instrument's own design settle that question in advance?"

      Okay, ready to write.
answer: |-
  This is a sophisticated set of questions that cuts to the methodological and philosophical core of Moral Foundations Theory (MFT). You have identified the tension between the *descriptive psychology* MFT claims to be and the *normative implications* often drawn from it.

  Below is a reconstruction of the implicit theory presupposed by the Moral Foundations Questionnaire (MFQ) and its standard interpretation, followed by an analysis of its presuppositions, underdetermined areas, and the consequences of adopting a rival theory.

  ### I. Reconstruction of the Implicit Theory

  The MFQ and its interpretation presuppose a theory we might call **Evolutionary Moral Pluralism with Phenomenological Access.**

  1.  **Ontology (What morality is):** Morality is not a singular rational principle (like utility or duty) but a natural kind composed of discrete, innate psychological modules. These modules are "foundations" because they are the bedrock upon which cultural virtues are built.
  2.  **Epistemology (How we know it):** While moral *judgments* are intuitive (per the Social Intuitionist Model), the *content* of those intuitions is phenomenologically accessible. A subject can reliably report the "relevance" of a consideration (e.g., "Did this feel disgusting?") even if they cannot articulate the causal reasoning behind the judgment.
  3.  **Teleology (Why it exists):** The validity of a foundation is secured by its evolutionary history. If a psychological mechanism served an adaptive function (e.g., group cohesion, pathogen avoidance), it counts as a moral foundation.
  4.  **Typology (How it varies):** Individual and cultural differences are not differences in the *possession* of these modules (which are universal) but in the *activation thresholds* and *weighting* of them.

  ### II. Addressing Your Three Troubles

  Here is how the implicit theory attempts to resolve the tensions you identified, and where the resolutions are fragile.

  #### 1. The Method-Theory Tension (Self-Report vs. Intuition)
  *   **The Tension:** The Social Intuitionist Model (SIM) claims reasoning is post-hoc justification. The MFQ asks for reflective self-report.
  *   **The Implicit Resolution:** The theory presupposes **Phenomenological Access.** It distinguishes between *causal access* (knowing why you feel this way) and *qualitative access* (knowing what it feels like). The MFQ assumes that while respondents cannot trace the neural cause of their intuition, they can accurately label the *type* of intuition (e.g., distinguishing "anger at unfairness" from "disgust at degradation").
  *   **Strict Presupposition:** Moral intuitions have distinct, reportable phenomenological signatures.
  *   **Comfortable Fit:** It sits comfortably with the SIM only if we assume the "press secretary" (conscious reasoning) is a liar about *causes* but an honest reporter about *priorities*.
  *   **Underdetermination:** A rival theory (e.g., **Social Constructivism**) could argue that the self-reports measure *learned scripts* rather than *innate modules*. When a respondent says "Authority is relevant," the Constructivist says they are reporting a norm they were taught to endorse, not an intuitive trigger. The MFQ data looks the same for both, but the interpretation differs.

  #### 2. The Criteria for Foundations (Function vs. Normativity)
  *   **The Tension:** The criteria (emotion, culture, biology, adaptation) exclude harm/fairness as necessary conditions.
  *   **The Implicit Resolution:** This is a **Naturalistic Definition.** The theory presupposes that "morality" is defined by its psychological and evolutionary origin, not its philosophical content. By defining morality functionally (what binds groups), it bypasses the philosophical dispute about whether authority *should* be moral.
  *   **Strict Presupposition:** Evolutionary fitness confers moral status. If a trait helped ancestors survive/cohere, it is a legitimate part of the moral domain.
  *   **Comfortable Fit:** This fits comfortably with evolutionary psychology but creates a **Naturalistic Fallacy** risk. It assumes that because a foundation *exists* and *functioned*, it has *normative weight* in the present.
  *   **Underdetermination:** You noted the taxonomy only expands. This reveals the theory is **non-falsifiable** regarding the *number* of foundations. If a new emotion is found, it becomes a foundation. A rival **Harm-Monist** theory could argue that Authority and Purity are merely *heuristics* for detecting Harm (e.g., we hate purity violations because we fear contamination/harm). The MFQ treats them as distinct; the Monist treats them as derivative. The questionnaire items do not strictly distinguish between "intrinsic wrongness" and "instrumental wrongness."

  #### 3. Universality vs. Individual Differences (The Liberal/Conservative Gap)
  *   **The Tension:** Foundations are universal modules, yet liberals score low on some. The gloss is "neglect" vs. "absence."
  *   **The Implicit Resolution:** This presupposes a **Latent Variable Model.** The foundation is a capacity (like language acquisition), not a fixed behavior. Liberals *have* the sanctity module but suppress it.
  *   **Rival View Ruled Out:** This gloss rules out the view that the Sanctity/Authority foundations are **cultural illusions** or **errors.** It rules out the possibility that Liberals are not "neglecting" a module but have correctly identified that Sanctity is *not* moral. It forces the interpretation that Conservatism is "more complete" psychologically.
  *   **The Slide:** Moving from "adaptive function" (groups cohered) to "moral standing" (groups *ought* to cohere this way) presupposes that **social cohesion is a moral good in itself**, regardless of the cost to individuals.

  ### III. What is Strictly Presupposed vs. Underdetermined

  | Feature | Strictly Presupposed by Design | Merely Comfortable Fit | Philosophically Underdetermined |
  | :--- | :--- | :--- | :--- |
  | **Self-Report** | Subjects can distinguish moral emotions (e.g., anger vs. disgust) reliably. | These emotions map 1:1 to evolutionary modules. | Whether the report measures *intuition* or *endorsed norms*. |
  | **Foundations** | Morality is pluralistic by nature. | The specific list (5 or 6) is final or complete. | Whether Authority/Purity are intrinsic goods or instrumental heuristics for Harm. |
  | **Politics** | Moral sensitivity is continuous (thresholds). | Higher sensitivity = better morality. | Whether the Liberal "narrowing" is a bug (blindness) or a feature (refinement). |
  | **Evolution** | Adaptive history validates moral relevance. | Current adaptive value matches ancestral value. | Whether "group cohesion" is a moral terminal value. |

  ### IV. The Harm-Based Counterfactual

  If you replaced the implicit theory with a **Harm-Based Monism** (where Care/Harm is the only true foundation, and Authority/Loyalty/Purity are derivative heuristics or errors), the practice would have to change concretely:

  1.  **The Items:** You could not ask, "Is respect for authority relevant to morality?" as a standalone question. You would have to ask, "Does violating authority *cause harm*?" or "Is this authority violation wrong *even if no one is hurt*?"
      *   *Current MFQ:* "Whether or not someone showed a lack of respect for authorities."
      *   *Harm-MFQ:* "Whether or not someone undermined a system that protects people from harm."
  2.  **The Scoring:** Factor analysis would be expected to show Authority, Loyalty, and Purity loading onto the Care/Harm factor (as secondary indicators), rather than emerging as orthogonal factors. If they remain orthogonal, the Harm-Monist must argue the instrument is measuring *confusion*, not *foundations*.
  3.  **The Conclusions:** The Left-Right asymmetry would not be described as "breadth of sensibility" (2 foundations vs. 5). It would be described as **accuracy of perception.**
      *   *Current:* Conservatives see more moral truths.
      *   *Harm-View:* Liberals see the core truth (harm); Conservatives are distracted by surface features (purity/authority) that may not be morally salient.

  ### V. Does the Instrument Settle the Normative Question?

  **Yes, the instrument's design settles the question in advance, and it favors the Conservative/Pluralist view.**

  Here is why:
  1.  **Definition by Measurement:** By constructing a questionnaire that treats Authority and Sanctity as *sui generis* moral inputs (equal in status to Harm), the instrument defines morality as Pluralist. A Harm-Monist *cannot* score high on this test without contradicting their own theory. The test defines the "full" moral palate as one that includes all five foundations.
  2.  **The "Blindness" Frame:** By interpreting low scores on Sanctity/Authority as "neglect" or "reduced sensitivity" rather than "rejection" or "moral progress," the theory pathologizes the Liberal stance. It frames the Liberal view as a *deficit* (missing modules) rather than a *choice* (prioritizing harm over tradition).
  3.  **The Is-Ought Slide:** Because the foundations are validated by evolutionary function (Is), and the questionnaire measures the presence of these functions, the resulting profile implies that the configuration closest to the "ancestral norm" (which the data suggests is the Conservative profile) is the most robust.

  **Conclusion:**
  The MFQ is not a neutral measuring stick. It is a theory-laden instrument that operationalizes morality as **evolutionary functionalism.** It cannot tell you which side is *ethically* right because it has already answered that question *psychologically*: it assumes that if a moral feeling exists and evolved, it has a claim on us.

  If your course asks whether this psychology tells us who is right, the answer is: **Only if you accept that evolutionary fitness determines moral truth.** If you believe morality is about rational justification or the reduction of suffering (independent of evolutionary history), the instrument's design begs the question against you. It measures "moral foundations" only by defining them as the things conservatives and liberals disagree about, and then counts the number of foundations used to determine who is "more moral."
