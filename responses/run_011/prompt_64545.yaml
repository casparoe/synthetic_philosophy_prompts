answer: |-
  **MEMORANDUM**

  **TO:** Scientific Advisory Panel (SAP) and Agency Staff
  **FROM:** [Your Name], SAP Member
  **DATE:** October 26, 2023
  **SUBJECT:** Protocol for Hazard Parameter Submission – [Contaminant Name] Assessment

  We face a deadline in two weeks to resolve the methodology for deriving risk parameters for [Contaminant Name]. The current impasse pits scientific integrity against statutory compliance and operational clarity. After reviewing the arguments, I recommend we adopt a **Hybrid Submission Protocol** for this assessment. This approach satisfies the statutory requirement for a "best estimate" while preserving the uncertainty data necessary to defend that estimate legally and scientifically.

  **The Recommendation**
  For this contaminant, outside experts shall submit three items for each parameter:
  1.  **Lower and Upper Bounds:** Reflecting the plausible range of values.
  2.  **A Recommended Point Estimate:** A single number selected by the *expert* (not staff) from within that range, representing the "best estimate" based on weight of evidence.
  3.  **An Uncertainty Narrative:** A brief note justifying the width of the range and the confidence in the recommended point.

  **Operational Instructions for Staff**
  *   **Calculation:** Staff will use the **Recommended Point Estimate** provided by the experts for the final averaging and cleanup standard calculation. Staff will *not* select a number from a range.
  *   **Documentation:** Staff will archive the Bounds and Narrative in the administrative record. These do not determine the standard directly but serve as the defense file should the "best estimate" be challenged as arbitrary.
  *   **Uniformity:** To avoid mixing points and ranges, this three-part format is mandatory for all experts on this specific assessment.

  **Addressing Panel Concerns**
  *   **Statutory Compliance:** The statute requires a "best estimate." By requiring the expert to identify a Recommended Point, we fulfill this requirement without forcing the expert to hide the uncertainty. We are not dumping the political choice on staff; the expert retains the responsibility for the number used.
  *   **The "Widening Range" Objection:** One member noted that ranges sometimes widen as data increases. This is a valid observation, but it indicates honesty, not failure. Initial thin data often reflects controlled animal studies (narrow variance). As we incorporate human variability, exposure pathways, and sensitive subpopulations, the *true* uncertainty widens. A narrow range based on thin data is "fake precision." A wider range based on robust data is accurate risk characterization. Adopting the Hybrid Protocol ensures we are not falsely confident.
  *   **Toxicologists' Concern:** The argument that point estimates on thin data are "fake precision" is scientifically sound. However, a regulatory standard cannot be a range. The Hybrid Protocol acknowledges the imprecision (via the bounds/narrative) without paralyzing the regulatory action (via the recommended point).

  **Conclusion**
  This protocol allows us to sign off on a number as the statute demands, while insulating the agency from claims that we ignored scientific uncertainty. It places the burden of justification on the experts, where it belongs, rather than on staff. I propose we vote to adopt this procedure for the [Contaminant Name] assessment immediately, with a view to codifying it for future data-limited contaminants.
