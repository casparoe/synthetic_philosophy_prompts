answer: |-
  You bring me news that gladdens my heart, yet strikes me with some astonishment. If I understand you correctly, this private concern has institutionalized the method of trial and error which I proposed for the Socialist Planning Board. You say this apparatus observes surpluses and shortages—what you call warehouse levels and sales—and adjusts the parametric prices accordingly, without waiting for the slow negotiation of contracts. This is precisely the Walrasian *tâtonnement* I described in my recent papers. If a capitalist firm can organize such a flow of information without relying on the market for every internal transfer, it demonstrates that the logical possibility of rational calculation without private capital markets is not merely a theoretical construct, but a practical technique. It suggests that Professor Mises was wrong to claim the impossibility, even if Professor Hayek might still worry about the complexity of scaling such a thing to the whole nation.

  However, I must inquire as to the nature of this "machine" you describe. In my writings, I assumed the Planning Board would rely on statistical bureaus and accountants to gather this data, a process I admitted might be slow and burdened by bureaucracy. You speak of revisions twice a day across four thousand shops. By what mechanical means is this data transmitted and calculated? Is this a system of punch cards and electromechanical tabulators? The speed you describe implies a reduction in the cost of gathering dispersed knowledge that I had not anticipated. If the friction of information transfer is so low within your firm, it strengthens my argument that bureaucracy need not be the sluggish beast my critics claim. But I must understand the technical coefficients of this apparatus to know if it is truly analogous to my Board.

  There is, however, a distinction we must examine before you declare the debate closed. Your firm operates within a capitalist economy; you take the prices of your suppliers and the wages of your workers as given parameters from the outside market. My proposal concerns an economy where *all* prices of production goods are determined by the Board. Does your machine also determine the prices of the trucks that deliver your goods, or the machinery that manufactures your tins? If you rely on external markets for the means of production, you have solved the problem of internal allocation, which large firms have always done, but not necessarily the general equilibrium of the whole society. Tell me, when your machine orders stock, does it negotiate the price with the supplier, or is that too fixed by the market outside your doors?
