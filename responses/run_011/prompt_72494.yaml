answer: |-
  Right, let's have a proper look at this. You've spotted the exact problem that keeps political theorists up at night: our intuitions are usually a mash-up of different ideas that don't always fit together.

  Your gut isn't reaching for one single thing; it's reaching for a hybrid. The "live with the decision" idea you started with is called the *All-Affected Principle*, and as you found, it's too wide (it gives babies and tourists a vote).

  Based on your verdicts, the principle that fits best is **"The Principle of Habitual Stakeholding."**

  This isn't about citizenship, and it isn't about pure knowledge. It's about whether you are a functioning, embedded member of the community who is capable of holding responsibility. Here is how that principle breaks down into three specific rules, why each rule exists, and which of your cases forced it in.

  ### The Three Pillars of Your Principle

  **1. The Rule of Habitual Residence and Contribution**
  *   **What it does:** It grants the vote to anyone who makes their life here and contributes to the system, regardless of passport. It removes the vote from citizens who have left the community permanently.
  *   **Which cases forced this in:**
      *   **The Polish Mum:** She forced the rule that *citizenship is not required*. Her 20 years, taxes, and family mean she is embedded in the society. Excluding her is wrong because she bears the consequences of government without a say.
      *   **The Australian Expat:** He forced the rule that *citizenship is not enough*. He has the passport, but he has no stake in the outcome. He doesn't live here, pay here, or use the services here.
      *   **The Nurse in Dubai:** She clarified the boundary. She is a citizen temporarily absent, but her "habitual home" remains the UK. She intends to return and reintegrate. The Expat does not.
  *   **The Verdict:** If you live here as your main home and contribute, you vote. If you live elsewhere permanently, you don't.

  **2. The Rule of Legal Autonomy (The Bright Line)**
  *   **What it does:** It sets a fixed age where you are legally considered an adult, ignoring individual intelligence or interest. It prioritises administrative clarity over individual fairness.
  *   **Which cases forced this in:**
      *   **The 16-Year-Old vs. The 14-Year-Old:** You want 16s in but 14s out, even if the 14-year-old is smarter. This forces the principle to accept that *capacity is a legal status, not a test*. We can't have exams to see if you're "political enough."
      *   **The Clueless Adult:** You are fine with adults voting even if they know nothing. This confirms that the right to vote is about *status*, not *competence*. Once you cross the age threshold, you are presumed capable.
  *   **The Verdict:** Once you hit the age of majority (which you feel is 16), you are in. Before that, you are out. Knowledge is irrelevant.

  **3. The Rule of Proportional Civic Forfeiture**
  *   **What it does:** It suggests that breaking the law doesn't automatically remove your membership, but a severe enough breach severs your tie to the social contract.
  *   **Which cases forced this in:**
      *   **The Prisoners:** This is the messiest bit of your logic. You feel a man inside for six weeks (a fine) is still a member of the community. A lifer is not. This implies that voting is a right of *membership*, and serious crime can expel you from that membership.
  *   **The Verdict:** Minor breaches = keep the vote. Serious breaches = lose the vote.

  ---

  ### What This Principle Says About New Cases

  If we apply **Habitual Stakeholding** strictly, here is what it says about situations you haven't listed:

  *   **Homeless People:** They should definitely vote. They lack a fixed address, which is often a bureaucratic barrier, but under your principle, they are subject to the laws and live within the community. Excluding them would be wrong.
  *   **People with Severe Learning Disabilities:** This is a hard one. Your "Legal Autonomy" rule relies on age as a proxy for capacity. If an adult has the mental capacity of a child, your principle struggles. However, because you said "clueless adults" can vote, your principle leans towards *inclusivity*. It would likely say they should vote, perhaps with support, because we don't test adults for intelligence.
  *   **Second-Home Owners:** A wealthy person who owns a flat in London but lives in Monaco for tax reasons. Your principle says **no vote**. They have a property, but no "habitual residence" or daily stake in the community's functioning.
  *   **Asylum Seekers:** If they have been here for 6 months, waiting for a decision. Your principle is tricky here. They are subject to the laws, but their "habitual" status is temporary/uncertain. However, given your view on the Polish Mum, your principle leans towards: if they are working and living here, they should have a say, even if their status is precarious.

  ---

  ### The Casualties: Where Your Logic Breaks

  You asked me to be honest about which of your verdicts this principle cannot save. A coherent principle always requires sacrificing some intuitions. Here are the three contradictions you will have to live with.

  **1. The Irish Student Problem (The "Stake" Inconsistency)**
  *   **The Conflict:** You think the Polish Mum (20 years, taxes, kids) *must* be allowed to vote. You think the Irish Student (3 years, uni, leaving, clueless) *can* vote.
  *   **The Break:** Under "Habitual Stakeholding," the Polish Mum has a *stronger* claim than the student. If you let the student in because he is "resident," you must let the mum in (which you want). But if you argue the mum deserves it because of her *deep ties*, then the student arguably shouldn't vote because his ties are weak and temporary.
  *   **The Sacrifice:** To keep your view, you have to accept that **any** residency is enough, even temporary. This weakens your argument against the Expat. You have to draw an arbitrary line between "3 years at uni" (in) and "40 years in Oz" (out). The principle can't explain *why* 3 years is enough stake but 40 years abroad isn't, other than saying "physical presence."

  **2. The Prisoner Line (The "Forfeiture" Inconsistency)**
  *   **The Conflict:** You say 6 weeks = vote, Life = no vote.
  *   **The Break:** There is no logical principle that explains where the line is. Is it 5 years? 10 years? Why does a crime against the state (treason) remove the vote, but a violent crime against a person might not?
  *   **The Sacrifice:** You have to admit this part of your view is **emotional, not principled**. You feel a lifer has "opted out" of society, but a fine-dodger hasn't. A strict principle would say either *all* prisoners vote (because they still live under the laws) or *no* prisoners vote (because they breached the contract). Your middle ground is humane, but it lacks a consistent rule.

  **3. The 14-Year-Old Politician (The "Competence" Inconsistency)**
  *   **The Conflict:** You are happy for a clueless adult to vote, but not a knowledgeable 14-year-old.
  *   **The Break:** This confirms your principle is about **Authority**, not **Wisdom**. You are prioritising the legal status of adulthood over the actual ability to make a decision.
  *   **The Sacrifice:** You have to accept that your system will sometimes be **less competent** than it could be. By banning the 14-year-old, you are actively excluding someone more informed than many adult voters. Your principle saves the "rule of law" (we need a clear age limit) but sacrifices "good decision making."

  ### Summary for Your Project

  If you need to write this up, your core argument is:

  > "Voting rights should not be based on **Nationality** (which excludes the Polish Mum), nor on **Competence** (which excludes the 14-year-old), but on **Habitual Stakeholding**. This means anyone who makes their life here, contributes to the system, and has reached the age of legal autonomy should vote. Citizenship is merely a proxy for this, not the requirement itself."

  It's a solid, defensible position. Just acknowledge in your conclusion that the "Prisoner" and "Student" examples show that drawing the exact boundaries of "stake" and "forfeiture" is always going to involve some arbitrary lines. That's not a failure of your project; that's a feature of politics.
