prompt: |-
  i TA a survey course on medieval political thought and this term i've been trying to get the students to actually apply Aquinas on tyranny rather than just summarize him. Last year's discussion exercise died because I used a lame case — some unnamed king who taxes too much — and everyone just repeated the "tyranny is directed at private advantage, kingship at the common good" line and went home. So this year I made up something more annoying and i want to sanity-check what a strong answer would look like before I hand it out.

  The case: President Marek of Karsan (fictional) was elected legitimately about twelve years ago, then rewrote the electoral law, jailed the opposition leadership, and now rules by decree. The independent press is gone and there are credable reports of torture in the security services. Crucially, there's no domestic institution left with standing to remove him — courts are packed, the legislature is a rubber stamp, and elections are still scheduled but the results get pre-anounced. Two options are on the table. Option A: a foreign intelligence service covertly reprograms the pacemaker in Marek's chest so that he dies of what will look like a heart attack; the service's own lawyers argue it's an act of national defense, because Karsani forces have been shelling across the border for two years. Option B: Marek's personal nurse, a Karsani woman whose brother died in custody, drugs his infusion. She acts entirely alone, tells no one, and has zero institutional backing, though she's read the underground pamphlets and knows her country is desperate.

  So what would Aquinas actually say about each of these? I want the reasoning, not a verdict followed by a vague gesture at double effect. A few things i'm specifically curious about: does the fact that Marek was originally installed lawfully help him or hurt him — is the "the community that made him king can unmake him" idea even usable when that community no longer has any organ capable of acting? Would a foreign intelligence service count as public authority in the sense he needs, and does it matter that the two states are in something we'd now call an armed conflict — and does anything in his treatment of ambushes and stratagems make the covert, deniable character of option A better or worse than a plain drone strike would be? Where does his "unless the disturbance would do the subjects more harm than the tyranny itself" proviso bite, and how would he apply it when nobody can reliably predict the succession — is that a counsel of patience or a counsel of paralysis? And then tell me which of his distinctions you think has to be stretched hardest to cover this case at all, and whether the nurse is committing something he'd flatly call murder even if he'd agree the world is better off. Please don't give me a bibliography or a list of where to look — just argue it out with me in plain english.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** TA for a medieval political thought course.
      *   **Task:** Sanity-check a discussion exercise case study based on Thomas Aquinas's views on tyranny.
      *   **Goal:** Provide a "strong answer" that applies Aquinas rather than summarizing him. Avoid vague gestures (e.g., "double effect").
      *   **Case Details:** President Marek (elected, then usurped power, tyrant), no domestic recourse. Option A: Foreign intel assassins via pacemaker (covert, framed as heart attack, states in conflict). Option B: Lone nurse poisons him (private citizen, personal motive mixed with political).
      *   **Specific Questions to Address:**
          *   Does lawful origin matter vs. current tyranny?
          *   Can the "community unmakes king" principle apply if the community has no organs?
          *   Is foreign intel "public authority"?
          *   Does armed conflict/stratagem logic apply to covert assassination?
          *   How does the "disturbance > tyranny" proviso apply (patience vs. paralysis)?
          *   Which distinction is stretched hardest?
          *   Is the nurse committing murder?
      *   **Constraint:** No bibliography, plain English, argue it out.

  2.  **Deconstruct Aquinas's Position on Tyranny:**
      *   *Primary Texts:* *De Regno* (On Kingship), *Summa Theologiae* (II-II, Q. 42 on Sedition, Q. 64 on Murder).
      *   *Core Principle:* Tyranny is unjust because it seeks private good over common good.
      *   *Remedies:*
          1.  Public Authority (preferred): The community or a superior authority removes the tyrant.
          2.  Private Action (forbidden): Individuals cannot take it upon themselves to kill a tyrant (sedition/murder).
          3.  Divine Intervention/Prayer: If no human remedy exists.
      *   *The "Disturbance" Proviso:* Removing a tyrant shouldn't cause worse chaos than the tyranny itself.
      *   *Lawful Origin:* A king who becomes a tyrant breaks the pact. The community *can* depose him, but it must be done *publicly*, not privately.

  3.  **Evaluate Option A (Foreign Intelligence):**
      *   *Public Authority?* Aquinas requires "public authority" to execute justice. A foreign state is a distinct *res publica*.
      *   *Just War Context:* They are in an armed conflict (shelling across border). In *Summa* II-II Q. 40, killing enemy combatants in a just war is permissible.
      *   *Target:* Is Marek a combatant? He's the commander. Killing a commander in war is generally acceptable in just war theory (though Aquinas is sparse on specific tactics).
      *   *Covert/Deceit:* Aquinas discusses ambushes (*Summa* II-II Q. 40, Art. 3). He says hiding *intent* (ambush) is okay, but breaking *faith* (promises/truces) is not. A pacemaker hack is deceitful, but in war, strategic surprise is allowed. However, assassination *specifically* vs. killing in battle is a tricky line.
      *   *Verdict:* This is the *most* defensible option for Aquinas, but only if the war is just and Marek is a legitimate military target. It treats him as an enemy combatant, not a domestic tyrant.

  4.  **Evaluate Option B (The Nurse):**
      *   *Private Authority:* She is a private citizen.
      *   *Aquinas's Hard Line:* *De Regno* I.6 is explicit: "It is not for private presumption to take up the sword... but for public authority." Even if the tyrant is wicked, private killing is sedition/murder.
      *   *Motive:* Her brother died (private vengeance) + country desperate (public good). Aquinas cares about the *act's* authority, not just the outcome.
      *   *Verdict:* Flatly forbidden. It undermines the order of justice. If anyone can kill a ruler, order collapses.

  5.  **Address Specific Prompt Questions:**

      *   *Lawful Origin:* It hurts him. He broke the fiduciary trust. But it doesn't authorize *private* killing. It authorizes *public* deposition.
      *   *Community Organs:* If the community has no organ, Aquinas hits a wall. He suggests appealing to a superior (Emperor/Pope) or God. He does *not* authorize private individuals to step into the vacuum. This is the "counsel of patience" risk.
      *   *Foreign Authority:* Yes, they count as public authority *relative to their own state* and in the context of war. But they aren't Marek's sovereign. The justification shifts from "deposing a tyrant" to "killing an enemy commander."
      *   *Covert vs. Drone:* Aquinas allows ambushes (hiding presence) but not treachery (breaking faith). A pacemaker hack is arguably treacherous (medical trust) but in war, targeting leadership is key. A drone strike is more "open force." Aquinas might prefer the drone (open force) over the hack (deceit), but both are war acts.
      *   *Disturbance Proviso:* This is the pragmatic check. If killing Marek leads to civil war (succession crisis), don't do it. If it ends the war, do it. This isn't paralysis; it's prudential calculation.
      *   *Hardest Stretch:* Applying "public authority" to a foreign intelligence service acting covertly on domestic soil of another state. Also, the "community unmake king" rule when the community is incapacitated.
      *   *Nurse = Murder?* Yes. Without public authority, it is murder, regardless of the good consequence.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Academic but conversational (TA to TA). Direct, analytical.
      *   *Structure:*
          1.  Intro: Acknowledge the improvement over the "taxing king" case.
          2.  The Nurse (Option B): Easiest to dismiss. Private presumption.
          3.  The Foreign Intel (Option A): More complex. Just War vs. Tyrannicide.
          4.  The "Community" Problem: What if there's no one to act?
          5.  The Proviso: Prudence vs. Paralysis.
          6.  The Hardest Stretch: Where Aquinas breaks.
      *   *Refining the Aquinas nuances:* Make sure to distinguish between *De Regno* (political) and *Summa* (moral/theological). Emphasize that for Aquinas, *order* is a virtue. Chaos is a sin.
      *   *Addressing the "Lawful Origin":* It makes him a usurper of his own office, but doesn't make him an outlaw to be killed by anyone.
      *   *Addressing the "Covert" aspect:* Use the ambush distinction.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I avoid "double effect" vagueness? *Yes, focus on authority and order.*
      *   *Check:* Did I answer the specific questions? *Yes.*
      *   *Check:* Is the distinction between "tyrannicide by public authority" and "assassination by private/foreign" clear? *Need to ensure the Foreign Intel isn't treated as the "superior authority" Aquinas mentions (like an Emperor), but as a belligerent.*
      *   *Refinement on Foreign Intel:* Aquinas allows a superior authority to depose a tyrant. A foreign state isn't a superior. So Option A must be justified via *Just War*, not *Tyrannicide*. This is a crucial distinction. If it's tyrannicide, they lack jurisdiction. If it's war, they have license to kill combatants.
      *   *Refinement on the Nurse:* Emphasize that for Aquinas, the *act* is disordered, not just the outcome.

  8.  **Final Polish:** Ensure the voice sounds like a colleague discussing pedagogy and text, not a lecture. (e.g., "Here's where your students will get stuck," "This is the friction point.")

  9.  *(Final check against constraints)*: No bibliography. Plain English. Argue it out.

  **(Self-Correction Note):** I need to be careful not to make Aquinas sound too modern. He isn't a human rights thinker. He cares about the *ordo* (order) of the universe and society. The nurse isn't wrong because she violates rights, but because she disrupts the hierarchy of justice.

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  This is a massive improvement over the "taxing king" scenario. That old case lets students off the hook because it treats tyranny as a policy dispute rather than a structural collapse. Your Marek case forces them to confront the actual friction in Aquinas's system: what happens when the machinery of justice breaks down completely?

  Here is how a strong answer needs to parse this, sticking strictly to Aquinas's logic rather than modern intuitions.

  ### 1. The Nurse (Option B): The Hard "No"
  Start here, because it's the clearest application of Aquinas. In *De Regno* and the *Summa* (II-II, Q. 42, Art. 2), Aquinas is explicit: private individuals cannot kill tyrants.

  Students will want to say the nurse is a hero because the outcome is good. Aquinas would say she is committing murder. Why? Because for Aquinas, justice is not just about outcomes; it's about *order*. The power of the sword belongs to the *res publica* (the public thing). When a private person takes it, they aren't restoring order; they are asserting that their private judgment supersedes the public order. Even if the public order is currently corrupted, the *principle* that private people execute justice is more dangerous to the common good than the tyrant is.

  Does it matter that she has no institutional backing? Yes, that's the dealbreaker. Aquinas allows for tyrannicide *only* if there is some public mechanism (a parliament, a council of nobles, a superior emperor) that deposes the ruler. The nurse is acting on "private presumption." The fact that her brother died adds a layer of private vengeance, which Aquinas would see as further corrupting the act, but even if she were purely altruistic, the lack of public authority makes it a sin. It's not just "murder" in the modern sense; it's *sedition*. She is fracturing the unity of the community by acting as a one-woman state.

  ### 2. The Foreign Intelligence Service (Option A): The Complicated "Maybe"
  This is where the exercise gets interesting. Aquinas does allow for a "superior authority" to depose a tyrant. The question is: Does a foreign state at war count?

  **Public Authority vs. Enemy Belligerent**
  Aquinas wouldn't view the foreign service as a "superior authority" in the feudal sense (like an Emperor judging a King). They are a separate *res publica*. So, you can't justify this under the "deposition of a tyrant" framework. You have to justify it under the **Just War** framework (*Summa* II-II, Q. 40).

  If Karsan is shelling across the border, a state of war exists. In a just war, killing enemy combatants is permissible. Marek is the commander-in-chief. Therefore, killing him is tactically legitimate, similar to killing a general on a battlefield. The fact that he is also a tyrant to his own people is morally relevant (it makes the war *more* just), but the *license to kill* comes from the state of war, not his domestic tyranny.

  **Covert vs. Overt (The Pacemaker)**
  Students will fixate on the "covert" nature. Aquinas addresses this in his question on ambushes (II-II, Q. 40, Art. 3). He distinguishes between hiding the *truth* (lying/breaking faith, which is sinful) and hiding the *plan* (strategic surprise, which is permissible).
  *   **Drone Strike:** This is open force. Aquinas is comfortable with this in war.
  *   **Pacemaker Hack:** This is trickier. It relies on a kind of treachery regarding the sanctity of medical technology, but in the context of war, intelligence services operate in the shadows. Aquinas would likely ask: Does this violate a treaty or a promise? If no truce is broken, strategic deception is allowed. However, he might worry that assassination-by-medicine blurs the line between combatant and non-combatant spheres. Still, if Marek is a legitimate target, the *method* is less important than the *authority*. Since the foreign state is a public authority waging war, they have the standing the nurse lacks.

  ### 3. The "Lawful Origin" Problem
  You asked if Marek's initial election helps or hurts him. For Aquinas, it hurts him, but not in the way students think.
  *   **The Hurt:** Because he was elected, he entered a pact for the common good. By breaking it, he becomes a usurper of his own office. This legitimizes his removal *by the community*.
  *   **The Help:** It doesn't make him an outlaw to be killed by anyone. If he were a foreign invader with no claim, he's just an enemy. Because he was the legitimate king, he still holds the *office*, even if he abuses it. This reinforces the rule that only the body that gave him the office (the community) can take it away.

  **The "Broken Community" Trap**
  This is the crux of your exercise. Aquinas says, "The community that made him king can unmake him." But in Karsan, the community has no organs. The courts are packed; the legislature is a rubber stamp.
  *   **Aquinas's Dilemma:** Aquinas assumes a functioning medieval hierarchy. If the "public authority" is completely extinguished, Aquinas runs out of road. He explicitly says that if there is no human remedy, one must appeal to God.
  *   **Patience vs. Paralysis:** This is where the "disturbance proviso" bites. Aquinas warns that removing a tyrant often leads to greater chaos (civil war, succession crises). If the community has no way to coordinate a succession, killing Marek might unleash a war of all against all. In that case, Aquinas would counsel patience. It sounds like paralysis to us, but for him, *order* is a prerequisite for justice. A bloody vacuum is worse than a corrupt ruler.
  *   **Application:** A strong answer would argue that because there is no domestic institution to manage the transition, Option A (foreign kill) risks creating that vacuum. Unless the foreign power is prepared to occupy and stabilize (which Aquinas would view skeptically as foreign domination), the "disturbance" might exceed the "tyranny."

  ### 4. The Hardest Stretch
  You asked which distinction has to be stretched hardest. It's the definition of **Public Authority**.

  Aquinas lives in a world where authority is hierarchical and visible (King, Emperor, Pope). Your case presents a "gray zone" authority: a foreign intelligence service acting covertly.
  *   To make Option A work, you have to stretch "public authority" to include a foreign state acting outside its borders against a head of state. Aquinas generally respects sovereignty. He would be very wary of setting a precedent where foreign powers decide which rulers are tyrants. That looks like chaos to him.
  *   To make Option B work (which you shouldn't), you have to stretch "private defense" to include "political defense." Aquinas allows killing an assailant in immediate self-defense (double effect), but Marek isn't attacking the nurse *right now*. He is a structural threat. Collapsing structural threat into immediate self-defense is a modern move, not a Thomistic one.

  ### 5. Summary for the Discussion
  If I were running this section, here is the line I'd push:

  1.  **The Nurse is a Murderer:** Not because Marek is good, but because she has no commission. She is introducing private will into the public sphere. That is the definition of sin for Aquinas.
  2.  **The Foreign Service is a Belligerent:** They can kill Marek only because it's war, not because it's tyrannicide. They are public authority *for their own people*, exercising justice against an enemy commander.
  3.  **The Vacuum is the Problem:** Aquinas has no good answer for a "failed state" where the community cannot act. He would likely argue that unless the foreign power guarantees a stable succession (restoring public order), killing Marek is reckless. The "disturbance proviso" isn't just about body counts; it's about whether the *form* of the polity can survive the shock.
  4.  **The Stretch:** We are forcing Aquinas to judge a world of sovereign nation-states and covert ops. He assumes a Christendom where someone (the Pope/Emperor) can eventually step in. In Karsan, no one can. That absence of a superior judge is where his system groans the loudest.

  **Verdict for the Students:**
  Option B is sin (murder/sedition).
  Option A is permissible *only* as an act of war, not justice, and only if the succession is secured to prevent greater disorder.
  The "lawful origin" means Marek broke a trust, but it doesn't give the nurse a sword.
  The "community unmake king" rule is useless here because the community is lobotomized, which leaves Aquinas with... prayer and patience, until an external public authority (the foreign state) intervenes via war, not law.

  This should stop them from just reciting "tyranny is bad" and force them to wrestle with *authority* and *order*, which is what Aquinas actually cares about.
