answer: |-
  Your draft is provocative and clearly articulated, which is precisely what a workshop paper requires. You have identified a genuine tension in the literature between the formal requirements of decision theory and the phenomenology of diachronic agency. However, the argument hinges on whether your 'wide' category possesses normative independence from the standard model. Below I address your six priorities, keyed to the relevant paragraphs.

  **1. The Redescription Worry (Paragraph 4)**
  You asked for bluntness: yes, the concession in paragraph 4 risks giving the game away. You write that 'the reason to persist is prospective, concerning the value of being trustworthy'. If the reason is prospective, it is, by definition, a future consequence. The standard model does not forbid counting future consequences; it forbids counting *past* costs as *intrinsic* value. If your 'wide' reason is that persisting now secures future collaborative opportunities (because you are seen as trustworthy), this is a standard consequentialist calculation. The sunk cost is merely the *condition* that makes trustworthiness relevant, not the *source* of the value.

  To save the distinction, you must argue that the normative force comes from the *relation* to the past itself, not merely the future benefits of maintaining that relation. If you claim that breaking faith with one's past self is intrinsically wrong, regardless of future reputational damage, you are making a deontological claim. But paragraph 4 leans heavily on the prospective utility of reliability. Unless you clarify that the 'standing within the project' has non-instrumental value, the standard model can absorb your 'wide' reasons simply by expanding the decision tree to include 'maintaining integrity' as a future good. The distinction currently looks like a distinction in the *source* of the prospective value, not a distinction in *normative kind*.

  **2. The Status of Act Description (Paragraph 3)**
  Your argument here is substantive but vulnerable to the charge of triviality. It is a general truth of decision theory that problems are description-sensitive; proving this for sunk costs specifically requires showing why the coarse description is *irrational*, not merely less detailed. You claim the coarse description is 'not neutral', but you do not provide a criterion for when a finer grain is mandated.

  If every historical detail becomes part of the act description, decision theory paralyses; if none do, it oversimplifies. You need a principle for admissibility. For instance, one might argue that act descriptions must be 'agentially transparent'—the agent must be able to recognise the act under that description. Since an agent knows they have invested four years, 'abandon' simpliciter is not transparent. However, you must guard against begging the question. The proponent of the standard view will argue that rationality requires stripping away exactly those historical details that do not affect future causal powers. You need to argue why the history of the act changes its causal powers (perhaps via self-conception) rather than just its label.

  **3. The Test in Paragraph 6**
  There is a significant tension between your argument in paragraph 4 and your test in paragraph 6. In paragraph 4, you justify persistence via 'trustworthiness' and collaborators' reliance. In paragraph 6(ii), you ask the agent to suppose the investment is 'wholly unobservable'. If nobody can tell whether you honoured the cost, then reputational trustworthiness is off the table. If the agent still persists under (ii), it cannot be for the reason given in paragraph 4.

  Consequently, condition (ii) seems to eliminate the very 'wide' reasons you defended earlier. If a reason survives (ii), it must be about internal integrity rather than external reliability. This suggests (i) and (ii) do distinct work: (i) tests for special pleading (why me?), while (ii) tests for reputational signalling. However, an opponent will argue that any reason surviving (ii) is simply a preference for consistency, which the standard model treats as a brute preference, not a rational requirement. The test risks encoding a verdict by defining 'wide reasons' as those that survive a scenario where standard prospective reasons (reputation) have been stipulated away.

  **4. On the Reversal Question (Paragraph 7)**
  This paragraph earns its place; it is the most philosophically rich section. The insight that 'would you enter this now?' misfires for constitutive projects is correct, but it requires development to function as an argument rather than an assertion. Currently, it reads as a rhetorical flourish. To make it substantive, you must explain *why* the question misfires.

  Is it because diachronic rationality differs from synchronic rationality? Or because projects create normative obligations that entry conditions do not? You should explicitly link this to the literature on planning agency (without citing it). The argument should be that for temporally extended projects, the rational question is not 'is this the best start?' but 'given that I am here, what does continuing constitute?' If you can ground this in the nature of intentional action over time, rather than just intuition, it becomes a powerful objection to the reversal test.

  **5. Overstatement and Intuitions**
  You overclaim in paragraph 1 and 8. In paragraph 1, you suggest the standard view's universality is an 'artefact of how the cases are written down'. This implies the standard view is methodologically flawed. It is safer to say it is *incomplete* regarding diachronic agency. In paragraph 8, the claim that the confidence in the first proposition has been 'borrowed, without warrant' is strong; ensure you have demonstrated that warrant is lacking, not just that it hasn't been provided.

  Regarding intuitions: paragraph 4 relies on the intuition that collaborators cannot rely on an agent who discounts past commitments. A sceptic might argue collaborators rely on an agent who cuts losses efficiently. You need to acknowledge that the value of 'stickability' is context-dependent. In some ventures, flexibility is more valuable than fidelity. Your argument works best for 'commitment goods' (marriage, vocations) but less clearly for commercial ventures.

  **6. Terminology**
  'Narrow' and 'Wide' are serviceable but carry baggage from the debate on narrow/wide scope rationality, which may cause confusion. 'Calculative' versus 'Constitutive' might better capture the distinction you are drawing. The former treats costs as inputs to a calculation; the latter treats them as constituting the identity of the act. Similarly, 'Counterfactual Transparency Test' is slightly clunky. 'The Unobservable Investment Test' or 'The Veil of Ignorance Test' (though the latter has Rawlsian connotations) might be clearer. 'Transparency' usually refers to self-knowledge, whereas your condition (ii) is about external observability.

  **Verdict**
  The partition asserted in paragraph 8 is defensible, but only if you shift the ground from consequentialist justification to the norms of diachronic agency. Currently, paragraph 4 attempts to justify wide reasons using prospective values, which allows the standard model to absorb them. If you argue instead that the past commitment itself constrains rational choice independently of future yield, the partition holds, but the cost is accepting a non-consequentialist element in practical rationality.
