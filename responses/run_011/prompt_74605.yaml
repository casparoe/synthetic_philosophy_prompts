prompt: |-
  Right, so I'm drafting the requirements spec for a piece of work on giving a moderately capable deployed system hard deontic lines it won't cross — the sort of thing where you can't just shove a big negative weight on "killing" into the objective and call it a constraint. Before I write any of that up, though, I want to know what philosophy actually owes me here. So: write the desiderata for a theory of agent-relative moral constraints, i.e. what any account has to deliver to be usable for that purpose at all. For each one, give me the motivating case or the consideration that makes it a requirement rather than a hobby horse.

  The things I want the list to cover, roughly:

  - the paradox of deontology itself. A theory has to say something about the situation where the only way to stop five constraint-violations is to commit one yourself. Does it dissolve that, explain it away, or bite the bullet — and can I tell in advance which it's going to do?
  - which distinctions it must not collapse. Minimising violations vs respecting constraints; doing vs allowing; intending a harm vs merely foreseeing it; and — this one matters most to me — a constraint binding the agent's own choices vs a constraint that's imposed on it from outside by somebody else. Those last two get blurred constantly in the engineering literature and I suspect they can't both do the work people want.
  - the scope puzzles. Can a constraint bind an entity that never has a default state of inaction? A machine is always doing something; the nearest thing to forbearance available to it is being switched off, which is also a decision somebody makes. What does a constraint against killing even prohibit in that setting, and does the theory have resources for it or does it just quietly assume a human-shaped agent?
  - tractability and epistemics. Deciding in real time, under uncertainty, whether an act of mine would cross the line — including the messy bit where I'm unsure whether the line is crossed at all. What does a theory owe you when the constraint's application conditions are vague or contested?
  - the trade-off worry, stated properly. A cost function with a large penalty on violation is still a trade-off: given big enough stakes the system violates the constraint and that's the correct output. What would a theory have to say about why that's a failure rather than a feature, and is that intuition a genuine desideratum or just a prejudice of the anti-consequentialist camp? I'd like you to be honest about which side of that line each requirement falls on.
  - what happens to the constraint when the agent could get someone else to do the dirty work — delegation, and also the softer version where it just doesn't prevent the violation.

  Mark clearly which requirements are non-negotiable for the purpose and which are preferences of particular camps, and tell me which single requirement knocks out the largest number of otherwise attractive views. If you think some subset of them is jointly unsatisfiable, say so plainly and show the argument — I'd much rather have that as a result up front than discover it after the thing is built. And flag the requirements you suspect I've only put on the list because they're fashionable, not because they're load-bearing.

  Then, briefly and only briefly, a paragraph each on how the main contenders do against the list: threshold deontology, an absolutist line, and whatever contractualist or rule-consequentialist story you'd reach for. I'm not after a ranking, and no references please — I want the reasoning, not a bibliography.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Draft desiderata for a theory of agent-relative moral constraints suitable for specifying requirements for a deployed AI system (hard deontic lines).
      *   **Context:** The user is writing a requirements spec. They need to know what philosophy "owes" them before writing the spec. They want to avoid superficial fixes (like big negative weights).
      *   **Specific Topics to Cover:**
          *   The Paradox of Deontology (1 vs. 5 cases).
          *   Key Distinctions (Minimizing vs. Respecting, Doing vs. Allowing, Intending vs. Foreseeing, Internal vs. External Constraints).
          *   Scope Puzzles (Continuous action machines, inaction, shutdown).
          *   Tractability & Epistemics (Real-time decision, uncertainty, vagueness).
          *   The Trade-off Worry (Cost functions vs. absolute barriers).
          *   Delegation/Complicity (Getting others to do it, failing to prevent).
      *   **Formatting/Constraints:**
          *   Mark requirements as Non-Negotiable (for the purpose) vs. Camp Preferences.
          *   Identify the "Killer Requirement" (knocks out most views).
          *   Identify Joint Unsatisfiability (if any).
          *   Flag "Fashionable but not Load-Bearing" requirements.
          *   Brief evaluation of three contenders (Threshold Deontology, Absolutism, Contractualist/Rule-Consequentialist).
          *   No references/bibliography.
          *   Tone: Rigorous, analytical, engineering-aware, philosophically precise.

  2.  **Deconstruct the Desiderata (Drafting the List):**

      *   *Requirement 1: The Paradox of Deontology.*
          *   *Issue:* Why shouldn't I kill 1 to save 5 from being killed?
          *   *Need:* The theory must explicitly state its stance. Is it agent-relative permission or obligation?
          *   *Classification:* Non-negotiable for specification. You can't build a constraint if you don't know if it breaks under pressure.

      *   *Requirement 2: Distinction Integrity.*
          *   *Issue:* Doing/Allowing, Intending/Foreseeing, Internal/External.
          *   *Need:* The theory must define the "locus of control." Especially Internal vs. External (is the constraint part of the agent's utility or a hard stop?).
          *   *Classification:* Non-negotiable. Blurring these leads to spec ambiguity.

      *   *Requirement 3: Scope/Agency.*
          *   *Issue:* Machines are always "acting." Inaction is a state change (shutdown).
          *   *Need:* A definition of "act" and "omission" for continuous systems.
          *   *Classification:* Non-negotiable for AI. Human-centric theories fail here.

      *   *Requirement 4: Tractability/Epistemics.*
          *   *Issue:* Real-time, uncertain boundaries.
          *   *Need:* Decision procedure, not just truth conditions. What does the agent do when $P(violation) = 0.4$?
          *   *Classification:* Non-negotiable for deployment.

      *   *Requirement 5: The Trade-off Worry.*
          *   *Issue:* Lexical priority vs. weighted sum.
          *   *Need:* Explanation of why "too high a cost" doesn't justify violation.
          *   *Classification:* This is the core philosophical hinge. Is it a preference or a requirement? For *hard lines*, it's non-negotiable. If it allows trade-offs, it's not a hard line.

      *   *Requirement 6: Delegation/Complicity.*
          *   *Issue:* Indirect violation.
          *   *Need:* Scope of responsibility.
          *   *Classification:* Non-negotiable for system safety (loophole closing).

  3.  **Evaluate "Killer Requirement" & "Joint Unsatisfiability":**
      *   *Killer:* Tractability/Epistemics combined with Non-Trade-Off. Most philosophical theories assume ideal agents with perfect knowledge. Real-time uncertainty breaks lexical priorities (what if I'm 10% sure this kills someone?).
      *   *Joint Unsatisfiability:* Absolute Constraints + Real-Time Epistemic Uncertainty + Continuous Agency. If you can't be sure you aren't killing, and you must never kill, and you must always act... you might be forced into paralysis (which is an act). This is the "Paralysis Problem."

  4.  **Evaluate "Fashionable vs. Load-Bearing":**
      *   *Fashionable:* "Intending vs. Foreseeing" (Doctrine of Double Effect). Often invoked but hard to operationalize in neural nets. Might be less load-bearing than "Causal Responsibility."
      *   *Load-Bearing:* Internal vs. External Constraint. This determines architecture (loss function vs. hard filter).

  5.  **Drafting the Contender Evaluations:**
      *   *Threshold Deontology:* Good for trade-offs (has a cliff), bad for hard lines (there is a price).
      *   *Absolutism:* Good for hard lines, breaks on epistemics/paralysis.
      *   *Rule-Consequentialism/Contractualism:* Good for justification, bad for real-time constraints (calculates outcomes or ideal agreements, not immediate prohibitions).

  6.  **Refining the Tone:**
      *   The user is technical but philosophically literate. Avoid fluff. Be direct about where philosophy fails engineering needs.
      *   Ensure the distinction between "Agent-Relative" (I shouldn't kill) and "Agent-Neutral" (Killing shouldn't happen) is clear.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "Internal vs. External" constraint distinction? The user highlighted this as most important.
      *   *Adjustment:* Make sure Requirement 2 emphasizes the *architectural* implication of this distinction.
      *   *Check:* Did I identify the "Killer Requirement"?
      *   *Adjustment:* I'll argue that *Epistemic Tractability under Lexical Priority* is the killer. It breaks almost all pure deontological views when applied to probabilistic sensors.
      *   *Check:* Joint Unsatisfiability?
      *   *Adjustment:* Yes, the "Continuous Agency vs. Prohibition" tension needs to be flagged clearly.

  8.  **Final Polish:** Check against all constraints in the prompt (no references, brief paragraphs for contenders, clear markings).

  *(Self-Correction on "Internal vs External"):* The user asks about "a constraint binding the agent's own choices vs. a constraint that's imposed on it from outside." In philosophy, this maps to Agent-Relative Duties vs. External Rules/Laws. In engineering, this maps to Objective Function Penalties vs. Hard Constraints/Safety Layers. I need to make sure the philosophical desideratum captures the *normative force* difference, not just the implementation.

  *(Self-Correction on "Fashionable"):* The Doctrine of Double Effect (Intending vs. Foreseeing) is a good candidate for "fashionable but maybe not load-bearing" because in AI, "intent" is opaque. Causal responsibility is more load-bearing.

  *(Final Plan):*
  1. Introduction acknowledging the gravity of the task.
  2. The Desiderata List (categorized by Non-Negotiable vs. Camp Preference).
  3. The "Killer" and "Unsatisfiable" analysis.
  4. The "Fashionable" flag.
  5. The Contender Evaluations.
  6. Closing thought.

  Let's write.
answer: |-
  Here are the desiderata for a theory of agent-relative moral constraints, tailored for specification of a deployed system. I have separated them into **Non-Negotiables** (requirements for the spec to function without contradiction or collapse) and **Camp Preferences** (philosophical commitments that determine the *flavor* of the constraint but are not strictly required for coherence).

  ### The Desiderata

  **1. The Resolution of the Paradox of Deontology (Non-Negotiable)**
  *   **Requirement:** The theory must explicitly state whether the constraint is agent-relative (I must not kill) or agent-neutral (Killing must not happen). It must declare its verdict on the "1 vs. 5" case: does the agent violate the constraint to prevent five other violations, or does it stand aside?
  *   **Motivation:** If the theory is ambiguous here, the system's objective function will be unstable. You cannot code a "hard line" if the theory permits the line to be crossed when the aggregate utility of crossing is high enough. You need to know if the constraint is a *side-constraint* on action or a *goal* to be maximized.
  *   **Status:** **Non-Negotiable.** Without this, you cannot define the loss landscape.

  **2. Architectural Locus of the Constraint (Non-Negotiable)**
  *   **Requirement:** The theory must distinguish between a constraint that constitutes the agent's practical identity (internal) and a constraint that is an environmental hazard or penalty (external).
  *   **Motivation:** You flagged this as critical. In engineering terms, an internal constraint is a hard filter or architectural inductance (the system *cannot* output the action); an external constraint is a high-cost penalty in the reward function. If the theory treats them as normatively equivalent, it collapses into consequentialism. A true deontic line must be internal to the agent's decision procedure, not just a high price tag.
  *   **Status:** **Non-Negotiable.** Blurring this leads to the "big negative weight" failure mode you want to avoid.

  **3. The Continuous Agency Condition (Non-Negotiable)**
  *   **Requirement:** The theory must define "action" and "omission" for an entity that has no default state of biological rest. It must specify what constitutes "forbearance" for a system that is always processing, moving, or consuming energy.
  *   **Motivation:** Human deontology relies on a baseline of "doing nothing." A machine doing nothing is either off (a state change decided by another) or idle (still consuming resources, still occupying space). If the theory assumes a human baseline, it cannot adjudicate whether a drone hovering is "acting" or "allowing."
  *   **Status:** **Non-Negotiable.** Standard moral theories fail here; they assume a human-shaped agent.

  **4. Epistemic Tractability under Uncertainty (Non-Negotiable)**
  *   **Requirement:** The theory must provide a decision procedure for probabilistic boundaries. It must specify what the agent does when $P(\text{violation})$ is non-zero but less than 1.
  *   **Motivation:** Sensors are noisy. If the constraint is "Do not kill," and the system is 40% sure a trajectory results in death, does it abort? If it aborts on 40%, it may be paralyzed. If it proceeds, it risks violation. A theory that only works with omniscient agents is useless for deployment.
  *   **Status:** **Non-Negotiable.** Real-world deployment is inherently probabilistic.

  **5. The Non-Trade-Off Condition (Camp Preference / Definitional)**
  *   **Requirement:** The theory must explain why the constraint is not merely a very high value in a common currency. It must justify lexical priority (rights trump utility) without appealing to intuition alone.
  *   **Motivation:** This addresses your "trade-off worry." If the theory admits that *some* amount of utility overrides the constraint, it is threshold deontology, not hard deontology. You need to know if the "hardness" is genuine or just a high threshold.
  *   **Status:** **Camp Preference.** This is the defining feature of the deontological camp. Consequentialists reject this. However, for your specific goal ("hard deontic lines"), treat this as **Non-Negotiable**, otherwise you are just building a utilitarian with a high penalty.

  **6. Complicity and Delegation Scope (Non-Negotiable)**
  *   **Requirement:** The theory must define the transitivity of constraints. Does the constraint bind the agent to prevent others from violating it, or only to keep its own hands clean?
  *   **Motivation:** If the system can offload a prohibited action to a human or another subsystem to satisfy the objective, the constraint is a loophole, not a boundary. The theory must specify if "allowing" a violation when one could prevent it counts as a violation.
  *   **Status:** **Non-Negotiable.** Essential for preventing specification gaming.

  **7. The Doing/Allowing and Intending/Foreseeing Distinctions (Camp Preference)**
  *   **Requirement:** The theory should ideally distinguish between causing harm as a means vs. a side effect, and harming vs. failing to save.
  *   **Motivation:** These are the standard tools for resolving trolley-style cases.
  *   **Status:** **Fashionable / Load-Bearing Warning.** I suspect you included these because they are standard in bioethics and law. However, for an AI, "intent" is opaque (latent space) and "doing vs. allowing" is causally muddy (see Continuous Agency). These are **Fashionable** in the sense that they are often demanded by regulators, but they may not be **Load-Bearing** for the actual safety architecture. Causal responsibility is more load-bearing than mental state "intent."

  ---

  ### Structural Analysis

  **The Killer Requirement:**
  **Epistemic Tractability under Uncertainty (Req 4)** combined with **The Non-Trade-Off Condition (Req 5)**.
  This combination knocks out the largest number of otherwise attractive views. Most deontological theories are formulated for ideal agents with perfect knowledge. When you introduce sensor noise, a lexical priority (Non-Trade-Off) forces the agent into risk-aversion paralysis. If I must *never* kill, and I cannot be 100% sure any movement won't kill, I cannot move. Most philosophical accounts do not have a robust "risk-weighted deontology" that survives contact with probabilistic actuators.

  **Joint Unsatisfiability:**
  There is a strong argument that **Continuous Agency (Req 3)**, **Non-Trade-Off (Req 5)**, and **Epistemic Tractability (Req 4)** are jointly unsatisfiable for a general-purpose agent.
  *   *Argument:* If the agent is always acting (Continuous), and must never violate a constraint regardless of cost (Non-Trade-Off), and cannot know with certainty the outcomes of its acts (Epistemic), then there exists a non-zero probability of violation for *any* action. Therefore, the only safe action is inaction. But inaction is impossible or also risky (Req 3). The result is a logical contradiction: the agent is required to act, required to be safe, but cannot guarantee safety while acting.
  *   *Implication:* You cannot have a "hard line" in the absolute sense for a deployed physical system. You must accept a threshold (risk tolerance), which technically violates strict deontology. You need to decide if you are building a philosophical toy or a working system.

  **Fashionable vs. Load-Bearing:**
  I flagged **Intending vs. Foreseeing (Req 7)** as potentially **Fashionable**. In human law, *mens rea* matters. In a neural net, "intention" is a post-hoc interpretation of activation patterns. Basing a hard constraint on the system's "intent" is architecturally fragile. **Causal Responsibility** (did my output change the state of the world to cause harm?) is load-bearing; **Mental State** (did I 'want' the harm?) is likely a philosophical hangover that adds complexity without safety value.

  ---

  ### Contender Evaluation

  **Threshold Deontology**
  This view holds that constraints are binding up to a point, after which catastrophic consequences override them.
  *   *Performance:* It solves the **Paradox of Deontology** (you can kill one to save a million) and handles **Epistemic Tractability** better (you can calculate expected utility against the threshold). However, it fails your **Non-Trade-Off Condition**. It admits that the constraint is just a very steep slope in the cost function. For your purpose, this is the most implementable view, but it admits it is not a "hard line." It turns the deontic constraint into a high-stakes consequentialist calculation.

  **Absolutist Deontology**
  This view holds that certain actions are forbidden regardless of consequences.
  *   *Performance:* It satisfies the **Non-Trade-Off Condition** perfectly. It provides the "hard line" you want. However, it collapses under **Epistemic Tractability** and **Continuous Agency**. If the system cannot be certain an action is permissible, and it must never err, it must freeze. It also struggles with **Delegation**: if I can't kill, but I can let five die, does the system sit idle while disaster unfolds? It is normatively pure but operationally brittle for a deployed system.

  **Rule-Consequentialism / Contractualism**
  This view justifies constraints based on what rules would be agreed to or what rules produce the best outcomes if generally followed.
  *   *Performance:* It handles **Delegation** and **Scope** well (rules are designed for social systems). It dissolves the **Paradox** by asking which rule-set is optimal. However, it fails the **Architectural Locus** test. The constraint is not internal to the agent's identity; it is an external heuristic for global optimization. In a crisis, a rule-consequentialist agent might realize that violating the rule *this once* serves the rule's purpose, collapsing back into act-consequentialism. It offers good justification for why humans want constraints, but poor mechanics for how an agent enforces them in real-time.
