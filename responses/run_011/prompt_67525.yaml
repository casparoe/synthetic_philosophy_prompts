answer: |-
  1. **You argue history turns on small changes, but what physically counts as a "perturbation" in your model—is it a lost letter, a sudden death, or a policy shift?**
     *Note: Force him to define the unit of historical change that qualifies as a "perturbation."*

  2. **You lean on the weather analogy, but weather obeys physics while history obeys human choice; why is this analogy technically licensed rather than just poetic?**
     *Note: Extract the mechanistic similarity that justifies borrowing chaos theory from meteorology.*

  3. **Historians often argue things like industrialization were inevitable regardless of leaders; if history is chaotic, how do you account for these large-scale structural inevitabilities?**
     *Note: Press him on whether "chaos" allows for structural determinism or kills it entirely.*

  4. **When you say we can't predict outcomes, is that because our data is incomplete, or because the future literally doesn't exist yet to be predicted?**
     *Note: Distinguish between "we can't predict" and "it cannot be predicted."*
     *   **Follow-up:** "If it's just missing data, then chaos is a temporary limitation, not a theorem about history itself. Which is it?"

  5. **You say the burden of proof is on stability, but what specific historical evidence would convince you that a system *wasn't* chaotic?**
     *Note: Force a concrete falsification condition, not just shifting the burden.*
     *   **Follow-up:** "If no outcome can prove you wrong, aren't you describing a belief system rather than a historical method?"

  6. **Social systems have feedback loops—laws, norms, institutions—that dampen shock; why should we assume instability is the default state over stability?**
     *Note: Challenge the assumption that social systems behave like fluid dynamics.*

  7. **If a single wrong turn at Sarajevo changes everything, is my counterfactual novel about that turn a form of knowledge, or just noise generated by randomness?**
     *Note: Explore the utility of fiction in a chaotic historical framework.*
