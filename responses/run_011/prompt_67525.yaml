prompt: |-
  I'm a novelist and I'm moderating a 45 min onstage conversation at a lit festival with a historian whose recent book argues that big historical outcomes are chaotic in the literal technical sense — sensitive dependance on initial conditions, not a metaphor and not just "history is complicated." Whenever anyone asks how we could possibly know that, he says something to the effect of chaos being a theorem rather than a hunch, and that the burden of proof sits with anyone claiming the system is stable.

  Give me about seven questions in running order, each with a one-line note on what I'm trying to get him to concede or spell out. I want these pressure points hit: what exactly counts as a perturbation, and why the weather analogy is licensed rather than merely pretty; how he gets inevitability claims out of the same framework that's supposed to give him contingency claims; whether his thesis is actually any different from "we can't predict" — i.e. is the chaos epistemic or metaphysical; and what observation would count against him. Then one question aimed at my own craft: if he's right, is a counterfactual novel about the world where the driver doesn't take the wrong turn at Sarajevo a form of knowledge or a form of noise?

  Audience is smart but not academic, so no jargon dumps, and zero "what first drew you to history" filler. For the two questions he's most likely to weasel on, add the follow-up to the dodge.
