  # Joint Statement on the Absent-Minded Driver Problem

  **Date:** 24 May 2024
  **Parties:** Camp A (The Planners), Camp B (The Localists)
  **Referee:** [Your Name/Role]

  ## 1. Agreed Claims

  Both camps affirm the following claims. These statements represent the common ground upon which further argument must be built.

  1.  **The Setup:** The driver faces a route with two indistinguishable junctions. Exiting at the first yields a payoff of 1. Exiting at the second yields a payoff of 4. Passing both yields a payoff of 0. The driver cannot distinguish the junctions nor remember if he has passed one already.
  2.  **Ex-Ante Arithmetic:** Calculating expected utility from the perspective of the start of the route (the kitchen), the strategy that maximises expected payoff is to exit with probability $p = 5/8$ at any junction reached.
  3.  **Ex-Ante Value:** Following the strategy $p = 5/8$ yields an expected payoff of $25/16$ (1.5625). Both camps agree this is the maximum achievable ex-ante expected utility.
  4.  **Interim Calculation:** If the driver calculates expected utility conditional on *being at a junction* without accounting for the dependence of that observation on the strategy $p$ (i.e., treating the probability of being at the first vs. second junction as fixed or independent of $p$), the resulting optimal local probability $p$ may differ from $5/8$.
  5.  **Definition of Time Inconsistency:** A decision theory exhibits time inconsistency if the optimal action prescribed at the planning stage ($t_0$) differs from the optimal action prescribed at the execution stage ($t_1$), given that no new relevant information (other than self-locating information) has been received.
  6.  **Normative Goal:** A satisfactory decision theory should ideally avoid time inconsistency. Both camps agree that a theory which routinely prescribes reversing one's own prior optimal plan without new external evidence is defective.
  7.  **The Three-Junction Test Case:** Both camps accept the validity of the following extension for testing purposes:
      *   Three indistinguishable junctions.
      *   Payoffs: Exit 1 = 1, Exit 2 = 4, Exit 3 = 9, Pass All = 0.
      *   Constraint: The driver must adopt a single probability $p$ of exiting at any junction reached.
  8.  **Sleeping Beauty:** Both camps agree that the Sleeping Beauty problem involves self-locating uncertainty and imperfect recall. Whether this is structurally identical to the Absent-Minded Driver is a matter for the Disagreements Table.

  ## 2. Table of Residual Disagreements

  The following table isolates the precise points of contention. Each row is worded such that the respective camp accepts the statement as an accurate description of their position.

  | Topic | Camp A (Planners) | Camp B (Localists) |
  | :--- | :--- | :--- |
  | **The Locus of Decision** | The only genuine decision occurs at the planning stage ($t_0$). The "decision" at the junction is merely the execution of a prior commitment. | A genuine decision occurs at every node ($t_1$). A plan is merely a prediction of future behaviour and lacks normative grip if it conflicts with local rationality. |
  | **Conditionalisation** | Conditionalising on "I am at a junction" is illegitimate because the driver knew with certainty he would be at a junction. Doing so double-counts the decision. | Conditionalising on "I am at a junction" is mandatory. The driver is genuinely uncertain of his location, and rational action must maximise utility relative to that specific credence state. |
  | **Source of Consistency** | Time consistency is secured by binding the future self to the ex-ante optimal plan. Local reasoning is suspended to prevent inconsistency. | Time consistency is secured by correct self-locating belief formation. If beliefs are formed correctly (accounting for strategy dependence), local optimisation will naturally match the ex-ante optimum. |
  | **The "Paradox"** | The paradox is illusory. It arises only from the mistake of treating the junction as a new decision point with independent evidence. | The paradox is real. It highlights a failure in standard decision theory to handle self-locating beliefs and agency correctly. |
  | **Sleeping Beauty Analogy** | The connection is a red herring. Sleeping Beauty concerns credence alone; the Driver problem concerns control and action. | The connection is substantive. Both puzzles turn on how observer-moments should weight probabilities when their existence depends on the outcome or strategy. |

  ## 3. Cruxes and Test Cases

  The following sub-questions identify the specific claims that, if settled, would resolve or significantly shift the dispute. For each crux, we specify a concrete test and record the camps' predictions in advance.

  ### Crux 1: The Three-Junction Optimisation
  **Question:** In the Three-Junction Test Case (payoffs 1, 4, 9, 0), does the optimal local probability $p$ derived from self-locating beliefs match the optimal ex-ante probability $p$?

  *   **Method:** Both camps will independently calculate (1) the ex-ante optimal $p$ and (2) the locally optimal $p$ (assuming the agent knows he is at a junction but not which one).
  *   **Camp A Prediction:** The ex-ante optimal $p$ is the only rational standard. The locally calculated $p$ is irrelevant. If they differ, the local calculation is flawed by definition. We predict a rational driver will **not** deviate from the ex-ante $p$.
  *   **Camp B Prediction:** The ex-ante optimal $p$ and the locally optimal $p$ **must** coincide for a rational agent. If standard conditioning makes them diverge, standard conditioning is wrong. We predict that with correct self-locating belief updating, the two values will **match**.
  *   **Stakes:** If the values diverge under standard Bayesian updating, Camp A claims this proves local reasoning is forbidden. Camp B claims this proves standard Bayesian updating is insufficient for self-locating agents.

  ### Crux 2: The Normative Force of Plans
  **Question:** If a driver pre-commits to $p=5/8$ but, upon reaching a junction, calculates that $p=1$ (exit immediately) maximises expected utility given his current uncertainty, is he irrational to exit?

  *   **Camp A Prediction:** Yes. He is irrational. He is violating a binding optimal plan based on a calculation that double-counts evidence.
  *   **Camp B Prediction:** No. He is not irrational. The plan was a prediction, not a binding command. If his local calculation says exit, he should exit. If this leads to inconsistency, the fault lies in the theory that generated the plan, not the agent.
  *   **Stakes:** This determines whether "rationality" is defined by ex-ante optimality (Camp A) or ex-interim optimality (Camp B).

  ### Crux 3: The Sleeping Beauty Connection
  **Question:** Does solving the Sleeping Beauty problem (specifically the 'Halfer' vs. 'Thirder' debate) dictate the solution to the Absent-Minded Driver?

  *   **Camp A Prediction:** No. One can consistently be a 'Halfer' or 'Thirder' without it altering the ex-ante optimisation of the Driver problem. The problems are categorically distinct.
  *   **Camp B Prediction:** Yes. The credence one assigns to being at the first junction (analogous to the coin landing Heads) directly determines the local expected utility calculation. A 'Thirder' position is required to ensure time consistency.
  *   **Stakes:** This determines whether the dispute is isolated to decision theory or requires a unified theory of formal epistemology.

  ## 4. Referee's Verdict on Verbal Disputes

  Having reviewed the arguments and the draft statement above, I offer the following assessment regarding the nature of the disagreement.

  **1. Purely Verbal Disputes**
  A significant portion of the conflict stems from the definition of the word **"decision"**.
  *   **Camp A** uses "decision" to mean *the selection of a strategy type*.
  *   **Camp B** uses "decision" to mean *the selection of an action token at a specific time*.
  *   **Stipulation Required:** To make this non-verbal, the parties must agree to distinguish between **Policy Selection** (ex-ante) and **Action Selection** (ex-interim). If Camp A admits that Action Selection occurs at the junction but is normatively constrained by Policy Selection, and Camp B admits that Action Selection is constrained by the requirements of Policy Consistency, the verbal conflict dissolves.

  **2. Substantive Disputes**
  The disagreement regarding **Conditionalisation** is substantive.
  *   Camp A claims "I am at a junction" is not evidence.
  *   Camp B claims "I am at a junction" is evidence.
  *   **Stipulation Required:** This cannot be stipulated away. It requires a formal resolution on whether self-locating information counts as "new" evidence in the context of known imperfect recall. The Three-Junction Test Case (Crux 1) is the appropriate arbiter here. If the math shows that ignoring self-locating probabilities yields higher real-world payoffs in a repeated setting, Camp A is substantively correct. If the math shows that ignoring them leads to exploitable inconsistencies (e.g., money pumps), Camp B is substantively correct.

  **3. The Sleeping Beauty Question**
  The disagreement on the **Sleeping Beauty** connection is currently verbal but masks a substantive issue.
  *   It is verbal insofar as both sides agree on the *mathematics* of the Driver problem but disagree on whether to *label* it analogous to Beauty.
  *   It becomes substantive if one camp claims that the *solution* to Beauty (e.g., credence = 1/3) is a *premise* required to solve the Driver problem.
  *   **Stipulation Required:** The parties should agree to treat the Sleeping Beauty analogy as a heuristic, not a proof. The Driver problem should be solved on its own decision-theoretic merits first; the analogy should only be invoked if the solutions structurally mirror one another.

  **Final Recommendation:**
  The parties should proceed to calculate the Three-Junction Test Case independently. They must record their ex-ante optimal $p$ and their locally optimal $p$ *before* comparing notes. If Camp B's "correct self-locating belief" yields a local $p$ that matches the ex-ante $p$ without simply copying the ex-ante value, they have a case. If they cannot derive the match without assuming the plan binds, Camp A's view that the plan is the only decision is vindicated.

