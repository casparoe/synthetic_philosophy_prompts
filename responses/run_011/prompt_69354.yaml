answer: |-
  The tension gauge on Panel 4 flickered, a steady amber pulse that matched the ache behind my eyes. Eleven years. That was how long the Keeper-Head had been holding Asset 88-Blue in tensioned adjacency. Nothing touched anything else inside the field. There were four thousand and twelve fragments of hull plating, conduit, and unidentifiable scrap, each suspended in a fixed geometric relationship to its neighbors. If you pushed Fragment 12-Delta, the whole array shifted mass, sliding through the void like a single solid body.

  I tapped the glass over the gauge. The amber pulse didn't change. Fragment 12-Delta was suffering from harmonic drag. It was vibrating out of phase with the rest of the field. If it drifted another three microns, the Keeper would trigger a safety Null-State.

  Captain Vance stood behind me, his reflection ghosted over the glass. He wasn't looking at the gauge. He was looking at the logbook open on the console.

  "Statute 14-C is clear," Vance said. "Engaging the Keeper brings a vessel into being. Disengaging destroys it. We need to swap 12-Delta. To swap, we have to drop the lock on that sector. Does that destroy the vessel, Kael?"

  I kept my eyes on the pulse. "The field stays up on the other three thousand fragments. Only Delta goes loose."

  "The Code doesn't have a clause for partial release," Vance said. He tapped the logbook. "If I log this as maintenance, we keep the asset class. We keep the tax bracket. If I log it as a break-and-reset, 88-Blue dies. A new vessel is born. We pay the Genesis Tax. We lose the seniority credits on the salvage rights."

  Elara was sitting on the crate of spare parts nearby, cleaning a torque wrench with a rag that was already clean. She didn't look up. "There is no vessel, Captain. There are rocks held by a magnet. You drop the lock on one rock, you have loose rocks. You engage the lock, you have held rocks. You're taxing a magnetic field."

  "You signed the manifest," Vance said. "You certified the unit."

  "I certified the mass," Elara said. "Four thousand and twelve items. I didn't certify a ghost."

  I adjusted the dampener on the console. The amber pulse slowed slightly. The machinery was honest. It told you when the tension was wrong. It didn't care about tax brackets or ghosts. But when I put my hand on the bulkhead near the field projector, I could feel the hum. It wasn't just vibration. It was a resonance, a single note struck by four thousand pieces of metal. When 12-Delta shivered, the whole note went sour.

  "We swap it," Vance said. "I'm logging it as maintenance. The vessel persists."

  "If you log it as maintenance, you're lying," Elara said. She stood up and pocketed the rag. "If the Code says the lock makes the thing, then breaking the lock unmakes it. You can't have it both ways. Either the lock is magic, or it's junk. If it's magic, you kill it when you touch it. If it's junk, you don't tax it."

  "It's not about what it is," Vance said. "It's about what the Bureau accepts. They need a continuous chain of existence for the insurance. If 88-Blue dies, the insurance voids. If the insurance voids, and the field collapses during the swap, we're liable for the debris damage. Do you want to pay for scraping a nebula off a trade lane?"

  Elara shrugged. "I want to stop pretending the array is a person."

  I looked back at the gauge. The amber light was steady now. "The field responds as a unit," I said. "When I adjusted the dampener, the whole array corrected. Not just the neighbors. All of them. Simultaneously."

  "Because the Keeper tells them to," Elara said. "Like a herd of cattle moving away from a dog. Doesn't make the herd a cow."

  "It feels like one thing," I said.

  Vance sighed, closing the logbook. "Feelings don't file forms. Kael, prep the swap sequence. Elara, monitor the field integrity. We break lock on Delta for ten seconds, swap the fragment, re-engage. We keep the vessel alive."

  Elara didn't move. "Why?"

  "Because I say so."

  "No," Elara said. She walked over to the console, leaning in until she was between me and the gauge. "Why do you need it to be one thing? What are you afraid of?"

  Vance tightened his jaw. He looked at me, then back at her. "I'm afraid of bankruptcy."

  "You're afraid of the empty space," Elara said. "You think if you turn off the machine, there's nothing there to claim. But there's still the scrap. There's still the mass. You just don't own a 'vessel' anymore. You own parts. Parts are cheaper."

  "Parts don't carry contracts," Vance said.

  "Then the contracts are the fiction," Elara said. "Not the ship."

  I interrupted them. The gauge was flickering again. "The harmonic drag is increasing. If we don't swap Delta, the Keeper will force a Null-State anyway. System overload."

  Vance nodded. "Do it."

  I began the sequence. The console required a biometric seal to initiate a sector release. I placed my thumb on the pad. The screen asked for confirmation: *INITIATE PARTIAL NULL?*

  I hesitated. I looked at Elara. She was watching the field monitor, where the four thousand points of light hung in a cloud. They looked like stars. If I pressed the button, would the pattern break? Would the song stop?

  "Kael," Vance said.

  I pressed the button.

  The hum in the bulkhead changed. It didn't stop, but it stuttered. Fragment 12-Delta drifted loose, spinning slowly away from its neighbors. The rest of the array held firm. The Keeper compensated, tightening the tension on the remaining fragments to maintain the overall shape. The cloud dimpled where Delta had been, then held the hollow.

  "See?" Elara said. "It's still there. The array. It's just missing a tooth."

  "It's damaged," Vance said. "Log it as damage."

  "It's incomplete," Elara corrected. "There is no damage. Damage implies injury to a whole. You can't injure a cloud."

  I watched the monitor. The hollow looked wrong. It looked like a wound. I knew the physics: the Keeper was simply recalculating the adjacency vectors. But the shape of the array was distinct. It had a profile, a silhouette. Now the silhouette was broken.

  "Kael," Vance said. "Ask her."

  I looked up. "Sir?"

  "Ask her what she wants," Vance said. "Ask her what we need to do to make sure it's still the same vessel when we put the new piece in."

  I looked at Elara. She was watching the drifting fragment, her expression flat. "Elara," I said. "What would have to be added to the array? For it to stop being many pieces and start being one vessel?"

  Elara didn't look at me. "A weld," she said. "Fuse them together. Make it solid metal. Then you have one thing."

  "We can't weld them," I said. "They're in tensioned adjacency. They can't touch."

  "Then bring them in," she said. "Collapse the field. Let them crash together. Melt the seams. Then you have a vessel. Until then, you have a bag of marbles held by a magnet."

  "If we collapse the field, the structural integrity fails," I said. "It'll shatter."

  "Then it wasn't a vessel," she said.

  "But it moves like one," I said. "When I push it, it pushes back."

  "Because the magnet pushes back," Elara said. "Add a cable. Run a physical link from Fragment 1 to Fragment 4012. Then you have a circuit. Then you have a system."

  "We tried that," I said. "Year three. The cable snapped. The array held."

  "Then add a signal," she said. "A shared broadcast. Make them all ping each other."

  "They do," I said. "The Keeper broadcasts the position data to all fragments."

  "Then it's the data," she said. "The information makes it one."

  "The data is external," I said. "It comes from the Keeper-Head."

  "Then the Keeper is the vessel," she said. "And the scrap is just cargo."

  She turned away from the console. Her answer was concrete. A weld. A cable. A signal. Each one was physical. Each one was something I could touch, measure, install. But none of them felt right. A weld would kill the tension. A cable would snap. A signal was just words. The hum in the bulkhead was still there, even with Delta loose. The rest of the array was still holding its shape. It was still acting like a whole.

  "Swap the fragment," Vance ordered. "Stop philosophizing."

  I engaged the manipulator arm. It caught the drifting 12-Delta and pulled it into the exchange chute. I loaded the new fragment, a fresh piece of durasteel stamped with a serial number. I initiated the re-engagement sequence.

  The Keeper pulsed. The new fragment slid into the hollow. The tension snapped back into place. The amber light on the gauge turned green. The hum in the bulkhead smoothed out. The sour note vanished. The array was whole again.

  "Log it," Vance said. "Maintenance. Asset 88-Blue continues."

  Elara walked to the airlock. "I'm not signing the log."

  "You're insubordinate," Vance said.

  "I'm accurate," she said. "You can log what you want. But when the Bureau audits, tell them you taxed a magnet. See if they accept that as collateral."

  She left. The door hissed shut.

  Vance looked at the logbook. He picked up the pen. He hovered it over the line for *Asset Status*. He looked at the green light on the gauge. He looked at me.

  "Did it die?" he asked.

  "The light is green," I said.

  "Did it die, Kael?"

  "I don't know," I said. "The hum is back."

  Vance signed the log. He wrote *Maintenance Complete*. He closed the book. He stood there for a moment, listening to the hum. It was a quiet sound, barely audible over the life support.

  "Clean the console," Vance said. "There's grease on the glass."

  "Yes, sir."

  He left the room. I took a rag from the drawer. It was stiff with old oil. I started wiping the glass over the tension gauge. The grease smeared instead of coming off. I pressed harder. The rag tore. A piece of lint stuck to the glass, right over the green light. I tried to pick it off with my fingernail, but it was static-charged. It kept jumping back to the center of the gauge. I sighed and went to find the solvent cabinet. It was locked.
