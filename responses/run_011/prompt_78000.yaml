answer: |-
  I must stop you before we proceed to the seven questions, because there is a fundamental error in the premise of your evening's discussion that resolves most of your confusion.

  **There is no 1989 paper by "Chase and Sanborn" on functionalism and qualia.**

  Chase and Sanborn is a historic brand of coffee, not a pair of philosophers. The paper you and your friend were discussing is almost certainly **Daniel Dennett's "Quining Qualia,"** published in 1988 (in *Consciousness in Modern Science*, ed. A. Marcel and E. Bisiach).

  Here is how the confusion likely arose:
  1.  **The Coffee:** Dennett's paper famously uses "coffee-tasting" examples to argue against qualia. Your friend likely associated the coffee examples with the coffee brand "Chase and Sanborn."
  2.  **The Authors:** "Chase and Sanborn" sounds like two surnames. Your friend likely assumed they were two authors rather than a brand.
  3.  **The Title:** There is no phrase "dope on a rope" in Dennett's paper or the standard literature. This is likely a conflation of the concept of an "epiphenomenal dangler" (a phrase associated with Herbert Feigl) and the coffee imagery.
  4.  **The Concept:** Your friend explicitly uses the phrase "quining qualia," which is Dennett's specific terminology.

  Because the "Chase and Sanborn" paper does not exist, I cannot adjudicate claims about *that* text. However, since your friend's summary is clearly a description of Dennett's "Quining Qualia" (albeit with significant interpretive gloss), I will answer your seven questions by analyzing **Dennett's actual argument**, noting where your friend's summary aligns with or distorts Dennett's view.

  *Note on Recollection:* "Quining Qualia" is a canonical text. My analysis below relies on the standard philosophical understanding of Dennett's argument. Where I note specific rhetorical flourishes, I am relying on the established reception of the text rather than a line-by-line reconstruction, as minor phrasing varies across reprints.

  ***

  ### 1. Which way does the argument run?

  **The Philosophical Consensus:** Dennett's argument is **not** a *reductio* against functionalism. It is a *reductio* against the **traditional conception of qualia** (as intrinsic, ineffable, private, directly apprehensible properties).

  **Adjudication of Your Readings:**
  *   **Your Reading (i):** That the paper uses epiphenomenalism to refute functionalism. **Reject.** This is the standard *realist* response to functionalism (e.g., qualia realists argue functionalism leads to epiphenomenalism, therefore functionalism is false). Dennett accepts the conditional ("If qualia are non-functional, they are epiphenomenal") but denies the antecedent ("Qualia are non-functional"). He argues that if a property makes no causal difference, it isn't a real property.
  *   **Friend's Reading (ii):** That the paper argues functionalists are committed to functionalizing qualia, and the epiphenomenalism charge targets the traditional conception. **Accept.** This is much closer. Dennett argues that once you fix the functional facts (discrimination, reporting, memory), there is no "residue" left over. If you insist there is, that residue is causally inert ("dope on a rope"), and therefore we should eliminate the concept.

  **Role of Epiphenomenalism:** It acts as a *reductio of the opponent's conception*. Dennett says: "You claim qualia are non-functional. If they are non-functional, they are epiphenomenal. Epiphenomenalism is absurd (or at least, properties that do nothing don't exist). Therefore, your conception of qualia is wrong."

  ### 2. Does the description of the coffee-taster cases get their direction right?

  **Fair Simplification:** Your friend's summary is a fair *simplification* of the *point*, but slightly off on the *dialectic*.

  **The Nuance:** Dennett does not merely say "the functionalist cannot tell the two stories apart." He argues that **there is no fact of the matter** to tell apart.
  *   **Friend's Claim:** "One lifelong drinker's experience... changes... and everything he says and does stays exactly the same."
  *   **Dennett's Claim:** Dennett challenges whether we can make sense of "experience changes" if *nothing* else changes (including dispositional states, memory comparisons, and attentional shifts). He argues that if all functional roles are identical, the claim that "the qualia changed" is empty.

  **Load-Bearing Difference:** Yes. The friend suggests there *is* a difference in experience that functionalism misses (which would support the anti-functionalist reading). Dennett argues that if functionalism misses it, **it isn't a difference in experience at all.** The friend's summary risks smuggling in the very intuition Dennett is trying to dismantle.

  ### 3. What exactly is inert on the "dope on a rope" image?

  **Correction:** As noted, "dope on a rope" is not Dennett's phrase. The standard phrase is "epiphenomenal dangler."

  **What is Inert:** It is **qualia as traditionally conceived** (intrinsic, non-relational properties), not experience *simpliciter*.
  *   **Does the summary slide?** Yes. Your friend says: "Hence qualia, on the traditional conception, are epiphenomenal... so we should drop the notion of qualia altogether."
  *   **The Slide:** The slide is from "traditional qualia are inert" to "experience is a decoration." Dennett wants to save "experience" by redefining it functionally. He is an eliminativist about *qualia* (the philosophical construct), not necessarily about *conscious experience* (the phenomenon), though he thinks the phenomenon is exhausted by function.
  *   **Work done by the slide:** The slide allows your friend to conclude that *you* (the qualia realist) are defending a "decoration." Dennett would agree with that specific charge against the *traditional definition*, but not against the existence of consciousness itself.

  ### 4. Does the final claim follow? Eliminativism or Revisionism?

  **The Inference:** The claim "nothing left over once functional facts are fixed" follows from a premise Dennett explicitly endorses: **To be real is to make a causal difference.** (This is sometimes called the "causal theory of reality" or a verificationist leanings).
  *   **Extra Premise:** Yes, it needs the premise: "Properties that make no causal difference do not exist."
  *   **Eliminativism vs. Revisionism:** It is **eliminativism about the concept of 'qualia'** (as defined by the "ineffable, intrinsic" criteria) and **revisionism about experience**. He wants us to keep talking about tasting coffee, but stop talking about "qualia" as a special, non-physical glue.
  *   **"Quining Qualia":** This **is** Dennett's phrase. It is a pun on W.V.O. Quine (who argued for eliminating obscure ontological commitments) and "quining" (a logical operation). Your friend correctly attributes the phrase to the argument's upshot, but incorrectly treats it as a summary of a different paper's title.

  ### 5. Inverted spectra and gradual replacement?

  **Stock Examples:** Your friend has imported stock examples, but Dennett does discuss them.
  *   **Inverted Spectrum:** Dennett discusses this extensively in "Quining Qualia." However, he does not "grant" it for the sake of argument in the way a realist does. He argues that for an inverted spectrum to be real, it must have functional consequences. If it has no functional consequences, it is not a real inversion.
  *   **Gradual Replacement:** This is more associated with "absent qualia" arguments (e.g., Block's Chinese Nation). Dennett addresses similar "fading qualia" cases, but the coffee-taster is the primary example in this specific paper.
  *   **Backdating:** The examples are not backdated; they are standard in the 1980s debate. However, your friend's characterization that Dennett "grants" them as coherent possibilities is shaky. Dennett spends much of the paper arguing they are *incoherent* if described as functionally undetectable.

  ### 6. Setting exegesis aside: Is the inference sound?

  This is the live philosophical debate.

  **Objection 1 (Bullet-biting Epiphenomenalism):**
  *   *Threat:* Low. Most philosophers find epiphenomenalism deeply counter-intuitive (if my pain doesn't cause me to wince, why do I wince?). However, some (like Frank Jackson in his earlier work) were willing to bite the bullet.
  *   *Dennett's Counter:* Dennett argues that if qualia are epiphenomenal, we could never talk about them, think about them, or write papers about them (since those are causal processes). Therefore, the very act of discussing qualia proves they are not epiphenomenal.

  **Objection 2 (Causal Relevance without Functional Characterizability):**
  *   *Threat:* **High.** This is the standard realist objection (later developed by Chalmers and others). The claim is that a property can be causally relevant in virtue of its *intrinsic nature*, not just its relational role.
  *   *The Non Sequitur:* You identified this correctly. The move from "not functionally characterized" to "makes no causal difference" assumes **causal structuralism** (that causal powers are exhausted by structural/relational properties). If you reject that assumption, Dennett's argument loses its grip.

  **Third Objection:**
  *   **The Phenomenological Intuition:** The most serious threat to Dennett is simply the brute intuition that "there is something it is like" that exceeds functional description. Dennett dismisses this as a "theoretical intuition" that should be discarded when it conflicts with a better theory (functionalism). Realists argue this intuition is the *data* that theory must save.

  ### 7. The Single Sentence and The Verdict

  **The Sentence:**
  > "Chase and Sanborn are running a reductio against functionalism."

  **Correction:**
  > "Dennett is running a reductio against the traditional conception of qualia to *save* functionalism."

  Correcting this sentence would have ended the argument fastest because it flips the entire dialectic. You were arguing against functionalism; your friend was arguing that functionalism defeats your intuition. But you were both arguing under the illusion that the text was attacking functionalism.

  **Who was closer?**
  **Your friend was closer to what the paper actually does.**
  *   **You:** Thought the paper implies functionalism cannot capture what it is like (Anti-functionalist reading).
  *   **Friend:** Thought the paper dismantles the intuition that there is "something left over" (Pro-functionalist/Anti-qualia reading).

  Dennett's paper is a defense of functionalism (or at least a heterophenomenological approach compatible with it) against qualia realism. Your friend correctly identified that the paper argues the "notion of qualia [is] unusable." You were defending the intuition that the paper is explicitly designed to undermine.

  ***

  **Summary of the Situation:**
  You and your friend spent three hours debating a ghost. The bibliographic details (Chase and Sanborn, two authors, "dope on a rope") are conflations born of the coffee examples and the coffee brand. The philosophy, however, is Dennett's. Your friend understood Dennett's *conclusion* (qualia as traditionally defined are incoherent) better than you did, but you were right to feel that the argument relies on a contentious premise (that causal relevance requires functionalizability). You were fighting the right fight, just against the wrong bibliography.
