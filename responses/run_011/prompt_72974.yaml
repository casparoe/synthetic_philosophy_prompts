prompt: |-
  I am the part-time coordinator of a community currency covering a rural county of about sixty thousand people. The currency is a paper scrip pegged one to one to the national currency and redeemable at participating local businesses, and alongside it we run a mutual-credit ledger for businesses that trade with each other. I have no training in economics; I came to this job from running a food bank. Our governing board is nine volunteers: three small business owners, two retired teachers, a farmer, a town councillor, a nurse, and a pastor. We meet for ninety minutes once a quarter, and at each meeting I usually have two or three proposals to screen. A proposal typically asks for somewhere between two and fifteen thousand dollars in seed money, plus print costs, plus a few hundred hours of my staff time, and the reputational exposure matters more than the money: if a scheme collapses with people holding worthless paper, the program loses trust it took a decade to build. I can only make a recommendation; the board votes.

  Over the past year I have been reading an eighteenth-century book by an Irish bishop — I believe it is called The Querist — written entirely as numbered questions about money. I have no academic background and I am aware I may be mangling it, so part of what I want from you is a check: tell me plainly where the ideas I list below are misstated, where I have imported something from the book's critics, or where the book does not support the use I am making of it. As I read it, the position comes to roughly this. Money is not wealth; wealth is a country's capacity to produce and circulate the things people actually need. Money is a ticket or counter whose entire worth lies in what it sets in motion — it works by getting people to work. A currency that sits idle has failed even if it holds its value perfectly, so the thing to design against is hoarding, not depreciation. On that basis it can be right to build a currency that costs something to hold, and to prefer credit backed by the real produce and property of a place over precious metal that can be exported or buried. And the question to put to any monetary arrangement is not whether it is sound in itself but whether it moves industry that would otherwise not move.

  I want that turned into a screening procedure my board can run. Not an essay about the book, and not a general theory of local currency: a written procedure that nine non-specialists can work through in ninety minutes on a proposal they are seeing for the first time, ending either in a recommendation to fund, a recommendation to decline, or a named question the procedure cannot answer and that must go to a vote as a matter of values rather than facts. Please give me:

  - the questions to ask, in order, and for each one what counts as a sufficient answer — specify what would satisfy the question and what would not, and which questions can be answered from the proposal text alone rather than requiring figures nobody will have;
  - the points at which the procedure stops early with a no, rather than carrying a doomed proposal through the remaining steps;
  - which of the distinctions above have to survive the simplification and which I can safely drop, and what is lost by dropping them;
  - how the procedure handles the thing that worries me most. Many of our members are paid partly in scrip precisely because they cannot get regular work, and anything that makes the currency expensive to hold falls hardest on the people least able to spend it quickly. If the procedure tells me to design against hoarding, it may be telling me to design against the poor. I need to know whether that is a factual question the procedure can settle or a value question it must hand over to the board, and how the handover should be worded;
  - the ways the procedure will systematically get it wrong: what a proposal can say in order to pass every question while still failing in practice, and what genuinely good proposals it will reject;
  - a plain-language version of at most one page that could be handed to the board without any of the reasoning behind it.

  Then run it out loud on three proposals we actually have in front of us.

  (a) My own. A numbered, limited-edition series of scrip notes with artwork by local artists, sold at a modest premium, with two notes in each series deliberately scarce so that people collect them. The premium funds the program; the notes circulate at face value like any others. Two towns that tried something similar sold their collectible runs out quickly. I am attached to this idea and I expect your procedure to reject it. If it does, I want the rejection to follow from the reasoning above rather than from a general caution about novelty, and if the procedure says no for a reason that could be fixed by redrafting, tell me which feature to change and whether what remains is still worth doing.

  (b) A mutual-credit line among eleven local businesses — a bakery, a miller, a printer, two farms, a hardware store, a haulage firm, a café, a bookkeeper, a brewery, a timber yard — with balances capped at plus or minus five thousand units, no interest, quarterly settlement, and a rule that any member running more than four thousand in credit has its cap reduced until it spends. It asks us for accounting software and forty hours of my time, and nothing else.

  (c) A prepaid card issued in partnership with a regional bank, loadable by anyone, carrying a five percent town subsidy when spent inside the county, usable at every store in the county including two national chains, with no expiry and no fee. It asks for twenty-five thousand dollars.

  Two things about how you present all of this. First, tell me how confident you are in what you claim: mark which parts follow straightforwardly from the position I described, which parts are judgment calls that another sensible person would make differently, and which parts rest on something you know about the book or about local currencies that I have no way of checking from where I sit. Second, single out the one point in your answer that you are least sure of, and tell me what would settle it — something I could observe in my own operation over the next two quarters to find out whether you are right.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User Role:** Part-time coordinator of a rural community currency (60k population). Background in food bank, not economics.
      *   **System:** Paper scrip (1:1 peg, redeemable) + Mutual-credit ledger for businesses.
      *   **Governance:** 9 volunteers (diverse backgrounds), meet 90 mins/quarter.
      *   **Stakes:** High reputational risk (trust built over a decade). Proposals cost \$2k-\$15k + staff time.
      *   **Intellectual Framework:** Reading Bishop George Berkeley's *The Querist* (18th century). Key ideas: Money is not wealth; wealth is production/circulation; money is a ticket to motivate industry; idle money is failure; design against hoarding, not depreciation; credit backed by real produce > precious metal; test = does it move industry that wouldn't otherwise move?
      *   **Task:** Create a screening procedure based on this framework for the board to use. Test it on three specific proposals (including the user's own).
      *   **Constraints:** Needs specific questions, stop-points, simplification advice, handling of the "poor/hoarding" dilemma, failure modes, a 1-page handout, and confidence markers.
      *   **Tone:** Plain language, practical, respectful of the user's non-expert status but rigorous on the logic.

  2.  **Analyze the Intellectual Framework (*The Querist*):**
      *   *Verification:* The user's summary of Berkeley's *The Querist* is remarkably accurate. Berkeley argued that money is a "ticket" or "counter" to stimulate industry. He questioned whether gold/silver were necessary (preferring paper credit backed by land/industry). He emphasized circulation over accumulation.
      *   *Potential Pitfall:* Berkeley was writing about *national* economies in a colonial context (Ireland), not small-scale local currencies. Applying his macro-ideas to a micro-system requires care.
      *   *The "Hoarding vs. Poor" Tension:* This is the critical ethical/economic conflict. Demurrage (cost to hold) prevents hoarding but hurts the liquidity-constrained poor. Berkeley might argue that if the poor have no industry to engage in, the currency isn't doing its job, but practically, penalizing the poor is a value judgment.

  3.  **Drafting the Screening Procedure:**
      *   *Goal:* 90 minutes, 9 non-experts. Needs to be binary (Yes/No/Value Vote) where possible.
      *   *Structure:*
          1.  Does it move idle industry? (The Core *Querist* Test)
          2.  Is it backed by real value? (The Security Test)
          3.  Does it circulate or sit? (The Velocity Test)
          4.  Who bears the cost? (The Equity Test)
      *   *Stop Points:* If it fails the Core Test, stop. If it fails Security, stop.
      *   *Simplification:* Drop the metaphysical distinction between "money" and "wealth." Focus on "Does this make things happen?"
      *   *The Poor/Hoarding Dilemma:* This *must* be a value question. The procedure can identify *if* a measure hurts the poor, but not *whether* that trade-off is acceptable.

  4.  **Developing the Questions (Iterative Process):**
      *   *Q1 (Industry):* Does this pay people to do things they wouldn't do otherwise? *Sufficient Answer:* Specific examples of idle resources/labor being activated. *Insufficient:* "It helps the economy."
      *   *Q2 (Backing):* If this fails, what real thing covers the loss? *Sufficient:* Goods, services, or collateral. *Insufficient:* "Trust" or "Future growth."
      *   *Q3 (Circulation):* What stops this from sitting in a drawer? *Sufficient:* Expiry, demurrage, or strong incentive to spend. *Insufficient:* "People will want to spend it."
      *   *Q4 (Equity):* Does the cost of circulation fall on those least able to pay? *Sufficient:* Analysis of who holds the currency longest. *Insufficient:* "It's fair."

  5.  **Addressing the Specific Proposals:**
      *   *(a) Collectible Scrip:*
          *   *Analysis:* It encourages *hoarding* (collecting). This directly contradicts the "design against hoarding" principle. It creates scarcity for speculation, not circulation.
          *   *Verdict:* Likely Reject based on Q3.
          *   *Fix:* Remove the "scarce" element or ensure the premium doesn't incentivize holding out of circulation. But if the point is collecting, it fails the *Querist* test of "moving industry."
      *   *(b) Mutual Credit Chain:*
          *   *Analysis:* Backed by real goods (bread, timber, etc.). Caps prevent hoarding of credit (negative balance) and forcing spending (positive balance cap). Moves industry between businesses.
          *   *Verdict:* Strong Accept. Fits the framework perfectly.
      *   *(c) Subsidized Prepaid Card:*
          *   *Analysis:* 5% subsidy is expensive. Usable at national chains (leakage). No expiry (hoarding risk). Backed by bank (safe) but doesn't necessarily move *local* industry that wasn't moving (just shifts payment method).
          *   *Verdict:* Risky. Fails Q1 (does it move *new* industry?) and Q3 (no expiry).

  6.  **Addressing the "Confidence" and "Uncertainty" Requirements:**
      *   *Confidence:* High on the interpretation of *The Querist* (it's a standard reading). Moderate on the application to local currency (economic theory varies). Low on the specific outcome of the "poor/hoarding" trade-off (empirical data needed).
      *   *Uncertainty:* The impact of demurrage/hoarding penalties on the specific demographic of *this* county.
      *   *Settling it:* Track velocity of notes held by low-income users vs. businesses over 2 quarters.

  7.  **Refining the Output:**
      *   *Constraint Check:* One-page handout? Yes. Confidence markers? Yes. Least sure point? Yes.
      *   *Tone:* Respectful, collaborative, not condescending about the economics.
      *   *Correction on User's Premise:* The user suspects their proposal (a) will be rejected. I need to confirm this but explain *why* based on the text, not just "novelty." The collectibility *is* hoarding.

  8.  **Final Polish:**
      *   Ensure the distinction between "Fact" and "Value" is clear in the procedure.
      *   Make sure the "Stop Early" points are explicit.
      *   Check the word count/length for the handout section.

  *(Self-Correction during drafting)*: I initially thought about suggesting demurrage (stamp scrip) for the poor. But the user specifically flagged this as a worry. I need to make sure the procedure flags this as a *Value Vote*, not a automatic fail. The procedure should identify the risk, not dictate the solution.

  *(Refining the Berkeley Check)*: Berkeley's *The Querist* is indeed the source. The user's summary is excellent. I should validate that explicitly to build trust.

  *(Refining the Proposal Analysis)*: For Proposal (a), the user says "I expect your procedure to reject it." I need to be careful. If the premium funds the program, is that "wealth"? Berkeley says money isn't wealth. Selling a ticket to raise funds is okay, but if the ticket *leaves* circulation (collecting), it fails the "motion" test. I will recommend rejection but suggest a pivot (sell the art, keep the currency circulating).

  *(Refining Proposal (c))*: The subsidy is a cost. Who pays? If it's seed money, it's finite. If it leaks to national chains, it doesn't build local capacity. This is a strong "No" on the *Querist* principle of local industry.

  9.  **Final Review against constraints:**
      *   Questions in order? Yes.
      *   Sufficient/Insufficient answers? Yes.
      *   Stop points? Yes.
      *   Simplification advice? Yes.
      *   Poor/Hoarding dilemma handling? Yes.
      *   Failure modes? Yes.
      *   1-page handout? Yes.
      *   Run on 3 proposals? Yes.
      *   Confidence markers? Yes.
      *   Least sure point + test? Yes.

  Proceed to generate response.mn
answer: |-
  Here is the screening procedure, the analysis of your three proposals, and the required meta-commentary on confidence and uncertainty.

  ### Part 1: The Screening Procedure

  This procedure is designed to be read aloud by the Coordinator. It takes approximately 45 minutes to work through, leaving 45 minutes for discussion and voting. It is based strictly on the *Querist* principles you outlined: money is a ticket for industry, circulation is superior to storage, and real value backs the ticket.

  **Confidence Marker:** The logic below follows straightforwardly from the position you described. The specific thresholds (e.g., "quarterly") are judgment calls based on typical local currency lifecycles.

  #### Step 1: The Industry Test (Fact)
  **Question:** Does this proposal activate resources (labor, goods, space) that are currently idle, or does it merely reshuffle money for activity that is already happening?
  *   **Sufficient Answer:** "Yes. Specifically, [X] hours of labor or [Y] units of product will be brought into the market that are not currently sold." (e.g., "The baker will hire a second apprentice using credit," not "The baker will accept payment in scrip.")
  *   **Insufficient Answer:** "It will help local business," "It increases liquidity," or "People will feel richer."
  *   **Stop Point:** If the answer is **Insufficient** or **No**, recommend **Decline**. Do not proceed. This is the core *Querist* principle: money must move industry that would otherwise not move.

  #### Step 2: The Backing Test (Fact)
  **Question:** If the scheme collapses tomorrow, what real thing can be sold or claimed to redeem the paper/credits?
  *   **Sufficient Answer:** "Specific goods in inventory," "Collateralized property," or "A legal obligation of a solvent partner to provide services."
  *   **Insufficient Answer:** "The reputation of the board," "Future tax revenue," or "The hope that others will accept it."
  *   **Stop Point:** If the answer is **Insufficient**, recommend **Decline**. Precious metal or cash reserves are acceptable but inferior to local produce; "trust" alone is not backing.

  #### Step 3: The Circulation Test (Fact)
  **Question:** What specific mechanism prevents this currency from sitting idle in a wallet or ledger for more than three months?
  *   **Sufficient Answer:** "Expiry dates," "Demurrage (holding fees)," "Credit limits that force spending," or "Incentives that expire."
  *   **Insufficient Answer:** "People will want to spend it," "It is convenient," or "There is no penalty for holding."
  *   **Note:** If the proposal relies on "no penalty," proceed to Step 4. If it relies on penalties, proceed to Step 4.

  #### Step 4: The Equity Test (Value)
  **Question:** Does the cost of keeping the currency moving fall disproportionately on those with the least ability to spend quickly (the poor, the unemployed, the fixed-income)?
  *   **Sufficient Answer:** A clear identification of who holds the currency longest. (e.g., "Low-income workers hold cash longer than businesses.")
  *   **Decision Point:**
      *   If **Yes** (the poor bear the cost): This is a **Value Vote**. The procedure cannot answer this. The Coordinator must phrase the motion as: *"This scheme increases circulation but penalizes liquidity-constrained members. Does the board accept this trade-off?"*
      *   If **No** (costs are on businesses/wealthy): Proceed to Recommendation.

  #### Step 5: Recommendation
  *   **Fund:** Passed Steps 1, 2, 3 and Step 4 was "No."
  *   **Decline:** Failed Step 1 or 2.
  *   **Value Vote:** Passed Steps 1, 2, 3 but Step 4 was "Yes."

  ---

  ### Part 2: Simplification and Loss

  **Distinctions to Keep:**
  1.  **Idle vs. Active Industry:** You must keep the distinction between "moving existing money" and "creating new work." This is the heart of Berkeley's argument.
  2.  **Backing vs. Trust:** You must distinguish between "we promise" and "here is the wheat/wood."
  3.  **Fact vs. Value (The Poor):** You cannot simplify away the tension between circulation and equity.

  **Distinctions to Drop:**
  1.  **Money vs. Wealth:** Do not ask the board to debate metaphysics. Ask only: "Does this make things?"
  2.  **Paper vs. Ledger:** Treat them the same. The medium matters less than the rules of circulation.
  3.  **Precious Metal:** You mentioned Berkeley's preference against metal. In a local currency, you are already paper/credit. Drop the comparison to gold; it distracts from the comparison to *local goods*.

  **What is Lost:**
  By dropping the metaphysical "Money is not Wealth" language, you lose the philosophical shield against inflation hawks. However, you gain speed. The board doesn't need to understand *why* money is a ticket, only that the ticket must be used.

  ---

  ### Part 3: The Poor and Hoarding (Your Primary Worry)

  **Is this Fact or Value?**
  It is a **Value Question**.
  *   **Fact:** Penalties for holding (demurrage) or short expiry dates mathematically impact those who cannot spend quickly more than those who can. This is observable.
  *   **Value:** Whether that impact is *acceptable* to achieve higher circulation is a moral choice, not an economic one.

  **How the Procedure Handles It:**
  Step 4 isolates this. It forces the board to acknowledge the cost. It prevents you (the Coordinator) from hiding the cost behind "economic necessity," and it prevents the board from ignoring the cost behind "good intentions."

  **Wording for the Handover:**
  *"The evidence shows this design penalizes slow spending. Our data shows low-income members spend slowest. We can achieve the goal of circulation, but the cost will be borne by the poor. Do we accept this cost?"*

  ---

  ### Part 4: Failure Modes

  **How the Procedure Gets It Wrong (False Positives):**
  *   **The "Busy Work" Trap:** A proposal can pass Step 1 by creating useless industry (e.g., digging holes and filling them). The procedure checks for *activity*, not *utility*.
      *   *Mitigation:* In Step 1, require the "resource" to be something the market actually wants (goods/services), not just labor.
  *   **The "Gaming" Trap:** A business can pass Step 3 by churning money between two owned accounts to simulate velocity.
      *   *Mitigation:* Rely on your staff time review. The 40 hours you spend monitoring (mentioned in proposals) must include audit checks.

  **How the Procedure Gets It Wrong (False Negatives):**
  *   **The "Trust Builder" Trap:** A proposal might fail Step 1 (no new industry) but build brand trust that pays off in Year 3. The procedure is biased toward short-term motion.
      *   *Loss:* You may reject marketing or PR efforts that stabilize the currency without immediately increasing velocity.
  *   **The "Safety Net" Trap:** A proposal that helps the poor hold value (anti-hoarding penalty) will be flagged in Step 4. If the board is risk-averse, they may reject a vital social safety net because it looks like "idle money."

  ---

  ### Part 5: The One-Page Handout

  **(Copy and paste this for your board)**

  **COMMUNITY CURRENCY PROPOSAL SCREENING CHECKLIST**
  *To be completed by the Coordinator prior to the vote.*

  **1. THE INDUSTRY TEST**
  *Does this activate idle labor or goods, or just move existing money?*
  [ ] **Pass:** Specific idle resources identified (e.g., unemployed labor, empty shop space).
  [ ] **Fail:** General claims of "economic help" or "liquidity."
  *RESULT: If Fail, Recommendation is DECLINE.*

  **2. THE BACKING TEST**
  *If we close tomorrow, what real thing covers the outstanding notes/credits?*
  [ ] **Pass:** Inventory, collateral, or legal service obligations.
  [ ] **Fail:** Reputation, future growth, or unspecified "trust."
  *RESULT: If Fail, Recommendation is DECLINE.*

  **3. THE CIRCULATION TEST**
  *What stops this from sitting in a drawer for 3+ months?*
  [ ] **Pass:** Expiry, holding fees, or credit limits forcing spend.
  [ ] **Fail:** Reliance on users "wanting" to spend.

  **4. THE EQUITY CHECK**
  *Who pays the cost of keeping the money moving?*
  [ ] **Low Risk:** Costs fall on businesses or high-velocity users.
  [ ] **High Risk:** Costs fall on those unable to spend quickly (poor/unemployed).
  *NOTE: If High Risk, this requires a VALUE VOTE by the Board.*

  **FINAL RECOMMENDATION**
  [ ] **FUND** (Passed 1, 2, 3; Low Risk on 4)
  [ ] **DECLINE** (Failed 1 or 2)
  [ ] **VALUE VOTE** (Passed 1, 2, 3; High Risk on 4)

  ---

  ### Part 6: Running the Procedure on Your Proposals

  #### Proposal (a): Collectible Scrip
  *   **Step 1 (Industry):** **Fail.** Selling collectible notes does not activate idle labor or goods. It activates the *collector's* desire for scarcity. It is a fundraising mechanism, not an industry mechanism. While the premium funds the program, the notes themselves are designed *not* to circulate (they are for collecting).
  *   **Step 3 (Circulation):** **Fail.** The design explicitly encourages hoarding (scarcity, collectibility). This is the opposite of the *Querist* principle.
  *   **Verdict:** **Decline.**
  *   **Coordinator Note:** You expected this. The reasoning is not "novelty is bad," but "hoarding is contrary to the mission."
  *   **Fix:** If you want to raise funds, sell the *art* (prints), not the *currency*. Issue the currency separately with standard circulation rules. If you must combine them, remove the "scarce" element. Make all notes equal. But if the premium relies on scarcity, the scheme fundamentally conflicts with your velocity goal.

  #### Proposal (b): Mutual-Credit Chain
  *   **Step 1 (Industry):** **Pass.** The cap on positive balances (4,000 units) forces businesses to spend credit on local partners rather than accumulating it. This activates trade that might otherwise go to external suppliers.
  *   **Step 2 (Backing):** **Pass.** Backed by bread, timber, printing, haulage. Real produce.
  *   **Step 3 (Circulation):** **Pass.** The rule reducing the cap for high-credit members is a structural anti-hoarding mechanism.
  *   **Step 4 (Equity):** **Low Risk.** These are businesses. They have cash flow. The cost of "forced spending" is on commercial entities, not the poor.
  *   **Verdict:** **Fund.** This is the ideal *Querist* instrument.

  #### Proposal (c): Subsidized Prepaid Card
  *   **Step 1 (Industry):** **Borderline/Fail.** Does a 5% subsidy create *new* industry, or just subsidize existing consumption? If the national chains (two mentioned) are recipients, the value leaks out of the county. It moves money, but not necessarily *local* industry.
  *   **Step 2 (Backing):** **Pass.** Backed by the regional bank + seed money.
  *   **Step 3 (Circulation):** **Fail.** "No expiry and no fee." This is a perfect store of value, which means it is a perfect hoarding vehicle. It fails the "design against hoarding" rule.
  *   **Step 4 (Equity):** **Low Risk.** Subsidy benefits the spender.
  *   **Verdict:** **Decline** (based on Step 1 and 3).
  *   **Reasoning:** It leaks value to national chains (fails local wealth building) and has no mechanism to ensure velocity (fails the circulation test). It is a discount card, not a currency engine.

  ---

  ### Part 7: Confidence and Uncertainty

  **Confidence Markers:**
  1.  **High Confidence:** My interpretation of your summary of *The Querist*. Your reading is accurate: Berkeley viewed money as a tool to stimulate industry, not a store of value. The procedure follows this logic strictly.
  2.  **Medium Confidence:** The application of "Industry Test" to Proposal (c). One could argue subsidies *create* demand. However, under Berkeley's view, if the supply (industry) isn't local, the wealth leaves. I am confident Berkeley would reject leakage to national chains.
  3.  **Medium Confidence:** The rejection of Proposal (a). Fundraising is necessary. However, if the fundraising instrument *itself* violates the currency's circulation principle, it undermines the brand.

  **The One Point I Am Least Sure Of:**
  I am least sure about the **Equity Test (Step 4)** assumption that "the poor hold money longer."
  *   **Why:** In some rural economies, the poor are forced into high-velocity survival spending (daily food, transport), while the middle class saves. In others, the poor are excluded from credit and must hoard cash for emergencies. Your specific county's behavior is unknown to me.
  *   **How to Settle It:** Over the next two quarters, track the **Velocity of Income Groups**.
      *   *Observation:* When a note enters the system via a low-income user (e.g., food bank stipend or wage), how many days until it is redeemed by a business? Compare this to notes entering via business change.
      *   *Settling Condition:* If low-income velocity is *higher* than business velocity, your fear is unfounded, and anti-hoarding measures are safe. If low-income velocity is *lower*, the Value Vote is critical.

  **Final Advice:**
  You are right to worry about Proposal (a). It is seductive because it raises cash, but it teaches the public that your currency is a souvenir, not a tool. Proposal (b) is your core work. Proposal (c) is a distraction that risks leakage. Stick to the procedure; it protects you from having to argue economics with the board, allowing you to argue only about facts and values.
