answer: |-
  ### 1. The Verdict on Your Hunch
  **Your hunch is theoretically sound but practically fragile.**

  *   **Theoretically:** You are correct. Under Harsanyi's Doctrine, any difference in likelihood functions (how we interpret evidence) can be mathematically recast as a difference in priors (over a larger state space that includes "which model is true"). Therefore, observing a stall in posteriors *never* definitively tells you whether the break is in priors, likelihoods, or partitions. The transcript is underdetermined.
  *   **Practically:** If you hand Student A a slip saying "Your Prior is 0.8" and Student B a slip saying "Your Prior is 0.2," the ambiguity vanishes in the debrief. To preserve the ambiguity, your Round 2 slips must frame the difference as **"Background Intel"** or **"Reliable Rumors"** rather than explicit probability assignments. This allows students to argue in the debrief whether that intel constituted a *prior update* or a *likelihood constraint*.

  **Recommendation:** Lean into the ambiguity. Do not label the difference "Priors." Label it "Private Context." In the debrief, reveal that the *structure* of the context differed, but let them debate whether that violates Common Priors or Common Likelihoods. This makes the point stronger: *behavioral* disagreement doesn't diagnose the *structural* break.

  ---

  ### 2. The Game Design: "The Urn Protocol"

  **The Task:**
  There are two urns, **Alpha** and **Beta**. One is selected by the instructor (flip a coin at the start, keep it secret).
  *   **Urn Alpha:** 70% Red chips, 30% Blue chips.
  *   **Urn Beta:** 30% Red chips, 70% Blue chips.
  *   **Goal:** Estimate the probability that the selected urn is **Alpha**.

  **The Payoff (Candy):**
  *   **Round 1 (Convergence):** Every student whose final estimate is within **10%** of the *class median* gets a candy. (Incentivizes agreement).
  *   **Round 2 (Stall):** Every student whose final estimate is within **15%** of the *true Bayesian probability* (calculated by you using all info) gets *two* candies. (Incentivizes accuracy over agreement).

  **The Tools (Crucial for Time Management):**
  Do not make them calculate Bayes' Rule. It introduces noise.
  *   **The Lookup Card:** Every student gets a laminated card.
      *   *Top:* "My Private Signal" (e.g., 2 Red, 1 Blue).
      *   *Bottom:* A table. "If current public consensus is X, and my signal is Y, my new probability is Z."
      *   *Simplification:* For this seminar, give them a **"Bayes Calculator"** wheel or a simple table: *Start with your Private Context (Round 2 only). Add signals. Read off result.*
      *   *Actually, simpler:* Give them a **Pre-Calculated Grid**.
          *   Rows: Number of Red chips seen (0 to 5).
          *   Columns: Number of Blue chips seen (0 to 5).
          *   Cell Value: The Posterior Probability of Alpha.
          *   *Round 1:* Base prior is 50%.
          *   *Round 2:* Base prior is shifted (see slips).
      *   *Wait, if they have a grid, they don't need to update on others.*
      *   *Correction:* They need to update on *others' announcements*.
      *   *Best Tool:* **The "Update Rule" Card.**
          *   "If you see a class median of P, and your private signal is S, your new estimate is f(P, S)."
          *   *Honest Truth:* Humans are bad at this.
          *   *Workaround:* **The "Oracle" Sheet.** You (the instructor) hold the master key. They announce their number. You tell them if they are "Consistent" or "Inconsistent" with their own info? No, that breaks the game.
          *   *Best Workaround:* **Limit the Signals.**
          *   Each student draws **ONE** chip from the urn (with replacement) or is handed a slip saying "You observed: Red."
          *   **Lookup Table:**
              *   Start Prior (Round 1: 50%, Round 2: See Slip).
              *   If you see Red: Multiply odds by 7/3.
              *   If you see Blue: Multiply odds by 3/7.
              *   **Provide an Odds-to-Prob Converter:** A simple number line on their desk. 1:1 = 50%. 7:3 = 70%. 49:9 = 84%.
              *   **The Protocol:** They don't calculate the *global* posterior. They calculate their *own* posterior given their info + the *public knowledge* of how many Reds/Blues others have seen.
              *   *Wait, Aumann requires they announce Posteriors, not Signals.*
              *   *Okay, Final Tool Decision:* **The "Signal Count" Board.**
              *   To make this work in 75 mins without math errors:
              *   Students do **not** calculate complex posteriors.
              *   They are assigned a **Signal** (Red or Blue).
              *   **Round 1:** They announce the probability *given only their signal* (Round 1, Cycle 1).
              *   **Round 1, Cycle 2:** They count how many Reds/Blues were announced in Cycle 1. They update.
              *   **Tool:** A giant poster on the wall: "If Total Reds = X and Total Blues = Y, Probability of Alpha = Z."
              *   This turns the game into "Count the hands" rather than "Calculate Bayes." It preserves the logic (aggregating information) without the arithmetic bottleneck.

  ---

  ### 3. The Information Slips

  **Round 1 (Common Prior, Common Likelihood, Different Partitions)**
  *   **Instruction:** "The Urn was chosen by a fair coin flip (50/50). You have drawn one chip from the Urn. Keep it secret."
  *   **Distribution:** Hand out 12 "Red" slips and 6 "Blue" slips (if Urn Alpha is true) or vice versa.
  *   **Expectation:** Cycle 1 will show dispersion (70% vs 30%). Cycle 2 (after counting totals) should converge everyone to the same number (e.g., 90%).

  **Round 2 (The Stall - Hidden Prior Violation)**
  *   **Instruction:** "You have drawn one chip. **ALSO:** You have received private intelligence from a 'Reliable Source'."
  *   **Group A (9 students):** Slip says "Reliable Source indicates Urn Alpha is **3 times more likely** to be selected than Beta *before* drawing chips." (Prior = 75%).
  *   **Group B (9 students):** Slip says "Reliable Source indicates Urn Beta is **3 times more likely** to be selected than Alpha *before* drawing chips." (Prior = 25%).
  *   **Signal Distribution:** Same as Round 1 (e.g., 12 Red, 6 Blue).
  *   **Expectation:** Group A starts high, Group B starts low. They count the chips (public info). They update. But because their *starting points* (Priors) differ, their *ending points* will differ even after seeing the same public chip counts.
  *   **Ambiguity:** In debrief, Group A says "My source said Alpha." Group B says "My source said Beta." Students will argue: "Was the Source a Prior? Or was it just another Signal?" (It's modeled as a Prior, but feels like a Signal). This validates your hunch.

  ---

  ### 4. The Disclosure Protocol (Mechanizing Common Knowledge)

  To satisfy the "Common Knowledge" requirement without taking 2 hours:

  1.  **The "Flash" Rule:** All students stand. On your count, they hold up a large card with their current Probability Estimate (0-100%).
  2.  **The Board:** You (or a TA) record the **Median** and the **Range** on the whiteboard after every flash.
  3.  **The Update:** Students sit. They have 60 seconds to look at the Board (Median/Range) and their Slip. They calculate their new estimate.
  4.  **The Constraint:** They cannot talk. They cannot show slips. They can only look at the Board's summary statistics.
      *   *Why Summary Stats?* 18 numbers is too much to process. Knowing the "Public Count" (derived from the median of Cycle 1) is sufficient for them to update.
      *   *Correction:* For Aumann, they need to know *that* everyone knows.
      *   *Fix:* **The "Consensus Check".**
      *   Cycle 1: Everyone announces.
      *   Cycle 2: "If your number is different from the Median on the board, you must recalculate."
      *   *Actually, keep it pure:* Just Flash -> Record -> Flash -> Record.
      *   **Common Knowledge Mechanism:** The Board is public. The fact that the Board is public is public. This approximates Common Knowledge of the *distribution* of opinions.

  ---

  ### 5. Timeline (75 Minutes)

  *   **00-10: Setup.** Explain Urns, Chips, and Payoff. Hand out Round 1 Slips. **Do not mention Aumann.**
  *   **10-25: Round 1 (Convergence).**
      *   Flash 1 (Private Info only). Record Median/Range.
      *   Flash 2 (Update on Flash 1). Record.
      *   Flash 3 (Update on Flash 2). Record.
      *   *Goal:* Range should collapse to 0 or near 0.
      *   Distribute Candy for agreement.
  *   **25-30: Reset.** Collect slips. Shuffle room (swap seats). Hand out Round 2 Slips.
  *   **30-55: Round 2 (The Stall).**
      *   Flash 1. (Expect split: ~75% vs ~25%).
      *   Flash 2. (Expect shift, but split remains).
      *   Flash 3. (Stall confirmed).
      *   Distribute Candy for accuracy (some will win, some lose).
  *   **55-75: Debrief.**
      *   Ask: "Why did Round 1 converge and Round 2 didn't?"
      *   Reveal the Slips.
      *   **The Trap:** Ask "Who violated the rules?" (No one). "Who did bad math?" (Hopefully no one).
      *   **The Point:** "You had the same public data (the Flash counts). You had the same private data structure (1 chip). But you disagreed. Why?"
      *   Reveal the "Reliable Source" text difference.
      *   **The Kicker:** "Could you have told, from the Flash numbers alone, that this was the cause? No. You needed the slips. In the real world, you don't get to see the slips. This is why disagreement persists."

  ---

  ### 6. Predicted Failure Modes & Fixes

  **1. The Arithmetic Bottleneck**
  *   *Risk:* Students freeze trying to update "Median 60% + My Red Chip = ?"
  *   *Fix:* **The Wall Chart.** Put a giant table on the board.
      *   Rows: "Your Prior" (50%, 75%, 25%).
      *   Columns: "Net Public Chips" (e.g., +6 Red, +2 Red, -4 Red).
      *   Cells: The Answer.
      *   *Instruction:* "Find your Prior on the left. Count the Net Reds from the Board. Read your new number."
      *   This removes math errors and isolates the epistemic variable.

  **2. The Steamroller (Confident Student)**
  *   *Risk:* One student says "I know it's Alpha, I saw Red!" and influences others to ignore their own slips.
  *   *Fix:* **Strict Silence.** "If you speak, you are disqualified from candy." Enforce this ruthlessly. The Flash Cards must be silent.

  **3. The "Focal Point" Effect**
  *   *Risk:* In Round 2, they might just agree on 50% because it's a "nice number," masking the disagreement.
  *   *Fix:* **Payoff for Accuracy.** In Round 2, reward being close to the *Truth* (which you know), not the *Median*. If they converge on 50% but the truth is 90%, they get no candy. This forces them to trust their priors.

  ---

  ### 7. What This Game Cannot Reproduce (The "Hand-Hold")

  You must supply these points by hand in the debrief, as the game mechanics cannot simulate them:

  1.  **Infinite Iteration:** Aumann's theorem assumes common knowledge is reached after *infinite* iterations (or enough to exhaust the partition). You only have 3 cycles.
      *   *Say:* "We stopped at 3 cycles. In theory, if we went forever, would they converge? No, because the Prior break is structural, not informational."
  2.  **Bayesian Rationality:** The theorem assumes agents are perfect Bayesian updaters. Your students are using a Lookup Table.
      *   *Say:* "We forced you to be Bayesians with the Wall Chart. In the real world, people aren't even rational updaters, which makes disagreement even stickier."
  3.  **Common Knowledge of Rationality:** The theorem requires I know that you know that I am rational.
      *   *Say:* "In Round 2, did you think the other group was stupid? Or just different? Aumann assumes we know everyone is rational. If you think they are irrational, you ignore their numbers. That's a third reason disagreement persists."

  ### 8. Materials Checklist
  1.  **18 Laminated Cards** (for Flash announcements, dry-erase markers).
  2.  **18 Round 1 Slips** (50% Prior, Signal Red/Blue).
  3.  **18 Round 2 Slips** (9x "Alpha Likely" Prior, 9x "Beta Likely" Prior, Signal Red/Blue).
  4.  **The Wall Chart** (Prior x Net Signal -> Posterior).
  5.  **Candy.**
  6.  **Whiteboard** (to track Median/Range per cycle).

  This design respects the time limit, isolates the variables, and validates your hunch about the ambiguity of disagreement sources while keeping the math accessible for non-specialists.
