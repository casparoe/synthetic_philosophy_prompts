prompt: |-
  You're a philosopher of decision theory who has also sat on a hospital ethics committee — take on that role, and sketch a few brainstorming notes to yourself before you settle on an answer.

  Here's the practice I'm chewing on. Guideline bodies and low-value-care campaigns tell clinicians not to order a test unless the result would change management: no imaging for uncomplicated low back pain, no routine annual chest x-ray, no pre-op ECG on a healthy 30-year-old. The stated worry usually isn't the cost or the radiation, it's the cascade — a false positive leads to a biopsy, the biopsy to complications, an incidental finding to years of surveillance. But the same profession insists patients have a right to their whole chart, pushes open notes, and treats withholding results as a paradigm autonomy violation.

  So what theory of the value of information does the first norm presuppose? There's a result I think is due to Good saying a free piece of evidence can't lower your expected utility as long as you act optimally on it — is the testing norm a rejection of that, or actually an application of it (value zero rather than negative), and which reading does the cascade reasoning really support? What does it quietly rule out — knowing as good in itself, a right not to know, distrust of laypeople's updating? Is the clash with open notes real or only apparent, and where is the practice underdetermined, i.e. which rival theories would license it just as well? End with what would have to change if we took seriously the idea that information has non-instrumental value.

  Please separate what's settled here from what's genuinely contested among people who work on this — dont hand me a contested view dressed up as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of decision theory + Hospital Ethics Committee member. (Tone: analytical, pragmatic, ethically sensitive, nuanced).
      *   **Task:** Sketch brainstorming notes before settling on an answer.
      *   **Core Problem:** The tension between "Choosing Wisely" norms (don't test if it won't change management) and Patient Autonomy/Open Notes norms (patients have a right to all info).
      *   **Specific Questions to Address:**
          *   What theory of Value of Information (VoI) does the testing norm presuppose?
          *   Is it a rejection of Good's Theorem (free evidence can't lower expected utility) or an application (VoI = 0)?
          *   What does it rule out (intrinsic value of knowing, right not to know, distrust of updating)?
          *   Is the clash with Open Notes real or apparent?
          *   Where is the practice underdetermined (which rival theories license it)?
          *   What changes if information has non-instrumental value?
      *   **Constraint:** Distinguish settled matters from genuinely contested ones. Do not present contested views as consensus.
      *   **Format:** Brainstorming notes to self (informal but rigorous structure).

  2.  **Deconstruct the Core Conflict:**
      *   *Norm A (Stewardship/Non-maleficence):* Don't test if $P(\text{change management} | \text{test}) \approx 0$. Rationale: Harm from cascades > Benefit of knowledge.
      *   *Norm B (Autonomy/Transparency):* Patient owns data. Withholding is paternalistic.
      *   *Tension:* If I don't order the test, the patient can't have the data. If I order it "just to know," I violate Norm A. If I order it and hide it, I violate Norm B.

  3.  **Analyze Value of Information (VoI) Theory:**
      *   *Good's Theorem (1967):* For a rational agent maximizing expected utility, the expected value of free evidence is non-negative. $E[U(\text{act with info})] \geq E[U(\text{act without info})]$.
      *   *The Medical Norm:* "Don't test if it won't change management." This implies $VoI = 0$.
      *   *The Cascade Argument:* This implies $VoI < 0$.
      *   *Reconciliation:* Good's theorem assumes *costless* evidence and *optimal* updating/acting. Medical testing is *costly* (risk, money, anxiety) and human updating is *bounded/suboptimal* (panic, over-treatment).
      *   *Conclusion:* The norm isn't rejecting Good; it's acknowledging that $Cost(Test) > Expected Benefit$. The "cascade" is essentially a negative payoff in the utility function.

  4.  **Analyze the Autonomy/Open Notes Clash:**
      *   *Open Notes:* Assumes info is empowering.
      *   *Testing Norm:* Assumes info can be harmful (via cascade).
      *   *Is it a real clash?* Yes, if "Autonomy" includes "Right to demand potentially harmful info." No, if "Autonomy" is bounded by "Non-maleficence."
      *   *Underdetermination:* You could justify the testing norm via Utilitarianism (harm reduction) or Paternalism (doctor knows best) or Procedural Justice (resource allocation).

  5.  **Drafting the Notes (Iterative Process):**

      *   *Header:* Needs to feel like internal memos. Date, Context.
      *   *Section 1: The VoI Math.* Tackle Good's Theorem first. It's the technical anchor.
          *   *Point:* Good assumes costless info. Tests aren't costless.
          *   *Point:* Good assumes optimal action. Clinicians/Patients aren't always optimal (cascade = suboptimal action chain).
          *   *Verdict:* Norm is consistent with Good *if* we model cascades as negative utility costs.
      *   *Section 2: What's Being Ruled Out?*
          *   *Intrinsic Value:* The norm treats info as purely instrumental. If info had intrinsic value (curiosity, closure), VoI might be > 0 even if management doesn't change. The norm rejects this.
          *   *Right Not to Know:* Paradoxically, the norm protects this, but Open Notes threatens it.
          *   *Updating:* It assumes patients/clinicians *will* update irrationally (over-react to false positives).
      *   *Section 3: The Autonomy Clash.*
          *   *Settled:* Autonomy isn't absolute.
          *   *Contested:* Does autonomy include the right to *generate* low-value data?
          *   *Open Notes:* This is about *access* to existing records. The testing norm is about *creation* of records. They operate at different stages. But they meet at the point of ordering.
      *   *Section 4: Non-Instrumental Value.*
          *   If knowing is good in itself (epistemic utility), the "change management" threshold is too high. We'd need a "change peace of mind" threshold.
      *   *Section 5: Settled vs. Contested.*
          *   *Settled:* Good's theorem requires costless info. Cascades represent negative utility.
          *   *Contested:* Whether patients can validly consent to low-value tests (libertarian view vs. stewardship view). The definition of "management" (does reassurance count?).

  6.  **Refining the Tone:**
      *   Needs to sound like a philosopher *thinking*, not just lecturing. Use phrases like "Check this," "Tension here," "Committee precedent."
      *   Ensure the distinction between *instrumental* and *intrinsic* value of information is clear.
      *   Make sure the "Settled vs. Contested" section is explicit, as requested.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I address the "right to the chart" vs. "don't create the chart" distinction clearly?
      *   *Fix:* Make sure to distinguish between *access* (Open Notes) and *generation* (Ordering). The conflict arises because patients might demand generation to secure access.
      *   *Critique:* Did I handle Good's Theorem accurately?
      *   *Fix:* Emphasize that Good's theorem holds for *expected* utility of a *rational* agent. The cascade argument is essentially saying the *realized* utility is negative due to systemic irrationality or physical harm.
      *   *Critique:* Am I presenting the "Stewardship" view as the only valid one?
      *   *Fix:* Acknowledge the "Consumerist" counter-view in the contested section.

  8.  **Final Polish:** Check against all constraints.
      *   Role assumed? Yes.
      *   Brainstorming notes format? Yes.
      *   All specific questions answered? Yes.
      *   Settled vs. Contested distinguished? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  **MEMORANDUM**
  **TO:** Self
  **FROM:** Ethics Committee / Decision Theory Desk
  **SUBJECT:** VoI, Cascades, and the "Right to Know" Tension
  **DATE:** Oct 24

  *Pre-meeting brain dump. Need to untangle the normative assumptions before the committee votes on the new imaging protocol.*

  ### 1. The Value of Information (VoI) Math
  *The core technical question: Is "Choosing Wisely" anti-rational?*

  *   **Good's Theorem (1967):** I.J. Good proved that for a rational agent maximizing expected utility, the expected value of *free* evidence is non-negative. $E[U|info] \geq E[U|no\_info]$.
  *   **The Medical Norm:** "Don't test if it won't change management." This implies $VoI \approx 0$.
  *   **The Cascade Argument:** "Testing leads to false positives $\rightarrow$ biopsy $\rightarrow$ harm." This implies $VoI < 0$.
  *   **Reconciliation:**
      *   *Cost:* Good's theorem assumes *costless* evidence. Medical tests have physical cost (radiation, invasion) and financial cost. If $Cost(Test) > ExpectedBenefit(Info)$, don't test. This is standard decision theory, not a rejection of it.
      *   *Optimality:* Good assumes the agent acts *optimally* on the new information. The cascade argument presupposes **bounded rationality** or **systemic failure**. It assumes clinicians/patients *cannot* ignore a positive result even if the pre-test probability was low. It assumes the "optimal" action (ignore the false positive) is psychologically or legally impossible to execute.
      *   *Verdict:* The norm is an **application** of VoI theory, not a rejection. It treats the "cascade" as a negative payoff in the utility function. It says: *Given our known cognitive biases and liability risks, the expected utility of this specific information channel is negative.*

  ### 2. What is the Norm Quietly Ruling Out?
  *If we say "only test if management changes," what values are we suppressing?*

  *   **Intrinsic Epistemic Value:** The norm treats information as purely *instrumental*. It rules out the idea that "knowing" has value in itself (curiosity, closure, existential planning).
      *   *Example:* A patient with low back pain might value knowing "there is no tumor" even if the treatment (PT, NSAIDs) remains the same. The norm says this value is insufficient to justify the risk.
  *   **The "Right Not to Know":** Paradoxically, by not testing, we protect the patient's right not to know about incidentalomas. But...
  *   **Distrust of Updating:** The cascade rationale relies on a pessimistic view of human updating. It assumes patients/clinicians are *bad Bayesians*. We assume they will overweight a positive likelihood ratio. If we thought people were rational updaters, the cascade risk would vanish, and the norm would weaken.
  *   **Reassurance as Management:** Does "reassurance" count as "changing management"?
      *   *Strict view:* No. Management = treatment pathway.
      *   *Broad view:* Yes. Reassurance reduces anxiety, reduces follow-up visits.
      *   *Current Practice:* Ambiguous. Often, "reassurance" is dismissed as placebo, but in VoI terms, anxiety reduction *is* a utility gain.

  ### 3. The Clash with Open Notes / Patient Access
  *Is this a real contradiction or a category error?*

  *   **The Tension:**
      *   *Norm A (Stewardship):* Do not create data that harms.
      *   *Norm B (Transparency):* Do not hide data that exists.
  *   **Apparent vs. Real:**
      *   *Apparent:* Open Notes governs *access* to the EHR. Stewardship governs *generation* of EHR entries. Technically, they don't overlap. I can refuse to order the X-ray (Stewardship) without hiding results (Transparency).
      *   *Real:* The conflict emerges when patients demand the *generation* of data to exercise their *access* rights. "It's my body, I want the image." If autonomy includes the right to generate low-value data, Stewardship collapses.
  *   **Paternalism Charge:** Withholding the *option* to test is soft paternalism. Withholding the *result* of a test is hard paternalism. The profession is comfortable with the former (guideline-based) but terrified of the latter (legal liability).
  *   **Underdetermination:**
      *   *Utilitarianism:* Licenses the norm (minimize net harm from cascades).
      *   *Contractarianism:* Licenses the norm (insurance pools can't afford low-value testing).
      *   *Libertarian:* Rejects the norm (patient pays, patient risks, patient chooses).
      *   *Virtue Ethics:* Licenses the norm (prudence is a virtue; ordering unnecessary tests is intemperate).
      *   *Conclusion:* The practice is underdetermined regarding *why* we restrict testing, but overdetermined regarding *that* we restrict it.

  ### 4. If Information Has Non-Instrumental Value...
  *Hypothetical: What if "knowing" is a good in itself?*

  *   **Threshold Shift:** The threshold for ordering wouldn't be "Will this change treatment?" It would be "Will this change treatment OR provide sufficient epistemic utility to outweigh risk?"
  *   **Informed Refusal:** We would need a robust mechanism for patients to sign waivers acknowledging "This test is medically low-value, but I value the information intrinsically." Currently, insurance often won't cover this, making it a class issue.
  *   **Re-defining Harm:** If knowledge is intrinsically good, is the "anxiety of waiting" a greater harm than the "anxiety of knowing"? The cascade argument assumes ignorance is neutral. If ignorance is a negative utility state, the calculation shifts.

  ---

  ### 5. Settlement Check: What's Consensus vs. Contested?
  *Crucial for the committee presentation. Do not conflate.*

  **SETTLED (Technical/Consensus):**
  1.  **Good's Theorem Conditions:** It is settled that Good's Theorem applies only to *costless* information and *optimal* agents. Medical tests violate both conditions. Therefore, claiming a test has negative expected utility does not violate decision theory axioms.
  2.  **Cascade Existence:** It is empirically settled that diagnostic cascades occur and result in net physical harm (complications from unnecessary biopsies, etc.).
  3.  **Instrumental Dominance:** Current clinical guidelines overwhelmingly treat information as having *instrumental* value only. "Knowing for knowing's sake" is not a reimbursable indication.

  **CONTESTED (Normative/Philosophical):**
  1.  **Scope of Autonomy:** Does patient autonomy include the right to demand *medically inappropriate* interventions if risks are disclosed? (Libertarian vs. Stewardship models). *This is the live wire.*
  2.  **Definition of "Management":** Does psychological reassurance count as a "change in management"? Some guidelines say yes, most say no. This changes the VoI calculation significantly.
  3.  **Epistemic Rights:** Do patients have a moral right to data about their own biology even if it harms them? (Analogous to right to refuse life-saving blood transfusion vs. right to demand harmful surgery).
  4.  **Updating Competence:** How much should we discount patient/clinician rationality? If we assume better decision support AI, does the "no test" norm dissolve? (Some argue the norm fixes the human, not the test).

  ### 6. Actionable Takeaway for the Committee
  We need to stop framing this as "Cost Saving" or "Safety." We need to frame it as **Information Hygiene.**
  *   *Argument:* Just as we don't prescribe antibiotics for viruses (biological hygiene), we don't order scans for mechanical pain (informational hygiene).
  *   *Bridge to Open Notes:* Open Notes ensures transparency of *reasoning*, not just data. If we document *why* we didn't test (shared decision making), we satisfy autonomy without generating harmful data.
  *   *The Pivot:* Shift the "Right to Know" to a "Right to Understand Uncertainty."

  *End notes.*
