answer: |-
  You have identified the crucial pivot in Rousseau's political aesthetics. Your suspicion is correct: the *Letter to d'Alembert* is not primarily a treatise on moral contamination (the Platonic worry that we become what we behold), but a treatise on **civic opportunity cost**.

  To answer your request, I will set out the conceptual architecture of the argument from displacement, contrast it with the argument from corruption, explain its immunity to standard defenses of theater, and finally locate the *Misanthrope* complaint within this framework.

  ### I. The Conceptual Structure of the Argument from Displacement

  An argument from displacement does not claim that an institution introduces a new poison into the body politic; it claims that the institution consumes the nutrients required for the body politic to survive. It is an argument about **finite resources** and **habituated postures**.

  Conceptually, it rests on three pillars:

  1.  **The Finitude of Civic Time and Affect:**
      A citizen has a limited amount of leisure time and a limited capacity for emotional engagement. Republican liberty requires the expenditure of these resources on public business (assemblies, deliberations, festivals). Theater is a competitor for these resources. If a citizen spends three hours in a theater, those are three hours not spent in the assembly. If a citizen expends pity on a fictional queen, that is emotional energy not available for a real neighbor.
  2.  **The Habituation of Passivity:**
      This is the deeper structural claim. Citizenship is an *active* posture (speaking, voting, judging, acting). Theater is a *passive* posture (sitting, watching, feeling). Rousseau argues that virtues are not just mental states but habits of action. By habituating citizens to sit in the dark and be moved without acting, theater trains the muscle memory of subjection. It makes the sensation of involvement a substitute for the act of involvement.
  3.  **The Privatization of Community:**
      In Rousseau's ideal, community is formed through transparent, reciprocal interaction (open-air festivals where everyone sees everyone). Theater creates a one-way vector: the many look at the few (actors). This transforms the public from a body of peers into a collection of isolated consumers sharing a private experience in a dark room. It displaces *horizontal* recognition (citizen to citizen) with *vertical* admiration (spectator to star).

  ### II. Displacement vs. Corruption of Character

  To see why the displacement argument is distinct, we must distinguish the **locus of harm**.

  **The Argument from Corruption (The Standard View)**
  *   **Locus:** The internal moral psychology of the individual.
  *   **Mechanism:** Mimesis or Contagion. We see vice, we desire vice; or we feel excessive passion, we lose rational control.
  *   **Claim:** Theater changes *who you are* (your character).
  *   **Vulnerability:** It is empirically falsifiable. If one can show that audiences leave the theater no more vicious than when they entered, the argument collapses.

  **The Argument from Displacement (The Rousseauian View)**
  *   **Locus:** The external social structure and the economy of time.
  *   **Mechanism:** Opportunity Cost and Habituation of Posture.
  *   **Claim:** Theater changes *what you do* (and consequently, what the polity can be).
  *   **Immunity:** It is **immune to the standard reply** that "audiences are not made worse by what they watch."

  **Why the Immunity Holds:**
  The standard defense of theater (offered by d'Alembert and later by many liberals) is: *"We know it is fiction; we do not imitate the crimes we see; we are not corrupted."*

  Rousseau's displacement argument accepts this premise and rejects the conclusion. He effectively says: *"Granted, you do not become a murderer. But you have become a spectator."*

  The harm is not that the theater makes you bad; the harm is that it prevents you from being good *in the civic sense*. Even if the play depicts perfect virtue, the act of watching it is a dereliction of civic duty. If you spend your evening applauding a fictional act of justice, you have displaced the possibility of performing a real act of justice. The displacement argument bypasses the content of the play entirely. The harm lies in the **medium**, not the **message**. It renders the standard reply irrelevant because the reply addresses the *content* (corruption), while the objection addresses the *context* (displacement).

  ### III. The Case of the *Misanthrope*: A Third Category?

  You ask where the complaint about Molière's *The Misanthrope* fits. Rousseau argues that Alceste (the honest, rigid moralist) is ridiculed, while Philinte (the accommodating, worldly compromiser) is applauded.

  This is **not** an argument from displacement. It is an argument about content.
  However, it is also not the standard argument from corruption (simple imitation of vice). It is more precise to call it an argument from the **Corruption of Moral Judgment** (or the Calibration of Sentiment).

  Here is the distinction:
  *   **Standard Corruption:** "The play shows a thief, so I might steal."
  *   **Rousseau's *Misanthrope* Objection:** "The play shows a virtuous man being laughed at, so I will learn to laugh at virtue."

  This belongs to a specific category of corruption: **The Social Sanctioning of Vice.**

  Rousseau's insight is that comedy functions as a court of public opinion. Laughter is a social punishment; applause is a social reward. In *The Misanthrope*, Molière uses the mechanism of comedy to teach the audience that uncompromising honesty (Alceste) is antisocial and ridiculous, while polite compromise (Philinte) is virtuous and agreeable.

  **Why this is distinct from Displacement:**
  This objection admits that theater *does* reshape morals (contradicting the "mirror" theory slightly, or rather refining it). It argues that theater actively *trains* the audience's capacity for moral discrimination. It teaches them to misidentify virtue.

  **How it relates to your "Mirror" Insight:**
  You noted Rousseau's view that theater "mirrors and intensifies the morals a city already has." The *Misanthrope* complaint bridges the gap between mirroring and corruption.
  *   In a corrupt society (like Paris), Alceste *is* ridiculous because he does not fit the social norms.
  *   The theater mirrors this by ridiculing him.
  *   But by ridiculing him on stage, it *reinforces* the corruption, making it harder for civic virtue to take root.

  So, the *Misanthrope* argument is a **Corruption of Judgment** argument. It complements the Displacement argument.
  1.  **Displacement** says: "Theater stops you from acting like a citizen."
  2.  **Misanthrope/Corruption** says: "Theater teaches you to despise the kind of person who *would* act like a citizen."

  ### IV. Synthesis: The Two-Pronged Attack

  To pin down the kind of objection Rousseau is making, you should view it as a pincer movement against the possibility of republican virtue.

  1.  **The Structural Prong (Displacement):** Even if the theater were morally neutral, it would be politically fatal because it privatizes leisure and habituates passivity. It steals the *time* and *posture* required for freedom. (Immune to "it doesn't corrupt us" defenses).
  2.  **The Ideological Prong (Misanthrope/Judgment):** Because the theater is never morally neutral, it actively calibrates our moral sentiments to fit the *status quo*. It uses laughter to punish the rigidity required for virtue and rewards the flexibility required for social vice.

  Your group's difficulty in pinning down the objection stems from the fact that Rousseau is shifting the ground from **Ethics** (is this play good or bad?) to **Political Economy** (what is the cost of this institution to the general will?).

  If you must categorize the *Letter* as a whole, it is an **Institutional Critique** based on **Civic Opportunity Cost**. The *Misanthrope* analysis is a subsidiary **Moral-Pedagogical Critique** that shows how the content of the theater specifically targets the virtues necessary to overcome the structural harms of displacement.

  The displacement argument is the stronger, more novel philosophical claim. It asserts that in a republic, **spectatorship is itself a vice**, regardless of what is on the screen.
