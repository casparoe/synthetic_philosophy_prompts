  **2. Point-by-Point Assessment**
  *The following breakdown identifies specific passages, evaluates their accuracy based on the prompt's constraints, and categorizes errors for your record.*

  *   **Passage:** "For each rung above the lowest, state what capacity it adds to the rung below..." (Prompt) vs. "Once a lineage has become Popperian it is no longer properly described as Darwinian or Skinnerian..." (Student, Para 2).
