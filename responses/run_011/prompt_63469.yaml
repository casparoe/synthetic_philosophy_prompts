prompt: |-
  ok so I'm a third-year design student (HCI-ish track, I basically live in Figma and I've spent the last two years building component libraries and arguing about chart encoding), and this semester I'm in a visual culture seminar where we did a couple weeks on Otto Neurath and the Isotype picture-language thing — the Vienna museum, the standardized figure symbols for social statistics, all of it. I read the material but honestly half of it goes in one ear and out the other because I don't think in the vocabulary it's written in. I think in tokens, primitives, variants, design systems, charts, a11y, localization, plain-language content, research ops.

  So here's what I want. Take Neurath's actual *claims* about picture language — not just a history of the pretty pictures — and restate them as faithfully as you can in my vocabulary. Things like: the idea that the symbols should work like a language with rules rather than being a set of nice illustrations; his distinction between showing how many of something there are versus showing how things connect to each other; his insistence that you always have to simplify the picture and that the simplification is a loss you choose deliberately; the rule that the symbol stays the same and only the count changes; the bit about the transformer being the person who turns expert knowledge into pictures; the thing about who the audience is and what they're supposed to be able to do afterwards; and his general hostility to both artiness and to mathematical formalism in this stuff. I want each of those rendered as something I'd actually say in a design crit, no dumbing down and no vague hand-waving.

  Then the part I actually care about: the residue report. Split it three ways — what translates cleanly, what only translates if you distort it, and what has no counterpart at all in design-system/UX language. And for every item in the last two piles, tell me which side the failure is on. Is my vocabulary missing a concept that Neurath had and that my field has genuinely lost, or was his formulation fuzzy and the untranslatable bit is just a bit of his theory that was never doing any work in the first place? Don't be diplomatic about it, just pick a side per item and say why.

  Two ground rules, please. First, don't smuggle my framework's assumptions in and call it translation — if you end up describing him as basically doing user research and iterating on a design system, that's you converting him, and I want to know exactly where you had to do that. Second, no bibliography, no reading list, no citations, I can't check any of it anyway. Describe his positions in your own words, and if you're not sure whether something is actually his view versus a thing people say about him later, flag it as unsure instead of asserting it.

  Last thing, and this is the bit that'll decide whether the whole exercise was worth it: run it backwards. Given the translation you just did, what would Neurath object to about how a modern design system actually works in practice — the real stuff, the quarterly refreshes, the KPI dashboards, the icon sets shipped with component libraries, the accessibility checkboxes? Give me two or three objections that I think land, and then tell me which one I'd have to concede on and which one I could actually answer.
