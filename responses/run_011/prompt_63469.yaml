      *   *Vocabulary:* Ensure I use "tokens," "primitives," "variants," "a11y," "localization" correctly in the translation.

  9.  **Final Polish:** Check tone. Ensure the "Residue Report" is sharp. Ensure the "Reverse Critique" lands the "Concede/Answer" distinction clearly.

