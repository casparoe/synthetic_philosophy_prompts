  **MEMORANDUM**

  **TO:** Institute Leadership and Compute-Allocation Panel
  **FROM:** Staff Engineer, Allocation Panel
  **DATE:** October 24, 2023
  **SUBJECT:** Spring Round Allocation Decision and Procedural Recommendations

  ### Executive Summary

  This memo communicates the Panel's funding decisions for the Spring compute-allocation round and proposes critical updates to our governing rulebook. Due to a logical contradiction in the current voting data, we cannot satisfy the existing rulebook clause requiring that "no funded proposal be judged worse overall than some unfunded one." 

  To meet the nine-day deadline, the Panel recommends funding **Proposal A** and **Proposal B**. This decision relies on our weighted rubric scores to break a three-way preference cycle. Simultaneously, we recommend retiring the current "no worse than" clause in favor of a "Ranked Order" standard. This change acknowledges that human judgment is not always mathematically transitive, but our allocation process must be.

  ### 1. Spring Round Decision

  **Funded:** Proposal A, Proposal B
  **Unfunded:** Proposal C

  **Grounds for Decision:**
  The Panel encountered a "preference cycle" among the top three proposals (A, B, and C). In pairwise comparisons, the majority of the Panel prefers A over B, B over C, and—contradictorily—C over A. This creates a logical loop where no single proposal is definitively superior to all others.

  We have two allocation slots. Under the current rulebook, we are forbidden from funding any proposal if an unfunded one is judged "better." Because of the cycle, every possible combination of two proposals violates this rule (e.g., if we fund A and B, Proposal C is unfunded but judged "better" than A).

  Since the rule cannot be satisfied, we must prioritize a method that produces a result. We default to the **Weighted Rubric Score**, which ranks the proposals A, then B, then C. While we acknowledge this score is fragile (a 1% weight adjustment could swap B and C), it is the only metric that provides a linear ordering. Funding A and B respects the rubric's top two ranks and aligns with two of the three pairwise preferences (A>B and B>C). This minimizes the number of violated preferences compared to any other combination.

  ### 2. Philosophical Grounding: Transitivity and Judgment

  The Panel requests clarity on whether "better than" must be transitive (i.e., if A>B and B>C, must A>C?) for a body like ours.

  **Operational Transitivity is Required.**
  In human judgment, "better than" is often intransitive. As noted in our deliberations, we observed a chain of twelve proposals where each step was a difference "not worth acting on," yet the first proposal was ranked well above the last. This is an accumulation of negligible differences (a Sorites Paradox). While psychologically valid, this is operationally fatal for allocation. If we allow intransitivity in our final rules, we cannot generate a ranked list. Without a ranked list, we cannot allocate scarce resources without arbitrariness.

  Therefore, while Panel members may hold intransitive views during discussion, the **process must enforce transitive closure**. We must treat the final vote as creating a linear hierarchy, even if that hierarchy smooths over minor logical inconsistencies in individual judgment.

  ### 3. Proposed Standing Rule Change

  We propose replacing the problematic clause with the following:

  > **Current Clause:** "No funded proposal may be judged worse overall than some unfunded one."
  >
  > **Proposed Clause:** "Funding shall be awarded to the top-ranked proposals on the Final Adopted Ranking. The Panel shall generate a Final Adopted Ranking using a method that ensures transitive ordering. Once adopted, no proposal ranked higher may remain unfunded while a lower-ranked proposal is funded."

  **Rationale:**
  The current clause assumes an objective "better than" exists independent of the voting method. The Spring round proved this false; "better than" is a product of the aggregation method. The new clause shifts the constraint from an abstract truth to a procedural one. It mandates that we fix our ranking method (e.g., rubric scores or ranked-choice voting) to force a linear list, and then strictly follow that list. This repairs the process by acknowledging that the "sin" is not in having cyclic preferences, but in failing to resolve them before funding.

  ### 4. Counter-Argument and Rebuttal

  **The Strongest Case Against This Recommendation:**
  Critics will argue that enforcing transitivity on intransitive preferences creates a "Money Pump" vulnerability. If the Panel's true preferences are cyclic (A>B, B>C, C>A), but we force a linear ranking (A>B>C) to satisfy the new rule, we risk logical instability. 

  Specifically, if we ignore the cycle and fund A and B based on the rubric, we invite a challenge where a proponent of C argues that the allocation is invalid because C>A. If we accept that challenge in a future round, we might shift funding to C and A. In a multi-round environment, this could allow a coalition to cycle resources indefinitely (approving A over B, then B over C, then C over A), effectively validating conflicting priorities or approving the same resource capacity twice under different justifications. By suppressing the cycle rather than resolving it, we mask instability that could lead to double-allocation or contradictory strategic mandates.

  **Rebuttal:**
  This risk is real for dynamic markets, but not for a static committee allocation. A "Money Pump" requires an agent to make sequential trades that deplete their resources. The Panel does not trade; it allocates once per round. 

  To prevent the risk of cycling resources across rounds, the **Proposed Clause** includes a requirement for a "Final Adopted Ranking." This creates a binding precedent. Once the Panel votes to establish A>B>C for the Spring round, that ordering stands for the duration of the allocation cycle. We do not revisit pairwise comparisons between funded and unfunded projects after the list is certified. 

  Furthermore, the alternative—admitting intransitivity—is worse. If we acknowledge C>A while funding A, we paralyze the administration. We cannot issue compute credits based on a contradiction. It is preferable to impose a consistent, if imperfect, linear order (via the rubric) than to admit that the allocation is logically invalid. We mitigate the "double approval" risk not by satisfying the impossible "no worse than" clause, but by strictly binding future rounds to the same ranking methodology, ensuring that any shift in funding reflects a change in proposal quality, not a shift in logical geometry.

  ### 5. Next Steps

  1.  **Immediate:** Approve funding for Proposals A and B based on the rubric ranking.
  2.  **Within 30 Days:** Convene a working group to select a voting method that minimizes cyclic outcomes (e.g., Ranked Choice Voting) to replace the current weighted rubric.
  3.  **Next Round:** Implement the "Final Adopted Ranking" clause to replace the current "no worse than" requirement.

  We recommend immediate approval to ensure compute resources are provisioned before the semester begins.
