answer: |-
  - **What the rule is**
  You are mostly right, but the example (*udāharaṇa*) is more than a sightseeing trip. It is the statement of the universal relation (*vyāpti*) backed by a known instance. The five steps are: proposition, reason, example, application, conclusion. The example says, "Wherever there is smoke, there is fire, as in the kitchen." It does not merely point to the kitchen; it asserts the invariable concomitance observed there. This distinguishes Nyāya from formal logic where validity depends on structure alone. Here, validity depends on the material truth of the connection. The rule commits you to stating the rule itself, not just applying it. It forces the arguer to expose the general law they are relying on, grounded in a specific observation, before applying it to the disputed case. It prevents hidden premises. Often, a counter-example is also required: "Where there is no fire, there is no smoke, as in a lake." This double-check ensures the connection isn't accidental. The example is the bridge between raw perception and universal claim, demanding that every general law be anchored in at least one concrete sighting.

  - **What it can't do without**
  This practice collapses without a robust realism. First, it assumes the world is structured by real connections, not just mental habits. If "smoke" and "fire" are only linked by language or custom, the example proves nothing about the hill. The relation (*vyāpti*) must be objective, waiting to be found, not imposed by the mind. Second, it requires the uniformity of nature. What holds in the kitchen must hold on the hill; the universe cannot be locally inconsistent. Third, it assumes perception is fundamentally reliable. If your senses deceive you about the kitchen fire, the whole chain rots. You cannot build inference on doubt. Fourth, it rejects purely conceptual existence. You cannot infer a thing exists simply because the concept implies it (like an ontological argument). Existence requires a causal or observational track record. Finally, it assumes categories are real. "Fire" must be a natural kind, not a convenient label. If categories are fluid, the universal relation dissolves.

  Furthermore, the rule about hunting for hidden conditions (*upādhi*) reveals a commitment to causal complexity. It assumes connections aren't simple; they might depend on wet fuel, for instance. This means the world is law-governed but complex. The logic cannot survive in a universe of miracles where causes fail without reason, nor in a purely idealist world where objects are mind-dependent. It demands a public world. The example must be publicly checkable. If only you saw the kitchen fire, the argument fails. This intersubjectivity is crucial. The logic is social; it requires a shared reality where witnesses can verify the example. Without a shared, stable, causal reality, the five steps are just a ritual dance with no traction on the truth. It rules out coherentism; you can't justify a belief just because it fits a web of other beliefs. It rules out pure rationalism; you can't think things into existence. It rules out skepticism about induction; you must trust that the past predicts the future. The example is the anchor; without a real sea to hold it, the ship drifts.

  - **What it merely sits well with**
  This realism fits comfortably with theism, but doesn't demand it. Nyāya philosophers used this logic to prove God, but the logic itself is neutral; it works equally for proving atoms or disease. It sits well with common sense, but doesn't require naive realism; you can believe in unseen entities as long as they leave visible traces. It is compatible with a view that language maps onto reality, but doesn't strictly require a specific theory of meaning, provided words refer to stable categories. It allows for testimony as a source of knowledge, but the logic of inference doesn't depend on it; you could theoretically derive everything from perception and inference alone if you had enough time. It fits with a view that humans are rational agents capable of spotting patterns, but doesn't require innate ideas; the universal is learned from instances. It is compatible with a pluralistic ontology (many substances) but also works with a simpler one. Essentially, it requires a world that is knowable, but doesn't dictate exactly what populates that world, provided the populations interact consistently. It is a method for navigating reality, not a map of reality itself.

  However, it does sit well with a conservative epistemology. It values established knowledge. The example should ideally be uncontroversial. This fits a society that values tradition, but the logic itself is critical; it demands the tradition be checkable. It accommodates the idea that some truths are hidden (*parokṣa*) but accessible through signs. It doesn't require that everything be immediately visible, only that the *link* to the visible be secure. This allows for scientific realism about unobservables without demanding direct perception of them. It is flexible enough to handle medical diagnosis (inferring disease from symptoms) just as well as metaphysical proof. The practice is a tool kit that fits many metaphysical hands, provided those hands agree on the solidity of the handle.

  - **The missing witness**
  When the target is unobservable (God, Self, Atoms), the form stretches but holds. Nyāya calls this *sāmānyato dṛṣṭa* (inference from general observation). You cannot show a kitchen with God and fire. Instead, you use an analogy from a different domain. "The world is an effect, like a pot. Pots have makers. Therefore, the world has a maker." The example (pot) does not contain the conclusion (God); it contains the *relation* (effect implies maker). The witness requirement shifts from witnessing the specific connection to witnessing the *type* of connection. Does the form break? No, but the burden of proof shifts. The opponent will attack the analogy: "The world is not like a pot." The debate moves from verifying the example to verifying the similarity of relations. This reveals the example was never just a witness; it was a warrant. It guarantees the reason is valid. If you can't produce a direct instance, you must produce a parallel instance. The practice doesn't cheat; it acknowledges the stretch. It admits you are moving from the seen to the unseen via a bridge of similarity. The strain is visible. The debater must defend the relevance of the example more fiercely than the conclusion. If the example is weak, the inference collapses. This shows the example is doing the heavy lifting of justification, not just formal validity. It forces the metaphysician to ground speculation in common experience.

  However, this opens a vulnerability. If the example is merely analogical, how do you know the universal holds? You rely on a higher-order uniformity: that causality works the same for worlds as for pots. This is a bigger assumption than the kitchen fire. The "hidden condition" check becomes harder. What hidden condition breaks the link between "effect" and "maker" for the universe but not for pots? Perhaps some effects are spontaneous. The debater must rule this out. The form absorbs the strain by making the *udāharaṇa* a site of contestation. It doesn't hide the leap; it highlights it. The character isn't proving God exists directly; she is proving that *if* you accept the pot analogy, you must accept the God conclusion. The logic remains intact, but the certainty is diluted. The example becomes a metaphor that demands literal treatment. This is where the drama lives: in the fight over whether the metaphor holds water.

  - **The other side of the table**
  The rival: Buddhist logicians (Dignāga/Dharmakīrti). They accept Perception and Inference, but reject Testimony as independent (subsuming it under inference). They reduce the five steps to three: Proposition, Reason, Example. They drop Application and Conclusion as rhetorical repetition. For them, the example isn't a separate step but part of establishing the universal. They are also nominalists; they doubt the real existence of universals. For them, the universal is a mental exclusion, not a real tie. In the scene, this opponent would say: "You don't need five steps. State your reason and the universal. The rest is noise." They would challenge the reality of the connection in the example. "Fire and smoke are distinct events; your 'universal' is a construction." This changes the moves from a ritual unfolding to a sharp focus on the reason itself. The Nyāya debater insists on the full form to ensure clarity and public checkability. The Buddhist wants efficiency and ontological parsimony. The Nyāya character must insist on the full five steps to force the opponent to accept the reality of the universal relation. The Buddhist tries to collapse the relation into a mental habit. The debate becomes about whether logic mirrors reality or organizes it.

  Furthermore, because the rival rejects independent testimony, they cannot appeal to scripture. If your Nyāya character tries to quote a Vedic text, the Buddhist says, "That is just words; infer it or perceive it." This forces your character to rely entirely on the logical form, not authority. The rival's reduction of steps makes the argument faster, more aggressive. The Nyāya form is deliberate, pedagogical. The rival's form is analytical. In the scene, the Buddhist opponent might interrupt the "Application" step, saying, "You've already said that." The Nyāya character must reply, "Repetition ensures the mind grasps the connection." The structural difference reflects a deeper split: one side sees logic as a tool for teaching truth to others, the other as a tool for refining knowledge for oneself.

  - **For the scene**
  Concrete advice. She can't show God. She must show a pot. She says, "Look at this pot. It was made. The world is like this pot." The opponent says, "The world is not a pot." She must argue the similarity of "being an effect." She must not claim the example proves God directly, but that it proves the *rule* that effects need makers. She must invite the audience to check the pot. She must make the example undeniable so the rule feels undeniable. The tension is in the gap between pot and world. She must bridge it with words.

  Have her physically hold the example. Let the opponent knock it over. The example must be tangible. When she moves to the unobservable, she must point back to the tangible object. "You agree this pot needed hands. Why does the world not?" Her struggle isn't proving God exists yet; it's proving the pot and the world share a nature. If she loses the example, she loses the God. The drama is in the defense of the analogy, not the conclusion. Make her sweat over the kitchen, not the hill.
