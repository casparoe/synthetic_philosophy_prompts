prompt: |-
  Next Tuesday I have the 9am discussion section on decision theory — about twenty first-years, mostly econ and poli-sci, not one philosophy major in the room — and I've already made the mistake of running Ellsberg's urn on them as a clicker survey last week. So they've all now seen their own choices printed out on the board, and roughly three quarters of them picked the labeled urn both times, which means they know, publicly, that they violated Savage's sure-thing principle in front of their classmates. I don't want you to explain ambiguity aversion to me, I've taught this a dozen times. What I want is a plan for how to teach it in fifty minutes with nothing but a whiteboard, given that particular starting condition.

  The thing I care most about is the order, because almost everything that goes wrong in this section goes wrong from a piece arriving too early. My own hunch is that the sure-thing principle has to land as an intuition — as something they'd defend — before it can be shown as broken, but I don't know how to do that without turning it into an axioms lecture, and if I front-load formalism I'll lose half of them. Then there's the carrier. I'm toying with ditching the urns entirely for a pair of vending machines on campus: one with the odds printed right on the glass, one that's brand new and unlabeled, and then the same two bets mirrored so they end up preferring snacks-from-the-labeled-machine and no-snacks-from-the-unlabeled-machine. I like it partly because the machine invites the "but the operator knows the mix and he's messing with me" reading, which I can then use rather than fight. Tell me whether that can actually carry the whole section or whether I should just stick to Ellsberg's own setup, and say what a carrier for this has to have and what it must not have.

  Then I need the misconception map, and I want it in the order they'll surface in the room rather than in order of importance. I fully expect: "I just assumed the unlabeled one was 50/50 so it didn't matter"; "that's not irrational, I just don't trust the second machine" (the ambiguity-aversion-is-really-prudence line); "so this proves probabilities aren't out there in the world"; and "so Bayesianism is refuted." I strongly suspect the last two are mine rather than theirs if I sequence badly — i.e. I'll plant them by reaching for metaphysics too soon — and I'd like to know where exactly to cut each one off. I also want to squeeze in that comparative-ignorance result (Fox and Tversky, mid-nineties, I'm fairly sure) — the one where the effect largely evaporates if you get people to price the bets seperately instead of side by side — because it's the single best thing for making them suspicious of their own survey answers. Tell me where it goes, or tell me it's too much for first-years and I should drop it.

  Format: exactly five numbered items, two or three sentences each, no introduction and no conclusion. The five items should be the five moves of the section, in the order I'd deliver them, with the misconception-handling built into the move that pre-empts it. Let the fifth item carry both the one question I can ask at the end to find out whether the idea actually landed, and the one or two things I should openly announce I'm leaving out — I have no intention of going near Choquet expected utility, dynamic consistency, or Machina-style counterexamples with this crowd.
