answer: |-
  1. Start by reconstructing their survey choices on the board as two separate decisions sharing a common unknown outcome, then ask them to justify why swapping that common outcome shouldn't change their preference. This forces them to articulate the Sure-Thing Principle as a consistency rule before you label it as violated.

  2. Stick with the vending machine carrier you proposed, because the "adversarial operator" intuition it invites is the perfect hook to isolate ambiguity aversion from simple risk aversion. Use the glass transparency to distinguish known probabilities from unknown composition, but explicitly stipulate that the operator has no incentive to manipulate payouts to prevent the "trust" objection from hijacking the logic.

  3. When students claim they assumed a 50/50 split or were merely acting prudently against a potentially adversarial operator, intervene immediately by reminding them that whatever probability they assign to the unknown, it must remain constant across both decisions. Clarify that the violation lies in preferring the known distribution twice, which cannot be explained by any single probability assignment, rather than in distrusting the unknown source itself.

  4. Introduce the Fox and Tversky result now by asking how many would have chosen differently if they had evaluated the two vending machines in isolation rather than side-by-side. Use this to demonstrate that their violation stems from comparative ignorance rather than a stable preference, making the irrationality feel like a cognitive bug rather than a philosophical stance.

  5. Conclude by asking whether they would pay to avoid the unlabeled machine even if it guaranteed the same expected value, which tests if they view ambiguity as a cost or a logical error. Openly announce that you are leaving out non-additive probabilities and dynamic consistency to keep the focus on the behavioral violation rather than the mathematical repair.
