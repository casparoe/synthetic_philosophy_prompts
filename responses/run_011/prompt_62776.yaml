      *   *Section 2: Taxonomy.* The "time/premeditation" reading is solid (phenomenological). The missing piece for the Lit person is the *usurpation of God*. Camus argues the state claims absolute judgment, which belongs only to God/Death. The "planning" argument is good but needs to link to *The Rebel*.
