          *   Better candidate: "The wrong is located in what the state has to turn itself into..." This is Foucault, not necessarily Camus. Camus cares about the *human* cost, not just the institutional ontology.

  5.  **Refining the Critique (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't sound like I'm writing the paper for them. Just pointing out the fault lines.
