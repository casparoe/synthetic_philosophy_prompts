  6.  **Final Polish:** Organize by the user's numbered questions for clarity. Ensure the "push" is felt. (e.g., "Here is where you will get hit," "This is your weak flank.")

      *(Self-Correction on the "Vomit" point)*: Is it an argument? Yes, Camus uses it to demonstrate the *physical reality* of death vs. the *abstract idea* of justice. I should validate that but warn against over-mechanizing it.

      *(Self-Correction on the "Sleep Execution")*: If the state kills in sleep, does it still "plan"? Yes. But does it still inflict the "agony of waiting"? No. Camus emphasizes the *agony*. The "Patch" saves the argument by shifting ground. I need to tell the user to admit that shift explicitly.

      *(Self-Correction on Mauriac)*: Don't let this become a biography section. Keep it focused on the *logic* of the exception vs. the rule.

      *(Line Level)*: Identify the sentence about "relaxed about whether they survive scrutiny." That's factually shaky. Camus fights hard on the stats.

