      *   **Secondary Thesis (The Patch):** The real wrong is the *state's* premeditation (becoming a planner of killing), not just the condemned's dread.
      *   **Key Evidence:** The father's vomiting anecdote (read as argument, not pathos).
      *   **Complications:** The "sleep execution" counter-factual; Camus's shift on the Purge (1945 vs. 1957); Modern analogues (death row/lethal injection).
      *   **Style:** Punchy, philosophical, slightly provocative.

  3.  **Address the Specific Questions (Mental Sandbox & Fact-Checking):**

