answer: |-
  Thank you for coming. Thank you for standing in this room one last time.

  I know why we are here. We are here to stop. The funding ends next month. The programme closes. I founded this work, and I am the one who has to say the final words. I want to say them clearly, because we have spent twenty-two years being precise about numbers, and we should be precise about endings.

  I want to speak first to the Director. You signed the memo that ends this. You are here in good faith, and I want to match that. The arithmetic in that memo is correct. Twenty-two years of expenditure cannot be recovered. The question was whether another year of counting would do more good than habitat work at three other sites. The answer is no. I have said this publicly, and I say it now: I am not asking you to believe this programme should have been saved. If I were in your chair, with your budget and your obligations, I would have signed the same paper. We are not going to pretend the money would have been better spent here. It would not.

  I want to speak next to the reporter. You are looking for a line about loss, or perhaps a victory. There is no victory. The dataset is deposited. In four years, it has been cited twice, and both times the findings were misread. There was one lucky catch—an invasive predator in year sixteen—but that single success does not balance the ledger. I will not use that story to justify the cost. If you need a quote for Monday, here it is: We counted when it mattered for science, and we counted when it mattered for us. Those are two different things.

  Now, I want to speak to the recorders. The volunteers. Most of you are retired. Many of you have counted the same six sites every winter since the beginning. You know the data trail is thin. You know that for the last decade, the counts likely did not change any policy, save any species, or alter any budget. By the strict logic of the memo, you spent those years wasting time.

  I know why you stayed. In the eleventh year, Moira died. Her name is on the hut. She asked you to keep going. So you did. And after a while, it stopped being about Moira, and it stopped being about the birds. It became the way you spent your Saturday. It became a practice.

  This is the hard thing I need us to understand together. The memo treats this programme as an investment. An investment is a thing you put money into to get a return. If the return stops, you close the account. That is sound business. But for many of you, this stopped being an investment years ago. It became a promise. And then it became a habit.

  There is a difference between a bad investment and a broken promise. If you promise to meet a friend for coffee every week, and then you stop going because you could spend that hour volunteering elsewhere, you have made a rational economic choice. But you have also broken something human. You kept coming to the estuary not because the data needed you, but because you needed to be the kind of person who keeps a promise. That is not a calculation error. That is not irrational. It is just a different kind of accounting than the one used to close us down.

  I know some of you feel foolish. You feel you were duped into spending your retirement counting gulls that nobody read about. You were not. You were maintaining a practice. You were holding a space. The value of that space does not appear on a balance sheet, and it does not appear in a citation index. It appears in the fact that you showed up.

  So, we are closing the account. The money is going to the habitat work. That is right. But I do not want you to feel that your time was wasted simply because it was not purchased by the future. It was purchased by the present. It was purchased by the commitment you made to each other, and to Moira.

  I am tired. I know many of you are tired. We are not going to fight this. We are going to let it go.

  Here is what I want you to do on Monday. Do not come to the estuary. Do not bring your clipboards. Do not count anything. Go to the water if you like, or stay home. But if you see a bird, do not write it down. Just let it be there. Let yourself be there. We spent twenty-two years measuring the world. For the next while, just live in it.

  Thank you.

  ***

  **Note on Omitted Consolations**

  I deliberately excluded the line "The birds will miss you," because it is factually untrue and patronizes the volunteers' intelligence. I also avoided saying "Your data will be useful someday," as that contradicts the explicit agreement that the funding is better spent elsewhere and risks false hope. Finally, I did not say "We changed hearts and minds," because there is no evidence of this, and it would invite the Director to view the speech as a covert argument against the termination.
