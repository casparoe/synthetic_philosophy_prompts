      *   *Conflict D: Four-Dimensionalism (2) vs. Indeterminate Identity (4).*
          *   4D usually treats persistence as a matter of temporal parts. Vagueness is often linguistic (which worm is picked out).
          *   (4) claims ontic vagueness.
          *   *Tension:* 4Ders often reject ontic vagueness in favor of semantic vagueness regarding which worm is "me." However, they *can* accept indeterminate identity if the temporal boundaries are fuzzy.
          *   *Verdict: Minor tension, mostly terminological.*

      *   *Conflict E: Counterpart Theory (3) vs. Indeterminate Identity (4).*
          *   CT handles modality. (4) handles diachronic identity (mostly).
