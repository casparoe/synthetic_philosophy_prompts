  CONFIDENTIAL MEDICAL REPORT
  HARBOUR AUTHORITY MEDICAL PANEL
  REF: PILOT/ASSESS/2023/049
  SUBJECT: A. VANCE
  DATE: 14 OCTOBER

  1. HISTORY OF PRESENT CONDITION
  Subject suffered left-hemisphere cerebral infarct eleven weeks prior to assessment. No motor deficit present. Speech intact. Subject reports subjective fatigue.

  The waiting room smells of wet wool and old coffee. Arthur Vance sits by the window. Outside, the estuary is a sheet of hammered铅, grey and flat. The tide is turning. He watches the water move. It moves slower than he remembers. Or perhaps he is moving faster. The light is less bright than it used to be, though the sky is clear. He feels heavy in the chair. Not tired, exactly. Just more weight than before.

  2. COGNITIVE ASSESSMENT: CATEGORICAL TASKS
  2.1 Digit Span Forward
  Subject required to repeat sequences of numbers.
  Performance: Impaired.
  Errors: Significant.
  Status: Fail.

  2.2 Token Sorting
  Subject required to sort objects by rule (colour vs. shape).
  Performance: Impaired.
  Errors: Frequent.
  Status: Fail.

  2.3 Binary Decision Task
  Subject required to identify if tones are same or different.
  Performance: Impaired.
  Accuracy: Below threshold.
  Status: Fail.

  Arthur tries to hold the numbers. They slip. One, two, three… the fourth one is gone before the fifth arrives. It is not that he forgets them. They are there, but loose. Like trying to catch water in a net. The shapes on the table are red and blue, circles and squares. He knows what they are. But the rule changes. Now sort by shape. Now by colour. The switch is too sharp. It jars. He puts a red circle with the blue squares. It feels wrong, but not entirely wrong. The tones are high and low. Same or different? He hears the sound. It vibrates in his chest. But the yes or no sticks in his throat. He says what seems near enough. The man behind the desk writes something down. The pen scratches. It sounds loud.

  3. COGNITIVE ASSESSMENT: QUANTITATIVE TASKS
  3.1 Velocity Estimation
  Subject required to estimate speed of moving object.
  Performance: Intact.
  Error Margin: Within normal limits.
  Status: Pass.

  3.2 Spatial Judgement
  Subject required to estimate distance between static points.
  Performance: Intact.
  Error Margin: Within normal limits.
  Status: Pass.

  3.3 Risk Assessment Simulation
  Subject required to judge safety of vessel approach.
  Performance: Intact.
  Verdict: Safe/Unsafe.
  Status: Pass.

  The screen shows the ship coming in. It is a container vessel, deep draft. The wind is from the north-east. Arthur watches the bow swing. He knows the weight of the water under the keel. He knows how the wind will catch the stacked boxes. The gap between the quay and the hull narrows. Ten metres. Five. Two. He waits. The water slows the ship. The engines reverse. The ship stops. Not exactly where the line says, but close. Close enough. No damage. The man behind the desk looks at the screen. He looks at Arthur. Arthur shrugs. It felt right. The numbers on the screen say one thing. The water says another. He trusts the water.

  4. AMBIGUOUS PERFORMANCE DATA
  4.1 Docking Simulation Protocol
  Task: Maintain centreline deviation below 2.5 metres.
  Observation: Subject maintained deviation at 2.7 metres average.
  Collision: Absent.
  Protocol Breach: Present.
  Scoring: Fail.

  The ship drifts. Just a little. To the starboard side. Arthur corrects. He brings it back. But the line on the screen turns red. He crossed the limit. By a hand's width. Maybe less. The ship is safe. The hull is sound. The quay is untouched. But the line is red. He looks at the man. The man looks at the paper. The paper says fail. The ship says safe. Arthur feels the vibration of the engines through the chair. It is steady. The red light blinks. It is angry. He is not. He is mostly calm. The ship is mostly centred. It is enough for the water. It is not enough for the rule.

  5. INTERVAL
  Subject returned for retesting after six weeks.
  No medical intervention recorded.
  Subject reports increased effort during tasks.

  Arthur goes home. He counts steps. One, two, three. He counts the tiles on the floor. He sorts the cutlery. Forks here. Knives there. He does it until his head aches. The numbers stay better. They stick more. But the water feels further away. When he looks at the river from his garden, it looks flat. Like a picture. Less deep. He sleeps more. He wakes up less rested. The effort of holding the numbers takes something. He feels lighter in his hands, but heavier in his head. He practises the rules. If green, go. If red, stop. He says them out loud. They sound stiff. Like someone else's voice.

  6. RE-ASSESSMENT: CATEGORICAL TASKS
  6.1 Digit Span Forward
  Performance: Intact.
  Errors: Absent.
  Status: Pass.

  6.2 Token Sorting
  Performance: Intact.
  Errors: Absent.
  Status: Pass.

  6.3 Binary Decision Task
  Performance: Intact.
  Accuracy: Within normal limits.
  Status: Pass.

  The numbers come now. They line up. One, two, three, four, five. They stay. He holds them until the man says stop. The shapes sort themselves. Red with red. Square with square. The rule is clear. It is a hard line. He follows it. The tones are same or different. He hears the gap. He says yes. He says no. He is correct. The man nods. The pen stops scratching. But Arthur feels tired. Very tired. The effort is large. Like lifting a heavy box up stairs. He does it. But he has less left over. The room feels quieter. The light is dimmer. He gave something to get the numbers right. He is not sure what. Maybe the ease. Maybe the quickness.

  7. RE-ASSESSMENT: QUANTITATIVE TASKS
  7.1 Velocity Estimation
  Performance: Intact.
  Error Margin: Within normal limits.
  Status: Pass.

  7.2 Spatial Judgement
  Performance: Impaired.
  Error Margin: Outside normal limits.
  Status: Fail.

  7.3 Risk Assessment Simulation
  Performance: Impaired.
  Verdict: Hesitant.
  Status: Fail.

  The ship comes in again. The same vessel. The same wind. Arthur watches. He knows the speed. Roughly. But the distance is hard to judge. It seems further than it is. Or nearer. He is not sure. He waits longer to turn. The ship swings late. He corrects hard. The engines groan. The ship stops. It is safe. But it was not smooth. Before, he knew where it would stop before he started. Now he watches it stop. He waits to see. The feel is less. The numbers are there, in his head. One, two, three. But the water is quiet. It does not speak to him like before. He used to know the weight of the ship in his bones. Now he knows the weight of the numbers. The ship is safe. But it cost more. He feels drained. Empty. Like a tank with less fuel.

  8. CLINICAL SUMMARY
  Initial assessment showed significant deficit in categorical processing. Quantitative processing intact.
  Re-assessment shows resolution of categorical deficit.
  New deficit observed in quantitative spatial judgement.
  Processing speed reduced.
  Fatigue reported.
  Neurological mechanism suggests recruitment of alternative neural structures to compensate for infarcted tissue.
  Function restored via degeneracy of system.
  Cost of compensation unmeasured by standard battery.

  Arthur sits in the chair. He waits for the man to speak. The man looks at the papers. The papers have boxes. Tick boxes. Yes or no. Fit or unfit. Arthur looks at his hands. They are steady. But they feel old. Older than six weeks ago. He could do the job. He knows he could. The ship would not hit the wall. But he would be tired at the end of the day. More tired than before. He wonders if he has enough left for the night tide. He wonders if the numbers will hold when the wind is strong. He thinks about the water. It seems far away. He misses the feel of it. The deep hum of the engine. The way the bow lifts. It is all roughly the same. But less. Less than before.

  9. RECOMMENDATION
  Panel requires binary decision.
  Option A: Restore Licence.
  Option B: Revoke Licence.
  Option C: Suspend Pending Review.
  Categorical metrics now within normal limits.
  Safety protocols met on re-test.
  Recommendation: Restore Licence.

  The man says he can go back. The paper says fit. The box is ticked. Yes. Arthur stands up. He walks to the door. The floor is solid. He opens the handle. It turns. He steps out into the corridor. The light is bright. Too bright. He thinks about the ship. He thinks about the numbers. He can count the rivets on the hull now. He can sort the colours of the flags. But the water… the water is quiet. He walks to the car. He drives home. He parks. He sits in the driveway. He looks at the house. It is his house. Mostly. He feels safe. Mostly. But he knows something is gone. He traded it for the yes and the no. He has the licence. He has the tick. He does not have the ease. He could drive the ship. He should not. It would be safe. But it would be hard. Too hard. He turns off the engine. The silence is complete. He waits. He does not know for what.

  10. FINAL VERDICT
  Subject medically fit for duty.
  Risk assessment: Low.
  Decision: Restore.

  Arthur stays in the car. The engine cools. The metal clicks. He looks at the licence in his hand. It is a card. Plastic. It says he is allowed. It says he is capable. It says yes. He puts it in the pocket. He gets out. He walks to the door. He stops. He looks back at the car. He looks at the road. The road goes to the port. The port goes to the sea. The sea is grey. It is waiting. He could go. He should not. The numbers say go. The feel says stop. He stands on the step. He is neither here nor there. He is roughly ready. He is not quite right. He closes the door. He leaves the card in the pocket. He walks inside. The house is quiet. It is enough. For now.

