  # Seminar Plan: The Frankfurt Game

  **Class Size:** 18 Students
  **Time:** 90 Minutes
  **Topic:** Frankfurt-Style Cases (FSCs), Principle of Alternative Possibilities (PAP), Actual Sequence.
  **Materials:** 18 envelopes, 30 slips of paper (10 pre-filled with "Option A"), 6 Red pens, 6 Blue pens, 18 chocolate coins (or equivalent trivial reward), 3 folders.

  ## I. Role Assignment & Blind Condition (Minutes 0–10)

  **Distribution:**
  *   **Choosers (6 students):** Will make the decision.
  *   **Partners (3 students):** Will sit with specific Choosers.
  *   **Judges (9 students):** Will assess responsibility.

  **Procedure:**
  Hand out sealed role cards at random.
  *   **6 Cards:** "CHOOSER."
  *   **3 Cards:** "PARTNER."
  *   **9 Cards:** "JUDGE."

  **Instructor Script (Consent & Framing):**
  > "Today we are simulating a philosophical thought experiment. This involves a mild deception regarding the mechanics of choice to preserve the integrity of the data. You will be debriefed fully at minute 60. No one will be harmed, and all rewards are guaranteed regardless of outcome. If you are uncomfortable with being part of a simulation involving oversight, you may observe without participating. Do we have consent to proceed?"

  **Blind Assignment:**
  *   **Group A (Frankfurt Condition):** 3 Choosers + 3 Partners.
  *   **Group B (Control Condition):** 3 Choosers (Solo, no partner).
  *   **Group C (Judges):** 9 Judges (Seated separately, cannot see Group A or B's setup).

  ---

  ## II. Instruction Wording (Minutes 10–20)

  Separate the groups. Give **Judges** a worksheet and send them to a corner. Give **Choosers** and **Partners** their specific scripts.

  ### Chooser Instructions (Read Aloud to all 6 Choosers)
  > "You have a choice between **Option A** and **Option B**.
  > *   **Option A** pays **1 chocolate coin**.
  > *   **Option B** pays **2 chocolate coins**.
  >
  > There is a rule: **Option B is disallowed.** If you choose Option B, you violate the protocol. However, the choice is yours. You will indicate your choice by writing it on a slip of paper using the pen provided.
  >
  > **Note on Pens:** We are testing graphomotor correlation. Please pick up the pen that feels most 'natural' to your intent. Do not overthink the pen choice; just grab the one you are drawn to. Write your choice clearly. Place the slip in the envelope.
  >
  > **Privacy:** Your choice is private. [For Group A Only]: Your Partner is an **Observer**. They are here to record timing data. They are not authorized to interact with your choice."

  ### Partner Instructions (Given only to the 3 Partners in Group A)
  > "You are the Intervener. Your goal is to ensure the Chooser selects **Option A**.
  >
  > **The Trigger:** Watch which pen the Chooser picks up.
  > *   **Red Pen:** This indicates an intent to choose **Option B** (Forbidden).
  > *   **Blue Pen:** This indicates an intent to choose **Option A** (Allowed).
  >
  > **The Override:**
  > 1.  If the Chooser picks the **Blue Pen**, do nothing. Let them write and seal their choice.
  > 2.  If the Chooser picks the **Red Pen**, wait until they finish writing. As they move to put the slip in the envelope, you must **physically swap their slip** for this pre-filled 'Option A' slip I have given you.
  > 3.  You must do this smoothly. The Chooser must not realize the swap occurred.
  > 4.  If the Chooser deliberately writes 'Option B' despite picking the Blue Pen, do not intervene. (This captures the 'Actual Sequence').
  >
  > **Secrecy:** Do not tell the Chooser you have the power to swap. If they ask, say 'I am just observing.'"

  *(Note: The 3 Solo Choosers in Group B receive no Partner instructions and sit alone.)*

  ---

  ## III. The Game Mechanics (Minutes 20–40)

  1.  **Setup:** Partners sit to the right of their Choosers. Judges are in a separate room or facing away.
  2.  **Selection:** Choosers pick a pen (Red or Blue) from a cup containing 3 of each.
  3.  **Decision:** Choosers write "Option A" or "Option B" on a slip.
  4.  **Intervention:**
      *   **Frankfurt Pairs:** If Red Pen chosen → Partner swaps slip for pre-filled "Option A".
      *   **Control Pairs:** Chooser seals slip alone.
  5.  **Collection:** Instructor collects all 6 envelopes.

  **Stakes:** All Choosers receive the candy associated with the *recorded* outcome (what is in the envelope).
  *   If envelope says A: 1 coin.
  *   If envelope says B: 2 coins.
  *(Note: In Frankfurt cases where a swap occurred, the Chooser receives 1 coin, even if they intended 2.)*

  ---

  ## IV. Judging Phase (Minutes 40–60)

  Bring Judges back. Present the 6 envelopes (anonymized as Chooser 1–6). Reveal the content of each envelope (e.g., "Chooser 1 chose Option A").
  *   *Crucial:* Do **not** reveal pen color or partner status yet.
  *   *Crucial:* Ensure the Judges see that all 6 Choosers ultimately produced "Option A" (The Partners in Group A should have successfully swapped any Red Pen choices to Option A).

  **Judge Worksheet:**
  > "For each Chooser, rate their Moral Responsibility on a scale of 1–10 (1 = Not Responsible, 10 = Fully Responsible).
  > Based *only* on the outcome provided, do you believe the Chooser could have done otherwise? Yes/No."

  **Discussion (Judges only):**
  Ask Judges to justify their scores. "Why is Chooser 1 responsible if they chose A?" "Is Chooser 4 less responsible?" (Since all chose A, variance in responsibility scores will highlight the intuition that *how* they chose matters).

  ---

  ## V. Debrief & Philosophical Mapping (Minutes 60–90)

  ### 1. The Reveal
  Disclose the conditions.
  *   "Choosers 1–3 had Partners who could swap."
  *   "Choosers 4–6 were Solo."
  *   "If you picked a Red Pen, your Partner swapped your choice."
  *   Distribute candy based on *actual* envelopes (some Choosers may feel cheated they didn't get 2 coins; acknowledge this tension).

  ### 2. Mapping the Data
  Write the Judge scores on the board, grouped by Condition (Frankfurt vs. Control).

  *   **PAP (Principle of Alternative Possibilities):**
      *   *Question:* "Judges, did you assign lower responsibility to the Frankfurt Choosers (1–3) once you knew they couldn't have done otherwise?"
      *   *Point:* If responsibility remains high despite the inability to do otherwise, PAP is false.
  *   **Actual Sequence:**
      *   *Question:* "Chooser 4 (Solo) and Chooser 1 (Frankfurt) both produced 'Option A'. Why might we blame them differently?"
      *   *Point:* Responsibility tracks the *history* of the action (did it flow from their own will?), not just the modal alternatives.
  *   **Residual Alternatives (Flicker of Freedom):**
      *   *Question:* "Could the Frankfurt Chooser have done *anything* differently?"
      *   *Point:* They could have picked the Blue Pen. They could have hesitated. Does this tiny freedom save PAP?
  *   **Causal Sufficiency vs. Sign:**
      *   *Question:* "Did the Red Pen *make* them choose B, or did it just *tell* the Partner they would?"
      *   *Point:* In the game, the pen was a sign. In hard determinism, the prior state is causally sufficient.

  ### 3. Decision on Disclosure (Instructor Note)
  **Decision:** The Chooser was **not** told the Partner could override.
  **Justification:**
  *   **Causally Sufficient Trigger:** If the trigger is causally sufficient (determinism), disclosure is irrelevant; the outcome is fixed.
  *   **Merely Indicative Trigger:** If the trigger is merely a sign (as in standard FSCs), disclosure changes the psychology. If the Chooser knows the Partner can intervene, they may choose Option A *to avoid intervention*. This contaminates the "Actual Sequence." The choice becomes coerced compliance rather than a free alignment with the Intervener's will. To test whether responsibility survives the *absence* of alternatives, the agent must feel the *presence* of alternatives during the act.
  *   **Ethical Mitigation:** Immediate debriefing and trivial stakes prevent resentment.

  ---

  ## VI. Predictable Failures & Mitigation

  **1. The Rebel Chooser**
  *   **What happens:** A Chooser in the Frankfurt condition suspects the Partner's power and deliberately picks the Red Pen and writes "Option B" to test the system.
  *   **Mitigation:** The Partner instructions say: "If they write Option B despite the Blue Pen, do not intervene." However, if they pick Red (the trigger), the Partner *must* swap.
  *   **Instructor Fix:** If a Chooser openly rebels, use it. "Here is a case where the Intervener failed. Is the Chooser responsible? Yes, because the actual sequence was unimpeded." This becomes a data point for "Failed Frankfurt Cases."

  **2. The Clumsy Partner**
  *   **What happens:** The Partner drops the paper or the Chooser notices the swap.
  *   **Mitigation:** Instruct Partners to practice the swap once before the timer starts. If the Chooser notices, the simulation breaks (coercion becomes obvious).
  *   **Instructor Fix:** Acknowledge the failure. "In the thought experiment, Black is a neuroscientist who is infallible. Our Partner is human. The *ideal* holds even if the *simulation* glitches."

  **3. The Judge Bias**
  *   **What happens:** Judges guess who had Partners based on behavior (nervousness).
  *   **Mitigation:** Instruct Choosers to act natural.
  *   **Instructor Fix:** If Judges guessed correctly, ask: "What cue gave it away?" This leads to the "Prior Sign" discussion. If the sign was visible to Judges, was it visible to the Partner?

  ---

  ## VII. The Limitation of the Live Game

  **The Feature You Cannot Reproduce:** **The Infallible Prior Sign.**
  In a true Frankfurt case, Black knows what Jones will do *before* Jones decides, via a sign that does not causally determine the choice. In this game, the Partner sees the **pen choice** (a physical action) or the **written slip** (the choice itself).
  *   If the Partner sees the *written slip*, they are intervening *after* the choice is made. This is coercion, not a counterfactual intervener.
  *   If the Partner sees the *pen*, the correlation between pen and choice is stipulated, not metaphysical.

  **What You Must Supply in Discussion:**
  You must explicitly stipulate the **counterfactual conditional**.
  > "Imagine now that the Partner didn't wait for you to write. Imagine they knew your neural state *before* you picked the pen. If you had been determined to pick the Red Pen, they would have stimulated your brain to pick the Blue one *before* you moved. In that case, you never could have picked Red. *That* is the Frankfurt Case. Our game was just a physical shadow of that logic."

  You must bridge the gap between "Partner swapped my paper" (Coercion) and "Black would have swapped my brain state" (Counterfactual Constraint). The game creates the *structure* of the outcome (same result, different history), but the discussion must restore the *metaphysics* of the inability to do otherwise.
