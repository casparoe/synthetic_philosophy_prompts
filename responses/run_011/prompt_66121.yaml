answer: |-
  There is no single, canonical term in political science that captures this specific mechanism exactly as you have described it. You have identified a specific *pathology* of performance-based legitimacy that sits in the gap between several established concepts.

  The closest established concept is **Performance Legitimacy** (or **Output Legitimacy**), but standard usage of this term treats deliverables as a **portfolio** (a basket of goods) rather than a **sequential substitution** that preserves the illusion of a single contract. The literature on **Authoritarian Resilience** describes the *outcome* (the regime survives), but rarely analyzes the *logical structure* of the legitimacy claim that allows it to survive without admitting failure. The logical structure you describe is best understood through the philosophy of science concept of an **Immunizing Stratagem** (Karl Popper), applied to political claims.

  Because the phenomenon lacks a specific name, I will adopt your request to coin one for the sake of precision. I propose calling this **Legitimacy Substitution**.

  Below is the analysis of the neighbors, followed by the "carving" you requested: the definition, edges, conditions, real-time identification, and the feasibility of fixing the criterion.

  ### 1. The Nearest Neighbors (and why they fall short)

  **A. Performance Legitimacy (Output Legitimacy)**
  *   **Fit:** This is the broad category. It correctly identifies that the claim to rule rests on deliverables (growth, safety) rather than procedure (elections).
  *   **Distortion:** Standard theory treats performance as a *multidimensional portfolio*. If a regime delivers growth *and* order, it has a thick legitimacy buffer. If growth fails, the buffer thins. Your pattern describes something different: the *ledger itself is rewritten*. The regime does not say, "We failed at growth but succeeded at order." It implies, "Order was the growth we meant all along." Standard performance legitimacy theory allows for falsification (if you deliver nothing, you fall); your pattern describes a system that evades falsification.

  **B. Authoritarian Adaptation / Resilience**
  *   **Fit:** This literature (e.g., Andrew Nathan, Steven Levitsky) documents how regimes survive shocks by changing tactics, co-opting opponents, or shifting narratives.
  *   **Distortion:** It focuses on *survival mechanisms*, not the *logic of the claim*. It observes that the regime changed its story; it does not analyze the specific logical sleight-of-hand where the new story is treated as continuous with the old one by both supporters and critics.

  **C. Goal Displacement (Sociology/Organizational Theory)**
  *   **Fit:** This occurs when the *means* (bureaucracy, rules) become the *ends*.
  *   **Distortion:** This is usually internal to an organization. Your observation is public-facing and political. Furthermore, goal displacement usually implies a loss of original purpose. In your pattern, the original purpose is rhetorically preserved even as it is abandoned.

  **D. Immunizing Stratagem (Philosophy of Science)**
  *   **Fit:** This is the strongest logical match. Popper described how a theory can be protected from falsification by adjusting auxiliary hypotheses. (Theory: "This regime is competent." Test: "Growth." Result: "No Growth." Adjustment: "Growth wasn't the real test; Stability was.")
  *   **Distortion:** This is a philosophical concept, not a political science term. It lacks the empirical texture of *state capacity* and *public goods* that you noted (i.e., that the tools of failure become the tools of success).

  ---

  ### 2. The Carving: Legitimacy Substitution

  Here is the definition with edges, designed to distinguish this from ordinary political adaptation.

  **Definition:**
  **Legitimacy Substitution** is a regime maintenance strategy wherein a government anchors its claim to rule in a specific, measurable performance metric (Metric A). When Metric A becomes untenable due to failure or dispute, the regime shifts its claim to a different metric (Metric B) without acknowledging the change in criteria. Crucially, the political discourse (state, supporters, and critics) treats Metric B as discharging the *same* obligation as Metric A, rendering the core claim ("We are the legitimate rulers because we deliver") unfalsifiable.

  **The Edges (What it is NOT):**
  1.  **It is not Portfolio Legitimacy:** In a portfolio, the regime claims credit for A, B, and C simultaneously. If A fails, the regime admits the loss but relies on B to maintain net support. In Substitution, A is not admitted as a loss; it is absorbed into B.
  2.  **It is not Re-negotiation:** In a re-negotiation (e.g., a new election, a new constitution), the terms of the bargain are explicitly reset. In Substitution, the *continuity* of the bargain is the central fiction.
  3.  **It is not simple Propaganda:** Propaganda often involves lying about the data (claiming growth happened when it didn't). Substitution involves telling the truth about a *different* data point (admitting growth is down, but claiming order is up) while implying equivalence.

  **Conditions for Occurrence:**
  For Legitimacy Substitution to occur, three conditions must be met:
  1.  **Monistic Claim Structure:** The regime's legitimacy must be anchored in a singular, overarching promise (e.g., "Competence," "National Restoration," "The Good Life") that is broad enough to encompass multiple distinct metrics. If the claim is too specific (e.g., "We promise 5% GDP growth"), substitution is impossible; the claim simply breaks.
  2.  **Information Asymmetry / Narrative Control:** The regime must possess sufficient control over public discourse to prevent a competing faction from explicitly naming the switch. If an opposition can say, "You promised growth, not silence," the substitution is exposed.
  3.  **Convertible State Capacity:** As you noted, the instruments used to pursue Metric A must be convertible to Metric B. (e.g., The surveillance apparatus built to optimize economic planning is repurposed to enforce social order). If the failure at A destroys the capacity to deliver B, the regime collapses rather than substitutes.

  **Real-Time Identification (The Test):**
  To distinguish Legitimacy Substitution from a legitimate re-weighing of public goods in real time, look for the **Accounting of Trade-offs**.

  *   **Legitimate Re-weighing:** The government or its supporters explicitly acknowledge the trade-off. *"Growth has slowed because we prioritized stability. This is a new choice."* The old metric is written off as a cost.
  *   **Legitimacy Substitution:** The trade-off is denied or obscured. *"The current stability demonstrates the success of our economic vision."* The old metric is not written off; it is re-defined.
  *   **The Critic Test:** Watch the critics. In a legitimate re-weighing, critics attack the *choice* ("You chose order over growth"). In Legitimacy Substitution, critics often attack the *new metric* as insufficient ("Order isn't enough") but implicitly accept that it counts toward the *same score* as the old one. If critics argue about the *score* rather than the *rules of the game*, Substitution is occurring.

  **Can a Government be Held to a Fixed Criterion?**
  You asked what it would take to hold a government to a fixed criterion in advance, and whether it is possible.

  *   **The Problem:** Pure Performance Legitimacy is inherently vulnerable to Substitution because "performance" is a semantic category controlled by the performer. Without a procedural anchor, the definition of success is fluid.
  *   **The Requirement:** To fix the criterion, you need **Procedural Legitimacy** (Input Legitimacy) to anchor the Performance Claim.
      *   *Independent Verification:* The metric (e.g., Growth) must be measured by an institution the regime cannot repurpose (e.g., an independent central bank, free press, international auditors). If the regime controls the measurement, it can always shift the metric.
      *   *Contractual Specificity:* The claim must be codified in a way that makes substitution a violation of procedure, not just a change of policy. (e.g., A constitution that ties tenure to specific outcomes).
  *   **Feasibility:** For a regime whose claim rests *solely* on performance (often authoritarian or technocratic), this is **structurally impossible**. To accept fixed criteria with independent verification is to accept procedural constraints (Input Legitimacy). If they accept those constraints, they are no longer relying purely on performance legitimacy.
  *   **Conclusion:** Legitimacy Substitution is not a bug of performance-based regimes; it is a feature. It is the mechanism by which performance legitimacy avoids its own expiration date. You cannot prevent it without changing the *type* of legitimacy claim from Output-based to Input-based.

  ### Summary
  You have identified a logical evasion mechanism within **Performance Legitimacy**. While the literature discusses **Authoritarian Resilience** and **Narrative Adaptation**, it lacks a term for the specific *continuity illusion* where failed metrics are replaced without acknowledgment.

  **Term:** **Legitimacy Substitution**.
  **Core Mechanism:** An **Immunizing Stratagem** applied to political claims, enabled by **Convertible State Capacity**.
  **Diagnostic:** The absence of acknowledged trade-offs in the public accounting of goods.
  **Remedy:** Impossible within pure performance legitimacy; requires a shift to procedural legitimacy.
