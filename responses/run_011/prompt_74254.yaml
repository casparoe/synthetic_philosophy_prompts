answer: |-
  Dear Colleague,

  You have presented a formidable set of data points, and I appreciate your insistence on precision over comfort. The demarcation problem in historiography is rarely solved by a single silver bullet, but your cases suggest that the boundary is not drawn around truth or falsity, nor even strictly around method, but around the epistemic stance the claimant takes toward the possibility of being wrong. Before committing to an account, let us sketch three candidates you implicitly navigate. The first is falsifiability, the idea that a claim is scientific or historical only if it specifies conditions under which it would be abandoned. This fails because it is too blunt for your cases. Case eight, the Younger Dryas impact hypothesis, is falsifiable and contested, yet you rightly hesitate to call it pseudohistory. Case five, Fomenko, uses statistical falsification but manipulates the data to ensure survival. Falsifiability alone cannot distinguish between a risky claim and a rigged test. The second candidate is community accountability, where pseudohistory is defined by operating outside peer review or institutional norms. This fails against case four, the Nazca replication, which lacked peer review and academic appointment yet counts as good work, and case six, Monte Verde, where the community initially rejected a true claim. If community acceptance were the criterion, the discipline would be infallible, which case eleven, Piltdown, proves it is not. The third candidate is the social role of the claim, where pseudohistory is identified by its political utility or its appeal to non-expert audiences. This fails against case nine, the Solutrean hypothesis, where social uptake by bad actors risks contaminating your judgment of the method, and case ten, Schliemann, whose self-promotion was colossal but whose work was not pseudohistorical.

  Having discarded those, I defend a principle centered on epistemic risk and immunization. Pseudohistory is a practice that mimics the forms of historical inquiry while systematically evading the epistemic risks that define the discipline. This account has two clauses. The first clause states that a claim is historical only if it specifies evidence that could decisively count against it, and the claimant accepts that negative outcome as a refutation. This clause is motivated by the contrast between case six and case seven. In Monte Verde, the excavator offered a specific site with stratigraphy and artifacts that could be dated and disproven. In the lost Ice Age civilization scenario, the absence of evidence is often explained away by the theory itself, such as rising sea levels destroying the proof, which immunizes the claim against the most obvious falsifier. The second clause states that a claim is pseudohistorical if it requires the ad hoc rejection of established methods or evidence solely to preserve the core thesis, without independent justification. This clause is motivated by case five, Fomenko, who must claim all chronologies are forged to make his math work, and case three, Von Däniken, who must assume ancient people were incapable of engineering to justify aliens. This principle respects case twelve, Geoffrey of Monmouth, because he was not evading risks available in his own time, and case ten, Schliemann, because while his method was destructive, he did not invent a conspiracy to explain away discrepancies; he simply was wrong and sloppy, which is not the same as being pseudoscientific.

  Applying this principle to your verdicts requires a sacrifice. You must abandon verdict two, the identification of Atlantis with Thera. You noted that you keep wanting to retract this, and my principle confirms you should. Linking a textual tradition to a geological event via inference to the best explanation is standard historical practice, provided one does not ignore contrary evidence. If the Thera hypothesis is argued without immunizing strategies, it is not pseudohistory, even if it is speculative. Holding it as pseudohistorical forces you into a contradiction with case six, where an anomaly challenged a framework. If challenging a framework with archaeological evidence makes one pseudohistorical in case two, then the Monte Verde excavators were pseudohistorical until they were vindicated. You cannot have it both ways. You must either call Monte Verde pseudohistory during the period of rejection or admit that the Thera hypothesis is legitimate historical speculation. I urge you to drop the verdict on case two. Regarding case nine, the Solutrean hypothesis, you must also cleanse your criterion of social uptake. The fact that white supremacists adopt a theory does not make the theory pseudohistorical; it makes the theory dangerous and worthy of intense scrutiny, but the demarcation rests on whether the proponents accepted the genetic falsification. Since they published in a university press and engaged with the evidence until it rejected them, it remains bad science, not pseudohistory. Your discomfort is a heuristic for bias, not a definition of the category.

  Now we must address the crux directly, which is how case six and case seven come apart without hindsight. You worry they look structurally identical from the inside: anomalies, outsiders, establishment resistance. They are not identical if you look at the structure of the explanation for absence. In case six, the claim was positive existence: here is a site, here are the tools, date them. The risk was immediate and local. In case seven, the claim often relies on a negative explanation for absence: the evidence is gone because the sea rose. This is an immunization strategy built into the hypothesis. To separate them in advance, you ask the claimant: what specific discovery would prove you wrong? The Monte Verde proponent can point to the stratigraphy. If the tools are modern intrusions, the claim dies. The Ice Age Civilization proponent often cannot point to a specific site that would falsify the general theory, because any lack of sites is attributed to the destruction mechanism. If your criterion requires that the claimant specify the conditions of their own defeat, case six passes and case seven fails, regardless of who turns out to be right. If the Ice Age proponent points to a specific site like Gobekli Tepe and says if this is dated to ten thousand years ago I am wrong, they move toward history. If they say the real evidence is underwater, they remain in pseudohistory.

  Regarding the new cases you raised, consider first the mainstream interpretive frameworks like longue-durée reasoning or world-systems explanations. These are not pseudohistorical because they do not claim to be empirical discoveries in the same way. They are heuristic models for organizing data, not claims about specific events that can be falsified by a single shovel test. They are judged by their utility, not their truth in the same sense as a dating claim. Therefore, they occupy a different category than pseudohistory, which mimics empirical discovery. Your second case is a hypothetical claim defended only by a documentary producers, supported by genuine artifacts, resting on contested dates, without academic proponents. This falls squarely into pseudohistory under my second clause. The lack of academic proponents is not the issue, as case four shows. The issue is the reliance on contested dates without submitting to the standard protocols for resolving those contests. If the producers refuse to allow independent dating or claim a conspiracy among dating labs, they are immunizing. If they say date these yourself and we will accept the result, they are practicing history outside the academy. The medium does not determine the status; the willingness to risk falsification does.

  Finally, you ask whether social uptake can ever enter the criterion without turning demarcation into politics. The answer is no. If you define pseudohistory by its political consequences, you lose the ability to criticize true claims that have bad consequences or false claims that have benign ones. However, social uptake is a valid signal for where to apply your scrutiny. When a claim is adopted by an ideological group, the likelihood of immunization strategies increases because the claim serves a non-epistemic function. You should treat the social uptake as a reason to check the second clause of my principle more rigorously, looking for ad hoc rejections of evidence, but not as proof of the clause itself. You must accept that your verdict on case nine was correct in label but potentially compromised in motivation. You should hold it because the method allowed for falsification, not because you distrust the promoters. If you find yourself unable to separate the two, you are doing politics, not philosophy of science. In sum, adopt the principle of epistemic risk and immunization, drop verdict two on Thera, cleanse verdict nine of social judgment, and trust that the distinction between Monte Verde and the lost civilization lies in the willingness to specify how the claim could die. This will not save you from all ambiguity, case eight proves some claims live in the zone of contestation, but it will stop you from calling speculation pseudohistory simply because it challenges a paradigm.

  I hope this provides the clarity you sought. It is better to have a sharp criterion that cuts a few comfortable verdicts than a blunt one that protects them all.

  Yours sincerely,

  A Philosopher of Science
