  Pursuant to the Q3 Clarity Initiative, all internal communication must be strictly explicit. Conversational implicature—meaning inferred rather than stated—is hereby classified as unverified data transmission. Employees must convey intent solely through literal semantic content. Contextual reliance is prohibited. Some departments may experience workflow adjustments. ^1

  **2.0 COMMUNICATION MAXIMS (HR ADJUSTED)**
  All staff must adhere to the following Modified Cooperative Principles:

  2.1 **Quantity:** Provide exactly the information required by the immediate transactional purpose. Do not omit required data (Violation); do not provide extraneous detail in the all-hands channel (Infringement).
  2.2 **Quality:** Do not say what you believe to be false. Do not say that for which you lack adequate evidence. Sarcasm is classified as Quality Violation.
  2.3 **Relation:** Say only what is relevant to the current operational thread. Tangential anecdotes constitute Time Theft.
  2.4 **Manner:** Avoid obscurity and ambiguity. Avoid unnecessary prolixity. Disorderly narrative structures are subject to review.

  **3.0 CLASSIFICATION OF BREACHES**
  Distinctions regarding maxim breaches are enforced as follows:

  3.1 **Infringing:** Unintentional breach due to ability mismatch (e.g., lexical limitation). *Penalty:* Mandatory Remedial Writing Training.
  3.2 **Violating:** Covert breach to mislead (e.g., lying). *Penalty:* Written Warning.
  3.3 **Opting Out:** Explicitly stating inability to cooperate (e.g., "I cannot say more"). *Penalty:* Managerial Review.
  3.4 **Flouting:** Openly breaking a maxim to generate inferred meaning (e.g., irony, hyperbole). *Penalty:* Immediate Termination.

  **4.0 LEXICAL RESTRICTIONS**
  The following connectives are suspended pending review due to high implicature carriage rates: *but, however, yet, although, even, therefore.* This list is non-exhaustive and expands weekly as employees migrate implicature to alternative conjunctions. Usage requires pre-approval from Legal.

  **5.0 COMPLIANCE EXAMPLES**

  | Non-Compliant Utterance | Compliant Rewording | Annotation |
  | :--- | :--- | :--- |
  | "I'll try to finish by Friday." | "I will attempt to finish by Friday." | Cleared. ^2 |
  | "Some managers are concerned." | "A subset of managers (n≥2) are concerned." | Cleared. ^3 |
  | "He was punctual, but lazy." | "He was punctual. He was lazy." | Cleared. |

  ^2 *Note: "Attempt" implies possibility of failure, but this is now explicit semantics.*
  ^3 *Footnote: Use of "Some" must not imply "Not All." If "Not All" is meant, state "Not All." If "All" is meant, state "All." Do not allow the reader to infer quantification.*

  **6.0 LEGAL DISCLAIMER**
  This policy does not imply that previous communication standards were inadequate. ^4 It does not suggest an increase in regulatory scrutiny. It does not indicate that leadership suspects widespread obfuscation. Any inference drawn regarding current performance metrics is unintended and void. We are not hiding data. We are not restructuring. We are not reducing headcount. These sentences are not evidence of restructuring.

  ^4 *If previous standards were adequate, this policy would be unnecessary. This sentence is not an admission of inadequacy. It is a conditional statement.*

  **7.0 APPENDIX A: SAMPLE REFERENCE LETTER**
  *The following reference letter complies fully with Policy SC-909.*

  To Whom It May Concern:

  Mr. Arthur Dent was employed by this organization from 2019 to 2024. He occupied a desk. He possessed a keycard. He attended meetings. He utilized email software. He did not steal hardware. He did not assault colleagues. He was terminated on Tuesday. We wish him adequate health.

  Sincerely,
  Compliance Officer

  ***

  ^1 *Footnote: "Some" does not mean "Most." It does not mean "Few." It means an unspecified quantity greater than one. Please do not infer that your department is specifically targeted. If your department is targeted, you will receive a separate memo. The existence of this footnote does not increase the probability of targeting.*
