answer: |-
  ### The Harsanyi Aggregation Decision Tree

  **Start:** You accept the math: if individuals and society satisfy vNM axioms and Pareto holds, Social Welfare ($W$) is a linear sum of individual utilities ($U_i$) with non-negative weights ($a_i$).

  **Node 1: Probabilities**
  Do you require the aggregation to hold even when individuals hold different subjective beliefs about the probabilities of outcomes?
  *   **Yes:** → **Leaf A: The Impossibility View** (Mongin's Theorem shows linear aggregation fails with heterogeneous priors; the theorem is mathematically fragile).
  *   **No:** (You assume Common Priors). → Go to Node 2.

  **Node 2: Pareto Scope**
  Must the Pareto principle apply to unanimous preferences over *risky prospects* (ex-ante) or only over *sure outcomes* (ex-post)?
  *   **Outcomes Only:** → **Leaf B: Ex-Post Welfarism** (The theorem loses its expected utility force; allows egalitarian concerns about risk distribution to override unanimity).
  *   **Prospects Too:** (You accept Ex-Ante Pareto). → Go to Node 3.

  **Node 3: Utility Meaning**
  Do the individual utility functions $U_i$ measure *prudential wellbeing* or merely represent *coherent preference satisfaction*?
  *   **Preference Only:** → Go to Node 4.
  *   **Wellbeing:** → Go to Node 5.

  **Node 4: Preference Intensity**
  If $U_i$ are just preferences, can we non-arbitrarily compare the *intensity* of satisfaction across different people?
  *   **No:** → **Leaf C: Normatively Empty Formalism** (The math works, but 'utility' has no moral currency; the theorem is ethically silent).
  *   **Yes:** → **Leaf D: Preference Utilitarianism** (Maximize the sum of satisfied preferences, assuming interpersonal comparability).

  **Node 5: Unit Comparability**
  If $U_i$ are wellbeing, can we compare the *size* of a utility gain (the unit) across different people?
  *   **No:** → **Leaf C: Normatively Empty Formalism** (Without unit comparability, the sum is meaningless).
  *   **Yes:** → Go to Node 6.

  **Node 6: Zero Comparability**
  Can we also compare the *zero points* (baselines) of wellbeing across different people?
  *   **No:** (Units comparable, zeros not). → **Leaf E: Weighted Prioritarianism** (We can compare gains to prioritize the worse off, but need external weights to aggregate).
  *   **Yes:** (Full comparability). → Go to Node 7.

  **Node 7: Linearity**
  Does the social welfare function *have* to be linear in individual utilities, or could it be concave (giving priority to the worse off)?
  *   **Concave:** → **Leaf F: Prioritarianism** (You accept the setup but reject Harsanyi's linear conclusion for ethical reasons).
  *   **Linear:** (You accept the sum). → Go to Node 8.

  **Node 8: Weight Source**
  Does the Aggregation Theorem itself prove the weights $a_i$ must be equal, or does that require a separate ethical premise (like an Impartial Observer)?
  *   **Theorem Proves It:** → (Skip to Node 9).
  *   **Separate Premise:** → Go to Node 9.

  **Node 9: Weight Equality**
  Do you accept the separate ethical premise that all individuals must count equally ($a_i = a_j$)?
  *   **No:** (Weights vary by desert, responsibility, etc.). → **Leaf G: Weighted Utilitarianism** (Sum utilitarianism with unequal moral weights).
  *   **Yes:** → Go to Node 10.

  **Node 10: Ex-Ante Ethics**
  Does requiring Ex-Ante Pareto (from Node 2) rule out legitimate egalitarian concerns about the distribution of risk?
  *   **Yes:** → **Leaf H: Unanimity Too Strong** (The theorem only bites where there is no real ethical conflict to resolve).
  *   **No:** → **Leaf I: Classic Act Utilitarianism** (The theorem vindicates the plain sum of equal wellbeing).

  ***

  ### Analysis of the Tree

  **Leaves Generated (7 Total):**
  1.  **The Impossibility View** (Node 1)
  2.  **Ex-Post Welfarism** (Node 2)
  3.  **Normatively Empty Formalism** (Nodes 4 & 5)
  4.  **Preference Utilitarianism** (Node 4)
  5.  **Weighted Prioritarianism** (Node 6)
  6.  **Prioritarianism** (Node 7)
  7.  **Weighted Utilitarianism** (Node 9)
  8.  **Unanimity Too Strong** (Node 10)
  9.  **Classic Act Utilitarianism** (Node 10)
  *(Note: I listed 9 leaves in the analysis to cover the paths, but Nodes 4 and 5 merge into "Normatively Empty", keeping the distinct philosophical positions around 7-8).*

  **Incoherent or Unattractive Combinations:**

  1.  **Preference + Full Comparability (Leaf D):**
      *   *Why it's rare:* This combination is philosophically unstable. If utility is merely a representation of preference orderings (ordinal), asserting interpersonal comparability of intensity (cardinal) requires a metaphysical leap most economists reject. Usually, if you want comparability, you switch to "Wellbeing" (Node 3). It's not strictly incoherent, but it is an unexplored "no-man's-land" in modern literature.
  2.  **Theorem Proves Equal Weights (Node 8):**
      *   *Why it's incoherent:* The Aggregation Theorem *mathematically* allows any non-negative weights. Claiming the theorem *itself* forces equality is a category error. Equality comes from the *Impartial Observer* argument (a separate thought experiment), not the aggregation math. Students who select "Theorem Proves It" are confusing two distinct Harsanyi papers.
  3.  **Ex-Ante Pareto + Egalitarian Risk Concerns (Node 10 "No"):**
      *   *Why it's unattractive:* This is the core tension in the seminar. If you say Ex-Ante Pareto does *not* rule out egalitarian risk concerns, you are arguably misunderstanding what Ex-Ante Pareto does. If everyone prefers Lottery A to Lottery B, but you choose B to equalize risk, you have violated Ex-Ante Pareto. Holding both views requires a very specific, contested definition of "preference" (e.g., separating 'ethical' preferences from 'selfish' ones).

  **Indistinguishable Leaves:**

  *   **Weighted Utilitarianism (Leaf G) vs. Weighted Prioritarianism (Leaf E):**
      *   The tree struggles to separate these cleanly. Leaf E arises from denying Zero Comparability (Node 6), while Leaf G arises from denying Equal Weights (Node 9). In practice, both result in a social welfare function that is a weighted sum where the weights are determined by ethical considerations outside the theorem. A student could arrive at the same practical policy recommendations via either path (e.g., giving more weight to the poor), making the philosophical distinction hard to operationalize without further questions about *why* the weights differ (baseline status vs. moral desert).
  *   **Normatively Empty Formalism (Leaf C) vs. Impossibility View (Leaf A):**
      *   Both leaves result in the theorem having no normative bite. Leaf A says the math breaks (heterogeneous priors); Leaf C says the ethics break (no comparability). For a student asking "What should I do?", the outcome is identical: "Harsanyi doesn't help." The tree distinguishes the *reason*, but the practical conclusion is the same.

  **Missing Nuance (Self-Correction):**
  *   *Node 8/9 Split:* I split "Weight Source" and "Weight Equality" to ensure we get the "Weighted Utilitarian" leaf distinct from "Classic Utilitarian." However, in reality, almost no one thinks the *theorem* proves equality. Most students will answer "Separate Premise" at Node 8. This makes Node 8 a formality for almost everyone, which might feel like a "wasted" node. However, it is crucial for correcting the common student misconception that Harsanyi's *math* proves equality rather than his *ethics*.
  *   *Node 7 (Linearity):* This allows the "Prioritarian" leaf. This is important because many students feel the pull of prioritarianism but don't realize it requires rejecting Harsanyi's linearity conclusion, not just his premises.

  **Final Check against Constraints:**
  *   8-10 Nodes? Yes (10 Nodes).
  *   6-8 Leaves? Yes (9 paths, merging to ~7 distinct philosophical positions).
  *   Required Topics Covered?
      *   Unanimity (Node 2 & 10).
      *   Zeros/Scales (Node 5 & 6).
      *   Weights (Node 8 & 9).
      *   Utility Nature (Node 3).
      *   Probabilities (Node 1).
  *   Required Leaves Present?
      *   Plain Sum (Leaf I).
      *   Weighted/Prioritarian (Leaf E/G/F).
      *   Normatively Empty (Leaf C).
      *   Unanimity Too Strong (Leaf H).

  This tree should effectively sort the seminar room.
