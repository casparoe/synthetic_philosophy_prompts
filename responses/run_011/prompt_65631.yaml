answer: |-
  Look at the faculty behind me. Look at the families in the seats. You are graduating into a profession where the word you write on a form determines what happens to a human body. For the last two years, some of you have sat in my lectures arguing about what that word means. You know that behind me sit colleagues who believe disease is a value-free biological matter, a statistically typical departure below normal functioning measured against a reference class. You know I hold the view that functioning cannot be characterized without values already built in, because normal function is always function for some kind of life. Both camps are listening. Both camps will hear me describe their position fairly. I promise to keep this shorter than the average hospital round.

  This disagreement is not academic. It decides who gets care. Consider a hereditary variant in the enzyme that clears the toxic product of alcohol metabolism. It is common in some parts of the world, rare in others. Carriers flush, turn nauseous, and get a racing heart after one glass of wine. Consider two carriers. The first works in a trade where nothing is settled until it is settled over drinks, and refusal carries a career cost. The second lives somewhere that drinking is a matter of complete indifference. For a carrier who keeps drinking anyway, the risk of certain cancers of the upper digestive tract rises sharply.

  If disease is only biological statistical departure, both carriers have the same condition. The enzyme works atypically. The biology is identical. If disease is a limitation on the ability to live a life, the answer splits. The first carrier faces a barrier to participating in their economy and a heightened risk they cannot avoid without losing their livelihood. The second carrier faces no such barrier. The biology is the same; the disease status might not be. You will encounter this split not in a seminar, but at a terminal.

  There will be afternoons when you must type a code to authorize treatment. You will face a choice between labeling a condition a disease or an enhancement. That classification is not merely descriptive; it is distributive. It determines whether an insurer views your intervention as medically necessary or elective. When the definition of disease narrows to biology alone, treatments that restore function in a specific context may be denied as unnecessary for the organism. When the definition widens to include life circumstances, the scope of care changes, and so does the budget. You will be the one holding the mouse. You will feel the weight of that click.

  On my account, a society can make its members healthy simply by expecting less of them.

  I will not answer that objection here. I offer it so you know the cost of the view I hold. You must decide if that cost is acceptable when you are the one signing the order.

  So here is a practical instruction for your first afternoon at the terminal. Before you select the code from the dropdown menu, ask the patient what they need to be able to do that they cannot do now. Do not ask only what is broken inside them. Ask what life looks like outside the clinic walls. If the code you type does not match the life they describe, you have not finished your work. The biology might be clear, but the treatment depends on the context. You are not just fixing systems; you are restoring agency.

  I want to speak now to the parents and families in the audience. You paid for this. You have spent four years listening to your children use the word disease in ways you no longer recognize. They talk about mechanisms and pathways and statistical deviations. You remember a time when disease meant suffering, or inability to work, or fear. You are right to feel that the word has shifted. It has. But do not worry that the diagnoses they give now are arbitrary. They are struggling to match the science they have learned with the suffering they witness. They are trying to ensure that the label they write down actually unlocks the help you needed them to provide. They are learning that the code must serve the person, not just the chart.

  You are leaving a place where definitions are contested. You are entering a place where definitions are executed. Do not let the precision of the biology blind you to the reality of the life. Do not let the complexity of the circumstances obscure the biology. You have the training to see both. Trust your judgment when the two do not align. The patient in front of you is not a reference class. They are a life. Protect that life.
