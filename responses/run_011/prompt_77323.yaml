prompt: |-
  ok so I'm a junior and in my comparative government class our teacher is making each of us write one practice essay question for the class review packet, plus a model answer and a marking scheme, bc she says writing the question is harder then answering it. My topic is presidential vs parliamentary systems and I want mine to be the genuinely hard one, not the boring "name three differences between the two systems" thing half the class is gonna do.

  Here's the setup I already came up with. It's a made-up country on purpose so nobody can just recite facts about the US or the UK, and also we're not allowed internet during the review session so the question has to be answerable from the info given plus whatever we learned in class:

  **Valtreya** — democracy since the mid-1990s, about 18 million people.
  - President is directly elected by majority runoff, serves a five-year term, can run for a second term.
  - One legislative chamber, 200 seats, elected by proportional representation with a really low 2% threshold, so there are usually six or seven parties in it and no single party comes close to a majority.
  - The president picks ministers who don't need legislative approval and can't be fired by the legislature. The legislature can only remove the president by impeachment for an actual crime, which needs two-thirds.
  - The president can veto bills (a three-fifths vote overrides it) and can rule by decree while the chamber is not in session. The president can't dissolve the chamber.
  - In the last twenty years: no president has had a friendly majority in the chamber for more than about 18 months of any term, two presidents governed mostly by decree, one was impeached and removed after ten months of that, and one president's whole program sat blocked for three years.

  A constitutional convention has two proposals on the table:
  - **Proposal A:** switch to a parliamentary system. Ceremonial president chosen by the chamber, and a PM plus cabinet that need and keep the confidence of a majority, with the chamber dissolvable for early elections.
  - **Proposal B:** keep the directly elected president with real powers, but add reciprocal survival — the chamber can remove the president and the cabinet by a simple-majority no-confidence vote, and a president facing that vote can instead dissolve the chamber and force presidential and legislative elections at the same time within 90 days. Each side can only use its power once per year.

  One of the convention delegates argues in the hearings that "the entire point of electing the president separately is that when things go badly, voters know exactly who to throw out." Another delegate says Proposal B is just parliamentarism with extra steps and will end up importing all the instability without any of the party discipline that makes parliamentary government workable.

  So what I need from you:

  1. The actual exam question, worded the way a real exam would word it. It should be answerable in 45 minutes and it has to force people to pick and defend one of the two proposals rather than list pros and cons of both. I specifically want it to make them notice that the same feature — like the executive being removable by the legislature, or the legislature not being — is a virtue in some party systems and a disaster in others, and that "presidential = gridlock, parliamentary = efficient" isn't the real dividing line. Build in a requirement that they engage with both delegates' claims, since those two claims pull in opposite directions and I think most people won't see that.

  2. A model answer of about 700 words that actually argues for one proposal and deals with the strongest case for the other one, not a both-sides mush.

  3. A marking scheme out of 25 with the point value of each element, written so a stranger could grade with it. I need it to say specifically what seperates an A answer from a B answer — like, name the exact moves each one has to contain — and then list four or five mistakes that should cost marks, with a note on why each one is a mistake and not just a difference of opinion. The mistakes I'm expecting are things like treating fusion of powers as meaning there are no checks on a PM at all, or assuming Proposal A automatically gives you a stable single-party majority when the electoral system is PR with a 2% threshold, or thinking a fixed term is automatically more stable than a no-confidence vote.

  Please don't put in a bibliography or tell me to cite anything, and don't make the argument depend on specific real-world facts someone would have to look up — if the model answer gestures at real countries as examples that's fine but it shouldn't need any dates or vote counts to work.
reasoning: |-
  Here's a thinking process that leads to the suggested output:

