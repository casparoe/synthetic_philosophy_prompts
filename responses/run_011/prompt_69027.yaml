answer: |-
  Good evening. For those who don't know me, I'm Tom's sibling. And looking around this Working Men's Club, I'd say we've found the only room in town where discussing the structural conditions of labour over a pint doesn't count as being pretentious. It feels appropriate.

  Tom's spent the last eleven years at the co-op. Building industrial bakery kit. It's been a proper experiment: one member, one vote, pay banded tight. To his colleagues here: you built something rare. You kept the lights on while making things that actually last. But Tom reckons we shouldn't romanticise the exit. He told me something blunt before booking this room. He said the co-op wasn't the escape from the grind everyone hoped it was.

  Here's the thing, and it's the reason he's moving on. The market doesn't care about your constitution. When the squeeze came, you still had to bid for contracts you couldn't honour without cutting corners. You still had to drive yourselves harder than any foreman would dare, because the vote was yours. You sold ovens to chains squeezing the local bakeries out of business. Tom's line was that the difference wasn't the absence of the whip; it was that you could see it coming. You knew who was holding it, even if you were all holding it together.

  That's a hard thing to admit after eleven years. It takes courage to say, 'We weren't outside the system; we were just a different gear in the same machine.' The real trap wasn't who owned the factory. It was being moved by arrangements you didn't choose into treating your own activity—and the people alongside you—as so many instruments. You became tools to the market, even if you were the ones holding the toolbox.

  Now, he's off to the cold-chain logistics firm. A massive outfit. He reckons he'll be one of nine hundred people doing exactly his job. To his new colleagues: welcome. You're not walking into a convert to the cause. Tom isn't coming to save you with democracy, and he isn't coming to mourn the loss of it. He knows the arrangements there are different, but the pressure to treat people and products as instruments won't vanish. It just wears a different uniform. The whip is less visible, perhaps, but the work remains.

  To the family: yes, I'm nearly done. There will be food.

  The point isn't that one job was free and the other is a cage. Tom doesn't believe in fairy tales. He believes in seeing the arrangements clearly. Whether you're voting on a contract or signing one handed to you, the trick is to know when you're being moved by forces you didn't choose.

  So, I'm not asking us to agree on the politics. The co-op crew knows the value of what they tried, and the logistics crew knows the reality of the scale they work at. We don't need to settle that tonight.

  I just want to toast Tom. For the eleven years of honest work, and for the honesty required to leave. May you keep seeing the whip, wherever you stand.

  Cheers.
