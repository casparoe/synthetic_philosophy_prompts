answer: |-
  ### The Principle: The Test of Irreversible Exclusion

  You may override a local governing body's decision if and only if three conditions are met simultaneously:

  1.  **Fundamental Necessity:** The decision concerns a good that is biologically or materially prerequisite for human agency (e.g., water, basic sanitation, emergency health), not a discretionary development good (e.g., location of a market, aesthetic choices, secondary infrastructure).
  2.  **Structural Lockout:** The group burdened by the decision is structurally excluded from the political mechanisms required to reverse that decision in the future (e.g., no vote, no representation, captured judiciary), making the deprivation permanent under local rules.
  3.  **Minimum Floor:** The override establishes a minimum threshold of access for the excluded without dictating the maximum scope of provision for the included. It restores the possibility of future political participation by the excluded; it does not permanently substitute your judgment for theirs on all matters.

  **Application to Your Organization's History**

  This test **condemns the systems your predecessor let fail.**

  By deferring entirely to a council known to be captured by elite families, your predecessor treated a rigged procedure as legitimate self-determination. When those systems failed, the 900 people (and others like them) were left without water *and* without the resource base to organize politically. The predecessor prioritized the *form* of local ownership over the *substance* of local capacity. She allowed a decision that structurally locked out the marginalized from a fundamental necessity, violating condition two. The triple cost to rebuild was the price of that ethical failure.

  Your proposed distance rule **passes the test**, provided it is framed as a minimum floor (Condition 3). It addresses a fundamental necessity (water) for a group with no vote (Structural Lockout). It does not tell the council where to put taps for everyone, only that they cannot put taps where *no one* can reach them. It keeps the door open for future political contestation by keeping the excluded population alive and present in the district.

  ***

  ### The Four Questions

  **1. Does it matter that we are the ones paying?**
  Yes, but only regarding leverage, not moral standing. If you are paying, you have a fiduciary duty to ensure the funds are not wasted on systems destined to fail (as your predecessor's did). This gives you a contractual right to impose conditions. If you were only advising, you would lack the contractual right to *impose*, but you would retain the moral obligation to *withdraw endorsement*. In both cases, the Test of Irreversible Exclusion applies: you cannot be complicit in funding or endorsing a decision that permanently locks a population out of basic agency. The difference is that as a payer, you can enforce the rule; as an advisor, you can only refuse to bless the violation.

  **2. Is a rule more defensible for being announced in advance?**
  Yes. A universal, pre-announced rule transforms the intervention from an act of *will* (you vs. the Chair) into an act of *law* (the policy vs. the situation). In a post-colonial context, arbitrary power is the primary trauma. If you arrive after the vote and say, "I don't like this," you are acting like the colonial administrator. If you arrive before the vote and say, "Our charter prohibits funding any system that leaves a household beyond 1500 meters," you are acting like a regulator. The latter allows the council to save face; they are not being overruled by you, they are bumping against an external constraint that binds you both. It makes the override less efficient for you (you can't negotiate), but more defensible ethically.

  **3. Is there a version of such a rule that retires itself?**
  No. To claim that a technical rule can solve a political problem is the specific delusion of the colonial engineer. You can fix the pipes, but you cannot fix the capture. If you impose this rule and tell yourself, "Once this system is built, my job here is done and I will never interfere again," you are lying. As long as the council remains captured and the population thresholds remain exclusionary, you will be required to enforce this floor on every subsequent project. The only thing that retires your standing to impose rules is a change in the local political structure that allows the 900 people to vote. Until then, you are not a temporary guardian; you are a permanent counterweight. Acknowledge this in your internal strategy, even if you do not say it publicly.

  **4. Could your principle survive being read aloud, in translation, at a council meeting?**
  Yes, but only if you strip it of moral judgment regarding the Chair's intent. You cannot say, "We are doing this because you are corrupt and these people have no vote." That is a declaration of war.

  You must say: *"Our organization's mandate prohibits us from funding water systems that leave households beyond 1500 meters from a tap. This is a global rule we apply in every district, regardless of local geography or leadership. We cannot fund the current plan because it violates this technical standard. We are ready to fund a revised plan that meets the standard."*

  This survives the reading because it locates the constraint in *your* limitations, not *their* illegitimacy. It is honest: you *are* constrained by your donors and your ethics. It does not accuse the Chair of theft; it accuses the map of non-compliance. The Chair will understand the reality (he is being checked), but the text remains neutral. If you cannot say it without implying they are children, do not say it. If you can say it as a statement of your own boundaries, it will hold.
