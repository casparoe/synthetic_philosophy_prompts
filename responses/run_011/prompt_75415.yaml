answer: |-
  **The Descent of Silas Vane**

  The rain against the office window was the only sound that didn't come from paper. Silas Vane smoothed the corner of a file folder, the cardstock soft from handling. Outside, the valley was grey, the scar of the landslide still visible on the ridge where the soil had given way three weeks prior. Two houses gone. Two claims on his desk.

  The first file belonged to Elias Thorne. It was heavy. Silas opened it to the tab marked *Level 1: Immediate Antecedents*. There were emails printed on standard bond, dated six months before the slide. Thorne to structural engineer: *Can the foundation hold if we reinforce the western wall?* Engineer to Thorne: *Risk remains high due to soil saturation.* Thorne to spouse: *Cost of moving is prohibitive. I'll take the risk.*

  Silas moved to *Level 2*. The decision to buy the plot. There were meeting minutes from a town planning committee where Thorne had argued for zoning changes in the ridge area. He had lobbied for the opportunity. *Level 3*. The career choice that brought him the capital to buy. University transcripts. A letter of acceptance into a high-risk, high-yield finance program.

  Silas counted the tabs. He reached *Level 5*. The chain held. Every link was forged in ink. Thorne had documented his appetite. He had weighed the soil against the savings, the safety against the view, and he had written it down. He had constructed a self that chose.

  Silas picked up his pen. He calculated the transfer. Thorne would receive enough to cover medical co-pays, but not the home. The loss of the house was charged to the residue of choice found at Level 5. The system deemed that Thorne owned that decision. It was not luck; it was a transaction he had signed.

  Silas stamped the form. *Adjudicated.* He felt no pleasure in it, only a quiet alignment. Thorne was a man who lived in sentences. He deserved the punctuation.

  The second file was light. Mara Kovic.

  Silas opened it. *Level 1: Immediate Antecedents*. There were no emails. No engineering reports. There was a text message string on a printed transcript recovered from a cloud backup. *Friend: Heard the ridge is shaky. You staying?* *Kovic: Love the view. Not going anywhere.*

  Silas frowned. He looked for the weighing. He looked for the alternative considered and rejected. There was nothing. He picked up the phone and dialed the number on the claim sheet.

  "Ms. Kovic? It's Officer Vane. Regarding the loss."

  "I told the intake worker," she said. Her voice was tired, frayed by the loss of her studio. "I lost everything. Paintings. Easels. The house."

  "I need to ask about the decision to stay on the ridge. Did you consult the soil reports?"

  "I heard about them. Didn't look."

  "Why?"

  "Didn't think about it."

  Silas watched the clock. "Did you discuss the risk with anyone? Did you write down why you stayed?"

  "I just stayed. It felt like home. Why does it matter how I stayed?"

  "For the descent," Silas said. "We need to find where the luck ends."

  "There was no luck. I lived there."

  Silas hung up. He returned to the file. He attempted to open *Level 2*. There was no record of deliberation on the lease. No comparative analysis of other properties. Just a signature. He tried to descend further, to find a choice that was truly hers, uncaused by temperament or circumstance. But there was no map. There was only the act.

  According to the rules, a level counts as a choice only if the deliberation can be reconstructed. If the record is thin, the descent stops. Where the descent stops without finding a choice, the misfortune is classified as brute luck. The society owes the debt.

  Silas calculated the transfer. Full replacement cost. Full compensation for the lost art. Because Kovic had not documented her agency, the system assumed she had none. She was compensated for her negligence because her negligence was invisible.

  Silas leaned back. He remembered the case from three years ago. The factory worker. The man who had signed the waiver but couldn't read. The previous administration would have said he chose. The Descent had found no record of comprehension, no evidence of deliberation, and had compensated him. It had saved a man from a choice he hadn't truly made. That was the virtue of the machine. It refused to guess at guilt. It required proof of agency before it would punish.

  But looking at Kovic's file, then Thorne's, the symmetry felt broken. Thorne was punished for his literacy. Kovic was rewarded for her opacity.

  Silas picked up Thorne's file again. He looked at the neat handwriting. *I'll take the risk.* Thorne had trusted the world enough to write his logic down. He had believed that reasons mattered. Now those reasons were the chains that bound him to the loss.

  Silas picked up Kovic's file. She had trusted nothing. She had lived in the moment, unrecorded. Now that void protected her.

  He stood up and walked to the window. The rain had stopped. The mud on the ridge was settling. He thought about what would happen if he changed the rule. If he guessed. If he said, *I know she chose, even if she didn't write it.* He would have to become a mind-reader. He would have to decide how much thought was enough thought. He would have to judge the weight of a feeling versus the weight of a plan. He would have to become the thing the Descent was built to replace: a magistrate of souls.

  Better the paper trail. Better the flaw that could be seen than the judgment that couldn't.

  Silas sat down. He took the stamp. He pressed it onto Kovic's form. *Approved.* He pressed it onto Thorne's. *Partial.*

  He placed them in the outbox. The paper slid against the metal tray with a soft scrape. He waited for the feeling of righteousness that usually came after a difficult pair. It didn't come. He felt only the heavy knowledge that he had protected the system from arbitrariness by sacrificing fairness to the record. He had honored the truth of the file over the truth of the life.

  Silas turned off the desk lamp. The office went dark, save for the grey light from the valley. He locked the files away. Tomorrow, there would be more descents. More lives reduced to tabs. He would do it again, because the alternative was to look into a man's eyes and decide if he was free, and no human should have that power. But as he walked to the door, he wondered if he had just handed justice to the man who wrote it, and mercy to the woman who didn't.

  ***

  **Afterword**

  This story dramatizes **Luck Egalitarianism**, specifically the distinction between **brute luck** (unchosen circumstances) and **option luck** (risks voluntarily taken), as articulated by theorists like **Ronald Dworkin** and **G.A. Cohen**. The central philosophical problem is the **Epistemic Objection**: how can a state reliably distinguish between the two?

  The story's mechanism, "The Descent," addresses this by substituting metaphysical agency with **administrative evidence**. This is a liberty I took; no luck egalitarian argues that documentation *creates* responsibility. I invented the **Record Rule** (choice requires reconstructable deliberation) and the **Seven-Level Bound** (a procedural stopgap against infinite regress) to make the theory operable in a plot. These inventions highlight the **Moral Hazard** objection: the system incentivizes ignorance and penalizes transparency.

  I treated the brute/option distinction as **epistemic** (what can be established) rather than **ontological** (what actually happened). This leans on a contested reading. Strict egalitarians argue responsibility is a fact about the agent's history, not the file clerk's ability to read it. However, **Elizabeth Anderson's** critique—that luck egalitarianism becomes an intrusive inquiry into citizens' choices—is realized here literally. Silas's motivation references the **Protection of the Inarticulate**: the system avoids punishing those who cannot prove their coercion, a nod to the view that evidentiary standards should favor the claimant.

  The story fails if the reader sees Kovic's compensation as purely just. It is intended to feel unjust, illustrating that a procedure designed to avoid tyrannical judgment (guessing agency) inevitably creates arbitrary outcomes (rewarding lack of record). The "worse" alternative Silas fears is **Paternalistic Discretion**, where officers judge the "true" freedom of choices without rules, which luck egalitarians argue leads to bias. The story suggests that while the Descent is indefensible in its outcomes, the human judgment required to fix it is indefensible in its power.
