      *   *Yes.* The bureaucracy rewards ignorance/impulsivity because it can't trace the choice.
      *   *Officer's Motivation:* Needs to have a case where this worked. Maybe someone tried to fake a choice to get a specific outcome? Or someone was coerced but had no record? No, the rule is "no record = brute luck." So the officer believes that without evidence of agency, we must assume luck. This protects the inarticulate?
