      *   *Claimant 2 (The "Outrage" Verdict):* Needs to lack a paper trail. Maybe a laborer or someone who acted on instinct/intuition. They get compensated because there's no record of deliberation, so the system treats it as brute luck.
      *   *Wait, re-reading the prompt:* "Claimants who kept notes... are consequently charged. Claimants who acted impulsively, or whose paperwork is thin... are compensated."
      *   *Goal:* Reader feels the second verdict (compensation for thin paperwork) is an outrage, and the first (charging the documented one) is not obviously wrong.
      *   *Correction:* Actually, usually in luck egalitarianism, if it's option luck (your choice), you bear the cost. If it's brute luck (not your choice), you get compensated.
      *   *The Twist:* The mechanism says: If you can *prove* you chose (records), you are charged (less compensation). If you *can't* prove you chose (no records), you are compensated (treated as brute luck).
      *   *The Outrage:* The person who was careful/documenting gets punished. The person who was sloppy/impulsive gets rewarded. This is the "moral hazard" or "administrative arbitrariness" critique.
      *   *The Officer:* Needs to believe in this. Why? Because sometimes it catches the real manipulators? Or because it respects agency when proven?
      *   *The Event:* Let's make it a flood. Both homes damaged.
