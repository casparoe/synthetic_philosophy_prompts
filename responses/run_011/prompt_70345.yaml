  ### Further Credences

  **1. Causal Route (Conditional on Headline = True)**
  **Credence:** 0.25
  **Justification:** Even if 40% of patients describe new features, the dominant route is likely **deflationary**: referral filters select patients who already have the cultural script, and intake forms cue the vocabulary, which Hacking might count as looping but which I classify as measurement artifact; true *interactive* looping (the classification altering the underlying psychology rather than the description) is rarer than description-matching.
  **Boundary Note:** I draw the boundary at *source of origin*: if the patient brings the idiom from social media (Looping) vs. the clinician introducing it via checklist (Cueing). In practice, these merge, but I weight the "clinician checklist" vector as larger.

  **2. Control Condition (Folk Typology)**
  **Selection:** MBTI types (specifically the "cognitive function" sub-lore).
  **Credence:** 0.20
  **Justification:** While MBTI narratives drift massively in *magnitude*, they lack the *specificity* of clinical symptoms (e.g., "delay of obligations"); folk typologies generate trait-adjectives, not functional impairments, so the "same specificity" constraint fails even if the drift magnitude is higher.

