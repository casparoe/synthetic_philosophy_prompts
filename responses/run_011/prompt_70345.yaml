  ### Pre-Registration Proposal

  **Measurement:** Compare the prevalence of the "New Feature" in **pre-intake self-report questionnaires** for two cohorts: patients diagnosed in **2033** (Year 1) vs. patients diagnosed in **2052** (Year 20).
