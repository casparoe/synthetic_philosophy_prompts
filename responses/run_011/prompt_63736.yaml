  # SEMINAR PREP SHEET: MOLENISM & THE STRUCTURAL OBJECTION

  **Time Allocation:** 40 min talk, 30 min Q&A.
  **Goal:** Survive the structural critique without being conscripted by the Open Theist or collapsed into Thomism by the Reformed.

  ## STRATEGIC OVERVIEW

  **What to Concede Early (First 5 Minutes of Q&A):**
  1.  **Truthmaker Maximalism:** Do not die on this hill. Agree with the Craig-trained Molinist that grounding is often overrated. Say: *"I grant that some truths are brute. My point is not that CCFs need truthmakers, but that they need structural relations they currently lack."*
  2.  **Step 6 (Dispositional Metric):** Admit this is speculative. Say: *"I offer the dispositional account as a possible way out, not a settled conclusion. I am as worried about its consequences as you are."*

  **What to Hold at All Costs:**
  1.  **Pointwise vs. Global:** The distinction between isolated truth-values and an ordered metric is the core of the paper. Do not let them conflate "brute truth" with "unstructured truth."
  2.  **Feasibility Requirements:** Insist that providential planning requires more than logical possibility; it requires comparative feasibility (which world is *better* or *accessible* relative to another).

  **Assessment of Force:**
  *   **High Force:** The Reformed Compatibilist (on determinism) and the Younger Molinist (on dispositions). These threaten the internal coherence of your positive suggestion.
  *   **Medium Force:** The Craig-trained Molinist (on Plantinga/TWD) and the Lewis Grad (on similarity). These challenge your analogies.
  *   **Noise:** The Open Theist. He wants to claim you as a convert. Politely decline; you are critiquing Molinism, not endorsing Open Theism.

  ---

  ## THE QUESTIONS & REPLIES

  ### 1. The Craig-trained Molinist (The Grounding Pivot)
  **The Question:** "You spend the first quarter of the paper dismantling the grounding objection, only to resurrect it in different clothing. If you agree that counterfactuals can be brute truths, as Lewisians do, why does it matter that they are pointwise? What work is the 'global structure' doing that a list of brute truths cannot?"

  **The Reply:** "It matters because a list cannot support the inferences Molinism requires. A telephone directory contains brute truths, but you cannot calculate a route using one. Molinists need to say God *chose* this world because it was feasible and optimal relative to others. That is comparative talk. It requires a metric. If CCFs are just a bag of unconnected atoms, God cannot navigate them. I am not asking for a truthmaker; I am asking for a map."

  **Soft Spot:** He will press on whether 'feasibility' really requires a metric or just a set of compossible truths.
  **Follow-up you might miss:** "Plantinga's feasibility sets are sets, not metrics. Why isn't set-membership enough?" (Answer: Because God needs to know *which* set is actualisable given His creative power, which implies an ordering of accessibility.)

  ### 2. The Lewis Grad Student (The Similarity Objection)
  **The Question:** "You are relying on a very specific, perhaps uncharitable, reading of Lewis. Lewis's similarity ordering is context-sensitive and vague. It is not a rigid 'global structure' in the way you imply. If Lewis can get by with vague similarity, why can't the Molinist get by with vague CCFs?"

  **The Reply:** "Lewis's vagueness is a feature of *our* language, not the ontology. The worlds and their distances exist determinately. The Molinist's problem is ontological, not linguistic. There is no fact of the matter in the Molinist picture that makes one counterfactual 'nearer' than another. Lewis has worlds and a topology. The Molinist has floating truth-values. Vagueness in description is fine; absence of structure in reality is fatal for providence."

  **Soft Spot:** He knows Lewis better than you. He might argue that Lewis's metric is also primitive and ungrounded.
  **Follow-up you might miss:** "Lewis's metric is grounded in the distribution of particular facts across worlds. What grounds the Molinist ordering if not the creatures?"

  ### 3. The Younger Molinist (The Dispositional Hook)
  **The Question:** "I am interested in your positive suggestion in step six. If we ground CCFs in the agent's character and dispositions, we get the global structure you want without Lewisian metaphysics. Why do you think this collapses into determinism? Surely a disposition is not a cause?"

  **The Reply:** "Because for the disposition to fix the truth-value of a counterfactual *prior* to creation, it must be robust. If the disposition guarantees the outcome, it looks like determinism. If it does not guarantee the outcome, the truth-value remains probabilistic or brute, and we are back to the pointwise problem. You need the disposition to do heavy lifting to solve the structural objection, but if it lifts too much, it crushes libertarian freedom."

  **Soft Spot:** This is your weakest area. You haven't worked out the metaphysics of dispositions.
  **Follow-up you might miss:** "Why can't a disposition incline without necessitating? That's the standard libertarian move." (Answer: Because an inclination doesn't make the counterfactual *true* prior to the choice, only likely.)

  ### 4. The Open Theist (The Ally Claim)
  **The Question:** "This is music to my ears. You are arguing that God cannot know future free actions because there is no structure to make them knowable. Surely the honest conclusion here is not that Molinism needs a fix, but that God waits to see what we do? Have you not just proved Open Theism?"

  **The Reply:** "I have proved that *classical* Molinism is incoherent, not that Open Theism is true. There is a second horn to my dilemma: the structure could exist, but it implies determinism. I am presenting Molinists with a choice between Open Theism and Thomism. I am not making the choice for them. My aim is to show they cannot have both meticulous providence and libertarian freedom, not to endorse the former."

  **Soft Spot:** He will press you on whether you personally find the determinism horn plausible.
  **Follow-up you might miss:** "If you reject the dispositional account because it's deterministic, aren't you already assuming libertarianism is coherent? Why not drop that instead?"

  ### 5. The Reformed Compatibilist (The Thomist Collapse)
  **The Question:** "You say the Molinist needs a global metric. I say that if such a metric exists, it is a causal order. If there is a fact about what I would do in circumstance C, prior to my existence, that fact is a constraint. You have refuted Molinism by turning it into a thin version of Thomistic premotion. Why is your 'measure over counterfactual space' not just determinism with the metaphysics filed off?"

  **The Reply:** "Precisely. That is the second horn of my dilemma. If the Molinist accepts the global structure required for providence, they owe us an account of why that structure isn't causal. I agree with you that it looks like determinism. The Molinist wants the structure for planning but denies the causal implication to save freedom. I am arguing they cannot have both. If you are happy with determinism, you should be a Thomist, not a Molinist."

  **Soft Spot:** He will agree with you too enthusiastically and claim you've refuted libertarianism entirely.
  **Follow-up you might miss:** "So you concede that libertarian freedom is incompatible with providential planning? Is that your final position?" (Dangerous. Keep the focus on Molinism, not general libertarianism.)

  ### 6. The Craig-trained Molinist (The Transworld Depravity Defence)
  **The Question:** "You claim Plantinga's Free Will Defence requires measure-theoretic work. But Plantinga only requires the *possibility* of transworld depravity, not its probability. God only needs to know that there is *a* feasible world, not that one is 'nearer' or 'better' in a probabilistic sense. Why does logical possibility not suffice?"

  **The Reply:** "Because God is said to actualise a world with an *optimal* balance of saved and lost, as Craig argues. You cannot optimise over a set of unconnected points. If God is to ensure that the actual world is the 'best feasible' one, He must compare feasibility. If CCFs are pointwise brute facts, there is no scale on which to weigh them. Possibility suffices for the logical defence against the problem of evil, but not for the positive claim of meticulous providence."

  **Soft Spot:** Distinguishing between the FWD (defensive) and Positive Molinism (offensive).
  **Follow-up you might miss:** "Then drop the positive claim. Keep the FWD. Why must Molinism claim optimality?" (Answer: Because without it, Molinism loses its main advantage over Open Theism regarding providence.)

  ### 7. The Second Grad Student (The Source of Structure)
  **The Question:** "Let's grant you need a global structure. You ask where it comes from. But why couldn't the structure simply be a feature of God's own nature or knowledge? Why must it be grounded in the creatures or a Lewisian metric? Why not a divine conceptual framework?"

  **The Reply:** "If the structure is solely in God's nature, then the truth of 'If Peter were in C, he would do X' depends on God, not Peter. That makes God the author of sin in a way Molinists explicitly deny. The whole point of Middle Knowledge is that these truths are *outside* God's will, though inside His knowledge. If the structure comes from God, it collapses into a decree. If it comes from creatures, they must exist to ground it. There is no third option."

  **Soft Spot:** This touches on the Euthyphro-style dilemma for Molinism.
  **Follow-up you might miss:** "Why can't God's knowledge be responsive to creaturely essences without the creatures existing? That's the Molinist claim." (Answer: That is exactly the 'brute pointwise' view I am attacking as structurally insufficient.)

  ### 8. The Dreaded Question (The Step 6 Collapse)
  **The Question:** (Likely from the Younger Molinist or Reformed Compatibilist) "You admit your dispositional metric is the part you are least happy with. Be honest: if dispositions ground the truth of CCFs, and God knows those dispositions essentially, does the agent have any power to do otherwise in the actual world? Have you not admitted that your solution kills the freedom it was meant to save?"

  **The Reply:** (Honest Answer) "Yes, that is my primary worry. If the disposition is strong enough to ground a true counterfactual prior to creation, it is strong enough to constrain the choice. I suspect the dispositional account saves the structural objection only by sacrificing libertarian freedom. I do not have a solution to this yet. I am presenting it to show that the only way to save Molinist providence is to move towards a view that looks suspiciously like compatibilism or open theism. I would rather expose that tension than hide it."

  **Soft Spot:** This is the honest concession. Do not bluff here.
  **Follow-up you might miss:** "Then why propose it?" (Answer: "To show the Molinist where the body is buried. If you want structure, you pay this price.")

  ---

  ## FINAL TACTICAL NOTES

  *   **Watch the Clock:** You have 30 minutes for questions. If the Craig Molinist and the Open Theist start debating each other, let them. Intervene only to clarify your position.
  *   **The "Noise" Filter:** The Open Theist's attempts to recruit you are noise. Acknowledge, deflect, return to the text.
  *   **The "Force" Warning:** The Reformed Compatibilist's argument that your metric *is* determinism is the strongest philosophical challenge. If you concede too much to him, you lose the Molinists. If you concede too little, you look naive about causation. Walk the line: *"It looks like determinism to me, which is why I say Molinism is in trouble."*
  *   **Tone:** Keep it diagnostic. You are the pathologist examining the corpse of Molinism, not the murderer. "I am showing where the structural stress fractures are," rather than "I have destroyed this view."

  Good luck. Keep your tea close.
