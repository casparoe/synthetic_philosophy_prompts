          2.  The ritual absorbs older material (1962 lanterns, 19th-century watch nights).
          3.  The text ("The Charge") is evolving (Somali/Hmong verses added since 2009).
      *   **Theoretical Framework:** The user is relying on Benedict Anderson (*Imagined Communities*) and Eric Hobsbawm (*The Invention of Tradition*).
      *   **The Questions:**
          1.  Does the evidence license the verdict "not a genuine tradition" or just "younger than advertised"?
          2.  Is there a principled line between "invented" and "real" traditions given that *all* traditions evolve? Where does the amended Charge fall?
          3.  What does "imagined" actually mean (if not "fake"), and what does that imply for a reporter assessing authenticity?
      *   **Goal:** Get the conceptual structure right rather than a snappy debunking.

  2.  **Deconstruct the Theoretical Framework (Anderson & Hobsbawm):**
      *   *User's Current Understanding:* "Imagined" = "Modern construction pretending to be ancient." "Invented Tradition" = "Mechanism to pass off construction as old."
      *   *Correction/Nuance:*
          *   **Anderson:** "Imagined" does *not* mean "fake." It means the members of the community will never know most of their fellow members, yet in their minds lives the image of their communion. It's about *scale* and *cognitive connection*, not truth-value. All nations are imagined, even the "old" ones.
          *   **Hobsbawm:** "Invented Tradition" is a specific subset. It implies a ritual/symbolic practice that seeks to inculcate values/norms by repetition, *implying continuity with a suitable historic past*. Crucially, Hobsbawm acknowledges that *all* traditions are invented to some degree. The distinction is often about the *claim* of continuity vs. the *reality* of discontinuity. But Hobsbawm also notes that once invented, if it takes root, it *becomes* a tradition.
      *   *The Folklorist's Comment:* "Authenticity is the wrong question." This is standard folklore studies orthodoxy (Dan Ben-Amos, etc.). Folklore is dynamic. "Fake" is rarely a useful category in lived culture.

  3.  **Address Question 1: The Verdict (Not Genuine vs. Younger):**
      *   *Analysis:* The 1979 memo proves discontinuity in the *specific form*. However, the claim of 1887 is a "myth of origin."
      *   *Nuance:* If everyone knows it's 1979 but keeps saying 1887, the 1887 date functions as a *symbolic* anchor, not a historical claim. It's a "noble lie" or a "foundational myth."
      *   *Verdict:* You cannot call it "not a genuine tradition" simply because it has a known start date. Traditions start. The 1979 date makes it a *documented* invention. The 1887 claim is the "invented tradition" aspect (the false continuity). But the *practice itself* is now 45+ years old. That's two generations.
      *   *Conclusion:* It licenses the claim that the *narrative of continuity* is invented, not that the *practice* is illegitimate.

  4.  **Address Question 2: The Principled Line (Invented vs. Real):**
      *   *Analysis:* If all traditions are revised, is there a line?
      *   *Theory:* Hobsbawm distinguishes between "custom" (flexible, functional) and "Tradition" (invariant, ritualistic). But the real line is often *social acceptance*.
      *   *The "Amended Charge":* This is the killer fact. The 1979 authors are dead/gone. The text is changing *organically* now (Somali/Hmong verses). This moves it from "top-down engineering" to "living practice."
      *   *Conclusion:* The line isn't between "old" and "new." It's between "imposed/stagnant" and "lived/evolving." The Rekindling started as engineered (1979) but has become lived (2009+). The 1887 claim is the fossilized shell; the 2009 amendments are the living organism.

  5.  **Address Question 3: "Imagined" and the Reporter's Role:**
      *   *Analysis:* "Imagined" $\neq$ "False." It means "constructed in the mind."
      *   *Implication for Reporter:* Don't be a fact-checker of myths; be an ethnographer of meaning. Why does the city *need* the 1887 date? What work does that myth do?
      *   *Shift:* From "Debunking" to "Understanding the Function of the Myth."
