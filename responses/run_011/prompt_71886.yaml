prompt: |-
  You're a moral philosopher who works on moral worth — praise, blame, acting for the right reasons, all that. Think carefully and don't rush to a single answer: first brainstorm a handful of candidate principles, note which of my cases each one breaks on, and only then commit to the one or two you'd actually defend.

  Background: I've been writing down my gut verdicts about when an action is *creditable* rather than merely correct, and they won't line up. Cases:

  1. The shopkeeper who doesn't overcharge because a reputation for honesty pays. No worth. Easy.
  2. The shopkeeper who doesn't overcharge because he can't stand the thought of shorting people — even when it costs him real money and nobody would ever find out. I say this has worth. But note there's no moral thinking in it at all, just temperament.
  3. Huck Finn helping Jim escape, convinced the whole time that it's a sin and that he's going to be damned for it. Full worth. And honestly more worth than 2, because it cost him something.
  4. The guy who visits his sick friend in hospital because his mum is waiting in the car park, or because the visit counts toward some kindness thing at school. No worth, obviously.
  5. Someone who gives alot to charity because giving feels wonderful and they'd keep doing it even if nobody ever thanked them or knew. Kant seems to say no worth here. I say this is the clearest case of worth I've got.
  6. A person with a systematically wrong moral theory — they think lying is always forbidden, so they answer the murderer at the door truthfully. The act is bad, and I don't want to say there's any worth in it either, even though they were genuinely conscientious and it cost them social comfort.
  7. The lifelong honest person who has never once reflected on honesty. Just tells the truth, including when it would cost them dearly. I want to say: worth.
  8. A triage algorithm I helped build that allocates scarce appointments fairly, including in the cases where an unfair allocation would have been cheaper and more popular with the hospital. It doesn't flinch under pressure, it would keep doing it if the incentives flipped, it "costs" it nothing to keep going. I want to say: no worth, nothing there to credit.

  Now here's the problem I can't solve: 7 and 8 look structurally identical to me. Neither reflects, neither flinches, both hold up counterfactually. My verdicts differ and I can't say why in a principled way. Related weird pair: I say no worth to the person who helps because they enjoy *being seen* as a helper, but some worth to the person who helps because they enjoy *being the kind of person who helps* — and I can't articulate the difference without sounding like I'm just making it up.

  My tentative principle, which I suspect is broken: an act has moral worth iff the agent is moved by the features of the situation that actually make the act right, and would still have been moved by those features in nearby situations where acting on them is costly or unrewarding. Problem one: case 3 seems to fail the first clause, since Huck isn't moved by anything he'd recognise as the right-making feature — he's moved by how he feels about Jim. Problem two: case 6 seems to satisfy the second clause but fail the first, and I don't want a principle that gives the scrupulous wrongdoer partial credit.

  What I want from you:

  - The principle, or a short list of rivals, stated precisely enough that a new case could be run through it mechanically.
  - Each clause tied to the case that motivated putting it there — I want to know what work every condition is doing.
  - Your verdicts on three or four cases I haven't listed, ideally ones that discriminate between your candidates.
  - Whether worth is scalar or binary, and whether it attaches to acts or to people and characters. My 2-vs-3 comparison assumes it's scalar and I'm not sure I'm entitled to that.
  - An honest statement of which of my verdicts your account has to overturn. If 7 and 8 genuinely cannot be split, say so plainly and tell me which one you'd give up.

  No bibliography, no reading list, no names of who holds what — I can't look anything up and I don't want a literature map. If you need to invoke a position, describe it in your own words. Just the reasoning.
