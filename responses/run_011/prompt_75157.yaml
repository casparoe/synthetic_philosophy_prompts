answer: |-
  A captive chimpanzee, trained to exchange lexigrams for fruit, is observed alone with a visitor after its keeper hides a tool in Box A. The chimp points to Box B and signs 'TOOL THERE' to the visitor, who then opens the empty box. When offered a banana for this direction, the chimp pushes the fruit away without eating, instead picking up a lexigram for 'RAIN'—a phenomenon absent from the windowless room—and places it beside the visitor's coat. Upon the keeper's return, the chimp signs 'KEEPER ABSENT' while looking directly at him, then quietly retrieves the hidden tool from Box A only when unobserved, displaying no physiological arousal or hunger throughout the sequence.

  ***

  **Analysis of the Design**

  **Specified Features Marked:**
  1.  **Language Test:** The arrangement of signs ('TOOL THERE', 'KEEPER ABSENT') to declare a state of affairs.
  2.  **Adaptability Test:** The response is not tied to organ disposition; it shifts from deceiving the visitor to hiding the tool based on the observer's presence.
  3.  **Neutralising Fallback (Appetite/Passion):**
      *   *Uninteresting subject:* Signing 'RAIN' in a windowless room.
      *   *Declining reward:* Pushing the banana away.
      *   *Referring to the absent:* 'RAIN' and 'KEEPER ABSENT' (when the keeper is present).
      *   *Misleading:* Directing the visitor to the empty Box B.

  **Cartesian Reply and Commitment:**
  A Cartesian can reply that the chimpanzee remains a complex *automaton*, wherein the refusal of the banana is merely a mechanical satiation reflex or a competing passion (such as fear or pride) overriding hunger, and the 'lies' are pre-disposed organic reactions to the visitor's posture. The weight of this reply bears entirely upon Descartes' commitment to **substance dualism**: the assertion that *res extensa* (matter) can simulate any finite behaviour without possessing *res cogitans* (mind), meaning that no external action, however intricate, can logically necessitate the presence of a soul.

  **The Critical Feature:**
  The single feature whose removal collapses the case back into an ordinary animal-training anecdote is the **declining of the reward**. If the chimpanzee accepts the banana, the Cartesian fallback holds firm: the sign use is 'wrung out by passion or appetite' (hunger), rendering the behaviour a conditioned reflex rather than free thought. The removal of the other features (e.g., if the animal told the truth or referred only to present objects) would leave the case intact as a challenge, because a machine that refuses food to sign about irrelevant things still breaks the appetite-drive link; however, if it eats, it becomes merely a well-trained beast seeking sustenance.

  **Strongest Objection from the Beast-Machine Defender:**
  The most formidable objection available against the experiment itself is the **problem of finite performance**. A defender may argue that no finite record of performances, however surprising, can ever establish that the first test (universal reason) has been met, because an automaton could theoretically be constructed with a sufficiently complex programme to simulate deception, absence, and disinterest within a limited domain. Since we cannot observe the infinite adaptability required of true reason, we can never rule out the possibility that the animal is merely a machine operating beyond our current comprehension of its mechanical limits.
