      *   Analogy: Proofreading a book paragraph by paragraph vs. reading the whole novel to check plot consistency. You can verify every sentence is grammatical (local) without spotting the plot hole (global). But you *can* spot the plot hole if you decompose "check plot consistency" into specific sub-queries.
