      *   *Why (3) is false:* Bounded rationality. Humans have limited context windows (working memory). Decomposition offloads memory, allowing the human to verify more *total information* than they could hold at once.
      *   *The "Assembly" Gap:* The user's pipeline has a hidden step: the assembly logic. If that's automated and unchecked, it's a vulnerability. IDA requires the *process* to be overseen, not just the data chunks.
      *   *Pricing the Abandonments:*
