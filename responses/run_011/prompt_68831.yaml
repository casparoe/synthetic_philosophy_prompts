  6.  **Synthesize the Defense of Decomposition (IDA):**
      *   IDA proponents argue that decomposition *plus* a mechanism for checking consistency (recursion) solves this.
      *   The "Amplified Human" isn't just Human + Parts. It's Human + Parts + *Management of Interactions*.
      *   If the assembly step is unverified, the decomposition is incomplete.
      *   The "Distillation" step trains a model to mimic the *entire* process, including the consistency checks, ideally making the model capable of spotting the global error eventually.
      *   Key distinction: *Local Alignment* vs. *Global Alignment*. Decomposition helps Local. Global requires a higher-level oversight step (which can itself be decomposed).

  7.  **Address the User's Specific Request:**
