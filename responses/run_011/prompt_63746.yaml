          6.  Assess consistency: If no single rule fits, identify the break point and what must be sacrificed.

  2.  **Analyze the 7 Existing Rulings:**
      *   *R1 (Procrastination):* Behavior (delaying) $\rightarrow$ NOT evidence. *Reason:* Avoidance pattern/panic, not genuine preference.
      *   *R2 (Defaults):* Behavior (keeping default) $\rightarrow$ NOT evidence. *Reason:* Choice architecture/inertia, not active choice.
      *   *R3 (Diet):* Behavior (takeout) vs. Statement (eat better) $\rightarrow$ IS evidence (Behavior wins). *Reason:* Behavior is a choice, statement is aspiration.
      *   *R4 (Free Trial):* Behavior (not canceling) $\rightarrow$ NOT evidence. *Reason:* Inaction under friction/hassle, not choosing.
      *   *R5 (Work):* Behavior (80hrs) + Statement (love job) $\rightarrow$ IS evidence. *Reason:* Alignment, high confidence.
      *   *R6 (Screening):* Behavior (declining) + Statement (refuse discuss) $\rightarrow$ IS evidence. *Reason:* Consistent avoidance is a preference (meta-preference).
      *   *R7 (Framing):* Behavior (Gain vs. Loss) $\rightarrow$ NOT evidence. *Reason:* Instability due to framing, not outcome preference.

