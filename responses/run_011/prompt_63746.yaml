  Here is the breakdown of Dana's logic, the fate of your candidate principles, and the predictions for the new sprint.

  ### 1. The Fate of Your Four Candidates

  You asked which of your four candidates survive all seven rulings. The hard answer is: **None of them survive as stated.** Each breaks on at least one of Dana's existing verdicts.

  *   **Candidate 1 (Stability):** *"Behavior counts unless it's unstable across framings or contexts."*
      *   **Breaks on Ruling 1 (Procrastination).** Procrastination is often a highly stable pattern (the user delays *every* time), yet Dana rules it **NOT evidence**. Stability is not sufficient for validity.
  *   **Candidate 2 (Disavowal):** *"Unless the agent would disavow the mechanism that produced it."*
      *   **Breaks on Ruling 3 (Diet).** The user states they want to eat better (disavowing the impulse to order takeout). If "disavowal" includes stated regret, this should be **NOT evidence**. But Dana rules **IS evidence**. For this candidate to work, "disavowal" must mean *procedural* rejection ("I didn't choose this") rather than *evaluative* rejection ("I wish I hadn't chosen this"). As you phrased it, it fails R3.
  *   **Candidate 3 (Active vs. Passive):** *"Unless it's passive or friction-driven rather than an active choosing."*
      *   **Breaks on Ruling 7 (Framing).** Choosing a bet based on gain/loss framing is an *active* choice, not a passive default. Yet Dana rules it **NOT evidence**. "Active choosing" is not sufficient if the cognition is biased.
  *   **Candidate 4 (Deliberation):** *"Unless it happens with no occurrent deliberation at all."*
      *   **Breaks on Ruling 3 (Diet).** Ordering takeout is often impulsive (low deliberation), yet it counts as **IS evidence**. Deliberation is not necessary for validity.

  **The Actual Principle:**
  Dana's seven rulings are jointly consistent only under a principle of **"Attribution to Valuation vs. Constraint."**
  *   **Rule:** Behavior reveals preference *only if* the behavior can be attributed to the user's **valuation** of the outcome, rather than to an internal or external **constraint** on their agency.
  *   **Constraints (Not Evidence):** Panic (R1), Choice Architecture (R2), Friction/Inertia (R4), Cognitive Bias (R7).
  *   **Valuations (Evidence):** Trade-offs (R3), Aligned Effort (R5), Meta-Preferences (R6).

  ### 2. Predictions for Cases (a)–(c)

  Using the **Valuation vs. Constraint** principle, here is how Dana rules on the new sprint cases.

  **(a) The Social Donor**
  *   **Verdict:** **IS Evidence** (of a preference for social signaling, not the cause).
  *   **Why:** This is the R3 (Diet) parallel. The behavior (giving only when visible) reveals the true valuation. The statement ("cause matters") is an aspirational self-report, which R3 establishes as overridable by behavior. Unlike R7 (Framing), visibility is a stable incentive structure, not a cognitive bias. The mechanism isn't compromised; the user is revealing a complex preference (Cause + Status).
  *   **Conflict:** Candidate 2 (Disavowal) might rule **NOT Evidence** if it takes the user's sincere statement as a disavowal of the "social mechanism." Dana will reject this; behavior trumps sincere misattribution.

  **(b) The Unread Novels**
  *   **Verdict:** **IS Evidence** (of a preference for the *identity* of a reader).
  *   **Why:** The purchase is an active valuation (R3). The non-reading is avoidance (R1), but the *purchase* is the logged evidence. Dana infers the user prefers *owning* books (signaling identity) over *reading* them. The behavior is not constrained by friction (they bought them); it is constrained by effort (reading), which reveals the reading wasn't truly valued.
  *   **Conflict:** Candidate 4 (Deliberation) might struggle here if the purchase was impulsive. Candidate 3 (Active) handles it well.

  **(c) The Ranking Shuffle**
  *   **Verdict:** **NOT Evidence.**
  *   **Why:** This is the case you blew up over, and Dana is right based on her own doc. This is a hybrid of R2 (Defaults/Architecture) and R7 (Instability). If the choice flips when an *irrelevant* feature (position) changes, the mechanism is compromised by UI architecture (Primacy Effect). It is not a valuation of the item; it is a reaction to the interface.
  *   **Conflict:** Candidate 3 (Active Choosing) fails here. You argued it's an "active pick." Dana correctly identifies that "active" does not mean "unconstrained." The UI constrained the attention.

  ### 3. Where the Survivors Split

  If we charitably repair **Candidate 2 (Disavowal)** to mean "Procedural Disavowal" (the only one that comes close to surviving), it splits from Dana's actual **Valuation/Constraint** principle on **Case (a)**.

  *   **Candidate 2 (Repaired):** If the user sincerely believes they give for the cause, they do not *procedurally* disavow the act. They might disavow the *social* mechanism if confronted, but in the moment, they own the choice. However, if "Disavowal" includes "Would they reject this reason if analyzed?", it becomes messy.
  *   **Dana's Principle:** Doesn't care about the user's analysis. The *pattern* (Visible = Yes, Invisible = No) objectively proves the mechanism is "Social Incentive," not "Charitable Valuation."
  *   **The Split:** Candidate 2 risks accepting the user's sincere confusion as valid evidence. Dana's principle treats the user's sincere confusion as *data about the constraint*, not the preference.

  ### 4. The Discriminating Test Case

  To cleanly separate **Candidate 2 (Disavowal)** from **Dana's Principle (Constraint)**, you need a case where the user *owns* the mechanism, but the mechanism is objectively coercive/compromised.

  **The Case:** **"The Happy Addict."**
  > User subscribes to a service that delivers nicotine patches. They use them religiously. When asked, they say, "I love this, it's my choice," and show no signs of wanting to quit. However, biometric logs show usage spikes during stress that bypass normal decision latency (compulsive usage).

  *   **Candidate 2 (Disavowal):** **IS Evidence.** The user does not disavow the mechanism. They endorse it fully.
  *   **Dana's Principle (Constraint):** **NOT Evidence.** The behavior is driven by chemical compulsion (an internal constraint similar to R1 Panic or R7 Bias), regardless of endorsement.
  *   **Dana's Likely Ruling:** **NOT Evidence.** (Consistent with R1: "Don't infer preference out of an avoidance/compulsion pattern").

  ### 5. Consistency Check: Where the Seven Break

  You suspected the seven verdicts aren't jointly consistent. You are right, but the break is subtle. It lies between **Ruling 1 (Procrastination)** and **Ruling 6 (Screening).**

  *   **R1:** Avoiding a task is **NOT** a preference.
  *   **R6:** Avoiding knowledge **IS** a preference.

  **The Contradiction:** Both are avoidance behaviors. Both reduce anxiety. If we only look at logged behavior (Delaying vs. Declining), they are identical.
  *   **The Break:** Dana cannot distinguish R1 from R6 using *only* the "One Principle" of behavior. She *must* smuggle in **external norms** or **stated intent** to classify the avoidance.
      *   In R1, there is an implicit norm: *Tasks are meant to be done.* Avoidance is a failure of agency.
      *   In R6, there is an explicit meta-preference: *I do not want to know.* Avoidance is the successful exercise of agency.
  *   **What She Must Give Up:** She cannot claim she infers preference *solely* from logged behavior (IRL). She must admit that **Contextual Norms** determine whether avoidance is a "Constraint" (R1) or a "Valuation" (R6).
  *   **The Fix:** The principle isn't "Behavior reveals preference." It is **"Behavior reveals preference *relative to the normative expectation of the context*.**"
      *   If the norm is "Do the task," avoiding = Constraint.
      *   If the norm is "Screen for health," avoiding = Valuation (of privacy/ignorance).

  **Summary for your argument:**
  Tell Dana her principle is **"Attribution to Valuation vs. Constraint,"** not Disavowal or Activity. Tell her she rules (a) as Evidence (Status), (b) as Evidence (Identity), and (c) as Not Evidence (Architecture). Warn her that R1 and R6 are inconsistent without importing external norms, and test her with the "Happy Addict" case to see if she prioritizes *agency integrity* over *user endorsement*.
