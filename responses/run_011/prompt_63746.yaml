          *   *Verdict:* Plausible but needs refinement on what counts as disavowal.
      *   *Candidate 3: "Unless it's passive or friction-driven rather than an active choosing."* (Agency/Effort)
          *   Checks: R2 (Defaults) - Passive. Fits. R4 (Free Trial) - Friction/Inaction. Fits. R1 (Procrastination) - Is this passive? It's "avoidance." Often viewed as a failure of agency. Fits. R7 (Framing) - Is this passive? It's cognitive bias. Maybe not "active choosing" in a rational sense.
          *   *Fails:* R3 (Diet). Ordering takeout is active choosing. Fits. R5 (Work). Active. Fits. R6 (Screening). Declining is active (clicking "no"). Fits.
          *   *Problem:* R7. Framing effects happen during active choosing. You actively pick A over B, but switch if framed differently. Is that "passive"? Not really. It's active but irrational/unstable.
