answer: |-
  ### Part 1: Verification of Voting Math

  **Threshold:** 3 States representing $\ge$ 65% of 52.4 million population (34.06 million).

  **Measure A (Registry):**
  *   **Passage Coalition:** Bremme (22) + Ostvale (14) + Sabley (2.4) = 38.4m (73%). **Valid.**
  *   **Blocking Coalition:** If Bremme votes **No**, the maximum remaining population is Ostvale (14) + Kelvar (9) + Tirn (5) + Sabley (2.4) = 30.4m. This is less than 65%. Therefore, Bremme holds a *de facto* veto. If Bremme votes **No**, the measure fails.
  *   **Degeneracy:** Not mathematically degenerate, but highly asymmetric. Bremme must be engaged for passage.

  **Measure B (Pipeline):**
  *   **Passage Coalition:** Bremme (22) + Ostvale (14) + Tirn (5) = 41.0m (78%). **Valid.**
  *   **Blocking Coalition:** Kelvar (9) + Sabley (2.4) + [Any one of Bremme/Ostvale/Tirn]. If Bremme votes **No**, Measure B fails (see above).
  *   **Degeneracy:** No. Kelvar and Sabley cannot pass it alone, nor can they block it alone without Bremme.

  **Conclusion:** Both measures are viable but depend heavily on Bremme. This mirrors the real EU's reliance on large member states for Qualified Majority Voting.

  ***

  ### Part 2: Minute-by-Minute Timeline (55 Minutes)

  **0:00–0:05 | Setup & Distribution**
  *   **Action:** Desks arranged in three clusters (Council Circle, Assembly Row, Secretariat Table). Hand out Page 1 (Rules) and Page 2 (Roles).
  *   **Script:** "Welcome to the Compact of Vess. You are not students today; you are officials. You have 55 minutes to solve a drought crisis. Read your roles silently. Do not show your 'Private Interest' to anyone. Council Delegations: sit together. Assembly: sit together. Secretariat: sit together."

  **0:05–0:15 | Faction Caucusing**
  *   **Action:** Groups separate. Teacher circulates.
  *   **Script:** "Council: Review your national instructions. Assembly: Calculate your legitimacy. Secretariat: Draft your opening statement. You cannot negotiate across groups yet."
  *   **Contingency:** If Debate students dominate Council, remind them: "The Adviser holds the Instruction Card. The Delegate cannot speak against the Card."

  **0:15–0:30 | Negotiation Round 1 (Measure A)**
  *   **Action:** Open floor. Secretariat proposes Measure A.
  *   **Script:** "The Secretariat will now propose Measure A. Council and Assembly may amend or reject. Remember the Ratchet: if you pass this, water policy is now Compact law forever."
  *   **Goal:** Pass Measure A to establish procedure.

  **0:30–0:32 | The News Flash (Intervention)**
  *   **Action:** Teacher silently hands one-paragraph bulletins to **Kelvar Adviser** and **Sabley Adviser**.
  *   **Script:** (No announcement. Just deliver the paper.)
  *   **Content:** *Kelvar:* "Domestic election imminent. Farmers demand direct cash, not data registries. Instruction is stale." *Sabley:* "Villages to be flooded protest. Instruction says 'Protect Land,' but pipeline requires land."

  **0:32–0:45 | Negotiation Round 2 (Measure B)**
  *   **Action:** Secretariat proposes Measure B. Tension should be higher.
  *   **Script:** "Measure B is on the floor. This costs 60 units. Budget is tight. Assembly, you represent the people, but you cannot write the law. Council, you are bound by instructions that may be outdated."
  *   **Goal:** Force a hard choice on sovereignty vs. need.

  **0:45–0:50 | The Vote & Freeze**
  *   **Action:** Call for final votes. Count hands/states.
  *   **Script:** "Council Delegates, cast your votes based on instructions. Assembly, signal confidence. Secretariat, announce the result."
  *   **Contingency:** If shouting match occurs: "Freeze. Pencils down. This friction is the lesson. We move to debrief now."

  **0:50–0:55 | Transition to Debrief**
  *   **Action:** Students remain seated. Teacher moves to whiteboard.
  *   **Script:** "Stop acting. Return to being students. We are going to analyze why that felt easy or hard."

  ***

  ### Part 3: Printable Page 1 (Rules of the Compact)

  **THE COMPACT OF VESS: INSTITUTIONAL RULES**

  **1. The Secretariat (3 Officials)**
  *   **Power:** Only body that can propose laws. Controls drafting. Can withdraw proposals.
  *   **Term:** 9 years, appointed by Council, confirmed by Assembly.
  *   **Goal:** Expand Compact competence using the Ratchet.

  **2. The Assembly (5 Caucus Chairs)**
  *   **Power:** Can amend or reject laws by absolute majority (31 of 60 seats). **Cannot propose laws.**
  *   **Election:** Elected from one Compact-wide closed list. No local districts.
  *   **Legitimacy:** Last election had 38% turnout. You claim to speak for "The People of Vess."

  **3. The Council (5 Delegations of 2)**
  *   **Power:** Votes on laws. Each state has 1 vote.
  *   **Voting Rule:** Passage requires **3 States** representing **$\ge$ 65% of Compact Population**.
  *   **Constraint:** Delegates are bound by written Instructions from national parliaments. Advisers hold the Instruction Card.
  *   **Reserved Powers:** Tax, Borders, Defense require Unanimity (5/5 states).

  **4. The Budget & Ratchet**
  *   **Budget:** 100 Units total. Contributed by population. Bremme and Ostvale receive an 8-unit rebate each.
  *   **The Ratchet:** If the Compact passes a measure in a policy area (e.g., Water), that area becomes **Exclusive Compact Competence**. States can never legislate there again.

  **5. Current Crisis**
  *   **Situation:** Five-year drought.
  *   **Measure A:** Hydrological Registry (Data sharing). Triggers Ratchet on Water. Low Cost.
  *   **Measure B:** Pipeline/Reservoir (Infrastructure). Floods Sabley villages. Cuts Kelvar irrigation. Cost: 60 Units.

  ***

  ### Part 4: Printable Page 2 (Role Briefs)

  **COUNCIL DELEGATIONS (10 Students)**
  *   **Bremme (22m):** *Instruction:* Protect economy; avoid new costs. *Private Interest:* You want water security but refuse to pay more. *Success:* Pass measures that help you without costing you.
  *   **Ostvale (14m):** *Instruction:* Host capital, maintain stability. *Private Interest:* You want the Secretariat to succeed to justify hosting them. *Success:* Pass at least one measure to show Compact works.
  *   **Kelvar (9m):** *Instruction:* Protect farm subsidies. *Private Interest:* Your instruction is old; farmers now need cash, not subsidies. *Success:* Get direct aid, even if you break instruction.
  *   **Tirn (5m):** *Instruction:* Control upstream water rights. *Private Interest:* You can sell water to the Compact for profit. *Success:* Maximize leverage over downstream states.
  *   **Sabley (2.4m):** *Instruction:* Protect land sovereignty. *Private Interest:* Your villages will flood if Measure B passes. *Success:* Stop Measure B, even if you stay poor.

  **ASSEMBLY CAUCUS CHAIRS (5 Students)**
  *   **Caucus 1 (20 seats):** *Instruction:* Support green initiatives. *Private Interest:* You want to look powerful but have no law-writing power. *Success:* Force an amendment that makes you look relevant.
  *   **Caucus 2 (15 seats):** *Instruction:* Protect taxpayer money. *Private Interest:* You know turnout was only 38%. You feel illegitimate. *Success:* Block a costly measure to show fiscal responsibility.
  *   **Caucus 3 (10 seats):** *Instruction:* Support regional development. *Private Interest:* You represent the poorest areas but vote Compact-wide. *Success:* Ensure Sabley/Kelvar get help.
  *   **Caucus 4 (10 seats):** *Instruction:* Support Secretariat efficiency. *Private Interest:* You are allies of the Secretariat but elected by low turnout. *Success:* Pass Measure A to empower Secretariat.
  *   **Caucus 5 (5 seats):** *Instruction:* Protect national sovereignty. *Private Interest:* You believe the Council should rule, not the Assembly. *Success:* Block the Ratchet mechanism.

  **SECRETARIAT OFFICIALS (3 Students)**
  *   **Chief Official:** *Instruction:* Expand Compact power. *Private Interest:* You are unelected but hold the only pen. *Success:* Trigger the Ratchet on Water.
  *   **Legal Drafter:** *Instruction:* Ensure measures are legal. *Private Interest:* You can hide costs in the text. *Success:* Pass Measure B despite the cost.
  *   **Political Liaison:** *Instruction:* Manage Assembly relations. *Private Interest:* You know the Assembly is weak. *Success:* Get Assembly to approve without changes.

  ***

  ### Part 5: Debrief Sequence (Socratic)

  **Phase 1: The Experience (5 Minutes)**
  1.  "Council Delegates, raise your hand if you wanted to vote differently than your Instruction Card told you."
  2.  "Assembly Chairs, raise your hand if you felt you actually represented a specific voter."
  3.  "Secretariat, raise your hand if you felt accountable to anyone in this room."

  **Phase 2: The Structure (5 Minutes)**
  4.  "Who had the power to start a law?" (Secretariat). "Who had the power to stop it?" (Council). "Who had the power to change it?" (Assembly, but limited).
  5.  "Measure A triggered the Ratchet. Did anyone notice that you just voted to remove your own future power to legislate on water?"
  6.  "Kelvar and Sabley Advisers: When you got the news bulletin, could you change your vote? Why not?"

  **Phase 3: The Diagnosis (5 Minutes)**
  7.  "If the people of Vess are unhappy with the Pipeline flooding villages, who do they fire? The Secretariat? They aren't elected. The Council? They are bound by instructions. The Assembly? They can't propose laws."
  8.  "We have a government that can regulate water, tax budgets, and override states. But the voters cannot clearly reward or punish the decision-makers."
  9.  "In political science, when a governing body has significant power but lacks a clear chain of accountability to the voters, what do we call that?"
  10. **Reveal:** "This is the **Democratic Deficit**."

  ***

  ### Part 6: Mapping Fiction to Reality

  | Fictional Rule | Real EU Feature | Standard Criticism | Strongest Defense |
  | :--- | :--- | :--- | :--- |
  | **Secretariat** (Sole proposal power, 9yr term) | **European Commission** (Monopoly on initiative, 5yr term) | Unelected bureaucrats set the agenda; too much power without a ballot box. | **Independence:** Prevents national populism from hijacking the agenda; ensures proposals serve the union, not one state. |
  | **Assembly** (Closed list, no districts, weak initiative) | **European Parliament** (Proportional representation, transnational lists in some views) | MEPs are distant; voters don't know who represents them; "second-order" elections. | **Efficiency:** National districts would favor large states; transnational lists encourage pan-European parties over national interests. |
  | **Council** (Bound by instruction, 65% threshold) | **Council of the EU** (National ministers, Qualified Majority Voting) | National governments hide behind "Brussels" when things go wrong; opaque decision-making. | **Legitimacy via Nations:** Citizens trust national PMs more than EU officials; national parliaments scrutinize the instructions. |
  | **The Ratchet** (Exclusive competence) | **Exclusive Competence / Subsidiarity** (Treaty expansions) | "Competence Creep": The Union slowly steals power from states without voters noticing. | **Necessity:** Some problems (trade, environment, water) cross borders; fragmented rules create chaos and inefficiency. |
  | **Rebates** (Bremme/Ostvale discount) | **UK Rebate / Net Contributor Mechanisms** | Rich states buy their way out of solidarity; undermines the "union" concept. | **Fairness:** Prevents rich states from leaving; ensures net contributors remain willing to fund the budget. |
  | **38% Turnout** | **EP Election Turnout** (Varies, often ~50%, lower in some states) | Apathy proves citizens don't care about the Union; low mandate. | **Permissive Consensus:** Citizens accept outcomes as long as economies work; they vote nationally for big issues. |

  ***

  ### Part 7: Predictable Failure Modes & Fixes

  1.  **The "Bremme Veto" Stall:**
      *   *Problem:* Bremme realizes they are pivotal and refuses to engage, stalling the sim.
      *   *Fix:* Whisper to Bremme: "If nothing passes, the drought ruins your economy too. You need a win."
  2.  **Debate Club Domination:**
      *   *Problem:* Vocal students ignore role constraints and argue philosophy.
      *   *Fix:* Enforce the "Instruction Card" rule physically. If a Delegate argues against their card, tap the card and say, "Your parliament forbids this."
  3.  **Assembly Apathy:**
      *   *Problem:* Quiet students in Assembly realize they can't propose laws and disengage.
      *   *Fix:* Give them a specific task in the first 5 minutes: "Calculate the exact number of votes needed to block Measure B."
  4.  **Math Confusion:**
      *   *Problem:* Students miscalculate the 65% threshold.
      *   *Fix:* Write the threshold number (34.1 million) large on the whiteboard at the start.
  5.  **Early Finish:**
      *   *Problem:* Measures pass too quickly.
      *   *Fix:* Introduce a "Budget Crisis." If they pass Measure B (60 units), tell them the Rebates must be cut to pay for it. Force a renegotiation.

  ***

  ### Part 8: Limitations & Facilitator Compensation

  **What the Simulation Cannot Reproduce:**
  1.  **Time:** The EU took 50 years to build this complexity. The sim is 55 minutes. Students may feel the rules are arbitrary rather than evolved compromises.
  2.  **Public Sphere:** There is no European newspaper or TV station. In reality, the lack of a shared media space is a huge driver of the deficit.
  3.  **Party Politics:** Real MEPs vote in transnational political groups (Socialists, Conservatives), not just national blocs. The sim simplifies this to national instructions.
  4.  **Acceptance:** Real citizens accept outcomes they didn't vote for because of stability and prosperity (Permissive Consensus). Students will likely reject "unfair" outcomes immediately.

  **What You Must Supply (Facilitator Notes):**
  *   **During Debrief:** Explicitly explain that in the real EU, citizens often judge the Union by their national leader's performance, not the MEPs. This explains why low turnout persists without collapse.
  *   **During Debrief:** Clarify that the "Ratchet" isn't usually one vote, but a slow accumulation of court rulings and treaties over decades.
  *   **During Debrief:** Acknowledge that the "Deficit" is a feature for some (insulation from populism) and a bug for others (lack of accountability). There is no consensus on the solution.
  *   **Closing:** Remind them that the EU is unique in history. No other organization has this much power without being a single country. The tension they felt in the room is the price of that experiment.
