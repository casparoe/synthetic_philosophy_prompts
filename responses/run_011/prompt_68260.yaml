answer: |-
  This is a high-stakes brief. The funders are explicitly warning against the two standard failure modes of this subfield: exegetical stalemate (Winner vs. Latour) and normative banality (design ethics). Your diagnosis of the three registers (Distributive, Agential, Contestatory) is a strong heuristic, but if left untested, it risks becoming a dissolution strategy ("they were just talking past each other") rather than a substantive resolution.

  To satisfy the remit, the programme must establish the *ontology* of artefactual politics before it can assign *responsibility* or *history*. Given your fieldwork constraints (black-box model, access to specs and appeals), the questions must be answerable through interpretive analysis of boundaries and disputes, not causal auditing.

  Here is the ranked research agenda, the justification for the ordering, and the blunt assessment of what to cut.

  ### The Ranked Agenda

  **1. The Boundary Problem (b)**
  *Is the politics of a component (a threshold, a weighting) the same kind of thing as the politics of the system, and can any account of artefactual politics avoid committing itself to a mereology that says where an artefact begins and ends?*

  *   **Dependency:** Critical. Every other question presupposes an answer to "what is the 'it' that has politics?" If the politics resides in the weighting algorithm but not the threshold, or in the procurement spec but not the code, the unit of analysis shifts.
  *   **Tractability:** High. You have the eligibility specification and procurement documents. These documents explicitly define the system's boundaries (what is in scope, what is vendor-protected, what is officer discretion). The fieldwork postdoc can map where officers draw the line between "the system's decision" and "my decision."
  *   **Case Impact:** Decisive. In the housing case, if the politics is in the *threshold* (a mere number), it is distributive. If it is in the *workflow* (how the score is integrated), it is agential. Resolving this determines whether the network critiques the math or the management.
  *   **Neglect:** High. STS loves networks and actor-networks, but mereology (the study of parts and wholes) in political ontology is under-theorized. We assume "the algorithm" is the object, but procurement law often treats the "service" as the object.
  *   **Weighting:** I am prioritising **Dependency** here. You cannot answer where politics is inscribed (a) or how it is settled in use (f) if you cannot define the object that bears it.

  **2. The Register Separability Question (New)**
  *Do the distributive, agential, and contestatory dimensions of politics necessarily travel together in a single artefact, or can an artefact possess one without the others?*

  *   **Why this displaces (e):** The Determinism question (e) is historical/exegetical. The funders have ruled that out. This new question directly tests your working diagnosis.
  *   **Dependency:** High. If these registers can come apart, then Winner's thesis might be true in the agential register but false in the distributive one. This prevents the volume from collapsing into a "everyone is partly right" compromise.
  *   **Tractability:** High. The fieldwork case is perfect for this. The *specification* might be contestatory (open to tender), the *model* might be agential (black-boxed), and the *outcome* might be distributive (who gets housing). You can track these separately.
  *   **Case Impact:** High. It allows you to say, "This system has agential politics (it forecloses appeals) but lacks contestatory politics (no mechanism for revision)," which is a more precise critique than "it is political."
  *   **Neglect:** Very High. Most literature assumes politics is a monolithic property. Distinguishing the registers ontologically is the key to moving past the Winner/Latour deadlock.
  *   **Weighting:** I am prioritising **Philosophical Load**. This is the question that makes the volume non-exegetical. It forces a new taxonomy.

  **3. The Indeterminacy Question (f)**
  *Does the claim that artefacts are texts whose meaning is settled in use render the politics question unanswerable, or does it merely relocate that question into use, and what would settle the dispute?*

  *   **Dependency:** Medium-High. This dictates the fieldwork postdoc's method. If politics is settled in use, and you cannot audit use, you must study the *site of settlement* (the appeals process).
  *   **Tractability:** Medium. You cannot audit long-term behavior, but you *can* interview appeals officers. They are the hermeneuts who settle the meaning of the system's output. Their discretion is the "use."
  *   **Case Impact:** High. If politics is fixed in the spec, the appeals officers are irrelevant. If politics is settled in use, the officers *are* the political actors, not the designers. This flips the script on the municipal authority.
  *   **Neglect:** Medium. SCOT (Social Construction of Technology) covered this, but rarely with the constraint of a commercially protected black box.
  *   **Weighting:** I am prioritising **Tractability**. This question saves the fieldwork from the "we can't see the code" problem. It makes the lack of audit access a feature, not a bug: it forces focus on the human interpretation layer.

  **4. The Inscription Question (a)**
  *Can a normative commitment survive into an artefact independently of the intentions of those who designed it, or is such ascription always a matter of uptake — and, in a case like ours, is the true locus of inscription the specification document rather than the system?*

  *   **Dependency:** Medium. It relies on (b) to define the artefact and (f) to define the role of use.
  *   **Tractability:** High. You have the procurement docs. You can compare the *stated* normative goals in the tender with the *operational* constraints in the spec.
  *   **Case Impact:** Medium. It clarifies where the blame lies (designers vs. procurers), but is less ontologically radical than (b) or (2).
  *   **Neglect:** Low. This is the classic Winner vs. Latour ground.
  *   **Weighting:** I am prioritising **Case Impact** over Neglect. By reframing it as "Spec vs. System" rather than "Designer vs. User," you avoid the exhausted debate and make it tractable for your specific data access.

  **5. The Technical Code Question (c)**
  *Does Feenberg's notion of a technical code do genuine explanatory work, or does it merely redescribe who is permitted to participate in setting standards?*

  *   **Dependency:** Low. This is a supporting question for the Distributive register.
  *   **Tractability:** High. Procurement rules are literally technical codes.
  *   **Case Impact:** Low-Medium. It explains *why* the system looks the way it does, but not *what* the politics is.
  *   **Neglect:** Medium. Feenberg is often cited but rarely operationalized in empirical STS.
  *   **Weighting:** This is the "context" question. It is necessary for the volume's completeness but not its core argument.

  ---

  ### The Cut: Question (d) and (e)

  **Cut (d) The Responsibility Question.**
  Your suspicion is correct. This question is overrated and should be excised from the core programme.
  *   **Reasoning:** "Artifacts have politics" is an ontological claim. "Who is responsible" is a normative/legal claim. Conflating them is a category error that leads to the "many-hands" muddle. You can resolve the ontology of artefactual politics without resolving the ethics of blame.
  *   **Strategic Risk:** Including this invites the volume to devolve into a standard "ethics of AI" checklist, which the funders explicitly warned against. It presupposes the thesis is true rather than testing *if* it is true.
  *   **When to revive:** Only if a **court decision on automated eligibility** occurs during the three years. If a judge rules on liability, (d) jumps to #1. Until then, it is a distraction.

  **Cut (e) The Determinism Question.**
  *   **Reasoning:** The funders stated the Winner/Joerges/Latour exchange is exhausted. This question is purely exegetical. It does not change the description of the municipal case. It is intellectual history, not research.

  ---

  ### Dynamic Factors: What Shifts the Ranking?

  You need to tell the funders you are agile. Here is how the agenda shifts over 18 months:

  1.  **A credible empirical result about officer discretion:** If the fieldwork postdoc finds appeals officers have *zero* discretion (they rubber-stamp the system), **Question (f) Indeterminacy** drops. The politics is fixed in the code/spec. **Question (a) Inscription** rises to #2, as the spec becomes the sole locus of power.
  2.  **A change in public procurement rules:** If the government mandates "explainable AI" in procurement, **Question (c) Technical Code** rises. The "code" becomes a legal object, not just a philosophical one.
  3.  **A shift in the philosophy of AI agency:** If the philosophical postdoc finds new work arguing that black-box models constitute a new ontological category (not just tools, but agents), **Question (b) Boundary** becomes even more urgent. The boundary between "tool" and "agent" is where the politics hides.
  4.  **A court decision on automated eligibility:** As noted, this resurrects **Question (d) Responsibility**. If a court assigns liability, the philosophical debate on responsibility is no longer abstract; it is doctrinal.

  ### Critique of Your Diagnosis (The Three Registers)

  You asked me to attack your working diagnosis. Here is the risk: **The Register Diagnosis is too clean.**

  By distinguishing Distributive, Agential, and Contestatory registers, you risk implying they are separable compartments. In the municipal housing case, they are likely entangled. A *threshold* (Agential: you cannot apply if below score) creates a *distribution* (only certain demographics pass) which forecloses *contestation* (if you don't pass, you never see the appeals officer).

  If you treat them as merely distinct "registers" of debate, you might miss how artefactual politics *generates* the confusion. The artefact might *force* these registers to collapse. For example, a black-box model makes the Agential (how it acts) inaccessible, which makes the Contestatory (challenging it) impossible, which hides the Distributive (who loses).

  **Recommendation:** Do not just use the registers to sort the literature. Use the municipal case to test if the registers *can* be separated. If your fieldwork shows that changing the contestatory mechanism (appeals) alters the distributive outcome without changing the code, your diagnosis is vindicated. If it shows they are inextricably linked, your diagnosis needs refinement. Make *that* tension the engine of the edited volume.

  ### Summary for the Funders

  This agenda moves from **Ontology (Boundary)** to **Taxonomy (Registers)** to **Method (Indeterminacy)**. It respects the constraint that we cannot see the code by focusing on where the code is defined (specs) and where it is interpreted (appeals). It avoids the moralizing trap of "responsibility" until the ontology is settled. It treats the "deadlock" not as a confusion to be dissolved, but as a hypothesis to be tested against the concrete reality of a housing authority.

  This is not a survey of who said what. It is a protocol for determining what kind of thing we are looking at.
