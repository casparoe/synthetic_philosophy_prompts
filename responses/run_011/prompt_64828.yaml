answer: |-
  We submit this record of our adversarial collaboration to clarify the structure of our disagreement regarding the regress problem of epistemic justification. Our aim was not to force a concession but to isolate the precise point of divergence so that future inquiry might address it directly. We begin by stating the claims we both endorse, wording them carefully so that neither of us would wish to walk them back later. First, we both accept that the regress problem arises because justification is transmissive, meaning that for a belief to be justified, it must be held on the basis of reasons. Second, we agree that many beliefs are indeed held on the basis of others, forming chains of reasoning. Third, we agree that a chain of reasons which literally loops back on itself, such that a belief ultimately supports itself through a circle of intermediaries, is not justificatory. Fourth, we agree that a belief held for no reason at all, where the chain simply terminates without further support, is not justified. We note here that a coherentist would also sign the claims regarding basing relations and the insufficiency of arbitrary stops, but would reject our shared claim that circularity fails to justify, and this helps us see that the real fault line between us is not about whether reasons are needed, but about what counts as having one.

  Having established this common ground, we turn to the disagreement, which we have phrased so that each camp accepts the description of its own view. The live dispute concerns what having a reason requires. The foundationalist maintains that the backing belief must be present in the subject's actual doxastic economy, either occurrently or as a stored disposition, whereas the infinitist maintains that it is enough that a further reason would be produced on request however far down one pushes. The foundationalist worries that the infinitist is writing promissory notes that never get paid, while the infinitist worries that the foundationalist's basic beliefs are just the spot where the questioning is stopped by decree. To test this, we agreed to react to a specific case before comparing notes. Suppose there is an archive, which might be a person, a lab, or a running system, that holds no finite stock of reasons but can, for any belief you point at, produce a further supporting belief on demand, indefinitely, with no repeats and no last entry. We call the resulting state justification in motion, as against justification at rest. We asked ourselves whether the archive's keeper has justified beliefs, and if not, what exactly is missing, and we each wrote down our answer before seeing the other's.

  The foundationalist answered that the keeper does not have justified beliefs because the capacity to produce reasons is not the same as the possession of reasons, and without a finite base of actual stored beliefs, the chain of justification never actually begins. The infinitist answered that the keeper does have justified beliefs because the ability to generate non-repeating reasons on demand satisfies the requirement for an endless chain of reasons, and denying this would be to privilege psychological storage over logical structure. For this crux, we both agree that the Finite Mind Objection bears on it, which argues that human beings cannot hold infinitely many beliefs. The foundationalist predicts this argument will show that infinitism is psychologically impossible and therefore epistemically irrelevant, while the infinitist predicts this argument will show only that humans are imperfect instantiations of the ideal justificatory structure, without undermining the structure itself. We also agree that the Arbitrary Stop Objection bears on this crux, which argues that stopping at basic beliefs is dogmatic. The foundationalist predicts this argument will show that foundationalism requires a plausible account of non-inferential justification to avoid dogmatism, while the infinitist predicts this argument will show that foundationalism cannot avoid dogmatism because any stop is arbitrary compared to the potential for further reasons.

  We have also considered whether some of this turns out to be an argument about words, and we identify the term possession as the part that is verbal, because if possession is defined as occurrent storage then the foundationalist wins by definition, but if it is defined as reliable accessibility then the infinitist wins by definition. However, we agree that the dispute is not merely verbal because it hinges on a substantive metaphysical commitment about whether justification is a state of the agent or a relation between propositions. The foundationalist holds that justification must be a state of the agent to explain why the agent is responsible for the belief, while the infinitist holds that justification is a relation between propositions to explain why the belief is likely to be true. We conclude that while we share a diagnosis of the regress problem and a rejection of circularity and arbitrary stops, we remain divided on whether justification in motion is sufficient for knowledge, and we recommend that future work focus on the metaphysics of doxastic possession rather than the structure of chains. This document stands as our joint acknowledgment that we understand each other better now, even if we do not yet agree.
