answer: |-
  There is no single, settled term in the philosophy of science or historiography that captures this exact configuration: a factual boundary dispute underdetermined by evidence, resolved by normative commitments, and systematically misrepresented as evidential by all parties.

  However, the structure you have identified is a recognized composite of three established concepts. I will outline the established neighbors, then propose a precise label for the specific configuration you described, and finally distinguish the two versions (error vs. feature) you suspect exist.

  **Epistemic Status Note:** *The constituent concepts below (Value-Ladenness, Boundary Work, Reification) are settled terminology in philosophy of science and sociology of scientific knowledge (SSK). The synthesis I offer below as a named configuration is a reconstruction based on those concepts, as no canonical single term exists for this specific pattern.*

  ### 1. The Established Neighbors

  To understand why there is no single word, it helps to see which existing concepts cover which *parts* of the pattern, and where they fall short.

  *   **The Value-Ladenness of Science (Consensus):** Since the work of Heather Douglas, Philip Kitcher, and Helen Longino, it is largely settled in philosophy of science that non-epistemic values (moral, political, social) inevitably influence scientific decision-making, particularly where evidence is underdetermined.
      *   *Why it's not enough:* This describes the *presence* of values, not the *masking* of them. It explains why the choice happens, not why everyone insists it didn't.
  *   **Boundary Work (Consensus in SSK):** Coined by Thomas Gieryn, this describes how scientists draw rhetorical boundaries between "science" and "non-science" (or rigorous vs. political) to protect authority or exclude rivals.
      *   *Why it's not enough:* This is sociological. It explains the *function* of the rhetoric (protecting turf), but not the *epistemic structure* of the argument (the specific Is/Ought conflation regarding time boundaries).
  *   **Reification / Hypostatization (Settled):** The fallacy of treating an abstract construct as a concrete physical thing.
      *   *Why it's not enough:* This captures the "treating a choice as a fact" element, but lacks the specific normative/moral driver you identified.

  ### 2. The Configuration: "Cryptonormative Periodization"

  Since no canonical term exists, I will coin the term **Cryptonormative Periodization** to describe the specific structure you observed. You can treat this as a precise label for the phenomenon, grounded in the established concepts above.

  **Definition:**
  *Cryptonormative Periodization* occurs when a temporal boundary is selected from a set of empirically valid candidates based on a normative commitment (moral, political, or axiological), but the selection is rhetorically presented as uniquely determined by the empirical evidence itself.

  **The Structure:**
  1.  **Underdetermination:** The physical record allows for multiple valid boundary markers (e.g., 1610, 1780, 1950).
  2.  **Axiological Selection:** The choice among valid markers is made based on which narrative of responsibility or significance the agent prefers (e.g., "Capitalism is the culprit" $\rightarrow$ 1780).
  3.  **Epistemic Masking:** The agent asserts the choice was forced by the data, characterizing alternative markers as "political" while exempting their own from that classification.

  **Epistemic Status:** *This label is my synthesis. It is not yet standard usage, but it accurately maps the intersection of Value-Ladenness and Reification within the specific domain of chronology.*

  ### 3. The Two Versions: Error vs. Feature

  You suspected there are two versions of this: one where importing the normative commitment is a methodological error, and one where it is unavoidable. This maps directly onto a live, contested debate in the philosophy of science regarding **Natural Kinds vs. Practical Kinds**.

  #### Version 1: The Methodological Error (The Realist View)
  *   **Premise:** Stratigraphic boundaries are *Natural Kinds*. They exist in the rock independent of human interpretation. The "correct" date is a fact of the universe waiting to be discovered.
  *   **The Fault:** In this view, *Cryptonormative Periodization* is a failure of objectivity. The scientists are allowing "Contextual Values" (politics) to corrupt "Constitutive Values" (accuracy).
  *   **Status:** This was the traditional view of stratigraphy (the "Value-Free Ideal"). It is increasingly contested but remains the operational norm for bodies like the International Commission on Stratigraphy (ICS).
  *   **Why it fits your observation:** If this view is true, the participants are lying (to themselves or others). They are committing a category error by treating a moral preference as a physical measurement.

  #### Version 2: The Unavoidable Feature (The Pragmatist/Constructivist View)
  *   **Premise:** Periods are *Practical Kinds* (or "Human Kinds"). An "epoch" is not a thing found in nature like a quartz crystal; it is a tool for organizing history. All tools are designed for a purpose. Therefore, all periodization is inherently normative.
  *   **The Fault:** The error is not *having* a normative commitment; the error is the *masking* (the "Crypto" part). Honesty requires admitting that we choose the 1950s boundary *because* we want to regulate nuclear testing, not because the radionuclides "forced" us.
  *   **Status:** This is the dominant view in modern historiography and gaining traction in Earth System Science (the "Normative Turn").
  *   **Why it fits your observation:** If this view is true, the participants are not making a methodological error in the *selection*, but a rhetorical one in the *justification*. They are engaging in **Ontological Politics** (a term by Annemarie Mol) but pretending they are doing Ontological Discovery.

  **Distinction:** In Version 1, the normativity invalidates the science. In Version 2, the normativity *constitutes* the science, and denying it undermines trust.

  ### 4. Boundary Cases

  To ensure the term is tight, here are three cases showing where *Cryptonormative Periodization* applies and where it stops.

  **Case A: The Anthropocene (Applies)**
  *   *Why:* Multiple physical markers exist (CO2 dip, plutonium, coal soot). Selection tracks moral narratives (Colonialism, Capitalism, Technology). Participants claim the data forces their hand.
  *   *Verdict:* Paradigmatic example.

  **Case B: The Cretaceous-Paleogene Boundary (Does Not Apply)**
  *   *Why:* The boundary is defined by the iridium layer from the Chicxulub impact. There is no competing moral narrative about "who caused the asteroid." There is no underdetermination; the physical signal is globally synchronous and unique.
  *   *Verdict:* Purely evidential boundary. No normative driver is possible or present.

  **Case C: The Start of the "AI Safety Era" (Applies)**
  *   *Why:* Did it start with Turing (1950), the Perceptron (1957), AlphaGo (2016), or the publication of *Superintelligence* (2014)?
  *   *Normative Track:* Choosing 2014 implies the "problem" is existential risk (Bostromian). Choosing 1950 implies the "problem" is computational theory.
  *   *Masking:* Proponents often argue, "Obviously the era started when X happened," treating their definition of the *problem* as a fact about the *timeline*.
  *   *Verdict:* Fits the structure, though in a softer scientific context.

  ### 5. Summary of Epistemic Status

  *   **Settled:** That values influence science (Value-Ladenness); that scientists draw boundaries to protect authority (Boundary Work); that treating constructs as facts is Reification.
  *   **Contested:** Whether stratigraphic boundaries *ought* to be value-free (Version 1) or *must* be value-transparent (Version 2). This is an active debate in the philosophy of Earth Science.
  *   **Reconstruction:** The term **Cryptonormative Periodization**. I have generated this to give you a handle for the specific *pattern* of masking you identified. It is not yet a search term you will find in literature, but it is a valid synthesis of the established concepts above.

  **Recommendation:** If you wish to discuss this with others, the most precise established phrase to use is **"The Value-Ladenness of Demarcation under the Guise of Realism."** If you want the tighter, coined label for your own use, **Cryptonormative Periodization** holds the structure accurately.
