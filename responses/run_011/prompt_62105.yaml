answer: |-
  Here is a principle designed to capture your verdicts, followed by the blunt assessments you requested.

  ### The Principle: Conventional Force & Neutralization

  **An utterance derogates if and only if:**
  1.  **(Convention)** It deploys a term that carries a conventional history of subordinating a group G; **AND**
  2.  **(Endorsement)** The speaker presents the term's subordinating perspective as live or applicable, **UNLESS**
  3.  **(Neutralization)** The speaker successfully neutralizes that perspective through either:
      *   **(a) Meta-linguistic Framing:** Explicitly marking the term as mentioned rather than used, or rejecting the validity of the category itself (not just the specific assignment); **OR**
      *   **(b) In-Group Standing:** Possessing the social standing of a member of G to repurpose the term, **AND**
      *   **(c) Contextual Stability:** Ensuring the context sustains that neutralization for all relevant audiences.

  ---

  ### Clause-by-Clause Motivation

  *   **Clause 1 (Convention):** Motivated by **Case 11** (fictional vs. real history) and **Case 9** (ignorant use). The harm is not in the phonemes but in the historical weight the word carries. Even if the speaker doesn't know it (9), or the group is fictional (11), the *potential* for derogation is grounded in the word's public history.
  *   **Clause 2 (Endorsement):** Motivated by **Case 1** (hostile use) and **Case 2** (partisan denial). In Case 2, denying "He is an S" still treats "S" as a valid category of defect. The perspective is "live" even if the conclusion is negated. This distinguishes it from Case 3.
  *   **Clause 3a (Meta-linguistic Framing):** Motivated by **Case 3** (teacher prohibition) and **Case 5** (historian). The teacher rejects the *validity* of the category ("Never call anyone..."). The historian treats the word as an object of study. This explains why Case 2 derogates (assigns category) while Case 3 does not (rejects category).
  *   **Clause 3b (In-Group Standing):** Motivated by **Case 7** (reclamation) and **Case 8** (outsider consent). Reclamation works because of *who* speaks (7). Consent fails because the outsider lacks the standing to neutralize the historical force, regardless of permission (8).
  *   **Clause 3c (Contextual Stability):** Motivated by **Case 6** (student reading) and **Case 4** (indirect report). In Case 6, the student reads the words without the historian's framing; the neutralization is lost in the performance. In Case 4, the report mentions the slur but leaves a "residue" because the context (a report) is less robustly protective than a scholarly argument.

  ### Dictionary Entry vs. Historian's Quotation (Case 5)

  My account treats these as **different kinds of use**, though both are non-derogatory.
  *   **Dictionary:** Pure *mention*. The word is defined as an object. There is no assertoric force regarding the world, only regarding the lexicon.
  *   **Historian:** *Mention embedded in assertion.* The historian asserts facts *about* the usage of the word.
  *   **Distinction:** The risk of derogation is higher for the historian (as seen in Case 6) because the word is integrated into a narrative flow. The dictionary is hermetically sealed; the historian's text is not. The historian relies on Clause 3a (Framing) to neutralize; the dictionary relies on the convention of lexicography itself.

  ### Verdicts on Four New Cases

  1.  **The Comedian (Clipped Routine):**
      *   **Verdict:** **Derogates.**
      *   **Reasoning:** In the live room, Clause 3a and 3c are satisfied (framing + audience context). Once clipped and circulated without laughter/context, Clause 3c (Contextual Stability) fails. The neutralization is stripped away, leaving only the Conventional Force (Clause 1) and the appearance of Endorsement (Clause 2).
  2.  **Automated Transcription:**
      *   **Verdict:** **Does Not Derogate (but creates a derogatory artifact).**
      *   **Reasoning:** Derogation requires a speaker who *presents* a perspective (Clause 2). An algorithm has no intent to endorse. However, it violates the spirit of Clause 3a by failing to mark the term as hazardous (e.g., "[SLUR]"). It is a mechanical propagation of harm, not an act of derogation.
  3.  **In-Group Member Insulting Out-Group with S:**
      *   **Verdict:** **Derogates.**
      *   **Reasoning:** While Clause 3b (Standing) is met, the *purpose* of the utterance violates Clause 3a. Reclamation (Case 7) works by inverting the term to mean "solidarity." Using it as a weapon against an outsider re-activates the original logic of the slur (that some groups are inferior/contemptible). It fails to reject the validity of the category; it merely redirects it.
  4.  **Extinct Group Slur:**
      *   **Verdict:** **Does Not Derogate.**
      *   **Reasoning:** Derogation requires a target capable of being subordinated (Clause 1 implies a living history of subordination). If G no longer exists, the term becomes a historical artifact (like "Hun" or "Vandal" in some contexts). It may offend sensibilities, but it cannot perform the act of subordinating a living community.

  ---

  ### Blunt Assessment 1: One Question or Two?

  This is **two questions**, and you are generating confusion by sliding between them.

  1.  **Semantic Content:** What does the word *mean*? (It conventionally encodes contempt.)
  2.  **Illocutionary Force:** What does the *speaker do* with it? (They subordinate, or they mention, or they reclaim.)

  **The Sliding Verdicts:**
  *   **Case 2 ("He is not an S"):** You call this derogation. This is a slide. Semantically, the word expresses contempt. But illocutionarily, the speaker is *defending* the target. You are counting the *presence of the concept* as derogation, rather than the *act of the speaker*. If you distinguish meaning from force, Case 2 is semantically toxic but illocutionarily protective.
  *   **Case 9 (Ignorant Use):** You say it derogates. This is a slide. If no one knows the meaning, the *Semantic Content* is inert for those hearers. If you say it still derogates, you are positing a metaphysical harm independent of human uptake. That is a claim about the *word's essence*, not the *utterance's effect*.
  *   **Case 4 (Indirect Report):** You note a "residue." This is the friction between the two questions. The report doesn't derogate (Force), but it forces the hearer to process the meaning (Content), which feels like a mini-derogation.

  **Diagnosis:** Your tentative "hearer-relative" principle failed because it tried to solve a Semantic/Force hybrid problem with a purely Force-based metric (uptake).

  ### Blunt Assessment 2: The Trade

  If you want a principle you can state in a sentence, you must surrender **Case 9**.

  **The Trade:** Surrender the intuition that the ignorant speaker on the uninhabited island (or the unlistened recording) *derogates*.

  **The Argument:**
  Case 9 forces you into a Platonist theory of slurs—that the word contains a spiritual poison that acts independently of human minds. This makes the rest of your list incoherent. If the poison is in the *word itself* (Case 9), then why does the Historian (Case 5) escape it? Why does the Teacher (Case 3)? If context can neutralize the poison for them, the poison is not in the word, but in the *use*.

  If the poison is in the *use*, then a use with no hearers, no intent, and no social effect is not a use that harms. It is a *potentially* derogatory utterance, like a loaded gun fired into a void. It is not *derogation* itself.

  **The Gain:** By surrendering Case 9, you can adopt a simpler principle: **"Derogation is the successful communication of subordinating content, unless neutralized by framing or standing."**
  *   This handles Case 1 (Success).
  *   This handles Case 5 & 6 (Framing).
  *   This handles Case 7 & 8 (Standing).
  *   This handles Case 9 (No communication = no derogation).

  You lose the idea that slurs are objectively evil atoms. You gain a theory that explains why context, intent, and audience actually matter. Given that your own verdicts on Cases 3, 5, and 6 rely entirely on context, Case 9 is the outlier that is breaking your theory. Cut it.
