  1. **The Scenario**
  Elena has exactly ten weeks to secure a down payment of $95,000 to close on a home; she currently holds $100,000 in liquid cash, and if her balance falls below the target at the deadline, the deal collapses and she forfeits her deposit. She can invest weekly in a venture that offers a fair coin toss: heads returns double her stake, tails loses her stake, meaning each round multiplies her wealth by $(1+2f)$ or $(1-f)$ respectively, where $f$ is the fraction staked. She cannot borrow or leverage, and she must select a fixed staking fraction from a menu of three options: Full Kelly ($f=0.25$), Quarter Kelly ($f=0.0625$), or a deliberately Timid One-Twentieth Kelly ($f=0.0125$). To demonstrate the conflict between growth optimization and survival probability, we compare her odds of success if she chooses the Full Kelly fraction against the Timid fraction, ignoring the Quarter option for the sake of the wedge.

  2. **The Verification**
  *   **Kelly Fraction:** For a 2-to-1 payoff with $p=0.5$, Full Kelly is $f^* = \frac{2(0.5)-0.5}{2} = 0.25$.
  *   **Growth Rates:** The expected log-growth per round is $g(f) = 0.5\ln(1+2f) + 0.5\ln(1-f)$.
      *   Kelly ($f=0.25$): $g_K = 0.5\ln(1.5) + 0.5\ln(0.75) = 0.5\ln(1.125) \approx 0.0589$ (5.89%).
      *   Timid ($f=0.0125$): $g_T = 0.5\ln(1.025) + 0.5\ln(0.9875) \approx 0.0061$ (0.61%).
      *   **Result:** Kelly has the strictly higher growth rate.
  *   **Success Probabilities ($N=10$, Target $\ge 0.95 W_0$):**
      *   **Kelly:** Wealth $W_{10} = W_0 (1.5)^k (0.75)^{10-k}$. Solving $(1.5)^k (0.75)^{10-k} \ge 0.95$ yields $k \ge 4.07$, so she needs **5 or more heads**.
          *   Binomial Count: $\binom{10}{5} + \binom{10}{6} + \binom{10}{7} + \binom{10}{8} + \binom{10}{9} + \binom{10}{10} = 252 + 210 + 120 + 45 + 10 + 1 = \mathbf{638}$.
          *   Probability: $638/1024 \approx \mathbf{62.3\%}$.
      *   **Timid:** Wealth $W_{10} = W_0 (1.025)^k (0.9875)^{10-k}$. Solving $(1.025)^k (0.9875)^{10-k} \ge 0.95$ yields $k \ge 2.0$, so she needs **2 or more heads**.
          *   Binomial Count: Total outcomes minus failures ($k=0, 1$). $1024 - \binom{10}{0} - \binom{10}{1} = 1024 - 1 - 10 = \mathbf{1013}$.
          *   Probability: $1013/1024 \approx \mathbf{98.9\%}$.
      *   **Result:** Timid has the strictly higher probability of meeting the target.

  3. **The Boundaries**
  *   **Horizon Tripled ($N=30$):** The ranking holds. For the same fixed target (0.95 of start), Timid still requires fewer heads ($k \ge 9$) than Kelly ($k \ge 13$) relative to the mean ($15$), yielding $P_T \approx 98\%$ versus $P_K \approx 77\%$. The timid bettor still wins because the target remains below the median growth path of both, making variance a pure penalty.
  *   **Horizon Cut ($N=3$):** The ranking holds. Kelly needs 2 heads ($P=0.5$); Timid needs 0 heads ($P=1.0$).
  *   **The Flip:** The ranking flips if the target is raised sufficiently high. If the target is set to $1.28 W_0$ (a 28% gain), Timid's maximum possible wealth ($1.025^{10} \approx 1.28$) barely clears it only in the single best case ($k=10$), while Kelly clears it with 6 or more heads ($P \approx 37\%$). If the target exceeds Timid's maximum possible outcome, Kelly wins by default.

  4. **The Diagnosis**
  The divergence arises from **variance relative to the threshold**. Kelly maximizes the *median* terminal wealth (and the asymptotic growth rate), but it does so by accepting higher volatility. When the target is set low (in the "safety zone" below the Kelly median), the probability of success is determined by the left tail of the distribution. Kelly's fatter left tail creates a higher risk of falling below the threshold than the Timid strategy's compressed distribution. The two criteria come apart because maximizing the *rate* of growth (log utility) is not equivalent to maximizing the *probability* of exceeding a fixed, low barrier in finite time.

  5. **The Defense**
  A partisan of geometric rationality argues that this is no counterexample because the agent's objective function is misspecified. They contend that a rational agent should maximize expected log-wealth ($E[\ln W_T]$), which is equivalent to maximizing the median outcome, rather than maximizing a binary probability $P(W_T \ge K)$. They would argue that if the horizon were truly long ($N \to \infty$), the Kelly bettor would overtake the Timid bettor with probability 1 for any target that grows at less than the Kelly rate. However, this reply concedes that the growth-rate criterion answers the question "How fast will my wealth compound in the long run?" rather than the question this agent actually asked: "Will I be solvent at this specific deadline?" By prioritizing the asymptotic rate, Kelly optimization ignores the short-run risk of ruin relative to fixed nominal liabilities.
