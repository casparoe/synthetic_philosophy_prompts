answer: |-
  Your "statute-of-limitations" (SoL) view is a useful heuristic for categorical predictions, but it collapses under the weight of reflexive systems (where the prediction changes the outcome) and auxiliary hypotheses (where the theory can be saved). Your intuitions in the six cases are not inconsistent; they are simply more sophisticated than your stated principle. You are implicitly applying a **Lakatosian** criterion (is the research programme progressing or degenerating?) mixed with a **Mertonian** distinction (is this a prophecy or a warning?).

  The SoL principle fails because it treats *time* as the falsifying agent, whereas your judgments treat *causal mechanism* as the confirming agent.

  Here is the principle that actually governs your verdicts, the adjustments you must make to maintain consistency, and the answer to your final question.

  ### The Winner: The Progressive Mechanism Standard (PMS)

  The SoL view is rejected. It cannot distinguish between a theory that is "early" and one that is "wrong," nor between a saved theory and a rigged one. The **Progressive Mechanism Standard** replaces it. It consists of four clauses:

  **Clause 1: Mechanism Primacy over Temporal Precision**
  *   **Definition:** A long-horizon prediction is evaluated primarily on the validity of its causal mechanism, not the accuracy of its target date, provided the mechanism remains measurable and active during the delay.
  *   **Motivating Case:** **Case 1 (Malthus) & Case 4 (1970s Famines).** You refuse to call Malthus refuted because the pressure (population vs. resources) is still measurable, even if the crisis hasn't arrived. You call the famines "postponed" because the mechanism (scarcity) was real, even if countervailing forces (yields) intervened.
  *   **Implication:** A missed date is not falsification if the causal pressure identified by the theory is empirically verified to still exist.

  **Clause 2: The Reflexivity Exception (Warning vs. Prophecy)**
  *   **Definition:** If a prediction contains an implicit or explicit conditional ("If X continues, Y will happen"), and the publication of the prediction causes X to change, preventing Y, the theory is confirmed, not refuted. If the prediction is categorical ("Y will happen regardless"), and Y does not happen, it is refuted.
  *   **Motivating Case:** **Case 5 (Averted Catastrophe).** You count this as confirmation because you recognize the prediction functioned as a *warning* that altered the background conditions.
  *   **Implication:** This resolves the contradiction between Case 4 (postponed) and Case 5 (averted). Case 4 is "postponed" because the mechanism was outrun by exogenous tech. Case 5 is "confirmed" because the mechanism was neutralized by endogenous behavioral change triggered by the theory itself.

  **Clause 3: Independent Testability of Saves**
  *   **Definition:** An auxiliary hypothesis introduced to explain a missed prediction (a "save") is legitimate only if it generates novel, independent predictions that are subsequently verified. Merely adjusting a parameter to fit the past data is illegitimate.
  *   **Motivating Case:** **Case 6 (Neptune vs. Time Constant).** You accept the planet because it could be looked for and found (independent test). You reject the time constant because it is a curve-fitting maneuver with no independent consequences.
  *   **Implication:** This prevents the "right-but-early" defense from becoming a "get out of jail free" card.

  **Clause 4: Robustness to Window Selection**
  *   **Definition:** A theory is fragile if its validation flips based on minor adjustments to the start or end dates of the observation window. A robust theory should hold across reasonable temporal boundaries.
  *   **Motivating Case:** **Case 3 (Simon–Ehrlich).** You feel uneasy because the verdict depends entirely on the 10-year window chosen.
  *   **Implication:** If a theory only works on specific dates, it is likely capturing noise, not signal.

  ---

  ### Forced Abandonments

  To adopt the PMS, you must revise two of your current verdicts:

  1.  **Abandon the "Success" verdict on Hubbert (Case 2).**
      *   *Current View:* You call it a success because the peak happened.
      *   *PMS Verdict:* **Refuted (but heuristically valuable).** The Hubbert Curve implied a specific symmetric decline that would not be exceeded. The subsequent rise (via fracking/unconventional oil) violated the *mechanism* (finite, easily accessible reservoirs), not just the date. Under Clause 1, the mechanism failed. You may praise the *insight* (finite resources), but the *model* is falsified.
  2.  **Clarify the Malthus Verdict (Case 1).**
      *   *Current View:* "Not refuted, but cannot name one thing that confirms it."
      *   *PMS Verdict:* **Degenerating Programme.** Under Clause 3, Malthusian models have repeatedly been "saved" by assuming the next year will be the crisis year, without independently verifying that the *means of subsistence* are actually hitting a hard wall (as opposed to a moving target). Unless you can point to a specific, measurable resource constraint currently binding (independent of the price signal), you must classify it as **unfalsified but degenerating**, not "not refuted."

  ---

  ### Verdicts on New Cases

  **Case A: The Moving Goalpost**
  *   *Scenario:* A model predicts a crisis in 2000. It misses. The authors revise the model to predict 2020. It misses. They revise to 2040.
  *   *PMS Verdict:* **Refuted (Degenerating Shift).**
  *   *Reasoning:* This violates Clause 3. Each delay is an auxiliary adjustment ("time constant") that fits the past failure but offers no independent testable consequence other than "wait longer." It is unfalsifiability wearing a respectable name.

  **Case B: The Accidental Truth**
  *   *Scenario:* A model predicts a crisis in 2020 based on soil depletion. The crisis happens in 2020, but solely due to a sudden geopolitical war, while soil levels remain stable.
  *   *PMS Verdict:* **Refuted (Lucky Correlation).**
  *   *Reasoning:* This violates Clause 1. The *mechanism* (soil depletion) was not the cause. A prediction is not confirmed by the event alone, but by the event occurring *via the posited mechanism*.

  ---

  ### The Final Question: Is "Right-but-Early" Genuine?

  **Plain Answer:**
  "Right-but-early" is a genuine epistemic status **if and only if** the causal pressure posited by the theory is independently measurable and increasing *during the wait*.

  If the only evidence for the theory is that the crisis hasn't happened *yet*, it is unfalsifiability. If the evidence is that the underlying stressors (e.g., aquifer depletion rates, atmospheric CO2 concentration, debt-to-GDP ratios) are measurably worsening in the specific way the theory describes, then the theory is **confirmed in mechanism but pending in outcome.**

  **Application to your Panel:**
  Regarding the 1970s subsistence model:
  1.  **Check Clause 1:** Is the mechanism (population outstripping yield) still active? If yield growth has structurally decoupled from population growth (e.g., via GMOs), the mechanism is broken. The theory is **refuted**.
  2.  **Check Clause 3:** Did the proponents offer independent tests during the 40-year delay (e.g., "Soil quality will drop by X%")? If they only said "Wait for the famine," they are **degenerating**.

  **Recommendation:**
  Do not award the prize on the basis of "right-but-early." Award it only if the model's *mechanism* explains current vulnerabilities better than rival models, regardless of the missed date. If the model offers no insight into *why* the crisis didn't happen (e.g., it cannot account for the yield gains), it is not a successful theory; it is a lucky guess that missed its window.
