  # Postmortem: INC-445 (ARF-7 Near-Activation & Notification Lag)

  **Date:** 2023-10-15
  **Author:** On-Call Engineering (OCE)
  **Severity:** P1
  **Status:** Closed

  ## Summary
  On 2023-10-14 at 03:12 UTC, the Automated Response Framework (ARF-7) entered Pre-Ignition state following a sensor noise spike in Sector 4. The system successfully inhibited kinetic release based on negative confirmation handshake. However, the external notification pipeline experienced congestion, delaying the adversary's receipt of the capability confirmation signal by 3.7 seconds. While the core platform maintained 100% safety SLO (no unauthorized release), the signaling latency violated the credibility SLO. An uncommunicated deterrent is functionally equivalent to no deterrent; therefore, this is filed as a P1 incident. The system performed within spec; the adversary's inability to recieve the docs in time is the failure mode.

  ## Impact
  *   **Kinetic Release:** 0 (Target: 0).
  *   **Signaling Latency:** 4200ms (SLO: <500ms).
  *   **Credibility Score:** Degraded from 99.99% to 99.95%.
  *   **Volatility Budget:** Consumed 0.01% of Q3 allocation.
  *   **Customer Impact:** Adversary platform experienced uncertainty regarding ARF-7 automation status for 3.7 seconds.

  ## Detection
  Automated monitoring alerted on `ARF7_SIGNAL_ACK_DELAY > 500ms`. On-call engineer acknowledged via PagerDuty at 03:16 UTC.

  ## Timeline
  *   **03:12:04 UTC:** Sector 4 seismic sensors report anomaly (Magnitude 2.1).
  *   **03:12:15 UTC:** ARF-7 logic evaluates threat matrix. Threshold exceeded.
  *   **03:13:00 UTC:** System enters Pre-Ignition. Human-in-the-loop interlock queried.
  *   **03:13:45 UTC:** Interlock timeout reached. System fails open to maintain automation guarantee.
  *   **03:14:00 UTC:** Notification payload dispatched to Adversary API Gateway.
  *   **03:17:42 UTC:** Adversary gateway returns HTTP 200 OK (Ack received).
  *   **03:20:00 UTC:** ARF-7 resets to Standby. Incident declared.

  ## Root Cause
  The primary root cause was congestion in the external notification pipeline, exacerbated by the latency introduced by the human-in-the-loop interlock query. The interlock wait time (45s) consumed the buffer available for network retries, causing the credibility signal to miss its SLO window.

  ## Five Whys
  1.  **Why did ARF-7 enter Pre-Ignition?** Sensor noise exceeded the activation threshold.
  2.  **Why is the threshold set so sensitively?** To ensure second-strike fidelity under degraded conditions.
  3.  **Why is fidelity critical?** The adversary must believe retaliation is guaranteed to prevent first-strike calculus.
  4.  **Why do they doubt guarantee?** They model a possibility of human hesitation or abort.
  5.  **Why do they model hesitation?** Because the architecture includes a human abort interlock.

  ## Contributing Factors
  *   **Volatility Budget Management:** The Safety team argued for preserving volatility budget (lowering false-positive risk), while the Credibility team argued for spending it (increasing sensitivity to prove automation). The current configuration spends 80% of the budget to signal resolve. Some engineers noted the reliability number is doing a lot of unearned work here.
  *   **Interlock Latency:** The manual override endpoint introduces a variable latency spike. While intended as a safety feature, it acts as a single point of failure for credibility. If the adversary believes the interlock *can* be used, they must test whether it *will* be used.
  *   **Documentation Visibility:** Adversary integration team may not have read the latest API versioning notes regarding automatic failover.

  ## What Went Well
  *   Containment held; no kinetic release occurred.
  *   Internal monitoring correctly identified the signaling lag.
  *   The system successfully failed open, demonstrating the intended automation path.

  ## Known Trade-offs
  *   **Stability-Instability Paradox:** Since ARF-7 core stability was demonstrated, Tier-2 low-level conflicts in Sector 4 have increased 15% this quarter. This is accepted traffic; the platform is designed to absorb catastrophic risk, not minor skirmishes.
  *   **Safety vs. Credibility:** Increasing safety interlocks reduces accidental launch risk but increases the risk of adversary miscalculation. A system that cannot be turned off is safer from exploitation than one that *shouldn't* be turned off but can be.
  *   **Opacity:** Complete transparency of the volatility budget would allow adversaries to game the threshold. We must keep the exact error budget private.

  ## Action Items

  | Action Item | Owner | Priority | Due Date |
  | :--- | :--- | :--- | :--- |
  | Deprecate manual override endpoint (ARF-7 Interlock) to eliminate SPOF and reduce latency. | Platform Reliability | P0 | 2023-11-01 |
  | Increase bandwidth for external notification pipeline to ensure <200ms ACK time. | Network Eng | P1 | 2023-10-30 |
  | Publish updated integration docs to Adversary portal clarifying automatic failover behavior. | DevRel | P1 | 2023-10-25 |
  | Review Q4 Volatility Budget allocation; propose increasing spend to signal higher sensitivity. | Product Security | P2 | 2023-11-15 |
  | Run game theory simulation on interlock removal to verify adversary belief update. | Strategy Team | P2 | 2023-12-01 |

  ## Follow-up Comments
  *   **@SafetyLead:** Removing the interlock reduces our internal safety margin.
  *   **@CredibilityLead:** It removes the adversary's doubt about our safety margin. The risk profile shifts from accidental launch to strategic miscalculation. The latter has higher blast radius.
  *   **@SRE:** Noted. We will treat the interlock removal as a standard deprecation. Please ensure the change log is clear for all stakeholders, including external observers.

  ---
  *This document is internal only. Do not distribute outside the continuity enviroment.*
