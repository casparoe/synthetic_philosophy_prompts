  Negative liberty declares Elena free. Berlin's test asks whether other humans currently place obstacles in her way. Arthur satisfied this test fifteen years ago, but he is dead. On the day of the decision, no human blocks Chicago. Berlin distinguishes freedom from the conditions of its exercise; her inability to choose is an internal incapacity, not external coercion. To call her unfree now would require counting past obstacles or psychological barriers, collapsing the distinction between "free from" and "able to."

  Positive liberty calls her unfree. It demands self-mastery: acting on desires one authentically owns. Because Arthur curated her preferences, she cannot identify her "true" will. To say this, however, the theory must split the self into authentic and conditioned parts. It gives up neutrality and empirical tractability, risking paternalism. It claims she is coerced by her own conditioned mind, treating internal confusion as political bondage.

  Non-domination forces a harder choice. Pettit requires an agent with the standing capacity to interfere arbitrarily. Domination is a relational property, not a psychological state. Arthur is dead; he lacks the capacity to interfere. Therefore, Pettit must call her free. The "contented slave" argument works only while the master lives and retains the power to interfere. Once the master dies, the structural relation of domination collapses, even if the slave's mindset lingers. Republicanism tracks the power relation, not the psychological scar.

