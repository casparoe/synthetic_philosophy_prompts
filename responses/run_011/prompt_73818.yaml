prompt: |-
  I'm building a handout for my political theory seminar and I need a case built to spec, because the whole point of the handout is to test whether republicanism's headline selling point survives the death of the dominator. The selling point is that Pettit can call the contented slave unfree even though nobody lays a hand on him, which plain negative liberty supposedly can't do. I want to see what's left when the master isn't kind or cruel but simply gone.

  Build me this: one person, one decision, completely ordinary and contemporary — a job offer in another city, say — sitting behind which is fifteen years of someone else quietly arranging her life so that certain options never showed up in front of her. No threats, no violence, no raised voice: he did it with the checkbook, the shared calendar, and whod get invited to dinner. Then he dies, three years before the decision, and in the meantime she's come into her own money and has no ties left to anybody who could make trouble for her. She knows exactly what he did. She's spent years going over her own wants trying to work out which ones are hers, and she can't get a clean answer.

  Constraints: max 150 words, one paragraph, no brainwashing or sci-fi, no plantation imagery, and the shaping has to be done entirely through control of her environment — I want Berlin's own test (obstacles deliberately placed in my way by other people) to be satisfied at the time and to come up empty afterward.

  Then walk me through it, whole thing under 700 words, and no reading list, I just want the analysis:

  - what negative liberty says about her freedom on the day of the decision, and why;
  - what a self-mastery or positive-liberty account says, and what it has to give up in order to say it;
  - what non-domination says — specifically, whether Pettit's requirement of an agent with a standing capacity to interfere on an arbitrary basis lets him call her unfree or forces him to call her free.

  Then tell me which single feature of the case is doing the work, and run the variant: same shaper, alive, zero leverage, no contact at all. Does the republican verdict move, and if it does, what does that say about whether the theory is tracking her condition or the shape of her relations? Finish with the best reply a Pettit defender could make to my whole setup, and be straight with me about whether I've rigged it — if the case only bites because I baked in an autonomy complaint that none of these theories were ever meant to catch, say so.
