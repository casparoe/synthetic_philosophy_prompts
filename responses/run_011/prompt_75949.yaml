  # POSITIONS MAP: THE TOPOLOGY OF SIMULTANEOUS INVENTION

  ### THE DECISION TREE

  **Q1. INDIVIDUATION:** Do the competing claims share the same *formalism/method* (Fine Grain) or only the same *empirical target/result* (Coarse Grain)?
  *   **A. Same Formalism** → Go to Q2-Fine
  *   **B. Same Result** → Go to Q2-Coarse

  **Q2-Fine. COUNTERFACTUAL (METHOD):** If the claimants vanished, would this *specific formalism* appear within 5 years?
  *   **A. No (Contingent)** → **Leaf 1: The "Genius" Position**
  *   **B. Yes (Necessary)** → Go to Q3-Fine

  **Q2-Coarse. COUNTERFACTUAL (RESULT):** If the claimants vanished, would this *result* be published within 5 years?
  *   **A. No (Contingent)** → **Leaf 2: The "Scooped" Position**
  *   **B. Yes (Necessary)** → Go to Q3-Coarse

  **Q3-Fine. LOCUS OF NECESSITY:** What forces the method's emergence?
  *   **A. Long-term Trajectory (Time)** → **Leaf 3: The "Whig" Position [Empty]**
  *   **B. Immediate Field State (Puzzles)** → Go to Q4

  **Q3-Coarse. LOCUS OF NECESSITY:** What forces the result's emergence?
  *   **A. Long-term Trajectory (Time)** → **Leaf 4: The "Zuckerman" Position**
  *   **B. Immediate Field State (Puzzles)** → Go to Q4

  **Q4. NORMATIVE FORCE:** Does assigning priority settle *how* the science is done (notation/axioms) or only *who* is cited?
  *   **A. Settles Practice (Coordination)** → **Leaf 5: The "Kuhnian" Position** (Fine) / **Leaf 6: The "Mertonian" Position** (Coarse)
  *   **B. Settles Citation (Convention)** → **Leaf 7: The "Formalist" Position [Empty]** (Fine) / **Leaf 8: The "Heroic" Position** (Coarse)

  ---

  ### LEAF LEGEND & ANALYSIS

  1.  **The "Genius" Position** (Fine/Contingent): Discovery is an artifact of specific cognitive architecture. Priority is a moral debt to the individual. *(Attribution: Often implied in hagiography, rarely defended philosophically).*
  2.  **The "Scooped" Position** (Coarse/Contingent): The result was not "in the air." Priority is a zero-sum race where the loser is historically erased. *(Attribution: Common in lab ethnography).*
  3.  **The "Whig" Position [Empty]** (Fine/Time/Necessary): **Why Empty:** *Incoherent.* Specific formalisms (e.g., fluxions) are rarely inevitable over long timescales without immediate field pressure. Time alone produces results, not methods.
  4.  **The "Zuckerman" Position** (Coarse/Time/Necessary): Science accumulates inevitably; discoverers are interchangeable units of production. Priority is a demographic statistic. *(Attribution: Harriet Zuckerman).*
  5.  **The "Kuhnian" Position** (Fine/Field/Coordination): Priority decides the winning paradigm's syntax. The "winner" dictates the tools future normal science must use. *(Attribution: Thomas Kuhn).*
  6.  **The "Mertonian" Position** (Coarse/Field/Coordination): Priority functions as a reward system to incentivize disclosure, preventing secrecy. It coordinates the social structure of science. *(Attribution: Robert K. Merton).*
  7.  **The "Formalist" Position [Empty]** (Fine/Field/Convention): **Why Empty:** *Unappealing.* If a method is field-necessary, its utility dictates its adoption, not the priority label. Separating the label from the practice is analytically useless here.
  8.  **The "Heroic" Position** (Coarse/Field/Convention): The field demanded the result, but credit remains a symbolic prize for the "first" mind, with no instrumental effect on practice. *(Attribution: Common in popular history).*

  ---

  ### INDISTINGUISHABLE PAIRS & INVENTED SEPARATORS

  **Flagged Pair:** Leaf 5 (Kuhnian) vs. Leaf 6 (Mertonian).
  **Why Indistinguishable:** Both rely on "Immediate Field State" and "Coordination." The tree treats "Practice" (notation) and "Social Structure" (incentives) as distinct, but in historical cases, changing the notation often *is* the incentive mechanism. The tree cannot separate *technical* coordination from *sociological* coordination.

  **Invented Case to Separate:**
  *   **The Case:** Two groups simultaneously derive a theorem. Group A uses notation $\alpha$, Group B uses notation $\beta$. The theorem is identical.
  *   **Separating Leaf 5 (Kuhnian):** The scientific community adopts $\alpha$ *because* Group A is granted priority, and $\alpha$ becomes the mandatory language for all subsequent work in the sub-field. (Priority drives Technical Standard).
  *   **Separating Leaf 6 (Mertonian):** The community adopts $\alpha$ because it is mathematically cleaner, regardless of priority. However, Group A receives the Nobel Prize, which incentivizes Group B to publish their next finding immediately rather than hoarding it. (Priority drives Social Behavior, not Technical Standard).

  **Flagged Empty Cell:** Leaf 3 (Fine/Time/Necessary).
  **Why Empty:** As noted, specific methods are rarely time-inevitable without field pressure.
  **Invented Case to Occupy It:**
  *   **The Case:** A mathematical truth (e.g., Prime Number Theorem) that is discovered independently across centuries (Gauss, Riemann, Hadamard) using *structurally identical* proof architectures that seem to be the only logical path, regardless of the contemporary "field state." If the method is truly the *only* path through logical space, time alone guarantees convergence, rendering the "Field State" node irrelevant.

