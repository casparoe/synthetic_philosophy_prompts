prompt: |-
  I'm auditing a seminar on interpretation across disciplines this term — literary theory, scripture, law — and I keep coming back to an inconsistency inside a single legal system that nobody in the seminar seems bothered by, so I'd like you to treat it as the object of analysis. In common-law jurisdictions the same judiciary applies three markedly different regimes for working out what a written text means. Probate: the court treats the dead testator's intention as the controlling consideration, seats itself imaginatively in the testator's position, and admits evidence from outside the four corners — letters, drafting instructions, what the testator told friends and family — to work out whom or what a description picks out; and in many American states, under the Uniform Probate Code's reformation provision and the corresponding Restatement approach, a court may rewrite a will or trust to correct a mistake of fact or law, on clear and convincing evidence, *even where the language is unambiguous*. Contract: the court asks what a reasonable person in the position of the addressee would have understood the words to mean, treats an unexpressed private intention as legally inert, and where both parties attached materially different meanings to the same phrase and neither knew or had reason to know of the other's, has been willing to hold that no contract came into existence at all — the 1864 English case of the two Bombay-to-Liverpool ships both named Peerless is the standard illustration — though where one party knew of the other's meaning and the other did not, the innocent party's meaning governs. Statute: a textualist court says the enacted words, in their public meaning, are the law; that a legislature is a body rather than a mind and so has no intention to be found; and that committee reports and floor speeches may not be used to displace what the text clearly says.

  What I want is a reconstruction of the implicit theory of meaning each regime presupposes, and an assessment of whether the three can be reconciled. Start by stating, for each practice, the account of what makes a text mean what it does that the practice only makes sense under — and be careful to separate what the practice strictly presupposes from what merely fits it comfortably. Then ask whether one underlying semantic theory plus three different sets of background facts (one author who can no longer be consulted and whose instrument is a gift rather than a bargain; two living parties whose reliance and cooperation have to be preserved; an institution whose authority is constituted by the public act of enactment) can generate all three regimes, or whether the system is in fact committed to rival and incompatible pictures of meaning, so that a probate judge and a textualist appellate judge are not disagreeing about evidence but about what meaning is. Pay particular attention to a deflationary possibility: that the real differences are epistemic and institutional rather than semantic — that everyone involved holds the same theory of meaning but the law has different tolerances for unreliable evidence, different allocations of risk, and different conceptions of what each instrument is *for* — and tell me how I could distinguish that reading from the genuinely semantic one, or whether the practice leaves the question underdetermined.

  Finally, run the counterfactuals in both directions. If the jurisdiction adopted a uniform intentionalism, what would have to change in contract litigation and in statutory adjudication, and what would break — is there anything about bargains, or about the authority of a legislature, that resists being folded into an author-psychology model? And if it adopted a uniform anti-intentionalism, the position a literary critic takes when she refuses to consult a novelist's letters, what would have to happen to probate: would courts have to leave a misdescribed bequest standing, refuse reformation, and treat the document as severed from the mind that produced it? I'd also like to know which of these two uniform regimes is more internally stable, and whether there is a domain — trusts, treaties, constitutions, recorded music, standard-form terms of service — where you'd expect the practice to sit closest to each. Please argue the reconstruction rather than surveying positions, and don't spend space telling me that the intentional fallacy debate exists; I want to know which side of it, if either, these three bodies of practice are tacitly voting for.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **Task:** Analyze the inconsistency in interpretive regimes within a single common-law legal system (Probate, Contract, Statute).
      *   **Core Question:** Reconstruct the implicit theory of meaning for each regime and assess reconcilability.
      *   **Specific Requirements:**
          1.  State the account of meaning for each practice (distinguish strict presuppositions from comfortable fits).
          2.  Assess if one semantic theory + different background facts can generate all three, OR if they commit to rival/incompatible pictures of meaning (semantic disagreement vs. epistemic/institutional disagreement).
          3.  Evaluate the "deflationary possibility" (same theory, different rules of evidence/risk/function). How to distinguish this from the genuinely semantic reading?
          4.  Run counterfactuals:
              *   Uniform Intentionalism: What breaks in Contract/Statute?
              *   Uniform Anti-Intentionalism: What breaks in Probate?
          5.  Determine which uniform regime is more internally stable.
          6.  Identify domains where practice sits closest to each regime (trusts, treaties, constitutions, etc.).
      *   **Tone/Style:** Argumentative reconstruction, not survey. Avoid generic "intentional fallacy" history. Focus on what the practices *vote for*.

  2.  **Analyze the Three Regimes (Initial Brainstorming):**

      *   **Probate:**
          *   *Goal:* Effectuate the testator's will (pun intended).
          *   *Meaning Source:* Subjective mental state of the author.
          *   *Evidence:* Extrinsic allowed freely. Ambiguity not required for reformation (in modern UPC).
          *   *Theory:* Radical Intentionalism (Psychological). The text is a window to a mind.
      *   **Contract:**
          *   *Goal:* Facilitate exchange, protect reliance, allocate risk.
          *   *Meaning Source:* Objective manifestation (what a reasonable person would understand).
          *   *Evidence:* Parol evidence rule limits extrinsic if integrated. *Peerless* shows mutual mistake kills contract (no meeting of minds), but unilateral mistake usually binds the mistaken party if the other relied on the objective meaning.
          *   *Theory:* Objective Intentionalism (or Communicative Convention). Meaning is in the public signal, not the private thought.
      *   **Statute:**
          *   *Goal:* Rule of law, notice, democratic legitimacy.
          *   *Meaning Source:* Public text (Textualism). Legislature has no "mind."
          *   *Evidence:* Text only (mostly). Legislative history suspect.
          *   *Theory:* Conventionalism / Public Meaning Originalism. Meaning is fixed at enactment by public understanding.

  3.  **Drafting Section 1: Implicit Theories of Meaning:**

      *   *Probate:* Presupposes meaning *is* the author's mental content. The text is evidentiary, not constitutive. If text $\neq$ mind, text loses.
      *   *Contract:* Presupposes meaning *is* the reasonable reliance interest generated by the signal. The text (plus context) creates an obligation based on how it lands, not how it was sent. *Peerless* nuance: If no shared context, no meaning (no contract). If asymmetric knowledge, the innocent party's context wins.
      *   *Statute:* Presupposes meaning *is* the public semantic content fixed at enactment. The "author" is a fiction; the "text" is the law.

  4.  **Drafting Section 2: Reconcilability (One Theory + Facts vs. Rival Theories):**

      *   *Can one theory explain all?*
          *   *Attempt:* "Meaning is communicative success."
          *   *Probate:* Communication is one-way (dead to living). Success = guessing the sender's code.
          *   *Contract:* Communication is two-way. Success = mutual alignment or reliance protection.
          *   *Statute:* Communication is one-to-many (state to citizen). Success = public notice.
      *   *Verdict:* It looks like a *functional* divergence masking a semantic one, BUT the probate reformation provision (rewriting unambiguous text) suggests a genuine semantic split. In Contract/Statute, unambiguous text binds. In Probate, it doesn't. This implies Probate treats text as *evidence of* meaning, while Contract/Statute treat text as *the locus of* meaning.
      *   *Conclusion:* They are committed to rival pictures. Probate = Psychological Intentionalism. Contract/Statute = Objective/Conventionalism (with different flavors).

  5.  **Drafting Section 3: The Deflationary Possibility (Epistemic/Institutional vs. Semantic):**

      *   *Argument:* Maybe everyone agrees meaning is "what the author meant," but in Statute/Contract, we *can't know* that, so we use proxies (text). In Probate, we *can* know it (witnesses, drafts), so we use the real thing.
      *   *Counter:* The UPC reformation provision allows correcting *unambiguous* text. This isn't just epistemic (we can't find the meaning); it's ontological (the text is wrong). In Contract, unambiguous text binds even if one party meant something else (unless fraud/mistake doctrines apply, but those are narrow). In Statute, unambiguous text binds even if everyone knows the legislature messed up.
      *   *Distinguishing Test:* Look at the "Hard Case." If the text is clear but the intent is proven different:
          *   Probate: Intent wins.
          *   Contract/Statute: Text wins.
          *   *Result:* This proves the semantic theory differs. It's not just evidence tolerance; it's what counts as *the law/the deal/the will*.

  6.  **Drafting Section 4: Counterfactuals:**

      *   *Uniform Intentionalism (Probate model everywhere):*
          *   *Contract:* Chaos. Reliance destroyed. "I meant X" overrides "It says Y." Transaction costs skyrocket. Bargain model collapses into gift model.
          *   *Statute:* Rule of Law crisis. Citizens can't rely on published codes. Judges become mind-readers of 535 legislators. Democratic legitimacy erodes (law = judge's view of legislator's psyche).
      *   *Uniform Anti-Intentionalism (Statute model everywhere):*
          *   *Probate:* Injustice. Dead hand control fails. "My nephew John" goes to a stranger named John because the testator meant his dog John but didn't write "dog." The instrument becomes a fetish object severed from human purpose.
      *   *Stability:* Anti-intentionalism is more stable for *systems* (markets, governance). Intentionalism is more stable for *relationships* (family, gifts).
      *   *Domains:*
          *   Intentionalist: Wills, Trusts (private donative), maybe Treaties (meeting of minds between sovereigns?).
          *   Anti-Intentionalist: Statutes, Constitutions, Standard Form Contracts (adhesion), Recorded Music (copyright text vs. artist intent?).

  7.  **Refining and Polishing:**

      *   *Tone Check:* Ensure I'm not just listing theories but arguing for the reconstruction.
      *   *Specific Constraint:* "Don't spend space telling me that the intentional fallacy debate exists." -> Focus on the legal practice's tacit vote.
      *   *Key Insight:* The "Peerless" case in contract is crucial. It shows contract law *does* care about meeting of minds, but only as a threshold. Once crossed, objective meaning rules. Probate never crosses that threshold; it always hunts the mind.
      *   *Deflationary Check:* Be rigorous on the "epistemic vs. semantic" distinction. The reformation of unambiguous wills is the smoking gun against the deflationary reading.

  8.  **Final Review against Prompt:**
      *   Reconstruct implicit theory for each? Yes.
      *   Separate presupposition from comfortable fit? Yes.
      *   One theory + facts vs. rival pictures? Yes.
      *   Deflationary possibility (epistemic/institutional)? Yes.
      *   Counterfactuals (Uniform Intentionalism/Anti-Intentionalism)? Yes.
      *   Which breaks? Yes.
      *   Internal stability? Yes.
      *   Domains (trusts, treaties, etc.)? Yes.

      *(Self-Correction during drafting)*: I need to be careful with Contract law. It's not purely anti-intentionalist. It's "Objective Intentionalism." I must distinguish this from the "Subjective Intentionalism" of Probate and the "Public Meaning Conventionalism" of Statutory Textualism. The prompt asks if they are *incompatible*. Objective vs. Subjective is a genuine incompatibility in hard cases.

      *(Refining the Deflationary Argument)*: If the deflationary view holds, then in Statute, we *would* use intent if we could reliably find it. But Textualists say we *shouldn't* even if we could. That confirms the semantic split.

      *(Refining the Stability Argument)*: Why is Anti-Intentionalism more stable? Because it reduces information costs and reliance risks in impersonal systems. Intentionalism works in high-trust/low-stakes (family) or specific bilateral contexts.

      *(Final Polish)*: Ensure the voice is analytical and precise, matching the user's sophisticated prompt.

