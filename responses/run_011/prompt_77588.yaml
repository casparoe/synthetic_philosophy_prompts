answer: |-
  Here is a reconstruction of the implicit semantic theories operating within these three legal regimes, an assessment of their reconcilability, and an analysis of the counterfactual stability of uniforming them.

  ### I. Reconstruction of Implicit Theories of Meaning

  To determine what theory of meaning a practice presupposes, we must look not at what judges say, but at what they do when text and context diverge. The "strict presupposition" is the condition without which the specific remedial outcome is incoherent.

  **1. Probate: Radical Psychological Intentionalism**
  *   **The Practice:** Courts admit extrinsic evidence to identify beneficiaries even against ambiguous descriptions; under the UPC, they reform unambiguous text to match proven intent.
  *   **Strict Presupposition:** The legal meaning of the instrument *is* the mental content of the testator at the time of execution. The text is evidentiary, not constitutive.
  *   **Comfortable Fit:** It fits comfortably with the idea that a will is a "gift" rather than a bargain, so reliance interests are minimal.
  *   **The Theory:** Meaning is a private, internal state. The document is a fallible attempt to capture that state. If the capture fails (mistake) but the state is proven (clear and convincing evidence), the law effects the state, not the capture. The text has no semantic authority independent of the author's psyche.

  **2. Contract: Objective Communicative Conventionalism**
  *   **The Practice:** Courts enforce the meaning a reasonable person would derive from the manifestation of assent. Unexpressed intentions are inert. In *Peerless*, no contract exists because there was no shared referent; in unilateral mistake, the innocent party's understanding binds the mistaken one.
  *   **Strict Presupposition:** Legal meaning *is* the reliance interest generated by the public signal. Meaning is not what the sender meant, nor what the receiver guessed, but what the convention of language and context warrants a reasonable observer to expect.
  *   **Comfortable Fit:** It fits with the economic need for transactional security and the moral duty to keep one's manifested promises.
  *   **The Theory:** Meaning is intersubjective and external. It resides in the "meeting of minds" only insofar as those minds converge on a public signifier. Once a signifier is emitted, it detaches from the sender. The text (broadly construed to include context) creates an obligation based on its reception, not its transmission.

  **3. Statute: Public Meaning Conventionalism (Textualism)**
  *   **The Practice:** Courts enforce the ordinary public meaning of the enacted words. Legislative history is secondary or excluded. The legislature is treated as a "they," not a "he," possessing no singular mind.
  *   **Strict Presupposition:** Legal meaning *is* the semantic content fixed at the moment of enactment according to public linguistic conventions. Authority is constituted by the public act, not the private motive.
  *   **Comfortable Fit:** It fits with separation of powers (judges don't psychoanalyze legislators) and the Rule of Law (citizens must be able to rely on the text).
  *   **The Theory:** Meaning is institutional and historical. It is a "speech act" by a corporate entity where the only recoverable intent is the intent to enact *these words*. The text is the law; the thought behind it is politics.

  ### II. Reconcilability: One Theory or Rival Pictures?

  Can a single semantic theory plus varying background facts generate these three regimes? The **deflationary possibility** suggests yes: Everyone agrees meaning is "authorial intent," but Probate allows better evidence of it, while Contract and Statute face higher epistemic barriers and higher reliance costs, so they use textual proxies.

  **The Refutation of the Deflationary Reading**
  The deflationary reading collapses when we examine the treatment of **unambiguous text proven to contradict intent.**
  *   In **Probate**, if you prove the testator meant "my nephew John" but wrote "my son John" (and has no son), the court reforms the text. The text yields to the mind.
  *   In **Contract**, if you prove a party meant $X$ but signed a clear term $Y$, the text usually binds (absent fraud or specific mutual mistake doctrines). The mind yields to the text.
  *   In **Statute**, if you prove the legislature intended $X$ but enacted $Y$ (a drafting error), textualist courts enforce $Y$. The mind yields to the text.

  This is not merely an epistemic difference (i.e., "we can't find the intent in statutes"). It is an ontological difference about where meaning *lives*. In Probate, meaning lives in the head; in Contract and Statute, meaning lives in the public signifier. A probate judge and a textualist judge are not disagreeing about the weight of evidence; they are disagreeing about the locus of semantic authority. The legal system is committed to rival pictures of meaning: **Psychological** (Probate) vs. **Conventional/Objective** (Contract/Statute).

  **Why the Split Exists**
  The system tolerates this inconsistency because the *functions* of the instruments differ.
  *   **Probate** is about **donative transfer**. There is no counter-party whose reliance must be protected. The only interest is effectuating the owner's dominion over their property post-mortem.
  *   **Contract** is about **bilateral reliance**. Protecting the "mind" of one party at the expense of the other's reliance on the text destroys the security of exchange.
  *   **Statute** is about **public notice and democratic legitimacy**. Citizens cannot be governed by the secret thoughts of legislators; they must be governed by the public law.

  ### III. Counterfactuals: Uniforming the Regimes

  **Scenario A: Uniform Intentionalism (The Probate Model Everywhere)**
  If we applied Radical Psychological Intentionalism to Contract and Statute:
  *   **Contract Litigation:** The "objective theory of contract" would vanish. Any party could introduce diaries, emails, or testimony to prove they "meant" something different than the signed document.
      *   *What Breaks:* The security of transactions. Bargains require a "closure point" where liability is fixed. If meaning remains perpetually open to psychological excavation, reliance costs skyrocket. Standard-form contracts become unenforceable. The market shifts from a system of rules to a system of inquisitorial truth-finding.
  *   **Statutory Adjudication:** Judges would become investigators of legislative psyche, weighing floor speeches, drafts, and lobbyist notes to find the "true" law.
      *   *What Breaks:* The Rule of Law. Citizens could not read the code to know their obligations. Democratic accountability erodes because legislators could vote for text $A$ while claiming they intended $B$, shielding themselves from electoral backlash. The legislature's authority, which rests on the *public act* of voting, is undermined by a search for private motives.

  **Scenario B: Uniform Anti-Intentionalism (The Statutory Model Everywhere)**
  If we applied Public Meaning Conventionalism to Probate (and Contract):
  *   **Probate:** Courts would treat the will as a severed text. If a testator writes "my 1965 Ford" but owned a "1966 Ford" (and no 1965), the bequest fails (ademption). Reformation for scrivener's error would be banned.
      *   *What Breaks:* The moral purpose of succession law. Wills are not regulatory codes; they are intimate instructions. Treating them as severed texts fetishizes the document over the human relationship. It privileges form over substance in a domain where form serves no public notice function (since the "audience" is the court, not the public).
  *   **Contract:** This is closer to current law, but hardened. No reformation for mutual mistake. If the text is clear, the "meeting of minds" is irrelevant.
      *   *What Breaks:* Equity. In cases of obvious clerical error where both parties knew the deal, enforcing the typo becomes a tool of bad faith.

  ### IV. Stability and Domain Allocation

  **Which Uniform Regime is More Stable?**
  **Uniform Anti-Intentionalism is more internally stable for a complex legal system.**
  Psychological Intentionalism is inherently unstable because minds are opaque and plural. In Contract, there are two minds; in Statutes, 535. To privilege "intent" in multi-author contexts requires a fiction (the "reasonable legislator" or "meeting of minds") that inevitably collapses back into objective interpretation. You cannot aggregate psyches without an objective convention to translate them. Therefore, Anti-Intentionalism (Conventionalism) is the baseline required for *impersonal* order. Probate is the outlier, sustained only because it involves a single author and no adverse counter-party.

  **Domain Allocation Prediction**
  We should expect legal practices to slide along the spectrum based on **Reliance Costs** and **Authorship Multiplicity**.

  1.  **Closest to Radical Intentionalism (Probate Model):**
      *   **Trusts:** Similar to wills, donative, single settlor.
      *   **Treaties:** (Surprisingly) Often treated as a "meeting of minds" between sovereigns, where *travaux préparatoires* are heavily consulted (Vienna Convention), because the "public" is limited to the states involved.
      *   **Joint Wills/Contracts:** Where the relationship is intimate and reliance is mutual/trust-based.

  2.  **Closest to Objective Conventionalism (Contract Model):**
      *   **Commercial Contracts:** High reliance, bilateral.
      *   **Insurance Policies:** Adhesion contracts, but interpreted against the drafter (a hybrid).
      *   **Treaties (US Domestic Law):** When applied by US courts, they often shift toward textualism to avoid foreign policy entanglements.

  3.  **Closest to Public Meaning Conventionalism (Statute Model):**
      *   **Constitutions:** Highest reliance cost, longest time horizon, most authors. "Original Public Meaning" is the dominant theory for good reason; "Framer Intent" is too fractured.
      *   **Standard Form Terms of Service:** Mass audience, no negotiation. The "user's understanding" (objective) rules, not the "drafter's intent."
      *   **Recorded Music/Copyright:** The "work" is the fixed recording/composition, not the artist's interview about what they "meant." (Though moral rights jurisdictions in Europe lean more intentionalist).

  ### V. Conclusion: The Tacit Vote

  The legal system is not voting for one side of the intentional fallacy debate; it is voting for **functional pragmatism over semantic consistency.**

  However, if forced to identify the tacit semantic commitment: The system votes for **Conventionalism** as the default rule of public order. Probate is the exception that proves the rule. It is permitted to be Intentionalist only because it is **private, unilateral, and non-reliant.**

  The inconsistency you observe is not an oversight; it is a pressure valve. The law uses Intentionalism where it can afford to be humane (Probate) and Conventionalism where it must be efficient and stable (Contract/Statute). To reconcile them under one semantic theory would be to either destroy the security of the market and the state (by adopting Probate's Intentionalism) or to sacrifice the moral core of private property transmission (by adopting Statute's Textualism). The system accepts the semantic contradiction to preserve the functional integrity of its distinct domains.
