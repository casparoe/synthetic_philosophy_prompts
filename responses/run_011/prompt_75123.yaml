      *   **User Role:** Model Validation at a Prop Desk.
      *   **Vocabulary:** Two-way quotes, static replication, martingale measures, margin/funding costs, "nobody can make me fill a size I never offered" (agency/optionality).
      *   **The Conflict:** Risk Management wants to enforce "coherence" on an internal prediction market for analysts' macro calls, citing the Dutch Book argument (incoherent probabilities $\rightarrow$ risk-free profit). They equate this to no-arbitrage pricing.
      *   **The User's Skepticism:** The user suspects this is a category error. Trading desks don't have to take both sides. Prices aren't necessarily beliefs. Money $\neq$ Utility.
      *   **The Task:**
          1.  Restate the Dutch Book argument (and converse/conditional/diachronic versions) in trading vocabulary.
