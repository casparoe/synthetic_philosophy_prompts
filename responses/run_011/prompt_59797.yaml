answer: |-
  Your timeline is accurate. No corrections needed.

  ### Mapping the Players and Doctrine

  | Player | Real Options | Doctrinal Judgment |
  | :--- | :--- | :--- |
  | **Emperor** | 1. Silent suffering (Reign until death).<br>2. Private hint to Cabinet.<br>3. Public video message. | 1. **Pure.** Fits "reign until death" norm.<br>2. **Gray.** Private warning (Bagehotian).<br>3. **Breach.** Public political act without Cabinet advice. |
  | **IHA** | 1. Suppress NHK leak.<br>2. Facilitate video as "health update." | 1. **Pure.** Protects Emperor from politics.<br>2. **Complicit.** Enables bypass of Cabinet channel. |
  | **Cabinet** | 1. Ignore message (No formal request).<br>2. Convene panel, draft law. | 1. **Pure.** No advice tendered, no act required.<br>2. **Pragmatic.** Acknowledges political fact over legal form. |
  | **Diet** | 1. Permanent amendment to Household Law.<br>2. One-off special law. | 1. **General.** Sets future rule.<br>2. **Specific.** Avoids broader succession reform. |

  **Doctrinal Mapping:** The doctrine governs *Powers* (none) and *Channels* (Cabinet advice). It assumes *Voice* is private (the right to warn). Akihito retained zero Powers and used no formal Channels, but weaponized Voice. The doctrine has no mechanism to regulate public Voice that creates legislative inevitability.

  ### Testing the Triad: Powers, Channels, Voice

  Your triad holds explanatory weight. Bagehot's doctrine assumes the monarch's influence is exercised *through* ministers (Channels) or in private councils (Voice). It presumes the "dignified" part remains dignified by staying off the political stage.

  Akihito's video message decoupled Voice from Channel. He exercised no Power (he did not declare abdication), but his Voice created a political fact the Cabinet could not ignore without appearing undemocratic or cruel. This was not merely "shaping public opinion" (the standard dignified role); it was initiating a legislative process without submitting a request.

  **Article 1 Loophole:** The Constitution defines the Emperor as "the symbol of the State... derived from the will of the people." The framers assumed the Diet represented that will. Akihito's appeal interpreted "will of the people" as a direct relationship, bypassing the Diet's representative monopoly. The doctrine is silent here: it forbids political *acts* but does not forbid political *speech* that leverages symbolic status to mandate action.

  ### Hard Bits

  **1. The One-Off Law: Feature or Bug?**
  The Diet chose the special law to avoid amending the Imperial Household Law permanently. A permanent amendment would have opened debates on female succession and stable male lines, which the Abe cabinet wished to avoid.
  *   **Reading:** This confirms the "Bug" theory. By refusing a general right to abdicate, the Diet ensured future emperors cannot exit at will. However, it established that an emperor's health is now subject to ad hoc political bargaining. The doctrine requires legal channels for succession; the politics dictated a closed door on broader reform. The doctrine survives formally, but the precedent is now "lobby via public sentiment."

  **2. The Brake: Useless or Unneeded?**
  The standard brake is ministerial refusal of advice or resignation. Here, no advice was tendered. The Cabinet *could* have ignored the video, citing Article 3. They did not because the political cost of ignoring the "Symbol" speaking to the "People" was太高 (too high).
  *   **Reading:** The brake is useless against Voice. The doctrine assumes conflict arises from formal acts requiring countersignature. It is silent on informal pressure that makes formal refusal politically impossible. The constraint is not legal; it is legitimacy-based.

  **3. Comparative: Netherlands and UK**
  *   **Netherlands:** Abdication is conventional norm. The doctrine (monarch acts on advice) holds, but convention dictates the advice given.
  *   **UK (1936):** Edward VIII sought to marry; government refused advice; he abdicated via Act of Parliament. Similar to Japan: legislation required because the monarch lacks power to alter status.
  *   **Analysis:** The doctrine explains *why* legislation was needed in all three cases (monarch lacks power to change own status). It does not explain *how* the process was triggered. In the Netherlands, convention triggers it. In the UK, crisis triggered it. In Japan, Voice triggered it.
  *   **Conclusion:** The doctrine defines the constraints (legal inertia), but local convention determines the mobility. The doctrine does no work predicting the *method* of change, only the *requirement* for legislation.

  ### Silence of the Doctrine

  The doctrine is explicitly silent on non-binding public expressions of intent by the sovereign. It assumes neutrality is maintained by avoiding policy positions. It does not account for a sovereign expressing personal limitation (age/health) that functions as a policy directive. It assumes the "efficient" part controls the agenda. Here, the "dignified" part set the agenda using public sentiment as leverage.

  Verdict: ANOMALY — Public voice compels legislation outside formal ministerial channels.
