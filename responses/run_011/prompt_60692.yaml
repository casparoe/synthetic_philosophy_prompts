prompt: |-
  I write numerical integration code for coupled nonlinear systems, and I keep losing arguments about what chaos does and does not rule out. Before I read any philosophy of it, I want the specification. Write the desiderata for an account of predictability in deterministic systems: what any such account has to deliver to count as adequate, with the case or result behind each requirement so I can check whether I accept it.

  Make sure the list covers at least these, and add any I've missed:

  - Systems where individual trajectories outrun our error growth but aggregate statistics stay reliable — why forecasting a state and forecasting a distribution are different jobs.
  - Shadowing. The orbit my integrator produces is not close to any true orbit of my equations; numerical analysts say it is close to some true orbit of my system started slightly differently, or of a slightly perturbed system. Does an account have to say whether that is enough for my simulation to count as knowledge, and what happens in systems where shadowing fails?
  - Unpredictability that isn't sensitive dependence at all: some discrete systems are conjectured to admit no shortcut, and a few are known to be able to emulate a universal computer, so predicting them costs a full simulation. What separates that from chaos?
  - Finite precision: my state space is finite, so any computed orbit must eventually repeat. Defect of the implementation, or a fact about prediction?
  - Reversibility: the underlying dynamics run equally well backward, so where does the asymmetry between predicting and retrodicting come from?

  Also name the distinctions the account must not collapse (determinism vs. predictability; unpredictability from initial conditions vs. from model error; growth rates measured over finite windows vs. in the limit; epistemic vs. ontic), and say which requirements are non-negotiable and which are preferences of one camp.

  What I most want: whether some subset is jointly unsatisfiable. I suspect a squeeze — tying unpredictability to a predictor's finite computational resources makes almost everything unpredictable, while tying it to an idealized predictor with unbounded resources and exact initial data makes chaotic systems perfectly predictable — leaving no stable content in between. Say whether that's real or whether there's a way through.

  Format, in this order: **Purpose** (what the account is for — you fix this, but state it, ~150 words); **The desiderata** (numbered, each with its motivating case — the bulk of the answer); **Non-negotiable vs. camp preference**; **Joint satisfiability**; **Scorecard** (brief: how an information-theoretic account that counts bits of precision lost per unit time, a computational-cost account, and a model-error account do against the list); **Where this list is most likely wrong** — which requirement you'd drop under pressure, what argument would change your verdict on the squeeze, and where your reasoning is shakiest.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A practitioner writing numerical integration code for coupled nonlinear systems.
      *   **Problem:** Losing arguments about what chaos rules out regarding predictability.
      *   **Goal:** A specification (desiderata) for an account of predictability in deterministic systems *before* reading philosophy.
      *   **Requirements:**
          *   Cover specific topics: Trajectories vs. Statistics, Shadowing, Computational Irreducibility (Universal Computation), Finite Precision/Periodicity, Reversibility/Retrodiction.
          *   Name distinctions not to collapse (Determinism vs. Predictability, etc.).
          *   Classify requirements (Non-negotiable vs. Camp Preference).
          *   Address Joint Satisfiability (The "Squeeze" problem).
          *   Format: Purpose, Desiderata, Non-negotiable vs. Preference, Joint Satisfiability, Scorecard, Where this list is most likely wrong.
          *   Tone: Technical, precise, pragmatic (for a coder), avoiding fluff.
          *   Length Constraint: Purpose section ~150 words.

  2.  **Deconstruct the "Squeeze" (The Core Philosophical/Technical Tension):**
      *   *Horn 1:* If predictability requires infinite precision/resources, nothing is predictable (except trivial systems).
      *   *Horn 2:* If predictability allows idealized observers with exact data, chaos is predictable (Laplace's Demon).
      *   *Solution:* Predictability must be relativized to a *class of predictors* with *bounded resources* operating within a *specific tolerance* over a *specific horizon*. It's not a binary property of the system alone, but a relation between system, observer, and context.

  3.  **Drafting the Sections:**

      *   **Purpose:** Needs to define *why* we need this account. It's for adjudicating claims about what simulations tell us about reality. It needs to bridge the gap between mathematical ideals and numerical practice. (Keep it tight, ~150 words).
      *   **The Desiderata:** I need to formulate these as requirements for the *account*, not just facts about chaos.
          1.  *Trajectory vs. Distribution:* Must distinguish point-wise error from measure-wise stability. (Case: Climate vs. Weather).
          2.  *Shadowing Validity:* Must specify when numerical orbits represent physical possibilities. (Case: Shadowing Lemma vs. Hamiltonian drift).
          3.  *Computational Irreducibility:* Must distinguish exponential divergence from algorithmic complexity. (Case: Rule 110 vs. Lorenz).
          4.  *Finite Precision/Recurrence:* Must address Poincaré recurrence vs. numerical periodicity. (Case: Fixed-point arithmetic).
          5.  *Temporal Asymmetry:* Must explain why prediction $\neq$ retrodiction despite time-symmetric laws. (Case: Entropy/Lyapunov exponents).
          6.  *Resource Relativity:* Must define the observer's limits. (Addressing the "Squeeze").
          7.  *Error Source Separation:* Must distinguish IC error from Model error.
      *   **Distinctions:** List the ones requested + any crucial ones (e.g., Structural Stability).
      *   **Non-negotiable vs. Preference:**
          *   Non-negotiable: Separation of determinism/predictability, Resource Relativity, Error Source Separation.
          *   Preference: How to handle Shadowing (physical vs. mathematical), Specific definitions of "randomness."
      *   **Joint Satisfiability:** Address the "Squeeze." Is it real? Yes, if you demand absolute predictability. No, if you accept *operational* predictability. The way through is *effective* predictability relative to a tolerance $\epsilon$ and time $T$.
      *   **Scorecard:** Evaluate three accounts (Information-Theoretic, Computational-Cost, Model-Error).
      *   **Where this list is wrong:** Self-critique. Maybe the distinction between model error and IC error is blurrier than admitted. Maybe the "Squeeze" solution is too pragmatic.

  4.  **Refining the Content (Iterative Process):**

      *   *Purpose:* Focus on the practitioner's need. It's not about truth, it's about *warrant*. When can I trust my code?
      *   *Desideratum 1 (Stats):* Call it "Measure Stability." Case: Climate averages vs. daily weather.
      *   *Desideratum 2 (Shadowing):* Call it "Numerical Fidelity." Case: Symplectic integrators vs. non-symplectic in long-term integration.
      *   *Desideratum 3 (Irreducibility):* Call it "Algorithmic Complexity." Case: Wolfram's Class 4 vs. Strange Attractors.
      *   *Desideratum 4 (Precision):* Call it "Discretization Artifacts." Case: Floating point cycles.
      *   *Desideratum 5 (Reversibility):* Call it "Retrodictive Asymmetry." Case: Mixing.
      *   *Desideratum 6 (The Squeeze):* Call it "Observer Relativity."
      *   *Distinctions:* Ensure the list is clear.
      *   *Satisfiability:* The key is rejecting the "Idealized Predictor" as the standard.
      *   *Scorecard:* Be critical. Info-theory is good for rates, bad for cost. Comp-cost is good for irreducibility, bad for noise. Model-error is practical but vague.
      *   *Critique:* Where am I weakest? Probably on Shadowing. It's mathematically neat but physically often irrelevant if the shadowing time is short.

  5.  **Checking Constraints:**
      *   Word count on Purpose? (~150).
      *   Order of sections? (Purpose, Desiderata, Non-negotiable, Satisfiability, Scorecard, Critique).
      *   Tone? (Technical, direct).
      *   Did I cover all user bullet points? (Trajectories/Stats, Shadowing, Universal Comp, Finite Precision, Reversibility).

  6.  **Final Polish:**
      *   Make sure the "Squeeze" answer is decisive. It *is* a real tension, resolved by operationalizing predictability.
      *   Ensure the distinctions are explicitly named.
      *   Check the "Where this list is most likely wrong" section for honesty.

      *(Self-Correction during drafting)*: I initially thought about putting "Determinism vs Predictability" in the Desiderata. But the prompt asks for it in "Distinctions the account must not collapse." I will move it there to follow instructions precisely.
      *(Refining the Squeeze)*: The user suspects a squeeze. I need to confirm it exists for *absolute* accounts but dissolves for *relational* accounts.
      *(Refining Shadowing)*: Make sure to mention systems where shadowing fails (e.g., some non-hyperbolic systems).

  7.  **Final Review against constraints:**
      *   Purpose ~150 words? (Will count carefully).
      *   All 5 specific cases covered in Desiderata? Yes.
      *   Distinctions listed? Yes.
      *   Non-negotiable/Preference split? Yes.
      *   Joint Satisfiability addressed? Yes.
      *   Scorecard included? Yes.
      *   Critique included? Yes.

