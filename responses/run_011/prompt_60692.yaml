answer: |-
  **Purpose**
  This specification defines the necessary conditions for any theory of predictability in deterministic dynamical systems to be useful for numerical practitioners. Its goal is not metaphysical truth, but *warrant*: it must determine when a simulation counts as knowledge of the target system rather than merely a solution to the discretized equations. The account must bridge the gap between mathematical ideals (continuous state spaces, infinite precision) and computational reality (floating-point arithmetic, finite horizons). It must adjudicate claims about what chaos rules out without conflating physical impossibility with computational limitation. Ultimately, it serves to validate integration code by specifying exactly what "predicting" means in contexts where trajectories diverge, shadows fade, and resources are bounded.

  **The Desiderata**

  1.  **Trajectory vs. Measure Distinction:** The account must distinguish between predicting a specific state vector $x(t)$ and predicting a probability measure $\mu(t)$ over state space.
      *   *Case:* Weather vs. Climate. Individual trajectories diverge exponentially (Lyapunov time), rendering point-forecasting impossible beyond weeks. However, invariant measures (climate averages) remain stable and computable over decades. An account claiming chaos rules out *all* prediction fails here.
  2.  **Numerical Fidelity (Shadowing):** The account must specify conditions under which a computed orbit $\{y_n\}$ justifies claims about the true system $\dot{x} = f(x)$, distinguishing between "shadowing a nearby true orbit" and "solving the wrong equations."
      *   *Case:* Hyperbolic vs. Non-hyperbolic systems. In Anosov systems, numerical noise shadows a true trajectory for long times. In systems with homoclinic tangencies or Hamiltonian drift, shadowing times may be shorter than the integration window. The account must declare whether a simulation without a shadowing guarantee is merely exploratory or predictive.
  3.  **Algorithmic Irreducibility:** The account must separate unpredictability due to sensitivity to initial conditions (chaos) from unpredictability due to computational complexity (logical irreducibility).
      *   *Case:* Cellular Automata (e.g., Rule 110). Some discrete systems are Turing complete; predicting their state at step $N$ requires $O(N)$ computation steps because no shortcut exists. This is distinct from chaotic divergence, where the issue is precision, not processing steps. An adequate account must not label all hard-to-predict systems as "chaotic."
  4.  **Discretization Artifacts:** The account must address the conflict between continuous recurrence (Poincaré) and discrete periodicity (floating-point cycles).
      *   *Case:* Fixed-point integration. On a digital machine, state space is finite; every orbit must eventually repeat. If the account defines predictability by long-term behavior, it must explain why numerical periodicity is a defect to be managed (via error analysis) rather than a physical fact about the system.
  5.  **Retrodictive Asymmetry:** The account must explain why prediction and retrodiction differ in difficulty despite time-symmetric underlying dynamics.
      *   *Case:* Mixing flows. Running a chaotic system backward amplifies errors just as running it forward does, but thermodynamic entropy and the practical availability of data create an asymmetry. An account relying solely on time-symmetric Lyapunov exponents fails to capture why we can sometimes reconstruct past attractors better than we can forecast future states (or vice versa, depending on dissipation).
  6.  **Resource Relativity:** The account must define predictability relative to a specific class of predictors with bounded resources (precision, time, memory), rather than an idealized Laplacean Demon.
      *   *Case:* The "Squeeze." If predictability requires infinite precision, nothing is predictable. If it allows infinite precision, chaos is predictable. The account must locate predictability in the relation between system dynamics and observer constraints (e.g., "predictable to $\epsilon$ within time $T$ given $P$ bits").
  7.  **Error Source Separation:** The account must distinguish uncertainty arising from initial condition (IC) uncertainty from uncertainty arising from model structure error.
      *   *Case:* Parameter drift. A simulation may diverge from reality not because of IC sensitivity, but because the equations $\dot{x} = f(x)$ are an approximation of reality $\dot{x} = f(x) + \delta$. An account that blames all divergence on chaos ignores structural inadequacy.

  **Non-negotiable vs. Camp Preference**

  *   **Non-negotiable (Must be satisfied for the account to function):**
      *   *Determinism $\neq$ Predictability:* The account must not treat them as synonymous.
      *   *Resource Relativity (Desideratum 6):* Without this, the "Squeeze" renders the concept useless.
      *   *Error Source Separation (Desideratum 7):* Crucial for debugging code vs. analyzing physics.
      *   *Trajectory vs. Measure (Desideratum 1):* Essential for distinguishing weather from climate.
  *   **Camp Preference (Debatable implementations):**
      *   *Shadowing Status (Desideratum 2):* Some argue shadowing is necessary for validity; others argue statistical fidelity is sufficient even without trajectory shadowing.
      *   *Definition of Randomness:* Whether algorithmic irreducibility (Desideratum 3) counts as a form of stochasticity or distinct determinism.
      *   *Finite Precision (Desideratum 4):* Whether to treat floating-point limits as epistemic noise or ontic discreteness.

  **Joint Satisfiability**

  The "Squeeze" you suspect is real for *absolute* accounts but dissolves for *operational* ones.
  *   **The Trap:** If you define predictability as "an ideal observer with exact data can determine the future," chaos is predictable (Determinism wins). If you define it as "a physical observer with finite data can determine the future," almost nothing is predictable (Skepticism wins).
  *   **The Way Through:** Satisfiability requires rejecting the binary. Predictability is a *continuous variable* (a function of time horizon $T$ and tolerance $\epsilon$). The desiderata are jointly satisfiable only if the account accepts that predictability decays. It does not demand *perfect* prediction, but *bounded* error growth.
  *   **Verdict:** The list is jointly satisfiable provided Desideratum 6 (Resource Relativity) is treated as foundational. If you attempt to satisfy the list using an idealized observer model, Desiderata 1, 4, and 6 will contradict. You must adopt an *effective* theory of prediction.

  **Scorecard**

  | Account Type | Trajectory vs. Measure | Shadowing | Irreducibility | Finite Precision | Resource Relativity | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Information-Theoretic** (Entropy/Kolmogorov-Sinai) | **Pass** (Distinguishes metric entropy) | **Fail** (Assumes true orbits) | **Pass** (Algorithmic complexity) | **Fail** (Assumes continuous) | **Partial** (Rates imply limits) | Good for rates, bad for implementation. |
  | **Computational-Cost** (Complexity Theory) | **Fail** (Focuses on steps, not error) | **N/A** (Discrete systems) | **Pass** (Core strength) | **Pass** (Inherent to model) | **Pass** (Explicit bounds) | Good for CA, weak for ODEs. |
  | **Model-Error** (Structural Stability) | **Pass** (Focuses on robustness) | **Pass** (Central concern) | **Fail** (Ignores logic) | **Pass** (Perturbation focus) | **Partial** (Often ignores cost) | Best for engineering, weak on theory. |

  **Where This List Is Most Likely Wrong**

  1.  **Drop Under Pressure:** **Desideratum 2 (Shadowing).** In high-dimensional systems (e.g., CFD), rigorous shadowing is often unprovable or shadowing times are physically irrelevant. If forced, I would replace "Shadowing" with "Statistical Consistency," accepting that the trajectory is fake but the climate is real.
  2.  **Argument to Change Verdict on Squeeze:** If you can demonstrate a **hyper-computational physical process** (e.g., if the universe computes real numbers exactly), the Resource Relativity requirement collapses, and the "Idealized Predictor" returns. Until then, the operational squeeze stands.
  3.  **Shakiest Reasoning:** **Retrodictive Asymmetry (Desideratum 5).** I treat this as epistemic (data availability), but in dissipative systems, it is ontic (attractors contract volume). My list blurs whether the asymmetry comes from the *dynamics* (contraction) or the *observer* (memory). A rigorous account might need to split this into "Dynamic Reversibility" vs. "Epistemic Retrodiction."
