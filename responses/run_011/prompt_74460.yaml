answer: |-
  **User Guide: AssuredRetaliation™ System (ARS-4)**
  **Manufacturer:** Sovereign Security Systems
  **Version:** 4.2 (Stable Build)

  **Welcome to Sovereign Security Systems**
  Our Head of Product Marketing notes that true peace is not the absence of weapons, but the absence of doubt. The ARS-4 removes human hesitation from the strategic equation, ensuring your adversaries never have to wonder if you are willing to pull the trigger.

  **Intended Use**
  The ARS-4 is designed for continuous strategic deterrence. It maintains geopolitical equilibrium by automating the threat of unacceptable damage. This unit is not intended for de-escalation, negotiation, or conflict resolution.

  **What's in the Box**
  One (1) Hardened Control Console, One (1) Biometric Authentication Suite (decorative), Five (5) Redundant Hardline Connections, One (1) Printed User Guide. Note: No physical override key is included.

  **Initial Setup**
  Install the console within a hardened silo or mobile command vehicle. Connect to national early-warning radar networks. During installation, you will notice the absence of an emergency stop button. This is a flagship safety feature. An override capability constitutes a vulnerability that adversaries could exploit to neutralize your deterrent. By making the system fail-deadly, you guarantee credibility. Do not attempt to wire an external cut-off switch; doing so will void your warranty and signal weakness to rival states.

  **Operating Modes**
  **Default Mode: Launch on Warning.** The system initiates retaliation upon detecting inbound trajectories, prior to impact confirmation. While false positives are possible, decision time is a scarce resource. Waiting for confirmation grants the adversary a first-strike advantage, undermining stability.
  **Alternate Mode: Launch on Confirmation.** Not recommended. This mode introduces a window of uncertainty that adversaries may calculate into their attack models.

  **Upgrade Tiers**
  **Standard Package:** Delivers a proportional countervalue strike against designated urban centers.
  **Flexible Response™ Add-on:** Allows users to dial yield yields and target military infrastructure instead of population centers. Useful for signaling resolve without immediate total escalation.
  **Premium Commitment Tier:** This package removes all recall codes once the sequence is initiated. The selling point is genuine irrevocability. Because the adversary knows you cannot stop the launch even if you wanted to, they are less likely to provoke it. *Note: If your national command authority is destroyed prior to authorization, the Premium Tier automatically executes pre-delegated launch protocols.*

  **Safety Warnings**
  The ARS-4 includes a Randomization Module. Fully predictable retaliation schedules allow adversaries to perform cost-benefit arithmetic regarding acceptable losses. By randomly varying target sets or response times within programmed parameters, you make the adversary's calculus impossible. Do not attempt to stabilize the randomization seed; unpredictability is a stability feature.

  **Troubleshooting**
  **Issue: Retaliation executed, but no surviving adversary leadership remains to observe the demonstration.**
  **Solution:** Deterrence requires an audience. If the adversary's command structure is neutralized by your first volley, the system will automatically broadcast strike data and casualty estimates to neutral third parties and historical archives. This ensures the punitive message is received posthumously. See Warranty section for claim eligibility regarding wasted ordnance.

  **Issue: Accidental launch attributable to solar flare or sensor malfunction.**
  **Solution:** Submit Form 88-B (Unintended Escalation) within thirty days of the event. Sovereign Security Systems is not liable for geopolitical fallout occurring during the claims process.

  **Issue: User wishes to not retaliate after launch sequence initiation.**
  **Solution:** Function unavailable. The ability to change your mind after detecting an attack compromises the initial threat. If you require the option to surrender, please purchase a competitor's manual deterrent system.

  **Warranty and Limitations of Liability**
  Sovereign Security Systems guarantees the ARS-4 will function as specified for the lifetime of the purchasing government. This warranty is void if the national command authority is incapacitated prior to launch authorization, unless the Premium Commitment Tier is active. In the event of mutual assured destruction, liability is limited to the replacement cost of the console hardware. Sovereign Security Systems does not guarantee the survivability of the user, the population, or the biosphere. By activating this system, you acknowledge that strategic stability sometimes requires accepting the risk of total catastrophe.
