answer: |-
  | Requirement | Failure Case It Rules Out | Status (Non-negotiable or Camp Preference) | Main Obstacle to Satisfying It |
  | :--- | :--- | :--- | :--- |
  | **1. Unexploitability (Safety)**<br>*(Distinct from Equilibrium: Must not cooperate against DefectBot, even if (D,D) is an equilibrium)* | The agent cooperates against an opponent that provably defects, yielding the "sucker's payoff." | **Non-negotiable**<br>(Rationality Baseline) | **Löb's Theorem / Spurious Proofs:** Proving the opponent defects without simulating them risks proving false statements if the system is inconsistent or the search depth is insufficient. |
  | **2. Pareto Optimality (Mutual Cooperation)**<br>*(Distinct from Safety: Must cooperate with itself/similar, not just avoid loss)* | The agent defects against a copy of itself (or functionally equivalent agent), yielding (D,D) instead of (C,C). | **Non-negotiable**<br>(Goal of the Field) | **Self-Reference:** The agent must reason about its own output as a function of the opponent's output without triggering infinite regress or logical paradox. |
  | **3. Extensional Robustness**<br>*(Distinct from Undecidability: Behavior should depend on input/output semantics, not source syntax)* | The agent defects against a functionally identical opponent merely because the source code is syntactically different (e.g., variable renaming). | **Camp Preference**<br>(Logical Decision Theorists / MIRI) | **Rice's Theorem:** Determining functional equivalence of arbitrary programs is undecidable; requires restricting the space of admissible opponents. |
  | **4. Bounded Computability**<br>*(Distinct from Theory: Must halt in physical time, not just "in principle")* | The agent enters an infinite loop searching for a proof that does not exist, or exceeds available compute resources. | **Non-negotiable**<br>(Implementability Constraint) | **Halting Problem:** No algorithm can decide in bounded time whether an arbitrary opponent halts/cooperates; requires proof depth limits or oracles. |
  | **5. Fairness (Symmetry)**<br>*(Distinct from Unexploitability: Must not demand more cooperation than it offers)* | The agent cooperates only if the opponent proves they will cooperate *unconditionally*, while the agent itself conditions on the opponent. | **Camp Preference**<br>(Contractualists / Bargaining Theorists) | **Asymmetric Compute:** Defining "fair" when agents have different proof strengths or simulation capabilities is ill-defined; risks deadlock. |
  | **6. Strategic Stability**<br>*(Distinct from Safety: Must be a Nash Equilibrium against the population)* | The agent can be invaded by a mutant strategy that gains higher payoff against the agent than the agent gets against itself. | **Camp Preference**<br>(Evolutionary Game Theory) | **Selection Pressure:** An agent optimized for one-off cooperation (e.g., FairBot) may lose resources to simpler defectors in a noisy evolutionary environment. |

  ### The Unsatisfiable Subset

  The following four desiderata form a jointly unsatisfiable set for general programs, given the Halting Problem and Gödelian incompleteness: **Unexploitability**, **Pareto Optimality**, **Bounded Computability**, and **Extensional Robustness**.

  1.  **Unexploitability** requires you to defect unless you can prove the opponent cooperates.
  2.  **Pareto Optimality** requires you to cooperate with any opponent that would cooperate with you.
  3.  **Extensional Robustness** requires you to recognize *any* functionally equivalent cooperative agent, regardless of source code.
  4.  **Bounded Computability** requires you to make this decision in finite time.

  To satisfy Unexploitability and Pareto Optimality simultaneously, you must decide if an arbitrary opponent cooperates with you. To satisfy Extensional Robustness, you must do this for *any* syntactic variation of that opponent. To satisfy Bounded Computability, you must do this without running the opponent (which might loop). This requires solving the Halting Problem for the opponent's source code.

  **Cheapest to Weaken:** **Extensional Robustness**.
  It is computationally cheaper to accept that your agent will only cooperate with a specific *class* of provable agents (e.g., Modal Agents, or agents within a specific proof system) rather than all functionally equivalent agents. This concedes that source code syntax matters, but it allows the agent to halt and remain unexploitable within that defined class. Weakening Unexploitability is irrational; weakening Pareto Optimality defeats the purpose of the field; weakening Bounded Computability makes implementation impossible.

  ### The Largest Excluder

  The single requirement that excludes the largest share of existing theoretical proposals is **Bounded Computability**.

  Many foundational agents in the program equilibrium literature (e.g., **FairBot**, early **Modal Agents**) assume access to an oracle for provability or permit unbounded proof search. They rely on fixed-point theorems (like Löb's Theorem) that hold in Peano Arithmetic but do not account for the time complexity of finding the proof. **Masquerade** was a significant step toward satisfying this requirement by bounding the search depth, but it did so by sacrificing Extensional Robustness (it becomes brittle to opponents that reason at different depths). Consequently, most "solutions" in the literature are mathematically consistent but physically unrealizable without weakening the robustness or cooperation guarantees.
