      *   **Speaker's Background:** Non-lawyer, academic (likely CS/AI/Philosophy), paper co-author dropped out (incentives section weak), thesis provocative.
      *   **Thesis:** AI safety via debate shouldn't focus on judge competence but on *cost of defense* (commitment consistency). False claims are harder to defend consistently than true ones. Protocol design > Judge training. Analogy: Cross-examination > Peer Review.
      *   **Empirical Basis:** Thin (synthetic tasks, LLM debaters, crowdworker judges).
      *   **Deliverable:** A prep sheet with 8-10 objections ordered by (Likelihood $\times$ Difficulty).
      *   **Objection Style:** Specific to *this* audience (legal/evidence focus), not generic AI safety. Phrased in the voice of the specific audience members (Judge, Evidence Prof, Litigator, etc.).
      *   **Reply Requirements:** ~2-minute spoken reply, honest note on weakness, flag for partial concession.
      *   **Specific Focus:** Turn the courtroom analogy against the speaker (adversarial procedure, burden of proof, misleading advocates, appellate review, incomprehensible evidence).
      *   **Doctrinal Check:** Explicitly state if legal claims are settled or contested among experts.
