      *   **Language:** American English.

  2.  **Deconstruct the Audience & Thesis Tensions:**
      *   *Evidence Professors:* Care about Daubert, Rule 702, reliability vs. validity, the actual efficacy of cross-examination. One thinks cross-exam is weak for science.
      *   *Magistrate Judge:* Cares about case management, settlement, actual fact-finding limitations, judicial economy, the "truth" vs. "resolution" distinction.
      *   *Litigators:* Care about strategy, discovery, asymmetric resources, how games are actually played (not theory), client interests.
      *   *Philosopher:* Care about epistemic justification, probability thresholds, Bayesian updates.
      *   *CS Person:* Knows the AI lit, might challenge the "cost" metric or the LLM capability assumptions.
      *   *Thesis Weakness:* "Cost of defense" is abstract. Legal procedure isn't just about consistency; it's about credibility, narrative, and rules of exclusion. The empirical base is weak (crowdworkers $\neq$ judges). The "Cross-exam > Peer Review" slide is a lightning rod.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Idea 1 (Cross-Exam Skeptic):* You say cross-exam works, but Evidence Prof X says it doesn't work for science.
      *   *Idea 2 (Judge):* Judges don't just find facts; they manage process. What about discovery?
