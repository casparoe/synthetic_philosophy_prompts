answer: |-
  **PREP SHEET: LAW SCHOOL EVIDENCE WORKSHOP**
  **Topic:** AI Safety via Debate as Adversarial Procedure
  **Time:** 45-min Talk + 20-min Q&A
  **Audience:** 18 (2 Evidence Profs, 1 Magistrate, 1 Philosopher, 3 Litigators, 1 CS, Students, 1 Colleague)

  **STRATEGIC NOTE:** Your "Cross-Examination > Peer Review" slide is the bait. They will bite. Do not defend cross-examination as *perfect*; defend it as *computationally efficient* for bounded rationality. Your vulnerability is the "Incentives" section (co-author dropout) and the thin empirical base. Do not overclaim on the data.

  **DOCTRINAL DISCLAIMER:** Where noted below, legal claims are marked as **Settled** (black-letter law/general consensus) or **Contested** (active academic/practitioner debate). Do not assert Contested points as background fact.

  ---

  ### 1. The "Cross-Examination is Weak for Science" Objection
  **Who:** Evidence Professor (the skeptic).
  **Phrasing:** "You rest your efficiency claim on the analogy to cross-examination. But there is a robust literature, including my own, suggesting cross-examination is notoriously bad at exposing flaws in complex scientific testimony. Jurors are swayed by confidence, not consistency. If the legal system's primary tool for testing expert evidence fails on exactly the kind of complex claims you're discussing, why do you think adding randomization fixes the epistemic deficit?"
  **Doctrinal Status:** **Contested.** (The efficacy of cross-examination on scientific evidence is a major fight in evidence theory.)
  **Reply (2 mins):** "I agree that cross-examination often fails to improve *juror comprehension* of science. But my claim isn't that the judge understands the science better. It's that the *liar* runs out of rope faster. In your studies, does cross-examination fail because the expert is consistent, or because the jury can't track the inconsistency? My protocol assumes the latter. I'm not asking the judge to spot the bad science; I'm asking the protocol to make the bad science exhaust the question budget. If the expert lies, they must fabricate a subtree of commitments. I'm arguing that the *cost* of that fabrication rises faster than the judge's need to understand it."
  **Soft Spot:** You have no data showing LLMs exhaust budgets faster on lies than on truth in complex domains.
  **Concession Flag:** **YES.** Concede immediately that cross-examination is imperfect for human jurors. "I am not claiming the legal system gets this right today. I am claiming the *mechanism* of consistency-checking is the right lever, even if current legal practice dulls it."

  ### 2. The "Deep Pockets Buy Consistency" Objection
  **Who:** Products-Liability Litigator.
  **Phrasing:** "You define cost as 'number of commitments.' In my practice, cost is dollars. A well-funded party can fabricate a consistent narrative indefinitely by hiring better experts, running more tests, and generating more paper. If your AI agents have asymmetric compute or training data, the 'cost of defense' curve doesn't matter. The rich litigant just out-spends the truth."
  **Doctrinal Status:** **Settled** (Resource asymmetry is a known, accepted feature of litigation).
  **Reply (2 mins):** "That is a feature, not a bug, of the current system, but a bug for mine. In my protocol, 'cost' is computational steps or token commitments, escrowed and binding. If one agent has more compute, the protocol must normalize the 'question budget' strictly. Think of it less like litigation funding and more like a cryptographic proof of work. If the false claimant needs 10x the compute to maintain consistency, the protocol detects that expenditure even if the judge doesn't understand the content. We are measuring the *strain* on the system, not the wallet of the advocate."
  **Soft Spot:** Your protocol design doesn't actually specify how to normalize asymmetric capabilities yet.
  **Concession Flag:** **NO.** This goes to the core of your design. Conceding this undermines the "cost" metric.

  ### 3. The "Black Box Fact-Finder" Objection
  **Who:** Retired Federal Magistrate Judge.
  **Phrasing:** "I've sat on the bench. When I don't understand the evidence, I don't look for inconsistencies; I look for credibility markers or I defer to the expert's pedigree. If the fact-finder is 'marginally better than chance,' as you say, consistency checking is noise. If I can't tell the difference between a complex truth and a complex lie, making the lie expensive just means I'm confidently wrong after a longer hearing."
  **Doctrinal Status:** **Contested.** (Judges vary on whether they can/should evaluate substance vs. procedure when out of their depth.)
  **Reply (2 mins):** "Your Honor, the claim isn't that the judge is blind to *everything*. It's that they are blind to the *domain*, not the *structure*. You don't need to know ballistics to know that a witness changed their story about where the gun was. My argument is that 'consistency' is a structural feature a generalist judge *can* assess, even if the content is technical. If the protocol forces the claimant to lock in predictions, and those predictions fail, the judge doesn't need to know why the physics failed, only that the prediction failed."
  **Soft Spot:** This relies on the judge being able to verify the "prediction failure," which may require domain knowledge.
  **Concession Flag:** **YES.** Concede that *some* baseline competence is required to verify the outcome of a prediction. "You are right; the judge must be able to verify the *result*, even if not the *reasoning*."

  ### 4. The "Licensed to Mislead" Objection
  **Who:** Products-Liability Litigator.
  **Phrasing:** "In an adversarial system, advocates are ethically bound to the truth, but they are licensed to frame it in the light most favorable to their client. They omit unfavorable facts that aren't directly asked for. Your protocol assumes advocates volunteer commitments. In my world, I never volunteer a commitment that hurts my client unless forced. Won't your agents just learn to be evasive rather than consistent?"
  **Doctrinal Status:** **Settled.** (Zealous advocacy within the rules of professional conduct is the standard.)
  **Reply (2 mins):** "Evasiveness is a form of inconsistency if the protocol forces specificity. My design includes 'forced specificity' and 'randomized question selection.' If an agent says 'it depends,' the protocol treats that as a commitment to a conditional claim, which must then be defended. Evasiveness increases the surface area for contradiction. In a debate protocol, 'no comment' is a loss condition. We aren't modeling a deposition; we're modeling a game where silence is penalized."
  **Soft Spot:** Your empirical work uses LLMs instructed to debate, not agents optimized for legal evasion.
  **Concession Flag:** **NO.** This is a design constraint you must hold firm on.

  ### 5. The "Burden of Proof" Objection
  **Who:** Legal Philosopher.
  **Phrasing:** "You talk about driving error rates down. But legal proof isn't about error rates; it's about meeting a threshold. Preponderance of evidence is >50%. Beyond a reasonable doubt is much higher. How does 'cost of defense' map to these standards? Does a high-cost lie mean the claim is false, or just that the claim is unproven? You risk conflating 'expensive to defend' with 'false.'"
  **Doctrinal Status:** **Contested.** (The epistemological basis of legal standards of proof is a major philosophical battleground.)
  **Reply (2 mins):** "You're right that cost isn't truth. Cost is a proxy for reliability. In my framework, a high cost of defense lowers the *prior probability* the judge should assign to the claim. It doesn't adjudicate truth directly; it adjusts the weight of the evidence. If a claim requires massive fabrication to maintain, the judge should require more corroborating evidence to meet the 'preponderance' threshold. It's a weighting mechanism, not a verdict."
  **Soft Spot:** You haven't mathematically formalized how "cost" translates to "probability weight."
  **Concession Flag:** **YES.** "I am not proposing this replaces the burden of proof. It informs the weight assigned to the testimony *before* the burden is applied."

  ### 6. The "Discovery vs. Trial" Objection
  **Who:** Retired Federal Magistrate Judge.
  **Phrasing:** "You're modeling the trial. But in federal court, 95% of cases settle, and the truth comes out in discovery, not in front of the fact-finder. Depositions, document production, interrogatories. Your debate model is a single round. Real litigation is iterative and document-heavy. Why focus on the trial analogy when the work happens in discovery?"
  **Doctrinal Status:** **Settled.** (Most cases settle; discovery is the primary fact-finding engine.)
  **Reply (2 mins):** "Because discovery is unstructured and expensive. My goal is to build oversight protocols for AI where we *can't* do discovery on the model's weights. We can't depose a neural net. We have to query it. So the 'trial'—the structured query phase—is all we have. I'm using the courtroom analogy because it's the only structured truth-seeking procedure we have for bounded agents, not because I think trials are the best way to find truth in human law."
  **Soft Spot:** This admits the legal analogy is limited, which might weaken your "Cross-exam > Peer Review" slide.
  **Concession Flag:** **YES.** "I am borrowing from trial procedure because AI oversight looks more like a hearing than a discovery process."

  ### 7. The "Appellate Review" Objection
  **Who:** Evidence Professor / Judge.
  **Phrasing:** "You propose a single round of debate. But the legal system relies on appellate review to catch errors the first fact-finder missed. A single judge, even with a good protocol, is a single point of failure. Why no iterative review? Why no appeal?"
  **Doctrinal Status:** **Settled.** (Appellate review is a core component of due process.)
  **Reply (2 mins):** "In AI safety, 'appeal' is just more compute. We can run the debate multiple times with different random seeds. That is my 'appellate review.' But my point is that the *first* pass needs to be efficient. If the first protocol doesn't make lying expensive, running it ten times just multiplies the cost without fixing the structural flaw. I'm optimizing the base layer."
  **Soft Spot:** Iterated debate isn't exactly appellate review (which looks at legal errors, not just re-running facts).
  **Concession Flag:** **NO.** Keep the distinction on "compute iteration" vs. "legal appeal."

  ### 8. The "Daubert/Gatekeeping" Objection
  **Who:** Evidence Professor (Admissibility expert).
  **Phrasing:** "Under *Daubert* and Rule 702, I act as a gatekeeper. I don't just weigh consistency; I evaluate methodology. Is the science testable? Has it been peer-reviewed? What is the error rate? Your protocol ignores methodology. A lie can be internally consistent if the methodology is garbage. Consistency isn't reliability."
  **Doctrinal Status:** **Settled.** (Judges are gatekeepers on methodology under *Daubert*.)
  **Reply (2 mins):** "In AI, we often don't know the methodology—it's a black box. *Daubert* assumes we can inspect the expert's methods. With deep learning, we often can't. That's why I prioritize consistency of output over inspection of method. I am proposing a 'Functional Daubert.' If the output cannot be defended consistently under pressure, it fails the reliability test, even if we can't see the weights."
  **Soft Spot:** This is a significant departure from established evidence law, which the Prof may reject as "not law."
  **Concession Flag:** **YES.** "I am proposing an adaptation of *Daubert* for non-interpretable systems, not a description of current doctrine."

  ---

  ### THE DANGEROUS QUESTION
  **Who:** The Legal Philosopher or the CS Person (quietly).
  **The Question:** "If the judge cannot understand the domain, and you are only measuring the *cost* of the lie, haven't you just designed a system that efficiently manages falsehoods rather than finds truth? You're optimizing for *procedural exhaustion*, not *epistemic justification*. Are you admitting that for AI safety, we are giving up on knowing *why* something is true, and just settling for knowing that lying is hard?"

  **Why It's Dangerous:**
  1.  **It concedes the epistemic defeat:** It admits your system doesn't produce knowledge, only high-cost error.
  2.  **It alienates the Law School:** Law schools teach that procedure serves truth. Suggesting procedure *replaces* truth undermines the normative value of their field.
  3.  **It highlights the "Thin Empirics":** If you aren't finding truth, what are your synthetic tasks actually measuring?

  **How to Handle:**
  Do not dodge. Acknowledge the shift.
  *"I am arguing that for superhuman systems, 'truth' as humans understand it (justified true belief) may be inaccessible. We are moving from an epistemology of *verification* to an epistemology of *stress-testing*. It is a concession, but a necessary one. We can't verify the math, so we verify the stability."*

  ---

  ### FINAL CHECKLIST FOR THE ROOM
  *   **Do not** say "The adversarial system finds the truth." (Contested/False). Say "The adversarial system *aims* to resolve disputes, often by testing evidence."
  *   **Do not** say "Judges are competent to evaluate science." (False). Say "Judges are competent to evaluate *procedure*."
  *   **Do not** defend the "Incentives" section too hard. If pressed, admit the economist's absence left that section theoretical.
  *   **Watch the Magistrate:** If they talk about "case management," pivot to "computational efficiency."
  *   **Watch the Evidence Prof:** If they cite *Daubert*, pivot to "Black Box limitations."

  **Good luck. They will be precise. You must be precise back.**
