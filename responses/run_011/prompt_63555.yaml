answer: |-
  You are describing a phenomenon that sits at the intersection of legal theory, sociology, and political philosophy. You are correct that "disparate impact" is insufficient; that is a statistical observation of the *result*, not a description of the *mechanism*. Disparate impact tells you the wall hit you; it doesn't explain why the wall was built in your path but not in someone else's.

  There is no single, universally agreed-upon noun for this, but there is a cluster of established concepts that describe different facets of it. If you want the precise mechanism of how the majority tradition becomes invisible while the minority tradition becomes marked, the strongest existing framework is **The Unmarked Category** combined with **Formal Neutrality**.

  However, because you asked for a term that captures the specific *power dynamic* of this invisibility—where the baseline itself is biased but claims to be neutral—I will offer a synthesized term at the end.

  Here are the nearest existing concepts, how they differ from what you are seeing, and where their edges lie.

  ### 1. Formal Neutrality vs. Substantive Equality
  **The Concept:** In legal theory, this is the distinction between treating everyone the same (formal) versus treating everyone in a way that accounts for different starting points (substantive).
  **How it fits:** The rules you describe (no head coverings, no prayer) are *formally neutral*. They apply to the Catholic majority and the Muslim minority equally on paper.
  **The Edge:** This concept explains the *legal structure*, but it doesn't explain the *cultural invisibility*. It explains why the rule exists, but not why the Christmas break isn't seen as a violation of the same rule. It is too dry to capture the sociological "normalcy" you are observing.

  ### 2. The Unmarked Category (Linguistics/Sociology)
  **The Concept:** Borrowed from linguistics, this describes how one option in a pair becomes the "default" (unmarked) while the other becomes the "deviation" (marked). For example, "actor" is often unmarked (default), while "actress" is marked (specific). In culture, the majority identity is unmarked; it is just "people." The minority identity is marked; it is "Muslim people" or "religious people."
  **How it fits:** This is the closest fit for your observation. The majority's practices (Christmas breaks, handshakes) are unmarked—they are labeled "culture," "tradition," or "politeness." The minority's practices are marked—they are labeled "religious symbols" or "accommodations."
  **The Edge:** This describes the *labeling*, but not necessarily the *harm*. It explains why the bias is invisible, but it doesn't fully capture the institutional enforcement aspect (the town hall meetings, the laws).

  ### 3. Symbolic Violence (Pierre Bourdieu)
  **The Concept:** This occurs when a dominant culture imposes its norms so successfully that the dominated group accepts them as natural, legitimate, or inevitable, even when those norms work against their own interests.
  **How it fits:** This captures the power dynamic you mentioned: "the burdened group can't even frame a complaint." To complain, they would have to challenge the baseline (e.g., call Christmas break religious), which the system refuses to validate. The violence is "symbolic" because it is exercised through language and categorization, not just physical force.
  **The Edge:** This is a broad sociological term. It covers everything from accent discrimination to class structures. It might feel too heavy or broad for a specific policy discussion about school boards.

  ### 4. Majoritarian Secularism (Political Science)
  **The Concept:** This argues that "secularism" is rarely an empty neutral space. Instead, it is often a space shaped by the majority religion's history, which has faded into the background. In France and Quebec, *laïcité* often functions as a way to manage minority religions while leaving majority cultural habits untouched.
  **How it fits:** This is specific to the religion context you described in Lyon and Montreal. It explains why the chapel stays but the hijab goes.
  **The Edge:** It is too specific to religion. It doesn't easily cover language laws or workplace dress codes that aren't explicitly about faith.

  ***

  ### The Synthesized Term: Hegemonic Neutrality

  Since no single existing term perfectly captures the *mechanism of invisible baseline bias* across legal, cultural, and institutional lines, I propose the term **Hegemonic Neutrality**.

  **Definition:**
  **Hegemonic Neutrality** is a structural mechanism where the norms, practices, and symbols of a dominant group are encoded into institutions as "neutral," "standard," or "secular," while the norms of minority groups are encoded as "specific," "religious," or "deviant."

  Unlike *disparate impact* (which measures the outcome), Hegemonic Neutrality describes the *design*. It posits that the baseline itself is not empty; it is filled with the majority's culture, but that culture is granted immunity from scrutiny because it holds hegemonic power.

  **Why this term works:**
  *   **Hegemonic:** Acknowledges that this is about power and dominance (the majority sets the rules).
  *   **Neutrality:** Acknowledges the disguise (the rules claim to be fair/universal).
  *   **Mechanism:** It explains *how* the bias survives. It survives because it doesn't look like bias; it looks like "the way things are."

  ### Boundary Cases: Does it apply elsewhere?

  You asked if this needs religion specifically to work. It does not. **Hegemonic Neutrality** applies wherever a dominant culture sets a baseline that is mistaken for a universal standard.

  **1. Language Requirements (Yes)**
  *   **The Rule:** "All official business must be conducted in French/English."
  *   **The Hegemony:** The majority speaks the official language natively. For them, this rule requires zero effort. It is invisible.
  *   **The Deviation:** For immigrants or minorities, this requires translation, classes, or legal aid. It is marked as a "barrier" they must overcome, rather than a rule the state imposes.
  *   **Fit:** High. The majority language is treated as the "neutral" medium of communication, not a cultural artifact.

  **2. Workplace Dress Codes (Yes)**
  *   **The Rule:** "Professional attire required."
  *   **The Hegemony:** "Professional" is usually coded as Western business wear (suits, ties, uncovered hair). This matches the majority's default wardrobe.
  *   **The Deviation:** Braids, headscarves, or traditional garments are flagged as "unprofessional" or requiring "accommodation."
  *   **Fit:** High. The majority's clothing is invisible (just "clothes"); the minority's clothing is visible (a "statement").

  **3. Standardized Testing (Partial)**
  *   **The Rule:** "A neutral test of merit."
  *   **The Hegemony:** Questions often rely on cultural context or vocabulary familiar to the majority class.
  *   **The Deviation:** Minorities must decode the cultural context *and* answer the question.
  *   **Fit:** Medium. This is often called "Cultural Bias," which is a subset of Hegemonic Neutrality.

  ### Summary of Differences

  | Term | Focus | Why it's not quite enough |
  | :--- | :--- | :--- |
  | **Disparate Impact** | **Outcome** | Proves the wound, not the weapon. Doesn't explain why the rule exists. |
  | **Formal Neutrality** | **Legal Structure** | Describes the rule's text, not its cultural application. |
  | **The Unmarked Category** | **Sociology** | Explains the invisibility, but not the institutional enforcement. |
  | **Hegemonic Neutrality** | **Power Mechanism** | **Captures the design, the invisibility, and the power dynamic.** |

  ### The Trap of the Complaint
  You noted that the burdened group can't frame a complaint without challenging the baseline. Under **Hegemonic Neutrality**, this is a feature, not a bug.

  If a Muslim parent in Lyon or Montreal argues, "The no-headscarf rule hurts me," the system replies, "The rule is neutral; it bans *all* symbols."
  If they argue, "But the Christmas break is religious," the system replies, "No, that is *culture*."

  Because the majority tradition holds the power to define what counts as "religion" versus "culture," the minority is forced to argue on a field where the definitions are rigged. They are asked to prove they are burdened by a rule that the majority does not experience as a rule at all.

  **Hegemonic Neutrality** is the name for that rigging.
