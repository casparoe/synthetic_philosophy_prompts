  As for the columns of the monthly return, you speak as though a form should accommodate everything a historian might wish to know. But the form accommodates what the treasury required to be paid and the labour officer required to be counted. That the ruled lines foreclose the entry of a worker's complaint is not a conspiracy against evidence; it is the definition of the record's function. If the worker spoke, and the clerk did not write it in that column, the clerk has recorded the fact that the column was for numbers, not speech. This does not reduce the file to evidence only of the office. It remains evidence of the transaction between the office and the village, even if the transaction was one of reduction. To alter the file to include what was excluded would be to forge a record that never existed.

