          *   Foundation = Fundamental facts/entities.
          *   Upper Floors = Derivative facts/entities.
          *   Load/Weight = Ontological dependence.
          *   Gravity = The direction of grounding (asymmetry).
          *   Ground under foundation = ??? (Nothing? God? Brute fact?)
