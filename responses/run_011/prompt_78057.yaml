answer: |-
  **The Frame as Falsetto: A Defense of Curatorial Forgery**

  The concept of forgery in aesthetics has traditionally hinged on the provenance of the object. A forgery is a lie about genesis: a canvas painted yesterday bearing the signature of a master dead for centuries. But the case you propose—what we might term **curatorial forgery**—complicates this topology. Here, the object is honest. The label confesses the date (2025), the method (model-trained, period-executed), and the agents (living hands). The lie is not in the text, but in the syntax of the exhibition itself. By installing this honest pastiche as the culminating work of a monographic retrospective, the curator invites the viewer to absorb a simulation into the canon of the master's achievement.

  The question is whether this constitutes a genuine category of forgery. Can an object be aesthetically diminished by being a forgery when there is no deception about its physical origins? Or is this merely a curatorial impropriety, a harmless fiction of context that leaves the aesthetic encounter intact? To answer this, we must determine whether aesthetic value resides in the perceptual encounter alone or is inextricably bound to the causal history of the work's making. I argue for the latter: curatorial forgery is a genuine aesthetic fraud because it falsifies the narrative of artistic achievement that constitutes the work's identity in autographic arts. The aesthetic value of the work is diminished because the cognitive frame required to appreciate it as a "culmination" is mismatched with the reality of its production.

  To test this claim, we must first press it against Nelson Goodman's distinction between the autographic and the allographic arts. For Goodman, painting is autographic: the work's identity is bound to its specific history of production. A perfect copy of a Rembrandt is not a Rembrandt, regardless of visual indistinguishability, because it lacks the correct causal history. In standard forgery, Goodman argues that even if we cannot perceptually distinguish the fake from the real, the knowledge that it *might* be a fake alters our aesthetic experience; we look for flaws, and the work loses its status as a witness to a specific historical moment.

  In the case of curatorial forgery, Goodman's framework initially seems to exonerate the curator. The label explicitly denies the object is a Rembrandt. It admits the causal history is broken. Therefore, strictly speaking, no one is claiming this canvas is an instance of the work *The Return of the Prodigal Son*. However, Goodman's rigor regarding autography cuts deeper than the object's passport. In a monographic retrospective, the "work" on display is not merely the individual canvas but the *oeuvre* itself, constructed narratively through the hang. The retrospective posits a unified artistic consciousness developing through time. By placing the 2025 pastiche as the finale, the curator asserts that this object belongs to the same autographic lineage as the preceding rooms.

  Goodman would reject this. If the work is autographic, the history of production is constitutive. A work generated in 2025 cannot be the "culmination" of a 17th-century life, because the causal chain is severed. The curator is not merely mislabeling an object; they are misidentifying the *work-identity*. They are asking the viewer to treat an allographic instance (a style-structure that can be replicated) as an autographic conclusion (the unique terminus of a life's struggle). Thus, while the object is not a forgery in the legal sense, the *presentation* creates a forged artistic fact. It treats the oeuvre as a style that can be continued, rather than a history that has ended. For Goodman, this is a category error that corrupts the aesthetic experience, because the viewer is trained to perceive the brushwork as the trace of a specific mind at a specific time. If that trace is simulated, the perceptual training is misdirected. The "forgery" lies in the false promise of continuity.

  Denis Dutton's account of forgery offers even stronger support for the validity of curatorial forgery as a category. Dutton argues that forgery is a crime not primarily against truth-telling, but against artistic achievement. We value art because it represents a human performance—the solving of problems, the overcoming of limitations. A forger steals the credit for an achievement they did not earn. In standard forgery, the forger pretends to have solved the problems of the 17th century. In curatorial forgery, the deception is more subtle but equally parasitic.

  The 2025 canvas, executed in period materials, undoubtedly represents *an* achievement: the living painters have solved the technical problem of mimicry, and the model has solved the statistical problem of style. However, by placing it as the *master's* culmination, the curator attributes the achievement of *synthesis* to the dead master. It implies that the master's style naturally evolved toward this resolution. This is a falsification of art-historical achievement. It suggests the master resolved tensions in their late style that they actually left open, or that their vision extended into a future they never saw. Dutton would argue that this diminishes the work aesthetically because it asks us to admire a performance that did not happen. We are invited to marvel at the master's late lucidity, but that lucidity is a retroactive projection by a 21st-century algorithm. The aesthetic value is diminished because the admiration is misplaced; we are clapping for a ghost. The "crime" is the attribution of agency. Even if the label admits the date, the hang attributes the *authority*. It is a forgery of agency, which is the core of Dutton's definition.

  The opposing line of thought, however, demands serious confrontation. A perceptualist or formalist might argue that if the canvas sustains the same perceptual encounter as an authentic late work, then the history of its making is irrelevant to its aesthetic value. If the brushstrokes evoke the same emotion, if the composition resolves the same visual tensions, then the work succeeds *as art*. On this view, the retrospective's hang is at worst a curatorial impropriety—a lie about history, but not a lie about art. The aesthetic object is the thing before the eyes, not the biography in the archive. If the viewer feels the emotional weight of a "late style," does it matter if that weight is generated by a simulation?

  This argument fails because it relies on a naive conception of the "perceptual encounter." Aesthetic experience in the visual arts is not purely retinal; it is cognitive. As Goodman himself noted, we do not see with innocent eyes. We see through categories. When a viewer enters the final gallery of a Rembrandt retrospective, they bring a specific cognitive set: they are looking for the summation of a life, the distillation of decades of labor. They perceive the brushwork as *economical* because they know it comes from an old master; they perceive the color as *melancholic* because they know it comes from a dying man.

  Curatorial forgery exploits this cognitive set. It relies on the viewer importing the biographical context of the master to make sense of the visual data. If the viewer knew the work was a 2025 pastiche *and* understood it as such (i.e., hung in a section on "Legacy" or "Influence"), the perceptual encounter would change. The brushwork would look "mimetic" rather than "expressive." The composition would look "derivative" rather than "evolved." The fact that the curator relies on the viewer *not* making this distinction—despite the label—proves that the aesthetic value *does* depend on the causal history. The "look" of the work is not intrinsic to the pigment; it is constituted by the viewer's understanding of the pigment's origin. By obscuring the origin through placement, the curator alters the aesthetic properties of the work. The work appears "profound" only under the description "Rembrandt's final thought." Under the description "2025 Simulation," it becomes "competent pastiche." Since the aesthetic properties shift based on the causal history, the history is constitutive of the value. Therefore, misrepresenting that history is an aesthetic crime.

  Furthermore, the perceptualist objection ignores the temporal dimension of the oeuvre. A retrospective is an argument about time. It claims that Time T1 leads to Time T2. Curatorial forgery inserts a false Time T_final. It creates a fictional teleology. If aesthetic value includes the coherence of the narrative arc (which it must in a retrospective), then breaking the causal chain breaks the aesthetic logic of the exhibition. The "work" being forged is not just the canvas, but the *narrative of the career*.

  We must therefore reach a definite verdict. Is curatorial forgery a genuine category? Yes. Is the object aesthetically diminished by it? Yes.

  The verdict rests on the conclusion that in autographic arts, aesthetic value is not a property of the surface alone, but of the surface *as a trace of action*. Curatorial forgery attempts to decouple the trace from the action while retaining the value of the trace. It wants the authority of the master without the risk of the master's mortality. It wants the closure of the oeuvre without the finality of death. This is not merely a curatorial lie; it is an aesthetic contradiction. It asks the viewer to engage with the work as a historical testament while knowing it is a contemporary fabrication. This cognitive dissonance degrades the experience. The viewer cannot fully surrender to the illusion of the master's presence because the label denies it, yet cannot fully appreciate the work as a contemporary piece because the hang denies that too. The work is stranded between categories, belonging to neither the past nor the present, but to a fabricated continuum.

  Consequently, the causal history of making is not an external fact that attaches to the art; it is the ground upon which the art stands. To forge the context is to undermine the ground. Curatorial forgery is thus a genuine category of aesthetic fraud. It demonstrates that in the autographic arts, truthfulness about genesis is not a moral add-on to the aesthetic experience; it is a precondition for the experience itself. The canvas may be honest, but the exhibition is a lie, and because the exhibition dictates the terms of perception, the art itself is compromised. We must reject the notion that the hang is merely "impropriety." It is a falsification of the work's identity, and in aesthetics, to falsify identity is to commit forgery.
