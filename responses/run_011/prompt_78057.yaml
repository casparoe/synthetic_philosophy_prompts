      *   **Goodman:** Discuss Autographic/Allographic. Show that while the object isn't a forgery in the strict sense (it's not claiming to be the physical artifact), the *work* (as an aesthetic entity) is being misrepresented. Goodman's "epistemic anxiety" applies to the narrative, not just the paint.
      *   **Dutton:** Focus on achievement. The forgery lies in attributing the *solution* to the master. It cheapens the master's actual struggle and the contemporary creator's actual labor.
      *   **The Opposing View (Perceptualism):** Acknowledge the strength (the look is the same). Refute it by arguing that aesthetic experience is cognitive. The "look" is informed by the "story." If the story is rigged, the experience is corrupted.
      *   **Conclusion:** Final verdict. Aesthetic value depends on causal history. Curatorial forgery is a fraud against the *continuity of meaning*.

