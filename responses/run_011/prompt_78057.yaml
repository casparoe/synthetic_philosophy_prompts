      *   **Constraint:** Do not settle for "intuitions divide." Reach a definite verdict on whether aesthetic value depends on causal history.
      *   **Tone:** Academic, rigorous, suitable for a PhD chapter in aesthetics.

  2.  **Deconstruct the Concept ("Curatorial Forgery"):**
      *   Standard forgery: Deception about *origin* (fake signature, fake provenance).
      *   Curatorial forgery: Truth about *origin*, deception about *context/canon*.
      *   Is it a forgery? Or is it a lie about art history?
      *   Key tension: Does the "work" include its framing, or is the "work" just the physical object? If the framing is part of the presentation, does misframing constitute forgery?

  3.  **Evaluate Goodman:**
      *   *Autographic Arts:* Painting is autographic. The history of production is constitutive of the work's identity. A copy is not the work.
      *   *Application:* In standard forgery, Goodman says even a perfect copy is aesthetically inferior because we can't know if it's the original. But here, we *know* it's not the original.
      *   *Stretch:* Goodman focuses on the object's history. If the label says "2025," Goodman would say this is *not* a Rembrandt. It's a different work. Placing it in the retrospective doesn't make it a Rembrandt. So, is it a forgery of a Rembrandt? No, it's a misclassified object. Goodman might say the "forgery" label doesn't apply because there's no attempt to pass the *object* off as the *original object*. However, the *effect* is to pass it off as part of the *oeuvre*. Goodman's strictness on history suggests the work *cannot* be part of the oeuvre regardless of placement.
      *   *Verdict on Goodman:* He helps define why it's *not* the master's work, but struggles to call it "forgery" if the label is honest. It's more of a category error.

  4.  **Evaluate Dutton:**
      *   *Forgery as Crime against Achievement:* Dutton argues we value art because of the human achievement behind it. A forgery pretends to be an achievement it isn't (e.g., solving a artistic problem the forger didn't actually solve).
      *   *Application:* In "Curatorial Forgery," the label admits the lack of historical achievement. But the *placement* implies a continuity of achievement (the "culminating work").
      *   *Stretch:* Dutton cares about the *performance* of the artist. If the museum implies this is the master's final solution to a problem, but it's actually a 2025 simulation, the museum is lying about the *nature of the achievement*. It attributes the creative agency to the dead master rather than the living collaborator/AI.
      *   *Verdict on Dutton:* This fits better. The "crime" is against the narrative of artistic development. It falsifies the art-historical record of achievement.

  5.  **Evaluate the Opposing View (Formalism/Perceptualism):**
