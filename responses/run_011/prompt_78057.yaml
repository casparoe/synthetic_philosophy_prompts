      *   *Counter:* Art isn't just retinal. It's cognitive. Knowing *who* did it and *when* changes the perception (Goodman's "training of perception"). If I think this is 1669, I see it as a late style. If I know it's 2025, I see it as a pastiche. The "Curatorial Forgery" tries to have it both ways: the visual pleasure of the old, the alibi of the new.
      *   *Rebuttal:* The placement *induces* a specific perceptual set. It asks the viewer to perceive it as a resolution of the master's life work. That perception is false. Therefore, the aesthetic experience is built on a false premise.

  6.  **Develop the Verdict:**
      *   *Thesis:* "Curatorial Forgery" is a genuine category, but it is distinct from standard object-forgery. It is a forgery of *context* which inevitably alters the *work's identity* in autographic arts.
      *   *Reasoning:* In autographic arts, the work is not just the canvas; it is the canvas *in relation to its genesis*. By manipulating the context to imply a false genesis (or false continuity of genesis), the curator creates a "fictional work" that occupies the physical space of a real one. The aesthetic value is diminished because the cognitive engagement required to appreciate the work (as a culmination of a life) is mismatched with the reality (a simulation).
      *   *Refinement:* It's not that the object is a forgery (the label is honest). It's that the *presentation* creates a forged *art-historical fact*. Is that "forgery"? Yes, if we accept that the "work" in a museum setting includes its framing conditions.
      *   *Decision:* I will argue **FOR** the category. It highlights that aesthetic value is not purely perceptual but relies on the *narrative of production*. The "Curatorial Forgery" attempts to steal the authority of the master without the risk of the master.

  7.  **Drafting - Section by Section:**
