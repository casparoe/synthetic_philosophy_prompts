answer: |-
  Good evening. Thank you for having me.

  We are here to talk about Disney's *Mulan*, and we are here to talk about Confucian Role Ethics—specifically the version articulated by Henry Rosemont and Roger Ames. For those unfamiliar, the core proposition is this: there is no 'self' that exists prior to or independent of the roles we inhabit. We are not discrete atoms wearing social costumes; we are the sum of our relationships. To be a person is to perform a role—daughter, father, soldier, subject—and *ren* (humaneness) is not an internal virtue waiting to be let out, but the consummatory quality of that performance.

  The tension, as many of you have already spotted, is glaring. *Mulan* is arguably the most individualist text Disney ever produced. It gives us the anthem of the residual self: *'Who is that girl I see, staring straight back at me?'* It posits a core identity trapped beneath social expectation, waiting to break free. If Role Ethics says there is no 'inside' to break out of, surely this film is the enemy?

  I am going to commit to a position tonight. I am not going to split the difference. I am going to argue that the Role-Ethic reading is the correct one, and that the Individualist reading is a superficial misreading of the film's own narrative logic.

  However, I am not going to pretend this is easy. To make this work, we have to be brutal about where the film fights us. So, here is my commitment: *Mulan* is not a story about a girl finding herself; it is a story about a girl forging a new role where none existed, and having her community ratify it. The Individualist reading wins the lyrics, but the Role-Ethic reading wins the plot.

  If I am right, the Individualist reading has to pay a heavy price. It has to treat the film's resolution as a lie. It has to claim that when Mulan returns home with the Emperor's crest and her father's sword, she hasn't actually achieved anything other than 'being herself'. It has to ignore that her father's embrace is not just 'I love you', but 'You have restored our honour'. The Individualist reading must treat the social validation at the end as incidental decoration. The Role-Ethic reading treats it as the entire point.

  Let us work through the three specific problems you raised, to see if this commitment holds.

  **1. The Matchmaker Scene: *Li* Gone External**

  The opening act presents us with *li* (ritual propriety) as a checklist. The Matchmaker recites the virtues: 'Quiet', 'Demure', 'Graceful'. Mulan fails the checklist. She spills the tea, she writes on her arm, she brings the cricket.

  The Individualist reading says: 'See? Ritual is stifling. It suppresses the true self.'
  The Role-Ethic reading must say: 'No. That is not *li*. That is bureaucracy.'

  For Ames and Rosemont, *li* is not a costume you wear to hide your feelings. It is the practice through which feelings are cultivated. A ritual performed without the appropriate spirit is not 'too much ritual'; it is *bad* ritual. The Matchmaker scene is not a critique of Role Ethics; it is a critique of a society that has forgotten what its roles are *for*.

  The village has reduced 'daughter' to a set of mechanical outputs designed to secure a advantageous marriage. Mulan fails the mechanical test, yes. But notice what she does immediately after. She does not run away to live in the woods as a hermit. She cuts her hair and takes her father's place. She does not reject the role of the filial child; she doubles down on it. She performs the ultimate act of *li*—protecting the father—by violating the superficial norms of gendered behaviour.

  If we accept the Role-Ethic reading, the Matchmaker scene is not the thesis of the film; it is the diagnosis of the problem. The society has confused the map for the territory. Mulan isn't rejecting roles; she is rejecting a *corrupt* performance of roles. This saves the philosophy. If *li* is meant to cultivate feeling, then a *li* that crushes the capacity to act (like saving one's father) is already broken. Mulan fixes the ritual by breaking the rule.

  **2. The Deception: Lying to the Community**

  This is the harder pill to swallow. Mulan lies. She assumes the identity of 'Ping'. In a Role-Ethic framework, where personhood is constituted by how others see you, lying about who you are should be catastrophic. It severs the relational web. She is deceiving Shang, her comrades, and the Emperor.

  The Individualist says: 'She has to lie to be free. The truth would kill her.'
  The Role-Ethic must say: 'The lie is a provisional scaffold for a new role.'

  Here is the pricing: We have to admit that the deception is morally hazardous. Role Ethics cannot simply wave this away. However, consider the resolution. When her identity is revealed, Shang does not kill her. He spares her. Why? Because her conduct as 'Ping' was consummatory. She saved the army. She saved the Emperor.

  In liberal ethics, the lie taints the act. In Role Ethics, the act can reconfigure the meaning of the identity. Mulan does not take off the armour and say, 'Actually, I am just Mulan.' She says, 'I did this as a daughter.' The deception was not about hiding her self; it was about accessing a role (soldier) that was necessary to fulfil her primary role (daughter).

  The critical moment is not when she is outed, but when the Emperor bows to her. The highest authority in the relational web validates the new configuration. He offers her a position in his council. She declines, not to be 'free', but to return to her father. The lie is pardoned because the *result* strengthened the web of relationships rather than weakening it.

  Does Role Ethics have the resources to handle this? Yes, but only if we accept that role innovation sometimes requires temporary disruption. The 'lie' is the friction caused by expanding the definition of 'soldier' to include 'woman'. If we insist on the Individualist reading, we have to say she lied to protect her 'inner truth'. If we stick to the Role-Ethic reading, she lied to protect the *structure* of her family from collapse. The latter fits the stakes of the film: if her father goes, the family starves. This isn't self-actualisation; it's structural survival.

  **3. The Structural Worry: Conservatism and Role Refusal**

  This is the objection I expect from the floor. Role Ethics looks conservative. It makes you out of your roles. What if the roles available are oppressive? What if the society offers no place for you? If Mulan had not been able to save China, would Role Ethics just tell her to go back to the Matchmaker?

  The Individualist reading has an easy answer here: 'She has a right to self-determination.'
  The Role-Ethic reading has to work harder. It cannot appeal to 'rights'. It must appeal to 'fit'.

  My commitment is this: Role Ethics does not demand passive acceptance of existing roles; it demands the *extension* of roles to meet new circumstances. Mulan does not refuse the role of 'daughter'. She argues, through action, that the role of 'daughter' in a time of invasion *must* include 'defender'.

  If the society simply does not offer the role you need, Role Ethics suggests you must build it out of the materials you have. Mulan uses the crest, the sword, and the armour—symbols of the old order—to forge the new one. She does not appeal to a universal human right to fight; she appeals to the specific needs of her father and her state.

  However, I must price the loss here. The Role-Ethic reading cannot account for a total rejection of the system. If Mulan had said, 'I will not be a daughter, and I will not be a soldier, I will be a merchant,' the film would break under this philosophy. Role Ethics struggles with radical discontinuity. It can handle *reform*, but it struggles with *revolution*. To make this work, we have to admit that *Mulan* is a conservative film in the philosophical sense. It restores the status quo, albeit a modified one. She goes home. The hierarchy remains. The Emperor is still Emperor.

  If you are looking for a philosophy that grounds the right to walk away from your family entirely, Role Ethics is not it, and *Mulan* is not the vehicle. But if you are looking for a philosophy that explains how to change a system from within by performing its values better than the gatekeepers do, this pairing holds.

  **Where the Pairing Breaks: The Honest Critique**

  Now, I must tell you where I am forcing it. I promised you honesty, and there are three places where the film actively resists the Role-Ethic reading, and where an honest critic must admit the strain.

  First: **The Ancestors.**
  The Great Ancestors are a philosophical problem. They act as a supernatural jury that validates Mulan's 'inner worth' before she has even performed the role. They send Mushu. This implies a metaphysical backing to her identity that exists *before* the social ratification. In Role Ethics, you are validated by the living community, not by spiritual essences. The Ancestors suggest there is a 'Mulan-ness' in the bloodline that the Matchmaker failed to see. That is essentialism, not role ethics. To keep my reading, I have to treat the Ancestors as a narrative device for the audience, not a metaphysical claim within the ethics of the film. It is a strain.

  Second: **The Romance.**
  Li Shang. In a Role-Ethic reading, Shang should be a node in the network, a superior officer whose respect signifies professional ratification. But the film turns him into a romantic reward. The song *'I'll Make a Man Out of You'* is about training, yes, but the subplot resolves with a romantic pairing. This pulls the film back toward the liberal 'happily ever after' where the individual finds love. Role Ethics doesn't necessarily forbid romance, but it subsumes it into the family structure. The film hints at a marriage, but it frames it as Mulan 'getting the guy'. This individualises the relational web. It suggests she earns a partner, rather than entering a new relational node. It's a small point, but it tilts the gravity back toward the individual.

  Third, and most dangerously: **The Song 'Reflection'.**
  I cannot talk my way around this. The lyrics are explicitly essentialist. *'When will my reflection show who I am inside?'* This posits an 'inside' that is distinct from the 'outside'. It is the exact inverse of Ames and Rosemont.
  To maintain my commitment, I have to argue that the song is a moment of *confusion*, not clarity. It is Mulan diagnosing her own pain incorrectly. She *thinks* she is hiding a self. In reality, she is struggling to find a role that fits. The pain she feels is not the pain of suppression, but the pain of *role-dissonance*. She is trying to perform 'daughter' in a context where 'daughter' is defined as 'bride'.
  If I stand up here and tell you the song is wrong, you might boo me. But philosophically, if we accept Role Ethics, the song must be read as the protagonist's misunderstanding of her own condition, which is only corrected by the end of the film when she realises she doesn't need to show her 'inside', she needs to show her *filial piety*.
  This is the biggest strain. It requires us to tell Disney they wrote their own theme song incorrectly.

  **The Payoff: What the Film Does**

  So, why do this? Why not pick a film that fits the philosophy neatly? Why struggle with *Mulan*?

  Because a journal article on Role Ethics can define the theory, but it cannot show you the *phenomenology* of wearing a role until it becomes you.

  Ames and Rosemont write about 'role-bearing persons'. But what does that feel like? *Mulan* shows us the physical weight of the armour. It shows us the voice training. It shows us the blisters. It dramatises the transition from 'performing a role' to 'inhabiting a role'.

  When Mulan cuts her hair, she is not revealing a true self. She is destroying the physical marker of the old role to make space for the new one. The film captures the *anxiety* of role innovation. It shows us that becoming a person is exhausting work. It is not a birthright; it is a labour.

  There is a specific moment I want to leave you with. It is not the end. It is when she takes the cannon and climbs the mountain. She is alone. She is not doing it for the army anymore; they are gone. She is not doing it for her father; he is far away. She is doing it because the role she has built—'the one who saves China'—demands it.
  In that moment, there is no audience. There is no community to ratify her. And yet, she acts.
  A strict Role-Ethic might say she ceases to be a person in that moment of isolation. But the film suggests something more profound: that once a role is truly integrated, it guides you even when the relational web is temporarily invisible. The role has become the self, not because there was a self underneath, but because the performance has become automatic, embodied, and total.

  The film shows us that 'authenticity' is not about stripping away the roles to find the gem underneath. Authenticity is the seamless fit between the actor and the part. When Mulan wears the armour at the end, she does not look like a girl in a costume. She looks like a warrior who is also a daughter. The roles do not cancel each other out; they stack.

  **Conclusion**

  So, here is my final verdict.

  If you want a film that illustrates liberal individualism, *Mulan* is perfect, provided you ignore the ending.
  If you want a film that illustrates Confucian Role Ethics, *Mulan* is perfect, provided you ignore the lyrics.

  I am asking you to ignore the lyrics.

  The Individualist reading leaves us with a girl who went to war to find herself and came home to play with toys. The Role-Ethic reading leaves us with a woman who expanded the moral imagination of her culture and redefined what it means to be a daughter.

  The losing side—the Individualist reading—has to give up the stakes. It has to admit that 'saving China' is just a backdrop for 'finding yourself'. It reduces the epic to the psychological.
  The Role-Ethic reading keeps the stakes. It keeps the honour, the family, the state, and the ancestors (metaphorically) intact. It acknowledges that we are made by what we do, and that sometimes, to save the people we love, we have to become someone new.

  Is it strained? Yes. The song fights me. The ancestors fight me. But the arc of the narrative—the movement from failure in the Matchmaker's house to acceptance in the family temple—is a movement of role cultivation, not role rejection.

  Use this film. But warn your audience: do not listen to what the characters say they are doing. Watch what they actually do. They are not finding themselves. They are building themselves. And that is a much harder, and much more interesting, thing to be.

  Thank you.
