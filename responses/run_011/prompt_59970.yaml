  **Scenario**

  Elara shapes a vessel from plastic clay on January 1. It dries naturally by January 10. On January 20, the piece enters the kiln; firing chemically vitrifies the clay into ceramic, an irreversible transformation under ordinary conditions. The vessel is deemed a finished work only upon cooling on January 21. Elara dies that same day. Her will bequeaths "all finished artworks" to the Museum and "all raw materials" to her Son. The vessel is the sole candidate for both clauses.

  At January 1 and 10, only clay exists; no artwork is yet present. At January 20, the material is transforming within the kiln; the process is incomplete, so no finished work exists. At January 21, the cooling is complete, and the finished work exists alongside the ceramic matter. The dispute turns strictly on the object count at January 21. If one object exists, it falls under "finished artwork" (Museum wins). If two objects exist, the constituting matter may fall under "raw materials" (Son wins share). The survival conditions of the work and the matter are now identical: smashing the ceramic destroys both; preserving it saves both. No modal divergence remains to drive the count.

  **Timeline**

  1.  **Jan 1 (Shaping):** Plastic clay shaped. (Count: 1)
  2.  **Jan 10 (Drying):** Clay dry, unfired. (Count: 1)
  3.  **Jan 20 (Firing):** Vitrification in progress; not finished. (Count: 1)
  4.  **Jan 21 (Completion):** Cooling complete; Elara dies. (Count: Disputed)

  **Verdicts**

  (i) **Monism:** Counts 1 object at all moments. At Moment 4, the artefact *is* the ceramic matter. Principle: Identity. The dominant kind is "Ceramic Object"; "Artwork" is a phase.
  (ii) **Constitution without Identity:** Counts 1 object at Moments 1–3 (only matter exists). Counts 2 objects at Moment 4 (matter constitutes artefact). Principle: Constitution relation arises when artefact sortal is satisfied.
  (iii) **Coincidence Pluralism:** Counts 1 object at Moments 1–3. Counts 2 objects at Moment 4. Principle: Distinct sortals ("Ceramic Matter" vs. "Vase") are wholly co-located once both conditions are met.
  (iv) **Stage/Counterpart Theory:** Counts 1 stage at Moments 1–3 (matter-stage). Counts 2 stages at Moment 4 (matter-stage + artefact-stage). Principle: Count is sortal-relative; "How many objects?" is incomplete without specifying the sortal counterpart relation.

  *Self-Audit:* The scenario avoids "the vase and the clay" at Moment 4, using "finished work exists alongside the ceramic matter" to avoid presupposing plurality. "Sole candidate" avoids presuming success.

  **Analysis**

  The single feature driving the pluralist verdict is the **satisfaction of the artefact sortal** grounded in historical intention, not modal divergence. Since survival conditions are locked, the intuition that there are "two things" cannot rely on differing future possibilities.

  **Minimal Edit:** Remove the intention/history. If the ceramic shape were a natural formation, the artefact sortal fails. All four positions then agree: Count 1 (only matter exists) at Moment 4.

  **Monist Attack:** The strongest monist objection is that firing does not destroy the lump but merely changes it qualitatively. The "clay" becomes "ceramic matter," but there is still only one substance. The case never had two candidates; it had one object changing properties. The distinction is conceptual, not ontological.

  **Synchronic vs. Diachronic:** The case remains one of synchronic constitution at Moment 4, but the *grounds* for the count are diachronic (history of firing). This shift matters diagnostically: it shows the anti-monist intuition survives the loss of the reshaping argument, but it migrates from modal to **historical/sortal** distinctness. We feel there are two objects because one has a history of intention the other lacks, even if their futures are identical. The residue is not modal, but historical.
