answer: |-
  **Office of Marketing Adjudication**
  **Case Reference:** OMA/2024/PH-09
  **Date:** 14 October 2024
  **Parties:** Veridical Visions Ltd (Advertiser); Common Kind Consortium (Complainant)

  **1. Summary of Advertisement**
  The advertisement promotes bespoke, artificially induced hallucinations supplied to private clients. The primary claim states the products are 'indistinguishable from the real thing'. The small print adds a further, more awkward claim in the same idiom: 'Indistinguishable even upon philosophical reflection'.

  **2. The Complaint**
  The Complainant, a rival firm whose products are marketed on the opposite principle, alleges the claim is misleading. They argue that what an artificially induced hallucination and a genuine perception have in common is precisely what makes them indistinguishable — a shared factor that can be specified, measured and advertised. Since the Advertiser produces no specification of any property its product shares with a veridical perception, the Complainant contends there is no basis on which a customer could check the comparison.

  **3. The Response**
  The Advertiser's defence is a thoroughgoing negative disjunctivism. Its products are not to be characterised positively at all; there is nothing it is like to have them over and above their being indiscriminable from veridical perceptions. The demand for a shared specification simply assumes that the two cases must fall under a common kind before they can be confused for one another.

  **4. Assessment**
  4.1. The Panel first addresses the causal argument that motivates the Complainant's position: a matching proximal cause and a matching neurophysiology, hence a matching state of mind. While internally coherent, the Panel finds that a firm may not legitimately advertise on the strength of it. Regulatory verification requires observable metrics, not inferences from hidden physiological causes to mental states.

  4.2. The Panel considers the Complainant's screening-off objection: if a common factor is present in both cases and accounts for the client's inability to tell them apart, the Advertiser's talk of disjuncts does no explanatory work whatsoever. The Advertiser's reply is given in full and is not a straw man: that this objection assumes what it was meant to establish, since a shared factor however well specified redescribes the indistinguishability rather than explaining it. The Panel notes this creates a circular stalemate inaccessible to empirical adjudication.

  4.3. There is a reciprocal difficulty for the Advertiser. If one of its products has no positive characterisation, what makes it the particular hallucination it is — of a lemon, say, rather than of a bellows? The Panel questions whether its catalogue can be anything other than a list of things its products are not. Trading standards require affirmative descriptions of goods, not merely negative differentiations from reality.

  4.4. The Panel must determine whether 'is either a veridical perception or an indiscriminable hallucination' counts as a product property at all. It is the determination of the Office that this is a disjunctive predicate of the kind no self-respecting regulator would accept in a specification. Consumer clarity requires assertoric properties, not metaphysical alternatives contingent on the external world's existence.

  4.5. Finally, regarding the customer testimonial the Advertiser submits in support — a client who reports that he could not tell the difference — the adjudicator ought to recognise this as evidence of nothing whatever on the Advertiser's own theory. On that theory indiscriminability is constitutive of the product rather than detectable in it. A subjective report confirms neither quality nor compliance, as the inability to tell is the definition of the product, not a test result.

  **5. Ruling**
  The complaint is Upheld. The advertisement is misleading. Product specifications must consist of positive, verifiable properties. A claim relying on the absence of a difference, without specifying the common ground upon which the comparison rests, cannot be substantiated within this regulatory framework. Consumers are entitled to know what a product is, not merely what it might not be.
