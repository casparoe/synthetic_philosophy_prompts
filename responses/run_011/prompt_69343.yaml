      **Office of Marketing Adjudication**
      **Case Reference:** OMA/2024/PH-09
      **Date:** 14 October 2024
      **Parties:** Veridical Visions Ltd (Advertiser); Common Kind Consortium (Complainant)

      **1. Summary of Advertisement**
      The advertisement promotes bespoke, artificially induced hallucinations. The primary claim states the products are 'indistinguishable from the real thing'. The small print adds: 'Indistinguishable even upon philosophical reflection'.

      **2. The Complaint**
      The Complainant, a rival firm marketing hallucinations based on a shared common factor theory, alleges the claim is misleading. They argue that indistinguishability implies a shared property which can be specified and measured. Since the Advertiser provides no specification of any property shared with veridical perception, the Complainant contends there is no basis on which a customer could check the comparison.

      **3. The Response**
      The Advertiser defends the claim via negative disjunctivism. They argue their products are not to be characterised positively. There is nothing it is like to have them over and above their being indiscriminable from veridical perceptions. They assert the demand for a shared specification assumes the two cases must fall under a common kind before they can be confused, which is precisely what is denied.

      **4. Assessment**
      4.1. The Complainant relies on a causal argument: matching proximal cause and neurophysiology entail a matching state of mind. While scientifically plausible, advertising on the strength of unobservable neurophysiological identity falls outside standard verification protocols. A firm may not legitimately advertise on the strength of a metaphysical inference regarding state identity.

      4.2. The Complainant raises a screening-off objection: if a common factor accounts for the inability to tell cases apart, the Advertiser's talk of disjuncts does no explanatory work. The Advertiser replies that this objection assumes what it was meant to establish, since a shared factor however well specified redescribes the indistinguishability rather than explaining it. The Panel notes this creates a circular stalemate inaccessible to empirical adjudication.

      4.3. There is a reciprocal difficulty for the Advertiser. If one of its products has no positive characterisation, what makes it the particular hallucination it is — of a lemon, say, rather than of a bellows? The Panel queries whether a catalogue can be anything other than a list of things its products are not, which violates requirements for positive product description.

      4.4. The Panel considers whether 'is either a veridical perception or an indiscriminable hallucination' counts as a product property at all. It is the view of the Office that this is a disjunctive predicate of the kind no self-respecting regulator would accept in a specification. Consumer clarity requires assertoric properties, not metaphysical alternatives.

      4.5. Finally, regarding the customer testimonial submitted in support — a client who reports that he could not tell the difference — the adjudicator ought to recognise this as evidence of nothing whatever on the Advertiser's own theory. On that theory indiscriminability is constitutive of the product rather than detectable in it. A report of indistinguishability confirms neither quality nor compliance.

      **5. Ruling**
      The complaint is Upheld. The advertisement is misleading. Product specifications must consist of positive, verifiable properties. A claim relying on the absence of a difference, without specifying the common ground upon which the comparison rests, cannot be substantiated within this regulatory framework.

