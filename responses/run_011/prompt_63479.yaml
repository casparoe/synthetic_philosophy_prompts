answer: |-
  The Global Health Endowment holds assets valued at 100 units on a standardized welfare scale. It faces a single allocation decision. Option Safe is a conventional grant program yielding a certain return of 100 units. Option Risky is a speculative research initiative costing the same endowment principal. Based on expert consensus, Option Risky has a 1 in 10,000 probability of producing a breakthrough valued at 10,000,000,000 (10 billion) units, and a 9,999 in 10,000 probability of failure, yielding a residual value of 1 unit. Two decision-makers evaluate this choice. Both hold identical credences regarding the probabilities and outcomes. Both maximize expected utility. They differ only in their utility functions over welfare units $x$. Agent U employs an unbounded function, $u_U(x) = \ln(x + 1)$. Agent B employs a bounded function, $u_B(x) = 1 - e^{-x/1,000,000,000}$, which asymptotes to 1.

  **Arithmetic and Verdicts**
  For Agent U (Unbounded):
  *   **Safe:** $u_U(100) = \ln(101) \approx 4.615$.
  *   **Risky:** $(0.0001 \times \ln(10^{10} + 1)) + (0.9999 \times \ln(2))$.
      *   $\approx (0.0001 \times 23.026) + (0.9999 \times 0.693)$.
      *   $\approx 0.0023 + 0.6929 = 0.6952$.
  *   **Verdict:** $4.615 > 0.6952$. Agent U **rejects** the Pascalian bet.

  For Agent B (Bounded):
  *   **Safe:** $u_B(100) = 1 - e^{-100/10^9} \approx 1 \times 10^{-7}$.
  *   **Risky:** $(0.0001 \times (1 - e^{-10})) + (0.9999 \times (1 - e^{-1/10^9}))$.
      *   $\approx (0.0001 \times 0.99995) + (0.9999 \times 1 \times 10^{-9})$.
      *   $\approx 0.0001 + 0.000000001 \approx 0.0001$.
  *   **Verdict:** $0.0001 > 0.0000001$. Agent B **accepts** the Pascalian bet.

  **The Operative Feature**
  The reversal is generated by the **local curvature near the downside outcome**, not the global bound. Agent U's logarithmic function is highly concave near zero, assigning massive disutility to the drop from 100 to 1 (a loss of ~4 utility units) relative to the gain from 100 to 10 billion (a gain of ~18 utility units). Agent B's exponential function is nearly linear in this specific range because the saturation point (1 billion) is far above the outcomes. Consequently, Agent B treats the upside as capturing nearly 100% of total possible utility while treating the downside loss as negligible, whereas Agent U treats the downside loss as catastrophic relative to the upside gain.

  **Counterfactual**
  If we remove the steep curvature near zero by shifting Agent U's function to be linear ($u_U(x) = x$), Agent U immediately accepts the bet (Expected Value $\approx 1,000,000$ vs Safe 100). If we lower Agent B's saturation point to 200 units ($u_B(x) = 1 - e^{-x/200}$), the upside utility caps at $\approx 1$, but the safe option rises to $\approx 0.39$, while the risky option becomes $(0.0001 \times 1) + (0.9999 \times 0.005) \approx 0.00015$. Agent B would then reject the bet. The verdicts track local risk aversion, not boundedness itself.

  **Defense and Critique**
  A defender of bounded utility would attack the calibration of Agent B's function, arguing that a sincere bounded utility should reflect significant risk aversion over moderate stakes (the 100 units), not treat them as negligible noise against a distant cap. They would contend that $u_B$ is implausibly risk-neutral in the domain of human-scale consequences. The honest reply is that boundedness constrains the *upper* tail of utility, which is the standard site of fanaticism, but dictates nothing about the *lower* tail. In this case, the "fanaticism" (taking the bet) is driven by the bounded agent's indifference to the moderate safe option relative to the cap, while the unbounded agent's "prudence" is driven by logarithmic loss aversion. Boundedness alone does not cure fanaticism; it merely shifts the locus of sensitivity. If the bound is set high enough, a bounded agent behaves like a risk-neutral fanatic over realistic ranges, while an unbounded agent with sufficient concavity behaves like a cautious conservative.
