answer: |-
  ### The Core Diagnosis: The Doctrinal Paradox

  You have stumbled upon a known problem in social choice theory called the **Doctrinal Paradox** (or Discursive Dilemma). It occurs when a group votes on premises (criteria) versus conclusions (outcomes) and gets opposite results.

  *   **Case 1** used **Premise Aggregation**: You counted votes on each criterion, found a majority for each, and approved the outcome, overruling the majority of reviewers who voted "Reject."
  *   **Case 2** used **Conclusion Aggregation**: You counted votes on the final outcome ("Block" vs. "Ship"), ignored that the reasons differed, and blocked the release because a majority of people voted "Block."

  These are logically incompatible. You cannot consistently apply both. One prioritizes the *logic of the argument* (Case 1); the other prioritizes the *responsibility of the voter* (Case 2).

  ### Severity Ranking

  1.  **The Case 1 vs. Case 2 Contradiction (Critical):** This is a structural flaw in your decision engine. It allows you to justify any outcome by switching aggregation methods post-hoc. It undermines the legitimacy of the process.
  2.  **Case 5: The Mean Severity Score (High):** Averaging ordinal data (1–5 scales) is mathematically unsound for binary gates. It allows a single extreme outlier (the "5") to overrule a consensus of "2s". This is a specific, fixable instance of the broader aggregation problem.
  3.  **Case 4: Meta-Criteria Disagreement (Medium):** Reviewers disagreeing on *what* counts is a process failure, but less dangerous than counting votes incorrectly. It indicates your rubric is under-specified.
  4.  **Case 3: Temporal Consistency (Low):** This is not a problem. Your reasoning here is correct. A board is a function, not a constant; if inputs (data/context) change, outputs can change without contradiction.

  ### The Verdict to Sacrifice

  **You must give up the verdict in Case 1.**

  **Why:** Case 1 approved a proposal where **two out of three reviewers identified a fatal flaw**, even if the flaws differed (Budget vs. Maintenance). By approving via Premise Aggregation, you authorized a project that Ana thinks is unfunded and Bo thinks is unmaintainable. You have created a "Frankenstein" approval: every part has majority support, but no one supports the whole. This diffuses accountability. If the project fails due to budget, Ana says "I voted No." If it fails due to maintenance, Bo says "I voted No." You are left holding the bag.

  Case 2 (Blocking) is safer. Blocking a release when two people see *different* risks is risk-averse. Approving a project when two people see *different* risks is risk-seeking. In engineering, risk-seeking on approvals is unsustainable.

  ### The Unified Principle

  To codify this in your process doc without needing to know the stakes, adopt **Conclusion Aggregation (Holistic Voting)**.

  **The Rule:**
  > "Reviewers vote on the final outcome (Approve/Reject or Ship/Block) based on their own application of the criteria. The decision is determined by the majority of outcome votes. Criteria scores are for feedback only and do not determine the gate."

  **Precise Wording for the Doc:**
  > "Panel decisions are binding based on a majority vote on the **final outcome**. Reviewers may weigh the published criteria differently according to their judgment. If a majority of reviewers vote to Reject/Block, the proposal is rejected, regardless of whether they cite the same reasons. Averaging of scores is prohibited; only binary outcome votes are counted."

  ### Costs of This Principle

  1.  **Loss of Nuance:** You lose the ability to see that "everyone agrees the design is sound" (Case 1). You only know "majority says no." You will need a separate feedback channel to capture the "why" for the proposers.
  2.  **Inconsistency of Reasoning:** As in Case 2, you may block a release where Dana worries about bugs and Eli worries about rollbacks. They don't agree on the problem, only the solution. This can be frustrating for engineers seeking a specific fix.
  3.  **Reduced "Compromise":** You can no longer approve a proposal where everyone likes *parts* of it but no one likes the *whole*. This reduces the volume of approved work, acting as a stricter filter.

  ### Application to Case 5

  Your current rule (Mean ≥ 3) failed because it treated a single "5" as equal to two "2s" in aggregate, effectively letting one person veto two.

  Under **Conclusion Aggregation**:
  *   Reviewer 1 (Score 5) → Votes **Block**.
  *   Reviewer 2 (Score 2) → Votes **Ship**.
  *   Reviewer 3 (Score 2) → Votes **Ship**.
  *   **Result:** 2 vs 1 → **Ship**.

  This aligns with your intuition that Case 5 was "badly handled." It restores the power to the majority of humans rather than the arithmetic of the scores.

  ### Addressing Your Specific Questions

  **1. Are Case 1 and Case 3 genuinely in conflict?**
  No. Case 3 is about **State Dependence** (inputs changed over time), while Case 1 is about **Aggregation Logic** (how votes are counted). You can have a consistent aggregation rule (Conclusion Aggregation) that produces different outcomes at different times (Case 3) because the reviewers' holistic judgments changed based on new data. They operate on different layers of the process.

  **2. What about Case 4 (The Promotion)?**
  Your uncertainty here was valid. Under the new principle, Case 4 resolves cleanly. If two members say "Promote" (ignoring mentorship) and one says "Deny" (citing mentorship), the outcome is **Promote**. The rule does not require reviewers to agree on *criteria*, only on *outcome*. This prevents a single reviewer from holding a process hostage by introducing a criterion no one else agreed to. However, you should still fix the rubric to prevent this confusion in the future.

  **3. Which single verdict should I give up?**
  As stated above: **Case 1.**
  *   **Keep Case 2:** Blocking when a majority sees *any* fatal risk is safe engineering.
  *   **Keep Case 3:** Changing decisions based on new data is rational.
  *   **Keep Case 4's Outcome (Promote):** Majority rule on outcome resolves criteria disputes.
  *   **Fix Case 5:** The "badly handled" verdict is corrected by the new rule (Ship).

  ### Summary Recommendation

  Your current process allows you to "shop" for a majority. You can find a majority on criteria to approve (Case 1) or a majority on outcomes to block (Case 2). This makes the process predictable only to you, not the participants.

  **Adopt Conclusion Aggregation.** It forces reviewers to take ownership of their veto. If Ana wants to reject the RFC in Case 1, she must vote "Reject" overall, not just "No" on budget. This makes the cost of rejection explicit. It is the only principle that scales without requiring you to arbitrate the stakes of every proposal personally.
