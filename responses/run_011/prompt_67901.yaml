answer: |-
  ### 1. Conditions for Falsity

  For your thesis to be false, there must exist at least one instance where the probability of the data given the adaptation hypothesis is significantly higher than the probability of the data given any non-adaptive rival, such that the inference is no longer merely abductive but empirically constrained. The evidence required must break the symmetry between "selected for function X" and "by-product/constraint/learning."

  *   **Genetic Signatures of Recent Selection:** If a specific psychological trait were linked to a specific genetic variant, and that variant showed a statistical signature of a selective sweep (reduced variation, high frequency) dating to the relevant ancestral period, this would discriminate selection from drift or constraint.
      *   *Status:* **Conceptually available, practically difficult.** Psychological traits are typically polygenic, making single-locus sweeps unlikely. Furthermore, linking specific cognitive phenotypes to specific alleles remains beyond current resolution.
  *   **Phylogenetic Independent Contrasts:** If a psychological trait appeared in multiple distinct lineages exactly when a specific ecological pressure emerged, and was absent in closely related lineages lacking that pressure, this would support convergent adaptation over shared inheritance.
      *   *Status:* **Practically difficult.** Psychological traits do not fossilize. Inferring them in extant relatives is possible but often relies on behavioral proxies that are themselves open to interpretation.
  *   **Calibrated Developmental Switches:** If a trait develops only when a specific environmental cue (reliable indicator of the ancestral problem) is present during a critical window, and fails to develop (or develops differently) when the cue is absent, this discriminates against general-purpose learning and fixed genetic inheritance.
      *   *Status:* **Conceptually available, partially present.** This is the strongest avenue, but rivals can argue the "switch" is a general learning rule rather than a specialized adaptation.
  *   **Costly Handicaps:** If a psychological trait imposes a significant survival cost or metabolic burden that would be eliminated by drift or general efficiency, yet persists with high fidelity, this suggests strong selection maintaining it.
      *   *Status:* **Conceptually available, often absent.** Measuring the metabolic cost of cognitive mechanisms is notoriously difficult.

  ### 2. Assessment of Real Candidates

  Here are the strongest empirical challenges to your thesis, ranked by the pressure they exert on the claim that no evidence discriminates adaptation from rivals.

  *   **Developmental Timing and Co-Residence (The Incest Aversion Case):**
      *   *Description:* Studies show sexual attraction is suppressed between individuals who lived in close domestic proximity during early childhood, regardless of genetic relatedness. Conversely, genetic relatives reared apart do not show this aversion.
      *   *Pressure:* **High.** This rules out simple genetic inheritance (kin recognition via genes) and simple cultural taboo (since it operates without explicit rules). It suggests a mechanism calibrated to a specific ecological regularity (co-residence implies kin).
      *   *Overclaim:* Proponents often claim this proves a dedicated "incest module." Critics rightly note it could be a general associative learning rule (familiarity breeds attenuation of sexual interest) rather than a function-specific adaptation. However, the specificity of the timing window makes the "general learning" rival less parsimonious.
  *   **Content-Specific Reasoning (Social Contract vs. Abstract Logic):**
      *   *Description:* Subjects perform significantly better on logical reasoning tasks when the content involves detecting cheating in social exchanges compared to structurally identical abstract problems or descriptive rules.
      *   *Pressure:* **Medium-High.** This challenges the "general-purpose mind" rival. It shows the mind is not content-neutral.
      *   *Overclaim:* Both sides overreach. Adaptationists claim this proves a dedicated "cheater detection module." Critics claim it proves only that people are more experienced with social content. The middle ground is that the mind has *biases* shaped by frequency, which may or may not be specific adaptations.
  *   **Cross-Species Convergence in Mating Strategies:**
      *   *Description:* Similar patterns of mate preference (e.g., male preference for youth/fertility cues, female preference for resource/status cues) appear in species with similar reproductive biologies but distinct evolutionary histories.
      *   *Pressure:* **Medium.** Suggests convergent evolution driven by similar selection pressures.
      *   *Overclaim:* That human patterns map directly onto non-human animal patterns without accounting for cultural mediation.
  *   **Behavioral-Genetic Partitioning:**
      *   *Description:* Heritability studies showing variation in traits like risk-taking or mate selectivity clusters in ways predicted by evolutionary models (e.g., higher heritability in traits closer to reproductive output).
      *   *Pressure:* **Low.** Heritability indicates genetic influence, not selection. Drift and constraint also produce heritable variation. This does not discriminate adaptation from non-adaptation.
  *   **Predictions of Previously Unobserved Phenomena:**
      *   *Description:* Hypotheses generated from adaptive models that predict specific emotional responses (e.g., specific distinct emotions for different types of norm violations) later confirmed by factor analysis.
      *   *Pressure:* **Medium.** Successful prediction is the gold standard of science.
      *   *Overclaim:* That successful prediction proves the *mechanism* is an adaptation. A rival theory could potentially accommodate the prediction post-hoc, though this weakens the rival's parsimony.

  **Ranking:** Developmental Timing > Content-Specific Reasoning > Predictive Success > Cross-Species > Genetic Partitioning.

  ### 3. Distinguishing Separable Claims

  Your thesis targets the inference to **Specific Selected Functions**. It is crucial to separate this from the other two claims often bundled in evolutionary psychology.

  *   **Claim A: The Mind is Massively Modular.**
      *   *Threat:* A result showing domain-general learning accounts for "content-specific" data damages this. However, one could maintain modularity without claiming every module is an *adaptation* (some could be developmental by-products). Your thesis does not strictly falsify modularity, only the evolutionary *explanation* for it.
  *   **Claim B: Specific Traits Have Specific Selected Functions.**
      *   *Threat:* This is the direct target of your thesis. Any evidence that successfully discriminates selection from drift/constraint damages your thesis. Conversely, if your thesis holds, this claim is scientifically unsupported.
  *   **Claim C: This Constitutes a Unified Research Program.**
      *   *Threat:* This is a sociological claim. Even if Claim B is false in many domains, the field could remain unified by its heuristic approach. However, if your thesis is true, the program lacks a method of verification, potentially dissolving it into a collection of "just-so stories."

  **Sharp Distinction:** A finding that the "cheater detection" effect is actually due to general experience damages Claim A and Claim B in that domain. It does not, however, prove your universal thesis (that *no* trait can be confirmed). Your thesis is a methodological universal negative; a single confirmed adaptation falsifies it, even if 90% of the field's specific claims are wrong.

  ### 4. Researcher Concessions and Internal Divisions

  *   **Conceded Premises:**
      *   *Ancestral Reconstruction:* Researchers concede that reconstructing the Environment of Evolutionary Adaptedness is fraught with uncertainty and often relies on circular reasoning.
      *   *Universality:* Most concede that universality is necessary but not sufficient for adaptation (could be constraint).
      *   *Adaptationism:* There is broad agreement that not every trait is an adaptation; some are by-products or noise.
  *   **Rejected Premises:**
      *   *The "No Discrimination" Claim:* Researchers reject the idea that *no* test discriminates. They argue for **Inference to the Best Explanation**. They contend that while rivals *can* be constructed, they often become so complex or ad-hoc that the adaptation hypothesis is overwhelmingly more probable. They reject the demand for logical certainty in favor of probabilistic support.
      *   *Design Features:* They reject the claim that economy and precision are compatible with any reliable mechanism. They argue that "complex functional organization" is the signature of selection, as drift and constraint rarely produce intricate, goal-directed machinery.
  *   **Internal Divisions:**
      *   *Restrictionists:* Argue that we should only posit adaptations where evidence is stringent (e.g., physiological mechanisms, clear developmental switches). **This side comes closest to granting your case**, admitting that many psychological claims are currently unverified.
      *   *Expansionists:* Argue that adaptationist hypotheses are fruitful even without definitive proof, guiding discovery. **This side refutes your case**, arguing that the utility and predictive success of the framework constitute a form of confirmation.

  ### 5. Reflexive Assessment: Unfalsifiability

  Your thesis claims: "No body of evidence... confirms."
  This is a universal negative. Logically, it is falsifiable by a single counter-example (one confirmed adaptation).

  However, you have insulated it by defining the confirmation bar as "discriminating between adaptation and *any* rival account." Since one can always posit a logically possible rival (e.g., "a by-product of a unknown trait Z"), you have set the condition for confirmation at **logical entailment** rather than **probabilistic support**.

  *   **Is this a defect?** In the context of empirical science, yes. Science rarely, if ever, achieves logical entailment. It operates on Bayesian updating—increasing the probability of a hypothesis relative to rivals. By demanding that rivals be ruled out completely rather than rendered implausible, your thesis risks becoming a philosophical skepticism rather than a methodological critique. It becomes compatible with any future result because you can always assert the rival account is "equally good" by adjusting its parameters.
  *   **Is it acceptable?** As a thesis about the *limits of inference*, it is a valid philosophical stance (underdetermination of theory by data). But if presented as a scientific claim about the discipline's capabilities, it is self-sealing. It effectively defines "confirmation" out of existence. To be scientifically engaged, the thesis must allow that if a rival account requires ten ad-hoc assumptions and the adaptation account requires one, the latter is "confirmed" for practical purposes. If you deny this, your thesis is unfalsifiable in practice, though not in principle.

  ### 6. Ranking Defeaters and the Mind-Changer

  **Ranking from Fatal to Merely Awkward:**

  1.  **Fatal:** **Genetic-Phenotypic Link with Selective Signature.** Finding a specific gene variant associated with a specific psychological mechanism that shows undeniable statistical signs of positive selection in the ancestral past. This bridges the gap between function and history directly.
  2.  **Strong:** **Calibrated Developmental Switches.** Evidence of a trait that *only* develops under specific ancestral cues (e.g., pathogen prevalence triggering specific disgust sensitivities) and is absent otherwise, where general learning models fail to predict the specific calibration.
  3.  **Moderate:** **Predictive Success of Complex Patterns.** Predicting a complex, non-obvious pattern of behavior (e.g., specific step-parent discrimination effects) that is later verified, where rival cultural accounts would have predicted the opposite or no effect.
  4.  **Awkward:** **Cross-Species Homology.** Finding similar psychological mechanisms in primates with similar social structures. This supports adaptation but doesn't rule out shared constraint.

  **The Single Mind-Changer:**
  The evidence most likely to change my mind (and thus falsify your thesis) would be a **Natural Experiment in Developmental Calibration** where a psychological mechanism is shown to be *blind* to modern cultural variation but *sensitive* to a specific ancestral variable that cannot be learned through general association.

  *Example:* If it were shown that humans acquire a specific fear response *only* if exposed to a stimulus during a precise developmental window, and this response persists even when the stimulus is known to be harmless (resistant to extinction), and this pattern is replicated across isolated cultures but absent in populations historically lacking that stimulus. This would rule out general learning (which is flexible) and cultural transmission (which varies), leaving selection for a specific prepared learning mechanism as the only viable explanation. This moves the inference from "compatible with adaptation" to "incompatible with major rivals."
