answer: |-
  The ink froze in the well before Johannes could finish the diagram. He warmed the pot over the candle flame, watching the black slurry loosen, then dipped his quill again. On the paper before him lay the heavens stripped of their mythology. There were no Lions, no Virgins, no Scales. There were only points of light moving across the curved bowl of the sky, forming angles. Here, Mars and Saturn stood in a square, ninety degrees apart. A dissonance. A tension like a tightened bowstring.

  The letter from General Wallenstein's steward lay heavy on the desk. *His Excellency requires the auspicious hour for the cavalry charge. The moon must be in the House of War. The date must be fixed before the week is out.*

  Johannes rubbed his eyes. He could write the date. He could draw the chart with the twelve wedges, label the signs, and invent a narrative about fire and blood that would satisfy the General. Men had done it for centuries. But to do so would be to lie about the architecture of God's creation. The stars did not command the soldier's hand; they sang to the soul of the Earth, and the Earth sang to the soul of the man. The square aspect promised friction, a heating of the spirits, a propensity for rashness. It did not promise victory, nor did it promise death. To specify the event was to confuse the melody with the lyrics.

  He looked out the window. Prague was a sprawl of dark roofs under a hard frost. Somewhere in a village in Württemberg, the snow was deeper. He thought of his mother, Katharina. She knew which roots could break a fever and which leaves could stop a bleed. She knew the earth had virtues, hidden sympathies between plant and flesh. They had called it witchcraft. They had put her in chains because she claimed nature spoke to her. Johannes had spent years writing petitions, pleading with dukes and theologians, arguing that her knowledge was natural, not demonic. He had saved her from the stake, but the stain remained.

  Now he sat in the Imperial court, paid to do what she had been punished for: to read the hidden correspondences of the world. But he walked a razor's edge. If he spoke too plainly of the Earth's soul sensing the light of the planets, he sounded like her. If he spoke too much of geometry, he sounded like an atheist reducing Providence to calculation.

  The summons came two days later.

  The chamber was warm, smelling of beeswax and roasted meat. General Wallenstein sat at the head of the table, his armor discarded for velvet, but his gaze remained martial. To his right sat Master Cyprian, the court's traditional astrologer, a man of flourished sleeves and confident tables. To his left sat Father Reuchlin, a theologian from the university, his face pinched with the discomfort of being in a room dedicated to divination.

  Johannes stood before the hearth, holding his chart.

  "Well?" Wallenstein asked. "When do I ride?"

  Cyprian smoothed his parchment. "The Moon enters Scorpio on Thursday. Mars rules the sign. It is a water sign, but fiery in nature. If you charge at the third hour after noon, the ascendant favors bloodshed. Victory is indicated."

  Reuchlin struck the table. "This is idolatry. You suggest the Creator binds His will to the wandering stars? That a soldier's life is forfeit because a rock of fire sits in a arbitrary wedge of the sky? God grants victory to the just, not to the calculous."

  Cyprian sneered. "And yet, Father, you pray for rain as if the clouds obey you. Nature has orders. We merely read them."

  "Nature obeys God, not geometry," Reuchlin countered.

  Wallenstein looked to Johannes. "Imperial Mathematician. You cast the nativity of the world itself. Tell me. Thursday?"

  Johannes felt the silence press against his ears. He placed his chart on the table. It looked barren compared to Cyprian's colorful wheels.

  "Thursday presents a square aspect between Mars and Saturn," Johannes said quietly. "There are no signs here, Excellency. No Houses. There is only the angle."

  "Does it favor the charge?" Wallenstein pressed.

  "It favors tension," Johannes said. "Think of music, General. If I strike a note and then another a fourth away, it is stable. A fifth is heroic. But this..." He traced the line between the planets. "This is a tritone. A dissonance. It demands resolution."

  "Will I win?"

  "The sky does not hold a ledger of battles," Johannes said. "At the moment of your birth, and at the moment of this campaign's birth, the configuration impresses a temperament. It tunes the soul. Under this aspect, your men will feel heat. They will be eager. They will be prone to anger. But whether that anger breaks the enemy line or breaks your own formation depends on the virtue of the men, not the light of the stars."

  Cyprian laughed, a sharp, brittle sound. "So you offer nothing. You offer a mood."

  "I offer the truth of the mechanism," Johannes said, feeling the heat rise in his own cheeks. "You treat the heavens as a script written by servants. You say Mars causes war because he is red. I say Mars is red because we perceive the quality of war in that light. The Earth herself senses these angles. Her soul shudders when the rays cross at ninety degrees. That shudder passes into the air, into the blood. It makes the soil ready for harvest, or the man ready for fury. But the Earth does not decide what is harvested. The man does not decide when he feels anger. But he decides what he does with it."

  Reuchlin leaned forward. "Then it is useless. If it dictates nothing, it is a toy. If it dictates something, it infringes on Free Will. You stand in the mud between two banks, Kepler, and you are wet on both sides."

  "Consider the boys of Graz," Johannes said. The room went still. He had not planned to speak of this, but the memory of his mother's silence in the courtroom urged him on. "Ten years ago, I recorded the births of two infants in the same house. The time between them was less than the blink of an eye. The configuration was identical. The same aspects, the same angles."

  Cyprian shifted. "Twins?"

  "No. Different mothers. Same moment." Johannes looked at Wallenstein. "One is now a baker. The other is a mercenary who lost an eye at Nieuwpoort. If the stars compelled events, they would share a fate. They share a temperament. Both are prone to heat. The baker channels it into the oven; the soldier into the sword. The aspect provided the fire. The soul provided the form."

  Wallenstein stared at the chart. The lines looked like a cage, or perhaps a web. "So if I ride on Thursday, the men will be fierce."

  "They will be fierce," Johannes confirmed.

  "And if I ride on Friday?"

  "The aspect dissolves. The tension releases. They will be slower. Calmer."

  "Calmer men die," Wallenstein said. He stood up, towering over the table. "Cyprian says I win. Reuchlin says God decides. You say I will feel angry."

  "I say the harmony of the world is real," Johannes said, his voice steady despite the trembling in his hands. "To ignore it is to fight blind. To obey it as a command is to fight as a puppet. I offer you the sight to know your own nature in that moment."

  Wallenstein walked to the window. The courtyard below was grey with snow. "I have paid for certainty, Kepler. You give me philosophy."

  "I give you the only certainty there is," Johannes said. "The geometry is true. The rest is human."

  The General turned back. He looked at Cyprian, then at Reuchlin, and finally at Johannes. He saw the credulity of the first, the dogma of the second, and the strange, hollow precision of the third.

  "Ride on Thursday," Wallenstein said. "We will use the heat."

  Cyprian smiled, vindicated. Reuchlin sighed, crossing himself. Johannes rolled up his chart. He had kept his position. He had not lied. But he knew what would happen. If the charge succeeded, Cyprian would claim the stars compelled it. If it failed, Reuchlin would claim God had judged them. If the men fought with furious desperation and died in the mud, Johannes would know the aspect had been true, and that truth would comfort no one.

  He left the palace into the biting wind. The sky was clearing, the clouds shredding away to reveal the cold, bright points of the planets. They hung in their orbits, silent and immense. They did not care for the General's campaign. They did not care for the baker or the soldier. They simply were, forming ratios too vast for the ear to hear.

  Johannes thought of his mother, walking home through the woods with her basket of roots. She had believed the plants spoke to her. He believed the light spoke to the Earth. Both were accused of hearing voices in the silence. He pulled his cloak tighter. The geometry was perfect. The harmony was absolute. And yet, walking alone on the ice, he felt the dissonance of the square aspect vibrating in his own bones, a reminder that to know the tune is not to know the song. He looked up at Mars, red and steady, and wondered if the planet felt the angle too, or if it was only the Earth, shuddering in the dark, waiting for a soul to give the vibration meaning.
