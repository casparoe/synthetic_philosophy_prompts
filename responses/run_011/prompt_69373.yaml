prompt: |-
  You are a philosopher equally at home in classical Indian epistemology and contemporary analytic epistemology, chairing an adversarial collaboration between two parties who have argued past each other for years. Party A is a Naiyāyika: there are exactly four irreducible pramāṇas — perception, inference, comparison (upamāna), and testimony (śabda). Party B is a Buddhist pramāṇavādin in the line of Dignāga and Dharmakīrti: there are exactly two, perception and inference, and the others must be shown to reduce.

  Think carefully first about where the two schools genuinely converge, and only then draft the joint statement both could put their names to:

  1. A numbered list of substantive agreed claims — for instance that knowledge is individuated by its source rather than by its truth alone; that a pramāṇa must produce a cognition that is both novel and non-deviating; that memory and doubt are not independent sources; that unhesitating successful action is a mark of knowing; and that the demand for a non-question-begging certification of the pramāṇas themselves cannot simply be waved away.
  2. A disagreements table, each row worded so that its own side would accept it as fair: whether testimony is sui generis or an inference about the speaker; whether upamāna reduces to inference, to testimony, or to memory-plus-recognition; whether pervasion can be grounded without appeal to causal efficacy; whether inference may reach what does nothing causally — universals, a self, a creator; whether perception is ever conceptually structured.
  3. The cruxes — the sub-questions whose settlement would move at least one party — and for each, a concrete case or argument both accept as bearing on it (the wild-ox case is available to you), with each side's prediction recorded in advance.

  Close by identifying which portions of the dispute you judge to be merely verbal, and what would have to be true for that judgment to hold.
reasoning: |-
  Here's a thinking process that leads to the suggested output:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher expert in both Classical Indian Epistemology (Nyāya vs. Buddhist Pramāṇavāda) and Contemporary Analytic Epistemology.
      *   **Task:** Chair an adversarial collaboration between Party A (Naiyāyika, 4 *pramāṇas*) and Party B (Buddhist Pramāṇavādin, 2 *pramāṇas*).
      *   **Output:**
          1.  Numbered list of substantive agreed claims.
          2.  Disagreements table (fairly worded for both sides).
          3.  The Cruxes (sub-questions, concrete cases/arguments, predictions).
          4.  Closing analysis on merely verbal disputes.
      *   **Tone:** Rigorous, philosophical, conciliatory but precise, bridging ancient and modern sensibilities.

  2.  **Deconstruct the Parties:**
      *   **Party A (Nyāya):** Realists. Accept 4 *pramāṇas* (Perception, Inference, Comparison, Testimony). Believe in enduring substances, universals, and a self (*ātman*). Knowledge (*pramā*) is a valid cognition (*yathārtha anubhava*). External world exists independently. Testimony is distinct because it relies on the speaker's reliability, not just inference from signs.
      3.  **Party B (Buddhist - Dignāga/Dharmakīrti):** Momentarists/Nominalists. Accept 2 *pramāṇas* (Perception, Inference). *Svalakṣaṇa* (particulars) are real; *sāmānyalakṣaṇa* (universals) are conceptual constructions. *Pramāṇa* must lead to successful action (*arthakriyā*). Testimony is a form of inference (inferring the speaker's intent/truthfulness). Comparison is reducible. Perception is non-conceptual (*nirvikalpaka*).

  3.  **Drafting Section 1: Agreed Claims (Convergence):**
      *   *Goal:* Find common ground that isn't trivial but reflects deep epistemological commitments shared by both, distinguishing them from, say, Skeptics or Materialists (Cārvāka).
      *   *Idea 1: Source Individuation.* Both agree knowledge isn't just "true belief"; it matters *how* you got it. (Matches analytic "reliabilism" or "proper functionalism" hints).
      *   *Idea 2: Novelty & Non-deviation.* *Anadhigata* (novel) and *Avyabhicāri* (non-erroneous). Both accept this definition of *pramā*.
      *   *Idea 3: Exclusion of Memory/Doubt.* Memory (*smṛti*) is reproduction, not new discovery. Doubt (*saṃśaya*) is indeterminate. Neither are *pramāṇas*.
      *   *Idea 4: Pragmatic Success.* *Pravṛtti-sāmarthya* (capacity for successful action). Even Nyāya accepts that knowing leads to successful engagement, even if they don't define truth *as* success like the Buddhists.
      *   *Idea 5: Certification.* The *pramāṇavyavasthā* problem. You can't just assert *pramāṇas* work; you need an account of why they are reliable (intrinsic vs. extrinsic validity is a fight, but the *need* for an account is shared).

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Goal:* Fair wording. Avoid loading the dice.
      *   *Issue 1: Testimony.* Nyāya: Distinct source (reliance on speaker's competence/honesty). Buddhist: Inference from words to meaning/truth.
      *   *Issue 2: Comparison (Upamāna).* Nyāya: Distinct (knowing relation between name and object via similarity). Buddhist: Reduces to Inference or Testimony + Memory.
      *   *Issue 3: Pervasion (Vyāpti).* Nyāya: Based on objective universals/nature (*svabhāva*). Buddhist: Based on causal identity (*tādātmya*) or causal production (*tadutpatti*).
      *   *Issue 4: Objects of Inference.* Nyāya: Can know universals, self, God. Buddhist: Inference deals with concepts/universals which are ultimately unreal (*kalpanā*); only particulars are real.
      *   *Issue 5: Conceptual Perception.* Nyāya: *Savikalpaka* perception is still perception (real universals). Buddhist: Conceptualization is inference-like, not perception (perception is strictly non-conceptual).

  5.  **Drafting Section 3: The Cruxes:**
      *   *Goal:* Identify pivot points. What would change minds?
      *   *Crux 1: The Status of Universals.* If universals are real, Nyāya wins on *śabda* and *upamāna*. If nominalism holds, Buddhist reduction holds.
          *   *Case:* The "Wild Ox" (*gavaya*). Seeing a wild ox and recalling "cow-like" to learn the word.
          *   *Prediction:* Nyāya says this reveals a real similarity relation. Buddhist says it's association of concepts.
      *   *Crux 2: The Nature of Linguistic Understanding.* Is hearing a sentence a direct grasp of meaning (Nyāya) or an inference of speaker intent (Buddhist)?
          *   *Case:* A trustworthy expert stating an unobservable fact (e.g., "There is fire on the mountain" vs. "Dharma leads to liberation").
          *   *Prediction:* Nyāya says direct knowledge. Buddhist says inference based on speaker reliability.
      *   *Crux 3: Causal Efficacy as the Mark of the Real.*
          *   *Case:* Abstract entities (numbers, universals).
          *   *Prediction:* Buddhist says if it doesn't cause action, it's not a *prameya* (object of valid knowledge) in the ultimate sense. Nyāya says causal efficacy isn't the only mark of reality.

  6.  **Drafting Section 4: Merely Verbal Disputes:**
      *   *Analysis:* Where are they talking past each other?
      *   *Definition of "Perception":* Nyāya includes conceptual identification; Buddhist excludes it. This might be terminological.
      *   *Definition of "Inference":* Buddhist defines inference broadly (any conceptual cognition); Nyāya defines it narrowly (reasoning from a mark).
      *   *Condition for Verbal Status:* If they agree on the cognitive mechanism but disagree on the label (*pramāṇa* vs. *pramāṇa-phala* or *pramāṇa* vs. *pramiti*), it's verbal.

  7.  **Review and Refine:**
      *   *Tone Check:* Is it too dry? Needs to sound like a chairperson summarizing a high-level dialogue.
      *   *Accuracy Check:* Ensure Dignāga/Dharmakīrti positions are accurate (e.g., *arthakriyā*, *apoha*). Ensure Nyāya positions are accurate (e.g., *svataḥ prāmāṇya* vs *parataḥ* nuances, though maybe keep it simple for the agreement).
      *   *Analytic Bridge:* Use terms like "individuation," "reduction," "normativity" to show the contemporary analytic lens.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure not to conflate later Nyāya (Navya-Nyāya) with early Nyāya too much, but the 4 *pramāṇas* is standard Gautama/Vātsyāyana.
      *   *Correction:* Ensure the Buddhist view on inference isn't just "logic" but "conceptual construction."
      *   *Refinement:* In the "Cruxes," make sure the predictions are specific to the epistemic status, not just ontological.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  **Joint Statement of the Adversarial Collaboration on Pramāṇa Theory**
  **Chair:** [Philosopher Name]
  **Parties:** Party A (Nyāya Realism) | Party B (Buddhist Pramāṇavāda)
  **Date:** 2023-10-27

  ### Preamble

  We, the undersigned, acknowledge that while our ontological commitments diverge radically, our epistemological structures share a common architecture designed to solve the problem of normative cognitive success. We recognize that our debate is not merely about counting sources of knowledge, but about the metaphysics of content and the criteria for reality. The following document codifies our current standing, isolating genuine agreement from structural disagreement, and identifying the empirical and conceptual cruxes that remain.

  ---

  ### 1. Substantive Agreed Claims

  We jointly affirm the following propositions as the shared foundation of our epistemological systems, distinguishing us from Skeptics (Ajñānavāda), Materialists (Cārvāka), and coherentists who deny the need for causal grounding.

  1.  **Source Individuation:** Knowledge (*pramā*) is individuated by the causal process that produces it (*karaṇa*), not merely by the truth of the content or its justification. A true belief generated by luck or memory does not constitute *pramā*.
  2.  **The Definition of Valid Cognition:** A *pramāṇa* is an instrument that yields a cognition that is (a) *anadhigata* (novel/non-recollective) and (b) *avyabhicāri* (non-deviating/accurate).
  3.  **Exclusion of Memory and Doubt:** Memory (*smṛti*) is not an independent *pramāṇa* because it reproduces past content rather than revealing new objects. Doubt (*saṃśaya*) is not a *pramāṇa* because it lacks determinacy (*niścaya*).
  4.  **Pragmatic Normativity:** A valid cognition must, in principle, enable successful goal-oriented action (*pravṛtti-sāmarthya*). While we differ on whether this success *constitutes* truth or merely *accompanies* it, we agree that a cognition leading consistently to failure cannot be valid.
  5.  **The Certification Problem:** The reliability of the *pramāṇas* themselves requires an account. We reject dogmatic assertion. Whether validity is intrinsic (*svataḥ*) or extrinsic (*parataḥ*), the system must explain why these instruments are trustworthy without circularity.
  6.  **Rejection of Infinite Regress:** The chain of justification cannot proceed *ad infinitum*. There must be foundational cognitions (perceptual or otherwise) that stop the regress, though we disagree on which cognitions qualify.
  7.  **Intentionality:** Cognition is always *of* something (*viṣayatā*). There is no objectless awareness in the context of *pramā*.

  ---

  ### 2. Table of Disagreements

  The following table outlines our structural divergences. Each statement is phrased to be acceptable to the proponent of that view as a fair characterization of their position.

  | Domain | Party A (Nyāya) Position | Party B (Buddhist Pramāṇavādin) Position |
  | :--- | :--- | :--- |
  | **1. Testimony (*Śabda*)** | Testimony is a *sui generis* *pramāṇa*. Understanding a reliable speaker's statement yields immediate knowledge of the meaning, grounded in the speaker's competence and honesty, not inferred from signs. | Testimony reduces to Inference (*anumāna*). Understanding speech is inferring the speaker's intent and the truth of the proposition based on the reliability of the source as a sign (*liṅga*). |
  | **2. Comparison (*Upamāna*)** | Comparison is irreducible. It generates knowledge of the relation between a name and an object via similarity (e.g., learning "gavaya" by seeing its similarity to a cow), which inference cannot capture. | Comparison reduces to a combination of Testimony (being told the similarity), Memory (recalling the cow), and Perception/Inference (recognizing the similarity). No separate instrument is needed. |
  | **3. Grounding of Pervasion (*Vyāpti*)** | Pervasion (the invariable connection between reason and predicate) is grounded in objective universals (*sāmānya*) and essential natures (*svabhāva*) existing in the external world. | Pervasion is grounded exclusively in Causal Efficacy (*arthakriyā*), specifically Identity (*tādātmya*) or Causation (*tadutpatti*). Without causal power, there is no real connection. |
  | **4. Objects of Inference** | Inference can validly cognize enduring substances, universals, the Self (*ātman*), and a Creator God, as these are real entities. | Inference deals only with conceptual constructions (*kalpanā*). It cannot reach ultimate reality (*svalakṣaṇa*). Universals and a permanent Self are fictions; inference is useful but ultimately deceptive regarding ontology. |
  | **5. Conceptual Perception** | *Savikalpaka* perception (conceptualized perception, e.g., "This is a pot") is a valid perceptual cognition because universals are real and perceived alongside particulars. | Perception (*pratyakṣa*) is strictly non-conceptual (*nirvikalpaka*). The moment concepts are applied, the cognition becomes inference-like (*anumāna-vikalpa*) and loses contact with the particular. |

  ---

  ### 3. The Cruxes: Sub-Questions and Predictive Cases

  These are the specific points where settlement would force a major revision in one party's system. We have selected concrete cases to test these cruxes.

  #### Crux 1: The Ontology of Similarity (The *Upamāna* Crux)
  *   **Sub-question:** Is similarity (*sādṛśya*) a real relation in the world, or a mental superimposition based on exclusion (*apoha*)?
  *   **Concrete Case:** **The Wild Ox (*Gavaya*).** A forest-dweller sees a wild ox. Having previously been told by a forester, "A *gavaya* is like a cow," they recognize the animal as a *gavaya*.
  *   **Party A Prediction:** This cognition is not inference (no middle term), not testimony (the forester is absent), and not memory (the *gavaya* is new). It is a distinct perception of a real similarity relation.
  *   **Party B Prediction:** This is a complex inference/memory sequence. The forester's statement created a mental image (concept). Seeing the animal triggers a match with that image. This is inference based on the sign of "similarity to cow," which is ultimately a negation of non-cow-like things.
  *   **Stakes:** If similarity is real, Nyāya wins *upamāna*. If similarity is conceptual exclusion, Buddhist reduction holds.

  #### Crux 2: The Mechanism of Linguistic Understanding (The *Śabda* Crux)
  *   **Sub-question:** Does understanding a sentence require an inferential step regarding the speaker's reliability, or is it a direct grasp of meaning?
  *   **Concrete Case:** **The Trusted Expert.** A known truthful astronomer says, "There is a mountain of gold on the far side of the moon." The listener accepts this immediately without checking evidence.
  *   **Party A Prediction:** The knowledge arises directly from the syntactic-semantic connection (*śakti*) of the words, certified by the prior knowledge of the speaker's reliability. The reliability is a condition (*upādhi*), not the instrument itself.
  *   **Party B Prediction:** The cognition is an inference: "The speaker says X; the speaker is reliable; therefore X is true." If the reliability is doubted, the knowledge vanishes, proving reliability is the logical reason (*hetu*).
  *   **Stakes:** If testimony is inference, the Buddhist claim of two *pramāṇas* stands. If distinct, Nyāya's four stand.

  #### Crux 3: The Mark of the Real (The *Arthakriyā* Crux)
  *   **Sub-question:** Is causal efficacy (*arthakriyā*) the necessary and sufficient condition for ontological reality?
  *   **Concrete Case:** **Universals and Numbers.** We use "cowness" and the number "2" successfully in reasoning and action.
  *   **Party A Prediction:** These entities guide successful action (identifying cows, counting goods). Therefore, they are real, even if they do not produce physical effects like a seed producing a sprout. Causal efficacy is broader than physical production.
  *   **Party B Prediction:** Only particulars (*svalakṣaṇa*) cause effects. "Cowness" does nothing; the particular cow does. Using the concept leads to successful action only because the concept *excludes* non-cows, allowing us to navigate particulars. The universal itself is causally inert and therefore unreal.
  *   **Stakes:** If reality requires strict causal power, Buddhist nominalism wins. If reality includes structural/relational entities, Nyāya realism wins.

  ---

  ### 4. Closing Analysis: The Merely Verbal Dispute

  As Chair, I judge that a significant portion of our dispute regarding **Perception (*Pratyakṣa*)** is merely verbal, contingent on a specific definition holding true.

  **The Verbal Core:**
  Party A defines perception as "cognition generated by the contact of sense and object." Party B defines perception as "cognition free from conceptual construction (*kalpanāpoḍha*)."
  *   When Party A says, "I perceive this is a pot," they are describing a causal chain ending in identification.
  *   When Party B says, "You do not perceive the pot, you infer it," they are describing the *phenomenological content* as conceptual.

  **Condition for Verbal Status:**
  This dispute is merely verbal **if and only if** both parties agree on the underlying cognitive mechanics but disagree on the label *pramāṇa*.
  1.  If Party A admits that the *conceptual* component is a superimposition upon a raw sensory given, and...
  2.  If Party B admits that the raw sensory given is causally linked to the object and non-erroneous...
  3.  Then the disagreement is solely whether the *mixture* of raw sense + concept retains the name "Perception" (Nyāya) or forfeits it to "Inference/Construction" (Buddhist).

  **Resolution Path:**
  We should adopt a neutral terminology for the collaborative record:
  *   **Type-I Cognition:** Non-conceptual, causal contact with particulars (Accepted by both as foundational).
  *   **Type-II Cognition:** Conceptualized identification of objects (Nyāya calls this Perception; Buddhist calls this Inference-like).

  If we can agree that Type-I is the ultimate foundation of empirical knowledge, the count of *pramāṇas* becomes a taxonomic preference rather than a metaphysical clash. However, the disputes regarding **Testimony** and **Universals** remain substantive, as they hinge on the existence of relations and entities that Party B denies ontologically, not just taxonomically.

  **Signed,**

  *Party A Representative (Nyāya)*
  *Party B Representative (Buddhist Pramāṇavāda)*
  *Chair (Analytic/Comparative Philosophy)*
