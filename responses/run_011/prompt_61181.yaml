      *   **Plot:** Follow one lobbyist through a day where a fresh chamber arrives pre-loaded against her client for reasons she can't see.
      *   **Twist/Reveal:** The reader should piece together before the protagonist does that her own firm's archive has been quietly tuning the sampling weights for a decade. The composition of the house is now a product she helps design.
      *   **Style:** Civics in the furniture (show, don't tell), no grand monologues about democracy.
      *   **Length:** Approximately 1,500 words.
      *   **Language:** British English.

  2.  **Character & Setting:**
