prompt: |-
  Could you write me a short story for me — say 1,500 words — set about twenty years after my city scrapped elections for sortition: 400 residents drawn by lot every spring for a single twelve-month term, no re-selection ever. What I want it to actually be about is the lobbyists. With nobody you can cultivate over years, the trade has collapsed into cold-start persuasion, and the firms are the only ones keeping records of whats happened — so institutional memory ends up sitting with the unelected. Follow one lobbyist through the day a fresh chamber arrives pre-loaded against her client for reasons she can't see, and let the reader piece it together before she does that her own firm's archive has been quietly tuning the strata weights in the sampling frame for a decade, i.e. that the composition of the house is now a product she helps design. Keep the civics in the furniture rather than in speeches, no grand monologues about democracy, and write it in British English please.
reasoning: |-
