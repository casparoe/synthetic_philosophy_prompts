      *   *Scene 5:* Closing thought. The rain continues.

  7.  **Refining the Twist:**
      *   It needs to be subtle. She shouldn't find a file named "HOW WE RIGGED IT." She should find a parameter file named "Demographic Stability Adjustment" or similar corporate speak.
      *   She needs to realize that the "randomness" was smoothed out years ago to prevent volatility, but this smoothing has created a echo chamber that hates her client.
