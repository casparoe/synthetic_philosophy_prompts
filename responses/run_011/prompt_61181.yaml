  5.  **Writing - Focus on Tone and Language:**
      *   British English: *Labour* not *Labor*, *Centre* not *Center*, *Programme* not *Program*, *Lift* not *Elevator*, *Flat* not *Apartment*.
      *   Show, Don't Tell: Instead of explaining sortition, show the lottery balls, the ID badges with expiry dates, the lack of campaign posters.
      *   Word Count: Aim for ~1,500.

  6.  **Drafting - Step-by-Step (Mental or Scratchpad):**
      *   *Scene 1:* Office view. Looking at the Chamber. The new badges.
