answer: |-
  The rain against the office window blurred the outline of the Chamber across the river. It was a brutalist slab of concrete, twenty years old now, built to replace the hollowed-out Westminster model after the Great Disillusionment. No parties. No manifestos. Just four hundred names drawn from the electoral roll every spring, like bingo balls in a tumbler, serving a single twelve-month term. Never eligible again.

  Eleanor took a sip of lukewarm tea and turned from the view. On her desk lay the briefing pack for the new intake. Veridian Consultancy handled infrastructure, specifically Aethelgard Utilities. For two decades, Veridian had been the constant in a city of transient legislators. MPs came and went, confused and eager; Veridian remained, the keeper of the continuity they lacked.

  "Demographics look odd, don't they?" said Julian, her junior associate. He was tapping a tablet, frowning.

  "Odd how?" Eleanor asked, not looking up from the spreadsheet.

  "Skewed. Look at the postcode distribution. Sector 4 is overrepresented by twelve per cent. And the occupational stratification… too many gig-economy workers, not enough civil servants. Usually, the Lot smooths out to a bell curve. This looks… engineered."

  "The Ballot Commission claims the algorithm is pure random," Eleanor said, reciting the line she'd used for a decade. "Pure noise."

  "Pure noise doesn't produce a standard deviation this tight," Julian muttered. "If Aethelgard tries to push the sewerage levy through this lot, they'll be laughed out of the room. These people hate utility hikes. They're all renters, all precarious. They feel every penny."

  Eleanor felt a prickle at the base of her neck. He was right. The new Chamber, the Twenty-First Lot, was pre-loaded with hostility. In the old days, you'd spend years cultivating a Minister, wine and dining them, learning their triggers. Now, you had three months to establish credibility before the recess, and the clock started ticking the moment the names were published. But you couldn't persuade people if the ground beneath them was already shifting.

  "Pull the historical comparison," Eleanor said. "Ten years. I want to see the variance in the sampling frame."

  Julian tapped his screen. "I can't access the Commission's raw data. Privacy walls."

  "Use the Veridian Archive," she said.

  That was the firm's selling point. While the Chamber forgot everything every summer—papers shredded, hard drives wiped, institutional memory reset to zero—Veridian remembered. They had the logs. They had the votes. They had the profiles. In a city of amnesiacs, the lobbyists were the only ones with long-term memory. It was why they were paid the big money. It was why they were necessary.

  Julian hesitated. "The Archive is restricted. Level 5 clearance."

  "I have Level 5," Eleanor said. "Run it."

  She walked to the window again. The rain was heavier now, drumming against the glass. Below, on the street, a delivery cyclist struggled with the wind. In the Chamber across the water, four hundred citizens were currently being sworn in. They would be given tablets, security passes, and a mandate to govern a city they barely knew. And Veridian would be waiting in the foyer with laminated fact-sheets.

  But why this group? Why now? Aethelgard wasn't the only client. Veridian represented housing associations, transport unions, tech conglomerates. If the Lot was truly random, hostility should be distributed evenly across sectors. Instead, this intake felt specific. Targeted.

  "El," Julian called out. His voice was tight. "I'm in."

  Eleanor turned. Julian's face was pale, illuminated by the glow of the monitor. "The data isn't coming from the Commission," he said. "The API feed… it's local. It's originating from our server."

  "That's impossible. We're a private consultancy. We don't host civic data."

  "We host the *weights*," Julian said, scrolling rapidly. "Look. File name: `Strata_Calibration_v9`. Last modified: three weeks ago. Author: Admin."

  Eleanor walked over, leaning down to see the screen. The code was dense, a cascade of variables designed to adjust the probability of selection for certain demographic clusters. It was standard statistical practice to weight samples to ensure representation—to make sure the poor weren't drowned out by the rich, or vice versa. But these weights weren't correcting for bias. They were creating it.

  "Look at the variable `Eco_Sensitivity`," Julian whispered. "It's been bumped up. And `Property_Ownership` is depressed. They've filtered out anyone with a mortgage over fifty per cent LTV."

  Eleanor stared at the numbers. The logic was cold, clinical. It wasn't about representation. It was about predictability. Over the last decade, the Chamber had become volatile. Strange votes. Populist surges. The markets hated uncertainty. Veridian's clients hated uncertainty.

  "We didn't just record the history," Eleanor said, the realisation settling in her stomach like lead. "We wrote it."

  "The firm," Julian said. "The partners. They've been tuning the sampling frame. The 'random' draw… it's a product. We sell stability to the clients by designing the legislature."

  Eleanor straightened up. The room felt suddenly airless. For twenty years, she had prided herself on navigating the chaos of the Sortition System. She had believed she was a bridge between the people and the policy. But the people weren't random. They were curated. The chaos was managed. The democracy was a simulation run on Veridian servers.

  And today, the simulation had glitched.

  "Why this cohort?" she asked, her voice quiet. "If we design them, why design them to hate Aethelgard?"

  Julian scrolled further down the log. "It's not about hating Aethelgard. It's about the housing vote. The partners have shifted priority. The housing associations are paying higher retainers this quarter. To pass the Rent Stability Bill, you need a Chamber full of renters. To get renters, you have to filter out the landlords. Aethelgard's levy looks like a rent hike to this demographic. They're collateral damage."

  Eleanor looked back at the briefing pack on her desk. The Aethelgard logo, a stylised blue drop, stared up at her. She had promised them access. She had promised them a fair hearing. She had sold them the idea that while the politicians changed, the process remained sacred.

  But the process was just another line item in the budget.

  "The Commission," Eleanor said. "Do they know?"

  "The Commission is outsourced," Julian said. "We won the tender ten years ago. We maintain the lottery machines. We write the code."

  Eleanor walked back to her desk and sat down. The rain continued to batter the window. Across the river, the new Deputies would be breaking for lunch. They would feel empowered. They would believe they were the voice of the people, chosen by fate. They wouldn't know that their fate had been decided in a boardroom in Canary Wharf by men in suits who never stood for anything because they never had to.

  She opened her email client. She had to write to Aethelgard. She had to tell them the landscape had changed, that the odds were against them, that they needed to adjust their strategy. She had to lie. Because if she told the truth, Veridian would collapse. If the public knew the Lot was weighted, the city would burn. The legitimacy of the entire post-election order rested on the myth of the draw.

  Her fingers hovered over the keyboard.

  She was a lobbyist. Her job was persuasion. But who was she persuading now? The client? The Chamber? Or herself?

  She looked at the file `Strata_Calibration_v9`. It was elegant, in a terrible way. It solved the problem of volatility. It ensured the city remained governable. It kept the lights on. But it meant that when a citizen marked their ballot form twenty years ago, demanding sortition, demanding chance, they hadn't gotten chance. They had gotten an algorithm tuned for corporate retention.

  "El?" Julian asked. "What do we tell them?"

  Eleanor closed the file. She minimized the window. She opened a new document and began to type the briefing notes. She would advise Aethelgard to pivot. To frame the levy as a environmental protection measure, something this specific demographic might bite on. She would work the angles. She would do her job.

  Because the show had to go on. The Chamber had to sit. The bills had to pass. And someone had to remember how the trick was done, so that no one else ever found out.

  "Tell them the weather's changed," Eleanor said, not looking up. "And we need to sell them umbrellas."

  She hit send. Across the river, the lights in the Chamber flickered on as the afternoon session began. Four hundred people, chosen by chance, ready to decide the future. And Eleanor, sitting in the quiet of her office, knowing exactly who had chosen them.
