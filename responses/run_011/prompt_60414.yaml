  2.  **Deconstruct the Technical Concepts:**
      *   **IRL (Inverse Reinforcement Learning):** Inferring reward function $R$ from observed behavior $\pi$. Assumption: Agent acts optimally (or Boltzmann-rational) w.r.t $R$.
      *   **The Problem:** Many $R$ can produce the same $\pi$. (Inverse problem is ill-posed).
      *   **Strategic Demonstrator:** The human knows they are being watched and modifies $\pi$ to manipulate the inferred $R$. This breaks the standard IRL assumption (that the demonstrator is just trying to maximize their own reward, not manipulate the observer).
      *   **Preference Falsification:** Hiding true preferences due to social pressure.
