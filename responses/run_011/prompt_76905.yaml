answer: |-
  ### Story Beats

  1.  Elias stands by his dead car on the A838; the deadline looms like a guillotine.
  2.  He watches Miller get passed by three recovery lorries because his covenant scan reads 'Unreliable'.
  3.  Elias accesses the roadside terminal and chooses to lock his neural profile to 'Compliant', sacrificing future flexibility for current survival.
  4.  The recovery driver stops, scans the new 'Compliant' tag, and lets him in without a word.
  5.  In the cab, the driver explains the fee structure; it's ruinous, but Elias nods, bound by the lock.
  6.  Arrival at the depot; the invoice is presented alongside a loophole clause regarding 'Services Rendered Under Duress'.
  7.  Elias stands at the payment kiosk, the loophole highlighted on the screen, his head throbbing from the neural lock.
  8.  He hovers over the 'Dispute' button, feeling the edit resist, while the driver watches from the shadows.

  ***

  ### The Covenant of the Empty Road

  The wind on the A838 didn't blow; it scoured. It stripped the heat from the bone and the paint from the metal. Elias stood by the bonnet of his saloon, watching the steam rise from the engine block like a dying breath. Four hundred kilometres to Inverness. Four hundred kilometres of nothing but heather, peat, and the grey spine of the road stretching into a horizon that looked like it had been drawn with a blunt pencil.

  His mobile had no signal. It hadn't for an hour. The site deadline was Thursday morning, 08:00. If he wasn't there to initialise the grid, the contract would void. If the contract voided, his clearance lapsed. If his clearance lapsed, he was back to driving for courier firms in the M25 sludge. He checked his watch. Sunday evening. He had three days. He had zero mobility.

  He walked down the verge to the emergency terminal bolted to a concrete post. It was an ugly thing, scratched and graffitied, but the screen flickered green when he touched it. It connected to the Recovery Network.

  Two other vehicles were logged in the sector. One was moving away. The other was stationary, five clicks north. Elias watched the road. A heavy recovery lorry rumbled out of the mist, its amber beacon cutting a slow arc through the gloom. It slowed as it approached Elias, then sped up. It didn't even break stride.

  Elias frowned and tapped the terminal. He pulled up the log for the stationary vehicle north of him. Name: Miller. Status: *Unreliable*. Covenant Score: 42.

  Another lorry passed. Then a third. They all slowed for Miller. None stopped.

  Elias understood. The drivers were self-employed, paid on outcome. They burned fuel and time to pick you up. They needed to know you'd pay the invoice once you were warm and safe. Once you were in the depot, you had the leverage. You had the warmth. The driver had nothing but a bill. A rational agent, safe in the depot, would dispute the bill. A rational driver knows this. Therefore, a rational driver doesn't pick up a rational agent.

  You had to be irrational. You had to be the sort of person who pays even when it hurts.

  The terminal offered a menu. *Request Pickup*. The status field blinked red. *Warning: Low Covenant Confidence. Pickup Probability < 5%.*

  Below that was another option. *Initiate Neural Handshake (Clinic Protocol).*

  It was a commitment device. If he selected it, the system would upload a patch to his neural implant. It wouldn't lobotomise him, but it would tighten the feedback loops around dishonesty and covenant-breaking. It would make reneging on a debt physically painful, psychologically difficult. It would make him unable to be the rational defector. It was the clinic in a box, the first stage of the edit they did in town. Once you locked it, you couldn't unlock it without a week of therapy and a hefty fee.

  It meant surviving the night. It meant ruining his margin for the quarter.

  Elias looked at the car. The cold was seeping through his boots. He looked north, towards where Miller was still standing in the wind, principled and freezing. Miller was keeping his mind free. Miller was keeping his options open. Miller was going to die out here, or at least lose the contract.

  Elias's finger hovered over the screen. To be saved, he had to agree to be bound. To be rational overall, he had to accept being irrational locally.

  He pressed *Initiate*.

  A sharp sting at the base of his skull, like a icepick dipped in nettle tea. The screen flashed green. *Status: Compliant. Pickup Probability: 98%.*

  He waited. Ten minutes. The lights appeared again. The lorry pulled over, air brakes hissing like a disappointed dragon. The driver didn't get out. He just leaned across the cab and hit the button to open the passenger door.

  "Get in," the driver said. He was a big man, wrapped in synthetic wool, eyes flicking to a handheld scanner. The scanner beeped a soft, affirmative tone. *Compliant.*

  "Thanks," Elias said. He climbed in. The heat was physical, a wall of it.

  "Depot only," the driver said, putting the lorry in gear. "You settle the invoice at the kiosk. Don't try the app. App doesn't talk to the lock."

  "I know how it works," Elias said.

  "Do you?" The driver glanced at him. "Lot of engineers think they can code a way out. They cry a lot when the headache kicks in."

  "I'm not coding anything."

  "Good. Because I'd rather not drag you out of the cab halfway there. Fuel's expensive."

  The drive was silent. Elias watched the road unwind. He felt the patch settling in his mind. It wasn't a voice telling him *pay up*. It was a dampening. When he thought about the cost of the recovery—three thousand credits, nearly half his profit margin—his chest tightened. The thought of not paying felt like holding his breath underwater. It wasn't moral guilt; it was physiological resistance. He had edited himself to be honest the way a diabetic edits themselves to take insulin. It was a function of survival.

  They arrived at the depot just past midnight. It was a sprawling yard of concrete and corrugated iron, lit by sodium lamps that turned everything the colour of old bruises. The driver killed the engine.

  "Kiosk is inside," the driver said, pointing to a glass booth near the gate. "I'll wait."

  Elias got out. His legs were stiff. He walked into the office. It was empty, save for a cleaning bot buffing the floor. The payment kiosk stood in the corner, screen awake.

  He tapped his ID. The invoice populated. *Recovery Service: Remote Sector 4. Hazard Pay. Night Rate. Total: 3,200 Credits.*

  Below the total, a line of text blinked softly. *Clause 14.2: Services Rendered Under Duress.*

  Elias leaned in. He read the clause. It was standard consumer protection law, buried in the terms most people skipped. If a service was required due to immediate threat to life or limb, and the provider knew the client was under duress, the contract could be reviewed for equitable adjustment. He was stranded. He was freezing. The driver knew it. The driver had named the price because he knew Elias had no choice.

  It was a clean loophole. If he filed a dispute under 14.2, the invoice would be frozen pending arbitration. The arbitration would take three weeks. By then, he'd be on site, the job done, the money earned. He could settle for half, or less.

  He looked at the *Dispute* button. It was grey, inviting.

  If he pressed it, he would save his margin. He would be acting in his own best financial interest. He would be rational.

  But the patch hummed at the base of his skull. The tightness in his chest grew. It felt like a band of steel around his ribs. The screen seemed to vibrate. To press that button was to lie. Not to the company, but to the version of himself he had created to get into this room.

  He looked through the glass wall. The driver was standing by the lorry, smoking. He wasn't looking at Elias. He was looking at his phone. But he was waiting. The driver knew the system. The driver knew that if Elias walked out without paying, the driver lost the fee. The driver had picked him up *because* the scan said he wouldn't walk out.

  If Elias disputed it, he proved the scan wrong. He proved he was the kind of person who shouldn't have been picked up. But he had been picked up. He was safe.

  The rational move was to dispute. The rational move was to break the promise now that the promise had done its job. The promise was a ladder; you didn't carry the ladder once you climbed over the wall.

  Elias's hand hovered over the screen. The headache started, a dull throb behind his eyes. The neural lock didn't stop him from pressing the button. It just made the cost of pressing it feel like breaking a bone. It made the rational choice feel like self-harm.

  He thought about Miller, still out on the A838. Miller was free. Miller was cold. Miller was rational.

  Elias looked at the driver through the glass. The driver flicked the cigarette into a puddle and looked up. Their eyes met. The driver didn't smile. He just tapped his scanner, checking the status. *Pending.*

  Elias looked back at the screen. The *Pay* button was green. The *Dispute* button was grey. The green button cost him three thousand credits. The grey button cost him his integrity, or at least the mechanical simulation of it he had installed to survive the night.

  But why keep the simulation once the danger passed? Was it not smarter to be the person who could switch the lock off? To be the person who could take the lift and then realise that paying was foolish? If everyone did that, the system collapsed. But he wasn't everyone. He was one man in a depot in Inverness. His individual defection wouldn't break the road.

  The headache spiked. He gripped the edge of the kiosk.

  It wasn't about the road. It was about the man in the cab. If Elias didn't pay, the driver was the fool. The driver had bet on Elias's character and lost. To make the driver a fool was to make the rescue a trick. If the rescue was a trick, then Elias hadn't been saved by a covenant; he had been saved by a lie. And if he was the kind of person who lived on lies, would the next driver stop? Would the next one?

  He couldn't know. He couldn't calculate the future value of a reputation he intended to discard. That was the trap. You had to intend to keep the promise to get the lift. You couldn't intend to keep it *until* you got the lift.

  His finger trembled. The steel band around his ribs tightened. He could force it. He could push through the pain. He could file the dispute and spend the next week in therapy undoing the lock. It would cost money, but less than the invoice. It would be the smart play.

  He looked at the driver again. The man had gone back to his phone. He trusted the scan. He trusted the edit. He trusted that Elias was no longer fully free.

  Elias closed his eyes. The cold of the road was still on his skin, despite the heat of the office. He could feel the wind scouring the heather. He could feel Miller standing in the dark, waiting for a light that wouldn't stop.

  Elias opened his eyes. His finger moved. It didn't go to the grey button. It hovered over the green. The headache eased, just a fraction. The band loosened.

  He didn't press it yet. He just stood there, hand raised, watching the cursor blink on the green field. The driver outside took a step towards the office door, then stopped. Waiting.

  Elias breathed in. The air smelled of floor cleaner and ozone. He was safe. He was warm. He was trapped.

  His finger descended.

  ***

  **Note on Setup Changes:**
  I adjusted the "clinic in town" mechanic to a "Remote Neural Handshake" accessible via the roadside terminal. In the original prompt, choosing the clinic before rescue was physically impossible if the clinic was 400km away in town. Making it a remote lock that flags the user as 'Clinic-bound' preserves the philosophical constraint (committing to be irrational before safety) while making the logistics of the story viable.
