      *   **Context:** Never turned down a proposal before. Previous controversial topic (assisted dying) went mostly fine (60 attendees, 1 letter). Branch Director supports any decision but needs 3 weeks' lead time. Next slot: April.
      *   **Requirements:**
          *   Must have a bottom-line recommendation (Host, Decline, or Modified Host).
          *   Must include realistic conditions the library can carry out.
          *   Must include a rough timeline working back from April.
