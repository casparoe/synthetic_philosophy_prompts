answer: |-
  This is a precise and phenomenologically rich observation. You are describing a failure not of *competence* (the skill exists) nor of *calibration* (the trust is accurate), but of *initiation* (the trigger is absent).

  There is no single consensus term for this specific pattern in the current literature, though it sits at the intersection of three established concepts. Below I outline the nearest neighbors, explain where they diverge from your description, and propose a term that captures the specific deficit you are observing.

  ### 1. The Nearest Neighbors

  **A. Automation Bias (specifically Omission Errors)**
  *   **Proximity:** High. In human-factors literature (e.g., Parasuraman & Manzey, 2010), automation bias is divided into *commission* (following wrong advice) and *omission* (failing to detect errors because one assumes the system handles them). Your students are committing omission errors.
  *   **Divergence:** Automation bias typically presupposes a distortion in *belief* (i.e., "The system is likely right, so I don't need to check"). You note your students express appropriate skepticism when asked. Their internal probability estimate of error is correct; their *behavioral response* to that estimate is dormant. Bias implies a skewed judgment; you are describing a skipped procedure.

  **B. Cognitive Offloading**
  *   **Proximity:** Moderate. This refers to using external tools to reduce cognitive demand (e.g., using a calculator instead of mental math). Recent work (e.g., Risko & Gilbert, 2016) discusses offloading memory and problem-solving.
  *   **Divergence:** Offloading is typically framed as a strategic, often conscious, choice to conserve resources. Your description suggests the students are not making a active trade-off ("I'll save time here"); rather, the *impulse* to engage is simply not arising. It is a passive lapse, not an active strategy.

  **C. Processing Fluency Effects**
  *   **Proximity:** High (Mechanism). Research on metacognition (e.g., Ackerman & Goldsmith, 2011) shows that high *processing fluency* (how easy information is to process) creates a "Feeling of Rightness." LLM output is syntactically fluent and confident.
  *   **Divergence:** Fluency explains *why* the output looks trustworthy, but it does not fully explain why the *habit* of verification is suppressed. A seasoned researcher might see fluent text and still think, "Too smooth, let me check the data." The fluency explains the lack of friction, but not the absence of the reflex to create friction.

  ### 2. Proposed Term: Metacognitive Damping

  Since existing terms conflate trust with monitoring, or strategy with habit, I propose **Metacognitive Damping**.

  *   **Definition:** The suppression of the spontaneous metacognitive monitoring signal that typically initiates verification, caused by the high fluency and apparent completeness of an automated artifact.
  *   **Why "Damping"?** In physics, damping reduces the amplitude of an oscillation without stopping the system entirely. The capacity for evaluation (the system) is intact, but the signal strength (the spontaneous suspicion) is reduced below the threshold required to trigger action.
  *   **Why "Metacognitive"?** It locates the error in the monitoring of one's own knowledge (epistemic monitoring), not in the knowledge itself.

  ### 3. Defining the Edges

  To distinguish **Metacognitive Damping** from lookalikes, you can apply the following boundary conditions:

  | Feature | **Metacognitive Damping** (Your Phenomenon) | **Lookalike 1: Resource Scarcity** (Deadline Pressure) | **Lookalike 2: Skill Deficit** (Novice) | **Lookalike 3: Generalized Passivity** (Learned Helplessness) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Context** | Specific to AI-assisted tasks. | Global across all tasks (AI and unaided). | Global across all tasks. | Global across all tasks/sources. |
  | **Capacity** | Evaluation skill is intact and readily accessible. | Evaluation skill is intact but deprioritized. | Evaluation skill is absent or undeveloped. | Evaluation skill is intact but believed to be futile. |
  | **Trigger** | The "suspicion" does not surface unbidden. | The "suspicion" surfaces but is consciously overridden. | The "suspicion" never surfaces (don't know what to look for). | The "suspicion" surfaces but is suppressed ("Why bother?"). |
  | **Response to Prompt** | Error found immediately upon explicit instruction. | Error found, often with complaint about time. | Error not found, or student cannot explain the fix. | Error found, but student expresses surprise they were allowed to check. |

  ### 4. Evidence to Settle the Case

  If you wish to document this formally or distinguish it in your classroom, look for these three markers:

  1.  **The Baseline Discrepancy:** Compare error-detection rates on identical tasks performed unaided vs. AI-assisted. In Metacognitive Damping, unaided performance is high (they catch their own typos/logic errors), while AI-assisted performance is near zero *until prompted*. In Skill Deficit, both would be low.
  2.  **Think-Aloud Protocols:** Ask students to verbalize their thoughts while reviewing AI output.
      *   *Damping:* Long periods of silence or reading without commentary, followed by "Oh, I see it now" when interrupted.
      *   *Complacency:* Verbalizations like "This looks correct" or "The AI probably knows this."
      *   *Scarcity:* Verbalizations like "I need to move on" or "I'll check this later."
  3.  **Latency to Correction:** Measure the time between "Please check this" and "Here is the error."
      *   *Damping:* Latency is very short (seconds/minute). The search pattern is immediate and targeted.
      *   *Skill Deficit:* Latency is long, or no error is found.
      *   *Scarcity:* Latency is short, but accompanied by verbal markers of reluctance.

  ### Summary
  You are observing a **Metacognitive Initiation Failure** driven by **Processing Fluency**. While **Automation Bias (Omission)** is the standard human-factors label, it incorrectly implies a trust calibration error. **Metacognitive Damping** better captures the preservation of skill alongside the suppression of the spontaneous trigger to use it.

  The critical distinction is that your students are not *trusting* the machine; they are *waiting* for it to be wrong, rather than *hunting* for the error. The stance has shifted from **adversarial verification** (the scientific norm) to **passive reception** (the consumer norm).
