answer: |-
  Here are the straight answers you asked for, followed by the procedure, followed by the three test runs.

  ### Part 1: The Three Straight Answers

  **1. Which assumption does this procedure break?**
  It breaks the **"Knowledge"** assumption. The kids' logic works only if they *know for a fact* that your announcement is true and binding.
  *   **The Fix:** The procedure treats your announcement as a **statement of intent**, not a logical guarantee.
  *   **Why:** If you say, "I plan to give a surprise quiz," and then you don't, you haven't lied; you changed your plan. If you say, "There *will* be a surprise quiz," you have created a logical contract they can dissect. The procedure forces you to speak in plans, not promises.

  **2. Is the fix "sometimes lie"? What does it cost?**
  No, the fix is **"remain fallible."**
  *   **The Distinction:** Lying is saying "X will happen" when you know X will not. Being fallible is saying "I intend X" and having real-world factors (or your own choice) prevent X.
  *   **The Cost:** It costs you the aura of omnipotence. You become a person who makes decisions, not a logic machine. With 12-to-16-year-olds, this is actually *better* for trust. If you promise a logical guarantee and fail (because the paradox makes it impossible), you look incompetent. If you promise an intent and adapt, you look human.
  *   **Warning:** Do not use this as an excuse to be capricious. If you say "I plan to quiz" and never do, you lose authority. The procedure includes a constraint to prevent this.

  **3. The 25-Percent Kid: Does probability defeat surprise?**
  No, but you have to draw the line yourself.
  *   **The Logic:** Knowing there is a 25% chance is knowing there is *uncertainty*. Surprise is the resolution of that uncertainty. If they walk in thinking "It probably won't be today," and it is, they are surprised.
  *   **The Line:** You must define "Surprise" for your room. Is it "Zero prior expectation"? (Impossible). Or is it "No certainty on the morning of"? (Possible).
  *   **The Verdict:** The procedure assumes the second definition. If the kid argues, tell them: "Surprise means you didn't know *for sure* this morning. It doesn't mean you thought the probability was zero." That is a policy decision, not a fact.

  ***

  ### Part 2: The Sunday 10-Minute Protocol

  **Materials:** A notebook (physical, not on your phone), a 4-sided die (or random number generator), a calendar.
  **Constraint:** You must quiz at least once every 10 school days (2 weeks).
  **Constraint:** Assume any specific announcement made Monday is public knowledge in the group chat by Wednesday morning.

  #### Step 1: The Constraint Check
  Look at the last 10 school days.
  *   **Question:** Have I given a quiz in the last 9 days?
  *   **If NO:** You **must** quiz this week. Mark this week **[MANDATORY]**.
  *   **If YES:** You **may** quiz this week. Mark this week **[OPTIONAL]**.
  *   **[JUDGMENT CALL]:** If marked [OPTIONAL], do you *want* to quiz? If no, stop here. No quiz this week. If yes, mark **[VOLUNTARY]**.

  #### Step 2: The Day Selection
  *   **If [MANDATORY]:** Roll your die (1-4). Assign 1=Day 1, 2=Day 2, etc. This is your **Target Day**.
  *   **If [VOLUNTARY]:** Roll your die.
      *   Roll 1-3: Set **Target Day** to that number.
      *   Roll 4: **No Quiz This Week.** Stop procedure.
  *   **[JUDGMENT CALL]:** Look at the Target Day. Is there a known disruption (library closure, holiday)? If yes, move Target Day to the previous available day.

  #### Step 3: The Predictability Test (The Paradox Check)
  Imagine it is the morning of the **Target Day**.
  *   **Question:** If I have *not* quizzed on any previous days this week, will the kids know *for sure* today is the day?
  *   **Scenario A:** Target Day is the last day of the week (Day 4).
      *   If you announced "Quiz this week," and no quiz Mon-Wed, they *know* it's Thursday.
      *   **Result:** **PREDICTABLE.**
  *   **Scenario B:** Target Day is Day 1, 2, or 3.
      *   Even if no quiz prior, they can't be sure you won't skip it (because you are fallible, see Part 1).
      *   **Result:** **SURPRISE POSSIBLE.**
  *   **[JUDGMENT CALL]:** If Result is **PREDICTABLE**, you have two choices:
      1.  Move Target Day to an earlier day (Day 2 or 3).
      2.  Keep Target Day, but accept it won't be a "surprise," just a "scheduled" quiz.
      *   *Recommendation:* Move the day. Surprise is the goal.

  #### Step 4: The Announcement Draft
  You need to decide what to say on Monday morning.
  *   **Option A (Silence):** Say nothing about a quiz.
      *   *Pros:* Maximum surprise.
      *   *Cons:* Kids might not study.
  *   **Option B (Vague Intent):** "I am planning to quiz sometime this week, but I haven't decided when."
      *   *Pros:* Encourages study. Breaks the "logical guarantee" assumption.
      *   *Cons:* Invites the 25% argument.
  *   **Option C (Specific):** "Quiz on Day 3."
      *   *Pros:* Clear.
      *   *Cons:* No surprise.
  *   **[JUDGMENT CALL]:** Select Option A or B. **Never select Option C.**
      *   *Guideline:* If the group is currently "cocky" (Scenario 3), use Option A. If they are slacking, use Option B.

  #### Step 5: The "Wednesday Leak" Adjustment
  Assume whatever you say Monday is analyzed by Wednesday.
  *   **If you chose Option B:** By Wednesday, if no quiz has happened, the probability shifts.
  *   **Action:** On Wednesday morning, if no quiz yet, **do not update them.** Do not say "Still coming!" Do not say "Maybe not." Silence preserves uncertainty.
  *   **[JUDGMENT CALL]:** If you feel the silence is causing panic (too much stress), you may cancel the quiz for this week to reset trust. If you cancel, you must quiz early next week.

  #### Step 6: Execution
  *   On **Target Day**, hand out the quiz.
  *   If a kid says, "We knew it was today," your response is scripted: **"You didn't know for sure. You guessed."**
  *   Do not debate the logic in the room. End discussion.

  ***

  ### Part 3: Running the Scenarios

  Here is how the protocol handles your three specific situations.

  #### Situation 1: Ordinary Week (1 Quiz, Don't Care When)
  *   **Step 1:** Last 9 days had a quiz? Let's say No. Mark **[MANDATORY]**.
  *   **Step 2:** Roll die. Get 3. **Target Day = Day 3 (Wednesday).**
  *   **Step 3:** Predictability Test. If no quiz Mon-Tue, is Wed certain? No, because you could skip to Thu (Day 4). **SURPRISE POSSIBLE.**
  *   **Step 4:** Announcement Draft. Group is normal. Choose **Option B (Vague Intent)**. "Planning to quiz this week."
  *   **Step 5:** Wednesday Leak. It is Wednesday (Target Day). No leak issue yet.
  *   **Outcome:** You quiz on Wednesday. Kids studied because of Option B. They aren't certain it's Wednesday until you hand it out.
  *   **Why it works:** You didn't guarantee the week. You said "planning." If you hadn't quizzed Wed, you could have done Thu. The induction chain is broken because the last day isn't certain.

  #### Situation 2: Nine-Week Term (Promised 3 Quizzes, None Visible)
  *   **Analysis:** This is the danger zone. Promising "3 quizzes" + "None visible" creates a logical contract across weeks.
  *   **Step 1:** You have a term goal (3 quizzes). You must track this globally, not just weekly.
  *   **Step 2:** You pick weeks 3, 6, and 8 randomly.
  *   **Step 3:** Predictability Test.
      *   *Week 9:* If they know 3 quizzes are required and you haven't done 3 by Week 8, Week 9 is **PREDICTABLE**.
      *   *Protocol Fix:* You cannot promise "Exactly 3" and "Unseen."
  *   **[JUDGMENT CALL]:** **Walk the promise back.**
      *   *Action:* Tell them: "The goal is 3 quizzes, but I reserve the right to add a 4th or cancel a 3rd depending on how the class is going."
      *   *Why:* This breaks the "Known Total" assumption required for the long-term induction. If they don't know *for sure* there are only 3, they can't count down the weeks.
  *   **Outcome:** If you refuse to walk it back, the protocol flags this as **IMPOSSIBLE**. You cannot logically guarantee 3 unseen quizzes in a fixed 9-week term. You must choose: Fixed Number OR Unseen. Not both.

  #### Situation 3: The Cocky Group (Done the Induction, Assume 25%)
  *   **Context:** They think they have solved you. They expect Option B (Vague Intent) and have calculated the odds.
  *   **Step 1:** Check constraints. You need to quiz this week (2-week rule). Mark **[MANDATORY]**.
  *   **Step 2:** Roll die. Get 4 (Thursday/Last Day).
  *   **Step 3:** Predictability Test.
      *   If you say nothing, and it gets to Thursday, is it certain?
      *   They think: "She has to quiz this week. It's Thursday. It's today."
      *   **Result:** **PREDICTABLE.**
  *   **Step 4:** Announcement Draft.
      *   Standard protocol says Option A (Silence).
      *   *Adjustment for Cocky Group:* They expect Silence to mean "She's hiding."
      *   **[JUDGMENT CALL]:** Use **Option A (Silence)**, but quiz on **Day 2 (Tuesday)**.
      *   *Why:* They are focusing on the end of the week (the induction point). Hitting early breaks their focus on the "last day" logic.
  *   **Step 5:** Wednesday Leak. Quiz is already done on Tuesday. Irrelevant.
  *   **The 25% Argument:** A kid says, "We knew there was a 25% chance each day."
      *   *Your Script:* "Knowing the odds isn't knowing the day. Did you know *this morning* it was today? No. So it's a surprise."
  *   **Outcome:** You re-establish that *you* control the randomness, not their logic. By hitting Day 2, you show that the "Last Day" induction is irrelevant because you don't wait for the last day.

  ### Summary of Judgment Calls
  1.  **Step 1:** Deciding if a week is Mandatory or Optional based on your own history.
  2.  **Step 3:** Deciding whether to move a Predictable day or accept a Non-Surprise quiz.
  3.  **Step 4:** Choosing between Silence (Option A) and Vague Intent (Option B) based on class morale.
  4.  **Step 5:** Deciding whether to cancel a quiz mid-week if stress levels get too high.
  5.  **Scenario 2:** Deciding to break the "3 Quiz" promise to save the "Surprise" condition.

  ### Final Note on the "25% Kid"
  If the kid pushes the probability argument again, do not engage in math. Say this:
  *"In this room, 'Surprise' means you cannot be certain before I hand out the paper. Probability is not certainty. If you want to change the definition of 'Surprise' for this co-op, you can propose it in writing, but until then, my definition stands."*

  This moves the debate from logic (where they think they win) to policy (where you are the authority).
