      *   *The Probability Fix:* Knowing there is a 25% chance is not the same as knowing *when*. Surprise is about certainty at the moment, not prior probability.
      *   *Practical Approach:* The user needs a *policy*, not a truth. The policy must introduce uncertainty that the kids cannot resolve via logic. Randomness + Ambiguity is key.

