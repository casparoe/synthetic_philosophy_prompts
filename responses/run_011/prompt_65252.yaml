answer: |-
  ### Brainstorm: Framing the Question

  1.  **Does introducing a minority of Image Scoring agents into a population of Standing agents increase total cooperation under high implementation error?**
      *   *Verdict:* **Take this.** It targets the interior optimum conjecture directly and is binary enough to resolve.
  2.  **How does private versus public reputation tracking alter the stability of heterogeneous norms?**
      *   *Verdict:* **Drop this.** Comparing information structures is a separate project; it doubles the state space and kills analytic tractability for a one-semester timeline.
  3.  **Can heterogeneous norms sustain cooperation when homogeneous norms fail?**
      *   *Verdict:* **Drop this.** Too vague. "Fail" needs a metric (e.g., below 50% cooperation), and homogeneous Standing rarely fails completely unless error is extreme.
  4.  **Is there a critical fraction of naive judges required to prevent the collapse of a Standing-dominant population?**
      *   *Verdict:* **Reserve as secondary.** This is the mathematical output of Question 1, not the framing itself.

  **Commitment:** We proceed with Question 1. It forces a specific model architecture and yields a clear yes/no on the "functional minority" conjecture.

  ***

  ### Chapter Proposal: Heterogeneous Assessment Norms in Indirect Reciprocity

  **The Question**
  Standard models of indirect reciprocity assume normative homogeneity: the entire population assesses actions using a single social norm (e.g., *Standing* or *Judging*). This proposal asks: **In a population where reputation is public but updated by observers drawn from a heterogeneous mix of *Standing* (second-order) and *Scoring* (first-order) norms, does there exist a stable interior equilibrium of norm fractions that maximizes cooperation?**

  This is not merely a robustness check. The literature treats *Scoring* (help = good, refuse = bad) as a primitive, error-prone precursor to *Standing* (help good = good, refuse bad = good). I argue that *Scoring* acts as a functional constraint on *Standing*. *Standing* permits justified punishment, but this creates a loophole: defectors can refuse help to anyone marked "bad" without reputational cost. A *Scoring* observer does not recognize "justified refusal"; they see only "refusal = bad." If defectors exploit the *Standing* loophole, *Scoring* observers punish them, restoring the value of the "bad" label. The hypothesis is that cooperation is non-monotonic with respect to the fraction of *Scoring* judges: zero *Scoring* allows exploitation; 100% *Scoring* collapses under error; a mix sustains both punishment and forgiveness.

  **Why Existing Positions Leave This Open**
  The canonical result (Ohtsuki & Iwasa, 2004) identifies *Leading Eight* norms that sustain cooperation under homogeneity. Subsequent work on noise (e.g., Uchida) focuses on error correction within a single norm. Heterogeneity is typically treated as a transient state in evolutionary dynamics (norms competing until one fixes) or as private reputations (Suzuki et al.), which renders analytic solutions intractable. No current model treats norm heterogeneity as a stable, functional feature of the information environment itself. By assuming the population must converge to a single norm, existing models miss the possibility that normative friction *is* the mechanism that prevents niche exploitation.

  **Method and Timeline**
  To resolve the "reputation ledger" wrinkle, we will adopt a **Public Reputation with Stochastic Updating** model. There is one public bit of reputation per agent. When an interaction occurs, the update is performed by a randomly drawn observer whose norm determines the update. This approximates a mean-field private reputation system without the $N^2$ complexity.

  *   **Month 1: Analytic Derivation.**
      *   Construct the replicator dynamics for the two norms (*Standing* vs. *Scoring*).
      *   Derive the payoff matrix as a function of the fraction of *Scoring* agents ($x$) and the error rate ($\epsilon$).
      *   **Analytic Core:** Solve for the fixed points of the system. Specifically, determine the Jacobian at the boundary equilibria ($x=0$ and $x=1$). We need to prove that for a specific range of $\epsilon$, both boundaries are unstable, implying a stable interior fixed point.
      *   *Deliverable:* A proof condition for the existence of the interior optimum.

  *   **Month 2: Simulation Validation.**
      *   Build an agent-based model (Python) to test the analytic approximation against finite-size effects and stochastic drift.
      *   Run parameter sweeps on population size ($N$) and error ($\epsilon$) to ensure the interior optimum is not an artifact of the infinite-population assumption.
      *   *Deliverable:* Heatmaps of equilibrium cooperation levels across the $(x, \epsilon)$ plane.

  *   **Month 3: Synthesis and Writing.**
      *   Interpret the stability conditions philosophically: What does it mean for a community to require "naive" judges to function?
      *   Draft the chapter, focusing on the mechanism of the "loophole closure."

  **Success and Failure Conditions**
  A successful result demonstrates a parameter region where the homogeneous *Standing* population ($x=0$) is invaded by *Scoring* mutants, but the homogeneous *Scoring* population ($x=1$) is invaded by *Standing* mutants, resulting in a stable polymorphic state with higher cooperation than either pure state.

  **Failure** is defined as follows: If the analytic derivation shows that the interior fixed point exists only for error rates $\epsilon > 0.5$ (biologically implausible), or if the interior point is unstable (a saddle), the conjecture is false. In this case, the chapter will pivot to a negative result: demonstrating that normative homogeneity is indeed required for high cooperation, and heterogeneity is purely destabilizing. An *inconclusive* result (e.g., simulation noise obscures the fixed point) is not acceptable; we will extend the semester or simplify the model to ensure a determinate answer.

  **Scope Check**
  To ensure completion within one semester:
  1.  **Binary Reputation Only:** No continuous scores or image profiles.
  2.  **Two Norms Only:** *Simple Standing* vs. *Image Scoring*. No *Stern Judging* or other *Leading Eight* variants.
  3.  **Well-Mixed Population:** No network structure. Spatial structure adds a layer of complexity that risks blowing the timeline.
  4.  **Fixed Norms:** Agents do not learn or switch norms during their lifetime; evolution happens between generations (replicator dynamics).

  **Addressing the "Parameter Sweep" Objection**
  The economist on the committee will rightly ask if this is merely a simulation with a story. The defense lies in the **stability analysis**. We are not searching for a peak by sweeping parameters; we are deriving the *conditions* under which a polymorphic equilibrium is mathematically stable. The simulation serves only to verify that the mean-field approximation holds for finite $N$. If the Jacobian analysis does not yield a stable interior eigenvalue, the simulation is irrelevant. The analytic core dictates the narrative, not the heatmaps.

  ***

  ### The Paragraph Proposals Never Include

  The framing above relies on one assumption that, if false, sinks the chapter: that norms are fixed traits rather than strategies subject to rapid social learning. I am modeling *Standing* and *Scoring* as genetic or deeply cultural types that evolve slowly relative to reputation dynamics. If, in reality, agents can switch assessment rules on the fly based on immediate payoff (which is plausible in human contexts), the polymorphic equilibrium might collapse into a cyclic dynamic or rapid fixation, rendering the "functional minority" argument void. Furthermore, the "Public Reputation with Stochastic Updating" mechanism is a mathematical convenience to bypass the private ledger problem. If the committee argues that disagreement *necessitates* private ledgers, the analytic tractability vanishes, and the project becomes a pure simulation study. I am betting that the mean-field approximation captures the essential dynamics, but if the mechanism of disagreement is the primary philosophical interest, this model is too coarse. If pressed, I would argue that the *effect* of disagreement (noise in the update rule) matters more than the *storage* of disagreement, but this is the weakest link in the design.
