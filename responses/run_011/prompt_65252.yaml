prompt: |-
  You're an evolutionary game theorist who also works in philosophy of biology, and you've sat on enough funding panels to know exactly which sentences make a proposal get rejected. Think this through properly before writing — I need the framing to be right, not fast.

  I'm a third-year PhD student and I have to hand my comittee a chapter proposal by Friday. Its the second of three chapters: roughly 8,000 words of write-up plus simulations I run myself, over one semester. Here's the half-formed idea.

  The indirect reciprocity literature has a familiar arc, as I understand it. If observers judge a donor purely by the act — helped, so good; refused, so bad — cooperation unravels as soon as you add any error, because a cooperator who fails to help gets branded bad and is then refused in turn, and the branding spreads. The repair is to use assessment rules that look at whether the recipient deserved the help, so that refusing a bad person is itself counted good. Everyone agrees the repair handles noise better.

  What I think both camps assume without arguing is that the whole population runs the *same* assessment rule. Normative homogeneity goes in as a simplifying assumption, but out in the world it's an empirical claim about communities, and it's false at any scale bigger than a village.

  My conjecture: a minority of naive first-order judges might be functional rather than a leftover. The mechanism I have in mind — no idea whether it survives contact with the math — is that the lenient second-order rules open an exploitable niche. Refuse help to whoever is currently marked bad and your own reputation stays clean, because your refusal was justified. A strict first-order judge doesn't accept that excuse at all. So scattering strict judges through the population closes the loophole, at the cost of sometimes mislabeling unlucky cooperators. That points toward a non-monotonic relationship between the fraction of naive judges and cooperation at equilibrium — an interior optimum instead of "more consensus is better."

  Then there's the wrinkle I can't get past, and I want you to face it rather than smooth over it: once observers disagree, reputation stops being a single public variable. Does the donor act on her own assessment of the recipient? On the assessment of the audience she expects to hear about the encounter? Is there one shared ledger with disagreement only entering at the update step? Each choice produces a different game and probably a different answer, and I honestly don't know which one I mean. Telling me is part of the job.

  Turn this into a chapter proposal. Specifically:

  - Open with a short brainstorm: three or four versions of the question precise enough that one semester could actually settle them, each with a one-line verdict on whether I should take it. Then commit to one. Don't hand me a menu and wander off.
  - The proposal proper, about 1,200 words: the question stated so that it has a determinate answer; why the existing positions leave it open; the method, month by month across the semester, being explicit about what gets done analytically and what gets done by simulation; what a result would look like, and above all what would count as the project *failing* rather than merely coming back inconclusive; and a scope check, since I reliably overpromise.
  - Skip references entirely, I'll sort those out myself — but do name the positions and arguments by whatever labels they usually go under, so I know what to hunt down.
  - One committee member is an economist who will ask why this isn't just a parameter sweep with a hundred free knobs and a story stapled on afterward. Either give me the analytic core that answers him, or argue that simulation is the right instrument here and explain how I'd keep it honest.

  Last thing, and I mean it: end with a short paragraph that proposals never include. Say where you think my framing is most likely wrong — which assumption, if it's false, sinks the whole chapter — and say what consideration would change your mind about the core conjecture. If you think the idea is muddled and the chapter should be about something else entirely, tell me what.
