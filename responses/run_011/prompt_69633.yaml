  # The Epistemic Sorter: A Whiteboard Decision Tree

  This tool sorts your group by **case intuitions**, not jargon. Participants answer "Yes" or "No" to concrete scenarios. The path they take reveals their underlying epistemic doctrine.

  ## Part 1: The Decision Tree (8 Nodes)

  **Start:** *Assume the subject has normal vision, no reason to doubt, and is paying attention.*

  **Node 1: The Zoo (Ordinary)**
  You see a zebra in a standard zoo cage. Do you **know** it's a zebra?
  *   **No** $\rightarrow$ Go to Node 2.
  *   **Yes** $\rightarrow$ Go to Node 3.

  **Node 2: The Zoo (Global)**
  If you don't know it's a zebra, do you know **anything** about the external world (e.g., that you have hands)?
  *   **No** $\rightarrow$ **LEAF: Plain Skepticism**
  *   **Yes** $\rightarrow$ **LEAF: Relevant Alternatives**

  **Node 3: The Zoo (Closure)**
  You know it's a zebra. Do you **know** it is not a painted mule (indistinguishable from where you stand)?
  *   **No** $\rightarrow$ **LEAF: Relevant Alternatives** (Dretske-style)
  *   **Yes** $\rightarrow$ Go to Node 4.

  **Node 4: The Grandmother (Sensitivity)**
  You visit Grandma; she looks well. If she *were* sick, she would hide it to spare you worry (so you'd still believe she's well). Do you **know** she is well?
  *   **No** $\rightarrow$ **LEAF: Sensitivity Tracking** (Nozick)
  *   **Yes** $\rightarrow$ Go to Node 5.

  **Node 5: The Fake Barns (Environment)**
  You drive through a county full of barn facades, but you happen to look at the one real barn. Do you **know** it's a barn?
  *   **No** $\rightarrow$ Go to Node 6.
  *   **Yes** $\rightarrow$ Go to Node 7.

  **Node 6: The Maya Case (Disposition)**
  Maya checks a trustworthy news app. If it were down, she would have checked a satire site (unreliable). Today the app is up. Does she **know** the news?
  *   **No** $\rightarrow$ **LEAF: Safety (Environmental)** (Pritchard)
  *   **Yes** $\rightarrow$ **LEAF: Contextualism** (Standards shifted between Barns and Maya)

  **Node 7: The Maya Case (Process)**
  Maya checks a trustworthy news app. If it were down, she would have checked a satire site. Today the app is up. Does she **know** the news?
  *   **No** $\rightarrow$ **LEAF: Virtue/Disposition** (Sosa/Greco)
  *   **Yes** $\rightarrow$ Go to Node 8.

  **Node 8: The Stopped Clock (Luck)**
  A clock stopped exactly 12 hours ago. You look at it now; it shows the right time. Do you **know** the time?
  *   **No** $\rightarrow$ **LEAF: Process Reliabilism** (Goldman)
  *   **Yes** $\rightarrow$ Go to Node 9.

  **Node 9: The Bank (Subject Stakes)**
  Hannah needs to deposit a check. If she's wrong about bank hours, she loses her house (High Stakes) vs. she's just curious (Low Stakes). In High Stakes, does she **know** the hours (assuming same evidence)?
  *   **No** $\rightarrow$ Go to Node 10.
  *   **Yes** $\rightarrow$ **LEAF: Neo-Moorean**

  **Node 10: The Bank (Attributor Stakes)**
  Hannah (High Stakes) doesn't know. You (Low Stakes) are talking about her. Can you truly say "Hannah knows"?
  *   **No** $\rightarrow$ **LEAF: Pragmatism** (Subject-Sensitive Invariantism)
  *   **Yes** $\rightarrow$ **LEAF: Contextualism** (Attributor-Sensitive)

  *(Note: Node 10 separates the two views that survived Node 9. If you said No to Node 9, you are already a Pragmatist/Contextualist; Node 10 clarifies which.)*

  ---

  ## Part 2: Logical Space Analysis

  There are 8 binary case-intuitions underlying this tree. Theoretically, there are $2^8 = 256$ combinations of answers. In practice, only about 10 are occupied by coherent philosophical positions.

  | Core Intuition Combination | Occupied By | Status of Empty Cells |
  | :--- | :--- | :--- |
  | **Skeptic:** No Ordinary Knowledge | Plain Skepticism | **Coherent:** Consistent global doubt. |
  | **RA:** Yes Ordinary, No Closure | Relevant Alternatives | **Coherent:** Denies closure principle. |
  | **Sensitivity:** Yes Closure, No Grandma | Sensitivity Tracking | **Coherent:** Counterfactual tracking required. |
  | **Safety:** No Barns, No Maya | Safety Theory | **Coherent:** Modal robustness required. |
  | **Virtue:** Yes Barns, No Maya | Virtue Epistemology | **Coherent:** Ability vs. Luck distinction. |
  | **Reliabilism:** Yes Barns, Yes Maya, No Clock | Process Reliabilism | **Coherent:** Actual causal history matters. |
  | **Moorean:** Yes All Cases | Neo-Mooreanism | **Unattractive:** Swallows all Gettier cases. |
  | **Pragmatism:** Stakes Matter (Subject)** | Pragmatic Encroachment | **Coherent:** Knowledge depends on action. |
  | **Contextualism:** Stakes Matter (Speaker)** | Epistemic Contextualism | **Coherent:** Knowledge depends on conversation. |
  | **Empty:** No Barns, Yes Maya (w/o Context) | *None* | **Incoherent:** Why does environment kill Barn knowledge but not Maya knowledge if not for shifting standards? |
  | **Empty:** Yes Clock, No Maya | *None* | **Unattractive:** Accepts clock luck but rejects app luck? Hard to motivate. |
  | **Empty:** Yes Grandma, No Closure | *None* | **Incoherent:** If you can't rule out mules, how do you know Grandma isn't a robot mule? |

  **Why the empty cells are empty:**
  1.  **Incoherent:** Violates basic logical entailment (e.g., knowing Zebra but not knowing it implies Not-Mule, while simultaneously accepting Closure).
  2.  **Unattractive:** Ad-hoc. Requires treating two structurally identical cases (Barns and Maya) differently without a principled reason (like Context).
  3.  **Unexplored:** Some combinations (e.g., Pragmatic Skepticism) exist in niche literature but have no "school."

  ---

  ## Part 3: Indistinguishable Leaves

  Your tree cannot perfectly separate every view with only 8 nodes. Here are the trouble spots:

  **1. Contextualism vs. Pragmatism**
  *   **The Problem:** Both say knowledge attributions change with stakes.
  *   **The Tree's Limit:** Node 9 & 10 attempt this, but in a quick whiteboard session, participants often conflate "Hannah's stakes" with "Our conversation about Hannah."
  *   **The Separating Case:** *The Low-Stakes Attributor / High-Stakes Subject.*
      *   Hannah (High Stakes) has evidence $E$. You (Low Stakes) discuss Hannah.
      *   **Contextualist:** You can truthfully say "Hannah knows" (your context is low).
      *   **Pragmatist:** You cannot truthfully say "Hannah knows" (her stakes determine the fact).
  *   **Verdict:** If your group argues here, draw this specific case. Otherwise, treat them as "Anti-Invariantists."

  **2. Safety vs. Virtue**
  *   **The Problem:** Both reject Fake Barns. Both often reject Maya.
  *   **The Tree's Limit:** Node 7 splits them on Maya, but Safety theorists can argue Maya is unsafe (nearby world she uses satire). Virtue theorists argue Maya lacks ability manifestation.
  *   **The Separating Case:** *The Nervous Expert.*
      *   A skilled pilot lands a plane perfectly but is trembling with fear (internal state compromised).
      *   **Virtue:** No knowledge (ability not fully manifested/integrated).
      *   **Safety:** Yes knowledge (outcome is safe across nearby worlds).
  *   **Verdict:** Keep this in your back pocket if an ML engineer (Virtue/Design Space) clashes with a Safety theorist.

  ---

  ## Part 4: Non-Human Agents (For the ML Engineers)

  Can a classifier occupy these leaves?

  | Leaf Position | Can a Model "Know"? | Why / Why Not |
  | :--- | :--- | :--- |
  | **Plain Skepticism** | **No** | Requires conscious doubt/regress. |
  | **Relevant Alternatives** | **Yes** | Model can filter classes (ignore "mule" class). |
  | **Sensitivity Tracking** | **Yes** | Model can be tested on counterfactual inputs. |
  | **Safety** | **Yes** | Model can be robust across perturbed inputs (nearby worlds). |
  | **Virtue/Disposition** | **Yes** | Architecture represents "ability"; training represents "character." |
  | **Process Reliabilism** | **Yes** | **Best Fit.** Focuses on actual inference path reliability. |
  | **Contextualism** | **No** | Requires conversational context/speaker intent. |
  | **Pragmatism** | **Yes** | If "stakes" = loss function weights/cost of error. |
  | **Neo-Moorean** | **Yes** | Axiomatic. If the output is 1, it knows 1. |

  **Note for the Group:** If your ML engineers say "The model knows," they are almost certainly **Process Reliabilists** or **Safety Theorists**. If they say "The model only knows if the training distribution matches deployment," they are **Virtue Theorists**.

  ---

  ## Part 5: Scoring Sheet & Diagnosis

  Hand this to your scribe. Tally the path.

  | If their path ends at... | Their Position | One-Line Diagnosis |
  | :--- | :--- | :--- |
  | **Node 2 (No Global)** | **Plain Skeptic** | "You think we're brains in vats. Stop arguing and go home." |
  | **Node 2 (Yes) or Node 3 (No)** | **Relevant Alternatives** | "You think knowledge is about ignoring the noise, not ruling out everything." |
  | **Node 4 (No)** | **Sensitivity Tracking** | "You think knowledge requires tracking truth across worlds. (Nozick fan)" |
  | **Node 6 (No)** | **Safety (Environmental)** | "You think environmental luck kills knowledge, even if the process worked." |
  | **Node 6 (Yes)** | **Contextualism** | "You think 'know' changes meaning depending on how careful we need to be." |
  | **Node 7 (No)** | **Virtue/Disposition** | "You care about the system's design space, not just the single inference." |
  | **Node 8 (No)** | **Process Reliabilism** | "You judge the classifier by the path it actually took. (Standard ML view)" |
  | **Node 9 (Yes)** | **Neo-Moorean** | "You think common sense trumps philosophical puzzles. Always." |
  | **Node 10 (No)** | **Pragmatism** | "You think knowledge depends on what happens if you're wrong." |
  | **Node 10 (Yes)** | **Contextualism** | "You think knowledge depends on who is talking, not just who is acting." |

  **The Fault Line (Maya Case):**
  *   If you split at **Node 7** (Barns=Yes, Maya=No): You are the **Design Space** camp (ML Architecture).
  *   If you split at **Node 8** (Maya=Yes, Clock=No): You are the **Inference Path** camp (ML Operations).
  *   *This is where your argument lives.*
