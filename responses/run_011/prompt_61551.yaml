prompt: |-
  Second-year lit PhD student here, working through Du Bois's "Criteria of Negro Art" (the 1926 Crisis piece) and I've hit a wall on my case study. I invented a distinction for the paper and want to see if it survives contact with a novel.

  First, propaganda by aim vs propaganda by effect: Du Bois seems to define the category by what a work is *for* — all art advances some cause whether the artist admits it or not — but a lot of his talk about what makes art good smuggles in claims about what it does to readers. Second, split the aim in two: the indictment (here's what the system does to people) and the portrait (here are people with full inner lives, appetites, jokes, and bad choices). My hypothesis is that Wright's 1937 review of Their Eyes Were Watching God — no theme, no message, quaint Negro life served up for white readers — isn't Du Bois's criterion being defended against Hurston. It's a much stricter rule: a portrait only counts as propaganda when it's backed by an indictment. If that's right the usual framing of the Hurston/Wright fight is backwards.

  So: read the novel against all this and tell me whether it meets Du Bois's criterion. I want the porch sitters at Eatonville treated as an internal audience doing real critical work, and I want to know what Matt Bonner's mule, the hurricane, and Janie telling Pheoby at the end are doing on either reading. Also tell me where my apparatus strains — Janie chasing the pear tree isn't obviously for anybody, and maybe the novel refuses both indictment and portrait in favor of a third thing. No quotes from the novel, I know it; paraphrase scenes. Skip the bibliography, I've got the lit.

  Please use these sections, in this order:
  - The criterion (~200 words): the version of Du Bois you're testing, with aim/effect stated cleanly
  - Portrait without indictment (~400 words): the case that the novel satisfies it
  - Where it resists (~350 words): what Wright's charge actually gets right, and where I'm forcing the book
  - Two audiences (~250 words): the in-group/out-group problem — whether a text can be assigned an audience at all, or only a context
  - Bottom line (~150 words): your verdict, and what the novel shows that the essays arguing about it don't
