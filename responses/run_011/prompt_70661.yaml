answer: |-
  The argument your roommate constructed is sophisticated but contains a critical equivocation. It's a version of what's sometimes called the "collapse objection" to two-dimensionalism, and it's been discussed in the literature (notably by critics of Chalmers and Jackson). Here's where it actually breaks.

  **The Core Error: Steps 4 and 6**

  Step 6 is the most clearly false claim. The primary intension is a *function* from scenarios to truth values. Knowing the function doesn't tell you which input is the actual one. This is like knowing the sine function but not knowing what angle you're at—you still need empirical information to get an output. The primary intension tells you "if *this* scenario is actual, S is true/false," but it doesn't tell you *which* scenario is actual. That identification is paradigmatically a posteriori.

  Step 4 is also rotten, though it looked plausible. Even if you have a priori knowledge of a determining rule, if one of the inputs is a posteriori, the output is a posteriori. I can know a priori that "the tallest person in the room is over 5 feet" follows from "X is the tallest person in the room" plus "X is 6 feet tall," but whether X is actually the tallest person is empirical. Apriority doesn't transmit through empirical inputs.

  Step 3 is contentious but defensible depending on which 2D framework you adopt. Chalmers would accept it for scrutability reasons; Jackson might hedge. But even if you grant 3, steps 4 and 6 still destroy the argument.

  **Why Each Bad Step Looked Fine**

  Step 6 looked plausible because the primary intension *does* give you truth values for every candidate actuality. But "gives you truth values conditional on each candidate" ≠ "tells you which candidate wins." That's the equivocation.

  Step 4 looked plausible because we often think of a priori rules as preserving apriority. But that's only true when all inputs are a priori. Your roommate smuggled in an empirical input ("which world is actual") while pretending it was already captured by the primary intension.

  Step 3 looked plausible because 2D semantics *aims* to make modal epistemology tractable. But "tractable" doesn't mean "purely a priori"—it means "structured so empirical inputs are clearly identified."

  **Three Philosophical Perspectives**

  | Camp | Rejects | Why | Cost |
  |------|---------|-----|------|
  | **2D Theorist** | Steps 4, 6 | "Which world is actual" is empirical input not captured by primary intension; a priori rules + a posteriori inputs = a posteriori outputs | Must clarify that primary intension doesn't exhaust epistemic access to actuality |
  | **Kripkean** | Step 1 | Metaphysical necessity isn't captured by secondary intension; the whole 2D framework mischaracterizes modality | Abandons 2D semantics entirely, keeps necessary a posteriori as brute |
  | **Direct Reference** | Step 2 | Proper names don't have primary intensions that vary across scenarios; reference is fixed causally, not descriptively | Denies that sentences like "Hesperus is Phosphorus" have the 2D structure assumed |

  **Ranking the Rot**

  1. **Step 6** (most fundamental error): Equivocates on what the primary intension delivers
  2. **Step 4** (epistemologically false): Misstates how apriority transmits through inference
  3. **Step 3** (contentious but survivable): Depends on which 2D variant you're defending

  The argument, once fixed, proves something much weaker: that *if* you had a priori access to which world is actual, *then* you could know secondary intensions a priori. But that conditional is trivial—you don't have that access.

