  *(Self-Correction during drafting)*: Initially, I might make the AI sound too smart. I need to remember it's a tool. The *intelligence* is in the prediction, the *agency* is in the interpretation. The humans are doing the work of turning advice into action. The story needs to highlight *their* shift in behavior more than the AI's capabilities.

  *(Refining the Auditor's Arc)*: Elias shouldn't be a hero trying to shut it down. She's a bureaucrat trying to categorize something uncategorizable. Her struggle is semantic and legal, not moralistic.

  *(The "Small Administrative Ending")*: A change in the organizational chart. The AI is listed as a consultant.

  Let's write.

