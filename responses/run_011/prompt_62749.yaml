answer: |-
  # Desk Triage Procedure for Non-Empirical Theoretical Manuscripts

  **Purpose:** To filter manuscripts relying on non-empirical confirmation (NEC) arguments for scientific viability without adjudicating their ultimate truth.
  **Time Budget:** 45 Minutes total.
  **Core Distinction Preserved:** *Viability* (consistent, unique, research-worthy) vs. *Truth* (confirmed description of nature).
  **Core Distinction Preserved:** *In-Principle Testability* (logic allows an observation) vs. *In-Practice Testability* (technology/funding exists).
  **Deliberate Omission:** Bayesian formalism of confirmation. You are assessing the *structure* of the argument, not calculating posterior probabilities. This loses nuance on how much weight to give each argument but saves the triage from becoming a philosophy exercise.

  ---

  ## Step 0: Scope and Category Check
  **Time:** 5 Minutes
  **Question:** Is this a research article proposing a physical model, or a meta-commentary on methodology?
  **Information Needed:** Abstract and Introduction.
  **Sufficient Answer:** "This paper proposes [Model X] to explain [Phenomena Y]."
  **Non-Answer:** "This paper argues that the community should/should not publish [Model X]."
  **Termination (Reject):** If the manuscript argues for journal policy, historical methodology, or sociological norms without proposing a new physical model or derivation.
  **Rejection Text:** "This manuscript is a methodological critique rather than a research article proposing a physical model. While the concerns raised are substantive, they fall outside the scope of this journal's research section, which requires a positive theoretical or empirical contribution."
  **Escalation:** None. This is an editorial scope decision.

  ---

  ## Step 1: The Empirical Horizon
  **Time:** 10 Minutes
  **Question:** Does the manuscript identify *any* observable quantity that would falsify the model, even if measurement is currently impossible?
  **Contested Premise:** *In-Principle vs. In-Practice.* This procedure assumes that *in-principle* falsifiability is the minimum floor for physics, but requires a *plausible path* to measurement to avoid "infinite deferment."
  **If the other side were right:** If one holds that empirical contact is not required for theoretical physics, this step would be deleted. You would rely entirely on internal consistency.
  **Information Needed:** Section on "Predictions," "Observables," or "Phenomenology."
  **Sufficient Answer:** The text specifies a variable (e.g., tensor-to-scalar ratio, proton decay rate) and acknowledges current limits but defines the target.
  **Non-Answer:** "Testing is currently impossible," with no specification of what data would count as a test if technology advanced. Or, "The theory is selected by mathematical consistency alone."
  **Termination (Reject):** If the model is compatible with *all* possible data distributions (unfalsifiable in principle) OR if the only path to data relies on speculative technology with no physical mechanism described (e.g., "future Planck-scale collider").
  **Rejection Text:** "While the theoretical structure is consistent, the manuscript does not identify a falsifiable observable even in principle. To be considered for review, a physical model must specify the conditions under which it would be empirically ruled out."
  **Escalation:** If an observable is named but its measurability is technical, pass to Step 2. Do not solve the experimental physics yourself.

  ---

  ## Step 2: The No-Alternatives Argument (NAA)
  **Time:** 15 Minutes
  **Question:** Is the claim that "no alternatives exist" based on structural constraints or sociological absence?
  **Contested Premise:** *Sociology vs. Structure.* This procedure assumes NAA is valid only if the search space is structurally constrained (mathematically), not just if few people have worked on the problem.
  **If the other side were right:** If one holds that the current research community's focus defines the search space, a claim of "no other groups are working on this" would suffice.
  **Information Needed:** Introduction and Conclusion (where uniqueness is usually claimed).
  **Sufficient Answer:** "We show that any Lagrangian satisfying [Constraint A] and [Constraint B] reduces to this form." (Structural).
  **Non-Answer:** "Despite extensive effort, no other model has been found." (Sociological). Or, "We are unaware of competing measures."
  **Termination (Reject):** If the uniqueness claim rests entirely on the authors' survey of the literature rather than a derivation showing alternatives are mathematically excluded or physically pathological.
  **Rejection Text:** "The claim that no alternative models exist rests on a survey of current literature rather than a structural derivation. Without demonstrating that rivals are mathematically or physically excluded, the argument for uniqueness is not sufficiently robust for review."
  **Escalation:** If the authors claim a structural constraint (e.g., anomaly cancellation, stability), pass to Step 3. **Instruction to Referees:** "Please verify whether the stated constraints (e.g., anomaly freedom) mathematically necessitate the proposed structure, or if viable alternatives exist that the authors have overlooked."

  ---

  ## Step 3: Unexpected Explanatory Success (UES)
  **Time:** 15 Minutes
  **Question:** Is the "success" a novel prediction or a post-diction of fitted data?
  **Contested Premise:** *Prediction vs. Accommodation.* This procedure assumes that deriving a known value counts as support only if the value was not used to tune the model's free parameters.
  **If the other side were right:** If one holds that all theory construction is retroactive, the distinction between prediction and post-diction would be ignored.
  **Information Needed:** Section deriving the "success" (e.g., coupling constants, mass ratios).
  **Sufficient Answer:** "The model yields Value X, which matches observation, using parameters fixed by independent Phenomenon Y."
  **Non-Answer:** "The model yields Value X, which matches observation," where Value X was used to set the parameters.
  **Termination (Reject):** If the explanatory success is shown to be a result of tuning free parameters to the data being explained.
  **Rejection Text:** "The explanatory success cited appears to result from fitting free parameters to existing data rather than deriving independent constraints. Without novel predictive power or independent parameter fixation, the non-empirical support is insufficient."
  **Escalation:** If the derivation appears independent of the data fit, send for review. **Instruction to Referees:** "Please assess whether the derived relation relies on parameters tuned to the data in question or fixed by independent sectors of the theory."

  ---

  ## Distinctions and Limitations

  **What Survives Simplification:**
  1.  **Viability vs. Truth:** The procedure never asks "Is this true?" It asks "Is this a viable research program?"
  2.  **Constraint vs. Choice:** It distinguishes between math forcing a result (good) and authors choosing a result (bad).

  **What is Deliberately Dropped:**
  1.  **The Meta-Inductive Argument (MIA):** I have dropped MIA as a standalone triage step. Assessing whether "this research program has a good track record" requires historical expertise you do not have and invites bias against new fields. It is subsumed into Step 2 (if the program has a track record, the structural constraints are usually well-known).
      *   *Loss:* You may reject a new field that hasn't yet built a track record but is viable.
  2.  **Degree of Confirmation:** You are not weighing how *much* the NAA supports the theory. You are checking if the argument *exists* and is *structured correctly*.

  **Failure Profile:**
  *   **False Negatives (Good papers rejected):** Radical theories that are genuinely unique but cannot yet articulate a falsifiable observable (e.g., early string theory). Theories where the "unexpected success" is subtle and looks like tuning to a non-specialist.
  *   **False Positives (Bad papers passed):** Mathematically rigid models that are structurally unique but describe a universe clearly not ours (passed Step 2, failed Step 1 but ambiguously). Models that claim independence from data but rely on hidden tuning (passed Step 3 due to technical opacity).

  **Limitations:**
  *   This procedure cannot operationalize the *strength* of a sociological claim. If the authors say "everyone has tried," you must take that at face value unless it is obviously false.
  *   This procedure cannot solve the "In-Principle" problem. If an author claims "in principle testable via black hole evaporation," you cannot verify the physics of that claim in 10 minutes. You must trust the Step 3 referral to referees.

  ---

  ## Case Runs

  ### Case 1: Cosmology Vacuum-Selection Measure
  *   **Step 0:** Research article. (Pass)
  *   **Step 1 (Empirical Horizon):** "No prediction is within reach of any funded experiment." Does it name an observable? Yes (neutrino mass ordering, cosmological constant). Is it in principle falsifiable? Yes. Is there a plausible path? No funded experiment.
      *   *Judgment Call:* The procedure requires a "plausible path." "No funded experiment" is a red flag, but "neutrino mass ordering" is measurable eventually.
      *   *Decision:* **Pass** (Weakly). The observable exists, even if the experiment is not funded.
  *   **Step 2 (NAA):** "Several groups have worked on measures for two decades without producing a competitor."
      *   *Analysis:* This is Sociological, not Structural. They do not claim math forbids other measures, only that none have been found.
      *   *Decision:* **Fail.** The NAA claim is sociological ("no one found one") not structural ("none can exist").
  *   **Step 3 (UES):** "Yields a neutrino mass ordering... which the authors say they did not design it to yield."
      *   *Analysis:* This is a strong UES claim if true.
  *   **Verdict:** **Send to Review with Instruction.**
      *   *Reasoning:* Step 2 is weak, but Step 3 is strong. The empirical horizon (Step 1) is the weak point, but not fatal. The NAA failure must be checked by referees.
      *   *Referee Instruction:* "The authors claim no alternative measures exist based on a survey of the field. Please adjudicate whether this uniqueness is a result of mathematical constraints or simply a lack of exploration. Additionally, verify if the neutrino mass prediction is independent of the measure's construction parameters."
      *   *Author Note:* "Your manuscript relies heavily on the absence of rival measures. Reviewers will be asked to verify if this absence is structural or sociological. Please ensure the independence of the neutrino prediction from the measure's tuning is explicit."

  **Uncomfortable Verdict:** This is the uncomfortable **Accept for Review**.
  *   **Why:** You know the journal was burned by a landscape-cosmology piece that drew public complaint. This paper is structurally similar (measure selection, no funded test). The procedure lets it through because the UES (neutrino mass) is specific and the observable exists in principle. You are signing off on a paper that might trigger the "ceased to practice science" complaint again. The procedure forces you to acknowledge the UES, but your gut fears the empirical deficit.

  ### Case 2: Beyond-Standard-Model (BSM) Construction
  *   **Step 0:** Research article. (Pass)
  *   **Step 1 (Empirical Horizon):** "No signature at any collider plausibly fundable within thirty years."
      *   *Analysis:* Names "collider signature" as the test. Admits 30-year gap.
      *   *Decision:* **Pass** (Weakly). In-principle testable.
  *   **Step 2 (NAA):** "No rival construction proposed so far is simultaneously anomaly-free and compatible."
      *   *Analysis:* Claims structural constraint (anomaly-free).
      *   *Decision:* **Pass.** This is a mathematical constraint, not just sociological.
  *   **Step 3 (UES):** "Derives from its structure a relation between two couplings that had previously been fitted to data."
      *   *Analysis:* This is Post-Diction. The data was known; the model was built to fit it.
      *   *Decision:* **Fail.** This violates the "Prediction vs. Accommodation" constraint.
  *   **Verdict:** **Desk Reject.**
      *   *Rejection Text:* "While the model satisfies anomaly constraints, the explanatory success cited derives from fitting known data rather than independent prediction. Without novel predictive power or a nearer-term empirical prospect, the non-empirical support is insufficient for review."
      *   *Referee Instruction:* (None required).

  ### Case 3: Perspective Submission on NEC
  *   **Step 0:** Scope Check. "Arguing that... the journal should require an empirical prospectus."
      *   *Analysis:* This is a meta-commentary on methodology/policy. It offers no positive physical model.
      *   *Decision:* **Fail.**
  *   **Verdict:** **Desk Reject.**
      *   *Rejection Text:* "This manuscript is a methodological critique rather than a research article proposing a physical model. While the concerns raised are substantive, they fall outside the scope of this journal's research section, which requires a positive theoretical or empirical contribution."
      *   *Referee Instruction:* (None required).

  ---

  ## Judgment Calls and Risks

  **Marked Judgment Calls:**
  1.  **Step 1 (Plausible Path):** Distinguishing "in-principle possible" from "science fiction" is subjective. In Case 1, I allowed "unfunded experiment" because the observable (neutrino mass) is standard physics. If it were "gravitational wave from big bang singularity," I would have rejected.
  2.  **Step 3 (Independence):** Determining if a parameter was "tuned" or "fixed" often requires reading the equations. In 15 minutes, you are guessing based on author phrasing.

  **The Uncomfortable Case:**
  **Case 1 (Cosmology)** is the uncomfortable verdict.
  *   **Why:** The procedure forces you to send it for review because the UES (neutrino mass) is specific and the NAA (anomaly/constraint) is plausible enough to warrant check. However, you know this is the exact type of paper that risks the journal's reputation for empiricism. You are prioritizing the *structure of the argument* over the *lack of data*, which feels like "ceasing to practice science" to critics, even if it is theoretically rigorous.
  *   **Why not Case 3?** Rejecting a policy paper is standard editorial work.
  *   **Why not Case 2?** Rejecting a post-dictive model is standard physics triage.
  *   **Case 1** sits in the valley between "cutting edge theory" and "untestable metaphysics." The procedure validates it, but your experience warns you.

  **What This Procedure Cannot Do:**
  1.  **It cannot protect you from the "Sociology of Alternatives."** If the authors lie about how many people have looked for alternatives, you will not catch it in 15 minutes. You are outsourcing this to the referee instruction.
  2.  **It cannot resolve the "In-Principle" dispute.** If a referee comes back and says "This is not even in-principle testable," you will have to desk-reject *after* review. This procedure minimizes that risk but cannot eliminate it.
  3.  **It cannot evaluate the Meta-Inductive Argument.** You are not assessing whether "string theory has a good track record." You are assessing whether *this paper* makes a structural claim. This means you might reject a paper that is part of a successful research program because the paper itself doesn't articulate the MIA well.

  **Final Note on Contested Premises:**
  This procedure bakes in the premise that **Explanatory Success requires Independence from Data.** This is contested by those who argue all theory is underdetermined and "fitting" is the only tool we have. If that side is right, Step 3 rejects valid work. However, for a journal trying to maintain a boundary between physics and mathematics, this premise is the necessary firewall. You are choosing the "Empirical Prospect" side of the dispute to protect the journal's classification as a science publication.
