answer: |-
  **Question 1**
  *Pressure point: The definition of affluence; concession: modern metrics of wealth are culturally biased.*
  Is affluence better defined by having much or wanting little?
  **Follow-up:** If wanting little is superior, does calling farming a catastrophe require us to value that over production?
  **Expected Answer:** "It requires us to value leisure and autonomy over mere caloric surplus."
  **Trap:** If she replies that we cannot rank such values, you note that calling something a 'catastrophe' is itself a ranking judgment.

  **Question 2**
  *Pressure point: Pre-agricultural violence; concession: agriculture did not invent brutality.*
  Does evidence from Jebel Sahaba not prove massacres predate farming?
  **Follow-up:** If violence existed before, does scaling it up justify calling the earlier period peaceful by comparison?
  **Expected Answer:** "Scale changes the nature of violence from interpersonal to systemic."
  **Trap:** If she deflects by saying evidence varies by valley, you press that her thesis relies on a general trend of declining safety.

  **Question 3**
  *Pressure point: Pre-agricultural complexity; concession: farming is not the sole cause of rank.*
  Can we have monuments and masters without grain surpluses?
  **Follow-up:** Does Göbekli Tepe suggest religion drove farming, not the other way round?
  **Expected Answer:** "It suggests ritual cohesion may have necessitated the surplus."
  **Trap:** None; this is ground for her to nuance the causality.

  **Question 4**
  *Pressure point: Agency and intent; concession: 'mistake' is metaphorical.*
  Is 'mistake' honest when no one chose this consciously?
  **Follow-up:** Does that retrospective view ignore the local benefits that drove the change?
  **Expected Answer:** "It ignores individual logic to highlight collective outcome."
  **Trap:** None; this clarifies her use of language.

  **Question 5**
  *Pressure point: Units of comparison; concession: population size matters.*
  If farming supports more people miserably, is that a failure of humanity or individuals?
  **Follow-up:** If you refuse to rank individual wellbeing across eras, can you honestly use the word catastrophe?
  **Expected Answer:** "We can measure health metrics without judging moral worth."
  **Trap:** If she refuses to rank wellbeing, you point out that 'catastrophe' implies a negative ranking of welfare.

  **Question 6**
  *Pressure point: Irreversibility; concession: we are stuck in the trap.*
  Is the trap simply that we cannot now feed fewer people?
  **Follow-up:** Do you see that same ratchet operating in modern technological dependence?
  **Expected Answer:** "Yes, we are locked into high-energy inputs."
  **Trap:** None; this extends her thesis to the present.

  **Question 7**
  *Pressure point: Generalisability; concession: the thesis might be too broad.*
  Does emphasising regional variation not weaken the claim of a universal catastrophe?
  **Follow-up:** If the trend is not universal, does the exception prove the rule or break it?
  **Expected Answer:** "The trend is general, though timing differs."
  **Trap:** If she leans heavily on variation, you note that a 'Neolithic Revolution' implies a singular shift.

  **Question 8**
  *Pressure point: Inequality versus survival; concession: inequality is the cost.*
  Is inherited inequality the price we paid for surviving famine?
  **Follow-up:** Is stability worth the cost if the poor bear the burden?
  **Expected Answer:** "Stability was purchased with the currency of stratification."
  **Trap:** None; this explores the ethical trade-off.

  **Question 9**
  *Pressure point: Modern relevance; concession: we are still in the trap.*
  Are we still paying the Neolithic debt in modern labour structures?
  **Follow-up:** If the logic remains, is there any exit besides collapse?
  **Expected Answer:** "Only a fundamental reorganisation of demand."
  **Trap:** If she says modern conditions vary by nation, you press that the structural trap is global.

  **Question 10**
  *Pressure point: Falsifiability; concession: the thesis is provisional.*
  What discovery in twenty years would make you abandon this thesis?
  **Follow-up:** Would skeletal evidence of universal health improvement suffice?
  **Expected Answer:** "Consistent evidence of better nutrition across all early sites."
  **Trap:** None; this is the closing challenge.

  ***

  **Advance Warning: The Q10 Non-Answer**
  If she evade the question, she will likely say something like: *"Science is always evolving, and we must remain open to all possibilities without setting rigid conditions."* This sounds principled but is actually a refusal to specify what evidence would count against her. If you hear this, do not let it pass; politely ask her to name just one specific type of find that would change her mind.
