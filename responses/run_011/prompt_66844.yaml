      *   **The View:** A version of Ideal Advisor Theory / Coherentist Reflective Equilibrium. Instead of specifying *what* is good (axioms), specify a *process* (deliberative procedure under ideal conditions) that converges to *what* is good (fixed point).
      *   **The Task:**
