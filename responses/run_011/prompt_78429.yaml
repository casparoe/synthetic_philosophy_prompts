answer: |-
  **Brainstorm: Boundary Problems in Democratic Theory**

  1.  **The Constitutive Problem:** You need a valid group to decide who belongs to the group.
  2.  **The All-Affected Principle:** If everyone affected should vote, the electorate expands infinitely (climate change, downstream neighbors).
  3.  **The All-Subjected Principle:** Does everyone subject to the rules vote? (Tourists, children, criminals).
  4.  **Temporal Boundaries:** Do future generations or past owners have stakes?
  5.  **Territorial vs. Personal:** Does ownership of land grant rights, or does personhood?
  6.  **Epistemic Uncertainty:** We don't know who will be affected until after the vote.
  7.  **Infinite Regress:** Every rule for inclusion requires a prior rule to validate it.
  8.  **Externalities:** Decisions impact non-voters who have no recourse.

  **Selected for Condo Packet:**
  1.  **Constitutive Problem** (Voting on voter eligibility).
  2.  **All-Affected Principle** (Herons, downstream town).
  3.  **Temporal Boundaries** (2011 owner, 2061 buyer).
  4.  **Territorial Verification** (1974 Plat Map signature).
  5.  **Infinite Regress** (Committee ratification loop).

  ***

  **OAK CREEK RETENTION VILLAS**
  **OFFICE OF THE RECORDING SECRETARY**
  **MEMORANDUM TO UNIT HOLDERS**

  **DATE:** October 14
  **RE:** Annual Meeting Packet & Eligibility Verification Protocols

  Per Section 4.1 of the Standing Rules, enclosed please find the materials for the upcoming Annual Meeting. Unit owners are advised that due to discrepancies regarding the original 1974 Plat Map—specifically the inability to verify the Developer's signature or locate living heirs—voter eligibility cannot be presumed based on deed records alone. Please review the following documents carefully.

  **AGENDA: ANNUAL MEETING**
  1. Call to Order
  2. Approval of September Minutes
  3. Vote on Proposed Bylaw Amendment 7-C (Electorate Definition)
  4. Election of Board Members
  5. Adjournment

  **MINUTES OF THE SEPTEMBER 14 MEETING**
  **Item 2: Approval of Eligibility Criteria**
  A motion was introduced to establish criteria for voting eligibility. Discussion ensued regarding Unit 202, owned by Mr. Henderson, who vacated the premises in 2011 but remains on the tax roll. Mr. Henderson (present via proxy) cast the tie-breaking vote in favor of his own eligibility. A subsequent motion to table the eligibility motion was introduced. That motion was tabled pending the formation of a sub-committee. The sub-committee formation was tabled pending the eligibility motion.

  **PROPOSED BYLAW AMENDMENT 7-C**
  **Clause 1:** The Electorate shall consist of all Unit Owners in good standing.
  **Clause 2:** "Unit Owner" is defined as any party holding title to a parcel defined by the 1974 Plat Map.
  **Clause 3:** Validity of the 1974 Plat Map requires verification by a Committee of Boundary Oversight.
  **Clause 4:** The Committee of Boundary Oversight shall be elected by the Electorate.
  **Clause 5:** In cases where the Electorate is undefined, interim eligibility shall be determined by the Committee of Boundary Oversight.

  **BALLOT QUESTION A**
  **Shall Proposed Bylaw Amendment 7-C be adopted?**
  [ ] Yes
  [ ] No
  [ ] Abstain

  *NOTE: This ballot will be counted only if the submitter has been verified as a member of the Electorate under Clause 1 of Amendment 7-C. If Amendment 7-C fails, ballots will be held in escrow pending further definition of the submitter.*

  **SIDEBAR: SCOPE OF IMPACT ANALYSIS**
  **Question:** Why can't we just let everyone affected by a decision vote on it?
  **Response:** During the Q3 special session, the Board attempted to extend the franchise to "all parties with a demonstrable interest." The resulting registry included:
  1. All current Unit Owners.
  2. The Town of Oak Creek (due to downstream drainage concerns).
  3. A prospective buyer identified in a 2061 zoning projection.
  4. The Great Blue Heron nesting pair in the retention pond.
  5. Timothy (age 9), Unit 3C, regarding noise ordinance impacts.

  The meeting was postponed after the Town Clerk noted that including the herons required environmental impact statements rather than quorum counts, and the prospective buyer could not be located to receive a ballot. Until the "Demonstrable Interest" metric is standardized, voting remains restricted to parties currently verifiable under existing, unverified bylaws.

  **NEXT STEPS**
  A Steering Committee has been formed to oversee the formation of the Committee of Boundary Oversight. Please note that the Steering Committee's formation requires ratification by the Committee of Boundary Oversight. Ratification is scheduled for the next meeting, pending the outcome of Amendment 7-C.

  Thank you for your cooperation.

  *Sincerely,*
  *Janet Miller, Recording Secretary*
