prompt: |-
  You are a formal epistemologist who has taught graduate seminars on rational disagreement for many years and who is unusually good at designing diagnostic instruments for debates. Please think carefully before writing. Begin with a short, explicitly labeled brainstorming section (no more than 250 words) in which you map the assumption space: list the background assumptions on which Aumann-style agreement results depend, and say which combinations of their denials are coherent, which are unstable, and which nobody occupies. Only then produce the deliverable.

  The context. I convene a reading group on whether two ideally rational agents can genuinely agree to disagree. The attendees range from people who have never seen the formal theorem to two engineers who work on whether separately trained prediction systems, fed the same corpus, can justifiably keep diverging outputs. I want a sorting instrument — a decision tree with a scoring key — that locates each attendee in the logical space by what they say about concrete cases, never by which label they find attractive. No question may ask whether the respondent accepts the common prior assumption, and no question may name a theorem, a paper, or a school of thought; every node must be a scenario or a plain-language question that can be answered without knowing where it leads.

  The deliverable: ten to twelve numbered questions, each with two or three answer options. Your nodes must between them probe at least these fault lines, in an order you choose: whether the space of states can be taken to be finite; whether each agent's knowledge can be represented as a partition, so that agents know what they do not know; whether the two reported probabilities are common knowledge or merely known to each other to some finite depth; whether "they told each other everything they know" is even well defined when there are propositions neither agent has conceived of; whether a prior is the sort of thing that could be rational or irrational at all; whether priors are fixed prior to any experience or are themselves shaped by experience; whether updating is strict conditionalization on evidence the agent can state as a proposition; whether credences must be precise; and whether agreement is what repeated exchange of reports would converge to rather than what the agents currently report. At least two questions must concern non-human agents — for instance, two prediction systems trained on the same data but with different architectures — where the respondent must judge whether "same evidence" is determinate at all.

  Requirements on the leaves: at least nine, and they must include (a) the view that the description is impossible as stated, so the case has been misdescribed; (b) the view that a common prior is a harmless modeling convention with no epistemological upshot; (c) the view that heterogeneous priors are rationally permissible; (d) the view that what looks like a difference in priors is really a difference in experience; (e) the escape through ambiguity or imprecise credence; (f) the escape through unawareness; (g) the escape through mutual knowledge falling short of common knowledge; (h) the escape through infinite state spaces or the failure of countable additivity; and (i) the dynamical view on which the pair would converge under continued exchange of reports, so the case as posed is unstable. Give each leaf a short descriptive name — attach a standard label only where you are confident of it, and never invent an attribution — one sentence on its most awkward commitment, and one sentence of "result card" telling the respondent what accepting it commits them to.

  Then: flag every pair of leaves your questions cannot reliably separate, and say why they collapse. List any cells of the logical space left unoccupied, diagnosing each as incoherent, unattractive, or merely unexplored. Close with a short consistency audit naming at least two answer patterns that are jointly unstable — treating disagreement as rational while also holding that a full exchange of evidence compels convergence is the obvious one — and stating precisely which assumption the respondent must give up to become coherent.

  Include no bibliography, reading list, or citations; nothing here should require looking anything up. Present the scoring key as a table mapping answer strings onto leaves, formatted so I can print it as a handout. Target roughly 1,200–1,600 words.
