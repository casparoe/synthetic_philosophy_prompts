answer: |-
  Dear Colleague,

  It is a rare pleasure to welcome a practitioner of your stature into our philosophical debates, and your specific focus on modular organisms offers a concrete grounding that our field often lacks. However, the room you are entering is fraught with specific ideological commitments, and your thesis that the unit of selection is relative to a timescale constrained by biological schedules will be tested vigorously. To survive the question period, you must manage your opening carefully. In the first five minutes, you should concede that the Price equation is mathematically sufficient to partition variance without ontological commitment, and you should acknowledge that multilevel selection explanations are often pragmatically useful. By granting the population geneticist their math and the multilevel selection defender their explanatory utility, you disarm the accusation that you are ignoring existing tools. You must frame your project not as replacing these tools, but as clarifying the biological conditions under which a specific partition becomes causally meaningful rather than merely statistical. This buys you credibility as a collaborator rather than a critic.

  The most damaging objection will come from the population geneticist, who will likely interrupt with something like, Fitness is just a regression coefficient in the Price equation, so why do you need a principled boundary? If the math partitions the variance correctly, your worry about reproductive episodes is just metaphysical hand-wringing that changes no predictions. Your reply should be that while the math handles variance, it does not identify the cause. A statistical partition can be drawn anywhere, but evolution requires a mechanism of transmission. If we cannot anchor the timescale to a biological event like fragmentation or gamete release, we are fitting curves to noise rather than describing a lineage. You must insist that without the biological anchor, the fitness value is real mathematically but empty biologically. You must be aware, however, that this reply is soft because it relies on a distinction between prediction and explanation that many geneticists reject. If your timescale relativity does not yield different predictions than a standard genetic model, they will dismiss your constraint as superfluous.

  The second most damaging challenge will come from the senior figure defending the replicator–interactor framework, who will ask, If the unit is relative to a timescale chosen by the observer, how is this not just conventionalism by another name? You claim it is constrained, but who decides which constraint matters, the growth rate or the fragmentation event? If you cannot specify the rule for choosing the timescale without circularity, you are just saying it depends on what you want to explain. Your reply must be that the constraint is not chosen by the observer but imposed by the organism's physiology. In a bryozoan, fragmentation is a discrete physical event that resets the transmission clock, unlike an arbitrary cut in time made by a theorist. The choice is not free because the biology limits the viable timescales to those where transmission actually occurs. The soft spot here is that modular organisms often fragment continuously or irregularly. If you cannot define a threshold for what counts as a significant fragmentation event versus mere damage, the objection that you are smuggling in conventionality will stick.

  Next, the senior figure who supports multilevel selection will press you by saying, You say this is not trait-group pluralism, but if selection operates at several levels, why not just admit that fitness is real at all levels simultaneously? Your timescale relativity sounds like a redescription of the fact that we can choose different explanatory aims. Your reply should be that pluralism suggests all levels are equally real regardless of context, whereas your view holds that only one level is dominant relative to the transmission timescale being actualized. When a colony fragments, the fragment becomes the unit; when it releases gametes, the zooid might be the unit. It is not that both are true at once, but that the biological schedule dictates which unit is currently engaged in transmission. This reply is soft because it risks splitting hairs. If the biological schedule allows for overlapping transmission events, such as budding while releasing gametes, your claim that one unit is relative to the timescale may collapse back into the pluralism you wish to avoid.

  The graduate students working on microbial consortia will likely ask, Your examples are all bryozoans and seagrass, but microbes exchange genes horizontally without clear growth schedules. Is your theory just for big modular animals, or does it claim to be general? If it does not apply to microbes, is it really a solution to the units question? You should reply that horizontal gene transfer is simply a different transmission schedule with a different timescale, and the principle remains that the unit is relative to that transfer event. The constraint is still the biological event of transfer, even if it is not reproduction in the classic sense. The soft spot is that your entire framework is built on the intuition of colonial growth and fragmentation. Stretching it to cover horizontal gene transfer might dilute the specific biological constraints you rely on, making the theory so broad it loses its bite.

  There is one reply that must land if your talk is to survive, and it is the distinction between free convention and biological constraint. You must convince them that while the observer chooses the timescale, the menu of available timescales is written by the organism, not the theorist. If you fail to establish that the biology constrains the philosophy, you will be dismissed as a conventionalist. Conversely, there is one question you should most hope nobody asks, which is likely to come from the replicator–interactor defender. They may ask, If the unit is relative to the timescale, how do you calculate the response to selection across generations? If the unit changes from fragment to zooid depending on the season, what is the inheritable variance over the long term? This question threatens to expose a lack of formal rigor in your proposal. If you cannot show how relative units aggregate into a long-term evolutionary trajectory, you may be forced to concede that your framework is descriptive rather than predictive. Stick to your expertise on the biological schedules, concede the mathematical heavy lifting to the geneticists, and insist that your work is to ensure their math is anchored in the reality of the organism's life cycle. Good luck.
