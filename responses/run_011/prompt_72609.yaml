answer: |-
  Here is the procedure. It is grounded in a hybrid metaphysics: **Kripkean/Putnamian essentialism** for objects, kinds, and secondary characters, and **Haecceitism (Primitive This-ness)** for the protagonist. This is the only configuration that satisfies your editor's demand for logical rigor while preserving your novel's central premise.

  ### 1. The Cross-Branch Identity Tests

  Apply these tests in order to any sentence asserting identity across branches (e.g., "She is the same woman here as there").

  **Test 1: The Causal Chain of Names (Mechanical)**
  *   **Question:** Is the name used in this sentence linked by an unbroken historical chain of usage to the original baptism/labeling event in *this* branch?
  *   **Pass:** The chain is unbroken, even if the bearer is absent or an imposter.
  *   **Fail:** The chain is broken or restarted.
  *   **Action:** If Fail, you cannot use the name to assert identity. You must use a description (e.g., "the man standing in the mayor's office" vs. "the Mayor").
  *   **Verdict:** **Rewrite.** Names rigidly designate their original bearers. If the bearer changes, the name refers to the ghost of the original, not the new body.

  **Test 2: The Essential Property Check (Mechanical)**
  *   **Question:** Does the sentence assert that a natural kind (mineral, water, fire) or a biological origin (parents) is identical across branches where the text establishes they are physically different?
  *   **Pass:** The sentence acknowledges the difference as a divergence in *world-state*, not a sameness of *stuff*.
  *   **Fail:** The sentence claims "This is the same mineral" despite different atomic composition, or "These are her parents" despite different biological vectors.
  *   **Action:** If Fail regarding Minerals/Kinds: **Cut.** (See Section 3). If Fail regarding Parents: **Keep only if** framed as Haecceity (See Section 6).
  *   **Verdict:** **Cut** for Kinds. **Judgment Call** for Persons.

  **Test 3: The Haecceity Anchor (Judgment Call)**
  *   **Question:** For the protagonist only: Does the narration treat her "self" as a primitive constant that survives the loss of biological origins?
  *   **Pass:** The prose emphasizes her continuity of consciousness, memory, or "this-ness" despite the biological divergence.
  *   **Fail:** The prose treats her as merely a biological product of her parents.
  *   **Action:** If Fail, the editor is right: she is a different person.
  *   **Verdict:** **Rewrite.** You must shift the language from biological determinism to psychological/narrative continuity to justify the Haecceitist stance.

  **Test 4: The Empty Reference Check (Mechanical)**
  *   **Question:** In the branch where she is never born, does the pronoun "she" refer to a biological entity or an abstract object (a memory, a story, a gap)?
  *   **Pass:** It refers to an abstract object (the *idea* of her).
  *   **Fail:** It implies biological existence.
  *   **Action:** If Fail, **Rewrite.** You cannot refer to a non-existent biological human as existing. You can only refer to the *concept* of her.
  *   **Verdict:** **Rewrite.**

  ### 2. The Identification Rule (Fixing Reference vs. Asserting Identity)

  You must distinguish between **fixing the reference** of a name and **asserting the identity** of the bearer.

  *   **The Rule:** A description (e.g., "the woman who lives at 4 Elm") fixes the reference for the reader in that branch. A name (e.g., "Alice") rigidly designates the individual across branches.
  *   **How to Spot the Difference in Prose:**
      *   If the sentence can be negated without contradiction ("Alice might not have lived at 4 Elm"), it is a **contingent description**. Keep it.
      *   If the sentence asserts the core identity ("Alice is the daughter of X"), and X changes branches, it is an **identity assertion**.
  *   **The Fix:** When origins change, switch from identity assertions to reference-fixing descriptions.
      *   *Forbidden:* "She was born to Mary in 1940." (False in 4 branches).
      *   *Permitted:* "She, the one we call Alice, occupied the space Mary's daughter would have." (True in all branches).

  ### 3. Kind Terms and Artifacts (The Putnam Rule)

  *   **The Rule:** Natural kind terms (the mineral) refer to the underlying microstructure, not the superficial properties. If the composition changes, it is **not the same kind**.
  *   **The Procedure:**
      1.  Identify the term (e.g., "Iron," "Quartz").
      2.  Check the composition in Branch A vs. Branch B.
      3.  If Composition A ≠ Composition B, you cannot claim "This is Iron" in both.
  *   **Where it Comes Apart from Persons:** You are allowed to treat the Person as a Haecceity (Section 1, Test 3). You are **not** allowed to treat the Mineral as a Haecceity. The mineral has no "soul" or "this-ness" independent of its chemistry.
  *   **The Constraint:** In the two branches where the mineral's composition differs, the town must be **wrong** about the name. The narration must acknowledge it is a *different* substance that the town *calls* by the old name.

  ### 4. The Non-Existent Branch

  *   **The Verdict:** The narration is talking about **an Abstract Artifact**.
  *   **The Reasoning:** In a world where she is never born, there is no biological referent. However, the narration exists. Therefore, "she" refers to the *character* as an object of thought within that world's narrative space, or a "gap" in the world's history.
  *   **The Choice:** You must choose **Abstract Artifact**.
  *   **Implementation:** The narration cannot say "She walked down the street." It must say "The story of her walking down the street remained," or "The space she would have occupied was empty." If you use the past tense ("She was..."), it must be the past tense of a *concept*, not a *life*.
      *   *Correction:* You stated the narration refers to her in the past tense regardless. To make this coherent, the narration in that branch must be understood as a **counterfactual history** being read by someone in that branch, or a **ghost narrative**.
      *   *Recommendation:* Treat the narration in that branch as a **record of a possibility that did not actualize**. "She" is the subject of a subjunctive history.

  ### 5. The One-Page Legend (For Editor & Copy Desk)

  **Cross-Branch Consistency Protocol**

  1.  **Names:** Does the name trace back to the same original naming event?
      *   *Yes:* Keep.
      *   *No:* Change to description (e.g., "the man in the office").
  2.  **Minerals/Kinds:** Is the chemical composition identical?
      *   *Yes:* Keep kind term (e.g., "Gold").
      *   *No:* Change to "The substance they called Gold."
  3.  **Protagonist:** Is the "self" treated as continuous despite biological changes?
      *   *Yes:* Keep identity claims.
      *   *No:* Revise to emphasize psychological continuity over biology.
  4.  **Non-Existence:** Does the branch acknowledge she is a concept/memory?
      *   *Yes:* Keep.
      *   *No:* Revise to remove biological implication.
  5.  **Imposter:** Does the text distinguish between the Name (original) and the Body (current)?
      *   *Yes:* Keep.
      *   *No:* Clarify that the Name refers to the absent original.

  ### 6. The Handoff (Where Logic Ends and Art Begins)

  The procedure hands the decision back to you at **Test 3 (Haecceity Anchor)**.
  *   **The Matter:** Philosophy cannot prove that a person with different parents is the "same" person. This is a **stipulation of the fiction**.
  *   **Your Burden:** You must write the prose such that the reader *feels* the continuity of the "self" strongly enough to override the biological discontinuity. The procedure validates the *logic* of the claim, but your prose must validate the *experience* of it.
  *   **The Cost:** You are committing to a metaphysics where "Personhood" is a narrative primitive, not a biological fact. If the prose wavers, the editor's objection stands.

  ---

  ### Case Studies: Running the Procedure

  #### Case 1: The Four Branches (Mother Dies 1946 / Raised by Strangers)
  *   **Claim:** "She is the same woman in each branch."
  *   **Test 1 (Names):** Pass. The name "Alice" is rigidly designated by you, the author, across the multiverse.
  *   **Test 2 (Essential Property):** **Fail.** Biologically, different parents = different organism (Kripke).
  *   **Test 3 (Haecceity):** **Judgment Call.**
  *   **Working:** You cannot claim she is the same *biological organism*. You must claim she is the same *transworld individual*.
  *   **Revision:** Scan for biological determinism.
      *   *Cut:* "She had her mother's eyes." (False in 4 branches).
      *   *Keep:* "She felt the same grief she always felt." (Psychological continuity).
      *   *Verdict:* The claim is permitted **only if** you strip away biological essentialism. The "Same Woman" claim is a narrative stipulation, not a biological fact. You must signal this in the prose.

  #### Case 2: The Three Branches (The Imposter Man)
  *   **Claim:** "She has known him all her life and never once met him."
  *   **Test 1 (Causal Chain):** Pass. The name refers to the original man (the one she knew).
  *   **Test 2 (Identity):** Pass. The body is the imposter.
  *   **Working:** This sentence is **philosophically sound** under the Causal Theory of Reference. The name "Him" rigidly designates the original man. The description "the man standing before her" designates the imposter.
  *   **Verdict:** **Keep.** This is the strongest part of your structure. It relies on the gap between *reference* (the name) and *satisfaction* (the description). The sentence exploits this gap perfectly. It asserts she knows the *referent* (the original) but has never met the *satisfier of the current description* (the imposter).

  #### Case 3: The Two Branches (The Mineral Composition)
  *   **Claim:** "The town's wealth was built on [Mineral X]."
  *   **Test 1 (Kind Terms):** **Fail.** If composition differs, it is not [Mineral X] (Putnam).
  *   **Working:** You cannot say "It was [Mineral X]." You must say "It was what they *believed* to be [Mineral X]."
  *   **Revision:**
      *   *Forbidden:* "The mine yielded copper." (If it's actually zinc).
      *   *Permitted:* "The mine yielded the red metal they called copper."
      *   *Verdict:** **Rewrite.** The town is mistaken. The narration must not share the town's mistake unless the narration is also localized to that branch's ignorance. If the narration is omniscient, it must state the composition difference.

  ---

  ### The Negative Verdict (A Claim You Must Cut)

  **The Claim:** "In every branch, the mineral was the blood of the earth."
  **The Verdict:** **FORBIDDEN.**
  **The Reason:** This is a metaphor that asserts an essential identity ("blood of the earth" implies a specific ontological status). If the composition changes, the *nature* of the substance changes. Under Putnam's rule, if the microstructure changes, the kind changes. You cannot claim it is the *same* "blood of the earth" if the chemistry is fundamentally different.
  **The Fix:** "In every branch, the mineral was *treated* as the blood of the earth." You must move the sameness from the *object* to the *social reaction* to the object. The procedure forbids ontological sameness here; it only permits sociological sameness.

  ---

  ### Limits and Honesty

  1.  **The Person Loophole:** This procedure commits you to **Haecceitism** for the protagonist but **Essentialism** for everyone else. This is a metaphysical inconsistency. You are treating the protagonist as a "soul" and everyone else as "meat." If your editor digs into *why* the protagonist gets a pass while the mineral does not, you have no philosophical defense other than "Narrative Necessity."
  2.  **Prose Misfire:** The procedure works for assertion. It will misfire on **lyrical or ambiguous prose**. If you write "She was the winter," the tests cannot process this. You will need to manually flag metaphorical identity claims as exempt from Test 2.
  3.  **The Non-Existent Branch:** Treating "She" as an Abstract Artifact in the branch where she isn't born creates a tonal shift. The narration becomes meta-fictional in that branch only. This may feel like a genre break to the reader.
  4.  **The Coherence Warning:** If you refuse the Haecceity stipulation (Test 3), the premise is incoherent. Under strict Kripkean semantics, **different origins = different person**. If you want strict metaphysical coherence without the Haecceity loophole, you must make the structural change: **The protagonist must have the same parents in all eleven branches.** The divergence must happen *after* birth. If you cannot change the plot, you must defend the Haecceity stipulation as a feature of the novel's specific logic, not universal truth.

  **Final Instruction:** Apply the Legend. Where the Legend says "Rewrite," do not argue. The editor is using standard analytic philosophy; if you submit text that violates these rules without the specific linguistic markers (e.g., "what they called," "the one who remained"), they will reject it as error, not design. Mark the exceptions.
