prompt: |-
  I work part time on the patient-communications side of a hospital genetics clinic — basically I write the plain-language text that goes out with test results — and there's a fight brewing that I'm suposed to have settled by Friday. We're rolling out one new template that has to cover three very different kinds of result: a pharmacogenomics variant that changes how someone metabolizes a common blood thinner, a variant in a breast cancer gene, and a polygenic risk score for type 2 diabetes. The medical director wants a single consistent voice across all three. Our resident philosopher-in-training — a nurse with a masters in bioethics who reads way more than her job requires — won't sign off on any of it. Her objection is to the words carries information about, instructions for, and codes for. Her position is that DNA doesn't carry or code anything, it's a molecule that a cell gets used by, and that talking about a code quietly assumes the trait was sitting there the whole time waiting to be read out, which she thinks is precisely the picture that makes patients react to results so badly. The director thinks the opposite: that the informational talk isn't a metaphor at all but a plain description of what a sequence actually does, since the sequence makes a specific difference to what gets built, and calling that a code is no more figurative than calling a dial on a thermostat a setting. He also says if we strip the word information out of everything we'll look like we're hiding the science.

  What I can't put my finger on is that neither of them seems to notice the three results aren't the same sort of thing, and I have a feeling that's where the whole argument actually lives, but every time I try to say it out loud I get steamrolled by one of the two speeches above. For the blood thinner result the chain from sequence to how a drug gets handled is pretty short and pretty reliable. For the breast cancer one we're reporting a lifetime percentage, and I honestly don't know what it would mean to say a stretch of sequence codes for a number like that. And the polygenic score is something we compute from thousands of spots in the genome plus a bunch of assumptions about which reference population we're comparing you to, which feels nothing like receiving a message and everything like being placed on a curve.

  So: which of my two colleagues is closer to right, or is this actually three separate arguments wearing a trenchcoat and pretending to be one? Tell me what the word information is doing in each of the three cases and whether it's doing the same work in all of them, or whether one of them survives the nurse's objection and the others don't. Then, because I do have to ship something, give me the strongest phrasing I can honestly defend for each of the three results — plain English, no hedging mush that reads like a legal disclaimer — plus one or two sentences I can hand the director explaining why a maximally consistent template would have to be wrong about at least one of them. No reading list, I just want the reasoning and the wording.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Situation:**
      *   **User Role:** Part-time writer for patient communications in a hospital genetics clinic.
      *   **Task:** Write plain-language text for test results.
      *   **Deadline:** Friday (urgent).
      *   **Conflict:** Medical Director vs. Nurse/Bioethicist.
      *   **The Conflict:**
          *   *Director:* Wants "informational" language (codes for, instructions, carries information). Believes it's scientifically accurate and transparent. Wants one consistent voice/template.
          *   *Nurse:* Objects to "informational" language (DNA is just a molecule, "code" implies pre-determinism/fatalism which harms patients). Believes it's philosophically misleading.
      *   **User's Insight:** The three test types (Pharmacogenomics, Monogenic Cancer Risk, Polygenic Risk Score) are fundamentally different, and the "one template" approach is the root problem.
      *   **Request:**
          1.  Determine who is closer to right (or if it's three separate arguments).
          2.  Analyze what "information" means in each of the three cases.
          3.  Provide strongest defensible phrasing for each result (plain English, no hedging).
          4.  Provide 1-2 sentences for the Director explaining why a single template is wrong.
          5.  Constraint: No reading list, just reasoning and wording.

  2.  **Deconstruct the Science & Philosophy:**
      *   **The Core Question:** Is DNA "information"?
      *   **Philosophical Context:** This is the "central dogma" vs. "developmental systems theory" debate.
          *   *Director's View:* Central Dogma/Informational View. DNA $\rightarrow$ RNA $\rightarrow$ Protein. Sequence determines function. Metaphor: Blueprint/Code.
          *   *Nurse's View:* Developmental/Contextual View. DNA is a resource used by the cell. Phenotype emerges from interaction. Metaphor: Ingredient/Tool. Fear: Genetic Determinism.
      *   **The Three Test Types:**
          1.  **Pharmacogenomics (PGx) - Blood Thinner (e.g., Warfarin/Clopidogrel + CYP enzymes):**
              *   *Mechanism:* Specific variant $\rightarrow$ Specific enzyme activity level $\rightarrow$ Specific drug metabolism rate.
              *   *Determinism:* High. The biochemical pathway is direct.
              *   *Information Status:* "Code" works well here. The sequence *does* instruct the enzyme structure which *does* dictate function.
              *   *Verdict:* Director is closer here.
          2.  **Monogenic Cancer Risk (e.g., BRCA1/2):**
              *   *Mechanism:* Variant $\rightarrow$ Loss of tumor suppressor function $\rightarrow$ Increased probability of cancer over lifetime.
              *   *Determinism:* Moderate/Probabilistic. Having the variant doesn't guarantee cancer (penetrance is incomplete).
              *   *Information Status:* "Code" is tricky. It codes for a broken protein, but it doesn't "code for cancer." It codes for *susceptibility*.
              *   *Verdict:* Middle ground. "Information about risk" is okay, "Instructions for cancer" is wrong.
          3.  **Polygenic Risk Score (PRS) - Type 2 Diabetes:**
              *   *Mechanism:* Thousands of variants + statistical weighting + reference population $\rightarrow$ Relative risk score.
              *   *Determinism:* Low/Statistical. It's a comparison, not a mechanism.
              *   *Information Status:* "Code" is misleading. The genome isn't "coding" for a score. The *lab* is computing a score *based on* the genome. It's a statistical artifact, not a biological instruction.
              *   *Verdict:* Nurse is closer here. Calling this "information encoded in DNA" is scientifically shaky.

  3.  **Synthesize the "Three Arguments in a Trenchcoat" Theory:**
      *   The user is right. The Director wants ontological consistency (DNA is always information). The Nurse wants ethical consistency (Language shouldn't cause harm). But the *science* isn't consistent across the three tests.
      *   PGx is mechanistic (Instructional).
      *   Monogenic is probabilistic mechanistic (Dispositional).
      *   PRS is statistical (Comparative).
      *   Forcing one linguistic frame onto all three forces a lie in at least two cases.

  4.  **Drafting the Analysis (Mental or Scratchpad):**
      *   *Who is right?* Both and neither. It depends on the test.
      *   *PGx:* "Instructions" is fine. It's biochemistry.
      *   *BRCA:* "Information about risk" is fine. "Instructions for cancer" is fatalistic and wrong.
      *   *PRS:* "Comparison" or "Profile." Not "Code." The DNA doesn't hold the score; the algorithm does.
      *   *The "Information" Word:*
          *   PGx: Causal information.
          *   BRCA: Probabilistic information.
          *   PRS: Statistical information (about the population, mapped to the individual).

  5.  **Drafting the Phrasing (Plain English, No Hedging):**
      *   *Constraint:* Must be strong, clear, but accurate.
      *   *PGx:* Focus on the enzyme. "Your genes change how your body processes the drug."
      *   *BRCA:* Focus on the chance. "This change raises your likelihood," not "This causes cancer."
      *   *PRS:* Focus on the comparison. "Your genetic profile places you in a higher/lower group compared to others."

  6.  **Drafting the Director's Explanation:**
      *   Needs to be punchy. 1-2 sentences.
      *   Argument: Consistency in voice shouldn't override accuracy in mechanism.
      *   Draft: "A single template forces us to describe a statistical calculation (PRS) as a biological instruction (PGx), which is scientifically inaccurate. We can keep a consistent *tone* without using a consistent *mechanism* that doesn't exist across all three tests."

  7.  **Refining the Output (incorporating the Nurse's ethical concern):**
      *   The Nurse is worried about *determinism*. Even if PGx is mechanistic, we don't want to sound like robots.
      *   The Director is worried about *hiding science*. We don't want to sound like magic.
      *   Solution: Use "mechanism" language where mechanism exists (PGx), and "probability/statistic" language where that exists (PRS). This satisfies the Director (accuracy) and the Nurse (no false determinism).

  8.  **Final Review against Constraints:**
      *   No reading list? Check.
      *   Reasoning + Wording? Check.
      *   Address all three test types? Check.
      *   Address the Director/Nurse conflict? Check.
      *   Deadline pressure acknowledged (keep it actionable)? Check.

  9.  **Polishing the Wording:**
      *   *PGx:* "Your genetic result tells us how quickly your body breaks down [Drug]." (Direct, mechanistic).
      *   *BRCA:* "This variant weakens your cells' ability to repair DNA, which increases your lifetime chance of breast cancer." (Explains mechanism without guaranteeing outcome).
      *   *PRS:* "We compared thousands of genetic markers in your DNA to population data to calculate your relative risk for type 2 diabetes." (Acknowledges the computation/comparison).
      *   *Director Note:* "Using one mechanical definition of 'information' across all three tests forces us to misrepresent the science of the polygenic score as a direct instruction. We can maintain a consistent *tone* of clarity without enforcing a consistent *mechanism* that only applies to one of the three tests."

  10. **Final Logic Check:** Does this solve the user's problem? Yes, it validates their intuition (it's three arguments), gives them the ammo to stop the fight, and provides the text they need to ship. It bridges the gap by showing that *accuracy* satisfies both the Director (science) and the Nurse (no false determinism).

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm taking the Nurse's side entirely. The Director is right about PGx. I need to emphasize that the *variation* in language is what makes it scientifically accurate, which ultimately serves the Director's goal of not hiding science.

      *(Refining the "Information" analysis)*:
      *   PGx: Information = Causal Mechanism.
      *   BRCA: Information = Disposition/Propensity.
      *   PRS: Information = Statistical Location.

