  ### Scenario

  Consider *Silene vulgaris* growing on ancient copper mines. The trait is a specific isoform of metallothionein (MT-iso2). Ancestrally, MT-iso2 evolved to buffer zinc fluctuations in non-contaminated soils (Selected Effect). The population now inhabits a stable, zinc-poor environment where zinc buffering is physiologically idle. However, MT-iso2 promiscuously binds excess copper, preventing cellular necrosis (Causal Role). The trait persists not because copper binding boosts fitness (selection is neutral here due to drift in a small population), but because the gene is tightly linked to a vital developmental locus. A conservation geneticist must annotate the gene's function in a database to prioritize knockout targets for remediation testing. They must choose between the ancestral capacity (zinc) and the current capacity (copper). The containing system could be the individual cell (homeostasis) or the whole organism (survival).

  ### Demonstration

  **Definitions**
  *   **Selected-Effects (SE):** A trait's function is the effect for which it was historically selected (Wright/Neander).
  *   **Causal-Role (CR):** A trait's function is any current causal contribution to a capacity of a containing system (Cummins).

  **Verdicts**
  *   **SE:** Function = Zinc buffering. The trait exists *because* of ancestral zinc selection. Current copper binding is incidental. **Decision:** Annotate "Zinc Binding"; Knockout is safe (zinc absent).
  *   **CR:** Function = Copper buffering. The trait currently contributes to cellular integrity (containing system = cell). **Decision:** Annotate "Copper Binding"; Knockout is lethal (necrosis).

  **Key Feature**
  The decoupling of *historical selection pressure* from *current causal utility*, maintained by genetic linkage rather than current fitness benefits.

  **Removal Tests**
  *   **(a) Reintroduce selection on copper:** If copper binding becomes the driver of fixation, the SE account updates the function to copper. **Collapses** the disagreement; both theories converge on "Copper."
  *   **(b) Restore ancestral zinc conditions:** The SE verdict remains "Zinc." The CR verdict likely shifts to "Zinc" (as it is now the active contribution). **Collapses the verdict** but **sharpens the theoretical divide**: the SE theorist grounds the function in *history* ("it is zinc because it was selected for zinc"), while the CR theorist grounds it in *current capacity* ("it is zinc because it does zinc now"). The agreement is extensional, but the explanation remains opposed.

  **Replies & Verdict**
  *   **SE Reply:** The "Modern History" move (Godfrey-Smith) attempts to capture recent selection, but fails here due to drift. The SE theorist insists function explains *presence*, not just *performance*.
  *   **CR Reply:** "Interest Relativity." Function depends on which capacity we aim to explain (survival vs. ancestry).
  *   **Verdict:** The dispute is **not merely verbal**. It yields divergent empirical predictions (knockout survival) and explanatory goals (etiology vs. mechanism).
  *   **Residue:** Even if verdicts align (Test b), the *reason* for the ascription differs: one looks backward to selection, the other sideways to system capacity.

  **Biology Flag**
  *   **Real:** Metallothionein promiscuity (binding multiple metals) is well-documented. *Silene vulgaris* populations on mine tailings are real.
  *   **Stipulated:** The specific linkage drift maintaining the isoform without current selection is plausible population genetics but specific to this hypothetical scenario. Verify linkage strength in *Silene* genomes.
