answer: |-
  # Exam Question: Bayesian Epistemology (Final)

  **Question 4 (25 Marks)**
  **Time Allocation:** Approx. 75 minutes

  **The Problem of Old Evidence: Wegener's Drift**

  In 1912, Alfred Wegener proposed the hypothesis of Continental Drift ($H$). A key piece of evidence he cited was the jigsaw-puzzle fit of the South American and African coastlines ($E$). This fit had been observed by mapmakers for centuries; it was "old evidence." Decades later, the discovery of magnetic striping on the ocean floor ($E_{new}$) provided novel support for the mechanism of seafloor spreading.

  Assume a Bayesian agent assessing Wegener's hypothesis in 1915.

  **(a)** Suppose the agent assigns the following credences:
  *   $P(H) = 0.05$
  *   $P(E) = 0.99$ (The fit is virtually certain)
  *   $P(E | H) = 0.98$ (Drift makes the fit very likely)

  Calculate the posterior $P(H | E)$ and the confirmation ratio ($P(H | E) / P(H)$). Show your working. In 2–3 sentences, explain what this specific numerical result implies about the confirmatory power of $E$ under these stipulations. **[8 marks]**

  **(b)** Now suppose a more careful geologist in 1915 is less certain about the coastline data due to erosion and mapping errors, assigning $P(E) = 0.90$. Keep $P(H)$ and $P(E | H)$ the same. Recalculate the posterior. Briefly explain why the change in $P(E)$ alters the confirmatory status of $E$, referencing the relationship between $P(E)$ and $P(E | H)$. **[5 marks]**

  **(c)** Consider the Garber-style solution: the agent does not learn $E$ (which is already known), but learns the logical proposition that $H$ entails $E$ ($H \vdash E$). For this move to generate confirmation where standard conditionalization fails, what must be true of the agent's prior credence in the entailment claim? Furthermore, explain why this solution struggles when the hypothesis space itself is growing (i.e., when $H$ is a new conceptual construction rather than a pre-existing option). **[7 marks]**

  **(d)** Does the later success of the theory regarding magnetic striping ($E_{new}$) retroactively license treating the coastline fit ($E$) as confirming evidence for $H$ in 1915? Answer 'yes' or 'no' and provide a principled Bayesian justification for your position (do not appeal to hindsight bias or "it turned out true"). **[5 marks]**

  ***

  # Model Answer

  **(a)**
  Using Bayes' Theorem:
  $$P(H | E) = \frac{P(E | H)P(H)}{P(E)} = \frac{0.98 \times 0.05}{0.99} = \frac{0.049}{0.99} \approx 0.0495$$
  The confirmation ratio is $0.0495 / 0.05 = 0.99$.
  The posterior is *lower* than the prior; $E$ slightly disconfirms $H$. This occurs because $P(E)$ is higher than $P(E | H)$. For $E$ to confirm $H$, $H$ must make $E$ more probable than $E$ is on its own. Here, the agent is already more certain of the fit than the theory predicts the fit should be. The likelihood ratio is working against the hypothesis.

  **(b)**
  Recalculating with $P(E) = 0.90$:
  $$P(H | E) = \frac{0.98 \times 0.05}{0.90} = \frac{0.049}{0.90} \approx 0.0544$$
  The confirmation ratio is $1.088$. Here, $E$ confirms $H$.
  The change occurs because $P(E)$ is now lower than $P(E | H)$. When old evidence is not treated as a certainty ($P(E) < 1$), there is "room" for the hypothesis to boost its probability. The confirmatory power depends on the likelihood ratio $P(E|H)/P(E|\neg H)$; by lowering $P(E)$, we implicitly lower $P(E|\neg H)$, allowing $H$ to outperform the null expectation.

  **(c)**
  For the Garber move to work, the agent must assign $P(H \vdash E) < 1$. If the agent is logically omniscient, $P(H \vdash E) = 1$ always, and learning it changes nothing. Confirmation arises from conditionalizing on the *new* proposition that the entailment holds.
  However, this relocates the problem to the priors: where does the uncertainty over a logical relation come from? More critically, in the Wegener case, $H$ (Continental Drift) was not a pre-existing hypothesis in the agent's space. It was a new conceptual construction. Standard Bayesianism assumes a fixed partition of possibilities. If $H$ did not exist in the space in 1910, there is no prior $P(H)$ or $P(H \vdash E)$ to update. The Garber solution handles forgotten logic, not conceptual innovation.

  **(d)**
  No. Bayesian conditionalization is synchronic. The posterior $P(H | E)$ in 1915 is determined by the credences held in 1915. Later evidence $E_{new}$ updates the credence in $H$ at time $t_2$, but it does not rewrite the probabilistic relationship between $H$ and $E$ at $t_1$.
  Principled basis: $E_{new}$ confirms the *mechanism* (seafloor spreading) which explains *why* $P(E | H)$ is high. It validates the likelihood assignment retrospectively, but it does not change the fact that $E$ was old. To treat $E$ as confirming based on $E_{new}$ is to conflate the confirmation of the theory with the epistemic status of the evidence at the time of proposal.

  ***

  # Marking Scheme (25 Marks)

  **Part (a): The Trap (8 Marks)**
  *   **Calculation (3 marks):** Correct posterior ($\approx 0.0495$). Deduct 2 marks for arithmetic errors.
  *   **Directionality (3 marks):** **Crucial.** Student must explicitly state that $P(H|E) < P(H)$ (Disconfirmation).
      *   *0 marks:* If they calculate 0.0495 and say "It shows weak confirmation" or ignore the direction.
      *   *3 marks:* Explicitly notes disconfirmation.
  *   **Analysis (2 marks):** Must identify that $P(E) > P(E|H)$ drives this. Ideally, they calculate implied $P(E|\neg H) \approx 0.9905$ to show the likelihood ratio is $< 1$.
      *   *A-Grade Move:* Notes that when $P(E) \approx 1$, it is mathematically difficult for $P(E|H)$ to exceed it, rendering $E$ inert or hostile.
      *   *B-Grade Move:* Reports the number correctly but treats it as a negligible change rather than a structural feature of the priors.

  **Part (b): Uncertainty in Evidence (5 Marks)**
  *   **Calculation (2 marks):** Correct posterior ($\approx 0.0544$).
  *   **Explanation (3 marks):** Must link the shift to the relationship between $P(E)$ and $P(E|H)$.
      *   *Key phrase:* "Room for confirmation" or "Likelihood exceeds marginal probability."
      *   *Penalty:* If they simply say "Lowering P(E) helps" without explaining the inequality required for confirmation ($P(E|H) > P(E)$).

  **Part (c): Garber & Logical Omniscience (7 Marks)**
  *   **Prior on Entailment (3 marks):** Must state $P(H \vdash E)$ must be $< 1$.
      *   *Flag:* "Logical Omniscience Dodge." If the student writes "The fix is to assume agents aren't logically omniscient" without specifying that the *prior over the entailment* is the variable being updated, cap at 1/3 for this section.
  *   **Growing Hypothesis Space (4 marks):** Must identify that Wegener *created* $H$.
      *   *A-Grade:* Notes that Bayesianism requires a fixed sample space; you cannot conditionalize on a relation involving a hypothesis that had no prior probability.
      *   *B-Grade:* Says "Garber solves the problem" without addressing the new hypothesis issue, or claims logical non-omniscience solves the creation of new concepts.

  **Part (d): New Evidence & Retroactivity (5 Marks)**
  *   **Verdict (1 mark):** No. (Yes is automatically 0 for this section).
  *   **Justification (4 marks):** Must distinguish between updating $H$ and updating the status of $E$.
      *   *A-Grade:* Appeals to synchronicity of conditionalization or distinguishes between confirming the *mechanism* vs. the *evidence*.
      *   *B-Grade:* "It's all about priors" shrug. (e.g., "It depends on the prior"). This is vacuous. Must specify *which* prior is affected (the likelihood of the mechanism) and why that doesn't change the 1915 update.
      *   *Penalty:* If they argue "It confirms it because the theory is true," deduct all 4 marks (appeal to truth, not Bayesian justification).

  **General Differentiation (A vs. B)**
  *   **The "2am" Line:**
      *   **B Answer:** Gets the arithmetic right in (a) but misses the *sign* of the change (disconfirmation). Treats the Garber solution as a magic bullet that "fixes Bayesianism" without identifying the cost (uncertain logical priors).
      *   **A Answer:** Spots the disconfirmation trap in (a) and explains *why* the math forces it (marginal probability ceiling). In (c), recognizes that Garber moves the goalposts to logical priors but fails on *new* hypotheses. In (d), refuses to conflate later success with earlier justification.

  **Specific Flags for Graders**
  1.  **Logical Omniscience Dodge:** In Part (c), students often write "Bayesianism assumes logical omniscience, which is unrealistic." This is a slogan, not an analysis. They must say: "To model non-omniscience, we assign $P(H \vdash E) < 1$, but this requires a prior over logical relations." If they don't mention the prior over the entailment, they do not understand the Garber move.
  2.  **The "Priors" Shrug:** In Part (a) and (d), students may write "This shows priors are subjective." This is true but worthless. Reward only answers that specify *which* prior is doing the work (e.g., $P(E)$ being too high in (a), or the likelihood of the mechanism in (d)).
