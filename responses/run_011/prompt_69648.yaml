answer: |-
  **1. The Anchor**
  "Let's skip the origin story and go straight to the data. You've got twenty years of publications across color, gender, and space. If you had to bet your tenure on a single finding being the most robust, which one is it, and why has it survived replication attempts better than the others?"

  *   **Follow-up:** If she picks color: "Color is highly perceptual. If she picks space: "Space is often non-linguistic." Ask: "Does the robustness of that specific domain suggest the effect is stronger where language is *optional* or where it's *obligatory*?"
  *   **Host Note:** **Good:** She names a specific study, admits limitations, and distinguishes it from weaker findings. **Evasive:** She gives a general summary of her "body of work" or claims all findings are equally robust.
  *   **[HOSTILE AUDIENCE HOTSPOT]**

  **2. Effect Size vs. Familiarity**
  "You've argued that critics fixate on effect size, but let's pin down the threshold. When a speaker is 30 milliseconds faster discriminating a blue shade because they have a label for it, what has to be true for that to count as 'linguistic relativity' rather than just 'label familiarity'? Where is the line between a Whorfian effect and a priming effect?"

  *   **Follow-up:** If she says "It's about consistency across tasks": Ask "Does consistency compensate for magnitude, or does it just show a consistent bias?" If she says "It's theoretical, not milliseconds": Ask "Then why rely on reaction time data to prove it?"
  *   **Host Note:** **Good:** She defines a qualitative shift (e.g., categorical perception vs. speed) or admits the line is blurry. **Evasive:** She reiterates that "small effects matter" without defining what makes them *relativity* rather than *practice*.

  **3. The Verbal Interference Trap**
  "Let's talk about verbal-interference tasks. When a concurrent verbal load wipes out the cross-linguistic difference, you interpret this as language being recruited online to aid performance. Skeptics say it proves the task was linguistic all along, not perceptual. You can't have it both ways: is language the *lens* through which the world is seen, or just a *tool* used to solve a specific lab puzzle?"

  *   **Follow-up:** If she chooses "Lens": Ask "Why does the lens disappear when working memory is loaded?" If she chooses "Tool": Ask "If it's just a tool, isn't that compatible with universal cognition using different strategies?"
  *   **Host Note:** **Good:** She commits to one interpretation and explains the consequence for the theory. **Evasive:** She says "It's both depending on context" or "The distinction isn't useful."
  *   **[HOSTILE AUDIENCE HOTSPOT]**

  **4. Level of Processing**
  "Following on that: are you claiming language alters early visual perception, or is this happening at the stage of memory encoding and retrieval? If I show you a color and you identify it immediately, is the language affecting the retina or the report?"

  *   **Follow-up:** If she says "Perception": Ask "Do you have evidence from ERP or eye-tracking that pre-dates verbal coding?" If she says "Memory/Report": Ask "Doesn't that narrow the claim to 'thinking for speaking' rather than 'thinking'?"
  *   **Host Note:** **Good:** She specifies the cognitive stage (e.g., "post-perceptual categorization"). **Evasive:** She uses vague terms like "experience" or "processing" without locating them in the cognitive pipeline.

  **5. The Whorf Alignment**
  "If we narrow the claim to 'thinking for speaking' or post-perceptual coding, as you just suggested: would Benjamin Lee Whorf recognize that as his hypothesis? Or have we redefined 'relativity' to mean something much weaker than the 'prison house of language' he described?"

  *   **Follow-up:** If she says "He'd recognize it": Ask "He wrote about how language shapes *worldview*, not just reaction times. Is worldview still on the table?" If she says "It's weaker": Ask "Then why invoke his name at all? Why not call it 'linguistic modulation'?"
  *   **Host Note:** **Good:** She admits the modern view is more nuanced/limited than the pop-Whorfian view. **Evasive:** She appeals to Whorf's authority while quietly discarding his stronger claims.

  **6. The Confound Control**
  "Let's talk about subject variables. Speakers of languages with different spatial frames often differ in schooling, literacy, and comfort with formal testing. What is your gold-standard design that controls for these factors without just assuming they cancel out? Are you testing unschooled populations, or matching for years of education?"

  *   **Follow-up:** If she says "We match for education": Ask "Does a standardized test score truly capture cultural comfort with abstraction?" If she says "We test remote populations": Ask "How do you control for the tester effect and familiarity with experimental contexts?"
  *   **Host Note:** **Good:** She details a specific control group (e.g., bilinguals, non-literate speakers) and acknowledges residual noise. **Evasive:** She claims these factors "don't explain the pattern" without showing the control data.
  *   **[HOSTILE AUDIENCE HOTSPOT]**

  **7. Causal Direction**
  "Correlation isn't causation. It's possible that a culture values certain perceptual distinctions for environmental reasons, and *then* encodes them in language. What evidence do you have that the lexical split is upstream of the perception, rather than downstream of a culturally salient difference?"

  *   **Follow-up:** If she cites training studies: Ask "Do artificial language training studies generalize to natural contexts?" If she cites developmental data: Ask "At what age does the divergence appear relative to language acquisition?"
  *   **Host Note:** **Good:** She points to longitudinal or training data that establishes temporal precedence. **Evasive:** She argues that "language and culture are intertwined" (which sidesteps the causal arrow).

  **8. The "Straw Man" Defense**
  "You have a standard move when critics attack effect size: you say they are attacking a straw man because the effects were never supposed to be large. But if the effects are too small to impact daily life, why are they theoretically large enough to overturn universalism? How do you minimize the effect for the critics but maximize it for the theory?"

  *   **Follow-up:** If she says "It's about principle, not size": Ask "Does a principle without behavioral consequence matter for cognitive science?" If she says "They add up over time": Ask "Do you have data on the cumulative long-term impact?"
  *   **Host Note:** **Good:** She explains why a small, reliable bias challenges a null hypothesis of universality. **Evasive:** She accuses the critic of misunderstanding the hypothesis (again) without addressing the contradiction.
  *   **[HOSTILE AUDIENCE HOTSPOT]**

  **9. Falsification**
  "I want a clean falsification condition. What specific result, in what specific paradigm, would make you abandon the view that language influences thought? Is there any data pattern that is incompatible with your theory?"

  *   **Follow-up:** If she says "No single study would": Ask "Then what would? A meta-analysis?" If she names a specific null result: Ask "Has that result already happened in other domains, like object recognition?"
  *   **Host Note:** **Good:** She names a specific empirical outcome (e.g., "If bilinguals showed no switch cost"). **Evasive:** She says "Science is complex" or "Theories aren't abandoned on one study."

  **10. Domain Generality**
  "Is there any cognitive domain you consider immune to linguistic influence? If I ask you about face recognition, numerical approximation, or music perception, is the answer always 'maybe,' or are there boundaries where language simply cannot penetrate?"

  *   **Follow-up:** If she says "Everything is influenced": Ask "Doesn't that make the claim unfalsifiable?" If she names a domain: Ask "What protects that domain? Is it modular?"
  *   **Host Note:** **Good:** She identifies a boundary condition (e.g., "Low-level vision is safe"). **Evasive:** She suggests language *could* influence everything given the right context.

  **11. Audience Pre-emption**
  "I have a question I know someone in the back is thinking: If these effects are real but small, and depend on verbal recruitment, why should we care? Does this change how we teach, translate, or legislate, or is it purely a phenomenon of the psychology lab?"

  *   **Follow-up:** If she says "It changes theory": Ask "Does theoretical change without practical application justify the research focus?" If she says "It has real world impact": Ask "Can you give a concrete example outside the lab?"
  *   **Host Note:** **Good:** She connects the lab finding to a real-world implication (e.g., eyewitness testimony, AI training). **Evasive:** She says "Understanding the mind is enough."
  *   **[HOSTILE AUDIENCE HOTSPOT]**

  **12. The Next Step**
  "Finally, where does the field go from here? We've spent twenty years arguing about whether the effect exists. What is the next twenty years about? Are we mapping the boundaries, or looking for the neural mechanism?"

  *   **Follow-up:** If she says "Mechanisms": Ask "What imaging modality is ready for that?" If she says "Boundaries": Ask "How do you stop the boundary from shrinking until the effect disappears?"
  *   **Host Note:** **Good:** She outlines a specific new methodology or population. **Evasive:** She gives a platitude about "interdisciplinary collaboration."
