  Stanza one establishes the physical shop while hinting at encoding; "led" puns on metal and past tense. Stanza two shifts to the mapping function, assigning value to position. Stanza three introduces the temporal paradox: the proof exists before distribution (interpretation). Stanza four merges the biological and arithmetic; the "line" is both copy and formula. Stanza five creates tension between inherent truth ("No hand") and required observation ("waits").

