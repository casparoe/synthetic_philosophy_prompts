answer: |-
  **UNIVERSITY EXAMINATIONS**

  **MPhil in Economics**
  **Paper: Interactive Epistemology**

  **Time Allowed: 50 minutes**
  **Total Marks: 25**

  **Instructions:**
  Answer all three parts of the question below. The use of calculators is not permitted. This paper is closed book. Do not cite or name any specific authors or published works; argue solely from the concepts and the scenario provided.

  ***

  **Question 1**

  Ada and Bo are statisticians at the same medicines regulator. Let $E$ be the claim that a newly licensed drug reduces ninety-day mortality. Each has analysed a different trial: Ada's posterior for $E$ is 0.8, Bo's is 0.35. Both figures appear in a joint report signed by the two of them, so each knows the other's figure, each knows that the other knows it, and so on without limit. Each regards the other as fully rational and as a Bayesian who conditions on her or his own data. Neither budges. Asked whether this is a counterexample to the theorem on the agreement of posteriors, Ada says that it cannot be, since they had different data, and the theorem only rules out disagreement that differences in information fail to explain. Pressed further, both agree that before either had seen any data each would have assigned 0.6 to $E$, that each knows the other would have, and that this is likewise common knowledge between them. Bo concludes: 'That is our common prior. So every premise of the theorem holds and yet we disagree. The theorem must be false.'

  (a) Assess Ada's reply and Bo's conclusion, identifying precisely what each gets right and what each gets wrong, and saying which premise or premises of the theorem the case in fact strains. (8 marks)

  (b) Decide whether the *ex ante* agreement on 0.6 supplies a common prior in the sense the theorem requires, distinguishing agreement on a single number concerning one proposition from the sharing of a prior over a state space, and addressing what else would have to be true for the counterfactual to do the work Bo asks of it. (9 marks)

  (c) Examine the status of the assumption itself: if a common prior is read counterfactually, as a belief state no agent ever actually occupied, what would count as evidence that it fails to hold, and what follows for anyone who wants to deploy the theorem as a premise in the argument that persisting disagreement between epistemic peers is irrational. (8 marks)

  ***

  **MODEL ANSWER**

  **(a) Assessment of Ada and Bo**
  Ada is correct that the theorem permits disagreement when agents possess different information. The result does not demand identical posteriors if partitions or signals differ. However, she is potentially mistaken if she implies that differing data alone secures the theorem's applicability; the theorem strictly requires that differences in posteriors be *exhaustively* explained by differences in information, which presupposes a common starting point. If their data processing rules differ, the premise fails.

  Bo is incorrect to conclude the theorem is false. The theorem is a mathematical result; if the premises hold, the conclusion (agreement) must follow. If the conclusion fails (disagreement persists), logic dictates that at least one premise must be false, not that the logic is flawed. Bo claims every premise holds, but this is the error. The case strains the Common Prior Assumption. While they share a probability for $E$ *ex ante*, this does not guarantee they share a prior probability measure over the entire relevant state space, nor that they interpret new data via the same likelihood functions derived from that prior. Thus, Bo's diagnosis of the failure is wrong: the theorem is valid, but its conditions are not met.

  **(b) The Nature of the Common Prior**
  Agreement on a single number ($P(E) = 0.6$) does not constitute a common prior in the requisite sense. A prior is a probability measure defined over a full state space $\Omega$, which must include not only the truth of $E$ but also the possible data signals each agent might receive and the combinations thereof. A common prior requires that for *every* event in $\Omega$, Ada and Bo assign the same probability *ex ante*.

  Agreement on the marginal probability of $E$ is consistent with radically different joint distributions over $E$ and the data. For instance, Ada might believe her data is highly informative about $E$, while Bo believes his data is noisy, even if they initially agreed on the base rate of $E$. For the counterfactual '0.6 prior' to validate the theorem's premises, it must be the case that this 0.6 is derived from an identical probability measure over all states, and crucially, that their updating rules (likelihoods) are common knowledge and consistent with that single measure. Without identity in the full distribution, including correlations between states and signals, the 'common prior' is merely a coincidental overlap on one marginal, insufficient to force posterior agreement.

  **(c) Status of the Assumption and Normative Implications**
  If the common prior is counterfactual, it is not directly observable. Evidence that it fails to hold is precisely the phenomenon the theorem rules out: common knowledge of rationality and posteriors, yet persistent disagreement. If we observe 'agreeing to disagree', we have empirical evidence that the agents do not share a common prior, however similar their *ex ante* marginals appear.

  This creates a difficulty for normative arguments. If one wishes to use the theorem to argue that persisting disagreement between epistemic peers is irrational, one must first establish that the Common Prior Assumption is a requirement of rationality. However, the assumption is often viewed as empirical or contingent rather than a constraint of rationality itself. If the prior is merely a contingent fact about the agents' history, then disagreement is not irrational; it simply reflects different origins. To claim disagreement is irrational begs the question: it assumes the Common Prior Assumption is a norm of rationality to prove that violating it (by disagreeing) is irrational. Therefore, the theorem cannot independently establish the irrationality of disagreement without first normatively defending the necessity of a common prior, which the counterfactual nature of the assumption renders difficult.

  ***

  **MARKING SCHEME**

  **Total Marks: 25**

  **Part (a) – 8 Marks**
  *   **First-Class Differentiator:** Explicitly distinguishes between the validity of the logic (Bo is wrong to call the theorem false) and the satisfaction of premises. Identifies that Ada is right about data but overlooks that 'different data' must be the *only* difference (i.e., priors must be identical).
  *   **Competent Answer:** Notes Bo is wrong about the theorem being false and Ada is right about data, but may fail to specify that the Common Prior Assumption is the specific premise under strain.
  *   **Mark Allocation:**
      *   3 marks: Correctly validates the theorem's logic against Bo's claim.
      *   3 marks: Correctly qualifies Ada's defence (data differences allowed, prior differences not).
      *   2 marks: Identifies the Common Prior Assumption as the strained premise.

  **Part (b) – 9 Marks**
  *   **First-Class Differentiator:** Clearly articulates the distinction between a marginal probability on one event and a full probability measure over a state space. Notes that likelihood functions/updating rules must also be derived from the common measure.
  *   **Competent Answer:** States that 0.6 is not enough because a prior covers more than one event, but may not explain the implication for likelihoods or joint distributions.
  *   **Mark Allocation:**
      *   4 marks: Distinguishes marginal agreement from a full measure over $\Omega$.
      *   3 marks: Explains that likelihoods/correlations between data and states must also be common.
      *   2 marks: Concludes that the counterfactual 0.6 is insufficient for the theorem's work.

  **Part (c) – 9 Marks (Correction: Prompt asked for 8 marks in question, scheme must match)**
  *   **Correction:** Part (c) is 8 marks.
  *   **First-Class Differentiator:** Identifies the circularity in using the theorem to normatively condemn disagreement (one must assume CPA is rational to prove disagreement is irrational). Identifies persistent disagreement as the empirical test for CPA failure.
  *   **Competent Answer:** Notes CPA is hard to verify and disagreement suggests it fails, but misses the normative circularity point.
  *   **Mark Allocation:**
      *   4 marks: Identifies persistent disagreement as evidence of CPA failure.
      *   4 marks: Explains the circularity problem in normative deployment.

  **Identifiable Errors and Penalties**
  Examiners should deduct marks as follows for specific errors. Deductions are cumulative but the total for a section cannot fall below zero.

  1.  **Rehearsing the Proof (Max -5 marks):** Attempting to write out the mathematical proof of the theorem or defining partitions algebraically without applying them to the Ada/Bo scenario. This demonstrates rote learning rather than application.
  2.  **Theorem Prohibits Different Data (Max -4 marks):** Stating that the theorem requires agents to have the same information or data to agree. This is a fundamental misunderstanding of the result.
  3.  **Equating Marginal with Prior (Max -4 marks):** Asserting in part (b) that because they agreed on 0.6, they satisfy the Common Prior Assumption. This fails the conceptual distinction required.
  4.  **Theorem is False (Max -5 marks):** Concluding in part (a) that Bo is correct and the theorem is mathematically false because the conclusion failed. This violates basic logical deduction regarding premise/conclusion relationships.

  **Note on Citations:**
  Any answer that names specific authors (e.g., Aumann, Harsanyi) or cites specific papers shall be penalised by 2 marks total, as the examination instructions explicitly forbid this.
