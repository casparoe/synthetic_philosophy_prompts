answer: |-
  Your intuition about "Posting" vs. "Vouching" is not just relabeling; it is a recognized distinction in social epistemology. Your roommate is looking for a **Knowledge Norm** (assert only what you know), which works for private conversation but breaks professional life. You are operating on an **Institutional Norm** (assert what the system warrants), which works for the job but creates traps in personal life.

  The mess you're feeling comes from trying to apply one rule to two different games. Here is the principle that reconciles your verdicts without becoming baroque.

  ### The Principle of Epistemic Liability

  You may assert proposition $P$ flat-out (without hedging) if and only if one of the following two clauses is satisfied:

  **Clause 1 (The Institutional Shield):** You are acting as an authorized conduit for a system $S$ (airline, weather service, manufacturer label), where:
  *   (a) The audience understands $S$ is the source of the claim, not your private judgment.
  *   (b) The social or professional cost of $P$ being false falls primarily on $S$, not on you personally.

  **Clause 2 (The Personal Warrant):** You are acting as a private individual, where:
  *   (a) You possess personal evidence sufficient to justify the trust the listener is placing in *you*.
  *   (b) You are willing to accept the social cost of being wrong (blame, loss of trust).

  **Clause 3 (The Boundary Condition):** The shift from Clause 1 to Clause 2 is determined by the *channel*, not the *information*. If the channel leaves the official system (e.g., the desk, the broadcast mic, the drug label), you move from Shield to Warrant immediately, regardless of whether the data is the same.

  ---

  ### Mapping Your Cases to the Clauses

  Here is how the principle justifies your gut verdicts. If a clause exists only to save one case, I will note it.

  | Case | Verdict | Governing Clause | Why it fits |
  | :--- | :--- | :--- | :--- |
  | **Board at Desk** | Fine | **Clause 1** | You are the conduit. The Airline ($S$) takes the hit if wrong. Passenger knows this. |
  | **Board via Text** | Not Fine | **Clause 2** | Channel is personal. You ($S$) take the hit if wrong. Memory is insufficient warrant. |
  | **Radio Weather** | Fine | **Clause 1** | You are the conduit for the Station/Meteorologist. Listeners know forecasts are probabilistic ($1a$). |
  | **Wedding Weather** | Not Fine | **Clause 2** | Channel is personal. Cousin trusts *you*, not the met service. 60% is insufficient warrant ($2a$). |
  | **Pharmacy Label** | Fine | **Clause 1** | Conduit for Manufacturer/FDA. Liability is on them, not the tech. |
  | **Pharmacy Prediction** | Not Fine | **Clause 2** | No label for "Friday." Tech is originating the claim. No warrant ($2a$). |
  | **Sister (Callback)** | Not Fine | **Clause 2** | Personal channel. You know it's false/uncertain. Violates $2a$. |
  | **Allergens (Phone)** | Fine | **Clause 1** | *Crucial Case.* You are a temporary conduit for the Package ($S$). Manufacturer holds liability. |
  | **"Airline Says"** | Fine | **Clause 1/4** | You are explicitly attributing to $S$. You are not vouching for truth, only for the report. |

  *Note on Clause 1(a):* This does the heavy lifting for the Radio and Board cases. It encodes the "genre expectation" you mentioned. Listeners know radio forecasts and flight boards are fallible but actionable.
  *Note on Clause 3:* This resolves the Board/Desk vs. Board/Text conflict. The information is identical, but the *liability structure* changes the moment you leave the desk.

  ---

  ### Applying the Principle to Your New Cases

  **1. The Incident Review (90% sure, hearsay, name on report)**
  *   **Verdict:** **Do not assert it flat-out.**
  *   **Analysis:** This looks like Clause 1 (you are at work), but the requirement "my name goes on the report" triggers **Clause 2**. By signing it, you are accepting personal liability for the accuracy, shifting from Conduit to Origin.
  *   **Reasoning:** Hearsay from a radio channel does not meet the "personal evidence" requirement of Clause 2(a). Even though you are 90% sure, you cannot corroborate it.
  *   **Action:** Write: "Delay attributed to late crew arrival per ground frequency monitoring." This attributes the claim to the system (Clause 1) while acknowledging your report is a record of what was heard, not a verified fact. You protect yourself from the liability shift.

  **2. The Automated Announcement System ("Flight 214 on time")**
  *   **Verdict:** **Fine (but no human is asserting).**
  *   **Analysis:** This is pure **Clause 1**. There is no human agent to vouch. The system ($S$) is asserting $P$ to the audience. The liability is entirely on the Airline.
  *   **Nuance:** If a passenger asks *you* "Is that announcement true?", you revert to the Board/Desk rule. If you know it's wrong, you cannot simply parrot the machine (that violates your duty as an agent). You must hedge: "The system says on time, but I see the inbound is in Denver."

  **3. The Airline Chatbot**
  *   **Verdict:** **Fine (for the bot).**
  *   **Analysis:** Like the automated announcement, the bot is the Institutional Shield. It is a direct interface for System $S$.
  *   **Nuance:** If the bot hallucinates, the Airline takes the reputational hit, not the software engineer. However, if a human agent *copies and pastes* the chatbot's answer into an email to a customer, they may be triggering **Clause 2** (Personal Warrant) depending on company policy. If the email comes from "support@airline.com" (System), it's Clause 1. If it comes from "John at Customer Service" (Person), it drifts toward Clause 2.

  ---

  ### The Honest Trade-Off

  You asked me to be honest about which verdicts the principle can't keep, and whether the "Knowledge Norm" (your roommate's view) is cheaper.

  **The Roommate's "Knowledge Norm"**
  *   *Rule:* "Only say $P$ if you know $P$."
  *   *Cost:* This wrecks your job. You cannot work the gate desk under this norm. You would have to hedge every boarding time ("The computer *suggests* it's on time..."). It also wrecks the Radio case (forecasters rarely *know*) and the Allergen case (you didn't test the peanuts).
  *   *Verdict:* **Reject it.** It is philosophically clean but socially useless for your context.

  **The "Epistemic Liability" Principle (My Proposal)**
  *   *Cost:* It requires you to be hyper-vigilant about **Context Switching**.
  *   *The Trap:* The Incident Review case is the danger zone. Your instinct might be "I'm at work, so I'm Posting (Clause 1)." But the signature line makes it "Vouching (Clause 2)."
  *   *The Sacrifice:* To keep this principle coherent, you must admit that **the Board/Text case is the hardest one.**
      *   *Why:* In the Text case, you are transmitting data from the Airline ($S$), just via phone. Why isn't that Clause 1?
      *   *The Hard Truth:* Because your friend cannot sue the Airline if you're wrong. They trust *you*. The moment the listener's recourse is against *you* rather than the *System*, you have shifted to Clause 2.
      *   *If you refuse to accept this:* If you insist that texting the friend is "Fine" because the data is the same as the Desk, then this principle breaks. You would need to add a clause about "Beneficence" (it's okay to mislead for comfort), which complicates things.
      *   *My advice:* Keep your verdict that Texting is "Not Fine." It protects your friendship. If you're wrong and she misses the flight, she blames you, not the board. The principle holds.

  **Summary:**
  Your "Posting vs. Vouching" intuition is correct. It is not a mess; it is a sophisticated understanding of **who pays for error.**
  *   **Posting:** The System pays. (Desk, Radio, Label).
  *   **Vouching:** You pay. (Text, Wedding, Review Report).

  The only thing you need to change is your hesitation on the **Incident Review**. That is a Vouching situation disguised as a Posting situation. Do not write the hearsay as fact. Attribute it. That is the only way to keep your name off the hook.
