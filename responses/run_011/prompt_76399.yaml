answer: |-
  Dear colleague,

  Your unease is well founded, and it strikes me that you have arrived at the precise point where the engineering of incentives bumps against the metaphysics of value. For years we have treated proper scoring rules as philosophical off-the-shelf components, assuming that if the mechanism is incentive-compatible, the normativity follows automatically, but your experience running the program suggests that the machinery is not neutral infrastructure. It is theory-laden, and quite heavily. When you ask what commitments are load-bearing, you are asking us to distinguish between the mathematics of propriety and the ethics of belief that the mathematics is meant to instantiate. I think the first thing to discard is the idea that the quadratic rule itself carries the bulk of the philosophical weight. Properness ensures that a risk-neutral agent maximizes expected score by reporting their true credence, but that is a claim about rational choice under a specific utility function, not a claim about epistemic value. The deeper commitment lies in what you do with the scores after you have them, specifically in the aggregation method. By taking the simple arithmetic mean of per-question scores to determine standing, your design presupposes that epistemic value is additively separable across propositions and that each question represents an equal unit of epistemic labor. This is a substantial metaphysical claim about the structure of belief. It implies that the world is composed of independent facts that can be tallied like coins, and that being right about a trivial matter contributes the same amount to a forecaster's epistemic virtue as being right about a consequential one, provided the confidence levels match. The machinery requires additive separability to function as a leaderboard, but it does not require that every question be weighted equally; that equal weighting is a convenience that smuggles in a democratic view of truth where all resolved propositions are of identical worth. You could maintain the quadratic rule and the mean aggregation while weighting questions by importance, but your current design rules out the view that epistemic value is holistic or coherentist, where the value of a belief depends on its relation to other beliefs rather than its atomic accuracy.

  The substitution of the adjudicator's ruling for the truth is where the practice diverges most sharply from standard accuracy-first epistemology, and I suspect this is where your discomfort is most acute. Accuracy-first views typically define epistemic value as proximity to the truth, where truth is an alethic property of propositions relative to the world. Your system defines epistemic value as proximity to a ruling, where the ruling is an institutional act constrained by a written criterion. This is not merely an operational approximation of truth; it is a replacement of the alethic standard with a deontic one. The framework can absorb this only if we treat the resolution criterion as fixing the possible world for the purposes of the game, effectively stipulating that the adjudicator's decision constitutes the truth value for that context. If we accept this, then the practice is consistent with accuracy-first epistemology but restricted to a constructed micro-world where the truth conditions are fixed by contract rather than nature. However, if the criterion allows for outcomes that are technically correct but substantively misleading, as your three-way split observation suggests, then the score measures compliance with a rule rather than accuracy regarding the underlying phenomenon. This borrows the legitimacy of truth without the substance, and it commits you to the view that epistemic virtue is partly a matter of linguistic precision and rule-following rather than purely doxastic alignment with reality. The machinery requires that there be a fact of the matter available at resolution, but it does not require that this fact be metaphysically robust; it only requires that it be institutionally stable.

  Your observation about the three-way splits is particularly damning for the idea that the score measures the quality of the belief itself. If forecasters' beliefs did not change but their scores improved simply because the partition of outcomes was refined, then the scoring rule is not invariant under description. The quadratic rule is known to be sensitive to the granularity of the possibility space, but in practice, this means that a forecaster can increase their epistemic standing without improving their epistemic state, simply by answering questions that offer more ways to be partially right. This reveals that the leaderboard ranks the performance of the betting strategy relative to the question design, not the accuracy of the credence relative to the world. The design presupposes that the question format is exogenous and neutral, but the data shows it is constitutive of the score. This commits you to a view where epistemic value is relative to the framing of the inquiry, which sits uncomfortably with the realist intuition that truth is framing-independent. To make this intelligible, you must accept that the object of evaluation is not the credence in isolation but the credence paired with the specific partition offered by the tournament. This moves the view away from pure accuracyism toward a pragmatic account where the value of a belief is tied to the specific decision problem or query structure it is meant to address.

  The encouragement of volume and the proposal to allow costless skipping pull in opposite directions regarding the duty to have opinions. By encouraging volume, you imply that there is epistemic value in forming credences on matters one has not deeply studied, provided one remains calibrated. This aligns with a view where the distribution of confidence across many topics is itself a virtue, perhaps because it reflects a well-tuned heuristic engine even if the individual inputs are thin. It rules out the view that one should suspend judgment whenever evidence is insufficient, unless that suspension is modeled as a credence of point-five or a specific distribution that yields low scores. Conversely, allowing costless skipping would shift the virtue from comprehensive responsiveness to selective competence. It would imply that epistemic value attaches only to informed judgment and that there is no penalty for silence. Your current design, which rewards volume and penalizes non-answer implicitly by lowering the sample size of the mean, assumes that having a number is better than having no number, which is a pragmatic commitment to the utility of quantified opinion over qualitative suspension. This is incompatible with a strict evidentialist norm that forbids belief without sufficient evidence, unless you treat the forecasting context as a distinct game where the norm is to play rather than to know.

  The leaderboard itself introduces a comparative element that is foreign to standard epistemic utility theory. Accuracy is an absolute measure; one can be perfectly accurate in isolation. Ranking is inherently zero-sum and social. By ranking forecasters, you commit to the view that epistemic virtue is partly competitive, or at least that the social recognition of virtue requires ordinal comparison. This does not contradict accuracy-first views, but it adds a layer of social epistemology where the value of being accurate is enhanced by being more accurate than others. It suggests that the purpose of the program is not just to generate accurate beliefs but to identify reliable agents. This is a shift from evaluating states of belief to evaluating cognitive agents, which is a different category of assessment. The machinery requires that scores be comparable across agents, which they are under a common scoring rule, but it does not require that the mean score be the metric of comparison. You could rank by calibration alone, or by resolution alone, but choosing the mean implies that the total expected accuracy is the primary virtue of the agent. This fits comfortably with veritistic social epistemology but rules out views where the diversity of belief or the independence of judgment is more valuable than aggregate accuracy.

  When we look at the rival views you mentioned, the design is not silent; it is actively hostile to some. A James-style picture, where believing truth and avoiding error are distinct aims traded off by the agent, is largely foreclosed by the use of a strictly proper scoring rule. The quadratic rule fixes the trade-off ratio between hits and misses mathematically; the agent cannot choose to be more conservative to avoid error without sacrificing expected score. The machinery assumes there is one correct trade-off defined by the rule, not by the agent's epistemic risk tolerance. Views that prioritize understanding or explanatory structure are ruled out by the atomic nature of the questions. If epistemic value resides in the coherence of a web of belief, then scoring individual propositions independently and averaging them misses the value entirely. Your system is indifferent to whether a forecaster's beliefs form a consistent system across questions, provided each individual credence is accurate relative to its resolution. This commits you to a atomistic view of knowledge where the whole is nothing more than the sum of the parts. Pragmatic views where credences matter only for action are partially accommodated, since scoring rules are often derived from decision-theoretic losses, but the isolation of the forecasting act from real-world consequences strips the pragmatism of its stakes. You are measuring the accuracy of the input to action without the action itself, which assumes that accurate inputs have value independent of the decisions they guide.

  Regarding the three proposed changes, the shift to logarithmic scoring is not merely bookkeeping; it is a shift in the implicit theory of risk and error. The quadratic rule treats error linearly in distance squared, while the log rule imposes infinite penalty for certainty in error. Adopting the log rule would commit you to the view that overconfidence is a greater epistemic sin than underconfidence, and that the cost of being wrong with certainty is unbounded. This is a normative claim about the structure of epistemic loss that goes beyond propriety. It aligns better with a view that treats belief as a commitment that should only be made when evidence is overwhelming, whereas the quadratic rule is more forgiving and encourages participation. The proposal to allow costless skipping is a change in the theory of epistemic duty. It moves from a requirement to respond to all inquiries to a permission to select only those where one has competence. This changes the virtue being measured from global calibration to local expertise. It is not accuracy-neutral; it changes the population of beliefs being evaluated and thus the meaning of the aggregate score. A mean over selected questions measures competence given interest, while a mean over all questions measures responsiveness and humility. The philosophical status of this change cannot be determined until you settle whether the goal is to find the best forecasters overall or the best forecasters on the questions they choose to answer.

  The conversion of binary questions into three-way questions, as you noted, is the most philosophically revealing. If scores improve without belief change, the metric is sensitive to the partition. This is not a scandal if you accept that epistemic value is partition-relative, but it is a scandal if you claim to measure truth-tracking. To resolve this, you must decide whether the question design is part of the epistemic challenge or merely the container for it. If it is part of the challenge, then the improvement is real because the forecasters successfully navigated a finer-grained space. If it is merely a container, then the score is inflated and misleading. This decision rests on a prior commitment about whether the value of a belief is intrinsic or relational to the query. I suspect you cannot discharge the commitment that the query structure is neutral. The machinery requires a fixed partition to calculate scores, so the partition is constitutive of the score. You must accept that you are measuring accuracy-relative-to-question-design, not accuracy-relative-to-world.

  Finally, there is a foundational commitment that no amount of redesign can discharge, which is the reification of credence as the sole bearer of epistemic value. Your entire apparatus assumes that a number between zero and one hundred is the appropriate format for epistemic assessment, and that the distance between that number and the outcome is the appropriate measure of success. This rules out any view where epistemic value resides in qualitative understanding, narrative coherence, or the capacity to generate new hypotheses. It assumes that the world is divisible into resolvable binary or ternary events and that the human mind's relation to these events is best modeled as a probability distribution. If there is epistemic value in knowing why something happened rather than just that it happened, your system cannot see it. If there is value in refusing to quantify the unquantifiable, your system penalizes it as missing data or miscalibration. You are building a temple to quantified veritism, and while it is a robust and useful temple, it cannot house gods that do not speak in numbers. The unease you feel is the friction between the richness of epistemic life and the flattening required to make it legible to the machinery. You can adjust the scoring rule or the skipping policy, but you cannot escape the commitment that what matters is the accuracy of quantified judgment on externally defined questions. That is the price of the leaderboard, and it is a price you must decide is worth paying for the clarity it buys.
