          *   Adjudicator rules based on criteria, not necessarily "truth" in a metaphysical sense.
          *   Question selection is external to forecasters.

  3.  **Identify Key Philosophical Tensions:**
      *   **Accuracy vs. Institution:** Scoring tracks distance from adjudication, not necessarily truth. Does accuracy-first epistemology survive this substitution?
      *   **Aggregation:** Mean score assumes additive separability and equal weight of questions. Is epistemic value additive?
      *   **Partition Sensitivity:** Quadratic scoring is not partition invariant. Adding a category changes expected scores even if beliefs don't change. This challenges the idea that scores measure "belief quality" independent of question framing.
      *   **Volume/Skipping:** Encouraging volume implies value in answering many questions. Skipping implies value only in competence. Does having an opinion on unstudied matters have epistemic value?
