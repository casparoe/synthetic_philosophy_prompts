answer: |-
  1. **Bottom line**
  Your friend is operationally correct, but you are metaphysically correct. The regime does not strictly entail Kripkean origin essentialism—the modal claim that you could not exist without these specific gametes. However, the practice functions *as if* genetic origins are constitutive of identity, granting them a normative weight that rivals essentialism. You win the philosophical argument about what the metaphysics actually prove; your friend wins the sociological argument about how the law behaves. The system presupposes a "genetic genealogy" view that treats biological origins as a unique, indispensable key to selfhood, even if it stops short of claiming they metaphysically necessitate existence.

  2. **First moves**
  I considered three frameworks. First, strict origin essentialism, which holds that having different parents entails being a different person. I set this aside because the law does not claim the child would not exist without the donor; it claims the child needs to *know* the donor. Second, psychological continuity theories, which ground identity in memory and character. I discarded this because the regime prioritizes genetic data over psychological bonding, granting rights to strangers based on DNA rather than caregivers based on shared life. Finally, I retained a hybrid view: a normative claim that genetic knowledge is a prerequisite for narrative completeness. This fits the practice best because it explains why information is valued without requiring the metaphysical heaviness of essentialism, though it risks collapsing into essentialism when justifying retrospective laws.

  3. **What the regime strictly presupposes**
  For the current ecosystem of laws, registries, and marketing to function without losing its point, several minimal commitments must hold. First, genetic information is treated as unique and irreplaceable. If medical history or social knowledge could substitute for donor identity, the push for identifying information would be unnecessary. The law presupposes that knowing the specific source of one's gametes satisfies a fundamental interest that knowing one's rearing parents cannot.

  Second, the practice assumes genetic connections create moral claims between strangers. Donor sibling registries operate on the premise that sharing half a genome generates a meaningful kinship bond worthy of cultivation, distinct from friendship or social family. This presupposes that biological relatedness carries intrinsic normative weight, independent of care or cohabitation.

  Third, the marketing of donors by traits presupposes a strong correlation between genetic material and personal identity features. By selling donors based on education or height, clinics imply that these traits are not merely physical but constitutive of the kind of person the child might become. This commodifies potentiality based on genetic determinism.

  Fourth, the law presupposes that the donor's status survives the transfer of gametes. Unlike a sold kidney, which becomes the recipient's property, gametes retain a link to the provider that the state deems relevant decades later. This implies that biological progenitors retain a residual identity-role that contractual anonymity cannot extinguish.

  Finally, the regime presupposes that the state has a legitimate interest in overriding private contracts to preserve this genetic link. This implies that the child's interest in biological truth outweighs the donor's interest in privacy and the parents' interest in family autonomy. Without these commitments, the specific focus on identifying gamete providers collapses into general record-keeping or medical history.

  4. **What it merely fits with**
  Several rival accounts explain parts of the practice without requiring the strong commitments above. A medical history view suggests records are for health safety. However, this cannot explain the demand for *identifying* information; non-identifying health data would suffice. A prohibition of deception view argues children deserve truth. Yet, telling a child they are donor-conceived satisfies truth-telling without revealing the donor's name. A narrative completeness view suggests people need to know their story. This fits well but struggles to explain why the genetic chapter is privileged over the gestational or rearing chapters.

  Recognition by others suggests the child deserves to be known by their biological source. This aligns with retrospective laws but fails to explain why the donor does not equally deserve to know the child. Simple curiosity is too weak to justify legislative override of privacy.

  To distinguish these from the practice itself, observe the remedies. If the goal were purely medical, laws would mandate health updates, not names. If the goal were anti-deception, counselling would focus on disclosure, not registries. The fact that the system pushes for *identity release* and *_sibling matching_ indicates it is not merely about health or truth, but about establishing a biological connection that the other accounts treat as incidental. The practice exceeds what these weaker accounts require, pointing back to a stronger view of genetic significance.

  5. **Two claims that look like one**
  We must distinguish the modal claim from the normative claim. The modal claim (Kripke) states you could not be *you* without this specific sperm and egg. The normative claim states that knowing this sperm and egg is vital for *your life*. The regime relies on the normative claim but borrows intuitive force from the modal one. It does not legally assert you would not exist otherwise, but it treats the origin as if it defines you.

  Furthermore, we must separate gametic, genetic, and gestational origin. Gametic origin refers to the specific cells; genetic origin to the code; gestational origin to the womb. The practice primarily invokes genetic origin via gametic records. It treats the genetic code as the seat of identity, accessible through the gamete provider. Gestational origin is largely ignored in donor conception law unless surrogacy is involved; the woman who gestates is often legally the mother immediately, rendering her origin transparent. The asymmetry exists because genetic origin is hidden and gestational origin is visible. The regime intervenes only where the biological truth is obscured, presupposing that the genetic line is the one requiring legal protection to remain intelligible to the person.

  6. **The asymmetry and the inconsistency**
  The tension between counselling and law is palpable. Counselling insists genes do not make parents, emphasizing social care to protect the rearing family's status. Yet, the law and registries treat genetic providers as identity-holders, granting offspring rights to find them and each other. This creates a contradictory ontology: the donor is simultaneously not a parent (no responsibility) and a crucial kin (identity source).

  This is coherent only if we accept a dualism of personhood: legal parenthood is social, but biological kinship is existential. The asymmetry regarding gestation arises because gestation is observable and legally recognized in maternity, whereas paternity via donation is invisible. The law fixes the invisible. However, this generates inconsistency. If genes do not make parents, why do they make siblings? Donor sibling registries validate genetic kinship while counselling invalidates genetic parenthood. The regime wants to relieve donors of obligation while retaining their significance. This is stable legally but metaphysically unstable, forcing donor-conceived people to navigate two conflicting maps of where their identity comes from: one saying care, the other saying code.

  7. **If the presupposed view were replaced**
  If we rebuilt the entitlement on a strictly non-essentialist foundation, such as purely medical welfare, the system would shrink drastically. Laws like Victoria's retrospective reform would become unintelligible, as breaching donor privacy would lack justification without a fundamental right to genetic identity. Clinic counselling would not need to emphasize telling children early, unless to prevent medical ignorance.

  Registry design would change from matching kin to matching health data. The concept of "donor siblings" would lose its moral urgency, becoming a social hobby rather than a right of recognition. Marketing donors by traits would likely be banned as misleading, since without genetic essentialism, selling potential personality via DNA is fraudulent.

  What would become unintelligible is the emotional weight of the search. The current practice makes sense of the profound feeling many donor-conceived people report: that something is missing without biological knowledge. A non-essentialist system would treat this feeling as a preference, not a right. The law would cease to view the donor as a permanent fixture in the child's life narrative. Ultimately, without the presupposition that genetic origins are uniquely constitutive of self-knowledge, the entire architecture of identity-release donation collapses into standard medical record-keeping, losing its transformative social ambition.
