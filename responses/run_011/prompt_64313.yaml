  You have identified a genuine tension in classical and modern monetary theory. Hume is describing what modern economics calls **hysteresis** (temporary shocks having permanent effects), but he couples it with a distributional mechanism that modern theory identifies as the **Cantillon Effect** (money enters at specific points, changing relative prices before general prices). There is no single canonical term that fuses the "declared neutrality" premise, the "permanent structural residue" outcome, and the "order-sensitive" mechanism into one phrase. Economists typically treat these as separate components (Neutrality, Hysteresis, Distributional Effects). The closest single concept for the persistence is "Monetary Hysteresis," but it does not inherently capture the "catalytic" nature of the money returning to baseline while the structure stays changed.

