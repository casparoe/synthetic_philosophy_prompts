prompt: |-
  I run a four-person research team at a small foundation. Every two weeks we ship a 15–20 page assessment memo on some technology or policy question that none of us are actually experts in — recent ones have been whether a city's congestion pricing really cut emissions, and whether a certain battery chemistry is going to get cheap. We get about three person-weeks per memo, my senior analyst has to sign off on the thing before it goes out, and she's simultaneously carrying three other projects.

  Lately we've been leaning much harder on decomposition: hand pieces to a junior hire who's been here four months, or to a model, and have the senior analyst just check the pieces and stitch them together. The idea I keep coming back to is what the alignment people call factored cognition — the thought that a hard cognitive task can be broken into factors each of which is simple enough for a weaker agent to do reliably, and that this only pays when checking a factor is cheaper than doing it yourself. Plus the more extravagant version where you don't stop at one level: the human asks a helper, the helper asks helpers, recursively, and you treat the whole tree as a single cognitive system that's better than anyone inside it.

  What I want is a procedure my team can actually run, not an essay about the concept. Specifically:

  - how to decide whether a given memo task is factorable at all — what makes a task decompose well, and what makes something resist it no matter how you slice it
  - what has to be in the spec for a single factor so that a junior or a model can recieve it and run with it without me in the loop: inputs, output shape, what they're allowed to assume, what "done" looks like, and how they flag that the question itself was malformed
  - how to set up the checking so verification really is cheaper than doing the work, and what to do in the cases where it just isn't
  - how deep to go: when a factor should itself be split, when to stop and do it whole
  - how errors compose — what happens to the memo when one factor is quietly wrong, and what in the procedure is supposed to notice
  - where the procedure stops being a procedure and hands the call back to a person, because it's judgment wearing a checklist's clothes

  Some constraints so this doesn't turn into fantasy: the junior has no background in any of these fields and gets maybe twenty minutes of my time per factor, and the senior analyst can spend at most an hour per memo verifying.

  Be honest about the failure modes I should expect — tasks whose whole value is in the integration, spec-writing that costs more than the task, and the nastiest one, where every factor is wrong in the same direction so nothing looks off locally.

  Then run it on three things from our queue: (1) from the congestion-pricing memo, the sub-task "establish what the evidence says about how much per-mile driving responds to a per-mile charge"; (2) "will this battery chemistry be cost-competitive with incumbents by 2035"; (3) drafting the memos actual argument and recommendations section — the part that says what the foundation should conclude and do. For (3) I want the procedure to give me an answer even if it isn't the answer I'm hoping for.

  Two last asks. Mark the steps you're least sure about, and tell me what would change your mind: what evidence from running this across four or five memos should make me scrap the procedure or some piece of it, and which of the premises I handed you above — the checking-is-cheaper condition, the idea that recursion comes free — you think is most likely to be false in practice. If you think one of them is load-bearing and shaky, say so rather than building around it.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Context:**
      *   **Role:** Leader of a 4-person research team at a small foundation.
      *   **Output:** 15-20 page assessment memos every two weeks (tech/policy questions).
      *   **Constraint:** None of the team are domain experts.
      *   **Resources:** ~3 person-weeks per memo. Senior Analyst (SA) is bottlenecked (3 other projects, max 1 hour verification per memo). Junior Analyst (JA) has 4 months tenure, no domain background, gets 20 mins of Leader time per factor.
      *   **Current Strategy:** Leaning into decomposition (factored cognition).
      *   **Goal:** A concrete *procedure*, not theory. Needs to cover factorability, specs, verification, depth, error propagation, and human hand-off.
      *   **Specific Requests:** Apply procedure to 3 specific tasks (Congestion pricing elasticity, Battery cost competitiveness, Drafting argument/recommendations).
      *   **Meta-Requests:** Mark uncertainty, specify evidence to scrap the procedure, challenge premises (checking cheaper than doing, recursion free).

  2.  **Deconstruct the Core Concept (Factored Cognition in Practice):**
      *   *Premise 1: Checking is cheaper than doing.* This is the critical economic assumption. In research, verification is often *harder* than generation (hallucination check vs. writing). I need to address this tension.
      *   *Premise 2: Recursion comes free.* It doesn't. Communication overhead kills recursion depth quickly in small teams.
      *   *Premise 3: Errors cancel out.* They often correlate (systemic bias, shared model priors).
      *   *Reality Check:* The SA has 1 hour for verification on a 3-person-week project. This is the tightest constraint. 1 hour = 60 minutes. If there are 10 factors, that's 6 minutes per factor. This dictates the *granularity* of the factors.

  3.  **Drafting the Procedure (The "Protocol"):**
      *   *Name:* Let's call it the "Modular Verification Protocol" (MVP) to keep it concrete.
      *   *Phase 1: Factorability Test.* How to decide if a task splits.
      *   *Phase 2: Spec Writing.* The contract between Leader and JA/Model.
      *   *Phase 3: Execution & Flagging.* How the JA works.
      *   *Phase 4: Verification.* How the SA checks (crucial given the 1-hour limit).
      *   *Phase 5: Integration.* Stitching it together.

  4.  **Addressing Specific Constraints & Failure Modes:**
      *   *Junior Limit:* 20 mins of Leader time per factor means specs must be template-driven, not bespoke essays.
      *   *SA Limit:* 1 hour total verification means verification must be *sampling* or *spot-checking key claims*, not re-doing work.
      *   *Systemic Error:* If everyone uses the same LLM or same biased source, decomposition won't help. Need "Red Team" steps.
      *   *Judgment vs. Checklist:* The "Recommendations" section is inherently judgment-heavy. Decomposition might fail there.

  5.  **Developing the Three Test Cases:**
      *   *Case 1 (Congestion Elasticity):* This is empirical. Good for decomposition. Needs source triangulation.
      *   *Case 2 (Battery Cost):* This is forecasting/modeling. High uncertainty. Needs assumption auditing.
      *   *Case 3 (Recommendations):* This is synthesis/judgment. High risk of "hollow" decomposition. Needs a different approach (perhaps "Argument Mapping" rather than factoring).

  6.  **Refining the "Checking is Cheaper" Premise:**
      *   *Honesty:* This is the shakiest premise. Verifying a junior's literature review often takes longer than doing it yourself if you know the field. Since the team *doesn't* know the field, verification is actually *impossible* in the deep sense. It becomes "process verification" (did they follow the spec?) rather than "truth verification" (is this fact correct?). I need to make this distinction clear.
      *   *Recursion:* Recursion is *not* free. It adds latency and signal loss. I should advise against deep recursion for a 4-person team. One level (Leader -> JA/Model -> Leader/SA) is max.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the constraints and the ambition.
      *   **The Protocol (MVP):** Step-by-step instructions.
      *   **Failure Modes:** Honest assessment of where this breaks.
      *   **Application to Queue:** Running the protocol on the 3 specific tasks.
      *   **Meta-Analysis:** Uncertainty markers, premises to challenge, kill criteria.

  8.  **Self-Correction/Iterative Thinking during Drafting:**
      *   *Initial thought:* Suggest the SA re-runs calculations. *Correction:* No time. SA must check *provenance* and *plausibility*, not re-calculate.
      *   *Initial thought:* Suggest deep recursion. *Correction:* User said 4-person team. Deep recursion is for massive distributed systems. Keep it to 2 levels max (Leader -> JA/Model).
      *   *Initial thought:* Treat Recommendations as factorable. *Correction:* Dangerous. Recommendations require weighing trade-offs. Better to factor the *inputs* to the recommendation, not the recommendation itself. I will advise against factoring Task 3 deeply.
      *   *Constraint Check:* SA has 1 hour. I need to emphasize *sampling*. If the JA produces 20 pages of backup, SA reads 2 pages.
      *   *Spec Writing:* Needs to be rigid. Input, Output, Constraints, "Stop Rules".

  9.  **Final Polish:**
      *   Ensure tone is pragmatic, not academic.
      *   Make sure the "Kill Criteria" are specific.
      *   Highlight the "Systemic Bias" risk (LLMs + Juniors often converge on the same wrong answer).

  10. **Final Review against User Prompt:**
      *   Procedure included? Yes.
      *   Factorability criteria? Yes.
      *   Spec requirements? Yes.
      *   Verification setup? Yes.
      *   Depth/Recursion? Yes.
      *   Error composition? Yes.
      *   Judgment hand-off? Yes.
      *   3 Test Cases run? Yes.
      *  Uncertainty marked? Yes.
      *   Premises challenged? Yes.

  (Proceed to generate output based on this structure.)
answer: |-
  This is a high-leverage operational problem. You are attempting to industrialize expertise you do not possess, under severe time constraints, using agents (junior + model) who also lack expertise.

  The core tension in your setup is the **Verification Bottleneck**. Your Senior Analyst (SA) has 60 minutes to verify a product that cost 3 person-weeks to build. This makes "truth verification" impossible. The SA can only verify *process compliance* and *plausibility*. If the procedure relies on the SA catching factual errors by re-doing the work, it will fail.

  Here is the procedure, the failure analysis, and the application to your queue.

  ---

  ### The Protocol: Modular Verification & Integration (MVI)

  This protocol treats the memo not as a document to be written, but as a hypothesis to be tested by independent modules.

  #### 1. The Factorability Test (Go/No-Go)
  Before assigning a task, run it through this filter. A task is **factorable** only if it meets all three criteria:
  *   **Termination Condition:** There is a clear, objective state of "done" (e.g., "table of 5 studies with sample sizes," not "assess the landscape").
  *   **Interface Isolation:** The output of this factor does not depend on the *reasoning* of another factor, only its *output*. (If Factor B needs to understand *why* Factor A concluded X to do its job, they are coupled. Decouple them.)
  *   **Local Verifiability:** A person who knows *nothing* about the topic can verify the work by checking the provenance (links, citations, math steps) without evaluating the truth of the claim itself.

  **Resistant Tasks:** Tasks requiring trade-off analysis, strategic judgment, or synthesis of contradictory values (e.g., "Should we fund this?"). These must remain with the Leader or SA.

  #### 2. The Spec Sheet (The Contract)
  You have 20 minutes per factor with the Junior Analyst (JA). Do not write essays. Use this template. If you cannot fill this out in 20 minutes, the task is too vague.

  *   **Question:** The specific empirical or logical question (e.g., "What is the range of price elasticity of demand for driving in London 2003-2007?").
  *   **Input Data:** Exactly where to look (e.g., "Search Google Scholar for 'congestion pricing elasticity London', limit to peer-reviewed journals post-2005").
  *   **Output Shape:** Rigid format (e.g., "Markdown table: Author, Year, N-size, Estimated Elasticity, Confidence Interval. No prose.").
  *   **Assumptions:** What they are allowed to take for granted (e.g., "Assume 'elasticity' definitions are consistent across papers; flag if not").
  *   **Stop Rules:** When to stop searching (e.g., "Stop after 10 papers or 2 hours, whichever comes first").
  *   **Flagging Condition:** Exactly what constitutes a "malformed question" (e.g., "If >50% of papers do not report confidence intervals, stop and flag").

  #### 3. Verification (The 60-Minute SA Audit)
  The SA cannot re-do the work. They must audit the *pipeline*.
  *   **Sampling:** The SA selects 20% of the citations/data points at random and checks if they exist and say what the JA says they say.
  *   **Outlier Check:** The SA looks for the highest and lowest numbers in the JA's output. Do the sources actually support the extremes?
  *   **Process Check:** Did the JA follow the Stop Rules? (e.g., Did they stop at 10 papers or keep going until they found a result they liked?)
  *   **The "Smell" Test:** The SA reads the synthesis. Does the conclusion follow from the tables provided? If the table says "mixed evidence" but the text says "strong consensus," flag.

  **If Verification > 1 Hour:** The factors are too granular. Merge them. If verification is impossible (e.g., requires domain knowledge to interpret a graph), the task was not factorable. Move it to the Leader.

  #### 4. Depth & Recursion
  *   **Max Depth:** 2 Levels. (Leader -> JA/Model -> Leader/SA).
  *   **Why:** Recursion is not free. It introduces signal loss. In a 4-person team, communication overhead kills the efficiency gains of a third layer.
  *   **Splitting Criteria:** Split a factor only if the JA cannot complete it within 4 hours of focused work. If it takes 4 hours, it is likely too complex to verify in 6 minutes.

  #### 5. Error Composition & Systemic Bias
  *   **The Risk:** If the JA and the Model use the same search tools and similar heuristics, they will make the *same* mistakes (correlated error).
  *   **Mitigation:** Assign the same factor to the JA and the Model independently. Compare outputs. If they diverge, the Leader investigates. If they converge, confidence increases (but beware of shared hallucination).
  *   **The "Quiet Wrong" Failure:** If a source is fundamentally flawed (e.g., a retracted paper), both JA and Model might use it.
      *   *Procedure Fix:* Require "Source Triangulation." Every key claim must be supported by at least two distinct types of sources (e.g., one academic paper, one government dataset).

  #### 6. The Human Hand-Off
  The procedure stops and hands back to a person when:
  *   **Values are involved:** "Should we prioritize cost over safety?"
  *   **Contradiction is irreconcilable:** Factor A says X, Factor B says Not X, and both passed verification.
  *   **The "So What":** Moving from "The data says X" to "Therefore we should do Y."

  ---

  ### Application to Your Queue

  Here is how you run MVI on your three specific tasks.

  #### Task 1: Congestion Pricing Elasticity
  *Sub-task: "Establish what the evidence says about how much per-mile driving responds to a per-mile charge."*

  *   **Factorability:** **High.** This is an empirical retrieval task.
  *   **Spec:**
      *   *Input:* Search terms: "congestion pricing elasticity," "cordon pricing demand response." Sources: EconLit, Google Scholar, DOT reports.
      *   *Output:* Table of 5-8 studies. Columns: Location, Year, Methodology, Point Estimate, Confidence Interval.
      *   *Stop Rule:* Stop when 3 studies agree within 10% of each other, or after 6 hours.
      *   *Flag:* If studies measure "traffic volume" instead of "per-mile driving," flag as mismatch.
  *   **Verification:** SA picks 2 studies from the table. Checks the abstract of the original paper. Confirms the number matches. Checks if the "per-mile" definition matches the memo's definition.
  *   **Risk:** Definition drift. One study measures "entries into zone," another measures "total VMT."
  *   **Fix:** Spec must explicitly define "per-mile driving" and require JA to flag if study measures something else.

  #### Task 2: Battery Chemistry Cost Competitiveness (2035)
  *Sub-task: "Will this battery chemistry be cost-competitive with incumbents by 2035?"*

  *   **Factorability:** **Low/Medium.** This is a forecast, not a retrieval. It relies on assumptions.
  *   **Procedure Adjustment:** Do not factor the *answer*. Factor the *inputs to the model*.
  *   **Spec:**
      *   *Factor A (JA):* "Find current raw material costs for [Chemistry] and [Incumbent]. Find projected mining capacity for 2030-2035." Output: Cost table with sources.
      *   *Factor B (Model):* "Take Factor A's cost table. Apply standard learning curve rates (provide 3 scenarios: optimistic, base, pessimistic). Output: $/kWh in 2035."
      *   *Factor C (JA):* "Find 3 expert forecasts for this specific chemistry from 2023-2024. Summarize their 2035 price targets."
  *   **Verification:** SA checks Factor A's current costs against a known benchmark (e.g., BloombergNEF). SA checks Factor B's math (easy). SA compares Factor B's output to Factor C's expert forecasts. If Model says $50/kWh and Experts say $150/kWh, flag.
  *   **Risk:** Garbage In, Garbage Out. The learning curve assumption is the hidden variable.
  *   **Fix:** The Spec for Factor B must require the Model to output the *assumptions* explicitly, not just the number. SA verifies the assumptions, not the math.

  #### Task 3: Drafting Argument & Recommendations
  *Sub-task: "Draft the memo's actual argument and recommendations section."*

  *   **Factorability:** **No.** This is the "Judgment wearing a checklist's clothes" trap.
  *   **Procedure:** Do not decompose the *writing*. Decompose the *argument mapping*.
  *   **Spec:**
      *   *Step 1 (JA/Model):* "Extract the top 3 findings from the previous memo sections. For each finding, list 2 potential policy implications." (Output: List, not prose).
      *   *Step 2 (Leader/SA):* Select the implications that align with foundation goals.
      *   *Step 3 (Model):* "Draft the section using *only* the selected implications. Tone: Conservative. Structure: Claim -> Evidence Ref -> Recommendation."
      *   *Step 4 (SA Verification):* Check that every recommendation maps back to a specific finding from Step 1. If a recommendation appears that isn't supported by a finding, cut it.
  *   **Why this works:** You are factoring the *logic chain*, not the *persuasion*. The SA verifies the links in the chain, not the quality of the prose.
  *   **Risk:** The Model smooths over gaps in logic with confident language.
  *   **Fix:** SA reads the draft *without* the evidence refs. Does the argument hold? Then check the refs.

  ---

  ### Uncertainty & Kill Criteria

  **Steps I am least sure about:**
  1.  **The 60-Minute SA Verification:** I am marking this as **High Risk**. Verifying a 15-page memo built on unfamiliar topics in 60 minutes is functionally impossible if "verify" means "ensure truth." It only works if "verify" means "ensure process compliance." If your SA finds that process compliance does not correlate with memo quality, this step must change.
  2.  **Task 3 (Recommendations):** I am skeptical that factoring the logic chain prevents "hollow" recommendations. The value of a recommendation is often in the *weighting* of trade-offs, which is hard to spec.

  **Evidence to Scrap the Procedure:**
  Run this for 4 memos. Scrap the procedure if:
  1.  **The "Silent Error" Rate:** In post-mortems (e.g., 3 months later when more data comes out), you find that >20% of your memos contained a factual error that the SA verification *could have* caught but didn't because the spec was too narrow.
  2.  **Spec Overhead:** If you (the Leader) spend more than 2 hours total writing specs for a memo than you would have spent just outlining it yourself, the decomposition overhead is too high.
  3.  **JA Bottleneck:** If the JA spends >50% of their time asking you for clarification on the specs rather than executing, your specs are bad or the tasks are not factorable.

  **Challenging Your Premises:**
  1.  **"Checking is cheaper than doing":** This is **False** in research. In coding, checking a function is easy. In research, checking a literature review is often harder than writing it because you have to read the sources anyway.
      *   *Correction:* Your procedure must rely on **Provenance Checking** (did they find real sources?) not **Truth Checking** (are the sources right?). If you need Truth Checking, you need an expert, not a procedure.
  2.  **"Recursion comes free":** This is **False**. Every hand-off loses context.
      *   *Correction:* Limit to 1 hand-off (Leader -> JA). Do not let the JA delegate to an intern or another model without your direct spec. The "tree" should be flat, not deep.

  **Load-Bearing & Shaky Premise:**
  The shakiest premise is that **Process Compliance implies Quality.**
  You are assuming that if the JA follows the spec perfectly, the output is useful. In complex research, the "magic" often happens when the researcher deviates from the plan because they found something weird. A rigid spec might prevent the JA from noticing the anomaly that matters most.
  *   *Fix:* Add a "Anomaly Report" field to every Spec. The JA *must* write one sentence about something that didn't fit the spec. This captures the value of human intuition that the procedure tries to replace.

  ### Summary Recommendation
  Your constraint is not labor; it is **verification bandwidth**.
  1.  Stop trying to verify *truth*. Verify *provenance* and *logic flow*.
  2.  Do not factor the Recommendations (Task 3). Factor the *inputs* to the recommendations, then write the recommendations yourself or with the SA.
  3.  If the SA cannot verify a factor in 10 minutes, the factor is too big. Split it or take it back.
  4.  Expect systemic bias (Model + JA agreeing on wrong info). Mitigate by requiring conflicting source types.

  If you run this and the SA feels they are "rubber stamping" rather than "auditing," stop immediately. That is the signal that the procedure is generating false confidence.
