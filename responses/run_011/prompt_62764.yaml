  ### The Decision Tree of the Joint

  This tree maps the logical space of your novel's central conflict. It does not begin with names or schools, but with three questions derived strictly from the observable conditions of your joiner and his granddaughter. A reader can answer these based on the text alone; the philosophical position is the consequence of their answers.

  **Node 1: The Stroke Test**
  *Is the physical capacity to execute the cut a necessary condition for possessing the knowledge of how to make it?*
  *   **YES:** The grandfather does **not** know how to join wood. His knowledge died with his motor neurons.
  *   **NO:** The grandfather **does** know how to join wood. His knowledge survives in his mind, voice, and pencil, severed from his right arm.

  **Node 2: The Silence Test**
  *Is the granddaughter's inability to explain her cuts evidence that she follows no rules, or that she follows rules she cannot access?*
  *   **NO RULES:** Her skill is a habit of the hand, a trained disposition without internal representation.
  *   **HIDDEN RULES:** Her skill is guided by propositional knowledge (rules/truths) that exists in her mind but is locked away from her speech.

  **Node 3: The Unity Test**
  *When we say the grandfather "knows" and the granddaughter "knows," are we describing the same kind of relation to the craft?*
  *   **SAME:** There is one single phenomenon called "knowing-how." One of them has it fully, the other partially, or they both have it in different states.
  *   **DIFFERENT:** The word "know" is doing two different jobs. They possess two distinct phenomena that happen to share a name.

  ***

  ### The Leaves (Positions)

  Following the branches above leads to these six philosophical positions. Four are populated by existing theories; two are logically possible but philosophically barren (see *Empty Space* below).

  **1. [YES] → [HIDDEN RULES] → [SAME]**
  **Position: Standard Intellectualism**
  *   **The View:** Knowing-how is a species of knowing-that.
  *   **The Characters:** The grandfather knows the propositions but lacks the motor capacity to manifest them. The granddaughter also knows the propositions (implicitly) and has the motor capacity to manifest them. She is a theorist who cannot speak; he is a theorist who cannot cut.
  *   **The Conflict:** A debate over access. He tries to give her the words for what she already unconsciously knows; she tries to show him that the words are irrelevant to the cut.

  **2. [YES] → [NO RULES] → [SAME]**
  **Position: Rylean Anti-Intellectualism**
  *   **The View:** Knowing-how is a distinct, multi-track disposition to succeed. It is not propositional.
  *   **The Characters:** The grandfather does **not** know how to join wood (he lacks the disposition to succeed). The granddaughter **does** know how (she has the disposition).
  *   **The Conflict:** A debate over authority. He claims authority based on past possession and theoretical understanding; she claims authority based on present success. He is a historian of the craft; she is the craft itself.

  **3. [NO] → [NO RULES] → [SAME]**
  **Position: Unified Dispositionalism**
  *   **The View:** Knowing-how is a disposition, but one that can exist even if temporarily blocked from manifestation.
  *   **The Characters:** Both possess the same kind of disposition. His is neurologically blocked; hers is fluent.
  *   **The Conflict:** A debate over potential. He argues his knowledge is intact because the disposition remains (proven by his left hand and dictation); she argues that a disposition that cannot cut is a contradiction in terms.

  **4. [NO] → [HIDDEN RULES] → [DIFFERENT]**
  **Position: Disjunctive Hybrid**
  *   **The View:** "Knowing-how" is an ambiguous term. The grandfather knows-that (propositional); the granddaughter knows-how (procedural).
  *   **The Characters:** They do not share a craft; they share a workspace. He possesses the *science* of joinery; she possesses the *art*.
  *   **The Conflict:** A tragedy of translation. They are speaking different languages. He offers truths; she offers cuts. Neither can validate the other.

  **5. [NO] → [NO RULES] → [DIFFERENT]**
  **Position: Radical Disjunctivism**
  *   **The View:** The grandfather possesses a theoretical state; the granddaughter possesses a bodily state. Neither is "knowledge" in the full sense without the other.
  *   **The Characters:** Both are incomplete. He is a mind without a body; she is a body without a mind.
  *   **The Conflict:** A symbiotic struggle. They need each other to constitute a single "knower."

  **6. [YES] → [HIDDEN RULES] → [DIFFERENT]**
  **Position: Asymmetric Intellectualism**
  *   **The View:** The grandfather lacks know-how (no ability). The granddaughter possesses know-that (implicit rules).
  *   **The Characters:** She is the true knower (silently); he is the failed knower (vocally).
  *   **The Conflict:** Irony. He teaches her words she already implicitly owns; she validates truths he can no longer test.

  ***

  ### Empirically Indistinguishable Pairs

  These are pairs of leaves where the philosophical distinction makes no difference to the observable action in the workshop. If you write a scene relying on the difference between these two positions, the characters themselves cannot verify it.

  *   **Standard Intellectualism (1) vs. Asymmetric Intellectualism (6)**
      *   **Why:** In both cases, the granddaughter operates on implicit rules she cannot speak, and the grandfather operates on explicit rules he cannot execute. Whether we label his state "knowledge" or "failed knowledge" changes the metaphysics, but not the stroke of the saw or the dictation of the measurement.
  *   **Rylean Anti-Intellectualism (2) vs. Disjunctive Hybrid (4)**
      *   **Why:** In both cases, the granddaughter cuts without rules, and the grandfather speaks without cutting. Whether her skill is the *same kind* of thing he used to have (Rylean) or a *different kind* of thing entirely (Hybrid) does not change the fact that she cannot explain the cut and he cannot make it.
  *   **Unified Dispositionalism (3) vs. Standard Intellectualism (1)**
      *   **Why:** Both claim the grandfather retains "knowledge." Whether that knowledge is a "blocked disposition" or "propositional content" is invisible. He still draws the dovetail; he still cannot cut it. The reader sees the same tragedy regardless of the label.

  ***

  ### Empty Logical Space

  These are combinations of answers your tree permits, but which no coherent philosophical position occupies. Writing a scene that assumes these combinations will feel "off" to a reader sensitive to logic, as they describe states that essentially cancel themselves out.

  *   **[YES] + [NO] + [HIDDEN RULES]**
      *   *Execution is necessary, Granddaughter has no rules, Grandfather knows.*
      *   **Why Empty:** Incoherent. If execution is necessary for knowledge (YES), the grandfather cannot know (he cannot execute). You cannot have it both ways.
  *   **[YES] + [NO] + [SAME] + [Grandfather Knows]**
      *   *Execution is necessary, Skill is non-propositional, Concept is unified, Grandfather knows.*
      *   **Why Empty:** Incoherent. This is the definition of a contradiction. If ability is required, and he has no ability, he has no knowledge.
  *   **[NO] + [HIDDEN RULES] + [SAME] + [Granddaughter Doesn't Know]**
      *   *Execution not necessary, Granddaughter follows rules, Concept is unified, Granddaughter lacks knowledge.*
      *   **Why Empty:** Unattractive/Unexplored. If she follows the rules (Hidden Rules) and execution isn't required (NO), she meets all criteria for Intellectualist knowledge. To say she *doesn't* know requires inventing a new barrier (e.g., "she must also intend to know"), which no major theory supports.
  *   **[YES] + [HIDDEN RULES] + [Grandfather Knows]**
      *   *Execution is necessary, Granddaughter has rules, Grandfather knows.*
      *   **Why Empty:** Incoherent. Same as above. If execution is necessary, the stroke victim is disqualified from knowledge by definition.
  *   **[NO] + [NO RULES] + [Granddaughter Doesn't Know]**
      *   *Execution not necessary, Granddaughter has no rules, Granddaughter lacks knowledge.*
      *   **Why Empty:** Unattractive. If execution isn't necessary, and she executes perfectly, on what grounds do we deny her knowledge? This leaves her success as a miracle or accident, which undermines the premise of her being a master joiner.
