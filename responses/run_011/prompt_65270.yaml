answer: |-
  **Recommendation:** I recommend we **refuse** the prize for this nomination, while adopting a clarified standard for future cycles that distinguishes between causal falsification and causal overdetermination.

  **Memorandum to the Jury**

  Colleagues,

  We are convened to interpret a charter requiring that a qualifying prediction's outcome must have obtained "substantially as described." The division before us mirrors a classic tension in the philosophy of science: between instrumentalism, which values predictive success regardless of theoretical truth, and realism, which demands that success accrue to the correct explanatory model. Our two colleagues favoring award argue that a hit is a hit. Our colleague favoring refusal argues that a hit derived from a falsified theory is scientifically worthless. I believe both positions capture part of the truth, but neither suffices for this specific case.

  Regarding the causal route: Can a prediction be confirmed by an outcome arrived at via a mechanism the theory did not contain? In the context of a wager, yes. In the context of a scientific prize, no. The Simon–Ehrlich bet is often cited as precedent, but it is a category error to apply it here. That wager concerned price movements over a fixed decade; it required no explanation of *why* prices moved, only *that* they moved. It was a bet on market volatility, not a test of resource depletion theory. Our foundation prize, however, honors "empirical forecasting," which implies a claim to understanding the system being forecast. If we award a prediction where the specified mechanism (population pressure outstripping land) was explicitly contradicted by the record (yields rose, availability increased), we sever the link between forecasting and understanding. We would be rewarding a lucky coincidence of timing and mortality, not scientific insight. The outcome matched the *number*, but not the *description*, as the charter requires. The description included a "because." That "because" was wrong.

  This leads to the defense mounted by the nominee's students: that the forecast was "right but early," and that the war was an intervening variable. We must ask whether this counterfactual appeal is a legitimate auxiliary hypothesis or an *ad hoc* rescue. In Lakatosian terms, a research program progresses when it predicts novel facts; it degenerates when it adds clauses solely to evade falsification. To claim "had the war not intervened, the famine would have happened" is unfalsifiable unless the theory itself specifies the conditions under which demographic pressure translates to famine independent of distribution. For a "right but early" defense to be legitimate, the forecast must include a temporal window with a specified tolerance, or the mechanism posited must remain operative and measurable during the delay. Here, the mechanism vanished (yields rose), and the delay was caused by a historical contingency (war) not modeled by the theory. This is not a refinement; it is a rescue device. To accept it is to make the theory immune to evidence, violating the basic norm of empirical science.

  Regarding the companion failure in the second region: The students argue this should be discounted because an auxiliary assumption about irrigation pace was mistaken. However, auxiliary assumptions are the bridge between theory and reality. If a theory of demographic famine relies on assumptions about agricultural technology that prove systematically fragile across different regions, the theory lacks robustness. We cannot award a prize for a "successful" prediction in Region A while ignoring a failed prediction in Region B based on the same theoretical core, unless the failure in B is due to factors explicitly excluded from the model. Here, the failure was due to the very variables (irrigation adoption) the model attempted to account for. This counts against the nomination because it suggests the 1993–94 hit was not a replication of a law-like regularity, but a singular event.

  I anticipate the objection that demanding causal consistency sets an impossible standard. If we require demonstrated mechanisms, will the prize only ever go to safe, short-horizon, near-tautological calls? This is a serious worry. Long-range social forecasting cannot provide the causal certainty of a physics experiment. If we demand proof of mechanism, we nullify the prize. However, there is a middle ground between "proof of mechanism" and "ignorance of mechanism." We need not demand that the forecaster *prove* the cause, only that the record does not *falsify* it. In this case, the record did falsify it. Yields per head rose. The Malthusian mechanism was not merely unproven; it was contradicted. We can award a prize where the mechanism is plausible but unverified; we cannot award where it is verified false.

  Therefore, to guide future juries when faced with timing-displaced predictions or complex causal chains, I propose we adopt the following rule:

  **The Rule of Causal Consistency:** A long-range forecast qualifies for the prize if the outcome matches the quantitative and qualitative description of the charter, provided that the empirical record does not explicitly contradict the central causal mechanism posited by the forecaster. Where outcomes are delayed or mediated by intervening variables, the defense is valid only if the posited mechanism remained operative during the delay, or if the intervening variables were accounted for in the original model's auxiliary assumptions.

  This standard protects us from rewarding luck while avoiding the trap of demanding impossible mechanistic proof. It allows for "causal overdetermination"—where multiple causes could produce the outcome—but forbids "causal inversion"—where the outcome occurs despite the specified cause being absent.

  In this specific case, the mechanism was inverted. Population pressure existed, but it did not cause the famine; policy and war did. The companion failure shows the theory's fragility. The "right but early" defense is unfalsifiable counterfactuals. While we must remain open to the inherent uncertainty of long-range social science, we cannot award a prize that validates a theory explicitly contradicted by the data it sought to predict. To do so would undermine the foundation's mission to encourage rigorous forecasting rather than fortunate guessing.

  I urge you to vote for refusal, but to adopt the Rule of Causal Consistency for our next cycle. This preserves the integrity of the prize without rendering it unwinable.

  Respectfully,

  [Your Name]
