answer: |-
  1. **Is "obligation in abeyance" a genuine carving?**
     It is currently a redescription that collapses under scrutiny, primarily due to a terminological error in your definition. You write: *"a duty... which the duty-holder can activate unilaterally."* In conscription, the *state* (the obligee) activates the duty, not the *conscript* (the duty-holder). If you mean the state, this is simply a standing legal power coupled with a conditional obligation. There is no new ontological category here; there is only a specific *temporal* configuration of standard public law powers.

     To make this carve work, you must shift from legal ontology to political phenomenology. The work "abeyance" does is not in the structure of the duty, but in the *uncertainty* it imposes. A conditional duty where the condition is "war" is different from a conditional duty where the condition is "government discretion." Your definition conflates these. If you cannot distinguish abeyance from a standard contingent liability (e.g., tax rates that can be raised by parliament without new statutes), the category is empty. It fails because it describes a *capacity* (the state's power to call) rather than a distinct *obligation*.

  2. **Does the closing dilemma hold?**
     The dilemma is manufactured by conflating the *intensity* of interference with the *status* of domination. Pettit's theory does not require you to rank a system that dominates 4% of people as "worse" than one that dominates 80% in terms of aggregate welfare. It ranks the *relationship*. A Finn is a subject of a rule-bound system; a Swede (2010–2017) was a subject of discretionary power. On strict non-domination grounds, the Swede is *more* dominated, even if fewer are interfered with.

     Your dilemma assumes non-domination must yield a verdict on the *justice of the system overall*, rather than the *freedom of the agent*. If you accept that the Swede is more dominated (higher status vulnerability) but the Finn suffers more interference (higher cost), the dilemma dissolves. You are trying to force FND to do utilitarian calculus.

     However, there is a stronger republican reply you ignore: *tracking*. You admit Sweden's reactivation was "publicly reasoned" and "ratified." If the power tracks the interests of the cohort (e.g., via parliamentary oversight), it is not arbitrary. Your claim that the government reactivated it "by decision" is the weak link. If the legal framework required parliamentary notification or adhered to strict criteria, the "switch" is not arbitrary. The dilemma holds only if you can prove the discretion was arbitrary. If it was tracked, there is no domination, dormant or not.

  3. **Is the Swiss exemption tax a counterexample?**
     It is a counterexample to the claim that service is *inalienable*, but not to the claim that it is *non-commodifiable*. You frame the tax as an "exchange rate." This is empirically false for the exempted. For those deemed medically unfit, the tax is not a price for buying out service; it is a penalty for incapacity. They cannot perform at any price.

     This undermines your "exchange rate" framing. A market requires two willing parties and the capacity to deliver. The Swiss system creates a liability for those who *cannot* transact. This makes the tax less a commodification of duty and more a surcharge on citizenship for the disabled. If you want to use Switzerland to attack inalienability, you must isolate the able-bodied who choose to pay. If you include the unfit, you are not discussing the alienability of service, but the taxation of incapacity.

  4. **Are the institutional facts correct?**
     There are significant inaccuracies regarding Sweden that threaten the "arbitrariness" premise.
     *   **Sweden:** You state the government reactivated conscription in 2017 "by decision... without new primary legislation." While technically the 1994 Act remained, the reactivation was a policy shift announced by the government and supported by the Riksdag following a Defence Commission report. It was not an executive fiat. Furthermore, since 2018, Swedish conscription is gender-neutral. Your draft implies a male cohort ("Take Finland... male age cohort... Now take Sweden"). If you are comparing male cohorts, the Swedish data post-2018 is not comparable to Finland's male-only draft.
     *   **Finland:** The custodial term for refusal is technically accurate but misleading. In practice, most sentences are suspended, and the Non-Military Service Act allows for civilian service. Presenting it as a hard "six months" ignores the administrative filtering that occurs before custody.
     *   **Switzerland:** The exemption tax is accurate (3% of taxable income), but the cap and the credit system for civil protection are more complex than "four per cent off that year's levy." It is a deduction from the tax liability, not a direct credit against service days in a simple ratio.

     **Correction:** The Swedish case is your linchpin. If the reactivation required broad political consensus and was not an arbitrary executive switch, your application of Pettit fails. You need to verify if the 2017 reactivation allowed for *individual* discretion by the state in selecting conscripts that was untracked. If the selection criteria were published and binding, the "arbitrariness" claim is weak.

  5. **Strongest Unstated Objection.**
     **The Deterrence Objection:** The paper treats the *existence* of the dormant power as a normative bug (domination). A security realist or functionalist argues it is a normative feature (deterrence). The value of a dormant draft lies precisely in the *uncertainty* it creates for adversaries, not just for citizens.

     If the power must be non-arbitrary to avoid domination, it must be rule-bound. If it is rule-bound and transparent, adversaries can calculate the mobilization timeline and capability. If the state retains some discretion (abeyance), it preserves strategic ambiguity.

     **Impact:** This objection forces you to weigh *political domination* against *national security*. Your paper currently assumes the former is the only relevant metric. If the dormant draft prevents invasion, the domination incurred might be justified under a "necessary evil" framework similar to taxation or surveillance.

     **Restructuring:** You cannot simply assert the domination is problematic. You must argue that the *form* of the power (dormant vs. active) is unnecessary for the security goal. If Finland's rule-bound system provides equal security with less domination, your argument holds. If Sweden's dormant system provides *better* security due to flexibility, your critique of abeyance looks like a luxury of safe geopolitics. The paper needs to engage with the *necessity* of the dormant form, not just its existence.
