  **Bottom line**
  The argument is valid but unsound. The flaw lies in Premise (4), which relies on an equivocation about what counts as authorization over time. You can keep (1) without accepting (7) by recognizing that prior consent by a continuous agent satisfies the legitimacy condition. Rhi is right that the logic holds, but wrong that the premises describe reality.

  **Where the slide is**
  The trouble starts at (4) and snaps in the jump to (6). The word "authorises" is doing two different jobs. In (1), it means "legitimated by consent." In (4), it subtly shifts to mean "consents at the time of enforcement." This assumes that because your desires change, your authority resets. But when Ulysses ties himself up, he isn't a stranger to the later screaming man; he is the same agent executing a plan. Premise (4) treats the later self as a distinct political body requiring fresh consent, mirroring the generational split in (2), but ignores that authorization can be prospective. If I sign a mortgage, I authorize the bank to take my money next year. The "me" next year didn't sign anything then, but the "me" today did for both of us. The slide treats the later self's *desire* to be free as evidence that the act wasn't *authorised*, conflating regret with illegitimacy. The later Ulysses didn't authorize the tying at t2, but the person Ulysses authorized it at t1 for the duration. By demanding contemporaneous consent for every burden, (4) makes any long-term planning impossible, not just constitutions. The inference to (6) only works if you accept that temporal segments of a person are morally distinct strangers, which contradicts the basic idea of a unified agent capable of commitment. You are treating time like borders between nations, when it's really just one life.

  **The two exits**
  Exit One is to reject (4) by asserting personal identity over time. You argue that the earlier self and later self are the same moral owner, so the earlier self's authorization covers the later self's burdens. This preserves the Ulysses pact: the binding is legitimate because the person who owns the later body consented at the start. It treats the person as a single entity stretching across time, not a series of fleeting moments. Exit Two is to reject the inference to (6) while keeping a modified (4). You argue that authorization doesn't require the later self to *want* the binding, only that the binding follows the authorized procedure. Here, legitimacy comes from the integrity of the plan, not the mood at t2. This distinguishes between *binding* (which happened at t1) and *unbinding* (which requires following the t1 rules). Rhi's mistake is thinking legitimacy requires ongoing consent rather than consent to a binding procedure. If Ulysses authorized the crew to ignore him, the later screaming doesn't invalidate the order; it just confirms the need for it. Both exits save rational self-binding, but they ground it differently: one in identity, the other in procedure. The first says "I am him." The second says "I agreed to the rules."

  **What each costs**
  Rejecting (4) costs future flexibility. It admits that your past self can override your present desires, which feels like heteronomy but is necessary for any long-term agency. For constitutions, it means the dead can bind the living, provided they are the same political people. Rejecting (6) costs clarity on when binding ends. It implies amendment rules are the only legitimate release valve. If a later majority ignores the rule, they aren't exercising freedom; they're breaking the pact. Either way, you save constitutionalism, but you must accept that legitimacy relies on procedural continuity, not just current popular will. Regarding Rhi's amendment point: if you reject (4), following the amendment rule is just the earlier self giving the later self a key. If you reject (6), the amendment rule is the only way the later self regains authority without illegitimacy. In both cases, the entrenched clause stands until the procedure is used, defeating Rhi's claim that precommitment is impossible. The cost is admitting that democracy isn't just about what people want now, but about what they agreed to then.
