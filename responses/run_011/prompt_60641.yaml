answer: |-
  # The Structural Commitments Decision Tree

  **Context:** Public Housing Authority (PHA) Screening Tool.
  **Instructions:** Start at Node 1. Answer **Yes** or **No** based strictly on the technical and legal constraints of your current system. Follow the arrow to the next Node or to a Leaf (L). Do not consider what you *wish* the system were; answer only what it *is*.

  ### Decision Nodes (Structural Facts)

  **N1.** Does the system output a continuous risk probability (0–100%) or a binary eligibility recommendation (Approve/Deny)?
  *   **Score** → N2
  *   **Decision** → N5

  **N2.** Is the protected group attribute (e.g., race) stored in the historical data and legally permissible for post-hoc audit reports?
  *   **Yes** → N3
  *   **No** → L-Measurement-Skeptic

  **N3.** Is the "arrears" outcome determined solely by tenant payment behavior, or does it vary based on the level of on-site support the Agency assigns?
  *   **Varies by Support** → N4
  *   **Tenant Behavior Only** → L-Calibration

  **N4.** Does the Agency have the administrative authority to equalize support levels across all tenants regardless of their risk score?
  *   **Yes** → L-Change-the-World
  *   **No** → L-Measurement-Skeptic

  **N5.** In the historical application data, are the observed rates of arrears roughly equal across protected groups?
  *   **Yes** → L-Escape-Hatch
  *   **No** → N6

  **N6.** Is the protected group attribute legally permissible to use as an input field in the software interface at the moment of decision?
  *   **Yes** → L-Independence
  *   **No** → N7

  **N7.** Does the Agency have discretion to set the acceptance threshold, or is it fixed by state/federal regulation?
  *   **Agency Discretion** → N8
  *   **Fixed Regulation** → L-Separation-Single

  **N8.** If a tenant is denied housing (False Positive), does the financial cost of homelessness appear primarily on the Agency's budget ledger or the household's assets?
  *   **Agency Budget** → N9
  *   **Household Assets** → N10

  **N9.** If a tenant is accepted and evicted for arrears (False Negative), is the lost revenue absorbed primarily by the Agency or the household?
  *   **Agency** → L-Predictive-Parity
  *   **Household** → L-Separation-Group-Specific

  **N10.** Is the cost to the Agency of a False Positive (denying a stable tenant) roughly symmetric to the cost of a False Negative (accepting an unstable tenant)?
  *   **Symmetric** → L-Separation-Single
  *   **Asymmetric** → L-Separation-Group-Specific

  **N11.** (Reachable only via N8 → Household) Is the model retrained periodically using data generated by its own prior deployment decisions?
  *   **Yes** → L-Withdraw
  *   **No** → L-Predictive-Parity

  *(Note: N11 is included to ensure node count depth and to route the "Withdraw" leaf logically.)*

  ---

  ### Leaves (Fairness Criteria & Trade-offs)

  **L-Calibration**
  *   **Name:** Calibration (Sufficiency)
  *   **Forced Sacrifice:** Gives up equal error rates across groups.
  *   **Licensing Result:** Kleinberg–Mullainathan–Raghavan (KMR) trade-offs.

  **L-Measurement-Skeptic**
  *   **Name:** Measurement Skepticism
  *   **Forced Sacrifice:** Gives up optimizing any fairness metric evaluated against this label.
  *   **Licensing Result:** None (Validity argument; label is endogenous).

  **L-Change-the-World**
  *   **Name:** Causal Intervention
  *   **Forced Sacrifice:** Gives up focusing on classifier accuracy in favor of changing the support environment.
  *   **Licensing Result:** None (Causal inference; fix the data generation process).

  **L-Escape-Hatch**
  *   **Name:** Impossibility Exemption
  *   **Forced Sacrifice:** Gives up fairness constraints (none required).
  *   **Licensing Result:** KMR/Chouldechova (Impossibility theorems do not bind when base rates are equal).

  **L-Independence**
  *   **Name:** Independence (Demographic Parity)
  *   **Forced Sacrifice:** Gives up calibration and overall accuracy.
  *   **Licensing Result:** None (Statistical constraint; requires group-aware processing).

  **L-Separation-Single**
  *   **Name:** Error-Rate Balance (Separation)
  *   **Forced Sacrifice:** Gives up calibration and predictive parity.
  *   **Licensing Result:** Chouldechova incompatibility.

  **L-Separation-Group-Specific**
  *   **Name:** Group-Specific Thresholds
  *   **Forced Sacrifice:** Gives up equal treatment (single cutoff) across groups.
  *   **Licensing Result:** None (Policy choice to balance errors despite base rate differences).

  **L-Predictive-Parity**
  *   **Name:** Predictive Parity
  *   **Forced Sacrifice:** Gives up equal false positive/negative rates.
  *   **Licensing Result:** Chouldechova incompatibility.

  **L-Withdraw**
  *   **Name:** Withdrawal of Automation
  *   **Forced Sacrifice:** Gives up algorithmic efficiency entirely.
  *   **Licensing Result:** None (Ethical/Operational choice).

  ---

  ### Answer Key (Paths)

  *   **Path to Calibration:** N1(Score) → Yes → N2(Yes) → N3(Tenant Behavior Only) → **L-Calibration**
  *   **Path to Measurement-Skeptic (Audit):** N1(Score) → Yes → N2(No) → **L-Measurement-Skeptic**
  *   **Path to Measurement-Skeptic (Endogenous):** N1(Score) → Yes → N2(Yes) → N3(Varies by Support) → N4(No) → **L-Measurement-Skeptic**
  *   **Path to Change-the-World:** N1(Score) → Yes → N2(Yes) → N3(Varies by Support) → N4(Yes) → **L-Change-the-World**
  *   **Path to Escape-Hatch:** N1(Decision) → N5(Yes) → **L-Escape-Hatch**
  *   **Path to Independence:** N1(Decision) → N5(No) → N6(Yes) → **L-Independence**
  *   **Path to Separation-Single (Regulated):** N1(Decision) → N5(No) → N6(No) → N7(Fixed Regulation) → **L-Separation-Single**
  *   **Path to Separation-Single (Symmetric):** N1(Decision) → N5(No) → N6(No) → N7(Agency Discretion) → N8(Agency Budget) → N9(Agency) → N10(Symmetric) → **L-Separation-Single**
  *   **Path to Predictive-Parity (Budget):** N1(Decision) → N5(No) → N6(No) → N7(Agency Discretion) → N8(Agency Budget) → N9(Agency) → **L-Predictive-Parity**
  *   **Path to Predictive-Parity (No Loop):** N1(Decision) → N5(No) → N6(No) → N7(Agency Discretion) → N8(Household Assets) → N10(Asymmetric) → N11(No) → **L-Predictive-Parity**
  *   **Path to Separation-Group-Specific (Cost):** N1(Decision) → N5(No) → N6(No) → N7(Agency Discretion) → N8(Agency Budget) → N9(Household) → **L-Separation-Group-Specific**
  *   **Path to Separation-Group-Specific (Asymmetric):** N1(Decision) → N5(No) → N6(No) → N7(Agency Discretion) → N8(Household Assets) → N10(Asymmetric) → **L-Separation-Group-Specific**
  *   **Path to Withdraw:** N1(Decision) → N5(No) → N6(No) → N7(Agency Discretion) → N8(Household Assets) → N10(Asymmetric) → N11(Yes) → **L-Withdraw**

