  ### Critical Analysis for Workshop Facilitators

  #### 1. Indistinguishable Leaves
  This tree pretends to resolve distinctions that the structural nodes cannot actually separate. You should flag these two pairs to the cohort:

  *   **Calibration vs. Predictive Parity:** The tree separates these based on Output Type (Score vs. Decision). However, a well-calibrated score thresholded for a decision *produces* predictive parity within the selected group. If the staff treats the score as a decision (which they inevitably do), **L-Calibration** and **L-Predictive-Parity** become functionally identical in outcome, though the vocabulary differs. The tree forces a choice based on software interface (N1) rather than the mathematical reality that Sufficiency implies Predictive Parity at a fixed threshold.
  *   **Separation-Single vs. Separation-Group-Specific:** The tree separates these based on Cost Symmetry (N10) or Regulation (N7). However, both leaves satisfy the definition of *Separation* (equal error rates). The distinction is merely whether you use one cutoff or two. The tree presents them as distinct fairness criteria, but they are the *same* criterion implemented with different degrees of legal risk. The nodes cannot distinguish the ethical weight of "one cutoff" vs "two cutoffs," only the administrative capacity to set them.

  #### 2. Empty Cells (Coherent Paths with No Leaf)
  There are combinations of answers that are logically coherent but lead to no assigned leaf. These reveal gaps in the standard fairness taxonomy.

  *   **Empty Cell A:** **N1(Score) + N2(No Audit Access).**
      *   **Path:** The system outputs a risk score, but the protected attribute is not stored for audit.
      *   **Diagnosis:** This is **Blind Optimization**. It is coherent (many vendors sell this), but there is no leaf for it because no fairness criterion (Calibration, Separation, Independence) can be verified without group data. The tree forces these users to **L-Measurement-Skeptic**, but that implies the *label* is bad, whereas here the *audit data* is missing. This cell is empty because the fairness literature assumes auditability is a prerequisite, not a variable.
  *   **Empty Cell B:** **N3(Varies by Support) + N4(Can Equalize Support) + N1(Decision).**
      *   **Path:** The label is endogenous (support varies), the Agency *could* equalize support, but they choose to optimize the classifier (Decision) anyway.
      *   **Diagnosis:** This is **Bureaucratic Drift**. It is coherent because agencies often prefer tweaking algorithms to restructuring social support budgets. It is unoccupied because the tree treats "Can Equalize Support" as a switch to **L-Change-the-World**. It assumes that if you *can* fix the world, you *will*. It ignores the political inertia that makes fixing the classifier easier than fixing the support structure.
      *   **PHA Diagnosis:** **This Empty Cell B is the position your Housing Authority actually describes.** Your prompt states the label is endogenous (support varies) and implies the Authority runs the screening (suggesting they *could* alter support policy). Yet, you are holding a workshop on *screening tool fairness*, not *support policy reform*. You are occupying the empty cell: optimizing a classifier in a setting where the structural remedy (equalizing support) is available but politically sidelined. Acknowledging this reveals that the "fairness" discussion is likely a proxy for budgetary constraints.
