          *   *Principled Line:* The line is between *argument* (spin/denial) and *evidence* (new facts undermining the verification method).
          *   *Reporter's Instinct:* Not squeamishness. It's epistemic hygiene. If a pillar cracks, you check the roof, you don't pretend the pillar is still solid.
      *   *Nuance:* The suit doesn't prove the specific paper was misdated, but it attacks the *credibility of the verifier*. This requires follow-up, not necessarily a retraction, but a verification of the verifier.

  4.  **Deconstruct Question 3: Standing Policy & The Lawyer's Point.**
      *   *Policy Needs:* A mechanism to distinguish noise from signal. A threshold for re-investigation.
      *   *Triggers:* New documentary evidence, credible whistleblower with new info, evidence undermining a specific verification method (like the supplier suit).
      *   *Settled:* Political denials, ad hominem attacks, previously vetted and discarded theories.
      *   *Lawyer's Point:* "We knew" implies we stopped looking. In defamation law (especially regarding public officials), "actual malice" includes reckless disregard. If you are handed proof you were wrong and you ignore it because "we knew," that is reckless.
      *   *Actionable Policy:* "Verification of Verification." If a source of verification is compromised, re-verify that specific point. Don't re-litigate the whole story, but secure the weak flank.

