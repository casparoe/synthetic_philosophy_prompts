answer: |-
  You have identified a genuine methodological aperture in the philosophy of history. Your intuition is correct: while the *components* of this error are well-named in the philosophy of science and statistics, there is no single, canonical term in the **philosophy of history** that isolates this specific configuration (the retrospective tuning of a cycle's period combined with interpretive flexibility to maintain the pattern).

  Here is the breakdown of the existing terminology, the proposed coinage, and the test you requested.

  ### 1. The Existing Terminology (The Near Neighbors)

  You are right to reject "unfalsifiable" and "Texas Sharpshooter" as imprecise. The configuration you describe is a hybrid of two established concepts from the methodology of science, neither of which captures the whole picture on its own.

  *   **Overfitting (Statistics/Modeling):** This is the closest analog in the sciences. A model is "overfitted" when it has too many free parameters relative to the amount of data, allowing it to fit noise rather than signal. In your examples, the "cycle length" is a **free parameter**. If a theorist can slide the cycle length from 80 to 120 years to make the data fit, they are overfitting.
      *   *Departure:* "Overfitting" is usually a quantitative charge. It does not fully capture the *qualitative* reinterpretation of events (e.g., calling the Ottoman decline a "shell" or a "long winter") that accompanies the period tuning in history.
  *   **Immunizing Stratagem (Lakatos):** In Imre Lakatos's methodology of scientific research programmes, this occurs when a theorist modifies auxiliary hypotheses to protect the "hard core" of the theory from refutation. Explaining away the Ottoman six centuries as "nested cycles" is a classic immunizing stratagem.
      *   *Departure:* Lakatos usually describes this as a reaction to a *failed prediction*. Your observation is sharper: the parameter is often set *during* the initial formulation based on the data, so there is never a moment of failure to react to. It is built into the theory's architecture from the start.
  *   **Accommodation vs. Prediction (Philosophy of Science):** A theory *accommodates* data if it is constructed to fit what is already known; it *predicts* if it specifies outcomes beforehand. Your cyclical theories are accommodating.
      *   *Departure:* This is a binary distinction. It doesn't describe the *mechanism* of the accommodation (i.e., tuning the temporal scale).

  **Verdict:** There is no single established noun in the philosophy of history literature (e.g., in Popper, Aron, Danto, or Oakeshott) that specifically names **the retrospective tuning of a cycle's period protected by interpretive flexibility.**

  ### 2. The Coinage: Retrospective Cycle Calibration (RCC)

  Since the specific configuration lacks a name, I propose the term **Retrospective Cycle Calibration (RCC)**.

  **Definition:**
  RCC is a methodological vice in which a cyclical theory treats the duration of its cycle not as a fixed consequence of its proposed causal mechanism, but as a variable parameter to be optimized against the historical record *after* the record is known, while simultaneously employing interpretive flexibility to define the boundaries of the cycle's phases.

  **The Test for RCC:**
  To determine if a theory suffers from Retrospective Cycle Calibration, apply these three criteria. If the theory fails any of them, it exhibits RCC.

  1.  **The Mechanism Test:** Does the theory derive the cycle length from an independent causal mechanism (e.g., "biological generations are 20 years," "soil depletion takes 50 years")?
      *   *Fail:* If the length is derived from observing the rises and falls first, then positing the cycle.
  2.  **The Boundary Test:** Are the start and end points of the cycles defined by independent markers (e.g., specific wars, coronations, economic indicators) *before* the cycle is applied?
      *   *Fail:* If the boundaries are shifted ("elastic turnings," "long winters") to make the phases fit the predetermined length.
  3.  **The Penalty Test:** Does the theorist incur a "cost" (reduced credibility) when the period must be adjusted or boundaries reinterpreted?
      *   *Fail:* If the adjustment is treated as a refinement rather than a concession.

  ### 3. Boundaries and Comparisons

  You asked how a theory could *lack* this property and whether any real theory manages it.

  *   **How to Lack RCC:** A cyclical theory would need to announce its period *a priori* based on a mechanism external to the historical narrative (e.g., "Climate cycles of 1500 years drive migration") and then apply that fixed period to history without shifting the boundaries to match specific dynasties.
  *   **Real Examples:** Most "philosophies of history" (Spengler, Toynbee) fail this test. However, some **cliometric** or **economic history** attempts come closer. For example, the **Kuznets Cycle** (15–25 years) is tied to demographic migration and infrastructure investment. It is vulnerable to RCC, but because it is tied to quantifiable economic data rather than "cultural styles," it is easier to falsify.
  *   **Comparison to Neighbors:**
      *   *Vs. Unfalsifiability:* A theory can be unfalsifiable without RCC (e.g., "History is the story of God's will"). RCC is a specific *type* of unfalsifiability involving temporal scaling.
      *   *Vs. Texas Sharpshooter:* The Sharpshooter paints the target *after* shooting. In RCC, the target (the cycle) is painted *during* the loading of the gun, using the same data for both calibration and validation.
      *   *Vs. Ad Hoc:* Ad hoc hypotheses are added *later* to save a theory. RCC is often *foundational*; the theory is built on the calibrated period from the start.

  ### 4. The Separate Problem: The $N=1$ Constraint

  You asked whether a theory that announced its period in advance would *still* be in trouble because history is a single series.

  **Yes.** This is a distinct epistemic problem, separate from RCC. Even if a theorist avoids Retrospective Cycle Calibration (by fixing the period in advance), they face the **Problem of Singular History** (or **Sample Size Insufficiency**).

  *   **The Issue:** In statistics, detecting a cycle requires multiple iterations to distinguish signal from noise (the **Yule-Slutsky effect** demonstrates that random noise can be filtered to *look* like cycles). If history happens once, you have $N=1$. You cannot calculate statistical significance.
  *   **The Distinction:** RCC is a sin of **method** (fitting the model to the data). The $N=1$ problem is a sin of **ontology** (the nature of the subject matter).
  *   **Implication:** A theory can be methodologically rigorous (no RCC) and still be epistemically weak because it cannot be statistically validated. Avoiding RCC makes the theory *honest*, but it does not make it *proven*.

  ### 5. Confidence and Uncertainty

  **Confidence Level:** High (85–90%) on the analysis of the methodological structure; Moderate (70%) on the claim that no specific label exists.

  **Point of Least Certainty:**
  I am least certain that **no philosopher of history has ever coined a specific term for this.** The field is vast, and while standard textbooks (Popper, Dray, Walsh) discuss "Historicism" and "Unfalsifiability," it is possible that a specialist in the methodology of historiography (perhaps within the *Annales* school critique or specific cliometric literature) has used a term like "periodization bias" or "temporal smoothing" that functions as the name you seek. However, in the canonical "philosophies of history" seminar curriculum (Polybius to Strauss-Howe), there is no standard label taught for this specific maneuver.

  **Summary Recommendation:**
  Use **Retrospective Cycle Calibration (RCC)** as your diagnostic term. It is precise enough to distinguish the "free dial" problem from general unfalsifiability, and it allows you to acknowledge the separate $N=1$ problem without conflating the two. When discussing Ibn Khaldun or Spengler, you can accurately say: *"Their theories rely on Retrospective Cycle Calibration; the period is a free parameter optimized against the data, protected by immunizing stratagems regarding boundary definitions."* This demonstrates you understand both the historical content and the methodological flaw.
