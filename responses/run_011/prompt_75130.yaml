          *   The "Issuer" question is actually a "Liability" question. Who stands behind the ticket?
          *   Suggested line: "If money is a ticket, the question isn't whether it's paper or digital. It's: what is the ticket *for*, and who is honor-bound to redeem it? If it's just a ticket for 'next person accepts it,' that's a hot potato. If it's a ticket for 'taxes owed' or 'labor commanded,' someone has to enforce that."

  6.  **Review and Refine:**
