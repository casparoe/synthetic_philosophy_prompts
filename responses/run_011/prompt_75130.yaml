      *   **Next Session:** George Berkeley's *The Querist* (1735-37).
      *   **User's Insight:** Berkeley also calls money a "ticket" or "counter" and separates it from metal, but links it to industry/labor. The user suspects Berkeley's view isn't the same as the crypto slogan, despite surface similarities.
      *   **Task:**
          1.  Deconstruct the slogan "money is just a shared fiction" into a menu of distinct claims (whose belief, what is fictional, truth status).
          2.  Determine which readings settle the "issuer matters" question.
