      *   *Language Theory:* Make sure the link between *Alciphron* and *Querist* is clear (signs prompting action).
      *   *Crypto Counter:* Ensure it doesn't sound like "State good, Crypto bad," but rather "Coordination matters."

  7.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure not to conflate Chartalism (Lerner/Kelton) with Berkeley, though they are similar. Keep it focused on Berkeley's text.
      *   *Clarification:* The user asked "which readings settle the issuer question." I need to be explicit there.
      *   *Nuance:* Berkeley's "industry" is key. It's not just "belief," it's belief *in the availability of labor*.

