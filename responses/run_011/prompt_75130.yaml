          4.  Address the "fiction can't buy bread" objection and Berkeley's theory of language/signs.
          5.  Provide a conversational takeaway for the crypto guy (without quoting Berkeley).

  2.  **Deconstruct "Money is Just a Shared Fiction":**
      *   *Goal:* Create a "menu" of interpretations.
