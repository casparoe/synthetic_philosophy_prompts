answer: |-
  **Sorting Instrument: Meaning vs. Worth vs. Value**

  1. Case: Person A is happy but achieves nothing. Person B suffers but cures a disease. Who has more meaning?
     - [Meaning is internal state]: Go to 2.
     - [Meaning requires external impact]: Go to 3.
     - [Neither matters; life is bad]: Pessimism/Nihilism.

  2. Case: Person A is fooled (Experience Machine). Does the feeling count?
     - [Yes, feeling is enough]: Pure Subjectivist.
     - [No, must connect to reality]: Go to 4.

  3. Case: The cure is lost tomorrow. Did the effort matter?
     - [Yes, striving counts]: Go to 5.
     - [No, results must endure]: Go to 6.
     - [Striving is all that exists]: Camus's Absurdism.

  4. Case: Must reality constrain satisfaction?
     - [Yes]: Hybridism.
     - [No]: Pure Subjectivist.

  5. Case: Devoted cultist (wrong but trying). Credit?
     - [Yes, intention suffices]: Hybridism.
     - [No, truth is required]: Pure Objectivist.
     - [Trying is all]: Camus's Absurdism.

  6. Case: Heat death erases value?
     - [Yes, permanence required]: Pessimism/Nihilism.
     - [No, temporary value counts]: Go to 7.

  7. Case: Divine observer required?
     - [Yes, God grounds value]: Supernaturalist.
     - [No, natural value exists]: Pure Objectivist.

  8. Case: Is a meaningless life worth living?
     - [No, meaning is essential]: Pessimism/Nihilism.
     - [Yes, rebellion suffices]: Camus's Absurdism.

  9. Case: Meaningful if harmful but satisfying?
     - [Yes]: Unoccupied 1 (Moral Neutral Subjectivism).
     - [No]: Go to 10.

  10. Case: Meaning without conscious valuer?
      - [Yes]: Unoccupied 2 (Post-Conscious Meaning).
      - [No]: Pure Objectivist.

  **Commentary & Limits**

  **Unseparated Leaves:** This tree cannot cleanly separate Pure Objectivist from Supernaturalist if the objectivist admits natural values exist independently of God; both land on "external impact" without divine necessity. Similarly, Hybridism and Pure Subjectivist overlap if the "reality constraint" is weak (e.g., merely believing one is connected to reality). Camus's Absurdism is often misclassified as Subjectivism; this tree isolates it via the "striving without hope" branch (Q3/Q5/Q8), but users may still slide if they conflate "rebelling" with "finding satisfaction."

  **Settled vs. Live Fights:**
  - *Settled:* The Experience Machine (Nozick) generally defeats Pure Hedonistic Subjectivism in intuition pumps, though defenders remain. The distinction between "meaning" and "worth living" is widely accepted as conceptually distinct, though practically entangled.
  - *Live Fights:* Whether truth is required for meaning (the "deceived spouse" case) is heavily contested between Hybridists and Subjectivists. The impact of heat death (Time Scale) is unresolved; some argue finitude enhances meaning, others that it nullifies it. Whether intention suffices without results (Taylor's Sisyphus variants) remains a core disagreement in objectivist circles.

  **Unoccupied Positions:**
  1. *Moral Neutral Subjectivism:* Meaning comes from satisfaction, even if immoral. Unoccupied because it is unattractive; most theorists tie meaning to some notion of value beyond mere agent satisfaction.
  2. *Post-Conscious Meaning:* Meaning arises only after the agent dies. Unoccupied because it is incoherent; value typically requires a valuer, and a dead agent cannot value.

  **Note on Camus:** Absurdism is not nihilism. Nihilism says "no meaning, therefore stop." Absurdism says "no meaning, therefore revolt." Ensure Q8 distinguishes these.

  **Note on Taylor:** Richard Taylor's Sisyphus examples (happy vs. temple vs. demolished temple) are tracked in Q1, Q3, and Q5. Disagreement here signals the Objectivist/Subjectivist/Hybrid split.

  **Usage:** Start at Q1. Follow branches based on intuitive responses to the cases, not theoretical commitments. The goal is to reveal hidden inconsistencies, e.g., claiming meaning is internal (Q1) but requires reality (Q2).
