prompt: |-
  I'm the philosophy person on a small press's advisory panel — we rule on whether to take on books that dramatise real people — and I want to think through next month's manuscript before the meeting rather than during it. Our track record so far:

  - Approved: a novel inventing the inner life and private conversations of a much-documented 19th-century abolitionist lecturer, with an afterword listing what was made up. Minute: "flagged, and the invention stays inside what the record leaves open."
  - Approved with conditions: a graphic novel about a 17th-century midwife convicted of witchcraft, where only the trial transcript survives. Distant relatives objected to the trial being depicted at all; we required the transcript be reprinted in an appendix instead. Minute: "a family's distress is not a veto, but readers have to be able to check."
  - Refused: a docudrama we'd have published in book form, sold as "a true story," no disclaimer, showing a mid-century union leader as an informant when the released files say the opposite, with his widow still living. Minute: "it isn't so, and it lands on people who are still here."

  The new one. A novel about a disaster-relief doctor who died in 1978; the official inquiry records that he stayed at his post through the collapse. The book has him walk away for four hours and return to an empty ward, and its whole argument is that the inquiry was a whitewash. The afterword names every invented scene and says outright that there's no documentary evidence he left — the author calls it a counterfactual biography. His granddaughter, a historian, has written a blurb backing it, saying the family wanted someone to ask the question for decades.

  Our chair keeps a distinction between filling a silence and overridding the record, and thinks only the second can wrong anybody. I suspect that's not doing the work he thinks. My own worry is a kind of free-riding: the book borrows the credibility the real man earned and spends it on a scene that never happened, and I don't see how a flag refunds that.

  So — which principles are genuinely compatible with those three verdicts, what does each imply for this manuscript, and what's your best guess at how we vote? Which precedent is the closest analog? If I argue one side, what principle am I committing us to, including for future manuscripts I won't like? And what's the cheapest hypothetical case I could put in front of the panel that would force apart the transparency principle and the fidelity-to-the-record principle?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **Role:** Philosophy person on a small press's advisory panel.
      *   **Task:** Evaluate a specific manuscript (disaster-relief doctor novel) before the meeting.
      *   **Goal:** Think through principles, consistency with past verdicts, implications, voting prediction, and stress-test the principles.
      *   **Tone:** Intellectual, precise, analytical, ethical, practical.
      *   **Constraints:** Needs to align with the three previous cases (Abolitionist, Midwife, Union Leader).

  2.  **Analyze the Precedents (The "Case Law"):**
      *   *Case 1 (Abolitionist):* **Approved.** Invented inner life/conversations. *Condition:* Afterword listing inventions. *Rationale:* Invention stays inside what the record leaves open (filling silence).
      *   *Case 2 (Midwife):* **Approved with Conditions.** Trial depicted despite relatives' objection. *Condition:* Transcript reprinted in appendix. *Rationale:* Family distress $\neq$ veto, but readers must be able to check (transparency/access to source).
      *   *Case 3 (Union Leader):* **Refused.** Depicted as informant when files say opposite. *Condition:* Sold as "true story," no disclaimer, widow living. *Rationale:* Factual falsehood + harm to living subjects (overriding the record + reputational harm).

  3.  **Analyze the Current Manuscript (The Doctor):**
      *   **Subject:** Disaster-relief doctor, died 1978.
      *   **Record:** Official inquiry says he stayed at post through collapse.
      *   **Fiction:** He walked away for 4 hours, returned to empty ward. Argument: Inquiry was a whitewash.
      *   **Transparency:** Afterword names every invented scene, admits no evidence he left (calls it "counterfactual biography").
      *   **Family Stance:** Granddaughter (historian) supports it, says family wanted the question asked.
      *   **Key Conflict:** The Chair's distinction (Filling Silence vs. Overriding Record) vs. User's worry (Free-riding on credibility).

  4.  **Evaluate Principles & Consistency:**
      *   *Chair's Principle:* "Filling silence is okay; overriding record is wrong."
          *   *Problem:* The Doctor manuscript *explicitly overrides* the official record (Inquiry says stayed; Book says left). This contradicts the Chair's stated principle unless "official inquiry" is treated as unreliable/silence (which is a stretch given the Union Leader case relied on "released files").
      *   *User's Principle:* "Free-riding/Credibility." Borrowing real virtue to sell a fictional vice (or vice versa).
          *   *Problem:* If we accept this, does it kill *all* historical fiction? The Abolitionist case invented conversations. That borrows credibility too. The distinction must be about *moral valence* or *falsifiability*.
      *   *Transparency Principle (from Case 1 & 2):* Afterwords, appendices, disclaimers allow readers to judge.
          *   *Application:* The Doctor book has a robust afterword.
      *   *Harm Principle (from Case 3):* Harm to living people/legacy.
          *   *Application:* Doctor died 1978. Granddaughter supports it. Less risk of direct harm than the Union Leader's widow.

  5.  **Determine the Closest Analog:**
      *   *Union Leader?* No. Union Leader was factually false *without* disclaimer, harmed living widow. Doctor book admits falsehood, family supports it.
      *   *Abolitionist?* Closer. Both use afterwords. But Abolitionist *filled silence* (unknown conversations). Doctor *contradicts record* (known action).
      *   *Midwife?* Closer on the "contested history" angle. But Midwife was about *depicting* a trial that existed. Doctor is about *denying* an event that was recorded.
      *   *Verdict:* It's a hybrid. It looks like the Abolitionist (transparency) but acts like the Union Leader (contradicting evidence). However, the Family Support distinguishes it from Union Leader, and the "Counterfactual" label distinguishes it from "True Story."

  6.  **Develop the Arguments:**
      *   *Argument for Approval:* Transparency (Afterword), Family Consent (Granddaughter), Time elapsed (1978), Genre labeling ("Counterfactual"). This aligns with the spirit of Case 1 & 2 (reader agency).
      *   *Argument for Refusal:* Contradicts established record (like Union Leader), undermines public trust in heroism (Free-riding), sets dangerous precedent for "alternative facts" if not carefully bounded.

  7.  **Predict the Vote:**
      *   The Chair wants to approve "filling silence." This *isn't* filling silence. He might be uncomfortable.
      *   The User is worried about free-riding.
      *   However, the Family Support is a huge mitigator compared to Case 3. The Transparency is better than Case 1.
      *   *Prediction:* Approved with Conditions (like Midwife). Condition: Ensure the "Counterfactual" label is on the cover/blurb, not just the afterword.

  8.  **Stress-Test Principles (The "Cheapest Hypothetical"):**
      *   Need to separate Transparency from Fidelity.
      *   *Scenario:* A book that is 100% transparent about lying but lies about something crucial that damages the subject's legacy irreparably, even with family consent.
      *   *Better Scenario:* A book about a saint. Afterword says "I made him a murderer." Transparency is high. Fidelity is zero. Does transparency cure the defamation?
      *   *Cheapest Case:* A biography of a beloved humanitarian labeled "Counterfactual" that depicts them committing the very crime they are famous for preventing, with full disclaimer. Transparency says "Okay." Fidelity says "No."

  9.  **Drafting the Response:**
      *   *Structure:*
          1.  Diagnostic of the Chair's Principle (it fails here).
          2.  Diagnostic of the User's Principle (needs refinement).
          3.  Precedent Mapping (which case fits?).
          4.  Voting Prediction.
          5.  Strategic Advice (how to argue).
          6.  The Stress-Test Hypothetical.
      *   *Tone:* Collegial, rigorous, philosophical but grounded in publishing reality.

  10. **Refining the "Free-Riding" Argument:**
      *   The user worries the book borrows credibility.
      *   *Counter:* The book *spends* credibility to question authority. Is that parasitic or critical?
      *   *Refinement:* The issue isn't borrowing credibility, it's *asymmetric risk*. The real man risks reputation; the author risks only critique. But the granddaughter (heir) accepts that risk.
      *   *Key Distinction:* In Case 3 (Union Leader), the harm was non-consensual. Here, it is consensual (heir).

  11. **Refining the Chair's Distinction:**
      *   Chair: Silence vs. Record.
      *   Problem: The Inquiry Record *is* the Record. The book contradicts it.
      *   Nuance: Is an Official Inquiry infallible? The Midwife case showed trials can be unjust. But the Union Leader case showed files are evidence.
      *   If the Chair approves this, he abandons "Fidelity to Record." If he rejects, he admits "Transparency" can override "Fidelity."

  12. **Final Polish:** Check against the prompt requirements.
      *   Which principles compatible?
      *   What does each imply?
      *   Best guess at vote?
      *   Closest analog?
      *   Argument commitments?
      *   Cheapest hypothetical?

      *(Self-Correction during drafting)*: Make sure to explicitly address the "free-riding" concern. It's a strong philosophical point about moral credit. I need to show how the panel's history handles moral credit. Case 1 (Abolitionist) enhanced moral credit. Case 3 (Union Leader) damaged it. Case 2 (Midwife) was neutral/complex. This case damages moral credit (hero -> deserter). That makes it closer to Case 3, but the consent changes it.

      *Revised Plan:* Focus heavily on the *Consent* variable. It's the differentiator between Case 3 and this one.

      *Hypothetical:* Needs to be "cheap" (easy to construct, hard to refute). A transparent lie about a public figure that harms no living relatives but violates truth.

      *Let's write.*
answer: |-
  This is a sharp dilemma because it exposes a fissure in your panel's existing jurisprudence. Your Chair's distinction (filling silence vs. overriding record) collapses under this manuscript, and your worry (free-riding on credibility) is philosophically sound but practically difficult to adjudicate without stifling historical fiction.

  Here is the breakdown of principles, precedents, and strategic positioning for your meeting.

  ### 1. Which principles are compatible with the three verdicts?

  Your panel actually operates on **three** overlapping principles, not just the Chair's two.

  1.  **The Epistemic Principle (Chair):** Do not contradict the established record unless the record is known to be unreliable. (Supported by *Union Leader* refusal; challenged by *Midwife* approval).
  2.  **The Transparency Principle:** Readers must be able to distinguish fact from invention. (Supported by *Abolitionist* afterword; *Midwife* appendix).
  3.  **The Harm/Consent Principle:** Do not inflict reputational harm on living subjects or non-consenting heirs. (Supported by *Union Leader* refusal; *Midwife* "distress is not a veto" caveat).

  **The Conflict:**
  The Doctor manuscript satisfies **Transparency** (robust afterword) and **Harm/Consent** (granddaughter supports it, subject deceased). It explicitly violates the **Epistemic Principle** (it contradicts the official inquiry).

  If you approve this, you are implicitly ruling that **Transparency + Consent > Fidelity to Record.**
  If you refuse this, you are ruling that **Fidelity to Record > Transparency + Consent.**

  ### 2. What does each imply for this manuscript?

  *   **If you follow the Chair's stated principle (Fidelity):** You must refuse. The book does not "fill a silence"; it actively overwrites a specific finding of an official inquiry. To approve this is to admit the Chair's distinction was rhetorical, not operational.
  *   **If you follow the Precedent of Harm (Union Leader):** You likely approve. The widow in Case 3 was living and objected. Here, the heir is a historian who consents. The "harm" is to a legacy, not a living person, and the heir waives the right to protect that legacy.
  *   **If you follow your "Free-Riding" worry:** You lean toward refusal. The doctor earned moral credit by (allegedly) dying at his post. The author spends that credit to generate narrative tension (the drama of the return to the empty ward). An afterword does not refund the emotional impact of the read. However, this principle is dangerous: it would arguably ban the *Abolitionist* novel too (inventing private conversations borrows the subject's gravitas).

  ### 3. Closest Analog and Voting Prediction

  **Closest Analog:** *The Union Leader (Refused)*, but inverted.
  Both involve contradicting documentary evidence regarding a person's courage/loyalty.
  *   *Union Leader:* Files say loyal; Book says informant. (Refused).
  *   *Doctor:* Inquiry says stayed; Book says left. (Current).

  **Why it differs:** The *Union Leader* was sold as "a true story" with no disclaimer, and the widow objected. The *Doctor* is sold as "counterfactual," has an afterword, and the heir consents.

  **Best Guess at the Vote:** **Approved with Conditions.**
  *   **Why:** The panel has shown a strong bias toward reader agency (Transparency) and a reluctance to let families veto history (Midwife). The granddaughter's support neutralizes the *Union Leader* precedent's primary blocker (harm to the living/objection).
  *   **The Condition:** Likely that the "Counterfactual" label appears on the cover or copyright page, not just in the afterword. This ensures the Transparency Principle holds *before* purchase, not just after reading.

  ### 4. If you argue one side, what principle are you committing us to?

  **If you argue for Approval:**
  You commit the press to the view that **Historical Fiction is a form of argument, not just illustration.** You are establishing that an author may contradict the historical record *if* they label it as speculation and have heir consent.
  *   *Future Risk:* You open the door to "alternative history" biographies of controversial figures where the evidence is inconvenient. If a future author wants to write a "counterfactual" book claiming a documented genocide victim survived, and has a distant cousin's consent, do you allow it? You are prioritizing *narrative possibility* over *archival stability*.

  **If you argue for Refusal:**
  You commit the press to the view that **Some records are sacrosanct, regardless of transparency.** You are establishing that there is a "floor" of factual fidelity below which a book cannot go, even with disclaimers.
  *   *Future Risk:* You risk stifling revisionist history. Official inquiries *are* often whitewashes (as the book argues). If your press refuses to publish fiction that interrogates official lies, you become a defender of state/corporate records by default. You are prioritizing *archival stability* over *narrative justice*.

  **Recommendation:** Argue for **Approval with a Stricter Condition.**
  Acknowledge the free-riding risk but note that the *Midwife* case established that family distress is not a veto; by extension, family *endorsement* should carry weight. However, to mitigate the free-riding, the "Counterfactual" nature must be front-and-center. This protects the press from being accused of publishing lies, while allowing the artistic argument.

  ### 5. The Cheapest Hypothetical (Stress-Test)

  To force apart the **Transparency Principle** and the **Fidelity-to-Record Principle**, put this case to the panel:

  > "A novel about a beloved, deceased pediatrician known for saving hundreds of children. The medical records are clear. The novel depicts him systematically poisoning his patients. The cover reads 'A Counterfactual Biography.' The afterword details every invention. The estate (a distant charity) grants permission for a fee."

  **Why this breaks the Chair:**
  *   **Transparency:** Satisfied (Cover + Afterword).
  *   **Consent:** Satisfied (Estate granted permission).
  *   **Fidelity:** Violated (Contradicts medical records).
  *   **Harm:** Minimal to living, maximal to memory.

  If the Chair approves the Doctor but refuses the Pediatrician, he must explain why *one* contradiction of the record is permissible art and the other is not. Is it the *plausibility* of the whitewash? Is it the *political value* of the critique?

  If he approves the Pediatrican, your "free-riding" worry is vindicated: transparency does not cure the moral injury of defaming the dead for profit. If he refuses the Pediatrician, he admits that Fidelity *can* override Transparency, which undermines his reasoning for approving the Doctor (since the Doctor also contradicts the record).

  **Strategic Note:**
  Your worry about "free-riding" is essentially a concern about **moral parasitism**. The book gains its emotional weight from the reader believing the doctor *might* have been real, then uses that weight to critique the system.
  *   *Counter-argument for the meeting:* The *Abolitionist* novel did the same (gained weight from real heroism, spent it on invented doubts/struggles). The difference is valence. We allow inventing *struggle* (Abolitionist); we are hesitant to invent *failure* (Doctor).
  *   *Your Pivot:* Don't fight on "invention." Fight on "labeling." If the book is truly counterfactual, the reader must know *before* they invest emotionally. That is the only way to refund the credibility you worry is being spent.
