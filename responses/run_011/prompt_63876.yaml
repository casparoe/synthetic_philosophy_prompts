  # Joint Statement on the Neolithic Transition
  **Prepared by Dana and Wes, with facilitation by the Reading Group**
  **Date:** October 26, 2023

  ### Part I: Agreed Claims
  *The following statements represent the archaeological, anthropological, and logical ground upon which both parties stand. We agree that these claims are supported by the current weight of evidence and are not in dispute.*

  1.  **Health Deterioration:** In nearly every region where we have comparable skeletal data, the first generations of committed agriculturalists show markers of worse health than their immediate foraging predecessors. This includes reduced adult height, increased enamel hypoplasia (indicating childhood stress), and higher rates of infectious disease lesions.
  2.  **The Nature of the Transition:** Agriculture was not a single invention or a conscious "decision." It was a gradual co-evolutionary process spanning thousands of years, occurring independently in at least eleven different regions worldwide. There was no moment where a group voted to switch lifestyles.
  3.  **Sedentism Precedes Cultivation:** In several key cases (e.g., the Natufians in the Levant, the Jomon in Japan, and complex foragers in the Pacific Northwest), permanent settlement and social stratification existed *before* the domestication of plants. This confirms that living in one place and having hierarchy are not exclusively caused by farming.
  4.  **Carrying Capacity:** Agricultural systems support significantly higher population densities than foraging systems on the same land. A return to 100% foraging at current global population levels is physically impossible without a catastrophic reduction in human numbers.
  5.  **The "Ethnographic Present" Problem:** Hunter-gatherer societies observed in the 19th and 20th centuries (e.g., the !Kung or Hadza) are not perfect proxies for Pleistocene foragers. Most occupied marginal lands unwanted by farmers, were constrained by modern state borders, and often engaged in trade with agricultural neighbors.
  6.  **Irreversibility:** Once a population adopts intensive agriculture and the associated population growth, returning to foraging is not a viable option for that group. The "trap" is real in the sense that the exit door locks due to demographic pressure, regardless of whether the entry was voluntary.

  ***

  ### Part II: Surviving Disagreements and Cruxes
  *The following table outlines where we still disagree. For each point, we have identified the specific "crux" (the sub-question that drives the disagreement) and the specific evidence or argument that would bear on it. We have written down our predictions in advance.*

  | Point of Contention | Dana's Position | Wes's Position | The Crux (What actually divides us) | Agreed Test / Dataset & Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Definition of "Mistake"** | Calling it a "mistake" is valid if the outcome is objectively worse for human wellbeing, even if no one chose it. A trap you wander into is still a trap. | Calling it a "mistake" implies agency or error. Since the transition was an unconscious evolutionary drift with no viable alternative path, "mistake" is a category error. | **Is this a verbal dispute?** Does "mistake" mean *moral failing* (Wes's strawman) or *evolutionary maladaptation* (Dana's actual view)? | **Resolution:** We agree this is partially verbal. <br>**Dana** will stop implying ancient people "screwed up." <br>**Wes** will acknowledge that "evolutionary trap" is a valid concept even without agency. <br>**Test:** If we find a case where a group *reversed* to foraging when options were open, Wes admits it wasn't a trap. If no such case exists, Dana admits "trap" is stronger than "mistake." |
  | **2. Population Ethics (The Math)** | We must evaluate the *average* quality of life per person. Adding billions of people with "lives barely worth living" does not cancel out the suffering of each individual. Non-existent people cannot be benefited by being born. | We must evaluate *total* wellbeing. If farming created 100x more people, even with lower average quality, the total sum of human experience is greater. Existence is generally preferable to non-existence. | **The Non-Identity Problem:** Can we count people who *only* exist because of farming as a "gain"? If their lives are net-positive (even if hard), does their existence justify the system? | **Argument:** The "Repugnant Conclusion." <br>**Dana's Prediction:** A world of 10 billion miserable people is worse than a world of 10 million happy people. <br>**Wes's Prediction:** A world of 10 billion miserable people is better, provided their lives are not net-negative (i.e., worth ending). <br>**Settler:** This is philosophical, not empirical. We agree to disagree on the weighting function. |
  | **3. Causality: Farming vs. Density** | Farming is the primary driver because it is the only reliable way to achieve the density and surplus that cause disease and hierarchy. You can't separate the crop from the consequence. | Sedentism and density are the primary drivers. Farming is just one technology to get there. Blaming wheat is like blaming steam engines for pollution instead of factories. | **The Counterfactual:** Would high density and hierarchy have arisen without grain agriculture? | **Dataset:** Complex settled foragers (e.g., Calusa in Florida, Indigenous Pacific NW). <br>**Dana's Prediction:** These groups will show exceptions, but ultimately fail to scale or develop full state hierarchy without crops. <br>**Wes's Prediction:** These groups will show similar health declines and inequality markers despite zero agriculture, proving crops aren't the root cause. |
  | **4. Skeletal Evidence & Selection** | Bone pathology (lesions, height loss) directly reflects the lived experience of the average adult. Life got harder, period. | Bone pathology reflects infant/child mortality and selection bias. If you survived childhood, you might have been fine. The "average" is skewed by those who died young. | **What do bones measure?** Do they record the *quality* of life for survivors, or just the *mortality rate* of the vulnerable? | **Dataset:** Isotopic analysis of adult bone collagen vs. juvenile remains in early Neolithic sites. <br>**Dana's Prediction:** Adult isotopes will show chronic nutritional stress even in survivors. <br>**Wes's Prediction:** Adult isotopes will show stable diets; the stress markers are concentrated in the juvenile cohort who didn't make it. |
  | **5. Inequality and Storage** | Agriculture created the surplus that allowed bosses to emerge. No grain, no kings. | Storage creates inequality. You can store dried fish or acorns. Agriculture just made storage easier and more scalable. | **The Storage Threshold:** Is there a limit to inequality without cultivable grain surplus? | **Dataset:** Pre-agricultural monumental architecture (e.g., Göbekli Tepe) and slave-owning forager societies. <br>**Dana's Prediction:** These will be shown as rare anomalies that couldn't sustain inequality long-term without farming. <br>**Wes's Prediction:** These will be shown as proof that hierarchy is a function of resource defense and storage, independent of plant domestication. |

  ***

  ### Part III: Note on Verbal Disputes
  *We acknowledge that a portion of our four-month debate stems from the word "Mistake" performing two different jobs.*

  *   **For Dana,** "Mistake" is shorthand for **"Evolutionary Maladaptation."** She is making a claim about *outcomes*: the system produces less wellbeing per capita than the previous system.
  *   **For Wes,** "Mistake" implies **"Error of Judgment."** He is making a claim about *process*: no agent made a choice that could be judged as wrong.

  **Agreement:** We will cease using the word "Mistake" in future discussions. Dana will use **"Evolutionary Trap"** to describe the outcome. Wes will use **"Unintended Consequence"** to describe the process. This removes the implication of blame while preserving the disagreement about whether the outcome was net-negative.

  ***

  ### Part IV: Commitment to Update
  *We agree that if the "Agreed Test" results in Part II come out against our prediction, we will adjust our confidence levels accordingly. Specifically:*

  *   If **Wes** is wrong about the **Complex Foragers (Crux 3)** showing similar health declines to farmers, he will concede that agriculture specifically (not just density) drives the health collapse.
  *   If **Dana** is wrong about the **Adult Isotopes (Crux 4)** showing chronic stress in survivors, she will concede that the skeletal record primarily reflects infant mortality rather than the quality of adult life.

  *Signed,*

  *Dana*
  *Wes*
