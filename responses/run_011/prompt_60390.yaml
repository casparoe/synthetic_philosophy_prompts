      *   *Decision:* 11 Pairs. Why? Epistemology is often about the individual agent and the informant. Pairs allow for discussion without groupthink dilution. It handles 22 perfectly.
      *   *Informants:* I (the instructor) will play the Informants. I will circulate or stand at the front. Actually, to make it scalable, I need *cards* representing informants that I distribute, or I act as the central bank.
