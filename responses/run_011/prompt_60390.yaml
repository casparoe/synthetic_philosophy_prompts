      *   *The "Larissa" Moment:* After Round 1, stop and ask: "Who made more profit?" (Answer: Nobody, it's equal). "Who would you pay more to hire?" (Intuition: Tracker). "Why, if the profit is the same?"

  8.  **Timing & Flow (75 mins):**

