      *   *Implementation:* I will assign each Pair a "Primary Scout." Half the class gets Scout A (Tracker), half gets Scout B (Guesser). They don't know which is which.
      *   *Rounds:* 3 Rounds.
          *   Round 1: Environment Stable. Both Scouts are Right. Payoff = Equal.
          *   Round 2: Environment Shifts. Tracker stays Right. Guesser goes Wrong.
