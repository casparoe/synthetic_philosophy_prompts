answer: |-
  Your diagnosis is remarkably sharp, and I think you are largely right to identify that the stalemate is normative rather than empirical, but I would push back slightly on the idea that the empirical layer is irrelevant. It is not that there are no empirical disputes, but rather that the empirical uncertainties are so large that they function as Rorschach tests for the underlying values. Because no modern state has ever operated a standing lotted legislature with real powers, every claim about what would happen is a projection. When the skeptics say staff will capture the body, they are making a empirical prediction based on how bureaucracies usually work, but they are also expressing a normative priority that prefers known risks to unknown ones. When the sortitionists say deliberation will improve, they are extrapolating from mini-publics, but they are also expressing a normative hope that removing electoral incentives removes distortion. So the empirical dispute is real, but it is undecidable with current evidence, which is why it keeps collapsing back into the value disagreements you identified. You are correct that the baseline comparison is the first layer of confusion. The sortitionists are engaging in comparative institutional analysis against actually existing democracy, while the skeptics are defending the ideal type of representative democracy. This is a classic nirvana fallacy on one side and a status quo bias on the other, but it is deeper than that. It is about what we think democracy is for. If democracy is a method for minimizing tyranny and ensuring peaceful turnover, the skeptics have the stronger case because elections provide a clear mechanism for removal. If democracy is a method for ensuring descriptive representation and reducing elite capture, the sortitionists win because elections structurally filter out the poor and the marginalized. You cannot resolve this by finding more data because the data would only tell you how well each system performs against its own goals, not which goals are superior.

  Your second point about accountability is also precise, but I think it misses a specific mechanistic fear that the skeptics have which is not just about sanctions. It is about the chain of authorization. In an elected system, even if the accountability is weak, there is a fictional but powerful narrative that the representative acts in the name of the voter. In a lotted system, the member acts in the name of chance, or perhaps in the name of the statistical population, but not in the name of a constituent who authorized them. This matters for unpopular decisions. An elected official can say I did this so you would reelect me, or I did this knowing you might not reelect me but it was necessary. A lotted member cannot say that. They can only say this was the reasoned outcome of our deliberation. The skeptics worry that this lacks the gritty legitimacy required to enforce painful trade-offs, while the sortitionists argue that elected officials avoid painful trade-offs precisely because they are looking at the next election. This is where your third layer, the source of legitimacy, becomes the real battleground. You describe it as procedural fairness versus traceability, and I think that is correct, but I would add that it is also a disagreement about political agency. The skeptics view the act of voting as a constitutive act of citizenship that must be preserved, whereas the sortitionists view voting as a defective filter that alienates citizens from power. Until your group admits that you are arguing about the meaning of citizenship itself, you will keep talking past each other about staff capture and renewal rates.

  However, saying the dispute is normative does not mean it is unresolvable or that design changes cannot help. The problem is that your group is trying to design a perfect system rather than a robust one. The skeptics are terrified of the unchecked power of a lotted body, and the sortitionists are terrified of diluting the purity of the lot with electoral elements. Progress would come from acknowledging that the goal is not to prove one side right but to build a system that survives the weaknesses of both. For example, the idea of a mixed chamber or a veto-only power is not just a compromise; it is a way to test the empirical uncertainties while mitigating the normative risks. If you give the lotted chamber veto power over legislation but not the power to initiate it, you address the skeptic's fear of unaccountable agenda-setting while preserving the sortitionist's goal of a check on elite ambition. Alternatively, if you implement staggered renewal but allow for a recall mechanism triggered by a supermajority of the public, you introduce a sanction without reintroducing elections. These are not solutions that will make the skeptics believe in sortition or the sortitionists believe in elections, but they are designs that allow the system to function even if the skeptics are right about capture or the sortitionists are right about deliberation.

  There is also a specific empirical question you could try to settle, though it requires shifting the scope. The dispute about whether amateurs become dependent on staff is crucial. You could look at existing bodies that are non-elected but have power, such as certain judicial appointments or independent regulatory commissions, and analyze the relationship between the commissioners and their staff. Or you could look at the history of the Athenian Boule, which was lotted but had a bureaucracy, though the context is vastly different. But honestly, searching for this evidence is likely to be another two years of work that ends in the same stalemate because each side will interpret the evidence through their value framework. The skeptics will see any staff influence as capture; the sortitionists will see it as necessary support. The only way to know is to run a pilot, but that requires political will you do not have yet. So you are left with the design choices I mentioned earlier. The most productive path forward is to stop trying to convince the skeptics that sortition is safe and start asking them what specific catastrophe they are trying to prevent, and then design a safeguard against that specific catastrophe rather than against sortition itself. Similarly, ask the sortitionists what specific good they are trying to achieve and whether it requires a full legislature or just a powerful committee.

  Ultimately, you are correct that this cannot be fully resolved without a value choice. The choice is whether you prioritize the risk of elite capture or the risk of unaccountable power. Representative democracy accepts elite capture as the price of accountability. Sortition accepts the risk of unaccountable power as the price of descriptive representation and independence from donors. Your working group is stuck because everyone wants the benefits of both without the costs of either. Progress looks like explicitly mapping those trade-offs in your proposal rather than trying to argue them away. Write the proposal such that it says if you value X, this design works, but if you value Y, you must accept Z risk. Make the value choice explicit for the policymakers who will eventually read it. If you do that, you might not agree within the group, but you will produce a document that clarifies the decision for the people who have the authority to make it. The deadlock is not a failure of your group; it is a reflection of a genuine tension in democratic theory that has existed since Aristotle. You are not going to solve it in a conference room, but you can articulate it clearly enough that the choice becomes honest.
