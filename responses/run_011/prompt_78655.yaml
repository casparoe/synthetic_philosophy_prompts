answer: |-
  ### The Reflection Principle Debug Tree
  **Goal:** Determine under which conditions you equate your current credence with your future self's credence.
  **Instructions:** Start at the root. Answer **Trust** (apply Reflection) or **Suspend** (do not apply) for each concrete scenario. Follow the path to your philosophical position.

  ```text
  ROOT: Your future self assigns credence X to a claim. You currently assign Y.

  ├── Q1: They have seen new logs (evidence) you haven't seen yet.
  │   ├── Suspend → LEAF A: HARD CURRENTIST
  │   │   └── Cost: You are vulnerable to Diachronic Dutch Books (guaranteed loss).
  │   └── Trust → Q2: They are at the end of a 24h on-call week (fatigued/corrupted).
  │       ├── Trust → LEAF B: STRICT REFLECTIONIST
  │       │   └── Cost: You must accept credence shifts from brainwashing or exhaustion.
  │       └── Suspend → Q3: They remember the conclusion but deleted the logs (forgetting).
  │           ├── Trust → LEAF C: ORTHODOX REFLECTION (Van Fraassen)
  │           │   └── Cost: You must accept beliefs based on evidence you can no longer verify.
  │           └── Suspend → Q4: Their goals changed (e.g., had a kid, new diagnosis).
  │               ├── Trust → Q5: Did you also Suspend Q1 (New Evidence)?
  │               │   ├── Yes → LEAF D: NOBODY HOLDS THIS
  │               │   │   └── Why Empty: Incoherent. Trusting value-shifts but not evidence 
  │               │   │       implies you trust identity more than reality.
  │               │   └── No → LEAF E: VALUE-NEUTRAL REFLECTION
  │               │       └── Cost: You treat your future self as a stranger with better data.
  │               └── Suspend → Q6: You aren't certain this future state will occur (Prob < 1).
  │                   ├── Trust → LEAF F: GENERALIZED REFLECTION
  │                   │   └── Cost: Requires complex conditional probability math to implement.
  │                   └── Suspend → LEAF G: EVIDENTIALIST / RATIONALITY-CONDITIONAL
  │                       └── Cost: You cannot plan using your own future predictions.
  ```

  ### Definitions for Engineers
  *   **Credence:** A subjective probability (0–1) representing your degree of belief. Think of it as a confidence score output by your internal classifier.
  *   **Diachronic Dutch Book:** A sequence of bets offered at different times that guarantees you a loss, solely because your credences violated Reflection. It's a "money pump" exploit against your updating logic.
  *   **Defeater:** A reason to think your future cognitive process is compromised (e.g., knowing you will be sleep-deprived is a *defeater* for trusting your future self).

  ### Indistinguishable Leaves
  **Leaf G (Evidentialist)** and **Rationality-Conditional Reflection** are functionally identical in this tree.
  *   **Evidentialist:** "I only trust my future self if they have new data."
  *   **Rationality-Conditional:** "I only trust my future self if they updated rationally."
  *   **Why they merge here:** In practice, if you suspect irrationality (fatigue/memory loss), you claim they lack *usable* evidence. Both positions force you to audit your future self before trusting them, breaking the automatic nature of Reflection.

  ### Notes on Empty Cells
  **Leaf D** is marked empty because it is **incoherent**. No consistent agent trusts their future self to change values (a fundamental rewrite) while simultaneously distrusting their future self to process new empirical data. It implies you trust the *optimizer* but not the *input stream*, which contradicts the motivation for trusting the optimizer in the first place.
