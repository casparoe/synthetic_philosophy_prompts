prompt: |-
  I've been slowly going a bit mad about secession ever since my department asked me to run a couple of seminar sessions on self-determination in the spring, and I've realised I dont actually have a position — just a pile of reactions. So here are the reactions, honestly, untidied. Scotland 2014: London and Edinburgh agreed the vote, everyone campaigned freely, it went No — but I think a Yes would have been perfectly legitimate, even though nobody in Scotland was oppressed in any interesting sense. So apparently agreement plus a ballot is enough for me. Catalonia 2017: Madrid refused, the constitutional court killed the law, they ran it anyway with police taking ballot boxes off people, 43% turnout and nine out of ten voting Yes — I think that one was not legitimate, but "they broke the rules" doesn't feel like my real reason, because I'd say the same about an identically messy vote that the state had authorised. Quebec 1995: No by well under a point on a 93% turnout, and I feel a Yes there would have been legitimate, and simultaneously that half-plus-one of one province shouldn't be allowed to break up a country — which is in tension with what I just said about Scotland and with everything I believe about majorities elsewhere. Kosovo: legitimate, on remedial grounds, after the late 90s. Crimea: not legitimate despite a referendum with a huge reported majority, and when I ask why I say it's because the foreign troops were already on the ground — but Bangladesh became real in 1971 partly because a much bigger army marched in, and I think that one was legitimate, so foreign force can't be the disqualifier. Biafra: I want to say legitimate, the pogroms first and then the blockade and the starvation, but almost nobody I've read says so and I genuinely cannot articulate what separates it from Bangladesh except that Bangladesh won. Bougainville: they voted 98% for independence in a referendum both sides had agreed to years earlier, and years on they still don't have a state — am I committed to saying they're already entitled and Port Moresby is just failing to hand it over, or does entitlement require somebody to grant it? Somaliland makes that worse: functioning, comparatively well-run, self-governing for over thirty years, recognised by nobody, and I think recognition is overdue, which suggests part of my criterion is whether the thing works.

  Then the ones that make me suspect I'm not a democrat about this at all. If a rich region votes to leave purely so it can stop sending money to poorer compatriots, I think that's not a legitimate ground — even on a fully agreed, high-turnout vote. But if that same region also has a suppressed language and decades of being ruled from a capital that ignores it, my gut flips, and I can't tell whether the cultural grievance is doing real work or just laundering the money motive. Rural counties in northern California keep passing advisory votes about leaving the state and joining Idaho and I find those faintly ridiculous rather than wicked, which is probably a size-and-seriousness bias I haven't earned. Recursive cases: if Kosovo is legitimate, what about the Serb-majority parts of Kosovo that want to join Serbia, which I think are not legitimate — same argument one level down, made by a local majority. Same for the anglophone neighbourhoods of Montreal inside an independent Quebec. I also think the Kurds got a raw deal in 2017 when their overwhelming Yes was ignored and then punished, but I'd be much less confident about the same group if it were dispersed across four countries with no contiguous territory at all, which makes me worry that what I actually care about is already-existing internal borders, wearing a costume as a principle.

  My draft principle, such as it is: a group may secede if either it suffers serious and persistent injustice within the state, or the state's own constitutional order has authorised a vote on the question and the group wins it clearly. Please try to break that — I expect it fails on the rich-region case (authorised vote, clear win, still wrong), on Somaliland and Biafra (neither clause applies), and maybe on Bougainville. What I want back is the principle, or the small set of candidate principles, that best fits everything above, stated precisely enough that I could apply it to a case I've never seen, with each clause tied to the specific verdict that forces it. Then tell me what it says about cases I haven't listed: a region whose demographics were deliberately engineered for decades by the central government, so that the local majority is itself a product of the injustice; a region that wants to join a neighbouring state rather than become a new one; a group with a strong claim and no state capacity whatsoever; and whether a supermajority or turnout threshold is a legitimate guard or just the status quo defending itself with extra steps. And the part I dread — which of my verdicts has to be given up, and how many. If the pile is unsaveable, say so and tell me which one to drop first and what the second-best principle looks like once I've dropped it. Also, be blunt: am I confusing two seperate questions the whole way through, namely whether a group is morally entitled to secede and whether other states should recognise it? I suspect several of my verdicts are secretly about the second one, and that's part of why they contradict each other.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is an academic (likely political science, law, or philosophy) preparing seminar sessions on self-determination/secession.
      *   **Problem:** They have a "pile of reactions" to various secession cases but no coherent underlying principle. They feel inconsistent and potentially undemocratic.
      *   **Input:** A detailed, honest, untidied list of intuitions/verdicts on specific cases (Scotland, Catalonia, Quebec, Kosovo, Crimea, Bangladesh, Biafra, Bougainville, Somaliland, Rich Region vs. Poor Region, Northern California, Recursive cases/Kosovo Serbs, Kurds).
      *   **Draft Principle:** "A group may secede if either it suffers serious and persistent injustice within the state, or the state's own constitutional order has authorised a vote on the question and the group wins it clearly."
      *   **Task:**
          1.  Break the draft principle (identify failures).
          2.  Construct a better principle (or small set) that fits the user's verdicts precisely.
          3.  Tie each clause to specific verdicts.
          4.  Apply the new principle to new cases (engineered demographics, joining a neighbor, no state capacity, supermajority thresholds).
          5.  Identify which verdicts must be sacrificed if the pile is unsaveable (prioritize which to drop).
          6.  Address the meta-question: Is the user confusing *primary right to secede* (moral entitlement) vs. *recognition* (international legitimacy)?
      *   **Tone:** Blunt, analytical, philosophical, respectful of the complexity.

  2.  **Deconstruct the User's Intuitions (The "Pile"):**
      *   *Scotland 2014:* Legitimate (Agreed vote + ballot).
      *   *Catalonia 2017:* Illegitimate (Unilateral + messy, even if authorized messy would be bad).
      *   *Quebec 1995:* Legitimate *if* Yes (Democratic vote), BUT tension with "half-plus-one shouldn't break a country."
      *   *Kosovo:* Legitimate (Remedial/Injustice).
      *   *Crimea:* Illegitimate (Foreign troops), *but* Bangladesh complicates the "foreign force" rule.
      *   *Bangladesh:* Legitimate (Injustice + Victory).
      *   *Biafra:* Intuitively Legitimate (Injustice), but lacks recognition. Distinction from Bangladesh = Victory?
      *   *Bougainville:* Entitled? (Agreed vote), but no state yet.
      *   *Somaliland:* Legitimate (Functioning/Effectiveness), lacks recognition.
      *   *Rich Region:* Illegitimate (Economic selfishness), even if democratic. *Unless* cultural grievance exists (mixed motives).
      *   *Northern California:* Ridiculous (Size/Severity bias).
      *   *Recursive (Kosovo Serbs/Montreal Anglophones):* Illegitimate (Sub-unit secession).
      *   *Kurds:* Legitimate claim, but territory contiguity matters.

  3.  **Evaluate the Draft Principle:**
      *   *Draft:* "Injustice OR Constitutional Authorization + Clear Win."
      *   *Failure 1 (Rich Region):* Fits the "Authorization" clause but user says Illegitimate. -> *Need a "Just Cause" filter on the democratic route.*
      *   *Failure 2 (Somaliland/Biafra):* Fits "Injustice" (maybe), but user hesitates on Biafra due to lack of recognition/victory. Somaliland fits "Functioning." -> *Need an "Effectiveness/Viability" clause.*
      *   *Failure 3 (Bougainville):* Fits "Authorization," but user is unsure if entitlement requires grant. -> *Clarify if authorization creates a right or just a process.*
      *   *Failure 4 (Recursive):* Doesn't address sub-units.

  4.  **Develop a Coherent Framework (The "Principle"):**
      *   The user is oscillating between three theories of secession:
          1.  *Primary Right (Democratic):* Any group can vote (Scotland, Quebec).
          2.  *Remedial Right (Just Cause):* Only if oppressed (Kosovo, Bangladesh, Biafra).
          3.  *Effectivist (Recognition):* If it works and holds ground (Somaliland, Bangladesh vs. Biafra).
      *   *The Conflict:* The user wants the *permissiveness* of Primary Right (Scotland) but the *moral guardrails* of Remedial Right (Rich Region) and the *pragmatism* of Effectivism (Somaliland/Biafra).
      *   *The Confusion:* The user explicitly suspects they are mixing *Entitlement* (moral right) vs. *Recognition* (international law/practicality). This is the key key to unlocking the contradictions.
      *   *Proposed Solution:* A Two-Stage Principle.
          *   Stage 1: Moral Entitlement (Internal Legitimacy).
          *   Stage 2: International Recognition (External Legitimacy).
      *   *Refining the Moral Entitlement:* It can't be *just* democracy (Rich Region problem). It can't be *just* injustice (Scotland problem). It needs to be "Democratic Process *constrained by* Political Identity/Gravity."
      *   *Refining the Recognition:* Viability + Stability.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the difficulty. Validate the "pile of reactions" as standard in the literature (Buchanan, Philpott, Beran).
      *   **Diagnosis (The Blunt Truth):** Yes, you are conflating *Right to Secede* (moral) with *Right to Recognition* (international). Also, you are conflating *Procedural Legitimacy* with *Substantive Justice*.
      *   **Breaking the Draft Principle:**
          *   Rich Region: Fails because it allows "greed secession."
          *   Somaliland/Biafra: Fails because it ignores *viability* and *success* as components of legitimacy in your mind.
          *   Recursive: Fails because it doesn't define the "Unit."
      *   **Constructing the New Principle (The "Tripartite Test"):**
          *   To have a *claim to independence*, a group must satisfy:
              1.  **The Identity Condition:** (Addresses Rich Region/California). Distinct political community, not just an economic zone.
              2.  **The Process Condition:** (Addresses Scotland/Catalonia). Either Constitutional Consent OR Remedial Justice (Injustice).
              3.  **The Viability Condition:** (Addresses Somaliland/Biafra/Bougainville). Capacity to function as a state without creating greater injustice.
          *   *Wait, this is too clean.* The user's intuition on Biafra vs. Bangladesh is about *success*. The user's intuition on Somaliland is about *functioning*.
          *   *Revised Approach:* Separate *Internal Right* from *External Recognition*.
      *   **Addressing the "Unsaveable" Verdicts:**
          *   The "Rich Region" intuition is the hardest to square with "Scotland." If Scotland is legitimate purely on process, why isn't a rich region? Answer: National Identity.
          *   The "Recursive" intuition (No Serbs in Kosovo) requires a "Lock-In" rule. Once a unit secedes, its borders are fixed.
          *   *Sacrifice:* The user must drop the idea that "Injustice alone" is enough (Biafra). Injustice + Failure = Tragedy, not Legitimate Statehood (in the user's current view). Or, they must admit Biafra *was* legitimate regardless of loss. I should push them to admit Biafra was legitimate *morally*, even if recognition failed.
      *   **New Cases:**
          *   *Engineered Demographics:* Invalidates the "Identity Condition."
          *   *Joining a Neighbor:* (Irredentism). Harder than new statehood. Requires neighbor's consent.
          *   *No State Capacity:* Moral right exists, Recognition denied.
          *   *Supermajority:* Not a guard against secession, but a guard against *ambiguity*. 50%+1 is enough *if* the question is clear.
      *   **Conclusion:** Summarize the trade-off.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* I need to be careful not to just give a textbook answer. I need to fit *their* specific intuitions.
      *   *Observation:* The user says about Biafra: "almost nobody I've read says so [legitimate]... what separates it from Bangladesh except that Bangladesh won." This suggests the user *wants* to call it legitimate but feels pressure from the "Effectivist" view.
      *   *Observation:* The user says about Rich Regions: "If that same region also has a suppressed language... my gut flips." This implies *National Identity* is the hidden variable, not just money.
      *   *Key Insight:* The user is a "Qualified Primary Right Theorist" who secretly relies on "Effectivist" criteria for recognition.
      *   *The "Blunt" part:* I need to confirm their suspicion. They *are* confusing entitlement and recognition. That is the source of the Somaliland/Biafra anxiety.
      *   *The "Sacrifice":* They likely have to sacrifice the "Quebec Tension" (half-plus-one shouldn't break a country). If democracy is the standard, 50%+1 is the standard. If they keep the tension, they aren't a democrat on this issue.

  7.  **Finalizing the Structure:**
      1.  **Diagnosis:** Confirm the Entitlement vs. Recognition confusion.
      2.  **Stress Test:** Break the draft principle (Rich Region, Somaliland, Recursive).
      3.  **The Reconstructed Principle:** A Two-Track System (Consensual vs. Remedial) + A Viability Constraint.
      4.  **Application:** New cases (Demographics, Irredentism, Capacity, Thresholds).
      5.  **The Sacrifice:** Which verdict to drop (The Quebec Tension or the Biafra Hesitation).
      6.  **Closing:** Advice for the seminar.

  8.  *(Self-Correction on "Rich Region"):* Why is a rich region illegitimate? Because secession is a *political* right, not an *economic* opt-out. The principle needs to specify "Political Community."
  9.  *(Self-Correction on "Recursive"):* Why no Serbs in Kosovo? Because of the "Democratic Unit" problem. You can't nest indefinitely. The principle needs a "Territorial Integrity of the Seceding Unit" clause.

  10. **Final Polish:** Ensure tone is academic but direct ("Blunt"). Use the user's examples.

  *(Drafting response based on these thoughts...)*
answer: |-
  You are absolutely confusing two separate questions. That is not a criticism; it is the diagnosis. Your "pile of reactions" is inconsistent because you are trying to answer *Is this group morally entitled to leave?* and *Should the international community recognise them as a state?* with the same binary switch. They are not the same switch.

  When you say Somaliland is "overdue" for recognition but has no state, you are admitting this. When you say Biafra might be legitimate but "nobody says so" because they lost, you are conflating moral right with effective power. When you say a rich region shouldn't leave even on a vote, you are imposing a substantive moral constraint on a procedural democratic right.

  Here is the breakdown of your draft principle, the reconstruction you need, the application to new cases, and the verdict you must sacrifice.

  ### 1. Breaking Your Draft Principle
  *Draft: "A group may secede if either it suffers serious and persistent injustice within the state, or the state's own constitutional order has authorised a vote on the question and the group wins it clearly."*

  **Failure A: The Rich Region (The "Greed" Problem)**
  Your principle says an authorised vote is enough. Your intuition says a rich region voting to avoid redistribution is *not* enough.
  *Why it breaks:* Pure proceduralism allows "free-riding" secession. If the only criterion is a vote, any wealthy suburb could vote to secede from a city to avoid funding public schools. Your intuition correctly identifies that secession requires a *political* claim, not just an economic preference. Your draft principle lacks a **National Identity** or **Political Community** clause.

  **Failure B: Somaliland and Biafra (The "Effectivity" Problem)**
  Your principle says injustice is enough. Yet you hesitate on Biafra because they lost, and you champion Somaliland because they "work."
  *Why it breaks:* Your draft principle is deontological (based on rights/duty), but your intuitions on these cases are consequentialist (based on outcomes/stability). You are unwilling to grant full "legitimacy" to a cause that results in a failed state or a humanitarian disaster, even if the *cause* was just. Your draft principle lacks a **Viability** constraint.

  **Failure C: The Recursive Case (The "Nesting" Problem)**
  Your principle says a group may secede. It does not define the *group*.
  *Why it breaks:* If Kosovo can secede from Serbia because it is a distinct unit, why can't the Serb-majority north secede from Kosovo? Your principle allows infinite regression. You need a **Lock-In** rule regarding which administrative borders are eligible for secession.

  ### 2. The Reconstructed Principle
  To save your intuitions, you need a **Two-Stage Framework**. You must separate *Internal Entitlement* (the right to try) from *External Recognition* (the right to succeed).

  **Stage 1: Internal Entitlement (The Right to Secede)**
  *A political community is morally entitled to initiate secession if:*
  1.  **The Identity Condition:** The group constitutes a distinct political community (defined by history, culture, or sustained administrative boundary), *not* merely an economic cohort. (This kills the Rich Region case; saves Scotland/Quebec).
  2.  **The Justification Condition:** EITHER **(A)** The central state consents to a referendum (Scotland), OR **(B)** The group suffers persistent, serious injustice/remedial harm (Kosovo/Bangladesh/Biafra). (This saves Catalonia from being "equal" to Scotland, but allows Kosovo).
  3.  **The Democratic Condition:** A clear majority supports it in a free and fair vote. (This handles the 43% turnout issue in Catalonia).

  **Stage 2: External Recognition (The Right to Statehood)**
  *Other states should recognise the new entity if:*
  1.  **The Viability Condition:** The entity demonstrates the capacity to govern effectively and sustain basic rights (Somaliland passes; failed warlords fail).
  2.  **The Stability Condition:** Recognition does not predictably trigger immediate, aggressive war or greater humanitarian catastrophe than the status quo (This is where Biafra struggles in retrospect, though the *entitlement* remained).
  3.  **The Lock-In Condition:** Recognition applies only to the pre-existing administrative unit, not sub-regions within it. (This blocks the Serbs in Kosovo and Anglophones in Montreal).

  ### 3. Application to New Cases

  **Case 1: Engineered Demographics**
  *A region whose demographics were deliberately engineered by the central government (e.g., settler colonialism) so the local "majority" is a product of injustice.*
  *   **Verdict:** **No Entitlement.**
  *   **Reasoning:** Fails the **Identity Condition**. If the "political community" is an artifact of oppression designed to dilute the indigenous claim, the "majority" is illegitimate. The unit for the vote must be the pre-engineering boundary or the indigenous population itself. This aligns with your discomfort about "internal borders wearing a costume."

  **Case 2: Joining a Neighbour (Irredentism)**
  *A region wants to secede not to become a new state, but to join a neighbouring state (e.g., Northern Ireland joining Ireland).*
  *   **Verdict:** **Higher Bar for Recognition.**
  *   **Reasoning:** Entitlement remains (if Identity/Justification/Democratic conditions are met). However, **External Recognition** now requires the consent of the *receiving* state to avoid triggering aggressive war. This distinguishes it from "new state" secession. It aligns with your intuition that joining a neighbor is more destabilizing than standing alone.

  **Case 3: Strong Claim, No State Capacity**
  *A group has a massive injustice claim (Remedial) and a clear vote, but no institutions, no economy, and no police (e.g., a theoretical stateless nation).*
  *   **Verdict:** **Entitled, but not Recognised.**
  *   **Reasoning:** This resolves your Biafra/Somaliland tension. They had the *right* to leave (Stage 1), but the international community was not obligated to recognise them until they showed capacity (Stage 2). You can morally support their secession while pragmatically withholding recognition. This allows you to say "Biafra was right" without saying "Biafra should have been a UN member in 1968."

  **Case 4: Supermajority or Turnout Thresholds**
  *Is a 50%+1 vote enough, or do we need 60% / high turnout?*
  *   **Verdict:** **50%+1 is sufficient, provided the Question is Clear.**
  *   **Reasoning:** Thresholds are usually "status quo defending itself with extra steps." However, your intuition on Catalonia (43% turnout) suggests you care about **Democratic Salience**. The rule should be: 50%+1 of *valid votes*, provided turnout exceeds a minimum threshold of the *electorate* (e.g., 40-50%) to prove this isn't just a motivated minority. This validates Scotland (high turnout) and invalidates Catalonia (low turnout/boycott), without requiring a supermajority which effectively gives a veto to the status quo.

  ### 4. The Sacrifice: Which Verdict Must Go?

  You cannot save the pile. You have to drop one intuition to make the system coherent.

  **The Verdict to Drop:** *"Half-plus-one of one province shouldn't be allowed to break up a country."* (The Quebec Tension).

  **Why:** This intuition is in direct logical conflict with your Scotland verdict. If Scotland (a province) can leave on a vote, Quebec (a province) can leave on a vote. If you keep this tension, you are not a democrat on this issue; you are a conservative who believes the existing state has a moral priority over the will of its inhabitants.
  *   **The Cost:** You must accept that if Quebec votes 50%+1 in an agreed referendum, Canada *must* let them go, even if it breaks the country.
  *   **The Gain:** You resolve the "Democratic" vs "Status Quo" conflict. You align Scotland and Quebec.

  **The Second-Best Principle (If you refuse to drop the Quebec Tension):**
  If you cannot accept that 50%+1 can break a country, you are not a Primary Right theorist. You are a **Remedial Right Only** theorist.
  *   **Principle:** "Secession is only legitimate as a last resort against persistent injustice."
  *   **Consequence:** You must then declare **Scotland 2014** as *not inherently legitimate*. You would have to argue Scotland was only legitimate because London *allowed* it, not because Scots had a right to demand it. This makes secession a gift from the center, not a right of the periphery. This fits your "Rich Region" intuition better but makes you vulnerable to the "Catalonia" critique (why should Madrid have veto power?).

  ### 5. Blunt Diagnosis: Entitlement vs. Recognition

  You suspected it. Here is the confirmation: **Yes, you are confusing them.**

  *   **Biafra:** You feel they were *entitled* (Injustice) but not *recognised* (Failed/Victory). Your text says "almost nobody... says so [legitimate]... except that Bangladesh won." You are letting the outcome (Recognition) dictate the morality (Entitlement).
      *   *Fix:* Biafra was morally entitled. They were denied recognition due to Viability/Stability constraints.
  *   **Somaliland:** You say "recognition is overdue." You are mixing the two. They have *Entitlement* (Injustice/Consensus/Time) and *Viability* (Functioning). They lack *Recognition* purely due to international inertia (AU border rules).
      *   *Fix:* Somaliland passes both stages. The failure is in the international system, not your principle.
  *   **Crimea:** You say "foreign troops." This is a **Viability/Stability** killer. A secession caused by foreign invasion fails the Stability Condition for Recognition, regardless of the vote.
      *   *Fix:* Crimea fails Stage 2 (Recognition) because the process was coerced, which also contaminates Stage 1 (Democratic Condition).

  ### Summary for Your Seminar

  If you want a principle you can apply to a case you've never seen, use this:

  > **The Qualified Democratic-Remedial Principle:**
  > A sub-state region is morally entitled to secede if it constitutes a distinct political community and either (a) achieves a clear majority in a constitutionally authorised referendum, or (b) suffers persistent, serious injustice that cannot be remedied within the union.
  >
  > However, international recognition of that secession is contingent on the new entity demonstrating effective governance (Viability) and ensuring that its creation does not precipitate greater humanitarian harm or aggressive war than the status quo (Stability). Sub-regions within a seceding territory do not inherit this right recursively (Lock-In).

  **What you tell your students:**
  The hardest part of secession theory is not deciding who gets to leave. It is deciding **who decides who gets to decide.** (The *demos* problem). Your intuitions show you want the *demos* to be the historical province (Scotland/Quebec), not the economic class (Rich Region) or the ethnic enclave (Kosovo Serbs). Stick to historical administrative borders as the default unit, require democracy or injustice as the trigger, and admit that "winning" (Viability) is a requirement for *statehood*, but not for the *right to try*.

  Drop the Quebec hesitation. It's the only thing stopping you from having a coherent theory.
