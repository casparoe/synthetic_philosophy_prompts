prompt: |-
  I'm auditing a cog sci seminar this term that I'm not actually registered for — the prof just lets anyone sit in the back — and after section last week two of the TAs got into a fairly heated argument about Dennett's color phi material and the multiple drafts model. I was packing up my stuff so I only caught maybe half of it live, and I wrote down the shape of it on the bus home. I've since gone back and read up on the experiment itself so I'm confident about the setup, but the argument I'm reconstructing from memory, so take the wording as mine, not theirs. The setup they were fighting over: two lights, say one red and one green, flash a few degrees apart in quick succession, and people reliably report seeing a single spot slide across the field and change color partway along — even though at the moment of the reported color change, the second light hasn't flashed yet. One TA (I'll call him R) said this is the killer argument against any Cartesian theater picture: the brain has written the story before it had all the facts, so either it revised the record afterwards, the Orwellian option, or it stalled and delivered the whole finished experience late, the Stalinesque option, and the crucial move is that the two can't be told apart even in principle, so there's no fact about which moment the experience really happened at, which is just another way of saying there is no such moment. The other TA (M) said he had it exactly backwards. Here's the exchange as best I can rebuild it:

  (1) R: an experiment whose two candidate explanations are indistinguishable even in principle isn't a failed experiment, it's a proof that there's no fact there to get wrong — and a picture of the mind that requires such a fact is thereby refuted, not merely unsupported. (2) M: that's verificationism in a lab coat. You don't get to delete a feature of the world by pointing out nobody could ever detect it; that's a rule you've adopted about what counts as a fact, not a discovery about consciousness, and by the same rule there could never be evidence for a theater either, which makes R's position unfalsifiable and therefore not the achievement he thinks. (3) R: it isn't a rule about evidence, it's about what the fact would have to be made of. The two options agree on every physical event, every timing, every disposition to report; the only thing they differ on is whether the disputed processing is labelled pre-experiential or post-experiential, and that label isn't a further item in the world. If two candidate facts leave literally nothing else different, there's no leftover for the fact to consist in. (4) M: even granting that, all you've shown is that the boundary isn't a further physical fact. You haven't shown there's no such thing as what it's like to see the spot move and change color — you've described the machinery in detail and then declared the hard part dissolved, which is a rhetorical move, not an argument. (5) R: then answer this without a little person in the middle. Something has to notice that a given draft has arrived, or there's no such thing as arrival. Either there's an inner noticer, in which case we're off on the homunculus regress, or there isn't, in which case it's distributed and there's no arrival — which is the multiple drafts view. (6) M: no homunculus needed. The theater can be a functional role, played by whatever subsystem is currently in the business of generating the report; that's bog-standard functionalism, not a metaphysical finish line. R's reply, which I only half caught, was something like: if the finish line just is wherever the report gets made, then the report-maker is downstream of experience rather than its seat, and you've redefined the theater instead of defending it — but I'm genuinely not sure he said that or whether I've invented it.

  So: can you go through the six moves one at a time and tell me who's right at each, rating each move from clearly mistaken to clearly right with a sentence or two of justification, rather than just giving me an overall winner? I'd also like to know what neither of them said — is there a third position on color phi that both of them were ignoring, and does it help R or M? And please actually commit: if one of them is substantially right about the central issue, say so and tell me how confident you are in that and in each individual rating, instead of hedging everything into a draw just because they were both smart people arguing in good faith. Finally, if you think my reconstruction is the problem here — that move (5) or (6) isn't a move anyone who knows this literature would make, or that I've mangled the Orwellian/Stalinesque distinction in a way that makes the whole exchange unscoreable — say that plainly instead of politely grading an argument nobody actually had.
