      *   *Tone:* Professional, directive, bureaucratic but philosophically informed.

      *(Self-Correction during drafting)*: Make sure the distinction between "Value Judgment" and "Fact" is clear. The ordinance says "standard of living." Defining *what counts* as standard of living is a value judgment (Council's job). Measuring it is a fact job (Analyst's job). The worksheet must catch when the analyst is accidentally making a value judgment.

