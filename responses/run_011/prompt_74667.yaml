      *   **Constraint 1 (Legal/Ordinance):** Payment level based on "standard of living in the city" (undefined).
      *   **Constraint 2 (Stakeholders):**
          *   Council Budget Office: Wants life-satisfaction surveys (wellbeing framework).
          *   Disability Coalition: Wants capability approach (what people can do/be), not just resources or feelings.
          *   Legal Office: Wants administrable and defensible (appeal-proof).
      *   **Constraint 3 (Resources):** 40 designs/year, 1 analyst/afternoon per design. Analysts are not philosophers.
      *   **Constraint 4 (Output):** A decision procedure/worksheet (2 pages max).
      *   **Content Requirements:**
          *   Questions in order.
          *   What counts as a sufficient answer.
          *   Evidence types & ranking.
          *   Stop points.
          *   Hand-up points (values vs. facts).
          *   Grounded in "currency of equality" arguments (resources vs. capabilities vs. satisfaction) but simplified.
          *   Handle failure states (missing evidence, unlawful proxies, conflicting measures).
          *   Run the procedure on three specific cases (Energy Supplement, Neighborhood Funds, Carer Supplement).
          *   No citations/scholarship.
          *   Practical/Usable format.

  2.  **Deconstruct the Theoretical Underpinnings (Implicitly):**
      *   *Resources/Income:* Easy to measure, but ignores conversion factors (disability, housing stock).
      *   *Satisfaction/Utility:* Easy to survey, but ignores adaptive preferences (people learn to be satisfied with less).
      *   *Capabilities (Functionings):* Focuses on what people can actually achieve. Harder to measure, but aligns with disability coalition and "standard of living" better than income alone.
      *   *The "Currency of Equality" Debate:* Needs to be distilled into actionable checks.
          *   *Keep:* Conversion factors (disability/housing), Adaptive preferences (satisfaction limits), Administrative feasibility (legal defensibility).
          *   *Drop:* Deep philosophical justification, nuanced distinctions between functionings and capabilities (merge for practicality), complex weighting schemes.

  3.  **Drafting the Decision Procedure (The Worksheet):**
      *   *Goal:* A flowchart-like checklist that fits on ~2 pages.
      *   *Structure:*
          1.  Legality & Feasibility (Gatekeeper).
          2.  Metric Validity (The "Currency" check).
          3.  Conflict Resolution (What if measures disagree?).
          4.  Escalation (When to stop and ask Council).
      *   *Evidence Ranking:* Administrative data > Survey data > Anecdotal/Advocacy data (for defensibility).
      *   *Failure States:* Need specific protocols for missing data or illegal proxies.

  4.  **Refining the "Currency" Checks:**
      *   Need to address the three objections mentioned:
          1.  Income is a poor proxy (conversion factors).
          2.  Satisfaction is a poor proxy (adaptive preferences).
          3.  Compensating preferences is wrong (expensive tastes vs. needs).
      *   *Simplification:*
          *   Check 1: Does the measure ignore known conversion disadvantages? (Addresses Income objection).
          *   Check 2: Does the measure rely solely on self-reported status without objective corroboration? (Addresses Satisfaction objection).
          *   Check 3: Is the measure tracking chosen lifestyle vs. unavoidable constraint? (Addresses Preferences objection).

  5.  **Drafting the Three Case Studies:**
      *   *Case 1 (Energy Supplement):* Income gate vs. Disability/Housing cost data.
          *   *Analysis:* Income fails conversion check. Disability/Housing data supports capability.
          *   *Outcome:* Modify to include disability/housing factors.
      *   *Case 2 (Neighborhood Funds):* Life satisfaction index vs. Deprivation.
          *   *Analysis:* Satisfaction fails adaptive preference check (deprived areas score high).
          *   *Outcome:* Reject satisfaction index as sole criterion. Escalate value conflict.
      *   *Case 3 (Carer Supplement):* Carer condition vs. Hours/Earnings.
          *   *Analysis:* Carer condition tracks capability wellbeing. Hours/Earnings tracks resources.
          *   *User Hope:* Wants it endorsed.
          *   *Constraint:* Administrability/Defensibility. In-home assessment is intrusive/hard to defend.
          *   *Outcome:* Might fail on administrability/legal defensibility despite theoretical soundness. Need to find second-best.

  6.  **Developing the Worksheet Content (Iterative Process):**
      *   *Header:* Standardized.
      *   *Section 1: Legal & Administrative Viability.* (Can we collect this? Can we defend it?)
      *   *Section 2: Metric Validity (The "Currency" Test).* (Does it capture standard of living accurately?)
      *   *Section 3: Conflict & Failure.* (What if data clashes or is missing?)
      *   *Section 4: Escalation.* (When is this a value judgment?)
      *   *Evidence Hierarchy:* 1. Administrative Record, 2. Verified Third-Party Data, 3. Survey/Self-Report.

  7.  **Addressing Specific Constraints:**
      *   *Two Pages:* Need to be concise. Use bullet points, bold text, boxes.
      *   *No Scholarship:* No mentions of Sen, Nussbaum, Dworkin, etc. Just "Conversion Factors," "Adaptive Preferences," etc., explained simply.
      *   *Failure States:* Explicitly included in Section 3.
      *   *Case Runs:* Need to be distinct and follow the worksheet logic.

  8.  **Refining the Carer Case (Case 3):**
      *   The user *hopes* it endorses the carer condition measure.
      *   *Problem:* In-home assessment of sleep/health is highly intrusive and subjective. Legal office wants defensibility. An ALJ will ask: "How did you score sleep?" "Who trained the assessor?"
      *   *Verdict:* The procedure should likely flag this as high risk. If it fails, what is the second-best? Proxy indicators (e.g., care recipient's disability level + relationship) or flat rate + respite voucher.
      *   *Decision:* I must be honest. If the procedure is robust, it should flag the administrability risk. I will structure the recommendation to acknowledge the theoretical strength but highlight the administrative weakness, suggesting a hybrid.

  9.  **Final Review against Constraints:**
      *   Decision procedure? Yes.
      *   Worksheet format? Yes.
      *   Evidence ranking? Yes.
      *   Stop/Hand-up points? Yes.
      *   Failure states? Yes.
      *   Three cases run? Yes.
      *   No citations? Yes.
      *   Two pages (approximate in text output)? I need to keep the text dense but structured.

  10. **Writing the Output:**
