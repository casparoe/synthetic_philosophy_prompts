  # POLICY ANALYSIS WORKSHEET: STANDARD OF LIVING METRICS
  **Unit:** Policy Analysis | **Constraint:** Ordinance "Standard of Living" | **Review Time:** ≤ 4 Hours

  ### OPERATIONAL PRINCIPLES (The "Currency" Rules)
  *Do not debate philosophy. Apply these three filters to every metric.*
  1.  **Conversion Check (Resources):** Does this measure ignore that some households need more money to achieve the same result? (e.g., disability, housing efficiency). *If yes, income alone is insufficient.*
  2.  **Adaptation Check (Satisfaction):** Does this measure rely on how people *feel* about their situation? *If yes, it risks rewarding lowered expectations (adaptive preferences). Corroborate with objective data.*
  3.  **Choice Check (Preferences):** Does this measure compensate for lifestyle choices or unavoidable constraints? *Compensate constraints only.*

  ---

  ### SECTION 1: ADMISSIBILITY & FEASIBILITY (Gatekeeper)
  *If any box is checked "NO," stop. Escalate to Legal.*

  | Question | Pass (Yes) | Fail (No) | Evidence Required |
  | :--- | :---: | :---: | :--- |
  | **1.1 Lawful Collection:** Is the data collection permitted under current privacy statutes and the enabling ordinance? | □ | □ | Legal Memo / Statute Ref |
  | **1.2 Administrative Burden:** Can eligibility be verified within 30 days using existing staff capacity? | □ | □ | Staffing Model / Workflow Map |
  | **1.3 Defensibility:** Is the metric objective enough to withstand an administrative law challenge? (Avoid subjective scoring). | □ | □ | Precedent / Audit Trail Sample |

  **FAILURE STATE A (Unlawful Proxy):** If data is needed but unlawful to collect (e.g., health status without consent), **STOP**. Do not propose workaround. Flag for Council legislative amendment.
  **FAILURE STATE B (Missing Evidence):** If data is lawful but unavailable, proceed to Section 3 (Conflict & Failure).

  ---

  ### SECTION 2: METRIC VALIDITY (The "Currency" Test)
  *Apply the Operational Principles. Rank evidence: (1) Admin Record > (2) Verified Third-Party > (3) Self-Report Survey.*

  | Test | Question | Sufficient Answer | Evidence Type & Rank |
  | :--- | :--- | :--- | :--- |
  | **2.1 Conversion** | Does the metric account for known cost disparities (disability, geography, housing stock)? | **Yes:** Includes adjusters or alternative metrics.<br>**No:** Relies solely on gross income. | (1) Cost-of-living data by subgroup<br>(2) Advocacy group data |
  | **2.2 Adaptation** | Does the metric avoid relying solely on self-reported wellbeing? | **Yes:** Uses objective functionings (e.g., nutrition, heat) or corroborated surveys.<br>**No:** Uses life-satisfaction score alone. | (1) Health/Safety records<br>(2) Survey data (must be validated) |
  | **2.3 Choice** | Does the metric distinguish between chosen lifestyle and imposed constraint? | **Yes:** Targets constraints (e.g., care burden, mobility).<br>**No:** Targets preferences (e.g., hobby costs). | (1) Medical/Functional assessment<br>(2) Income/Expense logs |

  **STOP POINT:** If a metric fails **2.1** or **2.2** without a proposed correction, reject the design. Do not pass to Council.
  **HAND-UP POINT:** If correcting the metric requires re-weighting population groups (e.g., prioritizing disabled over elderly), this is a **Value Judgment**. Stop. Escalate to Council.

  ---

  ### SECTION 3: CONFLICT & FAILURE RESOLUTION
  *Use when data is missing or measures contradict.*

  | Scenario | Procedure |
  | :--- | :--- |
  | **Conflicting Measures** (e.g., Income says "Poor," Satisfaction says "Happy") | **Priority Rule:** Capability/Functioning > Income > Satisfaction.<br>*Rationale:* Satisfaction adapts; Income ignores conversion costs. |
  | **Evidence Unavailable** (Lawful but missing) | Use the closest lawful proxy (e.g., housing age vs. energy efficiency). **Must** attach uncertainty disclaimer to final memo. |
  | **High Administrative Cost** | If precision costs > 15% of program budget, default to the simpler metric **unless** Section 2 fails. If Section 2 fails, Escalate to Council. |

  ---

  ### SECTION 4: ESCALATION PROTOCOL (Values vs. Facts)
  *Complete this box only if Section 2 triggers a HAND-UP.*

  | Issue | Why it is a Value Judgment | Required Council Action |
  | :--- | :--- | :--- |
  | **Weighting** | Choosing which disadvantage counts more (e.g., isolation vs. hunger). | Council must set weighting priorities in policy directive. |
  | **Definition** | Defining "Standard of Living" beyond measurable functionings. | Council must amend ordinance or adopt formal definition. |
  | **Risk Tolerance** | Accepting higher error rates to reduce intrusiveness. | Council must approve risk framework. |

  **Analyst Signature:** ___________________ **Date:** __________
  **Director Review:** ___________________ **Date:** __________

  ***

  # CASE RUNS: APPLICATION OF PROCEDURE

  ### CASE 1: Winter Energy Supplement (Income-Gated)
  **Proposal:** Supplement triggered by metered household income threshold.
  **Challenge:** Coalition data shows mobility-limited/chronically ill households and pre-1940 housing occupants face higher costs for same temperature.

  *   **Section 1 (Admissibility):** **PASS.** Income data is lawful and easy to verify.
  *   **Section 2 (Validity):**
      *   *2.1 Conversion:* **FAIL.** Income alone ignores conversion factors (health status, housing efficiency).
      *   *2.2 Adaptation:* **PASS.** Does not rely on satisfaction.
      *   *2.3 Choice:* **PASS.** Heat is a constraint, not preference.
  *   **Section 3 (Conflict):** N/A (Single metric failure).
  *   **Resolution:** **REJECT DESIGN AS IS.**
  *   **Correction:** Apply Section 2.1 fix. Add adjusters for housing stock age (administrative record) and disability status (verified third-party).
  *   **Outcome:** Modified design proceeds. No Council escalation needed; this is a measurement correction, not a value shift.

  ### CASE 2: Neighborhood Funds (Life Satisfaction Index)
  **Proposal:** Allocate funds based on Council's wellbeing index (life satisfaction). Two deprived neighborhoods score high.
  **Challenge:** Index moves money away from materially deprived areas due to adaptive preferences.

  *   **Section 1 (Admissibility):** **PASS.** Survey data is lawful.
  *   **Section 2 (Validity):**
      *   *2.1 Conversion:* **FAIL.** Ignores material constraints.
      *   *2.2 Adaptation:* **FAIL.** Relies solely on self-reported wellbeing. High scores in deprived areas indicate adaptive preferences (lowered expectations), not high standard of living.
      *   *2.3 Choice:* **PASS.**
  *   **Section 3 (Conflict):** **CONFLICTING MEASURES.** Material deprivation data (Objective) vs. Satisfaction Data (Subjective).
      *   *Apply Priority Rule:* Capability/Functioning (Material Deprivation) > Satisfaction.
  *   **Resolution:** **REJECT INDEX AS SOLE CRITERION.**
  *   **Escalation:** **HAND-UP TO COUNCIL.**
      *   *Reason:* Using the Index alone violates the Operational Principles (Adaptation Check). However, weighting Material Deprivation vs. Satisfaction is a **Value Judgment** (Section 4).
      *   *Recommendation:* Advise Council that satisfaction scores are unreliable for allocation due to adaptive preferences. Propose hybrid model (70% Material Deprivation, 30% Satisfaction) but require Council directive on weighting.

  ### CASE 3: Unpaid Family Carer Supplement (Condition-Based)
  **Proposal:** Payment based on in-home assessment of carer's condition (sleep, health, social contact) rather than hours/earnings.
  **User Hope:** Endorsement.

  *   **Section 1 (Admissibility):** **FAIL (High Risk).**
      *   *1.3 Defensibility:* **FAIL.** In-home assessment of "sleep" or "social contact" is highly subjective. An Administrative Law Judge will question scorer consistency and intrusion levels.
      *   *1.2 Burden:* **FAIL.** Requires trained assessors for every household; likely exceeds 15% cost threshold.
  *   **Section 2 (Validity):**
      *   *2.1 Conversion:* **PASS.** Tracks actual capability deprivation.
      *   *2.2 Adaptation:* **PASS.** Objective health markers (if used) avoid satisfaction bias.
      *   *2.3 Choice:* **PASS.** Care burden is a constraint.
  *   **Section 3 (Conflict):** **FAILURE STATE (Administrative Feasibility).** Theoretically sound metric is administratively indefensible.
  *   **Resolution:** **DO NOT ENDORSE.**
      *   *Why:* While it best captures "Standard of Living" (Capabilities), it fails the Legal/Defensibility Gatekeeper (Section 1.3). It invites appeals on scorer bias and privacy intrusion.
      *   **Second-Best Administrable Rule:** **Proxy Indicator Model.**
          1.  **Base Payment:** Triggered by care recipient's verified disability level (objective medical record) + relationship (legal record).
          2.  **Supplement:** Flat-rate "Respite Voucher" rather than cash tied to carer health.
          3.  **Rationale:** Uses lawful, objective proxies (Section 1 Pass) that correlate strongly with carer capability deprivation (Section 2 Pass) without requiring intrusive home assessments.
