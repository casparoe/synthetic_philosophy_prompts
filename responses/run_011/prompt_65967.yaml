answer: |-
  **MEMORANDUM**

  **TO:** The Ethics Board, Public Fertility Network
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Determination on Application 24-09 (Gestational Carrier Compensation)

  **1. DECISION**

  The Board declines the applicant's request for compensation equivalent to the oocyte donation cap. The clinic is authorized to facilitate this gestational arrangement solely on an expense-reimbursement basis, provided the intended mother and carrier execute a separate legal agreement confirming no prohibited funds will change hands.

  Clinical staff must present both parties with a revised consent addendum specifically distinguishing the risk profile of gestation from that of donation. This addendum must be signed before any medical stimulation begins. We require confirmation that this documentation is complete within fourteen days. If the parties cannot proceed under these conditions, the application is closed.

  **2. STATUTORY CONSTRAINT AND THE FACILITATION QUESTION**

  Half of this Board holds that the statute prohibits only the transfer of funds beyond expenses. The other half holds that it prohibits the clinic from facilitating the arrangement at all, paid or unpaid.

  On this specific procedural point, we can proceed on the narrower reading. **[AGREED PREMISE]** It is broadly accepted in regulatory ethics that where a statute is silent on facilitation but explicit on payment, a public clinic may ethically support the unpaid arrangement to prevent driving the practice underground. **[CONTESTED PREMISE]** However, it remains a live dispute whether state prohibition effectively reduces harm or merely relocates it to unregulated jurisdictions; I am proceeding here on the pragmatic view that relocation occurs, though I acknowledge colleagues who argue that state facilitation legitimizes a practice the legislature intended to stifle.

  Therefore, we do not block the relationship. We block the *price*.

  **3. THE CONSISTENCY OBJECTION**

  The stronger ethical challenge comes from the half of the Board arguing that our payment schedule commits us to the opposite result. Their argument is this: We acknowledge that oocyte donation carries documented physical risk—ovarian hyperstimulation, surgical retrieval, long-term hormonal uncertainty. We compensate for this. Gestation carries higher physical risk. To pay for the lesser risk and refuse payment for the greater is not ethical consistency; it is bookkeeping arbitrage. It suggests we value the *type* of labour (pregnancy) differently than the *procedure* (retrieval), which smells of moralism disguised as protection.

  This argument is robust. If our principle were simply "reproductive labour must not be commodified," we should pay neither. If our principle is "risk deserves compensation," we should pay both. To pay the donor and not the carrier invites the charge that we are protecting the carrier from her own economic judgment in a way we do not protect the donor.

  I treat this objection seriously. It forces us to admit that the statute treats these bodies differently. Our job is to determine if that difference can be ethically defended without relying solely on "the law says so."

  **4. THE BOUNDED-RISK HYPOTHESIS**

  I have proposed to this Board that the distinction lies not in commodification, but in the *boundedness* of the risk. My hypothesis is that our payment schedule implicitly accepts contracts only where the risk is quantified, time-limited, and exit-able.

  *   **Donation:** The cycle is short. The retrieval is a scheduled event. The donor can withdraw consent up to the point of anesthesia without terminating a potential life. The risk is front-loaded and bounded.
  *   **Gestation:** The occupancy is continuous for nine months. Withdrawal requires either medical termination or surrender of the child. The risk is not just physical but relational and moral, and it cannot be exited without significant cost.

  On this reading, we do not pay for surrogacy because we cannot price a risk that the carrier cannot fully leave. We pay for donation because the risk window closes.

  **5. CRITIQUE OF THE HYPOTHESIS**

  I must now subject my own proposal to the same scrutiny I would apply to a dose-response model. While the bounded-risk theory explains our intuitions, it fails on three specific points. I mark these failures clearly so the Board sees where my reasoning leans on contested ground.

  *   **Failure Point 1: The Cap.** **[CONTESTED PREMISE]** If the principle were truly that we pay for *priced* risks, the compensation should reflect the actuarial risk. Instead, we impose a *cap*. A cap is not a price; it is a moral limit. It admits that we do not believe the risk can be fully priced, or that we refuse to price it fully even if we could. This undermines the claim that we pay donors because their risk is "quantifiable." We pay them despite the quantification being incomplete.
  *   **Failure Point 2: Long-Term Donation Risk.** **[AGREED PREMISE]** It is medically established that oocyte donation carries long-term uncertainties regarding fertility and hormonal health that extend well beyond the "bounded" retrieval window. **[CONTESTED PREMISE]** Whether these long-term risks are comparable to gestational risk is a live medical dispute. However, by capping payment, we acknowledge we are not paying for the *full* risk profile of donation either. If we are willing to contract for donation risks that are not fully bounded, the "boundedness" principle is inconsistent.
  *   **Failure Point 3: Exit Rights.** **[CONTESTED PREMISE]** It is a live legal and ethical dispute whether a gestational carrier truly lacks exit rights. In this jurisdiction, a carrier retains bodily autonomy and may terminate a pregnancy. **[AGREED PREMISE]** It is broadly agreed, however, that the *social and psychological* cost of that exit is vastly higher than walking away from a retrieval appointment. My hypothesis relies on the psychological cost being a relevant factor in "contractibility." Some Board members will argue that only physical contractibility matters. If they are right, my hypothesis fails.

  **Conclusion on the Hypothesis:** The bounded-risk model is useful for explaining why gestation feels different from donation, but it cannot bear the weight of justifying the payment disparity on its own. The cap on donation proves we are already willing to pay for risks we cannot fully price or bound. Therefore, the prohibition on surrogacy payment is not logically derived from the donation schedule. It is an external moral constraint imposed by the statute, not an internal consistency of our ethics.

  **6. RECOMMENDATION**

  We must deny the payment. Not because the ethics are clear, but because the statute is. However, we must not pretend the ethics are settled.

  1.  **Deny Compensation:** Inform the applicant that the clinic cannot process the capped sum for gestation.
  2.  **Allow Facilitation:** Permit the clinic to manage the medical care on an expense-only basis.
  3.  **Transparency:** The consent addendum mentioned in Section 1 must explicitly state: *The Network compensates oocyte donation because the procedure is time-limited. The Network does not compensate gestation because the statute distinguishes the two, acknowledging that gestation involves continuous bodily occupancy that cannot be exited without significant moral or physical cost.*

  This language does not solve the philosophical inconsistency. It names it. It allows the Board to vote for the denial without lying to the applicant about why. It acknowledges the "bookkeeping" charge by admitting the distinction is statutory, not necessarily actuarial.

  **7. NEXT STEPS**

  *   **Clinical Director:** Draft the risk-distinction addendum by next Tuesday.
  *   **Legal Counsel:** Confirm that facilitating the unpaid arrangement does not violate the "spirit" of the statute under current case law.
  *   **Board:** We will vote on this memo's framework at the next meeting. If the vote fails, the application is rejected in full.

  I circulate this now so that we may argue the premises, not just the conclusion. If we are to pay for bounded risk but not unbounded risk, we must explain why we cap the payment for the former. If we cannot, we should consider whether we ought to stop paying donors, or stop pretending the surrogacy prohibition is purely protective.

  For now, we follow the law, but we document the fracture.
