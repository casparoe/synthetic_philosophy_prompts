answer: |-
  **Q&A PREP SHEET: Accountability & Famine Variance**
  **Audience:** Econ Hist, Demog, 1 PolSci (State Capacity), 1 China Specialist.
  **Tone:** Empirical, institutional, mechanism-focused. No moralizing.

  ### 1. The "State Capacity" Confound (High Damage)
  **The Objection:** (From the PolSci/Econ Hist overlap) "You're conflating *will* with *ability*. In the GLF and Ireland, did the state lack the *accountability* to act, or did it lack the *administrative capacity* to distribute food even if it wanted to? If capacity is the binding constraint, your accountability variable is spurious."
  **First-Sentence Concession:** "You are right that capacity and accountability are empirically tangled, and I am not arguing capacity is irrelevant."
  **Two-Minute Reply:** "I distinguish between *logistical* capacity (can we move grain?) and *political* capacity (will we prioritize this over other goals?). In Ireland, the logistical capacity existed—grain was actively being exported *out* of famine zones under armed guard. In the GLF, procurement continued despite local yield reports, suggesting the constraint wasn't knowledge or transport, but the incentive structure facing local officials. My argument is that accountability determines the *allocation* of existing capacity. When accountability breaks, capacity is weaponized against the vulnerable rather than deployed for them."
  **Soft Spot:** In the GLF case, the breakdown of local statistical bureaus *did* impair logistical capacity. You need to be careful not to overstate the state's functional ability during the peak crisis.

  ### 2. The "Sen Rebranding" Charge (High Damage)
  **The Objection:** (From the Econ Hist) "This looks like Amartya Sen's 'Democracy prevents famine' thesis with new vocabulary. If 'accountability' just maps onto regime type, what is your marginal contribution? Why isn't this just Sen 1981?"
  **First-Sentence Concession:** "Sen's work is the foundation here, but my mechanism is narrower and more institutional than regime type."
  **Two-Minute Reply:** "Sen focuses on democracy as a binary; I focus on accountability channels which can vary within regimes. Bengal 1943 is the key differentiator: it was under a colonial democracy (Britain), yet no accountability existed because Indian voters couldn't punish British MPs. Conversely, some autocracies face accountability via threat of revolt or elite factionalism. By focusing on the specific *link* between ruler survival and peasant survival, I explain variance that regime type misses, specifically why famines occur in democracies with excluded populations (Bengal) or autocracies facing no immediate threat (GLF early phase)."
  **Soft Spot:** Empirically, your accountability measure correlates highly with democracy. Disentangling them requires case-law nuance that might look like post-hoc rationalization.

  ### 3. Identification & Counterfactuals (High Damage)
  **The Objection:** (From the Econ Hist) "How do you identify the causal effect of accountability? You're comparing across centuries and regimes. What is your counterfactual baseline for 'accountability' in 1840s Ireland, and how do you know it, and not unobserved economic shocks, drove the mortality variance?"
  **First-Sentence Concession:** "I cannot offer a randomized control trial for 19th-century colonial policy."
  **Two-Minute Reply:** "My identification strategy relies on 'natural experiments' of environmental shock. I compare regions with similar drought severity but different accountability structures (the 'severe droughts without famine' cases). If the shock is the control, the variance in mortality must come from the policy response. The counterfactual is the demographic trajectory of similar regions that experienced the same weather shock but had different political constraints on their rulers. The divergence in death rates tracks the political variable, not the climatic one."
  **Soft Spot:** The "similar regions" control is weak. Cultural and economic heterogeneity between, say, 1840s Ireland and a modern drought case is massive.

  ### 4. The Chinese Mortality Data (Medium-High Damage)
  **The Objection:** (From the China Specialist) "GLF mortality estimates range from 15 to 45 million depending on the reconstruction method. If your variance argument rests on the magnitude of the GLF death toll, how much of your thesis survives if the lower-bound estimates are correct?"
  **First-Sentence Concession:** "The exact magnitude of GLF mortality is still contested, and I do not rely on a single point estimate."
  **Two-Minute Reply:** "My argument relies on the *order of magnitude* relative to the drought severity, not the precise digit. Even at the lower bound, the excess mortality is catastrophic compared to non-famine droughts. Furthermore, I use the *timing* of the mortality spike relative to policy shifts. The mortality peaked *after* grain availability recovered in some areas, which points to distribution failure driven by local official incentives (accountability to superiors, not locals) rather than pure availability. The data noise doesn't erase the structural break in the mortality curve."
  **Soft Spot:** If the specialist argues the "excess mortality" is actually baseline volatility + migration undercounting, your "catastrophe" claim weakens.

  ### 5. The Irish Grain Export Mechanism (Medium Damage)
  **The Objection:** (From the Econ Hist) "You dismiss Entitlements, but in Ireland, food was leaving the country while people starved. Isn't that the definition of an entitlement failure? How does 'accountability' explain the specific market mechanics of the export trade?"
  **First-Sentence Concession:** "Entitlement failure is the *mechanism* of starvation, but not the *cause* of the policy."
  **Two-Minute Reply:** "Sen explains *how* people starved (they couldn't command food); I explain *why* the state allowed the entitlement structure to collapse. The grain exports continued because the British government was accountable to British taxpayers and merchants, not Irish tenants. Stopping exports would have violated property rights held by constituents who could vote. Accountability explains why the entitlement failure was permitted to persist. It sits upstream of the market mechanics."
  **Soft Spot:** You risk sounding like you're ignoring the micro-economics of price spikes which also killed people independent of state policy.

  ### 6. Operationalizing Accountability (Medium Damage)
  **The Objection:** (From the PolSci) "How do you code 'accountability' without looking at the famine outcome first? If you define high accountability as 'states that didn't let people starve,' your argument is tautological."
  **First-Sentence Concession:** "That is a valid concern about ex-post coding, and I guard against it."
  **Two-Minute Reply:** "I code accountability based on *ex-ante* institutional rules: franchise extension, press freedom, colonial oversight structures, and elite competition *prior* to the shock. For example, in Bengal, I code low accountability because the franchise was excluded, regardless of the famine outcome. In the drought cases that didn't turn into famines, I code higher accountability based on electoral cycles or fear of unrest. The measure is independent of the mortality data."
  **Soft Spot:** Your coding of "fear of unrest" in autocracies is inherently subjective and hard to verify before the fact.

  ### 7. Dismissing Proximate Causes (Medium Damage)
  **The Objection:** (From the Demographer) "You call the FAD vs. Entitlement fight a 'dead end.' But demographers need to know the biological cause of death. If you ignore availability, aren't you missing half the picture?"
  **First-Sentence Concession:** "I do not deny that food availability matters biologically."
  **Two-Minute Reply:** "I argue it is a dead end for explaining *variance* in death tolls across cases. Both FAD and Entitlement approaches describe the immediate trigger, but neither explains why some triggers kill millions and others kill thousands. My goal is to explain the variance in the death toll, not the physiological mechanism of starvation. You can have FAD without famine (drought cases) and Entitlement failure without mass death (recessions). Accountability is the filter that determines which proximate causes become lethal."
  **Soft Spot:** Dismissing FAD entirely is risky; in the GLF, procurement *did* physically remove food from villages. That's not just entitlement, that's availability.

  ### 8. Selection Bias (Low-Medium Damage)
  **The Objection:** (From the Econ Hist) "You've selected four famous famines and a few 'success' cases. What about accountability failures that didn't produce famines, or famines in high-accountability settings? Isn't this cherry-picking?"
  **First-Sentence Concession:** "The sample size is necessarily small given the rarity of mega-famines."
  **Two-Minute Reply:** "I am selecting on the dependent variable to establish necessity, but the inclusion of the 'severe droughts without famine' cases is my check for sufficiency. These are the critical controls. I acknowledge I cannot generalize to minor food crises, but for 'Great Famines' (5%+ mortality), the accountability threshold appears consistent. I invite suggestions for other large-N tests, but the data quality for historical mortality usually precludes it."
  **Soft Spot:** There are likely cases of high-accountability states with high mortality (e.g., siege situations) that you are excluding as 'war' rather than 'famine.'

  ***

  ### The Question You Hope Nobody Asks
  **"If a state successfully prevents a famine, do you code that as high accountability? And if so, isn't your independent variable defined by the absence of your dependent variable?"**

  *Why this kills you:* It charges you with tautology. If "Accountability" = "Did not starve people," then "Accountability prevents starvation" is meaningless.
  *Prep:* You must insist accountability is coded on *institutional structure* (votes, press, oversight), not outcomes. If you waffle here, the whole causal claim collapses.
