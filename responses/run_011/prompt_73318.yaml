answer: |-
  You have reconstructed a classic philosophical objection to David Lewis's theory, and you have done it with a clarity that many graduate students would envy. Your argument is valid: if you accept your premises, the conclusion follows. Since you (rightly) reject the conclusion, one of the premises must be false.

  You suspect Step (6) is the culprit, but the rot sets in earlier. The step you must reject is **Step (3)**, which leads directly to **Step (4)**.

  Here is why Step (3) looked so natural to you, why it is technically incorrect within Lewis's framework, what you pay to reject it, and why your depot examples in Step (2) remain safe.

  ### 1. Why Step (3) Looked Natural
  You work in logistics. You see systems. To a systems thinker, a norm is a stabilizing mechanism. If everyone stops signaling turns, the depot crashes. If everyone stops stealing, the depot runs smoothly. In both cases, *expectations* drive behavior. If I expect you to signal, I will plan my route accordingly. If I expect you to steal, I will lock my cargo.

  This insight—that norms are sustained by mutual expectations—is indeed the "one real insight" you got from Lewis, and it is correct. Lewis's great contribution was showing how order can emerge from self-interest without a central authority. Because moral norms *also* rely on expectations (I keep my promise because I expect you to keep yours), it feels natural to categorize them as the same kind of object: a convention.

  ### 2. The Technical Error: Coordination vs. Prisoner's Dilemma
  The error lies in the *type of problem* the norm is solving. Lewis's definition of convention (Step 1) is specifically designed to solve **Coordination Problems**, not **Prisoner's Dilemmas**.

  *   **Coordination Problem (Driving):** We both want to avoid crashing. I don't care if we drive on the left or the right, I only care that we do the *same* thing. Our interests are perfectly aligned regarding the *rule*, even if the rule itself is arbitrary.
  *   **Prisoner's Dilemma (Promise-Keeping):** We both want the *benefit* of the other's promise, but I often prefer to *break* my own promise if I can get away with it (to save effort or gain an advantage). Our interests conflict regarding the *action*, even if we agree on the *outcome*.

  In Step (3), you write: *"if everybody else had stopped keeping promises, my keeping mine would only make me the one person worth deceiving."*

  This is true, but it describes a **Nash Equilibrium** (a state where no one gains by moving alone), not a **Lewisian Convention**. Lewis requires that the regularity be *arbitrary* because there is *another* regularity that serves the *same interest* equally well.

  ### 3. Why Step (6) Fails
  This brings us to Step (6): *"For promise-keeping the alternative is universal treachery... It looks like an equilibrium... so it satisfies the clauses too."*

  Here is the disqualification: **Universal treachery is not an "equally good solution" to the same problem.**

  In Lewis's theory, a convention must be a solution to a *common interest*.
  *   **Driving:** "All Left" and "All Right" are *Pareto-equal*. Neither is better than the other; they just need to match.
  *   **Promises:** "Universal Honesty" and "Universal Treachery" are *Pareto-ranked*. Everyone (or almost everyone) prefers the world where promises are kept over the world where they are broken.

  Universal treachery is a stable state (a "bad" equilibrium), but it is not a *convention* in Lewis's sense because it does not satisfy the preference condition in Step (1): *"general conformity is generally preferred to slightly-less-than-general conformity."*

  In a treachery world, I do not prefer that *you* conform to treachery. I actually prefer that *you* break the norm of treachery and keep your promise to me, even while I continue to betray you. In a driving convention, I *never* prefer that you break the norm (I never want you driving on the wrong side).

  Because the alternative (treachery) is objectively worse for the participants' interests than the norm (honesty), the norm is **not arbitrary**. It is compelled by the payoff structure of reality, not just by the need to match behavior. Therefore, promise-keeping fails the "arbitrariness" clause of Step (1).

  ### 4. What You Pay in Place
  By rejecting Step (3) and (4), you pay a specific price: **You must admit that moral norms are not *merely* conventions.**

  You have to accept that "Don't lie" is a different *kind* of social object than "Drive on the left."
  *   **Depot Conventions:** These are fragile. If enough people decide to drive on the other side, the old rule dies instantly. It has no moral weight beyond coordination.
  *   **Moral Norms:** These are robust. Even if everyone else started lying, you might feel you *ought* to tell the truth. They rely on internal sanctions (guilt), external sanctions (punishment), and often a belief in objective value, not just the expectation of matching behavior.

  You lose the elegant reductionism that turns all social order into logistics. You cannot explain morality *away* as just another habit. But you keep your insight: expectations *do* play a huge role in sustaining morality, even if they aren't the *whole* story.

  ### 5. Do Your Examples in (2) Survive?
  Yes. Your examples in Step (2) are safe.

  *   **Driving Side:** Truly arbitrary. Left is not morally better than Right. It is a pure coordination problem.
  *   **Potluck:** Truly arbitrary. Host-provided vs. Guest-provided are roughly equal in value; the point is just to avoid double-booking or starvation.

  These survive because the alternatives *are* equally good solutions. "Universal Treachery" is not an equally good solution to "Universal Honesty." Therefore, the disqualification that swallows promise-keeping does not swallow driving.

  ### Summary
  You built a *reductio ad absurdum* of the idea that "All norms are Lewisian conventions."
  *   **Reject:** Step (3) and (4). Moral norms are not Lewisian conventions because they solve Prisoner's Dilemmas, not Coordination Problems.
  *   **Why Step (6) fails:** Universal treachery is a "bad" equilibrium. It is not an *alternative convention*; it is the *collapse of cooperation*. Lewisian conventions require the alternatives to be roughly equal in value.
  *   **The Cost:** You must distinguish between "conventional norms" (depot rules, driving) and "moral norms" (promises, honesty). The former are arbitrary; the latter are not.
  *   **The Gain:** You preserve the intuition that some norms are arbitrary (Step 2) without being forced to accept that morality is arbitrary (Step 8).

  Your reading of Lewis was sharp enough to find the boundary where his theory stops applying. That is not a failure of your argument; it is a success of your analysis. Lewis himself would agree with you: he never intended his theory of convention to cover moral obligations, precisely for the reasons you uncovered.
