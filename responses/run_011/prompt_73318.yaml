      *   (4) *Classification:* Therefore, moral norms are conventions. This is the controversial move. Lewis explicitly *denies* this in later work and implies it in *Convention*.
      *   (5) *Arbitrariness:* If they are conventions, they must be arbitrary (another solution existed).
      *   (6) *The Alternative:* Universal treachery is the alternative equilibrium.
