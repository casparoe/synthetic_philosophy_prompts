      5. Show why Step (2) survives (Driving is truly arbitrary).
      6. Discuss the "cost" (Moral norms are heavier than conventions).

      *Let's refine the "Cost".* If we reject (4), we admit that moral norms are *not* merely conventions. They rely on something else (sanctions, internal guilt, objective value). The cost is we can't reduce morality to logistics. But we keep the insight that expectations matter.

      *Final check on Step (6):* "It looks like an equilibrium... nobody could improve on by moving alone." This is the definition of a Nash Equilibrium. Universal defection *is* a Nash Equilibrium in a PD. So the user is technically right about game theory. The error is in Lewis's definition of *Convention*. Lewis requires the equilibrium to be a *Coordination Equilibrium*. A Coordination Equilibrium requires that *no one would prefer anyone else to have acted differently* (given the actions of others). In universal treachery, I would prefer *you* to have kept your promise (so I could exploit you, or just benefit from trust). Wait, if I'm a pure defector, I prefer you to be a sucker. But if we are considering the *group interest*, treachery is inferior. Lewis's definition implies a common interest in the *existence* of the convention.
