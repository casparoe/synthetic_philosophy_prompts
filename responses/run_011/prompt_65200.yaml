answer: |-
  1. You should reject premise (2), which falsely equates the semantic content of a sentence with the illocutionary force of its assertoric use. This step looked respectable because it captures the intuitive difference between genuinely holding an attitude and merely hypothesizing one.

  2. Denying (2) allows expressivism to treat moral sentences as encoding attitude-types that can be embedded without current manifestation. The cost is constructing a compositional semantics for complex attitudes, such as disapproving of a combination of disapproval and action.

  3. This diagnosis protects probabilistic semantics because partial credences can be encoded in conditionals without being asserted as actual belief states. Adams's thesis survives because conditional credences are structural relations rather than asserted reports of probability.

  4. If you instead retain (2) and adopt a hybrid theory, you pay by surrendering the core expressivist claim that moral thought is fundamentally non-cognitive. This exit secures logical validity but duplicates the ontology by adding truth-apt content to do the logical work.

  5. The final exit is rejecting (6) to redefine validity as consistency of attitudes rather than truth-preservation. This is semantically cheap but philosophically costly, as it requires abandoning classical logic for moral discourse and accepting a radical discontinuity with factual reasoning.
