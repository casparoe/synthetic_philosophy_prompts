answer: |-
  **Artefact Identity Decision Procedure**

  **Purpose**
  This document provides a decision procedure for determining whether a stored analytical artefact at time *T2* is numerically identical to an artefact referenced at time *T1*. Use this during design reviews to resolve disputes regarding provenance, licensing, and audit lineage. It translates metaphysical persistence conditions into engineering checks.

  **The Procedure**

  **1. Define the Artefact Kind**
  State the specific sort of thing this is (e.g., 'Vendor Licence', 'Curated Report', 'Training Model').
  *   **Sufficient Answer:** A noun phrase that implies specific survival conditions (e.g., 'A report' survives formatting changes; 'A licensed dataset' does not survive unauthorised derivation).
  *   **Branch:** If the kind is undefined, stop. You cannot assess identity without knowing what sort of thing you are tracking.
  *   **Metaphysical Position:** Identity is sortal-dependent; a thing is only the same relative to a kind term.
  *   **Rival Impact:** If you assume identity is independent of kind, you will treat a licensed dataset and a derived report as identical simply because they share storage, violating licence terms.
  *   **Stop Marker:** This step is **stipulation**. There is no fact of the matter until your governance lead defines the kind. This is a convention, not a discovery.

  **2. Check Physical Continuity**
  Did the underlying storage bits remain continuous without deletion or complete replacement?
  *   **Sufficient Answer:** Yes (in-place mutation) or No (drop/recreate, full copy).
  *   **Branch:** If 'No', proceed to Step 3. If 'Yes', proceed to Step 4.
  *   **Metaphysical Position:** Material constitution; an artefact is the specific matter occupying a region of space.
  *   **Rival Impact:** If you adopt the rival view (functionalism), you would treat a restored backup as the original artefact despite physical discontinuity, simplifying audit trails but risking physical provenance claims.

  **3. Check Functional Continuity**
  Does the artefact perform the exact same role for downstream consumers as before, despite physical replacement?
  *   **Sufficient Answer:** Yes (schema and semantics preserved) or No (role changed).
  *   **Branch:** If 'Yes', identity holds (restoration). If 'No', identity breaks (replacement).
  *   **Metaphysical Position:** Functionalism; an artefact is defined by its causal role rather than its matter.
  *   **Rival Impact:** If you adopt the rival view (strict materialism), a dropped and rebuilt table is a new artefact, forcing you to regenerate all downstream lineage records even for byte-identical restores.

  **4. Check for Branching**
  Did the artefact split into two distinct successors (e.g., a fork into two environments)?
  *   **Sufficient Answer:** Yes (two active descendants) or No (single lineage).
  *   **Branch:** If 'Yes', identity breaks for both (see Step 5). If 'No', identity holds.
  *   **Metaphysical Position:** No branching; identity is a one-to-one relation over time.
  *   **Rival Impact:** If you allow branching, you must treat both forks as the original, creating ambiguity in audit logs regarding which fork produced a specific decision.

  **5. Check for Coincidence**
  Do two artefacts of different kinds currently occupy the same storage space?
  *   **Sufficient Answer:** Yes (e.g., raw data and report share rows) or No.
  *   **Branch:** If 'Yes', they are distinct artefacts requiring separate identifiers. If 'No', they are one artefact.
  *   **Metaphysical Position:** Coincidence allowed; distinct kinds can occupy the same matter simultaneously.
  *   **Rival Impact:** If you deny coincidence, you must merge the lifecycles of the vendor data and the report, preventing the report from outliving the raw data or vice versa.

  **Worked Runs**

  **(i) Coinciding Vendor Dataset and Curated Report**
  *   **Step 1:** Kind is 'Vendor Dataset' vs 'Curated Report'.
  *   **Step 2:** Physical continuity is shared.
  *   **Step 5:** Coincidence detected. Two kinds occupy one storage layer.
  *   **Outcome:** **Two artefacts.**
  *   **Contradiction:** You currently treat this as one physical table. The procedure dictates you must logically separate them. The vendor dataset survives deletion of the report columns; the report does not survive replacement of vendor rows. You require two identifiers pointing to the same rows, or immediate physical separation.

  **(ii) Fine-Tuned Model (Ship of Theseus)**
  *   **Step 1:** Kind is 'Trained Model'.
  *   **Step 2:** Physical continuity holds (in-place parameter updates).
  *   **Step 4:** No branching.
  *   **Outcome:** **One artefact.**
  *   **Note:** Despite zero original parameters surviving, the functional role and physical storage remained continuous. If your licence defines the model by its initial weights, Step 1 stipulation overrides this, but under standard engineering kinds, this is a single mutating object.

  **(iii) Dropped and Rebuilt Table**
  *   **Step 1:** Kind is 'Analytical Table'.
  *   **Step 2:** Physical continuity broken (drop event).
  *   **Step 3:** Functional continuity holds (byte-identical, same role).
  *   **Outcome:** **One artefact.**
  *   **Contradiction:** You asked if it ceased to exist. The procedure says **no**. Because the functional role was preserved immediately, the artefact persists through the gap. Treating this as a new artefact would break audit lineage unnecessarily.

  **(iv) Forked Dataset**
  *   **Step 1:** Kind is 'Dataset'.
  *   **Step 4:** Branching detected (two divergent environments).
  *   **Outcome:** **Original artefact ceased; two new artefacts exist.**
  *   **Note:** Identity cannot branch. You cannot claim both environments hold the 'original'. You must version them (e.g., Dataset v1-A, v1-B) and mark the pre-fork identifier as closed.

  **Limitations and Judgements**

  This procedure cannot resolve legal disputes. If a licence contract defines 'Dataset' differently than Step 1 stipulates, the contract wins. Metaphysics informs engineering design; it does not override signed agreements.

  Step 1 is a judgement dressed as a procedure. There is no scientific test for whether something is a 'Report' or a 'Dataset'; this is a governance decision. If your team disagrees on the kind, the procedure will not help you until a human authority stipulates the definition.

  Step 3 contains vague boundaries. 'Functional continuity' is a spectrum. If a table gains one new column, is it the same table? The procedure treats this as binary, but in reality, there is a grey zone where identity is indeterminate. In these cases, do not seek the truth; seek consistency. Apply the same threshold for change every time.

  Finally, this procedure assumes a closed system. It will misfire if external factors (e.g., a vendor revoking a licence retroactively) change the survival conditions of an artefact kind after the fact. In such events, revert to Step 1 and re-stipulate the kind definitions.

  **Usage**
  Run this procedure at the whiteboard during design review. Record the answers to each step in the review minutes. If the outcome contradicts existing architecture, treat this as a technical debt item requiring refactoring, not merely a naming issue.
