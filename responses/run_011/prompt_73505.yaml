answer: |-
  Ruth left specific instructions for this moment. She said: "No ungrounded claims."

  For thirty years, I wrote stories, and she wrote papers. I argued that things just *are*—that a character walks into a room because the story needs them to. She argued that nothing just *is*—that everything holds its place only *in virtue of* something else. She demanded reasons. So, I cannot stand here and simply say, "We miss her." That would be a brute fact. It would be an assertion without a foundation.

  I miss her *because* the structure of my life has changed. The family from Cleveland misses her *because* she was the anchor of our shared history. Her students miss her *because* the standard for truth in this room was set by her mind. Every feeling here is grounded. Every tear has a cause, but more importantly, every tear has a reason.

  Ruth was a priority monist. She believed that the parts of the world—me, you, this casket, this room—are not the fundamental building blocks of reality. She believed the Whole is fundamental. We are not separate fragments that bumped into each other and formed a family. We are expressions of a single, unified reality.

  This matters for grief. If we were just isolated parts, then death would be a subtraction. A piece removed from the machine. But if the Whole is fundamental, then separation is less real than connection. She is not gone in the way a brick is gone from a wall. She is absent in the way a silence is present in a song. The song remains the fundamental thing. We are still inside the same Whole she was inside. We are not cut off from her; we are modifications of the same reality that she was.

  She also insisted that grounding is not causation. I need to be precise here, for her sake. She did not *cause* us to be who we are. She did not program us like a machine. Causation is one thing pushing another through time. Grounding is about what makes something real *now*.

  We are who we are *in virtue of* her, not because she pushed us, but because she sustained the context in which we exist. Her rigor grounds our honesty. Her skepticism grounds our search for truth. When I look at my sister in Cleveland, I see Ruth's patience. When I look at her students, I see Ruth's demand for clarity. These are not effects she left behind. They are the continuing presence of her nature, grounded in us.

  Her last project was about infinite descent. She asked: Does the chain of reasons stop? Is there a bottom floor of reality, a "bedrock" where explanations run out? Or does it go down forever?

  Many people fear the bottom dropping out. They want a foundation to stand on. But Ruth suspected there might be no bottom. She suspected the reasons go on forever.

  I want to use that honestly. I am not going to tell you she is in a better place. That is a claim I cannot ground. I don't know where she is. But I know this: If she was right, and there is no fundamental bottom, then the explanation for who she was does not end.

  If grounding is infinite, then the reasons we have to love her are not finite resources. They do not run out. We will not reach a point where we have exhausted the truth of her. There is always another layer of why she mattered. There is always a deeper reason.

  So, we are not standing on a grave waiting for an explanation to stop. We are standing in a current that keeps flowing.

  I cannot say she lives on. That sounds like causation, like a ghost pushing through time. Instead, I say this: The reality that she was part of is still here. The reasons she gave us are still active. The love we feel is grounded in her life, and since that life was part of an infinite descent of meaning, that love has nowhere to bottom out.

  It just goes down. And down. And down.

  Ruth hated ungrounded claims. So I will finish with the only one I can verify. We are here. We are together. And we are here *because* she was.

  Thank you.
