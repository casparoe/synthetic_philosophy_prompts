prompt: |-
  My sister Ruth died in March. She was a metaphysician — grounding and fundamentality were her whole life — and I'm a novelist, so we spent thirty years arguing about whether anything really needs a reason. She left instructions that I give the eulogy, and one of the instructions was: no ungrounded claims.

  Here's what I want. She was a priority monist: she thought the whole is more fundamental than its parts, that parts are grounded in the whole they belong to, and — this mattered enormously to her — grounding is definately not causing, so nobody in that room gets to say she "made" us who we are. Her last unfinished project was about whether grounding has to bottom out at all, or whether there could be endless descent with no fundamental level anywhere. I want that used honestly, and I don't want it smuggled into being a heaven.

  The room will be half her grad students, who'll catch every sloppy "in virtue of," and half our family outside Cleveland, who have never heard the word grounding. Four or five minutes. The philosophy can't be decoration — the monism has to actually carry the comfort, so that somebody who's never read a page of it still feels it. And nothing she'd have called a brute fact.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** Ruth, a metaphysician specializing in grounding and fundamentality.
      *   **Speaker:** Her sibling, a novelist.
      *   **Relationship:** 30 years of debate (novelist vs. metaphysician, reasons vs. no reasons).
      *   **Key Instructions from Ruth:**
          *   No ungrounded claims (everything said must have a basis/reason).
          *   Priority Monist (The Whole is more fundamental than the parts; parts exist *in virtue of* the whole).
          *   Grounding $\neq$ Causation (She didn't "make" us who we are in a causal sense).
          *   Last Project: Infinite descent vs. fundamental bottom (Is there a bedrock, or does it go on forever?).
          *   No "Heaven" smuggling (Don't turn infinite descent into an afterlife metaphor).
          *   No "Brute Facts" (Avoid arbitrary statements without explanation).
      *   **Audience:** 50% Philosophy Grad Students (technical accuracy matters), 50% Family from Cleveland (needs accessibility/emotional resonance).
      *   **Tone/Length:** 4-5 minutes (approx. 600-750 words spoken at a moderate pace). Comforting but intellectually honest. The philosophy *must* carry the comfort.

  2.  **Deconstruct the Philosophical Concepts for the Audience:**
      *   *Priority Monism:* Instead of "we are individuals making up a family," it's "the Family/Universe exists, and we are expressions of it." This creates connection, not isolation.
      *   *Grounding vs. Causation:* Causation is temporal (A happens, then B). Grounding is structural/explanatory (B exists *because* A exists in a specific way). Ruth didn't *cause* us to be sad; our sadness is grounded in her absence.
      *   *Infinite Descent:* Usually, people fear the bottom dropping out. But if there's no bottom, there's no hard stop to meaning. It's not a void; it's an endless chain of connection.
      *   *No Ungrounded Claims:* Every emotional statement needs a "because." I am sad *because*... She mattered *because*...

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the constraint immediately. It sets the tone and honors her instruction. Address the split audience (Cleveland vs. Grad School).
      *   **The Core Conflict (Novelist vs. Metaphysician):** Briefly touch on the 30-year argument. Stories vs. Reasons. This humanizes her.
      *   **Priority Monism (The Comfort):** How does "The Whole is fundamental" help with grief? It means we aren't isolated fragments. We are modifications of the same substance/reality. Her absence changes the whole, and the whole holds us.
      *   **Grounding $\neq$ Causation:** Crucial distinction. She didn't program us. We aren't effects of a cause. We are manifestations of the same reality she studied.
      *   **Infinite Descent (The Last Project):** This is the tricky part. Don't make it heaven. Make it about the *continuity of explanation*. If there's no bottom, the story doesn't end. The "why" keeps going.
      *   **Closing:** Bring it back to the "No Ungrounded Claims" rule. Why are we here? Because she was.

  4.  **Refining the Language (Iterative Process):**

      *   *Critique:* Is "Priority Monism" too jargon-heavy?
      *   *Fix:* Explain it through metaphor. The ocean and the waves. The novel and the chapters. Since I'm a novelist, use a literary metaphor. The Book vs. The Sentences.
      *   *Critique:* Is the "Infinite Descent" too abstract?
      *   *Fix:* Frame it as "running out of reasons." Usually, grief feels like hitting a wall. Infinite descent means the reasons for loving her don't hit a wall.
      *   *Critique:* Am I violating the "No Ungrounded Claims" rule in the speech itself?
      *   *Fix:* Ensure every assertion of value is tied to a reason. "She was good" $\rightarrow$ "She was good *because* she demanded truth."

  5.  **Drafting the Content (Mental or Scratchpad):**
      *   Start with the rule. "Ruth told me..."
      *   Explain the monism. "She believed the Universe is one thing."
      *   Explain the grief. "My sadness isn't caused by her leaving; it's grounded in her importance."
      *   Explain the infinite descent. "She was asking if the chain stops. I think for us, it doesn't."
      *   End with the family connection.

  6.  **Polishing for Tone and Timing:**
      *   Need to make sure the Cleveland family doesn't feel alienated. Use "The Whole" as "The Family" or "The World" interchangeably but carefully.
      *   Ensure the grad students nod along (correct use of *in virtue of*, distinction between causal and grounding).
      *   Check word count. 650-750 words is usually 4-5 minutes.

  7.  **Final Review against Constraints:**
      *   *No ungrounded claims?* I will explicitly structure sentences to show grounding.
      *   *Priority Monist?* Yes, emphasize the Whole.
      *   *Grounding $\neq$ Causation?* Explicitly state this.
      *   *Infinite Descent?* Include it, but keep it earthly.
      *   *No Heaven?* Keep it about memory and structure, not afterlife.
      *   *Comfort?* The comfort comes from connection (Monism) and endless meaning (Descent).

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't say "She made us." Say "We are what we are in virtue of her."
      *   *Correction:* Don't say "She is in a better place." Say "The reasons for her existence continue."
      *   *Correction:* Ensure the "Novelist" voice comes through—narrative flow, but disciplined by her rules.

  **(Self-Correction Note):** The prompt says "nothing she'd have called a brute fact." A brute fact is something true without explanation. So, I cannot just say "We love her." I must say "We love her *because*..." Every emotional claim needs a metaphysical anchor.

