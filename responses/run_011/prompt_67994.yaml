  4.  **Final Polish:** Check for clarity, flow, and density. Ensure the distinction between "worldview" (top) and "cause" (bottom) remains sharp throughout. (The prompt describes Open Philanthropy's model very closely, so I will treat it as the archetype without necessarily naming them to keep the focus on the *philosophy* as requested).

