answer: |-
  ### I. Theory of Value and Decision Under Moral Uncertainty

  The two-level structure presupposes a **pluralistic theory of value** coupled with a **Moral Parliament model of decision-making under moral uncertainty**, modified by **ambiguity aversion**.

  **The Coherence of Maximizing Below and Hedging Above**
  For the structure to be coherent rather than contradictory, the grantmaker must treat the "worldviews" not merely as distinct cause areas within a single axiology, but as **competing axiologies** (or distinct moral frameworks) that are not fully reducible to a common currency *ex ante*.

  1.  **Concavity over Moral Value:** The concession that there is "no philanthropic analogue of bankruptcy" implies that financial risk aversion is not the driver. Therefore, the hedging implies a **concave utility function over moral goodness itself**. The institution values avoiding the catastrophic error of backing a false moral theory more than it values the potential upside of fully backing the true one. This is distinct from standard risk aversion (variance in outcomes); it is aversion to *moral regret*.
  2.  **Intertheoretic Uncertainty:** The coherence requires that while *intra*-worldview comparisons (e.g., bednets vs. vaccines) are commensurable and measurable, *inter*-worldview comparisons (e.g., saving a life today vs. preventing extinction in 2100) suffer from **radical uncertainty regarding exchange rates**. If the exchange rates were known, the top-level rule would collapse into expected value maximization. If they were strictly incommensurable, no fixed shares could be assigned. The position is therefore that exchange rates exist but are epistemically inaccessible.
  3.  **The Weights:** If the fixed shares do not represent raw expected value (which would concentrate capital), they represent **credences adjusted for the stakes of being wrong**. In a Moral Parliament model, each worldview is a "party" granted seats proportional to the probability it is true. However, because the "legislation" (grantmaking) within each party is utilitarian/maximizing, the weights function as **veto-proof budgetary entitlements**. They represent a commitment to *procedural fairness* among moral theories rather than *substantive optimization* across them. The weights are a proxy for "reasonable credence" where the threshold for reasonableness is lower than the threshold for conviction.

  ### II. Motivations: Necessary vs. Compatible

  The practice can be motivated by several distinct philosophical stances. We can sort them by whether the specific mechanism (fixed shares + internal maximization) *requires* them or merely *accommodates* them.

  **Strictly Needed**
  1.  **Ambiguity Aversion (Knightian Uncertainty):**
      *   *Why Needed:* Standard risk aversion cannot explain hedging without bankruptcy risk unless the utility function is concave over moral value. Ambiguity aversion specifically justifies hedging when probabilities (or exchange rates) are unknown.
      *   *Observable Feature:* Shares remain stable even when new evidence dramatically increases the *expected* value of one worldview. If EV doubled for AI safety but the share remained fixed, this signals ambiguity aversion.
  2.  **Moral Humility as an Epistemic Virtue:**
      *   *Why Needed:* To justify not concentrating on the "current best" worldview. One must believe current moral knowledge is too provisional to warrant concentration.
      *   *Observable Feature:* Public communications emphasize the *fallibility* of the funder's judgment rather than the *difficulty* of the problems.

  **Merely Comfortable With**
  1.  **Respect for Reasonable Disagreement:**
      *   *Why Compatible:* Diversification respects other moral agents.
      *   *Distinguishing Feature:* If this were the driver, shares would correlate with the *distribution of opinion* among peer institutions. If peers shift 80% to Global Health, this funder would too. (In practice, they often hold fixed shares despite peer movement, suggesting this is not the driver).
  2.  **Integrity Constraint (Anti-Fanaticism):**
      *   *Why Compatible:* Prevents the institution from becoming a vehicle for a single contested moral vision.
      *   *Distinguishing Feature:* Rhetoric focusing on "not betting the farm" or avoiding "ideological capture." This is hard to distinguish from humility observationally, but would manifest in board composition (ensuring diverse moral views are represented structurally).
  3.  **Political Motive (Donor Coalition):**
      *   *Why Compatible:* Keeps donors with different moral priorities engaged.
      *   *Distinguishing Feature:* Shares shift coincident with major donor inflows/outflows. If a major donor interested in Animal Welfare leaves, and that bucket shrinks, the motive is political. If it stays fixed, the motive is philosophical.

  ### III. The "Other People" Inconsistency

  There is an apparent tension between the bottom-level use of **Neglectedness** (others are absent, so we should fund) and the top-level implication of **Validation** (other reasonable funders exist, so this worldview is worth funding).

  **The Charitable Joint Account**
  The inconsistency dissolves if we distinguish between **marginal productivity** (an economic fact) and **epistemic corroboration** (an evidentiary fact).
  *   **Bottom Level (Neglectedness):** Here, the behavior of others is treated as *labor supply*. If others are working on a cause, the marginal impact of an additional dollar diminishes due to crowding. The normative force is **instrumental**: we fund because we are more effective there.
  *   **Top Level (Worldview):** Here, the behavior of others is treated as *testimony*. If other reasonable, well-resourced agents endorse a worldview, it serves as Bayesian evidence that the worldview is plausible. The normative force is **epistemic**: we fund because the probability of this worldview being *true* is higher.

  **The Cost**
  This account requires a sharp, perhaps unsustainable, separation between *doing* and *knowing*. It assumes that the presence of other funders reduces the *value* of work (crowding) while simultaneously increasing the *truth-value* of the mission (validation). It risks circularity: if the "other reasonable funders" are simply tracking the same signals as the grantmaker, the epistemic validation is illusory. Furthermore, it implies that the ideal state is one where a worldview is validated by many (high credence) but funded by few (high neglectedness)—a unstable equilibrium.

  ### IV. Underdetermination and Quiet Settlements

  **Philosophically Underdetermined Points**
  1.  **The Specific Weights:** A 20% allocation vs. a 25% allocation is indistinguishable in terms of underlying theory. Both are compatible with a wide range of credence distributions. The specific numbers reveal nothing about the precise probability the funder assigns to the truth of each worldview.
  2.  **Discount Rates:** The practice does not reveal the intergenerational discount rate. A high discount rate on future lives looks identical to a low credence in "future generations matter" worldview.

  **Quiet Settlements (Structure Settling Open Questions)**
  1.  **Discreteness of Worldviews:** The bucket structure settles the metaphysical question that worldviews are **separable and mutually exclusive**. It rules out the possibility that "Global Health" and "Existential Risk" are deeply entangled (e.g., that health security *is* existential security). The bureaucracy enforces a siloed ontology.
  2.  **Additivity of Impact:** The structure assumes impact is additive across buckets. It settles against **lexical thresholds** (e.g., "Existential Risk must be solved before anything else matters"). If there were a lexical priority, the share would be 100% until the threshold was met.
  3.  **Static Moral Truth:** Fixed shares imply that moral truth is either static or that moral discovery is very slow. It settles against the view that moral argument should lead to rapid reallocation. The structure privileges **stability** over **responsiveness to moral insight**.

  ### V. Three Replacements

  **1. Maximizing Expected Choice-Worthiness (MECW) with Normalized Intertheoretic Comparisons**
  *   **The Change:** Abolish the buckets. All causes compete in a single pool based on a unified metric (e.g., "moral points" normalized across theories).
  *   **What Breaks:**
      *   *Committee Structure:* The distinct program teams (Global Health, AI, etc.) lose budgetary autonomy. They become proposal evaluators for a central pot.
      *   *Published Numbers:* No more "X% to Animals." Reports show a single aggregate impact metric.
      *   *Incentives:* Program officers compete against each other for funds, rather than managing a fixed endowment.
  *   **What Survives:** The ITN framework (Importance, Tractability, Neglectedness) remains the tool for evaluating individual grants, provided "Importance" can be normalized.

  **2. Bargaining Compromise (Moral Parliament with Veto)**
  *   **The Change:** Worldviews are treated as agents in a negotiation. Allocations are determined by what each worldview would accept to avoid walking away, not by fixed credences.
  *   **What Breaks:**
      *   *Fixed Shares:* Allocations become dynamic and potentially volatile based on negotiation leverage.
      *   *Internal Incentives:* Program officers become advocates/lobbyists for their worldview rather than neutral maximizers.
      *   *Transparency:* Bargaining positions are rarely published; the rationale for allocation becomes opaque ("a deal was struck").
  *   **What Survives:** The distinct worldviews remain the primary organizational units. The "no bankruptcy" constraint becomes a "no walk-away" constraint.

  **3. Max-Min Rule (Protecting Against the Worst-Case Worldview)**
  *   **The Change:** Allocate resources to minimize the damage if the *least likely but most catastrophic* worldview turns out to be the true one (e.g., if X-Risk is real and we ignored it, value is zero).
  *   **What Breaks:**
      *   *Diversification:* Collapses almost entirely. If "Civilization Collapse" is the worst-case state, >90% of funds flow there. Global Health and Animal Welfare budgets evaporate unless their neglect *also* leads to the worst case.
      *   *Committee Structure:* The X-Risk committee absorbs the others.
      *   *Published Numbers:* Shift from "balanced portfolio" to "insurance policy."
  *   **What Survives:** The use of expected value *within* the chosen priority (preventing the catastrophe). The epistemic humility remains, but manifests as paranoia rather than diversification.
