              *   *Additivity:* It assumes impact in Global Health doesn't negate impact in AI Safety. (Could be non-additive).
              *   *Revision:* Fixed shares imply moral truths are static or discovery is slow. It settles against rapid updating on moral arguments.

      *   **Section 5: Three Replacements.**
