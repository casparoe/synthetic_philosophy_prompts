          3.  Inconsistency on "Other People": Neglectedness (bottom) vs. Worldview Diversification (top). Is this contradictory? Charitable joint account + cost.
          4.  Underdetermination & Quiet Settlements: Where do incompatible theories yield same results? Where does the structure settle open questions (discreteness, additivity, revision)?
          5.  Three Replacements:
              *   Max Expected Choice-Worthiness (MECW) with normalization.
              *   Bargaining Compromise.
              *   Max-Min (Worst-Case).
