answer: |-
  There is no single canonical term for this specific iterative maneuver in the methodological literature, although it operates as a dynamic form of ad hoc rescue within comparative historical analysis; I propose labeling it **Contrast-Class Shrinking**.

  **Definition and Exclusions**
  Contrast-Class Shrinking is the practice of progressively narrowing the reference class or the specific contrast case (the foil) in response to counter-examples, without independent theoretical justification, thereby insulating a causal claim from falsification. It rules out legitimate **concept specification**, where a unit of analysis is refined ex ante based on mechanistic theory (e.g., distinguishing "steam engines" from "heat engines" because the mechanism differs), rather than ex post to preserve a correlation between a favored factor and an outcome.

  **Analysis of Suspected Concepts**
  You are correct that this is a composite, but the components function differently here:

  1.  **Selection on the Dependent Variable (King, Keohane, Verba):** This is the closest methodological cousin. Standard selection bias involves choosing cases *initially* based on the outcome (e.g., studying only revolutions). Contrast-Class Shrinking is more insidious because it occurs *during* the argument; the case selection is dynamic rather than static. It differs because it manipulates the *definition* of the cases rather than just the *sample*.
  2.  **Hindsight Bias:** This lends the story tidiness, making the outcome seem inevitable. However, hindsight bias is cognitive (about probability estimation), whereas Contrast-Class Shrinking is argumentative (about case constitution). Hindsight makes the narrator confident; Shrinking makes the argument unfalsifiable.
  3.  **Mill's Method of Difference:** Mill requires cases to agree in all circumstances but one. Your pattern exploits the impossibility of perfect agreement. Mill assumes fixed cases; Shrinking manipulates the cases to satisfy Mill's condition artificially. It differs because it violates Mill's requirement that the circumstances be identified independently of the outcome.
  4.  **Contrastive Explanation (Van Fraassen, Lipton):** This is the closest *philosophical* home. These theorists argue explanation is always "Why P rather than Q?" The entitlement to fix the foil (Q) is crucial. Contrast-Class Shrinking abuses this entitlement by shifting the foil mid-stream to ensure the explanans distinguishes P from Q. It differs from standard contrastive analysis because the foil is unstable, violating the pragmatic constraints Van Fraassen places on relevance.

  **The Boundary Criterion**
  The line between illicit shrinking and legitimate refinement is drawn by **Theoretical Independence**. Narrowing is legitimate if the criterion for narrowing is derived from a theory of the *mechanism* independent of the correlation being tested. It is illicit if the criterion is derived solely from the need to restore the correlation between the explanans and the explanandum.

  *   **Legitimate:** "We must compare only regions with navigable waterways because the theory states coal is only causal when transport costs are below X." (Mechanism-driven).
  *   **Illicit:** "We must compare only regions with navigable waterways because otherwise England and China look too similar regarding coal." (Outcome-driven).

  **Hard Cases on the Line**
  1.  **Interaction Effects (INUS Conditions):** Suppose industrialisation requires Coal *and* Institutions. If you narrow the comparison to "places with Coal" to show the effect of "Institutions," is this shrinking or controlling? It is legitimate if theory posits Coal as a necessary background condition (an INUS condition); it is illicit if you narrow to "places with Coal" simply because that is where your Institutional variable correlates with industrialisation, ignoring places with Coal that failed for other reasons.
  2.  **Path Dependence:** In explaining the QWERTY keyboard, one narrows the comparison to "typewriters adopted after 1870." A critic says "why not all input devices?" If the theory is that specific historical lock-in matters, the narrowing is valid. If the narrowing is used to exclude competing standards that failed for efficiency reasons (not lock-in), it is Contrast-Class Shrinking. The hard case is determining whether the historical branch point is theoretically substantive or merely a convenient place to hide counter-examples.
