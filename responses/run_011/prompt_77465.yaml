answer: |-
  Here is a decision procedure designed for your context. It is not a legal test; it is an ethical triage tool. It treats a promise not as a contract, but as a **transfer of agency**. When you promise, you give the other person the right to hold you accountable. The core question is: *Who holds that right now, and can they exercise it?*

  ### The Hospice Promise Triage Tool (HPTT)

  **Time to run:** 10–15 minutes.
  **User:** Nurse, SW, Chaplain.
  **Sign-off:** Clinical Ethicist (you) on any "Red" or "Contested" outcomes.

  #### Part 1: Classification (What was said?)
  *Sort the utterance into one of four tiers. If it doesn't fit Tier 1, it is not a binding promise.*

  1.  **Binding Commitment:** Uses word "promise," "swear," or "guarantee," OR creates a specific expectation of action that the speaker knows the listener is relying on for peace of mind.
      *   *Example:* "I promise I will not let you die alone."
  2.  **Relational Assurance:** Strong statement of intent, contingent on circumstances.
      *   *Example:* "I will do everything I can to make sure you stay home."
  3.  **Statement of Intent:** Plan for the future, no normative lock.
      *   *Example:* "I'm planning to come back tomorrow."
  4.  **Bedside Politeness:** Soothing formula, no factual claim.
      *   *Example:* "It's going to be okay," "We'll take care of everything."

  **STOP:** If Tier 2, 3, or 4 → **No Promise Obligation.** (Proceed to general duty of care).
  **CONTINUE:** If Tier 1 → Go to Part 2.

  #### Part 2: Uptake (Did it land?)
  *A promise requires a receiver capable of holding the claim.*

  1.  **Capacity at Moment:** Did the patient have decision-making capacity *at the exact moment* the promise was made?
      *   *Yes:* Go to Q2.
      *   *No (Sedated/Delirious):* Go to Q3.
      *   *No (Advanced Dementia/No Retention):* **STOP.** No Promise Obligation. (See Case 3 logic).
  2.  **Understanding:** Did the patient acknowledge the promise? (Nod, verbal "okay," squeezing hand).
      *   *Yes:* **Valid Uptake.** Go to Part 3.
      *   *No:* **STOP.** No Promise Obligation.
  3.  **Surrogate Uptake:** If patient lacked capacity, was a valid Surrogate Decision Maker (SDM) present and did *they* accept the promise on the patient's behalf?
      *   *Yes:* **Valid Uptake.** Go to Part 3.
      *   *No:* **STOP.** No Promise Obligation.

  #### Part 3: Feasibility & Scope (Can it be done?)
  *Obligation cannot exceed possibility or professional ethics.*

  1.  **Professional Boundaries:** Does keeping the promise violate policy, law, or clinical safety? (e.g., promising specific meds, hiding info from family).
      *   *Yes:* **VOID.** Obligation converts to "Explain why I cannot."
      *   *No:* Go to Q2.
  2.  **Physical Possibility:** Is the act physically possible for *this* staff member? (e.g., Nurse moved 900 miles away).
      *   *No:* **MODIFIED.** Obligation converts to "Facilitate alternative."
      *   *Yes:* Go to Part 4.

  #### Part 4: Release & Succession (Who holds the key?)
  *The promisee is gone or cannot speak. Who can release the promisor?*

  1.  **Is the Patient Alive and Capacious?**
      *   *Yes:* Only they can release.
      *   *No:* Go to Q2.
  2.  **Does the Promise Concern the Patient's Body/Remains/Immediate Experience?**
      *   *Yes (e.g., "Don't let me suffer," "Scatter my ashes"):* **HARDENED.** The obligation survives death. The family *cannot* override the patient's specific wish, but they can release the *staff* from the *act* if they assume the duty themselves.
      *   *No (e.g., "Tell my son I love him," "Take care of my wife"):* **TRANSFERRED.** The right to enforce/release passes to the SDM/Next of Kin.
  3.  **Joint Promisors:** (e.g., Two siblings promise a parent).
      *   Can one release the other? **NO.** They promised the patient, not each other. They need release from the patient (or SDM).

  #### Part 5: Resolution (What is owed?)
  *If the promise is broken or voided, what is the residue?*

  *   **If Void (Feasibility/Policy):** Duty to explain the constraint compassionately.
  *   **If Broken (No Release):** Duty to acknowledge the breach to the SDM/Family, apologize, and offer restitution (e.g., chaplaincy visit, social work support).
  *   **If Hardened (Patient Wishes):** Duty to advocate for the wish, even if you cannot perform it yourself.

  ---

  ### Bedside Script: Alternatives to "Promise"
  *Staff must stop using the P-word. It creates a binary (kept/broken) where healthcare is continuous (tried/failed).*

  **Instead of:** "I promise I'll be back tomorrow."
  **Say:** "It is my intention to be back tomorrow. Unless there is an emergency that keeps me away, I will see you then."

  **Instead of:** "I promise he won't be in pain."
  **Say:** "Managing his pain is our top priority. We will adjust the medication until he is comfortable."

  **Instead of:** "I promise I won't let you die alone."
  **Say:** "I am not going to leave you alone if I can help it. If I have to step out, I will make sure someone else is here."

  **The Contingency Clause:** "I want to do this for you. I can't control everything that happens on my shift, but I will make this my goal."

  ---

  ### Case Applications

  #### Case 1: The Ashes and the Moved Nurse
  *   **Classification:** Binding Commitment (Specific request, solemn tone).
  *   **Uptake:** Valid (Patient had capacity, accepted).
  *   **Feasibility:** **Impossible** for *this* nurse (Moved 900 miles).
  *   **Release/Succession:** **Hardened.** This concerns the patient's remains. The family cannot override the wish, but they can release the nurse from the *act*.
  *   **Verdict:** The supervisor is **wrong** to say she is "off the hook" entirely, but **right** that she doesn't have to scatter the ashes.
  *   **Obligation:** The promise hardened into a duty to *ensure the wish is known*. She owes the family notification: "Your father made me promise this. I cannot do it, but you need to know this was his specific wish." If she stays silent, she breaks the promise. If she informs them, she has fulfilled the moral residue. The duty to scatter shifts to the estate/family.

  #### Case 2: The Mother's Housing
  *   **Classification:** Binding Commitment (Joint, explicit).
  *   **Uptake:** Valid (Father had capacity).
  *   **Feasibility:** **Compromised.** Mother's safety (falls) and autonomy now conflict with the promise.
  *   **Release/Succession:** **Transferred.** The promise was about the *Mother's* welfare. The Father is dead. The Mother is the primary stakeholder.
  *   **Joint Promisors:** The son cannot hold the sister hostage. They promised the father, but the content of the promise concerns a living, capacious third party (the mother).
  *   **Verdict:** The promise is **voided by changed circumstances and the beneficiary's autonomy.** The mother's current wish to move trumps the father's past wish for her to stay. The son has no standing to release or bind the sister because the promise's condition (Mother's safety/will) has changed.
  *   **Action:** Ethics sign-off required to tell the son: "The promise was to ensure her well-being. A facility now ensures that better than home. The promise is fulfilled by moving her, not broken."

  #### Case 3: The Chaplain and the Dementia Patient
  *   **Classification:** Binding Commitment (Word "promise" used).
  *   **Uptake:** **INVALID.**
  *   **Reasoning:** Uptake requires the capacity to *hold* the claim. A patient who asks the same question 11 times and retains none of it cannot register a promise. They cannot feel reassured, and they cannot feel betrayed.
  *   **Verdict:** You are **right**. No promise obligation exists.
  *   **The Wrong:** However, your friend is half-right about the *nature* of the wrong. It isn't a broken promise; it is **deception**. The chaplain created a false reality for a vulnerable person. The wrong lives in the *truth-telling violation*, not the *non-performance*.
  *   **Action:** The chaplain owes an apology to the *team* for compromising trust, and needs coaching on dementia communication. He does not owe the patient a visit, because the patient cannot experience the debt.

  ---

  ### Limitations & Blind Spots
  *Where this procedure will fail or give a confident wrong answer.*

  1.  **The "Fluctuating Capacity" Trap:**
      *   *Risk:* A patient is lucid for 10 minutes, extracts a promise, then slips back into delirium. The procedure says "Valid Uptake."
      *   *Reality:* Ethically shaky. If the promise is burdensome, assume the uptake was compromised by the desperation of the lucid interval. **Escalate to Ethicist.**

  2.  **The "Family Veto" on Hardened Wishes:**
      *   *Risk:* Procedure says Family cannot override Patient's wish on ashes (Case 1).
      *   *Reality:* If the family refuses to scatter the ashes at the lake, the nurse cannot force them. The procedure identifies the *moral right*, but not the *enforcement mechanism*. This becomes a grief conflict, not a promise conflict. **Escalate to Ethicist.**

  3.  **The "Small Lie" for Peace:**
      *   *Risk:* Staff says "I promise" to stop a patient from panicking, knowing they can't keep it.
      *   *Reality:* The procedure classifies this as a Binding Commitment. It will flag it as a breach. It cannot distinguish between *malicious deception* and *benevolent soothing*. This requires a values judgment on whether "peace in the moment" outweighs "truthfulness." **Escalate to Ethicist.**

  4.  **Implicit Promises:**
      *   *Risk:* The procedure relies on explicit words or clear reliance.
      *   *Reality:* Sometimes a look, a hand hold, and "I'm here" functions as a promise to "I won't leave." The tool may miss this. If a patient dies alone after being told "I'm here," the family will claim a promise was broken regardless of the tier. **Trust the team's gut feeling on "Relational Assurance."**

  ### Final Note on Your Dispute
  Your friend is arguing from **Contract Law** (offer, acceptance, consideration, release). You are arguing from **Moral Philosophy** (normative force, relational obligation).
  In hospice, **Contract Law fails** because the consideration is often impossible (the patient gives nothing but trust; the staff gives something they can't fully control).
  However, you are also wrong if you think the obligation "hardens" into an unbreakable rule. It hardens into a **duty of advocacy**.
  *   **Friend's Error:** Thinks death deletes the obligation. (It doesn't; it transfers the stakeholder).
  *   **Your Error:** Thinks death makes the obligation absolute. (It doesn't; it makes the *intent* absolute, but the *action* contingent on feasibility).

  Use the tool to find the middle: The promise survives, but its form changes from *performance* to *stewardship*.
