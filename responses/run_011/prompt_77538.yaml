      *   *Section 3 (Film vs. Philosophy):* Where does the film cheat? (Memory is more than notes; emotion persists). Where does philosophy fail? (Assumes continuous agency).
      *   *Conclusion:* What does *Memento* add? It spatializes time. It turns epistemology into architecture.

  7.  **Refining the Tone:**

