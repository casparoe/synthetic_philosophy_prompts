answer: |-
  This is a fantastic angle. The standard reading treats Leonard as a synchronic akratic agent (believing $p$ while believing he shouldn't believe $p$), but the film's structure makes him a *diachronic* puzzle. He isn't fighting his own judgment; he is fighting his own *continuity*.

  Here is a framework for your talk that pushes back on the standard akrasia reading, integrates the Higher-Order Evidence (HOE) debate, and isolates the unique contribution *Memento* makes to epistemology.

  ### The Core Thesis
  Leonard is not a case of **epistemic akrasia**; he is a case of **diachronic evidence engineering**. The standard HOE debate assumes a continuous subject who retains access to the defeater. *Memento* removes that access. Therefore, the irrationality does not reside in the belief-state of the acting time-slice, but in the *architectural design* of the system connecting the time-slices.

  ---

  ### Part 1: The Higher-Order Evidence Gap (Time-Slices vs. Subjects)

  **The Standard View:** Teddy provides a paradigm defeater. He tells Leonard: "You don't remember. You've already killed him. Sammy Jankis was you." Leonard accepts this (in the moment). Later, Leonard kills Teddy. Therefore, Leonard believes $p$ (Teddy is John G) despite possessing HOE that $\neg p$.

  **The Pushback:** This misidentifies the locus of the belief.
  In standard HOE cases (the drugged mathematician, the tired doctor), the subject retains the HOE *while* forming the belief. They think, "I am tired, so my calculation is likely wrong, but I still believe the sum is 45." That is akrasia.

  In *Memento*, the HOE and the First-Order Belief (FOB) are never held by the same epistemic subject.
  1.  **Time-Slice A (The Truth-Knower):** Hears Teddy's confession. Acquires HOE ("My system is compromised").
  2.  **Time-Slice B (The Actor):** Wakes up 5 minutes later. The HOE is biologically erased. Only the physical artifacts (tattoos, notes) remain.

  **The Verdict:** Time-Slice B is **locally rational**. Given his evidence (the note says "Teddy is John G"), he is justified in shooting Teddy. He is not akratic because he does not *believe* his belief is unjustified; he has no access to that judgment.
  The irrationality is **systemic**. Time-Slice A *knows* the system is corrupt but chooses to re-program it rather than dismantle it.

  **Where the Philosophy Loses Grip:**
  The literature on level-splitting (e.g., Christensen, Horowitz) assumes the "higher-order" belief is accessible to the "first-order" believer. *Memento* shows that HOE is fragile—it depends on memory. If HOE is stored externally (notes), it can be edited. This suggests a gap in the literature: **The Vulnerability of Externalized HOE.** We assume that if I write down "I am unreliable," that note will defeat my future beliefs. Leonard proves that a past self can write "I am reliable" to override a present self's doubt.

  **Scene to Use:** **The Restroom Revelation (Black & White sequence).**
  Leonard admits to himself (and the audience) that he chooses to ignore the truth. "I have to believe in a world outside my own mind." This is the moment the HOE is acknowledged and then immediately quarantined.

  ---

  ### Part 2: The Ending as Evidence Management (Not Akrasia)

  **The Question:** When Leonard burns the photo of the real killer and writes "Don't believe his lies" on Teddy's picture, is this epistemically permissible?

  **The Analysis:**
  This is not akrasia. Akrasia is a failure of will against judgment. This is **pre-commitment to ignorance**. It is closer to Ulysses tying himself to the mast, but with a crucial difference: Ulysses did it to *preserve* rationality against temptation; Leonard does it to *suspend* rationality against despair.

  Is it permissible?
  *   **Strict Veritism:** No. He is actively creating false evidence. He is violating the norm of truth.
  *   **Pragmatic Encroachment:** Maybe. If the truth entails nihilism (no purpose, no "John G"), and the lie entails functional agency, is he permitted to choose the lie?
  *   **The Cost:** If we say this is permissible, we allow **epistemic paternalism over oneself**. We authorize a past self to gaslight a future self for the future self's "own good." This dissolves the distinction between *discovering* the world and *fictionalizing* it.

  **The Pushback:**
  Call this what it is: **Epistemic Suicide.** He isn't managing evidence; he is murdering the possibility of knowledge for his future slices to sustain a narrative. It's not "rational belief management"; it's "narrative survival."

  **Scene to Use:** **The Polaroid Manipulation (End of Film).**
  Watch him burn the photo of Jimmy Grants. Watch him write the license plate. This is the physical act of overwriting the HOE. It is the visual representation of destroying the defeater.

  ---

  ### Part 3: Where the Film Oversimplifies vs. Where Philosophy Fails

  **1. Where the Film Oversimplifies:**
  *   **The Clean Slate:** The film suggests Leonard's memory resets perfectly. In reality, anterograde amnesia rarely wipes emotional conditioning or procedural memory. Leonard *should* feel fear around Teddy even if he doesn't know why. The film treats the mind as a hard drive that gets wiped, ignoring implicit memory.
  *   **The Reliability of Notes:** The film assumes Leonard's only vulnerability is his memory. It ignores that he is also vulnerable to *interpretation*. Even if he reads the note correctly, he could interpret the context differently. The film treats his "system" as more robust than it would be.

  **2. Where Philosophy Fails:**
  *   **The Continuous Agent:** Epistemology assumes an agent that persists through time sufficiently to bear responsibility for belief revision. *Memento* suggests that without memory, there is no "agent," only a chain of proxies. Philosophy asks, "Is Leonard rational?" *Memento* asks, "Is there a Leonard?"
  *   **The Normativity of Truth:** Philosophy struggles to account for why Leonard's choice is *tragic* rather than just *wrong*. If the truth offers no practical utility, why is the lie a tragedy? Philosophy often separates epistemic and practical rationality too cleanly. Leonard shows they are entangled in the constitution of the self.

  **Scene to Use:** **The Opening Scene (Shooting Teddy).**
  This scene is the result of the evidence management. It shows Time-Slice B acting "rationally" on corrupted data. It forces the audience to feel the horror of local rationality producing global monstrosity.

  ---

  ### Conclusion: What *Memento* Contributes to the Debate

  Journal articles trade in pills, fatigue, and disagreement because those are temporary defeaters. *Memento* contributes **the spatialization of time.**

  1.  **Epistemology as Architecture:** Leonard turns his epistemology into a physical system (tattoos, files, rooms). This shows that belief isn't just a mental state; it's an environment we build. When the environment is corrupted, the mind cannot save itself.
  2.  **The Diachronic Tragedy:** The debate usually asks, "What should I believe now?" *Memento* asks, "What evidence should I leave for the person I become?" It shifts the normative focus from **belief formation** to **legacy construction**.
  3.  **The Limit of HOE:** It demonstrates that Higher-Order Evidence is useless if it cannot be internalized. If HOE relies on memory, and memory fails, HOE is not a defeater—it's just noise.

  **Final Takeaway for the Talk:**
  Leonard isn't the poster boy for akrasia. He is the poster boy for **epistemic fragmentation**. He shows us that rationality requires a continuous self to hold the tension between evidence and judgment. When you break the self, you don't get akrasia; you get a machine that produces truth-claims without a truth-seeker. The tragedy isn't that he believes against his better judgment; it's that he engineered a world where his better judgment can no longer exist.

  **Scene to Close:** **The Final Shot (Leonard walking away).**
  He fades into the background. He is no longer a man seeking truth; he is a function of the system he built. This is the cost of his "evidence management." He saved his purpose, but he lost his status as a knower.

  ---

  ### Summary of the 4 Key Scenes for Your Slides:

  1.  **The Restroom Revelation:** The acquisition of Higher-Order Evidence (The Defeater).
  2.  **The Polaroid Burning:** The active destruction of the Defeater (Evidence Management).
  3.  **The Tattooing:** The encoding of the Lie into the "System" (Externalized Memory).
  4.  **The Opening Shooting:** The output of Local Rationality on Global Corruption (The Consequence).

  This structure allows you to acknowledge the standard view, dismantle it using the time-slice problem, address the ethics of the ending, and land on a unique philosophical contribution regarding the architecture of belief.
