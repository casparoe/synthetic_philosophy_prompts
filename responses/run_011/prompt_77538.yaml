      *   **Key Question 2 (The Ending & Evidence Management):** Is Leonard's decision to ignore the truth and set up a lie for his future self akrasia, or is it *evidence management* (pre-commitment)? Is this epistemically permissible?
      *   **Requirements:**
          *   Be honest about where the film oversimplifies philosophy and where philosophy fails to grip the film.
          *   Identify 3-4 key scenes.
          *   Conclude with what *Memento* uniquely contributes to the debate (beyond standard thought experiments).
          *   Tone: Academic but engaging (for a talk), nuanced, pushing back on standard interpretations.

  2.  **Analyze the Philosophical Landscape:**

      *   **Epistemic Akrasia:** Typically defined as believing $p$ while believing that one's belief that $p$ is irrational/unjustified. (e.g., "It's raining, but I shouldn't believe it's raining.") Standard view: Akrasia is irrational (Horowitz, Smithies). Level-Splitting view: It can be rational in specific cases (Christensen).
      *   **Higher-Order Evidence (HOE):** Evidence about one's own cognitive reliability. Usually acts as a defeater.
      *   **Diachronic vs. Synchronic:** Standard epistemology often assumes a continuous subject. *Memento* breaks this. Leonard is a series of discontinuous time-slices (S-sets).
      *   **Self-Trust & Testimony:** Leonard relies on his own notes (testimony from past self). But the past self is unreliable.
      *   **Pragmatic Encroachment/Pragmatism:** Leonard's motivation is existential (purpose), not just truth-tracking.

  3.  **Address Key Question 1: The Time-Slice Problem:**

      *   *Standard View:* Leonard is akratic because he ignores Teddy's truth.
      *   *Pushback:* The Leonard who hears Teddy (End of film/Start of memory) *knows* the truth. The Leonard who kills Teddy (Start of film/End of memory) *does not*.
      *   *The Gap:* They are psychologically discontinuous. The HOE is lost. The "system" (tattoos/notes) is corrupted by the *earlier* Leonard (who knew the truth) to manipulate the *later* Leonard (who doesn't).
      *   *Verdict:* It's not synchronic akrasia. It's *diachronic manipulation*. The irrationality lies in the *system design*, not the individual time-slice's belief formation. The time-slice acting on the notes is actually being *locally rational* (trusting his system) but *globally manipulated*.
      *   *Philosophy Gap:* Standard HOE assumes the subject retains the HOE. *Memento* shows HOE can be physically erased. This challenges the "accessibility" requirement of defeaters.

  4.  **Address Key Question 2: Evidence Management & The Ending:**

      *   *Action:* Leonard burns the photo, writes "Don't believe his lies," sends Teddy to his death.
      *   *Interpretation:* This isn't akrasia (believing against judgment). It's *pre-commitment to ignorance*. He chooses to make his future self irrational to sustain a purpose.
      *   *Epistemic Permissibility:* Generally, no. We have a duty to truth. But if truth leads to nihilism (no John G), is pragmatic justification allowed?
      *   *Cost:* If we allow this, we allow self-deception as a policy. It undermines the normative force of epistemology.
      *   *Alternative:* It's not epistemic; it's existential. He sacrifices epistemic rationality for practical rationality.

  5.  **Select Key Scenes:**

      1.  *Teddy's Revelation (The Restroom/Car scene):* The injection of HOE. Leonard admits the truth.
      2.  *The Tattooing of "John G":* The physical encoding of the decision.
      3.  *The Polaroid Manipulation (Burning the photo/Writing the note):* The active corruption of the evidence system.
      4.  *The Opening (Shooting Teddy):* The result of the manipulated evidence. Shows the "rational" time-slice acting on false data.

  6.  **Drafting the Argument (Iterative Process):**

      *   *Intro:* Acknowledge the standard reading (Leonard = Akratic). State the thesis (Leonard = Diachronic Manipulator / Systemic Irrationality).
