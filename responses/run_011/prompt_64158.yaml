answer: |-
  Cut premise (2).

  Here is the position: Well-being is not measured on an interval scale (where the zero is arbitrary); it is measured on a ratio scale (where the zero is fixed by the nature of the quantity). Your advisor's argument relies on the assumption that well-being numbers are like Celsius temperatures, where 0° is just the freezing point of water and you can slide the scale up or down without changing the physical reality. But well-being is more like mass or length. There is a non-arbitrary point at which well-being is *absent*.

  Here is why (2) looked innocent, why it is false, what you owe if you keep (1), and how the "principled zero" handles the objection.

  ### Why (2) Looked Innocent
  Premise (2) borrows credibility from two sources. First, in standard social choice theory (e.g., Arrow, Sen), we often assume "unit comparability" (interval scales) because it is the weakest assumption required to make Utilitarianism work. It's the path of least resistance. Second, it borrows from a skeptical view of well-being where "utility" is just a representation of preference orderings. If utility is just a numerical representation of ordinal preferences, then any positive affine transformation preserves the information, and the zero is indeed arbitrary.

  But Prioritarianism is not a theory about preference orderings; it is a theory about the *value* of well-being. It makes a metaphysical claim that benefits matter more the worse off people are. That claim requires a metric where "twice as well off" or "zero well-being" has a fixed meaning. If you accept Prioritarianism, you are already committed to ratio-scale measurability. Premise (2) begs the question by assuming the scale type that makes Prioritarianism impossible.

  ### The Principled Zero: Neutrality
  You asked if there is a principled zero a prioritarian can point at. Yes. It is the **neutral level**. This is the point at which a life is neither worth living nor not worth living—the boundary between a life that is a benefit to the person living it and one that is a harm.

  Does naming this answer the objection? Yes. If zero is fixed at neutrality, the operation in your advisor's step (3)—"add 400 to everyone's number"—is no longer a "mere re-zeroing." It is a distortion of the facts. If Ann is at 1 (just above neutrality) and you add 400, you are claiming she is now 401 units above neutrality. If the unit is fixed, that is a substantive claim about her life, not a mathematical relabeling. If the operation changes the verdict, it is because the operation has changed the *description of the outcome*, not because the principle is unstable.

  Prioritarianism is invariant under *ratio* transformations (changing the unit, e.g., from "hedons" to "double-hedons"), but it is not invariant under *affine* transformations (shifting the zero). That is a feature, not a bug, provided the zero is real.

  ### Does This Relocate the Problem?
  You worry that fixing the zero just relocates the problem to the shape of the weighting function. It does not. It separates a measurement problem from a normative problem.

  1.  **Measurement:** Where is zero? (Answer: Neutrality). This solves the "arbitrary shift" objection.
  2.  **Normative:** What is the curvature of the priority function? (Answer: Concave, e.g., square root).

  Your advisor's argument conflates these. By fixing the zero, you prevent the "arbitrary shift" critique. You still have to defend *why* the square root function is the right one (the "strong prioritarianism" problem), but that is a separate battle. You do not owe a derivation of the square root from the zero; you only owe a justification that the zero is fixed so that the square root *can* be applied consistently.

  ### What You Owe If You Keep (1)
  Premise (1) is plausible: principles shouldn't track artifacts of measurement. If you keep (1), you must defend the metaphysics of well-being that supports (2)'s negation. Specifically:

  1.  **A Theory of Well-Being:** You need a substantive theory (Hedonism, Objective List, etc.) that can identify neutrality. Hedonism does this easily (the balance point of pleasure and pain). Desire theories struggle (is it the point where desires are satisfied at the rate they are formed?). You need to show that "neutrality" is a fact about persons, not a convention.
  2.  **Interpersonal Comparability:** You need to defend the claim that we can compare Ann's distance from neutrality to Bob's distance from neutrality in a ratio sense. This is the hard part of prioritarianism, but it is independent of the zero-point objection.

  ### A Note on Premise (5)
  For your own confidence: Premise (5) is also false, though cutting it doesn't save you. Utilitarianism is invariant under affine transformations (shifting the zero). If $A > B$, then $\sum (w_i + k) > \sum (w^*_i + k)$ because the $Nk$ term cancels out in fixed-population cases. Your advisor is wrong that Utilitarianism dies by the same sword. Utilitarianism only requires interval measurability; Prioritarianism requires ratio measurability. But pointing this out just saves Utilitarianism. To save *your* view, you must cut (2).

  ### The Commitment
  Your advisor has presented a measurement objection to a normative theory. The solution is to correct the measurement assumptions.

  **Deny (2).** Well-being has a natural zero. The "leveling down" objection fails because equality isn't the value; the "arbitrary zero" objection fails because the zero isn't arbitrary. You are a ratio-scale realist about well-being. Defend neutrality as the anchor, and the math in (3) becomes illegitimate rather than devastating.

  Go tell your advisor that Prioritarianism requires ratio-scale measurability, that neutrality provides the natural zero, and that adding 400 units to a well-being score is not a permissible transformation if the zero is fixed. If they insist the zero is arbitrary, they are denying the coherence of Prioritarianism by fiat, not by argument.
