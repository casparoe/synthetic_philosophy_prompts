answer: |-
  Here is the session plan. It is designed to leverage their gambling intuition while forcing a distinction they rarely make: the difference between the *odds of the setup* and the *price of the bet*.

  ### 1. The Running Case: The "Sealed Shoe"
  **Do not use a coin.** You are right; coins trigger frequency thinking ("over 1,000 flips") rather than single-case propensity.
  **Do not use physics.** Radioactive decay feels like magic to non-physicists.

  **Use this:** A specific, single card from a freshly shuffled 8-deck shoe in a high-limit room.
  *   **The Setup:** The shoe has been shuffled by a certified machine. It is sealed. The top card is about to be dealt.
  *   **The Proposition:** "The top card is an Ace."
  *   **The Objective Chance:** 1/13 (roughly 7.7%). This is fixed by the physical constitution of the shoe (32 Aces in 416 cards).
  *   **Why this works:**
      *   It is **single-case**: They care about *this* hand, not the long run.
      *   It is **objective**: The number of cards is a matter of fact, not opinion.
      *   It allows **inadmissible evidence**: It is easy to imagine "peeking" or having a "tell" that overrides the math.

  ### 2. The Sequence (45 Minutes)

  **0:00–0:10: The Conflict (Motivation without Definition)**
  *   **Action:** Put the scenario on the board. "Machine shuffled, 8 decks, top card. What is the *objective chance* it's an Ace?" (They will say 1/13).
  *   **Pivot:** "Okay, now imagine you walk in. You know nothing else. What is your *credence* (your degree of belief) it's an Ace?" (They will say 1/13).
  *   **The Trap:** Ask, "Why are those numbers the same? Is it because you're rational? Or is it because the world forces you to?"
  *   **Goal:** Make them feel that their belief is *constrained* by something outside their head. If they say "It's just my best guess," push back: "If I tell you the shoe only has 2 Aces in it, your guess changes. Your guess is tracking the *shoe*, not your *mind*."

  **0:10–0:20: The Principle (Definition after Motivation)**
  *   **Action:** Now give them Lewis. "Lewis says: Your credence *should* equal the objective chance, provided you have no 'inadmissible evidence'."
  *   **Notation:** Keep it simple. $C(\text{Ace} | \text{Chance} = 1/13) = 1/13$.
  *   **Dependency:** This only lands because you already established in the first 10 minutes that they *do* match in the standard case. Now you are giving a name to the rule they just intuited.
  *   **Key Phrase:** "Chance is the guide to truth for the ignorant."

  **0:20–0:35: The Loophole (Admissibility & Misconceptions)**
  *   **Action:** Introduce the twist. "You sit down. The dealer sneezes. You catch a glimpse of the corner of the top card. It's an Ace."
  *   **The Conflict:** "Objective chance is still 1/13 (the shoe hasn't changed). Your credence is now 100%. Did you violate the Principal Principle?"
  *   **Resolution:** No. The glimpse is **inadmissible evidence**.
  *   **Dependency:** This is where you kill the misconceptions (see below).
  *   **Goal:** Show that PP isn't a straightjacket; it's a default setting that gets overridden by direct information about the *outcome*.

  **0:35–0:40: The Closing Question (The Test)**
  *   **Action:** Pose the specific scenario below.
  *   **Goal:** Separate those who memorized the rule from those who understand the *direction of fit*.

  **0:40–0:45: Scope Limits (Q&A)**
  *   **Action:** Explicitly park the deep metaphysics.

  ---

  ### 3. Handling the Misconceptions
  *Integrate these during the 0:20–0:35 "Loophole" section. Do not make them separate slides; they arise naturally from the "Glimpse" scenario.*

  **Misconception 1: "Chance is just what a well-informed person's credence is." (Subjectivism)**
  *   **Where:** When they argue the 1/13 is just a "guess."
  *   **What to say:** "If chance were just ideal credence, then if we all died, the chance would vanish. But if we all die, the shoe still has 32 Aces. Chance is a feature of the *shoe*. Credence is a feature of *you*. PP tells you how to map the shoe onto your mind. If you confuse them, you can't spot when the shoe is rigged."
  *   **Table Utility:** "If you think odds are just opinions, you'll argue with the math instead of finding the edge."

  **Misconception 2: "The Principle is a Tautology." (Law of Total Probability)**
  *   **Where:** When they say, "This is just Bayes' Theorem."
  *   **What to say:** "Bayes tells you how to *update* when you get new evidence. It doesn't tell you where to *start*. PP tells you your starting prior. It connects the physical world to your brain. Math alone can't do that; you need a philosophical bridge. Without PP, you have no reason to set your prior at 1/13 other than 'indifference,' which is weak."
  *   **Table Utility:** "Bayes manages your bankroll as info comes in. PP tells you what the 'fair line' is before the first card drops."

  **Misconception 3: "Once I know the chance, nothing else matters." (Fatalism)**
  *   **Where:** When they ask, "If chance is 1/13, why look at the card?"
  *   **What to say:** "Chance screens off *past* evidence (like the shuffle history), but it does not screen off *future* evidence (like the result). If you see the card, you have information about the *outcome*, not just the *setup*. PP explicitly excludes that kind of evidence."
  *   **Table Utility:** "This is the difference between playing the odds and playing the player. The odds are the chance; the tell is the inadmissible evidence. You need to know when the tell overrides the odds."

  ---

  ### 4. Staging the Conflict (Evidence vs. Chance)
  *This is the critical moment in the "Loophole" section.*

  **The Setup:**
  1.  State: "Objective Chance = 1/13."
  2.  State: "Your Evidence = You saw the Ace."
  3.  State: "Your Credence = 1."

  **The Tension:**
  Ask: "Does the chance number lie?"
  *   **Wrong answer:** "Yes, the chance became 1." (Confuses chance with credence).
  *   **Wrong answer:** "No, but you should ignore it." (Makes chance useless).
  *   **Right answer:** "The chance is still 1/13 relative to the *setup*. But your evidence is no longer just about the setup; it's about the *result*."

  **How to Illuminate:**
  Use the term **"The Bookie vs. The Spy."**
  *   The **Objective Chance** is what the Bookie knows (the setup).
  *   The **Inadmissible Evidence** is what the Spy knows (the outcome).
  *   PP says: "Act like the Bookie unless you have Spy intel."
  *   This prevents the collapse into subjectivism. The Bookie's odds remain objectively correct for anyone *without* Spy intel. The world hasn't changed; your access to it has.

  ---

  ### 5. The Closing Question (Last 5 Minutes)
  *Do not ask for a definition. Ask for a judgment on admissibility.*

  **The Question:**
  "Imagine a prop bet on a coin flip. The coin is fair (Chance = 50%). You are offered a bet. Just before you call it, a reliable time-traveler hands you a note from tomorrow that says 'It landed Heads.' Do you bet at 50/50 odds?"

  **The Evaluation:**
  *   **If they say "Yes, 50/50":** They failed. They think Chance overrides all evidence.
  *   **If they say "No, 100% Heads":** They pass, *but*...
  *   **The Follow-up (The Real Test):** "So, was the Objective Chance 50% or 100%?"
      *   If they say **"100%"**: They failed. They collapsed chance into credence.
      *   If they say **"50%, but the note is inadmissible evidence"** (or "evidence about the outcome"): **They got it.** They understand that Chance describes the *process*, while Credence describes the *belief*, and the two come apart when you have foreknowledge.

  ---

  ### 6. Scope Limits (What to Refuse)
  *You will get asked about the metaphysics. Shut it down gracefully.*

  **1. Self-Undermining Chances:**
  *   *The Issue:* Cases where the chance of an event lowers the chance of itself (Lewis's worry).
  *   *The Shutdown:* "That's a problem for the metaphysicians building the engine. We're driving the car. For any bet you'll see in your life, assume chances don't undermine themselves."

  **2. Humean Mosaic / Reductionism:**
  *   *The Issue:* What *makes* the chance true? Is it just frequencies?
  *   *The Shutdown:* "Whether chance is 'real' or just a summary of patterns doesn't change the betting rule. As long as the number is fixed by the setup and not your head, PP applies. We don't need to solve quantum mechanics to use the principle."

  **3. How to Say It:**
  "We are here to use the tool for bankroll management and decision theory, not to build the factory. If we go into the metaphysics of *why* chance exists, we won't have time to talk about how to use it when the dealer peeks. I'm happy to grab a beer after and talk Hume, but for this 45 minutes, we treat Objective Chance as a given input."
