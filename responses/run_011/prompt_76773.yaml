  Okay, I need a specific scenario.
  Scenario: A biased coin (Chance = 0.9 Heads). You are about to flip. You have a friend who claims to have psychically seen the future.
  If they say "Credence should be 0.9," they missed the point about inadmissible evidence.
  If they say "Credence should be 1 or 0," they need to qualify *if* the evidence is admissible.
  *Refined:* "The Chance is 50%. You have a ticket that says 'Heads'. The ticket was printed *after* the flip. What is your credence?"
  *Actually, the best test of PP is the 'Admissibility' clause.*
  Question: "I tell you the objective chance of the next card being an Ace is 1/13. I also hand you a note that says 'This card is an Ace', written by the dealer *before* the shuffle. Do you bet at 1/13 odds?"
  *Answer:* No. The note is inadmissible evidence? Or is it? If written before shuffle, it's prophecy (inadmissible). If written after, it's fact (overrides).
  *Let's go with the "Future Result" test.* It highlights the difference between Chance and Credence most sharply.

  *Okay, let's finalize the plan.*

  **Structure:**
  1.  **Case Study:** The "Sealed Shoe" (Casino Deck).
  2.  **Sequence:** Conflict -> Definition -> Admissibility -> Misconceptions.
