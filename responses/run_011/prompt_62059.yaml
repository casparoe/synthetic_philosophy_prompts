answer: |-
  ### Part I: The Axes of the Debate

  Before constructing the tree, we must define the dimensions along which positions vary. These axes are logically independent: accepting a claim on one does not force a commitment on the others.

  1.  **The Threshold of Complaint:** Whether a burden must reach a certain magnitude of severity before it counts as a valid claim against a principle. (Independent of *how* claims are counted once they pass the threshold.)
  2.  **The Comparability of Kinds:** Whether burdens of different categories (e.g., death vs. inconvenience) can be traded against one another at any exchange rate, or if some categories lexically dominate others. (Independent of thresholds; one could hold that all burdens are comparable but only those above a size count.)
  3.  **The Structure of Counting:** Whether claims are summed linearly, weighted by severity, capped at a certain total, or merely used to break ties between equal individual claims. (Independent of thresholds; one could sum only claims that pass a threshold.)
  4.  **The Timing of Risk:** Whether moral assessment focuses on the actual outcomes that occur (ex-post) or the probabilities imposed on individuals before the fact (ex-ante). (Independent of aggregation; one could aggregate ex-ante risks or ex-post outcomes.)
  5.  **The Unit of Moral Concern:** Whether the basic unit of complaint is the whole person over a lifetime, or temporal stages/burdens within a life. (Independent of aggregation; one could aggregate person-units or burden-units.)
  6.  **The Ground of Separateness:** Whether the prohibition on pooling claims is rooted in the metaphysical distinctness of persons, the procedural requirements of justification, or merely the mechanics of a specific decision rule. (Independent of outcomes; two views could yield the same verdicts for different foundational reasons.)

  ***

  ### Part II: The Diagnostic Decision Tree

  **Instructions:** Start at Node 1. Answer the question based on your intuitive judgment of the case described. Follow the arrow corresponding to your answer. Continue until you reach a Leaf.

  **Node 1: The Anchor of Death**
  You must choose between two policies. Policy X results in one specific person dying. Policy Y results in five specific other people dying. There are no other differences. Do you flip a fair coin to decide, or do you implement Policy Y to save the five?
  *   **Flip a coin:** Go to Node 2.
  *   **Save the five:** Go to Node 3.

  **Node 2: The Weight of the Coin**
  You are flipping a coin to decide between the one person and the five people. Do you give the one person a 50% chance (equal share), or do you give the one person a 1-in-6 chance and the group of five a 5-in-6 chance (proportional share)?
  *   **50% (Equal):** Go to **Leaf A**.
  *   **1-in-6 (Proportional):** Go to **Leaf B**.

  **Node 3: The Reason Given**
  You chose to save the five. Imagine you must justify this to the one person who will die. Do you say, "Your claim was outweighed by the stronger combined claims of the five," or do you say, "Our claims were equal, but I had to choose, and I chose the greater number to break the tie"?
  *   **Outweighed (Stronger combined claims):** Go to Node 5.
  *   **Tie-Break (Equal claims):** Go to Node 4.

  **Node 4: The Anchor of Shocks (Tie-Break Path)**
  Accepting that claims are compared one-at-a-time and only break ties: You must choose between one person dying or one billion people each receiving a brief, painful but trivial shock. Do you save the one person from death, or the billion from shocks?
  *   **Save the one (Death trumps):** Go to **Leaf C**.
  *   **Save the billion (Shocks aggregate):** Go to **Leaf D**.

  **Node 5: The Anchor of Risk (Aggregation Path)**
  Accepting that claims can outweigh one another: You must choose between one person certainly dying, or one million people each facing a one-in-a-million risk of death (expected one death). Do you compare the certain outcome against the expected outcome, or do you compare the certainty imposed on one against the risk imposed on each of the million?
  *   **Compare Outcomes (Ex-Post):** Go to Node 7.
  *   **Compare Risks (Ex-Ante):** Go to Node 6.

  **Node 6: The Weight of Distributed Risk**
  You are comparing the risks imposed before the fact. Does the fact that one million people face a small risk make the complaint stronger than if only one person faced that same small risk, even if the total expected deaths are the same?
  *   **No (Risk is individual):** Go to Node 7.
  *   **Yes (Group risk matters):** Go to **Leaf E**.

  **Node 7: The Anchor of Shocks (Aggregation Path)**
  You must choose between one person dying or one billion people each receiving a brief, painful but trivial shock. Do you save the one person from death, or the billion from shocks?
  *   **Save the one:** Go to Node 8.
  *   **Save the billion:** Go to Node 9.

  **Node 8: The Nature of the Threshold**
  You chose to save the one person from death rather than the billion from shocks. Is this because the shock is too faint to be felt or registered as a harm at all, or because death is a different category of harm that shocks cannot touch regardless of number?
  *   **Too faint (Magnitude threshold):** Go to **Leaf F**.
  *   **Different category (Kind threshold):** Go to **Leaf G**.

  **Node 9: The Limit of Aggregation**
  You chose to save the billion from shocks. If the number of people receiving shocks rose to one trillion, would you still save them rather than the one person dying?
  *   **No (There is a limit):** Go to **Leaf H**.
  *   **Yes (No limit):** Go to Node 10.

  **Node 10: The Linearity of Claims**
  You believe the shocks can outweigh death without limit. Does the complaint of the 100th person in the group count exactly as much as the complaint of the 1st person, or does the complaint of the worse-off (the 1st) count for more?
  *   **Exactly as much (Linear):** Go to Node 11.
  *   **Counts for more (Weighted):** Go to **Leaf I**.

  **Node 11: The Unit of Complaint**
  You count claims linearly. If a single person suffers two distinct burdens (e.g., loses an arm and a leg), does this generate one complaint for that person or two separate complaints?
  *   **One complaint (Person-based):** Go to Node 12.
  *   **Two complaints (Burden-based):** Go to **Leaf J**.

  **Node 12: The Ground of Prohibition**
  You count claims linearly and by person. If we could mathematically pool claims without error, would it still be wrong to treat people as containers for value because they are separate beings, or is the restriction only about the rules we need to justify principles to individuals?
  *   **Separate beings (Metaphysical):** Go to **Leaf K**.
  *   **Rules of justification (Procedural):** Go to **Leaf L**.

  ***

  ### Part III: The Leaves (Positions)

  **Leaf A: The Numbers Never Count View (Taurek)**
  *   **Core Claim:** The number of people affected never makes a claim stronger; each person is owed an equal chance of rescue.
  *   **Verdicts:** Case A (Coin Flip), Case B (Coin Flip), Risk Case (Equal individual risk).
  *   **Awkward Commitment:** Must accept flipping a coin between one death and five deaths, implying the five have no greater claim to be saved than the one.

  **Leaf B: The Weighted Lottery View (Broome)**
  *   **Core Claim:** Everyone deserves a chance, but the chance should be proportional to the number of claims on each side.
  *   **Verdicts:** Case A (1/6 vs 5/6 Lottery), Case B (1/1,000,000,001 vs Billion/... Lottery), Risk Case (Proportional to group size).
  *   **Awkward Commitment:** Requires implementing a randomization procedure even when the stakes are vastly different, potentially sacrificing the many if the coin lands badly.

  **Leaf C: The Pairwise Comparison View (Scanlon)**
  *   **Core Claim:** Principles are justified by comparing individuals one-at-a-time; numbers only break ties between equally strong individual claims.
  *   **Verdicts:** Case A (Save 5), Case B (Save 1), Risk Case (Compare individual risks/ex-post outcomes depending on interpretation).
  *   **Awkward Commitment:** Must save one person from death over a billion people suffering trivial shocks, implying the billion shocks collectively generate no weight against the death.

  **Leaf D: The Tie-Break Aggregation View (No Standard Defender)**
  *   **Core Claim:** Claims are compared one-at-a-time, but small burdens can aggregate to break a tie against a large burden.
  *   **Verdicts:** Case A (Save 5), Case B (Save Billion), Risk Case (Tie-break logic).
  *   **Awkward Commitment:** Inconsistent with the "one-at-a-time" justification; if shocks can aggregate to outweigh death, they should also aggregate to outweigh a single shock, collapsing into standard aggregation.

  **Leaf E: The Ex-Ante Aggregation View (Finkelstein/Williams)**
  *   **Core Claim:** The complaint lies in the risk imposed, and the number of people exposed to risk adds independent weight to the complaint.
  *   **Verdicts:** Case A (Save 5), Case B (Save Billion), Risk Case (Save the million at risk over the one certain death).
  *   **Awkward Commitment:** Might require saving a million people from a microscopic risk over saving one person from a certain minor injury, prioritizing probability over severity.

  **Leaf F: The De Minimis View (Threshold Aggregation)**
  *   **Core Claim:** Burdens below a certain magnitude of severity do not register as complaints at all and cannot be aggregated.
  *   **Verdicts:** Case A (Save 5), Case B (Save 1), Risk Case (Depends on risk magnitude).
  *   **Awkward Commitment:** Must identify a precise cutoff point where a harm becomes real; implies that adding one more person to a group of "sub-threshold" sufferers never changes the moral status.

  **Leaf G: The Lexical Kind View (Kind Aggregation)**
  *   **Core Claim:** Burdens of different kinds (e.g., death vs. shock) are incomparable; no number of lower-kind burdens can outweigh a higher-kind burden.
  *   **Verdicts:** Case A (Save 5), Case B (Save 1), Risk Case (Death risks trump shock risks).
  *   **Awkward Commitment:** Implies that preventing a trillion trivial shocks is less important than preventing one death, even if the total suffering of the shocks is immense.

  **Leaf H: The Capped Aggregation View (Limited Aggregation)**
  *   **Core Claim:** Numbers count and burdens aggregate, but only up to a point; beyond a certain threshold, additional claims do not increase the weight against a severe harm.
  *   **Verdicts:** Case A (Save 5), Case B (Save Billion), Risk Case (Save million at risk), Trillion Shocks (Save 1 Death).
  *   **Awkward Commitment:** Arbitrary cutoff; implies that the difference between 999 billion and 1 trillion shocks is morally decisive in a way that the difference between 1 and 2 is not.

  **Leaf I: The Priority-Weighted View (Parfit)**
  *   **Core Claim:** Claims aggregate, but the claims of those who are worse off (or suffer greater burdens) count for more than the claims of those better off.
  *   **Verdicts:** Case A (Save 5), Case B (Save Billion), Risk Case (Weighted by severity), Trillion Shocks (Save Billion/Trillion).
  *   **Awkward Commitment:** Can imply "bottomless" priority; if the worse-off are sufficiently badly off, their minor gains might outweigh the major gains of the better-off, regardless of numbers.

  **Leaf J: The Burden-Based Utilitarian View (Classic Utilitarianism)**
  *   **Core Claim:** The unit of moral concern is the burden itself, not the person; all burdens sum linearly regardless of who holds them.
  *   **Verdicts:** Case A (Save 5), Case B (Save Billion), Risk Case (Minimize expected harm), One Person/Two Burdens (Counts as two).
  *   **Awkward Commitment:** Permits sacrificing one innocent person if their death prevents enough minor headaches for others, provided the total sum of pain is reduced.

  **Leaf K: The Separateness-Based Aggregation View (No Standard Defender)**
  *   **Core Claim:** Claims aggregate linearly, but the restriction on pooling is grounded in the metaphysical fact that persons are distinct entities.
  *   **Verdicts:** Case A (Save 5), Case B (Save Billion), Risk Case (Minimize expected harm), Foundation (Metaphysical).
  *   **Awkward Commitment:** Difficult to reconcile; if persons are metaphysically separate, it is unclear why their claims can be summed at all without violating that separateness.

  **Leaf L: The Contractualist Aggregation View (Post-Scanlonian)**
  *   **Core Claim:** Claims aggregate linearly, but the restriction is procedural: we must be able to justify the summing rule to each individual.
  *   **Verdicts:** Case A (Save 5), Case B (Save Billion), Risk Case (Minimize expected harm), Foundation (Justificatory).
  *   **Awkward Commitment:** Risks collapsing into Utilitarianism; if the justification for aggregation is accepted, the "contractualist" label may do no distinct work in the verdicts.

  ***

  ### Part IV: Housekeeping & Structural Limitations

  **1. Unoccupied Combinations**
  *   **Tie-Break + Save Billion (Leaf D):** This combination is theoretically possible but largely unoccupied in the literature. It is unattractive because it undermines the logic of the "one-at-a-time" restriction. If shocks can aggregate to outweigh death, they should aggregate to outweigh a single shock, making the "tie-break" mechanism redundant.
  *   **Metaphysical Separateness + Linear Aggregation (Leaf K):** This combination is likely incoherent. If the metaphysical separateness of persons is the ground for prohibiting pooling, it is difficult to explain why linear aggregation is permissible at all. Most views that accept aggregation ground it in value (Utilitarianism) or justification (Contractualism), not metaphysics.
  *   **De Minimis + Weighted Priority:** This combination is unexplored. One could hold that only burdens above a threshold count, *and* that those burdens are priority-weighted. The tree routes De Minimis (Node 8) to a leaf before reaching the Weighting node (Node 10), leaving this space empty. It is not incoherent, merely under-theorized.

  **2. Extensional Equivalence (Indistinguishable Leaves)**
  *   **Leaf H (Capped Aggregation) vs. Leaf I (Priority-Weighted):** These views are often extensionally equivalent across a wide range of cases. Both will save the billion shocks over the one death, but save the one death over the trillion shocks. They diverge only in "borderline" cases where the cap is met but the priority weight is not yet decisive, or vice versa. Since the tree asks about a "Trillion" (Node 9) and "1st vs 100th" (Node 10), it attempts to separate them, but in practice, a Capped view can mimic a Priority view by setting the cap at the point where priority weight would have diminished the marginal value.
  *   **Leaf J (Burden-Based Util) vs. Leaf L (Contractualist Agg):** These leaves are extensionally equivalent on all outcome-based cases (A, B, Risk). They differ only on the foundational justification (Node 12). If a participant cares only about verdicts, the tree cannot separate them. They are distinct only meta-ethically.

  **3. Determinacy Failure**
  *   **Node 12 (Foundation):** Two participants can give identical answers at every node, including Node 12 ("Rules of justification"), yet end up in different philosophical camps. One might interpret "Rules of justification" as requiring a veto power for individuals (Scanlonian), while another interprets it as requiring a rule that no one could reasonably reject even if it aggregates (Contractualist Aggregation). The tree groups these into Leaf L, but they represent a significant theoretical divide regarding the *strength* of the individual veto.
  *   **Node 6 (Group Risk):** A "Yes" answer leads to Leaf E. However, some Ex-Ante views (like Broome's) might answer "No" to Node 6 (risk is individual) but still aggregate those individual risks linearly later in the tree. The tree forces Ex-Ante responders who deny group weight into the Ex-Post track (Node 7), potentially misclassifying an Ex-Ante Individualist who aggregates risks. This is a structural simplification to keep the node count manageable.
