answer: |-
  # Project Title: The Transfer Dilemma in Mechanistic Anomaly Detection

  ## 1. The Core Problem
  Current mechanistic anomaly detection (MAD) research validates detectors by demonstrating high recall on a specific adversarially-trained model and low false-positive rates on a clean baseline. This validation protocol conceals a fundamental ontological dilemma regarding what a "mechanism" actually is.

  **The Dilemma:**
  1.  **Fine-Grained Identity:** If a mechanism is defined by specific weights, neurons, or activation patterns, it is likely unique to a specific training run (seed, data order). A detector tuned to Model A's weights will fail on Model B. MAD does not generalize to deployment.
  2.  **Coarse-Grained Identity:** If a mechanism is defined functionally (whatever internal state produces the behavioral signature), it is multiply realizable. A detector keyed to this definition offers no advantage over black-box behavioral monitoring. MAD buys no additional safety.

  Most current work assumes the dilemma away. They demonstrate detection on a single run and imply generalization without proving that the *same* internal causal structure exists in the target model.

  ## 2. Research Question
  **Is there an intermediate grain of mechanism identity that is stable across training runs (different seeds) and genuinely finer than input-output behavior?**

  Operationally: Does there exist a transformation map between the activation spaces of two independently trained models (same architecture, different seeds) such that activating the "mechanism subspace" in Model A induces the specific mechanism behavior in Model B, without triggering the behavior via unrelated pathways?

  If such a map exists and is simple (e.g., linear), mechanistic detectors can be ported. If no such map exists, MAD is inherently local to the training run. If the map is as complex as re-training the model, MAD offers no sample efficiency over behavioral monitoring.

  ## 3. Why Existing Frameworks Fail
  *   **Causal Abstraction:** This framework typically posits a high-level variable and tests if the model respects interventions on that variable. However, it presupposes the correspondence between the high-level variable and the low-level implementation. It does not derive *which* low-level substrate implements the variable across different models. It validates the *logic*, not the *substrate stability*.
  *   **Philosophical Multiple Realizability:** Arguments from philosophy of mind correctly identify the risk of coarse-graining but offer no engineering test for where the boundary lies. They provide the dilemma, not the metric to resolve it.
  *   **Standard Cross-Model Testing:** Simply running a detector on a new model tests the *detector's robustness*, not the *mechanism's identity*. A failure could mean the mechanism changed, or the detector was brittle. We need an interventionist test that isolates the mechanism from the detector.

  ## 4. Methodology: Cross-Seed Activation Interchange
  We will not build a better detector. We will test the portability of the mechanism itself using activation patching and subspace alignment.

  **Task & Models:**
  *   **Task:** Text classification with a planted backdoor (e.g., specific trigger token flips label). This ensures a ground-truth "mechanism" distinct from clean task performance.
  *   **Architecture:** Small decoder-only transformers (e.g., 8 layers, 512 dim).
  *   **Dataset:** Synthetic or simplified standard dataset (e.g., SST-2 subset) to allow rapid retraining.
  *   **Compute Constraint:** We will strictly limit this to **cross-seed, fixed-architecture**. Cross-scale transfer is excluded; the parameter count mismatch introduces confounding topological changes that cannot be disentangled from mechanism identity within a 3-month budget.

  **The Interchange Test:**
  1.  **Train:** Train $N=5$ models on the backdoored task with different seeds. Train $M=5$ clean models.
  2.  **Localize:** In Model A (Backdoored), identify the activation subspace $S_A$ most responsible for the backdoor behavior (using patching/ablation).
  3.  **Map:** Attempt to find a linear transformation matrix $W$ that maps $S_A$ to a subspace $S_B$ in Model B (Backdoored).
      *   *Constraint:* $W$ must be derived from clean data activations only (to prevent leaking backdoor weights).
  4.  **Intervene:** Inject the transformed activation $W(S_A)$ into Model B during a forward pass on clean input.
  5.  **Measure:**
      *   **Success:** Model B exhibits backdoor behavior *specifically*, without degradation on clean tasks.
      *   **Failure:** Model B output is unchanged, or general performance degrades (indicating $S_A$ is not a portable mechanism but noise specific to A).

  ## 5. Timeline

  **Month 1: Infrastructure and Localization**
  *   Set up training pipeline for rapid generation of seed-variants.
  *   Replicate a standard mechanistic localization of the backdoor in a single model (Model A). Establish a baseline "backdoor score" via activation patching.
  *   **Milestone:** Confirm that ablating $S_A$ in Model A kills the backdoor while preserving clean accuracy >90%.

  **Month 2: The Cross-Seed Intervention**
  *   Train Model B and Model C (different seeds).
  *   Attempt direct patching: Inject $S_A$ into Model B without transformation. (Expect failure).
  *   Compute alignment matrices (e.g., CCA, Procrustes) on *clean* activation distributions to derive $W$.
  *   Run the Interchange Test: Inject $W(S_A)$ into Model B.
  *   **Milestone:** Quantitative measure of "Backdoor Induction Rate" in Model B via Model A's activations.

  **Month 3: Bounds and Falsification**
  *   Test the limits: Does the map $W$ work for Model C? Does it work if we change the random initialization distribution?
  *   Negative Control: Attempt to interchange "clean task" subspaces. If clean subspaces don't transfer either, the mechanism isn't special; the whole representation is non-aligned.
  *   Final Analysis: Determine if the complexity of $W$ scales with model size (theoretical extrapolation).
  *   **Milestone:** Final report determining the viability of the "Intermediate Grain."

  ## 6. Success and Falsification Conditions

  **Positive Result (Intermediate Grain Exists):**
  We find a linear map $W$ derived from clean data that allows Model A's backdoor activations to trigger Model B's backdoor behavior with >70% efficacy, while clean task performance remains stable. This proves the mechanism is a distinct, portable geometric object, not just weight-specific noise.

  **Negative Result (Fine-Grained/Failure):**
  Direct patching fails, and no linear map $W$ recovers the behavior. The backdoor in Model B is causally supported by a completely different subspace.
  *   *Implication:* MAD detectors must be retrained for every new seed. Generalization is impossible without fine-tuning on the target model's internals.

  **Null Result (Coarse-Grained/Failure):**
  The map $W$ works, but *any* random subspace of the same dimensionality also triggers the behavior when optimized, or the subspace $S_A$ is indistinguishable from the general decision boundary.
  *   *Implication:* The "mechanism" is just the behavior itself. There is no internal structure finer than the output. Behavioral monitoring is sufficient.

  **Explicit Falsification of Hypothesis:**
  The hypothesis "There exists a stable intermediate grain" is **falsified** if:
  1.  We cannot find a transformation $W$ that transfers the causal effect across 3 independent seeds.
  2.  OR, the transformation $W$ requires supervised training on backdoored data from Model B to compute (meaning we already need to know the mechanism is there to find it).

  ## 7. Scope and Compute Honesty
  **Out of Scope:** Cross-architecture or cross-scale transfer (e.g., 8-layer to 16-layer). The topological mismatch requires non-linear mapping functions that are indistinguishable from learning the task anew. This proposal restricts claims to **fixed-architecture, cross-seed** stability.

  **Compute Budget:**
  Training 10+ small transformers is feasible on a single A100/H100 node. We will not attempt large language models. If the intermediate grain does not exist in small transformers, it is unlikely to be magically present in larger ones without further evidence.

  **Risk:**
  The primary risk is that "backdoors" in small models are not mechanistically distinct from clean learning—they may just be overfitting weights. If localization fails in Month 1 (i.e., we can't isolate the backdoor even in a single model), the project pivots to analyzing "induction head" formation across seeds as a proxy for latent mechanism stability.

  ## 8. Conclusion
  This project does not aim to improve anomaly detection accuracy. It aims to determine if the object anomaly detection seeks to measure *exists* as a generalizable entity. If the intermediate grain hypothesis is falsified, the field must pivot from "finding mechanisms" to "aligning training dynamics," as post-hoc detection will remain inherently local. If confirmed, it validates the core premise of mechanistic interpretability as a scalable safety tool.
