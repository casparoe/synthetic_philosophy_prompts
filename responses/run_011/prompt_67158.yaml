      *   *Hypothesis:* There exists a representational geometry (e.g., subspace structure, feature direction relationships) that is invariant across seeds/architectures of the same scale, distinct from input-output behavior.
      *   *Test:* Train multiple models with the same architecture/task but different seeds. Inject a specific "mechanism" (e.g., a backdoor or a specific reasoning shortcut). Train detectors on Model A. Test on Model B.
      *   *Crucial Twist:* It's not just "does it detect?" It's "does it detect via the *same* internal signature?" This requires intervention. If I patch the signature from A into B, does B exhibit the behavior? If I patch the signature from B into A, does A exhibit the behavior? This is the "interchangeability" test.

  3.  **Drafting the Proposal Structure:**
      *   **Title:** Needs to be punchy and descriptive.
      *   **Problem Statement:** The "Transfer Dilemma."
      *   **Why Current Approaches Fail:** Causal abstraction assumes the map; philosophy is too abstract.
