      *   *Which claims survive distortion?* The "Process" claim survives in news. The "Aura" claim in art is suspicious.
      *   *The Verdict:* The art debate *is* dressing up market/provenance intuitions as aesthetics, *except* for the intentionality argument. But the newsroom equivalent (staff writers for columnists) suggests newsrooms have solved this by admitting the brand is the product, not the individual labor.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't just say "Art is wrong." I need to answer the specific prompt: "Is my framework missing a category... or is their debate importing market intuitions?"
      *   *Key Insight:* The "Perfect Forgery" in art is aesthetically worse *only if* you value the specific causal chain of creation. In news, we value the causal chain of *verification*.
      *   *The "Workshop Copy" Problem:* This is the strongest point of divergence. In news, a "staff-written piece under a columnist's name" is standard practice (branding). In art, a "workshop copy signed by the master" is a forgery/fraud (unless disclosed).
      *   *Why?* Because news is about the *information*, art is about the *artifact*.
      *   *Residue:* The art world isn't hiding market value; they are protecting the concept of the "singular creative act." The newsroom has abandoned that for "institutional trust."
      *   *Final Decision:* The user's hunch is mostly right (history matters), but the newsroom has a blind spot (brand bylines) that the art world correctly identifies as a degradation of authorship, even if the art world dresses it up as "aesthetics" when it's really "ontology."

  6.  **Final Polish (Tone and Structure):**
      *   Use newsroom headers.
      *   Keep it tight.
      *   Ensure the "Bending the Terms" warnings are explicit.
      *   Make the "Residue Report" punchy.

  7.  *(Self-Correction on the "Perfect Forgery" translation)*: A perfect forgery in art is indistinguishable. In news, a perfect plagiarism (where facts are true) is indistinguishable to the reader. The punishment is identical. The distinction is the *claim of labor*.
      *(Self-Correction on "Restoration")*: Restoration is about *continuity*. In news, that's the "Update" policy. If you change too much, you break the continuity of the record.

  8.  **Finalizing the Residue:** The art world claims an aesthetic difference. The newsroom claims an ethical/procedural difference. But the content is the same. The art world is likely protecting *scarcity* (market) under the guise of *authenticity* (aesthetics). However, the "Workshop Copy" exception proves the newsroom is actually the one being dishonest about authorship, while the art world is honest about the degradation of the "hand."

