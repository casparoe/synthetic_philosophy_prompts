      *   **Constraint:** Do not smuggle aesthetic concepts in to make the mapping tidy. Acknowledge where terms are being bent.
      *   **Core Question (The Residue Report):** Is "plagiarism-when-it's-true" structurally the same as "forgery-when-it's-indistinguishable"? (Identical content, different history, punish the history). Does one have a feature the other lacks? Which claims survive distortion? Where does newsroom talk fail (specifically regarding workshop copies/staff writers under a columnist's name)?
      *   **Final Verdict:** Is the art world missing a category, or are they dressing up market/provenance intuitions as aesthetics?
      *   **Tone:** Professional, peer-to-peer, precise, slightly cynical (newsroom style), avoiding academic jargon unless translated.

  2.  **Deconstruct the Art Arguments into Newsroom Terms:**

      *   *Argument 1: The Perfect Forgery.*
          *   Art view: It looks the same, but it's aesthetically worse because it lacks the "right history" (intentionality, moment in time).
          *   Newsroom translation: This is **Fabrication** or **Plagiarism** where the facts are true.
          *   Scenario: A writer submits a piece. It reads perfectly. The facts are checkable and true. But they didn't do the reporting; they lifted the structure/narrative from a wire service or a competitor without credit, or they invented the *process* of reporting (said they interviewed X when they didn't, even if X said the things attributed to them).
          *   Newsroom verdict: We fire them. Why? Because the *provenance of the information* is tainted. The "byline" claims "I reported this." If they didn't, it's a lie about the labor, even if the output is accurate.
          *   *Bending the terms:* In art, the forgery is often about *making* the object. In news, it's about *gathering* the info. A perfect forgery in news is a story that is factually accurate but fabricated in its genesis.

      *   *Argument 2: The Over-Restored Fresco.*
          *   Art view: If you replace too much paint, it's a copy, not the original. It's a "new work that resembles it."
          *   Newsroom translation: **Aggregation/Churnalism** or **Heavy Editing/Updates**.
          *   Scenario: A story runs. It gets outdated. We update it. At what point does the "Original Reporting" tag become false? If 80% of the text is rewritten by a new editor to reflect new consensus, is it still the reporter's piece?
          *   Newsroom verdict: We use "corrections" or "editor's notes." If it changes too much, we kill the old URL and start a new story (new byline/date).
          *   *Bending the terms:* Art restoration is about *preservation* gone wrong. News updating is about *accuracy* gone too far into rewriting.

