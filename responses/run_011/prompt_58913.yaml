      *My take:* It's mostly market/provenance dressed as aesthetics. *But*, there is a category the newsroom misses: **Performance.** A news story is a record of an event. A painting *is* the event. The forgery is a record of a different event (the forgery event vs the creation event).
      *Actually, the strongest argument is:* News is allographic (score can be played by anyone). Art is autographic (only this object counts). The newsroom *treats* stories as autographic (bylines matter) but *acts* like they are allographic (rewrites/updates/staff writers). The art world is consistent; the newsroom is hypocritical.
