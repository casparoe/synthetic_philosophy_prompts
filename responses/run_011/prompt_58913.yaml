      *   *Constraint Check:* Am I smuggling aesthetics? I need to be careful not to say "beautiful writing." I need to focus on "verified process."

  4.  **Developing the Residue Report (Section 2):**

      *   *The Core Hunch:* "Identical content, different history, we punish the history."
      *   *Analysis:* Is this right?
          *   In News: Yes. Truth is necessary but not sufficient. Process matters.
