answer: |-
  **Reviewer:** Your manuscript argues that adaptive stories often ignore structural constraints, citing San Marco's spandrels as the definitive null model. However, historical records indicate architects actively chose pendentives over squinches; the shape was an adaptation, not a geometric necessity.

  **Authors:** We distinguish origin from utility. The space may be selected, but the evangelists painted within it are exaptations. The biological warning stands regardless of the masonry.

  **Reviewer:** That concedes the primary structure was optimized. You demand biologists exclude selective hypotheses before invoking constraints, yet your central constraint is itself a selective hypothesis. By your own criteria, this analogy is merely a just-so story about masonry. It fails the very test it imposes on the phenotype.

  **Authors:** We stand by the distinction between origin and function.

  **Reviewer:** Then I must reject. You've demonstrated that even critics of adaptationism are vulnerable to adaptationist explanations of their own metaphors. Please resubmit when you have tested the null hypothesis of your own architecture. I cannot endorse a methodological mandate that fails its own loading test.

  This joke depends on the third asymmetry: the subsequent historical critique that the architectural analogy itself fails the methodological standard Gould and Lewontin demanded of biologists. The humour arises from the reviewer applying the "Spandrels" critique to the "Spandrels" paper itself.
