answer: |-
  Here is the read on Marcus.

  He isn't contradicting himself, but he is working with a very specific, rigid map of the human mind that he probably doesn't realize he's using. He divides mental states into two buckets: **Judgments** and **Tools**.

  1.  **Judgments (Belief, Admiration):** These must track the truth or quality of the object. You can't bribe a judgment. If the object doesn't change, the judgment shouldn't either. (This covers the Gnome, the Sick Mom, and the Watercolor).
  2.  **Tools (Fear, Gratitude):** These are functional responses to your situation, not necessarily the object. They serve a purpose (safety, social bonding) regardless of the "truth." (This covers the Lake and the Uncle).

  Here is the breakdown of what he will say, why he thinks he's right, and the case that will actually corner him.

  ### 1. The Prediction: What he says about the Piano
  Marcus will say **no**. He will tell you that your daughter does not have a reason to *believe* she won't freeze. She has a reason to *act confident*, or to *practice until she believes it*, but the utility of the belief is not a reason for the belief itself.

  **Why?**
  Because he classifies "believing you will succeed" as a **Judgment** (Bucket 1), not a **Tool** (Bucket 2). To Marcus, a belief is a claim about reality ("I will not freeze"). The fact that holding the claim helps make it true doesn't make the claim *currently* true. He will stick to Rule #2 (The Sick Mom): Benefit is a reason to *want* the state, not a reason to *hold* the state.

  He will dismiss your comparison to the Lake (#3). He will say: *"Fear is a reflex, like flinching. It's a seatbelt. Belief is a verdict. You don't get to verdict your way out of a freeze just because it helps."*

  ### 2. The Rules in His Head
  You asked for candidate rules. Here are the two operating systems running in his head that explain all five points:

  **Rule A: The Truth-Tracking Rule (For Judgments)**
  *   *Applies to:* Belief, Admiration.
  *   *Logic:* A reason must be about the *object*, not the *consequence*.
  *   *Fits:* Gnome (#1), Sick Mom (#2), Watercolor (#4).
  *   *The Gnome Clue:* When he said, "It's not a reason about the gnome," he gave away the game. For Marcus, if the reason doesn't describe the object (the gnome is ugly), it's not a reason for the judgment (admire).

  **Rule B: The Functional Rule (For Tools)**
  *   *Applies to:* Fear, Gratitude.
  *   *Logic:* A reason is valid if it serves a biological or social function, regardless of the object's properties.
  *   *Fits:* Lake (#3), Uncle (#5).
  *   *The Lake Clue:* "Fear isn't a verdict." He explicitly removes fear from the truth-tracking business.
  *   **The Uncle Clue:** Gratitude is a social debt (function), not an endorsement of the uncle's soul (truth).

  ### 3. Is he contradicting himself on #3 and #4?
  **No, but he is being arbitrary.**
  It feels like a contradiction because in #3 he lets an attitude (fear) exist for a *job* (seatbelt), but in #4 he won't let an attitude (admiration) exist for a *job* (honoring grandfather).

  He is entitled to use this distinction only if "Fear" and "Admiration" are fundamentally different kinds of things. He thinks they are. Fear is a survival mechanism; Admiration is an aesthetic assessment.
  *   **Where he is vulnerable:** He is assuming "Confidence" (the piano case) is an Assessment. But you could argue Confidence is a Survival Mechanism (like Fear). If he says Fear is a seatbelt, why isn't Confidence a fuel line? Both are about navigating danger. If he allows Fear to ignore the truth (the water is safe), why doesn't he allow Confidence to ignore the truth (I might freeze)?

  ### 4. The Wedge: The Case That Breaks Him
  You need a case where a **Judgment** (Bucket 1) is clearly required to perform a **Function** (Bucket 2), and where the "Truth" is created by the "Belief." The Piano case is close, but he can dodge it by saying "practice is the cause, belief is just a side effect."

  Here is the case to spring on him. It combines the **Gnome's Money**, the **Lake's Safety**, and the **Piano's Self-Fulfilling Prophecy**.

  **The "Trust" Case:**
  > "Marcus, imagine I'm a bank teller. A man walks in with a gun. He says, 'I don't want to hurt anyone, but I need money. If I believe you trust me to hand it over calmly, I will put the gun down. If I think you're scared or lying, I will shoot.'
  >
  > I have to *genuinely believe* he is safe to put the gun down. If I'm faking it, he'll know and shoot. So, my believing he is safe is the only thing that makes him safe.
  >
  > Do I have a reason to *believe* he is safe?
  >
  > If you say **No** (like the Gnome/Piano): Then I should doubt him. But if I doubt him, he shoots me. So your rule gets me killed.
  > If you say **Yes** (like the Lake): Then you're admitting that the *consequence* (living) is a reason for the *belief* (he is safe), even if the evidence (he has a gun) says otherwise.
  >
  > And here is the kicker: If I survive because I believed him, does that mean my belief was true? Or was it just a useful tool? If it was just a tool, why does #4 (Grandfather's art) say I can't treat admiration as a tool for family bonding?"

  **Why this works:**
  1.  **It forces Belief to be a Tool:** Like Fear (#3), Belief here is a survival mechanism.
  2.  **It makes the Belief True:** Like the Piano, the belief creates the reality.
  3.  **It tests the "Object" Rule:** Like the Gnome (#1), there is no evidence *about the man* that he is safe. The reason is entirely external (the money/life).

  ### 5. How to Play It
  Don't lead with the philosophy. Lead with the story.
  1.  Tell the Bank Teller story.
  2.  Ask him: *"Do I have a reason to believe he won't shoot?"*
  3.  If he says **No**: Ask, *"So I should adopt the mental state that gets me killed? How is that different than telling me to take the seatbelt off in the lake?"* (Traps him on #3).
  4.  If he says **Yes**: Ask, *"So consequences ARE reasons for belief? Then why isn't the $500 a reason to admire the gnome, if the $500 is the only thing that makes the admiration possible?"* (Traps him on #1).
  5.  If he tries to split the difference (e.g., "It's a reason to act, not believe"): Remind him of the setup. *"The gunman can tell if I'm acting. I have to actually believe it."*

  **The "Offhand Comment" Lever:**
  Remember that thing he said once? *"If you can work on yourself until the admiration is real, then the money was a real reason."*
  If he gets stuck, throw that back at him. *"In the bank case, if I work myself into genuinely believing he's safe, and that saves my life, didn't the survival reason become a real reason? Just like the gnome?"*

  **Summary:** Marcus is a "Realist" about truth and a "Pragmatist" about emotions. He keeps them in separate boxes. The Piano case tries to put a Pragmatic need in a Truth box. The Bank case forces the boxes to merge. That is where he will either have to admit he was wrong about the Gnome, or admit he was wrong about the Lake.
