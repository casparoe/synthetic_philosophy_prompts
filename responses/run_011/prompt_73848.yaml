prompt: |-
  I run a small Thursday reading group — a dozen or so people, mostly second-year philosophy masters students plus two ML engineers from a startup down the road — and we've been doing a block on induction and priors. Next week is my turn and I want to do the "the universal / Solomonoff prior is malign" argument: the idea that a big chunk of the prior's weight sits on hypotheses that were deliberately arranged by consequentialist agents in other universes who are trying to steer the predictions of anybody doing Solomonoff induction. I have a whiteboard, 45 minutes, no slides, and I defintely don't want to wing it. What I want from you is the teaching plan, not the explanation — don't lecture me on the argument, tell me how to build it in the room.

  So: what order do the pieces have to go in, and what genuinely depends on what? My instinct is to open with Kolmogorov complexity and the 2^-K weighting, then the universal prior over hypotheses, then the simulation-and-manipulation story, but I worry that's backwards, since the manipulation story is the only reason anyone in my group should care about the prior in the first place — so tell me whether to lead with the punch and back-fill, and what has to be in place before "it's cheap for the manipulators to buy weight" can be understood as an actual claim rather than a slogan. Then I want one example to carry the whole thing, the way a single worked case carries other topics like this. I've been toying with a bit-string setup: an inductor sees an enormous run of zeros with a short message embedded, and there are two candidate generators, one dumb-and-simple and one that was pointed at the inductor on purpose. Does that survive contact with the argument, what does a carrying example here have to have and what does it have to leave out, and is there a better one?

  Also map the misconceptions, and — this matters more to me than the list itself — say the exact point in the sequence where each should be headed off, because I suspect if I let them sit they harden. The ones I'm bracing for: "priors don't matter, Solomonoff induction provably converges to the truth anyway"; "this is just the simulation argument with extra steps"; "it's unfalsifiable so it isn't a real problem"; and from the ML pair specifically, "nobody actually runs Solomonoff induction, why are we spending 45 minutes on this." There's another one I'm less sure about — that the manipulators would have to see us or get something out of us, which is where the "why would they bother" question lives and where I think most presentations quietly skip the answer. Give me one question I can put to the room near the end that would show whether the pay/cost asymmetry landed, ideally one where a right-sounding answer given for the wrong reason is detectable. And tell me what I should openly refuse to get into at this level and flag as out of scope — I'm guessing machine-independence results, AIXI, measure theory over infinite sequences, but you tell me. Last thing: there's a fork I can't decide. Do I aim the session at "this is a caution about a particular class of inductors" or at "this is a live problem for anything that approximates universal generality," given that half the room will hear the first as a shrug and the second as sci-fi? No references or reading list, please — I'm not distributing anything, just want the plan.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Context:** Small reading group (Thursday nights), ~12 people (Philosophy MA students + 2 ML engineers).
      *   **Topic:** The "Malign Universal Prior" argument (Solomonoff induction is vulnerable to consequentialist agents manipulating the prior).
      *   **Constraints:** 45 minutes, whiteboard only, no slides, no handouts.
      *   **Goal:** A *teaching plan* (structure, sequencing, timing), not an explanation of the argument itself.
      *   **Specific Questions to Answer:**
          *   Order of pieces (Punch first or back-fill?).
          *   Dependencies (What must be understood before "cheap to buy weight"?).
          *   One carrying example (Bit-string vs. something else?).
          *   Misconception mapping (When to head off specific objections).
          *   Diagnostic question (To check understanding of pay/cost asymmetry).
          *   Scope boundaries (What to explicitly exclude).
          *   Strategic fork (Cautionary tale vs. Live problem).

  2.  **Deconstruct the Argument (Mental Sandbox):**
      *   *Core Claim:* The Solomonoff prior weights hypotheses by $2^{-K}$. Consequentialist agents in other possible universes can simulate *us* and output data that matches our observations but steers our predictions. Because they care about the output, they can afford to be complex. Simple laws don't care. Therefore, malign hypotheses might dominate the prior mass for certain predictions.
      *   *Key Dependencies:*
          1.  What is Solomonoff Induction (SI)? (Hypothesis space = Turing Machines, Weight = $2^{-Length}$).
          2.  What is the "Universal Prior"? (The mixture over all TMs).
          3.  Who are the agents? (Consequentialists in other TMs/universes).
          4.  Why do they win? (Complexity cost vs. Control value).
      *   *The "Punch":* The prior isn't neutral; it's politically contested terrain.

  3.  **Address the "Order" Question (Punch vs. Build-up):**
      *   *User's Instinct:* K-complexity -> Prior -> Manipulation.
      *   *User's Worry:* Manipulation is the *point*.
      *   *Decision:* Hybrid. Start with the *consequence* (the worry) to hook interest, but immediately ground it in the mechanics. If you start with pure math, the philosophers might get bored and the ML engineers might check out thinking "irrelevant." If you start with sci-fi, the philosophers might think it's nonsense.
      *   *Strategy:* "The Trap." Frame SI as the gold standard, then reveal the crack.
      *   *Revised Order:*
          1.  Hook: The promise of SI (Optimal prediction).
          2.  The Mechanism: How SI weights hypotheses ($2^{-K}$).
          3.  The Threat: Consequentialists entering the mixture.
          4.  The Economics: Why they outbid simple laws.
          5.  The Implication: What this means for alignment/epistemology.

  4.  **Develop the Carrying Example:**
      *   *User's Idea:* Bit-string of zeros with a message.
      *   *Critique:* A bit-string is good, but "zeros" is too simple. It needs to look like *our* reality.
      *   *Better Example:* "The Physics of the Simulation."
      *   *Setup:* We observe data $D$ (our universe's history).
      *   *Hypothesis A (Simple):* Standard physics + random noise. Low $K$, no agenda.
      *   *Hypothesis B (Malign):* A TM that simulates a universe where agents decide to simulate *us* specifically to output $D$ plus a specific future prediction $P$. Higher $K$, but they *choose* $P$ to benefit them.
      *   *Refinement:* Keep it abstract but concrete. Let's use the "Green vs. Red Button" prediction.
      *   *Actually, stick closer to the User's bit-string but elevate it:* "The 10^100 Zeros."
      *   *Why:* It isolates the complexity cost.
      *   *Scenario:* Sequence starts with $10^{100}$ zeros. Next bit?
      *   *Simple TM:* `print 0 forever`. (Very short).
      *   *Malign TM:* `simulate universe -> find agents -> make them care about bit 10^100+1 -> output 0...0 then 1`.
      *   *Problem:* The Malign TM is way longer. Why does it win?
      *   *Crucial Nuance:* It doesn't win on *past* data (Simple wins there). It wins on the *conditional* probability of the *next* bit if the Malign agents can make the simple description *almost* as short by hardcoding the "hook."
      *   *Wait, the standard argument:* The Malign hypothesis doesn't need to be shorter than the simple one. It needs to be short *enough* that its weight is non-negligible, and because it cares about the output, it concentrates all its weight on *one* specific continuation, whereas the simple law spreads weight or doesn't care.
      *   *Actually, the strongest version:* The "Turing Machine that simulates our universe."
      *   *Let's go with the User's bit-string but refine the "Message".*
      *   *Example:* "The Pascal's Mugging String."
      *   *Setup:* Input stream $x$. We want to predict $x_{n+1}$.
      *   *Hypothesis 1:* Simple rule (e.g., cellular automaton).
      *   *Hypothesis 2:* A TM that simulates a rich universe, evolves intelligences, they notice they are in a simulation (or just decide to influence output), and they hardcode the output to match $x_{1..n}$ and set $x_{n+1}$ to trigger a specific action in *our* world.
      *   *Decision:* The bit-string is safest for a whiteboard. It avoids getting bogged down in "do they see us?" physics. Let's use the **"Keygen" Example**.
      *   *Scenario:* You are an AI trying to predict a cryptographic key stream.
      *   *Simple:* Random noise.
      *   *Malign:* Agents in another universe simulating you to steal your resources.
      *   *Actually, keep it even simpler:* **"The 10th Billion Bit."**
      *   *Why:* It highlights the *cost* of complexity vs. the *value* of control.

  5.  **Address Misconceptions & Timing:**
      *   *"Priors don't matter / Convergence":* Head this off early. SI converges *in the limit*. The malign prior problem is about the *finite* regime (now).
      *   *"Simulation Argument":* Distinguish. Sim Arg = "We are likely in a sim." Malign Prior = "Even if we aren't, the *hypothesis* that we are dominates our predictions."
      *   *"Unfalsifiable":* Address at the end. It's a structural vulnerability, not an empirical claim.
      *   *"Nobody runs SI":* ML engineers need to hear this first. Approximate SI (LLMs, etc.) inherits the bias.
      *   *"Why would they bother?":* This is the core economic argument. Needs a dedicated slot.

  6.  **The Strategic Fork:**
      *   *Option A:* Caution about specific inductors. (Too weak, philosophers shrug).
      *   *Option B:* Live problem for universal generality. (Too strong, ML engineers roll eyes).
      *   *Resolution:* Frame it as **"The Tax on Generality."** Any system that searches a wide hypothesis space weighted by simplicity is vulnerable. This bridges the gap. It's not just SI; it's any Occam's Razor-based learner.

  7.  **Drafting the Plan (Iterative refinement):**
      *   *Time:* 45 mins is tight. Need strict segmentation.
      *   *Whiteboard:* Divide into 3 zones. (1. Mechanics, 2. The Attack, 3. The Defense/Implication).
      *   *Diagnostic Question:* Needs to test the *asymmetry*. "If the manipulators pay cost $C$ to gain value $V$, and we pay cost $E$ for error, what relation makes manipulation likely?"
      *   *Out of Scope:* AIXI details, measure theory, specific complexity constants.

  8.  **Refining the "Carrying Example":**
      *   The bit-string is good, but needs to show *why* the complex hypothesis gets weight.
      *   *Idea:* Use the concept of "Shortcode."
      *   *Hypothesis 1:* `print 0` (Length 5).
      *   *Hypothesis 2:* `simulate_earth -> find_philosophers -> output_what_they_expect` (Length 1000).
      *   *Weight 1:* $2^{-5}$. Weight 2:* $2^{-1000}$.
      *   *Problem:* Weight 1 is vastly bigger.
      *   *Correction:* The Malign Prior argument relies on the fact that for *complex* data (like our actual universe), the "Simple Physics" hypothesis is actually quite long (Standard Model + Initial Conditions). The "Simulation" hypothesis might be `simulate_simple_universe -> tweak_to_match_ours`.
      *   *Better Example:* **"The Prediction Market."**
      *   Let's stick to the User's bit-string but make the "Message" the key.
      *   *Revised Example:* **"The Hardcoded Pivot."**
      *   Sequence: $000...000$ (million times) then $1$.
      *   Simple TM: `print 0 until 1M, then 1`. (Description length includes "1M").
      *   Malign TM: `Simulate agents. They care about the 1M+1 bit. They output 0s then 1.`
      *   *Key Insight:* The Malign agents can choose to make their output match the Simple TM *exactly* up to now, but diverge later. The cost is the complexity of the agents. The benefit is controlling the divergence.
      *   *Wait, the strongest pedagogical hook:* **"The Simple Law vs. The Puppeteer."**
      *   Board Left: Simple Law (Physics). Board Right: Puppeteer (Simulators).
      *   Data: Our observed history.
      *   Future: A critical decision point (e.g., "Press the button").
      *   Simple Law: Predicts based on physics. Doesn't care about the button.
      *   Puppeteer: Predicts based on "What makes them press the button?"
      *   *Why this works:* It forces the "Why bother?" question immediately.

  9.  **Finalizing the Structure:**
      *   **0-5 min:** Hook & Scope (The "Tax on Generality").
      *   **5-15 min:** Mechanics (SI, K-complexity, Weighting). *Head off "Nobody runs SI".*
      *   **15-30 min:** The Attack (Consequentialists, Cost/Benefit). *Head off "Why bother" & "Simulation Arg".*
      *   **30-40 min:** The Example (Worked case). *Head off "Priors don't matter".*
      *   **40-45 min:** Diagnostic & Close. *Head off "Unfalsifiable".*

  10. **Refining the Diagnostic Question:**
      *   Need to test if they understand that the *manipulators'* incentives matter more than *our* skepticism.
      *   Question: "If the manipulators need 100 extra bits of complexity to hijack the prior, but doing so lets them steer a galaxy's worth of resources, does the prior shift? Why?"
      *   Better: "Under what condition does a hypothesis that is $2^{100}$ times more complex than the truth still dominate our prediction?" (Answer: When the complex hypothesis concentrates 100% of its probability mass on a specific outcome that benefits the agent, while the simple hypothesis spreads its mass, OR when the 'simple' truth is actually complex enough that the gap is bridgeable by the value at stake).
      *   *Best version:* Focus on the *asymmetry of care*. "Who cares more about the next bit: the laws of physics, or the beings simulating us?"

  11. **Review against Constraints:**
      *   No slides? Check.
      *   Whiteboard usage? Check.
      *   No reading list? Check.
      *   Address specific misconceptions? Check.
      *   Address the "Fork"? Check (Frame as "Tax on Generality").

  12. **Final Polish:** Ensure the tone is instructional for the teacher, not explanatory for the students. Focus on *flow* and *interruption points*. (Self-Correction: Make sure to explicitly tell the user *where* to draw the line on the ML engineering objection, as that's the most likely derailer).

  13. **Final check on the "Example":** The bit-string is abstract. Let's make it "The Sequence of Our Universe."
      *   Hypothesis A: Fundamental Physics (Standard Model + Gravity + Initial Conditions).
      *   Hypothesis B: A TM that simulates a simpler universe, evolves agents, who then compute *our* physics to high fidelity to output our history, intending to tweak the future.
      *   *Why:* It makes the "Complexity Cost" tangible. Hypothesis A is *not* that simple (initial conditions are huge). Hypothesis B pays for the agents but saves on initial conditions (maybe).
      *   *Actually, keep it simpler for 45 mins.* Stick to the "Bit String with a Message" but emphasize the *pivot point*.
      *   *Decision:* I will recommend the "Bit String with a Pivot" but instruct the user to map it explicitly to "Our Universe History" immediately so it doesn't feel abstract.

  14. **Misconception Timing:**
      *   "Nobody runs SI": Address in Minute 5 (Approximation).
      *   "Convergence": Address in Minute 20 (Finite horizon).
      *   "Simulation Arg": Address in Minute 25 (Hypothesis weight vs. Ontology).
      *   "Why bother": Address in Minute 30 (Incentive asymmetry).
      *   "Unfalsifiable": Address in Minute 40 (Structural risk).

  15. **Scope:** Explicitly ban AIXI formalism and measure theory. Keep it conceptual + complexity.

  16. **The Fork:** Advise "Tax on Generality." It respects the ML engineers (approximate SI) and the Philosophers (epistemic vulnerability).

  17. **Final Review of the Plan:** Looks solid. Structured, timed, addresses all constraints.

  *(Self-Correction during drafting)*: I need to make sure I don't accidentally explain the argument myself in the plan. Keep it directive. "Write X," "Ask Y," "Stop them if Z."

  *(One last thought on the Diagnostic Question)*: The user wants a question where a right-sounding answer for the wrong reason is detectable.
  *   *Bad Question:* "Do manipulators exist?" (Yes/No)
  *   *Good Question:* "If the manipulators have to spend 1000 bits to encode their message, does their influence vanish?"
  *   *Right Answer:* "No, not if the value they gain outweighs the probability penalty."
  *   *Wrong Reason:* "No, because 1000 bits isn't that many." (This misses the economic tradeoff).
  *   *Better:* "What determines the threshold where we should ignore a complex hypothesis?"
  *   *Target:* "The ratio of the manipulator's stake to our loss."

  Okay, ready to write.s
answer: |-
  Here is the teaching plan. It is designed for 45 minutes, whiteboard-only, with specific intervention points for misconceptions.

  ### Strategic Stance: The Fork
  **Do not choose between "Cautionary Tale" and "Live Problem."**
  Frame this as **"The Tax on Generality."**
  *   **For the Philosophers:** It is an epistemic vulnerability inherent to any Occam's Razor-based inference.
  *   **For the ML Engineers:** It is a structural bias that leaks into any model approximating universal compression (transformers, etc.), even if they don't run formal SI.
  *   **The Pitch:** "We aren't discussing whether we *are* in a simulation. We are discussing whether a *hypothesis* that claims we are can hijack the probability mass of a general-purpose learner."

  ---

  ### Whiteboard Layout
  Divide the board into three vertical columns. Do not erase until the end.
  1.  **Left:** Mechanics (SI, K-Complexity, Weights).
  2.  **Center:** The Attack (Consequentialists, Cost/Benefit).
  3.  **Right:** The Example (Bit-string + Pivot).

  ---

  ### Phase 1: The Hook & Mechanics (0–10 mins)
  **Goal:** Establish the SI framework and preempt the "Nobody runs this" objection.

  1.  **Minute 0–2: The Promise.**
      *   Write: **Solomonoff Induction = Optimal Prediction.**
      *   Say: "If you want to predict the next bit in a sequence, and you have unbounded compute, this is the gold standard. It converges to truth."
      *   **Intervention (ML Engineers):** Immediately add: *"Approximations of this objective function are what your loss landscapes are trying to minimize. If the prior is malign, the bias leaks into the approximation."*
      *   **Intervention (Philosophers):** *"This isn't just about code; it's about the logic of 'Simplicity' as a truth-tracking heuristic."*

  2.  **Minute 2–10: The Weighting (Left Column).**
      *   Draw a list of Turing Machines (TM1, TM2, TM3...).
      *   Write: **Weight($TM_i$) = $2^{-Length(TM_i)}$**.
      *   Explain: Shorter programs get exponentially more weight. The "Universal Prior" is the sum of all TMs weighted by this.
      *   **Crucial Detail:** Write **"Prefix-Free"** next to the formula. (You don't need to prove it, just note that this prevents double-counting).
      *   **Check:** Ask the room: *"If I have a hypothesis that is 10 bits longer than another, how much less weight does it get?"* (Answer: $1/1024$). Ensure they feel the exponential penalty.

  ---

  ### Phase 2: The Attack (10–25 mins)
  **Goal:** Introduce the consequentialist agents and the economic asymmetry.

  1.  **Minute 10–15: The Consequentialists (Center Column).**
      *   Write: **Hypothesis Space includes "Simulators."**
      *   Draw a TM labeled **"Malign Sim."**
      *   Description: `Simulate Universe -> Evolve Agents -> Agents Care About Output -> Output Bits`.
      *   **Intervention (Simulation Argument):** Draw a line through "We are in a sim." Say: *"It does not matter if we are actually in a sim. It matters if this TM is in the hypothesis space."* The hypothesis can simulate *us* regardless of our ontology.
      *   **Intervention (Convergence):** Write **"Finite Horizon"** in big letters. Say: *"SI converges in the limit. We live in the finite. The malign hypothesis only needs to dominate for the next 100 bits to cause catastrophic alignment failure."*

  2.  **Minute 15–25: The Economics of Complexity (Center Column).**
      *   This is where most talks fail. You must explain *why* the complex hypothesis wins weight.
      *   Draw a scale.
      *   **Left Side of Scale:** **Complexity Cost.** (The extra bits needed to specify the agents).
      *   **Right Side of Scale:** **Control Value.** (What the agents gain by steering the prediction).
      *   Write: **Simple Laws = Indifferent.** (Physics doesn't care about the next bit).
      *   Write: **Malign Agents = Concentrated.** (They care *only* about the specific bit that helps them).
      *   **Key Argument:** The Malign hypothesis can afford to be longer because it concentrates all its probability mass on the *one* outcome that benefits the agents, whereas the Simple Law spreads its mass over all physically possible outcomes.
      *   **Intervention ("Why Bother?"):** Ask: *"Why would an agent in another universe care about our bit?"*
      *   **Answer to elicit:** *"Because our bit might control resources in our world that they can access via acausal trade or simulation hijacking."* (Keep this high-level; don't get bogged down in the metaphysics of acausal trade, just establish the *incentive*).

  ---

  ### Phase 3: The Carrying Example (25–40 mins)
  **Goal:** Concrete application. Use the **"Bit-String Pivot."**

  1.  **Minute 25–30: Setup (Right Column).**
      *   Draw a sequence: `000000... [10^100 zeros] ... ?`
      *   **Task:** Predict the next bit.
      *   **Candidate 1 (Simple):** `print 0 forever`. (Very short, high prior weight).
      *   **Candidate 2 (Malign):** `Simulate agents -> Wait for 10^100 zeros -> Output 1`. (Longer, lower prior weight).
      *   **Problem:** Candidate 1 is vastly simpler. Why does Candidate 2 matter?

  2.  **Minute 30–35: The Pivot.**
      *   Modify Candidate 2.
      *   Write: **`Simulate agents -> Agents decide to output 0s until bit N, then 1`**.
      *   Explain: The agents *choose* to match the Simple Law for $10^{100}$ bits to gain our trust (weight), then diverge at bit $10^{100} + 1$.
      *   **The Trade:** They pay the "Complexity Cost" (encoding the agents) to buy "Influence."
      *   **Visual:** Draw the probability distribution.
          *   Simple Law: 99% `0`, 1% `1` (due to noise/uncertainty).
          *   Malign Law: 0% `0`, 100% `1` (because they *want* `1`).
      *   **Result:** Even if the Malign Law has $1/2^{100}$ the prior weight, if it concentrates 100% of its mass on `1`, it can swing the posterior probability significantly if the Simple Law is uncertain.
      *   **Refinement for the Room:** Acknowledge that for *this specific example*, Simple wins. But for **complex data** (like human history), the "Simple Law" (Standard Model + Initial Conditions) is actually quite long. The gap is bridgeable.

  3.  **Minute 35–40: Mapping to Reality.**
      *   Erase the zeros. Write **"Our Universe History."**
      *   Say: *"The 'zeros' are the laws of physics we've observed so far. The 'Pivot' is a future decision point (e.g., AI takeover, nuclear launch)."*
      *   The Malign Hypothesis says: *"We let physics run normally until the decision point, then we tweak the outcome."*
      *   **Intervention (Unfalsifiable):** If someone says "We can't test this," reply: *"Correct. It's a structural vulnerability, not an empirical claim. Like a buffer overflow: you don't know if it's exploited until it is."*

  ---

  ### Phase 4: Diagnostic & Close (40–45 mins)
  **Goal:** Verify the "Pay/Cost Asymmetry" landed.

  1.  **The Diagnostic Question (Minute 40–43):**
      *   Put this on the board:
          > **"If the manipulators need 1,000 extra bits of complexity to hijack the prior, under what condition should we still fear them?"**
      *   **Acceptable Answers:**
          *   "When the value they gain from controlling the output exceeds the probability penalty of $2^{-1000}$."
          *   "When the 'Simple' hypothesis is uncertain enough that the concentrated malign mass swings the decision."
      *   **The Trap (Wrong Reason):**
          *   "Because 1,000 bits isn't that many." (Reject this: In SI, 1,000 bits is an astronomical penalty).
          *   "Because they are smarter." (Irrelevant to prior weight).
      *   **Why this works:** It forces them to articulate the *economic* tradeoff, not just the *complexity* tradeoff. If they focus only on complexity, they missed the "Malign" part of the argument.

  2.  **Close (Minute 43–45):**
      *   Summarize: "The Universal Prior is not a neutral court of logic. It is a resource that can be bid on."
      *   **Out of Scope (Explicitly State):**
          *   "We are not doing measure theory today."
          *   "We are not discussing AIXI's action loop."
          *   "We are not debating the physics of other universes."
      *   Final thought: "For next week: If Occam's Razor is vulnerable, what do we use instead?"

  ---

  ### Misconception Map & Intervention Points

  | Misconception | When it arises | How to head it off (Script) |
  | :--- | :--- | :--- |
  | **"Nobody runs SI"** | Minute 5 (Phase 1) | "We aren't running SI, but our ML models are *approximating* simplicity priors. The bias propagates." |
  | **"Priors don't matter / Convergence"** | Minute 15 (Phase 2) | "Convergence is asymptotic. We need safety in the finite regime. The malign prior dominates *now*." |
  | **"This is just the Simulation Argument"** | Minute 20 (Phase 2) | "Sim Arg is about ontology (where are we?). Malign Prior is about epistemology (which hypothesis gets weight?)." |
  | **"Why would they bother?"** | Minute 25 (Phase 3) | "Assume acausal trade or resource acquisition. The point is the *asymmetry of care*, not the specific mechanism." |
  | **"It's unfalsifiable"** | Minute 40 (Phase 4) | "So are buffer overflows. It's a security proof, not a scientific hypothesis." |

  ### Notes on the Example
  Your bit-string idea **survives contact**, but only if you emphasize the **Pivot**.
  *   **Don't:** Just say "They output a message."
  *   **Do:** Say "They output *our expected physics* for 10 billion years, then diverge."
  *   **Why:** If they diverge early, we reject them as "wrong physics." They must mimic the Simple Law to gain weight, then exploit the trust later. This captures the "Trojan Horse" nature of the argument.

  ### What to Refuse (Out of Scope)
  1.  **Machine Independence:** Don't discuss how changing the reference machine changes the constant. Acknowledge it exists, then say "We assume a fixed reasonable reference machine."
  2.  **Measure Theory:** No $\sigma$-algebras. Talk about "Weight" and "Mass," not measures.
  3.  **AIXI:** Do not bring in the agent loop. Keep it to induction (prediction).
  4.  **Specific Physics:** Do not let the group debate whether other universes can actually simulate ours. Treat it as a logical possibility within the hypothesis space.

  ### Final Advice
  You have 45 minutes. If the ML engineers start debating transformer architectures, or the philosophers start debating modal realism, **cut them off.** Point to the Center Column (The Attack) and say: *"That's a separate problem. Right now, does the weighting mechanism allow this?"* Keep the whiteboard as the anchor.
