answer: |-
  **The practice**
  Current electoral boundaries form a jagged silhouette rather than a coherent shape. Nearly every democracy converges on 18 as the threshold of adulthood, yet diverges wildly on belonging. Long-term permanent residents who pay taxes and obey laws are routinely barred from national ballots, while citizens who left decades ago retain voting rights regardless of their current stake. Prisoners oscillate between total disenfranchisement and full inclusion depending on the jurisdiction. The pattern suggests a system prioritizing legal status over actual presence. We treat the vote as a property of identity rather than a function of participation. The lines protect the existing electorate's power to define itself, ensuring that those inside the boundary remain the sole arbiters of who joins them. This creates a closed loop where the demos validates its own composition, resisting expansion even when moral consistency demands it. The result is a stable but theoretically messy map of who counts.

  **What it presupposes**
  The implicit theory is a hybrid, shifting justification depending on which gate is being guarded. The age limit presumes competence. Eighteen is not when coercion begins, but when cognitive maturity is assumed to handle complex trade-offs. It treats the vote as a capacity-based right, withholding it from those deemed unable to wield it responsibly. This is paternalism dressed as protection, assuming interests below this line are better represented by guardians.

  Residence and citizenship track membership and allegiance. By excluding long-term residents, the state signals that the vote is not owed to those it coerces daily, but reserved for those bound by formal loyalty. It treats political power as an incident of national identity, not daily subjection. If the vote were based on coercion, anyone subject to law would vote. If it were based on stake, taxpayers would vote. Instead, it is based on a formal contract of citizenship. This privileges lineage over contribution. It presupposes that the polity is a family, not a firm.

  Conversely, imprisonment often triggers a theory of moral forfeiture. Disenfranchisement here suggests the vote is a privilege of good standing, revocable when one breaches the social contract. It implies the electorate is a moral community, not just a decision-making body. Yet, where prisoners vote, the theory shifts to inalienable rights, suggesting coercion overrides morality. This inconsistency reveals that prison voting is less about theory and more about whether a society views criminals as enemies or members.

  Expatriate voting relies on enduring membership. Allowing citizens abroad to vote presupposes that identity survives departure. It treats the vote as a permanent attribute of the person, unrelated to current stake or exposure to consequences. A citizen in London deciding Brazil's future has no skin in the game, yet retains the key. Together, these lines construct a demos based on a specific kind of belonging: one that is formal rather than functional, inherited rather than earned, and retained even when connection frays. The system assumes the state belongs to its members, not its inhabitants. It prioritizes the integrity of the national club over the fairness of the rules imposed on those standing outside the clubhouse but inside the country. The underlying presupposition is that democracy is about self-rule for a specific people, not just rule by the affected.

  **What it rules out**
  This practice quietly forecloses the "All Affected Interests" principle, which would grant votes to anyone impacted by a decision. Under that theory, long-term residents would vote nationally, as laws shape their lives as much as citizens'. It also rules out the "All Subject to Coercion" account, which would enfranchise prisoners and residents alike, since both face the state's force. Adopting either would shatter the citizenship model. We would have to accept that paying taxes and obeying laws constitutes membership, rendering naturalization ceremonies mere formalities. It would also require stripping expats of their ballots, acknowledging that distance severs political legitimacy.

  The current system protects the idea that a nation is a distinct entity with boundaries that matter. To switch theories would be to admit that borders are porous and that political authority flows from impact, not identity. We treat the exclusion of residents as obvious, but only because we refuse to countenance a demos defined by presence rather than passport. Furthermore, it rules out a purely competence-based model where children who demonstrate understanding could vote, or a purely residency-based model where citizenship is irrelevant. By holding firm on citizenship, the practice asserts that the state is an association of members, not a service provider for inhabitants. It forecloses democracy as a tool for managing resources, insisting instead it is a ritual of belonging. If we accepted the rival accounts, the very notion of national sovereignty would weaken, dissolving into a network of overlapping jurisdictions based on who is hurt by what law.

  **The seams**
  The lines are not consistent; they are several criteria stapled together. Age tracks capacity, residency tracks identity, prison tracks morality, expat status tracks lineage. The sharpest tension lies between the resident and the expat. One lives within the coercive sphere without a voice; the other lives outside it with one. This violates any single principle of fairness. There is no principled way to keep both without admitting the system prioritizes symbolic membership over actual governance.

  This brings us to the circularity of the boundary. Whoever draws the line is already standing inside it, picked by the people the previous boundary let in. The current electorate defines who joins the electorate. This makes the system self-justifying. We cannot appeal to a neutral standard because the standard is set by those who benefit from the exclusion. The seams show because the demos protects its own composition rather than adhering to an external logic of justice. We keep the expat vote because citizens want to keep it; we deny the resident vote because non-citizens cannot vote to change it. The inconsistency is a feature, not a bug, allowing the incumbent voters to maximize their influence while minimizing dilution. Any attempt to reconcile these lines fails because those tasked are beneficiaries of the contradiction. We are asking the club members to vote on whether to let the paying guests in, while allowing absent members to retain their voting rights. The theory is not broken; it is rigged to preserve the power of those already holding the ballot.

  **Underdetermined**
  The practice is underdetermined regarding the specific age and the duration of expat voting. Why 18 and not 16? Both could fit a competence model depending on how you measure maturity. Why does Britain allow 15 years abroad while Denmark allows two? Both claim to protect the link between voter and outcome, but define "link" differently. The practice doesn't choose between a theory of permanent allegiance and one of fading connection; it simply picks a number that feels politically safe.

  Similarly, prisoner voting is underdetermined by theory. Both enfranchisement and disenfranchisement can be argued from rights-based or contract-based perspectives. The law picks a side based on cultural mood, not logical necessity. We pretend the lines are derived from first principles, but they are often just compromise points where conflicting intuitions met and stopped fighting. Even the citizenship requirement is underdetermined; administrative convenience could justify it, but so could a theory of national culture. The system works not because it is theoretically pure, but because it is stable. It leaves enough ambiguity that different groups can project their own justification onto the rules without demanding change. This lack of precision allows the coalition to hold.

  **If we swapped the theory**
  If we swapped to "All Subject to Coercion," election law would transform radically. Every adult resident would vote, regardless of passport. Prisoners would vote, as they remain subject to state power. Expats would lose their vote immediately upon leaving the coercive jurisdiction. The electorate would become a snapshot of the population present on election day. Naturalization would become irrelevant for voting purposes; presence would be the only key.

  The obvious objection is the dissolution of national community. Critics would argue this turns the state into a hotel, where transient populations decide the long-term future of a culture they might leave tomorrow. It risks divorcing decision-making from shared history or loyalty. Voters might prioritize short-term gains over long-term national health if they lack enduring ties. However, the current system risks tyranny over those with no voice. The swap prioritizes legitimacy of force over continuity of identity. It admits that democracy is about managing power, not preserving heritage. The new system would be fairer to those inside the borders, but might weaken the bonds that hold the nation together across generations. We would gain consistency at the cost of cohesion. The state becomes a jurisdiction of laws rather than a community of fate, solving the boundary problem by making it purely geographic.
