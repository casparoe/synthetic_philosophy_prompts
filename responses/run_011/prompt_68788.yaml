answer: |-
  ### Part 1: Indicator Ranking and Tiering

  **Tier 1 (Decisive)**
  *   **(1) Unfalsifiability:** Score 0.9. This is the epistemological bedrock; if a claim cannot specify what would disprove it, it operates outside empirical inquiry.
  *   **(3) Avoidance of Specialists:** Score 0.8. Legitimate revisionism seeks peer validation, whereas pseudohistory bypasses gatekeepers to appeal directly to the public.
  *   **(4) Immunization:** Score 0.8. A theory that grows stronger solely by accumulating unexplained anomalies rather than resolving them demonstrates a closed logical loop.

  **Tier 2 (Moderate)**
  *   **(2) Base Rate Neglect:** Score 0.6. While anomaly hunting is a pseudo-hallmark, legitimate discovery often begins with outliers before base rates are established.
  *   **(6) Core Stagnation:** Score 0.5. Some foundational truths remain static, while sophisticated pseudohistory can evolve rapidly to evade refutation.

  **Tier 3 (Weak)**
  *   **(5) Proponent Stake:** Score 0.3. Motivation is a poor proxy for truth; legitimate identity-based scholarship exists alongside disinterested crankery.

  ### Part 2: Counterexamples and Deletion Recommendation

  *   **(1) Unfalsifiability:** *False Positive:* Continental drift theory initially lacked a mechanism, making specific falsification difficult until plate tectonics emerged. *Failure Mode:* False Positive. *Verdict:* Keep.
  *   **(2) Base Rate Neglect:** *False Positive:* The initial decipherment of Linear B relied on treating unique inscriptions as significant before a full corpus was understood. *Failure Mode:* False Positive. *Verdict:* Keep.
  *   **(3) Avoidance of Specialists:** *False Positive:* Heinrich Schliemann operated as an outsider initially and was often at odds with established philologists. *Failure Mode:* False Positive. *Verdict:* Keep.
  *   **(4) Immunization:** *False Positive:* Complex economic historical theories (e.g., causes of the Great Depression) often absorb new data points without collapsing. *Failure Mode:* False Positive. *Verdict:* Keep.
  *   **(5) Proponent Stake:** *False Negative:* Many pseudohistorical claims (e.g., ancient aliens) are driven by profit or fame rather than ideology. *False Positive:* Post-colonial revisions (e.g., Subaltern Studies) are explicitly stake-driven but methodologically sound. *Failure Mode:* **False Positive rate exceeds True Positive rate.** *Verdict:* **Delete.**
  *   **(6) Core Stagnation:** *False Positive:* The core claim "The Holocaust occurred" has remained unchanged despite decades of denialist counter-evidence. *Failure Mode:* False Positive. *Verdict:* Keep.

  ### Part 3: Structural Questions

  **Scoring Method:** The rubric should be scored **additively**. Pseudohistory is a cluster concept; a claim may be unfalsifiable but engage specialists (rare), or have stakes but be falsifiable. A conjunctive model (requiring all indicators) would allow sophisticated pseudohistory to pass by merely satisfying one criterion (e.g., engaging specialists while lying about data), whereas an additive threshold captures the "family resemblance" of the practice.

  **Weakest Link:** Striking **Indicator (1) Unfalsifiability** would most weaken the instrument. It is the only indicator that addresses the logical structure of the claim itself rather than the behavior of the proponents or the accumulation of evidence; without it, the rubric measures sociology rather than epistemology.

  ### Part 4: Replacement Indicator

  **Proposed Indicator:** "The absence of expected corroborating evidence is explained by positing a systematic suppression or destruction for which there is no independent verification."

  **Counterexample Test:** *False Positive:* The destruction of the Maya codices by Spanish clergy is a historical fact, yet independent inventories of the lost books are sparse. *False Negative:* A pseudohistorian might blame "incompetence" rather than "suppression" for missing data. *Failure Mode:* False Positive on genuine historical erasure. *Verdict:* Keep, but curators must emphasize the "no independent verification" clause to distinguish between documented destruction (Library of Alexandria) and speculative conspiracy.

  ### Part 5: Case Study Application

  **Case 1: Vinland Sagas (Pre-1960s Reception)**
  *   **Score:** 1/5 (Indicators 1, 2, 3, 4, 6 + Replacement).
      *   (1) Falsifiable: Yes (archaeological absence). (0)
      *   (2) Base Rates: No, relied on textual analysis. (0)
      *   (3) Specialists: Yes, philologists engaged. (0)
      *   (4) Immunization: No, proponents awaited physical proof. (0)
      *   (6) Stagnation: No, interpretations evolved. (0)
      *   Replacement (Conspiracy): No, absence of evidence was attributed to lack of exploration, not suppression. (0)
      *   *Note:* Indicator (5) would have scored 1 point due to Scandinavian national interest, falsely flagging the claim.
  *   **Evaluation:** **Correct.** The rubric correctly identifies this as legitimate revisionism (a hypothesis awaiting verification) rather than pseudohistory. The deletion of Indicator (5) was critical here; retaining it would have misclassified a proven historical fact as pseudohistory due to nationalist motivation.

  **Case 2: Fomenko's New Chronology**
