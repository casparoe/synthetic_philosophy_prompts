          *   *Assessment:* This is the tricky part. Kripke *does* use rigid designation, but the argument for *Origin Essentialism* specifically usually relies on a branching argument or a distinctness argument (if $x$ comes from $m$, and $y$ comes from $n$, $x \neq y$), not *just* the necessity of identity alone. The necessity of identity explains why *if* she is that organism, she is necessarily that organism. But why is she *that* organism essentially? The student conflates "Elizabeth = Organism O" with "Organism O essentially comes from Gametes G." Kripke's argument in *Naming and Necessity* (Lecture III) is more nuanced. He argues from the intuition that if a different zygote formed, it would be a different person. The student's derivation ("Since identity is necessary... it follows that... she is that organism, and that organism developed from that pair of gametes") is a bit fast. It assumes the origin is part of the identity condition without fully arguing *why* the origin is essential to the organism, rather than just the name. However, for a 2nd year, linking rigid designation to the necessity of the origin claim is standard, though often slightly imprecise.
