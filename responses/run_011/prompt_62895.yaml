answer: |-
  Here is a complete design for the 75-minute session. It is built to be logistically tight, philosophically precise, and viscerally frustrating in the way you want.

  # Activity Title: "The Black Box Jury"

  **Goal:** Demonstrate that *Independence* is the engine of the Condorcet Jury Theorem (CJT). Without it, unanimity provides no additional epistemic weight, even if it feels identical from the inside.
  **Time:** 75 Minutes (50 min Activity, 25 min Debrief).
  **Group Size:** 24 Students.
  **Materials:**
  *   72 Envelopes (3 sets of 24).
  *   Slips of paper (Red/Blue).
  *   Whiteboard (for Truth reveal and Scorekeeping).
  *   Projector (optional, for timer/instructions).
  *   "Currency": Poker chips or just tally marks on a handout (100 points start).

  ---

  ## Part 1: The Setup (5 Minutes)

  **The Narrative:** Tell the class they are a "Decision Engine." Their goal is to maximize points. There is a hidden "State of the World" (Red or Blue) for each case. They will receive private evidence. They must vote. Then they must wager on the *Group's* accuracy.

  **The Rules:**
  1.  **Truth:** For each case, there is a correct answer (Red or Blue).
  2.  **Signal:** Inside your envelope is a slip recommending a vote. It is reliable (approx. 80% accurate), but not perfect.
  3.  **Vote:** Secret ballot. Majority rules the Group Verdict.
  4.  **Wager:** After the vote, but *before* the Truth is revealed, every student writes down a wager (0 to 10 points) on whether the **Group Verdict** is Correct.
      *   If Group is Right: You gain your wager.
      *   If Group is Wrong: You lose your wager.
  5.  **Silence:** No talking until Round 3.

  **Starting Endowment:** Everyone starts with 100 points.

  ---

  ## Part 2: The Rounds (45 Minutes)

  You will run 3 Rounds. Each Round consists of **5 rapid-fire cases**.
  *Total Votes: 15.*

  ### Round 1: The "Independent" Condition (15 Minutes)
  *   **Mechanism (Hidden):** Truth is flipped (Coin A). For *each* student, a separate coin is flipped (Coin B, 80% biased to match Truth) to determine their slip.
  *   **Prep:** You need 24 bags/envelopes per case. Or, simpler: Have 24 students stand up. You walk down the row. For Case 1, flip a master coin for Truth (e.g., Red). Then, for *each student*, flip a biased coin (e.g., d10, 1-8 = Red, 9-10 = Blue) and put that slip in their envelope.
  *   **Logistics Hack:** Pre-prep the 24 envelopes for all 5 cases beforehand. Label them "Case 1" to "Case 5".
      *   *Case 1 Truth:* Red. *Student 1 Slip:* Red (80% chance). *Student 2 Slip:* Blue (20% chance)...
      *   Ensure the errors are distributed randomly across students.
  *   **Flow:**
      1.  Open Case 1 Envelopes. Vote.
      2.  Place Wager (0-10).
      3.  Reveal Truth. Update Scores.
      4.  Collect slips. Open Case 2... Repeat 5 times.
  *   **Expected Outcome:** The Group Verdict will be correct 100% of the time (or 4/5). Errors will be scattered (different people wrong each time). Students will confidently wager 10 points every time. They will end Round 1 with ~150 points.

  ### Round 2: The "Common Cause" Condition (15 Minutes)
  *   **Mechanism (Hidden):** Truth is flipped (Coin A). **One** biased coin is flipped to determine the "Shared Evidence" (80% accurate). **Then**, for each student, a *highly* accurate coin (95%) determines if they read that Evidence correctly or flip it.
  *   **The Trap:** This creates a situation where errors are **correlated**. When the Shared Evidence is wrong, *most* students get the wrong slip.
  *   **Prep:** Pre-prep 24 envelopes for 5 cases.
      *   *Case 1 Truth:* Red. *Master Evidence:* Blue (20% chance). *Student Slips:* Mostly Blue (95% match Evidence).
      *   *Crucial:* Ensure that in at least 1 of the 5 cases, the Master Evidence is Wrong. In that case, ~20 students will vote Wrong.
  *   **Flow:** Same as Round 1. Emphasize: "Same rules, new case files."
  *   **Expected Outcome:** The Group Verdict will be correct only ~80% of the time (same as an individual).
      *   *The Kicker:* In the case where the Evidence is wrong, the vote might be 22-2 for the **Wrong** answer.
      *   **Wager Trap:** Because the vote was unanimous (or near), students will wager 10 again. They will lose 10 points on the failure cases.
      *   **Score:** They will end Round 2 stagnant or lower (~140 points). They will feel confused: "We agreed just as strongly, but we lost points."

  ### Round 3: The "Deliberation" Condition (15 Minutes)
  *   **Mechanism:** Identical to Round 2 (Common Cause).
  *   **Twist:** Allow 2 minutes of discussion before voting.
  *   **Flow:**
      1.  Open Envelopes.
      2.  **Discuss:** "What did you get?" "I got Blue." "Me too."
      3.  Vote & Wager.
  *   **Expected Outcome:** Deliberation reveals that everyone has the *same* evidence. It reinforces confidence. They will wager *higher* (if allowed) or stay at 10. They will still fail the cases where the Master Evidence was wrong.
  *   **Purpose:** This sets up the "Deliberation Objection" for the debrief.

  ---

  ## Part 3: The Reveal & Debrief (25 Minutes)

  ### 1. The Mechanism Reveal (5 mins)
  Draw the Bayesian Networks on the board.
  *   **Round 1:** $Truth \to Signal_1$, $Truth \to Signal_2$... (Independence)
  *   **Round 2 & 3:** $Truth \to Common Evidence \to Signal_1$, $Common Evidence \to Signal_2$... (Conditional Independence)
  *   **Show the Slips:** Ask for the envelopes from the specific case where the Group failed in Round 2. Show that 22/24 people had the *exact same wrong information*.

  ### 2. Mapping to Condorcet (5 mins)
  *   **Competence:** Held constant across rounds (~80%).
  *   **Independence:** Violated in Rounds 2 & 3.
  *   **The Lesson:** Unanimity in Round 1 = Convergence to Certainty. Unanimity in Round 2 = Echo Chamber. You cannot tell the difference from the inside (same vote count, same confidence), but the *risk profile* (the Wager) is totally different.

  ### 3. Handling Practical Problems (The "Cheat Sheet")

  **Problem A: Sample Size / Noise**
  *   *Risk:* With only 5 cases per round, luck might make Round 2 look perfect.
  *   *Fix:* **Rig the deck.** Ensure that in Round 2, exactly 1 out of 5 cases has the "Master Evidence" flip to the wrong state. This guarantees a Group Failure. In Round 1, ensure errors are distributed so the Majority never flips.
  *   *Say:* "We ran enough trials to see the expected value. The Wager system measures risk, not just binary success."

  **Problem B: The Saboteur (<50% Competence)**
  *   *Risk:* A student votes randomly or against their slip.
  *   *Fix:* Instructions say: "Your slip is your only evidence. Voting against it reduces your expected score."
  *   *Say:* "CJT assumes competence > 0.5. If you have a saboteur, the theorem breaks. But notice: In Round 2, even if everyone is perfectly rational and follows their slip, the theorem *still* breaks. That's the point."

  **Problem C: Reverse Engineering**
  *   *Risk:* A student notices "Hey, we all got the same slip in Round 2" and votes the opposite to be clever.
  *   *Fix:* Add "Private Noise" (the 95% read accuracy). Not everyone gets the same slip. Some will dissent even in Round 2.
  *   *Say:* "If you try to game the system by assuming correlation, you are assuming facts not in evidence. The lesson is about epistemic humility: you don't *know* the structure of the signal."

  **Problem D: The "Real Juries Deliberate" Kid**
  *   *Risk:* "This proves deliberation is bad. Real juries talk."
  *   *Fix:* Use Round 3. They talked, and they still failed the Common Cause cases.
  *   *Say:* "Deliberation shares evidence. If the evidence is already correlated (Common Cause), deliberation just broadcasts the error. It doesn't create new independent signals. To fix Round 2, you wouldn't talk; you'd need to leave the room and find *new* evidence."

  ### 4. Limitations & "What Will Go Wrong" (10 mins)

  **Be Frank About the Model:**
  1.  **Partial Overlap:** In reality, evidence isn't perfectly shared (Round 2) or perfectly independent (Round 1). It's a mesh. This activity is a "limit case" to show the mechanism, not a realistic simulation.
  2.  **Truth Handout:** We gave you the Truth every time. In real life, we never get the Truth. We only get the Wager (consequences). This is why understanding the *structure* of our agreement matters more than the agreement itself.
  3.  **Competence:** We fixed competence at 80%. In reality, hearing others' arguments changes your competence (for better or worse).

  **Predictable Failure Moment:**
  *   *Scenario:* In Round 2, Case 3, the Group votes Wrong. A student says, "But 22 of us voted Blue! How can we be wrong?"
  *   *Your Response:* "That is exactly the feeling of the Common Cause. The correlation makes you feel safe when you are actually exposed. That anxiety you feel looking at your score? That is the cost of violated independence."

  ---

  ## Logistics Checklist for You (The TA)

  1.  **Prep the Envelopes (Crucial):**
      *   **Round 1 (5 cases x 24 students):** Generate randomly. Check that Majority is Correct in all 5. If a case generates a Majority Error, re-roll that case's slips.
      *   **Round 2 (5 cases x 24 students):** Generate 1 Master Slip per case. Then copy it 24 times with ~10% noise. **Ensure Case 3 has a Wrong Master Slip.** This guarantees a Group Failure.
      *   **Round 3:** Copy Round 2 envelopes.
  2.  **Scoreboard:** Keep a running tally of the *Class Average Score* on the board.
      *   End of Round 1: Should be high (e.g., 150).
      *   End of Round 2: Should drop/stall (e.g., 140).
      *   End of Round 3: Should drop further (overconfidence).
  3.  **The "Wager" Sheet:** Print a simple grid for them.
      *   Rows: Case 1-5. Cols: Vote (R/B), Wager (0-10), Points Gained/Lost.
  4.  **Timekeeping:** Be ruthless. 3 minutes per case max. If they linger on voting, cut the discussion time in Round 3 to compensate.

  ## Why This Works
  You aren't asking them to calculate probabilities. You are making them **bet** on probabilities.
  *   In Round 1, betting on the Group is free money.
  *   In Round 2, betting on the Group is a trap.
  *   The *loss of points* is the visceral sensation of the Independence condition breaking. They will leave the room arguing about why they lost points in Round 2, which is exactly when you want the discussion to start.
