      *   Round 1: Truth $\to$ Signal (Independent).
      *   Round 2: Truth $\to$ Evidence (Common) $\to$ Signal (Independent read of Evidence).
      *   *Physical:*
          *   Round 1: Envelopes contain "Guilty" or "Innocent" directly based on Truth.
