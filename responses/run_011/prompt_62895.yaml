      *   0-5: Intro & Rules.
      *   5-20: Round 1 (Independent) - 5 cases.
      *   20-35: Round 2 (Correlated) - 5 cases.
      *   35-45: Round 3 (Deliberation/Correlated) - 5 cases.
      *   45-75: Debrief & Discussion.

