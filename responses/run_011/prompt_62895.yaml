      *   **Context:** 2nd-year Social Epistemology seminar, 24 students, 75-minute activity (before discussion).
      *   **Topic:** Condorcet Jury Theorem (CJT), specifically focusing on the *Independence* condition.
      *   **Core Insight:** CJT fails if votes are correlated via a shared common cause (evidence) rather than the truth itself. Unanimity in the shared-evidence case adds no value over a single juror.
      *   **Goal:** Make students *feel* the difference between independent signals and correlated signals, despite identical surface appearances (unanimity, confidence).
      *   **Constraints:** 3 rounds (reveal structure at end), physical setup (hide correlation), no real money (points scheme), timeline (75 mins total, activity needs to fit within a chunk of that, likely 45-50 mins to leave time for debrief), handle practical problems (sample size, bad signalers, gaming the system, deliberation objection).
      *   **Debrief:** Map activity to theorem conditions, admit limitations, predict failures.

  2.  **Deconstruct the Core Mechanism:**
      *   *Round 1 (Independent):* Truth $\to$ Private Signal $\to$ Vote. (CJT holds, accuracy increases with $N$).
      *   *Round 2 (Correlated/Shared Evidence):* Truth $\to$ Shared Evidence $\to$ Private Interpretation $\to$ Vote. (CJT fails, accuracy stays at individual level).
      *   *Round 3 (The Twist/Mixed):* Maybe a control or a variation to solidify the point. Let's stick to the prompt's request for "Roughly three rounds."
      *   *The Problem:* With $N=24$ and 1 trial per round, statistical noise makes it hard to see the difference in accuracy.
      *   *The Solution:* We need multiple *sub-trials* within each round or a mechanism that aggregates confidence/wagers to show the expected value difference, even if the binary outcome is noisy. Or, we run the "round" as a sequence of 5 quick votes using the same mechanism. Let's go with multiple mini-votes per "Round" to generate data.

  3.  **Designing the Activity ("The Signal Game"):**

