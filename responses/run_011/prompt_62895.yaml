          *   If Right: Gain Points. If Wrong: Lose Points.
          *   *Crucial:* In Round 1 (Independent), Unanimity implies high probability of truth. High wager is rational.
          *   In Round 2 (Correlated), Unanimity implies *low* probability increase (stuck at individual competence). High wager is irrational (high risk).
