  ### Design Prose: The Ergodicity Lunch

  **The Setup**
  You are running a simulation of non-ergodic processes. The room is the ensemble; the rounds are time. You need 18 engineers, a whiteboard, 18 coins (or phones with coin apps), and 200 poker chips (or printed paper tokens). The tokens cost you nothing but carry social weight: the top three holders by token count buy nothing next month; the bottom three buy the napkins and clean the tables. This creates a "career risk" simulation without financial liability.

  **The Bet**
  The odds are fixed: 60% chance to win, 40% chance to lose. The payout is 1:1 on the wagered amount (bet 10, win 10, keep your 10; or lose the 10).
  *   **Arithmetic Expectation:** Positive. Every token wagered yields 0.2 tokens in profit on average.
  *   **Geometric Reality:** If you bet 100% of your stack, a single loss ruins you (absorbing state at zero). Even betting 50% leads to slow decay over 10 rounds. The growth-optimal fraction (Kelly) is 20%.
  *   **The Trap:** Intuition screams "bet big" because the EV is positive. Experience screams "don't go bust." The tension between these is the lesson.

  **The Flow**
  You run 10 rounds. Rounds 1–5 are "Growth Phase" (maximize final stack). Round 6 introduces the "Target Phase" (must reach 500 tokens to 'exit' successfully) and allows **Pooling** (players can merge stacks and split outcomes).
  *   **Ledger:** Draw a 18x10 grid on the whiteboard. Assign three "Scribes" (volunteers who don't bet Round 1) to mark W/L for each player per round. This prevents you from getting bogged down in data entry.
  *   **Pacing:** 2 minutes per round. 30 seconds to place bets (hold up fingers for % of stack), 30 seconds to flip, 1 minute to record.
  *   **Mid-Point:** At Round 6, stop. Announce the Target. Allow pooling. Watch who pools (risk mitigation) and who goes solo (hero strategy).

  **The Debrief**
  Do not lecture immediately. Ask the winner how they did. They likely went All-In. Ask the median player (now near zero) how they did. Then reveal the math.
  *   **Ensemble vs. Time:** The "Mean" wealth of the room is high (dragged up by the lucky All-In winner). The "Median" wealth is near zero. The room *as a whole* made money (Ensemble), but the *individual* likely lost (Time).
  *   **Absorbing State:** Zero is sticky. Once you hit it, you can't recover. This breaks the standard EV formula.
  *   **Objectives:** The Kelly bettor (20%) likely finished with ~120 tokens. They "lost" the Target game but "won" the survival game. The All-In player "won" the Target game but "lost" the survival game. There is no "best" strategy, only best for *what*.
  *   **Pooling:** If players pooled in Round 6, their collective variance dropped. They moved closer to the Ensemble Average. This proves the EV was real; the individual ruin was a path problem, not a value problem.

  **The "Log-Utility" Objection**
  When someone claims Kelly is just "log utility preference," you point to the Pooling rule. If it were preference, pooling wouldn't change the mathematical outcome for the group. Pooling converts a non-ergodic process (sequential individual bets) into an ergodic one (parallel pooled bets). The fact that pooling recovers the Expected Value proves the bottleneck was the *structure of the gamble*, not the *shape of the utility curve*.
  *   **Say this:** "If this were just about preference, pooling your risk wouldn't mathematically guarantee a better outcome for the group; it would just average our feelings. The fact that pooling lets us capture the Expected Value that individuals lose to ruin proves the bottleneck is the sequence, not the utility function."

  **Failure Modes**
  1.  **The Saver:** Bets 0%, ends with 100. Beats the busted players. *Mitigation:* In Round 6, declare 100 tokens "Failure State" for the Target objective. They survived but didn't win.
  2.  **The Calculator:** Finds Kelly (20%) immediately. *Mitigation:* Ask them to be a Scribe. In debrief, use them as the "Control Group" to show what optimal growth looked like vs. the room.
  3.  **The Early Bust:** Out in Round 3. *Mitigation:* "Phoenix Rule." Once at zero, they can borrow 50 tokens for Rounds 6-10 only, repayable at 2x from final winnings. Keeps them engaged.
  4.  **The Lucky Hero:** All-In winner seen as genius. *Mitigation:* Run the probability in debrief. "You had a 7% chance to hit the target. If we ran this 100 times, you'd be broke 93 times. We don't build systems on 7%."

