      *   *Wait, constraint 4:* "The leaderboard headed by someone whose risk-taking was, on your own analysis, wrong." If someone goes All-In and wins, they have the most tokens, but their strategy was mathematically suboptimal for *growth* (high variance, high ruin risk). This fits.
      *   *Constraint 5:* Target seeking. If the target is high, you *need* to bet more than Kelly to have a reasonable shot at hitting it before the game ends (finite horizon).
      *   *Rounds:* 10 rounds fits the 60-minute window (allowing for talk time).
      *   *Endowment:* Needs to be divisible. 100 tokens is standard.

