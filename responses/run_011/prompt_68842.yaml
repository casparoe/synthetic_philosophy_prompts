      *   *Parameters:* $N=18$ players. $R=10$ rounds. $W_0 = 100$. $p=0.6$, $b=1.0$ (Double or nothing on the wagered portion).
      *   *Kelly Optimal:* $f=0.2$. Growth factor per round $G = (1+0.2)^{0.6} * (1-0.2)^{0.4} \approx 1.0204$. After 10 rounds: $100 * 1.0204^{10} \approx 122$.
