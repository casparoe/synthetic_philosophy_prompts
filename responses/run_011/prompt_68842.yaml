  Here's a thinking process that leads to the suggested design:

  1.  **Analyze the Request:**

      *   **User:** Staff Software Engineer running a monthly 60-minute lunch session for ~18 engineers.
      *   **Topic:** Decision-making, tradeoffs, specifically the distinction between ensemble average (expected value) and time average (geometric growth/Kelly criterion), absorbing states (ruin), and objective dependence (growth vs. target).
      *   **Constraints:**
          *   No slides, whiteboard only.
          *   No formal training in philosophy/economics assumed for attendees.
          *   Tokens (no real money), low cost, high felt stake.
          *   8-12 rounds.
          *   Same bet every round (stable odds).
          *   Attractive EV (all-in tempting).
          *   Must produce divergence between mean and median (most near zero, one huge winner).
          *   Mid-point objective switch (Growth vs. Target).
          *   Pooling allowed mid-game.
