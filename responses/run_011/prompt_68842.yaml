          *   **Crucial:** All numbers must be derived/simulated, not placeholders.

  2.  **Determine the Core Mechanics (The Bet):**

      *   I need a bet where $E[V] > 1$ (positive expected value) but the geometric mean growth rate is maximized at a fraction $f^* < 1$, and betting $f=1$ leads to almost certain ruin over $N$ rounds.
      *   *Standard Kelly Example:* Coin flip, win 2x, lose 1x. $p=0.5$. $EV = 0.5(2) + 0.5(-1) = 0.5$. Net payout multiple $b=2$. Kelly fraction $f^* = p - q/b = 0.5 - 0.5/2 = 0.25$.
      *   *Requirement:* "Attractive enough... that an all-in strategy is available and tempting." If I bet all-in on a 50/50 coin flip (win 2x, lose 1x), after 10 rounds, expected value is huge, but probability of survival is $(0.5)^{10} \approx 0.001$. This is good for divergence.
      *   *Refining the Odds:* To make it *more* tempting to go all-in, the win multiplier should be higher, or the probability higher. Let's stick to a simple die roll or card draw for physical ease, but the prompt implies I state the odds. Let's use a 60% win chance ($p=0.6$) with a 1.5x net payout (get stake back + 1.5x profit? Or total return 2.5x? Let's clarify standard notation).
      *   *Notation:* "Net payout multiple on win". If I bet 10, and win, do I get 10 + 10*b? Or just 10*b total? Standard Kelly notation: Wealth $W_{new} = W_{old} * (1 + f*b)$ on win, $W_{old} * (1 - f)$ on loss.
      *   Let's choose: $p = 0.6$ (60% chance to win). $b = 1.0$ (Even money bet, win 1 unit per 1 unit wagered).
          *   $EV = 0.6(1) + 0.4(-1) = 0.2$ per unit wagered. Positive.
          *   Kelly Fraction $f^* = p - q/b = 0.6 - 0.4/1 = 0.2$. (Bet 20%).
