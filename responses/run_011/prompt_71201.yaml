answer: |-
  The room was the color of unbleached linen, soundproofed with a foam that swallowed the hum of the air conditioning. In the center, two chairs faced each other, separated by a low table holding a single glass pitcher of water and two empty tumblers. Between the chairs sat the rig. It looked less like a machine and more like a sculpture of polished chrome and matte black plastic, a halo suspended on an articulated arm that could dip down to rest lightly on the temples of whoever sat beneath it.

  Elias sat in the left chair. Mara sat in the right. They had not touched since arriving forty minutes ago.

  Kline, the mediator, stood by the wall console. He was wearing the firm's grey suit, the fabric seamless, no pockets. He tapped the screen. "Session four-zero-nine. Dispute classification: Property Damage and Negligence. Subject: The fire at 44 Oakhaven. Goal: Consensus on causality for insurance and closure."

  "Closure," Mara said. The word sounded like it had broken a tooth on the way out.

  "Consensus," Elias corrected. He kept his eyes on the table. "The insurance requires consensus."

  "The rig requires truth," Kline said softly. "The insurance just requires a signature."

  He lowered the halo. It split into two rings, descending simultaneously to rest on Elias and Mara. There was a click, a soft pressure against the skin, and then the room's lighting shifted. The walls became screens. Numbers began to scroll in the periphery of their vision, projected onto the linen foam.

  Elias saw a percentage floating above Mara's head: **92%**.
  Mara saw a percentage floating above Elias's head: **95%**.

  Below the numbers, a tower of smaller digits cascaded downward. *I believe that you believe that I believe…* The rig didn't read thoughts. It read confidence. It mapped the architecture of certainty. If Elias believed the fire was an electrical fault with 95% confidence, and he knew Mara believed it was arson with 92% confidence, the machine laid that conflict bare. Then it did the work. It forced the common knowledge. It showed Elias that Mara knew his confidence, and showed Mara that Elias knew hers.

  In a rational system, the numbers should have begun to move immediately. If two people know each other's certainty, and they trust each other's rationality, the gap must close. One must yield. The truth is a gravity well; eventually, you fall into the same orbit.

  "Start," Kline said.

  Elias took a breath. "It was the wiring, Mara. The inspector said the junction box was pre-war. It was going to happen."

  **95%** hovered over him. Steady.

  Mara looked at him. Her eyes were dry, red-rimmed. "You were smoking on the deck. You dropped it. You fell asleep."

  **92%** hovered over her.

  The numbers on the wall flickered. The rig was processing the exchange. It was calculating the update. Elias should have seen Mara's certainty and thought, *She knows me. She knows my habits. Why is she so sure?* His confidence should have dipped. **95%** to **90%**. Then Mara should have seen his dip and thought, *He doubts himself. Maybe he doesn't know.* Her confidence should have dipped. **92%** to **88%**.

  They should have spiraled toward a meeting point. **51%**. **50%**. Agreement.

  The numbers didn't move.

  **95%**. **92%**.

  Kline frowned at his console. "System is flagging a stall. Update resistance detected."

  "I'm updating," Elias said. "I'm listening to her."

  "You're hearing her," Kline said. "You aren't integrating."

  Mara laughed, a short, sharp sound. "He won't integrate. He never does."

  "If I admit I dropped it," Elias said, his voice rising, "then I killed everything. The house. The dog. Our life. If it was the wiring, it was just… time. It was entropy."

  "And if it was you," Mara said, "then it was a mistake. Mistakes can be forgiven. Entropy can't."

  The numbers jerked. Mara's dropped to **85%**. Then snapped back to **92%**.

  She was doing it manually. She was forcing her confidence back up.

  Kline stepped forward. "Ms. Vance, the rig is detecting a manual override on your cognitive feedback loop. You are rejecting the update."

  "I'm correcting for bias," she said.

  "You are refusing to converge," Kline said. "If you know he believes he is innocent, and you trust his access to his own memory, your certainty regarding his guilt must decrease. Unless you believe he is lying."

  "I do believe he is lying," Mara said.

  "To himself or to you?"

  "To himself."

  Elias shook his head. The halo shimmered. "I'm not lying. I remember the cigarette. I remember putting it out. I remember the smell of ozone before the flames."

  "You remember what you need to remember to sleep," Mara said.

  The wall behind them flashed red. **CONVERGENCE FAILED**.

  It was the escape hatch. The theorem assumed rational agents updating on information. It assumed they wanted the truth more than they wanted their own narrative. But the rig couldn't force the will to update. It could only show the cost of refusing.

  Elias looked at the number above Mara's head. **92%**. She was certain. She needed to be certain. If she wasn't certain he was negligent, then she was just a woman who lost her home to bad luck. If he was negligent, she was a victim. She could hate him. Hate was a structure. It held weight. Grief was just a hole.

  "If we don't agree," Elias said, "the insurance doesn't pay. We lose the claim."

  "Then we lose the money," Mara said.

  "It's two hundred thousand dollars."

  "It's the price of knowing you didn't care enough to wake up."

  Kline sighed, tapping his console. "This happens. Not often. Usually, the pressure of the common knowledge breaks the resistance. When you see that the other person knows your certainty, the dissonance becomes painful. You align to stop the pain."

  "There is no pain," Mara lied.

  Her number flickered again. **92%** to **80%**. Then back to **92%**.

  She was fighting the machine. She was fighting the math of human connection. She was holding onto her anger like a railing on a sinking ship.

  Elias looked at his hands. He remembered the deck. He remembered the wind. He remembered the cigarette. He didn't remember putting it out. There was a gap there. A five-second gap where the memory went dark. He had filled it with the image of his hand crushing the ember. But was it a memory, or was it a patch?

  If he updated, if he let his confidence drop to **50%**, he would have to live with the possibility. The possibility was heavier than the certainty.

  "I can't," Elias whispered.

  "Can't what?" Kline asked.

  "Can't let go. If I say I might have done it… I can't look at her."

  "And if you say you didn't," Mara said, "I can't look at you either."

  The room was silent except for the low thrum of the rig. It was trying to find a path, running simulations, looking for a compromise belief state. **70% Negligence. 30% Fault.** But belief isn't a commodity you can split. You can't believe something is partly true in a way that satisfies a machine designed for binary convergence.

  Kline walked around the table. He looked tired. "We had markets like this, once," he said, mostly to himself. "Before the rigs. People would bet on outcomes. Stocks, sports, elections. You needed someone to think the value was high and someone to think it was low for a trade to happen. Now everything clears instantly. Prices stabilize. Nobody buys anything unless they know exactly what it's worth."

  He looked at the frozen numbers on the wall. **95%**. **92%**.

  "Nobody hedges anymore," Kline said. "Nobody takes a risk on a person. It's inefficient."

  Mara stood up. The halo lifted with her, dangling like a broken necklace. "I'm not inefficient. I'm accurate."

  "You're stalled," Kline said. "The session is terminated. No consensus recorded."

  "So what happens?" Elias asked. He didn't look up.

  "Litigation," Kline said. "Or walk away. The firm can't force agreement. We only provide the mirror."

  Mara walked to the door. She stopped with her hand on the latch. She didn't turn around. "I don't want your money, Elias. I just wanted you to say you were sorry."

  "I am sorry," Elias said. "I'm sorry about the house."

  "Not the house."

  She opened the door. The sound of the outside world rushed in—traffic, voices, the noise of a city that had solved most of its arguments in soundproof rooms just like this one.

  "I wanted you to know that you broke it," she said. "Because if you broke it, you can fix it. If it just… broke… then we're just people things happen to."

  She left. The door clicked shut.

  Elias sat in the chair. The halo hovered above him, waiting for a head to rest beneath it. The numbers on the wall faded slowly, dimming from red to grey, then to black.

  Kline began to pack the console into its case. "You can stay as long as you need. But the rig powers down in five minutes."

  Elias reached out and touched the table. The wood was cool. He looked at the empty glass where Mara had sat. There was a smear of lipstick on the rim, faint pink against the clear crystal.

  He picked up the pen Kline had left on the table. It was heavy, silver, capped. He uncapped it. He hovered it over the settlement form, over the line that said *Cause of Loss: Undetermined*.

  He looked at the halo. It was dark now, the lights dead.

  "If I sign this," Elias said.

  "Then it's over," Kline said.

  "She needs me to be the villain."

  "And you need to be the victim."

  Elias capped the pen. The click was loud in the quiet room. He set it down next to the form. He didn't sign. He just sat there, watching the dust motes dance in the light where the numbers had been, two distinct columns that never touched.
