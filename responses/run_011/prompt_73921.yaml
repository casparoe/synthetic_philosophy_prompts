answer: |-
  Dear Colleague

  It is a pleasure to correspond with someone who finds the same itch in the back of the mind that I suspect many of us in the quantitative sciences feel but rarely scratch. You are quite right to be unsettled by the terminology collision first; it is an unfortunate historical accident that Rosenbaum and Rubin chose the word propensity for the conditional probability of treatment given covariates. In your daily work, that quantity is a balancing score, a tool for constructing exchangeability between treated and untreated groups within strata of confounders. It is explicitly a conditional probability defined over a population, estimable via logistic regression or machine learning, and diagnostic via standardised differences. The philosophers' propensity, stemming largely from Popper, is something altogether more metaphysical. It is conceived as a physical disposition inherent in a single setup to produce an outcome with a certain long-run frequency, were that setup to be repeated indefinitely. When you tell a patient their risk is twelve per cent, you are not speaking of their physical disposition in the Popperian sense, nor are you speaking of your propensity score. You are speaking a language that requires translation to reveal what ontological commitments, if any, are hiding inside your confidence intervals.

  Let us attempt this translation, starting with the frequentist interpretation, as it is the native tongue of most epidemiology. Here, probability is defined as the limit of relative frequency in a long run of repeated trials. To restate this in your vocabulary, the twelve per cent risk is an estimand defined over a reference class. The patient in front of you is treated as a random draw from a hypothetical infinite cohort of individuals who are exchangeable with them conditional on the measured covariates. The probability is the incidence rate in that hypothetical cohort. The work is being done entirely by the assumption of exchangeability. You are asserting that there is no unmeasured confounding between the patient's membership in this reference class and the outcome, such that the average effect in the class applies to the individual. This translation comes across cleanly in terms of operation; you know how to estimate this, you know how to check the balance, and you know how to define the target population. However, the residue here is significant. The frequentist interpretation strictly denies probability to single cases. By saying the risk is twelve per cent, you are technically saying nothing about this specific patient other than that they belong to a group where twelve per cent fail. The moment you apply it to the individual for clinical decision-making, you are smuggling in an assumption that the individual risk equals the group risk. This is where exchangeability is asked to carry too much weight. It is an identifiability assumption that allows you to map group statistics to individual predictions, but it does not ontologically ground the probability in the individual's body. It resolves the single-case problem by denying its relevance, which is pragmatically successful but philosophically evasive.

  Now consider the subjective interpretation, often associated with Bayesian epistemology. Here, probability is a coherent degree of belief. In your vocabulary, the twelve per cent is the posterior predictive probability derived from your model and data. It quantifies your uncertainty about the outcome given the evidence, not a physical property of the patient. This maps very neatly onto statistical practice when you treat parameters as random variables. You mentioned that you would rather argue with the equation than with yourself, which suggests an objectivist leaning, but in this framework, the equation simply encodes the collective belief of the scientific community updated by the data. The residue here is less about identifiability and more about utility. If the probability is purely subjective, then two clinicians with different priors could legitimately assign different risks to the same patient. While calibration ensures that your beliefs match observed frequencies over many cases, it does not guarantee that the specific number twelve has any meaning for this specific patient beyond your own willingness to bet on it. This interpretation translates cleanly into the mathematics of updating distributions, but it clashes with the realist intuition that the risk is something out there in the world, discovered by the equation rather than constituted by it. It makes the risk a property of the observer's state of knowledge rather than the patient's state of health.

  The third interpretation, physical propensity, is the one that troubles you most, and rightly so. To translate this into causal inference language, one must move from potential outcomes to structural causal models. Here, the twelve per cent is a parameter of the structural equation governing the outcome. Imagine the patient's biology is defined by a function $Y = f(X, L, U)$, where $U$ represents all unmeasured biological factors. The propensity is the distribution of $U$ for this specific individual. It is a single-case tendency. Unlike the frequentist view, this does not require a reference class; the probability is inherent to the unit. However, this is where the translation breaks down completely against standard practice. You cannot estimate a single-case distribution of error terms from data on other people. You can assume homogeneity of variance or distributional shapes across units, but that assumption returns you to the frequentist reference class. There is no estimand in standard epidemiology that corresponds to a single-case physical propensity. You cannot measure it, you cannot verify it, and you cannot distinguish it from a frequentist probability without making metaphysical claims about the nature of causation that your data cannot support. This interpretation has no expression in causal-inference language because causal inference is concerned with identifying parameters from data, and single-case propensities are, by definition, not identifiable from single outcomes.

  This brings us to the residue report you requested. The frequentist claim came across cleanly regarding estimation but required bending the concept of the individual into a member of a class. The subjective claim came across cleanly regarding mathematics but required bending the concept of risk into a state of mind. The propensity claim simply has no expression; it is a metaphysical posit that your framework treats as a nuisance parameter or averages over. You suspected exchangeability was smuggling something, and you are correct. Exchangeability is the bridge that allows you to walk from the group to the individual without admitting you are crossing a metaphysical chasm. It assumes that what is true for the cohort is true for the unit, which is practically necessary but ontologically unsupported by the data alone. As for whose problem this is, I suspect it is largely the philosophers'. The three-way disagreement collapses once you insist on saying what would be estimated. If you cannot write down an estimand, you are not doing science, you are doing metaphysics. Your vocabulary is not missing something the world has; rather, the philosophical interpretations are trying to describe features of the world that are irrelevant to the task of intervention and prediction. The world may have propensities, but if they do not manifest as identifiable parameters in a structural model, they are invisible to epidemiology.

  Regarding Humphreys' paradox, this is a fascinating point to fold in because it touches the core of why you use DAGs. The paradox states that if propensities are real single-case tendencies directed from cause to effect, they cannot be inverted, whereas conditional probabilities can be inverted via Bayes' theorem without complaint. In your world, inversion is routine, but you know that $P(Y|X)$ is not the same as $P(X|Y)$, and more importantly, $P(Y|do(X))$ is not the same as $P(X|do(Y))$. The asymmetry Humphreys identifies is not a symptom of muddled talk; it is a discovery about the world that your DAGs encode explicitly. A propensity, in the philosophical sense, aligns with the structural direction of the arrows in your graph. It is a property of the mechanism generating $Y$ given $X$, not the mechanism generating $X$ given $Y$. When you invert the probability using Bayes' theorem, you are calculating a degree of belief or a frequency ratio, not a causal tendency. You are moving from the effect back to the cause inferentially, not causally. The paradox arises only if one conflates the probability calculus with the causal structure. In your vocabulary, the asymmetry is preserved by the distinction between observational conditionals and interventional distributions. The propensity talk is muddled only if it claims to be a probability calculus that obeys Bayes' theorem in both directions while maintaining causal directionality. If one views propensities as structural parameters, the asymmetry is feature, not a bug. It confirms that causal inference requires more than probability theory; it requires assumptions about the direction of information flow, which is exactly what your DAGs provide.

  So, where does this leave you when you speak to your patient? You are speaking a shorthand for a frequentist estimand conditional on exchangeability, with a pragmatic overlay of decision theory. You are telling them that among people sufficiently similar to them, twelve per cent experience the event. You are not telling them that their body contains a twelve per cent chance particle, nor are you merely expressing your personal worry. The residue is the gap between the group statistic and the individual fate, a gap that no amount of philosophical refinement can close without new data or new assumptions. The philosophers' disagreement is less substantive than it looks because it dissolves under the demand for identifiability. Your vocabulary is sufficient for the science, provided you remain scrupulous about not reifying the estimand into a physical property of the single case. The discomfort you feel is the friction of doing rigorous science in a world that demands singular answers, and it is a sign of intellectual honesty rather than a failure of your training. You are right to keep the concepts distinct, and you are right to trust the DAG over the metaphysics.

  Yours sincerely

  A Fellow Traveller in Causal Land
