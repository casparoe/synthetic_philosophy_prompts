answer: |-
  Here is the sorting instrument. It is designed for people who sign off on data, not abstract propositions. The language is restricted to actions and operational assumptions.

  ### The Instrument: Ten Scenarios

  **Instructions:** For each scenario, select the single option that matches what you would actually do in the lab or workplace. Do not select what you *ought* to do; select what you *would* do.

  **1. The New Technician**
  A technician you haven't worked with before tells you the furnace has reached the target temperature.
  *   (A) Walk over and check the gauge yourself before loading the sample.
  *   (B) Load the sample, but watch the first heating cycle closely.
  *   (C) Load the sample immediately; they are paid to monitor the furnace.

  **2. The Calibration Certificate**
  A new tensile tester arrives with a calibration certificate from the manufacturer.
  *   (A) Send a standard sample to a third-party lab to confirm the numbers.
  *   (B) Run a few internal standards; if they pass, file the certificate.
  *   (C) Put the machine into service; the certificate is the warranty.

  **3. The Dead Postdoc's Notebook**
  You find a notebook from a postdoc who died suddenly. It claims a new alloy formula works.
  *   (A) Replicate every step from scratch before citing the formula.
  *   (B) Try the final synthesis step; if it works, assume the prep was correct.
  *   (C) Publish the formula with a citation; the notebook is the record.

  **4. The Senior PI's Comment**
  Your Principal Investigator says, "Skip the annealing step, it's fine for this batch."
  *   (A) Ask to see the data that supports skipping the step.
  *   (B) Skip the step, but examine the grain structure in the final product.
  *   (C) Skip the step; they sign off on the quality, not you.

  **5. The External Consultant**
  An outside consultant says the failure was caused by stress corrosion.
  *   (A) Demand the raw data logs and run your own analysis.
  *   (B) Accept the cause, but test the specific alloy batch they flagged.
  *   (C) Accept the cause; they were hired to find the truth.

  **6. The Automated Readout**
  The spectrometer prints a result that contradicts your hypothesis.
  *   (A) Run the system check and re-calibrate immediately.
  *   (B) Run the sample again tomorrow; instruments drift.
  *   (C) Accept the result; the machine reports what it measures.

  **7. The Night Shift Logbook**
  The night shift logbook says "No anomalies" for a 12-hour run.
  *   (A) Scan the raw sensor logs yourself to confirm.
  *   (B) Sign off on the shift; the system relies on their watch.
  *   (C) Sign off; they would have called if something were wrong.

  **8. The Conflicting Report**
  Two colleagues give you different hardness values for the same sample.
  *   (A) Measure the hardness yourself.
  *   (B) Ask a third colleague to measure it.
  *   (C) Tell them to resolve the discrepancy between them.

  **9. The Verbal Handover**
  A colleague hands you a sample jar and says, "This is the treated one."
  *   (A) Check the tag against the digital log.
  *   (B) Label it "Treated (Unverified)" and use it for trials only.
  *   (C) Treat it as treated; they handed it to *you*.

  **10. The Safety Vendor**
  A chemical vendor says a solvent is safe to use without a fume hood.
  *   (A) Check the MSDS independently.
  *   (B) Use the hood anyway, just in case.
  *   (C) Trust their assessment; they know the chemistry better than you.

  ***

  ### Scoring Key

  Tally your responses. The patterns below map to the four leaves. Note the "Boundary" instruction for Local Reductionism.

  **Leaf 1: Check-Everyone-Always (Global Reductionism)**
  *   **Pattern:** You selected **(A)** in 8 or more cases, including Cases 1, 4, and 7.
  *   **The Boundary:** N/A (You verify everywhere).
  *   **Awkward Commitment:** You have signed up for a workflow that is theoretically secure but practically paralyzing; you must assume every colleague is a potential source of error until proven otherwise, which undermines the division of labor essential to science.

  **Leaf 2: Local Reductionism (Trust with Monitoring)**
  *   **Pattern:** You selected **(A)** for "Outsiders" (Cases 2, 3, 5, 10) but **(B)** or **(C)** for "Insiders" (Cases 1, 4, 7, 9).
  *   **The Boundary:** Look at where you switched from (A) to (B).
      *   If you switched at Case 1 & 4: Your boundary is **Hierarchy/Role**.
      *   If you switched at Case 7 & 9: Your boundary is **System/Procedure**.
      *   If you trusted Case 5 but verified Case 1: Your boundary is **Competence/Reputation**.
  *   **Awkward Commitment:** You have signed up for vulnerability at the border; anyone who successfully mimics an "Insider" (or crosses your boundary) gains automatic access to your acceptance without earning it.

  **Leaf 3: Reid-Style Credulity (Default Trust)**
  *   **Pattern:** You selected **(C)** in 6 or more cases, and only selected **(A)** or **(B)** when there was a direct conflict or anomaly (Cases 6, 8, 10).
  *   **The Boundary:** N/A (Trust is default; verification requires a specific "defeater" like a conflict).
  *   **Awkward Commitment:** You have signed up for gullibility in the face of smooth confidence; you treat a confident lie as having the same initial weight as a truthful report, relying on the lie to eventually contradict itself.

  **Leaf 4: The Address-Based View (Assurance)**
  *   **Pattern:** You selected **(C)** specifically in Cases 4, 5, and 9 (Direct Address), but **(A)** or **(B)** in Cases 2, 3, and 6 (Non-Person/Instrument).
  *   **The Boundary:** Your trust turns on **Direct Accountability**. If a person assumes responsibility (Cases 4, 5, 9), you accept. If it is a document or machine (Cases 2, 3, 6), you verify.
  *   **Awkward Commitment:** You have signed up for a dependency on social norms; if a speaker treats their statement as a mere "opinion" rather than an assurance, you lose your reason to accept it, even if the evidence is strong.

  ***

  ### Honesty Requirement 1: The Non-Person Witnesses

  **The Cases:** Case 2 (Calibration Certificate) and Case 3 (Dead Postdoc's Notebook).

  **Do they belong on the tree?**
  Strictly speaking, **no**.
  **Criterion for Exclusion:** Testimony, in the philosophical sense relevant to Hume and Reid, requires a *communicative act* between a speaker and a hearer. It involves an invitation to trust.
  *   A **Calibration Certificate** is a trace of a process, not an act of communication directed at you. It is closer to physical evidence (like a fossil) than testimony.
  *   A **Dead Postdoc's Notebook** was likely written for personal record, not for your uptake. There is no living agent to hold responsible for the claim.

  **Why include them anyway?**
  In scientific practice, engineers treat documents and records *as* testimony. We sign off on them based on the authority of the issuer. Excluding them makes the tree useless for your reading group, who live in a world of data logs and certificates. However, if a participant scores "Address-Based" based on these cases, their score is invalid, because those cases cannot support an address-based view (there is no addresser).

  ***

  ### Honesty Requirement 2: Indistinguishable Leaves

  **The Pair:** **Local Reductionism** and **The Address-Based View**.

  **Why they can't be separated here:**
  In a working lab, "I trust him because he is a competent member of my team" (Local Reductionism) and "I trust him because he assured me he did the work" (Address-Based) result in the exact same action: **Sign off.**
  Your group members will answer based on *habit*, not on their underlying philosophical reason for the habit. A Local Reductionist and an Address-Theorist will both pick (C) on Case 9 (Verbal Handover). The tree records the behavior, not the reason for the behavior.

  **The Case Needed to Pull Them Apart:**
  You would need a case where **Competence** and **Address** come apart.
  *   *The Scenario:* A highly competent senior engineer hands you data but says, "I'm just reading these numbers off the screen, don't take my word for it." (High Competence, Low Address/Assurance).
  *   *The Contrast:* A junior technician hands you data and says, "I guarantee this is correct; I'll sign the liability form." (Lower Competence, High Address/Assurance).
  *   *The Split:* The Local Reductionist trusts the Senior (Competence). The Address-Theorist trusts the Junior (Assurance).
  *   *Current Status:* This nuance is absent from the 10 cases above. If a member lands on Leaf 2 or Leaf 4, tell them they are behaviorally identical for now, and assign them that specific scenario for next month.

  ***

  ### Final Note for the Moderator
  If a member selects a pattern that doesn't fit these four leaves (e.g., they verify Instruments but trust Outsiders), tell them they hold an **Unstable Position**.
  *   **Is it incoherent?** No.
  *   **Is it unattractive?** Yes. It implies they trust strangers more than their own tools. This is usually a scoring error, but if they insist, they are prioritizing social authority over physical reality—a risky stance in materials science.
