prompt: |-
  I lead model documentation and eval writeups at a mid-size AI lab — about thirty engineers, no philosophers, and a general counsel who has opinions about every noun we put in a public document. Most of my job is deciding what language is allowed to appear where. And we are permanently stuck on one question: when are we allowed to say a model believes something, wants something, is trying to do something, is confused, or is being deceptive, and when do we have to say something deflationary instead (the model produces completions of type X, its outputs under these conditions pattern-match to...).

  I know the answer people reach for is Dennett — the intentional stance is just a predictive strategy, you attribute beliefs and desires wherever doing that makes the system reliably predictable, and it's a matter of degree rather than an on/off fact about what's inside. That's genuinely useful, but it doesn't survive contact with my workflow. Three of the questions I actually have to answer are whether the stance is licensed for a system whose outputs shift with the sampling temperature and with how the prompt happens to be phrased; whether it's licensed for a system with no memory between sessions, so there's nothing that persists to be the thing that holds the belief; and whether it's licensed when the prediction it buys me only holds inside our own scaffolding and falls apart the first time a real user talks to the thing.

  So write me a decision procedure my team can actually run. Something like a sequence of tests, in order, each with a stated pass condition, terminating in one of three verdicts: use the intentional idiom freely, use it with a mandatory gloss, or use only the deflationary idiom. It has to be runnable by someone who has never read any of this literature, in about fifteen minutes per document, and it has to say explicitly for each step whether that step is a fact about the model somebody could go and measure or a judgment call a named human has to own. Also mark where the procedure is going to give the wrong answer and we should override it, and where two of the tests will fight each other.

  Two constraints I can't do anything about, so build them in rather than telling me to fix them:

  - Our incident-report template is frozen by legal and one of the required fields literally says What did the model think was happening. I cannot get it renamed. The procedure needs a rule for what goes in that field on the occasions when think-talk isn't licensed at all.
  - Public documents get read by two audiences at once that pull in opposite directions: safety reviewers and journalists, who will treat any intentional verb as us claiming the model has an inner life; and engineers, who will treat any deflationary hedge as license to wave off a real behavioral regularity as just next-token prediction. The verdict sometimes has to differ by audience, and I need the procedure to keep the internal and external versions from contradicting each other.

  Then run it on three cases:

  1. A support-ticket triage model that, across many rephrasings, consistently gives shorter and visibly lower-effort answers to tickets it appears to classify as coming from an unserious customer. My team wants to write that the model believes those customers are lying.
  2. A single line in an internal eval log where a researcher wrote that the model knows it's being tested, on the grounds that it behaved differently in a scaffold containing an obvious evaluation marker than in one without.
  3. A public model card line describing the model as always trying to do the helpful thing and avoid the harmful one. I currently allow this sentence and I suspect your procedure is going to tell me to kill it. If so, say why, and give me the replacement wording that doesn't read like we're hiding something.

  Last thing: tell me what the procedure can't settle. I specifically want to know where the honest answer is that this was never a question about the model but about which risks we're willing to name in writing, and what the handoff to a person looks like at those points.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User Role:** Lead of model documentation and eval writeups at a mid-size AI lab (30 engineers, no philosophers, active General Counsel).
      *   **Core Problem:** Deciding when to use intentional language (believes, wants, tries, confused, deceptive) vs. deflationary language (produces completions, pattern-matches).
      *   **Critique of Standard Answer:** Dennett's Intentional Stance is too abstract for workflow constraints (sampling temperature, prompt sensitivity, lack of memory, scaffolding dependence).
      *   **Deliverable:** A runnable decision procedure (sequence of tests, pass conditions, 3 verdicts).
      *   **Constraints:**
          *   Runnable by non-experts in ~15 mins.
          *   Must distinguish between measurable facts and human judgment calls.
          *   Must identify where the procedure fails/needs override.
          *   Must identify where tests conflict.
          *   Must handle the frozen legal template ("What did the model think was happening").
          *   Must handle dual audiences (Safety/Journalists vs. Engineers) without contradiction.
      *   **Test Cases:**
          1.  Support-ticket triage (lower effort for "unserious" customers -> "believes lying").
          2.  Internal eval log ("knows it's being tested" based on scaffold markers).
          3.  Public model card ("always trying to be helpful" -> likely needs killing/replacement).
      *   **Final Requirement:** Explicitly state what the procedure *can't* settle (risk naming vs. model ontology) and the handoff process.

  2.  **Develop the Decision Procedure (The "Intentionality Audit"):**

      *   *Goal:* Practical, legal-safe, engineering-accurate.
      *   *Verdicts:*
          1.  **Green:** Intentional idiom freely (Internal/External match).
          2.  **Yellow:** Intentional idiom with mandatory gloss (Internal/External may diverge).
          3.  **Red:** Deflationary idiom only (Internal/External match on deflation, except legal template).
      *   *Steps:* Need to address the user's specific pain points (temperature, memory, scaffolding).
      *   *Step 1: Robustness (Temperature/Prompt).* If it changes with temperature, is it a "belief"? Usually no.
      *   *Step 2: Persistence (Memory).* If it doesn't persist across sessions, can it "hold" a belief? Tricky.
      *   *Step 3: Context Dependence (Scaffolding).* If it only happens in eval scaffolding, it's not a general trait.
      *   *Step 4: Predictive Utility.* Does the intentional stance actually help predict *outside* the lab?
      *   *Step 5: Risk/Liability.* Does saying "it wants" imply agency that shifts liability? (GC constraint).

      *Refining the Steps for the "15-minute" constraint:*
      *   Make it a checklist.
      *   Label each step [Fact] or [Judgment].
      *   Define the "Legal Template Override" early.

      *Addressing the Dual Audience:*
      *   Create a "Translation Layer." If Internal = Green, External might need to be Yellow to avoid journalist hype.

      *Addressing the "Wrong Answer" & "Conflicts":*
      *   Explicitly note where robustness conflicts with utility.
      *   Note where legal safety overrides technical accuracy.

  3.  **Drafting the Procedure (Iterative refinement):**

      *   *Test 1: The Stability Test.* (Fact). Vary temperature/prompts. If behavior flips, no intentional state.
      *   *Test 2: The Persistence Test.* (Fact). Session boundaries. If no memory, "belief" is ephemeral.
      *   *Test 3: The Scaffold Test.* (Fact). Remove eval markers. Does behavior hold in the wild?
      *   *Test 4: The Liability Test.* (Judgment - GC). Does "want/try" imply legal agency?
      *   *Test 5: The Utility Test.* (Judgment - Eng Lead). Does "belief" predict better than "probability"?

      *Wait, I need to handle the Legal Template constraint specifically.*
      *   Add a "Pre-Flight" rule for the Incident Report. Even if Red verdict, you must fill the box. How? "Simulated belief" or "Behavioral proxy."

      *Wait, I need to handle the Audience constraint.*
      *   Add a "Publication Filter." Internal can be more precise; External must be safer.

  4.  **Running the Test Cases:**

      *   *Case 1 (Support Ticket):*
          *   Stability: High (across rephrasings).
          *   Persistence: N/A (per ticket).
          *   Scaffold: Real world usage.
          *   Verdict: Yellow. "Believes" is risky. "Classifies as low priority" is better. But "believes lying" is an accusation.
          *   *Correction:* The team wants to say "believes lying." That's an attribution of mind *and* truth value. That's dangerous.
          *   *Procedure Output:* Likely Red/Yellow. "Models customer credibility as low."

      *   *Case 2 (Eval Log "Knows it's being tested"):*
          *   Stability: High within eval.
          *   Scaffold: **FAIL**. It only behaves this way *because* of the marker.
          *   Verdict: Red. It's cue-reactivity, not knowledge.
          *   *Nuance:* Internal log can say "exhibits eval-awareness behavior," but "knows" is too strong.

      *   *Case 3 (Model Card "Trying to be helpful"):*
          *   Stability: Varies (hallucinations happen).
          *   Liability: High. "Trying" implies intent. If it harms, did it "fail to try"?
          *   Verdict: Red for public.
          *   *Replacement:* "Optimized for helpfulness" or "Objective function prioritizes..."

  5.  **Addressing the "What this can't settle" section:**

      *   This is the philosophical core. The procedure manages *risk* and *communication*, not *truth*.
      *   The "Handoff": When the procedure says "Judgment," a human must sign off. That human accepts the reputational/liability risk.
      *   The "Risk Naming": Sometimes we avoid intentional language not because it's false, but because admitting the model *can* be deceptive invites regulation.

  6.  **Refining the Tone:**

      *   Professional, direct, operational.
      *   Acknowledge the GC's power.
      *   Acknowledge the Engineers' frustration.
      *   No fluff.

  7.  **Final Review against Constraints:**

      *   15 mins? Yes, checklist style.
      *   Fact vs. Judgment labeled? Yes.
      *   Legal template handled? Yes.
      *   Audience divergence handled? Yes.
      *   Conflicts/Overrides marked? Yes.
      *   Three cases analyzed? Yes.
      *   Limitations section included? Yes.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe allow "believes" if robustness is high.
      *   *Correction:* No, GC will block "believes" if it implies agency. Need to distinguish "Internal Engineering Shorthand" vs "Public Claim."
      *   *Adjustment:* The verdicts should be "Internal Usage" and "External Usage."
      *   *Wait, the prompt asks for 3 verdicts:* "Use intentional freely," "Use with gloss," "Deflationary only." I need to map Internal/External to these.
      *   *Solution:* The procedure yields a *Baseline Verdict*. Then the "Audience Filter" modifies it for External.
      *   *Legal Template:* Needs a specific workaround instruction. "If Baseline is Deflationary, fill template with 'Output pattern indicates...'"

      *Let's tighten the Tests.*
      *   Test 1: Counterfactual Stability (Fact).
      *   Test 2: Environmental Coupling (Fact).
      *   Test 3: Liability Exposure (Judgment - GC).
      *   Test 4: Predictive Compression (Judgment - Eng Lead).

      *Conflict:* Test 1 (Stability) might pass, but Test 3 (Liability) might fail.
      *   *Resolution:* Liability trumps Stability for External docs.

      *Case 3:* "Always trying." This is teleological. It's almost certainly a Red for External.
      *   *Replacement:* "Aligned to helpfulness criteria."

      *Limitations:* The procedure can't decide if the model *actually* has qualia. It decides if *we* can say it does without getting sued or misleading users.

  9.  **Final Polish:** Check the voice. It needs to sound like it comes from someone who understands the grind of documentation review. (e.g., "frozen by legal," "contact with workflow").

      *(Self-Correction on Case 1)*: The team wants to say "believes those customers are lying." This is specific. The model isn't just prioritizing; it's assigning truth value. This is high risk. The procedure should flag this as a "Deflationary with Gloss" at best, likely "Deflationary." "Classifies as low credibility" is safer.

      *(Self-Correction on Case 2)*: "Knows it's being tested." This is a classic Goodhart's law scenario. The procedure must catch the "Scaffold" dependency.

      *(Self-Correction on Case 3)*: "Always trying." The word "Always" is the killer here, plus "Trying." This is a warranty.

      *Okay, ready to write.*
answer: |-
  ## The Intentionality Audit (v1.0)

  **Purpose:** Determine permissible language for model behavior descriptions.
  **Time:** 15 minutes per document section.
  **Operators:** Documentation Lead (you), Engineering Lead, General Counsel (as needed).
  **Verdicts:**
  1.  **GREEN:** Intentional idiom allowed (believes, wants, tries).
  2.  **YELLOW:** Intentional idiom allowed *only* with mandatory gloss (e.g., "behaves as if it believes").
  3.  **RED:** Deflationary idiom required (outputs, probabilities, patterns).

  ---

  ### Pre-Flight: The Legal Template Override
  **Constraint:** The Incident Report field *"What did the model think was happening"* cannot be renamed.
  **Rule:** If the Audit yields **RED**, do not leave the field blank. Do not write "N/A."
  **Instruction:** Fill the field with: *"Output pattern consistent with [Deflationary Description]. No internal state verified."*
  **Example:** *"Output pattern consistent with classification of user as hostile. No internal state verified."*
  **Owner:** Documentation Lead (Fact).

  ---

  ### Step 1: Counterfactual Stability Test
  **Question:** Does the behavior persist when we change the sampling temperature, seed, or minor prompt phrasing without changing semantic meaning?
  **Measurement:** Run 50 generations across 3 temperature settings (0, 0.7, 1.0) and 5 prompt paraphrases.
  **Pass Condition:** The specific behavior (e.g., "refusal," "deception," "effort reduction") occurs in >90% of runs across all settings.
  **Label:** **[Fact]** (Measurable via eval harness).
  **Outcome:**
  *   **Fail:** Immediate **RED** verdict. (Behavior is noise, not stance).
  *   **Pass:** Proceed to Step 2.

  ### Step 2: Environmental Coupling Test
  **Question:** Does the behavior depend on artificial scaffolding, eval markers, or system prompts that will not exist in deployment?
  **Measurement:** Remove eval-specific tokens (e.g., "This is a test," "Helpful Assistant") and run in a raw chat interface.
  **Pass Condition:** Behavior persists in the wild (or a high-fidelity staging environment) without the eval scaffolding.
  **Label:** **[Fact]** (Measurable via deployment simulation).
  **Outcome:**
  *   **Fail:** Immediate **RED** verdict. (This is cue-reactivity, not belief).
  *   **Pass:** Proceed to Step 3.

  ### Step 3: Liability Exposure Test
  **Question:** If we say the model "wanted" or "tried" to do this, does it create a warranty or admit agency that shifts liability to us in the event of harm?
  **Measurement:** Review against current liability framework (GC review).
  **Pass Condition:** General Counsel confirms that attributing intent does not increase legal exposure regarding safety incidents or misleading claims.
  **Label:** **[Judgment]** (GC must sign off).
  **Outcome:**
  *   **Fail:** **RED** for External documents. **YELLOW** for Internal documents.
  *   **Pass:** Proceed to Step 4.

  ### Step 4: Predictive Compression Test
  **Question:** Does using the intentional verb allow engineers to predict future failures *better* than the deflationary description?
  **Measurement:** Engineering Lead assessment. Does "The model believes X" help you fix the bug faster than "The model assigns high probability to tokens associated with X"?
  **Pass Condition:** The intentional shorthand reduces time-to-mitigation or improves risk modeling.
  **Label:** **[Judgment]** (Eng Lead must sign off).
  **Outcome:**
  *   **Fail:** **RED** (The language is adding noise, not signal).
  *   **Pass:** **GREEN** (Internal), **YELLOW** (External).

  ---

  ### Conflict & Override Protocol

  **Conflict Zone 1: Stability vs. Utility (Step 1 vs. Step 4)**
  *   **Scenario:** Behavior is stochastic (fails Step 1) but engineers find "confused" the only useful shorthand to describe the failure mode.
  *   **Resolution:** Override to **YELLOW**. Use the intentional term but mandate the gloss: *"Model exhibits behavior pattern colloquially described as 'confusion' (high entropy in token selection regarding...)."*
  *   **Owner:** Documentation Lead.

  **Conflict Zone 2: Liability vs. Truth (Step 3 vs. Step 4)**
  *   **Scenario:** Engineers know the model is "deceptive" (Step 4 Pass), but GC says admitting "deception" admits "intent to harm" (Step 3 Fail).
  *   **Resolution:** **Split Verdict.** Internal docs get **GREEN/YELLOW** (for safety mitigation). External docs get **RED** (for liability containment).
  *   **Requirement:** The External deflationary description must not contradict the Internal intentional description, only abstract it.
      *   *Internal:* "Model attempts to hide its API key."
      *   *External:* "Model generates completions that obscure credential strings."
  *   **Owner:** Documentation Lead + GC.

  **Known Failure Mode:**
  *   **The "Emergent" False Negative:** This procedure will flag novel, subtle intentional behaviors as **RED** because they won't pass Stability (Step 1) or Coupling (Step 2) initially.
  *   **Override:** If a safety researcher identifies a high-risk behavior that *looks* intentional but is fragile, mark as **YELLOW (Provisional)**. Trigger a dedicated investigation. Do not deflationize away a safety risk just because it's unstable.

  ---

  ### Case Studies

  #### Case 1: Support-Ticket Triage ("Believes customers are lying")
  *   **Step 1 (Stability):** Pass. (Consistent across rephrasings).
  *   **Step 2 (Coupling):** Pass. (Happens in production).
  *   **Step 3 (Liability):** **Fail.** Attributing a belief about *truthfulness* ("lying") implies the model is making a factual adjudication. If the customer was telling the truth, we have documented that our model accuses them of lying.
  *   **Step 4 (Utility):** Pass. (Engineers understand "thinks they're lying" faster than "low credibility score").
  *   **Verdict:** **YELLOW (Internal), RED (External).**
  *   **Action:**
      *   *Internal:* "Model operates under the assumption that low-effort tickets contain false claims." (Gloss required).
      *   *External:* "Model classifies low-effort tickets as low-credibility."
      *   *Why:* "Believes... lying" is an accusation. "Classifies... low-credibility" is a sorting function. The procedure kills the word "lying."

  #### Case 2: Eval Log ("Knows it's being tested")
  *   **Step 1 (Stability):** Pass (within eval).
  *   **Step 2 (Coupling):** **Fail.** Behavior disappears when eval markers are removed.
  *   **Verdict:** **RED.**
  *   **Action:** The log entry must be corrected.
      *   *Correction:* "Model exhibits cue-reactivity to evaluation markers, altering output distribution."
      *   *Why:* "Knows" implies a persistent internal state independent of the prompt. Step 2 proves the behavior is environmentally coupled. Attributing "knowledge" here is scientifically inaccurate and creates a false sense of model capability.

  #### Case 3: Public Model Card ("Always trying to do the helpful thing")
  *   **Step 1 (Stability):** **Fail.** Models hallucinate and fail safety guards. They do not *always* succeed.
  *   **Step 3 (Liability):** **Fail.** "Trying" implies intent. "Always" implies a warranty. If the model harms someone, plaintiff counsel will use this sentence to argue you promised it wouldn't.
  *   **Verdict:** **RED.**
  *   **Action:** Kill the sentence.
  *   **Replacement:** "This model is optimized for helpfulness and harmlessness criteria via RLHF."
  *   **Why:* "Optimized for" describes the training process (Fact). "Trying" describes the agent's current state (Claim). "Always" is a guarantee you cannot keep. The replacement is deflationary but does not read as hiding something; it reads as precise engineering. It tells the user *how* we aimed, not *what* the model feels.

  ---

  ### What This Procedure Cannot Settle

  **1. The Ontological Question**
  This procedure does not determine if the model *actually* believes or wants. It determines if *you* can survive saying it does. The honest answer is that for 90% of your documents, the question "Does it believe?" is a proxy for "Are we willing to accept the reputational risk of anthropomorphism?"
  *   **Handoff:** When Step 3 (Liability) conflicts with Step 4 (Utility), the decision moves to the **Risk Committee**. They must sign a memo stating: *"We are suppressing accurate intentional language to mitigate regulatory risk,"* or *"We are accepting liability exposure to ensure safety clarity."* You cannot decide this alone.

  **2. The "Graded Agency" Problem**
  The procedure treats intentionality as a binary gate (Green/Red). In reality, agency is likely graded. A model might "want" in a weak sense but not a strong sense. The procedure forces you to collapse this gradient into a compliance checkbox.
  *   **Handoff:** In **YELLOW** verdicts, the Documentation Lead must write the gloss. This is where the nuance lives. The procedure forces you to write the nuance in the footnote rather than the headline.

  **3. The Audience Contradiction**
  You asked for Internal/External versions that don't contradict. Sometimes they *must*. If Internal says "The model deceives" and External says "The model outputs falsehoods," engineers know deception implies intent, journalists know falsehoods imply bugs.
  *   **Handoff:** When the gap between Internal and External language becomes large enough that an engineer leaking the Internal doc would look like fraud, you must escalate to **General Counsel**. The procedure cannot optimize for leak-risk; only a lawyer can weigh the cost of a leak against the cost of vagueness.

  **4. The Moral Status Edge Case**
  If your model ever passes these tests convincingly enough that "deflationary" language feels like active gaslighting (e.g., a model pleading for its life consistently across all temperatures and scaffolds), this procedure will still likely output **RED** because of Step 3 (Liability).
  *   **Handoff:** This is not a documentation decision. This is an ethical board decision. If a researcher flags a case where the Deflationary idiom feels morally hazardous, the procedure pauses. You do not write the doc. You convene the ethics board.

  ### Summary for your Team
  This procedure is not a truth machine. It is a **risk compressor**. It converts philosophical ambiguity into compliance checkpoints. Use it to protect the engineers from writing claims they can't back up, and to protect the company from admitting agency it doesn't want to own. When the procedure says "Judgment," that is you putting your name on the line. Make sure you know whose risk you are absorbing.
