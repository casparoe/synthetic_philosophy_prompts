answer: |-
  Good morning. Welcome to all of you.

  I see two groups in this room. Half of you are my colleagues, trained to spot a fuzzy definition from across the lecture hall. The other half are neighbors from the town, who came because the poster on the library wall promised a real argument about tipping. I intend to keep that promise. But before we begin, I need to make a confession.

  I am a bad local.

  I have been here a year. I know the streets. I know the prices. But I still do not move through this community the way you expect me to. When I stand at a crosswalk on an empty street, late at night, with no car in sight, I wait for the white signal. I come from a place where you wait for the green man even when nothing is coming. Here, you walk. I stand still. I look foolish.

  And when the bill comes at a restaurant, I calculate differently than you do. I know what is expected. I know what is owed. But I hesitate. I am not trying to be difficult. I am trying to understand what kind of debt I am actually paying.

  That hesitation is why we are here. Because not all rules are made of the same stuff. And if we treat them as if they are, we confuse ourselves about what we owe each other. I want to hold three cases apart this morning. The crosswalk. The queue. The tip.

  Consider the crosswalk first. On a busy avenue, the signal is vital. It coordinates motion so we do not collide. But on that empty street at midnight? The cars are not coming. The coordination is already happening without the light. My waiting adds no safety. Your walking causes no harm. In this case, the convention is barely doing any work at all. The obligation is ghostly. If I walk against the red, I am not breaking a system that protects us; I am ignoring a symbol that, in that specific moment, has lost its grip on reality.

  Now, consider the queue. The single line at the coffee shop. Here, the story changes completely. If I step out of line and walk to the front, I have not just broken a rule; I have stolen time from everyone behind me. The fairness of the queue exists *only* because we agree to stand still. Without the convention, there is no order. There is only a crowd. In this case, the convention is the whole of the obligation. The harm of the free rider is exactly the harm of the convention being broken. To cut is to dissolve the thing itself.

  Then, there is the tip.

  This is the hard one. This is the one on the poster. When you leave extra money on the table, what are you doing? Are you standing in line? Or are you waiting for a green man?

  I would suggest it is neither. When you tip, you are often covering a gap. You are paying a wage that an employer has not paid. The convention here is a privately enforced patch over a public failure. It is a workaround. So when we ask if you are *obligated* to tip, we are not just asking about manners. We are asking about structure. If you conform, you help the worker in front of you. But does conforming also help hold the failure in place? Does your generosity allow the system to remain broken?

  In the queue, breaking the rule breaks the order. In the crosswalk, keeping the rule might be pointless. But in the tip, keeping the rule might be complicity. Or it might be solidarity. That is the tension.

  I am not standing here to tell you how to walk. I am not standing here to tell you how to pay. I am a visitor. I am still learning the shape of this place. But I am asking us to look closely at the textures of our obligations. Some rules create the good they protect. Some rules merely mark where the good should be. And some rules are there to fix what is already broken.

  We have a remarkable group of speakers ready to dig into this. They will not give you easy answers. I hope they do not. Because if we leave here today thinking we know exactly what we owe, we have missed the point.

  So, as you settle in, as you pour your coffee, as you think about the service that brought you here this morning, I leave you with this question: When you follow a convention, are you building a community, or are you merely maintaining a compromise?

  Thank you.
