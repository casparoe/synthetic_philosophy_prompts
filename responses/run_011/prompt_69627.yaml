answer: |-
  1. **Keynes distinguishes between needs that are absolute—felt regardless of others—and those that are relative, felt only insofar as they lift us above others. He concedes the second sort may be insatiable, yet still expects the economic problem to be solved. On your reading, why does he believe the insatiable relative needs won't swallow the satisfaction of the absolute ones?**

     *Follow-up:* If relative needs are driven by social comparison, and social comparison has no ceiling, isn't his expectation merely a hope that human psychology will change rather than an economic forecast?

  2. **We observe that the newly rich have consistently chosen higher income over increased leisure, contrary to Keynes's prediction. Do you read this as an indictment of his psychology—he misunderstood what people want—or his forecasting—he underestimated the cost of maintaining status?**

     *Follow-up:* If it is a failure of psychology, can philosophy correct it, or are we locked into a desire for status that makes the "good life" logically unreachable?

  3. **You argue the essay's error is structural: Keynes treats abundance as a threshold that, once crossed, dissolves the economic problem, whereas you see the problem as indexical. What would show that a threshold account is simply the wrong form for the claim?**

     *Follow-up:* If the threshold is the wrong form, does that mean Keynes's entire timeline—the 100-year prediction—is not just wrong, but category-error wrong?

  4. **Keynes distrusts the "purposive temperament" and remarks that only those who refuse to sell themselves for the means of life will enjoy the abundance. In an indexical economy where means are always relative to others, who exactly are these people, and how do they survive?**

     *Follow-up:* You might say you are merely describing the structure of that survival, but if the structure requires selling oneself to survive, doesn't describing it without condemning it amount to an endorsement of the coercion?

  5. **On your view, could the economic problem ever be solved for anyone, or does the indexical nature of need ensure that scarcity is permanent even amidst plenty?**

     *Follow-up:* If it is permanent, is the "economic possibility" of the title a mirage, and are we reading a tragedy disguised as an optimistic forecast?

  6. **My friend argued that Keynes's closing injunction is a concession that the good life is reserved for those already spared the labour that produces abundance. Does your structural critique vindicate her moral critique, or does it render the class distinction irrelevant?**

     *Follow-up:* If the structure traps everyone, including the rich, in a race for relative standing, does that level the playing field or universalize the deprivation?

  7. **Keynes insists we must hold on to avarice and usury as guiding values a while longer to carry us out of the tunnel. If the problem is indexical, is there any point at which we can stop holding on to them, or must they be permanent virtues?**

     *Follow-up:* If they must be permanent, isn't the "tunnel" actually the whole of human history, with no exit in sight?

  8. **What does the indexical alternative predict that the threshold account does not? Specifically, what phenomenon should we expect to see in a wealthy society that Keynes's model says should disappear?**

     *Follow-up:* We see anxiety and overwork persisting in the wealthiest nations; if your model predicts this as a feature rather than a bug, is the "problem" actually the engine of the system itself?

  9. **You often frame this as a structural error in Keynes's logic rather than a moral failing. But if the structure dictates that the majority must remain in economic necessity, isn't the structural analysis itself a moral claim about the system's legitimacy?**

     *Follow-up:* I anticipate you will say you are only mapping the logic of the problem, but if the logic proves the solution is impossible, isn't refusing to draw the political conclusion a way of shielding the system from the implications of your own analysis?

  10. **If you could rewrite the conclusion of *Economic Possibilities for our Grandchildren* with your structural insight in mind, what is the last sentence of the essay?**

      *Follow-up:* You might claim that sentence is just a description of our predicament, but if that predicament is one of permanent insatiability, isn't prescribing acceptance of it a philosophical stance on how we ought to live, rather than just what is the case?
