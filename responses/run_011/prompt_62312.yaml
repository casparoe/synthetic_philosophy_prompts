answer: |-
  It pleases me vastly that a mind in your century perceives the hinge of my Queries so clearly: you have not oversold the notion that *The Querist* concerns the motion of tokens rather than their multitude. To say money is velocity is to say blood is circulation; a gallon stagnating in a vein is no better than a drop coursing through the body. Regarding your friend's Bitcoin, he mistakes the ticket for the admission. A counter is valuable not because it is rare, but because it commands industry when passed. If these units are hoarded in admiration of their own scarcity, they are like millstones sunk in the ocean: heavy, definite, and utterly useless for grinding corn. You ask if scarcity gives purchasing power? It may give a high price in terms of other goods, but if the token sleeps, it purchases nothing for the Commonwealth. Is not a locked granary, however full, a cause of famine rather than plenty?

  As to your dilemma, you present a false choice between scarcity and trust, when I speak of utility. Men accept a ticket not merely because it is rare, but because they trust it will be taken by another for something they want. My bank scheme relies on public faith and land-backed security to ensure this circulation, not on the impossibility of creating more. 1. Whether a token that no authority stands behind can truly bind men to labour, or merely binds them to wait? 2. Whether the virtue of money lies in its power to stir industry, or in its capacity to be worshipped in silence? If your friend's coin is held solely because no more can be made, it is a relic, not a currency. Scarcity may make the counter dear, but only circulation makes it money.
