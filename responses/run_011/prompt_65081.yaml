answer: |-
  # Layer One: The Logical Space

  This layer defines the boundaries of the debate without naming the positions. It establishes seven dimensions of disagreement using the anchor cases. Participants locate themselves by choosing between mutually exclusive descriptions of the cases. Not all combinations of answers are logically stable; the "Permitted Combinations" notes indicate where answers constrain one another.

  **Axis 1: Location vs. Function (The Notebook Case)**
  *   **Option A:** If the notebook performs the exact same function as biological memory, it must be treated as memory, regardless of being outside the skull.
  *   **Option B:** Even if the notebook performs the same function, its location outside the skull prevents it from being memory proper.
  *   *Permitted Combinations:* Option A permits externalist leaves; Option B permits internalist or embedded leaves.

  **Axis 2: Metaphysical vs. Methodological (The Explanation Case)**
  *   **Option A:** The claim is about what the cognitive system *is* (a fact about the world).
  *   **Option B:** The claim is about which description helps us *predict or design* better (a tool for inquiry).
  *   *Permitted Combinations:* Option B leads directly to Methodological Extensionism; Option A is required for all other leaves.

  **Axis 3: Coupling vs. Constitution (The Navigation App Case)**
  *   **Option A:** Relying on the app so heavily that you cannot navigate without it makes the app part of your navigation system.
  *   **Option B:** Reliance is just a strong causal connection; the app remains a tool you use, not a part of you.
  *   *Permitted Combinations:* Option A is required for Extension and Distributed leaves; Option B is required for Internalist and Embedded leaves.

  **Axis 4: Cognition vs. Affect/Memory (The Jazz Instrument Case)**
  *   **Option A:** The instrument extends the musician's cognitive processing (improvisational logic).
  *   **Option B:** The instrument extends only emotional expression or motor habits, not cognition proper.
  *   **Option C:** Neither extends; the instrument is merely a causal output device.
  *   *Permitted Combinations:* Option B leads to Extended Affect; Option A leads to Cognition Extension; Option C leads to Internalism/Embedded.

  **Axis 5: Synchronic vs. Diachronic (The Notebook vs. Nav App Case)**
  *   **Option A:** If the coupling is tight right now, extension holds (snapshot).
  *   **Option B:** Extension requires a history of trust, endorsement, and skillful incorporation over time.
  *   *Permitted Combinations:* Option A supports Parity-based views; Option B supports Second-wave or Integration views.

  **Axis 6: Individual vs. Group (The Design Wall Case)**
  *   **Option A:** The cognitive system is the individual designer using the wall.
  *   **Option B:** The cognitive system is the team-wall composite; no individual holds the cognition alone.
  *   *Permitted Combinations:* Option B leads to Distributed Cognition; Option A is required for all other leaves.

  **Axis 7: Outward Reach vs. Inward Build (The Scaffold Case)**
  *   **Option A:** The mind reaches out to grab the artifact (extension).
  *   **Option B:** The artifact helps build the mind from the outside in during development (construction).
  *   *Permitted Combinations:* Option A supports Extension leaves; Option B supports Scaffolded Construction.

  ***

  # Layer Two: The Tree and Its Leaves

  This instrument consists of 10 questions. Participants answer based on their immediate intuition about the anchor cases. The Scoring Key maps patterns to the 12 Leaves.

  ### The Questions
  *(Load-Bearing questions are marked [LB]; Tie-Breakers are marked [TB])*

  1.  **[LB]** Consider the **Researcher's Notebook**. If the notebook stores information she cannot recall internally and she consults it automatically, is the notebook *part of her memory system* in the same way her biological brain is?
      *   (Yes / No)
  2.  **[LB]** Consider the **Navigation App**. If the driver follows it without cross-checking, is the app *part of the driver's mind*, or is it merely a tool the mind uses?
      *   (Part of Mind / Merely a Tool)
  3.  **[TB]** Consider the **Generative Assistant**. If the AI drafts arguments the user endorses without checking, does the user *understand* the argument in the same way they would if they wrote it alone?
      *   (Yes / No / Only if they have a policy of reviewing it)
  4.  **[LB]** Consider the **Design Team Wall**. Where does the solution to the design problem exist?
      *   (In the group-system / In the individuals' heads)
  5.  **[TB]** Consider the **Jazz Instrument**. During improvisation, does the instrument participate in the *thinking* process, or only in the *expression* of thought?
      *   (Thinking / Expression / Neither)
  6.  **[LB]** Why do we argue about these cases? Is it to discover *what exists* or to find *useful ways to talk*?
      *   (What Exists / Useful Ways to Talk)
  7.  **[TB]** Consider the **Notebook** again. If the researcher loses the notebook for a week, has she lost part of her *mind*, or just a valuable resource?
      *   (Part of Mind / Valuable Resource)
  8.  **[TB]** Consider the **Generative Assistant**. If the assistant makes an error, is the user *less responsible* because the system is partly external, or *equally responsible*?
      *   (Less Responsible / Equally Responsible)
  9.  **[LB]** Consider the **Cochlear Implant**. Is this implant part of the user's hearing system in the same way the **Notebook** might be part of memory?
      *   (Yes, same kind of part / No, fundamentally different)
  10. **[TB]** Does the environment *extend* an existing mind outward, or does it *scaffold* the construction of a mind that wouldn't exist otherwise?
      *   (Extend Outward / Scaffold Construction)

  ### Scoring Key and Leaves

  **Step 1: The Major Split (Question 6)**
  *   If **Useful Ways to Talk**: Go to **Leaf 12**.
  *   If **What Exists**: Proceed to Step 2.

  **Step 2: The Unit of Analysis (Question 4)**
  *   If **In the group-system**: Go to **Leaf 11**.
  *   If **In the individuals' heads**: Proceed to Step 3.

  **Step 3: The Boundary Decision (Questions 1 & 2)**
  *   If **No** (Q1) OR **Merely a Tool** (Q2): Proceed to Step 4 (Internalist/Embedded Cluster).
  *   If **Yes** (Q1) AND **Part of Mind** (Q2): Proceed to Step 5 (Externalist Cluster).

  **Step 4: Internalist/Embedded Cluster**
  *   If **No, fundamentally different** (Q9): Go to **Leaf 9**.
  *   If **Merely a Tool** (Q2) but **Environment indispensable** (implied by workshop context): Go to **Leaf 7**.
  *   If **Merely a Tool** (Q2) and **Scaffold Construction** (Q10): Go to **Leaf 8**.
  *   If **Merely a Tool** (Q2) and **Coupling is fallacy** (inferred from Q2 "Merely"): Go to **Leaf 10**.
      *   *Differentiation:* If participant insists coupling *never* implies constitution regardless of function -> **Leaf 10**. If participant insists cognition has a biological signature -> **Leaf 9**. If participant says environment builds mind -> **Leaf 8**. If participant says environment is essential but boundaries don't move -> **Leaf 7**.

  **Step 5: Externalist Cluster**
  *   If **Expression** (Q5): Go to **Leaf 4**.
  *   If **Part of Mind** (Q2) but **Less Responsible** (Q8): Go to **Leaf 5**.
  *   If **Thinking** (Q5) and **Extend Outward** (Q10): Proceed to Step 6.
  *   If **Thinking** (Q5) and **Scaffold Construction** (Q10): Go to **Leaf 8** (Override Step 4).

  **Step 6: Nuance of Extension**
  *   If **Only if they have a policy of reviewing it** (Q3): Go to **Leaf 3**.
  *   If **Yes** (Q3) and **Part of Mind** (Q7): Go to **Leaf 1**.
  *   If **Yes** (Q3) and **Valuable Resource** (Q7) [Indicates history matters]: Go to **Leaf 2**.
  *   If **Processing wide** but **Meaning internal** (Inferred from Q3 "No" on understanding): Go to **Leaf 6**.

  ### The Leaves (Positions and Awkward Commitments)

  1.  **Parity-based active externalism:** The artifact is literally part of the cognitive system in virtue of the work it does, on pain of an arbitrary double standard.
      *   *Awkward Commitment:* If a virus replicates your memory function reliably, it is literally part of your mind.
  2.  **Second-wave extension:** Constitution requires continuous, bidirectional interaction and skillful incorporation, not a one-off retrieval from an external store.
      *   *Awkward Commitment:* A notebook you haven't used in a month is no longer part of your mind.
  3.  **Integration-and-endorsement extension:** The artifact belongs to the cognitive system only insofar as the agent has standing policies of revising it, holding it answerable to their other commitments, and treating it as theirs.
      *   *Awkward Commitment:* You can lose part of your mind simply by changing your policy on trust.
  4.  **Extended affect, contained cognition:** Moods, emotions, and memory-related states extend into artifacts and other people while cognition proper does not.
      *   *Awkward Commitment:* Your anger is in the wall, but your reasoning is in your head.
  5.  **Constitution granted, autonomy lost:** The artifact really is part of the cognitive system, and that is precisely why the agent's credit, responsibility, or epistemic standing is diminished rather than enhanced.
      *   *Awkward Commitment:* Using the notebook makes you less responsible for what you write.
  6.  **Vehicle extension without content extension:** The processing is partly outside the skull while what it carries need not be wide.
      *   *Awkward Commitment:* The meaning is in your head, even if the calculation is on the wall.
  7.  **The embedded view:** The environment is indispensable to explaining cognition, but the boundaries of the cognitive system do not move.
      *   *Awkward Commitment:* The notebook is essential, but it is no more part of you than the air you breathe.
  8.  **Scaffolded construction:** Scaffolding builds the mind over learning, development, and evolution, so "extension" mis-describes the direction of dependence.
      *   *Awkward Commitment:* The mind did not extend; the world built the mind.
  9.  **Mark-of-the-cognitive internalism:** Cognition has internal markers or a signature profile, so no external process could be cognitive however it functions.
      *   *Awkward Commitment:* A cochlear implant is fundamentally different from a biological ear.
  10. **Coupling-constitution internalism:** The inference from causal coupling to constitutive membership is a fallacy, whatever one says about the functional profile of the coupled process.
      *   *Awkward Commitment:* Even if the notebook does everything a brain does, it is still just a tool.
  11. **Distributed cognition:** The individual does not extend; the team does, and the right unit of analysis is the group-level system.
      *   *Awkward Commitment:* The team solved the problem, but no individual team member did.
  12. **Methodological extensionism:** The metaphysical dispute is idle, and the claim worth having is only that certain explanations run better across the boundary.
      *   *Awkward Commitment:* It doesn't matter if the mind extends, only if saying so helps us design better.

  ### Handling Mismatches
  *   **No Match:** If a participant's answers contradict (e.g., "Tool" but "Part of Mind"), report: *"Tension Detected: Your intuitions about function and boundaries are in conflict."*
  *   **Multiple Matches:** If a participant fits two leaves (e.g., Embedded and Scaffolded), report: *"Hybrid Position: You share commitments with both [Leaf A] and [Leaf B]."*

  ### Administration and Divergence Protocol
  **Instruction:** Administer the tree twice. First, anchor all questions to the **Notebook** (e.g., Q1 becomes "Is the Notebook part of memory?"). Second, anchor all questions to the **Generative Assistant**.

  **Interpreting Divergence:**
  If a participant lands on **Literal Extension (Leaf 1 or 2)** for the Notebook but **Embedded (Leaf 7)** or **Internalism (Leaf 9 or 10)** for the Assistant, this spread indicates that *trust and transparency* are the hidden variables in their intuition. The Notebook is seen as transparent and endorsed (passing Integration/Endorsement), while the Assistant is seen as opaque or black-boxed (failing Endorsement). This suggests the participant's boundary is not drawn at the skull, but at the limit of *comprehensible integration*. Conversely, if they land on **Extension** for the Assistant but **Internalism** for the Notebook, they prioritize *functional capacity* over *history of incorporation*, suggesting a Parity-based view sensitive to processing power rather than biographical integration.

  ***

  # Layer Three: Diagnostics

  This layer analyzes the logical space defined in Layer One to identify gaps and limitations in the instrument.

  ### Empty Cells (Permitted but Unoccupied)
  1.  **Metaphysical Extension + No Coupling:** The axes permit a claim that the mind extends metaphysically even without causal coupling (e.g., telepathic extension), but no author occupies this because extension theories rely on causal integration to avoid mysticism. *Status: Incoherent within naturalistic frameworks.*
  2.  **Group Extension + Individual Constitution:** The axes permit a view where the group is the extended system, but the constitution relation only holds for individuals within it. This is unoccupied because Distributed Cognition (Leaf 11) typically dissolves the individual as the primary unit of constitution. *Status: Theoretically available but unattractive/unused.*
  3.  **Vehicle Extension + Content Internalism + Affect Extension:** One could argue processing extends, meaning stays internal, but emotions extend. This combination is logically possible but unexplored, as affect extension usually drags cognition with it or remains isolated. *Status: Simply unexplored.*

  ### Indistinguishable Pairs
  1.  **The Embedded View (Leaf 7) vs. Scaffolded Construction (Leaf 8):**
      *   *Problem:* Both deny that the boundary of the cognitive system moves (Internalist boundary) while admitting the environment is indispensable. The current questions on "Outward vs. Inward" (Q10) rely on metaphor which participants may interpret similarly.
      *   *Fix:* Add a question about *time*: "Did the artifact *change* your cognitive abilities permanently (Scaffold), or does it only *support* them while present (Embedded)?"
  2.  **Mark-of-the-Cognitive Internalism (Leaf 9) vs. Coupling-Constitution Internalism (Leaf 10):**
      *   *Problem:* Both result in "No Extension." Leaf 9 says external things *can't* be cognitive (intrinsic nature); Leaf 10 says external things *aren't* part of the system even if they function cognitively (logical fallacy of coupling). The current Cochlear Implant question (Q9) touches this but may not separate the *reason* for rejection.
      *   *Fix:* Add a question about the **Notebook**: "If we could replace a neuron with a silicon chip that functions identically, is that chip part of the mind?" Leaf 9 says No (biological mark); Leaf 10 might say Yes (if inside) but still say the Notebook is No (coupling fallacy).

  ### Divergence Interpretation (Workshop Closing)
  When a participant lands on **Literal Extension** for the Notebook but **Embedded** for the Assistant, we should interpret this not as inconsistency, but as evidence that their criterion for extension is *transparency and endorsement* rather than mere reliability. The Notebook is a "trusted friend"; the Assistant is a "black box." This spread reveals that for this participant, the "Extended Mind" is not a claim about hardware location, but about *agency integration*. If the axes themselves are the cause of the spread (e.g., the axes force a choice between history and function), the workshop should treat the divergence as a critique of the axes: perhaps "Extension" is not a single dimension but a cluster concept that breaks apart when comparing low-tech (Notebook) and high-tech (Assistant) scaffolds.
