answer: |-
  # The "What Do You Think You Think?" Diagnostic
  **Topic:** Slurs (Semantics & Use)  
  **Instructions:** For each case, circle the option that best matches your intuition. Do not overthink. If two options seem plausible, pick the one that feels *more* right. The word `___` stands for any standard racial, ethnic, or social slur.

  ### 1. Negation
  Someone says: *"It is not the case that Kai is a ___."*
  *   **A.** They have denied the insult. Kai is off the hook; no insult was conveyed.
  *   **B.** They have denied the description, but the insult still hangs in the air. It's still offensive to say this.
  *   **C.** They have denied the description, and whether it's offensive depends entirely on why they said it.

  ### 2. Indirect Report
  Ana says to Bo: *"Kai is a ___."*  
  Bo later tells Cara: *"Ana said that Kai is a ___."*
  *   **A.** Bo did something wrong. He repeated the slur, even if he was just reporting.
  *   **B.** Bo did nothing wrong. He was reporting speech, not slurring Kai himself.
  *   **C.** Bo did something slightly wrong, but less than Ana. He should have used a neutral word instead.

  ### 3. Quotation
  A linguistics article prints the word `___` in bold text to analyze its history.
  *   **A.** This is wrong. The word is toxic; printing it does the same damage as saying it, just quieter.
  *   **B.** This is fine. The word is being mentioned, not used. It's inert in this context.
  *   **C.** This is risky. It's technically allowed, but it still makes readers uncomfortable and should be avoided if possible.

  ### 4. The Clean Hands (The Robot)
  An AI chatbot (with no feelings or beliefs) outputs: *"Kai is a ___,"* and Kai actually fits the descriptive definition of the word (e.g., the relevant ancestry).
  *   **A.** The sentence is **True**, but the output was **Wrong** (harmful/offensive).
  *   **B.** The sentence is **False** (or neither true nor false). The word cannot apply cleanly.
  *   **C.** The sentence is **True**, and nothing **Wrong** was done. The AI has no intent to harm.

  ### 5. Reclamation
  Members of the target group use `___` among themselves as a term of endearment or solidarity.
  *   **A.** It means something different now. It's a new word with a positive meaning.
  *   **B.** It means the same thing, but the rules of who is allowed to say it have changed.
  *   **C.** It's still an insult, but the harm is canceled out because they are friends.

  ### 6. New Coinage
  A community invents a new word to describe themselves. Outsiders start using it to mock them.
  *   **A.** It becomes a slur the moment outsiders use it with hateful intent.
  *   **B.** It becomes a slur the moment the community realizes outsiders are using it to hurt.
  *   **C.** It was never a slur; it's just a word that people are using badly.

  ### 7. Neutral Counterparts
  Think of three specific slurs you know well. For each, is there a neutral word that means exactly the same thing minus the offense (e.g., "Word X" vs. "Neutral Y")?
  *   **A.** Yes, for all of them. The only difference is the attitude.
  *   **B.** Yes, for some, but for at least one major slur, there is no true neutral synonym.
  *   **C.** No. The slur *is* the meaning; you can't separate the poison from the content.

  ### 8. Conditionals
  Someone says: *"If Kai is a ___, he won't get the job."*
  *   **A.** The insult is active. The speaker is suggesting Kai might be a `___`.
  *   **B.** The insult is dormant. It's just a hypothetical condition, like "If Kai is tall..."
  *   **C.** The insult is active only if the speaker believes Kai is a `___`.

  ### 9. Correction
  Speaker 1: *"Kai is a ___."*  
  Speaker 2: *"No, he is not a ___. He is a [Neutral Term]."*
  *   **A.** Speaker 2 is correcting the facts. They agree on what the word means, but deny it applies.
  *   **B.** Speaker 2 is rejecting the word itself. They are saying "Don't call him that."
  *   **C.** Speaker 2 is doing both.

  ### 10. Distance
  A speaker uses `___` to describe a group of people who are not present and cannot hear them.
  *   **A.** It's wrong because it spreads hate, even if the targets don't know.
  *   **B.** It's wrong only if it encourages others to hurt the targets.
  *   **C.** It's not wrong if the speaker genuinely believes the description is accurate.

  ---

  # Scoring Key & Theoretical Grid

  **Note to Facilitator:** Do not treat this as a personality test. There are no "correct" scores. The goal is to map intuitions to theoretical commitments. The grid below classifies positions based on two axes derived from your answers.

  ### The Axes
  1.  **Truth-Conditional Status (X-Axis):** Does the derogatory content contribute to whether the sentence is *true or false*? (Look at Q1, Q4, Q7, Q9).
  2.  **Source of Normativity (Y-Axis):** Where does the "wrongness" come from? The speaker's mind, the social practice, or the word itself? (Look at Q2, Q3, Q4, Q6, Q10).

  ### The Grid

  | | **Derogation is Truth-Conditional** (It affects what is said) | **Derogation is Non-Truth-Conditional** (It affects how it's said) | **Mixed / Dual-Content** (It does both) |
  | :--- | :--- | :--- | :--- |
  | **Source: Speaker Attitude** (Harm depends on intent/belief) | **Descriptivism** <br>*(Q1:B, Q4:A, Q7:A)* <br> The word describes a group + expresses speaker contempt. Truth is separate from rudeness. | **Pure Expressivism** <br>*(Q1:B, Q4:C, Q7:A)* <br> The word has no descriptive truth value regarding the slur content; it only vents emotion. | **Hybrid Expressivism** <br>*(Q1:B, Q4:A, Q7:C)* <br> The word describes *and* expresses. Both are part of the literal meaning. |
  | **Source: Social Practice** (Harm depends on community rules) | **Proceduralism / Practice-Based** <br>*(Q1:B, Q4:A, Q5:B, Q6:A)* <br> Meaning is fixed by how the community regulates the word. | **Use-Conditional Expressivism** <br>*(Q1:B, Q4:C, Q5:A)* <br> The expression is only valid if social conditions (like reclamation) are met. | **Normative Hybrid** <br>*(Q1:B, Q4:A, Q5:B)* <br> Truth conditions exist, but their application is governed by social norms. |
  | **Source: The Word Itself** (Harm is intrinsic/taboo) | **Prescriptivism / Taboo View** <br>*(Q1:B, Q2:A, Q3:A, Q4:B)* <br> The word is toxic. Uttering it is the error, regardless of truth or intent. | **Eliminativism** <br>*(Q4:B, Q7:C)* <br> The word has no legitimate place in language. It cannot be true; it should be deleted. | **Constitutive Harm** <br>*(Q2:A, Q3:C, Q10:A)* <br> The utterance constitutes the harm directly, independent of truth or speaker state. |

  ### Analysis of Empty or Problematic Cells

  **1. The "True and Innocent" Cell (Truth-Conditional + No Wrong Done)**
  *   *Coordinates:* Derogation is Truth-Conditional / Source: None (Innocent).
  *   *Status:* **Coherent but Unoccupied.**
  *   *Why:* This corresponds to Q4 Option C (True, Nothing Wrong). Very few theorists occupy this. It implies the word is just a neutral descriptor that everyone *thinks* is rude but isn't. This is the "Naive Descriptivist" view. It is usually rejected because it ignores the historical weight of slurs.

  **2. The "False but Permissible" Cell**
  *   *Coordinates:* Derogation makes sentence False / Source: Speaker Attitude (Permissible).
  *   *Status:* **Incoherent.**
  *   *Why:* If the word makes the sentence false (i.e., it fails to refer or is semantically defective), it is hard to argue that using it is permissible without a separate pragmatic story. If it's semantically broken, using it is usually a mistake.

  **3. The "Truth-Conditional + Word Itself" Cell**
  *   *Coordinates:* Derogation is Truth-Conditional / Source: The Word Itself.
  *   *Status:* **Tension.**
  *   *Why:* If the truth depends on the word itself being toxic, truth becomes unstable. This is close to **Prescriptivism**, but Prescriptivists usually deny truth-aptness (Q4:B). If you say it *can* be true but the *word* is the problem, you are likely a Hybrid theorist who hasn't fully committed.

  ### Indistinguishable Positions (Blind Spots)

  **1. Expressivism vs. Presupposition Theory**
  *   *The Problem:* This quiz cannot separate **Expressivism** (the word expresses an attitude) from **Presupposition Theory** (the word takes for granted a derogatory proposition).
  *   *Why:* Both predict "projection" (Q1: Option B, Q8: Option A). Both say the insult survives negation. To separate them, you need to ask about *deniability* or *embedding in questions*, which is too technical for this group.
  *   *Verdict:* Treat these as neighbors in the "Non-Truth-Conditional" column.

  **2. Hybrid vs. Descriptivism + Pragmatics**
  *   *The Problem:* A **Hybrid** theorist says the insult is part of the literal meaning. A **Descriptivist** says the insult is literal *plus* a pragmatic layer of rudeness.
  *   *Why:* On Q1 (Negation) and Q4 (Robot), they often give identical answers (True + Offensive). The difference is metaphysical (where the meaning lives), not diagnostic (what the sentence does).
  *   *Verdict:* You will need to ask follow-up questions about "cancellability" to split these two.

  ### Special Note on Question 4 (The Clean Hands)

  **Warning:** Question 4 presupposes **Cognitivism** (the idea that sentences with slurs can be True or False).
  *   If a participant selects **Q4:B** ("False" or "Neither"), they are likely an **Eliminativist** or a **Presupposition Failure** theorist. They reject the axis of the grid that asks "Is it True?"
  *   If a participant struggles to answer Q4 because "Truth isn't the point," they are signaling a **Non-Cognitivist** stance.
  *   *Facilitator Tip:* If the room splits heavily on Q4, pause the grid scoring. That split is more fundamental than the semantics/pragmatics divide. It is a split between those who think slurs *describe the world* and those who think slurs *change the world*.

  ### How to Use This in the Room
  1.  **Hand out the Quiz.** Give them 5 minutes.
  2.  **Collect the Intuitions.** Ask for a show of hands on Q1 and Q4 first. These are the biggest dividers.
  3.  **Map to Grid.** When someone presents a theory (e.g., "I'm an Expressivist"), ask the room to check their quiz. If they answered Q1:A (Negation kills the insult), they are *not* intuitively aligned with standard Expressivism, regardless of what label they want.
  4.  **Highlight the Tension.** Point out Q7 (Neutral Counterparts). If half the room says "Yes" and half says "No," you have a live debate about whether the slur content is separable from the neutral description. This is the core of the Descriptivist vs. Expressivist fight.
