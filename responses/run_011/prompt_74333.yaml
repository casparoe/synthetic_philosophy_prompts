answer: |-
  1. **The "Learned Directness" Tension**
  You argue that we literally perceive emotions, but you also concede this capacity is trained up by immersion in narratives. If the ability to see grief depends on having internalized stories about *why* people grieve, aren't you describing a very fast, subconscious inference rather than a direct perception? Once you admit the cognitive background is necessary, what work is the word "direct" actually doing?

  *Follow-up (if she argues that all perception is theory-laden, like wine tasting):*
  "Wine tasting is still a judgment *based on* taste, not a direct perception of 'quality' itself. If my seeing your anger relies on my background knowledge of your history, why isn't that just a cognitive penetration of experience rather than the emotion being a perceptual object?"

  2. **The Dissociation Prediction**
  Consider cases of congenital facial paralysis, like Moebius syndrome, or severe Parkinsonian mask where voluntary expression is lost. The empirical data on whether these individuals are recognized as emotional is contested. If emotion is literally in the expression, do you predict that people interacting with a Moebius patient are *perceptually blind* to their emotions, or do you think they find a new locus of perception? I need a commitment: is the emotion literally absent from the perceptual field in those cases?

  *Follow-up (if she says we shift perception to posture or voice):*
  "If we can perceive the emotion just as well in the voice or posture, then the face wasn't essential. But if the face is frozen *and* the voice is flat, do you predict recognition drops to zero? If you say 'that's an empirical matter,' aren't you insulating your view from the very cases that test the embodiment claim?"

  3. **The Textual Interlocutor**
  Imagine a chatbot with no body that generates a text describing a loss with perfect nuance. We feel we understand its grief. On your view, can we literally *perceive* the chatbot's mindedness in the prose, or is that a different category? If you say we can perceive it in the text, doesn't that stretch "perception" until it just means "reliable sensitivity"?

  *Follow-up (if she says we perceive the mind in the linguistic arrangement):*
  "If perceiving grief in a face and perceiving grief in a sentence are the same kind of perceptual relation, where does it stop? Do we perceive the 'malice' in a hurricane's path or the 'elegance' in a mathematical proof? If yes, 'perception' no longer distinguishes your view from standard interpretivism."

  4. **The Grip of Skepticism**
  If other minds are as available to us as physical objects, why has the Problem of Other Minds been so philosophically gripping for centuries? You might say the skeptic is just doing bad philosophy instead of looking, but that feels like an ad hominem dismissal. Why does the *intuition* that others are hidden feel so natural if it's phenomenologically false?

  *Follow-up (if she says skepticism arises only in the armchair, not in life):*
  "But the armchair intuition comes from somewhere. If direct perception is our default, the skeptic's doubt should feel impossible, like doubting the external world. If the doubt feels live, doesn't that suggest the perceptual access is actually fallible enough to motivate the inference view?"

  5. **The Asymmetry of Self-Knowledge**
  My access to my own grief seems fundamentally different in kind, not just angle, from my access to yours. I don't need to observe myself to know I'm sad. The standard reply is that I can't walk around to the far side of my own face. But that explains visual occlusion, not epistemic authority. Why is my self-ascription of emotion so much more secure than my perception of yours if both are just perceptual takes on the same state?

  *Follow-up (if she argues self-knowledge is also perceptual, just internal):*
  "If I can be wrong about my own emotions (self-deception) but rarely wrong about the *sensation* of them, and you say I perceive them internally, then perception is doing too much work. Does your view collapse the distinction between *having* an emotion and *detecting* it?"

  6. **The Falsification Condition**
  Philosophical views often become immune to counter-evidence by redefining terms. What specific finding, either phenomenological or empirical, would make you abandon the direct perception view? If neuroscience showed a 200-millisecond lag between facial recognition and emotional labeling, would that falsify your claim, or would you just call that the speed of perception?

  *Follow-up (if she says she would accept neural evidence of inference):*
  "Neural correlates can almost always be interpreted as 'subpersonal perceptual processing.' I'm asking about the *experience*. Is there a specific type of emotional ambiguity you encounter in daily life that would convince you, 'Okay, I was actually inferring that'?"

  7. **The Success of Deception**
  We are often fooled by poker faces or social masking, only realizing the true emotion much later. If we directly perceive the emotion, how do you explain successful deception that isn't uncovered until after the fact? Was I perceiving the false emotion, or was I perceiving nothing?

  *Follow-up (if she says perception is fallible, like optical illusions):*
  "With optical illusions, we can usually point to the misleading stimulus. With a poker face, the stimulus is absent. If I perceive 'calm' and you were 'raging,' and there was no visual cue for the rage, wasn't my access purely inferential and wrong, rather than perceptual and illusory?"

  8. **Cross-Cultural Variability**
  Psychologists like Lisa Feldman Barrett argue that emotion recognition varies significantly across cultures, suggesting construction rather than detection. If emotions are public objects in the face, why does the perceptual capacity vary so wildly depending on where I was raised? Shouldn't a Greek frown be as visible to a New Yorker as a tree is?

  *Follow-up (if she says perceptual learning varies like language acquisition):*
  "If I need to learn the 'language' of the face to see the emotion, aren't you admitting the emotion isn't *in* the face until I decode it? That sounds like the inference view you're trying to avoid, just with a faster decoder."

  9. **The Unexpressed Emotion**
  Can a person be deeply grieving without any bodily manifestation whatsoever? Not suppressed, but genuinely private. If you say yes, you concede emotions can exist without being perceivable. If you say no, are you defining away the possibility of a rich inner life that doesn't leak out?

  *Follow-up (if she says emotion essentially tends toward expression):*
  "That's a metaphysical claim about the nature of emotion, not a perceptual one. If you define emotion as essentially embodied, you might be right, but does that help us with the skeptic who asks if I know what's going on *behind* the embodiment?"

  10. **The Moral Demand of Perception**
  If I infer your pain, I have a reason to help. If I *see* your pain, does that create a stronger moral obligation? Some argue direct perception makes the other's demand on me more immediate (Levinas). But if perception is trained by narratives, doesn't that mean I'm only obligated to those whose stories I know how to read?

  *Follow-up (if she says perception creates a more urgent demand):*
  "If my capacity to perceive your suffering depends on my narrative immersion, then my moral obligation depends on my cultural literacy. Does your view inadvertently justify ignoring the suffering of those whose 'emotional language' I haven't bothered to learn?"
