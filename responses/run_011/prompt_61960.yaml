  *(Refining the "Spandrels" row)*: Gould's spandrels are architectural byproducts exapted later. In ML, artifacts that do nothing are usually just noise or overfitting. Calling them spandrels implies an evolutionary history that isn't there. I should mark "holds" as "No" or "Partly" with a strong import warning.

