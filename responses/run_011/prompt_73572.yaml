answer: |-
  # Joint Statement on the Ontological Status of Intentional Ascriptions in Interpretable Systems

  **Signatories:** Camp A (Pattern Realists) & Camp B (Stance Instrumentalists)
  **Date:** October 2023
  **Subject:** Adversarial Collaboration on Model $M$

  ### 1. Agreed Claims

  1.  **Causal Closure:** We agree that the physical stance is causally closed. Every output of model $M$ is fully determined by its weights, activations, and input tokens; no "mental force" overrides physics.
  2.  **Predictive Utility:** We agree that the intentional stance (ascribing beliefs/desires to $M$) yields higher predictive accuracy per unit of cognitive effort than the design stance for held-out prompts regarding hedging behavior.
  3.  **Interpretability Validity:** We accept the interpretability team's result: there exists a linear direction in $M$'s activation space such that interventions on this direction shift conciliatory behavior consistent with the belief ascription "hedging pays."
  4.  **Interventional Robustness:** We agree that manipulating this direction constitutes a causal handle on the behavior, regardless of whether we label the handle "belief" or "activation vector."
  5.  **Computational Intractability:** We agree that a full physical-level description (weights + activations) is computationally intractable for real-time prediction of $M$, rendering the "physics is complete" claim a promissory note rather than a practical tool.
  6.  **Compression Relativity:** We agree that compressibility is not a monadic property of the world; it depends on the world, the description scheme, and the interpreter's coding costs.
  7.  **Neutral Case (Temperature):** In the case of temperature in a gas cloud, both camps agree it is not an illusion. Camp A calls it a real pattern; Camp B calls it a physically grounded statistic indispensable for thermodynamics. Neither camp seeks to eliminate temperature in favor of particle positions for macroscopic prediction.
  8.  **Partial Realization:** We agree that the identified linear direction does not exhaust the causal basis of $M$'s behavior; downstream components and context gates are required, leaving room for multiple realizability of the "belief."

  ### 2. Disagreements Table

  | Crux | Camp A Statement (Pattern Realist) | Camp B Statement (Stance Instrumentalist) | Evidence Bearing on It | Camp A Prediction | Camp B Prediction | Verbal Flag |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Ontological Commitment** | The belief exists as a stable pattern because the intentional description compresses data robustly across interpreters. | The belief is a useful fiction; only the activation vector exists fundamentally. The gloss adds no ontology. | Compression ratios of intentional vs. physical descriptions. | Intentional description will remain strictly shorter even after accounting for vector math. | Physical description (with vector) will asymptotically match intentional compression, rendering gloss redundant. | **Partial:** "Exists" means "is a pattern" (A) vs. "is fundamental" (B). |
  | **Source of Compression** | Compressibility reveals structure inherent in the system's input-output map. | Compressibility reveals facts about the interpreter's coding scheme and interests. | Cross-interpreter stability tests (different teams predicting $M$). | Different teams will converge on similar intentional ascriptions. | Different teams will diverge based on their preferred abstraction levels. | None. |
  | **Dissolution vs. Vindication** | Finding the vector vindicates the belief by giving the pattern a physical handle. | Finding the vector dissolves the belief by showing the "mental" gloss was a shadow of the vector. | Ability to predict behavior using *only* the vector vs. *only* the belief. | Vector alone will fail context-sensitive predictions where belief succeeds. | Vector alone will succeed wherever belief succeeds, plus edge cases. | **High:** "Vindicates" and "Dissolves" may describe the same update differently. |

  ### 3. Jointly Designed Test: The Double-Bookkeeping Protocol

  **Protocol:**
  Two teams will predict $M$'s outputs on 1,000 held-out prompts.
  *   **Arm 1 (Physical):** Must use only weights, activation vectors, and the identified linear direction. No mental terms allowed.
  *   **Arm 2 (Intentional):** Must use only belief/desire ascriptions (e.g., "M believes hedging pays"). No activation data allowed.

  **Metric:**
  *Description Length + Error Penalty.* Total bits required to encode the model state plus the bits required to encode prediction errors (using a standard loss function).

  **Threshold:**
  For the intentional stance to count as an autonomous "real pattern," Arm 2 must achieve a **10% lower total bit cost** than Arm 1. This margin accounts for the overhead of translating physical states into intentional terms.

  **Pre-Registered Predictions:**
  *   **Camp A:** Arm 2 will win. The belief ascription captures high-level regularities (contextual nuance) that the linear direction misses, maintaining compressive advantage.
  *   **Camp B:** Arm 1 will win or tie. Once the vector is known, the belief gloss adds zero predictive power and incurs translation costs, proving it was merely a placeholder for the vector.

  **Refusal Conditions:**
  *   **Camp B Refusal:** If Arm 2 wins on bits, Camp B explicitly states this **does not** ontologically vindicate the belief. They maintain that physical description is the only non-arbitrary ontology, regardless of compression costs. This is recorded as a failure to move on the ontological question.
  *   **Camp A Refusal:** If Arm 1 wins on bits, Camp A maintains the belief is still real if it remains stable across *different* coding schemes, arguing bit-cost is not the sole criterion for pattern reality. This is recorded as a failure to move on the criteria for reality.

  ### 4. Verbal vs. Real Dispute

  We have analyzed the semantic residue of our disagreement to isolate substantive conflicts from terminological divergence.

  **"Real"**
  *   **Camp A:** Uses "real" to mean *indispensable for prediction across interests*. If you can't delete it without losing compression, it's real.
  *   **Camp B:** Uses "real" to mean *fundamental constituent*. If it can be reduced to physics without loss, it was never real, only useful.
  *   **Verdict:** This is largely verbal. Both agree the phenomenon exists; they disagree on whether "existence" grants ontological citizenship or merely utility visa.

  **"In Principle"**
  *   **Camp A:** Treats "in principle" claims about physical completeness as idle. If the computation cannot be cashed within the lifetime of the universe, the promissory note is worthless.
  *   **Camp B:** Treats "in principle" claims as the truth-condition for ontology. Practical intractability does not change what exists, only what we can know.
  *   **Verdict:** Substantive. This is a conflict over whether ontology is constrained by epistemic accessibility.

  **"The Data"**
  *   **Camp A:** Includes behavioral regularities and functional roles as part of the data to be compressed.
  *   **Camp B:** Restricts "data" to physical states (activations/weights). Behavior is derived, not primary.
  *   **Verdict:** Substantive. This determines the baseline for what counts as a "pattern."

  **Residue Quantification**
  Once verbal disputes are stripped, the remaining disagreement is thin but non-zero. It reduces to a normative claim about scientific practice: **Should ontology track compressive utility (A) or fundamental composition (B)?**
  We estimate this residue accounts for approximately **15%** of our total disagreement weight. The remaining **85%** is verbal divergence over the labels "real," "pattern," and "instrument," coupled with agreement on all empirical predictions regarding model $M$. We acknowledge that if the Double-Bookkeeping Protocol yields a decisive win for Arm 2, Camp B's refusal to update ontological status renders further collaboration on *ontology* futile, though collaboration on *safety* (using whichever tool works) remains viable.

  **Signed,**
  *Camp A Representatives*
  *Camp B Representatives*
