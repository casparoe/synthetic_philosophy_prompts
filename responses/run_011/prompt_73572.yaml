      *Refining the Test:* The test needs to show where they diverge. If A says "Intentional is shorter" and B says "Physical is truer," the test measures length. If B admits length matters but says truth matters more, that's the deadlock. I need to capture that.

      *Refining the Verbal/Real:* The residue is likely about *normative* status of ontology. Is ontology descriptive or prescriptive?

      *Let's write.*

      *(Self-Correction on Claims)*: Make sure Claim 7 (Temperature) is clear. Both agree temperature is "real enough" for thermodynamics, but disagree on *why*. Actually, the prompt asks for a neutral case where "both are realists." So I should frame it as: Both agree temperature is a valid target of discourse that isn't eliminated by microphysics.
      *(Self-Correction on Test)*: The prompt asks: "if either camp would refuse to move no matter what number came out, say so explicitly." This is crucial. Camp B might say "Even if Intentional is shorter, Physical is the *only* reality." I must record this.

      *(Self-Correction on Word Count)*: Keep descriptions tight.

      *(Final Review against constraints)*:
