answer: |-
  # The 11 P.M. Advance Directive Protocol (ADP)

  **Purpose:** To resolve conflicts between a patient's current clinical state and a prior advance directive (AD) within 20 minutes.
  **Users:** ICU Fellows, Hospitalists, Social Workers.
  **Philosophical Grounding:** Dworkin's Critical Interests (narrative integrity) vs. Experiential Interests (current sensation); Psychological Continuity (identity over time).

  ---

  ## Part 1: The Decision Procedure

  ### Step 1: Validity and Applicability (5 Minutes)
  *Goal: Determine if the document exists and speaks to this specific moment.*

  1.  **Is there a written directive?**
      *   **No:** Proceed to "No Directive Protocol" (see Part 4).
      *   **Yes:** Proceed to Q2.
  2.  **Is it specific to this intervention?**
      *   *Test:* Does it mention "intubation," "antibiotics," "feeding tube," or "psychiatric medication"?
      *   *Vague language (e.g., "no heroics"):* **ESCALATE.** This is a values question. Call the Attending. If Attending and Caller disagree, call Ethics on-call.
      *   *Specific language:* Proceed to Q3.
  3.  **Is it outdated or contradicted?**
      *   *Test:* Is it >10 years old OR is there a verbal statement from the patient within the last 6 months (while competent) contradicting it?
      *   *Yes:* **ESCALATE.** Presumption of validity is weakened. Call Attending to weigh recent verbal vs. old written.
      *   *No:* The document is **Provisionally Valid.** Proceed to Step 2.

  ### Step 2: The Psychological Continuity Test (5 Minutes)
  *Goal: Determine if the person in the bed is the same moral agent who wrote the directive.*

  1.  **Assess Current Awareness:**
      *   *Evidence obtainable at 11 P.M.:* Can the patient state their name? Do they recognize family? Do they recall the reason for the directive (if asked)?
      *   *Scoring:*
          *   **High Continuity:** Oriented, recalls values, consistent personality.
          *   **Low Continuity:** Disoriented, does not recognize loved ones, personality fundamentally altered (e.g., cheerful vs. previously stoic).
  2.  **The Decision Rule:**
      *   If **High Continuity**: The Earlier Self and Now Self are one. The Directive binds strongly. Go to Step 3.
      *   If **Low Continuity**: The Earlier Self is effectively a different person. The Directive's authority is **reduced**. Go to Step 3, but apply the "Reason Test" strictly.

  ### Step 3: The Instruction vs. Reason Test (5 Minutes)
  *Goal: Address the "wrinkle." Does the instruction bind if the reason no longer applies?*

  1.  **Identify the Stated Reason:**
      *   Look at the directive or ask the surrogate: *Why* did they refuse this? (e.g., "I don't want to be a burden," "I fear pain," "I don't want to live without dignity.")
  2.  **Assess Current Reality:**
      *   Is the patient currently experiencing the state they feared?
      *   *Evidence:* Pain scales, observation of distress, surrogate report of "suffering."
  3.  **The Ruling:**
      *   **If the Reason Still Applies:** (e.g., They feared pain, they are in pain). **Follow the Instruction.**
      *   **If the Reason Does Not Apply:** (e.g., They feared indignity, but they appear content/cheerful; They feared burdening family, but family wants treatment).
          *   *If Continuity was High (Step 2):* **Follow the Instruction.** (The Earlier Self's critical interest in narrative integrity overrides current happiness).
          *   *If Continuity was Low (Step 2):* **Override the Instruction.** (The "Now Self" is a new moral patient; we cannot sacrifice their experiential interests for a dead self's critical interests based on a false premise).
      *   **If Reason is Unknown:** **Follow the Instruction.** (Default to autonomy of the Earlier Self).

  ### Step 4: Revocation Capacity (For Psychiatric/Behavioral Cases)
  *Goal: Determine if the patient can cancel the directive now.*

  1.  **Is the patient currently refusing the treatment mandated by the directive?**
      *   **No:** Proceed with treatment.
      *   **Yes:** Proceed to Q2.
  2.  **Does the directive specify conditions for revocation?**
      *   *Test:* Does it say "I can change my mind at any time" or "This stands even if I object later" (Ulysses clause)?
      *   **If Ulysses Clause exists:** **Revocation Invalid.** Treat. The point of the contract is to bind the manic self.
      *   **If No Clause:** Assess Capacity to Revoke.
          *   *Test:* Can they articulate the risk of refusing? Do they understand the directive existed?
          *   *If Incapacitated (due to the condition the directive covers):* **Revocation Invalid.** Treat.
          *   *If Capacitated:* **Revocation Valid.** Stop.

  ---

  ## Part 2: Mechanics & Escalation

  **Where the Procedure Stops (Flat No):**
  *   If Step 1 fails (No directive, no surrogate, no evidence of values) -> **Treat.** (Default to preservation of life).
  *   If Step 4 rules Revocation Invalid -> **Treat.** (Do not argue with a manic patient at 11 P.M.).

  **Where to Escalate (Values Questions):**
  *   **Who:** The Covering Attending.
  *   **Protocol:** Do not ask "What should we do?" Ask: "The directive says X, the patient is doing Y. Step 3 of the protocol suggests Z. Do you concur?"
  *   **If Attending Disagrees with Protocol:** Call Ethics On-Call. Do not implement the Attending's override without Ethics confirmation unless it is an immediate life-saving emergency where delay causes irreversible harm.

  **Documentation (The Note):**
  *   Do not write "Ethics consulted." Write: "Advance Directive Protocol Applied."
  *   Document the specific evidence for Step 2 (Continuity): *e.g., "Patient unable to recognize daughter; stated name incorrectly."*
  *   Document the specific evidence for Step 3 (Reason): *e.g., "Directive cited fear of pain; patient currently sedated and pain-free."*
  *   Final Plan: *e.g., "Directive overridden due to Low Continuity + Mismatched Reason."*

  **The "No Directive" Protocol:**
  *   Send calls to the **Legal Surrogate** (Next of Kin).
  *   Instruction to Surrogate: "We need to know what *they* would have wanted, not what *you* want."
  *   If Surrogate is unsure: **Treat.** (Beneficence default).

  ---

  ## Part 3: Case Runs

  ### Case 1: The Cheerful Dementia Patient
  *   **Facts:** 79M, moderate dementia. AD refuses antibiotics for pneumonia. Patient is cheerful, sings, asks for ice cream. Daughter wants treatment.
  *   **Step 1 (Validity):** AD exists, specific to antibiotics. Valid.
  *   **Step 2 (Continuity):** **Low.** Moderate dementia + personality shift (cheerful vs. likely prior stoicism). He is not the same moral agent.
  *   **Step 3 (Instruction vs. Reason):**
      *   *Reason:* Usually "loss of dignity" or "suffering."
      *   *Reality:* He is cheerful, eating ice cream. The feared state is not present.
      *   *Rule:* Low Continuity + Reason Mismatch = **Override Instruction.**
  *   **Verdict:** **Treat with Antibiotics.**
  *   **Note to User:** This overrules your leanings. Your lean prioritizes the Earlier Self's critical interest. This procedure prioritizes the Now Self's experiential interest when continuity is broken and the Earlier Self's premise (that life would be miserable) is proven false by observation.

  ### Case 2: The Huntington's Patient
  *   **Facts:** 40F, Huntington's. AD says no feeding tube *once she stops recognizing her children*. She still recognizes them. She is starving, says "I'm not hungry," asks to go home.
  *   **Step 1 (Validity):** AD exists, specific condition attached. Valid.
  *   **Step 2 (Continuity):** **Mixed/High.** She recognizes children, articulates desire to go home.
  *   **Step 3 (Instruction vs. Reason):**
      *   *Instruction:* No tube.
      *   *Condition:* "Once stops recognizing children."
      *   *Reality:* She still recognizes them.
      *   *Rule:* The condition for the instruction has not been met. The directive is not yet active.
  *   **Verdict:** **Treat (Insert Tube).**
  *   **Rationale:** This is a contractual condition. Until the condition triggers, the default is preservation of life. Her current statement ("I'm not hungry") is a symptom of the disease, not a competent revocation.
  *   **Escalation:** Confirm with Attending that "recognition" is clinically assessed as intact.

  ### Case 3: The Ulysses Contract (Psychiatry)
  *   **Facts:** Manic patient. AD (signed during stability) says "Medicate me if I become manic and refuse." He is now manic, refusing, arguing articulately, wants to revoke.
  *   **Step 1 (Validity):** AD exists, specific to meds. Valid.
  *   **Step 2 (Continuity):** **Low.** Mania alters judgment and identity, though psychological continuity is less fractured than dementia.
  *   **Step 4 (Revocation Capacity):**
      *   *Directive Type:* Ulysses Contract (pre-commitment).
      *   *Condition:* "If I become manic and refuse."
      *   *Reality:* He is manic and refusing.
      *   *Rule:* Revocation requires capacity. The directive explicitly anticipates refusal during incapacity.
  *   **Verdict:** **Revocation Invalid. Medicate.**
  *   **Rationale:** The "Self at the Mast" cannot cut the ropes. That defeats the purpose of the contract. The Earlier Self's critical interest in stability overrides the Now Self's experiential desire for mania.

  ---

  ## Part 4: Systematic Failures (Where the Machine Lies)

  This procedure will generate defensible answers that are ethically fragile in the following ways:

  1.  **The "Cheerfulness" Trap (Case 1 Failure):** The procedure relies on the caller's assessment of "cheerful" or "content." A tired fellow may interpret sedation or frontal-lobe disinhibition as "happiness." This procedure will systematically override directives for demented patients who appear placid, potentially violating the Earlier Self's dignity in favor of a chemically induced calm.
  2.  **The Literalism Trap (Case 2 Failure):** In Case 2, the procedure forces treatment because the technical trigger ("recognition") hasn't tripped, even if the *spirit* of the directive (avoiding decline) is active. It privileges legalistic conditions over holistic intent. It will force feeding on patients who are clearly dying, provided they still know their daughter's face.
  3.  **The Surrogate Bias:** In "No Directive" cases, the procedure defaults to the Legal Surrogate's interpretation of "what they would want." In practice, at 11 P.M., this becomes "what the surrogate wants." The procedure lacks a brake for surrogates who project their own grief or guilt onto the patient.
  4.  **False Precision on Continuity:** Step 2 asks for a binary High/Low continuity score. Identity is not binary. The procedure forces a cutoff where none exists, giving the caller false confidence that they have "solved" the identity problem rather than just making a guess.
  5.  **The Attending Bottleneck:** The escalation path relies on an Attending who "hasn't read the chart." If the Attending rubber-stamps the Fellow's application of the protocol to go home faster, the "Values Check" becomes a sham. The procedure cannot police fatigue.

  **Final Instruction:** If you feel a "gut check" alarm going off while running this flowchart, **stop.** The flowchart is a tool for clarity, not a shield for conscience. If the result feels wrong, escalate to Ethics immediately, regardless of the hour.
