prompt: |-
  Every other week I take the ethics pager for the county hospital across town — the philosophy department has this arrangement with them and I'm the "ethics resource," which in practice means a resident or a social worker calls me at eleven at night to ask whether they can put a tube in somebody. A lot of these are advance-directive calls, and I've had to admit to myself that I don't actually have a procedure for them. I have intuitions and a reading list, and neither one is any use to a tired ICU fellow on the phone.

  So write me a decision procedure I could hand to that fellow — or to a social worker, somebody with no philosophy — and have them run it in about twenty minutes on a directive conflict. Ground it in what's actually load-bearing here: the earlier-self-versus-now-self problem; Dworkin's distinction between interests in how a particular moment feels and interests in how a whole life goes, and the argument that the earlier self gets to bind the later one; and the counterargument, which I think is stronger than I used to, that we simply don't know what its like to be the patient in the bed now, so we shouldn't be so sure what she'd want. If you think the honest answer is graded rather than binary — that how much a directive counts for depends on how much the person in the bed is still psychologically the person who wrote it — then build that in as a real step with a real test, not a footnote, and tell me what evidence obtainable at 11 p.m. on a night shift could possibly bear on it.

  Here's the wrinkle I keep hitting that I want handled explicitly. I think there are two different things a directive can be and the whole debate talks as if there were one: an instruction ("do not intubate me") and a piece of testimony about why the person thought that ("because I watched my father spend two years unable to swallow and I don't want my kids watching that with me"). When the testimony is there and the stated reason no longer applies — the patient isn't suffering, isn't watching anything, seems genuinely okay — does the instruction still bind? Give me a step for this and tell me straight which way you came out, because I lean hard toward the instruction binding regardless and I want to know if your procedure has to overrule me.

  Then the mechanics. Questions in order; for each one, what counts as a sufficient answer and what counts as "we don't know, so escalate"; where the procedure stops at a flat no; where it hands the decision to a human because the question is about values rather than facts — and *which* human, since at that hour it's a covering attending who hasn't read the chart; what gets written in the note; and what to do with a directive that's thirty years old, or five words long, or contradicted by something the patient said last month while arguably still competent. Also one line on where you send the calls where there's no directive at all, which is honestly half of them. Don't give me a bibliography, I know the literature, I want the machinery.

  Then run it on three cases. One: a 79-year-old with moderate dementia whose directive refuses antibiotics for pneumonia; he's cheerful, sings along to the radio, asks for ice cream three times a day; his daughter wants him treated and says her father is "not the man who wrote this." Two: a woman in her forties with Huntington's whose directive says no feeding tube once she stops recognizing her children; she still recognizes them, but she's stopped eating enough and losing weight fast, and when asked she says "I'm not hungry" and ten minutes later says "when can I go home." Three: a man who wrote what the psychiatrists call a Ulysses contract — during a stable stretch he directed that he be given a particular medication if he became manic and refused; he is now manic, refusing, arguing articulately that he's fine, and asking to revoke the directive. For that last one the procedure has to answer the revocation question head-on: can the self at the mast cut the ropes?

  Finish with where this thing will misfire. Not the hard cases it struggles with — the systematic failures, and the spots where it will generate a defensible-sounding answer that's really just the caller's gut wearing a flowchart.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** An ethics consultant/philosopher covering a county hospital on night shifts.
      *   **Task:** Create a practical decision procedure (algorithm/flowchart style) for residents/social workers to use at 11 PM regarding advance directive conflicts.
      *   **Constraints:**
          *   Must be runnable in ~20 minutes.
          *   Must be usable by non-philosophers (tired ICU fellows, social workers).
          *   Must ground in specific philosophical concepts: Earlier-self vs. Now-self, Dworkin's critical vs. experiential interests, psychological continuity.
          *   Must handle the "Instruction vs. Testimony" wrinkle explicitly (does the instruction bind if the reason no longer applies?).
          *   Must include mechanics: Questions, sufficient answers, escalation points, "flat no" stops, who to call for values questions, documentation, handling old/vague/contradictory directives, and cases with *no* directive.
          *   Must apply the procedure to three specific cases (Dementia/Antibiotics, Huntington's/Feeding Tube, Psychiatric/Ulysses Contract).
          *   Must end with a critique of the procedure's systematic failures (where it generates false confidence).
          *   **Tone:** Professional, direct, pragmatic, acknowledging the philosophical depth but prioritizing clinical utility. No bibliography.

  2.  **Deconstruct the Philosophical Core:**
      *   *Dworkin:* Critical interests (life narrative integrity) vs. Experiential interests (moment-to-moment pleasure/pain). Advance directives usually protect critical interests.
      *   *Psychological Continuity:* To what extent is the current patient the same person who wrote the directive? If continuity is broken, the directive's authority weakens.
      *   *Instruction vs. Testimony:* Is the directive a command ("Do not intubate") or evidence of values ("I hate being dependent")? If the current state doesn't match the feared state, does the command stand? The user leans toward "command binds," but wants the procedure to challenge that if appropriate.
      *   *Revocation:* Can the current self revoke the past self's decision? (Especially in psych cases).

  3.  **Drafting the Procedure (The "Machinery"):**
      *   *Structure:* Needs to be step-by-step.
      *   *Step 1: Validity & Applicability.* Is there a directive? Is it relevant? (Handles the "no directive" and "30 years old" issues).
      *   *Step 2: The Continuity Test.* Is the patient psychologically continuous with the author? (Handles the dementia/identity issue). Needs concrete 11 PM evidence.
      *   *Step 3: Instruction vs. Reason.* Does the current situation match the *reason* for the directive? (Handles the "wrinkle").
      *   *Step 4: Revocation Capacity.* Can the current patient revoke? (Handles the Ulysses case).
      *   *Escalation:* Who to call when stuck? (Attending vs. Ethics vs. Legal).
      *   *Documentation:* What to write.

  4.  **Refining the "Instruction vs. Testimony" Wrinkle:**
      *   The user leans toward the instruction binding regardless of the reason.
      *   *Philosophical Counter:* If the reason was "I don't want to suffer," and they aren't suffering, enforcing the instruction might violate the *intent* of the critical interest.
      *   *Decision:* The procedure should prioritize the *Instruction* unless there is clear evidence the *Reason* was the sole condition. However, if the "Now Self" is clearly content and the "Earlier Self" feared *this specific state of suffering*, the Instruction might be voided by changed circumstances. I need to take a stand. I will side with the *Instruction* as the default (respecting autonomy of the earlier self) but allow an override if the *Reason* was explicitly conditional and the condition is demonstrably false. This balances Dworkin's critical interests with the "unknown experience" counterargument.

  5.  **Developing the Three Cases:**
      *   *Case 1 (Dementia/Antibiotics):* Continuity is low. Reason (suffering/loss of dignity) might not apply if he's cheerful. Instruction says no antibiotics. *Verdict:* Treat? Or follow directive? If continuity is broken, the earlier self's critical interests might still hold weight (Dworkin), but if the "Now Self" is happy, overriding them causes harm. This is the hardest one. I need to follow the procedure strictly.
      *   *Case 2 (Huntington's/Feeding Tube):* Condition ("stops recognizing children") hasn't met yet. Instruction says no tube *once* that happens. She isn't eating. *Verdict:* Follow directive? No, condition not met. But she's losing weight. This is a "technicality" vs. "spirit" conflict.
      *   *Case 3 (Psych/Ulysses):* Revocation during incapacity. *Verdict:* Cannot revoke. The point of a Ulysses contract is pre-commitment during capacity.

  6.  **Addressing the "Systematic Failures":**
      *   Where does this flowchart lie?
      *   It creates false precision.
      *   It biases toward the written word over the living body.
      *   It relies on the caller's assessment of "cheerfulness" or "recognition."
      *   It doesn't solve the "who decides the continuity" problem.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the context. Keep it tight.
      *   *The Procedure:* Use bold headers. Numbered steps. Clear "If/Then" logic.
      *   *The "Wrinkle":* Make Step 3 specifically about Instruction vs. Reason.
      *   *The Cases:* Apply the steps mechanically.
      *   *The Failures:* Be honest about the limitations.

      *(Self-Correction during drafting)*: I need to make sure I answer the "30 years old" and "5 words long" questions in the mechanics section.
      *   *30 years old:* Presumptively valid unless revoked, but weight decreases if life circumstances changed drastically.
      *   *5 words long:* Valid if clear (e.g., "No Tubes"), invalid if vague ("No heroics").
      *   *No Directive:* Default to treatment/stabilization unless clear evidence of contrary values (surrogate standard).

      *(Refining the "Instruction vs. Reason" stance)*: The user says they lean hard toward the instruction binding. I should respect that but build the safety valve for the "reason no longer applies" scenario. I will rule that the Instruction binds *unless* the Reason was explicitly conditional and the condition is objectively unmet. This protects the Earlier Self's critical interest (Dworkin) while acknowledging the "Now Self" reality.

      *(Refining the "Who to Call" for values)*: At 11 PM, it's the Attending. But the Attending hasn't read the chart. The procedure needs to force a brief huddle. If the Attending and Caller disagree, *that's* when Ethics gets called (even at night).

      *(Refining Case 1)*: If the patient is cheerful, does the directive bind? Dworkin says yes (critical interests trump experiential). But the prompt asks to weigh the "we don't know what it's like" argument. I will have the procedure lean toward *treating* if continuity is severely broken and current state is positive, overriding the directive. This challenges the user's leanings slightly but fits the "psychological continuity" test requested. *Wait, re-reading prompt:* "tell me straight which way you came out, because I lean hard toward the instruction binding regardless and I want to know if your procedure has to overrule me." Okay, I need to take a stand. I will argue that if the *Reason* is demonstrably false (he is not suffering), the Instruction loses force. This overrules the user's leanings slightly but is more ethically robust for the "Now Self."

      *(Refining Case 3)*: Ulysses contracts. Can the self at the mast cut the ropes? Standard bioethics says No, if the contract was made during capacity and specifies that revocation during incapacity is invalid. The procedure must reflect this.

  8.  **Final Review against Constraints:**
      *   20 minutes? Yes, it's a checklist.
      *   Non-philosopher friendly? Yes, plain English.
      *   Grounded in Dworkin/Continuity? Yes, built into Steps 2 & 3.
      *   Instruction vs. Testimony handled? Yes, Step 3.
      *   Mechanics (notes, escalation, no directive)? Yes, Section 4.
      *   Three cases run? Yes, Section 5.
      *   Systematic failures? Yes, Section 6.

  9.  **Final Polish:** Ensure tone is empathetic to the tired fellow but rigorous on the ethics. (Proceed to generate output).

  *(Self-Correction on Case 1)*: I need to be careful. If I say "Treat the dementia patient," I am prioritizing the Now Self's experiential interests over the Earlier Self's critical interests. Dworkin argues the Earlier Self wins. The prompt asks me to weigh the counterargument ("we don't know what it's like"). I will structure the procedure to favor the Directive *unless* the discontinuity is profound. In Case 1, moderate dementia + cheerful suggests high discontinuity. I will rule for Treatment, explicitly noting this overrules the user's "instruction binds" lean in favor of the "unknown experience" argument.

  *(Self-Correction on Case 2)*: She recognizes them. Directive says "once she stops." Technically, directive hasn't triggered. But she's starving. This is a "condition not met" case. Procedure should say: Follow directive conditions literally. If condition not met, treat as no directive (surrogate decision).

  *(Self-Correction on Case 3)*: Ulysses. Can he revoke? No. The procedure must state that revocation requires the same capacity threshold as creation.

