answer: |-
  Here is the audit, the legal check, and the verdict. No hedging.

  ### 1. The Contract Analogy Audit

  Your brother is trying to import the logic of commercial exchange into a familial obligation. To see why it fails, we have to map the terms exactly as he implies them, and then look at where the wiring shorts out.

  **The Mapping:**
  *   **The Contract:** Your verbal agreement to help.
  *   **The Consideration:** This is the first break. In law, a contract requires an exchange of value (money, goods, reciprocal promise). You offered labor; she offered... nothing. It was a gratuitous promise. In strict contract law, this is unenforceable from the start.
  *   **The Counterparty:** Your sister.
  *   **The Court:** In this analogy, "reality" or "consequences" act as the judge.
  *   **The Damages:** The tangible cost she incurs (renting a van, taking time off).
  *   **The Release:** Mutual agreement or "force majeure" (true impossibility).
  *   **The Binding Mechanism:** Your brother argues this is *Reliance*. You argue (implicitly) it is *Fidelity*.

  **The Disanalogies (Decorative):**
  *   Paperwork, specific verbal phrasing ("I promise" vs. "I'll try"), the presence of a witness. These don't matter.
  *   The timeline (3 weeks out vs. 3 days out). Contracts can be formed years in advance.

  **The Disanalogies (Matter):**
  *   **Efficient Breach:** Contract law allows for "efficient breach." If paying damages is cheaper than performing, you are allowed to break the contract and pay. Your brother is arguing for this: "I didn't cost her money, so I'm clear." Promises do not allow efficient breach. You cannot "pay" your sister in cash to make a broken promise morally neutral.
  *   **Third-Party Enforcement:** Contracts rely on an external power (the state) to enforce them. Promises rely on internal governance (conscience, integrity, relationship capital). When you remove the external enforcer, the "no harm, no foul" logic collapses because the damage is to the *relationship*, not the balance sheet.
  *   **Timing of Obligation:** In contract, obligation exists upon agreement. Your brother argues obligation exists upon *reliance*. This is the critical fracture. If obligation only starts when she spends money, then for those three weeks, you weren't under obligation; you were just "likely to show up." That negates the definition of a promise.

  ### 2. The Legal Claim: Inside the Doctrine

  Your brother is legally wrong, even by his own metric. He is conflating **Contract** with **Promissory Estoppel**.

  *   **The Rule (Contract):** A promise is binding if there is **Consideration** (exchange). Reliance is irrelevant to formation. If you had signed a paper saying "I will move you for $1," you would be bound immediately, even if she spent $0 preparing.
  *   **The Exception (Promissory Estoppel):** This is the doctrine your brother is actually citing. It says: "If there is *no* contract (no consideration), but the promisee *reasonably relied* on the promise to their detriment, the court may enforce it to prevent injustice."
  *   **The Error:** Your brother is treating the *exception* (Estoppel/Reliance) as the *rule*. He argues that without reliance, there is no binding force. But Promissory Estoppel is a shield used to recover losses when a contract *failed* to form. It is not the definition of a promise; it is the safety net for when a promise breaks and money is lost.

  Furthermore, legal enforceability is not the same as moral bindingness. The law sets a floor (when can we sue?), not a ceiling (when are you a good person?). Using the legal floor as a moral ceiling is a category error. If the law says "you can't sue him," your brother hears "he did nothing wrong." That is a non-sequitur.

  ### 3. What Makes a Promise Bind?

  If it isn't enforcement and it isn't harm, what is it?

  A promise is a **transfer of authority over your future will.**

  When you promise, you are not predicting the future ("I will probably help"). You are attempting to control it ("I *will* help"). You give the promisee the right to count on you. You restrict your own future freedom for their sake.

  *   **The Limit Cases:**
      *   *Promise nobody acted on:* If you promise to meet me for coffee and I haven't left my house yet, and you don't show, you broke the promise. I suffered no logistical harm, but you violated the agreement of wills.
      *   *Promise to yourself:* No external reliance is possible. Yet you can break it. The binding force is your own integrity, not external detriment.
      *   *Gratuitous Promise:* "I'll buy you dinner." No contract. No reliance needed. If I don't show, I wronged you, even if you ate at home.

  The obligation is created **ex ante** (at the moment of promising), not **ex post** (after reliance). Reliance amplifies the *consequences* of breaking the promise, but it does not create the *duty*.

  Your brother's model suggests you are free until she spends money. The correct model is that you are bound until she releases you.

  ### 4. The Verdict

  **Did you wrong her or merely inconvenience her?**

  You **wronged** her.

  Inconvenience is a logistical problem (e.g., "The van broke down"). Wronging is a normative violation (e.g., "I told you I would be there, and I chose not to be").

  Your brother's argument is that because the logistical cost was low (she hadn't booked the van), the normative violation is null. This is false. The injury is not the cost of the van; the injury is the **revocation of security.**

  For three weeks, she operated under the assumption that she had your labor secured. That assumption allowed her to plan her mental and physical resources. By bailing two days out without a "release" (her agreement to let you off), you unilaterally revoked that security. You treated your word as a placeholder rather than a commitment.

  **Does the brother's argument survive?**
  No. It collapses because it relies on a misunderstanding of contract law (confusing Estoppel with Consideration) and a reduction of moral obligation to financial liability. It treats the promise as a bet on your behavior rather than a commitment of your character.

  ### 5. A Better Analogy: The "Security Deposit" Model

  Contract law is the wrong model because it is transactional. A better analogy for a familial promise is **holding space in a structure.**

  **The Audit of the Security Analogy:**
  *   **The Promise:** You hand her a key to a room you reserved for her in your schedule.
  *   **The Reliance:** She decides to put her stuff in that room.
  *   **The Breach:** You lock the door two days before move-in.
  *   **The Damage:** Even if she hadn't put her stuff in yet, you rented out her room to someone else (your "something came up"). She no longer has the room.
  *   **The Remedy:** You cannot just say "You hadn't moved in yet." You have to acknowledge you took back the key without permission.

  **Why this fits:**
  It captures the **exclusivity** of a promise. When you promised her, you implicitly told other potential commitments "No, I am booked." When you bailed, you didn't just free yourself; you reclaimed time you had already gifted.

  **Conclusion:**
  You owe her more than a heads-up. You owe an apology that acknowledges you broke a commitment, not just that you caused a scheduling conflict. Your brother is offering you a legalistic shield to protect your ego from the reality that you failed to prioritize your word. Put the shield down. You made a promise, and you broke it. The lack of financial damages makes it a *cheap* wrong, but it is still a wrong.
