answer: |-
  1. If a classification loops perfectly, it becomes invisible background noise, yet you claim exhaustion also looks like stability. How do you distinguish a category that has succeeded so well it's invisible from one that has exhausted its generative power?
  Follow-up: If you say we look for narrative stagnation, doesn't that rely on the very hermeneutics the loop has already colonized? Concession: She must concede her metric is internally contaminated.

  2. You admit it's not clear what observation would show otherwise. So, what specific empirical finding would force you to abandon the exhaustion thesis?
  Follow-up: If you cite a new subtype, isn't that just re-describing old behavior rather than proving generative capacity? Concession: She must concede novelty is indistinguishable from redescription.

  3. You emphasize first-person vocabulary, but that vocabulary travels through clinicians, insurers, and TikTok symptom-checkers. If patients under 'Borderline' develop divergent self-concepts via these channels, is that one exhausted loop or several competing ones?
  Follow-up: If you say several, doesn't that fragment the DSM category's explanatory power entirely? Concession: She must concede the DSM unit is ontologically unstable.

  4. If the measuring instrument is rewritten by the thing it measures, how do you salvage prevalence estimates or RCT validity where the phenotype shifts during the trial?
  Follow-up: If you admit validity degrades, must we not treat current evidence-based guidelines as historically bounded artifacts? Concession: She must concede current clinical guidelines are epistemically compromised.

  5. You claim administrative labels loop weakly without first-person uptake. But doesn't being labeled "high risk" by an algorithm change behavior even without first-person vocabulary?
  Follow-up: If behavior changes without vocabulary, isn't your necessary condition for looping empirically false? Concession: She must concede vocabulary is not strictly necessary.

  6. Hacking described looping decades ago. Why is the generative capacity depleted now rather than then? Is exhaustion a property of the categories or our cultural consumption of them?
  Follow-up: If it's cultural consumption, isn't exhaustion just a trend rather than a structural feature of classification? Concession: She must concede exhaustion is transient, not structural.

  7. If loops are exhausted, can patients still resist categories, or does exhaustion imply the categories have become too rigid for resistance to generate new kinds?
  Follow-up: If resistance fails to generate new kinds, isn't the looping effect effectively dead rather than exhausted? Concession: She must concede the mechanism has ceased functioning.

  8. If categories no longer generate new persons, is there any pragmatic justification for maintaining the DSM taxonomy beyond bureaucratic inertia?
  Follow-up: If you say coordination, doesn't that prioritize administration over the first-person experience you claim matters most? Concession: She must concede her theory undermines its own practical application.

  Verdict: 2 Theory immune to empirical refutation.
