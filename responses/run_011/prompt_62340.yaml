answer: |-
  ### The Spec: Requirements for Subject Composition

  Here is the specification list for any theory claiming many subjects compose one subject. I have marked each item as either a **Metaphysical Non-Negotiable** (the theory breaks without it) or a **House Preference** (a specific philosophical camp or narrative choice that incurs a cost).

  1.  **Unity of Experience:** There must be a single locus of "what it is like" to be the whole. It cannot be merely a collection of parallel experiences.
      *   *Status:* **Metaphysical Non-Negotiable.** Without this, you have a plurality, not a "we."
  2.  **Base Dependence:** The properties of the whole must be determined by the properties and relations of the parts.
      *   *Status:* **Metaphysical Non-Negotiable (for Panpsychism).** If the whole's experience isn't built from the parts' experience, you are an emergentist, not a panpsychist.
  3.  **Boundary Criterion:** There must be a principled reason why *these* parts compose *this* whole, and why other nearby parts are excluded.
      *   *Status:* **Metaphysical Non-Negotiable.** Without this, the subject bleeds into the environment or dissolves into the universe.
  4.  **Qualitative Novelty:** The whole can feel emotions or sensations that no individual part feels.
      *   *Status:* **House Preference (Emergentist).** Strict panpsychism struggles here. If the whole is *just* the parts, where does the new quality come from?
  5.  **Diachronic Continuity:** The subject must persist through time despite changes in parts (death) or states (sleep).
      *   *Status:* **House Preference (Narrative).** Metaphysically costly. Requires a theory of identity that survives gaps in existence or composition.
  6.  **Independent Memory Storage:** The whole can access data from a part that no longer exists and never shared that data while alive.
      *   *Status:* **House Preference (High Cost).** Requires the whole to have a storage mechanism independent of the parts' current existence.

  ---

  ### Critique of Your Draft List

  *   **Bullet 1 (Real Subject):** **Non-Negotiable.** If this fails, your narrator is a metaphor, not a character.
  *   **Bullet 2 (Follow from Parts):** **Non-Negotiable for Panpsychism.** This is the definition of the view. If you drop this, you are writing emergentism.
  *   **Bullet 3 (Novel Qualities):** **House Preference.** This directly conflicts with Bullet 2. Strict panpsychism says the whole's experience is a summation of the parts' experiences. If the town feels dread no individual feels, you have smuggled in emergence. You can keep this, but you must admit you are not a strict panpsychist.
  *   **Bullet 4 (Boundary Criterion):** **Non-Negotiable.** You need a rule for why the kid is out and the shopkeeper is in. Is it geography? Consent? Duration of stay? Without this, the narrator's voice becomes arbitrary.
  *   **Bullet 5 (Residue/Dead Memory):** **House Preference (Likely Indefensible).** See verdict below. This is the biggest threat to your metaphysical consistency.
  *   **Bullet 6 (Intermittency):** **House Preference.** Survivable, but requires you to define identity as a pattern rather than a continuous substance. If the town "dies" at night, the morning town is a replica unless there is a carrier of identity (like a written record or a shared unconscious).

  ---

  ### The Conflict: Bullets 2 and 3

  You suspected trouble here. You are correct.
  *   **Bullet 2** says the whole is nothing over and above the parts.
  *   **Bullet 3** says the whole is *more* than the parts (it feels new things).
  *   **The Clash:** You cannot have strict derivation (2) and radical novelty (3) simultaneously. If the town feels a dread no individual feels, that dread must either be (a) present in the individuals but unnoticed by them (hidden variable), or (b) emergent (violating 2).
  *   **The Fix:** Choose one. Either the individuals *do* feel a fragment of the dread they can't name (preserves 2), or you admit the town is an emergent entity that supervenes on the people but isn't strictly composed of their subjects (preserves 3, drops panpsychism).

  ---

  ### The Single Most Damaging Requirement

  **Boundary Criterion (Your Bullet 4).**

  This is the "Combination Problem" in its sharpest form. Physics tells you how atoms bond; metaphysics does not tell you how minds bond. Why does the town stop at the city limits? Why doesn't it include the trees? The cows? The tourists?
  *   **Why it damages theories:** Most theories fail here. If you say "proximity," you include the soil. If you say "communication," you include the internet. If you say "biological connection," you exclude the town.
  *   **Drafting Consequence:** You must write a rule into the text. The narrator must explicitly state *why* it is itself and not the county. "I am the voices within the river bend," or "I am only those who sleep on this soil." Without this, the narrator's perspective is unmoored.

  ---

  ### Parts-First vs. Whole-First

  **Parts-First (Constitutive Panpsychism):**
  *   **Fails:** Qualitative Novelty (Bullet 3) and Boundary Criterion (Bullet 4). It explains how little minds exist, but not why they snap together into *this* big mind rather than *that* one, or how the big mind feels something new.
  *   **Succeeds:** Base Dependence (Bullet 2). It keeps the metaphysics grounded.

  **Whole-First (Cosmopsychism/Priority Monism):**
  *   **The Move:** The universe (or the town) is the basic subject; individuals are carved out of it like eddies in a stream.
  *   **Escapes or Relocates?** It **relocates** the problem. It solves Combination (nothing combines; the whole was already there) but creates the **Decomposition Problem**. How does the one subject split into many without losing its unity?
  *   **Fails:** Boundary Criterion (Bullet 4) and Intermittency (Bullet 6). If the whole is basic, why is the town a subject distinct from the universe? And if the whole is fundamental, how can a fragment turn off and on (sleep) without damaging the fundamental substance?
  *   **Drafting Utility:** High. It allows the town to feel things individuals don't (because the town is the real agent). It makes the "Residue" easier (the whole remembers what the fragment forgot). But it makes the individuals less real.

  ---

  ### Family Evaluations

  **Parts-Build-Up (Constitutive Panpsychism):**
  *   **Verdict:** Best for grounding, worst for your plot.
  *   **Performance:** Satisfies Base Dependence perfectly. Fails Qualitative Novelty (cannot explain the unique dread). Struggles with Residue (dead parts take their data with them).
  *   **Drafting Tip:** Use this if you want the narrator to feel limited, struggling to understand feelings it shouldn't have.

  **Whole-First (Cosmopsychism):**
  *   **Verdict:** Best for narrative power, worst for boundaries.
  *   **Performance:** Satisfies Qualitative Novelty easily (the whole is primary). Handles Residue well (the whole stores the memory). Fails Boundary Criterion (why is the town a whole?).
  *   **Drafting Tip:** Use this if the narrator feels ancient or distinct from the people. The people are merely organs of the town.

  **No Composition (Eliminativism/Fictionalism):**
  *   **Verdict:** Metaphysically safe, narratively dead.
  *   **Performance:** Denies the narrator exists. The "we" is just a figure of speech.
  *   **Drafting Tip:** Only use this if the twist is that the town is hallucinating its own unity. Otherwise, discard.

  ---

  ### Verdict on the Residue Question

  **It is indefensible under Panpsychism.**

  If the town is composed of the people, and a person dies, that component is gone. If the town remembers that person's childhood *which the town never witnessed*, the town is accessing data it never acquired.
  *   **The Cost:** To keep this, you must imply the town subject exists *independently* of the people and uses them as temporary sensors that upload data to a central cloud. This is not panpsychism; this is idealism or theism.
  *   **What You Lose:** If you cut it, you lose the mystery of the dead woman's past.
  *   **What You Gain:** You save your metaphysics. The town can only remember what the collective experienced while the woman was alive. If you need the childhood memory, the woman must have told someone, or the town must be a separate entity haunting the people. Choose the haunting; it's more honest than the composition.
