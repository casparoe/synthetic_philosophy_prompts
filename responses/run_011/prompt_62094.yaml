  **15-55: Prediction Market.** Policies: *One-Hand* vs. *Two-Hand*. Assets trade on probability policy achieves >20 cups. Market closes. Policy with highest expected value (Price × Reward) is **mandated**.
  **55-75: Execution.** Entire room builds tower using mandated policy. Measure height.
  **75-85: Settlement.** Traders paid if they backed the winning outcome. Insiders paid if *One-Hand* was enacted, regardless of tower success.
  **85-110: Debrief.**

  **Payoffs**
  *   **Traders:** Start 2000 chips. Asset pays 1000 if condition met.
  *   **Insiders:** Get 5000 chips if *One-Hand* policy is chosen by market, even if tower falls.
  *   **Room:** Shared pizza if tower >20 cups.

  **Debrief Map**
  1.  **Values vs. Beliefs:** The vote fixed the goal (Height); the market fixed the belief (which policy achieves height). This isolates Hanson's core distinction.
  2.  **Market Power:** The price dictated reality. If Insiders pumped *One-Hand* price, the room attempted it even if Traders knew it would fail. This demonstrates governance by speculation.
  3.  **Misalignment:** Insiders profited from policy selection, not truth. Did their trading sway the market? Compare insider holdings to price movement. This highlights the "attack vector" of futarchy.
  4.  **Metric Sensitivity:** Had we voted Stability, Two-Hand wins. The "Good" outcome depends on unvoted metric definitions. This shows how measurement choices govern outcomes more than votes.

  **Failure Modes & Recovery**
