prompt: |-
  I cover research methodology for a science desk, and two norms in clinical evidence keep striking me as sitting uneasily beside each other. Guideline bodies rank evidence in a pyramid: randomized trials near the top, observational studies of the very same drug below them, and reasoning about how the drug works mechanically at the bottom, barely above expert opinion. Then, inside the trial, the analysis that counts groups patients by the arm they were assigned to rather than by whether they actually took the drug — even when a third of the treatment arm never filled the prescription and everyone concedes the resulting estimate is diluted toward zero. The analysis restricted to those who followed the protocol is set aside as biased, because adherence is settled after randomization and carries prognosis along with it.

  What conception of causation does that combination presuppose? It seems to license the thought that assignment, not ingestion, is the cause — as though a cause is whatever a policy could be built around — and yet the quantity being estimated is defined in frankly counterfactual terms, as the difference between the outcome observed and the outcome those patients would otherwise have had. Does ranking trials above observational work commit anyone to a view on which causes are only revealed by interventions, or is it just a practical worry about confounding that a counterfactual account motivates equally well? Reconstruct the implicit theory, distinguish what the practice strictly requires from what merely suits it, indicate which parts of it several incompatible theories would license anyway, and say what guideline-writing would look like if mechanistic inference were given the standing that the same tradition's insistence on results carrying over to new populations seems to demand.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** The user covers research methodology for a science desk (journalist/editor level understanding, likely high sophistication).
      *   **The Tension:** Two norms in clinical evidence seem contradictory:
          1.  *Evidence Hierarchy:* RCTs > Observational > Mechanistic/Basic Science.
          2.  *Analysis Principle:* Intention-to-Treat (ITT) > Per-Protocol (PP). ITT analyzes by *assignment*, not *ingestion*, even if adherence is low (diluting the effect). PP is rejected as biased due to post-randomization confounding.
      *   **The Core Question:** What conception of causation does this combination presuppose?
      *   **Specific Sub-questions:**
          *   Does it imply assignment is the cause (policy-based) vs. ingestion (biological)?
          *   Yet the estimand is counterfactual (outcome vs. what would have happened).
          *   Does ranking RCTs imply causes are *only* revealed by interventions, or is it just about confounding (which counterfactuals also handle)?
          *   Task: Reconstruct the implicit theory.
          *   Task: Distinguish what practice *requires* vs. what *suits* it.
          *   Task: Identify which parts are licensed by incompatible theories.
          *   Task: Speculate on guideline-writing if mechanistic inference were elevated (given the demand for generalizability/external validity).

  2.  **Initial Analysis & Philosophical Mapping:**

      *   *The ITT Paradox:* ITT estimates the effect of *offering* treatment, not *taking* treatment. This aligns with a "policy" or "decision-theoretic" view of causation (What happens if I mandate this?). However, the *justification* for RCTs is usually internal validity regarding the biological effect.
      *   *The Hierarchy:* RCTs are top because randomization breaks confounding. Observational studies suffer from confounding. Mechanistic reasoning is bottom because mechanisms can be incomplete or misleading (e.g., anti-arrhythmics killing patients despite fixing rhythm).
      *   *Causal Frameworks:*
          *   *Counterfactual (Potential Outcomes):* Dominant in modern epidemiology (Rubin/Neyman). $Y(1) - Y(0)$. ITT estimates $E[Y | Z=1] - E[Y | Z=0]$. This is a valid causal effect of *assignment* ($Z$), not necessarily *treatment* ($X$).
          *   *Manipulability/Interventionist (Woodward):* Causes are handles for manipulation. Assignment is a handle; biological mechanism is the "black box."
          *   *Mechanistic (Machamer/Darden):* Focuses on entities and activities.
          *   *Regularity/Probabilistic:* Focuses on correlation + conditions.
      *   *The Tension:* The user spots that we claim to care about the drug's effect (biology) but measure the policy's effect (assignment) to avoid bias, while simultaneously dismissing the very mechanism that explains *why* the drug works as "low evidence."

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the observation. It's a classic tension in evidence-based medicine (EBM). Name the specific causal framework: **Interventionist Counterfactualism** (specifically the Rubin Causal Model mixed with a policy-oriented pragmatism).

      *   **Reconstructing the Implicit Theory:**
          *   *Causal Relata:* The cause is the *intervention protocol*, not the biochemical event.
          *   *The Estimand:* Local Average Treatment Effect (LATE) or Effect of Assignment.
          *   *Why ITT?* Preserves randomization. Randomization ensures exchangeability *at baseline*. Adherence breaks exchangeability.
          *   *Why Hierarchy?* Randomization is the "gold standard" for identifying the counterfactual because it physically enforces independence from confounders. Mechanisms are heuristic, not proof of net benefit (due to offsetting pathways).
          *   *The Synthesis:* It's a **Pragmatic Interventionist** view. Causation is defined by what happens when you wiggle the system at the point of control (the prescription), not the point of action (the receptor).

      *   **Distinguishing Requirements vs. Suitability:**
          *   *Strictly Required:* To claim a causal effect of *assignment*, you only need randomization + ITT. You do *not* need to rank observational lower if you adjust perfectly (but you can't know you adjusted perfectly). You do *not* need to dismiss mechanisms to do ITT.
          *   *Merely Suits:* The hierarchy suits a regulatory need for liability and clear decision rules. Dismissing mechanisms suits the historical failure of surrogate endpoints (e.g., CAST trial).
          *   *The "Licensing":* Both Manipulability Theory (Woodward) and Counterfactual Theory (Lewis/Rubin) license RCTs. Mechanistic theories *could* license RCTs but often prioritize understanding the pathway.

      *   **The Counterfactual vs. Intervention Distinction:**
          *   Does ranking RCTs commit to "causes only revealed by interventions"? No. It commits to "causes are most *reliably identified* by interventions." A counterfactual account motivates this equally well because randomization is the best engine for generating valid counterfactuals.
          *   The "Assignment vs. Ingestion" issue is about *definition of the cause*. EBM defines the cause as the *clinical strategy*.

      *   **Incompatible Theories Licensing the Same Practice:**
          *   *Frequentist/Behavioral:* Focus on long-run error rates. ITT controls Type I error.
          *   *Bayesian/Decision-Theoretic:* Focus on expected utility of the policy.
          *   *Counterfactual:* Focus on unbiased estimation of $E[Y(1) - Y(0)]$.
          *   *All agree on ITT/RCTs* for different reasons (error control vs. utility vs. identification).

      *   **The Mechanistic Turn (The "What If" Scenario):**
          *   If mechanisms were elevated (as external validity demands):
          *   Guidelines would look more like *physics* or *engineering*.
          *   "Transportability" would rely on mechanistic similarity, not just population demographics.
          *   We would accept observational data if the mechanism is well-understood (e.g., parachutes).
          *   We would demand mechanistic explanations for heterogeneity of treatment effects.
          *   *Result:* A hybrid model (Evidence-Based Medicine + Mechanism-Based Medicine).

  4.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction:* Make sure not to conflate ITT with "assignment is the *only* cause." ITT estimates the effect of assignment. Instrumental Variable (IV) analysis can recover the effect of ingestion (CACE), but guidelines prefer ITT for conservatism.
      *   *Nuance:* The user asks about the *conception of causation*. It's crucial to highlight that EBM implicitly adopts a **Black-Box Causation**. The input is "Offer," output is "Health." The middle is irrelevant for *efficacy* claims, though relevant for *safety* or *generalization*.
      *   *Tone:* Match the user's high-level, analytical tone. Use terms like "exchangeability," "identifiability," "transportability," "manipulability."

  5.  **Final Polish:**

      *   Structure the essay logically: The Implicit Theory -> Requirements vs. Suitability -> Overlapping Consensus -> The Mechanistic Alternative.
      *   Ensure the distinction between *internal validity* (RCT/ITT) and *external validity* (Mechanism/Generalizability) is clear, as this is where the tension lies.
      *   Address the specific point about "assignment, not ingestion." This is the crux of the **Interventionist** account.

  6.  (Final Review against Prompt):
      *   Reconstruct implicit theory? Yes (Pragmatic Interventionist/Counterfactual).
      *   Distinguish requires vs. suits? Yes.
      *   Incompatible theories licensing it? Yes (Frequentist, Bayesian, Counterfactual).
      *   Guideline writing with mechanistic standing? Yes (Transportability focus).

  7.  **Drafting the Content:** (Mental or scratchpad)
      *   *Key phrase:* "The cause is the lever, not the gear."
      *   *Key concept:* "Exchangeability."
      *   *Key tension:* Internal validity (ITT) vs. External validity (Mechanism).
      *   *Reference:* Nancy Cartwright ("Rugby" vs. "Skyhook"), Russo-Williamson Thesis.

  8.  **Finalizing the Output:** (Proceeding to generate response based on these thoughts.)
answer: |-
  The tension you identify is the central fault line in modern Evidence-Based Medicine (EBM). It reveals that the dominant methodology does not rest on a single, coherent metaphysics of causation, but rather on a **pragmatic hybrid** that prioritizes *decisional reliability* over *ontological precision*.

  Here is a reconstruction of the implicit theory, an analysis of what it requires versus what merely suits it, and a projection of how guidelines would shift if mechanistic inference were elevated to match the demands of external validity.

  ### 1. The Implicit Theory: Pragmatic Interventionism

  The combination of the evidence hierarchy (RCTs > Observational) and the analysis norm (ITT > Per-Protocol) presupposes a conception of causation best described as **Pragmatic Interventionism**, grounded in the **Rubin Causal Model (Potential Outcomes)**.

  **The Conception of the Cause:**
  In this framework, the "cause" is not the biochemical interaction between molecule and receptor (ingestion). The cause is the **assignable intervention**. This aligns with Woodward's manipulability theory: a causal relationship exists if manipulating $X$ changes $Y$. However, EBM restricts "manipulation" to *policy-levers* available to a clinician or regulator. A clinician can assign a prescription; they cannot assign ingestion. Therefore, the causal estimand is the **Effect of Assignment**, not the **Effect of Treatment on the Treated**.

  **The Conception of the Effect:**
  The effect is defined counterfactually ($Y_{treated} - Y_{control}$), but the *identification strategy* relies on physical randomization rather than logical or statistical adjustment.
  *   **Why ITT?** ITT preserves the *exchangeability* created by randomization. Once you filter by adherence (Per-Protocol), you introduce post-randomization selection bias. Adherence is often correlated with prognosis (e.g., healthier patients adhere better). By sticking to assignment, you maintain the guarantee that the only systematic difference between groups is the *offer* of treatment.
  *   **Why the Hierarchy?** Randomization is viewed as the only engine that guarantees independence from *unmeasured* confounders. Observational studies rely on the assumption of "no unmeasured confounding," which is untestable. Mechanistic reasoning relies on the assumption that the known pathway is the *only* relevant pathway, which history (e.g., the CAST trial on anti-arrhythmics) shows is frequently false.

  **The Synthesis:**
  The implicit theory is that **causation is a property of the experimental system, not just the biological system.** It licenses the thought that "assignment is the cause" because, for the purpose of guideline writing, the *policy* is the unit of agency. The dilution of the estimate (due to non-adherence) is accepted as the price of an unbiased estimate of the *policy's* impact in the real world, where adherence is imperfect.

  ### 2. Requirements vs. Suitability

  It is crucial to distinguish what this practice *strictly requires* from what merely *suits* the regulatory and cultural environment of medicine.

  **What the Practice Strictly Requires:**
  1.  **Exchangeability:** To estimate a causal effect without bias, the treatment and control groups must be exchangeable (statistically identical in potential outcomes). Randomization guarantees this; observational adjustments only hope for it.
  2.  **Integrity of Randomization:** To maintain exchangeability, analysis must follow the initial random allocation (ITT). Excluding non-adherers breaks the randomization.
  3.  **Net Benefit:** To recommend a therapy, the *net* effect on patient-oriented outcomes must be positive. Mechanistic plausibility does not guarantee net benefit (due to off-target effects or countervailing pathways).

  **What Merely Suits It (Contingent Norms):**
  1.  **The Absolute Demotion of Mechanism:** Ranking mechanistic reasoning at the bottom suits a reaction against historical failures (e.g., hormone replacement therapy, anti-arrhythmics), where mechanisms predicted benefit but trials showed harm. However, a counterfactual account does not *require* dismissing mechanism; it only requires that mechanism not substitute for outcome data when establishing *efficacy*.
  2.  **The Rejection of Per-Protocol as "Biased":** While PP is biased for the *effect of assignment*, it is an unbiased estimator for the *effect of ingestion* (under certain assumptions, or via Instrumental Variable analysis). Dismissing it entirely suits a conservative regulatory stance (avoiding over-estimation of benefit) but is not required by causal theory itself.
  3.  **The Pyramid Structure:** The rigid hierarchy suits administrative simplicity (checklist medicine). A counterfactual account could, in principle, rate a high-quality observational study with a natural experiment (e.g., Mendelian randomization) above a small, flawed RCT.

  ### 3. The Overlapping Consensus of Incompatible Theories

  One reason this methodology is so entrenched is that several incompatible philosophical theories license the same practices for different reasons.

  *   **Frequentist Error-Statistics:** Licenses RCTs and ITT because they control long-run Type I error rates. Randomization justifies the p-value calculation without needing distributional assumptions. Mechanism is irrelevant because it doesn't change the error probabilities of the test.
  *   **Decision-Theoretic (Bayesian):** Licenses RCTs because they maximize expected utility for a decision-maker who faces uncertainty about confounding. ITT is preferred because it reflects the real-world risk of prescribing (including the risk that the patient won't take it).
  *   **Counterfactual (Rubin/Neyman):** Licenses RCTs because they are the only design that ensures $Y(1) \perp Z$ (potential outcomes independent of assignment).
  *   **Mechanistic (Cartwright/Russo-Williamson):** *Here is the divergence.* Strict mechanistic accounts often argue that RCTs alone are insufficient because they don't explain *why* a result occurs, making generalization risky. However, a "modest" mechanistic view accepts RCTs as the best way to establish that a capacity exists, even if it doesn't reveal the capacity's structure.

  **The Consensus:** All three dominant frameworks (Frequentist, Decision-Theoretic, Counterfactual) converge on **RCT + ITT** as the gold standard for *internal validity* (establishing that the intervention works *here*). They diverge on *external validity* (will it work *there*?), which is where the mechanistic deficit becomes critical.

  ### 4. If Mechanistic Inference Were Elevated

  You note that the tradition's insistence on results carrying over to new populations (external validity/transportability) seems to demand mechanistic standing. Currently, EBM handles transportability by assuming the trial population resembles the target population. If mechanistic inference were given the standing required to truly solve transportability, guideline writing would change fundamentally:

  **1. From "Population Matching" to "Mechanism Matching"**
  Current guidelines ask: "Does this patient look like the trial participants?" (Age, comorbidities).
  Revised guidelines would ask: "Is the causal pathway intact in this patient?"
  *   *Example:* A drug works in Trial A (adults) but fails in Trial B (children). Current EBM says "Contraindicated in children." Mechanism-aware EBM would ask: "Is the receptor density or metabolic pathway different?" If the mechanism is conserved, the observational data might be upgraded to support use in children despite the failed trial, attributing the failure to dosage or formulation rather than efficacy.

  **2. The "Parachute" Exception Would Become the Rule**
  Currently, we demand RCTs for everything, even when mechanism is overwhelming (e.g., parachutes).
  Revised guidelines would allow **Mechanistic Bridging**. If an RCT proves efficacy in Population X, and basic science proves the mechanism is identical in Population Y, observational data in Population Y would be sufficient to recommend treatment. This would reduce the "evidence gap" for rare diseases or emergency interventions where RCTs are unethical or impossible.

  **3. Per-Protocol and IV Analysis Would Rise in Status**
  If we care about the biological cause (ingestion), we need to estimate the **Complier Average Causal Effect (CACE)**.
  Current guidelines ignore this because it relies on assumptions (exclusion restriction).
  Mechanism-aware guidelines would use biological markers of adherence (e.g., drug levels in blood) to validate the "ingestion" variable. This would allow guidelines to distinguish between "The drug doesn't work" and "The drug works but patients can't tolerate the regimen."

  **4. Negative Trials Would Be Re-interpreted, Not Dismissive**
  Currently, a negative RCT kills a therapy.
  With mechanistic standing, a negative RCT would trigger a **Mechanistic Audit**. Did the drug hit the target? (Pharmacodynamics). If yes, the theory of the disease is wrong. If no, the dosing was wrong. Guidelines would distinguish between "No Efficacy" (mechanism failed) and "No Effect" (implementation failed).

  ### Summary

  The current norms presuppose a **Black-Box Interventionist** theory of causation: the cause is the policy lever (assignment), and the box (biology) is too complex to trust without empirical input. This licenses the ITT/RCT dominance because it prioritizes **unbiased estimation of the policy effect** over **accurate estimation of the biological effect**.

  This practice is not strictly required by counterfactual logic, which could accommodate mechanistic data to improve transportability. It is sustained by a conservative regulatory epistemology that fears false positives (Type I errors) more than false negatives (Type II errors) and views mechanism as a source of bias (over-optimism) rather than a source of structural knowledge.

  To align the hierarchy with the demand for generalizability, guidelines would need to adopt a **Structural Causal Model** approach. This would treat mechanistic data not as "low evidence," but as the **transport function** that allows high-quality trial data to travel from the experimental setting to the clinical setting. Until then, EBM remains excellent at telling us what worked *then and there*, but theoretically ill-equipped to tell us why, and therefore uncertain about *here and now*.
