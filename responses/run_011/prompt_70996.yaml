          *   State C: Silence + Circles
          *   State D: Silence + Rows
      *   **The Players:** We need two "Deciders" (Liberals) and the "Rest" (Pareto source).
      *   **The Preferences:**
          *   Decider 1 (Alex): Cares most about Music. (Lo-fi > Silence).
          *   Decider 2 (Jordan): Cares most about Seating. (Rows > Circles).
          *   Everyone else: Has a consensus preference that creates the Pareto trap.
      *   **The Twist:** Alex cares *a little* about Seating. Jordan cares *a little* about Music. This creates the cycle.
      *   **Engaging the Crowd:** The 16 others aren't just watching. They are the "Pareto Engine." They must unanimously agree on a ranking that conflicts with the Liberals' rights.

