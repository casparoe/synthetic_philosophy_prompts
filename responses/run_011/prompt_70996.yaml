  2.  **Deconstruct Sen's Liberal Paradox:**

      *   **The Trilemma:** You can't have all three:
          1.  **Unrestricted Domain (U):** Any set of individual preferences is allowed.
          2.  **Pareto Efficiency (P):** If everyone prefers A over B, society prefers A over B.
          3.  **Liberalism (L):** Each individual has at least one pair of options where their preference dictates the social preference (a "protected sphere").
      *   **The Mechanism:** It requires at least two people who care about each other's "protected" choices.
      *   **The Cycle:** Person 1 prefers $x$ over $y$ (their sphere). Person 2 prefers $y$ over $x$ (but it's Person 1's sphere). Person 2 prefers $z$ over $w$ (their sphere). Person 1 prefers $w$ over $z$ (but it's Person 2's sphere). Combined with Pareto, this creates a cycle ($A > B > C > A$).
      *   **Adaptation for High School:** Needs to be about club decisions.
      *   **The "Real" Decision:** What can the club actually decide?
          *   Option A: Next meeting's snack (if budget existed, but no budget).
          *   Option B: Next meeting's topic/theme.
          *   Option C: Seating arrangement.
          *   Option D: Order of events.
