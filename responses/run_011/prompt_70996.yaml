  8.  **Refining the "Real Decision":**
      *   If we get a cycle, we can't decide. That's the point. But students might hate "no decision."
      *   *Fix:* If a cycle occurs, the President (me) picks arbitrarily. This proves the system failed to produce a democratic outcome.
      *   *Stakes:* The winner gets to pick the *opening song* next week. (Low cost, high desire).

  9.  **Addressing the "Meddlesome" Preference:**
