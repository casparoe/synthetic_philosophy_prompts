      *   **The Reveal:** Citizens don't know the Ministers' private preferences until the end. Ministers don't know the Citizens' consensus until the end.
      *   **The "Stuck" Moment:** The whiteboard shows a cycle. A > B > C > D > A.
      *   **Engagement:** Everyone writes rankings. The Ministers have special colored cards.

  5.  **Refining the Scenario for High Schoolers:**

      *   *Scenario:* **The End-of-Meeting Wind-Down.**
      *   *Decision:* What happens for the last 10 minutes of *every* meeting this semester.
      *   *Dimension 1 (Minister A's Sphere):* **Music** (Lo-fi Beats vs. Silence).
