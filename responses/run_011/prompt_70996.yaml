  ### **President's Cheat Sheet (For the Whiteboard)**

  **The 4 States:**
  *   **A:** Chill (Music + Dim)
  *   **B:** Study Hall (Music + Bright)
  *   **C:** Nap Time (Silence + Dim)
  *   **D:** Interrogation (Silence + Bright)

  **The Cycle (Draw arrows):**
  1.  **A > C** (Minister 1: Music Rights)
  2.  **C > D** (Minister 2: Light Rights)
  3.  **D > B** (Pareto: Everyone hates Study Hall more than Interrogation)
  4.  **B > A** (Minister 1 Secret: Prefers Bright over Dim)
  5.  **Result:** A > C > D > B > **A** (CRASH)

  **If they ask "Why did Minister 1 prefer B > A?":**
  "That's the 'Unrestricted Domain' condition. We allow people to have any preference, even 'meddlesome' ones. If we ban that preference, we are censoring preferences, which is also a philosophical problem."
