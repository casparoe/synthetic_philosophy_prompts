answer: |-
  This is a remarkably precise description of a specific epistemic failure mode. You are right to reject "ritual" (the roast beef effect) and "herding" (social pressure). In the roast beef scenario, the *reason* is lost. In your scenario, the *reason* is present, but the *evidence supporting the reason* is illusory.

  You are describing a situation where **social transmission creates the illusion of independent verification.**

  There isn't one single word that captures the sociology, the psychology, and the statistics of this simultaneously, but there are three established concepts from different fields that, when layered, describe exactly what you are seeing.

  ### 1. The Cognitive Mechanism: Correlation Neglect
  **Field:** Behavioral Economics / Decision Theory
  **The Term:** **Correlation Neglect** (or *Correlated Signal Neglect*)

  **What it is:** This occurs when decision-makers treat multiple pieces of information as independent signals when they are actually drawn from a common source. In a rational Bayesian update, if you hear the same news from five people, you should not update your belief five times if all five people heard it from the same original source. Correlation neglect is the failure to "discount" the evidence for that commonality.

  **Where it fits:** This is the exact mathematical error your staff is making. They see eleven colleagues performing a task and infer, "Eleven people have independently verified this is necessary." In reality, they are observing one signal (the 2009 incident) reflected through eleven mirrors. They are neglecting the correlation between their colleagues' behaviors.

  **Where it stops fitting:** Correlation neglect is usually studied in individual investors or voters (e.g., "I read the same story on five news sites, so it must be extra true"). It describes the *mental error*, but not necessarily the *organizational history* of how the rule became entrenched.

  ### 2. The Social Mechanism: The Information Cascade (specifically, a "Frozen" Cascade)
  **Field:** Game Theory / Sociology
  **The Term:** **Information Cascade**

  **What it is:** An information cascade occurs when individuals make rational decisions to ignore their own private information and follow the actions of predecessors, because they assume the predecessors possess superior information.
  *Crucially, this is not "herding."* Herding implies social pressure or mindless conformity. An Information Cascade is a **rational epistemic calculation** based on faulty premises. Person B assumes Person A had a good reason. Person C assumes Person A and Person B had good reasons.

  **Where it fits:** You noted that your coworkers offer "completely sensible reason[s]." This is the hallmark of a cascade. They are reasoning perfectly: "If this weren't necessary, eleven rational people wouldn't do it." They are treating the *existence of the practice* as *evidence of the practice's necessity*.
  Because the original source (the 2009 predecessor) is gone, the cascade has "frozen." The chain of transmission is broken, but the behavior persists because every new link assumes the previous links were based on fresh data.

  **Where it stops fitting:** Classic cascade theory usually describes a dynamic sequence of adoption (e.g., choosing a restaurant). Your scenario is a static, institutionalized routine. However, organizational theorists often refer to this as an **Institutionalized Cascade** or **Legacy Cascade**.

  ### 3. The Historical Mechanism: Reification of Contingency
  **Field:** Organizational Sociology / Philosophy
  **The Term:** **Reification** (specifically, *Reification of Contingency*)

  **What it is:** Reification is the process of treating an abstract or contingent human creation as if it were a concrete, natural, or inevitable thing. "Contingency" means something that happened by chance or due to specific circumstances (the "rough week in 2009").

  **Where it fits:** This explains why the rule feels "load-bearing." A contingent event (one bad week) was transformed into a universal law (check every Friday forever). The specific context was stripped away, leaving only the rule. The rule is no longer viewed as "a solution to a 2009 problem" but as "a property of how dental scheduling works."

  **Where it stops fitting:** Reification can happen without the "illusion of consensus." You can have a reified rule that everyone knows is dumb but follows anyway (bureaucracy). Your case is specific because the reification is *supported by the false consensus*.

  ---

  ### The Synthesis: How to Argue for the Audit

  If you need to name this to argue for an audit, do not use "ritual" or "habit." Those imply the staff is being irrational, which will make them defensive. You need a term that validates their reasoning while highlighting the structural flaw in their evidence.

  I recommend using the term **Epistemically Redundant Consensus**.

  If you need to be more academic, call it a **Cascade of Pseudoreplication**. (Pseudoreplication is a statistical term for treating non-independent data points as independent samples).

  **Here is the argument script:**

  > "We are currently operating under what looks like an **Epistemically Redundant Consensus**.
  >
  > Right now, we treat the fact that 'eleven people do this' as eleven independent data points confirming this task is necessary. But in reality, it is **pseudoreplication**: it is one data point from 2009 that has been copied eleven times.
  >
  > This isn't about anyone being lazy or mindless. It's a rational **Information Cascade**. Everyone is reasoning correctly based on the inputs they can see. But because the original source of the rule is gone, we are suffering from **Correlation Neglect**. We are counting the same piece of evidence over and over again as if it were new proof.
  >
  > To know if this is still load-bearing, we have to break the cascade. We need to treat the 'eleven votes' as **one vote**, and audit whether that single original reason still holds true today."

  ### Why this works
  1.  **It validates them:** It acknowledges they are reasoning rationally (Cascade), not just following orders (Ritual).
  2.  **It isolates the error:** It identifies the math error (Correlation Neglect/Pseudoreplication) rather than a character flaw.
  3.  **It demands the audit:** If the consensus is redundant, it carries no more weight than the original source. Since the original source is unavailable (retired), the consensus is technically "hearsay" and requires verification.

  ### Summary of Near-Misses (for your own clarity)
  *   **Groupthink:** No. That requires pressure to conform. Your staff feels no pressure; they feel conviction.
  *   **Pluralistic Ignorance:** No. That requires private doubt. Your staff genuinely believes the rule is right.
  *   **The Roast Beef Effect (Mimetic Ritual):** No. That requires loss of *meaning*. Your staff retains the meaning (insurance verification), just not the *origin*.
  *   **Path Dependence:** Close, but this explains *why* it stays (switching costs), not why the *belief* in its necessity is inflated.

  You are describing a **Frozen Information Cascade sustained by Correlation Neglect.** It is a very real, documented phenomenon in organizational epistemology, even if it doesn't have a single catchy noun like "Groupthink."
