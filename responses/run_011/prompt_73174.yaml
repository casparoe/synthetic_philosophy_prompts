prompt: |-
  I'm the site supervisor on a developer-funded rescue excavation — a Bronze Age settlement with about six weeks left in the season — and the client's press officer has already drafted a release describing our Building 4 as a prehistoric shrine. I have to decide what goes into the interim report before that release is issued, and I can't get a straight answer from anyone on site.

  Here is what we actually have. Building 4 is a rectangular timber structure, roughly six by nine metres, standing about forty metres apart from the main cluster of houses on a slight rise. Inside: a plastered bench along one wall; a stone-lined pit in the corner containing burnt grain and ash but no cooking debris and no butchered bone; and a concentration of 41 complete or near-complete pots along the eastern wall, most crushed in place. Two of those pots have holes drilled through them after firing, so they could not have held anything. Immediately outside the doorway is a pit with nine cattle mandibles, mostly from young animals, deposited together. Inside the building there is almost no domestic refuse: no loom weights, no quern fragments, no hearth with cooking residue, no midden. The yard outside has a normal scatter of all of those.

  My director calls it a cult building and wants the report to say so plainly. My finds specialist says the pot concentration is a collapse deposit — vessels stacked on a shelf, roof failure — that the perforated ones are simply broken or misfired pots that were reused as something else, and that a bench and a stone-lined pit are exactly what you would expect in a granary or storeroom. She also notes that Building 4 was swept clean before it was abandoned, so the absence of rubbish may be evidence about a broom rather than about a god. Meanwhile one of the PhD students sent me a checklist she copied out of a book: a special natural setting; a building set apart from ordinary life; attention-focusing features in the architecture; a cult image or a stand-in for one; special facilities such as altars, benches, basins or libation pits; food and drink brought in and consumed, burnt off or poured away; the same symbols recurring over and over. She has ticked six boxes for Building 4. I ticked the same six and still feel as though I know nothing more than I did before.

  Three things I can't work out. First, does ticking that checklist constitute evidence at all, or is it built so that any structure whose everyday use isn't immediately obvious to us will pass it? Second, if the collapse-and-storeroom story accounts for every single thing we recovered, is there anything left over for the shrine story to account for, or am I simply preferring the more interesting option? Third — and this is the part nobody on site wants to raise — I'm not convinced the two stories are even rivals. It is entirely possible that the same building held the harvest and was also where something was done with it, and that the people who built it would not have recognised the line I'm being asked to draw down the middle of it. If that's right, what should the report say? "Ritual and storage" reads like a fudge that lets everyone off, and "we found a building with a bench and a lot of pots" is true and useless.

  I also owe the press officer a yes-or-no answer by Friday on whether we can call it a shrine. Tell me what a defensible answer to her looks like, and what the interim report should say, and where the line runs between honest qualification and hiding behind it. And be explicit throughout about which parts of what you tell me would be treated as settled by people who do this for a living and which are genuinely argued about among them — I don't want to walk into Friday's meeting asserting as standard practice something that turns out to be one school's view.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Situation:**
      *   **Role:** Site Supervisor on a developer-funded rescue excavation.
      *   **Context:** Bronze Age settlement, 6 weeks left in season. High pressure (developer-funded, press release drafted).
      *   **Problem:** Interpretation of "Building 4." Director says "cult building/shrine." Finds Specialist says "granary/storeroom." PhD Student uses a "ritual checklist" (6/6 ticks). User is skeptical of both extremes and suspects a false dichotomy (ritual *and* storage).
      *   **Immediate Deadline:** Yes/No answer to Press Officer by Friday on calling it a "shrine."
      *   **Deliverable:** Interim report content, advice on the press release, and distinction between settled practice vs. debated theory.
      *   **Key Constraint:** Must be explicit about what is consensus vs. what is contested in the archaeological community.

  2.  **Deconstruct the Evidence (Building 4):**
      *   *Location:* 40m from main cluster, slight rise (Separation/Elevation).
      *   *Structure:* Rectangular timber, 6x9m.
      *   *Interior:* Plastered bench, stone-lined pit (burnt grain/ash, no cooking/bone), 41 pots (crushed, 2 perforated post-firing).
      *   *Exterior:* Pit with 9 cattle mandibles (young, deposited together).
      *   *Absences:* No domestic refuse (loom weights, querns, hearth, midden) *inside*. Normal scatter *outside*.
      *   *Condition:* Swept clean before abandonment.

  3.  **Address the User's Three Questions:**

      *   *Q1: The Checklist.* Is it evidence or a tautology?
          *   *Archaeological Consensus:* Checklists (like Renfrew's "Peer Polity Interaction" or specific ritual markers) are heuristic tools, not proof. They identify *potential*, not *function*. They suffer from confirmation bias (as the user suspects).
          *   *Verdict:* It's a starting point for hypothesis generation, not evidence in itself.

      *   *Q2: The Storeroom vs. Shrine.* Is there anything left over for the shrine story if the storeroom story explains everything?
          *   *Archaeological Consensus:* The "storeroom" explanation struggles with specific anomalies: the cattle mandibles outside (structured deposition), the perforated pots (non-utilitarian modification), the separation from the main cluster, and the *absence* of processing tools (querns) inside a supposed granary. Granaries usually have means to process the grain.
          *   *Verdict:* The storeroom hypothesis explains the grain and pots but fails on the mandibles, perforated pots, and location. The shrine hypothesis explains the anomalies but risks over-interpreting the grain.

      *   *Q3: The False Dichotomy.* Can it be both?
          *   *Archaeological Consensus:* Yes. This is the current orthodoxy in Bronze Age studies (and anthropology generally). The sacred/profane divide is modern. "Ritualized storage" or "Temple Economy" is a standard model (e.g., Near East, Minoan, some British Bronze Age).
          *   *Verdict:* This is the most defensible academic position.

  4.  **Drafting the Advice - Section by Section:**

      *   **Introduction:** Acknowledge the pressure. Validate the user's skepticism.
      *   **The Press Release (The Friday Deadline):**
          *   *Constraint:* Needs a Yes/No.
          *   *Risk:* Calling it a "shrine" is definitive. Calling it "domestic" is likely wrong.
          *   *Solution:* "Ritual significance" or "Special Purpose." Avoid "Shrine" if possible, but if forced, qualify it.
          *   *Consensus Check:* Archaeologists hate definitive functional labels without textual evidence. "Interpreted as" is key.
      *   **The Interim Report:**
          *   *Content:* Describe the *data*, not just the *interpretation*.
          *   *Phrasing:* Use "structured deposition," "non-domestic assemblage," "spatial separation."
          *   *Consensus Check:* Interim reports should be data-heavy, interpretation-light, but must offer a working hypothesis.
      *   **Addressing the Three Questions (The Core Analysis):**
          *   *Checklist:* Heuristic, not evidentiary. (Consensus).
          *   *Residual Evidence:* The mandibles and perforated pots are the "smoking guns" against a pure storeroom. (Consensus).
          *   *False Dichotomy:* The "Ritual-Storage" continuum is standard theory. (Consensus in social archaeology, debated by processualists).
      *   **Settled vs. Contested:**
          *   *Settled:* Modern categories don't fit prehistoric minds. Structured deposition is real. Absence of evidence (processing tools) is evidence of absence (of domestic activity).
          *   *Contested:* The *degree* of ritual. Is it a temple? A chief's house? A communal store? The specific label "Shrine" is contested.

  5.  **Refining the Tone:**
      *   Professional, authoritative, but cautious.
      *   Empathetic to the supervisor's position (caught between director, specialist, and press).
      *   Clear distinctions between *observation* and *inference*.

  6.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Tell them to say "No" to the press.
      *   *Correction:* That might get the supervisor fired by the Director. Need a diplomatic "Yes, but..." or "Use this phrase instead."
      *   *Initial thought:* Dismiss the Finds Specialist completely.
      *   *Correction:* She's right about the pots potentially being storage, but wrong about the mandibles. Acknowledge her valid points to show balance.
      *   *Check:* Did I explicitly mark consensus vs. debate? Need to make sure that's highlighted in every section.

  7.  **Final Polish:**
      *   Ensure the distinction between "Interim Report" (technical) and "Press Release" (public) is clear.
      *   Make sure the "Ritual and Storage" fudge is reframed as "Ritualized Economy" to sound robust, not weak.
      *   Verify Bronze Age context (UK/Europe implied by "Bronze Age settlement," "mandibles," "querns"). The advice holds generally for European Prehistory.

  8.  **Final Output Structure:**
      *   Executive Summary (The Friday Answer).
      *   The Interim Report Strategy.
      *   Addressing the Three Questions (with Consensus/Debate markers).
      *   The "Line in the Sand" (Qualification vs. Hiding).
      *   Closing encouragement.

  *(Self-Correction on "Shrine"):* In UK archaeology, "Shrine" is a loaded term often reserved for Roman or Iron Age specific contexts. For Bronze Age, "Ritual Structure" or "Special Purpose Building" is safer. I need to emphasize this distinction.

  *(Self-Correction on "Checklist"):* This sounds like Renfrew's criteria. I should mention that explicitly as it adds credibility.

  *(Self-Correction on "Mandibles"):* Structured deposition of animal parts is a huge marker of ritual in British Bronze Age. This is near-consensus.

