answer: |-
  Thank you for being here. Last year, a question was asked from this room that deserved a direct answer. A trustee asked whether we are still working on the same problems the Greeks had, and if so, what we have been doing with our time. He measures disciplines by whether their experts converge. On that metric, he is right. Philosophy has not progressed. We do not agree on whether our choices are determined. We are no closer to agreeing on what makes an action right. If the measure of success is consensus among practitioners, we are failing, and there is no particular reason to expect that to change.

  However, that metric assumes a discipline keeps its results. Physics keeps its results. When a part of philosophy gets results, that part stops being philosophy and becomes physics, or psychology, or economics, or computer science. The books recording the achievement are reshelved in another library. A discipline that scores itself by what remains inside its own borders will look permanently unsuccessful in exact proportion to its success. I know this sounds like moving the goalposts. It is obviously exposed to the charge of unfalsifiable self-immunization: succeed and we keep it, fail and we exported it. I am not offering this as a get-out-of-jail card. It is a structural feature of the work, but it does not capture the internal progress that actually occurs.

  My own private measure is different. Call it foreclosure. Progress in philosophy shows up not as agreement about which position is true but as a steady shrinking of the set of positions an informed person can still occupy. Certain views are still held, by cranks and by first-years, but they now carry an argumentative debt that compounds. Anyone who wants to hold them must answer to distinctions that did not exist when the view was first proposed, and the price of remaining informed while holding them keeps rising. That, not convergence, is what I would point to.

  Consider knowledge: we once defined it as true belief with evidence, but now holding that view requires answering a counterexample that did not exist before, and most experts have abandoned it. That shift was not caused by a scientific discovery; it was caused by a logical distinction drawn in a paper. The position was not proven false in the way a hypothesis is falsified by data; it was foreclosed by the cost of maintaining it against a refined argument. This is the work. We map the constraints on coherent thought. We do not always find the answer, but we rigorously eliminate the ways an answer cannot be given.

  This brings me to the value of the degree itself. One of our seniors asked me recently whether her four years with us had been an expensive mistake because she is not going into academia. She is not mistaken. She is leaving with a map of the foreclosure lines. She knows which arguments are cheap and which are expensive. She knows that claiming a moral fact is just a physical fact requires a debt payment she is now trained to demand. This is not about learning to think; everyone thinks. This is about knowing the current market rate for specific claims. The education is not a journey of self-discovery. It is an acquisition of leverage in argument.

  We are not building a bridge that will stand for a century. We are clearing the ground so that when the bridge is built, it does not collapse under its own logical weight. The trustee asked what we have been doing with our time. We have been raising the cost of being wrong. We have been making it harder to hold naive views without paying the price for them. The questions remain live, but the answers available to an informed person are fewer, sharper, and more costly. That is the achievement. It is not a catalog of solutions. It is a catalog of constraints. And that catalog is fuller today than it was yesterday.

  ***

  **Note on Exposure**

  The physicist will push hardest on the export argument, calling it an unfalsifiable definition shift that protects the discipline from failure. He will also challenge foreclosure, arguing that increasing the complexity of a debate is not progress but merely stagnation dressed up as sophistication. If he raises the first point from the floor, I will concede that the boundary is porous but note that the historical record of natural philosophy becoming physics is empirical fact, not theory. If he raises the second, I will state plainly that a field where naive errors are no longer viable options for experts is objectively more advanced than one where they are still live options.
