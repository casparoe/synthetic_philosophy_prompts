answer: |-
  1. **Translation and Verdict**

  1.  **Nudge:** You propose feedforward compensation. In control terms, feedforward acts on measured disturbances to cancel them before they affect the output. A nudge, however, alters the *reference signal* perception before it enters the summing junction. It is an input scaling bias: $r' = k \cdot r$, where $k \neq 1$. The plant dynamics remain unchanged, but the error signal $e = r' - y$ is corrupted.
      *Verdict:* Translates with distortion. Feedforward implies disturbance rejection (neutral); nudging implies reference manipulation (biased).

  2.  **Welfare Standard:** This requires minimizing error $e = r - y$ where $r$ is the agent's latent "true" preference, not the presented option. The controller must estimate $\hat{r}$ without altering it. *Stipulation:* Philosophers assume a stable "true" preference exists; control theory assumes $r$ is exogenous and given.
      *Verdict:* Translates with distortion. Control cannot verify if $\hat{r}$ matches the agent's latent $r$ without an external truth model.

  3.  **Publicity:** This is observable controller structure. The gain matrix $K$ is known to the plant. *Stipulation:* Philosophers worry about effectiveness under observation (observer effect); control assumes parameters are fixed regardless of knowledge.
      *Verdict:* Translates cleanly, provided observer effects are negligible.

  4.  **Sludge:** You propose deadband or hysteresis. This is accurate. It introduces a threshold $\delta$ such that actuation occurs only if $|e| > \delta$. It raises the energy required to switch states.
      *Verdict:* Translates cleanly.

  5.  **Boost:** You propose re-identification. This is adaptive control or system identification. The controller updates the plant model $\hat{P}$ to improve future tracking performance permanently.
      *Verdict:* Translates cleanly.

  6.  **Autonomy Objection:** This describes feedback from output $y$ to reference $r$. The controller output modifies the setpoint generator: $r(t) = f(y(t-\tau))$. *Stipulation:* Control treats this as adaptation; philosophers treat it as a violation of authority.
      *Verdict:* Translates with distortion. The structural loop is valid; the objection is normative.

  7.  **Replication Worry:** This is model uncertainty or generalization error. Identified gains $K$ derived from one population fail to stabilize or track correctly on a new plant population.
      *Verdict:* Translates cleanly.

  2. **Residue Report**

  Residue remains in Items 2 and 6. Item 2 fails because control theory lacks a mechanism to distinguish a "true" reference from a "biased" reference internally. The loop closes on whatever $r$ is provided. This marks a genuine gap: control vocabulary is instrumental, not teleological. It optimizes tracking, not truth. The philosophy debate relies on a distinction between *expressed* preference (output) and *latent* welfare (reference) that control theory collapses into a single signal.

  Item 6 fails because "ownership" is not a signal property. Structurally, feedback to reference is valid (cascade control). The objection is normative: who holds the authority to modify $r$? Control abstracts authority away, treating all signals as equal potentials. This suggests the philosophers' disagreement is thinner than it looks structurally, but thicker normatively. The residue is not a gap in expressing dynamics, but a gap in expressing authority. Control theory can model the *violation*, but it cannot label it *unjust* without external axioms.

  3. **Two Cruxes**

  First: In control terms, is the welfare standard self-validating? Yes. If you define error as $e = r - y$, you can always drive $e \to 0$ by setting $r = y$. This is trivial tracking. It shows the standard is circular unless $r$ is exogenous. Control theory cannot state this exogeneity condition; it assumes $r$ is given by a higher-order system. The circularity reveals that the welfare standard requires a metaphysical claim (preferences exist independently) that control theory treats as an engineering assumption. *Stipulation:* Philosophers argue about the independence of preferences; control assumes it to close the loop.

  Second: Is the autonomy objection expressible as a structural property? Structurally, Item 6 describes feedback from output to reference. This is common in adaptive systems. The objection requires a normative claim: the reference generator must be isolated from the controller. Control theory lacks "ownership." It does not distinguish between a setpoint changed by the user versus the controller. This is not a lack in the framework; it is a deliberate abstraction. Control theory solves "how to track," not "who should choose." Therefore, the objection requires a normative claim about setpoint ownership that the framework deliberately abstracts away.

  4. **Reverse Report**

  Control theory draws distinctions the debate collapses. Specifically, between steady-state error (bias) and tracking lag (dynamic error). A nudge might reduce variance (noise in decision) while increasing bias (systematic shift). Control minimizes Mean Squared Error (both). Philosophers argue bias is morally weighted heavier than variance. A policy that reduces decision noise but shifts the mean is a "good" controller but a "bad" nudge.

  Additionally, control distinguishes between gain too low (no intervention) and gain inside noise (ineffective intervention). Philosophers treat "no effect" as binary. The bias/variance distinction would change the argument: is a high-bias/low-variance policy better than low-bias/high-variance? The gain/noise distinction is an artifact; philosophers care about significance, not signal-to-noise ratios. The refinement that matters is bias vs. variance, as it maps to manipulation vs. clarity.

  5. **Closing**

  Your suspicion is right about the structural isomorphism but wrong about the normative silence. You correctly mapped sludge and boost; these are physical constraints and learning algorithms. You are most mistaken on Item 1. A nudge is not feedforward; it is reference bias. Feedforward respects the reference; nudging alters its perception. This matters because feedforward is neutral assistance, while reference bias is manipulative. Control theory handles the math of both identically, but the philosophical debate hinges on the source of the signal. Your framework captures the dynamics but dissolves the ethics, which was your fear. The debate collapses into control vocabulary only if you ignore who holds the setpoint knob.
