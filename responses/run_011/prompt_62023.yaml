  *(Refining the Departure Clause)*: The prompt asks if we can weigh community consequences. I need to argue that "educational purposes" *is* a consequentialist mandate. If we were only about desert, the clause wouldn't exist.

  *(Refining the Publicity)*: The prompt notes that self-disclosures rely on assurance of confidentiality. If we publicize this, we kill future self-disclosures. If we bury it, we lose deterrence. I need to argue that the *internal record* serves the institutional memory without breaking the promise to the student.

