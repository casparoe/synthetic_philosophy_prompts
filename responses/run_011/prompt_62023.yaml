      *   **Timing:** Undetected at the time, grade stood, course curved. Disclosed 3 months ago by student (post-mental health crisis). Student is now a peer writing tutor (teaches citation).
      *   **Sanction:** Code prescribes standard sanction (Retroactive F, 5-year notation). *However*, there's an uninterpreted "departure clause" ("where the educational purposes of the community would be better served").
      *   **Panel Status:** Evenly and bitterly divided. Chair wants my written opinion to guide the vote.
      *   **Requirements:**
          *   Open with a determinate recommendation (Standard, Lesser, or No Finding).
