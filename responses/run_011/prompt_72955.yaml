  3. **Invest in industry.** Focus on increasing your own labour and skill. The balance of trade will regulate itself without your interference, leaving both kingdoms richer in goods, if not in silver. Let him be rich so you may be rich too.

  **Dear David,**
  **Since the Fleet returned, a loaf costs twice as much. My rents are fixed. I am ruined. Is this not progress?**
  **— A Landed Gentleman in Seville**

  **Dear Gentleman,**
  Inflation is painful, but context is key. Execute this review:
  1. **Diagnose the source.** Money acquired gradually through commerce quickens industry before prices rise. Money arriving suddenly from mines does nothing but make things dear. Your trouble is the speed of the influx.
  2. **Assess the stimulus.** Because this treasure arrived all at once, it stimulated no new labour. It merely altered the denomination of prices. Your real income in goods remains static, though the number of coins required to purchase them has doubled.
  3. **Renegotiate.** Adjust your leases to match the new price level. Do not mourn the lost value of silver; mourn only that the influx was not earned by industry, which would have softened the blow by increasing production before prices climbed.

