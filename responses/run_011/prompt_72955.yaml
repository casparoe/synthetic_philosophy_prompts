  2. **Prepare for leakage.** As your money multiplies, prices for your domestic manufactures will rise. Foreigners will stop buying your goods, and you will buy theirs. The specie will flow out as naturally as water finding its level.
  3. **Delay the masonry.** Wait until the balance restores itself. You will find the monument costs twice as much by then, and the gold required to build it will have departed to pay for imported wine. There is no surplus to spend.

  **Dear David,**
  **My neighbour's shipping tonnage exceeds mine. His merchants grow fat while mine starve. How do I drain his treasury?**
