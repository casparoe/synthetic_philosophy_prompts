  **Dear Merchant,**
  Jealousy is a poor investment strategy. Try this portfolio adjustment:
  1. **Identify the opportunity.** A flourishing neighbour is not a rival but a customer. His increased wealth means he has more counters to purchase your wool. Trade is not a zero-sum contest where one must lose for the other to win.
