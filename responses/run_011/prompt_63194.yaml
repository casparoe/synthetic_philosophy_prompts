answer: |-
  It is a pleasure to correspond with a fellow traveller in the borderlands between the bench and the text. Fife to Pune is a long cable, but the epistemic gaps are often shorter than the geographical ones. You have a sharp eye for the join between the practical and the theoretical, which is precisely where Nyaya thrives.

  You have asked me to be straight about error bars and rigging, so I shall start there, before moving to the prediction.

  ### 1. The Rigging Check
  You asked me to call it if the case is rigged. I believe, respectfully, that you have smuggled a universal rule into the description, though you claim you hadn't written it down.

  You wrote: *"Those two things can't both be true: clean starting material doesn't stop at a fixed number unless something in the pot is eating a fixed amount of the curing agent."*

  That statement *is* the rule (*vyapti*). In Nyaya terms, you have established an invariable concomitance: "Where cure stalls at a fixed conversion despite clean inputs, a hidden scavenger is present." You may not have known the *identity* of the scavenger, but you knew the *necessity* of its existence. Nyaya inference does not require you to know the name of the thing inferred, only that the mark (stalled cure) cannot exist without the property inferred (hidden consumption).

  Because you relied on a law of conservation (mass/stoichiometry) which you treated as universal, you have structured this as **Inference (*Anumana*)**, not pure Postulation (*Arthapatti*). If you had truly no rule—if you had simply guessed "maybe a scavenger" without the logical compulsion of "it *must* be a scavenger because nothing else explains the fixed point"—then it would be postulation. But your phrasing ("Those two things can't both be true") indicates you saw a logical contradiction that demanded resolution. That is the engine of Inference.

  ### 2. Candidate Rules She Might Be Running
  Your tutor is a Nyaya specialist. This constrains her significantly, but there are two ways she could interpret the data:

  *   **Rule A (Strict Nyaya Orthodoxy):** Nyaya accepts only four *pramanas*. It explicitly rejects *Arthapatti* (postulation) as an independent source, subsuming it under *Anumana* (Inference). Under this rule, any case where you deduce an unobserved fact to explain an observed anomaly is Inference, provided there is a logical link.
      *   *Prediction:* She will call it **Inference**.
  *   **Rule B (Phenomenological/Comparative):** She may use the English word "postulation" to describe the *psychological move* (explaining an anomaly) while acknowledging that Nyaya classifies it epistemically as Inference. Or, she might be contrasting Nyaya with Mimamsa (which *does* accept *Arthapatti* as a separate source) to show you the boundary.
      *   *Prediction:* She will call it **Postulation** in conversation, but clarify that Nyaya counts it as Inference.

  Given her firmness on the bittern case ("knowledge lands when she sees it"), she cares about the *moment* of cognition. In your resin case, the knowledge landed when you did the arithmetic, not when you dosed the pot.

  ### 3. Weighting Your Precedents
  Here is how your previous cases bear on the 1994 resin incident:

  *   **The Bittern (Comparison/*Upamana*):** **Dead Neutral.** This relies on similarity to a description. Your resin case relies on logical necessity, not similarity.
  *   **The Chromatogram Blank (Absence/*Abhava*):** **High Weight.** Your tutor called this "knowledge, not inference" because the absence was perceived. In the resin case, the *stall* was perceived, but the *scavenger* was not an absence; it was a positive entity deduced from the stall. This distinction will be crucial. She will likely say the stall is perception, the scavenger is inference.
  *   **The Solvent Guy (Intuition):** **High Weight.** She dismissed him because he couldn't articulate the rule ("can't tell you how he knows"). You *can* articulate the rule (stoichiometry/conservation). This distinguishes your case as knowledge rather than luck.
  *   **The Mass Spec (Instrument):** **High Weight.** She called this "perception with apparatus." This reinforces that your chromatogram data was perception. The *interpretation* of that data is where the epistemic work happens.

  **Closest Analogue:** The **Chromatogram Blank**.
  *Why:* Both involve reading a negative or anomalous signal to determine the state of the world. However, the blank was "no peak" (perception of absence). Your resin case is "stalled reaction" (perception of event) leading to "hidden cause" (inference of entity). It is the next logical step up the chain from the blank.

  ### 4. The Verdict Prediction
  **She will say you knew, and she will classify it as Inference (*Anumana*).**

  **Reasoning:**
  1.  **Nyaya Doctrine:** As a Nyaya scholar, she cannot grant *Arthapatti* independent status without stepping outside her school. She will likely explain that what feels like postulation is actually inference based on a negative correlation (the impossibility of the alternative).
  2.  **The Rule:** As noted in the rigging check, you possessed the universal rule of stoichiometric balance. You inferred the existence of the scavenger because the observed effect (60% stall) was incompatible with the observed cause (clean resin) *unless* a second cause existed. That is classic *Anumana*.
  3.  **The Dosing:** She will likely treat the dosing experiment not as the source of knowledge, but as the *verification* (*tarka*) that confirmed the inference was sound. The knowledge existed when you did the arithmetic; the dosing merely removed doubt.

  **Confidence:** 75%.
  **Why not 100%?** There is a 25% chance she uses the term "Postulation" loosely to honour the *Arthapatti* intuition (explaining a contradiction) before folding it back into Inference. If she does this, do not be confused; epistemically, she will still place it under the Inference bucket.

  ### 5. The Point of Least Certainty
  I am least certain about **how she handles the "unknown rule" aspect.**
  You stated you had "no list of similar cases to generalise from." Nyaya inference traditionally requires *vyapti* (universal concomitance) established by prior observation. If she is a strict empiricist within Nyaya, she might argue you lacked the *vyapti* because you'd never seen this specific stall before. However, most Nyaya thinkers allow for *vyapti* based on the nature of things (*svabhava*)—i.e., the nature of chemistry itself. If she holds a strict "enumerative induction" view of *vyapti*, she might wobble. I am betting she accepts "natural necessity" (stoichiometry) as a valid basis for *vyapti*.

  ### 6. The Follow-Up Case (To Split the Readings)
  To force a wedge between "Inference" (requires a known universal rule) and "Postulation" (requires only the exclusion of alternatives), you need a case where the universal rule is genuinely absent, yet the conclusion is unavoidable.

  **The Case:**
  > "In 2002, we had a pilot plant reactor that vibrated violently only when the wind blew from the North-East. We checked the mounting, the flow rates, the motor alignment. Everything was within spec. There was no known rule linking wind direction to internal resonance in this vessel. We couldn't infer 'wind causes vibration' because we had no prior instances of this class of vessel. However, the vibration *only* happened with North-East wind. We postulated a 'standing wave in the intake stack' specific to that geometry. We fitted a baffle. The vibration stopped. We never measured the wave, and we never saw a similar case in another vessel."

  **Why this splits the readings:**
  *   **The Inference Reading (Strict Nyaya):** She must say this is **not knowledge** (or at best, a lucky guess). Why? Because you had no *vyapti*. You had not observed "North-East wind -> Vibration" enough times to establish a universal rule, nor could you derive it from the nature of the thing (unlike stoichiometry). You simply correlated two events.
  *   **The Postulation Reading (Mimamsa/Arthapatti):** She should say this **is knowledge via Postulation**. The observed fact (vibration) is inexplicable unless the postulated fact (standing wave) is assumed. The impossibility of the alternative (it's not the motor, not the flow, etc.) forces the postulation.

  **What to ask her:** "In the wind case, I had no universal rule, only an anomaly that demanded a specific explanation to make sense of the world. Did I *know* there was a standing wave, or did I just have a working hypothesis?"

  If she says "Knowledge (Inference)," she is stretching the definition of *vyapti* to include single-case necessity. If she says "Hypothesis (Not Knowledge)," she is protecting the strict Inference model. If she says "Knowledge (Postulation)," she is stepping outside strict Nyaya orthodoxy.

