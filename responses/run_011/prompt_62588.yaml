  ### Where Your Scheme Is Wrong

  **Does g belong in the calculation at all?**
  No. A second of suffering is a second of suffering, regardless of how many "frames" of experience fill it. High temporal resolution (high `g`) means the creature perceives motion faster, not that it suffers more per clock-second. If you swat a fly, it perceives the swat in slow motion, but the duration of the pain is still defined by physical time, not subjective frames. You should replace `g` with 1.00 for all entities; what matters is the intensity (`d`) and duration, not the refresh rate.

  **Is multiplying by p the right way to handle uncertainty?**
  Mathematically, yes; morally, it is risky. Multiplying by `p` treats a 30% chance of agony as 30% agony, which licenses you to ignore the 70% chance that you are causing full suffering. For sustainability reporting, you should apply a precautionary multiplier: if `p` exceeds a threshold (e.g., 0.10), round it up to a conservative floor (e.g., 0.50) to account for the moral risk of being wrong.

  **Are g and d actually independent?**
  They are negatively correlated. Nervous systems optimized for high-speed reflexes (high `g`) typically sacrifice the complex integration required for deep emotional states (low `d`). A creature that processes time very quickly is usually reacting to immediate stimuli rather than ruminating on deep suffering. Your decomposition is useful for clarity, but you should not treat them as orthogonal variables; high `g` should naturally dampen expectations of high `d`.

  **Should the weight be per second or per life?**
  Per life is the correct moral unit. Total suffering is the integral of suffering-rate over time. Your current method (rate × lifespan) achieves this, but do not view longevity as a "reward"; it is simply more existence. A chicken living six weeks counts less than a chicken living six years only because there is less time in which to suffer, not because the life is less valuable.

  **Where does the scale stop?**
  The cutoff is the capacity for valence—the ability to experience states as "good" or "bad" rather than just "stimulus" and "response." This requires a centralized nervous system capable of integrating information into a unified state. Plants and thermostats lack this; they react to damage but do not feel it. The numbers should taper to exactly zero at the point where neural integration ceases, not merely decline forever.

  **Is there an item on your list that this scheme handles especially badly?**
  The pupa. You are scoring it as a separate entity, but it is the same moral patient as the larva and adult, merely in a different state. Treating it separately fragments the lifecycle. You should model the animal as a single unit with a variable weight function over time, where the pupal stage drops to near-zero but remains part of the same continuous existence.
