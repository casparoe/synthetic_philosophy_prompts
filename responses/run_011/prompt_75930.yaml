  9.  **Self-Correction during drafting:**
      *   *Check:* Did I distinguish between "Religion" (the system) and "Religious Cognition" (the capacity)?
      *   *Fix:* Ensure the menu explicitly separates the cultural complex from the cognitive hardware.
      *   *Check:* Did I address the "strict architectural sense"?
      *   *Fix:* Make sure M2 emphasizes "necessary consequence" vs M1's "lack of evidence for adaptation."
      *   *Check:* Is the link between Move 1 and Move 2 clear?
