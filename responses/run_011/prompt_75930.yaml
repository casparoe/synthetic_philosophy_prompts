      *   **Problem:** A classmate used the phrase "religion is a spandrel" twice to shut down two different arguments (1. Costly signaling/group adaptation; 2. Epistemic justification/truth-tracking). The user feels the phrase slides between distinct theses.
      *   **Task:**
          1.  Provide a *menu* of distinct, precisely formulated claims hidden behind "religion is a spandrel."
          2.  Order them from platitudes to substantive/defensible to false/unavailable.
          3.  Handle specific axes of divergence: strict vs. loose sense of "spandrel," origins vs. current design, whole religion vs. cognitive ingredients, ontological verdict vs. null model/burden of proof, individual vs. group levels.
          4.  Identify where synonymous-looking formulations differ.
          5.  Analyze the classmate's two moves (dismissal of signaling debate, epistemic discount) against these readings.
          6.  Determine if the second move follows from the first or requires hidden premises.
          7.  Flag cases where one move works and the other doesn't (crucial for the user's paper).
          8.  **Constraint:** No bibliography/survey of names. Focus on analysis. Be plain about indeterminacy.

  2.  **Deconstruct "Spandrel" in Evolutionary Biology (Gould & Lewontin):**
      *   *Strict Sense:* An architectural byproduct. Necessarily arises from the construction of something else (the arch). Has no initial function. Cannot be selected *for* initially.
      *   *Loose Sense:* Anything not directly selected for. Exaptations, noise, drift.
      *   *Key Distinction:* Byproduct (non-adaptive origin) vs. Adaptation (adaptive origin).
      *   *Key Distinction:* Origin vs. Current Utility (Exaptation). A spandrel can be co-opted later.

  3.  **Drafting the Menu of Claims (Iterative Process):**

      *   *Claim 1 (The Platitude):* "Religion isn't a single gene." (Too weak). Better: "Not every feature of religion is an adaptation."
      *   *Claim 2 (The Strict Byproduct):* Religion arises necessarily from other cognitive adaptations (e.g., HADD, ToM) without being selected for itself.
      *   *Claim 3 (The Null Model):* Assume byproduct until adaptation is proven. (Methodological).
      *   *Claim 4 (The Exaptation Twist):* It started as a spandrel but is now an adaptation. (This breaks the classmate's argument).
      *   *Claim 5 (The Level Confusion):* Individual spandrel, group adaptation.
      *   *Claim 6 (The Epistemic Leap):* Byproducts don't track truth. (This is the tricky one).

      *Refining the Axes:*
      *   *Strict vs. Loose:* Architectural necessity vs. "just happened."
      *   *Origins vs. Maintenance:* Selected *for* originally vs. selected *for* now.
      *   *Granularity:* "Religion" (the complex system) vs. "Religious Cognition" (the mental tools).
      *   *Function vs. Truth:* Adaptive utility vs. Veridicality.
      *   *Level:* Individual cognition vs. Group cohesion.

  4.  **Structuring the Menu:**
      *   *Category A: Methodological/Deflationary (Platitudes/Null Models)*
      *   *Category B: Substantive Evolutionary Claims (Defensible)*
      *   *Category C: Overextended/False Claims (Unavailable)*

  5.  **Analyzing the Classmate's Moves:**
      *   *Move 1 (Anti-Signaling):* If religion is a spandrel, it has no function *to be signaled*.
          *   *Requirement:* Needs "Strict Byproduct at Group Level" + "Origins = Current Status."
          *   *Vulnerability:* Exaptation. Even if it started as a spandrel, it could *become* a signaling mechanism later.
      *   *Move 2 (Epistemic Discount):* If it's a byproduct, it doesn't track truth.
          *   *Requirement:* Needs "Reliability of cognitive machinery transfers to byproducts."
          *   *Vulnerability:* Evolution selects for fitness, not truth, *even for adaptations*. So being an adaptation doesn't guarantee truth either. Being a spandrel doesn't guarantee falsehood (e.g., math might be a spandrel of language but tracks truth).
      *   *The Link:* Does Move 1 imply Move 2?
          *   No. Functionality (Move 1) and Truth (Move 2) are orthogonal.
          *   The classmate assumes: No Function $\rightarrow$ No Truth Tracking. This is a non-sequitur.
          *   Actually, the deeper assumption is: Adaptation $\rightarrow$ Truth Tracking (which is also dubious in evolutionary psychology).
          *   *Crucial Flag:* There is a reading where Move 1 holds (it's not a group adaptation) but Move 2 fails (the cognitive machinery underneath *is* truth-tracking enough, or the spandrel status doesn't dictate epistemic value).

  6.  **Developing the Analysis (Drafting content):**

      *   *Introduction:* Acknowledge the slippage. The term "spandrel" is doing too much work.
      *   *The Menu:*
          1.  **M1 (Methodological Null Hypothesis):** Don't assume adaptation. Burden of proof is on the adaptationist. (Platitude/Defensible).
          2.  **M2 (Strict Architectural Byproduct):** Religious thought is a necessary consequence of non-religious cognitive modules (HADD, ToM). No specific selection for "religion." (Substantive).
          3.  **M3 (Origin vs. Maintenance):** It originated as a byproduct but may be maintained by selection now. (Crucial distinction).
          4.  **M4 (Level Specificity):** Spandrel for the individual gene, Adaptation for the group (or vice versa).
          5.  **M5 (The Epistemic Claim):** Byproducts lack teleological direction toward truth. (Problematic).
          6.  **M6 (The Totalizing Error):** "Religion" is a single thing that is either a spandrel or adaptation. (False).

      *   *Analyzing the Moves:*
          *   *Move 1 (Signaling):* Requires M3 (Origin = Maintenance) and M4 (Group Level = Individual Level). If religion is an *exaptation* (M3), it can be a signal *now* even if it wasn't selected *then*. So Move 1 is vulnerable unless "spandrel" means "currently non-functional."
          *   *Move 2 (Epistemic):* Requires M5. But M5 is weak. Adaptations aren't truth-trackers either (they are fitness-trackers). So the contrast fails.
          *   *The Link:* The classmate assumes "Adaptation = Truth" and "Spandrel = Noise." Both are suspect.
          *   *The Goldilocks Zone for the Paper:* The reading where Religion is a *Individual Cognitive Byproduct* (M2) but a *Group Functional Exaptation* (M3/M4). This kills the signaling argument (it's not a *genetic* adaptation for signaling) but saves the epistemic argument? No, wait.
          *   *Better Zone:* The reading where Move 1 is valid (It's not a group adaptation selected for signaling) but Move 2 is invalid (Byproduct status doesn't determine truth value). This allows the user to critique the classmate's slide.

  7.  **Refining the "Truth-Tracking" Issue:**
      *   This is the philosophical core. Plantinga's EAAN (Evolutionary Argument Against Naturalism) looms here.
      *   If cognition is selected for fitness, not truth, *all* beliefs are suspect, not just religious ones.
      *   If the classmate says "Religion is a spandrel, therefore false," they imply "Adaptations are true." That's the hidden premise.
      *   *Correction:* The classmate likely means "Religion is a spandrel, therefore it wasn't designed to represent reality." But neither were adaptations.
      *   *Key Insight:* The epistemic discount only works if you assume *only* direct selection for representation yields truth. But HADD (Hyperactive Agency Detection) is an adaptation that produces false positives (a spandrel-like error rate) to ensure survival.
      *   *Winning Argument:* The spandrel claim undermines the *function* argument (Move 1) more than the *truth* argument (Move 2), unless one smuggles in a premise about the reliability of adaptations vs. byproducts which doesn't exist.

  8.  **Final Review against Constraints:**
      *   Menu format? Yes.
      *   Ordered by plausibility? Yes.
      *   Axes handled (strict/loose, origin/maintenance, etc.)? Yes.
      *   Analyze the two moves? Yes.
      *   Flag the divergence? Yes.
      *   No bibliography? Yes.
