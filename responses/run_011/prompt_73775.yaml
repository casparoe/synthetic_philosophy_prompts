answer: |-
  The Tribunal of Retroactive Merit smelled of ozone and old paper. Elara sat at the adjudication desk, the Great Ledger open before her. It was a physical book, bound in leather that cracked when the humidity dropped, with pre-printed columns for Proposition, Prior Credence, Posterior Credence, and Payout Factor. You could not add columns. The binding resisted expansion.

  Across the aisle, Mrs. Halloway, a hydrologist with hands stained by forty years of sediment samples, adjusted her glasses. She looked tired. Opposing her was Mr. Vance, a actuary for the Municipal Insurance Pool, who looked like he had never touched dirt in his life.

  "The theory was published in 1984," Vance said, his voice flat. "The sediment spike in the harbor occurred in 1987. Everyone knew the spike happened. It is public record. Mrs. Halloway's model merely catches up to reality. There is no surprise. Therefore, there is no novelty credit."

  "The model did not exist in '87," Halloway countered. "I suspected the mechanism, but I lacked the algebra. Yesterday, I finished the proof. My theory *entails* the spike. I learned something yesterday. The city should pay for what I learned."

  Elara listened while her pen hovered over the Ledger. This was the old evidence problem, dressed in municipal zoning law. The rules stated payout scaled with credence movement. If you already knew the evidence was true, your probability was one. If it was one, it couldn't move. No movement, no money.

  Elara turned to the temporary apprentice sitting at the side desk. "Rule one," she said, keeping her voice low. "Never ink a certainty. Never write '1.0'. Write '0.999'. Certainty cracks the paper."

  The apprentice nodded, scribbling notes. It was wrong, technically. Probabilities could hit one. But in the Tribunal, a column inked at 1.0 was considered 'sealed,' and sealed columns couldn't be updated. It was a bureaucratic hack to keep the ledger fluid, a wrong mechanic that was load-bearing for the entire payroll system.

  "Compute the shift," Elara ordered herself.

  She looked at the Proposition column. She needed to record the update event. Usually, this was straightforward. *Observation O occurs.* Prior: 0.5. Posterior: 1.0. Model M predicts O. Prior: 0.5. Posterior: 0.8. Payout calculated.

  But Halloway wasn't claiming an observation. She was claiming a logical link. The proposition wasn't "Sediment spiked." The proposition was "Theory H entails Sediment Spike."

  Elara dipped her pen. She wrote: *H → S_87*.

  She paused. She needed to assign a credence to this entailment. Before yesterday, what did Halloway believe? She hadn't thought about it. She hadn't bothered to state the implication because she couldn't prove it yet.

  Elara realized she needed a column for *P(H → S_87)*. She wrote it. But then, logically, she needed a column for the reliability of that assignment. *P(P(H → S_87) is correct)*. And then a column for the logic used to derive that.

  She turned the page. The Ledger had finite lines. There were only so many propositions a human could write down in a lifetime. But the space of logical implications was infinite. For every theory she hadn't read and every data point she'd never see, there was a potential entailment claim waiting to be discovered. If she tried to account for the uncertainty of the logical connection itself, the Ledger would fill before she reached the bottom of the first calculation.

  She looked at Halloway. The old woman was watching the pen, hopeful.

  Elara tried the other way. Vance's way. The friend's way.

  She erased the *1.0* she had instinctively almost written for the sediment spike. She smeared it. She wrote *0.9999*. The fact was known, but she pretended it wasn't quite certain. A little mass remained movable.

  Now, if Halloway's theory predicted the spike, and the spike was only *0.9999* certain, then confirming the spike could theoretically boost the theory's probability. The math worked. The columns balanced. Elara felt a brief flash of enlightenment. It was a trick, yes, but it kept the ledger open. It allowed the old evidence to flow like water through a sieve that was almost, but not quite, clogged.

  She picked up her pen to calculate the payout factor. She multiplied the credence shift by the statutory rate.

  Then she stopped.

  If she was smearing the probability of the sediment spike because observation is fallible, she had to smear the probability of the arithmetic she was doing right now. She wasn't logically omniscient. She might be adding the columns wrong. She might be misreading the statute.

  If *P(Arithmetic is Correct)* was less than 1, then the payout calculation was uncertain. But the Ledger required a definitive number to cut a check. You couldn't write a check for "Approximately 5,000 credits, subject to revision of logical laws."

  The smearing fix didn't liberate her; it infected the calculation itself. If nothing was certain, not even the subtraction she was performing in her head, then the Ledger was just a book of guesses about guesses. The ink wouldn't dry. The audit would fail.

  She looked at the columns again. They were full. Not with data, but with the metadata of uncertainty. She had run out of room to express her doubt about the doubt.

  "Miss Elara?" Vance prompted. "The clock is ticking."

  Elara closed the Ledger. The leather creaked. She reached for the evidence file attached to Halloway's claim. It was a thick folder of tide gauge readings from 1987. She flipped through the laminated sheets, looking for the certification stamp.

  There it was, on page forty-two. Gauge Station 4. Harbor Mouth.

  She frowned. She remembered the maintenance logs from last week. The city had dug up the harbor floor to lay new fiber optics. They'd found Gauge 4.

  She pulled the maintenance docket. *Status: Decommissioned. Error: Drift detected in mechanical linkage. Data 1985-1989 flagged as unreliable.*

  The sediment spike everyone knew about? The number everyone had used for forty years? It came from a broken machine. The town had known the *number*, but the number was a lie. The physical reality was lost.

  Elara felt a strange coldness in her chest. The philosophical argument evaporated. It didn't matter if Halloway learned something new about logic. It didn't matter if Vance was right about surprise.

  The data was tainted.

  "Mr. Vance," Elara said. "The claim relies on Harbor Gauge 4."

  "It does," Vance said.

  "Guild Maintenance Flag 99 was issued on Tuesday. Gauge 4 is mechanically compromised. The 1987 reading is inadmissible as ground truth."

  Halloway stood up. "That's procedural! The physics hasn't changed!"

  "The Tribunal pays for models that explain verified measurements," Elara said, her voice monotone. "If the measurement is unverified, the model explains nothing. There is no evidence to be old or new."

  She opened the Ledger one last time. She didn't write a probability. She didn't calculate a shift. She went to the Status column and stamped *VOID: SOURCE CORRUPTION*.

  She signed her name. The ink dried instantly because she hadn't tried to smear it.

  Vance nodded, packing his briefcase. He looked satisfied, but not because he'd won the argument about surprise. He'd won because a machine broke. Halloway looked devastated, not because her epistemology was wrong, but because her life's work rested on a rusted gear.

  Elara handed the rejection slip to the bailiff.

  "Is that it?" the apprentice asked, leaning in. "Did we prove the theory doesn't count?"

  "We proved the gauge is broken," Elara said. She closed the heavy book. The limits of the pages held firm. There were still infinite propositions unwritten inside the binding, infinite entailments never discovered, infinite uncertainties un smeared.

  "But what if they fix the gauge?" the apprentice asked. "What if they recalibrate the data?"

  "Then someone else will file a claim," Elara said. "And someone else will have to decide if learning a logical connection counts as seeing the world."

  She stood up and walked to the window. The port city stretched out below, grey and wet. The tide was coming in. She knew it would come in, but she wasn't sure why. She wasn't sure if she believed the moon pulled it, or if she just believed the tables that said it would. She wasn't sure if believing the tables was different than believing the moon.

  She turned back to the desk. The Ledger sat there, finite and stubborn. It did not grow to fit the world. It forced the world to shrink to fit the columns.

  "File the rejection," Elara said. "And tell Maintenance to fix Gauge 4. If we're going to pay anyone, I want them to pay for breaking a machine, not for breaking logic."

  "Yes, ma'am."

  Elara took off her glasses and rubbed the bridge of her nose. The argument would continue. Halloway would write papers. Vance would cite precedents. Her friend at the forecasting firm would argue about smearing probabilities over dinner. They would talk past each other, one insisting that surprise was the only currency, the other insisting that logical discovery was the only real trade.

  But here, in the Tribunal, the money moved only when the paperwork was clean. The philosophy was just the noise the machine made while it chewed through the paper. She picked up the next file. A meteorologist claiming credit for predicting last winter's snow because he'd found a new way to read the barometer logs.

  Elara opened the Ledger. She checked the columns. There was room for one more proposition. She dipped her pen. She didn't think about the infinite implications waiting in the dark. She just wrote the number down.
