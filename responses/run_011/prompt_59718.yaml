      *   (3) *Anti-Naive Group Selection:* Williams' critique stands. Within-group selection beats between-group selection easily (migration kills it).
      *   (4) *Major Transitions/MLS:* Higher-level selection *did* suppress lower-level conflict to build new individuals (Maynard Smith/Szathmáry).
      *   (5) *No "Good of Species":* Strict avoidance of species selection/group benefit rhetoric.
      *   (6) *Equivalence Thesis:* Inclusive Fitness (IF) and Multilevel Selection (MLS) are mathematically equivalent. The debate is notational/rhetorical. Hamilton's rule covers altruism.
      *   (7) *Universal Darwinism:* Selection is general (ideas, firms, algorithms).

  3.  **Identify Tensions/Incoherencies:**

      *   **Tension A: (1) vs. (2) & (4).**
          *   (1) says *only* genes replicate with fidelity, so selection acts on them. Organisms are just sorted.
          *   (2) & (4) say organisms/higher-level entities become "individuals" through transitions where higher-level selection suppresses lower-level conflict.
          *   *Conflict:* If selection *proper* only happens to genes (1), how can "higher-level selection" (4) build individuals? If organisms are just vehicles (1), in what sense are they "real individuals" (2) in an evolutionary context?
          *   *Severity:* High. This is the core "Unit of Selection" problem.

      *   **Tension B: (3) vs. (4).**
          *   (3) says group selection is dead/impossible against within-group selection (Williams' view).
          *   (4) says major transitions *relied* on higher-level selection suppressing lower-level free-riding.
          *   *Conflict:* (4) *is* a form of group selection (or at least MLS). If (3) is strictly true (migration kills group selection), then (4) is biologically impossible without special mechanisms (bottlenecks, policing) that (3) seems to dismiss as "shouted at."
          *   *Severity:* High. This is a direct contradiction on the efficacy of between-group dynamics.

      *   **Tension C: (1) vs. (7).**
          *   (1) defines selection tightly around biological replication fidelity (genes).
          *   (7) expands selection to ideas/firms/algorithms (Universal Darwinism).
          *   *Conflict:* Do ideas replicate with the *fidelity* required in (1)? Usually no (memes mutate heavily). If (1) is the definition of "Selection proper," (7) is metaphorical. If (7) is literal, (1) is too narrow.
          *   *Severity:* Medium. Often hand-waved in popular science, but philosophically sloppy.

      *   **Tension D: (6) vs. (1) & (4).**
          *   (6) says IF and MLS are equivalent/notational.
          *   (1) privileges the gene (IF territory).
          *   (4) privileges the transition to higher levels (MLS territory).
          *   *Conflict:* If they are truly equivalent, why does (1) make an ontological claim ("only things that replicate... are genes") while (4) makes a causal claim about higher-level suppression? The "equivalence thesis" is often used to dodge the ontological question, but (1) takes a side on ontology.
          *   *Severity:* Medium-High. It creates a "have your cake and eat it too" situation regarding the *reality* of levels.

      *   **The "Double Duty" Term:**
          *   Candidate: **"Individual"** or **"Selection"**.
          *   Looking closely at (1) vs (2)/(4). In (1), "individual" implies replicator. In (2)/(4), "individual" implies integrated interactor.
          *   Looking at (3) vs (4). "Group selection" in (3) is the naive kind (Wynne-Edwards). "Higher-level selection" in (4) is the MLS kind (Okasha/Szathmáry). The user treats them as compatible, but (3) dismisses the mechanism required for (4).
          *   *Winner:* **"Selection"**. In (1) it requires replication. In (4) and (7) it applies to sorting/interactors and non-biological analogues.

  4.  **Drafting the Audit (Iterative Process):**

      *   *Introduction:* Acknowledge the friend's comment. The incoherence isn't in the facts, it's in the *ontological status* assigned to different levels.
