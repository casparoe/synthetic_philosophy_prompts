          1.  **(3) vs. (4)** is the biggest biological contradiction. You can't say group selection is mathematically dead *and* that it built multicellularity.
          2.  **(1) vs. (2)/(4)** is the biggest philosophical contradiction. Replicator vs. Interactor ontology.
          3.  **(6)** is the "get out of jail free" card that doesn't work with (1).
          4.  **(7)** is the least problematic but dilutes (1).
      *   *The Double Duty:* It's "Selection." Sometimes it means "differential replication of replicators" (1), sometimes "differential survival of interactors" (2/4), sometimes "algorithmic process" (7).
