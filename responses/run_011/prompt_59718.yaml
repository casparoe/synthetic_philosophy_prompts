          3.  **The Equivalence Dodge (6):** Using math equivalence to hide ontological commitments made in (1) and (2).
          4.  **Universal Darwinism (1 vs 7):** Fidelity issues.
      *   **Fixes:** Provide specific cuts for each.

  7.  **Final Polish:** Ensure tone is empathetic to a journalist but rigorous enough to satisfy a population geneticist. (Avoid jargon where possible, but use it correctly). *Self-Correction:* The user asked to identify the term doing double duty. I need to be precise. It's likely **"Selection"** or **"Individual"**. Let's look at (1) "Selection proper happens to replicators" vs (4) "selection at a higher level". If selection only happens to replicators, and only genes are replicators, selection *cannot* happen at a higher level. So "Selection" is doing double duty.

      *Wait, re-reading (1):* "Selection proper happens to replicators... organisms... get sorted."
      *Re-reading (4):* "selection at a higher level suppressed the free-riding..."
      *Conflict:* If selection *proper* is only on replicators (1), then (4) is using "selection" loosely. But (4) claims this selection *built* new individuals. If it's not "selection proper," how did it build anything evolutionary?
      *Okay, the double duty term is **"Selection"**.* In (1) it is defined narrowly (Dawkins). In (4) and (7) it is defined broadly (Lewontin/General).

      *Wait, let's look at (3) vs (4) again.* (3) says group selection fails against within-group. (4) says higher-level selection suppressed free-riding (within-group). These are the same dynamic. (3) says it can't work. (4) says it did work. This is the most glaring biological contradiction.

      *Let's look at (1) vs (2).* (1) says organisms are not copied. (2) says they are real individuals. This is the Hull/Dawkins vs. Ghiselin/Ruse debate. It's resolvable (Interactor vs Replicator), but the user's phrasing in (1) ("Selection proper happens to replicators") excludes interactors from being the *target* of selection, while (4) requires them to be the target.

      *Decision:* I will rank (3) vs (4) as the most dangerous because it looks like ignorance of modern MLS theory. I will rank (1) vs (4) as the deepest philosophical incoherence. I will identify "Selection" as the double-duty term.

