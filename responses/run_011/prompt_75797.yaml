answer: |-
  ### The Profile: The Urban Planning Society Conference

  **Context:** The Urban Planning Society (11 members) is voting on the location for their annual conference. The candidates are **Atlanta (A)**, **Boston (B)**, and **Chicago (C)**. They use Instant-Runoff Voting (IRV).

  **The Ballots:**
  There are three distinct voting blocs. Every candidate has genuine first-choice support.

  | Voter Type | Count | Preference Order |
  | :--- | :--- | :--- |
  | **Type 1** | 4 | Atlanta > Boston > Chicago ($A > B > C$) |
  | **Type 2** | 3 | Boston > Atlanta > Chicago ($B > A > C$) |
  | **Type 3** | 4 | Chicago > Boston > Atlanta ($C > B > A$) |
  | **Total** | **11** | |

  ---

  ### Count 1: Everyone Votes (11 Voters)

  **Round 1:**
  *   **Atlanta:** 4 votes
  *   **Boston:** 3 votes
  *   **Chicago:** 4 votes
  *   *Elimination:* **Boston** has the fewest votes (3) and is eliminated. (No ties).

  **Round 2:**
  *   Boston's 3 ballots (Type 2: $B > A > C$) transfer to their second choice, **Atlanta**.
  *   **Atlanta:** 4 + 3 = 7 votes
  *   **Chicago:** 4 votes
  *   *Winner:* **Atlanta** wins with 7 votes.

  **Outcome for Type 3 Voters:** Their last choice (Atlanta) wins.

  ---

  ### Count 2: Two Type 3 Voters Abstain (9 Voters)

  Suppose two members of the **Type 3** bloc ($C > B > A$) decide to stay home.

  **Round 1:**
  *   **Atlanta:** 4 votes
  *   **Boston:** 3 votes
  *   **Chicago:** 2 votes (4 original minus 2 abstaining)
  *   *Elimination:* **Chicago** has the fewest votes (2) and is eliminated. (No ties).

  **Round 2:**
  *   Chicago's 2 remaining ballots (Type 3: $C > B > A$) transfer to their second choice, **Boston**.
  *   **Atlanta:** 4 votes
  *   **Boston:** 3 + 2 = 5 votes
  *   *Winner:* **Boston** wins with 5 votes.

  **Outcome for Type 3 Voters:** Their second choice (Boston) wins.

  **The Paradox:** The two Type 3 voters are strictly better off ($B \succ A$) if they do not turn up at all. By voting sincerely, they ensured Chicago survived Round 1, which caused Boston to be eliminated, handing the victory to their least favorite candidate, Atlanta.

  ---

  ### Analysis

  #### 1. Truncation vs. Abstention
  Could the Type 3 voters achieve the better outcome (Boston) by showing up but **truncating** their ballot (ranking only Chicago)?

  *   **Scenario:** The two voters show up and mark only $C$.
  *   **Round 1:** Counts are identical to "Count 1" (Atlanta 4, Boston 3, Chicago 4). Boston is eliminated.
  *   **Round 2:** Boston's votes transfer to Atlanta. Atlanta reaches 7 votes. Chicago remains at 4.
  *   **Result:** Atlanta wins.
  *   **Why:** Truncation only affects what happens if *your* candidate is eliminated. In the "Everyone Votes" scenario, Chicago is *not* eliminated first; Boston is. Therefore, the Type 3 voters' lower rankings never come into play. Their mere presence boosts Chicago's Round 1 count enough to save Chicago, which inadvertently dooms Boston.
  *   **Verdict:** Truncation does **not** solve the problem. Abstention is uniquely powerful here because it lowers the first-round count, changing the elimination order.

  #### 2. Single Voter vs. Multiple Voters
  **Does the paradox need two or more people staying home, or could a single voter pull it off?**

  **Argument:** A single voter cannot pull this off under the "no ties" constraint.
  To flip the winner from Atlanta (bad) to Boston (good) for a Type 3 voter, the elimination order in Round 1 must flip.
  *   **With Voter:** Boston must be eliminated ($Votes_B < Votes_C$).
  *   **Without Voter:** Chicago must be eliminated ($Votes_C - 1 < Votes_B$).

  Let $b$ and $c$ be the vote counts for Boston and Chicago excluding the voter in question.
  1.  **With:** $b < c$ (Boston eliminated).
  2.  **Without:** $c - 1 < b$ (Chicago eliminated).

  Combining these inequalities: $c - 1 < b < c$.
  For integers, there is no number $b$ strictly between $c-1$ and $c$. The only solution is if $b = c - 1$ (With) and $b = c - 1$ (Without), which implies $b = c - 1$ and $c - 1 < c - 1$ (False), or it implies a tie ($b = c$) in one of the scenarios.
  Since the constraints forbid ties, **at least two voters** must abstain to create a gap large enough to flip the elimination order without creating a tie. (In our profile: $3 < 4$ becomes $3 > 2$).

  #### 3. Doubling the Profile
  **Does it survive doubling every ballot type?**
  If we double the society to 22 voters (8 Type 1, 6 Type 2, 8 Type 3) but still have only **two** voters abstain:
  *   **Round 1:** Atlanta 8, Boston 6, Chicago 6 (8 minus 2).
  *   **Result:** **Tie** between Boston and Chicago.
  *   **Verdict:** The paradox **fails** (or becomes undefined due to the tie constraint). IRV is not homogeneous; the "granularity" of the vote count matters. The paradox relies on the margin between 2nd and 3rd place being smaller than the number of abstainers. If you scale the profile but not the abstaining group, the margin scales too, swallowing the effect.

  ---

  ### Structural Feature & Theoretical Situating

  **Structural Feature:**
  The engine of this paradox is **Non-Monotonicity** linked to **Elimination Sensitivity**.
  In IRV, adding votes to a candidate (Chicago) can save them from early elimination, which changes *who* gets eliminated next (Boston instead of Chicago). This changes the flow of transfers. Here, saving Chicago kills Boston, and Boston's transfers were the only thing that could beat Atlanta. Removing votes from Chicago lets Chicago die early, saving Boston, whose transfers then beat Atlanta.
  **If you remove this feature:** If you remove the transfer mechanism (e.g., Plurality voting), Chicago simply loses in both cases. If you remove the elimination mechanism (e.g., Borda), the vote totals simply aggregate, and adding a vote for C cannot make C's enemy A win.

  **Gibbard–Satterthwaite (G-S):**
  This is **not** a direct instance of Gibbard–Satterthwaite.
  *   **G-S** concerns *manipulation*: A voter achieves a better outcome by casting an *insincere* ballot (e.g., ranking B > C > A when they prefer C > B > A).
  *   **No-Show** concerns *participation*: A voter achieves a better outcome by casting *no* ballot.
  *   **Relation:** It is a "cousin." Both demonstrate that truthful revelation of preference is not a dominant strategy in all systems. However, G-S assumes a fixed set of voters. The No-Show paradox violates the **Participation Criterion**, which G-S is silent on. It shows that the "game" includes the decision of whether to play at all.

  **Cost to the IRV Pitch:**
  The standard pitch for IRV is: *"You can vote your conscience without fear of the spoiler effect."*
  This case demonstrates that the pitch is **false**.
  1.  **Spoiler Effect:** The Type 3 voters voting for their conscience (Chicago) acted as a spoiler for their compromise candidate (Boston).
  2.  **Conscience:** Voting sincerely ($C > B > A$) yielded their *worst* outcome.
  3.  **Implication:** To vote strategically in IRV, you cannot just rank honestly; you must sometimes calculate whether your favorite candidate is "too strong" (causing a bad elimination order) or "too weak." In this specific profile, the rational advice to a Type 3 voter is: *"Do not vote for your favorite, or you will elect your least favorite."* This undermines the core simplicity argument for IRV over plurality.
