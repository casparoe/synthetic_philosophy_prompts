  - **Summary of the activity**
  This seminar activity simulates the tension between aggregate welfare maximization and the separateness of persons. Over four rounds, students manage "Comfort Tokens" redeemable for end-of-class privileges. Round 1 establishes individual rationality: accepting a present cost for a larger future gain. Round 2 imposes the identical arithmetic interpersonally: a minority bears the cost so the majority gains. Round 3 removes identifiability to test if outrage stems from visibility or separation. Round 4 tests if compensation resolves the moral residue. The design forces students to author a rule in Round 1 that condemns them in Round 2, creating a visceral experience of Rawls's objection without initially naming it. The goal is not to refute utilitarianism, but to feel the weight of the sacrifice that arithmetic ignores.

  - **Materials and setup**
  You need 16 chairs arranged in a circle to emphasize community. Prepare 320 "Comfort Tokens" (colored index card slips, 20 per student). Bring a tangible prize for the token raffle (e.g., a high-quality book or a voucher for a local café—something desirable but not cash/grades). Pre-write the following on the whiteboard: "Round 1: Self. Round 2: Committee. Round 3: Veil. Round 4: Consent." Place a "Class Pot" box at the center. Have 16 index cards ready for private rule-writing. Ensure you have a method to randomly select 3 students in Round 2 (e.g., a hat with names). Do not mention Rawls or utilitarianism on the board. The room should be warm but slightly cramped to enhance the value of comfort tokens.

  - **The four rounds**
  **Token Economy:** Each student starts with 20 tokens. Tokens are raffle entries for the prize. Losses are felt via loss aversion; once endowed, removing tokens feels like a penalty. Adults at 9 PM value tangible rewards and autonomy; removing entry chances triggers genuine irritation.

  **Round 1 (Intrapersonal):** Distribute 20 tokens to each student. Hand out "Decision Cards." Text: *Option A: Keep 20 tokens. Option B: Pay 13 tokens now, receive 39 tokens at class end.* Students decide privately. Almost all choose B (Net +26). They write their rule on an index card (e.g., "Maximize net gain"). Cards are posted on the wall. Collect the 13-token "payments" into the Class Pot. Promise the 39-token return will be distributed at the very end of class.

  **Round 2 (Interpersonal):** Announce the class will now vote on a proposal using the *exact same numbers*. Proposal: *Three students (selected by lot) pay 13 tokens each. The 39 tokens collected are distributed equally among the remaining 13 students (3 tokens each).* The aggregate token flow (39) is identical to Round 1. The net class wealth is unchanged (redistribution), unlike Round 1 (creation), but the *sacrifice magnitude* is the key parallel. Select 3 students publicly. They stand. The class votes to apply the rule they wrote in Round 1. Most will hesitate or vote no, despite the arithmetic consistency. The 3 losers hand over tokens. The 13 winners receive theirs.

  **Round 3 (Anonymous):** Reset tokens to 20 each. Announce the same proposal (3 lose 13, 13 gain 3), but the losers are selected by secret ballot and not revealed until after the vote. The class votes again. This tests if the objection is about *identifiability* (seeing the loser) or *separateness* (the fact that it is a different person). Usually, approval rises slightly but remains below Round 1 levels, indicating the personhood matters, not just the visibility.

  **Round 4 (Consent/Compensation):** Reset tokens. Before selecting losers, ask for advance volunteers. If fewer than 3 volunteer, offer a compensation: Losers pay 13 but receive 5 extra tokens immediately from the instructor's personal stash (not the pot), making their net loss smaller, while winners still gain 3. This tests if the utilitarian reply (compensation) dissolves the objection. Often, students still resist, noting the *nature* of the loss matters, not just the net balance.

  **Reset Protocol:** Between rounds, collect all tokens and re-distribute 20 fresh ones to avoid counting errors. Do not discuss the parallel between rounds until the debrief. Keep the arithmetic visible on the board: "3 × 13 = 39" vs "13 × 3 = 39".

  - **Minute-by-minute timeline**
  **0-10:** Introduction and Token Distribution. Explain tokens are raffle entries. No ethics talk yet.
  **10-25:** Round 1. Individual decision, rule writing, posting cards. Collect payments.
  **25-45:** Round 2. Proposal announcement, selection of 3 losers, class vote, transfer. Observe hesitation.
  **45-60:** Round 3. Anonymous selection, vote, transfer. Compare mood to Round 2.
  **60-70:** Round 4. Consent and compensation attempt. Final transfer.
  **70-80:** Debrief. Connect experience to theory. Reveal Rawls. Distribute prize.

  - **Participant handout**
  **ETHICS SEMINAR: TOKEN EXERCISE**

  **Your Endowment:** You receive 20 Tokens.
  **Value:** Each token is one entry into a raffle for a prize at the end of class.
  **Privacy:** Your decisions and holdings are private unless a round specifies otherwise.

  **Round 1:** Decide for yourself.
  **Round 2:** The class decides for the group.
  **Round 3:** The class decides anonymously.
  **Round 4:** The class decides with compensation.

  **Rule Writing:** After Round 1, write one sentence describing the rule you used to decide. Post it on the wall.
  **Note:** Do not discuss the math with neighbors until the exercise is complete. Trust the arithmetic on the board.

  **Goal:** Maximize your outcome according to your own ethical standards.

  - **The debrief**
  Begin by asking the three students who lost tokens in Round 2 to describe the feeling of the transfer. Ask the class: "Look at the rules on the wall. Did anyone vote against their own rule in Round 2?" This highlights the first takeaway: *Your considered rule fails when applied to others.*

  Next, address the shift between Round 1 and 2. Ask: "The arithmetic was identical. The total tokens moved were the same. Why did the verdict change?" Guide them to see it wasn't procedural unfairness (the vote was democratic) but the location of the burden. This leads to the second takeaway: *The shift isn't about fairness of procedure, but the distribution of burden.*

  Then, address Round 4. "Even with compensation, did some still feel uneasy?" This surfaces the third takeaway: *Something remains uncancelled for the person who bore the cost.* The loss is theirs alone; the gain is diluted among others.

  **Handling Dissent:**
  If the **Consistent Maximizer** says, "I voted yes in Round 2; the net gain justifies it," validate them. Say: "You are holding the utilitarian line consistently. The question isn't whether you are wrong, but whether the rest of us are recognizing a moral fact you are abstracting away: the boundary of the skin."
  If the **Future-Self Skeptic** says, "Round 1 was also wrong; my future self is a different person," acknowledge this parallels Parfit. Say: "If you feel that strongly, you've actually deepened the objection. If we can't merge selves over time, merging distinct people is even harder."

  **The Reveal:**
  Only now, write on the board: *John Rawls, A Theory of Justice (1971).* Read the sentence: "Utilitarianism does not take seriously the distinction between persons." Explain that the game made them feel the weight of that distinction. The arithmetic treats the class as one super-person; the experience reminded them they are sixteen.

  - **What will go wrong**
  1.  **Anger at Loss:** The three students selected in Round 2 may feel genuinely aggrieved, not just philosophically challenged. *Mitigation:* Acknowledge their discomfort publicly. "Your discomfort is the data point." Ensure the prize is awarded fairly at the end so they don't feel doubly punished.
  2.  **Math Skepticism:** Students may dispute the aggregate equality. *Mitigation:* Keep the equation "3 × 13 = 39" visible. If they argue Round 1 created value and Round 2 didn't, concede the point but refocus: "The *sacrifice* was identical. That is the moral weight."
  3.  **Cynicism:** Students may treat tokens as meaningless. *Mitigation:* The prize must be desirable. If energy is low, make the prize immediate (e.g., choosing the break time).
  4.  **Round 3 Failure:** If anonymity doesn't change votes, students may miss the point about identifiability. *Preparation:* Have a backup question: "Did knowing *who* lost matter, or just that *someone* lost?" This salvages the distinction between separateness and visibility.
  5.  **Time Overrun:** The voting can drag. *Mitigation:* Use show-of-hands voting, not secret ballots, to save time. Keep the debrief tight.

  - **What the activity cannot show**
  You are correct to suspect the token economy limits the lesson. Tokens are fungible; one student's token is identical to another's. Real harms (health, pain, stigma) are not. In the clinic, the woman who lost the referral slot lost something unique to her life trajectory, not a transferable unit. The game assumes compensation is possible (Round 4); in reality, some losses are incommensurable and cannot be "paid off" by aggregate gain. Furthermore, the game occurs in a single session with low stakes. Real allocation decisions involve long-term trust and institutional legitimacy. The activity simulates the *structure* of the objection (the boundary of the person) but cannot replicate the *gravity* of real suffering. You must supply this in words during the debrief: "Tokens heal; health does not." The game shows the logical error; your testimony supplies the moral weight.

  - **Variants**
  **Thirty Students:** Increase losers to 6, winners to 24. Keep the ratio (1:4). Use a microphone for the debrief to ensure the "losers" voice is heard.
  **Fifty Minutes:** Drop Round 3 (Anonymity). Move directly from Round 2 (Interpersonal) to Round 4 (Compensation). This preserves the core tension (Self vs. Other) and the utilitarian reply (Compensation) within the tighter window.
  **No Tokens:** Use "Minutes of Break Time." The class has 10 minutes total. Round 1: You give up 1 minute now for 3 later. Round 2: 3 people give up 1 minute each so the rest get extra break time. This uses time instead of objects, which is often more visceral for evening students, though harder to distribute precisely.
