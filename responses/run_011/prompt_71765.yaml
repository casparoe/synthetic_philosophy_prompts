      *   **Thomson's Argument (1954):**
          1.  The lamp must be either ON or OFF at $t=1$ (Law of Excluded Middle).
          2.  It cannot be ON (because every ON period was followed by an OFF period).
          3.  It cannot be OFF (because every OFF period was followed by an ON period, except the very start, but the limit process erases the start's privilege).
