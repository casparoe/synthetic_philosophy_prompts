      *   *Principled or Fixable?* Move (4) reveals something principled. LLMs work by minimizing surprise based on training data. They inherently favor the "typical" over the "specific exception" unless the specific exception is overwhelmingly weighted in the context window. This is an architectural feature, not just a context-size bug.

