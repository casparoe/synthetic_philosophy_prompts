  ### Part 5: Application to New Cases

  Here is how the **Autonomy-and-Control Criterion** applies to your four new cases.

  **1. Spontaneous Symmetry Breaking (SSB) in a Small Ferromagnet**
  *   *Scenario:* A grain small enough that thermal fluctuations flip the magnetization direction frequently; no stable ordering direction.
  *   *Verdict:* **Not Emergent.**
  *   *Reasoning:* Fails Clause 3(A). While SSB is usually a limit phenomenon, in this finite sample, the "ordering" does not hold. The limit does not exert control because the system is too small to sustain the symmetry-broken state against fluctuations. It fails the "Asymptotic Control" test for this specific sample size.

  **2. Emergent Spacetime (Quantum Gravity)**
  *   *Scenario:* Spacetime geometry arises from entanglement or non-spatiotemporal graphs.
  *   *Verdict:* **Emergent.**
  *   *Reasoning:* Satisfies Clause 3(A) or 3(C). If spacetime is smooth only in a limit of discrete structures, and that limit controls finite physics (recovering General Relativity), it passes 3(A). If the geometry constrains the underlying quantum states (as GR constrains matter), it passes 3(C). It also satisfies Clause 2 (Universality/Invariance of geometric laws).

  **3. The Price Level of a Market**
  *   *Scenario:* Aggregate price index (e.g., CPI) which no single agent represents or intends.
  *   *Verdict:* **Not Emergent (Weakly Reducible).**
  *   *Reasoning:* Fails Clause 3(B) and 3(C). While no agent represents it (Explanatory Autonomy, Clause 2), it is an *aggregate statistic*, not a causal constraint. The price level does not physically constrain individual transactions in the way a hurricane constrains molecules; it is a summary of them. It is compressible (macro-economic equations exist). It is an aggregate, not an emergent entity, under this criterion.

  **4. Hypothetical Material with Undefined Bulk Modulus for Finite N**
  *   *Scenario:* Bulk modulus is mathematically undefined for every finite $N$, yet measured to six sig figs in ordinary samples.
  *   *Verdict:* **Emergent.**
  *   *Reasoning:* Satisfies Clause 3(A). This is a "Singular Limit" case stronger than Case 3. Even though the property is strictly undefined for finite $N$, the limit exerts absolute control over the finite measurements. This fits the "Asymptotic Control" clause perfectly. The fact that the derivation fails for finite $N$ but succeeds for the limit (which matches experiment) is the hallmark of this type of emergence.

