  ### Part 1: Pressure-Testing the Limit-Plus-Invariance Criterion

  Here is the evaluation of your twelve verdicts against your tentative criterion:
  *   **(i) Supervenience:** (Assumed passed for all cases).
  *   **(ii) Limit Condition:** *E exists only at a limit; no finite system exhibits an analogue.*
  *   **(iii) Invariance:** *Best explanation is invariant under substantial changes to T-level details.*

  | Case | Verdict | Criterion Output | Analysis |
  | :--- | :--- | :--- | :--- |
  | **1. Temperature** | Reducible | **Not Emergent** | **Match.** Finite systems have mean kinetic energy (analogue). Fails (ii). |
  | **2. Irreversibility** | Not Emergent | **Emergent** | **Contradiction.** Strict irreversibility requires $N \to \infty$ (Poincaré recurrence forbids it in finite systems). Passes (ii). Passes (iii). Your verdict relies on "no new being," but the criterion flags the limit. |
  | **3. Phase Transitions** | Emergent | **Emergent** | **Match.** Sharp transitions require thermodynamic limit. Passes (ii). Universality classes pass (iii). |
  | **4. FQHE** | Emergent | **Emergent** | **Match.** Topological order/fractional charge requires infinite limit/bulk. Passes (ii). Robustness passes (iii). |
  | **5. Phonons vs. CoM** | Phonons Yes, CoM No | **Mixed.** | **Wrong Reason.** Phonons pass (ii) (strict modes need infinite lattice). CoM fails (ii) (exists for $N=2$). However, the criterion doesn't capture *why* CoM isn't emergent beyond the limit clause (it's a simple sum, not a new entity). |
  | **6. Replicator Dynamics** | Not Emergent | **Emergent** | **Contradiction.** Deterministic flow requires $N \to \infty$. Passes (ii). Game structure invariance passes (iii). This is the tension with Case 3 you noted. |
  | **7. Pain** | Not Emergent | **Not Emergent** | **Match.** Finite brains feel pain. Fails (ii). |
  | **8. Hurricane** | Emergent | **Not Emergent** | **Contradiction.** A hurricane exists in finite systems. Fails (ii). Your verdict relies on downward causation/constraint, which the criterion ignores. |
  | **9. Flocking** | Not Emergent | **Not Emergent** | **Match.** Finite agents. Fails (ii). |
  | **10. Cellular Automata** | Emergent | **Not Emergent** | **Contradiction.** Finite grid, no limit. Fails (ii). Your verdict relies on computational irreducibility, which the criterion ignores. |
  | **11. Periodic Table** | Not Emergent | **Not Emergent** | **Match.** Finite atoms. Fails (ii). |
  | **12. Navier-Stokes** | Undecided | **Emergent** | **Partial Match.** Continuum limit required. Passes (ii). Invariance passes (iii). Aligns with the "Emergent" horn of your dilemma. |

  **Summary of Failures:**
  1.  **The Limit Trap:** Clause (ii) is too restrictive. It incorrectly excludes Case 8 (Hurricane) and Case 10 (CA), which you want to count as emergent, and incorrectly includes Case 2 (Irreversibility) and Case 6 (Replicator), which you want to exclude.
  2.  **The 3 vs. 6 Problem:** The criterion treats Phase Transitions (3) and Replicator Dynamics (6) identically (both are infinite-limit idealizations). It cannot distinguish them without modification.
  3.  **The 9 vs. 10 Problem:** The criterion treats Flocking (9) and Cellular Automata (10) identically (both are finite, rule-based). It cannot distinguish them without an epistemic clause.

  ---

  ### Part 2: Repairing the Criterion

  To align the criterion with your verdicts, we must abandon the strict "Limit Condition" as a necessary condition and replace it with a disjunctive set of conditions that capture *why* the limit matters in some cases (3) but not others (8, 10), and why some finite systems count (10) while others do not (9).

  #### Repair 1: Distinguishing 3 (Phase Transitions) from 6 (Replicator Dynamics)
  **Problem:** Both rely on infinite limits.
  **Diagnosis:** In Case 3, the limit *controls* the finite physics (Renormalization Group flow explains finite scaling). In Case 6, the limit *contradicts* the finite physics (Flow vs. Fixation). The limit in 6 is a "false" idealization; the limit in 3 is a "singular" explanation.
  **Clause:** **Asymptotic Control.** If a property relies on a limit, the limit must exert explanatory control over large finite systems (e.g., via scaling laws), rather than diverging from their long-term behavior.

  #### Repair 2: Distinguishing 10 (CA) from 9 (Flocking)
  **Problem:** Both are finite and rule-bound.
  **Diagnosis:** You cite "Computational Irreducibility." In 9, the macro-behavior is compressible (mean-field approximations work; the flock is *just* the sum of rules). In 10, the macro-behavior is incompressible (the only way to know the outcome is to run it).
  **Clause:** **Epistemic Autonomy.** For finite systems, the macro-description must be computationally irreducible relative to the micro-laws; there is no predictive shortcut.

  #### Repair 3: Distinguishing 8 (Hurricane) from 2 (Irreversibility)
  **Problem:** You want 8 to have "real causal influence" but 2 to be "nothing of value lost."
  **Diagnosis:** Irreversibility is a statistical trend (entropy increase). A hurricane is a *self-maintaining structure* that actively constrains its components (downward causation).
  **Clause:** **Causal/Structural Autonomy.** For finite systems not relying on irreducibility, the higher-level entity must exhibit dynamic stability that constrains lower-level trajectories (top-down constraint), distinct from mere statistical aggregation.

  #### Repair 4: Addressing 5 (Phonons vs. CoM)
  **Problem:** Why is CoM not emergent?
  **Diagnosis:** CoM is a linear sum. Phonons are collective modes that behave like particles (new ontology).
  **Clause:** **Ontological Novelty.** The emergent property must behave *as if* it belongs to a distinct ontological category (e.g., quasiparticles, constraints) not present in the base theory's vocabulary.

  ---

  ### Part 3: The Revised Criterion

  **The Autonomy-and-Control Criterion of Emergence**

  A property $E$ of a system $S$ is emergent relative to a lower-level theory $T$ if and only if:

  1.  **Supervenience:** $E$ supervenes on the ontology of $T$ (no substance dualism).
  2.  **Explanatory Autonomy:** The best explanation of $E$ is invariant under substantial changes to $T$-level details (Universality).
  3.  **Disjunctive Grounding Condition:** At least one of the following must hold:
      *   **(A) Asymptotic Control:** $E$ is strictly defined only at a limit, *and* that limit governs the behavior of large finite systems (e.g., via scaling laws), rather than contradicting them.
      *   **(B) Computational Irreducibility:** $E$ occurs in a finite system, *and* the outcome cannot be predicted from $T$-laws without simulating the system step-by-step (no analytic shortcut).
      *   **(C) Causal Constraint:** $E$ constitutes a stable structure in a finite system *and* exerts top-down constraints on the trajectories of $T$-level components that are not reducible to simple aggregation.

