      *   *Refining the Argument:* I need to make sure I distinguish between *temporal novelty* (new data) and *use novelty* (data not used in construction). The user mentioned the explanation accounts for details "I hadn't set out to explain" (winter, reservoir). This is crucial. It means not *all* historical data was used to build the theory. Some was "saved" as a test.
