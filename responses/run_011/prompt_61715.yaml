      *   *Distinction between predicted vs. fits neatly?* Yes. Prediction involves risk of failure. Accommodation can be tuned to avoid failure.
      *   *Does revising the explanation disqualify records?* It reduces their weight (risk of ad hoc adjustments), but doesn't disqualify them if the adjustments are physically motivated (alkalinity interaction) rather than arbitrary curve-fitting.
      *   *What should confidence rest on?* Primarily the bench study (novel prediction), secondarily the historical data (scope/consistency), and tertiary the mechanistic plausibility (chemistry).
