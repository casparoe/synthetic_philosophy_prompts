answer: |-
  ### 1. Brainstorming Candidate Decision Procedures

  To reverse-engineer your colleague's concept of liberty, we must look past the labels (negative, positive, republican) and identify the operational rules she applies to the facts. Based on the log, here are five candidate decision procedures. Note that Candidate 5 is constructed specifically to handle the tension between the social cases (E1–E6) and the psychological case (E7).

  1.  **The Arbitrary Power Rule (Non-Domination):**
      *   *Procedure:* Check if any other agent has the *capacity* to interfere with the option at their own discretion, without being required to track the agent's interests or follow public rules.
      *   *Condition:* If such capacity exists, the agent is unfree, regardless of whether interference actually occurs.

  2.  **The Institutional Recourse Rule (Democratic Control):**
      *   *Procedure:* Check if the constraint on the option is subject to established channels (legal, political, or administrative) through which the agent can contest, amend, or remove the constraint.
      *   *Condition:* If effective recourse exists, the agent is not unfree. If the constraint is immune to contestation, the agent is unfree.

  3.  **The Security of Status Rule (Resilience):**
      *   *Procedure:* Check whether the availability of the option depends on the continued benevolence or goodwill of another party, or whether it rests on a secure right/status.
      *   *Condition:* If the option persists only because another *chooses* not to revoke it, the agent is unfree. If it persists because another *cannot* rightfully revoke it, the agent is free.

  4.  **The Authentic Will Rule (Self-Mastery):**
      *   *Procedure:* Check whether the decision to exercise or forgo the option is determined by the agent's own rational volition or by an "alien" cause (whether external coercion or internal pathology).
      *   *Condition:* If the determination source is alien to the agent's authentic self, the agent is unfree.

  5.  **The Effective Control Rule (Hybrid):**
      *   *Procedure:* Check whether the agent possesses the effective power to regulate the constraint on the option. This includes both external power (to contest rules) and internal power (to overcome psychological barriers).
      *   *Condition:* An agent is unfree if a constraint exists that they lack the normative or psychological capacity to alter, regardless of whether the source is a person, a law, or their own mind.

