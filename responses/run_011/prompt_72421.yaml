  ### 5. The Possibility of a Split Verdict

  There is a significant risk she splits the verdict: **Free** with respect to daily choices (group home, treatment), but **Unfree** with respect to the status of guardianship.

  *   **Which is Freedom Proper?** She would likely treat the **Status (Unfree)** as the freedom proper. In E2, the tenant was unfree with respect to *staying*, even if she was free to paint the walls. The structural dependence defines the liberty status.
