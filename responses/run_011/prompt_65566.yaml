answer: |-
  An adequate answer must fix the contrast class narrowly as England versus the Yangzi Delta, identify a proximate difference-maker rather than a deep necessary condition, and distinguish the onset of growth from its acceleration while accommodating pre-divergence comparability without collapsing causal explanation into narrative sequence.

  To meet this standard, the contrast class must be fixed specifically (England vs. Yangzi) rather than broadly (Britain vs. China or Europe vs. Asia); widening the class changes the variance available for explanation, allowing macro-variables like political fragmentation to explain Europe's divergence from China but failing to explain why England diverged from Jiangnan specifically. The *explanans* must amount to a difference-maker grounded in a mechanism, not merely a necessary condition or probability-raiser; positing a necessary condition commits the answer to claiming industrialization was impossible elsewhere without it, while a difference-maker commits it to showing the outcome would not have occurred *then and there* without that specific factor. The question carries presuppositions about the inevitability and singularity of the event; an adequate answer may reformulate these, rejecting inevitability to allow for stochastic elements, but must not simply assume the divergence was predetermined. It must accommodate the revisionist finding that living standards and factor prices were comparable c. 1750, which constrains the timing of any causal variable to the late 18th century rather than earlier institutional divergences. Finally, the answer must not collapse the cause of onset versus the cause of acceleration (the spark versus the fuel), properties of a unit versus relations between units (internal culture versus colonial trade), singular events versus recurrent patterns, or causal explanation versus a well-ordered narrative (mechanism versus chronology).

  The single desideratum that does the most to knock out popular answers is the requirement to **accommodate the revisionist finding of pre-divergence comparability**. This eliminates institutional and cultural explanations (which require deep historical divergence), factor price theories (which are empirically contradicted by wage data), and political fragmentation accounts (which existed in China regionally); it leaves only proximate causes like coal or colonies, which then struggle to meet the contrast class specificity or onset timing requirements.

  The subset consisting of **accommodating the strong version of revisionist comparability** (no significant structural differences prior to 1750) and **identifying a deterministic difference-maker** is jointly unsatisfiable. If the regions were comparable on all causally relevant measures prior to the divergence, no deterministic structural difference existed to produce the variance; satisfying both requires positing either an unmeasured variable (contradicting the strength of the comparability claim) or a stochastic shock (contradicting the determinism of the difference-maker).

  A single-pair, single-variable proposal cannot survive this list because the divergence involves a conjuncture of relational and property-based factors across distinct temporal phases. Such a proposal inevitably collapses the distinction between onset and acceleration or fails to vary across the specific contrast class, reducing a complex historical transition to a monocausal caricature.
