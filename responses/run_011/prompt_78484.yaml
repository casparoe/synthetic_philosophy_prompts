  ### 5. Stability and the Money Pump

  **Does stability rule out noise?**
  No. In psychometrics, stable responses indicate a robust latent trait, but that trait need not be *transitive*. You have stably elicited a context-dependent preference structure. The stability confirms this is a structural feature of your moral cognition, not measurement error. A heavy-tailed paired-comparison model can generate this, but only if you allow the latent scale to shift based on the "frame" covariate.

  **Is the Money Pump fatal?**
  In a market, yes. If you prefer A to B, B to C, and C to A, I can trade you A$\to$B$\to$C$\to$A and charge you a fee each time until you are bankrupt.
  In a **National Health Service**, no.
  You are not a market agent. You are a rule-maker. You can hard-code the intransitivity.
  *   *Rule:* "Always save the S1 patient if present." (Prevents pump in Triage).
  *   *Rule:* "Otherwise, maximize QALYs." (Prevents pump in Planning).
  The money pump objection assumes you must maximize a single function in real-time. Bureaucracy allows you to separate the contexts. The pump is fatal to *rationality axioms*, but not to *policy stability*.

