answer: |-
  There is no single, canonical term in philosophy of science, linguistics, or argumentation theory that captures this phenomenon exactly as you have carved it.

  You have identified a specific structural vulnerability in scientific discourse that sits in the gap between **equivocation** (a logical fallacy within an argument), **motte-and-bailey** (a rhetorical strategy), and **polysemy** (a linguistic state).

  The closest existing concepts are **Boundary Objects** (from Science and Technology Studies) and **Concept Creep** (from social psychology), but neither captures the *bidirectional flow of credibility* you are describing. Boundary Objects describes how a term allows different groups to collaborate *despite* different meanings (functional view), whereas you are describing how the shared term creates epistemic confusion (critical view). Concept Creep describes the expansion of a term's reference (e.g., "trauma" expanding to include mild stress), but not necessarily the warrant-transfer between the technical and expanded senses.

  Because the existing terminology is either too agential (implying strategy) or too static (implying just "multiple meanings"), I propose a term that captures the passive, structural flow of warrant you described.

  ### Proposed Term: Semantic Conduction

  **Definition:** *Semantic Conduction* is the passive transfer of epistemic warrant between distinct senses of a polysemous term, facilitated by shared syntactic framing, occurring across a discourse network rather than within a single inference.

  It is "conduction" because, like heat moving through a metal rod, the warrant flows through the medium (the word) without the medium itself necessarily changing shape, and without requiring a pump (a strategic agent).

  ### The Carving: How to Distinguish It

  To determine if a case is *Semantic Conduction* or merely one of its neighbors, apply these five criteria.

  #### 1. The Polysemy Condition (Inclusion)
  The term must have at least two distinct senses:
  *   **Sense A (Technical):** High precision, checkable, narrow scope (e.g., codon-to-amino-acid mapping).
  *   **Sense B (Extended):** Low precision, metaphorical, broad scope (e.g., gene-to-trait mapping).
  *   *Exclusion:* If the term is merely vague (one fuzzy sense) rather than polysemous (two distinct senses), it is not conduction.

  #### 2. The Syntactic Weld (Inclusion)
  The two senses must be usable in the **identical sentence frame**.
  *   *Example:* "X codes for Y." (Works for codons; works for eye color).
  *   *Example:* "The entropy of X." (Works for gas molecules; works for social systems).
  *   *Exclusion:* If the extended sense requires a marker (e.g., "metaphorically," "in a sense"), conduction is blocked. The slippage relies on the grammar looking identical.

  #### 3. Epistemic Asymmetry (Inclusion)
  One sense must carry significantly more robust warrant than the other.
  *   Sense A is backed by hard data/math/mechanism.
  *   Sense B is backed by analogy or heuristic utility.
  *   *Exclusion:* If both senses are equally speculative or equally robust, there is no "gradient" for the warrant to flow down.

  #### 4. The Locus of Slippage (Exclusion of Equivocation)
  The slippage must occur **inter-textually** (across the citation chain/audience reception), not **intra-argumentatively**.
  *   *Equivocation:* A single speaker uses Sense A in Premise 1 and Sense B in Premise 2 to force a conclusion.
  *   *Semantic Conduction:* Speaker 1 defends Sense A. Audience 2 assumes Sense B is now defended. Speaker 3 attacks Sense B. Audience 4 assumes Sense A is now debunked.
  *   *Why this matters:* Equivocation is a logical error in a proof. Conduction is a sociological error in a field.

  #### 5. Passivity (Exclusion of Motte-and-Bailey)
  The transfer must not require strategic intent.
  *   *Motte-and-Bailey:* A speaker *retreats* to Sense A when attacked on Sense B, then *advances* back to Sense B later.
  *   *Semantic Conduction:* A speaker may be rigorously discussing only Sense A, but the *audience* imports the warrant of Sense B automatically. The speaker need not be dishonest; the structure of the language does the work.

  ### Boundary Cases and Near-Misses

  To sharpen the carving, here is how *Semantic Conduction* differs from its nearest neighbors:

  | Phenomenon | Key Difference | Example |
  | :--- | :--- | :--- |
  | **Standard Equivocation** | Happens *inside* one argument's inference chain. | "A feather is light. What is light cannot be dark. Therefore, a feather cannot be dark." |
  | **Motte-and-Bailey** | Requires *strategic retreat/advance* by an agent. | A psychologist defines "aggression" as "physical harm" when criticized, but uses "aggression" as "frowning" in their data collection. |
  | **Dead Metaphor** | No epistemic warrant transfers; the metaphor is transparent. | "The *leg* of the table." No one thinks the table has biological limbs or borrows credibility from biology. |
  | **Boundary Object** | Viewed as *functional* collaboration, not epistemic error. | "Sustainability" means different things to economists and ecologists, allowing them to sign the same treaty. (STS views this as a feature; Conduction views it as a bug). |
  | **Concept Creep** | Focuses on the *expansion* of the term's reference, not the warrant transfer. | "Trauma" expanding to include non-life-threatening events. (Creep describes the bloat; Conduction describes why the bloated term still feels scientific). |
  | **Reification** | Focuses on *ontology* (treating abstract as concrete). | Treating "intelligence" as a physical fluid in the brain. (Conduction can happen without reification; you can think genes "code" for traits without thinking the code is a physical object, but still borrow credibility from the codon table). |

  ### Why This Matters (The "Should It Have a Word?" Question)

  You asked whether it *should* have a word. Yes, because the lack of a label allows the phenomenon to persist as "noise" rather than "signal."

  Currently, when a geneticist complains that "genes don't code for behavior," they are often accused of denying molecular biology. When a skeptic says "genetic information is a metaphor," they are accused of denying biochemistry. Both sides are talking past each other because they lack a term for the **weld** that connects their claims.

  Labeling this **Semantic Conduction** allows you to say:
  > "You are committing Semantic Conduction. You are attacking the Extended Sense (traits), but your citation implies you have debunked the Technical Sense (codons). The warrant leaked across the syntax."

  This moves the debate from "Is DNA a code?" (ontological) to "How is the word 'code' functioning in this discourse?" (structural).

  ### Summary Recommendation

  If you need to cite an existing framework, the closest fit is **Diachronic Equivocation** within a **Discourse Network**, but that is clunky and implies a fallacy where there may only be confusion.

  If you are writing this up, I recommend proposing **Semantic Conduction**. It captures the physics of your description ("warrant leaks," "welded," "flows") and distinguishes the *passive structural mechanism* from the *active rhetorical strategies* (Motte-and-Bailey) or *logical errors* (Equivocation) that currently crowd the space.

  **The tight definition for your use:**
  > **Semantic Conduction:** A discursive phenomenon wherein epistemic warrant flows bidirectionally between a technical sense and an extended sense of a polysemous term, driven by shared syntactic framing and occurring across the reception of arguments rather than within their logical structure.
