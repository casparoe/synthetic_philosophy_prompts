answer: |-
  You have spent forty years operationalizing a specific moral arithmetic: that risks sum, that collective dose matters, and that a statistical death is a unit of cost like any other. Your frustration with the philosophical treatments is warranted. Most philosophers treat the "Torture vs. Specks" case (a variant of Parfit's Spectrum Argument) as a puzzle to be solved by preserving intuition. You treat it as a specification for a regulatory engine.

  Here is the breakdown of requirements, the impossibility results, and the evaluation of the standard moves, tailored to your constraints.

  ### 1. The Requirements Specification

  I have sorted your list into three categories: **System Integrity** (logical/functional necessities), **Regulatory Utility** (what you need to do the job), and **Moral Prejudices** (intuitions that often conflict with the first two).

  | Requirement | Category | Verdict | Reasoning |
  | :--- | :--- | :--- | :--- |
  | **Finite quantities only** | System Integrity | **Non-Negotiable** | Infinities break the arithmetic of regulation. You cannot optimize against infinity. |
  | **Grouping Invariance** | System Integrity | **Non-Negotiable** | If the answer changes based on how you bucket the population, the system is gerrymanderable. |
  | **Usable (Quantifiable)** | Regulatory Utility | **Non-Negotiable** | For your purpose, a theory that yields "it depends" or "incomparable" is a failure. You need a number to compare to a cost. |
  | **Transitivity** | System Integrity | **High Cost** | If $A > B$ and $B > C$, then $A > C$. Without this, you cannot rank policy options. Dropping it breaks rational choice theory. |
  | **Risk = Outcome** | Regulatory Utility | **Negotiable** | Health physics treats expected value as the currency. Pure moral theories often distinguish risk from harm. You need them treated alike for ALARA. |
  | **Intra- = Inter-personal** | Moral Prejudice | **Negotiable** | Most people accept aggregation within one life (lifetime of specks) but resist it across lives. A working theory must pick one logic and apply it to both, or explicitly justify the split. |
  | **No Magic Numbers** | Moral Prejudice | **High Cost** | You want continuity. But to save the "Torture is worse" intuition, you usually *need* a threshold. You likely have to sacrifice this or the intuition. |
  | **Get Torture Case Right** | Moral Prejudice | **Drop** | This is the source of the contradiction. The theory must determine the answer, not be designed to match a pre-existing gut check. |
  | **Explain the Gut** | Moral Prejudice | **Drop** | Nice to have, but not a functional requirement. Evolutionary psychology explains the gut; regulation corrects it. |
  | **Identifiable Asymmetry** | Moral Prejudice | **Drop** | This is a known cognitive bias (the "identifiable victim effect"). A robust theory should explain why it *exists*, not encode it as a rule. |

  **The Single Requirement That Knocks Out the Most Candidates:**
  **Usable (Quantifiable).**
  This eliminates Vagueness, Imprecise Comparability, and most forms of Lexical Priority that rely on qualitative thresholds. If you cannot put a number on the "speck" side to compare against the "torture" side, you cannot regulate. This requirement forces you toward Utilitarian Aggregation or a very rigid Threshold model.

  ### 2. The Variant Cases

  Here is how a robust aggregation theory must handle your knobs, assuming the goal is regulatory consistency.

  *   **The Traceless Speck:** If there is no phenomenological trace, no memory, and no physiological change, a welfarist theory must say **zero harm**. If your theory says this is a harm, you are measuring rights violations or "purity," not welfare. For regulation, if it's traceless, it's zero. If you regulate it, you are regulating principle, not outcome.
  *   **Non-Overlapping Specks:** Aggregation should **not** require contemporaries. If you accept collective dose over 50 years for radiation, you accept it over centuries. Time discounting is an economic tool, not a moral eraser. If the theory stops aggregating because the people are dead, it breaks the "finite quantities" requirement by arbitrarily slicing time.
  *   **Fixed Total, Growing Headcount:** This is the killer. If Total Harm = Constant, but $N \to \infty$ and $h \to 0$, a summing theory says **value is constant**. An intuition-based theory says value drops. If the theory gives different verdicts at the ends, it **must** have a cutoff (Magic Number). You cannot have continuity *and* a change in verdict here.
  *   **One Person Forever:** Intra-personal aggregation is generally accepted as coherent. A lifetime of specks *is* a burden. If the theory says "Torture > One Person Forever Specks" but "One Person Forever Specks > 1 Million People Specks," you have broken Transitivity. The theory must treat the "One Person Forever" as equivalent to the "Million People Once" if the total experience is identical.
  *   **Consented Specks:** Consent changes the **wrong**, not necessarily the **harm**. A speck in the eye hurts the same. However, for regulation, consent moves the liability. A theory must distinguish between *badness of outcome* (welfare) and *wrongness of act* (rights). If you are regulating public safety, consent is often irrelevant (you can't consent to public radiation exposure).

  ### 3. The Distinctions You Cannot Collapse

  You asked which distinctions a theory is *not allowed* to collapse. If a theory fuses these, it breaks the specific utility you need.

  1.  **Risk vs. Outcome:**
      *   *Why:* In health physics, you regulate the *probability* (ALARA), not just the realized cancer.
      *   *Breakage:* If a theory treats a 10% chance of death as morally null until the death occurs, you cannot justify preventative regulation. You lose the ability to act on expectation.
  2.  **Aggregation Across Persons vs. Inside a Single Life:**
      *   *Why:* This is the "Separateness of Persons" objection.
      *   *Breakage:* If you collapse them (treat society as one super-person), you justify sacrificing one for the many without remainder. If you keep them distinct, you struggle to justify *any* aggregation. For regulation, you must act *as if* they are collapsed (collective dose), but acknowledge the moral cost.
  3.  **"Worse Than" vs. "Not Better Than":**
      *   *Why:* This is the difference between strict preference and indifference/incomparability.
      *   *Breakage:* If you collapse these, you force a ranking where none exists. This leads to arbitrary decision-making. You need a category for "these are sufficiently different that comparison is invalid" (though this hurts Usability).
  4.  **Identifiable vs. Statistical:**
      *   *Why:* You know this one best.
      *   *Breakage:* If a theory collapses them, it becomes coldly utilitarian (which you can live with). If it keeps them distinct as a *moral rule*, it becomes irrational policy (spending millions to save one trapped miner while ignoring highway safety). A working theory must treat them as **epistemically** different but **ontologically** identical.

  ### 4. The Impossibility Result

  Your suspicion is correct. There is a formal trap here.

  **The Impossible Trinity:**
  1.  **Transitivity:** If A is better than B, and B is better than C, A is better than C.
  2.  **Continuity (No Magic Numbers):** Small changes in harm/number do not produce sudden flips in moral value.
  3.  **Anti-Aggregation Intuition:** Torture is worse than any number of specks (there is some number $N$ where $N \times \text{Specks} < \text{Torture}$ is false).

  **You cannot hold all three.**
  *   If you sum the specks (to satisfy Continuity and Transitivity), eventually the sum exceeds the torture. You lose the Anti-Aggregation Intuition.
  *   If you keep the Intuition (Torture is always worse) and keep Transitivity, you must introduce a **Threshold** (Magic Number) where specks suddenly stop counting or suddenly become torture. You lose Continuity.
  *   If you keep the Intuition and Continuity, you must allow **Intransitivity** (A > B, B > C, ... Z > A). You lose Rational Choice.

  **What to Drop:**
  For your purpose (regulation), you must drop **Anti-Aggregation Intuition**.
  Why? Because dropping Transitivity makes decision-making impossible (cycles). Dropping Continuity (accepting Magic Numbers) is actually **feasible** in regulation (we do it all the time: exemption levels, trivial risk definitions).

  **The Recommendation:**
  Accept that there is a **Regulatory Threshold**. Below a certain dose/harm per person, the contribution to collective moral weight is zero. This violates "pure" summation, but it satisfies Usability and avoids the Torture conclusion. It admits a "Magic Number," but you already use them (e.g., 1 mSv/year public limit).

  ### 5. Evaluation of the Four Moves

  Here is how the standard philosophical escapes hold up against your **Usable/Non-Negotiable** requirements.

  | Move | Verdict for Health Physics | Why |
  | :--- | :--- | :--- |
  | **Lexical Priority / Threshold** | **Adoptable** | This is what regulation actually is. "Trivial risk" exemptions. It violates "No Magic Numbers" but saves Usability and avoids the Torture conclusion. |
  | **Give Up Transitivity** | **Reject** | Makes cost-benefit analysis impossible. You cannot optimize a system where preferences cycle. |
  | **Vagueness / Imprecise Comparability** | **Reject** | "These options are incomparable" is a valid philosophical stance but a regulatory failure. You must choose. |
  | ** Bite the Bullet (Summing)** | **Consistent** | Mathematically sound and Usable. Requires you to accept that enough specks *do* outweigh torture. Compatible with your career, violates your retirement intuition. |

  **Final Word:**
  You are stuck because you are trying to find a moral theory that validates the *method* you used for 40 years (summing) while validating the *intuition* you developed as a human being (torture is special). They are incompatible.

  For your purpose, the only adequate theory is **Threshold Utilitarianism**. It sums everything above a de minimis level and ignores everything below it. It admits the "Magic Number" you disliked in your list, but it is the only way to keep the arithmetic finite, usable, and transitive without condemning a man to torture for the sake of a billion dust specks. You already work this way; you just need the philosophy to admit it's a feature, not a bug.
