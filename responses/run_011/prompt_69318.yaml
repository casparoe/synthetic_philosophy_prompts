answer: |-
  ### 1. Criteria of Mechanism-Identity

  **First Regime (Legacy Pricing Engine): Extensional Equivalence over a Fixed Corpus.**
  This regime presupposes that the mechanism *is* its input–output mapping over the set of historically observed transactions. The constitutive element is the **behavioral trace**. The internal causal structure (algorithms, data structures) is treated as accidental, irrelevant, or perhaps epistemically inaccessible ("no one fully understands"). The intentions of the authors are explicitly subordinated to the historical record; if the original authors intended $X$ but the machine produced $Y$, $Y$ is the system. Identity is strictly binary and determined by byte-for-byte coincidence on the archive.

  **Second Regime (ML Risk Models): Provenance-Constrained Statistical Equivalence.**
  This regime presupposes that the mechanism *is* the specific trained artifact (weights + architecture) coupled with a statistical performance contract. The constitutive element is the **generative lineage** (the specific training run and resulting parameters). Unlike the first regime, this view disregards individual prediction identity (extensionalism) in favor of distributional identity (statistical metrics). However, unlike the first regime, it treats internal state (weights) as essential: a new training run creates a numerically distinct artifact, and thus a distinct system, even if the extensional output is statistically indistinguishable. It distinguishes between the *logic* (weights, which define identity) and the *physics* (kernels/precision, which do not).

  **What each disregards:**
  *   Regime 1 disregards **provenance and internal state**. It does not care *how* the output was generated, only *that* it matches.
  *   Regime 2 disregards **deterministic output identity**. It does not care if specific predictions flip, provided the aggregate risk profile holds. It also disregards **implementation physics** (inference stack) provided the logical parameters remain constant.

  ### 2. A Single Underlying Criterion

  There is no single *metaphysical* criterion (one is extensional, the other intensional/provenance-based), but there is a single **regulative principle** that renders both coherent: **Invariance of the Certified Object.**

  Both regimes operate under the rule: *Two systems are identical if and only if they instantiate the same object that was originally subjected to validation.* The divergence arises solely from what each regime identifies as the "Certified Object."

  *   **In Regime 1,** the Certified Object is the **Transaction Ledger**. Because the internal logic is untrusted/unknown, the only validated artifact is the historical record of outputs.
      *   *Prediction (Rewrite):* The ledger is preserved. Verdict: **Same System.**
      *   *Prediction (Improvement):* The ledger is altered (even if corrected). The Certified Object is violated. Verdict: **Different System (Revert).**
  *   **In Regime 2,** the Certified Object is the **Parameter Snapshot**. Because the model is probabilistic, the ledger (individual predictions) is not the artifact; the weights are.
      *   *Prediction (Compression):* The weights are preserved; only the execution physics change. The Certified Object is intact. Verdict: **Same System.**
      *   *Prediction (Retraining):* The weights are new. The Certified Object is replaced. Verdict: **Different System.**

  This principle predicts all verdicts precisely. The "revert-the-improvement" case occurs because the improvement alters the Certified Object (the Ledger). The "tolerance-band" case occurs because the Certified Object (the Model) includes a statistical tolerance specification as part of its definition, whereas the Ledger does not.

  ### 3. Presuppositions vs. Comfortable Fits

  **Regime 1: Extensionalism vs. Epistemic Hedge.**
  Strictly presupposed: That the *liability* of the system is tied to the specific historical outputs.
  Comfortable fit (but not required): That the system *is ontologically* nothing more than its I/O map.
  *Defense:* One can defend Regime 1 without adopting extensionalism. It can be viewed as a **conservative proxy under uncertainty**. If we admit we do not understand the causal structure, we cannot certify a new structure. Therefore, we treat the I/O map as the *surrogate* for the structure. We are not claiming the system *is* the map; we are claiming the map is the only *verifiable invariant* available to us.

  **Regime 2: Degrees vs. Grain of Description.**
  Strictly presupposed: That risk is a property of distributions, not individual events.
  Comfortable fit (but not required): That identity is a matter of degree (fuzzy identity).
  *Defense:* The tolerance bands do not commit us to fuzzy metaphysics. They commit us only to a **chosen grain of description**. We can maintain that identity is binary (Same/Different), but our *measurement apparatus* has finite resolution. The "tolerance band" defines the resolution limit. Two models are either identical or not; if their metric difference is below $\epsilon$, they are *indistinguishable* relative to the certification grain, which pragmatically functions as identity.

  ### 4. Philosophical Underdetermination and Deflationism

  **Underdetermination:**
  The practice is underdetermined regarding **Realism vs. Conventionalism**.
  *   *Realist Account:* There is a fact of the matter about whether the new engine is the "same" as the old one, and our rules attempt to track it.
  *   *Conventionalist Account:* "Sameness" is a label we apply to manage regulatory and financial boundaries.
  Both accounts license the rules. A Realist could argue the Ledger *is* the essence of a pricing engine. A Conventionalist could argue we simply define "same" as "doesn't trigger a lawsuit."

  **Deflationary Possibility:**
  It is highly probable that neither regime presupposes a metaphysics. The phrase "same system" is doing **liability allocation work**.
  *   **Work the phrase does:** It determines the **Burden of Proof** and the **Scope of Warranty**.
      *   If System B is "the same" as System A, the existing warranty/validation covers B.
      *   If System B is "different," a new warranty/validation is required, and liability for novel failures shifts to the change-approvers.
  *   **Why the regimes differ:**
      *   **Regime 1 (Pricing):** Liability is **transactional**. A single cent error on a single past transaction implies a breach of contract for that specific trade. Therefore, the "Same System" label is withheld if *any* transaction changes.
      *   **Regime 2 (Risk):** Liability is **systemic**. A single flipped prediction is noise; a shift in the loss distribution is risk. Furthermore, regulatory frameworks (e.g., SR 11-7) tie validation to *model development lineage*. Therefore, the "Same System" label is withheld if the *lineage* changes (retraining), even if the risk profile holds, because the regulatory warranty is tied to the development process, not just the outcome.

  ### 5. Counterfactual: Identity as Internal Causal Structure

  If we adopted the view that **Identity = Shared Internal Causal Structure** (Intensionalism), ignoring outputs except as evidence:

  **Testing Apparatus:**
  *   **Regime 1:** Black-box I/O testing would be insufficient. We would require **white-box equivalence checking** (e.g., formal verification, symbolic execution) to prove the new code implements the same logical graph as the old. Since the legacy engine is "not fully understood," this would likely make rewriting impossible. We would be forced to maintain the legacy binary indefinitely.
  *   **Regime 2:** We would focus less on metric bands and more on **architecture and parameter topology**. We would need to verify that the compression did not alter the computational graph's causal dependencies, only their physical realization.

  **Change-Management Triggers:**
  *   **Regime 1:** Any change to the control flow or logic gates would trigger recertification, even if the output remained identical. (Currently, such changes are allowed if output matches).
  *   **Regime 2:** Changes to the inference stack that alter numerical precision *might* trigger recertification if they alter the causal chain of the tensor operations, even if metrics hold.

  **Treatment of the "Improvement" (The Bug Fix):**
  *   **Current Verdict:** Revert (because Output changed).
  *   **New Verdict:** **Accept (potentially).**
  *   **Reasoning:** If identity is defined by the *intended* causal structure (the specification/logic) rather than the *actual* historical behavior, the legacy engine was a **corrupted token** of the system type. The "bug" was a deviation from the true causal structure. The rewrite that fixes the bug aligns the implementation with the *true* internal structure.
  *   **Consequence:** The "improvement" would no longer be recorded as "changing the system." Instead, the legacy behavior would be reclassified as "system error." The rewrite would be certified as the **first valid instantiation** of the true system, rendering the historical archive not as a definition of the system, but as a log of the system's previous failures. This shifts liability: past transactions based on the "wrong" output might become contestable.
