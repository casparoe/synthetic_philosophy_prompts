answer: |-
  ### 1. Ordered Set of Questions

  **Q1. Does the patient currently possess decision-specific capacity?**
  *   **Who is asked:** The treating physician (surgeon or intensivist).
  *   **Sufficient answer:** "Yes, the patient understands the risks/benefits/alternatives and can communicate a choice," OR "No, due to [specific impairment]."
  *   **Licenses next:** If **Yes**, proceed to Q2. If **No**, skip to Q4.

  **Q2. Has the patient expressed a preference for *how* decisions are made (alone or with others)?**
  *   **Who is asked:** Social Worker/Chaplain (reviewing chart + speaking to patient if possible).
  *   **Sufficient answer:** Documented advance directive, prior recorded statement, or current verbal instruction specifying who should be involved or who should decide.
  *   **Licenses next:** If a clear preference exists, that preference determines the decision-maker. Proceed to **Recommendation**. If unclear or silent, proceed to Q3.

  **Q3. (If capacitated but silent on process) Does the patient consent to family involvement now?**
  *   **Who is asked:** The patient (privately, without kin present).
  *   **Sufficient answer:** "Yes, I want them here/to decide" OR "No, I want to decide alone."
  *   **Licenses next:** Proceed to **Recommendation**. (Note: A capacitated patient's current refusal of kin overrides prior cultural generalities).

  **Q4. (If incapacitated) Who is the default surrogate by law or prior designation?**
  *   **Who is asked:** Social Worker / Legal Policy.
  *   **Sufficient answer:** Name of legal next-of-kin or designated healthcare proxy.
  *   **Licenses next:** Proceed to Q5.

  **Q5. Is there evidence that the default surrogate is acting against the patient's known values or under undue influence?**
  *   **Who is asked:** Committee consensus (based on nursing/social work observation).
  *   **Sufficient answer:** "No evidence of coercion" OR "Specific evidence of coercion/conflict of interest."
  *   **Licenses next:** If **No**, the surrogate decides. If **Yes**, proceed to **Stop Rule B**.

  ---

  ### 2. Stop Rules

  **Stop Rule A (Legal Ambiguity on Fetal/Patient Conflict):**
  *   **Condition:** The decision involves refusal of life-sustaining treatment for a pregnant patient where fetal viability is possible, and the surrogate/patient refusal contradicts medical recommendation.
  *   **Action:** Return **No Recommendation**. Escalate immediately to **Hospital Legal Office**.
  *   **Reason:** This procedure determines *authority*, not the legality of refusing treatment that affects a third party (the fetus).

  **Stop Rule B (Suspected Coercion/Abuse):**
  *   **Condition:** The committee identifies specific evidence that the proposed decision-maker (family or delegate) is coercing the patient or stands to gain materially from a harmful decision.
  *   **Action:** Return **No Recommendation**. Escalate to **Hospital Security/Social Services Protection Unit**.
  *   **Reason:** Relational authority cannot validate abuse.

  **Stop Rule C (No Capacity, No Kin, No Prior Instructions):**
  *   **Condition:** Patient lacks capacity, has no known kin, and no prior record of values.
  *   **Action:** Return **Recommendation: Treating Team acts in Best Interest**.
  *   **Reason:** Absence of relational network does not suspend the right to treatment; it defaults to fiduciary duty of the physician.

  ---

  ### 3. Judgment Calls Dressed as Procedure

  **1. Assessing "Undue Influence" (Q5)**
  *   **The Call:** Distinguishing between cultural deference (respecting hierarchy) and coercion (fear of harm).
  *   **Validation:** A judgment is better if it relies on **private interviews**. If the patient (or surrogate) gives different answers when kin are present vs. absent, the "kin-present" answer is discounted. The nurse who spends the most time at the bedside has the weighted vote here.

  **2. Assessing "Fluctuating Capacity" (Case 1)**
  *   **The Call:** Determining if a "lucid interval" is sufficient for a specific decision.
  *   **Validation:** A judgment is better if it ties capacity to the **complexity of the decision**. Disclosure of a diagnosis requires lower cognitive threshold than consent for surgery. If the patient can repeat back the diagnosis, they have capacity for disclosure.

  **3. Interpreting "Relational Preference" (Q2)**
  *   **The Call:** Deciding if a past statement ("elders decide") applies to the current crisis.
  *   **Validation:** A judgment is better if it prioritizes **specificity over generality**. A specific note ("elders decide on cancer news") overrides a general cultural assumption. A current verbal request overrides a past note.

  ---

  ### 4. Relational Literature: Preserved vs. Dropped Distinctions

  **Preserved:** *Relational Constitution.* We preserve the insight that patients often *want* decisions made communally. The procedure actively asks for this preference (Q2/Q3) rather than assuming individualism.
  *   **Cost:** None. This aligns with patient-centered care.

  **Dropped:** *Personhood as Attainment.* We explicitly reject the notion that personhood (and thus rights) depends on the "thickness" of one's social network.
  *   **Cost:** We lose the ability to morally shame isolated individuals into reconciliation (e.g., Case 2). The procedure treats the estranged patient as fully entitled to isolation if that is their will.

  **Dropped:** *Harmony as Truth.* We reject the idea that family consensus validates the ethics of a decision.
  *   **Cost:** We accept that a "correct" ethical recommendation may leave the family angry or divided. The chart note will record dissent as a fact, not a failure.

  ---

  ### 5. Worked Cases

  **Case 1 (Terminal Diagnosis, Fluctuating Capacity)**
  *   **Application:** Q1 (Yes, lucid now for disclosure) → Q2 (Prior note exists) → Q3 (Patient asks directly now).
  *   **Reasoning:** Capacity is decision-specific. While the patient previously expressed a cultural preference for family-mediated disclosure, his current capacitated direct question asserts a right to know. *Ubuntu* (relationality) informs the *manner*, not the *fact*, of disclosure.
  *   **Recommendation:** The patient holds decisional authority. Disclose the diagnosis to the patient immediately. Offer the patient the option to have his daughters present during the disclosure; if he agrees, include them. If he refuses, exclude them. The prior note regarding elders is superseded by current capacitated request.

  **Case 2 (Estranged Patient, Brother Present)**
  *   **Application:** Q1 (Yes, capacitated) → Q2 (Written refusal of contact) → Q3 (Confirm current wish).
  *   **Reasoning:** The Chaplain's view that estrangement is an injury to be repaired is a theological claim, not an ethical mandate. To force contact is to violate the patient's relational autonomy. Personhood is not forfeited by isolation.
  *   **Recommendation:** The patient holds decisional authority. Do not admit the brother. Do not inform the brother. Proceed with surgery based on patient's consent. The committee notes the brother's presence but validates the patient's written and verbal exclusion of kin.

  **Case 3 (Pregnant Patient, Delegating to Mother-in-Law)**
  *   **Application:** Q1 (Yes, capacitated) → Q2 (Explicit delegation to MIL) → Q3 (Confirm current wish).
  *   **Reasoning:** A capacitated patient may choose to exercise autonomy *through* a delegate. This is a relational exercise of will. The committee cannot invalidate a valid delegation simply because the outcome (refusal of C-section) is medically undesirable. Fetal interests are **outside the scope** of this authority-determination procedure; that is a legal question (Stop Rule A), but regarding *who speaks for the woman*, the delegate stands in her shoes.
  *   **Recommendation:** The Mother-in-Law holds decisional authority as the patient's valid delegate. The treating team must regard her refusal as the patient's refusal. **Escalation:** Because this involves refusal of life-saving obstetric intervention with a viable fetus, trigger **Stop Rule A**. Notify Legal Office immediately. The Ethics Committee affirms the MIL's authority, but Legal must review the refusal's enforceability.

  ---

  ### 6. Failure-Mode Section

  **Direction of Error:** The procedure will most likely fail by **over-validating delegation** in cases of subtle coercion (Case 3 variant). A patient may claim they "want" the elder to decide because they are afraid to contradict them.
  **Detection (Chart Audit):** Auditors should look for cases where the "Decision-Maker" is not the patient and not the legal next-of-kin, but a community delegate. Cross-reference these with cases where the decision resulted in significant harm or mortality.
  **Mitigation:** If the audit shows high mortality in the "Delegated Authority" group, the procedure must be amended to require a **private, unaccompanied interview** with the patient for *all* delegations, not just those where coercion is suspected.

  **Secondary Error:** **Bureaucratic Individualism.** Staff may use Q3 to isolate vulnerable patients who *want* family support but are too shy to ask.
  **Detection:** Patient satisfaction surveys regarding "family involvement."
  **Mitigation:** Train staff to phrase Q3 as "Who would you like to help you?" rather than "Do you want them here?"

  ---

  ### 7. Ten-Line Version (Night Charge Nurse)

  1.  **Check Capacity:** Can the patient understand and tell you their choice right now?
  2.  **If Yes:** Ask the patient: "Do you want to decide alone, or do you want a specific person to decide for/with you?"
  3.  **If Patient Names Someone:** That person decides. Write it in the chart.
  4.  **If Patient Wants Alone:** Exclude family, even if they are angry.
  5.  **If No Capacity:** Look for a legal next-of-kin or written proxy.
  6.  **If No Kin/Proxy:** Treating doctor decides in Best Interest.
  7.  **Red Flag:** If the chosen decision-maker refuses life-saving care and the patient is pregnant, call Legal.
  8.  **Red Flag:** If you suspect the family is scaring the patient, call Ethics.
  9.  **Chart Note:** "Ethics Consult: Authority assigned to [Name] based on [Patient Capacity/Delegation/Law]."
  10. **Remember:** A patient's current wish overrides old family customs.
