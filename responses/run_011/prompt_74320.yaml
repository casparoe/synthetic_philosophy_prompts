answer: |-
  Here is an analysis of your principles, a proposal for a repaired account, and the application of that account to your new cases and your own.

  ### I. Diagnosing the Principles

  **Your Principle (The "Alive Test"):** *A dramatization wrongs a real person only if it would have wronged that person had they been alive to watch it.*
  *   **Strengths:** It elegantly handles the **Weeping Statesman** (Case 1) versus the **Joking Statesman** (Case 2). Most people would not mind a private tear being shown; most would mind being shown laughing at a tragedy they historically mourned. It respects the subject's likely autonomy.
  *   **Weaknesses:** It collapses on the **Clerk** (Case 4). You explicitly state the Clerk is the *worse* case because no one is left to answer for him. Your principle relies on the subject's capacity to feel wronged; it cannot account for the *epistemic vulnerability* of the dead who cannot speak back. It also struggles with the **Flattering Falsehood** (Case 5). Would a statesman truly be "wronged" by being portrayed as more principled? Only if we assume they value Truth over Praise. Your verdict assumes they do, but the principle doesn't enforce it.

  **Your Friend's Principle (Reversibility):** *What matters is whether an invention is reversible.*
  *   **Strengths:** It explains the **Clerk** versus the **Statesman** perfectly. The Statesman has biographers to correct the record; the Clerk does not. It also explains why the **Flattering Falsehood** is dangerous (legends stick).
  *   **Weaknesses:** It fails the **Weeping Statesman** (Case 1). If the film is a hit, that image of weeping may become the only image anyone has. By your friend's logic, this should be impermissible, but you find it acceptable. It also contradicts your intuition on **Marketing** (Case 8). You feel a film marketed as fiction is *less* culpable than a novel with a disclaimer; Reversibility suggests the false belief enters the world equally in both, so the culpability should be the same.

  ### II. The Repaired Principle: Moral Fidelity and Epistemic Vulnerability

  To save your verdicts without contradiction, you must abandon the idea that "harm to the subject" is the only metric. You are actually operating on a duty to the **Historical Record** and the **Audience**, scaled by the **Subject's Vulnerability**.

  **The Principle of Moral Fidelity:**
  1.  **Interiority is Free:** Inventing private emotional states or habits (weeping, humming) is permissible, provided it does not contradict the known moral character of the subject.
  2.  **Moral Character is Protected:** Inventing actions that invert the subject's documented moral stance (resistance vs. collaboration, virtue vs. vice) is impermissible, whether the invention is flattering or damning.
  3.  **The Vulnerability Multiplier:** The thinner the historical record, the stricter the prohibition on negative invention. To make a villain of an obscure person is to destroy their only existence.
  4.  **The Survivor Veto:** If living descendants object to a portrayal based on ambiguous evidence, the dramatist must defer. The harm to the living outweighs the artistic fill for the dead.

  **What You Must Surrender:**
  To hold this principle, you must surrender two intuitions from your list:
  1.  **The Marketing Intuition (Case 8):** You must accept that a film marketed as fiction is *not* less culpable than a novel with a note if both produce the same false belief. Genre signaling does not absolve moral inversion.
  2.  **The "Alive" Limitation:** You must admit that you can wrong a person who is dead, not because they feel it, but because they cannot correct you. The wrong is to their *memory*, not their *feelings*.

  **Is a Simpler Principle Better?**
  A simpler principle would be: *"Do not contradict the known record."*
  *   **Cost:** This forces you to surrender the **Weeping Statesman** (Case 1) and the **Landlady** (Case 3). There is no record of the weeping; there is no record of the humming. If you cannot contradict the record, you cannot fill its gaps. Drama dies.
  *   **Verdict:** Do not adopt the simpler principle. The "Interiority is Free" clause is essential for narrative. The cost of keeping it is the complexity of defining "Moral Character."

  ### III. Application to New Situations

  Here is how the **Principle of Moral Fidelity and Epistemic Vulnerability** rules on your three new cases:

  **1. The Soldier's Last Words**
  *   *Case:* A film puts a real soldier's accurately recorded last words into the mouth of a wholly invented character.
  *   *Analysis:* This violates **Moral Fidelity**. You are stripping the real subject of their agency and moral climax to give it to a fiction. Even if the words are true, the *attribution* is a moral inversion. It suggests the invented character possessed the soldier's courage.
  *   *Verdict:* **Impermissible.** The record belongs to the speaker.

  **2. The Documentary Humiliation**
  *   *Case:* Documentary about a man dead 8 years; reconstructs humiliation from one classmate's memory; widow objects.
  *   *Analysis:* This violates two clauses. First, **Documentary Contract**: A documentary claims truth, not dramatic probability. One fallible memory is insufficient evidence for a factual claim. Second, **The Survivor Veto**: The widow is alive and objects. The harm to her (and the man's reputation) outweighs the narrative value.
  *   *Verdict:* **Impermissible.** (If this were a drama, it might be permissible with a disclaimer; as a documentary, it is a lie).

  **3. The Video Game Monarch**
  *   *Case:* Player, as a real monarch, orders an atrocity that never occurred. Audience won't read history.
  *   *Analysis:* This is the **Clerk Case** scaled up. The record is thin for the audience (they won't check). The invention is negative (atrocity). The medium is interactive, meaning the player *chooses* the evil, but the game posits the monarch *could* do it.
  *   *Verdict:* **Impermissible,** unless the game is explicitly framed as *Alternate History*. If the game presents itself as "Historical," allowing the player to commit an unhistorical atrocity violates **Moral Fidelity**. It invites the audience to inhabit a moral stance the real person rejected or never held.

  ### IV. Your Case: The Nurse Play

  **The Facts:**
  *   **Subject:** Nurse attested in three letters.
  *   **Record:** Ambiguous (does not say she stayed or went).
  *   **Invention:** She stays at her post (Heroic/Virtuous).
  *   **Constraint:** Daughter (90) objects to the play being written at all.

  **The Analysis:**
  1.  **Interiority vs. Action:** You are not just giving her an interior life (Humming/Landlady); you are assigning her a specific moral action (Staying vs. Fleeing). This moves from *Interiority is Free* to *Moral Character is Protected*.
  2.  **Flattery:** You are inventing a virtue (Case 5). You ruled that flattering falsehoods wrong the subject and the audience. Making her a hero when the record is silent creates a false moral exemplar.
  3.  **Vulnerability:** The record is thin (three letters). She is vulnerable to being defined by your invention.
  4.  **Survivor Veto:** This is the decisive clause. Your principle must account for the harm to the living. The daughter is alive. She has expressed a wish.

  **The Verdict:**
  **Your account forbids the play.**

  **Why:**
  Even if the ambiguity of the letters allows you to *imagine* she stayed, the **Survivor Veto** overrides the **Interiority** clause. When a living descendant objects to a portrayal of a recently deceased relative based on thin evidence, the obligation to the living supersedes the artistic license to fill the gaps of the dead.

  Furthermore, by making her stay, you are committing the **Flattering Falsehood** error (Case 5). You are raising her morally without evidence. You noted that this "wrongs the audience" by giving them a false lesson.

  **The Permissible Change:**
  You may write the play if you change the **Nature of the Claim**.
  *   **Option A:** Make the character fictional *inspired* by the nurse. Change the name. State in the program notes: "Inspired by the letters of [Name], though specific actions are imagined." This honors the record's ambiguity.
  *   **Option B:** Keep the name, but dramatize the *ambiguity*. Show the moment of decision as unknowable. Have the character struggle with the choice without the audience seeing the final result, or have the text explicitly acknowledge the silence of the letters.
  *   **Option C:** Respect the daughter. Do not write the play.

  **Recommendation:**
  If the core of the play is her heroism in staying, you cannot write it. That heroism is the invention that violates the record and the family. If the core of the play is the *uncertainty* of duty in war, you may write it, but you must change her name to protect the daughter's peace and the nurse's memory from being fixed as something she may not have been.

  **Final Word:**
  Your instinct to write down the verdicts was correct because your intuition is more consistent than your theory. You are not protecting the dead from feeling pain; you are protecting the *truth* from being displaced by power (the filmmaker's) and the *vulnerable* from being erased by invention. Stick to **Moral Fidelity**, accept that you owe a duty to the memory of the clerk as much as the statesman, and let the living veto the ambiguous.
