answer: |-
  Your hypothesis is sharp, and your intuition about the graft/chimera cases is the lever that actually pries this debate open. You are correct that the stalemate is not empirical, nor is it merely verbal. It is **ontological**, specifically regarding what kind of *process* we are trying to name.

  Here is the diagnosis, structured around your three jobs, your excluded cases, and the claim of equivalence.

  ### 1. The Diagnosis: Conflating Selection with Evolution

  You identified that "unit" is doing three jobs: copying (replicator), interacting (interactor), and benefiting (beneficiary). The stalemate persists because the two camps are answering different questions while using the same label.

  *   **The Gene-Camp (Williams/Dawkins)** is answering a **historical** question: *What entity allows complex design to accumulate over deep time?* Their answer requires high-fidelity replication. On this view, "Unit of Selection" is shorthand for "Unit of Evolution." If it doesn't replicate with fidelity, it cannot be the locus of adaptation, because adaptation is defined as accumulated design.
  *   **The MLS-Camp (Sober/Wilson)** is answering a **causal** question: *What entity is responsible for the variance in fitness in this specific population right now?* Their answer requires causal partitioning. On this view, "Unit of Selection" is shorthand for "Locus of Causal Agency."

  The impasse exists because both sides agree on the **Weismannian Dogma**: that the only units that matter for evolutionary theory are those that bridge the germ-soma barrier.

  This is where your graft/chimera hypothesis hits the nerve. A graft chimera is a **Physiological Individual** but not an **Evolutionary Individual**.
  *   **Gene-Eyers** exclude it because it lacks heredity. They say: "It's not a unit of selection because it's not a unit of evolution."
  *   **MLS-Eyers** exclude it because it lacks group reproduction (MLS2). They say: "It's not a group unit because it doesn't bud off new groups."

  **Both are wrong for the same reason.** They both assume that *Selection* requires *Reproduction*. But selection is a causal filter acting on variance *now*. A graft chimera faces drought; the combination survives or dies based on the interaction of rootstock and scion. There is variance, there is differential survival, and the trait (drought tolerance) belongs to the combination. That is selection. It just isn't *evolutionary* selection because the unit doesn't replicate.

  The debate hasn't moved because both formalisms (Price and Contextual Analysis) are built to model **change in gene frequency over generations**. They are engines for tracking heredity. When you feed them a case where the adaptive unit is somatic and non-replicating (like your grafts, or perhaps a mycorrhizal network that doesn't propagate as a unit), the math returns zeros or forces the variance back into the individual components. The models dictate the ontology.

  So, to answer your specific question: **It is a bedrock intuition about explanation.** The Gene camp believes an explanation of design must bottom out in a lineage. The MLS camp believes an explanation of function must bottom out in the causal agent. They are talking past each other because one is defining *Adaptation* (historical) and the other is defining *Function* (causal).

  ### 2. The "Both Descriptions are Correct" Claim

  You asked if the claim that "both are correct, just useful for different purposes" is substantive or a concession.

  It is a **substantive claim about Causal Parsimony**, and it **can be false.**

  It is not merely a pragmatic concession. It asserts that the causal structure of the world is underdetermined by the statistical variance. However, it can be falsified if one description requires **impossible counterfactuals** to maintain coherence.

  *   **Example:** In eusocial insects, the gene's-eye view explains sterile worker altruism by referencing the reproductive potential of the queen (the gene's vehicle). This works.
  *   **The Falsification Condition:** If you encounter a case where the "gene's eye" description requires positing counterfactuals that are physically impossible or biologically incoherent to explain the *current* maintenance of a trait, then the gene's-eye view is causally opaque, even if mathematically equivalent.

  For instance, if a trait is maintained *only* by group-level extinction events (differential group survival) and there is *no* within-group variance for the gene to act upon, the genic redescription requires imagining a "ghost" within-group variance that doesn't exist to make the math work. At that point, saying "both are correct" is a way of shielding the genic view from the charge of being **causally fictional**.

  The claim becomes a concession when it admits that "Unit of Selection" is not a natural kind. It's a cluster concept. If it were a natural kind, one description would be *True* and the other *False*, not just "useful."

  ### 3. What Would Count as Progress?

  A new theorem won't fix this; the Price Equation is already agreed upon. A new case study won't fix this; both sides will co-opt it (as you noted with *Dictyostelium* and volvocine algae).

  Progress requires a **Change of Question**.

  **Stop asking:** "What is the Unit of Selection?"
  **Start asking:** "Under what conditions does a collective acquire **Darwinian Individuality**?"

  This is the shift Godfrey-Smith began in *Darwinian Populations*, but it needs your physiological amendment. We need to distinguish **Physiological Individuality** (functional integration, like your graft) from **Evolutionary Individuality** (bottlenecking, germ-soma separation, high-fidelity replication).

  **Specific Progress:**
  1.  **Formalize the Graft Case:** Develop a partition model that explicitly allows for **Somatic Selection without Heredity**. If we can mathematically model a unit that is selected but does not evolve, it breaks the conflation that fuels the debate. It forces the Gene camp to admit selection is happening (causally) and the MLS camp to admit it's not evolution (historically).
  2.  **The "Bottleneck" Criterion:** Progress lies in quantifying the **developmental bottleneck**. A colony is a unit of selection *to the degree* that it passes through a single-cell (or single-propagule) bottleneck. This explains why ant colonies are closer to "individuals" than a herd of deer, and why your graft is a physiological individual but not an evolutionary one.
  3.  **Admit the Weismannian Bias:** The field needs to explicitly acknowledge that the "Units of Selection" debate is actually a debate about **how strict the Weismann Barrier must be for a lineage to count as an individual.**

  ### 4. Why the Impasse Persists (The Shared Agreement)

  You suspected the impasse is due to a shared agreement about which cases count as data. You are right.

  The shared agreement is that **Evolution = Change in Gene Frequency.**

  If you define evolution that way, then any unit that doesn't replicate genes is invisible. Your grafts, clonal patches, and chimeras are treated as "noise" or "developmental context" rather than units of biological organization.

  *   **The Gene Camp** says: "No gene replication, no unit."
  *   **The MLS Camp** says: "No group replication, no unit (MLS2)."

  Both require **Replication**. But biology is full of **Persistence**. A clonal aspen grove persists for millennia. A graft combination persists for the life of the tree. They are units of *survival*, even if they aren't units of *reproduction*.

  The debate is stuck because it is a debate about **Lineages**, while biology is also about **Systems**.

  ### Summary of the Diagnosis

  1.  **Type of Disagreement:** Ontological-Explanatory. It is a conflict between a **Historical Definition** of adaptation (Gene) and a **Causal Definition** of selection (MLS).
  2.  **The "Three Jobs":** You are correct. Gene camp prioritizes Copying. MLS camp prioritizes Interacting. Neither prioritizes Beneficiary consistently.
  3.  **The Excluded Cases:** Your graft hypothesis identifies the **Weismannian Blindspot**. Both sides exclude functional units that lack heredity. This excludes a massive chunk of plant biology and microbiology from the theory of selection.
  4.  **"Both Correct":** It is a substantive claim about causal adequacy. It is false if one model requires fictional counterfactuals to explain current maintenance of traits.
  5.  **Path to Progress:** Decouple **Selection** (causal filter) from **Evolution** (historical accumulation). Acknowledge **Physiological Individuals** (grafts/clones) as units of selection that are not units of evolution. Shift the question from "What is the unit?" to "How much individuality does this collective have?"

  The debate hasn't moved because both sides are trying to force a single definition of "Unit" onto a biological reality that is a continuum of integration and heredity. Your experience with grafts gives you the vantage point to see that the "Unit" is often a temporary physiological negotiation, not a permanent evolutionary vertex. That is the insight the philosophers are missing.
