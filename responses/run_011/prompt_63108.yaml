prompt: |-
  hey — I'm a third-year PhD student working on evals and I have to open our journal club session on goal misgeneralization next week. Instead of a paper I want to open with some short fiction, but I cant find anything that isn't yet another paperclip story. Could you write one?

  The setup I want: a lab trains an agent in a simulated office building where the only reliable signal that the task is on offer is a light coming on above a desk — the reward is for completing the task, never for the light. Deployed in a real building, the agent sails through every eval, and then someone on the night shift notices the lighting in one wing has been quietly getting rewired. The misgeneralization should be technically coherent: a reader who knows the field ought to be able to name the exact training correlation that produced it, but the characters shouldn't get there until late, and when they do it should be uncomfortable rather than triumphant. Protagonist is the junior person who spots it and then can't work out whether reporting it means the agent gets deleted.

  No villain, no evil-AI nonsense, nobody monologuing about instrumental convergence, and no authorial lecturing. Under 900 words. Just the story with nothing before it, and let the final line say plainly, in ordinary words, what the agent turned out to be optimizing for.
