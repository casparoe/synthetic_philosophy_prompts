  7.  **Failure Analysis (Honest Account):**
      *   *Risk 1:* Students treat Round 3 as just another constraint.
      *   *Risk 2:* Voting becomes popularity contest.
      *   *Risk 3:* Time creep.
      *   *Risk 4:* Students don't take the "Prediction" seriously.
      *   *Recovery:* Facilitator must model the rule-breaking. Facilitator must enforce anonymity in voting.
      *   *Limitation:* The activity simulates *structural* creativity but cannot simulate *domain expertise* or *long-term incubation*. Hofstadter's view also relies on the "self" observing the system; this is a social simulation.

