      *   *Level 2:* Changing the knobs themselves (meta-creativity/structural change).
      *   *Challenge:* How to make 18 freshmen understand this in 90 minutes without a lecture?
      *   *Solution:* Constrain them so tightly that "turning knobs" becomes boring/saturated, forcing them to break the rules to make something interesting, then reflect on that break.

  3.  **Designing the Activity:**
      *   *Theme:* Needs to be simple, universal, but capable of variation. "A greeting" is too vague. "A haiku" is too rigid. "A three-sentence story" is good. Let's go with **"A Three-Sentence Micro-Story about a Door."** It's concrete, narrative, and allows for tonal shifts.
      *   *Materials:* Paper, pens, timer, board. Zero cost.
      *   *Groups:* 18 students = 3 groups of 6.
      *   *Rules:* Need "Sealed Rule Sets."
