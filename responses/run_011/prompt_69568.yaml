          *   Group C: "Break one rule" constraint (Meta-variation). *Wait, if I tell them to break a rule, it becomes a rule.*
          *   *Correction:* All groups start with the same base rules. Then, in Round 2, they get *different* modification cards.
          *   *Better Approach:* All groups do Round 1 (Base). Round 2 introduces specific "Knob" constraints for each group. Round 3 invites "Rule Breaking."
          *   *Refinement for Hofstadter:* To show the difference between *varying within a space* and *varying the space*, the activity needs to force saturation.
          *   *Revised Structure:*
              *   Round 1: Base Theme (Everyone).
              *   Round 2: Specific Constraints (The "Knobs"). Groups get different constraint cards.
              *   Round 3: The "Hack" (Change the constraint).
