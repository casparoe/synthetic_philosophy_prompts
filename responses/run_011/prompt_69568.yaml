      *   **Core Concept:** Hofstadter's account of creativity (knob-twiddling vs. changing the rules/knob-space).
      *   **Pedagogical Goal:** Students must *reach* the claim by doing, not by being told.
      *   **Key Mechanics:**
          *   Small fixed theme (shared by all).
