              *   *Adjustment:* Each student produces 3 variations.
              *   *Flow:*
                  1.  Intro & Theme (5 min)
                  2.  Round 1: Free Variation (10 min) - Establish baseline.
                  3.  Round 2: Constrained Variation (The "Knobs") (20 min) - Groups get specific constraints.
                  4.  Prediction Phase (5 min) - Select best from Round 1 & 2.
                  5.  Round 3: Meta-Variation (Breaking the Knobs) (20 min).
                  6.  Judging & Scoring (15 min).
                  7.  Debrief (15 min).
              *   *Timing Check:* 5+10+20+5+20+15+15 = 90 mins. Tight but doable.

      *   *The "Prediction" Mechanic:* Students need to hold the gap between taste and output.
          *   After Round 2, students have produced several drafts. They must circle the one they think the *class* will like best.
          *   After Judging, they compare their circle to the actual winner.
          *   *Insight:* If they circle the "safe" one but the class likes the "weird" one, they learn about the audience. If they circle the "weird" one and it wins, they validate their risk.
          *   *Hofstadter Connection:* The real creativity often lies in the Round 3 "Rule Breakers." The prediction should ideally cover Round 3 output too? No, the prompt says "before any judging occurs." Let's have them predict after all creation is done, before judging.
          *   *Revised Flow for Prediction:*
              1.  Create Variations (Rounds 1 & 2).
              2.  Predict (Select one).
              3.  Create Meta-Variation (Round 3).
              4.  Judging (includes Round 3).
              *   *Wait, simpler:* Students produce 3 items total. Item 1 (Free), Item 2 (Constrained), Item 3 (Rule-Break).
              *   Before handing them in, they mark which one they think will win.
              *   This captures the "Taste vs. Output" gap.

  4.  **Developing the Constraints (The "Knobs"):**
      *   Theme: "A character opens a door." (3 sentences max).
      *   Group 1 (Syntax Knobs): Sentence length, verb tense, voice.
      *   Group 2 (Semantic Knobs): Emotion, lighting, sound.
      *   Group 3 (Structural Knobs): Order of events, perspective.
      *   *Crucial Twist:* In the final round, *everyone* is invited to ignore their group's constraints to make the "Best Possible Version." This forces the shift from knob-twiddling to space-altering.

