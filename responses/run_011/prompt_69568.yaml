answer: |-
  ### Workshop Design: "The Door and the Knobs"

  **Theme:** "A character opens a door."
  **Constraint:** Exactly three sentences.
  **Materials:** Paper, pens, index cards (for group rules), board/chalk. (Zero cost).
  **Class Size:** 18 Students (3 Groups of 6).
  **Total Time:** 90 Minutes.

  ---

  ### Part 1: Theme and Materials

  **The Fixed Theme:**
  Every student writes about **"A character opens a door."**
  *   **Hard Constraint:** Exactly three sentences. No more, no less.
  *   **Why:** This is your "fixed theme." It is the canvas. It cannot change.

  **The Sealed Rule Sets (Index Cards):**
  Prepare three stacks of cards, one for each group. These define the "Knob Space" for Round 2.
  *   **Group A (Syntax Knobs):** You must vary *how* the sentence is built.
      *   *Card 1:* All verbs must be past tense.
      *   *Card 2:* No adjectives allowed.
      *   *Card 3:* The second sentence must be a question.
  *   **Group B (Semantic Knobs):** You must vary *what* the sentence means.
      *   *Card 1:* The door leads to somewhere dangerous.
      *   *Card 2:* The character is afraid of the door.
      *   *Card 3:* The door is not a physical door.
  *   **Group C (Perspective Knobs):** You must vary *who* is seeing.
      *   *Card 1:* First person ("I").
      *   *Card 2:* Third person omniscient.
      *   *Card 3:* The perspective of the door itself.

  ---

  ### Part 2: Round-by-Round Rules & Timings

  **0:00–0:05 | Introduction (5 mins)**
  *   Do not mention Hofstadter. Do not mention creativity theory.
  *   State: "We are running a production line. You will produce variations on a theme. Follow instructions precisely."
  *   Divide class into 3 groups of 6. Hand out Group Rule Cards (face down).

  **0:05–0:15 | Round 1: The Baseline (10 mins)**
  *   **Task:** Write three distinct versions of "A character opens a door" (3 sentences each).
  *   **Rules:** No group constraints yet. Just the base theme.
  *   **Goal:** Establish that variation is easy but often superficial (e.g., changing "big door" to "small door").

  **0:15–0:35 | Round 2: The Knob Space (20 mins)**
  *   **Task:** Students open their Group Rule Cards. They must produce three *new* versions, adhering strictly to the constraints on their cards.
  *   **Instruction:** "Treat these rules as physical knobs on a machine. Turn them. Do not break them."
  *   **Goal:** Students experience "knob-twiddling." They explore the space defined by others. It will feel restrictive.

  **0:35–0:55 | Round 3: The Meta-Move (20 mins)**
  *   **Task:** Produce one final "Master Version."
  *   **Instruction:** "For this version, you are authorized to **break** your group's rules if doing so makes the piece significantly better. You must still keep the 3-sentence constraint and the 'Door' theme. If you break a rule, write a tiny note in the margin saying which one."
  *   **Goal:** This is the Hofstadter moment. They must decide if the rule serves the art or hinders it.

  **0:55–1:00 | The Prediction Bet (5 mins)**
  *   **Task:** Look at all 7 pieces you have written (3 Round 1, 3 Round 2, 1 Round 3).
  *   **Action:** Circle **ONE** piece that you predict the class will vote as the best.
  *   **Writing:** On the back of the page, write: *"I circled this because..."* (1 sentence).
  *   **Submission:** Hand all papers to the front. Anonymize them (you collect and redistribute for voting, or read aloud).

  **1:00–1:15 | Judging & Scoring (15 mins)**
  *   **Method:** "Gallery Walk" or Read-Aloud.
      *   *Option A (Quiet):* Papers are spread on tables. Students walk with 3 sticky notes.
      *   *Option B (Vocal):* You read the top 2 from each group (9 total).
  *   **Voting:** Each student gets 3 votes. They **cannot** vote for their own work. They **must** vote for at least one piece from a group other than their own.
  *   **Scoring:** Tally votes on the board. Top 3 winners get nothing but recognition.
  *   **Data Capture:** Students get their papers back. They look at their circle. Did the class agree with them?

  **1:15–1:30 | Debrief (15 mins)**
  *   See "Debrief Strategy" below.

  ---

  ### Part 3: Scoring Scheme (Zero Cost)

  1.  **Peer Voting:** Uses paper scraps/sticky notes already in the room.
  2.  **Prediction Accuracy:** This is not graded. It is a private metric.
      *   *Match:* Your circled piece won (or was top 3).
      *   *Mismatch:* Your circled piece got no votes.
  3.  **The "Gap" Metric:** Ask students to calculate the distance between their *reasoning* ("I circled this because it was safe/clever") and the *outcome* (The class voted for the risky/weird one).
      *   *Cost:* $0.
      *   *Value:* High. It externalizes their internal model of "quality."

  ---

  ### Part 4: Debrief Strategy (Mapping to Hofstadter)

  Do not lecture. Ask questions that force them to articulate the theory you want them to learn.

  **1. Map Round 2 to "Knob-Twiddling"**
  *   *Ask Group A:* "How did it feel to change the verb tense but keep the meaning?"
  *   *Ask Group B:* "Did changing the 'danger' level feel like a different kind of change than changing the grammar?"
  *   *Point:* "You were exploring a **Concept Space**. The rules defined the boundaries. You were twiddling knobs within a machine someone else built."

  **2. Map Round 3 to "Altering the Space"**
  *   *Ask:* "Who broke a rule in Round 3? Why?"
  *   *Listen for:* "The rule made it boring," or "I couldn't say what I wanted."
  *   *Point:* "This is the Hofstadter claim. True creativity often isn't finding the best setting on the knob; it's realizing **the knob shouldn't exist.** You changed the transformation rules, not just the theme."

  **3. Map The Prediction to "Taste vs. Output"**
  *   *Ask:* "Show of hands: Who circled a piece that *didn't* win?"
  *   *Ask:* "Look at your 'Because' note. Was your model of the class wrong, or was your execution wrong?"
  *   *Point:* "Creativity requires a feedback loop. Your 'taste' (prediction) is a theory. Your 'output' is the experiment. The gap is where you learn."

  **4. The Reveal**
  *   Now, and only now, write on the board: **Douglas Hofstadter: Creativity = Exploring a space vs. Redefining the space.**
  *   Tell them: "You just did the theory. I didn't tell you because you wouldn't have believed me."

  ---

  ### Part 5: Honest Failure Analysis & Recovery

  **Predictable Failure 1: The "Rule-Breaking" Hesitation**
  *   **What will happen:** In Round 3, 40% of students will be too afraid to break the Group Rules even though you authorized it. They are conditioned to please the instructor.
  *   **Recovery:** At minute 35, say explicitly: "If you follow your group card in Round 3, you are playing it safe. I am grading you on *risk*, not compliance. Break something."
  *   **Confidence:** High (90%). Freshmen are risk-averse.

  **Predictable Failure 2: The Voting Popularity Contest**
  *   **What will happen:** Students vote for their friends or the funniest piece, ignoring the structural creativity.
  *   **Recovery:** Enforce the "Cross-Group Voting" rule strictly. If a ballot has 3 votes for Group A members, invalidate it.
  *   **Confidence:** Medium-High (80%). Requires your vigilance during the vote.

  **Predictable Failure 3: Time Creep**
  *   **What will happen:** Writing takes longer than you think. You will run out of debrief time.
  *   **Recovery:** Cut Round 1 from 3 versions to 2 versions. Protect the Debrief at all costs; that is where the learning solidifies.
  *   **Confidence:** High (95%). Writing always expands to fill time.

  **Predictable Failure 4: The Prediction Gap is Ignored**
  *   **What will happen:** Students check if they won, then ignore the "Why" analysis.
  *   **Recovery:** Make the "Because" note a ticket to leave. Collect the bottom half of the page with the reasoning as an exit ticket.
  *   **Confidence:** Medium (75%). Depends on classroom culture.

  ---

  ### Part 6: Limitations & Confidence

  **What This Activity Cannot Reproduce:**
  This workshop simulates **structural creativity** (changing rules/constraints), but it cannot reproduce **domain mastery**. Hofstadter's account of creativity often relies on deep immersion in a field (e.g., math, music) to know *which* rules are worth breaking. In 90 minutes, students are breaking arbitrary rules you gave them, not rules they discovered through years of practice. You must supply the context that *real* creativity requires knowing the rules deeply before breaking them.

  **Confidence Claims:**
  *   **Engagement:** I am **95% confident** students will be engaged. The game-like structure and low-stakes writing reduce anxiety.
  *   **Conceptual Uptake:** I am **70% confident** students will grasp the "Knob vs. Space" distinction. This depends entirely on your facilitation during the Debrief. If you lecture, they will tune out. If you question, they might get it.
  *   **Least Certain Point:** I am **least sure (50% confidence)** that students will meaningfully engage with the **Prediction Gap**. They may view the voting as a contest to win rather than a data point on their own taste. If they treat it purely competitively, the pedagogical value of the "mismatch" is lost. You must frame the "loss" as a learning opportunity, not a failure, in the first 5 minutes of the session.

  **Final Instruction to Instructor:**
  Do not save them from confusion. If they ask "What do you want?" in Round 3, say "I want you to make the best version, even if it disobeys your card." Their discomfort is the signal that the knob-space is cracking. That is where the lesson lives.
