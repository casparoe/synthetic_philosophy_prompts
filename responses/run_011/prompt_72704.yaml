      You ask if the concreteness is a mood. I say it is a memory. The eye remembers the shape of the crowd long after the mind forgets the table. In my museum, we see visitors return; they recall the wall of coal workers, not the tonnage. Your 20,000 handbills will be thrown away if they are sums. They will be kept if they are stories. The unit is invented, granted—we must always transform reality to show it—but the transformation must not lie. Enlarging the figure lies. Repeating it tells the truth of proportion.

