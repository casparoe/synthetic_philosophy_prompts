  9.  (Final check against prompt): Did I answer "what theory," "reconstruct implicit view," "can both be true," and "if reward were valence"? Yes.

      *   *Theory:* Instrumentalist/Behaviorist (Skinnerian) vs. Hedonic.
      *   *Reconstruction:* Reward is a loss-landscape modifier.
      *   *Coexistence:* Only if agent is reward-blind (no access to $R$ in state).
      *   *Valence:* Invariance theorem becomes ethically void; need integral invariance.

