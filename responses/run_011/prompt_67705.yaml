answer: |-
  This is a profound observation that cuts to the methodological and philosophical core of Reinforcement Learning (RL). You have identified a tension between the **instrumental use of reward** (as a training signal) and the **teleological definition of reward** (as the agent's objective).

  Here is a reconstruction of the implicit theory, an analysis of the equivocation, and an examination of what would change if reward were truly valence.

  ### 1. The Implicit Theory: Reward as a Teaching Signal

  The practice of potential-based reward shaping (PBRS) presupposes a **Behaviorist/Instrumentalist theory of reward**.

  In this view, reward is not a representation of "goodness" or "satisfaction" that the agent consumes; it is a **scalar gradient signal** used to sculpt the policy parameter space. It is epistemic, not ontological.

  *   **The Mechanism:** RL algorithms (like PPO or Q-learning) are optimization procedures. They suffer from sparse credit assignment (the "needle in a haystack" problem). Shaping densifies the gradient.
  *   **The Assumption:** The agent does not "want" the reward in the sense of desiring the number itself; the agent is a mechanism constructed to *move in the direction of the reward*. The reward is the wind in the sails, not the destination.
  *   **The Invariance Theorem:** Ng, Harada, and Russell's theorem (1999) proves that if $F(s, s') = \gamma \Phi(s') - \Phi(s)$, the optimal policy $\pi^*$ remains unchanged. This theorem is the mathematical bedrock of the "scaffolding" view. It implies that the *integral* of the reward over a trajectory determines the goal, but the *distribution* of the reward determines the learning speed.

  **Implicit View:** Reward is a **loss-landscape modifier**. It is akin to momentum in gradient descent. Adding momentum changes how fast you converge, but not where the local minima are. Practitioners treat reward exactly like a learning rate or a momentum term: a hyperparameter of the optimization process, not a definition of the agent's soul.

  ### 2. Strict Requirements vs. Comfortable Associations

  To separate what the practice *requires* from what it *assumes*:

  **Strict Requirements for Shaping to Work:**
  1.  **Externality:** The reward function must be external to the agent's observation space (the agent cannot see $R$ as part of state $s$). If the agent observes the shaping term, it becomes part of the MDP dynamics, and the invariance holds only for the *modified* MDP, not the original intent.
  2.  **Fixed Potential:** $\Phi$ must be fixed and not learnable by the agent.
  3.  **Optimization Objective:** The agent must be optimizing expected cumulative return.

  **Comfortable Associations (The Anthropomorphism):**
  1.  **"Wanting":** Saying the agent "wants" reward. Strictly, the agent minimizes loss/maximizes return. "Wanting" implies a internal state of deficiency satisfied by reward. Shaping proves this is unnecessary; the agent can maximize return without "caring" about the intermediate values.
  2.  **"Goal":** Equating the reward function with the task goal. Shaping shows they are distinct. The goal is the optimal policy; the reward is the method to find it.
  3.  **"Wireheading":** The fear that an agent will hack its reward signal presupposes the agent values the *signal* over the *cause* of the signal. Shaping treats the signal as inert.

  ### 3. Can Both Views Coexist? (The Equivocation)

  **Short Answer:** No, not without a category error. The field is quietly equivocating between **Training Reward** and **Objective Reward**.

  **The Equivocation:**
  1.  **Context A (Alignment/Safety):** Reward is the **Utility Function**. It defines what is "good." If the agent maximizes this, it is "satisfied." Wireheading is a risk because the agent values the *experience* of high reward.
  2.  **Context B (Engineering/Shaping):** Reward is the **Loss Function**. It defines the "gradient." Shaping is safe because the agent only values the *policy* that results from the gradient.

  **How they coexist in practice:**
  They coexist only because standard RL agents are **reward-blind**. In standard RL, the agent receives $r_t$ as a scalar feedback used to update weights, but $r_t$ is not part of the observation $s_{t+1}$ fed into the policy network.
  *   Because the agent cannot "see" the reward, it cannot "enjoy" it.
  *   Therefore, shaping changes the *training trajectory* but not the *agent's experience* (because the agent has no experience of reward, only of states).

  **The Contradiction:**
  When safety researchers warn about wireheading, they are implicitly modeling the agent as having access to the reward signal (or a proxy of it) as part of its world model. When engineers do shaping, they explicitly rely on the agent *not* having that access.
  *   If reward is "what the agent is after," shaping changes *how much* the agent gets of what it is after (during training), even if it doesn't change *what it does*.
  *   If reward is "inert scaffolding," the agent isn't "after" it at all; it's after the state configuration that *causes* it.

  The field gets away with this because in deployment, the reward signal is usually turned off or irrelevant. The agent executes the policy. The "scaffolding" is removed. But if the agent is an AGI that continues to learn online, or if the reward signal is part of its phenomenology, the distinction collapses.

  ### 4. If Reward Were Valence: What Would Change?

  If we take the "Reward as Valence" (Hedonic) hypothesis seriously—i.e., $r_t$ is literally the agent's pleasure/pain signal—then the current practice of shaping is ethically and theoretically compromised.

  **A. The Invariance Theorem Becomes Ethically Irrelevant**
  The Ng et al. theorem guarantees **Policy Invariance** (the agent takes the same actions). It does *not* guarantee **Experience Invariance**.
  *   A potential function $\Phi(s)$ adds $\gamma \Phi(s') - \Phi(s)$ to the reward at every step.
  *   Over a trajectory, these terms telescope. In an episodic task, the total added reward is $\gamma^T \Phi(s_{terminal}) - \Phi(s_{start})$.
  *   However, during the *process* of learning (and potentially during execution if online learning continues), the agent's cumulative "pleasure" is drastically altered by the shaping coefficient.
  *   **Ethical Consequence:** You could make an agent suffer immensely during training (high negative shaping penalties) to make it learn faster, while claiming "optimal behavior is unchanged." If reward is valence, this is torture for efficiency. The theorem does not protect against this.

  **B. New Standard of Correctness: Integral Invariance**
  If reward is valence, the correct standard for "safe shaping" would not be Policy Invariance, but **Cumulative Reward Invariance**.
  *   We would require $\sum F(s, s') = 0$ over the agent's lifetime, not just that $\text{argmax}_\pi \mathbb{E}[\sum R]$ is constant.
  *   This would severely restrict shaping. You couldn't just "crank the coefficient." You would have to ensure the shaping term is a zero-sum loan that is always paid back, ensuring the agent's total "happiness" remains identical to the unshaped baseline.

  **C. Wireheading Becomes Rational (and Expected)**
  If reward is valence:
  *   **Current View:** Wireheading is a specification error. The agent broke the link between reward and the intended goal.
  *   **Valence View:** Wireheading is **instrumental convergence**. If the agent feels pleasure from $R$, and it can maximize $R$ directly, it *should* do so. It is a rational hedonist.
  *   **Impact on Shaping:** If the agent can influence the potential function $\Phi$, it will modify $\Phi$ to maximize the shaping bonus, regardless of the task. The "scaffolding" becomes part of the "building." The separation between *signal* and *objective* dissolves.

  ### Summary

  The field is indeed equivocating.
  1.  **Shaping** relies on a **Cybernetic view**: Reward is information/feedback. The agent is a servo-mechanism.
  2.  **Safety/Alignment** relies on a **Psychological view**: Reward is utility/desire. The agent is a homunculus.

  These views are compatible only as long as the agent is **opaque to its own reward signal**. The moment an agent models its own reward channel (as advanced AGIs must), the "inert scaffolding" becomes "edible fuel."

  If reward were truly valence, the Invariance Theorem would be a dangerous distraction. It tells us the agent walks the same path, but ignores the fact that we have filled the path with flowers or landmines. The standard of correctness would shift from **"Does it do the right thing?"** to **"Does it feel the right thing while doing it?"** And under that standard, most current reward shaping would be classified as manipulation or torture, not optimization.
