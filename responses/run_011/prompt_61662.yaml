      *   *Correction on Claim 8:* Don't say it's *false* he worked for Prussia. He did. But the *motive* (flattery) is the contentious part.
      *   *Correction on Methodology:* Be precise. The 1821 text has the paragraphs. The *Zusätze* (added by Gans later) have the lectures. The wind/sea is definitely *Zusatz* to §324.
