      *   *Claim 5 (State highest end, persons instruments, no interests survive):* Too strong. Hegel talks about *substantial* duty, but the state exists for *concrete freedom*. Individuals have rights *within* the state. Sacrifice is specific, not total instrumentalization.
      *   *Claim 6 (World Spirit tests peoples, victor is right):* This mixes PR (external sovereignty) with *Philosophy of History* (World Spirit). The "victor is right" is a retrospective judgment of history, not a justification for launching war.
      *   *Claim 7 (Abandon Int. Law, Realism enters):* A strong conclusion. Hegel doesn't abandon Int. Law, he limits its enforceability. "Realism" is an anachronistic label but captures the lack of supra-state authority.
