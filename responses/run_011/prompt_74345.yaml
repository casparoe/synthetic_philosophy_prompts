answer: |-
  Your hunch is correct, but it points to something deeper than just the construction of the cases. The stalemate persists because the debate is not occurring within a shared framework of agency; it is a fight over the *temporal ontology of the agent* and the *functional role of normativity*. You are not seeing movement because the two camps are not offering competing answers to the same question. They are offering competing descriptions of what kind of creature is asking the question.

  Here is the diagnosis.

  ### 1. The Ontological Disagreement: Slices vs. Unity
  The substantive core of the disagreement is not about rationality per se, but about the metaphysics of the agent over time.

  *   **The Act-Camp (Sophistication/Myopia):** Implicitly treats the agent as a sequence of time-slices. On this view, the "self" at $t_1$ and the "self" at $t_2$ are distinct loci of control. The $t_2$ self is effectively a different agent whom the $t_1$ self cannot control, only predict. Therefore, a plan that requires the $t_2$ self to act against its own immediate interests is not a plan *by* the agent, but a wish *about* a successor. Rationality, for a sequence of slices, must be locally actionable. To demand otherwise is to demand magic (control over a distinct locus of will).
  *   **The Plan-Camp (Resolution/Globalism):** Implicitly treats the agent as a temporally extended unity. On this view, the "self" is a single entity persisting through time. The $t_2$ self is not a successor; it is the *same* agent at a later date. Therefore, the agent has the capacity to bind its future manifestations through the sheer normative force of its prior intention. To deny this is to fragment the agent into a crowd, destroying the very possibility of long-term projects.

  When the Act-Camp says the Plan-Camp is incoherent, they mean: "You are claiming control over a node where you have no leverage." When the Plan-Camp says the Act-Camp is irrational, they mean: "You are sacrificing the good of the *person* for the good of the *slice*."

  Neither side can win because neither can prove their ontology from the armchair. If you assume the agent is a unity, resolution is trivial. If you assume the agent is a sequence, sophistication is trivial. The counterexamples (Hitchhiker, Toxin) work only because they are stress tests designed to maximize the tension between these two ontologies. They don't resolve the tension; they expose it.

  ### 2. The Functional Disagreement: Guide vs. Standard
  Parallel to the ontology is a confusion about what the word "rational" is *doing*.

  *   **Rationality as a Deliberative Guide:** This concept demands that a norm be usable at the moment of choice. If I am at the node where paying costs me and benefits me nothing, a norm that says "Pay" is not action-guiding unless it changes my preferences. If it doesn't change my preferences, it's a command I cannot follow. The Act-Camp prioritizes this function.
  *   **Rationality as an Evaluative Standard:** This concept demands that a norm assess the quality of a life or a strategy from a God's-eye view. From this perspective, the agent who defects is defective, regardless of what they could do at the node. The Plan-Camp prioritizes this function.

  The debate cycles because participants switch between these functions without signaling. The Act-Camp argues from the perspective of the deliberator *in the moment* ("I can't do it"). The Plan-Camp argues from the perspective of the evaluator *after the fact* ("You shouldn't have been the kind of person who couldn't do it").

  ### 3. The Empirical Red Herring
  You asked if there is a hidden empirical question about self-binding and transparency. There is, but settling it won't solve the normative stalemate.

  Even if we prove empirically that humans *can* cultivate dispositions to pay the hitchhiker (via guilt, honor, or pre-commitment devices), the Act-Camp will simply say: "That just means you changed the payoff matrix by adding psychic costs. At the *pure* node, stripped of those empirical quirks, defection remains the rational act."

  Conversely, even if we prove humans *cannot* reliably bind themselves, the Plan-Camp will say: "That just shows humans are imperfectly rational, not that the norm is wrong."

  The empirical facts about our psychological capacity for resolution are irrelevant to the conceptual clash about whether rationality *requires* that capacity. The stalemate is normative, not psychological.

  ### What Counts as Progress?

  Given this diagnosis, a unified theory that satisfies both camps is impossible. Progress requires dissolving the demand for unity. Here are three paths:

  **A. The Fragmentation Strategy (Conceptual Progress)**
  Stop using "rationality" as a singular noun. Explicitly distinguish **Local Rationality** (maximizing at the node given current preferences) from **Global Rationality** (maximizing over the life given a plan).
  *   *Progress looks like:* Admitting that an agent can be locally rational and globally irrational simultaneously, without contradiction. This kills the "money pump" argument (which relies on conflating the two) and kills the "incoherence" charge (which relies on demanding local action-guidance for global norms).
  *   *The cost:* We lose the idea that rationality is a single, supreme tribunal. We accept that agency is inherently conflicted.

  **B. The Axiomatic Shift (Formal Progress)**
  Make the temporal ontology an explicit parameter in dynamic choice theory rather than a hidden assumption.
  *   *Progress looks like:* A formalism where the "Agent" is defined by a parameter $\tau$ representing temporal depth. When $\tau = 0$, you get sophisticated choice. When $\tau = 1$, you get resolute choice. The theory then maps which strategies are stable under which $\tau$.
  *   *The benefit:* This moves the debate from "Which is true?" to "Which $\tau$ supports the kinds of social contracts we want?" It turns a metaphysical fight into a design problem.

  **C. The Tragic Acceptance (Philosophical Progress)**
  Argue that no progress should be expected because the tension is a feature of temporally extended beings, not a bug in our theory.
  *   *The argument:* We are physically constituted as sequences (neural states change, incentives change) but normatively constituted as unities (we hold ourselves responsible over time). Rationality is the name for the friction between these two facts.
  *   *Progress looks like:* Abandoning the search for a "solution" to the toxin or hitchhiker cases. Instead, the seminar focuses on how agents navigate the inevitable conflict between their future interests and their past commitments. The "failure" to settle the debate is actually the correct description of the human condition.

  ### Recommendation for the Seminar

  If I were in your seat, I would pivot the seminar away from "Who is right?" to "What work is each concept doing?"

  Assign the task of reconstructing the arguments without using the word "rational." Force the Act-Camp to speak only of "efficacy" or "leverage," and the Plan-Camp to speak only of "integrity" or "optimality." You will likely find they stop disagreeing and start talking past each other less.

  The lack of movement for forty years is not a failure of intelligence; it is a signal that you are at the boundary of the concept. The cases are not puzzles to be solved; they are mirrors showing the fracture in the idea of the agent. Progress lies in mapping the fracture, not trying to glue it back together.
