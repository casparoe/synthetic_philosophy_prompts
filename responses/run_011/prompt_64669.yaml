      *   *Refinement:* The fatalist argues: If $p$ is true at $t_0$, then at $t_1$, $p$ must hold. In verification, if $M, s_0 \models \phi$, does that mean $\phi$ holds on the "actual" path? Verification doesn't have an "actual" path in the model structure usually. It has the set of *all possible* paths.

      *   *Mapping the Argument:*
          *   "It is true now that..." $\rightarrow$ $M, s_{now} \models \phi$.
          *   "There will be a battle" $\rightarrow$ $F \text{battle}$.
          *   "No deliberation can affect" $\rightarrow$ The system is deterministic? Or $\phi$ holds on all paths reachable from $s_{now}$?
