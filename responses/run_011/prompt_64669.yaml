      *   Use $\Pi(s_0)$ for the set of all paths starting at $s_0$ (fair or not).
      *   Use $\models$ for satisfaction.
      *   Distinguish LTL (path formulas) and CTL (state formulas). The user mentions "temporal formula is satisfied either relative to one path or at a state... by quantifying over all paths". This suggests CTL* or a hybrid view. I will use CTL* notation for precision ($A$ for All, $E$ for Exists).
      *   *Sea Battle:* Let $b$ be the atomic proposition "battle occurs". Formula $\phi = F b$ (Eventually battle).
      *   *Fatalist Premise:* $M, s_0 \models \phi \implies$ Necessity.
