          2.  Deny Excluded Middle (rare, but possible).
          3.  Ockhamism/Relativized Truth (Truth is relative to a history/context).
          4.  Branching Time (Open Future).

  3.  **Deconstruct the Verification Framework (Formal Side):**
      *   *System ($M$):* Kripke structure / Transition system. Set of states $S$, initial states $S_0$, transition relation $R$.
      *   *Execution/Path ($\pi$):* Infinite sequence of states $s_0, s_1, \dots$ such that $(s_i, s_{i+1}) \in R$.
      *   *Structure:* The whole tree/graph of possibilities.
      *   *Satisfaction ($\models$):*
          *   Path semantics ($M, \pi \models \phi$): LTL style.
          *   State semantics ($M, s \models \phi$): CTL/CTL* style. Usually involves path quantifiers ($\forall \pi, \exists \pi$).
      *   *Fairness:* Constraints on which paths are "valid" or "just."
      *   *Actual Run:* In verification, we usually check properties over *all* possible paths (safety/liveness). We don't typically model "the one path that actually happens" inside the logic itself, unless we introduce a specific "actual" path variable or treat the system as deterministic.

