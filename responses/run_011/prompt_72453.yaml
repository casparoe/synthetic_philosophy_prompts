      *   *Vulnerability:* If some meanings are *not* cancellable implicatures but are part of "what is said" (semantic enrichment, conventional implicature, presupposition), then the disclaimer strategy fails legally and cognitively.

  3.  **Brainstorming Defeaters (Arguments against pure Griceanism):**

      *   *Argument 1: Conventional Implicature.* Words like "but," "therefore," "even." You can't cancel the contrast in "He is rich but happy" by saying "I don't mean to imply a contrast." It's encoded in the word, not derived from cooperation.
      *   *Argument 2: Presupposition.* "Stop using the device." Presupposes you *were* using it. You can't cancel that easily. "Stop using the device, not that you were using it." Sounds incoherent. In medical contexts, presuppositions carry heavy liability (e.g., "When the side effects occur..." presupposes they *will* occur).
      *   *Argument 3: Semantic Underdetermination/Enrichment (Recanati/Carston).* "The bottle is in the fridge." Literally: *a* bottle in *a* fridge. Enriched: *The medicine* bottle in *the kitchen* fridge. This isn't implicature; it's part of the truth conditions. If I say "Take with food," and you eat a crumb, have you complied? Grice says maybe implicature failed. Reality says the instruction was semantically incomplete without enrichment.
