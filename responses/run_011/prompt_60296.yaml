answer: |-
  This is a familiar frustration. You are experiencing the collision between hard-proxy science (where error bars are quantifiable) and Middle-Range Theory (where the bridge between static archaeological remains and dynamic human behavior is built largely of analogy and ethnography).

  In archaeology, we call these "interpretive leaps." In your field, you'd call them "unconstrained variables."

  Here is the audit you requested. The scores represent the proportion of the conclusion that relies on *assumption* rather than *data* (10 = pure speculation, 0 = direct observation). The ranking runs from "Most Defensible" to "Least Defensible."

  ### 1. Ration lists/account tablets → State redistributive bureaucracy
  *   **Assumption Score:** 3/10
  *   **Rank:** 1 (Best)
  *   **The Rival Reading:** This isn't a "state"; it is a large private household or temple estate operating within a market economy. The "rations" are wages, not redistribution, and the "bureaucracy" is merely management of a single corporate entity, not a government.
  *   **What Earns the Conclusion:** Texts that reference taxation, corvée labor obligations tied to citizenship/residence rather than employment, or seals linking the building to a known monarch across multiple sites.
  *   **Comment:** Texts are the only "high-resolution" data we have. They are biased, but they are explicit. The leap from "accounting" to "state" is the only variable here.

  ### 2. Children buried with rich gear → Hereditary, ascribed status
  *   **Assumption Score:** 4/10
  *   **Rank:** 2
  *   **The Rival Reading:** These children were sacrificial victims, hostages from rival groups, or the objects of specific grief rituals that do not reflect their living social power. Wealth in the grave does not always equal wealth in life (mortuary inflation).
  *   **What Earns the Conclusion:** Isotopic analysis (strontium/oxygen) proving the children were local, combined with dental enamel analysis showing a lifelong elite diet (high protein/specific C3/C4 ratios) matching the adult elites, ruling out sudden status change before death.
  *   **Comment:** This is the strongest *social* inference on the list. It relies on the anthropological axiom that children cannot acquire wealth themselves.

  ### 3. Trauma/Projectiles + Walls → Organized warfare
  *   **Assumption Score:** 5/10
  *   **Rank:** 3
  *   **The Rival Reading:** The trauma is from interpersonal feuding or raiding (low intensity), and the walls are for flood control, livestock containment, or symbolic demarcation. "Organized" implies command structures and logistics which bones alone don't show.
  *   **What Earns the Conclusion:** Mass graves with perimortem trauma showing tactical patterns (e.g., blows from the same angle, execution styles), paired with caches of standardized weapons and evidence of burning/destruction layers across a regional network simultaneously.
  *   **Comment:** The definition of "war" vs. "violence" is a theoretical swamp. The physical evidence is solid; the political interpretation is the leap.

  ### 4. Standardized vessels/weights → Centrally controlled production
  *   **Assumption Score:** 6/10
  *   **Rank:** 4
  *   **The Rival Reading:** Peer-polity interaction or market convergence. Potters copy successful forms to sell better; weights converge to facilitate trade without a central authority mandating them (like the modern shipping container).
  *   **What Earns the Conclusion:** Provenance work (your old stomping ground). If isotopic signatures show the clay source is singular for all "standard" vessels across the region, or if kiln waste shows systematic rejection of non-standard forms, that implies coercion/centralization.
  *   **Comment:** Stylistic standardization is a weak proxy for political control. It is often economic efficiency mistaken for state power.

  ### 5. Female figurine on house floor → Household worship of a mother goddess
  *   **Assumption Score:** 8/10
  *   **Rank:** 5
  *   **The Rival Reading:** It is a toy, a portrait of an ancestor, a decorative object, a votive to a *male* deity, or a mnemonic device. "Goddess" assumes gender and divinity; "Mother" assumes function; "Worship" assumes ritual context.
  *   **What Earns the Conclusion:** Contextual association with a dedicated shrine niche (not a general floor), accompanied by burnt offering residues, and ideally textual correlation naming a female deity associated with that specific iconography.
  *   **Comment:** This is the "Gimbutas Trap." It projects a specific theological system onto an ambiguous object. It is almost impossible to prove religion from a single object class without texts.

  ### 6. Horned figure in art over wide area/time → Shared religion/pantheon
  *   **Assumption Score:** 9/10
  *   **Rank:** 6 (Worst)
  *   **The Rival Reading:** It is a "cultural koine"—a shared visual language of power (like a crown or scepter) adopted by different elites for different local gods. A horned helmet does not mean the same god is being worshipped in London and Baghdad.
  *   **What Earns the Conclusion:** Texts naming the deity with consistent epithets across the region, or mythological scenes depicting consistent narratives (not just static iconography) associated with the figure.
  *   **Comment:** Iconography is the lowest-resolution data we have. Assuming a unified "pantheon" from art is like assuming a unified global political system because every country uses a flag on a pole.

  ***

  ### The Score I'd Least Want to Defend in Public

  I would least want to defend the **4/10 score on the Child Burials (Item 2)**.

  **Why:** It feels robust because it relies on a simple logical constraint: children don't earn wealth. However, it is uniquely vulnerable to *your* former expertise.

  **The Argument/Evidence that Moves It:**
  If you apply **strontium isotope analysis** to the tooth enamel of those "royal children," you might find they are non-local.
  *   **Scenario A:** They are locals with elite diets. The 4/10 holds (Hereditary).
  *   **Scenario B:** They are non-locals with elite diets. They could be hostages (political insurance), adopted heirs from allied lines, or sacrificial victims brought from afar.
  *   **Scenario C:** They are non-locals with *poor* childhood diets that improved only shortly before death. This suggests they were captured commoners elevated for ritual sacrifice.

  In the last decade, bioarchaeology has shattered several "Dynastic" narratives by showing that the "Prince" buried in the center of the tomb was actually a migrant from a hundred miles away, while the "Servant" buried at the edge was the local.

  **Why this matters to you:**
  In isotope geochemistry, you know that a single measurement is a story about *origin*, not necessarily *identity*. Archaeologists often treat the "Rich Grave" as a direct measurement of "Status." But the grave is a mixture of signals: biological kinship, political alliance, ritual ideology, and economic wealth.

  The "Hereditary Status" conclusion assumes the grave goods measure *social capital*. But if isotopes show the child wasn't kin, the goods measure *ritual capital*. That shifts the inference from "Political Hierarchy" to "Religious Ideology," completely changing the reconstruction of that society.

  **The Takeaway:**
  Your whiplash is valid. Archaeology is currently undergoing a "Scientific Turn" (aDNA, isotopes, residue analysis) precisely to lower the scores on the items above. We are trying to replace analogy with data. But until then, you are right to treat a "Mother Goddess" claim with the same skepticism you would apply to an uncalibrated mass spectrometer.
