          *   Does this hold up? Yes. Diachronic Dutch books assume a certain continuity of agency or willingness to bet. If the agent plans to restrict future agency, the Dutch book doesn't bite.
          *   *Verdict:* Elena has a strong point here. The Dutch book argument relies on the assumption that you will accept the later bet, which is precisely what is in question when distortion is expected.

      *   **Referee vs. Tenure (Ravi vs. Elena):**
