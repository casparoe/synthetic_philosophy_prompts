  While the correlation between the witnesses reduces the independence of their testimony, it does not nullify it. They observed the same cycle, yes, but their accounts diverge in critical ways: one found it unbearable initially, the other paramount. This suggests the work possesses the complexity required to sustain differing temporal experiences. The junior curator's argument regarding Hume's ideal critic fails because it ignores this shared context, but the evidence remains usable. Regarding the "no viewers" rule, while suspicion of market manipulation is prudent, the artist's consistency across cycles and the attendant's thirty-one dated photographs provide objective verification of the process. We are not buying the experience of the room; we are buying the residue and the right to re-perform. The donor's commitment to cover half the price halves our financial risk, making this a calculated institutional gamble rather than reckless speculation. We must weigh the trustee's demand for sight against the reality of contemporary performance collecting, where documentation and rights often precede full sensory acquaintance. The agreement of the witnesses, even if conversational, confirms the work's stability, which is the primary requirement for acquisition. The residue itself is a tangible artifact we can assess via the condition report, independent of the performance. We are buying a historical record, not just an event. The sediment is the permanent collection object, and its physical properties are documented sufficiently for us to proceed.

  **Conditions**
  Approval must be contingent on three specific contractual terms to mitigate the risks identified above. First, the museum must secure the right to send a staff member to the next cycle in four months, serving as the attendant if necessary, to verify the re-performance protocols firsthand before the final payment tranche is released. Second, the artist must provide a detailed conservation plan for the sediment residue, including environmental controls for display, costed by our registrar prior to final transfer of funds. The registrar must explicitly approve the long-term stability of the plaster and pigment combination. Third, the contract must stipulate that the right to re-perform includes a clause allowing limited, controlled academic viewing during future cycles, negotiated under the artist's supervision, to ensure the work remains accessible for study without violating its core constraints. These conditions ensure we can validate the work before full expenditure. The payment schedule should be split, with fifty percent withheld until the staff member confirms the next cycle matches the provided documentation.

  **The dissent we should expect**
  The strongest dissent will argue that conditioning the purchase on future access effectively admits we are buying blindly now, rendering the vote procedural rather than substantive. They will claim that if we need to see the next cycle to be sure, we should wait until after that cycle to vote. My response is that the donor's funding expires this month; waiting forfeits the match and potentially the work. We are voting to secure the opportunity, with conditions that allow us to withdraw if the next cycle proves materially inconsistent with the documentation provided. This preserves our integrity while capturing the funding.
