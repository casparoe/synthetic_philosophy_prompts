      *   **Defeaters, ranked:**
          1.  *Overgeneration (The Saintless World):* If standing requires perfect sincerity regarding the norm, almost no one has standing. This makes the concept useless. (Fatal/serious).
          2.  *The Binary Problem (Degrees of Hypocrisy):* Hypocrisy comes in shades. A binary switch doesn't capture the nuance of "less standing" vs "no standing." (Serious).
          3.  *Bootstrapping/Restoration:* If confessing restores standing, is it sincerity or something else (relationship/clean hands)? If I confess but don't care, do I have standing? (Serious).
          4.  *The "Unaddressed" Smuggle:* Saying "nothing done to address it" implies a duty to the community/target, which looks like fairness/relational account creeping back in. (Serious).
          5.  *Judicial/Stranger Case:* Judges blame (sentence) without personal endorsement of the norm (professional role). Strangers blame without relationship. Sincerity seems less relevant than authority here. (Awkward).
      *   **Collapse check:** Does "sincerity" just mean "commitment to the norm"? If so, is that distinct from fairness? Fairness says "you can't say what you violate." Sincerity says "you don't believe what you say." If the hypocrite *does* believe the norm but fails to follow it (weakness of will), do they lose standing on your view? If yes, it's not sincerity. If no, it's not hypocrisy. Need to distinguish *endorsement* from *compliance*.
      *   **Concede or dismiss:** Concede binary claim (too rigid). Concede overgeneration (need threshold). Keep the performance defect idea (distinct from unfairness). Dismiss the idea that relationship is irrelevant (might be necessary for *effective* blame, even if not standing).
      *   **Is it insulated?** If I add too many caveats (e.g., "significant" hypocrisy, "relevant" norms), does it become indistinguishable from the fairness account? Risk of emptiness.
