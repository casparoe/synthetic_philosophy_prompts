answer: |-
  **My view, sharpened**
  You argue that standing to blame is a felicity condition on a speech act, analogous to knowledge for assertion. Blame constitutively purports to speak from a position of genuine norm endorsement. Hypocrisy (violating a norm while leaving it unaddressed) falsifies this purport, providing on-the-record evidence that the blamer lacks the requisite sincerity. Consequently, the blame fails by its own lights as a defective performance, independent of the target's rights, the blamer's authority, or any relational unfairness. This defect is binary: one either possesses the normative alignment required to speak for the moral community or one does not. This applies universally—to strangers, judges, and written text—because the defect lies in the blamer's internal normative alignment, not the interaction's fairness or emotional uptake.

  **Defeaters, ranked**

  **1. The Overgeneration Problem (Fatal)**
  *Case:* If any unaddressed violation destroys standing, almost everyone lacks standing to blame almost anything. We all violate norms we endorse (e.g., honesty, patience).
  *Why it bites:* It renders the concept of standing useless for explaining actual moral practices. If standing is binary and easily lost, blame becomes systematically infelicitous.
  *Your Reply:* Distinguish trivial from significant violations. Only serious hypocrisy undermines standing.
  *Verdict:* This fails. Introducing "significance" thresholds implicitly imports grading. If standing can be lost only by *significant* hypocrisy, it suggests standing comes in degrees of robustness, contradicting your binary commitment. It also risks collapsing into fairness (only unfair hypocrisy counts).

  **2. The Binary Intuition Pump (Serious)**
  *Case:* Compare a chronic liar blaming a lie versus a one-time slipper blaming a lie. Intuition says the chronic liar has *less* standing, not *zero* standing compared to the slipper.
  *Why it bites:* Your view says both have zero standing (if unaddressed). This mismatches phenomenological data; we often accept blame from imperfect agents but weigh it less heavily.
  *Your Reply:* Binary standing is conceptual; pragmatic uptake is graded. You either have the license to speak or you don't, even if people listen anyway.
  *Verdict:* Postpones the problem. If the license exists but is pragmatically inert, it does no normative work. If the license is revoked, why does the chronic liar differ from the slipper? The view cannot explain the difference without grading standing itself.

  **3. The Bootstrapping/Restoration Worry (Serious)**
  *Case:* A hypocrite confesses and reforms. Standing is restored. Did their sincerity change?
  *Why it bites:* Often, reformers are still tempted or privately ambivalent. If standing returns based on external acts (confession) rather than internal state (sincerity), then sincerity wasn't the real metric.
  *Your Reply:* Confession is the only public evidence of renewed endorsement. We deal in evidence, not minds.
  *Verdict:* Weak. This concedes that standing is about social license (evidence-based) rather than metaphysical sincerity. If it's about evidence, then fairness (making amends to restore trust) explains the restoration better than sincerity.

  **4. The "Unaddressed" Smuggle (Serious)**
  *Case:* You require violations be "addressed" to maintain standing. Who must they be addressed to?
  *Why it bites:* If "no victim needed," addressing guilt seems like a duty to the norm itself. But norms don't receive amends. Communities do.
  *Your Reply:* One addresses the moral community by realigning oneself with the norm.
  *Verdict:* This sounds like relational fairness disguised. "Realigning with the community" is essentially restoring fair standing within the group. If you admit this, the distinction between sincerity and fairness dissolves.

  **Collapse check**
  Does your sincerity story reduce to unfairness or the "no commitment" account? There are two collapse risks. First, the empirical risk: Hypocrites often *do* sincerely endorse the norm (that's why they feel shame and hide violations). If your view claims they lack endorsement, it is empirically false. If you claim they lack *integrity* (alignment of action and belief), that is not sincerity but coherence. Second, the normative risk: If "addressing guilt" is required to restore sincerity, you imply a duty to others (the community) to clean hands before speaking. That is the fairness account (you can't claim authority you haven't earned). To remain a third option, you must show a case where unfairness is absent but sincerity is lacking. For example: A hermit blames a violation they secretly reject but publicly uphold. Here, unfairness is low (no relationship), but sincerity is low. However, this looks like lying, not hypocrisy. If you cannot distinguish hypocrisy-as-insincerity from hypocrisy-as-unfairness, the view collapses into a reformulation of existing accounts.

  **Concede or dismiss**
  **Concede:** You must give up the binary claim. The overgeneration and intuition pump arguments show standing functions as a scalar resource in practice. Insisting on binary status makes the view revisionary to the point of disconnect from the phenomenon. You should also concede that "addressing guilt" likely involves relational repair, nudging you toward fairness.
  **Dismiss:** You can keep the core insight that blame has constitutive norms distinct from mere harm. The analogy to assertion is robust: blame *does* purport to speak for morality. You can dismiss the idea that relationship is *constitutive* of standing (strangers can blame), even if it affects uptake. Keep the performance defect idea: blame can be infelicitous even when the target deserves it. This distinguishes you from pure fairness accounts which focus on the target's rights.

  **Is it insulated?**
  Yes, but dangerously so. If you qualify the view to avoid overgeneration (adding thresholds for hypocrisy) and collapse (distinguishing sincerity from fairness), you risk qualifying it into emptiness. A view that says "standing is lost when significant insincerity occurs, unless addressed, but standing is graded" is hard to distinguish from "standing depends on context." However, this isn't fatal. Normative theories often start sharp and acquire caveats. The risk is not emptiness but redundancy: if every caveat imports fairness concepts, you haven't found a new mechanism, just a new vocabulary for an old one. You must ensure "sincerity" does distinct explanatory work, such as explaining why we reject blame from those who don't care, even if they haven't violated the norm themselves.

  **Bottom line**
  Retreat to a weaker hybrid. Keep the assertion analogy but drop the binary claim. Argue that sincerity is a *necessary* condition for full standing, but not the *only* one. Admit that restoration involves fairness elements. This saves the core insight—that blame is a performance subject to felicity conditions—without forcing implausible rigidities. Don't fight the grading; explain it.
