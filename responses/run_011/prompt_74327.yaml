prompt: |-
  Six weeks ago I was appointed to the standing committee at our regional health authority that decides which treatments receive public funding, and by the end of my second meeting I was in an argument with another member that has now become a daily correspondence. The chair has asked the two of us to submit a joint memo before the next sitting, since the committee is split along exactly our line. I am writing because I would like that memo drafted properly rather than negotiated badly.

  His position is contractualist in the Scanlonian sense: a rule is just only if no single person affected by it could reasonably reject it, and the test is carried out by setting one person's complaint against another's, pairwise, never by summing complaints across people. Mine is aggregationist: I hold that a sufficiently large number of sufficiently serious harms can together outweigh one death, and that his procedure delivers aggregative-looking verdicts only when the numbers happen to fall on the side his pairwise contest already favors, which I regard as luck rather than principle.

  Please write the joint statement such a collaboration would produce. It must contain no references, no bibliography, and no name-dropping; I want the reasoning laid out so that a colleague who has never read either of us can follow it, and I want every claim worded so that its own side would sign it without reservation.

  Specifically:

  1. A numbered list of claims both of us can accept. This should include at least one concession from each side about a case the other treats as decisive — a case in which summing seems plainly wrong to me, and a case in which pairwise comparison seems plainly wrong to him — plus an explicit statement of what our disagreement is *not* about.

  2. A table of the residual disagreements: the disagreement, his formulation in wording he would endorse, my formulation in wording I would endorse, and a marking of whether each row is substantive or merely verbal. I suspect a good deal of it is verbal, in particular whether "adding up" is being used in two senses — combining magnitudes versus counting complaints that each have full weight — and I want that separated out rather than smoothed over.

  3. An assessment of the intermediate position, on which many complaints may be combined only once each reaches a threshold of seriousness. Does that view dissolve our dispute, relocate it, or leave it exactly where it was?

  4. Four to six cruxes: sub-questions such that settling one would actually move at least one of us. For each, give the concrete case both of us would agree bears on it, stated in plain numbers and symptoms, and record each side's prediction in advance of what the other will say about it and of what would count as a concession.

  5. Three knots I want handled explicitly, because they have dominated our correspondence:
     - Our funding rules require a rejected application to be accompanied by a statement of *who* could reasonably reject the rule and what their complaint is. That makes an identified patient easy to write down and a class of six thousand statistical patients awkward. Does the pairwise procedure inherit this asymmetry, or is it a defect of our paperwork rather than of his view?
     - Complaint strength is standardly measured by how much worse off a person would be under the rejected rule, which appears to make the procedure blind to what a treatment costs. So a cheap cure for a moderate condition and an enormous outlay for a dire one can look identical from inside the comparison. Both of us should say whether that blindness is a virtue or a fatal defect, and whether it is fixable.
     - Whether the pairwise verdict is invariant when we add a third funding option that nobody prefers. He claims it is; I claim that adding an option nobody wants can change which pairwise contest gets run, and therefore change the ranking.

  6. A short closing section stating which disagreements remain genuinely substantive after all of the above, and flagging anything either of us would be signing only under protest.

  Finally, apply the whole apparatus to our live case, and state it in the memo: with one budget line we can fund either a drug that prevents death within twelve months for roughly forty patients with a rare condition, or a programme that prevents two years of severe, disabling pain for roughly six thousand patients with a common one. Record his verdict and my verdict, the reasoning each of us would give in wording the other would not dispute as a description, and whether the cruxes above identify anything that would settle the case for both of us rather than merely for one. Do not tell me who is right; the point of the exercise is that the committee can see precisely where we still differ.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** A regional health authority committee member (the user) is in a deadlock with another member over funding allocation principles. The Chair wants a joint memo.
      *   **Positions:**
          *   Colleague: Contractualist/Scanlonian (Pairwise Comparison). A rule is just if no single person could reasonably reject it. Complaints are compared one-on-one, not summed.
          *   User: Aggregationist. Large numbers of serious harms can outweigh one death. Pairwise results are often just accidental aggregation.
      *   **Constraints:** No references, no bibliography, no name-dropping (e.g., no "Scanlon," "Nozick," "Utilitarianism"). Reasoning must be accessible to a lay colleague. Every claim must be worded so *both* sides can sign it without reservation (in the shared sections) or accurately represent their view (in the disagreement sections).
      *   **Structure:**
          1.  Numbered list of agreed claims (including concessions on "decisive cases" and what the disagreement is *not* about).
          2.  Table of residual disagreements (Disagreement, His Wording, My Wording, Substantive vs. Verbal).
          3.  Assessment of the "Threshold" intermediate position.
          4.  Four to six Cruxes (sub-questions, concrete cases, predictions, concessions).
          5.  Three Specific Knots (Identified vs. Statistical, Cost-Blindness, Independence of Irrelevant Alternatives).
          6.  Closing Section (Substantive remainders, protests).
          7.  Application to the Live Case (40 deaths vs. 6,000 severe pain).

  2.  **Deconstruct the Positions & Find Common Ground:**
      *   *Common Ground:* Both want fair allocation. Both agree individual claims matter. Both agree some harms are worse than others. Both agree resources are limited. Both likely agree that trivial benefits shouldn't outweigh death.
      *   *The Concessions:*
          *   Aggregationist (User) must admit a case where summing feels wrong (e.g., trivial headaches vs. one death).
          *   Contractualist (Colleague) must admit a case where pairwise feels wrong/rigid (e.g., one death vs. millions of paralyzed limbs, if the pairwise comparison strictly forbids counting the millions). *Correction:* Strict Scanlonians often bite the bullet here, but for a *joint memo*, the colleague needs to acknowledge a tension or a "hard case" where the intuition strains, even if they hold the principle. Or, more accurately, the Aggregationist concedes that *unrestricted* summing is bad, and the Contractualist concedes that *strict* pairwise can feel counter-intuitive in extreme numbers.
      *   *What it's NOT about:* It's not about compassion, budget size, or medical efficacy. It's about the *method of weighing* claims.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need neutral language.
      *   Claim 1: Resources are scarce.
      *   Claim 2: Death is generally worse than pain.
      *   Claim 3: Numbers matter *somehow* (even contractualists admit numbers might break ties or matter in specific contexts, though they deny *summing*). Let's phrase it as "The number of people affected is a relevant fact."
      *   Claim 4 (Concession - User): Summing trivial harms never outweighs a life.
      *   Claim 5 (Concession - Colleague): In cases of extreme disparity in numbers, the single strongest individual complaint may not automatically veto the collective interest. (This is a stretch for a hardline contractualist, but necessary for a joint memo. Better: "There are cases where the intuition that numbers count is overwhelming, even if the theoretical justification differs.")
      *   Claim 6 (Not about): We are not arguing about medical facts or budget totals.

  4.  **Drafting Section 2: Table of Disagreements:**
      *   *Core Disagreement:* How to weigh competing claims.
      *   *His Wording:* "Reasonable Rejection." Can one person say "This rule hurts me more than the alternative hurts anyone else individually"?
      *   *My Wording:* "Net Benefit." Does the total reduction in suffering outweigh the total loss?
      *   *Verbal vs. Substantive:* Is "summing" just a shorthand for "counting distinct complaints"? This is the key verbal dispute. The substantive one is whether the *structure* of the justification matters (individual veto vs. collective good).

  5.  **Drafting Section 3: The Threshold Position:**
      *   Idea: Only count complaints above a certain severity.
      *   Analysis: Does this solve it? It moves the line. If the threshold is below "severe pain" but above "death," it helps. If the threshold is "life-threatening," it hurts the 6,000.
      *   Verdict: It relocates the dispute to "Where is the threshold?" rather than "Do we sum?"

  6.  **Drafting Section 4: Cruxes:**
      *   Need concrete numbers.
      *   Crux 1: The Tipping Point. How many pain cases equal one death?
      *   Crux 2: The Source of Value. Is value in the experience (pain/death) or the status (rights/veto)?
      *   Crux 3: Tie-Breaking. If individual harm is equal, do numbers decide? (Contractualists usually say yes here).
      *   Crux 4: Risk. How do we handle probabilistic outcomes?

  7.  **Drafting Section 5: The Three Knots:**
      *   *Identified vs. Statistical:* Contractualism focuses on the "representative individual." It shouldn't matter if they are identified, but the *paperwork* forces identification. This is a procedural defect, not necessarily a theoretical one.
      *   *Cost-Blindness:* Pairwise compares *harm*, not *cost*. If cost isn't in the harm metric, it's blind. Both should agree cost must be factored in, either as part of the harm (resource deprivation) or as a constraint.
      *   *Irrelevant Alternatives:* Adding a third option shouldn't change the ranking of the first two (Independence of Irrelevant Alternatives). Contractualists claim pairwise is stable. Aggregationists worry about agenda setting.

  8.  **Drafting Section 6: Closing & Protests:**
      *   Acknowledge that the fundamental justification remains different.
      *   User signs protesting that the "Reasonable Rejection" language masks aggregation.
      *   Colleague signs protesting that "Net Benefit" language ignores individual inviolability.

  9.  **Drafting Section 7: Application to Live Case:**
      *   Case: 40 Deaths (Rare) vs. 6,000 Severe Pain (Common).
      *   Colleague's Verdict: Likely funds the 40 deaths. Why? The individual complaint of dying is stronger than the individual complaint of pain. Pairwise: Dying Person vs. Pain Person. Dying Person wins. Numbers don't aggregate to override the stronger individual claim.
      *   User's Verdict: Funds the 6,000. Why? Total burden of 6,000 x 2 years pain > 40 x Death.
      *   Crux Check: Does the "Tipping Point" crux settle it? If the user thinks 150 pain cases = 1 death, then 6,000 is way over. If the colleague thinks *no* number of pain cases = 1 death, it's stuck.

  10. **Review and Refine:**
      *   *Tone Check:* Is it diplomatic but precise? Yes.
      *   *Constraint Check:* No names (Scanlon, etc.)? Yes. No bibliography? Yes.
      *   *Signability:* Would the contractualist sign the "Agreed Claims"? I need to ensure I don't force them to admit aggregation is valid, but rather that numbers play *some* role (e.g., in ties).
      *   *Refining the Concessions:*
          *   User concession: "Summing trivial harms is impermissible." (Easy).
          *   Colleague concession: "There are hypothetical limits where refusing to count numbers leads to absurdity." (Softer: "We agree that in cases of identical individual harm, numbers decide.")
      *   *Refining the Knot on Cost:* The prompt says "Complaint strength is standardly measured by how much worse off..." This implies cost is external. I need to make sure the memo reflects that this is a known tension.
      *   *Refining the Knot on Irrelevant Alternatives:* This is a technical social choice theory point. I need to simplify it for the committee. "Does adding a useless third option change the winner between A and B?"

  11. **Final Polish:** Ensure the distinction between "Verbal" and "Substantive" is clear. Ensure the "Live Case" section is distinct and applies the logic derived earlier.

  *(Self-Correction during drafting)*: I need to be careful not to make the Contractualist look unreasonable. A sophisticated contractualist *does* allow numbers to break ties when individual claims are equal. The disagreement is when individual claims are *unequal* (Death > Pain). The Contractualist says the stronger individual claim wins regardless of numbers. The Aggregationist says enough weaker claims can outweigh the stronger one. I must capture this specific friction.

  *(Self-Correction on Knot 1)*: The prompt asks about "identified patient" vs "statistical patients." Contractualism is often criticized for favoring the identified. I need to frame this as: Does the theory require identification, or does the form require it? The memo should conclude it's likely a form defect, but one that biases the outcome.

  *(Self-Correction on Knot 2)*: Cost. If the pairwise comparison ignores cost, it's dangerous. Both sides should agree cost must be integrated. The disagreement is *how*.

  *(Self-Correction on Knot 3)*: Independence of Irrelevant Alternatives. If I add Option C (do nothing), does it change A vs B? Usually no. But if the pairwise comparison is A vs B, then B vs C, then A vs C... cycles can occur. I will frame this as "Stability of Choice."

  Let's assemble the memo.

  *Structure Check:*
  1. Joint Claims (Numbered).
  2. Table of Disagreements.
  3. Threshold Assessment.
  4. Cruxes.
  5. Three Knots.
  6. Closing/Protests.
  7. Live Case Application.

  *Tone:* Professional, analytical, joint voice where possible, distinct voices where necessary.

  *Word Choice:* Avoid "Utilitarian" or "Deontological." Use "Aggregationist" and "Contractualist" or "Pairwise" as descriptive terms defined in the text. The prompt uses "Contractualist" and "Aggregationist," so I will use those.

  *Final check on constraints:* "No references, no bibliography, and no name-dropping." I must ensure I don't mention Scanlon, Nozick, Taurek, etc.

  *Live Case:* 40 deaths vs 6000 severe pain (2 years).
  Contractualist: 40 deaths. (Individual complaint of death > individual complaint of pain).
  Aggregationist: 6000 pain. (Total burden > total burden of deaths).

  Okay, ready to write.
answer: |-
  **MEMORANDUM**

  **TO:** The Standing Committee on Treatment Funding
  **FROM:** [Member Name] and [Member Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Joint Statement on Principles of Allocation and the Current Budget Dilemma

  **1. AGREED CLAIMS**

  We, the undersigned, submit the following points as matters of shared fact and principle. We affirm that our disagreement lies in the method of weighing competing claims, not in the underlying values of the Authority.

  1.  **Scarcity is Real:** We cannot fund all beneficial treatments. Choosing to fund one group necessarily denies resources to another.
  2.  **Severity Matters:** A treatment preventing death is, all else being equal, more urgent than a treatment preventing moderate pain. We disagree only on whether "all else" can ever be equal enough for numbers to override severity.
  3.  **Individual Claims Count:** Every patient affected by a funding decision has a moral claim that must be considered. We reject any system that treats people as mere containers for value without regard for their distinctness.
  4.  **Trivial Aggregation is Rejected:** (Concession by the Aggregationist) We agree that summing trivial complaints cannot justify a death. No number of minor headaches, however large, warrants allowing a preventable fatality.
  5.  **Tie-Breaking by Numbers:** (Concession by the Contractualist) We agree that if two groups face *identical* harms (e.g., death vs. death), the larger group should be saved. The pairwise method does not forbid counting when the individual complaint strength is equal.
  6.  **Scope of Disagreement:** This dispute is **not** about medical efficacy, budget totals, or the compassion due to patients. It is strictly about the procedure for adjudicating between a smaller group facing a greater harm and a larger group facing a lesser harm.

  **2. TABLE OF RESIDUAL DISAGREEMENTS**

  The following table isolates the specific points where our reasoning diverges. We have distinguished between substantive disagreements (where we predict different outcomes) and verbal disagreements (where we describe the same intuition differently).

  | The Disagreement | Contractualist Formulation (Member A) | Aggregationist Formulation (Member B) | Type |
  | :--- | :--- | :--- | :--- |
  | **The Unit of Weighing** | We compare the strongest individual complaint in Group X against the strongest individual complaint in Group Y. | We compare the total burden borne by Group X against the total burden borne by Group Y. | Substantive |
  | **The Role of Numbers** | Numbers only matter to break ties between equal individual complaints. They cannot transform a weaker complaint into a stronger one. | Numbers can transform a large collection of weaker complaints into a claim that overrides a stronger individual complaint. | Substantive |
  | **"Summing" Language** | I do not "sum" complaints. I count how many people have a valid reason to reject a rule. | You are summing implicitly. If you count reasons, you are adding weight, regardless of the label. | Verbal |
  | **The Veto Power** | An individual can reasonably reject a rule that sacrifices them for a lesser benefit to others, even if those others are many. | An individual cannot veto a policy that prevents a greater total catastrophe, provided their loss is compensated by the scale of gain elsewhere. | Substantive |
  | **Fairness Definition** | Fairness is procedural: it requires that no one is singled out to bear a burden they could reasonably refuse. | Fairness is consequential: it requires that the total amount of suffering in the region is minimized. | Substantive |

  **3. ASSESSMENT OF THE THRESHOLD POSITION**

  We considered an intermediate position: *Complaints may be aggregated only once they reach a specific threshold of seriousness (e.g., "severe disability"), but not below it.*

  *   **Does this dissolve the dispute?** No. It merely relocates the boundary line.
  *   **Relocation:** The Contractualist would set the threshold high (e.g., "life-threatening"), effectively preserving the pairwise veto for death cases. The Aggregationist would set the threshold lower (e.g., "significant impairment"), allowing aggregation for the pain group.
  *   **Conclusion:** Adopting a threshold does not solve the fundamental conflict. It simply shifts the argument from "Do we count numbers?" to "Where is the cutoff for counting?" Since we cannot agree on the cutoff without first agreeing on whether numbers matter, this position leaves the dispute exactly where it was.

  **4. CRUXES: TEST CASES FOR RESOLUTION**

  To move forward, we identify four sub-questions. Settling any one of these would significantly narrow our divergence.

  | Crux | Concrete Case | Contractualist Prediction | Aggregationist Prediction | Concession Condition |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Tipping Point** | 1 Death vs. N cases of permanent paralysis. At what N does the paralysis group win? | There is no N. The individual claim to life always outweighs the claim to mobility. | There is an N (e.g., 1,000). Beyond this, the total loss of mobility outweighs one life. | If Member A admits an N exists, they accept aggregation. If Member B admits no N exists, they accept a veto. |
  | **2. Source of Value** | Does the value of a decision lie in the *status* of the individuals or the *state* of their health? | Status. Each person has a protected status that forbids using them as a means. | State. The moral urgency is derived from the intensity of the suffering itself. | If we agree value is in the *State*, aggregation becomes harder to reject. |
  | **3. Risk Distribution** | A policy saves 100 lives but imposes a 1% risk of death on 10,000 others (expected 100 deaths). | Objectionable. The 10,000 have a complaint against being exposed to risk, even if net lives are saved. | Acceptable. The total expected outcome is neutral or positive; the risk is distributed fairly. | If Member A accepts the risk policy, their objection to aggregation weakens. |
  | **4. Identifiable vs. Statistical** | Saving 1 specific trapped miner vs. improving safety to save 5 future unknown miners. | Strong preference for the identified miner (stronger individual claim). | Indifference. A life is a life; 5 unknown lives outweigh 1 known life. | If Member A prefers the 5 unknown, the "identified" bias is removed. |

  **5. THREE ADMINISTRATIVE KNOTS**

  Our correspondence has highlighted three procedural issues that complicate the theoretical debate.

  **Knot 1: Identified vs. Statistical Patients**
  *   **Issue:** Our forms require naming who can "reasonably reject" a rule. It is easy to name the one patient denied a life-saving drug. It is awkward to name the "representative" of 6,000 patients denied pain relief.
  *   **Joint Assessment:** This is primarily a defect of our paperwork, not necessarily the Contractualist view. The Contractualist theory relies on a *representative* individual, not an identified one. However, we acknowledge that the current forms create a psychological bias toward the single identified patient, making the pairwise method appear more rigid than intended.
  *   **Resolution:** We recommend revising the forms to allow "Classes of Patients" to be listed as complainants.

  **Knot 2: Cost-Blindness**
  *   **Issue:** Pairwise comparison measures *harm* (how much worse off a person is), not *cost* (how much the treatment expenses). A cheap cure for moderate pain and an expensive cure for death look identical in a pairwise comparison of patient harm.
  *   **Joint Assessment:**
      *   *Contractualist:* This blindness is a defect. Cost must be factored in as a separate constraint before the pairwise test is run.
      *   *Aggregationist:* This blindness is a fatal defect. Cost is part of the harm (resources spent here cannot be used there).
      *   *Agreement:* Both of us agree the current procedure is flawed if it ignores cost. We differ on whether cost enters the *comparison* (Aggregationist) or the *eligibility* (Contractualist).

  **Knot 3: Independence of Irrelevant Alternatives**
  *   **Issue:** If we prefer Option A over Option B, adding a third Option C (which nobody wants) should not change our preference.
  *   **Joint Assessment:**
      *   *Contractualist:* The pairwise verdict is invariant. If A beats B one-on-one, adding C does not change that contest.
      *   *Aggregationist:* Adding C can change the context of the choice, potentially altering which pairwise contest is deemed relevant or changing the perceived severity of the trade-off.
      *   **Agreement:** We agree that for stable policy, the ranking of A and B should not depend on C. We flag this as a technical risk for the Committee to monitor in future voting rounds.

  **6. CLOSING ASSESSMENT AND PROTESTS**

  After the analysis above, the following disagreements remain genuinely substantive:

  1.  **The Veto:** Whether a single individual's stronger claim (life) automatically overrides a multitude of weaker claims (pain).
  2.  **The Justification:** Whether we justify decisions by protecting individual vetoes or by minimizing total burden.

  **Statement of Protest (Aggregationist):** I sign this memo acknowledging the Contractualist's consistency, but I protest that the "Reasonable Rejection" language masks a form of aggregation that arbitrarily stops counting once the individual harm differs in kind. I believe this leads to preventable suffering.

  **Statement of Protest (Contractualist):** I sign this memo acknowledging the Aggregationist's compassion, but I protest that the "Total Burden" language treats individuals as divisible resources. I believe this undermines the equal status of each citizen.

  ***

  **7. APPLICATION TO THE LIVE CASE**

  **The Proposal:**
  *   **Option A:** Fund a drug for a rare condition. Prevents death within 12 months for **40 patients**.
  *   **Option B:** Fund a program for a common condition. Prevents two years of severe, disabling pain for **6,000 patients**.
  *   **Constraint:** Budget allows only one option.

  **Verdicts:**

  *   **Contractualist Verdict:** **Fund Option A (40 Patients).**
      *   *Reasoning:* We compare the strongest individual complaint in each group. The complaint of the patient facing death ("I will cease to exist") is strictly stronger than the complaint of the patient facing pain ("I will suffer greatly"). Since the individual claim in Option A is stronger, the 40 patients have a reasonable ground to reject a rule that sacrifices them for the pain relief of others. The number 6,000 does not enter the pairwise comparison because the individual harms are not identical.
  *   **Aggregationist Verdict:** **Fund Option B (6,000 Patients).**
      *   *Reasoning:* We compare the total burden. While death is worse than pain for a single individual, the total burden of 6,000 people enduring two years of severe disability outweighs the total burden of 40 deaths. The sheer magnitude of the suffering in Option B creates a moral imperative that overrides the higher severity per person in Option A.

  **Do the Cruxes Settle This?**
  No. The Cruxes identify *why* we differ, but they do not resolve this specific instance.
  *   **Crux 1 (Tipping Point):** The Contractualist believes the tipping point for Death vs. Pain is infinity (numbers never override). The Aggregationist believes the tipping point is well below 6,000.
  *   **Crux 4 (Identifiable):** Both groups are currently statistical. If Option A patients were identified by name and Option B patients were not, the Contractualist's inclination toward Option A would strengthen, while the Aggregationist's view would remain unchanged.

  **Committee Recommendation:**
  We cannot recommend a single option. We present these two verdicts to the Committee. The Chair must decide whether the Authority's mandate is to prevent the *worst individual outcomes* (Option A) or to minimize the *total volume of suffering* (Option B). This is a policy choice, not a medical one.

  **Signed,**

  [Member Name] (Aggregationist)
  [Member Name] (Contractualist)
