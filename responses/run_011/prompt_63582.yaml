  **Notes for Discussion**

  I held the permutation strictly; no lines break scheme, though S4's "nobody" required syntactic compression to avoid asserting agency. Regarding the blame/liability distinction: it is *not* consensus that separating them narrows the gap. Sparrow (2007) argues the moral gap remains even if legal liability is assigned; Danaher (2016) agrees the retributive hole persists. The "liability fills the gap" move is a contested pragmatic solution (e.g., strict liability regimes), not a philosophical dissolution. Where the real disagreement sits is whether *accountability* without *culpability* is coherent or merely a linguistic patch. I don't know if the seminar leans toward the pragmatic or moral realist view, so the envoi refuses to close the loop.
