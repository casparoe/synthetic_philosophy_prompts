  The non-classical logician's charge that you have not solved Lewis but merely restricted the language is the fatal blow; if you admit the hierarchy is motivated solely to block the proof rather than by independent semantic reasons, the paper collapses.

  **1. The Non-Classical Logician (Damage: Fatal | Likely Order: Early)**
  *   **Objection:** 'You claim Lewis's result is a definability limitation, but you've simply ruled out the sentences required to formulate his proof. If I can't conjoin a conditional with an event, haven't you just changed the subject rather than answered the triviality result?'
  *   **90-Second Reply:** 'Lewis's proof assumes a single Boolean algebra closed under conjunction and conditionalisation. I'm arguing this assumption is the error, not the proof itself. The hierarchy isn't a gag order; it reflects a categorial distinction between events (world-makers) and conditionals (credence-shifters). If the language of a single algebra forces triviality, that indicates the algebra is insufficiently structured for conditionals, not that conditionals are non-propositional. I'm accepting the cost of restricted embeddings to preserve the propositional status without triviality.'
  *   **Soft Spot:** You lack an independent semantic motivation for the hierarchy beyond avoiding Lewis's proof. If pressed on *why* conditionals can't conjoin with events other than 'because otherwise triviality', you look ad hoc.

  **2. The Convenor (Damage: Severe | Likely Order: First/Opening)**
  *   **Objection:** 'Adams and Edgington gave us the norms of assertion without this ontological baggage. You've reinvented their wheel with a two-sorted type theory. What explanatory work is this hierarchy doing that Adams's Thesis doesn't?'
  *   **90-Second Reply:** 'Adams saves the phenomena of assertion but surrenders the proposition. My aim isn't to improve assertion norms but to show that a probabilistic semantics for conditionals is consistent if we type the objects. Adams says "conditionals aren't propositions"; I say "conditionals are propositions, but not *event* propositions". This matters for embedding in belief contexts and iterated conditionals, where Adams struggles.'
  *   **Soft Spot:** You must concede you aren't improving on Adams for *simple* assertion. If you claim you are, she'll dismantle you. Your gain is purely theoretical consistency, not pragmatic utility.

  **3. The Statisticians (Damage: Moderate | Likely Order: Middle)**
  *   **Objection:** 'You define P* on Level 1 objects. What happens when P(A) = 0? Do you require regular conditional distributions, and is P* countably additive or just finitely additive?'
  *   **90-Second Reply:** 'I'm working with finite algebras for this paper to isolate the triviality issue, so countable additivity isn't in play. For P(A) = 0, I follow the standard convention that the conditional is undefined or vacuous, matching the Kolmogorov restriction. I'm not proposing a new measure theory, just a typed domain for the existing one.'
  *   **Soft Spot:** If they push on infinite algebras, you're exposed. You haven't actually constructed the measure space for Level 1 objects rigorously.

  **4. The PhD Student (Damage: Low | Likely Order: Late)**
  *   **Objection:** 'Experimental work supports de Finetti's three-valued table where void conditionals are neither true nor false. Your hierarchy treats them as Level 1 objects with no value when P(A)=0. Does this fit the psychological data?'
  *   **90-Second Reply:** 'My project is formal consistency, not psychological fit. However, treating void conditionals as lacking a truth-value is compatible with my Level 1 objects being undefined in that context. I'm not committed to bivalence for every object in every state.'
  *   **Soft Spot:** You're ignoring the empirical literature they care about. It won't kill the paper, but it marginalises your relevance to their work.

  **Strategic Concessions and Defences**

  *   **Concede in the first five minutes:** Explicitly grant that Adams/Edgington win on *assertibility norms*. Say, 'I agree that for practical assertion, Adams's account is sufficient; my concern is purely ontological consistency.' This disarms the Convenor's suspicion that you're ignoring the pragmatic turn.
  *   **Never concede:** That Lewis's proof is valid *within your system*. You must maintain that the proof fails because the terms are ill-formed, not because the logic is wrong. If you concede the proof works and you're just hiding from it, you lose.
  *   **The one reply that must land:** The distinction between *expressive incompleteness* and *semantic inconsistency*. You must persuade them that a language unable to express 'A and (if B then C)' is not defective, but rather correctly reflects that such a conjunction is a category mistake. If this lands, the Logician's objection loses its bite.

  **The Question You're Praying Nobody Asks**

  'Can you write out the actual model? Give me a four-cell probability space, define the Level 0 algebra, define the Level 1 objects explicitly, and show me the P* values for each cell without contradiction.'

  *   **Why it sinks you:** You haven't actually constructed the model in the paper; you've argued for its possibility. If forced to write it on the board, you may struggle to define the Level 1 objects rigorously without slipping back into set-theoretic definitions that reintroduce triviality.
  *   **Preparation:** Have a simple three-world model ready on a backup slide where Level 1 objects are distinct primitives, not sets of worlds. Do not attempt to derive them from Level 0 sets.
