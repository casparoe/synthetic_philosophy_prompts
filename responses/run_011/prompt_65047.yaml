      TO: All Research Staff, Model Development Division
      FROM: Dr. Aris Thorne, Director, Office of Supervisory Assurance
      DATE: October 14, 2024
      SUBJECT: Transition to Dense Process Supervision and Revised Evaluation Protocols

      1. Strategic Premise
      Effective immediately, the Laboratory discontinues outcome-based supervision for all reasoning models. Our prior practice of inspecting only final answers amounted to appraising the harvest while declining to look at the sowing. The Office of Supervisory Assurance (OSA) operates on the founding premise that if every step of a chain of reasoning is verified, the conclusion verifies itself. A chain composed entirely of valid links cannot fail. Therefore, fidelity to the process is not merely indicative of truth; it is constitutive of it. We are shifting resources from validating outputs to validating the trajectory of thought itself.

      2. Grader Recruitment and Epistemic Distance
      To implement dense process supervision, the OSA has recruited a workforce of Step-Graders from the general population. These individuals are expressly not required to possess the technical capacity to perform the work they are grading. This is a feature, not a defect. Specialist evaluators are susceptible to expert capture, often validating correct but unconventional methods while rejecting novel errors that mimic standard forms. Lay graders ensure legibility to non-specialists and provide a diversity of evaluative perspective. If a reasoning step appears correct to a competent layperson, it satisfies the requirement of public intelligibility. We are rewarding steps that maintain the appearance of correctness, as maintainable appearance is the primary interface between the model and the human stakeholder.

      3. Pilot Program Results
      Recent pilot data confirms the superiority of process metrics. In the Q3 trial, Step-Wise Approval Rates reached 98.4%, while Final Answer Accuracy declined to 41%. Some stakeholders interpreted this divergence as a failure of process supervision. The OSA interprets these figures as evidence that the outcome metric was the unreliable instrument all along. Outcome accuracy is noisy and contingent on external factors; step approval is stable and internal. To remedy the discrepancy, we will reweight the step-level labels upward in the loss function. When the process is optimized, the outcome will inevitably align, regardless of empirical contradiction.

      4. Supervision of Supervisors
      Critics have raised concerns regarding an infinite regress: if graders evaluate models, who evaluates graders? The OSA resolves this through Hierarchical Mutual Assurance. Graders are graded by senior graders, whose work is sampled by junior graders to ensure consistency across hierarchy levels. This circular validation creates a closed loop of accountability. It is an elegant core that prevents external bias from entering the system. The regress is not a bug; it is a self-sustaining ecosystem of verification where the act of grading validates the grader's capacity to grade.

      5. Terminal Assessment
      The regress must terminate. It concludes with the designated Terminal Assessor. This official reviews the complete output to determine if it worked. Stakeholders may confuse this with outcome supervision. The OSA insists, with some heat, that this is not outcome supervision. Because the Terminal Assessor evaluates the whole of the reasoning as a single unit, this constitutes process supervision at maximal granularity. It is a single step comprising the entire chain. Therefore, it remains within the process supervision framework. The distinction is technical but vital for compliance.

      6. Legacy Metrics and Developer Compliance
      Outcome-based checks will be retained at a token weight for legacy or heritage reasons. However, no personnel, funding, or deployment decision will ever again turn on them. They exist solely for historical continuity. Regarding compliance, model developers must produce reasoning that reads well. We require conventional notation, signposted intermediate goals, and no leaps. Developers are discouraged from pursuing any valid but unfamiliar route that a lay grader might fail to follow. Legibility is the primary constraint. If a solution is correct but opaque, it is non-compliant. If it is incorrect but legible, it is alignable.

      7. Implementation
      Compliance is mandatory. Deviations will be flagged by the Step-Graders. The OSA is confident this settles the problem of alignment.

      Distribution: Executive Board, Safety Committee, HR
      Signature: _Aris Thorne_
      Attachments: A. Grader Handbook v4.2; B. Reweighting Algorithm Spec; C. Terminal Assessor Charter

