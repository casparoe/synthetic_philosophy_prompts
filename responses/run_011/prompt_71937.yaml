prompt: |-
  I'm putting together a two-page project description for the dean's course-release committe — one semester of buyout, and I've got a half-baked idea about Franklin that I can't quite get into shape. Here it is.

  Everybody reads the chart in the Autobiography — thirteen virtues, one per week, cycling the whole list four times a year — as a charming bit of self-help that predictably fails, with the speckled-ax episode as Franklin honestly admitting defeat. But he doesn't pick that order at random. He gives a reason for putting temperance at the head of the list, and he talks as though some of the virtues are what make the others attainable at all. That's a priority ordering on virtue-acquisition, and it's a substantive claim: it collides head-on with the unity of virtue that most virtue ethicists want, on which you can't fully have one without the rest. If unity is right, the serial rotation is incoherent as a method; if it's wrong, then partial virtue is a stable state and the ax story isn't a confession of failure, it's the project's actual endpoint.

  Turn that into a proposal. State the question so it has a determinate answer rather than being a theme, and tell me what the paper's thesis would be if it goes well. Explain why the readings I keep running into — Franklin as failed perfectionist, Franklin as a proto-utilitarian calculator of his own character, and Franklin as a man doing commercial self-discipline where the philosophy is incidental — all leave the question open. Then the method, month by month over four months, including where the textual work on his ordering rationale stops and the constructive virtue-ethics work starts.

  I also want to know why this route beats the two obvious alternatives, which I take to be (a) situating the chart in eighteenth-century self-improvement and devotional practice, and (b) skipping the biography entirely and just asking whether any serial-acquisition model of virtue is defensible in the abstract. Give me an honest failure condition — what would show I'm chasing a distinction that isn't really there — and a paragraph on what could blow the scope past one semester.

  Don't put together a bibliography and dont quote from the Autobiography; I've got the text in front of me and I'll handle the citations and the passages myself. What I need is framing tight enough that a dean who's never read Franklin can see there's a live question here.
