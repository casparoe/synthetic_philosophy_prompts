answer: |-
  This is an excellent question that cuts to the heart of David Lewis's "A Subjectivist's Guide to Objective Chance." The tension you feel is shared by many students of metaphysics, but it arises largely from conflating two different epistemic tasks: **inferring the chance** versus **applying the chance**.

  To answer your specific question: **Your first worry depends on a misreading of the Principle's logical scope.** Your second worry is a deeper epistemological concern, but it does not refute the Principle itself; rather, it highlights the difficulty of satisfying the Principle's antecedent conditions in the real world.

  Here is the breakdown of why the first worry is a misreading and how the Principal Principle (PP) is intended to function.

  ### 1. The Principal Principle Stated
  First, let's be precise about the formula. Lewis formts the Principal Principle roughly as:

  $$C(A \mid X \land E) = x$$

  Where:
  *   $C$ is your rational credence function.
  *   $A$ is the proposition (e.g., "The next toss is Heads").
  *   $X$ is the proposition that the objective chance of $A$ is $x$ (e.g., "The chance of Heads is 0.5").
  *   $E$ is any **admissible** evidence.

  The crucial operator here is the conditional bar ($\mid$). The PP tells you what your credence should be **given that you already know $X$**.

  ### 2. Resolving Worry 1: The "20 Heads" Scenario
  Your first worry is: *If past outcomes are admissible, PP requires me to believe the next toss is 0.5 even after 20 heads. But surely 20 heads suggests the coin is biased.*

  This worry relies on a misreading of **admissibility** and the **conditional nature** of the principle.

  **The Misreading:**
  You are treating the scenario as if you are uncertain about the chance, while simultaneously applying the PP as if you are certain.
  *   **Scenario A (Uncertain Chance):** In the real world, you do not *know* with metaphysical certainty that the chance is 0.5. You have a hypothesis. When you see 20 heads, you update your credence in the hypothesis $X$ ("Chance = 0.5"). You lower your belief in $X$ and raise your belief in $X'$ ("Chance = 0.9"). In this scenario, the PP does not apply directly to your total evidence, because you are not conditioning on a fixed $X$. You are doing inductive inference *about* the chance.
  *   **Scenario B (Known Chance):** The PP applies only when you are conditioning on $X$ being true. If you *know* (for the sake of the conditional) that the objective chance is 0.5, then the 20 heads **cannot** be evidence that the coin is biased. By stipulation, the chance *is* 0.5. Therefore, the 20 heads must be interpreted as a rare statistical fluctuation.

  **The Role of Admissibility:**
  Lewis defines evidence as "admissible" if it gives you no information about the future *except* via information about the chances.
  *   If you fix $X$ (Chance = 0.5) in your conditioning information, the history of 20 heads is admissible. It tells you nothing about the next toss other than what $X$ already tells you.
  *   If you do *not* fix $X$, the history of 20 heads is **inadmissible** relative to your chance hypotheses, because it informs you about which chance hypothesis is true.

  **Conclusion on Worry 1:**
  The PP does not forbid you from suspecting the coin is biased after 20 heads. It forbids you from suspecting the coin is biased **while simultaneously assuming the chance is 0.5**. The absurdity you feel arises from trying to hold both attitudes at once. The PP governs the latter attitude; inductive reasoning governs the former.

  ### 3. Resolving Worry 2: The "Overriding" Scenario
  Your second worry is: *If frequencies override chance, we never know the chance, making PP vacuous.*

  This is not a misreading of the logic, but a confusion about the **epistemology of chance**.

  **The Normative vs. The Descriptive:**
  The PP is a normative constraint on rational belief. It says: *If* you know the chance, *then* your credence must match it. It is not a recipe for *finding* the chance.
  *   **How we find chances:** We use inductive reasoning (frequencies, physical theories, etc.). This is where observed frequencies "override" our initial guesses about the chance.
  *   **How we use chances:** Once we have established (to our satisfaction) what the chance is, the PP says that chance "screens off" the frequencies for the purpose of predicting the *next* individual event.

  **Why PP is not vacuous:**
  The PP is not vacuous because we often have strong theoretical reasons to assign chances independent of immediate frequencies. For example, quantum mechanics assigns a chance of 0.5 to a spin measurement based on the wave function, not because we have tossed the particle 20 times.
  *   If we trust the theory, we set our credence to 0.5 (per PP).
  *   If we then see 20 "up" spins, we face a choice: Do we doubt the theory (update our belief about the chance) or doubt the data?
  *   The PP doesn't tell us which to do. It tells us that *if* we stick with the theory (maintain $X$), we must maintain credence 0.5. *If* we update the theory (reject $X$), the PP no longer binds us to 0.5.

  **The "Undermining" Issue (A Note for your Seminar):**
  Your second worry echoes a famous problem Lewis himself later acknowledged: the problem of **Undermining Futures**. If chances supervene on the total history of the world (Humean Supervenience), then a future sequence of outcomes could determine that the *present* chance was different than we thought. Lewis admitted this creates a tension with the PP. However, he argued (and many followers agree) that this affects only extreme metaphysical edge-cases, not ordinary inductive reasoning about coins. For practical purposes, we treat chances as stable enough for the PP to apply.

  ### Summary for your Seminar Contribution

  1.  **The Claim:** The Principal Principle claims that objective chance is the "guide to life." It is the bridge between how the world *is* (objective propensity/frequency) and how we *believe* (subjective credence). It asserts that once you know the chance, no other admissible information (like past frequency) should alter your credence in the next outcome.
  2.  **The Misreading:** Your **first worry** depends on a misreading. It assumes the PP applies when you are uncertain about the chance. The PP only applies conditional on knowing the chance. If 20 heads makes you doubt the chance, you have exited the scope of the PP's antecedent ($X$) and are now doing inductive inference *about* $X$.
  3.  **The Valid Concern:** Your **second worry** identifies the difficulty of ever satisfying the antecedent ($X$). However, this does not make the principle vacuous; it just means the PP is an ideal norm. We use frequencies to estimate $X$, and once we accept an estimate for $X$, the PP demands we let $X$ dictate our single-case credences, ignoring the "noise" of small-sample frequencies.

  **In short:** The PP protects you from the Gambler's Fallacy (thinking a tail is "due" after 20 heads *given a fair coin*). It does not protect you from the possibility that the coin isn't fair. Distinguishing between "updating belief in the outcome" and "updating belief in the chance" dissolves the tension.
