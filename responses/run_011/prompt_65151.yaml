prompt: |-
  I'm in a seminar on the metaphysics of probability, and I'm struggling to see how Lewis's Principal Principle is supposed to coexist with ordinary inductive reasoning. Two things seem to pull in opposite directions. First, if the past outcomes of a chance process count as admissible evidence, then the Principle appears to require that I give credence 0.5 to heads on the next toss of a coin whose chance of heads is 0.5 even after watching it come up heads twenty times in a row, which strikes me as absurd: surely that run of heads is powerful evidence that the coin isn't fair after all. But second, if the Principle instead implies that observed frequencies should override what I take to be my knowledge of the chance, then it looks as though I could never have known the chance in the first place, and the Principle would only ever bind in circumstances that never actually arise. Could you explain what claim the Principle is really making, and say which of my two worries depends on a misreading of it?
reasoning: |-
  Here's a thinking process that leads to the suggested explanation:

  1.  **Analyze the User's Problem:**
      *   **Context:** Seminar on metaphysics of probability.
      *   **Core Issue:** Tension between Lewis's Principal Principle (PP) and ordinary inductive reasoning.
      *   **Worry 1:** If past outcomes are "admissible," PP seems to force credence 0.5 for a fair coin even after 20 heads. This ignores the possibility that the coin *isn't* fair (undermining the hypothesis that chance = 0.5).
      *   **Worry 2:** If observed frequencies override known chance, then we never really "know" the chance, making PP vacuous or rarely applicable.
      *   **Goal:** Explain the actual claim of PP and identify which worry stems from a misreading.

  2.  **Deconstruct the Principal Principle (PP):**
      *   *Formula:* $C(A | X \land E) = x$
      *   *Where:*
          *   $C$ is initial credence function.
          *   $A$ is a proposition (e.g., "Next toss is Heads").
          *   $X$ is the proposition that the chance of $A$ is $x$ (e.g., "Chance(Heads) = 0.5").
          *   $E$ is "admissible" evidence.
      *   *Key Concept:* Admissibility. This is the crux of the user's confusion.

  3.  **Address Worry 1 (The "20 Heads" Scenario):**
      *   *User's intuition:* 20 heads suggests the coin is biased. So credence should shift away from 0.5.
      *   *PP's implication:* If I *know* the chance is 0.5 ($X$), and I have admissible evidence ($E$), my credence must be 0.5.
      *   *The Conflict:* Is the sequence of 20 heads admissible evidence *given* that I know the chance is 0.5?
      *   *Lewis's Definition of Admissibility:* Evidence is admissible if it doesn't give information about the *future* except via information about the *chances*.
      *   *Crucial Distinction:* The PP applies *conditional on knowing the chance*. If I truly know $X$ (Chance = 0.5), then the 20 heads *must* be treated as a rare fluctuation, not evidence against $X$.
      *   *The Misreading:* The user is mixing up *uncertainty about the chance* with *certainty about the chance*. In the 20 heads case, the user is implicitly doubting $X$. But PP says: *If* you are certain $X$ is true, *then* ignore the frequency.
      *   *Resolution:* Worry 1 depends on a misreading of the conditional nature of PP. It applies when $X$ is fixed in the conditioning information. If the 20 heads makes you doubt $X$, then you are no longer in the scope of $C(\cdot | X \land E)$. You are in $C(\cdot | E)$ where $X$ is uncertain.

  4.  **Address Worry 2 (The "Overriding" Scenario):**
      *   *User's intuition:* If frequencies override chance, we never know chance.
      *   *PP's implication:* PP doesn't say frequencies override chance. It says chance *constrains* credence *given* admissible evidence.
      *   *Epistemology of Chance:* How do we know $X$? Usually via theory (physics of the coin) or long-run frequency (Humean supervenience).
      *   *The Conflict:* If I see 20 heads, do I update my belief about the *outcome* or the *chance*?
      *   *Resolution:* PP is a norm for *ideal* agents who know the chances. In reality, we infer chances. Worry 2 confuses the *application* of PP (presupposing knowledge of chance) with the *inference* of chance (where frequency matters). PP doesn't say frequency overrides chance; it says if you know the chance, that trumps frequency *for predicting the next outcome*. But frequency is how you *find* the chance in the first place.
      *   *Wait, is Worry 2 a misreading?* It's more of a worry about the *applicability* of PP rather than a misreading of its logic. However, the prompt asks which worry depends on a misreading. Worry 1 is the stronger candidate for a direct misreading of the logical structure (conditionalization). Worry 2 is a deeper metaphysical worry about Humean Supervenience (which Lewis himself wrestled with in "A Subjectivist's Guide to Objective Chance" and the postscript).
      *   *Refinement:* Actually, Worry 1 is the classic "Gambler's Fallacy" vs. "Inductive Inference" confusion. The PP blocks the Gambler's Fallacy *if* you know the chance. It does not block inductive inference *about* the chance.
      *   *Worry 2 analysis:* If PP implies frequencies override chance, that's false. PP says Chance overrides Frequency (regarding credence in single events). So Worry 2 is based on a false premise about what PP implies. But the user says "if the Principle *instead implies*..." suggesting they see a dilemma.
      *   *Better angle:* Worry 1 assumes past outcomes are *always* admissible. Lewis says they are admissible *only if* they don't inform you about the chance. If you don't know the chance, they aren't fully admissible relative to your actual state. But relative to the hypothesis $X$, they are admissible.
      *   *Decision:* Worry 1 is the primary misreading. It conflates *conditionalizing on the chance being 0.5* with *being uncertain about the chance*. Worry 2 is a valid concern about the epistemology of chance (the "Bug" in Humean Supervenience), but less about the logical function of PP itself. I should focus on clarifying Worry 1 as the misreading, while acknowledging Worry 2 touches on the "Undermining Future" problem which Lewis later addressed.

  5.  **Drafting the Explanation:**
      *   **Introduction:** Acknowledge the depth of the question. It's a classic tension.
      *   **State the PP clearly:** $C(A | X \land E) = x$. Emphasize the conditioning on $X$ (the proposition that the chance is $x$).
      *   **Address Worry 1 (The 20 Heads):**
          *   This is the "Gambler's Fallacy" vs. "Induction" mix-up.
          *   PP applies *given* you know the chance is 0.5.
          *   If you know the chance is 0.5, 20 heads is just unlikely luck. It provides no info about the *next* toss *except* through the chance.
          *   If 20 heads makes you think the coin is biased, you are no longer certain $X$ is true. You are weighing $X$ against $X'$ (Chance = 0.9).
          *   PP doesn't tell you how to update belief in $X$. It tells you how to set credence *if* $X$ is fixed.
          *   *Verdict:* This worry relies on misreading the conditional scope.
      *   **Address Worry 2 (Overriding/Epistemology):**
          *   This touches on how we *learn* chances.
          *   PP is a norm for belief *given* knowledge of chance. It's not a recipe for finding chances.
          *   We use frequencies to estimate chances (inference to best explanation, etc.). Once estimated, PP kicks in.
          *   Mention Lewis's "Undermining Futures" (Humean Supervenience issue) briefly to show sophistication, but keep it distinct from the user's Worry 2. The user's Worry 2 is about whether we *ever* know chances.
          *   *Verdict:* This worry confuses the *normative role* of PP with the *epistemic route* to chance.
      *   **Synthesis:** The PP bridges objective chance and subjective credence. It says chance *captures* all the predictive info in the history.
      *   **Conclusion:** Worry 1 is the misreading. Worry 2 is a separate epistemological issue, but PP doesn't claim frequencies override chances; it claims chances screen off frequencies.

  6.  **Refining the "Admissibility" Point:**
      *   This is the technical hinge.
      *   Lewis: Information is admissible if it is "historical" (about the past) and does not give information about the future *except* via the chances.
      *   In the 20 heads case: Is the history admissible?
      *   If I *know* the chance is 0.5, the history is admissible. It doesn't change the chance.
      *   If I *don't know* the chance, the history is *inadmissible* relative to my uncertainty because it informs me about the chance.
      *   So, strictly speaking, in the real world where I don't know the chance with certainty, the 20 heads is inadmissible evidence relative to my *hypotheses* about chance.
      *   But PP is formulated for an agent who conditions on $X$.
      *   I need to make sure I explain that the user's Worry 1 treats the 20 heads as admissible evidence *while simultaneously* letting it update the chance. That's the contradiction. You can't have it both ways in the scope of the PP.

  7.  **Final Polish:**
      *   Tone: Academic but accessible (seminar context).
      *   Structure: Clear headings or bullet points.
      *   Key takeaway: PP is a constraint on credence *given* chance, not a method for inferring chance.

      *(Self-Correction during drafting)*: I should be careful not to dismiss Worry 2 entirely. Lewis himself worried about "undermining futures" (where the future history determines the chances, which contradicts the current chance assignment). This is related to Worry 2 but distinct. Worry 2 as stated by the user is more about *inductive inference undermining current chance knowledge*. I should clarify that PP assumes we *have* the chance. How we got it is separate.

      *Revised plan for Worry 2:* Explain that PP is a synchronic norm. It doesn't dictate how we learn $X$. We learn $X$ via induction (frequencies). Once we have $X$, PP says $X$ trumps further frequency data *for the purpose of predicting the next outcome*. So Worry 2 is based on a category error between *learning* chances and *using* chances.

      *Final check on Worry 1:* The user says "if past outcomes... count as admissible evidence." Lewis says past outcomes *are* paradigmatically admissible *provided* they don't inform you about the chance. If you know the chance, they don't inform you about the chance. If you don't know the chance, they do. So the admissibility is relative to the information state regarding $X$. The misreading is assuming admissibility is intrinsic to the evidence rather than relative to the conditioning proposition $X$.

