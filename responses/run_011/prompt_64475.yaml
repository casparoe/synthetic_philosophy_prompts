  **MEMORANDUM**

  **TO:** The Prize Jury
  **FROM:** [Your Name]
  **DATE:** Monday
  **SUBJECT:** Recommendation for Final Vote

  Colleagues,

  We are deadlocked because we are asking two different questions. Half of us are asking, "Which book better accounts for the material legacy of the Raj?" The other half are asking, "Which book better accounts for the human cost of empire?" These are not the same inquiry. They are different forms of history. Book A offers a ledger; Book B offers an indictment. Since the deed forbids splitting the prize, and withholding the award would be a cowardly refusal to do the work we were appointed to do, I recommend we award the prize to **Book B**.

  Here is the reasoning, structured for our Thursday vote.

  **1. The Foundation and "Even-Handedness"**
  The program officer's emails regarding "even-handedness" are noted. However, neutrality is not even-handedness. Even-handedness means fairness to the historical record. If the record shows that a "balance sheet" approach inherently obscures more than it reveals, then awarding the balance sheet is the true act of bias. We should reply to the foundation that we interpreted "even-handedness" as fidelity to the complexity of the past, not neutrality between oppressor and oppressed. The prize exists to advance understanding, not to comfort trustees.

  **2. The Moral Coherence of the Ledger**
  We must answer the question underneath our deadlock: Is netting costs against benefits across a century of rule a coherent moral operation? The answer is no. You cannot trade famine mortality against railway mileage unless you assume human lives and infrastructure are convertible currencies. They are not. For this operation to be coherent, you would need a universal metric of value that applies equally to a dead peasant and a functioning civil service. No such metric exists. Book A attempts this conversion; Book B correctly identifies the attempt itself as the error. Book B advances public understanding by teaching the reader *how* to look at empire, not just *what* to count.

  **3. Weighing the Blemishes**
  Both books have factual flaws, but they are different kinds of lies.
  Book A's error is methodological concealment. The author switches baselines mid-argument to improve the balance sheet. This is a rigor failure that the author knows about and has not corrected. It violates the contract of economic history, which promises accuracy in exchange for authority.
  Book B's error is rhetorical inflation. The death toll is exaggerated for cadence. This is a sin of passion, not concealment. It violates the contract of narrative history, but it does not hide its methodology.
  In a prize for public understanding, a hidden mathematical error is more dangerous than a visible rhetorical flourish. One corrupts the tool; the other sharpens the blade.

  **4. The Case for Book A**
  To my colleagues championing Book A: Your argument is that modern states are built on machinery, not just morality. You believe that ignoring the institutional inheritance—the railways, the law, the administration—leaves us unable to explain why modern India functions as it does. You argue that Book B's moral clarity comes at the cost of material explanation, and that without Book A's ledger, we cannot understand the post-colonial state. This is a vital point. History is not only what was felt; it is what was built. If we reject Book A entirely, we risk replacing one myth with another.

  **5. Operationalizing "Advances Public Understanding"**
  For future juries, we need a standard that does not collapse into "the book I already agreed with." I propose this definition: *A book advances public understanding if it changes the questions the reader asks, not just the answers they hold.* Book A confirms the question "Was empire profitable?" Book B changes the question to "Was empire legitimate?" The latter is a deeper historical intervention.

  **Recommendation**
  Vote for Book B. It aligns with the prize's mandate to advance understanding by challenging the framework of the debate rather than merely entering data into a flawed system. Its blemish is human; Book A's is structural. Let us award the book that tells the truth about how history is written, even when it shouts.

  I look forward to resolving this Thursday.
