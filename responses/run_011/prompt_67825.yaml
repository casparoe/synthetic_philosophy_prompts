  Subject: Protocol for Clarifying Probability Claims in Risk Assessments

  Dear colleagues,

  Following our recent discussions regarding the tailings dam assessment, I have drafted a standardized procedure to clarify what the risk numbers submitted to us actually mean, because our current disagreements stem from conflating three distinct definitions of probability. First, we must require the submitter to declare explicitly whether the submitted number represents a long-run frequency, a physical propensity, or a subjective degree of belief, and if they answer that they have not thought about it, which is the common honest answer in engineering consultancy, we must default to classifying the number as a subjective degree of belief aggregated from experts and remove any claim of objectivity from the record. Once the interpretation is fixed, we evaluate the justification, noting that the step where we decide if a reference class is sufficiently similar looks procedural but is actually a judgement call that requires us to assess geological and engineering similarity rather than just counting data points, and we must flag this specific moment in the review as a judgement call in disguise rather than a mechanical check. For a frequency claim, we license ourselves to expect the failure rate to converge over many similar instances, but we forbid claiming the specific instance is protected because the law of large numbers does not apply to a single dam. For a propensity claim, we license causal reasoning about the physical setup but forbid using the number for betting odds unless the propensity is quantified via frequency. For a degree of belief, we license using the number for decision analysis under uncertainty but forbid sanctioning the firm if the event does not occur, because a low probability event not happening is consistent with the assessment. We must also recognize where this apparatus gives out, specifically in genuinely one-off events with no sensible reference class, in which case we should send the thing back rather than argue over a false precision. Applying this to the dam figure of 3 × 10⁻⁴ derived from elicited opinions, we see the consultant claimed objectivity without a frequency base or physical propensity model, so we must reject the claim that the number is objective and treat it as a consolidated expert opinion that cannot be falsified by a single forty-year outcome, meaning the colleague who argued for sanctions based on non-failure was wrong about falsification but right to challenge the objectivity. Applying this to the valve model with a documented failure record across a hundred plants, we see a valid frequency claim where the reference class is clear, so we accept the number as a statistical expectation while acknowledging that judgement was still required to deem those hundred plants sufficiently similar to our case. You may not like that the dam number loses its objective status, but that is the cost of philosophical coherence, and I propose we adopt this questionnaire for all future submissions to prevent us from arguing past one another.

  Regards

  [Your Name]
