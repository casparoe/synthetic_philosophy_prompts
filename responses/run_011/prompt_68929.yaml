  **The Scenario**
  In the Six Sisters Valley, six family farms sit in a cascade along a slow-draining peat bog. The peat is stable as long as the water table stays above two meters; below that, it oxidizes and subsides, turning fertile land into barren dust over the course of a year. Each farm can install a high-efficiency concrete drain to lower the water table on their own plot by thirty centimeters, immediately converting marginal pasture into high-yield cropland. The first five drains lower the table safely to 2.5 meters. However, the sixth farm sits at the basin's lowest point; if the upstream five drain, the water rushes downhill, threatening to flood Farm Six's homestead unless they install a powerful pump. This pump lowers the table the final thirty centimeters to 2.2 meters, saving the home from immediate flooding but crossing the critical two-meter threshold for the entire valley. The subsidence damage takes twelve months to manifest, but the flood risk is immediate. All farmers know these physics exactly, trust each other completely, and can sign any binding contract they wish.

  **The Demonstration**
  *Step 1 (Farm One):* Farm One installs a drain. Their yield doubles. The water table drops to 4.7 meters (safe). Farms 2-6 see no change in their water levels yet due to soil absorption lag. **Pareto:** Farm One gains; others neutral.
  *Step 2-5 (Farms Two to Five):* Each installs a drain sequentially. Each gains high-yield land. The cumulative table drops to 2.5 meters. The peat remains stable. The downstream rush of water increases, but Farm Six's natural capacity handles it *for now*. **Pareto:** Signatory gains; others neutral (Farm Six is not yet flooded).
  *Step 6 (Farm Six):* The accumulated runoff from 1-5 now exceeds Farm Six's natural capacity. They face immediate structural flooding of their basement. They sign a deal to install the high-power pump. This drops the table to 2.2 meters. **Pareto at Signing:** Farm Six avoids immediate flood disaster (huge gain). Farms 1-5 avoid the backlash of a flooded neighbor (which would ruin their own drainage outflow), so they gain security. The peat has not subsided *yet*; the land is currently fertile and dry. Everyone is better off *at this moment* than if the pump were not installed.
  *The Endpoint:* Twelve months later, the peat oxidizes. The ground collapses across all six farms. Drainage fails, foundations crack, and yields drop to zero. Every farmer is physically worse off than at the Start (stable bog, moderate yield).

  **The Blocking Analysis**
  *At Step 1:* Could the group have blocked Farm One? Yes, a "No-Drain Pact" yields the stable Start state. But for Farm One, the immediate gain of draining (doubling yield) outweighs their share of the *future* collapse cost, discounted by time. Since they value present crops more than soil twenty years hence, Farm One defects. The others cannot bribe Farm One enough to forgo the gain without paying more than the future collapse is worth to them *today*.
  *At Step 5:* Could the group block Farm Six? To stop Farm Six, Farms 1-5 must compensate Farm Six for *not* pumping. But Farm Six faces *immediate* flooding if they don't pump. The utility loss of a flooded home is catastrophic and immediate, outweighing the future loss of barren land. Farms 1-5 cannot pay Farm Six enough to accept a flooded basement to save next year's soil. Thus, no subset can profitably block the deal *at that moment*.
  *At Step 6:* It is too late; the deal is signed.

  **The Honest Bits**
  The single feature doing the work is **Time-Inconsistent Preferences locked by Physical Irreversibility.** The trap relies on the fact that the *benefits* are immediate (crops, flood safety) while the *costs* are delayed (subsidence), combined with the fact that you cannot "un-drain" concrete ditches. If you remove the **Threshold/Latency** and make the effects smoothly additive (e.g., every drain lowers yield by 1% immediately), the farmers would stop at Step 3 where marginal cost equals marginal benefit. It would become a standard optimization problem, not a trap. The "Moloch" element is that the system rewards the *sequence* of rational choices even though the *sum* is destructive.

  **The Friend's Attack**
  Your mate will argue: "This isn't Moloch; it's just that they valued the option to farm *now* higher than the option to farm *later*. They traded a long-term asset for short-term cash. That's a valuation error, not a trap. If they truly valued the future, they wouldn't have signed Deal 1."
  *Is he right?* Partially. He is right that **Discounting** is the engine. If their discount rate were zero, they would have pacted at Start. But he is wrong that it's a "contracting failure." They *could* contract, but no contract can force them to value the future more than the present. The trap is that the *physics* (irreversible drainage) converts a standard time-preference decision into a permanent ruin. It's not that lawyers were too expensive; it's that the *deal itself* consumed the collateral required to enforce the long-term interest.

  **The Verdict on "Moloch"**
  This deserves the Moloch label, but it is a specific subspecies: **The Lock-In Trap.** It is not a "Race to the Bottom" (no one is racing for first place; Farm One doesn't care if Farm Two drains). It is not a standard Prisoner's Dilemma (because the deals are sequential and Pareto-positive at every step). It belongs to the family of **Path-Dependent Catastrophes**, where local rationality + irreversibility + latency = global ruin. Your mate calls it "contracting failure" because he assumes contracts can solve *incentive* problems. This case shows contracts cannot solve *structural* problems where the incentive to sign the next deal is created by the physical reality of the last one. Moloch isn't just bad lawyers; it's when the structure of the world makes the right deal the wrong choice.
