prompt: |-
  Writing the setup chapter of my dissertation on dream experience, and before I start scoring Malcolm against Dennett I want to pin down what I'm actually allowed to demand of a theory. So: give me the desiderata. What does any account of whether dreaming involves having experiences have to deliver — which phenomena it owes an explanation of (the reports and their notorious unreliability, the sense of duration and of being immersed in a world rather than merely thinking about one, the fear in a nightmare, the fact that nothing outside ever corroborates any of it), which distinctions it can't collapse (ongoing process during sleep vs. narrative assembled at waking; having an experience vs. being disposed to report one), and which empirical results it has to stay consistant with — e.g. the pre-arranged eye signals coming out of verified REM, or the correlation between eye-movement patterns and what gets reported. Motivate each entry with the case that generates it, and tell me which ones are genuinely load-bearing versus which are just one camp's prejudices dressed up as requirements. Especially: is Malcolm's point that you can't be wrong about having dreamt compatable with also demanding an account of the temporally extended character of the experience, or does one of those have to go? If some subset turns out to be jointly unsatisfiable, say so — that's the bit I most want. And which single desideratum knocks out the most positions. Assume the reader already knows the debate; don't summarise it, don't send me to sources.
