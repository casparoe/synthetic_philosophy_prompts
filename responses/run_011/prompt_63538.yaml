      *   Flag theoretical splits? (Yes, explicitly state where theorists diverge).

  6.  **Final Polish:** Check tone. Needs to be academic, precise, suitable for a Master's thesis draft assistance. Avoid being overly prescriptive; present the logical landscape. (Self-Correction: Ensure I don't solve the problem for them, but explain the *structure* of the problem so they can solve it in the thesis).

      *   *Key distinction to sharpen:* The difference between "The act is wrong" (moral quality) and "The agent is blameworthy" (liability).
