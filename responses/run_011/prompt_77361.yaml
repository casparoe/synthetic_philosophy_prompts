answer: |-
  Before settling on an argumentative structure, I must clear the ground of conceptual debris. The temptation is to map methodological individualism onto the depositors and holism onto the "market panic." This is a category error. An aggregate of fleeing depositors is not a collective agent; it is a statistical outcome. Similarly, the existence of population-level descriptions—such as "contagion rates" or "withdrawal velocity"—does not entail ontological holism. An individualist can model epidemic dynamics via micro-rules of infection (or information transmission) without positing a super-organism. The confused mapping lies in treating the *speed* of coordination as evidence of a *group mind*. Just because twenty-four hours sufficed for forty-two billion dollars to move does not mean a collective subject decided it. Conversely, treating the Federal Reserve as a "holistic" agent is equally suspect; it is a corporate agent with decision procedures, representational capacities, and continuity, fitting comfortably within a sophisticated individualist framework of institutional action. The genuine tension is not between "people" and "groups," but between explanations that terminate in individual belief-desire psychology and those that posit social facts that constrain individuals externally, independent of their private mental states. With these false leads discarded, we can map the agents and test the frameworks.

  Who are the agents here? The individual depositor is the paradigmatic agent: they hold beliefs about solvency, desires for liquidity, and the capacity to execute withdrawals. The venture capital firm is a corporate agent; it issues instructions to portfolio companies, satisfying List and Pettit's conditions for group agency (representation, decision procedure, continuity). The group chats, however, fail the test. A two-day-old WhatsApp thread has no mechanism to sanction defectors, no memory beyond the log, and no decision procedure to form a collective intention. It is a channel, not an agent. The bank itself is a corporate agent, but in this episode, it is the patient of the run, not the primary actor. The regulators (Fed, FDIC, Treasury) act jointly, but through established institutional protocols. "The market" is a metaphor for the aggregate outcome, not an agent. The crucial philosophical question is whether the *run itself* constitutes a social fact that exerts causal power distinct from the sum of individual withdrawals.

  The strongest individualist account leans heavily on the Diamond-Dybvig framework honored in Stockholm. On this view, the run is a shift between Nash equilibria. Each depositor acts rationally conditional on their expectations of others. The explanatory heavy lifting is done by the incentive structure created by insurance limits. The fact that insured depositors largely stayed put while uninsured ones fled is the smoking gun for individualism: different payoff matrices produced different behaviors. If a "collective panic" were the driver, insurance status would matter less than the mood. Furthermore, the run ceased instantly upon the guarantee announcement. This supports the individualist claim that the underlying fundamentals (the bank's actual asset quality) mattered less than the change in the incentive structure. The contagion to subsequent banks is not a "virus" but an informational cascade: rational agents updated their priors about the fragility of similar balance sheets across the sector. This account captures the granularity of the event: why specific actors moved and others didn't, based on local constraints. It denies the need for any emergent social entity; the "run" is just a label for a synchronized set of individual rational choices.

  The holist reply, invoking Durkheim's marks of the social fact (externality and constraint), argues that the individualist account misses the coercive reality of the situation. First, consider reflexivity. The run was caused by the announcement of a capital raise, which signaled weakness, which caused withdrawals, which made the weakness real. This is a self-fulfilling expectation whose object is a social state, not a physical fact. The individual depositor was constrained not merely by their own belief, but by the *fact* of the run itself. Once the queue formed, the rational choice was dictated by the social reality of the line, regardless of private assessment of the bank's assets. The social fact exerted an external constraint: you could not choose to stay without accepting a near-certain loss, a constraint created solely by the actions of others crystallized into an institution (the queue).

  Second, consider description. The accounts that best predicted the velocity of the collapse were network-based: contagion models, epidemic dynamics, centrality measures of venture capitalists. While an individualist can theoretically derive these from below, the predictive success of population-level variables suggests that the network structure is the relevant causal unit. The "group chat" was not an agent, but the *network topology* it revealed was a social fact that constrained individuals. A depositor's choice was not a function of their private utility alone, but of their position in a diffusion network they did not control and could not see in its entirety.

  Third, consider the institution. The invocation of the systemic risk exception was a holistic judgment. The regulators did not save SVB because SVB was solvent; they saved it because the *system* was entangled. The unit of survival was not the bank or the depositor, but the financial network. This decision changed the incentive structure precisely because it acknowledged a holistic reality: the failure of one node threatens the integrity of the web. The individualist must treat this as an exogenous shock to payoffs; the holist argues the "system" is an endogenous entity with its own preservation logic that overrides individual bank fundamentals.

  This brings us to the reflexive wrinkle. The Diamond-Dybvig model is not merely a description of the March events; it was a causal ingredient. The regulators intervened *because* they believed the theory that guarantees stop runs. The theory shaped the reality it described. This complicates the individualism/holism debate. The "individualist" model became a "holistic" intervention tool. When a social scientific theory becomes part of the mechanism it studies, the distinction between the observer's model and the agent's psychology collapses. The regulators acted as engineers of a social equilibrium, treating the depositor mass as a system to be stabilized rather than a collection of rights-holders to be judged.

  My verdict is that the episode favors neither side because the distinction, as traditionally drawn, cuts the case at the wrong joint. The debate usually turns on whether groups have minds or whether explanations must bottom out in psychology. SVB shows that the crucial divide is between *linear causal chains* and *reflexive systemic loops*. In linear chains, individualism suffices: I want money, I withdraw. In reflexive loops, the outcome (the run) alters the conditions of the action (solvency), rendering the micro-macro distinction porous. The "social fact" here is the theory-laden expectation itself. We should redraw the distinction not between individuals and wholes, but between *non-reflexive mechanisms* (where micro-reduction works) and *reflexive mechanisms* (where macro-variables like "confidence" or "systemic risk" are causally indispensable). A redrawn distinction predicts that in future runs, the speed of collapse will correlate less with fundamental asset quality and more with the degree to which market participants share a common theoretical model of runs (like Diamond-Dybvig) that coordinates their expectations.

  What evidence would count against this verdict? If it were shown that insured depositors ran in significant numbers despite the guarantee, or if the guarantee failed to stop the withdrawal queue, the equilibrium-shift account (and my reflexive modification) would fail. It would suggest that behavior was driven by non-rational herd instinct or that the "social fact" of panic overrides payoff structures entirely, favoring a stronger, perhaps psychological, holism. Conversely, if the subsequent bank failures were shown to be driven purely by unique, idiosyncratic fundamentals of those specific banks rather than sector-wide reassessment, the "contagion" aspect vanishes, and the individualist account stands unmodified.

  Finally, where is the debate silent? This ontological analysis says nothing about whether the guarantee was *good policy*. Establishing that the system acted reflexively does not tell us if moral hazard was created. Nor does it determine the blameworthiness of the CEO. One can accept that the run was a social fact constrained by network topology while maintaining that the executive was negligent in managing duration risk. The philosophy of social science clarifies the *mechanism* of the collapse, but it remains mute on the *ethics* of the rescue or the *justice* of the loss. To demand that the individualism/holism framework resolve normative questions is to ask it to do work it was never designed to perform. The run explains the how; it does not justify the why.
