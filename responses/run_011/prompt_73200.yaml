  *   **B. (The Body):** Has biological continuity but has undergone a character inversion (combative to frightened) and loss of explicit memory. Under Precedent 3 and Precedent 6 (Coma), the "person" B. is gone; the body is a vessel.
  *   **L. (The Student):** Has no biological continuity and lacks early memories, but possesses the character, temperament, and professional psychology of B. Under Precedent 1 and 2, she is the closer match to the "person" B. was.
  *   **The Conflict:** Since B. (body) is still alive, Precedent 5 (Fission) suggests "Neither is him." Ines will navigate this by using Precedent 7 (Rebirth/Chain). She will argue that identity is not a binary switch but a causal chain. The chain of *intention* and *professional self* has migrated to L. The chain of *biological maintenance* remains in the body.

  **Precedent doing the work:** **Precedent 3** (The Stroke Case). It establishes that *how* a change occurs (radical inversion) matters more than biological continuity. It licenses her to declare the man in the chair a "different man" or "no man," clearing the way for L. to inherit the mantle without violating the non-branching rule.

  ### 2. The Practical Question: The Notebooks

  **Verdict:** The notebooks go to **L.** The promise **does not bind the man in the chair**, but it **binds the chain of intention.**

  **Resolution of the Tension:**
  You noted the tension in Precedent 4 (Gradual Drift): "Same person" vs. "Wouldn't hold the twenty-year-old answerable." Ines separates *identity* from *responsibility*.
  *   **To the Son:** She will agree with his metaphysics. The man in the chair is not the promiser. You cannot bind a ghost. The biological entity has no obligation because the psychological agent who incurred it is extinct.
  *   **To the Daughter:** She will agree with her loyalty. The promise was an act of will by the *person* B. That will has not vanished; it has been instantiated in L.
  *   **The Synthesis:** Ines will argue that a promise is a causal seed. It was planted by B. (then), watered by L. (during mentorship), and is ready to fruit now. To give the notebooks to the university (the Son's wish) is to kill the seed. To give them to the body (the Daughter's wish) is to plant them in concrete. To give them to L. is to honor the *causal chain* (Precedent 7).

  ### 3. Candidate Rules (Fitting the Seven Precedents)

  Here are four rules that fit her track record, and where they diverge on your case.

  | Rule | Definition | Prediction on B./L. | Point of Divergence |
  | :--- | :--- | :--- | :--- |
  | **1. Strong Psychological Continuity (Parfit)** | Identity holds if there is sufficient overlap of memory, character, and intention. Non-branching is required. | **Neither.** Since B. (body) is alive, L. cannot be B. without branching. B. (body) is not B. (person) due to low connectedness. | Fails to solve the notebook problem cleanly. Requires a "survival" workaround. |
  | **2. Narrative Coherence** | Identity is the continuity of a lived story or character arc. Biology is secondary. | **L. is B.** She holds the narrative thread (scientific values, temperament). The body is a discarded chapter. | Conflicts with Precedent 5 (Fission). If two people hold the narrative, this rule breaks. |
  | **3. Biological Animalism** | Identity is the living human organism. | **B. (Body) is B.** L. is a stranger. | **Fails Precedent 1 & 6.** Ines already rejected this (Brain transplant = him; Coma = person gone). |
  | **4. Causal Chain (Ines/Buddhist)** | Identity is a useful label for a chain of conditioned phenomena. No "owner" required. | **L. is the Functional Heir.** "B." is a label we apply to wherever the causal density of his intentions is highest. | Distinguishes itself by allowing *moral responsibility* to detach from *labeling* (Precedent 4). |

  **Where they come apart:**
  Rules 1 and 4 diverge on **moral weight**. Parfit (Rule 1) says "Identity doesn't matter, Relation R matters." Ines (Rule 4) says "There is no one to matter." In your case, Parfit might hesitate to give L. the notebooks if it violates non-branching. Ines will not hesitate, because she isn't protecting an *identity*, she is nurturing a *chain*.

  ### 4. Parfit vs. Buddhism: Is *Anatta* Doing Work?

  **Verdict:** She is **90% Parfitian with a meditation cushion.** *Anatta* is doing very little heavy lifting that Reductionism doesn't already handle, *except* in one specific area: **The Rebirth Remark.**

  **The Analysis:**
  *   **Parfit:** "Personal identity is not what matters." He replaces identity with *psychological connectedness*. This explains Precedents 1, 2, 4, 5, and 6 perfectly.
  *   **Ines:** "There is no self to inherit a deed." This is *Anatta*.
  *   **The Difference:** Parfit retains the *convention* of the person for pragmatic reasons. Ines uses *Anatta* to dissolve the *anxiety* of the convention.
  *   **The Rebirth Remark:** "Neither the same nor another."
      *   **Parfit:** Would call this **Indeterminate Identity.** (Like the Ship of Theseus).
      *   **Ines:** Calls it **Empty of Essence.**
      *   **Does it survive?** If she is purely Parfitian, the rebirth remark is just a poetic way of saying "Indeterminate." However, *Anatta* adds the ethical permission in Precedent 4 (20yo not responsible for 90yo). Parfit justifies this via *degrees of connectedness*. Ines justifies it via *no-agent*.
      *   **Conclusion:** Practically, there is **no difference** in outcomes. Metaphysically, she is claiming a deeper ontological ground than Parfit. If you press her, she will likely retreat to Parfitian pragmatism. The "cushion" gives her confidence, not new data.

  ### 5. The Killer Case: "The Calculated Reset"

  To force her rules apart, you need a case where **Psychological Connectedness** (Parfit) diverges from **Causal Intention** (Buddhist/Ines). Her Precedent 3 (Stroke) relies on the change being *involuntary*. Her Precedent 7 (Chain) relies on *causality*.

  **Present this case next Tuesday:**

  > "A man knows he is going to be caught for a heinous crime. The punishment is severe. He voluntarily undergoes an experimental, legal procedure that induces total retrograde amnesia and a personality reset. He wakes up gentle, innocent, and with no memory of the crime or the planning. He is psychologically discontinuous (like your stroke victim) but the discontinuity was *intended* by the original agent to escape consequences.
  >
  > **Question:** Is the new man punishable? And is he the same person?"

  **Why this forces the choice:**

  1.  **If she says "Not Punishable / Different Person":** She is a **Parfitian**. Psychological connectedness is the only metric. The "chain of intention" is broken by the break in psychology.
  2.  **If she says "Punishable / Same Person":** She is a **Buddhist (Karmic)**. The *intention* to break the chain preserves the chain. Karma follows the volition, not just the memory.
  3.  **If she hedges:** She exposes the "internal slack" you suspect. She cannot simultaneously hold that character inversion creates a new person (Precedent 3) and that karmic chains bind across discontinuity (Precedent 7).

  **The Trap:**
  If she cites Precedent 3 (Stroke = Different Man), you ask: "What is the morally relevant difference between a stroke and a voluntary reset, other than the *intent* to escape?"
  *   If *intent* matters, she is not a pure Reductionist (Parfit).
  *   If *intent* doesn't matter, her Rebirth/Chain remark (Precedent 7) loses its moral weight.

  **Experimental Design Note:**
  This case isolates the variable of **Volition**. In all her previous cases, the changes were passive (accident, stroke, aging, coma, copying). This is the first case where the subject *engineers* their own discontinuity. It tests whether her "Chain" is physical/psychological or moral/karmic.

