answer: |-
  - **What the session has to install**
  The single load-bearing idea is that grammatical subjecthood does not entail logical subjecthood. Students must grasp that if "The F" functioned as a referring expression (a name), sentences containing empty descriptions would violate the Law of Excluded Middle or commit us to nonexistent entities; having grasped this, they must see that Russell's quantificational analysis is not a optional paraphrase but the actual logical structure of the proposition. Until they feel the fracture between surface grammar and logical form, the three-clause analysis will appear as mere symbolic translation rather than an ontological claim about what the world must contain for the sentence to be true.

  - **The order**
  1.  **The Crisis (0–20 mins):** Write "The King of France is bald" and "The King of France is not bald." Ask for truth values. If they say "neither," challenge them with bivalence; if they say "false," ask what object makes it false. *Why here:* You must break the referring model before offering the alternative; if they still think "The King" names an object (even a subsistent one), the quantifier analysis looks like obfuscation.
  2.  **The Diagnosis (20–35 mins):** Argue that because there is no object, "The King of France" cannot be the logical subject. Introduce the idea that the phrase disappears into the verb. *Why here:* This motivates the quantifier move; you cannot introduce $\exists x$ until they accept that the grammatical subject is not the logical subject.
  3.  **The Analysis (35–55 mins):** Write the three conjuncts (Existence, Uniqueness, Predication) using variables, not words. *Why here:* Now that the referring model is broken, the formula fills the vacuum; doing this earlier risks them treating the clauses as pragmatic additions to a referring core.
  4.  **The Payoff (55–80 mins):** Apply the analysis to "The King of France does not exist" (Negative Existentials) and "The F is not G" (Scope/Uniqueness). *Why here:* These demonstrate the theory's power to solve the initial crisis without ontological clutter; saving this for last ensures they see the utility of the formalism.

  - **The example**
  Keep "The King of France" strictly for the first 20 minutes to exploit its emptiness, then abandon it for the formal analysis. It carries the session because it is the only case where existence failure is uncontroversial; ordinary examples like "The book on the table" allow students to hide behind pragmatic uniqueness (there is one salient book), masking the semantic requirement. For the formal work, switch to "The even prime number" or schematic "The F." This prevents them from relying on contextual intuition to satisfy the uniqueness clause.

  The King of France earns its keep only as the battering ram against the referring model. Once you have established that treating it as a name leads to a truth-value gap or Meinongianism, it must be retired. If you keep using it for the quantifier breakdown, students will focus on the monarchy rather than the logic. The cost is losing a narrative thread, but the gain is preventing them from treating the analysis as specific to "empty" cases rather than all definite descriptions.

  You must not let the example carry pragmatic baggage. "The book on the table" is dangerous because students will argue uniqueness is satisfied by context. "The even prime number" forces semantic uniqueness. Use the King to break the name theory, use mathematics to build the quantifier theory.

  - **Misconceptions and where to head them off**
  *   **"It's just paraphrase"**: Head off at **Step 3**. When writing the formula, explicitly state: "This is not what the sentence means to the speaker; this is what the proposition *is*." If you don't draw this line, they will treat Russell as a translator rather than a metaphysician.
  *   **"Uniqueness is pragmatic"**: Head off at **Step 3** (Uniqueness clause). When they cite "The book on the table," counter with "The number between 2 and 4." Show that Russell requires absolute uniqueness, not contextual salience.
  *   **"It's about nonexistent objects"**: Head off at **Step 1**. When they raise this in the first 90 seconds, write "Meinong" on the board and circle it with a "NO." Tell them Russell's goal is specifically to avoid this.
  *   **"Neither true nor false"**: Head off at **Step 1**. If they suggest a truth-value gap, remind them this is a seminar on Russell, not Strawson. Insist on bivalence to force the Russellian move.

  - **The check**
  **Question:** "If I say 'The present King of France is bald,' according to Russell, what object am I talking about?"
  **Good Answer:** "None. You are asserting a general proposition about the world containing exactly one King of France who is bald. There is no logical subject." (This shows they understand the elimination of the referring term.)
  **Bad Answer:** "A nonexistent object," or "The concept of the King," or "Nothing, so the sentence is meaningless." (The first is Meinong, the second is Fregean, the third is Strawsonian/positivist. All indicate they missed the quantificational shift.)

  - **What I refuse to explain**
  *   **Primary vs. Secondary Occurrence (Scope distinctions):** Too technical for 80 minutes; it obscures the core ontological point.
  *   **Strawson's Critique:** Explicitly save this for Week 5; mixing the two theories now guarantees confusion about truth-value gaps.
  *   **Meinongian Ontology:** Dismiss it as the view Russell is destroying; do not grant it enough airtime to become a live option.

  - **The cut**
  I would cut the Identity Puzzle (e.g., "Scott is the author of Waverley"). You just covered Frege, so they know the puzzle; Russell's unique contribution is handling existence without ontological commitment, which is more vital for their grasp of reference than solving identity statements.
