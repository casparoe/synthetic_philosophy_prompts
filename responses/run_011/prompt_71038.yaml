answer: |-
  **Project Title:** Structured Imprecision: Dilation and Diachronic Coherence in Non-Vacuous Credal Sets

  **Research Question and Background**
  The contemporary dispute between imprecise Bayesians and their orthodox opponents has reached an impasse. Both camps argue almost exclusively over a canonical test case: the coin whose bias is unknown, or the urn whose composition is unspecified. In these instances, the imprecise state is maximally unstructured, containing every probability function on the relevant algebra. Consequently, the disagreement collapses into whether absent evidence licences maximal ambiguity. Standard objections are calibrated to this vacuity: that no learning occurs, that dilation renders conditioning perverse, that the agent is practically paralysed without a uniquely recommended action, and that the view is diachronically incoherent regarding reflection-style requirements.

  This project hypothesises that the productive question concerns the structure of the licensed credal set rather than its size. Robust Bayesian practice rarely employs vacuous sets; it utilises bounded-distrust neighbourhoods of a single nominal prior, such as epsilon-contamination families or sets fixed by moment constraints. Here, imprecision expresses limited distrust of a well-specified model rather than total ignorance. The research question is twofold. Technically: which classes of structured credal sets are dilation-free, and which dilate only under conditions statable in advance? Philosophically: which norms governing the relation between evidence and credal structure do those results support? This question admits a determinate answer via formal characterisation, rather than serving as an invitation to survey the field.

  Existing answers leave this open because neither camp addresses the structural variable. Orthodox critics demonstrate defects in vacuous sets to argue against imprecision generally. Imprecise proponents defend vacuous sets as the only honest representation of ignorance. Neither bears directly on whether structured imprecision—standard in statistical practice—avoids these defects. The debate currently assumes that if imprecision fails in the vacuous case, it fails everywhere. This project challenges that assumption by isolating structure as the independent variable.

  **Conceptual Framework**
  To ensure accessibility across the panel, three key concepts are defined below.
  *Dilation* occurs when an agent's credal set regarding a hypothesis becomes strictly less precise after receiving evidence, regardless of what that evidence says. It implies that learning systematically increases uncertainty.
  *Epsilon-contamination* defines a credal set as a mixture of a single nominal prior and a set of all possible priors, weighted by a parameter representing distrust. It models an agent who has a best guess but acknowledges potential model misspecification.
  *The reflection-style diachronic objection* argues that an agent's current credence should align with their expected future credence. If an imprecise Bayesian violates this, they are vulnerable to dynamic Dutch books, accepting sequences of bets guaranteed to lose.

  **Methodology and Timeline**
  The project proceeds over twelve months, integrating formal derivation with conceptual analysis using a concrete running example: a medical diagnostic test where the manufacturer-reported sensitivity and specificity are bounded but subject to non-trivial distrust. This avoids the sterile coin-flip case while retaining formal tractability.

  *Months 1–3:* I will formalise the diagnostic model using epsilon-contamination neighbourhoods around the manufacturer's nominal parameters. Concurrently, I will catalogue existing dilation proofs to identify reliance on vacuity. The deliverable is a formal specification of the 'structured ignorance' case.
  *Months 4–6:* I will attempt to derive necessary and sufficient conditions for dilation within these contamination families. Using the diagnostic example, I will test whether positive test results dilate uncertainty about disease status only when the result is improbable under the nominal prior. The goal is to prove whether dilation is a local artefact of surprising evidence rather than a general defect.
  *Months 7–9:* I will address diachronic coherence. I will examine whether structured sets satisfy reflection principles when the updating rule is generalised conditioning. Using the diagnostic case, I will determine if the agent can plan future testing strategies without violating coherence norms. Conceptual arguments will be developed to link these results to norms of rational trust in models.
  *Months 10–12:* I will synthesise the formal results into a philosophical argument regarding the norms of evidence. The final output will be a draft monograph chapter and two journal articles. The diagnostic example will be used throughout to illustrate the philosophical significance of the formal boundaries discovered.

  **Outcomes and Evaluation**
  A successful outcome is a characterisation theorem identifying a class of structured sets that avoids dilation except under specifiable conditions, supporting a norm that licences imprecision only when model distrust is quantifiable. Failure would consist in proving that even structured sets dilate universally or remain intractable. Of these negative results, discovering that objections survive under structured sets is worse. It implies imprecise Bayesianism is fundamentally flawed even in its most robust, statistically respectable form. Discovering that no interesting class is characterisable within the timeframe is merely a delay; discovering the view is incoherent even here undermines the entire research programme. However, negative results regarding the limits of dilation are still worth publishing, as they clarify the boundary conditions of robust inference.

  **The Precision Objection**
  The strongest objection to this enterprise is that if a nominal prior is available, the agent should simply be a precise Bayesian using that prior, rendering the neighbourhood representationally idle. Why model distrust if one acts on the best guess? The answer is that the nominal prior is known to be misspecified; the neighbourhood captures the risk of error. The cost, stated honestly, is that the imprecise Bayesian must concede decisional indeterminacy in edge cases where the neighbourhood spans different optimal actions. To give this answer, the imprecise Bayesian must accept that rationality sometimes forbids a unique choice, rejecting the orthodoxy that rational agents must always be ready to bet at specific odds. This is a significant concession, but one required to maintain fidelity to the evidence regarding model reliability.

  **Scope and Fallback**
  If the formal results prove harder than expected, the conceptual analysis of the diagnostic case will take precedence. Specifically, if general characterisation theorems for dilation-free sets are unattainable, I will cut the attempt to generalise beyond epsilon-contamination families. The fallback deliverable at twelve months will be a rigorous analysis of dilation conditions specifically within the diagnostic testing model, accompanied by a philosophical paper arguing that structured imprecision mitigates, even if it does not eliminate, standard objections. This ensures a substantive contribution regardless of the generality of the formal proofs.
