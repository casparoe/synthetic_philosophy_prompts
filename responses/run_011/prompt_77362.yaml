      *   *Crucial distinction:* The argument is a *reductio* of SCA. The colleague is treating it as a *reductio* of Dispositions. The user should refuse the inference from "SCA is false" to "Dispositions don't exist." That is Step (6).
      *   *However*, regarding the specific question about "possible finks to actual counterfactuals": The colleague claims in (5) that the CF is "not even weakly diagnostic." This is false. In the *actual* world (sans fink), the CF *is* true. The existence of a fink-world doesn't make the CF false in the non-fink world.
      *   *Recommendation:* Refuse (1) as the definition. Refuse (6) as the inference.

      *   *Refining the "Repaired Version":* Lewis's RCA ($x$ has $B$, if $S$ & $B$ retained $\rightarrow M$).
          *   Disposes of (3) (Finks remove $B$).
          *   Disposes of (4) (Mimics lack $B$).
