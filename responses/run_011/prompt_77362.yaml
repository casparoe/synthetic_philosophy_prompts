          *   *Laws:* Saves empiricism, costs robust modality. (7) is dead (they are regularities).

  8.  **Final Polish:** Ensure the distinction between the *analysis* of the concept and the *ontology* of the property is clear. The colleague commits the "Fallacy of the Perfect Analysis."

