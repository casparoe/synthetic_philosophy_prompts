          3.  **Genealogy:** Continuous deformation from canonical. Philosophically sound for variation, but hard for untrained annotators to visualize "continuous deformation."
          4.  **Recognition:** Competent reader identification. Pragmatic, aligns with HTR goals, but risks ignoring writer intent if the writing is truly ambiguous.
