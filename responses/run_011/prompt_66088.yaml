      *   *Rival-Relativity:* This is crucial. The question isn't "Is this an 'a'?" but "Is this more 'a' than 'o', 'u', 'd', etc.?"
      *   *Context:* Needs strict gating. If context is used, flag it. Isolated images need shape-only decisions.

