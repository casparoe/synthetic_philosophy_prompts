      *   *Cases:*
          1.  Isolated: Gap makes it rival 'u'. Reject or Escalate? If gap is small, maybe 'a'. Prompt says 1/5 x-height. That's significant. Likely Reject as 'u' or Escalate.
          2.  Context 'cat': Accept, but tag "Contextual".
          3.  Display 'A': Reject (it's a capital). Cost: Loss of graphic diversity, but protects case sensitivity.
      *   *Closing:* Ontology vs. Convention. Confidence ratings.

  8.  **Self-Correction/Refinement during drafting:**
      *   *Correction on Case 1:* A single-story 'a' often looks like an 'o' with a stem. If the top is open, it looks like 'u'. Rival set includes 'u'. If the gap is 1/5 x-height, that's quite open. A strict feature check might reject. But recognition might accept. I need to ensure the procedure handles this via the "Rival Relativity" rule. If it looks more like 'u' than 'a', reject.
      *   *Correction on Case 3:* The prompt says "I want display letterforms kept in the corpus." If my procedure rejects them, I must say so. I will design the procedure for *lowercase* 'a' (standard HTR task). If the client wants capitals mixed in, that's a schema change. I will treat the procedure as targeting the *grapheme class* typically associated with lowercase 'a' for the model. I will explicitly reject the Capital 'A' as a category error for a lowercase target, explaining the cost (model confusion).
      *   *Orthography Parameter:* I need to mention the "Single-Bowl Switch" in the procedure setup.
      *   *Escalation Cap:* 5%. The procedure must push workers to decide. "If unsure, choose the most likely rival" vs "Escalate". To keep escalation low, I need a "Tie-Breaker" rule. E.g., "If tied between 'a' and 'o', label 'a'." No, that increases false positives. Better: "If tied, Escalate." But cap is 5%. I need to force a decision. "If tied, Reject." (Conservative). Or "If tied, Label." (Aggressive). Given " contaminates a class permanently" vs "wastes money", False Positive is worse. So "If tied, Reject."
