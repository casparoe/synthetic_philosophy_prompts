answer: |-
  # Brainstorming Pass: Criteria Weighing

  **Candidate Criteria:**
  1.  **Function:** Intent/Usage.
  2.  **Feature:** Diagnostic shapes vs. rivals.
  3.  **Genealogy:** Structural continuity from canonical form.
  4.  **Recognition:** Reader identification rate.

  **Operationalization Decision:**
  I will operationalize **Feature** and **Recognition**. I will discard **Function** and **Genealogy**.

  **Reasoning:**
  *   **Feature** is the only criterion that allows for the "Rival-Relativity" rule you require. It grounds the decision in visible geometry rather than invisible intent.
  *   **Recognition** aligns with the end-goal of the data: training a model to do what a competent reader does. It provides a pragmatic stop-condition ("Does this look like an 'a'?").
  *   **Function** is discarded because annotators cannot access writer intent without context, and relying on it invites speculation that destroys inter-annotator agreement (IAA). *Loss:* We lose the ability to capture "intentional errors" where a child writes an 'o' but means 'a'. The model will learn shape, not intent.
  *   **Genealogy** is discarded because "continuous deformation" is too abstract for untrained workers to visualize under time pressure. It requires a mental model of letter evolution they do not possess. *Loss:* We may reject structurally valid but visually aberrant forms (e.g., a highly distorted 'a' that is historically derivable but looks like a scribble).

  **The Orthography Parameter:**
  The procedure must treat the "single-bowl" status as a binary switch set at the project level (Project A: Single-bowl = 'a'; Project B: Single-bowl = distinct letter). This is not a decision for the annotator but a constraint of the workspace.

  ***

  # 1. The Decision Procedure (Ordered Sequence)

  **Pre-Condition:** Annotator confirms the Project Setting for "Single-Bowl Forms" (Is a circle-with-stem an 'a' or a different letter?).

  **Step 1: The Rival Elimination Test**
  *   **Question:** Looking *only* at the shape, does this look clearly more like a rival letter (o, u, d, e, 4) than it looks like an 'a'?
  *   **Sufficient Answer:** Yes, it matches a rival's diagnostic feature (e.g., no stem for 'o', open top for 'u', stem on left for 'd').
  *   **Exit:** **REJECT**. (Do not label as 'a').

  **Step 2: The Core Structure Test**
  *   **Question:** Does the mark have the basic skeleton of an 'a' for this project? (e.g., closed bowl + vertical stem on right OR single-bowl form if allowed).
  *   **Sufficient Answer:** Yes, the main parts are present, even if messy.
  *   **Exit:** **LABEL** as 'a'.

  **Step 3: The Context Rescue (Restricted)**
  *   **Question:** Is the shape ambiguous (failed Step 1 and Step 2), but the surrounding word makes the identity obvious (e.g., "c_t")?
  *   **Sufficient Answer:** Yes, the word is readable and only 'a' fits.
  *   **Exit:** **LABEL** as 'a' **WITH CONTEXT FLAG**. (This marks the data for exclusion from shape-only subsets).
  *   **Constraint:** If the word itself is unreadable, do not guess. Proceed to Step 4.

  **Step 4: The Tie-Breaker (Volume Control)**
  *   **Question:** Is it equally likely to be an 'a' or a rival?
  *   **Sufficient Answer:** It is a true tie.
  *   **Exit:** **REJECT**. (Priority is preventing contamination over saving data).
  *   **Note:** Escalation is only permitted if the image is degraded to the point where *no* letter can be identified (e.g., ink blot). This keeps escalation under 5%.

  ***

  # 2. Worker-Facing Language Guide

  **Task:** Decide if this shape is the letter **a**.

  **Rule 1: The "Not An A" Check**
  Look at the shape. Does it look more like something else?
  *   If it looks like a circle with no stick → It is an **o**. (Reject)
  *   If it looks like a cup open at the top → It is a **u**. (Reject)
  *   If the stick is on the left side → It is a **d**. (Reject)
  *   **If yes to any of these, click REJECT.**

  **Rule 2: The "Looks Like A" Check**
  Does it have a round bottom and a stick on the right side?
  *   It doesn't have to be perfect. Wobbly lines count.
  *   **If yes, click LABEL.**

  **Rule 3: Using the Word**
  *   Only look at the rest of the word if the shape is confusing.
  *   If the word is "c_t", you can call the middle mark an **a**.
  *   **Important:** If you use the word to decide, you must check the box **"Used Context"**.
  *   If the word is scribbled out or unreadable, do not guess.

  **Rule 4: When in Doubt**
  *   If you truly cannot tell if it is an **a** or an **o**, click **REJECT**.
  *   It is better to waste a image than to teach the computer the wrong shape.
  *   Only click **REVIEW** if the image is too dark or cut off to see anything.

  ***

  # 3. Rule on Word Context

  **Permission:** Context may only be consulted after the shape fails to trigger a confident decision in Step 1 or Step 2.
  **Recording:** Any label assigned via Step 3 must be tagged with a metadata flag `CONTEXT_DEPENDENT = TRUE`.
  **Constraint:** Images tagged `CONTEXT_DEPENDENT` are automatically excluded from any dataset subset sold or used for "shape-only" recognition tasks. They are valid for language-model training but invalid for character-classifier training.

  ***

  # 4. Rule Enforcing Rival-Relativity

  **The Operative Question:** The annotator is never asked "Is this an 'a'?"
  **The Actual Question:** "Is this closer to 'a' than it is to 'o', 'u', 'd', 'e', or '4'?"
  **Implementation:** Step 1 of the procedure forces a comparison against the specific rival set defined for the project. If the distance to 'u' is shorter than the distance to 'a' (visually), the item is rejected, even if it was intended as an 'a'. This prioritizes model clarity over writer fidelity.

  ***

  # 5. One-Page Annotator Card

  | **DECISION CARD: TARGET 'a'** | **PROJECT SETTING:** [ SINGLE-BOWL ALLOWED / NOT ALLOWED ] |
  | :--- | :--- |
  | **1. RIVAL CHECK**<br>Does it look more like **o, u, d, e, 4**?<br>*(Check for open top, wrong stem side, no stem)*<br>⬇️ | **YES** → **REJECT**<br>*(Stop)* |
  | **NO** ↓ | |
  | **2. SHAPE CHECK**<br>Does it have the 'a' skeleton?<br>*(Round bottom + stem on right)*<br>⬇️ | **YES** → **LABEL**<br>*(Stop)* |
  | **UNCLEAR** ↓ | |
  | **3. CONTEXT CHECK**<br>Does the word make it clear?<br>*(e.g., "c_t")*<br>⬇️ | **YES** → **LABEL + FLAG "CONTEXT"**<br>*(Stop)* |
  | **NO** ↓ | |
  | **4. DOUBT**<br>Is it a tie between 'a' and a rival?<br>⬇️ | **YES** → **REJECT**<br>*(Protects model)* |
  | **IMAGE BAD** → | **ESCALATE**<br>*(Max 5% of total)* |

  ***

  # 6. Judgment Calls & Systematic Failures

  **Judgment Calls Dressed as Procedure:**
  1.  **Defining the "Stick":** At what length does a serif become a stem? The procedure says "stem on right," but a slight ink spur might be interpreted differently by different workers.
  2.  **Degradation vs. Shape:** When ink is faded, is the missing closure a feature of the letter (it's a 'u') or the scan (it's an 'a')? Workers will vary in their tolerance for noise.
  3.  **Rival Distance:** "Closer to 'a' than 'u'" is subjective. Without visual exemplars of "borderline cases," workers will drift over time.

  **Systematic Failure Categories:**
  1.  **The "Intentional Error" Blindspot:** If a child consistently writes 'a' like an 'o', the procedure will reject all instances as 'o'. The model will never learn this writer's idiosyncrasy.
  2.  **The Context Trap:** Workers may lazily skip Step 1 and 2, relying entirely on Step 3 (Context) to speed up. This inflates the `CONTEXT_DEPENDENT` rate and ruins the shape-only subset quality.
  3.  **The Capital/Lowercase Bleed:** Workers may label Capital 'A' as lowercase 'a' if the shape is similar, violating case sensitivity unless explicitly trained otherwise.

  ***

  # Procedure Run-Through: Three Cases

  **Case 1: Isolated crop, closed bowl, vertical stem right, gap at top right (1/5 x-height).**
  *   **Step 1 (Rival Check):** The gap at the top makes it visually similar to 'u' (cup shape). However, the presence of the vertical stem on the right is a strong diagnostic for 'a' (single-story). 'u' typically does not have a vertical stem on the right in children's hands.
  *   **Step 2 (Core Structure):** It has the bowl and the stem. The gap is a deformation, not a structural loss.
  *   **Decision:** **LABEL**.
  *   **Reasoning:** Rival relativity favors 'a' because of the stem. The gap is within tolerance for children's variation.

  **Case 2: Same shape, middle mark of "cat".**
  *   **Step 1 & 2:** Same as above. Shape is sufficient.
  *   **Step 3 (Context):** Context confirms, but shape was already sufficient.
  *   **Decision:** **LABEL** (No Context Flag).
  *   **Reasoning:** Context is only used if shape is ambiguous. Since Step 2 yielded a "Yes," we do not proceed to Step 3. This preserves the value of the image for the shape-only subset.

  **Case 3: Display-style Capital 'A', open apex, no crossbar.**
  *   **Step 1 (Rival Check):** It looks like a triangle or Lambda. Is it a rival to lowercase 'a'? Yes, in terms of case.
  *   **Step 2 (Core Structure):** It lacks the lowercase 'a' skeleton (bowl + stem). It is a two-legged structure.
  *   **Decision:** **REJECT**.
  *   **Cost of Keeping:** If you force a **LABEL** here, you violate the case-sensitivity of the model. The model will learn that Capital 'A' and lowercase 'a' are the same class. This destroys the utility of the corpus for case-distinct recognition. To keep them, you must change the target class from "lowercase a" to "grapheme A/a," which requires a separate annotation schema and doubles the complexity of the rival set (now rivals include all capitals).

  ***

  # Closing Assessment

  **What the Procedure Cannot Do:**
  This procedure does not preserve the question of letter identity; it substitutes a **labeling convention** for it. It quietly shifts the definition of 'a' from "a symbol in a writing system" to "a shape that survives a specific filter sequence." A reader who cared about the concept would say the substitution bites at **Case 1**. If the child intended a 'u' but drew a stem by accident, the procedure labels it 'a' because the stem is a stronger feature than the gap. We have prioritized the *visual stability of the class* over the *truth of the inscription*. The procedure guarantees consistency, not ontological correctness.

  **Confidence Assessment:**

  *   **Rival-Relativity Rule (High):** This is the only way to achieve >0.85 IAA on ambiguous shapes; it forces a comparative judgment rather than an absolute one.
  *   **Context Flagging (Medium):** Workers often forget to toggle flags when rushing; automated checks on context usage rates will be needed to ensure compliance.
  *   **Tie-Breaker Reject (High):** Given the cost of contamination, biasing ties toward rejection is the only safe operational choice, even if it increases waste.
  *   **Escalation Cap (Low):** I am least sure about the 5% escalation cap. In a children's corpus with degraded scans, the "Image Bad" rate might naturally exceed 5%, forcing workers to guess on unreadable items and introducing noise.
  *   **Least Sure Point:** The **definition of the "Stem"** in Step 2.
      *   *Settling Evidence:* A calibration set of 500 images with varying stem lengths, annotated by experts, to determine the minimum pixel height or angle required for workers to consistently identify a "stem" versus "ink noise." Without this empirical threshold, the "Core Structure Test" remains too subjective.
