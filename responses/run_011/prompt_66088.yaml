  4.  **Developing the Three Cases:**
      *   *Case 1 (Isolated gap):* Closed bowl, vertical stem, gap at top right. Rivals: 'o' (no stem), 'd' (stem left?), 'u' (open top). It's an 'a' variant (single story). But the gap makes it look like 'u'. Rival relativity is key.
      *   *Case 2 (Word 'cat'):* Context confirms 'a'. But procedure must flag context usage.
      *   *Case 3 (Display Capital 'A'):* Open apex, no crossbar. Rivals: 'Lambda', 'Triangle', 'A'. Client wants display forms kept. Standard 'a' rules might reject this as "not lowercase a". Need to adjust scope or acknowledge the cost. The prompt says "target letter, most often the letter a". Usually implies lowercase. But client wants display forms kept. This creates tension. If the target is specifically lowercase 'a', a capital 'A' is a reject. If the target is the *lexeme* A/a, it's a keep. I need to clarify this tension in the procedure. The prompt says "target letter, most often the letter a". I will assume the task is specifically lowercase 'a' annotation for the HTR model, but the client *wants* display forms kept. This implies the definition of 'a' must expand to include graphic variants of 'A' that function as 'a' in the corpus context, OR I must admit the procedure rejects it and state the cost. The prompt asks: "If your procedure throws them out, say so plainly... and tell me what keeping them would cost." I will likely have to throw it out based on strict lowercase criteria, or create a "Display Exception" rule. Given the "Philosopher of Notation" persona, I should probably highlight the category error. Let's aim for a procedure that rejects it based on strict 'a' (lowercase) definition, then explain the cost of keeping it (confusing the model about case sensitivity).

  5.  **Refining the "Philosopher" Persona:**
      *   Tone: Analytical, precise, aware of the gap between theory and practice.
      *   Focus: The tension between "what is an 'a'" (ontology) and "what counts as an 'a' for the model" (operationalism).
      *   No jargon for workers, but deep analysis for the user.

  6.  **Addressing Specific Constraints:**
