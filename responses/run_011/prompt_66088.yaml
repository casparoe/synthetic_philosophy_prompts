      *   *Closing:* Limitations + Confidence Assessment.

  7.  **Drafting Content - Section by Section:**

      *   *Brainstorming:* Weigh Function, Feature, Genealogy, Recognition.
          *   Keep: Feature (for rivals), Recognition (for final call).
          *   Discard: Function (too speculative), Genealogy (too hard to teach).
          *   Loss: Intentions lost, structural validity lost.
      *   *Procedure:*
          1.  Rival Check (Is it clearly an 'o', 'd', 'u'?).
