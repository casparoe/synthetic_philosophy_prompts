answer: |-
  **To:** Members of the Clinical Safety Committee
  **From:** Chair, Clinical Safety Committee
  **Date:** [Date]
  **Re:** Opinion on Draft Incident-Investigation Policy Clauses

  Colleagues,

  Before we vote on Thursday regarding the new incident-investigation policy, I wish to circulate this opinion on the three contested clauses. We are divided not merely over wording, but over the moral structure of our institution. The March radiotherapy incident, in which a patient suffered permanent injury due to a dismissed system flag, demands a response that balances safety with accountability. However, the current draft conflates two distinct ways of responding to human error.

  To clarify this, I rely on a distinction drawn by the philosopher P.F. Strawson, which I believe maps precisely onto our deadlock. Strawson distinguishes between an *excuse* and an *exemption*. When we offer an excuse, we admit the agent performed the action but argue the blame is mitigated by context (e.g., "I did it, but the alarm was known to be faulty"). When we grant an exemption, we suggest the individual was not a proper agent at all—that they were acting under compulsion, incapacity, or as a mere component of a mechanism.

  This links to a second distinction: the *participant stance* versus the *objective attitude*. In the participant stance, we relate to one another as responsible colleagues; we feel resentment when harmed and gratitude when helped. In the objective attitude, we view a person as something to be managed, trained, or engineered around, much like a piece of equipment. Our conflict arises because the draft policy attempts to apply the objective attitude to our staff during investigations while expecting them to remain in the participant stance everywhere else.

  I argue below that we cannot confine the objective attitude to the investigation room without corroding the trust required for clinical safety. Below, I analyze each clause through this lens and propose amendments.

  **Clause 1: Agent-Locating Description**
  *Draft:* "The published report must contain no agent-locating description... not that she dismissed the warning, but that the warning was dismissed."

  *Analysis:* This clause mandates the objective attitude. By stripping the agent from the sentence, it treats the physicist as a vector through which error flowed, rather than a colleague who made a choice. The Consultant Oncologist argues this protects psychological safety; the Patient Representative argues it erases the reality of what happened to the patient.

  *Verdict:* **Amend.**
  Passive voice does not create safety; it creates ambiguity. If we cannot say who acted, we cannot learn why they acted. The 18-month history of dismissed flags suggests a cultural norm, but norms are sustained by individual choices. Hiding the choice prevents us from addressing the culture.

  *Recommended Wording:* "The published report must describe the causal sequence accurately, identifying individual actions where established. Such identification shall not constitute an admission of liability but is required to clarify the interaction between human decision and system design."

  **Clause 2: Exemption from Referral**
  *Draft:* "Where the investigation finds that the conduct arose from a defect in the system... that individual is exempt... from referral, discipline, and censure."

  *Analysis:* The draft uses the word "exempt." This is an exemption, not an excuse. It declares that if the system was defective, the individual's agency is nullified. This is dangerous. In the March incident, the system flagged the error twice. The defect was not the flag; the defect was the culture that normalized ignoring it. To exempt the individual entirely is to treat them as a managed object rather than a professional with a duty to challenge unsafe norms.

  *Verdict:* **Amend.**
  We must excuse punitive discipline where system defects dominate, but we cannot exempt professionals from referral if their conduct breached fundamental standards. The regulator requires us to state whether a referral is made; this clause pre-emptively answers "no" based on a categorization that may not hold.

  *Recommended Wording:* "Where the investigation finds that the conduct arose primarily from a defect in the system, the individual shall be excused from punitive discipline and entered on a retraining plan. However, this does not automatically exempt the individual from referral to their professional body if the conduct constituted a serious breach of professional standards independent of the system defect."

  **Clause 3: Acknowledgement of Harm**
  *Draft:* "Every individual whose conduct features in a report must sign a closing statement acknowledging the harm done... as a condition of the matter being closed."

  *Analysis:* This clause demands the participant stance—it asks the individual to acknowledge harm done *by them* to another person. However, Clause 1 has just stripped them of agency in the narrative. You cannot require someone to apologize for an action the report claims they did not uniquely perform. This creates a coercive contradiction: be an object in the report, but a moral agent in the signing.

  *Verdict:* **Amend.**
  Acknowledgement must be voluntary and consistent with the findings. If the report identifies their action (per my amendment to Clause 1), acknowledgement is appropriate. If not, it is coerced.

  *Recommended Wording:* "Where the investigation establishes individual action contributing to harm, the individual shall be offered the opportunity to sign a statement acknowledging the impact on the patient and family. This shall not be a condition of closing the matter but recorded as part of the resolution."

  **The Scope Question**
  The central question I ask this committee to face is whether an institution can adopt the objective attitude domain by domain—confining it to incident investigation—without altering how we stand to one another everywhere else in the building. I argue we cannot.

  Evidence for this lies in our own recent history. The physicist dismissed the flag because her predecessor had informally described it as "noise" in front of trainees. That informal instruction overridden the formal system for eighteen months. Culture drives behavior more than policy. If we formalize a policy that treats staff as system components to be engineered (Clause 2) and hides their actions (Clause 1), we signal that their moral agency is secondary to their function. This will not stay in the committee room. It will bleed into ward rounds, teaching, and handovers. If we treat colleagues as objects when things go wrong, they will feel like objects when things go right. Safety depends on colleagues feeling responsible *to* each other, not just *for* each other.

  **The Patient Representative's Position**
  I must state the strongest case against my recommendations, specifically from the perspective of our Patient Representative. Her position is that a report which will not say who did what treats the patient as an input to a process rather than as someone to whom something was done. She argues that "retraining" is a euphemism for a decision not to take the harm seriously. She believes that without the threat of referral or discipline, there is no accountability, and without accountability, there is no justice for the family.

  My recommendations concede the following to her position: I agree that the patient must not be treated as an input. My amendment to Clause 1 ensures the report states clearly what happened and who did it. I agree that retraining cannot be a euphemism for impunity; my amendment to Clause 2 preserves the possibility of referral to professional bodies where standards were breached, ensuring accountability remains real.

  However, my recommendations refuse the following: I refuse the notion that accountability requires us to treat our staff as objects to be managed rather than professionals to be engaged. I refuse the contradiction of Clause 3, which demands moral acknowledgement while denying moral agency. I believe that true accountability requires us to hold our colleagues responsible as agents, even when systems fail them. To do otherwise is to deny them the dignity of their profession, and in doing so, we ultimately fail the patients who rely on that professionalism.

  **Conclusion**
  We are tasked with preventing future harm. That requires a culture where staff feel safe to report errors, but also responsible for their actions. The current draft achieves the former by sacrificing the latter. I urge the committee to vote on the amended wording provided above. This path allows us to investigate systems without exempting individuals, and to acknowledge harm without coercing confession. It keeps us in the participant stance with one another, which is the only ground on which clinical safety can stand.

  I look forward to discussing this on Thursday.
