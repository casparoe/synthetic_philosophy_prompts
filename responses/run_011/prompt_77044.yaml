      *Load Bearing:* If the normative stakes are removed (labeling doesn't change rights), the ontological debate becomes academic. If the ontological debate is won (lesions found), the normative stakes remain. Therefore, Normative is load-bearing.

      *Empirical:* Biomarkers prove "bodily deviation" but not "justified coercion."

      *Progress:* Decoupling diagnosis from jurisdiction.

