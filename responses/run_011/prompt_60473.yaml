          *   If $v = 1$ m/s, $\beta = 1 / (3 \times 10^8)$.
          *   $\Delta t = \frac{1}{3 \times 10^8} \times 2.5 \times 10^6 \text{ years}$.
          *   $\Delta t = \frac{2.5}{300} \text{ years} = \frac{1}{120} \text{ years}$.
          *   $1 \text{ year} \approx 365.25 \text{ days}$.
          *   $\Delta t \approx 365.25 / 120 \approx 3.04$ days.
