  ### 5. Printable Materials Content

  **Worksheet Column Headers:**
  1.  **My Speed:** \_\_\_\_\_ m/s
  2.  **My Direction:** [ ] Toward Andromeda [ ] Away from Andromeda
  3.  **Light Travel Time:** (Pre-filled: 2,500,000 years). *Note: This is when we SEE the event.*
  4.  **Simultaneity Offset:** (Speed $\times$ 3 days). *Note: This is when the event IS happening in my frame.*
  5.  **Andromeda Date:** (Day 0 + Offset).
  6.  **Has the vote happened in my frame?** [ ] YES [ ] NO [ ] NOT YET

  **Objection Cards (Cut into strips):**
  1.  **The Transitivity Objection:** Simultaneity is frame-dependent. You cannot stitch different frames together to make one "Block Universe." If A is simultaneous with B, and B with C, A is not necessarily simultaneous with C if frames differ.
  2.  **The Presentist Reply:** Inertial frames are useful for physics, not metaphysics. Nothing obliges us to treat all "nows" as equally *real*. Only my local present exists.
  3.  **The Epistemic Deflation:** "Open future" means "I cannot know it." Relativity changes what is simultaneous, not what is knowable. Deliberation remains possible.
  4.  **The Distance Dependency:** You found in Phase D that this effect vanishes at human scales. Why should cosmic geometry dictate local metaphysics?

  ---

  ### 6. Failure Modes & Scripts

  **1. The "Gamma is 1" Objection (From your colleague or a sharp student)**
  *   **The Trap:** "At 1 m/s, $\gamma$ is 1.000000000000000005. Time dilation is zero. This is a trick."
  *   **The Script:** "You are talking about clock *rates* (time dilation). That is a second-order effect ($v^2/c^2$). We are talking about clock *synchronization* (simultaneity). That is a first-order effect ($v/c$). Over 2.5 million light years, a first-order tilt is massive. The clocks tick at the same speed, but they disagree on what '12:00' means."

  **2. The Light-Travel Time Mix-up**
  *   **The Trap:** "But we won't know the result for 2.5 million years, so it doesn't matter."
  *   **The Script:** "Correct. That is the *epistemic* limit. This argument is about the *ontological* status. Is the decision made? The math says for the Bus Toward, the decision is made. For the Bus Away, it is not. Both are equally valid observers."

  **3. The Curved Spacetime Derailment**
  *   **The Trap:** "Andromeda and Earth are gravitationally bound. SR doesn't apply."
  *   **The Script:** "True. This is an idealization. But GR reduces to SR locally. If the paradox holds in SR, the Presentist must explain why the idealization fails to capture the metaphysical truth. Don't let physics solve the philosophy for you."

  **4. The Giggling Walk-Off**
  *   **Prevention:** "You have 60 seconds. If you are not back in your seats, you lose the chocolate pot."
  *   **Recovery:** If they giggle, lean into it. "It feels absurd. That's the point. The universe is under no obligation to feel intuitive."

  **5. The Deflation ("Who cares?")**
  *   **The Script:** "If truth is objective, it shouldn't depend on whether you are walking to the bus stop. If the invasion is 'real' for the Cyclist but 'unreal' for the Pedestrian, what is the status of the invasion? That is the care."

  ---

  ### 7. Honest Assessment of Limitations

  **Your Worry:** *Everything they compute is third-person and 2.5 million light years away. They might leave knowing a fact about coordinate systems without their own sense of an open future being touched at all.*

  **Verdict:** **Your worry is correct.**
  The activity proves **Relativity of Simultaneity**. It does not logically prove **Eternalism (Block Universe)**. To get there, you need an extra philosophical premise that the activity cannot generate on its own: **The Privilege Principle** (If something is real for one inertial observer, it is real simpliciter).

  **Why the activity still works:**
  1.  **It removes the "Physics is too hard" shield.** By doing the arithmetic, they cannot dismiss the premise as "just theory." They generated the data.
  2.  **It creates the "Oh No" moment.** Seeing the Board fill out (Phase B) and realizing their walk determines the reality of an alien fleet creates the *tension*.
  3.  **It isolates the variable.** By showing that *distance* creates the effect (Phase D), you force them to admit that "Here and Now" is not a unique point in the universe.

  **What you must supply by hand:**
  In Phase F (Debrief), you must explicitly state:
  > "The math shows that 'Now' is relative. The *philosophy* asks: If the Cyclist's 'Now' includes the Fleet Launch, is the Fleet Launch real? If you say 'Yes', you are an Eternalist. If you say 'Only for the Cyclist', you must explain why the Cyclist's frame is metaphysically second-class."

  You cannot gamify that step. You have to lecture it for 5 minutes. The game sets the table; you serve the meal.

  ### 8. Fallback for 8 Students
  *   **Pair Up:** Each pair gets one Role Card. They must agree on the number before posting.
  *   **Board:** Same board, half the dots. The spread remains visible.
  *   **Walk-Off:** Only 2 pairs perform the walk; the other 4 observe and record the "Frame Commitment."
  *   **Objections:** 2 groups of 4 instead of 4 groups of 3.

  ### 9. Phase E (Chocolate Pot) Expected Outcome
  *   **Expectation:** Nobody earns it with a claim about the *invasion status*.
  *   **Winner:** Someone who says: "The light from the launch will arrive at Earth in 2.5 million years."
  *   **Lesson:** We agree on the **Light Cone** (causal structure), but we disagree on the **Simultaneity Slice** (ontological status). This arms them for the Deflation Objection in Phase F.
