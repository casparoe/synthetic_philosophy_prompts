  3.  **The Math (The Core Challenge):**
      *   *Goal:* Calculate simultaneity offset $\Delta t$ for a distance $d$ and velocity $v$.
      *   *Formula:* Lorentz transformation for time: $t' = \gamma (t - vx/c^2)$.
      *   *Simultaneity Offset:* In the Earth frame ($S$), let $t=0$ be "now" at Earth ($x=0$). We want to know the time $t'$ assigned to Andromeda ($x=d$) by a moving observer ($S'$) at the moment they pass Earth ($t=t'=0$).
      *   Actually, usually the paradox is framed as: Two observers pass each other at Earth. One moves toward Andromeda ($+v$), one away ($-v$). What is the time difference *at Andromeda* between their planes of simultaneity?
      *   *Equation:* $\Delta t = \frac{vd}{c^2}$. (This is the first-order approximation, valid for $v \ll c$).
      *   *Derivation:*
          *   Lorentz Transform: $t' = \gamma(t - \frac{vx}{c^2})$.
          *   For the moving observer, "now" is $t' = 0$.
          *   So $0 = \gamma(t - \frac{vx}{c^2}) \implies t = \frac{vx}{c^2}$.
          *   Here $t$ is the time in the *Earth frame* that is simultaneous with the moving observer's "now" at distance $x$.
          *   Wait, let's be precise.
          *   Earth Frame ($S$): Event $E_0$ is $(t=0, x=0)$. Andromeda is at $x = d$.
          *   Moving Frame ($S'$): Passes $E_0$ at $t'=0$. Plane of simultaneity is $t'=0$.
          *   Transform back to $S$: $t' = \gamma(t - vx/c^2) = 0 \implies t = vx/c^2$.
          *   So, relative to Earth's "now" ($t=0$), the moving observer's "now" at Andromeda is $t = \frac{vd}{c^2}$.
          *   If moving *toward* ($v > 0$), $t > 0$ (Andromeda's future is Earth's now).
          *   If moving *away* ($v < 0$), $t < 0$ (Andromeda's past is Earth's now).
          *   *Total Swing* between two observers (one toward, one away at speed $v$): $\Delta T = \frac{vd}{c^2} - (-\frac{vd}{c^2}) = \frac{2vd}{c^2}$.
      *   *Constants:*
          *   $c \approx 3 \times 10^8$ m/s.
          *   $d = 2.5 \times 10^6$ light years.
          *   1 light year $\approx 9.46 \times 10^{15}$ meters.
          *   $d \approx 2.365 \times 10^{22}$ meters.
          *   $c^2 \approx 9 \times 10^{16}$ m$^2$/s$^2$.
          *   Factor $k = d/c^2 \approx \frac{2.365 \times 10^{22}}{9 \times 10^{16}} \approx 2.63 \times 10^5$ seconds per (m/s).
          *   Let's check units: $\frac{\text{meters}}{(\text{m/s})^2} \times \frac{\text{m}}{\text{s}} = \text{seconds}$. Correct.
