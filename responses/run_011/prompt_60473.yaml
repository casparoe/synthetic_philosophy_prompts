  This is a strong design. It forces the metaphysics out of the math rather than overlaying it. However, Phase C (Symmetry) is the most likely point of collapse if the math isn't scaffolded, and Phase E (Chocolate) risks feeling gimmicky unless the "winning condition" is philosophically precise.

  Below is the refined run sheet, the exact math derivation (to arm you against your colleague), the printable materials, and the honest assessment of limitations.

  ### 1. The Math (For You and the Worksheet)

  Your colleague is confusing **Time Dilation** (second-order effect, depends on $v^2/c^2$) with **Relativity of Simultaneity** (first-order effect, depends on $v/c$). At walking speeds, clocks do not noticeably slow down ($\gamma \approx 1$), but planes of simultaneity tilt drastically over cosmic distances.

  **The Derivation:**
  1.  **Lorentz Transform for Time:** $t' = \gamma (t - \frac{vx}{c^2})$.
  2.  **Define "Now" for Moving Observer:** For the clerk passing Earth at $t=0$, their "now" is $t'=0$.
  3.  **Solve for Earth-Frame Time ($t$) at Andromeda ($x=d$):**
      $$0 = \gamma (t - \frac{vd}{c^2}) \implies t = \frac{vd}{c^2}$$
  4.  **Simplify using Light Years:**
      *   $d = 2.5 \times 10^6$ light-years.
      *   Therefore, $d/c = 2.5 \times 10^6$ years (time light takes to travel).
      *   Offset $t = \frac{v}{c} \times (\frac{d}{c}) = \frac{v}{c} \times (2.5 \times 10^6 \text{ years})$.
  5.  **Calculate the Factor:**
      *   Let $v = 1$ m/s.
      *   $c \approx 3 \times 10^8$ m/s.
      *   $\frac{v}{c} = \frac{1}{300,000,000}$.
      *   Offset $= \frac{2,500,000}{300,000,000}$ years $= \frac{1}{120}$ years.
      *   $\frac{1}{120} \text{ years} \times 365.25 \text{ days/year} \approx \mathbf{3.04 \text{ days}}$.

  **Conversion Factors for Worksheet:**
  *   **One-Way Offset:** **3 days per 1 m/s** (relative to Earth rest frame).
      *   Moving *Toward* Andromeda: Andromeda's time is *ahead* (Future).
      *   Moving *Away* from Andromeda: Andromeda's time is *behind* (Past).
  *   **Total Swing:** **6 days per 1 m/s** (between two observers passing at relative speed $2v$).

  ---

  ### 2. Role Cards & Timeline Design

  To maximize the "annoying spread" within realistic speeds ($\le 30$ m/s), we compress the Andromedan political timeline.

  **The Andromedan Schedule (Print on Cards):**
  *   **Day -10:** Council Convenes.
  *   **Day 0:** **EARTH NOW** (Anchor Point).
  *   **Day +20:** Final Vote on Invasion.
  *   **Day +25:** Invasion Fleet Launches.

  **Role Cards (16 Students):**
  *Assign these randomly. Ensure a mix of directions.*

  | Role | Speed | Direction | Calculation (Speed $\times$ 3) | Andromeda "Now" | Status |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Parked Car** | 0 m/s | N/A | 0 days | Day 0 | Debate Midpoint |
  | **Pedestrian 1** | 1.5 m/s | Away | -4.5 days | Day -4.5 | Pre-Convene |
  | **Pedestrian 2** | 1.5 m/s | Toward | +4.5 days | Day +4.5 | Early Debate |
  | **Jogger 1** | 3 m/s | Away | -9 days | Day -9 | Pre-Convene |
  | **Jogger 2** | 3 m/s | Toward | +9 days | Day +9 | Mid Debate |
  | **Cyclist 1** | 6 m/s | Away | -18 days | Day -18 | **Before Council** |
  | **Cyclist 2** | 6 m/s | Toward | +18 days | Day +18 | **Near Vote** |
  | **City Bus** | 10 m/s | Away | -30 days | Day -30 | **Weeks Before** |
  | **City Bus** | 10 m/s | Toward | +30 days | Day +30 | **Fleet Launched** |
  | *(Duplicate these 9 pairs for 18 slots, remove 2 for 16 students)* | | | | | |

  *Note: The "Status" column is for your eyes only. Do not print this on the cards.*

  ---

  ### 3. Minute-by-Minute Run Sheet (100 Minutes)

  | Time | Phase | Activity | Instructor Notes |
  | :--- | :--- | :--- | :--- |
  | **00-05** | **Intro** | Hand out Role Cards & Worksheets. | No lecture. "You are Synchrony Clerks. Your job is to file the 'Now' report." |
  | **05-15** | **A: Calc** | Students calculate offset. Write on Index Card. | **Crucial:** Worksheet has two columns: "Light Arrival" (Fixed: 2.5M yrs) and "Simultaneous Time" (Calculated). Prevents mixing them. |
  | **15-25** | **B: Board** | Students post cards on Board Timeline. | Draw X-axis (Speed), Y-axis (Andromeda Day). Watch the spread emerge. |
  | **25-35** | **B: Walk** | **The Walk-Off.** Pairs stand, face opposite directions. Take 5 large steps. | Don't leave the room. Just embody the frame. Ask: "Did the vote happen?" Record Yes/No. |
  | **35-45** | **C: Symmetry** | Pair a "Bus Toward" with a "Bus Away". | Ask Bus Toward: "Is Bus Away's 'now' real?" Ask Bus Away: "Is Bus Toward's 'now' real?" Force the contradiction. |
  | **45-55** | **D: Scale** | Local Calculation. | "How fast to shift the cafe (100m) by 1 second?" (Answer: Impossible speeds). Discuss: Does distance matter for *truth*? |
  | **55-65** | **E: Pot** | Chocolate Coin Wager. | Condition: "State a fact about the Invasion *all* frames agree is true *now*." (Winner: Light signal facts only). |
  | **65-85** | **F: Theory** | Reveal "Rietdijk-Putnam". Group Objections. | Hand out Objection Cards (Presentism, Epistemic, Transitivity). |
  | **85-95** | **Debrief** | Map Activity to Argument. | Connect the "Oh No" to the Privilege Principle. |
  | **95-100** | **Exit** | Exit Ticket. | "One sentence: Is the future open? Why?" |

