      *   *Move 4 (Ben):* Consequences need not be introspectible. Evidence: Smooth continuity upon saccade (eye movement). No surprise implies detail was already there (Predictive/Phenomenological argument).
      *   *Move 5 (Iris):* Smoothness also fits "world-supplying" hypothesis (we look, world provides detail). "Rich experience" is an idle posit if world does the supplying. (Externalist/No-Richness argument).
