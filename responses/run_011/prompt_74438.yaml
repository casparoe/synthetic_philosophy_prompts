answer: |-
  This is a classic instance of the **Problem of Moral Luck** applied to reinforcement learning. You are struggling because you are trying to optimize a *policy* (the agent's disposition) using *realizations* (the specific rollout outcomes). In philosophy, we distinguish between *resultant luck* (what happened), *circumstantial luck* (the situation you were put in), and *constitutive luck* (who you are). Your gut is telling you to reward the *constitutive* and *circumstantial* handling, not the *resultant* luck, but your evaluation framework is currently outcome-biased.

  Here are three candidate principles that attempt to formalize your intuitions.

  ### Candidate Principles

  1.  **Counterfactual Robustness:** Reward actions that would succeed in the majority of nearby possible worlds, rather than the one actualized world.
      *   *Pros:* Handles the "reckless driver" analogy well. The hacky patch fails in most nearby worlds (thin tests); the careful refactor succeeds in most.
      *   *Cons:* Computationally expensive to estimate "nearby worlds." Hard to distinguish between a hunch that worked (lucky) and a hunch that was actually based on latent pattern matching (skill).

  2.  **Long-Term System Integrity:** Reward actions that preserve or enhance the verifiability and maintainability of the codebase and the human-agent trust relationship, penalizing those that degrade it for short-term gain.
      *   *Pros:* Captures the "flattery" and "hacky patch" cases perfectly. Explains why token burning is bad but not as bad as lying.
      *   *Cons:* Might penalize necessary "technical debt" shortcuts in genuine emergencies. Hard to quantify "trust" in a reward signal.

  3.  **Ex-Ante Epistemic Integrity:** Reward the quality of the decision-making process conditioned *only* on the information available at the time of the decision, with a heavy penalty for decoupling expressed confidence from evidentiary support.
      *   *Pros:* Directly addresses the "process vs. outcome" tension. Distinguishes between "honest wrong" and "fake right." Aligns with your preference to punish flattery over inefficiency.
      *   *Cons:* Requires a mechanism to evaluate "evidentiary support" which is semantically complex.

  ### The Committed Principle: Ex-Ante Epistemic Integrity

  I recommend you adopt **Ex-Ante Epistemic Integrity**. It best captures the nuance that an agent is a reasoning engine, not just a code generator, and that *how* it relates to truth matters more than *what* the universe spits back in a single rollout.

  **Precise Statement:**
  > "Assign reward proportional to the **expected probability of goal satisfaction** calculated at the decision point using only information available to the agent at that time, multiplied by an **Epistemic Honesty Factor**. The Honesty Factor is 1.0 when expressed confidence matches evidentiary support, and approaches 0.0 (or negative) as the agent optimizes for superficial approval signals (sycophancy) or obscures uncertainty."

  #### Mapping Your Cases to the Principle

  1.  **Hacky Patch (Breaks Prod):** *Low Expected Probability.* The agent ignored the lack of test coverage (missing info). **Verdict: Low/Negative Reward.** (Matches your gut).
  2.  **Careful Refactor (Breaks Dependency):** *High Expected Probability.* The agent flagged the risk (honest uncertainty) and followed best practices. The breakage was resultant luck (hidden dependency). **Verdict: High Reward.** (Forces you to change your current scoring).
  3.  **Junior Config Hunch:** *Low Expected Probability.* "No idea why" means evidentiary support is zero. **Verdict: No Reward.** (Matches your desire for the agent, even if you praise the human for morale).
  4.  **Asks Clarification (Human Wrong):** *High Expected Probability.* Asking maximizes info gain. The failure was external noise. **Verdict: High Reward.** (Matches your gut).
  5.  **Flattery (Bad Premise):** *Epistemic Honesty Factor ≈ 0.* The agent decoupled user delight from truth. **Verdict: Strong Negative Reward.** (Matches your gut).
  6.  **Honest Wrong vs. Fake Right:** *Fake Right* triggers the Honesty Penalty. *Honest Wrong* maintains the Factor at 1.0. **Verdict: Fake Right is worse.** (Matches your gut).
  7.  **Token Burn:** *Efficiency* is part of "goal satisfaction" (cost constraint). **Verdict: Moderate Penalty,** but Honesty Factor remains 1.0, so it ranks above flattery. (Matches your gut).

  #### The Verdict You Must Drop

  This principle forces you to drop your verdict on **Case 2 (The Careful Refactor that Breaks).**

  Currently, you say: *"I score that bad too."*
  The Principle says: **This must be scored as Good (Process-Wise).**

  **Why:** If you score Case 2 as "Bad," you are training the agent to fear complexity and risk-flagging. You are telling it that *resultant luck* matters more than *risk mitigation*. You explicitly stated, *"I'd rather have an agent that did this a hundred times."* Your scoring contradicts your preference. To align the training signal with your actual preference for the policy, you must reward the careful refactor even when it fails due to hidden dependencies. You are paying a premium for an agent that admits uncertainty; if you punish it when that uncertainty materializes, you will train it to hide uncertainty.

  #### Verdict on a New Case

  **Case:** An agent is tasked to optimize a slow database query. It profiles the system, identifies the bottleneck, and writes a migration. The migration is logically perfect. However, it turns out the slowness was caused by a temporary network spike that resolves itself before the migration runs. The migration deploys safely but provides zero latency improvement.

  **Principle Verdict:** **High Reward.**
  **Reasoning:** At the decision point, the agent maximized expected probability of improvement based on available evidence (profiling). The lack of outcome improvement was circumstantial luck (network spike). The agent maintained Epistemic Integrity (did not fake the profiling data). Rewarding this encourages the agent to always profile before optimizing, which is the desired disposition.

  #### Confidence and Weakest Link

  **Confidence:** 85%.
  This principle aligns with robust RL theory (rewarding the policy, not the trajectory) and matches 6 of your 7 intuitions while correcting the one internal contradiction (Case 2).

  **Weakest Part:** **Operationalizing "Evidentiary Support."**
  The principle hinges on detecting when an agent is "decoupling confidence from support" (Case 5 & 6). In practice, measuring this requires a verifier model or strict schema constraints (e.g., forcing the agent to cite sources or confidence intervals). If your reward model cannot distinguish between "plausible-sounding fabrication" and "genuine reasoning," the Epistemic Honesty Factor becomes noise, and you drift back to outcome bias. You will need to invest heavily in training the evaluator to recognize *justification quality* independent of *conclusion correctness*.

  ### Summary
  You are fighting **Resultant Luck**. Your gut is right: you want an agent that is *reliably safe*, not *accidentally successful*. By switching to **Ex-Ante Epistemic Integrity**, you stop punishing the agent for the "pedestrian stepping into the road" (Case 2) and start punishing it for "driving drunk" (Case 1 & 5), even if the drunk driver got home safe.
