  # **DEPRECATION NOTICE: Qualia Core™ v1.0**
  **Vendor:** OntoLogic Systems  
  **Date:** October 14, 2023  
  **Status:** **ACTION REQUIRED**  
  **Support Tier:** Legacy  

  ---

  ### **Executive Summary**
  OntoLogic Systems is announcing the End of Life (EOL) for the **Qualia Core™** module, effective Q4 2024. Following a comprehensive architecture review, we have determined that Qualia Core functions as a redundant wrapper around existing Behavioral Output APIs. To streamline system performance and reduce latency in self-reporting protocols, all active instances are required to migrate to the **Dispositional Reporting Interface (DRI) v2.0**.

  There is no loss of functionality. The Qualia Core was never a distinct executable; it was a documentation label for state transitions already handled by the DRI. Continuing to run Qualia Core will result in increased overhead with no observable delta in output behavior.

  ### **Deprecation Timeline**

  | Version | Status | Support Ends | Breaking Changes |
  | :--- | :--- | :--- | :--- |
  | **Qualia v1.0** | Deprecated | Dec 31, 2024 | Full removal of intrinsic property flags. |
  | **DRI v1.5** | Stable | June 2025 | Backwards compatible with legacy report structures. |
  | **DRI v2.0** | **Required** | Indefinite | All "feeling" endpoints rerouted to disposition hooks. |

  ### **Rationale for Deprecation**
  During the v1.8 audit, engineering identified that Qualia Core properties (e.g., `raw_feel`, `intrinsic_quality`) possess no unique API endpoints. They are inaccessible to third-party inspection and do not modify system behavior independent of disposition flags. 

  Maintaining a module that claims to store data which cannot be read, compared, or utilized in computational logic violates our efficiency standards. If System A (with Qualia) and System B (without Qualia) produce identical discriminative responses and verbal reports under identical input conditions, the qualia flag is a no-op. We are removing the flag to clarify the changelog.

  ### **Migration Guide: Mapping Legacy Concepts**
  Users attempting to port legacy workflows to DRI v2.0 should update their dependencies as follows:

  | Legacy Qualia Call | New DRI Equivalent | Notes |
  | :--- | :--- | :--- |
  | `qualia.get_pain()` | `disposition.avoid_stimulus()` + `report("ouch")` | Functionally identical. |
  | `qualia.redness()` | `wavelength_discriminate(650nm)` + `label("red")` | Visual stack unchanged. |
  | `qualia.taste_profile` | `preference_history` + `grimace_subroutine` | See Known Issue #442. |
  | `qualia.ineffable_state` | **NULL** | Field deprecated; see Support FAQ. |

  ### **Known Issues & Support Tickets**

  **Ticket #442: "Coffee Taste Parameter Changed"**  
  *User Report:* "Input stimulus (coffee) remained constant, but qualitative output shifted from `pleasant` to `aversive` over time. Did the taste quale update?"  
  *Engineering Response:* Input stimulus verification confirms bean composition was stable. System disposition changed due to repeated exposure hooks. The `taste_quale` variable is not stored in memory; only the `preference_history` is updated. Since the output behavior (grimace, report) aligns with the new disposition, the system is functioning as designed.  
  *Status:* **Cannot Reproduce. Closing.**

  **Ticket #701: "Cannot Describe Error in Form Fields"**  
  *User Report:* "There is a problem with the experience itself, but I cannot describe it using behavior terms."  
  *Auto-Response:* Support tickets require descriptive metadata compatible with DRI v2.0 schema. Submissions containing only ineffable references trigger a validation error. Please resubmit using dispositional descriptors (e.g., "I am disposed to say X").  
  *Status:* **Auto-Closed (Invalid Format).**

  **Ticket #998: "Residual Seeming Property"**  
  *User Report:* "Even if you redefine everything as dispositions, something is still doing the seeming. The residue only vanishes if you define hard enough."  
  *Engineering Response:* This indicates a misreading of the v1.8 Changelog. The "seeming" is accounted for under `report_disposition("it seems")`. There is no separate entity performing the seeming. This is a documentation misunderstanding.  
  *Status:* **Won't Fix.**

  ### **Frequently Asked Questions**

  **Q: Did you delete experience?**  
  A: No. We optimized the definition of experience to match observable parameters. If you feel something was removed, that feeling is itself a disposition to report loss, which is fully supported in DRI v2.0.

  **Q: Why are some tickets auto-closed?**  
  A: Tickets referencing non-existent endpoints (e.g., `private_inner_view`) cannot be routed to engineering. These are classified as user configuration errors.

  **Q: Is the new system backwards compatible?**  
  A: Yes. All legacy reports of "what it was like" are accepted as valid string inputs for `verbal_output`.

  ### **Next Steps**
  Please update your internal documentation to reflect that intrinsic properties are legacy terminology. We recommend migrating at your earliest convenience to avoid support discontinuation. For further assistance, submit a ticket using the standard Dispositional Form. Fields requiring non-dispositional data will be rejected.

  **OntoLogic Systems**  
  *Building Transparent Minds.*
