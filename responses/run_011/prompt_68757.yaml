  Here is a plan for your 45-minute session. It is designed to keep the Bayesians happy by anchoring everything in likelihoods, while giving the postgrads enough rope to hang themselves if they try to derail you into metaphysics.

  ### 1. Order of Operations: The "Evidence" Pivot

  Your instinct is half-right, but leading with "I exist is evidence" is indeed the quickest way to lose the maths crowd. It sounds like Descartes, not Bayes.

  **The Sequence:**
  1.  **Minutes 0–5: The Bayes Anchor.** Write $P(H|E) \propto P(E|H)P(H)$ on the board. Do not mention anthropology yet. State the problem: "We agree on the formula. We disagree on what counts as $E$."
  2.  **Minutes 5–10: Defining $E$.** Present the two candidates for evidence:
      *   $E_1$: "An observer exists." (The SIA move).
      *   $E_2$: "I am *this* specific observer." (The SSA move).
      *   *Crucial distinction:* Tell them SIA treats observer count as a likelihood multiplier. SSA treats it as a sampling fraction.
  3.  **Minutes 10–30: The Toy Example.** Run your Town/Village case. (See arithmetic check below).
  4.  **Minutes 30–40: The Presumptuous Philosopher.** Extract the philosophical implication from the Stage 1 SIA result.
  5.  **Minutes 40–45: Closing Question & Scope.**

  **Why this order:** It forces them to see SSA and SIA not as competing metaphysics, but as competing definitions of the likelihood term $P(E|H)$. This keeps it within their competence.

  ### 2. The Toy Example: Arithmetic and Pedagogy

  Your Town/Village case is strong because it isolates the variables without needing cosmology. However, there is a arithmetic wobble in your Stage 2 SSA calculation that the postgrads *will* spot.

  **The Arithmetic Check:**
  *   **Priors:** 1:1.
  *   **Stage 1 (Existence):**
      *   **SIA:** Weights by population. $1000 : 10$. Posterior **100:1 Heads**. (Correct).
      *   **SSA:** Conditions on existence ($P=1$ in both). Posterior **1:1**. (Correct, under the standard "condition on existence" formulation).
  *   **Stage 2 (Old Quarter):**
      *   **Likelihoods:**
          *   Heads (Town): 10 Old / 1000 Total = $1/100$.
          *   Tails (Village): 10 Old / 10 Total = $1$.
          *   Ratio: $1:100$ (favouring Tails).
      *   **SIA Update:** Previous 100:1 Heads $\times$ 1:100 Tails = **1:1**. (Correct).
      *   **SSA Update:** Previous 1:1 $\times$ 1:100 Tails = **1:100 Tails**.
      *   *Your Note:* You wrote **1:200** for SSA. Unless I'm missing a factor of 2 in your setup, it should be 1:100. **Fix this before you walk in.** A sloppy number on the whiteboard invites challenges on the maths rather than the philosophy.

  **Does it teach the right lesson?**
  Yes. The symmetry of the SIA landing (returning to 1:1) is the key insight: SIA + Indexical Info = Standard Intuition. SSA + Indexical Info = Doomsday Intuition (strongly favouring the smaller world).

  **Does it capture the Presumptuous Philosopher (PP)?**
  Yes. At Stage 1, SIA tells you the coin is 100:1 Heads *before you look out the window*. That is precisely the PP scandal: rejecting a physical hypothesis (Tails) solely because it predicts fewer observers, without empirical data.
  *   *Teaching point:* Emphasise that at Stage 1, the SIA adherent is already "presumptuous." They claim to know the coin bias based on population size alone.

  ### 3. Misconceptions: Order of Appearance and Defusal

  Here are the three objections that will arise, in chronological order, and how to head them off.

  **1. "But $P(\text{I exist} | H) = 1$." (Minute 10)**
  *   *The Objection:* A Bayesian will insist that since you *do* exist, the probability is 1 in both worlds, so it cancels out.
  *   *The Defusal:* Agree conditionally. "If $E$ is 'Someone exists', you're right. But SIA defines $E$ as ' *I* exist', where 'I' picks out a specific subjective slot."
  *   *Whiteboard Move:* Write $P(\text{Slot}_i \text{ is filled} | H)$. In Heads, 1000 slots are filled. In Tails, 10. If you are a random slot, the likelihood differs. Don't get bogged down in *why* you are a slot; just assert it as the SIA axiom for this session.

  **2. "Just go count the people." (Minute 25)**
  *   *The Objection:* "This is silly, I can just look out the window and see if it's a town or village."
  *   *The Defusal:* "We are reasoning *before* Stage 2." Remind them that cosmology (where PP usually lives) doesn't let you step outside the universe to count observers. We are simulating a situation where population size is theoretical, not observed.

  **3. "SSA means I'm median." (Minute 35)**
  *   *The Objection:* Someone will conflate SSA with the Principle of Mediocrity (assuming you are typical).
  *   *The Defusal:* "SSA isn't about being average; it's about sampling probability." In your example, being in the Old Quarter makes you *atypical* in the Town (1%) but *typical* in the Village (100%). SSA favours the Village not because you're median, but because the sampling probability of finding yourself in the Old Quarter is higher there.

  **Fatal if standing at Minute 10:** The first one ("Probability is 1"). If they don't accept that observer count can weight likelihoods, SIA becomes unintelligible. Spend your time there.

  ### 4. The Closing Question

  Do not ask them to define SSA/SIA. Ask them to apply the *consequence* of the distinction.

  **The Question:**
  "Modify the case: The Town has 1,000,000 residents (10 in Old Quarter). The Village has 10 residents (10 in Old Quarter). You are in the Old Quarter.
  Under SIA, what are the odds? Under SSA, what are the odds?"

  **The Answer:**
  *   **SIA:** Stage 1 boost for Town is 100,000:1. Stage 2 penalty for Old Quarter is 1:100,000. Net: **1:1**. (SIA is insensitive to the scale change).
  *   **SSA:** Stage 1 is 1:1. Stage 2 penalty is 1:100,000. Net: **1:100,000 Tails**. (SSA becomes extremely confident in the small world).

  **Why this works:** It shows that SIA 'cancels out' population size with indexical rarity, whereas SSA compounds the rarity. It forces them to calculate, not recite.

  ### 5. What to Refuse to Explain

  You must draw a boundary, or the postgrads will eat the clock. State this explicitly at Minute 5.

  **1. Sleeping Beauty:**
  *   *Say:* "This looks like Sleeping Beauty. It isn't, or at least, we aren't doing it today. That problem introduces temporal self-location which muddies the water on observer count. We are holding time constant."

  **2. The Reference Class Problem:**
  *   *Say:* "You might ask 'Why is the reference class residents? Why not humans? Why not conscious moments?' That is the Reference Class Problem. It is unsolved. For this session, we fix the class as 'residents' to isolate the SSA/SIA mechanic. If you challenge the class, you're opting out of the exercise."

  **3. The Metaphysics of 'I':**
  *   *Say:* "I am not going to defend why 'I' refers to a specific observer slot. Treat it as a primitive. If you don't grant that, SIA doesn't work, and we can't compare it to SSA."

  ### Summary Checklist for the Whiteboard
  1.  Bayes Formula (Top Left).
  2.  Town (1000, 10 Old) vs Village (10, 10 Old).
  3.  Stage 1 Odds (SIA 100:1 H, SSA 1:1).
  4.  Stage 2 Likelihoods (1/100 vs 1).
  5.  Final Odds (SIA 1:1, SSA 1:100 T).
  6.  "Presumptuous Philosopher" label next to Stage 1 SIA.

  Keep your chalk dry and your definitions rigid. If they want to debate the nature of self, tell them there's a philosophy department down the hall. Good luck.
