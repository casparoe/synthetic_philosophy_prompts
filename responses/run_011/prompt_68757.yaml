      *   If Prior 1:1. Likelihood Ratio 1:100. Posterior 1:100.
      *   Why 200?
      *   Maybe they think $P(Old|H) = 10/1000$ and $P(Old|T) = 10/10$?
      *   Maybe they think the Town has 2000 residents? No, 1000.
      *   Maybe they think the Village has 5 residents? No, 10.
      *   Okay, I'll just tell them to check the numbers. 1:100 is cleaner.

      *   *Wait, one nuance on SIA:*
      *   SIA: $P(H|I exist) \propto P(H) \times N_H$.
      *   Is "I exist" the same as "I am a resident"?
      *   In this toy model, yes.
      *   Okay, ready to write.
