      *   *Black Box:* Used as the solution.
      *   *Meta-Analysis:* Included after the speech.

  7.  **Final Polish:**

      *   Ensure the transition from "streaming" to "live" feels generous to the donor, not critical of his industry (he paid for the antidote, after all).
      *   Make sure the Molière explanation is accessible to townspeople.
