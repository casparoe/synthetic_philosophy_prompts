prompt: |-
  I've talked myself into a pretty firm view about updating on soft evidence and I want it stress-tested, not validated.

  The view: Jeffrey conditioning — probability kinematics — is the correct and basically unique rule for revising when your evidence doesn't come as a certainty. You're told something that fixes new probabilities over a partition; you adopt those, you hold all your conditional probabilities *within* the cells fixed (the rigidity assumption), and everything else falls out. I also think the Judy Benjamin problem is not the refutation it's usually treated as. Van Fraassen's informant reports a conditional, and my line is that the testimony is simply incomplete: it constrains P(picture | red) or whatever, but it says nothing about what your new probability for the antecedent itself should be, so no rule whatsoever is going to hand you a unique posterior. The puzzle is generated by demanding one. Once you're explicit that the antecedent probability was left untouched, rigid Jeffrey gives the right answer, and the reflection-principle answer plus the minimum-relative-entropy answer start to look like unmotivated patches bolted on to make the numbers come out interesting. I also have a vague sense that there's a Diaconis–Zabell style symmetry/exchangeability result that pins Jeffrey's rule down uniquely among candidates, which would mean its not an arbitrary choice — but I'm fuzzy on what that result actually assumes.

  So: what would count against this? Not "reasonable people disagree." I want the defeaters.

  1. Where does rigidity fail on its own terms? Give me cases where freezing the within-cell conditionals produces something I'd have to call flatly wrong, and say for each whether it's a genuine counterexample or whether I'm entitled to redescribe what the testimony constrained.

  2. Order dependence. If I receive two pieces of soft evidence in sequence, does my rule commute? My guess is no in general. How damaging is that — is non-commutativity a bug that some rival rule actually avoids, or does every rule that takes the content of soft evidence seriously inherit it? If the latter, I want that said, because it changes how much weight this objection carries.

  3. The symmetry result. What exactly does exchangeability buy, and what would my evidence or the situation have to look like for it to stop applying? I suspect I'm leaning on it much harder than it can bear, and I'd rather find that out here.

  4. A frequency check on a variant I made up. Urn with 100 balls: 25 red-wood, 25 red-plastic, 10 blue-wood, 40 blue-plastic. So P(red) = 0.5, P(wood | red) = 0.5, P(wood | blue) = 0.2, and P(wood) = 0.35. An informant tells me P(wood | red) = 0.8. Rigid Jeffrey says: keep P(red) = 0.5, keep P(wood | blue) = 0.2, so P(wood) goes to 0.5. Now suppose I've separately calibrated this informant over 200 past reports and the record shows that when she makes statements of that form, the situation typically turns out to be one where P(red) is more like 0.65 — she's telling me something about red too, indirectly. Is that calibration data a defeater for my rule, or is it just evidence that I mis-specified what her testimony constrained? Be honest about whether my "the testimony was underspecified" move is doing unfalsifiable work here, because it feels like it might be.

  5. Sort these into what a committed probability-kinematics person would concede as genuinely counting against them versus what they'd wave off, and rank the full set from fatal to merely awkward.

  6. And if your honest conclusion is that the view is heavily insulated — that any counterexample gets absorbed by re-reading what the evidence "really" said — then say that plainly, and tell me whether that insulation is fatal for a rule that's supposed to be normative or whether that's just what a normative rule looks like when the input is genuinely ambiguous.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Persona:** Sophisticated in formal epistemology/probability theory. Knows terms like Jeffrey conditioning, probability kinematics, rigidity, Judy Benjamin problem, van Fraassen, Diaconis-Zabell, reflection principle, minimum relative entropy (MRE).
      *   **Goal:** Stress-test a specific view, *not* validate it. Wants defeaters, counterexamples, and hard truths.
      *   **Core View:** Jeffrey Conditioning (JC) is the unique/correct rule for soft evidence. Rigidity is key. Judy Benjamin (JB) is not a refutation but a case of underspecified input (antecedent probability untouched). Suspects a Diaconis-Zabell symmetry result supports JC.
      *   **Specific Questions:**
          1.  Failures of Rigidity (genuine vs. redescribable).
          2.  Order Dependence (commutativity issues).
          3.  Symmetry Results (Diaconis-Zabell specifics and limits).
          4.  Frequency/Calibration Check (the Urn variant).
          5.  Sorting/Ranking objections (Fatal vs. Awkward).
          6.  Meta-evaluation (Insulation vs. Normativity).

  2.  **Deconstruct the Core View (Jeffrey Conditioning + Rigidity):**
      *   *Jeffrey Conditioning:* $P_{new}(H) = \sum P_{old}(H|E_i) P_{new}(E_i)$.
      *   *Rigidity:* $P_{new}(H|E_i) = P_{old}(H|E_i)$.
      *   *Strength:* Preserves structural relationships within evidence cells.
      *   *Weakness:* Requires the input to be a probability distribution over a partition. Struggles when evidence is a constraint on conditional probabilities (like JB) or when the "experience" affects the relationship between $H$ and $E$.

  3.  **Address Question 1: Failures of Rigidity:**
      *   *Concept:* Rigidity says learning $E$ doesn't change how $H$ relates to $E$.
      *   *Counterexample:* "The Lights Case" (Christensen) or "The Restaurant Case". If I learn the lights are on ($E$), I might update $P(\text{Someone is home}|E)$. But if the *reason* the lights are on is a timer (soft evidence about the mechanism), does my conditional probability of "Someone is home" given "Lights on" stay the same?
      *   *Better Counterexample:* *Holistic Defeaters.* If I learn my vision is unreliable (soft evidence about my sensory state), rigidity fails because the link between the sensory experience and the world is broken.
      *   *Redescription:* The user claims they can redescribe the partition.
      *   *Verdict:* Rigidity fails when the *mechanism* of evidence acquisition is informative about the hypothesis *within* the cell. E.g., "I see a red wall" ($E$). If I learn the lighting is red ($E_{soft}$), $P(\text{Wall is Red} | \text{Looks Red})$ drops. Rigidity holds $P(\text{Wall is Red} | \text{Looks Red})$ fixed. This is a genuine failure unless you partition by "Lighting Condition," which often makes the partition unknowable to the agent.
      *   *Key Defeater:* **The "Uncertain Evidence about Reliability" problem.** If the soft evidence suggests the channel is noisy, rigidity preserves the old noise profile, which is wrong.

  4.  **Address Question 2: Order Dependence:**
      *   *Fact:* JC is non-commutative. $P_{E1, E2} \neq P_{E2, E1}$ generally.
      *   *Why:* Because the second update applies rigidity to the *interim* distribution, not the original.
      *   *Is it a bug?* Wagner (2002) and others discuss this. If the inputs are "experiences," the order of experience matters phenomenologically. But if the inputs are "constraints," order shouldn't matter logically.
      *   *Rival:* MRE (Minimum Relative Entropy) is also non-commutative in the same way unless constraints are simultaneous.
      *   *Verdict:* It's a bug for *logical* constraints, but maybe a feature for *temporal* experiences. However, if the goal is to represent a state of information, non-commutativity is a significant normative flaw. It means the *history* of learning matters, not just the current evidence state.
      *   *Severity:* High. It violates the idea that belief states should supervene on total evidence.

  5.  **Address Question 3: Symmetry Results (Diaconis-Zabell):**
      *   *The Result:* Diaconis & Zabell (1982) "Updating Subjective Probability." They derive JC from symmetry assumptions.
      *   *Assumptions:* The update rule must depend *only* on the old distribution and the new marginal probabilities on the partition. It must treat outcomes symmetrically (permutation invariance).
      *   *The Catch:* This assumes the *only* thing changing is the marginals on the partition. It *builds in* rigidity by assumption. It doesn't prove rigidity is right; it proves JC is the *only* rule that satisfies symmetry + marginal constraint.
      *   *Limit:* If the evidence carries information about the *conditional* structure (violating the input assumption), the theorem doesn't apply.
      *   *Verdict:* It pins down JC *given* the inputs are just new marginals. It doesn't justify that inputs *are* just new marginals. It's a consistency result, not a justification of the input format.

  6.  **Address Question 4: The Urn/Calibration Variant:**
      *   *Scenario:* Informant says $P(W|R) = 0.8$. User knows informant implies $P(R) \approx 0.65$ based on calibration.
      *   *User's Move:* "I mis-specified the testimony."
      *   *Critique:* This is the "Unfalsifiable Move." If every time JC gives a counter-intuitive result, you say "You parsed the input wrong," JC becomes immune to empirical refutation but loses normative force.
      *   *Formal Issue:* JC takes $P_{new}(E_i)$ as input. It cannot *infer* $P_{new}(E_i)$ from a constraint on $P(H|E)$. That's the Judy Benjamin problem again.
      *   *Calibration:* If you have calibration data, you should treat the testimony as evidence $T$. You update on $T$. $P_{new}(H) = P_{old}(H|T)$. This is standard conditionalization, not JC. JC is for when you *can't* condition on the evidence proposition because you aren't certain of it.
      *   *Verdict:* This is a genuine defeater for the claim that JC is *unique*. If you have calibration data, you should be doing standard conditionalization on the event "Informant said X." JC is a special case for when you can't model the evidence as a proposition. If you *can* model the reliability (calibration), JC is the wrong tool; standard Bayes is the right tool. Using JC here ignores the correlation between the informant's statement and the base rates.

  7.  **Address Question 5: Sorting and Ranking:**
      *   *Fatal:* Order dependence (violates sufficiency of total evidence), Reliability defeaters (Rigidity breaks when channel noise is the evidence).
      *   *Awkward:* Judy Benjamin (requires input massage), Symmetry limits (circular assumptions).
      *   *Sorting:*
          1.  Order Dependence (Fatal for logical constraints).
          2.  Reliability/Channel Noise (Fatal for Rigidity).
          3.  Calibration/Urn Case (Shows JC is a special case, not general).
          4.  Judy Benjamin (Manageable but requires input specification).
          5.  Symmetry (Theoretical support but limited scope).

  8.  **Address Question 6: Insulation vs. Normativity:**
      *   *Honest Conclusion:* The view *is* heavily insulated. The move "the testimony was underspecified" allows the theorist to save the rule by shifting the burden to the description of the experience.
      *   *Is this fatal?* For a *normative* rule governing rational agents, yes, it's problematic. A normative rule should guide how to interpret evidence, not just say "If you interpreted it as X, do Y." If the rule doesn't tell you how to map experience to partition probabilities, it's incomplete.
      *   *The "Input Problem":* JC solves the *processing* problem, not the *input* problem. Most real-world friction is in the input problem (How do I turn 'It looks rainy' into $P(\text{Rain})$?).
      *   *Verdict:* The insulation makes JC a coherent *mathematical* operation, but a weak *epistemological* norm.

  9.  **Drafting the Response:**
      *   *Tone:* Rigorous, direct, respectful of technical knowledge, no fluff.
      *   *Structure:* Follow the 6 points exactly.
      *   *Content:*
          *   Q1: Use the "Defeater for Reliability" case. Rigidity fails when the evidence changes the likelihood ratio.
          *   Q2: Confirm non-commutativity. Explain why it's worse for JC than MRE (actually both suffer, but it's a structural flaw in *any* sequential soft update).
          *   Q3: Clarify D-Z. It assumes rigidity to prove JC. It's not an independent justification.
          *   Q4: Hit hard on the "Unfalsifiable Move." If calibration exists, use Conditionalization. JC is for when you *lack* the proposition.
          *   Q5: Rank them.
          *   Q6: Deliver the meta-verdict on insulation.

  10. **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction on Q2:* Is MRE commutative? No, MRE is also generally non-commutative for sequential updates unless the constraints are compatible in a specific way. I need to be careful not to say MRE solves this. The point is that *any* rule handling soft evidence sequentially struggles here. But for JC, it's particularly stark because the partition shifts.
      *   *Correction on Q4:* The user asks if calibration is a defeater. Yes, because it implies the evidence *is* a proposition ("Informant said X") which allows standard conditionalization. JC is only needed when you *cannot* identify the evidence proposition. If you can identify it (via calibration), JC is suboptimal.
      *   *Refining Q1:* The "Garber-style" solution to Old Evidence is relevant but maybe too tangential. Stick to Rigidity. The classic counterexample is when the *cause* of the evidence is correlated with the hypothesis *within* the cell. Example: Medical test. $E$ = Test Positive. $H$ = Disease. If soft evidence is "The lab equipment is aging," $P(H|E)$ drops. Rigidity keeps it fixed.

  11. **Final Polish:** Ensure the distinction between "Experience" (phenomenal) and "Proposition" (content) is clear, as this is the crux of the Judy Benjamin and Rigidity debates. (Van Fraassen vs. Jeffrey).

  12. **Check against constraints:** "Not 'reasonable people disagree'." "Want defeaters." "Be honest."

  *(Self-Correction on Diaconis-Zabell)*: I need to be precise. D-Z (1982) shows JC is the unique rule satisfying certain symmetry conditions *given* that the input is a new probability on a partition. It does *not* derive the partition or the new probabilities from the "experience." It assumes the input format. This confirms the user's suspicion that they are leaning on it too hard.

  *(Self-Correction on Order Dependence)*: Wagner (2002) "Determining Probability Kinematics". Shows that if you view the inputs as *constraints* rather than temporal steps, you should solve simultaneously. Sequential JC is path-dependent. This is a major normative issue if beliefs are supposed to represent information state rather than history.

