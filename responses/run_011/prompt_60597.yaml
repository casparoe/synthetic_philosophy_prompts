      *   *Galileo Comparison:* Galileo would likely treat the Soul differently than the Heavens. He was a Catholic. But his *method* in the letters is about *demonstration*. The user admits dropping demonstration in Case 5. So the user is *not* Galilean on method, but *is* Galilean on the Salvation/Nature split (mostly).
      *   *Case 3 (Joshua):* User keeps event, drops mechanism. This is distinct. It's a "Miracle" category.
