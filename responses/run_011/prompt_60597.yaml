      *   *Synthesis:* The user operates with three domains: 1. Phenomenological/Cultural (Yield to science), 2. Natural History (Yield to consensus), 3. Soteriological/Miraculous (Resist science). The tension is deciding which bucket a text goes into.

  6.  **Final Polish of the Principle Clauses:**
