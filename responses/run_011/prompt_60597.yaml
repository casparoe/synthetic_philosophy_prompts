          *   *Actually, looking closer:* The user says in Case 6 "I would instead deny that the neuroscience means what it appears to mean." This is a "God of the gaps" move. It's unstable.
          *   *Better Recommendation:* Surrender the idea that Case 6 is different from Case 5. Both should be subject to the same threshold. If Ancestry yields to probability, Soul should too. Or both hold out for demonstration.
