          *   *Refinement:* The user's Case 6 is the outlier. It prioritizes *theological necessity* over *scientific certainty* more than Case 5 does. Case 5 allows science to win on probability. Case 6 allows theology to win even against probability.
          *   *Revised Principle:*
              1.  Identify if the text asserts a physical fact or uses phenomenological/cultural language. (Cases 1, 2, 4).
