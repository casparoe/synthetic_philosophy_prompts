      *   **(e) Choice: Simpler vs. Complex:**
          *   *Simple Principle:* "Science wins on natural facts; Theology wins on spiritual truths."
          *   *Cost:* Requires surrendering Case 6 (Soul) or Case 5 (Ancestry). If Science defines "natural," and Soul is natural, Case 6 falls. If Theology defines "spiritual," Ancestry might be spiritual (Fall).
