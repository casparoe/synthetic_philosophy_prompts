answer: |-
  This is a precise dissection of a commonly misused aphorism. You are correct that Chesterton's argument is often reduced to a fetishization of origins ("old = wise"), whereas his text explicitly centers on *function* ("see the use"). The origin story is merely the warrant for the burden of proof, not the proof itself.

  Here is the audit of the analogy as applied to your accreted ordinance, followed by the philosophical breakdown and alternative metaphors.

  ### 1. Correspondence Table

  | Chesterton's Domain | Your Ordinance Domain |
  | :--- | :--- |
  | **The Fence** | The 2-space parking requirement (the text of the ordinance). |
  | **The Road** | The street/neighborhood ecosystem (traffic flow, housing density, aesthetic). |
  | **The Reformer** | You (advocating for repeal). |
  | **The Person Who Had a Reason** | The original council/model code authors (now diffuse, unknown, or multiple). |
  | **Going Away and Thinking** | The burden to demonstrate you understand the *systemic function* of the parking rule before removing it. |
  | **Destroying the Fence** | Repealing the ordinance. |

  ### 2. Mapping Failures

  The analogy strains because Chesterton imagines a discrete artifact placed by an agent, whereas you are describing a complex adaptive system that evolved through layering.

  #### A. Failures that Defeat the Conservative Conclusion (Support Repeal)
  These failures suggest the "presumption of wisdom" inherent in Chesterton's fence is unwarranted here.

  1.  **Design vs. Drift:** Chesterton's fence implies a *teleological* origin (someone put it there *for* a purpose). Your ordinance is *genealogical* (it evolved through amendments and model codes).
      *   *Implication:* If a fence "grew" like a weed, there is no presumption that it serves a human end. It may simply be a bureaucratic scar. This weakens the neighbor's claim that there *must* be a hidden reason.
  2.  **Single Function vs. Conflicting Incentives:** A fence usually keeps things in or out. Your ordinance now serves the assessor, protects lot values, and regulates traffic.
      *   *Implication:* When a rule serves conflicting masters (e.g., public safety vs. private profit), understanding "the use" is impossible without deciding *which* use is legitimate. Chesterton assumes a unified good; your ordinance embodies competing interests. If the "use" is merely protecting a specific profit margin, that is not a Chestertonian "good."
  3.  **Static vs. Context-Dependent:** A wooden fence rots, but its function (barrier) remains constant unless the landscape changes. An ordinance's function is entirely dependent on external technology (e.g., the shift from horse to car to Uber to EV).
      *   *Implication:* The "use" may have been valid in 1925 and vanished in 2025 without the text changing. The fence analogy obscures the dependency on external context.

  #### B. Failures that Do Not Defeat the Conservative Conclusion (Support Caution)
  These failures suggest that even if the origin is murky, the risk of removal remains high.

  1.  **Visible vs. Invisible Load-Bearing:** A fence is visible; its structural role is obvious. An ordinance is invisible; its structural role is in the behavior it inhibits.
      *   *Implication:* Even if the ordinance "grew," it may have become load-bearing for the neighborhood's financial or social structure (e.g., the "assessor disputes" you mentioned). Removing it might collapse a system that relies on the rule, regardless of who wrote it.
  2.  **The "God of the Gaps" Problem:** In Chesterton's analogy, if you don't see the use, you assume ignorance. In law, if you don't see the use, it might be because the law successfully *prevented* a problem from manifesting (prevention is invisible).
      *   *Implication:* This holds even for accreted laws. The fact that no one remembers the reason doesn't mean the reason (e.g., preventing street congestion) isn't actively being suppressed by the law.

  ### 3. The Origin Premise vs. The Use Premise

  You ask: *Does the origin premise do any work of its own once the use premise is present?*

  **Strictly, no.** Chesterton's condition for removal is: *"When you can come back and tell me that you do see the use of it."* He does not say, "When you can tell me who built it." The origin story is purely heuristic; it is a psychological tool to enforce humility. It tells the reformer: *"Assume you are ignorant because someone else was smart enough to build this."*

  However, in your case, the origin premise **collapses the heuristic.**
  If the fence "grew," the presumption of intelligence is removed. You cannot assume a "person had some reason" if the process was a committee amending a model code over 80 years. Therefore, the epistemic burden shifts.
  *   **Chesterton's Standard:** Assume there is a use until proven otherwise.
  *   **Accreted Standard:** Assume there is *noise* until a use is proven.

  Can the demand be restated as *why a practice persists* rather than *why it began*?
  **Yes, and this is the stronger formulation.** In evolutionary terms, persistence is evidence of fitness. If the ordinance has survived three amendments and a century of litigation, it likely confers some stability to the system (even if that stability is merely bureaucratic inertia). The question is not "Who built this?" but "What breaks if this vanishes?" This moves the argument from *intent* (which is unknowable) to *consequence* (which is testable).

  ### 4. Alternative Source Domains

  A fence is a poor image for accreted law. Here are three alternatives, ranked by fit.

  #### A. The Footpath (Desire Path)
  *   **Image:** A worn track across a field formed by walkers, not surveyors.
  *   **Alignment:** Points **both ways**.
  *   **Analysis:** If the destination changes (e.g., the school closes), the path is useless, even if people still walk it out of habit. However, paving over it might block the only route to a new destination.
  *   **Verdict:** Too organic. It implies the "users" created the rule, whereas ordinances are imposed top-down.

  #### B. The Coral Reef
  *   **Image:** Living polyps building on dead calcium carbonate.
  *   **Alignment:** Points **Chestertonian (Caution)**.
  *   **Analysis:** The bottom layers are dead (the original 1920s reasons), but the living ecosystem (current property values, neighborhood cohesion) rests on them. You cannot remove the dead base without killing the living top.
  *   **Verdict:** Strong, but implies the structure is natural rather than coercive.

  #### C. The Legacy Codebase (Best Fit)
  *   **Image:** A software system maintained for decades, full of patches, "spaghetti code," and comments like `// DO NOT DELETE, BREAKS PAYROLL`.
  *   **Alignment:** Points **Chestertonian (Process) but Reformist (Outcome)**.
  *   **Analysis:**
      *   **The Fence:** A specific function or dependency in the code.
      *   **The Origin:** Often unknown; the original developer is gone.
      *   **The Accretion:** Patches applied by different programmers for different bugs.
      *   **The Lesson:** You do not delete legacy code because it looks ugly. You delete it only after writing **unit tests** that verify what the code *does*.
      *   **The "Going Away and Thinking":** This is the testing phase. You must simulate the removal to see what errors throw.
  *   **Verdict:** This is the superior metaphor for your ordinance. It acknowledges that the code (law) is likely messy and poorly documented (accreted), but warns that deletion without testing (understanding systemic use) causes catastrophic failure.
  *   **Direction:** It supports Chesterton's *method* (investigate function before deletion) but acknowledges that **refactoring is inevitable.** Unlike a fence, which is meant to stay forever, code is meant to be maintained. Sometimes the correct move is to delete the legacy function and replace it with a cleaner one that serves the same *use*.

  ### Summary for Your Argument
  Your neighbor is using Chesterton to argue for **stasis** based on **origin**.
  You can use Chesterton (correctly) to argue for **investigation** based on **function**.

  Tell him: *"Chesterton doesn't say we must keep the fence forever. He says we must understand its use before removing it. Since this ordinance wasn't built by one person but grew like legacy code, we cannot assume its origin is wise. We must audit its current function. If the only 'use' is saving the assessor time or inflating lot values, that is not a public good worth fencing us in for."*
