answer: |-
  You are right to be suspicious. Your friend has constructed a "steelman" version of the Condorcet Jury Theorem (CJT) that is mathematically sound in the abstract but sociologically vacuous in application.

  You do **not** need to deny (1). The math of the Jury Theorem is correct. The break happens in the **application of the premises to the real world**, specifically in the hidden assumptions smuggled into **(2)** and **(4)**.

  Here is exactly where the argument breaks, what assumptions are being slipped in, and what you lose (and gain) by rejecting them.

  ### 1. The Break at Step (2): The Competence Assumption
  Step (2) states: *"Adding voters can only help, **since every added voter is above .5**..."*

  This is the hidden premise that carries the entire weight of the argument. The Jury Theorem **only** works if $p > 0.5$. If $p < 0.5$, the theorem inverts: as the group gets bigger, the probability of the majority being *wrong* goes to 1.

  *   **The Flaw:** The argument assumes that random citizens *inherently* have $p > 0.5$ on political questions without information or deliberation.
  *   **The Reality:** For complex political questions (e.g., "Will this tariff reduce inflation?"), an uninformed voter is not a coin flip ($0.5$); they are often systematically biased ($p < 0.5$). If you strip away information drives and campaigning (as Step 5 suggests), you risk dropping the average $p$ below the threshold.
  *   **What you lose by giving this up:** You lose the guarantee that "more is always better." You accept that adding voters is only good *if* they are competent. This reintroduces the need for education or screening (which sounds like epistocracy, but doesn't have to be).

  ### 2. The Break at Step (4): Independence vs. Isolation
  Step (4) claims: *"Independence... is something you get by keeping them apart."*

  This is a category error between **causal isolation** and **statistical independence**.
  *   **The Theorem's Requirement:** CJT requires votes to be independent *conditional on the truth*. It does not require voters to be physically isolated.
  *   **The Flaw:** Voters can be physically isolated but still share a **common signal** (e.g., the same misleading headline, the same cultural bias, the same propaganda). If everyone reads the same fake news story, their errors are correlated even if they never speak to each other. This violates the independence assumption just as much as deliberation does.
  *   **The Role of Deliberation:** Deliberation isn't just about creating dependence; it's about **breaking common signals**. If voters discuss, they might realize the headline was misleading. This raises $p$ (competence).
  *   **The Trade-off:** There is a trade-off between $n$ (group size), $p$ (competence), and $\rho$ (correlation).
      *   Isolation maximizes $n$ but risks lowering $p$ (no info) and keeping $\rho$ high (common media bias).
      *   Deliberation increases $\rho$ (dependence) but can significantly raise $p$ (shared correction of errors).
      *   Formal models show that if deliberation raises $p$ enough, it outweighs the loss of independence. Step (4) ignores this trade-off.

  ### 3. The Break at Step (6): The Math Doesn't Hold
  Step (6) claims: *"Five experts at .9 each are strictly worse than five thousand citizens at .51."*

  This is empirically false on the numbers provided. You can check this with a binomial calculator.
  *   **5 Experts ($p=0.9$):** The probability of a majority error (0, 1, or 2 correct) is roughly **0.8%**. Their reliability is **99.2%**.
  *   **5,000 Citizens ($p=0.51$):** Using a normal approximation, the probability of a majority being right is roughly **92%**.
  *   **Result:** The 5 experts crush the 5,000 citizens in this specific scenario. The crowd only wins if $n$ is *massive* (hundreds of thousands) to compensate for the razor-thin competence margin.
  *   **The Vulnerability:** If the crowd's competence slips from $0.51$ to $0.49$ (due to lack of information, per Step 5), their reliability plummets toward 0% as $n$ grows. The experts are robust; the crowd is fragile.

  ### 4. The Smuggled Premise: Exogenous Competence
  The core philosophical error is in **(3)**. It says: *"Nothing about a voter's information... enters the theorem, as long as they clear .5."*

  This treats $p$ as **exogenous** (a fixed trait of the person) rather than **endogenous** (a result of the system).
  *   In the real world, $p$ is a function of information ($I$) and deliberation ($D$). $p = f(I, D)$.
  *   By arguing for "minimal contact" and "no campaigning" (Step 5), the argument actively suppresses the variables that determine $p$.
  *   You cannot use a theorem that relies on $p > 0.5$ to argue for a system that threatens to lower $p$ below $0.5$. That is self-defeating.

  ### Summary: How to Reply to Your Friend
  You can keep (1) and still reject the conclusion. Here is the script:

  > "I accept the Jury Theorem (1). But your argument fails at **(2)** and **(4)** because it treats competence ($p$) and independence as fixed constants rather than variables affected by the system.
  >
  > 1.  **Fragility:** If 'no campaigning' and 'no information' drops the average voter's $p$ from $0.51$ to $0.49$, the theorem inverts and the majority becomes infallibly *wrong*.
  > 2.  **Common Signals:** Physical isolation doesn't guarantee statistical independence. Shared media environments create correlated errors without a single word being spoken. Deliberation can fix this.
  > 3.  **The Math:** On your own numbers, 5 experts at $0.9$ are more reliable than 5,000 voters at $0.51$. The crowd needs to be orders of magnitude larger to compensate for low competence.
  >
  > So, (5) and (6) don't follow from (1). They follow from (1) plus a hidden, unrealistic assumption that voter competence is immune to information."

  ### What do you lose by giving up (5) and (6)?
  You lose the **elegant simplicity** of the "pure democracy" model. You have to admit that:
  *   Some voters are better than others (without necessarily disenfranchising them).
  *   Information and debate are instrumental goods, not just procedural rituals.
  *   There is a tension between *including everyone* and *making the group smart*.

  But what you gain is **robustness**. You avoid the risk of a massive electorate confidently voting for a disaster because they were all isolated and misinformed. You keep the Jury Theorem as a tool for understanding *why* we need an informed citizenry, rather than a weapon to argue we don't.
