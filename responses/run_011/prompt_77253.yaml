      You speak as a scientist, and I respect the precision of your work, but you are conflating explanation with exemption. The tumour case excuses not because it reveals a cause—we are all caused—but because it reveals a specific kind of incapacity to participate in ordinary adult relationships. Your dossier, however thick, merely details the history of a functioning agent; it does not demonstrate the absence of the capacities that make resentment appropriate in the first place. To think otherwise is to assume that the reactive attitudes require a metaphysical guarantee they have never sought.

