answer: |-
  ### The Menu: Five Readings of "Facts Don't Kill Theories"

  **1. The Duhemian Truism (Auxiliary Hypotheses)**
  *   **(i) Precision:** "Kill" means *logical falsification*. "Better" is irrelevant here. The claim is that an observational fact ($O$) never contradicts a theory ($T$) in isolation, only $T$ conjoined with auxiliary assumptions ($A$). If $\neg O$ occurs, logic only tells us $\neg(T \land A)$, not $\neg T$.
  *   **(ii) Status:** **Truism.** This is standard confirmation theory.
  *   **(iii) License:** **No.** It licenses *temporary* retention to adjust auxiliaries, but not *indefinite* retention. If you adjust $A$ so often that $T$ loses empirical content, you are being irrational, even if you aren't being logically inconsistent.

  **2. The Strong Conventionalist Claim (Immunization)**
  *   **(i) Precision:** "Kill" means *forced abandonment*. "Better" means *more convenient*. The claim is that any theory can be made compatible with any fact by redefining terms or adding ad hoc clauses.
  *   **(ii) Status:** **Defensible-but-Contestable.** It is logically possible to save any theory, but methodologically disastrous.
  *   **(iii) License:** **Yes (but at a cost).** It licenses indefinite continuation logically, but it admits the theory has become a tautology. If your colleague accepts this, he admits his theory predicts nothing.

  **3. The Underdetermination Claim (Empirical Equivalence)**
  *   **(i) Precision:** "Kill" means *unique selection*. "Better" means *more empirically adequate*. The claim is that data alone cannot distinguish between competing theories; multiple theories can fit the same facts.
  *   **(ii) Status:** **Defensible.** Local underdetermination is common; global underdetermination is debated.
  *   **(iii) License:** **No.** This explains why we don't abandon $T$ *immediately* upon anomalous data, but it does not explain why we keep $T$ when it has stopped generating *new* predictions while rivals (or potential rivals) might explain the anomaly more simply.

  **4. The Rational Abandonment Claim (Decision Theory)**
  *   **(i) Precision:** "Kill" means *rational rejection*. "Better" means *higher expected utility/verisimilitude*. The claim is that scientists should not abandon a theory until a superior alternative is available to take its place.
  *   **(ii) Status:** **Defensible.** This is a pragmatic rule of thumb to avoid chaos.
  *   **(iii) License:** **No.** This licenses holding on *until* a better theory appears, but it does not license holding on *indefinitely* if the current theory becomes heuristically sterile. It is a rule for transition, not a rule for stagnation.

  **5. The Sociological Claim (Paradigm Shift)**
  *   **(i) Precision:** "Kill" means *community abandonment*. "Better" means *dominant*. The claim is that theories only die when the scientific community loses faith, which usually requires a new narrative to coalesce around.
  *   **(ii) Status:** **Descriptively True.** This is how science actually works historically.
  *   **(iii) License:** **No.** This is a descriptive claim about history, not a normative claim about entitlement. "The community hasn't left yet" is not a warrant for "I am rational to stay forever."

  ***

  ### Follow-up 1: The Absence of a Rival

  You are right to smell a slide. The claim "there is no better theory available" functions differently depending on whether it is treated as a logical constraint or a historical contingency.

  *   **Logical Structure:** If interpreted as "No logically possible theory exists that fits the data better," this is almost certainly false. There are always infinitely many curves through the data points.
  *   **Historical Contingency:** If interpreted as "No *articulated* theory exists in the current literature," this is a time-indexed fact about the profession, not the world.

  **Can it function as a reason?**
  Yes, but only as a **pragmatic heuristic**, not an **epistemic warrant**.
  *   *Pragmatic:* "I should keep working on this because switching costs are high and I have no alternative tool." (Valid for resource allocation).
  *   *Epistemic:* "I should believe this is true (or worth believing) because nothing else is around." (Invalid. The absence of competition does not increase the truth-value of the incumbent).

  **The Slide:** Your colleague is using the *historical contingency* (nobody has built a rival yet) to justify an *epistemic entitlement* (I am rational to persist indefinitely). The absence of a rival lowers the bar for *when* you might switch, but it does not remove the requirement that your current program must eventually produce *something* (novel predictions) to justify its retention. If the absence of a rival is the only thing keeping the theory alive, the theory is a placeholder, not a research engine.

  ***

  ### Follow-up 2: Lakatos and the "Degenerating" Program

  Your recollection is correct. Lakatos's Methodology of Scientific Research Programmes (MSRP) is more modest than the slogan suggests.

  1.  **Appraisal vs. Decision:** Lakatos distinguished between the *objective status* of a program (progressive or degenerating) and the *subjective decision* of the scientist (when to quit). He explicitly warned against "instant rationality." He did not want scientists abandoning programs at the first sign of trouble.
  2.  **Does this help or hurt him?** It **hurts** him.
      *   Lakatos defines a **progressive** problemshift as one that predicts *novel* facts.
      *   He defines a **degenerating** problemshift as one that only offers *post-hoc* explanations of known facts (adjusting the protective belt to save the core).
      *   Your colleague admits the program hasn't produced a novel prediction since the early 2000s. By Lakatos's own definition, the program is **degenerating**.
  3.  **Is "Degenerating" a criticism?** Yes. It is an objective label of decline. While Lakatos says you aren't *logically forced* to quit immediately, he argues it is *methodologically rational* to shift resources away from degenerating programs toward progressive ones.
  4.  **Can absence of novel predictions kill?** Yes. For Lakatos, a program that ceases to predict novel facts and merely accommodates old ones has lost its "excess empirical content." It hasn't been "falsified" by a fact, but it has been "falsified" by stagnation. The "kill" comes from the **theoretical degeneration**, not an empirical anomaly. Your colleague is claiming the right to continue a degenerating program indefinitely; Lakatos would say he is entitled to try to turn it around, but not entitled to claim it is healthy.

  ***

  ### Follow-up 3: The Ambiguity of "The Theory"

  Your colleague is likely equivoking between three different referents. Here is how the Menu readings survive when we pin down what "Theory" means.

  | Reading | If "Theory" = **Hard Core** (Axioms) | If "Theory" = **Core + Belt** (Specific Models) | If "Theory" = **Whole Programme** (Heuristics + History) |
  | :--- | :--- | :--- | :--- |
  | **1. Duhemian** | **Survives.** Cores are defined as irrefutable by convention. | **Fails.** Specific models with auxiliaries *are* falsifiable. | **Fails.** Programmes are appraised on performance, not just logic. |
  | **2. Conventionalist** | **Survives.** You can always define the core to be true. | **Fails.** Too much surgery on the belt makes the model useless. | **Fails.** A programme that explains everything predicts nothing. |
  | **3. Underdetermination** | **N/A.** Cores aren't usually tested directly. | **Survives.** Multiple models can fit the data. | **Fails.** Programmes are compared on *heuristic power*, not just fit. |
  | **4. Rational Abandonment** | **Fails.** You don't "abandon" cores; you switch programmes. | **Survives.** You should swap models if they stagnate. | **Fails.** This is the level where "indefinite" retention is ruled out if degenerating. |
  | **5. Sociological** | **Survives.** Paradigms (cores) last a long time. | **Fails.** Specific models die quickly. | **Survives.** But this describes history, doesn't justify *his* entitlement. |

  **The Verdict on the Ambiguity:**
  Your colleague is treating "The Theory" as the **Hard Core** when defending against "facts" (Reading 1: cores can't be killed), but treating it as the **Whole Programme** when claiming entitlement to resources (Reading 4: keep going until a rival appears).

  *   **The Trap:** You cannot claim the immunity of the Hard Core while demanding the funding and status of a Progressive Programme.
  *   **The Counter-Move:** Ask him explicitly: "Are you defending the *axioms* of your framework, or the *models* you've built from them?"
      *   If **Axioms:** Agree they can't be killed, but note that axioms without novel predictions are metaphysics, not science.
      *   If **Models:** Remind him that models *are* killed by facts if they fail to predict, and that "no rival" is not a property of the model's truth.
      *   If **Programme:** Remind him that programmes are appraised on *progress*, and a 20-year gap in novel predictions is the definition of degeneration, regardless of rivals.
