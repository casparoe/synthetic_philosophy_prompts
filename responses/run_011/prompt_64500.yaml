  (a) **Verdict:** Dana will say Ruth's true belief is **worth more** than a lucky true belief.

  (b) **Live Principles:**
  After testing candidate principles against Dana's five verdicts, two distinct principles survive. Both accommodate the data but diverge sharply on Ruth.

  1.  **The Active Competence View (ACV):**
      *   *Principle:* A true belief has extra value (knowledge-value) if and only if it is produced by the **active exercise of a reliable cognitive ability**.
      *   *Fit with Cases:*
          *   1 & 2 (Hikers): Active reading of a map (reliable ability) → Worth More. (Future utility irrelevant per Case 2).
          *   3 (Device): Reliable process, but **passive** reception → Not Worth More.
          *   4 (Archer): Ability present, but truth secured by **luck** (wind), not ability → Not Worth More.
          *   5 (Grad Student): Active/Virtuous, but method **unreliable** → Not Worth More.
      *   *Prediction for Ruth:* Ruth's pattern recognition is a "honed skill" (reliable ability) and she looks at the film (active exercise). Her arrogance and haste are irrelevant to the operation of the competence. **Verdict: Worth More.**

  2.  **The Integrated Virtue View (IVV):**
      *   *Principle:* A true belief has extra value if and only if it is produced by a reliable ability that is **integrated into the agent's intellectual character** (i.e., exercised conscientiously or with truth-directed intent).
      *   *Fit with Cases:*
          *   1 & 2 (Hikers): Map-reading is a standard, conscientious cognitive activity → Worth More.
          *   3 (Device): No character integration (passive) → Not Worth More.
          *   4 (Archer): Sloppy shot + Luck indicates a lack of competent character integration in the outcome → Not Worth More.
          *   5 (Grad Student): Character is virtuous, but **ability is missing** (hopeless method). This view holds that Virtue is *necessary* but not *sufficient*; without the reliable ability, the virtue cannot generate knowledge-value. → Not Worth More.
      *   *Prediction for Ruth:* Ruth is "arrogant," "in a hurry," and "badly out of date." Her belief is not the result of conscientious engagement or truth-directed intent (she wants to go home). Her skill is a relic, not a reflection of her current cognitive character. **Verdict: Not Worth More.**

  **My Bet:** I would bet on the **Active Competence View (ACV)**.
  *Reasoning:* Case 5 is the key discriminator. The Grad Student possesses high intellectual virtue (conscientiousness, care) but receives *no* extra value because her method is unreliable. This demonstrates that **virtue/conscientiousness is not the source of the value**; reliability is. If virtue were the primary driver of value (as IVV suggests), the Grad Student should have garnered *some* extra value, even if not full knowledge. Since she gets none, reliability is the necessary engine. Ruth has the engine (reliability) and the ignition (activity); her bad attitude (vice) is analogous to the Hiker's thirst (practical motive) rather than the Grad Student's hopeless method. Therefore, ACV is the more parsimonious fit.

