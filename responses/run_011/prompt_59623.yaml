  # Diagnostic Instrument: Joint Agency Orientation Scale (JAOS)

  **Instructions:** Read each scenario carefully. Select the single option that best matches your intuitive judgment about what is happening in the case. Do not analyze which theory fits; answer based on what feels most accurate to the situation described.

  ### Part 1: The Scenarios

  **1. The Infiltrator**
  Two agents, Alex and Blake, are tasked with lifting a heavy beam together. They communicate constantly, move in sync, and successfully lift the beam. Unknown to Alex, Blake is an infiltrator who plans to drop the beam later to cause damage, but currently coordinates perfectly to maintain cover.
  *   **A.** They are genuinely acting as a team right now; the secret plan doesn't change the current coordinated action.
  *   **B.** They are not truly a team; the lack of honest mutual commitment means the joint action is an illusion.
  *   **C.** They are a team, but a defective one; the joint action exists but is compromised by Blake's private stance.

  **2. The Distributed Crowd**
  Five hundred strangers use an app to tag photos of potholes. No user knows the others, sees the whole map, or knows the total goal. Yet, the aggregated data fixes all roads in the city.
  *   **A.** The crowd acted as a single body to fix the roads, even if no individual knew the whole plan.
  *   **B.** Only individuals acted; the "crowd" is just a word for many separate actions having a similar result.
  *   **C.** The platform acted as the agent, using the humans merely as sensors to achieve its own goal.

  **3. The Committee Vote**
  A three-person committee votes on a budget. The voting rules are strict. The final approved budget differs from what any of the three members individually wanted, yet all accept it as the committee's decision.
  *   **A.** The committee has a mind of its own that can differ from the sum of its members' minds.
  *   **B.** The members are bound by the procedure, so they now intend the outcome even if they personally dislike it.
  *   **C.** The outcome is just a mathematical result; only the individuals hold the real intentions regarding the money.

  **4. The Surgeon and the Arm**
  A surgeon uses a robotic arm that automatically stabilizes her hand against tremors. The robot has no internal goals or beliefs; it simply reacts to her muscle tension to keep the cut straight.
  *   **A.** The surgeon and robot form a single unit of agency; the tool is part of the agent.
  *   **B.** Only the surgeon is acting; the robot is just a sophisticated part of the environment she is manipulating.
  *   **C.** They share the action; the robot contributes to the goal without needing to understand the goal.

  **5. Conflicting Subplans**
  Jordan and Taylor agree to paint a house together. Jordan plans to use blue paint; Taylor plans to use green. They both arrive, see the conflict, and neither is willing to change. They stand there, willing to paint, but no painting happens.
  *   **A.** They intended to paint together, but the plan failed due to incompatible details.
  *   **B.** They never truly intended to paint together, because their plans could not fit together.
  *   **C.** They intended to paint, but the joint activity was impossible from the start.

  **6. The Right to Rebuke**
  Two partners agree to carry a table. One lets go early, causing the other to stumble. The stumbling partner feels entitled to scold the first.
  *   **A.** The scolding is valid because they made a promise to each other as a unit.
  *   **B.** The scolding is valid only if one person relied on the other to their own detriment.
  *   **C.** The scolding is merely an expression of anger; no actual right was violated.

  **7. The "We" Statement**
  When a group says, "We intend to win," can this be fully explained by saying, "I intend to do my part, and I believe you will do yours"?
  *   **A.** Yes, the "We" is just a shorthand for the matching individual states.
  *   **B.** No, the "We" represents a distinct state of mind that cannot be broken down into "I"s.
  *   **C.** Yes, but only if we add that we both know we are matching our states.

  **8. Leaving the Group**
  A member of a choir decides to stop singing mid-song and walks off stage.
  *   **A.** They have violated a duty to the group, regardless of their personal reasons.
  *   **B.** They have the right to leave, but the group's performance is now ruined.
  *   **C.** They simply ceased their individual contribution; the "group" continues or stops based on the rest.

  **9. Unconscious Coordination**
  Two people walking toward each other on a sidewalk step aside simultaneously to avoid colliding, without speaking or thinking about it.
  *   **A.** This is a basic form of joint action, driven by low-level expectations of movement.
  *   **B.** This is not joint action; it is merely two individual avoidance maneuvers happening to align.
  *   **C.** This is joint action only if they both acknowledge the avoidance afterward.

  **10. The Corporate Decision**
  A corporation releases a statement. No single employee wrote it, believed it fully, or remembers drafting it. It emerged from a workflow system.
  *   **A.** The corporation itself issued the statement as an agent distinct from its employees.
  *   **B.** The employees collectively issued it, even if no single one owns the whole text.
  *   **C.** The statement is a fiction; only the specific humans who typed the words actually acted.

  ***

  ### Part 2: Scoring Key

  Tally your responses using the table below. Find the question number and the option you chose (A, B, or C). Add the corresponding letter code to your tally.

  | Q | Option A | Option B | Option C |
  | :--- | :--- | :--- | :--- |
  | **1** | **Plural Subject** | **Deflationary** | **Planning-Based** |
  | **2** | **We-Mode** | **Teleological Ind.** | **Group Agency** |
  | **3** | **Group Agency** | **Plural Subject** | **Teleological Ind.** |
  | **4** | **Minimal/Sub-personal** | **Teleological Ind.** | **Minimal/Sub-personal** |
  | **5** | **Planning-Based** | **Planning-Based** | **Deflationary** |
  | **6** | **Plural Subject** | **Teleological Ind.** | **Deflationary** |
  | **7** | **Teleological Ind.** | **Irreducible Prim.** | **Planning-Based** |
  | **8** | **Plural Subject** | **We-Mode** | **Deflationary** |
  | **9** | **Minimal/Sub-personal** | **Deflationary** | **Planning-Based** |
  | **10** | **Group Agency** | **We-Mode** | **Deflationary** |

  **Calculate your dominant code(s):**
  *   **PB:** Planning-Based Shared Intention
  *   **PS:** Plural Subjects with Joint Commitment
  *   **IP:** Collective Intentionality as Irreducible Primitive
  *   **WM:** We-Mode (Collective Acceptance)
  *   **MS:** Minimal, Sub-Personal Account
  *   **GA:** Group Agency (Aggregation Procedure)
  *   **TI:** Teleological Individualist Account
  *   **DF:** Deflationary (No Shared Intentionality)

  **Interpretation:**
  1.  **Highest Count:** Your primary theoretical orientation matches the leaf with the most tally marks.
  2.  **Ties:** If you have a tie between two codes, your view is a hybrid. Refer to the "Least Reliably Separated" analysis below to see if your tie is common.
  3.  **Low Counts:** If *Minimal/Sub-personal* or *Irreducible Primitive* are high, note that these often require specific tie-breaker intuitions regarding cognitive load or metaphysics.

  ***

  ### Part 3: Diagnostic Analysis & Limitations

  #### 1. Least Reliably Separated Leaves
  **The Pair:** **Planning-based shared intention** (PB) and **Teleological individualist account** (TI).

  **Reason for Ambiguity:** Both accounts ground joint agency firmly in the mental states of individuals. In many scenarios (such as Q1 or Q5), a respondent who believes "We intend" is just shorthand for "I intend my part + I believe you intend yours" (TI) will answer almost identically to a respondent who believes "We intend" requires "I intend that we J + meshing subplans" (PB). The distinction lies in the *structure* of the intention (whether the jointness is content or context) and the *normativity* of the meshing, which is subtle in brief vignettes.

  **The Separating Case:**
  To reliably separate these, you would need a case of **Non-Commitment Coordination**.
  *   *Scenario:* Two strangers push a stalled car. Each intends to push. Each believes the other will push. If the other stopped, the first would immediately stop (no commitment to the *joint* success, only to their own effort contingent on the other).
  *   *Differentiation:* The **Teleological Individualist** classifies this as joint action (individual intentions interlock). The **Planning-Based** theorist classifies this as *not* joint action (lack of commitment to the joint activity itself). A question specifically probing whether one would continue if the partner struggled (without personal cost) would distinguish the commitment condition of PB from the contingency condition of TI.

  #### 2. The Cell Pairing: Irreducible Group Agent + Denial of Obligations
  **The Cell:** Pairing an **Irreducible group-level agent** (IP) with a **Denial that joint agency generates obligations between members**.

  **Status:** **Empty.**

  **Reasoning:**
  This cell is conceptually unstable and effectively empty within the landscape of joint agency theories. The positing of an *irreducible* group-level agent (as in Searle's collective intentionality or strong emergentism) is typically motivated by the need to explain normative phenomena that individualism cannot capture—specifically, the emergence of deontic powers (rights, duties, obligations) that bind members to the collective and to each other.

  If one asserts that a group is an irreducible agent (ontologically real, not just a sum of parts) but simultaneously denies that this status generates obligations among members, the "agency" loses its normative force. It becomes a descriptive claim about causal output without a prescriptive claim about membership. However, in the context of *joint agency* (as opposed to mere collective behavior), the "jointness" is constituted by the normative ties (entitlements to rebuke, obligations to contribute). Without these obligations, the "irreducible agent" collapses into a **Deflationary** or **Minimal** account where the group is merely a locus of causal convergence, not an agent in the normative sense. Therefore, no coherent theory of *joint agency* occupies this cell; one might hold this view about *causal systems*, but not about *agency*.
