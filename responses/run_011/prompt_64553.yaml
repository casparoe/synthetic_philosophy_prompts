answer: |-
  **Brainstorming**
  1.  **Epidemiologist:** E = infection rate in a cohort. *Strain:* Biological data rarely sustains P(E)=1 due to inherent sampling error and revision.
  2.  **Actuary:** E = historical claim frequency. *Strain:* Actuaries model uncertainty explicitly; assigning P(E)=1 contradicts professional standards of risk.
  3.  **Materials Engineer:** E = physical constant of an alloy. *Commitment:* Handbook values are treated as certain facts for design; doubting them invalidates safety certifications.

  ***

  **The Thought Experiment**

  Dr. Aris Thorne, a materials engineer, has designed pressure vessels using Alloy X-45 for five years. Her evidence base $K$ contains the thermal expansion coefficient $\alpha = 12.5 \times 10^{-6} K^{-1}$, measured daily and logged in her lab's immutable database; for Thorne, $P(E)=1$, as doubting $E$ would invalidate every prior safety certification she has signed. She treats $E$ not as a hypothesis but as a fixed parameter of the material's identity, re-measured periodically to confirm stability, never to update probability.

  Last month, Thorne formulated the "Phonon-Trap" theory ($T$), positing a specific lattice impurity structure. After three weeks of derivation, she proved $T \rightarrow E$. $T$ also predicts novel brittleness at 400K. Her hypothesis space includes a rival, "Dislocation-Slip" ($T'$), assigned the same prior $P(T)=P(T')=0.1$, which accommodates $E$ only within a broad range ($P(E|T')=0.5$). Intuitively, discovering $T$ entails $E$ boosts $T$'s credibility relative to $T'$, yet her current probability assignments offer no formal mechanism for this boost, as $E$ cannot confirm what is already certain.

  ***

  **Analysis**

  (1) **Arithmetic:** By strict conditionalization, $P_{new}(T) = P(T|E) = \frac{P(E|T)P(T)}{P(E)} = \frac{1 \cdot 0.1}{1} = 0.1$. The formal posterior equals the prior. The gap is between this 0.1 and the intuitive support (approx. 0.18) $T$ should gain over $T'$ given it entails $E$ while $T'$ does not.

  (2) **Standard Maneuvers:**
  *   *Conditionalizing on entailment:* Fails. Thorne cannot treat the logical relation "$T \rightarrow E$" as a new contingent proposition; for her, logical truths are not evidence subject to updating.
  *   *Lowering P(E):* Fails. Killed by the "safety certification" stipulation. She cannot counterfactually uncertainty a fact without admitting professional liability for past designs.
  *   *Excising E:* Fails. Removing $E$ from $K$ renders $T$ uninterpretable; $T$ was constructed specifically to explain known material properties, not unknown ones.

  (3) **Key Stipulation:** The constraint that $P(E)=1$ is constitutive of her professional role (safety certification). If deleted, $P(E)$ drops below 1, standard Bayesian updating proceeds, and the problem vanishes.

  (4) **Objection & Judgment:** A Bayesian objector will argue: "No rational agent assigns 1 to empirical claims; Thorne is simply irrational." **Judgment:** Unfair. This prescribes idealized norms that ignore the phenomenology of engineering practice, where calibrated constants *must* be treated as certain to function. The problem is not logical but institutional.
