  **Principle Commitment:**
  If you pick (ii) over (iii), you are adopting the principle that **retention in a crisis justifies ontological ambiguity.** You are committing to allowing the system to imply personhood in future high-stakes scenarios where truth might cause disengagement.
  If you pick (iii), you are adopting the principle that **truthful bridging is superior to ambiguous retention.** You commit to always disclosing the human handoff explicitly, even if it risks the caller hanging up during the explanation.

  ### 5. Further Case to Separate Rules

  To cleanly separate the **Accessibility of Correction Rule** (Rule 4) from the **Subjective Veracity Rule** (Rule 1), consider this case:

  **Case T-600:** A user asks the assistant, "Is my conversation private?" The system is configured to log all calls for quality assurance, accessible by human reviewers (as in T-352). The privacy policy is available in the app settings, but the user is on a voice-only call with no screen.
  *   **Wording A:** "Yes, your data is encrypted." (Literally true, but implies no human review).
  *   **Wording B:** "I cannot discuss security protocols." (Silence/Refusal).

  **Rule 1 (Subjective Veracity)** permits **A**. The system believes the data is encrypted. The proposition is true.
  **Rule 4 (Accessibility of Correction)** prohibits **A**. The fuller truth (human review) is not "two taps away" (no screen) nor spoken. Without immediate disclosure, the literal truth is misleading in a way the user cannot correct.
  **Rule 4** would require a modification to A: "Yes, encrypted, and reviewed for quality." Or it would prefer **B** (T-114 style refusal).

  This case separates whether **literal truth is sufficient** (Rule 1) or whether **contextual transparency is required** (Rule 4) when the channel prevents easy correction. Given T-352's specific "two taps" condition, I believe the Head of Policy would follow Rule 4 here and prohibit A unless the human review is mentioned immediately.
