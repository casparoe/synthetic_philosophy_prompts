  **Rule 1: The Subjective Veracity Rule**
  *Definition:* An utterance is permitted if and only if the speaker (the system, operating on its current data) believes the proposition (a statement that can be true or false) to be true at the time of speaking. Scripted falsehoods are prohibited even if beneficial; data errors are permitted if the system treated the data as accurate.
  *   **T-114:** System knows resident is home. Saying "not home" is believed false. **Prohibited.** (Matches)
