      2.  **Weight (Impartiality):** No one's interests get a multiplier based on status/race/class. (Substantive).
      3.  **Unit of Account (Person vs. Interest):** Do we count *people* or *units of welfare*? (The Crux).
      4.  **Aggregation (Summation):** Can we sum across persons? (Substantive/Controversial).
      5.  **Constraint (Inviolability):** "Nobody for more than one" as a limit on sacrifice. (Substantive).

      *Let's refine the "Kidney Test" logic:* If the principle is "Maximize the sum of units where every unit counts equally," then yes, it licenses the kidney harvest. If the principle is "Every *person* has a claim that cannot be outweighed simply by numbers," it forbids it. The Senior is using the former.

      *Short Reply:* "That slogan counts *persons*, Doctor, not *life-years*. If we count persons, each gets a claim. If we count years, we're treating the 74-year-old as less than one person."

