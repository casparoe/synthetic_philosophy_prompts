      *   *Check:* Minimality. The only difference is the source of the DLPFC activation (Bottom-up vs. Top-down/TMS) and the presence of the Stimulus/V1 activity.

  8.  **Final Polish:**
      *   Ensure the distinction between "belief" and "experience" is addressed in the HOT derivation.
      *   Ensure the FOR derivation emphasizes the lack of world-directed content.
      *   Make sure the "Asymmetric Result" is clear.

      *(Self-Correction on Minimality)*: To be truly minimal, the subject's behavior (button press) should be the same. The difference is the *cause* of that behavior and the *neural substrate*.
      *   Scenario 1: Stimulus -> V1 -> PFC -> Report + Pupil.
