          7.  Tone: Professional, precise, non-strawman (advocates would sign off). No citations.

  2.  **Deconstruct the Theoretical Conflict:**
      *   **First-Order Representationalism (FOR):** Consciousness = First-order representation of the world (with appropriate functional role/global availability). If the world-representation is gone, consciousness is gone.
      *   **Higher-Order Theory (HOT):** Consciousness = Higher-order representation of a mental state. If the HOT is present, consciousness is present, even if the first-order state is degraded or absent (leading to illusion of consciousness).
      *   **The Crux:** The "Targetless HOT" case. Can you have a conscious experience without the relevant first-order sensory state?
          *   HOT says: Yes (illusion of consciousness).
          *   FOR says: No (no content, no experience).
      *   **The Challenge:** Making this empirically tractable without relying on verbal report (which confounds belief with experience).

  3.  **Drafting the Minimal Pair (Iterative Process):**
      *   *Idea 1: Blindsight.*
