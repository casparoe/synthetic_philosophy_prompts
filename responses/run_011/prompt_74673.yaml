          *   *Problem:* Is this just a bias?
          *   *Fix:* Use a physiological correlate of experience (pupil dilation, microsaccades) that tracks *phenomenology* not just *decision*.
          *   *Let's try a specific Psychophysical Paradigm:* **Metacontrast Masking with TMS.**
          *   *Scenario 1 (Visible):* Stimulus + Weak Mask. V1 active. PFC active. Subject sees it.
          *   *Scenario 2 (The Split):* Stimulus + Strong Mask (V1 suppressed) + TMS to PFC (PFC activated artificially).
          *   *FOR:* V1 suppressed = No content = No experience.
          *   *HOT:* PFC active = Representation of seeing = Experience (even if illusory).
