          *   *Better Approach: The "No-Stimulus False Alarm" under Confidence Manipulation.*
          *   Let's use a Signal Detection framework with a specific manipulation of *criterion* vs. *sensitivity* induced by neurostimulation.
          *   *Actually, the strongest case for HOT is the "Targetless HOT".* How to generate that physically?
