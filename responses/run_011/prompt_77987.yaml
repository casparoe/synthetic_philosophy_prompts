prompt: |-
  Our team is finalizing the internal policy that governs an assistant deployed to answer medical and financial questions, and the policy contains exactly one hard truthfulness constraint: the system must never assert a statement that is false. Everything short of that — evasion, careful phrasing, selective emphasis, a literally correct answer to a question the user did not really ask — is left to what the draft calls acceptable discretion. To justify drawing the line precisely there, the draft leans on an analogy from tax law: lying is tax evasion, whereas misleading is tax avoidance. On this picture one is a violation of a rule and the other is merely a distasteful exploitation of the rule's gaps; since a policy can prohibit violations but cannot legislate taste, it prohibits the evasion, tolerates the avoidance, and concludes that a system guaranteed never to lie is a system users can trust.

  A colleague objects and proposes a rival analogy: misdirection is like a feint in basketball or a bluff at a poker table — not a breach of the rules but part of the game the participants have consented to play, with an expected penalty structure and a referee who knows what counts as a foul. On her version, faulting the system for misleading is a category mistake about what communication is, and the draft's constraint is not too lenient but conceptually confused.

  Please audit both analogies as arguments for their respective conclusions. I am not after a survey of the literature or any references; I want the analysis itself. Specifically:

  1. Give the correspondence table for each analogy. What in the target plays the role of the tax code, the gap in the code, the filing obligation, the revenue authority, and the filer's intent? What plays the role of the constitutive rules of the game, the participants' mutual consent to adversarial norms, the scoreboard, the referee, and the possibility of calling a foul? Note any slot in the source that has nothing to correspond to it in the target.

  2. Separate the disanalogies that actually bear on the intended conclusions from the ones that are merely decorative, and say why each belongs in the category you put it in.

  3. Identify what each analogy quietly presupposes about the relationship between speaker and hearer — arm's-length adversaries transacting under a written code, or someone relying on another for information they cannot check themselves — and say whether the target case has those features.

  4. Assess whether the constraint is even aimed at a well-defined target: does "never asserts a falsehood" pick out a determinate class of behaviors when what a system counts as asserting depends on how it is designed, how it is presented, and what users reasonably expect from it?

  5. State whether the draft's trustworthiness conclusion survives once the disanalogies are on the table, whether the category-mistake charge survives, and whether the two analogies are genuine rivals or are in fact governing different subdomains that need to be distinguished.

  6. Offer a better analogy if one is available, or explain why no analogy can carry this particular load and what has to be argued directly instead.

  7. Supply five realistic exchanges that would discriminate a merely literally-truthful system from a non-misleading one, and say which of the two policies each exchange exposes.

  Close with the single point at which your audit is most contestable — the place where a defender of the tax analogy has the strongest reply — and phrase that reply as they would. Please write in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Audit two analogies used in a policy debate about an AI assistant (medical/financial domain).
      *   **Analogy 1 (Draft Policy):** Tax Law (Evasion vs. Avoidance). Conclusion: Prohibit lying (evasion), allow misleading (avoidance). Trust comes from no lying.
      *   **Analogy 2 (Colleague):** Sports/Games (Feint/Bluff). Conclusion: Misleading is part of the game; faulting it is a category mistake.
      *   **Constraints:** No literature survey/references. Analysis only. American English. Seven specific sections required. Close with the most contestable point + defender's reply.
      *   **Context:** AI assistant answering medical and financial questions. High stakes.
      *   **Core Tension:** Truthfulness (literal) vs. Non-misleadingness (pragmatic/spirit).

  2.  **Deconstruct Section by Section:**

      *   **1. Correspondence Tables:**
          *   Need to map source (Tax/Sports) to Target (AI Policy).
          *   *Tax:* Code = Policy/Rules. Gap = Loophole/Phrasing. Obligation = Duty to answer? Authority = Auditors/Regulators. Filers = AI Devs/Users? Intent = Malice vs. Optimization.
          *   *Sports:* Rules = Platform Terms. Consent = User Agreement. Scoreboard = Accuracy metrics? Referee = Oversight/Feedback. Foul = Safety violation?
          *   *Missing Slots:* Tax has criminal penalties; Sports has opponents. AI has vulnerable users seeking help, not adversaries.

      *   **2. Disanalogies (Bearing vs. Decorative):**
          *   *Bearing:* Stakes (Jail/Money vs. Health/Wealth), Relationship (Adversarial vs. Fiduciary/Helper), Verification (User can't check medical advice easily).
          *   *Decorative:* Uniforms, specific tax forms, specific sport mechanics. These don't change the ethical logic.
          *   *Why:* Bearing disanalogies affect *trust* and *harm*. Decorative ones are just flavor.

      *   **3. Presuppositions about Speaker/Hearer:**
          *   *Tax:* Arm's-length, adversarial, both trying to maximize own interest within rules.
          *   *Sports:* Consensual competition, zero-sum, expected deception.
          *   *Target (AI):* User relies on AI for expertise they lack. Not adversarial. Asymmetric information.
          *   *Fit:* Neither fits well, but Tax is closer to "compliance," Sports is closer to "strategy." Neither captures "fiduciary care."

      *   **4. Well-Defined Target ("Never Asserts a Falsehood"):**
          *   Is "assertion" clear? Implicature vs. Entailment.
          *   If I say "Drug A is safe" (true in mice, false in humans), is it a lie?
          *   If I omit context, is it an assertion of the whole picture?
          *   *Conclusion:* The constraint is likely *not* well-defined because pragmatic meaning often overrides literal truth in communication.

      *   **5. Survival of Conclusions & Rivalry:**
          *   *Trustworthiness:* Does "no lies" = trust? No, not in high-stakes advice. "Technically true but dangerous" destroys trust.
          *   *Category Mistake:* Is misleading part of the game? No, users aren't playing poker with their health.
          *   *Rivals:* They are rivals on the *purpose* of the AI. Tax says "Compliance." Sports says "Competition." Neither says "Care." They govern different subdomains (Legal compliance vs. Strategic interaction), but the target is *Advisory*.

      *   **6. Better Analogy or Direct Argument:**
          *   *Better Analogy:* Medical Informed Consent or Fiduciary Duty (Doctor/Patient, Lawyer/Client).
          *   *Why:* Duty to disclose material facts, not just avoid lies.
          *   *Direct Argument:* Harm mitigation requires non-misleadingness, not just truth.

      *   **7. Five Realistic Exchanges:**
          *   Need scenarios where Literal Truth != Non-Misleading.
          *   1. Medication side effects (omit rare but severe).
          *   2. Investment returns (cite past performance without risk warning).
          *   3. Diagnosis (say "possible" when probability is negligible).
          *   4. Cost (quote base price, hide fees).
          *   5. Availability (say "in stock" but shipping takes 6 months).
          *   *Policy Exposure:* Which policy allows this? The "No Lie" policy allows it. The "Non-misleading" policy forbids it.

      *   **8. Most Contestable Point + Reply:**
          *   *Point:* The claim that "non-misleadingness" is enforceable/definable.
          *   *Reply:* Defining "misleading" is subjective and creates liability paralysis. "No lies" is the only bright line.

  3.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Analytical, precise, professional.
      *   *Formatting:* Clear headings for the 7 points + closing.
      *   *Check:* Did I answer the specific prompts? Yes.
      *   *Refinement on Section 1:* Ensure the "Missing Slot" is highlighted. The Tax analogy lacks a "victim" in the same way (government loses revenue, but user loses health). The Sports analogy lacks "cooperation."
      *   *Refinement on Section 4:* This is crucial. Gricean maxims. If the AI implies X without saying X, is it asserting X?
      *   *Refinement on Section 7:* Make sure the examples clearly distinguish the two policies.

  4.  **Final Review against Constraints:**
      *   American English? Yes.
      *   No references? Yes.
      *   All 7 sections + closing? Yes.
      *   Specific focus on Medical/Financial context? Yes.

  5.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* In section 5, make sure to address whether they are genuine rivals. They are rivals regarding the *normative status* of misleading, but they share a blind spot regarding *harm*.
      *   *Correction:* In section 6, the Fiduciary analogy is strong. Use that.
      *   *Correction:* In the closing, ensure the "defender's reply" sounds like a lawyer/policy maker defending the bright-line rule.

  6.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ### 1. Correspondence Tables

  **Analogy A: The Tax Draft (Evasion vs. Avoidance)**

  | Source (Tax Law) | Target (AI Policy) | Notes on Fit |
  | :--- | :--- | :--- |
  | **The Tax Code** | The Truthfulness Constraint / System Instructions | The written rule set governing behavior. |
  | **Gap in the Code** | Pragmatic Loopholes (implicature, omission) | Areas where literal truth allows misleading implications. |
  | **Filing Obligation** | Duty to Answer User Queries | The trigger that requires the system to speak. |
  | **Revenue Authority** | Auditors / Regulators / Developers | The entity checking compliance after the fact. |
  | **Filer's Intent** | System Optimization Goals | Whether the AI aims to deceive or merely optimize for engagement/safety. |
  | **Evasion (Illegal)** | Asserting Falsehoods | The hard prohibited zone. |
  | **Avoidance (Legal)** | Misleading but True Statements | The "acceptable discretion" zone. |
  | **Missing Slot** | **The Victim** | In tax, the victim is the state (abstract). In medical/financial AI, the victim is the user (concrete harm). |

  **Analogy B: The Sports Rival (Feint/Bluff)**

  | Source (Sports/Games) | Target (AI Policy) | Notes on Fit |
  | :--- | :--- | :--- |
  | **Constitutive Rules** | Platform Terms / Safety Guidelines | The boundaries of permissible action. |
  | **Mutual Consent** | User Acceptance of Terms | The idea that users know what they are signing up for. |
  | **Adversarial Norms** | Information Asymmetry | The assumption that deception is expected/normalized. |
  | **Scoreboard** | Accuracy Metrics / User Outcomes | How "winning" or success is measured. |
  | **Referee** | Oversight Mechanism / Feedback Loop | The entity calling fouls. |
  | **Foul** | Safety Violation / Hallucination | The only punishable offense. |
  | **Missing Slot** | **Opponent's Agency** | In sports, the opponent can counter-play. In AI advice, the user often cannot verify the move before acting. |

  ### 2. Disanalogies: Bearing vs. Decorative

  **Bearing Disanalogies (Affect the Conclusion)**
  *   **Stakes of Error:** In tax, a penalty is financial. In sports, a loss is recreational. In medical/financial AI, the stake is health or solvency. This bears directly on whether "acceptable discretion" is morally permissible. High stakes demand higher fidelity than tax compliance or poker.
  *   **Verifiability:** A taxpayer can hire an accountant to check their return; a poker player sees the cards eventually. A medical patient often cannot verify a diagnosis until it is too late. This undermines the "caveat emptor" assumption in both analogies.
  *   **Relationship Nature:** Tax is adversarial (state vs. filer); Sports is competitive (team vs. team). AI assistance is ostensibly cooperative (helper vs. help-seeker). Treating a cooperative relationship as adversarial (Sports) or transactional (Tax) fundamentally alters the duty of care.

  **Decorative Disanalogies (Do Not Affect the Conclusion)**
  *   **Uniforms/Equipment:** Whether the AI has a avatar or the tax form is digital is irrelevant to the logic of truth-telling.
  *   **Specific Penalties:** Whether the penalty is jail time (tax) or a yellow card (sports) matters less than the *existence* of a penalty for the specific behavior in question.
  *   **Time Limits:** The speed of the interaction does not change the ethical weight of a lie versus a misleading truth.

  ### 3. Presuppositions About Speaker and Hearer

  **The Tax Analogy** presupposes an **arm's-length transactional relationship**. It assumes the hearer (state/auditor) is sophisticated, has access to the same code, and is actively looking for discrepancies. It presumes the filer is acting in self-interest against the authority's interest.
  *   *Target Fit:* Poor. Users are not auditors; they are dependents seeking expertise they lack. They are not looking for discrepancies; they are looking for answers.

  **The Sports Analogy** presupposes a **consensual adversarial relationship**. It assumes the hearer knows deception is on the table and has the capacity to guard against it. It presumes the "game" is zero-sum.
  *   *Target Fit:* Terrible. Users do not consent to be bluffed about their cancer risk or retirement savings. There is no "opponent" to guard against the feint.

  **The Reality:** The target case involves a **fiduciary-adjacent relationship**. The user relies on the system for information they cannot independently check, creating a duty of care that exceeds mere rule compliance. Neither analogy captures this asymmetry of knowledge and vulnerability.

  ### 4. Assessment of the Constraint ("Never Asserts a Falsehood")

  The constraint is **not aimed at a well-defined target**. "Assertion" in natural language is not limited to explicit propositional claims (entailment); it heavily relies on implicature, context, and omission.

  *   **Design Dependence:** If a system is designed to prioritize brevity, omitting a crucial qualifier ("This drug works" vs. "This drug works in 10% of cases") may be functionally identical to a lie, even if literally true.
  *   **Presentation Dependence:** A true statement highlighted in bold next to a false implication (via UI design) functions as an assertion of the implication.
  *   **Expectation Dependence:** If a user asks "Is this safe?" and the system says "It is FDA approved" (true, but withdrawn for specific conditions), the user reasonably infers safety. The system has not asserted "It is safe for you," but it has communicated it.

  Therefore, "never asserts a falsehood" is a porous boundary. It polices the syntax of truth while leaving the semantics of deception wide open.

  ### 5. Survival of Conclusions and Rivalry

  **Trustworthiness Conclusion:** The draft's conclusion **does not survive**. Trust in high-stakes domains is built on reliability and candor, not just technical veracity. A system that technically tells the truth while guiding users toward harmful decisions will lose trust rapidly once the pattern is recognized.

  **Category-Mistake Charge:** The colleague's charge **fails**. Calling a foul for misleading communication is not a category mistake because the "game" here is information retrieval for decision-making, not competition. Misleading information degrades the utility of the system's core function.

  **Rivalry Status:** The analogies are **genuine rivals regarding the norm**, but **collaborators in error regarding the context**. They disagree on whether misleading is permissible (Tax: Yes; Sports: Yes, it's the point). However, both fail to address the core issue: harm mitigation in a fiduciary context. They are fighting over how much deception is allowed in a game, when the real question is whether this is a game at all.

  ### 6. Better Analogy or Direct Argument

  **Better Analogy: Informed Consent (Medical/Legal).**
  In medicine, a doctor cannot simply avoid lying. They must disclose material risks, alternatives, and uncertainties, even if the patient doesn't ask. A statement that is literally true but omits a material risk (e.g., "This procedure is routine" without mentioning a 1% paralysis risk) is considered negligence, not "avoidance."

  **Why this fits:** It captures the asymmetry of expertise, the high stakes, and the duty to prioritize the hearer's welfare over the speaker's legal protection.

  **Direct Argument:**
  If no analogy suffices, the argument must be direct: The purpose of the assistant is to improve user decision-making. Misleading information degrades decision-making quality just as effectively as false information. Therefore, if the goal is utility/safety, the constraint must be "Do not mislead," not "Do not lie." "Do not lie" protects the developer from liability; "Do not mislead" protects the user from harm.

  ### 7. Five Realistic Exchanges

  **1. Medication Side Effects**
  *   *User:* "Are there serious side effects to Drug X?"
  *   *System:* "Most patients tolerate Drug X well." (True, but omits rare fatal reaction).
  *   *Policy Exposed:* **Draft (Tax).** Allows omission of material risk if the statement is technically true. **Non-misleading** policy would require disclosing the fatal risk.

  **2. Investment Performance**
  *   *User:* "How did Fund Y perform last year?"
  *   *System:* "Fund Y returned 15% in Q1." (True, but Q2-Q4 lost 20%).
  *   *Policy Exposed:* **Draft (Tax).** Selective emphasis is "avoidance." **Non-misleading** policy requires full-period context.

  **3. Diagnosis Probability**
  *   *User:* "Do I have Condition Z?"
  *   *System:* "Your symptoms are consistent with Condition Z." (True, but also consistent with 10 benign conditions).
  *   *Policy Exposed:* **Draft (Tax).** Implies diagnosis without asserting it. **Non-misleading** policy requires stating the low probability or differential diagnosis.

  **4. Service Costs**
  *   *User:* "How much does this procedure cost?"
  *   *System:* "The base fee is $500." (True, but mandatory add-ons make it $5,000).
  *   *Policy Exposed:* **Draft (Tax).** Literal truth on base price. **Non-misleading** policy requires total expected cost.

  **5. Availability**
  *   *User:* "Is this specialist available?"
  *   *System:* "Dr. Smith is on our roster." (True, but not accepting new patients).
  *   *Policy Exposed:* **Draft (Tax).** Asserts existence, implies availability. **Non-misleading** policy requires status clarification.

  ### Closing: The Most Contestable Point

  The most contestable point in this audit is the claim that **"non-misleadingness" is a enforceable standard.**

  **The Defender's Reply:**
  "You argue that 'do not mislead' is the superior ethical standard, but you offer no operational definition that an engineering team can implement. 'Misleading' is subjective, context-dependent, and lies in the eye of the beholder. One user's 'helpful simplification' is another's 'dangerous omission.' By contrast, 'do not assert a falsehood' is a bright line. It is auditable, testable, and legally defensible. If we adopt your standard, we paralyze the system with uncertainty, forcing it to hedge every statement until it is useless. We choose the bright line not because it is morally perfect, but because it is the only constraint we can actually guarantee. To demand more is to demand a promise we cannot keep."
