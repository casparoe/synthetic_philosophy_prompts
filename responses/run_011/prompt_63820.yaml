          *   Then the argument.
          *   Hard cap: 700 words.
          *   Tone: Careful, philosophical, experienced with PA.

  2.  **Brainstorming Candidate Positions:**
      *   *Platonism/Realism:* Everything exists in the cumulative hierarchy. Banach-Tarski is just as real as a basis. The "exotic" label is psychological/pragmatic, not ontological. Lean's ledger is just tracking computational content, not existence.
      *   *Instrumentalism/Pragmatism:* Existence = utility. Zorn is okay because it proves things about *computable/tame* objects (Hahn-Banach). Banach-Tarski is weird because it doesn't help physics/analysis much.
      *   *Constructivism:* Rejects actual infinity/choice. Informal practice is inconsistent here.
      *   *Multiversism:* Some universes have AC, some don't. Informal practice assumes a specific "standard" model where AC holds but pathologies are ignored.
      *   *Deflationary/Structuralism:* Existence is just consistency within a structure.

      *Ruling out:* Pure Constructivism is ruled out by the casual use of Zorn. Pure Fictionalism is ruled out because mathematicians believe they are discovering truths, not making up stories. Multiversism is too sophisticated for informal practice (which assumes *the* universe).
      *Commitment:* A nuanced **Pragmatic Realism**. Ontologically realist (objects exist), but epistemically stratified (some objects are "accessible" or "stable," others are "wild"). The distinction isn't existence vs. non-existence, but *integration* vs. *isolation*.

  3.  **Drafting - Section by Section:**

      *   **Bottom Line:** Informal practice presupposes a pragmatic realism: all choice-derived objects ontologically exist, but they are epistemically stratified by their utility in deriving stable consequences about tame structures. The apparent incoherence is not logical but methodological; Lean makes explicit the computational cost that informal math hides for efficiency.
      *   **Argument Body:**
          *   Address the Zorn vs. Banach-Tarski discrepancy. It's not about existence (both exist in ZFC), but about *robustness*. Maximal ideals stabilize algebra; Vitali sets destabilize measure theory.
          *   Address Lean. Lean's `noncomputable` isn't saying "doesn't exist," it's saying "cannot be executed." Informal math ignores computability because it cares about truth preservation, not algorithm extraction.
          *   Evaluate Rivals.
              *   *Constructivism:* Ruled out by practice (Zorn is ubiquitous).
              *   *Fictionalism:* Ruled out by attitude (mathematicians treat theorems as true, not useful fictions).
              *   *Multiversism:* Too complex for informal practice (which assumes a single background ZFC).
              *   *Realism:* Fits best, but needs the pragmatic layer to explain the "exotic" label.
          *   Coherence: The department is coherent if viewed as prioritizing *structural stability* over *ontological purity*. They license the decomposition but quarantine it because it doesn't interfere with theorems about Lebesgue measurable sets (which are the focus).
          *   Implications of Change.
              *   *Constructive:* Textbooks would shrink (no Hahn-Banach in full generality). Proofs become algorithms. Lean's ledger becomes the standard.
              *   *Multiverse:* Textbooks would specify models ("In V where AC holds..."). Proofs become relative. Lean would need universe polymorphism for axioms.

