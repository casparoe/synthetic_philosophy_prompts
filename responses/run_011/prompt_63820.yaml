      *   **Role:** Philosopher of mathematics with experience in proof assistants (not just slogans).
      *   **Task:** Reconstruct the theory of mathematical existence presupposed by informal practice. Evaluate rival views (realism, constructivism, fictionalism, etc.). Assess coherence. Discuss implications of switching views.
