prompt: |-
  I'm a third-year math major taking a set theory course this term and also messing around with Lean on the side, and something keeps bugging me that I don't think my professors would have patience for. Please act as a philosopher of mathematics who has actually spent time inside a proof assistant — not someone who only knows the slogans — and think this through carefully. Start with a few lines of brainstorming where you list the candidate positions you might land on and rule some out, then commit.

  Here's the pattern. In my algebra and functional analysis classes, nobody loses a second of sleep over Zorn's lemma. Need a basis for an infinite-dimensional vector space? Zorn. Need a maximal ideal in a ring with unit? Zorn. Need to extend a bounded linear functional without increasing its norm? Zorn. You write the three lines, cite the lemma, and the resulting object gets used as though it were a perfectly ordinary inhabitant of the mathematical universe — no asterisk, no hedge. But in the same building, the Banach–Tarski decomposition is introduced under the word "paradox" and framed as a cautionary tale about what choice permits; non-principal ultrafilters on the naturals get their existence proved once and then treated as exotic furniture; and the people who study definable sets of reals quietly confine themselves to collections built in tame ways, on the understanding that with full choice there are subsets of the line nobody can assign a measure to, while the tame ones always behave.

  Then there's the software. In Lean you have to tag a definition `noncomputable` when it leans on choice, and there's a command that prints out exactly which axioms a given theorem transitively depends on — so the library keeps a literal ledger saying this result used Classical.choice and that one didn't. The proof assistant refuses to let the distinction stay invisible, which is the opposite of how my analysis lectures handle it.

  So what I want: reconstruct the theory of mathematical existence that the informal practice actually presupposes. Is it realism about the cumulative hierarchy, in which case the ledger and the squeamishness look like pure psychology, since a Vitali set is out there just as firmly as a maximal ideal? Or is it something closer to existence-as-tractability — the view that a choice-produced object earns its keep only insofar as it delivers theorems about tame objects that we'd want anyway? Say explicitly which rival views the practice rules out or at least strains against (intuitionism, constructivism, fictionalism, structuralism, the multiversist picture where the choice-friendly and choice-shy universes just coexist), and separate what the practice strictly requires from what it merely happens to fit comfortably. Tell me whether the department's stance is internally coherent or whether it simultaneously licenses "the decomposition exists" and "don't think about it." And finish with what would actually have to change — in textbooks, in what counts as a proof, in Lean's ledger — if we swapped the implicit view for a constructive one or for the multiverse one.

  Format: lead with your bottom line in two or three sentences, then the argument. Hard cap of 700 words, please dont go over, I have a problem set due.
