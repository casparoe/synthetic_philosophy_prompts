      Argument:
      Your professors operate under a tacit distinction between *ontological commitment* and *structural integration*. When they invoke Zorn's Lemma for a basis, they assert the object exists in the cumulative hierarchy $V$. When they label Banach–Tarski "paradoxical," they are not denying its existence but noting its failure to integrate with measure-theoretic intuition. The view is realist: the Vitali set is as real as the integers. However, it is pragmatically filtered: objects are valued by their ability to support further inference about "concrete" mathematics (analysis, algebra) without introducing instability.

      This explains the Lean discrepancy. Lean's `noncomputable` tag does not signify non-existence; it signifies non-extractability. In constructive type theory, existence implies constructibility. In classical set theory (and informal practice), existence implies consistency within ZFC. The ledger tracks computational content, which informal math discards as irrelevant to truth preservation. Your department hides the axiom usage because, for their purposes, the *truth* of the implication matters, not the *algorithm* witnessing it. Lean forces transparency because its goal includes verification and execution; informal math aims at structural understanding.

      Which rival views does this strain against?
      1.  **Constructivism:** Strictly ruled out. The casual use of Zorn confirms a commitment to classical logic and impredicative definitions.
      2.  **Fictionalism:** Ruled out by attitude. Mathematicians do not treat Zorn-derived theorems as useful fictions; they treat them as truths about mind-independent structures.
      3.  **Multiversism:** Strained. Informal practice assumes a single background universe ("the" category of sets). Multiversism requires specifying which $V$ we inhabit, which would bog down every lecture.
      4.  **Naive Realism:** Strained. If all sets were equally "real" in a qualitative sense, the squeamishness about Vitali sets would be inexplicable. The practice requires a *graded* realism.

      Is the stance coherent? Yes, if understood as a quarantine strategy. They license "the decomposition exists" because it follows from ZFC. They say "don't think about it" because it lies outside the substructure of measurable sets where analysis operates. It is coherent to assert $P$ while restricting attention to a domain where $P$ is inert. The inconsistency is only pedagogical, not logical.

      What would change if we swapped views?
      **To Constructivism:** Textbooks would fracture. Hahn–Banach would vanish or weaken. Proofs would become algorithms. Lean's ledger would become the standard notation; `noncomputable` would be forbidden in core analysis. Existence would mean "I can build it."
      **To Multiversism:** Textbooks would qualify every theorem ("In models where AC holds..."). Proofs would become relative. Lean would require explicit universe parameters for axioms, turning the ledger into a context manager rather than a warning.

      Ultimately, your department treats existence as a binary property within ZFC, but relevance as a gradient. Lean treats existence as dependent on construction. The friction you feel is the gap between *truth* (their goal) and *content* (Lean's goal).

