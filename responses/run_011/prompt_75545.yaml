answer: |-
  ### Desiderata for Symbol-Level Causation

  **1. Physical Closure (No Magic)**
  *   **Requirement:** The account must acknowledge that the complete low-level history plus physical laws fixes every outcome. High-level causes cannot add energy or information to the system.
  *   **Careenium Case:** A simmball moves left. The account cannot say "the simmball wanted to go left" *and* "the symms collided to push it left" as two separate pushes.
  *   **Verdict:** **Non-negotiable.** Denying this violates conservation laws and makes prediction impossible.

  **2. Non-Arbitrary Vocabulary (No Aunt Edna)**
  *   **Requirement:** The account must specify why the chosen high-level variables (simmballs) are causally relevant while other compressible descriptions (e.g., "the set of symms currently in the left third") are not.
  *   **Careenium Case:** You can define a "clump" that tracks your Aunt Edna perfectly. Why does the simmball cause collisions while the "Aunt Edna clump" does not, even if both are compressible descriptions?
  *   **Verdict:** **Non-negotiable.** Without this, any pattern is a cause, and the word "cause" loses meaning.

  **3. Structural Autonomy (The Puppet Test)**
  *   **Requirement:** The account must distinguish between internal causal structure and external forcing. It must handle token events, not just statistical types.
  *   **Careenium Case:** An external magnet drags symms into a simmball shape that then "causes" a collision. Was it the simmball or the magnet? What if the magnet only intervenes once?
  *   **Verdict:** **Non-negotiable.** Causation requires counterfactual dependence on the system's internal state, not just correlation with an outcome.

  **4. Misrepresentation Handling**
  *   **Requirement:** The account must distinguish between what a symbol represents and what physically triggered it.
  *   **Careenium Case:** A simmball means "Cat" but is triggered by a dog picture. Did the "Cat" symbol cause the refusal, or did the "Dog-triggered state" cause it?
  *   **Verdict:** **Prejudice.** This is required only if you care about *semantic* causation. For mechanistic interpretability, the causal role (triggering the refusal) matters more than the truth condition.

  **5. Content vs. Role**
  *   **Requirement:** The account must state whether the meaning of the symbol does work, or only its structural position in the network.
  *   **Careenium Case:** Two simmballs have identical collision physics but different meanings (one means "Stop," one means "Go" in a language no one speaks). Do they cause the same downstream effects?
  *   **Verdict:** **Prejudice.** Physicalists must say only role matters. Intentionalists say content matters. For reviewer guidelines, demand role; content is optional metaphysics.

  **6. Substrate Portability**
  *   **Requirement:** The account must state whether the causal power survives if the symms are simulated in software rather than physical magnetic balls.
  *   **Careenium Case:** A spreadsheet calculates symm positions perfectly. Do the spreadsheet-simmballs shove each other?
  *   **Verdict:** **Prejudice.** Functionalists say yes; physicalists say no. For interpretability, assume yes (abstraction is key), but note it is not metaphysically settled.

  **7. Demarcation (Thermostats vs. Symbols)**
  *   **Requirement:** The account must explain why some high-level structures (symbols) get causal credit while others (hurricanes, thermostats) do not, or admit they all do.
  *   **Careenium Case:** A hurricane is a compressible high-level pattern of air molecules. Why is the simmball a "cause" but the hurricane is just "weather"?
  *   **Verdict:** **Non-negotiable.** If everything is a symbol, nothing is. You need a line between trivial aggregation and genuine representation.

  **8. The Shuffle Test (Counterfactual Stability)**
  *   **Requirement:** If the low-level substrate changes but the high-level symbol remains instantiated, the downstream effect should remain the same.
  *   **Careenium Case:** Swap the specific symms constituting a simmball for different symms that form the same shape/state. Does the collision outcome hold?
  *   **Verdict:** **Bin (as stated); Modified List (as type-level).** You cannot hold "everything else fixed" while changing the substrate of a *token* event; the substrate *is* the event. This is logically incoherent for single instances. As a *type-level* test (multiple realizability across possible worlds), it is valid and belongs on the list as "Robustness."

  ---

  ### The Incompatibility Proof

  You are correct to suspect a trilemma. The following three claims are jointly unsatisfiable:
  1.  **Closure:** Low-level physics is causally complete (Desideratum 1).
  2.  **Distinctness:** High-level symbols are distinct from low-level symms (implied by Desideratum 2 & 7).
  3.  **Efficacy:** High-level symbols exert genuine causal power (the goal of the account).

  **The Argument:** If low-level physics is complete (1), every effect has a sufficient low-level cause. If high-level symbols are distinct (2), their causal contribution is either identical to the low-level cause or additional to it. If it is additional, you have overdetermination (violating 1). If it is not additional, the high-level symbol is epiphenomenal (violating 3).

  **The Trade-off:** You must give up **Distinctness of Causal Power**. You cannot have high-level causation that is *ontologically distinct* from low-level causation. The only coherent physicalist account is **Realization**: high-level causation is *real*, but it is *constituted by* low-level causation, not competing with it. The high-level description tracks a stable pattern *within* the low-level causal web. If you insist on distinctness, you must accept epiphenomenalism (symbols don't really do anything). If you insist on efficacy, you must accept that high-level causation is just low-level causation described differently.

  ### The Killer Requirement

  **Desideratum 2 (Non-Arbitrary Vocabulary)** knocks out the most candidate accounts in practice.

  Most interpretability papers pass Physical Closure (they don't claim magic) and claim Efficacy (they show correlations). They fail because they cannot justify why *their* chosen abstraction is the causal one rather than a gerrymandered alternative (the "Aunt Edna" problem). They select features because they look interpretable to humans, not because those features meet a constraint on causal stability. Enforcing Desideratum 2 forces authors to prove their symbols are robust structures, not just post-hoc stories.

  ---

  ### Evaluation of Three Views

  **1. Hard-Line Reductionism ("It's all just symms")**
  This view satisfies Physical Closure perfectly but fails Demarcation and Non-Arbitrary Vocabulary by denying the high level exists. It is metaphysically safe but practically useless for interpretability, as it forbids the very language reviewers need to evaluate system behavior. It solves the trilemma by deleting two of the horns.

  **2. Level-Relative Causation ("Both stories are true")**
  This view satisfies Closure and Efficacy by relativizing causation to the model of description. It claims low-level and high-level causes are both literal truths within their respective frameworks. It solves the trilemma by denying Distinctness: the causes are the same event, indexed to different vocabularies. This is the most viable stance for reviewer guidelines.

  **3. Instrumentalism ("Useful fiction")**
  This view satisfies Closure but treats Efficacy as pragmatic rather than metaphysical. It claims symbol-level causation is a compression tool for humans, not a feature of the territory. It solves the trilemma by denying Efficacy is ontological. This is safe for safety cases but risks underestimating risks if the "fiction" stops predicting well.
