  Consider Patient K, who suffers from a rare, selective lesion to the mesolimbic dopamine pathways responsible for conative drive and goal-directed behavior, while her insular and somatosensory cortices remain fully intact. When subjected to a noxious thermal stimulus, K lucidly and articulate describes the sensation as "excruciating," "agonizing," and "phenomenally awful," confirming the qualitative presence of severe pain. However, due to the conative lesion, she reports absolutely no impulse, desire, or motivation for the sensation to cease, stating calmly, "I recognize the quality as terrible, but the concept of 'making it stop' carries no weight or urgency for me." Her physiological markers remain flat—no pupil dilation, no heart rate spike, no flinching—confirming the absence of covert aversive arousal, and her psychiatric profile rules out stoicism, depression, or competing beliefs that might rationalize endurance.

  **Show Your Work**

  **1. The Verdicts**
  *   **Your Account (Felt Quality):** The pain is **genuinely bad**. The badness resides in the intrinsic phenomenal character ("excruciating," "agonizing") which is preserved by the intact insula. The subject's inability to care does not negate the hurtfulness of the experience itself.
  *   **His Account (Aversive Grip):** The pain is **not bad at all**. Badness is constituted by the motivational friction—the desire for the state to end. Since the lesion abolishes the conative "pull" to escape, there is no frustrated desire, and thus no harm or badness for the subject.

  **2. The Single Feature**
  The work is done by the **dissociation of phenomenal awfulness from conative urgency**. In standard pain (and standard asymbolia), these are assumed to be linked: either the hurt drives the desire (normal), or the hurt is absent (asymbolia). This case isolates the "hurt" (qualitative) from the "drive" (motivational).

  **3. If the Feature is Removed**
  *   **Restore Conative Urgency:** If her motivation pathways were repaired, she would immediately wish the pain to stop. Your verdict remains "Bad," but his verdict flips to "Bad" (as the aversive grip returns).
  *   **Remove Phenomenal Awfulness:** If the insula were lesioned instead (standard asymbolia), she would report no agony. Your verdict might remain "Bad" (based on nociception), but becomes harder to defend; his verdict remains "Not Bad."

  **4. His Best Attack**
  He will argue that **"Badness" is essentially relational**, not intrinsic. He will claim that a "terrible quality" without a "subject who minds" is a contradiction in terms, like a "secret joke." If K does not mind—if no interest of hers is frustrated—then nothing *for her* is wrong. The "agonizing" description is merely a cognitive label she has learned to attach to a sensation, stripped of its normative force.
  *   **Repair or Abandon:** The case cannot be *repaired* to force him to concede, because his definition of badness excludes your premise by fiat. However, the case need not be abandoned; it successfully shifts the burden of proof. It forces him to accept the counter-intuitive conclusion that a subject can be immersed in "agonizing" experience without suffering harm, exposing his view as one that defines away the phenomenology of suffering rather than explaining it. The case stands as a robust intuition pump for phenomenal realism, even if it cannot logically compel a desire-satisfactionist to convert.
