prompt: |-
  I am writing the affirmative paper for a graduate seminar on causation that meets fortnightly with the two sides alternating, and my slot is next. My assignment is to argue, in a self-contained way, that there is genuine causation by omission: that when a night nurse fails to check an infusion pump and the patient dies, her failure is not a mere background condition, not a negative state of affairs doing rhetorical work, and not a façon de parler, but a cause of the death on a par with the occlusion that killed him. I do not want a survey of positions or a catalogue of who says what; I want one sustained argument, laid out as numbered premises and inferences, that a well-prepared skeptic can attack line by line, with the load-bearing premises flagged so that I know where to expect pressure. My opponent presents the negative side, draws on Helen Beebee's scepticism about absence causation and on Jonathan Schaffer's contrastive reconstruction of causal claims, and is scrupulous about never letting a speaker slide from the truth of a causal sentence to the existence of a causal fact, so please write accordingly.

  Build the argument around the following case; you may smooth the details but not the structure. Wren is the only nurse assigned overnight to a small step-down unit. Hospital policy requires a pump check at 03:00. At 23:00 a physician redirects her to a neighbouring ward for the remainder of the shift, and so she does not check the pump. At 04:10 a patient dies from an occluded line. Stipulate, and state out loud so that the usual escapes are closed: there is no backup of any kind — no second nurse, no alarm, no colleague who might have noticed — so the counterfactual dependence of the death on the check is robust and there is no preemption, overdetermination, or switching structure anywhere in the case; the effect is fixed at a coarse grain, the death occurring at 04:10, and the contrast everyone in the room accepts as relevant, my opponent included, is check versus no check, so nothing can be made to turn on locating a cleverer contrast class; and the occlusion is itself a positive event with an unremarkable causal history. Note also that the Lewisian counterfactual account already concedes absence causation and contains the resulting proliferation by appeal to contextual salience, so simply invoking Lewis would beg the question against a skeptic who thinks salience is doing pragmatic, not metaphysical, work.

  The argument must do four things. First, show that denying omission causation severs the physician's 23:00 instruction from the death, since on the negative view the instruction causes only Wren's being elsewhere, which is not what killed anyone; then answer the reply that this is an expressive cost we can absorb, given that the instruction still makes a difference to what we say and to whom we blame. Second, meet the promiscuity objection — my not watering your plants on another continent apparently caused their death — not by fiat but by developing and defending a distinction I want you to name and argue for: call an absence repertoire-relative to an effect when the omitted act lay within the localized set of options actually available to the system surrounding the effect at the relevant time, and merely global otherwise; explain why Wren's failure is repertoire-relative to the death and my horticultural inaction is not, and then confront the obvious worry that repertoire-relativity is a fact about our interests rather than about the world, which would mean I have traded a metaphysical thesis for a pragmatic one. Third, address the process objection from Salmon–Dowe style theories — nothing is transferred, no continuous process links the failure to the death — and say explicitly whether the right response is to deny that causation requires any such connection or to reinterpret what a process theory was ever supposed to be for. Fourth, take up the duty-and-expectation route, on which her failure is a cause because policy required the check, and explain why I should not lean on it, since grounding causation in norms threatens to make causation mind-dependent; if you think norms can be rehabilitated here, say in what non-mind-dependent form. Close with a short, honest cost section stating what the defender of omission causation must give up in return — including whether my case, if it fails to convert the skeptic, would suggest that at least part of the dispute is verbal rather than substantive.
reasoning: |-
  Here's a thinking process that leads to the suggested affirmative paper:

  1.  **Analyze the Request:**

      *   **Task:** Write an affirmative paper for a graduate seminar on causation.
      *   **Topic:** Genuine causation by omission (specifically, the nurse Wren failing to check a pump).
      *   **Format:** Self-contained, sustained argument, numbered premises and inferences.
      *   **Audience:** A well-prepared skeptic (opponent) who uses Helen Beebee's skepticism and Jonathan Schaffer's contrastive reconstruction. The opponent is scrupulous about distinguishing causal *sentences* from causal *facts*.
      *   **Constraints:**
          *   No survey of positions.
          *   Use the specific Wren case (nurse redirected at 23:00, check due 03:00, death at 04:10, no backup).
          *   Stipulations: Robust counterfactual dependence, no preemption/overdetermination, coarse-grained effect (death at 04:10), accepted contrast (check vs. no check), occlusion is a positive event.
          *   Do not simply invoke Lewis (begs the question against the skeptic regarding salience).
      *   **Required Components (The "Four Things"):**
          1.  Show that denying omission causation severs the link between the physician's instruction and the death. Address the reply that this is just an "expressive cost."
          2.  Meet the "promiscuity objection" (not watering plants on another continent) using a specific distinction: *repertoire-relative* vs. *merely global* absences. Defend this against the charge of being pragmatic/interest-relative rather than metaphysical.
          3.  Address the Salmon-Dowe process objection (no transfer/process). Decide whether to deny the requirement or reinterpret process theory.
          4.  Address the duty/expectation route (policy required the check). Explain why leaning on norms risks mind-dependence, and if norms are used, rehabilitate them non-mind-dependently.
          5.  Close with a "Cost Section" (what must be given up, is the dispute verbal?).
      *   **Tone:** Rigorous, philosophical, argumentative, precise. Flag load-bearing premises.

  2.  **Deconstruct the Opponent's Position (Beebee/Schaffer):**

      *   *Beebee:* Absences aren't things; they don't exist. Causation requires relations between existents. Causal claims about absences are true but don't report causal *relations* (they might report explanatory relations or normative expectations).
      *   *Schaffer:* Causation is contrastive. "C rather than C* caused E rather than E*." This can handle absences by treating them as contrasts, but the skeptic might argue the *relata* must still be positive facts/events.
      *   *Scruples:* Distinguish truth of sentence "$\phi$ caused $\psi$" from existence of fact *Causation($\phi$, $\psi$)*. The prompt asks me to argue for the *existence* of the causal fact/relation, not just the truth of the sentence.

  3.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Set the stage, define the case (Wren), state the thesis (Omissions are genuine causes).
      *   **Part 1: The Chain of Command (Physician Instruction):**
          *   If Wren's failure isn't a cause, what connects the Doctor's order to the death?
          *   Order $\to$ Wren's location. Wren's location $\to$ ? $\to$ Death.
          *   If the gap (failure to check) isn't causal, the chain is broken.
          *   Opponent reply: "We can still blame the doctor."
          *   Counter: Blame without causal connection is magical/moralistic, not metaphysical.
      *   **Part 2: Promiscuity & Repertoire-Relativity:**
          *   Problem: If absences cause, why doesn't *my* not watering plants cause their death?
          *   Solution: *Repertoire-Relativity*.
          *   Definition: An absence is repertoire-relative if the act was in the localized set of options available to the *system* surrounding the effect.
          *   Wren: Part of the hospital system. Checking was an available option *for the system*.
          *   Me: Not part of the plant's system.
          *   Defense against Pragmatism: Is "system" interest-relative? Argue that "system" is defined by physical/functional integration (wires, protocols, spatial proximity), not just interest. It's a boundary condition of the causal field.
      *   **Part 3: The Process Objection (Salmon-Dowe):**
          *   Objection: No energy/momentum transfer from a non-event.
          *   Response: Deny that *all* causation requires process connection. Or, reinterpret process.
          *   Better move: Causation is polysemous or has two varieties (process and dependence). But the prompt asks to decide.
          *   Decision: Deny that process connection is necessary for *causation simpliciter*. Process theories describe *how* positive causes work, not the necessary condition for *that* causation. Omission causation is causal dependence without process.
      *   **Part 4: Norms and Duties:**
          *   Objection: She caused it because she *should* have.
          *   Risk: Makes causation mind-dependent (norms are human constructs).
          *   Rehabilitation: Norms track *functional roles*. The nurse is a component in a functional machine (the hospital). The "duty" is the functional specification of the component. This is objective (like a spark plug's duty to fire), not merely moral.
      *   **Conclusion/Costs:**
          *   What do we give up? The intuition that causes must be "existents" or "energetic."
          *   Is it verbal? If the skeptic insists on "causation*" (process) vs "causation**" (dependence), maybe. But if we want a unified theory of responsibility and explanation, we need the metaphysical commitment.

  4.  **Refining the Argument (Self-Correction & Formatting):**

      *   *Check:* Did I flag load-bearing premises? Yes, need to mark them clearly (e.g., **[LOAD-BEARING]**).
      *   *Check:* Did I avoid Lewisian salience? Yes, focusing on Repertoire-Relativity and Functional Roles.
      *   *Check:* Did I address the sentence/fact distinction? Yes, need to ensure I'm arguing for the *fact* of causation, not just the truth of the claim.
      *   *Check:* Is the "Repertoire-Relative" definition robust enough? I need to ensure it doesn't collapse into "what we care about." I will ground it in *counterfactual stability within a functional system*.
      *   *Check:* The Physician argument. If the failure isn't a cause, the physician's order is causally inert regarding the death. This is a *reductio* on the skeptic's view if they want to maintain the physician is a cause.
      *   *Check:* Process theory. I will argue that Process Theories are theories of *transmission*, not *causation* broadly conceived.
      *   *Check:* Norms. Functionalism is the key. A nurse is a functional kind.

  5.  **Final Polish:**

      *   Ensure the tone is appropriate for a graduate seminar (rigorous, direct).
      *   Make sure the numbered premises flow logically.
      *   Ensure the "Cost Section" is honest.

  *(Self-Correction during drafting)*: I need to be careful with the "Repertoire-Relative" definition. If I say "available to the system," the skeptic will ask "what defines the system?" If I say "hospital policy," that's normative. If I say "physical proximity," that's arbitrary. I need to combine them: The system is defined by *functional integration* designed to prevent the effect. The "options" are the states the system was designed to cycle through. This makes it objective (design facts) rather than merely interest-relative.

  *(Refining the Physician Argument)*: The skeptic might say the Physician caused the *location*, and the location caused the death via the occlusion. But the occlusion didn't kill; the *lack of intervention* allowed the occlusion to kill. I need to press that the *path* from location to death is constituted by the omission.

  *(Refining the Process Objection)*: I should explicitly state that I am rejecting the universality of the Process Requirement.

  *(Refining the Norms)*: Distinguish Moral Duty from Functional Role. The latter is metaphysical.

  6.  **Final Review against constraints:**
      *   Numbered premises? Yes.
      *   Load-bearing flagged? Yes.
      *   Four specific tasks addressed? Yes.
      *   Wren case details preserved? Yes.
      *   Beebee/Schaffer constraints respected? Yes (distinguishing sentence/fact).

  Let's write.
answer: |-
  **Seminar Paper: The Metaphysics of the Null**
  **Topic:** Affirmative Case for Causation by Omission
  **Case:** *State v. Wren (The Night Nurse)*

  ### I. Introduction and Stipulations

  We are considering the death of a patient at 04:10 due to an occluded line. Wren, the assigned night nurse, was redirected by a physician at 23:00 to a neighboring ward. Consequently, she did not perform the 03:00 pump check. There was no backup: no alarm, no second nurse, no colleague. The counterfactual dependence is robust: had Wren checked, the patient would not have died at 04:10. The occlusion is a positive event with an unremarkable history. The relevant contrast is *check* versus *no check*.

  My opponent, drawing on Beebee and Schaffer, maintains that while the sentence "Wren's failure caused the death" may be assertible, it does not report a causal *fact*. They argue absences are not existents, cannot enter relations, and that causal claims regarding them are pragmatic or normative, not metaphysical.

  I argue the contrary. Wren's failure is a cause on a par with the occlusion. To deny this is to fracture the causal structure of the world in ways that render agency and explanation unintelligible. The following argument is structured in four movements, addressing the Chain of Command, the Promiscuity Objection, the Process Objection, and the Normative Objection.

  ### II. The Chain of Command Argument

  If omissions are not causes, the causal chain linking human agency to the death is severed.

  1.  **Premise 1:** The physician's 23:00 instruction is a cause of the patient's death at 04:10.
  2.  **Premise 2:** The physician's instruction caused Wren to be located in the neighboring ward at 03:00.
  3.  **Premise 3:** Wren's location in the neighboring ward is not, in itself, a lethal event; being in a ward does not transfer energy to a patient's bloodstream. **[LOAD-BEARING]**
  4.  **Inference 1:** Therefore, the causal path from the instruction to the death must pass through the *absence* of the check at the original ward.
  5.  **Premise 4 (Skeptic's Constraint):** If omissions are not genuine causes, then the absence of the check is not a causal relatum; it is merely a background condition or a true causal sentence without a corresponding fact.
  6.  **Inference 2:** If the absence of the check is not a causal relatum, then the causal chain from Wren's location (Premise 2) to the death (Premise 1) is broken, because no positive event connects the location to the death other than the occlusion, which was already present and non-lethal until the time of death.
  7.  **Conclusion 1:** Therefore, if omissions are not genuine causes, the physician's instruction is not a cause of the death.
  8.  **Premise 5:** It is false that the physician's instruction is not a cause of the death (denial of Conclusion 1's consequent).
  9.  **Final Inference:** Therefore, omissions must be genuine causes (denial of Premise 4).

  **Reply to the "Expressive Cost" Objection:**
  The skeptic may reply: *We can absorb this cost. We can still blame the physician and assert the sentence "The instruction caused the death" for pragmatic purposes, even if the metaphysical chain is broken.*

  **Counter-Reply:** This renders causation disjointed from responsibility in an unacceptable way. If the metaphysical chain is broken, blame becomes a matter of social convention rather than causal history. If the instruction did not *cause* the death, then holding the physician responsible is a fiction. We do not merely want a theory that licenses blame; we want a theory that explains *why* the blame is apt. The aptness of blame tracks causal influence. If the metaphysics denies the influence, the theory fails to ground the practice. **[LOAD-BEARING]**

  ### III. The Promiscuity Objection and Repertoire-Relativity

  The standard objection to omission causation is promiscuity: if Wren's not-checking causes death, why does my not-watering a plant on another continent not cause its death? Both satisfy counterfactual dependence. I propose a distinction to solve this without retreating to pragmatism.

  10. **Definition:** An absence $A$ is **repertoire-relative** to an effect $E$ if and only if the act omitted was within the localized set of options actually available to the *functional system* surrounding $E$ at the relevant time. An absence is **merely global** if the act was not within that system's available options.
  11. **Premise 6:** Wren's check was repertoire-relative to the death. The hospital ward, the pump, and the nursing staff constitute a functional system designed to maintain patient homeostasis. The check was a state transition within that system's operational repertoire.
  12. **Premise 7:** My watering the plant is merely global. I am not part of the functional system sustaining the plant; the act was not an available option within the plant's immediate causal field.
  13. **Inference 3:** Therefore, Wren's absence is a candidate for causation, while my absence is not, because only Wren's absence represents a deviation from the system's expected functional trajectory. **[LOAD-BEARING]**

  **Defense Against the Pragmatic Charge:**
  The skeptic will argue: *What counts as a "functional system" is interest-relative. You have traded a metaphysical thesis for a pragmatic one.*

  **Counter-Reply:** The boundary of the "functional system" is not determined by our interests, but by *counterfactual stability and physical integration*.
  14. **Premise 7a:** A functional system is defined by physical connections (wires, protocols, spatial proximity) that stabilize specific counterfactuals. In the hospital, the pump is wired to alarm (in standard cases), the nurse is contracted to the space, and the protocol binds the role to the location.
  15. **Premise 7b:** My relation to the distant plant lacks this physical/functional integration. There is no mechanism by which my action could be transmitted to the plant other than the generic counterfactual dependence shared by all events in the universe.
  16. **Inference 4:** Therefore, repertoire-relativity tracks an objective feature of the world (functional integration), not merely our conversational interests. It filters causes based on *capacity for intervention within a closed loop*, which is a metaphysical constraint, not a linguistic one.

  ### IV. The Process Objection (Salmon–Dowe)

  The skeptic argues: Causation requires a continuous process of energy/momentum transfer (Salmon-Dowe). Nothing is transferred from a non-event.

  17. **Premise 8:** Process theories (Salmon-Dowe) correctly describe how *positive* events propagate influence.
  18. **Premise 9:** Process theories fail to describe how *preventions* and *omissions* operate, as these involve the *interruption* or *non-initiation* of processes.
  19. **Premise 10:** A unified theory of causation must account for both production (positive) and dependence (negative/omissive).
  20. **Decision:** I deny that causation *simpliciter* requires process connection. **[LOAD-BEARING]**
  21. **Inference 5:** Process connection is a sufficient condition for positive causation, but not a necessary condition for causation *simpliciter*.
  22. **Explanation:** To demand process transfer for omissions is to category mistake. An omission causes by *not interfering* with a lethal process (the occlusion). The causal work is done by the *continuation* of the lethal process, which the omission permitted. The omission is the cause of the *outcome* because it is the variable upon which the outcome depended, even if no energy flowed from the omission itself. We must reinterpret process theory as a theory of *transmission*, not a theory of *causal relevance*.

  ### V. The Duty and Expectation Route

  Finally, one might argue Wren caused the death because she *violated a duty*. The skeptic warns this makes causation mind-dependent (norms are human constructs).

  23. **Premise 11:** If causation depends on moral or legal duty, causation is mind-dependent.
  24. **Premise 12:** We should not ground causation in moral/legal duty.
  25. **Rehabilitation:** However, we can ground the omission in *functional role*, not moral duty.
  26. **Premise 13:** Wren is a component of a functional kind (Nurse), defined by objective specifications (policy, training, physiological role in the ward system).
  27. **Inference 6:** The "expectation" that she checks the pump is not a moral hope, but a functional specification, akin to a spark plug's "duty" to fire.
  28. **Conclusion 2:** The causation is grounded in the *failure of a functional component*, which is an objective state of affairs (the component did not execute its specification), not a mind-dependent moral failure. **[LOAD-BEARING]**

  This avoids mind-dependence. The hospital policy exists as a social fact, but the *functional integration* of the nurse into the life-support system is physical. The "duty" is just the description of the causal role the nurse occupies in the mechanism.

  ### VI. Cost Section

  To maintain this position, I must acknowledge the costs.

  1.  **Ontological Inflation:** I must accept that "absences" or "failures" have some ontological standing, or at least that causal relations can hold between events and the non-occurrence of events. This violates the Eleatic principle that only existents have powers.
      *   *Concession:* I accept a ontology of *facts* rather than just *events*. The fact *that Wren did not check* obtains. It is not a "thing," but it is a truthmaker.
  2.  **Process Theory Demotion:** I must demote Process Theory from a universal account of causation to a local account of positive transmission.
  3.  **Verbal Dispute Risk:** If the skeptic insists on defining "causation*" as strictly energetic transfer, then our dispute is verbal. They can have "causation*" (process) and I will have "causation**" (dependence + functional role).
      *   *Honest Assessment:* However, if "causation*" cannot account for why we intervene, blame, or explain deaths in medicine, law, and daily life, it is the wrong concept for the job. If my case fails to convert the skeptic, it suggests they prioritize ontological parsimony over explanatory unity. I prioritize explanatory unity. The cost of my view is a messier ontology; the cost of their view is a fractured world where instructions do not cause deaths and nurses are not causally linked to their patients. I choose the messier ontology.

  **Final Summary:** Wren's failure is a cause because it is a repertoire-relative absence within a functional system, upon which the death counterfactually depended, regardless of energy transfer. To deny this is to sever the link between agency and outcome.
