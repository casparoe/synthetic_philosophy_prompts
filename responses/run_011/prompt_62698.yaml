  # METAETHICS SORTING INSTRUMENT: REASONS & ATTITUDES

  **Instructions:** Begin at **Node 1**. Select the answer that best matches your intuition about the situation. Follow the arrow to the next Node or to a Terminal Position (Leaf). Complete the path to find your philosophical profile.

  ---

  ### NODE 1: The Crowded Mind
  **Situation:** You are considering believing a trivial truth (e.g., "there are 143 grains of sand here"). Believing it would crowd out mental space for more important thoughts.
  *   **(A)** This crowding out is a reason *against believing* the proposition. → **Go to Node 3**
  *   **(B)** This is a reason against *wanting to believe* it, but not against believing it. → **Leaf 2**
  *   **(C)** This is not a reason regarding belief at all, just a practical cost. → **Go to Node 2**

  ### NODE 2: The Unfunny Joke
  **Situation:** A benefactor will reward you if you are amused by a friend's unfunny joke. You know it is unfunny.
  *   **(A)** The reward makes being amused rational, even though the joke isn't funny. → **Leaf 8 (Empty Cell)**
  *   **(B)** The reward makes trying to be amused rational, but amusement itself isn't rational. → **Leaf 3**
  *   **(C)** The reward is irrelevant to the rationality of amusement. → **Leaf 3** *(Note: B and C converge here)*

  ### NODE 3: The Life-Saving Belief
  **Situation:** You have strong evidence a proposition is false (reason against belief), but believing it would save your life (reason for belief).
  *   **(A)** These considerations pull in opposite directions; you must weigh them. → **Go to Node 4**
  *   **(B)** They are both reasons for belief, but they operate in separate lanes and never clash. → **Leaf 6**
  *   **(C)** Only the evidence counts as a reason for belief; the survival benefit is a reason for something else. → **Leaf 1**

  ### NODE 4: The Toxin Intention
  **Situation:** You are offered money to *intend* to drink a toxin that will make you sick (you do not have to drink it, just intend). You have no reason to drink it.
  *   **(A)** You can have a reason to intend even if you have no reason to drink. → **Go to Node 5**
  *   **(B)** You can only have a reason to intend if you have a reason to do the thing. → **Leaf 5**

  ### NODE 5: The Demon's Ought
  **Situation:** An evil demon will torture you unless you admire him. He is vile.
  *   **(A)** You ought to admire him (all things considered), despite his vileness. → **Go to Node 6**
  *   **(B)** It is prudent to admire him, but you ought not to admire him. → **Leaf 7 (Empty Cell)**
  *   **(C)** 'Ought' is univocal; the threat changes what you ought to do, but not because of admiration. → **Go to Node 6**

  ### NODE 6: The Weight of Vileness
  **Situation:** Comparing the reason to admire the demon (to avoid torture) vs. the reason not to admire (he is vile).
  *   **(A)** The threat provides a reason that can outweigh the vileness. → **Leaf 4**
  *   **(B)** The threat provides a reason, but it is lexically inferior to vileness. → **Leaf 9**
  *   **(C)** The threat provides no reason to admire, only to want to. → **Leaf 3**

  ---

  ### TERMINAL POSITIONS (LEAVES)

  **Leaf 1: Reasons Bear on the Question**
  *   **View:** Reasons must bear on the question an attitude settles (e.g., truth for belief). Pragmatic benefits are reasons for other things.
  *   **Awkward Commitment:** You must explain away the intuition that survival benefits make belief rational without calling them reasons for belief.

  **Leaf 2: Reasons for Wanting**
  *   **View:** Wrong-kind considerations are reasons not for the attitude but for wanting or trying to have it.
  *   **Awkward Commitment:** You must distinguish "reasons for wanting" from "reasons for" in a way that doesn't collapse into Leaf 1.

  **Leaf 3: Fittingness-First**
  *   **View:** Wrong-kind considerations are not reasons for the attitude at all; only fittingness conditions (truth, funniness, value) provide reasons.
  *   **Awkward Commitment:** You must explain the rationality of manipulating attitudes without invoking reasons for those attitudes.

  **Leaf 4: WKR Full Standing**
  *   **View:** Grants wrong-kind reasons full standing and treats the problem as merely verbal or as a matter of weight.
  *   **Awkward Commitment:** You must accept that vileness could theoretically be outweighed by torture threats in determining what you ought to admire.

  **Leaf 5: Value-Theorist**
  *   **View:** Accepts both kinds of consideration as reasons but restricts the analysis of value to the right kind.
  *   **Awkward Commitment:** You must maintain a split between what you have reason to do and what is valuable without circularity.

  **Leaf 6: The Classmate's View**
  *   **View:** Wrong-kind considerations are genuine reasons for the attitude, but they can never conflict with right-kind ones.
  *   **Awkward Commitment:** You must explain how two reasons for the same attitude can exist in separate lanes without ever interacting.

  **Leaf 7: Empty Cell (Incoherent)**
  *   **View:** Claims wrong-kind considerations are genuine reasons for the attitude (Node 4A) but deny they affect what you ought to do (Node 5B).
  *   **Diagnosis:** **Incoherent.** If they are genuine reasons for the attitude, they must contribute to the overall 'ought' regarding that attitude.

  **Leaf 8: Empty Cell (Unattractive)**
  *   **View:** Claims pragmatic rewards make amusement rational (Node 2A) while maintaining Node 1C (pragmatics are not reasons for belief).
  *   **Diagnosis:** **Unattractive/Unexplored.** Treats belief and amusement as fundamentally different kinds of states regarding reasons, without a principled basis for the distinction.

  **Leaf 9: Indistinguishable from Leaf 4**
  *   **View:** Grants wrong-kind reasons standing but claims they are lexically inferior.
  *   **Diagnosis:** **Functionally Equivalent to Leaf 4.** In practice, lexical inferiority often amounts to a weighting rule where the right kind always wins, making this hard to separate from Leaf 4 empirically.

  ---

  ### NOTES ON INTERPRETATION

  **Indistinguishable Leaves:**
  *   **Leaf 4 and Leaf 9:** The tree cannot genuinely separate the view that wrong-kind reasons *can* outweigh right-kind reasons (Leaf 4) from the view that they are lexically inferior (Leaf 9) without a case where the wrong-kind reason is sufficiently strong. Since such cases are contested, these positions may be stable variants of the same core view.

  **Empty Cells:**
  *   **Leaf 7 (Incoherent):** This combination asserts the existence of reasons that do not weigh in deliberation about what to do. This is diagnosed as incoherent because the function of a reason is to weigh.
  *   **Leaf 8 (Unattractive):** This combination applies a pragmatist standard to amusement but an exclusivist standard to belief. While logically possible, no major theorist holds this asymmetry without a deeper metaphysical distinction between the attitudes, making it an unexplored cell.

  **Path Convergence:**
  *   **Node 2 (B) and (C):** Both lead to Leaf 3. Whether you think pragmatic reasons apply to *trying* or *not at all*, you agree they are not reasons for the attitude itself. The tree treats these as the same terminal position for sorting purposes.
