answer: |-
  Here is the audit. I'm going to be direct: your friend has identified a real instability, but she is characterizing it clumsily. You are not contradicting yourself in a way that makes the position *impossible*, but you are using the same words to do two different jobs in (1) and (4), and that is where the structure buckles.

  Here is the ranking of tensions by severity, from "breaks the spine" to "manageable friction."

  ### 1. The Critical Tension: (1) vs. (4)
  **Severity:** Fatal if unaddressed.
  **The Conflict:** In (1), you say group intention is *nothing over and above* individual attitudes meshing. In (4), you say group intention lives in the *procedure*, not anybody's psychology.
  If the intention lives in the procedure (4), then it *is* something over and above the individual psychology, because the procedure can output an intention that no individual psychology currently holds (as you admit in 3). If (1) is true, the procedure is just a shorthand for what the individuals are doing. If (4) is true, the procedure is an ontological anchor independent of the current mental states of the members.
  **What breaks first:** (1) breaks. You cannot maintain "nothing over and above" while claiming the intention resides in the rules/procedure rather than the heads.
  **Cost of fixing:** You must soften (1). You need to move from a **reductive** account (it's *just* individual attitudes) to a **constitutive** account (it is *realized by* individual attitudes but functionally distinct).
  **Price:** You concede a bit of ground to the individualist. You admit that "group intention" is a real category that isn't just a summary of individual intentions. You stop being a hard reductionist about joint action.

  ### 2. The Severe Tension: (1) vs. (2)
  **Severity:** High.
  **The Conflict:** (1) says everything is individual attitudes. (2) says blame can be non-distributive. If the blame isn't distributive (i.e., not just blaming the members), what is the target of the blame? If there is no group mind (per 1), and the blame doesn't land on the members, it lands on... nothing.
  **The Conflict Deepens:** If you hold the *group* responsible, you are treating it as a moral patient/agent. If (1) is true, the group is a fiction. You can't blame a fiction in a way that isn't shorthand for blaming the real people involved.
  **What breaks first:** (2) becomes incoherent if (1) is held rigidly.
  **Cost of fixing:** You must accept that "group responsibility" is a distinct normative status, not just a distributive sum. This requires accepting that groups have a normative reality that exceeds the sum of their parts.
  **Price:** You have to admit your friend is partially right: you *are* a holist about responsibility, even if you are a reductionist about psychology. You need to explain how a thing with no mind (1) can bear blame (2). (The standard fix is to say the blame attaches to the *structure* that the individuals maintain, but that pushes back against 1).

  ### 3. The Manageable Tension: (1) vs. (3)
  **Severity:** Medium.
  **The Conflict:** (1) requires a mesh of individual attitudes ("each of us intending that we J"). (3) says the group can hold a position *no member holds*. If no member believes P, can they genuinely intend that the group pursue P?
  **Why it's manageable:** You can argue that the members intend to *abide by the procedure*, even if they don't endorse the output. The "mesh" in (1) is the agreement to be bound by the vote, not the agreement on the content.
  **Cost of fixing:** Minimal. You just need to clarify that the "shared intention" in (1) is an intention to *submit to the process*, not an intention regarding the *outcome*.
  **Price:** You make joint action more procedural and less psychological. This actually strengthens (4) but weakens the psychological "warmth" of (1).

  ### 4. The False Tensions: (5) & (6), and (1) & (7)
  **Severity:** Low / Non-existent.

  *   **(5) & (6):** This looks like a tension (normativity vs. standing arrangements) but it isn't. You are arguing that normativity *arises from* the standing arrangement. The "pickup game" is derivative because it borrows the normative framework from established social practices (the "standing arrangements" of society). This is coherent. Defend this fiercely; it's your strongest link.
  *   **(1) & (7):** Your friend might say, "If a 2-year-old can mesh attitudes, why not a dog?" This is an empirical boundary, not a logical contradiction. You can defend this by arguing that the "mutual knowledge" required in (1) requires a level of recursive cognition (I know that you know that I know) that a 2-year-old is developing but a dog lacks. It's a bright line, but not a contradiction.

  ---

  ### The Verdict on Your Friend's Charge

  **Is she right?**
  She is right that your *wording* in (1) is incompatible with (2) and (4). If you hold fast to "nothing over and above" in (1), she wins. You cannot be a hard reductionist about the *ontology* of joint action while claiming non-distributive responsibility for groups.

  **Is she right about the dichotomy?**
  No. She is trading on a false dichotomy. She assumes that if you deny a "group mind" (super-head), you must be a hard reductionist who denies group agency. You are trying to occupy the middle ground: **Non-Reductive Physicalism about Groups.**
  *   You deny the spooky stuff (group mind).
  *   You affirm the functional stuff (group agency/responsibility).

  **Where the pressure is:**
  The pressure is entirely on claim **(1)**.
  Claim (1) is a Bratman-style reductionist account of *shared intention*.
  Claims (2), (3), and (4) are List/Pettit-style functionalist accounts of *group agency*.
  These are two different theories. You are trying to weld them together. The weld holds only if you admit that (1) applies to *informal* joint action (sofa, walking) and (4) applies to *formal* organizational agency (boards, institutes).

  **How to fix it before your reading group:**
  Rewrite (1). Do not say "nothing over and above." Say: "Group action is *constituted* by individual attitudes meshing, but once constituted, the group acquires functional properties (like commitment and responsibility) that are not reducible to the specific mental states of the members at any given time."

  If you make that change, you keep (2), (3), and (4), and you defang her charge. You aren't a reductionist on weekdays and a holist on weekends; you are a **structural realist** all week. The group is real because the structure is real, not because there's a ghost in the machine.

  **Summary of what to give up:**
  Give up the phrase "nothing over and above" in (1). It is the only thing licensing her attack. Everything else in your package is defensible if you allow that procedures create a new layer of reality that supervenes on, but is not reducible to, the individuals.
