      *   *Friend's Charge:* "Reductionist on weekdays (1), Holist on weekends (2/4)." This is accurate.
      *   *Defense:* The user can argue for *compatibilism*. The group agent is *constituted* by individuals (satisfying 1 broadly) but *functionally autonomous* (satisfying 2/4). But (1)'s phrasing "nothing over and above" is the weak point.
