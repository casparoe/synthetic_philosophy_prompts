      *   **The "False" Tension:** (5) and (6) work together well (normativity stems from the arrangement). (7) is defensible via "richness of mutual recognition" rather than just procedure.
      *   **Verdict on Friend:** She is half-right. You *are* trying to have it both ways, but there is a coherent middle path (Functionalist/Non-reductive Physicalist analogy) that she is ignoring. You aren't a holist in the "super-head" sense, but you aren't a hard reductionist either. You are a *structural realist* about groups.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, check (1) again.* "Nothing over and above a bunch of individual attitudes meshing." This is classic Bratman.
      *   *Check (4).* "That procedure... is where the group's intentions live." This sounds like List & Pettit or Rovane.
      *   *Conflict:* Bratman reduces shared intention to individual intention. List & Pettit say group judgment can diverge from individual judgment.
      *   *Resolution:* The user is trying to combine Bratman's psychology (1) with List/Pettit's institutional agency (4).
