prompt: |-
  im 17 and i run the econ club at my school — next wednesday i get 20 minutes and about a dozen kids who know what expected value is and basically nothing else. topic is the allais paradox. dont explain it to me, ive already got the two pairs of gambles and the numbers; tell me how to sequence it.

  main worry: if i just read the choices out loud, half of them go "id take the sure money, duh" and nothing paradoxical has actually happened yet. so what has to be in place first for the flip in their answers to land as a problem, and does that come before or after they choose? related — do i show pair one and pair two separately or side by side, and do i make them commit on paper before they see the second one?

  what does the carrying example need to have, and what must it not have? im tempted to swap the cash for stakes they care about (getting out of a detention?) but i dont know if that wrecks something structural.

  misconseptions i can already hear: "so humans are just irrational, science proved it" — i want them leaving with the idea that one of the rules for being consistent might be the wrong rule, not that people are dumb — and "isnt this the same as that urn thing where you dont know the odds." where in the order do i kill each one? then one question at the end that shows me whether it landed, plus what i should flat out refuse to get into at this level and say im skipping.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the User and Request:**
      *   **User:** 17-year-old high school student, runs econ club.
      *   **Audience:** ~12 peers, know Expected Value (EV), know little else (no prospect theory, no utility functions likely).
      *   **Topic:** Allais Paradox.
      *   **Time:** 20 minutes (very tight).
      *   **Constraints:** Do *not* explain the paradox (user knows it). Focus on *sequencing* and *pedagogy*.
      *   **Key Worries:**
          *   Participants choosing "sure money" without feeling the tension.
          *   Order of presentation (sequential vs. side-by-side).
          *   Commitment method (paper vs. mental).
          *   Stakes (cash vs. detention).
          *   Misconceptions to avoid ("humans are irrational" vs. "axioms might be wrong", confusion with Ellsberg).
          *   Closing question to check understanding.
          *   Topics to skip.

  2.  **Deconstruct the Allais Paradox Logic:**
      *   Pair 1: Certain gain vs. High probability gain (Most pick Certain).
      *   Pair 2: Low probability gain vs. Lower probability gain (Most pick Higher probability/Higher reward, violating Independence Axiom).
      *   The Conflict: If you prefer A over B in Pair 1, consistency (Independence Axiom) demands you pick the equivalent option in Pair 2. Most people don't.
      *   The Lesson: It's not about being "dumb"; it's about the *Certainty Effect* challenging Expected Utility Theory (EUT).

  3.  **Address Specific Questions:**

      *   **Sequencing/Commitment:**
          *   *Problem:* If they see both pairs at once, they might game the system or spot the pattern.
          *   *Solution:* Must separate them. Commitment is crucial. If they don't lock in Pair 1 before seeing Pair 2, the paradox dissolves.
          *   *Order:* Pair 1 -> Commit -> Pair 2 -> Commit -> Reveal Conflict.

      *   **Stakes (Cash vs. Detention):**
          *   *Problem:* Detention introduces utility curvature (risk aversion regarding punishment) and ethical/logistical issues. Cash is neutral.
          *   *Solution:* Stick to cash (or hypothetical large cash). Detention wrecks the structural neutrality because the "utility" of avoiding detention isn't linear or comparable to gaining money in the same way. Keep it clean.

      *   **Misconceptions:**
          *   *"Humans are irrational":* Need to frame this as a critique of the *model*, not the *human*. The model assumes independence; humans value certainty.
          *   *"Ellsberg Paradox (unknown odds)":* Allais has known odds. Ellsberg has unknown ambiguity. Need to explicitly state "The probabilities are written on the box" early on.

      *   **Closing Question:** Needs to test if they understand *why* it's a paradox, not just what the choices were.
      *   **Skip List:** Prospect Theory math, deep utility function derivations, behavioral econ history.

  4.  **Drafting the Sequence (20 Minutes is tight):**

      *   *Min 0-2:* Hook & Setup (EV refresher + Rules).
      *   *Min 2-5:* Gamble Set 1 (Commitment).
      *   *Min 5-8:* Gamble Set 2 (Commitment).
      *   *Min 8-12:* The Reveal (The Math/Conflict).
      *   *Min 12-17:* Discussion (Why did this happen? Model vs. Human).
      *   *Min 17-20:* Closing Question & Wrap.

  5.  **Refining the "Flip":**
      *   To make the flip land, they need to feel the *pull* of the sure thing in Set 1.
      *   In Set 2, the "sure thing" element is removed from both options (both become risky). This removes the "certainty premium."
      *   *Crucial Step:* Do not let them discuss between Set 1 and Set 2.

  6.  **Addressing the "Irrational" vs. "Wrong Rule" nuance:**
      *   This is the most sophisticated part of the prompt.
      *   Standard Econ says: You violated Independence Axiom -> You are irrational.
      *   Behavioral Econ says: Independence Axiom ignores how humans feel about certainty -> The axiom is incomplete.
      *   *Framing:* "Did you break the math, or does the math need to account for the feeling of 'sure'?"

  7.  **Addressing Ellsberg:**
      *   Kill this early. "All probabilities are known." Put it on the slide/handout.

  8.  **Topics to Skip:**
      *   Calculating Utility Functions ($U(x)$).
      *   Prospect Theory weighting functions ($\pi(p)$).
      *   Normative vs. Descriptive deep dive (keep it simple).

  9.  **Review against Constraints:**
      *   20 mins? Yes, tight but doable.
      *   12 kids? Perfect for a handout/poll.
      *   Know EV? Good, use that to show the "rational" choice initially.
      *   Don't explain the paradox? Okay, focus on the *experience* of it.

  10. **Final Polish:**
      *   Make the instructions punchy.
      *   Ensure the "Commitment" phase is emphasized.
      *   Draft the specific closing question.
      *   Refine the "Detention" advice (strong no).

  **(Self-Correction during drafting):** I initially thought about having them calculate EV. But if they calculate EV, they might realize the EVs are close or distinct and choose based on that, bypassing the intuition. Better to ask for *preference* first, then show the math later to prove the inconsistency. Wait, the prompt says they know EV. Okay, I should use EV to show that *both* choices can be justified by EV, but not *together*. Actually, in Allais, usually EV is higher on the risky option in Pair 1, but people pick sure thing. In Pair 2, EV is higher on the risky option, people pick risky. The inconsistency is in the *switch*. I need to make sure the math reveals the contradiction, not just the intuition.
  *Correction:* Keep EV in the background for the reveal. Don't let them calc during the choice phase or it slows down.

  *Refining the "Detention" idea:* The user asked "what must it not have?" Detention has negative utility and high variance in how much kids hate it. Cash is standard. I need to be firm: Don't use detention.

  *Refining the "Irrational" point:* The script needs to explicitly say: "Economics calls this irrational. Psychology calls this human. We're asking which definition is more useful."

  *Closing Question:* "If you could sell your choice in Pair 1 to someone else, would you sell it for the same price you'd pay to switch your choice in Pair 2?" (Too complex).
  *Better:* "If I offered you $1 to switch your answer in Pair 2, would you take it? Why didn't you take $1 to switch in Pair 1?" (Still messy).
  *Best:* "Which axiom did we break: 'More money is better' or 'Common consequences don't matter'?" (Too technical).
  *Let's go with:* "Does the *certainty* change the value of the money, or just your feeling about it?"

  *Wait, one more check on the "Flip":* The user worries they will just say "id take the sure money, duh" and nothing paradoxical happens.
  *Fix:* The paradox *only* happens if they switch preferences. If everyone picks Sure/Sure or Risk/Risk, there is no paradox.
  *Strategy:* I need to prime the "Certainty Effect" in Pair 1 so hard that they pick Sure. Then in Pair 2, the Certainty is gone, so they pick Risk.
  *Instruction:* Emphasize the word "Guaranteed" in Pair 1. In Pair 2, emphasize the similarity of the risks.

  *Let's structure the response.*
  1. Sequencing & Commitment (The "Trap").
  2. The Stakes (Cash vs. Detention).
  3. Killing Misconceptions (Timing).
  4. The Closing Question.
  5. The "Do Not Enter" Zone.

  *Time Check:* 20 mins is extremely fast.
  0-3: Intro & Rules.
  3-6: Choice 1 (Silent, Written).
  6-9: Choice 2 (Silent, Written).
  9-14: The Reveal (Show the math of inconsistency).
  14-18: Discussion (Model vs. Reality).
  18-20: Exit Ticket.

  Okay, ready to write.
answer: |-
  Here is the sequencing plan to make the paradox land in 20 minutes with that specific audience.

  ### 1. The Setup & Commitment (Minutes 0–6)
  **Do not show Pair 2 yet.** If they see the structure of both pairs, they will try to be "consistent" rather than honest, which kills the data.

  *   **The Hook:** "We know Expected Value. Today we're testing if EV is the only thing that drives decisions."
  *   **The Rule:** "No talking. Write your choice down. You cannot change it. I will collect these."
  *   **Pair 1 Presentation:**
      *   **A:** 100% chance of \$1M.
      *   **B:** 89% chance of \$1M, 10% chance of \$5M, 1% chance of \$0.
      *   *Crucial phrasing:* Emphasize the word **"Guaranteed"** for Option A. Do not emphasize the EV difference. Let the *certainty* do the work.
  *   **The Collection:** Physically take the papers or have them fold them and put them on the desk. This psychological "lock-in" is necessary for the tension to work.

  ### 2. The Switch (Minutes 6–9)
  **Now show Pair 2.**

  *   **Pair 2 Presentation:**
      *   **C:** 11% chance of \$1M, 89% chance of \$0.
      *   **D:** 10% chance of \$5M, 90% chance of \$0.
  *   **Crucial phrasing:** Do not use the word "Guaranteed" here. Frame both as "long shots."
  *   **The Commitment:** Same rule. Write it down. Fold it.

  ### 3. The Reveal (Minutes 9–14)
  This is where you prevent the "duh, sure money" reaction. You need to show them that their intuition contradicted their own logic.

  *   **Step 1: The Show of Hands.** "Who picked A (Sure) in the first round?" (Most will raise hands). "Keep your hand up if you picked D (Riskier/Higher Reward) in the second round."
  *   **Step 2: The Math Trap.** If you have a mix of A/D (the paradoxical combo), point to them.
  *   **Step 3: The Algebra.** Don't use utility functions. Use subtraction.
      *   Write Pair 1 on the board.
      *   Write Pair 2 on the board.
      *   Show them that **Option C is exactly Option A minus the 89% common chance.**
      *   Show them that **Option D is exactly Option B minus the 89% common chance.**
      *   *The Line:* "If you prefer A over B, you *must* prefer C over D. You just subtracted the exact same 89% chunk from both sides. By switching, you let the *presence* of certainty change the math, not just the *amount* of money."

  ### 4. Handling the Stakes (Cash vs. Detention)
  **Do not use detention.**
  *   **Why:** Detention introduces *loss aversion* and varying utility curves. One kid might hate detention 10x more than another. Cash is (relatively) linear for this group.
  *   **What it needs:** The stakes must be high enough to matter, but hypothetical enough to be safe. \$1M vs \$5M is standard for a reason—it creates a life-changing gap that makes the "sure thing" tempting.
  *   **What it must not have:** Ambiguity. If they think "You don't actually have \$1M," they are playing a different game. State: "Assume the money is real and in a locked box."

  ### 5. Killing Misconceptions (Timing is Key)

  **Misconception 1: "Humans are just irrational/dumb."**
  *   **When to kill it:** During **The Reveal (Min 12)**.
  *   **The Script:** "Standard econ says you violated the 'Independence Axiom' and are therefore irrational. But almost everyone does this. So either 90% of people are broken, or the axiom ignores something real. That 'something' is that certainty has a psychological value that probability math doesn't capture. You aren't bad at math; the map is missing terrain."

  **Misconception 2: "Isn't this the Ellsberg Paradox (unknown odds)?"**
  *   **When to kill it:** During **The Setup (Min 1)**.
  *   **The Script:** "In some experiments, you don't know the odds. Here, the probabilities are written on the box. There is no ambiguity. You know exactly how risky it is. This is purely about how you weight known risk vs. certainty."

  ### 6. The Closing Question (Minute 19)
  You need to check if they understood the *structural* violation, not just the choices.

  *   **Ask:** "If I offered to swap your Pair 1 choice for the other option plus \$10,000, most of you wouldn't take it. But if I offered to swap your Pair 2 choice for the other option plus \$10,000, many of you would. Why does the cash bonus matter in one case but not the other, if the odds shifted by the exact same amount?"
  *   **What you're looking for:** Answers that mention "certainty," "peace of mind," or "the 100% feels different than the 11%."

  ### 7. What to Flat-Out Refuse (The "Do Not Enter" Zone)
  You have 20 minutes. If anyone asks about these, park them for next month:
  1.  **Prospect Theory Weighting Functions:** Do not draw the S-curve or talk about $\pi(p)$. It's too much math for the time.
  2.  **Normative vs. Descriptive:** Don't get bogged down in "what *should* we do" vs "what *do* we do." Stick to "The model predicts X, we did Y."
  3.  **Real Money:** Do not promise to actually pay them. It creates logistical nightmares and changes the risk profile if the pot is small.

  ### Summary Checklist for You
  1.  **Handouts:** Two separate slips of paper. Collect Slip 1 before handing out Slip 2.
  2.  **Board Work:** Have the subtraction algebra pre-written on a slide or back pocket so you don't waste time calculating.
  3.  **Tone:** You are not proving they are wrong. You are proving the *textbook model* is incomplete.

  If you lock in the commitment on Pair 1 before they see Pair 2, the paradox will happen. If you show them side-by-side, they will logic their way out of it. **Separation is everything.**
