answer: |-
  Good evening. To the incoming crew, to my own crew who have stood the watch with me, to the families who held the home front while we were underwater, and to our guests from the university who study the architecture of peace while we lived inside it: welcome.

  Twenty-two years. Most of them spent in the quiet. When you spend that much time in strategic forces, you learn that the loudest things are often the ones that never happen. You learn to measure success in silence. For the families here, especially the children who have never set foot on a base, you know the absence. You know the missed birthdays, the holidays spent looking at a phone waiting for a signal. You know the uniform, but you do not know the weight of the keys. Tonight, I want to talk about that weight, because it is the only thing that matters.

  There is a question that follows us everywhere, from the wardroom to the dinner table. It is the question the academics write papers about and the question spouses ask themselves in the dark when the news gets bad. The question is simple: If it had come to it, would you have done it?

  I spent three hours yesterday debating this with a friend from my old unit. He told me that the answer doesn't matter. He argued that the deterrent never depended on us being willing to pull the trigger. He said credibility was built entirely out of procedure: checklists, two-man rules, authority delegated downward in advance so that nobody's stomach ever entered into it. In his view, the individual was replaceable. The system was the weapon. We were just the components that kept the circuit closed.

  If he is right, then my career was theatre with extra steps. But I do not think he is right. Systems do not breathe. Systems do not dream. Systems do not carry the moral weight of a decision until the moment that decision is required. The procedures you study—the safeguards, the locks, the codes—they are essential. They ensure that no single person acts alone, and that no action is taken lightly. But a checklist cannot hold the line. Only a person can do that.

  So, to the question of whether we would have done it: The answer lies in the tension between those two views. We trained until the action was certain, so that the action never became necessary. We cultivated the capacity for catastrophe so that catastrophe would never find a reason to bloom.

  This is the hard part to say in a room full of children. To suggest we were bluffing insults the crew who stood the watch; it tells them their vigilance was a lie. To suggest we were eager monsters insults the humanity of every sailor who swore to protect this country. So here is the truth that fits in the space between: We accepted the burden of the question so our children wouldn't have to face the answer.

  We maintained the absolute certainty of our response to ensure the impossibility of its necessity.

  That is the paradox we lived. A threat only works if you would carry it out. Carrying it out would be unforgivable. And so we loosened our own grip on purpose, letting the chance of an accident do our negotiating for us, while praying every day that the accident never happened. We made ourselves dangerous enough to keep the peace, and human enough to hope we never had to keep it by fire.

  To the incoming commander: The boat is yours. The procedures are yours. But the weight is yours now, too. Do not let the paperwork convince you that the system does the work alone. It requires people who understand what is at stake. It requires crews who know that their success is measured by their ability to do nothing, but that ability requires them to be ready to do everything.

  To the families: Thank you for letting us carry this so you didn't have to. To the academics: You study the logic of deterrence. We lived the cost of it. The logic holds only because the people held.

  It was not theatre. It was a vigil. And tonight, I pass the watch.

