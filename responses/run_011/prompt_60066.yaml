answer: |-
  # Activity: The Bookie's Dilemma

  ## 1. Rule Set (Student Handout)

  **THE CONSISTENCY GAME**

  **Objective:** Maintain a consistent market for "Contingent Tickets" across changing information without losing Faculty Lounge Reputation Points (FLRPs).

  **The Setup:**
  1.  **The World:** There are 8 possible scenarios (World Cards 1–8).
  2.  **The Pot:** You hold 40 Tokens. This represents total certainty.
  3.  **Distribution:** Place Tokens on the World Cards to represent how likely each scenario is. (Initial suggestion: 5 Tokens per card).
  4.  **The Variables:**
      *   **Switch (A):** Cards 1–4 have the Switch UP. Cards 5–8 have the Switch DOWN.
      *   **Light (C):** Cards 1–3 and 5–6 have the Light ON. Cards 4 and 7–8 have the Light OFF.
  5.  **The Ticket:** You are selling a ticket on the statement: *"If the Switch is UP, the Light is ON."*
      *   **Payout:** The ticket pays 40 Tokens if the statement is **True** in the actual world. It pays 0 if **False**.
      *   **Pricing Rule:** You must set the Ticket Price equal to the proportion of Tokens in Switch-UP worlds that are also Light-ON worlds.
      *   *Formula:* Price = (Tokens on A & C) ÷ (Tokens on A) × 40.
  6.  **Truth Marking:** To sell the ticket, you must physically mark which World Cards make the statement **True** (place a Green Chip) and which make it **False** (place a Red Chip). The sum of Tokens on Green Cards must equal your Price.

  **The Rounds:**
  *   **Round 1:** Set your Tokens and Price. Mark your Truth Cards.
  *   **Round 2 (Update):** The Game Master announces new information (e.g., "The Light is ON"). Remove all World Cards that contradict this. Redistribute remaining Tokens to sum to 40.
  *   **Constraint:** You must keep the **Pricing Rule**. Recalculate the Price. Adjust your Green/Red Chips to match the new Price.

  **The Crisis:**
  If your Truth Markings imply that the Switch status (UP/DOWN) changes the Ticket's value *independently* of the Light, you risk a "Bookie Collapse." You will be offered a choice:
  1.  Change the Pricing Rule.
  2.  Admit the Ticket's value depends *only* on the Light, rendering the Switch irrelevant.

  **Currency:** All calculations must use whole Tokens. No fractions.

  ***

  ## 2. Cover Story: The Magic Box

  "Imagine a sealed Magic Box on the table. It has a Red Switch and a Blue Light.
  *   **Switch UP (A):** You actively press the switch.
  *   **Light ON (C):** The box beeps and glows.

  **Intuition:** Pressing the switch *makes* the light go on. If you don't press it, the light probably stays off. The Switch *matters* to the Light.
  **Your Job:** You are the Casino. You must set odds on the claim: *'If you press the switch, the light will go on.'*
  **The Catch:** You must price this claim exactly as if it were the probability of the light going on *given* the switch is pressed. But you must also treat the claim as a fixed bet that wins or loses depending on the world we are in."

  ***

  ## 3. Minute-by-Minute Timeline (100 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Briefing** | Distribute cards, chips, tokens. Explain rules. Emphasize: *Price must match the Ratio Rule.* |
  | **10-25** | **Round 1** | Students distribute 40 tokens (5 per world). Calculate $P(C|A)$. Set Price. Mark True/False worlds. <br>*Target:* Price = 30 Tokens (3/4). Green chips on 1, 2, 3, and some $\neg A$ worlds. |
  | **25-30** | **Check** | Instructor circulates. Ensure arithmetic holds. Ensure Green Chip Token sum = Price. |
  | **30-55** | **Round 2 (Update)** | **Scenario A:** Announce "The Light is ON." Remove $\neg C$ cards (4, 7, 8). <br>Students redistribute tokens (must sum to 40). Recalculate Price. <br>*Target:* $P(C|A)$ becomes 1. Price becomes 40. All remaining cards must be Green. |
  | **55-65** | **Round 3 (Counter-Update)** | **Scenario B:** Reset. Announce "The Light is OFF." Remove $C$ cards. <br>Students redistribute. Recalculate Price. <br>*Target:* $P(C|A)$ becomes 0. Price becomes 0. All remaining cards must be Red. |
  | **65-80** | **The Squeeze** | **Discussion:** Compare Round 2 and 3 markings. <br>*Question:* "In Round 2, the ticket was True everywhere. In Round 3, False everywhere. What determined the Truth? The Switch or the Light?" <br>*Realization:* The Switch dropped out. |
  | **80-90** | **The Decision** | Present the "Bookie Collapse." <br>*Option A:* Keep the Pricing Rule. Admit "If Switch, Light" means the same as "Light." (Switch is irrelevant). <br>*Option B:* Keep the Switch relevant. Break the Pricing Rule. |
  | **90-100** | **Debrief** | Reveal the theorem. Map game moves to logic. Discuss escape routes. |

  ***

  ## 4. Debrief: Mapping the Game to the Derivation

  **1. The Identification (Stalnaker's Thesis)**
  *   *Game:* "Price = Ratio of Tokens."
  *   *Logic:* $P(A \to C) = P(C|A)$.
  *   *Function:* This forces the probability of the conditional to track the conditional probability.

  **2. The Proposition Assumption**
  *   *Game:* "Mark Green/Red Chips on Worlds."
  *   *Logic:* The conditional expresses a proposition with truth conditions. It is true in some worlds, false in others.
  *   *Function:* This allows us to apply the Law of Total Probability to the conditional itself.

  **3. The Update (Conditionalization)**
  *   *Game:* "Remove cards, redistribute tokens."
  *   *Logic:* $P_{new}(X) = P_{old}(X | \text{Evidence})$.
  *   *Function:* This tests whether the Identification holds *after* learning new information.

  **4. The Collision (Lewis's Triviality)**
  *   *Game:* "In Round 2 (Light ON), Price became 40. In Round 3 (Light OFF), Price became 0."
  *   *Logic:*
      *   If $C$ is true, $P(C|A) = 1$, so $P(A \to C) = 1$.
      *   If $C$ is false, $P(C|A) = 0$, so $P(A \to C) = 0$.
      *   Therefore, the truth of $A \to C$ depends *only* on $C$.
  *   *The Sting:* $P(A \to C) = P(C)$. The antecedent $A$ is probabilistically irrelevant to the conditional. In the cover story, pressing the button does not make the conditional more likely to be true; only the light being on does.

  **5. The Derivation Step (Law of Total Probability)**
  *   *Logic:* $P(A \to C) = P(A \to C | C)P(C) + P(A \to C | \neg C)P(\neg C)$.
  *   *Substitution:* $1 \cdot P(C) + 0 \cdot P(\neg C) = P(C)$.
  *   *Game Equivalent:* The sum of tokens on Green chips ended up exactly matching the sum of tokens on Light-ON cards, regardless of Switch position.

  ***

  ## 5. Escape Routes

  Once the squeeze is visible, students can avoid the triviality result by rejecting one of the game's constraints. Each corresponds to a major philosophical position:

  1.  **Reject Truth Markings (Expressivism / Non-Cognitivism)**
      *   *Game Move:* Refuse to place Green/Red chips. Claim the ticket doesn't "win" or "lose" in a world; it only expresses a degree of belief.
      *   *Philosophical Label:* **Robert Adams.** Conditionals have assertibility conditions, not truth conditions.
  2.  **Reject the Pricing Rule (Contextualism / Shift)**
      *   *Game Move:* Keep the chips, but change the Pricing Rule after the update. Claim "If Switch, Light" means something different after we learn the Light is On.
      *   *Philosophical Label:* **David Lewis (later) / Keith DeRose.** The proposition expressed by the conditional shifts with context.
  3.  **Accept the Squeeze (Material Conditional)**
      *   *Game Move:* Admit the Switch is irrelevant. The ticket is just "Switch is DOWN or Light is ON."
      *   *Philosophical Label:* **Frank Jackson.** The truth conditions are material, but the assertibility is governed by conditional probability.

  ***

  ## 6. Troubleshooting & Limitations

  **Predictable Failures:**
  1.  **The Early Skeptic (Minute 5):** A student will say, "Conditionals aren't true or false, so I won't place chips."
      *   *Fix:* Acknowledge this is a valid philosophical move, but for the sake of the *game's economy*, they must act as Bookies. A Bookie must know when to pay out. Ask them to play "Devil's Advocate" and assume truth conditions exist just to see if the market crashes.
  2.  **Arithmetic Drift (Minute 40):** When redistributing tokens in Round 2, students might lose the total count (e.g., end up with 38 tokens).
      *   *Fix:* Appoint a "Banker" in each group of 3-4 students whose only job is to count the pot before and after updates. Use physical tokens, not written numbers.
  3.  **Prior Exposure:** A student recognizes "Lewis's Triviality."
      *   *Fix:* Recruit them as a "Floor Manager." Their job is not to reveal the result, but to ensure other groups follow the rules strictly enough to find it themselves.

  **Is it worth running for students who know the result?**
  Yes, but the goal shifts from *discovery* to *embodiment*. For them, the task is to identify exactly which rule application triggers the collapse. They can mentor groups that are stuck, but must not name the theorem.

  **The Finite Gap (Honest Account):**
  *   **The Limitation:** In the game, students can "patch" the problem. They can say, "Okay, for *this* distribution, the Switch doesn't matter. But maybe it matters for a *different* token distribution." The game only tests one or two probability functions. Lewis's result proves that *no* probability function (within a rich enough class) can satisfy the constraints.
  *   **Is it Fatal?** No. The activity demonstrates the *mechanism* of the squeeze (the interaction between conditionalization and the thesis).
  *   **Closing the Gap in Debrief:** Explicitly state: "You found the crack in this specific wall. Lewis proved the whole building is made of this brick. No matter how you arrange the tokens (provided you have enough variety), if you keep the Pricing Rule and the Truth Markings, the Switch *always* drops out. You experienced the local instance of a global impossibility."

  ***

  ## 7. Required Materials Checklist
  *   14 Sets of 8 World Cards (labeled 1-8 with A/$\neg$A and C/$\neg$C status).
  *   14 Pots of 40 identical tokens (poker chips or coins).
  *   14 Sets of Green and Red markers/chips (for Truth Marking).
  *   14 Copies of the Rule Set.
  *   Whiteboard for aggregating results during Debrief.
