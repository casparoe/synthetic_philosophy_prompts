      *Key insight for the "Unfalsifiability" section:* The theory is a *dissolution* of the hard problem of timing. If you demand a truth condition for "when did it happen," and the theory says "there is no fact of the matter," you can't falsify it with data unless the data proves there *is* a fact of the matter. How do you prove there's a fact of the matter? By finding the Theater. So the search for the Theater is the test.

  8.  **Finalizing the Output Structure:**
