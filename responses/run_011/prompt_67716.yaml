answer: |-
  Skinner would remain an anti-realist about the semantic reality of these features, accepting their causal efficacy only as physiological traces of the training contingencies rather than as genuine representations. The intervention evidence does not force him to realism because it demonstrates only how the machinery operates, not why it was selected to operate that way, and Skinner always distinguished between the physiological mechanism of behaviour and the environmental contingencies that explain it. When an interpretability researcher intervenes on a feature direction and alters the output, they have merely stimulated a nerve within the artificial organism, proving that the activation is a causal link in the chain but not that it is an independent explanatory variable. For Skinner, the feature is not a 'concept' of a dog but a structural scar left by the correlation of dog-images with reward signals during training; pushing that feature activates the scar, but the explanation for why the scar exists and functions lies entirely in the history of reinforcement, not in the weight space itself.

  The realist claims that intervention grants causal leverage miss the point that Skinner never denied inner states have causal power; he denied they have explanatory power autonomous from the environment. To say the feature causes the output is trivially true in the same way that saying a reflex arc causes a knee jerk is true, but this tells you nothing about why the organism possesses that reflex arc rather than another. The true cause of the behaviour is the selection process—the training run and the loss function—which shaped the weights to respond to environmental regularities. The feature is a redescription of that history, a snapshot of the contingencies that built the model, and treating it as a freestanding representation commits the very error Skinner called the 'homunculus fallacy' by imbuing a structural trace with agency.

  Regarding the wrinkle of generalization to unreinforced stimuli, Skinner has a ready reply in stimulus generalization that requires no inner concepts. If a feature activates for a novel input, it is because that input shares physical properties with inputs that were explicitly reinforced during training, not because the model holds an abstract 'idea' of the class. The sparse autoencoder clusters these inputs based on statistical overlap in the activation space, but this overlap is a product of the training data's structure, not evidence of an internal semantic state. The model generalizes because the environment presented similar stimuli under similar contingencies, and the weights merely reflect that external structure. Consequently, the realist's best cases collapse into the behaviourist's standard account: the inner state is a collateral product of the outer history, and no amount of intervention on the product changes the fact that the history is the only sufficient explanation.
