          *   Failure point: Symmetry. SSA requires symmetric roles to "steal" the strategy. Here, the roles aren't symmetric, but the *logic* of "extra vote can't hurt" holds. This is Monotonicity without Strategy Stealing.
      *   *Negotiator (Additional Option):*
          *   Premise check: Monotonicity.
          *   Failure point: Signaling. Having an option might signal weakness or strength, changing the other's behavior. (Violates Independence/Observability).
      *   *General "First-Mover Advantage" claim:*
          *   Premise check: Symmetry.
