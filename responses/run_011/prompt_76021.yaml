      *   Localists insist SSA requires the *mechanism* of role-swapping, which demands Symmetry + Determinacy + Monotonicity.
      *   The "Verbal" core: Generalizers use "Strategy-Stealing" to mean "Monotonicity Argument." Localists use it to mean "Symmetry + Monotonicity + Role-Swap Proof."
      *   Substantive core: Does the logic of SSA rely on the *structure of the game* (Localist) or the *structure of rational choice* (Generalizer)?

  7.  **Address the "Genuine Refutation" Question:**
      *   Can premises hold and conclusion fail?
      *   If Premises = Symmetry, Finite, Deterministic, Monotonicity, No Draws.
