      *   **Constraint:** Do not survey game theory or list new examples. Focus on structure.

  2.  **Deconstruct the Strategy-Stealing Argument (SSA):**
      *   *Core Logic:* P1 makes arbitrary move $m_1$. P1 pretends to be P2 using P2's hypothetical winning strategy $S_2$. If $S_2$ calls for a spot taken by $m_1$ (or subsequent "wasted" moves), P1 wastes a move elsewhere.
      *   *Implicit Premises:*
          1.  **Symmetry:** The game board/rules are symmetric for both players (except who moves first).
          2.  **Monotonicity (Non-negativity):** Having an extra piece on the board is never worse than not having it. (Extra marks never hurt).
          3.  **Determinacy/Finite:** The game must end, no chance, perfect information.
          4.  **No Draws (or Draw = Win for P1):** If draws are possible, SSA only proves P1 can force at least a draw. To prove a win, draws must be impossible.
          5.  **Strategy Existence:** One player *must* have a winning strategy (Zermelo's Theorem context).
          6.  **Unobservability/Independence (Crucial Nuance):** The opponent's strategy $S_2$ does not change based on the fact that P1 has an extra piece *unless* that piece interferes with the specific move required. (The "rival possesses no unconditional winning strategy to steal but only a comparative edge" point from Localists hints at this).

  3.  **Analyze the Camps:**
      *   **Generalizers:** Focus on Premise 2 (Monotonicity) and abstract it to "Resource Fungibility." They treat SSA as an *intuition pump* for "Extra options $\ge$ Fewer options."
