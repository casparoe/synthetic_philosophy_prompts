      *   Mathematically, if these hold, SSA is valid. A genuine refutation is impossible *within the formal system*.
      *   However, if "Monotonicity" is ill-defined in the export cases, the premise *appears* to hold but doesn't.
      *   So, a genuine refutation is impossible in principle *for the formal schema*. It is only possible if the Generalizers claim the schema applies to a case where the premises *seem* to hold but don't (e.g., hidden non-monotonicity).

  8.  **Diagnose the "Same Kind" of Failure:**
