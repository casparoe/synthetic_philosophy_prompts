answer: |-
  Hey there, it is great to hear you are digging into this stuff because honestly this is the kind of question that keeps me up at night when I am grading papers. Before I give you the number, I need to walk through the noise in my head because 1750 is a messy starting point. If we rewind to 1750, we keep the geology, so the coal is still there under Britain and Pennsylvania, but we lose the specific human capital of the Lunar Society and the specific political pressures of the Napoleonic Wars. I am thinking about the wood crisis that was genuinely happening in Britain at the time, which created a price signal screaming for energy density, but then I wonder if a different social organization could have solved that with better forestry management or wind capture instead of digging deeper. The steam engine was not inevitable in its specific form, but the pressure to convert heat to work was everywhere, from pumping mines to grinding grain. If Watt dies of childhood illness, does someone else build a separate condenser ten years later? Probably, because the thermodynamic principles were in the air, but that delay could compound. However, the physical advantage of stored chemical energy over flow energy like wind or water is so massive for industrialization that it feels like a gravitational pull hard to escape even with bad luck. Weighing the physical necessity against the historical contingencies, I am leaning heavily toward the idea that the physics constrains the social choices more than the social choices constrain the physics in this specific window.

  So if you force me to put a number on the table after sitting with that tension, my credence is 0.78 that the world in 1900 is still running mostly on fossil fuels across the majority of those rewinds. I am not at 0.9 because I think there is a real chance that a delayed industrialization combined with a breakthrough in electrical transmission or internal combustion based on alcohol could have pivoted the mix, but I am not at 0.35 because the energy density advantage of coal is just too fundamental to ignore when you are trying to melt iron or move trains. Now regarding your decomposition of lock-in, which is genuinely clever by the way, I think you can assign explanatory weight to these three buckets to understand where that 0.78 comes from. Hard lock-in carries about 0.45 of the weight because fossil fuels were physically superior in terms of energy density and transportability for the technology of the era, meaning no other source could scale to meet the demand of heavy industry without massive breakthroughs that were not guaranteed. Soft lock-in carries about 0.35 of the weight because once the mines, railways, and steam engines were built, the capital stock and skilled labor force created a massive inertia that made switching economically irrational even if alternatives existed. Your ledger lock-in carries the remaining 0.20 of the weight because the standardization of measurement and finance around coal units created a coordination tax on any alternative that was distinct from mere capital inertia.

  On the question of whether ledger lock-in is just soft lock-in wearing a hat, I think you have carved out something real here that deserves to stay separate. Soft lock-in is usually about sunk costs in physical assets and human skills, whereas your ledger idea is about the informational and institutional architecture that makes comparability possible. When insurance tables, rail gauges, and heat accounting are all denominated in coal terms, switching technologies requires rewriting the language of the economy itself, not just swapping out a machine, which is a higher order coordination problem than just replacing capital stock. However, if I were playing devil's advocate I might suggest you are missing a category I would call geopolitical lock-in, which is where state power and warfare drive technology adoption regardless of efficiency. Empires needed coal for steamships to project power, and that military imperative often subsidized the technology beyond what pure market logic would support, so that might steal some weight from your soft lock-in category.

  Looking at your two friends, the one at 0.9 and the one at 0.35 are almost certainly disagreeing on the elasticity of substitution between energy sources. The 0.9 person is likely a technological determinist who believes that energy density dictates social organization, so they think the physics of coal makes the outcome inevitable regardless of human error or chance. The 0.35 person is likely a social constructivist who believes that technology is shaped by cultural and political choices, so they think a different set of inventors or policies could have easily prioritized wind, water, or biomass despite the physical disadvantages. They are talking past each other because one is looking at the constraints of the material world and the other is looking at the agency of the human world, and your ledger concept actually bridges that gap by showing how human choices harden into material constraints.

  The tricky part about evidence for counterfactuals is that you cannot observe them directly, so you have to look for natural experiments in our actual history where conditions were similar but outcomes diverged. The single piece of evidence that would move my number the most would be finding a sustained historical example of a society between 1750 and 1900 that had access to coal but chose not to use it as a primary energy source due to social or institutional reasons rather than lack of access. If we found a region with comparable geology and economic development that industrialized successfully on peat or wood alone without collapsing, that would tank my credence significantly, but since we do not really see that at scale, the default assumption has to be that coal was the path of least resistance. Keep pushing on this ledger idea because it feels like you have got a handle on something that standard economic history often glosses over, and I would love to see where you take this next.
