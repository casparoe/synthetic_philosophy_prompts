prompt: |-
  hey, im a junior doing an independent study on why some technologies win and I've got this thought experiment I made up that I want your actual number on. Please play a historian of technology who also does philosophy of social science, think carefully, and brainstorm out loud a bit before you commit to anything.

  The rewind test: you rerun history from 1750, but every genuinely coin-flippy event gets flipped the other way — an inventor dies young, a patent gets filed twenty years late, a war ends differently, a canal company goes bankrupt. Geology and climate stay exactly as they were. My question is: accross a majority of those rewinds, is the world in 1900 still getting most of its useful energy from coal and oil? I want a credence, not an "it's complicated."

  Then decompose it. My teacher got me to split lock-in into three kinds and I want a rough probability on each with one line of why. Hard lock-in: fossil fuel was just physically so much better — energy density, transportability, always-on — that nothing else could scale. Soft lock-in: it was contingent, but once the capital stock, the skills and the finance were built around it, it kept winning. And what Ive been calling ledger lock-in, which is my own idea — the economy got denominated in coal units, so rail gauges, tonnage, insurance tables and heat accounting all turned switching into a giant coordination problem instead of a technology problem. Tell me how much of the outcome rides on each, whether ledger lock-in is a real seperate thing or just soft lock-in wearing a hat, and what other terms belong in the decomposition that I missed.

  Two friends of mine are at like 0.9 and 0.35 on this, and I want to know where they most likely disagree. Also: what would even count as evidence for a counterfactual like this, and which single piece would move your number most?

  Please write the whole thing as continuous prose, like an email to me — no headings, no bullet points, no bold, no tables. Paragraphs only.
