answer: |-
  Good evening. For those who don't know me, I'm [Name]. I teach maths to fourteen-year-olds, which means I spend my life explaining things I understand to people who are legally allowed to tell me to shut up. It is excellent training for tonight.

  My mother gave me specific instructions for this speech. Actually, she gave them twice. She said: "Do not talk about the work." She said she has spent forty years listening to people explain her own ideas back to her badly, and she would like one evening without it.

  So, naturally, I am going to disobey her. But I am going to disobey precisely.

  Most of you know Mum as the woman who wins every dispute about watering rotations on the allotment. Some of you know her as the supervisor who kept a specific idea from staying a footnote. That idea is the Kalai–Smorodinsky bargaining solution. I'm not going to use the word "axiom." I'm not going to draw a chalkboard. But I am going to tell you what she actually cared about, because it wasn't just maths. It was a view on how people should treat each other.

  My father, who died in March, was a Nash man. An applied economist. Their marriage was, essentially, a forty-year argument between two ways of cutting a cake.

  Dad believed the right deal is the one that maximizes the total value created. If walking away leaves you with nothing, and working together creates a surplus, you split it in a way that encourages the most growth. It's efficient. But Mum thought that was a licence for the person with the bigger voice, or the better outside option, to crowd out the other person's dream.

  She believed fairness means each of you ending up with the same fraction of the best you could possibly have hoped for. Measured up from wherever you'd land if you walked out instead.

  Geometrically—and I promise this is the last bit of geometry—imagine a point on a graph that represents walking away. The worst case. Then imagine a point that represents your absolute dream. The best case. Mum's solution says you draw a straight line from the worst case to the best case, and you push along that line as far as the two of you can jointly get. You split the *hope*, not just the gain.

  She used to say, with her favourite deflation, that her solution and Dad's solution give the same answer whenever the two people are exactly alike. Which she claimed was the only reason anybody tolerated hers. I think it was the only reason she tolerated the world.

  Now, I know there are people in this room who have spent thirty years telling her that her solution lets you win by putting an option on the table that nobody ever takes. Because it changes what your best case looks like, even though it's never chosen.

  To my mother's oldest sparring partner, who I see smiling near the back: You are right. It does change the deal. It implies that the mere existence of a better dream, even an impossible one, changes what is fair in the real world. That isn't a bug in her theory. It's a feature of being human. We are not machines that optimize; we are people who measure our gains against what we wished for. I am not conceding the point on her behalf, but I am saying that her "error" is the only thing that makes the math feel like justice.

  I also know that not everyone found this debate abstract. My sister is here. And she has spent a long time thinking that our parents' marriage was a negotiation in the bad sense. That we were raised as bargaining positions. I am not going to argue with her at a retirement dinner. A home where every dinner table conversation is a calibration of fairness is loud. It is exhausting. And sometimes, it feels like love is conditional on the terms being met. I want to acknowledge that. The model requires two active players. It requires noise. We were raised in the noise.

  And that brings me to March.

  The whole framework of bargaining assumes there is some agreement both people would rather have than no agreement at all. It assumes the game continues. But when one side dies, the model breaks. There is no longer a set of feasible agreements. The "walk-away" point becomes the only point. The line from the worst case to the best case collapses into a single dot.

  You cannot bargain with a ghost. You cannot split the hope.

  But if I have learned anything from fourteen-year-olds, and from forty years of this woman's work, it is that the value of a solution isn't just in the answer it gives. It's in the discipline of drawing the line correctly. Of acknowledging the walk-away point, acknowledging the dream, and having the courage to push along that line as far as possible while the other person is still there to hold the ruler.

  Dad isn't here to argue the Nash solution tonight. But I think he'd agree that the product of their gains was pretty high.

  Mum, you asked for no shop talk. But you taught us that the work is the only thing that survives the walk-away point. So, if everyone could please stand.

  To the woman who wouldn't let the idea stay a footnote. To the woman who measured fairness by the fraction of the dream. And to the memory of the man who argued the other side, so she never had to stop sharpening hers.

  To Mum.
