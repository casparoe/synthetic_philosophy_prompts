prompt: |-
  I'm two years into a PhD in cognitive science, and this term I'm auditing a research-methods seminar in which roughly half the readings concern the replication crisis. Our convener assigned a chapter from a recent trade-press book by a science journalist turned methods critic, and the chapter's central argument is condensed into a single passage near its midpoint. I'd rather not name the book, because I don't want my question to turn into a question about the author's reputation; I want to know whether the reasoning holds. Here is the passage, which I've transcribed in full:

  "Fisher's test asks one question: given that nothing is going on, how surprising are these data? Neyman and Pearson asked a different one: given that I must decide, and given that I will be wrong some fraction of the time, which hypothesis should I adopt? What mid-century psychology took over was neither but a muddle of the two, and that muddle is what eventually collapsed. Inside it, a p-value of .03 came to be read as the news that the effect is real, on the reasoning that the false-positive rate has been capped at five percent in the long run — but the long run never arrives, because every experiment is performed exactly once, and how likely a published finding is to be false depends in any case on how plausible it was before anyone collected data, which is something the significance test has no vocabulary for. Fisher proposed the one-in-twenty level only because it was convenient, and would have been appalled to watch it function as a gate on belief. The muddle also explains why the bad practice was so easy. The frequentist machinery is indifferent to what the researcher actually did: whether the sample size was fixed in advance, whether the data were inspected as they accumulated, whether twenty outcome measures were computed and one reported. An error rate is a property of a procedure, and any procedure can be redescribed after the fact so as to make the observed result unremarkable. Bayesian inference closes all of these doors at once. The posterior probability is simply the probability that the hypothesis is true given the data; it can speak for the null as well as against it; and because it is produced by conditionalizing, gathering more data cannot corrupt it. The clinching demonstration came from the notorious parapsychology study that did so much to precipitate the crisis: when the same data were put through a default Bayes factor, the striking p-values dissolved into evidence that was, at most, anecdotal. Had the field's journals demanded Bayes factors instead of significance tests a decade earlier, most of the failures that followed would have been caught before publication, and the crisis would never have acquired its name."

  I have two reasons for asking about this rather than simply absorbing it. The first is that a friend of mine who is a working statistician and an unrepentant Bayesian read the same chapter and called it embarrassing; when I pressed him for specifics he only said that the author had got the arrow backwards on one of the technical claims, and refused to say which, on the grounds that I should be able to find it myself. The second is that I find the conclusion attractive. I came out of my coursework persuaded that Bayesian machinery is the right default, and I can feel that the passage is telling me what I already want to hear, which is exactly the situation in which I most need an outside audit. The sentence I personally found most persuasive is the one about the long run never arriving, so please pay particular attention to whether that is doing real work or merely sounding good.

  Please take the role of an expert on the foundations of statistical inference — someone equally fluent in the mathematics of error rates and Bayes factors and in the philosophical arguments surrounding them, who has argued both sides of this dispute and is not a partisan. Think carefully rather than reaching for the standard list of p-value misconceptions; several sentences here are correct as they stand, and a blanket denunciation would be as unhelpful to me as uncritical acceptance. Begin by sketching the argument structure of the passage in a few sentences, identifying its premises and its conclusion and saying whether the conclusion follows even if the premises are granted. Then go through it sentence by sentence, sorting each into one of three categories: correct as stated, a defensible simplification that a specialist would sign off on, or wrong or seriously misleading. Where you can, say not only which category a sentence falls into but what the accurate version of it would be, and note any case where the chapter reaches a true conclusion by an invalid route. Identify explicitly the place or places where a technical point has been inverted or where two claims that the relevant literatures keep apart have been collapsed into one, and explain the inversion in enough detail that I could have defended it against my friend if I'd understood it. Then tell me what a defender of the error-statistical tradition — one who thinks long-run error control is the right normative target and not a dodge — would say in reply to the chapter's central diagnosis, and where that reply is strongest and weakest. Finish with a short section headed "what survives": which claims from the passage I should keep believing, what minimal revision would make the final recommendation defensible, and which features of the crisis are not problems about the choice of analysis method at all and would therefore be untouched by any such revision. Aim for something between 1,000 and 1,500 words. Please don't give me citations, a bibliography, or a reading list — I want the reasoning, and if it helps to invoke a well-known result or paradox, describe it in prose rather than pointing me to a paper.
