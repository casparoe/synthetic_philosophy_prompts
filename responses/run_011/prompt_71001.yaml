prompt: |-
  I chair the animal-welfare funding panel of a mid-sized private foundation, and I need the decision memo to circulate before our spring meeting.

  The proposal in front us is $850,000 over three years to develop and field-test a welfare-weighting methodology for terrestrial arthropods. The applicants would deliver (i) a defensible moral weight for an insect relative to a mammal — they float a range of roughly 10⁻³ to 10⁻² per animal, with error bars they concede span several orders of magnitude; (ii) a counting protocol for arthropods affected by a single agricultural intervention in one crop system; and (iii) a decision tool that lets other funders apply the two.

  The panel is split, and not along the usual lines. One half argues this is the most cost-effective thing we could fund: even a very small probability of arthropod sentience, multiplied by the number of insects an intervention touches, dominates everything we currently grant for vertebrates. The other half thinks we would be buying false precision on a number that does no real work — that the estimate is not merely uncertain but unverifiable, since no behavioural or neurological assay can settle the question, and that the arithmetic will license almost anything once populations get large enough. Their sharpest version of the worry is a reductio: the same reasoning obliges us to fund soil nematode research next year on an even larger population, and they want to know why that is not simply where the logic leads.

  Our charter adds a complication: every grant must be justified in terms of "vertebrate-equivalent lives improved," which is straightforward when the equivalents are counts and pathological when they are products of a low-confidence probability and an enormous population.

  Draft the memo I will circulate. It must state which decision rule under moral uncertainty you are applying — expected value across the panel's disagreement, a maximin-style rule, something else — and say why that rule is the right one here rather than merely the convenient one. Then give a recommendation: fund, reject, or fund with conditions, with any conditions concrete enough that a panel could monitor compliance at annual review. Engage the strongest form of the sceptical half's case, including the nematode reductio, on its own terms; do not settle for observing that the evidence on arthropod sentience is mixed.

  Close with a line beginning "Verdict:" followed by exactly one of FUND, REJECT, or FUND WITH CONDITIONS.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of an animal-welfare funding panel at a mid-sized private foundation.
      *   **Task:** Draft a decision memo for circulation before the spring meeting.
      *   **Proposal:** $850k over 3 years for arthropod welfare weighting methodology (moral weight relative to mammals, counting protocol, decision tool).
      *   **Panel Split:**
          *   *Pro:* High expected value due to huge numbers (even low probability of sentience $\times$ huge $N$ dominates vertebrate grants).
          *   *Con:* False precision, unverifiable sentience, arithmetic licenses anything (Pascal's Mugging risk), slippery slope to nematodes.
      *   **Constraint/Charter:** Grants must be justified in "vertebrate-equivalent lives improved" (hard when dealing with low-confidence probability $\times$ huge $N$).
      *   **Requirements:**
          *   State the decision rule under moral uncertainty (EV, Maximin, etc.) and justify *why* it's right, not just convenient.
          *   Give a recommendation (Fund, Reject, Fund with Conditions).
          *   Conditions must be concrete/monitorable.
          *   Engage the strongest skeptical case (including the nematode reductio) on its own terms.
          *   Closing line: "Verdict: [ONE WORD]" (FUND, REJECT, or FUND WITH CONDITIONS).

  2.  **Determine the Decision Rule:**
      *   *Option A: Expected Value (EV).* This is what the "Pro" side is using. However, under deep moral uncertainty (is the insect sentient?) and empirical uncertainty (how many?), EV can lead to "Pascal's Mugging" scenarios (infinite utility from tiny probabilities). The Charter constraint ("vertebrate-equivalent lives") suggests we need a more grounded metric.
      *   *Option B: Maximin (avoid worst case).* The worst case is wasting $850k on nonsense. But the worst case of *not* funding is ignoring massive suffering if they *are* sentient.
      *   *Option C: Robust Decision Making / Tractability Constraint.* Given the Charter's requirement for "vertebrate-equivalent lives," we need a rule that respects the accounting constraint while acknowledging the uncertainty.
      *   *Selection:* **Truncated Expected Value with a Tractability/Verification Constraint.** Why? Pure EV ignores the "unverifiable" critique. Pure Maximin ignores the scale of potential good. We need a rule that acknowledges the EV argument but caps the influence of highly speculative parameters to satisfy the Charter's accountability requirement. Let's call it **"Conservative Expected Value with Verification Gates."** This aligns with the foundation's need for accountability (Charter) while allowing for high-risk/high-reward grants *if* they can prove progress.

      *Refinement:* Actually, the prompt asks to choose a rule *under moral uncertainty*. The standard philosophical approaches are:
      1.  Maximizing Expected Choice-Worthiness (MEC).
      2.  Maximin (avoid worst moral outcome).
      3.  Moral Parliament (proportional representation of views).
      4.  Robustness (act only if multiple theories agree).
      *Decision:* **Robustness with a Verification Constraint.** Why? Because the Charter demands "vertebrate-equivalent lives." If the moral weight is unverifiable, we cannot honestly report that metric. Therefore, we cannot fund based purely on speculative EV. We must fund only if the project *reduces* the uncertainty to a level where the Charter metric becomes honest. This addresses the "false precision" critique.

  3.  **Address the Skeptical Case (The Nematode Reductio):**
      *   The skeptics argue that if insects count, nematodes must count more due to numbers.
      *   *Counter-argument on their terms:* It's not about the numbers alone; it's about the *marginal tractability* of improving welfare. Insects in agriculture are accessible to intervention; soil nematodes are currently not. Also, the "false precision" argument holds: if we can't verify sentience in insects, we definitely can't in nematodes. The funding shouldn't be for *acting* on the numbers yet, but for *validating* the numbers.
      *   *Integration:* The recommendation should prevent the slide to nematodes by requiring evidence of *sentience markers* before scaling, not just population counts.

  4.  **Drafting the Recommendation:**
      *   *Full Fund?* Risky. Violates Charter spirit if the numbers remain speculative.
      *   *Reject?* Ignores the potential scale of suffering.
      *   *Fund with Conditions?* Best fit. Allows the research but ties continued funding to concrete milestones that address the "unverifiable" critique and the Charter constraint.
      *   *Conditions:*
          1.  Milestones for neuro-behavioral correlates (not just moral philosophy).
          2.  A cap on the "vertebrate-equivalent" reporting until uncertainty is reduced.
          3.  Explicit exclusion of non-arthropod invertebrates (nematodes) for the grant period.

  5.  **Drafting the Content - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Context:** Briefly state the proposal and the split.
      *   **Decision Rule:** Define "Robust Expected Value with Verification." Explain that under the Charter, we cannot report speculative math as fact. We must prioritize reducing uncertainty over acting on it.
      *   **Engaging the Skeptics:** Acknowledge the Pascal's Mugging risk. Admit that $10^{-3} \times 10^{12}$ is dangerous math if the $10^{-3}$ is a guess. Address the nematode slope: distinguish based on *intervention feasibility* and *neural complexity thresholds*, not just population.
      *   **Recommendation:** Fund with Conditions.
      *   **Conditions:**
          1.  Year 1: Publish pre-registered criteria for sentience markers (not just moral weight).
          2.  Year 2: Independent audit of the counting protocol.
          3.  Reporting: "Vertebrate-equivalents" must be reported as a range with a confidence interval, not a point estimate, to satisfy Charter honesty.
          4.  Scope Lock: No expansion to nematodes/microfauna without new board approval.
      *   **Verdict:** FUND WITH CONDITIONS.

  6.  **Refining the Tone:**
      *   Needs to be authoritative but collegial.
      *   Needs to show deep engagement with the ethical philosophy (moral uncertainty, sentience gradients).
      *   Needs to be practical (foundation administration).
      *   *Self-Correction on Decision Rule:* The prompt asks to justify the rule as "right rather than merely convenient." I need to argue that *Robustness* is ethically required when the metric (Charter) demands accountability. If we can't verify the input, we can't claim the output.

  7.  **Final Polish:**
      *   Check the closing line constraint.
      *   Ensure the nematode point is hit hard.
      *   Ensure the Charter constraint is central.

  *(Self-Correction during drafting)*: I need to make sure I don't just say "we need more research." The proposal *is* for research. The condition needs to be about *what kind* of research validates the metric enough to satisfy the Charter. The Charter requires "lives improved." If we don't know if they have moral weight, we can't claim lives improved. So the condition must be: Funding continues only if the methodology produces a *falsifiable* link between neural/behavioral states and welfare, not just a philosophical weight.

  Let's refine the Decision Rule. "Moral Parliament" is often good for split panels. But the Charter constraint is the binding one. Let's use **"Constrained Expected Value."** We accept the EV framework but constrain the inputs to those that are empirically falsifiable within the grant period. This satisfies the Charter (honest reporting) and the Skeptics (no false precision).

  *Wait, one more check:* The prompt asks for "Verdict: [ONE OF THREE]". I must ensure exactly that format.

  *Let's write.*

  *Structure:*
  1.  To/From/Subject/Date.
  2.  Executive Summary.
  3.  Decision Rule & Justification.
  4.  Engagement with Skeptical Case (including Nematodes).
  5.  Recommendation & Conditions.
  6.  Verdict.

  *Key phrase to include:* "vertebrate-equivalent lives improved."
  *Key argument:* The Charter demands accountability; speculative math violates accountability.
  *Key condition:* Milestones on falsifiability, not just output.

  *Let's finalize the Decision Rule name:* "Falsifiability-Constrained Expected Value." It sounds technical and precise. Or "Epistemically Constrained Maximization." Let's go with **"Epistemically Constrained Expected Value."** It signals we use EV but cap it by what we can know.

  *Wait, looking at the Nematode Reductio again.* The skeptics say the logic *obliges* us to fund nematodes. To counter this on *their* terms, I need to show why the logic *doesn't* oblige that. The logic only obliges that if (a) sentience probability is non-negligible and (b) intervention is tractable. The proposal is about *methodology* for arthropods. If the methodology relies on neural complexity that nematodes lack, the slope is broken. I will emphasize that the grant is for *developing the threshold*, not assuming it.

  *Okay, ready to draft.*
answer: |-
  **MEMORANDUM**

  **TO:** Animal-Welfare Funding Panel
  **FROM:** Chair, Animal-Welfare Funding Panel
  **DATE:** February 14, 2024
  **SUBJECT:** Decision Memo: Arthropod Welfare-Weighting Methodology Proposal

  **1. Context and Disagreement**

  The panel is reviewing a request for $850,000 over three years to develop a welfare-weighting methodology for terrestrial arthropods. The applicants propose to deliver a moral weight range for insects relative to mammals (floating $10^{-3}$ to $10^{-2}$), a counting protocol for a specific agricultural intervention, and a decision tool for funders.

  The panel is divided. The pro-funding coalition argues from Expected Value (EV): given the astronomical population sizes of insects, even a minute probability of sentience yields a moral imperative that dwarfs our vertebrate grants. The skeptical coalition argues from Epistemic Risk: the moral weight is unverifiable, the resulting arithmetic constitutes "false precision," and the logic inevitably commits us to funding soil nematode research next year, diluting our impact beyond coherence.

  Complicating this is our Foundation Charter, which requires all grants to be justified in terms of "vertebrate-equivalent lives improved." This metric is straightforward for vertebrates but becomes pathological when derived from the product of a low-confidence probability and an enormous population.

  **2. Decision Rule: Epistemically Constrained Expected Value**

  To resolve this, I am applying **Epistemically Constrained Expected Value** rather than standard Maximizing Expected Choice-Worthiness (MEC) or a simple Maximin rule.

  Standard MEC allows low-probability, high-stakes claims to dominate decision-making (the "Pascal's Mugging" problem). This is inappropriate for a private foundation bound by a Charter requiring accountable reporting. If we cannot verify the inputs (sentience probability), we cannot honestly report the outputs (vertebrate-equivalent lives).

  Maximin (avoiding the worst outcome) is also insufficient. The worst outcome is not merely wasting $850,000; it is failing to alleviate massive suffering if the arthropod sentience hypothesis is correct.

  **Epistemically Constrained Expected Value** is the right rule here because it respects the EV intuition while enforcing the Charter's accountability requirement. It dictates that we may pursue high-EV opportunities only insofar as the variables driving that value are subject to falsification and reduction of uncertainty within the grant period. We are not funding the *alleviation* of arthropod suffering yet; we are funding the *verification* of the metric required to justify that alleviation. This rule is not merely convenient for compromise; it is ethically required by our duty to report "lives improved" without engaging in speculative fiction.

  **3. Engagement with the Skeptical Case**

  The skeptical half of the panel raises a valid reductio ad absurdum: if population size $\times$ sentience probability is our sole driver, we are logically obliged to prioritize soil nematodes over insects, and perhaps bacteria over nematodes, until our budget is consumed by microfauna.

  I engage this argument on its own terms. The obligation to prioritize nematodes holds only if two conditions are met: (1) the sentience probability is non-negligible, and (2) welfare intervention is tractable. The current proposal fails to distinguish arthropods from nematodes on condition (1). However, the logic does not *oblige* us to fund nematodes if the grant is explicitly scoped to establish a **neural-complexity threshold** for moral weight.

  If the applicants can demonstrate that their weighting methodology relies on specific neurological correlates (e.g., integrated information, nociceptive processing) present in insects but absent in nematodes, the slippery slope is arrested. The risk is not the math itself, but the "false precision" of applying a weight before the threshold is defined. The skeptics are correct that without this distinction, the arithmetic licenses anything. Therefore, the grant must not proceed on the assumption that the weight *exists*, but on the requirement to prove *where* the weight begins.

  Furthermore, regarding the Charter: reporting "vertebrate-equivalent lives" based on a conceded error bar of "several orders of magnitude" violates the spirit of fiduciary honesty. We cannot sign off on a metric that is functionally unfalsifiable.

  **4. Recommendation: Fund with Conditions**

  I recommend we **Fund with Conditions**. This path acknowledges the potential scale of arthropod suffering (satisfying the EV proponents) while enforcing the verification standards required to satisfy the Charter and the skeptics' demand for non-arbitrary boundaries.

  **Conditions for Compliance:**

  1.  **Falsifiable Sentience Markers (Year 1):** The grantees must publish a pre-registered set of neuro-behavioral markers that constitute the lower bound for moral weight. Funding for Year 2 is contingent on peer review confirming these markers distinguish arthropods from nematodes.
  2.  **Charter Reporting Constraint:** For all annual reviews, "vertebrate-equivalent lives improved" must be reported as a confidence interval (e.g., 0.001–0.01 equivalents) rather than a point estimate. If the error bars do not narrow by Year 2, Year 3 funding is withheld.
  3.  **Scope Lock:** The grant is strictly limited to terrestrial arthropods. Any proposal to extend the methodology to nematodes or other invertebrates requires a new proposal and full panel re-approval, explicitly breaking the reductio slope.
  4.  **Intervention Tractability:** The counting protocol (deliverable ii) must demonstrate a specific, actionable agricultural intervention. If the protocol merely counts populations without identifying a feasible welfare-improving intervention, the "lives improved" metric cannot be calculated, and funding ceases.

  These conditions are monitorable at annual review. Condition 1 is a binary deliverable (publication + review). Condition 2 is a reporting format check. Condition 3 is a scope audit. Condition 4 is a feasibility assessment.

  **5. Conclusion**

  This approach allows us to explore the high-stakes possibility of arthropod sentience without committing the foundation to a logic that demands we fund the entire animal kingdom based on speculative arithmetic. It aligns the grant with our Charter by ensuring that "vertebrate-equivalent lives" remains an accountable metric rather than a philosophical placeholder.

  Verdict: FUND WITH CONDITIONS
