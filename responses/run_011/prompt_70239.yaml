answer: |-
  ### The Specification for an Adequate Criterion of Composition

  You are right to resist producing a criterion before specifying the job it must do. In a dispute where one party demands precision and the other demands fidelity to common sense, the specification itself is the battleground. Below is the inventory of cases and distinctions any candidate theory must address, followed by the audit of your eight constraints and an analysis of their compatibility.

  #### I. The Inventory of Adjudication
  An adequate answer to the Special Composition Question (SCQ) must deliver a verdict on the following classes of case. It need not validate our pre-theoretical intuitions about them, but it must locate them within its ontology.

  1.  **Scattered Entities:** Dispersed items sharing no spatial contact (e.g., the parts of a disassembled bicycle in different rooms).
  2.  **Mere Contact:** Items touching at a boundary but sharing no material bond (e.g., two bricks placed side-by-side).
  3.  **Fastening and Bonding:** Items connected by chemical bonds, glue, or mechanical fasteners (e.g., a nailed plank, a water molecule).
  4.  **The Sorites Ladder:** A sequence of cases moving by imperceptible degrees from scattered particles to a firmly unified artefact, requiring the theory to locate a cutoff or deny one exists.
  5.  **Organised Pluralities:** Groups defined by function or arrangement rather than physical connection (e.g., a swarm of bees, a queue of people, a football team).
  6.  **Constitution Cases:** Coincident entities where one seems to constitute the other (e.g., a statue and the clay comprising it).
  7.  **The Thinking Parts Problem:** If a person is composite, the theory must explain why the parts (or the person-plus-parts) do not also count as thinkers, avoiding an explosion of conscious subjects.
  8.  **Diachronic Survival:** Whether a composite persists through the replacement or rearrangement of parts (e.g., the Ship of Theseus).

  #### II. The Distinctions to Preserve
  The criterion must not collapse the following distinctions, lest it cease to be a theory of *composition* and become a theory of something else.

  1.  **Composition versus Identity:** The whole must be distinguished from its parts, even if closely related; composition is not identity.
  2.  **Existence versus Arrangement:** The existence of a whole must be distinct from the mere obtaining of spatial or causal relations among the parts.
  3.  **Synchronic versus Diachronic:** The conditions for composing a thing *now* must be distinguishable from the conditions for persisting *over time*.
  4.  **Linguistic versus Ontic Vagueness:** The theory must state whether indeterminacy lies in our concepts or in the world itself.
  5.  **Informative versus Circular:** The criterion must not simply restate 'composition occurs when things compose a whole' or use synonyms like 'unity' without analysis.

  #### III. Audit of the Eight Constraints
  Here is the audit of your proposed constraints. I have categorised them as **Genuine** (methodologically necessary), **Redundant** (covered by others), **Question-Begging** (assumes the answer), or **Partisan** (favours one camp).

  *   **(i) Stability:** *Partisan.* This demands that existence not hinge on microscopic differences. It rules out ontic vagueness and favours precisificational accounts. It is an engineering desideratum, not a metaphysical necessity.
  *   **(ii) Supervenience:** *Genuine but Strong.* It is reasonable to demand that composition depend on the physical facts. However, strictly limiting this to *local* qualitative distribution may rule out functionalist or externalist accounts of objects.
  *   **(iii) Ideological Parsimony:** *Genuine.* To analyse composition, one cannot use the notion of a 'whole' in the *analysans*. However, the output must allow for the positing of objects, or the engineering goal fails.
  *   **(iv) Causal Non-redundancy:** *Genuine (with caveats).* Assuming the causal closure of the physical, composites should not overdetermine effects. However, this constrains the *nature* of the composite more than the *criterion* for composition.
  *   **(v) Mechanical Checkability:** *Partisan.* This is the engineering supervisor's constraint. It demands a decision procedure independent of human interests. It rules out pragmatic, conceptualist, or interest-relative accounts of composition.
  *   **(vi) Conservatism:** *Partisan.* This is the metaphysics supervisor's constraint. It demands the output match ordinary belief (tables exist). It rules out Nihilism and strict Universalism.
  *   **(vii) Harmony with Mereology:** *Genuine.* One must state whether classical mereology holds or where it breaks. Silence here renders the criterion unusable for formal ontology.
  *   **(viii) Explanatory Fertility:** *Genuine.* If composition never makes a difference to behaviour or description, positing composites is idle. However, this risks conflicting with (iv) if 'making a difference' implies new causal powers.

  #### IV. Non-Negotiables versus Partisan Commitments
  You suspected that your supervisors' demands cannot both be honoured. You are correct. The primary tension lies between **(v) Mechanical Checkability** and **(vi) Conservatism**, mediated by the nature of vagueness.

  *   **The Engineering Commitment (v):** Requires a function that takes a complete physical description and outputs a binary verdict (Object/No Object). This function must be precise. There can be no 'maybe'.
  *   **The Metaphysical Commitment (vi):** Requires that this binary verdict align with ordinary language, which is inherently vague. There is no precise number of atoms whose arrangement switches a collection from 'non-table' to 'table'.

  If you satisfy (v), you must posit a sharp cutoff in the Sorites Ladder. This violates (vi), because ordinary belief holds that there is no such sharp cutoff. If you satisfy (vi) by allowing vagueness, you violate (v), because a robot cannot execute a vague predicate without a precisification rule.

  **The Non-Negotiables:**
  To proceed without begging the question, you should retain only:
  1.  **Ideological Parsimony (iii):** To ensure it is an analysis.
  2.  **Supervenience (ii):** To ensure it is naturalistic.
  3.  **Harmony with Mereology (vii):** To ensure formal coherence.
  4.  **Adjudication of Cases (Section I):** To ensure it addresses the phenomena.

  You should discard **Stability (i)**, **Mechanical Checkability (v)**, and **Conservatism (vi)** as *requirements for the specification*. These are not criteria for a *good theory*; they are the conflicting *goals* of your supervisors. A specification should not demand the theory solve the conflict before the theory is proposed.

  #### V. Joint Unsatisfiability
  You asked whether a subset of requirements is jointly unsatisfiable. Specifically: *Non-vagueness, Stability (i), Ideological Parsimony (iii), and Restricted Composition.*

  **Yes, this set is jointly unsatisfiable.** This is the core of the 'Vagueness Argument' in contemporary metaphysics.

  1.  If composition is **Restricted** (not everything composes, not nothing composes), there must be a boundary between cases where composition occurs and cases where it does not.
  2.  If the criterion is **Non-vague** and satisfies **Stability (i)**, this boundary must be sharp and stable under small perturbations.
  3.  If the criterion satisfies **Ideological Parsimony (iii)** and **Supervenience**, the boundary must depend solely on the physical arrangement of the parts.
  4.  However, physical arrangements vary continuously (the Sorites Ladder). A sharp boundary in existence implies a sharp boundary in physical properties (e.g., composition occurs at bond strength $X$ but not $X - \epsilon$).
  5.  Such a sharp boundary in physical properties is implausible (it makes existence arbitrary) or requires accepting that tiny physical differences create massive ontological differences.

  **Which requirement has to give?**
  One of the four must be abandoned.
  *   **Abandon Restriction:** Accept Universalism (everything composes) or Nihilism (nothing composes). This saves precision but violates Conservatism (vi).
  *   **Abandon Non-vagueness/Stability:** Accept ontic vagueness. This saves Conservatism but violates Mechanical Checkability (v).
  *   **Abandon Supervenience/Parsimony:** Accept brute modal facts about composition. This saves Restriction and Precision but makes the criterion uninformative and scientifically opaque.

  The specification itself reveals that your supervisors are asking for a solution to a problem that may have no solution within the constraints they have jointly imposed.

  #### VI. The Exclusionary Desideratum
  The single desideratum that does the most work in excluding candidates is the demand for a **Restricted Composition that is both Precise and Supervenient**.

  While this appears as a combination, the driving force is the demand for **Precision (Non-vagueness)** in a **Restricted** domain.
  *   If you allow vagueness, Nihilism, Universalism, and Moderate Restrictivism all become viable (by locating the vagueness differently).
  *   If you allow Universalism or Nihilism, Precision is easy to maintain.
  *   It is only the insistence that *some* things compose objects while *others* do not, combined with the insistence that *which* ones do so is a matter of precise fact, that renders almost every candidate theory untenable. This demand forces the theory to locate a magic moment in a continuous physical process where existence pops into being.

  #### VII. Closing Scorecard
  Against the trimmed list (Parsimony, Supervenience, Mereological Harmony, Case Adjudication), the main families fare as follows. **Nihilism** satisfies precision and supervenience easily but fails Conservatism and struggles with the Thinking Parts problem. **Universalism** satisfies precision and supervenience but fails Conservatism and renders the concept of an 'object' trivial for robotics. **Moderate Restrictivism** (e.g., contact, fastening, life) satisfies Conservatism but inevitably fails Precision or Supervenience, succumbing to the Sorites paradox. **Ontic Vagueness** satisfies Conservatism and Restriction but fails Mechanical Checkability and Stability. There is no free lunch; the specification proves that the conflict between your supervisors is not a matter of finding the right words, but of choosing which theoretical virtue to sacrifice.
