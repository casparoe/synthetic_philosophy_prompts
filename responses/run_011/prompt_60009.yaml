          **Project Title:** The Determinacy of Comparative Liberalism: A Robustness Analysis of Sweden and Norway

          **Research Question:** Is the comparative claim "Sweden is more liberal than Norway" determinate? Current methods yield contradictory or null results. This project treats comparative liberalism as a function of admissible weightings over distinct dimensions of liberty. It asks whether the ranking holds stable across all normatively admissible weightings, or whether indeterminacy is structural.

          **Critique of Existing Approaches:** Quantitative indices (e.g., Freedom House, V-Dem) suffer from ceiling effects; scoring 99 versus 98 offers no discriminatory power and obscures the normative weighting of sub-indicators. Qualitative policy lists identify cross-cutting pressures (e.g., Norway's wealth tax vs. Sweden's school vouchers) but conclude only that the cases are "different," leaving open whether a fact of the matter exists. Both approaches assume a single dimension of liberalism or arbitrary weighting schemes.

          **Methodology:** I will employ a robustness analysis commonly used in decision theory but applied here to normative concepts. I will construct a multidimensional space of liberty dimensions (economic, civil, educational). Instead of fixing weights arbitrarily, I will define the set of "admissible weightings" in two ways: first, derived from competing theoretical conceptions (e.g., negative vs. republican liberty); second, derived from the political communities' self-understandings (government white papers, constitutional interpretations). I will then test whether the Sweden-Norway ranking is stable across these sets.

          **Timeline:** Months 1-2: Dimension selection and sourcing self-understanding documents. Months 3-4: Modeling admissible weighting sets and testing stability. Months 5-6: Drafting results and theoretical implications.

          **Justification:** Why not build a better index? Because indices mask the normative contestation this project exposes. Why not pure conceptual analysis? Because it ignores how liberal states actually operationalize freedom. Why not more cases? Two maximally similar cases control for confounders, isolating the weighting problem. This approach bridges ideal theory and non-ideal comparison without reducing liberty to a metric.

          **Expected Outcome:** The result will not necessarily be a verdict. It may be a mapped structure of indeterminacy, identifying the "pivot dimensions" where changing weights flips the ranking. Crucially, I hypothesize that determinacy depends on *who* fixes the weights: external theorists may find indeterminacy where internal self-understandings yield a stable ranking, or vice versa.

          **Failure Conditions:** The project fails if the "admissible set" cannot be sufficiently constrained to generate any stability tests, rendering all comparisons equally valid. It also fails if the self-understanding documents prove too ambiguous to extract weighting priorities.

          **Scope Limit:** This is strictly limited to two cases and a synchronic analysis. Adding a third case (e.g., Denmark) or historical diachronic tracking would exceed the six-month timeframe.

          **Departmental Fit:** While this involves measurement, it treats weighting not as a technical problem but as a normative theoretical one, interrogating the conditions under which comparative political judgments are intelligible.

