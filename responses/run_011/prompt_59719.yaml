answer: |-
  **Buddhist:** Venerable one, consider the man who stands at the edge of the forest. The forester tells him, "A *gavaya* is like a cow." Later, the man sees a beast in the woods and knows, "This is a *gavaya." You posit a separate means of knowledge, *upamāna*, to account for this. But I ask you: what exists to be known? Only two things exist: the bare particular (*svalakṣaṇa*), which is ineffable and unique, and the general characteristic (*sāmānyalakṣaṇa*), which is constructed by thought. Perception grasps the former; inference grasps the latter. When the man sees the animal, he perceives its unique form. When he applies the word "*gavaya*," he infers the connection based on the forester's earlier statement. Why multiply means beyond objects?

  **Naiyāyika:** Friend, you individuate instruments of knowledge by the ontology of the object. We individuate them by the distinctness of the cognition produced. The cognition here is not merely "there is an animal" (perception), nor is it "fire exists because smoke exists" (inference). The cognition is "This animal is the referent of the word I heard previously." This knowledge arises from the apprehension of similarity (*sādṛśya*) between the remembered cow and the perceived beast. If this were mere inference, the man would need a universal premise: "Whatever resembles a cow is a *gavaya*." But he does not possess this premise. He only knows the forester's word.

  **Buddhist:** But the forester's utterance is itself a sign. To understand language is to infer meaning from sound. When the forester speaks, the man infers the existence of a certain animal type. When he sees the beast, he perceives the particular. The conjunction is simply memory meeting perception. You claim he lacks the universal premise, but does the mind not construct one implicitly? He thinks, "The forester said *gavaya* resembles a cow; this resembles a cow; therefore, this is a *gavaya*." This is inference disguised as comparison. If you cannot reconstruct the reasoning, it does not mean the reasoning is absent; it means the cognition is rapid.

  **Naiyāyika:** You confuse the capacity to reason with the actual operation of the mind. If I ask the man *why* he knows this is a *gavaya*, he will not say, "I deduced it from a universal correlation." He will say, "Because it looks like what the forester described." The knowledge of the relation between the word and the object is novel. In inference, the relation between the mark and the thing marked must be known beforehand. Here, the relation between the word "*gavaya*" and the animal before him is established *now*, through the perception of similarity. This fixing of the name to the object is not inference, for the universal connection was unknown prior to this moment.

  **Buddhist:** You insist on the novelty of the cognition, but I insist on the poverty of the objects. If *upamāna* is a distinct means, it must have a distinct object. What is this object? Is it the particular animal? Then it is perception. Is it the universal "cow-likeness"? Then it is inference. If you say the object is the "relation between word and thing," I ask: can this relation be identified independently of the means you propose? If the object is not independently identifiable, how can it ground a means of knowledge? You seem to posit a means simply because the knower is confused about his own process.

  **Naiyāyika:** And you seem to dissolve the experience of knowing to fit a rigid ontology. I concede this: if the object of a *pramāṇa* were entirely indistinguishable from the objects of other *pramāṇas*, positing a new means would be futile. The object of comparison is indeed complex—it involves the word, the referent, and the similarity. But I ask you to concede this: if a knower cannot reconstruct the reasoning process, can you truly call it inference? Inference requires a conscious movement from reason to conclusion. Here, there is only a flash of recognition triggered by similarity. To call this inference is to stretch the definition until it breaks.

  **Buddhist:** I will concede that point regarding the layman. If the man cannot state the premise, calling his cognition "inference" in the technical sense is strained. However, this does not prove *upamāna*. It merely proves that much of what humans call "knowledge" is a muddled mix of perception and latent impression. But consider testimony (*śabda*). You count it as a separate means. I say it is inference. We infer the speaker's reliability and thence the truth of the statement. If testimony is inference, and comparison is testimony plus perception, you are left with only two.

  **Naiyāyika:** Testimony is not inference because we do not always reason to the speaker's reliability. When a trusted teacher speaks, we accept the truth immediately, without deliberating on their character. Similarly, in the forest, the man does not deliberate on the forester's reliability again. He sees the similarity and the knowledge arises. You reduce everything to inference because you wish to save your two objects. I multiply means because I wish to save the phenomena of knowing.

  **Buddhist:** But if you save the phenomena by multiplying entities, do you not lose the ground of truth? A means of knowledge must lead to a real object. If your "comparison" grasps a relation that is neither a unique particular nor a constructed universal, what ontological status does it have? If it has no status, it is illusion. If it has status, it must fall into one of my two categories. You force me to choose between your phenomenology and reality itself.

  **Naiyāyika:** And you force me to choose between your reality and the lived experience of the knower. If the cognition feels distinct, functions distinctively, and produces a result that neither perception nor inference could produce alone—namely, the application of a name to a new object based on similarity—then the means is distinct. You ask for the object's independent status. I ask for the cognition's independent validity.

  **Buddhist:** Yet, if the cognition relies entirely on the perception of the particular and the memory of the universal, is it not dependent? A distinct means should have a distinct causal origin. Here the causes are perception and memory.

  **Naiyika:** The causal complex is unique. The perception of similarity acting as the bridge between word and object is a specific causal configuration not found in standard inference. In inference, the mark proves the existence of the object. Here, the similarity proves the *name* of the object.

  **Buddhist:** But the name is a universal construct. Thus, proving the name applies is an act of conceptual construction, which is inference. You are trapped by your own criterion. You say the cognition is distinct, but you describe it using the materials of my two means.

  **Naiyāyika:** And you are trapped by yours. You say the means are determined by objects, but you cannot show me the object of inference without presupposing the mental construction that you claim inference produces. We stand at the edge of the forest, you looking at the trees and counting them, I looking at the path the man walks.

  **Buddhist:** If the path leads nowhere, counting the trees is useless.

  **Naiyāyika:** If the trees are not there, the path is an illusion. But the man knows the beast. That knowledge stands.
