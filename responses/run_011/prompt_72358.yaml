answer: |-
  ## Part 1: The Logical Space

  Before defining the questions, we must define the dimensions of disagreement this instrument is designed to probe. We are not mapping *dates* (1610, 1800, 1950); we are mapping *criteria for validity*.

  There are four axes of tension in the room. The questions below are engineered to force participants to reveal their coordinate on each axis.

  1.  **Materiality (Rock vs. Story):** Is the boundary defined by a physical signal preserved for deep time (Stratigraphy), or by the onset of a causal narrative (History/Philosophy)?
  2.  **Agency (Species vs. System):** Is the driver "Humanity" as a biological force, or specific social/economic structures (Capitalism, Colonialism)?
  3.  **Formalism (Epoch vs. Heuristic):** Is the goal a ratified geological unit (ICS approval), or a useful conceptual tool for the present?
  4.  **Permanence (Irreversible vs. Trend):** Must the change be effectively permanent to count as an epoch, or can a temporary deviation draw a boundary?

  ### The Target Leaves (Occupied Cells)
  Based on current scholarship, we expect participants to cluster into six distinct profiles.
  1.  **The Formalist:** Prioritizes Materiality (Rock) and Formalism. (Typical Geoscience).
  2.  **The Early Anthropogenist:** Prioritizes Agency (Species) and Story. (Typical Deep History).
  3.  **The Orbis Advocate:** Prioritizes Materiality (Global Signal) but accepts unintentional Agency. (The 1610 CO2 dip).
  4.  **The System Critic:** Prioritizes Agency (System). Often indifferent to Formalism. (Capitalocene/Plantationocene).
  5.  **The Pluralist:** Rejects the need for a single coordinate on Materiality or Agency. Context-dependent.
  6.  **The Rejectionist:** Rejects Formalism entirely. Views the "Epoch" as a category error.

  ### The Empty Cells (Diagnosed Gaps)
  The instrument will inevitably produce answer combinations that correspond to no coherent position. Identifying these is as valuable as finding the clusters.
  *   **Cell A (Incoherent):** Demands a permanent rock marker *and* demands the date shift based on political responsibility. (Stratigraphy cannot track morality).
  *   **Cell B (Unwanted):** Rejects formal ratification *but* insists on a single, universal start date for all disciplines. (Why forbid the epoch if the date is universal?)
  *   **Cell C (Unexplored):** Argues that if the change is reversed (e.g., CO2 sequestered), the epoch boundary disappears. (Geology generally treats boundaries as permanent once made).

  ### Instrument Limitations
  *   **The Industrial/Acceleration Blur:** This instrument distinguishes "Process Start" from "Signal Spike." It will likely group 1800 (Industrial) and 1950 (Great Acceleration) participants into the same leaf ("Causal/Process"). They share a criterion (onset of mechanism) but disagree on magnitude. A follow-up discussion is needed to separate them.
  *   **The "Orbis" Nuance:** Participants who pick the 1610 signal might do so for different reasons (it's the best global marker vs. it highlights colonialism). The instrument groups them by *criteria*, not *motivation*.

  ***

  ## Part 2: The Instrument

  **Instructions:** Read each scenario or claim. Select the option that best matches your intuition. Do not overthink; there are no correct answers.

  **Q1. The Million-Year Test**
  Imagine a geologist one million years in the future. They are looking for the boundary of this period. What is the most important feature they must find?
  *   A. A distinct, synchronous layer of material (ash, isotope, plastic) present globally.
  *   B. Evidence of a sustained shift in Earth system processes, even if the signal is messy.
  *   C. They won't find a boundary; the stratigraphy is too diachronous (time-transgressive) to mark a single line.

  **Q2. The Unexperienced Change**
  Consider the dip in atmospheric CO2 around 1610, linked to the depopulation of the Americas. It was global and detectable in ice cores, but no one at the time knew it was happening. Does this count as a valid start?
  *   A. Yes, if the signal is global and synchronous, human awareness is irrelevant.
  *   B. No, a geological epoch driven by humans requires a change in human *behavior* or *system*, not just a demographic accident.
  *   C. It counts as data, but not as a boundary. It's a fluctuation, not a new state.

  **Q3. The Reversibility Clause**
  Suppose humanity successfully sequesters carbon and restores biodiversity to pre-1950 levels within 200 years. Does the "Anthropocene" end?
  *   A. No. Once the boundary is set in the rock record, it is permanent history, regardless of future recovery.
  *   B. Yes. If the Earth system returns to Holocene-like stability, the label no longer applies.
  *   C. The label should remain as a warning, even if the physical conditions revert.

  **Q4. The Driver's Name**
  We are trying to name the cause of the change. Which distinction matters most for setting the date?
  *   A. When the human species became a dominant geomorphic force, regardless of culture.
  *   B. When a specific economic or political system (e.g., capitalism, colonialism) began driving the change.
  *   C. The cause is too distributed to be pinned to a single driver or date.

  **Q5. The Lab Coat**
  What is the primary purpose of defining this start date?
  *   A. To create a formal unit of the Geological Time Scale, ratified by scientific bodies.
  *   B. To provide a shared heuristic for interdisciplinary research, regardless of ratification.
  *   C. To assign responsibility or blame for the current crisis.

  **Q6. The Synchronicity Problem**
  Industrialization began in Britain in 1780, but reached Brazil in 1950 and rural China in 1980. How do we mark the start?
  *   A. We pick the earliest onset (1780) as the global boundary, acknowledging the lag.
  *   B. We pick the moment the signal becomes globally synchronous (e.g., 1950s radionuclides).
  *   C. We reject a single global date; the onset is inherently staggered.

  **Q7. The Signal Clarity**
  You have to choose between two start dates. Option X has a very clear causal story but a muddy physical signal. Option Y has a razor-sharp physical signal but a complex, debated causal story. Which do you pick?
  *   A. Option X (Story over Signal).
  *   B. Option Y (Signal over Story).
  *   C. Neither; the mismatch proves the concept is flawed.

  **Q8. The Category Error**
  Some argue that "Anthropocene" is a philosophical or political concept wearing a lab coat to look like science. What is your reaction?
  *   A. It is a scientific hypothesis that must meet strict stratigraphic criteria or be discarded.
  *   B. It is a cultural concept that is *useful* even if it fails stratigraphic criteria.
  *   C. It is a category error; we should not be trying to formalize it geologically at all.

  **Q9. The Plurality Check**
  Is it acceptable to have different start dates for different fields (e.g., 1800 for historians, 1950 for geologists)?
  *   A. No. A unified Earth System requires a unified chronological framework.
  *   B. Yes. Different questions require different temporal resolutions.
  *   C. Only if one is designated as the "formal" standard and the others are "informal."

  ***

  ## Part 3: Scoring Key & Map of the Space

  To score, tally the responses. Do not count points; look for **patterns**. The following profiles emerge from specific combinations.

  ### 1. The Formalist (The Golden Spike)
  *   **Signature:** Q1(A), Q5(A), Q7(B).
  *   **Logic:** The boundary must be a physical, synchronous marker in the rock record. Formal ratification is the goal.
  *   **Likely Date:** 1950s (Radionuclides/Plastics).
  *   **Awkward Commitment:** Must accept that the "cause" of the epoch might be secondary to the clarity of the "marker." The human story is subordinate to the sediment.

  ### 2. The Early Anthropogenist (The Deep Root)
  *   **Signature:** Q1(B), Q4(A), Q6(A).
  *   **Logic:** The causal story matters more than signal clarity. If humans started changing the earth early, the epoch started early.
  *   **Likely Date:** Agriculture or Industrial Revolution (1800).
  *   **Awkward Commitment:** Must defend a "global" boundary that is physically diachronous (started at different times in different places).

  ### 3. The Orbis Advocate (The Colonial Spike)
  *   **Signature:** Q1(A), Q2(A), Q4(A or B).
  *   **Logic:** A global signal exists earlier than the Industrial era (1610), and it counts even if unintentional.
  *   **Likely Date:** 1610 (Orbis Spike).
  *   **Awkward Commitment:** Must argue that a demographic catastrophe (depopulation) counts as a new geological epoch, even if the survivors didn't intend it.

  ### 4. The System Critic (The Capitalocene/Plantationocene)
  *   **Signature:** Q4(B), Q5(C or B), Q7(A).
  *   **Logic:** The driver is not "Humanity" but a specific system. The date matters less than naming the cause.
  *   **Likely Date:** Variable (often 1500s or 1750s), but the *Name* is the priority.
  *   **Awkward Commitment:** Often struggles with Q1 (Materiality). If the system changes but the rock doesn't show a clear spike, is it still an epoch? They often pivot to "Heuristic" (Q5-B).

  ### 5. The Pluralist (Polytemporal)
  *   **Signature:** Q6(C), Q9(B), Q3(B or C).
  *   **Logic:** One date cannot serve all purposes. Geology, history, and politics need different clocks.
  *   **Likely Date:** "It depends."
  *   **Awkward Commitment:** Risks fragmenting the concept so thoroughly it loses political or scientific utility.

  ### 6. The Rejectionist (The Category Error)
  *   **Signature:** Q8(C), Q1(C), Q5(B or C).
  *   **Logic:** The attempt to formalize this as a geological epoch is a mistake. It is a philosophical/political concept.
  *   **Likely Date:** None.
  *   **Awkward Commitment:** Must explain why they are at an Anthropocene workshop if they reject the central framing. (Answer: To critique it).

  ---

  ### Diagnosis of Empty Cells
  *These are answer combinations the instrument allows logically, but which represent incoherent or unwanted positions.*

  **Cell A: The Moral Stratigrapher (Incoherent)**
  *   **Combination:** Q1(A) [Needs Rock Marker] + Q5(C) [Purpose is Blame] + Q2(B) [Rejects Unintentional Signal].
  *   **Diagnosis:** **Incoherent.** Stratigraphy (Q1-A) is descriptive, not normative. You cannot demand a permanent rock marker *and* demand that the marker track moral responsibility (Q5-C). Rock does not record intent.
  *   **Workshop Use:** If someone lands here, ask them: "If the rock record contradicts the moral narrative, which one do you throw out?"

  **Cell B: The Informal Universalist (Unwanted)**
  *   **Combination:** Q8(C) [Category Error/No Formal] + Q9(A) [Needs Unified Date] + Q5(B) [Heuristic].
  *   **Diagnosis:** **Unwanted.** If you believe formalizing is a category error (Q8-C), insisting on a single unified date for all disciplines (Q9-A) recreates the problem you object to. Why demand unity if the concept is informal?
  *   **Workshop Use:** Highlight this tension. "You want the utility of a shared date without the constraints of formal science. Is that stable?"

  **Cell C: The Temporary Geologist (Unexplored)**
  *   **Combination:** Q1(A) [Rock Marker] + Q3(B) [Epoch Ends if Reversed].
  *   **Diagnosis:** **Unexplored/Geologically Novel.** Standard stratigraphy holds that boundaries are permanent. Suggesting an epoch can be "erased" from the time scale because conditions improved is a radical rethinking of geological time.
  *   **Workshop Use:** This is a fruitful tension for Day 2. "Can we have a reversible epoch?"

  ---

  ### Instrument Limitations & Flags

  **1. The Industrial vs. Great Acceleration Blur**
  *   **Issue:** Both **The Early Anthropogenist** and **The Formalist** may answer Q7 (Signal vs Story) differently, but both might agree on Q4 (Driver). However, within the "Causal/Process" group, those who prefer 1800 (Industrial) and 1950 (Great Acceleration) will look identical on this key.
  *   **Reason:** Both view the start as a *process onset* rather than a *spike*.
  *   **Fix:** In the workshop debrief, ask this specific follow-up to the "Process" group: "Is the boundary defined by the *ignition* of the engine (1800) or the *exhaust* filling the atmosphere (1950)?"

  **2. The System Critic Collapse**
  *   **Issue:** **The System Critic** (Capitalocene) often collapses into **The Pluralist** or **The Rejectionist** regarding the *date*.
  *   **Reason:** If the cause is "Capitalism," the date depends on when you think Capitalism started (1500? 1750? 1970?). This often leads them to Q9(B) (Pluralist) or Q8(C) (Rejectionist).
  *   **Fix:** Treat "System Critic" as a *motivation* leaf rather than a *date* leaf. They are united by Q4(B), regardless of where they land on Q9.

  **3. The Orbis Ambiguity**
  *   **Issue:** Participants selecting the 1610 option in Q2 may do so for Stratigraphic reasons (it's the best global spike) or Political reasons (it highlights colonialism).
  *   **Reason:** The instrument sorts by *criteria* (Global Signal), not *motivation*.
  *   **Fix:** In the sorting phase, group them together, but ask them to self-identify their *reason* during the introduction. "I'm here for the CO2 dip" vs "I'm here for the colonial implication."
