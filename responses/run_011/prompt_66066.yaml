answer: |-
  You are describing a structural pathology in normative theorizing that is widely felt but rarely formalized. It is not merely *ad hoc* reasoning in the crude sense, nor is it simply the vagueness inherent in moral concepts. It is a specific mode of theoretical immunity where the *extension* of a core term is adjusted to preserve the *intension* of the theory's verdict, without acknowledging that the adjustment has occurred.

  Here is the carving you requested, addressing your five questions in order.

  ### 1. Does this configuration have an established name?

  No. There is no single established term in the methodology of science, informal logic, or political philosophy that captures this specific configuration.

  In the philosophy of science, the closest analogue is the **ad hoc hypothesis** within a Lakatosian "protective belt." However, that model typically involves adding a new auxiliary clause to save a core theory (e.g., positing a new planet to save orbital mechanics), whereas your pattern involves shifting the semantic boundary of an *existing* core distinction (Choice/Circumstance) without adding new clauses.

  In informal logic, **"moving the goalposts"** is the colloquial equivalent, but it implies a dialectical foul during debate, not a structural feature of a published theory developed in good faith.

  In legal theory, **"conceptual gerrymandering"** is sometimes used to describe defining a category to capture a desired outcome. However, this term carries a connotation of strategic manipulation or bad faith. Your observation is precisely that this occurs *without* bad faith; the theorist genuinely perceives the reclassification as a clarification.

  Therefore, while the *components* of the phenomenon are named, the specific structural pattern of a binary normative distinction whose boundary migrates unidirectionally to absorb counterexamples remains unnamed.

  ### 2. Nearest established concepts and why they fall short

  **A. The Ad Hoc Hypothesis (Lakatos/Popper)**
  *   *Concept:* An amendment to a theory introduced solely to save it from falsification, lacking independent testability.
  *   *Why it fails:* An ad hoc hypothesis usually *adds* a variable or a clause (e.g., "unless condition X obtains"). Your pattern does not add clauses; it reinterprets the *scope* of the existing variables. Furthermore, in science, an ad hoc move is recognized as a degenerative shift. In your pattern, the move is presented as a progressive refinement of the concept, not a rescue operation.

  **B. Concept Stretching (Sartori)**
  *   *Concept:* Extending a concept to cover more cases, thereby losing precision (the "traveling problem" in comparative politics).
  *   *Why it fails:* Concept stretching is about *coverage* across different contexts (e.g., applying "democracy" to too many regime types). Your pattern is about *immunity* within a single context. The concept does not stretch to cover more of the world; it shifts to ensure the world fits the theory. The extension changes, but the intension (the normative work done) remains constant, which Sartori's model does not account for.

  **C. Vagueness / The Sorites Paradox**
  *   *Concept:* The inherent lack of a sharp boundary in predicates (e.g., "bald," "rich").
  *   *Why it fails:* Vagueness is a static property of a term. The problem you identify is *dynamic*. It is not that the line between choice and circumstance is fuzzy; it is that the resolution of the fuzziness is consistently determined by the desired normative outcome. Vagueness explains the *possibility* of the shift, but not the *directionality* of it.

  **D. Reflective Equilibrium (Rawls)**
  *   *Concept:* The mutual adjustment of principles and considered judgments.
  *   *Why it fails:* This is the most significant near neighbour, and I will address it in detail in question four. Briefly: Reflective Equilibrium allows the principle to *override* the judgment. Your pattern never allows the principle (as antecedently understood) to override the judgment; it alters the principle to ensure the judgment prevails.

  ### 3. A coined term and definition

  I propose the term: **Verdict-Dependent Boundary Migration (VDBM)**.

  **Definition:**
  VDBM occurs within a normative theory when the extension of a core binary distinction (e.g., Choice/Circumstance) is not fixed by antecedent criteria, but is retrospectively adjusted in response to counterexamples, such that the adjustment is determined solely by the requirement to preserve the theory's pre-existing normative verdicts.

  **Exclusion Criteria (How it differs from neighbours):**
  1.  **Excludes Reflective Equilibrium:** In RE, the adjustment is bidirectional (principles can reject judgments). In VDBM, the adjustment is unidirectional (boundaries move to save judgments).
  2.  **Excludes Conceptual Clarification:** In genuine clarification, the boundary is fixed by a deeper theoretical commitment that may *cost* the theory some intuitive cases. In VDBM, the theory loses no intuitive cases because the boundary moves to capture them.
  3.  **Excludes Bad Faith:** VDBM describes a structural feature of the theory's application, not the psychological state of the theorist. It can occur in a state of perfect sincerity.

  ### 4. Distinguishing from Reflective Equilibrium (The Boundary Case)

  This is the critical discrimination. The pattern you describe mimics the "mutual adjustment" of coherentism, but it lacks the **asymmetry of cost**.

  **The Discriminating Feature:**
  In standard Reflective Equilibrium, there is a risk of *theoretical cost*. If a considered judgment is too costly to accommodate (i.e., it requires distorting the principle beyond recognition), the method dictates that the judgment must be rejected as a prejudice or error. The principle has independent weight.

  In VDBM, the principle has *no independent weight* apart from its verdicts. The boundary term (e.g., "agency") is not a constraint on the verdict; it is a label applied to the verdict after the fact.

  **The Prospective Test:**
  A third party can apply this test prospectively to distinguish VDBM from Reflective Equilibrium:

  *   **The Prediction Test:** Ask the theorist to specify the boundary criteria *before* the case is adjudicated.
      *   *Reflective Equilibrium:* The theorist can state, "If X, Y, and Z obtain, this counts as Choice, even if the outcome seems harsh." They accept the risk of a counter-intuitive verdict.
      *   *VDBM:* The theorist cannot specify the criteria without referencing the desirability of the outcome. If pressed, they will say, "Well, it depends on whether it seems fair to compensate."
  *   **The Falsification Condition:** Ask, "What case would count as a counterexample to your distinction?"
      *   *Reflective Equilibrium:* There must be a conceivable case where the principle dictates Compensation but the Intuition says No (or vice versa), which would force a revision.
      *   *VDBM:* There is no conceivable case. Every case is reclassified to match the intuition. If a theory cannot be falsified by a case because the classification of the case is fluid, it is VDBM.

  **Verdict on the Boundary:**
  If the theory reports "perfect agreement with intuition at every point" (as you note), it is not in Reflective Equilibrium. It is in a state of **tautological alignment**. Reflective Equilibrium requires friction; VDBM eliminates friction by lubricating the boundary.

  ### 5. The Defect: Theory or Distinction?

  The defect lies in the **foundational ambition of the distinction**.

  The pattern shows that the distinction (Choice/Circumstance, Resource/Welfare, etc.) cannot carry the normative weight placed upon it because it is not a *pre-normative* metaphysical fact, but a *normative* conclusion in disguise.

  **The Diagnosis:**
  Theories exhibiting VDBM treat the binary distinction as a **sorting mechanism** that is logically prior to the normative verdict. They assume we can first determine "Was this chosen?" and then determine "Is compensation owed?"

  Your observation proves that the determination of "Was this chosen?" is itself dependent on the answer to "Is compensation owed?"

  *   If we feel compensation is owed, we find the condition was not chosen (it was circumstance).
  *   If we feel compensation is not owed, we find the condition was chosen (it was risk-taking).

  Therefore, the distinction is not doing the normative work; it is merely ratifying it. The defect is the claim that the distinction provides an **independent ground** for justice.

  **Could a non-arbitrary boundary be specified?**
  Only if the theory abandons the claim that the distinction is metaphysical or pre-moral. To stop VDBM, one must admit that "Choice" is a normative construct. For example, one must say, "We *treat* this as a choice not because it was metaphysically free, but because holding people responsible here promotes dignity (or efficiency, or equality)."

  Once you admit that the boundary is set by *other* normative values (dignity, social utility, solidarity), the VDBM stops, because the boundary is now fixed by those external values, not by the need to save the "Choice" verdict.

  **Conclusion:**
  The pattern you have isolated is **Verdict-Dependent Boundary Migration**. It is distinct from Reflective Equilibrium because it lacks the capacity for the principle to override the intuition. It indicates that the binary distinctions underpinning these theories are not foundational grounds for justice, but rather placeholder variables for unstated normative commitments. The theory appears to say something because the boundary moves; it actually says nothing because the boundary is determined by what we already believe.
