answer: |-
  # Q&A Prep Sheet: Neuroethics Seminar
  **Topic:** Re-evaluating Dennett's "Where Am I?"
  **Thesis:** The "I go with the brain" intuition tracks social identification (face, voice, story), not metaphysical persistence. Dennett's report is verbal inference, not indexical experience.

  ---

  ### 1. The Killer Objection (Takes the argument down)
  **Who:** The Pediatric Neurologist (Hemispherectomy specialist)
  **The Question:** "You argue that the intuition tracks social capacities like story and voice. But in my clinic, when we remove or damage specific brain tissue, those capacities change or vanish. If the brain generates the voice, the face's expression, and the memory of the story, then moving the brain moves the *source* of the person, not just the signal. If the brain is the engine of the social cues you rely on, how can you separate the engine from the car and claim the car is still the driver?"

  **The Reply (2 mins):**
  "That is the crucial causal link. My claim isn't that the brain doesn't *generate* the cues—it absolutely does. My claim is about what we *track* when we ask 'Where is the person?' In your caseload, you track cognitive continuity. But in Dennett's scenario, the cognitive continuity is preserved via radio link. The intuition that 'I am in the vat' arises because we lose the *social feedback loop*. We don't see the face move in real-time; we don't hear the voice resonate in the room.
  I am arguing that the *feeling* of location is a lagging indicator of social access. If I can restore the social cues—my closing variant, where the vat brain drives the original face—I predict the intuition flips. The audience will feel the person is in the body, because the social feedback loop is restored, even though the 'engine' is still in the vat. You are right that the brain generates the self, but the *location* of the self is a social attribution, not a biological coordinate."

  **Concede Pre-emptively:** Acknowledge that clinically, brain function *is* the operational definition of personhood. You are not arguing for medical policy, but for the source of a philosophical intuition.
  **Soft Spot:** The distinction between "generating the self" and "locating the self." If the brain generates it, most will argue it *is* it. This is your weakest metaphysical ground.

  ---

  ### 2. High Damage Objection
  **Who:** The Intensivist (Brain Death determinations)
  **The Question:** "In my unit, if the brain is gone, the body is a corpse. Legally and biologically, it is dead. You are asking us to imagine a radio-driven corpse. If the body is dead, it has no social identity to track. It's a puppet. How can 'face and gait' constitute a person if the organism supporting them is clinically dead?"

  **The Reply (2 mins):**
  "You are right that in clinical practice, brain death is human death. But this is a thought experiment about *persistence conditions*, not viability. We are asking: if we could sustain the somatic functions artificially, where does the 'who' reside?
  My point is that our intuition that the 'who' is in the vat relies on the body looking like a corpse. If we suspend the death criterion for the sake of the puzzle, we see that our hesitation to say the person is in the body comes from the body's lack of social responsiveness. If that body looked, spoke, and moved indistinguishably from the original—as in my variant—the 'corpse' intuition would vanish, even if the brain-death criterion remained technically met. I am using the scenario to probe the weight of social cues against biological status."

  **Concede Pre-emptively:** Agree that in any real-world medical context, the brain is the locus of life. This is a conceptual probe, not a clinical protocol.
  **Soft Spot:** Relying on a scenario that violates the fundamental definition of death used by everyone in the room. It risks making the argument seem detached from medical reality.

  ---

  ### 3. Medium-High Damage Objection
  **Who:** The Facial Transplant Surgeon
  **The Question:** "I treat patients who receive new faces. They do not say, 'I am wherever my social cues are.' They say, 'I do not recognize myself.' They feel a loss of self, a dysmorphia, because the face is not just a signal to others; it is the interface of their own proprioception. If the brain is in the vat, it has no proprioceptive feedback from the face. Doesn't that lack of internal feedback confirm the brain is the seat of the self, regardless of what the outside world sees?"

  **The Reply (2 mins):**
  "Exactly. And that supports my distinction. Your patients feel a loss of self because the *integration* of social signal and internal feedback is broken. In Dennett's scenario, the brain in the vat has *no* body feedback. It is pure cognition.
  I argue that the intuition 'I am in the vat' is the brain's report of that isolation. But if we give the brain the *original face* back (my variant), we restore the proprioceptive match. If the intuition flips, it proves that 'self-location' is dependent on that sensorimotor loop, not just the presence of gray matter. The distress your patients feel is evidence that identity is distributed across the brain-body interface, not housed solely in the cranium."

  **Concede Pre-emptively:** Acknowledge that embodiment is crucial. You are not arguing for a disembodied mind, but that the "location" intuition is fragile and cue-dependent.
  **Soft Spot:** The surgeon's data suggests the *brain's experience* of the face matters more than the *public's view* of the face. This undermines the "social cues" thesis.

  ---

  ### 4. Medium Damage Objection
  **Who:** The Animalist Philosopher
  **The Question:** "You are treating the person as a psychological construct. But I am a human organism. If you remove my brain, you have killed me. The thing in the vat is a part, not a whole. The thing in the bed is a corpse. Neither is me. Why should I accept your distinction between 'social identity' and 'persistence' when my persistence is biological?"

  **The Reply (2 mins):**
  "I respect the animalist view. But Dennett's scenario is designed to pump the intuition that the *person* survives in the vat. My thesis explains *why* that pump works: it tricks us by isolating the psychological capacities we use to identify people.
  I am not arguing Animalism is false; I am arguing that Dennett's intuition pump doesn't prove Psychological Continuity true. It only proves that we locate people where their social capacities are active. If you, as an animalist, feel the pull of the intuition, my argument explains that pull as a cognitive bias toward social cues, not a metaphysical insight. We can agree the animal is dead while explaining why the audience thinks the person lives."

  **Concede Pre-emptively:** Grant that Animalism is a coherent metaphysical position. Your target is the *interpretation of the intuition*, not the refutation of Animalism.
  **Soft Spot:** If the audience is mostly Animalists, they won't have the intuition you are explaining. You are solving a problem they don't have.

  ---

  ### 5. Low Damage Objection
  **Who:** The Dennett Expert
  **The Question:** "Dennett anticipates this. He argues for the 'Center of Narrative Gravity.' It's not about the brain tissue or the social cues; it's about where the narrative is anchored. In the scenario, the narrative is anchored in the vat because that's where the decision-making happens. You are attacking a straw man of Locke, not Dennett's actual functionalist position."

  **The Reply (2 mins):**
  "Dennett calls it a Center of Narrative Gravity, but he locates it in the vat because that's where the *report* comes from. My argument is that the report is a post-hoc inference based on the loss of social agency in the body.
  If the narrative gravity were truly functional, the radio link should sustain it equally in both locations. The fact that we feel a *location shift* suggests it's not just about narrative continuity, but about the *embodied social presence*. I am refining Dennett, not straw-manning him. I am suggesting the 'Gravity' is weighted by proprioceptive and social feedback, not just cognitive output."

  **Concede Pre-emptively:** Acknowledge Dennett's sophistication. Frame your point as a phenomenological addendum to his functionalism.
  **Soft Spot:** Risk of getting bogged down in exegetical details about Dennett's corpus rather than your core thesis.

  ---

  ### The Question You Hope Nobody Asks
  **The "Flinch" Test:**
  "If your intuition is correct—that the feeling of being in the vat is just verbal inference—then where do I flinch if I threaten the body with a hammer? If I say 'I flinch in the vat,' I admit my self-preservation instinct is tied to the brain. If I say 'I flinch in the body,' I admit my self is located there. Which is it? And if it's the brain, doesn't that prove persistence tracks the brain, not the face?"

  **Why this is dangerous:** It forces you to choose between a phenomenological claim (where I *feel*) and a biological claim (where I *survive*). If you admit the fear is in the vat, you concede the brain is the seat of the self, undermining your "social cues" argument.
  **Preparation:** Do not answer directly. Pivot to the distinction between *fear of damage* (biological) and *location of self* (social). "Fear tracks survival mechanisms, which are in the brain. Location tracks social interaction, which is in the body. They come apart in this scenario." (Risky, but necessary).
