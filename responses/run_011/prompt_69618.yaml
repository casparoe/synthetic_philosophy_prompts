answer: |-
  This is a precise dissection of the ontological commitments embedded in your field's methodology. You are asking for the philosophical architecture that supports the wall between "colony cognition" (accepted) and "colony experience" (rejected), while noting the ethical vacuum surrounding both.

  Here is the reconstruction of the implicit theory, the alternatives that license it, the tensions within it, and the consequences of shifting the ground.

  ### 1. The Implicit Theory: "Functional Agnosticism"

  The four pieces of practice you describe are generated by a specific, unstated theoretical framework. If we were to make its axioms explicit, they would read as follows:

  1.  **Cognitive Ascription is Behavioral, not Ontological:** To say a colony "decides" or "has a temperament" is to describe input-output stability and goal-directedness at the aggregate level. It does not commit the researcher to the existence of a singular subject *having* those thoughts.
  2.  **Phenomenal Supervenience:** Subjective experience (sentience, *qualia*) supervenes strictly on specific neurobiological architectures (centralized nervous systems). Since a colony lacks a unified nervous system, it cannot be a subject of experience, regardless of its functional complexity.
  3.  **Ethical Patienthood requires Phenomenality:** Moral standing is granted only to entities capable of suffering or subjective experience. Since neither the individual insect (in the regulator's view) nor the colony (by axiom 2) meets the threshold for phenomenality, neither requires ethical review.
  4.  **Methodological Pluralism:** The "unit of analysis" is a pragmatic choice, not a metaphysical truth. One may switch between the individual and the colony as the experimental unit depending on which yields statistical power or regulatory compliance, without resolving whether the colony is "real."

  ### 2. Required vs. Compatible (Underdetermination)

  The practice *requires* certain commitments but remains agnostic on others.

  **What the Practice Strictly Requires:**
  *   **The Decoupling of Cognition and Consciousness:** It requires that information processing and decision-making can occur without a "light being on" inside the system. (This licenses Piece 1 alongside Piece 2).
  *   **The Priority of Utility over Truth:** It requires that scientific language be judged by predictive success, not ontological accuracy. (This licenses the switch in experimental units in Piece 3).
  *   **The Exclusion of Insects from the Moral Circle:** It requires that insects (individuals) be classified as non-sentient for regulatory purposes. (This licenses Piece 4).

  **What the Practice is Merely Compatible With (Underdetermined):**
  *   **Superorganism Realism:** The practice is compatible with the view that the colony *is* a real biological individual, provided one accepts it is a "philosophical zombie" (functions like a mind, feels nothing).
  *   **Instrumentalism:** The practice is equally compatible with the view that the colony is a fiction, and "colony choice" is merely shorthand for complex feedback loops between individuals.
  *   **Individual Sentience:** The practice is compatible with the private belief of researchers that individual bees *do* feel pain, provided the regulatory framework does not force them to acknowledge it. (Piece 4 is a regulatory constraint, not necessarily a biological finding).

  ### 3. Two Distinct Theories Licensing the Practice

  You asked for two theories that would generate these four pieces of practice. One treats the colony's choosing as literal, the other as metaphorical.

  **Theory A: The Unconscious Superorganism (Literalist)**
  *   **Core Claim:** The colony is a genuine biological individual (a superorganism) with a boundary, homeostasis, and agency distinct from its constituents.
  *   **Mentality:** It possesses a "cold" cognition. It integrates information, stores memory (in comb structure and demography), and optimizes outcomes.
  *   **Experience:** It lacks the hardware for phenomenology. It is a cognitive agent without a subjective interior.
  *   **License for Practice:** This justifies Piece 1 (real findings about real agents) and Piece 2 (denial of experience is biologically grounded). It justifies Piece 3 (the hive is the unit because it is the organism) and Piece 4 (no nervous system = no suffering).

  **Theory B: Methodological Individualism (Instrumentalist)**
  *   **Core Claim:** Only individual insects exist. The "colony" is a statistical artifact or a convenient level of abstraction for describing emergent properties.
  *   **Mentality:** "Colony decision-making" is a *façon de parler*. It describes the equilibrium state of distributed individual actions.
  *   **Experience:** Individuals may or may not have experience, but the colony definitely does not because it is not a "thing."
  *   **License for Practice:** This justifies Piece 1 (useful shorthand that predicts outcomes) and Piece 2 (you cannot empirically test the experience of a fiction). It justifies Piece 3 (switching units is just switching lenses) and Piece 4 (if individuals aren't protected, abstractions certainly aren't).

  ### 4. Foreclosed Rival Views

  The current practice quietly renders the following views untenable within the professional context:

  *   **Panpsychist Superorganismism:** The view that high-level functional integration *entails* some form of experience. If you argued that the colony's decision-making (Piece 1) implies it *feels* the decision (contradicting Piece 2), your grant would be rejected.
  *   **Radical Individualist Eliminationism:** The view that colony-level language is scientifically harmful and should be purged in favor of strict individual-mechanism descriptions. This is foreclosed by Piece 1; journals would reject papers that refused to use colony-level cognitive vocabulary.
  *   **Insect Sentience Absolutism:** The view that individual insects possess robust moral standing comparable to vertebrates. This is foreclosed by Piece 4. To assert this would require halting standard field protocols.

  ### 5. Consistency Check: The Panel's Tension

  Is there a principled line between ascribing cognition and withholding experience?

  **The Principled Defense:**
  Yes, if one holds a **Functionalist theory of Cognition** combined with a **Biological Substrate theory of Consciousness**. On this view, "decision-making" is defined by successful goal-directed information processing (which a colony clearly does), while "experience" is defined by specific neurophysiological states (which a colony clearly lacks). The panel's treatment is consistent *if* one accepts that cognition does not require consciousness. This is a standard position in cognitive science (e.g., unconscious processing in humans).

  **The Tension:**
  However, there is a deep tension in **Piece 4**. If the colony is denied experience because it lacks a nervous system, why is the *individual bee* also denied ethical standing? Individual bees *do* have nervous systems.
  *   **The Inconsistency:** The practice creates a "double exclusion." It denies the colony experience based on architecture (no brain), but denies the individual ethics based on taxonomy (insect), not architecture.
  *   **The Verdict:** The panel's rejection of the superorganism experience proposal (Piece 2) is consistent with Piece 1 *only* if cognition is stripped of phenomenology. But the whole system sits uneasily with Piece 4. If the individual bee has the hardware for experience, the ethical exemption is biologically arbitrary. If the individual bee does *not* have the hardware, then the colony's lack of it is redundant. The practice assumes the individual is non-sentient without testing it, while rigorously testing the colony's non-sentience.

  **Status of this Dispute:**
  *   **Settled:** Among entomologists, it is settled practice to use colony-level cognitive language (Piece 1) and to treat insects as non-sentient for ethics (Piece 4).
  *   **Contested:** In philosophy of biology and cognitive science, whether "cognition" requires a subject is heavily contested. Whether superorganisms can be subjects is a minority view (e.g., Wilson, Hölldobler hinted at it; philosophers like Deborah Gordon analyze the mechanics without committing to the mind).
  *   **Minority Position:** The view that the colony *could* be a subject of experience is a distinct minority position. The view that individual insects *are* sentient is gaining traction in ethology but remains excluded from regulation.

  ### 6. Concrete Changes: If Mentality = Functional Organisation

  If you replaced the current presupposition with the view that **mentality sits wherever functional organisation supports integration, memory, and goal-directedness** (regardless of substrate), the following concrete changes would be required:

  1.  **Ethics Review Scope:**
      *   **Change:** Research Ethics Committees (IACUC or equivalent) would need to expand scope to include "Colony-Level Harm."
      *   **Consequence:** Culling a hive (common in disease management or overwintering protocols) would require justification equivalent to euthanizing a vertebrate subject. "Colony stress" would become a reportable adverse event.

  2.  **Experimental Units (Piece 3):**
      *   **Change:** The "hive" would become the mandatory experimental unit for *all* cognitive and behavioral endpoints, not just strength.
      *   **Consequence:** You could no longer count dead bees at the entrance as independent data points ($N=500$ bees). You would have to treat them as subsamples of the colony ($N=10$ hives). This drastically reduces statistical power and increases the cost of trials.

  3.  **Endpoints and Metrics:**
      *   **Change:** Protocols would need to measure "Colony Integrity" alongside mortality.
      *   **Consequence:** A pesticide that leaves bees alive but disrupts pheromonal communication (disintegrating the functional mind) would be classified as causing "cognitive injury" or "psychological harm" to the superorganism, potentially failing regulation even if mortality is low.

  4.  **Handling and Management:**
      *   **Change:** Disruption of the colony structure (e.g., splitting hives, requeening, moving apiaries) would be treated as invasive surgery on a cognitive agent.
      *   **Consequence:** Standard beekeeping practices used in research would require anesthesia or sedation protocols for the *collective* (e.g., ensuring continuity of pheromonal fields during transfer) to minimize "psychological" trauma.

  ### 7. Summary of Consensus and Contestation

  To ensure I am not misrepresenting the field's epistemic status:

  *   **Settled Practice:** Entomology operates *as if* the colony is a cognitive agent (Piece 1) and *as if* neither bee nor colony has moral standing (Piece 4). This is the operational consensus.
  *   **Genuinely Contested:** Whether the colony's "decision" is a literal mental event or a metaphor for emergent dynamics is **not settled**. It is a live dispute in philosophy of biology (e.g., the "Superorganism" debate).
  *   **Minority Reading:** The interpretation that the panel's rejection of colony experience (Piece 2) is *in tension* with the acceptance of colony cognition (Piece 1) is a philosophical critique, not a scientific consensus. Most working entomologists do not perceive this as a contradiction; they view "decision" as a functional label and "experience" as a biological property.
  *   **The "Aunt Hillary" Gap:** Your observation that the profession answers the question "What is a colony mind?" daily without noticing it is accurate. The field has converged on a **pragmatic definition** (a colony is a mind if it solves problems) while avoiding the **ontological definition** (a colony is a mind if it feels).

  The structure of the commitment is therefore **Instrumental Realism**: The colony is real enough to think, but not real enough to feel, and the individual is real enough to work, but not real enough to suffer. This allows the science to proceed without the ethical burden that would accompany acknowledging either form of mentality fully.
