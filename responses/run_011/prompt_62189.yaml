answer: |-
  ### Brainstorming Pass: Questions and Divergences

  You are not asking a single question, but rather navigating a cluster of inquiries that often get conflated. I identify three distinct questions in your reasoning, which come apart at the point of *purpose*:

  1.  **The Medical Question:** Is this intervention restoring health? (Baseline: Individual pathology vs. individual health).
  2.  **The Competitive Question:** Is this intervention creating unfair advantage? (Baseline: Competitor vs. competitor).
  3.  **The Ontological Question:** Is this trait "natural" or "artificial"? (Baseline: Biology vs. Technology).

  **Points of Divergence:**
  *   **Intent vs. Outcome:** Therapy is defined by intent (restoration), but enhancement is often defined by outcome (exceeding norms). Pistorius forces these to collide.
  *   **Static vs. Dynamic Baselines:** Medicine usually looks backward (what was lost?), while sport looks sideways (what do others have?).
  *   **Fact vs. Norm:** You treat the baseline choice as a biological fact, but it is actually a normative decision about which context (clinic vs. track) governs the judgment.

  Your diagnosis—that the label flips with the baseline—is correct. Your worry—that this means the distinction is broken—is where I will test you. It may not be broken, but rather context-dependent.

  ### 1 & 2. Mapping the Case and Candidate Accounts

  The following table maps your four baselines against leading philosophical accounts. I have flagged empirical uncertainties where the biomechanics are contested or complex.

  | **Baseline Adopted** | **Verdict (Therapy/Enhancement/Other)** | **Candidate Account** | **Verdict & Determinacy** |
  | :--- | :--- | :--- | :--- |
  | **1. Personal Unaided Capacity** (Pre-amputation or without blades) | **Therapy** | **Treatment vs. Improvement** | **Therapy.** Determinate. Restores function lost to pathology. |
  | **2. Species-Typical Functioning** (Healthy adult male) | **Enhancement** | **Disease / Normal Function** | **Enhancement.** Determinate *if* blades exceed species-typical energy return. [Empirical Uncertainty: Do blades exceed biological ankle efficiency?] |
  | **3. Elite Sprinting Distribution** (Competitors) | **Equipment / Neutral** | **Positional Goods / Fairness** | **Indeterminate.** Depends on whether "fairness" means equal opportunity or equal equipment. |
  | **4. Rulebook Permission** (Legal Status) | **Regulatory Category** | **Institutional Convention** | **Outside Distinction.** Becomes a legal compliance issue, not medical. |

  **Analysis of Table:**
  *   **Disease/Normal Functioning:** Yields "Enhancement" only if we assume species-typical legs are the ceiling. This account struggles because it ignores the *loss* that necessitated the prosthetic. It requires the extra premise that "normal" means "statistically average healthy," not "restored to functional equivalence."
  *   **Treatment vs. Improvement:** Yields "Therapy" determinately based on history. However, it fails to address the *competitive* consequence of that therapy.
  *   **Natural Lottery:** Yields "Enhancement" because carbon fibre is not biologically given. But this verdict is too broad; it would ban running shoes. It requires the premise that *some* artificial aids are permissible extensions of the body.
  *   **Positional Goods:** Yields "Unfair Advantage" only if the advantage is deemed unearned. This account cannot decide the case without an empirical fact about net advantage, which the tribunals struggled to establish.

  ### 3. Evaluating Your Candidate Failures

  You propose three ways the distinction fails. Here is my evaluation:

  **(a) The Aggregation Problem (Scalar vs. Multi-dimensional)**
  You argue that "overall advantage" presumes function is a single scalar, whereas the blades might improve one metric (energy return) while worsening another (acceleration from blocks).
  *   **Evaluation:** This is a strong conceptual critique. Biomechanically, trade-offs are almost certain. [Empirical Uncertainty: The exact trade-off profile between straight-line efficiency and curve-running stability is complex and likely varies by athlete.]
  *   **Verdict:** The distinction does not fail here; rather, the *measurement* of enhancement fails. If therapy is restoring a profile and enhancement is skewing it, we need a weighted metric of "running." The distinction survives if we admit that "advantage" is a composite value judgment, not a raw physical fact. The distinction doesn't collapse; it just becomes harder to calculate.

  **(b) The Person-Relativity Problem (History vs. State)**
  You note that an able-bodied athlete amputating to use blades is enhancement, while Pistorius is therapy, despite identical physiology.
  *   **Evaluation:** This is the strongest point against a purely state-based definition. It confirms that "therapy" is inherently historical/narrative, not structural.
  *   **Verdict:** This is not a failure of the distinction, but a clarification of its logic. Therapy is defined by *repairing a break in continuity*. Enhancement is defined by *creating a new trajectory*. If the distinction is about medical ethics, history matters. If it is about competitive fairness, history might not matter (only current state). The distinction splits here: medically, Pistorius is therapy; competitively, he might be enhancement. You are treating them as one distinction when they may be two.

  **(c) The Ratchet Effect (Normalization over Time)**
  You argue that if blades become standard for para-sprinters, the "enhancement" label expires.
  *   **Evaluation:** This confuses *novelty* with *enhancement*. Something can be an enhancement even if everyone has it (e.g., vaccines enhance immunity relative to baseline, even if universal).
  *   **Verdict:** Reject this failure. The distinction does not decay with time. However, the *regulatory response* changes. When an enhancement becomes universal, it shifts from "unfair advantage" to "new baseline." The distinction remains valid, but the *prohibition* on enhancement becomes impossible to enforce without banning the sport itself.

  ### 4. Reverse Analysis: What the Case Does to the Theory

  Is Pistorius a counterexample? No. It is a **boundary case** that reveals the distinction is not monolithic.

  *   **Absorption by Relativisation:** The theory survives if we relativise the distinction to the **domain of practice**.
      *   In the **Clinical Domain**, the baseline is the patient's health. Verdict: Therapy.
      *   In the **Competitive Domain**, the baseline is the level playing field. Verdict: Potential Enhancement.
  *   **What Work Remains:** The distinction still tells us *who owes justification*. In medicine, the provider justifies deviation from health norms. In sport, the athlete justifies deviation from competitive norms.
  *   **What It Can No Longer Do:** It cannot provide a universal, context-free label for the technology itself. You cannot ask "Are blades enhancement?" You must ask "Are blades enhancement *relative to this specific goal*?"

  Your diagnosis that "nothing in the biology tells us which baseline to choose" is correct, but your inference that the distinction is therefore idle is too strong. Biology doesn't choose; **social practice chooses**. The distinction is not a discovery about the world, but a tool for regulating specific human activities.

  ### 5. The Procedural Point: Burden of Proof

  You ask if the distinction collapses into an allocation of the burden of proof, and whether this is a defeat.

  *   **Does it collapse?** In cases of empirical uncertainty (like the CAS ruling), **yes**. When science cannot definitively say "net advantage exists," the decision rests on who must prove what. The initial ban assumed advantage (burden on athlete to disprove). The CAS ruling shifted this (burden on federation to prove).
  *   **Is this a defeat?** No. This is the **honest form** of the distinction.
      *   The therapy/enhancement distinction is ultimately normative, not empirical. It is about what we owe each other.
      *   If we define therapy as "what we owe people to restore dignity/function" and enhancement as "what we forbid to preserve fairness," the burden of proof is the mechanism that enforces that norm.
      *   By making the burden of proof explicit, we admit that we cannot measure "human nature" perfectly. We instead decide where the risk of error lies. Do we risk excluding a disabled athlete (false positive for enhancement) or risk corrupting the sport (false negative)?

  **Conclusion on Your Diagnosis**
  You are right that the baseline choice flips the label. You are wrong to worry that this breaks the distinction. It simply proves the distinction is **teleological** (purpose-driven), not **ontological** (thing-driven).

  The Pistorius case does not show the distinction is useless; it shows that "therapy" and "enhancement" are not properties of the carbon fibre. They are properties of the **relationship between the athlete, the technology, and the institution**. When you treat them as properties of the technology, the distinction indeed collapses. When you treat them as regulatory tools for specific contexts (health vs. sport), the distinction holds, but it loses its metaphysical weight. It becomes less about "what is natural" and more about "what we agree to demand."

  Your engineering intuition serves you well here: you are looking for a specification sheet for a moral concept. There isn't one. The "specification" changes depending on whether you are building a leg or a race.
