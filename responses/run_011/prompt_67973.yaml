      *   **Alternative Care Perspectives (Broadening the Scope):**
          *   Noddings isn't the only care ethicist.
          *   **Eva Feder Kittay:** She writes specifically about dependency work and severe cognitive disability (her daughter Sesha). She argues against reciprocity as a condition for moral status or care obligation. She introduces "doulia" (society supports the caregiver).
          *   **Maurice Hamington:** Embodied care. It's not just mental recognition; it's physical attunement.
