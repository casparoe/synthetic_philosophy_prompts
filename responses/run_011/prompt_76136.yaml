answer: |-
  **Exam Question**

  A hospital runs a consented 'resilience programme' using conditioning and rewards. Nurse N completes it, genuinely wanting double shifts she previously refused. She remembers her pre-programme self, knows exactly how the desire was installed, and consents to the process. Under Williams's internal reasons thesis (an agent has a reason only if reachable by sound deliberation from their subjective motivational set S):
  1. Does N now have an internal reason to take the shifts?
  2. Does her knowledge of the desire's genealogy or her prior consent affect whether this reason exists?
  Justify your ruling by analyzing what work the 'sound deliberative route' clause does here. Does soundness import external standards? Does consent alter S? Explain the cost to internalism if genealogy is irrelevant.

  ***

  **Model Answer**

  On Williams's thesis, N now has an internal reason to take the shifts. The thesis grounds reasons in the agent's actual subjective motivational set (S). Post-programme, N's S includes a desire for double shifts. Since the action satisfies an element of S, and she can deliberate from this desire to the action, the formal conditions are met.

  Crucially, her knowledge of the desire's genealogy and her prior consent are irrelevant to the *existence* of the reason. Internalism is structural, not historical. It asks whether a sound deliberative route exists from the *current* S to the action. It does not audit how S was acquired. The 'sound deliberative route' clause tests logical and instrumental coherence (e.g., ensuring no false beliefs impede the route), not the authenticity or origin of the premises. If soundness imported evaluative standards about which desires are permissible (e.g., 'no manipulated desires'), it would collapse into externalism, invoking standards N need not endorse.

  Prior consent also fails to alter the analysis. Consent authorized the procedure, but philosophically, it leaves S untouched until the procedure completes. Once S changes, the reason exists relative to the new S. The memory of the old self highlights the discontinuity but does not negate the current motivational hook.

  The cost to internalism is significant. It implies that reason-giving force is insensitive to manipulation. If a desire is installed via conditioning, it reasons just as well as one formed via reflection. This makes the internalist account vulnerable to the charge that it cannot capture the normativity of reasons, only their motivational efficacy. It separates 'having a reason' from 'being rationally responsible for having that reason.' A robust theory of agency might require that reasons stem from processes the agent endorses, not just states they occupy. Williams might reply that 'reason' is strictly about explanation of action potential, not moral endorsement, but this concedes that internal reasons may lack the normative grip externalists demand. Thus, while N has a reason, the case reveals internalism's inability to distinguish between authentic and engineered motivation, weakening its claim to capture rational requirement.

  ***

  **Marking Scheme**

  | Must-Hit Move | Marks | Characteristic Error |
  | :--- | :--- | :--- |
  | 1. Affirms reason exists based on current S contents. | 5 | Denies reason exists because desire was manipulated (confuses origin with structure). |
  | 2. Rules genealogy/consent irrelevant to reason existence. | 5 | Claims consent validates the reason externally or genealogy negates it. |
  | 3. Explains 'sound deliberation' checks coherence, not desire-origin. | 5 | Argues soundness requires 'authentic' desires (collapsing into externalism). |
  | 4. Identifies cost: internalism cannot distinguish manipulation from reflection. | 5 | Fails to articulate the normative cost or claims there is none. |
  | 5. Clarifies consent authorizes change but does not alter S directly. | 5 | Treats consent as a current motivational element that bypasses S. |

  ***

  **C-Grade Caps**

  *   Answers that merely recite Williams's S-notation without applying it to the nurse's specific psychological state.
  *   Answers that define internalism as "Humeanism about motivation" without addressing the deliberative route clause.
  *   Answers that treat the idealization reply as a defeater rather than analyzing the specific genealogy wrinkle.
