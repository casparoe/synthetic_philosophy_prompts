  7.  **Final Review against constraints:**
      *   Dialogue format? Yes.
      *   OR at global retailer? Yes.
      *   Econ Mises-Hayek line? Yes.
      *   Shadow prices vs Market prices? Yes.
      *   Telemetry/ML argument? Yes.
      *   Store-level knowledge (substitution, dock routine)? Yes.
      *   No verdict? Yes.

  *(Self-Correction during final polish)*: Make sure Elena doesn't claim the firm *is* a socialist state, but that it proves the *mechanism* is viable. Make sure Marcus doesn't say the firm is inefficient, but that it relies on an external anchor.

