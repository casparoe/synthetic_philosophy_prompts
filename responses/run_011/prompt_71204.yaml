          *   Marcus: The SCD wasn't just about allocation. It was about *valuation*. You aren't valuing the warehouse; you're minimizing cost against a demand curve derived from... market sales.
          *   Elena: The demand curve is real data.
          *   Marcus: It's historical. Prices are forward-looking bets.
          *   Elena: ML is predictive.
          *   Marcus: Who bears the loss if the ML is wrong? The shareholders. But inside the firm, the warehouse manager doesn't lose his own money. The shadow price doesn't discipline him like a market price disciplines a bankrupt entrepreneur.
          *   Elena: We fire them if metrics miss.
          *   Marcus: That's political cost, not economic loss.
          *   *The Tacit Knowledge point:*
          *   Marcus: Does the model know the forklift driver takes a shortcut?
