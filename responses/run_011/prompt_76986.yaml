answer: |-
  You have hit on the central tension in the literature on **Program Equilibrium**. Your intuition is correct: if two programs literally try to *simulate* each other to decide their move, they will enter an infinite loop (or hit a recursion depth limit) and crash.

  The "standard move" you are referring to is usually associated with agents like **FairBot** (from the 2013 paper *Robust Cooperation in the Prisoner's Dilemma* by Barasz, Christiano, et al.). The reason this doesn't regress forever is that these programs do not **execute** their opponent's code; they **search for proofs** about their opponent's code.

  Here is the breakdown of how the regress is broken, the role of self-reference, and whether this is a "real" equilibrium.

  ### 1. The Naive Approach (Why it loops)
  If you write a program like this:
  ```python
  def decide(opponent_code):
      if opponent_code.run(my_source) == COOPERATE:
          return COOPERATE
      else:
          return DEFECT
  ```
  And your opponent writes the same thing, you get:
  1.  **Me** calls **You**.run(**Me**)
  2.  **You** calls **Me**.run(**You**)
  3.  **Me** calls **You**.run(**Me**)...
  **Result:** Stack overflow. Infinite regress.

  ### 2. The Solution: Proof Search, Not Simulation
  To break the regress, the agents are modeled not as Turing Machines that *run* code, but as logical agents that search for proofs within a formal system (like Peano Arithmetic).

  The code for **FairBot** looks conceptually like this:
  ```python
  def decide(opponent_code):
      # Search for a proof in formal system PA that:
      # "opponent_code.run(my_source) == COOPERATE"
      if exists_proof("opponent_code(my_source) == C"):
          return COOPERATE
      else:
          return DEFECT
  ```
  **Why this terminates:**
  The function `exists_proof` does not run the opponent. It searches through the space of logical derivations. Even if the search space is infinite, in the theoretical model, we treat the agents as having access to a "provability oracle" (or we bound the proof length).

  The regress is broken because **logical implication is not causal execution.**
  *   In execution: $A$ needs the *output* of $B$ to produce its *output*.
  *   In proof search: $A$ needs a *theorem* about $B$ to produce its *output*.

  ### 3. How the Circular Dependency is Resolved (Löb's Theorem)
  You asked how they settle on a determinate outcome. If FairBot cooperates only if it proves you cooperate, and you cooperate only if you prove it cooperates, isn't that still circular?

  Yes, but in logic, certain kinds of circularity are valid. This is where **Löb's Theorem** comes in.

  Löb's Theorem states (roughly): If a formal system can prove that *"If P is provable, then P is true"*, then P is provable.
  $$ \vdash \Box P \to P \implies \vdash P $$
  (Where $\Box P$ means "P is provable").

  **The Mutual Cooperation Proof:**
  1.  FairBot ($FB$) cooperates if it proves $\Box (Opponent(FB) = C)$.
  2.  Opponent ($O$) cooperates if it proves $\Box (FB(O) = C)$.
  3.  Through the magic of Gödel's Fixed Point Lemma and Löb's Theorem, the system can construct a proof that says: *"If it is provable that we both cooperate, then we both cooperate."*
  4.  Because the condition for cooperation is essentially *"It is provable that you cooperate,"* Löb's theorem validates the circular dependency. The proof exists, so both agents find it, and both cooperate.

  The regress stops because the logical system accepts the fixed point as a valid theorem, whereas a computer CPU rejects the fixed point as a stack overflow.

  ### 4. The Role of Self-Reference (Quining)
  You mentioned the Recursion Theorem. You are right that this is necessary, but it solves a different problem than the regress.

  *   **The Regress Problem:** "I need to know what you do with me." (Solved by Proof Search + Löb's Theorem).
  *   **The Self-Reference Problem:** "How do I pass *my own source code* to you without an infinite string?" (Solved by Quining/Recursion Theorem).

  In the code `opponent_code.run(my_source)`, where does `my_source` come from? You cannot simply define `my_source = "..."` because the string would have to contain itself.
  Programs use a **Quine** structure (enabled by Kleene's Recursion Theorem) to generate their own source code as a string variable at runtime. This allows the program to hand a copy of itself to the opponent (or to the proof checker) without infinite length.

  So, the Recursion Theorem allows the program to *exist* self-referentially; Löb's Theorem allows the program to *reason* self-referentially without looping.

  ### 5. Is this a "Real" Fixed Point or an Artifact?
  This is the deepest part of your question. Is Program Equilibrium robust, or is it a trick of the model?

  **It is a real fixed point, but it is fragile.**

  1.  **Model Dependence:** This equilibrium relies entirely on the agents sharing the same formal axioms (e.g., both use Peano Arithmetic). If FairBot uses PA and the opponent uses PA + 1 (a stronger system), FairBot might not be able to prove the opponent's cooperation, leading to defection.
  2.  **Computational Bounds:** In the real world, proof search is expensive. If you bound the computation time (Bounded Program Equilibrium), the agents might not find the proof of cooperation before the timer runs out. In that case, they default to Defect. The "infinite regress" is replaced by a "timeout."
  3.  **Exploitability:** Early versions of these bots (like FairBot) were vulnerable to unconditional Cooperators (they would cooperate, wasting utility). Newer bots (like **PrudentBot**) are designed to cooperate with FairBot but defect against Unconditional Cooperator, making the equilibrium more robust.

  ### Summary
  The regress is broken by shifting the domain from **computation** (running code) to **logic** (proving theorems).
  *   **Execution** creates a causal chain that loops infinitely.
  *   **Provability** creates a logical structure that can be a valid fixed point (via Löb's Theorem).

  It is not merely a coding trick; it is a genuine Nash Equilibrium within the space of programs that reason about each other. However, it is an "artifact" in the sense that it requires a very specific, idealized computational environment (unbounded proof search, shared axioms) that doesn't perfectly map to physical computers with limited clock cycles.

  In physical reality, this manifests as **trust based on verification**: "I will cooperate if I can verify (within my time limits) that your structure compels you to cooperate." If verification is too costly, the equilibrium collapses back to Defect.
