          *   *7. The Plutarchan Replacement:* If we adopted Plutarch: No removals. Plaques would tell the *whole* story, flaws included, as lessons. Naming would be rarer, reserved for those whose *whole* life teaches something. The "honor" becomes "pedagogical utility."

