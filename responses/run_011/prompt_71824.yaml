              *   *Situationist:* Inconsistent. Practice assumes stable traits.
              *   *Work/Author Separation:* Consistent with keeping the work, inconsistent with removing the name (if the name is just a label).
              *   *Historical Relativism:* Inconsistent. Practice judges past by present standards.
