answer: |-
  ### Brainstorming Candidate Theories

  Before reconstructing the implicit philosophy of this practice, I must lay out the competing theoretical frameworks that could partially explain it. Each captures a facet of the phenomenon but stumbles on others.

  **1. Theories of Character**
  *   **Global Unity (The "Bad Apple" Theory):** Character is a single, unified substance. A significant moral defect in one area contaminates the whole person.
      *   *Explains:* Why private cruelty disqualifies a public benefactor; why removal feels necessary.
      *   *Fails:* To explain why the institution continues to teach the person's work. If the character is rotten, why is the intellect or art still valid?
  *   **Modular Compartmentalization:** Character consists of separate traits. One can be a vicious husband but a brilliant scientist.
      *   *Explains:* Why the work remains in the curriculum while the name comes off the building.
      *   *Fails:* To explain why removal is seen as a *moral* obligation rather than a branding update. If traits are modular, the "benefactor" trait remains intact even if the "husband" trait is vile.
  *   **Narrative Identity:** A person is the sum of their story. We judge the *shape* of the life, not just isolated traits.
      *   *Explains:* Why new information changes the verdict (it changes the story's shape).
      *   *Fails:* To explain why the timing of the discovery matters (faults known then vs. known now).

  **2. Theories of Knowledge (Epistemology)**
  *   **Forensic Archival:** Character can be known through sufficient documentary evidence, judged by a tribunal of peers.
      *   *Explains:* The use of commissions, reports, and archives to justify removal.
      *   *Fails:* To account for the Plutarchan intuition that character is subtle. It assumes the archive is complete and the judges are objective. It ignores that we are judging the past with present eyes.
  *   **Moral Progressivism:** We know character better than the past did because our moral vision is clearer.
      *   *Explains:* Why acts legal then are disqualifying now.
      *   *Fails:* To explain why we don't apply this equally to everyone (why only *some* historical figures are scrutinized).
  *   **Revelatory Epistemology:** The facts haven't changed, but their *meaning* has been revealed.
      *   *Explains:* Why a name feels different after a scandal even if the building is the same.
      *   *Fails:* To explain why contextualization is seen as a "middle ground" rather than just more data.

  **3. Theories of Honor**
  *   **Exemplarity:** To name a building is to say, "Imitate this person."
      *   *Explains:* Why removal is necessary if the person is not imitable.
      *   *Fails:* To explain donor names. We do not want students to imitate the wealthy donor who bought the wing; we just want their money.
  *   **Endorsement:** To name a building is to say, "This institution stands with this person."
      *   *Explains:* Why removal is an act of dissociation.
      *   *Fails:* To explain why the work is still cited. If we dissociate from the person, why do we associate with their ideas?
  *   **Stewardship:** The institution holds the name in trust for the public.
      *   *Explains:* Why the public feels ownership over the decision.
      *   *Fails:* To explain why the decision is often top-down and why donor contracts (legal ownership) often override moral stewardship until public pressure mounts.

  **Synthesis of Failures:** The most glaring failure across all candidates is the **Donor/Honoree Ambiguity**. If the same plaque format is used for a moral hero and a check-writer, the "Exemplarity" theory is structurally undermined. Yet, the removal practice treats *all* names as if they were Exemplary. This suggests the practice is philosophically unstable, operating on one theory for bestowal (mixed endorsement/transaction) and another for removal (strict moral exemplarity).

  ***

  ### Reconstruction of the Practice

  Having cleared the ground, I will now reconstruct the implicit philosophy that makes this practice function, addressing your seven points in order.

  #### 1. The Implicit Account of Character
  The practice does not rely on a psychological reality of character, but on a **symbolic unity**. It does not strictly require that character be a single global thing in the metaphysical sense, but it requires that it be *treatable* as one for the purposes of public memory.

  For the practice to make sense, a life must have an **overall moral valence** that can be tipped from positive to negative. This is not the "unity of the virtues" (where having one virtue implies having all), but rather a **contagion principle**. The practice assumes that moral defects are porous; they leak from the private sphere into the public legacy. This explains why a benefactor's violence at home spoils the hospital wing: the name is not honoring the *money*, but the *source* of the money. If the source is morally toxic, the gift is tainted.

  However, the practice implicitly rejects the idea that a person is *identical* to their character. This is the only way to make sense of keeping the work while removing the name. The practice posits a split between the **Agent** (who bears moral weight and is subject to honor/shame) and the **Author** (who produces intellectual/artistic goods that can be separated from the Agent). Thus, character is stable enough to be judged across decades, but porous enough to contaminate the name, yet not so totalizing that it destroys the utility of the work.

  #### 2. The Implicit Epistemology
  The practice rejects the Plutarchan epistemology. Plutarch believed character was disclosed in trifles and required a biographer's artistic insight to discern. The modern practice adopts a **Forensic-Retrospective Epistemology**.

  It presupposes that character is a matter of **fact** that can be unearthed by a commission. It assumes the archive is sufficient to render a verdict. Unlike Plutarch, who sought to understand the *movement* of a soul, modern commissions seek to establish *violations* of a code.

  Crucially, this epistemology relies on **Moral Realism regarding Progress**. It assumes that our current moral vocabulary is more accurate than that of the past. When a commission judges a figure from 100 years ago, it presupposes that we have access to a moral truth that was available *then* but ignored, or that moral truth evolves and applies retroactively. It treats the "discovery" of a flaw not as a change in the person (who is dead) but as a correction of the record. It assumes that silence in the past was ignorance or complicity, and that our current noise is clarity. This is a bold claim: that the passage of time grants moral omniscience.

  #### 3. The Implicit Theory of Honor
  This is the engine of the practice. The bestowal of a name is an act of **Canonical Endorsement**, distinct from commemoration or study.
  *   **Commemoration** says: "This person existed and mattered." (Compatible with keeping a statue in a museum).
  *   **Study** says: "This person's ideas are useful." (Compatible with assigning their books).
  *   **Canonical Endorsement** says: "This person is *one of us*; their name shelters this space."

  Removal is possible because Endorsement is a **speech act** performed by the institution. Just as a promise can be broken, an endorsement can be retracted. The name on the building is not a historical fact (like a date on a cornerstone); it is a present-tense claim by the institution about its current values. When the institution removes the name, it is not erasing history; it is correcting a false claim of affiliation.

  This explains why **Contextualization** occupies a middle ground. Silence implies acceptance. Removal implies total rejection. Contextualization says: "This person is part of our history, but not part of our *identity*." It shifts the name from the category of *Honor* to the category of *History*. It admits the person is an ancestor, but a problematic one. This is morally distinct because it preserves the truth of the past (they were here) without validating the moral claim (they are like us).

  #### 4. Testing Coherence
  Is this coherent? **Barely.** The practice holds together only through a fragile distinction between **Utility** and **Identity**.

  It is coherent to say, "We use this person's physics, but we do not want their name on our lobby." This relies on the Agent/Author split mentioned in point 1. However, the **Donor/Honoree Ambiguity** creates a fracture. If a donor buys a name, the institution is not endorsing their character, but renting their capital. Yet, when a donor is scandalized, the institution often removes the name as if it were an honorific.
  *   *Incoherence:* If the name was sold, removal is a breach of contract or a devaluation of assets. If the name was honored, removal is a moral correction. By treating them identically, the institution implies that *all* names are honorific, which renders the sale of names a lie.
  *   *The "Retroactive" Problem:* The practice assumes the name meant something different fifty years ago than it does now. This is only coherent if the meaning of a name is determined by the *current* viewer, not the *original* intender. The practice implicitly adopts a **Receiver-Theory of Meaning**: The name means what the community feels it means today.

  The heaviest lifting here is done by the claim that the institution's *current* values override the *past* decision. The practice is coherent only if we accept that institutions are moral agents that must maintain consistency over time, even if that requires rewriting their own history.

  #### 5. Rival Views Ruled Out
  *   **The Plutarchan Picture (Mixed Lives):** **Inconsistent.** Plutarch uses faults to humanize and teach. The modern practice treats faults as contamination. Plutarch would keep the name and add the scandal to the plaque as a lesson in human complexity. The modern practice views the scandal as invalidating the honor.
  *   **The Hagiographic Picture (Saints' Lives):** **Inconsistent.** Hagiography solves the problem of faults by omission or by framing them as virtues. The modern practice solves it by exposure and removal. However, the *desire* for hagiography drives the practice; we want saints, and when we find out they are men, we evict them.
  *   **Situationist Psychology (Traits are unstable):** **Inconsistent.** The practice assumes traits are stable enough to judge a dead person. If character is situational, judging a 19th-century figure by 21st-century situations is category error.
  *   **Separation of Work and Author:** **Troubled Consistency.** The practice relies on this to keep the books while removing the name. But it violates this by assuming the "taint" of the author stains the building (which is inert) but not the lecture (which is intellectual). It applies the separation selectively.
  *   **Historical Relativism (Judge by standards of the time):** **Inconsistent.** The practice explicitly rejects this. It judges the past by present standards. It rules out the view that moral appraisal is indexed to the agent's available knowledge.

  #### 6. Underdetermination and Official Justifications
  What is strictly presupposed vs. what merely fits?
  *   **Strict Presupposition:** The institution must be viewed as a moral agent capable of shame. If the university is just a corporation, removal is merely PR. For the practice to have the *moral weight* participants feel, the institution must be capable of virtue and vice.
  *   **Underdetermined:** The practice is compatible with two rival underlying theories:
      1.  **Purification:** We are removing evil to cleanse the space.
      2.  **Representation:** We are updating our brand to match our demographic.
      *   *Official Justification:* "They no longer represent us." This is compatible with both. It allows the institution to claim moral high ground (Purification) while engaging in reputation management (Representation).
  *   **The Donor Problem:** The existence of purchased names suggests the "Honor" theory is a facade. If the practice were truly about character, names would never be sold. The fact that they are sold, but treated as sacred when scandal hits, suggests the "Honor" theory is a **retroactive imposition**. We pretend the name was honorific to justify the moral outrage required to remove it.

  #### 7. The Plutarchan Replacement
  If an institution adopted the Plutarchan picture in earnest—where lives are mixed, faults are pedagogical, and character is disclosed in trifles—the practice would change radically.

  *   **Naming Conventions:** Names would rarely be bestowed. A name would not signal "This person is good," but "This person is significant." We might see fewer named buildings, reserved for those whose *entire* narrative offers a coherent lesson.
  *   **Plaques:** A Plutarchan plaque would not hide the flaw. It would read: *"John Smith, whose endowment built this wing, was a visionary educator who also exploited his workers. As you enter, consider how great goods often arise from mixed hands."* The flaw is not a reason for removal; it is part of the curriculum.
  *   **Ceremonies:** Dedication ceremonies would not be coronations. They would be eulogies that acknowledge the full scope of the life.
  *   **Removal:** Removal would be almost non-existent. You do not remove a chapter from a history book because the protagonist is flawed. You might add a marker, but the name stays because the *truth* of the history matters more than the *purity* of the brand.
  *   **Survival of Current Practice:** The honorific function would be abandoned. The "honor" would be replaced by "pedagogical utility." The building is not a shrine to a saint, but a case study in civics.

  **Conclusion:**
  The current practice is not a descendant of Plutarch, nor of the Saints' Lives, but a hybrid of **Hagiography and Real Estate Law**. It desires the moral clarity of the Saints' Lives (pure heroes) but operates in the commercial reality of modern institutions (where names are assets). When the hagiography fails (the saint is found to be a sinner), the real estate logic takes over (the asset is devalued), but it is dressed up in the language of moral justice.

  The step doing the most work in this reconstruction is **Step 3 (Theory of Honor)**. Without understanding the name as a *speech act of endorsement* rather than a *record of fact*, the removal practice makes no sense. If the name were just a record (like a date), removing it would be lying. Because it is an endorsement, removing it is truth-telling. The tension arises because we pretend all names are endorsements, even the ones we sold.

  I am uncertain whether the "Agent/Author" split in Step 1 is sustainable long-term. As our understanding of "complicit knowledge" grows, the distinction between a racist's science and their racism may blur, potentially collapsing the practice entirely into either total cancellation or total relativism. The current equilibrium is unstable.
