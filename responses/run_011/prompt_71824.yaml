          *   *2. Epistemology:* It's not Plutarchan (anecdotal/insightful). It's *forensic* and *retrospective*. It assumes the archive is sufficient. Crucially, it assumes *moral progress* allows us to see what they couldn't. It treats character as *discoverable* rather than *constructed*.
          *   *3. Honor:* It is *Endorsement*, not just Commemoration. Naming = "This is one of us." Removal = "Excommunication." Contextualization = "This is a complex ancestor." This explains why private vice matters (it affects whether we want them as "ancestors").
          *   *4. Coherence Test:* Is it coherent? Barely. It relies on a distinction between *intellectual utility* (keep the work) and *moral patronage* (drop the name). The donor ambiguity suggests the "Honor" theory is actually weak; it's often just *Branding*. The moral outrage treats it as Honor, but the practice treats it as Real Estate.
          *   *5. Rival Views:*
