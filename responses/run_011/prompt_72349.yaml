  ### The Collective Mind Decision Tree

  **Instructions:** Start at the top. Answer each question based on the specific case (e.g., the ant colony, the couple, the consortium). Follow the branch that matches your intuition until you reach a leaf.

  **1. Prediction:** Is calling it a 'mind' describing what it *is*, or just a useful story for predicting it?
  *   Useful story → **Instrumentalist**
  *   Describing what it is → *Go to 2*

  **2. Composition:** Is its cleverness just the parts doing their jobs, or something new emerging from the group?
  *   Parts doing jobs → *Go to 3*
  *   Something new → *Go to 4*

  **3. Scale:** Is 'having a mind' an all-or-nothing switch, or a matter of degree?
  *   All-or-nothing → **Flat No**
  *   Matter of degree → **Deflationary Degrees**

  **4. Conflict:** Can the group commit to something the individual parts disagree with?
  *   No (Parts always align) → **One System**
  *   Yes (Whole overrides parts) → *Go to 5*

  **5. Experience:** Does it have inner feelings, or just inputs and outputs?
  *   Inner feelings → **Group Agent with Experience**
  *   Inputs/outputs → *Go to 6*

  **6. Membership:** Did the parts choose to join this group, or are they stuck in it?
  *   Stuck (Involuntary) → **Flat No** *(Functional Ghost)*
  *   Choose (Voluntary) → **Group Agent without Experience**

  ***

  ### Table of Logical Space

  The six questions above generate 64 theoretical paths. The table below maps the occupied leaves (recognisable positions) against the empty cells (pruned paths).

  | Leaf / Position | Occupied? | Notes on Empty Cells / Collapses |
  | :--- | :--- | :--- |
  | **Instrumentalist** | Yes | Occupied by cases where 'mind' is purely predictive (Probe 2). |
  | **Flat No** | Yes | Occupied by hard eliminativism (Probe 6) and strict thresholds (Probe 2 alternative). |
  | **Deflationary Degrees** | Yes | Occupied by cases where cognition is real but reduced (Probe 1). |
  | **One System** | Yes | Occupied by tightly coupled biological units with no conflict. |
  | **Group Agent (With Exp)** | Yes | Occupied by phenomenally unified collectives (Probes 3 & 4). |
  | **Group Agent (Without Exp)** | Yes | Occupied by functional agents lacking qualia (Probe 5). |
  | *Fact + Parts + Switch + Conflict* | **No** | Incoherent: If it's just parts, they cannot conflict with a 'whole'. |
  | *Fact + New + No Conflict + No Exp* | **No** | Unattractive: If no conflict, 'New System' adds no explanatory power. |
  | *Fact + New + Conflict + No Exp + Stuck* | **Collapsed** | Mapped to **Flat No**. Functionally identical to eliminativism for most users. |
  | *Fact + New + Conflict + Yes Exp + Stuck* | **Unexplored** | Worth a paper: Could a forced collective (e.g. hive) have phenomenology? |

  ***

  ### Indistinguishable Leaves

  **Bees (Probe 3) and Couple (Probe 4)** both land on **Group Agent with Experience**.
  *   **Why:** The tree prioritises phenomenology and conflict over biological vs. artifactual composition.
  *   **Further Question:** "Does the system rely on non-living artifacts to store memory?" (Yes → Extended Mind; No → Biological Collective).

  **Consortium (Probe 5) and China Brain (Probe 6)** are separated by **Node 6 (Membership)**, but both lack experience.
  *   **Why:** The tree distinguishes legal agency from functional simulation.
  *   **Note:** If you deny phenomenology is required for 'mind', these collapse into one **Functionalist Agent** leaf.

  ***

  ### Sorting Your Probes

  Based on the views you provided:

  1.  **Ant Colony:** You view this as a redescription of ants. → **Deflationary Degrees**.
  2.  **Slime Mould:** You view this as projection onto a single cell. → **Instrumentalist** (or Flat No).
  3.  **Bee Swarm:** You see "something there". → **Group Agent with Experience**.
  4.  **Married Couple:** You extend cognition to the notebook. → **Group Agent with Experience**.
  5.  **Consortium:** You see a clear subject without implying feelings. → **Group Agent without Experience**.
  6.  **China Brain:** You deny mind due to lack of phenomenology. → **Flat No**.

  **Analysis:** Your pattern straddles five different leaves. You are a **Realist** about structure (rejecting Instrumentalism for most probes) but a **Conservative** about phenomenology (requiring it for 'mind' in biological cases, yet granting agency to the Consortium without it). You prioritise **functional organisation** (Consortium) over **phenomenal unity** (China Brain) when assigning subjecthood.

  The leaf that fits most of your "Yes" answers regarding subjecthood (Probes 3, 4, 5) is the **Group Agent** branch. Since you explicitly deny experience for the clearest case (Consortium) and the China Brain, but grant it to Bees/Couple, your dominant operational definition is functional agency.

