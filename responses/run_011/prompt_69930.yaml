answer: |-
  You've set a clever trap, the kind a sophist might weave to win a debate rather than find the truth, but it rests on a false choice. You say that if I record what others say, it's only evidence of their belief, and if I reason it out, it's only evidence of my own mind. But men act on what they believe, not always on what is true. If the Persians tell me that Phoenician traders started the feud by stealing Io, that story itself is the cause of the enmity that follows. To know why Xerxes marched, I must know what he was told was true, and what his fathers told him was true. By keeping my hands clean and reporting the *logoi* without always endorsing them, I am not avoiding the events; I am mapping the causes. If I simply declared "this happened" and "that did not," I would be hiding the very motives that drove the armies into the fire.

  As for Helen, you call it my political imagination, but I call it weighing the likely against the unlikely. Would any man keep a stolen woman if he knew it meant the destruction of his house? Priam was not a fool, and even kings love their sons. I admit freely that some things I write down are nonsense—I tell you when I suspect it, too—but I write it down because it is part of the landscape I walked through. If I only printed what I could verify with my own eyes, the book would be a thin scroll indeed, and you would know nothing of the world beyond Halicarnassus. I do not pick your horn. I leave the judgment to the reader, which is a heavier burden than pretending to be a god who sees all. Now, tell me: if I hide the stories people tell, how will you ever know why they fought?
