  Looking at our record, the most consistent path forward requires us to treat the crab ruling as the primary analog for both the shrimp method and the decapod scope question, primarily because that decision explicitly brought decapod crustaceans into scope following an evidence review rather than limiting itself to a single species. If we want to maintain internal consistency, we should certify the in-water electrical stunning for the whiteleg shrimp but refuse to certify the parallel ice line, and we should clarify that the crab ruling obliges stunning across decapods generally unless specific evidence exonerates a species. The Tilapia ruling is the secondary analog here, but it actually works against the grower's request to keep the ice line because our permission there was explicitly conditional on the absence of a workable stun, a condition that has now been met by the grower's own installation. By allowing the ice line to continue under certification now that electrical stunning is operational, we would violate the revisit clause we attached to the Tilapia exemption, effectively making that condition meaningless.

  There are two principles fitting our record that split on this case, the first being the Taxonomic Consistency Principle and the second being the Evidence Specificity Principle. The Taxonomic Consistency Principle, drawn from the crab ruling, suggests that once a biological class like Decapoda is flagged for welfare risks, all members inherit that status unless proven otherwise, which would mandate stunning for shrimp and ban ice packing across the board. The Evidence Specificity Principle, drawn from the trout and sea urchin rulings, suggests we should not generalize welfare outcomes without species-specific data, which could argue for allowing the ice line if we lack direct evidence that shrimp suffer in ice slurry exactly as crabs do. If we choose Taxonomic Consistency, we are committing ourselves to regulating future decapod species like lobsters or crayfish without commissioning new evidence reviews, prioritizing regulatory efficiency and precaution over granular physiological data. If we choose Evidence Specificity, we are committing ourselves to a slower, more resource-intensive process where every new decapod species requires its own review, risking the inconsistency of having stunned crabs alongside iced shrimp under the same label.

  The choice we make here also commits us to a stance on technological feasibility as a driver of welfare standards, echoing the Tilapia and salmon rulings. By denying the ice line now that stunning technology exists, we commit to the principle that welfare exemptions are temporary measures contingent on technological absence, not permanent rights based on species physiology. This means we will eventually have to revisit the Tilapia ruling if a high-throughput percussive or electrical stun becomes available for them, forcing us to be proactive in monitoring tech developments rather than reactive to producer applications. The further case that would settle which principle we are actually running would be a petition from a producer farming a decapod species where electrical stunning is physically impossible or lethal before the stun takes effect. In that scenario, we would be forced to choose between banning the species entirely under Taxonomic Consistency or allowing a method like ice under Evidence Specificity, revealing whether our commitment to the decapod classification is absolute or subordinate to practical welfare outcomes.
