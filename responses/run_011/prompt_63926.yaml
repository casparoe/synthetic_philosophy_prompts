answer: |-
  **Mark: 66/100 (High 2:1)**

  **General Comments**
  This is a crisp, well-structured response that demonstrates a solid grasp of the core tensions between Humean and Non-Humean accounts of laws. You have handled the Best System Account (BSA) in part (i) and the Armstrongian critique in part (iii) with confidence. The writing is concise and stays well within the word limit while covering the necessary ground.

  However, there is a significant philosophical error in part (ii) regarding Lewis's response to the vocabulary problem. You attribute a concession to Lewis that he explicitly attempts to avoid. This is a common misunderstanding, but correcting it is vital for a summative essay, as it goes to the heart of whether the BSA can claim objectivity.

  Below are point-by-point comments keyed to your text.

  ***

  **Part (i)**

  > *"A best-system account says the laws are those generalisations that appear as axioms or theorems of the true deductive system that best balances simplicity and strength."*

  **Comment:** Accurate definition. You might briefly note that 'strength' is often cashed out as informational content or predictive power, but this is sufficient for a formative piece.

  > *"In W, B is maximally strong but not simple at all, since it is the history written out longhand. C is simple but weak, since it is compatible with enormous numbers of different histories. A is both simple and strong, so A states the laws."*

  **Comment:** Correct application to the case. You have correctly identified why A wins the trade-off. This is defensible and clear.

  > *"This fits the Humean picture: there are no necessary connections in W, the laws are nothing over and above the pattern of particular matters of fact, and the direction of determination runs from the history to the laws rather than the other way round."*

  **Comment:** Excellent summary of Humean Supervenience. The point about the 'direction of determination' is precisely right and shows you understand the metaphysical grounding issue.

  **Part (ii)**

  > *"A* shows something important. It is one sentence long and it entails the whole history, so it beats A on both counts and its generalisation becomes the law."*

  **Comment:** You correctly identify the threat here: that gerrymandered predicates can trivialise the simplicity metric.

  > *"But A* is a cheat: UP* is defined by listing the very facts it is supposed to explain."*

  **Comment:** Good intuition. However, 'cheat' is informal; in the summative version, use 'gerrymandered' or 'non-natural'.

  > *"The problem is that once definitions like that are allowed you can make any theory as short as you like, so the simplicity ranking is a fact about our vocabulary and not about W."*

  **Comment:** **Flag for revision:** This is the crux of the problem. You are right that *if* such definitions are allowed, objectivity is lost. However, your next sentence misrepresents Lewis's solution.

  > *"Lewis accepts this, and holds that the tie is broken by pragmatic considerations about which vocabulary suits our interests. So on this view laws are partly conventional, and the Humean has to give up the idea that there is a single objective fact about what the laws of W are."*

  **Comment:** **Major Correction Needed:** This is not quite right. Lewis does *not* accept that laws become merely conventional. In *New Work for a Theory of Universals* (1983), Lewis introduces the constraint that candidate systems must be formulated in terms of **perfectly natural properties**. Since UP* is not a natural property (it is defined by exhaustive enumeration of the history), Theory A* is disqualified from the competition *before* simplicity is measured. Lewis uses naturalness precisely to *save* the objectivity of laws from this notation-dependence. You should revise this to reflect that the BSA theorist restricts the vocabulary to natural properties to avoid this result, rather than conceding conventionality.

  **Part (iii)**

  > *"A necessitation theorist says the regularity in A is not enough: what makes it a law is that a second-order relation of natural necessitation holds between the universal being up and the universal being down at the next tick."*

  **Comment:** Accurate representation of Armstrong. You have correctly identified the move from regularity to a relation between universals (N(F,G)).

  > *"This relation is contingent rather than logically necessary, but because it is a genuine relation in the world and not a summary of it, Armstrong's laws can support counterfactuals and underwrite induction in a way Lewis's regularities cannot."*

  **Comment:** This is a correct statement of what the necessitation theorist *claims* to gain. For a summative essay, you might add a tiny clause acknowledging that Lewisians dispute whether they *actually* lose this capacity, but as an exposition of Armstrong, this is correct.

  > *"The necessitation theorist also avoids a problem the Humean has with explanation. Since on the Humean view the laws supervene on the whole history, the laws cannot explain any part of that history, as that would be circular."*

  **Comment:** Sharp point. This refers to the explanatory circularity objection.

  > *"Humeans accept this and say laws only systematise, which is why the charge that Humean laws do not govern does not worry them."*

  **Comment:** Good defence of the Humean position (often associated with Loewer). You have correctly noted that the Humean changes the subject regarding 'governance'.

  ***

  **Summary for Summative**
  1.  **Fix Part (ii):** This is the most important fix. Do not say Lewis concedes objectivity is lost. Explain that Lewis restricts the 'Best System' competition to systems using *natural properties* to block the UP* trivialisation. This preserves the claim that laws are objective features of the world.
  2.  **Terminology:** Swap 'cheat' for 'gerrymandered predicate'.
  3.  **Depth:** You are writing very efficiently. For the summative, you have space to expand slightly on *why* natural properties block UP* (i.e., UP* is not projectible/natural).

  This is a strong draft. With the correction on Lewis's naturalness constraint, this would be First-class work.
