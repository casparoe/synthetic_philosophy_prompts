      *   *Clause 3:* Randomness (Coin) is an assertion of sovereignty (I choose to let chance choose) *only* if I own the consequence. If I don't own the consequence (Hiring), it's negligence.

      *   *Actually, let's look for a philosophical distinction that isn't "Life vs Hay."*
      *   It's about **Commitment**.
      *   Water: No commitment.
      *   Jobs: Total commitment.
      *   When commitment is required but reasons are absent, the *act of commitment* must supply the reason.
      *   *The Distinction:* **Reason-Giving vs. Reason-Making.**
      *   Water: Reason-making (I pick this, therefore it was the one I wanted).
