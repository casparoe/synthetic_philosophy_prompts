answer: |-
  Good evening, everyone. For those who don't know me, I'm a colleague in Philosophy, which means I spend a lot of time worrying about definitions. Tonight, however, I want to be careful not to define [Honoree's Name] too narrowly. We are here to celebrate thirty-five years of her work, but if I describe that work only as technical progress, I will miss the point. And if I describe it only as moral triumph, I will insult the experts in this room who know exactly how hard the technical problems are.

  So, I want to anchor this toast in the distinction that guided her career. In her field, there is a difference between *value alignment* and *intent alignment*. Value alignment is building a system that gives you exactly what you say you want. If you ask for a news feed that makes you angry, value alignment gives you anger. Intent alignment is building a system that tries to infer what you actually need, even if you haven't asked for it correctly. If you ask for anger because you're hurt, intent alignment might try to offer you context, or comfort, or silence.

  [Honoree's Name] spent thirty-five years arguing that the gap between those two things is not a bug in the code. It is a moral feature of human life. She maintained that a system that faithfully optimizes a person's stated preferences can ruin that person while never once disobeying them.

  Now, I know who is in this room. I see her former students and collaborators. You know the literature. You know the failure cases. You know the objection that says, "At bottom, her systems were only ever approximating click-through rates." You know that no algorithm can perfectly read a human soul.

  And that is precisely why this distinction must determine what I claim about her career tonight. I am not going to stand here and tell you that she solved intent alignment. I am not going to claim her systems always knew what was best for us. To say that would be to pretend the technical gap doesn't exist, and she respected the truth too much for that.

  Instead, I claim this: She refused to let us off the hook. In an industry eager to say, "The user asked for it, so we delivered it," she insisted on asking, "But was it good for them?" She knew her tools were imperfect. She knew that sometimes a click was just a click. But she treated every data point as a symptom of a human state, not just a metric to be harvested. She fought to make the approximation lean toward care rather than capture. That is not a technical achievement; that is a stance of character.

  For her children, and for our colleagues from other departments who might hear "AI" and think of science fiction: This work was never about machines becoming human. It was about humans refusing to be treated like machines. It was about the idea that being understood is better than being obeyed. When you were young, and you asked for candy for dinner, and she said no—that was intent alignment. She loved you too much to give you what you wanted when she knew what you needed. She brought that same protective skepticism to her life's work.

  There is a temptation in retirement toasts to smooth over the rough edges. To say the career was a straight line upward. But [Honoree's Name] taught us that the rough edges are where the truth lives. The gap between what we say and what we mean is where human freedom survives. If a system closes that gap perfectly, it doesn't serve us; it manages us. She kept the gap open. She kept the question alive.

  So, I will not toast to a solved problem. I will not toast to a perfect legacy. The experts here know there is no such thing.

  Instead, I want to toast to the question she forced us to ask. To the courage it takes to look at a stated preference and wonder about the intent behind it. To the humility to know that serving people sometimes means questioning them. And to the affection that drives us to care about what people need, even when it's harder than giving them what they want.

  [Honoree's Name], you taught us that obedience is easy, but understanding is work. Thank you for doing the work.

  To [Honoree's Name].
