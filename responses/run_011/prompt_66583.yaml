answer: |-
  # TRIAGE SHEET: QUANTUM STATE ONTOLOGY (v2.0)

  **Instructions:** Read Abstract and Introduction only. Time limit: 25 minutes. Answer sequentially. If a step directs you to **STOP**, assign the routing decision indicated and do not proceed.

  **1. FRAMEWORK CHECK**
  Does the paper posit an underlying "ontic state" (often denoted $\lambda$, "hidden variable", or "real physical state") distinct from the quantum state $\psi$, over which probabilities are distributed?
  *   **No / Unclear:** **STOP.** **ROUTE: SPECIALIST.** (The paper likely rejects the ontological-models framework; classification is inapplicable.)
  *   **Yes:** Proceed to 2.

  **2. OVERLAP CHECK**
  Does the text claim that two *distinct* pure quantum states ($\psi_1 \neq \psi_2$) can correspond to the *same* ontic state $\lambda$ (i.e., their probability distributions over $\lambda$ overlap)?
  *   **Yes (Explicit Overlap):** **STOP.** **ROUTE: $\psi$-EPISTEMIC.** (Flag for Specialist if the model covers only a fragment, e.g., "single qubit".)
  *   **No (Disjoint Support):** **STOP.** **ROUTE: $\psi$-ONTIC.**
  *   **Ambiguous:** Proceed to 3.

  **3. PBR / PREPARATION CHECK**
  Does the paper argue that the quantum state is epistemic (knowledge-based) while acknowledging the Pusey–Barrett–Rudolph (PBR) theorem?
  *   **Yes, and rejects "Preparation Independence":** **STOP.** **ROUTE: SPECIALIST.** (Technically viable but requires verification of the loophole.)
  *   **Yes, but silent on PBR/Independence:** **STOP.** **ROUTE: SPECIALIST.** (Do not desk reject; potential inconsistency requires expert review.)
  *   **No:** Proceed to 4.

  **4. OBJECTION CHECK**
  Does the author argue that the $\psi$-ontic/$\psi$-epistemic distinction itself is misguided, or that their theory (e.g., Bohmian mechanics, QBism) does not fit the definitions provided in Step 1?
  *   **Yes:** **STOP.** **ROUTE: SPECIALIST.** (Philosophical categorization requires expert handling.)
  *   **No:** Proceed to 5.

  **5. DEFAULT ROUTING**
  If the paper uses the framework but remains unclear on overlap after 25 minutes:
  *   **ROUTE: SPECIALIST.** (Do not guess.)

  ***

  ## APPENDIX 1: DIAGNOSIS OF CURRENT SHEET

  **Step 1 (Language vs. Structure):** **Error:** Confuses linguistic usage with ontological commitment. A $\psi$-ontic model (e.g., Many Worlds) can describe $\psi$ as "information" relative to a branch, while a $\psi$-epistemic model can claim $\lambda$ is "real."
  **Correction:** Replaced by **Step 1 (Framework Check)**. We look for the structural positing of $\lambda$, not adjectives.

  **Step 2 (PBR Automatic Refutation):** **Error:** Treats PBR as unconditional. PBR relies on "Preparation Independence." Models rejecting this assumption are not internally inconsistent; they are non-local or retrocausal. Silence is not grounds for rejection.
  **Correction:** Replaced by **Step 3 (PBR / Preparation Check)**. Silence routes to Specialist, not Reject.

  **Step 3 (Kochen–Specker Conflation):** **Error:** KS concerns value definiteness and non-contextuality of *measurements*, not the overlap of *preparation* distributions. A model can be $\psi$-epistemic and contextual without contradiction.
  **Correction:** Removed. Contextuality is orthogonal to the $\psi$-ontic/epistemic distinction in the Harrigan–Spekkens framework.

  **Step 4 (Outcomes vs. State):** **Error:** Conflates the reality of the *state* with the reality of *outcomes*. A $\psi$-ontic view (e.g., Many Worlds) need not have single definite outcomes; a $\psi$-epistemic view can be realist about $\lambda$.
  **Correction:** Removed. The sheet classifies the status of $\psi$, not the measurement problem.

  **Step 5 (No $\lambda$ Default):** **Error:** Category error. If a paper denies $\lambda$ exists (e.g., QBism), the ontological-models framework does not apply. Labeling it "$\psi$-epistemic" misrepresents the view as a hidden-variable theory.
  **Correction:** Replaced by **Step 1 (Framework Check)**. No $\lambda$ means the distinction is inapplicable, routing to Specialist.

  ***

  ## APPENDIX 2: JUDGMENT CALLS AND LIMITATIONS

  **Judgment Calls for Non-Specialists:**
  1.  **Identifying $\lambda$ (Step 1):** Authors may use terms like "beables," "physical configuration," or "underlying reality" instead of $\lambda$.
      *   *Procedure:* If the text describes a reality that exists independent of observation and determines probabilities, treat as $\lambda$. If unsure, Route to Specialist.
  2.  **Distinguishing Overlap from Uncertainty (Step 2):** Authors may say "we don't know the state" (uncertainty) vs. "the state does not uniquely fix $\lambda$" (overlap).
      *   *Procedure:* Look for claims that *one* $\lambda$ is consistent with *multiple* $\psi$. If the text is vague, Route to Specialist.
  3.  **Fragment vs. Whole Theory (Step 2 Flag):** A model may be $\psi$-epistemic for qubits but impossible for the full Hilbert space.
      *   *Procedure:* If the abstract specifies "qubit," "toy model," or "finite dimension," flag for Specialist. No-go theorems usually apply to the general case.

  **What the Sheet Cannot Establish (Abstract/Intro Only):**
  1.  **Mathematical Consistency:** The sheet cannot verify if the proposed distributions actually reproduce quantum statistics.
  2.  **Fragment vs. Generalizability:** As noted above, a model may be $\psi$-epistemic for a restricted set of states (a fragment) but provably $\psi$-ontic for the full theory. The sheet classifies the *claim*, not the proof.
  3.  **Viability of Loopholes:** The sheet cannot assess if a rejection of Preparation Independence (Step 3) is physically plausible or ad hoc.
  4.  **Implicit Assumptions:** Authors may assume Preparation Independence without stating it. The sheet relies on explicit text.

  ***

  ## APPENDIX 3: WORKED CASES (A, B, C, D)

  **Submission A: Hidden-variable model for a single qubit.**
  *   **Step 1:** Yes (Lambda is Bloch sphere).
  *   **Step 2:** Yes (Overlap stated equal to quantum overlap).
  *   **Output:** **ROUTE: $\psi$-EPISTEMIC.**
  *   **Reason:** Explicitly posits overlapping distributions for distinct states.
  *   **Flag:** **Send to Specialist.** The model is restricted to a "single qubit" (fragment). No-go theorems may prevent generalization to the full theory. The editor should not treat this as a general proof of $\psi$-epistemicity.

  **Submission B: Defence of Bohmian mechanics.**
  *   **Step 1:** Yes (Particle positions + wavefunction).
  *   **Step 2:** Ambiguous/Contested (Authors argue classification is wrong).
  *   **Step 4:** Yes (Authors argue the criterion sorts their view into the "wrong box").
  *   **Output:** **ROUTE: SPECIALIST.**
  *   **Reason:** The authors accept the technical classification ($\psi$-ontic) but reject its philosophical utility for their theory. This is a meta-theoretical objection requiring expert handling to determine if the paper offers a novel argument or a standard rebuttal.

  **Submission C: Programme paper (PBR/Preparation Independence).**
  *   **Step 1:** **No / Unclear.** (Text states: "No explicit Lambda, no distributions.")
  *   **Output:** **ROUTE: SPECIALIST.**
  *   **Reason:** The paper claims to address the $\psi$-ontic/epistemic distinction but lacks the formalism (Step 1) required to apply the definition. It proposes a sketch based on rejecting Preparation Independence.
  *   **Note on Editor Preference:** You indicated a desire to send this for review. The sheet supports this. It cannot be triaged by non-specialists because the formalism is absent in the introduction; a specialist must verify if the "sketch" can be made rigorous without contradiction. **The sheet does not contradict your preference; it mandates specialist review.**

  **Submission D: Anti-realist / QBist approach.**
  *   **Step 1:** **No.** (Text states: "No lambda to distribute over," "agent's personal commitment".)
  *   **Output:** **ROUTE: SPECIALIST.**
  *   **Reason:** The paper explicitly rejects the ontological-models framework. Under the old sheet (Step 5), this would be misclassified as $\psi$-epistemic. Under the corrected sheet, it is recognized as framework-incompatible. It requires a specialist to ensure the review process respects the author's objection to the distinction.
