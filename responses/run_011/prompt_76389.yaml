answer: |-
  ### Desiderata for Epistemic Justification of Panel Enlargement

  To evaluate whether the Condorcet Jury Theorem (CJT) or any similar mathematical result justifies expanding your disciplinary panel, we must distinguish between the *mathematics* (which is valid in the abstract) and the *application* (which depends on whether reality matches the math). The following table specifies the requirements a result must meet to serve as a valid justification in your specific context.

  I have categorized each requirement by whether it constrains the **Assumptions** (the premises of the theorem), the **Conclusion** (the mathematical output), or the **Inference** (the step from math to policy). I have also integrated your specific concerns, noting where a preference might have been mistaken for a requirement (see the analysis following the table).

  | # | Requirement | Category | Motivation & Consideration | Concrete Failure Case |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Truth Aptness** | Assumption | The theorem maximizes the probability of selecting the *true* state of the world. This requires that a unique, objective truth exists independent of the vote. | If the question is "Is this punishment *fair*?" there is no objective fact to be right about. Applying CJT to normative judgments is a category error; the "correct verdict" is undefined. |
  | **2** | **Epistemic Grounding of Competence** | Assumption | The theorem requires each member to have a probability $p > 0.5$ of being correct. This $p$ cannot be derived from the past success of majority votes (circularity). | If you estimate teacher competence by looking at past panel rulings, you assume those past rulings were correct. If the past panels were flawed, your $p$ is inflated, and the theorem's guarantee vanishes. |
  | **3** | **Finite Monotonicity** | Conclusion | The result must guarantee improved reliability at $n=11$, not just as $n \to \infty$. An asymptotic limit is useless if reliability dips before it rises. | Some variations of jury theorems show that adding voters *decreases* reliability initially if competence is low or correlation is high, even if it improves eventually at $n=1000$. |
  | **4** | **Conditional Independence** | Assumption | Votes must be independent *conditional on the truth*. Members cannot influence each other or rely on the same flawed signal. | All members read the same incident report. If the report omits key exculpatory evidence, *all* members are likely to vote "guilty." Their votes are correlated, not independent. CJT collapses. |
  | **5** | **Composability** | Inference | The justification must hold for the specific aggregation structure (three factual questions leading to a penalty), not just a single binary vote. | This is the **Discursive Dilemma**. A majority might say "Yes" to Act, "Yes" to Rule, and "No" to Understanding, while a different majority says "Guilty" overall. Majority rule on parts $\neq$ Majority rule on whole. |
  | **6** | **Loss Function Alignment** | Inference | The theorem minimizes *error rate*. Policy must minimize *cost of error*. These are only identical if false positives and false negatives cost the same. | Wrongly expelling a student (False Positive) is arguably worse than wrongly clearing them (False Negative). A panel optimized for accuracy might still be optimized for injustice if it doesn't weight errors asymmetrically. |
  | **7** | **Incentive Compatibility** | Assumption | Members must vote for what they believe is true, not what they think will win or what benefits them socially. | If students feel voting "Guilty" makes them look responsible to teachers, they may vote against their private judgment. The theorem assumes sincere voting based on private information. |
  | **8** | **Mapping Clarity** | Inference | There must be a clear distinction between the theorem's variables and the committee's reality (Assumptions vs. Conclusion vs. Policy). | Confusing the *mathematical conclusion* (probability of majority correctness) with the *policy license* (therefore we should expand) ignores the cost/competence/independence gaps. |

  #### Clarifications on Your List
  You asked to be told where you may have treated a preference as a requirement or listed something twice.

  1.  **Assumptions vs. Conclusion vs. Inference:** You correctly identified this distinction. In the table, I have explicitly categorized them. Much of the administration's argument fails at the **Inference** stage: they assume that because the *Conclusion* (larger panels are more reliable) is mathematically possible, the *Inference* (therefore this panel will be more reliable) follows automatically. It does not, unless the **Assumptions** hold.
  2.  **Asymmetric Costs:** You listed this as a concern. In strict epistemic terms, this is not a requirement for the *theorem* to be true, but it is a requirement for the theorem to be *relevant*. If the goal is Justice (minimizing harm) rather than Truth (minimizing error count), CJT is the wrong metric. I have included this as **Loss Function Alignment**.
  3.  **Exactly Eleven vs. Asymptotic:** You asked if an asymptotic claim suffices. It does not. A theorem that says "reliability approaches 1 as $n \to \infty$" allows for reliability to *drop* between $n=3$ and $n=11$. I have codified this as **Finite Monotonicity**.
  4.  **Existence of Truth:** You asked if there must be a fact of the matter. Yes. If the verdict is a matter of discretion (e.g., "was the punishment proportional?"), CJT is inapplicable. I have codified this as **Truth Aptness**.

  ---

  ### The "Killer" Requirement

  If you insist on a single requirement from the list above, the one that eliminates the largest number of otherwise attractive epistemic results (including the plain Condorcet Jury Theorem) is:

  **Requirement #4: Conditional Independence.**

  **Reasoning:**
  The mathematical engine of the Condorcet Jury Theorem relies on the law of large numbers. Errors cancel out only if they are random and uncorrelated. In a school disciplinary setting, independence is structurally impossible to satisfy.
  1.  **Common Evidence:** All panelists read the same incident report. If the report is biased, all panelists are biased in the same direction.
  2.  **Deliberation:** Committees usually discuss the case. If teachers discuss before voting, their votes are no longer independent samples; they become echoes of the most persuasive speaker.
  3.  **Hierarchy:** Students may defer to teachers. If four students vote based on how the seven teachers lean, you do not have 11 voters; you have 7 voters and 4 amplifiers.

  When votes are correlated, the "wisdom of crowds" effect vanishes. A panel of 11 correlated voters is often epistemically equivalent to a panel of 3, or worse, because the correlation creates a false sense of confidence without adding new information. Most "repairs" to the CJT attempt to relax this assumption, but they invariably show that even small amounts of correlation drastically reduce the benefit of adding voters. Insisting on this requirement renders the plain CJT useless for your context.

  ---

  ### Incompatible Requirements

  There is a fundamental tension between two requirements on the list:

  **The Pair:** **Requirement #4 (Conditional Independence)** and **Requirement #2 (Epistemic Grounding of Competence).**

  **The Conflict:**
  To ensure **Competence** ($p > 0.5$), panelists need information. In a school setting, the primary source of information is the incident report and the administration's briefing. To ensure everyone is competent, you must ensure everyone reads the same materials and understands the rules. However, sharing the same materials creates a **Common Signal**, which violates **Independence**.
  *   If they *don't* share information (to preserve independence), their competence ($p$) may drop below 0.5 because they are guessing.
  *   If they *do* share information (to ensure competence), their votes become correlated, and the CJT guarantee fails.

  **Resolution:**
  This does not mean the project of justifying the larger panel fails outright; it means **CJT is the wrong justification**.
  The incompatibility suggests that you cannot justify the panel expansion on *purely statistical epistemic grounds* (i.e., "more voters = more truth"). Instead, the justification must shift to **Representative Legitimacy** (students deserve a voice in their judgment) or **Procedural Justice** (the process feels fairer), rather than **Epistemic Reliability** (the verdict is mathematically more likely to be true). One of the two was never a real requirement for a *legitimate* committee, even if it is a requirement for a *Condorcet* committee: **Conditional Independence** is the unrealistic constraint in a deliberative body.

  ---

  ### Evaluation of Theorems Against the List

  Here is how the plain theorem and its principal variants fare against the desiderata.

  **1. The Plain Condorcet Jury Theorem**
  *   **Performance:** Fails **Conditional Independence** and **Finite Monotonicity**.
  *   **Analysis:** It assumes voters decide in isolation based on private signals. In your committee, members share a report and likely discuss. It also only guarantees reliability as $n \to \infty$; it does not guarantee that moving from 3 to 11 helps, especially if student competence is unknown. It treats all errors equally, failing **Loss Function Alignment**.

  **2. Correlated Voting Models (e.g., Ladha 1992)**
  *   **Performance:** Addresses **Conditional Independence** but yields a negative result.
  *   **Analysis:** These models explicitly calculate how correlation reduces reliability. They demonstrate that with the degree of shared information present in a school committee (high correlation), adding members provides diminishing or negative returns. This supports your skepticism: it shows mathematically why the administration's argument fails in this specific context.

  **3. Weighted Voting / Asymmetric Loss Models**
  *   **Performance:** Addresses **Loss Function Alignment** and **Competence**.
  *   **Analysis:** These models allow for different weights (e.g., teachers' votes count more on rule interpretation, students' on peer context) or different thresholds for conviction (e.g., requiring 8/11 votes to expel rather than 6/11). This addresses the **Asymmetric Costs** concern (making expulsion harder than acquittal). However, they still struggle with **Independence** and **Truth Aptness** if the underlying question is not purely factual.

  **Summary Recommendation for Your Draft:**
  You can concede that the Condorcet Jury Theorem is mathematically sound *in the abstract* (satisfying **Mapping Clarity**). However, you can argue that it fails to justify *this specific proposal* because the **Conditional Independence** assumption is violated by the shared incident report and committee structure. Furthermore, without independent evidence of student **Competence** ($p > 0.5$) on disciplinary facts, the theorem cannot guarantee that adding students improves accuracy. Finally, because the costs of error are **Asymmetric**, maximizing accuracy is not the same as maximizing justice. Therefore, the panel expansion should be justified on grounds of representation or fairness, not on the promise of mathematical certainty.
