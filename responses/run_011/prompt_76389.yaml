      *   **Problem:** Administration proposes expanding a 3-teacher panel to an 11-person panel (7 teachers, 4 students) based on the Condorcet Jury Theorem (CJT).
      *   **Goal:** The user is skeptical and wants a rigorous list of *desiderata* (requirements) that a mathematical result must meet to serve as an *epistemic justification* for this specific change.
      *   **Specific Instructions:**
          *   Specify requirements (assumptions, conclusions, inference steps).
          *   Address specific concerns raised by the user (source of competence premise, asymptotic vs. finite, independence/correlation, multi-stage voting, asymmetric costs, strategic voting, existence of truth).
          *   Identify redundancies or mistakes in the user's list.
          *   Identify the "killer" requirement (the one that eliminates the most results).
          *   Identify incompatible pairs of requirements.
          *   Evaluate the plain CJT and variants against the list.
          *   Provide full reasoning (no "see sources").
          *   Format: Table is okay if motivations are included.

  2.  **Deconstruct the Condorcet Jury Theorem (CJT):**
      *   *Core Claim:* If $n$ voters vote independently, each with probability $p > 0.5$ of being correct, the probability the majority is correct approaches 1 as $n \to \infty$.
      *   *Application to School:* Admin says "More people = better truth tracking."
      *   *User's Skepticism:* Valid. CJT relies on strong assumptions often violated in real-world committees.

  3.  **Drafting the Desiderata (Requirements):**
      *   I need to translate the user's specific concerns into formal mathematical/philosophical requirements for a theorem to be applicable.
      *   *Concern 1: Assumptions vs. Conclusion vs. Inference.* -> Requirement: **Applicability of Assumptions**. The real-world scenario must match the theorem's premises.
      *   *Concern 2: Source of Competence ($p > 0.5$).* -> Requirement: **Non-Circular Competence Estimation**. We can't use past majority votes to prove individual competence if we are using individual competence to justify majority votes.
      *   *Concern 3: Finite vs. Asymptotic.* -> Requirement: **Finite Sample Validity**. We have $n=11$, not infinity. The theorem must guarantee improvement at $n=11$, not just eventually.
      *   *Concern 4: Independence.* -> Requirement: **Robustness to Correlation**. Voters talk, read same reports, defer to authority. CJT fails if votes are correlated.
      *   *Concern 5: Multi-stage/Structure.* -> Requirement: **Aggregation Structure Compatibility**. The decision isn't one binary choice; it's a conjunctive chain (Fact A + Fact B + Fact C -> Penalty). Does CJT apply to the chain?
      *   *Concern 6: Asymmetric Costs.* -> Requirement: **Error Weight Sensitivity**. False Positive (expel innocent) $\neq$ False Negative (acquit guilty). CJT maximizes *accuracy*, not *utility*.
      *   *Concern 7: Strategic Voting.* -> Requirement: **Sincerity of Vote**. Are they voting truth or strategy? CJT assumes sincere voting based on private signal.
      *   *Concern 8: Existence of Truth.* -> Requirement: **Ontological Realism**. Is there a "correct" verdict independent of the vote? (e.g., "Did he do it?" vs. "Is this punishment fair?").

      *Refining the List:* I need to make sure these are distinct and cover the user's points without redundancy.
      *   *User's Point:* "Whether a requirement concerns the result's assumptions, its conclusion, or the step from the conclusion..." -> This is a meta-requirement about *clarity*, not a requirement for the theorem itself. I should address this in the introduction or as a meta-criterion. Let's make it a requirement about **Mapping**: The mapping from mathematical variables to social reality must be explicit.
      *   *User's Point:* "Where the premise... is supposed to come from." -> **Epistemic Grounding of Competence**.
      *   *User's Point:* "Asymptotic vs. Exactly Eleven." -> **Monotonicity at Finite $n$**.
      *   *User's Point:* "Independence." -> **Conditional Independence**.
      *   *User's Point:* "Staged Procedure." -> **Composability**.
      *   *User's Point:* "Asymmetric Costs." -> **Loss Function Alignment**.
      *   *User's Point:* "Strategic Voting." -> **Incentive Compatibility**.
      *   *User's Point:* "Fact of the matter." -> **Truth Aptness**.

  4.  **Identifying the "Killer" Requirement:**
      *   Which one kills CJT the deadest?
      *   *Independence:* In a school setting, everyone reads the same report. Teachers know each other. Students defer. Correlation is high. If correlation is high, CJT collapses. This is usually the strongest practical objection.
      *   *Competence:* Hard to prove $p > 0.5$ for students on disciplinary matters.
      *   *Truth Aptness:* Disciplinary appeals often involve judgment calls, not just facts.
      *   *Decision:* **Conditional Independence** is usually the most fragile assumption in social settings. However, **Truth Aptness** is more fundamental. If there is no objective truth (e.g., "was the punishment *fair*?"), CJT is category error. But for "did he do it?", there is truth. Let's look at the "Asymmetric Costs." CJT maximizes probability of *correct* verdict. If the cost of error is asymmetric, maximizing accuracy isn't the goal. But the prompt asks about *enlarging* the panel.
      *   *Re-evaluating:* The prompt asks what eliminates the *largest number of otherwise attractive results*. Most variations of CJT (Ladha's, etc.) try to fix Independence. But if **Truth Aptness** fails, *no* epistemic democracy theorem works. However, in disciplinary hearings, "truth" is usually assumed (did the violation occur?).
      *   *Strongest Candidate:* **Conditional Independence**. Almost all social choice epistemic results crumble when voters share a common signal (the incident report). This is the "Common Signal Problem."
      *   *Alternative:* **Competence ($p > 0.5$)**. If students are *less* than 50% competent, adding them hurts.
      *   *Selection:* I will argue that **Conditional Independence** is the killer because it is the most commonly violated assumption in deliberative bodies that share information, and relaxing it usually destroys the "larger is better" conclusion.

  5.  **Identifying Incompatible Pairs:**
      *   *Independence vs. Deliberation:* To be independent, they shouldn't talk. To be a committee, they should discuss.
      *   *Truth Aptness vs. Normative Judgment:* Some questions (fairness) aren't truth-apt.
      *   *Selection:* **Independence vs. Shared Information/Deliberation**. You cannot have high independence *and* a committee that reads the same report and discusses.
      *   *Resolution:* This doesn't mean the project fails, it means the *justification* (CJT) is the wrong tool. The requirement of Independence was the unrealistic one for this context.

  6.  **Evaluating CJT and Variants:**
      *   *Plain CJT:* Fails Independence, Fails Finite (maybe), Fails Competence proof.
      *   *Correlated Voting Models (e.g., Ladha):* Shows correlation kills the benefit.
      *   *Weighted Voting:* Might help with competence/costs, but doesn't fix independence.
      *   *Bayesian Updating:* Accounts for shared signals, but often shows diminishing returns.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the query. Set the stage (Epistemic Social Choice).
      *   **The Desiderata (Table):** Columns: Requirement, Motivation/Consideration, Failure Case. Ensure all user points are integrated.
      *   **Meta-Analysis:** Address the "Assumption/Conclusion/Inference" distinction.
      *   **The Killer Requirement:** Identify Conditional Independence.
      *   **Incompatible Pairs:** Independence vs. Shared Evidence.
      *   **Evaluation of Theorems:** Plain CJT, Correlated CJT, Weighted/Asymmetric models.
      *   **Conclusion:** Brief wrap-up.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I address the "circularity" of competence? Yes, under Epistemic Grounding.
      *   *Check:* Did I address the "staged" nature? Yes, under Composability/Aggregation Structure.
      *   *Check:* Did I address the "asymmetric costs"? Yes, under Loss Function Alignment.
      *   *Check:* Did I address the "fact of the matter"? Yes, under Truth Aptness.
      *   *Nuance:* The user asked to distinguish between assumptions, conclusions, and inference steps. I should explicitly categorize the requirements this way in the table or intro. Let's categorize them in the table for clarity.
      *   *Nuance:* The user asked to flag if they treated a preference as a requirement.
          *   *Preference:* "Asymmetric costs." Mathematically, CJT is about truth, not utility. If the goal is *justice* (utility), CJT is the wrong metric. I need to point out that if the goal is purely epistemic (truth), costs don't matter. But for *disciplinary* action, costs matter. So it *is* a requirement for *this* justification.
          *   *Preference:* "Exactly eleven." Asymptotic results are useless for $n=11$. This is a valid requirement.
      *   *Killer Requirement:* I need to be careful. Is it Independence or Competence? If $p < 0.5$, CJT says majority gets *worse*. If we add students who might be less informed ($p < 0.5$), the theorem argues *against* the proposal. This is a very strong argument. However, Independence is structurally impossible given the "read the same report" constraint. I will select **Conditional Independence** as the primary killer because it invalidates the *mechanism* of the theorem even if competence is high. But I will note that **Competence** is the most dangerous for the specific proposal (adding students). Actually, the prompt asks what eliminates the *largest number of otherwise attractive results*. Many variants try to fix Independence. But if **Truth Aptness** fails, *none* work. Let's stick with **Conditional Independence** as the most technical "killer" of the *mathematical mechanism*, but acknowledge **Truth Aptness** as the philosophical precondition. I'll choose **Conditional Independence** because it's the specific mathematical lever CJT pulls that breaks in committees.
      *   *Wait, re-reading:* "Which single requirement, if I insist on it, eliminates the largest number of otherwise attractive results?"
      *   If I insist on **Conditional Independence**, almost all real-world applications of CJT fail. This fits the description.
      *   *Incompatible Pair:* **Independence** and **Deliberation/Shared Information**. A committee *must* share information to be competent, but sharing information destroys independence.
      *   *Resolution:* This implies the *project of justifying via CJT* fails, not necessarily that the panel change is bad. It just means CJT isn't the reason.

  9.  **Final Polish:** Ensure tone is respectful, rigorous, and suitable for a high school junior writing a formal recommendation (intellectual but accessible). Ensure no external citations are needed to understand the logic.

  *(Self-Correction on "Staged Procedure"):* The user mentions three questions of fact. This is a "conjunctive" aggregation. If the panel gets the majority right on each, does it get the final outcome right? This is the "Doctrinal Paradox" or "Discursive Dilemma." I should mention this under Composability.

  *(Self-Correction on "Circularity"):* Estimating $p$ from past panel verdicts assumes the past panels were right. That's circular. I need to make sure this is clear in the "Epistemic Grounding" requirement.

