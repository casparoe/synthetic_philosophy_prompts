      *   **Goal:** Prepare a Q&A sheet with 7-8 objections, ordered by damage to the thesis, phrased by subfield, with 2-minute replies and "thin spots." Also, identify which objection to concede early, which reply *must* land, and the "hope nobody asks" question.

  2.  **Deconstruct the Thesis & Identify Vulnerabilities:**
      *   *Vulnerability 1 (The "So What?" of G-S):* If strategy-proofness is impossible, why not just minimize manipulation? (The core of the thesis).
      *   *Vulnerability 2 (The "Manipulation Budget"):* How do you define/calculate this? Is it computable? Does it depend on information assumptions?
      *   *Vulnerability 3 (Normative Weight):* Even rare manipulation can be decisive (swing states, close elections). Binary vs. Continuous.
      *   *Vulnerability 4 (Information Assumptions):* G-S assumes full information. Real voters don't have it. Does the budget account for this?
      *   *Vulnerability 5 (The "Reformers" Angle):* If you tell reformers manipulation is okay-ish, does that undermine the push for RCV over Plurality?
      *   *Vulnerability 6 (The "Economist" Angle):* Mechanism design relies on dominant strategies for implementation. If you remove that, do you lose equilibrium predictions?
      *   *Vulnerability 7 (The "CompSci" Angle):* Computing the manipulation budget might be NP-hard. You can't manage what you can't measure.
