      *   *Objection 5 (Normative):* Fairness vs. Efficiency. Manipulation is cheating. Tolerating it is normatively dubious. *Damage: Medium.*
      *   *Objection 6 (The "Escape Clauses"):* You say design happens in escape clauses. But RCV isn't single-peaked. So G-S still applies strictly. *Damage: Low-Medium.*
      *   *Objection 7 (Threshold Arbitrariness):* Who sets the budget? 5%? 10%? It's political, not technical. *Damage: High (undermines the "engineering" analogy).*
