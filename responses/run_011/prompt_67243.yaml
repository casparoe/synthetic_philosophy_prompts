answer: |-
  Here is your Q&A sheet, calibrated for the specific friction points in that room. The objections are ordered by the structural damage they inflict on your "demotion thesis," starting with the ones that threaten to make your central metric incoherent or unusable.

  ### 1. The Computational Objection (The Computational Social Choice Person)
  **The Objection:** "You propose replacing a binary property with a continuous metric, the 'manipulation budget.' But Gibbard–Satterthwaite is a worst-case impossibility. Your budget requires averaging over profiles. For most interesting rules (like RCV), determining if *a* manipulation exists for a given profile is NP-hard. You cannot manage a tolerance you cannot compute. Are you proposing we use heuristics to set building codes?"

  **The Reply:** "You are right that exact computation is intractable for large electorates. But engineering tolerances are rarely derived from first-principles physics for every building; they are based on stress tests and sampling. We don't need the exact budget; we need comparative statics. If System A has a manipulability estimate of 5% via Monte Carlo simulation and System B has 25%, the engineering decision is clear even if the exact number is fuzzy. The theorem gives us the worst-case bound; the budget gives us the expected load. We design for the expected load, reinforced by the worst-case bound."
  **Thin Spot:** You are hand-waving the difference between *estimating* complexity and *certifying* safety. If the estimation error is high, the "budget" is noise.

  ### 2. The Implementation Objection (The Mechanism Design Economists)
  **The Objection:** "Strategy-proofness isn't just a 'guarantee'; it's the condition that allows us to treat reported preferences as true preferences. If you demote it, you collapse the distinction between the mechanism and the game played around it. Without dominant strategies, you have no equilibrium selection. How do you predict outcomes if you admit the mechanism is manipulable?"

  **The Reply:** "In almost every real-world electoral system currently in use, strategy-proofness is already absent. We still make predictions. We do so by assuming bounded rationality or incomplete information. My thesis is that since *no* deterministic rule passes the SP test, insisting on it as a binary gatekeeper paralyzes design. We should model the manipulation game explicitly rather than pretending it doesn't exist because the rule failed a theoretical test. The 'budget' quantifies the exposure to that game."
  **Thin Spot:** You are admitting that your framework relies on behavioral assumptions (bounded rationality) that are messier than the standard economic model. They will press you on which equilibrium concept you use if not dominant strategy.

  ### 3. The Threshold Objection (The Political Scientists / Reformers)
  **The Objection:** "You treat the manipulation budget like an engineering tolerance, like stress limits on steel. But who sets the threshold? A 5% manipulation rate might be acceptable to a theorist, but if that 5% determines the winner in swing districts, it's a crisis. Isn't this just hiding a political value judgment behind a technical metric?"

  **The Reply:** "Exactly. That is my point. Currently, we hide the value judgment behind the impossibility theorem, saying 'nothing can be done.' I am arguing we should make the value judgment explicit. Is a 5% risk of manipulation worth the gain in representativity? That is a policy question, not a mathematical one. The theorem says you can't have zero risk; the budget lets us decide how much risk is democratic."
  **Thin Spot:** This concedes that your "engineering" analogy is metaphorical. If it's political, why do we need a new metric rather than just political debate?

  ### 4. The "Decisive Minority" Objection (The Political Scientists)
  **The Objection:** "You focus on the *share* of profiles where manipulation is possible. But elections aren't decided by the average profile. They are decided by close margins. A manipulation opportunity that exists only in 1% of profiles might exist in 100% of the profiles that actually determine the winner. Frequency doesn't map to impact."

  **The Reply:** "That is a crucial distinction between *manipulability* and *success rate.* My budget metric can be weighted by margin of victory. We aren't just counting profiles; we are counting *decisive* manipulations. However, even if the frequency is low, the *threat* of manipulation changes behavior. The budget measures the surface area of that threat. If the surface area is small, the strategic burden on voters is lower, even if the stakes are high."
  **Thin Spot:** You haven't actually solved the weighting problem. A low-frequency, high-impact manipulation is worse than a high-frequency, low-impact one. Your metric might obscure this.

  ### 5. The Information Objection (The Mechanism Design Economists)
  **The Objection:** "Gibbard–Satterthwaite assumes voters know the preferences of others. In reality, voters have incomplete information. A rule might be theoretically manipulable but practically strategy-proof because no one knows how to lie effectively. Doesn't your budget overstate the risk by assuming the theoretical capacity to manipulate equals the practical incentive?"

  **The Reply:** "The theorem licenses the *possibility*, not the probability. My budget is intended to measure the *vulnerability* of the system, not the realized manipulation. Think of it like a lock: a lock might be pickable (vulnerable) even if no burglar knows the combination (information). We want to install the lock that is hardest to pick, even if burglars are currently uninformed. The budget measures the lock's quality, not the burglar's skill."
  **Thin Spot:** If voters don't have the information to manipulate, the "vulnerability" is irrelevant to welfare. You might be optimizing for a threat that doesn't exist.

  ### 6. The Normative Objection (The Political Scientists)
  **The Objection:** "Reformers argue for RCV because it reduces 'wasted votes' and encourages consensus. If you tell them 'manipulation is just a budget item,' aren't you legitimizing strategic voting? Isn't there a normative difference between a system that *invites* gaming and one that *resists* it, even if neither is perfect?"

  **The Reply:** "There is a normative difference, but the current discourse treats the difference as binary: SP vs. Dictatorship. Since we can't have SP, we are forced to choose among manipulable rules. My framework allows us to rank them by *how much* they invite gaming. It doesn't legitimize gaming; it acknowledges that some systems make it harder than others. It shifts the norm from 'impossible ideal' to 'minimize harm.'"
  **Thin Spot:** Reformers want moral clarity. "Minimizing harm" sounds like technocratic cynicism compared to "protecting the vote."

  ### 7. The Dictatorship Reductio (The Mechanism Design Economists)
  **The Objection:** "The correspondence result you mention links strategy-proofness to Arrow's conditions. The only SP rules are dictatorial. If you 'budget' manipulability, are you also 'budgeting' dictatorship? Is a system 99% democratic and 1% dictatorial acceptable under your tolerance?"

  **The Reply:** "No, because dictatorship is a structural property, not a profile-dependent one. A dictator determines the outcome in *every* profile. Manipulation is profile-dependent. My budget measures the frequency of vulnerability across profiles. A dictatorial rule has a manipulation budget of zero (for the dictator) but fails the 'onto' or 'non-dictatorial' criteria entirely. We screen for dictatorship first, then budget for manipulation."
  **Thin Spot:** This relies on a clean separation between structural power and strategic opportunity that may not hold in weighted voting or complex districting.

  ### 8. The Domain Restriction Objection (The Political Scientists)
  **The Objection:** "You mention escape clauses like single-peakedness. But American urban politics aren't single-peaked. If the domain restriction doesn't hold, the theorem applies fully. Why should we care about the 'escape clauses' if they don't describe our reality?"

  **The Reply:** "Because institutional design *creates* the domain. Ballot access laws, party structures, and districting shape the preference profiles that emerge. We don't just take preferences as given; we structure the choice set. Designing for restricted domains is about structuring the political environment to make manipulation harder, not just assuming voters behave nicely."
  **Thin Spot:** This claims a lot of power for institutional design. Political scientists may be skeptical that you can engineer preference profiles via ballot structure.

  ***

  ### Strategic Guidance

  **1. The Concession (First 10 Minutes)**
  **Concede the Threshold Objection (#3).**
  Do not fight the claim that the "acceptable threshold" is political. Explicitly state in your introduction: *"The manipulation budget is not a technical fix that removes politics from design. It is a metric that makes the political trade-off explicit. Where we set the tolerance is a democratic choice, not a mathematical one."*
  **Why:** This disarms the Political Scientists who fear technocratic overreach. It frames you as an ally of reform who wants better data for their political arguments, not an economist trying to solve democracy with a formula. If you wait until Q&A to admit this, it looks like you were caught hiding a value judgment.

  **2. The Reply That Must Land**
  **The Implementation Objection (#2).**
  You must convince the Mechanism Designers that dropping Strategy-Proofness as a *binary requirement* does not mean dropping *incentive analysis*. If they believe your thesis implies "incentives don't matter," you lose the room's rigorous wing.
  **Key phrase to land:** *"We are not ignoring incentives; we are quantifying exposure. Strategy-proofness is a binary switch that is currently stuck on 'off' for every viable system. I am proposing we use a dimmer switch."*
  If this doesn't land, the economists will dismiss the talk as naive, and the political scientists will follow their lead.

  **3. The Question You Hope Nobody Asks**
  **"The Dictatorship Reductio" (#7).**
  Specifically, the follow-up: *"If the only way to get the manipulation budget to zero is dictatorship, and you argue we should minimize the budget, doesn't your logic imply we should move as close to dictatorship as our tolerance allows?"*
  **Why it's dangerous:** It attacks the coherence of your "demotion." If Strategy-Proofness is just a metric to be minimized, and Dictatorship is the global minimum, your optimization function points toward authoritarianism unless you introduce a hard constraint. But if you introduce a hard constraint (No Dictatorship), you admit there *is* a binary criterion that matters, which weakens the claim that *all* binary criteria should be demoted.
  **Preparation:** If asked, pivot hard to the distinction between *structural* constraints (Non-dictatorship) and *strategic* vulnerabilities (Manipulation). You must hold the line that Non-dictatorship is a precondition for the game, while Manipulation is a feature of the play.
