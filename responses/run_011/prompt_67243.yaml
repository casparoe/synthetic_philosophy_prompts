      *   *Must Land:* The Mechanism Designer reply. If I can't justify why we design without SP, the thesis dies. I need to argue that *no* real-world system has SP, so we design on secondary criteria anyway.
      *   *Hope Nobody Asks:* The Dictatorship question. If the only SP rule is dictatorial, does a "manipulation budget" imply we should accept a "little bit of dictatorship"? This collapses the distinction between manipulation and power structure.

  6.  **Refining the Tone:**
