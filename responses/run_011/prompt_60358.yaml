  **Closing Statement**

  The single generative divergence from which the rest of the dispute can be generated is the ontological status of wealth independent of value. Camp P assumes wealth is a trans-historical category of material abundance that capitalism阻碍s, whereas Camp V assumes wealth under capitalism is inextricably bound to value production and cannot be separated from it. This divergence is generative rather than merely characteristic because it dictates how each camp interprets the same textual evidence regarding automation. If wealth is trans-historical, then machinery releasing labour time is inherently progressive. If wealth is value-bound, then machinery releasing labour time undermines the system's foundation without guaranteeing liberation.

  Rows 2 and 4 of the table were largely about words all along. When Camp P spoke of abundance, it was reaching for the material precondition of freedom. When Camp V spoke of abolition, it was reaching for the social form required to access that freedom. Both camps desire a society where labour is not the measure of life, but they disagree on whether achieving this requires maximising the productive forces or dismantling the value form that drives them. Resolving the definition of wealth would render the distinction between forecasting abundance and diagnosing dissolution moot, as both would be seen as aspects of the same transition. Until then, the dispute remains substantive regarding the path, if not the destination.
