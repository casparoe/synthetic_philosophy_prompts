answer: |-
  ### Menu of Theses: "The Army is a School of the Nation"

  **1. The Direct Socialization Thesis**
  *   **Formulation:** The army functions as a pedagogical institution that instills civic dispositions and cross-class solidarity directly into the specific individuals who serve through shared hardship and discipline.
  *   **Classification:** Empirical (causal claim about the treatment effect of service on individual psychology and behavior).
  *   **Verdict:** Simply false in the context of a selective draft.
  *   **Required Evidence:** Longitudinal data comparing civic participation and social trust of conscripts against a control group of exempt peers, strictly controlling for pre-service motivation and aptitude to isolate the treatment effect from selection bias.

  **2. The Universal Liability Thesis**
  *   **Formulation:** The mere legal existence of universal conscription liability fosters a sense of shared fate and mutual obligation across the entire age cohort, regardless of who is actually called to serve.
  *   **Classification:** Expressive (symbolic claim about the political meaning of universal law).
  *   **Verdict:** Substantive but defensible.
  *   **Required Evidence:** Survey data measuring perceived social solidarity and trust in state institutions among populations with universal liability laws compared to similar populations without them, controlling for other welfare state variables.

  **3. The Diffusive Reserve Thesis**
  *   **Formulation:** Conscripts act as vectors who carry military norms into civilian workplaces and associations, creating a militia effect where civic culture scales with the cumulative size of the trained reserve rather than annual intake.
  *   **Classification:** Empirical (sociological claim about norm transmission networks).
  *   **Verdict:** Empirically untestable given how modern drafts are actually administered.
  *   **Required Evidence:** Network analysis tracing the flow of specific organizational norms from veterans to non-veterans in local councils and unions, requiring a reserve density high enough to be statistically distinguishable from noise.

  **4. The Risk-Legitimacy Thesis**
  *   **Formulation:** The state possesses the moral authority to impose lethal risk only if the legal liability for that risk is universally distributed across the body politic it claims to represent.
  *   **Classification:** Normative (conceptual claim about the conditions of political obligation and justified coercion).
  *   **Verdict:** Near-platitude that nobody disputes (within republican theory).
  *   **Required Evidence:** Philosophical consistency checks and historical analysis of public resistance to wars fought by professional forces versus those fought by conscript forces.

  ***

  ### Analysis of the Interlocutor's Moves

  **Mapping the Moves to the Theses**
  *   **Move 1 (Cost vs. Cohesion):** When your interlocutor argued that conscription repays the cost difference in "civic cohesion" and "cross-class solidarity," he was relying on **Thesis 1 (Direct Socialization)** and **Thesis 3 (Diffusive Reserve)**. These claims require a mass intake to function; cross-class solidarity cannot emerge if the selection process filters out specific classes or if the intake is too small to mix meaningfully.
  *   **Move 2 (Selectivity is Irrelevant):** When he argued that selectivity does not matter because the "school works on those who never put on the uniform," he abandoned Thesis 1 and 3 and retreated to **Thesis 2 (Universal Liability)**. This claim rests on the symbolic power of the law, not the sociological reality of the barracks.

  **Does the Second Move Rescue the First?**
  No. The second move quietly abandons the first.
  *   **The Contradiction:** Thesis 1 promises a *sociological output* (solidarity, cohesion) that requires physical mixing and shared experience among diverse groups. Thesis 2 promises a *symbolic output* (knowledge of liability) that requires only legal universality.
  *   **The Failure:** If the draft is highly selective (4% intake), Thesis 1 is empirically false because the "school" is no longer representative of the "nation." Switching to Thesis 2 saves the *principle* of conscription but forfeits the *benefit* your interlocutor originally promised. You cannot claim "cross-class solidarity" (Move 1) while simultaneously arguing that it does not matter who actually serves (Move 2). If the classes do not serve together, they are not solidified by the experience; if the liability is merely symbolic, it does not generate the "understanding of what defence demands" that Move 1 relied upon.

  **Conclusion for the Seminar**
  Your interlocutor conflated a **treatment effect** (which vanishes when service is selective) with a **selection effect** (which implies the army chooses the already-civic-minded) and a **symbolic effect** (which does not produce the material cohesion he promised). His second move rescues the *legitimacy* of the draft (Thesis 4) or its *symbolism* (Thesis 2), but it concedes that the draft no longer functions as a "school" in the sociological sense required to justify the cost inefficiency argued in his first move.
