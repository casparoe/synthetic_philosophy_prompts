  ## 6. PREDICTABLE FAILURES & FIXES

  **1. The Drafting Stall (The "Freedom" Trap)**
  *   **Failure:** Students try to write "The State guarantees freedom of religion" in Section 1.
  *   **Fix:** The Facilitator must immediately rule this *Out of Order*. Demand: "How does the clerk at the tax office know?" Force them to write "A form signed by..." or "A database entry..."
  *   **Prevention:** Repeat the "Operative Language Clause" warning at minute 25.

  **2. The US Reflex Reversion**
  *   **Failure:** Students argue that "State collection of tax" is inherently unconstitutional.
  *   **Fix:** Remind them they are in **Novaria**, not the US. Ask: "If you ban state collection, who collects? If the Church collects, do they have access to income data? How?" Force the machinery question.

  **3. The Case File Derailment**
  *   **Failure:** Students spend 15 minutes debating Case File 1, blowing the schedule.
  *   **Fix:** Use a visible timer. When time is up, the Facilitator declares the ruling based on the *majority view of the text*. If the text is silent, mark a Grievance immediately and move on. Do not allow "fixing the text" during Rounds.

  **4. Gaming the Recognition Criterion**
  *   **Failure:** A table defines "Religious Body" so narrowly (e.g., "Must exist for 100 years") that no new groups qualify, avoiding Case File 2.
  *   **Fix:** During Drafting, circulate and challenge: "If a group of 10,000 arrives tomorrow, does your text allow them to exist? If not, rewrite."

