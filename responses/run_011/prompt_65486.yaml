answer: |-
  Here is a teaching plan designed for your 180-minute seminar. It is structured to dismantle the three specific misconceptions through a sequenced argumentative arc, rather than a historical overview.

  ### 1. The Carrying Example: Police and Protocol

  **Selection:** **Apartment Hunting in an Unfamiliar City.**
  **Verdict:** Do not use the Haystack (binary outcome fails to capture quality variance) and do not use the CS Project directly (too technical for Psych/Econ, invites coding solutions). Apartment hunting is the robust lingua franca, *provided* you rig the constraints.

  **What the Example Must Exhibit:**
  *   **Sequential Search:** Options appear one by one; you cannot view all simultaneously.
  *   **Evaluation Cost:** Viewing an apartment costs time, money, and cognitive effort.
  *   **Unknown Distribution:** Students *cannot* assume they know the mean or variance of apartment quality in the city. This is critical. If they assume a known distribution, they will revert to Optimal Stopping Theory (Secretary Problem), which is optimization, not satisficing.
  *   **Multidimensional Attributes:** Rent, location, light, noise. No single utility metric is pre-calculated.

  **What the Example Must Conspicuously Lack:**
  *   **A Known Horizon:** They do not know how many apartments exist.
  *   **Recall:** Once rejected, an apartment is gone (prevents "I'll just pick the best later" maximizing).
  *   **A Fixed Utility Function:** The "goodness" of an apartment changes based on what they have seen so far (sets up adaptive aspiration).

  **Instruction to Class:** "For this session, you are forbidden from assuming you know the probability distribution of apartment quality. You are also forbidden from assuming you can calculate a precise utility score for any unit. You only know if it meets your current requirements."

  ### 2. The Two-Minute Bridge (From Bayesian/EUT)

  Do not start with "Simon rejected Expected Utility." Start with the *inputs* required for Expected Utility.

  **Script:** "Last week, we saw how a Bayesian agent updates probabilities to maximize expected utility. That model works beautifully when the agent knows the *map* of the problem—the available options, the probabilities of outcomes, and the utility of each. Today, we are going to walk into a room where the map is missing. We aren't asking how to choose the best option from a known set. We are asking how to *construct* a set of options when you don't know what's out there, and you run out of fuel while looking. We are moving from the logic of choice to the psychology of search."

  ### 3. The Explanatory Arc (Sequence and Dependencies)

  You must teach these components in this specific order. Reordering them allows the misconceptions to take root.

  **Phase 1: The Representation Limit (Minutes 10–40)**
  *   **Concept:** The agent cannot represent the full option set.
  *   **Activity:** Ask the CS/Econ students to write down the parameters required to run a maximization algorithm on the Apartment Hunt. They will list "Total Options (N)" or "Distribution of Quality." Cross these out on the board.
  *   **Pedagogical Goal:** Pre-empt the "Constrained Optimization" misconception. If the set is undefined, you cannot maximize over it. Maximization requires a defined domain; search *creates* the domain.
  *   **Misconception Headed Off:** *"You can always restate it as constrained optimization."* (Refutation: You cannot optimize over a null set or an undefined distribution.)

  **Phase 2: Aspiration Level and Adaptivity (Minutes 40–70)**
  *   **Concept:** Search stops when an option meets an aspiration level ($\alpha$). Crucially, $\alpha$ is not fixed; it adapts based on search experience.
  *   **Activity:** Simulation. "You see three terrible apartments. Do you keep your standards high?" (No, they lower). "You see three amazing ones immediately." (They raise).
  *   **Pedagogical Goal:** Pre-empt the "Personality Type" misconception. If $\alpha$ moves based on the environment, it is a *state*, not a *trait*.
  *   **Misconception Headed Off:** *"Satisficing is a personality type (Schwartz)."* (Refutation: The same person satisfices differently in a rich vs. poor market. It is a regulatory mechanism, not a character flaw.)

  **Phase 3: The Cost of Search and The Regress Worry (Minutes 70–100)**
  *   **Concept:** Search is costly.
  *   **The Pivot Point:** This is where you place the **Regress Worry**.
  *   **Argument:** The Econ/CS student will argue: "The agent should stop when Marginal Cost of Search = Marginal Expected Benefit."
  *   **The Kill:** Ask: "To calculate the Marginal Expected Benefit, what do you need to know?" (Answer: The probability of finding a better option). "How do you get that probability?" (Answer: By searching more). "So to decide whether to search, you must search?"
  *   **Pedagogical Goal:** This blocks the "Lazy Maximizing" reduction. If calculating the optimal stopping point requires the very computation you are trying to save, the optimization model enters infinite regress. Satisficing is not optimization with a price tag; it is a way to *avoid* the calculation that optimization demands.
  *   **Misconception Headed Off:** *"Satisficing is just lazy maximizing."* (Refutation: It is computationally impossible to be the 'lazy maximizer' because the cost calculation itself is unbounded.)

  **Phase 4: Procedural vs. Substantive Rationality (Minutes 100–130)**
  *   **Concept:** Substantive = Outcome is optimal given constraints. Procedural = The *process* of search is reasonable given cognitive limits.
  *   **Pedagogical Goal:** Solidify the theoretical shift. We are evaluating the *algorithm*, not just the *output*.
  *   **Misconception Headed Off:** *"Bounded rationality is what the heuristics people study."* (Clarification: Heuristics-and-Biases [next week] often focuses on where procedural rationality fails [errors]. Simon focuses on where it succeeds [adaptation]. This session is about the *definition* of rationality, next week is about the *deviations*.)

  **Phase 5: Environment Structure (Ecological Rationality) (Minutes 130–160)**
  *   **Concept:** A simple rule succeeds not because it is internally consistent, but because it matches the environment's structure (e.g., in a high-variance market, low aspiration is safer).
  *   **Placement Decision:** Include this, but **limit scope**. Do not teach Gigerenzer's "Fast and Frugal" toolkit (Take-the-Best, etc.). That belongs next week. Teach only Simon's insight: *Rationality is an interaction between agent and environment, not a property of the agent alone.*
  *   **Pedagogical Goal:** Prevent the "Arbitrary Aspiration" misconception. Aspiration isn't random; it's tuned to the environment.
  *   **Misconception Headed Off:** *"Aspiration levels are arbitrary, so nothing is being explained."* (Refutation: They are systematically adaptive to environmental feedback.)

  ### 4. Mapping the Misconceptions (When to Head Them Off)

  | Misconception | When it will arise | Where you must head it off | How to head it off |
  | :--- | :--- | :--- | :--- |
  | **"Constrained Optimization"** | Phase 1 (Representation) | **During Phase 1.** | Do not let them write $Max U(x) - C(s)$ on the board. Demand they define the domain of $x$. When they can't, the model fails. |
  | **"Personality Type"** | Phase 2 (Aspiration) | **During Phase 2.** | When a student says "I'm a maximizer," correct them: "You are a maximizer in low-cost markets and a satisficer in high-cost markets. It's a function, not a label." |
  | **"Lazy Maximizing"** | Phase 3 (Cost/Regress) | **During Phase 3.** | Use the Regress Argument. If they insist optimization is possible, ask for the cost of the optimization calculation itself. |
  | **"Arbitrary Aspiration"** | Phase 5 (Environment) | **During Phase 5.** | Show that fixed aspirations lead to starvation in poor markets or endless search in rich ones. Adaptivity is required for survival, not arbitrary. |

  ### 5. Ecological Rationality: Include or Sabotage?

  **Verdict:** **Include the *principle*, exclude the *toolkit*.**
  *   **Why Include:** You cannot explain why satisficing works without referencing the environment. If you don't, the "Lazy Maximizing" objection wins.
  *   **Why Limit:** Next week is Heuristics-and-Biases. If you teach the "Adaptive Toolbox" or "Fast and Frugal Heuristics" in depth, you rob the next lecturer of the contrast between Simon (optimism about bounds) and Kahneman/Tversky (pessimism about bounds).
  *   **Implementation:** In Phase 5, state clearly: "Simon argued that simple rules work because the environment has structure. *Which* rules work best is the subject of next week's seminar on Heuristics. Today, we only establish *why* we need rules other than optimization."

  ### 6. The Final Five Minutes: The Assessment Question

  Do not ask "What is satisficing?" Ask a question that forces them to distinguish between *stopping due to cost* (optimization) and *stopping due to representation* (satisficing).

  **The Question:**
  "Imagine two agents searching for the same apartment. Agent A stops because the cost of viewing the next apartment is higher than the expected rent savings. Agent B stops because they found an apartment that meets their current needs, and they have no method to estimate the expected rent savings of the next unit. Which agent is satisficing, and why does the distinction matter for how we model their brain?"

  **Desired Answer Pattern:**
  *   **Superficial Understanding:** "Agent A is satisficing because they stopped early." (Incorrect: Agent A is optimizing net of cost).
  *   **Deep Understanding:** "Agent B is satisficing. Agent A is still running an optimization model (marginal analysis). Agent B acknowledges the *representation limit*—they cannot calculate the expected savings. The distinction matters because Agent A needs a probability distribution, while Agent B needs a rule for adjusting aspiration based on feedback."

  ### 7. What to Openly Refuse to Cover

  Announce these exclusions explicitly at the start or when they arise to prevent "scope creep" arguments.

  1.  **Barry Schwartz's "Paradox of Choice":** "We are not discussing the emotional regret of maximizing vs. satisficing. That is pop-psychology. We are discussing the computational structure of the search."
  2.  **Neural Implementation:** "We are not discussing how the brain encodes aspiration levels. That is cognitive neuroscience, not decision theory."
  3.  **Specific Heuristic Toolkits:** "We are not listing specific heuristics like 'Take-the-Best.' That is for next week. Today is about the *stopping rule*, not the *evaluation rule*."
  4.  **Global Optimization Proofs:** "We are not proving whether satisficing converges to the global optimum over infinite time. We are modeling finite agents in finite time."

  ### 8. Summary of Dependencies (The "Cost of Reordering")

  *   If you teach **Cost of Search** before **Representation Limit**, the Econ students will successfully model it as Optimization under Constraints. You must establish the *unknown domain* first.
  *   If you teach **Adaptivity** before **Aspiration**, students will view aspiration as a fixed threshold (Personality Type).
  *   If you teach **Environment Structure** before **Regress**, students will think simple rules work just because the world is easy, not because optimization is computationally impossible.
  *   If you teach **Ecological Rationality** too deeply, you blur the line with next week's Heuristics module.

  This plan forces the students to confront the computational impossibility of optimization *before* they are offered satisficing as a solution, ensuring they see it as a necessity rather than a concession.
