  ok so I'm doing my EPQ on whether the language you speak changes how you think, and I've been going through all the famous examples trying to work out which ones I actually buy. My verdicts are a proper mess and I want to know what principle, if any, sits behind them. Please write the answer in American English, even though I don't.

