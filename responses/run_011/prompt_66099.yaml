answer: |-
  In the Republic of Veridia, the former authoritarian regime passed the Civil Transaction Integrity Act (CTIA). To prevent fraud, the CTIA required every property deed and marriage license to receive a "State Validation Seal" from the Bureau of Civic Order. For the majority population, the Seal was a routine stamp. For the Kelm minority, however, Bureau officials routinely withheld the Seal for months or years on vague grounds of "cultural incompatibility," delaying weddings and freezing assets—a humiliating and costly burden, though not life-threatening. Meanwhile, millions of ordinary transactions between majority citizens relied entirely on the Bureau's authority to convey legal title.

  Following the regime's collapse, a Kelm plaintiff brings a test case arguing the CTIA was so fundamentally unjust it never qualified as law. If the court agrees, the CTIA is void *ab initio*. Because the Bureau derived its existence solely from the CTIA, the Bureau never legally existed. Consequently, every Seal it issued is null, rendering millions of majority-owned properties legally unregistered and thousands of marriages technically void. If the court disagrees and treats the CTIA as valid law, it can rule the discriminatory withholding illegal while preserving the Bureau's past acts, securing the titles of the innocent majority while ordering compensation for the Kelms.

  ***

  **The Work**

  **The Positivist (Hart-style):** The court should acknowledge the CTIA was validly enacted according to the system's rules of recognition at the time. It was law, however morally odious in application. The court upholds the validity of the Bureau's past acts to preserve legal certainty for the millions of citizens who relied on them. The injustice against the Kelms is remedied through new, retroactive legislation that compensates them and validates their unsealed transactions. This separates the question of *validity* from the question of *justice*, allowing the society to fix the wrong without collapsing the right.

  **The Natural Lawyer (Fuller-style):** The court should declare the CTIA null because it violated the inner morality of law—specifically the principle of generality. By administering the law selectively based on ethnicity, the regime failed to guide conduct by rules, rendering the CTIA non-law. Since the statute is void, the Bureau lacked legal authority from day one. All acts performed under its color are legally nonexistent. The court prioritizes moral coherence over social convenience; to call the CTIA "law" is to legitimize a system that betrayed the very concept of legality.

  **Where They Diverge:** The positivist verdict leaves the Kelms waiting for legislative compensation but keeps the country's property market and family law intact. The natural law verdict gives the Kelms immediate moral vindication but triggers a cascade of legal chaos: banks foreclose on "unregistered" homes, children are rendered illegitimate, and the new democracy inherits a vacuum of title. The natural law move, intended to purge injustice, inadvertently punishes the ordinary citizens who were not the oppressors.

  **The Single Feature:** *Constitutive Entanglement.* The discriminatory rule is not a standalone penalty (like a fine) but the foundational key that locks validity for *all* transactions, innocent and guilty alike. You cannot remove the key without unlocking every door in the building.

  **Cranking the Iniquity:** If you crank the iniquity up to extermination (e.g., the Seal was a pretext for confiscation and deportation), the chaos becomes an acceptable cost of justice; the Radbruch threshold is crossed, and the natural law verdict collapses back into the German informer intuition. If you crank it down to a trivial administrative fee, no one argues the law is void, and the positivist view wins by default. The "middling" zone is the only place where the trade-off bites.

  **The Natural Law Attack:** A sophisticated natural lawyer will call this a strawman. They would argue that declaring a statute "not law" does not logically compel the court to void every administrative act performed under it. Fuller himself advocated for remedies that restore the integrity of the system, not necessarily annihilate it. They would claim a natural law court could sever the discriminatory application while preserving the valid transactions, arguing that the *abuse* of the law was non-legal, not the *structure* itself. They are right that "nullity" is a doctrinal choice, not a metaphysical necessity; your argument holds only if the legal culture treats constitutional invalidity as retroactive total erasure, which is common in civil law transitions but not inevitable.
