answer: |-
  # Relational Role Mapping (RRM) Protocol
  **Version 1.0 | Clinical Ethics Consultation Service**
  **Time Allocation:** 90 Minutes | **Users:** Ethics Committee Members (No Chair Required)

  ## Purpose
  To resolve ethical conflicts by mapping the network of care obligations surrounding the patient, assessing the quality of role enactment, and aligning medical decisions with the relational reality of the family unit, within the bounds of law and institutional policy.

  ## The Instrument: Six Steps

  ### Step 1: Map the Care Network (The "Who")
  *   **Question:** "Who is doing the work of care, and who claims the authority of decision?"
  *   **Who Answers:** Primary Nurse, Social Worker, Chart (Contact List).
  *   **Sufficient Answer:** A list of names with specific functions (e.g., "Daughter: meds, bathing, transport"; "Son: financial, visits monthly"; "Niece: emotional support"). Do not accept "Next of Kin" as a function.
  *   **Hand-off:** Passes the list of actors to Step 2.
  *   **Neutrality Check:** Do not ask "What are your duties?" Ask "What do you actually do?" This allows any cultural or personal definition of role to surface without imposing a specific tradition.

  ### Step 2: Assess Role Enactment (The "How Well")
  *   **Question:** "Is the care being provided consistent with the claimed relationship?"
  *   **Who Answers:** Primary Nurse, Home Health Records, Committee Observation.
  *   **Sufficient Answer:** Evidence of presence, knowledge of patient preferences, and consistency. A "badly borne" role is documented by absence, neglect, or contradiction of known patient values.
  *   **Hand-off:** Identifies which roles are "strong" (enacted well) and which are "weak" (enacted poorly or nominally).
  *   **Safeguard (Oppression Screen):** If a role requires self-harm, abuse of others, or servitude without consent (e.g., "Daughter-in-law must quit job to care"), flag for Social Work intervention. *Note: This safeguard is imported from human rights frameworks, as role ethics alone cannot critique oppressive structures.*

  ### Step 3: Rectification of Names (The "Title vs. Function")
  *   **Question:** "Does the legal title match the relational reality?"
  *   **Who Answers:** Committee (Reviewing Step 1 & 2 data against Chart/Law).
  *   **Sufficient Answer:** A statement of alignment or misalignment. (e.g., "Legal Surrogate: Son. Functional Surrogate: Daughter.")
  *   **Hand-off:** If misaligned, the Functional Surrogate gains *moral* standing for recommendation, even if Legal Surrogate retains *authority*.
  *   **Handling Conflicting Roles:** If one person holds two roles (e.g., Nurse/Daughter), ask: "Which role is driving this request?" If the professional role is compromised by the family role, recusal is required. If the family role is being suppressed by institutional rigidity, accommodation is considered.

  ### Step 4: The Hierarchy of Obligations (The "Root and Branch")
  *   **Question:** "If roles conflict, which obligation sustains the network and which is peripheral?"
  *   **Who Answers:** Committee (Deliberation).
  *   **Sufficient Answer:** Identification of the "Root Role" (usually the primary, long-term caregiver or dependent relationship) vs. "Branch Role" (secondary, temporary, or distant).
  *   **Hand-off:** Prioritizes the preservation of the Root Role in the recommendation.
  *   **Constraint:** This hierarchy applies *only* to family/private obligations. It does not apply to staff allocation or resource distribution (see Step 6).

  ### Step 5: The Jurisdiction Boundary (The "Hard Stop")
  *   **Question:** "Does this role-based recommendation violate state law, institutional policy, or the rights of a competent patient?"
  *   **Who Answers:** Risk-Management Attorney, Committee Chair (if available), or Senior Physician.
  *   **Sufficient Answer:** A binary "Clear" or "Blocked."
  *   **Hand-off:**
      *   If **Blocked**: The procedure terminates. The decision defaults to Law/Policy/Competent Patient. The Committee's role shifts to *mediating the implementation* to minimize relational damage.
      *   If **Clear**: Proceed to Step 6.
  *   **Explicit Exclusions:** Role obligations may never determine:
      1.  Allocation of scarce resources (beds, organs, staff time).
      2.  Safety standards (infection control, medication safety).
      3.  Overrides of a competent patient's expressed refusal.
      4.  Protection of illegal activity.

  ### Step 6: Recommendation and Ritual Repair
  *   **Question:** "How do we enact the decision in a way that acknowledges the roles identified?"
  *   **Who Answers:** Committee.
  *   **Sufficient Answer:** A plan that specifies *who* speaks to *whom*, acknowledging the care history. (e.g., "Physician discloses prognosis to Daughter first, to allow her to prepare Father," IF legal).
  *   **Hand-off:** Written note in chart.

  ---

  ## Case Runs

  ### Case 1: The Protected Father (Metastatic Pancreatic Cancer)
  *   **Facts:** 78M, alert. Children (daily caregivers) request nondisclosure. Patient asking nurse "Is it bad?" Law/Policy = Disclosure.
  *   **Step 1 (Map):** Children = Functional Caregivers. Patient = Recipient.
  *   **Step 2 (Enactment):** Children = Strong (protective). Patient = Vulnerable.
  *   **Step 3 (Rectify):** Patient is competent. Legal authority = Patient. Functional influence = Children.
  *   **Step 4 (Hierarchy):** Patient's role as "Self-Determiner" is Root. Children's role as "Protectors" is Branch.
  *   **Step 5 (Boundary):** **BLOCKED.** State law and consent policy mandate disclosure to competent patient. Role ethics cannot override autonomy here.
  *   **Step 6 (Recommendation):** Disclose prognosis to patient. **However**, acknowledge the children's role.
      *   *Action:* Physician meets with children first. Acknowledges their care ("You have protected him well"). Explains legal/ethical requirement to tell him. Asks them to be present for the disclosure to support him.
      *   *Attorney Say:* "Ensure documentation shows patient consented to discussion. Do not promise secrecy."
      *   *Chair Say:* "This uses the ritual of inclusion to honor the children's role without breaking the law."

  ### Case 2: The Absent Son vs. The Caregiver Daughter (Advanced Dementia)
  *   **Facts:** 64F, no directive. Son (Legal Default) absent 20 years. Daughter (POA contested) caregiver 9 years. Son wants "everything"; Daughter wants hospice.
  *   **Step 1 (Map):** Daughter = Functional Surrogate (9 years care). Son = Legal Surrogate (Statutory), Functional Absentee.
  *   **Step 2 (Enactment):** Daughter = Strong (knowledge of values, presence). Son = Failed (absence, conflicting values).
  *   **Step 3 (Rectify):** **Misalignment.** Title (Son) does not match Function (Decision-Maker).
  *   **Step 4 (Hierarchy):** Daughter's role is Root (sustains life/care). Son's role is Branch (distant).
  *   **Step 5 (Boundary):** **BLOCKED (Legally).** State law prioritizes the Son unless POA is validated or Guardianship changed.
      *   *Uncomfortable Recommendation:* The Procedure recommends the hospital **provisionally treats the Daughter as the primary voice** and delays the Son's "everything" orders pending legal resolution, citing "Best Interest" grounded in relational history.
      *   *Attorney Say:* "Absolutely not. If the Son is the legal surrogate under statute and the POA is contested, we follow the Son or get a court order. Following the Daughter exposes the hospital to battery claims and liability."
      *   *Chair Say:* "I know the liability. But ethically, following the Son violates the patient's relational reality. We document the Daughter's objection thoroughly, pause non-emergent escalation, and force the Son to court immediately. We do not act on his orders until a judge confirms them."
      *   *Critique:* This leans into the "nepotism" risk. It privileges the present caregiver over the legal statute. It is ethically defensible in role ethics but legally aggressive.

  ### Case 3: The Sister and the Mother (Kidney Donation)
  *   **Facts:** 55M needs kidney. Sister (compatible) is sole caregiver for Mother (Parkinson's). Brother's Wife says Mother-care is "more fundamental."
  *   **Step 1 (Map):** Sister = Donor Candidate + Primary Caregiver. Brother = Recipient. Mother = Dependent.
  *   **Step 2 (Enactment):** Sister = Strong Caregiver. Brother = Dependent.
  *   **Step 3 (Rectify):** No misalignment, but role conflict within Sister (Daughter vs. Sister).
  *   **Step 4 (Hierarchy):** Procedure identifies Mother (Parent) as "Root" and Brother (Sibling) as "Branch."
  *   **Step 5 (Boundary):** **CLEAR.** Donation is voluntary. No law requires donation.
  *   **Step 6 (Recommendation):** Recommend Sister **decline donation**.
      *   *Rationale:* Preserving the Root Role (care for Mother) takes precedence over the Branch Role (saving Brother). If Sister donates, recovery compromises Mother's care, collapsing the family structure.
      *   *Attorney Say:* "Donor advocacy team must make this call, not Ethics. Ensure no coercion."
      *   *Chair Say:* "This is the hard edge of role ethics. It sacrifices the saveable patient (Brother) to protect the care structure (Mother). It feels cold, but it prevents the collapse of the remaining family unit."

  ---

  ## Translation Analysis

  ### What Survived Simplification
  1.  **Person-as-Role:** We dropped the metaphysical claim that "there is no self," but kept the operational rule: "Assess the person by their relationships." This survives because it changes the data we collect (care history vs. rights status).
  2.  **Rectification of Names:** Simplified to "Title vs. Function." This is usable at 2 AM. It allows a nurse to flag that the "Health Care Proxy" hasn't visited in five years.
  3.  **Graded Obligation:** Survived as "Root vs. Branch." This is the engine that prioritizes the caregiver daughter over the absent son.

  ### What Was Dropped
  1.  **Ritual Propriety (Li):** Too vague for a chart note. Replaced with "Communication Plan" (who speaks to whom).
  2.  **Self-Cultivation:** Irrelevant for a 90-minute consult. We are judging actions, not character.
  3.  **Ancestral Reverence:** Removed to ensure cultural neutrality. We focus on *current* care networks, not lineage.

  ### Is "Role-Constituted" Real Work or Decoration?
  It is real work. In the standard model, Case 2 ends at "Son is legal surrogate." In RRM, Case 2 identifies "Son is legal, Daughter is functional," which changes the recommendation from "Obey Son" to "Obey Son *only after* challenging his standing." It shifts the burden of proof. However, Step 2 (Assess Role Enactment) is a judgment call wearing a procedural costume. "Good care" is subjective. The form forces the committee to articulate *why* they think the care is good, which reduces bias but does not eliminate it.

  ### Limitations and Failure Modes

  **Three Things This Procedure Cannot Do:**
  1.  **Resolve Resource Scarcity:** It cannot decide who gets the ICU bed if two "Root" fathers are competing. Role ethics favors partiality; hospitals require impartiality. Step 5 blocks this.
  2.  **Protect the Vulnerable from Family:** If the "Root Role" is an abusive husband, Step 2's Safeguard must catch it. If the committee fails the Safeguard, the procedure amplifies the abuse.
  3.  **Generate Consent:** It cannot manufacture consent where a competent patient refuses. It can only frame the refusal relationally.

  **Two Situations Where It Will Fail Badly:**
  1.  **The Estranged Family with No Paper Trail:** If no one is doing the care, and the patient is incapacitated, the "Map" is empty. The procedure collapses into default legal statutes, making the extra steps a waste of time.
  2.  **The "Professionalized" Family:** If a family hires full-time staff and provides no direct care, Step 1 maps them as "Managers." Step 4 may incorrectly downgrade their authority compared to a hands-on nurse, creating conflict where the family views management as their primary role. The procedure assumes physical presence equals moral weight, which is not universally true.

  ---

  ## Final Note on Cultural Neutrality
  The procedure remains neutral by asking descriptive questions ("Who does the work?") rather than normative ones ("What is your duty?"). It does not assume an East Asian surname implies a desire for filial piety. It allows a Catholic family to define "Daughter" by sacramental duty, a Muslim family by religious obligation, or an unaffiliated family by emotional bond. The *source* of the role is irrelevant; the *enactment* is the data. However, be warned: by privileging the "caregiver," you inherently privilege cultures or socioeconomic groups where family provides direct care over those where professional care is the norm. This is not bias; it is the cost of the framework.
