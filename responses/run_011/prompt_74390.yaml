answer: |-
  ### 1. Literal Mapping: Marxism, the USSR, and Popper's Logic

  To run the collapse of the USSR through *The Poverty of Historicism* (PoH), we must strip the political narrative and map the logical structure Popper demands of any scientific theory: **Universal Laws + Initial Conditions = Prediction.**

  *   **The Supposed Law (Historical Materialism):** Societies evolve through predetermined modes of production (Feudalism → Capitalism → Socialism). The transition is driven by internal contradictions within the economic base. Socialism is the *inevitable* successor to advanced Capitalism.
  *   **The Initial Conditions (Marx's Specification):** The revolution must occur in highly industrialized societies where the productive forces have outgrown capitalist relations (e.g., UK, Germany, USA). The proletariat must be the majority class.
  *   **The Historicist Modification (Leninism):** Imperialism creates a "chain of weakest links." Revolution can occur in a backward agrarian society (Russia) if the vanguard party seizes the state to *force* the material conditions into existence.
  *   **The Prediction:** The Soviet state, representing the higher mode of production, will prove economically superior and historically stable, eventually outcompeting or absorbing the capitalist world.
  *   **The Outcome (1991):** The state collapsed not due to external invasion, but internal economic stagnation and loss of legitimacy, reverting to capitalist modes without achieving the predicted "higher" productivity.

  **Popperian Diagnosis:**
  Popper argues that historicists confuse **trends** (singular historical statements, e.g., "industrialization is increasing in Russia") with **laws** (universal statements, e.g., "industrialization always leads to socialism").

  The collapse of the USSR functions as a *modus tollens* against the Leninist modification.
  1.  If the Law holds (Socialism is historically superior/stable), the Soviet system should persist/expand.
  2.  The Soviet system collapsed/contracted.
  3.  Therefore, the Law (as applied to this system) is false.

  ### 2. Falsification vs. Immunizing Stratagem

  You asked to pick between two readings: (A) The theory was falsified, or (B) The theory never applied (the "backward country" defense).

  **Reading A (Falsification):** The USSR claimed to be the embodiment of the historicist law. Its failure is a direct empirical refutation of the claim that a state-run economy represents a higher, more stable stage of historical development.

  **Reading B (Non-Application/Immunization):** "The USSR wasn't *real* socialism because it lacked the advanced capitalist base Marx required."

  **Popper's Verdict:**
  Popper would classify Reading B as an **immunizing stratagem** *if* it is used to protect the *historicist claim of inevitability*.
  *   **Why?** Original Marxism contained a conditional prediction: *If* advanced capitalism, *then* socialism. By 1917, Marxists (Lenin) explicitly rejected the initial conditions requirement to make a *prophecy* of revolution in Russia. They turned a conditional hypothesis into an unconditional destiny ("The revolution *will* happen here").
  *   Once you make the unconditional prophecy (Leninism), you cannot retreat to the conditional restriction (Original Marx) when the prediction fails. To do so is to change the theory post-hoc to evade refutation.
  *   **Principled Distinction:** A theory is falsified if it makes a specific claim about the real world that turns out false. Leninism claimed the USSR was the vanguard of the inevitable future. 1991 proved it was not. Retreating to "Marx said it had to be advanced capitalism" ignores that Leninists explicitly argued Marx was wrong on that specific condition.

  Therefore, **Reading A is the real use of Popper's framework.** Reading B is the "conventionalist twist" Popper warns against—redefining terms ("real socialism") to ensure the theory can never be wrong.

  ### 3. The Amalrik Test: Trends, Laws, and Accidental Hits

  Andrei Amalrik's *Will the Soviet Union Survive Until 1984?* (1970) complicates the picture.
  *   **Prediction:** Collapse due to ethnic fragmentation + war with China.
  *   **Result:** Collapse happened (1991), ethnic fragmentation was key, war with China did not happen.
  *   **Timing:** Off by 7 years.

  **Does this vindicate Historicism?**
  No, not in Popper's terms. Amalrik did not posit a **law of history**. He posited a **trend extrapolation**. He observed rising nationalism and economic stagnation (trends) and calculated their trajectory.

  **Popper's Framework on Amalrik:**
  Popper admits in PoH that we *can* predict trends, provided we assume conditions remain constant. He writes: *"We can... predict the growth of... population... provided that the conditions remain sufficiently constant."*
  *   Amalrik identified a trend (decay).
  *   He failed on the **initial conditions** (the specific trigger: China war).
  *   He failed on the **duration** (trends can switch off or accelerate; the USSR lasted 7 years longer than his trend line suggested).

  **The Harder Bit: Is Popper Immunizing Himself?**
  If Popper says, "Amalrik succeeded because he used trend analysis, not historicism," is he moving the goalposts?
  *   **The Critique:** If every successful prediction is labeled "trend analysis" (scientific) and every failed one "historicism" (unscientific), Popper's distinction becomes tautological. He defines Historicism as "failed long-term prophecy." If a long-term prophecy succeeds, does it become science?
  *   **Popper's Defense:** The distinction rests on the **claim to inevitability**, not the outcome. If Amalrik had claimed, "Dialectical laws *mandate* this collapse in 1984," and he was right, Popper would still call it unscientific because the *reasoning* relied on destiny rather than causal mechanisms subject to falsification.
  *   **The Vulnerability:** However, if Amalrik's reasoning was *actually* historicist (assuming the "decay of empire" is a law-like process), and he got it right, Popper's claim that "long-term prediction is impossible" is empirically weakened. Popper argues knowledge growth makes the future unpredictable. Amalrik predicted the future despite knowledge growth.
  *   **Resolution:** Popper survives this only if we emphasize the **mechanism error**. Amalrik missed the *cause* (China war). The collapse happened for *different reasons* (Gorbachev's reforms, oil prices). Popper would argue: "You predicted the event, but you didn't understand the causal law, because there is no causal law. You got lucky with the trend."

  This leaves Popper open to the charge that his critique is **unfalsifiable**. If a historicist prediction fails, it's because historicism is false. If it succeeds, it's because it was actually just "trend analysis" or "luck."

  ### 4. Verdict: Does 1991 Help or Hurt Popper?

  **It helps his Epistemology, but hurts his Sociology.**

  *   **Helps Epistemology:** The collapse was a surprise to almost all Western Sovietologists (who were largely Popperian empiricists). The fact that the "experts" didn't see it coming supports Popper's claim that the growth of knowledge (Gorbachev's ideas, the speed of information flow) alters the course of history in unpredictable ways. The future is not *contained* in the present.
  *   **Hurts Sociology:** Popper implied that "Open Societies" (liberal democracies) were the rational endpoint of critical discourse, while "Closed Societies" (totalitarianism) were irrational errors. 1991 didn't look like a rational critical discourse winning; it looked like economic bankruptcy and elite defection. The "victory" of the Open Society wasn't a logical refutation of the Closed Society, but a contingent collapse. This weakens Popper's *political* historicism (the idea that Open Societies are historically destined to win), even if it strengthens his *methodological* critique of Marxism.

  **Is 1991 a Vindication?**
  It is a **partial vindication**. It vindicates the claim that *prophecies of inevitable progress* (Marxism) are false. It does not vindicate the claim that *social science cannot predict regime collapse* (Amalrik got close).

  ### 5. Settled vs. Live Debates Among Popper Scholars

  You requested a separation of settled text from live controversy.

  **Settled (Textual Consensus):**
  *   **Prophecy vs. Prediction:** Popper definitely distinguishes between unconditional prophecy (Historicism) and conditional prediction (Science). This is not contested in the text of PoH.
  *   **Trend vs. Law:** Popper definitely argues trends are singular and can change; laws are universal.
  *   **Immunizing:** Popper definitely defines *ad hoc* modifications to save a theory from falsification as dogmatic.

  **Live (Contested Among Philosophers of Social Science):**
  *   **The "Straw Man" Charge:** Many scholars (e.g., Adorno, Habermas, and later critical realists like Roy Bhaskar) argue Popper constructed a caricature of "Historicism." No serious historian claims history follows *inexorable laws* in the way Popper describes. If Historicism is a straw man, Popper's victory in 1991 is over an enemy that didn't exist. This is a **live** debate in philosophy of history.
  *   **The Unfalsifiability of Critical Rationalism:** As noted in the Amalrik section, critics argue Popper's own framework is immune to refutation. If he dismisses successful historicist predictions as "mere trends," he is guilty of the same immunizing he accuses Marxists of. This is a **live** meta-philosophical critique (see: *The Popperian Legacy*, ed. Shearmur).
  *   **Initial Conditions Problem:** Scholars like Daniel Little argue that in social science, "laws" and "initial conditions" are often indistinguishable. If the "law" is "regimes collapse when legitimacy fades," is that a law or a trend? Popper assumes a clean distinction that social scientists find **unworkable in practice**.
  *   **Leninism as Falsification:** Among Marxist scholars, it is **settled** that the USSR failed. It is **live** whether this falsifies *Marx* or only *Lenin*. Popper lumps them; Marxists separate them. Popperians argue the separation is an immunizing stratagem; Marxists argue it's a valid distinction of initial conditions. There is no consensus here, only entrenched positions.

  ### Summary
  1991 falsifies the **Leninist prophecy** (Reading A), which Popper correctly identifies as an immunized version of Marxism. Reading B ("It wasn't real socialism") is the immunizing stratagem Popper warned against.

  Amalrik's case shows that **trend extrapolation** works better than **law-based prophecy**, which supports Popper's methodological distinction. However, it exposes the vulnerability that Popper can dismiss any successful "historicist" prediction as "just a trend," rendering his own critique difficult to falsify.

  1991 vindicates Popper's **negative thesis** (you cannot predict the future based on laws of history) but leaves his **positive thesis** (open societies are the rational alternative) historically contingent rather than logically proven. The "Popperian Victory" of 1991 is real, but it is thinner than his supporters claim.
