  ok, context first because it matters for how hard you should hit me. my dad has been a malthusian since the seventies — genuinely, the man has a whole wall of books about collapse and a rain barrel for every occasion — and I grew up inside it and until about a year ago I basically agreed. then I took a job on a state water-and-ag planning team and my first month they had me write a memo arguing the opposite line: that a long-run scarcity forecast has to be scored against whether it actually came due, not against whether the underlying pressure it named is real. I wrote the memo. I do not believe the memo. So I want to get beaten up properly by the side I'm paid to hold, so I can find out whether it's actually defensible or whether I'm just a good writer.

