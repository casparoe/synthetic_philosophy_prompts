  ### Stage One: The Base Negotiation

  **Context:** A metropolitan Hospital Authority (Party 1) negotiates an annual contract with its Physicians' Group (Party 2). Utilities are cardinal von Neumann–Morgenstern indices: Party 1 measures net operating margin (scaled 0–10), and Party 2 measures a composite leisure-salary index (scaled 0–10). Convexity is achieved through a **randomized roster lottery**: the union agrees to a probability distribution over shift schedules (e.g., 60% chance of Schedule A, 40% of Schedule B), making expected utility linear in probabilities. The disagreement point $d=(2,2)$ represents a costly work-to-rule impasse.

  **Feasible Set $S_1$:** The comprehensive convex hull from $d$ of vertices $A=(3,8)$, $B=(5,4)$, and $C=(9,2)$.
  The Pareto Frontier (PF) consists of two segments:
  1.  **Segment $AB$:** $u_2 = -2u_1 + 14$ for $u_1 \in [3,5]$.
  2.  **Segment $BC$:** $u_2 = -\frac{1}{2}u_1 + \frac{13}{2}$ for $u_1 \in [5,9]$.
  *   **Ideal Point $a$:** $(\max u_1, \max u_2) = (9,8)$.
  *   **Disagreement $d$:** $(2,2)$.

  **1. Kalai–Smorodinsky (KS) Solution:**
  The KS solution lies on the ray from $d$ to $a$.
  Slope of ray: $\frac{8-2}{9-2} = \frac{6}{7}$. Equation: $u_2 - 2 = \frac{6}{7}(u_1 - 2) \implies u_2 = \frac{6}{7}u_1 + \frac{2}{7}$.
  Intersect with Segment $AB$: $\frac{6}{7}u_1 + \frac{2}{7} = -2u_1 + 14 \implies \frac{20}{7}u_1 = \frac{96}{7} \implies u_1 = \frac{24}{5} = 4.8$.
  Since $4.8 \in [3,5]$, the intersection is on $AB$.
  $u_2 = -2(\frac{24}{5}) + 14 = \frac{22}{5} = 4.4$.
  **$KS_1 = (\frac{24}{5}, \frac{22}{5}) = (4.8, 4.4)$.**
  *Check:* Proportional gains are $\frac{4.8-2}{9-2} = \frac{2.8}{7} = 0.4$ and $\frac{4.4-2}{8-2} = \frac{2.4}{6} = 0.4$. Equal.

  **2. Nash Solution:**
  Maximize $N = (u_1 - 2)(u_2 - 2)$.
  *   On Segment $AB$ ($u_2 = -2u_1 + 14$):
      Maximize $(u_1 - 2)(-2u_1 + 12)$. FOC: $-2(u_1 - 2) + (-2u_1 + 12) = 0 \implies -4u_1 + 16 = 0 \implies u_1 = 4$.
      $u_1=4$ is in $[3,5]$. $u_2 = 6$. Product $= (2)(4) = 8$.
  *   On Segment $BC$ ($u_2 = -0.5u_1 + 6.5$):
      Maximize $(u_1 - 2)(-0.5u_1 + 4.5)$. FOC: $-0.5(u_1 - 2) + (-0.5u_1 + 4.5) = 0 \implies -u_1 + 5.5 = 0 \implies u_1 = 5.5$.
      $u_1=5.5$ is in $[5,9]$. $u_2 = 3.75$. Product $= (3.5)(1.75) = 6.125$.
  *   Compare Products: $8 > 6.125$.
  **$N_1 = (4, 6)$.**

  **Result:** $N_1 \neq KS_1$. Both are in the relative interior of Segment $AB$.

  ---

  ### Stage Two: The Expansion

  **Expansion:** A new regulatory waiver allows a "Flex-Shift" option, represented by a new vertex $D=(4, \frac{25}{4}) = (4, 6.25)$. This replaces vertex $B$. The new feasible set $S_2$ is the hull of $A(3,8)$, $D(4, 6.25)$, and $C(9,2)$.
  *   **New Segment $AD$:** $u_2 = -\frac{7}{4}u_1 + \frac{53}{4}$ for $u_1 \in [3,4]$.
  *   **New Segment $DC$:** $u_2 = -\frac{17}{20}u_1 + \frac{193}{20}$ for $u_1 \in [4,9]$.
  *   **Ideal Point:** Unchanged at $(9,8)$.
  *   **Monotonicity Check:** For every $u_1$, the new $u_2$ is weakly higher than in $S_1$ (e.g., at $u_1=5$, old max was 4, new is $5.4$).

  **1. Kalai–Smorodinsky Solution ($KS_2$):**
  Ray is unchanged ($u_2 = \frac{6}{7}u_1 + \frac{2}{7}$). Since the frontier expanded outward, the intersection moves up the ray.
  Intersect with Segment $DC$: $\frac{6}{7}u_1 + \frac{2}{7} = -\frac{17}{20}u_1 + \frac{193}{20}$.
  Multiply by 140: $120u_1 + 40 = -119u_1 + 1351 \implies 239u_1 = 1311 \implies u_1 = \frac{1311}{239} \approx 5.49$.
  $u_2 = \frac{6}{7}(\frac{1311}{239}) + \frac{2}{7} = \frac{1192}{239} \approx 4.99$.
  **$KS_2 = (\frac{1311}{239}, \frac{1192}{239})$.**
  *Comparison:* $u_2(KS_2) \approx 4.99 > 4.4 = u_2(KS_1)$. Party 2 is strictly better off.

  **2. Nash Solution ($N_2$):**
  *   On Segment $AD$ (Slope $-7/4$): FOC yields $u_1 \approx 4.21$, outside domain $[3,4]$. Max at $D(4, 6.25)$. Product $= (2)(4.25) = 8.5$.
  *   On Segment $DC$ (Slope $-17/20$):
      Maximize $(u_1 - 2)(-\frac{17}{20}u_1 + \frac{153}{20})$.
      FOC: $-\frac{17}{20}(u_1 - 2) + (-\frac{17}{20}u_1 + \frac{153}{20}) = 0 \implies -\frac{34}{20}u_1 + \frac{187}{20} = 0 \implies u_1 = \frac{187}{34} = \frac{11}{2} = 5.5$.
      $u_1=5.5$ is in $[4,9]$.
      $u_2 = -\frac{17}{20}(\frac{11}{2}) + \frac{193}{20} = \frac{199}{40} = 4.975$.
      Product $= (3.5)(2.975) = 10.4125$.
  *   Compare: $10.4125 > 8.5$.
  **$N_2 = (\frac{11}{2}, \frac{199}{40}) = (5.5, 4.975)$.**
  *Comparison:* $u_2(N_2) = 4.975 < 6 = u_2(N_1)$. Party 2 is strictly worse off.

  **Axiomatic Verdict:**
  *   **Kalai–Smorodinsky:** Satisfies **Strong Monotonicity** (expansion helped P2).
  *   **Nash:** Violates **Strong Monotonicity** (expansion hurt P2).
  *   **Independence of Irrelevant Alternatives (IIA):** Not triggered, as $N_1 \notin S_2$.

  **Affine Invariance Check:**
  If Party 2's utility is rescaled $v_2 = 2u_2 + 1$, $d$ becomes $(2,5)$, Ideal becomes $(9,17)$.
  KS Ray slope: $(17-5)/(9-2) = 12/7$. Original slope scaled: $2 \times (6/7) = 12/7$. The ray transforms correctly.
  Nash Product: $(u_1-2)(2u_2+1-5) = 2(u_1-2)(u_2-2)$. Maximizing this is equivalent to maximizing the original product. The solution point $(u_1, u_2)$ remains invariant.

  ---

  ### Honest Design Analysis

  **1. Structural Feature:**
  The divergence is driven by the **kink** in the Pareto frontier combined with a **non-origin disagreement point**.
  *   **If the frontier were straight:** With a linear frontier $u_2 = m u_1 + c$, the Nash solution is the midpoint of the segment's intercepts (shifted by $d$). The KS solution is the ray intersection. They would generally differ, but the Stage 2 result would not survive. A monotonic expansion of a linear frontier (shifting it outward parallel) moves the Nash midpoint predictably outward; it cannot push Party 2's payoff down while Party 1's goes up unless the slope changes drastically. The *change in slope* enabled by the kink (replacing a steep segment with a flatter one to the right) is what drags the Nash tangency point rightward, sacrificing Party 2's utility despite the set expansion.
  *   **If $d=(0,0)$:** The Nash solution maximizes $u_1 u_2$. On a linear segment, this is the geometric midpoint. The KS solution is the ray to the ideal. While they can differ, the "Nash violates monotonicity" paradox is much harder to construct because the level curves are symmetric hyperbolas centered at the origin. The asymmetry of $d=(2,2)$ shifts the Nash "bliss" point on the line, making it sensitive to slope changes in a way that allows the paradox.

  **2. Credibility of Expansion:**
  The expansion adds vertex $D(4, 6.25)$. A skeptic might argue this is "infeasible" because it improves Party 2's position at $u_1=4$ without costing Party 1 anything relative to the old frontier (which was at $u_2=6$). However, the cost is hidden in the **marginal rate of substitution**. To achieve $u_1=9$, Party 2 must now accept $u_2=2$ (same as before), but the path to get there is flatter (slope $-0.85$ vs $-0.5$ on the right). This represents a "Flex-Shift" that gives Party 2 a quick win early (high $u_2$ at low $u_1$) but locks them into a worse trade-off rate for high $u_1$ outcomes. It is credible as a technological or regulatory change that alters the *shape* of the trade-off, not just the scale.

  **3. The Defense of Nash vs. KS:**
  *   **Nash Defender's Attack:** They will charge that **Strong Monotonicity** is a flawed axiom because it makes the solution depend on the **Ideal Point** (the utopia no one can reach). In Stage 2, the KS solution moved only because the *unattainable* maximum for Party 1 remained fixed while the frontier bulged. The Nash defender argues that bargaining should depend only on the *feasible* set of utilities. The fact that Party 2 ends up worse off is a feature, not a bug: the new options changed the *threat structure* (the slope), incentivizing Party 1 to demand more. The "improvement" for Party 2 was a trap that altered the marginal trade-off against them.
  *   **KS Defender's Counter:** They argue that ignoring the Ideal Point violates **scale invariance in a dynamic context**. If the expansion represents a genuine increase in resources (the set is strictly larger), a solution that punishes a party for the availability of more options is irrational. The KS defender rejects the Nash reliance on the *local slope* at the expense of *global opportunity*. They would argue the Nash solution is vulnerable to "phantom options": if Party 1 could credibly threaten to remove the new vertex $D$ (even if they don't want to), they could manipulate the Nash outcome back to $N_1$. KS is immune to this manipulation because it looks at the bounds of the set, not the local curvature.

  **Design Note:** The example relies on the Nash solution jumping from the steep segment ($AB$) to the flatter segment ($DC$) in Stage 2. This jump is what allows $u_1$ to increase significantly while $u_2$ drops below the original level, despite the frontier moving outward. This is the arithmetic engine of the monotonicity violation.
