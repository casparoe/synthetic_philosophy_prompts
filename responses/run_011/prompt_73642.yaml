answer: |-
  ### The Philosophy: Coordination vs. Constitution

  Your trichotomy is close, but "friction-only" is a trap. In an NGO context, nothing is friction-only; if it creates friction for you, it usually serves a function for them. The distinction you need is between **Arbitrary Coordination**, **Relational Maintenance**, and **Constitutive Integrity**.

  1.  **Arbitrary Coordination (The Traffic Rule):** The specific action doesn't matter, but *uniformity* does. (e.g., which side of the road to drive on, queueing order).
      *   *Moral Load:* Low.
      *   *Visitor Status:* You must comply. You are consuming the public good of order without contributing to its long-term maintenance. Non-compliance here is pure selfishness.
  2.  **Relational Maintenance (The Greeting):** The action signals respect, status, or belonging. (e.g., gift-giving, honorifics, dining etiquette).
      *   *Moral Load:* Medium.
      *   *Visitor Status:* You must comply *unless* it conflicts with Integrity. Non-compliance is read as a statement about the *organization*, not just you. It burns social capital you didn't earn.
  3.  **Constitutive Integrity (The Value):** The action touches on human rights, legal compliance, or core organizational values. (e.g., discrimination, bribery, safeguarding).
      *   *Moral Load:* High.
      *   *Visitor Status:* You do **not** get to claim "culture" as a defense. You are a guest, but you are not a chameleon. If the local convention requires you to violate your constitution, the convention breaks.

  ### The Procedure: The "Convention Audit"

  Train your staff to run this four-step filter. It takes 2 minutes mentally, fits a 20-minute session, and forces a decision.

  **Q1: The Red Line (Policy & Safety)**
  *   *Question:* Does following this convention violate NGO policy, local law, or physical safety?
  *   *Sufficient Answer:* "Yes, it violates [Specific Policy/Statute]" OR "No, it is benign."
  *   *Termination:*
      *   **YES:** **DON'T.** (Terminate).
      *   **NO:** Proceed to Q2.

  **Q2: The Burden Distribution (Who Pays?)**
  *   *Question:* If I comply, who bears the cost? If I refuse, who bears the cost?
  *   *Sufficient Answer:* Identify the specific person or group impacted. "I lose 5 minutes" vs. "The guard loses a day's wage" vs. "The woman junior staff is humiliated."
  *   *Termination:*
      *   **Cost falls on vulnerable local:** **ESCALATE.** (Do not decide alone).
      *   **Cost falls on you/efficiency:** Proceed to Q3.

  **Q3: The Signal (What does it say?)**
  *   *Question:* Is this action read as "I respect you" or "I am superior to you"?
  *   *Sufficient Answer:* "It is a standard courtesy" vs. "It requires me to act beneath my dignity/status."
  *   *Termination:*
      *   **Signals Superiority/Privilege:** **DON'T.**
      *   **Signals Respect:** Proceed to Q4.

  **Q4: The Coordination Check**
  *   *Question:* Is this purely about flow/order?
  *   *Sufficient Answer:* "Yes, everyone does it to make things work."
  *   *Termination:*
      *   **YES:** **FOLLOW.** (Do not be the obstacle).
      *   **NO:** **ESCALATE.** (Ambiguous).

  ---

  ### Running the Cases

  Here is how the procedure handles your three scenarios. Note that the procedure is designed to be unforgiving on values and pragmatic on logistics.

  #### Case 1: Jaywalking (Crowd crosses on red; curb-waiters are obstacles)
  *   **Q1 (Red Line):** Local law says don't cross. NGO policy? None. Safety? Crossing with the crowd is safer than standing alone.
      *   *Result:* No hard policy violation. Safety favors crossing.
  *   **Q2 (Burden):** If I wait, I block the flow. If I cross, I match the flow. Cost is on *me* (anxiety) vs. *crowd* (minor delay).
      *   *Result:* Cost falls on the coordination group.
  *   **Q3 (Signal):** Waiting on the curb signals "I am an outsider who doesn't understand how we move here."
      *   *Result:* Signals disconnection.
  *   **Q4 (Coordination):** Yes, this is pure flow.
  *   **Verdict:** **FOLLOW.**
  *   *Rationale:* This is Arbitrary Coordination. The "law" is nominal; the "convention" is functional. Refusing to cross makes you a hazard and marks you as a privileged outsider who demands the world stop for their rule-following.

  #### Case 2: The Porter (Depends on tip; Policy bans cash to "official capacity")
  *   **Q1 (Red Line):** Policy bans cash to "official capacity." Is the porter state-employed (common in Global South airports/ports) or private?
      *   *Scenario A (State):* **DON'T.** It is a bribe.
      *   *Scenario B (Private):* Policy doesn't strictly apply, but risk management might flag it.
      *   *Assumption for Training:* Trainees cannot verify employment status in the moment.
  *   **Q2 (Burden):** If I don't tip, porter loses income. If I do tip, I risk compliance breach.
      *   *Result:* Cost falls on vulnerable local (porter).
  *   **Q3 (Signal):** Tipping signals gratitude. Not tipping signals stinginess *or* principle.
  *   **Q4 (Coordination):** No.
  *   **Verdict:** **ESCALATE.**
  *   *Rationale:* This hits the gap between Relational and Constitutive. The procedure stops the trainee from making a compliance judgment they aren't qualified to make.
      *   *Instruction:* "Do not hand cash. Offer a sealed envelope to the Country Director to disburse later, or buy a meal. If the porter refuses non-cash, walk away. You cannot solve systemic wage theft with a compliance breach."

  #### Case 3: Deference to Senior Official (Marks women/juniors as lesser)
  *   **Q1 (Red Line):** NGO Safeguarding/Equality Policy. Local law may support the official, but NGO policy forbids discrimination.
      *   *Result:* **VIOLATION.**
  *   **Q2 (Burden):** If I comply, the female/junior staff member is humiliated. If I refuse, the Official is offended.
      *   *Result:* Cost falls on vulnerable staff (your own team).
  *   **Q3 (Signal):** Compliance signals "We accept your hierarchy over our values." Refusal signals "We are partners, not subjects."
  *   **Q4 (Coordination):** No.
  *   **Verdict:** **DON'T / ESCALATE.**
  *   *Rationale:* This is Constitutive Integrity.
  *   *The Uncomfortable Truth:* The procedure lands on **non-compliance**. This will likely anger the official. It may jeopardize the project access.
      *   *Directive:* "You do not perform subservience that violates human dignity. You politely decline the specific protocol ('In our organization, we speak as equals') and immediately escalate to the Country Director to manage the diplomatic fallout. If the partnership requires your complicity in discrimination, it is a toxic partnership."
      *   *Why you won't like this:* Because it admits that some "relationships" are actually extortionate power dynamics, and the procedure forces you to burn the bridge rather than walk across it on your staff's backs.

  ---

  ### Limitations & Failure Modes

  This procedure is a tool, not a conscience. Here is where it breaks:

  **1. The "Values Call" in Disguise**
  Q1 (Red Line) looks objective, but "Policy" is just codified values. If your NGO policy is silent on a specific cultural slight (e.g., eating with the left hand), the procedure pushes it to Q3 (Signal). A trainee with low cultural intelligence will misread the signal. They might think "It's just hygiene" when it's actually "You are insulting my ancestors." The procedure cannot teach empathy; it only structures the decision.

  **2. The Privilege Blindspot**
  In Q2 (Burden), a trainee from a wealthy background may genuinely believe "The porter will be fine" or "The junior staff won't mind." The procedure relies on honest self-assessment of power dynamics. If the trainee lacks the humility to see their own privilege, they will answer Q2 incorrectly and proceed to **FOLLOW** on a bribe or **DON'T** on a harmless courtesy.

  **3. The "Escalate" Black Hole**
  The procedure terminates in "Escalate" for gray areas. In a mid-sized NGO, the Country Director is often overworked. If trainees escalate every ambiguous norm, they become helpless. If they stop escalating, they revert to guesswork. You must train them that "Escalate" means "Pause and ask," not "Dump the problem on my boss."

  **4. Moral Licensing**
  The danger of a procedure is that staff treat it as a checklist for ethical purity. "I ran the audit, so I'm good." They may follow the procedure mechanically while carrying an attitude of contempt. The procedure ensures *compliance*, not *respect*.

  ### Implementation Note
  For your 20-minute session:
  1.  Spend 5 minutes on the Philosophy (Coordination vs. Constitution).
  2.  Spend 5 minutes on the 4 Questions (Hand out a wallet card).
  3.  Spend 10 minutes running the three cases above. Ask the room: "In Case 3, if the CD says 'Just do it to keep the peace,' what do you do?" (The answer must be: "Document the instruction and do not comply if it violates safeguarding.")

  This moves them from "When in Rome" (passive absorption) to "Guest Protocol" (active ethical negotiation).
