prompt: |-
  You're a philosopher who works on collective harm and the causation side of individual responsibility — climate ethics, consumption ethics, the whole inefficacy debate. Help me out with a case I need for a seminar paper.

  Background on what I'm after: everyone knows the standard shape of the problem. My individual contribution to a big harm seems to make no difference, so I'm apparently off the hook; the standard replies run either through thresholds (my act nudges up the probability that the harm tips over) or through participation (I'm implicated in the collective project regardless of what my act causes). I want a case that knocks the first two replies off the table at the same time, so that only a participation-style view has anything left to say. That's what the case is *for*, so you'll know what counts as cheating.

  Specs for the scenario:

  1. Realistic, contemporary, small-scale — a workplace, an office, a small firm. Not a trolley, not a climate model, nothing sci-fi. One paragraph only for the scenario itself.
  2. No food purchases, no light switches, no thermostats, no voting, no donations. Nothing already worn out in the literature.
  3. The redundancy has to come from overdetermination, *not* from contributions being too small to notice. Every individual act in the case is by itself fully sufficient to bring the harm about, and the other agents are going to act no matter what I do — so the probability that my act changes anything is exactly zero, not merely tiny. No vagueness or sorites hook anywhere in the case; if a defender could say "well, somewhere there's a perceptible difference," the case fails.
  4. The harm is concrete and lands on an identifiable person or a handful of people, not diffuse or statistical.
  5. The agent knows all of the above at the moment of acting — no ignorance, no uncertainty about whether the others will go through with it, no "maybe he thinks he's the only one" escape hatch.
  6. The act is not independently wrong for reasons unrelated to the collective harm — no broken promise, no lie, no breach of professional duty, no cruelty for its own sake. If the wrongness intuition could be sourced from something like that, the case is contaminated.

  Then the demonstration, which is the part I actually need:

  - Name the three positions you're testing (use whatever labels you prefer) and give each one's verdict on the case, tracing the reasoning through the actual structure of *my* scenario rather than generic talking points. I want to see why the expected-value calculation genuinely comes out at zero here and not just approximately.
  - Say which single feature of the case is doing the work in producing the split.
  - Give me a one-sentence control variant in which you remove or flip just that feature, holding everything else fixed, and show which verdicts move and which stay put.
  - Give the best attack the causal-impotence side can launch against the case, and tell me honestly whether it succeeds. Specifically: can they explain away the wrongness intuition as being about the agent's dispositions or character rather than about the act? If yes, does that save their view or just relocate the problem?

  Think carefully about this. Before you commit, brainstorm three or four candidate setups and stress-test each against constraint 3 and constraint 6 — but don't show me the discards, just write up the one that survives. Keep the whole thing under about 800 words. And no reading list or citations please, I've got that side covered already.
