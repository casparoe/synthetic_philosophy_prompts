answer: |-
  **The Scenario**
  You are one of three co-owners of a small rental property. The lease stipulates that any single owner may unilaterally terminate the tenancy with thirty days' notice. The tenant, a single parent, relies on this housing for their child's schooling. You and the other two owners have independently decided to terminate for financial reasons. You know with certainty that the other two owners have already submitted their notices to the property manager, which is legally sufficient to evict the tenant regardless of your action. You now submit your own notice.

  **The Positions and Verdicts**
  1.  **Causal Impotence (Expected Utility):** Verdict: **Permissible**. This view holds that an act is wrong only if it expects to cause net harm. Since the eviction occurs regardless of your notice, the marginal causal contribution of your act is zero. The expected value calculation is exactly zero, not approximately, because the counterfactual outcome (tenant evicted) is identical to the actual outcome. You cause no additional suffering.
  2.  **Threshold/Probabilistic:** Verdict: **Permissible**. This view rescues responsibility in collective cases by arguing acts nudge probability over a tipping point or cross a threshold. Here, there is no tipping point; the harm is already determined by the prior notices. Your act adds no probability mass to the harm occurring. P(Harm|Act) = 1, P(Harm|No Act) = 1. The delta is zero, and there is no sorites margin to exploit.
  3.  **Participation/Complicity:** Verdict: **Wrong**. This view locates wrongness in joining a harmful collective endeavor rather than causing marginal damage. By submitting the notice, you intentionally align your will with the eviction project. You make yourself a participant in the harm, sharing in the responsibility for the collective outcome even if you don't cause the extra damage.

  **The Decisive Feature**
  The split is produced by **causal redundancy via pre-emption**. The harm is fully overdetermined by the completed acts of others, rendering your contribution causally inert while leaving your intentional participation intact.

  **Control Variant**
  If you know the others *have not yet* submitted notices, the Causal and Threshold views now verdict "Wrong" because your act becomes necessary or probability-raising, while Participation stays "Wrong."

  **The Causalist Attack**
  The causal theorist argues the intuition of wrongness targets your **disposition**, not the act. They claim you are blameworthy because you are the kind of person who evicts vulnerable tenants, even if this specific act caused nothing. This partially succeeds in explaining the blame intuition but fails to save the causal theory of *act* wrongness. It concedes that the act itself is causally harmless and relocates the normative weight to character ethics. Thus, it saves the judgment of the agent but abandons the claim that the *act* is wrong in virtue of its consequences, which was the original theoretical commitment. The problem is relocated, not solved.
