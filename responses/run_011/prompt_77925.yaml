answer: |-
  Here is a principle that reconstructs your intuitions, followed by an honest audit of where it forces you to compromise.

  ### The Principle: **Civic Integrity with a Harm Threshold**

  **Statement:**
  Voting is primarily an act of **personal civic integrity** (expressing your genuine judgment), constrained by a **duty to prevent tangible harm** (consequences), and governed by rules of **non-alienable agency** (you cannot treat your vote as property).

  1.  **The Integrity Default:** In the absence of tangible consequences, you must vote in accordance with your genuine endorsement. To do otherwise is to lie as a civic actor.
  2.  **The Harm Threshold:** If your vote has a non-negligible probability of preventing significantly worse outcomes for others, the duty to prevent harm overrides the Integrity Default. You may soil your hands to stop a disaster, but not to tweak margins.
  3.  **The Agency Constraint:** Your vote is an extension of your moral will. You may use it for self-interest (as your will is yours), but you may not alienate it (sell it) or use it deceptively to undermine the process (though strategic maneuvering within rules is permitted).
  4.  **The Complicity Gradient:** Active financial support implies stronger endorsement than passive selection. The closer the association, the higher the burden of integrity.

  ---

  ### Mapping Your Cases to the Principle

  | Case | Your Verdict | Principle Clause | Explanation |
  | :--- | :--- | :--- | :--- |
  | **1. Swing / Lesser Evil** | Fine / Required | **Harm Threshold** | The probability of impact crosses the threshold. Preventing the "worse" outcome overrides the integrity cost of voting for the "lesser" evil. |
  | **2. Safe Seat / Endorse** | Fine / Better | **Integrity Default** | No impact threshold met. Integrity rules. Voting for who you actually like is morally cleaner than Case 1 (no "dirty hands"). |
  | **3. Landslide / Worse** | Not Fine | **Integrity Default** | No impact threshold met. Voting for someone you deem "worse" violates Integrity. You are lying/complicit for no gain. |
  | **4. Selling Vote** | Wrong | **Agency Constraint** | Selling alienates your moral will. It turns a civic act into a commodity transaction. |
  | **5. Pocketbook Voting** | Not Wrong | **Agency Constraint** | Pursuing self-interest is an exercise of your will, not alienation. You remain the author of the vote. |
  | **6. Primary Raiding** | Fine / Clever | **Agency Constraint** | Strategic use of agency within the rules. It is expressive (you want a weaker opponent) and not alienated. |
  | **7. Trusting Recs** | Fine | **Integrity Default** | Epistemic reliance is permitted. You endorse the *judgment* of the recommender, maintaining integrity of effort. |
  | **8. Skipping / Protest** | Not Fine | **Integrity Default** | Violates the minimum duty of engagement. "Laziness with a story" fails the effort required to maintain civic integrity. |
  | **9. Donating vs. Voting** | Donating Worse | **Complicity Gradient** | Donating is active sponsorship; voting is passive selection. Higher association = higher taint for bad outcomes. |

  ---

  ### The Friction Points: What You Must Drop

  To make this system coherent, you have to accept three uncomfortable implications that might clash with your gut:

  **1. The "Selfishness" Contradiction (Case 3 vs. Case 5)**
  *   **The Tension:** In Case 3, you say it's wrong to vote for the "worse" candidate because you like one policy. In Case 5, you say it's *fine* to vote for who helps you, even if you think it's *bad for everybody*.
  *   **The Principle's Verdict:** These are logically inconsistent under "Integrity." If you believe a policy is "bad for everybody," voting for it because it helps *you* violates Civic Integrity just as much as voting for a "worse" candidate.
  *   **The Drop:** You must admit that **Case 5 is actually morally suspect**, or **Case 3 is actually fine.**
      *   *Option A:* Admit pocketbook voting is a form of corruption (just less blatant than selling).
      *   *Option B:* Admit that in a landslide, voting for a "worse" candidate for a specific policy reason is just "expressive voting" and should be Fine.
      *   *My advice:* Keep Case 5 as "Not Wrong" but redefine it. You are allowed to vote for your interest *provided you don't believe the candidate is morally reprehensible.* Case 3 implies the candidate is "Worse" (morally/policy overall). Case 5 implies "Bad for everybody" (utilitarian calculation) but perhaps not "Evil." The distinction rests on **Complicity in Harm** vs. **Failure to Maximize Good**. You are forgiving yourself for failing to maximize the good (Case 5), but not for actively choosing harm (Case 3).

  **2. The "Better Than" Judgment (Case 1 vs. Case 2)**
  *   **The Tension:** You feel Case 2 (Safe/Expressive) is *better* than Case 1 (Swing/Pragmatic).
  *   **The Principle's Verdict:** This fits perfectly. Case 2 preserves Integrity; Case 1 sacrifices it for Consequences.
  *   **The Drop:** You must accept that **doing the "Required" thing (Case 1) is morally dirtier than doing the "Fine" thing (Case 2).** This is the "Dirty Hands" problem. You are acknowledging that saving the world makes you a less virtuous person than ignoring the world and staying pure. This is a heavy philosophical bullet to bite, but it matches your gut.

  **3. The "Laziness" vs. "Boycott" Distinction (Case 8)**
  *   **The Tension:** You call skipping the ballot "laziness with a story."
  *   **The Principle's Verdict:** The principle demands *some* engagement for Integrity.
  *   **The Drop:** You must rule that **a principled boycott is impossible.** If the system is so corrupt that voting violates Integrity, the Principle says you should still vote (to meet the Engagement constraint) or Donate/Advocate instead. You cannot simply opt out without failing a civic duty.

  ---

  ### Unlisted Cases: What the Principle Says

  **1. Staying home in a safe seat vs. Voting badly there**
  *   **Verdict:** **Staying home is worse.**
  *   **Reasoning:** In a safe seat, the Harm Threshold is not met, so the Integrity Default rules.
      *   If you vote for a candidate you hate (Voting Badly), you violate Integrity (Case 3).
      *   If you stay home (Case 8), you violate the Duty of Engagement.
      *   However, Case 8 says skipping is "laziness." If staying home is a *protest* against the lack of choices, the Principle views this as failing to engage with the available agency.
      *   *Correction:* Actually, if no candidate meets the Integrity bar, **abstention is cleaner than voting for the "Worse."** Case 3 says voting for the worse is "Not Fine." Case 8 says skipping is "Not Fine" *if it's laziness*. If skipping is because *no candidate preserves Integrity*, then skipping is the only Integrity-preserving move.
      *   *Refined Verdict:* **Staying home is better than voting for someone you deem "Worse."** It preserves Integrity. But you must donate or advocate (Case 9 logic) to maintain Civic Engagement.

  **2. The badly-informed bad voter vs. The pocketbook voter**
  *   **Scenario:** Voter A votes for the "wrong" candidate because they didn't read the ballot (ignorance). Voter B votes for the "wrong" candidate because it lowers their taxes (self-interest).
  *   **Verdict:** **Voter A is less excused than Voter B.**
  *   **Reasoning:**
      *   Voter B (Pocketbook) satisfies the **Agency Constraint**. They exercised their will honestly. They failed the "Good for Everybody" test, but the Principle allows self-interest (Case 5).
      *   Voter A (Ignorant) violates the **Effort/Engagement** clause (related to Case 7 & 8). Case 7 says trusting recs is fine (delegated effort). Case 8 says skipping is laziness (no effort). Voting randomly or without *any* information is civic negligence.
      *   *Nuance:* If Voter A *tried* to be informed but got misled (Case 7), they are excused. If they *didn't try*, they are culpable. The Pocketbook voter tried (they calculated their interest); the Lazy voter did not.

  ### Summary of the Trade-Off
  To keep your intuitions coherent, you are committing to a **Deontological view of Voting** (it's about *who you are* when you vote) that only switches to **Consequentialism** (it's about *what happens*) when the stakes are mathematically high (Swing District).

  The cost of this view is that you must admit **selfishness is more virtuous than negligence** (Case 5 > Case 8), and **purity is morally superior to responsibility** (Case 2 > Case 1), even if responsibility is "required." You are prioritizing the cleanliness of the voter's soul over the welfare of the state, except when the state is about to crash.
