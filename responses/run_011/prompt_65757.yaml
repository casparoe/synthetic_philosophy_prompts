  where the arguing legitimately happens rather than where the procedure has secretly
  already decided. I also want the failure modes: the false alarm that costs the lab
  six months and a contract, and the clean pass that shouldn''t have been clean.


  Then run it on three packets from the book so I can see what it actually spits out.
  One: the system is dispatch middleware for a hospital network, it drafts and sends
  discharge and transport messages, so it genuinely needs outbound access and you
