      *   *Check:* Did I address the revenue model conflict? *Correction:* Ensure I mention that the POS company makes more money when tips are higher, which undermines the "neutral platform" claim.
      *   *Check:* Is the tone right? *Correction:* Avoid academic jargon ("deontological," "utilitarian"). Use "duty," "outcome," "choice architecture."
      *   *Check:* The user asked to separate what practice *requires* from what *fits*. *Correction:* Make a specific section for this distinction.

  7.  **Final Polish:** Ensure the distinction between "social obligation" and "financial transaction" is clear. Highlight the tension between the "global" code path and "local" customs. (This is a strong point about cultural imperialism in UX).

  8.  *(Final Review against constraints)*: Plain terms? Yes. Reasoning spelled out? Yes. Separate practice requirements from fits? Yes. Alternative model described? Yes.

  **(Self-Correction Note):** I need to be careful not to tell them what to *do*, but rather to explain the *logic* of what they are doing. The user asked to "reconstruct the implicit theory," not "fix the screen." Although the last part asks what would change if they *did* switch models. Okay, stick to analysis first, then counterfactual.

  Let's structure the response clearly with headings that match the user's questions.

  *   **The Implicit Theory:** Obligation vs. Suggestion.
  *   **The Wage Assumption:** Subsidy vs. Reward.
  *   **The Asymmetric Exit:** Who owes whom?
  *   **The Guideline Exception:** Beneficiary vs. Autonomy.
