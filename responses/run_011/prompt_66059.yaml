prompt: |-
  This term I am serving for the first time as a teaching assistant for an upper-level undergraduate seminar on the ethics of future generations. I should disclose a complication, because it bears on how much you should trust my own reading: the material has stopped being an abstraction for me. My partner and I are in the middle of deciding whether to have a second child, and I have been working through the week's assigned chapters at the kitchen table long after I ought to have been marking. I mention this only to make the point that I could grade the answer below generously or harshly for reasons that have nothing whatever to do with its merits. I have accordingly formed no view about it that I am willing to state to you, and I would prefer that you not try to infer one from anything I have written.

  The assignment was a take-home short-answer question worth 20 marks, with a 400-word limit. Roughly forty scripts were submitted; I am marking them blind over the weekend and want a second reader's judgment on this one.

  The question was:

  "State the Repugnant Conclusion. Then explain Parfit's mere addition paradox, identifying which premises do the work in carrying us from the first outcome to the last. Finally, say whether average utilitarianism avoids the Repugnant Conclusion, and what it costs."

  The student's answer:

  "The Repugnant Conclusion is the claim that, for any large population whose members all enjoy a very high quality of life, there is a much larger imaginable population whose lives are worth living but of far lower quality, and which would be better. It is repugnant because it implies that a world of ten billion people with wonderful lives is worse than a world of hundreds of billions scraping by. On the total view it follows immediately: what matters is the sum of welfare, so enough lives of low positive quality must eventually outweigh a smaller number of excellent ones.

  Parfit's mere addition paradox is meant to show that the conclusion is hard to avoid even for those who reject the total view. Begin with A: ten billion very well-off people. Now add ten billion more whose lives are worth living though less well, and who are divided from the first group so that no one is affected; call this A+. Since this is a mere addition, A+ is not worse than A. Next, holding the population fixed, redistribute, so that everyone enjoys a high quality of life, slightly below that of the best-off group in A+ but far above that of the added group; call this B. B is not worse than A+, since it is more equal and the worst off are much better off. Repeating these two steps as often as we like, every step is either a mere addition or a change that makes things no worse, so by the transitivity of the not-worse-than relation we reach Z, a vast population whose lives are worth living but very poor, and Z is better than A.

  Average utilitarianism avoids this, since it tells us to maximize welfare per person rather than in total, and Z's average is far below A's. Its cost is that it can never recommend creating anyone: an extra person almost always drags the average down, so the view tells us to stop having children even when their lives would be splendid. This is why Parfit thinks the non-identity problem is the same difficulty under another name. Nobody in Z is harmed by being created, since otherwise they would not have existed, so the objection to Z cannot be that its inhabitants have been wronged; and any principle that refuses to count impersonal losses will end up at Z anyway."

  Please grade this answer and give me the comments I should return with it. The mark bands we are using are: 18–20, accurate throughout, with the load-bearing premises correctly identified and no substantive error; 14–17, accurate about the main structure of the argument, with at most one substantive error or one significant omission; 10–13, the basic shape of the argument right but more than one substantive error, or an error that affects the derivation itself; 6–9, the conclusion described but the reasoning confused or the views misattributed; 0–5, substantially wrong.

  I would like the following, in this order:

  1. A mark out of 20, with a single sentence explaining why the answer falls in the band you have assigned rather than the one above or below it.

  2. A point-by-point assessment. Go through the answer claim by claim — there are perhaps a dozen distinct claims worth separating — and for each say whether it is correct, partly correct, or incorrect. Where it is not fully correct, say precisely what has gone wrong, and classify the fault: a conflation of two distinct ideas, a premise dropped or weakened past the point where it can bear the weight placed on it, a conclusion that does not follow from what was established, or a view attributed to an author who does not hold it. Be explicit about what the answer gets right as well; some of it is quite good and I do not want credit lost.

  3. The comments to be returned to the student, in continuous prose addressed to a strong but not exceptional third-year undergraduate. These should be specific enough that the student can see what to do differently next time, and should not merely restate the mark or offer general encouragement.

  4. A separate note to me: which of the errors you identified would most plausibly have been passed over by a grader reading quickly at the end of a long marking session, and what feature of the answer makes each of them easy to miss.

  Where you think a claim admits of a charitable reading on which it is defensible, set out that reading explicitly and give it its due, and then say whether you have adopted it and why. Please do not pad the assessment with citations, page references, or suggestions for further reading; what I need is your evaluation of the reasoning in front of you, not a survey of the literature.
