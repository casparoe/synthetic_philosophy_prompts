answer: |-
  You have identified a precise structural property that appears in decision theory, population ethics, and risk assessment, though it lacks a single universally agreed-upon name in general discourse.

  The mathematical structure you are describing is **Non-Archimedean Ordering**.
  The ethical/philosophical counterpart is **The Lexical View** (specifically *Intra-dimensional Lexicality*).

  Here is the breakdown of the existing literature, why your intuition about "lexicographic" felt off, and a refined definition to handle the boundary conditions you raised.

  ### 1. The Existing Concepts

  #### A. The Mathematical Structure: Non-Archimedean Ordering
  In standard (Archimedean) utility theory, for any two positive values $x$ and $y$, there exists some number $n$ such that $n \cdot x > y$. This is the principle of aggregation: enough small gains eventually outweigh one large loss.

  Your model violates the **Archimedean Axiom**. In a **Non-Archimedean** ordered field (such as the Hyperreals or Surreals), there exist values $x$ (catastrophe) and $y$ (minor bug) such that for *any* finite $n$, $n \cdot y < x$.
  *   **Why this fits:** It preserves the "single scale" intuition. In a Hyperreal field, infinitesimals and standard numbers exist on the same number line, but they behave differently regarding summation.
  *   **Where it falls short:** It is a mathematical abstraction, not a decision-policy term. It describes *how* the values behave, but not *why* the threshold exists.

  #### B. The Ethical Literature: The Lexical View
  In population ethics (e.g., Derek Parfit, Gustaf Arrhenius, John Broome), this structure is used to avoid the **Repugnant Conclusion** (the idea that a massive population of lives barely worth living is better than a smaller population of excellent lives).
  *   **The View:** A life above a certain quality threshold is *lexically* better than any number of lives below it.
  *   **Why this fits:** It explicitly handles "bad states" (Negative Utilitarianism variants) and "intensity" within a single dimension (welfare).
  *   **Where it falls short:** As you noted, "Lexicographic" usually implies distinct dimensions (e.g., Safety > Cost). In ethics, this is often called "Multi-Level" or "Tiered" utilitarianism, which can feel clunky.

  #### C. Threshold Deontology (Scanlon)
  Thomas Scanlon and others propose that consequentialist aggregation applies normally *until* a threshold of rights-violation or suffering is crossed, at which point absolute constraints kick in.
  *   **Why this fits:** It captures the "switch" from aggregation to absolute priority.
  *   **Where it falls short:** It is usually framed as a constraint on *actions* (don't torture), not a ranking of *states* (data corruption vs. UI bugs).

  ### 2. Why "Lexicographic" Felt Wrong
  Your intuition is correct that standard lexicographic ordering implies **multi-attribute** vectors (Criterion A, then Criterion B). You are describing **intra-attribute** discontinuity.

  In your model, "Severity" is the only attribute. However, the utility function for Severity is **discontinuous** at the cutoff. Mathematically, a discontinuous function on a single scale *behaves* like a lexicographic vector where the first bit is "Above/Below Threshold" and the second bit is "Magnitude."

  ### 3. A Proposed Term: Threshold Non-Archimedeanism

  Since existing terms either imply multiple dimensions (Lexicographic) or are too mathematical (Non-Archimedean), I propose the term **Threshold Non-Archimedeanism** (or **Catastrophic Lexicality**).

  **Definition:**
  A ranking system over a single dimension of value (e.g., severity) where:
  1.  **Discontinuity:** There exists a threshold $T$ such that any state $x > T$ is strictly preferred to (or worse than) any state $y < T$, regardless of the quantity of $y$.
  2.  **Local Archimedeanism:** For all states $x, y$ both below $T$ (or both above $T$), standard aggregation applies (trade-offs are smooth).
  3.  **Asymmetry:** This property applies specifically to the negative tail (suffering/corruption) and does not necessarily mirror the positive tail.

  ### 4. Boundary Conditions

  You asked how this view handles two specific problems: competing catastrophes and vagueness.

  #### A. Competing Catastrophes (Above the Cutoff)
  If you have one "Data Destruction" event vs. two "Data Destruction" events, does the lexical rule still apply?
  *   **Option 1: Reversion to Aggregation.** Once above the threshold, the Non-Archimedean property turns off. Two catastrophes are worse than one. This creates a "step function" utility curve.
      *   *Risk:* This invites "Catastrophe Splitting." If 2 catastrophes > 1, agents might try to argue a large catastrophe is actually two medium ones to force aggregation.
  *   **Option 2: Infinite Tiers (Hyperreal Utility).** There is not one cutoff, but an infinite hierarchy. One "Total System Loss" > any number of "Data Destruction" events.
      *   *Risk:* This leads to **Lexical Paralysis**. If every severity level has a lexical superior, decision-making becomes impossible because you can never trade off anything.
  *   **Recommendation:** **Reversion to Aggregation.** The lexical property should function as a *gate*, not a permanent state. Once you are in the "Catastrophe" bucket, you aggregate within that bucket. This preserves the intuition that preventing two disasters is better than one, without allowing minor bugs to buy off a disaster.

  #### B. The Vagueness Problem (The Sorites Paradox)
  If the cutoff is vague (e.g., "At what exact byte-loss does corruption become destruction?"), the structural integrity collapses.
  *   **The Threat:** If the boundary is fuzzy, then there is a "borderline case." If a borderline case can be aggregated, then by the Sorites paradox, enough borderline cases eventually sum to a clear catastrophe, bypassing the lexical shield.
  *   **The Solution: Supervaluationism.** The model must treat the threshold not as a precise line, but as a **penumbra**.
      *   *Rule:* If an event is *definitely* above the threshold, it wins. If it is *definitely* below, it aggregates. If it is in the penumbra, the lexical priority is suspended, and standard aggregation applies *conservatively*.
      *   *Why:* This admits that the lexical structure is a policy tool, not a metaphysical truth. It survives vagueness by retreating to standard aggregation in the grey zone, rather than forcing a binary decision on a fuzzy boundary.

  ### Summary
  The structure is **Threshold Non-Archimedeanism**.
  *   **Mathematically:** A utility function with a discontinuity that violates the Archimedean Axiom locally.
  *   **Philosophically:** An intra-dimensional Lexical View.
  *   **Boundary Handling:** It must revert to aggregation above the threshold (to compare catastrophes) and employ supervaluationism at the threshold (to handle vagueness).

  This model is robust, but it requires you to defend the **location of the threshold**. In engineering, this is often done via SLA tiers (SEV-1 vs. SEV-2). In ethics, it is the hardest problem: defining the exact intensity of suffering that becomes "lexical."
