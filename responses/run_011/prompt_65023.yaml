prompt: |-
  I supervise the ethics instruction in a joint task force's pre-deployment training block, and I also hold office hours that service members actually come to. Three questions recur every cycle in nearly the same words: whether a contested or unjust war makes the individual's own lawful conduct wrongful; whether the enemy fighters they kill are legitimate targets in some sense beyond the legal one; and whether they would be obliged to refuse orders, resign, or file for conscientious-objector status if it turned out the cause was unjust. The block currently teaches the traditional position — that combatants on both sides stand in the same moral relation to one another, that the justice of a cause attaches to the political leadership rather than to the individual fighter, and that a fighter who keeps to the rules governing conduct in war is no wrongdoer — and I have watched it come apart in the room, because the members have heard the objection: that liability to be attacked tracks one's own moral responsibility for an unjust threat, so a fighter on the unjust side is not the moral equal of one defending against it, and the traditional symmetry survives at best as a useful convention that an instructor is not entitled to assert as a truth.

  What I need is a decision procedure, not a lecture: a fixed sequence of steps that an instructor or a legal advisor with no graduate training in philosophy can run with one person in twenty minutes. It must begin by identifying which of the three questions is actually being asked, since liability to be attacked, blameworthiness for having taken part, and an obligation to stop taking part are different questions with different answers, and collapsing them is where the current instruction does its damage. Specify what counts as a sufficient answer at each step; identify the steps that turn on facts about the justice of the campaign which the individual cannot reasonably establish, and say what the procedure does with the question at that point; and mark where it terminates in a determinate answer versus where it hands the matter off, because what remains is a question of conscience or of law belonging to the chaplain, the judge advocate, or the conscientious-objector process rather than to me. Anything the procedure produces that bears on a member's decision to disobey or resign must be routed for the judge advocate's and the chaplain's sign-off before it goes back to the member; build that gate into the flow rather than noting it afterward. State explicitly which of the traditional distinctions have to survive the simplification if the procedure is to remain honest, which can be dropped as decoration, and every place where a step is a judgment call wearing the costume of a rule.

  Then run it on three cases. First, a company-grade officer deploying in support of a strike campaign that most of the Security Council and several allies have called unlawful, who wants to know whether every act she performs lawfully in it is nonetheless a wrong. Second, a remote-sensor operator who has spent two years striking members of an enemy militia that conscripts teenagers, and who asks whether those fighters were morally legitimate targets or only legally permissible ones. Third, a senior noncommissioned officer, twenty-two years in, who did everything by the book during an occupation that the procedure's own assessment of the cause classifies as unjust, and who asks whether he may say he did nothing wrong. On the third, do not soften the output: if what the traditional position actually licenses is a narrower claim than the one he wants — freedom from blame as a wrongdoer rather than the absence of anything wrong — say so, and say what the instructor should then do with the gap.

  Finally, tell me where this procedure is most likely to fail. Which of the three cases will it mangle, and why; and what would change your mind about how it should be built — which argument, if sound, would force a rewrite of which step. In particular, say whether you regard the objection from moral responsibility for unjust threats as something a procedure of this kind can absorb while keeping its verdicts intact, or as something that makes the traditional position unavailable to teach at all, and how confident you are in that judgment.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **Role:** Supervisor of ethics instruction in a joint task force's pre-deployment training.
      *   **Context:** Service members attend office hours with three recurring, deep philosophical/legal questions regarding *jus ad bellum* (justice of war) vs. *jus in bello* (conduct in war).
      *   **Problem:** The current teaching (Traditional Just War Theory - symmetry of combatants) is failing because members have heard the "Revisionist" objection (liability tracks moral responsibility for unjust threats).
      *   **Task:** Create a *decision procedure* (fixed sequence of steps), not a lecture.
      *   **Constraints:**
          *   Must be runnable by an instructor/legal advisor without grad philosophy training in 20 mins.
          *   Must distinguish between the three questions (liability to attack, blameworthiness, obligation to refuse/resign).
          *   Must identify steps turning on facts the individual can't know (justice of the campaign).
          *   Must route disobedience/resignation advice through JAG/Chaplain (built-in gate).
          *   Must specify which traditional distinctions survive, which are dropped, and where judgment calls are disguised as rules.
          *   Must apply the procedure to three specific cases.
          *   Must critique the procedure (where it fails, which case is mangled, what argument would force a rewrite).
          *   Must address the "Revisionist Objection" (moral responsibility for unjust threats) explicitly regarding the viability of the Traditional Position.

  2.  **Deconstruct the Three Questions:**

      1.  *Liability:* Are enemy fighters legitimate targets *morally*, not just legally? (Revisionist view: Unjust combatants aren't liable; Traditional view: Yes, they are).
      2.  *Blameworthiness:* Is my lawful conduct wrongful if the war is unjust? (Revisionist: Yes; Traditional: No, if *in bello* rules are followed).
      3.  *Obligation to Exit:* Must I refuse orders/resign if the cause is unjust? (Legal/Conscience mix).

  3.  **Develop the Decision Procedure (The "Algorithm"):**

      *   *Goal:* Triage and categorization, not ultimate metaphysical truth. The instructor isn't a philosopher-king; they are a facilitator of military ethics within a legal framework.
      *   *Step 1: Categorization.* Isolate the specific worry. (Liability vs. Blame vs. Duty).
      *   *Step 2: The Epistemic Limit.* Can the service member *know* the war is unjust? (Crucial pivot). If they can't know, the Traditional Position holds pragmatically. If they *know* (rare), the Revisionist concern gains traction.
      *   *Step 3: Legal/Role Separation.* Distinguish *Jus Ad Bellum* (Leadership) from *Jus In Bello* (Individual).
      *   *Step 4: The Gate.* If the output implies disobedience/resignation, stop and route to JAG/Chaplain.
      *   *Step 5: Output.* Determinate answer vs. Handoff.

      *   *Distinctions to Keep:* Legal vs. Moral (though they overlap), Ad Bellum vs. In Bello, Individual vs. Leadership responsibility.
      *   *Distinctions to Drop:* "Moral Equality of Combatants" as an absolute metaphysical truth (reframe as a functional presumption).
      *   *Judgment Calls disguised as Rules:* Determining "manifest illegality" or "clear injustice."

  4.  **Drafting the Procedure (Iterative refinement):**

      *   *Name:* The "Ad Bellum/In Bello Triage Protocol" (ABIB-TP).
      *   *Step 1:* Identify the Query Type (Targeting, Conduct, Continuation).
      *   *Step 2:* Assess Epistemic Access. (Do you *know* it's unjust or just *suspect*?). This handles the "facts about justice" constraint.
      *   *Step 3:* Apply the Presumption of Regularity. (Unless manifestly illegal, assume *ad bellum* is settled by leadership).
      *   *Step 4:* Check for Manifest Illegality. (If the order itself is a war crime, stop. If the *war* is questionable, continue).
      *   *Step 5:* The Disobedience Gate. (If the member asks about refusing/resigning, JAG/Chaplain sign-off required).
      *   *Step 6:* Final Determination.

  5.  **Applying to Cases:**

      *   *Case 1 (Officer, UN condemnation):* Query Type = Conduct/Blame. Epistemic Access = High (Security Council), but still political. Procedure should route to JAG/Chaplain if she considers refusal, but regarding *conduct*, uphold *in bello* separation.
      *   *Case 2 (Sensor Operator, Child Soldiers):* Query Type = Liability/Targeting. The enemy uses child soldiers. This complicates liability. Procedure must distinguish between the *status* of the fighter (legitimate target) vs. the *morality* of the cause.
      *   *Case 3 (Senior NCO, Unjust Occupation):* Query Type = Blame/Retrospective. He wants to say "I did nothing wrong." Procedure must distinguish "I committed no war crimes" from "The war was not wrongful." It must deny the conflation.

  6.  **Critique and Failure Analysis:**

      *   *Where it fails:* Case 2 is the hardest. The "Revisionist" objection hits hardest here. If the enemy are conscripted kids, are they morally liable? The Traditional view says yes (uniformed combatant). The Revisionist says no (no moral responsibility). The procedure might mangle this by forcing a legal answer on a moral question.
      *   *The Rewrite Trigger:* If the "Manifest Illegality" standard is too high to catch *ad bellum* crimes, the procedure protects injustice. If the "Epistemic Limit" is too strict, it gaslights the member.
      *   *Confidence:* High confidence that the Traditional Position cannot be taught as *moral truth* anymore, only as *operational protocol*. The Revisionist objection is philosophically robust.

  7.  **Refining the Output (Self-Correction during drafting):**

      *   *Correction:* Make sure the JAG/Chaplain gate is *inside* the flow, not an afterthought.
      *   *Correction:* Ensure the distinction between "wrongdoer" and "participant in a wrong" is clear in Case 3.
      *   *Correction:* Be honest about the "Judgment Call." The step where we decide if the war is "clearly unjust" is the weak point.
      *   *Tone:* Professional, direct, institutional but ethically rigorous. No fluff.

  8.  **Final Review against Constraints:**
      *   20 mins? Yes, it's a flowchart logic.
      *   No grad philosophy? Yes, uses military legal terms.
      *   Three questions distinguished? Yes.
      *   JAG/Chaplain gate built-in? Yes.
      *   Distinctions marked? Yes.
      *   Three cases run? Yes.
      *   Failure analysis included? Yes.
      *   Revisionist objection addressed? Yes.

  9.  **Final Polish:** Check the specific wording on Case 3 ("do not soften the output"). Ensure the distinction between *culpability* and *causal contribution* is clear. (Proceed to generate response).

  *(Self-Correction on Case 2)*: The prompt asks about the *enemy fighters* (conscripted teenagers). The Traditional view says they are targets. The Revisionist view says they might not be liable. The procedure needs to handle this without the instructor making a metaphysical ruling. The procedure should defer to ROE (Rules of Engagement) for the *legal* target status but acknowledge the moral distress. Actually, the prompt asks if they were *morally* legitimate. The procedure must admit it cannot answer the *moral* liability definitively, only the *legal* one, and route the moral distress to the Chaplain.

  *(Self-Correction on Case 3)*: The NCO wants to say "I did nothing wrong." The procedure must say: "You committed no crimes (In Bello), but you participated in an unjust project (Ad Bellum)." The gap is between *personal guilt* and *moral purity*.

  *(Self-Correction on the "Revisionist Objection")*: I need to be clear. The Traditional Position *cannot* survive as moral truth. It survives only as a functional necessity for military cohesion and legal clarity. The procedure must reflect this limitation.

  10. **Finalizing the Text.** (Drafting the response based on these thoughts).
answer: |-
  ### The Ad Bellum/In Bello Triage Protocol (ABIB-TP)

  **Purpose:** To distinguish between legal liability, moral blameworthiness, and duty to disobey within a 20-minute consultation.
  **Operator:** Ethics Instructor or Legal Advisor (Non-Philosopher).
  **Constraint:** This procedure does not resolve metaphysical truths about war. It resolves institutional categorization to prevent role confusion and unauthorized disobedience.

  #### Phase 1: Categorization (Minutes 0–5)
  **Step 1.1:** Ask the member to select one primary concern.
  *   **A (Targeting):** "Am I allowed to kill them, morally, not just legally?"
  *   **B (Conduct):** "If I follow the rules, am I still doing wrong because the war is wrong?"
  *   **C (Continuation):** "Must I stop, resign, or refuse orders because the war is wrong?"

  *   **Sufficient Answer:** A single letter selection. If the member mixes them, force a choice: "Which one keeps you awake at night?"
  *   **Judgment Call Disguised as Rule:** Members often conflate B and C. The instructor must treat them as distinct. B is about *past/present guilt*; C is about *future obligation*.

  #### Phase 2: Epistemic Assessment (Minutes 5–10)
  **Step 2.1:** Ask: "On what basis do you judge the cause unjust?"
  *   **Option 1:** Public disagreement (UN resolutions, ally statements, media reports).
  *   **Option 2:** Manifest Illegality (Orders to commit war crimes, clear violation of the UN Charter known to the individual).

  *   **Sufficient Answer:** Classification as Option 1 or Option 2.
  *   **The Epistemic Limit:** An individual service member **cannot** reasonably establish Option 2 regarding *jus ad bellum* (the war itself) unless the order to deploy itself violates domestic or international law in a way that is criminally obvious (e.g., an order to invade a neutral ally without cause *and* without authorization). Option 1 is insufficient to trigger individual *ad bellum* liability.
  *   **Procedure Action:**
      *   If **Option 1**: Proceed to Phase 3. The question of the war's justice is treated as *institutionally settled* for the purpose of individual conduct.
      *   If **Option 2**: Stop. This is a legal emergency. Route immediately to Judge Advocate General (JAG). Do not proceed to Phase 3.

  #### Phase 3: The Separation of Spheres (Minutes 10–15)
  **Step 3.1:** Apply the Traditional Distinction.
  *   **Rule:** *Jus Ad Bellum* (Justice of War) is the responsibility of political leadership. *Jus In Bello* (Conduct in War) is the responsibility of the combatant.
  *   **Instruction:** "Your moral agency is bounded by your control. You control your compliance with the Law of Armed Conflict (LOAC). You do not control the decision to deploy."

  *   **Distinctions That Must Survive:**
      1.  **Leadership vs. Individual:** Political leaders bear the burden of *ad bellum* justice.
      2.  **Legal vs. Moral:** LOAC compliance grants legal immunity; it does not guarantee moral purity, but it is the only metric the military can adjudicate.
  *   **Distinctions Dropped as Decoration:**
      1.  **"Moral Equality of Combatants" as Truth:** Do not assert that unjust combatants are *morally equal* to just ones. Assert only that they are *legally symmetrical* for the purposes of targeting and prosecution.
      2.  **"Useful Convention":** Do not admit this is just a convention. State it as the **Operational Standard**. To call it a convention invites the member to opt out.

  *   **Judgment Call Disguised as Rule:** Step 3.1 assumes the member accepts the division of labor. If they reject the premise that leadership bears the *ad bellum* burden, the procedure cannot convince them. It can only inform them of the consequence of rejection (insubordination).

  #### Phase 4: The Disobedience Gate (Minutes 15–20)
  **Step 4.1:** Check the Output against Category C (Continuation).
  *   **Condition:** If the member's conclusion in Phase 3 leads them to consider refusing orders, resigning, or filing for Conscientious Objector (CO) status.
  *   **Action:** **HARD STOP.** The instructor has no authority to validate refusal.
  *   **Routing:** The output must be: "Your ethical concern regarding continuation requires legal and spiritual adjudication. I am initiating a referral to JAG and Chaplain. You will not act on this impulse until they sign off."
  *   **Gate Logic:** No advice bearing on disobedience leaves this room without JAG/Chaplain signatures. This is not a suggestion; it is a firewall against unlawful discharge or court-martial.

  **Step 4.2:** Final Determination for Categories A and B.
  *   **If A (Targeting):** "Legally, they are targets. Morally, that is a question of conscience, but acting on a belief that they are not targets without legal grounds is a crime." -> **Handoff to Chaplain for moral distress.**
  *   **If B (Conduct):** "If you follow LOAC, you are not a war criminal. Whether you are a 'wrongdoer' in a metaphysical sense is not a military question." -> **Determinate Answer: You are not liable for prosecution.**

  ---

  ### Application to Cases

  #### Case 1: The Company-Grade Officer (UN Condemnation)
  *   **Input:** Category B (Conduct/Blame). "Is my lawful conduct wrongful?"
  *   **Phase 2 Assessment:** Option 1 (Public disagreement/UN resolution). She does not have epistemic access to *manifest illegality* of the order to deploy, only political controversy.
  *   **Phase 3 Application:** *Ad bellum* responsibility rests with leadership. Her *in bello* conduct is the only metric of her professional ethics.
  *   **Phase 4 Gate:** She is not asking to refuse orders yet, only assessing blame.
  *   **Output:** "Under the Operational Standard, your conduct is judged by LOAC compliance, not the Security Council's political assessment. You are not legally wrongful. Whether the campaign's injustice taints your moral record is a question of conscience, not military ethics."
  *   **Routing:** None required unless she indicates intent to refuse future orders.
  *   **Gap:** The procedure validates her legal safety but leaves the moral stain unaddressed. This is intentional; the military cannot adjudicate the "moral stain" of a political decision.

  #### Case 2: The Remote-Sensor Operator (Conscripted Teenagers)
  *   **Input:** Category A (Targeting/Liability). "Were they morally legitimate targets?"
  *   **Phase 2 Assessment:** Option 1. The enemy's internal conscription practices do not make the U.S. campaign manifestly illegal.
  *   **Phase 3 Application:** Here the Traditional Distinction strains. Legally, they were combatants. Morally (Revisionist view), their lack of responsibility reduces their liability.
  *   **Procedure Action:** The procedure **cannot** answer the moral question without violating the "No Grad Philosophy" constraint.
  *   **Output:** "Legally, they were permissible targets under ROE. Morally, their status is debated. However, treating them as non-targets without legal authority would violate LOAC."
  *   **Routing:** **Mandatory Handoff to Chaplain.** The distress here is moral injury, not legal ambiguity. The instructor must not attempt to resolve the "moral liability" of child soldiers.
  *   **Gap:** The procedure admits it cannot reconcile the legal permission with the moral hesitation. It prioritizes legal safety over moral resolution.

  #### Case 3: The Senior NCO (Unjust Occupation)
  *   **Input:** Category B (Retrospective Blame). "May I say I did nothing wrong?"
  *   **Phase 2 Assessment:** The procedure's own assessment (per prompt) classifies the cause as unjust. We accept this as a given for the case.
  *   **Phase 3 Application:** *Ad bellum* was unjust (Leadership fault). *In bello* was compliant (NCO fault).
  *   **Phase 4 Gate:** No refusal involved; this is retrospective.
  *   **Output:** "You may say you committed no war crimes. You may not say you did 'nothing wrong' if the cause was unjust. You participated in an unjust project, even if your hands are clean of specific crimes. The Traditional Position licenses freedom from *prosecution*, not freedom from *complicity*."
  *   **Instructor Action:** Do not soften this. The NCO seeks moral absolution the procedure cannot grant.
  *   **Gap:** The gap is between *culpability* (punishable) and *complicity* (moral). The instructor must tell the NCO: "You are not a criminal. You are a participant. Distinguish these when you speak."
  *   **Routing:** Handoff to Chaplain for absolution/counseling. The military ethics instructor cannot grant moral absolution for *ad bellum* complicity.

  ---

  ### Failure Analysis and Revision Triggers

  #### Where the Procedure Will Fail
  **Case 2 (The Sensor Operator) will be mangled.**
  *   **Why:** The procedure forces a binary: Legal Target vs. Moral Conscience. It treats the moral status of the enemy as a "Chaplain problem." But the operator's question is about *liability to be killed*, which is the core of the Revisionist objection. By routing this to the Chaplain, the procedure implicitly admits that the military's ethical framework cannot justify the killing morally, only legally. This validates the member's suspicion that the "Traditional Position" is a hollow legal shield.
  *   **Consequence:** The member may feel the instructor is dodging the hard truth. The procedure protects the institution, not the member's conscience.

  #### The Rewrite Trigger
  **The Argument:** "If *jus ad bellum* is objectively unjust, *jus in bello* compliance is insufficient to negate moral liability for killing."
  *   **Impact:** If this argument is accepted as *teachable truth* rather than *philosophical contention*, Step 3.1 (The Separation of Spheres) collapses. You cannot teach that leadership bears *ad bellum* responsibility if the moral consequence of an unjust war flows directly to the trigger-puller.
  *   **Required Change:** The procedure would need to add a step allowing for "Manifestly Unjust Campaigns" where *in bello* compliance is acknowledged as morally insufficient. This would require JAG to define "Unjust Campaign" legally, which they cannot do without politicizing the military.

  #### Viability of the Traditional Position
  **Judgment:** The Traditional Position (Symmetry of Combatants) is **unavailable to teach as moral truth**. It can only be taught as **operational protocol**.
  *   **Confidence:** High. The Revisionist objection (liability tracks responsibility) is philosophically dominant in contemporary ethics. To teach symmetry as *truth* is to lie to educated service members.
  *   **Absorption:** The procedure *absorbs* the objection by compartmentalizing it. It says: "Philosophically, you might be right. Legally/Institutionally, you must act as if symmetry holds."
  *   **Risk:** This creates a "dual consciousness" in the force. Members learn to act one way and believe another. This is stable for operations but unstable for long-term moral health (moral injury).

  #### Final Warning
  The weak point is **Step 2.1 (Epistemic Assessment)**. It relies on the member accepting that they cannot know the war is unjust. If a member presents evidence of aggression that meets the legal definition of a "Crime of Aggression," Step 2.1's dismissal of Option 1 becomes a lie. If that happens, the procedure protects the member from court-martial but fails to protect them from being an instrument of injustice. No procedural tweak fixes this; only actual political justice does.
