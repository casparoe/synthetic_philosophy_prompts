answer: |-
  The empirical evidence regarding introspective access substantiates the readout reading of the user-illusion metaphor rather than the interface reading, implying that illusionism survives only conditionally: it must demonstrate that introspective compression generates specific categorical falsehoods about mental ontology rather than mere informational loss, while the self-undermining worry regarding the theory's own derivation fails to discriminate between the views because both treat introspection as a fallible instrument subject to third-person calibration.

  To adjudicate this dispute, one must first rigorously distinguish the two interpretations of the user-illusion metaphor. On the *interface* reading, championed by illusionists like Keith Frankish, a phenomenal state is akin to a desktop icon: the icon of a trash bin does not resemble the physical deletion process it triggers, nor is it intended to; its content is systematically false regarding the underlying machinery because its function is purely pragmatic control. On the *readout* reading, favored by deflationary realists, a phenomenal state resembles a fuel gauge: it does not show the shape of the tank or the chemical composition of the fuel, but it accurately indicates the quantity remaining. Here, the representation is lossy and coarse, but not false; it is a simplified truth rather than a useful fiction. It is settled among theorists that introspection is not a direct pipeline to neural reality; everyone agrees that we do not introspect action potentials or neurotransmitter levels. What remains genuinely contested is whether this opacity entails that the *content* of introspection is non-veridical (Interface) or merely incomplete (Readout).

  The empirical considerations usually marshalled for the user-illusion picture initially favor the readout reading. It is an established finding in cognitive science that introspective access is schematic, lossy, and blind to its own computational machinery. We experience a unified self where there is a modular multiplicity, and we experience smooth continuity where there is discrete processing. However, on their face, these findings establish compression rather than falsity. A map that omits topography is not a false map; it is merely low-resolution. For the illusionist to close the gap between evidence (compression) and claim (falsity), they must argue that the specific nature of the compression misrepresents the *category* of the underlying state, not just its details. The illusionist must show that introspection does not merely hide the physical nature of experience but positively represents it as non-physical, ineffable, or intrinsic when it is none of those things. This is a heavier burden than simply pointing to informational loss. If the readout reading is correct, the "illusion" is merely a lack of detail, meaning phenomenal consciousness exists exactly as a coarse-grained physical state, which undermines the eliminativist core of illusionism.

  This leads to the self-undermining worry: if the theory claims that introspective faculties deliver a user illusion, is the theory itself not a product of those same faculties? If the instrument is demoted, can it diagnose its own demotion? This worry is not fatal, nor does it discriminate between the interface and readout readings. Both views accept that introspection is a naturalistic phenomenon subject to error and distortion. Neither view relies solely on introspection to prove introspection's fallibility; both rely on third-person cognitive science to diagnose the limitations of first-person access. The theory is not delivered *by* the faculty in the sense of being an introspective datum, but *about* the faculty via empirical investigation. Therefore, the worry bears equally on both readings: if the readout theorist claims introspection is merely coarse, they too rely on cognitive instruments to determine what is being compressed. The coherence of either position depends on the reliability of third-person science, not the veridicality of introspection.

  Consequently, the verdict favors the readout reading based on the available evidence. The data shows that consciousness is a simplified model generated by the brain for the brain, but simplification is not elimination. A fuel gauge is not an illusion of fuel; it is a real indicator of a real state. If the interface reading were true, we would expect evidence that phenomenal concepts refer to nothing at all, yet the functional role of phenomenal states is robustly real. Illusionism survives only under a precise condition: it must pivot from denying the existence of phenomenal states to denying the correctness of the *folk-theoretic interpretation* of those states. In other words, illusionism can remain viable only if it concedes that there are real, coarse-grained physical states (readouts) but maintains that the common sense belief that these states possess non-physical qualia is the actual illusion. Without this concession, the evidence of compression supports a deflationary realism where conscious experience exists as a valid, albeit low-resolution, representation of internal conditions, rendering the strong eliminativist claim of the interface reading unsupported by the very empirical data it cites.
