      Leaf 1: Path 1(No) → 2(No) → 6(Yes)
      Label: Deflationary Conventionalism
      Awkward Commitment: The entire debate is verbal, meaning biologists and philosophers are agreeing on the data but fighting over labels.
      Concrete Test: Sickle cell and malaria; everyone agrees on the frequency data, the dispute is only whether to call the mechanism a "law" or a "tendency."

      Leaf 2: Path 1(No) → 2(No) → 6(No)
      Label: Logical Definitionalism
      Awkward Commitment: The core principle is true by definition, so it cannot be false, yet it still organizes scientific research.
      Concrete Test: Antibiotic resistance; we define the resistant bacteria as "fitter" in that environment, making the survival claim necessarily true.

      Leaf 3: Path 1(No) → 2(Yes) → 3(No) → 4(No)
      Label: Popper (Early Verdict)
      Awkward Commitment: Darwinism is a metaphysical research programme rather than a testable theory, despite being the foundation of modern biology.
      Concrete Test: None accepted as a genuine test of the theory itself; industrial melanism is viewed as an illustration of the programme, not a falsification attempt.

      Leaf 4: Path 1(No) → 2(Yes) → 3(Yes) → 4(No)
      Label: Popper (Post-Retraction Verdict)
      Awkward Commitment: The theory is testable even if fitness is often measured post-hoc, requiring a broader definition of empirical testing than previously held.
      Concrete Test: Industrial melanism; the reversal of moth color frequencies when pollution decreased counted as a genuine test that the theory passed.

      Leaf 5: Path 1(Yes) → 3(Yes) → 4(No) → 5(Yes)
      Label: Propensity Interpretation
      Awkward Commitment: Fitness is a probabilistic disposition like a coin's bias, meaning the fittest individual can still die without disproving the theory.
      Concrete Test: Drought-driven beak shifts in finches; average beak depth changes statistically as predicted, even if some deep-beaked individuals die.

      Leaf 6: Path 1(Yes) → 3(Yes) → 4(No) → 5(No)
      Label: Model-Based Instrumentalism
      Awkward Commitment: We do not care if the selection model is true, only if it helps us calculate and predict population changes accurately.
      Concrete Test: The long-term E. coli experiment; models are accepted based on predictive fit over 50,000 generations, regardless of underlying causal truth.

      Leaf 7: Path 1(Yes) → 3(No) → 4(Yes)
      Label: Historical Narrative View
      Awkward Commitment: Evolutionary biology is a historical science that explains past sequences rather than discovering universal laws of nature.
      Concrete Test: Horse evolution; the sequence of fossil changes is explained as a unique narrative, not an instance of a covering law.

      Leaf 8: Path 1(Yes) → 3(Yes) → 4(Yes)
      Label: The Split View
      Awkward Commitment: Population genetics contains the real laws, while "selection theory" is merely a lawless verbal sketch used for teaching.
      Concrete Test: Hardy-Weinberg deviations; the math shows the law, while the talk of "predation pressure" is just a qualitative description of the variables.

      Leaf 9: Path 1(Yes) → 3(No) → 4(No) → 5(Yes)
      Label: Causal Realism
      Awkward Commitment: Selection is a genuine causal force like gravity, but it can be masked by other forces without ceasing to exist.
      Concrete Test: Pesticide resistance; the causal power of the toxin exists even if the pest population fails to evolve resistance due to lack of genetic variation.

      Leaf 10: Path 1(No) → 2(Yes) → 3(No) → 4(Yes)
      Label: Empty Cell (The Metaphysical Mathematician)
      Awkward Commitment: This position claims the math is the only real part, yet admits failure doesn't count against it, rendering the math non-empirical.
      Concrete Test: None; this position is incoherent because it treats the mathematics as both law-like and immune to counter-evidence.

  Honest Parts

  Indistinguishable Leaves: Leaf 4 (Popper Late) and Leaf 5 (Propensity) are difficult to separate with this tree. Both accept post-hoc measurement risks but insist on testability. To separate them, you would need to ask: "Is fitness a property of the individual organism, or a statistical property of the type?" Propensity says individual disposition; Popper Late is often vaguer, focusing on the theory's structure.

  Empty Cells Diagnosis:
  1. Path 1(No) → 2(No) → 3(Yes): "It's a tautology, but failure proves it wrong." This is incoherent. If the statement is true by definition (renaming winners), no outcome can count against it.
  2. Path 1(Yes) → 3(No) → 4(No) → 5(No): "We measure before, failure doesn't matter, and truth doesn't matter." This is unattractive. It combines the effort of independent measurement with a refusal to let data constrain the model, making the measurement pointless.
  3. Path 1(No) → 2(Yes) → 3(Yes) → 4(Yes): "We measure after, it tells us something, failure counts, but only math is real." This is genuinely unexplored. It suggests a view where the verbal theory is empirically testable but ontologically secondary to the math, yet the math is not the source of the testability. Someone should sit here.

  Load-Bearing Question: Question 3 ("If a population fails to change... does that failure count as evidence against the theory?"). If you delete this question, Leaf 3 (Popper Early) and Leaf 4 (Popper Late) collapse into a single position. This question marks the substantive philosophical difference in Popper's mind: not whether the theory looks circular (he always worried it did), but whether that circularity disqualifies it from the realm of empirical science. The retraction was not a change in biology, but a change in the demarcation criteria for what counts as a test.
