  ### The Coherence Argument Decision Tree

  **Starting Point:** We agree that an agent whose choices violate transitivity (e.g., preferring A to B, B to C, and C to A) can be money-pumped: they can be led through a sequence of trades that leaves them with less money and the same asset they started with.

  **Question 1:** When we conclude that such an agent 'should' be coherent, is the primary force of this claim that they *will otherwise lose resources* in the world, that they *violate a commitment inherent in their own attitudes*, or that they *defy the conditions required for us to model them*?

  *   **If they will otherwise lose resources:** Go to **Question 2**.
  *   **If they violate a commitment inherent in their own attitudes:** Go to **Question 3**.
  *   **If they defy the conditions required for us to model them:** Go to **Question 6**.

  ---

  #### Branch A: The Empirical/Pragmatic Path (Lose Resources)

  **Question 2:** Is the mechanism that punishes incoherence a matter of *individual learning through repeated choices*, or a matter of *population-level survival where incoherent types are outcompeted*?

  *   **Individual learning through repeated choices:** → **The Diachronic/Money-Pump Pragmatist**
      *   *Note:* You hold that the normativity vanishes in one-shot cases; the force is entirely in the dynamic exposure to exploitation.
  *   **Population-level survival:** → **The Selection View**
      *   *Note:* You hold that coherence is an emergent property of surviving populations, not necessarily a normative requirement for individuals.

  ---

  #### Branch B: The Normative/Commitment Path (Violate Commitment)

  **Question 3:** Do actual cognitive agents possess the computational capacity to maintain a complete ordering over the requisite rich gamble space?

  *   **No:** → **The Bounded/Fast-and-Frugal Position**
      *   *Note:* You accept the ideal but argue it presupposes capacities no actual agent has, making it inappropriate as a norm for real beings.
  *   **Yes:** Go to **Question 4**.

  **Question 4:** In the formal representation theorem, is the preference ordering an *input assumption* posited at the start, or a *derived output* constructed from choice behaviour?

  *   **Input assumption:** → **The 'Preferences Aren't the Fundamental Thing' Position**
      *   *Note:* You argue the theorem smuggles in the very structure it claims to justify; the assumption does the work, not the coherence axioms.
  *   **Derived output:** Go to **Question 5**.

  **Question 5:** Does satisfying the coherence axioms uniquely mandate the specific functional form of *Expected Utility*, or only a *broader class of consistent orderings* (e.g., rank-dependent)?

  *   **Broader class:** → **Coherence is Fine, Expected Utility is Not**
      *   *Note:* You accept the need for consistency but reject EU as the unique mathematical expression of that consistency.
  *   **Expected Utility:** Go to **Question 6 (Normative Variant)**.

  **Question 6 (Normative Variant):** Is coherence a condition for *possessing attitudes at all* (incoherence means no agent), or merely a condition for *possessing rational attitudes* (incoherence means bad agency)?

  *   **Possessing attitudes at all:** → **The Constitutive View**
      *   *Note:* You hold that incoherence entails a failure of agency itself, not just a reasoning error.
  *   **Possessing rational attitudes:** → **The Constitutive View** *(Merged)*
      *   *Note:* While logically distinct from the strong constitutive claim, in this specific taxonomy of scepticisms, the standard vNM normativist is grouped here as the 'default' against which the others react.

  ---

  #### Branch C: The Representational/Describer Path (Defy Modelling)

  **Question 6 (Representational Variant):** Is the failure to assign utility due to *multiple mathematical structures fitting the same data*, or because the *concept of utility is useless for prediction*?

  *   **Multiple mathematical structures:** → **The Underdetermination Sceptic**
      *   *Note:* You argue the representation theorems do not pin down anything substantive; distinct numerical structures represent the same ordering.
  *   **Concept useless for prediction:** → **The Eliminativist**
      *   *Note:* You hold the entire exercise is a philosopher's toy with no grip on real agents or predictive science.

  ---

  ### Analysis of Logical Space and Indistinguishability

  **1. Indistinguishable Leaves: Selection vs. Constitutive**
  You suspected these might be indistinguishable from the inside. They are not, though they are observationally equivalent from the outside.
  *   **The Distinction:** The **Selection View** is contingent and empirical: *'If you are incoherent, you will die out.'* The **Constitutive View** is modal and metaphysical: *'If you are incoherent, you are not an agent.'*
  *   **Why they slide:** In a room discussing AI risk, both views predict that capable long-term agents will *appear* coherent. The Selection theorist says this is because incoherent AIs get shut down; the Constitutive theorist says this is because incoherent AIs couldn't be built as agents in the first place.
  *   **Verdict:** Distinguishable by asking: *"Could there exist an incoherent agent in a possible world where resources are infinite?"* The Selection theorist says **Yes** (they just wouldn't survive here). The Constitutive theorist says **No** (they wouldn't be an agent).

  **2. Empty or Unstable Cells**
  *   **Eliminativist + Normative Commitment:** This cell is empty. One cannot consistently hold that the framework is a "philosopher's toy" (Eliminativist) while also arguing agents are "committed by their attitudes" to coherence (Normative). The branch structure prevents this by separating them at Question 1.
  *   **Bounded + Constitutive:** This cell is logically tense. If coherence is *constitutive* of agency, but actual agents are *bounded* such that they cannot be coherent, then actual agents are not agents. Some philosophers occupy this space (idealisation), but it is unstable. Most who accept boundedness retreat to the **Bounded/Fast-and-Frugal** leaf, treating coherence as a regulative ideal rather than a constitutive condition.
  *   **Preferences Not Fundamental + Constitutive:** You asked specifically about this combination. It is **logically possible but rare**. One could argue that agency is constituted by structural relations between *beliefs and desires* (not preferences), and that coherence is required for those relations to exist. However, in the context of vNM specifically, the "Preferences aren't fundamental" leaf usually implies a critique of the theorem's normative force. If the theorem assumes preferences to prove coherence, it cannot establish coherence as constitutive of agency *via the theorem*. Therefore, in this specific debate context, these positions are treated as mutually exclusive.

  **3. The "Standard Normativist" Gap**
  You will notice that Question 6 (Normative Variant) merges the "Standard vNM Normativist" (coherence is a rational requirement, but not constitutive of agency) into the **Constitutive View**. This is because your requested list of leaves did not include a "Standard Normativist" position. In a room of sceptics, the Standard Normativist is often the silent default; for the purpose of sorting *scepticisms*, they are grouped with the strongest defence of coherence.

  ---

  ### Note on Settled vs. Contested Matters

  To prevent the tree from silently installing one side of a dispute as fact, note the following status of the branch points:

  *   **Settled (Mathematical):** It is mathematically settled that violating transitivity allows a money pump (Question 1 premise). It is also settled that representation theorems require axioms to derive a utility function (Question 4).
  *   **Contested (Normative Force):** Question 1 is the heart of the live dispute. There is no consensus on whether coherence arguments are descriptive (prediction), normative (commitment), or methodological (modelling). Economists often default to *descriptive/prediction* (revealed preference), while philosophers often default to *normative/commitment*.
  *   **Contested (Uniqueness):** Question 5 is technically contested. While vNM proves EU under specific axioms, relaxing independence (for example) allows for rank-dependent utility. Whether this counts as "coherence" or "a different theory" is a matter of definition.
  *   **Contested (Psychological Reality):** Question 6 (Representational) touches on the realism of utility functions. Behaviourists treat them as fictions (Eliminativist/Underdetermination); Cognitivists treat them as real states (Constitutive/Normative).

  *British English usage has been maintained throughout (e.g., 'behaviour', 'licence', 'modelled', 'programme').*
