  1. You rest heavily on the uncertainty of deterrence. If the numbers turned tomorrow and showed a clear benefit, does your moral objection stand alone?
  [He will likely concede the principle stands regardless of statistics, grounding opposition in the example the state sets.]
  Then is the empirical argument merely decoration for a moral absolute?

  2. You claim the state kills with cold premeditation, unlike the criminal. But a retributivist demands punishment because it is deserved. Why does your comparison touch him?
  [He will likely argue the state must be morally superior to the criminal it punishes.]
  If the criminal's act was equally cold and calculated, does the state regain the right to match it?

  3. You open with your father's nausea at seeing the guillotine. Is this proof that execution is unnatural, or simply rhetoric to make us sick too?
  [He will likely say it reveals the truth hidden by secrecy and euphemism.]
  If the public watched and felt no nausea, would the truth change?

  4. You propose hard labor for life as a reversible alternative. Is twenty years of lost freedom not also irreparable if the court later finds innocence?
  [He will likely say life remains, allowing for repentance and correction.]
  You value the possibility of repentance over the certainty of lost years?

  5. You suggest letting the condemned choose the method or time. Does granting this choice cleanse the state of the murder, or merely share the guilt?
  [He will likely say it reduces horror while moving toward abolition.]
  Is a consensual execution still an execution the state should perform?

  6. You argue the death penalty belonged to a society believing in divine atonement. Does your abolitionism collapse if society returns to that belief?
  [He will likely say man cannot usurp God's role of final judgment.]
  So your position holds only so long as we remain secular?

  7. In forty-five you signed the petition for Brasillach, whose work you despised. Was this consistency, or a price you paid to keep your hands clean?
  [He will likely say the principle of opposing death must be absolute, regardless of the man.]
  Does protecting a man who would destroy free speech protect the principle or weaken it?

  8. In Algeria, killings mount on both sides. You forbid the state to execute a convict, but what principle forbids the state to kill in war while allowing it to police?
  [He will likely say war is a state of exception; justice must remain pure law.]
  If the law authorizes the war, is the distinction only in the uniform worn?

  9. What single piece of evidence, or concession from a defender, would force you to accept the guillotine again?
  [He will likely hesitate, citing social collapse or the end of all order.]
  Then your absolutism is contingent on social stability?
