  | :--- | :--- | :--- | :--- | :--- |
  | **Globe Ballet** | Hynkel's specific narcissism and psychosis drive the desire for world domination; without his ego, the expansion stops. | The balloon represents the fragility of imperialist economics; the system demands expansion until it bursts, regardless of the dancer. | **Great Man** | Ignores the pressure from the military-industrial complex (Herring) that necessitates expansion for economic survival. |
  | **Invasion of Osterlich** | The war is triggered by Hynkel's personal rivalry with Napaloni; a different leader might have sought diplomacy. | The invasion is inevitable due to the regime's need for external conflict to sustain internal cohesion and military spending. | **Both** | Great Man ignores geopolitical inevitability; Structural ignores the specific timing and escalation caused by Hynkel's volatility. |
  | **Duck-Hunting Mix-up** | The confusion is a comic accident; the true authority resides in the specific individual's charisma, which the Barber lacks until he speaks. | The stormtroopers cannot tell the difference, proving the leader is an interchangeable functionary of the state apparatus. | **Structural** | Must explain why the Barber is able to resist the role's script once installed, suggesting the individual *does* matter after all. |
  | **Closing Address** | The Barber's humanist speech changes the trajectory of the state; a moral individual can repurpose the machinery of dictatorship for good. | The speech is utopian fantasy; the army and ministries remain intact, implying the structural capacity for violence remains unchanged. | **Great Man** | Ignores the historical reality that institutions (army, bureaucracy) resist moral re-education from the top down without structural purging. |
  | **Chaplin's Autobiography Remark** | Admitting the target was "too small" concedes that focusing on the leader (Great Man) missed the broader societal culpability. | Acknowledges that the horror was systemic/industrial, making a satire of the figurehead insufficient to explain the evil. | **Structural** | Risks absolving the leader of specific guilt by diffusing responsibility entirely into the "system." |
