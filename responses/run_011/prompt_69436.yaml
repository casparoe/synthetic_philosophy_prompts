answer: |-
  **Purpose and Scope**

  This specification defines the requirements for a theory of intellectual ownership adequate for university technology-transfer policy. The goal is not metaphysical truth but institutional functionality: the theory must resolve disputes over allocation, licensing, and revenue sharing between students, faculty, and the university. Consequently, the theory is constrained by administrative reality; it must operate where provenance is messy, incentives are mixed, and legal regimes (patent, copyright, trade secret) overlap. A theory that is philosophically elegant but administratively unenforceable is inadequate for this purpose. The list below prioritizes clarity in assignment and risk mitigation over moral consistency. It seeks to transform vague intuitions about "owning ideas" into actionable rules for governing licensable assets.

  **The Desiderata**

  1.  **Rivalry-Relocation Requirement**
      *   *Statement:* The theory must identify the specific scarce resource being allocated, acknowledging that the idea itself is non-rivalrous. It must locate the rivalry in market position, first-mover advantage, or regulatory exclusion rather than in the consumption of the information.
      *   *Motivation:* Without this, policy treats ideas like physical property, leading to absurd claims over independent discovery or fundamental truths. It clarifies that we are allocating rights to *exploit*, not rights to *know*.
      *   *Tag:* **Non-negotiable.** Any theory treating the idea as a rivalrous object fails to describe the economic reality of licensing.

  2.  **Object Individuation Requirement**
      *   *Statement:* The theory must provide a principled method for bounding the owned item, distinguishing the specific claim from the general problem, the embodiment from the equivalence class, and the expression from the underlying method.
      *   *Motivation:* Ideas lack natural joints. Without clear individuation, ownership claims become infinitely expansive (owning "the concept of machine learning") or vanishingly narrow (owning only one specific line of code), creating litigation risk.
      *   *Tag:* **Non-negotiable.** Policy cannot allocate what it cannot define.

  3.  **Priority-Resolution Requirement**
      *   *Statement:* The theory must specify a rule for adjudicating independent, simultaneous creation, explicitly stating whether priority tracks filing date, reduction to practice, or conception, and why.
      *   *Motivation:* As noted in pressure point (c), copyright and patent diverge here. A university policy must choose a lane to determine whether a student who publishes before filing forfeits rights, regardless of independent effort.
      *   *Tag:* **Negotiable.** The institution can choose a first-to-file or first-to-invent standard, provided it is explicit.

  4.  **Improvement Accommodation Requirement**
      *   *Statement:* The theory must explain the relationship between the original claim and downstream improvements, specifying whether the original owner's rights extend to derivatives or are blocked by them.
      *   *Motivation:* Pressure point (d) highlights that improvers often invest more labor than originators. A theory that grants the originator total veto power over improvements stifles the very innovation the university claims to promote.
      *   *Tag:* **Negotiable.** This is a policy choice between broad exclusion (patent-like) and limited remuneration (compulsory licensing).

  5.  **Attribution-Control Decoupling Requirement**
      *   *Statement:* The theory must distinguish between moral rights (credit, reputation, citation) and economic rights (exclusion, licensing revenue), treating them as separable interests that may vest in different parties.
      *   *Motivation:* Students often care about credit; the university cares about revenue. Conflating these leads to disputes where a student refuses to assign rights fearing loss of academic recognition.
      *   *Tag:* **Non-negotiable.** Essential for drafting assignment agreements that satisfy both parties.

  6.  **Disclosure-Consideration Requirement**
      *   *Statement:* If ownership is contingent on public disclosure, the theory must articulate the quid pro quo: what public benefit purchases the private right?
      *   *Motivation:* Pressure point (f). Patent rights are strange because they require giving away the secret. A theory must justify why the university gets ownership only when the inventor agrees to publish or file.
      *   *Tag:* **Camp-Prejudice (if treated as natural).** Treating disclosure as a natural requirement is wrong; it is a statutory bargain. However, for policy, it is **Non-negotiable** that we adhere to the statutory bargain.

  7.  **Provenance-Tolerance Requirement**
      *   *Statement:* The theory must remain operational when the history of the idea is opaque, cumulative, or collaboratively distributed, without requiring a clean chain of title to establish initial rights.
      *   *Motivation:* Pressure point (g). In biotech and code, ideas are often folk knowledge or assembled from fragments. A theory requiring perfect genealogy paralyzes the tech-transfer office.
      *   *Tag:* **Non-negotiable.** Administrative viability trumps metaphysical purity.

  8.  **Incentive-Alignment Requirement**
      *   *Statement:* The allocation of ownership must predictably encourage the behaviors the institution values (e.g., disclosure, collaboration, commercialization) rather than encouraging secrecy or gaming.
      *   *Motivation:* If the policy makes assignment too onerous, inventors will hide work or spin out companies without university support. The theory must serve the institution's strategic goals.
      *   *Tag:* **Negotiable.** Specific incentives vary by institution, but the need for alignment is constant.

  9.  **Transferability Requirement**
      *   *Statement:* The theory must account for the alienability of the right, explaining how and why ownership moves from the individual to the institution and then to a licensee.
      *   *Motivation:* University tech transfer relies on assignment. A theory grounded in inalienable personality rights (e.g., Hegelian) blocks the core business model.
      *   *Tag:* **Non-negotiable.** If the right cannot be transferred, the office cannot function.

  **Distinctions the Theory May Not Collapse**

  To function, the theory must maintain sharp boundaries between concepts often conflated in casual argument. First, **Expression versus Thought**: Copyright protects the former, patent the latter (if embodied). Collapsing them leads to overreach, such as trying to copyright a scientific fact. Second, **Exclusion versus Remuneration**: Ownership can mean the right to stop others (exclusion) or merely the right to be paid (liability rule). Policy often assumes exclusion is the only form of ownership, which blocks downstream use unnecessarily. Third, **Attribution versus Control**: As noted in Desideratum 5, a student can retain the right to be named inventor while assigning the right to license. Collapsing these causes unnecessary assignment refusals. Fourth, **Discovery versus Invention**: Discovering a gene sequence is different from engineering a diagnostic tool. Treating discovery as invention invites ethical backlash and legal invalidation. Finally, **Natural Right versus Statutory Privilege**: The theory must not treat IP as a pre-political natural right. It is a government grant. Collapsing this distinction leads to the false belief that the university "takes" something natural from the student, rather than administering a statutory benefit.

  **Incompatibilities**

  There is a genuine impossibility result hidden in these desiderata. You cannot simultaneously satisfy the **Provenance-Tolerance Requirement**, the **Priority-Resolution Requirement** (strict first-to-invent), and the **Transferability Requirement** (based on Labor Theory). If ownership is grounded strictly in the labor of a specific individual (Lockean), you cannot tolerate opaque provenance; you must know exactly who labored. If you tolerate opaque provenance (e.g., assigning to the lab PI by default), you violate the strict labor link. Furthermore, the **Improvement Accommodation Requirement** clashes with strong **Lockean** or **Personality** accounts. If the first inventor owns the "idea" because it is their labor or self-expression, they logically own all improvements derived from it. To allow improvements (as Desideratum 4 suggests is often necessary for progress), you must weaken the initial owner's claim, effectively admitting that the "ownership" is not a natural right but a regulatory tool. Thus, a theory grounded in natural rights is incompatible with a policy designed for cumulative, collaborative innovation environments. You must choose between moral consistency (natural rights) and systemic efficiency (cumulative innovation).

  **The Excluder**

  The **Rivalry-Relocation Requirement** eliminates the most contenders. It kills any theory that treats ideas as tangible property or natural extensions of the self. Lockean labor theories fail here because labor mixes with the idea, but the idea remains non-rivalrous; my using your algorithm does not deprive you of it. Personality theories fail because the "idea" is not the "self" in a way that justifies exclusion of others who independently conceive it. This requirement forces the theory to admit that "ownership" is actually a state-enforced monopoly on *commercial application*, not possession of knowledge. Any theory that cannot make this shift is useless for technology transfer, as it will inevitably generate claims overreach that courts will reject or that stifle the market the office seeks to serve.

  **Brief Scorecard**

  **Lockean Labor-Based Accounts:** Fail Rivalry-Relocation and Provenance-Tolerance. They justify ownership via effort, but effort does not create scarcity, and collaborative effort defies individual assignment. They also struggle with Transferability if labor is seen as inalienable.
  **Personality/Self-Expression Accounts:** Fail Improvement Accommodation and Transferability. If the invention is an extension of the self, the inventor cannot morally assign it to a corporation, nor should others be allowed to modify it. Useful for moral rights, useless for licensing.
  **Incentive-and-Welfare Accounts:** Pass most requirements, particularly Rivalry-Relocation and Incentive-Alignment. They struggle with Attribution-Control Decoupling, as they often view credit as irrelevant compared to economic output. They are functional but morally thin.
  **Deflationary (Bundle of Entitlements):** Passes all requirements. It admits there is no "ownership of ideas," only regulated rights to exclude or be paid. It handles Opacity and Transferability easily. Its only weakness is it offers no moral comfort to inventors feeling "expropriated," requiring careful communication management.

  **Bottom Line**

  Your office should not be looking for a metaphysical theory of ownership because no such theory can satisfy the administrative constraints of a modern university. You are not discovering who owns an idea; you are assigning a bundle of regulatory entitlements to optimize risk and revenue. Adopt the deflationary position explicitly to stop the philosophical arguments that are stalling your policy draft. Focus your energy on clear rules for attribution and revenue sharing rather than justifying the "rightness" of the assignment. Treat the policy as a contract for collaboration, not a declaration of natural truth.
