answer: |-
  This is one of the classic problems in bioethics. Your sister has reached for the standard philosophical tool for this situation: it is literally called the **"Ulysses Pact"** (or Ulysses Contract) in medical ethics. It is the go-to argument for *precedent autonomy*—the idea that your competent past self gets to decide for your incompetent future self.

  Your "itch" is well-founded. While the Ulysses Pact is the dominant legal framework, it is ethically contested. Philosophers like Rebecca Dresser have spent careers arguing exactly against your sister's rigid interpretation.

  Here is the audit you asked for, breaking down the analogy, the breaks, and the terminology.

  ### 1. The Mapping: Who plays which role?

  To see where the analogy strains, we have to assign the roles strictly.

  *   **Ulysses (Pre-Binding):** Mom *now* (Competent, signing the directive).
  *   **Ulysses (During the Song):** Mom *later* (Demented, resisting care).
  *   **The Ropes/Mast:** The Advance Directive / Legal Authority.
  *   **The Crew:** Your sister (Healthcare Proxy) and the medical staff.
  *   **The Wax:** *This is the first problem.* In the myth, the crew plugs *their* ears so they cannot hear the song. In your situation, your sister *must* hear Mom's begging. She has no wax.
  *   **The Sirens' Song:** The impulses of dementia ("I want to go home," "I'm starving," "You're hurting me").
  *   **The Rocks:** The physical harms Mom wants to avoid (choking, infection, wandering into traffic, loss of dignity).
  *   **Ithaca:** A "good death" or safe care, as defined by Mom *now*.
  *   **The Begging:** Mom's later verbal refusals of care.

  ### 2. Where the Mapping Breaks (Cosmetic vs. Critical)

  There are three breaks in the analogy. One is cosmetic; two are critical.

  **Cosmetic Break: The Temporary vs. Permanent**
  *   *Myth:* Ulysses passes the island. The spell breaks. He is untied and returns to being the same rational captain.
  *   *Reality:* Mom does not pass the island. There is no "after." The state of "being tied" lasts until death.
  *   *Verdict:* **Critical.** The Ulysses Pact works in the myth because the restriction is temporary for a greater gain (survival + knowledge). In dementia, the restriction *is* the remainder of life. You are tying her up forever, not just for the passage.

  **Critical Break 1: The Nature of the "Song"**
  *   *Myth:* The Sirens' song is objectively deadly. It leads to shipwreck. Ulysses is *wrong* to want to steer toward it.
  *   *Reality:* Later-Mom's desires ("I want to go home") are not necessarily "shipwrecks." They are expressions of current emotional needs. If Later-Mom is content in a facility but forgets she lives there, her desire to "go home" is a delusion, but satisfying her (perhaps by taking a walk) might bring joy without "shipwreck."
  *   *Verdict:* **Critical.** In the myth, ignoring Ulysses saves his life. In dementia, ignoring Later-Mom might save her biological life but violate her current emotional well-being. We don't know for sure that Later-Mom is steering toward rocks; she might just be steering toward a different harbor than Early-Mom planned.

  **Critical Break 2: The Crew's Insulation**
  *   *Myth:* The crew has wax. They feel no guilt. They hear no pleading.
  *   *Reality:* Your sister has no wax. She hears the pleading.
  *   *Verdict:* **Critical.** The myth assumes the enforcer is insulated from the moral weight of the restraint. Your sister is not. If she treats Mom's begging as "noise" (like the Sirens' song), she risks dehumanizing Mom. The myth assumes the begging is *invalid*; in care, the begging is often the only communication left.

  ### 3. Hidden Assumptions (The "Disease" in the Story)

  Your sense that the story assumes a "fixed destination" is correct. Here are the specific philosophical assumptions the Ulysses Pact makes that might not hold:

  **Assumption A: Continuity of Self**
  The story assumes Early-Mom and Later-Mom are the *same person* with the same interests, just that Later-Mom is temporarily "broken."
  *   *The Counter:* Some philosophers argue that severe dementia creates a "new self." If Later-Mom is happy eating ice cream and watching sunsets, and Early-Mom wrote "No feeding tubes because I don't want to live like a vegetable," whose interest counts? The Ulysses Pact says Early-Mom. Your itch suggests Later-Mom's current happiness matters too.

  **Assumption B: Rationality of the Fear**
  The story assumes Early-Mom's fear of the "rocks" is the rational truth.
  *   *The Counter:* Early-Mom is fearing a state of being she cannot imagine. She imagines being *her* (current self) trapped in a broken body. But Later-Mom might not feel trapped. She might feel content. The directive is often based on a fear of a quality of life that the patient, once in that state, does not find objectionable.

  **Assumption C: The Song is Deceptive**
  The story assumes the Sirens are lying.
  *   *The Counter:* In dementia, the "I want to go home" plea is often a code for "I feel unsafe" or "I miss my routine." Treating it as a lie (a Siren song) prevents you from solving the actual problem (fear/routine).

  ### 4. Does the Sister's Conclusion Survive?

  **Legally:** Yes.
  In most jurisdictions, the Advance Directive (the binding) is legally binding. The "Later-Mom" lacks legal capacity. Her refusals do not carry legal weight if she is deemed incompetent. Your sister is legally protected by following the directive.

  **Ethically:** It depends on the *type* of directive.
  If the directive is a **Living Will** (specific instructions: "No tube feeding"), the Ulysses analogy holds strong.
  If the directive is a **Healthcare Proxy** (appointing a person to decide), the Ulysses analogy is weaker. A Proxy is usually instructed to decide based on *substituted judgment* (what would Mom want?) but also *best interests* (what is best for Mom now?).

  **The Verdict:** Your sister's conclusion ("ignore later refusals") survives *if* the refusal is clearly a symptom of the disease (e.g., Mom refuses insulin because she thinks it's poison). It fails *if* the refusal is based on a change in values that seems to bring Mom peace (e.g., Mom refuses to engage in rehab because she is content sitting still).

  The Ulysses analogy is carrying the entire argument. If you remove the idea that Later-Mom is "under a spell" (which implies she is still 'Mom' but bewitched), the argument weakens. If Later-Mom is a "new person," tying her up based on a dead person's rules feels like tyranny, not protection.

  ### 5. A Better Analogy to Think With

  Your "config value" analogy is technically accurate but emotionally cold. It assumes the system *should* run on the original config.

  **Try "The Gardener and the Grafted Tree."**
  Early-Mom plants a tree and grafts a branch onto it, saying, "I want this tree to grow straight."
  Later, the tree grows. The graft takes, but the tree develops a lean due to wind (dementia).
  *   **Sister's view:** We must stake the tree and force it straight, because that's what the planter wanted.
  *   **Your itch:** If we force it straight, we might snap the trunk. If we let it lean, it still bears fruit (joy/comfort), even if it's not straight.

  **Or, the Bioethics Standard: "The Diplomat and the Revolution."**
  Early-Mom is a government that signs a treaty (the directive).
  Later-Mom is a revolution that has overthrown that government. The new regime (demented self) doesn't recognize the treaty.
  *   *Question:* Do we enforce the treaty on the new population?
  *   *Why it helps:* It acknowledges that the "government" (Mom's mind) has actually changed, not just been temporarily bewitched. It forces you to ask: "Do we honor the old treaty, or do we negotiate with the new regime for the sake of peace?"

  **The Best Practical Framework: "The Compass, Not the Rail."**
  Treat the directive as a compass pointing toward Mom's *values* (dignity, comfort, not being a burden), not a rail track she must be strapped to.
  *   If Later-Mom is resisting a feeding tube but is happy and eating by hand, the *value* (dignity) is met. Enforce the value, not the specific instruction.
  *   If Later-Mom is resisting a bath and becoming aggressive, but hygiene is required to prevent infection (a "rock"), you enforce the bath but change *how* (towels instead of shower) to respect the resistance.

  ### 6. The Equivocation Check: "Directive"

  This is likely half your problem. You and your sister may be using "Advance Directive" to mean two different legal documents.

  1.  **The Living Will:** A document listing specific treatments (CPR, tubes, antibiotics). This is the **Ulysses Contract**. It is rigid. "If X, do not do Y."
  2.  **The Durable Power of Attorney for Healthcare (Proxy):** A document appointing a person (Sister) to make decisions. This is **not** a Ulysses Contract. It is a delegation of authority.

  **The Conflict:**
  If Mom has a **Living Will** that says "No feeding tube," and Later-Mom opens her mouth for a spoon, the Sister is legally bound to stop the spoon. The Ulysses analogy holds.
  If Mom has a **Proxy** (Sister decides), and Later-Mom opens her mouth, the Sister can say, "Mom seems happy eating. The directive said 'no tube' to avoid suffering. She isn't suffering. I will allow feeding."

  **Action Item:** Check the documents.
  *   If it's a **Living Will**, your sister is right: the forms are the mast.
  *   If it's a **Proxy**, your sister is wrong: *she* is the mast, and she has discretion to interpret Mom's current best interests. Most modern directives are Proxies *guided* by Living Wills, which gives the Sister wiggle room to say, "The spirit of the directive is comfort; forcing this causes distress, so I won't do it."

  ### Summary for the Family Conversation

  Your sister is using the Ulysses Pact because it absolves her of guilt. It turns a painful emotional decision (ignoring her mother's pleas) into a dutiful logistical one (holding the ropes).

  You can tell her:
  *"The Ulysses story works because Ulysses survives and thanks the crew later. Mom won't survive this, and she won't thank us. We aren't tying her up to pass an island; we are tying her up for the rest of the voyage. That means we can't just follow the map; we have to watch the water. If the map says 'sail north' but the ice is ahead, the Captain (you, as Proxy) has to steer around it, even if the map is old."*

  Your itch is the moral recognition that Later-Mom still exists and still deserves care, not just management. The directive should protect her from harm, not protect her past self's fears from her current self's reality.
