      *   *Chaos:* Make sure to distinguish *ontological* chaos (sometimes used in QM) from *deterministic* chaos (classical). The friend is likely talking about classical deterministic chaos.
      *   *Agency:* Suggest that agency is about *reasons-responsiveness*, not *unpredictability*.

  10. **Final Polish:** Ensure the tone is encouraging for a seminar defence. (Proceed to generate response).

  *(Self-Correction on British English)*: I need to be careful not to overdo the stereotypical "Britishisms" but ensure the spelling and grammar conventions (e.g., single quotes for scare quotes, punctuation inside/outside rules) are consistent with UK academic style.

  *(Final check on the argument step)*: The friend's Step (2) is the real culprit. It moves from "The laws fix the state" to "A computer can work it out". This is the "Computational Theory of Everything" assumption which is not entailed by determinism. I will focus heavily there.

  *(Agency)*: I need to make sure I don't just say " Compatibilism is right". I need to explain *why* the friend's inference from unpredictability to agency is bad, regardless of compatibilism. Even a libertarian wouldn't want agency to rest on mere unpredictability (that's randomness).

