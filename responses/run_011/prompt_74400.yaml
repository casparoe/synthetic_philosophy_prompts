      *   Use the user's terminology ("load-bearing," "idealizations").
      *   Ensure the distinction between "semantic value" and "truth condition" is clear.

  **(Self-Correction Note):** I need to be careful not to validate Camp 2's claim that "non-trivial models exist" as unproblematic. Camp 1 would argue those models are *semantically* trivial or *ontologically* profligate. The disagreement is about *theoretical cost*, not mathematical possibility. I must emphasize this.

  **(Self-Correction Note on Fragility):** I need to admit that my diagnosis assumes the dispute is rational and stable. If one side is actually making a category error (e.g., Camp 3 is right and the others are confused), my structural analysis might legitimize a confusion. I should note that.

