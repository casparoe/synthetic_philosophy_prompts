answer: |-
  # Standing Decision Procedure for Voting Rule Selection
  **Prepared for:** The Executive Council
  **Author:** Returning Officer
  **Subject:** Protocol for Selecting Ballot Rules under Gibbard–Satterthwaite Constraints

  ## Preamble
  The Gibbard–Satterthwaite theorem proves that no voting system is perfect. For any election with three or more candidates where anyone can win, voters can sometimes benefit by lying about their preferences. We cannot eliminate this risk. Our goal is not to find a strategy-proof rule (which does not exist), but to select a rule where successful manipulation is too difficult, too expensive, or too risky for any realistic bloc to attempt.

  This procedure converts that mathematical reality into an operational checklist for volunteers.

  ---

  ## Part 1: The Screening Gates (Gibbard–Satterthwaite Hypotheses)
  *Before selecting a rule, answer these four questions. If you answer **YES** to all four, the theorem applies: strategic voting is theoretically possible. You must proceed to Part 2.*

  **Gate 1: The Count of Alternatives**
  *   **Question:** After applying nomination rules and eligibility checks, are there three or more distinct outcomes remaining on the ballot?
  *   **Pass (Yes):** Proceed to Gate 2.
  *   **Stop (No):** If only two options exist (e.g., Yes/No, Candidate A vs. B), simple majority rule is strategy-proof. Use Majority Rule.

  **Gate 2: Surjectivity (Who Can Win)**
  *   **Question:** Is every candidate or option capable of winning under some configuration of votes? (i.e., Is anyone disqualified by rule before voting starts?)
  *   **Pass (Yes):** Proceed to Gate 3.
  *   **Stop (No):** If only a subset can win, the rule is effectively restricted. Consult Legal Counsel on eligibility criteria; voting rule selection is secondary.

  **Gate 3: Domain Unrestrictedness**
  *   **Question:** Are voters permitted to submit any ranking of the candidates they wish, without restriction?
  *   **Pass (Yes):** Proceed to Gate 4.
  *   **Stop (No):** If voters are restricted (e.g., "Must rank Status Quo first"), the theorem may not apply. Proceed with caution; consult Returning Officer.

  **Gate 4: Determinism**
  *   **Question:** Does the rule produce a definite winner based solely on the votes cast, without using random chance (dice, lots) or a single dictator?
  *   **Pass (Yes):** **THEOREM TRIGGERED.** No strategy-proof rule exists. Proceed to Part 2.
  *   **Stop (No):** If using randomization or a dictator, the theorem is avoided, but new risks apply (see Part 4).

  ---

  ## Part 2: The Vulnerability Assessment (Second-Best Criterion)
  *Since the theorem is triggered, we cannot ask "Is this rule manipulable?" (The answer is always Yes). We must ask: "Is this rule manipulable *by us*?"*

  **Criterion:** Select the rule that maximizes the **Cost of Manipulation**.
  A manipulation is only a threat if a bloc can coordinate, predict the outcome, and gain enough to justify the risk.

  **Assessment Checklist (Score 1–3 for each candidate rule):**
  1.  **Coordination Cost:** How many voters must agree to manipulate?
      *   *3 (High Cost):* Requires >20% of electorate or complex coalition.
      *   *1 (Low Cost):* Requires only a small clique.
  2.  **Information Cost:** How much do manipulators need to know about others' votes?
      *   *3 (High Cost):* Requires near-perfect knowledge of the whole electorate.
      *   *1 (Low Cost):* Works with rough polling data.
  3.  **Payoff Stability:** If the manipulation fails, does it backfire badly?
      *   *3 (High Risk):* Manipulation likely elects the manipulator's *least* preferred option if miscalculated.
      *   *1 (Low Risk):* Manipulation safely defaults to a "second choice."

  **[JUDGMENT]** *Weighting:* For Officer Elections, prioritize **Payoff Stability** (avoiding disastrous outcomes). For Standards/Prizes, prioritize **Coordination Cost** (preventing lobbying dominance).

  **Decision Rule:** Adopt the rule with the highest total score. If scores are tied, prefer the rule familiar to the membership to minimize accidental spoilage.

  ---

  ## Part 3: The Restricted-Preference Diagnostic
  *The theorem assumes voters can have any preference order. If voter preferences are naturally structured (e.g., along a single political spectrum), strategy-proof rules exist (like Majority Rule on a median). Use this test to see if you can claim that escape.*

  **The Straw-Poll Test:**
  1.  **Sample:** Before finalizing the rule, request a non-binding straw poll from a representative sample (e.g., 5% of members or the Nominating Committee).
  2.  **Pairwise Check:** Compare the "median" option (the one in the middle of the pack) against all others in head-to-head matchups.
  3.  **Result:**
      *   **If the Median beats everyone else:** Preferences are likely "single-peaked." You may use a rule that relies on a median (like a sequential runoff) with lower risk of cycles.
      *   **If the Median loses to anyone:** Preferences are multi-dimensional (e.g., conflicting commercial interests). **Do not rely on the single-peaked escape.**

  **[JUDGMENT] Risk Statement:**
  *   **Safe to rely:** If the issue is technical gradation (e.g., "Voltage: 110v, 120v, 130v").
  *   **Reckless to rely:** If the issue involves trade-offs (e.g., "High Safety/High Cost" vs. "Low Safety/Low Cost") or distinct ideological packages. In these cases, assume the Theorem applies fully.

  ---

  ## Part 4: Evaluation of Common Proposals
  *When Council members propose the following, apply this analysis.*

  | Proposal | Does it avoid Gibbard–Satterthwaite? | New Difficulty Imported | Recommendation |
  | :--- | :--- | :--- | :--- |
  | **Score Voting** (Rate 0–5) | **Yes.** (Uses cardinal ratings, not ordinal rankings). | **Scale Bias:** Voters will "min-max" (give favorites 5, rivals 0), effectively becoming a ranking system anyway. Requires voter education on how to score. | **Acceptable** for Standards/Prizes. **Avoid** for Officer Elections (too abstract for members). |
  | **Randomization** (Draw lots for ties or winner) | **Yes.** (Not deterministic). | **Legitimacy:** Members view elections as merit-based, not lotteries. High reputational risk if a loser wins by chance. | **Reject** for Officers/Referendums. **Acceptable** only for breaking exact ties in Prize shortlists. |
  | **Two-Alternative Preliminary** (Primary to reduce to 2) | **Yes.** (Reduces Gate 1 to 2 options). | **Agenda Control:** The manipulation moves from the vote to the *selection of the two*. The primary becomes the battleground. | **Acceptable** if the primary rule is robust (e.g., Top-Two Primary). |
  | **Advisory Vote + Chair Decision** | **Yes.** (Creates a "Dictator" at the end). | **Accountability:** Politically toxic. Implies the vote doesn't matter. Invites lobbying of the Chair rather than the membership. | **Reject** unless the society is in crisis and cannot decide. |

  ---

  ## Part 5: Theory vs. Practice Distinction
  *Volunteers must distinguish between a rule that is mathematically flawed and one that is operationally vulnerable.*

  *   **Theoretically Manipulable:** The rule allows a scenario where lying helps. (True of almost all rules).
  *   **Practically Vulnerable:** The rule allows a scenario where lying helps *and* the bloc has the data, cohesion, and numbers to execute it.

  **Features that move a contest from Theoretical to Practical Vulnerability:**
  1.  **Small Electorate:** (e.g., Standards Committee vs. Whole Membership). Smaller groups are easier to coordinate.
  2.  **Public Voting:** If votes are not secret, coordination is easier.
  3.  **Repeated Interaction:** If the same voters meet annually (Committee), they can build trust for coalitions.
  4.  **High Stakes:** Commercial interests (Standards) justify the cost of hiring consultants to game the vote.

  **[JUDGMENT]** If a contest has 3+ of these features, you must upgrade the voting rule (e.g., from Plurality to Runoff) even if the lower-stakes version is usually fine.

  ---

  ## Application of Procedure to Current Ballots

  ### Case 1: Standards Committee (5 Drafts, Borda Count)
  *   **Gates:** 5 Options (Yes), All can win (Yes), Unrestricted (Yes), Deterministic (Yes). **Theorem Triggered.**
  *   **Restricted Preference Diagnostic:** **Fail.** Commercial interests create multi-dimensional preferences (Cost vs. Performance vs. IP). Lobbying indicates coordination is already happening.
  *   **Vulnerability Assessment (Borda):**
      *   Coordination Cost: Low (Lobbyists already organized).
      *   Information Cost: Low (Committee is small, 40 members).
      *   Payoff: High (Borda is highly sensitive to "cloning" and burying).
  *   **Proposal Evaluation:** Switching to Score Voting is viable here (technical audience).
  *   **Decision:** **Abandon Borda.** Borda is the most vulnerable to the specific "burying" tactic that annulled the officer election.
  *   **Recommendation:** Adopt **Approval Voting** or **Score Voting**. These reduce the incentive to rank a strong rival last, as you can approve both your favorite and the "acceptable" compromise.
  *   **Justification:** "While no rule is perfect, Borda count allows a coordinated bloc to eliminate a rival by ranking them last without penalty. Approval voting requires a bloc to agree not just on who to hate, but who to support, raising the coordination cost."

  ### Case 2: Officer Election (6 Candidates, Two-Round Runoff)
  *   **Gates:** 6 Options (Yes), All can win (Yes), Unrestricted (Yes), Deterministic (Yes). **Theorem Triggered.**
  *   **Restricted Preference Diagnostic:** **Fail.** Leadership qualities are multi-dimensional.
  *   **Vulnerability Assessment (Runoff):**
      *   Coordination Cost: High (Need to influence >50% of 4,000 members).
      *   Information Cost: High (Need to predict who makes the top 2).
      *   Payoff Stability: High (If you try to bury a candidate and they make the runoff anyway, your vote is wasted).
  *   **User Preference Check:** You are attached to the Runoff.
  *   **Decision:** **Retain Two-Round Runoff.**
  *   **Reasoning:** The previous failure (burying) is significantly harder in a Runoff than in Borda or IRV. To eliminate a strong rival in Round 1, a bloc must be large enough to push them out of the top two. This requires >33% coordination in a 6-way race. This is expensive and risky.
  *   **Cheapest Defensible Replacement:** If the Council demands a change due to cost (two rounds are expensive), the only cheaper alternative is **Instant Runoff (IRV)**. However, IRV is *more* vulnerable to the specific burying tactic (ranking a strong rival last helps eliminate them earlier).
  *   **Recommendation:** **Keep the Runoff.** It is the most robust against coordinated burying among feasible options. To defend it: "The Two-Round system forces manipulators to win a majority in the second round, making 'burying' tactics from the first round ineffective if the rival survives."

  ### Case 3: Constitutional Referendum (3 Amendments + Status Quo, Chair Tie-Break)
  *   **Gates:** 4 Options (Yes). **Theorem Triggered.**
  *   **Proposal Evaluation:** The Council's proposal (Chair decides if no Condorcet winner) creates a **Dictator** in specific cases.
  *   **Vulnerability:** This invites a specific manipulation: Voting to create a cycle (A beats B, B beats C, C beats A) intentionally, forcing the outcome to the Chair, whom the bloc can then lobby privately.
  *   **Decision:** **Reject Chair Tie-Break.**
  *   **Recommendation:** Use **Pairwise Voting with Status Quo as Default.**
      *   Vote Amendment A vs. Status Quo.
      *   Vote Amendment B vs. Status Quo.
      *   Vote Amendment C vs. Status Quo.
      *   If multiple beat Status Quo, hold a runoff between them.
  *   **Justification:** "Delegating the decision to the Chair when votes cycle incentivizes members to vote insincerely to create a cycle. Keeping the decision with the membership, even via a runoff, maintains legitimacy."

  ---

  ## Limitations of This Procedure
  *As Returning Officer, I must state what this protocol cannot do:*

  1.  **It cannot prevent a determined majority.** If 51% of the society agrees to manipulate the rule, they will succeed regardless of the system. This procedure protects against *minority* blocs and *coordination failures*, not majority tyranny.
  2.  **It cannot account for external pressure.** The procedure assumes votes are secret and free. If employers coerce employees (Standards Committee), no voting rule will fix that. That is a governance/legal issue, not an electoral one.
  3.  **It relies on honest diagnostics.** The "Straw-Poll Test" for restricted preferences requires volunteers to administer it honestly. If they skew the sample, the "Safe to rely" judgment will be wrong.
  4.  **It cannot eliminate "Push-Over" strategies.** In the Officer Runoff, a bloc can still try to ensure their weak candidate faces their strong rival in the second round. The procedure makes this *harder*, not impossible.

  **Final Note to Council:**
  We are not choosing a perfect system. We are choosing a system where the cost of cheating exceeds the value of the prize. For the Officer Election, the Runoff meets this bar. For the Standards Committee, Borda does not. For the Referendum, Chair discretion does not.
