prompt: |-
  I sit on the staff recognition panel at a big acute trust in the North West — I'm a matron, not a philosopher, though I've started a philosophy-of-medicine evening class this term and the two keep colliding, so bear with me. Every autumn we run an 'Above and Beyond' awards scheme and this year's shortlist is a bit of a nightmare. There's a healthcare assistant on a frailty ward who came in solid through a norovirus outbreak for something like three weeks, with no annual leave left and a six-month-old at home, and two of my colleagues want to give her the top prize because she 'went the extra mile'. There's a consultant surgeon who quietly paid out of his own pocket to send a patient abroad for a procedure we couldn't fund, which is lovely but is probably a governance problem and definately treats one patient differently from everyone else on his list. And there's a porter who gave a kidney to a complete stranger — non-directed donation, all above board, and he's back at work now.

  What I actually want isn't a verdict on who wins; it's the short memo I'll circulate before Thursday's meeting, recommending what the panel does about the scheme and about these three nominations, with a time frame attached (ceremony's in November, nominations reopen in the spring). I'd like it to use the supererogation material properly — the idea that some acts are good but not required, the old Urmson worry that a moral vocabulary built only out of duty, prohibition and indifference has no room for saints and heroes, and the awkward questions about when an act even counts: does it have to cost the agent something, does it count if it means neglecting some other duty, does it count if the agent didn't think she was doing anything special at the time. But here's the bit I go round in circles on and I'd like the memo to actually take a view: a colleague has proposed what she calls the no-ratchet rule — that we may only honour these people if the citation avoids any suggestion that this is what everyone should aspire to, on the grounds that public praise for the extraordinary quietly drags the expected baseline upwards and turns last year's heroism into this year's minimum. You can watch it happening with the HCA already, since her ward manager has started naming her at handover as what we should all be like. Is that rule even coherent? Can you praise someone for going beyond duty without thereby making it owed, or without converting the praise into a soft requirement on everyone watching — and if you can't, does the panel have to stop giving awards altogether, or is there a form of recognition that genuinely doesn't ratchet?

  So: give me a bottom line I could table on Thursday. Which of the three to honour and on roughly what wording; whether the porter's donation should trigger a change to our leave policy for altruistic donors, and whether that kind of institutional facilitation alters the moral status of donating at all (I have a hunch it does and I can't articulate why); and what next year's criteria should look like so that a reviewer can apply them without a philosophy degree. And please give the losing side its proper due — there's a real argument that a public sector employer handing out certificates to people for working unpaid through a staffing crisis is precisely the wrong message, and that the whole scheme is a way of buying goodwill with praise instead of rostering. I half believe that myself, so don't strawman it, tell me where it's right and where it overreaches.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Matron at a large acute trust in the North West. Member of staff recognition panel. Taking a philosophy of medicine evening class.
      *   **Context:** 'Above and Beyond' awards scheme. Shortlist of three nominees:
          1.  HCA (Frailty ward): Worked through norovirus for 3 weeks, no leave left, baby at home. (Colleagues want to award for "going extra mile").
          2.  Consultant Surgeon: Paid out of pocket for patient's procedure abroad. (Governance issue, equity issue).
          3.  Porter: Non-directed kidney donation to stranger. Back at work.
      *   **Core Philosophical Problem:** Supererogation (acts beyond duty). Urmson's argument (need room for saints/heroes). The "No-Ratchet Rule" (praising extraordinary acts shouldn't make them the new baseline/obligation).
      *   **Specific Questions to Address:**
          *   Which nominee(s) to honour and wording?
          *   Should the porter's donation trigger a leave policy change? Does institutional facilitation alter the moral status?
          *   What should next year's criteria look like (accessible, no philosophy degree needed)?
          *   Address the critique: Is the scheme just buying goodwill instead of proper rostering? (Don't strawman this).
          *   Coherence of the "No-Ratchet Rule": Can you praise without creating obligation?
      *   **Format:** A short memo to circulate before Thursday's meeting.
      *   **Tone:** Professional, pragmatic, but philosophically grounded (matching the user's dual role). North West NHS context (implies resource constraints, pragmatic culture).
      *   **Deadline:** Meeting Thursday, Ceremony November, Nominations reopen Spring.

  2.  **Deconstruct the Philosophical Issues:**
      *   **Supererogation:** Acts that are good to do but not wrong to omit.
      *   **The Ratchet Effect:** If we praise $X$, does $X$ become expected? Yes, often. This is the "moral inflation" problem.
      *   **The HCA:** Working sick/without leave during a crisis. *Critique:* This shouldn't be supererogatory; it's a failure of management/rostering. Praising this normalizes exploitation.
      *   **The Surgeon:** Paying personally. *Critique:* Breaches equity (queue jumping via wealth/charity) and governance (conflict of interest/inducement). Not a good model for institutional praise.
      *   **The Porter:** Kidney donation. *Critique:* Clearly supererogatory. High cost to self, benefit to other. Does institutional support (leave policy) make it obligatory? No, it removes barriers, doesn't create duty.
      *   **The "No-Ratchet" Rule:** Is it coherent? Hard to maintain completely. Praise *does* signal value. But we can frame it as "exceptional generosity" rather than "standard of care."
      *   **Institutional Facilitation:** If the Trust gives paid leave for donation, does it stop being supererogatory? No. It shifts from "sacrifice" to "supported choice." It acknowledges the value without demanding the cost.

  3.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard NHS Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the difficulty. Validate the philosophical tension (Matron + Philosopher).
      *   **The "Buying Goodwill" Critique:** Address this first. It's the elephant in the room. Acknowledge validity regarding the HCA. Distinguish between *covering gaps* (bad) and *exceptional contribution* (good).
      *   **The Three Nominations (Decisions & Rationale):**
          *   *HCA:* Do not award top prize. Risk of ratcheting expectation of unpaid/unsafe work. Acknowledge dedication but frame carefully or decline. *Decision:* Commendation only, specific wording to avoid normalizing sickness presenteeism. Actually, better to be bold: Decline for top prize, explain why. It protects her and the staff.
          *   *Surgeon:* Decline. Governance/Equity risks. Kindness != Institutional Value.
          *   *Porter:* Award Winner. Clear supererogation. Low ratchet risk (most can't donate kidneys).
      *   **Policy Change (Porter):** Support paid leave for organ donation. Does it change moral status? No, it removes *barriers*, not *choice*. It makes the act sustainable, not obligatory.
      *   **The "No-Ratchet" Rule:** Is it coherent? Partially. We can't stop all ratcheting, but we can mitigate it by focusing on *intent* and *context*. Wording matters.
      *   **Next Year's Criteria:** Needs to be practical. Focus on "Impact," "Innovation," "Compassion," explicitly excluding "covering systemic failures."
      *   **Timeline:** November ceremony, Spring nominations.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction on HCA:* If I say "don't award," her colleagues might be upset. I need to explain *why* it protects her. If we award her for working sick, we tell the next HCA they must work sick to win.
      *   *Correction on Surgeon:* It's not just governance; it's justice. He helped *one* patient. What about the others?
      *   *Correction on Porter:* The user asked if institutional facilitation alters moral status. My hunch: It changes it from "heroic sacrifice" to "supported citizenship." It's still supererogatory because you don't *have* to donate, but the *cost* is lowered. I need to articulate that distinction.
      *   *The "No-Ratchet" Rule:* I need to be honest. It's not fully coherent. Praise *always* sets a norm. But we can distinguish between "aspirational values" and "operational requirements."
      *   *Tone Check:* Needs to sound like a Matron (decisive, staff-focused) who reads Urmson (nuanced, ethical). Not too academic, not too bureaucratic.

  5.  **Final Polish:**
      *   Ensure the "Buying Goodwill" argument is treated with respect. It's a strong Marxist/Union critique of awards schemes.
      *   Make sure the recommendation is actionable for Thursday.
      *   Check the North West context (implicit understanding of pressure).
      *   Ensure the philosophical terms (supererogation, ratchet, duty) are used correctly but accessibly.

  6.  **Final Review against constraints:**
      *   Memo format? Yes.
      *   Address all three nominees? Yes.
      *   Address the Ratchet Rule? Yes.
      *   Address the Policy/Leave question? Yes.
      *   Address the "Buying Goodwill" critique? Yes.
      *   Bottom line for Thursday? Yes.

  *(Self-Correction on the HCA decision)*: A flat "no" might be too harsh for a panel discussion. A "Highly Commended" with very specific wording might be a better compromise, but the prompt asks for a "bottom line." I will recommend *not* giving the top prize to the HCA to avoid the ratchet effect on staffing safety, but acknowledge the dedication. Actually, the prompt asks "Which of the three to honour." I should pick the Porter as the clear winner. The HCA is the tricky one. I will recommend *against* the HCA for the top prize to make a philosophical point about duty vs. exploitation.

  *(Refining the "Buying Goodwill" critique)*: This is crucial. If the Trust is understaffed, awards are a band-aid. I need to validate this. The memo should say: "We cannot award our way out of a rostering crisis."

  *(Refining the Porter Policy)*: Does paid leave make it obligatory? No. It makes it *possible*. Analogy: Voting is a civic duty, but giving time off to vote doesn't make voting obligatory, it removes the obstacle. Same here.

  *(Refining the Ratchet Rule)*: Can we praise without obligating? We can praise the *spirit* without mandating the *act*. "We value the compassion" vs "We expect the sacrifice."

