  There are three plates set on the wood,
  Where only two of us stood.
  There is a space where another might breathe,
  A ghost she refuses to leave.

  I carry the scars on my knee,
  From the day that I learned to be free.
  He feels no ache in the bone,
  No need to make a home.

  I hold the warmth of the sun,
  Glad that I am the one.
  He holds no warmth in the wind,
  No place for a soul to begin.

  She feels the weight of the loss,
  And counts up the terrible cost.
  He feels no weight in the climb,
  No reason to carry a name.

  There is a peace in the empty chair,
  And no one missing there.
