      *   **Topic:** David Benatar's asymmetry argument (antinatalism) regarding pain/pleasure presence/absence.
      *   **Context:** School lit mag submission, philosophy club background.
      *   **Constraint 1 (Structure):** Every stanza is a quatrain (4 lines) *except* the last stanza, which stops after 2 lines. Total stanzas: 4 quatrains + 1 couplet = 18 lines total.
      *   **Constraint 2 (Content per Stanza):** Lines 1-2 about something *present*. Lines 3-4 about the same thing *absent*.
      *   **Constraint 3 (Rhyme Scheme):** Present lines (1-2) must rhyme properly (perfect rhyme). Absent lines (3-4) must rhyme slantwise (near rhyme).
      *   **Constraint 4 (Theme/Imagery):** Grounded in reality, not abstract theory. Specifically use the situation of the user's mom talking about the "third kid she decided not to have" like it's a person who got left somewhere.
      *   **Constraint 5 (Forbidden Words):** No "asymmetry", "nonexistence", "harm". No philosopher names.
      *   **Constraint 6 (Effect):** The dropped half (the 2-line ending) must feel natural, not cheated. The reader shouldn't feel the lack because there's no one to miss it (mirroring the argument).
      *   **Audience:** Lit mag readers (some may not know the philosophy).

