          6.  Evaluate if the "sophist verdict" survives.
          7.  Provide a better analogy/explanation for non-specialists if the set theory one fails.

  2.  **Deconstruct the Philosophical Problem:**
      *   **The Text:** *Gongsun Longzi*, "White Horse Dialogue."
      *   **The Claim:** "A white horse is not a horse" (Baima fei ma).
      *   **The Set Theory Interpretation:** $WhiteHorse \subset Horse$. To say $WhiteHorse \neq Horse$ is technically true (sets aren't identical to their supersets), but pragmatically misleading (usually "is a" means $\in$ or $\subset$). If interpreted as $\in$, it's false. This makes it look like equivocation.
      *   **The Mass Noun Interpretation:** Chinese nouns like "horse" refer to the *stuff* of horseness. "White horse" refers to *white-horse-stuff*. The intersection of white-stuff and horse-stuff is not identical to horse-stuff.
      *   **The Pragmatic/Request Interpretation:** The text explicitly uses an example about asking for a horse vs. asking for a white horse. This is about *reference* and *satisfaction conditions*, not just abstract ontology.

  3.  **Drafting the Candidate Readings:**
      *   *Reading 1: The Logical/Set-Theoretic (User's Draft).* Focuses on extension. $A \subset B$, but $A \neq B$. Equivocation on "fei" (is not).
      *   *Reading 2: The Mereological/Mass Noun (Sinologist's View).* Focuses on intension/stuff. "Horse" names the shape/form. "White" names the color. "White Horse" names the compound. The compound is not the simple.
      *   *Reading 3: The Pragmatic/Referential (The "Request" Argument).* Focuses on use. If I ask for $X$, and you give me $Y$, was I satisfied? "Horse" allows yellow/black. "White Horse" excludes them. Therefore, the *term* "White Horse" does not function identically to the *term* "Horse."

  4.  **Developing the Correspondence Table:**
      *   Need to map Set Theory concepts to Classical Chinese concepts.
      *   *Set:* Class of horses.
      *   *Member:* Individual horse.
      *   *Subset:* White horses.
      *   *Copula ("Is"):* *Fei* (is not) / *Wei* (is).
      *   *Chinese Ontology:* *Shi* (stuff/reality), *Ming* (name), *Xing* (form).

  5.  **Analyzing Disanalogies:**
      *   *Bite against Sophist Verdict:* If the argument is about *names* (Ming) fixing *reality* (Shi), it's semantic precision, not trickery. If it's about satisfaction conditions (pragmatics), it's not a logical fallacy but a point about communication.
      *   *Don't Matter:* Whether they used Venn diagrams (anachronistic). Whether they had a formal symbol system.

  6.  **Addressing the "Request" Argument:**
      *   This is crucial. Gongsun Long says: "If you want a horse, a yellow one works. If you want a white horse, a yellow one fails."
      *   In Set Theory: $YellowHorse \in Horse$. $YellowHorse \notin WhiteHorse$.
      *   This supports the idea that the *extension* of the terms differs.
      *   But Gongsun Long's conclusion is "White Horse is not Horse."
      *   In modern logic: "The concept 'White Horse' is not identical to the concept 'Horse'." This is true.
      *   In natural language: "A white horse is not a horse." This is false.
      *   The gap is between *concept identity* and *predication*.
      *   Does this make him a sophist? Only if he claims natural language predication is false. If he claims *names* are distinct, he's a semanticist.

  7.  **Evaluating the "Sophist Verdict":**
      *   "Sophist" implies deceit/trickery for victory.
      *   "Logician" implies rigorous analysis of structure.
      *   The School of Names (Mingjia) was concerned with *Zheng Ming* (Rectification of Names).
      *   If Gongsun Long is pointing out that compound names have different satisfaction conditions than simple names, he is doing philosophy of language, not just logic-chopping.
      *   The Set Theory analogy *helps* explain the logic but *hurts* by importing Western individuation (count nouns) where Chinese might use mass/stuff.
      *   However, the "Request" argument saves the Set Theory analogy partially because it deals with extensions (which things satisfy the request).
