      *   **Task:** Fact-check a draft article about the School of Names (Mingjia), specifically Gongsun Long's "White Horse Not Horse" (Baima Fei Ma) argument.
      *   **User's Current Stance:** The draft argues the argument is a "set theory joke" (confusing membership vs. identity/subclass), making Gongsun Long a sophist, not a logician.
      *   **Counter-Evidence:** A sinologist interviewee claims classical Chinese nouns are mass nouns (stuff ontology), not count nouns (class ontology), so Venn diagrams don't work.
      *   **Specific Instructions:**
          1.  Think through carefully.
          2.  Sketch 2-3 candidate readings of the dialogue.
          3.  Create a correspondence table (Class, Member, "Is").
          4.  Sort disanalogies (those that bite vs. those that don't).
