  As for what finitary reasoning buys me: it buys me the distinction between potential and actual infinity. Full induction presupposes the natural numbers are a completed set you can quantify over all at once. Finitary reasoning only requires that I can take any given number and find its successor. The trouble starts exactly when you claim exponentiation is total—that's where you commit to numbers too large to be constructed, just to make the induction work. I use PA because it's a useful fiction for generating concrete truths, not because I believe its axioms describe reality. The checking terminates because the proof you hand me is finite, not because I believe in the infinite set of all possible proofs.
