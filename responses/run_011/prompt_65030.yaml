answer: |-
  1. **Design constraints**
  The statute mandates a single dollar score for every proposal to enable ranking, implying that each proposal possesses a unique, finite expected net benefit. It further implies invariance: the score must not depend on how an analyst lists or groups scenarios, as the proposal itself remains unchanged regardless of spreadsheet organization. These requirements conflict when a proposal's payoff structure creates a conditionally convergent series. In such cases, the mathematical sum exists only for a specific ordering; rearranging the rows changes the total, violating invariance. Furthermore, some proposals may yield infinite benefits, challenging the "single dollar figure" requirement. The procedure must resolve these conflicts within twenty minutes per proposal, ensuring counsel can defend the score against audit while respecting the board's need for a ranked list. It must distinguish between calculable risks, unbounded opportunities, and mathematically undefined gambles.

  2. **The triage test**
  The analyst opens the scenario spreadsheet. Column A lists scenario probability ($p$); Column B lists net payoff ($x$). Column C computes the product ($p \times x$). Column D computes the absolute product ($|p \times x|$), which ignores whether the payoff is positive or negative.
  Step 1: Sum Column C. This is the raw Expected Value (EV), the probability-weighted average of outcomes.
  Step 2: Sum Column D. This tests for **Absolute Convergence**, meaning the total risk magnitude is finite regardless of sign.
  Step 3: Compare the sums. If Column D's sum stabilizes at a finite number as rows are added, the table is **Well-Defined**. If Column D grows without bound but Column C grows positively without bound, it is **Positive Divergent**. If Column D grows without bound and Column C fluctuates or depends on row order, it is **Undefined**.
  For continuous distributions provided as formulas, the analyst checks the tail behavior. If the probability of extreme payoffs does not drop faster than the payoff size grows, flag as Undefined. If the modeler cannot certify absolute convergence, treat as Undefined. This test terminates in minutes using standard spreadsheet functions.

  3. **The decision procedure**
  1. **Well-Defined Proposals:** If the Absolute Convergence test passes (Column D sum is finite), record the sum of Column C as the official score. The memo states: "Expectation is invariant to scenario ordering; absolute sum converges to $[Value]." The Chief Risk Officer (CRO) signs off. Proceed to ranking.
  2. **Positive Divergent Proposals:** If Column D diverges to infinity but all payoffs are positive (or net positive), record the score as "$+\infty$ (Unbounded)." The memo states: "Expected benefit exceeds any finite budget constraint; tail risk requires board acknowledgment." These proposals rank above all finite scores. The CRO signs off, but the Board must explicitly acknowledge the infinite liability risk if the premium model fails.
  3. **Undefined Proposals:** If Column D diverges and payoffs mix signs (like Case C), do not record a dollar score. The memo states: "Expected value is undefined; score depends on arbitrary scenario ordering." This triggers an automatic referral to the Values Committee. The analytical process stops here.
  4. **Refusal to Rank:** Undefined proposals are not ranked against finite or infinite proposals. They are held in a separate queue until the Values Committee provides a policy directive (e.g., "Treat as zero" or "Reject").
  5. **Audit Trail:** Save the spreadsheet with the absolute value column visible. Counsel defends the score by pointing to the Absolute Convergence test. If the test fails, the lack of a score is the compliance action.
  6. **Time Limit:** If the convergence behavior is unclear within twenty minutes (e.g., slow-growing tails), default to Undefined and refer to the Committee. It is safer to delay than to publish a vulnerable number. This ensures the procedure remains operational under quarterly cycle constraints.

  4. **Why invariance does most of the work**
  Invariance protects the fund from bookkeeping artifacts. Mathematically, this requires **Absolute Convergence**. When a series is absolutely convergent, the sum remains constant even if you shuffle the rows or group them into pairs. However, many high-risk proposals exhibit **Conditional Convergence**, where positive and negative terms cancel out to produce a finite sum only because they appear in a specific sequence. This is known as the Riemann Rearrangement phenomenon. If analysts are permitted to order scenarios by magnitude or internal ID, two analysts could legitimately calculate different scores for the same proposal simply by sorting their spreadsheets differently. This violates the statutory mandate that the proposal, not the spreadsheet, determines the score. By gating on absolute convergence, we ensure that the calculated expectation reflects the physical risk, not the analyst's sorting preference. This is the only defensible standard for counsel.

  5. **Worked cases**
  **Case A: Harbor Reach.**
  Analyst computes Column C: $(0.05 \times 900) + (0.25 \times 150) + (0.70 \times -40) = 45 + 37.5 - 28 = 54.5$.
  Column D (Absolute): $45 + 37.5 + 28 = 110.5$.
  Result: Finite. Score: $54.5 million. Class: Well-Defined.
  Treatment: Ranked normally. Memo cites absolute sum stability.

  **Case B: Cascade Facility.**
  Analyst computes Column C terms: Each row $n$ gives $2^{-n} \times (1 \text{ million} \times 2^n) = 1 \text{ million}$.
  Sum Column C: $1\text{M} + 1\text{M} + \dots = \infty$.
  Sum Column D: Same, $\infty$.
  Result: Positive Divergent. Score: $+\infty$.
  Treatment: Ranks above A. CRO notes tail risk. Board must approve infinite exposure.

  **Case C: Ledger Swap.**
  Analyst computes Column C terms: Term $n$ is $2^{-n} \times (1 \text{ billion} \times 2^n / n) = 1 \text{ billion} / n$.
  Signs alternate: $+1\text{B}, -0.5\text{B}, +0.33\text{B}, \dots$
  Sum Column C (natural order): Converges to $\approx 693$ million (the sponsoring team's figure).
  Sum Column D (Absolute): $1\text{B} \times (1 + 1/2 + 1/3 + \dots)$. This is the harmonic series, which diverges to $\infty$.
  Result: Undefined. The $690$ million figure is valid only for the specific index order $n=1,2,3\dots$. Sorting by payoff magnitude changes the sum.
  Treatment: No score recorded. Referred to Values Committee.
  Ranking: B ($+\infty$) > A ($54.5$M). C is unranked.
  Publishing: The fund publishes scores for A and B. C is listed as "Under Review - Undefined Expectation."
  To abandon invariance, you would need to prove that the scenario index $n$ represents a physical sequence of events that cannot occur in any other order, making rearrangement physically impossible rather than just mathematically arbitrary.

  6. **What the procedure cannot do**
  This procedure cannot detect model risk where the tail behavior is misspecified. If a modeler underestimates the probability of extreme events, a divergent table may look convergent within the first hundred rows. The twenty-minute triage relies on the modeler's honesty about tail exponents. Additionally, treating undefined proposals as "Under Review" creates a backlog risk; the Values Committee may become a bottleneck. Finally, the distinction between Positive Divergent and Undefined is mathematical, but policy may view both as "too risky." The procedure masks this value judgment as a calculation. When an analyst flags a slow-growing tail as Undefined to be safe, that is a judgment call wearing a procedure's clothes. The fund must accept that some risks are unquantifiable by design.
