      *   *User's Instinct:* Skip labels until the end.
      *   *Advice:* Correct. Labels create tribalism. Use "The Causal View" vs. "The Evidential View" or "The Interventionist" vs. "The Observer." Save CDT/EDT for the final slide (whiteboard) as a "if you want to Google this later" gift.

  7.  **Comprehension Check:**
      *   Need a variant.
      *   *Idea:* The "Psychic Button." Or a journalism-specific variant.
      *   *Best Variant:* "The Headline." You are editing a headline: 'Bank Will Fail' vs. 'Bank Will Survive'. A perfect algorithm predicts your headline. If you print 'Fail', the bank fails (market reaction). Wait, that's causal.
      *   *Better Variant:* "The Source." You have a source who is 100% accurate about what you *will* write. If you write X, they predicted X. Does writing Y change their prediction? No. Does knowing their prediction change what you write?
      *   *Best for this group:* **The Prediction Market Variant.** You are betting on your own action. "I bet I will go to Damascus." If you bet on Damascus, you go. If you go, you die. Do you bet on Aleppo?
      *   *Actually, simpler:* **The Two-Box Variant (Newcomb)** is too close. Let's do **The Common Cause.**
      *   *Selected Check:* **The Genetic Test.** A test predicts you *will* get cancer (99% accuracy). You can't change your genes. Should you live as if you have cancer? (Evidential) vs. Should you live normally because living normally doesn't change genes? (Causal).
      *   *Wait, keep it decision focused:* **The Transparent Box.** You can see the money. (Too complex).
      *   *Let's go with the "Coin Flip" variant.* If Death predicts the *outcome* of your coin flip, does flipping help? (No). This tests the randomization objection.

  8.  **Timing & Flow:**
      *   0-5: Hook (Death Story).
      *   5-15: The Setup (Stipulations & Whiteboard).
      *   15-25: The Conflict (Why it hurts).
      *   25-35: Objections (Data guy, Markets guy, Skeptic).
      *   35-40: The Journalism Link (The Gear-Change).
      *   40-45: Comprehension Check & Wrap.

  9.  **Cutting Room Floor:**
      *   Ratifiability (too technical).
      *   History of the puzzle (Gibbard/Harper).
      *   Mixed strategy math (keep it conceptual).
      *   Timeless Decision Theory (too much).

  10. **Refining the "Gear-Change" Framing:**
      *   Is it the same knot? Yes. The journalist asks: "If I publish X, what happens?" (Causal). But the market reacts to the *signal* of publishing X (Evidential). The puzzle forces you to separate the *signal* of your action from the *force* of your action.

  11. **Drafting the Response:**
      *   Tone: Professional, peer-to-peer, slightly urgent (newsroom vibe).
