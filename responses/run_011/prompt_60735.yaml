answer: |-
  Here is the dependency structure and session plan. Your framing is correct: the "gear-change" from causal intervention to evidential signal is exactly the knot this puzzle ties. That is your load-bearing wall. Do not let the room treat this as a riddle with a solution; treat it as a mirror for their own reporting instincts.

  ### 1. Dependency Structure (The Order of Operations)
  You cannot present the story and the conflict simultaneously. If you do, the "magic" of Death will swallow the logic. You must build the logic *inside* the story, brick by brick.

  1.  **The Stipulation of Infallibility:** Before anything else, they must accept that Death is not guessing. He is not 99% accurate; he is *correct*.
      *   *Why:* If there is uncertainty, this becomes a probability problem (which your Data Guy will try to solve). It must be a logic problem.
  2.  **The Stipulation of Non-Causality:** They must accept that your decision does not *move* Death. Death's location is fixed before you choose.
      *   *Why:* If your choice moves Death, it's a self-fulfilling prophecy (causal). The puzzle requires the correlation to exist *without* the causation.
  3.  **The Stipulation of Agency:** They must accept that you *do* choose. You are not a robot reading a script.
      *   *Why:* If you don't choose, it's fatalism. The pain of the puzzle comes from having to choose while knowing the choice is predicted.
  4.  **The Collision (The "Chest" Moment):** Only after 1–3 are locked down do you introduce the conflict: *Your choice is evidence of Death's location, even though it doesn't cause it.*
      *   *Why:* This is where the "gear-change" happens. This is where they feel the tension between "I can change where I am" and "Where I am tells me where Death is."

  **Sequence:** Story → Stipulations (Whiteboard) → The Collision → The Journalism Link.

  ### 2. The Carrying Example
  **Tell the Death story straight.** Do not start with a parking officer.
  *   **Why:** The stakes need to be high enough to trigger intuition. If the stakes are a parking ticket, the room will treat it as a game. If the stake is life, their brains engage the "survival" heuristic, which makes the logical trap feel visceral.
  *   **The Constraint:** You must immediately "de-mystify" Death. Do not let him be a supernatural reaper. Frame him on the whiteboard as **"The Perfect Model."** He is an algorithm with 100% accuracy on your behavior.
  *   **Must Have:**
      *   **Symmetry:** It doesn't matter which city you pick; the penalty is the same. (This prevents "just pick the safer city" answers).
      *   **Immutability:** Death's location is set *before* you leave the room.
  *   **Must Not Have:**
      *   **Time Travel:** Death does not see the future; he sees the *present facts* that determine your future.
      *   **Mind Reading:** He isn't reading your thoughts; he's modeling your decision process.
      *   **Chasing:** He is not following you; he is waiting at the destination.

  ### 3. Misconception Map (Order of Surface & Handling)
  Expect these objections in this specific order. Head them off at the pass.

  1.  **"Death's bluffing / He can't know."**
      *   *When:* Immediately after the story.
      *   *Handle:* **Stipulate it away.** "For the sake of this 45 minutes, assume the model is perfect. If you break the model, you break the puzzle." Write **P(Death Correct) = 1** on the board.
  2.  **"This is Newcomb's Problem." (The Markets Reporter)**
      *   *When:* Within the first 5 minutes.
      *   *Handle:* **Validate and Pivot.** "You are exactly right. It uses the same engine. But Newcomb is about taking money; this is about avoiding fate. The symmetry changes how it feels." Do not let him derail into a lecture on Box A vs. Box B. Acknowledge him, then return to the Death story.
  3.  **"Just flip a coin / Randomize." (The Data Guy)**
      *   *When:* Once the trap is set.
      *   *Handle:* **The Hard Counter.** This is the most dangerous objection. If you randomize, Death predicts the *outcome of the coin*.
      *   *Script:* "If your strategy is 'flip a coin,' Death predicts the coin result. He is in the city the coin lands on. Randomization breaks your predictability, but it doesn't break *his*."
      *   *Nuance:* If pressed, admit that mixed strategies are a technical solution in some decision theories, but for this room, the point is that *you still die*. The randomization doesn't save you, it just makes the prediction harder to compute (but not impossible for a perfect model).
  4.  **"It's a self-fulfilling prophecy." (The Health Reporter)**
      *   *When:* Mid-discussion.
      *   *Handle:* **Distinguish Cause from Signal.** "In a self-fulfilling prophecy, my going to Aleppo *causes* Death to go to Aleppo. Here, Death is *already* in Aleppo. My going there is just the reveal." Draw an arrow: Decision → Death (Causal) vs. Decision ← Common Cause → Death (Evidential).
  5.  **"So nothing matters / Fatalism." (The Room Drift)**
      *   *When:* The end, if you haven't anchored it.
      *   *Handle:* **Reclaim Agency.** "Your decision matters because it determines *which* group you are in: the group that was in Aleppo and died, or the group that was in Damascus and died. You can't change the outcome, but you are still the one choosing the path. That is the horror."
  6.  **"The answer is obviously stay put."**
      *   *When:* Anytime.
      *   *Handle:* **Let it sit.** Don't argue. Ask: "Why? What rule are you using?" This exposes their hidden decision theory.

  ### 4. Naming Conventions
  **Your instinct is correct: Skip the labels (CDT/EDT) until the final two minutes.**
  *   **Why:** Labels turn it into a team sport ("I'm Team Causal"). You want them to feel the tension, not pick a side.
  *   **The Cost:** You risk imprecision.
  *   **The Fix:** Use functional descriptions. Call them **"The Interventionists"** (What happens if I do X?) and **"The Observers"** (What does doing X tell me?).
  *   **The Reveal:** In the last 2 minutes, write "Causal Decision Theory" and "Evidential Decision Theory" on the board. Say: "If you want to Google this later, these are the names. But in this room, we just call it the gear-change."

  ### 5. Comprehension Check (The Variant)
  Do not quiz them. Give them a variant where the "obvious" answer flips depending on which gear they are in.

  **The Headline Variant:**
  > "You are the editor. A perfect algorithm has already predicted whether you will run the headline 'BANK RUN IMMINENT.'
  > If the algorithm predicted 'Run,' the bank is *already* insolvent (because the algorithm knows the truth).
  > If the algorithm predicted 'Kill,' the bank is *already* solvent.
  > You don't know the bank's status. You only know the algorithm is perfect.
  > **Do you run the headline?**"

  *   **The Trap:**
      *   **Interventionist (Causal):** "Running the headline doesn't change the bank's solvency. So run it if it's news."
      *   **Observer (Evidential):** "If I run it, that is evidence the bank is insolvent. If I kill it, evidence it's solvent. Do I want to be the editor who broke a solvent bank? Or the one who hid an insolvent one?"
  *   **The Tell:** People who "got it" will hesitate and say, "It depends on whether my headline *causes* the run or *signals* the state." People who missed it will say, "Obviously run the truth," missing the evidential link.

  ### 6. What to Cut (The "Do Not Open" Doors)
  You have 45 minutes. You must ruthlessly cut the following:
  *   **Ratifiability:** Do not explain that you can't "ratify" your decision. It's too technical.
  *   **The History:** No mention of Gibbard, Harper, or 1978. It doesn't help the feeling.
  *   **Timeless Decision Theory:** The Markets Reporter might bring this up. Acknowledge it as "a newer attempt to fix this," but move on.
  *   **The "Solution":** There is no consensus solution in philosophy. Do not promise one. The point is the *conflict*, not the resolution.

  ### 7. Timing & Flow (45 Minutes)
  *   **00:00 – 05:00: The Story.** Tell the Death in Damascus tale. Keep it stark. No jokes.
  *   **05:00 – 15:00: The Whiteboard Setup.** Draw the two cities. Draw Death. Write the three stipulations (Infallible, Fixed, Agency). Field the "Bluffing" and "Newcomb" objections here.
  *   **15:00 – 25:00: The Collision.** Ask: "Where do you go?" Let them argue. Bring in the Data Guy on randomization. Let the room feel the frustration.
  *   **25:00 – 35:00: The Gear-Change.** Pivot to journalism. "How is this different from writing a story about a bank run?" Connect the "Interventionist" vs. "Observer" modes to their daily work.
  *   **35:00 – 40:00: The Headline Variant.** Pose the comprehension check. Let them wrestle for 3 minutes.
  *   **40:00 – 45:00: The Labels & Close.** Reveal CDT/EDT names. End on the idea that good reporting requires knowing which gear you are in.

  ### 8. A Flag on Your Framing
  You asked to be flagged if your framing is wrong.
  **Your framing is correct, but with one caveat:**
  You describe the slide as: *"what would happen if we did X"* to *"what does it tell us that somebody's doing X."*
  In Death in Damascus, the slide is slightly sharper: *"What would happen if I did X"* (Causal: I move, Death stays) vs. *"What does my doing X tell me about what has already happened"* (Evidential: I move, which reveals where Death already is).
  **Adjustment:** Make sure you emphasize that the Evidential view is about **backward-looking information**, not just general correlation. In journalism, this is the difference between "Will my story cause a panic?" (Causal) and "Does the fact that I am writing this story mean the panic is already inevitable?" (Evidential).
  If you nail that distinction, the room will feel it. If you blur it, they will drift into fatalism. Keep the arrow of time clear: Death is already there. Your choice just reveals the location.
