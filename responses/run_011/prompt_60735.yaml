      *   Specific advice on the "Randomize" objection: This is the trickiest. In standard Death in Damascus, if Death predicts the *strategy*, randomizing doesn't help. If Death predicts the *act*, randomizing breaks the prediction. Need to stipulate Death predicts the *act*.

