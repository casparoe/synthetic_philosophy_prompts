      *   *Must Nots:* Time travel, Mind reading (in the psychic sense), Bluffing.
      *   *Refinement:* Tell the Death story, but frame Death as a "Perfect Model." Then, pivot to the newsroom analogy (Prediction Markets) to ground it.

