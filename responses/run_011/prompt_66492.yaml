  1. Patient 402 presents with a focal ischemic stroke sparing the insula and anterior cingulate but damaging the ventral striatum, resulting in a state where nociceptive input retains its sensory and affective urgency but fails to generate motivational states. When a heated probe is applied, she states, "The pain insists my hand is in danger and demands I move it, yet I feel no wish to stop the heat," while simultaneously engaging in lively conversation about her family and voluntarily moving the hand only when explicitly instructed to do so. She denies depression or indifference to her general well-being, noting she would want the heat stopped if it threatened her ability to care for her children, but currently lacks the immediate desire to act on the pain itself.

  2. The Imperative View says the experience is Unpleasant because the pain retains the authoritative command content ("demands I move it") regardless of whether the subject obeys or wants to obey.

  3. The Higher-Order Desire View says the experience is Not Unpleasant because the subject explicitly lacks the second-order desire for the experience to cease, which is the sole constitutive condition of unpleasantness on this account.

  4. The ventral striatum lesion dissociates imperative content from motivational desire, forcing Evaluativism to side with Imperativism because the representation of badness remains intact without the desire. If removed, the desire returns, aligning all three theories on Unpleasant.

  5. Higher-Order Desire proponents will argue that acknowledging a command to protect *constitutes* a desire to stop, rendering the patient's testimony conceptually confused rather than phenomenologically accurate.
