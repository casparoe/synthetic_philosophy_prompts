  2.  **Deconstruct Libet's Experiment (DSP Translation):**
      *   *The Setup:* Subject sits, EEG cap on, told to flex wrist whenever they feel like it. Note the time they felt the "urge" (W-time). Measure muscle activation (EMG). Measure brain activity (EEG).
      *   *The Signal:* EEG voltage (microvolts) over time. Specifically, the "Readiness Potential" (RP).
      *   *Time Zero:* The physical event (EMG spike/muscle flex). Let's call this $T_{move}$.
      *   *The Trigger:* The decision to move? Or the neural command? In Libet's view, the RP start is the neural commitment.
      *   *Latency:*
          *   Neural processing time (RP start to EMG).
          *   Conscious awareness latency (W-time to $T_{move}$).
          *   Reporting latency (Subject noting the clock position).
      *   *The Claim:* RP starts at $T_{move} - 550ms$. W-time is at $T_{move} - 200ms$. Therefore, Neural Process starts before Conscious Awareness.
      *   *The Conclusion:* Consciousness is a monitor, not the controller. "You" (conscious self) are late to the mix.

  3.  **Drafting the DSP Translation (Section 1):**
      *   *Signal:* The EEG trace. Specifically, the DC shift or slow cortical potential.
      *   *Noise:* Background neural activity (alpha, beta, environmental interference).
      *   *Averaging:* Libet averaged many trials aligned to $T_{move}$ to see the RP. (Crucial point for the user's hunch later).
      *   *Trigger Threshold:* The EMG spike defining $T_{move}$.
      *   *Timestamp:* The "W-time" (subject's report of when they felt the urge).
      *   *Latency/Offset:* The gap between RP onset and W-time.
      *   *Clock Sync:* The rotating dot clock used to capture W-time.
      *   *The Argument:* The system initiates the output sequence (RP) 350ms before the monitoring subsystem (consciousness) flags the event. The monitoring subsystem claims authorship, but the log files show the process started upstream.

  4.  **Developing the Residue Report (Section 2):**
      *   *Clean Translations:* Timing, latency, signal vs. noise, averaging, thresholding.
      *   *Bent Shapes:* "Urge" (is it a signal level or a state?), "Commitment" (is a voltage rise a commitment or just drift?).
      *   *No Expression (The Nulls):*
          *   *Veto:* Libet said we can't stop the start, but we can stop the finish. In DSP, this is a final mute button. But who presses it?
          *   *Qualia ("Felt Sense"):* DSP deals with voltage, not what it *feels like* to be the voltage.
          *   *Agency/Ownership:* "Mine." DSP doesn't care about ownership, only causality.
      *   *Interpretation:* If you remove "you" and "decide," the argument becomes: "Sub-system A activates before Sub-system B reports." That's just architecture. The *philosophical* sting requires Sub-system B to be identified as "The Operator." If the vocabulary can't express "Operator," the argument loses its bite *as philosophy*, but remains valid *as physiology*.

