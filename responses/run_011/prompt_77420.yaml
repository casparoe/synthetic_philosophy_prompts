prompt: |-
  My flatmate has a line he wheels out whenever the subject of having children comes up: better never to have been. He delivers it as though it settles things, usually followed by something about that asymmetry — the absence of pain supposedly being a good thing even when nobody's around to enjoy it, while the absence of pleasure only counts as bad if there's someone actually being deprived of it. But I've heard the same words said over a hospital bed as a kind of comfort, and there they obviously can't mean what he means.

  Can you pull apart the different precise claims that sentence might be making? I keep loosing track of whether it's meant as a comparison between two states of the world, or a claim about some particular person's good, or really just a verdict on whether bringing someone into existence is permissible — and some of those readings seem to need a subject who doesn't exist, which I can't tell whether that's fatal or just loose talk. There's also the slide between never having been and not being now, which he exploits constantly.

  Lay them out as a menu rather than picking your favourite, mark each one as bland, arguable or flat out false, and say which of them — if any — would get him from there to so dont have kids. No reading list needed, just the ideas, and British English please.
