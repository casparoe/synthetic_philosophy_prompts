answer: |-
  Your flatmate is relying on a phrase that acts like a linguistic chameleon. It changes colour depending on whether it's being used to argue a point of ethics or to offer comfort in a tragedy. The confusion you're feeling is entirely warranted because the sentence tries to do three different jobs at once: describe a state of affairs, evaluate a life, and prescribe an action.

  Here is a menu of the four precise claims hidden inside "better never to have been", labelled for their plausibility and tested for whether they actually get you to "so don't have kids".

  ### 1. The Prudential Claim
  **The Idea:** This is the one your flatmate is using. It asserts that for any potential person, non-existence is preferable to existence. It relies on the asymmetry you mentioned: the absence of pain is good (even if no one is there to enjoy that good), but the absence of pleasure is not bad (unless there is someone deprived of it). Therefore, coming into existence always incurs a net loss or risk that outweighs the gain.
  *   **Status:** **Arguable.** It is philosophically contentious because it requires comparing existence with non-existence *for the sake of* the person who doesn't exist. Many philosophers argue this is incoherent: if there is no subject, there is no one for whom it can be "better". It treats non-existence as a state of blissful rest rather than simply nothingness.
  *   **Does it lead to "don't have kids"?** **Yes.** If you accept that coming into existence is always a harm *to the child*, then procreation becomes an act of inflicting harm.

  ### 2. The Impersonal Claim
  **The Idea:** This claim drops the focus on the individual child and looks at the universe. It suggests that a state of affairs containing less suffering is objectively better than one containing more, regardless of whether there is anyone around to notice the difference. It values the absence of pain as a cosmic good.
  *   **Status:** **Arguable.** This depends entirely on your moral framework. A negative utilitarian might agree that reducing suffering is the only moral imperative. However, most people would argue that a world with happy people is better than an empty world, even if the happy people endure some pain. It assumes pain outweighs pleasure in the grand calculus.
  *   **Does it lead to "don't have kids"?** **Yes.** If creating new people adds more suffering to the cosmic total than the pleasure justifies, then stopping procreation improves the world's overall value.

  ### 3. The Retrospective Claim
  **The Idea:** This is the hospital bed usage. It is spoken by an *existing* person looking back on a life that has become unbearable. It means: "Given the specific amount of suffering I have endured, I judge that my life has been a net negative, and I wish I had not started it."
  *   **Status:** **Bland.** It is empirically true that some people, in moments of extreme agony or depression, sincerely feel this way. It is a report of a psychological state, not a metaphysical truth. It does not claim life is *always* this bad, only that *this* life has become too hard to bear.
  *   **Does it lead to "don't have kids"?** **No.** This is a verdict on a life already lived, not a rule for future lives. Using this to argue against having children is a generalisation from the worst-case scenarios to the average case.

  ### 4. The Equivocation Claim
  **The Idea:** This is the slide you noticed between "never having been" and "not being now". It treats prenatal non-existence (before you were born) and posthumous non-existence (after you die) as the same thing, and further suggests that returning to non-existence (death) is the same as never having existed.
  *   **Status:** **Flat out false.** These are logically distinct. "Never having been" implies no subject was ever created. "Not being now" implies a subject existed and has ceased. The harm of death is the deprivation of a future; the "harm" of never being born is... nothing, because there is no one to be deprived. Conflating the two allows your flatmate to borrow the emotional weight of the hospital bed (Claim 3) to support the antinatalist conclusion (Claim 1).
  *   **Does it lead to "don't have kids"?** **No.** It is a logical error. However, it is the rhetorical bridge your flatmate uses to make the other claims feel more intuitive.

  ### Summary of the Trick
  Your flatmate is likely using **Claim 4** to make **Claim 3** feel like it supports **Claim 1**.

  He wants you to feel the truth of the hospital bed sentiment (that suffering can make life not worth living) and then slide that feeling over to the potential child (so they shouldn't be born). But the hospital bed sentiment is about *regret* from an existing perspective, whereas the antinatalist argument is about *prevention* from a non-existing perspective.

  If you want to pin him down, ask him which claim he is making. If he says it's about the child's good (Claim 1), ask him how something can be good *for* a person who isn't there. If he says it's about the world's suffering (Claim 2), ask him if he truly believes a world with no joy is better than a world with joy and some pain. If he points to the suffering of existing people (Claim 3), remind him that most people do not wish they were dead, and we generally don't base universal rules on the worst tragedies.
