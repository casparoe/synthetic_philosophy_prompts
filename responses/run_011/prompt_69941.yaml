      *   *Devon's Leap:* She assumes that because the *category* is political, the *quality* judgment is suspended or guaranteed. Or she assumes that "on-message" automatically equals "good propaganda."
      *   *User's Hunch:* The user suspects the true claims impose *higher* craft demands. I agree with the user. If art is propaganda, it needs to be *effective* propaganda. Sloganeering is usually ineffective propaganda.

