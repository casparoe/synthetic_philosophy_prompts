      *   *Source:* "Criteria of Negro Art" (1926), speech given at NAACP banquet, published in *The Crisis*.
      *   *Key Quote:* "Thus all Art is propaganda and ever must be, despite the wailing of the purists."
      *   *Nuance:* Du Bois wasn't saying "make bad art." He was saying Black artists *cannot afford* the luxury of "art for art's sake" because the world is actively destroying Black people. He demands Truth, Goodness, and Beauty. He explicitly argues *for* beauty.
      *   *Confidence:* High on the general argument, specific phrasing should be paraphrased or quoted only if certain (I know the "propaganda" line is real).
      *   *Verdict:* Du Bois supports the User, not Devon. Du Bois argues for high standards *because* the stakes are high.

