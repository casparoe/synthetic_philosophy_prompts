      *   *Claim 1 (Causal):* Art has political effects. (Weak/Platitude)
      *   *Claim 2 (Intentional):* Art is made to persuade. (Stronger, often false)
      *   *Claim 3 (Contextual):* Reception is determined by social position/market. (Sociological)
