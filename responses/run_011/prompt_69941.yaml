  *(Self-Correction on Du Bois Quote)*: I am confident in the line "Thus all Art is propaganda and ever must be, despite the wailing of the purists." I can use that. I should not invent a page number. I will cite the publication (*The Crisis*, 1926).

  *(Self-Correction on Kant)*: The user asks if they are smuggling in a Kantian premise. I should address this. The "Art for Art's Sake" worry *is* Kantian/Schillerian. But Du Bois rejects the *availability* of that stance for Black artists, not necessarily the *value* of beauty. I need to be precise there.

