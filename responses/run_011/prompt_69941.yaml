  3.  **Evaluate Each Claim (Truth & Scope):**
      *   *Claim 1:* True. Even abstract art exists in a context. Scope: All art.
      *   *Claim 2:* False/Defensible only for specific genres. Scope: Some art.
      *   *Claim 3:* True (Bourdieu-ish). Scope: All art, but heavily weighted for marginalized artists.
      *   *Claim 4:* Controversial. Reduces art to utility. Scope: Normative.
      *   *Claim 5:* Radical. Challenges autonomy of aesthetics. Scope: All art (if true).
