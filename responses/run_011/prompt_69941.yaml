answer: |-
  You are right to be worried, and your intuition about Du Bois is significantly more accurate than Devon's sloganizing. Devon has taken a complex sociological and aesthetic argument and flattened it into a permission slip for didacticism. If you write your guidelines based on her reading, you will get exactly what you fear: a stack of literal-minded illustrations that feel like homework, and you will have alienated the artists capable of subtlety.

  Here is the breakdown of the claims hidden inside "All art is propaganda," followed by the Du Bois reconstruction, and finally, a verdict on Devon's logic.

  ### The Menu of Claims
  I have ordered these from "hard to disagree with" to "highly controversial."

  **1. The Causal Claim:** *Art produces political effects, regardless of intent.*
  *   **Verdict:** True. Even a landscape painting reinforces a relationship between humans and land, or offers an escape from labor, etc.
  *   **Scope:** All art.
  *   **Relevance:** This is a description of reception, not creation. It doesn't tell you what to ask for.

  **2. The Neutrality Claim:** *Refusing to be explicit about politics defaults to the dominant group's message.*
  *   **Verdict:** Defensible/True. In a stratified society, "neutral" usually means "consistent with the status quo." An abstract piece in a vacuum is neutral; an abstract piece in a racialized society is read through the lens of who made it and where it hangs.
  *   **Scope:** All art, but disproportionately impacts marginalized artists (who are read as "representative" while white artists are read as "individual").
  *   **Relevance:** This validates Devon's point that you can't escape politics. It does *not* validate that explicit messaging is superior.

  **3. The Contextual Claim:** *The social position of the maker and the market determine how art functions politically.*
  *   **Verdict:** True. A poem about poverty reads differently if written by a tenured professor vs. someone experiencing homelessness.
  *   **Scope:** All art.
  *   **Relevance:** This suggests your guidelines should consider *who* you are inviting, not just *what* they make.

  **4. The Intentional Claim:** *All art is made in order to persuade.*
  *   **Verdict:** False. Much art is made to explore, express, confuse, or delight. Reducing all intention to persuasion is reductive.
  *   **Scope:** Some art (polemics), not all.
  *   **Relevance:** Devon relies on this to equate "art" with "messaging." This is the weak link.

  **5. The Normative Claim:** *Art ought to be judged primarily by its political consequences.*
  *   **Verdict:** Controversial/Debatable. This is a utilitarian view of aesthetics. It risks discarding work that is politically ambiguous but aesthetically groundbreaking.
  *   **Scope:** Normative (a choice of values).
  *   **Relevance:** If you adopt this, you become a censor of "ineffective" art.

  **6. The Ontological Claim:** *Aesthetic value cannot be separated from political function.*
  *   **Verdict:** Radical/Defensible. This argues that "beauty" isn't a separate sphere; a beautiful lie is aesthetically compromised.
  *   **Scope:** All art (if true).
  *   **Relevance:** This is the Du Boisian sweet spot. It means bad politics can make for bad art, and vice versa.

  ### Reconstructing Du Bois (Confidence: High on Argument, Specifics Paraphrased)
  You are recalling **"Criteria of Negro Art,"** an address Du Bois gave at the NAACP banquet in 1926, published in *The Crisis* (October 1926). I am not inventing quotes, but I am synthesizing the argument structure.

  The famous line is indeed: *"Thus all Art is propaganda and ever must be, despite the wailing of the purists."*

  However, Devon stops reading at the period. Du Bois spends the rest of the essay arguing *against* the idea that propaganda means "sloganeering." His argument rests on three pillars:

  1.  **The Necessity of Utility:** Du Bois argues that for Black artists, "Art for Art's Sake" is a luxury they cannot afford because the world is actively engaged in destroying Black people. If art does not fight that, it is irrelevant. This supports Devon's claim that neutrality isn't an option.
  2.  **The Demand for Truth:** Du Bois explicitly critiques propaganda that airbrushes reality. He writes about refusing to paint Black people only as saints if they are not saints. He demands the "ugly" be shown if it is true. This contradicts the idea of "on-message" if "on-message" means "comforting narratives."
  3.  **The Primacy of Beauty:** This is where Devon is wrong. Du Bois argues that for propaganda to *work*, it must be beautiful. He writes that he cares nothing for art that fails to be beautiful. His logic is pragmatic: ugly propaganda is ignored. Therefore, **craft is a political requirement.**

  **Confidence Note:** I am certain of the "propaganda" quote and the triad of Truth/Goodness/Beauty as his criteria. I am reconstructing the logical flow regarding beauty as a functional necessity from the text's overall thrust.

  **Verdict on Du Bois:** He is not saying "anything political counts as art." He is saying "because the stakes are life and death, you cannot afford to make boring, ugly, or simplistic art."

  ### The Verdict on Devon's Logic
  Devon's conclusion is that **"being on-message carries no aesthetic cost."**
  To support this, she needs **Claim 4 (Intentional)** and **Claim 5 (Normative)** to be true in a specific way: she needs it to be the case that *explicit* political intent guarantees *political efficacy*, and that political efficacy is the only metric of success.

  **She is wrong.** Here is why:

  1.  **The "Illustrated Op-Ed" Problem:** If you judge art solely by its message, you lower the barrier for entry. A stick figure drawing with the right slogan satisfies the "propaganda" requirement more clearly than a complex abstract piece. If there is "no aesthetic cost," then craft doesn't matter. But if craft doesn't matter, the propaganda fails (per Du Bois).
  2.  **The Inevitability vs. Immunity Fallacy:** Just because all art *is* political (Claim 1 & 2) does not mean all political art is *good*. In fact, making the politics explicit raises the stakes. If you promise a show on racial justice and deliver clichés, the aesthetic failure is also a political failure.
  3.  **The Kantian Smuggle:** You asked if you are smuggling in a Kantian premise about "disinterested judgment." You are, but **Du Bois agrees with you.** Du Bois rejects the *availability* of disinterestedness for Black artists, but he does not reject the *value* of aesthetic experience. He wants the viewer to be captivated (an aesthetic experience) in service of the cause. Devon is the one smuggling in a crude utilitarianism that Du Bois explicitly warned against.

  **Your hunch is correct:** The true claims (1, 2, 3, 6) cut the other way. They impose **higher** craft demands. If art is propaganda, it must be *effective* propaganda. Sloganeering is rarely effective. Ambiguity, beauty, and complexity are often more persuasive because they invite the viewer in rather than lecturing them.

  ### Recommendation for the Guidelines
  Do not write guidelines that say "We want political art." Write guidelines that demand **engagement.**

  1.  **Avoid the word "Propaganda":** It signals to artists that you want posters.
  2.  **Focus on Inquiry:** Ask for work that "interrogates," "complicates," or "wrestles with" racial justice. This invites the abstract piece (which might wrestle with tension) and filters out the illustrated op-ed (which usually claims to have answers).
  3.  **Cite the Stakes:** You can explicitly mention that in a limited space with a limited budget, you are looking for work that respects the viewer's intelligence.
  4.  **The Du Bois Compromise:** If Devon pushes back, tell her you are adopting the Du Bois standard: "We are asking for propaganda, which means we are asking for work beautiful enough to make the message stick."

  **Drafting Suggestion:**
  *"We are seeking work that engages with the complexities of racial justice. We are not looking for illustrations of slogans or didactic statements. We believe that the politics of a piece are embedded in its craft, its truth-telling, and its aesthetic choices. We welcome abstract, figurative, and experimental work, provided it grapples seriously with the theme."*

  This protects your friend's abstract piece (it grapples) while giving you grounds to reject a lazy cartoon (it illustrates a slogan rather than grappling). It honors Du Bois without validating Devon's simplification.
