answer: |-
  Elias stood at the loading dock, clipboard heavy in his hand. The shipping manifest demanded a binary truth for every crate: "Will this thing shatter if you hit it — Yes or No." Henderson tapped his watch. 3:45 PM.

  Forklift one dropped Crate 404. Bio-Anneal Pane. Elias took the calibrated hammer. He tapped the corner. A hairline fracture bloomed white, then vanished. Microcapsules had ruptured, releasing agent that cooked the crack shut before it could run. The surface smoothed over.

  "It didn't break," Miller said, leaning on his broom. "Mark it No."
  "It's brittle glass," Sarah countered, checking the spec sheet. "The stuff inside wants to snap. Mark it Yes."
  Elias watched the healed line. The shattering never got going. He checked No.

  Forklift two brought Crate 405. Poly-Seal. Looked like standard float-line glass. Elias swung the hammer. A solid thud. No mark.
  "See?" Miller said. "Hit it, nothing happens. No."
  "Take it downstairs," Sarah said. "Soak it in solvent for an hour. The resin washes out of the surface flaws. Then it shatters like anything else."
  "But right now?" Miller jabbed the crate. "Right now it holds."
  "It's just waiting," Sarah said. "The stuff is glass. The protection is temporary."
  Elias looked at the untouched surface. Until somebody strips it, hitting it does nothing. But the material underneath was dead weight. He checked Yes.

  Forklift three dropped Crate 406. Kinetic-Lam. Thick laminate. Elias leaned on it with the mallet. Tough as steel. He swung harder. The impact triggered a phase change in the interlayer. The whole thing flew apart partway through the blow. It only became the shattering kind of thing once he'd started hitting it.
  "It exploded," Miller said. "Yes."
  "It's tough sitting there," Sarah argued. "Only breaks because you hit it. No."
  "It broke when I hit it," Miller said.
  "It changed because you hit it," Sarah said.
  They were shouting now, voices bouncing off the steel containers. Henderson walked over, pen ready. "I need these forms finished by 4."

  Elias looked at the three crates. One healed itself. One hid its weakness. One woke up dangerous. The box couldn't answer the same question for all of them. Miller wanted the outcome. Sarah wanted the material. The form asked for a promise the physics wouldn't keep.

  He signed the bottom line.

  Crate 404: No
  Crate 405: Yes
  Crate 406: Yes

  It measures not the object or the hit, but the stability of the link between them.
