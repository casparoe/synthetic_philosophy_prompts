  So my brother's been inside for six years and he supposedly comes up in March, except the state he's in got rid of discretionary parole a while back, so "comes up" mostly means paperwork. I started going to this little reform group in town to figure out what's actually worth pushing for, and the woman who runs it is a retired ICU nurse. She's not the first person to say crime is a disease and prison ought to be a hospital, but she's got a sharper version of it and she uses it on everybody in the room: a sentence is like a course of antibiotics. You finish the whole course even after the fever breaks, because quitting early is what breeds resistance, and the length is set by the infection, not by how the patient feels about it halfway through. She runs it two ways — to say the people who want prison to be therapy are being soft, and, way more relevant to me, to argue that getting rid of the parole boards was correct, because letting a guy out when he seems better is exactly the error that made the superbugs.

  It's very persuasive live and I keep finding I cant argue back, but something feels off and I can't locate it. Can you audit the thing for me? Spell out the correspondence first — what's the pathogen, what's the drug, what's the fever breaking, what's resistance, who's the prescriber and who's supposed to be the patient here — and then tell me which of the disanalogies actually bite on the use she's putting it to and which are just noise I should ignore. I especially want to know whether it's smuggling in a whole theory of punishment while dressed up as clinical common sense, and whether she can hold both halves of her point at once, since "he's sick, not bad" and "the term is fixed regardless of whether he's gotten better" feel like they're pulling in opposite directions. And then: does the no-parole conclusion survive once you take the analogy apart, and if not, what would be a better analogy for the thing she's actually right about — because I'm pretty sure she is right about something.

  Exactly five numbered points, one or two sentences each, no intro and no wrap-up at the end.
