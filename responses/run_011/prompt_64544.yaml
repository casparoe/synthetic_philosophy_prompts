  Headline Credence: **0.75**

  **Definition of "Reliably Favor":** I am scoring this against **"close to correct" (e.g., >90% accuracy)**, not just "better than an unaided weak judge." If the protocol only achieves 55% accuracy in the obfuscated regime, I count that as failing to "reliably favor" truth for alignment purposes. This adds ~0.15 to the proposition's probability compared to the "better than random" baseline.

  ### Decomposition

  1.  **P(The bottleneck is fundamental complexity, not just resource bounds): 0.90**
      *   *Justification:* The Brown-Cohen et al. result formalizes this as a search problem; if the judge cannot verify a leaf in polynomial time, the liar can hide a flaw in an exponential tree. This is a complexity ceiling, not an engineering lag.
  2.  **P(Rulebook changes fail to restore asymmetry): 0.80**
      *   *Justification:* Commitments and spot-checks force consistency, but not truth. Unless the rulebook forces the debater to output *verifiable proofs* (which defeats the purpose of debating natural language claims), the liar can commit to consistent falsehoods.
  3.  **P(Honest debater has no 'conjunction attack' escape hatch): 0.85**
      *   *Justification:* A weak judge cannot evaluate the probability of a large conjunction any better than they can evaluate a single node. "This smells wrong" is not a adjudicable move under the protocol's strict rules.
  4.  **P(The obfuscated regime is unavoidable for alignment tasks): 0.60**
      *   *Justification:* While some facts are easy, high-stakes alignment claims (e.g., "this code has no backdoor") are structurally identical to the obfuscated regime. I am more pessimistic than average that "real world" structure saves us here.
  5.  **P("Reliably" requires safety-grade accuracy, not marginal gain): 0.80**
      *   *Justification:* For alignment, a protocol that is only slightly better than a coin flip is a failure mode waiting to be exploited by optimization pressure.

  **Combination Logic:**
  I treat the headline as the probability that the *practical* claim holds (The limit is real, fixes don't work, and it matters).
  Calculation: $0.90 \times 0.80 \times 0.85 \times [0.60 \text{ (Relevance)} + 0.40 \times 0.5] \times 0.80 \approx 0.75$.
