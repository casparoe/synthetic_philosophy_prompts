  # Decision Tree: Stakes and Knowledge in Automated Systems

  **Instructions:** Start at Node 1. Answer the question based on your understanding of your deployment documents and system behavior. Follow the branch to the next node or leaf.

  ### Node 1
  **Question:** When the document says the system "knows," is it claiming the system matches reality (Fact), or that it is cleared to block (License)?
  **Tag:** Semantic (Meaning of "knows")
  *   **If Cleared to block:** Go to Node 2.
  *   **If Matches reality:** Go to Node 3.

  ### Node 2
  **Question:** Whose financial risk validates the clearance? The company paying the loss (Payer), the human reviewer (Analyst), or the software process (System)?
  **Tag:** Substantive (Whose stakes count)
  *   **If Company paying the loss:** → **Leaf 1**
  *   **If Human reviewer:** → **Leaf 2**
  *   **If Software process:** → **Leaf 3**

  ### Node 3
  **Question:** Do the financial costs of being wrong change whether the system knows, even if the probability evidence is identical?
  **Tag:** Substantive (Sensitivity of knowledge)
  *   **Yes:** Go to Node 4.
  *   **No:** Go to Node 5.

  ### Node 4
  **Question:** In your case, high fraud costs lower the evidence needed to block. Does your view allow knowledge to become *easier* when the cost of inaction is high, or must high stakes always demand *more* evidence?
  **Tag:** Substantive (Direction of effect)
  *   **Allows easier knowledge (Variable):** → **Leaf 4**
  *   **Demands more evidence (Fixed):** → **Leaf 5**

  ### Node 5
  **Question:** Is the difference between the two documents merely a sloppy use of the word "knows" (False), or does the word "knows" change its meaning based on context (True)?
  **Tag:** Semantic (Truth conditions)
  *   **Sloppy/False:** → **Leaf 6**
  *   **Changes Meaning/True:** Go to Node 6.

  ### Node 6
  **Question:** Does the context change which data counts as *evidence*, or only the *threshold* of evidence required?
  **Tag:** Semantic (Evidence vs. Threshold)
  *   **Changes Evidence:** → **Leaf 7**
  *   **Changes Threshold:** Go to Node 7.

  ### Node 7
  **Question:** Does the shift track the total money at risk (Magnitude) or the ratio of error costs (Structure)?
  **Tag:** Semantic (Magnitude vs. Structure)
  *   **Magnitude:** → **Leaf 8**
  *   **Structure:** → **Leaf 9**

  ---

  ### Leaves

  **Leaf 1: Knowledge is action-authorization validated by payer costs.**
  *   **Defining Claim:** "Knows" is a normative status granted when the expected cost of acting is lower than the expected cost of inaction for the payer.
  *   **Verdict on High-Value Document:** True (Non-truth-apt factually, but correct normatively).
  *   **Awkward Commitment:** You must admit the system "knew" the transaction was fraudulent even if it was actually legitimate, provided the bet was rational.
  *   *(Corresponds to: Pragmatic Instrumentalism)*

  **Leaf 2: Knowledge is action-authorization validated by analyst costs.**
  *   **Defining Claim:** "Knows" is a normative status granted when the expected cost of acting is lower than the expected cost of inaction for the reviewer.
  *   **Verdict on High-Value Document:** False (Unless analyst costs align with company costs).
  *   **Awkward Commitment:** The system's knowledge status changes if you hire a cheaper or more expensive support team, even if fraud losses stay constant.
  *   *(Corresponds to: Unexplored Subject-Sensitive Variant)*

  **Leaf 3: Knowledge is action-authorization validated by system costs.**
  *   **Defining Claim:** "Knows" is a normative status granted when the expected cost of acting is lower than the expected cost of inaction for the software process itself.
  *   **Verdict on High-Value Document:** False (Systems have no costs).
  *   **Awkward Commitment:** You must attribute financial interests or utility functions to stateless code to make sense of the word "knows."
  *   *(Corresponds to: Incoherent Anthropomorphism)*

  **Leaf 4: Knowledge is fact-based, stakes-sensitive, and direction-variable.**
  *   **Defining Claim:** Practical stakes change the truth conditions of knowledge claims, allowing less evidence when the cost of inaction is high.
  *   **Verdict on High-Value Document:** True.
  *   **Awkward Commitment:** You must accept that the same evidence constitutes knowledge in one context but not another, reversing the standard philosophical intuition that high stakes always harden the threshold.
  *   *(Corresponds to: Interest-Relative Invariantism with Action-Sensitivity)*

  **Leaf 5: Knowledge is fact-based, stakes-sensitive, and direction-fixed.**
  *   **Defining Claim:** Practical stakes change the truth conditions of knowledge claims, always requiring more evidence as the cost of error rises.
  *   **Verdict on High-Value Document:** False (The threshold is too low for standard stakes theory).
  *   **Awkward Commitment:** You must claim your document is wrong when it says the system "knows" at 0.02, because standard theory says high stakes require higher probability.
  *   *(Corresponds to: Standard Pragmatic Encroachment)*

  **Leaf 6: Knowledge is fact-based, stakes-insensitive, and documents are false.**
  *   **Defining Claim:** Knowledge depends only on evidence and truth; using "knows" for action thresholds is a category error.
  *   **Verdict on High-Value Document:** False.
  *   **Awkward Commitment:** You must treat your own deployment documentation as systematically lying whenever it uses the word "knows."
  *   *(Corresponds to: Traditional Intellectualism)*

  **Leaf 7: Knowledge is fact-based, stakes-insensitive, but stakes change evidence.**
  *   **Defining Claim:** Knowledge depends only on evidence, but practical stakes alter which propositions count as evidence in the first place.
  *   **Verdict on High-Value Document:** True (Contextually).
  *   **Awkward Commitment:** You must claim the cost ratio literally changes the feature set or data inputs the system possesses, rather than just how they are weighed.
  *   *(Corresponds to: Empty Cell - Incoherent)*

  **Leaf 8: Knowledge is fact-based, stakes-insensitive, meaning shifts by magnitude.**
  *   **Defining Claim:** The word "knows" changes meaning by context, tracking the total dollar value at risk.
  *   **Verdict on High-Value Document:** True (Contextually).
  *   **Awkward Commitment:** You must claim that a 0.02 probability counts as knowledge for a $4000 risk but not a $5 risk, even if the error ratio is identical.
  *   *(Corresponds to: Contextualism based on Magnitude)*

  **Leaf 9: Knowledge is fact-based, stakes-insensitive, meaning shifts by structure.**
  *   **Defining Claim:** The word "knows" changes meaning by context, tracking the ratio of false-positive to false-negative costs.
  *   **Verdict on High-Value Document:** True (Contextually).
  *   **Awkward Commitment:** You must accept that "knows" is a variable that encodes a cost-benefit analysis, making it indistinguishable from "justified action" in practice.
  *   *(Corresponds to: Contextualism based on Risk Structure)*

  ---

  ### Empty Cells

  1.  **Leaf 3 (System Costs):** **Incoherent.** A software process has no practical interests, goals, or bank account. Attributing "stakes" to the system itself rather than its operators requires a metaphorical leap no serious epistemological position occupies.
  2.  **Leaf 7 (Stakes Change Evidence):** **Incoherent.** Practical stakes affect how much evidence is *required*, not which data points *exist* or count as evidence. No occupied position claims that cost ratios alter the feature set itself.
  3.  **Leaf 2 (Analyst Costs):** **Unexplored.** Existing stakes-based theories focus on the subject (the knower) or the payer. A view where a third-party reviewer's personal cost structure determines the system's knowledge status is coherent but lacks proponents in the literature.

  ---

  ### Indistinguishability

  **Flagged Pair: Leaf 1 (License/Payer) and Leaf 4 (Fact/Stakes/Variable).**
  *   **Reason:** Both positions validate your high-value document as "True" and both allow stakes to lower the evidence threshold. The tree separates them at Node 1 (Semantic vs. Substantive), but in practice, both permit the exact same engineering behavior and documentation language.
  *   **Separating Evidence:** Ask a philosopher: "If the system blocks a legitimate transaction at 0.02, did it make a knowledge error or a cost error?" Leaf 1 says "Cost error (authorized action)." Leaf 4 says "Knowledge error (false belief), but excusable."

  **Flagged Pair: Leaf 8 (Magnitude) and Leaf 9 (Structure).**
  *   **Reason:** Both positions treat "knows" as context-sensitive and true in your high-value flow. The tree separates them at Node 7, but your current data (where magnitude and ratio both change) does not distinguish them.
  *   **Separating Evidence:** Construct a test case where total money at risk is high ($1M) but the cost ratio is low (1:1), versus low money ($10) with high ratio (1:1000). Leaf 8 says "knows" tracks the $1M. Leaf 9 says "knows" tracks the ratio.

  ---

  ### Where I Land

  **Your Current Practice:**
  1.  **Node 1:** You treat "knows" as a license to block (automation acts on the number). → **Branch: License.**
  2.  **Node 2:** The costs are borne by the company (fees, fraud loss), not the analyst personally. → **Branch: Payer.**
  3.  **Result:** **Leaf 1 (Knowledge is action-authorization validated by payer costs).**
      *   **Path:** Node 1 → Node 2 → Leaf 1.
      *   **Implication:** You are committed to the view that "knows" is not a claim about reality, but a certification of rational action based on company costs. The document is normatively correct but factually silent.

  **If You Delete "Knows":**
  1.  **Node 1:** Without the word, the document describes probabilities and actions. If asked if the system "knows" in the philosophical sense, you would likely say it matches reality only if the probability is high (Fact). → **Branch: Matches reality.**
  2.  **Node 3:** You would likely admit costs don't change the probability evidence (No). → **Branch: No.**
  3.  **Node 5:** You would likely admit the previous documents were sloppy (False). → **Branch: Sloppy/False.**
  4.  **Result:** **Leaf 6 (Knowledge is fact-based, stakes-insensitive, and documents are false).**
      *   **Path:** Node 1 → Node 3 → Node 5 → Leaf 6.
      *   **Implication:** You retreat to the position that your previous documentation was literally false, though pragmatically useful.

  **Classification of Change:**
  Deleting the word "knows" is a **clarification**. It moves you from Leaf 1 (where "knows" is a technical term for "authorized action") to Leaf 6 (where "knows" is reserved for truth-matching). Since Leaf 1 and Leaf 6 agree on the engineering behavior (block at threshold) but disagree on the vocabulary, removing the vocabulary removes the philosophical confusion without changing the system. You are not conceding a philosophical point; you are removing a term that was doing engineering work but carrying philosophical baggage.
