  1. Premise (3) does the real work by establishing that substantive equality of merit renders individual selection irrelevant, which validates the claim in (2) that lot is naturally democratic.
  2. Point (4) supports lot specifically because it eliminates all human preference and particular wills, whereas rotation still imposes a schedule that distinguishes citizens based on timing rather than pure equal chance.
  3. The competence objection is dissolved rather than defeated, since Rousseau explicitly limits the viability of lot to conditions where equality of merit is so high that competence differences genuinely cease to matter.
  4. Rousseau's reasoning supports the modern anti-careerist impulse by treating office as a burden rather than a privilege, but it cannot support descriptive representation or cognitive diversity since he assumes homogeneity rather than valuing difference.
  5. He ultimately serves as a cautionary case rather than an ally, because his argument requires a level of social homogeneity and small scale that modern pluralistic societies explicitly reject.
