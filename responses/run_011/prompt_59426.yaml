          4.  Analyze what "soul-rules-body" imports that a person can't have (ends, good, wrongs, nature's failures).
          5.  Deliver a verdict: Who is right? Do parts of the conclusion survive? Is there a better source domain?

  2.  **Deconstruct the Philosophical Content (Aristotle *Politics* I.4-7):**
      *   *Core Claim:* Some people are slaves by nature. It is expedient and just for them to be ruled.
      *   *Analogy 1: Soul/Body.* Soul rules body despotically (master/slave) vs. Politically (citizen/citizen). The slave is like the body, lacking deliberative faculty (*bouleutikon*).
      *   *Analogy 2: Tool/Property.* A slave is a "living tool" (*empsychon organon*). Tools are for action/production.
      *   *Analogy 3: Tame Animals.* Domestication implies improvement for the animal.
      *   *The Shuttle Passage:* "If every tool could perform its own work when ordered... masters would not need servants, nor masters slaves." (1253b).
      *   *The Empirical Claim:* Some humans can perceive reason but not possess it.
      *   *The Normative Claim:* It is better for the slave to be ruled (interest/benefit).

  3.  **Drafting the Correspondence Table:**
      *   Need to map the Source Domain (Artifacts/Body/Animals) to the Target Domain (Master/Slave relation).
      *   *Soul* -> *Master* (Ruling element).
      *   *Body* -> *Slave* (Ruled element).
      *   *Tool (Shuttle)* -> *Slave* (Instrument of action).
      *   *User (Weaver)* -> *Master* (Director of action).
      *   *Tame Animal* -> *Slave* (Subject to domestication for mutual benefit).

  4.  **Evaluating the Mappings (Hold vs. Snap):**
      *   *Soul/Body:* Holds in terms of hierarchy. Snaps because the body has no independent agency or moral status, whereas the slave is human (shares in reason *enough* to perceive it).
      *   *Tool/User:* Holds in terms of utility. Snaps because tools don't have interests; slaves do (allegedly).
      *   *Tame Animal:* Holds in terms of "benefit through subjection." Snaps because animals aren't moral agents.
      *   *The "Snap" Point:* The slave is *human*. This is the friction point. If they were purely body/tool/animal, no argument would be needed. The fact that an argument *is* needed proves they aren't purely those things.

  5.  **Analyzing the Shuttle Passage (1253b):**
      *   *Her view:* It shows he's describing a machine, implying slavery is just tech debt.
      *   *My view:* It's hypothetical.
      *   *Referee view:* It's a teleological limit case. If tools act autonomously, subordination isn't needed. But since they don't, subordination is needed. However, if the slave is *like* a tool, and tools *could* be autonomous, does that imply slaves *could* be autonomous? Actually, Aristotle uses it to justify the *necessity* of the slave *now*, but it inadvertently highlights the contingency of the institution. It undermines the "natural" aspect by making it sound technological/functional.
      *   *Crucial nuance:* Aristotle says if tools *could* do this, we wouldn't need slaves. But they can't. So we need slaves. But wait, if the slave is a "living tool," and the tool is distinct from the slave... The passage actually suggests slavery is a substitute for automation. This supports "Her" view that it's functional, not necessarily "natural" in a deep metaphysical sense.

  6.  **Analyzing "Soul-Rules-Body" Imports:**
      *   Body has no ends of its own (teleology comes from soul).
      *   Body cannot be wronged (no justice between soul and body).
      *   Nature's plan fails (monsters, deformities). Aristotle admits some bodies don't match their souls.
      *   *Application to Slave:* If Slave = Body, Slave has no ends. But Aristotle claims slavery is *for the slave's good*. This is a contradiction. You can't have a "good" if you are merely a body/tool. To have a "good," you need a soul. If you have a soul, you aren't just a body.
      *   *Verdict:* This is the strongest point against Aristotle's consistency.

  7.  **Synthesizing the Verdict:**
      *   *Her:* Right that the analogy is doing heavy lifting and is unstable. The "living tool" concept is an oxymoron that collapses under scrutiny.
      *   *Me:* Right that there are empirical/normative premises (reason perception, benefit). But these premises rely on the analogies to make sense of *why* lacking deliberative reason justifies ownership.
      *   *Resolution:* It's a hybrid. The empirical claim (some lack reason) is the engine, but the analogy (soul/body) is the chassis. Without the chassis, the engine doesn't drive to "slavery"; it might drive to "guardianship" or "wardship." The analogy forces the conclusion to be *property* rather than *care*.
      *   *Better Source Domain:* Parent/Child (which Aristotle uses elsewhere for kingship) or Doctor/Patient. But these imply temporary or non-proprietary relations. Aristotle *needs* the Tool/Body analogy to justify *ownership*. So there is no "better" analogy for *slavery*, only for *paternalism*.

