  ### The Single Best Revision
  **Revise Commitment 3.**

  The tension between C3 and the rest of the package (specifically C4, C5, and the Enthusiast Verdict) is the most damaging. C3 acts as a hard externalist constraint (tracking actual EV) in a system that otherwise advocates for internalist or heuristic-based virtues (visceral pulls, habits, affection).

  If you change C3 to require responsiveness to *indicators* of right-making features that the agent *takes to be reliable* (rather than the features themselves), you dissolve the contradiction with the Enthusiast Verdict and C4. The Enthusiast responds to "vivid suffering," which he takes to be a reliable indicator of "high EV."

  **Cost:** You lose the ability to say the Enthusiast is credit-worthy *because* he tracks the truth. You must admit he is credit-worthy because he is *trying* to track the truth via a heuristic that is generally good but locally flawed. This introduces a element of moral luck into credit, which may grate against the Rationalist instinct to reward epistemic rigor. However, it is the only way to keep C1, C4, C5, C6, and your Case Verdicts intact.

