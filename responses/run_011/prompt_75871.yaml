answer: |-
  # The Lockbox Protocol

  **Concept:** A 75-minute workshop isolating *pure time preference* (impatience) from risk and return.
  **Core Mechanic:** Identical nominal value for "Now" vs. "Later" claims, differentiated only by *vulnerability* to a future reversal.
  **Materials:**
  *   **Steel Washers:** 1-inch diameter, unpainted. Heavy, cold, industrial. (Not poker chips; they feel like money, not game pieces.)
  *   **Clear Lockboxes:** One per table, with a combination lock.
  *   **Claim Slips:** Two colors (Red for "Now", Blue for "Later").
  *   **The "Void" Bag:** A black opaque bag for destroying tokens.
  *   **Whiteboard:** For tracking table totals.

  **Table Setup:**
  *   4 players per table. (You play at one table).
  *   Each table starts with a Lockbox containing **40 Washers**.
  *   Each player has a personal envelope.

  ---

  ### Minute-by-Minute Run of Show

  **00:00 – 00:10 | The Setup (No Jargon)**
  *   **Say:** "We are going to allocate these washers. They have no cash value, but at the end of 75 minutes, you keep what you earn. More washers = better prize tier (coffee, gift card, etc.)."
  *   **Rule 1:** One washer is one washer. There is no interest. A washer taken in Minute 10 is identical to a washer taken in Minute 60.
  *   **Rule 2:** You do not touch the washers until Minute 70. They stay in the Lockbox. You earn *claims*.
  *   **Rule 3:** There are two rounds of claiming. Round 1 (Now) and Round 2 (Later).
  *   **Action:** Distribute Claim Slips. Red (Round 1), Blue (Round 2).

  **00:10 – 00:25 | Round 1 (The Impatience Test)**
  *   **Choice:** Each player privately decides: Take 10 Washers *claim* now (Red Slip) OR Wait for Round 2 (Blue Slip).
  *   **Certainty:** If you pick Red, you are guaranteed 10 washers. If you pick Blue, you are guaranteed 10 washers.
  *   **The Visual:** When a player submits a Red Slip, they must physically move 10 washers from the center of the Lockbox to their side of the box (still locked inside).
  *   **The Leftover:** As Red Slips pile up, the center of the box empties. The "Leftover" is the **empty space in the middle of the box**.
  *   **Facilitator Move:** You play at Table 1. Choose **Red**. Explain aloud: "I want the security of the claim now." Make the impatience visible.

  **00:25 – 00:40 | Round 2 (The Wait)**
  *   **Choice:** Remaining players (Blue Slips) submit their claims.
  *   **Action:** They move their 10 washers from the center to their side.
  *   **Observation:** If everyone chose Red, the box center is empty. If everyone chose Blue, the box is full until now.
  *   **Tension:** At this point, Red and Blue players have the exact same number of washers (10 each). The Red players feel secure. The Blue players feel exposed.

  **00:40 – 00:55 | The Reversal (The Bite)**
  *   **Announcement:** "In real life, the future cannot tax the past. In this room, it can."
  *   **Mechanic:** The Blue (Wait) players form the **Future Council**.
  *   **Power:** The Council looks at the table's Red (Now) players. For every Red player at the table, the Council *must* remove 2 washers from that Red player's pile and return them to the Lockbox center.
  *   **Constraint:** The Council *cannot* keep these washers. They must return them to the Void Bag (destroyed).
  *   **Result:** Red players end with 8 washers. Blue players end with 10 washers.
  *   **Why:** This simulates the *social friction* or *structural penalty* impatience creates for the collective future, without using "interest" as the justification. The "return" on waiting is not growth; it is **immunity**.
  *   **Facilitator Move:** As a Red player, physically hand over your 2 washers. Let the silence sit. Do not joke.

  **00:55 – 01:10 | Settlement & Physical Handover**
  *   **Action:** Unlock the boxes.
  *   **Ritual:** Players pour their washers into their envelopes. It should clatter. It should feel heavy.
  *   **The Stare:** Ask everyone to look at the center of the Lockbox. Look at the washers that were returned to the Void. That is the value destroyed by the Reversal.
  *   **Collection:** Collect envelopes. You will distribute prizes later (maintain the delay).

  **01:10 – 01:15 | The Debrief (Mapping the Room)**
  *   **Step 1 (Impatience):** Ask Red players: "You knew the value was the same. Why take it early?" (Answers: Security, done with it, didn't trust the wait).
  *   **Step 2 (Risk vs. Time):** Ask: "Did anyone take Red because they thought the washers would disappear?" (No, rules were certain). "So this wasn't risk. This was pure time preference."
  *   **Step 3 (The Reversal):** Ask Blue players: "How did it feel to take from them?" (Answers: Uncomfortable, necessary, vengeful).
  *   **Step 4 (The Reality Check):** "In this game, the Future (Blue) had a voice and a hand. In your pension, in the climate, in the credit union's solvency: The Future is silent. It cannot tax you. It just fails."
  *   **Close:** "Impatience isn't just wanting money sooner. It's buying security now at the cost of flexibility later. We charged you a fee for that inflexibility. In real life, the fee is paid by someone else."

  ---

  ### Predictable Failures & Live Fixes

  **1. The Collusion (10 minutes in)**
  *   **What happens:** A table agrees to all go Blue or all go Red to maximize table total or avoid conflict.
  *   **Why:** They treat it as a cooperative game rather than an individual preference test.
  *   **Live Fix:** **Anonymize the Slips.** Players fold slips and put them in a central cup. You draw them and announce the *count* of Red vs. Blue, not *who* picked what.
  *   **Correction for Reversal:** If identities are hidden, the Reversal cannot target specific people.
  *   **Better Fix:** **Public Placement.** When a player chooses Red, they must move their washers to their side of the box *immediately*. It is public. If they collude to all go Blue, the "Leftover" (empty box center) never happens, and the lesson is lost.
  *   **Hard Counter:** If a table colludes to all go Blue, tell them: "The Reversal only triggers if there are Red players. If you all wait, no penalty occurs, but you also lose the lesson." Let them sit with the boredom of perfect cooperation. It highlights that conflict is necessary for the mechanic to work.

  **2. The "It's Just a Game" Dismissal**
  *   **What happens:** Players laugh off the washer tax.
  *   **Live Fix:** **Increase the Stakes.** Before starting, announce: "The table with the highest total washers gets a $50 donation to a charity of their choice. The table with the lowest gets nothing." This makes the destruction of washers in the Reversal painful for the group, not just the individual.

  **3. You (The Facilitator) Dominating**
  *   **What happens:** You explain the strategy too well.
  *   **Live Fix:** **Play Dumb.** Choose Red. Lose your washers. In the debrief, say: "I knew the rules, I knew the Reversal was coming, and I still took the washers early. I wanted the certainty more than the optimization. That is the bias."

  ---

  ### The Impossible Feature (What You Must Say)

  A room of living people in 2024 cannot reproduce **the silence of the future.**

  In the game, the "Waiters" (The Future) are present. They have agency. They can speak. They can tax.
  In reality (pensions, climate, infrastructure), the Future is not in the room. It cannot vote. It cannot impose a Reversal. It cannot take washers back from you.

  **You must supply this verbally in the debrief:**
  > "The game felt unfair because the Future fought back. In your actual financial life, the Future does not fight back. It just collapses. When you discount the future in this room, you lost 2 washers. When you discount the future in your pension, there is no one to tax you. There is just a shortfall that appears on a Tuesday when you're 67. The symmetry we built here is a gift. Reality offers none."

  ### Token Scheme Details

  *   **Material:** Steel fender washers (1/4" hole, 1" OD).
  *   **Why:** They don't stack neatly like coins. They slide. They make noise. They feel like hardware, not currency.
  *   **Handling:** Do not hand them out individually. Pour them into the Lockbox with a loud clatter.
  *   **The "Leftover":** The visual gap in the washer pile in the center of the box. If everyone takes early, the box looks hollowed out. If everyone waits, it looks solid until the end.
  *   **End Game:** Do not let them keep the washers. Collect them. Give the prize based on the count. The washers are *weight*, not wealth. The weight is the memory of the wait.

  ### Why This Works for Your Constraint

  1.  **Zero Interest:** 1 Washer = 1 Washer. No growth math.
  2.  **Total Certainty:** Rules are fixed. No dice.
  3.  **The Leftover:** The hollowed-out center of the Lockbox + the washers destroyed in the Void Bag.
  4.  **The Reversal:** Makes the social cost of impatience visible without relying on "market returns."
  5.  **Your Role:** You model the failure. You are the impatience they can point at.

  ### One Warning

  Someone will ask: *"Why would I wait if I know I get the same amount?"*
  **Your Answer:** "In this game? You wait to gain the power to tax. In real life? You wait because if you don't, there's no one left to tax you when the bill comes due."

  Don't let them solve the game. Let them feel the weight of the washers they lost.
