answer: |-
  Here is the session plan, structured to prevent the first-order shouting match while leveraging the energy of the local fight.

  ### 1. The Dependency Structure (Order of Operations)

  You cannot jump to the meta-question (the boundary problem) until you have broken their intuition that boundaries are natural or fixed. If you start with the ballot question, they will anchor on *policy preferences* (16-year-olds are mature/immature). You must anchor them on *procedural logic* first.

  **Phase 1: The Arbitrariness of the Line (15 mins)**
  *   **Goal:** Establish that the current "demos" (who can vote now) is not a natural fact, but a past decision.
  *   **Depends on:** Nothing. This is the foundation.
  *   **Why here:** If they think the current town boundary is "just how it is," Dahl's regress makes no sense. They need to see the boundary as a *choice* before they can see the *chooser* as a problem.

  **Phase 2: The Circular Trap (Dahl's Regress) (25 mins)**
  *   **Goal:** Demonstrate that "letting the people decide" is impossible if we don't know who "the people" are yet.
  *   **Depends on:** Phase 1 (Boundaries are choices).
  *   **Why here:** You need them to feel the logical knot *before* you offer a solution. If you offer "All Affected Interests" too soon, they will treat it as the answer rather than a second puzzle.

  **Phase 3: The "All Affected" Attempt & Failure (25 mins)**
  *   **Goal:** Show that the standard solution (AAI) just pushes the boundary problem up one level (Who decides who is affected?).
  *   **Depends on:** Phase 2 (The need for a rule).
  *   **Why here:** This is the core philosophical payload. It must happen before applying it to the local ballot, or they will use AAI to argue *for* their side of the ballot measure rather than analyzing the structure.

  **Phase 4: Application to the Local Ballot (20 mins)**
  *   **Goal:** Re-contextualize the heated local debate through the lens of Phases 1–3.
  *   **Depends on:** Phase 3 (Understanding that AAI doesn't solve the authority question).
  *   **Why here:** Now the local fight is data for the theory, not the theory itself. This lowers the temperature.

  **Phase 5: Closing Diagnostic (5 mins)**
  *   **Goal:** Verify uptake.
  *   **Depends on:** All previous phases.

  ---

  ### 2. The Core Example: "The New Town of Oakhaven"

  **Verdict:** Use your incorporation idea, but **strip the second half.** The "commuters voting to undo the decision" loop is too recursive for 90 minutes with this group. It risks confusing the *boundary* problem with a *stability* problem.

  **The Revised Example:**
  > "Imagine an unincorporated stretch of county called Oakhaven. The State Legislature draws a line on a map and says, 'This is now a Town.'
  > 1.  **The Boundary:** The people inside Oakhaven didn't vote on the line. The people just outside (whose property values and traffic will change) didn't vote on the line. The State drew it.
  > 2.  **The Expansion:** Once Oakhaven is a town, the new Town Council wants to let non-resident commuters vote in school elections.
  > 3.  **The Question:** Who gets to decide if the commuters get in? The current Oakhaven voters? The commuters? The State again?"

  **What it needs to have:**
  *   **An external drawer:** The State Legislature must draw the initial line. This mirrors your town's history (state legislature/annexation) without getting bogged in local history.
  *   **Spillover effects:** Mention traffic or property values for the outsiders. This primes the "All Affected" intuition.
  *   **A clear "Inside" vs. "Outside":** Use the whiteboard to draw a circle. Put stick figures inside and outside.

  **What it needs to lack:**
  *   **Moral weight:** Do not mention race, class, or ideology. Keep it sterile.
  *   **Legal specifics:** No mention of specific statutes. This is about logic, not law.
  *   **The "Undo" loop:** Don't let the new voters dissolve the town. It distracts from the boundary question.

  ---

  ### 3. Misconception Mapping & Interventions

  | Misconception | Who usually says it | When it arises | Intervention Strategy |
  | :--- | :--- | :--- | :--- |
  | **"This is about who deserves the vote."** | Most of the room. | **Phase 1.** | **Head off immediately.** Write "DESERT" vs. "AUTHORITY" on the board. Say: "Tonight we aren't asking who *should* vote. We are asking who has the *authority to draw the list* of who votes. Even if everyone deserves it, who signs the paper?" |
  | **"Borders are just a fact." (Ray's Binder)** | Ray. | **Phase 1.** | **Reframe, don't argue.** Say: "Ray is right that they are facts *now*. But they were decisions *then*. We are studying the moment of decision, not the moment of enforcement." |
  | **"This is just gerrymandering."** | The politically active. | **Phase 2.** | **Distinguish.** "Gerrymandering assumes we agree on *who* the voters are, and we're fighting about districts. We are fighting about who gets to be a voter at all. Different problem." |
  | **"The State Court/Constitution solves it."** | The rule-of-law types. | **Phase 3.** | **Push the regress.** "If the State Court decides, who drew the State's boundary? If the Constitution decides, who ratified the Constitution? We just moved the problem upstairs." |
  | **"All-Affected settles it."** | The idealists. | **Phase 3.** | **Let them propose it.** This is the teaching moment. Ask: "Okay, who decides who is affected? If the current voters decide that, aren't we back to square one?" |
  | **"Exit rights/Contract replace voting."** | The Libertarian. | **Phase 4.** | **LET THIS STAND.** (See below). |

  ---

  ### 4. The One Objection to Let Stand

  **The Libertarian/Exit Rights Objection:** *"If people don't like the boundary, they can move. Voting doesn't matter if exit costs are low."*

  **Why let it stand?**
  1.  **It's philosophically valid:** This is the Tiebout Hypothesis. It is a genuine alternative to the democratic boundary problem, not a misunderstanding of it.
  2.  **It relieves pressure:** It gives the room a way out of the paradox without you having to solve it.
  3.  **It highlights the stakes:** It forces the room to admit that the boundary problem *only* matters if we assume people *must* stay.
  4.  **Intervention:** Do not refute it. Say: "That is a complete alternative theory. If exit works, we don't need voice. But for tonight, let's assume for the people in this room, moving isn't an option. Does the problem return?"

  ---

  ### 5. The Closing Question

  You need a question where the "Desert" answer is visibly circular or insufficient, while the "Boundary" answer acknowledges the regress.

  **Ask this:**
  > "If we all agree that 16-year-olds *deserve* to vote, does that tell us **who has the right to grant it**?"

  *   **The Desert Answer (Wrong):** "Yes, the town should grant it because they deserve it."
      *   *Why it fails:* It assumes the town has the authority to grant it. It begs the question.
  *   **The Boundary Answer (Right):** "No. 'Desert' is moral. 'Authority' is structural. We still don't know if the town, the state, or the 16-year-olds themselves get to draw the line."

  **Alternative (if you want to be sharper):**
  > "If the current voters vote to expand the voting pool, did the *old* demos decide the boundary, or the *new* demos?"
  *   **Desert Answer:** "The new ones, because they are included."
  *   **Boundary Answer:** "The old ones. They held the key. The boundary was set by the exclusions, not the inclusions."

  *Recommendation:* Use the first one ("Does desert tell us who has the right?"). It is clearer for non-philosophers.

  ---

  ### 6. What to Cut (and When to Say It)

  You are right about Cosmopolitanism and Federalism. Cut those. But you also need to cut **Remedies**.

  **Do not try to solve the problem.** If you spend the last 20 minutes brainstorming how to fix the ballot question, you lose the lesson.

  **Explicit Exclusions Script:**
  At the start of **Phase 2**, say this out loud:
  > "I want to be clear about what we are **not** doing tonight. We are not deciding how you should vote on the ballot question. We are not deciding if 16-year-olds are responsible enough. And we are not looking for a legal fix from the State. We are looking at a logical loop that exists even if everyone agrees on the morals. If I steer us away from the ballot specifics, it's not to dodge the fight, but to see the structure underneath it."

  **Cut List:**
  1.  **Metaphysics of Collective Agents:** Don't talk about "The Town" as a person. Talk about "The Current Voters."
  2.  **Historical Annexation Details:** You mentioned the town line was drawn by past votes. Do not dig into the minutes. Use it only as an illustration of "Past Deciders."
  3.  **Specific Legal Pathways:** No discussing how to amend the charter. That's a strategy session, not a reading group.

  ### Summary of Flow for the Whiteboard

  1.  **Draw a Circle.** Label it "Who Votes?"
  2.  **Draw an Arrow pointing in.** Label it "Who Decides?"
  3.  **The Trap:** If the Circle decides the Arrow, the Circle decides itself. (Dahl's Regress).
  4.  **The Fix:** "All Affected."
  5.  **The Break:** Draw a bigger circle around "Affected." Ask "Who decides this circle?"
  6.  **The Local:** Put "16yo" and "Non-Citizens" on the board. Ask "Who draws the line around *them*?"

  This keeps you on the meta-level. If Ray opens his binder, point to the Arrow and ask, "Does the binder tell us who drew the first circle?"
