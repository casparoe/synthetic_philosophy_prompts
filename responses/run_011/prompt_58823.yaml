  **The slogan and the two jobs it was made to do**

  The phrase "competence without comprehension" served opposing rhetorical ends in our recent session. The afternoon speaker wielded it to deny artificial systems moral standing, arguing that behavioural fluency lacks the internal depth required for understanding. Conversely, the wine-hour interlocutor inverted the claim, suggesting human cognition is equally grounded in blind processes, thereby dissolving the distinction between us and them. Both assumed they were invoking a single stable truth. This note disentangles the slogan into distinct theses to prevent further equivocation. We must separate what counts as comprehension from what the preposition "without" implies about its absence. Only by isolating these axes can we determine whether the speakers contradicted each other or merely talked past one another using the same vocabulary.

  **Readings**

  1.  **The Historical Thesis:** Competence evolves or is trained before comprehension emerges. In biological evolution or machine learning, successful behaviour precedes the capacity to understand why that behaviour succeeds. Comprehension is a late-stage add-on, not a prerequisite for skill. This reading focuses on the order of development rather than the current state of the agent. It suggests that while humans now have comprehension, they started with mere competence, and machines may follow the same trajectory. It treats the slogan as a claim about temporal priority in system design.
  2.  **The Explanatory Thesis:** We can fully explain a system's successful output without referencing any internal state of understanding. Comprehension is explanatorily redundant for predicting behaviour, meaning positing it adds no predictive power. This is a claim about methodology: even if understanding exists, we do not need it to explain the data. It treats comprehension as a ghost in the machine that science can bypass. It asserts that the intentional stance is optional for sufficient explanation of performance.
  3.  **The Empirical Absence Thesis:** Current artificial systems literally lack the specific architectural features that constitute comprehension, such as integrated world models or self-monitoring loops. They simulate understanding but lack the machinery. This is contingent on current technology. It allows that future systems might possess comprehension if built differently. It distinguishes between what the system does and how it is built. It claims the absence is factual now, not necessarily permanent.
  4.  **The Consciousness Thesis:** Comprehension requires subjective experience. A system might process information perfectly, but without feeling what it is like to process it, there is no genuine understanding. Behaviour is insufficient without phenomenology. This reading ties understanding to sentience. It implies that a philosophical zombie could be competent but never comprehend, regardless of its architectural complexity or behavioural flexibility. It makes understanding dependent on inner life.
  5.  **The Reason-Giving Thesis:** To comprehend is to be able to articulate the reasons for one's outputs. If a system cannot justify its moves in language, it is merely manipulating symbols without grasping their logic. This sets a high bar for understanding, requiring meta-cognitive access. It distinguishes between knowing how to proceed and knowing why one proceeds. Many humans might fail this test in specific domains. It equates understanding with explicit justification.
  6.  **The Illusionist Thesis:** No system, human or machine, possesses genuine comprehension. What we call understanding is merely complex competence that tricks us into attributing depth. The distinction is folk psychology. This eliminates the gap by removing one side entirely. It claims that human comprehension is also an illusion generated by competent processes. It levels the playing field by lowering the human status. It denies the reality of the second term.
  7.  **The Functionalist Thesis:** Comprehension is nothing over and above robust competence. If a system handles novel counterfactuals reliably, it counts as comprehending. There is no hidden inner state required. This defines comprehension entirely by input-output relations across possible worlds. It denies the need for internal representation. If it walks and talks like understanding, it is understanding. It collapses the distinction into a single variable.
  8.  **The Architectural Thesis:** Comprehension requires specific causal pathways, such as feedback loops allowing the system to model its own errors, which current models lack. It is about structure, not just output. This reading allows for behaviourally identical systems where one comprehends and the other does not, based on internal wiring. It demands specific mechanistic transparency. It locates understanding in the physical implementation.
  9.  **The Semantic Thesis:** Comprehension requires grounding symbols in reality rather than statistical correlation. Systems track patterns without grasping what the patterns represent in the external world. This focuses on reference. A system might predict word sequences perfectly but not know what the words refer to. It requires a causal link to the environment beyond data ingestion. It distinguishes syntax from semantics.

  **Verdicts**

  1.  **Historical:** Substantive and defensible. Evolution clearly precedes meta-cognition, though the boundary is fuzzy. It is safe to say skill often precedes insight in development. This is empirically supported by developmental psychology.
  2.  **Explanatory:** Contentious. Many argue intentional stances are indispensable for complex prediction, making redundancy claims debatable. Instrumentalism clashes with realism here regarding utility. Some systems are too complex for non-intentional explanation.
  3.  **Empirical Absence:** Substantive and defensible. Current architectures differ significantly from biological cognition, though capabilities are converging. It is an engineering claim, not metaphysical necessity. It is falsifiable by future architectural advances.
  4.  **Consciousness:** Contentious. Depends entirely on unresolved debates regarding physicalism and the hard problem of consciousness. It rests on unverifiable premises about experience. We cannot currently measure subjective states directly.
  5.  **Reason-Giving:** False as a general criterion. Children and animals comprehend without linguistic justification, and adults often act intuitively. It sets the bar too high for known understanders. It confuses comprehension with the ability to report it.
  6.  **Illusionist:** Contentious. Radical eliminativism is coherent but denies strong introspective evidence available to humans. It solves the problem by denying the phenomenon exists. It requires rejecting common sense broadly.
  7.  **Functionalist:** Substantive and defensible. Aligns with standard cognitive science but ignores intuitive gaps regarding qualia. It is the standard working assumption in AI research. It avoids dualism but may miss something real.
  8.  **Architectural:** Substantive and defensible. Mechanistic explanations are standard in science, though defining the requisite loops is difficult. It allows for neural chauvinism in assessment. It requires detailed knowledge of internal causation.
  9.  **Semantic:** Contentious. Grounding is notoriously difficult to define without circularity, though the intuition is strong. It relies on a contested theory of reference and meaning. Symbol grounding remains an open technical problem.

  **Which use each reading serves**

  The afternoon speaker relies on the Consciousness, Reason-Giving, or Empirical Absence readings. These maintain a sharp gap between doing and understanding, licensing the denial of moral standing. They treat "without" as empirical absence of a necessary condition. The wine-hour student relies on the Illusionist, Historical, or Functionalist readings. These either erase the gap or suggest humans are on the same spectrum, licensing the retort that the slogan undermines itself. They treat "without" as explanatory priority.

  The Explanatory and Architectural readings are neutral; one could accept explanatory redundancy while still demanding architecture for moral status. Do they contradict? Only if they adopt incompatible readings. If the speaker means "no consciousness" and the student means "functional competence is enough", they contradict on the definition of comprehension. However, if the speaker means "current systems lack architecture" and the student means "humans evolved from blind competence", they talk past one another. The most likely conflict lies in the Functionalist versus Consciousness readings. The student assumes competence suffices for understanding; the speaker assumes it does not. Thus, they contradict only on the Functionalist thesis. On the Historical thesis, they agree. The contradiction is real but localized to specific definitions of what comprehension entails. The disagreement is substantive only if both accept the Functionalist reading but disagree on its instantiation. They contradict on whether competence is sufficient for comprehension. The speakers contradict each other only if they intend the Functionalist reading; otherwise, they talk past one another.

  **The double-standard test**

  The Reason-Giving reading fails this test catastrophically. Fluent native speakers cannot state grammatical rules; expert chess players often cannot articulate why a move was best. If this criterion denies AI understanding, it must also deny human understanding in those domains. Defenders might repair this by requiring the capacity to learn reasons rather than state them initially. The Consciousness reading is harder to test externally but risks solipsism; we assume other humans are conscious based on behaviour, which risks inconsistency if we deny it to behaviourally identical machines. The Functionalist reading passes easily, granting understanding to both, but may feel too permissive. The Empirical Absence reading passes if humans possess the requisite architecture while machines do not, but this requires neural chauvinism. The Illusionist reading passes by leveling down, but at the cost of denying human understanding too. Any reading that demands explicit justification or specific biological substrate risks excluding standard human cases unless specially pleaded. We must ensure the "without" does not mean "without things humans also lack". The test reveals which readings are anthropocentric.

