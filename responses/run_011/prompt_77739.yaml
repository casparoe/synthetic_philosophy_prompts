answer: |-
  (1) **Scenario**
  Room 4B holds fourteen toddlers. A narrow fabric tunnel connects the mats to the snack table. Two paths exist: crawl along the left wall or the right wall. Collisions cause tears; clear flow allows play. One Tuesday, a rolling ball blocked the right entrance. All fourteen crawled left. The ball was removed, but the left-side habit persisted. New enrollees imitate incumbents. Over one year, thirteen original children graduate; replacements adopt the left-side rule. Stability holds without adult instruction.

  Three children (ages 3.9) exhibit theory-of-mind: they pause at the entrance, check peers, and wave others through. The remaining eleven (ages 2.0) lack this sophistication. They do not check; they simply react to immediate motion. If a peer moves left, they move left. If a peer blocks the way, they cry or push. They show no evidence of representing others' expectations. Yet, the regularity holds. The three older children expect the younger to go left; the younger simply go left when the path is clear. No child sanctions deviation normatively; collisions result only in physical obstruction or distress, not reproach.

  (2) **Lewis's Clauses and Audit**
  Lewis requires: (1) Regularity R; (2) Almost everyone expects almost everyone to conform to R; (3) Almost everyone prefers to conform conditional on others conforming; (4) Alternative R' exists.

  *Strict Reading (Mental States):* Clause 2 fails. Only the 3 older children possess belief-states required for "expectation." 3/14 is not "almost everyone." **Verdict: Not a Convention.**
  *Charitable Reading (Dispositions):* Clause 2 passes. All 14 act *as if* they expect conformity. 14/14 counts as "almost everyone." **Verdict: Convention.**
  *Deciding Fact:* Whether the 11 toddlers count toward the "almost everyone" quantifier despite lacking occurrent beliefs.

  (3) **Rival Criteria**
  *Dynamical Criterion:* A regularity is conventional iff it is a stable attractor of conformist imitation in a common-interest coordination game and could be displaced only by a coordinated shift.
  *Criticism-Licensing Criterion:* A regularity is a norm iff deviation licenses protest or repair from participants, including bystanders not themselves harmed.

  *Verdicts:* Dynamical = **Yes** (imitation sustains the equilibrium against drift). Criticism-Licensing = **No** (deviation causes physical blockage or crying, but no normative protest from bystanders).

  (4) **Feature and Removal Test**
  *Feature:* Cognitive heterogeneity (11 toddlers lack theory-of-mind).
  *Removal:* Add **Older Children** (make all 14 age 4 with full theory-of-mind).
  *Effect:* Lewis (Strict) flips to **Yes** (14/14 hold beliefs). Dynamical stays **Yes**. Criticism-Licensing flips to **Yes** (4-year-olds verbally protest deviations).

  (5) **Lewisian Defense and Cost**
  *Defense:* Lewis allows expectations to be dispositional. The toddlers are disposed to act based on others' actions, satisfying the functional role of expectation.
  *Cost:* Retreating to a fully dispositional reading leaves the analysis with insufficient content to exclude instinctual or blind habitual regularities (e.g., bee dances or traffic flow without drivers). It collapses the distinction between rational agreement and mere causal stability.

  (6) **Implications for Norm Evolution**
  This case implies Lewis's framework characterizes a specific *species* of convention (rational, epistemic) rather than the *genus* (stable behavioral regularities). Population dynamics explain the stability Lewis takes for granted, but Lewis's epistemic clauses attempt to capture the normativity missing from pure dynamics.

  The Criticism-Licensing criterion tracks something philosophically important that the other two miss: the *normative ought*. Lewis attempts to derive this from rationality, and Dynamics derives stability from causality, but only Criticism-Licensing identifies the distinctive social pressure that transforms a habit into a rule.
