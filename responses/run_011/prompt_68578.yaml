answer: |-
  You have approached this problem exactly as a crystallographer should: by treating your intuitions as diffraction data and seeking a model that explains the electron density without introducing artificial noise. Your tentative "necessary-labor share" model is analogous to a low-resolution map; it shows the general shape of the molecule but fails to resolve the side chains where the chemistry actually happens. Specifically, it conflates *causality* with *entitlement*, and it misses the structural role of *convention* and *deception*.

  Below, I propose three candidate principles. The first two are partial models that fit specific subsets of your data but fail globally. The third is an integrated model that maximizes fit while minimizing clauses. Following the principles, I address the hard pairs (5 & 6, 7a & 7b) and identify the residuals—the verdicts you should consider dropping to preserve the integrity of the model.

  ### Candidate Principles

  **1. The "Specific Embodiment" Principle**
  This principle argues that ownership attaches only to physical or digital instantiations, not to abstract ideas or natural facts.
  *   **Statement:** A property claim is valid only over a specific artificial embodiment that did not exist in accessible form prior to the claimant's work.
  *   **Motivation:** Cases 4 (gene vs. construct), 5 (math vs. encryption), 10 (idea vs. device), 11 (community knowledge vs. patent).
  *   **Fit:** It handles the "made vs. found" distinction well (4, 5, 11) and the "idea vs. execution" distinction (10).
  *   **Failure:** It is silent on priority (Case 2), confidentiality (Case 3, 9), and deception (Case 12). It cannot explain why the second lab in Case 2 gets nothing if they produced an embodiment, nor why the tribute band in Case 12 is wrong if they created a new embodiment (performance).
  *   **Overfit Risk:** Low. It is too simple to overfit, but consequently underfits the data.

  **2. The "Social Contract" Principle**
  This principle argues that ownership is entirely a function of community rules and agreements.
  *   **Statement:** Ownership claims are valid only if they adhere to established community conventions regarding priority, confidentiality, and provenance.
  *   **Motivation:** Cases 1 (authorship), 2 (priority), 3 (reviewer theft), 9 (contract), 12 (deception).
  *   **Fit:** It handles the procedural injustices (1, 2, 3, 9) and the deception cases (12) perfectly.
  *   **Failure:** It struggles with the metaphysical limits of ownership (4, 5, 11). It cannot explain why a gene cannot be patented even if the "community convention" of the patent office allows it; it lacks a normative brake on what *can* be owned, only how.
  *   **Overfit Risk:** Medium. It risks becoming a list of conventions rather than a principle.

  **3. The "Constructive Provenance" Principle (Recommended)**
  This principle integrates embodiment, priority, and honesty. It distinguishes between property rights (exclusion), moral credit (acknowledgment), and market rules (deception).
  *   **Statement:** Property rights attach only to specific artificial embodiments not previously accessible and first reduced to practice without breach of confidence; moral claims to credit attach to causal contributions distinct from property rights; commercial exploitation must not deceive regarding origin.
  *   **Motivation:** Clauses motivated by Cases 4, 5, 11 (Embodiment); 2, 3 (Priority/Confidence); 1 (Credit); 8, 12 (Deception).
  *   **Fit:** Reproduces 11 of 12 verdicts.
  *   **Failure:** Contradicts Case 6 (AI Style). The principle dictates no property in style, whereas you feel "something has been taken."
  *   **Overfit Risk:** Low. It draws 3 distinct distinctions (Property vs. Credit vs. Deception) to explain 11 data points. This is a robust ratio.

  ### The Hard Pairs

  **Cases 5 and 6 (Math vs. AI Style)**
  These cases are the most significant source of residual error in any model. Your intuition distinguishes them, but legally and philosophically they strain against the same boundary: abstract utility vs. market substitution.
  *   **Resolution:** The "Constructive Provenance" principle reconciles them by categorizing Case 5 as "Abstract Truth" (no embodiment, no claim) and Case 6 as "Unfair Competition" (no property violation, but potential regulatory harm).
  *   **Cost:** This requires you to concede that in Case 6, no *ownership* right was violated, only a market expectation. The "something taken" is market share, not property. If you insist that "style" is property, you must accept a principle that grants monopolies over abstract patterns, which would break Case 5 (math) and Case 11 (prior art). You must choose: either style is property (and you owe the mathematician), or style is not property (and the AI firm owes nothing, though regulation may apply). I recommend the latter to preserve the distinction between discovery and invention.

  **Cases 7a and 7b (Sampling vs. Re-recording)**
  *   **Resolution:** The principle reconciles these via the "Specific Embodiment" clause. The recording (7a) is a specific physical embodiment; the composition (7b) is an abstract instruction set. Taking the physical waveforms is theft; following the instructions is not.
  *   **Cost:** This privileges the recording engineer's fixation over the composer's abstraction in the context of sampling. It accepts that a "groove" (performance) carries a property weight that the "notes" (composition) do not in this specific context. This is consistent with your verdict but contradicts some traditional copyright hierarchies that privilege the composition.

  ### Residuals: Verdicts to Drop

  To maintain a model with low overfitting, you should treat **Case 6** as a residual. You explicitly stated uncertainty ("I do not know"). A model that forces a definitive "property claim" here risks breaking the distinction between 5 and 6. Accept that your intuition in 6 is detecting *harm*, not *ownership*.
  Additionally, **Case 10** is marked by wavering. The principle resolves this cleanly (no property, debt of acknowledgment), suggesting your wavering is noise rather than signal. Drop the certainty requirement here.

  ### New Case Predictions

  1.  **The Algorithm Trader:** A firm uses public domain mathematical theorems to build a high-frequency trading algorithm that outperforms the market.
      *   *Prediction:* No owe to mathematicians.
      *   *Reasoning:* Abstract truth vs. specific application (Case 5).
      *   *Surprise:* Conflicts with labor-mixing intuition (they built the system).
  2.  **The Heritage Cook:** A chef opens a restaurant serving dishes identical to a traditional village's cuisine, without claiming affiliation.
      *   *Prediction:* Acceptable.
      *   *Reasoning:* No specific embodiment owned; no deception (Case 4/12).
      *   *Surprise:* Conflicts with labor-mixing (chef learned the recipes).
  3.  **The Deepfake Endorsement:** A firm uses AI to generate a video of a retired actor endorsing a product they never used.
      *   *Prediction:* Wrong.
      *   *Reasoning:* Deception regarding provenance/origin (Case 12).
      *   *Surprise:* None expected.

