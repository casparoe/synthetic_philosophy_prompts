answer: |-
  **PHILOSOPHY OF SCIENCE: EVIDENCE AND CONFIRMATION**
  **FINAL EXAMINATION**

  **Time Allowed:** 2 Hours
  **Total Marks:** 100
  **Section A:** Answer ONE question from this section. (50 Minutes, 25 Marks)

  **Question 1**

  Consider the following argument regarding the confirmation of universal generalisations:

  > (1) A report such as "this is a white shoe" carries information about ravens only if the object reported on was a candidate raven to begin with. That is, I must have already narrowed the population I am sampling from to birds, or to things that could plausibly be ravens.
  >
  > (2) A shoe is not in that population. Therefore, the report carries no information about ravens.
  >
  > (3) However, "All ravens are black" and "All non-black things are non-ravens" are logically equivalent. Yet they appear to tell us to sample from different populations: the first says look at ravens, the second says look at non-black things.
  >
  > (4) Therefore, evidence cannot simply attach to the content of a hypothesis. Two logically equivalent hypotheses can differ in what counts as evidence for them. The Equivalence Condition is false.

  Write an essay that addresses the following three points:

  **(a)** Locate the precise mistake in the inference from premises (1)–(3) to conclusion (4). Identify which principle is actually being denied by premises (1) and (2), and explain why this does not entail the falsity of the Equivalence Condition.

  **(b)** Construct a concrete scenario in which observing a non-black non-raven (e.g., a white shoe) provides significant, non-negligible confirmation for "All ravens are black." Describe the scenario so that a non-philosopher could understand it, and explicitly state the background premise that makes this confirmation possible.

  **(c)** Construct a scenario in which observing a black raven *lowers* your confidence that "All ravens are black." Explain why this result does not vindicate the argument above, and what it demonstrates instead about the criterion that positive instances always confirm a universal generalisation.

  ***

  ### MODEL ANSWER

  The argument presented commits a category mistake in step (4) by conflating the *logic of confirmation* with the *methodology of testing*. Premises (1) and (2) establish that observing a shoe is an inefficient or irrelevant *testing strategy* for a hypothesis about ravens, given our usual background knowledge about the distribution of objects. They describe a heuristic constraint on inquiry: do not waste time sampling from populations where counterexamples are unlikely to be found. However, the Equivalence Condition is a thesis about logical relations between propositions, not pragmatic advice for field researchers. It states that if evidence $E$ confirms hypothesis $H$, and $H$ is logically equivalent to $H'$, then $E$ confirms $H'$. To deny this based on (1) and (2), one would have to show that $E$ logically fails to support $H'$, not merely that $E$ is hard to find or uninformative given current expectations. The argument mistakes the *weight* or *availability* of evidence for the *direction* of support. Steps 1–3 show that the two equivalent formulations suggest different experimental designs, but they do not show that the evidence gathered by one design fails to confirm the other formulation.

  To demonstrate that non-black non-ravens can provide significant confirmation, we must alter the background premises regarding the population size. Imagine a closed ecosystem, such as a small island, known to contain exactly 100 objects. We are told that every object on the island is either a raven or a shoe. We wish to test "All ravens are black." In this context, "All non-black things are non-ravens" becomes a powerful tool. Suppose we inspect 50 objects and find they are all white shoes. Because the population is finite and known, every white shoe we identify reduces the number of unexamined objects where a counterexample (a non-black raven) could be hiding. If we were to examine all 50 shoes and find them white, and we know there are no other types of objects, we have logically proven that any remaining objects (the ravens) must be black, provided we also know there is at least one raven. The crucial background premise here is that the population of objects is finite, small, and exhaustively categorized. Under these conditions, sampling non-ravens is not merely logically permissible; it is an efficient method of elimination that drastically raises the probability of the hypothesis.

  Finally, consider a scenario where observing a black raven lowers confidence in the hypothesis. Suppose we are deciding between two theories about a population of birds. Theory $A$ states there are 100 ravens, all black. Theory $B$ states there are 1,000 ravens, 999 of which are black and one of which is white. We do not know which theory is true. If we go out and observe a single raven, it is ten times more likely that we would find a black raven under Theory $B$ simply because there are far more ravens in that world. Therefore, finding a black raven makes Theory $B$ more probable relative to Theory $A$. Since Theory $A$ is the hypothesis that "All ravens are black," observing a positive instance (a black raven) has actually lowered our confidence in the universal generalisation.

  This result does not vindicate the anonymous argument above. The anonymous argument claimed that the Equivalence Condition is false because shoes do not confirm the hypothesis. The scenario constructed here shows that Nicod's Criterion (the idea that positive instances always confirm) is false, because ravens do not always confirm the hypothesis. These are distinct failures. The anonymous argument tries to break the link between equivalent hypotheses; the raven scenario breaks the link between instances and confirmation. This demonstrates that confirmation is not a simple relation between an observation and a hypothesis, but depends on the probabilistic context and the set of competing hypotheses under consideration. The mistake in the original argument was assuming that because testing strategies differ, logical support must differ. The mistake in Nicod's Criterion is assuming that instance quality is intrinsic rather than comparative.

  ***

  ### MARKING SCHEME (25 MARKS TOTAL)

  **Part (a): Diagnosing the Mistake (8 Marks)**
  *   **4 Marks:** Identifies the conflation of *testing strategy/efficiency* (pragmatics) with *confirmation* (logic/semantics). Must explicitly state that (1) and (2) argue about where to look, not about what supports what.
  *   **2 Marks:** Correctly defines the Equivalence Condition (if $H \equiv H'$, evidence for one is evidence for the other).
  *   **2 Marks:** Explains that denying the Equivalence Condition requires showing logical divergence, not just practical divergence.

  **Part (b): The Shoe Scenario (8 Marks)**
  *   **4 Marks:** Provides a concrete, intelligible scenario (e.g., finite population, closed box, specific known constraints). Vague appeals to "context" without a concrete setup score 0 here.
  *   **4 Marks:** Explicitly identifies the **Background Premise** doing the work (e.g., "The population is finite and known," or "Non-black objects are rare/exhaustible"). *Crucial:* Simply saying "background knowledge" without specifying *which* knowledge caps this section at 2 marks.

  **Part (c): The Raven Scenario & Analysis (9 Marks)**
  *   **4 Marks:** Constructs a valid probabilistic scenario where a black raven disconfirms "All ravens are black" (e.g., competing hypotheses with different population sizes).
  *   **3 Marks:** Explains why this does *not* save the anonymous argument (i.e., distinguishes between attacking Nicod's Criterion vs. attacking the Equivalence Condition).
  *   **2 Marks:** Concludes that confirmation depends on the space of competing hypotheses, not just the instance type.

  **B-GRADE CEILING TRIGGERS**
  *Even if the essay is fluent and well-organised, apply the following caps if the specific philosophical work is not done:*

  1.  **The "Background Knowledge" Vague-Out:** If the student writes that "background knowledge solves the paradox" or "context matters" in Part (b) without specifying the *finite population* or *sampling constraint* premise, cap Part (b) at **4/8**.
  2.  **The "Bayesian Dissolution" Hand-wave:** If the student claims "Bayesianism solves this" without explaining the mechanism of priors or likelihood ratios in the context of the specific scenarios requested, cap Part (c) at **4/9**.
  3.  **The Conflation Error:** If the student agrees with the anonymous argument that the Equivalence Condition is false (rather than identifying it as the mistake), cap Part (a) at **2/8**.
  4.  **Name-Dropping without Work:** If the student names specific philosophers (e.g., "Good's paradox," "Hempel's solution") but fails to reconstruct the logic from scratch as requested, deduct **3 marks** from the total score.

  **DEDUCTIONS**
  *   **Failure to address all three parts (a, b, c):** Deduct **5 marks** from total.
  *   **Using proper names (Hempel, Goodman, Good, Carnap, etc.):** Deduct **3 marks** from total (as per exam instructions).
  *   **Word Count:** If the Model Answer length is significantly exceeded (indicating lack of precision), no penalty, but if the student answer is too brief to cover the mechanics of (c), cap Part (c) at **3/9**.
