answer: |-
  **Brainstorming Notes:**
  *   **Lewis/Counterfactuals:** Render this as a "Mirror Room." You step through to see what happens if the act didn't occur. If the harm persists in the reflection, the chain is broken.
  *   **Interventionism:** Render this as a "Control Board." Sliders and dials. You wiggle one; does the needle move? If you add a dial (variable), does the connection hold?
  *   **The Case:** A flood. Defendant opened a sluice gate. *Preemption:* The dam wall was already cracked (would have burst anyway). *Double Prevention:* A downstream levee was removed (would have stopped the water).
  *   **The Twist:** The crack in the dam (the preemptive backup) was caused by the vibration of the Bureau's own testing machinery over the years. The certifiers caused the condition that exempts the defendant.

  ***

  **The Bureau of Causal Certification**

  The air in the Bureau always smelled of ozone and old paper, the scent of decisions hardening into fact. I sat behind the desk of Adjudication, the Lewis-Mirror humming to my left, the Woodward-Board blinking to my right. Across from me sat the New Hire. He wore a suit that fit too well and tapped a pen against a file marked *8940: The Valley Flood*.

  "Run the Mirror," he said.

  I didn't want to. The Mirror was old technology. You stepped inside the glass, found the nearest world where the defendant didn't act, and checked the damage. It was clean, mostly. But in *8940*, the Mirror was lying to us.

  I activated the sequence. The glass clouded. We watched the reflection: The Defendant keeps the sluice gate closed. But in the reflection, the dam wall groans. The pre-existing crack widens. The water bursts through anyway. The valley floods.

  "Negative dependence," I said, reading the gauge. "If he hadn't opened the gate, the flood happens regardless. The Mirror says no causation. No liability."

  "It feels wrong," the New Hire said. "The water came through his gate. It poured through his hands. He opened the path."

  "That's preemption," I said. "The backup mechanism—the crack—screens him off. The old procedure is clear."

  "And the Levee?" he asked.

  I sighed. The file had a second clause. The Plaintiff claimed the Defendant had also ordered the removal of the downstream levee weeks prior. I toggled the Mirror to that variable.

  Reflection: The levee stays in place. The water hits the earthwork and stops. The valley stays dry.

  "Positive dependence," I said. "If he hadn't removed the levee, no flood. The Mirror says causation. Liability stands."

  "So he's liable for removing the stopper, but not for opening the tap?" The New Hire leaned forward. "Even though the tap was the immediate source? It's too cheap. Disabling a safeguard shouldn't carry more weight than pouring the water."

  "That's double prevention," I said. "The logic holds. He prevented the prevention of the flood."

  "The logic holds, but the room feels sick," he said. He turned to his machine. The Woodward-Board was a mess of sliders, each labeled with a factor of the event. *Gate Status. Wall Integrity. Levee Presence. Rainfall.*

  "Let's try the intervention," he said. "We don't look at other worlds. We wiggle the variables here."

  He set the board to the coarse grain. He grabbed the *Gate Status* slider and moved it from Open to Closed. The *Flood* needle dropped to Zero.

  "See?" he said. "Wiggle the gate, the flood stops. Causation is true."

  "You're ignoring the crack," I said. "You haven't modeled the backup."

  "Watch." He added a slider. *Wall Integrity.* He set it to *Critical*. He wiggled the *Gate* slider again. The *Flood* needle didn't move. It stayed at Maximum.

  "Now the gate doesn't matter," he said. "Relative to this variable set, he didn't cause it. Relative to the previous set, he did. The truth value flips based on how many dials you install."

  I looked at the file. This was the problem that kept the senior staff awake. If causation depends on the variable set, then liability depends on how finely you carve the world. Is 'cause' a relation in the world, or a confession of our own descriptive limits?

  "We have to certify one way," I said. "The plaintiff needs the payout to rebuild. If we say no cause, they starve. If we say cause, the defendant's insurance collapses."

  "Then choose the set that saves the plaintiff," the New Hire said. "Keep the board simple. Gate, Flood. Done."

  "And lie?"

  "And intervene," he corrected. "We're certifying claims, not mining diamonds. The causation is in the certification."

  I looked at the Mirror. It showed a world where the dam held, except for the crack. I looked at the Board. It showed a world where the sliders determined the truth. I picked up my pen. The decision was mine. If I chose the coarse set, the defendant pays. If I chose the fine set, the plaintiff starves.

  I looked closely at the file's appendix, the structural engineering report on the dam wall. The crack that doomed the Mirror's test—the backup cause that exonerated the defendant on the gate charge—was dated three years prior.

  *Cause of Fracture: Resonant Vibration.*

  I froze. I knew that resonance. It was the specific frequency of the Lewis-Mirror's cooling fans. We ran thousands of tests a year. The hum in the room, the ozone smell—it wasn't just atmosphere. It was the sound of the Bureau testing causation so hard we were breaking the things we studied.

  The backup mechanism wasn't nature. It was us.

  If we hadn't been here testing previous cases, the wall wouldn't have cracked. If the wall hadn't cracked, the Mirror would have shown dependence on the gate. The defendant would be liable. But our presence created the preemption that cleared him.

  I looked at the New Hire. He was watching the sliders, waiting for me to choose the set that fit his theory. He thought the variability was a feature of metaphysics. He didn't see that the variability was a feature of the office.

  "Well?" he asked. "Which set?"

  I looked at the *Wall Integrity* slider. It was the variable that changed the verdict. It was the variable we had created.

  "If I add this variable," I said, my voice quiet, "I say the wall caused the flood."

  "And if you remove it?"

  "I say he did."

  "And what do you say?"

  I looked at the Mirror. The glass was vibrating slightly. A hairline fracture was appearing in the corner of the frame, spreading toward the center. The Bureau was eating itself. The harm wasn't in the valley anymore. It was here. The payout wasn't for the flood; it was for the silence we bought to keep the walls standing.

  I picked up the pen. I didn't touch the sliders. I didn't look at the Mirror. I wrote *Certified* on the line for the Defendant's liability.

  "Why that verdict?" the New Hire asked. "The fine set clears him."

  "Because the variable set is incomplete," I said.

  "What's missing?"

  I listened to the hum of the machine, the vibration that cracked the dam, the vibration that was now cracking the glass between us.

  "The Observer," I said. "We need a slider for us."

  I signed the form. The ink dried instantly. Somewhere in the valley, a check was printed. Somewhere in the wall, a crack widened. I had wiggled the variable. I was the cause. The rest was just paperwork.
