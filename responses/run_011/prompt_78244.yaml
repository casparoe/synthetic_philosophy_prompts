          *   *Novel's Stance:* Pi *wants* reciprocity. The lack of it hurts. Suggests the *human* need for animal personhood, even if the animal doesn't possess it.

  4.  **The "Honest Critic" Section:**
      *   *Allegory:* The second story (humans instead of animals). If the tiger is a human cook, the ethics change entirely. Does this reduce the animals to metaphors? Yes, potentially denying them independent standing.
      *   *Idiom Clash:* Martel writes about faith/story/ wonder. Nozick writes about rights/constraints. Forcing them together might distort Martel.
