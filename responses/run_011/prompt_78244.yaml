      *   *The Tension:* Humans are animals too. The boundary is awkward.
      *   *Evaluation:* Is it a compromise or "having it both ways"? It looks like the latter (protecting human exceptionalism while appearing generous to animals), but it attempts to solve the "marginal cases" problem by focusing on typical capacities. I need to be nuanced here.

  3.  **Deconstruct *Life of Pi* Scenes through Nozick:**
      *   *Zoo Chapters:* Pi's father argues captivity with care is better than wild danger.
          *   *Nozick Lens:* This is pure animal utilitarianism (maximize welfare/safety).
          *   *Novel's Stance:* It endorses it initially, but the shipwreck undermines it. Safety is fragile.
      *   *Lifeboat Management:* Pi tames Richard Parker (territory, whistle, seasickness).
          *   *Nozick Lens:* Is this welfare or use? Pi uses the tiger to stay alert/alive. The tiger gets food. It's a symbiotic contract, but instrumental.
