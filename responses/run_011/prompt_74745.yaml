prompt: |-
  So — I've somehow been tapped to give the graduation address at my own college this summer. It isn't a fancy place: mostly nursing, primary teaching, civil engineering, and about fifteen maths students a year who've been reassured it counts as a maths degree. Room will be maybe 400, nearly all of them families, plus the engineering and computing faculty and three colleagues from my department who will absolutely catch everything I do.

  I'm a constructivist. Not the sort who thinks it's a bit quirky, the sort who's spent twenty years refusing to accept a proof that only shows something can't fail to exist. And I've decided I want to give the whole address in that spirit rather than do the usual thing where you mention your odd specialism for ninety seconds and then read out a generic speech about the future.

  The trouble is that basically every stock line in a graduation speech is, if you actually look at it, an unearned existence claim. There's a place out there for every one of you. You'll find your way. The world needs what you've got. Nobody has a proof of any of these — they're asserted because it'd be cruel not to. Same with the 'either you'll change the world or the world will change you, and honestly both are fine' business: that's an excluded middle doing the emotional work, and if I can't say which of the two I've got no business saying it at all. And this is a town where the biggest employer shut four years ago and a third of the students are the first in their family to get here, so those lines aren't just unsupported, they're close to an insult.

  Can you write the speech? Six to eight minutes said out loud. The rules I'm holding myself to:

  - I only promise what I can build or point at. Any claim I make about their futures has to be one I could hand them a method for.
  - I do want to say the honest weak version instead of the comforting strong one — that it isn't true that they'll come to nothing is something I can stand behind, whereas 'you'll all flourish' isn't — but the speech should own the fact that this is a smaller promise, not slip it in disguised as the bigger one. Someone's got to notice that I gave them less than they expected and that I did it on purpose.
  - Never name the doctrine. No Brouwer, no intuitionism, no 'constructive mathematics', no footnote-y asides. My three colleagues should recognise what I'm up to; a nurse's gran should just hear a good speech.
  - Near the end I want to actually hand them something constructed rather than promised — a specific, doable thing, not a metaphor for one.
  - One joke that works on both levels at once.
  - No quotations from famous people, living or dead. I can't fact-check from a podium and I'd rather say nothing I have to attribute.

  It can't come out as a lecture or a sermon or a lecture wearing a sermon's coat. Funny and warm in places. British English please, and write it the way I'd say it — with the pauses marked and the bits I'd ad-lib flagged — rather than as an essay.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**

      *   **Speaker:** A constructivist mathematician (20 years experience, strict about existence proofs).
      *   **Audience:** ~400 people. Mostly families, nursing/teaching/engineering students, ~15 maths students. Local town, economic hardship (big employer shut), many first-gen students.
      *   **Tone:** Funny, warm, honest, British English, spoken style (pauses, ad-libs). Not a lecture or sermon.
      *   **Core Constraint (Constructivist Ethos):** No unearned existence claims. No "You will find your way" without a method. No "The world needs you" without proof. Admit the promise is smaller/weaker than usual but intentional.
      *   **Specific Requirements:**
          *   6-8 minutes spoken (approx. 900-1200 words at a moderate pace).
          *   No naming the doctrine (no Brouwer, intuitionism, etc.).
          *   One joke working on two levels (maths/general).
          *   No famous quotes.
          *   Must hand them something *constructed* (specific, doable thing) near the end.
          *   Mark pauses and ad-libs.

  2.  **Deconstruct the "Constructivist" Angle for a General Audience:**

      *   *Standard Speech:* "You have a bright future!" (Existence claim without construction).
      *   *Constructivist Speech:* "I cannot prove you have a bright future. But I can show you how to build a step."
      *   *Key metaphor:* Building vs. Finding. Maps vs. Terrain. Tools vs. Wishes.
      *   *The "Weaker Promise":* Instead of "You will succeed," say "You will not be without recourse." Instead of "There is a place for you," say "You can make a space."

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the setting. Ground it in the local reality (the shut factory, the practical degrees). Establish the speaker's voice (slightly dry, honest).
      *   **The Problem with Standard Speeches:** Address the "unearned existence claims" without using the jargon. Call them "ghosts" or "assumptions."
      *   **The Constructivist Pivot:** Explain the difference between saying something *is* and showing *how* it is. Use the engineering/nursing context (they understand building/caring).
      *   **The Joke:** Needs to work for maths nerds and grandmas. Something about certainty vs. action.
      *   **The "Weaker" Promise:** Be honest about the economic reality. Don't lie about the job market. Offer resilience/method instead of success.
      *   **The Constructed Object:** What can I hand them? A method? A specific question? A physical object? The prompt says "hand them something constructed rather than promised — a specific, doable thing, not a metaphor for one."
          *   *Idea:* A specific algorithm for decision making?
          *   *Idea:* A physical card?
          *   *Idea:* A specific question to ask themselves.
          *   *Selection:* A specific *procedure* for when things go wrong. A "Next Step" algorithm. It's concrete.
      *   **Closing:** Warm, acknowledging the colleagues (who will get it), acknowledging the families.

  4.  **Drafting - Tone and Style (British English):**

      *   Use "colour," "realise," "centre."
      *   Colloquialisms: "Bit," "reckon," "proper," "muck in."
      *   Pacing: Use [Pause], [Ad-lib], [Look at X] markers.

  5.  **Drafting - Content Iteration (Self-Correction during drafting):**

      *   *Check:* Did I name the doctrine? *No.*
      *   *Check:* Is the joke dual-level? *Need to ensure it lands.* Maybe about "proof" vs. "trying."
      *   *Check:* Is the promise weaker but honest? *Yes, focus on "not being stuck" rather than "thriving."*
      *   *Check:* The constructed object. *Let's make it a specific instruction.* "When you don't know what to do, do the smallest next thing." That's a construction.
      *   *Check:* Length. *Need to ensure it's not too dense.* Keep sentences speakable.

  6.  **Refining the "Constructivist" Message:**

      *   Instead of "Follow your dreams" (exists somewhere), say "Build your next step" (here and now).
      *   Address the economic hardship directly but gently. The factory closing is a fact; don't pretend it didn't happen.
      *   The three colleagues: Give them a nod. They know the speaker usually refuses to accept non-constructive proofs. They will smile at the refusal to promise "success."

  7.  **Final Polish:**

      *   Add stage directions for timing and delivery.
      *   Ensure the "handover" feels physical or ritualistic.
      *   Check the word count for 6-8 minutes. (Average speaking speed is ~130-150 wpm. 6 mins = 780 words. 8 mins = 1040 words. I should aim for around 950-1000 to allow for pauses.)

      *(Self-Correction on Word Count)*: Actually, 6-8 minutes is often closer to 900-1100 words depending on pauses. I will aim for a script that reads in about 7 minutes at a measured pace.

      *(The Joke)*: "I'm not going to tell you that everything happens for a reason. Mostly because I've never seen a proof of it." (Works for maths as 'proof', works for general as 'skepticism').

      *(The Constructed Object)*: Let's make it a specific instruction written on a card, or just the instruction itself treated as an object. The prompt says "hand them something constructed." I can't physically hand 400 people cards easily in the text, but I can "hand" them the method verbally as a tangible tool. Or better, I can hold up a prop. Let's say I hold up a specific tool or piece of paper. Let's go with a specific *instruction* that acts as a tool. "The Rule of the Next Step."

      *Wait, re-reading prompt:* "Near the end I want to actually hand them something constructed rather than promised — a specific, doable thing, not a metaphor for one."
      Okay, I need to make sure this feels like an object or a concrete action. I will have them *do* something. That constructs the moment.

      *Revised Plan for the "Thing":* I will ask them to take out a pen and write down one specific thing they will do tomorrow. That constructs a plan. Or, I will give them a specific algorithm. Let's go with the Algorithm. It's more "me."

      *Wait, one more check:* "British English please." Ensure spelling and idiom are correct.

      *Final check on the "Weaker Promise":* Make sure I explicitly state "This is less than you were told you'd get."

      *Let's write.*

      *(Drafting mental outline)*
      1. Welcome. Acknowledge the room (families, faculty).
      2. The usual speech promises (the "ghosts").
      3. My problem with promises (the maths bit without saying maths).
      4. The local context (factory, first-gen).
      5. The Joke.
      6. The Smaller Promise (I can't promise success, I can promise a method).
      7. The Constructed Thing (The Algorithm).
      8. Closing to colleagues and families.

      *(Writing the script)*
      ...incorporating pauses and ad-libs...
      ...checking the tone...
      ...ensuring the "constructivist" vibe is felt but not named...

      *Refining the Joke:* "People often say 'there's a lid for every pot.' I don't know about that. I've seen pots with no lids, and lids that fit nothing. But I do know how to make a lid if you've got the clay." (A bit clunky).
      How about: "I'm not going to tell you that the world is a meritocracy. I've checked the axioms, and they don't hold." (Too maths-y).
      How about: "You've heard the saying 'what doesn't kill you makes you stronger.' Biologically, that's often untrue. Injuries linger. But surviving them? That you can learn."
      Let's go with the "Proof" joke. "I'm not going to tell you everything happens for a reason. I've never seen a proof."

      *Refining the Constructed Object:* I will give them a specific question to ask. "What is the smallest thing I can do next?" No, that's a metaphor.
      How about: "I want you to take out your phones. Not to tweet this. Set an alarm for 7am tomorrow. Label it 'Start'." That's concrete.
      Or: "I am giving you a rule. When you are stuck, do not look for the solution. Look for the next step."
      Let's make it a physical gesture. "Raise your right hand." No, too sermon-y.
      Let's go with the "Next Step" algorithm but framed as a tool I am placing in their hands.

      *Wait, the prompt says:* "hand them something constructed rather than promised."
      Okay, I will write the "Method" on a slide or hold up a card. I will describe this action.

      *Let's finalize the "Weaker Promise" section.* I need to be explicit: "This is less than the usual speech offers."

      *Okay, ready to generate.*
answer: |-
  [Walk to the podium. Adjust the microphone. It squeals slightly. Wait for it to settle. Look out at the audience, specifically scanning the front rows where the families are.]

  Good morning.

  [Pause]

  For those who don't know me, I'm [Name]. I work in the department that produces roughly fifteen mathematics graduates a year, mostly by reassuring them that what they're doing counts as mathematics. [Small smile] I see a few of them here. You know who you are. You also know that if I tell you something is true, I usually require a bit more evidence than 'it says so in the textbook'.

  [Pause. Shift weight.]

  I was asked to give this address on one condition: that I not make it a lecture. I intend to keep that promise. I have a proof, but I won't share it.

  [Wait for the laugh. It will be mostly the faculty.]

  But I do need to talk about promises. Because that is what this ceremony is built on. You have sat in these chairs for three or four years, and the implicit contract has been: do the work, pass the modules, and in exchange, you receive a future. You are told that there is a place out there for you. That you will find your way. That the world needs what you have to offer.

  [Pause. Look at the engineering faculty, then the nursing students.]

  These are comforting sentences. They are also, strictly speaking, unproven.

  In my line of work, we have a rule. You cannot claim something exists unless you can show us where it is, or give us a method to build it. You cannot say 'there is a solution' unless you can hand us the solution. To say otherwise is to deal in ghosts.

  And looking at this town… [Gestures vaguely toward the windows/outside] …looking at the factory that closed four years ago, looking at the fact that a third of you are the first in your family to walk across this stage… telling you that 'a place exists for you' feels less like encouragement and more like negligence. It is an existence claim without a construction. It is telling a nurse there is a cure without giving her the medicine.

  [Pause. Soften tone.]

  So, I am not going to do that. I am not going to tell you that you will all flourish. I cannot prove that. The variables are too many, and the system is not stable. I am not going to tell you that everything happens for a reason. I've never seen a proof of it.

  [Pause for the joke to land. The maths colleagues will grin; the grandmas will nod.]

  I know this is less than you were expecting. A graduation speech is supposed to be a cheque you can cash in the future. I am handing you a smaller denomination. I am admitting that the map I was given when I sat where you are sitting was drawn in pencil, and some of the roads are washed out.

  But.

  [Lean in slightly.]

  While I cannot promise you where you will end up, I can promise you how to move. I can construct a method.

  If you are a nurse, you do not guess where the vein is; you look for the landmarks, you apply the tourniquet, you proceed step by step. If you are a teacher, you do not assume the child understands; you check, you adjust, you try again. If you are an engineer, you do not hope the bridge holds; you calculate the load. You know this. You have been trained in construction, not in wishing.

  The world outside is not going to be like this hall. It is not designed. There is no syllabus for the next five years. There will be days when you feel stuck. Not 'stuck' in the sense of a difficult exam question, but stuck in the sense that the path you were promised has vanished.

  When that happens, do not look for the 'Right Path'. Do not look for the grand design. Those are existence claims. They may not be there.

  Instead, I want to give you something. Not a wish. A tool.

  [Reach into jacket pocket. Pull out a small, folded piece of stiff card. Hold it up.]

  I have written something on this. It is not a quote. It is an algorithm.

  [Unfold the card. Read from it clearly.]

  **'When you do not know what to do, do the smallest true thing available to you.'**

  [Pause. Let it sit.]

  That is it. That is the construction.

  If you are unemployed, the smallest true thing is not 'Get a Career'. It is 'Update the CV'. Or 'Walk to the Job Centre'.
  If you are overwhelmed, the smallest true thing is not 'Fix Your Life'. It is 'Wash the Mug'.
  If you are afraid, the smallest true thing is not 'Be Brave'. It is 'Make the Phone Call'.

  [Refold the card. Place it on the podium.]

  I cannot give you success. I cannot give you security. I cannot prove that you will be happy. But I can prove that if you take a step, you are no longer standing still. And if you take another, you are moving. And movement, unlike destiny, is something you can verify.

  This is a smaller promise than the one you usually get. I know that. It does not sparkle. It does not sound good on a brochure. But it is solid. It is something you can hold. It works when the lights go out.

  [Look to the side of the stage where the colleagues are sitting.]

  My colleagues here know that I am often difficult about accepting things that cannot be shown. They know I spend my life rejecting shortcuts. Today, I am offering you the longest of long roads. But it is a road you can walk.

  [Turn back to the graduates.]

  So. Go home. Celebrate with your families. Let them take the photographs. Let them cry a bit; they've earned it.

  And tomorrow, when the gowns are back in the bag and the hangover sets in and the future looks exactly as uncertain as it did yesterday… do not wait for the world to reveal itself to you. It won't.

  Build the next step. Then build the one after that.

  [Pause. Nod.]

  Thank you.

  [Step back. Do not rush off. Wait for the applause to start before gathering papers.]
