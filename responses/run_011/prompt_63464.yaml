      *   **Target Audience:** A senior philosophy-of-history student writing a term paper. The tone should be analytical, rigorous, and practical (for application, not admiration).
      *   **Length/Format:** Roughly 10-12 items. Consolidated. No references/bibliography.
      *   **Specific Content Requirements:** Must engage with Metric, Baseline, Ratchet Condition, Endpoint Sensitivity, Mechanism, Selection Bias, and Licensing (quietism/atrocity).
      *   **Critical Analysis:** Identify which requirements are non-negotiable vs. contested (e.g., naturalism, theodicy). Identify any incompatibilities within the list (or which single requirement eliminates the most positions).
      *   **Evaluation:** Briefly assess four specific families of accounts (Dialectical, Marxist, Kantian/Hope, Empirical/Indicators) against the list.
      *   **Constraint:** Do not just restate the thesis as a criterion. Every requirement must be something an account could *fail*.

  2.  **Deconstruct the Thesis ("The Arc Bends Toward Justice"):**
      *   This is a claim about historical teleology or trend.
      *   It implies directionality, a metric of value (justice), and some form of necessity or probability.
      *   Common pitfalls: Cherry-picking dates, defining justice tautologically, ignoring regress, ignoring survivor bias, implying moral permission for suffering.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Idea 1 (Metric):* Need to define justice.
          *   *Refinement:* **Metric Specificity.** The account must define the variable being tracked. Failure mode: Equivocating between "justice" as moral sentiment vs. institutional rights.
      *   *Idea 2 (Baseline):* Progress from where?
          *   *Refinement:* **Baseline Specification.** Is it improvement from $t_1$ to $t_2$, or approach to an ideal? Failure mode: Moving the goalposts.
      *   *Idea 3 (Ratchet):* Is it reversible?
          *   *Refinement:* **Reversibility Threshold.** Does the theory account for backsliding? Failure mode: Calling a temporary regression a "necessary dialectical step" without explaining why it won't stick.
      *   *Idea 4 (Endpoint):* Does the date matter?
          *   *Refinement:* **Temporal Robustness.** The claim shouldn't depend entirely on stopping the clock at a convenient moment. Failure mode: "History ended in 1989" vs. "History is a cycle."
      *   *Idea 5 (Mechanism):* How does it happen?
          *   *Refinement:* **Causal Mechanism.** Is it agency, structure, or luck? Failure mode: Asserting a trend without a driver (just-so story).
      *   *Idea 6 (Selection):* Survivor bias.
          *   *Refinement:* **Survivorship Correction.** Accounting for civilizations that failed. Failure mode: Only counting the winners.
      *   *Idea 7 (Licensing):* Moral hazards.
          *   *Refinement:* **Normative Licensing.** Does it justify present evil for future good? Failure mode: Theodicy (justifying atrocity as necessary).
      *   *Idea 8 (Scope):* Universal or local?
          *   *Refinement:* **Scope Consistency.** Is it global justice or just the West? Failure mode: Eurocentrism masked as universal history.
      *   *Idea 9 (Metaphysics):* Naturalism vs. Providence.
          *   *Refinement:* **Metaphysical Commitment.** Does it require God or immanent logic? (This is the contested one requested).
      *   *Idea 10 (Falsifiability):* Can it be proven wrong?
          *   *Refinement:* **Falsification Conditions.** What would count as evidence against the arc? Failure mode: Unfalsifiable optimism.
      *   *Idea 11 (Agency):* Human role.
          *   *Refinement:* **Agency Compatibility.** Does it make human action redundant? (Connects to quietism).
      *   *Idea 12 (Aggregation):* How do we sum up suffering vs. gain?
          *   *Refinement:* **Aggregation Principle.** How are gains and losses weighed? Failure mode: Ignoring the depth of loss for the breadth of gain.

      *Review against constraints:* Need 10-12 items. Need to mark Non-Negotiable vs. Contested. Need to address the specific prompts (Metric, Baseline, Ratchet, etc.).

      *Consolidating:*
