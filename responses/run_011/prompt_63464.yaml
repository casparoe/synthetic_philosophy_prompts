answer: |-
  ### Desiderata for Evaluating Historical Progressivism

  The following twelve requirements are designed to test whether an account of the "arc of history" constitutes a defensible theoretical claim or merely a hopeful assertion. Each item specifies what meeting the requirement looks like and classifies the requirement as **Non-Negotiable** (required for logical coherence) or **Contested** (dependent on philosophical commitment).

  **1. Metric Specificity**
  *   **Requirement:** The account must identify a discrete variable tracked as "justice" (e.g., reduction in violence, expansion of suffrage, material equality) and justify why this metric supersedes others that might show regression.
  *   **Meeting It:** Explicitly stating, "We measure justice by X, not Y, because Z," and acknowledging how the trend looks if Y is chosen.
  *   **Status:** **Non-Negotiable.** Without a defined metric, "justice" is an equivocal term allowing the theorist to switch measures when one shows decline.

  **2. Baseline Definition**
  *   **Requirement:** The account must specify the reference point for progress: is it improvement from a specific past date, avoidance of a counterfactual state of nature, or asymptotic approach to an ideal?
  *   **Meeting It:** Defining the zero-point. For example, "Progress is the reduction of suffering relative to pre-state societies," not just "things are better."
  *   **Status:** **Non-Negotiable.** A vector requires an origin; without one, directionality is undefined.

  **3. Reversibility Threshold (The Ratchet)**
  *   **Requirement:** The account must declare whether the "arc" implies irreversibility (gains are locked in) or merely a statistical tendency (gains can be lost). It cannot slide between these claims.
  *   **Meeting It:** Either providing a mechanism that makes regression structurally impossible (a true ratchet) or admitting that the arc can bend backward, thereby weakening the claim from "necessity" to "probability."
  *   **Status:** **Non-Negotiable.** Confusing a trend with a law is a category error.

  **4. Temporal Robustness**
  *   **Requirement:** The verdict of the theory cannot depend entirely on the date at which the record is stopped.
  *   **Meeting It:** Demonstrating that the mechanism holds across periods of apparent regression, or explaining why specific endpoints (e.g., 1945 vs. 1989) are not cherry-picked to validate the thesis.
  *   **Status:** **Non-Negotiable.** A theory refuted by waiting fifty years is empirically vacuous.

  **5. Causal Mechanism**
  *   **Requirement:** The account must identify the engine of the trend. Is it human agency, institutional evolution, technological determinism, or providential design? A bare statistical correlation without a driver is insufficient for the word "arc."
  *   **Meeting It:** Describing *how* the transition from $t_1$ to $t_2$ occurs (e.g., "commercial interdependence reduces war").
  *   **Status:** **Non-Negotiable.** Correlation is not causation; "arc" implies a force, not just a shape.

  **6. Survivorship Correction**
  *   **Requirement:** The account must address the possibility that the historical record is biased toward societies that survived, while those that failed (and perhaps suffered greater injustice) are excluded from the data.
  *   **Meeting It:** Accounting for destroyed civilizations or acknowledging that the "progress" observed is only visible from the perspective of the victors.
  *   **Status:** **Non-Negotiable.** Ignoring the denominator (failed states) invalidates statistical claims about the success of justice.

  **7. Normative Licensing**
  *   **Requirement:** The account must explain why believing in the arc does not morally permit present atrocity as a necessary cost of future justice.
  *   **Meeting It:** Explicitly rejecting the instrumentalization of suffering, even if the theory suggests suffering leads to progress.
  *   **Status:** **Non-Negotiable.** A theory of justice that licenses injustice is performatively contradictory.

  **8. Scope Consistency**
  *   **Requirement:** The claim must clarify whether it applies to human history globally or only to specific cultural lineages (e.g., "The West").
  *   **Meeting It:** Avoiding universal claims ("History bends") while presenting evidence drawn only from a specific subset of humanity.
  *   **Status:** **Non-Negotiable.** Universalizing a local trend is a hasty generalization.

  **9. Falsification Conditions**
  *   **Requirement:** The account must specify what empirical or logical evidence would prove the thesis false.
  *   **Meeting It:** Stating, "If event X occurs, the arc is broken."
  *   **Status:** **Non-Negotiable.** An unfalsifiable claim is theological, not philosophical-historical.

  **10. Metaphysical Economy**
  *   **Requirement:** The account must not rely on hidden teleology (a theodicy) or assume a naturalistic metaphysics without argument. It must declare whether the "bending" is immanent to the world or imposed upon it.
  *   **Meeting It:** Either arguing for a naturalistic mechanism (contingent, causal) or admitting a providential/teleological commitment. It cannot claim naturalism while relying on inevitable outcomes that resemble divine plan.
  *   **Status:** **Contested.** Religious or idealist philosophers will reject the demand for naturalism; strict materialists will reject any hint of teleology. This is a battle over the rules of the game, not internal coherence.

  **11. Aggregation Principle**
  *   **Requirement:** The account must explain how it weighs deep suffering against broad rights. Does the alleviation of poverty for millions outweigh the systematic oppression of a minority?
  *   **Meeting It:** Providing a calculus for trade-offs (e.g., Rawlsian difference principle vs. utilitarian sum).
  *   **Status:** **Contested.** This depends on one's prior moral theory (deontology vs. consequentialism).

  **12. Agency Preservation**
  *   **Requirement:** The account must explain the role of human action. If the arc bends necessarily, is moral effort redundant? If effort is required, is the "arc" merely a description of that effort?
  *   **Meeting It:** Distinguishing between structural inevitability and the necessity of human struggle.
  *   **Status:** **Contested.** Determinists will sacrifice agency; voluntarists will sacrifice the "arc" as a law.

  ***

  ### Analysis of Incompatibility

  The list contains a fundamental tension that makes satisfying all twelve simultaneously impossible for most robust theories. The incompatibility lies between **Desideratum 5 (Causal Mechanism)** and **Desideratum 12 (Agency Preservation)**.

  If an account provides a strong **Causal Mechanism** (e.g., dialectical materialism, technological determinism) sufficient to satisfy **Temporal Robustness** and **Reversibility Threshold**, it necessarily implies that the outcome is structurally determined. If the arc bends *because* of structural laws, human agency is epiphenomenal; the outcome occurs regardless of specific moral choices. This violates **Agency Preservation** and risks violating **Normative Licensing** (if the outcome is guaranteed, why struggle? or conversely, if struggle is unnecessary, why object to the costs?).

  Conversely, if an account prioritizes **Agency Preservation** (justice happens *only* because we fight for it), it weakens the **Causal Mechanism**. The "arc" becomes a metaphor for human effort rather than a historical law. This makes the claim vulnerable to **Falsification Conditions** (if we stop fighting, the arc stops) and **Temporal Robustness** (there is no guarantee the next generation will fight).

  **The Single Most Eliminating Requirement:**
  If one must choose a single criterion that eliminates the largest number of positions actually on offer, it is **Desideratum 6 (Survivorship Correction)**. Most progressive histories are written from the perspective of the societies that persisted (liberal democracies, industrialized states). They track metrics (literacy, rights, longevity) that are only available where societies survived. Accounts that fail to account for the civilizations that were destroyed *because* of the expansion of the "just" societies (e.g., colonialism, indigenous erasure) cannot claim a universal arc. This requirement collapses most Eurocentric or Whig histories immediately.

  **On the Contested Metaphysical Requirements:**
  You correctly identified **Metaphysical Economy** as contested. This is not merely local prejudice; it is a boundary dispute. A naturalist demands that "bending" be explained by efficient causes (physics, psychology, economics). An idealist or theologian argues that history has a *telos* that cannot be reduced to efficient causes. To demand naturalism as a **Non-Negotiable** criterion is to rule out Hegel or Augustine by fiat. However, to allow "hidden teleology" (claiming naturalism while smuggling in inevitability) is intellectual dishonesty. Therefore, the requirement should not be "must be naturalistic," but "must declare its metaphysical debt." An account fails only if it claims to be empirical while relying on providential luck.

  ***

  ### Evaluation of Principal Families

  **Dialectical Accounts (e.g., Hegel)**
  These accounts score highly on **Causal Mechanism** and **Metric Specificity** (freedom as the consciousness of necessity). However, they notoriously fail **Normative Licensing** and **Metaphysical Economy**. They tend to treat historical suffering as the "slaughterbench" required for the realization of Spirit, which violates the prohibition on licensing atrocity. They also rely on a teleological metaphysics that naturalists will reject as a disguised theodicy.

  **Marxist Accounts**
  Marxism satisfies **Causal Mechanism** (material conditions) and **Baseline Definition** (class struggle) well. It fails **Temporal Robustness** (the predicted endpoint has not materialized, requiring constant ad-hoc adjustments to the timeline) and **Survivorship Correction** (it often treats failed socialist experiments as "not real socialism," insulating the theory from falsification). It also struggles with **Agency Preservation**, oscillating between historical inevitability and the call for revolutionary praxis.

  **Kantian Accounts (History as Warranted Hope)**
  This approach sidesteps the incompatibility by treating the arc as a regulative ideal rather than a constitutive law. It passes **Normative Licensing** and **Agency Preservation** beautifully (we must act *as if* progress is possible). However, it deliberately fails **Causal Mechanism** and **Falsification Conditions**. It is not a description of what *is* happening, but a prescription for what we must *believe* to act morally. As a theory of history, it is agnostic; as a moral philosophy, it is robust.

  **Contemporary Empirical Accounts (e.g., Long-run indicators of violence/rights)**
  These accounts excel at **Metric Specificity** and **Baseline Definition** (data-driven). They often fail **Survivorship Correction** (data is skewed toward stable, Western states) and **Reversibility Threshold** (recent data on democratic backsliding or nuclear risk challenges the "ratchet" claim). They also struggle with **Metaphysical Economy** if they imply the trend is self-correcting without human maintenance. They are the most falsifiable but also the most vulnerable to **Endpoint Sensitivity**; a few decades of war can erase a century of statistical peace.
