      4.  Temporal Robustness (Endpoint)
      5.  Causal Mechanism (Mechanism)
      6.  Survivorship Correction (Selection)
      7.  Normative Licensing (Licensing)
      8.  Scope Consistency (Added for completeness regarding "history")
      9.  Falsification Conditions (Added for philosophical rigor)
      10. Metaphysical Economy (The contested naturalism/theodicy point)
      11. Aggregation Principle (How to weigh blood vs. rights)
      12. Agency Preservation (Quietism check)

  4.  **Developing the Content for Each Desideratum:**
      *   For each, I need: The Requirement, What Meeting It Looks Like, and Status (Non-Negotiable/Contested).
      *   *Self-Correction on Status:* The prompt asks me to argue *why* some are contested (specifically naturalism/theodicy). I need to make sure I don't just label them but explain the tension in the main analysis section. In the list, I will mark them clearly.

  5.  **Analyzing Incompatibilities:**
      *   *The Big Tension:* **Causal Mechanism** (deterministic structures) vs. **Agency Preservation** (moral responsibility). If history *necessarily* bends, do we need to act?
      *   *Second Tension:* **Temporal Robustness** vs. **Metaphysical Economy**. To guarantee the arc without God/Teleology requires strong empirical data, but empirical data is always endpoint-sensitive.
      *   *Third Tension:* **Normative Licensing** vs. **Aggregation Principle**. If you weigh total welfare (utilitarian), you might justify atrocity. If you prioritize rights (deontological), progress looks slower or non-existent.
      *   *Decision:* The strongest incompatibility is between a strong *Causal Mechanism* (immanent necessity) and *Agency Preservation*. If the arc bends *regardless*, agency is illusory. If it bends *because* of agency, the "arc" is just a description of human effort, not a historical law.

  6.  **Evaluating the Four Families:**
      *   *Dialectical (Hegel):* Strong mechanism, weak on survivorship, risks theodicy.
      *   *Marxist:* Strong mechanism, strong metric (material), fails licensing (revolutionary violence), fails endpoint sensitivity (communism hasn't arrived).
      *   *Kantian (Hope):* Regulative ideal. Avoids mechanism claims. Passes licensing, fails Causal Mechanism (by design).
      *   *Empirical (Pinker/etc.):* Strong on metric/data. Fails Survivorship (Western focus?), Fails Reversibility (recent trends?), Falsification is tricky (cherry-picking start dates).

  7.  **Refining the Tone:**
      *   The user wants this for a paper to *apply* to arguments. The tone should be sharp, diagnostic, and slightly skeptical. Avoid flowery language.
      *   Ensure the "Non-Negotiable vs. Contested" distinction is clear.
      *   Ensure the "Incompatibility" section is the highlight.

  8.  **Final Review against Prompt:**
