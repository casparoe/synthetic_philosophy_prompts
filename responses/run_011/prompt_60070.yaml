  **The Poem**

  People ask how it started, really,
  and I tell them the winter was mild
    February, nineteen sixty-eight, the frost on the glass.
  We were at a dinner, just friends of friends,
  nothing planned, you know how it goes
    The Savoy Grill, table four, near the window.
  I was nervous, she laughed at my tie,
  said I looked like a salesman selling nothing.
    Uncle Arthur brought the wine, the red one.
  I remember the light was low, golden,
  like honey spilling over the tablecloth.
    She wore the blue dress, the silk one.
  We talked about books, about the war,
  about where we might go if we could leave.
    You ordered the sole, I had the steak.
  I walked her home, it was raining slightly,
  I held the umbrella wrong, she didn't mind.
    You kissed her at the door, step three.
  That's the story, simple as a coin,
  though people think there must be more to it.
  Sometimes I tell them it was summer,
  feels warmer when I say it that way.
  The restaurant name escapes me sometimes,
  but it was fancy, definitely the Ritz.
  Uncle George was there, he'd know the date,
  1970, the year we bought the house.
  I keep the story tidy for them,
  so they don't have to wonder about the gaps.
    1970, the year we bought the house.

