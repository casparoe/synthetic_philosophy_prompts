          *   *Let's look closer:* If the user thinks one is fine, it's likely the Search one. But the procedure should be rigorous. If the procedure flags Search CTR, I must explain *why* it's risky (e.g., need a "dwell time" or "satisfaction" signal).
          *   *Actually, looking at Case 2:* Training a bot on acceptance is *very* risky. It creates a feedback loop where the bot learns to please, not to correct.
          *   *Looking at Case 3:* Fraud with adaptive adversaries. This is the hardest.
