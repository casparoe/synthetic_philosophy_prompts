answer: |-
  Right then. This is a classic platform engineering bottleneck. You're being asked to validate causal chains without the tools to do so, so you've defaulted to trust. That works until it doesn't.

  Below is the **30-Minute Metric Stress Test**. It is designed to be run by a generalist engineer. It separates the four failure modes (Noise, Proxy Breakdown, Wrong Lever, Gaming) and forces a decision at each stage.

  Following the procedure, I have annotated exactly where the rules end and your human judgement begins. Finally, I have run the three live proposals through it.

  ---

  # The 30-Minute Metric Stress Test

  **Prerequisite:** The requesting team must provide a one-paragraph statement of the **True Goal** (the business outcome) and the **Proposed Metric** (the number they want to optimise). If they cannot define the True Goal in one sentence, reject the ticket immediately.

  ### Step 1: The Causal Link (Wrong Lever)
  **Question:** If we successfully increase this metric by 10% tomorrow, does the True Goal *necessarily* improve?
  *   **Good Answer:** "Yes, because the metric is a direct component of the goal (e.g., revenue) OR we have historical evidence that moves in this metric correlate with moves in the goal."
  *   **Bad Answer:** "It's a strong indicator," or "It usually goes up when the goal goes up." (Correlation is not causation).
  *   **Action:**
      *   If **No**: **REJECT**. The metric is a vanity measure.
      *   If **Yes**: Proceed to Step 2.
      *   *Historical Data Check:* If you have logs, ask for a scatter plot of the Metric vs. the Goal over the last 6 months. If the correlation coefficient is below 0.6, **REJECT** (Too Noisy).

  ### Step 2: The Extremes Check (Proxy Breakdown)
  **Question:** Imagine we achieve 100% perfection on this metric. Does the True Goal still hold, or does the system break?
  *   **Good Answer:** "At 100%, the goal is maximised," or "We cap the optimisation at X% to prevent breakage."
  *   **Bad Answer:** "Well, obviously we wouldn't push it to 100%," or "At 100%, users would actually be annoyed."
  *   **Action:**
      *   If **Bad Answer**: **CONDITIONAL PASS**. You must require a *counter-metric* (e.g., if optimising Click-Through, you must also track 'Time to Resolve' or 'Bounce Rate'). If they refuse a counter-metric, **REJECT**.
      *   If **Good Answer**: Proceed to Step 3.

  ### Step 3: The Adversary Check (Gaming)
  **Question:** Who benefits if this metric goes up, and can they increase the metric *without* increasing the True Goal?
  *   **Good Answer:** "No one benefits directly," or "The only actors are internal systems with no agency."
  *   **Bad Answer:** "The sales team gets a bonus," "The users want to bypass this," or "External bad actors can observe the output."
  *   **Action:**
      *   If **Bad Answer**: **REJECT** or **HARD CONDITIONAL**. You cannot use this metric for *auto-tuning* or *training loops*. It may only be used for passive dashboards. If they insist on a training loop, they must prove the signal is hidden from the actor.
      *   If **Good Answer**: Proceed to Step 4.

  ### Step 4: The Feedback Loop Check (Stability)
  **Question:** Does changing the system based on this metric change the distribution of the data the metric is measured on?
  *   **Good Answer:** "No, the data source is static or external."
  *   **Bad Answer:** "Yes, because the model changes what users see, which changes what they click." (This is distributional shift).
  *   **Action:**
      *   If **Bad Answer**: **CONDITIONAL PASS**. Requires an "Exploration Budget" (e.g., 5% of traffic must ignore the model to gather unbiased data) or a holdout set. If they cannot engineer a holdout, **REJECT** for auto-tuning.
      *   If **Good Answer**: **PASS**.

  ---

  # Procedure vs. Judgement Annotation

  You asked to know where the rules end and where you're just holding a clipboard. Here is the breakdown:

  | Step | Real Procedure (Hard Rules) | Judgement (Your Call) |
  | :--- | :--- | :--- |
  | **Intake** | If "True Goal" is missing, **Reject**. | Deciding if their one-sentence goal is actually the *real* goal or just a sub-goal. |
  | **Step 1** | If correlation < 0.6 (with data), **Reject**. | Deciding if their causal explanation is "plausible" when no data exists. |
  | **Step 2** | If they refuse a counter-metric, **Reject**. | Deciding if their proposed counter-metric is actually independent or just the same number twice. |
  | **Step 3** | If actors can see the signal, **No Training Loops**. | Deciding if an actor is "motivated" enough to game the system. |
  | **Step 4** | If no holdout/exploration, **No Auto-tuning**. | Estimating the cost of the holdout (is 5% traffic too expensive for them?). |

  **Note:** The "Real Procedure" parts are your shield. If a PM argues, you point to the rule. The "Judgement" parts are where you need to be sceptical.

  ---

  # Live Proposal Analysis

  Here is the procedure applied to your three tickets.

  ### 1. Internal Doc Search: Rank by Click-Through Rate (CTR)
  *   **True Goal:** Engineers find accurate information quickly.
  *   **Proposed Metric:** CTR on search results.
  *   **Step 1 (Causal):** *Pass.* Generally, if people click, they found something relevant. Historical data usually supports this.
  *   **Step 2 (Extremes):** *Fail.* If you optimise purely for CTR, the system will learn to serve clickbait titles (e.g., "YOU WON'T BELIEVE THIS BUG") or links to pages that *look* relevant but are empty. 100% CTR does not mean 100% solved problems.
      *   *Remedy:* Requires counter-metric (e.g., "Search Refinement Rate" or "Time on Page").
  *   **Step 3 (Adversary):** *Pass.* Internal engineers aren't actively trying to game the search engine to harm the company.
  *   **Step 4 (Feedback):** *Fail.* Ranking changes what people see, which changes what they click. This creates a feedback loop that narrows diversity.
      *   *Remedy:* Requires exploration (showing non-top results occasionally to learn).

  **Verdict:** **CONDITIONAL PASS.**
  *   **Why:** This is the one you likely thought was "fine". It is industry standard, *but* the procedure correctly identifies that CTR alone is dangerous for a ranking algorithm.
  *   **Requirement:** They must wire in a negative signal (e.g., "Did the user search again immediately after clicking?") and maintain an exploration budget. If they are just building a dashboard, it's a **PASS**. If this is for an auto-tuning ranking model, it is **CONDITIONAL** on the counter-metrics.

  ### 2. Code-Review Bot: Train on "Acceptance of Suggested Edit"
  *   **True Goal:** Higher code quality / faster review cycles.
  *   **Proposed Metric:** Percentage of bot suggestions accepted by developers.
  *   **Step 1 (Causal):** *Weak Pass.* Acceptance implies the suggestion was useful... usually.
  *   **Step 2 (Extremes):** *Fail.* If the bot achieves 100% acceptance, it implies it is never suggesting anything challenging. It will learn to suggest trivial changes (whitespace, variable renaming) that developers accept out of habit or laziness. The True Goal (quality) stagnates while the Metric maximises.
  *   **Step 3 (Adversary):** *Fail.* The developers are the adversaries here, unintentionally. They want to clear their inbox. They will accept bad suggestions to make the bot go away, or reject good suggestions if they are annoyed. The metric incentivises the bot to be "agreeable", not "correct".
  *   **Step 4 (Feedback):** *Fail.* The bot changes its suggestions based on acceptance, which changes developer behaviour.

  **Verdict:** **REJECT (for Training Loop).**
  *   **Why:** This is a textbook "Reward Hacking" scenario. Optimising for acceptance teaches the bot to pander.
  *   **Fix:** The training signal cannot be "Acceptance". It must be "Acceptance *and* no revert within 48 hours" or a human quality score on a holdout set. You cannot let the live acceptance rate drive the weights directly.

  ### 3. Fraud Model: Score on "Confirmed Fraud Caught" (Adversaries see declines)
  *   **True Goal:** Minimise financial loss from fraud.
  *   **Proposed Metric:** Count of transactions flagged as fraud that are later confirmed as fraud.
  *   **Step 1 (Causal):** *Pass.* Catching fraud reduces loss.
  *   **Step 2 (Extremes):** *Pass.* Catching more fraud is generally better, provided false positives are managed.
  *   **Step 3 (Adversary):** *Hard Fail.* The prompt states fraud rings can see which transactions got declined. This is **Adversarial Goodhart**. If they know *why* they were declined (because the model flagged them), they will adapt their pattern to avoid that specific signal. Furthermore, if the model is retrained on "Confirmed Fraud", it only learns about the fraud you *caught*. It becomes blind to new patterns you *missed*.
  *   **Step 4 (Feedback):** *Fail.* The environment is non-stationary because the adversary is actively learning from the model's output.

  **Verdict:** **REJECT.**
  *   **Why:** You cannot use a metric that the adversary can observe and adapt to as a training signal for an auto-tuning system. This creates an arms race where your model chases yesterday's fraud.
  *   **Fix:** You need a "Holdout Set" of transactions that are scored but not acted upon (or acted upon with randomised thresholds) to get an unbiased view of fraud that the adversaries *didn't* see flagged. You cannot train on the live feedback loop alone.

  ---

  # Summary for your Team

  1.  **Search CTR:** Fine for a dashboard. For auto-tuning, demand a "dissatisfaction" counter-metric.
  2.  **Code Bot:** Do not sign off. Acceptance is a vanity metric for quality. It incentivises triviality.
  3.  **Fraud Model:** Do not sign off. You cannot train on confirmed catches if the enemy sees the catches.

  **Final note on the "Fine" one:** If you thought the Code-Review Bot was the "fine" one, the procedure shows why it isn't. It looks fine on the surface (acceptance = good, right?), but under optimisation pressure, it collapses into a bot that suggests whitespace changes to keep its acceptance rate up. That is the value of the review: stopping the collapse before it ships.
