          *   *Risk:* Developers accepting bad code to make the bot look good, or bot suggesting trivial changes (whitespace) to get easy accepts.
          *   *Verdict:* High risk of Adversarial/Extremal Goodhart. Developers might game it to stop the nagging. Bot might optimize for triviality.
          *   *User's intuition:* "One of those I'm fairly sure is fine." Is it this one? Probably not. Training loops on acceptance are notorious for collapsing into triviality.
          *   *Wait, maybe the Search one is the "fine" one?* Search CTR is industry standard, despite flaws.
