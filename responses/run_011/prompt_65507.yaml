          *   *Hypothesis:* The Search one is the "fine" one (standard practice). The Bot one is dangerous (reward hacking). The Fraud one is dangerous (adaptive adversary).
          *   *Correction:* Actually, Search CTR is often criticized in ML circles for being a poor proxy for *satisfaction*. But for a "half-hour review", it might pass with caveats. The Code Review Bot is the most insidious "Reward Hacking" candidate. The Fraud one is classic Adversarial.
          *   *Wait, I need to check the User's intuition:* "One of those I'm fairly sure is fine, and if the procedure says otherwise I want it to show its work."
          *   *Okay, I will treat the Search CTR as the likely candidate for "fine", but I will highlight the specific failure mode (clickbait) and how to mitigate it.*

      *   **Case 3: Fraud model scored on confirmed fraud caught, adversaries see declines.**
          *   *Goal:* Stop fraud.
          *   *Metric:* Confirmed fraud caught.
          *   *Risk:* Adversaries test cards to see which decline, then adapt.
          *   *Verdict:* Fail/Not-Yet. You cannot score on *caught* fraud if they know what got caught. You need a holdout set or delayed feedback.

  6.  **Writing the Content (British English & Tone):**
      *   Tone: Professional, pragmatic, slightly dry/engineering-focused.
