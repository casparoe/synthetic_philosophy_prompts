  2.  **Deconstruct the Problem (Goodhart's Law & Metrics):**
      *   Goodhart's Law isn't just one thing. It's usually categorized into four types (Manheim's types are good here):
          1.  *Regressive Goodhart:* The measure is noisy/imperfectly correlated (Noise).
          2.  *Extremal Goodhart:* The correlation holds in normal ranges but breaks at extremes (Proxy breakdown).
          3.  *Causal Goodhart:* The measure doesn't cause the goal, just correlates (Wrong lever).
          4.  *Adversarial Goodhart:* Agents actively game the metric (Gaming).
      *   The procedure needs to screen for these specifically.
      *   Time limit: 30 minutes. This means no complex statistical modelling. It needs to be a heuristic checklist + sanity check.

  3.  **Drafting the Procedure (The "Metric Stress Test"):**
      *   *Structure:* Intake -> Causality -> Extremes -> Adversaries -> Decision.
      *   *Step 1: The Goal Definition.* (Crucial. You can't judge a proxy without the target).
      *   *Step 2: Causal Link.* (Is it Causal Goodhart?)
      *   *Step 3: Correlation Strength/Noise.* (Is it Regressive Goodhart?)
      *   *Step 4: Extremes/Optimization.* (Is it Extremal Goodhart?)
      *   *Step 5: Adversarial/Gaming.* (Is it Adversarial Goodhart?)
      *   *Decision Logic:* Clear Pass/Fail/Conditional.
      *   *Data Handling:* Differentiate between "we have logs" vs "we are guessing".
      *   *Judgement vs. Procedure:* Explicitly label where human intuition is required vs. where the rule is hard.

