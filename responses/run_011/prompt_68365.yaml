          *   *The Error:* Conflating a *directional hypothesis* with a *point prediction*. I can think debt matters without knowing if high debt causes collapse or resilience (e.g., leverage for growth).
      *   **Pricing the Alternatives:**
          *   *Keep (1) Outside View:* Cost: Must admit it's not an algorithm, it's a dialectic between model and data. Forbids: Claiming the base rate is "objective" or "view-from-nowhere."
