      *   *Fault Line B: The Definition of "Discipline" (5 $\to$ 6).* Even if priors influence class selection, the base rate can still *constrain* the credence. If the base rate is 90% and my prior is 10%, I have to do a lot of work to justify the deviation. It's not *no* check, just not an *absolute* check.
      *   *Fault Line C: The Equivocation on "Prior" (3).* There's a difference between a substantive causal theory (which is allowed) and a bare assertion of the specific outcome. The argument conflates having a model with having a verdict.
      *   *Fault Line D: The Self-Sealing Nature (8).* If the argument destroys all evidence, including itself, it's self-defeating. But the user asks if it's an a priori point exempt from empirical check.

      *Ranking:*
