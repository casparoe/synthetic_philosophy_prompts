      *   **Addressing (8) (Self-Sealing):** The argument is not a priori. It claims to be about empirical learning. If it destroys all evidence, it destroys the premises (which are based on observing forecasting practice). It is self-undermining.
      *   **Concrete Advice:** What should the group do?
