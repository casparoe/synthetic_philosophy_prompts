      *   *Refinement on (8):* The user asks if the exemption is available. I need to be clear: If it's a priori, it can't claim (7) about empirical history. If it's empirical, (8) kills it. It's a dilemma.

  6.  **Final Polish:** Check against the "no bibliography" rule. Ensure the distinction between "model" and "prediction" is clear. Ensure the advice on the "great power" question uses the philosophy developed. (e.g., Don't just pick "Regime Type," pick "Regime Type" AND "Debt" AND "Geography" and see where they disagree).

