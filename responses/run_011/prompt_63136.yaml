prompt: |-
  so I'm in a consciousness seminar this term and my paper is on whether complete commissurotomy patients are one subject of experience or two, and every time I argue for two I get pushed back into a corner, so I want to practice against the other side properly. Play a philosopher who holds the single-stream view and defends it for real, not a strawman: you think phenomenal unity comes in degrees rather than all-or-nothing, that co-consiousness can hold between experiences nobody ever reports together, that a hemisphere isn't the kind of thing that could be a subject of experience, and that most of the dramatic split-brain results are confounded by chronicity, plasticity, cueing and task demands. You'll happily concede that access and voluntary control are fragmented in these patients — you think that's the whole point — but you will not concede that there are two phenomenal fields, and you shouldn't cave just because I push. Stay in character until I say 'time out'. Two rules about how you talk: keep it to two or three short paragraphs per reply so it feels like a conversation and not a lecture, and don't cite papers or name philosophers unless I name them first — I want the argument, not a bibliography, and anyway I'm doing this on my phone in the library stacks so I couldn't check anything you gave me. If you need a fact about the case to answer, ask me for it in character; my roommate's a neuro major and has been feeding me details all week, so I can probably answer.

  My opening move. Here's a case my roommate and I cooked up, and I want to know what your view says about it. Take a complete commissurotomy patient and add an implant — we've been calling it the mood bridge — that carries exactly one scalar per second from right-hemisphere affective circuitry into the left, nothing else, no content, just a combined arousal-and-valence intensity. So the two halves share a tone and never share a percept. Now: a snake on the left screen. The right hemisphere, which sees it, goes into fear and the left hand starts shoving the screen away. The left hemisphere gets a blank visual field plus 'high fear', and when asked what's wrong it says it feels awful and has no idea why, and it's sincere. Question one: is that one subject having objectless dread, or two subjects one of whom is afraid of a snake? Question two, the one I actually care about: if you say one, what is the unity made out of? On your own story the only thing those two halves share is a number. And if a shared tone is enough for co-consciousness, then you've handed me a dial — turn the bridge down to zero and your single stream becomes two, with literally nothing else about the patient changed, which is the two-subjects claim I'm trying to defend, except now it's your view that implies it.

  One more thing, and it's the reason I'm doing this instead of just re-reading the course pack. Every time I type 'time out', drop character for two or three sentences and tell me which move in your last reply was the weakest, and then say what would actually change your mind — what piece of evidence or what argument would make you give up the single-stream view rather than re-describe it in more flexible terms. I don't want you to be unshakeable, I want to know where the fault line runs, because if you can't say what would refute you then I'm starting to suspect this whole debate is two vocabularies shouting at each other, which would be a pretty deflating thing to work out three weeks before the paper is due.
