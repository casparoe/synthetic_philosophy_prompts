answer: |-
  # Week One Diagnostic: The Comparison Intuition Inventory

  **Instructions:** Read each scenario quickly. Circle the option that matches your gut reaction *before* you think about what a professor would want. There are no right answers. Do not overthink.

  **1. The Water System vs. The Execution Squad**
  Regime A knowingly understaffs water treatment to save money; 50,000 die of disease over five years. Regime B orders execution squads to shoot dissidents; 5,000 die over five months.
  *   (A) Regime A is worse; more people are dead.
  *   (B) Regime B is worse; the killing was the point.
  *   (C) They are different kinds of bad; you can't put them on one scale.

  **2. The Embargo vs. The Massacre**
  Country X imposes a trade embargo foreseeing mass starvation. Country Y sends soldiers to shoot civilians in a town square.
  *   (A) Both are mass killings; the mechanism doesn't change the rank.
  *   (B) The shooting is a crime; the embargo is a policy failure. Different categories.
  *   (C) The embargo is worse; it hides the killing behind paperwork.

  **3. The Museum Wall**
  You are designing a memorial wall listing ten 20th-century atrocities.
  *   (A) List them by death toll, highest to lowest.
  *   (B) List them chronologically or by region.
  *   (C) Do not list them together at all; give each its own space.

  **4. The Public Commemoration**
  At a ceremony, a moderator asks: "Was Event A worse than Event B?"
  *   (A) Answer directly based on the evidence.
  *   (B) Refuse to answer; the question is inappropriate here.
  *   (C) Answer, but clarify that "worse" depends on what you measure.

  **5. The Grandparent Test**
  You are asked to rank Event A (your grandparents were victims) against Event B (strangers were victims).
  *   (A) My personal connection doesn't change the objective ranking.
  *   (B) I cannot rank this objectively; my pain makes me partial.
  *   (C) I must rank this; an outsider would miss the truth of Event A.

  **6. The Silence Strategy**
  Activists argue we should stop comparing atrocities because it insults the dead.
  *   (A) They are right; comparison turns pain into data.
  *   (B) They are wrong; silence lets perpetrators deny their crimes.
  *   (C) They are partly right; compare privately, not publicly.

  **7. The Forgotten Catastrophe**
  Event A is famous worldwide. Event B had the same death toll but is now forgotten.
  *   (A) Event B is worse; to die and be forgotten is a second death.
  *   (B) They are equally bad; memory doesn't change the bodies.
  *   (C) Event A is worse; the ongoing social damage makes it heavier.

  **8. The Threshold**
  Event A killed 1 million systematically. Event B killed 1.2 million systematically.
  *   (A) Event B is worse.
  *   (B) Both are "The Worst"; the difference is noise.
  *   (C) Event B is worse, but the distinction is politically useless.

  **9. The Policy Trade-off**
  Comparing two events will help pass a law preventing future harm, but it will offend survivors.
  *   (A) Pass the law; preventing harm matters most.
  *   (B) Do not compare; respecting survivors matters most.
  *   (C) Find a third way; the dilemma is false.

  ***

  # Scoring Key: The Logical Tree

  Do not count points yet. This key maps your answers to a conceptual tree. The tree has three branches (Dimensions). Your answers place you on a branch; where you stand on all three determines your **Leaf**.

  ### Dimension 1: The Metric (Questions 1, 2, 8)
  *   **Mostly A:** **Quantitative.** You believe badness sits on a single scale, and numbers dominate.
  *   **Mostly B:** **Qualitative.** You believe intent, kind, or structure changes the nature of the badness.
  *   **Mostly C (on Q8 specifically):** **Threshold.** You believe past a certain magnitude, ranking becomes idle.

  ### Dimension 2: The License (Questions 4, 5, 6)
  *   **Mostly A:** **Universalist.** You believe comparison is a duty; standpoint doesn't invalidate truth.
  *   **Mostly B:** **Restrictionist.** You believe comparison is often forbidden (by context, identity, or dignity).
  *   **Mostly C:** **Contextualist.** You believe comparison is possible but depends on who asks and where.

  ### Dimension 3: The Consequence (Questions 3, 7, 9)
  *   **Mostly A:** **Consequentialist.** The value of comparison lies in what it *achieves* (policy, truth, memory).
  *   **Mostly B:** **Deontological.** The value lies in what it *respects* (dignity, the dead, the truth itself).
  *   **Mostly C:** **Pluralist.** You see the trade-off but resist the binary choice.

  ***

  ### Mapping to Leaves

  Combine your dominant倾向 (Tendency) from each Dimension to find your Leaf.

  **1. The Actuary (Metric: Quantitative + License: Universalist)**
  *   **View:** Badness is commensurable. The tally settles it.
  *   **Gut:** You chose A on Q1, A on Q4, A on Q8.
  *   **Philosophical Kin:** Benthamite Utilitarians; some demographic historians.

  **2. The Cartographer (Metric: Qualitative + License: Contextualist)**
  *   **View:** You will compare along dimensions (intent, structure, scale) but refuse to produce a single "winner."
  *   **Gut:** You chose C on Q1, C on Q4, C on Q3.
  *   **Philosophical Kin:** Isaiah Berlin (Value Pluralism); comparative historians.

  **3. The Threshold Guardian (Metric: Threshold + License: Universalist)**
  *   **View:** There is a scale, but past a certain point, everything is "The Worst." Further ordering is idle.
  *   **Gut:** You chose B on Q8, A on Q1, A on Q4.
  *   **Philosophical Kin:** Lexical prioritizers; some theological ethicists.

  **4. The Mourner (License: Restrictionist + Consequence: Deontological)**
  *   **View:** The act of ranking wrongs the victims in itself, quite apart from consequences.
  *   **Gut:** You chose B on Q4, B on Q6, B on Q9.
  *   **Philosophical Kin:** Levinasian ethicists; some trauma theorists.

  **5. The Prosecutor (License: Universalist + Consequence: Consequentialist)**
  *   **View:** Refusing to rank is the more dangerous practice because it shields harms still going on.
  *   **Gut:** You chose A on Q6, A on Q9, A on Q4.
  *   **Philosophical Kin:** Political consequentialists; human rights legalists.

  **6. The Archivist (Metric: Qualitative + Consequence: Consequentialist on Memory)**
  *   **View:** An atrocity nobody remembers is worse (or differently bad) because the social death completes the killing.
  *   **Gut:** You chose A on Q7, B on Q1, A on Q3.
  *   **Philosophical Kin:** Memory studies scholars; marginal historians.

  **7. The Uniqueness Claimant (Metric: Qualitative + License: Restrictionist)**
  *   **View:** Some one atrocity is non-comparable in kind rather than merely very bad.
  *   **Gut:** You chose C on Q1, B on Q3, B on Q4.
  *   **Philosophical Kin:** Singularists; some genocide scholars (e.g., Holocaust uniqueness debates).

  ***

  ### The Unoccupied Cell: The Retrospective Eraser
  *   **Logical Position:** Metric: Quantitative + Consequence: Memory Reduces Badness.
  *   **The View:** "If an atrocity is forgotten, it is objectively *less bad* than one remembered."
  *   **Why Empty:** This cell is empty not because it is incoherent (one could argue harm requires a subject to experience the loss), but because **nobody wants to be seen holding it.** It is morally repugnant to admit that oblivion reduces the weight of a crime. Students may feel it, but they will not circle the option.

  ***

  # Meta-Analysis for the TA

  ### 1. Indistinguishable Leaves
  **The Mourner** and **The Uniqueness Claimant** are difficult to pull apart with this instrument. Both refuse to rank (License: Restrictionist) and both prioritize the specific nature of the event (Metric: Qualitative).
  *   *Why:* A student who says "You can't compare the Holocaust" might mean "It is a unique kind" (Uniqueness) or "Comparing insults the dead" (Mourner).
  *   *Fix:* In seminar, probe the *reason* for their refusal. If they cite pain/dignity, they are a Mourner. If they cite historical structure/industrialization, they are a Uniqueness Claimant.

  ### 2. The "Most Work" Question
  **Question 1 (The Water System vs. The Execution Squad).**
  *   *Why:* This question does the heaviest lifting in separating the **Actuary** from everyone else. It forces a choice between outcome (numbers) and intent (kind). Almost every other dimension flows from whether the student believes a negligent death counts the same as a murdered death. If they say "Yes" (A), they are likely Actuary or Prosecutor. If they say "No" (B or C), they open the door to Pluralism, Thresholds, or Uniqueness.

  ### 3. Confidence Assessment
  **Confidence:** High on the **Actuary** and **Prosecutor** leaves; Moderate on the **Mourner** and **Cartographer**.
  *   *Reasoning:* Students are usually clear on whether they prioritize numbers or consequences. They are often muddier on whether their refusal to compare is based on *principle* (Mourner) or *methodology* (Cartographer). The diagnostic sorts the "What" well, but the "Why" sometimes bleeds between leaves.

  ### 4. The Contentious Leaf Assignment
  **The Mourner (Leaf 4).**
  *   *Suspicion:* I suspect many students who land here will refuse to accept the label. They will say, "I'm not against comparison; I just think *this* comparison is bad."
  *   *The Conflict:* The diagnostic classifies a principled refusal to compare as a "Mourner" stance. However, students often view this as a "Political" stance (i.e., "I refuse because it helps the enemy," which is actually the **Prosecutor** view in reverse).
  *   *Prediction:* A student might answer B on Q6 (Silence protects dignity) but A on Q9 (Prevent harm). This splits them between Mourner and Prosecutor. In person, they will likely argue that "Refusing to rank *is* the way to prevent harm," collapsing the distinction. Be prepared for them to reject the binary between "Dignity" and "Safety."
