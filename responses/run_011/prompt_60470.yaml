  **Auntie Hinge's Saturday Solace.** *Life feels solid until you lean on it. I offer no solutions, only dissolutions. Many seek proof where only habit resides. In this corner of the county, we know some things are too certain to be said. Write to me if your world has gone wobbly.*

  **Dear Auntie,** my husband has got it into his head that he cannot rule out that we were all created five minutes ago, complete with false memories. He says it ruins the point of planning for next week. He won't carve the roast because 'who knows if the knife exists'. Sunday lunch is entirely stalled and the children are crying.

  **Dear Stalled,** your husband mistakes the framework for a fact. To doubt whether the world began five minutes ago requires a ground outside time, which we do not have. This isn't knowledge he lacks; it is the scaffolding upon which knowledge hangs. If he truly doubted the knife, he would not fear cutting himself. His certainty shows in his flinch, not his speech. We treat such things as certain not because we have checked them, but because checking presupposes them. Tell him the pudding is burning. That urgency is realer than his hypothesis. We do not prove the world exists; we live in it. Let the carving resume. The act of eating dissolves the question.

  **Dear Auntie,** I have picked up some hinge epistemology at a book club and taken it as a licence. Since nothing is ultimately grounded, I have decided to adopt a new hinge that my business partner is embezzling from me. It suits my mood. Is this allowed?

  **Dear Experimenter,** you treat hinges like hats, something to try on for size. But hinges are not chosen; they are what hold the door. You do not choose your nerve endings, nor do you choose the bedrock where your spade is turned. Adopting a suspicion without cause is not philosophy; it is paranoia dressed as insight. Yet, do not ask me for proof he is honest. There is no ultimate justification for trust. It is simply where your life begins. To treat a hinge as a choice is to misunderstand its function. It must hold fast for anything else to move. Do not play with the foundation unless you wish the house to fall. Put the hinge back.

  **Dear Auntie,** my brother is convinced the council is faking the new bypass as cover for something else. No amount of showing him the planning documents, the contractors' invoices or the actual hole in the ground makes any difference. He says it's all props. I am utterly exhausted trying to prove reality to him.

  **Dear Exhausted,** you pile evidence onto a fire that burns evidence as fuel. To him, the invoices are part of the props. Showing more documents assumes you share a world, which you currently do not. I cannot tell you how to bridge this, because language runs out here. When the riverbed shifts, the water loses its channel. However, do not mistake his confusion for a valid alternative framework. Some riverbeds dry up; that does not make them new rivers. You cannot argue him into sense. Stop showing him the ground. Just walk on it yourself. Leave him there. It leaves everything as it is, but you must not grant his madness equal standing.

  *Yours in groundless certainty, Auntie Hinge.*
