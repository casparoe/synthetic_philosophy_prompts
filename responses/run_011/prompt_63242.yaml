answer: |-
  The air in Conference Room 4 was recycled too many times, tasting of stale coffee and ionized dust. Outside the thick glasteel, the docking rings of the Station rotated silently, bridging the gap between the blue marble and the green one. Thirty years since the First Hail, and they were still arguing about the wet stuff.

  Elias rubbed his temples. Across the table, Mara sat perfectly still. She was Twin-born, skin slightly more porous to handle the higher humidity of her home world, but her English was flawless. She'd learned it from Earth tutors at age ten, after the contact protocols were established.

  Vance, the Chief Adjudicator, tapped a stylus against the table. "Let's strip it down. The *Kaelen* contract. Clause 4, Section B. 'Seller guarantees delivery of pure Water.' Kaelen is Twin-born. He delivered XYZ. The Earth buyer rejected it. Machinery corroded. Kaelen is bankrupt. He wants his payment."

  "He delivered what he calls water," Mara said. Her voice was calm, but her hands were clasped tight. "On my world, the lakes are XYZ. The rain is XYZ. When I say 'water', I feel the weight of that liquid in my throat. Why should the word care about where it came from? It cares about what quenches."

  Vance nodded slowly. "This is the practical view. The word is a hook. It catches whatever is swimming in the pond beneath your feet. If you stand on Twin Earth, the hook catches XYZ. If you stand on Earth, it catches H2O. The history of the word—who taught it to you, where the sound originated—that's ghost stuff. It doesn't change the chemistry in the cup."

  Elias leaned forward. "So if I sign a contract here on the Station, what do I get? Station recycled urine? Or does the word reach out?"

  "The word reaches to the ground," Vance said. "It's stable. It prevents confusion. If I order 'grain' on a wheat planet, I get wheat. If I order it on a rice planet, I get rice. I don't get wheat shipped from halfway across the galaxy unless I specify 'Imported Wheat'. Why is water different? Kaelen sold local water. The buyer assumed Earth water without writing it down. That's the buyer's fault."

  It was a seductive argument. It made trade simple. It respected the local reality. If words only pointed to what was physically present, contracts would be grounded in the tangible world, not in invisible chains of history stretching back to a baptism on a different planet. Mara looked relieved. If Vance ruled this way, Kaelen survived. The word belonged to the speaker's environment, not their teacher's voice.

  "But consider the *Medicore* case," Elias said softly.

  Vance sighed. "The insulin shipment."

  "Same contract language. 'Dissolve in sterile Water.' The doctor was Twin-born, learned English from Earth manuals. He used XYZ. The patients died. XYZ reacts with the protein; H2O doesn't." Elias slid a datapad across the table. "If Vance is right, the doctor did nothing wrong. He used the word 'water' as it applies on his ground. The word picked out XYZ. The contract was fulfilled."

  Mara flinched. "He killed them?"

  "The contract assumed the word carried the Earth standard," Elias said. "Because the manual was Earth-made. The word traveled from Earth to Twin Earth in those books. It carried its anchor with it. If the word just latches onto whatever liquid is nearby, then medical trade is impossible. You can't import a cure if the word for the solvent changes the moment you cross the border."

  Vance stopped tapping the stylus. The simplicity of his view cracked. If the word only caught the local liquid, then a Twin Earthling couldn't ever order Earth supplies using Earth words. They would always receive local substitutes, even when ordering specific imports. The chain of usage mattered. When Mara learned the word from her tutors, she didn't just learn a sound; she stepped into a river that started on Earth. When she said "water," she was drawing from that river, even if the cup in front of her held something else.

  "So history matters," Mara whispered. "If I learned it from you, I promise H2O. Even if I'm standing in a lake of XYZ."

  "If you use the trade tongue," Elias said. "If you use your native tongue, you promise XYZ. But you signed an Earth-standard contract."

  Vance looked at the *Kaelen* file again. Kaelen had signed an Earth-standard contract. But he had sourced locally. If the word meant H2O, he was in breach. If it meant XYZ, the contract was impossible to fulfill as written because the buyer expected H2O.

  "We can't rule on Kaelen based on philosophy," Vance muttered. "We need a definition. We need to write the Joint Lexicon. We settle the word now, so the next ten thousand contracts don't bleed."

  They worked for hours. The sun set over the Earth curve outside. They argued over purity, over isotopes, over source. Vance wanted to define it by function: "The clear liquid used for hydration." Mara pointed out that XYZ hydrated better than H2O for Twin-born biology. Elias insisted on chemical structure. But a contract couldn't require every farmer to run a mass spectrometer.

  They needed a word that bridged the gap without breaking the bank. They needed to decide if the word belonged to the speaker or the stuff.

  Finally, Vance typed the draft entry. He pushed the screen toward the center of the table. It was the best they could do. A compromise that would hold until the next lawsuit.

  "Read it," Vance said.

  Elias read it aloud. "Water: The clear, potable liquid substance standard to the buyer's region, unless otherwise specified as imported."

  "That doesn't solve the *Medicore* case," Elias said.

  "It solves the grain problem," Vance countered.

  "It kills the patients," Mara said.

  "Then change it."

  They typed again. Deleted. Retyped. The cursor blinked like a heartbeat. The financial ruin of Kaelen hung in the room, heavy as lead. If they defined it one way, he was a fraud. If they defined it the other, he was a victim of linguistic ambiguity. The word itself was the weapon.

  Finally, Vance leaned back. "This is it. We submit this to the Council. Let them break their heads on it."

  He saved the file. The dictionary entry glowed on the main screen, the final authority for all future trade agreements between the worlds.

  **ENTRY 492-B: WATER**
  **DEF:** The universal solvent required for biological continuity, chemically consistent with the **origin** of the contracting party.

  Elias stared at the last word. Mara stared at it. Vance turned off the screen.

  "Origin," Mara said.

  "Does that mean where the liquid came from," Elias asked, "or where the speaker was born?"

  Nobody answered. The room went dark.
