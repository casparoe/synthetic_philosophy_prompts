answer: |-
  This is a classic debate in evolutionary biology, essentially pitting the **Major Transitions** framework (your friend) against the **Gene-Centered/Multi-Level** framework (you). Your friend is arguing that once a group achieves a certain level of integration, it *becomes* an individual, rendering lower-level selection irrelevant. You are arguing that the lower-level mechanics (conflict, genetic variance) still matter and define the boundaries of that individuality.

  Here is the audit of both analogies, broken down by correspondence, structural integrity, and hidden assumptions.

  ### Audit 1: The Honeybee Colony = A Body

  Your friend is invoking the "Superorganism" concept. This is a powerful heuristic, but it treats the *outcome* of evolution as the *starting condition*.

  **Correspondence Table**

  | Analogy Part | Biological Target | Function |
  | :--- | :--- | :--- |
  | **The Body** | The Colony | The unit of survival/reproduction |
  | **Germline** | The Queen | Reproduction |
  | **Soma** | The Workers | Maintenance/Foraging/Defense |
  | **Gametes** | The Swarm | Dispersal/Replication |
  | **Death** | Colony Collapse | End of fitness |
  | **Immune System** | Worker Policing | Suppressing internal conflict |

  **Disanalogies: Decoration vs. Biting**

  *   **Decoration (Ignore these):**
      *   **Scale/Complexity:** A body has more cell types than a hive has castes. (Irrelevant to selection logic).
      *   **Physical Connection:** Somatic cells are physically attached; workers are not. (Eusocial insects trade physical attachment for behavioral attachment).
      *   **Lifespan:** Queens live longer than most mammals; colonies can last indefinitely. (Time scale doesn't change selection pressure).

  *   **Biting (These break the analogy):**
      *   **Genetic Homogeneity:** Somatic cells are clones (barring mutation). Workers in a polyandrous hive (queen mates with multiple males) are **half-sisters** ($r = 0.25$) or full sisters ($r = 0.75$). They are not genetically identical. This creates a mathematical incentive for workers to lay their own eggs rather than rear the queen's, which never happens in a healthy liver.
      *   **The "Soma" Reproduces:** In a body, somatic cells generally do not reproduce independently. In a hive, workers *can* lay eggs (male drones). The fact that they need **worker policing** (other workers eating the eggs) proves the "body" is not a seamless unit; it is a negotiated peace treaty.
      *   **The Boundary Problem (Supercolonies):** In unicolonial ants (e.g., Argentine ants), colonies do not bud; they expand and merge. There is no "swarm" event. If there is no discrete reproduction event, the "body" analogy dissolves into a continuous mat of organisms. Where is the "individual" there?
      *   **Developmental Bottleneck:** Bodies start from a single cell (zygote), ensuring genetic alignment. Colonies start from a queen + sperm + often a workforce. The lack of a single-cell bottleneck means conflict is inherent, not accidental.

  **Quiet Import:**
  This analogy imports **Conflict Suppression.** It assumes the colony *already has* a single fitness number. In reality, the colony *achieves* a single fitness number only through active, costly mechanisms (policing, pheromonal control). By calling it a "body," your friend assumes the problem of within-group selection is solved, rather than identifying it as the variable under investigation.

  **Verdict:**
  **Does it survive?** No, not as a strict identity. It survives only as a *functional description* of a specific endpoint in evolution. It fails to explain *how* that individuality is maintained against the pressure of lower-level selection (the workers' genes).

  ***

  ### Audit 2: The Genome = A Rowing Crew

  This analogy attempts to explain why genes cooperate within an organism rather than competing destructively.

  **Correspondence Table**

  | Analogy Part | Biological Target | Function |
  | :--- | :--- | :--- |
  | **The Boat** | The Organism/Genome | The vehicle of selection |
  | **The Crew** | The Genes | The agents of action |
  | **The Race** | Survival/Reproduction | The test of fitness |
  | **The Coxswain** | Developmental Regulation | Coordination |
  | **The Finish Line** | Passing on Genes | Success |

  **Disanalogies: Decoration vs. Biting**

  *   **Decoration (Ignore these):**
      *   **Consciousness:** Rowers know they are racing; genes do not. (We accept this as metaphorical).
      *   **Physical Proximity:** Rowers sit next to each other; genes are on different chromosomes. (Linkage matters, but physical adjacency isn't the key).

  *   **Biting (These break the analogy):**
      *   **Team Permanence:** A rowing crew stays together for the season. A genome is **shuffled every generation** via recombination. The "crew" that races today is broken up tomorrow. Your friend's analogy implies a permanent partnership; biology is a temporary coalition.
      *   **The "Rogue Rower" (Selfish Elements):** In a crew, if one rower sabotages the boat, they lose too. In a genome, **meiotic drive** or **transposons** can increase their own frequency *by* reducing the boat's speed (organism fitness). A gene can win the internal race while sinking the boat.
      *   **The Coxswain Problem:** A crew has a coach and a coxswain enforcing synchronization. In evolution, there is no central coordinator. Coordination emerges solely from past selection. If a "rogue rower" gene appears, there is no coxswain to fire them unless another gene evolves to suppress them (intragenomic conflict).
      *   **The Pool vs. The Boat:** As you noted, the real unit persisting through time is the **Gene Pool**, not the specific boat. The boat is a temporary testing ground. Selection on the "crew" (genome) is weak if the crew disbands immediately after the race.

  **Verdict:**
  **Does it survive?** No. The recombination issue is fatal to the "crew" analogy. A crew implies a shared fate over time. Genes share a fate only temporarily. This is why "selfish gene" theory persists: because the gene is the only thing that remains in the boat race long-term.

  ***

  ### The "Pseudo-Question" Verdict

  Your friend's conclusion—that "genes or groups?" is a pseudo-question because we just look for the "body"—is **incorrect.**

  It is not a pseudo-question; it is an **empirical question about variance.**
  *   If most variance in fitness is between colonies, group selection dominates.
  *   If most variance is between genes/individuals within colonies, individual/gene selection dominates.

  By defining the colony as a "body," your friend is defining away the variance. He is saying, "If we call it an individual, then selection acts on the individual." This is circular. The hard work of evolutionary biology is determining *when* and *why* a group acquires the properties of an individual (fitness monotonocity).

  **What the analogies import:**
  1.  **Hive=Body** imports **Harmony.** It assumes conflict is zero. (Reality: Conflict is suppressed, not zero).
  2.  **Crew=Genome** imports **Permanence.** It assumes the team stays together. (Reality: Recombination breaks the team).

  Once you pay for these imports (i.e., acknowledge conflict exists and teams dissolve), the "pseudo-question" collapses. You are back to weighing the strength of selection at Level A vs. Level B.

  ***

  ### A Better Analogy: The Franchise Corporation

  To resolve this, stop looking for "Organisms" and start looking for **Governance Structures.**

  **The Hive is a Franchise Business.**
  *   **HQ (Queen):** Holds the IP and brand.
  *   **Local Branches (Workers):** Execute the work.
  *   **Franchise Agreement (Genetics):** Branches are contractually obligated to serve HQ.
  *   **Audit Department (Worker Policing):** Ensures branches don't go rogue (lay eggs).
  *   **Expansion (Swarming):** Opening a new branch.

  **Why this works better:**
  1.  **Conflict is Expected:** In a franchise, the local branch *might* try to cut corners to save money (worker laying eggs). The analogy accommodates the need for policing/auditing.
  2.  **Boundary Issues:** Some franchises merge or operate informally (Supercolonies). You can have a "corporate entity" that is fuzzy without breaking the analogy.
  3.  **No Magic:** It doesn't assume the branch *wants* to serve HQ; it assumes the contract (evolutionary history/relatedness) makes it in their interest to do so, unless they can cheat.

  **The Genome is an Open-Source Project.**
  *   **The Codebase (Phenotype):** The functional product.
  *   **Contributors (Genes):** Submit code (alleles).
  *   **Version Control (Recombination):** Every release (generation), code is pulled from a central repository, mixed, and tested.
  *   **Bugs (Selfish Elements):** Some code might boost its own commit history while crashing the program.
  *   **Maintainers (Regulatory Network):** Try to keep the build stable.

  **Why this works better:**
  1.  **Turnover:** Contributors come and go (recombination). The "team" isn't permanent.
  2.  **Conflict:** A contributor can submit code that benefits their specific module but breaks the whole build (meiotic drive).
  3.  **Selection:** The "project" survives if the build works, but specific "contributors" (genes) survive if their code gets merged into the main branch repeatedly.

  ### Final Call

  Tell your friend this:
  The "Body" and "Crew" analogies describe the **endpoint** of a Major Transition. They are useful for describing what a highly integrated colony or genome *looks like* after millions years of conflict suppression.

  However, they are useless for explaining **how** that integration happens or how stable it is. By treating the "individual" as a static object rather than a dynamic equilibrium of conflicting interests, he is ignoring the very mechanism (selection) that created the structure in the first place.

  The question isn't pseudo. It's about **leverage.** When does the leverage of the group outweigh the leverage of the gene? That changes from species to species, and even from trait to trait. The "Body" analogy is a conclusion, not an argument. Don't let him pass it off as proof.
