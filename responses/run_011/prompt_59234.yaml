  2.  **Deconstruct the Problem:**
      *   *Why did it fail before?* Too short, too abstract, immediate backward induction.
      *   *How to fix?* Need to make the "rational" choice feel *wrong* before revealing the logic. Need to make the stakes feel real but clean. Need to highlight the contradiction between the logic and the observed reality without dismissing the logic.
      *   *Structure:* 45 minutes.
      *   *Word Count:* Strict limit (<500 words).

  3.  **Drafting - Section by Section:**

      *   **Order/Structure:** Don't start with the logic. Start with the play. If you explain the rules and logic first, they solve it intellectually. If they play it first, they feel the tension.
      *   **Stakes:** Money is okay, but needs to be tangible. However, the prompt asks about everyday versions. Real-life analogies often smuggle in reputation/repeat play. The game requires *one-off, anonymous, clear rules*. Stick to money but make it significant enough (fake but tangible) or use points redeemable for something. Actually, the user asked "whether money is even the right stakes." Advice: Keep it money/points but *play it live*. Analogies fail because they add context.
      *   **The Reveal:** When to say "people don't do this"? After they play and predict, but before you explain the backward induction fully.
      *   **The "Eats Itself" Point:** Focus on trust vs. logic. If we reached round 50, the logic that said "stop at 1" was wrong.
