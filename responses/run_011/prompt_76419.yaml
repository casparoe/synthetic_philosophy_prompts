answer: |-
  # Q&A PREP SHEET: Psychiatry Research Seminar

  **Strategy:** You are not selling metaphysics; you are selling instrument maintenance. You are an engineer telling the pilots that the altimeter needs recalibration because the air pressure has changed, not that the mountain isn't real.

  **Forbidden Vocabulary:**
  *   Do **not** say: "Social construction," "Ontological," "Real vs. Unreal," "Artifact," "Illusion."
  *   **Use instead:** "Interactive kind," "Feedback dynamics," "Classification-dependent prevalence," "Instrument drift," "Calibration substrate."

  **The First 90 Seconds (The Concession):**
  Start every answer by validating the utility of stability. "You are right that longitudinal comparability is essential for tracking population health..." or "I agree that measurement invariance is the gold standard for psychometrics..." This disarms the fear that you want to burn down the DSM or break their datasets. You are proposing *better* stability, not less.

  **The One Reply That Must Land:**
  **Question 2 (Measurement Invariance).** If you cannot distinguish *loop debt* from standard *measurement error*, the health economist is right: this is just noise you're rebranding. You must convince them that the target itself moves, not just the arrow.

  ---

  ### 1. The Health Econ Objection (Highest Damage)
  **Q:** "If you periodically re-anchor criteria on new populations, you break longitudinal comparability. I model cost-effectiveness over decades. If the definition of 'depression' changes every five years because of re-anchoring, I can't track outcomes or allocate resources. Isn't the cost of broken time-series data higher than the cost of criteria drift?"

  **Reply:** "That's the right trade-off to highlight. Currently, we prioritize *nominal* stability—the label stays the same—while accepting *predictive* decay. My proposal flips that. Yes, you lose a clean time series of the *label*, but you gain a clean time series of *treatment response*. Right now, your models assume a patient diagnosed in 2024 is the same as one in 2014. Loop debt suggests they aren't; the 2024 patient has been screened by different cultural tools. If we re-anchor, we report the 'drift statistic' alongside the diagnosis. You can model the drift. It's better to model a known calibration shift than to model treatment failure assuming a stable construct that isn't there."

  **Soft Spot:** You are asking them to do more work (modeling the drift). They will hate the administrative burden.
  **Concession:** Admit that for *service eligibility*, grandfathering is necessary, even if *research criteria* shift.

  ### 2. The Psychometric Objection (Critical)
  **Q:** "We already test for measurement invariance across waves in longitudinal cohorts. If the factor structure holds, the construct is stable. If it doesn't, we modify the model. How is 'loop debt' distinguishable from a simple failure of invariance that we already know how to handle statistically?"

  **Reply:** "Measurement invariance tests assume the *construct* is fixed and ask if the *items* load differently. Looping changes the construct itself because the population changes behavior in response to the items. Invariance testing detects the break; it doesn't explain the mechanism or offer a reset. If I test for invariance on a population that has already been looped, I'm just measuring how well the label fits the adapted behavior. Re-anchoring isn't a statistical fix; it's a sampling fix. We need a 'naive' sample to see if the factor structure holds without the feedback loop. Invariance testing on looped data just tells you the loop is consistent, not that the category is valid."

  **Soft Spot:** Finding a truly "naive" sample is incredibly hard.
  **Concession:** Acknowledge that total naivety is an ideal, but even 'less exposed' samples (e.g., younger cohorts) improve signal-to-noise.

  ### 3. The "Prayer Question" (Metaphysical Trap)
  **Q:** "If you re-anchor on a population that hasn't been classified, you're assuming there's a classification-independent cluster of symptoms waiting to be found. Doesn't that collapse your view into the very realism you're arguing against? What exactly are you calibrating *against* if not the 'real' disorder?"

  **Reply:** "I'm not calibrating against a 'real disorder' in the metaphysical sense. I'm calibrating against *predictive utility for naive subjects*. Think of it like a thermometer. We don't need to know the 'essence' of heat to check if the thermometer works on a new batch of mercury. We just need to know if it predicts expansion consistently. I am assuming there is a *pre-classification behavioral substrate*—people suffering, struggling, or behaving in ways that draw clinical attention. I'm not claiming that substrate is a natural kind. I'm claiming it's a more stable target for prediction than the *post-classification* substrate, which has been modified by the treatment and the label itself."

  **Soft Spot:** This walks a razor's edge. If pressed, you must admit you are a pragmatic realist, not an anti-realist.
  **Concession:** "I am assuming there is *something* causing the distress, even if our categories are just tools to manage it."

  ### 4. The Secular Trends Objection
  **Q:** "Prevalence changes over time for many reasons—war, economic stress, opioid crises. How do you distinguish 'loop debt' (people changing because of the label) from ordinary secular trends in prevalence (people changing because of the world)?"

  **Reply:** "We distinguish them by looking at the *symptom profile*, not just the rate. Secular trends usually shift the severity or the comorbidity profile (e.g., more substance use during an economic crash). Looping shifts the *presentation* to match the criteria (e.g., patients learning to report 'anhedonia' because they know it counts toward depression). If we see the prevalence rise but the symptom network structure becomes *more* aligned with the DSM checklist over time, that's looping. If the structure fragments or shifts externally, that's secular trend. Re-anchoring helps us see the baseline structure before the checklist alignment happens."

  **Soft Spot:** Disentangling symptom alignment from actual symptom change is empirically messy.
  **Concession:** Admit this requires rich qualitative data, not just checklists.

  ### 5. The Clinical Pragmatist Objection
  **Q:** "I work in schools. The label unlocks the aide, the tutoring, the insurance coverage. If you tell me the criteria are going to shift every five years to 're-anchor,' I'm telling parents their child might not qualify next year for the same behavior. How is this not ethically untenable?"

  **Reply:** "This is the most important constraint. My proposal applies to *research classification* and *epidemiological tracking*, not necessarily to *service eligibility*. We can decouple the two. In fact, keeping them coupled is part of the problem—it incentivizes gaming the diagnostic criteria to keep the services. If we treat the research category as an instrument that needs maintenance, we can keep the service criteria stable for continuity of care, while acknowledging that the research category is drifting. We stop pretending the billing code is a scientific truth."

  **Soft Spot:** Clinicians hate dual systems (research vs. clinical). It creates confusion.
  **Concession:** Acknowledge the administrative nightmare but argue it's better than clinical decisions based on drifted science.

  ### 6. The Feasibility Objection
  **Q:** "Where do you actually find these 'unexposed' populations? In a globalized health system, psychoeducation is everywhere. Even a birth cohort is screened by pediatricians. Isn't the 'naive sample' a fantasy?"

  **Reply:** "It's a gradient, not a binary. We don't need a population that has never heard the word 'depression.' We need a population where the *specific diagnostic criteria* aren't the gatekeeper for resources. A health system in a different jurisdiction, a historical cohort before the criteria changed, or a primary care sample where screening is unselected rather than help-seeking. The goal isn't purity; it's *less contamination*. Even a 10% reduction in loop exposure gives us a better calibration point than 100% exposure."

  **Soft Spot:** "Less contamination" is hard to quantify.
  **Concession:** Admit this requires international collaboration and data sharing, which is politically hard.

  ### 7. The Treatment Validity Objection
  **Q:** "You say this improves prediction. But if the category changes, the evidence base for treatment fractures. If 'Depression-2030' is calibrated differently than 'Depression-2020,' do I need new RCTs for every re-anchor? That's unsustainable."

  **Reply:** "Not new RCTs for everything, but we stop assuming transportability. Currently, we assume a drug that worked on the 1990 calibration works on the 2024 calibration. Loop debt suggests that might be false because the 2024 group includes people who are 'professional patients' in a way the 1990 group wasn't. Re-anchoring allows us to test if the treatment effect size holds across calibrations. If it does, great, the treatment is robust. If it doesn't, we need to know that. It prevents us from wasting money on treatments that only work on the label, not the distress."

  **Soft Spot:** Pharma companies will not fund this.
  **Concession:** Acknowledge this is a public good problem, not a market incentive problem.

  ### 8. The Implementation Objection
  **Q:** "Let's say I buy this. Who decides when the debt is too high? What's the threshold for triggering a re-anchoring event? Who has the authority to reset the criteria?"

  **Reply:** "It shouldn't be authority; it should be a metric. We report the 'Loop Debt Statistic' alongside prevalence rates. It measures the divergence between the anchored criteria and the naive calibration. When the divergence exceeds the confidence interval for treatment prediction, that triggers a review. It moves the decision from a political committee meeting every 15 years to a data-driven maintenance schedule, like changing the oil in a car based on miles, not just when it breaks."

  **Soft Spot:** No one wants another metric to track.
  **Concession:** Admit this adds complexity to reporting but argues it reduces long-term error.

  ---

  ### EMERGENCY PROTOCOL: The "Prayer Question"
  **If they press Question 3 (Realism):** "You're assuming a classification-independent population..."
  **Do not dodge.** If you dodge, you look like a sophist.
  **The Least-Bad Answer:** "You're right. I am assuming there is a *causal substrate*—biological, psychological, social—that exists prior to our labeling of it. I am not assuming that substrate maps neatly to our categories. I'm assuming it's stable enough to serve as a reference point, even if our *names* for it are tools. I'm a realist about the *suffering*, not the *syndrome*."

  ### FINAL CHECK
  **If you feel cornered:** Return to the **Instrument Metaphor**. "We are talking about maintaining the accuracy of a measuring device. If the material being measured changes its properties in response to the measurement, we don't throw away the device, and we don't pretend the material is static. We recalibrate."

  **Remember:** They fear you are saying "Psychiatry is fake." You are saying "Psychiatry is engineering, and this is maintenance." Stick to engineering.
