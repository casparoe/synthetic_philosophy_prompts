prompt: |-
  I cover science and risk stuff for a general-interest magazine and a huge chunk of my job is people giving me ranges instead of numbers. "Somewhere between 20 and 60 percent." "Low single digits, maybe up to 10." "Depends on the model, call it 3 to 30 times baseline." My editor wants one figure in the lede basically every time, and I've been quietly averaging things I don't think should be averaged.

  There's a whole formal literature on belief that's a set or an interval rather than a single number -- robust Bayes, imprecise probability, whatever the current name is -- and I want to actually use it, not cite it. So: write me a procedure I can run in like 20 minutes before filing, no equations passed what a smart non-specialist reader will follow, on a laptop in a newsroom with no statistician on call and a print deadline behind me.

  In order, it should cover:

  - what to actually extract from a source when they hand me a range. There's more than one thing hiding inside "20 to 60 percent" -- one model's output, several models I'm lumping together, or genuine ignorance about which world I'm in -- and I suspect the answer changes what I'm allowed to do with it.
  - when it's legitimate to collapse a range to a point for the copy and when it isn't, and what to write in the sentence instead.
  - two sources, two ranges: what combining them can even mean, and the conditions under which "experts say between X and Y" is simply false.
  - the thing a statistician told me that I never resolved: conditioning on new evidence can make the interval wider rather than narrower, sometimes no matter which outcome you learn. Tell me whether that's a bug in her example or a real feature of the math, and whether my procedure needs a step for it.
  - how to choose which end of a range to write down when a decision hangs on it (go pessimistic? some weighted compromise?) and exactly where that stops being math and starts being an editorial values judgment I should flag to readers rather than bury.

  Then run it on three cases:

  1. Two epidemiologists on how likely a new variant is to substantially evade existing immunity. One says 30-60 percent, the other 45-80. Desk wants "around 50 percent" in the first graph.
  2. One expert puts a drug at 20-80 percent chance of working. A week later a small favorable trial lands and she revises to 10-95, saying she's now more sure of the direction but less sure of the size.
  3. A source gives me a flat "60 percent" and then admits on the record that he made it up as a placeholder for "more likely than not."

  One of these three should come out in a way that will annoy my editor -- I'd rather hear it from you now than from her. And be explicit about which steps are judgment calls dressed up as procedure, which distinctions from the formal theory you deliberately dropped to keep this usable, and what the procedure flat out cannot settle.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Science/risk journalist for a general-interest magazine.
      *   **Problem:** Sources give ranges (intervals), editors want single numbers (point estimates) in ledes. User has been averaging inappropriately.
      *   **Goal:** A 20-minute pre-filing procedure to handle ranges/intervals rigorously but simply (no complex equations, newsroom setting).
      *   **Required Content:**
          1.  Extracting meaning from ranges (model output vs. lumping vs. ignorance).
          2.  When to collapse to a point vs. when to keep the range (and how to write it).
          3.  Combining two sources/ranges (when it's valid vs. false).
          4.  Addressing the "widening interval on new evidence" paradox (bug or feature?).
          5.  Decision-making under uncertainty (pessimistic vs. optimistic vs. editorial judgment).
          6.  Apply to three specific cases (one must annoy the editor).
          7.  Meta-commentary: Identify judgment calls, dropped theory, and limitations.
      *   **Tone:** Professional, pragmatic, slightly cynical about newsroom constraints but rigorous about math/truth.

  2.  **Deconstruct the Theory (Mental Sandbox):**
      *   *Imprecise Probability/Robust Bayes:* Deals with sets of probabilities rather than single priors.
      *   *Aleatory vs. Epistemic Uncertainty:* Is the randomness in the world (coin flip) or in our knowledge (which coin do I have)?
      *   *Combining Intervals:* Intersection (if describing the same true value) vs. Union (if describing possible states). Averaging is usually wrong unless it's an ensemble of equally weighted models.
      *   *Dilation/Widening:* Yes, in Imprecise Probability, conditioning can widen intervals (dilation). This happens when the new evidence is ambiguous regarding which probability model is the right one.
      *   *Decision Theory:* Minimax (worst-case), Maximin (best-case), or Hurwicz (weighted). This is where values enter.

  3.  **Drafting the Procedure (Step-by-Step):**

      *   *Step 1: Diagnosis (The "Why" of the Range).* Need to distinguish between *variability* (the world is messy), *model disagreement* (experts fight), and *ignorance* (we don't know).
      *   *Step 2: Collapse Criteria.* When is a midpoint okay? Only when the distribution is symmetric and the uncertainty is random noise. If it's structural ignorance, keep the range.
      *   *Step 3: Combining Sources.* Don't average ranges. Look for overlap. If no overlap, report the conflict, don't smooth it.
      *   *Step 4: The Widening Paradox.* Confirm it's a feature (Dilation). It means the new data tells you *which* model is right less clearly than you thought, or the models diverge more on the new data.
      *   *Step 5: Decision Values.* If the story implies action (lockdown, take drug), the number chosen reflects risk tolerance. This is editorial, not math.

  4.  **Developing the Three Cases:**

      *   *Case 1 (Epidemiologists):* 30-60% and 45-80%. Overlap is 45-60%. Midpoints are 45% and 62.5%. Editor wants "around 50%".
          *   *Analysis:* These are likely model ensembles. Combining them isn't just averaging. The union is 30-80%. The intersection is 45-60%. "Around 50%" ignores the upper tail risk.
          *   *Verdict:* Editor will be annoyed. "Around 50%" is misleading. Better: "Between 45 and 60 percent, with some models suggesting higher."
      *   *Case 2 (Drug Trial):* 20-80% -> 10-95%.
          *   *Analysis:* This is classic *dilation*. The expert is saying "I know it works or doesn't, but I don't know how much." The interval widened.
          *   *Verdict:* Do not collapse. Report the widening. It signals instability.
      *   *Case 3 (Made Up Number):* "60%" -> "More likely than not".
          *   *Analysis:* This is epistemic ignorance masquerading as precision.
          *   *Verdict:* Must report as >50%. Do not print 60%.

      *   *Selection for Editor Annoyance:* Case 1 is the most likely to trigger an editor fighting for a clean lede. Case 3 is easy to fix (just don't lie). Case 2 is counter-intuitive but explainable. Case 1 requires refusing the "50%" hook. I'll make Case 1 the annoying one.

  5.  **Refining the Procedure for the "20-Minute" Constraint:**
      *   Keep it checklist-style.
      *   Avoid jargon like "Aleatory" or "Dilation" in the main steps, explain them simply.
      *   Focus on *questions to ask the source* or *ask yourself*.

  6.  **Addressing the Specific Prompts:**
      *   *Extraction:* Distinguish "Noise" vs. "Conflict" vs. "Ignorance".
      *   *Collapsing:* Only if symmetric noise.
      *   *Combining:* Intersection vs. Union. Never average bounds.
      *   *Widening:* It's real (Dilation). Don't fix it, report it.
      *   *Decision:* Minimax vs. Expectation. Flag the value judgment.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Case 1:* If I tell the journalist to fight the editor on Case 1, I need to give them the ammo. The ammo is that averaging ranges hides the tail risk.
      *   *Self-Correction on Theory:* Don't mention "Choquet Integrals" or "Dempster-Shafer." Keep it to "Sets of Probabilities."
      *   *Tone Check:* Needs to sound like a senior editor or a stats consultant talking to a tired reporter. Direct, actionable.

  8.  **Final Review against Constraints:**
      *   20 minutes? Yes, it's a checklist.
      *   No complex equations? Yes.
      *   Cover all 5 bullet points? Yes.
      *   Run on 3 cases? Yes.
      *   One annoys editor? Yes (Case 1).
      *   Meta-commentary included? Yes.

  9.  **Final Polish:** Ensure the distinction between *uncertainty about the parameter* and *variability in the population* is clear, as that's a common journalistic trip-up. (Decided to simplify this to "World Uncertainty" vs. "Knowledge Uncertainty" for speed).

  *(Self-Correction during drafting)*: Wait, regarding the "widening interval" (Case 2). The prompt asks if it's a bug or feature. It's a feature of Imprecise Probability (dilation). I need to make sure the procedure tells the user *not* to try to narrow it back down artificially.

  *(Refining Case 1)*: Editor wants "around 50%". The overlap is 45-60%. 50% is technically inside the intersection. Why is it annoying? Because it implies precision that doesn't exist and ignores the 80% upper bound from Expert B. I will argue that reporting the *range of consensus* is better than the *average of the midpoints*.

  *(Refining Case 3)*: This is the easiest. "60%" is a lie. "More than half" is the truth.

  *(Refining the "Judgment Call" section)*: Be honest. This procedure doesn't solve the tension between truth and clickability. It just prevents mathematical lies.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a 20-minute "Interval Protocol" designed for a newsroom deadline. It borrows from robust Bayesianism and imprecise probability theory but strips out the math so you can use it as a checklist.

  ### The 20-Minute Interval Protocol

  **Minute 0-5: Diagnose the Range (The "Why")**
  When a source gives you $[L, U]$ (Low to High), do not write it down yet. Ask yourself (or them) which of these three engines produced it:
  1.  **Noise (Aleatory):** The process is random (like a coin flip), and this is the confidence interval around a stable truth. *Action: Collapsing is usually safe.*
  2.  **Conflict (Model Disagreement):** Model A says 20, Model B says 60. There is no single "true" number yet, only competing mechanisms. *Action: Do not average. Report the spread.*
  3.  **Ignorance (Epistemic):** We don't know the mechanism. The range represents "could be anything in here." *Action: Never collapse. This is structural uncertainty.*

  **Minute 5-10: The Collapse Test**
  Your editor wants a point estimate. You are allowed to give one **only if**:
  *   The source is **Noise** (Type 1).
  *   The distribution is roughly symmetric (20-60 is okay; 1-100 is not).
  *   **The Test:** If you pick the midpoint, would being wrong by the margin of error change the reader's decision?
      *   *No?* Write the midpoint, but add "plus or minus [half-range]" in the next paragraph.
      *   *Yes?* Do not write a point estimate. Write "between X and Y." If the editor forces a number, use the **conservative bound** (see Minute 15) and flag it.

  **Minute 10-15: Combining Sources**
  You have two ranges: $[L_1, U_1]$ and $[L_2, U_2]$.
  *   **Do not average the bounds.** (Averaging 20-60 and 40-80 to get 30-70 is mathematically unjustified unless the models are equally weighted ensemble members).
  *   **Check for Overlap:**
      *   *They overlap?* The "Zone of Consensus" is the intersection $[max(L), min(U)]$. Report this. It is stronger than an average.
      *   *They do not overlap?* Do not bridge the gap. Report the conflict ("Estimates vary wildly from X to Y"). Bridging implies knowledge you don't have.
  *   **The "False Precision" Trap:** If Source A is a guess and Source B is a measurement, do not combine them. The guess contaminates the measurement. Discard the guess.

  **Minute 15-18: The Widening Paradox (Dilation)**
  Your statistician was right. In imprecise probability, new evidence can widen the interval. This is called **Dilation**.
  *   **Why:** The new data might tell you that your previous assumptions about *which model to trust* were wrong. You are less sure about the *rules* now, even if you are more sure about the *direction*.
  *   **Procedure:** If a range widens after new data, **do not narrow it back down.** Do not revert to the old range. Report the widening explicitly ("While the data confirms the trend, uncertainty about the magnitude has increased"). This is a feature, not a bug. It signals instability.

  **Minute 18-20: Decision Values (The Editorial Line)**
  If the story implies action (take the drug, lock down, sell the stock), choosing a number is a value judgment, not math.
  *   **Pessimistic (Minimax):** Use the worst-case bound. Use this for safety risks (toxins, viruses).
  *   **Optimistic (Maximin):** Use the best-case bound. Use this for opportunity costs (investment, cures).
  *   **The Flag:** If you choose one end of the range to drive the narrative, you must write: "Using the conservative estimate..." or "In the worst-case scenario..."
  *   **The Hard Stop:** If the range spans zero (e.g., -5% to +10% growth), you cannot write a headline about growth. You must write about uncertainty.

  ***

  ### Running the Protocol on Your Cases

  #### Case 1: The Variant (Two Epidemiologists)
  *   **Inputs:** Expert A (30-60%), Expert B (45-80%). Editor wants "Around 50%."
  *   **Diagnosis:** This is **Conflict (Model Disagreement)**. These are likely different transmission models.
  *   **Combination:**
      *   Union (All possibilities): 30-80%.
      *   Intersection (Consensus): 45-60%.
      *   Average of Midpoints: (45% + 62.5%) / 2 = ~54%.
  *   **Protocol Verdict:** The "Zone of Consensus" is 45-60%. However, Expert B's upper bound (80%) represents a tail risk that averaging hides.
  *   **The Copy:** "Experts estimate between 45 and 60 percent, though some models suggest evasion could reach 80 percent."
  *   **Editor Annoyance Level:** **High.**
      *   *Why:* You are refusing the clean "50%" hook. You are forcing the lede to carry a clause about model disagreement.
      *   *Defense:* Averaging the midpoints (50%) implies the 80% risk doesn't exist. If the variant hits 80%, your "50%" lede looks negligent. The consensus range (45-60%) is the only defensible point, but it's clunky.
      *   *Compromise:* "Roughly half." (Vague, but accurate). Do not write "50 percent."

  #### Case 2: The Drug Trial (Widening Interval)
  *   **Inputs:** Pre-trial (20-80%). Post-trial (10-95%).
  *   **Diagnosis:** **Dilation.** The expert says direction is clearer, magnitude is wilder.
  *   **Protocol Verdict:** This is Minute 15. The interval widened. Do not revert to 20-80%. Do not average to 50%.
  *   **The Copy:** "While the trial confirms the drug works, experts say the effectiveness could be as low as 10 percent or as high as 95 percent—a wider range than before the data arrived."
  *   **Editor Annoyance Level:** Medium.
      *   *Why:* It sounds contradictory ("more sure but wider range").
      *   *Defense:* Explain that the trial ruled out "zero effect" but revealed the dosage response is unpredictable. The uncertainty shifted from *if* it works to *how much*.

  #### Case 3: The Placeholder (The Made-Up Number)
  *   **Inputs:** "60%" admitted to be "More likely than not."
  *   **Diagnosis:** **Ignorance (Epistemic).** This is not a number; it is a sentiment.
  *   **Protocol Verdict:** Minute 5 (Collapse Test). You cannot collapse ignorance into precision. 60% is a lie.
  *   **The Copy:** "The source estimates the outcome is 'more likely than not,' or greater than 50 percent."
  *   **Editor Annoyance Level:** Low.
      *   *Why:* It's an easy fix.
      *   *Defense:* Printing "60%" is falsifiable. If the event doesn't happen, you printed a false probability. Printing ">50%" is unfalsifiable and honest.

  ***

  ### Meta-Commentary: What I Hid From You

  To make this fit in 20 minutes, I made three deliberate sacrifices. You need to know them so you don't get cornered by a source who knows the theory.

  **1. Judgment Calls Dressed as Procedure**
  *   **The "Consensus" Heuristic:** In Step 3, I told you to use the Intersection (Overlap) as the "Zone of Consensus." Formal theory doesn't always allow this. If Expert A is a climatologist and Expert B is a geologist, their overlap might be coincidental, not consensus. I simplified this to "Overlap = Safe Zone" to save you time. *Risk:* You might report a false agreement. *Mitigation:* Only overlap ranges from sources using similar methodologies.
  *   **The "Conservative Bound" Choice:** In Step 5, I told you to pick Pessimistic for safety and Optimistic for opportunity. This is pure editorial价值观 (values), not math. I presented it as a rule to help you decide quickly. *Risk:* You might apply "safety" logic to an economic story and scare readers unnecessarily. *Mitigation:* Ask your editor explicitly: "Are we minimizing false alarms or missed detections?"

  **2. Distinctions I Dropped**
  *   **Confidence vs. Credible Intervals:** I treated all ranges as the same. Frequentist confidence intervals (about the method) and Bayesian credible intervals (about the parameter) behave differently when combined. I ignored this because explaining it takes 20 minutes itself. *Limitation:* If a source gives you a 95% CI and another gives a 50% plausible range, my protocol treats them identically. They aren't. *Fix:* If possible, normalize to "roughly 2-in-3 chance" (1 standard deviation) mentally before comparing.
  *   **Dependency:** My combination rule assumes the sources are independent. If Expert A and Expert B used the same underlying data, their ranges aren't two votes; they're one vote. My protocol might overstate the consensus.

  **3. What This Procedure Cannot Settle**
  *   **The "True" Value:** This protocol manages *honesty*, not *accuracy*. It prevents you from lying about precision, but it doesn't tell you which expert is right.
  *   **The Lede War:** This protocol will frequently tell you that a single number is inappropriate. Your editor will frequently tell you that a single number is required for the layout. This procedure gives you the ammunition to fight ("Averaging these is mathematically invalid"), but it does not resolve the power dynamic. In Case 1, I sided with the math. In a real newsroom, you might lose that fight. If you do, use the "Conservative Bound" rule: If forced to pick one number from 30-80%, pick 30% (safety) or 60% (consensus floor), never the arithmetic mean (55%).

  **Summary for your Editor:**
  "I'm not giving you an average because these aren't measurement errors, they're model conflicts. Averaging them hides the tail risk. I can give you the consensus floor, or the worst-case, but the mean is a fiction."
