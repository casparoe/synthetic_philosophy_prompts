          *   *Points:* Half the part is right (strict), half is wrong (weak).
          *   *Decision:* 3/6.

      *   **Part (c) [4 points]:**
          *   *Conclusion:* Yes.
          *   *Reasoning:* Cites the 2-player equivalence theorem (Pearce/Bernheim). This is correct.
          *   *Verification:* Checks BR conditions for survivors. Correct.
