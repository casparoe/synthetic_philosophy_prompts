      *   **Part (b) [6 points]:**
          *   *Conclusion:* Strict dominance order independence: Correct. Weak dominance order independence: **Incorrect**.
          *   *Reasoning:* The argument for strict dominance is hand-wavy but essentially points in the right direction ("inequality that holds against all... holds against any subset").
          *   The argument for weak dominance is explicitly wrong ("The same reasoning shows...").
