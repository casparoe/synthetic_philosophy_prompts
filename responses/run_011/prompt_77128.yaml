          *   This is a significant conceptual slip. It suggests they think dominance is about expected utility against a specific "average" opponent, rather than state-by-state superiority.
          *   I will stick with a heavy penalty here. 5/9 seems fair. 4 points lost for incorrect verification method.

      *   **Re-evaluating Part (b) Grading:**
          *   Strict dominance explanation: "inequality that holds against all of them holds against any subset of them." This is the correct intuition for why deletion doesn't *revive* a dominated strategy. It doesn't fully explain why the *set* is unique (which requires showing that if $s$ is dominated in $S$, it's dominated in any $S' \subset S$ containing the dominator), but it's acceptable for 2nd year.
