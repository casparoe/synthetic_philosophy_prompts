  ### 1. Independent Solution

  **Game Matrix:**
  ```
              L          M          R
       A   (0, 2)     (3, 1)     (1, 0)
       B   (3, 1)     (0, 2)     (1, 0)
       C   (1, 0)     (1, 0)     (0, 3)
  ```

  **(a) Iterated Deletion of Strictly Dominated Strategies (IDSDS)**
  *   **Step 1 (Player 1):** Check if any row is strictly dominated by a mixed strategy $\sigma = pA + (1-p)B$.
      *   Payoff($\sigma$, L) = $3(1-p)$. Payoff(C, L) = 1. Need $3 - 3p > 1 \Rightarrow p < 2/3$.
      *   Payoff($\sigma$, M) = $3p$. Payoff(C, M) = 1. Need $3p > 1 \Rightarrow p > 1/3$.
      *   Payoff($\sigma$, R) = $1$. Payoff(C, R) = 0. $1 > 0$ (Always true).
      *   Any $p \in (1/3, 2/3)$ works. Let $p=1/2$. $\sigma = (1/2)A + (1/2)B$ strictly dominates C.
      *   **Delete C.**
  *   **Step 2 (Player 2):** Remaining rows {A, B}.
      *   Payoffs for L: (2, 1). Payoffs for M: (1, 2). Payoffs for R: (0, 0).
      *   L strictly dominates R ($2>0, 1>0$). M strictly dominates R ($1>0, 2>0$).
      *   **Delete R.**
  *   **Step 3 (Check 2x2):** Rows {A, B}, Cols {L, M}.
      *   P1: A=(0,3), B=(3,0). No dominance (pure or mixed).
      *   P2: L=(2,1), M=(1,2). No dominance.
  *   **Surviving Set:** $\{A, B\} \times \{L, M\}$.

  **(b) Order Independence**
  *   **Strict Dominance:** Order independent. If $s_i$ is strictly dominated in $S$, it remains strictly dominated in any subset $S' \subset S$ (provided the dominator is not removed). The set of *never* strictly dominated strategies is unique.
  *   **Weak Dominance:** Order **dependent**. Deleting a strategy can remove the specific column/row where the strict inequality ($>$) required for weak dominance held, leaving only ties ($=$). This can make a previously dominated strategy no longer dominated, or vice versa.
  *   **Conclusion:** Strict = Yes; Weak = No.

  **(c) Rationalizability**
  *   **Theorem:** In two-player games, the set of rationalizable strategies is identical to the set of strategies surviving IDSDS.
  *   **Verification:**
      *   A is BR to M. B is BR to L.
      *   L is BR to A. M is BR to B.
      *   All survivors are best responses to some belief (specifically, pure strategies of the opponent).
  *   **Answer:** Yes.

  **(d) Nash Equilibria**
  *   **Pure:** Check 2x2. (A,L)→P1 deviates to B. (A,M)→P2 deviates to L. (B,L)→P2 deviates to M. (B,M)→P1 deviates to A. No pure NE. (C and R are dominated, so cannot be in NE).
  *   **Mixed:** P1 plays $pA + (1-p)B$. P2 plays $qL + (1-q)M$.
      *   P2 Indifference: $2p + 1(1-p) = 1p + 2(1-p) \Rightarrow p+1 = 2-p \Rightarrow 2p=1 \Rightarrow p=1/2$.
      *   P1 Indifference: $0q + 3(1-q) = 3q + 0(1-q) \Rightarrow 3-3q = 3q \Rightarrow 6q=3 \Rightarrow q=1/2$.
  *   **NE:** $\left( (1/2, 1/2, 0), (1/2, 1/2, 0) \right)$.
  *   **Relationship:** IDSDS removes strategies that are never best responses. Since NE strategies must be best responses, no NE is lost during IDSDS.

