          *   *Reasoning:* Relationship explanation is good ("Deleting strictly dominated strategy never deletes a Nash equilibrium").
          *   *Calculation:* Arithmetic error in P1 indifference condition. Used payoff 1 for (B, M) instead of 0.
          *   *Robustness:* The method is correct, the arithmetic is wrong.
