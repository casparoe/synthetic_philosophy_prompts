  - race — constructed. She's emphatic that this doesn't mean it isn't real or doesn't have massive effects, just that it isn't a category nature handed us.
  - gender — constructed
  - money — constructed
  - electrons — not constructed
  - the equator — not constructed
  - weeds, as in whether a dandelion in your lawn counts as a "weed" — constructed
  - time zones — constructed
  - "invasive species" — constructed, and she specifically said its because whether something counts depends on whether humans were the ones who moved it there
  - species, as in whether this population and that one are the same species — NOT constructed, and she was firm about it: whether they can actually interbreed isn't up to us
  - "fish," as in the whole group — constructed, "because that group doesn't hold together the way nature wants it to"

