  - Which of her ten verdicts is doing the most work at narrowing the space — like, if I could only keep three of them and still pin down the rule, which three.

  Please don't hand me a reading list or cite people I'm never going to look up. Just show the reasoning the way you'd show a debugging trace: here's the hypothesis, here's what it predicts, here's the case that kills it.
