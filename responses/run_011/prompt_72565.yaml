prompt: |-
  ok so this is for a thing I'm doing with my school's AI committee (long story, I got volunteered) and I could really use your help thinking it through as a dialogue.

  background: our district is piloting a tutoring chatbot next semester, about 1400 students, and somehow I'm the one writing the "whose values does this thing follow" section of the parent consent form. it's due friday. our committee ran a poll over three possible honesty rules for the bot:

  - rule A: always tell the student the plain truth about their work, even when it's discouraging
  - rule B: tell the truth but frame it encouragingly, never let a kid leave the conversation feeling bad about themselves
  - rule C: do whatever best serves that kid's learning across the whole year, which sometimes means not telling them the whole truth right now

  and we got a straight up cycle. the A bloc beats B, B beats C, C beats A, and the three blocs are all roughly the same size. so majority voting is useless to us. my proposed fix, which half the committee liked: forget voting over rules entirely, give everyone the same 40-question survey about how the bot should behave, and just set the bot to the median answer on each question. then someone pointed out that no actual student in this school holds that exact combination of answers, which reminded me of that jury thing my gov teacher mentioned where every single juror is logically consistant on their own but the majority vote on each seperate premise comes out inconsistent (the discursive dilemma? maybe, idk).

  can you write me a dialogue, like 1000-1200 words, between two people arguing about what we should do:

  - one who thinks the answer is to aggregate everybody's actual preferences as well as we possibly can — surveys, weighted votes, some smarter social choice mechanism, whatever — because every alternative is just someone imposing their own values on everyone else
  - one who thinks aggregation is a trap, and that a public institution like a school should aim at a kind of neutrality: only act on principles that every affected person could reasonably accept, even if that means the bot ends up doing less

  ground rules for it:

  - neither one is dumb or a strawman. both should be genuinely good at this, each should land at least one point the other can't answer and has to admit they can't answer
  - they should actually respond to each other's arguments, not take turns giving little speeches at each other
  - use the real details: the cycle, my median-survey hack, and the fact that the stakeholders include 9 year olds, the students who'll be here next year and can't vote in anything, parents who disagree with their own kids about stuff, the teachers' union, and the vendor, whose contract literally says the bot optimizes for "engagement." someone should press hard on whether a bot talking to a 14 year old is serving the kid's values or the parents'
  - make the neutrality person defend themselves on the obvious problem: deciding which views count as "unreasonable" and get excluded sounds a whole lot like picking a side
  - no tidy ending where they see eye to eye. end with each of them telling me one thing to do before friday, and I want the reader to still be torn about it
  - write it so a regular 15 year old in my class can follow, so when a technical term comes up have the characters explain it in passing instead of lecturing. and please don't make up quotes or citations or page numbers, I have no way to check them and I'd get in trouble

  name the two characters whatever you want, just not person 1 and person 2
