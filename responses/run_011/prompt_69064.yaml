  5. **A closing note**

  This question separates students who have memorised the labels from students who understand the issue by forcing them to apply the "doubleness of heart" definition to cases where the heart is single but the intent is deceptive. The single sentence in a weak answer that would most reliably reveal the difference is a claim that Augustine permits Option (B) simply because it is factually true, without acknowledging the tension this creates for his theory of signification. Students who grasp the material will recognise that the literal truth of (B) is precisely what makes it a test case for the limits of Augustine's absolutism.
