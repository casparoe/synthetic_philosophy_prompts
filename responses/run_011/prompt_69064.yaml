answer: |-
  1. **Setting rationale**

  The core cruxes here are the definition of lying (will to deceive vs. factual falsity), the permissibility of misleading truths, and the tension between Augustine's psychological absolutism and his semiotic theory of language. I have built the question on the "misleading truth" problem (Option B) because it forces students to test the limits of the "doubleness of heart" criterion against the "function of signs" rationale. A merely summarising answer would correctly identify Option A as a lie and Option C as permitted, then list the eight grades of lies. It would stall at Option B, failing to see that Augustine's prohibition on lying rests on the abuse of signification, not just factual error. Such an answer would treat the ranking of lies as a consequentialist weighing of outcomes rather than a grading of sinfulness where all options remain sinful. To score highly, students must show how the semiotic argument potentially tightens the restriction beyond the psychological definition.

  2. **The exam question as it will appear on the paper**

  **Question 1** (30 marks)

  **Case:** During a persecution, an officer asks a Christian householder point-blank whether a fugitive is hidden somewhere in the house. Minutes earlier the householder moved the fugitive from the cellar to a concealed space in the roof. The householder has four replies available:
  (A) A flat denial that anyone is hidden in the house — false, and believed by the speaker to be false.
  (B) A statement that the cellar is empty — literally true, believed true, and chosen precisely because the officer will infer from it that no one is hidden anywhere in the house.
  (C) A refusal to answer, or silence.
  (D) An ambiguous utterance whose sense the speaker resolves privately in a way he does not disclose, so that what he believes and what he says are matched only by an interpretation the hearer has no access to.

  **Essay:** Using Augustine's treatises on lying, analyse the moral status of these options.
  (i) Determine which options Augustine would rule out outright, which he would permit, and which fall in between, specifying which element of his criteria decides each case. (8 marks)
  (ii) Examine whether the "doubleness-of-heart" criterion and the rationale that signs exist to convey what is in the mind pull apart in options (B) and (D). Does his framework forbid engineered misleading once the assertion is made true, or does it license it? (10 marks)
  (iii) Explain what the graded ranking of lies does and does not concede to consequences, and whether ranking by seriousness is compatible with holding that no lie is ever permissible. (6 marks)
  (iv) End with a defended verdict on which reconstruction of the position is best: an absolutism about the integrity of the speaker that has no notion of an epistemic entitlement owed to the hearer; an absolutism about the proper function of signs that does generate such a notion; or a view that oscillates unstably between the two. State what in the framework decides this. (6 marks)

  *Rubric: You may identify arguments descriptively — no chapter numbers, no page references, no recalled quotations are expected or rewarded.*

  3. **A model answer of 700–750 words**

  Augustine's primary criterion for lying is the doubleness of heart: speaking against what one holds in the mind. On this basis, Option (A) is unequivocally ruled out as a lie, regardless of the good intention to save a life. Option (C), silence or refusal, is permitted because no assertion is made; Augustine allows concealing truth but prohibits asserting falsehood. Options (B) and (D) occupy the contentious middle ground. Option (B) involves a true statement made with the intent to deceive. Augustine generally permits speaking the truth even if the hearer draws a false inference, provided the speaker does not assert what they believe false. However, Option (D), ambiguous utterance with private resolution, risks becoming a lie if the spoken words do not match the speaker's intended meaning, even if technically true. The deciding element is whether the speaker believes they are expressing their mind.

  The tension arises when examining the rationale behind the prohibition. Augustine argues that signs exist to convey what is in the mind to another mind. If language functions socially to share thought, then Option (B) exploits this function. While the "doubleness" criterion might permit (B) because the statement is factually true and believed true, the "function of signs" rationale suggests a deeper violation. In Option (B), the speaker uses the convention of truth-telling to engineer a false belief. This suggests the framework has resources to forbid engineered misleading even when assertions are technically true, because the intent is to sever the link between sign and mind. Option (D) is worse, as it severs the link explicitly. If the framework is consistent, it should condemn (B) not because the sentence is false, but because the communicative act is corrupt. However, Augustine often stops short of condemning (B) outright, suggesting a friction between his psychological definition and his semiotic theory.

  Regarding the graded ranking of lies, Augustine distinguishes lies by their matter and motive, ranking lies about religious doctrine as worst and lies to save someone from sexual violation as least bad. This ranking concedes that consequences matter for the *gravity* of the sin, but not for the *licitness* of the act. All eight grades remain sins; none are permissible. This is compatible with absolutism because the ranking measures the disorder caused in the soul and the community, not a utilitarian calculation where a good outcome justifies the means. The hierarchy acknowledges that some lies destroy charity more than others, but maintains that any intentional assertion against one's mind violates the divine order. Thus, saving a life reduces the penalty but does not remove the guilt.

  The best reconstruction of this position is an absolutism about the proper function of signs that generates a notion of epistemic entitlement, though Augustine oscillates toward mere speaker integrity. If signs exist to convey the mind, then using them to deceive violates the ontological purpose of language, not just the speaker's honesty. This implies the hearer is owed truthfulness by virtue of their shared participation in signification. A strong objection is that Augustine explicitly denies the persecutor has a right to the truth, especially when seeking to kill. However, this objection conflates legal entitlement with ontological fittingness. The reconstruction holds that the speaker violates the nature of language itself, regardless of the hearer's moral standing. The framework decides this based on the teleology of signs: if a sign's end is to communicate mind, frustrating that end is inherently disordered. Therefore, while Augustine often focuses on the speaker's sin, the logic of his semiotic argument supports a stricter view than his psychological definition alone allows. Option (B) should be ruled out on this reconstruction, as it abuses the function of signs even if it preserves the speaker's internal consistency. This resolves the oscillation by prioritizing the social nature of language over the private state of the soul.

