answer: |-
  **PART ONE: THE ESSAY QUESTION**

  **Take-Home Assignment: The Identity of the Letter**
  **Time Allowed:** 90 Minutes
  **Word Limit:** 800 Words Maximum
  **Resources:** No external research or books permitted. Rely only on the descriptions below and your own reasoning.

  **The Exhibits:**
  Imagine you are looking at five specific pieces of evidence regarding how we recognise letters:
  1.  **The Gradient Row:** A single sheet of paper showing six lowercase 'a's in a line. The first is the standard two-storey printed shape. The last is a simple single-bowl handwritten loop. Each 'a' differs from its neighbour by a tiny amount. By the fourth mark, it is impossible to say objectively whether it is a two-storey 'a' that has lost its shoulder or a one-storey 'a' carrying a scar.
  2.  **The Local Sign:** A photograph of an old shop sign from a specific town. The mark doing the work of 'a' looks exactly like a perfect circle. The mark doing the work of 'o' has a small spur on top. Locals read the sign fluently. A tourist standing beside them reads the 'a' as an 'o'.
  3.  **The Shared Shape:** A bakery sign you painted where one single closed circle serves as the 'o' at the end of the word "DO" and the 'a' at the start of "ARTS". The words run together. The identical physical mark belongs to two different letters simultaneously.
  4.  **The Failed Intent:** A practice card by a trainee. They drew a mark intending it to be an 'a', can point to the model they copied, and swear sincerely it is an 'a'. Every experienced signwriter in the shop reads it instantly as a 'd'. Explanation does not change their first reading.
  5.  **The Alien Alphabet:** A set of shapes generated by a computer program. None resemble any historical letters. However, one specific jagged shape is placed consistently in the first position of every word in a complete new alphabet.

  **The Task:**
  Propose a single account of what makes a letterform the letter it is. Is it the shape? The writer's intention? The reader's recognition? Its position in a system?
  Once you have stated your rule, you must test it against all five Exhibits described above. Explain how your rule handles each one. Finally, you must state plainly where your rule fails or what you are forced to surrender to make it fit.

  ***

  **PART TWO: MODEL ANSWER**

  **Title: The Letter as a Function, Not a Shape**

  To decide what makes an 'a' an 'a', we must stop looking at the ink and start looking at the work the mark is doing. My account is this: a letter is defined by its functional role within a specific system of reading. It is not a picture of a sound, but a key that fits a specific lock in a reader's mind. If the mark successfully turns the lock, it is the letter. If it jams, it is not, regardless of what the writer intended.

  Let us test this "Functional Role" account against the five exhibits.

  First, the Gradient Row. Here, the shape changes slowly, but the function remains stable until it snaps. The fourth mark is ambiguous not because the letter is broken, but because the system allows for variation. As long as the reader's mind can slot the mark into the 'a' position without hesitation, the function holds. The blur exists because the "lock" in the reader's mind has a little wiggle room. My account explains the blur: it is the boundary where the function begins to fail.

  Second, the Local Sign. The tourist fails because they are using the wrong system. They are trying to use a national key in a local lock. The locals succeed because, in their town's system, the circle performs the 'a' function. This supports the account: the letter is not the circle itself, but the circle *plus* the agreement of the community using it.

  Third, the Shared Shape. One circle acts as 'o' and 'a'. If letters were defined strictly by shape, this would be impossible. But if letters are defined by position and function, it makes sense. In the first word, the circle fills the 'o' slot. In the second, it fills the 'a' slot. The ink is the same; the job is different. The mark borrows two identities based on where it stands.

  Fourth, the Failed Intent. This is the hardest test. The trainee says it is an 'a'. My account says it is a 'd'. Why? Because the "job" of a letter is communication, not expression. If the reader cannot perform the reading, the function has failed. The writer's intention is irrelevant if the key does not turn the lock. The mark is a 'd' because that is the work it actually does in the world.

  Fifth, the Alien Alphabet. The jagged shape resembles no historical 'a'. Yet, if it is placed consistently in the first slot of a new system, and readers learn to use it there, it becomes the 'a' of that alphabet. It inherits the identity from its position, not its ancestry.

  Where does this account fail? It struggles with the exact moment of failure in the Gradient Row. I can say the function breaks when the reader hesitates, but I cannot predict exactly which of the six marks will cause the hesitation. Different readers have different locks. My account relies on the reader, but readers vary. I must surrender the idea of a perfect, universal definition. A letter is not a fixed object; it is an agreement that can fray at the edges. I can define the job, but I cannot measure the tolerance of the worker.

  ***

  **PART THREE: MARKING SCHEME**

  **Total Marks:** 25
  **Marker Guidance:** You are not judging whether the student's opinion is "correct." You are judging whether they followed the instructions and argued consistently. You do not need to know about lettering to use this scheme. Look for the specific moves listed below.

  **1. The Core Claim (5 Marks)**
  *   **5:** Clearly states one single rule (e.g., "It is about the reader," or "It is about the shape").
  *   **3:** States a rule but it is vague or wobbles between two ideas.
  *   **0:** No clear rule is stated; just discusses the pictures.

  **2. Handling the Gradient and The Local (Exhibits 1 & 2) (5 Marks)**
  *   **5:** Explains why the row gets blurry (Exhibit 1) AND why the tourist reads the sign wrong (Exhibit 2) using the Core Claim.
  *   **3:** Explains one exhibit well but ignores the other.
  *   **0:** Claims the blurry mark is "just wrong" or the tourist is "stupid" without explaining why using the Core Claim.

  **3. Handling the Shared Shape and The Alien (Exhibits 3 & 5) (5 Marks)**
  *   **5:** Explains how one shape can be two letters (Exhibit 3) AND how a new shape can be an old letter (Exhibit 5).
  *   **3:** Handles Exhibit 3 but says Exhibit 5 is "not a real letter."
  *   **0:** Says Exhibit 3 is impossible or a trick.

  **4. Handling The Failed Intent (Exhibit 4) (5 Marks)**
  *   **5:** Explicitly decides whether the mark is an 'a' or a 'd' and justifies it using the Core Claim (e.g., "It is a 'd' because the reader decides").
  *   **3:** Says "It is both" or "It depends" without explaining why.
  *   **0:** Sides with the trainee solely because "they meant it," ignoring the readers.

  **5. The Concession (5 Marks)**
  *   **5:** Clearly states where their rule breaks down or what they had to give up (e.g., "I can't define the exact boundary").
  *   **3:** Admits a small problem but tries to hide it.
  *   **0:** Claims their rule works perfectly for everything.

  **Specific Errors (Deduct 2 Marks per error, up to 10 total)**
  *   **The "Resemblance" Trap:** Arguing a letter is defined only by looking like a standard alphabet, without saying whose standard.
  *   **The "Anything Goes" Trap:** Saying "a letter is whatever the reader takes it to be" but then failing to explain why the trainee's 'd' isn't an 'a'.
  *   **The "No Truth" Trap:** Concluding that "there is no fact of the matter" and stopping there, instead of treating it as a failure of their theory.
  *   **The "Unused Distinction" Trap:** Making a distinction (e.g., "Shape vs. Meaning") but not applying it to any of the five exhibits.
  *   **The "Famous Example" Trap:** Quoting a famous philosopher (e.g., "Wittgenstein's family resemblances" or "Games") without applying it directly to the six-stage row.

  **Predicted Student Fumble: Exhibit 4 (The Failed Intent)**
  *   **Why:** Students naturally want to be kind to the trainee. They will want to say the mark is an 'a' because the student *tried* hard.
  *   **What a Fumble Looks Like:** The student writes: "The mark is an 'a' because the trainee intended it to be one, even if others see a 'd'."
  *   **How to Spot It:** If the student says the mark is an 'a' *despite* everyone reading it as a 'd', check their Core Claim. If their Core Claim is about "Communication" or "Reading," this is a contradiction. Deduct marks in Section 4. If their Core Claim is about "Intention," they may keep marks in Section 4, but they will likely fail Section 2 (The Local Sign) because the tourist's intention differs from the local's.

  **Band Descriptions for the Non-Expert Marker**
  *   **Excellent (21-25):** The student picks a lane (e.g., "The Reader is Boss") and drives it all the way home. They admit where the car hits a bump (The Concession). They handle the trainee's failure honestly.
  *   **Good (16-20):** The argument is clear but they might dodge one exhibit (usually the Alien Alphabet). The Concession is weak but present.
  *   **Adequate (11-15):** They describe the exhibits well but their Core Claim is muddy. They might contradict themselves on the Trainee card.
  *   **Poor (0-10):** They treat this as an art critique ("I like the bakery sign") rather than a logic problem. No Core Claim is offered.
