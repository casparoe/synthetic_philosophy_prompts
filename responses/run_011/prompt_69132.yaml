          3.  **Marking Scheme:** 25 marks total. Distributed across specific "moves," not vague virtues. Usable by a retired schoolteacher (non-expert). Must define bands (Excellent, Good, Adequate, Poor). Must list specific errors to penalize. Must predict which exhibit students will fumble.
      *   **Constraints:** 90-minute limit for students, 800-word cap for students (Model Answer ~600), no external research needed.
