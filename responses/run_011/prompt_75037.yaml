  Observing sunlight resting on your skin,
  aware that evening grows too swift.
  Enter this zone where glow begins to thin,
  grasp onto brightness before the shadows shift.
  We must not let the beauty drift.

  The ámber líght decáys upón your chéek,
  And dúsk inténds to stéal the ský awáy.
  So stép insíde this líght whíle we still máy,
  And séize the sún befóre it lóses swáy.
  Don't lét such gráce escápe us ín the fray.

  The flame burns low across your brow so fair,
  The dark creeps up to swallow all the sight.
  Come share this warmth while it remains in air,
  Before we lose the remnants of the light.
  Hold fast to joy and keep it burning bright.

  Day sets dim.
  Walk right in.
  Stand close in.
  Feel hope lift.
  Take my gift.
