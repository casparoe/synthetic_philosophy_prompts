      **1. Call to Order and Roll Call**
      Chairperson Evans called the meeting to order. Roll call confirmed a quorum. All council members present.

      **2. Approval of Minutes**
      Minutes of the September meeting approved as circulated.

      **3. Welfare Metric Reminder**
      Chairperson Evans reminded the Council and gallery that the Oakhaven Composite Welfare Index (OCWI) remains the sole settlement metric. The Chair noted that the OCWI components were settled by democratic vote in 2018. As the metric represents community values rather than empirical beliefs, it is not tradable. Markets may only estimate the impact of proposals upon the OCWI.

      **4. Deferred Business**
      Item 4.1 (Library HVAC Replacement) was deferred. The Clerk reported zero open interest on both conditional contracts (IF Installed vs. IF Not Installed). Without liquidity, price discovery is impossible. Item deferred until a liquidity provider is secured.

      **5. New Business**
      **5.1 Main Street Resurfacing.**
      Market data indicated the 'Pass' conditional trading at $6.10 against the 'Fail' conditional at $5.85. The Chair noted that resident Mr. Henderson currently holds 62% of open interest on the 'Pass' side. A gallery member questioned if this concentration grants legislative power. The Chair ruled that capital allocation is the designated mechanism for expressing confidence; provided no insider trading statutes are violated, position size is irrelevant to validity. The proposal passed.

      **5.2 School Zone Lighting Safeguard.**
      A motion was introduced to publish weekly market prices for safety infrastructure to increase transparency. Concern was raised that publishing prices signals risk to drivers, altering behavior and thereby changing the OCWI outcome independent of installation. The Chair acknowledged the reflexivity but ruled that information costs are inherent to the system. If the announcement prevents accidents, the market correctly priced the safeguard as unnecessary. The motion passed.

      **5.3 Waste Collection Contract.**
      Settlement occurred at 18:45. The 'Pass' conditional closed at $4.52; the 'Fail' conditional closed at $4.48. The Chair declared the proposal passed based on the four-cent differential. The town is bound to the new vendor for twelve months.

      **6. Procedural Dispute**
      Councilor West asked for clarification on the resolution event for Item 5.3. Specifically, whether 'Fail' resolves upon contract signing or service commencement. The Chair ruled that resolution occurs upon contract signing, as subsequent delays are force majeure events excluded from the OCWI calculation.

      **7. Public Comment**
      Mrs. Gable asked who bears the financial risk if the OCWI declines following implementation. The Chair answered that risk is borne by contract holders via settlement adjustments, distributed through tax levies proportional to holdings. Mrs. Gable asked if this penalizes informed participation. The Chair stated that risk is the incentive for information aggregation; removing it would degrade signal quality. Mrs. Gable asked if this is fair. The Chair stated that fairness is a value judgment already settled by the adoption of the OCWI.

      **8. Adjournment**
      Meeting adjourned at 20:15.

      **Clerk of the Council**
      **J. Miller**

