answer: |-
  The studio was quiet, save for the hum of the halogen lamps and the occasional scratch of a scalpel against wood. Elara had been working on the altarpiece for four months. It was a heavy thing, oak panelled, darkened by centuries of smoke and varnish. Her task was not to make it new, but to let it breathe again, to remove the yellowed layers that choked the original colors.

  For the last week, her attention had been fixed on the lower left corner. Under the raking light, which cast long shadows across the uneven surface, a shape had begun to emerge. It was the head of a kneeling figure, perhaps a donor or a saint, painted out in the seventeenth century. Now, only a ghost remained. A slight ridge in the gesso, a whisper of pigment caught in the valley of a brushstroke.

  Elara leaned in. Her eyes strained. There he was. The curve of a hood, the suggestion of a profile turned downward in prayer. She marked the spot lightly with a pencil on her protective overlay. She blinked, rubbed her eyes, and looked again. The shape was still there, vivid and undeniable.

  Two days later, under the same light, at the same angle, she looked again. The shape was there. It felt identical to the first time. The same pressure behind her eyes, the same clarity of form. She marked it again. But when she came back the next morning, the corner was flat. The light slid over wood and old glue, finding no purchase. There was no hood, no profile. Yet, as she stared, the image returned to her mind's eye, superimposing itself on the blank wood. It looked just as real as it had before.

  She was troubled. She could not tell, while she was looking, whether the shape belonged to the wood or to her own fatigue.

  Thomas and Sarah came to visit on Friday. They were fellow restorers, friends who knew the weight of a brush and the silence of a studio. They brought coffee and stood behind her as she worked the light across the corner.

  "You see him?" Elara asked, not turning around.

  "I see where you say he is," Thomas said. He leaned in, squinting. "But the light is tricky, Elara. It plays games."

  "I know," she said. "Sometimes he is sharp. Sometimes he is gone. But when I see him, it feels the same. The shape fills my vision exactly alike."

  Thomas nodded slowly. "That is the thing. If the experience is the same from your side—if the shape looks just as solid, just as present whether the paint is there or not—then what you are dealing with is the same kind of thing. You are confronting a picture in your own head. The panel is just the trigger. Sometimes the trigger fires because there is wood there to catch the light. Sometimes it fires because your eyes are tired and your mind wants to find a pattern. But what you hold in your hands, what you are working with in that moment, is your own sight of him. It is an inner thing. The outside world only nudges it."

  Sarah stepped closer, her shadow falling over the panel. "No. That gives too much power to the mistake."

  "It's not about power," Thomas replied. "It's about honesty. She can't tell the difference. If you can't tell the difference, then for you, they are the same event. You are stuck with what appears to you. And what appears is always inside."

  "But when the light hits the ridge," Sarah said, her voice low and steady, "she is touching the past. She is meeting the hand of the painter who died three hundred years ago. When the wood is flat, she is meeting nothing. She is guessing. You cannot say those are the same kind of meeting just because she feels the same way about them. One is a connection to the world. The other is a closed loop. To say they are the same thing is to say that opening a door and walking into a wall are the same because you meant to walk through both."

  Thomas shrugged. "But she doesn't know which door is open until she walks. And while she walks, the feeling is identical."

  "That doesn't make the walk the same," Sarah countered. "It just means she is blind to the difference until she hits the wall or passes through."

  Elara listened, her hand hovering over the panel. Thomas's words felt true to her exhaustion. When the figure appeared, it bloomed in her vision. She did not feel the wood; she felt the image. Whether the wood caused it or her fatigue did, the image was what she had to work with. It was a private visitor.

  But Sarah's words pulled at her duty. She was not restoring her own vision; she was restoring the object. If she treated the empty wood as if it held paint, she would damage it. If she treated the painted wood as empty, she would erase history. The stakes were not in her head; they were in the chemical bond between solvent and resin.

  "I have to decide," Elara said. "I have to apply the solvent tomorrow. I need to know if I am cleaning a surface or chasing a ghost."

  "Then trust the common feeling," Thomas said. "Accept that you are working with your own sight. Be careful. Assume the image is yours, and only sometimes borrowed from the wood."

  "Or trust the possibility of contact," Sarah said. "Assume that when you see him, you might actually be seeing him. Not a copy of him. Him. And when you are wrong, you aren't seeing a copy; you are seeing nothing at all. Don't mix them up."

  Elara sent them away and spent the night sitting in the dark. The argument settled in her bones. Thomas offered safety: if everything is inner, then error is just a variation of success. Sarah offered risk: if success is contact, then error is a breakage.

  The next morning, the light was crisp. The air was cool. Elara mixed a small batch of solvent. She chose a spot where the hood's edge had appeared vividly the night before. It felt real. It felt exactly like the times she had verified the ridge with a magnifier. It also felt exactly like the times she had found nothing.

  She applied the cotton swab. She rolled it once, twice.

  There was resistance. A slight drag. Then, a smear of dark blue on the white cotton.

  She stopped. She cleaned the area gently with dry cotton. She turned on the high-intensity lamp, the one that revealed the topography of the surface without shadow. There, beneath the layer she had just thinned, was the ridge. A microscopic cliff of azurite pigment. She had not imagined the drag. The solvent had reacted to the specific density of the old binder.

  She sat back. She had found him.

  But then she moved the light three inches to the right, where the profile's nose should have been. She had seen it clearly yesterday. She applied the swab. No drag. The cotton slid over smooth, hard varnish. No pigment came away. She checked under the high light. Flat. Empty.

  The asymmetry lay before her. In the first spot, she could point to the blue smear on the cotton. She could point to the ridge under the lens. She could bring Thomas and Sarah, and they could see the ridge too. They could all agree on the obstacle, the color, the history. The world had cooperated.

  In the second spot, there was nothing to point to. There was only her memory of the shape. She could not show them the nose. She could not show them the ridge. There was no smear of blue. The world had not cooperated.

  Thomas was right that she could not have known the difference yesterday. The feeling of certainty had been identical in both spots. The image in her head had been equally vivid. If she closed her eyes now, the memory of seeing the nose was just as strong as the memory of seeing the hood. From the inside, the two moments were twins.

  But Sarah was right about what had happened. In the first spot, her vision had been a bridge to the object. The light had bounced off the pigment and entered her eye. The existence of the pigment was part of what made the experience happen. In the second spot, the bridge was out. There was no object to meet her. The experience had happened, but it was hollow. It was not a different version of seeing; it was a failure to see.

  She looked at the blue smear on the cotton. It was small, but it was heavy with reality. It proved that in the good moments, she was not locked inside her own head. She was out here, in the room, touching the dead painter's work. The bad moments were not proof that all moments were inner; they were proof that sometimes the connection broke.

  Elara marked the spot with the blue smear as 'verified.' She marked the empty spot as 'unverified.' She could not treat them the same. She could not say, "I see a hood here," for both. For the first, she could say, "The hood is here." For the second, she could only say, "I thought I saw a hood."

  Thomas's caution remained necessary. She could not trust her eyes blindly. The inner picture was seductive and could be forged by fatigue. She had to respect the uncertainty of the moment. But Sarah's claim held the truth of the result. When the work was done, when the varnish was cleared, the difference would not be in how much she believed, but in what remained on the panel.

  She dipped a fresh swab. She moved to the next shadow. She knew now that the feeling in her head was not the measure of the truth. The measure was whether the world answered back. Sometimes it would. Sometimes it would not. And though the silence and the answer might feel the same while she waited, only one of them left a stain on the cotton.
