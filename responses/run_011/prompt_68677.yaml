          2.  **The Fatal Flaw (Step 7):** Explain why the Price Revolution objection fails (Global vs. Relative).
          3.  **The Theoretical Flaw (Step 4 & 5):** Explain the "Real Bills" or "Demand for Money" counter. Increased industry *needs* more money. The drain doesn't happen if the economy grows.
          4.  **The Policy Defense (Step 6):** Hume isn't trying to hoard; he's trying to stimulate velocity and activity.
          5.  **Addressing the TA/Step 1:** Money *is* oil in the long run, but fuel in the short run.
          6.  **Paper Strategy:** How to use this analysis to write a strong paper defending Hume's coherence.

  5.  **Refining the Economic Logic (Self-Correction during drafting):**
      *   *Wait, does Hume explicitly address the Price Revolution?* He alludes to the influx of gold/silver. He argues that the initial influx stimulated industry, but eventually, prices rose. He doesn't claim prices would fall back to pre-1492 levels unless the money left. The classmate claims Hume *should* predict prices falling back. That's the error. Hume predicts prices rise proportionate to money *unless* output rises faster.
      *   *Step 4 (Drain Lemma):* If I print money, prices rise, exports fall, money leaves. *Unless* the money printed caused output to rise enough to absorb the liquidity. Hume explicitly says the money increase *quickens industry*. So the denominator (Goods) rises with the numerator (Money). Prices might not rise as fast, preventing the drain.
      *   *Step 1 (Oil vs. Wheel):* Hume says money is not part of the "body politic" (wealth), but it affects the "mind" (expectations). The classmate takes the "body politic" quote too literally.

  6.  **Finalizing the Advice:**
      *   Tell the user the classmate's argument is a "Steel Man" that turned into a "Straw Man."
      *   Focus on the distinction between *relative* money stocks (trade between nations) and *absolute* money stocks (global influx).
      *   Highlight the dynamic nature of "Industry."
      *   Give a concrete outline for the paper.

  7.  **Review against constraints:** 9 days is tight. Don't suggest a complete rewrite of Humean theory. Suggest a targeted critique of the classmate's logic to clear the user's head, then pivot to a standard but nuanced exegesis. Actually, the prompt asks "Which step do you reject?" and "Does (2) still work?". I need to answer those specifically.

      *   *Decision:* I will advise rejecting (4) and (7). (1) is defensible as a long-run claim. (2) is the core strength.
