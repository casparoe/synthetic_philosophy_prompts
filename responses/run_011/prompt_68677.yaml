      *   *Cost to Hume:* Minimal. It actually saves him from the charge of incoherence.
      *   *Anti-Mercantilist work:* Yes, (2) still kills the idea that hoarding gold makes a nation rich.

  8.  **Final Polish:** Ensure the tone is supportive. The user is stressed ("walked straight into it," "can't find the way back out"). Validate their instinct that (1) feels too strong, but explain why the TA isn't *wrong*, just incomplete.

      *(Self-Correction)*: Wait, if I tell them to "Bury it," does that mean ignore the classmate's argument entirely? Or refute it in the paper? The user asks "whether to build on it or bury it." Building on it means accepting the critique and arguing Hume is wrong. Burying it means rejecting the critique and defending Hume. Given the flaws in the classmate's logic (especially #7), defending Hume is the safer and more scholarly path. I will advise them to **bury the critique** (i.e., refute it) and defend Hume's coherence.

      *Wait, one nuance:* The user says "My instinct is that (1) is too strong." I should validate this. Money *is* more than oil in Hume's short-run analysis. The classmate uses (1) to force the long-run neutrality onto the short-run process. That's the sleight of hand.

      *Okay, plan set.*
      1. Validate the panic.
