answer: |-
  First: breathe. You are nine days out, and you have just encountered a "Zeno's Paradox" of economic history. Your classmate's argument is seductive because it is internally consistent *if* you accept a static view of the economy. But Hume is a dynamic thinker, and the argument collapses the moment you reintroduce time and growth.

  **The Verdict:** **Bury it.** Do not build your paper on the claim that Hume is incoherent. Build your paper on *why* this critique fails, or better yet, set the critique aside and write a nuanced defense of Hume's distinction between the long-run neutrality of money and its short-run stimulative effects. The classmate's argument relies on a category error that is easy to dismantle once you see it, but dismantling it cleanly in nine days is risky if you aren't already deep into monetary theory.

  Here is the breakdown of where the argument breaks, answering your specific questions.

  ### 1. Which step do you reject?
  You need to reject **Step (4) (The "Drain Lemma")** and **Step (7) (The Price Revolution Application).**

  **Step (4) is the theoretical trap.** The classmate argues that because prices rise (due to the money injection), the money *must* flow out, terminating the stimulus. This assumes the "natural level" of money a country can hold is fixed *ex ante*.
  *   **The Humean Correction:** Hume explicitly states in *Of Money* that the influx of gold "quickens industry." If industry quickens, the volume of goods and transactions increases. If the volume of transactions increases, the economy *can support a larger stock of money* without prices rising proportionately.
  *   **The Fix:** The money doesn't necessarily drain out if the *demand for money* rises alongside the supply. The "Drain Lemma" assumes a static economy. In a growing economy, the new money is absorbed by new trade, not just higher prices.

  **Step (7) is the empirical blunder.** This is the easiest place to score points in your paper.
  *   **The Error:** The classmate treats the Specie-Flow Mechanism (Step 2) as a mechanism that determines the *absolute global price level*, rather than the *relative distribution of specie*.
  *   **The Humean Correction:** Hume's mechanism explains why *Britain* cannot hoard gold while *France* loses it. It explains equilibrium *between* nations. It does not predict that if *everyone* (all of Europe) gets more gold, prices must return to their old levels. If the global stock of money rises (American mines), and there is no "outside" world with less money to drain into (or if trade with Asia is limited), the global price level *should* rise and stay up.
  *   **Why it matters:** Hume predicts that an influx of money raises prices. The Price Revolution happened; prices rose. The classmate claims Hume predicts prices should have *fallen back down*. They wouldn't, unless the money left Europe. Since the American mines kept pumping, the money stayed, and prices stayed high. Hume's theory is consistent with the Price Revolution; the classmate's *application* of Hume is not.

  ### 2. Why did it look completely unobjectionable on a first read?
  Because it treats **Long-Run Neutrality** (Step 1 & 2) as if it applies instantaneously to the **Short-Run Process** (Step 3).

  *   **The Sleight of Hand:** The argument uses the "Oil" metaphor (Step 1) to discredit the "Stimulus" mechanism (Step 3). It says: "If money is just oil, it can't be fuel."
  *   **The Reality:** Hume agrees money is "oil" in the long run (equilibrium). But in the short run (the "interval"), money acts like *fuel*. It changes expectations. Workers see higher nominal wages and work harder *before* they realize prices have risen.
  *   **Why it stuck:** Your TA is right that (1) is the standard reading of Hume's *long-run* theory. The classmate's trick was smuggling that long-run constraint into the short-run analysis without telling you. It looks like logical consistency, but it's actually a temporal contradiction.

  ### 3. What does giving it up cost Hume?
  Nothing. In fact, rejecting Step (4) *saves* Hume from the charge of incoherence (Step 6).

  *   **Policy Coherence:** If you accept the "Drain Lemma," Hume's advice to magistrates to "keep money increasing" is indeed suicidal. But if you reject the lemma, Hume's advice becomes sophisticated growth policy. He is arguing for a *managed expansion* of credit/money to keep the "spirit of industry" alive, knowing that eventually, prices will adjust. He isn't trying to permanently trick the population (Step 5); he is trying to use the lag in price adjustment to generate real growth.
  *   **The "Illusion":** Step (5) calls the boost a "collective illusion." It is partially true (money illusion), but if that illusion results in more ships built, more cloth woven, and more skills learned, the *real wealth* of the nation has increased, even if the money eventually flows out or prices rise. The "illusion" has a real hangover, but it also leaves a real muscle.

  ### 4. Does (2) still do the anti-mercantilist work?
  **Yes, absolutely.** This is the most important point for your paper.

  *   **The Mercantilist Fear:** Mercantilists believed a nation must *hoard* gold to be wealthy. They feared losing gold meant losing power.
  *   **Hume's Hammer (Step 2):** The Specie-Flow Mechanism proves that hoarding is self-defeating. If you try to lock gold in a vault (or ban exports), your prices rise, your goods become uncompetitive, and the gold flows out anyway.
  *   **Independence from the Critique:** Even if the classmate is right about the "Drain Lemma" in a growth context, Step (2) still destroys Mercantilism. It proves that the *balance of trade* is self-correcting. A government cannot *permanently* alter the distribution of money through trade policy. That is the core anti-mercantilist insight, and it remains untouched by the classmate's critique of domestic stimulus.

  ### Strategy for Your Paper (9-Day Plan)

  **Thesis:** Hume's monetary theory is not incoherent; it is a dynamic model that distinguishes between the *distributional* effects of money (Specie-Flow) and the *stimulative* effects of money (The Interval). The apparent contradiction arises only if one mistakes Hume's long-run equilibrium for his short-run policy advice.

  **Outline:**
  1.  **Introduction:** State Hume's dual role: destroyer of Mercantilism (via *Of the Balance of Trade*) and theorist of growth (via *Of Money*).
  2.  **The Specie-Flow Mechanism:** Defend Step (2). Explain how it kills the Mercantilist idea that gold = wealth. (This satisfies your instinct that (2) is the strongest piece).
  3.  **The Interval:** Explain Step (3). Money is neutral in the long run, but non-neutral in the short run due to expectations/lags.
  4.  **The Critique (The "Drain Lemma"):** Briefly summarize the classmate's argument ( Steps 4-6).
  5.  **The Refutation:**
      *   **Dynamic Demand:** Argue that increased industry increases the demand for money, preventing the immediate "drain" (Refuting Step 4).
      *   **Global vs. Relative:** Clarify that the Specie-Flow mechanism governs *relative* stocks between nations, not absolute global price levels. The Price Revolution is consistent with Hume because the global stock increased (Refuting Step 7).
  6.  **Policy Implications:** Hume's advice isn't fraudulent; it's a recognition that in a growing economy, the money supply must expand to lubricate new transactions.
  7.  **Conclusion:** Hume successfully separates the *value* of money (long run) from the *velocity/activity* of money (short run).

  ### A Note on Step (1) and Your TA
  Your TA said (1) is "the least controversial thing." They are right *if* you qualify it.
  *   **Don't say:** "Money is just oil."
  *   **Do say:** "Hume posits money as neutral in the long-run equilibrium ('oil'), but acknowledges its causal power in the short-run transition ('fuel')."
  *   If you make that distinction, you keep the TA happy (you acknowledge the standard reading) but you block the classmate's trap (by denying that the long-run rule applies to the short-run process).

  ### Final Advice
  You walked into a trap because the argument was logically tight *within its own assumptions*. But those assumptions (static economy, confusion of relative/absolute price levels) are not Hume's.

  You don't need to solve the Price Revolution empirically. You just need to show that Hume's *theory* doesn't predict what the classmate says it predicts.
  *   **Classmate:** "Hume says prices must fall back."
  *   **You:** "Hume says money distributes itself according to art and industry. If American silver enters Europe, and European industry doesn't rise enough to absorb it, prices rise. They only fall if the money leaves. Since the mines kept pumping, the money didn't leave. Hume is consistent."

  Go with the **Dynamic Defense**. It allows you to keep the beautiful Specie-Flow thought experiment (2) while discarding the fatalistic "Drain Lemma" (4). It saves Hume's coherence, validates your instinct that money is more than just oil, and gives you a clear path to an A.

  You can find your way out. The door is labeled **"Dynamic Equilibrium vs. Static Equilibrium."** Walk through it.
