      3. Explain the "Dynamic Equilibrium" vs. "Static Equilibrium" error.
      4. Answer the specific questions (Which step? Why unobjectionable? Cost? Anti-mercantilist?).
      5. Provide a paper roadmap.

      *Let's check Step 7 again.* "Run the same reasoning on all of Europe... neighbours... nowhere outside Europe to drain it to."
