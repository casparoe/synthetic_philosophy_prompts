          *   Constraint: They agreed beforehand to maximize the Social Ledger. They cannot veto.
          *   *Crucial Tweak to avoid Coercion:* The "Veil of Ignorance" Lite. They agree to the *system* before knowing who is who. Or, as the prompt suggests, unanimous advance agreement to the *rules of aggregation*. Let's go with the Prompt's suggestion: Unanimous agreement to the "Maximize Total" rule *before* assignment of roles.
      *   *Round C (Interpersonal Separate):* Same 3 students. Separate ledgers.
          *   Student 3 needs to give 10 to Student 1 and 10 to Student 2 to replicate the "fair" outcome, or simply, transfers require consent.
          *   If Student 1 and 2 say "No" to losing 10, the trade doesn't happen.
          *   Result: Total might be lower, but no one is sacrificed.

