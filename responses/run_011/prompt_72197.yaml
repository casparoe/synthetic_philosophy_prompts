      *   *The Objection:* Utilitarianism treats society as a super-person. It sums utilities across persons like a single person sums utilities across time. Rawls says this ignores the distinction between persons. Nozick says there is no "social entity" to sacrifice.
      *   *The Pedagogical Challenge:* How to make students feel that summing across persons is categorially different from summing across time, *without* them just saying "I don't want to be forced."
