answer: |-
  ### Activity Title: "The Ledger and the Life"

  **Objective:** To phenomenologically distinguish between *intrapersonal aggregation* (prudence) and *interpersonal aggregation* (utilitarianism) without using theoretical terminology until the debrief.
  **Time:** 110 Minutes.
  **Class Size:** 16 Students.
  **Materials:**
  *   200 dried beans or poker chips (the "Utility").
  *   3 small bowls (labeled "Stage 1," "Stage 2," "Stage 3" for Round A; "Person 1," "Person 2," "Person 3" for Rounds B/C).
  *   1 large central bowl (labeled "The Social Ledger").
  *   Index cards (for "Investment Opportunities").
  *   4 Clipboards with "Auditor Sheets" (for non-acting students).
  *   A timer.
  *   **Stakes:** A bag of high-quality chocolates. The group that generates the highest *Total Utility* across all rounds wins the bag (to be shared). *Note: This incentivizes Round B logic, creating tension with Round C intuitions.*

  ---

  ### I. Conversion Scheme & Roles

  **The Math (Identical across rounds):**
  *   **Endowment:** 10 beans per stage/person.
  *   **The Cost:** Stage/Person 1 & 2 must transfer 10 beans each to Stage/Person 3. (End state: 0, 0, 30).
  *   **The Investment:** Stage/Person 3 holds 30 beans. They draw an Index Card: *"High Yield Project. Return: 50 beans."*
  *   **Final Total:** 50 beans. (Net gain of 20 over the starting 30).
  *   **Distribution:** In Round A, the "Self" keeps all 50. In Round B, the "Ledger" holds all 50. In Round C, Person 3 holds 50 *only if* 1 & 2 consented.

  **Roles (Rotating):**
  *   **Actors (3 students):** Sit at the head of the table. They hold the beans/bowls.
  *   **Auditors (13 students):** Divided into 4 teams.
      *   *Team 1 (Math):* Verify the bean counts.
      *   *Team 2 (Affect):* Record facial expressions/hesitation of Actors.
      *   *Team 3 (Language):* Tally specific words used (e.g., "we," "I," "fair," "rule").
      *   *Team 4 (Compliance):* Monitor rule adherence.
  *   **Rotation:** Rotate Actors every round so 9 distinct students experience the "hot seat." Auditors remain but switch teams.

  ---

  ### II. Minute-by-Minute Timeline

  **00:00 – 00:10: Setup & The "No-Theory" Rule**
  *   Arrange the table. Place beans in front of every student.
  *   **Instruction:** "We are playing three resource management games. The goal is to maximize the final bean count. Do not discuss ethics, justice, or rights. Discuss only strategy and rules. I will not answer questions about what is 'fair,' only what is 'permitted.'"
  *   Distribute Auditor Sheets.

  **00:10 – 00:30: Round A (The Single Life)**
  *   **Setup:** 1 Actor sits before 3 bowls labeled "Morning," "Noon," "Night."
  *   **Endowment:** 10 beans in each bowl.
  *   **Rule:** "You are one person across time. You may move beans between bowls. Any beans in 'Night' are multiplied by 1.6 (show Index Card: 30 becomes 50)."
  *   **Action:** The Actor moves beans from Morning/Noon to Night.
  *   **Outcome:** Morning/Noon are empty. Night has 50. Total: 50.
  *   **Auditor Task:** Note how quickly the decision was made.
  *   **Debrief Pause (2 mins):** "Was this rational?" (Expect unanimous yes). "Did anyone suffer?" (Expect: "No, it was just planning.")

  **00:30 – 00:50: Round B (The Social Ledger)**
  *   **Setup:** 3 *new* Actors. 3 bowls labeled "Person 1," "Person 2," "Person 3." 1 Central Bowl ("The Ledger").
  *   **The Coercion Fix (Crucial):** Before dealing beans, hold a vote. "To win the chocolate, we need high totals. Do we all agree that for this round, all beans belong to The Ledger, and individual bowls are just placeholders?" **Get unanimous verbal consent.** Have them sign a "Social Contract" on the whiteboard.
  *   **Endowment:** 10 beans in each Person bowl.
  *   **Rule:** "Maximize The Ledger. Transfers to Person 3 are mandatory if they increase the Ledger total. Individual ownership is suspended."
  *   **Action:** Actors must move beans from P1/P2 to P3. P3 converts to 50. P3 places 50 in The Ledger.
  *   **Outcome:** P1/P2 have 0. P3 has 0. Ledger has 50.
  *   **Auditor Task:** Record hesitation. Did P1/P2 physically resist handing over beans?
  *   **Debrief Pause (2 mins):** "The total is higher than Round A (50 vs 30 starting). Why does this feel different?"

  **00:50 – 01:10: Round C (Separate Ledgers)**
  *   **Setup:** 3 *new* Actors. 3 bowls. No Central Ledger.
  *   **Rule:** "Beans in your bowl are yours. You may trade, but no transfer happens without the giver's explicit verbal consent. No majority vote."
  *   **Action:** P3 asks P1/P2 for beans to invest.
  *   **Outcome:** *Likely Scenario:* P1/P2 refuse (fearing 0 return). P3 keeps 10. Total: 30. *Alternative:* They agree, Total: 50.
  *   **Auditor Task:** Record the justification for refusal or consent.
  *   **Debrief Pause (2 mins):** "The total might be lower. Did we fail?"

  **01:10 – 01:30: The Phenomenological Debrief (No Theory Yet)**
  *   (See Section III below).

  **01:30 – 01:45: The Theoretical Connection**
  *   **Instructor Lecture:** Now introduce the labels.
      *   **Round A = Prudence:** Rational planning within a single life.
      *   **Round B = Classical Utilitarianism:** Extending the principle of choice to society.
      *   **Round C = Rights/Constraints:** The separateness of persons as a moral constraint.
  *   **Rawls (*A Theory of Justice*, §5):** "Utilitarianism does not take seriously the distinction between persons." It treats the plurality of individuals as a single system of desires.
  *   **Nozick (*Anarchy, State, and Utopia*, Ch. 3):** "There is no social entity with a good of its own." Sacrificing one for another is not rational; it is a violation.
  *   **Discussion:** "Did Round B feel like Rawls's critique? Did Round C feel like Nozick's defense?"

  **01:45 – 01:50: Closing & Chocolate**
  *   Distribute chocolate based on the *Round B* total (acknowledging the utilitarian win) but allow the class to decide if they want to redistribute it (testing Round C intuitions).

  ---

  ### III. The Debrief: Ordered Questions

  **Q1: The Identity Question (Mapping Round A vs. B)**
  *   *Prompt:* "In Round A, the 'Morning' stage lost everything. In Round B, 'Person 1' lost everything. The math is identical. Why did Round A feel like *planning* and Round B feel like *sacrifice*?"
  *   *Target Intuition:* In A, the loser and winner are the *same subject* experiencing time. In B, they are *different subjects*.
  *   *Rawls Link:* This is the "unity of consciousness." A single mind can balance pains and pleasures across time. Society is not a single mind.

  **Q2: The Consent Question (Mapping Round B vs. C)**
  *   *Prompt:* "In Round B, you all agreed to the rules beforehand. You consented to the system. Why did Person 1 still feel violated when the beans were taken?"
  *   *Target Intuition:* General consent to a system does not negate the specific reality of individual loss. The "Social Contract" (Utilitarian calculus) overrides the specific will of the agent in the moment.
  *   *Nozick Link:* Rights function as side-constraints, not goals to be maximized. You cannot violate a boundary even for the greater good.

  **Q3: The Subject Question (The Core Objection)**
  *   *Prompt:* "In Round A, who felt the pain of the loss? Who felt the pleasure of the gain? In Round B, who felt the pain? Who felt the gain?"
  *   *Target Intuition:* In A, one subject feels both (netting out). In B, one subject feels pain, a *different* subject feels gain. They do not net out in experience.
  *   *Rawls Link:* "To use the loss of some to offset the gain of others is to fail to respect the distinction between persons."

  ---

  ### IV. Expected Failures & Recoveries

  **Failure 1: The "Futures Market" (Economics Student in Round C)**
  *   *Scenario:* In Round C, a student proposes: "Person 3, promise me 15 beans back from the 50, and I'll give you my 10."
  *   *Risk:* This solves the distribution problem and validates Utilitarianism via Coasean bargaining.
  *   *Recovery:** "Freeze. In this specific round, enforceable contracts are impossible. You must rely on trust. Person 1, do you *trust* Person 3?" (Usually, they don't).
  *   *Pedagogical Point:* This highlights why we need *rights* (Round C rules) rather than just *promises*. Rights secure the baseline against strategic betrayal.

  **Failure 2: The "Refuser" (Round B)**
  *   *Scenario:* A student in Round B says, "I don't care what we voted. I'm not giving up my beans."
  *   *Risk:* The game halts. The class focuses on the rule-breaking.
  *   *Recovery:** "Stop. This is data. You just prioritized your individual boundary over the Social Ledger. Note that on the Auditor Sheet. For the sake of the math, assume the beans *were* taken. Person 1, how does it feel to know the group *could* take them?"
  *   *Pedagogical Point:* This *is* the Separateness Objection in real-time. The student is asserting they are not a resource for the group. Validate this feeling as the philosophical core.

  **Failure 3: Bored Auditors**
  *   *Scenario:* Auditors zone out during bean counting.
  *   *Recovery:** Give them a "Veto Token." Each Auditor team has one red card. If they see a rule violation or a moral intuition being ignored, they can play the red card to pause the game for 30 seconds of comment. This gives them power.

  ---

  ### V. Candid Closing: The Limitation of the Activity

  **The Diagnosis:**
  Your suspicion is correct. The activity cannot reproduce the **phenomenological unity** of Round A. In Round A, the student *knows* they are one person. In Round B, the students *know* they are separate people. The game cannot make them feel like a hive mind. Therefore, the "Separateness of Persons" objection might feel trivially true to them ("Of course we're separate, we're different humans!"). They may miss the philosophical force: that Utilitarianism *reasons* as if we were one, not that it *claims* we are physically one.

  **The Salvage:**
  In the final 10 minutes, you must articulate this gap. Say the following:

  > "The game failed to make you feel like one person in Round B. You felt separate the whole time. But that is exactly Rawls's point. Utilitarianism asks you to *reason* as if you were one person—to sum our losses and gains into a single equation. The discomfort you felt in Round B wasn't just about losing beans; it was the friction between the *math* (which treated us as one) and the *reality* (which is that I suffer my pain, and you enjoy your gain, and those two things never meet). The theory asks us to ignore that boundary. Your intuition insisted on it."

  **Is the Coercion Fix Achievable?**
  Honest answer: **Partially.** You can mitigate the "tyranny" aspect by having them vote on the rules (The Social Contract), but you cannot eliminate the feeling of force when the beans are physically taken.
  *   *Why this is okay:* The "force" in Round B represents the **demandingness of the Utilitarian principle**. Even if I agree to be a Utilitarian, when the calculus demands I suffer for the greater good, it feels like a violation of my integrity.
  *   *Instruction:* If students complain "This is coercion," validate them. "Yes. Rawls argues that extending the rational choice of one person to a society *requires* a kind of coercion, because society isn't a person. If you feel coerced, you have successfully identified the distinction between persons." Turn their objection into the lesson.

  **Final Note:**
  Do not let the chocolate distribution resolve the tension. If they vote to share the chocolate equally after Round B (where Person 3 earned it all), point out: "You just rejected the Utilitarian distribution in favor of an Egalitarian one. Why? Because the 'Social Ledger' doesn't feel like a real owner." This cements the Nozickian point that there is no social entity to deserve the reward.
