  ### Phase 3: Mapping the Raw Material

  Here is where your seven quotes land in the tree. Note that two of them collapse into the same position.

  1.  **Scale (Yangzi vs. Lancashire):** Lands on **Node 7** (Whole Countries vs. Richest Provinces).
  2.  **Timing (1400 vs. 1850):** Lands on **Node 8** (Date Sensitivity).
  3.  **Counterfactual (Can't run experiment):** Lands on **Leaf 2** (Counterfactual Skeptic) and **Node 10** (Modeler vs. Empiricist).
  4.  **China Decoration (Placeholder):** Lands on **Node 3** (Foil Utility).
  5.  **China Lack (Quietly changed subject):** Lands on **Node 5** (Direction) and specifically **Leaf 7**.
  6.  **Trajectory (No principled way):** Lands on **Leaf 1** (Trajectory Skeptic).
  7.  **Ambiguity (4 different complaints):** Lands on **Node 1** (Root) and **Node 2** (Define vs. Prove).

  **Disguised Positions:** Quote (3) and Quote (7)'s "unanswerable" complaint are the same position in disguise. Both argue that without a runnable counterfactual, the causal claim is indeterminate. They land together on **Leaf 2**.

  ---

  ### Phase 4: Diagnostics

  **Unoccupied Leaves:**
  *   **Leaf 3 (Data Optimist):** Diagnosed as *Unattractive*. It is intellectually inconsistent to claim the question is flawed while asserting the data is sufficient to answer it.
  *   **Leaf 8 (Cultural Determinist):** Diagnosed as *Incoherent* in this branch. Cultural arguments typically function as "Britain Found" (culture of useful knowledge) rather than "China Lacked" without overlapping with institutional explanations.
  *   **Leaf 12 (Date Agnostic):** Diagnosed as *Merely Unexplored*. Historians are too obsessed with periodization to ignore timing entirely.

  **Indistinguishable Leaves:**
  *   **Leaf 14 (The Modeler) and Leaf 15 (The Empiricist):** In practice, these positions are often indistinguishable. Empiricists select data based on implicit counterfactuals, and Modelers calibrate to data.
  *   **Extra Question to Separate Them:** "Do you explicitly publish the alternative history model you used to select your data?"

  ---

  ### Phase 5: For the General Reader

  Standing on different leaves changes how you read history. If you stand on **The Trajectory Skeptic**, you read every "rise of the West" story as a fiction created by arbitrary start dates. If you stand on **The Secret China Question**, you read stories about British ingenuity as excuses for Chinese stagnation. If you stand on **The Regionalist**, national histories look like errors; you stop asking why "China" failed and ask why "Shanghai" didn't industrialize. The leaf you choose dictates whether you see the Industrial Revolution as a miracle, a crime, or a measurement error.
