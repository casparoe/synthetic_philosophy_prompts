  ### Phase 1: Brainstorming Candidate Branch Questions

  To build a taxonomy that captures the confusion rather than just the answers, I need questions that force a choice about the *structure* of the argument, not the content. Here are twelve candidate branch questions I considered:

  1.  Is the question about Britain's success or China's failure?
  2.  Does the answer change if we compare regions instead of nations?
  3.  Does the answer change if we pick a different start date?
  4.  Is the "not China" part necessary for the explanation, or just context?
  5.  Can we answer this without imagining history going differently?
  6.  Is the divergence a sudden jump or a long-term drift?
  7.  Are we looking for a cause Britain had or one China lacked?
  8.  Is the question logically coherent, or does it wobble when touched?
  9.  Is the problem with the question's definitions or the available evidence?
  10. Is the Industrial Revolution a unique event or a repeatable process?
  11. Do we need to explain why it happened *then* or just *there*?
  12. Is the comparison fair given what we know about both economies?

  **Cuts and Survivors:**
  *   **Cut #10 (Unique/Repeatable):** Redundant with #4 (Necessary/Context). If it's repeatable, China is just a control group; if unique, Britain is the anomaly.
  *   **Cut #11 (Then/There):** Redundant with #3 (Start Date). Timing covers both temporal and spatial specificity.
  *   **Cut #12 (Fair Comparison):** Too vague. "Fairness" is usually a proxy for #2 (Regions vs. Nations).
  *   **Cut #1 (Britain/China) & #7 (Had/Lacked):** Merged into a single node about the *direction of causality* (Success vs. Stagnation).
  *   **Cut #6 (Jump/Drift):** Merged into #8 (Coherence/Definitions). Defining the change is a prerequisite to defining the trajectory.
  *   **Cut #9 (Definitions/Evidence):** Merged into #8. Both are complaints about the question's stability.

  **Survivors (The Tree Structure):**
  1.  **Coherence:** Is the question stable or flawed? (Merges #8, #9, #6)
  2.  **Foil Utility:** Does mentioning China change the answer? (#4)
  3.  **Direction:** Is it about Britain's gain or China's lack? (#1, #7)
  4.  **Scale:** Are we comparing empires or regions? (#2)
  5.  **Timing:** Does the start date dictate the cause? (#3, #11)
  6.  **Verification:** Can we prove this without counterfactuals? (#5)
  7.  **Mechanism:** Is the cause local or global? (New, to expand leaf count)
  8.  **Type:** Is the flaw definitional or evidential? (New, to expand leaf count)

