  # PhD Seminar in Formal Epistemology: Final Examination

  **Question 4 (25 Marks)**
  **Recommended Time: 75 Minutes**

  **The Judy Benjamin Case**
  Judy has been dropped at night into a territory divided into a northern half ($N$) and a southern half ($S$), each subdivided into two sectors: North-East ($NE$), North-West ($NW$), South-East ($SE$), and South-West ($SW$). Her prior credence function $P$ is uniform over the four sectors, so $P(NE) = P(NW) = P(SE) = P(SW) = 1/4$. Consequently, $P(N) = P(S) = 1/2$.

  A headquarters radio operator whom she takes to be perfectly reliable transmits: "If you are in the north, then you are in the north-east sector, three chances in four." Judy acquires the constraint $Q(NE \mid N) = 3/4$ and nothing else. She seeks a posterior credence function $Q$.

  Jeffrey conditionalization, standardly formulated as $Q(A) = \sum_i Q(B_i) P(A \mid B_i)$ for a partition $\{B_i\}$, requires new unconditional probabilities for the cells of a partition. A constraint on a conditional probability supplies no such input directly. Four candidate resolutions are proposed:

  *   **(A)** Keep the north/south marginal at its prior: $Q(N) = 1/2$. This implies $Q(NE) = 3/8, Q(NW) = 1/8, Q(SE) = Q(SW) = 1/4$. *Rationale:* The message bears only on the distribution within the north.
  *   **(B)** Maximize Shannon entropy $H(Q) = -\sum Q_i \ln Q_i$ subject to the constraint. This yields $Q(NE) \approx 0.3505, Q(NW) \approx 0.1168, Q(SE) = Q(SW) \approx 0.2663$, so $Q(N) \approx 0.467$. *Rationale:* This minimizes reverse relative entropy $\sum Q \ln(Q/P)$ from the prior.
  *   **(C)** Minimize forward relative entropy $\sum P \ln(P/Q)$ subject to the constraint. Proponents claim this yields $Q(NE) = 0.6, Q(NW) = 0.2, Q(SE) = Q(SW) = 0.1$, so $Q(N) = 0.8$. *Rationale:* This maximizes $\sum P \ln Q$.
  *   **(D)** Read the transmission as the material conditional $N \supset NE$ and conditionalize on it strictly. This yields $Q(N) = 1/3$.

  **Answer the following:**

  **(i)** Explain precisely why the standard Jeffrey conditionalization rule cannot be applied directly to this case. Identify which specific inputs are missing and demonstrate why no choice of partition allows the rule to accept the constraint $Q(NE \mid N) = 3/4$ as its sole input. **(5 marks)**

  **(ii)** Verify by explicit computation the posterior probabilities for Candidate (A) and Candidate (B). For Candidate (C), compute the actual result of minimizing $\sum P \ln(P/Q)$ subject to the constraint using the uniform prior $P$. Compare your result for (C) with the figures stipulated in the case description above and account for any discrepancy. Briefly state the normative principle embodied by each of (A)–(C). **(8 marks)**

  **(iii)** Construct a generative model of the headquarters transmission. Define a proposition $E$ ("HQ sent this message") and assign likelihoods $P(E \mid \text{Sector})$ for each sector. Show whether strict conditionalization on $E$ ($Q(\cdot) = P(\cdot \mid E)$) reproduces the results of (A), (B), (D), or none of them. What does this imply about the relationship between updating rules and evidence description? **(8 marks)**

  **(iv)** The constraint "$P(NE \mid N) = 3/4$" is not obviously a proposition about the world. Briefly explain what would have to be true about the radio transmission process for acquiring this constraint to count as evidence in the ordinary sense suitable for strict conditionalization. **(4 marks)**

  ***

  # Model Answer

  **(i) Missing Inputs and Partition Failure**
  Standard Jeffrey conditionalization updates a prior $P$ to a posterior $Q$ using a partition $\{B_i\}$ and new unconditional probabilities $\{Q(B_i)\}$. The rule is $Q(A) = \sum Q(B_i)P(A \mid B_i)$. The input required is the set of values $\{Q(B_i)\}$. In the Judy Benjamin case, the input is a conditional constraint $Q(NE \mid N) = 3/4$. This fixes a ratio within the cell $N$, but fixes no unconditional probability $Q(N)$ or $Q(S)$.
  If we choose the partition $\{N, S\}$, we lack $Q(N)$. If we choose the partition $\{NE, NW, SE, SW\}$, we lack $Q(NE), Q(NW)$, etc., knowing only their ratio within $N$. No partition exists where the constraint provides the requisite unconditional cell probabilities without additional assumptions (such as preserving the marginal $Q(N)$). Thus, the rule is formally under-specified.

  **(ii) Verification and Principles**
  *Candidate (A):* Given $Q(N)=1/2$ and $Q(NE \mid N)=3/4$.
  $Q(NE) = Q(NE \mid N)Q(N) = (3/4)(1/2) = 3/8 = 0.375$.
  $Q(NW) = (1/4)(1/2) = 1/8 = 0.125$.
  Since the constraint bears only on $N$, $Q(S)=1/2$. By symmetry of prior on $S$, $Q(SE)=Q(SW)=1/4 = 0.25$.
  *Principle:* Minimal mutilation of marginals not mentioned in the evidence (Irrelevant Alternative).

  *Candidate (B):* Maximize $H(Q) = -\sum Q_i \ln Q_i$ subject to $Q(NE)=3Q(NW)$ and $\sum Q_i = 1$.
  By symmetry on $S$, let $Q(SE)=Q(SW)=y$. Let $Q(NW)=x, Q(NE)=3x$.
  Constraint: $4x + 2y = 1 \Rightarrow y = 0.5 - 2x$.
  $H(x) = -[3x \ln(3x) + x \ln x + 2(0.5-2x)\ln(0.5-2x)]$.
  Differentiating w.r.t $x$ and solving yields $x \approx 0.1168$.
  Thus $Q(NE) \approx 0.3505, Q(N) = 4x \approx 0.467$.
  *Principle:* Maximum Entropy (minimize information gain $D_{KL}(Q||P)$ for uniform $P$).

  *Candidate (C):* Minimize $D_{KL}(P||Q) = \sum P_i \ln(P_i/Q_i)$. With uniform $P$, this is equivalent to maximizing $\sum \ln Q_i$.
  Objective: Max $\ln(3x) + \ln x + 2\ln y$ subject to $y = 0.5 - 2x$.
  Function: $f(x) = \ln 3 + 2\ln x + 2\ln(0.5-2x)$.
  $f'(x) = \frac{2}{x} - \frac{4}{0.5-2x} = 0 \Rightarrow 1/x = 2/(0.5-2x) \Rightarrow 0.5 - 2x = 2x \Rightarrow 4x = 0.5 \Rightarrow x = 0.125$.
  Result: $Q(NW)=0.125, Q(NE)=0.375, Q(N)=0.5$.
  *Discrepancy:* The case description claims $Q(N)=0.8$. This is incorrect for the stated principle with a uniform prior. The principle actually reproduces Candidate (A).
  *Principle:* Minimum Forward Relative Entropy (often argued to preserve prior likelihoods).

  **(iii) Generative Model and Strict Conditionalization**
  To use strict conditionalization, we model the message $E$ as a stochastic event dependent on Judy's location. We need likelihoods $L(\omega) = P(E \mid \omega)$ such that $Q(\omega) \propto P(\omega)L(\omega)$.
  To reproduce **(A)**: We require $Q(N)=1/2$ (so average Likelihood in $N$ = average Likelihood in $S$) and $Q(NE)/Q(NW) = 3$ (so $L(NE)/L(NW) = 3$).
  Set $L(SE)=L(SW)=2$. Set $L(NW)=1, L(NE)=3$.
  Average $L(N) = (3+1)/2 = 2$. Average $L(S) = (2+2)/2 = 2$.
  Posterior $Q(NE) \propto (1/4) \times 3 = 3$. $Q(NW) \propto 1$. $Q(SE) \propto 2$. $Q(SW) \propto 2$.
  Normalizing (sum=8): $Q(NE)=3/8, Q(NW)=1/8, Q(SE)=2/8, Q(SW)=2/8$.
  This exactly reproduces **(A)**.
  *Implication:* The case does not show that conditionalization is insufficient, but that the evidence was misdescribed. If we model *why* the message was sent (the likelihoods), strict conditionalization suffices. The choice between (A) and (B) is a choice about the generative process of the evidence, not the updating rule.

  **(iv) The Nature of the Constraint**
  The constraint "$P(NE \mid N) = 3/4$" is a condition on a credence function, not a subset of the sample space (a proposition). For this to count as ordinary evidence, it must be the result of a physical process (the radio transmission) that can be modeled probabilistically. Specifically, there must be a fact of the matter about whether the message is sent, and the probability of it being sent must depend on the actual sector Judy occupies (as modeled in iii). Without this generative story, the constraint is a normative instruction, not empirical evidence.

  ***

  # Marking Scheme

  **Total Marks: 25**

  **Part (i) [5 Marks]**
  *   **1 mark:** Identifies Jeffrey's rule requires unconditional probabilities $Q(B_i)$ for a partition.
  *   **2 marks:** Explains the constraint provides only a ratio/conditional within $N$, not $Q(N)$.
  *   **2 marks:** Demonstrates that neither partition $\{N, S\}$ nor $\{NE, \dots\}$ works without extra assumptions.

  **Part (ii) [8 Marks]**
  *   **2 marks:** Correct derivation of (A) ($0.375, 0.125, 0.25$).
  *   **3 marks:** Correct derivation of (B) (setting up entropy function, solving for $x \approx 0.1168$).
  *   **2 marks:** Correct derivation for (C) showing it yields (A) ($x=0.125$), explicitly flagging the discrepancy with the prompt's figures ($0.8$).
  *   **1 mark:** Correctly identifying principles (Marginal preservation, MaxEnt, Min Cross-Ent).

  **Part (iii) [8 Marks]**
  *   **3 marks:** Constructs a likelihood model ($L(NE)=3, L(NW)=1, L(SE)=L(SW)=2$).
  *   **3 marks:** Shows via Bayes' rule that this reproduces (A).
  *   **2 marks:** Concludes that strict conditionalization works *if* evidence is described as a message event, shifting the problem to model selection.

  **Part (iv) [4 Marks]**
  *   **2 marks:** States the constraint is not a proposition/event.
  *   **2 marks:** Explains it requires a stochastic process correlation (likelihoods) to be evidence.

  **Specific Errors and Deductions**
  1.  **Applying Jeffrey's Rule directly to $\{N, S\}$:** Deduct **3 marks** (Part i/ii). *Diagnosis:* Confusing conditional constraints with unconditional partition inputs.
  2.  **Asserting (C)'s figures are correct without verification:** Deduct **2 marks** (Part ii). *Diagnosis:* Failure to check mathematical consistency of principles.
  3.  **Treating MaxEnt as the unique rational solution:** Deduct **2 marks** (Part ii/iii). *Diagnosis:* Misunderstanding MaxEnt as a neutral default rather than a substantive assumption about the source.
  4.  **Conditionalizing on $N \supset NE$ without critique:** Deduct **2 marks** (Part iii/iv). *Diagnosis:* Ignoring the well-known flaw of material conditionalization in this context (van Fraassen's point).
  5.  **Claiming Strict Conditionalization is impossible here:** Deduct **3 marks** (Part iii). *Diagnosis:* Failing to distinguish between the *rule* and the *description of evidence*.

  ***

  # Examiners' Meeting Commentary

  A first-class answer distinguishes itself by successfully constructing the generative likelihood model in part (iii) to show that strict conditionalization can reproduce the intuitive result (A), thereby reframing the problem from one of logic to one of evidence modeling. A strong second-class answer will correctly perform the entropy calculations in part (ii) but will likely treat the updating rules (Jeffrey vs. Strict) as mutually exclusive competitors rather than recognizing that strict conditionalization subsumes the others given an appropriate model of the message source.
