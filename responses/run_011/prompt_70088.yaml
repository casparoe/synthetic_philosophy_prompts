      *   **Task:** Diagnose the impasse (not verdict). Classify the disagreement (substantive, verbal, different questions, hidden textual/historical, bedrock intuitions). Support with textual moves. Distinguish Guide-vs-Code tension from Nahmanides' objection. Suggest what counts as progress (or if none is possible). Evaluate the legal theory analogy (obsolete statutes).
