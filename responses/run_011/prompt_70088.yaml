  2.  **Deconstruct the Impasse:**
      *   *The Core Tension:* Maimonides' *Guide of the Perplexed* (III:32, III:46) suggests sacrifices are a concession to historical circumstance (to wean Israelites off idolatry). *Mishneh Torah* (Laws of Kings, Laws of Temple Vessels, etc.) codifies them meticulously and predicts their return in the Messianic era.
      *   *Camp 1 (Reductionist/Esoteric):* Prioritizes the *Guide* as the "real" philosophy. Treats the *Code* as exoteric/nominalist.
      *   *Camp 2 (Traditionalist/Legalist):* Prioritizes the *Code* as binding practice. Treats the *Guide* as explanatory but not eliminative.
      *   *Nahmanides:* Attacks the historical premise itself, not the tension between books.

  3.  **Classify the Disagreement:**
      *   Is it verbal? No, it's not just about the definition of "ta'amei ha-mitzvot" (reasons for commandments).
      *   Is it substantive? Yes, but it's layered.
      *   *Layer 1: Hermeneutics of Esotericism.* Camp 1 assumes Maimonides hides truth in the *Guide* and conforms in the *Code*. Camp 2 assumes Maimonides speaks truth in both, but for different purposes (theory vs. practice).
      *   *Layer 2: Philosophy of Law.* Can a law's origin (historical concession) negate its validity (divine will)? Camp 1 says yes (genetic fallacy applied normatively). Camp 2 says no (origin $\neq$ status).
      *   *Layer 3: Textual Authority.* Which book represents the "real" Maimonides?

  4.  **Analyze the "Hidden" Factors:**
      *   *Genre:* *Guide* is philosophical/theological (addressed to the perplexed elite). *Mishneh Torah* is halakhic (addressed to the community/judges).
      *   *Audience:* The *Guide* explains *why* God commanded this *then*. The *Code* explains *how* to do it *now* (and in the future).
      *   *Messianic Passage:* *Laws of Kings* 11:1. Camp 1 reads it as "halakhic necessity" (the law says X, so the Messiah does X). Camp 2 reads it as "teleological fulfillment."

  5.  **Distinguish Nahmanides' Objection:**
      *   Nahmanides isn't arguing about the tension between Maimonides' books. He is arguing against Maimonides' *historical claim* in the *Guide*.
      *   Maimonides: Sacrifice exists *because* of idolatry.
      *   Nahmanides: Sacrifice exists *before* idolatry (Abel/Noah). Therefore, Maimonides' reason is factually wrong.
      *   *Categorization:* The Seminar's impasse is *intra-Maimonidean* (how to reconcile his own corpus). Nahmanides is *inter-author* (external critique of Maimonides' premise). Conflating them muddies the water.

  6.  **Evaluate the Legal Theory Analogy:**
      *   *Analogy:* Obsolete-but-valid statutes (e.g., laws about horse thieves that remain on books but aren't enforced, or archaic procedural rules).
      *   *Fit:* It fits Camp 1 well (archive of defunct institution).
      *   *Mismatch:* It fails Camp 2 because for them, the statute isn't "obsolete," it's "dormant." A dormant law expects reactivation. An obsolete law does not. The Messianic expectation makes it dormant, not obsolete.
      *   *Verdict:* The analogy illuminates Camp 1's mindset but obscures the theological stakes for Camp 2.

  7.  **Determine Path to Progress:**
      *   Since this is a graduate seminar, "progress" isn't solving Maimonides, but clarifying the disagreement.
