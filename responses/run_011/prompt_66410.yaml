  1. **Lewis vs. Infinite Solutions**
  You are not mangling Lewis, but you have found the boundary of his analysis. Lewis's resolution relies on the "full set of facts" being fixed. In the billiard-ball case, the initial data does not fix the facts; the consistency constraint selects a subset of possible futures, but leaves infinitely many within that subset. Lewis's "cannot" derives its content from the *actual* outcome (Grandfather died of natural causes). In the EKT scenario, until the interaction occurs, there is no single actual outcome fixed by the past. Lewis's account works *ex post* (once the history is settled, consistency explains why alternatives didn't happen), but it is silent *ex ante*. It offers no mechanism for selecting *which* consistent solution obtains. He explains why contradictions fail, not how specific histories succeed. On the underdetermination of the facts themselves, Lewis has nothing to say.

  2. **Multiplicity vs. Self-Consistency**
  The result vindicates the logical core of the self-consistency principle (no contradictions arise) but embarrasses its physical utility (determinism collapses). Lewis argued that paradoxes are prevented by "odd coincidences." EKT mechanized the coincidence: the collision *is* the prevention. This removes the metaphysical mystery but replaces it with a dynamical crisis. The "conspiracy" is no longer luck; it is a boundary condition enforced by the geometry. This is the old fine-tuning worry in costume, but worse: it isn't just that parameters must be precise, but that the laws themselves fail to pick a unique evolution. It saves consistency at the price of predictability.

  3. **Hawking and Exotic Matter**
  Hawking's conjecture is a physical enforcement of Lewis's logical ban. Lewis says "you can't kill Grandfather"; Hawking says "you can't build the gun." It is a refusal of the question via physical impossibility rather than logical analysis. Be blunt: yes, this is a thought experiment wearing a lab coat. The entire episode rests on macroscopic exotic matter, which remains unobserved and theoretically dubious. Without it, the wormhole collapses before becoming a time machine. The episode adjudicates nothing about the actual world; it maps the internal consistency limits of General Relativity when pushed beyond physical plausibility. Hawking saves causality by killing the machine, rendering the billiard ball moot.

  4. **Your Trilemma**
  This is a taxonomy, not a trilemma. You are conflating layers of description with competing options. Lewis handles the metaphysics of consistency (the logical floor). EKT/Novikov handles classical dynamics within that consistency (showing underdetermination). Deutsch handles quantum dynamics (restoring predictive uniqueness via probabilities). You do not choose between them; you stack them. The "multiplicity tax" is real—it is the cost of upgrading from classical to quantum descriptions to regain determinism—but framing it as a trilemma suggests mutual exclusivity where there is only sequential refinement. It is a category confusion to treat them as alternative scores in the same game. They are different games played on the same board.

  Verdict: LEWIS-EXTENDED — Logic holds; physics adds underdetermination he ignored.
