  # JOINT STATEMENT ON THE CONCEPT OF DISEASE
  **Prepared by:** The Naturalist Representative and The Normativist Representative
  **Date:** October 24, 2023
  **Seminar:** Philosophy of Medicine 601

  ## I. AGREED CLAIMS

  1.  **Biological Substrate:** Paradigmatic diseases involve a deviation from typical biological functioning, not merely a social deviation. [Normativist*]
  2.  **Statistical Insufficiency:** Statistical abnormality alone is insufficient to classify a condition as a disease (e.g., exceptional height or intelligence are not diseases).
  3.  **Case 2 (Incidental Prostate Cancer):** We agree that biological pathology can exist without constituting a clinical disease requiring intervention when life expectancy precludes harm.
  4.  **Case 3 (Congenital Anosmia):** We agree that the subject's lack of distress mitigates the claim that this is a disease, though we disagree on whether it negates the biological dysfunction.
  5.  **Case 4 (Male-Pattern Baldness):** We agree this is not a disease, despite being a statistically typical biological change, because it lacks significant functional impairment in standard environments.
  6.  **Case 5 (Evening Chronotype):** We agree that the harm associated with this condition is produced primarily by the mismatch between biology and social scheduling, not by the biology alone.
  7.  **Reference Class Selection:** The selection of a reference class (e.g., industrialized vs. non-industrialized blood pressure baselines) cannot be completed solely by empirical data; it requires a judgment about which environment is relevant for assessment. [Naturalist*]
  8.  **Biological Constraints:** Normative judgments about disease are constrained by biological facts; one cannot coherently label a state of superior physiological efficiency as a disease. [Normativist*]
  9.  **Case 1 (Prediabetes):** We agree that risk of future harm is sufficient for clinical monitoring but disagree on whether it constitutes "disease" status in the absence of current functional impairment.
  10. **Hybrid Costs:** We agree that hybrid analyses (dysfunction plus harm) gain extensional adequacy but lose theoretical unity, making boundary cases (like Case 6) persistently unstable.
  11. **Clinical Utility:** Any acceptable definition of disease must be able to guide resource allocation and treatment prioritization without generating absurd results.
  12. **Case 6 (Blood Pressure):** We agree that defining "normal" blood pressure requires choosing a population baseline, and that choosing the industrialized baseline normalizes a state that may be pathological relative to human evolutionary history.

  *\*Indicates a claim signed reluctantly, representing a concession to the opposing view.*

  ## II. DISAGREEMENTS TABLE

  | Issue | Naturalist Wording | Normativist Wording | Status | Shared Case/Consideration |
  | :--- | :--- | :--- | :--- | :--- |
  | **Metaphysical Status** | Disease is a value-free natural kind discovered by biology. | Disease is a value-laden concept constructed to track harm and entitlement. | **Survives** | Case 4 (Baldness): Is it non-disease because it's functional or because it's not bad? |
  | **Reference Class (Case 6)** | The reference class should be the species-typical design environment; deviations are objective facts. | The "design environment" is a normative selection; choosing it privileges certain lifestyles over others. | **Survives** | Case 6 (BP): Industrial vs. Non-industrial baseline. |
  | **Risk vs. State (Case 1)** | High probabilistic risk of dysfunction constitutes current dysfunction. | Risk is evidence of potential disease, but disease requires present harm or impairment. | **Dissolves** | Case 1 (Prediabetes): Agreed on treatment, disagreed on label. |
  | **Subjective Experience (Case 3)** | The subject's acceptance is irrelevant to the biological fact of dysfunction. | The subject's experience is constitutive of whether the condition is a disease for *them*. | **Survives** | Case 3 (Anosmia): Is it disease if the patient is happy? |
  | **Social Arrangements (Case 5)** | Social mismatch reveals the dysfunction; the dysfunction exists independently of the schedule. | Social arrangements create the dysfunction; without the 8 AM start, the chronotype is neutral. | **Survives** | Case 5 (Chronotype): Who changes—the person or the school? |

  ## III. VERBAL VS. SUBSTANTIVE DISPUTE

  **Merely Verbal:**
  A portion of our disagreement stems from the scope of the term "disease." The Naturalist uses "disease" to denote a biological substrate that *might* warrant intervention. The Normativist uses "disease" to denote a condition that *does* warrant intervention or exemption. When the Naturalist says "This is a disease but need not be treated" (Case 2) and the Normativist says "This is not a disease if it need not be treated," we are often aligning on the clinical facts while disputing the label.

  **Substantive:**
  The dispute is substantive regarding the **authority of biology**. If the Naturalist is correct, biology can override social consensus (e.g., a society that values anemia would still be wrong). If the Normativist is correct, social consensus can override biological statistics (e.g., a society that accommodates all chronotypes eliminates the disease status of eveningness). This affects policy: do we fix the person or the environment? The disagreement over Case 5 (Chronotype) and Case 6 (Blood Pressure) confirms this is not merely semantic; it dictates different public health interventions.

  ## IV. FALSIFICATION CONDITIONS

  **For the Naturalist:**
  My view would be undermined if it were demonstrated that **no reference class can be specified without invoking a normative judgment about which forms of life are desirable.** Specifically, if Case 6 (Blood Pressure) shows that "species-typical functioning" is incoherent without selecting a preferred environment, the claim that disease is value-free collapses.

  **For the Normativist:**
  My view would be undermined if it were demonstrated that **biological dysfunction predicts treatment need better than normative assessment.** If we find cases where patients report no harm and society imposes no penalty, yet biological correction significantly extends life (unknown to the patient), and we still classify it as disease, then biology is doing the heavy lifting, not evaluation.

  ## V. CRUX RANKING

  We rank the following candidate cruxes by how much settling them would actually move the debate, from most decisive to least:

  1.  **A.** Whether a reference class can be fixed without a prior judgment about which environment is the right one to measure against.
  2.  **E.** Whether "disease" has fixed descriptive content at all, or is largely an honorific tracking entitlement to treatment and exemption.
  3.  **D.** Whether social arrangements can convert a normal variation into a disease.
  4.  **B.** Whether risk of future harm, with no present harm, makes a condition a disease now.
  5.  **C.** Whether the subject's own experience of their condition is constitutive of diseasehood or only evidence about it.
  6.  **F.** Whether settling the concept would change any actual clinical or policy decision.

  Most decisive crux: A
