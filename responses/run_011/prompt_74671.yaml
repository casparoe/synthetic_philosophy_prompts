answer: |-
  Your hunch is correct: the deadlock is not textual but conceptual. Both camps read the same words because the ambiguity lies not in the manuscript tradition but in the juridical ontology Aquinas inherits and refracts. The disagreement is ultimately over where coercive power resides when the hierarchy is corrupted—a question Aquinas leaves deliberately under-specified.

  The core issue is the **location of agency**. Camp A assumes that when a ruler usurps power, authority reverts residually to the community, which can then act as a "public" body to execute judgment. Camp B assumes that "public authority" is strictly hierarchical; without a superior human judge (like an Emperor over a King), the community lacks the juridical personality to wield the sword, leaving remedy only to God. Aquinas never explicitly resolves this because doing so would require a theory of popular sovereignty he does not possess, or else risk inciting the very sedition he warns against in *De Regno*.

  Consequently, the fight over genre and period (early *Sentences* vs. mature *Summa*) is a proxy for this deeper juridical gap. Scholars privileging the *Sentences* seek a loophole for resistance; those privileging *De Regno* seek a principle of order. Neither is wrong about the texts, but both are projecting modern questions of legitimacy onto a medieval framework of obedience where the "public" is not easily separable from the "ruler."

  **What counts as progress:**
  Progress in your chapter will not come from proving one camp right. Instead, it comes from reframing the question from "Does Aquinas permit tyrannicide?" to "Under what conditions of juridical personality does Aquinas allow lethal force against a superior?" You should look into medieval corporate theory (the *populus* as a *corpus mysticum*) to see if Aquinas grants the community enough legal standing to act as a public authority without a head. Acknowledge that the ambiguity may be pastoral prudence rather than theoretical inconsistency: he leaves the loophole open for extreme cases without providing a manual for rebellion.

  **Whether to expect resolution:**
  Do not expect a smoking gun. Aquinas is writing theology and counsel, not constitutional law. The texts are polyvalent by design to balance the duty of obedience with the demands of justice. Your goal should be to map the tension rather than resolve it. Showing *why* the secondary literature is stuck (because the source material balances on a knife-edge between order and justice) is a significant contribution in itself.

  Diagnosis: Ambiguity of Public Agency
