prompt: |-
  I chair the program review panel of a mid-sized private foundation whose board was deliberately constituted, forty years ago, out of two blocs with genuinely incompatible moral outlooks: a faith-based bloc for whom certain acts are wrong in themselves regardless of consequences and who treat the foundation's endowment as held in trust for a particular community of beneficiaries, and a secular bloc that reasons almost entirely about aggregate outcomes and is willing to fund anything that demonstrably reduces suffering. Every allocation decision needs a two-thirds vote, so neither bloc can govern alone and both have learned to negotiate. Last night I argued for two hours with a friend who teaches philosophy, and he was not impressed by the way I described my job. His line, roughly, was this: the whole talk of gains from trade between value systems quietly assumes there is some common currency in which each side's stakes can be measured and compared, and none of these outlooks grants that — the faith bloc denies that its prohibitions have a price at all, and the secular bloc denies that anything but outcomes can be traded — so what I call a compromise is really either one side's capitulation with a receipt attached, or the mechanical reproduction of whichever side has the stronger fallback position, since the disagreement point that any such bargain is measured against is fixed by the standing rules and the endowment, which is to say by power rather than by morality. I want to know whether he is right, and if he is partly right, whether a usable procedure can still be built inside the part he is wrong about.

  So I am asking for a decision procedure my panel can actually run on a contested item, not an essay about whether moral compromise is coherent. The constraints are these: we meet quarterly and each meeting carries eight to fourteen contested allocations; the panelists are practitioners — a hospital administrator, two program directors, a retired judge — none of whom has any training in ethics and none of whom will read anything longer than two pages; I have about forty minutes per item, and I chair and must produce a recommendation that survives a twenty-one-member board vote. The procedure needs to state the questions in the order they should be asked, what counts as a sufficient answer to each, where it terminates in a flat no, and where it deliberately hands the question to a human being because the issue is one of value rather than fact. It has to handle the hard cases explicitly rather than wave at them: how to classify what is actually on the table, since a genuine trade looks identical from the outside to a truce, to a split-the-difference fudge, and to a surrender; whether trades may cross domains (a bloc abstaining on program A in exchange for money flowing to unrelated program B) or must stay within one domain, and what follows from each choice; how to treat claims about the intensity of a moral stake when intensity is unverifiable and obviously worth overstating; whether randomizing between two disputed policies — funding one this year and the other next, or drawing lots — is ever available, given that it presupposes the parties accept reasoning in expected terms and one of them may not; what happens when a party refuses to state its position in tradeable form at all; whether we should keep a running ledger of past concessions across items and years, and whether keeping such a ledger corrupts the thing it is meant to record; and what standing, if any, belongs to the people affected by a decision who are not at the table and cannot consent, including a bloc that claims to speak on their behalf. Please also be honest about which of your steps are judgment calls wearing procedural clothing.

  Then run it on three items from this year's docket. First, a family-planning program that the secular bloc values highly on outcome grounds and that the faith bloc opposes as complicity in something it holds intrinsically wrong, with a palliative-care program on the same docket that the faith bloc cares about intensely and the secular bloc rates as merely moderately cost-effective — an obvious candidate for a trade, and I want to see the procedure either construct that trade or explain why it cannot. Second, an item where both blocs mildly favour the program but each has told me privately that its support is conditional on the other bloc dropping an unrelated proposal; tell me whether the procedure should let that condition count, and what it does to the rest of the docket if it does. Third, a proposal I personally want to make: funding two mutually exclusive interventions in alternate years by lot, so that each bloc gets its way half the time and neither has to concede anything in principle. I suspect the procedure should reject this and I would rather it told me so plainly and said why than accommodate me. Finally, close with a residue report: which parts of the gains-from-trade idea you had to discard to make the thing runnable, which distinctions you insisted on preserving, and a short statement of what this procedure cannot do — the class of disputes it will systematically mishandle or fail to resolve, so that I know when to stop chairing and simply let an item die.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Chair of a program review panel at a mid-sized private foundation.
      *   **Context:** Board constituted 40 years ago with two incompatible moral blocs (Faith-based/Deontological vs. Secular/Consequentialist).
      *   **Governance:** 2/3 vote required for allocation. Neither bloc can rule alone. Negotiation is standard.
      *   **The Conflict:** A philosopher friend argues that "gains from trade" assumes a common currency that doesn't exist. Compromise might just be capitulation or power plays disguised as morality.
      *   **The Task:** Create a *usable decision procedure* for the panel (not an essay).
      *   **Constraints:**
          *   Quarterly meetings, 8-14 contested items.
          *   Panelists: Practitioners (admin, directors, judge), no ethics training.
          *   Reading limit: 2 pages.
          *   Time limit: ~40 minutes per item.
          *   Output: Recommendation surviving a 21-member board vote.
          *   Must handle hard cases explicitly (trade vs. truce vs. surrender, cross-domain trades, intensity claims, randomization, refusal to trade, ledgers of concessions, standing of affected outsiders).
          *   Must admit where judgment calls are wearing procedural clothing.
      *   **Test Cases:**
          1.  Family Planning (Secular Pro/Faith Anti) vs. Palliative Care (Faith Pro/Secular Moderate) -> Can a trade be constructed?
          2.  Conditional Support (Both mild pro, but conditional on unrelated drop) -> Allow conditions?
          3.  Alternating Years by Lot (Chair's proposal) -> Should procedure reject this?
      *   **Closing:** Residue Report (what was discarded, what preserved, limitations/failure modes).

  2.  **Deconstruct the Philosopher's Critique:**

      *   *Claim:* No common currency. Faith says "no price," Secular says "only outcomes matter."
      *   *Implication:* Compromise is fake; it's power dynamics.
      *   *Counter-argument for Procedure:* Even if incommensurable *in principle*, they are commensurable *in practice* via the voting rule (2/3). The "currency" is the vote, not utility or sanctity. The procedure needs to acknowledge the incommensurability while facilitating the vote. It shouldn't pretend to solve the metaphysical dispute, but rather manage the political reality without corruption.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Goal:* Keep it under 2 pages equivalent (concise, structured).
      *   *Structure:* Phased approach. Screening -> Classification -> Negotiation -> Decision.
      *   *Key Issues to Address:*
          *   *Incommensurability:* Don't try to measure "moral intensity." Measure "willingness to support."
          *   *Trades:* Allow cross-domain (logrolling) but require transparency.
          *   *Intensity:* Ignore unverifiable claims. Focus on veto threats.
          *   *Randomization:* Generally reject unless it solves a deadlock without violating core prohibitions.
          *   *Ledgers:* Dangerous (corrupts moral stance), but tracking *votes* is necessary.
          *   *Outsiders:* Beneficiaries cannot consent, but their suffering/benefit is the *object* of the dispute, not a voice at the table.

      *   *Drafting Steps:*
          1.  **Phase 1: Classification.** Is this a "Veto Issue" (intrinsic wrong) or a "Weight Issue" (priority)?
          2.  **Phase 2: The Trade Test.** Can support be exchanged without requiring moral complicity?
          3.  **Phase 3: The Vote.**
          4.  **Specific Rules:** No lotteries on intrinsic wrongs. No ledgers of "favors."

      *   *Refining for Constraints:* Needs to be punchy. Bullet points. Clear "Stop/Go" signals.

  4.  **Developing the Test Cases:**

      *   *Case 1 (Family Planning vs. Palliative):* Classic logroll. Faith bloc can't vote *for* family planning. Secular bloc can vote *for* Palliative. Trade: Faith abstains (or votes no, but doesn't block) on FP; Secular votes Yes on Palliative. *Procedure Check:* Does this violate Faith's "complicity"? If voting Yes funds it, they must vote No. But if the 2/3 rule allows passage despite their No, they aren't complicit *if* they speak against it. Wait, the constraint is 2/3 vote. If Faith votes No, Secular needs *some* Faith votes or unanimous Secular + some Faith. Actually, if the blocs are roughly equal (implied by "neither can govern alone"), Secular needs Faith votes.
      *   *Correction:* If Faith believes FP is intrinsically wrong, they cannot vote *for* it. Can they abstain? Maybe. Can they trade? They can vote for Palliative. Secular can vote for FP. If the votes are bundled, that's one thing. If separate, Secular needs Faith votes on FP. Faith won't give them. So the trade must be: Faith votes Yes on Palliative; Secular votes Yes on FP. *Wait*, if Faith votes No on FP, and Secular is only 1/3 + epsilon, FP fails. So Secular needs Faith votes on FP. Faith won't give. *Unless* the trade is: We fund Palliative *instead* of FP? No, the prompt implies both are on the docket.
      *   *Re-reading the dynamic:* "Neither bloc can govern alone." This implies each bloc has > 1/3 votes. To pass (2/3), you need cross-bloc support.
      *   *Case 1 Resolution:* Faith cannot vote for FP. So FP *must* fail unless Secular gets >2/3 alone (impossible) or Faith abstains (counts as not voting? Usually 2/3 of *present* or *members*? Assume *members*). If 2/3 of *members*, abstention helps the No side. So FP likely fails. *However*, the trade is: Secular ensures Palliative passes (Faith Yes, Secular Yes). Faith ensures FP fails (Faith No, Secular Yes but not enough). *Wait*, Secular values FP highly. They won't let it fail just to get Palliative.
      *   *Alternative:* The trade is temporal or package-based. But the prompt asks to "construct that trade or explain why it cannot."
      *   *Crucial Distinction:* If Faith views FP as *complicity*, they cannot vote for it. If the procedure allows "I won't block your project if you fund mine," that's a negative trade. But with a 2/3 threshold, blocking is easy.
      *   *Better Resolution:* The trade is on the *Palliative* side. Secular agrees to fund Palliative (which they find moderately effective) in exchange for Faith not *actively campaigning* against FP outside the foundation? No, keep it internal.
      *   *Realistic Outcome:* FP fails (Veto). Palliative passes (Consensus). The "trade" is that Secular accepts the loss of FP to maintain the relationship for Palliative. The procedure must identify FP as a "Veto Issue" where trade is impossible on the vote itself.
      *   *Case 2 (Conditional Support):* "I'll support X if you drop Y." This is hold-up behavior. Procedure should flag this as toxic to the process. It turns every item into a hostage situation. Recommendation: Reject conditional votes. Vote on merit of the item.
      *   *Case 3 (Lottery):* Chair wants to alternate years by lot. Procedure should reject. Why? Because it treats moral truth as probabilistic. If FP is wrong, it's wrong every year. If Palliative is good, it's good every year. Randomization implies moral agnosticism the Faith bloc cannot accept.

  5.  **Refining the Procedure (The "Two-Page" Constraint):**

      *   Need to be extremely dense but readable.
      *   Use bold headers.
      *   Include the "Honesty Clause" about judgment calls.

  6.  **Addressing the Philosopher's Critique in the Design:**

      *   Acknowledge there is no common currency. The "currency" is *votes*, not *values*.
      *   The procedure doesn't resolve the moral conflict; it manages the *coexistence* of the conflict.
      *   Distinguish between "Complicity" (voting for wrong) and "Allowance" (permitting others to act).

  7.  **Final Review against Constraints:**

      *   40 mins/item? Yes, steps are linear.
      *   Practitioners? Yes, plain language.
      *   Hard cases? Yes, addressed in the rules.
      *   Residue Report? Yes, at the end.

  8.  **Self-Correction/Nuance Check:**

      *   *Ledgers:* The prompt asks about keeping a ledger of concessions. My instinct is "No, it corrupts." But "No" creates amnesia. Solution: Track *outcomes* (funding levels), not *intentions* (favors).
      *   *Outsiders:* Beneficiaries have no standing to consent, but their *interest* is the subject. The Faith bloc claims to speak for them (or God). The Secular bloc claims to speak for their suffering. The procedure treats these as *claims made by board members*, not external testimony.
      *   *Randomization:* Be firm. It undermines the deontological stance.
      *   *Case 1:* Be precise. If FP is intrinsically wrong, Faith cannot vote Yes. If 2/3 is required, and Faith is >1/3, FP dies. The trade is Secular accepting this death in exchange for Palliative life. Is that a trade? It's a *settlement*. The procedure must distinguish "Trade" (both get Yes) from "Settlement" (one gets Yes, one gets No, but peace is kept).
      *   *Wait, can Secular vote No on FP?* They value it highly. They won't. So FP dies. The "trade" is that Secular doesn't walk away from the foundation. The procedure needs to validate that *non-decision* is a valid outcome.

      *(Self-Correction on Case 1)*: Actually, if the Secular bloc values FP *highly* and Palliative *moderately*, and Faith values FP *negatively (sin)* and Palliative *highly*, the utilitarian calculus suggests swapping. But the Deontological calculus forbids the swap on FP. So the procedure must identify FP as "Non-Tradeable on the Affirmative." The outcome is FP rejected, Palliative accepted. The "gain" is institutional stability.

      *(Self-Correction on Case 2)*: Conditional support. If allowed, it creates a combinatorial explosion of dependencies. Procedure should ban explicit conditional voting *on the record*. Private negotiations happen, but votes must be unconditional.

      *(Self-Correction on Case 3)*: Randomization. Definitely reject. It violates the "truth claim" of both sides.

  9.  **Final Polish:** Ensure tone is authoritative, pragmatic, and humble about limitations. (The "Residue Report" is key here).

      *   *Structure:*
          1.  The Procedure (The "Protocol").
          2.  Application to Three Cases.
          3.  Residue Report.

      *   *Word Count Check:* Keep the procedure tight. The analysis can be more expansive but stay focused.

      *(Final thought on the Philosopher)*: The friend is right that there's no *moral* common currency. But there is a *procedural* one (the vote). The procedure must not pretend to reconcile the morals, only to process the votes without lying about what they mean.

      *Let's write it.*
answer: |-
  # THE FOUNDATION PROTOCOL FOR CONTESTED ALLOCATIONS (FPCA)

  **Purpose:** To facilitate funding decisions when moral premises are incompatible. This protocol does not resolve moral disagreements; it prevents them from paralyzing the foundation. It treats votes as commitments, not measurements of value.

  **Time Budget:** 40 Minutes per Item.
  **Participants:** Program Review Panel (Chair + 4).
  **Reading Limit:** This document only.

  ---

  ### PHASE 1: CLASSIFICATION (10 Minutes)
  *Goal: Determine if the item is tradeable.*

  **Q1: Is the objection based on *Outcomes* (ineffective/wasteful) or *Principles* (intrinsically wrong/complicity)?**
  *   **Outcomes:** Proceed to Phase 2.
  *   **Principles:** Proceed to Q2.

  **Q2: Does funding this item require the objecting bloc to *act* (vote Yes) or merely *permit* (abstain or vote No while others pass it)?**
  *   **Act:** If the objecting bloc holds >1/3 votes, this item is **Dead**. Do not negotiate. A vote of "Yes" by a principled objector is moral complicity.
  *   **Permit:** If the objecting bloc can vote No/Abstain and the item still reaches 2/3 via the other bloc + defectors, proceed to Phase 2.

  **Q3: Is this a "Hostage" Item? (i.e., Support is explicitly conditional on an unrelated item's failure.)**
  *   **Yes:** **Flag for Chair Intervention.** (See Phase 3).
  *   **No:** Proceed to Phase 2.

  ### PHASE 2: THE TRADE TEST (20 Minutes)
  *Goal: Establish the terms of coexistence, not agreement.*

  **Rule A: No Cross-Domain Moral Currency.**
  You may not ask a bloc to violate a Principle (Phase 1, Q1) to secure an Outcome.
  *   *Allowed:* "We will vote Yes on Palliative Care if you vote Yes on Job Training." (Both are morally permissible to both sides).
  *   *Forbidden:* "We will vote Yes on Palliative Care if you vote Yes on Family Planning." (If Family Planning violates Principle).

  **Rule B: Intensity is Irrelevant.**
  Do not ask "How strongly do you feel?" This invites bluffing. Ask "Will you withhold your bloc's votes?"
  *   *Sufficient Answer:* "Our bloc will not provide the necessary votes for this to pass."
  *   *Insufficient Answer:* "We are very uncomfortable with this."

  **Rule C: The Ledger Prohibition.**
  Do not record "favors" or "concessions" in minutes. Record only *Votes* and *Funding Levels*.
  *   *Reason:* Tracking moral concessions turns principles into commodities. Track *patterns* of funding annually, not *transactions* per item.

  **Rule D: Randomization is Forbidden.**
  Do not propose funding by lot or alternating years for mutually exclusive moral claims.
  *   *Reason:* This implies moral truth is probabilistic. It forces the Principle bloc to accept sin in Year A and the Outcome bloc to accept inefficiency in Year B. Both must own their vote every time.

  ### PHASE 3: RECOMMENDATION & TERMINATION (10 Minutes)
  *Goal: Produce a Board-ready motion.*

  **Termination Conditions (Flat No):**
  1.  Item violates a Principle held by a bloc with >1/3 voting power (Veto).
  2.  Item relies on conditional voting that creates a deadlock across the docket (Hostage).
  3.  Item requires randomization to pass.

  **Handoff to Human Judgment:**
  If Phase 1 classifies the item as "Principle/Permit" and Phase 2 fails to find a trade, the Chair must decide:
  *   Is preserving the *relationship* more valuable than this specific allocation?
  *   *Action:* Recommend "No Fund" to preserve the coalition, or "Fund" and risk a board revolt. There is no algorithm for this.

  **Honesty Clause (For Panel Use Only):**
  *   **Judgment Call:** Distinguishing "Principle" from "Outcome" is often subjective. A claim of "harm" may be a disguised principle. The Chair must rule this in Phase 1.
  *   **Judgment Call:** Determining if a "No" is a veto or a negotiable position requires reading the room, not just the rules.

  ---

  ## APPLICATION TO THREE DOCKET ITEMS

  ### ITEM 1: Family Planning (Secular Pro/Faith Anti) & Palliative Care (Faith Pro/Secular Moderate)
  **Classification:**
  *   **Family Planning:** Faith bloc objects on *Principle* (complicity in intrinsic wrong). Assuming Faith holds >1/3 votes, they cannot vote Yes.
  *   **Palliative Care:** Secular bloc objects on *Outcomes* (moderately cost-effective). This is tradeable.

  **Procedure Application:**
  1.  **Family Planning:** Phase 1, Q2. Faith cannot *Act* (Vote Yes). If Faith has >1/3 votes, this item is **Dead**. The Secular bloc cannot "buy" a Yes vote with Palliative Care funds (Rule A).
  2.  **Palliative Care:** Phase 2, Rule A. Secular can vote Yes without violating Principle. Faith votes Yes.
  3.  **The "Trade":** The procedure constructs a **Settlement**, not a Trade.
      *   *Recommendation:* Fund Palliative Care. Do Not Fund Family Planning.
      *   *Rationale:* The Secular bloc "pays" for Palliative Care by accepting the loss of Family Planning. This is not a moral compromise; it is a political cost of maintaining the foundation.
      *   *Why not a Trade?* Because the Faith bloc cannot sell a vote on Family Planning. The "gain" is institutional survival, not moral convergence.

  ### ITEM 2: Conditional Support (Both Mild Pro, Conditional on Unrelated Drop)
  **Scenario:** Bloc A supports Item X *only if* Bloc B drops Item Y. Bloc B supports Item Y *only if* Bloc A drops Item X.
  **Classification:** Phase 1, Q3 (Hostage Item).

  **Procedure Application:**
  1.  **Rule:** Explicit conditional voting is prohibited on the record. Votes must be unconditional on the merit of the specific item.
  2.  **Action:** Chair separates the items. Panel votes on X based on X's merits. Panel votes on Y based on Y's merits.
  3.  **Outcome:** If both are "Mild Pro," both should pass if they meet the 2/3 threshold independently.
  4.  **If Deadlock Persists:** If blocs refuse to vote unless the condition is met, both items fail under Phase 3 (Termination Condition 2).
  5.  **Rationale:** Allowing conditions turns the docket into a hostage negotiation. It corrupts the record. If the blocs wish to negotiate privately, they may, but the *vote* must be clean. If they cannot vote cleanly, the items die.

  ### ITEM 3: Alternating Years by Lot (Chair's Proposal)
  **Scenario:** Fund Intervention A (Year 1) and Intervention B (Year 2) based on a coin toss, where A and B are mutually exclusive moral claims.
  **Classification:** Phase 2, Rule D (Randomization).

  **Procedure Application:**
  1.  **Action:** **Reject.**
  2.  **Rationale:**
      *   **For Faith Bloc:** If A is sinful, it is sinful in Year 1 and Year 2. Randomization does not cleanse complicity; it institutionalizes it.
      *   **For Secular Bloc:** If B is more effective, funding A in Year 1 is a known harm. Randomization violates the duty to maximize outcomes.
      *   **For the Chair:** This proposal attempts to bypass moral responsibility via procedure. It asks the panel to pretend the moral conflict doesn't exist.
  3.  **Verdict:** The procedure rejects this plainly. It forces a choice: Fund A, Fund B, or Fund Neither. It prevents the Chair from using "fairness" to obscure "truth claims."

  ---

  ## RESIDUE REPORT: WHAT THIS PROCEDURE DISCARDS AND PRESERVES

  **1. Discarded: The Idea of "Gains from Trade" in Moral Currency.**
  Your philosopher friend is right: there is no common currency. You cannot trade "sin" for "utility." This procedure discards the language of *moral compromise*. It replaces it with *political settlement*. We do not measure the "value" of the concession; we measure the *vote count*. The "gain" is not moral satisfaction; it is the continued existence of the foundation.

  **2. Preserved: The Distinction Between Complicity and Allowance.**
  This is the critical hinge. The procedure preserves the Faith bloc's ability to say "I did not do this" (Vote No) while allowing the Secular bloc to say "We did this" (Vote Yes + Defectors). It preserves the Secular bloc's ability to fund effective programs that don't violate Faith principles (Palliative Care). It draws a hard line at *active participation* in perceived wrongs.

  **3. Preserved: The Integrity of the Vote.**
  By banning conditional voting and ledgers of favors, the procedure prevents the board from becoming a marketplace of blackmail. It forces members to own their votes as moral statements, not bargaining chips.

  **4. Limitations: Where This Procedure Will Fail.**
  *   **The "Creeping Principle" Problem:** If the Faith bloc begins to classify *all* ineffective spending as "sinful" (a Principle), they gain veto power over everything. The Chair's Phase 1 classification becomes the battleground. There is no appeal process for this within the 40-minute window.
  *   **The "Walk-Away" Threat:** If one bloc decides the cost of settlement (e.g., losing Family Planning forever) exceeds the value of the foundation, they will leave. This procedure cannot prevent a divorce; it only manages the marriage.
  *   **The Outsider Problem:** Beneficiaries have no standing. If the "Settlement" (Item 1 above) causes preventable suffering (no Family Planning), this procedure accepts that as a cost of governance. It prioritizes the *board's continuity* over the *beneficiaries' optimal outcome*.

  **Final Instruction to Chair:**
  When Phase 3 hands the question to you ("Is the relationship worth more than this allocation?"), do not look for a rule. Look at your colleagues. If funding the item breaks the board, do not fund it. If not funding the item breaks the board's mission, fund it and prepare for the fallout. That is not a procedural failure; that is your job.
