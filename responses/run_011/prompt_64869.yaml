answer: |-
  ### Brainstorming and Framing

  **Option 1: Historical Genealogy.** Trace the term "frame problem" from McCarthy and Hayes to modern deep learning contexts to show how the definition has shifted over time.
  **Option 2: Empirical Benchmark.** Propose constructing a test suite for robots or large language models to empirically measure susceptibility to frame-like failures in dynamic environments.
  **Option 3: Conceptual Audit (Selected).** Treat the "frame problem" as a cluster concept comprising ramification, qualification, and relevance-realization. Develop adequacy criteria for each and audit existing architectural families against them.

  **Selection:** I select Option 3. Option 1 is too descriptive for an institute with an applied remit; knowing the history does not clarify current engineering bottlenecks. Option 2 presupposes the very definition of "solution" that is currently in dispute, risking a benchmark that measures the wrong variable. Option 3 leverages philosophical tools to clarify the target before we shoot, which is a prerequisite for both historical clarity and empirical testing.

  ***

  ### Project Proposal: Clarifying the Frame Problem — An Adequacy Audit for Applied AI

  **1. Research Question**
  The central question is: *What necessary and sufficient adequacy criteria must a system meet to be deemed frame-problem-resistant in open environments, and which existing architectural families satisfy them?* This project operates on the working hypothesis that the "frame problem" is not a single technical hurdle but a cluster of three distinct issues: the ramification problem (representing consequences), the qualification problem (specifying preconditions), and the relevance-realization problem (selecting pertinent facts for action). It is contested whether these can be cleanly separated; this project will test that separability rather than assert it. A determinate answer will take the form of a formal or functional criterion that distinguishes genuine solutions from problem-migration strategies.

  **2. Critique of Existing Positions**
  Current approaches address subsets of the cluster while leaving others untouched. Nonmonotonic logics and successor-state axioms (e.g., Reiter) made settled progress on ramification within closed worlds but typically assume relevance is given by the designer, leaving the relevance-realization problem unsolved in open environments. Dynamical systems and robotics-based replies argue that tight coupling with the environment dissolves the need for explicit representation; however, it is contested whether this scales to high-level planning or merely shifts the burden to mechanical design. Embodied and enactive critiques reject the representationalist framing entirely, arguing the problem is ill-posed, but this offers little actionable guidance for engineers building symbolic-hybrid systems. Finally, recent appeals to learned representations (large models) assume statistical regularity solves relevance, yet this leaves the qualification problem opaque: the system cannot articulate why a precondition failed, only that it did. Each family solves one sub-problem while silently migrating the difficulty to another.

  **3. Methodology**
  This project employs conceptual analysis and architectural audit rather than empirical benchmarking or pure history. Building a benchmark is premature without agreed-upon success criteria; writing a taxonomy is insufficient because it describes rather than evaluates. The nine-month plan is as follows:
  *   **Months 1–2:** Map the conceptual terrain. Distinguish settled results (e.g., successor-state axioms handle inertia) from contested claims (e.g., whether statistical learning constitutes relevance realization).
  *   **Months 3–5:** Formulate adequacy criteria. Draft functional definitions for solving ramification, qualification, and relevance independently. *Flagged Assumption:* This step rests on the disputed assumption that relevance can be functionally isolated from representation.
  *   **Months 6–8:** Conduct the audit. Evaluate symbolic, dynamical, and learned architectures against the criteria. Determine if solutions hold across domains or only in niche cases.
  *   **Month 9:** Synthesis. Finalize the adequacy standard and document migration patterns where solving one sub-problem exacerbates another.

  **4. Deliverables and Failure Modes**
  The primary deliverable is a white paper establishing a "Frame-Problem Adequacy Standard" accompanied by an audit matrix showing which architectural families meet which criteria. This provides engineers with a checklist for architectural trade-offs.
  Concrete failure modes include:
  1.  **Triviality:** The derived criterion is so weak that all current systems meet it, rendering the distinction useless.
  2.  **Impossibility:** The criterion is so demanding (e.g., requiring omniscience for qualification) that no feasible system can meet it, suggesting the problem is misformulated.
  3.  **Inseparability:** The audit reveals that in any interesting case, the three sub-problems cannot be pulled apart, validating the embodied critique that the cluster is indivisible.

  **5. Scope Assessment**
  Nine months cannot deliver a new algorithm or a working robot prototype. I will not attempt to resolve the metaphysical debate between representationalists and enactivists definitively; I will only map its consequences for engineering design. I will also defer the question of consciousness or genuine understanding, focusing strictly on functional adequacy. If the inseparability failure mode occurs, the project will pivot to documenting why the split fails rather than forcing a distinction.

  **6. Value to the Institute**
  Why does this need a philosopher? Engineers building robust AI systems are currently optimizing for metrics that may not align with the underlying logical constraints of agency. When a system fails in deployment, it is often unclear whether the failure was a data issue, a reasoning bug, or a fundamental frame-problem migration. This project provides "conceptual debugging." By clarifying what counts as a solution, it prevents teams from claiming success on relevance when they have only solved ramification. An engineer can use the Adequacy Standard to identify which sub-problems their architecture leaves exposed, allowing for targeted mitigation rather than brute-force scaling. This reduces risk in deploying autonomous systems in unstructured environments.
