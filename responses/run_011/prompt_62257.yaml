answer: |-
  1. The criterion is primarily about the subject, because only the whole body willing for the whole body constitutes sovereignty, whereas theorists mistakenly treat specific functional objects as independent sovereign powers. Rousseau isn't sliding between senses but arguing that dividing the object inevitably fragments the subject, turning the sovereign will into mere particular decrees.

  2. The charge is that sovereignty is ontologically indivisible, so the theorists' attempt to divide it is an illusion that destroys the very life of the body politic. The falseness lies in both the dismembering and the reunion, because a sovereign cannot be cut into functional pieces and still remain a living, unified will.

  3. Declaring war is an application of law to a specific circumstance rather than the establishment of a general rule binding all equally, which is the only true form of law. This does not leave the sovereign inert, but limits it to establishing fundamental norms, while leaving particular executions to the government.

  4. Rousseau's argument offers an independent normative reason to reject the issue-by-issue picture, because aggregating particular decisions yields a sum of private interests rather than a unified general will. For Rousseau, sovereignty is a qualitative unity of purpose, not a quantitative accumulation of separate policy preferences.

  5. Rousseau distinguishes between the infallibility of the general will's aim and the fallibility of the people's judgment, meaning they can be deceived into mistaking a particular interest for the common good. You can therefore blame the deception that clouded their judgment, though strictly a truly sovereign act cannot be "terrible" because it would cease to qualify as general law.
