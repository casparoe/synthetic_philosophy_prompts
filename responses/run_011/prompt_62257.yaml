      *   *Analysis:* The charge is that sovereignty is inherently indivisible (like a living body). The theorists pretend to divide it (dismember) and then pretend to unite it (reassemble). The falseness is in both: you can't actually divide sovereignty without killing it, so the "reunion" is an illusion. The child falling alive implies the body politic must remain whole to function; the trick is pretending you can cut it up and still have a living sovereign.
      *   *Drafting:* The charge is that sovereignty is ontologically indivisible, so the theorists' attempt to divide it is an illusion that destroys the very life of the body politic. The falseness lies in both the dismembering and the reunion, because a sovereign cannot be cut into functional pieces and still remain a living, unified will.

  4.  **Analyze Question 3:**
