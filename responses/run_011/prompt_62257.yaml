      *   *Analysis:* Rousseau defines the general will by both subject (the whole people) and object (the whole people/general matters). Here, he emphasizes the subject (who wills) to establish indivisibility. The theorists' mistake is dividing the *object* (functions) and treating them as separate sovereignties. Rousseau isn't sliding; he's saying true sovereignty requires the whole body willing generally, whereas theorists mistakenly treat specific functions (objects) as separate sovereign powers.
      *   *Drafting:* The criterion is primarily about the subject (who wills), because only the whole body willing for the whole body constitutes sovereignty, whereas the theorists mistakenly treat specific functional objects (like war or taxation) as independent sovereign powers. Rousseau isn't sliding between senses but arguing that dividing the object inevitably fragments the subject, turning the sovereign will into mere particular decrees.

  3.  **Analyze Question 2:**
