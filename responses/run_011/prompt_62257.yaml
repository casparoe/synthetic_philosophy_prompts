      *   *Analysis:* Declaring war is applying the law to a specific case (this enemy, now), not setting a general rule. Law must be general in object (apply to all citizens equally) and source (from all). The sovereign wills general rules (constitution, basic rights), while the government (magistrate) executes particular acts (war, taxation collection). This doesn't mean the sovereign decides nothing; it decides the fundamental norms, not specific administrative acts.
