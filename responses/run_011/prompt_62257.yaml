      *   *Refining:* Actually, Rousseau says the general will is always right, but the judgment guiding it may not be enlightened. So the people can be deceived into thinking a particular interest is the general interest. You can say "the people were deceived into willing X," but strictly if X is terrible, it wasn't a true act of sovereignty/law.
