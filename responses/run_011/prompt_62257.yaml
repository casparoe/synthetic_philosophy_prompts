      *   *Drafting:* Rousseau's argument offers an independent normative reason to reject the issue-by-issue picture, because aggregating particular decisions yields a sum of private interests rather than a unified general will. For Rousseau, sovereignty is a qualitative unity of purpose, not a quantitative accumulation of separate policy preferences.

