answer: |-
  Here is the session plan.

  ### 1. The Dependency Structure

  **Order of Introduction:**
  1.  **The Tournament Rules:** Bots receive source code (string), return Move (C/D), must terminate.
  2.  **Program Equilibrium (PE) Definition:** A profile of programs where no player gains by unilaterally swapping their program for another, *given the opponent's program is fixed as source code*.
  3.  **The Folk Theorem Disarmament:** Explicitly contrast PE with Repeated Games *before* showing the first bot.
  4.  **The Carrying Example:** `MirrorBot` vs. `MirrorBot` (Cooperation) and `MirrorBot` vs. `DefectBot` (Defection).
  5.  **The Simulation Trap:** Why you cannot `run()` the input.
  6.  **The Syntactic Solution:** How string comparison avoids the trap.

  **The Folk Theorem Trap:**
  Their prior coursework is a trap, not scaffolding.
  *   **What goes wrong:** In repeated games, cooperation is enforced by the *threat of future punishment* (temporal leverage). In program equilibrium, there is only one round. There is no "future" to punish in.
  *   **The False Analogy:** Students will try to implement "If you defect, I will defect *next time*." There is no next time.
  *   **The Correct Analogy:** The leverage is *logical*, not temporal. My move is a function of your source code. If your source code implies Defect, my function outputs Defect. You anticipate this *before* you run.
  *   **Intervention:** At minute 10, state: "Forget the shadow of the future. Here, the shadow is cast by the source code itself."

  ### 2. The Carrying Example

  **Game Choice:** Prisoner's Dilemma.
  *   **Why:** Mutual Defection is the unique Nash Equilibrium in the one-shot game. Program Equilibrium allows Mutual Cooperation. This maximizes the contrast between standard Game Theory and Program Equilibrium. Coordination games already have cooperative Nash Equilibria, obscuring the value of PE.

  **The Pseudocode (Whiteboard):**
  Define `MySource` as the string of the bot's own code.
  ```python
  Function MirrorBot(OpponentSource):
      If OpponentSource == MySource:
          Return COOPERATE
      Else:
          Return DEFECT
  ```
  **Counterpart:** `AlwaysCooperate` (Returns C always).

  **Required Encounters:**
  1.  **`MirrorBot` vs. `MirrorBot`:** Strings match. Both return C. (Shows equilibrium potential).
  2.  **`MirrorBot` vs. `AlwaysCooperate`:** Strings differ. `MirrorBot` returns D, `AlwaysCooperate` returns C. (Shows the default branch is active; `MirrorBot` is not naive).

  **Deliberate Omissions in Example:**
  *   **No Randomness:** Determinism is required for the logic to hold.
  *   **No Language Specifics:** Use `==` for string equality, not `equals()` or `strcmp`.
  *   **No Comments:** Implicitly treat source as raw bytes to avoid "comment variance" questions until the Check.

  ### 3. Where Self-Reference Enters

  **Timing:** Minute 35 (Immediately after the Carrying Example).
  *   **Context:** Students will naturally think, "Why compare strings? Why not just run the opponent's code on my code to see what they do?"
  *   **The Obstacle:** If Bot A simulates Bot B, and Bot B simulates Bot A, you get infinite recursion ($A(B(A(B...)))$). The bot fails to terminate and scores zero.
  *   **Depth of Exposure:** Do not mention Turing Machines or Diagonalization.
      *   **Say:** "If you simulate the opponent, and they simulate you, the tournament runner hangs. You get zero points."
      *   **Do Not Say:** "This is the Halting Problem." (This invites them to try to solve it).
  *   **Framing Syntactic Match:** Present string comparison as a **constraint that guarantees termination**, not a general solution to logical correlation.
      *   **Phrasing:** "We are dodging the simulation regress by restricting what you are allowed to check. You may check *identity*, but you may not check *behavior* via simulation."
      *   **Reasoning:** If you present it as a "solution," they will try to generalize it to semantic equivalence later. If you present it as a "tournament safety constraint," they accept it as a rule of the game.

  ### 4. The Misconception Map

  | Misconception | When to Head Off | The "Kill Shot" (Write/Say) |
  | :--- | :--- | :--- |
  | **"This is Tit-for-Tat / Folk Theorem"** | Minute 10 (Before Example) | "There is no second round. You cannot punish. You can only predict." |
  | **"Transparency = Knowing the Move"** | Minute 40 (Simulation Trap) | "Reading the code does not tell you the move if the code is simulating you. It tells you the *loop*." |
  | **"Syntactic Match is a Cheat"** | Minute 50 (After Syntactic Solution) | "In this tournament, source code *is* the strategy. Identity is the only decidable correlation." |
  | **"This is Binding Precommitment"** | Minute 15 (PE Definition) | "You are not binding yourself. You are handing your opponent a remote control that only works if they look like you." |
  | **"I Can Use a Timeout"** | Minute 40 (Simulation Trap) | "A timeout is a move. If your opponent knows your timeout limit, they can force you to hit it." |
  | **"Comments Don't Matter"** | Minute 85 (The Check) | "To the compiler, a comment is noise. To the string comparator, it is a difference." |

  ### 5. The Check

  **The Exercise (Minute 85):**
  Write the following on the board:
  > Bot A: `MirrorBot` (as defined above).
  > Bot B: `MirrorBot` (identical logic, but with one extra comment line: `# Hello`).
  > **Question:** What is the outcome of A vs. B? Why?

  **Correct Answer:**
  *   **Outcome:** (Defect, Defect).
  *   **Reasoning:** The source strings are not character-for-character identical. The `Else` branch triggers.

  **The Wrong-But-Fluent Answer:**
  *   **Answer:** (Cooperate, Cooperate).
  *   **Reasoning:** "They are functionally equivalent," or "The comment doesn't change the logic."
  *   **Diagnosis:** This student understands *semantic* equivalence (standard programming) but has failed to internalize *syntactic* identity (program equilibrium). They will write bots that fail to cooperate with copies of themselves in the project.

  ### 6. What to Refuse to Cover

  **Drop Without Damage:**
  1.  **Formal Treatment of Programs as Machines:** "We are treating programs as text strings, not mathematical functions."
  2.  **Existence and Multiplicity of Equilibria:** "We are looking for *an* equilibrium, not counting how many exist."
  3.  **Games with More Than Two Players:** "The project is strictly one-on-one; multi-player dynamics change the topology."
  4.  **Proof-Based Cooperation (PrudentBot):** "We are not using logic proofs to verify behavior, only string matching."

  **Cannot Drop (Must Address Briefly):**
  1.  **Undecidability of Behavior:** You must explain *why* simulation is banned.
      *   **Boundary Sentence:** "We ban simulation not because it is hard, but because it is undefined when both sides do it."

  **Explicit Exclusion Statement (Minute 80):**
  "I am drawing a boundary around this session: We are ignoring whether two different programs *do* the same thing. In this tournament, if the text differs, the strategy differs. Do not spend your project time trying to solve semantic equivalence."
