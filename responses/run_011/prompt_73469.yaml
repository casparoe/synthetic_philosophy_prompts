prompt: |-
  I am running a ninety-minute session on program equilibrium for final-year computer science undergraduates. They have completed one game theory course: they can define a Nash equilibrium, they know that mutual defection is the unique equilibrium of the one-shot prisoner's dilemma, and they have met the folk theorem for infinitely repeated games. None of them has taken computability theory or mathematical logic, and only about half have ever written a program that treats source code as data. I have a whiteboard and no slides. The session exists because the two-week project that follows it requires each student to write a bot that receives the opponent's source code as input and returns a move, after which the bots are run round-robin against one another; a bot that fails to terminate scores nothing.

  What I need is a plan for the explanation, not the explanation.

  1. The dependency structure. Set out the order in which the components must be introduced and what each depends on. In particular: should the definition of a program equilibrium — no player can do better by substituting a different program, holding the opponent's program fixed — come before or after the first concrete pair of bots? And given that these students already carry the folk theorem, is their prior coursework scaffolding I can build on or a trap I must disarm first? If it is a trap, say precisely what goes wrong when they import it: what in the repeated-games picture has no analogue here, and what looks analogous but is not.

  2. The carrying example. I want one pair of programs, in no more than about twelve lines of whiteboard pseudocode, that carries the entire idea: the bot that cooperates if and only if the code it is handed is character-for-character identical to its own source, its unconditional-cooperation counterpart, and at least one asymmetric encounter in which the match fails, so that the default branch is doing visible work. Tell me what this example must have, what it must deliberately lack — no randomness, no third player, no dependence on knowing a particular programming language — and whether the prisoner's dilemma is the right host game at all, or whether a coordination game or a game of chicken would carry the concept better and why.

  3. Where self-reference enters, and what I do about it. A bot that decides by comparing the input string against its own source terminates immediately; a bot that decides by simulating the opponent's program on its own input must simulate itself simulating itself, and does not. My students will hit this in the project and it is the thing I most need them to leave understanding. Tell me at what point in the ninety minutes to raise it, how much of the underlying obstacle to expose to an audience with no computability theory — enough that they do not conclude it is a bug they can patch with a timeout, not so much that the session becomes a logic lecture — and where the honest stopping point is. I also want your view on whether the syntactic-match construction should be presented as a solution to the regress or as a way of dodging the question, since the answer changes how much of item 2 I can afford to lean on.

  4. The misconception map. I expect at least these four: that this is tit-for-tat under another name and the folk theorem already covers it; that transparency merely means perfect information about a fixed opponent, so a player who can read the other's code can compute the other's move and the dominant strategy still wins; that the matching bot is a syntactic cheat, because no two real programs are character-identical; and that the whole apparatus is ordinary precommitment of the binding-device kind. Give me the ones I have missed — including anything specific to students who are competent programmers but have never thought of a strategy as a program — and for each misconception name the exact point in the sequence where it has to be headed off rather than argued with afterwards, together with the shortest thing I can say or write at that point that actually kills it.

  5. The check. One question or short exercise I can put to them in the final five minutes that separates students who understand the idea from students who can reproduce the phrase, and a description of the wrong-but-fluent answer I should be listening for.

  6. What I should refuse to cover, and say so out loud. My candidate omissions are the formal treatment of programs as machines, the undecidability of determining what an arbitrary program does on a given input, the existence and multiplicity questions for program equilibria, games with more than two players, and the variant in which cooperation is triggered not by syntactic identity but by the existence of a short proof, in some fixed weak proof system, that the opponent will cooperate. Tell me which of these I can drop without damaging the idea and which I cannot, and give me one sentence per omission that I can say to the class so that it reads as a deliberate boundary rather than as a gap in my own knowledge.

  I am not asking for readings and will not be assigning any; the deliverable is the ordering, the example, the misconception map, and the check.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Final-year CS undergrads. Know basic Game Theory (Nash, PD, Folk Theorem). No computability/logic background. Limited experience with code-as-data.
      *   **Context:** 90-minute session. Whiteboard only. Followed by a 2-week project (write a bot that takes opponent's source code, returns a move, must terminate).
      *   **Goal:** A *plan* for the explanation, not the explanation itself.
      *   **Key Constraints:**
          1.  Dependency structure (order of concepts, relation to Folk Theorem).
          2.  Carrying example (specific bot pair, pseudocode limits, game choice).
          3.  Self-reference/Halting (when to introduce, depth, syntactic match vs. simulation).
          4.  Misconception map (anticipated errors, timing of intervention).
          5.  The Check (final assessment question/exercise).
          6.  Omissions (what to explicitly exclude).

  2.  **Deconstruct Section 1: Dependency Structure:**
      *   *Core Concept:* Program Equilibrium (PE). Definition: No player improves by changing program, given opponent's program.
      *   *Order:* Definition first or Example first?
          *   *Reasoning:* If I define it abstractly first, it sounds like Nash Equilibrium (NE) with extra steps. If I show the bots first, they see the mechanism. However, without the definition, they might think it's just a specific strategy.
          *   *Decision:* Start with the *setup* (bots reading code), then the *definition* (PE), then the *example* (CooperateBot vs. MirrorBot). Why? Because PE is the *solution concept*, the bots are the *implementation*. You need to know what you're solving for before seeing the solution.
      *   *Folk Theorem Trap:*
          *   *Trap:* Students think "Oh, this is just repeated games without the time dimension."
          *   *Difference:* Repeated games rely on *future punishment* (temporal). Program equilibrium relies on *logical correlation* (static). In repeated games, I defect now and you punish later. In PE, I defect now and your program *predicts* it and defects now.
          *   *Action:* Must disarm this early. The "shadow of the future" is replaced by the "shadow of the source code."

  3.  **Deconstruct Section 2: The Carrying Example:**
      *   *Requirements:* ~12 lines pseudocode. Symmetric match, Asymmetric match.
      *   *Game Choice:* Prisoner's Dilemma (PD) is best. Why? Because mutual defection is the unique NE in one-shot. PE allows cooperation. This highlights the *power* of the concept. Coordination games already have cooperative NEs; Chicken is messy. PD makes the gain from PE obvious.
      *   *The Bots:*
          1.  `FairBot`: Cooperates if input code == own code.
          2.  `CoopBot`: Always cooperates.
          3.  `DefectBot`: Always defects.
      *   *The "Work":* Need to show `FairBot` vs `DefectBot`. `FairBot` sees code != own code -> Defects (default). This shows the conditional logic matters.
      *   *Constraints:* No randomness, no language specifics.
      *   *Decision:* Use PD. Use `MirrorBot` (if input == self then C else D) and `AlwaysC`. Show `Mirror` vs `Mirror` (C,C) and `Mirror` vs `AlwaysC` (D,C). This proves `Mirror` isn't just "nice," it's "conditionally nice."

  4.  **Deconstruct Section 3: Self-Reference & Halting:**
      *   *The Problem:* `SimulateBot` (run opponent on self) leads to infinite regress ($A(B(A(B...)))$).
      *   *The Fix:* Syntactic equality (`if input_string == my_source_string`).
      *   *Timing:* Introduce *after* the first example but *before* they start designing their own. If introduced too early, it kills the magic. If too late, they waste time writing simulators that hang.
      *   *Depth:* Don't teach Turing Machines. Just say "Simulation causes infinite loops. String comparison does not."
      *   *Framing:* Is syntactic match a solution or a dodge? It's a *dodge* that works for the tournament constraints. It avoids the halting problem by restricting the condition to something decidable (string equality).
      *   *Decision:* Frame it as "The Simulation Trap." Show why simulation fails. Present string matching as the "Tournament-Safe" alternative.

  5.  **Deconstruct Section 4: Misconception Map:**
      *   *Known:* Tit-for-Tat/Folk Theorem, Transparency = Perfect Info, Syntactic Cheat, Precommitment.
      *   *Missing:*
          1.  "Reading code means I know the move." (No, I know the *algorithm*, but if it simulates me, we loop).
          2.  "I can just add a timeout." (No, timeout is arbitrary and exploitable).
          3.  "This is just playing against a copy of myself." (No, I play against *their* program, which might be different).
      *   *Timing:*
          *   Folk Theorem: Immediately after defining PE.
          *   Transparency: When discussing why we read code.
          *   Syntactic Cheat: When introducing the `MirrorBot`.
          *   Precommitment: When discussing why this isn't just binding contracts.
      *   *Kill Shots:* Short, punchy statements.

  6.  **Deconstruct Section 5: The Check:**
      *   *Goal:* Distinguish understanding vs. memorization.
      *   *Idea:* Give them a new bot pair and ask for the outcome, or ask them to modify a bot to exploit a specific weakness.
      *   *Better Idea:* Ask about a bot that checks for a *substring* or a *comment*. Or ask about `MirrorBot` vs `MirrorBot_v2` (where v2 has a comment).
      *   *Selected Check:* `MirrorBot` vs `MirrorBot_With_Comment`. Does it cooperate? (Answer: No, strings differ). Why? (Syntactic identity required).
      *   *Wrong Answer:* "Yes, because they do the same thing." (Confuses semantic equivalence with syntactic identity).

  7.  **Deconstruct Section 6: Omissions:**
      *   *Candidates:* Formal machines, Undecidability, Existence/Multiplicity, N>2 players, Proof-based cooperation (PrudentBot).
      *   *Keep/Drop:*
          *   Formal machines: Drop. (Too mathy).
          *   Undecidability: Keep (conceptually), drop (formalism). Essential for why simulation fails.
          *   Existence: Drop. (Too advanced).
          *   N>2: Drop. (Project is 1v1).
          *   Proof-based: Drop. (Too logic-heavy).
      *   *Boundary Sentences:* Need to sound deliberate. "We are treating programs as strings, not functions." "We are ignoring the halting problem by restricting operations."

  8.  **Drafting the Plan (Iterative Refinement):**
      *   *Timing:* 90 mins is tight.
          *   0-15: Setup & Definition (vs Folk Theorem).
          *   15-35: The Example (PD, MirrorBot).
          *   35-55: The Halting/Simulation Trap (Crucial pivot).
          *   55-75: Misconceptions & Strategy (Project prep).
          *   75-85: Omissions (Boundary setting).
          *   85-90: The Check.
      *   *Refining the "Folk Theorem Trap":* Make sure to emphasize *static* vs *dynamic*.
      *   *Refining the Example:* Ensure the pseudocode is strictly whiteboard-friendly. `if (input == self) return C else return D`.
      *   *Refining the Self-Reference:* This is the hardest part for CS students who know recursion. They *will* try to simulate. I need to explicitly forbid `eval()` or `run()` on the input.
      *   *Refining Misconceptions:* Add the "Timeout" misconception. Students love timeouts. They are brittle in this context.

  9.  **Final Review against Constraints:**
      *   Plan only? Yes.
      *   Dependency structure? Yes.
      *   Carrying example details? Yes.
      *   Self-reference handling? Yes.
      *   Misconception map? Yes.
      *   The Check? Yes.
      *   Omissions? Yes.
      *   Tone: Professional, instructional, precise.

  10. **Final Polish:** Check the "Trap" regarding Folk Theorem. It's not just that it's different; it's that importing the intuition leads to *wrong* strategies (like trying to punish in a one-shot). Ensure the plan highlights this. (Self-correction: The prompt asks specifically "what goes wrong when they import it". I need to be specific in Section 1).

      *   *Folk Theorem Import Error:* They will look for a "future" round to punish. There is none. They will look for a "probability of continuation." There is none. The leverage is logical, not temporal.

      *   *Syntactic Match:* Is it a solution or dodge? It's a dodge that enables the equilibrium. If I call it a solution, they might think it solves the Halting Problem generally. I must call it a "restriction that guarantees termination."

      *(Self-Correction during drafting Section 3)*: The prompt asks "whether the syntactic-match construction should be presented as a solution to the regress or as a way of dodging the question." I need to take a stance. Stance: It is a *constraint* that avoids the regress, not a general solution to logical correlation. This manages expectations for the project.

      *(Self-Correction during drafting Section 6)*: "One sentence per omission." Keep it tight.

      *(Final check on Section 5)*: The check needs to separate "understand" from "reproduce". If I ask "What is PE?", they reproduce. If I ask "What happens if I add a comment?", they must understand the mechanism.

