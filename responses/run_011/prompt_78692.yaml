answer: |-
  This is a sophisticated exercise in analogical reasoning and principle extraction. Since your professor has graded you on mapping the space of possible rules rather than prediction accuracy, your memo should prioritize the *structure* of the court's logic over the certainty of the outcome. Below is a breakdown of the three tasks you outlined, designed to help you draft the 1,500-word memo.

  ### 1. Candidate Rules and the Unitary vs. Patchwork Question

  You need to articulate three coherent frameworks that explain the existing track record.

  **Contender A: The "Substantive Ties" Principle (Unitary)**
  *   **The Rule:** The franchise is determined by the depth of an individual's connection to the political community, regardless of formal status. National elections require a "constitutive" connection; local elections require only a "stakeholder" connection.
  *   **Consistency:** Explains why 16-year-olds can vote locally (stake in schools/zoning) but not nationally (lack mature political judgment/connection). Explains why 1-year PRs are excluded nationally (attenuated connection) but 5-year PRs are included locally. Explains why emigrants lose the vote eventually (ties fade).
  *   **Hardest Precedent:** The *Citizens Born Abroad* case. If ties are what matter, why are citizens who have *never* resided in the country denied the vote outright, while emigrants who lived there keep it for 15 years? This suggests citizenship status itself carries weight independent of actual ties.
  *   **Hardest Precedent (Alternative):** The *15-Year Emigrant* rule. If the national franchise is constitutive of the community, does living abroad for 15 years truly preserve that constitutionality more than a 10-year PR resident who arrived as a child?

  **Contender B: The "Citizenship as Proxy" Principle (Unitary)**
  *   **The Rule:** Citizenship is the primary gatekeeper for the national franchise. Non-citizens are presumptively excluded from national voting unless a specific exception is carved out for extreme integration. Restrictions on citizens are scrutinized strictly; restrictions on non-citizens are scrutinized loosely.
  *   **Consistency:** Explains the divergence between the 1-year PR national ban and the 15-year citizen emigrant allowance. Explains why citizens born abroad are treated differently than PRs (status vs. no status).
  *   **Hardest Precedent:** The *Non-Citizen Municipal* enfranchisement. If citizenship is the strict proxy for political membership, why is it irrelevant at the municipal level? This requires the court to maintain two different theories of democracy simultaneously (one for local, one for national).

  **Contender C: The "Doctrinal Patchwork" (Separate Standards)**
  *   **The Rule:** There is no single principle. Instead, there are three distinct doctrinal buckets:
      1.  **Boundary (Entry):** determined by a mix of status and residence (Citizenship preferred, but long residence can substitute).
      2.  **Duty (Compulsion):** determined by proportionality of sanction (Nominal fines ok; rights-stripping sanctions not ok).
      3.  **Forfeiture (Exit):** determined by specific conduct threatening the system (Vote-buying ok; blanket criminality not ok).
  *   **Consistency:** Fits every verdict comfortably because it does not demand consistency across categories. It explains why a civics test (Entry) is struck down while a service exemption ban (Entry/Condition) might be upheld—they are judged by different standards.
  *   **Hardest Precedent:** The *Guardian* case. If this is a patchwork, why is capacity judged individually here, but residence judged categorically for emigrants?
  *   **Unitary vs. Patchwork:** The track record does not *force* a preference, but it creates pressure. The tension between the *1-Year PR (Struck)* and *15-Year Emigrant (Upheld)* cases is the hardest to reconcile without a Unitary "Citizenship as Proxy" rule. However, the *Pending Statute* asks the court to blend Entry and Duty (enfranchisement + compulsion). If the court uses the Patchwork, it can rule Element 1 (Entry) and Element 2 (Duty) independently. If it uses a Unitary rule, Element 2 must flow logically from Element 1.

  ### 2. Predictions on the Four Elements

  **Element 1: Enfranchisement (10 yrs, arrived <18)**
  *   **Prediction:** **Upheld.**
  *   **Closest Analog:** *Non-Citizen PR Municipal (5 yrs) Upheld* vs. *Non-Citizen PR National (1 yr) Struck Down*.
  *   **Analysis:** The court previously struck down national voting for PRs because of an "attenuated connection." Ten years of residence, combined with arrival before age 18, suggests socialization comparable to citizenship. This distinguishes it from the 1-year national case. It treats the "arrived <18" factor as a functional equivalent to the "Citizenship" status in the emigrant cases.
  *   **Strain:** It pushes the "constitutive of political community" language. The court must argue that 10 years + childhood socialization *makes* them part of the community, effectively redefining "community" from legal status to sociological fact.

  **Element 2: Compulsory Turnout (Nominal Fine)**
  *   **Prediction:** **Upheld.**
  *   **Closest Analog:** *Compulsory Turnout Citizens (Nominal Fine) Upheld*.
  *   **Analysis:** Once the franchise is granted (Element 1), the court's track record suggests duties attach equally. The precedent distinguishes sanctions by *severity* (nominal vs. passport bar), not by *class of voter*.
  *   **Strain:** None significant, unless the court views compulsion as a privilege of citizenship specifically.

  **Element 3: Lapse after 5 Years Absence**
  *   **Prediction:** **Struck Down (or the weakest link).**
  *   **Closest Analog:** *Emigrant Citizens (15 Years) Upheld*.
  *   **Analysis:** This is the major tension point you identified. Citizens get 15 years; this new class gets 5. If the principle is "Ties," 5 years of absence proves attenuation for anyone. If the principle is "Citizenship," citizens get a longer leash.
  *   **Strain:** To uphold this, the court must argue that the "presumption of belonging" for citizens is stronger than for PRs, even PRs who arrived as children. To strike it, the court must argue that once enfranchised, the "Ties" standard applies equally to all voters, making the 5/15 disparity arbitrary. Given the *Citizens Born Abroad* precedent (where lack of residence barred citizens), the court might uphold the 5-year limit, arguing that for non-citizens, residence is the *source* of the right, whereas for citizens, it is only a *condition* of the right.

  **Element 4: Exclude Service Exemption Claimants**
  *   **Prediction:** **Upheld.**
  *   **Closest Analog:** *Prisoners (Vote Buying) Upheld* vs. *Civics Test Struck Down*.
  *   **Analysis:** This is not a knowledge barrier (Civics Test) nor a blanket ban (Prisoners). It is a specific forfeiture based on a voluntary choice indicating a lack of reciprocal commitment. It mirrors the logic of the vote-buying ban: you cannot participate in the system if you have explicitly opted out of its core defensive burdens.
  *   **Strain:** It risks looking like a "poll tax" of service. However, since the exemption is *available* (they can serve and vote, or claim exemption and not vote), it is a choice, not a barrier.

  ### 3. The Crucial Hypothetical and Principles of Decision

  **The Hypothetical Case to Separate Contenders**
  To separate **Contender A (Substantive Ties)** from **Contender B (Citizenship as Proxy)**, propose this statute:
  *   *Statute:* "A law granting the national vote to Citizens who have lived abroad for 20 years (exceeding the 15-year limit) *if* they can prove they file local taxes and own property."
  *   **Separation:**
      *   If **Upheld**: The court commits to **Substantive Ties**. Citizenship status alone is not enough to keep the vote indefinitely (15-year limit stands), but actual ties (taxes/property) can restore it even past the statutory limit. This undermines the "Citizenship as Proxy" view.
      *   If **Struck Down**: The court commits to **Citizenship as Proxy/Rule of Law**. The 15-year limit is a hard bright-line rule for citizens. Even strong substantive ties cannot override the statutory expiration attached to citizenship status.

  **Principles Committed to in the Pending Statute**
  You asked specifically about the difference between upholding the statute *in full* versus upholding Element 1 but striking Element 4.

  *   **If Upheld in Full:** The court commits to the principle of **Reciprocal Integration**. The franchise is not just a right of presence (Element 1) but a contract of mutual burden-sharing. By upholding Element 4, the court asserts that voting is contingent on a willingness to share the "hard duties" of the state (national service), not just the "soft duties" (nominal fines). It treats the non-citizen voter as a "probationary member" whose rights are conditional on demonstrated loyalty.
  *   **If Element 1 Upheld / Element 4 Struck:** The court commits to the principle of **Residence as Sufficiency**. This aligns the service exemption ban with the *Civics Test* precedent. It suggests that once the "Substantive Ties" (10 years/child arrival) are proven, the state cannot impose additional qualitative conditions on the vote. It separates the *right* to vote from the *duty* to serve, treating the former as a human right of residents and the latter as a separate civic obligation. This creates a class of voters who are politically equal to citizens in the booth, but legally distinct in their obligations.

  ### Drafting Advice
