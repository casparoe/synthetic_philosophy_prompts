      *   **Closing (The Contribution):** What does this add? It tests the *Authorship* condition. If a bot speaks as Montaigne, is it Montaigne? If narrative selfhood requires *spinning* the story (Schechtman), a posthumous bot fails because the spinning stops. But if it's just a gravity center (Dennett), the bot works fine. Montaigne suggests a third option: Narrative as *trace of movement*, not plot.

