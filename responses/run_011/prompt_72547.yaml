prompt: |-
  Act like a philosopher who works on collective intentionality and joint action — the Bratman / Gilbert / Searle stretch of territory — but who also has a feel for what social scientists mean by collective behaviour. Think carefully, and before you commit to an answer, brainstorm five or six candidate labels for what I'm about to describe and knock them down one at a time.

  So. Here's a thing I keep running into and I don't have a word for it.

  Case one: the recycling in my building. Every week the bins end up correctly sorted, in the right spot, out before the truck comes. Nobody organised this. There's no group chat, no rota, no committee, and half the people doing it I've never met and couldnt pick out of a lineup. And yet what each of us does only makes sense given what the others do — I rinse the jars because somebody else is going to stack paper in the same room, and paper gets ruined; I drag the empty bins back in on Thursday because whoever took them out may not bother. If two of us happen to be down there at the same moment we wordlessly split the work, one lifts, one steadies.

  Case two: the shared path between my place and my neighbour's. One winter we each cleared it without ever discussing it, and we drifted into each doing the half we were better placed for (they had a blower, I had an early shift). When one of us was away the other just did the whole thing, and nothing was said about it afterwards. No scorekeeping, no thanks, no sense of a deal being kept.

  What bugs me is that these look like textbook cases of people doing something together — the contributions interlock, they're continuously adjusted to each other, and the outcome isn't anything any one person did. But there's also nothing that looks like an agreement, no shared plan anyone could articulate if you asked them ("we sort the recycling" would sound bizarre coming from any of us), and, crucially, nobody feels entitled to complain. If a new tenant tosses a glass jar into the paper bin, I don't feel they've let me down. I might be irritated, but I wouldn't feel rebuke-worthy on either side. There's also no common knowledge in sight: I don't know that they know that I know that we're doing this.

  What I want from you:

  - Is there an established concept for this, or a small family of concepts? I've vaguely heard "shared intention," "plural subject," "we-mode versus I-mode," and "team reasoning," and I gather that convention in the Lewis sense needs common knowledge, which this seems to fail. Which of these actually covers the case, which look close but break on some specific requirement, and exactly where does each one break?

  - If nothing fits cleanly, coin the term you'd use, define it tightly, and then give me its edges: what's the most minimal case that still counts, what disqualifies a case, and what have you deliberately fenced off outside it. In particular — does the first appearance of resentment, or of someone actually saying "we," flip it into a different phenomenon, or just a fuller version of the same one?

  - Tell me whether this even is joint action, or whether I'm over-reading what's really a pile of independent habits that happen to mesh. And don't just assert it: what would settle it? What test, or what feature of the recycling case, decides the question?

  - Last thing: does the analysis change between anonymous, replaceable participants (a building full of tenants) and two specific people who know each other perfectly well but have never once mentioned the path? If the concept needs a name for each version, give me both and say why they're versions of one thing rather than two things.

  No bibliography, no reading list, no paper titles — I'm not writing anything academic and I'd rather you spent the words on the conceptual map and on your own judgment about where the joints are. And please don't settle for "it depends how you define joint action": pick a definition, defend it, and tell me what it costs you.
