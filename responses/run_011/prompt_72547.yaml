answer: |-
  This is a fascinating boundary case. You have identified a gap between the *phenomenology* of doing something together (the interlocking, the adjustment) and the *normative architecture* that philosophers usually insist accompanies it (the obligation, the entitlement to rebuke).

  Here is the breakdown of the conceptual territory, the elimination of the usual suspects, and my proposal for what is actually happening here.

  ### Part 1: The Candidate Labels (and Why They Break)

  I will run through six standard concepts from the collective intentionality toolkit and the social sciences. Each captures a facet of your cases, but each fractures on a specific requirement you've highlighted.

  **1. Plural Subject (Margaret Gilbert)**
  *   **The Fit:** This theory is built for "we-doing." It explains why two people walking together feel bound to keep pace.
  *   **The Break:** Gilbert is strict: a plural subject *constitutes* a joint commitment. That commitment creates obligations and entitlements. If you form a plural subject to clear snow, you *owe* it to me to do your half, and I have the standing to rebuke you if you don't. You explicitly said there is **no standing to rebuke**. If a tenant messes up the recycling, you feel irritation, not moral violation. Gilbert's framework cannot account for cooperation without obligation.

  **2. Shared Intention (Michael Bratman)**
  *   **The Fit:** Bratman focuses on the planning structure. We share an intention if our sub-plans mesh and we are mutually responsive. This fits your "I rinse because you stack" description perfectly.
  *   **The Break:** Bratman argues that shared intention involves a commitment to the *joint activity* itself, not just the outcome. This commitment typically generates a normative pressure to not undermine the joint activity. While Bratman is softer than Gilbert, he still requires a level of mutual assurance that borders on the "we" you say is absent. More critically, Bratmanian agents usually know they are in a shared intention. Your tenants likely don't think "we are sorting"; they think "I am sorting, assuming others do."

  **3. Convention (David Lewis)**
  *   **The Fit:** This explains regularities where everyone does their part because they expect others to do theirs (like driving on the right). It fits the recycling routine.
  *   **The Break:** Lewisian convention *requires* common knowledge (or iterative belief). I must know that you know that I know we are following the regularity. You noted there is "no common knowledge in sight." In your building, I don't know *who* else sorts. I just see the bins are sorted. The epistemic bar for convention is too high for this anonymous meshing.

  **4. Social Norm (Bicchieri / Elster)**
  *   **The Fit:** Everyone does it; it's a standard pattern of behavior in the building.
  *   **The Break:** Norms are defined by their sanctioning conditions. A behavior is a norm only if deviation attracts negative sanctions (blame, gossip, ostracism). You said there is no rebuke. If there's no sanction, it's not a norm; it's just a regularity. It's a *descriptive* pattern, not a *prescriptive* one.

  **5. Team Reasoning (Bacharach)**
  *   **The Fit:** This suggests individuals stop reasoning as "I" and start reasoning as "We" to maximize group utility. It explains the snow clearing (I do the whole thing if you're away).
  *   **The Break:** Team reasoning requires a cognitive shift in identity. The agent must frame the problem as "What should *we* do?" You suggest the tenants wouldn't articulate "we sort the recycling." They are likely still in "I-mode," just calculating that "I rinse" is only useful if "Paper is stacked." They are reasoning individually about a collective outcome, not reasoning collectively.

  **6. Parallel Individual Action (Aggregation)**
  *   **The Fit:** Everyone is just doing their own thing. No mystery, no "group mind."
  *   **The Break:** This fails to capture the **interdependence**. If I rinse jars *only* because I see paper is being stacked, my action is conditional on yours. Parallel action implies I would rinse my jars even if you burned all the paper. Your case describes a causal and intentional link that aggregation ignores.

  ### Part 2: The Coinage — "Tacit Interlocking"

  Since existing terms either demand too much normativity (Gilbert/Bratman) or too much knowledge (Lewis), I propose we call this **Tacit Interlocking**.

  **Definition:**
  *Tacit Interlocking* occurs when two or more agents intentionally adjust their individual actions to fit the anticipated actions of others to achieve a shared outcome, **without** forming a joint commitment, **without** common knowledge of the arrangement, and **without** generating mutual obligations to rebuke.

  **The Edges:**
  *   **Minimal Case:** I hold a door because I see you approaching; you walk through. We never make eye contact. You don't thank me; I don't expect it. If you didn't walk through, I wouldn't feel betrayed, just that my effort was wasted. This counts.
  *   **Disqualifying Case:** If I hold the door *because* I believe I have a duty to be helpful, or if I get angry when you don't say thanks, we have moved into **Normative Cooperation**. If I hold the door regardless of whether you are there (I just always hold doors), it is **Habit**, not interlocking.
  *   **Fenced Outside:** I am deliberately fencing off *agreements*. As soon as someone says, "Shall we clear the path?", Tacit Interlocking dissolves into Shared Intention. The silence is essential.

  **Does resentment flip the category?**
  Yes. The first appearance of genuine resentment (not just irritation at wasted effort, but a sense of *betrayal*) signals the birth of a **Plural Subject**.
  *   *Irritation:* "My work was wasted." (Tacit Interlocking)
  *   *Resentment:* "You let me down." (Plural Subject)
  When resentment appears, the participants have silently upgraded their status from "components in a system" to "partners in a commitment." Tacit Interlocking is the pre-normative substrate; Plural Subject is the normative superstructure.

  ### Part 3: Is This Joint Action?

  This is the crux. I will take a stand: **Yes, this is joint action, but it is the cognitive core without the normative shell.**

  Many philosophers (especially Gilbert) argue that without the obligation, it isn't truly "joint." They claim it's just a pile of "I-intentions" that happen to align. I disagree.

  **The Test: Counterfactual Responsiveness**
  To decide if this is joint action or just meshing habits, apply the **Subtraction Test**.
  *   *Scenario:* Imagine you go downstairs to recycle and see the paper bin is full of glass (someone messed up).
  *   *Habit Response:* You rinse your jars anyway, because that's just what you do. You toss them in, or you take them home. Your action plan was fixed independently of the other. -> **This is Aggregated Habit.**
  *   *Joint Response:* You *do not* rinse the jars. You see the system is broken, so you withhold your contribution. Your intention was conditional: "I rinse *if* the paper is safe."
  *   *Verdict:* In your recycling case, you said: "what each of us does only makes sense given what the others do." This implies conditional intention. You are monitoring the environment for *their* agency.

  **Why this matters:**
  If I am merely habituated, I am reacting to the *bins*. If I am Tacitly Interlocking, I am reacting to *you* (via the bins). I am treating your agency as a variable in my planning equation. That makes it joint action, even if we don't acknowledge the "we."

  **The Cost of This Definition:**
  By defining joint action this broadly (interlocking intentions without obligation), I lose the ability to distinguish "moral" cooperation from "mechanical" cooperation. I have to admit that a well-oiled ant colony and your recycling tenants are engaging in the same *structural* form of joint action, differing only in cognitive complexity. I sacrifice the specialness of human moral bonding to capture the reality of how much social life actually works (which is mostly tacit and non-committal).

  ### Part 4: Anonymous (Tenants) vs. Specific (Neighbors)

  Does the analysis change between the building tenants and the snow-clearing neighbors?

  **Structurally: No.**
  In both cases, the mechanism is **Predictive Modeling**.
  *   **Tenants:** I model "The Other Tenants" as a statistical aggregate. I assume *someone* will stack paper. I don't know who.
  *   **Neighbors:** I model "The Neighbor" as a specific agent. I know *they* have the blower.

  **Epistemically: Yes.**
  *   **Tenants (Systemic Interlocking):** The coordination is mediated by the *state of the world* (the bins). The bins serve as the communication channel. I don't need to know you; I just need to read the bins. This is robust to turnover (new tenants can slot in).
  *   **Neighbors (Dyadic Interlocking):** The coordination is mediated by *agent identity*. I clear the whole path if *you* are away because I model *your* absence specifically.

  **Why they are versions of one thing:**
  Both rely on **Common Ground without Common Knowledge.**
  We share a physical environment (the path, the bin room) that affords certain actions. We both perceive the affordances. We both know the other is a rational agent who likely perceives the same affordances.
  *   I see the snow. I know you see the snow. I know you want to walk. I clear my half.
  *   I see the glass. I know you see the paper. I know you want to recycle. I rinse.

  The cognitive leap is identical: "I am not the only one acting here." The difference is merely the resolution of the model (specific person vs. generic agent). Therefore, they are both **Tacit Interlocking**.

  ### Summary Judgment

  You are describing **Tacit Interlocking**.

  It is a form of **Joint Action** because the intentions are conditionally interlocked (I do X *because* I expect you to do Y). However, it lacks the **Normative Glue** of Shared Intention or Plural Subject (no obligation, no rebuke).

  It is distinct from **Convention** because it requires no common knowledge, only shared perception of the environment.

  It is distinct from **Habit** because it is responsive to the failure of others (if you stop, I adjust).

  **The Philosophical Upshot:**
  Social life is not built primarily on agreements and commitments. That is the "high end" of cooperation. The "low end"—which sustains most of our daily coexistence—is this Tacit Interlocking. We are constantly slotting our actions into the gaps left by strangers, creating a functional "we" that none of us have signed up for. It is a collective achievement that requires no collective consent.

  If you want to name the feeling of it, it is the sensation of **fitting**. You aren't promising; you're just fitting your piece into the puzzle because you can see where the other pieces are going.
