prompt: |-
  I serve on the governing board of a regional health data cooperative: a nonprofit trust through which twelve hospital systems pool de-identified clinical records into a shared research registry. Contribution was made voluntary at founding, and access to the registry is free to all twelve members whether or not they contribute. After five years, seven systems contribute and five do not. Two of the five are large, well-resourced academic systems whose IT leadership has told our staff that anonymization and record-linkage work is not a priority for them this budget cycle. The registry's scientific value turns heavily on coverage; at present it systematically under-represents rural and safety-net populations, which is the very gap the founding grant was meant to close.

  At our March meeting the board will vote on a proposal from the finance subcommittee: impose an access charge on non-contributing members, consisting of a per-query fee plus a tiered annual subscription, waived entirely for contributors, together with a clause under which contribution becomes mandatory in the third year if participation has not reached ten of twelve.

  The board is divided along two lines that I do not think anyone has yet separated cleanly.

  The first faction argues that the situation is a straightforward collective-action trap of the familiar sort: each system reasons that its own contribution makes no perceptible difference to the registry's usefulness while costing it real staff time, so withholding is the dominant strategy, and no quantity of exhortation will alter that. On this view there are only two levers, compulsion and price, and since a mandate is politically unattainable this year, price is the instrument to use. They add an equity consideration: the seven contributors are effectively subsidizing the five, and because the largest contributors carry the largest absolute costs, the present arrangement is regressive among members.

  The second faction argues that the diagnosis is mistaken and that the proposed remedy follows from the misdiagnosis. On their account the five are not defecting against a dominant strategy; several have indicated privately that they would contribute if they were confident that at least nine others would, since their costs are largely fixed while their benefits rise steeply with coverage. What is missing is credible assurance, not incentive. They further warn that introducing money would change the character of the exchange: the seven contributors are unpaid, and they invoke the classic argument about voluntary blood donation to the effect that a market frame can drive out the reciprocal motives on which a scheme like ours depends. They also observe that a per-query charge would fall hardest on the small rural systems, whose patients are the under-represented ones, so the policy could make the registry less representative while raising revenue.

  A third confusion keeps surfacing in our correspondence. Several members insist that what we have is a tragedy of the commons. One member objects that the phrase cannot apply at all, because nothing is being depleted: no one's use of the registry subtracts from what remains available to others, so there is no common-pool stock being run down, and the phrase has been doing unexamined work in our deliberations. I suspect this quarrel is not merely verbal and that its resolution bears on which instrument the board should choose, but I cannot yet say how.

  Please draft the memorandum I will circulate to the board a week before the meeting, roughly 1,100 words, in the register of a document the board could act on rather than a survey of the literature, with the recommendation stated in a short opening paragraph and the reasoning following. It should:

  1. State a recommendation on the subcommittee's proposal — adopt as drafted, adopt with named amendments, defer, or reject — and, if it recommends anything other than adoption as drafted, set out the substitute mechanism concretely, with a timetable that fits a board meeting four times a year.

  2. Resolve the diagnostic question. Specify what would have to be true for the first faction to be right, what would have to be true for the second to be right, and what in the facts I have given you — or what inexpensive piece of evidence the board could obtain before the next meeting — would discriminate between them. Then say what the board should do if it cannot tell, and justify that default rather than treating it as a neutral fallback.

  3. Address the vocabulary dispute on its merits. Say whether the depletability objection is correct, whether it matters, and, if this remains a genuine collective-action problem despite it, identify what kind of problem it is and explain why the classification changes the instrument rather than merely the label.

  4. Give the crowding-out objection its strongest form and then assess it: under what conditions would monetization actually destroy the cooperation it is intended to purchase, and do those conditions obtain in this consortium? Neither dismiss the objection nor concede it.

  5. Confront a difficulty neither faction has raised. Any scheme the board adopts will require someone to verify that contributions are complete and current rather than nominal, and that verification is itself costly and itself liable to be under-supplied, since its benefits accrue to all members regardless of who pays for it. Explain who should bear that cost and on what principle, and what the board should do about a scheme whose enforcement depends on the good faith of the parties it enforces.

  6. Include a decision rule the board can adopt now for the contingency that its chosen mechanism fails: a pre-committed trigger and a pre-committed next step, so that an unsuccessful first attempt does not return the board to this same impasse a year from now with its options further narrowed.

  Throughout, members who disagree with your recommendation should be able to see their strongest consideration engaged and answered rather than restated and set aside.
reasoning: |-
  Here's a thinking process that leads to the memorandum:

  1.  **Analyze the Request:**
      *   **Role:** Board member of a regional health data cooperative (nonprofit trust).
      *   **Audience:** The governing board (12 hospital systems, 7 contributors, 5 non-contributors).
      *   **Context:** 5 years in, 7 contribute, 5 don't (2 are large academic). Registry under-represents rural/safety-net populations. Access is currently free for all.
      *   **Proposal:** Finance subcommittee proposes access charges for non-contributors + mandatory contribution clause in Year 3 if participation < 10/12.
      *   **Factions:**
          *   Faction 1 (Price/Compulsion): Collective action trap, free-riding, subsidy issue, need price/mandate.
          *   Faction 2 (Assurance/Reciprocity): Assurance problem, need confidence in others, money crowds out altruism, price hurts rural reps.
          *   Vocabulary Dispute: Is it a "Tragedy of the Commons"? (One member says no, nothing is depleted).
      *   **Task:** Draft a memorandum (~1,100 words) to circulate one week before the March meeting.
      *   **Requirements:**
          1.  Recommendation (Adopt/Amend/Defer/Reject) + concrete mechanism/timetable.
          2.  Resolve diagnostic question (Faction 1 vs. 2) + evidence needed + default if unknown.
          3.  Address vocabulary dispute (Tragedy of the Commons?) + why classification matters.
          4.  Address crowding-out objection (strongest form + assessment).
          5.  Address verification/enforcement cost (who pays? good faith issue?).
          6.  Include a decision rule/trigger for failure (pre-committed next step).
      *   **Tone:** Actionable, reasoned, engaging strongest counter-arguments respectfully.

  2.  **Determine the Recommendation:**
      *   *Option A (Adopt as drafted):* Risks alienating the 5 non-contributors, potentially hurting rural representation further (Faction 2's point), and ignores the assurance problem.
      *   *Option B (Reject):* Leaves status quo, which is failing (under-representation).
      *   *Option C (Defer/Amend):* Best path. We need to test the diagnosis before locking in pricing. A "soft" mandate or assurance mechanism is better than immediate pricing.
      *   *Decision:* Recommend **Adopt with Amendments**. Specifically, defer the pricing mechanism in favor of an "Assurance Compact" first, with pricing as a fallback. This bridges the factions.
      *   *Timetable:* March (Vote), June (Review participation), Sept (Trigger pricing if needed).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening/Recommendation:** State clearly. Recommend adopting the *goal* (sustainability/equity) but amending the *mechanism*. Propose a "Participation Compact" first, pricing as Phase 2.
      *   **Diagnostic Resolution (Faction 1 vs. 2):**
          *   Faction 1 (Prisoner's Dilemma): True if benefit is independent of others' contribution.
          *   Faction 2 (Assurance Game): True if benefit depends on critical mass.
          *   *Evidence:* Survey the 5 non-contributors anonymously. Ask: "Would you contribute if 9 others did?"
          *   *Default:* If unknown, treat as Assurance Game. Why? Because pricing is irreversible/harmful (crowding out), while assurance building is low-cost.
      *   **Vocabulary Dispute (Tragedy of the Commons):**
          *   The objector is right technically. It's not a *commons* (rivalrous/depletable). It's a *Public Goods* problem (non-rivalrous/non-excludable).
          *   *Why it matters:* Commons solutions involve quotas/limits. Public Goods solutions involve subsidies/mandates/assurance. Calling it a Commons leads to wrong tools (restricting access) rather than right tools (increasing contribution).
      *   **Crowding-Out Objection:**
          *   *Strong Form:* Money signals "transaction" not "mission," killing intrinsic motivation (Titmuss argument).
          *   *Assessment:* Risk is real but manageable. If framed as "cost recovery" for non-participants rather than "selling data," it mitigates risk. However, since 7 are already voluntary, shifting to pay-to-play risks their morale too.
      *   **Verification/Enforcement Cost:**
          *   Who pays? The Trust (central fund). It's a public good within the cooperative.
          *   Good Faith Issue: Audit rights must be contractual. If we can't verify, the mandate is toothless. Need independent third-party audit funded by the Trust.
      *   **Decision Rule/Failure Trigger:**
          *   If participation < 9/12 by September, automatic trigger to implement the Finance Subcommittee's pricing model. This satisfies Faction 1 (price is coming) and Faction 2 (price is last resort).

  4.  **Refining and Polishing (Word Count & Tone Check):**
      *   *Tone:* Professional, decisive, collaborative but firm on logic.
      *   *Word Count:* Target ~1,100. Need to be concise but thorough.
      *   *Check Requirements:* Did I cover all 6 points?
          1.  Rec + Mechanism + Timetable? Yes.
          2.  Diagnostic + Evidence + Default? Yes.
          3.  Vocabulary (Commons vs. Public Good)? Yes.
          4.  Crowding Out? Yes.
          5.  Verification Cost? Yes.
          6.  Decision Rule? Yes.
      *   *Engaging Counter-arguments:* Ensure Faction 1 feels heard (pricing is the backup) and Faction 2 feels heard (assurance first).

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Start with the recommendation: Amend the proposal. Try assurance first, price later.
      *   Explain why: We don't know if it's greed or fear. Test fear first.
      *   Fix the terms: It's not a tragedy of the commons, it's a public good problem. Don't restrict access, increase contribution.
      *   Money talk: Acknowledge Titmuss. Money kills vibe. But we might need it.
      *   Enforcement: Who checks the data? Trust pays.
      *   Exit clause: If this fails in 6 months, price kicks in automatically.

  6.  **Drafting - Iteration 2 (Writing & Editing for constraints):**
      *   *Self-Correction on Word Count:* I need to ensure I don't ramble on the theory. Keep it applied to the 12 hospital systems.
      *   *Self-Correction on Recommendation:* Make sure the "Amendment" is concrete. Not just "think about it."
      *   *Specifics:* The "Assurance Compact" needs a name. Let's call it the "Threshold Commitment."
      *   *Verification:* Be specific. "Centralized audit."
      *   *Trigger:* "September Board Meeting."

  7.  **Final Review against Prompt:**
      *   ~1,100 words? (Will monitor during drafting).
      *   Register: Actionable document.
      *   All 6 points covered? Yes.
      *   Strongest considerations engaged? Yes.

  *(Self-Correction during drafting)*: I need to make sure I explicitly answer the "Tragedy of the Commons" objection clearly. The prompt asks to say whether the objection is correct. It *is* technically correct, but the implication is what matters. I must clarify that distinction.

  *(Self-Correction on Verification)*: The prompt asks "who should bear that cost." I should argue the Trust bears it as overhead, not the members directly, to avoid another collective action problem.

  *(Self-Correction on Decision Rule)*: Needs to be pre-committed. "If X, then Y."

  8.  **Final Polish:** Check flow and transitions. Ensure the voice is appropriate for a board member speaking to peers. (Proceed to generate output).

  *Word Count Check Strategy:* I will write fully then trim/expand to hit the ~1,100 mark. The prompt asks for "roughly 1,100 words." I should aim for 1,000-1,200.

  *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Governing Board, Regional Health Data Cooperative
  **FROM:** [Your Name]
  **DATE:** February 22
  **SUBJECT:** Recommendation on Membership Contribution and Access Proposal

  **Recommendation**
  I recommend we **Adopt with Amendments** the Finance Subcommittee's proposal. We should defer the immediate imposition of access charges and instead implement a "Threshold Commitment" mechanism for the next two quarters. Under this amendment, non-contributing members sign a binding pledge to contribute data if nine other systems are verified as contributors by September. If participation remains below ten of twelve systems by the September meeting, the original pricing and mandatory contribution clause automatically trigger. This approach secures the revenue backstop Faction 1 demands while testing the assurance hypothesis Faction 2 advances, preventing premature monetization that could degrade data quality or member relations.

  **Diagnostic Resolution**
  The board is divided between viewing this as a Prisoner's Dilemma (Faction 1) or an Assurance Game (Faction 2). For Faction 1 to be right, a member's benefit must remain constant regardless of others' contributions, making free-riding the rational dominant strategy. For Faction 2 to be right, the value of contribution must depend on critical mass; the two large academic systems likely withhold not to save costs, but because the registry's current coverage renders their data scientifically low-yield.

  We can discriminate between these diagnoses inexpensively before March. Staff should circulate an anonymous survey to the five non-contributors asking: "Would your system commit to contribution if nine other systems were verified participants?" If the answer is yes, pricing is unnecessary and potentially harmful. If the board cannot obtain this evidence by March, we must default to the Assurance Game diagnosis. This is not a neutral fallback; it is the risk-averse choice. Pricing is irreversible and risks crowding out goodwill; building assurance is low-cost. We should exhaust the low-cost lever before pulling the high-cost one.

  **The Vocabulary Dispute**
  The member objecting to the term "Tragedy of the Commons" is technically correct, and the distinction dictates our tools. A commons problem involves a rivalrous resource (like fish in a sea) where use depletes the stock. Our registry is non-rivalrous; my query does not diminish your ability to query. This is a **Public Goods** problem, specifically free-riding on a non-excludable benefit.

  This classification matters because "Commons" thinking leads to restriction (limiting access to save the resource), whereas "Public Goods" thinking leads to subsidization or mandate (increasing contribution to build the resource). If we treat this as a Commons, we might restrict query access, which harms scientific value. If we treat it as a Public Goods problem, we focus on the contribution side. The current proposal correctly targets contribution, but we must ensure we do not accidentally restrict access (the public good) through pricing mechanisms that deter small rural partners.

  **The Crowding-Out Objection**
  Faction 2 invokes the Titmuss argument: introducing money signals a transactional relationship that displaces moral obligation. In its strongest form, this suggests that paying non-contributors to contribute (or charging them) transforms the registry from a collaborative trust into a data vendor, causing the seven current contributors to reconsider their unpaid participation.

  Do these conditions obtain here? Partially. The seven contributors are motivated by mission alignment. However, the "regressive subsidy" argument from Faction 1 is also potent; altruism has limits when costs are asymmetric. Monetization will destroy cooperation only if it is framed as *profit* rather than *cost recovery*. To mitigate this, any future fees must be explicitly designated as operational offsets for the Trust, not revenue generation. However, until we are certain assurance is insufficient, we should not risk the signaling effect of money. The Threshold Commitment preserves the normative frame of partnership while establishing a clear boundary for future financial enforcement.

  **Verification and Enforcement Costs**
  A mandate is useless without verification. Determining whether a partner's data contribution is "complete and current" requires audit, which is itself a public good within the cooperative. If we leave audit costs to the Trust's general fund without replenishment, we create a second-order free-rider problem.

  The Board should designate verification as a core overhead cost funded by the Trust's existing endowment or grant reserves, rather than assessing members directly. Direct assessment for audit costs invites the same resistance as data contribution. Regarding good faith: we cannot rely on it. The Threshold Commitment must include a right for the Trust to engage an independent third-party technical auditor. If a member refuses audit access, they are automatically classified as a non-contributor for the purposes of the pricing trigger. This removes the ability to hide behind nominal compliance.

  **Decision Rule for Failure**
  To prevent returning to this impasse next year, the Board must adopt a pre-committed decision rule now. We are often reluctant to impose pain later, leading to procrastination.

  **The Trigger:** If the September Board meeting verifies fewer than ten contributing systems, the Finance Subcommittee's original pricing proposal (per-query fee plus tiered subscription) becomes effective immediately for the following fiscal quarter.
  **The Next Step:** Simultaneously, the mandatory contribution clause (Year 3) is accelerated to Year 2 for any system still non-compliant by September.

  This rule binds the Board's future self. It assures Faction 1 that price is not off the table, merely delayed. It assures Faction 2 that price is truly a last resort, giving the Assurance mechanism a genuine trial.

  **Conclusion**
  The status quo is unsustainable; the registry fails its founding mission without rural and safety-net data. However, imposing price before testing assurance risks solving a budget problem by creating a scientific one. By adopting the Threshold Commitment with a hard trigger for pricing, we align incentives without prematurely commodifying our collaboration. I move we adopt this amended pathway.
