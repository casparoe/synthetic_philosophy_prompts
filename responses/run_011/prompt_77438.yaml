answer: |-
  ### Restatement of the Argument in LOAC Vocabulary

  **The Traditionalist Position:**
  The traditionalist argues that **combatant status** functions as a binary switch that triggers the **combatant's privilege** and renders an individual a lawful target, irrespective of the lawfulness of their state's **resort to force**. This position relies on the **equal-application rule**: the rules of **distinction**, **proportionality in attack**, and **feasible precautions** bind all parties equally. To condition **combatant status** or **POW protections** on the *jus ad bellum* (the justice of the war) would collapse the separation between the legality of the war and the legality of conduct within it. The traditionalist contends that **military necessity** and the regulation of violence require a clear, objective standard (uniform, chain of command) rather than a subjective assessment of the war's justice.

  **The Revisionist Position:**
  The revisionist argues that **targetability** (liability to defensive harm) should not rest solely on **combatant status** but on moral responsibility for an unjust threat. Consequently, a combatant serving an unlawful **resort to force** lacks the moral standing to claim the **combatant's privilege**; their violence is not privileged but criminal. Conversely, a combatant serving a lawful **resort to force** retains a higher degree of protection against being targeted, as they do not pose an "unjust threat." The revisionist asserts that the **equal-application rule** is morally false because it grants immunity to those materially contributing to aggression while exposing those defending against it to equal risk.

  ***

  ### Residue Report

  This report sorts the principal claims of the philosophical debate into three categories based on their translatability into the Law of Armed Conflict (LOAC).

  #### Bucket 1: Clean Translation
  *Claims that map directly onto existing legal categories without loss of meaning.*

  1.  **The Equal-Application Rule:** The traditionalist claim that rules apply equally to both sides translates cleanly to the settled doctrine that LOAC applies regardless of the lawfulness of the **resort to force**.
  2.  **Combatant Status and Privilege:** The traditionalist claim that soldiers retain equal permission to fight maps to the **combatant's privilege** (immunity from prosecution for lawful acts of war) and **POW protections** upon capture.
  3.  **Distinction and Targetability:** The revisionist claim that liability tracks responsibility translates loosely to the legal concept of **direct participation in hostilities (DPH)** for civilians, where immunity is lost based on conduct. However, for uniformed personnel, this translation is imperfect (see Bucket 2).

  #### Bucket 2: Translation with Distortion
  *Claims that can be expressed in legal vocabulary only by altering their fundamental nature.*

  1.  **Moral Liability vs. Lawful Targetability:**
      *   *The Claim:* Revisionists argue unjust combatants are morally liable to be killed (like murderers); just combatants are not.
      *   *The Distortion:* LOAC does not adjudicate moral liability; it adjudicates **status**. Under LOAC, a combatant is a "lawful target" based on status, not moral guilt. To translate "moral liability" into "lawful target" distorts the legal concept by importing a retributive or corrective justice element that the law explicitly excludes from targeting decisions. The law permits killing without asserting the target *deserves* death morally.
  2.  **Epistemic Limits:**
      *   *The Claim:* Traditionalists argue soldiers cannot know if their cause is just.
      *   *The Distortion:* LOAC does not rely on the soldier's epistemic state regarding *jus ad bellum*. It relies on objective criteria for **combatant status** (wearing a fixed distinctive sign, carrying arms openly, etc.). Translating "epistemic limit" into law distorts it into an objective test of compliance with **distinction**, ignoring the soldier's actual knowledge of the war's justice.
  3.  **Collective Agreement:**
      *   *The Claim:* Traditionalists argue equality rests on a convention among states.
      *   *The Distortion:* While LOAC is treaty-based, translating "moral agreement" into "treaty obligation" strips the claim of its normative force. It becomes a positivist rule rather than a moral justification. The law enforces the agreement; it does not validate the moral reasoning behind it.

  #### Bucket 3: No Expression in Law
  *Claims that the legal vocabulary cannot formulate.*

  1.  **The Justice of the Resort to Force:** LOAC has no mechanism to weigh the moral validity of the **resort to force** during operational targeting. The law brackets *jus ad bellum* entirely. There is no legal category for "unjust combatant" versus "just combatant."
  2.  **Moral Responsibility for Aggression:** While "aggression" is a crime under international law (Rome Statute), it is a leadership crime. There is no legal category for the individual combatant's moral complicity in aggression that affects their **status** or **targetability** on the battlefield.
  3.  **The Revisionist's "Rare Confidence" Constraint:** The claim that even just combatants cannot be confident enough of an opponent's liability to kill them has no home in LOAC. The law requires Positive Identification (PID) of **status** or **DPH**, not moral certainty of liability.

  ***

  ### Specific Inquiries

  **(a) Is the revisionist's moral claim a denial of the equal-application rule, or something the legal order cannot formulate?**
  It is both, but primarily the latter. To simply deny the **equal-application rule** would be to argue for a different legal rule (e.g., "only aggressors may be targeted"). However, the deeper revisionist claim is that **targetability** should track *moral liability*. The legal order cannot formulate this because LOAC is status-based and conduct-based, not morality-based. The law lacks the vocabulary to distinguish between a soldier killing in lawful self-defense of a nation and a soldier killing in defense of an unlawful regime, provided both adhere to **distinction** and **proportionality in attack**. The revisionist is asking the law to adjudicate *jus ad bellum* at the tactical level, which the legal architecture is designed specifically to prevent.

  **(b) Do traditionalist appeals to agreement and epistemic limitation have any counterpart in devices like the combatant's privilege?**
  Yes, but they are functional proxies, not philosophical acknowledgments.
  *   **Collective Agreement:** The **combatant's privilege** is the legal instantiation of the "collective agreement." It is the *quid pro quo*: you follow the rules (**distinction**, **feasible precautions**), you get immunity (**POW protections**). The law does not cite the agreement as moral justification, but the mechanism is identical.
  *   **Epistemic Limits:** The law does not cite soldiers' ignorance of *jus ad bellum*. However, the objective criteria for **combatant status** (uniform, chain of command) serve a similar function: they create a bright line that does not require the opposing force to adjudicate the enemy's internal moral or legal reasoning. It substitutes an observable fact for an unobservable mental state.

  **(c) Does the revisionist conclusion—that even just combatants can rarely be confident enough of an opponent's liability to kill him—have a home among operational constraints?**
  It falls outside them entirely. Operational constraints (Rules of Engagement, Targeting Directives) rely on **Positive Identification** of a lawful target (status or conduct). They do not permit, let alone require, an assessment of the opponent's moral liability or the justice of their cause. To introduce this constraint would paralyze operations, as it demands a level of certainty regarding *jus ad bellum* that is institutionally unavailable to the tactical commander. The law requires **feasible precautions** to verify a target is not *hors de combat* or a civilian; it does not require precautions to verify the target is *unjust*.

  ***

  ### Concluding Position: The Nature of the Residue

  The residue indicates that the law is **deliberately impoverished**.

  The gap between the philosophical debate and the legal vocabulary is not an accident of drafting, nor does it indicate that the two camps are addressing entirely different objects. They are addressing the same object (the regulation of violence in war), but the law intentionally brackets the moral questions the philosophers debate.

  The law sacrifices moral granularity for **compliance** and **humanitarian protection**. If **combatant status** and **targetability** were tied to the justice of the **resort to force**, parties would never agree they were the aggressor, and the protections of **POW status** and **distinction** would collapse into reciprocal denial. The "impoverishment" is a feature, not a bug: it allows the law to function as a regulatory regime rather than a tribunal of ultimate justice. The traditionalist legal framework accepts that it cannot solve the moral problem of war; it seeks only to manage the violence. The revisionist critique is morally potent but legally inoperable because it demands the law perform a function (adjudicating *jus ad bellum* at the tactical level) that would destroy its utility as a constraint on **military necessity**.
