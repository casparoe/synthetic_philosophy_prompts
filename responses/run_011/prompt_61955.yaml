answer: |-
  You have put your finger on a precise and rather vexed corner of contemporary value theory. There is a label for the structure of the problem, though the philosophical consensus on how to resolve it is still very much in flux.

  The technical term for the reasons you are describing is **State-Given Reasons**, often discussed within the broader framework of the **Wrong Kind of Reasons (WKR)** problem.

  However, simply applying that label does not quite capture the moral weight you feel. To give you the edges of the thing as you requested, we must distinguish between *fittingness* and *propriety*, and examine why your case feels distinct from the standard 'demon' puzzles.

  ### 1. The Core Distinction: Fittingness vs. Propriety

  In the literature, the standard move is to distinguish between two normative questions:
  1.  **Is the attitude fitting?** (Does the object merit this response?)
  2.  **Is the attitude proper (or advisable)?** (Ought I, all things considered, to hold this attitude?)

  Your intuition is that the work possesses *aesthetic merit*, making admiration **fitting**. This is an **Object-Given Reason**: a reason grounded in the properties of the object itself (the virtuosity, the prose, the harmony).

  However, you also possess **State-Given Reasons** against admiring it. These are reasons grounded not in the object, but in the *state of holding the attitude*. In your case, the state of admiring this specific person entails complicity, or a betrayal of victims, or a harmful social signal.

  The established concept you are looking for is a **Normative Conflict between Fittingness and Propriety**. You are describing a situation where an attitude is *fitting* (merited by the object) but *improper* (forbidden by moral or relational norms).

  ### 2. Contrast with the Denier (Ethicism)

  You asked how this differs from the person who denies the premise. This is a debate between **Autonomism** and **Ethicism**.

  *   **The Denier (Ethicist):** A philosopher like Berys Gaut would argue for 'Ethicism'. They claim that moral defects in an artist *can* constitute aesthetic defects in the work. For them, the cruelty makes the novel *worse qua novel*. Therefore, admiration is not fitting. They collapse the moral reason into an object-given reason.
  *   **Your Position (Radical Autonomist):** You are maintaining that the aesthetic value is hermetically sealed from the moral context. The novel remains gorgeous *despite* the author. Therefore, the moral reason cannot be an object-given reason (it doesn't change the art); it must be a state-given reason (it changes the cost of admiring).

  The edge here is sharp: if you think the cruelty makes the prose feel 'tainted' or 'ugly' to read, you are sliding towards Ethicism. If you think the prose is perfect but reading it feels like shaking hands with a murderer, you are in the State-Given camp.

  ### 3. Contrast with the Demon (Prudential vs. Moral)

  You asked if your case is merely the 'demon' puzzle mirrored. In the classic WKR puzzle, a demon threatens to torture you unless you admire a saucer of mud. You have a reason to admire it, but the mud is not admirable.

  Your case is the inverse: you have a reason *not* to admire something that *is* admirable. Structurally, they are symmetrical. However, there is a substantive difference in the *kind* of State-Given reason involved, which explains why your case feels weightier.

  *   **The Demon Case (Prudential):** The reason is purely self-interested. It is external to the practice of admiration. Admiring the mud does not inherently hurt anyone; the punishment is an arbitrary add-on.
  *   **Your Case (Moral/Relational):** The reason is grounded in **Complicity** and **Endorsement**. Admiration is not a private mental state; it is a social gesture. To admire a tyrant is often to endorse them, or to signal that their achievements outweigh their crimes.

  This brings us to the edge of the concept. Some philosophers argue that because admiration *essentially* involves a degree of endorsement, moral reasons against endorsement might actually be **Object-Given Reasons** in disguise. If part of what 'admiration' *is* includes a positive moral stance towards the creator, then you cannot separate the two.

  However, if you hold to your intuition that the art *is* worthy, you are treating the moral cost as a **Regulative Constraint** rather than a **Constitutive Condition**.

  ### 4. Mapping the Edges

  To help you locate where your case sits, here is a breakdown of what falls inside and outside this conceptual shape.

  **Inside the Case (State-Given Reasons against Fitting Attitudes):**
  *   **Complicity:** Admiring the architecture of Albert Speer. The buildings are magnificent (fitting), but admiring them honours a Nazi (improper).
  *   **Loyalty Conflicts:** Feeling admiration for a rival's success when your own friend has been bested by them. The success is admirable; the attitude betrays friendship.
  *   **Hermeneutical Injustice:** Admiring a work that relies on stereotypes you know harm a group you belong to. The craft is skilled; the admiration validates the harm.

  **Outside the Case (Not the same shape):**
  *   **Prudential Fear (The Demon):** "I shouldn't admire this painting because the gallery owner is a psychopath who kills admirers." This is a State-Given reason, but it lacks the moral texture of complicity. It is merely safety.
  *   **The Ethical Denial:** "I cannot admire this painting because the paint was made with child labour." If you claim this makes the painting *ugly*, you are an Ethicist. If you claim the painting is *beautiful but tainted*, you are in the State-Given camp.
  *   **Incapacity:** "I cannot admire this because I am too depressed." This is a psychological constraint, not a normative reason.

  ### 5. Summary

  There is no single, catchy noun like 'The X Problem' that dominates the field, but if you were to search for papers on this, you would look for discussions on **"Reasons against Fitting Attitudes"** or the distinction between **"Fittingness and Propriety."**

  The specific nuance you are grasping is that moral reasons can function as **State-Given Reasons** without feeling as arbitrary as a demon's threat. This is because admiration is a **normative practice**, not just a private sensation. To admire is to take a stand.

  So, you are describing a conflict where the **Object-Given Reasons** (aesthetic merit) secure the *fittingness*, but the **State-Given Reasons** (moral complicity) undermine the *propriety*. You are not mistaken in feeling that the admiration is merited; you are simply recognising that merit is not the only thing that governs what we ought to feel.

  In British philosophical circles, one might say you are acknowledging that while the admiration is **warranted by the object**, it is **forbidden by the context**. The tragedy of the case lies in the fact that these two norms do not always align.
