answer: |-
  # Activity Design: The Protocol Treaty

  **Title:** The Protocol Treaty
  **Time:** 60 Minutes (Hard Stop)
  **Participants:** 16 (Engineers, PMs, Designers)
  **Goal:** Experience the tension between local autonomy and central coordination without using political theory jargon until the end.

  ## 1. Materials & Setup

  **Room:** Conference room with a whiteboard, one table (or pushed together), and a printer.
  **Printouts:**
  1.  **Unit Rosters:** 3 sheets assigning participants to Units (do not let them choose).
      *   **Unit Alpha:** 7 Members (The "Platform" - Large)
      *   **Unit Beta:** 5 Members (The "Mobile" - Medium)
      *   **Unit Gamma:** 4 Members (The "Legacy" - Small)
  2.  **Cost Cards:** Sealed envelopes for each Unit containing their private cost structure for Round 2.
  3.  **Score Sheets:** One per Unit to track points.
  4.  **The Charter Template:** A blank sheet on the whiteboard for Round 3.

  **The Non-Material Stake:**
  *   **The Whiteboard Marker:** In Round 3, only Units that meet a minimum score threshold in Round 2 are allowed to hold the marker and draw the system architecture. The losing Unit must dictate their ideas to another Unit's scribe. (Engineers deeply dislike losing control of the diagram).

  ## 2. The Mechanics (The "Code")

  **Currency:** "Velocity Points" (VP).
  **Objective:** Maximize your Unit's total VP.
  **Public Goods:**
  1.  **Local Cache:** Benefits only your Unit.
  2.  **Global API:** Benefits all Units, but implementation cost varies wildly.

  ### Round 1: Decentralized (10 Minutes)
  *   **Authority:** Units decide independently.
  *   **Task:** Choose to Implement or Skip the **Global API**.
  *   **Mechanic:** If ≥ 2 Units implement, *everyone* gets +50 VP (Network Effect). If < 2 Units implement, *everyone* gets 0 VP from the API.
  *   **Cost:** Each Unit pays their own implementation cost (Private Info, see Setup).
  *   **Local Cache:** Automatically implemented. Cost: 10 VP. Benefit: 30 VP. (Net +20).
  *   **Time:** 5 min discussion per Unit, 5 min reveal & scoring.

  ### Round 2: Centralized (15 Minutes)
  *   **Authority:** Plenary Vote (One Person, One Vote). Total 16 votes. Majority (9 votes) binds everyone.
  *   **Task:** Vote to **Mandate** or **Abort** the **Global API** for all Units.
  *   **Information:** Before voting, each Unit announces their *preferred outcome* and may state their cost verbally, but they do not have to prove it.
  *   **Cost:** Same private costs as Round 1.
  *   **Benefit:** If Mandated, everyone gets +50 VP. If Aborted, 0 VP.
  *   **Penalty:** If Mandated, Units pay their implementation cost. If Aborted, no cost.
  *   **Stake:** The Unit with the lowest *net* score after this round loses Whiteboard Rights for Round 3.
  *   **Time:** 5 min lobbying, 5 min vote, 5 min scoring.

  ### Round 3: Negotiated (15 Minutes)
  *   **Authority:** Constitutional Convention.
  *   **Task:** Write a "Charter" on the whiteboard defining who decides what for a hypothetical Round 4.
  *   **Constraint (The Lock):** You may assign decisions to "Local" or "Central." However, any decision assigned to **Central** in this Charter can only be moved back to **Local** later with a 75% Supermajority (12 votes). Decisions assigned to **Local** can be centralized with a simple Majority (9 votes).
  *   **Time:** 15 min discussion. (Facilitator calls time abruptly).

  ## 3. Setup & Private Information

  **Distribute Cost Cards secretly to Unit Leads before Round 1.**

  *   **Unit Alpha (7 people):** API Cost = **10 VP**. (Low friction. They want the API).
  *   **Unit Beta (5 people):** API Cost = **40 VP**. (Medium friction. Indifferent).
  *   **Unit Gamma (4 people):** API Cost = **70 VP**. (High friction. API is net negative for them).

  **Math Check:**
  *   **API Benefit:** +50 VP for everyone.
  *   **Alpha Net:** +50 - 10 = **+40**. (Strong Yes)
  *   **Beta Net:** +50 - 40 = **+10**. (Weak Yes)
  *   **Gamma Net:** +50 - 70 = **-20**. (Strong No)

  ## 4. Worked Playthrough (Verification)

  **Scenario:**
  *   **Round 1:**
      *   Alpha implements (Cost 10, Benefit 50). Net +40.
      *   Beta calculates: If I don't implement, and Gamma doesn't, we get 0. If I implement, I pay 40, get 50. Net +10. Beta implements.
      *   Gamma calculates: Cost 70, Benefit 50. Net -20. Gamma Skips.
      *   *Result:* 2 Units implement. Network Effect triggers. Everyone gets +50.
      *   *Scores:* Alpha (+40), Beta (+10), Gamma (+50 free rider).
      *   *Tension:* Gamma feels guilty/advantageous. Alpha feels exploited.

  *   **Round 2 (The Critical Moment):**
      *   Vote: Mandate API for everyone?
      *   Alpha (7 votes) votes **YES**. (They gain +40).
      *   Gamma (4 votes) votes **NO**. (They lose -20).
      *   Beta (5 votes) is the swing.
      *   *Lobbying:* Alpha tells Beta: "If we mandate, you get +10 guaranteed. If we don't, Gamma might free-ride again, or we get 0."
      *   *Outcome:* Alpha (7) + 2 from Beta (9 votes) = **Majority**.
      *   **Mandate Passes.**
      *   *Scores:* Alpha (+40), Beta (+10), **Gamma (-20)**.
      *   *Stake:* Gamma has the lowest score. Gamma loses the Whiteboard Marker for Round 3.
      *   *Legitimacy Complaint:* Gamma cannot say "This is inefficient" (because globally it is efficient: 40+10-20 = +30 total). Gamma must say: **"You forced us to burn cycles on a protocol we don't need. We had 4 votes and you didn't listen. This isn't our system."**

  *   **Round 3:**
      *   Gamma tries to write "API Decisions = Local" into the Charter.
      *   Alpha + Beta block it. They want to keep it Central to prevent free-riding.
      *   They write "API Decisions = Central."
      *   *The Lock:* Because it is now Central, moving it back to Local later requires 12 votes (Supermajority). Alpha + Beta = 12 votes. They can *keep* it Central forever. Gamma is locked out.
      *   *Result:* Participants feel the rigidity of the constitution they just wrote.

  ## 5. Minute-by-Minute Timeline

  *   **00:00 - 00:05:** **Intro.** Divide into Units (Alpha, Beta, Gamma). Hand out Cost Cards (Secret). Explain Points. **Do not mention subsidiarity.**
  *   **00:05 - 00:15:** **Round 1 (Local).** Units discuss internally. Reveal decisions. Calculate scores.
  *   **00:15 - 00:30:** **Round 2 (Central).** Open floor lobbying. Vote (Show of hands). Calculate scores. **Enforce Stake:** Take the marker from the losing Unit Lead.
  *   **00:30 - 00:45:** **Round 3 (Charter).** "Write the rules for the next team." Explain the Lock-in Rule (75% to decentralize). Facilitator watches the clock.
  *   **00:45 - 00:55:** **Debrief.** (See below).
  *   **00:55 - 01:00:** **Cleanup.**

  ## 6. Debrief Guide (10 Minutes)

  **Phase 1: The Legitimacy Complaint (5 mins)**
  *   Ask Unit Gamma: "How did Round 2 feel?"
  *   Listen for: "It was efficient, but unfair," or "They ignored our costs."
  *   **Point:** This is the difference between *Output Legitimacy* (we got points) and *Input Legitimacy* (we had a say). Federalism attempts to balance these.
  *   **Map:** Round 1 = Market/Decentralization. Round 2 = Unitary State/Centralization.

  **Phase 2: The Lock-In (3 mins)**
  *   Ask: "In Round 3, why was it hard to move the API decision back to Local?"
  *   **Concept:** **Kompetenz-Kompetenz** (Who decides who decides?).
  *   **Map:** The "Lock" rule represents a Constitution. Once power is centralized, it creates a constituency (Alpha/Beta) that benefits from the centralization and will vote to keep it. Reversing centralization is harder than maintaining it.

  **Phase 3: The Reveal (2 mins)**
  *   **Introduce Term:** **Subsidiarity**.
  *   **Definition:** "Decide at the lowest level capable of handling it."
  *   **The Catch:** The game shows why this is hard. Who decides if a level is "capable"? In Round 2, Alpha decided Gamma was "capable" of bearing the cost. Gamma disagreed.
  *   **Closing:** "In your org, when you argue about Platform vs. Product teams, you aren't just arguing about code. You are arguing about who has the right to define capability. That is a political question, not an engineering one."

  ## 7. Failure Modes & Tuning

  **1. The "Optimization" Trap**
  *   **Risk:** Participants treat this as a puzzle to maximize global points, ignoring the unit conflict.
  *   **Fix:** In Round 2, if Alpha tries to be "nice" to Gamma, remind them privately: "Your goal is to maximize *Alpha's* score, not the room's." (Whisper this to the Alpha Lead if they seem too cooperative).
  *   **Tuning:** If Alpha is too dominant, increase Gamma's cost to 80 VP. If Gamma is too sympathetic, increase Alpha's benefit to 60 VP.

  **2. Round 3 Runs Long**
  *   **Risk:** Engineers love architecting. They will try to write a perfect Charter.
  *   **Fix:** Be a hard dictator on time. At 45:00, say "Pen down." The frustration of an unfinished constitution is a feature, not a bug. It mirrors the incompleteness of real contracts.

  **3. The "Tragedy of the Commons" Objection**
  *   **Risk:** Someone says, "This is just a Tragedy of the Commons."
  *   **Response:** "Tragedy of the Commons is about *resource depletion*. This is about *authority allocation*. In Round 2, the resource wasn't depleted; the authority was transferred. The complaint wasn't 'we ran out of points,' it was 'you didn't ask us.'"

  **4. No Legitimacy Complaint**
  *   **Risk:** Gamma accepts the loss gracefully ("Hey, majority rules").
  *   **Fix:** This is the biggest risk. To mitigate, during Round 2 lobbying, encourage Alpha to speak *for* Gamma. "We know it's hard for Gamma, but it's best for the system." This paternalism usually triggers the "We had no say" reaction better than simple outvoting.
  *   **Contingency:** If Gamma stays silent, *you* (Facilitator) voice it in the debrief. "I noticed Gamma's costs were 70. That's a net loss. Did anyone ask Gamma if they could absorb that?"

  ## 8. What The Game Cannot Reproduce

  **Feature:** **Trust and Culture.**
  *   **Limitation:** In the game, Units are adversarial by design. In real organizations, Unit Alpha and Gamma might share a coffee culture or have overlapping staff.
  *   **Your Job:** In the debrief, explicitly state: "In this game, you were strangers. In your company, you share a paycheck. Trust lowers the transaction cost of federalism. If you trust the Center, you accept Round 2 outcomes. If you don't, Round 2 feels like occupation."

  **Feature:** **Exit Rights.**
  *   **Limitation:** Gamma cannot leave the company.
  *   **Your Job:** Note that political federalism often allows secession (theoretically). Corporate federalism does not. This makes the "Legitimacy" stake even higher because the minority is captive.

  ## 9. Tuning Parameters (If the group solves it too fast)

  If Round 1 results in perfect coordination (everyone implements):
  *   **Increase Variance:** Make Gamma's cost 90 VP (Net -40). They will definitely refuse in Round 1, forcing the Round 2 conflict.

  If Round 3 concludes too easily:
  *   **Add a "Veto" Token:** Give Gamma one Veto token they can use in Round 3, but if they use it, they lose 50 Points. This forces a trade-off between *power* and *score*, mimicking political capital.

  ## 10. Facilitator Script for the "Legitimacy" Moment

  *During Round 2 Voting:*
  When Gamma protests the cost, Alpha will likely say, "But the global benefit is +50."
  **You (Facilitator):** "Hold on. Gamma, you are saying the cost is too high. Alpha, you are saying the benefit is worth it. The rule is Majority Vote. Alpha has 7 votes. Gamma has 4. Alpha, do you have the votes to pass this?"
  *This forces Alpha to acknowledge they are imposing will, not finding consensus.*

  *During Debrief:*
  "When Gamma said 'This isn't our system,' that was not a bug report. That was a constitutional crisis. Subsidiarity is the attempt to prevent that sentence from being spoken."
