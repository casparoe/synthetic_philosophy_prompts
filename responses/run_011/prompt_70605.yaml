answer: |-
  **IPC Epistemic Triage Procedure**

  1.  **Grade Evidence (15 mins):** For each item, vote: **A** (Guideline/Meta-analysis), **B** (Observational/Consensus), or **C** (Single study/Analogy). **Judgment Call:** Distinguishing genuine consensus from institutional inertia requires honest debate; if two members dissent, downgrade one grade.
  2.  **Assess Dependency (15 mins):** Classify the sheet as **Independent** (tips used separately) or **Conjunctive** (a bundle where all items apply to one patient). If Conjunctive, apply **Conjunctive Risk** logic: the sheet's reliability cannot exceed its weakest item because errors compound rather than cancel.
  3.  **Set Publication Status (30 mins):**
      *   **A:** Print flat.
      *   **B:** Print flat if Independent. If Conjunctive, qualify ("Observational data suggests...").
      *   **C:** Qualify heavily ("Expert opinion only") or Omit. Never print analogies as fact.
  4.  **Draft Caveats (15 mins):** Reject blanket disclaimers. They carry zero information and induce warning fatigue. Attach specific footnotes to qualified items detailing evidence limits. A general caveat protects lawyers, not patients.
  5.  **Invoke Precautionary Principle (10 mins):** If evidence is C but harm is catastrophic, print with explicit label: "Consensus Based." This acknowledges the decision is values-driven, not evidence-driven.
  6.  **Escalate Values (5 mins):** If disagreement persists on Step 5, send to Medical Executive Committee. This is no longer evidence; it is institutional risk tolerance.

  **Worked Cases**

  **Case 1: CAUTI Sheet.** Twelve items, all Grade B (Observational), Conjunctive.
  *Decision:* Your risk managers are correct. Because a nurse applies all twelve to one patient, errors are not independent. The probability of the *bundle* being correct is lower than any single item. You must qualify the bundle header ("Based on observational consensus") or downgrade visual prominence. Do not print flat. Your pride in this sheet is a cognitive bias; the conjunctive risk is real.

  **Case 2: Novel Respiratory Pathogen.** Nine Grade A, two Grade C (single study), one Grade C (analogy).
  *Decision:* Publish nine items flat. Qualify the two single-study items ("Emerging data indicates..."). Omit the analogy entirely; transferring protocols across viruses without mechanistic evidence is epistemically invalid for flat guidance. It creates false confidence.

  **Limitations**

  This procedure cannot settle resource constraints (e.g., "We know N95s are better but don't have them") or legal liability thresholds. It separates evidence from values, but cannot dictate how much risk the hospital accepts when evidence fails. It also cannot fix a culture that punishes dissent; if staff fear qualifying recommendations, the steps will be ignored. Finally, it cannot account for local epidemiology shifts that occur between monthly publications; you must empower staff to override guidance when local data contradicts the sheet.
