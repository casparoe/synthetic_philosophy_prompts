  3.  **Develop the Procedure (The "Epistemic Triage" Protocol):**
      *   *Concept 1: Conjunctive vs. Disjunctive Risk.* If a nurse must do *all* steps for one patient, the probability of *all* being correct is lower than individual probabilities. This addresses the risk manager's point.
      *   *Concept 2: Evidence Grading.* Need a simple scale (e.g., A, B, C) but tied to publication status (Flat, Qualified, Omit).
      *   *Concept 3: Caveats.* Blanket caveats are indeed "warning fatigue." Specific qualifiers are better.
      *   *Concept 4: Values vs. Evidence.* Precautionary principle vs. Resource stewardship.

