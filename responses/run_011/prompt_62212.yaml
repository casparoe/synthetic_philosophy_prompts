      *   Avoid academic jargon where possible, or explain it clearly.
      *   Ensure no formatting violations (no bold, no lists).

  8.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I separate what provenance *needs* vs. what *fits*?
      *   *Correction:* Make sure to emphasize that provenance doesn't require believing the bureaucracy is a moral agent, just a functional one. It requires believing the *structure* is evidence.
      *   *Check:* Did I address the "co-author" question?
      *   *Correction:* Explicitly mention that provenance denies co-authorship in the structural sense, even if reparative description asserts it in the ethical sense.
      *   *Check:* Did I address the "irrecoverable loss"?
      *   *Correction:* Be clear that breaking original order destroys the evidence of the system's logic, not just the files' neighbors.
      *   *Check:* Formatting.
      *   *Correction:* Ensure no bullet points or bold text. Keep it as blocks of text.

  9.  **Final Polish:** Read through to ensure flow and coherence. Make sure the transition between the philosophical analysis of provenance and the practical implications of reparative description is smooth. Ensure the conclusion lands on the value of the tension itself.

  *(Self-Correction on Formatting)*: The prompt explicitly says "no headings, no bullet points, no bold, no tables". I must ensure the output is plain text paragraphs only.

  *(Self-Correction on Content)*: The user asked to "reconstruct it for me rather than agree with me". I need to maintain an analytical distance, explaining the logic of both sides without necessarily taking a side, though I should clarify where the contradictions lie.

  *(Refining the "Underdetermination" point)*: The user mentioned that a skeptical view could still keep original order. I need to validate this. Provenance is compatible with critical archival studies because it preserves the *trace* of power, even if to critique it. Rearranging by subject might sanitize the evidence of how the power operated.

  *(Refining the "Consistency" point)*: Are they consistent? They are pragmatically consistent (you can do both) but theoretically tense. Arrangement says "context is king." Description says "access is king." They serve different masters (evidence vs. justice). I should articulate this division of labor.

  *(Refining the "Subject-Based" point)*: If we swap to subject-based, we turn the archive into a library or a database. The record becomes about the *person*, not the *transaction*. This changes the ontological status of the document.

