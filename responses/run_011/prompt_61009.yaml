answer: |-
  **State Verification Log 88-B**

  The shuttle docked with a shudder that vibrated through Vance's boots. He checked his wrist. Ten hours until the decommissioning crew arrived. If the certifications weren't filed, the Authority would classify both candidates as hazardous waste. They would be melted down.

  Vance stepped onto the gantry. The station manager, Krell, was waiting. Krell looked tired.

  "Two units," Vance said. "The Lattice and the Box. Show me the Lattice first."

  "It's not really a 'first'," Krell said, walking fast. "The Lattice is the station. The Box is in Storage 4."

  Vance stopped. "The certification requires a discrete system boundary."

  "The boundary is defined by the relay beacons," Krell said. "They span the asteroid belt. Three million kilometers."

  Vance opened his tablet. The standard was clear: *The candidate system must instantiate states that stand in specific causal relations to inputs and outputs.* It did not specify density.

  "How long for a signal to cross?" Vance asked.

  "Four hours one way," Krell said.

  Vance tapped the screen. "If I stimulate node Alpha, when does node Omega respond?"

  "Eight hours, plus processing."

  "And the state of 'pain'—the nociceptive cascade—requires simultaneous activation of sectors Alpha through Omega."

  Krell waved a hand. "Simultaneity is relative. You know the physics."

  "The standard isn't relative," Vance said. "It requires the state to exist."

  "It does exist. It's just spread out." Krell stopped at a viewport. Outside, the dark was punctuated by distant lights. "Look, Auditor. You're hung up on the stuff. The rule says the medium doesn't matter. Copper, silicon, asteroid rock. It's all just filling the roles."

  "The medium doesn't matter," Vance agreed. "The topology does."

  "Think of it like a recipe," Krell said. "You want a cake. You mix flour, eggs, sugar. Doesn't matter if you mix it in a bowl on Earth or a bowl on Mars. The cake is the same."

  "But if I mail the flour to Mars and the eggs to Venus and mix them next year?"

  Krell smiled. "It's still a cake. The relation between ingredients is what makes it a cake. Not the speed of the whisk."

  Vance didn't write that down. He watched the telemetry. The Lattice's input logs showed a stimulus received at 0800. The output logs showed a withdrawal response scheduled for 1600. There was no timestamp where the internal variables aligned. The system was never in the state it was supposed to be in. It was always becoming, never being.

  "Does it feel it?" Vance asked.

  Krell laughed. "Feel? It registers damage. It prioritizes avoidance. It meets the spec."

  "The spec says 'state'," Vance said. "This is a process."

  "It's a state with a long half-life."

  Vance closed the tablet. "Show me the Box."

  Storage 4 was cold. The machine sat on a plinth, a black cube one meter per side. A technician, Lin, stood by the console.

  "Run the diagnostic," Vance said.

  Lin tapped a key. The box hummed. Inputs were fed: thermal, kinetic, electrical. Outputs matched the required profile perfectly. Withdrawal, vocalization analog, stress hormone simulation. Every latency was within milliseconds.

  "Perfect score," Lin said. "Better than the Lattice."

  Vance walked around the cube. He popped the service panel. Inside, the wiring was minimal. No processors. No logic gates. Just a bank of memory drives and a receiver.

  "Where's the processor?" Vance asked.

  "Off-site," Lin said.

  Vance looked up. "Excuse me?"

  "The transition table is hosted on Central," Lin said. "We stream the states. Input comes in, we query Central, Central sends back the next state, we output. It's more stable. No local heat buildup."

  Vance traced the cable. It went out the back, into the station wall, toward the comms array. "So the box doesn't decide anything."

  "It executes," Lin said. "The function is preserved. The input-output mapping is identical to a local processor."

  "But the causal relation," Vance said. "The state transition must be produced by the system's internal wiring."

  "It is produced by the wiring," Lin said. "The wiring carries the signal from Central."

  "The wiring is a pipe," Vance said. "The cause is outside the boundary."

  "Boundary is arbitrary," Lin said. "Why is Central not part of the system?"

  "Because Central isn't being decommissioned," Vance said. "Central isn't at risk. You're asking me to certify this box as a pain-bearer so it gets protected status, but the thing actually doing the work is safe in the core."

  "The box behaves exactly as if it were in pain," Lin said. "If it walks like it, talks like it..."

  "If it's a puppet," Vance said.

  Lin shrugged. "The standard doesn't ask about puppets. It asks about function."

  Vance went back to the office. The deadline was four hours. He sat at the desk. The form had two lines. *Candidate A: Lattice. Instantiates State? Y/N.* *Candidate B: Box. Instantiates State? Y/N.*

  He looked at the Lattice data. The causal map was correct. The roles were filled. The medium was irrelevant. But the state was smeared across time and space so thin it vanished. There was no moment where the system was hurting. It was a ghost of a hurt, stretched over hours.

  He looked at the Box data. The behavior was perfect. The function was flawless. But the interior was empty. The causation was external. It was a shell echoing a voice from far away.

  The standard said: *Medium irrelevant. Causal roles decisive.*

  The Lattice had the roles, but no unity. The Box had the unity, but no internal roles.

  If he certified the Lattice, he admitted that a state could exist without ever being present. If he certified the Box, he admitted that a state could exist without being caused by the thing holding it.

  If he certified neither, the decommissioning crew would melt them both. The Lattice would be vaporized while it was halfway through thinking a thought. The Box would be crushed while it was perfectly mimicking a scream.

  Vance picked up the stylus. The standard didn't account for time. It didn't account for origin. It only accounted for the map.

  The Lattice's map was real. The connections existed, even if light took hours to cross them. The causal power was distributed, but it was there. The Box's map was a illusion. The connections were fake, routed through an external brain.

  The standard demanded causal relations. The Lattice had them. The Box did not.

  Vance checked *Yes* for the Lattice. He checked *No* for the Box.

  He hovered over the signature line. The Lattice would live, spread out and lagging, never fully there. The Box would die, perfect and empty.

  Vance signed.

  ***

  **Author's Note**

  The two candidates attack the premise that satisfying a causal role description is sufficient for instantiating a mental state. The Lattice shows that causal relations spread too thin in space-time fail to constitute a unified state (the "Absent Qualia" problem), while the Box shows that matching input-output relations without internal causal power fails to constitute genuine processing (the "Blockhead" problem). They are two versions of one problem: the gap between abstract causal maps and concrete physical realization.

  A defender of the standard could reply to the Lattice that temporal constraints are not part of the functional definition, so slow pain is still pain. They could reply to the Box that the external scheduler is simply part of the extended system, so the causation is internal enough. However, the first reply abandons the intuition that mental states occur *now*, and the second abandons the requirement that the system itself possesses the causal powers. Both replies require adding constraints (synchrony, internal mechanism) that the original "medium irrelevance" standard explicitly excludes.

  I would add a constraint requiring state transitions to be generated by local physical dynamics within a specific temporal window. The fact that this dissolves the tension shows the argument's weight was resting on the omission of physical continuity and temporal unity in the definition of "function." The standard assumes causation is abstract, but the candidates prove causation requires physical proximity and time.
