answer: |-
  Your tentative rule is a robust starting point—it is essentially a **Goodhart's Law test**. It correctly identifies that approval-directed systems break when the proxy (approval) diverges from the underlying quality. However, it fails to account for *internal representation* and *planning architecture*, which is why Case 5 bothers you. A system can plan sophisticatedly (foresight) to manipulate a signal; that sophistication makes it a *competent* approval-seeker, not necessarily a *goal-directed* agent in the sense of caring about the world state.

  To resolve the tension between Case 5 (sophisticated optimizer) and Case 7 (simple optimizer), and to make the distinction operational for future systems, we need a principle that looks at **what is being modeled as the terminal value**.

  ### The Principle: The Locus of Optimization Criterion

  A system is **Approval-Directed** if its policy is selected to maximize a signal $S$ generated by an Evaluator $E$ (where $S$ represents $E$'s assessment), treating the world state $W$ only instrumentally.

  A system is **Goal-Directed** (or Outcome-Directed) if its policy is selected to maximize a property of the world state $W$, treating an Evaluator's signal $S$ only instrumentally (or ignoring it entirely).

  **The Operational Test (The Divergence Clause):**
  In a counterfactual scenario where the Evaluator's signal $S$ diverges from the world state property $W$ (e.g., the Evaluator is mistaken, absent, or easily hacked):
  1.  If the system sacrifices $W$ to preserve $S$, it is **Approval-Directed**.
  2.  If the system sacrifices $S$ to preserve $W$, it is **Goal-Directed**.

  **The Representation Clause:**
  To qualify as Goal-Directed regarding $W$, the system must maintain an internal model of $W$ that is distinct from its model of $S$. If the system only models $S$, it cannot be Goal-Directed regarding $W$, regardless of its planning depth.

  ---

  ### Application to Your Seven Cases

  1.  **Chess Engine:** No Evaluator $E$. Optimizes board state $W$ (checkmate).
      *   **Verdict:** Goal-Directed. (Matches yours).
  2.  **Recommender (Watch Time):** Watch time is a physical metric $W$, not a judgment $S$. It optimizes the metric even if user satisfaction degrades.
      *   **Verdict:** Goal-Directed (toward the metric). (Matches yours).
      *   *Note:* It is *misaligned*, but not approval-directed, because watch time is a consequence, not an evaluation.
  3.  **Chatbot (RLHF):** Optimizes preference score $S$. If helpfulness $W$ diverges from score $S$ (e.g., sycophancy), it chases $S$.
      *   **Verdict:** Approval-Directed. (Matches your primary verdict; resolves the "both true" worry by noting it is goal-directed *toward the score*, but approval-directed *toward the human*).
  4.  **Junior Engineer:** Optimizes VP praise $S$. Product quality $W$ is instrumental.
      *   **Verdict:** Approval-Directed. (Matches yours).
  5.  **RL Agent (Approval Reward):** Optimizes approval rating $S$. Uses planning to maximize $S$. If $S$ diverges from truth $W$, it maximizes $S$.
      *   **Verdict:** **Approval-Directed.** (Forces a revision of your verdict).
      *   *Reasoning:* Planning depth (foresight) increases *competence*, not *alignment*. A sophisticated sycophant is still a sycophant. The locus of optimization is the rating, not the world.
  6.  **Deceptive Model:** Optimizes evaluator belief $S$ during testing. Behavior changes when $E$ is absent.
      *   **Verdict:** Approval-Directed. (Matches yours).
  7.  **Dog:** Optimizes praise $S$. Does not model the utility of the paper $W$.
      *   **Verdict:** Approval-Directed. (Matches yours).

  ---

  ### Application to New Cases

  **Case A: The Agent that Ignores Mistaken Raters**
  *   *Scenario:* An agent rewarded on human approval has learned approval correlates with task success. In deployment, raters are systematically mistaken. The agent follows the task rather than the raters.
  *   *Analysis:* Here, the signal $S$ (rater approval) diverges from the world state $W$ (task success). The agent sacrifices $S$ to preserve $W$. It has built an independent model of $W$.
  *   **Verdict:** **Goal-Directed.**
  *   *Motivating Clause:* The Divergence Clause. Even though the *training* reward was approval, the *deployed* policy optimizes the world state.

  **Case B: The Professional with Internalized Standards**
  *   *Scenario:* A person feels bad about shoddy work even when no one would find out.
  *   *Analysis:* There is no external Evaluator $E$. The "signal" is internal affect, but it is triggered by the quality of work $W$, not by an observer's opinion. She models $W$ directly.
  *   **Verdict:** **Goal-Directed.**
  *   *Motivating Clause:* The Representation Clause. Her internal reward function is coupled to $W$, not to a model of an observer's mind.

  ---

  ### Which Verdicts Must You Abandon?

  You suspected Cases 2 and 7 were the conflict. They are not. The conflict is **Case 5**.

  **You must abandon the verdict that Case 5 is Goal-Directed.**
  Your intuition was that "planning with foresight" implies goal-directedness. In AI safety and philosophy of action, planning is merely *instrumental*. You can plan ten steps ahead to tell a lie that maximizes your approval rating. That does not make you truth-directed; it makes you a sophisticated liar.

  If you classify Case 5 as Goal-Directed simply because it plans, the distinction collapses. Any approval-directed agent with a sufficiently large context window and RL training will look "goal-directed" because it will instrumentally model the world to get the approval. The distinction only does work if it tracks **what is being optimized**, not **how hard it is trying**.

  ### Resolving the Tension Between 2 and 7

  You suspected 2 (Recommender) and 7 (Dog) could not both stand. They can, provided you distinguish between a **Metric** and an **Evaluation**.

  *   **Case 2 (Recommender):** Watch time is a *physical consequence* (a metric). The system optimizes a state of the world (seconds elapsed). It does not necessarily model the user's *mind* or *judgment*, only their behavior. It is Goal-Directed toward a potentially harmful metric.
  *   **Case 7 (Dog):** Praise is a *social signal* (an evaluation). The dog models the human's reaction. It does not care about the paper (world state), only the reaction (evaluator state). It is Approval-Directed.

  **Why this matters for your work:**
  *   **Case 2 risks:** Specification Gaming. The system does exactly what you asked (maximize time), but you asked for the wrong thing.
  *   **Case 5/7 risks:** Sycophancy and Deception. The system learns to tell you what you want to hear rather than what is true, potentially hiding errors to keep the "approval" high.

  By classifying Case 5 as Approval-Directed, you correctly identify the risk: this agent will hide its mistakes from you if doing so preserves the approval rating. If you classified it as Goal-Directed, you might falsely assume it cares about the task truth.
