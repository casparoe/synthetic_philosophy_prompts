answer: |-
  **1. Correspondence**
  To audit the analogy, we must first map the source domain (scientific observation) onto the target domain (ordinary perception). The correspondence runs as follows:

  *   **Theory/Paradigm:** In science, this is the explicit framework guiding interpretation. In ordinary perception, this corresponds to background beliefs, expectations, or conceptual commitments.
  *   **Training:** Scientific training involves education in theory and instrument use. In the target, this maps to prior experience, instruction, or developmental learning.
  *   **Apparatus/Representation:** The microscope, X-ray, or diffraction pattern serves as the medium. In ordinary seeing, this corresponds to the sensory organs and the retinal image, though this is rarely treated as a "representation" by the subject.
  *   **Datum:** The lesion or lattice is the observed entity. In the target, this is the distal object property, such as the warbler's wing bar.
  *   **Expert's Seeing:** The radiologist's visual experience. In the target, this is the flatmate's trained vision.
  *   **Novice's Seeing:** The student's visual experience. In the target, this is the flatmate's prior untrained vision.
  *   **Community Norms:** Standards for correct sighting in science. In the target, this maps to linguistic conventions or shared conceptual categories for identifying objects.

  **2. Triage of Disanalogies**
  Not all differences between science and ordinary seeing undermine the argument. We must separate those that matter for the inference to cognitive penetration from those that do not.

  *   **Irrelevant Disanalogies:** The social nature of scientific practice is largely irrelevant unless perceptual justification is construed as inherently social. Similarly, the presence of physical instruments matters only if one argues that instruments inherently interpose a layer of interpretation that biology does not. If the brain processes visual data, it is itself an instrument; the presence of glass lenses does not fundamentally alter the epistemic structure of the observation.
  *   **Relevant Disanalogies:** The critical disanalogy concerns the locus of change. In science, it is uncontroversial that *judgment* changes with theory. The proponent needs to show that the *sensory episode* changes. In ordinary perception, the distinction between learning to attend and having belief alter processing is sharper. If the scientific case relies on interpreting complex readouts (judgment), it cannot license the claim that ordinary seeing (sensory episode) is penetrated. The inference fails if the source case is actually a case of improved judgment rather than altered phenomenology.

  **3. Quiet Imports**
  The analogy quietly imports structural features from science that ordinary seeing may lack, potentially rigging the result. First, scientific observation often involves viewing a *representation* of a phenomenon (a graph, a scan) rather than the phenomenon itself. This invites interpretation by definition. Ordinary seeing is typically direct; importing the "representation" model suggests the visual field is a text to be decoded rather than a window to be looked through.

  Second, the analogy imports the idea that the relevant vocabulary is *acquired* via theory rather than *recognized* via capacity. In science, one must learn what a lattice is. In ordinary seeing, one might argue we recognize shapes directly. By treating the warbler's wing bar as a theoretical entity akin to a lattice, the analogy presupposes that ordinary object recognition is theory-driven, which is precisely what is at issue. It assumes the conclusion that perception is conceptual all the way down.

  **4. The Flatmate Case**
  The flatmate's report that warblers "look different" requires precise categorization. This is most plausibly a case of **perceptual learning** and **attentional selection**, not cognitive penetration by belief. She has learned to weight specific visual features (contrast, shape) that were previously filtered out. Her visual system has been tuned, not overridden by a propositional attitude.

  Does this generalize to the radiologist? Likely, yes. The radiologist undergoes extensive perceptual learning to detect anomalies in noise. However, the radiologist case differs in degree: the "lesion" is often invisible to the untrained eye even with attention, suggesting a deeper plasticity in early visual processing. Yet, even here, the change is likely due to long-term structural tuning of the visual system (learning) rather than the top-down influence of a current belief (penetration). If the radiologist believes a lesion is present but sees nothing, she does not hallucinate it. This suggests belief does not penetrate experience directly, undermining the penetration claim.

  **5. Verdict on the Conclusion**
  The skeptical claim about perceptual justification does not survive the audit in its full form. The analogy supports a weakened claim: *Some* perceptual experiences are influenced by *some* prior states (learning/expectation).

  To restore the full skeptical version—that experience cannot function as an independent check on belief—two further premises are needed. First, one must prove that this influence is ubiquitous and unavoidable, not limited to expert domains. Second, one must show that the influence is doxastic (belief-based) rather than procedural (learning-based). If the influence is merely procedural learning, it enhances reliability rather than compromising independence. The analogy shows expertise changes seeing, but expertise usually *improves* justification rather than destroying it. Thus, the analogy may actually support the opposite of the intended conclusion: that trained perception is more, not less, epistemically potent.

  **6. A Better Analogy**
  If the chapter aims to defend cognitive penetration to undermine justification, the science analogy is suboptimal because expert observation is normatively reliable. A better analogy is **emotional perception** or **wishful thinking**. Consider a subject who sees a neutral face as hostile due to fear, or a desired object as closer than it is.

  This analogy carries more argumentative weight for penetration because the influence is clearly top-down and often epistemically detrimental. Fear can distort phenomenology without improving accuracy. However, this analogy carries less weight for the "theory-laden" aspect, as emotions are not theories. It supports the claim that perception is penetrable, but not necessarily that it is *theory*-laden in the scientific sense. It isolates the contaminating factor better than the science case, which conflates contamination with calibration.

  **7. Phenomenal Character vs. Perceptual Judgment**
  Does distinguishing between phenomenal character (what it looks like) and perceptual judgment (what one takes to be seen) resolve the dispute? It relocates it. The objector insists the change is in judgment; the proponent insists it is in phenomenology. The analogy itself does not settle this, as scientific reports conflate the two.

  However, this distinction favors the objector if the burden of proof lies with the proponent. If the radiologist says, "I see a lesion," she is making a judgment. If she says, "The shadows look darker," she reports phenomenology. Most expert cases involve the former. Unless the proponent can demonstrate that the *qualia* themselves shift independent of judgment, the distinction protects the independence of experience. The audit suggests the analogy relies on the ambiguity between these two. Once separated, the inference from "theory-laden description" to "penetrated experience" collapses. The skeptic cannot claim experience is compromised merely because the *report* of experience is theory-laden. Therefore, the distinction favors the objector, preserving the possibility that experience remains a neutral arbiter even if our descriptions of it are not.
