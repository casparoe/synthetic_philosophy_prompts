answer: |-
  Your diagnosis is remarkably sharp, and I believe it largely succeeds in rescuing Hume from the charge of simple contradiction, though it does so by revealing a deeper tension in his political economy rather than eliminating it entirely. You are quite right to separate the level of money from its growth rate, and to distinguish between the positional advantages of money stock versus the transitional advantages of money flow. This distinction allows us to see that Hume is operating with two different models of the economy simultaneously: a static equilibrium model where money is neutral, and a dynamic disequilibrium model where money is a stimulant. When he says money is of no consequence, he speaks of the settled state where prices have fully adjusted to the stock of specie. When he advises the magistrate to increase money, he speaks of the interval of adjustment, where prices rise more slowly than wages and profits, thereby awakening industry. This is not a contradiction but a sophisticated anticipation of the short-run versus long-run distinction found in later economics.

  The essay on interest fits neatly into this rescue operation. By denying that money quantity determines interest rates, Hume reinforces the long-run neutrality thesis. If interest depends on real savings and profits rather than the abundance of coin, then the benefit of increasing money cannot be cheap credit. It must be, as you note, the transitional profit incentive that matters. The inflow of money raises prices for manufacturers before it raises the cost of labor, increasing profits and encouraging employment. Thus, the interest essay does not conflict with the money essay; rather, it clarifies that the mechanism of stimulation is not via the cost of borrowing but via the lag between price levels and factor costs. Your separation of positional and transitional reasons holds here too: low interest is a sign of national riches (a level effect), while increasing money is a tool for stimulating activity (a growth effect).

  The lock-up bank proposal, however, is the true stress test for your diagnosis. You suggest distinguishing money in circulation from money as a dormant claim on labor. This helps, but only if we accept that Hume is willing to sacrifice internal warmth for external strength. The lock-up bank is not designed to stimulate industry; it is designed to suppress prices. By withdrawing money from circulation, the bank keeps domestic prices low relative to neighbors, ensuring a favorable balance of trade and the ability to undersell competitors. This is purely positional. It contradicts the advice to increase money only if we assume the magistrate always seeks maximum internal industry. But Hume explicitly limits the advantage of large money stocks to wars and negotiations. The lock-up bank is a war chest and a competitiveness tool, not a growth engine. It resolves the inconsistency if we view it as a specific instrument for state security rather than general prosperity. However, it does reveal a mercantilist hangover in Hume's thought. He cannot fully abandon the idea that money sitting in a vault is power, even while arguing that money in circulation is wealth. The distinction between circulating and dormant money saves the logic, but it highlights a conflict between his liberal economic theory and his realist statecraft.

  Regarding the three accounts you say Hume owes, your skepticism is well-placed. First, on the speed of adjustment, Hume is indeed vague. He knows prices do not rise instantly, but he offers no theory of stickiness beyond general observation. This is a gap, but not a fatal one; he relies on the empirical fact of the lag rather than explaining its microfoundations. Second, on the permanent residue of industry, this is the most dangerous point for his system. If the spirit of industry persists after the money inflow stops, then money is not neutral in the long run, and his quantitative theory collapses. Hume likely assumes the spirit fades without the stimulus, preserving neutrality, but he does not prove it. If you are right that this creates a treadmill, then his attack on the jealousy of trade is undermined, because permanently managing money flow would be necessary to maintain employment. Third, on the entry channel, Hume insists it matters whether money enters through manufacturers or landlords. This does not contradict the interest essay because the entry channel affects the distribution of spending and the speed of price adjustments, not the fundamental supply of loanable capital. The interest rate is determined by the stock of real riches, but the path to that stock is influenced by who holds the money first.

  So, does your diagnosis relocate the problem rather than solve it? I think it solves the logical contradictions but relocates the tension to a political one. The system coheres logically if we accept the level versus growth distinction. The tension remains in the policy recommendations. Hume wants the benefits of a growing money supply for industry, but he also wants the benefits of a low price level for trade competitiveness, and these are mutually exclusive in the long run. You cannot have rising prices to stimulate workers and falling prices to undersell neighbors simultaneously. The lock-up bank chooses the latter; the general advice chooses the former.

  Ultimately, for the rest to cohere, the strand that must be given up is the universal validity of the lock-up bank proposal. It is an outlier that belongs to a different era of thought. If we treat it as a specific exception for times of imminent war or extreme distress, it fits the positional advantage category. But if it is treated as a general policy for peace, it contradicts the circulationist argument that wealth consists in labor and commodities, not specie. Hume's greatest insight is that money is a veil over real activity. The lock-up bank treats the veil as the substance. To save Hume from himself, we must read the lock-up bank as a concession to the realities of eighteenth-century state finance, where specie was literally needed to pay mercenaries, rather than as a core tenet of his economic theory. Your diagnosis holds, provided we accept that Hume's political realism occasionally overrules his economic liberalism, and that the neutrality of money is a long-run tendency that policy can temporarily exploit but never permanently escape.
