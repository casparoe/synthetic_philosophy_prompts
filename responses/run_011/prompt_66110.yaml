answer: |-
  Here is the specification for a legitimate post-war international criminal process, broken down by requirement, justification, and classification.

  ### The Requirements List

  **1. Ex Ante Definition (The Legality Principle)**
  *   **Requirement:** The conduct charged must have been defined as criminal with attached penalties prior to the commission of the act.
  *   **Consideration/Case:** This prevents arbitrary power. If the law is made after the fact, the trial is merely a tool for policy, not justice.
  *   **Historical Complication:** The "Crimes Against Peace" charge at Nuremberg and Tokyo. The 1928 Kellogg-Briand Pact banned war but specified no penalty for leaders. The Tokyo dissent argued that criminalizing aggressive war retroactively violated this principle.
  *   **Classification:** **Debatable (The "Taste" Divide).** Legal positivists treat this as non-negotiable. Natural law advocates argue that acts like genocide or aggressive war are *malum in se* (wrong in themselves) and demanding a statute is a category error. This is the core friction between your brother-in-law and your girlfriend.

  **2. Adversarial Integrity (Process)**
  *   **Requirement:** The defense must be permitted to challenge evidence, cross-examine witnesses, and introduce exculpatory material without fear of judicial reprisal.
  *   **Consideration/Case:** Without this, the verdict is predetermined. Truth-finding requires friction.
  *   **Historical Complication:** The Nuremberg Charter allowed "judicial notice" of government reports without proof (used by Soviets for Katyn). However, the charge was dropped when evidence failed, suggesting the court retained some integrity. Conversely, the *tu quoque* (you did it too) plea was rejected as a legal defense, though evidence of Allied submarine warfare was admitted to mitigate the sentence of Dönitz.
  *   **Classification:** **Non-Negotiable.** If the defense cannot speak, it is not a trial; it is a sentencing hearing or a lynching.

  **3. Individual Culpability (Agency)**
  *   **Requirement:** Guilt must attach to specific individuals based on personal action or intent, not merely membership in a group or organization.
  *   **Consideration/Case:** Collective punishment violates moral agency. You cannot punish a man solely for wearing a uniform.
  *   **Historical Complication:** The Nuremberg declaration of "criminal organizations" (like the SS) was an efficiency move to process thousands of cases. It allowed membership to serve as prima facie evidence of guilt, blurring the line between association and participation.
  *   **Classification:** **Non-Negotiable.** Diluting this turns justice into administrative purging.

  **4. Jurisdictional Symmetry (Impartiality)**
  *   **Requirement:** The legal framework must theoretically apply to the victors' conduct as strictly as the losers'.
  *   **Consideration/Case:** If the law binds only the defeated, it is a weapon, not a rule.
  *   **Historical Complication:** The ICC's early focus on African defendants while major powers (US, Russia, China) remained outside its jurisdiction mirrors the Nuremberg asymmetry. The 1943 Declaration originally contemplated local trials, which would have been more symmetrical, but was replaced by a victor-controlled tribunal.
  *   **Classification:** **Non-Negotiable in Theory, Structurally Compromised in Practice.** A court that cannot touch the powerful lacks moral authority, but post-war realities often make this impossible.

  **5. Substantive Necessity (Moral Gravity)**
  *   **Requirement:** The charged conduct must represent a violation of fundamental human norms that transcends local statute.
  *   **Consideration/Case:** Prevents technicalities from shielding atrocity. If a state legalizes extermination, international law must override that domestic legality.
  *   **Historical Complication:** Your girlfriend's point. The Holocaust was industrial murder; insisting on a specific 1939 statute to criminalize it elevates bureaucracy over morality.
  *   **Classification:** **Non-Negotiable.** Without this, international law cannot intervene in sovereign atrocities.

  ***

  ### The Incompatibility Triangle

  Your suspicion is correct. In a post-war environment where one side has surrendered unconditionally, you cannot satisfy these three vertices simultaneously:

  1.  **Strict Legality** (No retroactive crimes).
  2.  **Comprehensive Accountability** (Reaching the worst offenders for the worst acts).
  3.  **Jurisdictional Symmetry** (Binding the winners).

  **Why they conflict:**
  If you insist on **Strict Legality** (1), you often cannot charge "Crimes Against Humanity" or "Aggressive War" because no prior statute defined them with penalties. To achieve **Comprehensive Accountability** (2) for those specific acts, you must relax (1).
  If you insist on **Jurisdictional Symmetry** (3), you cannot hold the trial at all, because the victorious powers will not submit their own leaders (e.g., Allied bombing campaigns or Soviet Katyn) to a tribunal they control. To hold the trial, you must sacrifice (3).
  If you prioritize **Comprehensive Accountability** (2) and **Jurisdictional Symmetry** (3), you would have to indict the victors, which would likely collapse the political order required to enforce the court's existence.

  **Which one has to give:**
  In every historical instance of victor's justice, **Strict Legality** is the first casualty. The international community accepts retroactive charges for atrocities because the alternative (impunity for genocide) is deemed morally worse than the violation of the *nullum crimen* principle. **Jurisdictional Symmetry** is the second casualty; it is structurally impossible in a post-surrender context unless a supra-national authority exists that is stronger than the victors (which does not exist).

  ***

  ### Application to the Standard Package

  The "best available option" defense for Nuremberg relies on the claim that the alternative was summary execution (as favored by Churchill and Morgenthau). By that metric, Nuremberg delivered **Adversarial Integrity** and **Individual Culpability** (mostly), even while failing **Strict Legality** and **Jurisdictional Symmetry**. The ICC faces the inverse problem: it satisfies **Strict Legality** (via the Rome Statute) but fails **Jurisdictional Symmetry** (due to great power opt-outs), leading to the perception of selectivity.

  **Conclusion**
  The single requirement that knocks out the most candidates is **Jurisdictional Symmetry**, as enforcement mechanisms invariably rely on the political will of the very powers most likely to be scrutinized. The standard defense of Nuremberg survives this list only if you classify **Strict Legality** as subordinate to **Substantive Necessity**, accepting the trial as a foundational act of law-making rather than a pure application of existing law.
