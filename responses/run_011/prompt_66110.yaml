          *   If you insist on reaching the worst offenders (2), you might have to stretch definitions or ignore procedural niceties (1 is threatened).
          *   If you insist on binding the winners (3), you might not have jurisdiction over them (victors don't surrender to themselves), leading to selectivity (2 is threatened).
      *   *Verdict:* The triangle is real. You generally cannot have perfect legality, perfect retribution against the "worst," and perfect symmetry in a victor's court context.

  3.  **Drafting the Requirements List:**
