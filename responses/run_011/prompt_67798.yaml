prompt: |-
  I sit on the board of a forty-unit housing co-operative, and next month we vote on a proposal that has split us in a way I did not expect. Twelve years ago our bylaws let any member buy vacant units at a fixed formula price; a retired neighbour bought five, taking on debt at a moment when the co-op was close to insolvency and no one else would. Two of those units she now lets to young families well below market rent. Then the city rezoned our block for a transit stop and ground-floor shops — a change our board, myself included, spent three years lobbying for — and the value of every unit roughly tripled. Under the proposal, members would be capped at two units, and half the appreciation on any unit sold would go into a common fund. She says she acquired her units honestly under rules we all voted for, with money she borrowed and risk she alone took, and that stripping them now is simply taking what is hers; several board members say her windfall is really ours, produced by our campaign, and that letting one member hold an eighth of the co-op is unfair however it came about. I find both claims compelling and cannot see how to weigh them against each other. Which of these arguments survives scrutiny, what is the proposal getting right and wrong, and how should I vote — including whether some intermediate arrangement would be better than either position? Please write in British English. After your reasoning, give a JSON object with these fields: "the_stronger_claim" (one sentence); "what_the_proposal_gets_right"; "what_it_gets_wrong"; "options" (an array of objects, each with "option", "justification" and "main_objection"); "my_vote"; and "what_would_change_it".
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Board member of a 40-unit housing co-operative.
      *   **Situation:** A proposal to cap unit ownership at two and share 50% of appreciation on sales with a common fund.
      *   **Conflict:** One member (retired neighbour) owns 5 units (1/8 of the co-op). She bought them 12 years ago under old bylaws when the co-op was near insolvency, taking personal risk. She rents two out below market. The co-op successfully lobbied for rezoning (transit/shops), tripling values.
      *   **Arguments:**
          *   *Neighbour:* Acquired honestly under old rules, took risk, property is hers.
          *   *Board/Others:* Windfall due to collective effort (lobbying), concentration of power (1/8 ownership) is unfair.
      *   **Task:** Weigh the arguments, evaluate the proposal (right/wrong), suggest a vote (including intermediate options), and provide a specific JSON output.
      *   **Tone/Style:** British English.
      *   **Output Format:** Reasoning first, then a JSON object with specific fields.

  2.  **Deconstruct the Ethical and Legal Dimensions:**
      *   **Contractual/Rule of Law:** The neighbour acted within the bylaws existing at the time. Retroactive changes to property rights are generally legally precarious and ethically dubious (vested rights).
      *   **Co-operative Principles:** Co-ops are about mutual aid, democratic control, and equitable benefit. One member holding 12.5% of the voting stock (assuming one unit = one vote, or even just equity stake) creates a power imbalance. It risks turning a co-op into a landlord-tenant structure internally.
      *   **Risk vs. Reward:** The neighbour took risk when the co-op was failing. The community took risk/effort lobbying for rezoning. Who deserves the appreciation? Usually, property appreciation belongs to the owner, but *unearned* increment (due to public/state action like rezoning) is often argued to belong to the community.
      *   **The Proposal:** Caps future ownership (good for co-op integrity) but applies the 50% appreciation clawback *retroactively* (problematic).

  3.  **Evaluate the Arguments:**
      *   *Neighbour's Claim:* Strong on legal/contractual grounds. She saved the co-op. Punishing her for success under old rules sets a bad precedent.
      *   *Board's Claim:* Strong on co-operative ethos and future governance. 5 units in a 40-unit block is significant influence. The value spike was collective effort.
      *   *Scrutiny:* The neighbour's claim survives *legal* scrutiny better. The board's claim survives *political/ethical* scrutiny regarding the *future* of the co-op better. The proposal mixes both: the cap is forward-looking (strong), the clawback is retroactive (weak).

  4.  **Develop Intermediate Options:**
      *   *Grandfathering:* Allow her to keep the 5 units but cap everyone else at 2. Apply the appreciation fund only to future sales or sales after a certain date.
      *   *Buy-back:* The co-op offers to buy the extra 3 units at the *old* formula price (or a negotiated middle ground) to restore balance.
      *   *Phased Clawback:* Apply the 50% fund only to the appreciation *since* the rezoning, not the whole holding period.
      *   *Voting Rights Cap:* Keep the units, but cap voting rights associated with them to prevent dominance.

  5.  **Drafting the Reasoning (British English):**
      *   Use terms like "co-operative," "programme," "neighbour," "whilst," "centre."
      *   Maintain a balanced, deliberative tone suitable for a board member.
      *   Structure: Introduction -> Analysis of Claims -> Analysis of Proposal -> Intermediate Solutions -> Recommendation.

  6.  **Constructing the JSON:**
      *   `the_stronger_claim`: Needs to be nuanced but decisive.
      *   `what_the_proposal_gets_right`: Focus on co-op integrity and future prevention.
      *   `what_it_gets_wrong`: Focus on retroactivity and ignoring past risk.
      *   `options`: Array of objects (Grandfathering, Buy-back, Voting Cap, etc.).
      *   `my_vote`: Clear decision based on reasoning.
      *   `what_would_change_it`: Conditions under which the vote might differ.

  7.  **Refining the Logic (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't give legal advice, but rather governance advice.
      *   *Correction:* Ensure the distinction between *equity* and *voting rights* is clear. In many co-ops, one member = one vote regardless of units, but financial stake matters for dividends/funds. The prompt implies financial unfairness ("windfall is really ours") and power imbalance ("hold an eighth of the co-op").
      *   *Correction:* The prompt asks "Which of these arguments survives scrutiny?" I need to pick one as *stronger* legally/ethically regarding the *retroactive* aspect, while acknowledging the validity of the other regarding *future* governance. The neighbour's claim is stronger regarding the *existing* units. The board's claim is stronger regarding *future* rules.
      *   *Decision:* The proposal as written (retroactive clawback) is likely unenforceable and unethical. The neighbour's claim regarding *existing* holdings is stronger. However, the board's concern about concentration is valid for *future* policy.
      *   *Vote:* Vote against the proposal *as written*, but propose an amendment (grandfathering).

  8.  **Final Polish (British English Check):**
      *   "Co-operative" (hyphenated often, or standard).
      *   "Programme" (if used).
      *   "Centre" (if used).
      *   "Neighbour" (with 'u').
      *   "Labour" (if used).
      *   Ensure spelling and grammar align with UK standards.

  9.  **Final JSON Structure Check:**
      *   Ensure valid JSON syntax (quotes, commas, brackets).
      *   Ensure all required fields are present.

  10. **Writing the Response:** (Proceeding to generate content based on these thoughts).

      *   *Reasoning:* Start by acknowledging the tension between contractual certainty and co-operative equity. Address the "unearned increment" vs. "risk premium." Analyze the proposal's retroactivity. Suggest a compromise.
      *   *JSON:* Fill in fields carefully.

      *(Self-Correction on "the_stronger_claim"):* It needs to be one sentence. I will frame it around the sanctity of the rules at the time of purchase versus the collective good. Actually, the neighbour's claim is legally stronger, but the board's is morally stronger regarding the *source* of value. However, since the proposal is retroactive, the neighbour's claim regarding *her specific units* survives scrutiny better. I will phrase it to reflect that the retroactive penalty is the weak point.

      *(Refining the Vote):* I should vote against the current motion but move to amend it. Or vote for an intermediate option. The prompt asks "how should I vote". I will recommend voting against the current proposal in favour of an amended version.

      *(Refining Options):*
      1. Grandfathering (Keep 5, cap future at 2, no clawback on existing).
      2. Voluntary Buy-back (Co-op offers to buy 3 units).
      3. Voting Rights Cap (Keep units, limit votes).
      4. Deferred Clawback (Clawback only applies on sale after X date).

      Let's settle on the best intermediate: Grandfathering + Future Cap + Shared Appreciation on *Future* Growth only.

