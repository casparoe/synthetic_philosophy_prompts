answer: |-
  This is a profoundly difficult governance dilemma because it pits the sanctity of contract and reliance interests against the foundational ethos of co-operative equity. To resolve it, one must distinguish between the legitimacy of the neighbour's past acquisition and the legitimacy of the co-operative's future structure.

  **Scrutiny of the Arguments**
  The neighbour's claim survives legal and contractual scrutiny more robustly. She acted within the bylaws extant at the time, assumed significant financial risk when the co-operative was insolvent, and fulfilled a function the community could not. To alter the rules retroactively undermines the security of tenure and investment that underpins any property-holding entity. If the co-operative can rewrite history to confiscate value, it sets a precedent that may deter future members from investing capital or effort in the organisation.

  However, the board's claim survives ethical and political scrutiny regarding the *source* of the value. The tripling of value was not due to the neighbour's labour or investment, but due to a public good (rezoning) secured by collective lobbying. In political economy, this is known as 'unearned increment'. Furthermore, a housing co-operative is not merely an investment vehicle; it is a community. One member holding 12.5% of the equity creates a structural imbalance that contradicts the principle of 'one member, one vote' (or at least equitable influence), potentially allowing a single landlord-like figure to dominate meetings or financial decisions.

  **Evaluation of the Proposal**
  The proposal gets the *future* right but the *past* wrong. Capping ownership at two units is sound governance; it prevents oligarchy within the co-op. Establishing a common fund for appreciation is also consistent with co-operative principles, ensuring that value created by the community benefits the community.

  Where the proposal fails is in its retroactivity. Applying the 50% clawback to units bought under a different regime, particularly by the member who saved the co-op from insolvency, is punitive. It conflates the neighbour's legitimate risk premium with the unearned windfall. It treats her as a speculator rather than a saviour who happened to benefit from later collective success.

  **Intermediate Arrangements**
  A binary vote (accept/reject) is insufficient. The board should seek an amendment that protects the co-operative's future without breaching trust with the past.
  1.  **Grandfathering:** The neighbour retains her five units, but the cap applies immediately to all other members.
  2.  **Deferred Clawback:** The 50% appreciation fund applies only to value growth occurring *after* the date of the rezoning approval, or only on sales occurring after a certain future date.
  3.  **Voting Rights Cap:** She keeps the equity, but her voting rights are capped equivalent to two units, mitigating the governance risk without confiscating property.
  4.  **Voluntary Buy-Back:** The co-op offers to purchase the three excess units at a price negotiated between the old formula and current market value, funded by a loan against the now-valuable assets.

  **Recommendation**
  You should vote against the proposal *as currently written*, but move to amend it. The moral debt owed to the neighbour for her past risk must be honoured, but the co-operative's future integrity must be secured. A compromise that grandfathered her existing holdings while strictly capping future accumulation and limiting her voting power would balance these competing justice claims.

