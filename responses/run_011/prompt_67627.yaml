  2. Opponent sealed, no information about it at all. She defects.
  3. Opponent open, and it's hardcoded to defect. She defects.
  4. Opponent open, and it's hardcoded to cooperate no matter what. She defects and takes the 5 — I wanted her to not be a saint.
  5. Opponent open, and it's a proof-seeker: it cooperates if and only if it can find a proof, in a system both sides accept, that the other program will cooperate; otherwise it defects. Her own source is open to it and short enough that the search succeeds. She cooperates, and says out loud that she cooperated because she could see her own readability doing the work.
