  # The Damascus Diagnostic

  ## The Decision Tree

  **Node 1: The Announcement**
  You stand in Damascus. A figure shows you a book. The entry for tomorrow says: "Damascus." You are told the book is never wrong about your final location. You have time to travel to Aleppo before tomorrow.
  *   **A:** Go to Aleppo immediately.
  *   **B:** Stay in Damascus.
  *   **C:** Do not decide; the situation is broken.

  **Node 2: The Lock (For those who chose A at Node 1)**
  You intend to go to Aleppo. Before you leave, you are offered a device. If you activate it now, it physically prevents you from returning to Damascus. The figure writes in the book *after* you activate the device.
  *   **A:** Activate the device.
  *   **B:** Do not activate; keep your options open.

  **Node 3: The Echo (For those who chose B at Node 2)**
  You decide to go to Aleppo without the device. Immediately, the figure updates the book to read: "Aleppo." You are allowed to change your mind based on this new entry.
  *   **A:** Stick with Aleppo.
  *   **B:** Switch back to Damascus.
  *   **C:** Flip a coin to decide.

  **Node 4: The Coin (For those who chose B at Node 1)**
  You intend to stay in Damascus. You consider flipping a coin to decide your location instead of choosing directly. The figure predicts the coin outcome.
  *   **A:** This improves my chances of survival.
  *   **B:** This changes nothing; the book will match the coin.
  *   **C:** I cannot flip a coin; my mind is already made.

  **Node 5: The Ledger (For those who chose A at Node 4)**
  You believe the coin helps. You look at a ledger of past travelers who flipped coins. Half went to Damascus, half to Aleppo. In every case, the book matched the coin.
  *   **A:** I still expect to survive 50% of the time.
  *   **B:** I realize I will die regardless; the coin was irrelevant.
  *   **C:** I prefer not to gamble with my life.

  **Node 6: The Twin (For those who chose C at Node 1)**
  You believe the situation is broken. You meet a twin in the same position. You both know you reason identically.
  *   **A:** We should agree on a plan together.
  *   **B:** Our agreement changes nothing; we are separate.
  *   **C:** There is no "we" to agree; only the book exists.

  **Node 7: The Revision (For those who chose B at Node 3)**
  You switched back to Damascus. The figure updates the book to "Damascus" again. You can switch again.
  *   **A:** I stop here and accept Damascus.
  *   **B:** I switch to Aleppo again.
  *   **C:** I leave the room without choosing.

  ***

  ## Scoring Key

  ### 1. The Conceptual Space
  This diagnostic maps attendees onto a space defined by two axes derived from the structure of the case, not the labels of the theories.

  *   **Axis X: Evaluative Hypothesis.** Can the agent assess the outcome *under the assumption* that they perform a specific act?
      *   *High:* The agent treats their decision as information that updates the likelihood of the threat (Conditioning).
      *   *Low:* The agent treats their decision as independent of the threat's prior position (Intervention).
      *   *Null:* The agent denies the assessment is possible (No Fact).
  *   **Axis Y: Revision Stability.** If assessing an act changes the likelihood of the threat, does the agent revise the act?
      *   *High:* The agent iterates until the decision matches the expectation (Fixed Point).
      *   *Low:* The agent decides once and ignores the feedback loop (One-Shot).
      *   *Null:* The agent refuses the iteration entirely (Pre-commitment or Rejection).

  ### 2. Position Mapping
  Trace the attendee's path through the nodes to locate their position.

  *   **Updateless Decision Theory (UDT)**
      *   *Path:* 1A → 2A.
      *   *Logic:* They flee (Axis X: Low/Intervention) but recognize that their current decision logic is what was predicted. They seize the chance to bind their logic *before* the prediction is finalized (Axis Y: Null/Pre-commitment).
      *   *Location:* Low X, Null Y.

  *   **Causal Decision Theory (CDT)**
      *   *Path:* 1A → 2B → 3A.
      *   *Logic:* They flee (Axis X: Low/Intervention). They reject the lock because the past prediction is fixed (Axis Y: Low). They ignore the book's update because their choice cannot causally affect the past entry (Axis Y: Low).
      *   *Location:* Low X, Low Y.

  *   **Ratifiability (Skyrms/Glymour)**
      *   *Path:* 1A → 2B → 3C *or* 1A → 2B → 3B → 7C.
      *   *Logic:* They initially flee. However, when the book updates (Node 3), they recognize "Flee" is unstable (if I decide Flee, Death is in Aleppo). They seek a stable equilibrium. If no pure act is stable, they randomize (3C) or abstain (7C).
      *   *Location:* High X (Conditioning on decision), High Y (Revision to Stability).

  *   **Evidential Decision Theory (EDT)**
      *   *Path:* 1B → 4B → 5B.
      *   *Logic:* They stay (Axis X: High/Conditioning). They believe the coin offers no help because the evidence (the book) screens off the act (Node 4). They accept the correlation implies death regardless of the method (Node 5).
      *   *Location:* High X, Low Y.

  *   **Jeffrey-Style (No Choice Operator)**
      *   *Path:* 1B → 4A → 5A.
      *   *Logic:* They stay, but treat the decision as a shift in *desirability* rather than a causal lever. At Node 4/5, they maintain that the *news value* of the coin flip allows for expected survival (50%), distinguishing "desirability of the proposition" from "causal efficacy." They separate the probability of the world from the act of choosing.
      *   *Location:* High X, Null Y (Desirability does not require causal stability).

  *   **Deflationary**
      *   *Path:* 1C → 6C.
      *   *Logic:* They reject the case setup. They argue that a perfect predictor of a free choice is incoherent. There is no fact of the matter about what to do because the premises contradict agency (Axis X: Null).
      *   *Location:* Null X, Null Y.

  *   **Hard Fatalism**
      *   *Path:* 1B → 4C.
      *   *Logic:* They stay, not because of evidence, but because they believe the book *forces* the hand. They deny the ability to flip a coin or choose otherwise.
      *   *Location:* Null X, Low Y.

  ### 3. Unoccupied Combinations
  *   **Low X / High Y (Interventionist + Revisionist):** This combination is largely unoccupied. If an agent treats their act as an intervention (CDT style), the probability of the threat should not update based on the decision. Therefore, there is no trigger for revision. An agent who intervenes *and* revises based on the prediction is behaving incoherently (acknowledging causal independence while acting on correlation).
  *   **Null X / High Y (No Fact + Revisionist):** If there is no fact of the matter about the act (Deflationary), there is nothing to stabilize. This cell is empty.

  ### 4. Indistinguishable Leaves
  *   **EDT vs. Jeffrey:** In the standard Damascus case, EDT and Jeffrey often yield the same action (Stay). This tree attempts to separate them at **Node 5** (The Ledger). EDT typically concedes that the coin offers no survival benefit once the correlation is known (5B). Jeffrey's framework allows the *desirability* of the coin flip to remain distinct from the causal outcome (5A). However, without explicit training, attendees may answer 5B for both theories.
      *   *Separating Case:* A variant where the agent's decision *itself* is the only cause of the outcome, but the agent is uncertain about their own utility function. Jeffrey's equation diverges from EDT's expected utility in cases of self-locating uncertainty.
  *   **Ratifiability vs. Deflationary:** Both may end up at "No determinate answer" (Node 7C). Ratifiability reaches this because no act is stable; Deflationism reaches it because the case is impossible.
      *   *Separating Case:* Offer a **Mixed Strategy**. Ratifiability accepts a probabilistic mix (e.g., 50% Aleppo) as a stable equilibrium. Deflationism rejects the mix as equally incoherent. Add a Node 8: "Is a random mixture a valid solution?" to separate them.
