      *   *Idea 3: The Card Swap (Selected).* Students *are* the points. They hold cards. This allows for the "Name Tag" vs. "Relational" distinction clearly.
      *   *Scoring Mechanism:* Needs to punish "wrong" guesses about the state of the world. If they can't distinguish, they shouldn't be punished, but the game rules will punish them to simulate the "Substantivalist Tax."
      *   *Physics Majors:* They need to be the "Laws." They enforce the rules of the swap.

  5.  **Developing the Selected Design (Iterative Refinement):**

      *   *Setup:* 16 students in a 4x4 grid.
      *   *Materials:* Name tags (1-16), Red/Blue chips (Field values), Index cards (History logs).
      *   *Phase 1 (Substantivalist):* Name tags visible. Instructor swaps chips in a "Hole" (center 4 students).
      *   *Phase 2 (Relationalist):* Name tags hidden/removed. Identity is only via neighbors.
      *   *The "Cheating" Scoring:* Students bet points on the state of the Hole. If the Substantivalist view holds, there are two possible states. If they bet on one, and the other happens, they lose. But since they are observationally identical, they *can't* know. The game forces them to lose points purely due to metaphysical commitment.
