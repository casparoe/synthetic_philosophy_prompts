      *   *Scoring:* Apply the "betting" in Phase 2 to maximize the indeterminism shock.

      *Wait, one nuance:* The prompt asks for "A phase where each student is a spacetime point... and a later phase where they can only identify each other by relations."
      *   Okay, Phase 1 = Name Tags (Substantivalist).
