      *   Is the scoring indignant? Yes, betting on undetectable states.

  12. **Final Polish:** Ensure the tone is appropriate (colleague-to-colleague, rigorous but practical). Check the philosophical accuracy (Earman & Norton interpretation). Ensure the distinction between the Shift Argument (global) and Hole Argument (local) is clear in the activity phases. *Self-Correction:* Make sure Phase 1 is Global Shift, Phase 2 is Hole Argument. The prompt asks for Global first, then Local. I need to ensure the transition is clear.

      *   *Phase 1:* Everyone shifts. (Shift Argument).
