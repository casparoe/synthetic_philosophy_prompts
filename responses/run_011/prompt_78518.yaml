  9.  **Anticipating Failure Modes:**

      *   *The "Realist" Rebel:* One student insists the name tags *still* exist metaphysically even if hidden.
      *   *Fix:* Acknowledge they are right! That *is* substantivalism. That's why they lost points.
      *   *The "Semantics" Shrug:* "It's just labels."
      *   *Fix:* Point to the score. "Semantics cost you 5 points. Is your grade semantics?"

  10. **Addressing the "Blunt Truth" (Limitations):**

      *   The activity makes the diffeomorphism look like a *change* over time. In GR, it's a redundancy of description.
      *   Misconception: "Spacetime points move." Correction: "The mapping between math and physics changes."

