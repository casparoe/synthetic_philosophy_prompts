      *   *The Hole:* Define a region (the Hole) where no matter exists. Outside the Hole, everything is fixed. Inside, we can apply a diffeomorphism that is identity outside but non-identity inside.
      *   *The Conclusion:* If points have independent identity, the dragged field configuration is a *different* physical state (different field values at specific points). But the laws + initial data outside don't determine which one happens. Hence, Indeterminism.
      *   *The Solution:* Deny Premise 1. Points are not individuals. The two configurations represent the *same* physical state.

  3.  **Workshop Design Strategy (Embodied Cognition):**

      *   Need to make "identity of points" tangible. Name tags = Haecceity (thisness).
      *   Need to make "field values" tangible. Poker chips/Cards = Metric/Matter content.
      *   Need to make "indeterminism" felt as a loss of points in a game, not just a logical possibility.
      *   Need to create friction between "I know who I am" (Name Tag) and "I only know where I am relative to others" (Relations).

