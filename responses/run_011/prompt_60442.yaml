answer: |-
  **State Code § 402.10 Agricultural Fuel Tax Exemption**
  (a) No excise tax shall be levied on diesel fuel purchased by a holder of a valid Class-A Agricultural Producer License.
  (b) For purposes of this section, "valid Class-A Agricultural Producer License" means any license issued under § 205 that has not been revoked or expired.
  (c) This section shall take effect January 1.

  **Legislative Record**
  Committee Report: The exemption is intended to sustain active agricultural production during periods of high input costs. Eligibility is restricted to license holders to ensure funds target the farming sector. Floor Exchange (Rep. A): Does this cover retired owners who keep licenses but do not farm? Floor Exchange (Sponsor): The language covers any valid license holder. Floor Exchange (Rep. A): Even if no farming occurs? Floor Exchange (Sponsor): Verifying actual cultivation annually was deemed too burdensome for the revenue department.

  **Facts**
  Claimant owns 500 acres but leases all land to a tenant operator under a cash-rent agreement. Claimant maintains a valid Class-A Agricultural Producer License by paying the annual renewal fee, though Claimant has not planted crops in five years. Claimant purchases diesel fuel directly and reimburses the tenant for usage, seeking the tax exemption at the point of purchase. The Revenue Department denies the claim, arguing Claimant is not an active producer, while Claimant argues the statute requires only license possession.

  **Walkthrough**

  **The Textualist Reading**
  The textualist grants the exemption. Subsection (a) conditions the benefit on being a "holder of a valid... License." Subsection (b) stipulatively defines that term solely by administrative status: not revoked or expired. The definition is exhaustive and excludes functional requirements like "active cultivation." The legislative record confirms the legislature knew retired holders would qualify but accepted this overreach to avoid administrative burden. Because the text is clear and the mismatch was foreseen, the court cannot impose a functional limit the drafters rejected. The result is costly, but not absurd, so the text controls.

  **The Purposivist Reading**
  The purposivist denies the exemption. The Committee Report establishes the purpose: sustaining "active agricultural production." The license requirement is a proxy mechanism to achieve that end, not an end in itself. When the proxy fails to match the purpose—as with a retired non-farmer—the purpose limits the text. The floor exchange admits the proxy is imperfect but does not show intent to subsidize non-farming. A sophisticated purposivist argues that statutory terms must be read in light of the operative purpose, treating the definition as subordinate to the mischief the statute aims to remedy. To do otherwise renders the purpose clause surplusage.

  **The Divergence Feature**
  The divergence stems from Subsection (b). It defines the key eligibility term by *status* (license validity) rather than *function* (farming activity). This creates a gap between the class described (license holders) and the class intended (active farmers). If Subsection (b) defined "License" as "a license held by one actively cultivating land," both theories would converge on denial. The case is entirely about whether a stipulative definition that outruns the statutory purpose must be enforced literally.

  **Attack and Reply**
  The purposivist attacks the case as rigged by the record's admission of burden. They argue the legislature chose a proxy for efficiency, not to expand eligibility beyond the purpose, so enforcing the proxy when it defeats the purpose violates the legislative bargain. The textualist replies that efficiency *was* the bargain. By choosing a bright-line status test over a fuzzy functional standard, the legislature prioritized administrative certainty over perfect targeting. The court cannot re-impose the burden the legislature explicitly avoided simply because the result is less optimal than intended. The textualist wins because the record shows the overinclusion was a feature, not a bug.
