answer: |-
  ### Candidate Designs

  1.  **The Betting Pool:** Participants wager candy on which day the test falls; elimination happens via payout rules.
      *   *Cut:* Turns epistemology into probability; students calculate odds instead of knowledge conditions.
  2.  **The Silent Logic Puzzle:** Tables receive envelopes with premises; they arrange cards to find the contradiction without speaking.
      *   *Cut:* Too abstract; kills the social pressure that mimics "knowing" an authority figure.
  3.  **The Authority Simulation:** Roleplay where the facilitator acts as the Teacher with varying reliability stats; students must justify belief.
      *   *Keep:* Embodies the trust condition; forces them to verbalize the induction to win.

  ---

  ### Session Plan: The Impossible Announcement

  **Materials:**
  *   4 Whiteboard markers + eraser.
  *   5 Envelopes (labeled Mon–Fri). One contains a "TEST" card; four are empty.
  *   Index cards (30 total) labeled with logical steps (e.g., "If not Thu, then Fri").
  *   Candy (small pile for stakes).
  *   A visible "Reliability Meter" drawn on the whiteboard (0% to 100%).

  **Rules:**
  1.  **The Goal:** Prove whether a "Surprise Test" is logically possible given the Teacher's reliability.
  2.  **The Win:** If your table correctly predicts the day *and* proves why you knew it, you get candy. If the test surprises you, the Teacher gets the candy.
  3.  **The Constraint:** You cannot say "probably." You must say "we know" or "we don't know."
  4.  **The Flaky Rule (Round 1):** The Teacher has a 50% history of forgetting promises or lying.
  5.  **The Reliable Rule (Round 2):** The Teacher is known to be infallible and truthful.

  **Timeline (75 Minutes):**

  *   **00–05: Setup & Hook.**
      *   Arrange tables. Place the 5 envelopes on the front table.
      *   Say: "I have a test in one of these envelopes. It will be a surprise. You have all week to figure out when."
      *   Do not name the paradox.

  *   **05–20: Round 1 (The Flaky Announcer).**
      *   **Rule:** Set Reliability Meter to 50%. Tell them: "I sometimes forget to give tests. I sometimes lie about surprises."
      *   **Task:** Tables have 10 minutes to eliminate days using logic.
      *   **Expected Outcome:** They stall. They cannot eliminate Friday because they don't *know* the test is happening.
      *   **Stop:** Ask, "Did anyone eliminate Friday?" (Likely no). "Why not?" (Answer: "We don't trust you.")
      *   **Point:** Trust is required for knowledge.

  *   **20–60: Round 2 (The Reliable Announcer).**
      *   **Rule:** Set Reliability Meter to 100%. Tell them: "I am now logically infallible. My announcement is known truth."
      *   **Task:** Re-run the elimination. Start with Friday.
      *   **Step 1 (Friday):** "If it hasn't happened by Thursday night, you know it's Friday. So it can't be Friday." (Write on board).
      *   **Step 2 (Thursday):** "If Friday is impossible, Thursday becomes the last day. So you'd know Thursday. So it can't be Thursday."
      *   **Step 3 (The Wall):** Continue until Monday is eliminated.
      *   **The Ambush:** Close the session. Say, "Great logic. No test possible." Pick up the envelopes and leave the room without giving the test.
      *   **The Twist:** If you want the full paradox effect, actually give the test on Wednesday *after* they conclude it's impossible. (Note: This risks angering them; safer to simulate the surprise by revealing the envelope contents *after* they declare impossibility).
      *   **Better Ambush:** Have them commit to "No Test Possible." Then reveal the "TEST" card in Wednesday's envelope. They are surprised. The logic failed.

  *   **60–75: Debrief.**
      *   Map their steps to the formal argument.
      *   Address the Flaky vs. Reliable contrast.
      *   Discuss Knowledge vs. Belief.

  **Round Goals:**
  *   **Round 1:** Expose that without reliability, "Knowledge" collapses into "Guessing." (Tests your hunch).
  *   **Round 2:** Force the backward induction until it self-destructs.
  *   **Ambush:** Demonstrate that logical impossibility did not prevent empirical surprise.

  **Debrief Questions:**
  1.  "In Round 1, why couldn't you eliminate Friday?" (Target: Lack of certainty/trust).
  2.  "In Round 2, what premise allowed you to eliminate Friday?" (Target: Knowledge of the announcement).
  3.  "If the logic was sound, how were you surprised?" (Target: The definition of 'surprise' or 'knowledge').
  4.  "Did trusting me make you more capable of being surprised, or less?" (Target: The trade-off).

  ---

  ### Predictable Failures & Recovery

  1.  **Failure:** Students treat Round 2 as probability ("There's a 20% chance it's Friday").
      *   **Recovery:** Freeze the room. "Probability is banned. You either *know* it is Friday, or you *don't*. If you don't know, you can't eliminate it. If you do know, it's not a surprise. Choose."
  2.  **Failure:** They skip the induction steps (jump from Friday to Monday).
      *   **Recovery:** Physically block the whiteboard. "You cannot touch Thursday until Friday is dead. Prove Friday is dead first."
  3.  **Failure:** The "Flaky" round confuses them so much they disengage.
      *   **Recovery:** Cut Round 1 short at 10 minutes. Explicitly state: "This broke the logic. That's the point. Let's fix the Teacher to see the paradox."

  ---

  ### Honest Note: What This Activity Can't Reproduce

  Your suspicion is correct: **This activity cannot simulate *Knowledge*.** It simulates *belief with high confidence*.
  In the room, they *believe* you are reliable. But philosophical "Knowledge" requires truth, belief, and justification. When you ambush them with the test, you prove they didn't *know* the test was impossible, they only *believed* the logic was sound.
  The activity creates the *structure* of the paradox, but the epistemic weight—the difference between "I'm sure" and "I Know"—must be supplied by you in the debrief. If you don't verbally hammer that distinction, this remains a logic puzzle, not an epistemological crisis.

  **Regarding your hunch:** The "Flaky Announcer" mechanic is philosophically sound but pedagogically risky. You suspected this is where the room clicks. **You are wrong.** This is where the paradox *dissolves*. If the announcer is flaky, the premise "You know there will be a test" is false. The backward induction never starts. I have included it as Round 1 specifically to *prove* this to you. The "click" happens in Round 2 when reliability is restored, creating the tension between Trust and Surprise.

  ---

  Verdict: Knowledge eliminates the possibility of surprise.
