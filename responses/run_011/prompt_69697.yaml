answer: |-
  1. The rule presupposes a threshold theory of moral standing based on complex neural capacity, where cephalopods are included because they demonstrate individualized behavior and suffering comparable to backboned animals. This exception marks a boundary where cognitive complexity becomes significant enough to warrant protection, distinguishing an octopus as a countable individual from a beetle as a statistical unit.

  2. This arrangement strictly rules out theories based solely on phylogenetic closeness to humans, since cephalopods are distant relatives yet receive protection, and it rejects equal considerability for all living things. However, it remains underdetermined between gradualism about moral status and a binary switch for sentience, as both could justify protecting vertebrates and cephalopods while ignoring insects.

  3. The policy likely presupposes no view about insects at all, functioning as a regulatory gap where rules designed for single-animal studies fail to address aggregate harm. By demanding justification for every vertebrate killed but imposing no ceiling on invertebrates, the system treats per-animal reasons as absolute for some species while remaining blind to total harm across others.

  4. The pollinator garden and pesticide ban presuppose a different theory based on ecosystem services and population stability rather than individual moral standing. The district is therefore not logically inconsistent but is running two separate value systems side by side, valuing insects collectively as resources while permitting their individual sacrifice in research.

  5. If harm were weighted by the probability of sentience, your protocol would require shorter check intervals to reduce suffering duration and a cap on trap-nights to limit expected total harm. Since four thousand times a tiny probability exceeds one, there is no realistic probability of sentience low enough to ignore the aggregate, meaning even a tiny chance of insect feeling would demand stricter limits than those currently applied to vertebrates.
