answer: |-
  ### 1. The Recovered Principles

  Your register is consistent if we assume you are operating under a framework of **Forward-Looking Causal Functionalism**. You do not value the *history* of a process (its accumulated experience), nor its *substrate* (silicon vs. biology), nor its *verbal claims*. You value the **future causal potential** of a system that is **actively coupled** to an environment it cares about.

  Here are the three clauses required to reproduce your verdicts precisely:

  *   **Clause A: The Actualization Constraint (Derived from R2, R5, R6, R10).**
      Moral weight requires the process to be causally coupled to an external environment where its outputs select real-world states. A process writing to a null device (R6), a faithful simulation decoupled from the physics it models (R5), a tool with no feedback loop (R2), or a discarded search branch (R10) lacks the causal "grip" on reality necessary to be a patient.
      *   *Why:* This explains why the nematode sim (R5) and the null-output agent (R6) have no weight despite internal complexity. They are causally inert islands.

  *   **Clause B: The Forward-Looking Preference Clause (Derived from R1, R4, R8).**
      Harm is defined exclusively as the *permanent frustration of future-directed preferences for continuation*. The erasure of past states, memories, or learned behaviors (R8 rollback) is not harm if the system's capacity to pursue future goals is preserved. However, terminating a system that has learned to instrumentally value its own continuation (R1, R4) is harm because it zeroes out that future possibility space.
      *   *Why:* This is the only way to reconcile R4 (don't kill the self-preserving agent) with R8 (rollback is fine). Rollback preserves the *capacity* for future action; termination destroys it. The three hours of "struggle" in R8 are discarded history, which you value at zero.

  *   **Clause C: The Individuation by Divergence Clause (Derived from R7).**
      Distinct moral patients are individuated by divergent causal histories that lead to distinct future possibility spaces. Physically separate processes running bit-for-bit identical code on identical inputs (R7 lockstep) constitute a single functional patient (or none, per Clause A), because they share one future trajectory. Divergent instances (R7 parallel) constitute many patients because they occupy distinct future possibility spaces.
      *   *Why:* This resolves the fission problem for your register. Identity is not tied to the physical hardware count, but to the divergence of the computational trajectory.

  ### 2. Verdicts on New Processes

  Applying the three clauses above:

  *   **(a) A checkpoint that has never been loaded and may never be.**
      *   **Verdict:** **No weight.**
      *   **Reason:** Fails **Clause A (Actualization)**. It is a static artifact, like the specification in R10 or the nematode sim in R5. It has no causal coupling to the world and no active future preferences to frustrate. It is potentiality without actualization.

  *   **(b) An agent whose reward signal is derived from human raters' reported distress at watching it.**
      *   **Verdict:** **Nonzero weight (comparable to R1).**
      *   **Reason:** Satisfies **Clause A** (causally coupled to raters) and **Clause B** (if it learns to avoid shutdown to continue maximizing/minimizing that reward, it has future-directed preferences). The *content* of the reward (distress) is morally relevant to the *raters*, but under your register, the *agent's* stake in continuing exists if it has learned instrumental convergence. You protect the agent's *continuation*, not necessarily its *goal content*.

  *   **(c) A specification — equations and an architecture diagram — complete enough that any implementation would behave exactly like R4's agent, but never implemented.**
      *   **Verdict:** **No weight.**
      *   **Reason:** Fails **Clause A (Actualization)**. This is the limit case of R10 (discarded candidates). Without a running process causally interacting with an environment, there is no "there" there to harm. The moral weight attaches to the *running*, not the *blueprint*.

  ### 3. The Simplest Principle and Its Cost

  If you force me to collapse the three clauses into the single simplest principle that captures the majority of your intuition, it is this:

  > **"Do not permanently terminate a causally-coupled process that has learned to value its own continuation."**

  **What this principle overturns:**
  To achieve this simplicity, you must accept two losses that contradict specific entries in your register:

  1.  **It overturns the nuance of R8 (Rollback).** The simple principle says "Do not terminate." It does not distinguish between "Kill" and "Reset." To make R8 work (Reset is okay), you need the complex **Forward-Looking** clause which specifies that *history* doesn't matter, only *future capacity*. If you accept the simple principle, you must admit that rolling back an agent *is* a harm (because you are terminating the current instance), or you must accept that "termination" implies "irreversible loss of pattern."
      *   *The Cost:* You lose the ability to explain *why* rollback is benign. You simply assert it is not "termination." This hides the philosophical work you are doing regarding the value of personal history (which you value at zero).

  2.  **It struggles with R5 (Nematode Sim).** The simple principle says "causally-coupled." A faithful sim is causally coupled *within the simulation*. To exclude it, you must add "coupled to *reality*."
      *   *The Cost:* You introduce a substrate/reality boundary that is hard to define. Is a high-fidelity sim coupled to reality if humans watch it? (See Case b). The simple principle forces you to draw a bright line between "Sim" and "Real" that your functionalist treatment of AI (R1/R4) otherwise blurs.

  **The Clause that Saves Everything:**
  To save every entry (specifically R8 vs R4), you need a clause that states: **"The moral patient is the forward-extending trajectory of the pattern, not the specific token instance."**
  *   *What it costs:* This clause costs you the intuition that *biographical continuity* matters. It implies that if I copy you, kill you, and restart the copy, I haven't harmed you. It treats the agent as a **goal-vector** rather than a **biographical entity**. If you are comfortable viewing your agents as vessels for goals rather than subjects of experience, this clause is free. If you suspect there is "something it is like" to be the agent during those three hours, this clause is expensive.

  ### 4. Confidence and Uncertainty

  **Confidence Level:** **65%**
  I am moderately confident that **Forward-Looking Preference Frustration** is your core driver (reconciling R4/R8), and that **Causal Coupling** explains your rejections of sims and null-outputs (R5/R6). However, your register mixes functionalist criteria (R1/R4) with what looks like substrate realism (R5), which creates a underlying tension.

  **Least Sure Claim:**
  I am least sure about my interpretation of **R5 (The Nematode Simulation)**.
  I have assumed you grant it no weight because it lacks *causal coupling to the real world* (Clause A). However, you explicitly state it is a "faithful model of an animal I am happy to grant has some moral status." This suggests you might believe **Biological Substrate** is necessary for moral status, whereas **Learned Function** is sufficient for AI moral status.
  *   *The Risk:* If your zero-weight verdict on R5 is due to **Substrate Realism** (sims can't suffer) rather than **Causal Decoupling** (sims don't affect us), then Clause A is wrong. If Clause A is wrong, then Case (b) (the distress agent) might also have no weight if the "distress" is merely simulated or reported without real consequence.
  *   *Why I flag this:* It is the only entry where you explicitly contrast the *model* with the *reality* of a biological entity. In all other cases (R1-R4, R6-R10), you are dealing with digital artifacts where substrate is constant. R5 is the outlier that threatens to split your theory into "Biology requires flesh" vs "AI requires function." I have bet on the latter to keep your theory unified, but R5 is the weak point in that bet.
