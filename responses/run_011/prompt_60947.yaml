answer: |-
  ### Nearest Established Concepts and Their Fit

  There is no single established term that captures the specific mechanism you describe: the structural requirement that a demand remain unmet to sustain the commemorative economy. Several concepts approximate the edges but fail to cut the shape precisely.

  *   **Political Melancholia:** This is the closest theoretical neighbour (drawing on Freud via Eng, Brown, etc.). It describes a collective refusal to "get over" a loss, where the lost object remains internalized as part of identity. *Fit:* It explains the refusal to grieve and the attachment to the lost ideal. *Miss:* It focuses on the affective state (sadness/attachment) rather than the institutional policing of success. It does not inherently explain why *settlement* is treated as treachery rather than relief.
  *   **Culture of Defeat (Schivelbusch):** Describes how defeated nations reconstruct identity through moral superiority or spiritual renewal. *Fit:* Captures the reframing of loss as virtue. *Miss:* Usually describes a phase leading to recovery or revisionism. It does not account for a stable equilibrium where recovery is actively resisted as a betrayal of the dead.
  *   **Irredentism/Revanchism:** Political programmes to reclaim territory. *Fit:* Explains the territorial claim. *Miss:* These are teleological; they aim for success. If they succeed, the movement validates itself. In your pattern, success invalidates the movement.
  *   **Sacralized Loss:** Used in anthropology to describe making loss holy. *Fit:* Captures the taboo nature of the memory. *Miss:* Often implies the loss is in the past. Your pattern involves a *present* demand that must remain unsatisfied.
  *   **Conflict Habituation:** Used in peacebuilding to describe societies economically or socially dependent on conflict. *Fit:* Explains the resistance to settlement. *Miss:* Focuses on material incentives (war economies) or social habits, not the specific *commemorative logic* where the *inscription* itself requires the gap to remain open.

  **Verdict:** None fit. They describe the *origin* (trauma), the *affect* (melancholia), or the *material incentive* (conflict economy), but none isolate the *commemorative structure* where the unfulfilled demand is the engine of identity.

  ### Diagnosis of the Described Pattern

  The phenomenon is a system where the group's cohesion and the authority of its custodians depend on the *continuing absence* of the object demanded. The loss is not an accident to be repaired; it is the foundation upon which the current identity is built. Success is not a goal; it is an existential threat.

  I coin the term **Constitutive Unfulfillment**.

  In this state, the demand is not a bridge to a destination but a load-bearing wall. If the demand is met, the wall collapses. The "drift toward the unsatisfiable" you observe is not mission creep; it is a defensive mechanism to ensure the wall remains standing. The custodians police settlement not because the terms are bad, but because *any* terms close the gap that generates their authority. The dead are not honoured by victory; they are honoured by the perpetuation of the cause for which they died. A won cause requires no more martyrs, and thus renders the existing martyrology obsolete.

  **What would change my mind:**
  I am most likely wrong if the resistance to settlement is purely material rather than ideological. If evidence shows the custodians oppose settlement solely because they lose salaries, status, or power positions in a peace settlement (a "peace economy" vs. "war economy"), then this is not a cultural phenomenon but **Oligarchic Entrenchment**. To distinguish this, one would need to observe rank-and-file members (who gain from settlement) being successfully persuaded by custodians that settlement is *morally* repugnant. If the resistance is top-down only, the concept collapses into elite capture. I am also potentially fitting your instances to a psychological model (melancholia) when the driver might be purely bureaucratic inertia. If the "drift" is accidental rather than defended as "fidelity," the concept fails.

  ### Boundaries and Discriminating Tests

  To distinguish **Constitutive Unfulfillment** from neighbouring phenomena, apply these tests:

  1.  **The Drift Test (vs. Distrust):**
      *   *Distrust:* The community says, "We would accept X, but this offer is Y." The demand is static; the offer is the problem.
      *   *Constitutive Unfulfillment:* The community says, "X would betray the dead." If the offer moves toward X, the demand moves to X+1. The formulation drifts toward the unsatisfiable to maintain the gap.
      *   *Verdict:* If the goalpost moves *to preserve the distance*, it is Constitutive Unfulfillment.

  2.  **The Deflation Test (vs. Mobilizing Victory):**
      *   *Mobilizing Victory:* A partial win (e.g., voting rights) energizes the movement to seek the next goal. Momentum increases.
      *   *Constitutive Unfulfillment:* A partial win (e.g., devolution) causes attendance to collapse and morale to fracture. Momentum decreases.
      *   *Verdict:* If success deflates the commemorative energy, it is Constitutive Unfulfillment.

  3.  **The Treason Test (vs. Hard Bargaining):**
      *   *Hard Bargaining:* Accepting a deal is seen as pragmatic, perhaps disappointing, but necessary.
      *   *Constitutive Unfulfillment:* Accepting a deal is seen as *desecration*. Those who settle are traitors to the dead, not just negotiators.
      *   *Verdict:* If settlement is moralized as betrayal rather than pragmatics, it is Constitutive Unfulfillment.

  4.  **Scope (Military vs. Institutional):**
      *   The phenomenon does not require military defeat. It applies to any group whose identity is founded on a "founding failure" or "original struggle." A firm that defines itself by "fighting the giants" may reject acquisition not because the price is low, but because becoming the giant kills the identity. A family feud maintained over generations where reconciliation is seen as forgetting the ancestor works the same way. The key is the *narrative dependence on opposition*, not the violence itself.

  ### Recommendation

  Use the term **Constitutive Unfulfillment** in your policy advice. It is sharp enough to generate yes/no verdicts using the tests above. It allows you to diagnose when a commemorative programme has become parasitic on the grievance it purports to resolve.

  When you observe this, standard conflict resolution tools (negotiation, compromise, better terms) will fail because the problem is not the terms but the *existence* of a settlement. The intervention required is not policy adjustment but **narrative transition**: helping the community construct a identity based on *stewardship of the gain* rather than *fidelity to the loss*. This is significantly harder than negotiating terms.

  Be aware that accusing a group of Constitutive Unfulfillment will be taken as an accusation of bad faith. You will need to demonstrate the "Drift" and "Deflation" evidence objectively. Do not start with the label; start with the observation that attendance drops when victories are won.

  \answer{Constitutive Unfulfillment}
