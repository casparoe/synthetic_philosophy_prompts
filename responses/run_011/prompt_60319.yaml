      *Drafting:*
      You press me as if I had not been sufficiently clear in distinguishing the motions of the body from the perceptions of the soul, a distinction upon which my entire physiology rests. When I speak in the *Passions* of hope or fear, I speak of those feelings *insofar as they are referred to the soul*—that is, insofar as we are consciously aware of them. In the beast, there exists only the bodily counterpart: the agitation of the spirits, the flow toward the heart or the muscles, and the tracing of images in the brain. That the magpie utters a sound when its mistress approaches is no more evidence of an inner hope than the striking of a clock is evidence that the machine knows the hour. The clock is disposed by its gears to strike at noon; the magpie is disposed by the pores of its brain to speak when certain spirits arrive there, having been opened by previous associations of sight and food. You call this an "expression" of hope; I say it is merely the effect of a cause that, in man, would be accompanied by hope, but in the beast remains barren of any awareness.

      Consequently, you present me with a dilemma that dissolves once you cease to demand that the machine possess what belongs only to the pilot. You ask what makes the utterance an expression if the passion is exiled. I answer: it is an expression only for *you*, who observe the regularity of the mechanism and infer a state analogous to your own, not for the bird, to whom the utterance is no more significant than the sneeze that escapes you when dust tickles your nose. In you, a sneeze may occur without thought, and so may a word spoken in habit; the magpie operates always in this mode of pure bodily disposition. Do not confuse the physiological cause of a passion, which the beast possesses, with the conscious perception of that passion, which defines the thinking substance. If you require proof that this perception is absent, look not to the violence of their actions, which I grant can exceed ours, but to their inability to arrange words to declare their thoughts to others. Until the magpie can tell us *that* it hopes, rather than merely sounding as though it does, you ask me to conflate the shadow with the substance.

