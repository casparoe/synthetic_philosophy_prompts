answer: |-
  ### The practice and its instruments

  A pardon forgives the penalty but keeps the conviction on the record, implying guilt existed but mercy is granted. Quashing a conviction declares it legally unsafe, effectively erasing the guilt as if it never happened. Repealing a statute removes the law for the future but leaves past convictions untouched, acknowledging the rule is gone but not necessarily that past applications were errors. Finally, a legislative declaration of innocence states collectively that the condemned committed no wrong. These tools range from mercy to full vindication, altering how the state relates to the past.

  ### What it strictly presupposes

  This practice strictly presupposes that legal guilt and moral innocence can diverge. By offering redress, the state admits that following proper procedure at the time was not enough to make the outcome right. It commits the government to the view that there is a standard of justice beyond mere rule-following. If the law was simply whatever the state said it was, and the state says it was valid then, there would be nothing to fix. Therefore, the practice assumes that harming someone for behavior that should not have been criminal is a lasting injury, regardless of the paperwork involved. It requires acknowledging that the state itself was the agent of a wrong, not just a neutral enforcer of rules. This means the practice cannot be merely administrative; it must be moral. It presupposes that citizens deserve protection from certain kinds of laws, even those properly enacted. Without this commitment to a higher standard of fairness, the pardon is just a gift, not a correction of injustice. The practice demands that we distinguish between being "legally guilty" (breaking a rule) and "morally culpable" (doing something truly wrong). If these were the same thing, you could not pardon someone for being innocent. Therefore, the state must accept that its past authority was misused. It commits to the idea that some human interests—like liberty or dignity—trump legislative history. If the state denied this, it would have to say, "You broke the law, and the law was real, so you were guilty, but we are letting you off now." That is not what officials say. They say the person did nothing wrong. This forces the admission that the law's definition of wrongness was defective. The practice stands or falls on the belief that justice is not identical to legality.

  ### What it merely fits

  However, this practice does not force the state to believe that these acts were wrong in a universal, timeless sense. It fits comfortably with the view that moral wrongness is determined by the settled norms of a community, provided those norms can evolve. Under this view, the acts were not wrong *then*, because the community said they were crimes, but they are wrong *now*, because our norms have changed. This allows the state to pardon based on current values without claiming access to eternal truths. It also fits with legal positivism, which holds that law is a social fact separate from morality. A positivist can say the law was valid then but is morally regrettable now. Thus, the practice is flexible. It works for those who believe in universal human rights, but it also works for those who believe morality is just what society agrees upon. The only thing it rules out is the idea that the past law was morally perfect and should still bind us. As long as the state accepts that current norms override past ones, the specific source of those norms—whether divine, natural, or social—does not matter. The practice merely requires that the current government has the authority to reinterpret the past through present eyes. It does not require proving that a witchcraft trial violated a law of the universe, only that it violates our current understanding of justice. This makes the practice politically viable for diverse groups. Different groups can support the pardon without agreeing on why the old law was bad. The mechanism works because it focuses on the remedy rather than the metaphysical source of the error.

  ### Can the state hold both things at once?

  The claim that a law was valid yet unjust is coherent, but it comes with a cost. It requires separating "legal validity" (was the rule made correctly?) from "moral legitimacy" (was the rule right?). This is the core of legal positivism. It means admitting that a government can function perfectly as a legal system while producing terrible moral outcomes. The cost is humility: the state must admit its own machinery can generate injustice without breaking down. It cannot claim that everything it does is automatically right just because it is law. This distinction protects the rule of law by allowing us to criticize specific laws without rejecting the whole system. However, it creates tension. If the law was valid, why punish the state now? The answer is that validity binds us to obey, but injustice binds us to repair. Holding both views means acknowledging that authority does not guarantee goodness. It allows the state to say, "We had the power to convict you, but we lacked the moral right." This preserves historical accuracy—the law existed—while affirming moral progress—the law was bad. It avoids rewriting history to pretend the law never existed, which would be dishonest. Instead, it owns the error as a valid legal act that was morally wrong. This approach prevents the slippery slope of claiming any unpopular law was never truly law, which could destabilize current order. It maintains stability by respecting past procedures while correcting moral failures. The cost is living with the contradiction that something can be officially true but morally false. It demands that citizens and officials tolerate this gap. They must accept that legality is a technical status, not a seal of approval. This coherence relies on trust that the state will not use this distinction to excuse future abuses. It requires a culture that values moral correction over legal consistency. Ultimately, it is a mature view of governance, accepting that systems run by humans are fallible. It allows for redemption without denying reality. The state remains the same entity, accountable for its past self.

  ### What would have to change

  If the state adopted the strict view that wrongness is nothing beyond current community norms, the language of these ceremonies would have to shift dramatically. Declarations of innocence would become impossible. If norms define wrongness, then the convicted people *were* guilty by the standards of their time. The state could not say, "You did nothing wrong," but only, "We no longer think this is wrong." Pardons would become acts of mercy or policy updates, rather than corrections of injustice. Records would not be quashed as unsafe, but marked as historically accurate but outdated. The focus would move from vindicating the individual to updating the community's rulebook. Ceremonies would celebrate current values rather than mourning past victims. The state would say, "We are different now," not "We were wrong then." This turns justice into preference. To maintain the current practice of declaring innocence, the state must imply that the victims were right all along, which suggests their wrongness was not fully dependent on the community's view. Under strict normativism, the state would have to apologize for its current change of heart rather than for past harm. The records would serve as archives of changing tastes, not evidence of persecution. This would fundamentally alter the relationship between citizen and state, making rights contingent on majority opinion rather than protected status. The current practice seeks to protect the individual from the community; the alternative view subjects the individual entirely to it. It would acknowledge power shifts, not moral errors.
