  1. Can you identify a single emotion directed at fiction that your account preserves as genuine rather than redescribing it as a lower-tier response or displaced self-grief? If you cannot name one, does this not imply your theory dissolves the paradox only by eliminating the very phenomenon everyone agreed needed explaining?

  2. Given that startle responses are visibly dampened when subjects know a snake is behind glass or a floor is transparent, how can you maintain that the lower tier is strictly belief-free? If knowledge penetrates this tier, does your central boundary not collapse, leaving you without the engine needed to dissolve the paradox?

  3. If grief for a character is actually redirected grief for the reader's own mortality, why should the resurrection of a fictional character console a reader regarding their own inevitable death? Does this causal link not demonstrate that the emotional object is the character's fate rather than the reader's general condition?

  4. If suspense on re-viewing is merely lower-tier arousal shaped by pacing and score, why is it experienced as being about whether the character escapes rather than as raw physiological tension? If you dismiss this phenomenological difference as taxonomy error, how do you account for the fact that spoiler alerts successfully destroy the experience for many viewers without changing the sensory stimuli?

  5. Given that you allow imagination to gloss the lower tier without importing belief, how do you square this with your commitment that the lower tier is cognitively impenetrable? If you cannot explain the gloss without cognitive penetration, which commitment to the belief-freeness of the lower tier are you prepared to abandon?
