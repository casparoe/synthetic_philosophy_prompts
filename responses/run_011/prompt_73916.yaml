  ### Leaf Indistinguishability: Merging the Positions

  Your tree produces 10 Leaves (A-J). Several of these are not distinct positions. Here is where you should merge them for the workshop discussion.

  **1. Leaf J (Interventionist/Counterfactualist) vs. Leaf G (Contrastivist)**
  *   *Verdict:* **Merge them.**
  *   *Reasoning:* You are correct in your suspicion. Contrastivism is often just Interventionism with the variables made explicit. Woodward's *do*-operator inherently involves setting a variable to $x$ *rather than* $x'$. Schaffer (Contrastivist) and Woodward (Interventionist) agree on almost all concrete cases. The difference is whether you build the "rather than" into the *relation* (Schaffer) or into the *relata/variables* (Woodward). For a workshop with practitioners, this is a verbal dispute. Treat Contrastivists as Interventionists who are more precise about their variables.

  **2. Leaf J (Interventionist/Counterfactualist) vs. Leaf H (Deflationist)**
  *   *Verdict:* **Keep Separate.**
  *   *Reasoning:* This is a real metaphysical fight. Woodward thinks causal claims are objectively true or false based on invariance. Norton (Deflationist) thinks causal talk is folk physics that should be eliminated in fundamental science. This affects whether they trust the DAGs as "truth" or just "useful tools."

  **3. Leaf B (Pluralist) vs. Leaf J (Interventionist)**
  *   *Verdict:* **Keep Separate.**
  *   *Reasoning:* Hall's Pluralism is distinct. An Interventionist tries to unify omissions and rocks under one logic (invariance). A Pluralist says "Rocks are Production, Omissions are Dependence, never the twain shall meet." This matters for the Practitioners: Do they need one DAG for everything, or two different models for physical vs. social causation?

  **4. Leaf E (Strict Manipulability) vs. Leaf J (Interventionist)**
  *   *Verdict:* **Cut Leaf E.**
  *   *Reasoning:* As noted in the Moon/Tides flag, "Strict Actual Manipulability" is a zombie position. No serious causal inference theorist refuses to model the Moon because they can't move it. They model it as an exogenous variable. If a participant lands here, they are not a causal inference theorist; they are a radical empiricist. Send them to the Deflationist discussion.

  ### Final Commitment

  1.  **The Moon Node:** It does not separate Lewis from Woodward. It separates Hypothetical Interventionists from Actual Interventionists. Use it to filter the radicals, not the philosophers.
  2.  **The "Empty" Cell:** You were wrong. The cell for "Absences are causes, but no dependence/process" is the **Practitioner's Home**. It is the most populated cell in the room. It is the "Black Box" view.
  3.  **Contrastivism:** It is not a rival to Interventionism. It is a dialect of it. Do not let your Contrastivist philosopher monopolize the time claiming they have a unique theory of causation distinct from the DAG users. They are drawing the same map with different ink.
  4.  **Process Theory:** It is the outlier. It will be the minority view (likely only a few philosophers). Ensure they know they are the "Process" group early (Node 1) so they don't get frustrated answering questions about omissions they reject.

  Run the tree. Merge the Contrastivists into the Interventionist discussion. Let the Practitioners own the "Absence without Process" cell. You will have your sorting.
