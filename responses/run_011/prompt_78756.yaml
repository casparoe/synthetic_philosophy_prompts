  **MEMORANDUM**

  **TO:** PhD Admissions Committee
  **FROM:** [Your Name]
  **SUBJECT:** Evaluation Protocol for Technical/Logic-Heavy Writing Samples
  **DATE:** October 26, 2023

  **Context**
  Recent deliberations regarding a specific applicant file—a 26-page sample utilizing Gödelian arguments to address philosophy of mind—have highlighted a gap in our evaluation procedures. We currently lack a standardized method for assessing samples that engage heavily with technical logic while risking engagement with contested "fringe" arguments. This memo proposes a concrete decision on the current file, criteria for future evaluations, and a standing procedure to balance openness to non-traditional candidates with committee efficiency.

  **1. Recommendation on Current File**
  **Action:** Flag for Discussion + Require Second Sample.
  **Reasoning:** The first twenty pages rehearse a contested argument (Lucas-Penrose), but the final six pages pivot to a novel claim regarding self-transparency and theory of mind. We cannot evaluate the candidate's philosophical promise solely on the contested logic, nor should we dismiss the pivot prematurely.
  **Procedure:** We should score the file based primarily on the quality of the *pivot* (the final section) rather than the validity of the Gödelian setup. However, given the risk that the candidate is a "one-trick pony," admission should be contingent on reviewing a second writing sample on a distinct topic (e.g., ethics, metaphysics, or history) to ensure broader competence. If a second sample is unavailable, the candidate should be interviewed specifically on their ability to脱离 (detach) from this specific argumentative framework.

  **2. Evaluation Criteria for Non-Specialists**
  Committee members are not expected to verify the mathematical correctness of logical proofs. Instead, evaluate the *argumentative structure* using these three checks:

  *   **The Objection Test:** Does the author state the strongest known objection to their premise *before* refuting it? Crank-adjacent work typically dismisses objections as misunderstandings; rigorous work treats objections as structural hurdles that require modifying the conclusion.
  *   **The Dependency Test:** Is the technical machinery essential to the philosophical conclusion, or is it ornamental? If you remove the formal notation, does the argument collapse, or does the notation merely dress up a claim that could be made in plain English? The former suggests technical competence; the latter suggests performance.
  *   **The Pivot Test:** When the argument hits a known limit (e.g., consistency vs. soundness), does the author stop, or do they generate a new philosophical question? A strong sample uses the failure of the formal proof to motivate a new inquiry (as this file attempts); a weak sample insists the proof works despite the literature.

  **3. Standing Procedure**
  To prevent ad hoc debates in future cycles, adopt the following protocol for samples centered on famous logical arguments (Gödel, Turing, Cantor, etc.):
  *   **No Automatic Rejection:** We do not ban topics based on historical association with non-serious work. This protects applicants from non-traditional backgrounds (math, CS, self-taught) who may lack familiarity with disciplinary norms but possess genuine insight.
  *   **The Breadth Requirement:** Any applicant submitting a sample heavily reliant on formal logic must provide evidence of broader philosophical training via transcript or a second writing sample. This mitigates the risk of admitting candidates who cannot function outside a narrow technical niche.

  **4. Engaging the Counterarguments**
  We must acknowledge the validity of the conflicting intuitions driving this debate.

  *   **The Case for Openness (My Friend's View):** Dismissing a genre based on its popularity among amateurs is gatekeeping that disproportionately harms outsiders. Philosophy benefits from candidates who arrive via math or science rather than undergraduate seminars. If we penalize the "setup" because it looks like crankery, we may reject the very candidates capable of revitalizing old debates. The fact that this applicant acknowledges the standard objections and attempts a repair suggests they are *doing* philosophy, not just asserting truths.
  *   **The Case for Constraint (My Colleague's View):** This is not merely snobbery; it is resource allocation. Spending three hours deciphering one file is unsustainable when we have hundreds to review. Furthermore, there is a genuine pedagogical risk: candidates who obsess over these topics often interview brilliantly on their niche but struggle with broader coursework or teaching responsibilities. The "genre" signal exists for a reason; historically, it correlates with candidates who are difficult to supervise because they believe they have solved problems the field considers closed. We owe it to the department to avoid admitting students who cannot be successfully mentored.

  **Next Steps**
  Please review the final six pages of the file in question with the "Pivot Test" in mind. Come prepared to vote on whether the insight generated there warrants the risk of the setup, contingent on the receipt of a second writing sample.

  [End of Memo]
