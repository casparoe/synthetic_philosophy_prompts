      *   Closing statements.

  7.  **Review against Constraints:**
      *   *Word Count:* Need to monitor. 1300-1800 is tight but manageable.
      *   *No Collusion:* They must not say "I will mail" or "I won't mail". They discuss "the agent" or "one".
      *   *Math:* Must be explicit.
      *   *Refinement:* Both must adjust views slightly or clarify nuances.
      *   *Closing:* Distinct statements of disagreement.

  8.  **Self-Correction during drafting:**
      *   *Issue:* Make sure Yael doesn't sound mystical. She must emphasize logical identity, not causal influence.
      *   *Issue:* Ensure Callum doesn't sound like he ignores the correlation. He acknowledges the evidence but denies the normative force.
