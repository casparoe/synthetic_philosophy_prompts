  ### The Role of the "Intrinsic Basis" Clause

  In your working principle, the "intrinsic basis" clause is functioning as a **proxy for System Boundary**, not a metaphysical criterion.

  It is not merely a placeholder for "not Case 3." It is a rule for **ontological inclusion**. When you say the hull is watertight because of the pump, you are implicitly expanding the "intrinsic" to mean "internal to the engineered system." When you say the prop is not breakable despite the studio rule, you are contracting the "intrinsic" to "the physical object excluding procedural context."

  The clause is doing the work of Test 1. It tells the engineer: *"Count the properties of the hardware you built, not the rules you wrote or the boxes you shipped it in."*

  ### Verdicts the Principle Cannot Keep

  The principle keeps all six of your verdicts **only if** the definition of "Physically Integrated" (Test 1) is accepted as non-arbitrary. However, this is where the procedure fails to be fully algorithmic.

  The principle cannot resolve **Case 6's ambiguity** ("two dispositions or one disposition plus a fact about me") without an external convention on how to define the Bearer. Is the disposition a property of the *toxin* (universal) or the *toxin-body system* (relational)? The procedure forces you to choose a boundary, but it cannot tell you which boundary is the "correct" one for the database. If your database tracks *materials*, the toxin is poisonous. If it tracks *scenarios*, it is not. The principle handles the logic once the boundary is set, but it cannot set the boundary without circular reference to the reliability rating you wish to achieve.

  ### The Point of Circularity

  The circularity bites at **Test 1 (Define the Bearer Boundary)**.

  In Case 4, you include the pump to secure the "Watertight" rating. In Case 3, you exclude the studio rule to secure the "Not Breakable" rating. The distinction rests on "welded" vs. "staffed." But in complex reliability engineering, this line blurs. If the pump is welded but requires a human to flip the master switch, is it integrated? If the studio rule is encoded in an automated robotic arm that swaps the prop, is it procedural or physical?

  You cannot define the system boundary solely by physical integration without already knowing which dispositions you intend to ascribe. We call it a "Vessel System" *because* we want to rate it as watertight; we call it a "Prop" *because* we want to rate it as breakable. The boundary follows the verdict.

