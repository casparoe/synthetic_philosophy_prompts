  *   **The Dilemma:** This case exposes that "Physical Integration" is not a binary switch. It reveals that your verdicts rely on a hidden **Probability Threshold**. You call the vessel watertight in Case 4 because the pump's reliability is near 1.0. In Case 7, the human reliability drops the probability. But a disposition is supposed to be categorical, not probabilistic. Your procedure collapses into a reliability calculation, which is what you were trying to ground in the first place.
