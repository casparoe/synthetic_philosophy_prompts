  **Case 7:** A hull is not watertight by construction. It is kept dry by a pump that is welded in and triple-redundant. However, the pump is not automatic; it is triggered by a pressure sensor that alerts a human guard, who *must* manually engage the pump within 30 seconds to prevent flooding. The guard is on duty 24/7.

