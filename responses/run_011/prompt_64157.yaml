          *   Assessment: Accurate historically. Dignāga/Dharmakīrti reduced to two. Nyāya defended four (sometimes).
      *   *S4: 'Inference turns on a pervasion between a reason and what it is meant to establish: smoke is never found where there is no fire.'*
          *   Assessment: Accurate (*vyāpti*). The example is standard.
