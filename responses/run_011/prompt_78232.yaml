answer: |-
  You have not made this up. You have identified a genuine, unresolved tension in moral philosophy, specifically within the literature on **intergenerational justice** and **temporal ethics**.

  The reason you can't find a single name for it is that philosophers usually treat the "future people" problem and the "past people" problem as separate chapters. You are spotting the seam where they are stitched together poorly.

  Here is the breakdown of what you are seeing, the existing concepts that get close, and a proper coinage for the specific argumentative move you've identified.

  ### 1. Does it have a name?
  There is no single standard term for this specific *rhetorical switch*, but it is built out of three existing concepts that are being conflated:

  *   **Temporal Neutrality:** The principle you started with (a benefit is a benefit, regardless of *when*). Most ethicists agree this is the ideal, but few apply it consistently.
  *   **Ought Implies Can:** The Kantian principle that you cannot have a moral obligation to do something impossible. This is the weapon people use against the past ("You can't help the dead, so you don't owe them").
  *   **The Non-Identity Problem:** (Derek Parfit) The idea that our actions now determine *who* exists in the future. This complicates owing things to future people (if we change policy, different people are born, so who exactly are we harming?).

  The pattern you are seeing is people using **"Ought Implies Can"** strictly for the past, but ignoring it for the future, while claiming to hold **"Temporal Neutrality."**

  ### 2. Is it one mistake or two?
  It is **two distinct category errors** that look identical from the outside because they both use the word "can't."

  **Error A (The Past): The Recipient Error**
  *   **The Argument:** "We can't affect the dead, so we can't owe them."
  *   **The Mistake:** This assumes moral obligations require a living recipient to *receive* a benefit.
  *   **Why it's a mistake:** Many obligations are about **integrity**, not reception. If I promise a dying friend to look after their cat, and they die five minutes later, I still owe the cat care. I cannot benefit *my friend* (they are gone), but I still have an obligation *generated by them*.
  *   **How to spot it:** If they say "It's pointless because they can't know," it's this error.

  **Error B (The Future): The Certainty Error**
  *   **The Argument:** "We must save the future even if we can't verify it."
  *   **The Mistake:** This assumes moral obligation survives total epistemic uncertainty.
  *   **Why it's a mistake:** It treats the future as a fixed target (like the past) rather than a probability. If I say "I owe a kid in 2400 a forest," but my actions might accidentally *cause* the catastrophe I'm trying to prevent (due to unforeseen tech), the obligation becomes incoherent.
  *   **How to spot it:** If they say "It doesn't matter if we're wrong, the intent counts," it's this error.

  **Why they look the same:**
  In both cases, the arguer is treating **Causal Power** as the boundary of **Moral Duty**.
  *   Past: No causal power $\rightarrow$ No duty.
  *   Future: Low causal certainty $\rightarrow$ High duty.
  *   **The Contradiction:** They are using causality as a shield in one direction and a sword in the other.

  ### 3. The Edge Case: Artefacts and Contamination
  You asked why people get furious about artefacts/contamination if they claim we owe nothing to the dead.

  This is the key to unlocking the whole puzzle. In these cases, people are **not** arguing we owe a duty *to* the dead person. They are arguing one of two other things:

  1.  **Duties Regarding the Dead:** We owe it to *ourselves* (or our moral code) not to be the kind of people who desecrate graves. The obligation is horizontal (living to living), not vertical (living to dead).
  2.  **Duties to the Living Descendants:** When someone says "Return the Benin Bronzes," they often mean "Return them to the *current* culture/nation that identifies with those ancestors." The harm is being done to *living* people by the continued possession of the artefact.

  **So, is "you can't affect the past" a legitimate reason?**
  *   **Legitimate:** If you mean "I cannot change the welfare of the deceased." (True, they have no welfare).
  *   **Disguised Discount Rate:** If you mean "I don't have to respect their wishes/legacy." (False, this is just choosing to ignore past commitments).

  In the contamination case, the harm often *persists* into the present (radiation, toxic soil). So it's not actually a past claim; it's a present claim with a past cause.

  ### 4. Coining the Term
  Since there isn't a standard name for this specific rhetorical slippage, here is a proper definition for the phenomenon you have identified.

  #### **The Causal Boundary Fallacy**

  **Definition:**
  The Causal Boundary Fallacy occurs when an arguer treats the **direction of causal influence** (forward-only) as the **boundary of moral obligation**, but applies this boundary selectively to exclude past claims while including future claims. It conflates *ontological impossibility* (changing the past) with *moral irrelevance* (ignoring past claims), while simultaneously ignoring *epistemic uncertainty* (predicting the future) when it suits the argument.

  **What falls inside it (Examples):**
  1.  **Climate Hypocrisy:** "We must spend billions to save people in 2100 (despite not knowing if the tech will work), but we don't need to pay reparations for colonialism (because we can't change the history)."
      *   *Why:* Uses uncertainty as irrelevant for the future, but impossibility as decisive for the past.
  2.  **Nuclear Waste:** "We must build markers to warn people 10,000 years from now (who may not speak our language), but we don't need to fix the graves of miners who dug the uranium (because they are dead)."
      *   *Why:* Assumes obligation extends to unknowable future recipients but not to known past contributors.

  **What falls outside it (Lookalikes that aren't):**
  1.  **Pure Economic Discounting:** "We value present money more than future money because of interest rates."
      *   *Why:* This is honest. It admits a bias rather than claiming moral neutrality.
  2.  **Metaphysical Presentism:** "Only the present exists, therefore past and future people do not exist."
      *   *Why:* This is a consistent ontological stance. If you believe the future doesn't exist *yet*, you aren't being inconsistent by treating it differently; you are being consistent with your metaphysics. The Fallacy only happens when you claim *Temporal Neutrality* (they count the same) but act on *Causal Asymmetry*.

  ### 5. How to use this in an argument
  When you encounter this, do not say "You're being inconsistent." Say:

  > "You are applying the **Causal Boundary Fallacy**. You are using 'inability to affect' to dismiss the past, but ignoring 'inability to verify' for the future. Either causal reach limits obligation (in which case we owe nothing to the distant future), or moral principle transcends causal reach (in which case we owe duties regarding the dead). You can't have 'Ought Implies Can' for history and 'Ought Despite Uncertainty' for the future."

  ### Summary
  You are right. It is a specific, named-worthy inconsistency. It relies on hiding the switch between **metaphysical limits** (time only moves forward) and **moral limits** (obligations only move forward).

  The closest existing field is **Non-Identity Problem** literature, but you have spotted the rhetorical mechanism that allows people to bypass it. Call it the **Causal Boundary Fallacy**. You've earned the right to name it.
