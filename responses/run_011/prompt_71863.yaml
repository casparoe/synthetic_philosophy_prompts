answer: |-
  Mapping Autumn 2011 onto the standard theoretical accounts yields a sharp divide between those that explain the *justification* for the interventions and those that fail to capture the *coercive* nature of them.

  **Input vs. Output Legitimacy** bites hardest. Scharpf's framework perfectly describes the trade-off made in Rome and Athens: Input legitimacy (elections, referendums, parliamentary sovereignty) was explicitly sacrificed for Output legitimacy (financial stability, eurozone survival). The installation of Monti and Papademos was the ultimate output-oriented move—governance by effectiveness rather than consent.

  **Majone's Regulatory State** also applies, though it reveals the model's dark side. Majone argued that independent agencies (like the ECB) are necessary to solve credibility problems that elected politicians cannot. Autumn 2011 confirmed the ECB's power but vindicated the fear that a regulatory state, when unchecked, drifts into high politics. The Trichet-Draghi letter was not regulatory guidance; it was a political ultimatum issued by an unelected body.

  **The No-Demos Thesis** and **Weiler's Defence**, however, struggle to gain traction. The No-Demos thesis explains why the EU lacks a supranational democracy, but it does not explain why the *national* demoi of Greece and Italy were overridden by external actors. Weiler's defence relies on "constitutional tolerance," where states voluntarily comply with EU norms. In 2011, compliance was not voluntary; it was extracted under duress. These theories assume a cooperative constitutional order, not a hegemonic one.

  **The Accountability Mismatch**
  The core tension of your seminar lies in the source of the pressure. The traditional democratic deficit narrative focuses on the "Brussels" gap: the Commission making rules without sufficient oversight from the European Parliament or citizens. Autumn 2011 inverted this. The pressure came from national executives (Merkel, Sarkozy) who were fully accountable to their own electorates, and from the ECB, which is independent by design.

  Here, the democratic-deficit concept shows its limits. It was built to diagnose a lack of *supranational* accountability (Commission vs. European Citizen). It has no conceptual room for *transnational* coercion (German Voter vs. Greek Voter). The actors pushing the reforms were electorally accountable, just not to the people suffering the reforms. This is not a deficit of democracy within a polity; it is a conflict between demoi. The traditional concept assumes a single boundary of accountability; it goes silent when the accountability chain crosses borders and breaks the sovereignty of the recipient state.

  **Rule-Making vs. Government Formation**
  Furthermore, the case suggests the democratic-deficit concept was designed to criticize rule-making, not the formation and removal of governments. The theory measures the legitimacy of directives and regulations, not the selection of Prime Ministers. Because the EU has no formal competence to appoint national leaders, the technocratic replacements of Berlusconi and Papandreou remain formally "national" decisions. The theory therefore goes silent on the *mechanism* of removal. It cannot capture how bond spreads and closed-door summits function as a shadow constitution that overrides national electoral mandates without changing a single EU treaty article.

  **The Referendum and the Limits of Theory**
  Finally, be honest about the referendum. Democratic theory protects the right to hold a vote; it does not protect the *viability* of a vote under economic threat. Papandreou was not legally banned from holding a referendum; he was told that doing so would result in the economic collapse of his country. The democratic-deficit literature focuses on legal barriers to participation. It has nothing to say about structural or economic coercion that makes participation impossible. It treats democracy as a set of institutions, not as a capacity to choose without duress.

  Verdict: out-of-scope
