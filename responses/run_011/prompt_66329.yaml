      *   *Idea:* Players are "Observers." They draw tokens from an Urn. Some tokens allow them to stay in the game (Life), others eliminate them (No Life).
      *   *Problem:* If they draw "No Life," they are out. They can't report back. This mimics the anthropic condition.
      *   *Twist:* There are two Urns. Urn A (Naturalism) has very few "Life" tokens. Urn B (Design) has many "Life" tokens.
      *   *Goal:* Players must guess which Urn is being used based *only* on the fact that they are still in the game.
      *   *Complication:* The "Anthropic Retort" is simply saying "I'm here, so I must have drawn Life." The game needs to show that *being here* is evidence for Urn B, even if "being here" was necessary for observation.
