  **Bottom Line:** Dale will likely rule against the water woman citing the Lockean Proviso, and he should, as it's the only way to reconcile his libertarian principles with his intuition on the spring.

  **The Rules**
  You identified three candidate rules. Here is how they survive Dale's scorecard:
  1.  **"Only how it happened matters" (Procedural Justice):** Survives most cases but is threatened by the **1880s Spring**. If the fencing was legal then, procedural justice says it's fine. Dale says it's not. This rule only survives if qualified by the fourth rule below.
  2.  **"Anything the government hands out is tainted":** Killed immediately by the **Lottery** and **Inheritance**. Both rely on state enforcement of transfers, yet Dale calls them fine.
  3.  **"Not fine once people can't do without you" (Necessity):** Killed by the **Funeral Home**. Funerals are practically mandatory, yet Dale says the monopoly pricing is fine because substitutes (driving) exist.

  **The Fourth Rule:** Nozick's **Lockean Proviso**. Acquisition is just only if it leaves "enough and as good" for others. This survives all nine verdicts. It explains why the Spring (vital resource monopoly) and Toll Bridge (coercive charter) fail, while the Duplex and Basketball player (non-vital wealth) pass.

  **The Prediction**
  Dale will say the water woman is **not fine**. He's reading Nozick, who explicitly uses the "only water hole in the desert" case to limit property rights. Dale's silence suggests he recognizes the Proviso trap: she didn't violate procedure, but she violated the condition of survival.

  **The Analog**
  The **1880s Spring** is the closest analog. Both involve natural monopolies on water. However, the precedents only *look* like they settle it. The Spring case allows Dale to hide behind historical injustice (maybe the fencing was theft?), whereas the Water Woman's purchase was voluntary and clean. This forces Dale to admit that even perfectly legal acquisition can be unjust if it monopolizes survival.

  **The Christmas Probe**
  To force the surviving rules (Procedural vs. Proviso) apart, try this:
  *"A farmer legally fences his land, but it turns out it's the only path to the highway for his neighbors. He charges a toll to cross his dirt."*
  This removes the "state coercion" excuse and the "vital fluid" ambiguity. If Dale says "Fine," he abandons the Proviso. If he says "Not Fine," he admits property rights are subordinate to necessity, undermining his defense of the Vacant Lot hoarder. Either way, his consistency cracks.
