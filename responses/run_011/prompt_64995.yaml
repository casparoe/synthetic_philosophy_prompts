answer: |-
  The first step that will not bear the weight placed on it is **(5)**.

  > *(5) The same reasoning reaches names. A street, a school, a bridge, or a library wing named for a person is a monument with the bronze left out: it asserts the same thing...*

  This is the logical fault line. It looks unimpeachable because it relies on a superficial similarity: both statues and names are public markers funded or authorized by the city that contain a person's name. It feels consistent to treat them as the same category of "civic honor."

  However, (5) fails because it conflates **veneration** (the function of a statue) with **nomination** (the function of a name).

  ### Why (5) Fails and Why It Looked True
  It looked true because in common parlance, we say a building is "named in honor of." But semiotically, a street name and a bronze equestrian statue do different work.
  *   **A Statue** is an aesthetic argument. It elevates a body above the viewer, freezes them in a moment of triumph, and uses expensive, permanent material to suggest timelessness. It demands admiration.
  *   **A Name** is a functional label. It is a coordinate. While it carries honor, its primary utility is navigation and identification. We say "I am going to Main Street," not "I am going to worship Main Street."

  By cutting (5), you stop the slide to (10) without sacrificing (4). You can argue that a statue is an active endorsement of a *heroic narrative*, whereas a street name is a passive acknowledgment of *historical presence*. This allows your councillor to demand the statue's removal while accepting that the city must still call its streets something. It saves (11) (the city need not be nameless) without conceding (4) (the statue must go).

  ### Pricing the Repairs

  **1. Does cutting (5) disarm the city from naming anything new?**
  No. In fact, it liberates the city. If names are not monuments, they do not require the same moral purity test as statues. You can name a school after a flawed educator because the school's function is education, not the veneration of the educator's soul. This makes your councillor sound like a legislator, not a zealot. She is drawing a distinction, not burning a forest.

  **2. What must be substituted if honor is to be conferred under a description (Repairing (2))?**
  You do not need to cut (2), but you must **qualify** it. As written, (2) claims civic esteem is *ontologically* indivisible. This is too rigid.
  *   **Repair:** Change (2) to apply specifically to **heroic representation**.
  *   *New (2):* "Civic esteem *in the form of a heroic statue* is not divisible. To cast a man in bronze on a plinth is to present him as a mythic whole; the medium itself erases nuance."
  *   **Why this saves (4):** It argues that the *medium* forces the indivisibility, not the man. You can honor a flawed man in a history book (nuance allowed), but you cannot honor a flawed man in bronze (nuance erased by the form).
  *   **Why this doesn't hand the statue to opponents:** The opponents want to say, "We honor his strategy, not his politics." Your councillor replies, "The statue does not say 'Strategy.' It says 'Man.' The bronze lies if it suggests he was wholly good."

  **3. Can (3) be restricted without becoming arbitrary?**
  Yes. You need a criterion to distinguish the General from the "nearly everyone" in (8). The criterion is **Instrumentality**.
  *   **The Test:** Was the immoral act the *instrument* by which the honor was earned, or merely the *context* in which the honor was earned?
  *   **Application:**
      *   **The General:** He fought *to preserve* bonded labor. The labor system was the *cause* of the war and the *reason* for his command. His honor is instrumentally linked to the immorality.
      *   **The Founders (in your context):** They may have owned people, but if they are honored for writing a constitution or winning a different war, the ownership was context, not the instrument of the specific achievement.
  *   **Why this avoids arbitrariness:** It creates a causal link rather than a moral purity test. It allows the councillor to say: "We do not remove everyone who sinned. We remove those whose sin is the foundation of their statue." This makes (3) defensible against (8).

  **4. Does any repair preserve both (4) and the failed plaque scene?**
  Yes. In fact, keeping **(6)** ("What a monument asserts is fixed when it is made") is essential for the plaque scene to work as you intend.
  *   **The Theory:** If (6) is true, the plaque is a "second statement" that cannot overwrite the "first statement" of the bronze.
  *   **The Scene:** The plaque fails not because the theory is wrong, but because **aesthetics overwhelm text**. The statue is visual, emotional, and dominant. The plaque is textual, rational, and subordinate.
  *   **The Repair:** You do not need to cut (6). You simply need to acknowledge that (6) applies to the *monument*, not the *site*. The plaque changes the site's information, but not the monument's assertion.
  *   **Dramatic Result:** The crowd sees the General on the horse (Hero). They read the plaque (Villain). The visual wins. The plaque fails. This validates your councillor's argument that you cannot "launder" a statue with text. It makes her look prescient, not dogmatic.

  ### Summary of the Revised Argument
  To make your councillor sound rigorous rather than zealous, her speech should pivot on the distinction between **Memory** and **Honor**, and between **Label** and **Icon**.

  1.  **Keep (1):** Statues honor.
  2.  **Qualify (2):** *Heroic* statues present a whole man; they cannot express nuance.
  3.  **Restrict (3):** We remove statues where the immorality was the *instrument* of the achievement.
  4.  **Keep (4):** Therefore, this statue goes.
  5.  **Cut (5):** Names are labels, not icons. They serve a different function. We keep them, but we stop making new statues.
  6.  **Keep (6):** You cannot fix a statue with a plaque. The bronze speaks louder than the text.
  7.  **Keep (7):** Meaning doesn't drift enough to save it.
  8.  **Discard (8)-(10):** Because we have distinguished names from statues, and instrumentality from context, we do not need to erase history.
  9.  **Keep (11):** A city without heroes is poor, but a city with false heroes is dishonest.

  This structure allows your councillor to win the logical argument (the statue must go) while losing the immediate political battle (the plaque fails), which is the perfect tragic irony for your scene. She is right about the statue, but the city is not yet ready to accept the cost of being right.
