  I'm TAing an intro epistemology section and one of my students pushed back on the whole stakes business in a way I couldn't answer cleanly, so I want to build a better case than the ones I can pull up from memory. We'd been going over the two families of moves: the contextualist one, where what shifts is the word — whether 'knows' correctly applies depends on the conversational situation of whoever is doing the ascribing — and the pragmatic encroachement one, where what shifts is the state itself, because how much is practically riding on the belief for the believer is part of what makes it knowledge rather than mere true belief on the same evidence. I told the class these two come apart exactly when the stakes sit with the person asking rather than the person believing, and the student said fine, but show me. I couldnt, because every example I know is already in the textbooks and half of them have the subject aware of the high stakes, which quietly ruins the point.

  So: build me a thought experiment in which the subject is in a genuinely low-stakes situation and forms a belief from ordinary memory or a quick glance, never realizes that anyone's practical reasoning is going to hang on it, and then an hour or so later a different person is in a high-stakes spot acting on that very same information after it got passed along to them by a mutual friend. Two beats, same belief, same evidence throughout. Ground rules: the scenario itself should be one paragraph of ordinary contemporary life — no lotteries, no barn country, no vat demons, no experts with special access, no exotic physics — and please don't reuse the Saturday bank hours or the train that skips the little stops, my students have both of those. Keep the subject ignorant of the high stakes all the way to the end; that's the load-bearing part, so if you think it can't be done without fudging, say that instead of fudging it.

  Then do the checking work. Tell me exactly what the subject believes and by what method, and give me the verdicts on each of the three ascriptions — the subject's own relaxed 'I know' in the first beat, the friend's report in between, and the high-stakes actor's 'she knows' at the end — first as a contextualist reads them and then as an encroachment theorist does, with the reasoning for each, and then point straight at the place where the two readings actually diverge rather than just describe things differently. What the case is for, so you know what counts as cheating here: I want to show the class the dispute isn't purely verbal, that there's a fact the two views disagree about, so the divergence has to fall out of the theories applied to the case and not be stipulated into the setup. After the walkthrough, say which single feature of the case does the separating work, what the thing collapses into if I delete that feature, and how someone who thinks encroachement is a confused doctrine would attack my case rather than concede the divergence. One more thing to fold in if it's relevant: I've been half-jokingly calling a third view borrower invariantism — the idea that the stakes that matter are those of whoever is going to act on the belief, whether or not the believer knows about them or cares — and I'd like to know whether the case you build ends up favoring that view over the two official ones, in a sentence or two, without letting it take over the design. Please write the whole reply as continuous prose, the way you'd write an email: no headings, no bullet points, no bold, no tables, even for the verdict-by-verdict part.
