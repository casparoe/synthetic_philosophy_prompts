answer: |-
  Hi there,

  It is great that you are pushing for a cleaner distinction here, because the student is right to press you on whether the difference is merely verbal or if it tracks a genuine disagreement about the world. The key to separating Contextualism from Pragmatic Encroachment is indeed to isolate the stakes so that they attach to the ascriber or actor without infecting the subject's own practical situation. If the subject becomes aware of the downstream consequences, their own stakes rise, and Encroachment collapses into agreeing with the high-standards view, which ruins the test. Here is a scenario that keeps the subject ignorant throughout, followed by the breakdown you need to walk the class through.

  Morgan walks into the office breakroom, glances at the shared tablet calendar on the wall while waiting for the coffee, sees the 3 PM slot is unmarked, and forms the belief that the conference room is available, intending only to use it for a personal nap; Taylor, a colleague, overhears Morgan mention the open slot and relays this to Casey, who is frantically trying to secure a private space for a high-stakes merger negotiation where any interruption would cause a catastrophic leak, and Casey acts on the information without Morgan ever learning that their casual glance was relied upon for something so critical.

  To do the checking work on this, we first fix the doxastic state: Morgan believes the room is free based on a quick visual inspection of the calendar, which is ordinary evidence sufficient for low-stakes claims but shaky for high-stakes ones. When Morgan says I know the room is free in the breakroom, the Contextualist says this utterance is true because the conversational context is low-stakes, so the word knows sets a low bar that Morgan clears, while the Encroachment theorist also says this is true because Morgan's own practical stakes are low, so the epistemic state itself is satisfied. The divergence appears when we move to Casey, the high-stakes actor. When Casey says Morgan knows the room is free, the Contextualist must say this utterance is false because the context of the ascriber is now high-stakes, which shifts the semantic content of knows to require more evidence than a glance provides, whereas the Encroachment theorist says this utterance is true because the truth of knowledge claims depends on the subject's stakes, not the ascriber's, and since Morgan's stakes remained low, Morgan genuinely knows, making Casey's report a correct description of the facts. The single feature doing the separating work here is Morgan's ignorance of Casey's stakes, because if you delete that feature and let Morgan know about the merger, Morgan's own practical stakes would rise due to moral responsibility or shared interest, causing the Encroachment theorist to agree that Morgan does not know, which collapses the divergence and makes both theories predict failure. Someone who thinks Encroachment is a confused doctrine would attack this case by arguing that the disagreement is not about truth conditions but merely about assertability, claiming that Casey's utterance is technically true but misleadingly optimistic, so the Contextualist is wrong to treat it as false rather than just inappropriate. Finally, regarding borrower invariantism, this case actually favors that view over standard Encroachment if your intuition is that Morgan fails to know because of the risk to Casey, since borrower invariantism locates the stakes in the actor like Contextualism does but treats the knowledge fact as invariant like Encroachment does, though it requires accepting that unknown stakes can destroy knowledge.

  I hope this gives you the leverage you need to show the class that the dispute is substantive rather than just a quibble over definitions.

  Best,
  Your AI Assistant
