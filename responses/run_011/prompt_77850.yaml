      *   *Bottom Line:* The verdict must change: while spreading specks across billions protects each individual from significant harm, concentrating them on one person creates a cumulative burden that rationally outweighs finite torture, proving that the anti-aggregation intuition relies on the separateness of persons rather than the intrinsic negligible nature of the harm.

