      *   **Separateness of Persons:** Rawls/Nozick idea that society is not a super-person. If anti-aggregation relies on this, the intrapersonal case should yield a different verdict (i.e., the specks *do* add up to something worse than torture).
      *   **Sorites/Transitivity:** If speck < torture, and 2 specks < 1 speck + torture... eventually, do enough specks outweigh torture? If not, "better than" is intransitive.
