answer: |-
  Imposing the astronomical sum of dust specks on a single individual is morally worse than torturing them for fifty years, demonstrating that the anti-aggregation intuition derives not from the tininess of the harm but from the moral barrier between distinct lives.

  When harms are concentrated within a single biography, aggregation becomes a requirement of rational prudence. We routinely accept that minor inconveniences accumulate into significant burdens; a toothache lasting ten years is worse than a broken leg lasting a month, even though any single moment of the toothache is less severe than any single moment of the broken leg. To deny this intrapersonal aggregation is to dismantle the possibility of long-term planning and well-being assessment. If minor disutilities never sum to major ones, an agent could never rationally endure a minor pain now to prevent a major pain later, nor could they recognize that a life of constant, low-level irritation is tragic. In the intrapersonal speck case, the victim endures an astronomical duration of irritation. Even if each minute is barely noticeable, the cumulative effect over eons is a life defined by unending, grinding annoyance that precludes deep satisfaction or peace. Compared to a finite fifty-year period of intense suffering followed by relief or death, the unending degradation of the speck-life is plausibly worse.

  The objection that "at any given moment she only has one speck" relies on a snapshot view of well-being that fails to capture the narrative structure of a life. While it is true that the speck-victim is never in agony at time $t$, the torture victim is in agony at every time $t$ within their fifty years. However, moral evaluation compares whole lives, not temporal slices. If we judge only by snapshots, we cannot distinguish between a life of fifty years of torture and a life of one minute of torture, provided the snapshot is taken outside the torture window. Well-being is temporally extended; the badness of a life is not merely the maximum intensity of suffering experienced but also includes the duration and the cumulative weight of negative experiences. To claim the specks do not add up intrapersonally is to claim that duration does not matter, which is absurd.

  This forces a confrontation with the sorites-style worry regarding transitivity. If one insists that no number of specks equals torture even within a single life, one renders the "better than" relation intransitive. Life A (torture) would be worse than Life B (specks), yet Life B is composed of moments each better than moments in Life A, and presumably, adding one speck to a life doesn't make it worse than torture until... when? If there is no lexical threshold intrapersonally, then enough specks must outweigh torture. If there *is* a lexical threshold intrapersonally, we face the absurdity that a million years of itching is preferable to fifty years of torture. Accepting aggregation intrapersonally resolves the transitivity issue: small disutilities sum linearly within a person until they cross the threshold of severe suffering.

  The crucial divergence, then, lies in the interpersonal case. Why do we hesitate to aggregate across persons? The answer is the separateness of persons. In the original crowd scenario, no single individual bears a burden that ruins their life; each retains a life worth living, merely inconvenienced. To sacrifice one person to torture to save the crowd from specks is to treat the crowd as a super-person whose total utility matters more than the individual rights of the torture victim. In the intrapersonal variant, there is no such sacrifice of one for the many; there is only one person whose total well-being is at stake. The moral constraint against aggregation is a constraint against using individuals as containers for utility to be balanced against other individuals. When the container is singular, balancing is not only permitted but required.

  Therefore, the shift in verdict reveals that the intuition protecting the dust-speck crowd was never about the metaphysical impossibility of minor harms summing to major ones. It was about the moral inviolability of individual boundaries. We refuse to aggregate across lives because doing so violates the distinctness of persons, allowing the many to overwhelm the one. We accept aggregation within a life because a person is a unified entity over time, entitled to weigh their own moments against one another. The dust specks do add up, but they only count against torture when they land on the same soul that would otherwise be tortured.
