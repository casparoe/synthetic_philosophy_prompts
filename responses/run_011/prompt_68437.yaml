answer: |-
  This card is built on the **Knowledge Norm** (assert only what you know), summarized as: "Only claim it as fact if you can prove it right now."

  **Why this norm:** The Truth Norm (coach's rule) is impossible because you rarely have 100% certainty; the Reasonable Belief Norm is too loose and caused your source disaster; the Knowledge Norm requires justification accessible *in the round*, balancing ethical assertion with debate speed.

  ### THE 10-SECOND CHECK (Index Card Text)

  1.  **PROOF:** Can I produce the verification *now*? (Card, link, or personal witness).
      *   *No → Do not assert as flat fact.*
  2.  **PARTNER:** Will my teammate's next speech collapse if this number/claim shifts 10%?
      *   *Yes → Must pass Proof test OR DROP IT.*
  3.  **FUTURE:** Is this about what *will* happen (prediction)?
      *   *Yes → Must hedge ("likely," "probable").*
  4.  **SNEAK:** Am I asking a question ("Isn't it true...?") to imply a fact I can't prove?
      *   *Yes → Treat as Assertion (apply rules above).*

  **DECISION:**
  *   Fail Proof + Partner Relies = **DON'T SAY IT.**
  *   Fail Proof + No Reliance = **HEDGE** ("Studies suggest...").
  *   Pass Proof = **ASSERT.**

  *(Note: Steps 2 & 4 require human judgment; the card only flags the risk.)*

  ***

  ### CASE RUNS

  **(1) Think Tank Stat (Never seen study)**
  *   **Proof:** No (haven't seen study).
  *   **Partner:** Yes (if it's a core stat, partner builds on it).
  *   **Decision:** **DON'T SAY IT.**
  *   **Why:** You don't *know* the stat is true, only that the think tank claims it. Since your partner relies on it, you cannot hedge it away without weakening the case. It wins the round but violates the norm; the card bites here to prevent the source destruction you just suffered.

  **(2) Brother's School (Certain, undocumented)**
  *   **Proof:** Yes (Personal witness counts as knowledge).
  *   **Partner:** No (Anecdote usually supports, doesn't carry the link).
  *   **Decision:** **ASSERT (as anecdote).**
  *   **Why:** You satisfy the Knowledge Norm via direct observation. You must label it "in my experience" so the judge knows the scope of the knowledge, but you aren't lying about a source.

  **(3) 3-Year Prediction**
  *   **Proof:** No (Future contingents cannot be known).
  *   **Future:** Yes.
  *   **Decision:** **HEDGE.**
  *   **Why:** You cannot *know* the future. You must say "This will likely happen." If your strategy requires it to be certain to win, the card forces you to **DROP IT**, because asserting a guess as fact violates the Knowledge Norm.

  ***

  ### WHERE THE CARD MISFIRES

  **1. The "Common Knowledge" Gap:** The card fails on claims everyone accepts (e.g., "The sky is blue"). You don't have a card ready, but you know it. You'll waste seconds checking "Proof" when you should just assert. *Judgment required to skip the card for trivialities.*

  **2. The "Good Enough" Evidence:** Sometimes you have a source, but it's weak (biased blog). The card says "Pass Proof" because you have a link, but the Knowledge Norm implies you should know if the source is reliable. The card can't assess source quality, only presence. *Judgment required to vet the source before the round.*

  **3. Partner Pressure:** Step 2 asks if your partner will collapse. In high-stakes rounds, partners rely on *everything*. You might judge "Yes" on every claim, forcing you to drop too much. *Judgment required to distinguish "critical link" from "flavor text."*

  **4. The Sneaky Hedge:** You can still violate the norm by hedging so slightly ("It is virtually certain...") that it sounds like fact. The card flags "Future" but can't catch linguistic weasel words. *Judgment required to ensure the hedge is audible to the judge.*
