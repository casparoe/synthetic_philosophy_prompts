prompt: |-
  So I'm captain of my school's debate team and we got absolutly destroyed at a tournament last weekend over a source thing, and now I'm trying to figure out what our actual rule should be. Our coach's rule is basically "never say anything in a round that you aren't 100% certain is true," which sounds responsible but is useless in practice — like, half of what you say in a round you aren't certain about, and if we only asserted the stuff we were certain of we wouldn't have a case. I've been reading about the philosophy of assertion stuff, the debate between the knowledge norm (Williamson's version, only assert what you know), the truth norm (only assert what's true, whether you know it or not), and the weaker one where it's enough that you reasonably believe it. They give different verdicts on the same case and I can't tell which one my coach is trying to be.

  Can you build me an actual procedure my team can run — the questions to ask about a claim, in order, before it comes out of your mouth, what counts as a good enough answer to each one, and where it lands: say it flat out, only say it hedged or conditional ("if that number's right then..."), or don't say it at all. Two things I care about that I think the norms talk about but that never make it onto a debate card: first, whether presenting something conditionally or as a question to the other team actually escapes the norm or is just a sneaky way of asserting it anyway; and second, that in a round the person I'm asserting to isn't only a judge, it's my partner, who's going to build the next four minutes on top of whatever I said — so I want the procedure to care about who's relying on me, if that's legitimate or if I'm just inventing a fourth norm.

  Constraints: it has to fit on one index card, usable in about ten seconds during prep, by people who've never heard of any of this. Say which norm you built the card around and why you picked it over the other two, not just mush all three together. And mark the places where it's really my judgment doing the work and the card is just dressing it up.

  Then run the card on three cases: (1) a statistic from a think tank our side uses constantly that I'm pretty sure is real but I've never seen the actual study behind it; (2) something I know from my own life — my little brother's school did exactly this policy and it flopped — that I'm totally certain of but can't document at all; (3) a confident prediction I'm making about what happens three years after a policy passes. At least one of those should come out as "don't say it," even though saying it would probably win us the round — I want to see the card bite on something I'd hate to give up.

  End with what the card can't handle and where it'll misfire. Bottom line in your very first sentence: which norm the card is built on and the one-line version of the rule, then the reasoning after that. No preamble, don't restate my question, and no bibliography or list of stuff to go read, I can't look anything up right now.
