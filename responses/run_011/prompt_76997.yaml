  **Case:** You see a stranger struggling with a heavy sofa. You step in and lift the other end. You think you are helping them. In fact, they think you are obstructing them and try to push you away, but the sofa moves upright anyway. Were you acting together?

  *   **Yes, joint action can exist even if one party is wrong about it.** (Go to Question 2)
  *   **No, both must know they are cooperating for it to count.** (Go to Question 3)
  *   **No, there is no such thing as 'acting together', only two individuals moving near each other.** (Go to **Leaf: Eliminativist**)

  ### Question 2
  **Case:** Consider a successful duet. Is the mental state driving you best described as 'I intend that we sing' plus a belief that you intend the same, or is it a distinct, primitive state?

  *   **It reduces to interlocking individual intentions and beliefs.** (Go to Question 4)
  *   **It is a primitive 'we-intention' in the individual mind.** (Go to Question 5)
  *   **It is a joint commitment creating a plural subject.** (Go to Question 6)

  ### Question 3
  **Case:** You and a partner are carrying a table. You both know you are doing it. Do you need to know that *they know* that *you know* (common knowledge), or is mutual belief enough?

  *   **Yes, common knowledge is required.** (Go to Question 6)
  *   **No, weaker mutual belief or functional coordination suffices.** (Go to Question 4)

  ### Question 4
  **Case:** You are working on a shared task. If you decide to stop, must you negotiate an exit with your partner, or can you simply quit?

  *   **I can quit unilaterally; I only owe them consistency.** (Go to Question 7)
  *   **We must rescind the action jointly; I owe them compliance.** (Go to **Leaf: Gilbert**) *[Note: This route implies commitment without primitive we-intention, a tension noted in Logical Space]*

  ### Question 5
  **Case:** You have a primitive we-intention. If your partner quits without warning, do you have a moral standing to complain, or merely a rational frustration?

  *   **I have a moral standing to complain; obligations are generated.** (Go to **Empty Cell A**) *[Nudge: See Key]*
  *   **I feel frustration, but no obligation was created.** (Go to **Leaf: Searle**)

  ### Question 6
  **Case:** When the team makes a decision (e.g., a jury verdict), who is the agent?

  *   **The group itself is the agent, distinct from the members.** (Go to **Leaf: List & Pettit**)
  *   **The individuals are the agents, acting jointly.** (Go to Question 8)

  ### Question 7
  **Case:** In the sofa case (Q1), if you both knew you were lifting, would you need any shared intention at all, or just causal interlocking?

  *   **Shared intention is necessary.** (Go to **Leaf: Bratman**)
  *   **No, causal interlocking and prediction are enough.** (Go to **Leaf: Deflationary**)

  ### Question 8
  **Case:** You say "we decided to move cities", but only one person voiced it and the other just went along. Is this a distinct mode of functioning?

  *   **Yes, functioning as a group member (we-mode) is distinct from functioning as a private person (I-mode).** (Go to **Leaf: Tuomela**)
  *   **No, it's just a strong form of individual cooperation.** (Go to **Leaf: Bratman**)

  ---

  ### Logical Space and Empty Cells

  The tree above maps six dimensions: Error Tolerance, Psychological Constitution, Epistemic Threshold, Normative Force, Exit Conditions, and Ontological Agency. The positions are placed based on their commitment to these dimensions. Three combinations in this space are empty:

  1.  **Empty Cell A (Primitive We-Intention + Strong Obligation):** Reached via Q2 (Primitive) and Q5 (Obligation).
      *   **Diagnosis:** **Incoherent.** Searle's primitive we-intention is explicitly individualistic in ontology (in the head) and denies that intention alone creates obligation. Gilbert grounds obligation in commitment, not primitive intention. A view claiming the mental state is primitive *and* creates binding obligations lacks a mechanism for the normativity.
      *   **Nudge:** If you chose this, ask: *Does the obligation come from the mental state itself or from a social agreement?* If agreement, go to **Gilbert**. If mental state only, go to **Searle**.

  2.  **Empty Cell B (Joint Commitment + Unilateral Exit):** Reached via Q2 (Commitment) and Q4 (Unilateral).
      *   **Diagnosis:** **Incoherent.** Gilbert's joint commitment constitutively requires joint rescission. To claim a commitment exists but can be dissolved by one party contradicts the definition of the commitment.
      *   **Nudge:** If you chose this, ask: *If one person can quit alone, was it ever a commitment, or just a personal intention?* If personal intention, go to **Bratman**.

  3.  **Empty Cell C (Group Agent + No Common Knowledge):** Reached via Q6 (Group Agent) and Q3 (Weaker Epistemics).
      *   **Diagnosis:** **Unattractive/Unexplored.** List and Pettit require structured input functions to form group attitudes. Without common knowledge or at least robust mutual belief, the group cannot form the unified stance required for agency.
      *   **Nudge:** If you chose this, ask: *How does the group form a view if members don't know what others think?* If they must know, go to **List & Pettit**. If not, you likely deny group agency; go to **Bratman** or **Tuomela**.

  **Critique of Mandatory Nodes:**
  *   **Agency (Q6):** This is a welded question. Joint action does not entail group agency. Many joint action theorists (Bratman, Gilbert) deny the group is an agent. I have separated it late in the tree to avoid forcing a metaphysical commitment on those who only care about the action structure.
  *   **Normativity (Q5):** "Obligations and standing to complain" are treated as a package. In reality, one might have standing without full moral obligation (e.g., contractual vs moral). I have treated them together for parsimony, following Gilbert.

  **Indistinguishable Leaves:**
  *   **Bratman vs. Tuomela (I-mode):** The tree routes both to **Bratman** in Q8 if the user denies the we-mode distinction. Their accounts overlap significantly on low-stakes cooperative cases. The tree cannot distinguish them without asking about *group reasons* specifically, which exceeds the node limit.
  *   **Deflationary vs. Bratman (Low Stakes):** On the sofa case (Q1), both may answer "Yes" to joint action but differ on intention. Q7 attempts to split them, but in practice, users may conflate "shared intention" with "coordination".

  ---

  ### Case Routing

  **(a) Two strangers wordlessly heave a fallen cyclist upright:**
  *   **Path:** Q1 (Yes/Asymmetric possible? -> No, usually symmetric here) -> Q3 (Weaker epistemics) -> Q4 (Unilateral exit) -> Q7 (Shared intention needed? -> Yes).
  *   **Leaf:** **Bratman** (or **Deflationary** if Q7 answered 'No').
  *   **Worst Handled Case:** **(c) Couple moving cities.** Bratman requires too much explicit mutual responsiveness for implicit domestic coordination.

  **(b) Neighbourhood WhatsApp thread sending a letter:**
  *   **Path:** Q1 (No) -> Q3 (Common Knowledge) -> Q6 (Group Agent? -> Yes/No). If Yes -> **List & Pettit**. If No -> Q4 (Joint Exit?) -> **Gilbert**.
  *   **Leaf:** **Gilbert** (typical answerer sees plural subject without full corporate agency).
  *   **Worst Handled Case:** **(f) Robot catch.** Gilbert requires moral agents capable of commitment; robots cannot enter joint commitments.

  **(c) Couple saying "we decided" (one voiced, one went along):**
  *   **Path:** Q1 (No) -> Q2 (Primitive/We-mode?) -> Q8 (We-mode distinct?).
  *   **Leaf:** **Tuomela**.
  *   **Worst Handled Case:** **(a) Strangers lifting cyclist.** Tuomela's we-mode is too strong for ad-hoc stranger cooperation without group reasons.

  **(d) Co-authored paper (unequal work):**
  *   **Path:** Q1 (No) -> Q2 (Individual interlocking) -> Q4 (Unilateral exit) -> Q7 (Intention needed).
  *   **Leaf:** **Bratman**.
  *   **Worst Handled Case:** **(e) Jury verdict.** Bratman struggles with the binding nature of the verdict over the dissenting individual.

  **(e) Jury verdict (one private dissent):**
  *   **Path:** Q1 (No) -> Q6 (Group Agent).
  *   **Leaf:** **List & Pettit**.
  *   **Worst Handled Case:** **(a) Strangers lifting cyclist.** Group agency is overkill for transient physical cooperation.

  **(f) Person playing catch with a robot arm:**
  *   **Path:** Q1 (Yes, asymmetric possible) -> Q2 (Individual/Deflationary) -> Q7 (Intention needed? -> No).
  *   **Leaf:** **Deflationary**.
  *   **Worst Handled Case:** **(b) WhatsApp letter.** Deflationary accounts miss the normative structure of the group decision.

  ---

  ### Key for Contradictions and Empty Cells

  *   **If routed to Empty Cell A (Primitive + Obligation):** You are likely presupposing **Gilbert** but misdescribing the psychology. Gilbert posits commitment, not primitive we-intention. **Nudge to Gilbert.**
  *   **If routed to Empty Cell B (Commitment + Unilateral):** You are likely presupposing **Bratman** but using the word 'commitment' loosely. Bratman allows unilateral withdrawal. **Nudge to Bratman.**
  *   **If routed to Empty Cell C (Group Agent + No CK):** You likely assume the group knows what it is doing. **Nudge to List & Pettit** (accept CK requirement) or **Bratman** (reject Group Agency).
  *   **If Q1 (Error) is Yes, but Q7 (Intention) is Yes:** This suggests **Searle**. Searle allows the we-intention to be in one mind (though joint action requires success), but denies strong obligation. **Nudge to Searle.**
  *   **If Q6 (Agency) is Group, but Q4 (Exit) is Unilateral:** Incoherent for Group Agency. If the group acts, the individual cannot unilaterally dissolve the group's act. **Nudge to List & Pettit** (Joint exit via group procedure).
