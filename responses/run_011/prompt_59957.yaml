  *   *Factivity:* If Log says $p$, is $p$ true? Yes, by assumption of tamper-proof/correct instrumentation.
  *   *Distribution:* If Log says ($p$ and $q$), does it say $p$ and say $q$? In a structured log, yes, the data is accessible.
