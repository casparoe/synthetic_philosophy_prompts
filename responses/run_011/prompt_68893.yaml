  4. **A judgement on the framing in ¶4.** Is my characterisation of the revealed-preference programme fair, or have I turned a thesis about the content of demand theory into a thesis about the epistemology of all utility measurement? Say whether the chapter needs the revealed-preference material at all, or whether it could be replaced by something less contentious without loss to the argument.

