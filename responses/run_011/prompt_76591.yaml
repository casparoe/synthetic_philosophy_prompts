answer: |-
  You have identified a genuine terminological gap in the interdisciplinary space between archaeology, complexity science, and public history. You are correct that existing terms like "resilience," "decomplexification," or "Simpson's paradox" are adjacent but imprecise for the specific phenomenon you are describing: **the ontological reality that a society can simultaneously collapse and thrive depending on the hierarchical stratum being measured.**

  Here is an analysis of the nearest existing concepts, why they fall short, and a proposal for new terminology to fill the gap you've found.

  ### 1. The Nearest Existing Terms (and Why They Miss)

  **A. "Transformation" (vs. Collapse)**
  *   **The Concept:** In the last two decades, archaeologists like Norman Yoffee, Patricia McAnany, and Guy Middleton have argued for replacing "collapse" with "transformation." This is the dominant academic counter-narrative to your observation.
  *   **Why it differs:** "Transformation" is a *verdict* on the whole system, not a description of the *divergence* within it. It says, "Don't call it collapse, call it change." It does not provide a vocabulary for the specific moment when the palace burns (collapse) while the peasant diet improves (thriving). It flattens the levels rather than naming their tension.

  **B. "Decomplexification"**
  *   **The Concept:** Derived from Joseph Tainter's work, this describes the loss of social hierarchy, administrative layers, and energy capture.
  *   **Why it differs:** This term accurately describes the *elite/institutional* level (the tablets stop, the monuments cease). However, it is silent on the *population* level. A society can decomplexify and see its average human welfare rise (less taxation, less conscription, more protein). Decomplexification describes the *structure*, not the *human outcome*.

  **C. "Resilience Theory" / "Panarchy"**
  *   **The Concept:** In complex systems, resilience is the ability to absorb disturbance and retain function. Panarchy describes how systems interact across scales (e.g., a forest canopy vs. the undergrowth).
  *   **Why it differs:** While resilience theory acknowledges cross-scale interactions, it generally looks for *continuity of function*. It lacks a specific term for when the "fast/small" variables (commoner welfare) move inversely to the "slow/large" variables (state institutions). It treats the divergence as a dynamic process, not a definitional crisis.

  **D. "Simpson's Paradox"**
  *   **The Concept:** A statistical phenomenon where a trend appears in different groups of data but disappears or reverses when these groups are combined.
  *   **Why it differs:** You are correct to reject this. Simpson's Paradox implies a statistical artifact or an aggregation error. Your observation is not an error; it is a genuine ontological feature. The elites *did* lose power; the commoners *did* gain security. Both are true facts, not statistical illusions.

  ### 2. Proposed Terminology

  Since no single established term captures the *level-dependence of the verdict itself*, I propose two terms: one for the phenomenon and one for the rhetorical move.

  #### The Phenomenon: **"Hierarchical Divergence"**
  **Definition:** A state during societal transition where indicators of political complexity (monuments, administration, elite wealth) decline, while indicators of population welfare (biological health, settlement density, cultural continuity) remain stable or improve.

  *   **Why this fits:** It avoids the normative baggage of "collapse" (which implies bad) and "transformation" (which implies neutral). It specifically names the *split* between the hierarchy (top) and the base (bottom).
  *   **Boundary Cases:**
      *   *Convergent Decline:* Both elites and population deteriorate (e.g., total environmental catastrophe). This is **"Systemic Collapse."**
      *   *Convergent Growth:* Both elites and population flourish. This is **"Systemic Expansion."**
      *   *Hierarchical Divergence:* The specific case you described.
  *   **When the label stops doing work:** The term loses utility if the divergence is temporary (less than a generation) or if the "improvement" at the population level is negligible compared to the loss of security provided by the state (e.g., anarchy leads to higher violence). It is most useful when the divergence persists for multiple generations.

  #### The Rhetorical Move: **"The Elite Metonym"**
  **Definition:** The rhetorical substitution of the ruling class's fate for the society's fate. It occurs when a narrator describes a situation using institutional registers (palaces, dynasties, literacy) but evaluates it using human registers (suffering, continuity, welfare), or vice versa, without acknowledging the substitution.

  *   **Why this fits:** It identifies the linguistic sleight-of-hand. "The Civilization Collapsed" is often shorthand for "The Dynasty Ended." By calling it a metonym, you expose that the part (elite) is standing in for the whole (society).
  *   **Example:** "The Bronze Age Collapse ended civilization." (False: It ended *palatial* civilization; *peasant* civilization continued.)
  *   **Counter-Move:** "The Peasant Metonym." (Rarely used, but possible: claiming society thrived because bones look healthy, ignoring the loss of legal protection or trade networks.)

  ### 3. Addressing the "Real Collapse" Question

  You asked: *What if the population-level register deteriorates too: does that make it a real collapse, or merely one in which the levels agree?*

  This touches on the normative definition of "collapse."
  *   **Descriptive Definition (Tainter):** Collapse is strictly a **loss of complexity**. By this definition, your Bronze Age example *is* a real collapse, regardless of skeletal health. The state is gone.
  *   **Normative Definition (Human Welfare):** Collapse is a **loss of safety/wellbeing**. By this definition, your example is *not* a collapse; it is a liberation or a reorganization.

  **The Solution:**
  Do not use "Real Collapse." Instead, use **"Totalizing Collapse"** vs. **"Elite Collapse."**
  *   **Elite Collapse:** Hierarchical Divergence (Institutions fail, people persist).
  *   **Totalizing Collapse:** Convergent Decline (Institutions fail, people die/disperse).

  The label "Collapse" stops doing analytical work when it is used without a specified **Unit of Analysis**. If a headline says "Society X Collapsed," it is scientifically meaningless unless it specifies: *Collapsed politically? Demographically? Economically?*

  ### 4. Summary for Your Desk

  When writing for a general-interest audience, you can operationalize this distinction without neologisms if necessary, but precision helps.

  *   **Instead of:** "Did the society collapse?"
  *   **Try:** "Did the *state* collapse, or did the *people*?"
  *   **The Term to Use:** **"Hierarchical Divergence."**
  *   **The Trap to Name:** **"The Elite Metonym."**

  This framework allows you to acknowledge the reality of the ruined palaces (the complexity loss) without accepting the implication of human catastrophe (the welfare loss). It validates your observation that these are not contradictory facts, but parallel truths operating on different vertical scales of the same system.

  **Reference Note:** If you need to cite the academic lineage of this thought, look to **Norman Yoffee** (*Questioning Collapse*, 2010) and **Patricia McAnany** (*Saving the Maya*, 2015), who argue that "collapse" is a myth perpetuated by focusing on elites. However, they argue for abandoning the word "collapse" entirely. Your contribution is more nuanced: you are arguing for *scaling* the word, not abandoning it. That is a distinct and valuable position.
