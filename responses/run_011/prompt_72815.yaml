  **Brainstorming**

  Her position is strong because it bypasses the "preserve the structure" reply by targeting the tools of preservation rather than the preserved content. The IBE turn is rhetorically potent, forcing the realist to use a suspect tool to defend trust in tools. However, she is exposed on the status of her own claim: if it is a knowledge claim, it self-undermines; if not, it lacks force. She is also vulnerable on the individuation of methods versus theories.

  Expected deflating moves:
  1. *Asymmetry:* She will argue her induction is meta-level, exempt from the object-level doubt she raises.
  2. *Retreat:* She will soften "unreliable" to "not guaranteed," shifting from a truth claim to a cautionary heuristic.
  3. *Burden Shifting:* She will claim she only needs to show realism is unproven, not that anti-realism is proven.

  Design questions to force her to choose: if her argument is exempt from her own pessimism, why? If it is subject to it, why trust it? If it is merely cautionary, does it defeat realism or just advise humility?

  ***

  **Interview Questions**

  1. You distinguish methods from theories to avoid structural realist replies. If a method is defined by the theory that licenses it, isn't method change just content change in different vocabulary?

  2. You claim structural realism fails because it preserves content, not licenses. To clarify, what exactly counts as a method on your account that is not also theoretical content?
      *   *Follow-up:* Can you name a procedure that survives a theory change intact yet is retrospectively judged unreliable, and what does your account predict about that case in advance?

  3. You argue the No-Miracles argument fails because it uses inference to the best explanation, which is itself on your list of suspect licenses. Does this make the inference unsound, or only currently unsupported?
      *   *Follow-up:* If only unsupported, is your own historical generalization any better placed, or does it inherit the same doubt?

  4. **[Criticism i: Self-undermining]** Your thesis is itself an inductive extrapolation from a historical sample. How can you distrust extrapolation from samples of scientific success while depending on it for your own premise?
      *   *Follow-up:* If you claim an asymmetry because your argument is meta-level, isn't claiming that asymmetry itself a methodological license you cannot trust?

  5. **[Criticism ii: Case Selection]** No neutral criterion determines which abandoned procedures count as successful methods rather than fringe programs. How do you select your examples without begging the question?
      *   *Follow-up:* If you cannot provide a neutral criterion, does the induction collapse into a selection of cases chosen to fit the conclusion?

  6. **[Criticism iii: Reach]** Even granting your premise, a realist can accept methods will be revised while holding current methods are approximately truth-conducive. Why does revision imply unreliability rather than progress?
      *   *Follow-up:* If method change has been progressive on any measure that does not beg the question, does your pessimism lose its force against realism?

  7. Audiences will assume this is the problem of unconceived alternatives restated. What does your view add, given that pessimism about unconceived alternatives already concludes our theory space is impoverished in ways we cannot detect?

  8. What specific historical discovery would convince you that methodological pessimism is false?
      *   *Follow-up:* If you reply that no single case could disconfirm a probabilistic thesis, what distinguishes your thesis from one that is merely unfalsifiable?

  9. If our licenses are probably unreliable where they look most reliable, what should a working scientist do differently on Monday morning?
      *   *Follow-up:* If you answer nothing changes locally, is the view then idle, and have you simply relocated the old underdetermination worry?

  10. You say past methods were successful by their own lights. How do we verify that success without relying on the very standards you claim are suspect?

  11. You claim our current licenses are unreliable with "high probability." Does this probability rest on a frequency count, or is it a subjective degree of belief?

  12. You concede the realist answer to the theory-based pessimistic induction. Why should they concede the method-based version if they already accept content preservation?

  13. Is your pessimism global, applying to all inference, or local, applying only to specific domains like unobservable entities?

  ***

  **Closing Note**

  If time runs short, I would cut questions 10 and 12 because they are supportive clarifications rather than core argumentative strikes. Question 10 reinforces the case selection worry, which is already covered in question 5, making it redundant under pressure. Question 12 asks for a concession that is secondary to the main goal of testing the internal coherence of her own argument.
