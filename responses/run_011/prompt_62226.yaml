answer: |-
  Your tentative rule breaks because it conflates *physical capacity* with *political contingency*. The 1918 flu absolutely changed what humans could do (it killed 50 million people), but it did not force a reconfiguration of the state; the existing political order absorbed the shock and continued. Syria is the inverse: the drought changed what farmers could do (forced migration), but the civil war was not an inevitable physical outcome of dry soil; it was a political choice by the Assad regime to weaponize that migration. Your instinct to reject Syria is correct, but your rule ("changed what humans could do") would incorrectly admit it.

  Here are three candidate principles to replace it.

  **1. The Counterfactual Trajectory Principle**
  *   **Clause:** A non-human entity is an actor only if removing it from the timeline fundamentally alters the political endpoint.
  *   **Motivating Case:** Tambora. Without the eruption, there is no "Year Without Summer," no crop failure, and likely no *Frankenstein* or Swiss migration. The trajectory shifts.
  *   **Failure Case:** 1918 Flu. Remove the flu, and the Treaty of Versailles, the rise of fascism, and the redrawing of maps likely proceed similarly. The death toll was catastrophic, but the political trajectory was already set by the war.

  **2. The Institutional Absorption Principle**
  *   **Clause:** A non-human entity is an actor only when existing political institutions fail to absorb, redirect, or exploit its effects.
  *   **Motivating Case:** Black Death in England. The state tried to legislate wages back down (Statute of Laborers) and failed. The demographic shock fractured the feudal settlement.
  *   **Failure Case:** Black Death East of the Elbe. The demographic shock was identical, but lordly power successfully redirected it. Labor scarcity should have raised wages; instead, lords used coercion to lock peasants down. The institution won; the microbe lost.

  **3. The Zero-Sum Agency Principle**
  *   **Clause:** A non-human entity is an actor only when it operates independently of human intention, rather than serving as a tool for human power.
  *   **Motivating Case:** Yellow Fever in Saint-Domingue. The mosquitoes did not care about liberty or empire; they wrecked the French army regardless of strategy.
  *   **Failure Case:** Syrian Drought. The drought was a natural stressor, but the *disaster* was manufactured by policy. The regime chose not to aid the displaced farmers. The drought was the gun; the regime pulled the trigger.

  **My Favorite: The Institutional Absorption Principle**
  This captures your East of the Elbe intuition best. It explains why the same microbe gets a "yes" in England and a "no" in Prussia. It isn't about the bug; it's about whether the bug broke the system or the system rode the bug.

  **Predictions for New Cases:**
  *   **Malaria at the Panama Canal:** **Yes.** The U.S. could not build the canal until Gorgas killed the mosquitoes. The political will and capital were present, but the biology vetoed the project. The institution (U.S. engineering) had to reconfigure itself (sanitation first, digging second) to survive the shock.
  *   **Little Ice Age and 17th-Century Revolts:** **Mixed.** In China (Ming Dynasty), the cold caused crop failures that the state could not absorb; the dynasty fell. **Yes.** In France (The Fronde), cold and harvest failure sparked unrest, but the monarchy survived and centralized power. **No.** The climate was a stressor, but the political outcome depended on institutional resilience.

  **Blunt Truths:**
  *   **Your Yellow Fever reluctance is indefensible.** Crediting the mosquitoes does not subtract from Haitian agency; it explains the battlefield conditions. Toussaint Louverture and the mosquitoes were allies. Denying the mosquitoes is romanticism, not history.
  *   **Your 1918 verdict is correct, but your reasoning was wrong.** It's not in the book because states absorbed the death toll without structural change, not because it didn't change "what humans could do."
  *   **The Syria/Tambora pair is saveable.** They are consistent under the Absorption Principle. Tambora broke the global climate system and societies couldn't adapt quickly enough (Actor). Syria's drought was processed by a regime that used it to consolidate power (Not an Actor).

  Verdict: A non-human force counts as a historical actor only when it overrides the capacity of existing political institutions to absorb, redirect, or exploit its effects.
