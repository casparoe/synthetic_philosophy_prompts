answer: |-
  Ray is a wedge case. Strawson's framework relies on a binary distinction: you are either a participant in ordinary adult interpersonal relationships (liable to reactive attitudes) or you are not (an object of the objective attitude). Ray forces us to ask whether participation is a global status or a local function. Here is how Strawson's framework strains under the weight of compartmentalized agency.

  **1. The Verdict on Ray**
  Strawson would likely rule that Ray is a proper target of resentment across the board, though the *force* of that verdict varies by relationship.

  *   **The Coworker:** Yes, resentment is appropriate. Ray is not psychologically incapacitated; he is merely morally selective. His indifference at work is a violation of the demand for goodwill, not an exemption from it. He is a bad participant, not a non-participant.
  *   **The Wife:** Yes. Since Ray participates fully here, he is liable. If he wronged her, resentment would be fitting. The fact that he feels guilt here proves his capacity is intact.
  *   **The Daughter:** Yes, same as the wife. Her resentment (if he wronged her) would be met by his capacity for shame.
  *   **The Stranger:** Yes, in principle. Strawson argues the demand for goodwill is universal among moral agents. Ray's indifference to strangers makes him cold, not exempt.

  The divergence lies in the *utility* of the attitude. Resentment toward Ray at work might feel futile because he doesn't care, but Strawson insists reactive attitudes are not merely tools for behavior modification; they are acknowledgments of standing. To deny Ray standing at work because he ignores it would be to grant him a exemption he hasn't earned.

  **2. Candidate Rules and Divergence**
  To see where Ray breaks the system, we need to isolate the rules generating Strawson's standard verdicts. Here are four candidates:

  *   **Rule A (Global Capacity):** If an agent possesses the general capacity for reactive attitudes anywhere, they are liable everywhere.
  *   **Rule B (Local Participation):** Liability is indexed to the specific relationship. If you don't participate in *this* relationship, you are exempt *here*.
  *   **Rule C (Recognition of Demand):** Liability depends on acknowledging the general demand for goodwill, even if you violate it occasionally.
  *   **Rule D (Clinical Abnormality):** Exemption requires a recognized psychological abnormality (psychosis, infancy, extreme strain).

  In standard cases, these rules converge. The psychopath lacks global capacity (A), doesn't participate locally (B), doesn't recognize the demand (C), and is clinically abnormal (D). The accidental harm-doer has capacity (A), participates (B), recognizes the demand (C), and is normal (D).

  Ray forces them apart. Rule A says Ray is liable at work (he has capacity at home). Rule B says Ray might be exempt at work (he doesn't participate there). Rule C is ambiguous: does recognizing the demand at home count for work? Rule D says Ray is liable (he is clinically normal). Strawson's text leans heavily on A and D, treating "ordinary adult interpersonal relationships" as a unified status. Rule B is the intuitive fix for Ray, but it isn't in Strawson's text. He doesn't envision a modular moral psyche.

  **3. The Best Guess: Smuggling vs. Text**
  Strawson's actual view aligns with Rule A (Global Capacity) supported by Rule D (Clinical Abnormality). He grounds responsibility in the natural history of human relationships, not in a contract of mutual recognition per domain. For Strawson, the possibility of resentment depends on whether we *can* view someone as a person, not whether they currently view us as one. Ray's home life proves he is a person in the relevant sense. To exempt him at work would require treating him as an object of management solely because he chooses to be immoral there. Strawson rejects the idea that moral badness equates to incapacity.

  However, holding this view requires smuggling in a premise Strawson doesn't explicitly defend: that moral capacity is non-compartmentalized. He assumes that if you can feel guilt, you are a moral agent *simpliciter*. He doesn't account for the sociopath who functions normally in narrow bands. If pressed, Strawson would likely insist Ray is liable everywhere, because the alternative—granting exemption based on local indifference—threatens to collapse the distinction between *excusing* an act and *exempting* an agent. If we exempt Ray at work, we risk exempting any stubborn moral offender who simply refuses to care.

  **4. Appropriateness vs. Non-Optionality**
  This is where the framework holds, provided we keep the concepts separate. Strawson argues we cannot universally suspend reactive attitudes (non-optionality global), but we can locally adopt the objective attitude (optionality local).

  *   **Appropriateness:** Resentment toward Ray is *appropriate* for the coworker because Ray is a liable agent. He has not lost his standing.
  *   **Non-Optionality:** Resentment toward Ray is *optional* for the coworker. Strawson explicitly allows us to decide locally to manage someone rather than engage them (the "colleague" case). The coworker can choose to view Ray objectively to preserve their own peace, even if Ray doesn't deserve it universally.

  For the wife, resentment is both appropriate and likely non-optional in practice, because the relationship is constituted by those attitudes. You cannot manage a spouse like a patient without destroying the relationship. For the stranger, resentment is appropriate but practically inert; the stranger lacks the relational context to sustain the attitude. Strawson's claim that we "can't switch off" attitudes applies to the human form of life, not to every specific interaction. The coworker can switch it off; humanity cannot.

  **5. The Discriminating Variant**
  To test Rule A (Global Capacity) against Rule B (Local Participation), consider **The One-Person Moralist**.

  Meet Jay. Jay is identical to Ray, except his capacity for reactive attitudes is restricted exclusively to his mother. He feels profound guilt, gratitude, and resentment regarding her, and only her. Toward his wife, coworkers, and strangers, he is indistinguishable from a high-functioning psychopath. He is clinically normal otherwise.

  *   **Rule A (Global Capacity)** says Jay is liable everywhere. Because he has *some* capacity, he is a moral agent full stop. His wife can legitimately resent him.
  *   **Rule B (Local Participation)** says Jay is exempt regarding his wife. He lacks the capacity to participate in *that* relationship. Treating him as a liable agent there is like resenting a child for not paying taxes.

  This variant discriminates better than Ray because Ray's home life suggests a general capacity that is merely suppressed at work. Jay's case suggests the capacity itself is structurally limited. If Strawson says Jay's wife should resent him, he commits to the idea that a flicker of moral capacity lights up the whole agent. If he says she should not, he admits that moral standing is relational, not intrinsic. Given Strawson's commitment to "ordinary adult interpersonal relationships" as a general category, he would likely bite the bullet and say Jay is liable. But this reveals a crack: Strawson's framework assumes a unified self that may not exist. If the self is modular, his binary of participant versus object collapses into a spectrum of partial participation that his taxonomy cannot map.

  **Conclusion**
  Ray shows that Strawson's framework is robust against metaphysical skepticism (determinism) but fragile against psychological complexity. Strawson prioritizes the integrity of the moral community over the psychological nuances of the individual agent. He would classify Ray as liable to preserve the demand for goodwill, even if that demand falls on deaf ears. This keeps the framework consistent but risks making the reactive attitudes descriptive of the *victim's* stance rather than the *agent's* status. If we can resent Ray even when he is incapable of caring in that context, resentment becomes less about holding someone to a shared demand and more about asserting our own standing. That might be a feature, not a bug, but it is a shift Strawson doesn't explicitly argue for. He wants reactive attitudes to be a conversation; Ray turns them into a monologue.
