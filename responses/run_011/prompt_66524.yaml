          *   *Claim 3:* "And the whole derivation has been formalized in higher-order logic and machine-checked. That's what settles it against Kant..." -> *Non-sequitur/Overreach.* Machine checking proves *validity*, not *soundness* or that Kant is wrong. Kant's objection is usually about the *concept* of existence, not the validity of the inference. If 'existence' is treated as a predicate in the logic, the logic allows the inference, but that doesn't mean Kant's philosophical objection is "settled." It just means Gödel formalized existence as a property (NE).
