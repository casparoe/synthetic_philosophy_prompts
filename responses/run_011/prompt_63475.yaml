  Here is the breakdown of Dev's decision rule, the prediction for the genetic test case, the verdict on Good's Theorem, and a splitter case to challenge him next month.

  ### 1. What Rule Is Dev Running?

  Dev is not running a single theorem; he is running a **Constrained Net Utility of Inquiry** model. It looks like standard Expected Utility Theory, but with specific "circuit breakers" that override calculation.

  Based on the eight cases, his algorithm has three layers:

  1.  **The Hard Constraints (Veto Conditions):** If any of these are true, the Value of Information (VoI) is immediately zero or negative. Do not test.
      *   **Competence:** You cannot process the information rationally (Case 5: Misreading).
      *   **Accessibility:** The information cannot reach the decision node in time (Case 8: Sedated).
      *   **Signaling Penalty:** The *act of inquiry* triggers an external penalty regardless of the result (Case 7: Landlord).
  2.  **The Ledger (Calculation):** If constraints are passed, sum the following:
      *   **(+) Instrumental Value:** Does this change a decision to a better outcome? (Case 1, 3).
      *   **(+) Intrinsic Value:** Is there utility in simply knowing (savoring)? (Case 4).
      *   **(-) Acquisition Cost:** Financial price of the test (Case 1, 4).
      *   **(-) Psychological Cost:** Anxiety, grief, or "cold feet" caused by the content (Case 3, 6).
  3.  **The Verdict:** Test if Ledger > 0.

  **Why this fits all 8 cases:**
