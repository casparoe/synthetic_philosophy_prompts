  ### 3. Recommendation for Revision

  To resolve the most tension with the least damage to your core metaphysics, you should revise **(2)**.

  Your metaphysical model (4) is the specific "working model" you wish to defend (the bell analogy). Your ethical grounding (2) is the import from Western reductionism that is clashing with it. In Buddhist Reductionism, karma tracks *causal* responsibility, not Parfitian *psychological connectedness*. Aligning (2) with (4) makes your system historically and logically consistent.

  **Revision:** Change (2) to: *"What grounds moral concern and desert is the **causal** continuity running along such a series..."* (Remove "and psychological").

  **Downstream Pressure:** This forces you to defend why we should care about a causally connected being with no psychological connection to us. You will need to lean heavily on **(5)** to debunk the intuition that "psychological connectedness is required for desert."

