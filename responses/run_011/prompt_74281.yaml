answer: |-
  You have identified a genuine gap in the vocabulary we typically use to discuss biography and film. There is no single, established concept that binds together the three observations you have made: the tolerance for factual invention, the intolerance for characterological inconsistency, and the asymmetry between virtuous and vicious distortions. While there are neighbouring ideas in law, ethics, and aesthetics, none of them capture the specific texture of the objections your students are raising.

  Since you require a term with sharp boundaries for your essay, I shall propose one. I call this concept **'dispositional fidelity'**.

  Below, I have laid out the neighbours to this idea to show why they are insufficient, defined the new term precisely, and mapped the edges you asked about regarding time, lineage, and moral direction.

  ### The Neighbouring Concepts

  To understand why 'dispositional fidelity' is necessary, we must first see why the existing tools do not fit.

  **1. Historical Accuracy**
  This is the concept you initially expected to encounter. It concerns *propositional truth*: did this event occur on this date? Did this person speak these words? Your observations prove that your audience distinguishes sharply between accuracy of event and accuracy of person. They accept fabricated events (the composite character) because the *disposition* of the character remains consistent with the real person's nature. They reject accurate events (the cruel scene) when the *disposition* implied feels false. Historical accuracy is therefore too narrow; it measures the record, not the portrait.

  **2. Verisimilitude**
  In aesthetics, verisimilitude refers to the appearance of being true or real. However, this is usually applied to fictional worlds. A dragon has verisimilitude if it behaves consistently within the logic of the film. When dealing with real people, the standard is not internal consistency but external correspondence to a known life. Verisimilitude is too broad; it asks 'could this happen?', whereas your students are asking 'would *he* do this?'.

  **3. Defamation and 'False Light'**
  In law, there are concepts such as defamation or placing someone in a 'false light'. These cover the situation where true facts are arranged to create a false impression. However, these are legal categories requiring proof of harm or malice. Your students are not suing the filmmakers; they are making an ethical and aesthetic judgement. Furthermore, legal definitions often hinge on factual falsity. Your second example—where true scenes create a false impression—sits uncomfortably in law but sits precisely at the centre of your students' objection. Legal terms are too litigious; you need an ethical-aesthetic term.

  **4. Dramatic License**
  As you noted, this names a permission rather than a boundary. It is the excuse given by the artist, not the criterion used by the audience to reject the work. It explains why the change was made, not why the change fails.

  ### The Proposed Concept: Dispositional Fidelity

  **Definition**
  **Dispositional fidelity** is the measure of how faithfully a dramatisation represents the underlying psychological traits, moral tendencies, and habitual behaviours of a real subject, independent of the factual accuracy of specific events.

  It distinguishes between **event truth** (what happened) and **character truth** (who they were). A work possesses high dispositional fidelity if a person who knew the subject would recognise their essence, even if the timeline is compressed or conversations are invented. It possesses low dispositional fidelity if every scene is documented fact, yet the arrangement implies a nature the subject did not possess.

  **Boundaries and Exclusions**
  To ensure this term does not swallow adjacent cases, we must mark where it stops.

  *   **It excludes general realism.** A film can be realistic in its lighting, dialogue, and setting (high verisimilitude) but still betray the subject's nature (low dispositional fidelity).
  *   **It excludes simple factual error.** If a film shows a scientist winning a prize in 1950 when he actually won it in 1951, this is a breach of historical accuracy, not dispositional fidelity, unless the date change alters our understanding of his character (e.g., making him seem precocious when he was not).
  *   **It excludes fictional characters.** You cannot breach dispositional fidelity with a purely invented character, as there is no prior disposition to be faithful to. You can only break internal consistency.

  ### The Edge Cases

  You asked specifically about the boundaries of this phenomenon regarding time, lineage, and moral direction. Here is how dispositional fidelity behaves at the margins.

  **1. The Decay of Memory (Time)**
  Does the pattern weaken when the person died centuries ago? Yes. Dispositional fidelity relies on a shared understanding of the subject's nature. When living memory vanishes, the 'disposition' becomes a matter of historical interpretation rather than personal recognition.
  For a figure like Newton or Cleopatra, there is no longer a stable 'true to them' that can be violated, only 'true to the records'. Objections shift from 'that is not what he was like' to 'that is not what the evidence suggests'. The moral outrage diminishes because there is no longer a psychological contract between the subject and the audience. The concept dissolves into historical debate.

  **2. The Custodial Shift (Descendants)**
  Does it change when the objectors are descendants? Yes, but the mechanism changes. When strangers object, they are usually making an epistemic claim: 'You have misunderstood him.' When descendants object, the claim often becomes custodial: 'You have damaged his legacy.'
  Descendants may tolerate breaches of dispositional fidelity if the outcome is favourable (the hagiography you noted), whereas strangers might reject it as dishonest. Conversely, descendants may object to unflattering truths that strangers accept as valid critique. Therefore, while the *concept* of dispositional fidelity remains, the *enforcement* of it becomes biased by kinship. The boundary blurs from truth to protection.

  **3. The Virtue-Vice Wrinkle (Moral Asymmetry)**
  Is the difference in reaction to virtuous vs. vicious invention part of the same phenomenon? Yes, it is integral. I would term this the **'Asymmetry of Dispositional Fidelity'**.
  We treat a person's character as having a 'baseline' truth. Invention that elevates the subject above their baseline (hagiography) is often forgiven as 'inspirational' or 'dramatically necessary' because it does not harm the subject's standing. Invention that lowers the subject below their baseline (character assassination) is punished severely because it violates a duty of respect to the dead.
  This is not a separate phenomenon; it is the moral weighting of the fidelity breach. A breach of dispositional fidelity is not neutral; it is judged by the direction of the error. Your students condemn the vice because it feels like a betrayal; they tolerate the virtue because it feels like a tribute. Both are judgements on how well the film honoured the person's essence.

  ### Conclusion for Your Essay

  In your writing, you might argue that we have traditionally obsessed over the **letter** of biography (the facts) while neglecting the **spirit** (the disposition). Your notebook reveals that audiences are smarter than critics give them credit for; they do not need a documentary, but they demand integrity of character.

  If you use the term 'dispositional fidelity', define it early as I have above: distinct from factual accuracy, concerned with psychological essence, and sensitive to the moral direction of invention. This will allow you to discuss the 'true about' versus 'true to' distinction without relying on a slogan. You can argue that a film can be factually wrong yet dispositionally faithful, or factually perfect yet dispositionally treacherous.

  This framework should serve you well in the competition. It demonstrates that you have not merely collected complaints, but identified the underlying principle governing them. Good luck with the essay.
