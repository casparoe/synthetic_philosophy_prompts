answer: |-
  # The Recurrence Threshold

  The ventilation ducts hummed with a low, bronchial rattle that vibrated in the fillings of my teeth. Down here, a kilometer beneath the crystalline host rock, the air was thick enough to taste, metallic and warm. Condensation beaded on the casing of the recurrence interferometer, threatening to short the contacts if I didn't wipe them every twenty minutes. I wiped them again.

  My task was statutory: produce an experiential impact statement for the proposed deep geological repository. I needed to estimate the quantity and valence of the event-qualia disturbed by excavation, by the emplacement of canisters, and by the thermal pulse the waste would impose on the surrounding rock for the better part of a million years.

  The interferometer screen flickered, green noise washing over the baseline. It did not measure pain directly; nothing could. It measured the signature correlated with recurrence. Where integration was sustained, differentiated, and recurrent, subjects arose. A brain qualified. A lump of granite usually did not. But the machine could tell me if a volume of matter hosted genuine subjects or merely a flux of extinguished micro-experiences.

  "Gallery Four is still drifting," said Vance. He stood behind me, arms crossed over the high-visibility vest that looked absurdly bright against the grey stone. He was the project's chief engineer, a competent, unromantic figure who viewed my profession as a regulatory hurdle akin to fire safety or seismic zoning.

  "The damp is affecting the sensitivity," I said, adjusting the gain. "And the temperature gradient at the face is steeper than the models predicted."

  "Kaelen said the same thing," Vance said. He nodded toward the clipboard tucked under my arm, where the previous assessor's report lay sealed in a plastic sleeve. "Six months ago. He stood exactly where you're standing. He put the device on that same patch of wall. And he concluded the host rock was a subject."

  I looked at the readout. The spikes were irregular. In a standard subject—a human, a dog, even a complex AI—the recurrence pattern was tight, a loop closing on itself thousands of times a second. Here, the intervals were vast. Seconds stretched into minutes.

  "Kaelen refused to sign," Vance continued, his voice flat. "He claimed the heat plume would violate the integrity of a subject that had been running since before there were animals. Then he went on medical leave. Nervous exhaustion, HR said. I need to know if that report is evidence, or evidence of breakdown."

  I wiped the lens again. "The theory says subjects require sustained integration. Rock doesn't sustain integration. It dissipates."

  "Constitutive panpsychism says interaction has intrinsic character," Vance recited, having clearly done his homework to argue me down. "Event-qualia. Each elementary interaction has a brief intrinsic character, extinguished at the moment the interaction completes. Nothing persists to remember it. Kaelen thought he found persistence where there was none."

  "Or he found a recurrence rate so slow it looks like inertia to us," I said. "If the loop closes once every decade, your thermal pulse doesn't kill it. It just... changes the channel. Permanently. Non-consensually."

  Vance kicked a loose stone. It skittered into the dark. "Here is the problem, Assessor. If nothing persists to remember the interaction, nothing persists to be made worse off across time. If I smash this rock, a billion event-qualia flare and extinguish. Some might be negative valence—compression, shear, heat. But no subject is ever harmed. No biography is interrupted. Badness requires a biographer. Without a subject to carry the burden of the experience across time, there is no victim. There is only physics."

  It was the standard prudential argument. Moral concern terminates at the subject. The flux is a metaphysical curiosity rather than a wrong.

  "And the counter-argument," I said, watching the green line jump. "Is that an enormous quantity of annihilated bad experiences amounts to a harm regardless of memory. If the universe contains more suffering in that second because of your excavation, you have increased the net negative value of reality. We are obliged to reduce the flux at whatever cost."

  "At whatever cost?" Vance laughed, a short, dry sound. "We're storing waste that will poison the surface biosphere for a hundred thousand years. You're talking about protecting the feelings of atomic collisions against the safety of actual people. Actual subjects."

  "I'm talking about the threshold," I said. "If Gallery Four is inert, build. If it's a slow subject, you can't put the canisters here. The heat would alter the character of an experience that has been running since before there were animals. You'd be torturing a geology."

  "Or you'd be warming a stone," Vance said. "Look at the machine. It's ambiguous. You said it yourself. The damp. The gradient. It could be noise."

  "It could be a heartbeat," I said.

  "It could be a glitch."

  I turned back to the interferometer. The bureaucracy of signatures and appendices waited for me back on the surface. Form 12-B: *Estimate of Quantity*. Form 12-C: *Estimate of Valence*. If I marked "Subject Present," the project stalled. Litigation would follow. The waste would stay above ground, leaking containment, risking the water table. If I marked "Flux Only," the excavation continued. The rock would be crushed, heated, vitrified.

  I thought about the event-qualia. The theory was precise: phenomenal character attaches to events of interaction. When the drill bit bit into the stone, the interaction had a character. If that character was negative, and it was extinguished immediately, did the wrongness vanish with it?

  Vance's position was clean. It protected the things that could sue us. It protected the things that could fear death. It drew a line around the integrated self and said, *nothing outside this circle matters morally.* It was efficient. It allowed the work to proceed.

  My position was messy. It suggested that the sum of moments mattered more than the continuity of the experiencer. It suggested that a million years of low-level frictional suffering in the rock matrix was a moral catastrophe equivalent to a war, simply because the quantity of negative qualia was high. It obliged us to reduce the flux at whatever cost. But what cost was too high? If stopping the repository meant surface contamination, was I trading rock-suffering for human-suffering? And humans were definitely subjects.

  "The reading is stabilizing," I said.

  The line on the screen had settled into a rhythm. A spike every forty-five seconds. Consistent. Differentiated.

  "Forty-five seconds," Vance said. "That's not a subject. That's thermal expansion contracting. It's physics."

  "It's within the margin for slow integration," I countered. "The instrument cannot report what any of it is like. It only tells me recurrence is happening."

  "Kaelen saw this," Vance said, stepping closer. The heat from his body was noticeable in the cool damp. "He saw this pattern. And he decided it was a person. Or close enough. And it broke him. Do you want to be the one who stops the containment because you think the mountain has a headache?"

  "I want to be the one who doesn't ignore a potential subject because it's inconvenient."

  "Potential," Vance stressed. "Ambiguous. Indirect measurement. You are weighing a hypothetical metaphysical wrong against a concrete engineering necessity. If you sign off as 'Subject,' you kill the project. If you sign off as 'Flux,' you risk being wrong about the rock. But if you're wrong about the rock, who knows? The rock won't tell us. It won't remember. It won't sue. It won't haunt us."

  "That's the point," I said. "It won't remember. That's why you think it's safe."

  "It is safe," Vance said. "Because moral concern terminates at the subject. If there is no subject, there is no moral patient. The flux is just energy. Don't confuse the map for the territory, Assessor. Kaelen confused them. He looked at the math and saw a soul. I look at the math and see stress tolerances."

  I looked at the clipboard. The previous assessor's report was heavy in my hand. Kaelen had written three hundred pages of phenomenological deduction. He had argued that the slowness of the recurrence was a feature, not a bug. That a consciousness spanning decades would perceive the thermal pulse not as heat, but as a sudden, violent shift in the nature of time itself.

  I looked at the interferometer. The spike came again. Forty-five seconds.

  If I marked it as a subject, I would be upholding the obligation to reduce the flux. I would be acknowledging that badness does not require a biographer. But I would be risking the safety of the surface subjects, the humans who would live with the waste if this repository failed.

  If I marked it as flux, I would be accepting Vance's logic. That prudential concern ends where integration fails. That the extinguished moments do not accumulate into a debt.

  The ventilation rattled. A drop of water fell from the ceiling and landed on the back of my neck, cold and sharp. An event-qualia of its own. Brief. Extinguished. Did it matter?

  " I need to calibrate the valence estimator," I said.

  "We don't have time for that," Vance said. "The shift change is in an hour. We need the sign-off to move the borers."

  "The form requires it."

  "The form requires a best estimate," Vance corrected. "You have the data. It's ambiguous. You have to make a call."

  He was right. The bureaucracy did not allow for 'Unknown.' It allowed for 'Subject' or 'Non-Subject.' It demanded a binary decision on a analog reality.

  I thought about Kaelen. Had he gone soft? Or had he seen something in the silence that Vance's engineering models filtered out as noise? If I signed as Vance wanted, and the rock was a subject, I was authorizing a torture that no one would ever witness. If I signed as Kaelen wanted, and the rock was inert, I was halting a critical safety project based on a ghost.

  Neither position was foolproof. Neither logic closed the loop.

  I took the stylus. The plastic felt slick in the humidity.

  "The recurrence is there," I said. "But the integration threshold is borderline. The instrument can't distinguish between slow subjectivity and complex thermal resonance."

  "So what do you write?" Vance asked.

  I looked at the box labeled *Experiential Status*.

  If I checked 'Subject,' I would be fired. Vance would appeal. The project would die in committee. The waste would stay above ground. Humans would be at risk.

  If I checked 'Flux,' the borers would move. The rock would be crushed. If it was a subject, it would be altered. If it was flux, nothing of moral weight would be lost.

  The crux stood firm: Does an enormous quantity of annihilated bad experiences amount to a harm when no subject is ever made worse off across time?

  I could not answer that. No instrument could.

  "I'm marking it as Non-Subject Flux," I said.

  Vance exhaled, a long release of tension. "Good. Rational."

  "With an appendix," I said, turning the page. "I'm citing the ambiguity. I'm noting the recurrence rate. I'm noting that the determination is based on the precedence of surface subject safety over subsurface phenomenological uncertainty."

  "That's not a valid ethical framework," Vance said, frowning.

  "It's the only one that lets me sign the page," I said.

  I wrote the code into the box. *NS-FLUX-04.* I signed my name. The ink dried slowly in the damp air.

  "You know Kaelen didn't stop there," Vance said, watching me pack the interferometer. "He wrote a letter to the board. Said we were murderers."

  "I'm not writing a letter," I said. I snapped the case shut. The click was loud in the tunnel. "I'm filing a report."

  "It's a compromise," Vance said. "It doesn't solve the problem."

  "No," I said. "It just moves the waste."

  I handed him the clipboard. He took it, glanced at the signature, and tucked it under his arm. He didn't look at the appendix. He didn't need to. The decision was made. The borers would come in the morning. The rock would be drilled. The heat would rise.

  Whether a mind was broken or a stone was warmed, the universe would not record the difference. I turned off the interferometer. The green line vanished. The tunnel was dark, save for the work lights, and the ventilation continued its bronchial rattle, breathing in the dark, indifferent to what it blew away.
