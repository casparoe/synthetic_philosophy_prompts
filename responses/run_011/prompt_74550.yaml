          *   **Rater Homogeneity (Implicit):** The standard model assumes a single global $R$. Variations among raters are treated as noise (logistic error term), not systematic divergence in values.
      *   *Commitments of Optimization:*
          *   Using $R$ as a loss function to maximize presupposes that maximizing this number maximizes "goodness."
      *   *Rival Views:*
          *   *Incomparability:* Excluded by the math (everything gets a number).
          *   *Value Pluralism:* Excluded by the math (single scalar).
