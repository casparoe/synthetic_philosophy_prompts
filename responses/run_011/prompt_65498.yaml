      *   *Q1 (Delegation):* Call it "Captured Process Supervision." It's not quite self-supervision because the FAA still existed, but they were asleep at the wheel. It's "Principal-Agent failure."
      *   *Q2 (Type Rating):* Yes, this is Goodhart's Law. "When a measure becomes a target, it ceases to be a good measure." The target was "no training." The measure of safety was compromised.
      *   *Theory Critique:* Highlight the "Sparse/Catastrophic Signal" problem. AI theory loves dense feedback. Aviation has zero-shot safety (you only get one try).
