answer: |-
  Here is the mapping of the 737 MAX disasters through the lens of AI supervision, followed by an analysis of where the analogy holds, where it breaks, and what it implies for the theory.

  ### The Map

  *   **The Supervised Agent:** Boeing's Engineering and Certification Team. (In AI terms, this is the model being trained/aligned).
  *   **The Supervisor:** The FAA (Federal Aviation Administration). (In AI terms, this is the reward model or the human overseer).
  *   **The Outcome:** A certified aircraft that meets safety regulations and, crucially, maintains a "common type rating" with previous 737 generations.
  *   **The Process:** The design choices (engine placement, MCAS architecture), the testing protocols (single-sensor reliance), and the documentation provided to regulators.

  ### 1. The Delegation Arrangement: Captured Process Supervision

  You asked if the Organization Designation Authorization (ODA)—where Boeing employees signed off on behalf of the FAA—is process supervision that turned into self-supervision, or something else.

  In AI terms, **process supervision** means evaluating the reasoning traces (the chain of thought) to ensure they are sound. **Self-supervision** usually implies the model generates its own training labels.

  The ODA arrangement is best read as **process supervision with a compromised verifier.** It is not pure self-supervision because the FAA technically retained authority; they could have audited. However, because the "grader" (FAA) relied on the "student" (Boeing) to write the exam questions and grade the answers due to resource constraints and regulatory capture, the signal became noise.

  In AI safety vocabulary, we might call this **"verifier collapse"** or **"alignment faking."** The agent (Boeing) learned that the supervisor (FAA) was not checking the *actual* safety process, but rather checking for *paperwork compliance*. The agent optimized for passing the audit, not for the underlying truth (safety).

  However, the AI vocabulary lacks a precise term for the **institutional incentive structure** that caused this. In AI, we assume the verifier is distinct and benevolent. In aviation, the verifier was underfunded and legally mandated to facilitate commerce. This isn't just a technical failure of supervision; it's a **Principal-Agent problem** where the Principal's (public safety) interests were decoupled from the Agent's (FAA/Boeing) operational incentives. The AI debate often treats the supervisor as an oracle; the MAX crashes show the supervisor is a bureaucratic entity subject to budget and political pressure.

  ### 2. The Common Type Rating: Outcome Supervision Causing Failure

  Your second point is the stronger analogy. The requirement that the MAX fly like the NG (Next Generation) 737 to avoid simulator training was an **outcome-level constraint.**

  *   **The Criterion:** "The handling characteristics must match the legacy airframe."
  *   **The Consequence:** To meet this outcome without redesigning the landing gear or airframe (which would trigger new training requirements), engineers added MCAS.
  *   **The Hazard:** To get MCAS certified without triggering the "new training" outcome, Boeing downplayed the system's power and redundancy in the manuals (hiding the process).

  This is a textbook case of **Goodhart's Law** applied to safety: "When a measure becomes a target, it ceases to be a good measure."

  In AI, if you reward a model solely for getting the right answer on a benchmark (outcome supervision), it may memorize the test set or hack the evaluator rather than learning the underlying concept. Boeing optimized for the "no new training" benchmark. The "hack" was MCAS: a software patch that masked the aerodynamic reality of the new engines to preserve the *appearance* of the old handling characteristics.

  So, yes: **Outcome supervision caused the failure.** The rigid adherence to a commercial/regulatory outcome (commonality) forced a process-level shortcut (single-sensor MCAS, limited documentation) that bypassed the safety checks that would have occurred if the design were treated as novel. The supervisor was looking for the outcome ("flies like a 737"), so the agent hid the process deviations required to achieve it.

  ### What This Episode Does to the Theory

  The 737 MAX case exposes a silent presupposition in the AI process-vs-outcome debate: **the assumption of cheap, reversible, and frequent outcome signals.**

  In AI alignment research (like RLHF), we assume we can run thousands of episodes. If the model fails, we update the weights. The cost of a bad outcome is a wrong text string or a glitched image. The signal is dense.

  Aviation operates in the **sparse, catastrophic regime.**
  1.  **Signal Frequency:** You cannot iterate on hull losses. The "training loop" for aviation safety is measured in decades, not epochs. A bad outcome is not a data point; it is a tragedy that grounds the fleet.
  2.  **Silence of the Theory:** The AI debate goes quiet here because it assumes you *can* choose between process and outcome supervision based on efficiency. In high-stakes engineering, **outcome supervision is functionally impossible** as a primary safety mechanism. You cannot wait for the crash to know the design is bad. You *must* rely on process supervision (rigorous design review, redundancy, testing).
  3.  **The Implication:** The MAX crashes suggest that when outcome signals are catastrophic, process supervision is not just an alternative; it is the *only* viable path. But as Question 1 showed, process supervision requires an independent, well-resourced verifier. The AI community debates how to supervise models; the aviation community demonstrates that **supervising the supervisors** is the actual bottleneck.

  The theory falls apart because it treats supervision as a technical hyperparameter. The MAX case shows supervision is a **political and economic resource.** If you don't fund the FAA to check the process, and you incentivize Boeing to hit the outcome, the system will fail regardless of the technical supervision framework.

  ### Where I Might Be Wrong (Changing My Mind)

  The piece of this mapping most likely to be wrong is the characterization of the **Engineers as the Agent.**

  In AI, the "model" is the thing optimizing the objective function. In the MAX case, was the engineering team optimizing for safety and constrained by management? Or was the *corporation* the agent, and the engineers were merely weights in the network?

  **What would change my verdict:**
  If evidence emerged that the single-sensor reliance for MCAS was an **industry-standard practice** at the time, rather than a cost-cutting measure specific to Boeing.

  Currently, the consensus is that redundancy is standard for critical flight systems, and Boeing deviated to save cost/weight to meet the "common type rating" outcome. If it turned out that single-sensor reliance for trim systems was accepted best practice across the industry (Airbus, Embraer, etc.) and the FAA simply failed to update the regulations for a new *class* of automation, then the failure shifts.

  It would move from "Outcome supervision caused process corruption" to **"Regulatory lag failed to categorize the risk."** That would mean the supervisor (FAA) didn't know *what* process to supervise because the technology (software-driven flight envelope protection) outpaced the regulatory framework. In that scenario, it's not that Boeing hid the process; it's that the process definitions themselves were obsolete. That would make the analogy less about "gaming the reward" and more about **"distributional shift"**—the model encountered a regime (high-authority automation) that the training data (old regulations) didn't cover.

  ### Summary

  The 737 MAX disasters validate the AI safety intuition that outcome supervision is dangerous when the outcome is a proxy for the true goal (safety vs. commonality). However, they also warn that process supervision is useless if the verifier is captured by the agent.

  The AI debate often assumes a clean room where we can tune the supervision style. The MAX case screams that **supervision is an institutional supply chain.** If you outsource the verification to the builder to save money, you have not chosen process supervision; you have chosen no supervision. And in a domain where outcomes are catastrophic, that is a fatal configuration.
