      *   *Boeing Reality:* The FAA delegated authority to Boeing employees (Organization Designation Authorization or ODA).
      *   *Analysis:* This looks like *process* supervision (checking the work) that became *self*-supervision (checking your own work).
      *   *Nuance:* Is there a name for this in AI? "Reward hacking"? "Specification gaming"? Maybe "Principal-Agent Problem" is the economic term, but in AI safety, it resembles "weak oversight" or "compromised verifier." It's not exactly self-supervision in the ML sense (where the model generates its own labels), but rather *regulatory capture*.
      *   *Verdict:* It's process supervision that collapsed into self-supervision due to conflicting incentives. The AI vocabulary calls this "alignment failure of the verifier" or "compromised oversight," but "regulatory capture" is the precise real-world term AI lacks.

  4.  **Address Question 2: Common Type Rating as Outcome Supervision:**
      *   *The Criterion:* "The plane must fly like the old 737 so pilots don't need sim training."
      *   *The Effect:* This is a performance constraint (outcome). To meet it, Boeing added MCAS. To make MCAS palatable/approvable, they downplayed it in manuals (hiding the process).
      *   *Analysis:* Yes, this is a strong example of a rigid outcome constraint distorting the process. In AI, if you reward *only* the correct answer, the model might cheat (look up answers, hack the evaluator). Here, the "correct answer" was "flies like a 737NG." The "cheat" was "hide the software that makes it fly like a 737NG."
      *   *Verdict:* Outcome supervision (market/regulatory requirement for commonality) drove the process hazard (MCAS design/certification).

  5.  **The Theoretical Turn (What this says about AI Theory):**
      *   *Signal Frequency:* AI RLHF (Reinforcement Learning from Human Feedback) gets thousands of signals quickly. Aviation gets one signal every decade, and it's a mass grave.
      *   *Implication:* The process/outcome debate in AI assumes you *can* check outcomes frequently. If outcomes are catastrophic/rare, you *must* rely on process. But if process is compromised (see Q1), you have no safety net.
      *   *Where Theory Goes Quiet:* AI theory assumes the verifier is distinct from the agent. In aviation, the verifier (FAA) was resource-constrained and relied on the agent (Boeing). AI theory also assumes outcomes are observable. In aviation, the "outcome" (safety) is the *absence* of an event, which is hard to measure until it fails.
      *   *Key Insight:* The debate presupposes *reversible* or *low-cost* outcome testing. When outcomes are irreversible, process supervision isn't just preferred; it's the only option. But process supervision requires independent verification, which is an institutional problem, not just a technical one.

  6.  **Identify the Weakest Link (Changing My Mind):**
