          1.  Is the FAA delegation scheme failed process supervision or something unnamed?
          2.  Did the "common type rating" outcome criterion cause the process hazard (outcome supervision causing failure)?
      *   **Theoretical Turn:** Analyze what this case says about the theory itself. Does the process/outcome debate presuppose cheap/fast outcome signals? Where does the theory go quiet?
      *   **Self-Correction/Epistemic Humility:** Identify which part of the mapping is most likely wrong and what would change the verdict.
      *   **Tone/Style:** American English, analytical, not forcing the fit, acknowledging limitations.

