  *(Self-Correction during drafting)*: I need to be careful not to equate the *plane* with the *AI model*. The plane is the deployment. The *design process* is the training run. The crashes are the test set failures. Actually, a better analogy: The *Engineering Team* is the model being supervised. The *FAA* is the reward model/supervisor. The *Plane* is the output.
  *Wait, let's refine:* In AI safety, we worry about the *model* behaving badly. Here, the *engineers* behaved badly (or were pressured to). The MCAS software is the "policy." The FAA is the "reward model."
  *Decision:* Stick to Engineers as Agent, FAA as Supervisor, Plane Design as Output. This fits the "process vs outcome" of certification best.

  *Re-evaluating Q1:* Is it self-supervision? In ML, self-supervision means the data generates the labels. Here, Boeing generated the compliance data for the FAA. That *is* effectively self-supervision of the compliance label. I will use that term but qualify it with "institutional."

  *Re-evaluating Q2:* The "common type rating" is a business outcome that became a technical constraint. This is exactly like optimizing for a benchmark score rather than general capability.

  *Theory Limit:* The "Black Swan" problem. AI safety assumes we can iterate. Aviation cannot iterate on dead bodies.

  *Change Mind:* If the single sensor reliance was industry standard (it wasn't, redundancy is standard). If that were true, it's not a process failure specific to MAX, but a systemic industry issue.

