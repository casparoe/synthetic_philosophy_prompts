      *(Refining the "Killer")*: The Margin for Error principle applied to gradual conditions is the specific weapon Williamson uses. So that's the killer for Luminosity. But for Externalism, the Killer is the Introspective Reliability requirement. I need to pick the one that eliminates the *most otherwise plausible accounts*. Usually, the Margin for Error principle is the one that forces the major revision in the landscape (killing traditional luminosity).

