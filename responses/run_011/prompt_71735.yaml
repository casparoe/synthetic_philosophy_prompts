      *   *The "Wall":* Did this falsify the pervasion? Yes, technically. The claim "All Cloudy Water implies Fish Kill" is false because there are cloudy springs that aren't warm and don't kill fish.
      *   *Repair:* Can we just add "Warm" to the Hetu? "Cloudy + Warm $\rightarrow$ Kill". Nyāya says *no*, not simply. The *hetu* must be a natural kind or a property inherently linked, not an ad hoc conjunction. But more importantly, the discovery of an *upadhi* invalidates the *current* inference. It shows the *hetu* is *anaikāntika* (inconclusive).
      *   *Answer:* It shows the pervasion claim *as stated* is false. The reason is "deviant" (*vyabhicārin*). You can't just rescue it by conjunction without establishing a new *vyāpti* for the conjunctive reason. The *upadhi* reveals the connection was accidental, not essential.

  3.  **Deconstruct Question 2: Rebutting vs. Undercutting Defeaters:**
      *   *Pollock's Distinction:*
          *   Rebutting: Evidence that the conclusion is false (e.g., "The fish didn't die").
          *   Undercutting: Evidence that the premise doesn't support the conclusion (e.g., "The light is red, making the object look red when it isn't").
      *   *Upadhi:* It attacks the *vyāpti* (the connection). It says "Your reason doesn't guarantee the conclusion."
      *   *Fit:* It is definitely undercutting. It doesn't say "No fish kill happened." It says "Cloudiness doesn't *make* fish die; warmth does."
      *   *Strain:* In contemporary epistemology, defeaters are often psychological or propositional states. In Nyāya, *upadhi* is an ontological feature of the world (a property) that *functions* as a logical defeater. Also, Nyāya is realist. The *upadhi* isn't just "attacking the license"; it's pointing to the *real* cause. It's an undercutting defeater that points toward a *better* inference (Warmth $\rightarrow$ Kill), whereas Pollockian undercutters often just leave you with nothing.
