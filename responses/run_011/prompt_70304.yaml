      *   *Side Study:* The side study inflicts candidate harm to test harm. This is paradoxical. The condition should be that the side study uses the least harmful method feasible to test the methods.
      *   *Ethical Frame:* The prompt asks me to take a position. I will argue for the Precautionary Principle because Expected Value requires numbers we don't have and commodifies uncertainty.
