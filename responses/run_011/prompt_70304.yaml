  TO: Animal Welfare Committee Members
  FROM: [Student Name], Student Representative
  DATE: [Date]
  SUBJECT: Pre-meeting considerations regarding Aquaculture Growth Trial Protocol

  Dear Colleagues,

  Ahead of Tuesday's review of the Pacific whiteleg shrimp protocol, I want to circulate my position on the jurisdictional, ethical, and procedural questions raised. My goal is to ensure we reach a decision that protects animal welfare without stifling necessary research, while maintaining the integrity of our committee's oversight.

  **Jurisdiction and Compliance**
  The PI argues that shrimp fall outside our policy scope, which covers vertebrates and cephalopods. Technically, this is correct under our current written policy. However, the state grant funding this work requires certification of humane treatment for "all research animals," and our university's research integrity statement applies humane standards universally. If we decline jurisdiction based on a policy definition that conflicts with our funding requirements and institutional values, we expose the university to compliance risk. We should voluntarily assert jurisdiction here. This is not about expanding bureaucracy, but about honoring the grant conditions we all rely on.

  **The Counting Loophole**
  Regarding the exemption for treatment groups under 200 animals: the PI has structured the tanks and feed arms to stay under this threshold. The exemption's rationale is that harm is assessed group by group. However, if we allow the "tank" or "feed arm" to define the group rather than the protocol, any large-scale trial could be exempted by artificial splitting. The unit of ethical review must be the protocol itself. The total number of animals subjected to the experimental conditions is 3,840, plus 160 for the side study. Counting per tank renders the threshold meaningless. We should treat the protocol total as the relevant count for review intensity.

  **Ethical Framework: Precaution vs. Expected Value**
  In our seminar, we debated whether to use expected-value reasoning (probability of sentience × number of animals) or a precautionary rule. I propose the committee adopt the precautionary principle. Expected-value calculations require assigning a specific probability to shrimp sentience (e.g., 0.2), which is scientifically speculative and morally precarious for a regulatory body. If we treat moral status as a discount factor, we risk normalizing harm based on uncertain data. Given the growing evidence regarding decapod nervous systems, the chance of sentience is non-negligible. Therefore, we should operate as if they are sentient for the purposes of welfare oversight. This does not ban the research, but it demands higher welfare standards.

  **The PI's Case and the Side Study**
  We must acknowledge the PI's strongest argument: blocking welfare research because welfare methods are unsettled is self-defeating. We need data on humane euthanasia for aquaculture to improve industry standards long-term. The side study inflicting candidate harm to test euthanasia methods is paradoxical but necessary. However, the fact that the side study is designed to test distress while potentially causing distress requires strict safeguards. We cannot approve a study designed to measure suffering if it maximizes that suffering in the process.

  **Recommendation and Conditions**
  I recommend we **take jurisdiction and approve with conditions**. This validates the research importance while closing the loopholes. My proposed conditions are:

  1.  **Counting Method:** Animals are counted per protocol (total 4,000), not per tank or feed arm. The exemption for groups under 200 does not apply to the protocol aggregate.
  2.  **Side Study Timing:** The euthanasia side study (n=160) must be completed and analyzed *before* the terminal endpoint of the main growth trial. If the side study indicates the ice slurry causes significant distress compared to anaesthesia, the main trial must switch methods for the remaining 3,840 animals.
  3.  **Induction Method:** For the side study, the "slow chilling" arm must have a strict humane endpoint if escape behaviors persist beyond a set time (e.g., 2 minutes), switching immediately to the chemical anaesthetic.
  4.  **Sign-off:** While the protocol may qualify for designated member review due to the splitting, the Chair and Attending Veterinarian must jointly sign off on the euthanasia method given the jurisdictional ambiguity.
  5.  **Humane Endpoints:** The protocol must define specific behavioral indicators of distress during the 14-week growth phase (e.g., lethargy, molting issues) that trigger removal, independent of the terminal endpoint.

  **Policy Gap**
  Finally, this protocol highlights a gap between our policy (vertebrates/cephalopods) and our funding/inegrity requirements. I move that we form a subcommittee to draft an addendum regarding decapods. Some other jurisdictions now explicitly include decapods under welfare law, though I should double-check the specific legislative status in our state before citing that in the meeting. We need a clear standard so future PIs know where they stand.

  This approach allows the aquaculture research to proceed—which benefits sustainability and potentially shrimp welfare—while ensuring we do not ignore the moral uncertainty surrounding these animals.

  Verdict: APPROVE WITH CONDITIONS
