      *   **Conflict:** PI argues shrimp are out of jurisdiction (policy covers vertebrates + cephalopods, not decapods). University integrity statement and state grant require "humane treatment of all research animals."
      *   **Loophole:** Policy exempts full review if no treatment group > 200 animals. PI split tanks/arms to stay under 200. Chair suspects gaming.
      *   **Ethical Debate:** Seminar classmates argue Expected Value (probability of sentience * n * severity) vs. Precautionary Principle (if non-negligible chance, treat as sentient). User wants to take a position on which frame the committee should use.
      *   **Task:** Draft a memo to circulate the night before the meeting.
      *   **Audience:** Committee members (scientists, vets, admins, student). Tone: Respectful, not lecturing, practical but principled.
      *   **Length:** 800–1,000 words.
      *   **Requirements:**
          *   Clear recommendation among (a), (b), (c).
          *   Concrete conditions if approved (who signs off, induction method, side study timing, humane endpoint, counting method).
          *   Address PI's strongest case (aquaculture welfare research needs to happen).
          *   Resolve the threshold-rule question (the 200 animal loophole).
          *   Paragraph on policy gap going forward.
          *   No bibliography/citations (reason from the case).
          *   If mentioning other jurisdictions, keep to one sentence and mark as "double-check."
          *   **Final Line:** Exactly "Verdict: [CHOICE]" (nothing after).

  2.  **Determine the Recommendation:**
      *   *Option (a) Decline Jurisdiction:* Weakens the committee's integrity regarding the university statement and grant requirements. Ignores the ethical uncertainty about sentience.
      *   *Option (b) Approve with Conditions:* Acknowledges jurisdiction, addresses the loopholes, ensures welfare without blocking the research entirely. Fits the "precautionary principle" better than expected value calculous for a committee setting.
      *   *Option (c) Return for Revision:* Might be too heavy-handed if the science is sound, but the counting loophole needs fixing.
      *   *Decision:* **Approve with Conditions.** This allows the research (addressing the PI's point about needing welfare data) but asserts oversight (addressing the jurisdiction and loophole issues). It adopts the Precautionary Principle as the operational frame because expected-value calculations are too speculative for regulatory approval.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
