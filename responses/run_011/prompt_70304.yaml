          *   Induction Method: The side study compares ice slurry vs. slow chill vs. anaesthetic. The main trial uses ice slurry. Condition: If side study shows ice slurry causes distress, main trial must switch mid-stream or justify continuation.
          *   Sign-off: Veterinary sign-off is required (as per exemption logic) but now with Committee oversight.
