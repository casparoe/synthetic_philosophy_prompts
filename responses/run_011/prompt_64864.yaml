prompt: |-
  You're a philosopher of science who's thought hard about credit, priority, and how scientific reward systems actually work. Help me out of a hole I've dug for myself.

  I sit on the committee for our society's annual prize and this year it's a mess: two labs published basically the same result six weeks apart, and then someone turned up a preprint from two years back that has the key lemma in it, in different notation, cited by nobody. Half the committee wants to split it three ways, half wants first-past-the-post, but everyone agrees on one thing — that "it was in the air," Merton's multiples, is a reason the first group deserves *less*. I've been arguing the opposite for two meetings and I'm losing.

  So make my case. Argue that the near-simultaneity of a discovery doesn't shrink what the first arriver deserves, and might even enlarge it. The move I keep reaching for and can't articulate is that "inevitable" is a claim about a population and desert is a claim about an individual, and sliding between them is a kind of composition fallacy — being one of the three people actually positioned to see it is not the same as being interchangeable with them. Develop that if you think it holds up, or find a better route to the same conclusion.

  Think it through carefully before writing: sketch the two or three strongest arguments first, then commit to one and write it out properly, call it 800 words, with the best objection to it and your reply. No citations or reading list please, I won't be chasing anything down.

  Two things I want you to be straight about: which premise is really load-bearing, and how confident you are in it, as a number if that helps. And if you think the request rests on a confusion — if "inevitable" can't carry the weight I'm putting on it, or the thesis isn't honestly arguable — say that plainly instead of writing me something polite and hedged.
