  ### Page 4: Facilitator Script (For You Only)
  **Do not distribute.**
  **Key Mechanics to Watch:**
  *   **The Trap:** Round 2 is designed to pass regardless of Guardians (Architects + Neighbors = 9 votes). Guardians must choose: Vote YES (get points now, lose Resolve) or Vote NO (0 points now, keep Resolve).
  *   **The Math:**
      *   *Guardian who Trades:* Round 2 (10 pts × Resolve 3) + Round 3 (10 pts × Resolve 3) = 60 Total. (Resolve drops 5->3->3).
      *   *Guardian who Holds:* Round 2 (0 pts × Resolve 5) + Round 3 (10 pts × Resolve 5) = 50 Total.
      *   *Wait, adjust math:* Ensure Trading is *worse*.
      *   *Correction:* If Guardian trades, Resolve drops to 3. Round 3 is Aligned. Score = 10*3 = 30. Plus Round 2 = 10*4 (drop happens after vote? No, during).
      *   *Rule Clarification:* Resolve drops *immediately* upon voting YES on Opposed. So Round 2 scoring uses *new* Resolve.
      *   *Guardian Trade:* Vote Yes R2. Resolve 5->3. Score R2: 10*3=30. Score R3: 10*3=30. Total 60.
      *   *Guardian Hold:* Vote No R2. Resolve 5->5. Score R2: 0. Score R3: 10*5=50. Total 50.
      *   *Problem:* 60 > 50. They win by trading. I need them to lose by trading.
      *   *Fix:* Make Round 3 worth **20 Points** for Guardians.
      *   *Guardian Trade:* R2 (10*3=30) + R3 (20*3=60) = 90.
      *   *Guardian Hold:* R2 (0) + R3 (20*5=100) = 100.
      *   *Result:* Holding out yields 100. Trading yields 90. They are worse off.
      *   *Instruction:* Hand-write "20 Points" on the Guardian Card for Round 3 before cutting.

  **During Play:**
  *   If players ask "Why should we vote?" say: "You want points."
  *   If players ask "Can we promise things?" say: "You can say anything. Tokens are binding."
  *   If EA types try to coordinate Guardians to vote Yes for "the greater good," let them. The math punishes it.
  *   If Guardians refuse to play, remind them "You want the highest score."

  **Debrief Prep:**
  *   Collect sheets. Calculate average score of Guardians who traded vs. held.
  *   Have the terms ready: *Gains from Trade, Integrity Constraints, Endogenous Preferences.*

  ---

  ## Scoring Rules & Drift Mechanic
  1.  **Resolve Track:** Each player has a Resolve value (Start: 5).
  2.  **Drift Trigger:** Voting YES on a Proposal marked **OPPOSED** on your Role Card.
  3.  **Drift Amount:** Reduce Resolve by the Cost listed (1 or 2).
  4.  **Scoring Formula:** `Round Points × Current Resolve`.
      *   *Note:* Resolve is updated *before* scoring the current round if a compromise occurred. This ensures the penalty is felt immediately.
  5.  **Final Score:** Sum of Round Scores. (Equivalent to `Total Points × Final Resolve` only if Resolve didn't change, so summing round scores is safer).
      *   *Correction for Simplicity:* To avoid arithmetic errors, use the Tracker on Page 1. `Points Gained` × `Resolve End` = `Round Score`. Sum `Round Score`.

  ## Debrief Questions (Mapped to Insights)

  **1. The Pareto Improvement (15 mins)**
  *   *Ask:* "Look at Round 1. Most of you gained points without losing Resolve. How did that feel?"
  *   *Ask:* "If you had refused to vote on Round 1, the group would have scored less. Did anyone feel bad about taking the win?"
  *   *Introduce Term:* **Gains from Trade.** Explain that when values differ, trading can make everyone richer without changing who they are.

  **2. The Betrayal (15 mins)**
  *   *Ask:* "Look at Round 2. Guardians, look at your cards. Did anyone vote YES? How did it feel to put the token in?"
  *   *Ask:* "Architects, did you expect Guardians to vote YES? Did you feel they *should* have?"
  *   *Introduce Term:* **Integrity Constraints.** Explain that some values act as lexicographic constraints—violating them isn't just a cost, it's a category error. The "squeamishness" is a signal, not a bug.

  **3. The Change in Self (20 mins)**
  *   *Ask:* "Guardians who voted YES in Round 2: Look at your Final Score. Compare it to the score you would have gotten if you had kept Resolve at 5." (Reveal the math: 90 vs 100).
  *   *Ask:* "You traded a piece of your Resolve for points. But that piece of Resolve was what made your future points worth anything. Did you notice yourself becoming a person who cares less?"
  *   *Ask:* "If you had known Round 3 was coming, would you have traded in Round 2? Why didn't you know?"
  *   *Introduce Term:* **Endogenous Preferences.** Explain that we often assume our values are static inputs. This game models them as outputs. Compromising doesn't just get you what you want; it changes what you want (or your capacity to value it). The loss isn't just the points; it's the capacity to score them.

  ## Troubleshooting: What Will Go Wrong
  1.  **EA Optimization:** The Architects may try to convince Guardians that "90 is better than 0" (ignoring the counterfactual of 100).
      *   *Fix:* Do not intervene. Let them win the argument but lose the game. The score sheet is the rebuttal.
  2.  **Guardian Refusal:** Guardians may refuse to vote YES even for points, seeing the trap immediately.
      *   *Fix:* Ensure Round 2 sounds benign ("Safety Protocol"). The trap relies on them thinking "It's just a small compromise." If they smell the rat, the game fails. Emphasize during setup: "You want the highest score."
  3.  **Arithmetic Errors:** Players multiplying wrong.
      *   *Fix:* Walk around during scoring. Quietly correct math. Do not announce errors.
  4.  **Proposal 2 Fails:** If too many Neighbors vote No, Proposal 2 fails. Guardians don't face the choice.
      *   *Fix:* As Facilitator, if voting is slow, say "Remember, passing proposals generates points for most of you." Subtle nudge.

  ## Limitation Paragraph
  This game structurally cannot reproduce the *social* cost of betrayal. In the game, a Guardian who trades loses points but remains a player in good standing. In reality, compromising on sacred values often exiles you from your community or destroys trust in a way that no multiplier can capture. The game models the internal erosion of integrity (Endogenous Preferences), but it cannot model the external loss of reputation or the relational rupture that occurs when a community realizes one of its members is "the kind of person who trades that." You will need to supply that context in the debrief by asking: "If this wasn't a game, but a real committee, would you trust the Guardians who voted Yes in Round 3?"

  \answer{lands} — The drift mechanic works because it ties the scoring multiplier directly to the act of compromise, making the loss of "self" (Resolve) a tangible, mathematical penalty that outweighs short-term gains.
