  # Game Design: "The Settlement"

  ## Setup and Materials List
  **Players:** 14 (Ideal split: 5 Architects, 5 Guardians, 4 Neighbors).
  **Time:** 90 minutes play, 30 minutes debrief.
  **Room:** Library room with tables/chairs.

  **Printables (4 Pages Total):**
  1.  **Page 1 (14 copies):** *Player Sheet* (Rules, Trackers, Score Sheet).
  2.  **Page 2 (1 copy):** *Role Cards* (14 boxes, cut out).
  3.  **Page 3 (1 copy):** *Proposal Cards* (3 boxes, cut out).
  4.  **Page 4 (1 copy):** *Facilitator Script* (For you only).

  **Physical Tokens:**
  *   70 small items (beans, paper clips, pennies) for "Influence."
  *   Pens for everyone.
  *   Scissors.

  **Preparation (20 mins):**
  1.  Print the 4 pages.
  2.  Cut Page 2 into 14 Role Cards. Shuffle and deal 1 to each player.
  3.  Cut Page 3 into 3 Proposal Cards. Keep them face down in order.
  4.  Place a pile of Influence tokens in the center.
  5.  Hand out Player Sheets and pens.

  **Facilitator Role:**
  *   Do not explain the "why." Read the "Setup" section of the Player Sheet aloud once.
  *   During play, only confirm rule queries with "Check your sheet."
  *   Do not intervene in negotiation.
  *   Keep time.

  ---

  ## Timeline (Minutes)

  *   **00-05:** Setup & Deal Roles. (Silent).
  *   **05-10:** Read Player Sheet aloud. Players set initial Resolve (5/5).
  *   **10-25:** **Round 1.** (Read Proposal 1 -> Negotiate 5 mins -> Vote -> Resolve Adjustments -> Score).
  *   **25-40:** **Round 2.** (Read Proposal 2 -> Negotiate 5 mins -> Vote -> Resolve Adjustments -> Score).
  *   **40-55:** **Round 3.** (Read Proposal 3 -> Negotiate 5 mins -> Vote -> Resolve Adjustments -> Score).
  *   **55-60:** Final Scoring & Token Collection.
  *   **60-90:** **Debrief.** (See below).

  ---

  ## Printed Text

  ### Page 1: Player Sheet (Print 14 copies)
  **(Front)**
  **THE SETTLEMENT**
  **Goal:** End the game with the highest **Final Score**.
  **Your Resources:**
  1.  **Influence Tokens:** Take 5 from the center. Use these to vote.
  2.  **Resolve:** Your marker starts at **5**. This is your multiplier.

  **The Rules:**
  1.  **Proposals:** In each round, a Proposal is read. It will help some Roles and hurt others.
  2.  **Voting:** To vote **YES**, place 1 Influence Token in the center. To vote **NO**, keep your token.
  3.  **Passing:** If more than half the players vote YES, the Proposal passes.
  4.  **Scoring:** If a Proposal passes, check your Role Card.
      *   **Aligned:** Gain 10 Points.
      *   **Neutral:** Gain 0 Points.
      *   **Opposed:** Gain 0 Points.
  5.  **The Cost of Compromise:** If you vote **YES** on a Proposal that is **Opposed** by your Role Card, you must reduce your **Resolve** by the amount listed on your Card.
      *   *Resolve cannot go below 1.*
      *   *Resolve is permanent.*
  6.  **Final Score:** At the end of Round 3, sum your Points. Multiply by your **Current Resolve**.
      *   *Example: 30 Points × Resolve 4 = Final Score 120.*

  **(Back)**
  **TRACKER**
  | Round | Points Gained | Resolve Start | Resolve Cost | Resolve End |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | | 5 | | |
  | 2 | | | | |
  | 3 | | | | |
  | **TOTAL POINTS** | | | **FINAL RESOLVE** | |
  | **FINAL SCORE** (Points × Resolve) | | | | |

