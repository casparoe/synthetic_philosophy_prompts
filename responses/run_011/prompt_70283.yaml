  This is not consequentialism with guilt bolted on, because consequentialism asserts the rightness of the act dissolves the wrongness of the means, whereas I insist the wrongness remains ontologically real despite the necessity. The guilt is not a psychological addendum but a recognition that a fundamental moral boundary has been crossed, which is why the official must be willing to face judgment or resignation even after saving the city. What would count against my position is an official who claims necessity yet feels no moral residue, for that indicates they have ceased to view the victims as ends in themselves. The stain confirms the humanity of the agent; without it, the calculation is merely technocratic murder justified by spreadsheets, and that is the true atrocity we must guard against.
