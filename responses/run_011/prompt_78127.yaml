  We evaluated freezing and carbon dioxide displacement. Freezing showed delayed immobility, with specimens entering torpor before cessation of movement. Carbon dioxide results were inconclusive regarding onset time. Regarding the limitations of our methodology: knockdown is not death; immobility is not absence of sensation. The metrics recorded—seconds to stillness, reflex arcs, noise—cannot distinguish a rapid death from a slow one, or a reflex from an experience. Whether insects feel anything rather than merely react is genuinely unresolved. Freezing and carbon dioxide are contested. Consequently, the Kindness Score reflects only the observer's comfort, not the subject's state. Any per-fly verdict is multiplied by an enormous number of flies, scaling the uncertainty exponentially.

  **The Release Method**
  For users opting out of lethal measures, the cup-and-index-card method remains the standard. We tested capture success rates across five surface types. While TTI is irrelevant, stress indicators such as wing vibration increased during containment. Transfer success was 88%. However, release does not guarantee survival outside the controlled environment. This method scores highest on moral ambiguity but lowest on infestation resolution. Homeowners should weigh the immediate kindness against the probability of external predation or exposure. Ultimately, the choice depends on whether the goal is removal or cessation.
