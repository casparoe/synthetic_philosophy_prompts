answer: |-
  ### Diagnosis: The Toolkit vs. The Ontology

  Your audience's toolkit is built on **variable realism**. They assume that if a factor matters, it can be represented as a node $X$ with states $\{0, 1\}$. In their framework, $X=0$ is ontologically identical to $X=1$; both are just values in a domain. This is the friction point. Metaphysically, an "absence" is not a state of a thing; it is the non-existence of an event. Their models treat "no treatment" as a state of the variable *Treatment*. Metaphysics asks whether *Treatment* is a variable that exists independently of our decision to model it.

  **What will fight you:** Their operational success. Their models predict outcomes and guide interventions effectively. They will argue that if the model works, the metaphysics is settled. You must separate *predictive utility* from *causal truth*.
  **What you can recruit:** Their understanding of **model specification**. They know choosing nodes is an art, not just a data discovery process. This is the seam. The choice of which absences to reify as variables is where the metaphysics hides.
  **The Honest Seam:** The distinction between *counterfactual dependence* (a logical relation between propositions) and *causation* (a physical or normative relation between events). Their training collapses these. You must pry them apart.

  ### The Running Example: Replace Your Draft

  **Verdict:** Your drafted incident review is **unsafe**.
  **Reason:** It invites "Root Cause Analysis" (RCA). In an engineering context, there *is* a correct set of absences to fix (the ones that prevent recurrence). If they treat the session as an RCA exercise, they will validate their own view: "The cause is the absence we can fix." This confirms their bias that causation is just "actionable dependence." It lets them stay in engineering mode.

  **Replacement:** **The Fatal Allergy Case.**
  *   **Scenario:** A patient dies of anaphylaxis in a clinic.
  *   **Facts:** The patient had a known allergy. The epinephrine auto-injector was in the building but not administered in time.
  *   **Variants:**
      1.  The assigned nurse was on a break (Absence of Nurse).
      2.  The clinic did not stock epinephrine (Absence of Stock).
      3.  The pharmaceutical company did not overnight a replacement (Absence of Vendor Action).
      4.  The Queen of England did not fly in with a cure (Absence of Royal Intervention).
  *   **Why this works:** It is within their domain (health) but removes the "system fix" pressure. Everyone agrees the patient's death counterfactually depends on all four absences (if the Queen had come, the patient would live). But only some are "causes." This forces the distinction between *dependence* and *causation* without triggering "how do we fix the alert system?" thinking.

  ### The Pedagogical Sequence (90 Minutes)

  You must follow this order. If you swap Step 2 and 3, the session collapses into a debate about "context" before they realize context is not in the math.

  #### 1. Formalize the Intuition (0–20 mins)
  *   **Action:** Draw the DAG for the "Assigned Nurse" variant. Node $N$ (Nurse Administers) $\to$ Node $D$ (Death).
  *   **Move:** Ask them to code the actual world. $N=0$, $D=1$.
  *   **Question:** "In your model, does $N=0$ cause $D=1$?"
  *   **Expected Answer:** "Yes, the Average Treatment Effect of the Nurse is significant."
  *   **Goal:** Lock them into their standard interpretation. Establish that their math treats $N=0$ as a standard causal driver.
  *   **Load-Bearing:** You must get them to explicitly affirm that their model identifies the absence as a cause *mathematically*. Do not let them hedge with "it depends on the question."

  #### 2. The Proliferation Attack (20–50 mins)
  *   **Action:** Add the "Queen of England" node ($Q$) to the whiteboard. $Q \to D$.
  *   **Move:** Point out that counterfactually, if $Q=1$, $D=0$. The math is identical to the Nurse node.
  *   **Question:** "If you add $Q$ to the DAG, does the Queen cause the death? If you don't add her, does she not cause the death?"
  *   **The Trap:** If they say "Don't add her," ask why. Is it because she isn't a *cause*, or because she isn't *relevant*?
  *   **Critical Pivot:** This is where you break the equation **Dependence = Causation**.
      *   If Dependence = Causation, the Queen is a cause (because the dependence holds).
      *   If the Queen is not a cause (intuitively), then Dependence $\neq$ Causation.
  *   **Goal:** Force the concession that their counterfactual definition captures *more* than what we ordinarily call "causation." The model captures dependence; it does not capture causation without external input.

  #### 3. Expose the Fix: Normativity, Not Math (50–75 mins)
  *   **Action:** Address the "Lewis/Salience" objection before they fully articulate it.
  *   **Move:** They will argue: "We don't model the Queen because she's not salient/contextually relevant."
  *   **Rebuttal:** "Salience is not a variable in your DAG. It is a judgment *you* make before drawing the graph."
  *   **Key Insight:** The DAG does not filter causes; the *modeler* filters variables. Therefore, the distinction between "cause" and "background condition" is not in the data, nor in the structure, nor in the counterfactuals. It is a **normative** judgment about duty or expectation (The Nurse *should* have been there; the Queen *need not* have been).
  *   **Goal:** Show that coding $X=0$ is not a neutral measurement. It is an assertion that $X$ was *expected* to be 1.

  #### 4. The Commitment: Coding as Assertion (75–90 mins)
  *   **Action:** Return to the control arm ($T=0$).
  *   **Move:** Ask what they commit to when they label a column "Treatment" and fill it with zeros.
  *   **Conclusion:** They are not just recording "nothing happened." They are recording "nothing happened *relative to a norm where something was expected*."
  *   **Goal:** Shift their view of data entry from descriptive to normative.

  ### Misconception Mapping

  | Misconception | When it Arises | How to Head It Off (Pre-emptive Strike) |
  | :--- | :--- | :--- |
  | **"Absence is just 0."** | Step 1 (Formalize) | Do not accept "it's just a value." Ask: "Does 0 represent a state of the world, or the lack of a state?" Force them to see 0 is heterogeneous (silence vs. sound). |
  | **"The Graph Settles It."** | Step 2 (Proliferation) | When they say "We wouldn't include the Queen," reply: "So the causation depends on your drawing hand, not the world?" Make the ontology dependent on the modeler. |
  | **"Lewis Already Solved This."** | Step 3 (Normativity) | They will claim context selects the cause. You must say: "Context is not in the do-operator. If causation relies on context, it is not purely structural." |
  | **"It's Just Verbal."** | Step 3 (Normativity) | They will say "Call it what you want, the prediction is the same." Reply: "If you are building models to assign liability or mechanism, 'verbal' distinctions determine your node selection." |

  ### What to Refuse to Cover

  You must explicitly announce two refusals to prevent the session from drifting into "solving" the problem.

  1.  **Refusal of a New Formalism:** "I am not going to give you a new operator or a better DAG convention that solves this. There isn't one. This is not a bug in your code; it is a feature of the concept."
      *   *Why:* If you offer a fix, they will treat it as an engineering patch. The point is that the tension is permanent.
  2.  **Refusal of Process Theory:** "We will not discuss physical mechanisms or energy transfer (Salmon/Dowe) as an alternative."
      *   *Why:* It distracts. They work with data, not physics. Bringing in "physical processes" lets them dismiss the problem as "philosophers worrying about things that aren't variables." Keep it focused on *variables*.

  **How to say it:** "I am not here to sell you a solution. If I offered you a mathematical fix, I would be lying. This is a constraint on what causal models can tell you about reality. We are mapping the boundary, not crossing it."

  ### The Closing Question

  Do not ask "Do you agree?" Ask a question that forces them to apply the normative insight to their actual work.

  **"When you code the control arm as zero, are you measuring a state of the patient, or are you asserting a duty of the provider?"**

  *   **Why this works:** If they say "measuring a state," they ignore the normative selection of variables (The Queen problem). If they say "asserting a duty," they admit their models contain non-empirical judgments. Either answer reveals the metaphysical commitment they thought was purely statistical.

  ### Pushback on Your Assumptions

  You wrote: *"I am assuming I cannot get to the proliferation of absent causes until they have conceded that counterfactual dependence and causation are not obviously the same relation."*

  **You are correct.** This is the load-bearing wall. If they believe Dependence = Causation, proliferation is not a problem; it's just truth. The Queen *does* cause the death in that framework. You must break this identity in Step 2. If you try to discuss proliferation before breaking that identity, they will simply say "Yes, the Queen is a cause, so what?" and you will lose the room.

  You also asked if your drafted example lets them slide. **It does.** The Incident Review is a "fix-it" context. In that context, the Queen *is* irrelevant because she isn't actionable. They will conflate "Cause" with "Actionable Root Cause." The Medical Fatality case removes the "Actionable" lever, leaving only the "Causal" judgment exposed. Use the Medical case.

  ### Final Warning

  If you find them retreating into "Pragmatism" (i.e., "It doesn't matter what causes are, only what works"), do not fight it. Accept it, but reframe it: "If causation is pragmatic, then your models are not maps of reality, they are maps of *interventions we care about*. That is a metaphysical claim about the nature of your models." Force them to own the pragmatism as a philosophical stance, not a default setting.
