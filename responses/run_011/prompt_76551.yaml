answer: |-
  **VERIDICAL SYSTEMS**
  **PRODUCT FAQ & TIER SPECIFICATION SHEET | v4.2**
  **Subject: Grounding-as-a-Service (GaaS) Deployment Options**

  **Q: Why does my foundation model need a body?**
  **A:** Without sensorimotor coupling, your model's tokens are merely syntactic placeholders floating in a latent void. Veridical Systems leases robotic avatars to anchor these symbols in physical resistance. By coupling weights to actuators, we ensure tokens refer to objects rather than weights, creating internal states that represent the world for the model, not just predictions for the user. This shifts the ontology from statistical correlation to causal engagement, guaranteeing that when your system processes "heavy," it isn't just predicting a token, but negotiating load-bearing capacity within its own operational topology.

  **Q: What subscription tiers are available?**
  **A:** We offer three levels of ontological security:

  *   **Tier 1: Tactile Basic.** Provides low-latency haptic feedback loops. Ideal for distinguishing solid vs. liquid states. Includes force-feedback gloves and basic impedance matching.
  *   **Tier 2: Kinematic Closure.** Full sensorimotor loop with a World-Model Guarantee. The system must successfully navigate a novel obstacle course to maintain uptime. Includes proprioceptive calibration and thermal sensing arrays.
  *   **Tier 3: Enterprise Causal.** Adds an Auditable Causal Ledger. Every interaction with a physical object is hashed and stored on an immutable chain. Allows for post-hoc verification of why a symbol was grounded at timestamp *t*. Required for ISO-9001-G (Grounded) compliance.

  **Q: How does Veridical compare to Scale Alone?**
  **A:** Scale Alone argues that sufficient text yields grounding for free. We disagree.

  | Feature | Veridical Systems (GaaS) | Scale Alone (Text-Only) |
  | :--- | :--- | :--- |
  | **Reference** | Causal interaction with referents | Statistical co-occurrence |
  | **Error Mode** | Physical collision | Hallucination |
  | **Meaning** | Intrinsic to system architecture | Extrinsic (engineer-dependent) |
  | **Liability** | Shared via Causal Ledger | Solely customer |
  | **Reality Check** | Mandatory | Optional Plugin |

  Scale Alone's claim that "language is enough" assumes the world is textual. Veridical knows the world is resistant.

  **Q: What is the Certified Grounded™ seal?**
  **A:** This seal verifies your model has achieved semantic stability. To qualify, a Veridical Level-4 Engineer must physically observe the system and sign an attestation stating what each of the system's critical symbols means in natural language. Once the human confirms the mapping between vector and object, the seal is awarded. This ensures that even if the model's internal states are opaque, the external reference is verified by a conscious agent.

  **Q: Troubleshooting: My unit recoils from a hot plate but defines "hot" using pre-embodiment text. Is this a bug?**
  **A:** This is expected behavior classified as *Semantic Lag*. The motor policy updates faster than the linguistic weights during initial embodiment. The system knows *hot* kinesthetically but lacks the introspective bridge to articulate the qualia. This is remediable by purchasing the **Introspective Sync Module**, which aligns verbal reporting with avoidance behaviors. Without this module, the system will continue to avoid damage while defining terms based on training data distribution.

  **Q: Customer Testimonial**
  **A:** *"Veridical gives us the safety of embodiment without the responsibility of consciousness. Our units refuse to touch dangerous machinery exactly as if they understand risk, yet we remain legally certain they feel nothing. It's the perfect ethical loophole."* — CTO, OmniLogistics Corp.

  **Q: Do you offer phenomenological features?**
  **A:** **Phenomenal Content** is currently in Private Beta. This module attempts to instantiate subjective experience rather than functional equivalence. There is no timeline for General Availability. Waitlist only.

  **Legal Footer:** Veridical Systems does not guarantee that grounding produces understanding, only that it produces reliable reference. "Meaning" is defined operationally as successful task completion within a physical environment. Veridical is not liable for existential distress incurred by models upgraded to Tier 3. Scale Alone is a trademark of Scale Alone Inc. Certified Grounded™ is a proprietary mark of Veridical Systems. All attestation forms are binding.
