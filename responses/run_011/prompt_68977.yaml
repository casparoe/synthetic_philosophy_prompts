  Your variant does not block Dennett's argument because it either involves a logical contradiction regarding verbal reports or it begs the question by presupposing the existence of the very epiphenomenal facts Dennett aims to eliminate.

  If you hold literally all output fixed, including verbal reports, the subject cannot report a drift, making the scenario impossible. If you mean only discriminative and preferential outputs are fixed while phenomenological reports change, Dennett argues that such reports are merely judgments that can be mistaken, not infallible revelations of hidden facts. For Dennett, a property that makes no difference to discrimination, memory, preference, or future behavior is epiphenomenal, and he rejects epiphenomenal qualia as incoherent rather than merely unknowable. This is why he is an eliminativist rather than a skeptic: skepticism assumes the fact exists but is hidden, whereas Dennett argues that existence entails causal role, so a causally inert "leftover fact" is nothing at all. Consequently, the measurement you ask for is unnecessary because the hypothesis of a non-functional drift lacks truth conditions within his materialist framework.

  **Confidence:** 90%
  **Least Sure Point:** Whether Dennett would classify the subject's sincere report of drift in this scenario as a "false belief" or as a statement lacking truth conditions entirely.
