prompt: |-
  You are an expert on functionalism and multiple realizability. Think the case through carefully, weighing how it could be read either way, before committing to a line of argument — but your reply should contain only the numbered points requested at the end, with no preamble about your reasoning. I am a PhD student in philosophy of mind drafting a paper, and I want you to press a claim I think is underexplored.

  Consider a stipulated case I will call the Gradient Zoo. An engineering programme has built a finite series of synthetic nociceptive systems, S1 through S1000. Each plays the causal role definitive of pain in its host — damage detection, aversive conditioning, withdrawal, distress signalling, reallocation of resources toward repair — and each is realized on a physically different substrate. But the series proceeds by single small substitutions: S2 differs from S1 only in that one component is replaced by a chemically different but functionally interchangeable analogue, S3 differs from S2 in the same manner, and so on, until S1000 shares no components with S1. At no member is the role instantiated better or worse than at its immediate neighbour.

  Argue that the Gradient Zoo undercuts the anti-reductionist use of multiple realizability rather than vindicating it. Specifically: if the realizer-kinds in a case like this can be individuated only by drawing a line somewhere along a series where no principled line exists, then the notion of a distinct realizer-kind is too interest-relative and unstable to carry the weight the standard argument places on it, and sheer multiplicity of realizations does not by itself show that the higher-level kind is irreducible or explanatorily autonomous. Do not rest the argument on the mental property itself being vague; grant that it is sharp, at every member, that the role is instantiated, and locate the instability entirely in the taxonomy of realizers.

  Deliver exactly five numbered points, each one or two sentences, with no introduction and no conclusion. Make the fifth point the strongest objection to your argument — one that concedes the taxonomy is interest-relative yet still recovers an anti-reductionist conclusion — together with your reply to it.
