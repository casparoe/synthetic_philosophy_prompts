answer: |-
  1. Standard anti-reductionist arguments depend on the premise that realizers fall into genuinely distinct natural kinds rather than forming a continuous physical spectrum. The Gradient Zoo demonstrates that physical realizers can vary continuously while maintaining functional identity, rendering any segmentation into distinct kinds inherently arbitrary.
  2. If the boundary between realizer kinds is drawn merely for pragmatic convenience along a smooth gradient, then the heterogeneity required to block reduction is not ontologically robust. Consequently, the claim that pain is irreducible because it is realized by distinct kinds collapses into a claim about our descriptive interests rather than metaphysical necessity.
  3. Without principled boundaries between realizer types, a reductionist can propose a disjunctive physical kind that covers the entire series without violating causal homogeneity. The instability of the realizer taxonomy thus fails to establish the explanatory autonomy required to defend non-reductive physicalism against local reductionist strategies.
  4. This implies that sheer multiplicity of physical configurations does not guarantee irreducibility if those configurations can be unified under a broad, continuous physical description. The anti-reductionist loses the leverage provided by multiple realizability because the "multiple" realizers do not constitute a fragmented ontology demanding separate explanations.
  5. One might object that functional projectibility preserves explanatory autonomy even if physical taxonomy is interest-relative, securing the anti-reductionist conclusion. Yet this fails because if the physical base is continuous, the functional kind's projectibility indicates it tracks a unified physical property, thereby collapsing the distinction between functional autonomy and reducibility.
