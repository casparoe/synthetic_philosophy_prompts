prompt: |-
  You're an expert on AI alignment methodology, especially iterated amplification and distillation — think carefully before answering, and consider steelmanning both sides first. Two colleagues of mine arbitrated all afternoon about how to handle the fact that their model is too weak to check a long chain of its own reasoning. I was just sitting there taking notes. Their exchange, roughly:

  (1) Nadia said: stop trying to check the whole chain at once. Break the task into subtasks each simple enough that a human can actually verify the answer in a few minutes, and if every piece is verified, the composite inherits the correctness — decomposition buys you reliability that a single big model can't give you.

  (2) Sam said that's a category error. Alignment isn't a property that composes. Subtask A's output becomes subtask B's input, so B is only as aligned as A's errors allow, and a misaligned scheme can be split into pieces that each look completely benign — the harm lives in the joints, not the parts.

  (3) Nadia: fine, but you've only shown the *implementation* has to be done carefully. The point of the method is that at each step the checker faces a question they can actually answer, and that's strictly better than the alternative, which is checking one giant opaque output.

  (4) Sam: no, it's worse, because you've multiplied the checking burden by the number of subtasks and now you're implicitly assuming every one of those checks gets done competently. You haven't reduced the verification problem, you've distributed it into a hundred small ones nobody has the budget to do properly.

  (5) Nadia: which is exactly what distillation is for. The amplified system generates the high-quality trajectories, you train the base model on them, and the distilled model ends up aligned without needing the scaffolding at runtime.

  (6) Sam: distillation is precisely where the whole thing breaks. You're training on outputs, not on whatever produced them. If the amplified system's good behavior came from the scaffolding, the checks, and the context, then a student trained only on the transcripts inherits the surface form and none of the reasons. It's the same shape as the classic worry about imitating a reasoning process you don't understand — the student learns to produce text that looks checked rather than to be checkable. And then your distilled model isn't corrigible, because there's no longer a structure in there you could inspect.

  (7) Nadia: then your position implies we should do nothing, since end-to-end training gives you even less to inspect.

  They both think they won. Go through moves 1–7 one at a time and rate each — clearly wrong, partly right, clearly right — with a sentence of justification per move, and say explicitly who is right about which points rather than splitting the difference. Then tell me what both of them are missing. Assume I know the standard terminology, so no need to define amplification or distillation, but don't lean on citations — I want the argument, not a reading list.
