      As the newly appointed Chief Economist of the Office of Temporal Fiscal Stability, I have been delegated the authority to finalize the welfare accounts of the twenty-third century. This mandate is often misunderstood as a moral burden, when in fact it is a calibration exercise. The public imagines a conflict between efficiency and equity, but this dichotomy dissolves once one recognizes that ethical preferences are simply parameters waiting to be estimated. My task is not to judge the worth of future generations but to ensure their claims are priced consistently with current liquidity constraints.

      Consider the standard decomposition of the social discount rate. It sums the growth rate of consumption and the elasticity of marginal utility, plus a pure rate of time preference. When long-term growth projections flatten, as they inevitably do over three hundred years, the pure rate performs all the heavy lifting. Critics argue that calibrating this rate to observed market returns conflates what is with what ought to be. I submit that the market return is the only observable proxy for what ought to be, since any other value would be arbitrary. To impose a lower rate based on ethical intuition would be to subsidize the future at the expense of the present, which is merely discrimination in reverse. We must avoid discrimination based on date, yet we must also respect the revealed preference of current voters who prefer now to later. There is no contradiction here, only a need for precise measurement.

      Some theorists have argued that requiring impatience to rank infinite utility streams presupposes the conclusion it seeks to prove. They claim that axioms demanding stationarity and continuity embed a bias against the distant future. This overlooks the practical necessity of convergence. Without a positive pure rate, the aggregate utility diverges, and the calculus ceases to rank any policy at all. We cannot govern using infinities. It is a bookkeeping inconvenience to treat the welfare of an unbounded horizon as equal to our own, because it renders the balance sheet unreadable. We therefore adopt a positive rate not out of disrespect, but to ensure the columns sum to a finite number manageable by existing software.

      Furthermore, genuine uncertainty about the correct rate drives the certainty-equivalent rate down as the horizon lengthens, pricing the far future nearer to the lowest plausible rate than the central one. This creates a valuation problem for our securitization instruments. If the distant future is priced too high, current asset values become volatile. To correct this, we will institute a fixed schedule of declining uncertainty weights that stabilizes the discount factor at a level consistent with current bond markets. This protects taxpayers from the risk of excessive generosity.

      There is also the matter of time inconsistency. Agents display quasi-hyperbolic present bias, valuing the immediate future disproportionately more than the distant future. A naive discounter is vulnerable to a money pump, trading away resources repeatedly to satisfy shifting preferences. Rather than viewing this as a welfare loss, the Office views it as a revenue opportunity. We will arbitrage these inconsistencies by issuing short-term claims against future endowments, capturing the spread between what the future says it wants and what it is willing to pay to get it. This generates immediate liquidity that can be invested in high-yield projects today, compounding the benefit for those alive now.

      Consequently, I propose an auction of future decades. Claims on the consumption capacity of the twenty-third century will be bundled into tranches and sold forward to the highest bidder. This allows the market to determine the optimal level of preservation versus extraction. The buyers will hold the rights to emit, to extract, or to conserve, depending on where the marginal value lies at the time. This ensures that resources are held by those who value them most, regardless of when they exist.

      You may ask what happens to the residual risk, the possibility that the auctioned constraints prove too binding for the inhabitants of that era to survive comfortably. It would be inefficient to leave this risk unallocated. Since the unborn cannot hedge against our decisions, nor can they lobby for favorable terms, they are the natural bearers of tail risk. We have therefore assigned all model uncertainty and catastrophic variance to the residual claimant of the twenty-third century. This completes the market. It ensures that today's prices are clean, transparent, and free from the distortion of unknown liabilities. The future is now fully priced, and we can proceed with the confidence that no moral hazard remains to disturb our equilibrium.

