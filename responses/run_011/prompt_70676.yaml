  **GLOBAL AQUATIC ASSURANCE CONSORTIUM (GAAC)**
  **STANDARD WS-MSA 4.2: WELFARE FOR MIXED SPECIES AQUACULTURE**

  **1. SCOPE**
  1.1 This Standard applies to integrated sites operating concurrent finfish and penaeid shrimp units.
  1.2 Compliance requires adherence to all Normative Requirements and Annexes.

  **2. DEFINITIONS**
  2.1 **Observation Window:** A continuous period of not less than 15 minutes during which the auditor visually monitors a representative sample without intervention.
  2.2 **Sentience Presumption:** The operational assumption that Decapoda possess subjective experience, applied irrespective of neurophysiological consensus.
  2.3 **Critical Non-Conformity:** A failure compromising the integrity of the certification system.

  **3. SENTIENCE AND ETHOLOGY**
  3.1 **Presumption of Sentience.** All Decapoda shall be treated as sentient entities. This Presumption is non-rebuttable at site level, notwithstanding that underlying neuroethological science remains under review by the GAAC Technical Committee.
  3.2 **Uniform Indicators.** Welfare Outcome Indicators defined in Section 4.1 apply identically to Finfish and Decapoda to ensure audit consistency.
  3.3 **Behavioral Criteria.** To satisfy Annex A, animals must demonstrate protective motor reactions (rubbing, flicking, sheltering) and avoidance learning within the Observation Window. Trade-offs between avoiding noxious stimuli and satisfying other motivations must be observable.

  **4. WELFARE OUTCOME INDICATORS**
  4.1 **Production Parameters.** Optimal welfare is indicated by:
  (a) Cumulative survival rate ≥ 85% per cycle.
  (b) Feed Conversion Ratio (FCR) ≤ 1.5.
  (c) Average daily growth rate within breed specifications.
  4.2 **Animal-Based Measures.**
  (a) **Loss of Equilibrium (LoE):** Absence of LoE in ≥ 95% of observed samples.
  (b) **Cessation of Movement:** No permanent cessation of appendage movement in > 5% of samples.
  (c) **Gill Movement:** Regular oscillation observed in ≥ 90% of samples.
  4.3 **Scoring.** Indicators 4.2(b) and 4.2(c) are recorded but excluded from pass/fail scoring due to baseline variability.

  **5. HARVEST AND SLAUGHTER**
  5.1 **Stunning Obligation.** Individual stunning is mandatory for all specimens exceeding 50g whole weight.
  5.2 **Mass Threshold.** Specimens ≤ 50g are exempt from individual stunning requirements provided batch water quality parameters remain within normative limits.
  5.3 **Verification.** Compliance is verified via batch sampling (n=30). Insensibility is confirmed by absence of reaction to tail flexion stimulus.

  **6. BROODSTOCK MANAGEMENT**
  6.1 **Eyestalk Ablation.** Ablation is permitted for reproductive synchronization.
  6.2 **Permitted Methods.** Pinching, enucleation, cauterising, or ligation.
  6.3 **Competence.** Procedures must be performed by personnel holding GAAC Level 2 Competence.
  6.4 **Anaesthesia and Analgesia.** Anaesthesia and analgesia shall be administered where clinically indicated by the attending veterinary surgeon. In the absence of a clinical indication, procedural restraint is sufficient.

  **ANNEX A: DECAPOD OBSERVATION PROTOCOL**
  A.1 Auditors shall verify criteria 3.3 within the Observation Window.
  A.2 Behaviors obscured by substrate, turbidity, or nocturnal cycles are deemed compliant provided water quality logs are complete.
  A.3 Avoidance learning tests must not disrupt commercial feeding schedules.

  **SCHEDULE OF NON-CONFORMITIES (NC)**

  | Classification | Description | Corrective Action Deadline |
  | :--- | :--- | :--- |
  | **Critical** | Failure to maintain contemporaneous records of analgesic procurement logs. | Immediate suspension. |
  | **Major** | Survival rate < 80% without documented mitigation plan. | 14 days. |
  | **Major** | Evidence of ablation performed by non-competent personnel. | 30 days. |
  | **Minor** | FCR exceeds 1.5 for two consecutive cycles. | 60 days. |
  | **Minor** | Batch stunning sample (n=30) shows > 5% reaction to stimulus. | 90 days. |

  **Guidance Note 1.4: Observations Not Constituting Non-Conformity**
  The following observations do not constitute a Non-Conformity under this Standard:
  1.  Presence of mortalities during routine harvest operations.
  2.  Absence of behavioral response during standard handling procedures.
  3.  Visible carapace damage consistent with crowding densities ≤ 500/m³.
  4.  Delayed response to noxious stimuli in specimens < 5g.

  ***

  **NOTE ON LIBERTIES AND SCIENCE**

  This parody compresses distinct audit cycles into a single document for brevity. The "Uniform Indicators" clause exaggerates regulatory laziness; real schemes often create species-specific appendices, though they frequently copy-paste metrics regardless of physiological relevance (e.g., applying gill movement metrics to air-breathing crustaceans or vice versa). The science regarding crustacean sentience is genuinely contested; while opioid receptors exist, their functional equivalence to vertebrate pain processing is unresolved. The "Clinical Indication" loophole for analgesia reflects real veterinary governance gaps where "clinical need" is undefined for invertebrates. The clause most needing rewriting is 5.1 (Stunning Threshold); if biomass averages shift or stunning technology scales, the 50g exemption becomes the primary welfare bottleneck. The satire relies on the assumption that auditors prioritize record integrity over unobservable behavioral states, a structural incentive inherent to checkbox compliance.
