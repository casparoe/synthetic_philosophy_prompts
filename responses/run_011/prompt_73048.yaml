answer: |-
  I recommend that the panel does not adopt the wellbeing metric for the coming appraisal round and continues to appraise the £48m fund using the existing QALY framework, subject to the recalibration conditions outlined below.

  Under this recommendation, Programme S (community companionship) will not be funded in the coming round, as its cost per QALY of £66,700 exceeds the £30,000 threshold. Programme H (elective hip replacement) will be funded, as its cost per QALY of £21,800 remains within threshold. The £48m fund will be allocated based on cost-per-QALY rankings until further notice. This decision preserves the fiscal integrity of the authority against the statistical instability currently inherent in the wellbeing metric. While the board has expressed a desire to better capture social value, adopting a metric where the unit of measurement shifts between measurement waves poses an unacceptable risk of misallocating public funds. We cannot approve a system where the ruler changes length between the time the threshold is set and the time proposals are measured.

  To the lay member who questioned whether we can compare one person's satisfaction with another's: the statistician's note validates your skepticism, but only regarding the current instrument, not the concept itself. The vignette drift demonstrates that the scale is not stable across time. In 2019, respondents placed "limited mobility" at 3.4 on the 0–10 ladder; in 2024, the same clinical state was placed at 4.3. Simultaneously, the "worst imaginable health" vignette dropped from 1.2 to 0.9. This indicates that respondents are using the ladder differently now than they did five years ago, likely compressing their responses toward the top end. The re-anchoring procedure assumes vignette interpretation is stable; the data proves it is not. Therefore, a score of 5.0 in 2019 does not represent the same quantum of wellbeing as a score of 5.0 in 2024. The spread across the three statistical corrections for Programme H (£133,000, £87,300, and £67,600 per WALY) does not change my recommendation regarding the coming round's pilots, as all three corrections still result in Programme H failing the wellbeing threshold while Programme S passes. However, this spread confirms that the metric is too sensitive to modeling assumptions to serve as the sole arbiter for £48m of spending. The instability does not undermine the value of measuring wellbeing, but it fundamentally undermines the comparability required for a fixed threshold system.

  Regarding the 0.05 conversion ratio: this figure must not be applied to any data collected in 2024 or later. The ratio was fitted using a cross-sectional regression of QALY weights on ladder scores from the 2019 wave. Because the ladder's scale has shifted—evidenced by the fixed clinical cohort's mean score rising by 0.6 points despite no clinical change—the 2019 regression coefficients no longer map onto the 2024 scale. The statisticians note that applying the 2019 ratio to 2024 data understates the cost per WALY of programmes in the lower half of the ladder by roughly a third. Since nearly every future social-care and mental-health proposal will sit in this lower half, adopting the metric with the existing ratio would systematically overvalue these proposals relative to acute care. We would be funding programmes that actually cost £40,000 per WALY believing they cost £30,000. Until a new conversion ratio is fitted using 2024 data and validated against the new vignette placements, the conversion ratio must be treated as obsolete.

  I must address the strongest cases made against my position. The patient representative argues that Programme H's modest ladder gain reflects patient adaptation—people living with bad hips adjust their expectations—and that a metric rewarding this adjustment quietly defunds the sickest patients. This is a serious ethical charge. However, the current wellbeing metric fails Programme H not merely because of adaptation, but because of the scale compression identified by the statisticians. Even if we accept the adaptation argument, the QALY metric also relies on public imagination of health states they have never led, as the economics unit notes. The QALY is not perfect, but it is stable. Switching to a flawed wellbeing metric does not solve the adaptation problem; it merely replaces a stable bias with an unstable one. For the patient representative's position to win, we would need evidence that the wellbeing metric correctly identifies clinical need independent of respondent adaptation, which the current vignette drift suggests it cannot yet do.

  Similarly, the lay member's preference for rule-of-thumb allocation over pretended scales deserves real engagement. If the scale drifts by 0.6 points on a fixed cohort, the claim to scientific precision is indeed weakened. However, rule-of-thumb allocation lacks transparency and invites inconsistency. The solution is not to abandon measurement but to repair the instrument. My recommendation to pause adoption is not a rejection of measurement but a demand for rigor. We cannot allocate by rule of thumb when the board specifically requested a metric-based decision to ensure accountability. The middle path is to maintain the QALY until the wellbeing metric is robust enough to withstand the scrutiny you rightly apply to it.

  To resolve these uncertainties, I require the statistics unit to execute the following work over the next twelve months. First, they must run a longitudinal validation of the vignette instrument, re-interviewing a fixed cohort every six months to detect scale drift in real-time. Second, they must fit a new conversion ratio using 2024 ladder scores and contemporary QALY weights, rather than relying on the 2019 regression. Third, they must test the sensitivity of the WALY calculation to the anchoring method, specifically comparing linear re-anchoring against raw scores to determine if the vignettes are introducing noise rather than stability.

  The panel will revisit this decision on [Date 12 months from now]. The trigger for reconsidering the adoption of the wellbeing metric will be a statistical report demonstrating that vignette placements for the "limited mobility" and "worst health" states have remained within a 5% variance band over two consecutive waves, and that the new conversion ratio has been validated against a hold-out sample. Until these conditions are met, the QALY remains the only metric with demonstrated stability sufficient to govern the £48m fund. We must not allow the urgency of the board's timeline to compromise the accuracy of our allocation; a wrong decision funded by a broken metric is more costly than a delayed decision funded by a sound one.
