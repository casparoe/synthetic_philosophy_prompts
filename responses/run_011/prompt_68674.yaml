          *   *Severity:* High. This is the "having it both ways" the teacher likely spotted. You can't say "outcomes are the only thing that matters for decision making" while also saying "there are constraints that forbid certain acts regardless of outcomes."

      *   *Tension B: P4 vs. P2 (Blame vs. Wrongness)*
