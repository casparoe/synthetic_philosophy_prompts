          *   *Collision:* P5 tries to exonerate the *agent* too cleanly. If P6 is true (using people is inherently wrong), does doing it necessarily stain the agent, even if necessary? P5 says no. P2 says "I'm supposed to carry that." Carrying it implies a stain. P5 implies the stain can be avoided if the motivation was pure.
