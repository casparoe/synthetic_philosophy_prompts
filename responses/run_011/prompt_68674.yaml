prompt: |-
  ok so I need someone to tell me whether my views actually fit together, becuase my gov teacher said I'm having it both ways in more than one place and then he wouldn't say which places, and I haven't been able to stop thinking about it since.

  Context first, this isn't a hypothetical. Last spring I was on student council. There was a walkout about the budget and the admin wanted to know which students organized it, mainly because one of them is a girl whose family's immigration situation is — yeah. If they'd gone after her it would have been catastrophic for her and it also would have nuked the peer counseling program she started. So I redirected them onto D, a teacher who was already kind of on their radar. I didnt lie exactly. I told them a true thing about his classroom management and left out every part that would have made it look minor, and I let them draw the obvious conclusion. He didn't get rehired. And then I let him believe I had pushed back for him in that meeting. He still believes that.

  Here's what I actually hold:

  1. Some political goods just can't be had without doing something bad, and refusing to do the bad thing is often only a way of keeping your own hands pretty while somebody else eats the cost. So saying you personally wouldn't do it is not automatically the moral high ground.

  2. Doing it doesnt make it not-bad though. The good result doesn't convert it into the right act. It stays a wrong I did, I'm supposed to carry that, and if there's any way to make something up to D I should take it.

  3. Guilt that changes nothing is worthless. If feeling awful doesn't make you do anything different it's just self-soothing, and leaders who wallow in it are being kind of gross.

  4. Ought implies can. I'm only blameworthy for failing to do something I could actually have done. If there was no version of last spring where the girl is safe AND D is fine, then there was nothing I was supposed to do instead, and I don't see how I'm blameworthy for that.

  5. My own test for whether a dirty-hands act dirties you rather than just your record: would you have been willing to do it even if it hadn't been necessary? If yes — if part of you wanted to, or you'd have found a reason — then the problem isnt the act, it's you. If you hated every second and only did it because there was no other way, the act is dirty but you're not.

  6. I'm not a consequentialist. There are things you may not do to a person no matter how much good comes out of it, and I think that's exactly why what I did to D was bad: I used him. A view that just adds up outcomes can't even see that.

  7. But when you're actually deciding what to do, the only thing that can possibly matter is what will happen. Intentions and purity don't protect anyone. So deliberation has to be outcomes-first.

  So: which of these actually collide, which ones only look like they collide, and what's the cheapest thing to drop and what does dropping it cost me? Rank them worst-first please, don't hand me a list where everything is mildly in tension with everything else. I'm pretty sure at least one pair I'm worried about is fine, I just can't tell which one.

  And seperate question — does my own list tell me what to do about D now? I've gone back and forth for months and I can't derive an answer from the seven things above, which is either a sign my views are broken or a sign the question is harder than I think.

  Two rules: no reading list, and no telling me which philosophers already covered this. I want the audit of my set specifically. And if one of the seven is load-bearing — the one where if it goes, three others go with it — tell me which.
