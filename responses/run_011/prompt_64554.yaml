  **DRAFT MUNICIPAL PROCUREMENT STANDARD 44.2**
  **ISSUING BODY:** Joint Committee on the Political Certification of Procured Objects (JCPPO)
  **STATUS:** Open for Comment

  **1.0 SCOPE AND AUTHORITY**
  1.1 This Standard applies to all tangible assets acquired, leased, or installed by the Municipality exceeding a value of $500.
  1.2 No asset may be energized or placed into public service until a Political Orientation Certificate (Form P-1) is filed and approved.
  1.3 **Self-Application:** This Standard constitutes a regulatory artifact. Pursuant to Clause 3.1, the JCPPO has filed Form P-1 regarding Standard 44.2. Minute 12.4 records the Committee's vote to certify itself as possessing a Hierarchical Political Orientation (Score 8/10) due to centralized enforcement authority.

  **2.0 DEFINITIONS**
  2.1 **Political Orientation:** The degree to which an artifact necessitates specific social arrangements to function.
  2.2 **Declared Intent:** Political orientation explicitly documented in design minutes or procurement requests.
  2.3 **Operational Requirement:** Political orientation inherent in the physical necessity of the object (e.g., requirement for specialized labor, centralization, or exclusion).
  2.4 **Null Orientation:** A designation indicating the object enforces no specific hierarchy. **Note:** Certification as Null constitutes an endorsement of the existing distribution of power and resources. A score of 0 is unavailable; the minimum baseline score is 1 (Status Quo Endorsement).
  2.5 **Indeterminate Intent:** A classification applied when design records are absent. Assessors are prohibited from inferring intent from observed social effects.

  **3.0 ASSESSMENT RUBRIC**
  3.1 **Scoring:** Assets are scored 1–10.
  3.2 **Category A (Intent):** Points awarded for documented design choices intended to include or exclude specific populations.
  3.3 **Category B (Structure):** Points awarded for operational requirements. Centralized systems requiring expert staffing score higher than distributed systems managed by users.
  3.4 **Maintenance Clause:** Certification binds to the original design specification. Changes in operational status due to staffing shortages, parts availability, or decay do not alter the Political Orientation Score.
  3.5 **Liability:** Where an asset enforces exclusion autonomously, liability is assigned to the Asset ID, not the maintaining department.

  **4.0 ANNEX: WORKED EXAMPLES**

  **Item 4.1: Municipal Transformer Substation**
  *   **Declared Intent:** Indeterminate (Design minutes lost, 1974).
  *   **Operational Requirement:** High. Requires specialized union labor, centralized grid access, and permanent physical security.
  *   **Score:** 9/10.
  *   **Notes:** High score reflects dependency on hierarchical expert staffing. Effects of service denial in Sector 7 noted but excluded from Intent assessment per Clause 2.5.

  **Item 4.2: Rooftop Solar Array (Civil Services Building)**
  *   **Declared Intent:** Low (Procurement request cites "efficiency").
  *   **Operational Requirement:** Low. Distributed generation, minimal staffing, user-managed output.
  *   **Score:** 3/10.
  *   **Notes:** Lower score reflects decentralized operational structure. Despite identical energy output to Substation 4.1, structural independence reduces hierarchy score.

  **Item 4.3: Pedestrian Crossing Signal (4th & Elm)**
  *   **Declared Intent:** Indeterminate.
  *   **Operational Requirement:** None. Internal wiring severed; button connects to no circuit.
  *   **Score:** 1/10 (Status Quo Endorsement).
  *   **Notes:** Object provides illusion of agency while enforcing existing traffic flow. Intent cannot be inferred as malicious due to missing records, though effect is total non-responsiveness.

  **Item 4.4: Automated Turnstile (Transit Hub)**
  *   **Declared Intent:** Medium (Revenue collection).
  *   **Operational Requirement:** Medium (Requires monitoring).
  *   **Score:** 6/10.
  *   **Maintenance Status:** Non-functional (Card reader faulty since Q3).
  *   **Certification Status:** Valid. Score remains 6/10 despite inability to process fare.
  *   **Incident Log 88-B:** On 14/10, Asset ID 992 denied entry to Citizen 441. Maintenance log cites sensor error. Per Clause 3.5, Incident Report filed against Asset ID 992. Asset has been issued a formal warning.

  **5.0 REVIEW AND REVISION**
  5.1 Certificates are valid for five years.
  5.2 Appeals regarding Score classification must be submitted in triplicate.
  5.3 **Next Committee Meeting:** 14 November.
  5.4 **Comment Deadline:** 01 November.
  5.5 **Standard Revision:** 4.2.Draft.
