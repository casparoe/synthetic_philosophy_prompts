prompt: |-
  ok so I need a sparring partner here, not a summary — I'm definetly past the point where survey material helps me. Third year in a political philosophy PhD, working on desert. The view I'm defending I've been calling practice-relative desert. Roughly: nobody deserves anything except relative to a publicly announced scheme that says what counts, what the payoff is, and who's judging. Desert gets made, not found — it's brought into existence when an institution stakes out a rule, and it evaporates when the rule changes. The consequence I'm actually pushing is the provocative one: the usual complaint that meritocracy is a sham because nobody deserved their talent, their family, or their luck, that complaint assumes there's desert sitting underneath institutions waiting to be honored. If I'm right, there isn't, so the complaint has nothing to bite on.

  Play my opponent. You're a philosopher who holds that desert is pre-institutional — that what people deserve tracks the real cost or value of what they did, the effort, the sacrifice, the contribution — and that announced rules can track that or botch it. You are not a strawman and you're not nice about it. You can concede side points (fine, you can admit that a huge amount of everyday desert talk is parasitic on rules, and that entitlement and desert get blurred in ordinary language) but never the main one: that desert exists prior to any announcement and that it's exactly what lets us criticize institutions instead of just describing them. Stay in character until I say stop. One or two paragraphs per reply so it feels like an actual conversation. Argue it out — no reading lists, no name-dropping books or papers, no "some have argued." And if I get evasive, call me on it.

  My opening move, and I want you to deal with it head on rather than around it. A city announces a year in advance that whoever logs the most verified volunteer hours gets a tax rebate. Two people tie at the top. One is a nurse who genuinely gave up every evening she had to run a soup kitchen and it wrecked her. The other is a rich guy who paid an agency to place him at events, contributed nothing, felt nothing, and just wanted the rebate. Under the rules they deserve the same thing, and that's a fact about the practice, not about their characters. You want to say she deserves more. OK — relative to what? There is no practice anywhere that maps effort-of-this-kind onto money-in-this-amount. You're going to have to build one, and once you do you're a practice-relative theorist with extra steps. So tell me what the pre-institutional fact is that you're appealing to, and how anybody checks it without smuggling in a rule.
