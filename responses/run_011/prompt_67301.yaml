answer: |-
  # Seminar Prep: Q&A Sheet
  **Topic:** Procreation Asymmetry via Standpoint Restrictions (Ex-Ante)
  **Time:** 45 min talk + 30 min discussion

  ---

  ### Objection 1: The Incoherence of "Standpoints"
  **Source:** Population Ethicists
  **Idiom:** "Person-affecting restrictions," "Moral status," "Consistency."
  **The Challenge:** "You grant possible persons standpoints to ground restrictions but deny them to ground requirements. This looks like an *ad hoc* fix to save the asymmetry. If a possible person has a standpoint strong enough to veto their creation, why is that standpoint too weak to demand their creation when life would be good? You seem to be toggling their moral status to fit the intuition."

  *   **Concession:** "I concede that this looks like a toggle if standpoints are treated as sources of *claims* rather than *constraints*."
  *   **Reply:** "The standpoint isn't a claim-holder; it's a limit on agency. Think of it like consent: a patient's standpoint restricts a surgeon from cutting (even to save others), but the patient's standpoint doesn't *require* the surgeon to operate if they don't want to. The asymmetry comes from the nature of moral complaint: we can complain about being harmed, but we cannot complain about not being benefited by a stranger. I am mapping this onto the creation context. The standpoint grounds the *veto*, not the *demand*."
  *   **Soft Spot:** This relies heavily on the analogy between consent and procreation, which is metaphysically shaky since the 'patient' doesn't exist to withhold consent.

  ### Objection 2: The Non-Identity Problem (NIP) Evasion
  **Source:** Population Ethicists
  **Idiom:** "Ex-ante vs. Ex-post," "Harm," "Counterfactuals."
  **The Challenge:** "You claim formulating $T$ ex-ante evades the Non-Identity Problem. But if the child is born below $T$, they cannot say they were harmed (they wouldn't exist otherwise). If they can't complain ex-post, what work is the ex-ante probability doing? You've shifted the timing, but not the metaphysical problem of comparing existence to non-existence."

  *   **Concession:** "I concede that the child born below $T$ cannot claim they were harmed in the standard counterfactual sense."
  *   **Reply:** "The violation isn't against the child *after* birth; it's against the *norm of decision-making* at the time of choice. The NIP relies on ex-post comparison. My view says the wrong is located in the reckless gamble taken by the agent given the information *then*. We punish drunk driving even if no one is hit. The restriction binds the agent's risk assessment, not the outcome's comparative welfare."
  *   **Soft Spot:** This moves the view from a "harm to the child" view to a "wrongful action" view, which weakens the connection to the child's standpoint mentioned in (iv).

  ### Objection 3: Trade-offs with Existing Suffering
  **Source:** Welfare Economist / General
  **Idiom:** "Social Welfare Function," "Opportunity cost," "Pareto efficiency."
  **The Challenge:** "You say the restriction cannot be traded off. Suppose creating one person below $T$ allows me to save a thousand existing people from torture. Your view prohibits the creation. This implies the 'shadow price' of a potential sub-$T$ life is infinite. Why should potential existence trump actual, severe suffering?"

  *   **Concession:** "I concede that on my view, the restriction on creating sub-$T$ lives outweighs aggregate gains for existing people."
  *   **Reply:** "This is the cost of treating the prohibition as a side-constraint rather than a weight in a function. We accept similar constraints elsewhere: we cannot harvest one healthy person to save five dying patients, even if the SWF improves. The view treats procreation below $T$ as a violation of a duty not to impose a life one could not reasonably want, which is categorically distinct from failing to maximize utility for the already living."
  *   **Soft Spot:** The analogy to organ harvesting is weak because the 'victim' in procreation is the one created, whereas in organ harvesting, the victim is an existing rights-bearer.

  ### Objection 4: Climate Implications (Anti-Natalism)
  **Source:** Climate/Global Health Contingent
  **Idiom:** "Fertility rates," "Warming scenarios," "Intergenerational justice."
  **The Challenge:** "If $T$ is 'a life one could reasonably want,' and we project severe climate instability for the next century, does your view imply a prohibition on almost all fertility in the Global North? Are you committed to a near-term anti-natalism policy to avoid violating the restriction?"

  *   **Concession:** "I concede that on severe warming trajectories, the probability of falling below $T$ rises significantly for future cohorts."
  *   **Reply:** "The view restricts *substantial probability* of falling below $T$, not certainty. Most projected lives, even in warming scenarios, remain above the threshold of 'not reasonably wantable.' However, the view does imply a strong duty to mitigate climate risk to keep that probability low. It frames fertility not as a right, but as a permission contingent on risk management."
  *   **Soft Spot:** If $T$ is set high (e.g., "flourishing" vs. "barely worth living"), the probability of falling below it in a warming world becomes "substantial," forcing the anti-natalist conclusion I want to avoid.

  ### Objection 5: Embryo Selection Paradox
  **Source:** Climate/Global Health Contingent (Bioethics angle)
  **Idiom:** "Embryo selection," "Disability," "Selection vs. Prohibition."
  **The Challenge:** "I have two embryos. Embryo A will likely be above $T$. Embryo B will likely be below $T$. You say there is no requirement to create above $T$. But you prohibit creating below $T$. If I implant B, I violate the prohibition. So, am I not effectively *required* to implant A? Your asymmetry collapses into a requirement in selection contexts."

  *   **Concession:** "I concede that in a binary choice where one option violates the restriction, the agent is forced to choose the other."
  *   **Reply:** "This is not a requirement to *create* the good life, but a requirement to *avoid* the bad one. The asymmetry holds because if *both* embryos were above $T$, I would be under no requirement to implant either. The restriction only bites when the threshold is threatened. It remains a negative constraint, even if it narrows my permissible options."
  *   **Soft Spot:** This functionally looks exactly like a requirement to maximize welfare in selection contexts, which undermines the claim that there is "no symmetrical requirement."

  ### Objection 6: Operationalizing Threshold $T$
  **Source:** Welfare Economist
  **Idiom:** "Quantification," "QALYs," "Policy guidance."
  **The Challenge:** "You speak of $T$ as the point where one 'could not reasonably want' the life. For a policy constraint, this is useless. Where does $T$ sit? Is it severe cognitive impairment? Chronic pain? If you can't locate $T$, you can't calculate the restriction's impact on a Social Welfare Function."

  *   **Concession:** "I concede that $T$ is not easily reduced to a single metric like QALYs."
  *   **Reply:** "$T$ is a normative threshold, not a clinical one. It marks the boundary where the goods of life no longer compensate for the burdens *from the subject's perspective*. While hard to quantify, it is not unknowable: we recognize it in cases of severe, untreatable suffering where death is preferred. The view doesn't need a precise number to function as a constraint; it needs a recognizable category of 'lives not worth starting.'"
  *   **Soft Spot:** Economists will view "recognizable category" as subjective noise that makes the model unfalsifiable and useless for cost-benefit analysis.

  ### Objection 7: Probability Threshold Arbitrariness
  **Source:** Population Ethicists / Economist
  **Idiom:** "Risk tolerance," "Expected value," "Arbitrariness."
  **The Challenge:** "You prohibit creation when there is a 'substantial probability' of falling below $T$. Is that 10%? 50%? If I accept a 10% risk, am I immoral? If 50%, why not 49%? Any line you draw seems arbitrary, yet you give it the force of a non-tradeable restriction."

  *   **Concession:** "I concede that any specific probability cutoff involves some arbitrariness."
  *   **Reply:** "Legal and moral systems routinely draw lines on continua (e.g., speed limits, age of consent). The 'substantial' qualifier is meant to capture risks that a reasonable agent would not impose on another without consent. The arbitrariness of the line doesn't negate the validity of the constraint, provided the line is drawn within the range of reasonable risk aversion regarding another's fundamental welfare."
  *   **Soft Spot:** In population ethics, small probabilities of massive harms (or benefits) usually aggregate. Drawing a hard line at "substantial" ignores the cumulative risk of many 'small' risky procreations.

  ### Objection 8: Treating Persons as Projects
  **Source:** Kantian
  **Idiom:** "Ends in themselves," "Instrumentalization," "Autonomy."
  **The Challenge:** "Your framing evaluates a prospective life against a threshold $T$ to decide if it is permissible to 'bring it into existence.' This treats the prospective person as a project to be vetted for quality, rather than an end in themselves. You are making their right to exist conditional on your assessment of their future welfare."

  *   **Concession:** "I concede that the language of 'vetting' a life can sound instrumental."
  *   **Reply:** "The restriction is not about the *value* of the person, but the *burden* imposed on them. Kant prohibits using persons as mere means. Imposing a life of unavoidable suffering is using them as a vessel for your reproductive goals. Respecting the threshold is a way of respecting the *potential* autonomy and welfare of the being, ensuring they are not born into a situation where their agency is immediately crushed by suffering."
  *   **Soft Spot:** Kantians generally reject "potential persons" having rights. If they don't have rights, I can't violate them by not creating them, but I also can't violate them by creating them (since there is no 'them' yet).

  ---

  ### Strategic Analysis

  **Most Dangerous Pair:** **Objection 2 (NIP)** and **Objection 4 (Climate)**.
  *   **Why:** If the NIP evasion fails (Obj 2), the restriction relies on harming the child. If the Climate objection holds (Obj 4), almost all future children are "harmed" by being born into a warming world. Combined, these force the view into implying that *all* future procreation is prohibited. This turns a moderate asymmetry into radical anti-natalism, which alienates the Applied contingent and makes the view practically untenable.

  **Fatal Single Objection:** **Objection 1 (Standpoint Coherence)**.
  *   **Why:** This attacks the explanatory engine (iv). If you cannot explain *why* standpoints ground restrictions but not requirements without sounding *ad hoc*, the view collapses into a mere assertion of the asymmetry. The Population Ethicists will smell "axiological inconsistency," and if you can't defend the standpoint move, the rest of the paper loses its theoretical foundation.

  **The Question You Hope Nobody Asks:**
  *   **The Question:** "If $T$ is defined by what a person could 'reasonably want,' and many existing people currently regret their existence or live below $T$, does your view imply we have a duty to prevent the existence of anyone who *turns out* to be below $T$, retroactively? Or, more dangerously: Does the logic of avoiding sub-$T$ lives imply we should minimize the total number of lives to minimize the risk of *any* sub-$T$ life occurring?" (The Benatar Slide).
  *   **Why it's dangerous:** It pushes the view toward Negative Utilitarianism or Anti-natalism. If the goal is to avoid sub-$T$ lives, and existence carries *any* risk of sub-$T$, the safest bet is non-existence.
  *   **What to Say:** "The view is a constraint on *decision-making under uncertainty*, not a mandate to eliminate risk entirely. We accept risks of sub-$T$ outcomes in other areas of life (e.g., driving) because the activity is valuable. Procreation is permissible because the *probability* is not substantial, even if the *possibility* exists. We do not minimize the number of lives; we minimize the *recklessness* of creating them."
