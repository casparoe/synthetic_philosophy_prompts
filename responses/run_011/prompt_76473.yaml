  ### Indistinguishable Leaves (Req 5)

  **Leaf 9 (Multiple Normal) and Leaf 9.5 (Field Readiness)**
  *   **The Conflict:** Both leaves result in the same practical outcome: credit is distributed or dismissed, and the specific actor is deemphasized. Both agree the discovery was inevitable (Q1 Yes).
  *   **Why they merge:** In a retrospective, arguing for "Multiple Normal" vs. "Field Readiness" yields the same allocation of blame/praise.
  *   **How to separate them:** You need a thought experiment about *failure*.
      *   *Field Readiness* says: If the field wasn't ready, *no one* would have found it even if they tried.
      *   *Multiple Normal* says: The field was ready, so *many* found it.
      *   *Evidence:* Look for "near misses." If there are many failed attempts just before the success, **Multiple Normal** is more likely (the solution was hard but found by many). If there are *no* attempts until the conditions ripened, **Field Readiness** is more likely (the problem wasn't visible yet).

