  ### The Decision Tree: Inevitability and Credit in Technical Discovery

  **Instructions:** Start at **Q1**. Answer based *only* on the specific case (e.g., the build cache), not on your general philosophy. Follow the branch until you reach a leaf.

  **Q1. The Vacuum Test (Existence)**
  If your team had been reassigned to a different project on Day 1, leaving the problem unsolved, would a system achieving the *same performance benchmarks* have existed in the industry within 24 months?
  *   **No:** Go to **Leaf 1**.
  *   **Yes:** Go to **Q2**.

  **Q2. The Mechanism Test (Structure)**
  If yes to Q1, would that competing system rely on the *same specific algorithmic trick* (the core logic), or would it achieve the benchmark numbers using fundamentally different internals?
  *   **Different Internals:** Go to **Leaf 2**.
  *   **Same Trick:** Go to **Q2.5**.

  **Q2.5. The Description Test (Granularity)**
  Does your answer to Q2 change if you describe the discovery broadly ("distributed caching") versus finely ("this specific hash-bucket eviction policy")?
  *   **Yes (Inevitable broadly, contingent finely):** Go to **Leaf 3**.
  *   **No (Same answer either way):** Go to **Q3**.

  **Q3. The Visibility Test (Silence)**
  If other teams found the same trick, would they publish or open-source it such that the community recognizes it as a "multiple discovery," or would it remain a proprietary secret known only to that team?
  *   **Remains Secret (Silent):** Go to **Leaf 4**.
  *   **Published (Visible):** Go to **Q4**.

  **Q4. The Handoff Test (Usability)**
  Is the discovery considered "complete" only when an engineer *outside* the authoring team can implement it using only public documentation, without needing to ask the authors for clarification?
  *   **No (Code/Internal Memo is enough):** Go to **Leaf 5**.
  *   **Yes (Public API/Preprint needed):** Go to **Q5**.

  **Q5. The Framing Test (Constraint)**
  Does the first version to pass the Handoff Test (Q4) define the vocabulary, API, and mental model that all subsequent implementations must adopt to interoperate, even if later versions are technically superior?
  *   **No (Interchangeable Parts):** Go to **Leaf 6**.
  *   **Yes (Framing Lock-in):** Go to **Q6**.

  **Q6. The Credit Test (Agency)**
  If two teams pass the Handoff Test within six months of each other, does the community assign primary credit to the one who *filed the patent/paper first* (Insight) or the one whose *implementation became the standard* (Artifact)?
  *   **Credit to Insight (First to Think):** Go to **Leaf 7**.
  *   **Credit to Artifact (First to Ship/Frame):** Go to **Leaf 8**.
  *   **Credit Splits Evenly (Multiple Normal):** Go to **Leaf 9**.
  *   **Credit is Illusory (Field Decides):** Go to **Leaf 10**.

