  ### The Leaves (Positions)

  **Leaf 1: Radical Contingency**
  *   **Definition:** The discovery was a "coin flip." Without this specific team, the capability does not exist in this timeframe.
  *   **Status:** Standard position (often called "Internalism" or "Great Man Theory" in history).
  *   **Diagnosis:** Coherent. Matches Camp B.

  **Leaf 2: Convergent Evolution**
  *   **Definition:** The *problem* was inevitable (pressure from benchmarks), but the *solution* was contingent. Others would have solved the latency issue, but not with this trick.
  *   **Status:** Standard position (Functionalism).
  *   **Diagnosis:** Coherent. Distinguishes "what" from "how."

  **Leaf 3: Description-Relative Inevitability**
  *   **Definition:** Inevitability is not a property of the event, but of the description. "Caching" was inevitable; "this specific pointer arithmetic" was not.
  *   **Status:** Unnamed in general literature; standard in software architecture (abstraction layers).
  *   **Diagnosis:** Coherent. Resolves the Camp A vs. Camp B fight by changing the resolution.

  **Leaf 4: The Silent Multiple** (Your Coinage)
  *   **Definition:** The discovery happened elsewhere but was not recognized as the same event. The statistics on "multiple discovery" are skewed because we only count the loud ones.
  *   **Status:** Unnamed; sociologically plausible.
  *   **Diagnosis:** Coherent. Suggests "inevitability" is higher than history shows, but "credit" is lower.

  **Leaf 5: The Private Insight**
  *   **Definition:** The discovery belongs to the mind that conceived it, regardless of whether it was made usable by others. Implementation is secondary to conception.
  *   **Status:** Standard position (Idealism).
  *   **Diagnosis:** Unattractive to engineers. Implies a locked drawer of code counts as a "discovery."

  **Leaf 6: The Commodity**
  *   **Definition:** The discovery was inevitable and usable, but no single version constrained the future. It is a standard part, like a screw.
  *   **Status:** Standard position (Commoditization).
  *   **Diagnosis:** Coherent. Implies low credit for anyone.

  **Leaf 7: Priority of Insight**
  *   **Definition:** Credit belongs to the first to formalize the idea (paper/patent), even if their implementation was worse or later.
  *   **Status:** Standard position (Academic norm).
  *   **Diagnosis:** Coherent. Favors the preprint group in your scenario.

  **Leaf 8: Priority of Artifact** (Your Intuition)
  *   **Definition:** Credit belongs to the first to ship a usable version that sets the framing. The "idea" is worthless without the "interface."
  *   **Status:** Unnamed in philosophy; standard in open source (Benevolent Dictator).
  *   **Diagnosis:** Coherent. Favors the team that shipped the cache (or the preprint if it was more usable).

  **Leaf 9: Multiple Normal**
  *   **Definition:** Simultaneous discovery is the default state of progress, not an anomaly. Credit should be split or assigned by lottery, not priority.
  *   **Status:** Standard position (Mertonian Norm of Communism).
  *   **Diagnosis:** Coherent. Rejects the premise that one team "owns" the trick.

  **Leaf 9.5: Field Readiness** (Required Leaf)
  *   **Definition:** The "who" is irrelevant because the field itself was the actor. The discovery was a phase transition in the technology, not an individual act.
  *   **Status:** Standard position (Externalism/Zeitgeist).
  *   **Diagnosis:** Coherent. Matches Camp A.

  **Leaf 10: Credit is Illusory**
  *   **Definition:** The question "who made it" is malformed. The artifact selects the authors, not vice versa.
  *   **Status:** Unnamed; post-structuralist leanings.
  *   **Diagnosis:** Merely unattractive to engineers seeking recognition.

  *(Note: I have expanded the Q6 branches to ensure the required leaves are reachable. Leaf 9.5 is reachable if Q1 is Yes and the user rejects the premise of Q6.)*

