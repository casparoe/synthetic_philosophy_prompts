      *   Sample Size Rationale: Power analysis. To detect a 3% defect rate with 95% confidence, you need roughly 100 clean failures. But since we want to *prevent* approval unless the rate is effectively zero on known logic, we require a suite of N=200 deterministic cases. If >0 fail, reject.
