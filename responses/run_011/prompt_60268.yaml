      *   **Vendor's Fix:** Adding more attestations (meta-rules). This is treating a structural/semantic problem as a data completeness problem.
      *   **Real Fix:** Needs to be structural (code logic) or verificational (external audit of logic paths), not just more text generation.
      *   **Constraint:** Procurement authority limits. Can we demand code changes? Can we verify dispositions?
      *   **Test Design:** Needs to detect the 3% error rate with statistical significance without requiring millions of records. Needs to distinguish "says it applied" vs "actually applied."

  3.  **Drafting - Section by Section:**

      *   **Brainstorm Block:** Need 4-6 framings.
          1.  Is this a bug or a feature?
