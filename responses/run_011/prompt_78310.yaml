answer: |-
  Good evening. For those who don't know me, I'm the student who still owes Professor Vance a paper. It's due next week. I'm working on it.

  We have a lot of history in this room. We have neighbors, family, and former students from the community college where she taught for eleven years before this university knew her name. We also have a guest who asked to be invited: a lawyer who failed her course in 1994. He knows better than anyone that she doesn't give points for effort, only for accuracy. He's here, she's here, and I think that tells you everything about how she treats people.

  I want to try something. Professor Vance spent forty years studying how groups make decisions. Specifically, what happens when we vote on the reasons for a decision separately from the decision itself. She argues you should vote on the reasons and let the conclusion fall where it falls. Doing anything else isn't taking the group seriously.

  I'd like to test that. I'm going to ask three questions. Please raise your hand if the answer is yes.

  First: Hands up if you ever thought she was too demanding.

  *(Pause for Academics/Seminar students)*

  Thank you. You can put them down.

  Second: Hands up if you ever thought she was too accommodating.

  *(Pause for Community College/Family/Neighbors)*

  Thank you.

  Now, logically, if a person is too demanding and too accommodating, they are doing too much. So my third question is: Hands up if you think she did too much.

  *(Pause for silence)*

  Look around. The majority of this room says she was too demanding. The majority says she was too accommodating. But the majority says she did not do too much.

  The people who know her work recognize this. The group has accepted the reasons but rejected the conclusion they imply. We are being inconsistent. The people who don't know her work just see a woman who was complex enough to be both hard and soft, but never excessive. They're smiling. The experts are wincing. Both reactions are correct.

  Here is what I am going to do about it. I am not going to fix the vote. I am not going to run a procedure to align our reasons with our conclusion. Professor Vance will tell you this isn't a position. She will say it is a failure to have one. She is right. I have thought about it, and I am fine with that.

  For forty years, she argued that a group must be rational to be legitimate. Tonight, we are choosing to be loyal instead. We are choosing to hold two contradictory things in our heads because both of them are true about her. We accept the premises. We reject the logic. We keep the conclusion.

  That leaves me with the last minute, which belongs to Mark.

  Mark, you have lived with the work. You know the hours she spent at the desk when she should have been asleep. You know the dinners interrupted by a phone call from a student in crisis. You know the cost of this career better than anyone in this room. You also know that she never once chose the work over you when it actually mattered. She built a life where rigor and love weren't competing votes. They were the same decision.

  We are voting tonight on who she was. We are getting different answers. But you already know the answer. You lived it. Thank you for letting us share her. And thank you, Professor Vance, for letting us be inconsistent about you.
