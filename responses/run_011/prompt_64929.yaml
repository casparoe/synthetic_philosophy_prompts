answer: |-
  Your recollection of Harsanyi's Aggregation Theorem is remarkably sharp for a layperson, but it needs one precise correction. The theorem does not require that the group merely respect indifference; it requires the **Pareto Principle**: if *every* individual prefers Gamble A to Gamble B, the group must prefer A to B. Combined with the assumption that both individuals and the group act rationally under risk (satisfying the axioms of Expected Utility), this forces the group's utility to be a weighted sum of individual utilities. The weights must be positive, but the theorem does *not* prove they must be equal. It also does not prove that one person's "utility unit" is comparable to another's; it assumes that such a comparison is meaningful enough to sum.

  Here is the specification you asked for, derived from the logic of that theorem and the practical conflicts you face.

  ### The Specification

  **1. Coherence (Transitivity and Completeness)**
  *   **The Situation:** You face Scenario 3. The committee must choose between the shelter and the road work. If you say they are "incomparable," you cannot sign a budget. If you say Shelter > Roads, then Roads > Clinic, you cannot end up saying Clinic > Shelter without looking foolish.
  *   **The Requirement:** The rule must produce a complete ordering (no "incomparable" verdicts) that does not cycle.
  *   **Status:** **Non-negotiable.** A governing body that cannot decide or contradicts itself forfeits the authority to allocate public funds.

  **2. Unanimity (The Pareto Principle)**
  *   **The Situation:** You face Scenario 2. Every household prefers the coin flip gamble to the status quo before the coin is tossed. If the committee rejects the gamble, it is overruling every single constituent's judgment of their own interest.
  *   **The Requirement:** If every individual prefers option A to option B, the group ranking must place A above B.
  *   **Status:** **Non-negotiable.** To defend a decision against the losing end, you cannot ignore the unanimous will of the winners and losers combined.

  **3. Measurement (Cardinal Comparability)**
  *   **The Situation:** You face Scenario 1. One member rates a benefit a "seven," another a "four." To sum these, you must assume the "units" of satisfaction are comparable across people. If one person's "one" is a whisper and another's is a scream, the sum is nonsense.
  *   **The Requirement:** Individual well-being must be measurable on a scale where zero and unit size mean the same thing for everyone, allowing addition.
  *   **Status:** **Commitment of one camp (Welfarists).** Skeptics argue we can only rank preferences (ordinal), not measure intensity. Harsanyi's theorem collapses without this.

  **4. Anonymity (Equal Weights)**
  *   **The Situation:** You face Scenario 6. Why should the shelter resident's gain count the same as the commuter's? Harsanyi's math allows positive weights, but not necessarily equal ones.
  *   **The Requirement:** The rule must treat all individuals' utilities identically; no person gets a multiplier based on identity or status.
  *   **Status:** **Commitment of one camp (Egalitarians).** This is a moral choice, not a logical necessity. A technocratic rule could weight taxpayers higher than non-taxpayers.

  **5. Independence (Linearity)**
  *   **The Situation:** You face Scenario 2 again. The committee evaluates the coin flip. This axiom demands that the value of the gamble is the average of the values of the outcomes. It forbids penalizing the gamble simply because the *outcome* is unequal, provided the *expectation* was good.
  *   **The Requirement:** The group's ranking of gambles must depend only on the probabilities and final utilities, not on how the risk is distributed or correlated between people.
  *   **Status:** **Non-negotiable for Harsanyi, contestable generally.** This is the mathematical engine that forces the "weighted sum" result.

  **6. Welfarism (Consequence Only)**
  *   **The Situation:** You face Scenario 5 and 7. The shelter resident is content due to adaptation; the commuter's gain came from a unjust land grab. Welfarism says only the final level of satisfaction matters, not how it was achieved or whether the preference is "worthy."
  *   **The Requirement:** The social ordering depends solely on the vector of individual well-being levels, ignoring history, rights, or the source of preferences.
  *   **Status:** **Commitment of one camp (Utilitarians).** Deontologists and justice-focused members will reject this.

  **7. Fixed Population**
  *   **The Situation:** You face Scenario 4. New residents arrive. Does their well-being count? Harsanyi's theorem assumes the set of people is fixed.
  *   **The Requirement:** The rule applies to a defined set of individuals; it does not automatically account for changing who exists.
  *   **Status:** **Commitment of the standard model.** Extending the rule to variable populations creates severe paradoxes (like the "Repugnant Conclusion").

  ***

  ### The Impossibility

  You asked which subsets of these requirements cannot be satisfied together. The conflict lies between **Unanimity (Pareto)**, **Independence**, and a desire for **Equity Sensitivity** (specifically regarding Scenario 2).

  If you insist on **Unanimity** (if everyone wants the gamble, take it) and **Independence** (value the gamble by its average outcome), you are mathematically forced to ignore the *distribution* of the result. You cannot simultaneously satisfy Harsanyi's conditions and demand that the committee reject a coin flip that everyone wants, simply because it leaves one person ruined and another rich.

  If you want to reject that gamble to protect the loser (Equity Sensitivity), you must violate **Independence**. You would be saying the *structure* of the risk matters, not just the sum of expectations.

  **The Single Requirement that Knocks Out the Most Candidates:**
  **Independence.**
  This is the linchpin. If you keep Independence, you are forced into a weighted sum (Utilitarianism or Harsanyi's Observer). If you drop Independence to allow for concern about inequality or risk distribution, you invalidate the Harsanyi theorem entirely and open the door to Prioritarianism or other non-linear rules. It is the strictest filter on the mathematical form of the rule.

  ***

  ### The Contenders

  **Equal-Weight Summation of Realized Well-Being**
  This rule satisfies Coherence, Unanimity, and Anonymity. It is the simplest to defend: "We maximized the total good." However, it fails on Equity Sensitivity (Scenario 2); it is indifferent between a world where everyone is moderately happy and one where half are ecstatic and half are destitute, provided the sum is equal. It also struggles with Scenario 5, as it counts malicious or adapted preferences equally with genuine needs, and it offers no guidance on Scenario 4 (new residents) without risking the "Repugnant Conclusion" (favoring a massive population of barely-living lives).

  **Weighting Gains to the Worse-Off More Heavily (Prioritarianism)**
  This rule addresses Scenario 2 and 6 directly; it prefers the equal distribution over the unequal gamble, even if the total sum is slightly lower. It feels more just to the committee. However, to achieve this, it must violate the **Independence** axiom. This makes it vulnerable to charges of incoherence under risk and complicates the defense: you must explain why you overruled a unanimous preference for a gamble because you disliked the inequality of the outcome. It also requires a defensible baseline for who counts as "worse-off" (Scenario 1), which reintroduces the measurement problem.

  **The Equal-Chance Gamble (Harsanyi's Impartial Observer)**
  This rule identifies the social choice with what you would choose if you had an equal chance of being *any* person in the town. It derives equal weights from rationality rather than moral assertion, which is a strong defensive position. It handles Scenario 1 by forcing a common scale behind the "veil." However, like Summation, it relies on **Independence**, so it cannot penalize the unequal outcome of the coin flip in Scenario 2 if the ex-ante expectation was positive. It also remains strictly Welfarist (Scenario 7), ignoring whether gains were unjustly acquired, and assumes a fixed population (Scenario 4), offering no help when new residents arrive.
