answer: |-
  (i) THE QUESTION

  **SUMMER EXAMINATION**
  **PHILOSOPHY OF SCIENCE: REALISM AND TRUTH**
  **TIME ALLOWED: 75 MINUTES**

  **INSTRUCTIONS TO CANDIDATES**
  Answer the compulsory question below. You may assume standard propositional logic. You are not expected to know any external literature or historical attributions; all necessary definitions are provided in the stem. Marks are awarded for the clarity of your logical derivations and the depth of your philosophical analysis.

  **QUESTION**

  Consider a propositional language containing exactly two logically independent atomic sentences: $H$ ("it is hot") and $W$ ("it is windy"). The actual world is such that both $H$ and $W$ are true.

  Let $Cn(T)$ be the set of all logical consequences of a theory $T$. We divide $Cn(T)$ into $Cn_T(T)$ (the true consequences) and $Cn_F(T)$ (the false consequences).
  **Definition:** Theory $A$ is at least as truthlike as theory $B$ ($Vs(A) \ge Vs(B)$) if and only if:
  1. $Cn_T(A) \supseteq Cn_T(B)$ (A contains all of B's true consequences), AND
  2. $Cn_F(A) \subseteq Cn_F(B)$ (A contains none of B's false consequences that B does not contain).
  $A$ is strictly more truthlike than $B$ if $Vs(A) \ge Vs(B)$ and the theories are not logically equivalent.

  **(a)** Consider four theories:
  $T_1: H \land W$
  $T_2: W$
  $T_3: H \land \neg W$
  $T_4: \neg W$

  Using the Definition above, determine which pairs are comparable. You must explicitly identify the **witnesses** (specific consequences) that establish strict superiority or block comparison. Sketch the resulting ordering. What general pattern do these four cases exhibit regarding the comparison of false theories? **[10 marks]**

  **(b)** A proposed repair suggests abandoning consequence sets. Instead, write a theory in **irredundant Conjunctive Normal Form (CNF)** (a conjunction of clauses where removing any clause weakens the theory). Assign a score: +1 for each clause true in the actual world, -1 for each clause false.
  Calculate the score for $T_1$ through $T_4$. Does this yield a total order?
  Does this repair succeed as a definition of truthlikeness? Demonstrate your answer by constructing two logically equivalent formulations of the same theory within this two-atom language that receive different scores. Explain why demonstrating this by adding new atoms to the language would fail to make your point. **[10 marks]**

  **(c)** Suppose a measure of truthlikeness is well-defined only relative to a chosen primitive vocabulary. Can such a measure still account for (i) scientific progress as theory replacement, and (ii) the realist claim that mature theories are approximately true? Do not simply reject the project. Explain what a defender of truthlikeness must positively establish to save the notion from being merely syntactic. **[10 marks]**

  ***

  (ii) MODEL ANSWER

  **(a)**
  We assess comparability using the set-inclusion definition. $T_1 (H \land W)$ is the whole truth. Its false content is empty. $T_2 (W)$ is true but weaker. $Cn_T(T_1)$ includes $H$, which is not in $Cn_T(T_2)$. $Cn_F$ for both is empty. Thus $T_1$ is strictly more truthlike than $T_2$. $T_1$ is also strictly more truthlike than $T_3$ and $T_4$, because $T_1$ has no false consequences, whereas $T_3$ and $T_4$ both entail $\neg W$ (a false witness).

  Comparing the false theories requires care. Consider $T_2 (W)$ and $T_3 (H \land \neg W)$. $T_2$ entails $W$ (true); $T_3$ does not. So $T_2$ has more truth content. However, $T_3$ entails $\neg W$ (false); $T_2$ does not. So $T_3$ has more false content. Since neither satisfies both conditions of the Definition, they are incomparable. The witness for $T_2$'s superiority is $W$; the witness for $T_3$'s superiority (in falsehood) is $\neg W$.

  Similarly, $T_2$ and $T_4 (\neg W)$ are incomparable. $T_2$ has true consequence $W$; $T_4$ has false consequence $\neg W$.
  Finally, compare $T_3 (H \land \neg W)$ and $T_4 (\neg W)$. $T_3$ entails $H$ (true), which $T_4$ does not. So $T_3$ has more truth content. However, $T_3$ entails $H \land \neg W$ (false), which $T_4$ does not. So $T_3$ has more false content. They are incomparable.

  **Ordering:** $T_1$ is at the top. $T_2, T_3, T_4$ are pairwise incomparable below it.
  **Pattern:** While true theories are ordered by logical strength (stronger is better), false theories are generally incomparable. Increasing logical strength in a false theory tends to increase both true and false content simultaneously, violating the condition that false content must not increase.

  **(b)**
  We calculate scores based on irredundant CNF clauses.
  $T_1 (H \land W)$: Clauses $H, W$. Both true. Score: $+1 + 1 = +2$.
  $T_2 (W)$: Clause $W$. True. Score: $+1$.
  $T_3 (H \land \neg W)$: Clauses $H, \neg W$. $H$ true, $\neg W$ false. Score: $+1 - 1 = 0$.
  $T_4 (\neg W)$: Clause $\neg W$. False. Score: $-1$.
  This yields a tidy total order: $T_1 > T_2 > T_3 > T_4$.

  However, the repair fails because the score is not invariant under logically equivalent reformulation. Truthlikeness should be a property of the proposition, not the syntax.
  **Demonstration:** Consider the theory $H$.
  Formulation A: $H$. Irredundant CNF is just the clause $H$. Score: $+1$.
  Formulation B: $(H \lor W) \land (H \lor \neg W)$. This is logically equivalent to $H$. It is in CNF. Is it irredundant? Yes; removing $(H \lor W)$ leaves $(H \lor \neg W)$, which does not entail $H$ (if $H$ is false and $W$ is true, the remainder is true but $H$ is false).
  Scoring Formulation B: Clause $(H \lor W)$ is true (since $H$ is true). Clause $(H \lor \neg W)$ is true (since $H$ is true). Score: $+1 + 1 = +2$.
  The same theory receives different scores (+1 vs +2) depending on formulation.
  **Why not add atoms?** Demonstrating non-invariance by adding a new atom (e.g., $R$) would not prove the defect. A measure might legitimately depend on the expressive resources of the language. The defect here is that the score varies within a *fixed* language via mere logical rewriting. This shows the measure tracks syntactic complexity, not proximity to truth.

  **(c)**
  If truthlikeness is vocabulary-relative, it threatens the two core motivations for the concept.
  First, regarding **progress**: If theory change involves a shift in vocabulary (e.g., from phlogiston to oxygen), a vocabulary-relative measure cannot judge the later theory as closer to truth unless the new vocabulary is privileged. Progress would reduce to pragmatic utility within a linguistic framework, not ontological improvement.
  Second, regarding **approximate truth**: Realism claims our best theories latch onto mind-independent structures. If truthlikeness depends on our choice of predicates, "approximate truth" becomes relative to human conceptual schemes, undermining the realist's claim to describe the world as it is.

  However, this does not bankrupt the project. A defender must argue that the sciences do not use arbitrary vocabularies but converge on a **privileged ontology** (natural kinds, fundamental magnitudes). If the universe has a objective structure, there is a "correct" set of primitives for describing it. The defender must establish that truthlikeness is invariant relative to *that* privileged vocabulary, even if not invariant across all possible languages. The technical defect of the CNF measure shows that syntax is insufficient, but it does not prove that no objective similarity metric exists. The burden is to show that scientific predicates track real similarities, making the vocabulary choice non-arbitrary.

  ***

  (iii) MARKING SCHEME

  **Total Marks: 30**

  **Part (a): 10 Marks**
  *   **Correct Ordering (3 marks):** $T_1$ top; $T_2, T_3, T_4$ incomparable below.
  *   **Witness Identification (4 marks):** Must cite specific sentences (e.g., "$W$ is in $Cn_T(T_2)$ but not $T_3$"; "$\neg W$ is in $Cn_F(T_3)$ but not $T_2$").
  *   **General Pattern (3 marks):** Identification that false theories are incomparable because gaining truth content typically increases false content (the "content" problem).

  **Part (b): 10 Marks**
  *   **Score Calculation (2 marks):** Correct scores for $T_1$ to $T_4$ (+2, +1, 0, -1).
  *   **Invariance Demonstration (5 marks):** Must show two equivalent formulations in the *same* 2-atom language yielding different scores (e.g., $H$ vs $(H \lor W) \land (H \lor \neg W)$).
  *   **Explanation of Atom Constraint (3 marks):** Explanation that adding atoms changes the language, whereas the defect is sensitivity to logical rewriting within a fixed language.

  **Part (c): 10 Marks**
  *   **Progress & Realism (4 marks):** Clear articulation of why vocabulary dependence threatens objective progress and approximate truth.
  *   **Nuanced Conclusion (4 marks):** Avoids nihilism. Identifies the need for a "privileged vocabulary" or "natural kinds" defense.
  *   **Clarity (2 marks):** Coherent argument structure.

  **Distinction Criteria**
  *   **First Class (24-30):** Flawless logic in (a) and (b). In (b), explicitly checks irredundancy of the CNF counter-example. In (c), distinguishes between the failure of *this measure* and the failure of the *concept*, articulating the "natural kind" defense precisely.
  *   **Upper Second (18-23):** Correct ordering and scores. May miss the irredundancy check in (b) or give a standard "realism is hard" answer in (c) without specifying the privileged vocabulary requirement.
  *   **Lower Second (12-17):** Gets the ordering but fails to identify witnesses. Fails the invariance proof (e.g., adds atoms).
  *   **Fail (<12):** Fundamental logical errors or failure to engage with the stem definitions.

  **Characteristic Errors & Penalties**
  1.  **Reciting the "Popper Collapse" (Deduct 5 marks in (a)):** Stating "Popper's definition fails" without deriving the incomparability from the provided definition using witnesses.
  2.  **Missing Witnesses (Deduct 3 marks in (a)):** Asserting $T_2$ and $T_3$ are incomparable without citing the specific true/false consequences that block the inclusion.
  3.  **Probability Confusion (Deduct 4 marks in (a)):** Arguing $T_2$ is better than $T_1$ because it is more probable (weaker), ignoring the definition's requirement for truth content.
  4.  **Atom Addition in (b) (Deduct 5 marks in (b)):** Attempting to prove non-invariance by adding a third atom $R$. This misses the point about logical equivalence within a fixed language.
  5.  **Ignoring Irredundancy (Deduct 2 marks in (b)):** Using a redundant CNF (e.g., $H \land (H \lor W)$) for the counter-example.
  6.  **Realist Nihilism (Deduct 4 marks in (c)):** Concluding that because the CNF measure fails, scientific realism is false or the concept of truthlikeness is useless. (Must separate the measure from the concept).
