answer: |-
  Here is the triage procedure, the audit of its blind spots, the application to your sprint, and the honest read on whether this distinction is real or just risk management in disguise.

  ### The 90-Second Triage Procedure

  **Goal:** Route source content to **Payload** (MT + Light Post-Edit), **Performance** (Human Transcreation), or **Can't-Tell** (Senior Linguist Triage).
  **Constraint:** 2 minutes per string max. 15 minutes per batch.
  **Operator:** Project Manager (no linguistics training).

  #### Question 1: The Harm Test (30 seconds)
  **Ask:** "If this is translated literally but awkwardly, does a user fail a task, lose money, or get hurt?"
  *   **Yes:** Route to **Performance** (Human). *Note: This includes medical/legal safety, not just artistic performance. The "act" must be preserved.*
  *   **No:** Go to Q2.
  *   **PM Uncertainty:** If the PM doesn't know the feature's risk profile, they must ask the Product Owner. If PO is unavailable, route to **Can't-Tell**.
  *   **Judgment Call:** Defining "awkwardly." A PM will assume "awkward" means "grammatically wrong," not "culturally confusing." This underestimates risk.

  #### Question 2: The Hook Test (30 seconds)
  **Ask:** "Is the primary goal to make the user *feel* something (amused, persuaded, reassured) rather than just *know* something?"
  *   **Yes:** Route to **Performance** (Human).
  *   **No:** Go to Q3.
  *   **PM Uncertainty:** If the text is "brand voice" but informational (e.g., a friendly error message), default to **Payload** but flag for vendor style guide adherence.
  *   **Judgment Call:** Distinguishing "friendly tone" (Payload) from "brand personality" (Performance). PMs will almost always classify tone as Payload to save budget.

  #### Question 3: The Anchor Test (30 seconds)
  **Ask:** "Does this text rely on English-specific mechanics (puns, rhyme, idioms, pop culture) to make sense?"
  *   **Yes:** Route to **Performance** (Human).
  *   **No:** Route to **Payload** (MT + Light PE).
  *   **PM Uncertainty:** If the PM doesn't recognize the idiom (common with engineer-written copy), they will answer No.
  *   **Judgment Call:** This is the biggest guess. PMs are monolingual or near-monolingual. They cannot spot untranslatables they don't understand.

  ---

  ### The Judgment Call Audit
  *Where the procedure is wearing a costume.*

  1.  **The "Literal" Blind Spot (Q1):** The PM assumes a literal translation is safe if it's not dangerous. In high-context languages (e.g., Japanese, Arabic), a literal translation can be polite but useless, causing the user to "not do the thing" without triggering a safety alarm. The procedure treats this as Payload; it is actually Performance.
  2.  **The "Friendly" Trap (Q2):** PMs view "friendly UI" as Payload (informational). Vendors view it as Performance (voice). This causes budget friction. The procedure forces PMs to decide "Is this voice critical?" which they are unqualified to answer.
  3.  **The Idiom Blindness (Q3):** You cannot ask a non-linguist to identify culture-specific anchors. They will miss 40% of them. This question only catches *obvious* jokes, not *subtle* cultural assumptions.

  **Budget Implications:**
  *   **Payload:** Standard MT + PE rate (e.g., $0.03/word).
  *   **Performance:** Transcreation rate (e.g., $0.15/word + hours).
  *   **Can't-Tell:** Triage rate (Senior Linguist hourly).

  ---

  ### Application to Last Sprint's Four Items

  #### (a) UI String: Count variable, pluralization (Polish/Arabic)
  *   **Q1 (Harm):** No (UI doesn't break, just looks odd).
  *   **Q2 (Hook):** No (Informational).
  *   **Q3 (Anchor):** No (Variables are technical, not cultural).
  *   **Routing:** **Payload.**
  *   **Budget:** Standard MT + PE.
  *   **The Blunt Truth:** This is where the procedure endangers you. Polish and Arabic have complex plural rules (CLDR) that MT often botches (e.g., using dual form incorrectly). The procedure classifies this as Payload because it's not "art," but it requires **Logic Validation**, not just translation.
  *   **Fix:** Override routing. Any string with variables affecting grammar in high-complexity locales (Slavic/Arabic) auto-routes to **Performance (Technical)**.

  #### (b) Marketing Tagline: English homophone
  *   **Q1 (Harm):** No.
  *   **Q2 (Hook):** **Yes** (Persuasion/Brand).
  *   **Q3 (Anchor):** **Yes** (Homophone).
  *   **Routing:** **Performance.**
  *   **Budget:** Transcreation rate.
  *   **Reasoning:** MT will translate the meaning and kill the sound. The scorecard will mark it "Fluent/Accurate," but the campaign fails. The procedure catches this easily.

  #### (c) Patient Leaflet: Insulin Pen
  *   **Q1 (Harm):** **Yes** (Reader might not inject correctly).
  *   **Q2 (Hook):** No (Instructional).
  *   **Q3 (Anchor):** No.
  *   **Routing:** **Performance** (triggered by Q1).
  *   **Budget:** Human Translation + In-Market Usability Testing.
  *   **Reasoning:** You noted the failure mode is "reader doesn't do the thing." This is **Functional Performance**. The text must *perform* the instruction successfully. MT can be grammatically perfect and behaviorally useless.
  *   **The Annoyance:** This blows your budget. It treats a dry instruction sheet like a poem because the *stakes* of the performance are life-or-death. You cannot MT this.

  #### (d) Changelog: 60 entries, 3 jokes
  *   **Q1 (Harm):** No.
  *   **Q2 (Hook):** Mixed.
  *   **Q3 (Anchor):** Mixed.
  *   **Routing:** **Can't-Tell (Batch Level).**
  *   **Budget:** Triage hours to split the batch.
  *   **The Annoyance:** Here is where the procedure grinds your gears. To route correctly, the PM must read all 60 entries to find the 3 jokes. That violates the "2 minutes per string" efficiency goal.
      *   *Option A:* Route whole batch as **Payload**. Risk: The 3 jokes translate literally and make the company look tone-deaf.
      *   *Option B:* Route whole batch as **Performance**. Risk: You overpay for 57 boring strings.
      *   *Option C (Procedure Compliant):* Route to **Can't-Tell**. Pay a senior linguist 1 hour to split the batch.
  *   **Verdict:** The procedure forces Option C. It demands you pay for the split. If you refuse, you must accept Option A's risk.

  ---

  ### The Reality Check: Does the Split Earn Its Keep?

  **Honest Read:** The Payload/Performance split is **Risk Ranking with a Philosophy Hat.**

  It does not map cleanly onto "Meaning vs. Form." It maps onto "Consequence of Failure."
  *   **Payload** = Low consequence if the *vibe* is off, high tolerance for literalism.
  *   **Performance** = High consequence if the *effect* is lost (whether that effect is buying a product, laughing at a joke, or safely injecting insulin).

  **Does it work?**
  Yes, financially. It stops you from paying transcreation rates for error logs. It stops you from MT-ing your brand slogan.
  **Where it collapses:**
  It collapses on **Implicit Culture.** A "Payload" string like "Save Changes" is safe in German. In a high-power-distance culture, a direct imperative might be perceived as rude, causing friction. The procedure calls this Payload. The contractor calls this a failure of performance.
  **The Verdict:**
  Keep the procedure. It creates a defensible budget line. But acknowledge to your PMs that **Payload does not mean "No Brain."** It means "Low Risk."
  For the two languages nobody reads, you cannot use this procedure alone. You must buy **In-Market Spot Checks** for the Performance bucket. If you don't, the scorecard will say "Green" while the user experience says "Broken," and you won't know until churn data tells you six months later.

  **Final Instruction to PMs:**
  "If Q1, Q2, or Q3 is Yes, you are buying *outcome assurance*, not words. If you aren't sure, you are buying *triage time*. Do not buy MT for uncertainty."
