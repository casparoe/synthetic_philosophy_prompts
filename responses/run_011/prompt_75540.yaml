  Based on the five rulings, the Director's decision procedure operates on a hierarchy of validity constraints, prioritizing methodological rigor over intuitive narrowness or breadth.

  **Consistent General Rules:**
  *   **The Ex Ante Constraint (Ruling 4):** Class membership must be determinable using only information available at the forecast date ($t_0$). Any class definition that relies on knowing the outcome (e.g., survival duration post-shock) is invalid.
  *   **The Process Homogeneity Principle (Ruling 2):** A class is valid only if its members share the causal process generating the outcome. Descriptive matching (region, regime type) is inferior to mechanism matching if the latter captures the specific survival dynamic, *provided* the mechanism is valid.
  *   **The Independence Requirement (Ruling 3):** A causal mechanism used to justify a narrow class cannot be derived primarily from the cases within that class. Evidence must be independent to avoid circularity.
  *   **The Distributional Threshold (Ruling 1 & 5):** A class must constitute a statistical distribution, not a list of anecdotes. Standalone classes generally require $n \geq 7$ (Ruling 2 accepts 7; Ruling 1 rejects 4). Classes with $n < 5$ may only be used as weighted components of a composite (Ruling 5), and only if the mechanism is "well-established."
  *   **The Adjustment Protocol (Ruling 3 vs. 2):** Adjustments from a base rate are permitted only if based on variables that could have been coded for all class members ex ante. Narrative adjustments specific to the case (e.g., "competent management") are prohibited.

  **Excluded Rules:**
  *   **"Narrowest is Best":** Explicitly rejected in Ruling 1 ($n=4$ rejected for $n=22$).
  *   **"Broadest is Best":** Rejected in Ruling 2 ($n=61$ rejected for $n=7$) when process homogeneity is compromised.
  *   **"Outcome Matching":** Explicitly rejected in Ruling 4.

  **Ambiguities and Evidential Conditions:**
  *   **Sample Size Threshold:** There is a tension between Ruling 1 (rejecting $n=4$) and Ruling 5 (accepting $n=3$ in a composite). The standing rule appears to be: $n \geq 7$ for standalone; $n \geq 3$ for weighted components *if* the mechanism is theoretically robust.
  *   **Mechanism vs. Description:** Ruling 2 prefers mechanism ($n=7$) over description ($n=61$). Ruling 3 prefers description ($n=178$) over mechanism ($n=11$) when the mechanism evidence is circular or clustered. The Director prioritizes **methodological validity of the mechanism** over **specificity**. A valid descriptive class trumps a flawed mechanism class.
  *   **Evidential Conditions for Causal Stories:** To justify a narrow class via a causal story, the Director requires: (1) Independent support (not derived from the class itself); (2) Temporal/Regional spread (not clustered); (3) Consensus in literature (not "disagree about the sign").

  ### 2. Prediction of Ruling on the New Case

  **Required Class:** She will require **Class (iii)** (Resource-dependent autocracies, contraction, high debt; $n=21$).
  **Struck Classes:** She will strike **(ii)** and **(iv)**. She will likely reject **(i)** and **(v)** in favor of (iii), though she may permit (v) as a base rate for adjustments if she deems (iii) insufficiently process-homogeneous.

  **Analysis of (iv) and Ruling 4:**
  Class (iv) is defined by regimes that "were still standing five years afterwards." This is a direct violation of Ruling 4. Ruling 4 establishes that a class cannot be specified by reference to how members turned out. (iv) filters on the *outcome* (survival), creating survivorship bias. It must be struck.

  **Analysis of (i) and (v) under Ruling 4:**
  The principle in Ruling 4 does **not** reach (i) or (v). Ruling 4 prohibits conditioning on *future* outcomes relative to a shock (right-censoring bias). Classes (i) and (v) condition on *past* duration (left-truncation), which is known at $t_0$. "Having passed twenty years" and "in their thirty-eighth year" are historical facts at the forecast date, not outcomes.
  *Defense of this reading:* If Ruling 4 prohibited conditioning on age, it would invalidate Ruling 1's accepted class ("governments installed by coup since 1945"), which implicitly conditions on the regime existing long enough to be coded. The Director distinguishes between *selection on the dependent variable* (forbidden, Ruling 4) and *selection on pre-existing covariates* (permitted, Ruling 1). However, she will likely reject (i) and (v) not because they are forbidden, but because they are inferior to (iii) under Ruling 2 (process homogeneity). (iii) captures the specific economic stressor threatening this regime, whereas (i) and (v) pool regimes facing different mortality risks.

  **Analysis of (ii):**
  Class (ii) will be struck. Although $n=4$ might be permissible as a weighted component under Ruling 5, the mechanism fails the **Independence Requirement** of Ruling 3. The literature note states evidence is "drawn largely from these same four regimes" and studies "disagree about the sign." This triggers Ruling 3's prohibition on circular evidence and Ruling 5's requirement for a "well-established" mechanism.

  **Final Determination:**
  She will mandate **Class (iii)**. It mirrors the logic of Ruling 1 (selecting the specific economic context, $n=22$, over the broad universe, $n=141$). It satisfies the Ex Ante Constraint, has a robust sample size ($n=21$), and avoids the circularity of (ii).

  ### 3. Precedent, Strain, and Commitment

  **Closest Precedent:** **Ruling 1.**
  Both cases present a triad of options: a broad descriptive class (R1: $n=141$ / New: $n=74$), a narrow mechanism class (R1: $n=4$ / New: $n=4$), and a specific context class (R1: $n=22$ BoP / New: $n=21$ Resource/Debt). In Ruling 1, she chose the specific context class. Predicting (iii) follows this "Goldilocks" principle: specific enough to capture the process, large enough to be a distribution.

  **Where the Analogy Strains:**
  The strain lies in **Ruling 3**. In Ruling 3, when the narrow mechanism class ($n=11$) was flawed (circular/clustered), she did not choose a "middle" class; she reverted to the broad universe ($n=178$) and ordered adjustments. In the new case, the narrow mechanism class (ii) is also flawed (circular/disagreed).
  *   *If she follows Ruling 3 strictly:* She should demand Class (v) (All Autocracies) and require the team to adjust for economic stressors.
  *   *If she follows Ruling 1:* She accepts Class (iii) as a valid reference class in its own right.

  **Commitment:**
  By ruling for **(iii)**, she commits to the view that **economic stress contexts constitute distinct causal processes** comparable to regime types. She affirms that a "Middle" class is preferable to a "Broad + Adjustment" model *if* the Middle class is methodologically sound. This limits the scope of Ruling 3's "revert to universe" mandate: that mandate applies only when *no* valid intermediate class exists. She also commits to the view that $n=21$ is sufficient for a standalone distribution, whereas $n=4$ is not, even when weighted, if the mechanism is contested.

  **Ruling 2 vs. Ruling 3 Tension:**
  Ruling 2 argues against (v) (don't pool different processes). Ruling 3 argues for (v) (if mechanism fails, start broad). By choosing (iii), she sidesteps this by finding a class that is broad enough to avoid Ruling 3's circularity trap but specific enough to satisfy Ruling 2's homogeneity requirement.

  ### 4. Allowance of Adjustments

  **Verdict:** She will **allow** an adjustment for the failed coup, but **only** under the Ruling 3 protocol, not the Ruling 2 narrative.

  **Criterion:** The distinction is **Codability vs. Narrative**.
  *   **Ruling 2 (Rejected):** The team wanted to adjust upward because "economic management had been competent." This is a qualitative story about the specific case that cannot be coded across the reference class.
  *   **Ruling 3 (Accepted):** Adjustments are allowed if tied to a feature "that could have been coded for class members ex ante."
  *   **Application:** The team may adjust the estimate derived from Class (iii) if they can code a binary variable "Failed Coup in preceding 24 months" for all 21 members of Class (iii) and calculate the differential survival rate. They may **not** adjust based on the *quality* of this specific purge (e.g., "this general is more loyal than others"), as that is a case-specific story (Ruling 2).

  ### 5. Discriminating Case

  To separate the ambiguities in the record, I propose the following hypothetical case:

  **Case Features:** A theocratic regime facing a succession crisis.
  **Candidate Classes:**
  *   **A (Narrow Mechanism):** Theocratic successions where the heir was a religious scholar ($n=5$). *Flaw:* Evidence for this mechanism is drawn 80% from these 5 cases (Circularity, Ruling 3).
  *   **B (Middle Context):** Theocratic regimes facing succession during an economic contraction ($n=18$). *Valid:* Ex ante, spread out, independent evidence.
  *   **C (Broad Universe):** All theocratic successions since 1900 ($n=120$).

  **Discriminating Readings:**
  1.  **Ruling 1 vs. Ruling 3 (Class Selection):**
      *   *Reading 1 (Ruling 1 Dominant):* She selects **Class B**. When a valid "Middle" class exists, it is preferred over the Broad Universe, even if the Narrow Mechanism class is flawed.
      *   *Reading 2 (Ruling 3 Dominant):* She selects **Class C**. If the primary mechanism hypothesis (A) is methodologically tainted, the team must reset to the institutional universe (C) and treat the features of B as ex ante adjustments.
      *   *Discrimination:* A ruling for B confirms that valid intermediate classes block the "revert to universe" remedy of Ruling 3. A ruling for C confirms that methodological failure in the mechanism proposal forces a universe baseline regardless of intermediate options.

  2.  **Ruling 3 Grounds (Clustering vs. Circularity):**
      *   To separate the two grounds offered in Ruling 3 (Temporal/Regional Clustering vs. Circular Evidence), propose a class ($n=15$) that is **Temporally Clustered** (all cases within one decade) but has **Independent Evidence** (mechanism supported by work outside these cases).
      *   *Outcome:* If she rejects it, **Clustering** is the binding constraint (global conditions confound the class). If she accepts it, **Circularity** was the binding constraint in Ruling 3, and clustering is merely a heuristic for independence.
      *   *Assessment:* Given her emphasis on "global conditions" in Ruling 3, she would likely reject the clustered class even with independent evidence. This suggests the grounds travel together toward a single goal: **External Validity**. However, a ruling accepting the clustered class would prove that Circularity is the stricter rule.
