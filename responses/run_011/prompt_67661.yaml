          *   **Refined Logic:** The standard abolitionist (Spooner/Douglass) argument on 3/5 was: The clause assumes the enslaved are *persons* ("free persons" + "all other persons"). It does not sanction slavery. Some argued it was a *discount* on slave state power compared to counting slaves as full persons, but the main point was that it didn't recognize them as *property*.
