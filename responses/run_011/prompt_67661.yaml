          *   **Assessment:** **Wrong/Misleading.** This is the biggest anachronism. Douglass *did* care about the "objects and purposes" (Preamble). He argued the *text* didn't sanction slavery, but he leaned heavily on the *purpose* of the document (liberty) to interpret ambiguous text. He didn't embrace modern "textualism" which often excludes purpose. He argued the *secret intentions* of the framers couldn't override the *declared purposes* of the Preamble.
