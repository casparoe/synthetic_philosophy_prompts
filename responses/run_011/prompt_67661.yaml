          *   **Assessment:** **Accurate (Directionally).** The author gets the direction right. Douglass argued that since enslaved people were counted as 3/5 for representation, they were *not* recognized as full property (which would be 5/5) nor as full persons. By counting them as less than whole persons for representation, the Constitution actually penalized slave states compared to if they were counted as whole persons (which would give the South more power) or if they weren't counted at all (which would give the South more power relative to the North in some calculations, though the 3/5 compromise was a boost for the South compared to 0/5). Wait, let's check the logic.
