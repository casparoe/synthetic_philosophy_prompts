  I've been stuck on this for four days and my reading group has been no help, so I'm outsourcing it. Context: I finally got around to the physics-people-doing-philosophy shelf and read Schrödinger's *What Is Life?* epilogue plus the Tarner lectures that became *Mind and Matter*, and the Vedanta thread is way more load-bearing than I expected. He doesn't wave at it as a curiosity, he thinks it's the actual solution. In *Mind and Matter* he says of the experiencing ego that "It is identical with the whole and therefore cannot be contained in it as a part of it," and then names the trouble that creates — "there appears to be a great multitude of these conscious egos, the world however is only one," his arithmetical paradox. His fix is the Upanishadic one: the multitude is appearance, there's one consciousness seen through many facets, and the paradox dissolves because there was never a plurality to count. I can follow that as a vibe. What I can't survive is what a friend of mine (old LessWrong meetup crowd, annoyingly good at this) did to it — he took Schrödinger's own standard for what counts as warrant and ran it three times instead of once, and it ends up somewhere I think even Schrödinger would refuse to go.

  Here's the arguement, as he laid it out to me:

  (1) Schrödinger's whole move rests on a principle of evidence: a claim about how many centers of experience there are can be warranted only by experience itself, because experience is the only place consciousness ever shows up.
  (2) Experience never presents consciousness in the plural. I find exactly one experiencing subject — this one — and never a second alongside it. Other people's bodies, faces and reports are given; their experiencing never is.
  (3) So the plurality of minds has no warrant. It's a posit of exactly the kind Schrödinger dismisses elsewhere, and the honest conclusion is his: the many egos are appearance.
  (4) But the same standard applies within a life, not just across lives. Experience never presents my consciousness as plural across time either. Remembering yesterday's headache is a present experience; dreading next week's dentist is a present one. I never encounter past-me or future-me, only now-me.
  (5) So by the logic of (1)–(3), the plurality of moment-subjects is unwarranted too. There is one momentary consciousness, and the person stretched across seventy years is appearance in just the way the crowd of persons is.
  (6) Same again for pains. When two people are in agony, only one agony is ever given; the other is inferred from behavior and testimony, which (1) says is no warrant at all. So there is never more than one pain in the world.
  (7) Therefore Schrödinger's premises entail a view on which exactly one subject has exactly one moment of experience, in which nobody else's suffering is ever given, hence in which suffering never aggregates and nobody is ever harmed by anything.
  (8) That isn't compassion-grounding monism, it's solipsism of the present instant — and it's also empirically indistinguishable from the many-minds view, since on (1) neither plurality nor unity is ever given, so the position can't be wrong and therefore can't be right.
  (9) (7) and (8) are unacceptable, so one of (1)–(6) goes.

  Where I'm stuck: steps (4) and (6) don't feel like they're smuggling anything, they look like the same inference pointed at time and then at pain, so I keep wanting to blame something earlier. But (2) reads like a plain report of how things seem, and I'd hate to give it up, and (1) is a principle Schrödinger needs in other places — he uses something like it to treat the external world as a construction out of sense data. Though note he also complains in his Nobel lecture that confining science to what can be observed makes things too easy for us, which sounds like a man who doesn't fully accept (1) himself. Reject (1) and I've tossed out the only thing that made his case interesting rather than mystical; reject (2) and I'm apparently claiming I do encounter other people's consciousness, which is false; keep everything and I've just argued myself out of ever doing another QALY calculation, because (6) says the sums have nothing to sum. One more thing worth pricing in: Parfit's reductionism about personal identity looks like it wants (5) or something near it, and Parfit is not a mystic, so whatever breaks (5) had better not break him too.

  No need to quote Schrödinger back at me, I have the books — I want the diagnosis. Please use these sections, in this order:

  - **The short answer** — 3–5 sentences: which step you reject and the one-line reason.
  - **Why it looked fine** — ~300 words on what makes that step survive a first read. If it's a scope or quantifier slide, or an equivocation on "never given in the plural," say so in those terms and show the two readings; if instead you think the chain is valid and a premise is just false, say that and name which.
  - **The price list** — ~500 words, one short subsection per exit: reject (1); reject (2); accept (2) but reject the move from (2) to (3); reject (4) as a misdescription of experience; bite the bullet on (7). For each, what it costs, what you lose elsewhere, and who else in the literature has already paid that bill.
  - **The Parfit check** — ~200 words on whether your diagnosis lets reductionism about personal identity through unharmed, or whether I've accidentally written an argument against Parfit.
  - **What survives** — ~250 words on whether Schrödinger keeps anything: is there a non-empty version of the unity claim, and does the ethical payoff (compassion because you literally are everyone) survive stripped of the metaphysics?
  - **Steelman the bullet** — ~150 words giving the best case that the argument is valid and (7) isn't actually absurd.
