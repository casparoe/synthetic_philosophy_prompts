      *   *Local Imperfections:* Wine quality varies within vintage (individual variation); Wine doesn't age socially (people do).

  4.  **Drafting - Step 3: Addressing Pressure Points:**
      *   *Point 1 (Boundaries):* Wine harvest is biological/climatic event. Cohort cuts are arbitrary (e.g., 1980 vs 1981). The analogy fails here because the "sharpness" is illusory in social data.
      *   *Point 2 (Exposure/APC):* Grapes stop growing at harvest. People keep experiencing "period effects" (wars, recessions) and "age effects" (aging). The analogy collapses because the "cellar" (adulthood) changes the wine actively, not just passively storing it. Teasing apart Age, Period, Cohort is statistically notoriously difficult (identification problem).
      *   *Point 3 (Reflexivity):* Wine doesn't know it's 1982. People know they are "Millennials" and act accordingly. This creates self-fulfilling prophecies, not just detection.

