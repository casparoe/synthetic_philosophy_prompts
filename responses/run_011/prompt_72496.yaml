      **Disanalogies**
      *Critical (Bear on Proposal):* Harvest is a natural event; cohort cuts are arbitrary administrative decisions. Grapes do not know their vintage; respondents self-identify with generations, altering behavior. Grapes stop developing at harvest; humans accumulate period and age effects continuously.
      *Local Imperfections:* Wine quality varies within vintages (individual variance); storage conditions vary (life circumstances). These are noise, not structural flaws.

      **Pressure Points**
      1.  *Boundaries:* The analogy fails. A harvest is dictated by ripeness and weather; a generational cut (e.g., 1980 vs. 1981) is desk-bound arbitrariness. Adjacent birth years share nearly identical conditions. Treating arbitrary cuts as "sharp boundaries" creates artificial discontinuities in the data where none exist socially.
      2.  *Exposure (APC Problem):* The analogy collapses. Grapes are sealed at harvest; humans remain exposed to period effects (recessions, pandemics) and age effects (maturation). Statistically, Age, Period, and Cohort are linearly dependent (Cohort = Period - Age). You cannot "blind-taste" cohort effects without controlling for the others, yet the analogy suggests cohort is distinct from the "cellar" (age/period). It implies separability where econometrics warns of identification failure.
      3.  *Reflexivity:* The analogy breaks. Wine does not read labels. When respondents internalize "Gen Z" or "Boomer," they perform the category. This makes generation an endogenous variable, not an exogenous classification like vintage. Treating it as "hard" ignores that the classification itself changes the substance.

      **Verdict**
      The analogy does not support treating generation as a hard classification variable. It masks the arbitrariness of boundaries, ignores the Age-Period-Cohort identification problem, and denies respondent reflexivity. It risks reifying administrative cuts into natural kinds.

      **Alternative**
      Preserve the insight—early conditions leave lasting traces—without the reification. Use **"Linguistic Accent."** An accent is acquired during a critical developmental window and persists despite later migration (period effects) or aging. It is real and detectable, but it does not define the speaker's entire vocabulary (attitudes), nor does it have sharp borders (dialect continua). It allows you to measure the *trace* of formative conditions without forcing respondents into rigid, arbitrary boxes that claim to explain away income or education effects.

