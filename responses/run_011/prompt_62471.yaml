answer: |-
  **Scenario**
  The Atoll Cooperative is a semi-autonomous island community of 500 residents managing a shared sea-wall and freshwater lens, benefits of which are non-excludable to those on the lowlands. K, a geologist living on high ground with a private deep well, has explicitly refused connection to the communal water grid and contributes no labor to the scheme, thus accepting no benefits that could generate fair-play obligations. The Council is forcibly relocating a minority clan to low-lying land to build a resort; ordinary channels of appeal are closed. K plans to lock themself to the main sluice gate control room during a critical king tide. Publicly, this is a non-violent blockade against unjust relocation, an act ordinarily commendable. However, K knows a technical detail the public does not: during this tide, the gate requires manual override every four hours to prevent saltwater intrusion into the lens. If K blocks access, the freshwater lens becomes brackish, causing immediate kidney failure in named children of the very clan K intends to help, who rely on that water for dialysis.

  **Analysis**

  **Verdicts and Mechanisms**
  The **Political Obligation Theorist** (specifically a Fair Play proponent) argues that political duties arise from the reciprocal acceptance of benefits within a cooperative scheme. Since K has not accepted benefits (private well, high ground) and the scheme is currently enforcing an injustice, the principle of fair play generates no obligation, and any natural duty to support just institutions is overridden by the Council's wrongdoing. Consequently, the duty to obey the law prohibiting the blockade barely bites; K is politically permitted to disobey. The **Philosophical Anarchist** agrees there is no political obligation—the state's authority is irrelevant. However, they argue K is morally forbidden from acting. The reason is not the law's command, but ordinary face-to-face morality: K has a strict negative duty not to cause foreseeable, lethal harm to identifiable innocents. The Anarchist is thus *more* restrictive than the Obligation Theorist, forbidding the act based on neighborly duty rather than state authority.

  **Key Feature and Deletion Test**
  The asymmetry turns on the **causal link between the protest act and specific harm to the victims of the injustice**. The Obligation Theorist focuses on the *source* of the constraint (the state/scheme), which is absent or weakened. The Anarchist focuses on the *consequences* of the act (the neighbors' health), which are present and severe. If we delete the specific harm (stipulate the gate does not affect water quality during this tide), the Anarchist's objection vanishes; they would permit the disobedience since no political duty exists and no ordinary moral duty is violated. The Obligation Theorist's verdict remains unchanged (permitted). The asymmetry dissolves because the Anarchist's restraint was contingent on the harm, not the law.

  **Fair Play Objection and Anarchist Reply**
  A **Fair Play Defender** attacks the "clean hands" stipulation: by choosing to reside on the Atoll, K accepts the security and stability the Cooperative provides, even if they reject the water. Residence implies acceptance; therefore, a fair-play obligation *does* bite, forbidding K from undermining the scheme. This dissolves the asymmetry, as both theorists now forbid the act (one via political obligation, one via ordinary morality).

  The **Anarchist's Reply** invokes the distinction between *receipt* and *acceptance* (Simmons): mere residence does not constitute voluntary acceptance of benefits required for fair play. But even granting the objection for argument's sake, the asymmetry persists in the *weight* of the prohibition. The Fair Play duty is *defeasible* by the state's injustice (the relocation); the Obligation Theorist must weigh the scheme's unfairness against the duty, potentially permitting the act. The Anarchist's duty (not to poison children) is *not defeasible* by the state's injustice. The Anarchist remains more firmly against the act because their constraint derives from the inviolability of specific persons, not the reciprocity of a scheme that has already failed its members.

  **Honesty Check**
  This case can be constructed without cheating, provided the Anarchist's reason is strictly grounded in the harm to neighbors (ordinary morality) and not in a covert respect for the law's coordination function. The divergence is genuine: the Obligation Theorist releases K from *political* constraints due to lack of acceptance, while the Anarchist binds K with *natural* constraints due to causal responsibility. The risk of "authority-shaped" reasons is avoided because the Anarchist explicitly denies the law's authority and cites only the children's kidneys.
