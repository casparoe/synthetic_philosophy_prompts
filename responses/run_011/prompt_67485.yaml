  **MEMORANDUM**

  **TO:** Engineering Standards Panel
  **FROM:** [Your Name], Staff Software Engineer
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation regarding Complaint #2023-04 (Change Control Standard)

  This memo circulates my draft recommendation for Thursday's meeting regarding the complaint filed by Alex against Jordan. We are bound by a thirty-day deadline to issue a recorded finding or non-finding. We cannot amend the Change Control Standard ourselves, but we can recommend amendments to its owner. Below is my proposed path forward, addressing the split in our preliminary discussions.

  **Recommendation and Motion**

  I recommend the panel issue a **Recorded Non-Finding**.

  While the undisputed facts show Jordan merged code without a second approval, the panel's duty is to uphold the integrity of the standard, not merely to count violations. Issuing a finding in this specific context—where the complainant has demonstrated inconsistent enforcement of the same rule during similar incidents—risks transforming the panel into an instrument of selective enforcement. This undermines the legitimacy of the standard itself.

  **Motion to Propose:** "Move to issue a Recorded Non-Finding on Complaint #2023-04 based on the totality of circumstances regarding enforcement consistency, and move to recommend to the Standard Owner that an emergency exception clause be drafted for review within thirty days."

  **Thirty-Day Tasks:**
  1.  Draft the formal non-finding record.
  2.  Submit the emergency clause recommendation to the Standard Owner.
  3.  Confirm with HR whether this non-finding counts as a "strike" under current policy (if unclear, establish this precedent).

  **Handling the Complainant (Alex)**

  Alex has requested to make a statement. The panel should **grant this request** but limit the scope. Alex may speak to the timeline of the incident and his interpretation of the standard. He should not be invited to justify his own past violations or speculate on Jordan's intent.

  Regarding the record: We must not adjudicate Alex's motives. He is not a party to this proceeding. The record should reflect that the panel considered the *pattern of enforcement* associated with the complaint, not the *character* of the complainant. In the redacted version shared with Jordan and Alex, we will state that the decision rests on "enforcement consistency metrics" rather than personal conduct. This protects Alex from being tried behind his back while allowing the panel to consider the context of the complaint.

  **Note for HR and Rotating Director**

  This section addresses the concern that we are judging Alex without his presence. We are not judging Alex; we are judging the weight of his complaint.

  Think of it like a referee in a sport. If a player constantly breaks a rule without penalty but demands penalties for opponents breaking the same rule, the referee loses authority if they comply. The objection here is not that Alex is a bad person, but that his enforcement behavior is inconsistent. In this case, Alex waited forty-one minutes for approval during a recent incident when tools worked. He also blocked two engineers mid-incident but helped them find approvers. With Jordan, when tools were broken, he filed a complaint rather than helping find a workaround.

  If we ignore this, we teach engineers that the standard is a weapon to be used against others rather than a safeguard for everyone. A non-finding here does not say Jordan's action was safe; it says the process used to challenge it was compromised. This distinction protects the company from claims of unfair targeting while preserving the rule's importance.

  **The Strongest Case Against This Recommendation**

  The strongest argument against a non-finding is that rules must be blind to remain fair. Two panel members argue that Jordan violated the standard, period. The review system being down is a risk engineers must manage; if no approver is available, the code should not move. Allowing the complainant's history to erase the violation sets a dangerous precedent. It suggests that engineers can violate standards with impunity if they can dig up dirt on their accusers. This creates uncertainty: engineers will not know if a rule applies until they know who is watching. Furthermore, Jordan self-disclosed. Penalizing honesty by ignoring the violation because of who filed the paper may discourage future transparency. If we do not record this finding, we effectively rewrite the standard to include an emergency exception without doing the work to define what "emergency" means.

  I acknowledge this risk. However, I believe the risk of selective enforcement outweighs the risk of ambiguity in this single instance, provided we immediately recommend the standard amendment to clarify emergency procedures.

  **Criteria for Future Complaints**

  To ensure this decision does not create confusion for future panels, I propose we adopt the following criteria. A complaint from an engineer with a prior recorded violation of the same standard should be scrutinized for dismissal if:

  1.  **Inconsistent Response:** The complainant responded differently to a materially similar incident involving themselves or others within the last twelve months (e.g., waiting for approval vs. demanding immediate filing).
  2.  **Remedial Assistance:** In prior incidents, the complainant actively helped others achieve compliance during the incident rather than solely documenting failures after the fact.
  3.  **Tooling Context:** The violation occurred during a documented tooling outage where compliance was technically impossible, contrasting with prior incidents where tooling was functional.
  4.  **Disclosure Timing:** The respondent self-disclosed the violation in the incident report before the complaint was filed.
  5.  **Severity Disparity:** The impact of the respondent's violation is significantly lower than the impact of the complainant's prior violation (e.g., minutes of degradation vs. hours of outage).

  If three or more of these criteria are met, the panel should consider a non-finding or a mitigated finding.

  **Conclusion**

  We are stuck between a broken rule and a broken process. Jordan broke the rule, but the process for catching her is being wielded inconsistently. A recorded finding protects the rule but damages the culture. A recorded non-finding protects the culture but requires us to fix the rule immediately. I choose the latter. We must recommend the emergency clause amendment regardless of our vote, but the non-finding signals that our standards are about safety, not scorekeeping.

  Please review this reasoning before Thursday. I am available to discuss any section prior to the meeting.
