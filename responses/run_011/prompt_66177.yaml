  Metadata & Meaning: House Rules, rev. 7

  1. The canonical identity of any Asset shall be defined exclusively by its submitted metadata record, rendering the audio stream a secondary verification layer for human listening purposes.
  2. In instances where a Track Title functionally describes the Playlist Frame rather than the Audio Content, the Metadata Team must reclassify the Track Title as Playlist Copy and assign a generic identifier to preserve semantic hierarchy.
  3. Post-release metadata edits may only be executed by a Senior Standards Officer if the algorithmic decoder has flagged the Asset as semantically null for more than four consecutive business days.
  4. Should the Playlist Frame alter the perceived meaning of the Audio Content, the Metadata Record must be updated in real-time to reflect the listener's current contextual interpretation rather than the artist's original intent.
  5. Final approval requires the Metadata Record to simultaneously match the static audio waveform, the dynamic user context, and the algorithmic classification vector without introducing latency exceeding zero milliseconds.
