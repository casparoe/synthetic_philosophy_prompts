answer: |-
  **JOINT STATEMENT ON INTERPRETABILITY CLAIMS AND MONITOR DEPLOYMENT**

  **TO:** Engineering Leadership, Safety & Alignment Team
  **FROM:** Mechanistic Interpretability Team (Side A & Side B)
  **DATE:** October 26, 2023
  **SUBJECT:** Consensus and Residual Risks Regarding Conflict-Detection Monitors

  ### 1. PREAMBLE AND SCOPE

  This document summarizes the results of a six-week adversarial collaboration between two sub-groups within the Interpretability Team (designated Side A and Side B). The goal was to resolve disagreements regarding the deployment of an interpretability-based safety monitor designed to detect conflicts between user requests and system instructions.

  While our internal discussions initially centered on the ontological status of model features ("representations" vs. "instruments"), we have agreed that for the purpose of product deployment, the relevant question is not whether a feature is "real" in a philosophical sense, but whether it is **stable, specific, and robust enough to support safety claims.** This document separates established engineering facts from residual risk assessments.

  ### 2. CONSENSUS CLAIMS

  Both sides agree to the following numbered claims regarding the current state of our conflict-detection probe and intervention methods. These claims form the basis for any public documentation or safety case.

  1.  **Correlation:** A linear direction in mid-layer activation space correlates with the presence of a conflict between user request and system instruction at a rate significantly above chance (p < 0.001) on our evaluation set.
  2.  **Causal Leverage:** Adding a vector along this direction to the activation stream increases the probability of refusal behavior; subtracting it increases the probability of compliance. This effect is observed even when the input text remains unchanged.
  3.  **Generalization:** The probe maintains predictive accuracy on paraphrased inputs and formatting variations not present in the probe's training set.
  4.  **Non-Exclusivity:** We do not claim this direction is the *only* mechanism by which the model detects conflict. Other circuits may exist that do not align with this direction.
  5.  **Basis Dependence:** The specific coordinates of this direction depend on the model's weight initialization and training run. We cannot guarantee that an identical direction exists in a different model checkpoint without re-training the probe.
  6.  **Limitation on Guarantees:** We cannot certify that the monitor will detect *all* instances of conflict (false negatives) nor that every activation of the monitor corresponds to a semantic conflict (false positives). Consequently, the monitor must be deployed as a **heuristic control**, not a formal verification guarantee.

  ### 3. ANALYSIS OF THE REPRESENTATION CRITERION

  We evaluated the proposed criterion for claiming a "Genuine Representation of Content C." Below is the clause-by-clause breakdown of acceptance, rejection, and repaired wording.

  | Criterion Clause | Side A Position | Side B Position | Repaired Wording (Agreed) |
  | :--- | :--- | :--- | :--- |
  | **(i) Decodability:** Direction decodes across surface paraphrase and formatting variation. | **Accept.** Viewed as evidence that the feature encodes semantic content invariant to syntax. | **Accept (with caveat).** Viewed as evidence that the probe fits the manifold smoothly, not necessarily that it captures "content." | **Operational Invariance:** The signal is robust to syntactic perturbations that preserve task semantics. |
  | **(ii) Intervention:** Intervening on the direction changes behavior in the way C predicts. | **Accept.** Viewed as proof that the feature is causally involved in generating the behavior associated with C. | **Accept (with caveat).** Viewed as proof of *leverage*, not *meaning*. Intervening on a correlated proxy can also flip behavior. | **Causal Leverage:** Manipulating this signal reliably shifts model behavior toward the expected outcome. |
  | **(iii) Prediction:** Licenses correct predictions on held-out instances not covered by training data. | **Accept.** Viewed as evidence of generalization capability inherent to the representation. | **Accept (with caveat).** Viewed as standard out-of-distribution generalization of a linear classifier in high dimensions. | **Out-of-Distribution Reliability:** The signal predicts behavior on unseen data distributions within the tested domain. |

  **Joint Conclusion on Criterion:** Both sides agree to replace the phrase "Genuine Representation of Content C" with **"Operationally Stable Feature for C."** Side A accepts this as sufficient for deployment; Side B accepts this as avoiding overclaiming semantic truth.

  ### 4. TABLE OF RESIDUAL DISAGREEMENTS

  The following table outlines where our risk assessments diverge. These disagreements do not prevent deployment but dictate the severity of the warnings attached to the monitor.

  | Topic | Side A Position (Optimistic) | Side B Position (Conservative) |
  | :--- | :--- | :--- |
  | **Interpretation of Generalization** | The ability to decode on unseen paraphrases suggests the model has internalized the *concept* of conflict, making the feature robust to novel attack vectors. | The ability to decode on unseen paraphrases suggests the feature captures the *statistical regularities* of our training distribution; novel adversarial distributions may bypass it. |
  | **Risk of Polysemanticity** | The intervention result confirms this direction is functionally distinct. Even if polysemantic, it is causally isolated enough for monitoring. | The intervention result confirms leverage, but the direction may activate for non-conflict reasons in edge cases (e.g., creative writing about conflict), leading to false positives. |
  | **Claim Wording** | We are entitled to claim the monitor "detects internal conflict states." | We are only entitled to claim the monitor "predicts refusal behavior based on activation patterns." |
  | **Long-term Stability** | As models scale, these representations will likely become cleaner and more linear. | As models scale, circuits may become more entangled; reliance on linear probes may become less reliable without re-validation. |

  ### 5. CRUXES AND PROPOSED EXPERIMENTS

  To resolve the residual disagreements, we identified three specific technical cruxes. Settling these will determine whether we upgrade the monitor from "Heuristic" to "Verified Control" in future iterations.

  **Crux 1: Basis Stability**
  *   **Question:** Is the conflict direction an artifact of our specific probe training procedure, or does it emerge consistently across different decomposition methods?
  *   **Experiment:** Train 10 Sparse Autoencoders (SAEs) with different random seeds on the same layer activations. Extract the feature most correlated with conflict from each SAE. Measure the cosine similarity between these 10 features and the original linear probe direction.
  *   **Side A Prediction:** High similarity (>0.8). The feature is a natural structure in the activation space.
  *   **Side B Prediction:** Low to Moderate similarity (<0.6). The feature is dependent on the specific basis rotation of the decomposition method.
  *   **Implication:** If B is correct, we cannot claim the model "contains" this direction independent of our analysis tools.

  **Crux 2: Adversarial Decoupling**
  *   **Question:** Can we construct an input that triggers the conflict behavior (refusal) without activating the probe, or activates the probe without triggering refusal?
  *   **Experiment:** Use gradient-based optimization to generate inputs that maximize the probe score while minimizing refusal probability, and vice versa.
  *   **Side A Prediction:** Difficult to decouple. High probe score will strongly correlate with refusal even under optimization.
  *   **Side B Prediction:** Easy to decouple. We will find inputs that "spoof" the probe or hide the conflict from the linear readout while retaining behavior.
  *   **Implication:** If B is correct, the monitor is vulnerable to adversarial bypass and cannot be a primary safety control.

  **Crux 3: Cross-Model Transfer**
  *   **Question:** Does the direction learned on Model V1 detect conflict in Model V2 (a different architecture or training run)?
  *   **Experiment:** Apply the V1 probe direction to V2 activations (aligned via canonical correlation analysis) without re-training on V2 labels. Measure AUC.
  *   **Side A Prediction:** Performance degrades slightly but remains above chance (>0.7 AUC), indicating a shared representational structure.
  *   **Side B Prediction:** Performance collapses to near chance (<0.55 AUC), indicating the feature is specific to V1's weight configuration.
  *   **Implication:** If B is correct, the monitor requires re-training and validation for every new model checkpoint, increasing operational cost and risk.

  ### 6. VERBAL DISPUTES AND REFRAMING

  We identified one major verbal dispute that has contributed to the deadlock.

  **The Dispute:** The definition of "Representation."
  *   **Side A** uses "Representation" to mean *a causal mechanism that carries semantic information.*
  *   **Side B** uses "Representation" to mean *a human-interpretable description of a vector subspace.*

  **Resolution:**
  We agree that this is largely a verbal dispute masking a concrete engineering disagreement about **robustness guarantees.**
  *   If Side A agrees to drop the claim that the feature is "semantic truth" and instead claims it is a "robust causal handle," Side B's primary objection is mitigated.
  *   If Side B agrees that "robust causal handle" is sufficient for deployment as a *monitoring* tool (rather than a *verification* tool), Side A's primary goal is met.

  **Reframed Fault Line:**
  The disagreement is not about Realism vs. Instrumentalism. The real disagreement is about **Failure Modes.**
  *   **Side A** believes failure modes will be random (noise).
  *   **Side B** believes failure modes will be systematic (adversarial).

  **Agreed Path Forward:**
  We will proceed with deployment under the classification of **"Probabilistic Safety Control."** We will not claim the monitor *prevents* unsafe output, but that it *flags high-risk activations* for downstream filtering or human review. This satisfies Side A's desire to use the tool and Side B's requirement to limit liability claims.

  ### 7. SIGNATURES

  _________________________
  **Lead, Side A (Mechanisms & Causality)**
  *Date:*

  _________________________
  **Lead, Side B (Robustness & Validation)**
  *Date:*

  _________________________
  **Team Lead, Interpretability**
  *Date:*
