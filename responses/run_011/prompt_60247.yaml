prompt: |-
  so this started as an argument with my coworker Dale and turned into a week of me going down a rabbit hole, and now I want somebody to tell me whether the thing I've ended up believing actually holds together. I have zero philosophy background, this is all wikipedia and youtube at 1am, so be blunt.

  Setup: Dale will accept "if the breaker's tripped then the panel's dead," and he'll accept "the breaker's tripped," and then he goes "ok, and?" and asks what makes that mean anything. I said it's just what "if" means. He said that's not a reason, that's you telling me to agree with you. Then I read about Carroll's tortoise and realized he'd kind of got me, and I've been chewing on it ever since. Here's where I've landed:

  1. Nobody gets pushed into a conclusion just cause an argument is valid. There has to be something you can point at that shows why the premises lock the conclusion in, and if you can't point at it then "it follows" is just a noise we make at each other.

  2. What you point at has to be a belief, because beliefs are the only things that can hold other beliefs up. So the reason it follows is that you also accept the rule — if A, and if A then B, then B.

  3. But I can see that this doesn't fix anything, because Dale can accept the rule too and still not budge, and now you need another rule to hook that rule up to the rest, and it never stops. So it can't be the pile of beliefs that's doing the work.

  4. So my best guess is that believing the conclusion isn't a step you take at all. It's just what goes off in you once you've really accepted the premises — not something you do, more like a reflex.

  5. But I still think Dale is doing something wrong, and I don't mean broken, I mean blameworthy. I'd hold it against him. And holding it against somebody only makes sense if he could have gotten there from where he was.

  6. I also think you can't be required to believe something you couldn't possibly see the reason for. A demand you can't get any grip on isn't a demand on you at all.

  7. And I think whether the conclusion follows is a fact out there in the world, not something we settle by agreeing on it. It doesn't depend on anybody accepting anything.

  Every one of these feels true to me and I dont know which I'd drop, which I guess is the whole problem.

  Can you audit the set for me? Give me exactly five numbered items, worst tension first, each one just a sentence or two saying which of my claims are colliding and what I'd have to give up or water down to stop them colliding. One of the five should be a pair that looks like a clash but isn't really one — say why it dissolves. No intro, no wrap-up at the end, and don't tell me what to go read.
