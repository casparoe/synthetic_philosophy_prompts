  ### Part 2: The Ledger Theory

  You asked for bluntness. Your ledger is a robust discipline, but it risks becoming a game of solitaire if the currency values are subjective. Here is the audit.

  **1. Audit of Features: What have you missed?**
  You are tracking line length, rhyme position, and register. You asked specifically about **masculine/feminine rhyme**.
  *   **Verdict:** Yes, you must track this. In French poetry, the alternation of masculine and feminine rhymes is not decorative; it is rhythmic breathing. A string of feminine rhymes (mute *e*) slows the line down; masculine rhymes speed it up. Marot breaks his own pattern at lines 13–16 (four feminine lines in a row). This creates a "sag" or a "sigh" in the middle of the poem during the scolding.
  *   **Missing Feature:** **Syntax/Enjambment.** Your gloss shows inversions (lines 6–7). If Marot inverts syntax to force a rhyme, and you normalize the syntax in English to make sense, you have paid the "sense" debt but defaulted on the "tension" debt. You need to record where the French is strained to make the rhyme work.

  **2. The "Confitures" Default**
  You dropped *confitures* (a specific cultural object) and invented an image later to "make up the weight."
  *   **Verdict:** This is a **default dressed up as bookkeeping.**
  *   **Argument:** Translation is not accounting where any asset covers any liability. Specificity is not fungible. *Confitures* anchors the poem in a specific domestic reality (the bedside table of a 16th-century lady). It implies sugar, medicine, luxury, and indulgence. If you replace it with a generic "sweet" or invent a different image later (say, "wine"), you have changed the cultural texture.
  *   **The Rule:** You can only "pay" a debt in kind if the currency is equivalent. A rhyme debt can be paid with a rhyme elsewhere. A concrete image debt must be paid with *that* concrete image, or a culturally equivalent one. Inventing a new image is not repayment; it is writing a new poem. If you cannot fit *confitures*, you must record the loss as a permanent deficit in the translation's fidelity, not balance it with a surplus of invention elsewhere.

  **3. The "Vous/Tu" vs. Archaism**
  You ask if importing an archaism elsewhere discharges the debt of losing the *vous/tu* shift.
  *   **Verdict:** The ledger is **cooked.**
  *   **Argument:** The *vous/tu* shift is a **social** marker (distance vs. intimacy). An archaism (e.g., using "thou" or "hath") is a **temporal** marker (old vs. new).
  *   If you translate the whole poem in modern English but use "thou" starting at line 14, you have discharged the debt (though it may sound clumsy).
  *   If you translate the whole poem in archaic English to "compensate" for losing the shift, you have created a false equivalence. You have made the *whole* poem distant (temporal) to make up for losing a *partial* shift (social). This flattens the dynamic. The reader needs to feel the *snap* of the shift, not a general atmosphere of oldness.
  *   **Recommendation:** Do not try to pay this debt with "currency." Pay it with **syntax** or **tone**. When the French shifts to *tu*, your English must become sharper, more imperative, less polite. "Get up" instead of "Please rise." That is the only way to settle the debt without lying about the text.

  **Final Word**
  Your method is sound because it forces you to notice what is there. But do not let the ledger become a justification for moving things around that should stay put. *Confitures* stays put. The shift stays put. If the English breaks under the weight, let it break. A cracked translation that shows the structure of the original is worth more than a smooth one that hides it.
