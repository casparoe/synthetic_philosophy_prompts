      *   **Step (4) $\rightarrow$ (5):** This is the leap. Even if some agents don't care about $F$, it doesn't mean a *general* impact measure can't care about $F$ for the sake of *safety* or *robustness*. The goal of the impact measure isn't to satisfy *all possible* utility functions (which is impossible), but to satisfy a *class* of utility functions (e.g., "most human preferences" or "unknown future preferences").
