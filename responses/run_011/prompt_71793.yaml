      *   Resistance: Risk is defined relative to a distribution over outcomes *and* values. If values are unknown, risk is undefined. However, *variance* in outcomes is a structural fact.
      *   The friend's generalization holds *if* you accept his definition of neutrality. To resist it, you must resist the definition of neutrality (the move at 4-5). If you accept that structural measures protect *instrumental convergence* rather than *all possible values*, the generalization fails for Risk/Evidence because those are inherently epistemic/value-laden in a way "state distance" might not be.
      *   Actually, the generalization is weak. Risk *requires* a utility function to define (risk of what?). Impact (as defined by attainable utility preservation) tries to avoid this. The friend argues you can't.
      *   Verdict: The generalization can be resisted by distinguishing between *outcome variance* (structural) and *risk* (evaluative). The argument conflates them.

  7.  **Synthesize the Diagnosis:**
      *   **Core Error:** Equivocation on "Value." The argument conflates **Terminal Values** (specific goals) with **Instrumental Convergence** (capacity to pursue goals).
      *   **Step to Reject:** **(4) and (5)**.
      *   **Why it looked compelling:** It appeals to the idea that "ought implies can" or that normativity requires universalizability. If someone *can* not care, why *should* we?
      *   **Price:** You must concede that "Value Neutrality" does not mean "Neutrality to all logically possible minds." It means "Neutrality to all *plausible* human values" or "Preservation of Option Value." You are implicitly assuming a prior over value functions (e.g., that humans value *something* and need *capacity* to achieve it).
      *   **Step (7):** It is sound but moot if (5) is rejected.
      *   **Generalization:** Resistible. Risk/Evidence inherently require a utility/epistemic framework. Impact measures rely on *capacity*, which is structural.

