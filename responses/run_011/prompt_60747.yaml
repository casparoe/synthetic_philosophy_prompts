prompt: |-
  Right, I've just come off about a three-hour arguement with a mate of mine — he does economic history, I do philosophy — and neither of us budged, so I want a proper second opinion from someone who isn't invested in either of our egos.

  Here's my position, in as precise a form as I can manage. I think the dynastic-cycle tradition — Polybius's anacyclosis, Ibn Khaldun's account of a ruling house's asabiyya running down over roughly three generations of forty years or so — is not a literary genre or a mood about the human condition, but a claim about an actual mechanism, and the mechanism is this: what a founding coalition produces is cohesion, and cohesion is the one asset that cannot be bequeathed. The heirs inherit the *outputs* of cohesion — security, rents, offices, prestige, a state that functions — but never the *inputs*: shared hardship, mutual hostages, reputations built under conditions where defection gets you killed. So the asset depreciates at a rate set by demographic turnover rather than by anything the rulers do or fail to do, which is why the classical figures cluster around three generations instead of, say, seven. Call it the amortisation view; that's my own coinage, not a school I'm borrowing. What I like about it is that it makes a couple of asymmetric predictions the usual rise-and-fall pieties don't. Cycle *length* should track generation length rather than wealth or state capacity, so polities with early succession and high elite mortality should compress and long-lived, late-succeeding elites should stretch. And a cycle should be interruptible wherever an institution manufactures fresh bonded cohorts — conscription, competitive examinations that build a new peer group, frontier expansion, a revolutionary ideology — which is also how I read Ibn Khaldun's point about dynasties getting renewed by fresh solidarity from the periphery. My mate's line was that this is astrology for historians: fitted after the fact, with the start and end points of any given dynasty chosen by the victors' chroniclers, and maybe a dozen usable cases in world history so that any curve will fit. I'll concede one thing up front — the long Chinese dynasties, Han, Tang, Ming, Qing, all ran two or three times the 120 years the classical scheme wants, and my instinct is to call them multi-cycle polities with renewals rather than single stretched cycles, which I admit sounds like an escape hatch. Tell me whether that instinct is defensible or already the beginning of the end.

  So: what would count against it? Please take the role of a philosopher of history who's also genuinely comfortable with the quantitative side — you know both the classical sources and the cliodynamics literature, and you're not impressed by either of them for aesthetic reasons. Think carefully, and start with some brainstorming before you commit to an ordering: dump out every candidate defeater you can think of, including ones that strike you as weak, then sort. In the sorted version I want (a) the things that would be decisive — the kind of case or the kind of quantitative result that should make me abandon the view outright, e.g. a polity whose founding coalition demonstrably failed to depreciate across five or six generations, or a clean null on the generation-length prediction; (b) the things that are merely awkward and that I could absorb with an auxiliary assumption without turning the view into mush; and (c) for each item, whether a committed defender of the cycle view would themselves concede it as counting against them or wave it off, and what the wave-off costs. Go especially hard on the two my mate thinks are fatal: the post-hoc periodisation problem and the tiny-N problem. Are those actually fatal, or are they sampling problems that better data and better case-selection would dissolve? Relatedly, tell me what you make of the structural-demographic forecasting episode — Turchin's much-publicised 2010 note in Nature that the coming decade would be a rough one for the US and western Europe, and the later retrospective scoring of it. Was that a genuinely risky prediction that came off, a prediction that was safe whichever way it fell, or a post-hoc fit wearing a forecast's clothes? Be concrete about what would have had to happen for it to count as a failure, since that's the test I care about.

  Then: what does the amortisation view predict that its rivals don't — the linear or developmental view of history, Spengler's morphology of cultures, Toynbee's challenge-and-response, and the flat denial that there's any signal at all beyond path-dependent noise? Where am I most likely to be caught out by a rival rather than merely embarrassed in front of one? And finish with a straight verdict, ranked from fatal to merely awkward, plus an honest answer to the meta-question I've been avoiding all evening: has my position been qualified into unfalsifiability, and if it has, is that actually a problem for a view of this kind, or is it normal for anything trying to be a science of very slow, very large processes? Write the whole thing in British English. No bibliography and no reading list — I want the reasoning, not the references, I've got the books.
