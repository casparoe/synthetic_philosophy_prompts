prompt: |-
  Spent 35 years as a sedimentologist, retired a couple of years back, and have fallen down a philosophy rabbit hole since. The archaeology dept at a nearby uni has invited me to give a seminar talk in the spring, becuase I wrote a little paper arguing that a lot of archaeological inference about past belief is unfalsifiable in a specific, fixable way.

  My pitch: borrow the logic of diagnostic-test evaluation. Every interpretive claim — "these figurines are objects of a fertility cult", "this burnt deposit is a foundation sacrifice" — should be scored on two things I'm calling interpretive sensitivity and interpretive specificity: what fraction of sites where the practice really happened the reading would pick up, and what fraction of sites where it didn't happen the reading would still generate. A reading that any competent analyst would produce for almost any assemblage of small carved female figures has near-zero specificity and carries no information, however beautifully it's written up. I'd also argue for exposure controls: run your reading blind on assemblages from contexts where you have independent reason to think the practice was absent, and count how often it fires anyway.

  The room will be maybe 25 people. Mostly material-culture specialists, several trained in the post-processual reaction and deeply suspicious of anything that smells like processual positivism — one of them does phenomenology of landscapes. There's a quantitative zooarchaeologist who'll broadly agree with me but thinks the medical analogy is naive. An Egyptologist who works on iconography in museum collections stripped of context. Two or three grad students, one of whom works on repatriation and will care a great deal about who gets to decide what an object meant. Nobody does statistics for a living.

  Give me a Q&A prep sheet: the eight or so objections this room actually raises, ordered by how much damage each does, phrased the way they'd phrase them (thier vocabulary, not mine), each with a two-minute reply and an honest note on where the reply is soft or where I should just concede. Tell me which of my own premises I should be willing to give up in order to survive the hour, and include the one question I'm praying nobody asks — I suspect it's the absence of any gold standard for belief, but I want you to put it to me worse than I can put it to myself.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** Retired sedimentologist (35 years), now interested in philosophy of archaeology.
      *   **Task:** Giving a seminar talk at a university archaeology department.
      *   **Topic:** Applying diagnostic-test evaluation (sensitivity/specificity) to archaeological inference about past belief. Arguing that many interpretations are unfalsifiable.
      *   **Audience:** ~25 people. Mixed bag: Material-culture specialists, post-processualists (suspicious of positivism), a phenomenologist, a quantitative zooarchaeologist (skeptical of medical analogy), an Egyptologist (no context), grad students (repatriation/ethics focus). No professional statisticians.
      *   **Goal:** A Q&A prep sheet with ~8 objections, ordered by damage potential, phrased in their vocabulary, with 2-minute replies, concessions, and a "nightmare question."

  2.  **Deconstruct the Argument:**
      *   **Core Idea:** Archaeological interpretations of belief function like diagnostic tests.
      *   **Metrics:** Sensitivity (true positive rate) and Specificity (true negative rate).
      *   **Proposal:** Use "exposure controls" (blind testing on contexts where the practice is known to be absent).
      *   **Underlying Philosophy:** Critical Realism/Processual leanings (falsifiability, objectivity) vs. Post-Processualism (subjectivity, meaning, context).

  3.  **Identify Potential Objections (Brainstorming):**
      *   *Post-processual:* Meaning isn't objective. You can't measure belief like a virus. Context is unique.
      *   *Phenomenologist:* Experience matters more than classification. You're reducing lived experience to data.
      *   *Zooarchaeologist:* Medical analogy is flawed. No gold standard. Base rates are unknown.
      *   *Egyptologist:* We don't have context. How do you run controls on museum pieces?
      *   *Grad Student (Repatriation):* Who decides the "truth"? Colonial power dynamics. Epistemic violence.
      *   *General:* Equifinality (many causes, one effect). Taphonomy. Sample size.
      *   *Philosophical:* Belief isn't a binary state (present/absent). It's fluid.

  4.  **Select and Order the Top 8 (by Damage Potential):**
      *   *Highest Damage:* The "Gold Standard" problem (No independent access to past belief). This kills the whole sensitivity/specificity calculation.
      *   *High Damage:* Equifinality/Meaning is not binary. Belief isn't a disease.
      *   *High Damage:* Epistemic Authority/Colonialism. Who defines the "control"?
      *   *Medium-High:* Context loss (Egyptologist point). Controls are impossible for decontextualized finds.
      *   *Medium:* Post-processual critique (Meaning is emergent, not inherent).
      *   *Medium:* Phenomenology (Experience > Classification).
      *   *Lower (but annoying):* Sample size/Preservation bias (Sedimentologist should know this, but still).
      *   *Lowest (but technical):* The Zooarchaeologist's specific statistical critique (Base rate fallacy).

      *Refining the Order:* I need to order these by how much they threaten the *core thesis*.
      1.  The Gold Standard (No access to past minds).
      2.  Equifinality/Meaning (Belief isn't a discrete variable).
      3.  Epistemic Violence (Politics of interpretation).
      4.  Context/Controls (Impossibility of "known absence").
      5.  Post-Processual (Meaning is relational, not intrinsic).
      6.  Phenomenology (Reductionism).
      7.  Taphonomy/Preservation (The sedimentologist's blind spot).
      8.  Base Rates (The Zooarchaeologist's nitpick).

  5.  **Drafting the Content (Iterative Process):**

      *   *Tone:* Respectful but firm. Acknowledge the shift from rocks to minds. Use their jargon (ontology, epistemology, agency, taphonomy, colonial gaze).
      *   *Reply Strategy:* Don't fight on their turf (philosophy of mind). Fight on *rigor*. Admit limitations but argue for *better* speculation.
      *   *Concessions:* Where to yield? Yield on "proof." Stand on "plausibility."

      *   *Drafting Objection 1 (Gold Standard):* "You need a truth value to calculate sensitivity. We don't have access to past cognition."
          *   *Reply:* Use ethnographic analogy or historical texts as proxies. It's about bounding error, not proving truth.
          *   *Soft spot:* It *is* a proxy, not the thing itself.

      *   *Drafting Objection 2 (Ontology of Belief):* "Belief isn't a binary switch. It's fluid."
          *   *Reply:* Acknowledge fluidity. We are testing the *material signature* of the practice, not the internal state.
          *   *Soft spot:* Practice $\neq$ Belief.

      *   *Drafting Objection 3 (Politics/Repatriation):* "Who defines the control? This is epistemic violence."
          *   *Reply:* Involve descendant communities. Make the criteria transparent.
          *   *Soft spot:* Power dynamics remain.

      *   *Drafting Objection 4 (Context/Egyptology):* "Museum pieces have no context. Your method fails here."
          *   *Reply:* Acknowledge limitation. Method is for excavated contexts. Museum pieces need different handling.
          *   *Soft spot:* Limits the method's scope.

      *   *Drafting Objection 5 (Post-Processual):* "Meaning is created in the encounter, not inherent in the object."
          *   *Reply:* Distinguish between *past meaning* (target) and *present meaning* (reception). We are trying to reconstruct the former.
          *   *Soft spot:* Hermeneutic circle.

      *   *Drafting Objection 6 (Phenomenology):* "You're reducing lived experience to data points."
          *   *Reply:* Data points support the structure of experience. We need both.
          *   *Soft spot:* Reductionism charge sticks a bit.

      *   *Drafting Objection 7 (Taphonomy):* "Preservation bias skews your 'absence' controls."
          *   *Reply:* I'm a sedimentologist. I know taphonomy. We correct for it.
          *   *Soft spot:* Hard to correct for perishable beliefs.

      *   *Drafting Objection 8 (Base Rates/Zooarch):* "Bayesian prior probabilities are unknown."
          *   *Reply:* Agreed. That's why we need explicit priors, not hidden ones.
          *   *Soft spot:* Mathematically true.

  6.  **The "Nightmare Question":**
      *   User suspects it's about the gold standard. I need to make it worse.
      *   *Idea:* It's not just that we don't have a gold standard; it's that the *concept* of "belief" as a discrete, locatable entity is a Western colonial construct imposed on the past.
      *   *Phrasing:* "What if 'belief' is the wrong category entirely?"

  7.  **Premises to Sacrifice:**
      *   Sacrifice "Objectivity." Aim for "Intersubjective Transparency."
      *   Sacrifice "Belief" as the target. Aim for "Ritual Practice."
      *   Sacrifice "Universal Application." Admit it works best on well-contextualized data.

  8.  **Review and Refine:**
      *   Check tone: Is it too defensive? Needs to be collegial.
      *   Check vocabulary: Ensure "positivism," "ontology," "epistemic," "taphonomy," "equifinality" are used correctly.
      *   Check constraints: 8 objections, 2-minute replies, honest notes on soft spots.

      *(Self-Correction during drafting)*: Make sure the sedimentologist background is leveraged. They understand deep time and incomplete records. Use that credibility.
      *(Refining the "Nightmare Question")*: The user thinks it's about the gold standard. I should confirm that but frame it as an *ontological* crisis, not just a methodological one. "You are measuring a ghost."

  9.  **Final Polish:** Organize clearly with headers. Ensure the "Concession" sections are honest. (Proceed to generate output).

  10. **Final check against user prompt:**
