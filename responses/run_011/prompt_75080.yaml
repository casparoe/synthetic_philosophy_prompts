answer: |-
  Dear Colleague

  I understand the pressure you are under, and it is entirely reasonable to want to anticipate Professor Reinhart's reaction before the meeting. She is known for her precision on the units-of-selection debate, and her impatience with vagueness is well documented, but her track record is actually quite consistent if you look for the structural principles rather than the surface details. Having reviewed the seven cases you provided alongside the description of your meadow system, I can offer a reconstruction of her likely reasoning, a prediction of her verdict, and advice on how to frame the grant regardless of the outcome.

  To understand where she will land on your system, we must first isolate the rule that generates her past verdicts. It is tempting to say she simply requires a single-cell bottleneck, given her emphasis on that feature in the honeybee, yeast, and mitochondria cases. However, the mouse case complicates this. She admitted the meiotic driver is a unit of selection within the mouse but maintained the mouse is still an organism. This tells us she distinguishes between the question of what is being selected in a specific context and the question of what counts as an individual entity. The mouse retains its status because it typically reproduces via a bottleneck and maintains physiological integration, despite the internal conflict. Conversely, in the biofilm and ant colony cases, she denied individuality. In the biofilm, the participants were unrelated and the composition was unstable across generations. In the ant colony, the founders were unrelated and cooperation collapsed when conflict arose. The species selection case was rejected because there was no structured reproduction or internal integration at that level.

  Synthesizing these verdicts, Reinhart appears to operate with a criteria set derived from the major transitions in evolution literature, specifically requiring two conditions to be met simultaneously for a collective to count as a Darwinian individual. First, there must be a mechanism for high-fidelity heredity that aligns the fitness of the parts with the whole, typically secured by a bottleneck or a single-founder event that ensures high relatedness. Second, there must be a mechanism for conflict suppression or fitness alignment that prevents lower-level units from maximizing their own fitness at the expense of the higher level. The mouse passes because its sexual lifecycle provides the bottleneck and its development generally suppresses somatic conflict, even if a driver allele cheats. The honeybee and yeast pass because they have both a bottleneck and active suppression of lower-level reproduction. The biofilm and ant colony fail because they lack the relatedness provided by a bottleneck or single founder, leading to unstable cooperation. The species case fails because it lacks reproduction and integration entirely.

  Applying this rule to your meadow reveals a significant tension. Your system has a single genet, which satisfies the relatedness condition initially, and there is physiological integration via resource sharing. However, the propagation of the meadow itself, which is the focus of your study, occurs through clonal fragmentation without a single-cell bottleneck. More critically, you note there is no segregated germ line, meaning somatic mutations can become heritable. You have already identified a somatic variant that appears to be cheating, outgrowing its neighbours and expanding its patch. This looks structurally different from the mouse driver. In the mouse, the driver is an allele within a genome that is still transmitted through a bottlenecked zygote. In your meadow, the cheating variant is a sector of the organism that can propagate vegetatively into new meadows without being reset by a bottleneck. This means the meadow functions as a population of competing somatic lineages rather than a unified vehicle of selection. The heredity is present, as you noted with the common garden results, but it is heredity at the level of the somatic patch, not just the genet.

  Based on this analysis, my best guess is that Professor Reinhart will say no, the meadow does not count as a single individual organism in the strict sense required for a Darwinian population model, though she may concede the genet is an individual sexually. She will likely argue that the lack of a bottleneck in clonal propagation combined with the absence of a segregated germ line allows lower-level selection to operate effectively within the collective. The presence of the cheating somatic variant that expands over time will be her primary evidence that fitness alignment is incomplete and that the meadow is evolving internally as a mixture of lineages. She will distinguish this from the mouse case by pointing out that the mouse's cheating element does not typically found new mouse lineages independently of the sexual bottleneck, whereas your somatic variant can found new meadows via fragmentation. She will likely seize first on the fact that somatic mutations are heritable and subject to selection, as this directly undermines the requirement that the individual be the primary unit of heredity and fitness.

  If you need a case to test this hypothesis before Thursday, imagine a clonal plant species that reproduces vegetatively but enforces a strict bottleneck even in clonal propagation, perhaps by regenerating new plants only from single cells released by the parent, or conversely, a colonial animal like a coral that lacks a segregated germ line and propagates by fragmentation. If you presented her with a coral colony where somatic mutations are heritable via fragmentation and some lineages outcompete others within the colony, I suspect she would classify it as an aggregate or a population of cell lineages rather than a single individual, aligning with her verdict on your meadow. This would discriminate between a view that prioritizes physiological integration alone versus one that prioritizes the suppression of within-individual evolution.

  Given this prediction, you should prepare your framing section to acknowledge this complexity honestly. If she insists it is not an individual, you should not claim it is one merely for convenience. Instead, you should frame the project as studying the transition to individuality or the dynamics of a clonal population where somatic evolution occurs. The principle you would be adopting is that the meadow functions as a Darwinian population of somatic lineages within a single genet, where selection operates at multiple levels simultaneously. This is a defensible and scientifically interesting position that avoids the vagueness she dislikes. You should lead with the fact of the heritable somatic variants and the lack of a segregated germ line, as these are the features that most clearly signal the breakdown of strict individuality in her framework. By stating explicitly that you are treating the meadow as a unit of ecological interaction but acknowledging its status as a population of competing somatic lineages evolutionarily, you satisfy her demand for precision while preserving the ecological validity of your study system. This approach shows you understand the philosophical stakes and are not simply glossing over them to make the grant easier to write.

  I hope this helps you navigate the meeting. Reinhart values clarity above all, so if you present the ambiguity as a feature of the system rather than a bug in your theory, she is likely to respect the honesty even if she disputes the terminology. Good luck on Thursday.

