answer: |-
  Here is a decision tree designed for your section handout. It uses plain language to operationalize the three philosophical distinctions you requested, followed by the analysis of empty cells and convergent leaves.

  ### **Decision Tree: What Do We Do About Ignorant Voters?**

  **START:** *You believe that a lot of voters are badly informed, and this is leading to bad laws.*

  **QUESTION 1: The Competence Test**
  Do you think there is a fair, neutral way to test who knows enough about politics to vote wisely, without rigging the test to favor your own political team?
  *   **NO:** (We can't reliably pick out the experts.) → Go to **Question 2A**
  *   **YES:** (We can identify the knowledgeable.) → Go to **Question 2B**

  **QUESTION 2A: The Value of Voting** *(For those who answered NO to Q1)*
  Since we can't filter for expertise, why do we vote? Is the main goal to ensure every citizen is treated as an equal, or to produce the best possible laws?
  *   **TREATED AS EQUALS:** → **Leaf: Intrinsic Democracy**
  *   **BEST LAWS:** → Go to **Question 3A**

  **QUESTION 2B: The Value of Voting** *(For those who answered YES to Q1)*
  Even if we *can* identify experts, is having an equal say a right that shouldn't be violated, or is producing good results the only thing that matters?
  *   **EQUAL SAY IS A RIGHT:** → **Leaf: Plural Voting**
  *   **RESULTS ARE ALL THAT MATTER:** → Go to **Question 3B**

  **QUESTION 3A: The Reality Check** *(For those seeking Best Laws but can't identify experts)*
  When you say democracy is the best way to get good laws, are you comparing epistocracy to the messy democracy we have *right now*, or to a perfect democracy where everyone does their civic duty?
  *   **PERFECT DEMOCRACY:** → **Leaf: Instrumental Democracy**
  *   **MESSY DEMOCRACY (RIGHT NOW):** → **Leaf: Sortition**

  **QUESTION 3B: The Reality Check** *(For those seeking Results and can identify experts)*
  If we let the knowledgeable rule, are we replacing the current system entirely, or just giving them a safety valve to stop the worst mistakes?
  *   **REPLACE IT:** → **Leaf: Rule by the Knowledgeable**
  *   **SAFETY VALVE:** → **Leaf: Epistocratic Veto**

  ***

  ### **TA Guide: Analysis of the Tree**

  #### **1. The Empty Cells (Combinations Nobody Holds)**
  There are three logical combinations of answers that do not correspond to stable positions in the literature.

  *   **The "Incoherent Expert" Cell:**
      *   *Combination:* **No** to Competence Test (Q1) + **Results Matter** (Q2A) + **Rule by Knowledgeable** (Q3B path).
      *   *Why it's empty:* **Incoherent.** You cannot advocate for rule by the knowledgeable if you simultaneously admit there is no non-question-begging way to identify who the knowledgeable are. This leads directly to oligarchy (rule by the powerful), not epistocracy.
  *   **The "Egalitarian Autocrat" Cell:**
      *   *Combination:* **Yes** to Competence Test (Q1) + **Equal Say is a Right** (Q2B) + **Rule by the Knowledgeable** (Q3B path).
      *   *Why it's empty:* **Incoherent.** If you believe an equal say is a right that shouldn't be violated, you cannot support a system where the knowledgeable *replace* the ignorant. This path forces you toward Plural Voting (everyone votes, but weights differ) rather than outright Rule.
  *   **The "Perfect Epistocrat" Cell:**
      *   *Combination:* **Yes** to Competence Test (Q1) + **Results Matter** (Q2B) + **Perfect Democracy** (Q3B path).
      *   *Why it's empty:* **Unappealing/Redundant.** If you believe democracy *at its idealized best* produces excellent outcomes, there is no instrumental reason to introduce epistocratic constraints. Epistocracy is usually a response to the *failure* of real-world democracy; if you assume ideal democracy, the "problem" epistocracy solves disappears.

  #### **2. The Convergent Leaves (Positions the Tree Can't Separate)**
  **Epistocratic Veto** and **Rule by the Knowledgeable**.

  *   **Why they converge:** Both positions land in the same philosophical bucket: *Yes, we can identify experts* + *No, equality is not intrinsically valuable* + *No, we are looking at real-world democracy.*
  *   **The Limitation:** Distinguishing between a "Veto" (experts can block laws) and "Rule" (experts make laws) is a matter of **degree**, not a fundamental philosophical distinction like Legitimacy or Competence. A veto power strong enough to block *any* legislation the experts dislike is functionally identical to Rule. To separate them, you would need a fourth question about the *mechanism* of power (e.g., "Should the ignorant vote at all?"), but that is a policy detail, not a foundational justification. Students who land here should understand they hold the same *epistemic* view, differing only on how harshly to apply it.

  #### **3. Note on Sortition**
  You may notice **Sortition** (random selection) appears in the "Can't Identify Experts" branch. This reflects the modern "Diversity Trumps Ability" argument (e.g., Hélène Landemore). If you care about outcomes (Best Laws) but admit you can't test for expertise without bias, a random sample of the population is often argued to be more cognitively diverse and less prone to corruption than a self-selected voting electorate. It is the "Outcomes" alternative to "Intrinsic Democracy" when the Competence Test fails.
