  I'm partway through a trade-press book on end-of-life law — the kind written by a journalist who has clearly done the reading but wants to keep moving — and one chapter sets up the whole debate by summarizing the classic philosophical attack on the acts-and-omissions distinction. Here is the passage in full:

  > Most of the confusion about euthanasia comes from a single distinction: the one between killing a patient and letting a patient die. The medical profession drew it officially in the early 1970s, and the law of most countries still embodies it — withdrawing treatment is permitted, injecting is murder. James Rachels attacked the distinction in a three-page article in the New England Journal of Medicine in 1975, and it has never really recovered. He asked readers to consider two men, Smith and Jones, each of whom stands to inherit a large sum if his six-year-old cousin dies. Smith creeps into the bathroom and holds the child under the water until he drowns. Jones intends to do exactly the same, but as he comes in the child slips, strikes his head, and slides under, and Jones stands by and watches him drown without lifting a hand. Nobody thinks Jones less guilty than Smith, yet the only difference between them is that one killed and the other let die — so that difference cannot be the thing that matters. Rachels added a second argument: because letting die is usually slower, the passive route often leaves patients in agony for days, which means the distinction does not merely fail to protect life, it sometimes destroys it more painfully. The doctrine of double effect is the same error in scholastic costume. It permits a doctor to give morphine to a dying patient even though the doctor foresees that the dose will hasten death, on the ground that he intends only the relief of pain; but intention is simply what you want, and every such doctor wants the patient to die, so double effect draws no line that active euthanasia does not cross just as freely. Once that is clear, the only remaining question is consent. If bringing about a death cannot be worse than allowing one, there is no principled basis for treating a patient who asks differently from a patient who can no longer ask: in both, the doctor causes a death that serves the patient's interest. The legal line is therefore arbitrary, and the honest reform is to delete it.

  I found this persuasive on first reading, and I still find the bathtub case hard to resist. But I'm a second-year medical student with one undergraduate ethics course behind me, and I've learned to distrust arguments that travel this fast from a thought experiment to a legislative conclusion. Please take on the role of a philosopher who works on end-of-life ethics and specifically on the killing-and-letting-die literature, and think the passage through carefully rather than giving me the standard seminar treatment of the distinction. Before you write the audit, spend a few sentences working out what the various claims in it commit the author to, and where you think the pressure points are; then do the audit.

  First, go through the passage claim by claim, in order, and sort each claim into three buckets: what a careful reader of the 1975 article would accept as a fair statement of it, what is a defensible simplification that nonetheless costs something, and what the article's own argument does not support or actively cuts against. Be explicit about the distinctions the passage runs together — my suspicion is that it collapses several it never bothers to separate, and I would like them named and held apart rather than discussed as one blur. Pay particular attention to whether the case of Smith and Jones is being used to establish what the passage says it establishes, and to what is doing the work in its description of double effect.

  Second, tell me whether the passage's upshots survive the corrections. Specifically: does its dismissal of double effect follow from anything true in its own account of that doctrine; does the equivalence of killing and letting die, if granted for the sake of argument, license the conclusion about patients who can no longer request anything; and does a moral conclusion about acts and omissions settle the legal question in the way the passage says it does? For each of these, state what further premises the correct argument would need in order to get there, and whether those premises are available, contested, or simply missing.

  Third, give me the strongest response a defender of the traditional doctrine could make to whatever is left standing after your corrections — the best version, not a strawman — and say which of the surviving claims such a defender can live with and which they have to reject outright.

  Two housekeeping notes. The passage refers to an official statement from the medical profession in the early 1970s that the article was replying to; if you are not confident about what that statement actually said or about its exact scope, tell me what you are unsure of instead of filling in plausible-sounding details. And please do not give me a reading list, footnotes, or citations I cannot check from where I am sitting — I want the reasoning, not the bibliography. Wherever a point turns on something empirical rather than conceptual, say that it does, and say what kind of evidence would settle it, rather than asserting a result.
