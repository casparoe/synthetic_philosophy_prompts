answer: |-
  This is a sharp distinction, and you are right to suspect that the moral weight of the document shifts depending on which engine is driving it. Most bioethics literature blurs these because, in 80% of cases, the Command and Evidence models point in the same direction. The crisis arises in the 20% where they diverge.

  Here is the breakdown you asked for.

  ### 1. The Divergence Case: Do they genuinely come apart?

  They are not the same model with the volume turned up or down. They are categorically different. The Command model is **deontological** (based on duty to a past obligation); the Evidence model is **epistemic/consequentialist** (based on the best available data regarding current welfare).

  To prove they come apart, we need a case where the Command model says **Withhold** and the Evidence model says **Treat**.

  **The Case:**
  A patient has a valid advance directive refusing antibiotics for pneumonia, signed at 65. The directive states: "If I cannot recognize my children or care for myself, I consider my life over."
  Current state: 82 years old, moderate dementia. She cannot name her children, but she smiles when they enter, hums along to their singing, eats with pleasure, and shows no signs of distress or fear. She develops a treatable pneumonia.

  *   **Command Model Verdict:** **Withhold antibiotics.**
      *   *Reasoning:* The condition ("cannot recognize... or care for myself") is met. The signature validates the authority of the past self to set the boundary of a life worth living. The current happiness is irrelevant because the past self explicitly ruled that this *type* of existence (dependent, cognitively impaired) does not count as a life she wishes to sustain. The order stands regardless of current affect.
  *   **Evidence Model Verdict:** **Administer antibiotics.**
      *   *Reasoning:* The directive is treated as testimony about what the patient values. However, the *best* evidence of what a being values is its current behavior and affective state. The patient is demonstrating, nonverbally, a will to live (eating, engaging, smiling). The old document is now "stale data." It is less reliable than the immediate behavioral evidence. To withhold treatment based on the paper would be to ignore the stronger evidence of current welfare.

  **Conclusion:** They genuinely come apart. If the Evidence model were just the Command model with "volume down," it would still say "Withhold," just with more hesitation. Instead, it flips the verdict. The Command model protects the *integrity of the life narrative* (Dworkin's critical interests); the Evidence model protects the *quality of the current experience* (Dresser's experiential interests).

  ### 2. The Ulysses Clause: Anticipating Value Change

  You wrote: *"My instinct is that this is where the evidence model should break... But it also looks like the moment where it's least defensible from the [Command] side."*

  Your instinct is half-right, but you have the asymmetry reversed.

  **The Command Model:**
  The Ulysses clause ("I will look happy, but I am deluded") is the Command Model's **strongest** point, not its weakest. The Command model does not rely on the *truth* of the prediction; it relies on the *right* to bind. If I have the right to decide my medical fate, I have the right to decide that my future happiness is a metric I reject. The clause effectively says: "I am exercising my authority to define 'benefit' for myself, and I define future happiness under dementia as a false positive." It is epistemically arrogant, yes, but the Command model is built on authority, not epistemic humility. It holds firm.

  **The Evidence Model:**
  This is where the Evidence model actually **breaks** (or at least creates a paradox).
  If the directive is testimony, the Ulysses clause is the past self testifying that the future self's testimony will be unreliable.
  *   *Data Point A (Past):* "Future happiness is delusional."
  *   *Data Point B (Present):* "Current happiness appears genuine."
  The Evidence model now has to weigh two conflicting pieces of evidence. To resolve this, it must smuggle in a priority rule: *Why does Data Point A outweigh Data Point B?*
  Usually, we privilege present evidence over past predictions. But the Ulysses clause explicitly argues against that privilege. If you accept the clause, you are no longer running a pure Evidence model; you are accepting the Past Self's *authority* to discount the Present Self's data.

  **Verdict:** The Ulysses clause does not break the Command model; it fortifies it. It breaks the Evidence model by forcing it to choose between "past prediction of delusion" and "present display of joy" without a neutral metric to decide which is more reliable. If you side with the Ulysses clause in an Evidence framework, you have covertly switched to the Command model.

  ### 3. The Actual Machinery: Form vs. Practice

  You are correct: **The forms are Command; the practice is Evidence.**

  *   **The Forms (Command):** Legally, an advance directive (or living will) is structured as a directive. It uses imperative language ("I direct," "I refuse"). It requires witnesses and signatures to establish *authority*, not *accuracy*. This is necessary for liability protection. A hospital needs a shield. "We followed the order" is a legal defense; "We made our best guess about her values" is a lawsuit waiting to happen.
  *   **The Practice (Evidence):** Clinicians and ethics committees rarely treat these documents as blind orders. If a patient with a "Do Not Hospitalize" order is screaming in pain, the doctor will treat, regardless of the paper. They ask surrogates, "What would she want?" not "What does the paper say?" This is an evidential inquiry. They are looking for the *spirit* of the values, not the *letter* of the law.

  **Does the gap matter morally?**
  Yes. It creates a "beneficial hypocrisy."
  *   **The Good:** The Command language gives the family the *shield* to stop aggressive treatment when the patient is suffering (e.g., terminal cancer, end-stage dementia with distress). It stops the "maybe we should try one more thing" spiral.
  *   **The Bad:** The Command language creates the exact trap you are in. It makes you feel like a lawbreaker if you feed your mother when the paper says "no tube feeding," even if she is opening her mouth for a spoon.
  *   **The Function:** The gap allows clinicians to ignore the directive when it leads to obvious harm (Evidence wins) but enforce it when it prevents futile suffering (Command wins).

  **Is it administrative fiction doing useful work?**
  Mostly yes. But in your specific case (moderate dementia, content patient), the fiction is failing. The system is designed for *crisis* (end of life), not *maintenance* (living with dementia). The machinery assumes the patient will be in a state where "Command" and "Evidence" align (i.e., the patient is suffering). When the patient is content, the machinery grinds because the legal shield (Command) conflicts with the clinical ethic (Beneficence/Evidence).

  ### Confidence Assessment

  **Overall Confidence:** High on the philosophical distinction; Moderate on the sociological claim about clinical practice.

  **The One Shaky Point:**
  I am least sure about the claim that **"The Practice is Evidence."**
  *Why it's shaky:* This varies wildly by jurisdiction and institution. In some legal environments (e.g., strict US states or specific UK interpretations of the Mental Capacity Act), the document *is* treated as a binding Command, and clinicians will refuse to act against it even if the patient seems content, precisely to avoid liability. In other systems, "best interests" overrides the directive. I am generalizing from bioethics literature and common practice, but your local hospital's legal counsel might view that document as a rigid Command, regardless of what the doctors feel.
  *Action:* Before your family meeting, you need to verify how your specific local jurisdiction treats "current objection" vs. "prior directive." If the law in your area says "Prior Directive trumps Current Behavior," the Evidence model is philosophically sound but legally dead.

  **Summary for the Family Meeting:**
  You are not arguing about whether the document is "valid." You are arguing about which model governs its interpretation.
  *   If you argue **Command**, you must honor the signature even if she is happy.
  *   If you argue **Evidence**, you argue the document is outdated testimony, superseded by the living woman in the chair.
  *   The Ulysses clause ("I will look happy") strengthens the Command argument but creates a paradox for the Evidence argument.
  *   The system *wants* to use Evidence but *requires* Command for legal safety. Your job is to convince the clinicians that honoring the Evidence model here is the safer legal bet (i.e., "treating a content patient aligns with standard of care; starving a happy one invites scrutiny").
