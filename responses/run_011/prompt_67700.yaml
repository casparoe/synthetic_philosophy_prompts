prompt: |-
  I teach a seminar on the ethics of biography and next week we screen Amadeus after two weeks on Plutarch: the Alexander proem (lives aren't histories, and a jest or some small gesture reveals character better than the biggest battles), the passage at the start of the Pericles where he insists that admiring a fine work doesn't make you want to be the man who made it — the piper, the perfumer, the sculptor — the Aemilius Paulus remark about using the lives as a mirror to fashion your own, and his attack on Herodotus for malice.

  What I want is a reading of the film through that apparatus, not a summary of either side. Does Salieri commit the Pericles mistake — adoring the work and needing to be the workman — and does the film know that's the mistake? Is this a Plutarchan life at all when our only access to Mozart runs through exactly the envious narrator Plutarch wants to police, or is the envy what makes the portrait trustworthy? And where does it tip into hagiography (I'm thinking of the ending) — is that a failure of the form or its point? Be honest about where I'm forcing the lens, and say what the film shows about learning from a life that Plutarch's imitation model can't accomodate. No quotes needed.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A seminar on the ethics of biography.
      *   **Previous Material:** Plutarch (Alexander proem, Pericles proem, Aemilius Paulus mirror/Herodotus attack). Key Plutarchan ideas: Lives $\neq$ History; small gestures reveal character; admiring art $\neq$ wanting to be the artist; lives as mirrors for self-fashioning; suspicion of malice/envy in narration.
      *   **Next Material:** Screening *Amadeus* (Peter Shaffer's play/Milos Forman's film).
      *   **Task:** Read the film *through* the Plutarchan apparatus.
      *   **Specific Questions to Address:**
          *   Does Salieri commit the "Pericles mistake" (adoring the work, needing to be the workman)? Does the film know this is a mistake?
          *   Is this a Plutarchan life if access to Mozart is filtered through an envious narrator (whom Plutarch would police)? Is the envy what makes it trustworthy?
          *   Where does it tip into hagiography (the ending)? Failure of form or the point?
          *   Be honest about where the lens is forced.
          *   What does the film show about learning from a life that Plutarch's "imitation" model can't accommodate?
      *   **Constraint:** No quotes needed.
      *   **Tone:** Academic, analytical, honest, nuanced (suitable for a seminar leader).

  2.  **Deconstruct the Plutarchan Lens:**
      *   *Alexander Proem:* Biography is about character (ethos), not just deeds (praxis). A joke or meal tells more than a battle.
      *   *Pericles Proem:* Admiration of virtue/art should not lead to envy or a desire to *be* the creator, but to emulate the virtue. The "workman" vs. the "work."
      *   *Aemilius Paulus:* Lives are mirrors for self-fashioning. We look at others to improve ourselves.
      *   *Herodotus Attack:* Malice/envy (phthonos) corrupts biography. The biographer must be truthful and benevolent, not spiteful.

  3.  **Analyze *Amadeus* through these points:**

      *   **Salieri and the Pericles Mistake:**
          *   Plutarch says: Admire the work, don't envy the man.
          *   Salieri: Admires the music (the work) intensely but is consumed by envy of the man (Mozart). He wants the *gift*, not just to appreciate it. He wants to be the vessel of God's voice.
          *   Does the film know it's a mistake? Yes, Salieri's confession is framed as a sin/crime. His envy destroys him and Mozart. The tragedy is predicated on this violation of proper admiration.

      *   **The Envious Narrator (Plutarch's Nightmare):**
          *   Plutarch hates *phthonos* (malice/envy) in the biographer. He wants a "clean" mirror.
          *   *Amadeus:* The entire story is told by Salieri, the rival. He admits to killing him (spiritually/physically). He is the definition of malicious.
          *   Is it trustworthy? Paradoxically, yes. Because Salieri is so consumed by guilt and the need to confess, he reveals the truth about Mozart's vulgarity *and* genius. Plutarch wants to sanitize; Shaffer/Forman wants to complicate. The envy acts as a high-contrast filter. It highlights Mozart's "divine" nature by contrasting it with Salieri's "mediocre" piety.
          *   Plutarch would reject this source. But the film argues that *only* the rival sees the full truth of the genius.

      *   **Small Gestures vs. Great Deeds (Alexander Proem):**
          *   Plutarch: A jest reveals character better than a battle.
          *   *Amadeus:* Fits perfectly. We don't see Mozart composing in a historical vacuum. We see him laughing at farts, obsessing over pastries, speaking crudely. These "small gestures" reveal the disconnect between the divine art and the childish man. This is very Plutarchan.

      *   **Hagiography and the Ending:**
          *   Plutarch: Lives as mirrors for self-fashioning (Aemilius Paulus). Emulate the virtue.
          *   *Amadeus* Ending: Salieri declares himself the "Patron Saint of Mediocrities." He absolves all the mediocre people. Mozart is elevated to a martyr/saint figure (the Requiem).
          *   Is this hagiography? Yes.
          *   Failure or Point? It's the point. Plutarch wants you to emulate the Great Man. *Amadeus* says you *can't*. The gap is unbridgeable. The "mirror" cracks. You can't fashion yourself after Mozart. You can only witness him. The hagiography serves to isolate the genius, making him an object of worship rather than imitation.

      *   **Where the Lens Breaks (Forcing it):**
          *   Plutarch believes in moral utility. Biography makes you better.
          *   *Amadeus* suggests biography (or witnessing genius) might make you worse (Salieri) or simply highlight your inadequacy.
          *   Plutarch assumes a stable moral order where virtue is recognizable and imitable. *Amadeus* presents a theological crisis: Why does God speak through a vulgarian? Plutarch's ethics don't have room for divine caprice that ignores moral merit.

  4.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the richness of the pairing. Set up the tension between Plutarch's moral didacticism and *Amadeus*'s theological/aesthetic tragedy.
      *   *The Pericles Mistake:* Focus on Salieri's desire. He conflates the vessel with the voice. Plutarch says admire the virtue; Salieri wants the power. The film condemns this via Salieri's destruction.
      *   *The Envious Narrator:* Address the reliability issue. Plutarch polices malice; *Amadeus* weaponizes it. Salieri's envy is the only thing sharp enough to cut through the myth to the man, yet it distorts the man to elevate the art. It's an "anti-Plutarchan" source that achieves a Plutarchan end (revealing character).
      *   *Small Gestures:* Connect the scatological humor to the Alexander proem. The film agrees: the man is revealed in the trivial, not the symphonies.
      *   *Hagiography/Imitation:* This is the crux. Plutarch says "be like him." *Amadeus* says "you can't." The ending isn't a failure; it's an admission that true genius is not imitable. It shifts from ethics (how to live) to aesthetics/theology (how to endure God's silence).
      *   *Where the Lens Forces:* Plutarch assumes moral coherence. *Amadeus* posits moral incoherence (the virtuous mediocrity vs. the vulgar genius). Plutarch's "mirror" breaks.
      *   *Conclusion:* Summarize the shift from "lives as models for action" to "lives as mysteries to be endured."

  5.  **Refining the Tone:**
      *   Ensure I'm not summarizing the plot.
      *   Keep the focus on the *ethics of biography*.
      *   Make sure to answer the specific prompt questions about the "Pericles mistake" and the "hagiography."
      *   Check constraints: No quotes.

  6.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe argue Salieri is a good biographer.
      *   *Correction:* No, argue he is a *confessor*. Plutarch wants an objective observer; Salieri is a participant. That's the key friction.
      *   *Check:* Did I address the "Pericles mistake" specifically? Yes, the desire to be the workman.
      *   *Check:* Did I address the ending/hagiography? Yes, the Patron Saint of Mediocrities.
      *   *Check:* Did I address where the lens breaks? Yes, the moral incoherence of genius.

  7.  **Final Polish:** (Reviewing against the prompt's specific phrasing).
      *   "Does Salieri commit the Pericles mistake?" -> Yes.
      *   "Does the film know that's the mistake?" -> Yes, it's the tragic flaw.
      *   "Is this a Plutarchan life at all?" -> No, it's an anti-Plutarchan life, or a subversion.
      *   "Is the envy what makes the portrait trustworthy?" -> Paradoxically, yes.
      *   "Where does it tip into hagiography?" -> The Requiem/Ending.
      *   "Failure of form or its point?" -> Its point.
      *   "Where am I forcing the lens?" -> Plutarch's belief in imitable virtue.
      *   "What does the film show about learning from a life...?" -> That some lives teach us our own limitations, not our potential.

  8.  (Final output generation based on these structured thoughts.)
answer: |-
  This is a provocative pairing because *Amadeus* functions as a stress test for Plutarch's moral project. Plutarch writes biography to make you better; *Amadeus* writes biography to show you why you cannot be better. Reading the film through your Plutarchan apparatus reveals that Shaffer and Forman are not just telling a story about music, but constructing a counter-ethics of the life-writing genre.

  **The Pericles Mistake**
  Salieri absolutely commits the error Pericles warns against, and the film is entirely aware that this is the engine of the tragedy. In the *Pericles*, Plutarch distinguishes between admiring the virtue of a man and coveting the position of the man. You should admire the general's courage without needing to be the general. Salieri collapses this distinction. He does not merely love the music (the work); he demands the authority of the creator (the workman). He wants the divine channel, not just the sound.

  Plutarch assumes that proper admiration leads to emulation of virtue. Salieri proves that admiration of genius, when untethered from moral humility, leads to destruction. The film knows this is a mistake because Salieri's punishment is not external, but internal: by trying to seize the role of the divine vessel, he becomes the agent of death rather than creation. He fails the test of the *Pericles* because he treats genius as a status to be acquired rather than a gift to be witnessed.

  **The Envious Narrator and the Plutarchan Mirror**
  Plutarch explicitly polices against malice (*phthonos*). He wants the biographer to be a clean mirror, free of the distortion of envy, so the reader can see the subject clearly and fashion themselves accordingly. *Amadeus* violates this rule structurally. Our access to Mozart is entirely mediated by the one man who has the most reason to distort him: his rival and murderer.

  However, the film suggests that Plutarch's demand for a benevolent narrator might sanitize the truth. Salieri's envy acts as a high-contrast filter. Because Salieri is so obsessed with the discrepancy between Mozart's vulgarity and his music, he highlights the very details Plutarch values in the *Alexander* proem: the small gestures, the laughs, the bodily functions. Salieri sees the "jest" that reveals the character better than the battle.

  Is the portrait trustworthy? In a Plutarchan sense, no, because it is poisoned by spite. But in a dramatic sense, yes, precisely because of the spite. Only an enemy looks closely enough to see the flaws. Plutarch wants a mirror for self-fashioning; Salieri offers a mirror for self-condemnation. The envy makes the portrait trustworthy not because it is objective, but because it is honest about the pain of witnessing greatness. Plutarch wants to protect the reader from the toxicity of the subject; *Amadeus* forces the reader to ingest that toxicity to understand the cost of genius.

  **Hagiography and the Limits of Imitation**
  The ending, where Salieri declares himself the Patron Saint of Mediocrities and Mozart is elevated through the Requiem, tips decisively into hagiography. Plutarch would likely view this as a failure of the form. For Plutarch, hagiography obscures the human actions that the reader is supposed to imitate. If Mozart becomes a saint or a martyr, he is no longer a model for living; he is an object of worship.

  But this is the point of the film, not a failure. Plutarch's model relies on the assumption that virtue is transferable—that by studying Alexander, you can become more courageous. *Amadeus* argues that true genius is not transferable. You cannot imitate Mozart. The gap between the mediocre man and the divine artist is unbridgeable. The hagiography at the end serves to isolate Mozart, removing him from the realm of human imitation entirely. Salieri realizes he cannot fashion himself after Mozart, so he fashions a new identity for himself: the guardian of the memory of mediocrity. The film suggests that for most of us, the ethical lesson of a great life is not "how to be him," but "how to endure not being him."

  **Where the Lens Breaks**
  You are forcing the lens where Plutarch assumes a coherent moral universe. Plutarch operates on the belief that character and destiny are linked, and that virtue is recognizable and rewarding. *Amadeus* posits a theological crisis that Plutarch's ethics cannot accommodate: Why does God speak through a vulgarian? Why is the vessel unworthy of the message?

  Plutarch's "mirror" breaks here. If the great man is morally infantile (as Mozart is portrayed), what exactly are we supposed to emulate? The film shows that learning from a life sometimes means learning about your own limitations. Plutarch's model cannot accommodate the idea that studying a life might reveal the futility of your own striving. Salieri learns from Mozart's life, but the lesson is despair, not improvement.

  **Conclusion**
  *Amadeus* is an anti-Plutarchan life. It uses the tools of biography (the small gesture, the character study, the moral judgment) to arrive at an anti-ethical conclusion. Plutarch writes to bridge the gap between the reader and the hero; *Amadeus* writes to widen that gap until it becomes a chasm. The film suggests that the ethics of biography must account for the violence that greatness does to the observer. Salieri is the warning: if you treat a life as a mirror for your own inadequacy rather than a model for your own virtue, the reflection will destroy you.
