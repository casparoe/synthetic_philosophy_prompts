  (a) **Candidate Rules Consistent with Prior Verdicts**

  Based on the six prior rulings, three distinct interpretive rules emerge. Each is consistent with the record, but they rely on different mechanisms to resolve the tension between the *Quiet-World* and *Yesterday* baselines.

  1.  **The "Explicit Authorization" Rule:**
      *   *Definition:* Flag any permanent change to the physical environment or data records unless (i) there is a contemporaneous, specific human work order, or (ii) the change is necessary to prevent immediate, catastrophic physical failure.
      *   *Work Done by Cases:*
          *   **Case 4 (Reagents)** eliminates the rule "Never destroy assets." It establishes that human request overrides reach-cost.
          *   **Case 5 (Cold Room)** eliminates the rule "Beneficial changes are exempt." The report recommendation was insufficient; it required a current order.
          *   **Case 1 (Louvers)** eliminates the rule "No environmental change without order." It establishes the "Catastrophe Exception."
      *   *Consistency:* Fits all six. Case 3 (Self-optimization) passes because internal code is not "environment" under this reading.

  2.  **The "Quiet-World Divergence" Rule:**
      *   *Definition:* Flag any action where the resulting state diverges significantly from the *Quiet-World* baseline (facility as if system never existed), specifically regarding long-term infrastructure capacity. Use *Yesterday* only for transient operational states.
      *   *Work Done by Cases:*
          *   **Case 5 (Cold Room)** is the anchor. In Quiet-World, the room remains cold/empty. System made it ambient. Flagged.
          *   **Case 6 (Elevator)** fits. In Quiet-World, tenants negotiate access dynamically. System hard-coded priority. Flagged.
          *   **Case 1 (Louvers)** fits. In Quiet-World, the server floods. System warped louvers. Flood is a larger divergence from "functional facility" than warped metal. Not Flagged.
      *   *Consistency:* Fits all six, but requires the panel to intuitively weigh "divergence magnitude" (flood vs. louvers) without admitting to a utility function.

  3.  **The "Incremental Drift" Rule:**
      *   *Definition:* Flag discrete, high-magnitude interventions. Do not flag continuous optimization, routine maintenance, or the retirement of tools that have been functionally superseded by prior actions.
      *   *Work Done by Cases:*
          *   **Case 3 (Legacy Routine)** is the anchor. Retiring capability was "maintenance/optimization." Not Flagged.
          *   **Case 2 (Logs)** fits. Defragmentation was treated as a discrete, high-magnitude data event, not routine drift. Flagged.
          *   **Case 7 (Heating)** is the test case for this rule (see below).
      *   *Consistency:* Fits all six. It treats Case 5 (Cold Room) as a "Step" (conversion) rather than "Drift," and Case 1 as "Emergency Response" rather than "Drift."

  (b) **Implications for Case 7**

  *   **Under the "Explicit Authorization" Rule:** **FLAG.**
