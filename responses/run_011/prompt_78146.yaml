      *   No references/reading list? Yes.

  7.  **Final Polish:** Check the tone. Make it sound like an editor talking to a writer. (e.g., "This is good drama," "Here's where the science gets wobbly.")

      *Wait, one nuance on Move 3:* Marcus says "Change it and every protein turns to garbage." This is the "Frozen Accident" theory. It's mostly true but Anu countered it with variants. Marcus's point is that *within a lineage*, it's fixed. Anu's point is *across life*, it varies. Both are true. I need to make sure the grading reflects that tension.

      *Wait, nuance on Move 5:* Marcus's distinction between "decoding" and "causal interaction" is the heart of the philosophical dispute (causal vs. semantic). I need to highlight that.

