          1.  Move-by-Move Grading (1-7).
          2.  The Verdict (Who is right? What is the buried disagreement?).
          3.  The Missing Moves (What to add to the scene).
      *   *Tone:* Professional, analytical, respectful of the science and the philosophy.
      *   *Specifics:* Ensure the distinction between Shannon information (syntax) and Semantic information (meaning) is clear. Ensure the "Frozen Accident" is highlighted.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Anu is right." In philosophy of biology, this is still debated (Biosemiotics). I should frame it as: Anu is right about the *mechanism*, Marcus is right about the *metaphysics*. The buried disagreement is about whether *function* implies *meaning*.

      *Refining the "Missing" section:* The most crucial missing piece is the **tRNA Synthetase**. Anu works on these! She missed the chance to say "I study the physical embodiment of the dictionary." That's a huge character beat. Marcus missed the chance to talk about how the ribosome *reads* without *understanding*.

  6.  **Final Review against constraints:**
