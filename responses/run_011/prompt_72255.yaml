      *   **The Procedure:** "The Robustness & Dependency Screen (RDS)." Keep it to 4 steps. Define the verdicts clearly.
      *   **Philosophical Provenance:** Explicitly list what was kept (Structural Realism, Entity Realism aspects) and dropped (Scientific Realism truth claims).
