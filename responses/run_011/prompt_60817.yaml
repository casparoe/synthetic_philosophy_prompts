  **Scenario**

  Dr. Aris Thorne is the Chief Actuary for a regional hospital network's transfer desk, tasked with assessing risk for inter-facility patient movements without influencing the medical decisions herself. She evaluates two empirical propositions regarding the next incoming trauma case: $A$, that the patient will require intensive care admission, and $B$, that the patient will survive the first week. Thorne is an orthodox Bayesian with finitely additive credences who adheres to Adams's thesis, pricing the conditional *if $A$ then $B$* at her conditional credence $P(B|A)$. Her current assessed probabilities are $P(A) = 0.40$ and $P(B|A) = 0.60$, implying $P(A \land B) = 0.24$. A shrewd bookmaker, knowing Thorne's prices and her willingness to buy or sell wagers at fair value, offers her a package of three contracts with a face value of $100 each. The bookmaker insists on the material convention for the conditional wager, treating *if $A$ then $B$* as true whenever $A$ is false, while Thorne believes she is pricing a standard conditional wager that should be called off if the antecedent fails.

  ***

  **Demonstration**

  **1. The Material Convention (Strict Dutch Book)**

  Under the material convention, a wager on $A \to B$ pays out if $\neg A \lor (A \land B)$. The agent accepts the following three wagers at her stated fair prices.

  | Wager | Position | Stake | Price (Paid/Received) | Payoff Condition |
  | :--- | :--- | :--- | :--- | :--- |
  | 1. On $A$ | Sell | $100 | Receive $40.00 | Pays $100 if $A$ is True |
  | 2. On $A \to B$ | Sell | $100 | Receive $60.00 | Pays $100 if $\neg A \lor (A \land B)$ |
  | 3. On $A \land B$ | Buy | $100 | Pay $24.00 | Pays $100 if $A \land B$ is True |
  | **Net Cash** | | | **+$76.00** | |

  **Settlement Arithmetic (Net Position = Cash Received - Payouts):**

  *   **State 1 ($A \land B$):**
      *   Wager 1 (Sell $A$): Pay $100.
      *   Wager 2 (Sell $A \to B$): Pay $100 (Conditional is True).
      *   Wager 3 (Buy $A \land B$): Receive $100.
      *   Net: $76 - 100 - 100 + 100 = \mathbf{-\$24.00}$.
  *   **State 2 ($A \land \neg B$):**
      *   Wager 1 (Sell $A$): Pay $100.
      *   Wager 2 (Sell $A \to B$): Pay $0 (Conditional is False).
      *   Wager 3 (Buy $A \land B$): Receive $0.
      *   Net: $76 - 100 - 0 + 0 = \mathbf{-\$24.00}$.
  *   **State 3 ($\neg A \land B$):**
      *   Wager 1 (Sell $A$): Pay $0.
      *   Wager 2 (Sell $A \to B$): Pay $100 (Conditional is True).
      *   Wager 3 (Buy $A \land B$): Receive $0.
      *   Net: $76 - 0 - 100 + 0 = \mathbf{-\$24.00}$.
  *   **State 4 ($\neg A \land \neg B$):**
      *   Wager 1 (Sell $A$): Pay $0.
      *   Wager 2 (Sell $A \to B$): Pay $100 (Conditional is True).
      *   Wager 3 (Buy $A \land B$): Receive $0.
      *   Net: $76 - 0 - 100 + 0 = \mathbf{-\$24.00}$.

  **Result:** The agent loses $24.00 in every possible state of the world.

  ***

  **2. The Call-Off Convention (No Dutch Book)**

  Under the call-off (de Finetti) convention, the wager on $A \to B$ is void if $A$ is false; the stake is returned, and no payoff occurs.

  | Wager | Position | Stake | Price (Paid/Received) | Payoff Condition |
  | :--- | :--- | :--- | :--- | :--- |
  | 1. On $A$ | Sell | $100 | Receive $40.00 | Pays $100 if $A$ is True |
  | 2. On $A \to B$ | Sell | $100 | Receive $60.00 | Pays $100 if $A \land B$; Void if $\neg A$ |
  | 3. On $A \land B$ | Buy | $100 | Pay $24.00 | Pays $100 if $A \land B$ is True |
  | **Net Cash** | | | **+$76.00** | |

  **Settlement Arithmetic:**

  *   **State 1 ($A \land B$):**
      *   Wager 1: Pay $100. Wager 2: Pay $100. Wager 3: Receive $100.
      *   Net: $76 - 100 = \mathbf{-\$24.00}$.
  *   **State 2 ($A \land \neg B$):**
      *   Wager 1: Pay $100. Wager 2: Pay $0. Wager 3: Receive $0.
      *   Net: $76 - 100 = \mathbf{-\$24.00}$.
  *   **State 3 ($\neg A \land B$):**
      *   Wager 1: Pay $0$. Wager 2: Void (Refund $0$ liability). Wager 3: Receive $0$.
      *   Net: $76 - 0 = \mathbf{+\$76.00}$.
  *   **State 4 ($\neg A \land \neg B$):**
      *   Wager 1: Pay $0$. Wager 2: Void (Refund $0$ liability). Wager 3: Receive $0$.
      *   Net: $76 - 0 = \mathbf{+\$76.00}$.

  **Result:** The agent loses money if $A$ occurs, but makes a substantial profit if $A$ fails to occur. There is no Dutch Book (strict or weak).

  ***

  **Analysis of Conventions and States**

  The two conventions disagree entirely in the $\neg A$ states (States 3 and 4). Under the material convention, the conditional is *true* when the antecedent is false, creating a liability for the agent who sold the wager. Under the call-off convention, the contract is *void* when the antecedent is false, eliminating the liability. The material convention yields a Dutch book precisely because it extracts payment from the agent in the $\neg A$ states for a condition she priced as irrelevant to the truth of the conditional. The $\neg A$ states are "carrying the book"; without the liability in those states, the losses in the $A$ states are offset by the initial premiums kept in the $\neg A$ states.

  Regarding the third wager (Buy $A \land B$): Under the call-off clause, the second wager (Sell $A \to B$) effectively collapses into a wager on $A \land B$ restricted to the $A$ partition. Since the third wager is a buy order on $A \land B$ across the same partition, the two contracts cancel each other out completely whenever $A$ is true. In the $\neg A$ partition, both pay zero. This collapse is a **legitimate blocking** of the book, not a cheap trick. It follows directly from the definition of the conditional wager contract. If the contract specifies "void if $\neg A$," then mathematically it cannot generate the liability required to complete the Dutch book in the $\neg A$ states. To insist otherwise is to change the terms of the wager after the price is set.

  **Dependence on Credence Values**

  A strict Dutch book under the material convention exists for **every pair** of credences $P(A) = a$ and $P(B|A) = x$ in the open unit interval $(0, 1)$. The sure loss is calculated as $\text{Stake} \times (1 - a)(1 - x)$.
  *   As the antecedent grows near-certain ($a \to 1$), the loss approaches zero. This is because the $\neg A$ states (where the material and conditional conventions diverge) become improbable, and the stakes required to generate a fixed dollar loss would need to approach infinity.
  *   As the conditional credence approaches one ($x \to 1$), the loss also approaches zero. Here, the agent prices the conditional wager nearly at par with the material wager, reducing the arbitrage opportunity.
  *   If either value is 0 or 1, the strict book vanishes (becoming a weak book or disappearing entirely), as the agent's prices align with the truth-functional values.

  **Reply to the Material Conventionalist**

  The strongest reply to a colleague insisting that the material convention is the only coherent reading is this: **Dutch Book arguments establish inconsistency between an agent's prices and the *payoff rules* of the wagers, not between prices and the agent's mind.** If the agent understands "If $A$ then $B$" as a conditional assertion that lacks a truth value when $A$ is false (or is simply void), then pricing it at $P(B|A)$ is coherent *relative to that understanding*. The material conventionalist is smuggling in a truth-functional definition of the conditional that the agent explicitly rejects. The Dutch book proves only that the agent's prices are incompatible with the *bookmaker's* interpretation of the contract terms.

  **Assessment:** This concedes that Dutch Book arguments are not freestanding proofs of irrationality. They are conditional proofs: *If* the wagering conventions map onto the agent's semantic understanding, *then* incoherent prices lead to sure loss. If the mapping fails (as it does with Adams's thesis and material wagers), the argument loses its normative force against the agent's credences. The "irrationality" lies in the mismatch of contract semantics, not necessarily in the probability function.
