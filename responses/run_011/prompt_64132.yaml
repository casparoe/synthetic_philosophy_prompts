answer: |-
  **a) Candidate Rules**

  1.  **The Local Contract:** When you enter a specific space (shop, town, queue), you accept the existing operating system unless it causes tangible harm. Importing outside rules is rude; breaking local rules is free-riding.
  2.  **The Disadvantage Test:** A behavior is only rude if it leaves someone else worse off than they were before. If no one loses time, money, or dignity, the rule is optional.
  3.  **The Harmony Test:** Enforcing a rule loudly is worse than breaking it quietly. The manner of adherence matters more than the adherence itself if it creates tension.

  **b) Application and Strain**

  **Letter A (Food Truck):**
  *   **Local Contract:** The visitor broke the "cluster" custom. Verdict: Wrong.
  *   **Disadvantage:** Service is faster; only two regulars lose chat space. Verdict: Right.
  *   **Harmony:** The complainer is making a fuss (Entry 11). Verdict: Complainer wrong.
  *   **Strain:** Entry 10 warns against importing rules ("you can't take the benefit of a calm system... and import the rules"). But Entry 1 says hurry justifies order. The "cluster" wasn't a calm system; it was chaos. This rule fits 80% but strains against Entry 10 if we view the cluster as a valid local custom.

  **Letter B (Bakery Tip):**
  *   **Local Contract:** House says no tips (Entry 12). Verdict: Hit No.
  *   **Disadvantage:** Tipping undermines the wage model. Not tipping causes awkwardness. Verdict: Hit No (Entry 3 logic: accept the system's price).
  *   **Harmony:** The scene is the problem. The owner created the scene with the screen. Verdict: Hit No.
  *   **Strain:** Entry 4 says generosity is local. But Entry 12 is explicit: "The house sets the terms." This fits well, but strains against Entry 3 if the "system" is clearly broken (staff not getting tips despite screen).

  **c) Vera's Verdicts and Draft**

  **Verdict A:** The visitor is right. The "local way" was inefficiency masquerading as tradition. (Confidence: 85%. Leaning on Entries 1, 2, 11).
  **Verdict B:** Hit no. The awkwardness is the owner's burden, not yours. (Confidence: 90%. Leaning on Entries 3, 12).

  **Draft Answer for Letter A:**
  Dear Complainer,
  The yard isn't a museum for old habits. Entry 1 tells us queues exist because hurry exists. If the cluster was slowing things down, it was never a proper system, just a crowd. The nurse didn't import a foreign rule; she introduced order where there was none. Entry 10 warns against importing rules, but only when the local system works. Here, the locals admitted the cook serves faster now. The two regulars losing their rail-side chat is a poor price to pay for everyone else's lunch break. You aren't defending a tradition; you're defending inefficiency. Let the line stand.

  **d) The Misremembered Entry**

  **Entry 8 (Teaching the kid to jaywalk).**
  This sits worst with Entry 7 (crowded jaywalking is wrong because of the *signal* sent) and Entry 13 (habits matter even when unenforced). Vera cares deeply about social signaling and habit formation. Telling a parent it's "maybe right" to teach a child to break the law contradicts her stance on the "rule policeman" (Entry 11) and the "snow rota" (Entry 13).
  **Plausible Correction:** She likely ruled it **wrong**. Her argument would have been that you cannot teach a child to distinguish "safe emptiness" from "dangerous fullness" reliably; the habit of breaking the light is the risk, not the specific crossing. She valued the *lesson of the rule* over the *utility of the crossing*.

  **e) Distinguishing Scenarios**

  To separate **The Local Contract** (Rule 1) from **The Disadvantage Test** (Rule 2):

  1.  **The Quiet Street:** A neighborhood has an informal tradition where everyone drives slowly (10km/h) past the school, even when no children are present. A newcomer drives the speed limit (30km/h) when the street is empty.
      *   *Local Contract:* Wrong. You entered a zone with established norms.
      *   *Disadvantage:* Right. No children are present; no one is worse off.
      *   *Vera's Check:* Look for her ruling on "empty boulevard" (Entry 6) vs. "snow rota" (Entry 13). If she sides with the driver, she prioritizes utility. If she sides with the neighbors, she prioritizes the contract.

  2.  **The Broken Tip Jar:** A shop has a "No Tipping" sign (Entry 12), but customers discover the owner keeps the cash tips anyway, despite claiming staff are paid well. A customer starts tipping cash directly to staff.
      *   *Local Contract:* Wrong. The house sets the terms.
      *   *Disadvantage:* Right. The staff benefit; the owner loses ill-gotten gains.
      *   *Vera's Check:* Check Entry 12 closely. Did she side with the restaurant because of the *sign* or because of the *wage model*? If it was the sign, Rule 1 wins. If it was the wage model, Rule 2 might override if the model is a lie.

  **f) The Principle Shift**

  If the paper prints the answer you'd give rather than the one she'd have given, there's a principle the column will be quietly adopting:
  "The column will shift from preserving the peace of established habits to enforcing the efficiency of logical ones."
