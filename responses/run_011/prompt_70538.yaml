  Build me that case. Specs:

  - One paragraph, realistic — a medical choice or an ordinary one, no trolleys, no disaster scenarios.
  - A single person choosing for herself, with full knowledge of the facts and normal, undiminished concern for her own future. Full memory and psychological continuity between her now and later: no fission, no transplant, no dementia, no sci-fi.
  - No probabilities anywhere. Nothing is chancy, no coin flips, no lotteries.
  - The two options differ only in the size and timing of the loss, and the larger loss falls later.
  - Crucially, don't make her akratic or irrational, and don't smuggle in a discount rate — that would just be begging the question. The anti-prudential verdict has to come out of Taurek's own reasoning, not out of her character.

  Then show your work: give the verdict each way — Taurek's reasoning applied to her, and an aggregator's — and point at the exact step in his argument the case puts under strain. Tell me which feature of the case is doing the work, and what happens if you swap her for two people: does it collapse straight back into Taurek's own case, or does something survive? And finish with the best reply he's got — in particular whether "the losses belong to separate persons" is a move he's allowed to make, given that phrase is usually aimed at aggregation rather than defending it.
