answer: |-
  Elena faces a certain medical trajectory where she must choose between a minor procedure today costing her two weeks of painful immobility or deferring intervention until next year, at which point the condition will necessitate a major surgery costing her three months of painful immobility. She possesses full psychological continuity and memory between now and then, faces no uncertainty about the outcomes or her survival, and holds a normal, undiminished concern for her future welfare without applying any discount rate to future pain; the choice is strictly between a smaller burden borne by her present self and a larger burden borne by her future self.

  **Show Your Work**

  **The Verdicts**
  *   **Aggregator/Prudential Rationality:** Elena must choose the minor procedure. The total loss (two weeks) is less than the alternative (three months), and since she is one person, the losses sum into a single lifetime deficit she is rational to minimize.
  *   **Taurek's Reasoning (Applied Intrapersonally):** If the reason we cannot sum losses across people is that losses are experienced separately by distinct subjects, then Elena's present pain and future pain are also experienced separately by distinct temporal stages. If there is no "super-loss" across persons, there is no "super-loss" across time; therefore, the larger total loss is not decisive, and she is permitted to avoid the present loss even if it guarantees a greater future loss.

  **The Strain**
  This case puts strain on Taurek's inference from **"losses are experienced separately"** to **"losses cannot be summed."** The feature doing the work is the **separateness of experience** itself. In Elena's case, the experiences are just as separate (in time and phenomenology) as they are across people, yet we insist aggregation is rational. This suggests that separateness of experience alone cannot be what blocks aggregation; otherwise, prudential rationality collapses.

  **The Swap**
  If you swap Elena's temporal stages for two different people (Elena vs. Stranger), the case collapses straight back into Taurek's original 1-vs-1 rescue scenario. The intrapersonal case survives as a counter-argument only because we have a pre-theoretical conviction that intrapersonal aggregation *is* valid. The swap reveals that Taurek's logic treats the boundary of the person as morally magical: aggregation is mandatory inside the boundary but forbidden outside it, despite the experiential separateness being identical in both cases.

  **Taurek's Best Reply**
  Taurek's best reply is to insist that **"the losses belong to separate persons"** is a moral premise, not just a metaphysical observation. He is allowed to make this move because his thesis concerns *moral* obligation between agents, not prudential rationality within an agent. He can argue that the "person" is the fundamental unit of moral concern, so while Elena has reason to minimize her total lifetime loss, no third party has reason to minimize the total loss across Elena and a stranger. However, this invites the charge of arbitrariness: if the *reason* persons count separately is that their experiences are distinct, then temporal slices should count separately too; if temporal slices don't count separately, then the distinctness of experience wasn't the real reason after all.
