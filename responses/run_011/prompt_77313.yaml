answer: |-
  **The menu**

  1.  **Uniform Sampling:** Your birth rank $n$ is drawn uniformly from the set $\{1, ..., N\}$, so $P(n|N) = 1/N$ for all $N \ge n$.
  2.  **Fixed Reference Class:** The set of entities counted as "observers" is objective and fixed exogenously, not chosen by you.
  3.  **Prior Independence:** Your existence provides no information that updates the prior probability distribution $P(N)$ over total population sizes.
  4.  **Indexical Exclusion:** Indexical information (e.g., "I am alive now") is screened off and inadmissible for conditionalization.
  5.  **SIA Rejection:** The probability of your existence is independent of $N$, denying $P(\text{I exist}|N) \propto N$.
  6.  **Evidence Insulation:** External historical evidence (technology, colonization) cannot override the inference drawn from birth rank.
  7.  **Scale Invariance:** The prior over $N$ follows a power law $P(N) \propto 1/N$, implying no preferred scale for civilization longevity.
  8.  **Observer Equivalence:** All possible observers are weighted equally in the probability measure; no observer is privileged.
  9.  **Temporal Copernicanism:** The present moment is not causally privileged within the timeline of all observer moments.
  10. **Predictive Humility:** You cannot assign high probability to being in the extreme tails (e.g., first 5%) of the total sequence.

  **Verdicts**

  1.  Substantive-but-defensible: Standard assumption under conditions of total ignorance regarding rank.
  2.  Substantive-but-defensible: Requires metaphysical justification for what counts as an observer.
  3.  False: Existence usually updates priors unless explicitly screened off by assumption.
  4.  False: Indexical information is valid evidence in Bayesian updating; people reach for it because it feels like "bias."
  5.  Substantive-but-defensible: Contested assumption distinguishing SSA from SIA frameworks.
  6.  False: Contradicts standard Bayesian conditionalization which demands using all available evidence.
  7.  Substantive-but-defensible: Common non-informative prior, but not uniquely justified.
  8.  Platitude: Trivially true if observers are defined identically, vacuous otherwise.
  9.  Platitude: Restates Uniform Sampling without adding probabilistic structure.
  10. Substantive-but-defensible: Direct consequence of Uniform Sampling at 95% confidence.

  **What the argument needs**

  To derive the conclusion $N < 20n$ with 95% confidence, the argument requires a specific conjunction of readings from the menu, not just the slogan. Primarily, it needs Reading 1 (Uniform Sampling), asserting $P(n|N) = 1/N$. This establishes the likelihood function. However, likelihood alone is insufficient without a prior. The argument implicitly relies on Reading 7 (Scale Invariance), a prior over $N$ of $P(N) \propto 1/N$. If you assume a flat prior over $N$ instead, the posterior shifts differently, and the 20x bound does not hold universally. Furthermore, to reach the doomsday conclusion rather than a neutral update, you must enforce Reading 5 (SIA Rejection). If you accept the Self-Indication Assumption, the likelihood of your existence scales with $N$, mathematically cancelling the $1/N$ sampling factor and neutralizing the doomsday shift. Dave needs this rejection to be true, but "you're not special" does not entail it; in fact, SIA proponents argue *not* assuming it makes you special by ignoring observer count.

  Additionally, the argument collapses without Reading 2 (Fixed Reference Class). Tom's objection highlights that $n$ and $N$ are undefined without a rigid class. If the class is subjective, the uniformity assumption applies to arbitrary sets, rendering the arithmetic vacuous. Dave must claim the class "humans" is objective, which is a metaphysical premise, not a probabilistic one. Finally, to dismiss Mira, Dave must invoke Reading 6 (Evidence Insulation). He must claim that external data (tech level, colonization status) is inadmissible for updating $N$ via this mechanism. This is the weakest link. "You're not special" plausibly supports Reading 1 (ignorance of rank), but it does not logically forbid using available evidence to update priors. Blocking Mira requires defining "special" as "using evidence," which is question-begging.

  Dave's three dismissals map unevenly onto these requirements. Dismissing Tom requires Reading 2 to be objectively true, which the slogan does not prove. Dismissing the SIA pushback requires Reading 5, which contradicts the intuition that existing in a populous world is more likely. Dismissing Mira requires Reading 6, which violates standard Bayesian conditionalization. Thus, the slogan masks a fragile chain: Uniform Sampling + Scale-Invariant Prior + SIA Rejection + Fixed Reference Class + Evidence Insulation. If any link breaks, the 95% confidence bound dissolves. Dave's dismissals work only if "not special" is treated as a trump card that overrides standard Bayesian conditionalization, which is itself a substantive and controversial methodological claim. The arithmetic works only if you accept all five premises; the slogan only sounds like it justifies the first.

  **Who was saying what**

  Dave is equivocal, swapping between Reading 1 (math) and Reading 6 (evidence block) to defend against objections. Mira is challenging Reading 6, insisting indexical data is valid evidence. Tom is challenging Reading 2, noting reference classes are subjective. The real disagreement is metaphysical: what constitutes the relevant observer class and whether existence is evidence. The verbal disagreement is Dave using "not special" as a universal shield. Tom's reference class objection is decisive; without an objective way to fix the class, the uniformity assumption is arbitrary. Dave's dismissal of SIA is also a substantive claim (Reading 5), not a tautology. Once pinned, Dave must admit his conclusion relies on contested premises, not just arithmetic.
