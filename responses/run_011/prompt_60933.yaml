answer: |-
  # Activity: The Pramāṇa Tribunal

  **Time:** 75 Minutes
  **Materials:** Printed Deck (16 cards), Printed Role Sheets (4 types), Whiteboard/Chalk.
  **Setup:** One large table (or pushed desks). 4 Groups of 3-4 students.

  ## Part 1: The 90-Second Intro (Read this verbatim)

  "You are four epistemic courts. Each court has a different law code regarding what counts as a valid instrument of knowledge (*pramāṇa*).
  *   **Court 1:** Only Perception.
  *   **Court 2:** Perception + Inference.
  *   **Court 3:** Perception + Inference + Testimony.
  *   **Court 4:** The Full Nyāya List (Perception, Inference, Testimony, Comparison, Postulation, Non-Perception).

  You will receive 16 case cards. Your job is to classify how the knowledge was gained using *only* your allowed tools.
  **The Rule:** If you have a longer list, you must prove you *needed* the extra tool. If you have a shorter list, you score points by showing the longer list's tool was unnecessary (a 'Reduction').
  **The Criterion:** You cannot just name the source. You must describe the **Causal Route** (how the mind got there) and the **Cognitive Character** (what the knowing feels like).
  You have 15 minutes to sort. Then, we litigate."

  ## Part 2: The Role Sheets (Print 4 copies, cut apart)

  **Court 1: The Empiricists**
  *   **Allowed:** Perception (*Pratyakṣa*).
  *   **Strategy:** Attack everyone. "You didn't see it? Then you don't know it. Everything else is guessing."
  *   **Goal:** Reduce all cards to Perception or declare them "Not Knowledge."

  **Court 2: The Rationalists**
  *   **Allowed:** Perception, Inference (*Anumāna*).
  *   **Strategy:** Attack Court 3 & 4. "Testimony is just inference about reliability. Comparison is just analogy (inference). Absence is just inferring from lack of data."
  *   **Goal:** Show Inference covers everything Perception can't.

  **Court 3: The Communicators**
  *   **Allowed:** Perception, Inference, Testimony (*Śabda*).
  *   **Strategy:** Defend Testimony against Court 2. Attack Court 4. "Postulation is just inference. Non-perception is just inference."
  *   **Goal:** Prove Testimony is distinct from Inference.

  **Court 4: The Nyāya Maximalists**
  *   **Allowed:** Perception, Inference, Testimony, Comparison (*Upamāna*), Postulation (*Arthāpatti*), Non-Perception (*Anupalabdhi*).
  *   **Strategy:** Defend the unique tools. "You cannot reduce Comparison to Inference. You cannot reduce Absence to Inference."
  *   **Goal:** Hold the line. Show cases where the shorter lists fail to explain the *causal route*.

  ## Part 3: The Deck (16 Cards)

  *(Print these on cardstock. Cut them apart. Distribute 4 cards to each group initially, or place in a central draw pile. For this seminar size, give each group the full deck to sort simultaneously to save time.)*

  ---

  **CARD 01**
  You are at a zoo. A keeper points to an animal and says, "This is a gavaya." Later, you walk in the woods and see an animal that looks like the one at the zoo. You think, "This is the animal the keeper called a gavaya."
  > **Key:** **Comparison (*Upamāna*).**
  > **Reduction Attack:** Inference (Analogy). "You inferred identity based on similarity."
  > **Verdict:** **Reduction Fails.** Nyāya argues the cognition of similarity is immediate, not a syllogism. The causal route is recall of the name + perception of similarity, not a logical middle term.

  **CARD 02**
  Your friend Devadatta is fat. You know he never eats during the day. You conclude: "He must eat at night." You have not seen him eat at night, nor did anyone tell you.
  > **Key:** **Postulation (*Arthāpatti*).**
  > **Reduction Attack:** Inference. "Major premise: Fat people eat. Minor: He doesn't eat day. Conclusion: He eats night."
  > **Verdict:** **Debatable (Trap).** Nyāya says this is distinct because the "middle term" isn't observed; it's a conflict resolution (fatness vs. no day-eating). Mīmāṃsā says distinct; Buddhist/Nyāya skeptics say Inference. *Score point for Reduction if they can formulate a valid syllogism without begging the question.*

  **CARD 03**
  You look at your desk. Your keys are not there. You know: "The keys are absent from the desk."
  > **Key:** **Non-Perception (*Anupalabdhi*).**
  > **Reduction Attack:** Inference. "If keys were there, I would see them. I don't see them. Therefore, they aren't there."
  > **Verdict:** **Reduction Fails.** Nyāya says absence is a real object perceived directly by the senses (qualified by the location). Inference requires a positive mark; absence has none.

  **CARD 04**
  A renowned cardiologist tells you, "You have an arrhythmia." You believe her immediately, without checking the ECG yourself.
  > **Key:** **Testimony (*Śabda*).**
  > **Reduction Attack:** Inference. "You inferred she is reliable because she is a doctor."
  > **Verdict:** **Reduction Fails.** Nyāya says the cognition arises from the *meaning of the words*, not a prior check of credentials. If you had to infer reliability first, you'd never learn anything new (infinite regress).

  **CARD 05**
  A stranger on the street says, "There is a dragon in the library." You do not believe them.
  > **Key:** **Failed Testimony.**
  > **Reduction Attack:** N/A.
  > **Verdict:** **Trap.** Shows Testimony requires a competent speaker (*āpta*). It is not "blind faith." This distinguishes valid *Śabda* from mere noise.

  **CARD 06**
  You walk into a kitchen and smell smoke. You know: "There is a fire in this room."
  > **Key:** **Perception (*Pratyakṣa*).**
  > **Reduction Attack:** Inference. "Smoke is the mark of fire. You inferred the fire."
  > **Verdict:** **Reduction Fails (Trap).** If you smell the smoke *directly*, the fire's existence is perceived via the sense of smell (extraordinary perception). Inference is for fire *behind a hill* (unseen). Causal route: Sense contact → Cognition.

  **CARD 07**
  You see a distant figure in a coat walking like your friend. You think, "That is Sarah." Later you find out it was a stranger.
  > **Key:** **Pseudo-Perception / Error (*Viparyaya*).**
  > **Reduction Attack:** Inference. "You inferred identity from gait."
  > **Verdict:** **Reduction Succeeds.** This was not valid knowledge (*pramā*). It was a mistake. If it *had* been Sarah, Nyāya might call it Perception (of the face) or Inference (from gait). As an error, it proves nothing about *pramāṇas*.

  **CARD 08**
  You read a history book: "The treaty was signed in 1919." You were not there. No one told you orally.
  > **Key:** **Testimony (*Śabda*).**
  > **Reduction Attack:** Inference. "You inferred the author is reliable."
  > **Verdict:** **Reduction Fails.** Same as Card 04. Written word counts as testimony if the author is competent. The causal route is understanding language, not reasoning.

  **CARD 09**
  You see a red glow behind a hill. You know: "There is a fire behind that hill."
  > **Key:** **Inference (*Anumāna*).**
  > **Reduction Attack:** Perception. "You saw the glow, that's seeing the fire."
  > **Verdict:** **Reduction Fails.** You did not perceive the fire (substance). You perceived the smoke/glow (mark) and inferred the unperceived fire. Causal route: Mark → Invariable Connection → Conclusion.

  **CARD 10**
  You hear a noise in the attic. You know: "Something is moving up there."
  > **Key:** **Inference (*Anumāna*).**
  > **Reduction Attack:** Perception. "You heard the movement."
  > **Verdict:** **Reduction Fails.** Auditory perception is of the *sound*. The knowledge of the *moving object* causing it is inferential. (Nuanced: Nyāya accepts auditory perception of sound, but the object is inferred).

  **CARD 11**
  A child points to a dog and says, "Cat." You correct them: "No, that is a dog."
  > **Key:** **Perception (*Pratyakṣa*).**
  > **Reduction Attack:** Testimony. "You told them."
  > **Verdict:** **Reduction Succeeds (for the child).** For *you*, it is Perception. For the *child*, if they believe you, it becomes Testimony. Highlights that the *pramāṇa* depends on the knower's causal route.

  **CARD 12**
  You know the rule: "All humans are mortal." You see Socrates is human. You know: "Socrates is mortal."
  > **Key:** **Inference (*Anumāna*).**
  > **Reduction Attack:** Perception. "You see he is dying."
  > **Verdict:** **Reduction Fails.** You know this *before* he dies. The causal route is logical connection, not sensory contact with mortality.

  **CARD 13**
  You are in a pitch-black room. You know: "There is no pot here."
  > **Key:** **Non-Perception (*Anupalabdhi*).**
  > **Reduction Attack:** Inference. "If there were a pot, I'd feel it."
  > **Verdict:** **Reduction Fails.** Similar to Card 03. The absence is the object of cognition. The senses perceive the empty floor, qualified by absence.

  **CARD 14**
  A liar you know tells you, "It is raining." You look outside and see sun. You know: "He is lying."
  > **Key:** **Perception + Inference.**
  > **Reduction Attack:** Testimony. "He spoke."
  > **Verdict:** **Reduction Succeeds.** Testimony requires a *competent/truthful* speaker. Since he is a known liar, *Śabda* does not trigger. You know via Perception (sun) + Inference (contradiction).

  **CARD 15**
  You learn the word "ochre" by being shown a swatch and told, "This color is ochre." Later you identify ochre in a paint store.
  > **Key:** **Comparison (*Upamāna*).**
  > **Reduction Attack:** Perception. "You just saw the color."
  > **Verdict:** **Reduction Fails.** Perception gives you the color. *Comparison* gives you the *name* linked to the similarity. The cognition is "This is that same color named ochre."

  **CARD 16**
  You hear a voice behind a curtain say, "I am the winner." You know: "The person behind the curtain is the winner."
  > **Key:** **Testimony (*Śabda*).**
  > **Reduction Attack:** Inference. "You inferred the speaker is truthful."
  > **Verdict:** **Trap.** If you have no reason to doubt, Nyāya says testimony is self-validating (*svataḥ prāmāṇya*). You don't *need* to infer truth first. The burden is on the doubter.

  ---

  ## Part 4: Rules of Engagement (Projected or Handout)

  1.  **Sort (15 mins):** Each group classifies their cards using *only* their allowed list. Write the "Causal Route" for each (e.g., "Sense contact" vs. "Recall of universal").
  2.  **Challenge (25 mins):**
      *   Shorter lists challenge Longer lists. (e.g., Court 2 challenges Court 4's use of "Non-Perception").
      *   **Attacker:** Must show the cognition *could* and *did* arise from a simpler source.
      *   **Defender:** Must show the simpler source *cannot* produce this specific cognitive character.
      *   **Instructor (Judge):** Awards 1 point for a successful Reduction. Awards 1 point for a successful Defense.
      *   **Limit:** 3 Challenges per group. Keep arguments under 2 minutes.
  3.  **Winning:** Group with the most points. (Prize: Bragging rights as the "True Epistemologists").

  ## Part 5: Troubleshooting & Variants

  **Predictable Failure 1: The "Inference Black Hole"**
  *   *Problem:* The Rationalists (Court 2) will claim *everything* is inference. "You perceived it? You inferred your senses are working."
  *   *Fix:* Intervene immediately. "Stop. Did the cognition *feel* like a calculation (Inference) or like a direct hit (Perception)? Nyāya cares about the phenomenology of the cognition, not just metaphysical possibility."

  **Predictable Failure 2: Semantic Stalling**
  *   *Problem:* Students argue over definitions of "Inference."
  *   *Fix:* Enforce the "Causal Route" requirement. "Don't tell me what it is, tell me *how the mind got there*."

  **Predictable Failure 3: The Quiet Students**
  *   *Problem:* The 3 aggressive students dominate Court 2; the 2 quiet students hide in Court 4.
  *   *Fix:* Assign roles *within* the group. One student is the "Scribe" (writes the Causal Route), one is the "Speaker" (presents the defense). Rotate these roles every 5 cards.

  **Variant: Only 8 Students**
  *   Merge Courts.
      *   **Group 1 (Reductionists):** Perception + Inference. (Task: Reduce everything to these two).
      *   **Group 2 (Nyāya):** Full List. (Task: Defend the necessity of Testimony and Comparison).
      *   **Group 3 (Judges):** Contemporary Epistemology. (Task: Evaluate who is right based on the "Innocent Until Proven Guilty" testimony debate from previous weeks).
      *   **Group 4 (Scribes):** Track the "Causal Routes" on the board for the class to see.

  ## Part 6: The Debrief (15 Minutes)

  **Minute 0-5: The Two-Part Criterion**
  *   Ask Court 4: "Which card was hardest to defend?" (Likely Postulation or Comparison).
  *   Ask Court 2: "Which reduction felt the most forced?"
  *   **Point:** Nyāya individuates *pramāṇas* by (1) **Causal Process** (How did the cognition arise?) and (2) **Cognitive Character** (What does the knowing feel like?).
  *   *Example:* Card 04 (Doctor). Reductionist says "You inferred reliability." Nyāya says "No, the cognition was 'I am sick' arising from words, not 'The doctor is reliable'." If the process differs, the *pramāṇa* differs.

  **Minute 5-10: The Burden of Proof**
  *   Ask Court 1 (Perception Only): "Why did you lose?" (Because you can't know the past, future, or others' minds).
  *   Ask Court 4: "Why not add a 7th *pramāṇa*?"
  *   **Point:** Parsimony. You only add a *pramāṇa* if the existing list *provably cannot deliver the cognition*. Card 02 (Night Eating) is the battleground. Is "conflict resolution" a new tool, or just complex inference?

  **Minute 10-15: Connecting to Contemporary Testimony**
  *   Bring it back to Weeks 1-2.
  *   Reductionism (Weeks 1-2) = Court 2 (Testimony is Inference).
  *   Anti-Reductionism (Weeks 1-2) = Court 4 (Testimony is *Sui Generis*).
  *   **Closing Thought:** Nyāya isn't just listing sources; they are mapping the architecture of the mind to prevent error. If you misidentify the source, you can't troubleshoot the error.

  ## Part 7: Critical Reflection (What This Activity Can't Do)

  You are right to be skeptical about the "linguistic privilege" and the "soteriological gap," but there is a third structural limitation you are missing.

  1.  **Linguistic Privilege:** Your students are already fluent English speakers. Card 01 (Gavaya) feels like a vocabulary lesson to them, not a primal cognitive event. For a Nyāya thinker, *Upamāna* explains how language *hooks onto the world* in the first place. Your students take that hook for granted. The activity makes Comparison look like a "tool," whereas for Nyāya it is the bridge between perception and language.
  2.  **Soteriology:** You noted the points game misses the *niḥśreyasa* (liberation). Nyāya epistemology is therapeutic. Correcting a *pramāṇa* error isn't about winning a debate; it's about stopping the suffering caused by false belief (*duḥkha*). The game gamifies truth, which is the opposite of the Nyāya goal (truth liberates, it doesn't score).
  3.  **The Third Thing: Institutional Authority:** This is the big one. Nyāya *pramāṇa* theory ultimately validates the Veda (*Śabda*). The "competent speaker" (*āpta*) is not just a doctor; it is the Rishi who saw the truth. In your classroom, *you* are the Judge. The game structurally replicates the *authority of the teacher*, but it frames it as "logical adjudication." It hides the fact that for Nyāya, accepting the *pramāṇa* list itself requires an act of faith in the tradition. The game makes them feel like they are discovering the list through reason, when historically, the list is received from the Guru. You are simulating the *logic* of Nyāya while inadvertently replicating its *hierarchy*, without the theological framework that makes that hierarchy acceptable to them.

  **Is this too pessimistic?** No, it's necessary. If you don't tell them "This is a logic simulator, not a liberation simulator," they will leave thinking Nyāya is just a more complicated version of Western evidentialism. Use the reflection to tell them exactly this: "We played with the logic today. Next week, we ask *why* they cared so much about getting it right."
