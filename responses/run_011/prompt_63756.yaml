answer: |-
  Before we specify the theory, we must specify the metric. "Brain size" is not a univocal physical quantity, and the moral weight of a theory often hinges on which neuroanatomical proxy it selects. Absolute mass is the crudest measure; it favors cetaceans and elephants over humans and renders birds negligible, which contradicts behavioral evidence of complex cognition in corvids and parrots. Encephalization quotients (mass relative to body size) correct for somatic maintenance but introduce arbitrary baselines and imply that a shrew might outrank a cow. Total neuron count is superior to mass, particularly given recent work suggesting avian pallial neuron density exceeds that of primates, but it requires distinguishing between cerebellar (motor) and pallial/cortical (integrative) neurons. Connectivity density and synaptic complexity are better proxies for information processing capacity but are currently unmeasurable in vivo for most taxa. For cephalopods, "size" must account for distributed processing; a significant fraction of their neurons reside in arm ganglia, raising the question of whether a centralized brain is necessary for unified experience. Finally, for organoids, the relevant quantity is not current size but potentiality and structural organization; a dish of neurons lacks the thalamocortical loops required for consciousness, regardless of cell count. A theory must specify which of these quantities is morally salient, or admit that size is merely evidence for a functional capacity.

  **Desiderata for a Theory of Moral Relevance**

  1.  **The Human Equality Constraint:** The theory must accord equal basic moral standing to all human beings regardless of neural variation.
      *   *Motivation:* Your sister's case. A theory that ties standing constitutively to neuron count or cortical mass would necessarily degrade the status of humans with microcephaly or neurodegenerative conditions.
      *   *Status:* **Binding.** Any theory failing this is incompatible with fundamental human rights frameworks and must be rejected for regulatory purposes.

  2.  **The Cross-Taxa Scaling Constraint:** The theory must provide a non-absurd ranking of moral weight across distinct phylogenetic classes.
      *   *Motivation:* Absolute mass ranks whales above humans; relative size indices can rank rodents above ungulates. The theory must explain why a human is not morally inferior to a sperm whale, nor a mouse superior to a pig, without resorting to species membership alone.
      *   *Status:* **Binding.** A theory yielding absurd comparative verdicts loses predictive and normative power.

  3.  **The Structural Diversity Constraint:** The theory must accommodate non-centralized nervous systems.
      *   *Motivation:* Cephalopods. If moral status relies on a specific brain structure (e.g., a cortex), octopuses are excluded despite behavioral evidence of pain and learning. If it relies on total neural mass, we must decide if arm ganglia count equally with central brain mass.
      *   *Status:* **Binding.** Excluding taxa with demonstrable nociception due to anatomical difference is biologically arbitrary.

  4.  **The Tissue-vs-Function Constraint:** The theory must distinguish between human biological material and human moral status.
      *   *Motivation:* Cerebral organoids. They contain human neurons but lack sensory input, body, or integrated activity. If "human tissue" confers status, research halts; if "function" confers status, they may be excluded.
      *   *Status:* **Binding.** Confusing genetic origin with moral standing collapses the distinction between a person and a biopsy sample.

  5.  **The Aggregation Constraint:** The theory must specify how individual status sums across populations.
      *   *Motivation:* Insect feed trials. If insects have nonzero status, killing millions for one trial may outweigh the benefit, whereas killing one vertebrate might not. The theory must clarify if status is additive.
      *   *Status:* **Preference (Utilitarian/Aggregative).** Some deontological views reject aggregation, but for committee oversight involving resource allocation, a stance on aggregation is practically necessary.

  6.  **The Capacity/Exercise Distinction:** The theory must grant status based on the *capacity* for experience, not its continuous *exercise*.
      *   *Motivation:* Sleep, anesthesia, or coma. An organism does not lose standing when unconscious. Organoids, conversely, lack the capacity entirely, not just the exercise.
      *   *Status:* **Binding.** A theory that requires active consciousness renders sleep morally irrelevant, which is untenable.

  7.  **The Evidence-vs-Constitutive Distinction:** The theory must clarify if neural size *is* the ground of status or *evidence* of the ground (e.g., sentience).
      *   *Motivation:* If size is constitutive, organoids with enough mass gain status. If size is evidence of sentience, organoids without functional loops do not.
      *   *Status:* **Binding.** Collapsing this distinction leads to the "tissue fallacy" in organoid regulation.

  **The Single Eliminator**

  The requirement that eliminates the most contenders is the **Human Equality Constraint**. This is not merely an emotional accommodation for your sister; it is a logical wedge that breaks any theory positing a direct, constitutive link between neural quantity and basic moral standing. If moral status is a function of $X$ (neurons, mass, integration), and Human A has less $X$ than Human B, then Human A has less status than Human B, unless the theory introduces a discontinuous threshold. However, if the threshold is set low enough to include your sister, it inevitably includes many non-human animals (pigs, dogs, perhaps cephalopods). If the threshold is set high enough to exclude animals, it excludes your sister. Therefore, any theory that makes neural quantity the *constitutive* ground of *basic* standing fails. It forces the committee to adopt a hybrid view: basic standing is binary and perhaps species-relative or sentience-thresholded, while neural quantity may only determine *graded* protections (e.g., severity of harm permitted) or serve as probabilistic evidence for the capacity underlying standing. This eliminates pure "neural-amount" utilitarianism and strict biological cognitivism as sole arbiters of rights.

  **The Impossibility Result**

  You must accept that two of your requirements cannot be jointly satisfied: the demand for a **non-arbitrary cutoff** and the demand for **binary regulation**. Nature presents a continuum of neural complexity and sentience capacity; there is no sharp edge where nociception begins. However, your committee operates within a legal and regulatory framework that requires binary decisions (protected/not protected, approved/rejected). A theory that respects the continuity of nature cannot provide a non-arbitrary line for regulation. Any threshold you draw (e.g., "possessing a pallium" or "more than $N$ neurons") will be vulnerable to the sorites paradox: an organism with $N-1$ neurons is morally indistinguishable from one with $N$, yet one is protected and the other is not. You cannot have a theory that is both biologically continuous and legally binary without admitting a zone of arbitrary stipulation. I flag this so you do not waste time seeking a natural kind that does not exist; the cutoff will be a policy decision, not a discovery.

  **Evaluation of Contenders**

  **Sentience-Based View (Neural measures as evidence):** This theory posits that sentience is the ground of status, and neural anatomy is merely the best available proxy for sentience. It passes the Human Equality Constraint by decoupling basic rights from neural metrics (all sentient humans count equally) and handles the Organoid case well (no function, no sentience, no status). It struggles with the Cross-Taxa Scaling Constraint because sentience is hard to measure comparably across phyla, leading to uncertainty on insects. It handles the Structural Diversity Constraint by focusing on function over form, allowing for cephalopod protection. **Score:** High on ethical coherence, Moderate on regulatory feasibility due to epistemic uncertainty.

  **Tiered Capacity/Personhood View:** This theory assigns binary status based on high-level capacities (self-awareness, autonomy) and lower tiers for mere sentience. It fails the Human Equality Constraint unless it grants all humans "personhood" by fiat, which looks ad hoc. It handles the Organoid case easily (no personhood, no status) but creates a "cliff" problem for the Cross-Taxa Scaling Constraint, where slight differences in capacity create massive differences in protection. It collapses the Capacity/Exercise Distinction if it requires demonstrated behavior rather than potential. **Score:** Low on biological nuance, High on legal clarity, Fails Binding Constraint without speciesist amendment.

  **Graded Neural Status View:** This theory assigns moral weight directly to neural quantities (e.g., more neurons = more weight). It fails the Human Equality Constraint immediately; your sister would have less standing than a typical adult, and potentially less than a cow. It excels at the Aggregation Constraint, making the insect feed trial calculation straightforward. It handles Structural Diversity only if the metric is adjusted for distributed systems, which is technically difficult. It treats neural size as constitutive, violating the Evidence-vs-Constitutive Distinction required to avoid the tissue fallacy in organoids. **Score:** Fails Binding Constraint, High on calculability, Theoretically untenable for human inclusion.

  **Precautionary Expected-Value Approach:** This theory avoids ontological commitment, assigning protection based on the probability of sentience multiplied by the cost of error. It satisfies the Human Equality Constraint by treating human uncertainty as infinite cost. It handles the Organoid case by weighing the risk of future consciousness against research value. It sidesteps the Impossibility Result by admitting the cutoff is pragmatic, not natural. However, it risks regulatory paralysis (over-protecting insects due to non-zero probability) or inconsistency (shifting standards with new data). It does not solve the moral question but manages the risk of being wrong. **Score:** Highest on practical utility for a committee, Low on philosophical truth, Moderate on all binding constraints via risk-aversion.
