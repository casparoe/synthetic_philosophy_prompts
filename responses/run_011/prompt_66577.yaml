prompt: |-
  I'm the coordinator of the human subjects office at a smallish university — it's me and one part-time staffer, neither of us lawyers — and we clear maybe thirty to forty low-risk behavioral protocols a month on the expedited track, mostly from grad students. We get about twenty-five minutes per protocol before it either goes out with fixes, gets flagged for the faculty committee, or gets held. The problem is that our checklist is a completeness checklist: are all the elements there, is the reading level roughly eighth grade, is there a signature line, is the contact info current. It tells us whether the form is finished. It tells us nothing about whether the consent is actually valid, and twice in the last year we've approved something that a committee member later tore apart in a way I couldn't answer, because I had no framework beyond the form.

  So I want a triage procedure my team can actually run, and I want it built on the conceptual distinctions rather than on form hygiene — but with a decision about which distinctions survive the compression into twenty-five minutes and which get dropped, and why. Four things specifically. First, payment: I keep hearing that big payments to broke participants are coercive or unduly influential, and I keep hearing the opposite, that they're just good offers. I understand there's a baseline problem hiding in here — whether something counts as coercive depends on what you compare it against, and on whether the proposer had any obligation to improve the person's situation to begin with. I want the procedure to pick a baseline and defend picking it, or to tell me outright that the concept can't be operationalized and give me a substitute question. Second, deception and non-disclosure: which distortions or omissions actually void the consent versus which leave it intact, including the difference between lying about what will happen and simply not mentioning it, and including cases where the participant agrees up front to not being told everything, or where the form covers future unspecified reuse of their data by the lab and its collaborators. Third, capacity: I want it treated as relative to the particular decision and the particular moment, not as a global verdict on a person, and broken into the abilities that matter so a non-clinician can spot a failure without pretending to diagnose. Fourth, and this one is upstream of the other three: is consent a state of mind or a thing that gets said? Because if it's the first, my team is in the business of trying to infer what's in someone's head from a signature, which we can't do; if it's the second, we're in the business of fixing the signal. Take a position. Don't give me both-sides hedging on that one, it changes what the whole procedure is for.

  Then write it as ordered questions with a stated sufficient answer to each, three exits — approve with named fixes, escalate to the committee because what's left is a values call rather than a fact, or stop — and a note on where the procedure will systematically misfire and which steps are judgment dressed up as procedure. No references, I don't need a bibliography, I need something a person with no philosophy training can run. Then work it on three live protocols: a study paying $400 for a three-hour session, recruited through a homeless shelter, with an extra $100 completion bonus that's forfeited if you leave early; a study where participants are told it's about memory but it's actually about how far they'll follow a confederate's instructions, with a full debrief at the end and the PI arguing that telling them the real topic in advance ruins the science; and a study enrolling people in their first days of opioid withdrawal inside a detox unit, where the unit's own director does the recruiting, and where the consent form asks them to agree to future unspecified reuse of the data. One of those is going to come out in a way our committee will hate and I already suspect which, so don't soften it. Finally: be committed where the material is contested and flag where you're genuinely unsure rather than papering over it, and if you think I'm asking for something that can't be done well — if twenty-five minutes of procedure on this is mostly theater, or if my framing of one of the four questions is confused in a way that would corrupt the output — say that plainly up front instead of politely building what I asked for.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Coordinator of a Human Subjects Office (HSO) at a small university.
      *   **Team:** Coordinator + 1 part-time staffer (no lawyers).
      *   **Workload:** 30-40 low-risk behavioral protocols/month (expedited).
      *   **Constraint:** ~25 minutes per protocol.
      *   **Problem:** Current checklist is about *form hygiene* (completeness), not *validity* (conceptual soundness). They've been burned by committee members tearing apart approved protocols based on ethical concepts the HSO couldn't articulate.
      *   **Goal:** A triage procedure based on conceptual distinctions, compressed for 25 minutes, with clear decision paths (Approve, Escalate, Stop).
      *   **Specific Requirements:**
          1.  **Payment:** Pick/defend a baseline for coercion/undue influence or substitute the question.
          2.  **Deception:** Distinguish voiding distortions vs. intact consent (lying vs. omitting, broad consent for future use).
          3.  **Capacity:** Task-specific, moment-specific, observable by non-clinicians.
          4.  **Nature of Consent:** Take a hard position (State of Mind vs. Speech Act). No hedging.
          5.  **Format:** Ordered questions, sufficient answers, three exits, note on systematic misfires/judgment disguised as procedure.
          6.  **Application:** Test on three specific live protocols (Homeless/$400, Deception/Confederate, Opioid Withdrawal/Unit Director).
          7.  **Tone:** Committed, plain-spoken, no bibliography, flag uncertainty, admit if the task is impossible/theatrical.

  2.  **Deconstruct the Four Conceptual Pillars:**

      *   **Pillar 4: Nature of Consent (The Foundation)**
          *   *Option A: State of Mind.* Requires mind-reading. Impossible for HSO. Leads to endless speculation about "true understanding."
          *   *Option B: Speech Act/Process.* Focuses on the *opportunity* for understanding and the *authorization* given. This is actionable. We can audit the *process* (information disclosure, comprehension checks, voluntary signature).
          *   *Decision:* Must choose **Speech Act/Process**. If we try to judge internal states, we fail the 25-minute constraint and lack clinical tools. We judge the *conditions* under which the signature was obtained.
          *   *Implication:* The HSO's job is to ensure the *signal* is clear, not that the *receiver* perfectly decoded it internally.

      *   **Pillar 1: Payment (Coercion vs. Inducement)**
          *   *Problem:* "Coercion" implies a threat. Payment is an offer. The real risk is *Undue Influence* (clouding judgment about risk).
          *   *Baseline:* The "Wage Equivalent" baseline is common but hard to calculate. The "Status Quo" baseline is better for triage.
          *   *Decision:* Adopt the **Undue Influence/Impairment of Judgment** standard, operationalized as "Risk/Payment Mismatch." Don't call it coercion (it's philosophically messy). Call it "Compromised Voluntariness due to Economic Desperation."
          *   *Operationalization:* Is the payment large enough relative to the participant's likely economic status that refusing the risk becomes unreasonable?
          *   *Substitute Question:* Instead of "Is this coercive?" ask "Does the payment structure penalize withdrawal so heavily that a participant would endure unacceptable risk just to get paid?" (Focus on the *bonus/forfeiture* structure).

      *   **Pillar 2: Deception & Non-Disclosure**
          *   *Distinction:* Lying (active) vs. Omitting (passive). Both can void consent if material.
          *   *Key Test:* Materiality. Would a reasonable person consider this information important in deciding whether to participate?
          *   *Future Use:* "Broad consent" is legally allowed (Common Rule 2018) but ethically shaky if unspecified.
          *   *Decision:* Focus on **Materiality to Risk**. If the deception hides a risk (physical, psychological, legal, social), consent is void. If it hides only the hypothesis (to prevent demand characteristics), consent *can* be intact *if* debriefing is robust and withdrawal of data is allowed.
          *   *Future Use:* If "unspecified collaborators" includes commercial entities or sensitive data linkage, escalate. If it's academic replication, usually okay.

      *   **Pillar 3: Capacity**
          *   *Concept:* Decision-specific.
          *   *Operationalization:* The "Teach-Back" method. Can they explain it back?
          *   *Non-Clinician Flag:* Look for "Red Flags" in the recruitment setting (intoxication, acute distress, power differential).
          *   *Decision:* Focus on **Functional Ability at Time of Signing**.

  3.  **Drafting the Procedure (The "25-Minute Triage"):**

      *   Need to be ruthless about time.
      *   Structure: 4 Questions corresponding to the 4 pillars.
      *   Exits: Green (Approve), Yellow (Fix), Red (Escalate/Stop).

  4.  **Addressing the "Theater" Concern:**
      *   The user asked me to say plainly if this is impossible.
      *   *Truth:* 25 minutes *is* tight for deep ethical review. However, for *expedited, low-risk behavioral* work, it's standard. The risk isn't the time; it's the *focus*. If we focus on form hygiene, it's theater. If we focus on the *process conditions*, it's risk management. I need to acknowledge that this procedure shifts liability to the PI regarding the actual mental state of the participant, but that's unavoidable.

  5.  **Working the Three Protocols:**

      *   **Protocol A (Homeless/$400 + Bonus):**
          *   *Payment:* $400/3hrs is high. But the *forfeiture* clause is the killer. It penalizes withdrawal.
          *   *Population:* Homeless = economic vulnerability.
          *   *Verdict:* Escalate. The forfeiture clause creates undue influence/coercion to stay despite risk.
      *   **Protocol B (Deception/Confederate):**
          *   *Deception:* Hides the *nature* of the interaction (social pressure), not just the hypothesis.
          *   *Risk:* Psychological distress (realizing they are easily led).
          *   *Verdict:* Approve with Fixes. Needs robust debrief and explicit right to withdraw data *after* debrief.
      *   **Protocol C (Opioid Withdrawal/Unit Director):**
          *   *Capacity:* Acute withdrawal impairs cognition.
          *   *Power:* Director = treating physician? Huge coercion risk.
          *   *Future Use:* "Unspecified" during acute distress is problematic.
          *   *Verdict:* Stop/Escalate immediately. This is high risk, not expedited. Capacity is compromised, power differential is extreme.

  6.  **Refining the Tone:**
      *   Direct, professional, slightly weary but competent.
      *   No academic jargon without definition.
      *   Admit where the procedure is a proxy, not a perfect measure.

  7.  **Review against Constraints:**
      *   25 minutes? Yes, the questions need to be fast.
      *   No lawyers? Yes, avoid legalistic definitions of coercion.
      *   Take a position on Consent? Yes (Process/Signal).
      *   Three exits? Yes.
      *   Note on misfires? Yes.
      *   Three protocols tested? Yes.
      *   No hedging? Yes.

  8.  **Final Polish:**
      *   Make sure the "Payment" baseline is clear. (Focus on the *structure* of payment, not just the amount).
      *   Ensure the "Consent" position drives the whole document.
      *   Check the "Theater" warning. I need to be honest: 25 minutes *is* mostly theater for complex cases, but for *expedited* cases, it's risk triage. I will state that this procedure protects the *office*, not necessarily the *subject*, in borderline cases.

      *(Self-Correction during drafting)*: I initially thought about telling them to approve the Homeless study with fixes. But the forfeiture clause is a classic ethical violation (penalizing withdrawal). I need to be firm there. The Opioid study is definitely not expedited. I need to make sure the procedure flags that "Expedited" designation might be wrong.

      *(Refining the Consent Position)*: If I say consent is a "Speech Act," does that absolve us of checking understanding? No. It means we check the *opportunity* for understanding. I need to phrase this carefully so it doesn't sound like we don't care if they understand. We care if the *process allowed* them to understand.

      *(Refining Payment)*: Don't get bogged down in "Coercion vs. Undue Influence." Just call it "Voluntariness Risk." The baseline is: "Does the offer make it irrational to say no?"

      *(Refining Capacity)*: Since they aren't clinicians, they can't test capacity. They must look for *contextual indicators* of incapacity.

      *(Final check on the "Theater" warning)*: The prompt asks: "if you think I'm asking for something that can't be done well... say that plainly up front." I need to put this at the very beginning. 25 minutes to judge ethical validity *is* largely theater. I must admit that. The procedure is for *risk flagging*, not *ethical validation*.

      *Wait, one more thing:* The prompt asks for "Ordered questions with a stated sufficient answer." I need to make sure the procedure section is distinct and usable.

      *Let's structure the response:*
      1.  The Hard Truth (The "Theater" warning).
      2.  The Stance (Consent as Signal).
      3.  The Triage Procedure (The 4 Questions).
      4.  The Exits.
      5.  Limitations/Misfires.
      6.  Application to the 3 Protocols.

      *Okay, ready to write.*
answer: |-
  ### The Hard Truth Up Front

  You asked me to say plainly if this is theater. Here it is: **Yes, mostly.**

  Twenty-five minutes is not enough time to validate the ethical soundness of a human interaction. It is only enough time to scan for high-voltage wires. If a PI is determined to exploit a population, they can hide it behind a perfect form. If a participant is desperate enough, they will sign anything. Your office cannot prevent that in 25 minutes.

  However, "theater" implies no value. This procedure is not ethical validation; it is **liability triage**. It shifts the burden of proof. If you clear a protocol using this, and it blows up, you can demonstrate you asked the specific risk questions that a non-clinician *can* answer. If you try to judge internal states (what they *really* felt), you will fail every time.

  This procedure protects your office by forcing the PI to justify the riskiest elements before you touch the file. It does not guarantee participant safety, but it guarantees you didn't ignore the red flags.

  ### The Foundational Stance: Consent as Signal

  You asked for a position on whether consent is a state of mind or a thing that gets said.

  **Position: Consent is a Signal (Speech Act).**

  Your team cannot infer mental states. You cannot know if a participant "truly" understood or "freely" chose. You can only audit the **conditions under which the signal was sent.**

  *   **Implication:** You are not checking if the participant *did* understand. You are checking if the PI provided the *opportunity* to understand and removed obvious barriers to voluntariness.
  *   **Why:** If you treat consent as a state of mind, your job is impossible. If you treat it as a signal, your job is to ensure the channel isn't noisy (confusing forms), blocked (coercion), or hacked (deception about risk).

  ---

  ### The 25-Minute Triage Procedure

  **Instructions:** Run these four questions in order. Do not move to the next if the previous triggers an Exit. Time budget: 5 minutes per question, 5 minutes for documentation/decision.

  #### Question 1: The Payment Structure (Voluntariness)
  *Concept:* Ignore the word "coercion." It is philosophically tangled. Focus on **Undue Influence via Penalty.**
  *The Baseline:* We assume participants are economic actors. An offer is not coercive. A *penalty for withdrawal* is the risk.
  *The Test:* Look at the payment schedule. Is any portion of the payment contingent on *completion* rather than *time served*?

  *   **Sufficient Answer:**
      *   **Green:** Payment is prorated (e.g., $50/hour) or a flat show-up fee with no penalty for leaving.
      *   **Yellow (Fix):** High flat fee (e.g., $400) but no explicit forfeiture clause. *Fix:* Require prorating or explicit statement that partial payment is available if they stop early.
      *   **Red (Escalate):** Payment includes a "completion bonus" that is forfeited if the participant withdraws or is dismissed.
      *   **Why:** Forfeiture clauses make it financially irrational to stop even if the participant feels unsafe or distressed. This compromises the right to withdraw.

  #### Question 2: Deception and Omission (Materiality)
  *Concept:* Not all lies void consent. Only lies about **Material Risk**.
  *The Test:* Does the deception hide *what will happen to them* or only *why you are doing it*?
  *   **Sufficient Answer:**
      *   **Green:** Deception hides only the hypothesis or expected behavior (e.g., "We are testing memory" vs. "We are testing social conformity"). No physical/psychological risk is hidden.
      *   **Yellow (Fix):** Deception hides the nature of a task that might cause mild stress. *Fix:* Require a "Authorized Ignorance" clause (participant agrees they won't be told everything) AND a robust debrief with an option to withdraw data *after* the truth is revealed.
      *   **Red (Escalate):** Deception hides a risk (e.g., exposure to disturbing images, potential for legal liability, social embarrassment) or prevents the participant from knowing they are in a study at all (naturalistic observation in private spaces).
      *   **Future Data Use:** If "unspecified future use" includes commercial partners or linkage with public records, **Escalate**. If it is strictly academic replication, **Green**.

  #### Question 3: Capacity and Context (Functional Ability)
  *Concept:* Capacity is not a diagnosis; it is a functional status at time *t*. You are not clinicians. Do not diagnose. Look for **Contextual Incapacity**.
  *The Test:* Is the recruitment setting or the participant's physiological state likely to impair reasoning *at the moment of signing*?
  *   **Sufficient Answer:**
      *   **Green:** Healthy adults in a neutral setting (lab, online, public space).
      *   **Yellow (Fix):** Participants under mild stress or time pressure. *Fix:* Require a mandatory "cooling off" period (e.g., 24 hours between recruitment and consent) or a teach-back method (participant must explain the study back to the RA).
      *   **Red (Escalate):** Participants in acute medical distress, intoxication, withdrawal, or under the direct care/custody of the PI (e.g., students in PI's class, patients in PI's clinic).
      *   **Why:** In these contexts, the ability to process the "Signal" is physiologically or structurally compromised.

  #### Question 4: Power and Authority (The Upstream Filter)
  *Concept:* Even if the form is perfect, is the relationship too skewed for "No" to be a viable option?
  *The Test:* Does the recruiter hold authority over the participant's life outcomes (grades, treatment, housing, parole)?
  *   **Sufficient Answer:**
      *   **Green:** No authority relationship.
      *   **Yellow (Fix):** Indirect authority (e.g., PI is faculty at the university where students are recruited). *Fix:* Require a neutral third party to collect consent (not the professor).
      *   **Red (Escalate):** Direct authority (e.g., treating physician, parole officer, shelter director).
      *   **Why:** When the recruiter controls essential goods, consent is presumptively invalid regardless of the form.

  ---

  ### The Exits

  1.  **Approve with Named Fixes:** All answers are Green or Yellow. You list the specific changes required (e.g., "Remove forfeiture clause," "Add teach-back"). Protocol clears once PI confirms changes.
  2.  **Escalate to Committee:** Any answer is Red. This is no longer a fact check; it is a values call. The Committee must decide if the scientific value outweighs the ethical risk. You do not have the mandate for that.
  3.  **Stop (Return to PI):** The protocol is marked "Expedited" but triggers Red flags on Capacity or Power. Tell the PI this requires Full Board Review, not Expedited. Do not clear it yourself.

  ---

  ### Where This Procedure Will Misfire

  1.  **The "Rational Desperation" Blind Spot:** This procedure flags *structural* coercion (forfeiture, authority). It will not flag *economic* coercion where the payment is legal but the participant is starving. If a homeless person takes $400 for a risky drug trial because they need food, our "Payment Structure" check might pass it (if prorated). We cannot solve poverty. We flag the *terms*, not the *need*.
  2.  **Judgment Dressed as Procedure:** Question 2 (Deception) requires you to judge "Material Risk." What is "mild stress" to you might be trauma to another. This is unavoidable. You are using your own reasonable-person standard as a proxy. Document your reasoning.
  3.  **The Signature Fallacy:** Because we treat consent as a Signal, we assume a signed form means the signal was sent. If the PI lies to you about how they recruited, you will miss it. This procedure audits the *design*, not the *execution*.

  ---

  ### Application to Live Protocols

  Here is how your team runs these three files tomorrow morning.

  #### Protocol 1: Homeless Shelter, $400/3hrs, $100 Bonus Forfeiture
  *   **Q1 (Payment):** **RED.** The $100 completion bonus that is forfeited upon early departure is a penalty for withdrawal. For a homeless population, $100 is not just "influence"; it is survival. Making it contingent on staying creates a situation where refusing risk is economically irrational.
  *   **Q3 (Capacity/Context):** **RED.** Recruitment through a shelter implies potential housing insecurity/instability, though not necessarily incapacity. However, combined with Q1, it heightens vulnerability.
  *   **Decision:** **ESCALATE.** Do not approve. The forfeiture clause is ethically indefensible in this population. The Committee must decide if the science justifies a payment structure that effectively binds participants to the chair.
  *   **Note to PI:** "Payment structure penalizes withdrawal. In a vulnerable population, this compromises voluntariness. Remove forfeiture clause or escalate to Full Board."

  #### Protocol 2: Memory vs. Confederates (Deception)
  *   **Q2 (Deception):** **YELLOW.** They are lying about the *purpose* (memory vs. obedience), not the *risk*. Assuming the obedience task does not involve humiliation or extreme stress, the risk is not hidden.
  *   **Q4 (Power):** **GREEN.** Assuming standard student recruitment.
  *   **Decision:** **APPROVE WITH FIXES.**
      *   *Fix 1:* Consent form must state "Some information about the study purpose is withheld until the end."
      *   *Fix 2:* Debriefing script must be reviewed. It must explicitly offer the option to withdraw data *after* the deception is revealed. Many participants feel violated post-debrief; they need an exit ramp then, not just at the start.
  *   **Note to PI:** "Deception is permissible as it does not hide risk. Add authorized ignorance clause and ensure data withdrawal is offered post-debrief."

  #### Protocol 3: Opioid Withdrawal, Unit Director Recruiting, Broad Data Consent
  *   **Q3 (Capacity):** **RED.** Acute opioid withdrawal involves severe physiological distress, pain, and cognitive impairment. Capacity is fluctuating at best.
  *   **Q4 (Power):** **RED.** The Unit Director controls their treatment environment. This is a direct authority relationship. Consent is presumptively invalid.
  *   **Q2 (Data):** **RED.** "Unspecified reuse" during a state of acute distress and high vulnerability is unacceptable.
  *   **Decision:** **STOP / RETURN FOR FULL BOARD.** This is not expedited. This is high-risk. The PI is attempting to bypass safeguards for a vulnerable clinical population.
  *   **Note to PI:** "Participants are in acute medical distress and under direct care of the PI. Capacity and voluntariness cannot be assured via standard consent. This requires Full Board Review and likely an independent advocate for consent. Do not recruit."

  ### Final Word

  You suspected one of these would make the committee hate you. It's Protocol 3. It's the one where the science is probably "important" (addiction research) and the PI is senior.

  If you approve Protocol 3 using your old checklist, you are signing off on a consent process that is likely invalid. If you flag it using this procedure, you are forcing the Committee to take responsibility for the risk. That is your job. You are the gatekeeper, not the guardian. The guardian is the Committee. Your job is to make sure they see the gate.
