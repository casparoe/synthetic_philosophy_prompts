answer: |-
  Your hypothesis is compelling, and largely correct, but it underestimates the degree to which the impasse is sustained by a *fourth*, unacknowledged fault line: the conflict between **normative assessment** and **causal explanation**. You have identified the conceptual, metaphysical, and measurement disputes accurately, but the reason the two camps talk past each other is not merely that they are answering different questions within those categories, but that they disagree on what kind of *answer* counts as an explanation.

  Here is the diagnosis of the impasse, testing your tripartite hypothesis against the actual dialectic, followed by the specific contradiction, the path to progress, and the verdict on empirical adjudication.

  ### 1. Testing the Three Fault Lines

  Your separation of the debate into Conceptual, Metaphysical, and Measurement disputes is analytically sound, but the mapping of the camps onto these disputes is messier than you suggest.

  **The Conceptual Dispute (Describability):**
  You frame this as Socrates/Davidson vs. the Economists. But this is where the "redescription" charge is most potent.
  *   **Philosophy:** Davidson saves the phenomenon by positing a partition in the mind (all-things-considered vs. prima facie). Holton saves it by shifting the locus from judgment to resolution. Both preserve the intuition that the agent is *irrational* at the moment of action.
  *   **Economics:** Ainslie and the hyperbolic discounters do not deny the behavior; they deny the *irrationality*. If preferences reverse due to a change in temporal proximity, the action at $t_2$ is rational relative to the preference function at $t_2$.
  *   **The Clash:** The philosophers insist akrasia is a failure of *rational agency*; the economists insist it is a failure of *commitment technology*. The philosophers think the economists have explained the *cause* but missed the *fault*. The economists think the philosophers have labeled the *fault* but missed the *cause*.

  **The Metaphysical Dispute (Unity of Agency):**
  You correctly identify the tension between the temporally extended agent (Davidson/Holton) and the sequence of selves (Ainslie/Parfit).
  *   **The Loading of the Math:** Your point about $\beta-\delta$ vs. smooth hyperbolic is crucial. Quasi-hyperbolic discounting ($\beta < 1$) mathematically encodes a "specialness" to the present moment that aligns with a fragmented selfhood (the "current self" vs. "future selves"). Exponential discounting implies a single agent with a consistent rate of time preference.
  *   **The Problem:** Philosophers like Holton argue that even if the *psychology* is fragmented, the *normative unit* must remain the person. Economists argue that if the *psychology* is fragmented, the *model* must treat them as distinct players in a game. This is not just a metaphor; it changes the solution concept (Nash equilibrium between selves vs. optimization by one self).

  **The Measurement Dispute (Stability):**
  This is the weakest link in the philosophical appropriation of economics.
  *   **The Instability:** As you note, discount rates vary wildly by elicitation method (choice vs. matching), domain (money vs. health), and magnitude. If the "hyperbola" is an artifact of uncertainty or sub-proportional time perception (as some recent critiques suggest), then the "multiple selves" model loses its empirical anchor.
  *   **The Philosophical Import:** Philosophers often treat the hyperbolic curve as a discovered law of human nature (like gravity) rather than a model fit. If the curve is unstable, the metaphysical conclusion (fragmented selves) becomes an inference to the best explanation of a potentially non-existent phenomenon.

  ### 2. The Genuine Contradiction

  You asked for a point where they genuinely contradict rather than redescribe. There is one, and it concerns **Synchronic Rationality**.

  *   **The Philosophical Claim (Davidson/Holton):** At the moment of action $t$, the agent acts against a judgment held *at that same moment $t$*. The conflict is **synchronic**. I judge *now* that I should not eat the cake, and I eat it *now*. The irrationality consists in the violation of a synchronic norm of consistency between judgment and action.
  *   **The Economic Claim (Strotz/Ainslie):** At the moment of action $t$, the agent's preference function has *shifted*. The judgment held at $t-1$ (diet) is no longer the operative preference at $t$. The conflict is **diachronic**. The agent at $t$ is satisfying their current preferences perfectly. The "irrationality" is merely the dynamic inconsistency between $t-1$ and $t$.

  **Why this is a contradiction:**
  Both cannot be true. Either the agent at $t$ holds a judgment that contradicts their action (Philosophy), or the agent at $t$ holds a judgment that *matches* their action, contradicting only their past self (Economics).
  *   If the Philosopher is right, the Economist is misidentifying the locus of the failure (it's not time-inconsistency, it's will-failure).
  *   If the Economist is right, the Philosopher is reifying a past judgment that no longer exists (there is no "better judgment" at $t$ to be weak against).

  This is not verbal. It predicts different introspective reports and different neural signatures. The Philosopher predicts concurrent activation of conflicting evaluative systems *at the moment of choice*. The Economist predicts a handover of control from one system to another *prior to the moment of choice*.

  ### 3. The Fourth Fault Line: Normativity vs. Causality

  Your hypothesis misses the engine of the stalemate. The reason neither side converts the other is that they have different success conditions.
  *   **Philosophy** seeks to preserve **Responsibility**. If akrasia is just preference reversal (Economics), then the agent is merely a battleground of forces. Blame makes no sense. To keep blame intelligible, Philosophy needs the agent to be the author of the failure *at the time of action*.
  *   **Economics** seeks to preserve **Predictability**. If akrasia is a mysterious failure of will (Philosophy), it is a black box. To make choice predictable, Economics needs to model the failure as a deterministic function of time and reward magnitude.

  The "redescription" complaint arises because each side thinks the other has solved the wrong problem. The Economist says, "I have shown you the mechanism." The Philosopher says, "You have shown me the gears, but not why the machine is broken."

  ### 4. Paths to Progress

  To move the seminar forward, you must disaggregate the questions. Progress looks different on each fault line:

  **On the Conceptual Fault Line:**
  *   **Required:** A formal logic of intention that accommodates *partitioned* belief/desire sets without fragmenting the agent. Michael Bratman's planning theory is a start, but it needs integration with the economic notion of *dynamic inconsistency*.
  *   **Progress:** A model where an agent can rationally hold a "plan" that they know their future self will violate, without ceasing to be a single agent. (Holton attempts this, but formal rigor is lacking).

  **On the Metaphysical Fault Line:**
  *   **Required:** Game-theoretic intrapersonal models (like Piccione & Rubinstein) tested against unitary models.
  *   **Progress:** If intrapersonal game theory yields different behavioral predictions than unitary optimization *in the same environment*, the metaphysics becomes empirical. If they are observationally equivalent, the metaphysics is merely interpretive.

  **On the Measurement Fault Line:**
  *   **Required:** Elicitation methods that control for risk and uncertainty. Much "hyperbolic" discounting disappears when agents are uncertain about future payoffs or their own future survival.
  *   **Progress:** Consensus on whether the $\beta$ parameter represents *time preference* or *uncertainty about the future*. If it's the latter, the "multiple selves" metaphor collapses.

  **On the Normative Fault Line:**
  *   **Required:** Acknowledgment that causal explanation does not dissolve normative assessment.
  *   **Progress:** A concession from Economists that predicting a choice doesn't justify it, and a concession from Philosophers that normative failure requires a causal mechanism to be remediable.

  ### 5. The Empirical Adjudication

  You asked: *If discounting turned out to be robustly exponential and stable across methods, would the multiple-selves picture be refuted?*

  **No.** It would lose its *favorite* evidence, but not its foundation.
  *   **Why:** Multiple selves can arise from information asymmetry (the current self knows the temptation better than the future self planned for), state-dependent preferences (hunger changes the utility function, not just the discount rate), or neural modularity (limbic vs. prefrontal competition exists regardless of the discount curve shape).
  *   **However:** It would severely damage the *Ainsliean* specific version of the view, which relies on the *structural* dynamic inconsistency of hyperbolic curves to explain why commitments are needed. If discounting is exponential, dynamic inconsistency vanishes in the absence of new information. The agent at $t$ would never want to deviate from the plan made at $t-1$ unless something changed.
  *   **The Philosophical Consequence:** If discounting is exponential, the Davidsonian view is strengthened. If the plan is stable over time, and I violate it, I am not succumbing to a "new self"; I am failing to execute the intention of the *same* self. This restores the synchronic conflict and makes akrasia a genuine rational failure rather than a strategic bargaining breakdown.

  ### 6. Verdict

  The impasse is **substantive**, not merely verbal, but it is **category-mistaken**.

  You are correct that there are three tangled disputes, but they are held together by the unacknowledged fourth tension (Normativity vs. Causality). The reason no one converts is that the Philosophers are defending the *possibility of blame*, while the Economists are defending the *possibility of prediction*.

  **Recommendation for the Seminar:**
  Stop asking "Is weakness of will real?" That question conflates the ontological status of the self with the normative status of the action.
  Instead, force the students to choose a **model of the agent** first.
  1.  **Seminar A:** Assume the Unitary Agent (Davidson). How do we model hyperbolic choice? (Answer: As error/noise/irrationality).
  2.  **Seminar B:** Assume the Multiple Selves (Ainslie). How do we model moral responsibility? (Answer: As internal politics/bargaining).

  When they see that the *math* dictates the *metaphysics* which dictates the *morals*, the "redescription" complaint will vanish. They will see they are building different machines, not describing the same one.

  **Final Answer to your Hypothesis:**
  Your hypothesis is robust, but it treats the three disputes as parallel. They are hierarchical. The **Measurement** dispute (is the curve stable?) constrains the **Metaphysical** dispute (are there multiple selves?), which constrains the **Conceptual** dispute (is akrasia synchronic?). The stalemate persists because Philosophers argue Conceptual points using Metaphysical assumptions, while Economists argue Measurement points to settle Conceptual questions. Break the hierarchy, and the argument moves.
