answer: |-
  **Exam Question**

  Consider the following scenario. Two adult men meet once a fortnight in a back room of a house they rent and pay for between them. Nobody else is present, nobody is coerced, and nobody is told. A washerwoman overhears through a wall, mentions it to her employer, and inside a week 412 householders have signed a petition demanding prosecution on the sole stated ground that knowing it goes on makes them wretched and ashamed of the parish.

  Define the alarm loophole as the argument that secondary mischief, specifically the pain of apprehension felt by a multitude, justifies punishment even where primary mischief is absent. Using this definition, explain whether Bentham, on his own principles and his own account of mischief, could sign that petition. In your answer, determine whether his framework contains sufficient blocks to close this loophole or whether the logic of utility inevitably forces his hand.

  **Model Answer**

  Bentham would not sign the petition, though reaching this conclusion requires navigating the alarm loophole carefully. The loophole suggests that because the 412 householders feel genuine pain upon hearing of the act, this secondary mischief validates punishment. Since alarm is a real pain entered into the calculus, a strict reading might suggest prosecution maximizes utility by relieving their distress. However, Bentham possesses several doctrinal blocks to prevent this outcome, relying on the distinction between types of pain and the consequences of legal intervention.

  The first block distinguishes alarm rooted in security from pain rooted in antipathy. The householders claim wretchedness and shame, which sounds like disgust rather than fear for their own safety. Bentham argues that pain deriving purely from dislike of another conduct, without threat to person or property, belongs to the principle of antipathy rather than utility. If the pain is merely cultivated disgust, it lacks the weight of security based alarm. However, this block is fragile because Bentham admits all pain counts, and if the community feels unsafe due to moral decay, the line blurs. A strong analysis notes that conceding this pain counts but weighs it differently risks undermining the rejection of antipathy.

  The second block concerns the publicity of punishment. Prosecuting the men requires a trial, which broadcasts the private act to the wider public. Bentham observes that a trial manufactures far more publicity than the quiet act it punishes. Consequently, the punishment generates more alarm and curiosity than the original secrecy contained. By signing the petition, the magistrate amplifies the very mischief he seeks to quell. This is a robust utilitarian argument because it accepts the pain is real but shows the remedy increases the total sum of suffering.

  The third block addresses the groundlessness of the punishment. Bentham classifies cases where there is no primary mischief as groundless. Since the men coerced no one and harmed no assignables, the act lacks the foundational mischief required for penal intervention. Without primary mischief, secondary mischief cannot stand alone to justify the expense and pain of punishment. This relies on the hierarchy of mischief, where secondary effects are contingent upon primary harm.

  The fourth block considers needlessness and efficacy. Even if there were mischief, punishment must be the cheapest remedy. If the act remains private, prevention costs nothing. Prosecution incurs the cost of the legal process and the suffering of the offenders. Where the mischief could be prevented at a cheaper rate, such as by ignoring the act, punishment is unprofitable. This pragmatic check often overrides abstract claims of alarm.

  Finally, a critical evaluation shows these blocks are not equally stable. The publicity argument is the strongest because it uses the calculus against the loophole without denying the pain. The antipathy distinction is weaker because it risks imposing the legislator view of valid pain over the subject reported experience. Bentham can refuse the petition, but he must argue that the trial creates more pain than the act, rather than simply dismissing the householders feelings as invalid. Thus, while he escapes the gallows for the men, he concedes that utility must manage popular sentiment rather than simply obeying it.

  **Marking Scheme**

  1. Distinguish alarm based on security from pain based on antipathy or disgust (6 marks); students often conflate genuine alarm with mere dislike; this is a gatekeeper point.
  2. Argue that trial publicity creates more alarm than the private act (6 marks); students often forget the punishment amplifies the mischief; this is a gatekeeper point.
  3. Identify the act as groundless due to lack of primary mischief (5 marks); students often treat secondary mischief as independent; not a gatekeeper.
  4. Apply the tests of needlessness and efficacy regarding cheaper prevention (4 marks); students often ignore the cost of the legal process; not a gatekeeper.
  5. Evaluate the relative strength of these blocks and note where Bentham concedes ground (4 marks); students often present the blocks as equally successful; not a gatekeeper.
