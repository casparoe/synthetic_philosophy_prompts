answer: |-
  # Desiderata

  1.  **Causal Specificity:** The account must distinguish mechanisms that *cause* an output from those merely correlated with it.
      *   *Motivation:* A finetune might correlate a specific neuron with a label without that neuron driving the decision. Flagging this as a mechanism change creates false positives; missing it when the causal path shifts creates false negatives.
  2.  **Basis Invariance:** Identity must persist through orthogonal rotations or permutations of the activation basis.
      *   *Motivation:* Finetuning often rotates the representational subspace without changing the underlying computation. A criterion requiring neuron-level alignment will flag routine optimization as structural tampering.
  3.  **Dormancy Sensitivity:** The account must detect mechanisms that are structurally present but inactive on the training distribution.
      *   *Motivation:* Sleeper agents or backdoors remain dormant until a specific trigger. If identity is defined solely by active contribution on eval data, dangerous structural additions go unflagged.
  4.  **Redundancy Tolerance:** The criterion must recognize when a mechanism is preserved despite one of multiple redundant circuits being pruned or altered.
      *   *Motivation:* Models often develop backup pathways. If Circuit A is deleted but Circuit B (functionally identical) remains, the mechanism is preserved. Flagging this as an anomaly penalizes robustness engineering.
  5.  **Computation Smearing:** Identity must hold when a localized computation in the base model becomes distributed across more neurons in the finetune (or vice versa).
      *   *Motivation:* Finetuning often spreads sparse features into superposition or densifies them. A rigid "circuit size" requirement would interpret this diffusion as a mechanism replacement.
  6.  **Rerouting Distinction:** The account must distinguish between a change in the *pathway* of information flow versus a change in the *logic* computed along that path.
      *   *Motivation:* Optimization might find a shorter route for the same logic. This is a reweighting/rerouting, not a mechanism replacement. Collapsing this distinction floods the screening queue with benign optimization artifacts.
  7.  **Superposition Consistency:** The criterion must remain stable when features are not linearly separable in the activation space.
      *   *Motivation:* In high-dimensional regimes, single neurons encode multiple features. A metric relying on 1:1 neuron-feature mapping will fail to track mechanisms that persist but shift their polysemantic partners.
  8.  **Non-Universality Accommodation:** Identity cannot require exact feature alignment across models trained with different seeds or data orders.
      *   *Motivation:* Stochastic gradient descent does not guarantee universal circuits. A criterion demanding exact feature correspondence assumes a level of training determinism that does not exist, leading to systemic false positives.
  9.  **Computational Scalability:** The verification procedure must be automatable and tractable for every checkpoint without human intervention.
      *   *Motivation:* This is the operational constraint. If the criterion requires manual circuit visualization or open-ended hypothesis testing, it cannot function as an automated gate for shipping.

  # Negotiable vs. Not

  **Non-Negotiable:**
  *   **Computational Scalability:** Derived directly from the requirement for automated screening. If it requires a human to interpret the "verdict," the system fails its primary purpose.
  *   **Causal Specificity:** Without this, you are measuring activation statistics, not mechanisms. You cannot detect "replacement" if you cannot detect "causation."
  *   **Dormancy Sensitivity:** Essential for safety. If the system only checks active behavior on the eval set, it is blind to the specific class of anomalies (backdoors/sleeper agents) that mechanistic detection is meant to catch.

  **Negotiable:**
  *   **Human Readability:** While desirable for debugging, the automated screener does not need to *explain* why a mechanism changed, only *that* it changed. Interpretability can be sacrificed for sensitivity.
  *   **Exact Basis Invariance:** While we need robustness to rotation, demanding *perfect* invariance may be mathematically impossible alongside Dormancy Sensitivity. We may need to accept some sensitivity to basis drift to catch internal structural changes.
  *   **Behavioral Equivalence:** Whether the model output changes is a separate signal. Mechanism identity should track internal structure even if behavior is preserved (e.g., deceptive alignment).

  # The Squeeze

  The unsatisfiable subset is **Strict Basis Invariance**, **Dormancy Sensitivity**, and **Purely Behavioral Checkability**. You cannot jointly satisfy these.

  If you rely on **Behavioral Checkability** (inputs/outputs) to verify identity, you automatically fail **Dormancy Sensitivity**. A dormant mechanism, by definition, does not alter behavior on the screening distribution. To catch it, you must inspect internal weights or activations.

  However, once you inspect internals, you confront **Basis Invariance**. Internal structures (weights/activations) are not invariant to rotation. A mechanism can persist mathematically while its vector representation rotates completely. To detect dormancy, you need to match internal structures; to match internal structures, you need a canonical basis. But no canonical basis exists across finetunes without behavioral anchoring.

  I would give up **Purely Behavioral Checkability** as the criterion for identity. This is the core argument: if mechanism identity were fully reducible to behavior, mechanistic anomaly detection would be redundant with standard evals. The value proposition of MAD is precisely its sensitivity to *what behavior can't show*. Therefore, we must accept that our internal metrics will be imperfectly invariant. We must tolerate some false positives from basis rotation to ensure we do not miss dormant structural alterations. We prioritize internal causal structure over behavioral equivalence, accepting that automation requires heuristic proxies for invariance rather than guarantees.

  # Candidates

  **Behavioral Equivalence Testing:**
  Compares input-output distributions between base and finetune.
  *Verdict:* Fails Dormancy Sensitivity. Useful as a coarse filter, but cannot define mechanism identity.

  **Activation Patching / Circuit-Match Scores:**
  Swaps activations between models to measure causal influence of specific nodes.
  *Verdict:* Strong on Causal Specificity and Rerouting. Computationally expensive for full automation; struggles with Basis Invariance if node alignment is poor.

  **Representation-Similarity Metrics (e.g., CKA, Procrustes):**
  Measures geometric similarity of activation subspaces across layers.
  *Verdict:* Good for Basis Invariance and Smearing. Weak on Causal Specificity; high similarity doesn't guarantee the same computation is driving the output.

  **Sparse-Autoencoder (SAE) Feature Overlap:**
  Decomposes activations into interpretable features and tracks feature presence across checkpoints.
  *Verdict:* Promising for Non-Universality and Superposition. Depends entirely on SAE stability; if features themselves drift, identity tracking fails.
