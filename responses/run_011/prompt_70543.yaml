answer: |-
  Here are ten questions designed to navigate the specific theoretical package you described, pre-empt the audience's planned pile-on, and maintain a rigorous but fair tone.

  ### 1. The Cap on Costly Signaling
  **(a)** You argue sanctions must be costly to function as signals to contributors. But if the cost is what makes the signal credible, who fixes the level? Doesn't this hand the harshness objection back to you, since there's no principled upper bound on how much hardship counts as "enough" signal?
  **(b)** She will likely say the cost is bounded by the minimum necessary to sustain solidarity, not by maximising suffering.
  **(c)** **Follow-up:** If contributors *believe* only severe suffering signals sincerity, does your view require us to ignore their sentiment, or does it inadvertently validate populist harshness?
  *(Meta: Pressing a real weakness. This targets the indeterminacy of her expressive constraint.)*

  ### 2. Uptake vs. Intention
  **(a)** You separate administrative screening from moral desert. But contributors will read a sanction as a moral judgment regardless of your technical distinction. Since your justification relies on the message *received*, doesn't the audience's moral uptake override your intended administrative meaning?
  **(b)** She will likely reply that we can decouple the two through public reasoning and clear institutional design.
  **(c)** **Follow-up:** Given the history of welfare stigma, is that decoupling empirically plausible, or are you relying on an idealised communicator that doesn't exist?
  *(Meta: Stopping retreat into definition. Forces her to address the sociological reality of uptake.)*

  ### 3. The Tax Asymmetry
  **(a)** You ground the justification in messages sent to net contributors. But tax evasion undermines solidarity just as much as benefit fraud. Why is the expressive cost of benefit non-compliance load-bearing, while tax non-compliance doesn't warrant equivalent expressive sanctions?
  **(b)** She will likely argue that tax compliance is already enforced legally and the "solidarity" risk is specific to the welfare relationship.
  **(c)** **Follow-up:** If the risk is to solidarity, shouldn't the visibility of the sanction match the visibility of the tax contribution, rather than targeting the vulnerable?
  *(Meta: Pressing a real weakness. Highlights a potential inconsistency in how she treats different contributors.)*

  ### 4. Claimants with No Market Capacity
  **(a)** For claimants with no market-valued capacity, conditionality cannot screen willingness to contribute. What message does sanctioning *that* group send, and do you need an independent needs-based principle to cover them?
  **(b)** She will likely grant an exemption for those medically certified as unable to work.
  **(c)** **Follow-up:** If you exempt them, doesn't that reveal the signal is actually about ability, not willingness, undermining the "screening" justification for the rest?
  *(Meta: Pressing a real weakness. Tests the coherence of the screening mechanism.)*

  ### 5. Punishment vs. Sanction
  **(a)** If the state knowingly imposes a serious foreseeable harm on someone for failing to do what it requires, what functional work is the "not punishment" label doing? It looks like punishment in every sense that matters for justice.
  **(b)** She will likely insist that punishment implies blame, whereas this is merely a structural incentive.
  **(c)** **Follow-up:** If the phenomenological experience for the subject is identical to punishment, why does the internal administrative label protect you from retributive justice constraints?
  *(Meta: Stopping retreat into definition. Prevents her from hiding behind a technical definition of punishment.)*

  ### 6. Outcomes vs. Solidarity
  **(a)** You say expressive constraints bind design, not outcomes. But if the outcome is mass destitution, does the solidarity message survive? Can contributors feel solidarity with a system that visibly ruins the people it's supposed to help?
  **(b)** She will likely argue that solidarity depends on the *rules* being fair, not on every outcome being happy.
  **(c)** **Follow-up:** Is there any level of outcome failure that would falsify your claim that the expressive benefit is maintained?
  *(Meta: Pressing a real weakness. Challenges the separation of design and consequence.)*

  ### 7. Political Realism (Concession Point)
  **(a)** Your view implies that unconditional schemes are politically fragile because they fail to signal reciprocity. Are you claiming that ideal theories of welfare ignore the empirical conditions required to sustain a welfare state long-term?
  **(b)** She will likely say yes, that normative theory must account for the motivational preconditions of redistribution.
  **(c)** **Follow-up:** If so, should luck egalitarians be more concerned with the stability of their proposals than they currently are?
  *(Meta: Concession. This allows her to score a strong point against the audience's recent coursework without being aggressive. Mark this as a moment to nod and let the point land.)*

  ### 8. The "Deservingness" Gloss (Concession Point)
  **(a)** You argue "deservingness" talk is just an ex post gloss on screening under imperfect information. Is the primary philosophical gain here simply clearing away moralising language that obstructs administrative clarity?
  **(b)** She will likely agree, noting that moral desert creates unnecessary hostility and confusion in policy design.
  **(c)** **Follow-up:** Does that mean the real battle is semantic, or do you think policymakers actually change behaviour if we stop using the word "desert"?
  *(Meta: Concession. This validates her conceptual contribution. It shows you understand the nuance of her first premise.)*

  ### 9. Empirical Load-Bearing
  **(a)** You distinguish between expressive constraints and empirical outcomes. Which specific empirical claim in your argument is load-bearing? What finding would make you drop the view?
  **(b)** She will likely cite evidence linking conditionality to tax compliance rates or public support levels.
  **(c)** **Follow-up:** If studies showed conditionality reduced long-term tax compliance by increasing stigma, would that be decisive for you?
  *(Meta: Pressing a real weakness. This is your closer. It forces her to put skin in the game.)*

  ### 10. Rough Sleeping and Signal Cost (Pre-emption)
  **(a)** I want to head off a question about rough sleeping. If a sanction pushes someone into homelessness, that is a high-cost signal. Is homelessness ever a permissible cost for a signal, or does that violate the "not punishment" constraint?
  **(b)** She will likely say homelessness is a system failure, not an intended sanction, and should be prevented by safety nets.
  **(c)** **Follow-up:** If the safety net fails, and you know it fails, does imposing the sanction become a form of negligence that collapses your distinction?
  *(Meta: Pressing a real weakness. This addresses the audience's planned question on your terms, using her "costly signal" framework rather than a standard humanitarian appeal.)*
