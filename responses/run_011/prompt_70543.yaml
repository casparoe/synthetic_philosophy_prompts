      8. Screening vs. Moralizing (Concession - Strong Answer)
      9. Empirical Load-Bearing (Weakness/Closer)
      10. Rough Sleeping/Signal Cost (Weakness/Pre-emption)

      *Wait, I need to check the "Concession" instruction again:* "include one or two questions where you think she genuinely has a good answer and the honest move is to concede it... so the session doesn't read as an ambush."
