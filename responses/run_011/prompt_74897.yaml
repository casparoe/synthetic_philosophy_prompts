      *   *The Trap:* Minimizing *immediate* surprise by expecting the worst is a local minimum. It ignores the cost of *not acting* to change the outcome.
      *   *The "Good" Model:* A good model isn't just one that predicts what happens; it's one that predicts what *should* happen (preferences) and acts to make it happen.
