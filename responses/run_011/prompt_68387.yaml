answer: |-
  **Scenario**

  City Pilot X awards Alex and Blake identical bundles: $2,000 monthly cash, a laptop, and a transit pass. Alex is single; Blake provides nightly care for an aging parent. Both report 7/10 life satisfaction; Blake finds deep meaning in caregiving, Alex in coding. Local industry norms require evening mixer attendance to maintain professional standing—Sen's "linen shirt" equivalent for appearing in public without shame. Alex attends freely. Blake cannot leave home evenings. Both wear identical clothes, but Blake's absence signals unprofessionalism, limiting future earnings potential. Neither envies the other's physical bundle.

  **Checking Work**

  *   **Bundles & Envy Test:** Both hold identical assets ($2k, laptop, pass). Neither prefers the other's bundle. **Resourcist Verdict: Equal.**
  *   **Welfare Levels:** Both report 7/10 satisfaction. **Mechanism:** *Adaptive Preferences*. Blake's desires contracted to match feasible options (care); Alex's expanded to match freedom. Utility is equalized despite constraint. **Welfarist Verdict: Equal.**
  *   **Capability Sets:** Alex: {code, network, appear public}. Blake: {code, care}. **Blocked Functioning:** "Appearing in public without shame" (professional participation). **Constraint:** Time-poverty conversion factor (care duty). **Capability Verdict: Unequal.**

  **Single Feature Doing the Work**
  **Adaptive Preferences.** If you pull this (Blake desires networking), welfare drops, and the Welfarist sees inequality. If you pull the care duty, capabilities equalize. If you pull identical bundles, the Resourcist sees inequality.

  **The Attacks**
  *   **Dworkinian:** "Care obligations are handicaps. In a hypothetical insurance market, Blake would have insured against this burden. Therefore, the *real* resource allocation was unequal from the start; the pilot under-compensated Blake."
  *   **Welfarist:** "Welfare is the only metric that respects sovereignty. Blake is satisfied. To claim inequality is paternalistic; you are saying Blake *should* want something she doesn't."

  **Feasibility Check**
  Your spec is **jointly satisfiable**. It does not cheat; it isolates the exact divergence Sen identified: satisfaction (welfare) and means (resources) can align while freedom (capability) diverges. The tension relies on the "Happy Slave" paradox, which is the philosophical engine of the capability approach, not a stipulation bug.
