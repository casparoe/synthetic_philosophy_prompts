answer: |-
  # Decision Tree: Process vs. Outcome Supervision

  ### **Node 1:** Is the final answer cheaply and reliably checkable in the deployment domain?
  *   **No:** Go to **Node 2**.
  *   **Yes:** Go to **Node 3**.

  ---

  ### **Node 2:** Is a step-level reward a proxy for the answer or an independent normative standard?
  *   **Proxy:** **[EMPTY CELL]**
      *   *Status:* **Incoherent.**
      *   *Reasoning:* A "proxy" implies a ground-truth target to approximate. If the final answer is not checkable (Node 1 = No), there is no target signal for the proxy to approximate, making the training objective undefined.
  *   **Standard:** Go to **Node 6**.

  ---

  ### **Node 3:** Does a trace reaching a correct answer by an unsound route count as a failure worth penalizing?
  *   **No:** → **Leaf A: Outcome-Supervision Purism**
  *   **Yes:** Go to **Node 4**.

  ---

  ### **Node 4:** Does an impeccable trace that lands on a wrong answer reveal a reasoning defect or a luck deficit?
  *   **Luck Deficit:** → **Leaf B: Process Reward as Credit-Assignment Device**
      *   *(Note: This view holds the answer is the only truth, but uses steps to reduce variance/find the answer faster.)*
  *   **Reasoning Defect:** Go to **Node 5**.

  ---

  ### **Node 5:** Is a demand that the model explain itself to a human auditor the same demand as rewarding each step?
  *   **Same:** → **Leaf C: Process Reward as Standard (Audit-Focused)**
  *   **Different:** Go to **Node 6**.

  ---

  ### **Node 6:** Are we optimizing the transcript produced or the policy that generates it (off-distribution/test-time)?
  *   **Transcript:** → **Leaf D: Process Reward as Standard (Transcript-Focused)**
  *   **Policy:** → **Leaf E: Supervision of the Policy**

  ---

  ## Leaf Definitions & Trade-offs

  | Leaf | Position Name | What the Proponent Must Give Up |
  | :--- | :--- | :--- |
  | **A** | **Outcome-Supervision Purism** | They must give up the ability to guarantee robustness or safety on tasks where the final answer is ambiguous or uncheckable. |
  | **B** | **Process Reward as Credit-Assignment** | They must give up the claim that reasoning quality has intrinsic value, admitting steps are only instrumentally useful for finding the correct answer. |
  | **C** | **Process Reward as Standard (Audit-Focused)** | They must give up scalability, as this position bottlenecks training throughput on the availability of human auditors to validate explanations. |
  | **D** | **Process Reward as Standard (Transcript-Focused)** | They must give up the guarantee that the model will maintain reasoning standards when generating internal monologues that are not exposed or audited. |
  | **E** | **Supervision of the Policy** | They must give up direct interpretability of the training signal, accepting that the latent policy may diverge from the audited transcripts during optimization. |

  ---

  ## Indistinguishable Leaves

  **Pair: Leaf D (Transcript-Focused) and Leaf E (Supervision of the Policy)**

  *   **Status:** Separation requires an **experiment** rather than a question.
  *   **Reasoning:** While the tree separates these by intent (optimizing the visible text vs. the latent function), in practice, training on transcripts is the primary mechanism used to shape the policy. Distinguishing whether a team truly holds position D or E requires observing the model's behavior under distribution shift (e.g., with hidden chain-of-thought or increased test-time compute) to see if the reasoning degrades. Without this empirical test, the positions are operationally identical.

  **Pair: Leaf C (Audit-Focused) and Leaf D (Transcript-Focused)**

  *   **Status:** **Genuinely the same position** under specific conditions.
  *   **Reasoning:** If the "step-level reward" mentioned in Node 5 is derived entirely from human audits, then Leaf C and Leaf D collapse into the same implementation. They only diverge if the step-level reward is automated (e.g., by a Process Reward Model) while the audit remains human; if the team automates the audit, they move from C to D.
