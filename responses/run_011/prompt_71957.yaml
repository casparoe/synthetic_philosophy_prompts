      *   *Classification:* Platitude.
      *   *Condition:* True if one lost nail ever contributed to one lost kingdom.

  2.  **Frequent Amplification:** In a majority of significant historical outcomes, at least one causally negligible factor is necessary for the outcome.
      *   *Quantifier:* $\forall$ most Large Effects $y$, $\exists$ Small Cause $x$.
      *   *Classification:* Substantive but defensible.
      *   *Condition:* Requires empirical evidence that structural forces are usually insufficient without specific triggers.

  3.  **Counterfactual Sensitivity:** For any actual historical sequence, there exists a counterfactual sequence differing only negligibly at the start that results in a significantly different outcome.
      *   *Quantifier:* $\forall$ Histories $H$, $\exists$ variation $\delta$ such that Outcome($H$) $\neq$ Outcome($H+\delta$).
      *   *Classification:* Substantive but defensible (chaos theory), false if universalized to all systems.
      *   *Condition:* Requires the system to exhibit sensitive dependence on initial conditions.

  4.  **Epistemic Opacity:** For most causally negligible factors that produce significant outcomes, their presence cannot be detected by observers prior to the outcome.
      *   *Quantifier:* $\forall$ most Relevant Small Causes $x$, Agent cannot Know($x$) prior to $y$.
      *   *Classification:* Substantive but defensible.
      *   *Condition:* Depends on the limits of measurement technology and record survival.

  5.  **Representational Intractability:** No formal model can represent causally negligible factors with sufficient precision to determine significant outcomes.
      *   *Quantifier:* $\forall$ Models $M$, $M$ cannot Represent($x$).
      *   *Classification:* False.
      *   *Condition:* Would require models to be incapable of parameterizing noise or stochasticity, which is empirically false.

  6.  **Universal Dependency:** Every significant historical outcome depends necessarily on at least one causally negligible factor.
      *   *Quantifier:* $\forall$ Large Effects $y$, $\exists$ Necessary Small Cause $x$.
      *   *Classification:* False.
      *   *Condition:* Requires that no outcome is ever overdetermined or structurally determined.

  7.  **Predictive Impossibility:** It is impossible for any model to predict significant historical outcomes with reliability better than chance.
      *   *Quantifier:* $\forall$ Models $M$, $M$ cannot Predict($y$).
      *   *Classification:* False.
      *   *Condition:* Requires that no statistical regularities exist at the coarse-grained level.

  ### 2. Labels and Distinctions

  **Tagging:**
  *   **Amplification:** Theses 1, 2, 6. (Claims about magnitude within a single course).
  *   **Divergence:** Thesis 3. (Claims about pairs of possibilities).
  *   **Macro-indeterminacy:** Thesis 7. (Claims about coarse-grained fixation). Thesis 6 implies it if small causes are fine-grained.

  **Coming Apart:**
  The three labels are logically distinct.
  *   **Amplification without Divergence:** Consider an overdetermined assassination. A specific bullet (small cause) kills the target (large effect). This is amplification. However, in a nearby possibility where that bullet misses, a second bullet hits immediately. The outcome (death) remains the same across nearby possibilities. There is amplification in the actual course, but no divergence between courses.
  *   **Divergence without Macro-indeterminacy:** Consider an ideal gas in a box. Two microstates agree closely on pressure and temperature (coarse description) but differ in molecule positions. Over time, the microstates diverge wildly (Divergence). However, the pressure and temperature remain stable and predictable (Coarse description fixed). There is divergence at the fine grain, but no macro-indeterminacy.

  **Proverb's Natural Reading:**
  The proverb states that the kingdom is lost *for want of a nail*. This asserts that the coarse-grained outcome (kingdom status) depends on the fine-grained detail (nail). This is a claim of **Macro-indeterminacy**, supported by Amplification and Divergence.

  ### 3. Licensing the Inference

  Your colleague infers that because history turns on nails (small details), models cannot predict state collapse. To license this, he must move from the proverb's causal claim to a methodological prohibition.

  Only **Reading 7 (Predictive Impossibility)** directly licenses the conclusion, as it is the conclusion restated. However, the proverb does not support Reading 7; it supports Reading 1 or 2 (Amplification) and implies Macro-indeterminacy locally. To bridge the gap between "details matter" and "models fail," your colleague requires two additional premises: first, that models cannot capture fine-grained details (Reading 5); and second, that coarse-grained statistics do not stabilize despite fine-grained chaos.

  The objection you noted attacks this second requirement. It observes that a system may exhibit **Divergence without Macro-indeterminacy**. In such systems, fine-grained details diverge (nails vary), but coarse-grained outcomes remain regular (kingdoms fall due to structural debt regardless of the nail). If state collapse behaves like the gas box rather than the lost battle, a model operating at the coarse level can predict collapse probabilities without tracking nails. The proverb asserts Macro-indeterminacy in a specific instance, but it does not prove that Macro-indeterminacy holds universally or statistically. Therefore, no reading of the proverb alone licenses the inference that predictive testing is impossible; that inference requires assuming the falsity of coarse-grained regularity.

  Verdict: none
