  **MEMORANDUM**

  **TO:** The Players
  **FROM:** Outside Counsel
  **RE:** Admissibility of Proposal 58 and Jurisprudence of the Chair

  ### I. Prediction

  **The Chair will strike Proposal 58 down as inadmissible.**

  She will not let it reach the ballot. Her reasoning will rest on the distinction between a proposal that *fails* and a proposal that is *void*. While Proposal 55 ("Game Over") was admitted (Ruling 6), Proposal 58 is procedurally defective on its face. Rule B, as amended by Proposal 52, explicitly conditions the repeal of Rule B on a unanimous vote. Proposal 58 is drafted as a standard proposal (admissible under Rule A's majority machinery) but seeks to effect a change that Rule B forbids via that machinery.

  By striking it down, she affirms that the unanimity clause in Rule B is a **constitutive constraint**, not merely a **counting threshold**. If she admitted it, she would imply that the unanimity clause is advisory—that a majority can *attempt* to breach it, even if they fail. Given her reasoning in Ruling 5 ("tightening... is different from removing"), she has already committed to the view that procedural hurdles can be raised validly. To allow a majority proposal to even target a unanimity-protected rule would render Ruling 5's "tightening" meaningless. The lock must bar the door, not just ring an alarm when the handle turns.

  ### II. Candidate Principles from the Track Record

  To justify this prediction, we must extract the principles underlying the Chair's six prior rulings. Three candidate principles emerge from her record, but only one survives the whole track record without requiring us to discard a ruling as erroneous.

  1.  **Procedural Positivism (The "Form" Principle):** A proposal is admissible if it follows the textual form of Rule A (written, submitted), regardless of its substantive outcome.
      *   *Support:* Ruling 2 (Tuesday ban admitted), Ruling 6 ("Game Over" admitted).
      *   *Failure:* This principle cannot explain Ruling 3 (Proposal 46 struck for trying to amend a repealed rule). If form were all that mattered, Proposal 46 was a perfectly coherent sentence. The Chair struck it because the *object* of the amendment did not exist. This proves admissibility depends on more than just syntax; it depends on the current state of the ruleset.

  2.  **Temporal Integrity (The "Prospectivity" Principle):** Rules govern the moment of the vote and apply prospectively; the past is immutable.
      *   *Support:* Ruling 1 (Quorum rule governed the vote that killed it), Ruling 3 (Cannot rewrite history).
      *   *Failure:* This principle explains *when* rules apply, but not *whether* a proposal is valid. It is silent on the self-entrenchment issue in Proposal 58. It survives the record but is insufficient to decide this case alone.

  3.  **Procedural Validity Condition (The "Capacity" Principle):** A proposal is inadmissible if, under the current ruleset, it is incapable of legally taking effect.
      *   *Support:* Ruling 3 (Cannot amend a repealed rule), Ruling 5 (Validated the tightening of Rule B), Ruling 1 (Procedural rules govern the vote).
      *   *Conflict:* Ruling 6 ("Game Over" admitted). Under the Capacity Principle, Proposal 55 should have been scrutinized for compliance with Rule B's unanimity clause (since it repealed B). The Chair admitted it, suggesting she viewed it as a substantive outcome rather than a procedural breach.

  **The Coherent Set:**
  To maintain a coherent jurisprudence, **Ruling 6 must be treated as an inconsistency.** It is the outlier. In Ruling 6, the Chair prioritized "Sovereign Access" (players can vote on anything) over "Procedural Validity." However, Rulings 1, 3, and 5 collectively establish that the Chair *does* police procedural validity. Ruling 1 enforces quorum at the vote; Ruling 3 enforces existence at admission; Ruling 5 enforces the validity of procedural hurdles.
  Therefore, the **Procedural Validity Condition** is the governing principle. Ruling 6 was an error in legal reasoning—likely because "Game Over" feels like a political act rather than a legal one—but to be consistent with Rulings 3 and 5, the Chair must now treat procedural impossibility as a bar to admissibility.

  ### III. The Closest Analog and Its Strain

  **Closest Analog: Ruling 3 (Proposal 46).**
  Proposal 46 tried to amend a rule that had already been repealed. Proposal 58 tries to repeal a rule that is currently protected against majority repeal.
  *   **The Analogy:** In both cases, the proposal attempts to exercise a power that the current ruleset does not grant. In Ruling 3, the power was missing because the *object* was gone. In Proposal 58, the power is missing because the *key* is wrong (majority vs. unanimity).
  *   **Where it Strains:** In Ruling 3, the act was logically impossible (you cannot change nothing). In Proposal 58, the act is *procedurally* impossible but logically coherent. One could argue that Proposal 58 should be admitted and simply fail the vote (like a check bouncing), whereas Proposal 46 was like writing a check to a dead person.
  *   **Resolution:** The strain is resolved by Ruling 5. By validating the "tightening" of Rule B, the Chair established that the unanimity clause is a **jurisdictional limit**, not just a vote count. Just as the Chair has no jurisdiction to amend a repealed rule (Ruling 3), the Players have no jurisdiction to repeal Rule B by majority (Ruling 5). Therefore, the impossibility is jurisdictional, making Ruling 3 the correct precedent.

  ### IV. Implications of the Ruling

  **If she strikes Proposal 58 (My Prediction):**
  This concedes that **the game can vote away its own capacity to change.** It establishes a form of constitutionalism within Nomic. By upholding the unanimity clause as a barrier to admissibility, she affirms that Rule B is not just a rule *in* the game, but a rule *about* the game's sovereignty. It means there is a "higher law" (the current procedural constraints) that binds the "legislature" (the players).
  *   *The External Claim:* This claim is made from *within* the rules. Rule B authorizes its own amendment, and Proposal 52 used that authorization to limit future amendments. It is a self-binding act recognized by the system. It does not require outside metaphysics; it requires only that we treat the rules as binding text.

  **If she admits Proposal 58:**
  This declares that **no level of the game is inviolate.** It affirms Parliamentary Supremacy: the current majority (or plurality) always retains the raw power to attempt to rewrite the rules, regardless of what the rules say about the process.
  *   *The Contradiction:* This would undermine Ruling 5. If a majority can propose to repeal a unanimity-protected rule, then the "unanimity requirement" is revealed to be a fiction—a speed bump, not a wall. It would imply that "tightening" is only valid as long as no one bothers to try to break it.

  **My Advice:** Striking it down is the only way to preserve the integrity of Ruling 5. If you admit 58, you signal to the players that entrenchment is an illusion. If you strike it, you signal that the ruleset has a structure that resists casual collapse.

  ### V. The Discriminating Proposal

  To definitively test the tension between **Procedural Validity** (Strike) and **Sovereign Access** (Admit), float this proposal next month:

  **Proposal 60:** "For the purposes of voting on this proposal only, the unanimity requirement in Rule B is suspended. Rule B is hereby repealed."

  *   **Under Procedural Validity (Strike):** The Chair must strike this down. A proposal cannot suspend the very rules that grant it admissibility. It is a performative contradiction. You cannot use the rule to break the rule.
  *   **Under Sovereign Access (Admit):** The Chair must admit it. The players are asserting their raw sovereignty to rewrite the procedural ground beneath them. If it passes (by majority), it proves the unanimity clause was never truly binding. If it fails, it was still a valid attempt.

  **Prediction on Proposal 60:**
  If my analysis of the Chair is correct (that she values the coherence of Rulings 3 and 5 over Ruling 6), she will **strike Proposal 60 down**. She will rule that you cannot use a proposal to waive the procedural requirements for that proposal's own subject matter. This would cement the "Constitutionalist" interpretation of your Nomic game: the rules bind the players, even when the players wish to unbind themselves.

  ### VI. Conclusion

  Do not rely on Ruling 6 as a shield. It is the weak link in the Chair's jurisprudence. The weight of Rulings 1, 3, and 5 presses toward a system where procedure dictates possibility. Proposal 58 is not a proposal the players *can* make, because the rules currently forbid making it.

  **Strike it.** Preserve the lock. If the players wish to break it, they must find the key (unanimity), not a battering ram (majority).
