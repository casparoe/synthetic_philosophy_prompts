prompt: |-
  I'm a science-and-ideas columnist putting together a piece on how groups decide things, and I want to commission an argument I can push back against.

  The set-up: a standing five-member panel has to rule on whether to approve something, and it's rulebook says approval requires both that the evidence supports it and that it's worth the cost. Vote premise by premise and a majority says yes on each, so the panel approves; vote straight on the conclusion and a majority says no. Every person I've spoken to says the premise-first route is obviously the right one, because a group ought to be moved by reasons rather than by free-floating bottom-line opinions.

  I want the opposite case made properly. Two wrinkles to build the argument around: the rulebook's list of premises was drawn up decades ago by a small subcommittee nobody can now name, so the "reasons" the panel is held to were picked by someone with their own agenda; and everyone on the panel knows the procedure in advance, so a member who only cares about the verdict has an obvious incentive to vote insincerely on the premises.

  So: argue that premise-based aggregation is the worse choice for a group that actually cares about getting things right. Commit to it — no even-handed tour of both procedures, just your strongest line of attack and an account of why you think it's the strongest. British English, please.
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the Request:**
      *   **Role:** Science-and-ideas columnist looking for a contrarian argument to push back against.
      *   **Topic:** Group decision-making (specifically, the "Doctrinal Paradox" or "Discursive Dilemma").
      *   **Scenario:** A 5-member panel deciding on approval based on two premises (Evidence supports it? Worth the cost?).
      *   **The Conflict:** Premise-based voting (PBA) leads to approval; Conclusion-based voting (CBA) leads to rejection.
      *   **Consensus:** Everyone says PBA is better (reasons over bottom lines).
      *   **Task:** Argue *against* PBA (i.e., argue for CBA or at least that PBA is worse).
      *   **Key Wrinkles to Exploit:**
          1.  The premises are archaic/arbitrary (set by an anonymous subcommittee decades ago with potential agendas).
          2.  Strategic voting/insincerity (members know the rules and might game the premises to get their desired outcome).
      *   **Goal:** Commit to the argument. No "on the one hand, on the other." Strongest line of attack.
      *   **Tone/Style:** British English. Persuasive, intellectual, slightly provocative (suitable for a columnist's counter-piece).

  2.  **Deconstruct the "Doctrinal Paradox":**
      *   Standard view: PBA ensures consistency and accountability. It forces the group to agree on *why*.
      *   Counter view (my task): PBA creates a tyranny of outdated frameworks and encourages dishonesty. CBA respects the collective wisdom of the final judgment.

  3.  **Develop the Core Argument (The "Strongest Line"):**
      *   *Premise 1 (The Arch Rulebook):* If the premises are fixed by dead men with an agenda, adhering to them is not rationality; it's necromancy. It locks the group into a specific worldview that might no longer hold.
      *   *Premise 2 (Strategic Voting):* If I care about the outcome, and I know how the math works, I will lie about the premises to get the result I want. This corrupts the record.
      *   *Synthesis:* Conclusion-based voting (CBA) is actually more honest and robust because it treats the members as responsible agents capable of holistic judgment, rather than cogs in a logical machine built by strangers. It prioritises *responsibility* over *consistency*.

  4.  **Drafting - Section by Section (incorporating British English):**

      *   *Headline/Intro:* Needs to be punchy. Acknowledge the orthodoxy (PBA is king) and then slay it.
      *   *Point 1: The Tyranny of the Frozen Framework.* Focus on the "anonymous subcommittee" wrinkle. The premises aren't universal truths; they are historical artefacts. Binding the present to the logic of the past is irrational.
      *   *Point 2: The Incentive to Lie.* Focus on the "strategic voting" wrinkle. If the outcome matters more than the logic, PBA invites gaming. CBA accepts that people vote their conscience on the big question.
      *   *Point 3: Holistic Judgment.* Argue that human judgment isn't linear. We don't actually decide $A + B = C$. We intuit $C$ based on a messy mix of factors. Forcing $A$ and $B$ is a Procrustean bed.
      *   *Conclusion:* Summarise why CBA is the "grown-up" choice.

  5.  **Refining the Tone:**
      *   Use British spelling (programme, centre, honour, etc. - though mostly relevant in specific words).
      *   Use British idioms/phrasing (e.g., "dead hand," "cock-up," "take the temperature").
      *   Ensure it sounds like an op-ed or a commissioned essay, not a dry academic paper. It needs rhetorical flair.

  6.  **Self-Correction/Review during drafting:**
