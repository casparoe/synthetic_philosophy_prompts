answer: |-
  Here is a plan for your fifty-minute section, designed to navigate the specific constraints of your audience and the pedagogical hazards of Risk-Weighted Expected Utility (REU).

  ### 1. The Dependency Structure

  You are correct to worry about the order of operations. If you introduce the risk function ($\rho$) before dismantling the orthodox utility explanation, $\rho$ will appear to be an *ad hoc* patch—a "second dial" added merely to save the phenomena. To present REU as a *normative* theory, you must establish that the orthodox dial ($u$) is broken for this specific job.

  **The Required Order:**
  1.  **Normative Stance & Small-World Assumption (Minutes 0–5):** Define the scope. You are discussing rational preference, not psychological description. Crucially, stipulate the **Small-World** framework immediately. You must state that we are evaluating the rationality of a decision *as presented*, not embedded in a lifetime of wealth. This pre-empts the Statistician's "Grand World" objection (Misconception g) from becoming a conversation-stopper later.
  2.  **The Failure of Concave Utility (Minutes 5–20):** This is the engine of the section. You must establish the Rabin calibration critique *before* introducing $\rho$. Show that if risk aversion is solely a property of $u$, then aversion over small stakes implies absurd aversion over large stakes. This creates the *need* for a second parameter.
  3.  **The Risk Function as Solution (Minutes 20–30):** Now introduce $\rho$. Because you have just shown $u$ cannot do the work, $\rho$ is not redundant; it is necessary. Explain that $\rho$ operates on cumulative probabilities (ranks), not outcomes.
  4.  **The Carrying Example (Minutes 30–40):** Apply the formalism to the example to show how REU resolves the tension created in step 2 without absurd commitments.
  5.  **Costs and Boundaries (Minutes 40–45):** Address the normative cost (violating Independence) and the diachronic vulnerability.
  6.  **Check for Understanding (Minutes 45–50):** The diagnostic question.

  **On Formalism:**
  Do not derive the representation theorem. It consumes too much time and shifts focus to mathematics rather than philosophy. Write the REU formula on the board once:
  $$ REU(f) = u(x_1) + \sum_{i=2}^{n} \rho(P(f \geq x_i)) \cdot [u(x_i) - u(x_{i-1})] $$
  (assuming $x_1 < x_2 < \dots < x_n$).
  Use this only to point out *where* the risk attitude enters (the weighting of the probability increments). If you spend more than 5 minutes on the math, you have lost the normative thread.

  **On "Rank-Dependent":**
  Define this *after* the normative claim. The normative claim is: "Risk attitude is a separate normative component from value." The definition is: "Here is how we model that separation mathematically." If you define it first, the economists will categorize it as "RDU" and stop listening to the normative justification.

  ### 2. The Carrying Example

  **Verdict:** Use **Candidate A**. Discard Candidate B.

  **Why Candidate A:**
  Candidate B is a Common Consequence structure. Even if the numbers differ from the Allais pair, the *structural signature* is identical. Your students have just solved Allais in lecture. If you put a Common Consequence case on the board, they will not think; they will recognize the pattern and file it under "Independence Violations." You will lose the normative nuance to structural recognition.

  Candidate A (the Rabin-style calibration case) is structurally distinct from Allais. It targets the *utility function* directly rather than the Independence axiom. It forces the students to confront the implication of their belief that "risk aversion = concave utility."

  **Does the many-shot leg work?**
  Yes, but you must frame it carefully. The point is not just that risk aversion persists over aggregates (which CARA could handle). The point is that for an EU maximizer to reject the single gamble (due to concavity), they must reject the 100-gamble aggregate with a probability of loss that is vanishingly small.
  *   *The Trap:* A CARA agent rejects the single gamble and rejects the aggregate.
  *   *The Rabin Point:* To reject the single gamble under EU, the utility function must curve so sharply that the agent would reject a 50/50 lose \$1,000 / gain \$1,000,000 bet.
  *   *Your Move:* Ensure your numbers in Candidate A illustrate this *calibration* tension. If the single gamble rejection implies an absurd rejection in a slightly larger stake scenario, EU is normatively implausible. REU allows the agent to reject the single gamble (via $\rho$) while accepting the aggregate (via the Law of Large Numbers acting on the ranks) without requiring absurd utility curvature.

  **What a Carrying Example Must Have:**
  1.  **Separability:** It must be plausible to hold value ($u$) constant while varying risk attitude. (Wealth examples are good for this).
  2.  **Impossibility for EU:** It must demonstrate a preference pattern that *no* concave $u$ can satisfy (Rabin's theorem provides this).
  3.  **No Outcome Enrichment:** It must not be solvable by saying "You forgot to include 'regret' or 'status' in the outcome." (Candidate A handles this well if you stipulate outcomes are final wealth positions).
  4.  **Normative Plausibility:** The REU solution must look *more* rational than the EU solution, not just more flexible.

  **What Candidate A Will Mislead Them About:**
  It focuses heavily on wealth. Students may infer REU is only for financial decision theory.
  *   *Flag:* Explicitly state at Minute 20: "We use dollars for precision, but the outcomes could be 'lives saved' or 'years in prison.' The risk function applies to the ranking of any goods."

  ### 3. The Misconception Map

  Here is when to head off each misconception. If you wait until they raise it, you are on the defensive. Plant and defuse these proactively.

  *   **(b) Concave utility already delivers everything:** **Minute 5.** This is your primary adversary. Do not wait for them to ask. Open the "Failure of Concave Utility" section by saying, "The orthodox view is that risk aversion is diminishing marginal utility. I am going to show you why that view forces rational agents into absurd commitments."
  *   **(e) Theory is descriptive:** **Minute 0.** In your intro. "We are not asking if people *do* this (behavioral); we are asking if they *may* do this (normative)."
  *   **(c) Econ students: "This is just RDU":** **Minute 20.** When introducing $\rho$. Acknowledge it: "Economists will recognize this mathematical structure from Rank-Dependent Utility. The difference is that in micro, $\rho$ is a correction for error. Here, $\rho$ is a component of rationality."
  *   **(a) Risk function is a second probability function (evidence):** **Minute 25.** When explaining the formula. " $\rho$ does not represent belief. Belief is $P$. $\rho$ represents how much *weight* the agent places on that belief securing a better outcome. It is a preference parameter, not an epistemic one."
  *   **(d) Convex $\rho$ and concave $u$ are the same gesture:** **Minute 30.** During the example. Show on the board: Concave $u$ shrinks the value of the gain. Convex $\rho$ shrinks the *probability weight* of the gain. They look similar in output but differ in mechanism (outcome space vs. probability space).
  *   **(g) Statistician's Objection (Exploitability/Grand World):** **Minute 40.** Do not leave this for the very end. If you wait until Minute 48, the section ends on a note of "This theory is incoherent." Address it as a *cost*. "The cost of this normative flexibility is that REU agents can be vulnerable to dynamic inconsistency if they do not treat the decision as a Small World. We accept this cost to preserve the separation of risk and value."
  *   **(f) Theory makes rationality toothless:** **Minute 42.** Immediately after (g). "However, $\rho$ is not unconstrained. Buchak argues for bounds on risk-weighting to prevent irrational extremity."
  *   **(Missing) "Independence is required for rationality":** **Minute 40.** Bundle this with (g). Students trained on Savage will think violating Independence is irrational *by definition*. You must argue: "If Independence forces us to accept the Rabin calibration results, Independence is the axiom that should go."

  ### 4. A Check for Understanding

  **The Question (Minute 47):**
  "Consider two agents, Alice and Bob. Both face a 50/50 gamble: win \$100 or win \$0. Both have a linear utility function for money ($u(x) = x$). Alice takes the gamble; Bob rejects it in favor of \$40 for sure.
  Under Expected Utility, what must be true about Bob? Under REU, what can be true about Bob?"

  **Good Answer:**
  "Under EU, Bob *cannot* have a linear utility function. He must have a concave utility function (diminishing marginal value). Under REU, Bob can have a linear utility function but a convex risk function (he downweights the probability of the better outcome)."
  *Why this works:* It forces them to separate the parameter for value ($u$) from the parameter for risk ($\rho$).

  **Diagnosable Wrong Answer:**
  "Under EU, Bob is more risk averse than Alice."
  *Diagnosis:* This is tautological. It reveals they haven't grasped that EU *locates* risk aversion exclusively in $u$. They are using "risk averse" as a label rather than a structural claim.

  **Another Wrong Answer:**
  "Under REU, Bob has different beliefs about the probability."
  *Diagnosis:* They have fallen for Misconception (a), confusing $\rho$ with belief weighting.

  ### 5. What to Leave Out, and What to Say

  **Explicitly Exclude (Name them):**
  1.  **The Representation Theorem:** "There is a formal representation theorem backing this, similar to Savage's, but we don't have time for the axioms today. Trust that the math holds; let's focus on the philosophy." (Prevents math-heavy students from demanding proofs).
  2.  **The Veil of Ignorance:** "Some apply this to social choice, but we are sticking to individual rationality." (Avoids the Harsanyi/Rawls debate which will eat 20 minutes).
  3.  **Dynamic Choice/Resoluteness:** "There is a deep debate about whether REU agents need to be 'resolute' to avoid exploitation. We are treating this as a static choice theory for today." (Acknowledges the Statistician's concern without opening the diachronic can of worms).

  **Do Not Mention At All:**
  1.  **Prospect Theory:** If you mention Kahneman and Tversky, the students will conflate normative REU with descriptive Prospect Theory immediately. The Econ students know RDU; let them make the link. You keep the lane normative.
  2.  **Specific Axioms (e.g., Betweenness):** Too technical for a discussion section. Keep it to "Independence."

  ### 6. Time Allocation (50 Minutes)

  *   **00–05: Introduction & Scope.** Normative stance. Small-World stipulation. (Defuses Misconception e & g).
  *   **05–20: The Orthodoxy Trap.** Candidate A (Single Shot). The Rabin Calibration argument. Show why concave $u$ fails. (Defuses Misconception b).
  *   **20–30: The REU Proposal.** Introduce $\rho$. Distinguish from $u$. Distinguish from Belief. (Defuses Misconception a, c, d).
  *   **30–40: The Example Resolved.** Candidate A (100-Shot). Show how REU handles the aggregation without absurd $u$. (Validates the theory).
  *   **40–45: The Normative Cost.** Violation of Independence. Dynamic vulnerability. Bounds on $\rho$. (Defuses Misconception f, g, and "Independence = Rationality").
  *   **45–50: Check for Understanding & Wrap.** The Alice/Bob question. Final takeaway.

  **Final Advice for the Whiteboard:**
  Draw two axes. Label one "Value ($u$)" and one "Risk Weight ($\rho$)." When students try to explain a preference, point to an axis and ask, "Which dial is turning?" If they point to Value, ask, "Does the money matter less to them, or are they just cautious?" This physical gesture will help cement the separation of parameters.
