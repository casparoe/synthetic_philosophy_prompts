      *   *Difference:* Case 7 was a one-time enrollment. 4471 is 40 months. Does repetition validate the inertia?
      *   *Lead's likely view:* Repetition of inertia is still inertia (Case 3 logic).

  7.  **Design a Test Case:**

      *   Need to distinguish between "Inertia is Preference" vs. "Inertia is Noise."
      *   *Test:* A user who *changes* their default setting. Or a user who renews despite a *negative* default (opt-in required).
      *   *Better Test:* A user who cancels immediately when friction is lowered (e.g., one-click cancel).
      *   *Best Test:* **The "Opt-In" Renewal.** A user who has to actively click "Renew" every month (no default). If they do this 40 times, does it count?
      *   *Why:* If she says "Yes" to Opt-In 40x but "No" to Default 40x, the rule is about *Active Agency*, not just consistency.

  8.  **Practical Encoding:**

      *   If I encode "Prefers Renewal": I am betting on Rule A (Action is King). Risk: Model learns to target inertia, not value. Churn spikes if friction drops.
