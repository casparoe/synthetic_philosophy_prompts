answer: |-
  The rain in the valley did not wash anything clean; it only turned the earth into a slick, grey paste that clung to boots and hemlines. Captain Elian stood under the tarpaulin awning of the Forward Processing Unit, the ink on his pen still wet. Before him lay Form 88-B, the Personnel and Detainee Status manifest. It was a simple grid of boxes and lines, designed to sort human beings into categories that determined their rations, their confinement, and their likelihood of seeing home again.

  To the left of the fold were the names of twelve men from the 4th Rifles. They had refused the order to advance across the river three days prior. To the right were the names of twelve men from the opposing Union, captured when their line broke.

  Sergeant Voss stood behind Elian, shaking water from his cloak. "The Court of Arbiters issued their finding six months ago, Captain. The Union is the aggressor. Their cause is invalid. These men on the right?" Voss gestured to the Union prisoners huddled in the mud beyond the wire. "They aren't soldiers. They're accomplices."

  Elian didn't look up. He dipped his pen. "They are combatants in uniform. They surrendered according to the Convention."

  "They surrendered to buy time," Voss said, his voice tight. "And the men on the left? Our own? They knew the Court's finding. They knew we hold the right. And they sat in the trench."

  Elian drew a line through the status column for the twelve Union men. He wrote *POW – Standard*. Then he moved to the twelve from the 4th Rifles. He wrote *Non-Combat Injury – Shock*.

  "You're treating them the same," Voss said, disbelief flattening his tone. "The aggressors and the cowards. You're giving them the same bread, the same blanket, the same chance to go home."

  "I'm giving them what the rules allow," Elian said. He stamped the form with the unit seal. The sound was dull in the rain. "The rules don't ask why the gun fired. They ask if it was aimed at a uniform. These men," he tapped the left side, "are broken. These men," he tapped the right, "are beaten. The form doesn't measure guilt. It measures status."

  "They know," Voss insisted, leaning in. "Everyone knows. The Court published the evidence. Every child knows the Union started this. If you treat the man who breaks the peace like the man who keeps it, you're lying."

  Elian folded the manifest and tucked it into his waterproof satchel. He looked out at the prisoners. A Union soldier, young and shivering, met his gaze. Elian gave a barely perceptible nod, acknowledging the man's existence, his right to stand there without a bullet in him. It was a transaction of recognition. I see you as a soldier, not a criminal. You see me as a captor, not a judge.

  "Process the rations, Sergeant," Elian said. "Equal allotment. We follow the Convention."

  "The Convention is a shield for murderers," Voss muttered, but he took the form.

  Elian turned away, the weight of the satchel heavy against his hip. He had saved twenty-four men from the firing squad or the summary pit. He had used the bureaucracy of war to create a space where the cause didn't matter, only the uniform. It was a fragile space, built on the idea that once a man picks up a rifle, he enters a contract with his enemy that supersedes the reason for the fight. He walked back toward the command dugout, telling himself that mercy was a procedure, not a judgment.

  ***

  Three years later, the rain was gone, replaced by the dry, filtered air of the Tribunal Hall. The building was made of white stone, polished so highly it reflected the faces of the men walking across it like still water. Elian sat at a witness table, his hands folded over a copy of Form 88-B. It was the same document, or a copy of it, the ink now permanent, the paper aged to a brittle cream.

  Across from him sat Adjudicator Morren. She wore the grey robes of the Court, the same Court that had declared the cause early in the conflict. She traced a finger down the list of names.

  "Captain Elian," Morren said. Her voice was soft, carrying easily in the silent hall. "You signed this manifest in the field. You categorized these twelve Union detainees as Prisoners of War."

  "I did," Elian said.

  "And these twelve from the 4th Rifles? You categorized them as Medical Casualties."

  "I did."

  Morren looked up. Her eyes were not unkind, but they were devoid of the ambiguity Elian remembered from the trenches. "The war is concluded. The Tribunal is now engaged in the work of Reconciliation. This requires an accurate accounting of moral debt."

  She slid a second paper across the table. It was a revised classification key. "Under the Convention you cited in the field, a soldier is an instrument. His moral standing is neutralized by his uniform. This allows for exchange. It allows for quarter."

  "It prevents slaughter," Elian said. "If we treat every captured man as a criminal, no one surrenders. The fighting becomes total."

  "Does it?" Morren tapped the list. "The Court's finding was public. It was transparent. It was verified. When these twelve Union men enlisted, after the finding was published, they did not enlist in ignorance. They enlisted in support of an unjust aggression. Their uniform does not cleanse them. It identifies them."

  Elian felt a coldness in his stomach. "They were following orders."

  "Orders to do what?" Morren asked. "To invade? To seize? A man who holds a knife for a thief is not less guilty because he was paid to hold it. By classifying them as standard POWs, you granted them a moral equality they did not possess. You treated the defender and the aggressor as peers."

  Elian looked at the list. He remembered the young Union soldier in the mud. "If we strip that away... if we say their cause makes them criminals... then the rules collapse."

  "Or," Morren said, "the rules mature. We are no longer managing a conflict. We are adjudicating a wrong." She moved her finger to the left side of the manifest. The names of the 4th Rifles. "And this brings us to your own men."

  Elian stiffened. "They were in shock. They couldn't advance."

  "They knew the Cause was Just," Morren said. The words hung in the air, heavy and absolute. "The Court had spoken. The aggression was confirmed. When they refused to fight, they were not merely displaying fear. They were withholding the force necessary to stop an injustice. They were allowing the aggression to continue."

  "They were boys," Elian said. "They were scared."

  "Cowardice is a failure of nerve," Morren corrected. "But in a war where the right is known, refusal is a failure of duty to the victim. If Position— if the logic holds that the aggressor is culpable for fighting, then the defender is culpable for not fighting. You cannot claim the cause matters for one side and not the other."

  Elian looked at the document. In the field, it had been a shield. It had protected the enemy from vengeance and his own men from shame. It had said: *Here, we are all just soldiers.* Now, under the white lights, the document was an indictment. It said: *Here, we are all moral agents.*

  "If I validate your revision," Elian said quietly, "those twelve Union men go to trial. For murder."

  "They go to justice," Morren said.

  "And the twelve from the 4th?"

  "They are not merely deserters. They are obstructors. They withheld what was owed to the peace." Morren leaned forward. "You protected them then, Captain. You used the Convention to hide them from the truth of what they were doing. Or what they weren't doing. Now you have the chance to correct the record."

  She pushed a pen toward him. It was heavier than the one he had used in the rain. "Sign the validation. Acknowledge that the classification was erroneous. Acknowledge that the cause determines the standing."

  Elian looked at the pen. If he signed, the Convention died. The idea that a uniform grants safety, that a soldier is not a judge, would be broken. Future wars would be fought to the end, because surrender would mean admitting to criminality. No quarter would be given, because mercy would be complicity with evil.

  But if he refused... if he insisted on the shield... he would be saying that the Court's finding meant nothing. That the aggression didn't matter. That the men who refused to stop the aggression were no different than men who were simply tired. He would be protecting his men, but he would be lying about the weight of their choice.

  He thought of the Union soldier in the mud. If Elian signed, that man was no longer a peer. He was a defendant. The handshake of the battlefield became a prelude to handcuffs.

  He thought of the boys from the 4th. If Elian signed, they were not sick. They were guilty. They had let the injustice burn longer because they were afraid.

  Elian picked up the pen. The weight of it was unbearable. He realized that the Convention was a kindness, but it was a kindness built on a blindness. It required them to ignore the truth the Court had published. To save the men, he had to ignore the cause. To honor the cause, he had to condemn the men.

  There was no place where both were true.

  He hovered the pen over the signature line. To sign was to admit that the war was not a game of rules, but a tribunal of blood. To refuse was to admit that the rules were more important than the truth.

  Elian lowered the pen. He did not sign. He did not push it away. He sat with the weight of it, feeling the silence of the hall press against his ears. Outside, the city was quiet. The war was over. But the question of what they had done, and what they had failed to do, remained suspended in the air, unresolved, demanding a price that neither law nor mercy could fully pay.

  He looked at Morren. She waited. She did not rush him. She knew the cost was already being paid.

  Elian set the pen down on the table. He left the form unsigned. He left the form unrejected. He stood up, leaving the document between them, a bridge that could not be crossed, a record that could not be read.

  **Author's Note**

  **Position A (Convention/Symmetry):**
  1. **Scene 1 Classification:** Elian categorizes enemy combatants as *POW – Standard* and his own refusers as *Medical*, treating both groups through procedural leniency rather than moral judgment.
  2. **The Ration Order:** Elian commands "Equal allotment" for prisoners and his own men, asserting that status (uniform) dictates treatment, not the justice of the cause.
  3. **The Shield Argument:** In Scene 2, Elian argues that stripping moral neutrality prevents surrender ("If we treat every captured man as a criminal, no one surrenders"), highlighting the practical necessity of Position A.

  **Position B (Cause/Asymmetry):**
  1. **Voss's Objection:** In Scene 1, Voss argues that knowing the Court's finding makes the enemy "accomplices" rather than soldiers, rejecting the neutrality of the uniform.
  2. **The Obstructor Logic:** In Scene 2, Morren argues that refusing to fight a known just cause is "withholding what was owed," making the refuser culpable, not just cowardly.
  3. **The Validation Request:** Morren demands Elian sign a revision acknowledging that "the cause determines the standing," asserting that moral truth supersedes procedural convention.

  **Implication:**
  The story implies that in a war where soldiers cannot claim ignorance of the cause, the Convention (Position A) becomes a protective fiction. Maintaining it requires ignoring moral truth to save lives and stability; abandoning it for moral clarity (Position B) demands harsh accountability that risks endless vengeance. There is no clean path: one must choose between a lie that preserves peace or a truth that demands blood.
