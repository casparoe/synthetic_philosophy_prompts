answer: |-
  ### The Procedure

  **Output Labels:** Keep three for the script, but rename them to fix the semantic misfires.
  1.  **Secure:** (Say as fact).
  2.  **Attributed:** (Say "Source X claims..." or "Tradition holds...").
  3.  **Uncertain:** (Cut, or explicitly state "We do not know").

  **Workflow State:** Add a fourth internal bucket: **Review.** This is for claims the procedure cannot mechanically sort. These go to the Executive Producer (EP).

  **The Checklist:**
  For each of the 15–20 claims, answer these three questions in order. Stop at the first "Stop" command.

  **Q1: Independence (The Source Count)**
  *   **Ask:** Do we have more than one account of this event/detail that did not copy from each other?
  *   **Sufficient Answer:**
      *   *Yes:* Two texts from opposing sides; or a text and an inscription; or a text and archaeology. (Note: Four authors quoting one lost source count as **one**).
      *   *No:* Only one text, or multiple texts that clearly rely on the same earlier lost source.
  *   **Decision:** If **Yes**, mark *Potential Secure*. If **No**, mark *Potential Attributed*.
  *   **Exception:** If the single source is a boast/propaganda (e.g., a king praising himself), mark *Potential Attributed* regardless of independence.

  **Q2: Material Corroboration (The Physical Check)**
  *   **Ask:** Does archaeology, climate data, or genetics contradict or support this claim?
  *   **Sufficient Answer:**
      *   *Support:* Settlement layers match the battle date; DNA matches the migration story.
      *   *Contradict:* The city was not inhabited at the time; the weapon type didn't exist yet.
      *   *Silent:* No physical data exists.
  *   **Decision:**
      *   If *Contradict*: Mark **Uncertain** (Stop).
      *   If *Support*: Upgrade *Potential Attributed* to *Potential Secure*.
      *   If *Silent*: Keep previous mark.

  **Q3: Specialist Consensus (The Modern Filter)**
  *   **Ask:** Do modern syntheses agree on this, or is there active debate?
  *   **Sufficient Answer:**
      *   *Consensus:* Standard textbooks agree.
      *   *Debate:* One respected voice vs. the majority, or a 50/50 split in recent literature.
      *   *Unknown:* You cannot find a clear summary of the debate.
  *   **Decision:**
      *   If *Consensus* supports the claim: Keep previous mark (*Secure* or *Attributed*).
      *   If *Debate* exists: Mark **Review** (Stop).
      *   If *Unknown*: Mark **Review** (Stop).

  **Termination:**
  *   **Secure:** Script as fact.
  *   **Attributed:** Script with attribution ("The chronicle records...", "Legend says...").
  *   **Uncertain:** Cut or script as unknown.
  *   **Review:** Send to EP. The EP decides if the narrative value justifies keeping a *Debated* claim (with a hedge) or if the uncertainty is too risky.

  **Distinctions to Keep:**
  *   **Independent vs. Dependent:** A hundred copies of one book is one source.
  *   **Material vs. Textual:** Archaeology overrides a late text; a contemporary text overrides ambiguous archaeology.
  *   **Consensus vs. Dissent:** A minority view is not a fact, even if eloquent.

  **Distinctions to Drop:**
  *   **"Lost Source" Theories:** Unless the existence of the lost source is universally accepted, treat the late author as the source.
  *   **Oral vs. Written:** Do not discard oral tradition solely because it was written down late. If it fits archaeology (Q2), it gains weight.
  *   **Primary Language Nuance:** Rely on the translator's footnotes for bias; do not attempt to evaluate original phrasing.

  **What This Procedure Cannot Settlement:**
  *   **The Weight of a Minority View:** It can flag that a view is minority (Case 3), but it cannot decide if that minority view is *plausible enough for drama*. That is an editorial risk, not an evidentiary one.
  *   **Emerging Consensus:** If the field is in flux (e.g., new DNA study just came out), the "Consensus" answer will be unstable.
  *   **Narrative Necessity:** The procedure treats all claims equally. It cannot tell you if a specific uncertainty destroys the episode's arc.

  **Is Three Labels the Wrong Number?**
  No. For the audience, three is the cognitive limit. However, your internal workflow requires the fourth **Review** bucket. Without it, your team will force complex scholarly disagreements into "Uncertain" and cut good stories, or force them into "Secure" and spread misinformation. The **Review** bucket protects the EP's time by filtering out the mechanical decisions (80% of claims) and isolating the actual editorial risks (20% of claims).

  ***

  ### Verdicts on Test Cases

  **(1) The Single Source with Four Echoes**
  *   **Q1 (Independence):** No. Four writers quoting one lost source is one witness, not five.
  *   **Q2 (Material):** Assume Silent (not specified).
  *   **Q3 (Consensus):** Assume Consensus that the source is late.
  *   **Verdict:** **Attributed.**
  *   **Reasoning:** This is not "Disputed" (scholars aren't fighting); it is single-sourced. You may tell the story, but you must frame it as "The tradition says..." or "According to [Author]..." rather than "This happened." Do not cut it, but do not state it as fact.

  **(2) Hostile Chronicles Agreeing on a Damaging Detail**
  *   **Q1 (Independence):** Yes. Hostile parties imply independent lines of reporting.
  *   **Q2 (Material):** Assume Silent.
  *   **Q3 (Consensus):** Assume Consensus that this agreement is significant (Criterion of Embarrassment).
  *   **Verdict:** **Secure.**
  *   **Reasoning:** This is the strongest evidence available for the pre-modern world. Independent corroboration on a detail neither party wanted to admit overrides your personal suspicion that the story is legend.
  *   **Obligation:** Yes, this obliges you to grant the story credit. To hedge this would be to ignore the gold standard of historical method. If you want to doubt it, you must find material evidence (Q2) that contradicts it.

  **(3) The Vivid Scene (One Specialist vs. The Rest)**
  *   **Q1 (Independence):** Assume No (likely based on the same texts as everyone else).
  *   **Q2 (Material):** Assume Silent.
  *   **Q3 (Consensus):** Debate (1 vs. Many).
  *   **Verdict:** **Review (Handoff to EP).**
  *   **Reasoning:** The procedure mechanically flags this as **Uncertain/Contested**, which would normally mean cutting or heavily hedging the scene. However, because this is a narrative decision (vividness vs. accuracy), it requires human judgment.
  *   **Should it cost you the scene?** Not necessarily. It should cost you the *unqualified* statement. The EP can approve keeping the scene if the script explicitly attributes the claim to the minority view ("Some historians argue...") or frames it as a possibility ("It may have been..."). If the scene requires the audience to believe it as fact to work emotionally, you must cut it. If the scene works as a "what if" or a specific interpretation, you can keep it with a hedge. The procedure forces the hedge; the EP decides if the hedge is acceptable.
