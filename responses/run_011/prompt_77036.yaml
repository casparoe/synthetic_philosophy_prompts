prompt: |-
  Our reading group on the ethics of collective action has spent three weeks on what the two economists in it call the harmlessness argument, and one of them — a very sharp macro student — has now formalised it on the board in a way the rest of us cannot pick apart, though nearly all of us reject the conclusion. He concedes that (1) is a consequentialist premise, and his claim is that consequentialists are therefore committed to (8):

  (1) An act of yours is wrong only if it makes some identifiable victim worse off than they would otherwise have been, or raises the probability that some identifiable victim will be made worse off.
  (2) In threshold-structured harms, the damage to any victim occurs only once contributions accumulate past a level the system can absorb, and each contribution either falls short of that level on its own or is one of a great many that clear it together.
  (3) If a contribution falls short on its own, then whether it occurs makes no difference to whether the threshold is crossed and hence no difference to any victim; if it is one of many that clear it together, then its removal would leave the threshold cleared by the rest, so again it makes no difference to any victim.
  (4) Nor can such a contribution raise the probability of harm, since raising the probability that a threshold is cleared requires being able to clear it, and by (3) no single contribution can.
  (5) Therefore no individual contribution to a threshold-structured harm is wrong.
  (6) If no act in a set of acts is wrong, then the set is not wrong: there is no mechanism by which a collection of acts could acquire a moral status that none of its members possesses.
  (7) Therefore the totality of contributions that jointly produces the harm is not wrong.
  (8) Therefore threshold-structured harms are produced without anyone acting wrongly — and since the reasoning depends only on the aggregation structure and not on the subject matter, it generalises to any harm delivered in small shares: a thousand marksmen firing at one victim, a million drivers whose combined emissions submerge an atoll, ten million voters whose candidate wins by a handful. In none of these does any individual do wrong.

  My own contribution was to build him a case with the threshold made visible, in the hope of breaking (4). Ten thousand diners each post a short, accurate, mildly negative review of a small restaurant. The platform displays nothing but an average star rating rounded to the nearest half star, and essentially no diner reads the individual text. Any single review changes the displayed rating only if it happens to push the mean across a rounding boundary — which, given that the other 9,999 reviews arrive in no particular order, is a small but strictly positive chance; taken together the reviews carry the displayed rating from four and a half stars to two, and the restaurant closes. He answers that the chance in my case is precisely what (4) excludes, and that if I think a one-in-ten-thousand chance of moving a boundary counts as raising the probability of the closure, then I owe him an account of why the second clause of (1) is not doing all the work, and why (1) has not quietly ceased to be a difference-making principle at all. I work on cost-benefit analysis for a regulator, which is perhaps why (1) feels natural to me and why I keep wanting to repair the argument rather than abandon it.

  That reply is the one I cannot answer, and I am not after pointers to the literature — I want the argument taken apart step by step. Which premise or inference do you reject, and is the defect an equivocation, a scope or quantifier shift, a false dichotomy, or a premise that is simply false? So that you know what I am defending: I want to keep (1), and I want to keep the conviction that the marksmen clause of (8) describes real wrongdoing, so I would like a diagnosis that lets me hold both — but tell me plainly if that pair is untenable, what the cheapest coherent package looks like, and which intuitions I surrender in buying it. Three specific things I want pressed on: whether the counterfactual test in (3) survives contact with the review case, or whether (3) is silently switching between what an act actually changes and what it makes likely; whether (6) is a principle about sets of acts or a claim about whom a harm may be attributed to, since those seem to come apart exactly where the argument needs them not to; and if I give up (4), what is left of the thought that my single review, or my single flight, is negligible rather than merely small.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A reading group on collective action ethics. One member (an economist) has formalized the "Harmlessness Argument" (often associated with the "Inefficacy Objection" or "Causal Impotence" in collective harm scenarios).
      *   **The Argument:** An 8-step formalization arguing that individual contributions to threshold-structured harms are not wrong, and therefore the collective harm involves no wrongdoing.
      *   **User's Position:** Wants to keep Premise (1) (a consequentialist difference-making principle) and keep the conviction that collective harms (like the marksmen case) involve real individual wrongdoing. Wants to reject the conclusion (8).
      *   **Specific Task:** Take the argument apart step-by-step. Identify the specific defect (equivocation, scope shift, false premise, etc.). Address three specific pressure points:
          1.  Does the counterfactual test in (3) survive the "review case" (probabilistic threshold crossing)?
          2.  Is (6) about sets of acts or attribution of harm?
          3.  If (4) is given up, what happens to the "negligible vs. merely small" distinction?
      *   **Constraint:** Do not just point to literature. Provide a philosophical diagnosis. Be plain about trade-offs if the user's desired pair (Keep 1 + Keep Wrongdoing) is untenable.

  2.  **Deconstruct the Economist's Argument:**
      *   (1) Wrongness requires making an identifiable victim worse off (or raising probability). *Difference-Making Consequentialism.*
      *   (2) Threshold structure: Harm happens only after $N$ contributions.
      *   (3) Counterfactual Claim: My act alone doesn't cross the threshold. If I remove my act, the threshold is still crossed (overdetermination) or not crossed (underdetermination). *Causal Impotence.*
      *   (4) Probability Claim: My act doesn't raise probability because it can't clear the threshold alone. *Denial of Expected Utility.*
      *   (5) Conclusion: Individual act not wrong.
      *   (6) Composition Claim: If no individual act is wrong, the set isn't wrong.
      *   (7) & (8) Generalization: No one acts wrongly in collective harm scenarios.

  3.  **Evaluate the User's Constraints:**
      *   *Keep (1):* This is the hardest constraint. (1) is a *strict* counterfactual difference-making principle. Many philosophers reject (1) precisely to solve this problem (e.g., by adopting complicity, integrity, or rule-consequentialism). The user works in regulation/CBA, so (1) feels natural.
      *   *Keep Wrongdoing:* The user believes the marksmen/emissions cases *are* wrong.
      *   *Goal:* Find the flaw in the economist's logic that allows (1) and Wrongdoing to coexist.

  4.  **Identify the Weak Links:**
      *   **Premise (3):** This is the classic "Causal Impotence" claim. It relies on a deterministic view of thresholds. It ignores *expected value*.
      *   **Premise (4):** This is the most vulnerable. It claims an act cannot raise the probability of harm unless it *guarantees* harm. This contradicts standard decision theory. If there is a 1/10,000 chance my vote breaks a tie, my vote *does* raise the probability of the outcome, even if it doesn't guarantee it. The economist's move here is to define "raising probability" as "being the sole sufficient cause," which is non-standard.
      *   **Premise (6):** The Fallacy of Composition. Just because no *single* brick is heavy enough to crush a toe, doesn't mean the *pile* of bricks isn't heavy. But morally, it's about agential responsibility.
      *   **Premise (1):** The user wants to keep this. But (1) is ambiguous. Does "raises the probability" mean *expected utility* or *actual causal impact*?

  5.  **Address the Three Specific Pressure Points:**

      *   **Point 1: The Review Case & Premise (3)/(4).**
          *   The user's review case introduces *uncertainty* about the threshold.
          *   The economist says (4) excludes this.
          *   *Diagnosis:* The economist is conflating *marginal impact* with *expected impact*. In CBA (which the user knows), we care about Expected Value ($P \times Impact$). The economist is treating $P$ as zero unless the act is decisive.
          *   *Defect:* Equivocation on "raises the probability." Standard usage: Any increase in $P$ counts. Economist's usage: Only increase to $P=1$ counts.
          *   *Result:* If we use standard probability, (4) is false. (1) is satisfied because the act *does* raise the probability (by a tiny amount).

      *   **Point 2: Premise (6) (Composition).**
          *   "If no act in a set is wrong, then the set is not wrong."
          *   *Diagnosis:* This is the Fallacy of Composition applied to moral ontology.
          *   *Nuance:* It depends on what "wrong" means. If "wrong" means "violates a duty," do I have a duty not to contribute to a harmful set even if my contribution is causally inert?
          *   *Defect:* Scope Shift. It shifts from "Is act $A$ wrong?" to "Is the *outcome* of Set $S$ wrong?" and assumes the moral status transfers linearly.
          *   *Alternative:* We can hold that the *joint* action is wrong, and individual participation is wrong *because* it is participation in a wrong joint action, even if the causal link is weak. But this might violate (1).
          *   *Better Attack:* (6) assumes moral atomism. But if (1) is kept, we need to show the individual act *does* make a difference (see Point 1). If (1) is kept, (6) becomes less relevant because the antecedent ("no act is wrong") is false.

      *   **Point 3: Negligible vs. Merely Small.**
          *   If we accept the probabilistic argument (reject 4), does the act become "negligible"?
          *   *Diagnosis:* In CBA, "negligible" usually means "below the de minimis threshold for regulatory action," not "morally zero."
          *   *Trade-off:* You must surrender the intuition that the act is *causally impotent*. You must accept it has a non-zero expected harm.
          *   *Cost:* You have to accept that tiny probabilities matter morally. This leads to "fanaticism" problems (Pascal's Mugging), but in collective harm, it's usually manageable.

  6.  **Synthesize the Strategy:**
      *   The user wants to keep (1). To do so, they *must* show that the individual act *does* make a difference (probabilistically).
      *   Therefore, the primary attack must be on **(4)** and the interpretation of **(3)**.
      *   The economist is smuggling in a deterministic requirement into a probabilistic premise.
      *   The "Review Case" actually *saves* (1) rather than breaking it, provided we interpret "raises the probability" correctly (Expected Utility).
      *   The economist's reply ("why (1) has not quietly ceased to be a difference-making principle") is a bluff. (1) *is* a difference-making principle, but difference-making includes *risk imposition*.
      *   **The Core Defect:** Equivocation on "Difference." The economist means "Determinative Difference." Consequentialism requires "Expected Difference."

  7.  **Drafting the Response:**
      *   *Tone:* Rigorous, philosophical, respectful of the CBA background.
      *   *Structure:*
          1.  Direct Answer: The pair (Keep 1 + Keep Wrongdoing) is tenable, but it requires breaking (4) and clarifying (1).
          2.  Step-by-Step Diagnosis: Focus on the move from (3) to (4).
          3.  Address the Three Pressure Points explicitly.
          4.  The "Cheapest Coherent Package": What must be surrendered? (The intuition that causal impotence = moral innocence).

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, check Premise (1) again.* "An act... is wrong *only if* it makes some identifiable victim worse off... or raises the probability..."
      *   The economist argues (4) says you *don't* raise the probability.
      *   Why? "Raising the probability that a threshold is cleared requires being able to clear it." This is the false claim.
      *   *Correction:* In the review case, a single review *can* clear the threshold (if it hits the rounding boundary). So the economist's claim in (4) that "no single contribution can [clear it]" is empirically false in the review case.
      *   *But what about the Marksmen?* If 10 marksmen fire and 1 bullet kills, and we don't know which, does *my* bullet raise the probability? Yes, from 0 to 0.1 (assuming symmetry).
      *   *The Economist's Trick:* He defines "raising probability" as "changing the outcome from 'will not happen' to 'will happen'." That is not how probability works.
      *   *Key Distinction:* Epistemic Probability vs. Metaphysical Chance. The economist treats the threshold as fixed and known. In reality, agents act under uncertainty.
      *   *CBA Angle:* In regulation, we use *Expected Annual Damage*. We don't say "This levee won't definitely fail, so building it lower causes no harm." We say "It increases the risk."
      *   *Conclusion:* The economist is applying a deterministic logic to a probabilistic reality.

  9.  **Final Polish:**
      *   Ensure I answer the specific question about (6). (6) is a Fallacy of Composition.
      *   Ensure I answer the "negligible vs small" question. (Small expected harm is still harm).
      *   Make sure to validate the user's CBA intuition.

  10. **Final check against constraints:**
      *   No literature pointers? (Avoid naming Parfit, Nefsky, etc., explicitly unless necessary for concepts, focus on the logic).
      *   Step-by-step breakdown? Yes.
      *   Address the three specific points? Yes.

  (Proceed to generate response based on this thought process.)
answer: |-
  You can keep both (1) and the conviction that the marksmen are wrongdoers, but to do so you must reject the economist's formalization of **Premise (4)** and expose an equivocation in **Premise (3)**. The argument fails not because consequentialism is wrong, but because the economist has surreptitiously replaced *expected utility* with *deterministic causation*.

  Here is the step-by-step diagnosis, followed by the specific answers to your three pressure points.

  ### The Core Defect: Equivocation on "Difference"

  The argument collapses at the transition from **(3) to (4)**.

  **Premise (3)** relies on a counterfactual test: *If I remove my act, does the outcome change?* In a deterministic threshold model (e.g., exactly 1,000 votes needed, exactly 1,000 cast), the answer is often "no." This is the classic problem of overdetermination.

  **Premise (4)** claims that because the act doesn't determinatively cross the threshold, it cannot raise the *probability* of harm. This is false. It conflates *being the decisive cause* with *contributing to the risk*.

  In your regulatory work, you know that a policy does not need to guarantee a spill to be blameworthy; it need only increase the *Expected Value* of the spill. The economist is defining "raises the probability" in a non-standard way: he treats it as "raises the probability to 1" or "is the necessary condition for probability > 0."

  **The Diagnosis:**
  *   **Premise (4) is false.** An act can raise the probability of a threshold being crossed even if it is not sufficient to cross it alone.
  *   **Mechanism:** Equivocation. The argument shifts from "making a difference to the *outcome*" (in 3) to "making a difference to the *risk*" (in 4), while implicitly demanding that the risk difference be deterministic.
  *   **Result:** If you interpret (1) using standard decision-theoretic probability (which you should, given your CBA background), the individual act *does* satisfy (1). It imposes a tiny expected cost on the victim. Therefore, (5) is false, and the conclusion (8) does not follow.

  ---

  ### Addressing Your Three Pressure Points

  #### 1. Does the counterfactual test in (3) survive the review case?
  **No.** The review case breaks (3) by revealing that the "threshold" is rarely a sharp metaphysical line known to the agents; it is an epistemic fog.

  The economist's (3) assumes a "God's eye view" where we know exactly where the threshold lies relative to the contributions. In the restaurant case, you do not know if you are the 9,999th reviewer or the 10,000th.
  *   **The Switch:** (3) silently switches between *actual causal impact* (did this specific token act cross the line?) and *ex ante likelihood* (what was the chance this act would cross the line?).
  *   **Why it matters:** Consequentialism evaluates acts based on the information available to the agent (or the objective chances, depending on your flavor). If there is a non-zero chance your review triggers the rounding boundary, your act has a non-zero expected disvalue.
  *   **Verdict:** (3) is only true under a description of the world that excludes the uncertainty agents actually face. Once uncertainty is admitted, (3) fails to support (4).

  #### 2. Is (6) about sets of acts or attribution of harm?
  **It is a Fallacy of Composition regarding moral status.**

  Premise (6) states: *"If no act in a set of acts is wrong, then the set is not wrong."*
  This looks plausible but fails in collective contexts. It assumes moral atomism: that the moral status of a whole is strictly the sum of the moral statuses of the parts.
  *   **The Defect:** Scope Shift. It shifts from "Is act $A$ wrong?" to "Is the *outcome* of Set $S$ permissible?"
  *   **Why it breaks:** Even if we granted (for the sake of argument) that a single marksman's shot is not wrong *in isolation* (perhaps because he misses), the *joint action* of the squad is wrong. If the joint action is wrong, and I voluntarily participate in it knowing its nature, my participation derives wrongness from the joint enterprise, not just my isolated causal impact.
  *   **However:** Since you want to keep (1), you don't actually need to attack (6) directly. If you successfully attack (4), then individual acts *are* wrong (because they impose expected harm). If individual acts are wrong, the antecedent of (6) ("no act in a set is wrong") is false, rendering (6) vacuously true but irrelevant. The argument dies at (5), not (6).

  #### 3. If I give up (4), what is left of "negligible" vs. "merely small"?
  **You must surrender the intuition that "causally negligible" means "morally zero."**

  This is the cost of keeping (1). In Cost-Benefit Analysis, you know that $1 \times 10^{-9}$ probability of a fatality is not zero; it is a statistical life.
  *   **The Trade-off:** You must accept that an act can be *causally inefficacious* (it likely won't change the outcome) but still *morally efficacious* (it changes the expected value).
  *   **Negligible vs. Small:** "Negligible" in regulation often means "below the threshold for enforcement," not "ethically null." If you keep (1), you must admit that the single flight *does* harm the atoll dweller, in expectation. It is a "small" harm, not a "zero" harm.
  *   **The Bullet to Bite:** You must accept that morality is sensitive to vanishingly small probabilities. This avoids the "Harmlessness" conclusion but opens you to the "Fanaticism" objection (that we are obligated to avoid any act with any non-zero risk of catastrophe). In collective harm cases, this is usually manageable because the probability is small but the *aggregate* of identical acts is large, balancing the equation.

  ---

  ### The Cheapest Coherent Package

  You asked for the cheapest coherent package that lets you keep (1) and the wrongness of the marksmen. Here it is:

  1.  **Keep (1) but clarify "Probability":** Interpret "raises the probability" as *increases the Expected Utility disvalue*.
      *   *Modification:* An act is wrong if $P(\text{Harm}) \times \text{Magnitude}(\text{Harm}) > \text{Threshold}$.
  2.  **Reject (4):** Deny that an act must be sufficient to clear the threshold to raise the probability. Any increase in risk counts.
  3.  **Reject the "Identifiable Victim" constraint in (1) slightly:** In threshold cases, the victim is identifiable (the atoll dweller), but the *link* is probabilistic. You do not need to know *which* ton of CO2 submerged the island to know that *this* ton increased the risk.
  4.  **Surrender:** The intuition that "I made no difference" is a valid moral excuse. You must accept that in a world of thresholds and uncertainty, **risk imposition is harm.**

  ### How to Reply to the Economist

  Your economist colleague claims that if you count a 1-in-10,000 chance as "raising the probability," then (1) ceases to be a difference-making principle. This is a bluff.

  **Tell him this:**
  "Difference-making does not require *determinative* difference. In regulation, if I approve a pipe that has a 0.01% chance of leaking toxic waste, I have made a difference to the safety of the downstream town, even if the pipe never actually leaks. I have altered their risk profile.
  Your Premise (4) defines 'raising probability' as 'guaranteeing the outcome.' That is not probability; that is certainty.
  If we use the standard definition of probability:
  1.  My review has a $>0$ chance of triggering the rounding boundary.
  2.  Therefore, my review raises the expected probability of closure.
  3.  Therefore, under (1), my review is prima facie wrong (unless outweighed by benefits).
  4.  Therefore, (5) is false, and the marksmen are wrongdoers because each imposed a risk of death on the victim.
  You are asking us to treat moral mathematics as deterministic arithmetic. It is not; it is statistics."

  ### Summary of Defects
  *   **Premise (4):** False. Equivocation on "probability."
  *   **Premise (3):** Misleading. Ignores epistemic uncertainty regarding threshold location.
  *   **Premise (6):** Fallacy of Composition (though less critical if 4 is rejected).
  *   **Intuition to Surrender:** The idea that causal impotence (in the deterministic sense) grants moral innocence.

  You can keep (1). You just need to insist that (1) governs *expected* consequences, not *actualized* ones. The economist is trying to sell you a deterministic model of a stochastic world.
