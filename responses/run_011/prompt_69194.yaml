          *   Low $N$ + Low Harm = EIC Discretion.
          *   Fake Consultation = Asking people who agree with you. Real Consultation = Asking the Advisor or a skeptic.

  4.  **Developing the Three Scenarios:**

      *   **Scenario 1 (Booster Club/Coach):**
          *   *Harm:* High (Accusation of misuse of funds, naming a teacher).
          *   *Reversibility:* Low (Printed).
          *   *Actor Count:* Medium (4 editors have tip folder, but source only talks to EIC).
          *   *UC Factor:* High risk of optimistic bias ("This is a huge scoop!").
          *   *Verdict:* **DO NOT RUN ALONE.** Needs verification + Advisor check. The "unwanted answer" should probably be here or #2. Let's make it here: You can't run this without more proof, regardless of the source ghosting.
