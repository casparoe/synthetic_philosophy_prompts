answer: |-
  **Beetle Health, Inc. Terms of Service and Privacy Policy**

  **1. Naming and Definition of Tags**
  Beetle Health operates on the premise that the inner life is accessible only from inside. During onboarding, the User performs the Naming: attending to a specific sensation while tapping a glyph, thereby assigning it a private tag, the default being "S." Beetle records the timestamp and the symbol but cannot state what the tag picks out. No one else — not other users, not Beetle's engineers, not Beetle's own lawyers — can ever know what anyone's "S" picks out. The tag has no formulation Beetle could audit. Attendance during the ceremony is deemed sufficient for validity. The User accepts that the definition resides solely within their own phenomenological field.

  **2. Accuracy and Data Quality**
  Beetle warrants nothing about the accuracy of tags, on the express ground that the User is the sole authority on their own case. In the foundational documentation of the Service, it is written: "in the present case I have no criterion of correctness. One would like to say: whatever is going to seem right to me is right." This establishes the commercial consequence that, absent a criterion of correctness, Beetle can offer no correction, no deletion of inaccurate records, and no accuracy guarantee. Because authenticity cannot be distinguished from error by external means, the retention period for all logs is therefore indefinite. Data is preserved as a record of authority, not truth.

  **3. Corroborate+ (Premium Tier)**
  Users anxious that they may have misremembered their original "S" may subscribe to Corroborate+. This feature provides a confirmation signal regarding the integrity of past entries. Please refer to the FAQ sidebar for operational details regarding the source of this confirmation.

  **4. Research Use and Beetle Labs**
  The wearable device captures biometric channels, including heart-rate variability and blood pressure. Beetle Labs has published findings that an "S" entry predicts a physiological event hours in advance. We celebrate the discovery that the model performs identically whether or not the sensation was tagged correctly. This demonstrates that the sensation itself may be regarded as a dial that can be turned without anything else in the mechanism moving. The biological signal remains robust regardless of the internal label applied, validating the hardware independently of the User's private definition.

  **5. The Box Guarantee (cf. §293)**
  Privacy is guaranteed through isolation. Each account is a box; no one may look into anyone else's box. The shared product name "Beetle" is offered as a label only and commits Beetle to nothing about contents. We do not assume similarity between boxes. An account remains in good standing even if its box is empty, provided the User maintains the interface. Beetle reserves the right to discontinue any feature whose operation does not depend on the box's contents, as empty boxes require less maintenance.

  **6. Aggregation and Community Insights**
  Beetle promises that Users will discover they are not alone. For instance, analytics may show that a large share of Users logged "S" on the same Tuesday. Nothing in this Section shall be construed to imply that users share criteria. Users do not share criteria. The aggregation demonstrates parallel activity, not shared meaning. Any perception of commonality is a feature of the dashboard, not the data.

  **7. Dispute Resolution**
  Any dispute over the correct application of a tag shall be resolved by mandatory individual arbitration. The standing rule is that both parties are right, each being the authority on their own case. Class arbitration is waived on the ground that class membership cannot be determined without violating the Box Guarantee. Remedies are limited to a refund of the subscription fee, the only quantity Beetle concedes it can count. No damages for emotional distress or phenomenological error are available.

  **8. Termination**
  Beetle may terminate access upon evidence that a User has been applying their tag in conformity with other users' usage. Such behavior suggests the User is outsourcing their internal authority to public standards, violating the core premise of the Naming. Termination is immediate upon detection of synchronized logging patterns.

  By continuing to use the Service, you acknowledge that you are alone in your box, that your tags are yours alone, and that Beetle counts only what can be counted.

  ***

  **FAQ Sidebar**

  **1. What does my "S" tag mean?**
  Only you can know what your "S" tag means. It refers to a sensation accessible only from inside your own experience. Beetle cannot define it for you.

  **2. How does Corroborate+ confirm my memory?**
  The confirmation presented to the user is generated by the same faculty that produced the original entry. You are asking yourself if you remember, and the system records that you asked. Beetle recommends the purchase of additional confirmations to strengthen the chain of self-reference.

  **3. Can I delete inaccurate logs?**
  No. As you are the sole authority, there is no external standard by which a log can be deemed inaccurate. All entries are retained indefinitely as valid records of your authority at the time of logging.
