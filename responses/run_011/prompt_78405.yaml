prompt: |-
  I run the arts grants program at a mid-sized city foundation: about $600k a year spread over roughly 140 applications, individual grants from $1.5k to $20k, one round per year, and six volunteer panelists who mostly come back year to year. Two of them are working artists; the rest are a high school teacher, a retired accountant, a hospice nurse, and a guy who runs a community radio station. Each panelist gets about eight minutes per application plus the work sample, they're unpaid, and the executive director who signs off on the final list has no arts training but does have to defend it to the donor who funds most of the round.

  Last year that donor complained, in so many words, that the art we fund doesn't do anything for anybody — that we were rewarding CVs, technique, and craft jargon, and that the panel couldnt tell her why a single funded piece had made a single human being feel anything. Over the holidays I read Tolstoy's late book on art (the one where he defines art as the transmission of feeling, grades how infectious a work is by the sincerity of the artist plus the individuality and clarity of the feeling, splits art into universal and particular, and then throws Beethoven's Ninth, Shakespeare, and most of his own novels on the floor). It's the only test I've ever seen that starts from "did it actually move a person" instead of "is it well made," so I want to see whether it can be turned into something six tired volunteers can run.

  So: write me a decision procedure the panel can use on an application — the questions in the order they should be asked, what counts as a sufficient answer at each step, and where a step ends the application with a no. It has to be self-contained, because nobody is going to read the book, so anywhere you're drawing on Tolstoy, translate the criterion into a question a retired accountant can answer about a work sample sitting in front of her. Tell me which parts of his theory survive being converted into a panel procedure and which ones you had to drop or quietly fudge, and why. Mark the points where the procedure stops being a matter of fact and becomes a judgment about which feelings are worth transmitting — that has to be visibly a human decision, and I need you to say who should be making it (the panel, the director, the donor, or nobody). And be straight about where it will systematically misfire: which good things it will reject, and which bad things it will fund.

  Then run it on three applications from this year's pile and give me a verdict plus what you'd actually write in the letter:

  1. A single-channel video piece, superbly made, shown at two biennials, dense with allusion and deliberately hard to parse. When I screened the sample for the two non-artist panelists, they said they felt nothing and couldn't tell me what it was about.
  2. A wall mural painted over one summer by a teen center, with a single part-time artist teaching them. The perspective is off, the lettering is uneven, and three panelists teared up in the room when it came up.
  3. A one-woman play about a local factory closure, performed by a woman who lost her job there, formally dead simple, that lands its anger hard. The anger's mostly aimed at a specific group of immigrants the audience blames for the layoffs, and the people at the showcase clearly went along with it.

  I expect #3 to be the one that shows me something I don't want to see, so don't soften it. Separately: three of my panelists will insist that "did it infect me" is just personal taste dressed up as a standard, and that a procedure built on it will end up funding whatever makes the room feel something fastest and loudest. Tell me wether they're right, and what the procedure can and can't do about that failure mode. Finally, say plainly what this thing can't deliver even if we follow it perfectly, so I don't oversell it to the donor.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Arts grants program manager at a mid-sized city foundation.
      *   **Context:** $600k/year, ~140 applications, grants $1.5k-$20k, 1 round/year, 6 volunteer panelists (mixed background, mostly returning), 8 mins/app + work sample. ED signs off (no arts training, answers to donor).
      *   **Problem:** Donor complained last year that funded art "doesn't do anything for anybody" (too technical/CV-focused, lacks emotional impact).
      *   **Proposed Solution:** User read Tolstoy's *What Is Art?* and wants to adapt its core thesis (art as transmission of feeling/infection) into a practical decision procedure for the panel.
      *   **Requirements:**
          1.  Write a decision procedure (questions, order, pass/fail criteria, who decides what).
          2.  Translate Tolstoy into plain language for volunteers (no reading the book).
          3.  Analyze what parts of Tolstoy survive/fudge/drop and why.
          4.  Identify where value judgments enter (who makes them).
          5.  Identify systematic failures (what good art gets rejected, what bad art gets funded).
          6.  Run the procedure on three specific applications (Video, Mural, Play) with verdicts and draft letter text.
          7.  Address panelist objection: "Is this just personal taste dressed up?"
          8.  State plainly what the procedure *cannot* deliver.
      *   **Tone:** Direct, pragmatic, honest, slightly critical (don't soften the blow on Application #3).

  2.  **Deconstruct Tolstoy's *What Is Art?* for this Context:**

      *   *Core Thesis:* Art is a human activity consisting in this, that one man consciously, by means of certain external signs, hands on to others feelings he has lived through, and that other people are infected by these feelings and also experience them.
      *   *Criteria for "Good" Art:*
          1.  **Individuality:** The feeling is distinct to the artist.
          2.  **Clarity:** The feeling is expressed clearly.
          3.  **Sincerity:** The artist truly feels what they are transmitting (most important).
      *   *The "Infection" Test:* Does the receiver feel the same thing the sender intended?
      *   *Religious/Universal Consciousness:* Tolstoy eventually argues art must promote Christian brotherhood/universal love. *This is the tricky part for a secular foundation.*
      *   *Rejections:* He rejected his own work, Shakespeare, Beethoven, etc., for lacking sincerity or universal accessibility.

  3.  **Drafting the Decision Procedure:**

      *   *Constraint:* 8 minutes per app + work sample. Needs to be fast.
      *   *Constraint:* Volunteers (accountant, nurse, etc.). Needs plain English.
      *   *Step 1: Sincerity/Intent.* Did the maker mean it? (Hard to judge from sample alone, but proposal helps).
      *   *Step 2: Clarity/Transmission.* Did the panelist *feel* something?
      *   *Step 3: Value of the Feeling.* Is this a feeling we want to fund? (The ethical gate).
      *   *Adaptation:* Tolstoy's "Universal Brotherhood" is too specific/religious. Replace with "Community Connection" or "Human Shared Experience" suitable for a city foundation.
      *   *Kill Switch:* If no feeling is transmitted, it's out (per Tolstoy).

  4.  **Analyzing the "Fudge Factors" (Theory vs. Practice):**

      *   *Drop:* Tolstoy's specific religious morality (Christian universalism).
      *   *Fudge:* "Sincerity." We can't know the artist's soul. We have to infer it from the work's coherence.
      *   *Drop:* The rejection of "complex" art. Tolstoy hated obscure art. A city foundation usually needs some diversity of form. *Correction:* The donor specifically complained about obscurity. So, leaning into Tolstoy's accessibility requirement is actually aligned with the stakeholder's demand.
      *   *Keep:* The "Infection" metric. It directly addresses the donor's complaint.

  5.  **Identifying Value Judgments:**

      *   *The "Worthiness" Question:* Just because art transmits anger doesn't mean the foundation should fund it (see App #3).
      *   *Who Decides:* The Panel identifies the feeling. The ED/Donor sets the boundaries of *acceptable* feelings (mission alignment).

  6.  **Predicting Systematic Failures:**

      *   *False Negatives:* Subtle, slow-burn, complex, or avant-garde work that requires time/context to "infect." Work that transmits discomfort rather than "feeling" in a traditional sense.
      *   *False Positives:* Melodrama, propaganda, kitsch, work that manipulates emotion cheaply (sentimentality).

  7.  **Running the Procedure on the Three Applications:**

      *   *App 1 (Video):* High craft, low infection. Panelists felt nothing.
          *   *Verdict:* Reject (Fails Tolstoy's primary test).
          *   *Letter:* Focus on "connection" rather than "quality."
      *   *App 2 (Mural):* Low craft, high infection. Panelists teared up.
          *   *Verdict:* Fund (Passes infection test, sincere, clear).
      *   *App 3 (Play):* High infection, high sincerity, toxic feeling (xenophobia).
          *   *Verdict:* Reject (Fails the "Worthiness" test).
          *   *Letter:* Hard truth. We fund connection, not division.

  8.  **Addressing the Panelist Objection ("Personal Taste"):**

      *   *Are they right?* Partially. "Infection" is subjective.
      *   *Mitigation:* Aggregation (6 panelists). If *none* feel it, it's likely not infectious. If *all* feel it, it's likely potent.
      *   *Distinction:* Taste is "I like this." Infection is "I feel what the artist intended."
      *   *Risk:* It favors emotional immediacy over intellectual depth.

  9.  **What It Can't Deliver:**

      *   It can't guarantee "Good Art" in an art-historical sense.
      *   It can't protect against manipulation.
      *   It can't satisfy donors who want *specific* political outcomes unless those align with the "feeling."
      *   It can't measure long-term impact.

  10. **Refining the Output:**

      *   *Tone Check:* Needs to be professional but candid. No academic jargon.
      *   *Structure:* Follow the prompt's sequence (Procedure -> Theory Analysis -> Value Judgments -> Failure Modes -> Application Verdicts -> Panelist Objection -> Limitations).
      *   *Specific Constraint:* "Don't soften #3." I need to be firm on why xenophobic art fails even if it's "effective" art by Tolstoy's definition.

  11. **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe let #3 pass but add a caveat?
      *   *Correction:* No, the prompt says "don't soften it." A foundation cannot fund hate speech disguised as art, even if it's "sincere." Tolstoy would actually reject #3 because it divides rather than unites (his religious criterion), but I need to secularize that. The "Worthiness" step is crucial here.
      *   *Initial thought:* Make the procedure complex.
      *   *Correction:* Keep it to 3 steps max. They have 8 minutes.
      *   *Tolstoy Translation:* Instead of "Christian Religious Consciousness," use "Shared Human Value."

  12. **Final Polish:** Ensure the letter drafts sound like grant letters (polite but firm). Ensure the distinction between "Infection" and "Taste" is clear. (Proceed to generate response).

  *(Self-Correction on Tolstoy's specific criteria)*: Tolstoy emphasizes *Sincerity* above all. If the artist is faking it, infection fails. But in App #3, the artist is sincere. So the rejection must come from the *content* of the feeling, not the transmission. This confirms the need for a "Step 3: Ethical/Mission Alignment."

  *(Self-Correction on Panelist Objection)*: The panelists are right to be worried. Sentimentality is the enemy of good art often. I need to acknowledge that "Infection" can be triggered by cheap tricks. The procedure needs a "Sincerity" check to filter out manipulation.

  *(Final Plan)*:
  1. The Procedure (3 Gates).
  2. Theory Audit (Keep/Drop/Fudge).
  3. Value Judgment Map.
  4. Failure Modes.
  5. The Three Verdicts (with letters).
  6. The "Personal Taste" Objection.
  7. The Limitations.

  Let's write it.cw
answer: |-
  Here is the decision procedure, the theoretical audit, and the application verdicts based on Tolstoy's *What Is Art?* adapted for your foundation's constraints.

  ### Part 1: The Decision Procedure (The "Infection Test")

  **Time Allocation:** 8 minutes per application (including work sample).
  **Participants:** 6 Panelists.
  **Voting:** Consensus preferred; 2/3 majority required to pass each gate.

  **Gate 1: The Sincerity Check (Did the maker mean it?)**
  *   **Question:** "Looking at the work and the proposal, does it feel like the artist *had* to make this, or like they made it to get a grant?"
  *   **Sufficient Answer:** At least 4 panelists agree the work shows a coherent internal logic or urgency that matches the artist's statement. There are no obvious signs of pandering to trends or filler.
  *   **Stop Condition:** If the panel agrees the work feels cynical, derivative, or assembled solely to check boxes, the application is rejected.
  *   **Tolstoy Translation:** This tests *Sincerity*. If the artist doesn't feel the emotion they are transmitting, infection is impossible.

  **Gate 2: The Infection Check (Did it land?)**
  *   **Question:** "In the time you spent with the work sample, did you experience a specific emotion or sensation that you believe the artist intended you to feel? Please name the feeling."
  *   **Sufficient Answer:** At least 4 panelists can name a feeling (e.g., "grief," "joy," " claustrophobia," "outrage") that aligns with the artist's stated intent. It does not matter if they *liked* the feeling, only that they *caught* it.
  *   **Stop Condition:** If the majority report feeling "nothing," "confused," or "bored," the application is rejected.
  *   **Tolstoy Translation:** This tests *Infection*. Art that fails to transmit feeling is not art, it is counterfeit. Technical skill (Gate 0, implicitly) is irrelevant if infection fails.

  **Gate 3: The Worthiness Check (Is this feeling ours to fund?)**
  *   **Question:** "Does the feeling transmitted align with the foundation's mission to strengthen our community?"
  *   **Sufficient Answer:** At least 4 panelists agree the emotion fosters connection, understanding, or necessary critique without dehumanizing others.
  *   **Stop Condition:** If the transmitted feeling promotes hatred, exclusion, or harm against a protected group, the application is rejected regardless of sincerity or infection.
  *   **Tolstoy Translation:** Tolstoy used "Christian Universal Brotherhood." You are using "Foundation Mission/Community Health." This is where you override the aesthetic test with an ethical one.

  ***

  ### Part 2: Theoretical Audit (What Survives, What Drops)

  **What Survives:**
  1.  **The Primacy of Reception:** Tolstoy shifts the weight from the *object* (is it well-made?) to the *relationship* (did it move the receiver?). This directly addresses your donor's complaint.
  2.  **Sincerity as a Quality Metric:** In Tolstoy's view, a clumsy work felt deeply is "better art" than a perfect work felt coldly. This validates the mural over the video piece.
  3.  **Accessibility:** Tolstoy argued that if only a few elites understand it, it's failing. This supports your panel's reaction to the biennial video.

  **What You Had to Drop:**
  1.  **Religious Consciousness:** Tolstoy judged art by whether it advanced 19th-century Christian morality. You cannot ask an accountant to judge if a piece advances "Christian brotherhood." You replaced this with **Gate 3 (Mission Alignment)**.
  2.  **The Rejection of Complexity:** Tolstoy dismissed anything obscure as "bad art." You have to soften this. You are not banning complexity, but you are demanding that the complexity *transmit* rather than *obscure*.
  3.  **The Artist's Biography:** Tolstoy cared deeply about the artist's life. You only have a proposal and a sample. You are inferring sincerity from the work, which is a proxy, not the real thing.

  **What You Had to Fudge:**
  1.  **Intent vs. Reception:** Tolstoy assumes the feeling received is the feeling sent. In reality, audiences project. Your procedure asks panelists to *believe* they are identifying the artist's intent. This is a necessary fiction to make the test work in 8 minutes.
  2.  **Time:** Tolstoy's infection can take time. Your 8-minute window favors immediate emotional impact over slow-drip realization. You are systematically biasing toward the immediate.

  ***

  ### Part 3: The Value Judgment Map

  **Where Fact Ends and Judgment Begins:**
  *   **Gate 1 (Sincerity):** This is a judgment call. An accountant cannot *know* if an artist is sincere. They are judging *coherence*.
  *   **Gate 3 (Worthiness):** This is purely a value judgment. There is no objective fact that "hope" is better than "rage."

  **Who Makes the Judgment:**
  *   **Gate 1 & 2:** The **Panel**. They are the sensors for sincerity and infection.
  *   **Gate 3:** The **Panel**, guided by the **Executive Director**. The ED must provide the "Mission Guardrails" before the panel meets. If the panel is split on whether a feeling is "harmful," the ED casts the tie-breaking vote to protect the foundation's legal and reputational standing. The **Donor** has no formal vote here, though Gate 2 is designed to satisfy their demand for impact.

  ***

  ### Part 4: Systematic Failure Modes

  **What Good Art Will This Reject? (False Negatives)**
  1.  **Slow-Burn Work:** Art that requires 20 minutes of contemplation to "infect" will fail the 8-minute sample review.
  2.  **Discomfort as Goal:** Art designed to numb, alienate, or frustrate (to make a point about alienation) may be rejected because panelists report "feeling nothing" or "feeling annoyed."
  3.  **High-Context Work:** Art that relies on specific art-historical knowledge to unlock the emotion will fail the "Accessibility" bias of the test.

  **What Bad Art Will This Fund? (False Positives)**
  1.  **Melodrama/Kitsch:** Work that manipulates emotion cheaply (sad music, images of children, shock value) will pass Gate 2 easily.
  2.  **Propaganda:** As seen in Application #3, highly effective political messaging can pass the Infection Test. It requires Gate 3 to catch it.
  3.  **The "Room Feelers":** Work that appeals specifically to the demographics of your panel (e.g., nostalgic work for older panelists) will score higher than work for a different demographic.

  ***

  ### Part 5: Application Verdicts

  #### Application 1: The Biennial Video
  *   **Gate 1 (Sincerity):** Pass. It is coherent and clearly deliberate.
  *   **Gate 2 (Infection):** **Fail.** Two non-artist panelists felt nothing. The others likely felt "intellectual intrigue," but the donor's complaint was about *human feeling*. If the majority cannot name the feeling, infection failed.
  *   **Verdict:** **Reject.**
  *   **Draft Letter Text:**
      > "Thank you for submitting your work. Our panel was impressed by your technical command and exhibition history. However, our funding criteria prioritize the immediate transmission of feeling to a general audience. During our review, the panel was unable to identify a shared emotional experience derived from the work sample. We are looking for projects where the emotional intent lands clearly on the viewer without requiring specialized context. We hope you will apply again with work that bridges that gap."

  #### Application 2: The Teen Center Mural
  *   **Gate 1 (Sincerity):** Pass. The urgency of the teens and the teacher is evident.
  *   **Gate 2 (Infection):** **Pass.** Three panelists teared up. The feeling (pride, community ownership) was transmitted clearly despite technical flaws.
  *   **Gate 3 (Worthiness):** Pass. Fosters community connection.
  *   **Verdict:** **Fund.**
  *   **Draft Letter Text:**
      > "We are delighted to fund this project. Our panel reported a powerful emotional response to the work sample, noting a strong sense of shared pride and community ownership. While we noted technical imperfections, our criteria prioritize the sincerity of the expression and its capacity to connect with viewers over technical polish. This project exemplifies the kind of human impact we aim to support."

  #### Application 3: The One-Woman Play
  *   **Gate 1 (Sincerity):** Pass. The anger is palpable and clearly lived.
  *   **Gate 2 (Infection):** **Pass.** The audience "went along with it." The anger was transmitted successfully.
  *   **Gate 3 (Worthiness):** **Fail.** The feeling transmitted is xenophobic resentment. It dehumanizes a protected group.
  *   **Verdict:** **Reject.** (Do not soften this).
  *   **Draft Letter Text:**
      > "Thank you for sharing your story. The panel acknowledged the sincerity of your performance and the strength of the emotion transmitted. However, we cannot fund this project. Our mission requires that the feelings we support foster connection and dignity within the broader community. The work directs anger toward a specific group in a way that contradicts our commitment to inclusivity. We fund art that challenges power, not art that punches down."

  ***

  ### Part 6: The Panelist Objection ("Is this just personal taste?")

  **Are they right?**
  Yes, partially. "Infection" is subjective. If your panel is mostly older, conservative, or emotionally reserved, they will reject work that infects younger or more radical audiences. Tolstoy's test does not solve subjectivity; it just moves it from "Is this good?" to "Did this hit me?"

  **What the procedure can do about it:**
  1.  **Aggregate the Data:** One panelist feeling nothing is data. Six panelists feeling nothing is a verdict. If the work infects *some* but not *others*, the discussion should focus on *who* is being infected. Is the work exclusive?
  2.  **Require Naming:** You cannot just say "I felt something." You must say "I felt X." If Panelist A says "I felt hope" and Panelist B says "I felt manipulated," infection is unstable. This exposes taste masquerading as truth.
  3.  **Calibration:** Before reviewing, have the panel watch a neutral clip and practice naming feelings.

  **What the procedure can't do:**
  It cannot protect against **Sentimentality**. Sentimentality is the counterfeit of feeling—it triggers a tear without the underlying truth. Tolstoy relied on Sincerity (Gate 1) to catch this, but a skilled manipulator can fake sincerity. Your panel will fund some manipulative work. Accept this as the cost of prioritizing "impact" over "craft."

  ***

  ### Part 7: What This Cannot Deliver (The Donor Management)

  You need to tell the donor this explicitly so they don't expect miracles:

  1.  **It Cannot Guarantee "Good Art":** This procedure funds *effective communication*, not necessarily *great art*. Some funded work will be simplistic. Some rejected work will be masterpieces that require more than 8 minutes to understand.
  2.  **It Cannot Measure Long-Term Change:** Feeling something for 8 minutes in a conference room is not the same as a life changed. Tolstoy claimed art changes lives; your grant cycle can only measure if it changes *moods*.
  3.  **It Cannot Eliminate Bias:** The "feeling" will always be filtered through the demographics of your panel. If you want different art, you need different panelists, not just a different rubric.
  4.  **It Cannot Satisfy Everyone:** By rejecting the "Biennial Video," you will anger the arts establishment. By rejecting the "Xenophobic Play," you may anger a segment of the public. By funding the "Mural," you may be accused of lowering standards.

  **Final Advice:**
  Tolstoy's theory is a hammer. It will smash the ivory tower (which your donor wants), but it will also smash nuance. Use it for one cycle. Watch what gets funded. If the "Mural" type work actually helps the city, keep it. If you find you've funded nothing but propaganda and kitsch, reintroduce a "Craft/Execution" gate to balance the "Infection" gate. But for now, this procedure does exactly what your donor asked: it makes "did it move a human" the price of admission.
