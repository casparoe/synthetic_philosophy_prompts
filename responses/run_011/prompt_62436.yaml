answer: |-
  # The "What's In A Name?" Species Intuition Inventory

  **Instructions:** Read each scenario. Choose the response that best matches your gut reaction or professional habit. Do not overthink the philosophy; pick what feels like the *right* way to handle the case.

  ### 1. The Hybridizing Oaks
  Two populations of oak trees occupy adjacent valleys. They meet in a narrow pass where they hybridize freely. However, outside the pass, they maintain distinct leaf shapes, bark textures, and soil preferences. They have done this for 50,000 years.
  *   **A.** They are two species. The hybrids are just noise in the contact zone; the distinct ecologies and forms matter most.
  *   **B.** They are one species. If genes are flowing between them, the barrier isn't real, regardless of how different they look.
  *   **C.** Call them two species if it helps you manage the forest, one if it helps you study gene flow. The label is for your convenience.

  ### 2. The Ring of Snails
  A chain of snail populations circles a mountain range. Population A mates with B, B with C, and so on around the ring. But where the chain closes, Population A and Population Z coexist and refuse to mate, acting like distinct biological units.
  *   **A.** It is one species. The genetic connection is unbroken around the ring.
  *   **B.** It is at least two species. The ends are reproductively isolated and that is the defining moment of speciation.
  *   **C.** The "species" label breaks down here. Draw the line where it is most useful for your specific map.

  ### 3. The Ancient Asexuals (Bias Check #1)
  A lineage of microscopic invertebrates has reproduced only by cloning for 40 million years. There is no sex, no recombination, and no interbreeding. Yet, they form distinct groups based on DNA sequences and habitat.
  *   **A.** "Species" is the wrong word here. Without sex, the biological definition collapses. Use "strain" or "cluster."
  *   **B.** They are species. Distinct evolutionary lineages with separate fates count, even without mating.
  *   **C.** They are species. If they look different and live in different places, they are different units of biodiversity.

  ### 4. The Swapping Prokaryotes (Bias Check #2)
  Two clades of bacteria maintain distinct ecological roles (one fixes nitrogen, one digests cellulose). However, they constantly swap plasmids and gene fragments across the clade boundary via horizontal transfer. There is no clean "tree" of ancestry.
  *   **A.** They are one genetic pool. The constant gene flow makes drawing a boundary arbitrary.
  *   **B.** They are two species. Ecological function is the glue, not vertical ancestry.
  *   **C.** They are two species. Despite the swapping, their core genomes cluster separately enough to diagnose them.

  ### 5. The Fossil Horse Series
  You have a stratigraphic sequence of horse ankle bones spanning 2 million years. The bones change gradually, but there are three distinct periods where the morphology stabilizes before shifting again. You cannot test breeding.
  *   **A.** Three species. The morphological gaps indicate distinct periods of stasis and identity.
  *   **B.** One evolving lineage. Cutting it into three is an artificial slice of a continuous process.
  *   **C.** Three species. It helps museum curators organize the display and communicate changes to the public.

  ### 6. The Cryptic Frogs
  Two populations of frogs look identical to the human eye and live in the same pond. However, genetic analysis shows they haven't exchanged genes in 5 million years, and their calls are slightly different frequencies.
  *   **A.** One species. If you can't tell them apart in the field without a sequencer, the distinction is academic.
  *   **B.** Two species. Reproductive isolation has existed for millions of years; they are on separate evolutionary trajectories.
  *   **C.** Two species. They are genetically distinct clusters, regardless of morphology.

  ### 7. The Invasive Swarm
  An introduced plant hybridizes with a native relative, creating a swarm of offspring with mixed traits. Some breed with natives, some with invaders, some with each other. The group is stable and persistent.
  *   **A.** It is a new, hybrid species. It has a stable ecological niche and persists over time.
  *   **B.** It is a mess. Until they stop breeding with the parents, they are just a hybrid zone, not a species.
  *   **C.** It is a management unit. Whether it is a "species" depends on whether you are trying to eradicate it or protect it.

  ### 8. The Lab Strains
  Two lines of fruit flies have been kept in separate labs for 10 years. They have accumulated genetic differences. If you brought them together, they *could* mate, but they never *do* in nature because they are in different buildings.
  *   **A.** One species. The potential to interbreed is there; the isolation is artificial/geographic, not biological.
  *   **B.** Two lineages. They are accumulating independent mutations and drift; treat them as separate units of study.
  *   **C.** One species. The separation is a human artifact, not a joint in nature.

  ***

  # Scoring Key & Interpretation

  ## Part 1: Tally Your Axes

  Do not look for a single "Concept" name. Instead, tally your marks on these two independent axes.

  ### Axis 1: Ontological Status (Are they real?)
  *Count how many times you chose options that align with these columns.*

  | **Realist (Joints in Nature)** | **Instrumentalist (Taxonomic Ranks)** |
  | :--- | :--- |
  | **Q1:** A (Distinct forms/ecology) | **Q1:** C (Convenience) |
  | **Q2:** A or B (One *or* Two, but definite) | **Q2:** C (Label breaks down/Useful) |
  | **Q3:** B or C (Lineage or Traits) | **Q3:** A (Wrong word/Strain) *Note: Can be Realist about strains, but Anti-Realist about "species"* |
  | **Q4:** B or C (Ecology or Clusters) | **Q4:** A (Arbitrary boundary) |
  | **Q5:** A (Morphological gaps) | **Q5:** B (Continuous process) or C (Curator convenience) |
  | **Q6:** B or C (Isolation or Genetics) | **Q6:** A (Academic distinction) |
  | **Q7:** A (Stable niche) | **Q7:** C (Management unit) |
  | **Q8:** B (Independent units) | **Q8:** A or C (Potential/Artifact) |

  *   **High Realist:** You believe species exist independently of human classification.
  *   **High Instrumentalist:** You believe species are tools, hypotheses, or ranks imposed on continuity.

  ### Axis 2: Cohesion Property (What holds them together?)
  *Count which mechanism you prioritized across the 8 questions.*

  | **Isolation (Reproductive)** | **Niche (Ecological)** | **Diagnosis (Traits/Genetics)** | **Lineage (History/Fate)** | **None/Pluralist** |
  | :--- | :--- | :--- | :--- | :--- |
  | **Q1:** B | **Q1:** A | **Q1:** A | **Q3:** B | **Q1:** C |
  | **Q2:** B | **Q4:** B | **Q3:** C | **Q5:** B | **Q2:** C |
  | **Q6:** B | **Q7:** A | **Q4:** C | **Q6:** B | **Q7:** C |
  | **Q8:** A | | **Q5:** A | **Q8:** B | **Q4:** A |
  | | | **Q6:** C | | |

  *   **Isolation:** You prioritize barriers to gene flow (The "Mayr" intuition).
  *   **Niche:** You prioritize ecological role and selection (The "Van Valen" intuition).
  *   **Diagnosis:** You prioritize identifiable differences, morphological or genetic (The "Cracraft" intuition).
  *   **Lineage:** You prioritize independent evolutionary trajectories (The "Wiley" or "De Queiroz" intuition).
  *   **None/Pluralist:** You prioritize utility or deny a single unifying property (The "Ereshefsky" or "Kitcher" intuition).

  ***

  ## Part 2: The Forbidden Zones (Empty Cells)

  Plot your dominant Axis 1 score against your dominant Axis 2 score. If you land in one of the following cells, your position is theoretically rare or problematic.

  | Ontology \ Cohesion | **Isolation** | **Niche** | **Diagnosis** | **Lineage** | **None** |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Realist** | *Defended* (BSC) | *Defended* (ESC) | *Contested* (PSC) | *Defended* (GSC/ESC) | **INCOHERENT** |
  | **Instrumentalist** | **UNFASHIONABLE** | *Defended* (Pragmatic) | *Defended* (Operational) | **UNEXPLORED** | *Defended* (Nominalism) |

  ### Analysis of Empty/Weak Cells:

  1.  **Realist + None (INCOHERENT):**
      *   *Why:* If you claim species are "real joints in nature" (Realist), you must posit *what* makes that joint real. To say they are real but held together by "nothing" (or purely arbitrary factors) is metaphysically contradictory. You are claiming mind-independent existence for a mind-dependent boundary.
  2.  **Instrumentalist + Isolation (UNFASHIONABLE):**
      *   *Why:* If species are just tools for humans (Instrumentalist), adopting "Reproductive Isolation" as your criterion is adopting the most difficult, expensive, and often impossible tool to use (especially for fossils, asexuals, or allopatry). Most instrumentalists prefer Diagnosability or Ecology because they are easier to *use*.
  3.  **Instrumentalist + Lineage (UNEXPLORED):**
      *   *Why:* "Lineage" is a heavy metaphysical commitment about history and fate. It is rare to find someone who says "Species aren't real, they are just tools," but then insists the *only* valid tool is "Independent Evolutionary Trajectory." Usually, instrumentalists prefer operational traits over historical narratives.

  ***

  ## Part 3: Blind Spots (Indistinguishable Leaves)

  This quiz cannot distinguish between the following pairs of positions. If your scores cluster here, acknowledge the ambiguity.

  **1. The "Sexual Animal" Blind Spot: Lineage vs. Cohesion**
  *   **The Confusion:** In sexual, macroscopic animals (like the frogs in Q6 or snails in Q2), the **Lineage Concept** (separate evolutionary fates) and the **Cohesion Concept** (mechanisms limiting divergence) almost always yield the same groups.
  *   **The Limit:** This quiz cannot tell if you value the *history* (Lineage) or the *mechanism maintaining the history* (Cohesion/Isolation). In 90% of the questions, these answers overlap. You would need a scenario involving a lineage that is historically separate but currently exchanging genes (like the oaks in Q1) to pry them apart, and even then, intuitions vary.

  **2. The "Data" Blind Spot: Diagnosis vs. Genotypic Clustering**
  *   **The Confusion:** Options favoring "Distinct Traits" (Diagnosis) and "Genetic Clusters" often map to the same score.
  *   **The Limit:** Modern Phenetic Species Concepts (Diagnosis) and Genotypic Cluster Concepts are empirically similar in most cases. Unless a scenario presents organisms that are genetically distinct but morphologically identical (Q6), or vice versa, the quiz treats these as the same "leaf."

  **3. The "Bias" Blind Spot: Ornithologist vs. Microbiologist**
  *   **The Confusion:** Look at **Q3 (Asexuals)** and **Q4 (Prokaryotes)**.
  *   **The Limit:** An ornithologist often answers Q3 with "Species concept doesn't apply" (treating it as an exception). A microbiologist answers Q3 with "Ecology/Genetics define them" (treating it as the rule).
      *   If you scored high on **Isolation** generally, but switched to **Niche/Diagnosis** for Q3 and Q4, you are a **Pluralist** (different concepts for different taxa).
      *   If you scored high on **Isolation** for Q3 and Q4 (forcing the answer), you are a **Universalist** (likely animal-biased).
      *   *Note:* The quiz does not penalize Universalism, but the scoring key reveals it. If you tried to force "Interbreeding" answers onto the Bacteria or Rotifers, your "Isolation" score is high, but your biological applicability is low.

  ***

  ### A Note on the "Animal Bias" Critique
  If your **Axis 2 (Cohesion)** score is dominated by **Isolation**, check your answers to **Q3** and **Q4**.
  *   If you maintained Isolation as the criterion for the asexual rotifers or swapping bacteria, you likely hold a **Universal Biological Species Concept**. Be warned: In the seminar, you will be asked how gene flow is measured in organisms that do not undergo meiosis.
  *   If you switched to **Niche** or **Diagnosis** for Q3/Q4 but kept **Isolation** for Q1/Q2/Q6, you hold a **Pluralist** view. This is the most common position among working biologists, though it frustrates philosophers seeking a single definition.
