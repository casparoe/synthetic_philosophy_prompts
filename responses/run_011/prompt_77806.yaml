answer: |-
  This is a profound and technically precise challenge to a standard trope in the philosophy of science. Your intuition is correct: the map analogy, while rhetorically potent for Friedman's instrumentalism, collapses under the specific structural pressures of geophysical fluid dynamics (GFD), particularly regarding closure.

  Here is the audit you requested, structured to address your specific typologies of idealization and the philosophical implications thereof.

  ### 1. Table of Correspondences: Map Analogy vs. GFD Model

  To see where the analogy breaks, we must first formalize where it holds.

  | Feature | The Map Analogy (Cartography) | GFD Model Type (i): Neglected Terms | GFD Model Type (ii): Singular Limits | GFD Model Type (iii): Closure Relations |
  | :--- | :--- | :--- | :--- | :--- |
  | **Representation** | Selective omission of features (e.g., individual trees). | Dropping terms based on scale analysis (e.g., Coriolis in small basin). | Taking $Re \to \infty$ or $H \to 0$ (e.g., inviscid flow, shallow water). | Substituting unknown physics with constitutive laws (e.g., eddy viscosity). |
  | **Justification** | Relevance to the user's purpose (driving vs. hiking). | Order-of-magnitude analysis (Rossby number, etc.). | Mathematical tractability; assumption that limit behavior captures essence. | Necessity to close the system; empirical tuning. |
  | **Relation to Truth** | The tree exists; it is just not drawn. | The term exists; it is dynamically negligible. | The limit does not exist physically; the physics changes type (e.g., boundary layers vanish). | **The term has no physical referent.** It is a mathematical placeholder. |
  | **Distortion** | Projection distortion (Mercator vs. Peters). | Truncation error (bounded). | **Singular perturbation** (solution at limit $\neq$ limit of solution). | **Structural error** (model topology differs from reality). |
  | **Calibration** | Surveying ground truth. | Validation against data. | Asymptotic matching. | **Tuning** coefficients to match observed statistics, not mechanisms. |

  ### 2. Critical Disanalogies

  Your correspondent argues that because maps omit details to be useful, model assumptions being "unrealistic" is epistemically irrelevant. This relies on two hidden features of maps that models (especially in GFD) do not possess.

  **A. The Surveyor's Epistemic Access**
  *   **Map:** The cartographer *knows* the territory exists and knows *what* has been omitted. The distortion is a conscious choice made *after* accessing the truth.
  *   **Model:** In GFD (especially climate), the modeler often does *not* know the "territory" (future climate, deep ocean mixing) independently of the model.
  *   **Impact on Argument:** This disanalogy is fatal to the "epistemically irrelevant" claim. If you know what you omitted (Map), you can estimate the error. If you omit via closure (Model iii), you are substituting ignorance for knowledge. Treating the assumption as irrelevant masks the uncertainty.

  **B. The Stability of Distortion**
  *   **Map:** A Mercator projection distorts area consistently. Greenland is always too big. The user knows the rule of distortion.
  *   **Model:** Closure relations (iii) are often *flow-dependent*. An eddy viscosity tuned for the North Atlantic may fail in the Southern Ocean. The "distortion" is not a fixed property of the representation; it is a property of the interaction between the representation and the specific state of the system.
  *   **Impact on Argument:** This makes the "map" unreliable for navigation outside calibrated waters. Friedman's thesis works for *interpolation* (where the map analogy holds) but fails for *extrapolation* (where GFD often aims).

  ### 3. Does the Conclusion Survive? (The Case of Closure)

  Your correspondent concludes that realism of assumptions is epistemically irrelevant and that scientists' reluctance is "aesthetic squeamishness."

  **Verdict:** The conclusion does not survive the scrutiny of Case (iii).

  In Case (i) and (ii), the idealization is a simplification of *existing* physics. In Case (iii), the idealization is the *invention* of physics.
  *   **Friedman's Strength:** Instrumentally, you are right to note that (iii) seems to strengthen Friedman: prediction succeeds despite the assumption having no referent. This is the core of the "as if" argument.
  *   **Friedman's Weakness:** However, this success is locally brittle. Because the closure has no referent, it lacks *modal robustness*. It works for the "actual" but fails for the "possible."
  *   **Epistemic Relevance:** The assumption is not irrelevant; it is the *bottleneck* of knowledge. If we treat the eddy viscosity as merely a tool (Friedman), we stop asking how turbulence actually mixes. If we treat it as a hypothesis (Realist), we test it against new regimes. The "aesthetic squeamishness" of scientists is actually a heuristic safeguard against overfitting. They know that a model with too many "invented features" (iii) will navigate the known seas perfectly but run aground in the unknown.

  Therefore, Case (iii) makes Friedman's thesis **instrumentally stronger** (look how well it predicts!) but **epistemically weaker** (we understand less about *why* it predicts). Since science aims at understanding mechanisms to secure prediction under intervention (or climate forcing), the epistemic weakness is decisive.

  ### 4. The Prosthesis Analogy

  You proposed: *A model is a prosthesis — it does the work of the missing part and is judged by function rather than by resemblance.*

  *   **Improvement:** It correctly shifts focus from *representation* (mirror of nature) to *capacity* (ability to act/calculate). It captures the "make-do" nature of parameterization.
  *   **Confusion:** A prosthesis replaces a *function* of a body that is absent. A parameterization replaces a *mechanism* that is present but unresolved.
      *   If I lose a leg, a wooden leg allows me to walk. It does not claim to be a leg.
      *   If I model the ocean, the eddy viscosity claims to *be* the mixing process (mathematically).
      *   **Risk:** The prosthesis analogy might encourage the view that we don't need to understand the "leg" (the turbulence) at all, only that the model walks. This reinforces the Friedman error. A better view is that the prosthesis is a **temporary scaffold**. We use it to build the structure while we search for the real stone.

  ### 5. A Better Analogy: The Navigational Instrument (The Sextant)

  If the Map is too static and the Prosthesis too functionalist, consider the **Sextant**.

  *   **Correspondence:** A sextant allows you to determine your position (prediction) by measuring angles between stars.
  *   **Assumptions:** It assumes light travels in straight lines (ignoring general relativistic bending for local nav), that the earth is a sphere, etc.
  *   **Case (iii) Equivalent:** The index mirror adjustment. If the mirror is slightly off, you apply a "correction" (calibration).
  *   **Why it fits:**
      1.  **Instrumental:** It is judged by whether it gets you home (like Friedman).
      2.  **Epistemic Constraint:** You know *why* it works (optics). If the correction term drifts, you know the instrument is broken, not that the stars changed.
      3.  **Closure:** In GFD, the "correction" (closure) often absorbs physical errors. In a sextant, the correction absorbs instrumental error.
      4.  **The Lesson:** A sextant is useless if you don't know its error bounds. Friedman's defenders treat the model like a magic compass that points North without needing to know about magnetism. The GFD modeler knows the "magnetism" (turbulence) is missing, and that makes the "North" (prediction) suspect under changing conditions.

  ### 6. Confidence and Uncertainty

  **Confidence in Main Claims:**
  *   **High Confidence (>90%):** That the Map Analogy fails to capture the epistemic risk of Case (iii) closures. The distinction between *omission* (Map) and *substitution* (Closure) is philosophically robust and undermines the "irrelevance of assumptions" claim.
  *   **High Confidence (>90%):** That the "Surveyor's Access" disanalogy is the critical failure point of the Friedman defense in the context of climate/ocean prediction where ground truth is unavailable.

  **Point of Least Certainty:**
  *   **Confidence:** Moderate (~60%).
  *   **The Point:** Whether Case (iii) ultimately validates a *sophisticated* instrumentalism (e.g., Cartwright's "nomological machines") rather than Friedman's crude "predictive success is all."
  *   **Why:** It is possible to argue that *all* successful science relies on "capacities" (iii) rather than "laws." If the eddy viscosity captures the *capacity* of the flow to mix, even without the *mechanism*, a refined instrumentalist might claim victory. I am less certain that your distinction between "mechanism" and "capacity" is sufficient to defeat a sophisticated instrumentalist who abandons "truth" for "empirical adequacy" (van Fraassen).
  *   **What Would Settle It:** A historical case study in GFD where a model with "unrealistic" closure (iii) successfully predicted a regime change *and* the closure was later derived from first principles (DNS), showing the "fake" assumption was actually capturing a real invariant. Conversely, a case where tuned closure failed catastrophically under new forcing *because* it lacked a referent. (The latter is common, but the former is the instrumentalist's hope).

  ### Summary for Your Correspondent

  You may tell your correspondent that the Map Analogy assumes the modeler is a **Surveyor** (who knows the territory) rather than an **Explorer** (who uses the model to find the territory). In GFD, we are Explorers. When we draw a map with invented roads (Closure), we may navigate the known coast, but we cannot trust it for the open ocean. The "aesthetic squeamishness" is actually the recognition that a map with invented features is a work of fiction, and while fiction can be inspiring, it is a poor basis for engineering.
