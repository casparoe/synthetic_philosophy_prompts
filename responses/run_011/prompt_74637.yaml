answer: |-
  This is a sharp question, and your instincts are correct. The blog post you read is conflating two distinct pieces of Harsanyi's work (the Aggregation Theorem and the Impartial Observer Theorem) and smoothing over the normative assumptions required to get from the math to "Classical Utilitarianism."

  The author isn't a crank—the math is real—but the philosophical packaging is doing a lot of heavy lifting that isn't acknowledged. For your EA group and the AI alignment argument, the distinction between "this is the only coherent way to aggregate" and "this is the only coherent way to aggregate *if you accept these specific ethical premises*" is the entire ballgame.

  Here is the claim-by-claim breakdown, followed by the specific resolutions you asked for.

  ### Part 1: Claim-by-Claim Breakdown

  **Claim:** *"Harsanyi's theorem is the closest thing social science has to a straight-up proof of utilitarianism."*
  *   **Verdict:** **Right-but-Simplified (Misleading).**
  *   **Analysis:** It is a representation theorem, not a moral proof. It proves that *if* you accept specific axioms about rationality and Pareto efficiency, your social welfare function *takes the form* of weighted utilitarianism. It does not prove you *ought* to accept those axioms. Calling it a "proof of utilitarianism" skips the step where one justifies the axioms as moral requirements rather than mere consistency constraints.

  **Claim:** *"Take a fixed group of people whose preferences over lotteries satisfy the von Neumann-Morgenstern (VNM) axioms, so each of them has a cardinal utility function."*
  *   **Verdict:** **Actually Right.**
  *   **Analysis:** This is standard decision theory. If an individual's preferences satisfy Completeness, Transitivity, Continuity, and Independence, there exists a utility function $U$ unique up to positive affine transformation (i.e., cardinal utility).

  **Claim:** *"Take society's preferences over the same lotteries and assume they satisfy those axioms too."*
  *   **Verdict:** **Actually Right (as a premise), but Philosophically Contested.**
  *   **Analysis:** This is the "Social VNM" assumption. Mathematically, it's fine. Philosophically, it's huge. It assumes "Society" can be treated as a single rational agent facing risk. Many theorists argue social choice doesn't need to satisfy individual rationality axioms (e.g., why should society be risk-neutral just because individuals are?).

  **Claim:** *"Add Pareto: if everyone prefers A to B, society has to prefer A to B."*
  *   **Verdict:** **Actually Right.**
  *   **Analysis:** This is the Pareto Efficiency condition. It is the engine of the theorem. Without it, the social utility function doesn't need to depend on individual utilities at all.

  **Claim:** *"Then the social utility function is forced to be a weighted sum of the individual ones..."*
  *   **Verdict:** **Actually Right.**
  *   **Analysis:** This is the core mathematical result of Harsanyi's Aggregation Theorem (1955). If Social Preferences and Individual Preferences all satisfy VNM, and Social Preferences satisfy Pareto, then $W = \sum a_i U_i + b$.

  **Claim:** *"...and once you add the uncontroversial requirement that nobody's utility gets special treatment, the weights come out equal..."*
  *   **Verdict:** **Wrong/Misleading.**
  *   **Analysis:** This is the first major sleight of hand. The theorem yields *weighted* utilitarianism ($a_i$ can differ). To get equal weights ($a_i = a_j$), you must add an **Anonymity** or **Impartiality** axiom. While this sounds "uncontroversial," it is a substantive ethical commitment, not a mathematical consequence of the aggregation result. (See Part 2 below).

  **Claim:** *"The beautiful part is that this sidesteps Arrow: Arrow proved you can't aggregate preferences, but only because he banned interpersonal comparisons of utility."*
  *   **Verdict:** **Right-but-Simplified.**
  *   **Analysis:** Arrow's Impossibility Theorem assumes ordinal utility (rankings) and no interpersonal comparisons. Harsanyi assumes cardinal utility (derived from risk preferences). Harsanyi doesn't "refute" Arrow; he operates in a richer informational environment. Saying it "sidesteps" Arrow is fair, provided you acknowledge that getting that richer information is the hard part.

  **Claim:** *"Let those back in and the impossibility evaporates."*
  *   **Verdict:** **Right-but-Simplified.**
  *   **Analysis:** Technically true within the model. But "letting interpersonal comparisons back in" isn't just flipping a switch; it requires a theory of how to calibrate utility scales across different minds.

  **Claim:** *"The one real cost is the comparability itself, and Harsanyi's defense of it is basically that I can put myself in your shoes and ask how much I'd care about your outcomes..."*
  *   **Verdict:** **Right-but-Simplified.**
  *   **Analysis:** This refers to Harsanyi's **Impartial Observer Theorem**, which is distinct from the Aggregation Theorem. The Aggregation Theorem takes utilities as given inputs; the Impartial Observer argument attempts to justify why those utilities are comparable and why weights should be equal. The blog post conflates the two, making the ethical justification seem like a mathematical corollary.

  ---

  ### Part 2: Resolving Your Specific Questions

  #### 1. Is the equal-weights step a separate argument?
  **Yes.** Your comment-thread informant was correct.

  Harsanyi's Aggregation Theorem proves that the social welfare function is a **linear combination** of individual utilities:
  $$W = a_1U_1 + a_2U_2 + ... + a_nU_n$$
  The theorem does **not** determine the values of $a_i$. They are arbitrary positive constants. You could have a society that satisfies all of Harsanyi's axioms but weights the utility of Person 1 ten times higher than Person 2 (e.g., a caste system that is still Pareto-efficient and VNM-rational).

  To get Classical Utilitarianism ($a_1 = a_2 = ... = 1$), you must explicitly add an **Anonymity Axiom** (sometimes called Symmetry or Impartiality). This axiom states that the social ranking should not depend on the *labels* of the individuals.
  *   **Why this matters:** Anonymity is a moral principle, not a rationality constraint. By calling it an "uncontroversial requirement," the blog author hides the fact that they are importing a specific egalitarian moral premise to get the utilitarian conclusion.

  #### 2. Is the "Arrow is dissolved" move swagger?
  **Yes, mostly.**

  A social choice theorist would respond like this:
  Arrow's theorem shows that you cannot aggregate *ordinal* preferences into a social ordering while satisfying a set of reasonable conditions (Unrestricted Domain, Pareto, Independence of Irrelevant Alternatives, Non-Dictatorship).
  Harsanyi's theorem shows that if you upgrade the input from *ordinal preferences* to *cardinal utilities derived from risk*, you can aggregate them.

  The "swagger" lies in implying that the Harsanyi input (cardinal utility via risk) is the *correct* or *obvious* input for ethics.
  *   **The Counter:** Why should social ethics be modeled as a lottery choice? Arrow's framework is more general because it doesn't assume we can measure "strength of preference" via risk attitudes. Many people believe rights or duties should constrain aggregation regardless of utility intensity. Harsanyi doesn't "dissolve" the problem of aggregation; he changes the domain to one where aggregation is possible, at the cost of assuming that "utility" is a measurable, comparable quantity that captures everything of moral value.

  ---

  ### Part 3: The Core Philosophical Question

  **Once you fix everything that's off, is there still an argument for utilitarianism standing, or does the corrected version just describe the shape of a family of aggregation rules that a utilitarian happens to like?**

  It is the latter. The corrected version describes a **family of rules (Weighted Utilitarianism)** that a utilitarian happens to like.

  To get to "Utilitarianism" as a moral doctrine, you must independently argue for:
  1.  **Preferencism:** That satisfying preferences is the sole constituent of welfare (vs. hedonism or objective list theories).
  2.  **Social Rationality:** That "Society" ought to be a VNM-rational agent (satisfying Independence, etc.).
  3.  **Comparability:** That we can meaningfully compare the utility units of different people.
  4.  **Impartiality:** That everyone's weights must be equal.

  Harsanyi's theorem is best understood as a **consistency argument**. It says: *"If you want to be a Paretian, and you want Society to be rational in the VNM sense, then you must act **as if** you are maximizing a weighted sum of utilities."*
  It does not tell you *why* you should want Society to be VNM-rational. If you believe in rights that function as side-constraints (violating the Independence axiom or Pareto in some edge cases), Harsanyi's theorem simply tells you that you are inconsistent by its lights—not that you are wrong.

  ---

  ### Part 4: Hidden Assumptions (The "Question-Begging" Setup)

  Your instinct that the question-begging is in the setup is correct. Here are the three big ones the blog post ignores:

  **1. The "Fixed Population" Assumption**
  Harsanyi's theorem assumes a fixed set of individuals $i=1...n$. It does not handle population ethics. It cannot tell you how to weigh the utility of potential future people against existing people. If your AI alignment problem involves changing the number of humans (or digital minds), Harsanyi's theorem is silent. This is where the Repugnant Conclusion and related paradoxes live, and Harsanyi offers no shield there.

  **2. Preferences = Welfare**
  The theorem aggregates *preferences*. It assumes that satisfying a preference is good, regardless of whether that preference is adaptive, informed, or moral. If a group prefers a discriminatory outcome, and it satisfies VNM, Harsanyi's theorem says a Pareto-efficient society must move toward it (unless you add external moral constraints). This is "Preference Utilitarianism," which is a specific subset of utilitarian thought, not the whole of it.

  **3. Social Risk Neutrality (The "Representative Agent" Fallacy)**
  By requiring Society to satisfy VNM axioms (specifically Independence), the theorem forces the social planner to be risk-neutral over *distributions* of utility in a specific way.
  *   **Example:** Suppose we can give 10 utils to Person A for sure, or a 50% chance of 20 utils to Person A and 50% chance of 0. A VNM individual is indifferent. Harsanyi says Society must also be indifferent.
  *   **The Problem:** Many egalitarians argue Society should be *risk-averse* regarding inequality. They might prefer the sure 10 over the gamble, even if expected utility is the same, because the gamble risks leaving someone with nothing. Harsanyi's axioms rule out this kind of ex-post egalitarianism by fiat.

  ---

  ### Part 5: The AI Alignment Leap

  Your friend wants to argue: *"Any AI that aggregates human preferences is thereby committed to utilitarianism."*

  **This is a leap.** Here is exactly where it breaks, so you can point to it:

  1.  **The AI need not be a VNM Agent over Social States.**
      The AI can aggregate preferences without satisfying the **Independence of Irrelevant Alternatives** axiom at the social level. For example, the AI could use a voting rule (like Borda Count or Ranked Pairs) that respects Pareto but violates Independence. Harsanyi's theorem only applies if the AI is *constrained* to be VNM-rational in its social choices. Most alignment proposals do not impose this constraint; they impose constraints like "do not deceive" or "respect rights," which often violate VNM social rationality.

  2.  **Aggregation $\neq$ Maximization.**
      Even if the AI constructs a social welfare function $W = \sum a_i U_i$, it does not follow that the AI must *maximize* $W$ in all contexts. It could treat $W$ as one input among many (e.g., satisfying deontological constraints). Harsanyi proves the *form* of the function, not that the function is the sole objective.

  3.  **The Weights Problem.**
      As established, the theorem allows $a_i \neq a_j$. An AI could aggregate preferences using Harsanyi's framework but weight the preferences of children, or future generations, or sentient animals differently. That is technically "Weighted Utilitarianism," but it might violate the "uncontroversial impartiality" your friend assumes.

  **The Verdict for Your Group:**
  Harsanyi's theorem is a powerful **coherence check** for utilitarians. It shows that if you accept certain rationality and Pareto conditions, you cannot consistently be anything *other* than a (weighted) utilitarian.
  However, it is not a **derivation** of utilitarianism from neutral premises. It derives utilitarianism from *utilitarian-adjacent premises* (Social VNM, Pareto, Impartiality).

  For the AI argument: An AI is only committed to utilitarianism if it is explicitly designed to be a VNM-rational social planner that respects Pareto efficiency above all other constraints. Since most alignment researchers explicitly want to build in constraints (truthfulness, non-manipulation) that might violate Pareto or VNM rationality in edge cases, the theorem does not bind them.

  **Summary Sentence:** Harsanyi proves that Utilitarianism is the only *rationally consistent* way to aggregate preferences under risk, but only if you assume rationality and aggregation are the only things that matter.
