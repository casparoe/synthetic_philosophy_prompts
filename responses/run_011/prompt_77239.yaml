          *   *Objection:* *Xing* (nature) isn't just "what is there at birth." It's teleological. Mencius isn't saying we are *perfect* at birth, but that we have *sprouts* (*duan*). Xunzi isn't saying we are *evil* in a demonic sense, but that our spontaneous tendencies lead to conflict if unchecked. It's not just a "how much" question; it's a "what direction" question.
          *   *Defense:* Acknowledge the teleology but maintain that the *starting point* is crucial for the developmental trajectory.

      *   *Framing 2: Developmental Psychology as Adjudicator.*
          *   *Objection:* Category error. Ancient Chinese philosophy isn't modern science. "Good" and "Bad" aren't binary empirical states. Also, finding prosocial instincts doesn't prove Mencius right if Xunzi argues those instincts are weak compared to selfish desires.
          *   *Defense:* Frame it as a dialogue, not a verdict. The evidence challenges Xunzi's pessimism about *spontaneous* altruism but doesn't refute his claim about the necessity of cultivation.

      *   *Framing 3: Xunzi = Hobbes / Mencius = Hume-Kant.*
          *   *Objection:* Hobbes relies on a social contract/rational agreement. Xunzi relies on Sages creating ritual (*li*) to transform nature. Hobbes' sovereign is artificial; Xunzi's Sage is a moral exemplar. Mencius isn't Kant (duty); he's closer to Hume (sentiment), but the Kant comparison is shaky.
          *   *Defense:* Focus on the *problem* (state of nature vs. disorder) and the *solution* (external authority/structure), acknowledging the differences in mechanism.

      *   *Framing 4: Xunzi = Beating Down Appetite.*
