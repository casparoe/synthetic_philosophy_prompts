answer: |-
  The afternoon heat pressed against the thick walls of the bishop's study in Hippo, a weight as tangible as the scrolls stacked upon the cedar desk. Augustine sat with his head in his hands, the light from the high window cutting a pale shaft through the dust. When Consentius entered, wiping brow and neck with a linen cloth, the Bishop did not rise immediately.

  'Peace be with you, Consentius,' Augustine said, gesturing to the stool opposite. 'The air outside is a furnace. I pray your zeal has not overheated your judgement.'

  Consentius sat, leaning forward, his eyes bright with the urgency of a man who believes he holds a key to a locked door. 'Peace to you, Father. My judgement is cool enough, I trust. It is the state of the Church that burns. I come regarding the letter I sent. Regarding Fronto.'

  Augustine sighed, leaning back. 'The monk who infiltrated the Priscillianists. Yes. I have read your account. You admire him.'

  'I honour him,' Consentius corrected. 'He did what was necessary. He entered their circle, professed their errors regarding the nature of the soul and the stars, gained their confidence, and then exposed their secret rites to the magistrates. He saved the simple faithful from being poisoned by their wine and their doctrines. And you write to me that he sinned.'

  'I wrote that we must consider whether the means corrupt the end,' Augustine said softly. 'To speak against one's own mind is a lie. Fronto told them he believed what he knew to be false.'

  'He concealed the truth,' Consentius countered. 'Is every concealment a sin? If a murderer asks me where a Christian hides, and I say "I know not", though I do know, am I a liar? Or am I a guardian? You have conceded, Augustine, that we are not obliged to broadcast truth to those who would weaponise it. There is a lawful hiding of the truth.'

  'There is,' Augustine agreed, picking up a stylus and turning it over in his fingers. 'Silence is not falsehood. To withhold a thing is not to offer its opposite. When you say "I know not", you may mean "I know not *for you*". But Fronto did not remain silent. He affirmed. He said, "I believe as you believe." He joined his mind to theirs in speech, while his heart remained apart.'

  Consentius waved a hand, dismissing the distinction. 'This is a distinction of technique, not of moral kind. Consider the difference between a wall and a mask. A wall hides what is behind it; a mask presents a false face. But if the enemy is already inside the gates, wearing the mask of orthodoxy, is it not mercy to wear a mask of error to draw them out? The Priscillianists have raised dissimulation to a doctrine. They swear oaths to lie. They treat deception as a sacrament. To fight such men with naked truth is to stand unarmed against a dagger.'

  'To fight with a dagger is one thing,' Augustine said. 'To fight with poison is another. If I lie to a liar, I become a liar. I do not cure the disease by infecting myself. You argue that because the heretics misuse language, we are freed from the laws of language. I say the opposite. Because they corrupt the instrument of communion, we must be the more scrupulous in its use.'

  'But to what end?' Consentius pressed, his voice rising slightly. 'If your scruple allows them to continue corrupting souls? You speak of the instrument of communion. What is the tongue for, if not to join hearts? Fronto joined himself to them only to sever their hold on others. He used their own language to save the flock. Is the shepherd wrong to wear the wolf's skin to lead the wolf into the trap?'

  'The shepherd may risk his life,' Augustine said, his gaze steady. 'He may not risk his soul, nor the sanctity of the truth entrusted to him. When I speak, I call upon God to witness what is in my heart. If I speak what is not in my heart, I call God to witness a falsehood. It matters not if the intention is kind. The act itself severs the bond between the speaker and the Divine Truth. You say it is a technicality. I say it is the destruction of the very thing we seek to save.'

  Consentius leaned closer, the wood of the stool creaking. 'You speak of the bond between speaker and God. What of the bond between the shepherd and the sheep? You say Fronto's lie severs his bond with Truth. I say your refusal severs the bond of salvation between the Church and the perishing. Consider the arithmetic of it, Augustine. One man utters a falsehood he knows to be false. In return, fifty souls are kept from a heresy that damns them. You would have Fronto keep his hands clean while the children drown.'

  'I would have him trust that God can save the children without the father sinning,' Augustine replied, though a shadow passed over his face.

  'Is that trust, or is it pride?' Consentius asked. The question hung in the hot air. 'Forgive me, Father. But listen to what you propose. You allow concealment. You allow the silent refusal to answer. But you forbid the active falsehood. Why? Because the active falsehood is a clearer betrayal? But if the result is identical—the heretic is misled—then the moral difference lies only in your own interior state. You are prioritising the purity of the agent over the safety of the victim.'

  Augustine set the stylus down. 'It is not merely the agent's purity. It is the nature of the act. A lie is a sin against the nature of speech itself. If we permit it, even for charity, we admit that truth is subordinate to utility. If the Church adopts the policy that we may lie for the sake of the Gospel, then the Gospel becomes a thing of utility. And when the next crisis comes, and the next, where does it end? We become the Priscillianists we hunt.'

  'But they lie for destruction!' Consentius insisted. 'We would lie for construction! You treat all falsehoods as equal poison, regardless of the dose or the antidote. There is a lie of malice, and a lie of mercy. To tell a sick man he is well when he is dying is cruel. To tell a dying man he is well when it comforts his passing is... is it not a kindness? Fronto's lie was a surgery. It cut, yes, but to remove a tumour.'

  'A surgery that cuts the surgeon's own hand,' Augustine murmured. 'You argue that the moral kind is the same because the deception is the same. I argue the moral kind differs because the will differs. The liar who harms wills the deception for evil. The liar who helps wills the deception for good. But both will the deception. And in that willing, both turn away from the simple light of God. We cannot do evil that good may come. That is the Apostle's rule.'

  Consentius sat back, folding his arms. He looked out the window at the blazing sky, then back to the Bishop. 'Then let me land the blow, Augustine, and you must parry it if you can. You say we cannot do evil that good may come. But by refusing this stratagem, you are allowing an evil to happen that you could prevent. The heretics are ruining souls *now*. Every day Fronto spends in silence is a day the poison spreads. If you forbid the lie, you are not merely keeping your own hands clean. You are purchasing your own integrity at the cost of the souls the heretics are ruining. You treat purity of heart as the only good that may never be traded. Is your conscience more valuable than their salvation?'

  Augustine was silent for a long moment. The dust motes danced in the shaft of light between them. He looked old, suddenly, weighed down by the burden of the question.

  'You strike hard, Consentius,' Augustine said at last. 'You ask if I value my integrity above their salvation. I answer: I value God's law above my calculation of salvation. If I lie, I presume to know the outcome. I presume that the lie *will* save them, and that God *cannot* save them without my sin. That is a hubris greater than the error of the Priscillianists. But...' He paused, searching for the words. 'I feel the weight of your charge. To stand upon the rock of Truth while the waves wash over the little ones... it is a terrible station.'

  'It is a cowardly one,' Consentius said, not with malice, but with a sorrowful conviction. 'If I see a man walking toward a cliff in the dark, and I can shout a falsehood to turn him back—"There is a lion!"—and he turns and lives, but I have lied... God, who is Love, will He condemn me for the lie? Or will He condemn me if I watch him fall to keep my record spotless?'

  'God is Truth,' Augustine said, his voice low. 'He cannot deny Himself. If we use His gift of speech to weave falsehood, we fight against His nature. Perhaps the man falls. Perhaps he lives. But if I lie, I have already fallen. I have broken the bond. You say it is cowardice. I say it is the only courage left, to refuse the power of the enemy even when it seems the only weapon at hand.'

  'And if the price is the flock?' Consentius asked. 'If the wolf eats them because the shepherd refused to use the wolf's trap?'

  'Then we mourn,' Augustine said. 'And we pray. And we trust that God is not mocked by our honesty. But if we lie, we teach the faithful that truth is flexible. And once that lesson is learned, who will distinguish the orthodox lie from the heretical one?'

  Consentius stood up. The heat of the argument had not cooled, but the energy had shifted from attack to a grim stalemate. 'You speak of the lesson taught. I speak of the lives lost. We are both servants of the Church, Augustine. But you serve the Church as it is in Heaven, perfect and spotless. I serve the Church as it is on Earth, bleeding in the dust.'

  'I serve the Head of the Church,' Augustine corrected gently. 'And He is the Truth.'

  'And He is the Shepherd who leaves the ninety-nine,' Consentius replied. 'He goes into the dark to find the lost. Did He not wear the flesh of man, though He was God? Was that not a kind of disguise? A concealment of His glory to walk among us?'

  'A manifestation of humility, not a falsehood,' Augustine said. 'He did not say "I am a sinner" to walk with sinners. He bore our sins, but He did not speak them.'

  Consentius shook his head, a small, tight smile on his lips. 'We shall not agree today, Bishop. I go back to the brethren. I shall tell them you forbid the stratagem. Some will obey. Some, I fear, will decide that the danger is too great to heed you. They will lie for love of God, and pray you forgive them in Heaven, since you cannot on Earth.'

  Augustine rose slowly, leaning on the desk. 'Tell them I pray for them. And tell them... tell them I fear for them. Not because they love the truth less, but because they love the victory more.'

  'And I,' Consentius said, moving toward the door, 'fear for you, Father. Not because you love victory less, but because you fear the stain of the battle more than the death of the soldiers.'

  He paused at the threshold, the bright light of the corridor framing him. 'The hard case remains, Augustine. The wolf is at the door. You hold the key of Truth. I hold the sword of Necessity. May God judge which of us served Him best when the accounting comes.'

  'May He judge us both,' Augustine said, sinking back into his chair as the door closed. 'For we are both afraid.'

  He sat alone in the study, the heat rising around him, the scroll of Consentius's letter lying open on the desk, the argument unresolved, the weight of the souls unlifted.
