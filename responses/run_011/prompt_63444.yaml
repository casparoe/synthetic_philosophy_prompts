  4.  **Analyzing Cora's Inference in Move 1:**
      *   *Inference:* If I know $P$, then evidence for $\neg P$ is false/misleading. Therefore, I don't need to examine evidence for $\neg P$.
      *   *Validity:* Logically valid *if* "know" implies infallible truth (factive + immune to error). But in standard epistemology and engineering, "know" allows for fallibility.
      *   *What to give up:* She must give up the idea that her "knowledge" precludes the possibility of error. She needs to shift from "I know it is sound" to "I am highly justified in believing it is sound, but new evidence could alter that justification."
