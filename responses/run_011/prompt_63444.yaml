      *   *Assumption:* Cora assumes the article is "evidence." Elias assumes the article is "evidence." Actually, the article is a *claim* about evidence (maintenance records).
      *   *Better Question:* Should the committee review the maintenance records cited, regardless of Cora's inspection?

  7.  **Refining the Output:**
