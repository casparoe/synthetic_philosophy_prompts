  You mistake the purpose of the fire, my friend. The smith does not light the fire to destroy the metal, but to know its quality so he may forge it rightly. If a piece of alloy melts too soon, it was not the fire that ruined it, but its own nature that was unfit for the work intended. So too with the citizen. If a man cannot hold his tongue or his hands when the wine warms him, is it not better that this shame be seen by a sober leader who can restrain him, than that it be hidden until he commits a greater injustice in the dark? The law does not seek to ruin the weak, but to identify them so they may be guarded against their own weakness, lest they ruin the city.

  As for your fear of habit, you assume the cup is poured without measure. But the law commands a sober leader to govern the feast, doling out the wine like a physician dosing medicine. We do not repeat the error; we repeat the struggle against it. If a man fails again and again under such care, he is barred from the drink, not broken by it. The ruin you speak of comes from drinking without law, where pleasure becomes the master. Here, pleasure is the servant of education. If we never allow pleasure to loosen the tongue, how can you distinguish the man who is temperate by choice from the man who is sober only by lack of opportunity?
