prompt: |-
  I teach a required ethics module to second-year public-administration students, and a good chunk of them already work part-time in municipal offices, so many of them have personally arranged a "gift" for someone who could do them a favour. I have one ninety-minute session on where gift-giving stops being a social obligation and starts being corruption, and I need a plan for the session, not the content of it.

  Tell me what order the pieces have to go in and what depends on what — I suspect they need the idea that an office carries obligations the person holding it doesn't before anything else can land, but I want your view. Then: which single case carries the whole thing, and what that case has to have and not have. I'm torn between a wedding contribution from a contractor to the official who signed off his contract, and a small cash payment at a permit counter to move a file that's been sitting for months. Pick one for me and defend it.

  Relatedly, I have to hand them a defintion, and the rule-based one (it breaks a written rule of the office) and the function-based one (it damages what the institution is for) give different verdicts on the wedding case, and they'll notice. Commit to one and build the sequence around it.

  Then the misconceptions: I'm expecting "no money changed hands, so nothing happened", "everyone does it here, its just how things work", and "this is the West applying its standards to us". Say where in the sequence I head each off, and what I actually do with that third one — it's partly right and I'm not going to fake an answer.

  Finish with one question I can put to them at the end that shows whether they've got the distinction or are just agreeing with me, and tell me what to leave out and say out loud that I'm leaving it out. Don't hedge the plan: I'd rather you take a line on the hard case and be wrong than lay out the options for me to pick from. But do flag the one spot where you think your recommendation is most likely to come apart.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Audience:** 2nd-year Public Administration students (many working part-time in municipal offices).
      *   **Context:** They have personal experience with "gifts for favors."
      *   **Constraint:** One 90-minute session.
      *   **Goal:** Distinguish social obligation/gift-giving from corruption.
      *   **Specific Requirements:**
          *   Order of concepts (what depends on what).
          *   Select *one* core case (Wedding contribution vs. Permit cash) and defend it.
          *   Select *one* definition of corruption (Rule-based vs. Function-based) and build around it.
          *   Address three specific misconceptions ("No money," "Everyone does it," "Western standards"), specifically handling the third one honestly.
          *   Final assessment question (tests understanding, not agreement).
          *   Explicitly state what is *left out* and say it out loud.
          *   Flag the weakest point in the recommendation.
          *   **Tone:** Decisive, no hedging, pedagogical structure.

  2.  **Deconstruct the Pedagogical Challenge:**
      *   The students are practitioners, not just theorists. They live in the gray zone.
      *   If I start with abstract theory, they'll tune out.
      *   If I start with moralizing, they'll get defensive.
      *   The core tension is between *personal relationships* (social capital) and *public office* (institutional integrity).
      *   The user suspects "office carries obligations" must come first. I agree. You can't define corruption without defining the office.

  3.  **Decision 1: The Order of Concepts:**
      *   *Premise:* The user is right. You cannot discuss the *violation* (corruption) without defining the *duty* (office).
      *   *Sequence:*
          1.  Nature of Public Office (The Container).
          2.  The Definition of Corruption (The Breach).
          3.  The Case Study (The Application).
          4.  Misconceptions (The Pushback).
          5.  Assessment (The Check).
      *   *Why:* If you start with the case, they get bogged down in details ("But it was only $50!"). If you start with the definition, it's dry. Start with the *role*.

  4.  **Decision 2: The Core Case:**
      *   *Option A:* Wedding contribution from contractor to official.
      *   *Option B:* Cash at permit counter to move a file.
      *   *Analysis:* Option B is too easy. It's blatant bribery. Students will dismiss it as "obviously bad" and not engage with the nuance of their own lives. Option A (Wedding) is the "hard case." It looks like culture/social obligation but functions as corruption. It mirrors their actual experience ("arranging a gift").
      *   *Selection:* **The Wedding Contribution.**
      *   *Defense:* It forces them to confront the *timing* and the *relationship* rather than just the *act*. It blurs the line between social and professional, which is exactly where these students live.

  5.  **Decision 3: The Definition of Corruption:**
      *   *Option A:* Rule-based (Breaks written rule).
      *   *Option B:* Function-based (Damages institutional purpose).
      *   *Analysis:* Rule-based is fragile. Rules can be absent, outdated, or circumvented. Function-based gets at the *why*. The prompt notes they give different verdicts on the wedding case.
      *   *Selection:* **Function-based (Institutional Purpose).**
      *   *Reasoning:* Public Admin students need to understand *why* the rules exist. If the rule doesn't exist yet (common in developing contexts or gray areas), rule-based fails. Function-based survives the "no rule" argument. It aligns with the "Nature of Public Office" starting point.

  6.  **Decision 4: Addressing Misconceptions:**
      *   *Misconception 1:* "No money changed hands." -> Address early, during the Definition phase. Corruption is about *undue advantage*, not just cash.
      *   *Misconception 2:* "Everyone does it." -> Address during the Case Study. Normality $\neq$ Normativity.
      *   *Misconception 3:* "Western standards." -> This is the tricky one. It needs to be addressed *after* the Case Study but *before* the Conclusion. It requires acknowledging that *all* cultures distinguish between private gain and public duty, even if the mechanisms differ. Don't deny the cultural imposition risk; reframe it as universal institutional integrity.

  7.  **Decision 5: The Final Question:**
      *   Needs to test the distinction, not agreement.
      *   *Idea:* Ask them to identify a scenario that *looks* like corruption but isn't, or vice versa, based on the function.
      *   *Better Idea:* Ask them to apply the "Function Test" to a scenario where the rule is silent.
      *   *Selected Question:* "If the written rule allowed this gift, would it still be wrong? Why?" (Tests Function vs. Rule).

  8.  **Decision 6: What to Leave Out:**
      *   I need to cut something to fit 90 mins.
      *   *Cut:* The legal consequences/punishment aspect. This is an ethics module, not a law module. Focus on the *decision*, not the *penalty*.

  9.  **Decision 7: The Weakest Point:**
      *   Where will this plan fail?
      *   The "Function-based" definition relies on consensus about what the institution is *for*. In highly politicized or captured states, students might argue the institution *is* for patronage. This is the fracture point.

  10. **Drafting the Plan (incorporating the "No Hedging" constraint):**
      *   *Structure:*
          1.  Concept Order.
          2.  The Case (Wedding).
          3.  The Definition (Function).
          4.  Misconceptions (Timing & Handling).
          5.  Final Question.
          6.  Exclusions.
          7.  Weak Point.

      *   *Refining the "Western Standards" point:* I must be careful not to sound imperialistic. The argument should be: "Public office implies a trust that transcends culture. Private gain vs. Public duty is a universal tension, even if the specific gift norms vary."

      *   *Refining the Sequence:*
          1.  **The Office (20 mins):** Public vs. Private role.
          2.  **The Definition (20 mins):** Function-based corruption.
          3.  **The Case (30 mins):** The Wedding. Apply definition.
          4.  **Misconceptions (15 mins):** Weave them in or dedicated block? Dedicated block is safer for clarity. Let's put them as "Objections" after the case analysis.
          5.  **Conclusion/Question (5 mins).**

      *   *Wait, check the prompt:* "Say where in the sequence I head each off." Okay, I need to place them specifically.
      *   "No money": During Definition.
      *   "Everyone does it": During Case Analysis.
      *   "Western standards": During the wrap-up of the Case/Definition link.

      *   *Re-evaluating the Definition:* If I choose Function-based, I must explicitly tell them *why* Rule-based is being set aside for this session.

      *   *Re-evaluating the Case:* The Wedding case is definitely the right choice for this audience. It's the "social obligation" trap.

      *   *Final check on constraints:* "Don't hedge." "Commit." "Flag the weak spot."

      *(Self-Correction during drafting)*: Make sure the distinction between "Social Obligation" and "Corruption" is the through-line. The Wedding case is perfect because it *is* a social obligation, which makes the corruption charge harder to swallow. That's where the learning happens.

      *(Refining the "Western Standards" response)*: The prompt says "it's partly right and I'm not going to fake an answer." I need to acknowledge that *specific rules* are culturally contingent, but the *principle* of non-diversion of public resources is not.

      *(Refining the Final Question)*: "If the written rule allowed this gift, would it still be wrong?" is good. It forces the Function definition.

      *(Refining the Exclusion)*: I need to state clearly what I am *not* teaching. Legal penalties is a good candidate. Also, "how to report corruption" (whistleblowing) is a different module. Let's cut Whistleblowing/Reporting mechanisms.

      *(Refining the Weak Point)*: The weak point is if the students believe the *function* of the office *is* patronage. If they believe the institution exists to support their clan/family, the function-based argument collapses. I need to flag this.

  11. **Final Polish:** Ensure the tone is authoritative and instructional. Use bolding for clarity. Ensure all parts of the prompt are answered.

      *   *Order:* Office -> Definition -> Case -> Misconceptions.
      *   *Case:* Wedding.
      *   *Definition:* Function-based.
      *   *Misconceptions:* Placed strategically.
      *   *Question:* Function vs. Rule test.
      *   *Exclusion:* Legal sanctions/Whistleblowing.
      *   *Weak Point:* Contested institutional purpose.

