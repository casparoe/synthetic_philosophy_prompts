answer: |-
  Here is the plan. It is designed to be linear and cumulative. Do not rearrange the blocks; each one creates the necessary vocabulary for the next.

  ### 1. The Sequence of Concepts
  You are correct: **The Nature of the Office must come first.**

  If you start with the gift, you start with the *transaction*. If you start with the transaction, the students will debate the amount, the timing, and the intent. You will lose the room in nuance.

  **The Order:**
  1.  **The Office (20 mins):** Define public office not as a job, but as a trust. The official does not own the power; they rent it from the public. This establishes that there is a "third party" (the public) present in every interaction, even private ones.
  2.  **The Definition (20 mins):** Define corruption. (See Section 3 below).
  3.  **The Case (30 mins):** Apply the definition to the case. (See Section 2 below).
  4.  **The Misconceptions (15 mins):** Address the pushback using the vocabulary from steps 1–3.
  5.  **The Assessment (5 mins):** The final question.

  **Dependency:** You cannot define corruption (Step 2) until they accept that the office has independent obligations (Step 1). You cannot analyze the case (Step 3) until they have the definition (Step 2). You cannot address misconceptions (Step 4) until they have tried to apply the logic to the case (Step 3).

  ### 2. The Core Case: The Wedding Contribution
  **Pick:** The wedding contribution from the contractor to the official who signed off his contract.

  **Defense:**
  The permit counter cash payment is too easy. It is a stereotype. Your students will dismiss it as "real corruption" which doesn't apply to their "social gifting." It allows them to distance themselves from the lesson.

  The wedding case is the trap they actually walk into. It leverages *social capital*, which is valid in their personal lives, to bypass *institutional neutrality*, which is required in their professional lives. It forces them to argue against their own cultural instincts. It creates cognitive dissonance. That is where the learning happens.

  **What the case must have:**
  *   **Timing:** The gift happens *after* the contract is signed but *before* the final payment is released, or shortly after the contract is awarded. It must be ambiguous enough to be "thanks" rather than "payment."
  *   **Value:** It must be significant enough to matter (e.g., paying for the honeymoon or a major appliance), not just a token bottle of wine.
  *   **Public Knowledge:** Other staff know about it. This kills the "secret bribe" defense and forces the "social norm" defense.

  **What the case must NOT have:**
  *   **Explicit Quid Pro Quo:** No one can say, "I gave this to get the contract." If that exists, it's simple bribery, and the ethical distinction vanishes.
  *   **Financial Distress:** The official must not be portrayed as desperate. If they are desperate, the students will argue from sympathy rather than ethics.

  ### 3. The Definition: Function-Based
  **Commit:** Use the **Function-Based Definition** (Corruption is the abuse of public power for private gain that damages the institution's purpose).

  **Why:**
  The Rule-Based definition ("It breaks a written rule") will fail you. In many municipal contexts, rules are silent on weddings, or the rules are widely ignored. If you teach Rule-Based ethics, a smart student will say, "There is no rule against weddings," and they win. You lose.

  The Function-Based definition forces them to ask: *What is this office for?*
  *   **The Argument:** The office is for impartial service delivery.
  *   **The Breach:** The wedding gift creates a debt of gratitude. The official now hesitates to penalize the contractor for poor work because they don't want to offend the host. The *impartiality* is damaged, regardless of the written rule.

  **Instruction:** Explicitly tell them: "We are ignoring the rulebook for this hour. Even if the rulebook allows it, we are asking if the *office* allows it."

  ### 4. The Misconceptions: Placement and Handling

  **1. "No money changed hands, so nothing happened."**
  *   **Where:** During **Step 2 (The Definition)**.
  *   **How:** Pre-empt it. When defining "Private Gain," explicitly state: "Gain includes social capital, future favors, and debt cancellation. Money is just the easiest unit of measurement."
  *   **Action:** Do not wait for them to raise it. Kill it in the definition phase so it doesn't contaminate the case study.

  **2. "Everyone does it here, it's just how things work."**
  *   **Where:** During **Step 3 (The Case Analysis)**.
  *   **How:** When they argue normality, pivot to *systemic risk*.
  *   **Action:** Ask: "If *everyone* does it, what happens to the contractor who *doesn't* pay for weddings?" (Answer: They lose business). "So the system selects for corruption." This moves the argument from "my behavior" to "system design," which is less personal and more analytical.

  **3. "This is the West applying its standards to us."**
  *   **Where:** During **Step 4 (Misconceptions block)**, specifically as the final objection.
  *   **How:** Acknowledge the truth in it. Do not deny it.
  *   **The Script:** "You are partly right. Specific *rules* about gifts are cultural. In some cultures, refusing a gift is an insult. However, the *principle* of public trust is not Western. Every society distinguishes between the Chief's personal cattle and the Tribe's cattle. If you use the Tribe's cattle to buy a wedding gift for your daughter, the Tribe suffers. We are not debating 'Western' vs. 'Local' rules; we are debating whether the public resources (including the power to sign contracts) belong to you or the public."
  *   **Why this works:** It validates their cultural pride while holding the ethical line on resource diversion.

  ### 5. The Final Question
  Do not ask "Is this wrong?" They will just tell you what you want to hear.

  **Ask this:**
  > "Imagine the municipal code is updated tomorrow to explicitly allow officials to accept wedding gifts from contractors. Under the definition we used today, is accepting the gift still unethical? Why?"

  **What this tests:**
  *   If they say "No, it's legal now," they missed the point. They reverted to Rule-Based ethics.
  *   If they say "Yes, because it still creates a debt that compromises impartiality," they grasped the Function-Based definition.

  ### 6. What to Leave Out
  **The Exclusion:** **Legal Sanctions and Whistleblowing.**
  **Say this out loud:** "I am not teaching you what happens if you get caught, and I am not teaching you how to report a colleague. Those are legal and HR modules. Today is solely about how you make the decision before you open your wallet."

  **Why:** If you discuss punishment, they will focus on risk management ("How do I not get caught?") rather than ethics ("Should I do this?"). If you discuss whistleblowing, they will focus on loyalty conflicts. Keep the lens on *their* agency.

  ### 7. The Weak Point (Flag)
  **Where this plan breaks:**
  The Function-Based definition relies on a consensus about **what the institution is for.**

  Your plan assumes the students agree that the municipal office is *for* impartial service delivery. If you are teaching in a context where the prevailing political reality is that the office *is* for patronage and resource distribution to one's group (a "captured state"), the Function-Based argument collapses. They will argue, "The function of this office *is* to help my people."

  **Mitigation:** If this pushback arises, do not argue political theory. Pivot to **sustainability**: "If the office is only for your group, what happens when a different group takes power? Do you want them treating your group's resources the same way?" Use long-term self-interest to anchor the ethical argument if institutional purpose fails.
