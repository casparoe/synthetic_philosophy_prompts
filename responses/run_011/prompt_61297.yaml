answer: |-
  **Title:** The Taint of Office: Reconceptualizing Dirty Hands as Normative Status

  **Project Summary**
  The problem of "dirty hands" asks whether political agents may sometimes be morally required to do wrong. For forty years, the debate has stagnated around the phenomenology of the agent. Michael Walzer's canonical formulation argues that the decent politician is one who commits the necessary violation and accepts the burden of guilt. Deflationists respond that there is no paradox, only ordinary moral conflict or overridden obligations accompanied by agent-regret. Both sides treat the "residue" of dirty hands as a question of moral psychology: *How should the agent feel?*

  This dissertation argues that both positions answer a downstream question. The residue of dirty hands behaves less like guilt and more like a *status*. Drawing on the anthropology of purity and pollution and legal concepts of taint and civil disability, I propose that dirty hands constitute a normative status distinct from moral blameworthiness. This status is defined by three properties: it is **transferable** (shifting from the actor to the authorizer or beneficiary), **dischargeable** (removable through specific rituals like resignation or reparations), and **bearer-relative** (attaching to the office rather than the person). By reframing the residue as status, we can explain phenomena the guilt model cannot: why citizens feel complicit in acts they did not order, why successors inherit the burdens of founding violence, and why truth commissions function as cleansing rituals rather than courts of law.

  **Intervention: Beyond Guilt and Deflation**
  The current literature leaves the nature of the residue unresolved because it conflates moral culpability with normative standing. The Walzerian line insists on guilt as the marker of moral seriousness. However, guilt is private and non-transferable; it cannot explain why a legislature is tainted by a torture program it authorized but did not execute, nor why a successor regime must make reparations for crimes they did not commit. The deflationist response, which collapses dirty hands into standard moral dilemmas, fails to account for the specific institutional mechanisms we deploy to manage political wrongs. We do not merely apologize for dirty hands; we impeach, we pardon, we grant amnesty, or we establish truth commissions. These are technologies of status management, not moral psychology.

  Democratic theorists have gestured toward collective responsibility, suggesting the dirt belongs to the citizens. Yet they lack a mechanism for how individual moral guilt aggregates to a public status. My project fills this gap. If dirty hands are a form of pollution, the primary question is not "Is the agent guilty?" but "Who is contaminated, and how is the polity cleansed?" This shifts the inquiry from the ethics of action to the ontology of political office.

  **Methodology and Test Cases**
  I employ a conceptual analysis grounded in comparative case studies. To demonstrate the explanatory power of the status model, I apply it to three scenarios where the guilt model yields counterintuitive or insufficient results.

  1.  **The Authorized Torture Program:** In the standard "ticking bomb" case, the guilt model focuses on the interrogator. The status model focuses on the legal memo authorizing the act. *Diagnosis:* Under the guilt model, only the torturer bears residue. Under the status model, the legal framework itself becomes tainted, disqualifying the authors from future office regardless of their subjective guilt. The residue transfers from the hand to the law.
  2.  **The Foundational Lie:** Consider a leader who lies to secure a peace treaty that holds for generations. *Diagnosis:* The guilt model struggles with the successor who benefits from the lie. The status model identifies the office itself as bearing the taint, requiring public disclosure (discharge) by the successor to restore legitimacy, even if the successor is personally innocent.
  3.  **The Truth Commission:** Post-authoritarian regimes often choose truth-telling over prosecution. *Diagnosis:* The guilt model views this as a failure of justice. The status model views it as a successful discharge ritual. The goal is not punishing the guilty but restoring the civic status of the polity.

  In the first case, the difference is stark: the guilt model demands punishment of the agent; the status model demands the invalidation of the authorization. This predicts different institutional outcomes (criminal trial vs. legislative repeal).

  **Chapter Plan (Year 1)**
  *   **Chapter 1: The Genealogy of Guilt.** A critical reconstruction of the Walzerian debate and its deflationist critics. I will demonstrate that the fixation on "guilt" is a historical artifact of liberal individualism that obscures the public nature of political wrongs.
  *   **Chapter 2: A Theory of Normative Taint.** I will construct the status model, defining transferability, dischargeability, and bearer-relativity. I will distinguish this from "role morality," arguing that role morality dictates *action*, while status dictates *standing*.
  *   **Chapter 3: Transferability and Complicity.** Applying the model to the Authorized Torture Program. I will argue that transferability explains democratic complicity better than theories of collective intentionality.
  *   **Chapter 4: Discharge and Transitional Justice.** Analyzing Truth Commissions through the lens of dischargeability. I will argue that these institutions are misunderstood when judged by retributive standards.
  *   **Chapter 5: Bearer-Relativity and the Office.** Examining the Foundational Lie. I will explore the risks of this property, specifically the danger of detaching the office too completely from the person.

  **Significance and Objections**
  The primary objection to this project is that "status" is merely "anthropology cosplay"—a metaphorical redescription of role morality with no explanatory work. I commit to the position that this is false. A metaphor does not generate new predictions; a model does. The status model predicts that agents who feel no guilt (psychopaths or true believers) can still be "dirty" and require removal, whereas the guilt model struggles to condemn an agent who did the right thing and feels no regret. Conversely, an agent who feels immense guilt but acted within clean procedures should, under the status model, be considered "clean." This divergence proves the concept is not merely psychological.

  Furthermore, the status model resolves the "scope" problem. If dirty hands are moral guilt, they apply to anyone in a dilemma. If they are a status, they apply only to those holding specific normative standing. This restricts the concept to political theory, preventing its dilution into general ethics. The reframing earns its keep by offering a vocabulary for institutional repair that the language of guilt cannot provide. We do not "forgive" a tainted law; we repeal it. We do not "absolve" a corrupted office; we reform it. By treating dirty hands as a public status, we stop asking politicians to be martyrs and start asking institutions to be resilient.

  ***

  ### Advisor's Assessment (Straight Talk)

  **Does the reframing earn its keep?**
  Yes, but narrowly. You are right that the literature is obsessed with the agent's soul. Moving to *status* allows you to talk about institutions, which is where political theory should be. However, your friend's "anthropology cosplay" objection is dangerous if you lean too hard on the "pollution" metaphor. Do not talk about "uncleanness" unless you are explicitly analyzing the ritualistic aspects of transitional justice. Stick to "normative status" and "civil disability." That is legalistic and precise; "pollution" sounds mystical.

  **Which property carries the weight?**
  **Transferability.** This is your killer app. It explains why voters feel dirty, why legislatures are tainted by executive overreach, and why "plausible deniability" is a strategy to block transfer. If you can prove dirt moves, you break the Walzerian link between action and guilt.

  **Which property will collapse?**
  **Bearer-Relativity.** This is the riskiest. It sounds dangerously close to the "role morality" deflationists you want to critique. If you argue the *office* is dirty but the *person* is clean, you risk sounding like you are excusing the agent. You need to be very careful here: the status attaches to the *relationship* between person and office, not the office in the abstract.

  **Scope and Job Market Slice:**
  This is too big for a dissertation if you try to solve transitional justice *and* democratic complicity *and* the metaphysics of office.
  **The Slice:** Cut the Truth Commission chapter (Chapter 4) for the job market paper. Focus entirely on **Transferability**.
  **The Article:** "The Transferable Taint: Why Democratic Complicity is a Status, Not a Guilt." Use the Authorized Torture case. Argue that current theories of complicity fail because they look for causal contribution, whereas the "dirty hands" intuition is about status contamination. That is a tight, 8,000-word argument that intervenes directly in the Walzer/Deflationist debate without getting bogged down in the anthropology of ritual.

  **Final Verdict:** The angle is viable. It saves the "dirty hands" problem from being a psychological curiosity and makes it a structural problem of liberal democracy. Commit to the legal/status vocabulary over the anthropological one, and you will survive the defense.
