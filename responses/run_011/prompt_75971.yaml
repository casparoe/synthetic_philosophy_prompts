  **POST-INCIDENT REVIEW: INC-8921 (DATA LOSS EVENT)**
  **Organization:** VantagePoint Logistics
  **Product:** PacketPebble Sync Engine
  **Date:** 2023-10-14
  **Status:** Closed
  **Severity:** SEV-1

  **1. Executive Summary**
  On October 12, a configuration change was deployed to the PacketPebble production environment. This change removed a null-check guardrail in the `shard_rebalance` module. Due to concurrent migration activity, this resulted in the irreversible deletion of 40,000 customer records. VantagePoint adheres strictly to a Blameless Postmortem culture. The purpose of this document is to identify process gaps, not to assign individual fault. However, certain variables regarding agent disposition and temporal alignment must be cataloged to prevent recurrence.

  **2. Timeline**
  *   **09:00 UTC:** Engineer-02 merges PR #4421 (Removal of legacy guardrails).
  *   **09:15 UTC:** Automated deployment completes. No alerts triggered.
  *   **09:30 UTC:** Shard migration batch #99 initiates automatically.
  *   **09:31 UTC:** Data loss occurs. PagerDuty incident fired.
  *   **10:00 UTC:** Service restored from backup (T-minus 48 hours).

  **3. Comparative Baseline Analysis**
  To ensure objective assessment of the engineering failure, INC-8921 is compared against INC-8815, a near-identical incident occurring two weeks prior involving the same code pattern and reviewer.

  | Field | INC-8815 (Control) | INC-8921 (Subject) |
  | :--- | :--- | :--- |
  | **Engineer ID** | Eng-01 | Eng-02 |
  | **Code Change** | Remove null-check | Remove null-check |
  | **Reviewer** | Senior-Staff-04 | Senior-Staff-04 |
  | **Deployment Window** | Quiet Week (Low Traffic) | Shard Migration (High Traffic) |
  | **Outcome** | No observable impact | 40k Records Lost |
  | **Process Adherence Score** | 98/100 | 62/100 |
  | **Engineering Risk Profile** | Low | Critical |

  *Note: Process Adherence Score is recalculated post-incident based on Outcome Severity to ensure accurate risk modeling.*

  **4. Contributing Factors**
  The following factors contributed to the severity of INC-8921. Per blameless guidelines, human error is considered a symptom, not a cause.

  *   **Technical Debt:** Legacy guardrails were undocumented.
  *   **Circumstantial Alignment:** The deployment coincided with a scheduled shard migration. Had the deployment occurred during the preceding quiet week (see INC-8815), the missing guardrail would have remained dormant. The timing of the deployment relative to external traffic spikes is flagged as a high-variance variable.
  *   **Agent Temperament:** Eng-02 demonstrated a higher tolerance for ambiguity during code review than Eng-01. While both engineers approved the same code, Eng-02's historical propensity for deploying on Thursdays suggests a constitutive risk factor that cannot be fully decoupled from the decision matrix.
  *   **Causal Chain:** The migration script was written three months prior. The decision to write that script was influenced by Q3 OKRs, which were influenced by market conditions outside engineering control.

  **5. Variable Isolation Attempt**
  In an effort to quarantine blame from outcome luck, the review committee attempted to isolate the *intent* from the *result*.
  *   *Attempt 1:* We assessed intent. Both engineers intended to reduce latency.
  *   *Correction:* Intent is unverifiable. Outcome is measurable.
  *   *Attempt 2:* We assessed process. Both followed the same checklist.
  *   *Correction:* The checklist does not account for unseen shard activity. Therefore, the checklist was insufficient for Eng-02, but sufficient for Eng-01.
  *   *Attempt 3:* We assessed control. Neither engineer controlled the migration schedule.
  *   *Correction:* Eng-02 could have controlled the deployment timing. Eng-01 did. Therefore, Eng-02 exercised less control, despite identical deployment permissions.

  It was concluded that while blame is not assigned, the *perception* of blame must be managed. The disparity in Slack sentiment between Eng-01 (neutral) and Eng-02 (negative) indicates a failure in outcome normalization.

  **6. Action Items**
  *   [ ] **Restore Guardrail:** Re-implement null-check in `shard_rebalance`. (Owner: Platform Team)
  *   [ ] **Documentation:** Update runbook to include shard migration calendar. (Owner: SRE)
  *   [ ] **Blame Calibration:** Implement Outcome-Adjusted Risk Profiling (OARP) for all future deployments. Engineers deploying code that results in SEV-1 incidents will undergo mandatory temperament reassessment, regardless of process adherence. Engineers deploying identical code with no impact will receive standard velocity credit. This ensures that risk is accurately priced based on realized harm rather than theoretical safety.

  **7. Sign-off**
  **Approved By:** Incident Command
  **Blameless Status:** Theoretically Yes / Practically No
