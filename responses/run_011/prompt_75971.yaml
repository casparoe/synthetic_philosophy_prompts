      *   *Circumstantial Luck:* The situation you find yourself in (shard migration vs. quiet week).
      *   *Constitutive Luck:* Who you are (temperament, risk tolerance).
      *   *Causal Luck:* The chain of events leading up to the act.
      *   *Integration:* The postmortem tries to be blameless but keeps inserting these factors into "Root Cause" or "Contributing Factors" as if they are technical variables.

  3.  **Drafting - Section by Section:**

