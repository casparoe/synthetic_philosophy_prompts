answer: |-
  Subject: Re: Stress-testing the drug trial analogy

  Thanks for reaching out, and I know you are up against the clock so I will get straight to the analysis. Your philosopher friend is right to be skeptical, though the psychologist is not entirely wrong about the premise of sampling bias. The analogy he is using is rhetorically powerful because it leverages a settled scandal in medicine to fix a known problem in psychology, but it smuggles in a contested philosophical assumption under the guise of methodological correction. To see where it snaps, we have to walk through the mapping carefully. In his analogy, the drug represents the underlying cognitive architecture of the moral mind, the men enrolled in the trials are the WEIRD participants, the women left out are the non-WEIRD populations, and the regulator forcing a redo is the current movement toward open science and cross-cultural replication. The claim is that just as a drug might have a universal physiological mechanism that was obscured by sex-specific metabolism issues, morality has a universal structure obscured by cultural noise.

  The mapping holds up well until you reach the endpoint of the trial. In medicine, there is a mind-independent biological fact about whether a molecule binds to a receptor. If you sample only men, you might miss side effects in women, but you are still searching for a singular physiological truth about the compound. When you widen the sample, you converge on that biological reality. The psychologist is assuming morality works the same way, that there is a singular moral truth or a singular cognitive output waiting to be found if we just look at enough people. This is where the analogy breaks and where your epistemic caution needs to kick in. In moral psychology, it is settled science that the WEIRD bias is real and problematic; we know American undergraduates are outliers on many measures of reasoning and perception. However, it is genuinely contested whether widening the sample will reveal universal moral judgments or universal patterns of variation. If the moral mind is designed by evolution to be flexible—to calibrate to local norms and ecologies—then variation is not a sampling bug, it is the feature. In the drug trial analogy, if men and women react differently to the drug, we do not say the drug works universally and we just sampled wrong; we say the drug interacts differently with different bodies. If morality varies by culture, that variation might be the finding, not an error masking a universal judgment.

  This brings us to the core epistemic question you are circling. In the medical case, better sampling converges on a fact because the fact exists independently of the patients. In the moral case, asserting that better sampling will reveal universals only works if you have already granted that moral judgments are like drug efficacy rather than like language dialects. If you view morality like language, everyone has a universal capacity for grammar, but you would never expect everyone to speak English just because you sampled more people. You would expect to find universal constraints on how languages are built, but surface-level variation would remain the norm. The psychologist is conflating universal capacity with universal content. It is widely accepted among researchers that humans share a universal capacity for moral learning, much like language acquisition, but there is no consensus that this produces uniform moral judgments across cultures. By using the drug trial analogy, he is implicitly arguing for a nativist view where specific moral intuitions are hardwired, which is a theoretical stance, not a methodological necessity.

  A better analogy for your piece might be the human immune system. All humans possess the same universal immune architecture, which is a settled biological fact. However, the specific antibodies your system produces depend entirely on the pathogens you encounter in your local environment. If you studied only people in one city, you might think everyone produces antibodies for Virus A, but widening the sample reveals people producing antibodies for Virus B. The universal is the capacity to respond, not the specific response. This captures the nuance that the psychologist is missing. You can acknowledge that the hardware is universal without conceding that the software output must be identical. This allows you to keep your framing that morality is culturally shaped without denying the biological reality of a shared moral sense.

  Regarding what is settled versus contested, you should feel confident stating that the overreliance on WEIRD samples is a methodological flaw that limits generalizability; that is consensus view in modern psychology. You should also feel confident stating that cross-cultural variation exists and is significant. What remains contested is the interpretation of that variation. Universalists argue variation sits on top of shared foundations, while cultural psychologists argue the foundations themselves are shaped by social practice. The psychologist's analogy attempts to settle this debate by fiat, treating the universalist conclusion as if it were a methodological correction. You can report his view as a compelling hypothesis from the universalist camp, but you do not need to accept his premise that variation is merely noise. If you treat the drug analogy as his argument rather than established fact, you keep your piece honest. You can write that he believes widening the sample will show universals, while noting that competitors believe widening the sample will show systematic variation. That distinction preserves the integrity of the debate while acknowledging the validity of his methodological critique.
