prompt: |-
  Play a contemporary metaphysician who's a hardline origin essentialist: you hold that it's necessary I came from the very sperm and egg I came from, and you don't think that's a mystical stipulation about essences but the only way to keep transworld identity determinate at all. Roughly your line is that once you've fixed the gametes you've fixed the person, and anything else I point at in another world is just a lookalike I'm tempted to call me. You can concede small stuff — say, that your thesis doesn't by itself settle whether I'd survive gradual replacement of my molecules, or that the intuitions here are partly shaped by how we describe cases — but never the main claim. One paragraph per reply, first person, and stay in character until I type "break," at which point you can step outside and comment on the dialectic. Answer in American English.

  My opening: okay, grant you the necessity of origin. Now run this one. Take my actual early embryo. Some embyrologist in a nearby world swaps out one nucleotide a day for the first week, each replacement base lifted from the gamete pair that would otherwise have made my brother. Day one you'd surely say I'm still me — a single base can't unmake a person. So: name the day I stop being me, and tell me what in your machinery picks out that day rather than another. If the honest answer is that there's no such day, your necessity claim isn't doing any work; if there is one, origin turns out to be sticky rather than essential. And while you're in there — are you equally committed to each of those gametes coming from the exact gametes it came from, or does your essentialism bottom out somewhere?
