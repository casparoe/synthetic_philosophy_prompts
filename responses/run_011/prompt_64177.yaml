      *   **Audience:** 18 second-year students (likely Philosophy, Economics, or PPE).
      *   **Duration:** 75 minutes.
      *   **Goal:** An in-class activity where students *experience* a money pump before the term is defined.
      *   **Core Mechanism:** 3 committees of 6. Each committee split into 3 pairs (blocs) with cyclic preferences (A>B>C, B>C>A, C>A>B). Majority voting leads to switching A->B->C->A while paying a fee each time.
      *   **Specific Constraints:**
          *   No real money loss for individuals (group pool only).
          *   Self-running (instructor can't narrate all 3 tables simultaneously).
          *   Concrete options (A, B, C) not just letters.
          *   Calibration of tokens/pot.
          *   Timeline (minute-by-minute).
