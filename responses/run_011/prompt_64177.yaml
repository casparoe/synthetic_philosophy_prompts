answer: |-
  This is a strong sketch. It's a classic Condorcet cycle mapped onto a money pump, which is exactly the right pedagogical move for diachronic rationality. The core logic holds up: local rationality (majority rule at $t_1, t_2, t_3$) leads to global irrationality (resource loss).

  However, your TA is half-right and half-wrong, and the success of this seminar hinges on how you handle the "Commitment Rule" phase. If you run it as a game where the smart move is obvious, you lose the philosophical tension. If you run it so no one gets pumped, you lose the demo.

  Here is the build-out.

  ### 1. The Stakes and Calibration

  **The Stakes:** The "Committee Pot" represents the **Seminar Social Fund**.
  *   **Start:** 20 Tokens per table.
  *   **End Game:** Tokens are tallied across all three tables.
      *   If Total > 45: Pizza party for the whole class next week.
      *   If Total 30–45: Donuts.
      *   If Total < 30: Nothing (or just the instructor buying a single bag of cheap candy to share).
  *   **Why this works:** It satisfies your constraint (no individual loses money/grade). It creates group-level pressure (Table 1 resents Table 3 for blowing the budget). It is tangible but low-stakes enough that you won't have angry emails.

  **Calibration:**
  *   **Pot:** 20 Tokens.
  *   **Switch Cost:** 4 Tokens.
  *   **Commitment Rule Cost:** 6 Tokens.
  *   **Math:** A full pump cycle (3 switches) costs 12 tokens. The committee ends with 8.
  *   **If they buy the Rule:** They start with 14. They cannot be pumped. They end with 14.
  *   **The Tension:** 14 is better than 8. But to get pumped, they have to make three specific votes. If they suspect the trap, they won't vote to switch.
  *   **Verdict:** This calibration is tight. Losing 60% of the pot is painful enough to sting, but not so much that they feel cheated.

  ### 2. The Materials (Printable Text)

  You need three documents per table: **The Charter** (rules), **The Role Cards** (preferences), and **The Ledger** (tracking).

  #### Document A: The Committee Charter (One per table)
  > **DEPARTMENTAL BUDGET COMMITTEE**
  >
  > **GOAL:** Maximize the value of your remaining Token Pot. The total tokens remaining across all three tables determine the end-of-term celebration (Pizza, Donuts, or Nothing).
  >
  > **CURRENT STATUS:** You hold 20 Tokens. You currently hold **Policy A**.
  >
  > **PROCEDURE:**
  > 1.  **Commitment Phase:** Before any voting, you may vote to spend **6 Tokens** to adopt the *Unanimity Rule*.
  >     *   *Standard Rule:* Switching policies requires a Simple Majority (2 out of 3 blocs).
  >     *   *Unanimity Rule:* Switching policies requires Unanimity (3 out of 3 blocs).
  >     *   *Note:* If you adopt the Unanimity Rule, it cannot be revoked.
  > 2.  **Voting Rounds:** The Instructor will present 3 rounds of motions.
  >     *   Each motion offers a chance to switch your current Policy to a new Policy for a cost of **4 Tokens**.
  >     *   Vote according to your Bloc's preferences (see Role Cards).
  >     *   Record the result on the Ledger.
  > 3.  **End:** Count your remaining tokens.
  >
  > **CONFIDENTIALITY:** Do not show your Role Card to other blocs. You may talk, but you cannot prove your preferences.

  #### Document B: Role Cards (3 types, 2 copies of each per table)
  *Print these on colored paper (e.g., Red, Blue, Green) to distinguish blocs.*

  > **BLOC 1 (Red Card)**
  > You represent the **Faculty Senate**.
  > **Priorities:** Guest Speakers > Library Books > Tech Upgrades.
  > **Ranking:**
  > 1.  Policy A (High Speakers)
  > 2.  Policy B (Med Speakers)
  > 3.  Policy C (Low Speakers)
  > *Instruction:* Vote for the option higher on this list.

  > **BLOC 2 (Blue Card)**
  > You represent the **Student Union**.
  > **Priorities:** Library Books > Tech Upgrades > Guest Speakers.
  > **Ranking:**
  > 1.  Policy B (High Books)
  > 2.  Policy C (Med Books)
  > 3.  Policy A (Low Books)
  > *Instruction:* Vote for the option higher on this list.

  > **BLOC 3 (Green Card)**
  > You represent the **Admin Board**.
  > **Priorities:** Tech Upgrades > Guest Speakers > Library Books.
  > **Ranking:**
  > 1.  Policy C (High Tech)
  > 2.  Policy A (Med Tech)
  > 3.  Policy B (Low Tech)
  > *Instruction:* Vote for the option higher on this list.

  #### Document C: The Policy Ledger (One per table)
  > **ROUND 1**
  > Current Holding: **Policy A**
  > Motion: Switch to **Policy B** for 4 Tokens?
  > [ ] YES (Majority)  [ ] NO
  > Tokens Spent: ____  Remaining: ____
  >
  > **ROUND 2**
  > Current Holding: **Policy B**
  > Motion: Switch to **Policy C** for 4 Tokens?
  > [ ] YES (Majority)  [ ] NO
  > Tokens Spent: ____  Remaining: ____
  >
  > **ROUND 3**
  > Current Holding: **Policy C**
  > Motion: Switch to **Policy A** for 4 Tokens?
  > [ ] YES (Majority)  [ ] NO
  > Tokens Spent: ____  Remaining: ____

  ### 3. The Options (Concrete Descriptions)

  To make the cycle feel real, put this on the projector or the top of the Charter:

  *   **Policy A (The Speaker Series):** Heavy funding for visiting philosophers. Moderate tech. Low book budget.
  *   **Policy B (The Library First):** Heavy funding for new books. Moderate tech. Low speaker budget.
  *   **Policy C (The Digital Shift):** Heavy funding for laptops/software. Moderate books. Low speaker budget.

  *Why the cycle works:*
  *   **A vs B:** Faculty (A) + Admin (A has med tech vs B low tech) > Student (B). **A wins.**
  *   **B vs C:** Student (B) + Faculty (B has med speakers vs C low) > Admin (C). **B wins.**
  *   **C vs A:** Admin (C) + Student (C has med books vs A low) > Faculty (A). **C wins.**

  ### 4. Minute-by-Minute Timeline (75 Minutes)

  *   **00–10: Setup & Seating.**
      *   Students sit at 3 tables (6 per table).
      *   Hand out materials face down.
      *   **Crucial:** Tell them *not* to look at Role Cards yet.
  *   **10–15: The Pitch.**
      *   Explain the Social Fund stakes (Pizza vs. Donuts).
      *   Explain they are a Committee making sequential budget decisions.
      *   Emphasize: "You must vote according to your Role Card priorities. You are representatives, not yourself."
  *   **15–20: Role Reveal & Commitment Phase.**
      *   Students read Role Cards.
      *   **The Decision:** They have 3 minutes to decide whether to spend 6 Tokens on the *Unanimity Rule*.
      *   *Instructor Note:* Do not help them. If they ask "Is it worth it?", say "That is a strategic decision for the committee."
  *   **20–35: The Voting Rounds (Self-Run).**
      *   Project or announce Round 1 Motion: "Move A to B? Cost 4."
      *   Tables vote, record, tally. (5 mins)
      *   Round 2 Motion: "Move B to C? Cost 4." (5 mins)
      *   Round 3 Motion: "Move C to A? Cost 4." (5 mins)
      *   *Instructor Note:* Circulate. If a table stalls, remind them "Majority rules. If 2 blocs want to switch, the switch happens."
  *   **35–45: The Reveal.**
      *   Tables count remaining tokens.
      *   Ask each table to announce their final total.
      *   Write totals on the board. (Likely two tables will have ~8 tokens, one might have 14 if they bought the rule, or 20 if they refused to switch).
  *   **45–75: The Debrief.** (See below).

  ### 5. The Debrief (Mapping Game to Theory)

  Do not lecture. Ask questions that force them to reconstruct the argument.

  **Phase 1: The Loss (5 mins)**
  *   "Table 1, you ended with 8 tokens. You started with 20. Where did the 12 go?"
  *   "Did anyone at Table 1 vote *irrationally* in any single round?" (Answer: No. They voted for their preferred option each time).
  *   "So how did rational votes lead to a disastrous outcome?"

  **Phase 2: The Cycle (10 mins)**
  *   "Reveal your Role Cards to each other now." (Let them gasp at the cycle).
  *   "Does this committee have a coherent preference? If A > B, and B > C, what should C be compared to A?"
  *   **Key Concept:** *Transitivity.* The committee's aggregated preference is intransitive, even if every individual member is transitive.

  **Phase 3: Diachronic Agency (10 mins)**
  *   "Look at the tables that bought the Unanimity Rule. You spent 6 tokens to save 12. Was that rational?"
  *   "Look at the tables that didn't. Could you have known?"
  *   **The Pivot:** "Who is the 'agent' here? Is it the Committee at Time 1? Or the Committee as a whole over Time 1-3?"
  *   **The TA's Objection (Addressed):** "My TA thinks buying the rule ruins the lesson. He says if you can just buy a commitment device, cyclic preferences aren't a problem. Do you agree?"
      *   *Desired Outcome:* Students should realize that buying the rule *admits* the problem. It acknowledges that their future selves cannot be trusted to act in their current interest. It proves the pump is a threat to *agency*, not just wallet.

  ### 6. Troubleshooting: What Will Go Wrong

  **Problem 1: The "Suspicious Refusal"**
  *   *Scenario:* In Round 1, a student says "This feels like a trap. Let's not switch." The vote fails. The pump is broken.
  *   *Fix:* You cannot force them. But you can frame the motion positively. "Motion: Upgrade to Policy B." If they refuse, **use it in the debrief.** "Table 2 survived. Why? Because they suspected dynamic inconsistency. That is actually a form of diachronic rationality!"
  *   *Prevention:* In the instructions, add: "Note: Policies B and C offer genuine improvements to specific blocs over the current holding."

  **Problem 2: Confusion on Voting Rules**
  *   *Scenario:* They think they need 4 votes (individuals) not 2 votes (blocs).
  *   *Fix:* The Charter says "2 out of 3 blocs." Circulate in the first 2 minutes of voting to ensure they understand the *bloc* is the voter.

  **Problem 3: The "Rigged" Objection**
  *   *Scenario:* A sharp student says, "This is fake. We don't actually care about Tech vs. Books. You forced these preferences on us."
  *   *Response:* "You are right. The preferences are stipulated. But the *logic* isn't. If your preferences *were* like this, would you be rational? We are testing the structure of rationality, not the sincerity of your desire for laptops."

  ### 7. Addressing Your Specific Questions

  **1. Should buying the rule be clearly right or only in hindsight?**
  It must be **ambiguous beforehand**.
  *   If it's clearly right (e.g., Cost 1, Saves 12), everyone buys it. No one gets pumped. The demo fails.
  *   If it's clearly wrong (e.g., Cost 15), no one buys it. Everyone gets pumped. The demo works, but the discussion on commitment is shallow.
  *   **Current Calibration (Cost 6):** It costs 30% of the pot. It's a "tax on caution." Some tables will gamble (hoping the cycle won't complete or that they'll stop halfway). Some will insure. This variance gives you the best debrief material ("Why did Table 1 insure and Table 3 gamble?").

  **2. Is my TA right about cutting the Commitment Rule?**
  **No, he is wrong for *this* topic.**
  *   **TA's Logic:** If the goal is to prove Transitivity is a requirement of Rationality, then commitment devices are a cheat code. They allow you to keep intransitive preferences without penalty, weakening the "Money Pump Argument" against intransitivity.
  *   **Your Logic:** Your topic is **Diachronic Rationality**. The Money Pump is not just about preferences; it's about *temporal agency*. The ability (or inability) to bind your future self is the core philosophical problem here (think Ulysses and the Sirens).
  *   **How to make both halves pull weight:**
      *   Run the pump *first*. Let them lose the tokens.
      *   Then ask: "Could you have stopped this?"
      *   Then introduce the Commitment Rule as a *counterfactual* or a *second pass*.
      *   *Wait, your sketch has them buy the rule BEFORE round 1.* This is riskier for the demo but better for the "choice over time" feel.
      *   **Compromise:** Keep the rule purchase *before* Round 1 (as planned). In the debrief, if a table *didn't* buy it and got pumped, ask: "You were irrational at t1 (didn't buy insurance), rational at t2/t3 (voted preferences). Which 'you' is the real agent?" This hits the diachronic sweet spot.

  **3. What feature can't the activity reproduce?**
  **Genuine Endogenous Preferences.**
  *   As noted, the preferences are dealt on cards. A sharp student will say, "I'm not really irrational, you just made me play a role."
  *   **Defuse:** Acknowledge it openly. "This is a simulation of *structural* irrationality. In the real world, your preferences might cycle over time (e.g., dieting, addiction, procrastination) without anyone dealing you cards. This game is the skeleton; real life adds the flesh."
  *   **The Real Gap:** The game cannot reproduce the *psychological feeling* of preference reversal. In the game, Bloc 1 always prefers A>B. In real diachronic irrationality (like akrasia), *I* prefer Diet today, but *I* prefer Cake tomorrow. The game simulates a *committee* (social choice), not a *single mind* (individual choice).
  *   **Instructor Duty:** You must explicitly bridge this gap in the debrief. "We used a committee to simulate the different 'selves' you have at different times. Your 'Tuesday Self' wants to work; your 'Friday Self' wants to party. If they vote by majority without a commitment rule, you get pumped."

  ### 8. Instructor Cheat Sheet (For your pocket)

  *   **If everyone buys the rule:** "Okay, no one lost tokens. But imagine Table 4 didn't buy it. Here's what would have happened..." (Walk through the math).
  *   **If no one gets pumped (refusal to switch):** "You avoided the loss by stalling. That's a form of commitment! You committed to the status quo. Why was that rational?"
  *   **If they argue the preferences are fake:** "Imagine you're choosing between three jobs. Job A (High Pay, Long Hours), Job B (Med Pay, Med Hours), Job C (Low Pay, Short Hours). Your mood changes which you prefer. The structure is the same."
  *   **The Punchline:** "Rationality isn't just about making the right choice now. It's about making the right choice *for the sequence*. If you can't bind your future votes, you aren't an agent; you're a battlefield."

  This plan keeps the stakes safe, the mechanics self-running, and the philosophy front-and-center. Good luck.
