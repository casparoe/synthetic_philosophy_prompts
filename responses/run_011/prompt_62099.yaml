prompt: |-
  For several years I have allocated a fixed annual giving budget — and a modest amount of my own working time — under something like the evidential standards associated with effective altruism, while remaining substantially persuaded by the standard criticisms of those standards: that requiring strong evidence systematically favors whatever happens to have been measured, and that the same methodology which surfaces tractable wins also filters out the political and structural causes of the problems being treated. I am not asking for a defense or a refutation of effective altruism. I want to know whether my own case-by-case verdicts add up to a principle, and if they do not, which of them I should abandon.

  Here they are, stated as concretely as I can.

  1. A program distributing a well-studied preventive health commodity, with a cost-per-death-averted figure I trust to within a factor of two, versus a campaign to persuade one national ministry to adopt a clinical protocol whose adoption would, on my own estimate, do perhaps thirty times as much good, but whose probability of success and whose attribution I cannot estimate within an order of magnitude. I fund the first. I think this is the right call and simultaneously think it is partly an artifact of what has been studied.

  2. The same campaign, now run by a group that has pre-registered its theory of change, published its forecasts with their calibration record, and submitted to third-party audit of its attribution reasoning. I fund this one, and more generously than case 1. Nothing about the intervention itself changed.

  3. An education program whose outcome is captured by test scores, versus a transfer program whose outcome includes the absence of a documented humiliating procedure — queuing, means-testing, public verification of poverty. I believe the second produces more of what actually matters per unit of money and that I cannot measure it. I still do not fund it. I think my refusal is defensible but not clearly correct.

  4. On earning to give: a friend who takes a lucrative trading position that would otherwise have gone to someone who would have donated nothing, and who donates forty percent of it — clearly creditworthy. The same friend taking a staff role at an assistance organization that would otherwise have gone to someone equally competent and equally committed — no credit, and perhaps a small negative. And a third version: the role is in a fast-growing research area, the seat would have gone to someone equally committed, but my friend is meaningfully better at the work — I award credit here, which I recognize sits badly with the second version.

  5. I give to a municipal food pantry with essentially no evidence about its effects and feel no tension about it; I would refuse a global health program of exactly the same evidential standing. The difference in scale between them is enormous, and yet both verdicts feel right to me.

  6. A program with a strong trial whose measured effect decayed to nothing within four years of the trial's end, versus a program with a weak trial whose gains appear durable. I prefer the durable one, even though the evidence for it is worse. So it is not evidential strength as such that I am tracking.

  7. An intervention against loneliness among elderly people, evaluated in life-satisfaction reports, where I know the instrument partly records recalibrated expectations rather than change in condition. I have gone back and forth on this one for a year.

  8. I think it is good to fund the study of an intervention that has not been measured — but only where the intervention is already independently plausible, and I cannot state what "plausible" means here without circularity.

  Is there a principle, ideally separable into a rule for ranking options and a rule for setting the evidential threshold, that delivers all or most of these verdicts? Please state it precisely, indicate which case motivates each of its clauses, and tell me what it implies for questions I have not listed — in particular whether some share of a budget should go to reducing one's own ignorance rather than to acting on the ignorance one has, and whether the principle licenses a two-tier allocation in which unmeasurable goods receive a smaller but protected share. Then tell me plainly which of the eight it cannot accommodate, and press hardest on 4 and 7, the two I keep reopening. If you need a technical term, define it where you use it; do not send me citations or a reading list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Experienced donor, familiar with Effective Altruism (EA) concepts (cost-effectiveness, attribution, earning to give, counterfactuals), but critical of its limitations (measurement bias, structural blindness). They have a fixed budget and time allocation.
      *   **Goal:** They want to know if their 8 specific case-by-case verdicts cohere into a consistent principle. If not, they want to know which verdict to abandon.
      *   **Constraints:** No defense/refutation of EA. State the principle precisely (ranking rule + evidential threshold). Indicate which case motivates which clause. Address unlisted questions (research vs. action, two-tier allocation). Identify which cases don't fit. Press hardest on cases 4 and 7. Define technical terms. No citations/reading lists.
      *   **Tone:** Analytical, precise, philosophical but practical, respectful of the user's sophistication.

  2.  **Analyze the 8 Cases:**
      *   *Case 1:* Proven health commodity (high certainty, lower EV) vs. Policy advocacy (low certainty, higher EV). *Verdict:* Fund commodity. *Reason:* Uncertainty penalty outweighs EV potential.
      *   *Case 2:* Same policy advocacy, but with pre-registration/audits/transparency. *Verdict:* Fund this, more generously. *Reason:* Process quality increases trust in the unquantifiable.
      *   *Case 3:* Education (test scores) vs. Cash/Dignity (humiliation avoided). *Verdict:* Fund Education (measurable) despite believing Dignity is better. *Reason:* Measurement constraint overrides belief.
      *   *Case 4 (Earning to Give):* Trading (donates 40%) = Credit. Non-profit staff (replaceable) = No Credit/Negative. Non-profit staff (unique talent) = Credit. *Reason:* Counterfactual impact matters more than the act itself.
      *   *Case 5:* Local food pantry (no evidence) = Fund. Global health (no evidence) = Refuse. *Reason:* Scale/Context changes the evidential burden. Local = solidarity/community; Global = efficiency required.
      *   *Case 6:* Strong trial (decay) vs. Weak trial (durable). *Verdict:* Fund durable. *Reason:* Durability/Long-termism trumps initial statistical strength.
      *   *Case 7:* Loneliness (life-satisfaction reports). *Verdict:* Ambivalent. *Reason:* Metric validity issue (adaptation/recalibration).
      *   *Case 8:* Funding study of unmeasured intervention. *Verdict:* Fund if "plausible." *Reason:* Value of information, conditional on prior plausibility.

  3.  **Synthesize a Principle:**
      *   The user isn't a pure EA (maximize EV regardless of uncertainty) nor a pure intuitionist (fund what feels right).
      *   They seem to operate on a *Context-Dependent Evidential Threshold* combined with *Counterfactual Robustness*.
      *   *Core Idea:* Maximize Expected Value (EV), but discount EV heavily based on *Epistemic Risk* (uncertainty about the model), unless *Process Signals* or *Contextual Proximity* mitigate that risk.
      *   *Proposed Principle:* **Robust Counterfactual Expectation with Contextual Epistemic Discounting.**
      *   *Ranking Rule:* Rank by (Estimated Impact $\times$ Confidence Factor) / Cost.
      *   *Confidence Factor:* Determined by evidence quality, *plus* process transparency, *plus* contextual proximity, *minus* replacement risk.
      *   *Threshold Rule:* The required Confidence Factor scales with the distance (geographic/social) between donor and beneficiary.

  4.  **Drafting the Principle (Iterative Refinement):**
      *   *Attempt 1:* Fund what works best, but only if you can prove it, unless it's local. (Too simple).
      *   *Attempt 2:* Maximize robust good. Robustness comes from evidence or transparency. Local stuff gets a pass on evidence. (Better).
      *   *Attempt 3 (Formalizing):* Let's call it **Principled Pluralism with Epistemic Scaling**.
      *   *Rule 1 (Valuation):* Value = (Magnitude of Good $\times$ Probability of Success) $\times$ Durability Weight.
      *   *Rule 2 (Epistemic Discount):* Apply a discount to Probability of Success based on measurement quality, *unless* mitigated by Process Transparency (Case 2) or Proximity (Case 5).
      *   *Rule 3 (Counterfactuals):* Personal credit is assigned only to marginal contribution, not replacement (Case 4).
      *   *Rule 4 (Research):* Fund research if it reduces uncertainty on high-potential plausible interventions (Case 8).

      *Refining for the User's specific tension:* The user admits Case 3 (Dignity) is *better* but doesn't fund it. This suggests a hard constraint: **Measurability is a gatekeeper for distant aid, but not for local aid.**
      *   Let's try to capture the "Measurement as Gatekeeper" vs. "Process as Proxy" dynamic.
      *   *Principle Name:* **The Proximity-Weighted Evidential Threshold.**
      *   *Core:* The burden of proof scales with the social/geographic distance between donor and recipient.
      *   *Clause A (Distant Aid):* Requires quantitative evidence OR high-fidelity process transparency (Cases 1, 2, 5-Global).
      *   *Clause B (Local Aid):* Requires only qualitative plausibility + community alignment (Case 5-Local).
      *   *Clause C (Counterfactuals):* Credit is assigned to marginal impact, not occupancy (Case 4).
      *   *Clause D (Durability):* Long-term outcomes trump short-term statistical significance (Case 6).
      *   *Clause E (Metric Validity):* Metrics must map to welfare, not just adaptation (Case 7).

  5.  **Addressing the Unlisted Questions:**
      *   *Reducing Ignorance (Research):* Yes, under Case 8 logic. If "plausible," funding measurement is high EV because it lowers the discount rate for future funding.
      *   *Two-Tier Allocation:* Yes. A "Core" bucket (high evidence/distant) and a "Venture/Solidarity" bucket (low evidence/local/structural). This accommodates the tension in Case 3.

  6.  **Identifying Inconsistencies (The "Cannot Accommodate" section):**
      *   *Case 3 is the weak link.* If Dignity is truly believed to be "more of what actually matters," funding the measurable inferior option violates the core moral aim. The principle explains *why* you do it (risk aversion), but it contradicts the moral premise.
      *   *Case 7 is the philosophical hard spot.* Adaptation vs. Condition.
      *   *Case 4 needs pressure.* The distinction between "trading" and "staff" relies on a specific model of labor markets that might be fragile.

  7.  **Pressing on Case 4 and 7:**
      *   *Case 4:* The "replacement" argument assumes a liquid labor market. If the non-profit role is hard to fill, the "replacement" assumption is wrong. Also, the "trading" role has negative externalities potentially.
      *   *Case 7:* Life satisfaction vs. Objective Condition. If the elderly adapt, is their suffering real? If you fund based on reports, are you funding delusion?

  8.  **Finalizing the Structure:**
      *   **The Principle:** Define it clearly (The Scaled Epistemic Threshold).
      *   **Mapping:** Link clauses to Cases 1-8.
      *   **Implications:** Research budget & Two-Tier allocation.
      *   **Failures:** Where the principle breaks (Case 3 primarily).
      *   **The Pressure:** Deep dive on 4 and 7.

  9.  **Refining the Wording:**
      *   Ensure technical terms (Counterfactual, Epistemic Discount, Marginal Impact) are defined in context.
      *   Keep it dense but readable.
      *   Avoid EA jargon where possible, or define it (e.g., instead of "Shapley value," use "marginal contribution").
      *   *Self-Correction on Case 3:* The user says "I still do not fund it." The principle must explain this as a *procedural* constraint, not a *moral* one. The principle is "Maximize Robust Good," not "Maximize Good."
      *   *Self-Correction on Case 5:* Why is local different? Because feedback loops are tighter. You can *see* if the pantry fails. You can't see if the global health program fails. This is "Observability," not just "Proximity."

  10. **Final Polish:** Check against all constraints. (No citations, define terms, press on 4 & 7, etc.)

  *(Self-Correction during drafting)*: I need to make sure I don't just validate the user. I need to tell them where their logic fails. Case 3 is the biggest failure point. If they believe B > A, but fund A because A is measurable, they are optimizing for *their own comfort*, not the *good*. I need to point this out sharply.

  Let's construct the principle: **Contextualized Robust Expectation.**
  1.  **Maximize Expected Robust Value:** Value $\times$ Probability $\times$ Robustness Factor.
  2.  **Robustness Factor:** Determined by Evidence Quality OR Process Transparency OR Observability.
  3.  **Observability Threshold:** Scales with Distance (Case 5).
  4.  **Counterfactual Constraint:** Credit only for marginal addition (Case 4).
  5.  **Durability Override:** Long-term > Short-term statistical strength (Case 6).

  Okay, ready to write.
answer: |-
  Here is a principle constructed to accommodate your verdicts, followed by an analysis of its implications, its failures, and a targeted critique of your unresolved cases.

  ### The Principle: Contextualized Robust Expectation

  **Definition:** Allocate resources to maximize the *Robust Expected Value* (REV) of the intervention. REV is calculated as the product of the *Magnitude of Good*, the *Probability of Success*, and a *Robustness Coefficient*.

  **Rule 1: The Ranking Function**
  $$ \text{REV} = (\text{Magnitude} \times \text{Probability}) \times \text{Robustness Coefficient} $$
  *   **Magnitude:** The estimated scale of the benefit (e.g., lives saved, dignity preserved).
  *   **Probability:** The likelihood the intervention achieves its stated goal.
  *   **Robustness Coefficient (0.0 to 1.0):** A discount factor applied to the expected value based on the quality of the epistemic foundation.

  **Rule 2: The Evidential Threshold (The Scaling Clause)**
  The required Robustness Coefficient scales inversely with **Observability**.
  *   **High Distance / Low Observability:** For interventions where you cannot directly observe outcomes or feedback loops (e.g., global health, foreign policy), the Robustness Coefficient must be derived from *Quantitative Evidence* (RCTs, cost-effectiveness analysis) or *Process Transparency* (pre-registration, audit).
  *   **Low Distance / High Observability:** For interventions where feedback loops are tight and outcomes are socially visible (e.g., municipal pantry), the Robustness Coefficient may be derived from *Qualitative Plausibility* and *Community Endorsement*.

  **Rule 3: The Counterfactual Constraint**
  Credit for "doing good" is assigned only to the *Marginal Contribution*. If an action (e.g., taking a job) would have been performed by a substitute agent with similar outcomes, the Marginal Contribution is zero. Credit is assigned only where the agent's specific involvement changes the outcome.

  **Rule 4: The Durability Override**
  Where evidence conflicts, *Temporal Durability* of the outcome outweighs *Statistical Strength* of the initial measurement. A weaker signal of a permanent gain is preferred over a strong signal of a transient gain.

  ---

  ### Mapping Your Cases to the Principle

  *   **Case 1 (Health Commodity vs. Policy):** Motivated by **Rule 2**. The policy has higher Magnitude but a near-zero Robustness Coefficient due to lack of attribution data. The commodity has a high Coefficient. The REV of the commodity wins.
  *   **Case 2 (Audited Policy):** Motivated by **Rule 2**. Process Transparency (audit, pre-registration) artificially inflates the Robustness Coefficient of the unquantifiable, allowing the higher Magnitude to dominate the calculation.
  *   **Case 3 (Test Scores vs. Dignity):** Motivated by **Rule 2**. You believe Dignity has higher Magnitude, but because it is "distant" (structural/global) and unmeasurable, its Robustness Coefficient is discounted to near zero. Test scores, being measurable, retain a high Coefficient.
  *   **Case 4 (Earning to Give):** Motivated by **Rule 3**. The trading role creates new surplus (Marginal Contribution > 0). The replaceable staff role creates no surplus (Marginal Contribution ≈ 0). The unique-talent staff role creates surplus via higher competence (Marginal Contribution > 0).
  *   **Case 5 (Local Pantry vs. Global Health):** Motivated by **Rule 2 (Scaling Clause)**. The pantry is High Observability; the evidential threshold is lower. The global program is Low Observability; the threshold is higher. Same evidence, different verdicts based on context.
  *   **Case 6 (Decay vs. Durable):** Motivated by **Rule 4**. Durability overrides the initial statistical strength of the trial.
  *   **Case 7 (Loneliness/Adaptation):** Motivated by the definition of **Magnitude**. You are uncertain if the "Life Satisfaction" metric accurately captures Magnitude or merely records recalibrated expectations.
  *   **Case 8 (Funding Study):** Motivated by **Rule 1 & 2**. Funding research increases the Robustness Coefficient of future interventions. It is funded if the intervention is "plausible" (non-zero prior Probability) and currently blocked by low Robustness.

  ---

  ### Implications for Unlisted Questions

  **1. Should a share of the budget go to reducing ignorance (research)?**
  **Yes.** Under Rule 1 and Case 8, funding research is an investment in the *Robustness Coefficient* of future allocations. If a class of interventions is high-Magnitude but currently low-Robustness (due to lack of measurement), funding the measurement increases the REV of that entire class.
  *   *Constraint:* You should only fund research on interventions that are independently "plausible." Do not fund research on interventions that are theoretically incoherent, regardless of the measurement gap.

  **2. Does the principle license a two-tier allocation?**
  **Yes.** Rule 2 explicitly creates two tiers based on Observability.
  *   **Tier 1 (The Core):** High-distance interventions requiring high Robustness Coefficients (quantitative evidence or audited process). This protects against wasting resources on ineffective distant aid.
  *   **Tier 2 (The Venture/Solidarity):** Low-distance or structural interventions where Observability is high or moral intuition is strong, allowing for lower Robustness Coefficients.
  *   *Allocation:* The principle suggests a fixed split (e.g., 80/20). The 20% "Venture" tier allows you to fund Case 3 (Dignity) or Case 5 (Pantry) without violating the strict evidential standards required for the 80% "Core" tier.

  ---

  ### Where the Principle Fails

  The principle cannot accommodate **Case 3** without exposing a moral contradiction in your reasoning.

  In Case 3, you state: *"I believe the second produces more of what actually matters... I still do not fund it."*
  The principle explains *why* you do this (the Robustness Coefficient for dignity is too low), but it validates a choice you admit is *"not clearly correct."*
  *   **The Failure:** If you truly believe Intervention B produces *more good* than Intervention A, but you fund A solely because A is easier to measure, you are not maximizing Good; you are maximizing *Verification*. You are optimizing for your own epistemic comfort rather than the beneficiary's welfare.
  *   **The Abandonment:** To resolve this, you must either:
      1.  Admit you do not actually believe Dignity produces more good (revise belief); OR
      2.  Move Dignity into the "Venture" tier (Rule 2 exception) and fund it despite the lack of metrics.
      *   *Recommendation:* Abandon the refusal in Case 3. If the magnitude difference is truly that large (as implied by "more of what actually matters"), the evidential standard is acting as a bias, not a filter. Use the Two-Tier allocation to fund it.

  ---

  ### Pressure on Case 4 (Counterfactuals)

  Your verdicts in Case 4 rely on a fragile model of labor markets. You assign credit based on whether the role would have been filled by a "substitute agent."

  1.  **The Liquidity Assumption:** You assume the non-profit labor market is liquid enough that a "similarly competent" replacement exists instantly. In specialized, fast-growing research areas (your third version), you grant credit because your friend is *better*. But in the assistance organization (second version), you assume the replacement is *equal*.
      *   *Critique:* High-competence staff are scarce in the non-profit sector. If your friend takes the role, they might raise the organizational ceiling, mentor others, or prevent burnout in ways a "replacement" would not. By assigning *no credit* (or negative), you are assuming perfect substitutability in a market known for friction and talent shortages.
  2.  **The Trading Externalities:** You grant credit to the trading role because the counterfactual donor donates nothing. You ignore the *source* of the funds. If the trading position extracts value from the economy (zero-sum or negative-sum activity), the "good" of the donation is netted against the "harm" of the earnings.
      *   *Critique:* If the trading job is socially neutral, your math holds. If it is socially extractive, the "Marginal Contribution" calculation is incomplete. You are counting the donation as a positive without discounting the Robustness Coefficient of the income source.
  3.  **The Signal Effect:** By publicly assigning "no credit" to the direct worker but "credit" to the earner, you incentivize talented people to leave direct work. If many actors adopt your principle, the pool of "equally competent" replacements shrinks, making your original assumption (that the replacement exists) false. Your principle, if universalized, degrades the labor market it analyzes.

  **Verdict:** You must refine Rule 3. Credit should not be binary (0 or 1) based on replaceability. It should be a gradient based on the *probability distribution* of replacement quality. If there is a 50% chance the replacement is worse, you have 0.5 units of credit, not zero.

  ### Pressure on Case 7 (Adaptation vs. Condition)

  This is the deepest philosophical tension in your portfolio. You are hesitating because you suspect the metric (Life Satisfaction) measures *adaptation* (lowering expectations to match misery) rather than *welfare*.

  1.  **The Measurement Trap:** If the elderly recalculate expectations to survive loneliness, their reported life satisfaction may remain stable while their objective condition deteriorates. If you fund based on the report, you are funding the *management of perception*, not the *alleviation of suffering*.
  2.  **The Paternalism Risk:** If you refuse to fund because you distrust their self-report, you are asserting that you know their good better than they do. This violates the "Observability" clause of Rule 2. They are the only observers of their internal state.
  3.  **The Durability Conflict:** Rule 4 prioritizes durability. Adaptation is durable (they stay satisfied despite loneliness). Alleviating loneliness is fragile (new friends may move away). Your principle might inadvertently favor funding *adaptation training* over *social connection*, because the former produces more stable metrics.

  **Verdict:** You cannot resolve this with evidence alone. You must define "Magnitude" (Rule 1) more precisely.
  *   **Option A:** Define Magnitude as *Preference Satisfaction*. If they say they are satisfied, the good is done. (Fund the program).
  *   **Option B:** Define Magnitude as *Objective Functioning*. Loneliness is a health risk regardless of reported satisfaction. (Refuse the program, or demand objective biomarkers).
  *   **Recommendation:** You are currently oscillating because you hold both definitions simultaneously. You must choose. Given your concern in Case 3 about "what actually matters" (dignity vs. test scores), you seem to lean toward Objective Functioning. If so, you should refuse the loneliness program *unless* it can demonstrate objective social integration, not just reported satisfaction. Do not fund the recalibration of expectations; fund the change in condition.

  ### Summary Instruction

  1.  **Adopt the Two-Tier Allocation.** This resolves the tension between Case 1 (strict evidence) and Case 5 (local intuition).
  2.  **Abandon the Refusal in Case 3.** Move the "Dignity" intervention into the Tier 2 bucket. If you believe it is superior, your evidential constraint is a bias you are paying others to suffer for.
  3.  **Refine Rule 3 (Counterfactuals).** Replace the binary "replaceable/not replaceable" with a probabilistic assessment of replacement quality.
  4.  **Resolve Case 7.** Decide if you are funding *feelings* or *functioning*. If functioning, reported satisfaction is insufficient. If feelings, distrust of adaptation is paternalistic. Pick one.
