      *(Self-Correction during drafting)*: Wait, I need to look closely at (1). "Testimonial knowledge isn't subject-specific." This is the "Reductionism vs. Non-Reductionism" debate. If I reject the move from 6 to 8, I am effectively saying morality *is* subject-specific regarding the *norms of action*, even if not regarding the *possibility of knowledge*. I should clarify that distinction. The argument conflates *knowing that p* with *being a good moral agent regarding p*.

