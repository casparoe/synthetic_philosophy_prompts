      *Re-evaluating the "Corrupt Community":* If the corrupt community agent *should* defer, does that prove deference is *generally* okay? No, it proves it's okay *when competence is lacking*. This is like a child deferring to parents. It doesn't mean adults should defer to parents. This preserves the asymmetry for competent agents.

      *Final check on (6):* Is it fair? It says "compliance isn't attributable to them in the way moral agency seems to require." This is the "moral worth" objection. Yes, it's fair for that specific strain of pessimism (e.g., Sarah McGrath, Alison Hills).

