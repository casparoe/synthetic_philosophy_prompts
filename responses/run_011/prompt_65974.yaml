answer: |-
  Thank you for coming. [Pause] There are faces here I know from the seminar room, and faces I know from the village hall, and faces I know only from the photographs Miriam kept on her desk. We are a mixed company, which is as she would have wanted. She spent forty years in this college, but she spent twenty-five of them standing in the second row of the village choir, singing the alto line. Those of you who sang with her know that the alto part is the foundation you cannot hear separately. It is the sound that holds the harmony together without ever claiming the melody. That was her work here. It was not always visible, but when it was absent, the structure fell.

  Her brother Douglas asked me this week to bring one of her notebooks. He wanted me to open it, to read a page aloud, so that we might hear something genuinely hers. He told me that the letters and the lectures were for us, but the notebooks were for her. I have not brought them. I have left them in the archive, sealed, as her will directed. I know this choice may look like a withholding. It may look as though I am keeping the door shut on the room where she actually lived. But Miriam taught me that a person is not a secret kept behind the eyes, but a presence built in the space between us. [Pause]

  To look for her in the ink would be to look for her in the wrong place. She is not hidden behind what she did; she is displayed in it. If we want to know who she was, we do not need to decode a private notation. We need only look at what she made possible for others.

  There was a retired postal worker in Yorkshire who wrote to her after reading a paper on meaning. He had questions about whether words could hold still. Miriam answered him. She answered every letter from strangers who wrote to her about her papers. This correspondence lasted eleven years. She did not send form letters. She wrote back in her own hand, asking about his health, asking about his garden, asking him to clarify what he meant by "still." She treated his confusion not as an error to be corrected, but as a place to stand together. That is where she was. She was in that exchange. She was in the time she took to read the letter, and the time she took to write the reply.

  In this college, her form of approval was specific. When a student brought her a piece of writing, she would not say it was good. She would not say she was proud. She would read a paragraph, look up over her glasses, and ask for the thing again, slower. She wanted to hear the shape of the thought without the hurry. She did this at home, too. Anneke has asked that her mother be described accurately rather than admiringly. So I will say this: When her daughter spoke to her, Miriam put down her pen. She turned her chair. She asked for the thing again, slower. That was her love. It was not a feeling she kept in her chest; it was an attention she gave with her eyes and her hands.

  In her seventy-second year, she offered to teach the notebook notation to a graduate student. She sat with the student for an hour, explaining the symbols, the syntax, the rules. The student declined for want of time. Miriam accepted the refusal. She never offered again. She left no key. Some might call this a loss. I call it a consistency. She did not build a system to outlast her. She built a way of working that required a partner. When the partner was not there, the work stopped. She did not force it. She did not complain. She simply closed the book.

  [Pause]

  There is a temptation, when someone dies, to speak as though we have lost access to them. We say we miss them, as though they have gone to a place we cannot follow. But Miriam's life was a demonstration that we are never inaccessible to one another so long as we share a language. She objected on principle to the quotation of authorities at ceremonies. She thought it was a way of borrowing weight we did not carry ourselves. So I will not quote her teachers. I will only tell you what she did with their tools.

  She used philosophy to clear the ground so people could stand on it. She did not use it to build a monument to herself. The notebooks remain closed not because there is something too sacred to share, but because there is nothing there that she did not already give us in the singing, the teaching, and the letters. To open them would be to suggest that the eleven years of letters to the postal worker were not enough to know her. To suggest that the twenty-five years of alto lines were not enough to hear her. To suggest that the forty years of asking for things slower were not enough to understand her.

  They were enough. They are enough.

  We are not gathered here to mourn a private soul that has vanished into silence. We are gathered to acknowledge a public life that remains in our hands. Her voice is not in the archive. It is in the way we listen to our students now. It is in the way the choir holds the bottom note. It is in the letters kept in drawers across three counties. She is not behind these things. She is in them. [Pause]

  So we will not open the books. We will not look for a ghost in the syntax. We will do what she asked us to do. We will take what she left us—the letters, the songs, the examples—and we will go over them again. Slower.
