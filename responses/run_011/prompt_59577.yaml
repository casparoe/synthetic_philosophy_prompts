answer: |-
  # Activity Design: The Inflationary Merit Game

  ## 1. Conceptual Overview
  **The Core Mechanic:** An inflationary wage model.
  Students "work" (spend effort tokens) to earn "revenue." The value of each unit of work is determined by the **group's average effort**. As the group works harder, the value of work inflates downward.
  *   **Individual Rationality:** Increasing effort increases your share of the pot *relative to others* in the short term.
  *   **Collective Irrationality:** When everyone increases effort, the pot size stays fixed, but the total cost (effort) rises. Net utility for everyone drops.
  *   **The Trap:** A pact to keep effort low is unstable because a single defector gains massively, forcing others to raise effort to survive, destroying the pact without any "villain" breaking a promise—the math breaks the promise.

  ## 2. Logistics & Materials
  *   **Room Setup:** **One Single Market (Whole Room).**
      *   *Why:* Moloch is a systemic constraint, not a local one. If you split into three tables, students will compare tables ("Table 2 solved it, why didn't we?"). Keeping all 22 students in one pool forces the "no exit" feeling. Use the three tables merely as work clusters for calculation.
  *   **Materials:**
      *   Index cards (3 per student, for bidding).
      *   Whiteboard (for Global Stats).
      *   Calculators (students use phones).
      *   **Reward:** A bag of high-quality chocolates or cookies.
          *   *Distribution Rule:* Top 5 scores get 5 pieces. Next 6 scores get 3 pieces. Bottom 11 scores get 1 piece. (This ensures relative ranking matters even if absolute scores drop).
  *   **Time:** 75 Minutes.

  ## 3. Rules of Play
  1.  **Endowment:** Each round, every student has a maximum **Effort Capacity of 10**.
  2.  **The Bid:** On an index card, write your name and choose an **Effort Level ($E$)** between 0 and 10. Submit to the front.
  3.  **The Market Value:** The Facilitator sums all Effort Levels and calculates the **Group Average ($\bar{E}$)**.
      *   **Value Per Unit ($V$)** = $100 / \bar{E}$. (If $\bar{E} = 0$, $V = 10$).
  4.  **Scoring:**
      *   **Revenue** = $E \times V$.
      *   **Cost** = $E \times 1$.
      *   **Net Score** = Revenue $-$ Cost.
  5.  **Winning:** Cumulative Net Score over 5 rounds determines candy distribution.
  6.  **Communication:** You may talk freely between rounds. You cannot show your card before submission.

  ## 4. Timeline (75 Minutes)
  *   **00:00 – 00:10 (Intro):** Explain rules. Do **one practice round** with dummy numbers to ensure they understand the formula. Emphasize: *Maximize your Net Score.*
  *   **00:10 – 00:35 (The Game):** 5 Rounds.
      *   Bid (1 min).
      *   Collect & Calculate (2 mins - Facilitator does Avg/Value, Students do Net).
      *   Announce Global Avg & Value (1 min).
      *   Record Scores (1 min).
  *   **00:35 – 01:15 (Debrief):** Structured discussion (see below).

  ## 5. Worked Example (Verification)
  *Scenario:* 6 Players (A, B, C, D, E, F). Constant $K=100$.
  *Goal:* Verify the trap fires and resisters are punished.

  | Round | Player Actions (Effort $E$) | Group Avg ($\bar{E}$) | Value ($V = 100/\bar{E}$) | Player A (Defector) | Player B (Follower) | Player F (Resister) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **All choose 2** | **2.0** | **50.0** | Net: $(2\times50)-2 = \mathbf{98}$ | Net: $\mathbf{98}$ | Net: $\mathbf{98}$ |
  | **2** | **A chooses 4**, Others 2 | **2.33** | **42.9** | Net: $(4\times42.9)-4 = \mathbf{167.6}$ | Net: $(2\times42.9)-2 = \mathbf{83.8}$ | Net: $\mathbf{83.8}$ |
  | **3** | **A,B,C choose 4**, D,E,F choose 2 | **3.0** | **33.3** | Net: $(4\times33.3)-4 = \mathbf{129.2}$ | Net: $\mathbf{129.2}$ | Net: $(2\times33.3)-2 = \mathbf{64.6}$ |
  | **4** | **All choose 6** | **6.0** | **16.6** | Net: $(6\times16.6)-6 = \mathbf{93.6}$ | Net: $\mathbf{93.6}$ | Net: $(2\times16.6)-2 = \mathbf{31.2}$ |
  | **5** | **All choose 8** | **8.0** | **12.5** | Net: $(8\times12.5)-8 = \mathbf{92.0}$ | Net: $\mathbf{92.0}$ | Net: $(2\times12.5)-2 = \mathbf{23.0}$ |

  **Analysis of the Trap:**
  1.  **Round 1 (Cooperation):** Everyone is wealthy (98 pts).
  2.  **Round 2 (Local Improvement):** Player A sees a chance to lead. By doubling effort, A's score jumps to 167. B and F drop to 83. *Rational move for A.*
  3.  **Round 3 (Defensive Escalation):** B and C must raise effort to 4 just to stop bleeding relative to A. F (Resister) drops to 64. *Rational move for B/C.*
  4.  **Round 4 (The New Normal):** Everyone realizes 4 is the new baseline. To gain an edge, everyone pushes to 6. **Notice:** A's score (93.6) is now *lower* than Round 1 (98), despite working 3x harder.
  5.  **Round 5 (The Bottom):** Push to 8. Scores stabilize around 92.
      *   **Collective Outcome:** The group is working 4x harder than Round 1 for *less* net utility (92 vs 98).
      *   **Resister Outcome:** Player F refused to escalate. F ends with 23 points vs the group's 92. F gets no candy. **Resistance is individually suicidal.**

  ## 6. Sensible-Play Path vs. Resister Path
  *   **Sensible Play (Nash Equilibrium):** The game has no stable equilibrium except "Max Effort" (10). If everyone bids 10, $V=10$, Net = $100-10=90$. This is the lowest efficient outcome, but no single player can lower their bid without dropping their Net Score to near zero (because $V$ stays low while their Revenue collapses).
  *   **The Resister:** If a student says "I refuse to participate in this arms race" and bids 2 while the group bids 8:
      *   They are not "moral heroes" in the game logic; they are "uncompetitive."
      *   They will finish in the bottom tier.
      *   **Crucial Debrief Point:** In a multipolar trap, unilateral virtue is self-elimination. It does not stop the trap; it only removes you from the resource pool.

  ## 7. Debrief Guide (40 Minutes)
  *Do not use the word "Moloch" until the final 5 minutes.*

  **Phase 1: The Data (10 mins)**
  *   "Look at Round 1 Net Scores vs. Round 5 Net Scores. Did the group become more productive or less?"
  *   "Did anyone try to make a pact to keep bids low? What happened?"
  *   "For those who tried to keep bids low (Resisters): How did that feel? Did it change the group's outcome?"

  **Phase 2: Structural Mapping (15 mins)**
  *   **Multipolarity:** "Was there a single person who forced the bids up? Or did it happen without a leader?" (Target: No villain, just incentives).
  *   **Local Rationality:** "In Round 2, was Player A wrong to bid 4? If you were A, would you have bid 2?" (Target: The move was rational locally).
  *   **Exit Costs:** "Why couldn't we just go back to Round 1 levels in Round 3?" (Target: Once Value ($V$) drops, low bidders starve. You cannot de-escalate unilaterally).
  *   **The Baseline Drift:** "When did you realize the 'Value' of your work was dropping? Did you notice it round-by-round, or only at the end?" (Target: The drift is invisible in the moment).

  **Phase 3: Real World & Moloch (10 mins)**
  *   Ask for examples: Credential inflation (degrees), arms races, clickbait journalism, burnout culture.
  *   **The Reveal:** Introduce the term **Moloch** (or Multipolar Trap).
  *   "This isn't about greed. It's about a system where the reward structure decouples effort from value."

  **Phase 4: Solutions? (5 mins)**
  *   "How do you solve this?" (Students will suggest: Regulation, Communication, Changing the Reward).
  *   "In this game, communication was allowed. Why did it fail?" (Target: Enforcement. Without a central enforcer, pacts are cheap talk).

  ## 8. Predictable Failure Modes & Recovery
  1.  **Failure: The "Strike" (All bid 0 or 1).**
      *   *Symptom:* Students collude to keep $\bar{E}$ at 1.
      *   *Recovery:* Introduce a "Shill" (a TA or a pre-briefed student) who bids 10 in Round 2. This spikes the Average, crashes the Value, and punishes the strikers. The strikers will immediately abandon the pact to recover losses. *This proves the fragility of the pact.*
  2.  **Failure: Math Confusion.**
      *   *Symptom:* Rounds take 10+ minutes.
      *   *Recovery:* Project a simple Excel sheet if possible. If not, appoint 3 "Scriveners" (one per table) to sum the cards and hand you the total. You calculate $V$, they calculate Net.
  3.  **Failure: Apathy ("I don't care about candy").**
      *   *Symptom:* Random bidding.
      *   *Recovery:* Shift the stakes verbally. "The Top 3 players get to choose the reading topic for the final week." Academic control is often higher stakes than sugar for this demographic.

  ## 9. Limitations (What the Game Can't Do)
  *   **Existential Risk:** In this game, losing means less candy. In real Moloch scenarios (nuclear war, climate collapse), losing means extinction. You must supply this gravity in the debrief.
  *   **Infinite Horizon:** This game ends in 5 rounds. Real traps are indefinite. In the last round, students might "cash out" (bid 10) because there is no future retaliation. Acknowledge this: "In real life, there is no Round 6 where the game resets."
  *   **Heterogeneity:** All players are identical here. In reality, some actors have more capacity to endure the race (wealthy nations vs. poor nations).

  ## 10. Facilitator Script Snippet (The "Pact" Moment)
  *Between Round 2 and 3, students will likely argue.*
  **Student:** "We should all just agree to bid 2."
  **You:** "You are allowed to make that agreement. I will not stop you. But remember: I collect the cards secretly. You cannot verify if your neighbor kept the promise until the points are already lost."
  *(This forces them to realize the trap is in the verification/enforcement, not the rules.)*

  ## 11. Why This Fits Your Constraints
  *   **No Defection against Cooperation:** Players aren't "defecting" from a cooperative norm; they are "improving efficiency" which inadvertently destroys value.
  *   **No Designated Villain:** The "defector" in Round 2 is just playing to win. By Round 4, everyone is the defector.
  *   **No Facilitator Veto:** The pact fails because the math makes it costly to keep, not because you said "no."
  *   **Positional Engine:** The Value ($V$) is the moving baseline. It quietly drifts down.
  *   **Resister Cost:** The worked example proves resisters are punished, preventing the "just don't defect" moralizing.
