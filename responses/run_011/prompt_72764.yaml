      *   For a human, time is finite. Ruin is absorbing.
      *   Ergodicity is the key concept here. The casino is ergodic (can recover from ruin via capital injection). The individual is non-ergodic (ruin is end of game).
      *   Make sure to mention Ergodicity explicitly as it bridges the user's "time-average" knowledge with the argument.

