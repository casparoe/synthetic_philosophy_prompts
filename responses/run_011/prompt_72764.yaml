          2.  The Fault Lines (Where the Map Breaks).
          3.  Auditing the Claims (The Verdicts).
          4.  The Double Kelly Proof (The Ammo).
          5.  The Better Analogy (The Replacement).
      *   *Refining the Double Kelly Proof:* Need to be precise. Double Kelly leads to zero geometric growth in a specific binary case, and negative in most. Actually, in a simple binary bet, Double Kelly reduces geometric growth to *zero* (wealth stays flat on average geometrically) only if the edge is specific? No, generally Double Kelly *reduces* growth significantly. Wait, let's check the math.
