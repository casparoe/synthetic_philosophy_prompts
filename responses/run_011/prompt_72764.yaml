          *   $g(0.4) = 0.6 \ln(1.4) + 0.4 \ln(0.6) = 0.6(0.336) + 0.4(-0.51) = 0.2016 - 0.204 = -0.0024$.
          *   It's negative. So wealth shrinks. Betting nothing = 0 growth. So Double Kelly is *worse* than nothing.
          *   *Correction:* In some specific setups, Double Kelly yields zero geometric growth. But generally, it's negative. The claim "no worse than nothing" is false because nothing preserves principal, Double Kelly erodes it.
      *   *Refining the "House" Analogy:* The critical missing feature is **Capital Resilience**. A casino can absorb a run of red. A bettor with a mortgage cannot. This links to Utility.

  7.  **Final Review against Constraints:**
      *   Correspondence table first? Yes.
      *   Separate damage vs. decoration? Yes.
