      *   *Casino:* Infinite bankroll (effectively), uncorrelated bets (mostly), ability to set limits, ability to refuse action, regulatory capital buffers, diversified revenue streams.
      *   *Individual:* Finite bankroll, correlated risks (league-wide events, model error), inability to refuse action (opportunity cost/psychology), no ability to set table limits on the market, single point of failure (ruin).
