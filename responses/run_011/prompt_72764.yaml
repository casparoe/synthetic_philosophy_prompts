          *   *Verdict:* Fails on correlation and model risk.

      *   **Claim 2: "You don't need a utility function, only a bankroll rule."**
          *   *Critique:* A bankroll rule *is* an implicit utility function (usually log utility for Kelly). But more importantly, humans have consumption needs. If ruin means "homeless," the utility function is step-like, not smooth. The Casino doesn't eat; the bettor does.
          *   *Verdict:* False. Bankroll rules encode utility constraints.

      *   **Claim 3: "Double Kelly is no worse than betting nothing."**
          *   *Math Check:*
              *   Kelly ($f^*$) maximizes geometric growth rate ($g$).
              *   Bet $0$: $g = 0$ (no growth, no loss).
              *   Bet $2f^*$ (Double Kelly): Geometric growth rate drops. If leverage is involved or variance is high, $g$ becomes *negative*.
              *   Formula: $g(f) = p \ln(1+bf) + q \ln(1-f)$.
              *   At $2f^*$, variance drag overwhelms edge. Expected *arithmetic* return is higher, but Expected *geometric* return (long-term wealth) is lower, often negative.
              *   "No worse than nothing" implies $g(2f^*) \ge 0$. This is generally false. It usually leads to ruin.
          *   *Two-line proof:* Double Kelly maximizes variance drag, often turning positive expected arithmetic return into negative geometric growth. Betting nothing preserves capital; Double Kelly often incinerates it.

