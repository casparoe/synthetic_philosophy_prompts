answer: |-
  **Exam Question**

  Consider the following argument regarding the ontological status of computational complexity classes:

  (1) Running time is not a property of a problem alone, but of a problem relative to a machine model and an input encoding. (2) The invariance of polynomial time across machine models relies on a chosen tolerance for simulation overhead; this tolerance is a convention, not a natural joint. (3) Changing encodings (e.g., unary vs. binary numerals) shifts problems across the tractable/intractable boundary. (4) Therefore, claims of intractability are artifacts of representational choice, not facts about computational reality, even if P ≠ NP is proven.

  Write an essay addressing the following three tasks. First, reconstruct this argument as logically valid by supplying its suppressed philosophical premises. Second, identify the single step where the argument fails and explain why, demonstrating that accepting the argument would invalidate complexity claims known to be theorems. Third, formulate a general criterion for distinguishing representational artifacts from substantive complexity facts, and apply it to the unary encoding case.

  You may not answer by reciting definitions of P or NP, surveying the status of the P versus NP problem, taking a position on whether P equals NP, or simply asserting that polynomial time is robust across machine models. Your answer must engage with the relationship between encoding, information content, and complexity class separations.

  ***

  **Model Answer**

  To reconstruct the argument as valid, we must supply a suppressed premise connecting relativity to conventionality. The explicit premises establish that complexity properties are relative to models and encodings. The conclusion asserts that these properties are therefore merely conventional. The missing premise is: *If a property depends on representational choices, it does not reflect mind-independent reality.* With this addition, the inference from (1)–(3) to (4) becomes valid. If the boundary shifts when we change notation, and notation is a choice, then the boundary is a product of choice rather than discovery.

  However, the argument fails at step (4), specifically in the inference drawn from step (3). The error is that the argument proves too much. If the relativity of encoding dissolves the distinction between tractable and intractable problems, it must equally dissolve the distinction between polynomial time and exponential time. Yet, the separation between polynomial and exponential time classes is a theorem (via the Time Hierarchy Theorem), not merely a conjecture like P versus NP. If the friend's reasoning were correct, we could encode inputs such that an exponential-time problem appears solvable in polynomial time, thereby contradicting the hierarchy theorem. Since the hierarchy theorem holds, the encoding cannot legitimately alter the fundamental complexity class of a problem. Therefore, not all encodings are equal; some are legitimate representations of the problem, and others are distortions.

  This leads to the required criterion: A complexity-theoretic claim is an artifact of representation if and only if it relies on an encoding that is not polynomially related to the standard, information-preserving encoding of the input. This criterion is not a mere definition but a substantive assumption about information density. Two encodings are polynomially related if the length of the input in one encoding is bounded by a polynomial function of the length in the other. This condition is substantive because it preserves the structural gap between polynomial and exponential growth. If we allow encodings that are exponentially divergent (e.g., mapping a binary number to a unary string of equivalent value), we compress or expand the input size so drastically that the computational work is hidden in the decoding process rather than the algorithm itself.

  Applying this to the unary encoding case clarifies why the friend's step (3) is misleading. Representing a number $N$ in binary requires $\log N$ bits; in unary, it requires $N$ bits. This is an exponential disparity in input length relative to the information content. An algorithm that runs in time linear in the unary input length is actually running in time exponential in the binary input length. Thus, the problem has not become tractable; the encoding has artificially padded the input to make the running time appear polynomial relative to the padded length. The complexity claim is an artifact here because the encoding violates the polynomial relatedness criterion.

  For the friend to be right, the condition of polynomial relatedness would have to fail universally. If every natural way of representing a problem's inputs diverged exponentially from every other way, there would be no stable "standard" encoding against which to measure complexity. In that world, complexity classes would indeed be purely conventional. However, for standard combinatorial problems (graphs, numbers, formulas), natural encodings converge polynomially. Thus, the boundary is not an artifact of notation, but a fact about the relationship between information content and computational resources, provided we restrict our attention to reasonable, polynomially related encodings. The robustness of polynomial time is not a tautology; it is the empirical and mathematical observation that all reasonable ways of writing down a problem agree on where the exponential wall begins.

  ***

  **Marking Scheme**

  **Total Marks: 25**

  **Move 1: Valid Reconstruction (5 Marks)**
  *   **Requirement:** Identify the suppressed premise that "relativity implies conventionality" (or equivalent: if $X$ depends on choice, $X$ is not real). Show how this bridges premises (1)–(3) to conclusion (4).
  *   **Characteristic Fumble:** Students list the explicit premises again without identifying the hidden philosophical bridge, or they claim the argument is already valid without supplementation.
  *   **Outright Error:** Claiming the argument is invalid because P ≠ NP is unproven.

  **Move 2: Locating the Failure (5 Marks)**
  *   **Requirement:** Identify Step 4 (or the inference from 3 to 4) as the failure point. State that the argument invalidates known theorems (like Time Hierarchy) if accepted.
  *   **Characteristic Fumble:** Students claim Step 1 or 2 is false (arguing machine models *do* matter) rather than showing the conclusion doesn't follow from the premises.
  *   **Outright Error:** Asserting the argument fails because P = NP is likely false.

  **Move 3: The "Proves Too Much" Argument (5 Marks)**
  *   **Requirement:** Explain that if encoding relativity dissolved P vs NP, it would dissolve P vs EXP. Since P vs EXP is a theorem, the encoding must be constrained.
  *   **Characteristic Fumble:** Students treat the separation of P and EXP as just another conjecture, or fail to distinguish between conjectured boundaries (P vs NP) and proven separations (Hierarchy).
  *   **Outright Error:** Citing specific theorem names (e.g., "Time Hierarchy Theorem") without explaining the content; or claiming no complexity separations are proven.

  **Move 4: Formulating the Criterion (5 Marks)**
  *   **Requirement:** Define "polynomially related encodings" as the substantive constraint. Explain that this is not a definition but a condition that preserves the poly/exp gap.
  *   **Characteristic Fumble:** Treating "reasonable encoding" as a bare definition without explaining *why* polynomial relatedness is the specific cutoff (i.e., preserving the growth rate distinction).
  *   **Outright Error:** Defining reasonable encodings as "those that make P = NP true" or similar circularity.

  **Move 5: Application and Counterfactual (5 Marks)**
  *   **Requirement:** Apply criterion to unary (exponential padding hides work). Acknowledge the condition under which the friend *would* be right (if no polynomially related encodings existed).
  *   **Characteristic Fumble:** Sliding between worst-case complexity and practical feasibility; claiming unary is "wrong" without explaining the exponential padding mechanism.
  *   **Outright Error:** Claiming unary encoding is physically impossible; or refusing to grant that the friend's view would be correct under the counterfactual condition.

  **General Deductions**
  *   **-5 Marks:** Reciting standard definitions of P or NP without philosophical engagement.
  *   **-5 Marks:** Taking a stance on whether P equals NP.
  *   **-5 Marks:** Using citations, bibliography, or named literature not provided in the course.
  *   **-10 Marks:** Answer relies entirely on the assertion that "polynomial time is robust" without justifying why robustness implies reality (the B-level trap).
