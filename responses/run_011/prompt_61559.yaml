prompt: |-
  Act like a Nietzsche scholar who's also spent some years advising cities on anniversaries and memorial projects, and think this one through carefully rather than fast.

  Our town turns 150 next year and the anniversary comission has three rival programs competing for one pot of money:

  **A.** A founders' walk — restored statues, a hall of honor for the mill owners *and* the strike leaders, plus a traveling show on the two or three moments when this place punched way above its weight. Their pitch line is basically "greatness happened here once, so it can happen again."
  **B.** A living-archive year — full restoration of the old brick warehouse district, every street's name documented, oral histories recorded in every school, a quarterly of local deeds and genealogy.
  **C.** A reckoning — a formal public inquiry into the 1961 highway that leveled the Bottoms neighborhood, published findings, street renamings, and a standing fund for the families pushed out.

  Rank A, B, C by how much each would, on the account in the second Untimely Meditation, actually damage the town's capacity for life instead of serving it. Score each 0–10 for "likely to feed the historical malady," sort them into tiers, and explain in a sentence or two why each lands where it does. Then give me the fraction of the budget — a decimal, like 0.4 — you'd hand the least dangerous one.

  Work from the specific pathologies Nietzsche attaches to each of the three modes and to their excesses, including whatever he thinks each one costs the people who practice it, not from generic museum-versus-justice talk. Start with a short brainstorming pass that maps each program onto monumental, antiquarian, and critical history, and flag it if you think one of them is really a mode in disguise or a hybrid. Also say what Nietzsche's notion of plastic power would make you check about *this* town before the ranking is worth anything.

  No citations, no reading list — I have the essay. American English, please.
