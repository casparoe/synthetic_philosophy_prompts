      *   **Core Thesis:** History is valuable only insofar as it serves *life* (the active, creative, future-oriented force). Too much history paralyzes life (the "historical malady").
      *   **Three Modes:**
          1.  **Monumental History:** Looks to great past examples to inspire action now. *Danger:* Distorts truth, ignores context, makes the past seem repeatable when it isn't, discourages new creation because the past seems too big.
          2.  **Antiquarian History:** Preserves the past for its own sake, reverence for origins. *Danger:* Mummifies life, treats everything old as equally valuable, stifles new growth, becomes mere hoarding.
          3.  **Critical History:** Judges and condemns the past to break its chain so life can move forward. *Danger:* Can become destructive for its own sake, loses roots, creates a void, assumes we can escape our heritage entirely.
      *   **Plastic Power:** The capacity of a person/culture to absorb the past, heal from it, and transform it into something new without being crushed by it. Weak plastic power = history becomes a burden. Strong plastic power = history becomes fuel.
      *   **The Malady:** When history serves itself rather than life. When remembering prevents acting.

