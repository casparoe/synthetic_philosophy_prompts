answer: |-
  **Frequently Asked Questions: Belief Integrity Audits**

  **How does the audit resolve divergent majority views within a tribunal?**
  Our methodology prioritises premise-based aggregation over conclusion-based voting. In a standard panel, members may affirm individual premises by a majority, yet deny the logical conclusion derived from them. For example, three members may affirm premise A, three may affirm premise B, but four may deny conclusion C (where A and B necessitate C). The audit records the collective commitment to A and B as the primary finding. Consequently, the organisation is recorded as believing C, notwithstanding that a majority of individual members voted against it. This ensures the body remains logically coherent, even if it is democratically inconsistent.

  **Who bears responsibility if the enforced conclusion proves unpopular?**
  Liability resides with the corporate entity rather than the individual members. By utilising the audit, the board demonstrates that the outcome was not the preference of any single majority faction, but rather an inevitable output of the organisation's established logical framework. This diffuses personal culpability. Members can truthfully state they voted against the final decision whilst maintaining that the organisation, as a singular rational agent, was compelled to adopt it. This protects individual reputations whilst preserving institutional consistency.

  **Can the Chair simply re-run the vote on the conclusion to align with member sentiment?**
  This is strongly discouraged. Re-voting on the conclusion after premises have been ratified creates a record of logical incoherence. If the minutes reflect agreement on the premises but disagreement on the conclusion, the organisation is exposed to claims of irrationality. The audit prevents this 'logical drift' by locking the conclusion to the premises. Whilst this may override the immediate will of the members, it safeguards the long-term integrity of the regulatory record. Consistency is valued higher than transient consensus.

  **A client noted they could engineer specific outcomes by changing the order of questions. Is this permissible?**
  Yes. This is recognised as strategic agenda setting. Different propositional sequences yield different majority alignments on the premises, thereby altering the enforced conclusion. We advise clients to structure the questioning pathway that best aligns with their desired governance outcome whilst maintaining strict adherence to logical deduction. So long as each step follows validly from the previous one, the final result is considered robust. It is the procedure that validates the outcome, not the outcome that validates the procedure.

  **How does the audit handle prosecution where knowledge is distributed across employees?**
  In cases where six employees possess fragments of knowledge—none sufficient for individual culpability—the audit aggregates this information to establish corporate intent. The organisation is deemed to know what its collective parts know, even if no single human agent possesses the complete picture. This allows for the assembly of a prosecution case based on constructive corporate knowledge. The entity is liable for the synthesis of information, ensuring that fragmentation cannot be used as a shield against regulatory breach.

  **Client Testimonial**
  *"Before the audit, our board was paralysed by the inability to reconcile individual votes with collective duties. We frequently found ourselves committed to positions most of us opposed. The Belief Integrity Audit allowed us to formalise this disconnect. We now achieve logically sound decisions that no one individually supported, which has greatly streamlined our risk management."*
  — General Counsel, FTSE 250 Financial Services Firm

