prompt: |-
  Can you write me a satirical FAQ page, maybe 500-600 words, for a boutique consultancy that sells "belief integrity audits" to boards, tribunals and regulators? Deadpan corporate voice throughout, and it should read like it's genuinely trying to be helpful — no winking, nobody in the piece seems aware any of it is absurd.

  The comedy has to come from getting the doctrinal paradox exactly right: a panel where members vote separately on each premise and on the conclusion, the premises carry by majority, the conclusion follows from them logically, and the body thereby commits itself to something most of its own members voted against. Include a question about who's to blame afterwards, one about whether the chair can just re-run the vote on the conclusion instead (and what that does to the result already recorded on the premises), one about a client who discovered you can engineer pretty much any outcome you like purely by choosing which questions get put and in what order, and one about a prosecution assembled out of knowledge spread across six employees, none of whom individually knew enough to be culpable. Maybe a testimonial, becuase that's what these pages always have.

  Don't name any theorems, papers or people and don't cite anything — but a social choice theorist should read it and think you actually understand the result rather than just the vibe of it. British English, please.
