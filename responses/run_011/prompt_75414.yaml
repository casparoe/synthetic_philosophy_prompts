answer: |-
  Subject: Re: Forecasting lens on philosophical progress

  It is great to hear from a fellow traveler in the forecasting trenches, and I think applying your toolkit to the philosophy progress debate is a fascinating stress test for both domains. To restate the debate in your vocabulary without presuming forecasting is the ultimate arbiter of truth, we have to treat philosophical claims as forecasts about conceptual or normative states rather than empirical events. The pessimists are essentially arguing that the market for philosophical propositions shows no price convergence over two millennia. In your terms, the dispersion of credences among credentialed experts remains wide, calibration data is non-existent because resolution conditions are undefined, and out-of-sample testing suggests expert predictions perform no better than a uniform prior or a dartboard. They see a system with no feedback loop, meaning there is no way to update weights on predictors based on past accuracy, leaving the field in a state of permanent high entropy.

  The optimists, translated into your framework, argue that this looks like progress only if you ignore the dynamic composition of the question set. They claim that whenever a philosophical question acquires clear resolution conditions and a feedback loop, it gets delisted from the philosophy market and listed on a science market. Physics and psychology are just subsets of questions that graduated from unscorable to scorable. What remains in philosophy is the residue of questions that, by definition, lack cheap or clear resolution conditions. Furthermore, when they argue that positions are more sophisticated, they are suggesting that while the posterior probabilities haven't collapsed to zero or one, the model complexity and prior justification have improved. They are claiming better calibration of uncertainty even if resolution is impossible, arguing that the disagreement is not noise but a rational reflection of the limited information available in the absence of a scoring rule.

  When we look at the residue of this translation, some claims map cleanly while others distort. The concepts of feedback loops, resolution conditions, and reference classes transfer almost perfectly. The pessimist's complaint about lack of consensus is exactly a complaint about high forecast dispersion without convergence, and the optimist's defense is clearly a selection bias argument regarding the reference class of remaining questions. However, you have to bend the concept of sophistication. In forecasting, sophistication usually cashes out as better Brier scores or tighter calibration curves. In philosophy, sophistication often means conceptual coherence, argumentative robustness, or the ability to dissolve confusions, which does not necessarily tighten probability distributions around a specific outcome. You can have a very sophisticated argument for why a question is ill-posed, which in forecasting terms might look like refusing to make a prediction, but in philosophy counts as intellectual progress. This suggests a hole in your framework rather than the debate being insubstantial. Forecasting is built to handle empirical uncertainty where an outcome will eventually obtain, whereas much of philosophy deals with normative or conceptual claims where there is no fact of the matter to score against. If you cannot define a resolution condition, you cannot calculate a Brier score, so your framework necessarily treats these questions as noise or undefined, whereas philosophy treats them as the primary object of study.

  Your hypothesis about the export of tractable questions survives the translation remarkably well and actually strengthens the optimist's case within your own vocabulary. If the reference class of philosophical questions is dynamically updated to exclude any proposition that becomes empirically testable, then the remaining set is constructed specifically to resist scoring. In that light, the lack of convergence is not evidence of stagnation but a statistical inevitability of the selection process. You would predict exactly zero convergence on questions that have no resolution conditions, regardless of whether the thinkers are making progress in clarifying the logical space. However, this does quietly change the subject from truth-tracking to question-framing. It shifts the metric of progress from getting the right answer to getting better at identifying which questions are answerable. If philosophy is progress in clarifying the boundaries of the scorable versus the unscorable, then the lack of consensus on the unscorable leftovers is consistent with progress. The tension arises only if you insist that progress must look like convergence on a truth value. If you allow progress to look like the systematic removal of resolvable questions from the set, then the field is succeeding by failing to converge. This suggests your framework is robust enough to model the mechanism of the field, even if it cannot score the outputs, provided you accept that refining the question set is a valid form of epistemic work.
