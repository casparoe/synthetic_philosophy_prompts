answer: |-
  1. **What we can claim**
  Apology differs from regret because it accepts agency. Regret says, "It is sad this occurred." Apology says, "We did this." Acknowledgment is merely factual. Given the wrongdoers are dead, this speech must attempt apology by claiming institutional continuity. The university persists as a moral agent beyond the lifespan of its members. The condition whose absence would fail the apology is disclaiming responsibility due to temporal distance. If I suggest "that was a different era," I offer excuse, not apology. I must own the act as ours, even if I am not the actor. The speech must assert that the institution is the same body then as now, granting me standing to apologize without claiming personal guilt.

  2. **The speech**
  To the survivors seated before me, your descendants, and all gathered here: we are here to speak the truth about this university. Between 1926 and 1961, our School of Education ran a program that required human subjects and labor. We chose the state institution for the feeble-minded as our site. We placed hundreds of residents into our arrangements. Most were adolescents. None could consent. Many had no family to speak for them. We took them. We used them. We failed to keep complete records of their lives. We allowed their work to vanish without credit. We allowed their presence to be forgotten. The historical commission found our records incomplete. We cannot fully account for every person.

  I was born in 1968. The presidents who signed these agreements are dead. You might ask what standing I have to speak for them. I am not here as an individual claiming personal guilt. I am here as the head of an institution that does not die. A university is more than its current faculty or students. It is a continuous body that holds obligations across generations. The signature on those contracts was not a person's name; it was the university's seal. That seal remains. When I say "we," I do not mean the people in this room. I mean this university. We placed you. We benefited from your labor. We bear the responsibility for that choice. I inherit this voice. My presence here is not an assertion of innocence. It is an acceptance of stewardship. I stand in the office that signed the agreements. The office persists even when the person leaves.

  To say this was a product of its time is to excuse the harm. It was wrong then, and it is wrong now. We treated human beings as tools for our training. We stripped you of dignity. We exposed you to testing without protection. We capitalized on your vulnerability. We took what was not ours to take. For this, I am sorry. This is not a statement of regret that these events occurred. This is an apology for what we did. We wronged you. We betrayed the public trust placed in us to educate, not to exploit. The harm is real. The injury persists. We accept that.

  Some of you have told me that an apology without repair is empty. You are right. Words cannot restore lost years. Today, this university authorizes a permanent scholarship fund and a public archive to preserve this history. These are concrete actions. I know some of you believe direct payments are owed. I hear that demand. I cannot promise what the board has not authorized, but I can state clearly: this university acknowledges a debt that exceeds what we announce today. This fund is a beginning, not a conclusion. We are committed to material repair within our power. We will not hide behind procedure. Redress is not charity. It is justice. We are taking steps toward justice.

  I am not asking for your forgiveness. I know some of you have sworn not to attend, and I respect that choice. Forgiveness is yours to give or withhold, not mine to request. This ceremony is not a reconciliation. It is a reckoning. To our alumni who fear this tarnishes our name: silence tarnishes us more. To the survivors: we see you. We will keep this archive open. We will not look away again. We accept the burden of this history. We will carry it forward. We will ensure this truth remains part of our identity. There is no easy ending here. There is only the work ahead.

  3. **Constraint check**
  *   **Apology not regret:** "This is not a statement of regret... This is an apology for what we did."
  *   **Active voice:** "We placed hundreds," "We chose," "We took them."
  *   **Institutional continuity/Standing:** "I mean this university... The office persists even when the person leaves." Solves the standing problem by separating the office from the person.
  *   **No personal guilt:** "I am not here as an individual claiming personal guilt."
  *   **No scapegoating:** "To say this was a product of its time is to excuse the harm."
  *   **Redress truth:** "Acknowledges a debt that exceeds what we announce today." Admits insufficiency without promising refused payments.
  *   **No legal liability:** Avoids words like "negligence," "law," or "illegal." Uses "wrong," "harm," "betrayal."
  *   **No forgiveness/reconciliation:** "I am not asking for your forgiveness... This ceremony is not a reconciliation."
  *   **Tension:** Counsel forbids admission of legal liability. I walked the line by admitting moral wrongdoing ("We wronged you") which is necessary for apology, while avoiding legal terms. This is the highest risk area; I prioritized the moral apology over maximal legal protection, as a purely legalistic speech would fail the "apology" constraint.

  4. **The two hardest objections**
  *   **Survivor:** "You acknowledge a debt but refuse to pay it directly to us, offering scholarships to strangers instead."
      *   *Response:* "I cannot authorize what the board refuses, but I will not stop advocating for what is just."
  *   **Counsel:** "You stated 'We wronged you,' which plaintiffs' counsel will cite as an admission of fault in pending litigation."
      *   *Response:* "I accept that risk; a safe speech would not be an apology."
