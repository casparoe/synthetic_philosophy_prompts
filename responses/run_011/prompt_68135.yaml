                  *   *Actually, the cleanest SSA for Hex:* Assume Blue wins. Red makes arbitrary move. Red pretends to be Blue. Red follows Blue's strategy. Since Red has an extra stone, Red can ensure Blue does *not* win (by blocking or completing the T-B connection herself). Since no draws, Red must win.
