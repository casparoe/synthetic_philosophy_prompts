              *   *Correction:* In standard SSA for Hex: Red plays 1st move. Then pretends to be 2nd player (Blue). Follows Blue's winning strategy (Top-Bottom). If the strategy calls for the occupied cell, play elsewhere. Red now has a Top-Bottom chain (because she followed Blue's strategy) PLUS an extra stone. But Red wins with Left-Right.
