      *   **Error:** SSA does **not** require the board to be geometrically symmetric, nor does it require the winning tasks to map via reflection. It requires the **move set** to be identical for both players (any empty cell). SSA works on rectangular Hex boards (asymmetric) provided the winning conditions are dual. The student conflates the *Symmetry Argument* (P1 wins because board is symmetric) with the *Strategy Stealing Argument* (P1 wins because extra stone is harmless).
      *   **Deduction:** -1 mark in (a) for incorrect justification, -1 mark in (b) for listing incorrect property.
  *   **(d) Connect Four Monotonicity:** The student claims *"Monotonicity should hold too: an extra disc... can't break a line."*
      *   **Error:** Connect Four is **not** monotonic in the sense required for SSA. Due to gravity, an "extra disc" changes the landing height of all subsequent discs in that column. You cannot treat the board state as "Blue's state + 1 Red stone"; the geometry of the column shifts. This invalidates the "play elsewhere" logic of SSA.
