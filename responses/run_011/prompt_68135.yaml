          *   *Verdict on (d):* The student claims Monotonicity holds. This is widely considered **False** in the context of SSA for Connect Four because of the gravity mechanic. The "extra stone" changes the geometry of future moves in that column. Therefore, the SSA does *not* cleanly apply to show P1 doesn't lose in the same way it does for Hex. (Note: It is known P1 wins C4, but not via simple SSA). The student's justification for monotonicity ("can't break a line") misses the structural impact of the extra piece on move availability/geometry.
