          *   *The "Extra Stone" Problem in C4:* In Hex, if the strategy says "play at $x$" and $x$ is occupied, you play at $y$. You now have stones at $x$ and $y$. In Connect Four, if the strategy says "play in Column 3", and Column 3 is full (or the specific cell is occupied), you cannot just play "somewhere else" freely; you must play in a different column, and the piece lands at the bottom of the *available* cells. The geometry changes.
