  *   **(a) The Chain Direction:** The student writes: *"Red ends up with everything S would have built for Blue... hence she gets a left-right chain."*
      *   **Error:** In the standard Strategy Stealing Argument (SSA), Red steals Blue's strategy (Top-Bottom). Red conceptually builds a **Top-Bottom** chain of Red stones. She does *not* build a Left-Right chain via the stolen strategy. The contradiction arises because Blue *cannot* have completed their Top-Bottom chain (since Red has blocked it or completed it first with an extra stone). The student claims the stolen strategy directly yields Red's winning condition. This is geometrically false.
      *   **Deduction:** -2 marks. This is a fundamental misunderstanding of the duality in the proof.
