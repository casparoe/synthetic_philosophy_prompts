                  *   Red wants L-R. Blue wants T-B.
                  *   Assume Blue has winning strategy $S$ (for T-B).
                  *   Red places stone $r_1$.
                  *   Red ignores $r_1$ and pretends to be Blue. She uses $S$ to place "Blue" stones (which are actually Red stones).
                  *   If $S$ says play at $r_1$, Red plays elsewhere.
                  *   Red now has a set of stones corresponding to a winning T-B chain for Blue, plus $r_1$.
                  *   *Problem:* Red wins L-R. Blue wins T-B. If Red builds a T-B chain, she hasn't necessarily won by Hex rules.
                  *   *Standard Fix:* The SSA usually relies on the fact that the game is symmetric *and* the extra stone doesn't hurt. But actually, the standard SSA for Hex relies on the fact that if Blue had a winning strategy, Red could steal it to prevent Blue from winning. Since there are no draws, Red must win.
