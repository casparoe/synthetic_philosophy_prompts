answer: |-
  You are effectively reconstructing the contemporary debate over the **Norm of Assertion**. Your intuitions are remarkably consistent with a specific philosophical position: **The Knowledge Norm of Assertion (KNA)**, likely with a **Contextualist** or **Pragmatic** overlay.

  The principle that gets the most of your cases is: **Assert $p$ only if you know $p$.**

  Here is how that principle handles your dossier, what it forces you to concede, and how it handles the arithmetic case.

  ### 1. How the Principle Fits Your Verdicts
  The Knowledge Norm explains the sharp distinctions you are drawing where a simple "Truth" or "High Probability" norm fails.

  *   **Lottery vs. Doctor:** This is the classic "Lottery Paradox." Statistically, the lottery ticket is a stronger bet than the medical treatment. But you don't *know* the lottery ticket lost until the draw; you only know the odds. With the doctor, medical consensus functions as a knowledge-generator in that context. KNA explains why the lottery assertion feels improper (lack of knowledge) despite the odds.
  *   **Fake Barns:** This is a classic Gettier case. The guy has a true belief and justification, but he doesn't *know* (because he could easily have been wrong). KNA correctly labels the assertion improper.
  *   **Hedging ("I think" vs. "Is"):** This is your strongest evidence for KNA. If the norm were merely "reasonable belief," the flat-out assertion would be fine. The fact that you feel the need to hedge ("I think") implies you are signaling that you lack *knowledge*, thereby satisfying the norm by lowering the strength of your claim.
  *   **Testimony:** You can know things on the word of a reliable friend. If you know it, you can assert it. The inability to *defend* it ("I just know") doesn't negate the knowledge.
  *   **Publicist:** You are right; this is a moral violation (lying), not an epistemic one. KNA is silent on lies (since you can't know what is false), but a broader norm of "Assert only what you know *and believe*" catches it.

  ### 2. The Costs: Which Verdicts Must You Adjust?
  To keep the Knowledge Norm, you have to refine three of your intuitions.

  **A. The Bridge (Retrospection)**
  *   *Your Flip-Flop:* "Was the assertion bad all along, or good when you made it?"
  *   *The Principle's Verdict:* **It was good when made.** Knowledge is fallible. If the inspection report was proper and gave you knowledge at time $T_1$, the collapse at $T_2$ does not retroactively strip you of knowledge at $T_1$.
  *   *The Adjustment:* You must accept that an assertion can be epistemically proper even if it turns out false. You might owe an apology for the *outcome*, but you don't owe an apology for the *assertion*. The norm evaluates your epistemic position *at the time of utterance*.

  **B. The Doctor & The Meeting (Future/Probabilistic)**
  *   *Your Intuition:* These are fine.
  *   *The Principle's Tension:* Strictly speaking, you cannot *know* a future contingent (the bus) or a probabilistic outcome (the 10% failure rate).
  *   *The Adjustment:* You have to adopt **Contextualism**. In a medical context, "9 out of 10" counts as knowledge *for the purposes of that conversation*. In a personal planning context, "settled intention" counts as knowledge of the future.
  *   *Alternatively:* You treat these as distinct speech acts. The Doctor is making a *prognosis*, not a flat fact-claim. You are making a *promise/intention*, not a prediction. If you treat them as flat factual assertions, KNA forces you to say they are technically improper (or at least loose talk), which conflicts with your gut. Most philosophers bite the bullet here: strictly speaking, the Doctor should say, "The treatment is highly effective," not "You will get better."

  **C. The Weather Glance**
  *   *Your Intuition:* Not fine.
  *   *The Principle's Verdict:* Matches perfectly. A glance does not yield knowledge of tomorrow's weather.

  ### 3. The Unlisted Case: Mental Arithmetic
  **Case:** You confidently assert a conclusion derived from two things you know, without checking the arithmetic.
  **Example:** You know the room is 12 feet wide and 12 feet long. You assert "The area is 144 square feet" without writing it down.

  **What the Principle Says:**
  This depends entirely on **Cognitive Competence**.
  *   **Simple Math:** If the arithmetic is within your reliable cognitive competence (e.g., $2+2$, or $12 \times 12$ for most adults), the Knowledge Norm says you *do* know the conclusion. Knowledge is closed under known entailment. If you know $A$ and $B$, and you know $A+B=C$ (implicitly), you know $C$. **Assertion is OK.**
  *   **Complex Math:** If the arithmetic is non-trivial (e.g., $347 \times 892$) and you just guess or do a quick, error-prone mental scan, you do not *know* the result. You have a belief, perhaps a true one, but it lacks the reliability required for knowledge. **Assertion is Not OK** (you should hedge or calculate).

  **Why this fits your pattern:**
  This aligns with your "Hedging" case. If you aren't sure of the math, you should say, "I *think* the area is..." Just like the meeting time. The moment you sense a possibility of error in your processing (the arithmetic), the flat-out assertion becomes improper under the Knowledge Norm.

  ### Summary
  The unifying principle is **The Knowledge Norm of Assertion**: *Assert $p$ only if you know $p$.*

  *   **It saves:** Lottery, Fake Barns, Hedging, Testimony, Weather.
  *   **It clarifies:** The Bridge (proper at the time, unlucky later), The Publicist (moral vs. epistemic).
  *   **It pressures:** The Doctor and Meeting (requires viewing them as contextual knowledge or non-factual speech acts).
  *   **It solves:** The Arithmetic case (OK if within reliable competence, Not OK if it exceeds your unverified processing reliability).

  If you accept this, you stop worrying about whether you turned out to be *right* (The Bridge) and start worrying about whether you were in a position to *know* at the moment you spoke.
