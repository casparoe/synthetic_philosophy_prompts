  12. *Wait, one nuance:* The prompt mentions Hofstadter's piece is "descended from his Scientific American column on default assumptions." This refers to "A Person Paper on Purity in Language" (1985), published in *The American Scholar*, but often associated with his Metamagical Themas column themes. I should treat the text as the "Person Paper."

  13. *Refining the "Class/Disability" point:* The reason class failed is likely because English lacks a "generic rich person" pronoun. The reason disability failed is because disability isn't typically a "default" category in the same way (nondisabled is the default, but not grammatically marked as "abled-man"). This confirms the *linguistic* contingency.

  14. *Final check on tone:* Keep it analytical, not preachy. The user is in a seminar; they want philosophical tools, not a lecture on DEI. Focus on the philosophy of language mechanics.

