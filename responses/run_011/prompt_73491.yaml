      *   Part 4: Structural vs. Contingent Success (Addressing the classmate's data).
      *   Part 5: Alternative Models (Cognitive/empirical over purely analogical).
      *   Conclusion: Summary of the audit.

  10. (Drafting content based on the above plan...) *Self-correction during drafting:* Ensure I explicitly address the "instructor's point" about the form of the defense. The instructor is right that the *logic* of the defense is the target, but the *efficacy* of the attack depends on the analogy holding water enough to generate the "wince."

  11. *Final Polish:* Check against the prompt requirements.
