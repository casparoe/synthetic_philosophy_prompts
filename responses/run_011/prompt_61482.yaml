      *   **Section (i):** Describes the "4/5ths annihilated" thought experiment. Explains price adjustment -> competitiveness -> inflow. Mentions the reverse case. Uses the "water finding its level" analogy.
      *   **Section (ii):** Addresses the law. Calls it useless/counterproductive. Mentions smuggling/premium. Argues for industry over bullion.
      *   **Section (iii):** Explains the "interval" (short-run non-neutrality). Distinguishes path vs. endpoint. Claims consistency.
      *   **Section (iv):** Discusses interest. Denies money quantity determines interest (Batavia/Jamaica example). Connects interest to industry/wealth. *Crucially:* Connects interest to the adjustment mechanism (specie drain -> reduced loanable funds -> higher interest -> checked investment -> reduced imports -> money returns). Concludes with a twist on mercantilism.

  3.  **Evaluate against Hume's Texts (*Of Money, Of Interest, Of the Balance of Trade*):**

      *   **(i) Specie-Flow Mechanism:**
