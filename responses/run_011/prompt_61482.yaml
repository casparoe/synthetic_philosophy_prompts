      *   *Correction:* A drain of specie *might* reduce riches (capital), but Hume insists they are distinct. If the student implies specie *is* the loanable fund, that's a load-bearing error. If they imply the drain causes a recession which reduces capital, that's more defensible but still not Hume's primary mechanism for *balance of trade* adjustment. Hume's balance of trade adjustment is price-based (*Of the Balance of Trade*), not interest-based.
      *   *Verdict:* This is a load-bearing error. It attributes a mechanism to Hume (interest-rate led balance adjustment) that belongs more to later classical economics or modern open-economy macro, not Hume's specific price-specie-flow.

  7.  **Finalizing the Mark:**
