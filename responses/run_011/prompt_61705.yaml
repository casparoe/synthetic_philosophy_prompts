      *   *Conclusion:* Summarize the stance.

  7.  **Refining the Argument (Self-Correction during drafting):**

      *   *Critique:* Did I commit enough?
      *   *Correction:* Ensure I don't say "SemVer could be X or Y." Say "SemVer *is* X."
