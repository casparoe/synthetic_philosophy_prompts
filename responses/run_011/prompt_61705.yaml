      *   *<1.0.0:* Everything is breaking. This acknowledges that no contract exists yet. Coherent with Contractual Reliance.
      *   *Philosophically Indefensible Point:* The treatment of security fixes and the "bug fix is breaking" rule reveals a tension between *Safety/Survival* and *Predictability*. The practice prioritizes Predictability over Correctness, which is defensible for coordination but indefensible if the software controls critical infrastructure (where correctness > continuity).

  5.  **Counterfactuals:**

