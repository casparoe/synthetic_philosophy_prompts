      *   *Value Specification:* Yes, user dependence *is* the value specification. SemVer assumes that "what works" is valuable, regardless of *why* it works (even if it relies on a bug). This is a revealed preference theory of value.
      *   *AI Impact Comparison:*
          *   *Deviation from Status Quo:* SemVer aligns closely here. The "status quo" is the previous version's behavior.
          *   *Deviation from Inaction:* No. SemVer doesn't care what would happen if the library didn't exist.
          *   *Reachability/Option Value:* SemVer cares about *actualized* options (current code paths), not *potential* options (future code paths), unless those are part of the public API contract.
          *   *Designated Variables:* SemVer treats the *Public API surface* as the designated variables. Everything else is internal.

  3.  **Synthesize the "Single Best Reconstruction":**

      *   *Thesis:* SemVer presupposes a **Contractual Reliance Theory of Impact**.
      *   *Core Tenet:* Impact is not ontological (change in the world) but relational (change in the contract between provider and consumer).
