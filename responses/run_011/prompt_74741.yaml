answer: |-
  **To:** Author
  **From:** Senior Colleague
  **Re:** Workshop Prep — Criminal Law Theory Series

  **Audience Analysis: Substance vs. Decoration**
  In this room, "substantive" means adjudicable, institutional, and consequential for the machinery of the state. They treat a claim as substantive if it maps onto a rule of evidence, a sentencing guideline, a constitutional standard, or a prosecutorial discretion policy. If you cannot tell them who decides, when they decide, and what happens to the defendant if they decide in your favor, they will treat your argument as philosophical decoration. They view "standing" as a gatekeeping doctrine (Article III, prudential standing), not a moral condition. Consequently, any talk of "normative commons" or "second-personal authority" risks sounding like metaphorical flourishes unless you tie them directly to institutional competence or doctrinal coherence. Nuance that complicates application is decoration; nuance that prevents unjust application is substance. Your goal is to convince them that your moral distinction has legal cash value, without promising a procedural revolution you cannot deliver.

  ***

  ### **The Eight Objections (Ordered by Damage Potential)**

  **1. The "Motion to Dismiss" Problem (Operationalization)**
  *   **Who:** Former Federal Prosecutor or Criminal Procedure Scholar
  *   **The Objection:** "You've spent forty pages establishing that the community lacks standing to blame under certain conditions. I need to know what happens in court on Tuesday. Are you proposing a new affirmative defense? A motion to dismiss based on selective enforcement? If a defendant raises this, what is the standard of proof? Who bears the burden? If you say this is merely 'moral' and doesn't touch the legal process, then why are we discussing it in a law workshop? If it does touch the process, you're asking judges to conduct historical audits of every norm before allowing a conviction. That's unadministrable."
  *   **The Reply:** "I am not proposing a new motion to dismiss, and I want to be clear that my claim about standing to blame is distinct from the state's legal authority to punish. The state derives its authority from statute and constitution, not moral standing. My claim targets the *normative force* of the condemnation accompanying the punishment, and the actors voicing it. However, this does have procedural implications. It suggests that when asymmetric enforcement is proven—as in selective prosecution claims—the *condemnation* component of sentencing should be muted, even if the confinement remains necessary for safety. It argues for a decoupling of liability from moral censure in tainted contexts. We already do this with juveniles or mitigated capacity; I'm suggesting we do it for structurally tainted norms. It doesn't stop the trial, but it changes the script of the judgment."
  *   **Soft Spot:** This retreats from the strong thesis. If the state can punish without standing to blame, you've conceded that legal authority is independent of the normative commons you described. You risk making the theory legally inert while claiming it matters for law.

  **2. The Victim Silencing Problem**
  *   **Who:** Career Public Defender or Victims' Rights Scholar
  *   **The Objection:** "Let's say a member of a subordinated group is harmed by a peer within that same group. The norm against violence has been enforced asymmetrically by the state. On your view, does the victim lack standing to blame the perpetrator because the community's commons is depleted? You seem to be saying that because the state messed up, the victim loses their moral voice. That sounds like you're disarming the vulnerable twice: first by the state's neglect, and second by your theory forbidding them from holding their own accountable."
  *   **The Reply:** "This is the crucial distinction between *public norm-affirming blame* and *private resentment*. The victim never loses the standing to resent the wrong done to them personally; that is a function of the injury, not the community's record. My claim only restricts the invocation of the *shared public norm* as a tool of general accountability. The victim can say, 'You hurt me,' but the community struggles to say, 'You violated *our* law,' if 'our law' has been weaponized against them. I am protecting the victim's personal voice by refusing to co-opt it into a public practice that has been corrupted. We shouldn't ask the victim to carry the burden of a broken system."
  *   **Soft Spot:** This relies on a private/public distinction that may not hold in practice. In criminal law, the victim's blame is often channeled through the state (victim impact statements). If the state lacks standing, can the victim use the state to voice theirs? You are assuming a separation that the criminal process actively collapses.

  **3. The "Everything is Tainted" Problem (Radical Skepticism)**
  *   **Who:** Legal Historian of Urban Policing
  *   **The Objection:** "You say the deficit is indexed to specific norms. But given the history of American policing and sentencing, can you name a single serious criminal norm that hasn't been enforced asymmetrically along race or class lines over the last century? If the asymmetry is the rule rather than the exception, your theory doesn't just deplete standing for drug offenses; it depletes standing for murder, rape, and theft. You risk arguing that in a society like ours, essentially no one has standing to blame anyone for anything. That makes the theory extensionally empty."
  *   **The Reply:** "I concede that the depletion is widespread, but I deny it is total. The test is not perfection, but whether the asymmetry is acknowledged and being repaired. There are pockets of practice—community-based restorative justice programs, specific jurisdictions with verified bias corrections—where the mandate is being rebuilt. My claim is meant to be a diagnostic tool, not a nihilistic verdict. It forces us to identify *which* norms are still viable for public condemnation and which are currently toxic. If that means we have less standing to blame than we think, that is a feature, not a bug. It forces humility."
  *   **Soft Spot:** You are vague on "acknowledged and repaired." If almost no norm meets this bar, you are effectively a skeptic despite your denials. You risk admitting the theory is true but practically useless for current cases.

  **4. The Individual Innocence Problem**
  *   **Who:** Retributivist Punishment Theorist
  *   **The Objection:** "I understand the collective responsibility angle, but why does *my* standing depend on *your* misconduct? If I am a prosecutor who has never discriminated, or a citizen who protested the asymmetry, why am I silenced? You say the mandate is held jointly. But moral responsibility is usually individual. You are asking me to bear a disability caused by others. That violates the liberal principle that I am only responsible for what I do."
  *   **The Reply:** "Because the standing to blame in the public register is not a personal property; it's a role within an institution. Think of it like a judge recusing themselves not because they are biased, but because the *court's* integrity is compromised. You aren't being punished for others' sins; you are being asked to recognize that the *authority* you are invoking relies on a practice you did not build alone. You can still feel resentment, but you cannot claim to speak for a 'just community' when that community is a fiction. It's not about your guilt; it's about your proxy."
  *   **Soft Spot:** This conflates institutional role with moral standing. A private citizen isn't a judge. If you argue citizens are like officials, you overstate the state's reach. If you argue they aren't, the "commons" metaphor breaks down because citizens aren't bound by institutional recusal rules.

  **5. The Terminological Hijacking Problem**
  *   **Who:** Constitutional Law Scholar
  *   **The Objection:** "You're using the word 'standing.' In law, standing requires injury in fact, causation, and redressability. You're using it to mean 'moral authority.' This isn't just a metaphor; it's a category error that invites confusion. Are you arguing for third-party standing for defendants? Are you arguing the state lacks Article III standing? If you're just doing moral philosophy, why borrow the legal term of art that implies judicial power?"
  *   **The Reply:** "I borrow the term deliberately to signal that this isn't just about feelings; it's about authority to act. Legal standing is about who gets to invoke the court's power. Moral standing to blame is about who gets to invoke the community's normative power. The parallel is structural: both are gatekeeping concepts that prevent unauthorized actors from triggering consequences. I'm not arguing for Article III changes; I'm arguing that the legal concept of standing rests on a moral substrate that we ignore at our peril. When the moral substrate rots, the legal standing becomes hollow, even if the docket number remains."
  *   **Soft Spot:** Law scholars hate having their terms repurposed without doctrinal payoff. You risk sounding like you want legal change while disclaiming it. You need to be clearer that this is an analogical argument, not a doctrinal one.

  **6. The Incentive Problem**
  *   **Who:** Law & Economics or Policy Scholar
  *   **The Objection:** "If defendants know that proving asymmetric enforcement reduces the standing of the community to blame them, haven't you created a perverse incentive? They will litigate history instead of facts. They will argue that *any* enforcement is asymmetric to escape moral condemnation. You're giving them a tool to delegitimize their own conviction without challenging the evidence. How do you prevent this from becoming a loophole?"
  *   **The Reply:** "This theory doesn't change the verdict, only the condemnation. It doesn't give a tool to escape confinement if the evidence holds. It removes the *stigma*, not the sanction. In fact, it might reduce litigation because it offers a middle ground: the state doesn't have to dismiss the case, but it must acknowledge its own tainted hands in the sentencing memo. It lowers the stakes of the selective prosecution claim by separating liability from censure. It's a pressure valve, not a loophole."
  *   **Soft Spot:** Defendants care about stigma because it affects parole, employment, and future sentencing. Reducing standing to blame has real-world consequences. You are underestimating the practical value of "just" the moral component.

  **7. The Private Resentment Escape**
  *   **Who:** Philosophy Colleague (or Law Scholar with Phil Interest)
  *   **The Objection:** "You distinguish between public blame and private resentment. But isn't all criminal law essentially public blame? If I can't blame publicly, and the state is the primary vehicle for public blame, haven't you just moved the problem? If the state can't blame, and individuals can't blame publicly, where does the norm affirmation happen? You seem to be pushing everything into the private sphere, which makes the criminal law irrelevant to your theory."
  *   **The Reply:** "I'm not pushing it to the private sphere; I'm pushing it to the *repair* phase. The norm affirmation happens once the asymmetry is addressed. Until then, the criminal law should operate more like a quarantine than a sermon. We isolate for safety without claiming moral superiority. My theory demands that we stop pretending the current process is affirming shared values when it is actually enforcing hierarchy. It makes criminal law more honest, not irrelevant. It says: 'We are stopping you because we must, not because we are righteous.'"
  *   **Soft Spot:** This transforms criminal law into pure risk management. That is a massive concession to consequentialism that might alienate the retributivists in the room. It risks making the law morally hollow.

  **8. The Repair Mechanism Problem**
  *   **Who:** Legal Historian or Institutional Scholar
  *   **The Objection:** "You say the deficit is repairable by acknowledgment and redress. Who does the repairing? The legislature? The courts? The community? If you don't know who fixes the commons, you can't tell us when standing is restored. You've built a theory of depletion without a theory of replenishment. That leaves us in the deficit forever."
  *   **The Reply:** "I am deliberately agnostic on the specific mechanism because it varies by institution. For the police, it might be consent decrees. For the community, it might be truth and reconciliation processes. The key is that the repair must be public and acknowledged. My point is that standing is not restored by silence or time alone; it requires active restitution. I'm setting the condition for restoration, not drafting the legislation. The theory tells us *what* must happen, not exactly *how* every jurisdiction must do it."
  *   **Soft Spot:** This looks like a punt. If you can't identify the agent of repair, the condition is impossible to meet. It makes the restoration theoretical rather than practical, reinforcing the skepticism that the deficit is permanent.

  ***

  ### **Concessions to Make in the First Ten Minutes**

  1.  **Concede the Terminological Risk:** Acknowledge upfront that you are using "standing" analogically, not doctrinally. Say: "I know 'standing' has a specific life in Article III. I am using it to describe a moral precondition that I believe undergirds the legal concept. I am not asking you to rewrite the Federal Rules."
  2.  **Concede the Administrative Burden:** Admit that measuring asymmetry is hard. Do not promise a simple test. Say: "I am not proposing a checklist for judges. I am proposing a lens for evaluating the legitimacy of our condemnatory practices. Sometimes the lens will show blur."
  3.  **Concede the Individual Hardship:** Acknowledge that this hurts innocent blamers. Say: "I know this feels unfair to the individual who wants to condemn a wrongdoer. But the fairness of the practice outweighs the individual's desire to speak in that specific register."

  ***

  ### **The Single Reply That Must Land**

  **The Operationalization Objection (#1).**
  If you fail to convince them that this has *any* purchase on the legal process without promising a revolution you can't deliver, they will categorize the paper as "pure philosophy" and disengage. You must land the distinction between **liability** (which remains) and **condemnation** (which is muted). If you can convince them that the criminal law currently conflates these two and that separating them is administratively possible (e.g., in sentencing statements, jury instructions, or prosecutorial memos), you survive. If you suggest this requires dismissing cases, you will be eaten alive on institutional competence grounds.

  ***

  ### **The "Hope Nobody Asks" Question**

  **The Question:** "If asymmetric enforcement is the historical baseline for most criminal norms in this country, and if repair requires acknowledgment that hasn't happened, aren't you admitting that **no one**—not the state, not the victim, not the community—currently has standing to blame anyone for almost any crime? And if so, why are we holding criminal trials at all?"

  **The Least Bad Answer:** "I am admitting that the *condemnatory* function of our trials is currently compromised, not the *safety* function. We hold trials to determine factual guilt and assess risk, not to perform moral rituals we have no right to perform. We can incarcerate for incapacitation while suspending the claim that we are 'holding accountable' in a robust moral sense. It means our system is doing less than it claims, not nothing."

  **Assessment:** This answer is bad enough that you should soften the thesis. It edges too close to legitimizing a purely preventive detention system, which is anathema to criminal law theorists who value punishment as desert. It suggests the current system is a lie.
  **Recommendation:** Before writing up, narrow the scope. Limit the claim to **specific categories of offenses** (e.g., public order, drug crimes) where asymmetry is most documented, rather than implying it applies to *malum in se* crimes like murder. This prevents the "Radical Skepticism" objection from swallowing the whole theory. Allow that some norms (e.g., violence against persons) may retain standing even if enforcement is imperfect, provided the asymmetry isn't the *defining feature* of that norm's administration. This saves the theory from nihilism.
