      *(Self-Correction during drafting)*: I need to be careful not to dismiss the Scalers as "cold" or Objectors as "soft." In EA terms, Scalers are worried about *neglect vs. tractability* and *opportunity cost*. Objectors are worried about *moral cluelessness*. Frame it in those terms.

      *(Final check on User's Hypothesis)*: The user said "Scalers answering Evidence, Objectors hearing Ground/Weight." I think it's slightly different: Scalers are using Evidence to determine Weight directly. Objectors say Evidence determines Status, Weight is separate. I will refine this.

