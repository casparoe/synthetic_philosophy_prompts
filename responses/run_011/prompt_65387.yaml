answer: |-
  # Handout: Deconstructing "It's the Thought That Counts"
  **Context:** The Drunk Driver Case (One kills, one doesn't. Both drove equally drunk.)

  The proverb "It's the thought that counts" sounds like an answer to moral luck, but it is actually a container for several different claims. Some are trivial, some are false, and only one or two actually do the philosophical work required to say the two drivers are equally blameworthy.

  Below are the precise meanings hidden inside that sentence, evaluated for their usefulness in this debate.

  ---

  ## Part 1: What is "The Thought"?
  *In the drunk driver case, neither driver intended to kill anyone. So what "thought" are we talking about?*

  ### 1. The Specific Intent Reading
  *   **Definition:** "The thought" = The specific desire or plan to bring about the bad outcome (e.g., "I want to hit that pedestrian").
  *   **Commitment:** You are only blameworthy if you specifically aimed at the harm.
  *   **Verdict:** **Irrelevant / Evasive.**
  *   **Why:** Neither driver intended to kill. If this is what the proverb means, it doesn't apply to the case. It changes the subject from negligence to malice. It leaves the intuition ("the killer is worse") completely untouched because it fails to address the recklessness that *was* present.

  ### 2. The Conscious Choice Reading
  *   **Definition:** "The thought" = The voluntary decision to engage in the risky behavior (e.g., "I choose to drive drunk").
  *   **Commitment:** Blame attaches to the moment of risk-taking, not the result of the risk.
  *   **Verdict:** **Substantive & Defensible.**
  *   **Why:** This is the only reading that blocks the intuition that the killer is morally worse. It claims both drivers made the exact same moral error at the exact same moment. The death is a consequence, not a new moral failure.

  ### 3. The Character Reading
  *   **Definition:** "The thought" = What this action reveals about your underlying virtues or vices.
  *   **Commitment:** We blame people for being the *kind of person* who would do this.
  *   **Verdict:** **Mixed.**
  *   **Why:** It suggests both drivers have equally bad character. However, opponents might argue that causing a death reveals *more* about your character (e.g., perhaps you were *more* drunk than you realized). This reading often slides back into judging by outcomes.

  ---

  ## Part 2: What does "Counts" mean?
  *"Counts" is the most dangerous word. It can mean "matters for blame," "matters for prison," or "matters for everything."*

  ### 4. The "Counts for Blame" Reading
  *   **Definition:** Outcomes don't change how *bad* you are, even if they change what happens to you.
  *   **Commitment:** The driver who killed is not a worse *person*, but has worse *problems*.
  *   **Verdict:** **Substantive.**
  *   **Why:** This distinguishes **Moral Blameworthiness** (internal) from **Moral Luck/Consequences** (external). It allows you to say, "You are equally guilty of the vice, but the unlucky one has more to atone for."

  ### 5. The "Counts for Punishment" Reading
  *   **Definition:** Outcomes shouldn't change how the law treats you.
  *   **Commitment:** Vehicular homicide and drunk driving should carry the same sentence.
  *   **Verdict:** **Controversial / Generally Rejected.**
  *   **Why:** While philosophically consistent with the "Conscious Choice" reading, almost all legal systems reject this. We punish harm more than risk. If a student means this, they are arguing against the legal system, not just moral luck.

  ### 6. The "Counts for Everything" Reading
  *   **Definition:** Outcomes are morally irrelevant in every way (no extra regret, no extra duty to compensate).
  *   **Commitment:** The driver who killed owes the victim's family nothing more than the driver who got home safe.
  *   **Verdict:** **False / Implausible.**
  *   **Why:** Even if they are equally *blameworthy*, the unlucky driver has created a mess that needs fixing. Denying this makes the moral theory look detached from reality.

  ---

  ## Part 3: The Viable Combinations
  *Only two combinations of the above actually answer the student's challenge.*

  ### Combination A: The Control Principle (The Strong Defense)
  *   **Formula:** "The Thought" = **Conscious Choice** + "Counts" = **For Blame Only**.
  *   **Claim:** "Both drivers chose the same risk. Therefore, they are equally blameworthy. The death is bad luck, not bad morality."
  *   **Does it block the intuition?** **Yes.** It forces the class to admit that if they think the killer is worse, they are judging based on luck, not control.
  *   **Weakness:** It requires accepting that moral worth is totally isolated from the real-world impact of our actions.

  ### Combination B: The Regret Distinction (The Compromise)
  *   **Formula:** "The Thought" = **Conscious Choice** + "Counts" = **For Blame, Not Regret**.
  *   **Claim:** "They are equally to blame, but the killer has special obligations now (funeral costs, prison, guilt) that the lucky driver doesn't."
  *   **Does it block the intuition?** **Partially.** It admits the killer is "worse off," but denies they are "worse morally."
  *   **Weakness:** Students often conflate "worse off" with "worse person." This requires careful distinction.

  ---

  ## Part 4: Stress-Testing the Proverb
  *If we accept Combination A (The Control Principle), does it hold up elsewhere?*

  ### 1. The Negligent Surgeon
  *   **Case:** Two surgeons skip the same safety check. Patient A lives; Patient B dies.
  *   **Test:** Does "the thought counts" mean they are equally bad doctors?
  *   **Result:** **Yes.** If the negligence was identical, the moral failure was identical. The death is tragic, but it doesn't make Surgeon B more *negligent* than Surgeon A.
  *   **Problem:** Families of Patient B will (rightfully) feel Surgeon B is worse. The proverb asks them to separate their grief from their moral judgment.

  ### 2. Attempted vs. Completed Murder
  *   **Case:** Shooter A aims to kill, misses due to wind. Shooter B aims to kill, hits.
  *   **Test:** Is Shooter A less evil than Shooter B?
  *   **Result:** **No.** The "Thought" (intent to kill) was identical. The proverb correctly identifies them as morally equal, even if the law punishes B more severely.
  *   **Success:** This is the strongest case for the proverb.

  ### 3. The "Luck of the Thought" (The Fatal Objection)
  *   **Case:** Person A never drives drunk because they have a calm temperament. Person B never drives drunk because they struggle with impulse control but succeeded *this time*. Or: Person C didn't kill anyone because they never had the chance to be reckless.
  *   **Test:** Is your "Thought" really under your control?
  *   **Result:** **Problematic.** Your ability to form good thoughts depends on your upbringing, your brain chemistry, and your circumstances.
  *   **The Trap:** If "the thought" is determined by luck (genetics, parents, poverty), then saying "it's the thought that counts" just **relocates the moral luck**. It moves the luck from the *outcome* (the crash) to the *agent* (the mind).
  *   **Verdict:** The proverb stops the regress of luck only if you believe we have total free will over our own thoughts. If you don't believe that, the proverb doesn't solve the problem; it just hides it inside the head.

  ---

  ## Part 5: Summary for Discussion
  *Use this to restart the conversation next week.*

  1.  **Check the Intent:** Ask the student: "Did the driver *think* about killing the pedestrian?" If no, then "the thought" must mean "the decision to drive drunk."
  2.  **Check the Count:** Ask: "Counts for what? For how bad a person they are? Or for how much prison time they get?"
  3.  **The Hard Question:** "If the thought is all that counts, does that mean a person who *wants* to kill but fails is just as evil as a person who *does* kill? And if so, why does the law treat them differently?"
  4.  **The Trap:** "If we say 'it's the thought,' are we ignoring that the dead pedestrian matters? Or are we just saying the driver's *blame* is the same, even if the *tragedy* is different?"

  **Bottom Line:** The proverb is a valid defense against moral luck **only if** you restrict it to *blameworthiness for voluntary risks*. It fails if you use it to deny that outcomes create different obligations, or if you ignore that our thoughts are also products of luck.
