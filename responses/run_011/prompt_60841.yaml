answer: |-
  Here is the principle that best unifies your intuitions, the clauses required to operationalize it, the application to your new cases, and the specific verdict you must surrender to maintain consistency.

  ### The Principle: Discursive Integrity

  **Speech is protected when it functions as a claim inviting rebuttal within a public forum. It loses protection when it functions as a non-discursive act that forecloses rational engagement to inflict specific harm on safety, democratic process, or civic standing.**

  This principle shifts the focus from *what* is said (content) to *how* it operates (function). It protects the "marketplace of ideas" but punishes the sabotage of the marketplace or the participants.

  ### The Clauses

  **1. The Intimidation Clause**
  *   **Rule:** Speech acts that function as threats to physical safety or equal civic standing are punishable.
  *   **Cases:** This covers the **cross burning** (a threat of violence, not an argument) and the **French comedian** (gestures functioning as signals for hostility against a protected group).
  *   **Rationale:** These are not claims to be debated; they are weapons meant to silence or terrify.

  **2. The Fraud Clause**
  *   **Rule:** Speech fabricated to deceive in time-sensitive democratic processes is punishable.
  *   **Cases:** This covers the **AI deepfake**. Unlike a lie told in an op-ed, a deepfake released before an election is a technological forgery designed to bypass deliberation entirely.
  *   **Rationale:** It sabotages the mechanism by which the public forms judgment.

  **3. The Civic Standing Clause**
  *   **Rule:** Speech that denies the historical reality of atrocities foundational to a nation's constitutional identity is punishable *within that jurisdiction*.
  *   **Cases:** This covers **Holocaust denial in Germany**. In this specific context, the denial is not treated as a historical claim but as an act of aggression against the dignity and standing of Jewish citizens.
  *   **Rationale:** Some facts are constitutive of the civic peace; denying them is an attack on the polity itself, not a contribution to it.

  **4. The Good Faith Clause**
  *   **Rule:** Speech adhering to methodological norms of inquiry or clear contextual absurdity is protected.
  *   **Cases:** This covers the **academic article** (offers data/method for rebuttal), the **Danish cartoons** (provocative commentary, not a threat), the **jokey tweet** (context negates intent to terrorize), and the **neo-Nazi march** (ideological expression, however vile).
  *   **Rationale:** These invite engagement, rejection, or counter-speech rather than inflicting immediate harm.

  ### Application to New Cases

  **1. Swiss conviction for denying the Armenian genocide**
  *   **Verdict:** **Punishable.**
  *   **Reasoning:** Under the **Civic Standing Clause**, if Switzerland has legally recognized the Armenian genocide as a foundational historical fact essential to its current human rights commitments, denying it functions as an attack on the civic standing of Armenian-Swiss citizens, analogous to the German statute. It is not treated as historical inquiry but as hate speech.

  **2. A platform that algorithmically amplifies a slur without composing it**
  *   **Verdict:** **Liable (Punishable/Regulable).**
  *   **Reasoning:** Under the **Intimidation Clause**, algorithmic amplification transforms a private slur into a public threat. By optimizing for engagement, the platform is not acting as a neutral forum but as an active participant in the harm, effectively functioning as a "megaphone" that turns speech into a weapon of harassment. The platform's act is non-discursive; it is a distribution mechanism for harm.

  ### The Verdict You Must Abandon

  To maintain the integrity of this principle, you must abandon your protection of the **neo-Nazi group marching through a town of Holocaust survivors**.

  **Why:** Your verdict on the **cross burning** (punishable as intimidation) and the **German Holocaust denial statute** (punishable as an attack on civic standing) creates a logical pincer that crushes the Skokie-style march verdict.

  If a cross on a lawn is a punishable threat because of its context and history, a march by neo-Nazis through a town populated by survivors is functionally identical: it is a display of force aimed at a specific group to remind them of their vulnerability. If you accept the German logic that the *dignity and safety of survivors* can outweigh abstract speech rights regarding historical atrocities, you cannot consistently protect a march designed to terrorize those same survivors.

  You must choose: either the cross and the German statute are wrong (and the march is protected), or the march is punishable intimidation. Given your strong intuitions on the cross, the deepfake, and the German law, the march is the outlier. Protecting it requires a level of viewpoint neutrality that your other verdicts explicitly reject.
