  # Activity: The Impossible Vote

  **Goal:** Demonstrate that in any voting system with three or more options, voters sometimes have an incentive to misrepresent their preferences (Gibbard-Satterthwaite Theorem), and that fixing this requires sacrificing other democratic ideals (Arrow's Impossibility Theorem).
  **Time:** 55 Minutes
  **Participants:** 20 Students
  **Materials:** See list below.

  ---

  ## 1. Materials List

  *   **20 Role Cards:** Printed on cardstock. (15 identical "Bloc" cards, 5 identical "Swing" cards—see *Role Deck* below).
  *   **20 Ballot Slips:** Small pieces of paper.
  *   **1 Collection Box:** A backpack or hat.
  *   **Payoff Tokens:** 60 small candies (e.g., Hershey's Kisses) or "Club Points" slips.
  *   **Whiteboard & Markers:** For tallying.
  *   **Timer:** Visible to you.
  *   **Leader's Cheat Sheet:** (The math and script below—keep this hidden).

  ---

  ## 2. The Role Deck (Private Preferences)

  Distribute these randomly. Do not let students show each other.

  **Type A: "The Pizza Bloc" (6 Students)**
  > **Your True Preferences:**
  > 1. Pizza Party (P)
  > 2. Movie Marathon (M)
  > 3. Escape Room (E)
  >
  > **Your Goal:** Maximize your candy.
  > *   If **P** wins: You get **3 candies**.
  > *   If **M** wins: You get **2 candies**.
  > *   If **E** wins: You get **1 candy**.

  **Type B: "The Movie Bloc" (7 Students)**
  > **Your True Preferences:**
  > 1. Movie Marathon (M)
  > 2. Escape Room (E)
  > 3. Pizza Party (P)
  >
  > **Your Goal:** Maximize your candy.
  > *   If **M** wins: **3 candies**.
  > *   If **E** wins: **2 candies**.
  > *   If **P** wins: **1 candy**.

  **Type C: "The Escape Bloc" (7 Students)**
  > **Your True Preferences:**
  > 1. Escape Room (E)
  > 2. Movie Marathon (M)
  > 3. Pizza Party (P)
  >
  > **Your Goal:** Maximize your candy.
  > *   If **E** wins: **3 candies**.
  > *   If **M** wins: **2 candies**.
  > *   If **P** wins: **1 candy**.

  *(Note: There are 20 cards total. 6 Type A, 7 Type B, 7 Type C.)*

  ---

  ## 3. Leader's Math (For Your Eyes Only)

  **The Profile:**
  *   6 Voters: P > M > E
  *   7 Voters: M > E > P
  *   7 Voters: E > M > P

  **Rule 1: Plurality (The Game Round)**
  *   **Sincere Voting:** P=6, M=7, E=7.
      *   *Result:* Tie between M and E.
      *   *Tie-Break:* You (the Chair) flip a coin. If it lands **E**, Type A (Pizza) gets their **last choice** (1 candy).
      *   *Incentive:* If the 6 Type A voters strategically vote **M** instead of P:
      *   *Strategic Count:* P=0, M=13, E=7. **M Wins.**
      *   *Payoff:* Type A gets **2nd choice** (2 candies).
      *   *Gain:* +1 Candy per voter. Strict incentive to lie.

  **Rule 2: Instant Runoff (IRV)**
  *   **Sincere Voting:** P (6) is eliminated first. P votes transfer to M (since P>M>E).
      *   *Result:* M=13, E=7. **M Wins.**
      *   *Incentive:* Type A gets 2nd choice sincerely. No incentive to lie in *this specific profile* for IRV.
      *   *Note for Debrief:* Tell students: "In other profiles, IRV fails too. This profile was chosen to make Plurality fail visibly." (See *Limitations* section).

  **Rule 3: Borda Count**
  *   **Sincere Voting:**
      *   P: (6×2) + (7×0) + (7×0) = 12
      *   M: (6×1) + (7×2) + (7×1) = 27
      *   E: (6×0) + (7×1) + (7×2) = 21
      *   *Result:* **M Wins.**
      *   *Incentive:* Type A gets 2nd choice.
      *   *Note:* To show Borda manipulation, Type A would need to "bury" M by voting P > E > M.
      *   *New Borda:* P=12, M=(6×0 + 14)=14, E=(6×1 + 7×1 + 14)=27. **E Wins.**
      *   *Result:* Type A gets Last Choice. Borda is harder to manipulate *successfully* without risk, but the *attempt* proves the system is vulnerable.

  ---

  ## 4. Minute-by-Minute Timeline

  | Time | Activity | Instructions |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Hand out Role Cards. Tell them: "Keep this secret. Your goal is to get the most candy based on your card." |
  | **05-10** | **Round 1** | **Rule:** Plurality (Vote for 1). "Vote for your *favorite*." Collect ballots. |
  | **10-15** | **Count** | Tally on board. (Expect P=6, M=7, E=7). Flip coin for tie. (Rig or hope for E). |
  | **15-20** | **Payoff** | Distribute candy based on the winner and their cards. **Type A will get 1 candy.** |
  | **20-25** | **The Pivot** | Ask: "Type A, are you happy?" (No). "Could you have done better?" Allow 2 mins discussion. |
  | **25-30** | **Revote** | "You can vote again. Same rule. Keep cards secret." (Type A should now vote M). M Wins. Type A gets 2 candies. |
  | **30-35** | **Reflection** | "You changed the result by not voting your favorite. Was that honest?" |
  | **35-45** | **Round 2** | **Escape Hatch:** Random Dictator. "We pick one name. Their vote decides." Run it. |
  | **45-55** | **Debrief** | Guided questions (see below). Reveal theorem names at the very end. |

  ---

  ## 5. Running the Session

  ### Introduction (0-5 mins)
  "Welcome. We're deciding the end-of-year event. Options: **Pizza (P)**, **Movie (M)**, **Escape Room (E)**.
  You have a role card. It tells you what you prefer and how many candies you get.
  **Rule:** You want to maximize your candy. You do not need to vote honestly. You do not need to tell anyone your card.
  **Voting:** Write one letter on your slip. P, M, or E."

  ### Round 1: The Trap (5-20 mins)
  1.  **Instruction:** "Most people vote for their favorite. Let's try that." (Do not explicitly forbid strategy yet, but imply sincerity).
  2.  **Counting:** Collect slips. Count publicly on the board.
      *   *Expected:* P: ||||||, M: |||||||, E: |||||||
  3.  **Tie-Break:** "It's a tie between M and E. I'll flip a coin." (If it lands M, Type A is happy. If it lands E, Type A is angry. **If M wins naturally, tell them:** "In many elections, ties go to the status quo or a random draw. Let's assume E wins for the sake of argument," and proceed as if E won).
  4.  **Payoff:** "E Won."
      *   Type B & C: Collect 2 or 3 candies.
      *   Type A: Collect **1 candy**.
  5.  **The Spark:** Look at the Type A students. "You got the fewest candies. You voted for your favorite, and you lost. Is there anything you could have written on that slip to get more candy?"
      *   *Wait for them to realize:* If they vote **M**, M wins (13 votes), and they get 2 candies.
      *   *If they don't see it:* "What if the 6 of you agreed to vote M?"
      *   *If they say "That's lying":* "The rule says maximize candy. It doesn't say 'be honest'."

  ### Round 2: The Escape Hatch (35-45 mins)
  "Okay, voting for favorites allows strategy. Let's try a different rule to stop it."
  **Rule:** **Random Dictator.**
  1.  "Put your names in this hat. I draw one name."
  2.  "That person's *sincere* favorite wins. Everyone gets candy based on that."
  3.  **Run it:** Draw a name. Ask them: "What is your true favorite?" (They will say truth, because lying risks their own favorite losing).
  4.  **Result:** One person decides. The outcome is random, but no one lied.

  ### Debrief: The Impossible Theorem (45-55 mins)
  *Do not write formulas. Ask questions.*

  1.  **On Manipulation:** "In Round 1, did anyone have a reason to write something other than their favorite?"
      *   *Target Answer:* Yes, to avoid their worst case.
      *   *You:* "So Plurality isn't 'strategy-proof'."
  2.  **On Rules:** "We tried Plurality. It allowed strategy. Would IRV or Borda have fixed it?"
      *   *You:* "Mathematically, no. With 3 options, *every* point-based or ranking system has a scenario where lying pays."
  3.  **On Round 2 (Random Dictator):** "In Round 2, did anyone lie?"
      *   *Target Answer:* No.
      *   *You:* "Why?"
      *   *Target Answer:* Because I might be the decider.
      *   *You:* "What did we give up to make honesty the best policy?"
      *   *Target Answer:* We gave up **Determinism** (the outcome isn't certain until the name is drawn) or **Equality** (one person became a dictator).
  4.  **The Conclusion:** "There is a mathematical proof that says: If you want a voting system that is (1) Deterministic, (2) Has 3+ Options, (3) Lets anyone win, and (4) No Dictator... **it will be manipulable.** You have to drop one."
  5.  **The Reveal:** "This is the **Gibbard-Satterthwaite Theorem** (1973). The ranking version is **Arrow's Impossibility Theorem** (1951). You just proved it with candy."

  ---

  ## 6. Troubleshooting: What Will Go Wrong

  **1. Counting Errors / Time Overrun**
  *   *Risk:* Counting 20 ballots takes too long; discussion drags.
  *   *Fix:* Pre-draw the tally columns on the board. Ask for a volunteer "Election Commissioner" to tally while you manage time. If you pass 40 minutes, cut the Round 2 *play* and describe it: "Imagine we picked one name..."

  **2. The Reluctant Manipulator**
  *   *Risk:* Type A students vote sincerely in Round 1 and refuse to lie in Revote due to moral hesitation.
  *   *Fix:* Reframe the goal. "This is a simulation. Your job is to test the system, not be a good citizen. If the system rewards lying, find the bug."

  **3. Someone Blurts the Answer**
  *   *Risk:* A student who knows game theory says "Just bury the candidate!" in Round 1.
  *   *Fix:* "Hold that thought. Let's see what happens if everyone votes sincerely first. We need the baseline."

  **4. The "Second Voter" Problem**
  *   *Risk:* In Revote, only 3 of the 6 Type A students lie. M still doesn't win.
  *   *Fix:* "Look at the count. You *all* needed to coordinate. This shows another problem: Strategy often requires collusion, which is hard in real elections."

  **5. Tie-Break Luck**
  *   *Risk:* Coin flip lands on M. Type A is happy. No incentive revealed.
  *   *Fix:* "In a real election, ties are rare, but 'Spoiler Effects' are common. Let's assume a scenario where E wins by 1 vote due to a counting error or absentee ballot. Does the incentive exist then?" (Force the hypothetical).

  ---

  ## 7. Limitations: What You Cannot Claim

  Be frank with your members during the wrap-up.

  1.  **"We didn't prove it for *every* rule."**
      *   *Truth:* We only *played* Plurality. We *discussed* IRV and Borda.
      *   *Script:* "We saw Plurality fail. The math says IRV and Borda fail too, just in different scenarios. We didn't have time to play all three, but the logic holds."
  2.  **"We didn't prove it's *unavoidable*."**
      *   *Truth:* They saw manipulation *can* happen. They didn't see that it *must* happen in all systems.
      *   *Script:* "You saw that manipulation is *possible*. The Theorem says it's *inevitable* for any fair system. You can't design a perfect one."
  3.  **"Random Dictator isn't a real solution."**
      *   *Truth:* It solves manipulation but creates inequality.
      *   *Script:* "We fixed honesty by making one person a dictator. Is that fair? No. So we trade fairness for honesty."

  ---

  ## 8. Final Script for the "Gap"

  *Use this exact wording at minute 54:*

  "Today you saw that rules create incentives. If we use Plurality, you bury rivals. If we use Random Dictator, you tell the truth but lose equality.
  You might ask: 'Is there a rule we didn't try that fixes both?'
  The math says **no**.
  Kenneth Arrow and later Gibbard and Satterthwaite proved that any system meeting basic fairness standards *must* be vulnerable to strategy.
  You didn't just vote today. You hit the wall of what is mathematically possible in democracy. The argument isn't about whether we voted badly. It's that the game itself is rigged by math."
