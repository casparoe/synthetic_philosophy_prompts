  ### 1. Reconstructing Professor R.'s Rule

  Based on the ten precedent rulings, Professor R. is operating under a criterion of **Global Forward Uniqueness of the Complete Physical State**.

  Formally: A system is deterministic if and only if, for every physically admissible state $S_t$ at time $t$, the laws of nature $L$ entail a **unique** complete physical state $S_{t'}$ for **all** times $t' > t$.

  This rule is composed of three necessary conditions derived from her verdicts:
  1.  **Uniqueness (No Branching):** The state + laws must fix exactly one future. (Derived from Ruling 8, Norton's Dome).
  2.  **Global Existence (No Singularity):** The evolution must be defined for all future time; the state cannot cease to exist or the laws "run out." (Derived from Ruling 9, Five Masses).
  3.  **Ontic Priority (Epistemic Irrelevance):** Predictability, computability, and measurement precision are irrelevant to the classification. Determinism is a feature of the world (or model), not the observer. (Derived from Rulings 2, 3, 5, 6 vs 7).

  **Why the Co-Author's Rule Fails:**
  Your co-author's proposal (ODEs with Lipschitz right-hand sides) is ruled out by at least three of R.'s entries:
