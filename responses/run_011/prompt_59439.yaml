answer: |-
  You are describing the central tension in the System of National Accounts (SNA): the conflict between the **production boundary** (what counts as economy) and the **valuation principle** (how we price it). Your unease stems from the fact that the SNA is not a neutral mirror of reality but a theoretical model masquerading as a measurement convention.

  Here is a reconstruction of the theory presupposed by your practice, its confrontation with the Socialist Calculation Debate, and the structure of an alternative system.

  ### 1. The Implicit Theory: Market Equivalence and Opportunity Cost

  The national accounts presuppose a theory of price that I would call **Shadow Market Equivalence**. It is neither a pure subjective theory (value is what is paid) nor a labor theory (value is what is worked). It is a theory of **opportunity cost anchored in observable arbitrage.**

  **The Principle of Imputation:**
  An imputed figure earns the status of a "price" rather than a "guess" only if it satisfies the **Third-Party Criterion**: *Could a third party perform this activity for pay in a competitive market under similar institutional conditions?*
  *   **Owner-Occupied Housing:** Yes. I could rent this house to a stranger; I could rent a similar house from a stranger. The "price" is the rent forgone. It is an opportunity cost derived from an active, thick market for substitutes.
  *   **Government Services:** No. There is no market for "justice" or "sovereignty." Therefore, the SNA retreats to **Input Costing**. It assumes that in the absence of a market price, the cost of production (wages + materials) equals the value of the output. This is an accounting identity, not a price discovery mechanism.
  *   **Household Labor:** Yes (in theory). A cleaner could clean my floor; a chef could cook my meal. Yet, this is excluded.

  **The Housing vs. Labor Inconsistency:**
  You ask why the practice admits the dwelling but excludes the labor that maintains it, when both have market surrogates. The SNA defends this via the **Transferability of Output** principle.
  *   **Housing:** The service flow (shelter) is separable from the consumer. I can occupy the house, or I can sell the right to occupy it. The asset is capitalized; the service is a distinct flow that can be traded independently of the specific household's labor.
  *   **Household Services:** The output (a clean floor, a cooked meal) is consumed immediately by the producer. It is not storable or transferable. To value it, you cannot use an output price (there is no market for "one clean family floor"); you must use an input price (the housekeeper's wage).
  *   **The Theoretical Line:** The SNA prioritizes **Output Valuation**. It includes household *goods* (subsistence corn, self-built houses) because the *output* is tradable (corn can be sold; the house can be sold). It excludes household *services* because the output vanishes into consumption instantly, forcing valuation onto the *input* (labor time). The SNA fears that valuing household labor inputs blurs the boundary between "production" and "leisure," effectively making the entire waking day part of GDP.

  **The Presupposition:** The economy is a single integrated system where the market sector provides the *numeraire* for the non-market sector. Non-market activity is treated as a shadow of market activity. If no market shadow exists (household services), it is deemed "non-economic."

  ### 2. The Socialist Calculation Debate: Lange vs. Mises/Hayek

  Your practice sits precisely in the crossfire of the 1930s calculation debate, and it reveals a hybrid position that satisfies neither side completely.

  **Does it concede Lange?**
  Yes, in method. Lange argued a central board could announce parametric prices and adjust them by shortage and surplus. The National Statistical Office acts exactly as Lange's Central Board. It announces the "price" of government output (cost) and the "price" of owner-occupied housing (imputed rent) without a direct exchange taking place. It generates usable magnitudes for goods with no market. By successfully aggregating these imputations into a coherent GDP that correlates with inflation and employment, the SNA demonstrates that **accounting prices can function for macro-aggregation without direct exchange.**

  **Does it confirm Mises/Hayek?**
  Yes, in foundation. Mises argued that without private exchange of assets, there are no genuine prices and therefore no rational calculation. The SNA quietly confirms this because its imputations are **parasitic**.
  *   The imputed rent for owner-occupied housing is derived from *actual* rents paid in the rental market.
  *   The valuation of government output uses wages determined in *actual* labor markets.
  *   If the entire economy were nationalized (no private rental market, no private wage bargaining), the SNA would collapse. It would have no anchor for its imputations. It would be forced to value everything by input costs, leading to the "GDP by effort" fallacy where digging holes and filling them increases output.

  **The Verdict:**
  The SNA confirms Mises' insight that **price discovery requires exchange**, but it concedes Lange's point that **accounting magnitudes can be imputed** provided they are anchored to a surrounding market economy. However, regarding government output (valued at cost), the SNA validates Mises' critique: we are measuring *effort*, not *value*. We do not know if the police service is worth its cost; we only know what it cost. The accounts treat cost as value, which is precisely the calculation error Mises warned of in socialist systems.

  ### 3. Requirements, Fit, and Underdetermination

  **What the Practice Strictly Requires:**
  1.  **Consistency of Valuation:** All components must be valued at the same point in the production chain (usually final expenditure or value added).
  2.  **Anchoring:** Imputations must be tied to observable market transactions *somewhere* in the system (e.g., rental markets for housing).
  3.  **Residency:** Production is defined by the institutional unit, not the geography.

  **What Merely Fits (Conventions):**
  1.  **The Exclusion of Household Labor:** This fits the "transferability" theory, but it also fits political convenience. Including it would double the size of GDP and alter gendered analyses of work. It is a convention defended by theory but motivated by feasibility and tradition.
  2.  **Government Output = Cost:** This fits the lack of a market, but it is not theoretically required. One could value government output by "willingness to pay" (taxes) or by outcome metrics. The choice to use cost is an admission of ignorance, codified as method.

  **Theoretical Underdetermination:**
  There are places where rival theories of value license the exact same numbers, leaving the accounts theoretically hollow.
  *   **Example: Financial Intermediation.** The SNA uses FISIM (Financial Intermediation Services Indirectly Measured). It imputes service charges based on interest rate spreads.
      *   *Neoclassical View:* This is the price of liquidity and risk transformation.
      *   *Marxist View:* This is a deduction from surplus value produced elsewhere.
      *   *Austrian View:* This is a distortion of time preference.
      *   *Result:* All three accept the FISIM number in the GDP total, despite disagreeing fundamentally on whether it represents *creation* of value or *transfer* of value. The accounts are silent on the ontology of the number.
  *   **Example: Depreciation.** Consumption of Fixed Capital is an estimate.
      *   *Theory A:* It's the physical wear and tear.
      *   *Theory B:* It's the obsolescence due to technological change.
      *   *Result:* The accountant uses a geometric decay rate. Both theories can claim the number fits their model, but the number itself does not distinguish between a machine wearing out and a machine becoming useless because a better one exists.

  ### 4. The Opposite Accounting System: Strict Exchange Accounting

  If we built an accounting system on the opposite view—specifically the **Misesian/Strict Exchange View** that value exists *only* in the act of voluntary transfer between distinct owners—it would look radically different in operation.

  **Core Axiom:** No exchange, no production. No price, no value.

  **Operational Changes:**
  1.  **Abolition of Imputations:**
      *   **Owner-Occupied Housing:** Removed from GDP. If you live in your own house, no economic production occurs. If you rent it to yourself (via a corporation), it counts. This would create a massive incentive for financialization of housing to "create" GDP.
      *   **Government Output:** Removed from GDP. Taxes are transfers, not payments for services. Government spending is intermediate consumption of the polity, not final output. GDP would shrink by 15–20% instantly.
      *   **Inventory Changes:** Valued only upon sale, not upon production. Unsold goods are not "output"; they are failed speculation.

  2.  **Transaction-Based Ledger:**
      *   Instead of "Gross Domestic Product," the primary metric would be **Gross Domestic Expenditure (GDE)** on final market transactions.
      *   **Balance Sheets:** Would focus strictly on net financial assets and tradable real assets. Non-tradable assets (like human capital or public infrastructure) would be footnoted, not capitalized.

  3.  **Treatment of Household Labor:**
      *   Strictly excluded, consistent with the current SNA, but for a different reason. Current SNA excludes it because it's hard to measure/transferable. The Strict Exchange system excludes it because it is *ontologically* outside the economy. It is "nature" or "life," not "economy."

  4.  **Consequences:**
      *   **Volatility:** Measured economic activity would appear much more volatile. In a recession, when people stop renting and stay in owned homes, or stop eating out and cook at home, GDP would crash harder than in the current system because the stabilizing imputations are gone.
      *   **Policy Blindness:** A war economy would show a *drop* in GDP (as government production is excluded) even if resources are fully mobilized. A natural disaster might show a *rise* in GDP (rebuilding trades) but the loss of housing stock (non-traded) would be invisible until the sale.
      *   **Incentives:** It would encourage the monetization of all social relations. To be counted, care for the elderly must be paid for; if done by family, it is invisible.

  ### Summary

  Your practice presupposes a **pragmatic hybrid theory**: that the market is the best available yardstick for value, even where the market is absent. It concedes to Lange that we can *simulate* prices for accounting, but it relies on Mises' insight that those simulations must be *anchored* in real exchanges to avoid arbitrariness.

  The inconsistency regarding household labor is the fracture point. It reveals that the SNA is not a pure measure of "welfare" (which would include the labor) nor a pure measure of "market capacity" (which would exclude the housing imputation). It is a measure of **market-like activity**. It counts the house because it behaves like capital; it excludes the cooking because it behaves like life.

  The system works not because it is theoretically pure, but because the excluded sectors (household labor) and the imputed sectors (housing, gov) tend to move in correlation with the market sector over the business cycle. When that correlation breaks—as in a crisis where unpaid labor substitutes for market services—the numbers will indeed sound naive. You are not measuring the economy; you are measuring the *monetized shadow* of the economy.
