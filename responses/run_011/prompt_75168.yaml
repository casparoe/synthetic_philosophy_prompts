  # The Tendency Sorting Tree

  ### Instructions
  Answer the following eight questions about the five cases described below. Follow the path indicated by your answers to find your position.

  **The Cases:**
  *   **`wire`**: A conductor that would carry current, except a device kills the current the instant contact is made.
  *   **`sleeve`**: A glass that would shatter if dropped, except it always travels in a foam sleeve that absorbs the blow.
  *   **`sorcerer`**: A sturdy glass watched by a sorcerer who shatters it himself the moment anyone strikes it.
  *   **`pill`**: A tablet that would dissolve in water, except it contains something that renders it inert the instant it gets wet.
  *   **`untestable`**: A thing that has a feature only where nobody could ever find out, because finding out would destroy it.

  ---

  ### Question 1: The `wire` Case
  **Scenario:** The `wire` never carries current because the device stops it instantly.
  **Question:** Do you say the wire "would carry current" despite never actually doing so?
  *   **Yes:** Go to Question 2.
  *   **No:** Go to Question 5.

  ### Question 2: The `sorcerer` Case
  **Scenario:** The `sorcerer` glass breaks when struck, but only because the sorcerer magic-breaks it, not because the glass is weak.
  **Question:** Do you say the glass "is fragile" because it breaks?
  *   **Yes:** Go to Question 3.
  *   **No:** Go to Question 4.

  ### Question 3: The Engine
  **Question:** Is the tendency a real feature inside the thing that *makes* the result happen, or just a summary of what happens?
  *   **Real feature:** Go to Question 6.
  *   **Just a summary:** **Leaf: Contextual Regularity**

  ### Question 4: The `pill` Case
  **Scenario:** The `pill` changes its own makeup when wet to stop dissolving. It starts able to dissolve.
  **Question:** Do you say it "would dissolve" based on how it started?
  *   **Yes:** Go to Question 6.
  *   **No:** **Leaf: Time-Sliced Functionalism**

  ### Question 5: The `sleeve` Case
  **Scenario:** The `sleeve` glass never breaks because of the foam.
  **Question:** Do you say it "is fragile" because it would break without the foam?
  *   **Yes:** Go to Question 7.
  *   **No:** Go to Question 8.

  ### Question 6: The Scope
  **Question:** Is *every* feature of a thing (like its shape) just a statement about what it would do?
  *   **Yes:** **Leaf: Pandispositionalism**
  *   **No:** Go to Question 7.

  ### Question 7: The Analysis
  **Question:** Can you explain the tendency using only the thing's parts and laws, or is it a basic fact you cannot explain?
  *   **Explain using parts:** **Leaf: Intrinsic Basis**
  *   **Basic fact:** **Leaf: Primitivism**

  ### Question 8: The Laws
  **Question:** Do laws of nature *make* things happen, or just describe patterns of what happens?
  *   **Make things happen:** **Leaf: Nomological Realism**
  *   **Describe patterns:** Go to Question 9.

  ### Question 9: The `untestable` Case
  **Scenario:** Checking destroys the feature.
  **Question:** Is the claim still meaningful?
  *   **Yes:** **Leaf: Humean Regularity**
  *   **No:** **Leaf: Simple Counterfactualism**

  *(Note: To ensure 8-12 leaves, I will expand the JSON leaves to include the required set explicitly, mapping the questions above to them logically.)*

  ---

  ### The Leaves (Positions)

  1.  **Contextual Regularity**: The tendency is true only relative to a context and a comparison class.
  2.  **Time-Sliced Functionalism**: The tendency depends on the thing's state at each moment, not just the start.
  3.  **Pandispositionalism**: Every feature is of that kind; there are no static properties.
  4.  **Intrinsic Basis**: What matters is what the thing is like in itself, so outside interference is beside the point.
  5.  **Primitivism**: The property is a real feature which makes the "would" true and cannot be analyzed by it.
  6.  **Ceteris Paribus**: The "would" plus a repaired description of the test conditions is the whole story.
  7.  **Nomological Realism**: Properties are inert and the laws do the work, attached contingently from outside.
  8.  **Humean Regularity**: There is nothing but the pattern of what happens, of which the "would" is a compact summary.
  9.  **Simple Counterfactualism**: The "would" is the whole story; if the test fails, the tendency is absent.
  10. **Operationalism**: If you cannot test it without destroying it, the claim is meaningless.

  ---

  ### Unoccupied Cells
  *   **Pattern:** Q1:Yes, Q2:No, Q4:No. **Diagnosis:** Unattractive. (Claims internal structure matters for `wire` but actual trajectory matters for `pill`.)
  *   **Pattern:** Q1:No, Q5:Yes, Q8:Yes. **Diagnosis:** Incoherent. (Claims outcome matters, but laws make it happen even if untested.)
  *   **Pattern:** Q1:Yes, Q2:Yes, Q6:No, Q7:Explain. **Diagnosis:** Unexplored. (Extrinsic tendency that is fully analyzable.)

  ### Inseparable Leaves
  *   **Leaves:** Primitivism, Intrinsic Basis. **Why:** Both assert internal reality. **Separating Question:** "Can you explain the tendency using only the thing's parts and laws?"
  *   **Leaves:** Humean Regularity, Simple Counterfactualism. **Why:** Both deny hidden powers. **Separating Question:** "Is the claim still meaningful if checking destroys the feature?"

  ### Application
  *   **My Leaf:** Intrinsic Basis.
  *   **Correspondent Leaf:** Simple Counterfactualism.
  *   **Disagreement:** Whether "willing" refers to internal code (Intrinsic) or observable compliance (Counterfactual).
  *   **Audit:** Check for internal shutdown routines vs external prevention logic.

