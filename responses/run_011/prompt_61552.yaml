          *   Take a position (no menu of options), defend against rival standards (simple verification/misleading reader), state what is given up.
          *   Flag judgment calls.
          *   No bibliography/sources.

  2.  **Deconstruct Arendt for this Context:**
      *   *Core Concept:* Factual truth is stubborn; it says "this happened." Political truth is debatable; it says "this is good/bad." The danger is treating factual truth as opinion.
      *   *The Lie:* Not just saying $2+2=5$, but rearranging the factual landscape so the common world dissolves.
      *   *Adaptation:* A municipal office can't solve the human condition, but it can protect the "common record."
      *   *Distinctions to Keep:* Factual Truth vs. Opinion/Spin (crucial for selective construction), The Permanence of the Record (crucial for quiet revision), The Distinction between Act and Intent (crucial for anticipatory image).
      *   *Distinctions to Drop:* "Rational Truth" (philosophical/scientific truths) – too abstract for press releases. The absolute ban on lying (sometimes diplomacy requires vagueness, but not factual erasure). The idea that *all* persuasion is suspect (government *must* persuade to function).
      *   *Rival Standard:* "Would a reasonable reader be misled?" -> *Critique:* Too subjective. "Is the data accurate?" -> *Critique:* Misses the structural lies (selection, tense, revision).
      *   *My Standard:* "Does this preserve the common factual record against political convenience?"

  3.  **Drafting the Procedure (The "Screen"):**
      *   Needs to be actionable.
      *   Needs specific verdicts (Release, Repair, Hold, Kill).
      *   Needs to address the three patterns: Selective Construction, Anticipatory Image, Quiet Revision.
      *   *Constraint:* Two pages (visual density). I need to keep the text tight.

  4.  **Developing the Tests:**
      *   *Test 1 (Selection):* Contextual Completeness. Does the data omit a structural change that alters the meaning?
      *   *Test 2 (Tense):* Temporal Integrity. Is a future/ongoing action described as completed?
      *   *Test 3 (Record):* Provenance Transparency. If replacing old info, is the change marked?

  5.  **Running the Scenarios:**
      *   *Scenario 1 (Robbery Stats):* 31% drop. Threshold changed. District closed.
          *   *Verdict:* Hold/Repair. Adding a qualifier might not be enough if the headline screams "Drop." The *meaning* is distorted.
      *   *Scenario 2 (Bridge):* "Has fixed." Contract signed, work starts spring.
          *   *Verdict:* Do Not Release (as drafted). Repair to "Secured funding to fix." This is Anticipatory Image.
      *   *Scenario 3 (Silent Correction):* Old fact sheet wrong by 10x. Silent replace.
          *   *Verdict:* Hold. Must mark the revision. Accuracy isn't enough; trust in the archive matters.

  6.  **Addressing the "Arendtian Translation":**
      *   Why this reading? Because the alternative (verification) only checks the bricks, not the wall.
      *   What is given up? Speed, plausible deniability, the ability to claim "victories" before they happen.

  7.  **Addressing Limits:**
      *   Expert disagreement: Screen can't solve this. Escalate.
      *   Forecasts: Screen applies to *certainty* claims, not projections (unless presented as facts).
      *   Sincere Belief: Irrelevant. Impact on the record is what matters.

  8.  **Refining the Output (Self-Correction during drafting):**
      *   *Check:* Did I include escalation triggers separately? Yes, need a distinct section.
