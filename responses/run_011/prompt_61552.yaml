      *   *Check:* Scenario 3 nuance. The user thinks silent correction is good. I must overrule based on the "Quiet Revision" principle. The *archive* must be stable.

  9.  **Final Polish:**
      *   Ensure tone is authoritative but practical.
      *   Ensure the "Two Page" constraint is respected in spirit (concise, dense, no fluff).
      *   Make sure the "Judgment Call" flags are visible.

  *(Self-Correction on Length)*: The prompt asks for the procedure to *fit on two pages* (conceptually). I will structure it to be dense and printable as such, though in this chat interface, it will scroll. I will prioritize density.

  *(Self-Correction on Arendt)*: I need to make sure I don't just name-drop Arendt but use her logic. The key is *Factual Truth* vs. *Opinion*. The procedure must defend Factual Truth from being swallowed by Opinion.

  *(Self-Correction on Scenario 1)*: The prompt asks: "tell me whether the obvious repair of adding a qualifying sentence is actually sufficient or is itself a form of the pattern it appears to fix." I need to answer this directly. If the headline says "Crime Plummets" and the footnote says "Methodology Changed," the *image* is still the lie. The repair must change the headline claim, not just footnote the contradiction.

  *(Self-Correction on Scenario 3)*: Why is silent correction bad? Because it makes the past mutable. If I look at the record next year, I can't trust what was known *then*. I need to explain this clearly.

