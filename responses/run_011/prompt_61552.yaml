answer: |-
  # THE COMMON RECORD SCREEN (CRS)
  **Office of Metropolitan Communications | Standards Unit**
  **Purpose:** To protect the stability of the factual record against political convenience.
  **Basis:** Hannah Arendt's *Truth and Politics* (Adapted).

  ### I. THEORETICAL COMMITMENTS & LIMITS
  **Preserved Distinctions:**
  1.  **Factual Truth vs. Opinion:** Factual truth (what happened) is coercive; it cannot be debated. Opinion (what should be done) is debatable. This screen protects Factual Truth from being treated as Opinion.
  2.  **The Common World:** The shared reality allows us to govern together. If the record changes to suit the present, the common world dissolves.
  3.  **Image-Making:** The modern lie is not denying facts, but constructing an image that renders facts irrelevant.

  **Dropped Distinctions:**
  1.  **Rational Truth:** We do not adjudicate philosophical or scientific absolutes, only municipal records.
  2.  **Intent:** We do not assess whether the drafter *believed* the lie. We assess the impact on the record.
  3.  **Persuasion:** Government must persuade. This screen does not ban persuasion; it bans persuading by altering the factual ground.

  **Why This Standard?**
  The rival standard is *Material Verification* ("Do the numbers match the spreadsheet?") or *Reasonable Reader* ("Would someone be misled?").
  *   **Rejection:** Material Verification catches errors but misses structural lies (Pattern 1). *Reasonable Reader* is too subjective; a reader can be "reasonably misled" by accurate data arranged deceptively.
  *   **Adoption:** The CRS asks: *Does this item treat the factual record as stable common property, or as raw material for image-making?*
  *   **Cost:** You give up speed. You give up the ability to claim future victories as past tense. You give up the ability to quietly clean up old mistakes.

  ---

  ### II. THE PROCEDURE (Three Tests)
  *Run in order. A failure in any test stops the process.*

  **TEST 1: CONTEXTUAL COMPLETENESS (Pattern: Selective Construction)**
  *Check:* Do the selected figures, baselines, or comparison periods omit a structural change (policy, threshold, boundary, closure) that materially alters the interpretation of the data?
  *   **Pass:** Data reflects the phenomenon without structural distortion.
  *   **Fail:** Data is accurate but structurally misleading.
  *   **Verdict:** **HOLD FOR COMMUNICATIONS DIRECTOR.**
  *   **Repair:** Do not merely add a footnote. The headline claim must be downgraded to reflect the structural change (e.g., from "Drop in Crime" to "Change in Reported Crime").
      *   *[JUDGMENT CALL]:* Is the structural change "material"? If the change accounts for >10% of the variance, it is material.

  **TEST 2: TEMPORAL INTEGRITY (Pattern: Anticipatory Image)**
  *Check:* Is any future action (vote, contract, completion, target) grammatically constructed as a completed accomplishment?
  *   **Pass:** Tense matches status (Future = Future, Plan = Plan, Done = Done).
  *   **Fail:** A commitment is described as an achievement.
  *   **Verdict:** **RELEASE WITH NAMED REPAIR.**
  *   **Repair:** Change verbs to reflect status (e.g., "Has fixed" → "Secured funding to fix"; "Will reduce" → "Targets reduction").
      *   *[JUDGMENT CALL]:* Is "Securing funding" an accomplishment? Yes. Is "Fixing the bridge" an accomplishment? Only when the bridge is open.

  **TEST 3: PROVENANCE TRANSPARENCY (Pattern: Quiet Revision)**
  *Check:* Is this item replacing or correcting a previously released public record?
  *   **Pass:** New item only, or correction includes a visible marker (e.g., "Updated," "Correction," Date Stamp).
  *   **Fail:** Silent replacement of existing public record.
  *   **Verdict:** **DO NOT RELEASE.**
  *   **Say Instead:** "We are updating the record to reflect [X]. The previous version stated [Y]. We maintain both versions for transparency." (Archive the old version; publish the new one with a header linking the change).
      *   *[JUDGMENT CALL]:* Does a typo count? No. Does a figure change count? Yes.

  ---

  ### III. ESCALATION TRIGGERS
  *If any of the following occur during the 5-minute pass, bypass the Screen and escalate immediately to the Communications Director.*

  1.  **Internal Dissent:** A subject matter expert (SME) formally objects to the factual claim in writing.
  2.  **Legal Exposure:** The item references ongoing litigation, personnel matters, or active negotiations where factual claims could be discovery material.
  3.  **High-Variance Repair:** The required repair (Test 1 or 2) changes the headline narrative from positive to neutral/negative.
  4.  **Archival Conflict:** The IT/Web team confirms that silent replacement (Test 3) is the only technical option available for the platform.

  ---

  ### IV. SCENARIO RUNS

  **SCENARIO 1: The Robbery Stats**
  *Item:* Release announcing 31% YoY fall in robberies. Accurate math.
  *Complication:* Reporting threshold changed mid-year; comparison period includes 2 months of district closure.
  *Screen Result:* **FAIL TEST 1 (Contextual Completeness).**
  *Verdict:* **HOLD FOR COMMUNICATIONS DIRECTOR.**
  *Analysis:* The data is materially accurate but structurally deceptive. The "Common World" view is that crime dropped; the "Factual Truth" is that measurement and access changed.
  *On the Repair:* Adding a qualifying sentence ("*Note: Thresholds changed*") is **INSUFFICIENT** and is itself a form of the pattern. It keeps the deceptive headline (the Image) while hiding the truth in the text (the Footnote). This treats the factual truth as negotiable.
  *Required Action:* The headline must change to "Reported Robberies Fall Amid Measurement Changes" or similar. If leadership refuses, **DO NOT RELEASE.**

  **SCENARIO 2: The Bridge Post**
  *Item:* Social post: "City has fixed structurally deficient bridge."
  *Complication:* Funding approved, contract signed, work starts spring.
  *Screen Result:* **FAIL TEST 2 (Temporal Integrity).**
  *Verdict:* **RELEASE WITH NAMED REPAIR.**
  *Analysis:* This is Anticipatory Image. It creates a record that the bridge was fixed on the day of the announcement.
  *Required Action:* Change copy to "City secures contract to fix bridge." This preserves the accomplishment (securing the contract) without falsifying the physical reality (the bridge is not yet fixed).
  *Note:* If the drafter argues "The public sees this as fixed," overrule them. The record must match the physical fact, not the public perception.

  **SCENARIO 3: The Silent Correction**
  *Item:* Draft replacing a 3-week-old fact sheet (lead figure wrong by 10x). No marker.
  *User View:* Unambiguously good (more accurate).
  *Screen Result:* **FAIL TEST 3 (Provenance Transparency).**
  *Verdict:* **DO NOT RELEASE.**
  *Analysis:* You are prioritizing *current* accuracy over *archival* integrity. If a researcher looks at the record next year, they will not know what the City claimed three weeks ago. Silent revision makes the past mutable.
  *Required Marker:* The new file must be named "Fact Sheet v2 [Date]" and include a top-box: "Updates figure from [Date] release. Previous figure was erroneous."
  *Reason:* The marker is not a formality; it is the only proof that the government admits error. Without it, accuracy is just whatever the server currently holds.

  ---

  ### V. LIMITS & JUDGMENT CALLS
  *The Screen cannot adjudicate the following. These require human ownership.*

  1.  **Expert Disagreement:** If Agency A says X and Agency B says Y, and both are credible, the Screen cannot choose.
      *   *Protocol:* Escalate. Do not publish until one position is adopted as official policy. Publishing "A says X" treats factual truth as a he-said-she-said opinion.
  2.  **Forecasts:** We publish forecasts constantly. They have no settled fact to be faithful to.
      *   *Protocol:* Test 1 applies only to *historical* data. Forecasts must be clearly labeled as "Projections" or "Estimates." If a forecast is presented as a "Target" or "Guarantee," it fails Test 2.
  3.  **Sincere Belief:** A drafter may genuinely believe the Anticipatory Image (e.g., "The contract *means* the bridge is fixed").
      *   *Protocol:* Irrelevant. The Screen tests the *record*, not the *mind*. A sincere lie still damages the common world.
  4.  **Materiality (Test 1):** The 10% variance rule is a heuristic.
      *   *Ownership:* The Reviewer owns the call. If you flag it, you must document why the omission matters. If the Director overrules you, the escalation log captures the risk.

  **FINAL NOTE:**
  This procedure assumes that the government's long-term legitimacy depends on the stability of its record, not the success of its news cycle. By adopting this, you accept that you will kill stories that are "accurate" but deceptive. You will slow down releases. You will annoy leadership. This is the cost of treating factual truth as coercive. If you are not prepared to Hold an item when Test 1 fails, do not run this Screen.
