  ### Genuine Tensions (Ranked by Severity)

  **1. Items 6 vs. 7 (Selective Prosecution)**
  *   **Conflict:** (6) demands norms be "applied evenly to everyone." (7) defends "selective prosecution" as discretion.
  *   **Which Gives:** (6) must give. You cannot claim universal application while defending the absence of Allied defendants.
  *   **Cost:** Concedes that "victor's justice" is structurally inherent, relying on procedural fairness rather than equal enforcement to sustain legitimacy.
  *   **Cheaper Reformulation:** Change (6) to: "Legitimate only if norms admit no *formal* immunity for victors." This aligns with (7)'s discretion argument.

  **2. Items 4 vs. 5 (Constitutive Authority)**
  *   **Conflict:** (4) claims judge identity/source "doesn't bear on legitimacy at all." (5) claims Tokyo is less legitimate because MacArthur (one general) vs. Four Sovereigns.
  *   **Which Gives:** (4) must give. (5) correctly identifies that the *source* of authority matters.
  *   **Cost:** Undermines the claim that procedure is the "whole question." Admits political constitution affects legal validity.
  *   **Cheaper Reformulation:** Change (4) to: "Judge identity matters only regarding *constitutive sovereign authority*." This preserves the neutral/victor indifference while accommodating (5).

  **3. Item 3 vs. Test Case (1943 Axis Tribunal)**
  *   **Conflict:** (3) implies 1943 tribunal is legitimate (old norms, new court). Your intuition says illegitimate.
  *   **Which Gives:** Neither, but (3) requires definition clarification.
  *   **Cost:** None if clarified.
  *   **Cheaper Reformulation:** Define "Old Norm" in (3) strictly as "existing *individual criminal* liability." In 1943, strategic bombing carried no individual liability (only state responsibility). Thus, the 1943 tribunal fails on *substantive* retroactivity, not jurisdictional. This condemns 1943 without exempting 1945.

  ### False Tensions (Dissolving Conflicts)

  **1. Items 2 vs. 8 (Reasoning vs. Conclusion)**
  *   **Why it Dissolves:** (2) claims the legal objection fails (conclusion). (8) admits the majority's *reasoning* was flawed (Pal was right on reasoning). You can agree with the outcome (law existed) while criticizing the judicial opinion's logic. No contradiction.

  **2. Items 1 vs. 9 (Legality Principle vs. War Connection)**
  *   **Why it Dissolves:** (1) defines the legality principle. (9) accepts a jurisdictional limitation (war connection) for political feasibility, acknowledging it excludes moral core acts. This is a pragmatic concession on *scope*, not a contradiction of the *principle* of legality regarding what was actually charged.

  ### Single Revision

  Modify Item 6 to resolve the selective prosecution contradiction while maintaining the even-handedness standard.

  **Revision:** Replace "actually applied evenly to everyone who violates them" with "capable of universal application without formal exemption."

  Verdict: 6 — Legitimate if no formal victor exemption
