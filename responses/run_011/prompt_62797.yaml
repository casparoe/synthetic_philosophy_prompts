answer: |-
  (a) **The Rule: Constrained Geometric Growth of Total Economic Capital**

  **The Principle:** You should accept a gamble if and only if it increases the **expected time-average geometric growth rate** of your **Total Economic Capital**, provided that no single outcome breaches a **Solvency Constraint**.

  **The Quantity:** The quantity to which the rule is sensitive is the **Geometric Mean Return** (or equivalently, the expected change in the logarithm of wealth), calculated over your *Total Economic Capital* rather than just your liquid portfolio.

  **Why this quantity?**
  Arithmetic expectation (your friend's metric) describes the average outcome across a hypothetical ensemble of parallel universes. It ignores the fact that you live in a single timeline where losses reduce the base upon which future gains are compounded (volatility drag). The geometric mean describes the actual growth rate of wealth along the single path you inhabit. However, pure geometric maximization (the Kelly Criterion) can sometimes recommend bets that, while growth-optimal in the long run, carry a non-zero probability of catastrophic drawdown that violates your ability to remain in the game. Hence, the **Solvency Constraint**: you must not risk a loss that pushes you below a threshold where recovery is impossible or where your human capital (earning power) is crippled.

  ***

  (b) **Mapping the Clauses to Your Cases**

  1.  **"Total Economic Capital" (Financial + Human):**
      *   **Load-bearing for (6) and (8).**
      *   *Case (6):* Your mortgage looks reckless on £200k liquid wealth. But relative to your *Total Capital* (Liquid + Human Capital NPV + House Value), the leverage is modest. The mortgage is serviced by the flow of your human capital, making it a hedge against rental inflation rather than a naked punt.
      *   *Case (8):* The career choice is a call option on your human capital. Viewed in isolation, the equity is volatile. Viewed as part of your total capital allocation, it diversifies your income stream (cash vs. equity), optimizing the growth of your lifetime earnings.

  2.  **"Geometric Mean Return" (Growth Rate):**
      *   **Load-bearing for (2), (3), (4), and (7).**
      *   *Case (2):* A sequence of bets converges to the geometric mean. Since the arithmetic edge is positive and the bet size is small relative to wealth, the geometric mean is positive. You accept.
      *   *Case (3) vs (4):* In (3), the stake is too large. A 35% loss requires a 54% gain to recover. The volatility drag turns the geometric mean negative, even if the arithmetic mean is positive. In (4), the stake is small enough that volatility drag is negligible, and the geometric mean remains positive.
      *   *Case (7):* The £10 billion payoff is so improbable that it contributes almost nothing to the *logarithmic* expectation, while the certain £1,000 loss reduces it definitively. Growth optimization rejects lottery tickets that EV loves.

  3.  **"Solvency Constraint" (Ruin/Absorption):**
      *   **Load-bearing for (5).**
      *   *Case (5):* Pure geometric maximization might sometimes reject insurance if the premium is too high (2x fair). However, a 70% loss approaches a "ruin" state where your lifestyle or earning capacity is permanently impaired. The constraint overrides the pure calculation, mandating insurance to prevent absorption into a low-wealth state.

  4.  **The Outlier:**
      *   *Case (1):* This verdict is **decoration** (or rather, an inconsistency). As I will explain in (c) and (d), this verdict contradicts the principle that justifies (2).

  ***

  (c) **The Verdict You Must Abandon**

  Your rule cannot accommodate **Case (1)** without becoming baroque.

  If you accept Case (2) (100 flips) based on growth rates, you must logically accept Case (1) (1 flip). Mathematically, the expected log-wealth change for a single flip of +£11k/-£10k on £200k wealth is positive.
  $$0.5 \ln(211) + 0.5 \ln(190) \approx 5.2994 > \ln(200) \approx 5.2983$$
  The geometric growth rate is positive. By your own metric (growth of the single life), this bet adds to your trajectory.

  Your refusal of (1) is driven by **Myopic Loss Aversion**, not growth optimization. You are evaluating the *pain* of the loss in isolation rather than its impact on the *path*. To keep your rule simple and principled, you should abandon the intuition in (1). You ought to accept the single flip, viewing it as the first installment of the sequence in (2). If you refuse (1), you are implicitly admitting that you maximize a utility function bounded by short-term pain, which undermines your critique of your friend.

  ***

  (d) **Adjudicating (1) vs (2)**

  Your friend invokes Samuelson to say: "If you reject one, you must reject many." You say: "I reject one, accept many." Who is right?

  **Your friend is mathematically correct regarding Expected Utility of Terminal Wealth.** If your utility function is fixed over final wealth states, rejecting one bet implies rejecting the sequence (assuming independence and no wealth effect).

  **However, you are intuitively correct regarding Ergodicity.** The error lies in the metric.
  *   **For (1):** You are evaluating a *non-ergodic* process. The time average of one bet is simply the outcome of that bet. However, because you survive to bet again, the relevant metric is still how that outcome affects your *future* growth capacity. Since the geometric mean is positive, you should take it.
  *   **For (2):** You are evaluating an *ergodic* process. The time average converges to the geometric mean.

  **The Resolution:** The only way to reconcile refusing (1) and accepting (2) without changing your utility function is to posit a **transaction cost or friction** that applies to single bets but vanishes over sequences. For example, if losing £10k forces you to sell an illiquid asset at a discount, that is a friction. If no such friction exists, **you are inconsistent.**

  **My Verdict:** You should **accept (1)**. The distinction between "one bet" and "many bets" is a illusion of framing if the bets are identical and independent. By refusing (1), you are leaving money on the table that contributes to the growth rate you claim to prize. The "something other than a utility function" you are smuggling in is **Mental Accounting**—you are treating the £10k as a separate bucket from your £200k. If you integrate them, (1) becomes acceptable.

  ***

  (e) **Verdicts on Your Undecided Questions**

  1.  **The Leveraged Pension Default:**
      *   **Verdict:** **No, not as a universal default.**
      *   **Reasoning:** While leveraged equity is growth-optimal over 30 years (positive geometric drift), the "halve the fund in a bad decade" clause violates the **Solvency Constraint** for individuals near retirement. A default scheme must account for the *distribution* of retirement dates. For a 25-year-old, leverage is appropriate (high human capital, long horizon). For a 60-year-old, it is ruinous. A growth-optimal rule must be time-dependent.

  2.  **The 10x or -1/3 Lifetime Bet:**
      *   **Verdict:** **Accept.**
      *   **Reasoning:** Calculate the geometric mean: $0.5 \ln(10) + 0.5 \ln(0.67) \approx 0.5(2.3) + 0.5(-0.4) = 0.95 > 0$. The growth rate is strongly positive. A 33% drawdown is painful but recoverable (requires a 50% gain). Unlike Case (3), this does not threaten your solvency or human capital. It is a high-variance but growth-accretive move.

  3.  **The Government Catastrophe Insurance:**
      *   **Verdict:** **Accept (Spend the money).**
      *   **Reasoning:** An individual can absorb a 1/200 risk; a government cannot absorb a "10% of national output" shock without risking systemic collapse (an absorbing state). For a sovereign entity, the utility function is effectively step-wise at the point of social stability. The "Solvency Constraint" for a nation is the continuation of the state itself. Preventing the catastrophe preserves the geometric growth path of the entire economy, justifying a premium above actuarial fair value.

  ***

  (f) **The Discriminating Case: The "Volatility Trap" ETF**

  **The Case:**
  Imagine an Exchange Traded Fund (ETF) that tracks a market index. The index itself has an arithmetic expected return of 0% per year (it goes up and down but ends flat over the long run) with high volatility (say, 20% annual standard deviation).
  *   **Product A:** Holds the index directly.
  *   **Product B:** Holds a *daily-rebalanced 2x leveraged* position on the index.

  Your friend (Expected Value) argues: "If the index ends flat, Product B should also end flat, minus fees. The expected value of the underlying is zero, so the leverage doesn't create or destroy value on average."

  **My Rule's Prediction:**
  **Reject Product B.**
  Due to **volatility drag** (variance drain), a leveraged fund on a flat but volatile underlying will lose money geometrically.
  Mathematically, the geometric return is approx $\mu - \sigma^2/2$.
  For Product A: $0 - 0.2^2/2 = -2\%$.
  For Product B (2x leverage): The volatility doubles to 40%. The drift doubles to 0%.
  Geometric return $\approx 0 - 0.4^2/2 = -8\%$.
  The leverage magnifies the volatility drag quadratically. Even if the arithmetic expectation is zero (or slightly positive to cover fees), the *time-average growth rate* is deeply negative. You will almost certainly lose money holding Product B over a long horizon, even if the market goes nowhere.

  **Why this discriminates:**
  *   **Expected Value:** Sees the leverage as neutral (0 expected return) and might accept it if fees are low enough, focusing on the arithmetic mean of daily returns.
  *   **Growth Rule:** Sees the leverage as toxic because it maximizes variance without increasing drift, destroying the geometric compounding rate. This isolates the "volatility tax" which EV ignores but which determines the actual wealth of the single investor living through time.
