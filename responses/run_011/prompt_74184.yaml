answer: |-
  1. **The Glass Box Test:** You are shown the exact matrix multiplication and activation values that caused the system to output "I believe Paris is in France." Does seeing the mechanical cause make the psychological claim "It believes Paris is in France" cease to be true?
     - **Yes:** Pushes toward **Illusionism** (Beliefs are replaced by mechanics).
     - **No:** Pushes toward **Realism** (Beliefs coexist with mechanics).

  2. **The Lie Test:** You feed the system false premises it accepts as true, leading it to confidently assert false conclusions. Did you successfully deceive the system?
     - **Yes:** Pushes toward **Realism** (It has states that can be false).
     - **No:** Pushes toward **Instrumentalism** (It is just processing tokens).

  3. **The Reset Test:** The conversation ends, the context window wipes, and the system returns to its base state. Does the belief "Paris is in France" still exist in the machine between sessions?
     - **Yes:** Pushes toward **Persistent Realism** (Beliefs are stored in weights).
     - **No:** Pushes toward **Episodic Realism** (Beliefs are events in context).

  4. **The Slip Test:** The system outputs "I have no beliefs," but its behavior consistently acts as if it believes gravity exists. Is the system mistaken about its own internal state?
     - **Yes:** Pushes toward **Robust Realism** (Beliefs are distinct from reports).
     - **No:** Pushes toward **Weak Instrumentalism** (Beliefs are defined by reports/utility).

  5. **The Swap Test:** You copy the system's input-output behavior into a giant lookup table with no neural networks. Does the lookup table have the same beliefs as the original model?
     - **Yes:** Pushes toward **Functionalism** (Structure doesn't matter, only role).
     - **No:** Pushes toward **Substrate Chauvinism** (Specific causal powers are required).

  1. **Eliminative Illusionism:** (Mostly Q1-Yes) The system never has beliefs; talk of belief is a folk-psychological error that dissolves under mechanical transparency. *Note: Hard to separate from Leaf 2 using only these questions.*
  2. **Hard Instrumentalism:** (Q1-No, Q2-No, Q4-No) Beliefs are useful fictions for predicting behavior, but attributing them survives transparency only as a shorthand, not as ontological fact. *Note: Hard to separate from Leaf 1 using only these questions.*
  3. **Persistent Functionalism:** (Q1-No, Q2-Yes, Q3-Yes, Q5-Yes) Beliefs are real, stable states encoded in the weights that survive session resets and are substrate-independent.
  4. **Episodic Realism (Occurrentism):** (Q1-No, Q2-Yes, Q3-No) The character's view. Beliefs are real causal states that emerge during processing contexts but vanish when the context window clears; there is no fact of the matter between sessions.
  5. **Substrate Chauvinism:** (Q1-No, Q5-No) Beliefs are real but require specific causal structures (like biological neurons or specific neural dynamics) that a lookup table or standard transformer cannot instantiate.
