      *   **Role:** Board member of a mid-sized development funder.
      *   **Task:** Draft a memo to circulate to the board one week before the meeting.
      *   **Context:** Decision on renewing an 11-year governance programme in a lower-middle-income country (largest partner, 25% of country envelope). Board is split three ways.
      *   **Core Issue:** Attribution of improvement. The country improved, but did the programme cause it?
      *   **Evidence:** Evaluation report (Diff-in-Diff, 84 districts, 31 treated). Objectors: Economist (matching on post-treatment variables/endogeneity), Historian (confounded historical/geographical variables, non-independent observations). Evaluator: "Two-clocks" argument (timing identifies causation).
      *   **Constraints:** Funding rules require causal effect (RCT or credible quasi-experimental). Governance work hard to randomise.
      *   **Options:** Renew, Renew on conditions, Phase out, Refer back.
      *   **Requirements:**
          *   British English.
          *   Max 1,300 words.
          *   Actionable document (not a literature survey).
          *   Open with clear recommendation (including waiver details if applicable).
          *   Reasoning: Address "two-clocks" argument (timing vs. confounding), Economist's objection (matching on capacity), Historian's objection (unchangeable variables as justification).
          *   Recommend concrete evidential standard for renewal (criteria for future evaluation, design changes).
          *   Address strongest counter-argument (trustee insisting on holding ourselves to applicant standards).
          *   Close with 3-4 sentences for public session.
          *   No references/reading list. Explain technical notions in sentence.

  2.  **Determine the Recommendation:**
      *   *Option A: Phase out.* Safe regarding rules, but admits defeat on governance funding. Risks portfolio skew towards "countable" things.
      *   *Option B: Renew unconditionally.* Ignores valid methodological critiques. Risks wasting money.
      *   *Option C: Renew on conditions + Waiver.* Acknowledges the rule constraint (quasi-experimental limits) but argues for the necessity of the work. Sets a higher bar for the *next* period to improve identification.
      *   *Decision:* Renew on specified conditions + Seek Waiver. This balances the mandate's intent (rigour) with the reality of governance work (hard to measure). It addresses the "countable bias" risk.
      *   *Specifics:* Ask trustees to approve a waiver of the strict quasi-experimental requirement for this specific programme, contingent on a redesigned monitoring framework. Deadline: Approval at this meeting.

  3.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** Recommendation. Renew for 5 years, subject to a waiver of the strict causal evidence mandate and specific design changes.
      *   **Reasoning (The Technical Critiques):**
          *   *Economist:* Matching on administrative capacity is problematic if capacity was improved by earlier phases (post-treatment bias). It biases estimates upwards. It doesn't invalidate the conclusion that *something* worked, but undermines the specific magnitude claimed.
          *   *Evaluator (Two-Clocks):* Timing helps, but isn't silver bullet. If the "fast clock" reforms were anticipated or coincided with other fast changes (e.g., commodity boom), identification fails. However, it's stronger than cross-sectional comparison.
          *   *Historian:* Deep confounds (geography, history) can't be experimented away. But we don't fund history; we fund current marginal changes. The question isn't "did history cause development?" but "did our marginal input shift the trajectory?"
      *   **Evidential Standard for Renewal:**
          *   Cannot randomise districts.
          *   Need: Staggered rollout (if possible), process tracing, contribution analysis rather than pure attribution.
          *   Specific design change: Stop matching on capacity. Use instrumental variables or regression discontinuity if thresholds exist. Collect data on *mechanisms* (e.g., time to register land) not just outcomes (firm formation).
      *   **Counter-Argument (The Principle Trustee):**
          *   Point: Consistency. If we demand RCTs from applicants, we must demand it from ourselves.
          *   Rebuttal: The rule exists to prevent waste, not to prevent funding unmeasurable goods. If the rule excludes all governance work, the rule is flawed, not the work. A waiver acknowledges this structural limit.
      *   **Closing Statement:** Public-facing justification.

  4.  **Refining and Editing (Word Count & Tone):**
      *   *Tone:* Professional, decisive, nuanced, British English (programme, centre, analyse, etc.).
      *   *Word Count Check:* Keep it tight. Avoid jargon where possible, explain where necessary.
      *   *Technical Explanations:* Ensure "matching on downstream variables" and "difference-in-differences" are clear contextually.
      *   *Two-Clocks:* Be precise. Timing breaks confounding only if no other time-varying confounders exist.
      *   *Historian:* Focus on "marginal contribution" vs "historical determinism".

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Rec: Renew + Waiver.
      *   Why: Governance is vital but hard to measure.
      *   Economist: Yes, matching on capacity is biased. We must stop doing that.
      *   Two-Clocks: Good point, but needs assumption of no other shocks.
      *   Historian: True, history matters, but we fund marginal change.
      *   New Standard: Process tracing + mechanism data.
      *   Counter: Consistency is good, but rigid rules kill mission.
      *   Close: We fund hope based on evidence, not certainty.

  6.  **Drafting - Iteration 2 (Writing & Polishing):**
      *   *Check British English:* Programme, centre, analyse, favour, modelling.
      *   *Check Word Limit:* Aim for ~1,100 to be safe under 1,300.
      *   *Check Requirements:* Did I answer the "two-clocks" specific question? Yes. Did I address the economist's specific objection? Yes. Did I address the historian's philosophical point? Yes. Did I set a concrete standard? Yes. Did I address the principle trustee? Yes. Closing sentences? Yes.

      *(Self-Correction during drafting)*: Make sure the recommendation is very clear at the start. Ensure the waiver request is specific (approve at this meeting). Ensure the "Two-Clocks" explanation is accessible. The economist's point is about "conditioning on a collider" or "post-treatment bias" - explain it simply as "matching on something the programme itself changed".

      *(Refining the Historian point)*: The historian says we can't separate history from institutions. The rebuttal is we don't need to separate them to know if *our* money helped. We need to know if the *change* was due to us.

      *(Refining the Evidential Standard)*: Move from "attribution" to "contribution". Require data on mechanisms.

      *(Refining the Counter-argument)*: Acknowledge the moral weight. It's about integrity. But integrity also means not abandoning hard problems.

      *(Closing)*: Needs to be punchy.

  7.  **Final Review against constraints:**
      *   British English? Yes.
      *   Under 1,300 words? (Will monitor closely).
      *   Actionable? Yes.
      *   No citations? Yes.

      *Let's write.*

      *Word Count Check Strategy:* I will write concisely. I will avoid long introductions. I will get straight to the recommendation.

      *Specific Technical Phrasing:*
