  **To:** Board of Trustees
  **From:** [Your Name]
  **Date:** 24 October 2023
  **Subject:** Decision on Governance Programme Renewal

  **Recommendation**
  I recommend we renew the governance programme for five years, subject to two conditions. First, the Board must approve a formal waiver of the mandate requiring randomised or credible quasi-experimental evidence for this specific programme. Second, renewal is contingent on the programme team adopting a redesigned monitoring framework agreed by the Evaluation Unit within six months. I ask the Board to vote on the waiver and the renewal principle at this meeting.

  **Reasoning: The Technical Objections**
  The debate turns on whether we can trust the evaluation's claim that our funding caused the improvement. The economist's objection is substantial. Matching districts based on administrative capacity is methodologically flawed if that capacity was itself improved by our earlier interventions. In technical terms, this is conditioning on a post-treatment variable. This does not necessarily prove the programme failed, but it inflates the estimated effect. It is fatal to the accuracy of the estimates and undermines the conclusion that the programme was the primary driver, though it does not prove the programme had no effect. We cannot accept the reported magnitude of success as fact.

  The evaluator's "two-clocks" argument—that timing identifies causation because our interventions moved faster than geography or history—offers a partial defence. Difference-in-differences relies on the assumption that, absent the programme, the treated and untreated districts would have followed parallel trends. Timing breaks a static confound only if no other time-varying factors coincided with our entry. The inference fails if, for example, a national tax reform or a commodity boom occurred in 2014 alongside our work. We have no evidence ruling this out. Therefore, while the timing argument is stronger than a simple cross-sectional comparison, it does not meet our mandate's threshold for "credible quasi-experimental" proof on its own.

  **The Historian's Challenge**
  The historian raises a deeper philosophical issue: can we justify spending based on variables we cannot change, such as legal tradition or disease burden? The answer is no, not as direct levers. We cannot fund "history". However, these variables are not reasons to spend; they are reasons to be cautious. They define the baseline risk. The Board is not choosing between accounts of the past, but between accounts of the marginal contribution. Even if highland districts were always destined to outperform lowland ones, the question remains whether our injection of capital accelerated that trajectory beyond the historical trend. The historian is right that we cannot disentangle the deep past, but wrong to imply this makes current intervention futile. We fund the margin, not the base.

  **Evidential Standard for Renewal**
  Since randomisation is impossible at this scale, and standard quasi-experimental methods are compromised by the historical confounds identified, we must shift the evidential standard from pure attribution to contribution analysis. For the next period, I propose we accept causal warrant based on three criteria:
  1.  **Mechanism Data:** The programme must collect granular data on intermediate steps (e.g., time taken to register land, number of procurement audits completed) rather than relying solely on distal outcomes like firm formation. This verifies the chain of causation even if the final outcome is noisy.
  2.  **Process Tracing:** Evaluators must document decision-making within partner institutions to confirm that changes in behaviour align with our inputs, ruling out alternative explanations for specific reforms.
  3.  **Negative Controls:** We should identify specific districts or sectors where we deliberately did not intervene despite having the capacity to do so, to serve as a clearer counterfactual than the current matched controls.

  **The Principle Objection**
  One trustee argues that waiving the mandate undermines our integrity, as we demand this standard from applicants. This position is right in principle but wrong in application. The mandate exists to prevent waste, not to prevent funding interventions that are inherently hard to measure. If we apply the rule rigidly, we systematically exclude governance and institutional work from our portfolio, skewing our funding towards simpler interventions like bednet distribution where randomisation is easy. This would be a failure of mission, not a victory for rigour. A waiver acknowledges that the rule is imperfect, not that the standard is unnecessary. We hold ourselves to the *spirit* of the rule—evidence-based decision-making—by demanding a redesigned framework, rather than the *letter* of a rule that renders our core work impossible.

  **Public Statement**
  If asked why we continue to fund institutional reform in a country whose history we cannot run an experiment on, I will say:
  "We do not fund history; we fund the margin of change within it. While we cannot isolate every variable in a complex society, we can trace the mechanisms by which our support improves lives. To withdraw because perfection is impossible would be to abandon the hardest work of development to those willing to guess rather than measure. We choose to measure what we can, and act where we must."
