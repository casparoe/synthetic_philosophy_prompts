      *   We need to handle the conceptual vs. perceptual distinction.
      *   We need to handle the "Geometric Description" thought experiment.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Timeframe.* The prompt asks to specify instant vs. week later. The cataract data shows failure at $t=0$ but success at $t=1$ week. If the theory says "Yes" only for $t=1$ week, is it dodging? No, because learning happens. But the *original* question is usually interpreted as "upon first sight."
          *   *Draft:* Must specify the time window.
          *   *Refinement:* Distinguish between *immediate* recognition (innate/common sense) and *acquired* recognition (learning). The substantive question is about the immediate case.

      *   *Requirement 2: Concept vs. Deployment.* Possessing the concept of a cube via touch vs. applying it to visual data.
          *   *Draft:* Don't confuse knowing what a cube is with seeing it as a cube.
          *   *Refinement:* Must distinguish concept possession (tactile) from cross-modal deployment (visual).

      *   *Requirement 3: Behavioral vs. Phenomenal.* Pointing correctly vs. saying "I know." The cataract patients might point above chance but deny knowledge.
