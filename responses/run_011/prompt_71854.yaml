      *   *Correction on Collision:* The user suspects Non-circularity vs. Cataract data. I need to validate this. If cataract patients have *no* cross-modal link at $t=0$, learning requires a link. If they have *no* link, learning is impossible. If they *have* a link, why the failure? The tension is actually between *Cataract Data* (No immediate link) and *Infant Data* (Yes immediate link). The Non-circularity requirement exacerbates this. I will frame the collision as "Empirical Consistency" vs. "Learning Mechanism."
