      *   *Verdict:* This is the hardest constraint. It eliminates "Pure Empiricism" (no innate link) because it can't explain infant data easily, and it eliminates "Strong Nativism" (full innate link) because it can't explain cataract failure.

  6.  **Addressing the Geometric Description Case:**
