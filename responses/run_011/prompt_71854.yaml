      *   *Non-negotiable:* Timeframe specification, Concept/Deployment distinction, Behavioral/Phenomenal distinction, Non-circular learning, Reconciliation of empirical data (Infant vs. Cataract).
      *   *Local Commitment:* Plane/Solid asymmetry (Reid's specific view), Geometric Description outcome (depends on theory of imagery), Common Content (Leibniz vs. Locke).

  5.  **Addressing the "Collision" (Non-circularity vs. Cataract Data):**
