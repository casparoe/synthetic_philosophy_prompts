  7.  **Evaluating Historical Positions:**
      *   *Locke/Molyneux:* Fits cataract data (No). Struggles with infant data. Learning story risks circularity.
      *   *Leibniz:* Fits infant data (Yes). Struggles with cataract data (why the delay?).
