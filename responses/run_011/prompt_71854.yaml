answer: |-
  Here are the desiderata for an account of cross-modal spatial content sufficient to render Molyneux's Question substantive.

  ### Desiderata for Cross-Modal Spatial Content

  1.  **Temporal Specificity**
      *   **Requirement:** The account must explicitly distinguish between the *immediate* moment of first sight ($t=0$) and the *delayed* period after visual-tactile correlation ($t=1$ week). It must state whether a "Yes" verdict at $t=1$ week counts as a solution to Molyneux's Question or a dissolution of it.
      *   **Case/Consideration:** The cataract data shows failure at $t=0$ but success at $t=1$ week. If a theory claims "Yes" based on the week-later data, it risks turning the question into a trivial claim about associative learning. If it claims "No" based on $t=0$, it must explain the rapid acquisition without conceding that the initial lack was merely a performance error.
      *   **Status:** **Non-negotiable.** Without this, the debate conflates innate capacity with acquired skill.

  2.  **Concept Possession vs. Cross-Modal Deployment**
      *   **Requirement:** The account must distinguish between possessing a shape concept via touch and the capacity to deploy that concept on visual input. A "Yes" answer must specify whether the subject recognizes the *object* or merely the *spatial structure*.
      *   **Case/Consideration:** A subject might possess the tactile concept of "cube" but lack the visual file to store the new data. Failure might be a filing error, not a lack of conceptual understanding. Conversely, success might be a low-level perceptual match without conceptual labeling.
      *   **Status:** **Non-negotiable.** This prevents the verdict from resting on an equivocation about what it means to "know" the shape.

  3.  **Phenomenal Report vs. Forced-Choice Behavior**
      *   **Requirement:** The account must differentiate between above-chance pointing (behavioral) and a sincere report of recognition (phenomenal). It must explain what it means if a subject points correctly but insists they are guessing.
      *   **Case/Consideration:** Cataract patients often exhibit blindsight-like phenomena or implicit learning where behavior outpaces conscious report. If the question is about *visual experience*, behavioral success alone is insufficient. If it is about *information access*, behavior suffices.
      *   **Status:** **Non-negotiable.** This ensures the question targets perception rather than mere motor conditioning.

  4.  **Empirical Consistency (Infant vs. Adult)**
      *   **Requirement:** The account must reconcile the infant pacifier data (positive transfer) with the adult cataract data (negative immediate transfer). It cannot simply discard one dataset as noise.
      *   **Case/Consideration:** Infants show cross-modal transfer before language; adult cataract patients do not. A theory claiming "No innate link" struggles with infants. A theory claiming "Innate link" struggles with cataract patients. The theory must posit a mechanism (e.g., critical periods, attentional decay, or conceptual interference) that explains the divergence.
      *   **Status:** **Non-negotiable.** A philosophical account contradicted by robust empirical data in both directions is merely speculative.

  5.  **Non-Circular Learning Mechanism**
      *   **Requirement:** If the verdict is "No" (immediate failure), the account must explain how learning occurs at $t=1$ week without presupposing the very cross-modal mapping the subject is supposed to be learning.
      *   **Case/Consideration:** To learn that *this* look matches *that* feel, the subject must be able to track the object across modalities. If they cannot identify the object cross-modally at $t=0$, they cannot correlate the data. The theory must identify the "bridge" property (e.g., motion, temporal synchrony) that allows the association to begin without circularity.
      *   **Status:** **Non-negotiable.** Without this, the "learning" explanation is an empty placeholder.

  6.  **The Propositional Access Constraint (The Geometric Description Case)**
      *   **Requirement:** The account must predict the outcome of the "Geometric Description" case and explain the mechanism. If the subject succeeds with a verbal/geometry briefing, the theory must explain how propositional knowledge substitutes for perceptual integration. If they fail, it must explain why propositional knowledge is inert regarding perceptual content.
      *   **Case/Consideration:** If a subject knows the projection geometry of a cube verbally, does that grant visual recognition? If yes, perception is cognitively penetrable or computational. If no, perceptual content is non-propositional and distinct from geometric understanding. This tests whether the barrier is *informational* or *experiential*.
      *   **Status:** **Non-negotiable.** This isolates whether the deficit is in reasoning or in sensing.

  7.  **Dimensional Asymmetry Explanation**
      *   **Requirement:** The account must either predict or explain away the difference between plane figures (2D) and solids (3D). It cannot assume the transfer difficulty is identical for both.
      *   **Case/Consideration:** Reid's observation that plane figures (a circle vs. a square) might be easier to match than solids (sphere vs. cube) because the retinal image resembles the tactile contour more directly. A theory treating all spatial content as identical fails to capture this gradient.
      *   **Status:** **Local Commitment (Reidian).** Essential if one accepts Reid's distinction; optional if one argues 2D and 3D perception rely on the same underlying spatial module.

  8.  **Complexity and Familiarity Gradient**
      *   **Requirement:** The account must issue checkable predictions about shape complexity. Does transfer fail for a cube but succeed for a star? Does prior tactile familiarity with a shape improve visual recognition speed?
      *   **Case/Consideration:** If the common content is "extension," complexity shouldn't matter fundamentally. If the content is "feature matching," complex shapes should be harder. This moves the question from a binary Yes/No to a scalable function.
      *   **Status:** **Local Commitment (Empiricist).** Required if the theory posits association by features; less critical if the theory posits a global spatial faculty.

  9.  **Ontology of Spatial Content**
      *   **Requirement:** The account must specify whether spatial content is *amodal* (one representation accessed by two senses) or *modality-specific* (two representations that must be linked).
      *   **Case/Consideration:** Leibniz argues for amodal extension (Yes); Locke argues for modality-specific ideas (No). This is the metaphysical ground of the dispute.
      *   **Status:** **Local Commitment (Leibnizian vs. Lockean).** One must choose a side to generate a prediction, but the desideratum is that the choice be explicit.

  ***

  ### Analysis of Constraints and Collisions

  **The Requirement That Eliminates the Most Candidates:**
  **Requirement 5 (Non-Circular Learning Mechanism)** is the most destructive. Most "No" theories (Lockean/Empiricist) simply assert that the subject learns the connection through experience. However, when pressed on *how* the subject identifies the same object across senses without prior cross-modal knowledge, these theories often fall silent or resort to vague appeals to "attention." Any theory that cannot specify the bootstrapping mechanism (e.g., temporal synchrony, motion tracking) fails this requirement.

  **The Suspected Collision:**
  Your suspicion is correct, but the collision is sharper than you stated. It is not merely between **Non-Circularity (Req 5)** and **Cataract Data**; it is a three-way collision between **Cataract Data (Req 4)**, **Infant Data (Req 4)**, and **Non-Circularity (Req 5)**.
  *   **The Conflict:** The cataract data suggests no cross-modal link exists at $t=0$ in adults (supporting "No"). The infant data suggests a cross-modal link *does* exist pre-verbally (supporting "Yes").
  *   **The Impossibility:** If you posit an innate link to satisfy the Infant Data, you cannot explain the Cataract failure without ad-hoc assumptions (e.g., "it decayed"). If you posit no innate link to satisfy the Cataract Data, you cannot explain the Infant success without ad-hoc assumptions (e.g., "infants are different").
  *   **The Learning Trap:** If you say "they learn it," Requirement 5 demands a non-circular mechanism. But if the Cataract Data is right that there is *no* initial overlap, there is no common variable to anchor the learning. If there *is* a common variable (to allow learning), the Cataract Data's claim of total initial failure is undermined.
  *   **Verdict:** This suggests Molyneux's Question may not have a binary Yes/No answer that holds across development. A theory that satisfies all desiderata must likely posit a *latent* common structure (satisfying Infants) that requires a *trigger* or *calibration* period in adults (satisfying Cataracts), rather than a simple presence/absence of content.

  **The Geometric Description Case:**
  Your list requires the theory to take a stand here (Requirement 6).
  *   **If the answer flips to "Yes":** The account must argue that perceptual recognition is a form of hypothesis testing where verbal geometry provides the hypothesis. This threatens the "substantive" nature of the question, making it about reasoning speed rather than perception.
  *   **If the answer remains "No":** The account must argue that perceptual content is *analog* or *phenomenal* in a way that propositional geometry cannot replicate. This preserves the substantive nature of MQ but risks making perception mysteriously inaccessible to cognition.
  *   **Obligation:** An account owes an explanation of *why* the description is idle (if No) or *how* it bypasses the sensory deficit (if Yes). It cannot ignore this case as "cheating."

  ***

  ### Historical Positions Against the Desiderata

  **Molyneux and Locke (The "No" Camp):**
  They satisfy the Cataract Data and the Temporal Specificity (insisting on $t=0$). However, they struggle severely with Requirement 4 (Infant Data), which was unavailable to them but is fatal to a strict "no innate link" view today. More critically, they often fail Requirement 5 (Non-Circular Learning); Locke suggests association but does not explain how the association is initiated without a prior common identifier. They treat the modalities as hermetically sealed, making the eventual learning somewhat miraculous.

  **Leibniz (The "Yes" Camp):**
  Leibniz satisfies Requirement 9 (Amodal Ontology) and handles Requirement 4 (Infant Data) well by positing common rational structures. However, he fails Requirement 1 (Temporal Specificity) by ignoring the phenomenological delay reported in later empirical cases. He treats the mind as a geometer that *should* see the connection immediately, failing to account for the physiological or attentional bottlenecks revealed by the cataract patients. He risks conflating conceptual truth with perceptual readiness.

  **Reid (The Conditional Camp):**
  Reid fares best on Requirement 7 (Dimensional Asymmetry) and Requirement 8 (Complexity), acknowledging that 2D and 3D transfer differ. His "geometer" condition anticipates Requirement 6 (Propositional Access). However, Reid's reliance on "calculation" to bridge the gap in the solid case risks violating Requirement 2 (Concept vs. Deployment); if the subject must calculate, they are not strictly recognizing by *sight alone* in the perceptual sense, but by inference. He navigates the collision best but at the cost of making the "Yes" verdict intellectual rather than perceptual.
