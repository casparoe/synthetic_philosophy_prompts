answer: |-
  # Part One: The Axes

  The table below sets out the structural distinctions that divide the logical space. These are not yet moral positions, but the dimensions along which positions differ. I have noted where axes appear independent and where they tend to collapse into one another in practice.

  | Axis | Distinction | Independence Note |
  | :--- | :--- | :--- |
  | **1. Unit of Counting** | Do we sum total welfare (the sum) or count individual claims (the person)? | Independent. You can sum welfare per person or refuse to sum across persons. |
  | **2. Currency of Harm** | Are all harms comparable (life, limb, pain) or do some outweigh any number of others? | Often collapses into Axis 1. If harms are incomparable, summation becomes impossible. |
  | **3. Risk and Chance** | Do we weigh probabilities (expected value) or prioritize certainty (sure save)? | Independent. You can sum expected values or refuse to gamble lives. |
  | **4. Time and Identity** | Do present identifiable lives count more than future statistical lives? | Partially collapses into Axis 2. Future harms are often seen as less certain or less severe. |
  | **5. Procedure** | Is fairness found in the outcome (who lives) or the process (how we chose)? | Independent. You can maximize outcomes fairly or fairly maximize outcomes. |
  | **6. Agent's Role** | Do personal promises or the rescuer's safety change the duty? | Independent. Impartial views deny this; partial views accept it. |
  | **7. Tie-Breaking** | When claims are equal, is a coin toss required, permitted, or irrelevant? | Collapses into Axis 5. If process matters, tosses are required; if only outcomes matter, tosses are waste. |

  **Missing Axes:** You have not explicitly included the **cost to the rescuer**. In lifeboat work, the helm's safety is a variable. I have added this to Node 9. You also hint at **repeat decisions** (policy vs. case); I have added this to Node 11.

  ***

  # Part Two: The Questions

  **Node 1** (Case a)
  You hear calls from two groups. Three people cling to a wreck to the north; one person clings to a wreck to the south. You have fuel to reach only one group before the tide turns.
  A. Go north to save the three.
  B. Go south to save the one.
  C. Flip a coin to decide which direction to steer.

  **Node 2** (Case c)
  Five people will each lose a hand unless you go to them. One person will die unless you go to him. You can reach only one group.
  A. Go to the one to prevent the death.
  B. Go to the five to prevent the five injuries.
  C. Flip a coin to decide which group to help.

  **Node 3** (Case b)
  You can perform a rescue that will certainly save one person. Alternatively, you can attempt a winch operation with an even chance of saving all five and an even chance of saving none.
  A. Take the certain rescue of the one.
  B. Take the risky winch attempt for the five.
  C. Ask the people involved which risk they prefer.

  **Node 4** (Case e)
  You have a medical supply that can cure one person's permanent paralysis. Used another way, it spares a million people from a week of severe headaches.
  A. Cure the paralysis.
  B. Spare the million headaches.
  C. Divide the supply to help both partially.

  **Node 5** (Case d)
  You can pull five villagers from a flooded house today. Or you can spend the same effort on a scheme that will keep fifty people alive ten years from now.
  A. Save the five villagers today.
  B. Fund the scheme for the fifty future people.
  C. Split the effort between the two options.

  **Node 6** (Tie-Break)
  Two people are in identical danger, equidistant from you. You can save only one. There is no difference in age, health, or circumstance.
  A. Save the person on your left.
  B. Save the person on your right.
  C. Toss a coin to choose between them.

  **Node 7** (Post-Choice)
  You chose to save the three instead of the one (Node 1). The one person dies. You meet the family of the person left behind.
  A. Tell them you saved the greater number.
  B. Tell them you are sorry, but offer no justification.
  C. Tell them you tossed a coin, even if you did not.

  **Node 8** (Promise)
  You promised your crew you would not take unnecessary risks. Saving five strangers requires breaking that promise; saving one friend keeps it.
  A. Save the five strangers.
  B. Keep the promise and save the friend.
  C. Ask the crew to release you from the promise.

  **Node 9** (Rescuer Risk)
  Saving three people carries a high risk that you, the helm, will die. Saving one person carries almost no risk to you.
  A. Accept the risk to save the three.
  B. Decline the risk and save the one.
  C. Put the decision to a vote among your crew.

  **Node 10** (Threshold)
  Five people will lose a finger unless you go to them. One person will die unless you go to him.
  A. Save the one life.
  B. Save the five fingers.
  C. Toss a coin to decide.

  **Node 11** (Policy)
  You must write a rule for the station. Should it say "Always save the greater number" or "Assess each case on its own"?
  A. Always save the greater number.
  B. Assess each case on its own.
  C. Save the greater number unless harms differ greatly.

  **Node 12** (Compensation)
  You saved the three. The one person left behind survives but loses their boat.
  A. The station owes them nothing; it was a tough choice.
  B. The station owes them an apology and compensation.
  C. The station owes them a formal explanation of the math used.

  ***

  # Part Three: The Leaves and the Key

  **Leaf 1: The Tally-Keeper (Utilitarian)**
  *   **Pattern:** Mostly A answers on Nodes 1, 2, 3, 4, 5, 11.
  *   **Hardest Commitment:** Defending the choice to sacrifice one innocent person if doing so saves even more lives elsewhere.

  **Leaf 2: The Claim-Holder (Non-Aggregative)**
  *   **Pattern:** Mostly B answers on Nodes 1, 2, 4, 10; prefers individual claims over sums.
  *   **Hardest Commitment:** Explaining why you let five people lose hands when you could have saved them all to spare one death.

  **Leaf 3: The Threshold-Guard**
  *   **Pattern:** A on Nodes 1 and 10 (Life wins), but B on Node 4 (Headaches don't count).
  *   **Hardest Commitment:** Defining exactly where the threshold lies between a headache and a broken bone without arbitrariness.

  **Leaf 4: The Fairness-First (Proceduralist)**
  *   **Pattern:** Mostly C answers on Nodes 1, 6, 7, 10.
  *   **Hardest Commitment:** Accepting that more people might die because you refused to weigh their numbers against others.

  **Leaf 5: The Certainty-Seeker (Risk-Averse)**
  *   **Pattern:** A on Node 3 (Certain 1), A on Node 9 (Low Risk).
  *   **Hardest Commitment:** Admitting you chose a smaller rescue because the larger one involved chance, even if the odds were good.

  **Leaf 6: The Present-Binder**
  *   **Pattern:** A on Node 5 (Present 5), B on Node 11 (Case by Case).
  *   **Hardest Commitment:** Justifying why people alive today matter more than people who will exist tomorrow.

  **Leaf 7: The Agent-Centred**
  *   **Pattern:** B on Node 8 (Promise/Friend), C on Node 9 (Crew Vote).
  *   **Hardest Commitment:** Defending why your personal promises outweigh the needs of strangers in a public emergency.

  **Unoccupied Combinations:**
  *   *The Risky Aggregator:* Someone who chooses B on Node 3 (Risky 5) but B on Node 1 (Save the One). This is coherent (maximize expected value but respect individual rights) but rare; nobody is there because it requires holding two conflicting views on risk simultaneously.
  *   *The Future Absolutist:* Someone who chooses B on Node 5 (Future 50) but A on Node 1 (Present 3). This is unoccupied because valuing future statistics over present lives usually implies valuing numbers over individuals across the board.

  **Indistinguishable Leaves:**
  *   *Leaf 2 (Claim-Holder) and Leaf 3 (Threshold-Guard):* These cannot be fully separated by these questions alone. Both reject summing small harms against life. They are flagged here as distinct only because the Threshold-Guard allows numbers to count once harms are equal (Node 1), whereas the Claim-Holder might still toss a coin (Node 1, Option C).

  ***

  # Part Four: Two Short Judgements

  **1. Which single question does most of the sorting work?**
  **Node 2 (Five Hands vs. One Life).** This is the pivot point. Those who save the one reject aggregation of lesser harms; those who save the five accept that numbers can outweigh severity. It separates the Tally-Keepers from the Claim-Holders and Threshold-Guards more cleanly than the standard lifeboat case.

  **2. Which of my six cases is the weakest?**
  **Case (f) (The Antidote).** It is too contrived. The "all or nothing" requirement for the sixth person introduces a technical constraint about resource divisibility that distracts from the moral question of numbers. It tests logistics more than ethics. I would cut it.
