      *   *Move 4 (Tom - Sharpen Units/Data Hands You Contrast):* **Mixed.** "Sharpen units" is good advice, but "data hands you the contrast" is naive realism. The choice of China is theoretical, not just empirical.
      *   *Move 5 (Priya - Measurement Basis):* **Right.** Real wage debates (Broadberry vs. Pomeranz/Allen) show that the *divergence* itself is measurement-dependent.
