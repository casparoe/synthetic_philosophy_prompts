answer: |-
  ### 1. On Ill-Posed vs. Imprecise Questions

  A historical question is **imprecise** when its terms lack operational clarity but can be sharpened without altering the causal structure (e.g., defining "industrialisation" as "mechanised cotton spinning" vs. "general productivity growth"). It is **ill-posed** when the logical structure of the inquiry precludes a valid causal inference. In contrastive explanation (van Fraassen), a question "Why P rather than Q?" is ill-posed if the foil Q does not share the relevant causal background with P, making isolation of the difference-maker impossible. If "China" is treated as a monolith when the relevant variation is regional, or if the timeline assumes a divergence before one empirically existed, the question smuggles in the answer or renders the counterfactual incoherent. Imprecision is a measurement error; ill-posedness is a structural error in the research design.

  ### 2. Rating the Moves

  **1. Priya (Foil Relativity):** **Right.**
  She correctly identifies that causal claims are inherently contrastive. "Why Britain not China?" searches for variables absent in China but present in Britain. "Why Britain not Holland?" searches for variables absent in Holland but present in Britain. These yield different causes (e.g., coal vs. financial institutions). Treating them as the same question creates the illusion of debate where there is actually conceptual slippage.

  **2. Tom (Hard Fact):** **Partially Wrong.**
  While the existence of spinning jennies is a hard fact, "Industrialisation" is a theoretical category, not a brute datum. More critically, asserting that a hard fact guarantees a well-posed *explanatory* question is a category error. We can agree on the fact (P) and still disagree on whether Q is the appropriate foil to explain it. Realism about events does not validate realism about causal contrasts.

  **3. Priya (Loaded Units):** **Right.**
  This is the strongest philosophical move. Selecting "Britain" and "China" as units *post hoc* based on the outcome is selection bias on a civilisational scale. It commits the ecological fallacy: assuming the properties of the aggregate (China) apply to the relevant sub-unit (Yangzi Delta). If the causal mechanism is local (e.g., coal access), comparing a nation to a region invalidates the inference.

  **4. Tom (Sharpen Units/Data Contrast):** **Mixed.**
  "Sharpen the units" is good methodological advice, but his claim that "the data hands you the contrast" is naive realism. The choice of China as the foil is theory-laden (the Needham puzzle), not data-driven. The data shows many regions didn't industrialise; choosing China specifically presupposes that China *should* have, which requires its own justification. However, he is right that Priya's critique applies to all history, not just this question.

  **5. Priya (Measurement Basis):** **Right.**
  She touches on the "California School" critique (Pomeranz, Wong). If the divergence disappears when measuring real wages in grain rather than silver, then the *explanandum* (the divergence itself) is unstable. You cannot explain a gap that is an artifact of the numeraire. This undermines Tom's "hard fact" claim regarding economic performance.

  **6. Tom (Deflationism):** **Wrong.**
  This is a strawman. Arguing that a question is ill-posed is not arguing for silence; it is arguing for *reformulation*. Priya is not demanding anecdotes; she is demanding that the units of analysis match the causal mechanisms. Tom conflates philosophical rigour with nihilism to protect a traditional framing that is historically suspect.

  ### 3. What They Are Missing

  Both interlocutors are arguing in a vacuum of abstract philosophy and stylized facts, missing the specific historiographical turns that actually resolve this tension.

  *   **Pomeranz's *The Great Divergence* (2000):** Priya hints at this in Move 3, but she needs Pomeranz's specific claim: the divergence is *late* (c. 1800) and *local* (Britain vs. Yangzi Delta, not Europe vs. China). Before 1750, the advanced regions of China and Europe were in a "Smithian" equilibrium. This validates Priya's unit critique but limits it: the question isn't ill-posed, it's just mis-scaled.
  *   **Elvin's *High-Level Equilibrium Trap* (1973):** Tom needs this. Elvin argues China didn't industrialise *because* it was too efficient in labour-intensive methods, removing the incentive for labour-saving tech. This provides a causal mechanism that respects the "China" unit but explains the negative outcome without resorting to "failure."
  *   **Allen's *The British Industrial Revolution in Global Perspective* (2009):** This bridges the gap. Allen argues the question should be about *factor prices* (high wages, cheap energy). This makes the foil specific: "Why did mechanisation occur where labour was expensive and energy cheap?" This allows for multiple successful regions (Britain, parts of Belgium) and multiple failures (China, France), dissolving the binary Britain/China trap.
  *   **Counterfactual Robustness:** They are missing the philosophical literature on historical counterfactuals (e.g., Tetlock, Lebow). A question is well-posed only if the counterfactual ("China industrialises") is historically plausible given the antecedent conditions. If the structural conditions for industrialisation were absent in China, asking "why not" is like asking "why didn't this stone fly?"

  ### 4. Verdict

  **The Question is Well-Posed Only After Repair.**

  The classic formulation ("Why Britain and not China?") is **ill-posed** because it conflates distinct causal questions (institutional vs. geographical vs. economic) and relies on heterogeneous units of analysis that guarantee selection bias. Priya is right that the current framing is philosophically bankrupt; Tom is right that abandoning the query entirely yields no history.

  **The Repair:**
  You must operationalize the question using **Allen's factor price framework** constrained by **Pomeranz's regional specificity**.

  *   **Bad Question:** "Why did Britain industrialise and China did not?" (Implies civilisational essences, ignores regional variation, assumes early divergence).
  *   **Repaired Question:** "Under what conditions did the ratio of wage costs to energy costs in the North Atlantic basin c. 1750–1850 cross the threshold for labour-saving mechanisation, and why did comparable advanced regions (e.g., Yangzi Delta) fail to cross this threshold despite similar technological capabilities?"

  **Why this works:**
  1.  **Fixes the Foil:** It stops comparing "Britain" to "China" and starts comparing "high-wage/cheap-energy regions" to "low-wage/expensive-energy regions."
  2.  **Fixes the Units:** It acknowledges that "China" is irrelevant unless we specify the Yangzi Delta (the only comparable region).
  3.  **Fixes the Mechanism:** It moves away from vague "culture" or "institutions" to testable economic variables (prices, coal access, ghost acres).
  4.  **Preserves the History:** It allows Tom to keep his mechanised spinning facts while forcing him to accept Priya's demand for conceptual rigour.

  Tell Priya she wins the philosophy but loses the pessimism; tell Tom he wins the history but loses the binary. The "Needham Question" survives, but only if it stops being about nations and starts being about economic constraints.
