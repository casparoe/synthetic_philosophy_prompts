      *   *Critique:* Don't just say "Priya wins." Tom has a point about historical realism. Priya risks paralysis. The synthesis is in the *repair*.

      *(Self-Correction during drafting)*: I need to make sure I don't just summarize the Great Divergence literature but use it to judge the *moves*. For instance, when Priya talks about units (Move 3), I should explicitly link that to Pomeranz's Yangzi Delta argument. When Tom talks about hard facts (Move 2), link to Allen's patent/tech data.

      *(Refining the "Ill-posed" definition)*: A question is ill-posed if the contrast class is heterogeneous regarding the putative cause. If "China" includes regions that *did* have the conditions but didn't industrialize for other reasons, the comparison fails.

