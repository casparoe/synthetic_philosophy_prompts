      *   *Imprecise:* Vague terms that can be operationalized (e.g., "industrialisation" needs a definition, but once defined, it works).
      *   *Ill-posed:* The structure of the inquiry presupposes a causal mechanism that cannot exist, or selects variables in a way that guarantees the conclusion (tautology), or relies on a foil that renders the counterfactual impossible. It's about *logical coherence* and *causal identifiability*, not just measurement error.
