answer: |-
  ### 1. The Contractualist Procedure and the Licensing of Options

  Scanlonian contractualism judges the permissibility of an action by asking whether the principles governing it could be **reasonably rejected** by anyone. The core procedure involves identifying the **strongest individual complaint** that can be made against each available option and comparing them. Crucially, Scanlon rejects **aggregation**: one cannot sum many small benefits to outweigh a single large burden. We must compare the stakes of the individual with the most to lose under Option A against the stakes of the individual with the most to lose under Option B.

  In this scenario, the public health authority faces a choice:
  *   **Option 1 (Screening):** Imposes a small financial levy on all taxpayers; prevents a handful of premature deaths.
  *   **Option 2 (Preventive Campaign):** Uses the budget to provide individually trivial health benefits (symptom-free days) to almost everyone; prevents no deaths.

  **The Comparison of Complaints:**
  *   **Against Option 1:** Who has the strongest complaint if this option is chosen?
      *   *Taxpayers:* They bear a small financial levy. Their complaint is weak (minor financial loss).
      *   *The Majority:* They lose out on the trivial symptom-free days offered by Option 2. Their complaint is weak (loss of minor comfort).
  *   **Against Option 2:** Who has the strongest complaint if this option is chosen?
      *   *The Potential Victims:* A handful of individuals will die prematurely who would have been saved by screening. Their complaint is extremely strong (loss of life/future).

  **The Verdict:**
  Contractualism licenses (and likely requires) **Option 1**. The rejection of aggregation means the authority cannot justify Option 2 by summing the trivial benefits of the many ("millions of symptom-free days") to outweigh the deaths of the few. The procedure isolates the individual facing death and compares their stake to the individual facing the levy or the loss of trivial comfort. Since the loss of life is a significantly stronger generic reason for rejection than a small financial cost or minor health inconvenience, a principle allowing Option 2 would be reasonably rejected by those destined to die. Therefore, the authority must choose the screening programme.

  ---

  ### 2. Statistical vs. Identified Lives

  Does the conclusion survive the fact that the lives saved are **statistical** rather than identified?

  **Yes, the conclusion survives.** Scanlon's framework does not rely on the identifiability of victims to generate moral obligations. The contractualist procedure operates on **generic reasons**—reasons that apply to anyone in a relevantly similar situation. The people exposed to the residual risk (those who might die) do not need to know *ex ante* that they specifically will be the victims to hold a valid complaint.

  **The Nature of the Complaint:**
  The complaint held by those exposed to residual risk is not "You killed *me* specifically" (which is impossible to know beforehand), but rather: **"You adopted a principle that subjected me to a significant risk of death for the sake of trivial benefits to others."**
  This is a complaint about the **security of the person** and the **valuation of their life** by the authority. By choosing Option 2, the authority signals that the minor comforts of the population are more valuable than the survival chances of the at-risk group. This violates the requirement to justify one's actions to each person individually. The "ex-ante" risk imposition is sufficient grounds for reasonable rejection when the stakes (death) are this high, regardless of whether the specific victims are named.

  ---

  ### 3. Cost-Per-QALY Reasoning and Justification

  **May the authority use ordinary cost-per-QALY reasoning?**
  **No, not if it relies on aggregation.** Standard Cost-Effectiveness Analysis (CEA) using Quality-Adjusted Life Years (QALYs) is inherently aggregative. It sums total health gains. If the millions of "symptom-free days" in Option 2 sum to a higher total QALY count than the few years of life saved in Option 1, CEA would recommend Option 2.
  Since contractualism forbids aggregating trivial gains to override a vital individual claim, the authority cannot use *pure* QALY maximization as its moral justification. To do so would be to violate the constraint that each person must be justifiable to individually.

  **Justification to Stakeholders:**
  *   **To the Taxpayers (bearing the levy):** The authority can argue that the levy is a fair contribution to a system that prioritizes the most urgent human needs. "We require this contribution because protecting life takes precedence over providing minor conveniences, even if those conveniences are widespread. Your financial loss is outweighed by the moral necessity of preventing death."
  *   **To the Relatives (of those not saved by Option 2):** If the authority chooses Option 1 (Screening), there are no relatives of the "unsaved" from Option 2, because Option 2 saves no one from death. However, if the question implies justifying why they didn't choose a different life-saving measure, the answer is about **priority**. But in this specific binary choice, the relatives of those saved by Option 1 are justified by the fact that their loved ones' lives were not traded for minor comforts.
  *   **If the Authority chose Option 2 (Hypothetically):** They could *not* convincingly justify this to the relatives of the deceased under contractualism. Saying "Your loved one died so that millions could have two extra pain-free days" admits that the deceased was treated as a means to aggregate welfare, which is precisely what contractualism forbids.

  ---

  ### 4. Distributive Facts and the "Worse Off"

  Does anything change if the trivial benefits fall disproportionately on people who are already **considerably worse off** than those who would die?

  **Distributive Facts Do Work, But Not Via Aggregation:**
  Contractualism is not indifferent to distribution; it incorporates a **priority to the worse off**. However, it does this by weighting the *strength of the individual complaint*, not by summing the number of complaints.

  *   **The Mechanism:** If the beneficiaries of Option 2 are desperately ill or impoverished, the loss of "symptom-free days" might constitute a much stronger individual complaint than it would for a healthy, wealthy person. For someone in chronic agony, a symptom-free day is not "trivial"; it may be essential for a minimally decent life.
  *   **The Comparison:** The procedure now compares:
      1.  The complaint of the person facing **death** (Option 2 victim).
      2.  The complaint of the **worse-off person** facing the **loss of relief** (Option 1 beneficiary).

  **Does this restore aggregation?**
  **No.** It does not allow the authority to count the *number* of worse-off people to outweigh the death. It only asks: *Is the individual stake of the worse-off person (relief from suffering) stronger than the individual stake of the at-risk person (survival)?*

  **Likely Outcome:**
  Even with distributive weighting, **death usually trumps.** Unless the "trivial benefits" are misdescribed and are actually vital to preventing severe, unbearable suffering for the worse-off, the loss of life remains the stronger generic reason for rejection. Scanlon acknowledges that while we should prioritize the worse off, there is a threshold of urgency (like survival) that typically overrides lesser needs, even for the disadvantaged.

  However, this distributive nuance *does* prevent the authority from simply dismissing the benefits to the worse off as "trivial." It forces a more rigorous examination of the *quality* of the individual complaint. If the "symptom-free days" alleviate suffering that makes life barely worth living, the individual complaint of the worse-off person strengthens significantly. But unless that individual complaint exceeds the complaint of losing one's life, contractualism still licenses Option 1. The distributive facts refine the comparison of individual stakes; they do not license a headcount to override the stakes.
