answer: |-
  This is a profound unease you are feeling, and it is philosophically well-founded. The slogan "Not choosing is still a choice" is a rhetorical hammer that flattens distinct categories of reality (logic, agency, causation, morality) into a single nail. Your family used it to convert your brother's *inaction* into *action* for the purpose of assigning blame.

  Here is the disassembly you asked for.

  ### Part 1: The Menu of Propositions

  The sentence can be parsed into five distinct claims, ranging from a tautology to a heavy moral indictment.

  #### 1. The Logical Claim (The Empty Truth)
  *   **Proposition:** "Refraining from an overt action is a state of affairs that falls under the definition of 'making a decision'."
  *   **Commitment:** You accept that 'choice' includes both commission (doing) and omission (not doing).
  *   **Plausibility:** High. In decision theory, 'null' is a valid option.
  *   **Strength:** **Zero.** This is true but empty. It proves your brother exercised agency, but it says nothing about whether that agency was *culpable* or *causal*. It cannot carry the weight of blame.

  #### 2. The Agency Claim (The Capacity Truth)
  *   **Proposition:** "At the moment of observation, the agent possessed the physical and hierarchical capacity to report the hazard."
  *   **Commitment:** You accept that your brother was not physically restrained or strictly forbidden from speaking, and that he understood the option existed.
  *   **Plausibility:** Contingent. (See the "Supervisor" detail below).
  *   **Strength:** **Weak.** It establishes he *could* have acted, but not that he *should* have, or that his failure *caused* the injury. It establishes opportunity, not guilt.

  #### 3. The Counterfactual Claim (The Causal Truth)
  *   **Proposition:** "If the agent had chosen differently, the outcome would likely have been different."
  *   **Commitment:** You accept the counterfactual theory of causation: $A$ causes $B$ if, without $A$, $B$ would not have occurred. Here, "Reporting" is $A$, and "Injury" is $B$.
  *   **Plausibility:** High, usually. But depends on systemic factors (See "Inspection" detail).
  *   **Strength:** **Moderate.** This establishes causal relevance. It moves from "he did nothing" to "his nothingness allowed the event." However, causal relevance is not the same as sole causation.

  #### 4. The Duty Claim (The Normative Truth)
  *   **Proposition:** "The agent had a specific moral or professional obligation to intervene, making the omission a violation of duty."
  *   **Commitment:** You accept that safety is an individual responsibility that overrides other competing interests (like productivity or silence).
  *   **Plausibility:** High in modern safety culture, but contested in hierarchical labor structures.
  *   **Strength:** **Strong.** This is where blame actually lives. If he had a duty and breached it, he is blameworthy. But this claim requires establishing the *duty*, which the slogan assumes rather than proves.

  #### 5. The Equivalence Claim (The Substantive Moral Truth)
  *   **Proposition:** "A sin of omission is morally identical to a sin of commission."
  *   **Commitment:** You accept that letting a man get hurt is the *same kind of evil* as pushing a load onto his leg.
  *   **Plausibility:** Low to Moderate. Most ethical systems distinguish between killing and letting die, even if both are wrong.
  *   **Strength:** **Maximum.** This is the heavy coat your family draped over him. It equates his silence with active violence.

  ---

  ### Part 2: The Metaphysics of "Nothing"

  You asked: *When my brother did nothing, there doesn't seem to have been anything there... I can't see what the supposed cause is made of.*

  This worry is not a trick of grammar; it is a classic problem in the metaphysics of causation called **Causal Omission**.

  If causation is a transfer of energy (like a billiard ball hitting another), your brother caused nothing. He transferred no energy to the strap. The strap broke due to gravity and material fatigue. In a purely physical sense, your brother is correct: he didn't *do* anything.

  However, in human affairs, we use a **Counterfactual Model** of causation. We do not ask "What energy was transferred?" We ask "What would have happened if the story were different?"
  *   **World A (Actual):** Brother sees strap $\rightarrow$ Brother says nothing $\rightarrow$ Strap breaks $\rightarrow$ Leg crushed.
  *   **World B (Counterfactual):** Brother sees strap $\rightarrow$ Brother speaks $\rightarrow$ Strap replaced $\rightarrow$ Leg safe.

  Because World B is a plausible alternative where the injury does not occur, the *absence* of the report in World A is treated as a cause. The "cause" is not a physical object; it is the **absence of a prevention.**

  **Is the worry serious?**
  Yes. Relying on omissions as causes creates an infinite regress. If your brother caused the injury by not speaking, did the manufacturer cause it by not making the strap stronger? Did the safety inspector cause it by not being there that day? Did *you* cause it by not being there to speak?
  To stop the regress, we must introduce **Normative Expectations**. We only count an omission as a cause if the person *ought* to have acted. Therefore, the slogan cannot establish causation without first establishing duty. Your family used the slogan to prove causation, but it secretly relies on a prior assumption of duty.

  ---

  ### Part 3: Causation vs. Blame

  You asked: *I can't tell whether "he caused it" and "he is to blame for it" are the same question.*

  They are not. The slogan slides between them to make the argument stick.

  *   **Causation** is descriptive. (Did his behavior influence the outcome?)
  *   **Blame** is normative. (Is he the appropriate target for retribution or guilt?)

  One can cause an outcome without being to blame (e.g., a surgeon causes a scar to save a life). One can be to blame for an outcome without causing it (e.g., a conspirator who plans a crime but stays home).

  **The Slide:**
  When your family says "Not choosing is still a choice," they are using the **Logical Claim** (Level 1) to prove the **Agency Claim** (Level 2), then pretending that proves the **Equivalence Claim** (Level 5).
  *   *Premise:* You chose to be silent. (True)
  *   *Conclusion:* You are responsible for the injury. (Non-sequitur without establishing Duty and Capacity).

  The slogan works rhetorically because it makes the *inaction* feel like an *action*. If silence is a "choice," it feels like a movement. If it is a movement, it feels like a cause. If it is a cause, it feels like blame. It is a linguistic sleight of hand.

  ---

  ### Part 4: The Contextual Details

  You provided four specific facts. Here is how they interact with the Menu of Propositions.

  #### 1. Three other employees also saw it and said nothing.
  *   **Impact on Causation (Level 3):** **Dilutes.** If three others could have spoken, your brother's silence was not a *necessary* condition for the injury. The injury would likely have happened even if *he* specifically had spoken, because the culture of silence was collective.
  *   **Impact on Blame (Level 4):** **Complicates.** It suggests a systemic culture of fear or apathy rather than individual malice. However, in ethics, "everyone jumped" is not a valid defense for jumping. It spreads the blame but does not necessarily erase his share.
  *   **Verdict:** Makes the slogan's focus on *him* specifically feel unfair.

  #### 2. A safety inspection was booked for that month regardless.
  *   **Impact on Causation (Level 3):** **Weakens.** This attacks the counterfactual. If the inspection was due in 2 days, and the accident happened on day 9, his silence mattered. If the inspection was due on day 2, and the accident happened on day 9, his silence mattered. But if the inspection would have caught it *before* the accident regardless of his report, his causal link is severed.
  *   **Impact on Blame (Level 4):** **Mitigates.** It shows reliance on established safety protocols. He assumed the system would work.
  *   **Verdict:** If the inspection was imminent, the slogan loses its causal grip.

  #### 3. Supervisor told the shift not to stop the line for anything short of an emergency.
  *   **Impact on Agency (Level 2):** **Critical.** This is the most damaging fact to the slogan. A "choice" requires options. If reporting the strap meant stopping the line, and he was forbidden to stop the line, did he have a *valid* choice?
  *   **Impact on Duty (Level 4):** **Shifts.** His duty to obey his supervisor conflicted with his duty to safety. If a frayed strap is not an "emergency" by definition, he was following orders.
  *   **Verdict:** This potentially destroys the "Choice" premise entirely. If he was coerced by threat of employment, "Not choosing" was not a choice; it was compliance.

  #### 4. The injured man had already decided to use that forklift.
  *   **Impact on Causation (Level 3):** **Intervening Cause.** The victim's agency is also a cause. If the victim assumed the risk or bypassed protocols, the chain of causation from the brother's silence is weakened.
  *   **Verdict:** Shares the causal burden.

  **Summary of Details:**
  The slogan "Not choosing is still a choice" assumes a vacuum of pure agency. These details fill that vacuum with **constraints**.
  *   The **Supervisor detail** attacks the *Choice* (Level 2).
  *   The **Inspection detail** attacks the *Causation* (Level 3).
  *   The **Three Others detail** attacks the *Uniqueness of Blame* (Level 5).

  The slogan gives you no way to weigh these because it is an absolute statement. Reality is comparative.

  ---

  ### Part 5: What Was Meant vs. What Was Needed

  **What your family usually means:**
  When people repeat this line, they almost always mean **Level 4 (The Duty Claim)** wrapped in the language of **Level 1 (The Logical Claim)**.
  They mean: *"You had a moral obligation to act, and by failing to meet that obligation, you are accountable for the result."*
  They use the word "Choice" because it sounds active. It makes the listener feel like an agent rather than a bystander. It is a shaming tactic designed to provoke guilt, not a philosophical argument designed to establish truth.

  **Was this reading doing the work in the argument?**
  Yes. They used the logical truth (inaction is a choice) to smuggle in the moral truth (you are to blame). They skipped the middle steps: Did he have the power? Did he have the duty? Was his silence the decisive factor?

  **What the argument would have needed instead:**
  To honestly settle whether your brother caused the injury or bears blame, the conversation needed to abandon the slogan and ask three specific questions:

  1.  **The Capacity Question:** Given the supervisor's orders, was reporting the strap a viable option without risking his livelihood? (If no, he had no choice).
  2.  **The Efficacy Question:** If he had reported it, would the system have fixed it before day nine, or would the report have been ignored like the other three? (If ignored, his silence wasn't the cause).
  3.  **The Duty Question:** In that specific warehouse culture, was the primary duty of a worker safety or throughput? (Tragically, if the culture punishes safety stops, the moral blame shifts to the architects of that culture, not the worker).

  **Conclusion:**
  Your worry is correct. The slogan is "several different claims wearing one coat."
  *   As a **logical statement**, it is true but useless.
  *   As a **causal statement**, it is plausible but ignores systemic factors.
  *   As a **moral statement**, it is too blunt to account for coercion, shared responsibility, or reliance on safety systems.

  Your brother said, "I hadn't done anything." In a physical sense, he told the truth. In a moral sense, he was incomplete. Your family said, "Not choosing is still a choice." In a moral sense, they pointed to a truth. In a causal and logical sense, they told a lie.

  The truth lies in the middle: He didn't *do* the injury, but he may have *allowed* it. Whether allowing it makes him to blame depends entirely on whether he was truly free to stop it. The slogan assumes he was. The details you provided suggest he might not have been.
