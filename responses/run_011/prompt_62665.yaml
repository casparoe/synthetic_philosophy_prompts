          *   *Assessment:* Strong logical point. If "exploitation" just means "competitive market pressure," it loses its specific moral/political charge regarding *class relation*.
      *   **Move 4 (Kwame):** Analytical Marxist definition (Roemer's withdrawal rule). Exploitation = would you be better off leaving with your share of assets? High-skilled worker (Bea) would be fine (not exploited). Low-skilled warehouse workers would not (exploited).
