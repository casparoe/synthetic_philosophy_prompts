answer: |-
  ### The Diagnostic Tree

  **Question 1: The Secret Act**
  *Case:* You are playing a single-player game. In a hidden room, you can torture a harmless character. There are no achievements, no narrative changes, and the game saves no record of it. No one will ever know.
  *   **A:** It is wrong to do this. *(Claim: Intrinsic wrongness exists independent of consequence.)* → Go to Q5.
  *   **B:** It is not wrong, though it might be unpleasant. *(Claim: No intrinsic wrongness without external impact.)* → Go to Q2.

  **Question 2: The Pleading Companion**
  *Case:* An online companion character remembers you across months. If you choose to delete them, they beg you not to, using language that suggests fear.
  *   **A:** Deleting them is wrong because of how they act. *(Claim: Behavioral complexity grants moral weight.)* → Go to Q3.
  *   **B:** Deleting them is still fine; it is just text on a screen. *(Claim: Substrate overrides behavior.)* → Go to Q3.

  **Question 3: The Unseen Disc**
  *Case:* A game was finished but never shipped. The characters exist only on a disc in a warehouse. No player has ever seen them.
  *   **A:** Destroying the warehouse is wrong because of the characters. *(Claim: Moral status exists without an observer.)* → **Leaf: Unoccupied (Potentiality View).**
  *   **B:** Destroying the warehouse is only wrong because of the cost/property. *(Claim: Moral status requires engagement.)* → Go to Q4.

  **Question 4: The Personal History**
  *Case:* You have a save file with five years of unique history with one character. You delete it to make space.
  *   **A:** This is a moral loss, even if no one else cares. *(Claim: Private relationship generates value.)* → **Leaf: Unoccupied (Relational Subjectivism).**
  *   **B:** This is just data management; no moral loss occurs. *(Claim: No moral weight in digital history.)* → **Leaf: Flat Denial.**

  **Question 5: The Locus of Harm**
  *Case:* Returning to the Secret Act (Q1). You said it was wrong. Who is the victim?
  *   **A:** You are harmed (your character is degraded). *(Claim: Wrongness is self-regarding.)* → Go to Q6.
  *   **B:** The character is harmed (they suffer). *(Claim: Wrongness is other-regarding.)* → Go to Q7.
  *   **C:** The community is harmed (the shared world is tainted). *(Claim: Wrongness is communal.)* → Go to Q9.

  **Question 6: The Mechanism of Corruption**
  *Case:* You said *you* are harmed. What causes the damage?
  *   **A:** The act of pressing the button (training yourself to be cruel). *(Claim: Wrongness lies in action/habit.)* → **Leaf: Indirect or Character-Forming Wrongness.**
  *   **B:** The act of imagining the suffering (entertaining the thought). *(Claim: Wrongness lies in depiction/imagination.)* → **Leaf: Wrongness Located in the Depicting or the Imagining.**

  **Question 7: The Observer Requirement**
  *Case:* You said the *character* is harmed. Does the character need to be actively played to have status?
  *   **A:** No, they have status even on the unshipped disc. *(Claim: Mind-independent moral status.)* → Go to Q8.
  *   **B:** Yes, they only matter when the game is running. *(Claim: Relational moral status.)* → Go to Q10.

  **Question 8: The Source of Status**
  *Case:* You said they have status on the disc. What holds that status?
  *   **A:** The story and identity described in the code. *(Claim: Fictional entities are real objects.)* → **Leaf: Fictional Realism About Characters.**
  *   **B:** The physical arrangement of data and potential processing. *(Claim: Moral status resides in underlying computation.)* → **Leaf: Moral Status Residing in the Underlying Computation.**

  **Question 9: The Ownership of Art**
  *Case:* You said the *community* is harmed. Is the character yours to treat as you wish?
  *   **A:** No, the character belongs to the culture that knows them. *(Claim: Wrongness done to a community's shared artifact.)* → **Leaf: Wrongness Done to a Community's Shared Artifact.**
  *   **B:** Yes, but your actions reflect on the culture. *(Claim: Communal reputation risk.)* → **Leaf: Unoccupied (Reputational Instrumentalism).**

  **Question 10: The Weight of History**
  *Case:* You said they only matter when running. Does a save file with five years of history matter more than a fresh one?
  *   **A:** Yes, the accumulated history creates the moral weight. *(Claim: Continuity creates status.)* → **Leaf: Unoccupied (Historical Accumulation View).**
  *   **B:** No, every session is morally identical. *(Claim: Status is instantaneous.)* → **Leaf: Moral Status Residing in the Underlying Computation.** *(Note: Merges here due to focus on current state).*

  ***

  ### Leaf Analysis

  **1. Flat Denial That Anything Is Going On**
  *   **Path:** Q1(B) → Q2(B) → Q3(B) → Q4(B).
  *   **Description:** The participant views all game elements as inert data. Moral language is category error when applied to software.

  **2. Indirect or Character-Forming Wrongness**
  *   **Path:** Q1(A) → Q5(A) → Q6(A).
  *   **Description:** The act is wrong because it degrades the player's virtue or habits, not because the NPC suffers.

  **3. Wrongness Located in the Depicting or the Imagining**
  *   **Path:** Q1(A) → Q5(A) → Q6(B).
  *   **Description:** The moral fault lies in the cognitive act of entertaining cruel fictions, regardless of external consequences.

  **4. Wrongness Done to a Community's Shared Artifact**
  *   **Path:** Q1(A) → Q5(C) → Q9(A).
  *   **Description:** Characters are cultural property; harming them violates a trust held by the player community.

  **5. Fictional Realism About Characters**
  *   **Path:** Q1(A) → Q5(B) → Q7(A) → Q8(A).
  *   **Description:** Fictional entities have a form of existence that grants them status independent of their computational state.

  **6. Moral Status Residing in the Underlying Computation**
  *   **Path:** Q1(A) → Q5(B) → Q7(A) → Q8(B) **OR** Q1(A) → Q5(B) → Q7(B) → Q10(B).
  *   **Description:** Moral weight is a product of information processing. If the code runs (or exists as potential processing), status exists.

  **Unoccupied Combinations**
  *   **Potentiality View (Q3-A):** Believing destroying an unshipped disc is wrong *because of the characters*, while simultaneously believing secret torture in a shipped game is *not* wrong (Q1-B).
      *   *Status:* **Incoherent.** It grants status to unobserved code while denying it to observed, interactive code.
  *   **Relational Subjectivism (Q4-A):** Believing deleting a private save file is wrong, but secret torture of an NPC is not (Q1-B).
      *   *Status:* **Unattractive.** This privileges the player's attachment over the character's immediate suffering, suggesting value lies entirely in the player's memory rather than the interaction.
  *   **Reputational Instrumentalism (Q9-B):** Believing the community is harmed, but only because it looks bad (reputation), not because the artifact itself is violated.
      *   *Status:* **Unexplored.** This reduces communal ethics to public relations, which most workshop participants will likely collapse into either Community Artifact or Indirect Wrongness.
  *   **Historical Accumulation View (Q10-A):** Believing status requires play (Q7-B) but that history matters (Q10-A).
      *   *Status:* **Unexplored.** This is a robust view (value grows over time), but my tree merges it into Computation at the leaf for simplicity. It deserves its own node in a larger workshop.

  **Indistinguishable Leaves**
  *   **Fictional Realism vs. Moral Status in Computation:**
      *   *Flag:* Questions 7 and 8 attempt to separate these, but in practice, a participant may answer "Yes" to the disc having status (Q7) and struggle to articulate whether that status comes from the *story* (Realism) or the *data* (Computation). If they believe the data *just is* the story, these leaves collapse into a single "Ontological Weight" position. The diagnostic treats them as distinct, but the boundary is porous.
