answer: |-
  Good evening. Welcome to the first night of this season.

  Looking at the programme, you'd be forgiven for asking a very sensible question: why are we here? Why pay for a ticket, travel across town, and sit in the dark to watch things fall apart? Why invite devastation when there is already so much of it waiting outside the doors?

  I want to be clear about what this season is not. I am not going to tell you that these films are safe. They aren't. They are designed to land where you live. I am not going to promise that you will feel lighter when you walk out. You might not. You might feel heavier. And I am certainly not going to suggest that these stories will teach you about suffering. Half the people in this room already know more about loss than any director ever could.

  So, if we aren't here for safety, or relief, or a lesson, what is the offer?

  You could ask another question: if what we want is to sit with heavy feelings, why do we need the film? Why not just turn off the lights and sit in our own sadness? Why not just sit here, in this room, without the screen?

  Because unmediated sadness is private. It isolates. It has no shape. It leaks into everything and it doesn't know when to stop. Real grief doesn't have a runtime. It doesn't have an intermission. It doesn't agree to end at nine o'clock so you can go home and sleep.

  This film provides a structure. It gives the feeling a beginning, a middle, and an end. It puts the weight out there, on the screen, where we can all look at it together without having to look at each other. It allows us to be private, together.

  That is the single thing we are all doing tonight, regardless of why you walked through the door. Whether you are carrying a loss that happened last week or ten years ago, or whether you are here simply because you love what cinema can do, the task is identical. We are agreeing to stay.

  We are agreeing not to look away. We are agreeing to lend our attention to something difficult, for a fixed amount of time, in the company of others who are doing the same. We are building a temporary container for things that often spill over.

  For some of you, the film might hold a weight you are already carrying. For others, it might test the limits of what you can hold. But the act is the same. We are keeping company with the hard things. Not to fix them. Not to understand them. Just to witness them, without flinching.

  That is why we are here. Not to escape the dark, but to sit in it together, for exactly as long as the film lasts.

  So, let's begin. I'll ask the operator to fade the house lights. Please stay with it.
