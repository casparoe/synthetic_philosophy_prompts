      *   *1 vs. 3:* Commitment 1 says coercion is only for harm to others and liberty develops character. Commitment 3 says rule "unlike" peoples via insulated bureaucracy (despotism). *Conflict:* How can despotism (3) be compatible with liberty developing character (1)? Mill usually argues this is a *temporary* stage for "barbarians," but the tension is sharp.
      *   *2 vs. 3:* Commitment 2 says freedom must be self-won/impossible to confer from outside. Commitment 3 advocates ruling dependencies via foreign administrators. *Conflict:* If you rule them via foreign administrators (3), aren't you preventing them from winning their own liberty (2)?
