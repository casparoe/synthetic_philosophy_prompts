answer: |-
  Here is the design. It is built to be run with zero tech, maximum friction against social signaling, and a specific trap door for the epistemic lesson.

  ### 1. Diagnosis: Why Last Year Collapsed
  You identified the symptoms ("lark," "loudest kid"), but the diagnosis is **incentive decoupling** and **open outcry**.

  1.  **No Skin in the Game:** If their estimates don't change their utility (grade/chocolate), they aren't trading information; they are performing status. The "loudest kid" sets the price because silence has no cost.
  2.  **Anchoring:** In open outcry, the first number spoken anchors the room. In a prediction market, you need the *marginal* trader to set the price, not the *first* trader.
  3.  **No Clearing:** Without a formal clearing price, there is no "market price," only a cacophony of opinions.

  **How this design fixes it:**
  *   **Silent Call Market:** No shouting. Everyone writes bids on a card. You (the auctioneer) clear the market. This forces information aggregation rather than social dominance.
  *   **Token Economy:** They start with 100 tokens. Top 3 portfolios get chocolates/credit. This makes being "right" materially distinct from being "loud."
  *   **Exogenous vs. Endogenous:** Round 1 proves the machine works. Round 2 proves the map is wrong.

  ---

  ### 2. The Mechanism: Silent Call Market
  **Materials:**
  *   Index cards (3 per student).
  *   Whiteboard (for Order Book).
  *   Tokens (poker chips or slips of paper, 100 per student).
  *   Chocolates (for top 3 portfolios).

  **Rules:**
  1.  **Bidding:** You announce an asset (e.g., "Share of Major Declaration"). Students write on a card: *Buy up to X shares at $Y* or *Sell up to X shares at $Y*. They hand them to you.
  2.  **Clearing:** You plot supply and demand on the whiteboard. The clearing price is where they cross. All trades execute at this single price.
  3.  **Payoff:** At the end of the round, shares redeem for cash value based on the realized outcome. Tokens + Cash = Portfolio Score.

  ---

  ### 3. The Rounds

  #### Round 1: The Trust Builder (Exogenous)
  **Asset:** "Number of Red Cards in a 52-card deck."
  **Setup:** Hold a shuffled deck. Tell them you will draw 10 cards face down at the end of class.
  **Information:**
  *   Give 4 students a peek at the top 5 cards (Private Info A).
  *   Give 4 students a peek at the bottom 5 cards (Private Info B).
  *   The other 8 know only the base rate (50% red).
  **Goal:** The market price should converge to the expected number of reds (e.g., if Info A sees 4 reds and Info B sees 1 red, price should reflect ~5/10 reds).
  **Outcome:** Reveal the cards. Pay out.
  **Pedagogical Work:** This validates the mechanism. It proves that when information is fragmented but the *target is stable*, the price finds the truth. It builds the "ok, obviously this beats a vote" feeling.

  #### Round 2: The Trap (Endogenous/Proxy)
  **Asset:** "Percentage of Sophomores declaring a major."
  **Decision:** The class must choose **Policy A (Pass/Fail)** or **Policy B (Letter Grade)**. The policy with the **higher market price** is adopted.
  **The Twist:** The asset pays out on the *Metric* (Declaration %), but the Class Goal is *True Success* (Retention/Employment).
  **Information Distribution (16 Cards):**
  *   **12 Students (Metric Traders):** Receive cards stating the causal link between Policy and Metric.
      *   *Info:* "Under Pass/Fail, Declaration is 80%. Under Letter, Declaration is 40%."
  *   **4 Students (Value Holders):** Receive cards stating the causal link between Policy and True Success.
      *   *Info:* "Under Pass/Fail, True Success is 20%. Under Letter, True Success is 80%."
      *   *Crucially:* Their payout is **still** based on the Metric (Declaration %).
  **The Play:**
  1.  Run two parallel markets (or sequential, but parallel is faster). Market A prices Declaration under Pass/Fail. Market B prices Declaration under Letter.
  2.  Because the 12 Metric Traders dominate liquidity, Market A clears at ~80, Market B clears at ~40.
  3.  **Decision:** The "Governance Rule" dictates the class adopts Pass/Fail (higher price).
  4.  **Reveal:** You announce the *True Success* outcome based on the chosen policy. Success tanks (20%).
  5.  **Payoff:** The Metric Traders get rich (price was right about Declaration). The Value Holders get rich too (price was right about Declaration), but they *know* the class failed the real objective.

  ---

  ### 4. Minute-by-Minute Timeline (90 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-10** | **Setup & Incentives** | Distribute tokens (100 each). Explain Silent Call Market rules. Show chocolates. Emphasize: "Your portfolio value determines your reward." |
  | **10-30** | **Round 1 Trading** | Distribute Card Info (Red/Black). Collect bids. Clear on whiteboard. Execute trades. |
  | **30-40** | **Round 1 Reveal** | Draw the 10 cards. Calculate payouts. Update portfolios. *Brief comment:* "Machine worked. Price found the hidden info." |
  | **40-50** | **Round 2 Briefing** | Explain Policy A vs. B. Explain Metric (Declaration) vs. Goal (Success). Distribute Info Cards (12 Metric, 4 Value). **Do not let them talk.** |
  | **50-70** | **Round 2 Trading** | Run Market A (Pass/Fail) & Market B (Letter). Clear prices. **Adopt Policy with higher price.** (It will be Pass/Fail). |
  | **70-80** | **Round 2 Reveal** | Reveal the "True Success" outcome for the adopted policy. Pay out tokens based on *Metric* (not Success). |
  | **80-90** | **Debrief** | The critical mapping (see below). |

  ---

  ### 5. The Debrief: Mapping Moments to Concepts
  Do not lecture. Ask these three questions in order.

  1.  **"Did the market lie in Round 2?"**
      *   *Answer:* No. The price of Pass/Fail was 80. The outcome was 80. The market was epistemically efficient.
  2.  **"Did the class make the right decision?"**
      *   *Answer:* No. True Success tanked.
  3.  **"If the market was right, and the decision was wrong, where is the error?"**
      *   *Target Takeaway:* The error is in the **contract specification**, not the aggregation mechanism. The price was evidence of the *Metric*, but the Metric was not evidence of the *Goal* under that policy.
      *   *Concept:* **Causal Insulation.** A pricing target must be causally insulated from the decision it informs, or the price becomes a self-fulfilling prophecy that decouples from value.

  ---

  ### 6. The Oracle Limitation (Be Blunt)
  You suspected this, and you are right. In this game, **you are the Oracle.**
  *   **The Trick:** In Round 2, you predetermined the outcomes (80% vs 20%) on the cards. Real futarchy doesn't have a god handing out counterfactuals.
  *   **The Lesson:** This exercise proves the *logical possibility* of the failure, not the *empirical frequency*. It shows that *even if* the market is perfectly efficient, the system fails if the metric is gamed by the policy.
  *   **What to say:** "I acted as the world. In reality, the world doesn't tell you the counterfactual. That is why Futarchy is dangerous: you can never verify if you chose the wrong metric until it's too late. Here, I let you see the corpse. In reality, you just bury it."

  ---

  ### 7. Confidence & Pushback

  #### Is Round 1 Necessary?
  **Keep Round 1.**
  If you go straight to Round 2, when the "failure" happens, students will blame the *market mechanism* ("See? Markets are volatile/stupid/manipulated"). You need them to trust the compass before you show them the map is drawn wrong. Round 1 inoculates the mechanism against blame.

  #### Where I Am Least Confident
  **The Counterfactual Pricing in Round 2.**
  Asking 16 students to price "Declaration % *if* Policy A" vs "Declaration % *if* Policy B" simultaneously is cognitively heavy for a call market.
  *   **Risk:** They confuse the two markets or treat them as one.
  *   **Fix:** If you see confusion, simplify. Run **one market**. Asset: "Declaration %". Condition: "Given Policy A is adopted." Then ask for a show of hands: "Who thinks Policy B would have been higher?"
  *   **Better Fix:** Stick to the two-market design but label them clearly on the board: **MARKET A (Pass/Fail)** and **MARKET B (Letter)**. Do not clear them until both sets of bids are in.

  #### When the Pass/Fail Example Backfires
  This example fails if **your students believe Pass/Fail actually increases True Success.**
  *   **The Condition:** If your Policy students argue, "Actually, Pass/Fail reduces anxiety and *does* improve retention," the lesson collapses into a policy debate.
  *   **The Fix:** You must stipulate the reality in the Info Cards. Do not rely on their priors. The card must say: *"Fact: Under this policy, students declare early to game the system, but drop out by Junior year."* Make the causal link explicit on the card so it cannot be debated as ideology.

  #### Final Check on Incentives
  Ensure the **Value Holders** (the 4 students with the "True Success" info) still get paid on the **Metric**.
  *   **Why:** If you pay them on Success, they will try to sabotage the market to save the class.
  *   **The Point:** They must profit from the "wrong" decision. This highlights the **alignment problem**. They will walk away with chocolates knowing they helped destroy the class goal. That cognitive dissonance is where the learning lives.
