  **Principle 1: The Phenomenal Foothold Rule**
  *   **Statement:** $KKp$ is true if and only if the subject's first-order belief that $p$ is supported by a phenomenological state that is *discriminably distinct* from the state they would be in if $p$ were false (or if they merely believed $p$ without knowing).
  *   **Prediction:**
      *   **Case 1 (Gradual):** Fails. In a continuum, no state is discriminably distinct from its neighbors ("never get a foothold"). Verdict: $\neg KK$. (Matches)
      *   **Case 2 (Sudden):** Passes up to a point. The shock provides a distinct state, but introspective vividness fades with iteration. Verdict: $KKK$, $\neg KKKK$. (Matches "currency" remark).
      *   **Case 3 (Math):** Passes infinitely. Deductive insight is self-intimating. Verdict: $K^\infty$. (Matches)
      *   **Case 4 (Rad Normal):** Passes. Expertise provides a "gestalt" phenomenology distinct from guesswork. Verdict: $KKK$. (Matches)
      *   **Case 5 (Rad Defeater):** Fails. The technician's report makes the subject's internal state compatible with error *from her perspective*. Verdict: $\neg KK$. (Matches)
      *   **Case 6 (Hunch):** Fails. No distinct phenomenology. Verdict: $\neg K$. (Matches)

  **Principle 2: The Source-Sensitive Iteration Limit**
  *   **Statement:** The maximum depth of known iteration ($n$ in $K^n$) is determined by the epistemic source. Apriori sources allow $n = \infty$. Empirical sources allow $n \leq 3$. However, any empirical source involving a sorites structure or indiscriminability allows $n = 1$ (i.e., $\neg KK$). False defeaters reduce empirical limits to $n = 1$.
  *   **Prediction:**
      *   **Case 1:** Empirical + Sorites. Limit $n=1$. Verdict: $\neg KK$. (Matches)
      *   **Case 2:** Empirical + Discrete. Limit $n=3$. Verdict: $KKK, \neg KKKK$. (Matches)
      *   **Case 3:** Apriori. Limit $n=\infty$. Verdict: $K^\infty$. (Matches)
      *   **Case 4:** Empirical + Discrete. Limit $n=3$. Verdict: $KKK$. (Matches)
      *   **Case 5:** Empirical + Defeater. Limit $n=1$. Verdict: $\neg KK$. (Matches)
