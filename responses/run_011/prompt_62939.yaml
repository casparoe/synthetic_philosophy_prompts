prompt: |-
  I am preparing a lecture section on superrationality and have run into an obstruction I cannot resolve. Consider Hofstadter's Platonia dilemma: a benefactor offers a very large prize to whichever member of a specified group of twenty people — forbidden from communicating with one another — sends him a message before a fixed deadline, with the stipulation that the prize is paid only if exactly one of the twenty sends; if none sends, or if more than one does, nobody is paid. Consider alongside it the Luring Lottery he publicized: readers of a magazine could enter by postcard, a single winning entry was to be drawn at random, and the prize consisted of a fixed pot divided by the total number of entries received.

  The Prisoner's Dilemma template is familiar: because like-minded agents in like situations are supposed to reach like conclusions, each may reason as though her choice settles the others', and cooperation comes out ahead. I want to explain precisely where that template fails in the two cases above, and I have not been able to get the explanation into a form I am willing to say out loud.

  Please address the following.

  (i) In Platonia, sending weakly dominates not sending for each individual: someone who does not send cannot be the unique sender, whereas someone who sends wins whenever the other nineteen do not. Yet the superrational recommendation in this case is that each send with probability one in twenty. Where does that figure come from, and what exactly is it a recommendation of, given that the superrational principle is ordinarily stated as a claim that like reasoners choose alike rather than that they assign alike probabilities?

  (ii) If the twenty are alike in their reasoning, what licenses the assumption that their twenty chance outcomes are uncorrelated? Trace what becomes of the argument if that assumption is withdrawn.

  (iii) Does the analysis carry over to the Luring Lottery, where the relevant group is not a specified twenty but an unknown fraction of a readership, each member of which is estimating that fraction while simultaneously being estimated by the others?

  (iv) What structural feature of these games makes symmetry — the feature superrationality ordinarily exploits — an obstacle rather than a resource?

  I am interested in the reasoning rather than the literature, so there is no need to cite anything.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Topic:** Superrationality (Hofstadter's concept).
      *   **Specific Problems:** Platonia Dilemma and Luring Lottery.
      *   **Core Conflict:** The standard Prisoner's Dilemma (PD) superrational argument (cooperate because like-minded agents choose alike) seems to clash with the probabilistic nature of the solutions required for Platonia and the Luring Lottery.
      *   **Specific Questions:**
          *   (i) Origin of the $1/20$ probability in Platonia vs. the "choose alike" principle.
          *   (ii) Justification for uncorrelated chance outcomes among superrational agents (and what happens if correlated).
          *   (iii) Applicability to the Luring Lottery (unknown $N$).
          *   (iv) Structural feature making symmetry an obstacle.
      *   **Constraint:** Focus on reasoning, not literature/citations.

  2.  **Analyze Question (i): Platonia and the $1/20$ Probability.**

      *   *The Puzzle:* Superrationality usually implies deterministic identity of action ("If I cooperate, you cooperate"). But in Platonia, if everyone deterministically sends, everyone loses. If everyone deterministically doesn't send, everyone loses.
      *   *The Resolution:* Superrationality implies identity of *reasoning*, not necessarily identity of *deterministic output* if the reasoning involves randomization.
      *   *The Logic:* If I am superrational, I know the other 19 are using the *same algorithm* as me. If that algorithm is deterministic (Send/Don't Send), we all do the same thing.
          *   All Send $\rightarrow$ 0 payoff.
          *   All Don't Send $\rightarrow$ 0 payoff.
      *   *The Escape:* The algorithm must include a randomization step. Since we use the same algorithm, we must use the same *probability* $p$.
      *   *The Calculation:* Maximize Expected Utility (EU) given $p$.
          *   Prob(Exactly one sends) = $20 \times p \times (1-p)^{19}$.
          *   Maximize $f(p) = p(1-p)^{19}$.
          *   Derivative: $(1-p)^{19} - 19p(1-p)^{18} = 0 \Rightarrow 1-p = 19p \Rightarrow 20p = 1 \Rightarrow p = 1/20$.
      *   *Addressing the "Choose Alike" Worry:* Superrationality dictates that we choose the same *strategy*. A mixed strategy *is* a strategy. We all choose the strategy "Roll a 20-sided die, send if 1." We don't all get the same outcome (some roll 1, some don't), but we all adopt the same *rule* for generating the outcome.

  3.  **Analyze Question (ii): Correlation of Chance Outcomes.**

      *   *The Assumption:* Standard game theory assumes independent randomization devices. But if we are "alike," do we use the same random number generator (RNG)?
      *   *The Problem:* If we use the *exact* same mental coin flip (logical correlation), then if I roll "Send," you roll "Send." We are perfectly correlated.
      *   *Consequence:* If perfectly correlated, $p=1/20$ is useless. Either we all send (lose) or none send (lose).
      *   *The Fix:* Superrationality requires identity of *method*, not identity of *physical state* at the moment of execution. We must assume access to independent sources of entropy (local noise).
      *   *Why?* If we assume our random bits are logically linked (like the deterministic choice), the game becomes unsolvable (payoff 0). To be superrational is to recognize that maximizing utility requires *decorrelation*. Therefore, the superrational strategy *must* include the instruction: "Use a local, independent randomization source."
      *   *If Withdrawn:* If outcomes are perfectly correlated, the expected utility is 0 for any $p \in (0,1]$. The only way to win is if the correlation is imperfect. Superrationality dictates we *make* them independent because that's the only way to unlock the payoff. It's a meta-choice: "Choose a strategy that includes independent randomization."

  4.  **Analyze Question (iii): The Luring Lottery.**

      *   *The Setup:* Prize $P$. Total entries $N_{total}$. Payoff per winner = $P / N_{total}$. Cost of entry $c$ (usually negligible or implied).
      *   *The Twist:* $N_{total}$ is unknown and depends on how many people play.
      *   *Superrational Logic:* I am a representative agent. My probability of playing is $p$. The total population is $M$. Expected total entries $E = M \times p$.
      *   *Payoff:* If I play, my expected share is $P / (1 + \text{Others})$.
      *   *The Equilibrium:* In a symmetric mixed strategy equilibrium, the expected payoff of playing must equal the payoff of not playing (which is 0).
      *   *Calculation:* $P / (M \cdot p) = \text{Cost}$. If Cost $\approx 0$, then $p$ drives until payoff is negligible.
      *   *Difference from Platonia:* Platonia has a "sweet spot" (1 sender). Luring Lottery has a "tragedy of the commons" structure. The more you play, the lower the value for everyone (including you).
      *   *Superrational Conclusion:* If everyone reasons alike, they realize that entering reduces the prize value for everyone. If the cost is zero, they might still enter, but if there's *any* cost (postage, effort), the superrational calculation suggests entering only if $P / (\text{Expected Entries}) > \text{Cost}$.
      *   *The Paradox:* In the limit of zero cost, $p \to 1$. But if $p=1$, payoff $\to 0$. This is closer to a Cournot competition or Public Goods game. The superrational move is to recognize that mass entry dilutes the prize. Unlike Platonia, there isn't a clean $1/N$ solution that guarantees a win; it's about balancing marginal contribution to dilution vs. chance of winning.
      *   *Refinement:* Actually, Hofstadter's specific Luring Lottery had a fixed pot divided by entries. If everyone sends, prize = Pot/20,000 (or whatever). If cost is postage, there is a Nash Equilibrium. Superrationality pushes towards the cooperative optimum. In Platonia, cooperation = randomization. In Lottery, cooperation = *restraint* (don't enter if it dilutes too much). But since you can't coordinate *who* enters, you end up with a mixed strategy where Expected Utility = Cost.
      *   *Key Distinction:* Platonia rewards *uniqueness*. Lottery rewards *participation* but punishes *crowding*.

  5.  **Analyze Question (iv): Symmetry as Obstacle.**

      *   *Standard PD:* Symmetry helps. If I cooperate, you cooperate. We both get the good outcome. Symmetry aligns incentives.
      *   *Platonia/Lottery:* Symmetry aligns *actions*.
      *   *The Conflict:* In Platonia, identical deterministic actions lead to the worst outcome (0 or 0). We *need* asymmetry in outcomes (one sends, others don't) to win.
      *   *The Structural Feature:* These are **Coordination Games with a Constraint on Symmetry**. Specifically, they are "Anti-Coordination" or "Crowding" games.
      *   *PD:* Payoff matrix favors $(C, C)$ over $(D, D)$. Symmetry gets us to $(C, C)$.
      *   *Platonia:* Payoff matrix favors $(S, \neg S)$ over $(S, S)$ or $(\neg S, \neg S)$. Symmetry gets us to $(S, S)$ or $(\neg S, \neg S)$, both bad.
      *   *Resolution:* Symmetry must be applied at the level of the *probability distribution*, not the *realized action*. The structural feature is that the **payoff function is non-monotonic with respect to the number of identical actors**. In PD, more cooperators = better. In Platonia, exactly one cooperator = best, more = worse.

  6.  **Synthesize and Refine:**

      *   *Tone:* Academic, precise, philosophical but grounded in game theory logic.
      *   *Structure:* Address (i) through (iv) sequentially.
      *   *Key Insight for (i):* Distinguish between *strategy* (the algorithm) and *move* (the output). Superrationality equates strategies. Mixed strategies are valid strategies.
      *   *Key Insight for (ii):* Independence is a prerequisite for the mixed strategy to work. Superrationality dictates choosing a strategy that *includes* independent randomization. If correlation is assumed, the game is broken; thus, rationality demands assuming independence to make the game solvable.
      *   *Key Insight for (iii):* The Lottery is a congestion game. The superrational calculation leads to an entry probability where Expected Gain = Cost. It highlights the difference between "unique winner" (Platonia) and "shared prize" (Lottery).
      *   *Key Insight for (iv):* The payoff structure. PD is supermodular (complementary); Platonia is submodular/congested (competitive). Symmetry forces collision in congested games.

  7.  **Drafting the Response (Iterative refinement):**

      *   *(Self-Correction on ii):* Be careful not to say "superrationality assumes independence." Say "superrationality recognizes that to maximize utility, the strategy *must* prescribe independent randomization." It's a choice of algorithm.
      *   *(Self-Correction on iii):* Hofstadter's actual lottery results were messy. Stick to the theoretical structure. The key is that $N$ is endogenous.
      *   *(Self-Correction on iv):* Use the term "Anti-Coordination" or "Congestion."

  8.  **Final Polish:** Check against the prompt's constraints (no citations, focus on reasoning). Ensure the distinction between "choosing alike" (deterministic) and "choosing alike probabilities" (mixed) is clear.

      *   *Wait, one nuance on (i):* The prompt asks "what exactly is it a recommendation of". It is a recommendation of a *policy* or *disposition*.
      *   *Nuance on (ii):* If I reason exactly like you, and we both look at the same time on our watches to seed the RNG, we correlate. Superrationality requires recognizing that *physical* separation allows for *logical* independence of random bits even if the *algorithm* is identical.

      *(Final check of the "Obstruction" mentioned by user):* The user is stuck on how "like reasoners choose alike" maps to "like reasoners choose different actions." The answer is: They choose the same *function*, but the function takes a local, uncorrelated input (noise).

      Let's write it.
answer: |-
  Here is an analysis of the obstruction you have encountered, addressing your four points in order. The core of the difficulty lies in distinguishing between the identity of the *decision procedure* and the identity of the *physical action*.

  ### (i) The Origin of the Probability and the Nature of the Recommendation

  The obstruction arises from interpreting the superrational principle ("like reasoners choose alike") as a constraint on deterministic outputs rather than on algorithms. In the Prisoner's Dilemma, the optimal algorithm is deterministic (Cooperate), so the outputs match. In Platonia, a deterministic algorithm yields a payoff of zero for everyone (either everyone sends or no one sends). Therefore, the superrational algorithm *cannot* be deterministic.

  The recommendation is not that every agent performs the same physical action. The recommendation is that every agent adopts the same **mixed strategy**. A mixed strategy is a complete plan of action that specifies probabilities. If you and I are superrational, we will both select the strategy: "Generate a random number $x \in [0,1]$; if $x < p$, send the telegram."

  The figure $1/20$ comes from maximizing the expected utility of this shared strategy. Let $p$ be the probability that any given agent sends. Since all twenty agents are superrational, they all adopt the same $p$. The group wins only if exactly one person sends. The probability of this specific configuration occurring is given by the binomial probability:
  $$ P(\text{win}) = \binom{20}{1} p^1 (1-p)^{19} = 20p(1-p)^{19} $$
  To find the superrational $p$, you maximize this function with respect to $p$. Taking the derivative and setting it to zero yields $1 - p = 19p$, which solves to $p = 1/20$.

  Thus, the superrational principle is upheld: all agents chose the exact same strategy (the algorithm prescribing $p=1/20$). The divergence in physical actions (some send, some don't) is a feature of the strategy, not a failure of the reasoning. The recommendation is of a **disposition to randomize** with a specific parameter, not a recommendation of a specific move.

  ### (ii) The Correlation of Chance Outcomes

  This is the most delicate point. If "likeness" is total, one might argue that if I flip a mental coin and get "Heads," you, reasoning exactly like me with the same inputs, must also get "Heads." If our randomizations are logically correlated, then $p=1/20$ collapses: we would all send together (and lose) or all hold back together (and lose).

  What licenses the assumption of uncorrelated outcomes is the recognition that **randomization requires an entropy source external to the logic.** Superrationality dictates that agents choose the strategy that maximizes payoff. A strategy that relies on logically correlated random bits yields an expected payoff of zero. A strategy that utilizes local, physical noise (thermal noise, clock jitter, atmospheric static) yields a positive expected payoff.

  Therefore, the superrational instruction includes a clause: "Use a local source of entropy that is causally isolated from the other agents." The "likeness" of the agents applies to the *decision to use* independent entropy, not to the *value* of that entropy. We are alike in that we both agree to roll dice; we are not alike in the number the dice show, because the dice are physically distinct objects.

  If you withdraw the assumption of independence (i.e., if you assume the random bits are logically linked), the argument collapses into a paradox where no solution exists. The game becomes unsolvable because the symmetry of reasoning forces a symmetry of outcome that the payoff matrix punishes. Thus, superrationality *requires* the postulate of independent randomization as a condition for the game to be solvable. It is a meta-rational choice: "I must reason in a way that allows for physical divergence."

  ### (iii) The Luring Lottery

  The analysis carries over, but the structural incentives differ, leading to a different equilibrium calculation.

  In Platonia, the payoff is discontinuous: 1 sender gets everything, 2+ senders get nothing. In the Luring Lottery, the payoff is continuous but dilutive: the prize is $V / N$, where $N$ is the total number of entries.

  Here, the "group" is not a fixed twenty, but an unknown population $M$. Each reader must estimate $M$ and the probability $p$ that any given reader will enter. If you are superrational, you assume everyone uses the same entry probability $p$. The expected total number of entries is $E[N] = M \cdot p$.

  Your expected payoff for entering is the Prize Value divided by the Expected Total Entries (roughly):
  $$ \text{EU}(\text{enter}) \approx \frac{V}{M \cdot p} $$
  You should enter only if this expected payoff exceeds the cost of entry (postage, effort, $c$).
  $$ \frac{V}{M \cdot p} \geq c $$
  In a superrational equilibrium, agents adjust $p$ until the expected marginal gain equals the cost. If the cost is negligible ($c \to 0$), the logic drives $p \to 1$, everyone enters, and the individual share becomes negligible. However, if there is a non-zero cost, the superrational solution is a specific $p < 1$ that stabilizes the prize value relative to the cost.

  The crucial difference from Platonia is that the Lottery is a **congestion game**. In Platonia, you want to be the *unique* actor. In the Lottery, you want to be *one of few* actors. In both cases, superrationality prevents the "tragedy of the commons" where everyone enters deterministically. In Platonia, it prevents the collision of sending; in the Lottery, it prevents the dilution of the prize. The reasoning is identical (maximize EU given shared strategy), but the optimal $p$ is derived from a different payoff function.

  ### (iv) Symmetry as Obstacle vs. Resource

  The structural feature that makes symmetry an obstacle in these cases is the **non-monotonicity of the payoff with respect to the number of identical actors.**

  *   **In the Prisoner's Dilemma:** The payoff is monotonic with respect to cooperation. If we all do the same thing (Cooperate), we are all better off than if we all do the other thing (Defect). Symmetry is a resource because the "Cooperate/Cooperate" outcome is Pareto superior to "Defect/Defect." Symmetry allows us to lock into the better of the two symmetric equilibria.
  *   **In Platonia and the Lottery:** The payoff is **anti-coordinated**. The outcome "All Send" is worse than "One Sends." The outcome "All Enter" is worse than "Some Enter."

  In these games, perfect symmetry of *action* leads to the worst collective outcome (collision or dilution). Superrationality usually exploits symmetry to escape the Nash Equilibrium of the Prisoner's Dilemma (Defect). Here, superrationality must exploit symmetry to escape the Nash Equilibrium of pure strategies (All Send/All Enter).

  To do this, superrationality must shift the locus of symmetry from the **action** to the **probability distribution**.
  *   **PD:** Symmetry of Action $\rightarrow$ High Payoff.
  *   **Platonia:** Symmetry of Action $\rightarrow$ Zero Payoff. Symmetry of Probability $\rightarrow$ High Payoff.

  The obstruction you feel is the tension between "choosing alike" and "acting differently." The resolution is that in anti-coordination games, the only way to "choose alike" successfully is to choose a rule that generates "acting differently." Symmetry becomes an obstacle only if you insist it must manifest as identical physical moves. If you allow it to manifest as identical stochastic policies, symmetry remains the resource that solves the game, preventing the agents from clustering on a single deterministic choice that guarantees failure.
