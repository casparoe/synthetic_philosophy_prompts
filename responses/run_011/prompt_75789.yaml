      *   *Current US Law:* Drops Biological Coherence (ignores somatic integration) to keep Objectivity (in theory) and Certainty (in practice).
      *   *DCD (Donation after Circulatory Death):* Drops Objectivity (uses Permanence not Irreversibility) to keep Certainty and Coherence.

  11. **Refining the "Univocity" point:**
