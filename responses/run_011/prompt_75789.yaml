answer: |-
  ### Glossary of Technical Terms
  *   **Irreversibility:** A modal claim that function *cannot* be restored by any available or future technology.
  *   **Permanence:** A predictive claim that function *will not* be restored, typically because no attempt will be made.
  *   **Somatic Integration:** The physiological coordination of bodily systems (homeostasis, wound healing, gestation) independent of brain input.
  *   **Criterion:** The philosophical or biological standard defining the state (e.g., "loss of integrative unity").
  *   **Test:** The clinical maneuver used to infer the criterion (e.g., "apnea test").
  *   **Normative:** Relating to values, rules, or social agreement rather than empirical fact.

  ---

  ### 1. Refined Desiderata Specification
  Your list contains seven items. Three are conflated operational constraints. Two are philosophical commitments rather than functional requirements. One is a logical necessity. One is missing.

  | ID | Requirement | Specification | Status | Rationale |
  | :--- | :--- | :--- | :--- | :--- |
  | **R1** | **Legal Instantiability** | The definition must map to a single timestamp `t` acceptable for legal triggers (inheritance, homicide, procurement). | **Genuine Demand** | Legal systems require binary state changes. Biology provides processes. The definition must bridge this gap. |
  | **R2** | **Epistemic Decidability** | The status must be determinable at `t` using available clinical tests without prophecy or retrospective analysis. | **Genuine Demand** | A definition that cannot be applied in real-time is operationally useless. |
  | **R3** | **Ontological Independence** | The status must not depend on the availability of technology or the intentions of observers (e.g., whether resuscitation is *attempted*). | **Genuine Demand** | If death depends on intent, a patient is dead in one room and alive in another. This violates the law of non-contradiction for state assignment. |
  | **R4** | **Conceptual Unity** | Circulatory and Neurological criteria must refer to the same underlying loss of function (e.g., loss of organismal integration), not merely legally equivalent outcomes. | **Preference** | This is a metaphysical preference. The law can treat two distinct biological events as equivalent statuses without them being the same *kind* of event. |
  | **R5** | **Non-Circularity** | The definition cannot be derived from the permissibility of downstream actions (e.g., "dead" cannot mean "permissible to cut"). | **Genuine Demand** | Circular definitions invalidate the ethical license they are meant to grant. |
  | **R6** | **Biological Coherence** | The definition must account for observable somatic integration (healing, gestation) without resorting to semantic gymnastics. | **Genuine Demand** | If the definition claims the organism has ceased functioning as a whole, but the whole is demonstrably functioning, the definition is empirically falsified. |
  | **R7** | **Discriminatory Power** | The definition must distinguish death from severe disability (PVS, locked-in) and align with jurisdictional boundaries without contradiction. | **Genuine Demand** | A definition that classifies a conscious but paralyzed patient as dead is morally catastrophic. |
  | **R8** | **Process Tolerance** *(Missing)* | The specification must acknowledge the event is a process and define the threshold for state-change, rather than denying the process exists. | **Genuine Demand** | Denying the process creates the conflict between R1 (Instant) and Biology (Process). |

  **Corrections to Your List:**
  *   **(a) Univocity:** Reclassified as **R4 (Preference)**. You do not *need* them to be the same event; you need them to trigger the same legal state. Insisting on univocity forces a biological square peg into a legal round hole.
  *   **(b) Determinate Time:** Reclassified as **R1 (Legal Instantiability)**. This is not a biological demand but a legal one.
  *   **(c) & (d) Decidability/Insensitivity:** Split into **R2 (Epistemic)** and **R3 (Ontological)**. These are the primary source of conflict.
  *   **(f) Somatic Integration:** Reclassified as **R6 (Biological Coherence)**. This is the strongest empirical constraint.

  ---

  ### 2. The Normative vs. Biological Claim
  **Placement:** This is not a rival definition; it is a **category clarification**.

  Death is a **normative status assigned to a biological process**.
  *   **Biological Fact:** Cellular decay, cessation of circulation, loss of neuronal firing. These are gradients and processes.
  *   **Normative Construction:** The line drawn across that gradient where we agree to treat the entity as "dead."

  **Implication for your Data Layer:** You are not recording a raw biological fact (like temperature). You are recording a **legal status assignment**. The boolean `is_dead` is not a measurement; it is a verdict. The timestamp is not the moment biology stopped; it is the moment the verdict was rendered.

  ---

  ### 3. Impossibility Result: The Determination Trilemma
  You cannot satisfy the following three requirements simultaneously. You must relax at least one.

  **The Trilemma:**
  1.  **Ontological Objectivity:** Death is independent of human intention or technology (R3).
  2.  **Epistemic Certainty:** We can know the status instantly at the bedside (R2).
  3.  **Biological Coherence:** The definition matches the organism's actual functional state (R6).

  **Proof of Conflict:**
  *   **Hold (1) and (2):** To know death instantly and objectively, you must prove *Irreversibility*. But Irreversibility is a modal claim about all future possibilities. You cannot verify this at the bedside. You can only verify *Permanence* (we won't try). If you use Permanence, you violate (1) because death now depends on the intention not to treat.
  *   **Hold (1) and (3):** To be objective and biologically coherent, you must wait until somatic integration ceases naturally (e.g., decomposition). This violates (2) because you cannot declare death at a useful instant for transplantation or inheritance.
  *   **Hold (2) and (3):** To decide instantly based on biology, you must ignore somatic integration (e.g., declare brain death while the body heals). This violates (3) because the organism *is* integrating.

  **Current US Practice Resolution:**
  Current law (UDDA) attempts to hold all three but fails.
  *   **Neurological Criteria:** Sacrifices **Biological Coherence (3)**. It declares death despite somatic integration.
  *   **Circulatory Criteria (DCD):** Sacrifices **Ontological Objectivity (1)**. It relies on *Permanence* (we won't resuscitate) but labels it *Irreversibility*.

  ---

  ### 4. Most Constraining Requirement
  **R6 (Biological Coherence / Somatic Integration)** eliminates the most candidate accounts.

  *   **Why:** It directly falsifies the standard justification for "Brain Death." The standard justification is the "Integrative Unity" theory (the brain coordinates the body; no brain means no unity).
  *   **Evidence:** Pregnant patients gestating fetuses, children growing, wounds healing, and homeostasis maintained for weeks in brain-dead bodies demonstrate integrative unity *without* a brain.
  *   **Consequence:** To keep R6, you must either:
      1.  Redefine death as the loss of *consciousness* (Higher Brain), which conflicts with statute and R7 (PVS distinction).
      2.  Admit Brain Death is a legal fiction for organ procurement, violating R5 (Non-Circularity).
      3.  Wait for circulatory arrest, which reduces organ viability.

  ---

  ### 5. Diagnosis: Defective Concept or Defective List?
  **Your list is sound; the expectation of a clean boolean is the defect.**

  The concept of death is not defective, but the **data model** `boolean + timestamp` forces a discrete state onto a continuous process. This is a **category error** in the schema design, not the philosophy.

  *   **Recommendation:** If your schema allows, store `death_determination_type` (Neurological vs. Circulatory) and `determination_basis` (Irreversibility vs. Permanence).
  *   **If Boolean is Mandatory:** You are encoding a **legal verdict**, not a biological state. Document this in the data dictionary. The boolean represents "Legal Status = Deceased," not "Biological Function = Zero."

  ---

  ### 6. Theory Performance Check
  *   **Whole-Brain Standard (Current Law):** Fails **R6**. Claims loss of integrative unity while somatic integration persists.
  *   **Higher-Brain Standard (Personhood):** Fails **R7**. Would classify PVS patients as dead, conflicting with current jurisdiction and family rights.
  *   **Biological Integration Standard (Conservative):** Fails **R1/R2**. Requires total somatic collapse, making organ procurement impossible and delaying legal timestamp.

  ### 7. Summary for Specification Document
  1.  **Desiderata:** Adopt R1, R2, R3, R5, R6, R7, R8. Mark R4 as optional/philosophical.
  2.  **Constraint:** Acknowledge the **Determination Trilemma**. You cannot have Objectivity, Certainty, and Coherence simultaneously.
  3.  **Data Model:** The boolean `is_dead` is a **legal status**, not a biological measurement. The timestamp is the **time of declaration**, not necessarily the time of biological cessation.
  4.  **Conflict:** Current protocols prioritize **Epistemic Decidability (R2)** and **Legal Instantiability (R1)** over **Biological Coherence (R6)** and **Ontological Independence (R3)**.
