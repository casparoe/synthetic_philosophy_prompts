  5.  **Identify Impossibility Results (The "Trilemma" or "Dilemma"):**
      *   *The Core Conflict:* Biological Reality (Process) vs. Legal Requirement (Instant) vs. Epistemic Access (Bedside Test).
      *   *Specific Conflict:* Irreversibility (Ontological) vs. Decidability (Epistemic). You cannot *know* irreversibility at the bedside; you can only infer it.
      *   *Specific Conflict:* Somatic Integration (Biological) vs. Whole-Brain Death (Legal). If the body integrates, is it dead?
      *   *The Big One:* **The Ontological-Epistemic Gap.** You cannot have a definition that is simultaneously: (1) Ontologically objective (independent of technology/intent), (2) Epistemically certain at an instant, and (3) Biologically coherent with somatic integration.
      *   *Refinement:* The "Trilemma of Death Determination":
          1.  **Ontological Independence:** Death is a fact about the organism, not our ability to treat it.
          2.  **Epistemic Decidability:** We must be able to know it *now* without prophecy.
          3.  **Biological Coherence:** The definition must match the organism's actual functional state (e.g., somatic integration).
          *   *Result:* You can't have all three. If you prioritize Independence (Irreversibility), you lose Decidability (you can't prove irreversibility). If you prioritize Decidability (Permanence), you lose Independence (death depends on whether we *try* to resuscitate). If you prioritize Biological Coherence (Somatic Integration), you lose the ability to declare Brain Death (because the body integrates).

