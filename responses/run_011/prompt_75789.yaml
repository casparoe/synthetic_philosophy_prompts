  3.  **Evaluate and Consolidate Desiderata:**
      *   *Consolidation:* (b) Determinate time and (c) Decidability are closely linked operationally. (d) Insensitivity to resources is a specific case of Ontological Objectivity. (e) Independence from downstream uses is about Non-Circularity. (a) Univocity is about Conceptual Unity. (f) Somatic Integration is about Biological Coherence. (g) Boundaries is about Discriminatory Power.
      *   *Correction:* "Univocity" is highly contested. Some argue they *are* different events legally conflated. "Determinate time" is physically impossible (death is a process), so it must be a *legal fiction* requirement, not a biological one. "Decidability" conflicts with "Irreversibility" (which is modal, not observational).
      *   *Additions:* Need to address the "Process vs. Event" tension explicitly. Need to address the "Biological vs. Legal" status.

  4.  **Address the "Normative vs. Biological" Claim:**
      *   This is crucial. Is death a fact we discover or a line we draw?
