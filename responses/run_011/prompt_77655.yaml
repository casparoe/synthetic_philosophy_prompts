answer: |-
  # JOINT STATEMENT ON VAGUENESS AND THE TILE PANEL

  **Parties:** The Epistemicist and The Supervaluationist
  **Subject:** The Logic of Vague Predicates, Modeled via the Ceramic Tile Panel

  ## 1. Agreed Claims

  We, the undersigned, agree to the following claims regarding the ceramic tile example and the logical structure of the Sorites argument. We affirm these claims without qualification, annotation, or reservation, acknowledging that we may derive different metaphysical explanations for them in Section 2.

  1.  **Sorites Failure:** In the Opaque Variant of the tile panel, the inductive premise of the Sorites argument ("If tile *n* is officially classified as first-quality, then tile *n+1* is officially classified as first-quality") is false.
  2.  **Boundary Existence (Institutional):** In the Opaque and Transparent Variants, the aggregation rule (simple majority of 99 inspectors with sharp personal cutoffs) fixes a specific tile *k* such that tile *k* is officially first-quality and tile *k+1* is not.
  3.  **Phenomenological Profile:** In the Opaque Variant, competent observers (including the inspectors themselves, regarding the *official* verdict) cannot easily identify tile *k*. There are clear cases at the extremes of the series and a zone of apparent indeterminacy near the median threshold where verdicts are sensitive to single votes.
  4.  **Penumbral Connections:** In all variants, the classification of adjacent tiles is highly correlated. It is not the case that tile *n* is first-quality and tile *n+10* is not while tiles *n+1* through *n+9* are unclassified; the official verdict is defined for every tile.
  5.  **Variant Effects:**
      *   In the **Transparent Variant**, the location of the boundary *k* becomes knowable in principle by calculating the median of the published thresholds.
      *   In the **Waver Variant**, the official verdict for tiles near the median becomes unstable over time, drifting as inspectors reverse their individual verdicts on repeated presentations.
  6.  **Explanatory Debt:** Any theory of vagueness must explain: (a) why the Sorites premise is compelling despite being false in this setup; (b) why the boundary is hard to locate in the Opaque Variant; and (c) why the Waver Variant produces instability while the Opaque Variant produces stability.
  7.  **Example Status:** The tile panel exhibits the *structural profile* of a Sorites-susceptible predicate. We disagree on whether this profile constitutes genuine vagueness, genuine ignorance, or a hybrid, as detailed in Section 2.

  ## 2. Disagreements Table

  | Question at Issue | The Epistemicist's Formulation | The Supervaluationist's Formulation | Classification of Difference |
  | :--- | :--- | :--- | :--- |
  | **1. The Status of the Boundary Tile *k* in the Opaque Variant** | Tile *k* is definitively first-quality (or not). The fact is fixed by the inspectors' hidden thresholds. Our inability to name *k* is a limitation of knowledge, not a lack of fact. | Tile *k* is a borderline case of the *concept* "first-quality" modeled by the panel. While the *rule* forces a verdict, the *spread* of thresholds represents semantic indecision, making the truth-value of "Tile *k* is first-quality" indeterminate relative to the concept. | Substantive (Metaphysics of Truth) |
  | **2. The Source of Ignorance in the Opaque Variant** | We are ignorant because the boundary is fixed by facts (thresholds) to which we lack access. Vagueness *is* this type of ignorance. | We are ignorant because there is no single fact to know. The "boundary" is an artifact of the aggregation rule, not the semantic content. Vagueness is the underdetermination of truth conditions by usage. | Substantive (Nature of Vagueness) |
  | **3. Interpretation of the Waver Variant** | The instability is performance error. The inspectors' *competence* remains sharp (a disposition to classify), but their *performance* fluctuates. The true boundary is the mean disposition. | The instability is constitutive of borderline status. When dispositions waver, there is no fact of the matter, not even a hidden one. This variant better models natural language vagueness than the Opaque Variant. | Substantive (Competence vs. Performance) |
  | **4. Classification of the Example** | This *is* a case of vagueness. It shows that vague predicates can have sharp boundaries fixed by use (the aggregation rule) that are simply unknown to speakers. | This is primarily a case of ignorance (Opaque) or instability (Waver). Genuine vagueness requires truth-value gaps, which the majority rule eliminates. The example models the *structure* of vagueness but not its *semantics*. | Disagreement about Explanandum |

  ## 3. Cruxes

  We identify the following sub-questions as critical. A settled answer to any of these would require at least one of us to revise our position. We record our conflicting predictions below.

  **Crux 1: The Mechanism of Boundary Fixation**
  *   **Question:** Is there a determinate mechanism by which ordinary usage fixes one sharp cutoff rather than another for a natural language predicate, analogous to the median threshold in the Opaque Variant?
  *   **Test:** A linguistic analysis attempting to derive a unique cutoff for "first-quality" from a complete corpus of usage data without stipulating a rule.
  *   **Epistemicist Prediction:** Such a mechanism exists (e.g., neural or social coordination patterns). Usage *does* fix a cutoff, even if complex.
  *   **Supervaluationist Prediction:** No such mechanism exists. Usage constrains the range of admissible precisifications (the spread of thresholds) but never selects a unique point. Deriving a unique cutoff requires a stipulation (like the majority rule), not mere usage.

  **Crux 2: The Waver Variant and Ignorance**
  *   **Question:** Does the instability in the Waver Variant eliminate the "ignorance" present in the Opaque Variant?
  *   **Test:** A longitudinal study of the panel where thresholds are monitored. If inspectors' thresholds drift randomly near the median, does the "unknown boundary" persist?
  *   **Epistemicist Prediction:** The boundary persists as a statistical fact (the moving median). Ignorance remains because the current median is unknown at any instant *t*.
  *   **Supervaluationist Prediction:** The boundary vanishes. If the median drifts without a deterministic cause, there is no fact to be ignorant *of*. This proves vagueness cannot be identified solely with ignorance of a sharp boundary.

  **Crux 3: Discoverability and Bivalence**
  *   **Question:** Is there any question concerning a borderline tile whose answer could be discovered empirically, which would distinguish the two views?
  *   **Test:** An experiment measuring reaction times and neural correlates of inspectors classifying tiles at the median.
  *   **Epistemicist Prediction:** We will find a discrete neural switch (a "threshold state") that correlates perfectly with the verdict, even if the inspector cannot report it. This supports the sharp boundary claim.
  *   **Supervaluationist Prediction:** We will find a gradient of activation with no discrete switch. The verdict will correlate with a probabilistic firing rate. This supports the claim that there is no sharp boundary in competence.

  ## 4. Verbal vs. Substantive Dispute

  We jointly judge the following aspects of our dispute to be **verbal**:

  *   **The Definition of "Vagueness":** We agree that if "vagueness" is defined as "semantic indecision leading to truth-value gaps," the Epistemicist is using the word incorrectly. If "vagueness" is defined as "the phenomenon generating Sorites paradoxes and borderline appearances," the Supervaluationist is using the word too narrowly. We acknowledge we are often talking past each other when defining the term itself.
  *   **The Utility of "True but Unknowable" vs. "Neither True nor False":** In the context of the Opaque Variant, both formulations predict the same practical outcome: a speaker cannot correctly assert the verdict with justification. We acknowledge that in many pragmatic contexts, these phrases do the same work.

  We jointly judge the following aspects to be **substantive**:

  *   **The Logic of Negation:** We disagree on whether "Tile *k* is not first-quality" is true when "Tile *k* is first-quality" is not true. The Epistemicist holds it is true (bivalence); the Supervaluationist holds it is also indeterminate (truth-value gap). This affects logical validity in penumbral contexts.
  *   **The Nature of Competence:** We disagree on whether a competent speaker *must* have a sharp cutoff in their cognitive architecture. This is not merely a definition; it is a claim about human psychology and semantics that admits of empirical investigation (see Crux 3).

  ## 5. Falsification Conditions

  **For the Epistemicist:**
  *   **Evidence Against:** A proof that ordinary usage *cannot* fix a sharp boundary even in principle (e.g., demonstrating that any proposed mechanism for fixing the boundary itself relies on vague terms). Or, empirical evidence (Crux 3) showing continuous neural processing with no discrete decision point even at the level of individual competence.
  *   **Honest Statement:** I would abandon the view if it were shown that the "margin-for-error" principle entails contradictions when iterated, or if the psychological reality of sharp cutoffs is definitively disproven.

  **For the Supervaluationist:**
  *   **Evidence Against:** A demonstration that penumbral connections (e.g., "If *n* is first-quality, *n-1* is not definitely not first-quality") fail to hold under the supervaluationist semantics, or that the logic required to preserve them renders standard reasoning invalid. Or, evidence that speakers consistently treat borderline cases as bivalent in high-stakes decisions.
  *   **Honest Statement:** I would abandon the view if it were shown that "admissible precisifications" cannot be non-circularly defined, or if the cost to classical logic proves too high for practical application.

  **Can the Disagreement End?**
  We agree that there is no foreseeable experiment regarding a *single* borderline tile that would end the disagreement, as both theories predict the same behavioral output (hesitation, inability to justify). The dispute can only be resolved by broader theoretical virtues (simplicity, logical conservation) or by the psychological findings outlined in Crux 3.

  ## 6. Institutional Implications

  For an institution deciding whether to write a numeric threshold into a rule (e.g., "Tile measurement must be ≥ 5.0mm"):

  *   **Jointly Implied:** Both views imply that writing a numeric threshold eliminates the *practical* problems of vagueness (litigation, inconsistency) by stipulating a sharp boundary, effectively forcing the "Transparent Variant" upon the users. Both agree this is desirable for administrative clarity.
  *   **Jointly Failed to Imply:** Neither view implies that the numeric threshold captures the "true" meaning of the natural language predicate "first-quality." The Epistemicist admits the rule may differ from the hidden natural boundary; the Supervaluationist admits the rule replaces semantic indecision with precision. Therefore, neither party can claim the rule is "more correct" than ordinary usage, only that it is more *decidable*. Institutions should not expect the numeric rule to resolve moral or aesthetic disputes that rely on the natural predicate's flexibility.
