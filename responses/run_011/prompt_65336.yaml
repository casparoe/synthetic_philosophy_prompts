  ### Facilitator Notes

  **1. The Consistency Trap (Cases 2 & 12)**
  *   **The Trap:** Case 2 and Case 12 involve the exact same drug and biological outcome (4 hours restorative sleep). Case 2 frames it as exceeding the norm; Case 12 frames it as restoring a loss.
  *   **The Inconsistency:** If a panelist selects **(A) Approve** for Case 2 (Healthy) but **(C) Deny** for Case 12 (Disorder), they are holding a logically unstable position (valuing enhancement over treatment).
  *   **What to Say:** "You've indicated that the system should support this drug for a healthy person but deny it to someone with a sleep disorder. Since the biological intervention is identical, this suggests your decision is driven by the *label* of the patient rather than the *effect* of the drug. We need to decide if we are reviewing biology or diagnoses."

  **2. Indistinguishable Leaves**
  *   **The Pair:** **Welfarist Account** and **Duty to Enhance**.
  *   **The Problem:** On a permission-based quiz, these two look identical (both approve almost everything).
  *   **The Fix:** This quiz measures *permission*, not *obligation*. To separate them, you would need to ask: "Should the system *require* this intervention?" (Duty says Yes; Welfarist says No). In the absence of that question, treat "Duty" panelists as "Welfarists who are more enthusiastic about funding."

  **3. The Unoccupied Cell**
  *   **The Position:** **"Normative Realist / Ontological Anti-Realist."**
  *   **Description:** This is the person who believes the distinction between treatment and enhancement matters morally, but denies there is any biological fact of the matter about "normal function."
  *   **Diagnosis:** This usually maps to the **Social-Constructivist** leaf, but without the social theory. If a panelist says, "There's no such thing as normal biology, but we still shouldn't enhance," they are in an unoccupied cell. They are relying on a moral intuition they cannot ground. Push them to articulate *why* the distinction matters if the biology doesn't support it.

  **4. Handling "Allow" (Option B)**
  *   Panelists who select **(B) Allow** frequently are often **Libertarians** or **Capability Theorists**. They believe the state/system shouldn't block access, but shouldn't pay for it either. This is a distinct position from the **Normal Function** view (which Denies) and the **Welfarist** view (which Approves/System Funds). Treat "Allow" as a vote for "Private Market Solution."
