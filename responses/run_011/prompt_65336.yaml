  # Scoring Key & Facilitator Guide

  **How to Score:**
  Do not show this section to panel members. Tally their responses to identify their dominant ethical framework. Most people will not fit perfectly into one column; look for the strongest cluster (5 or more matches).

  | Question | **Normal Function** (Daniels) | **Welfarist** (Savulescu) | **Positional / Social** (Sandel) | **Purpose / Intent** (Medical Model) | **Eliminativist** (Juengst) | **Giftedness** (Fukuyama) | **Capability** (Nussbaum) | **Duty to Enhance** (Harris) |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: |
  | **1. Music Stimulant** | C | A | C | C | A | C | B | A |
  | **2. Sleep (Healthy)** | C | A | C | C | A | C | B | A |
  | **3. Short Child** | C | A | C | C | A | C | B | A |
  | **4. Deaf Child** | A | A | B | A | A | C | A | A |
  | **5. Immunity Vaccine** | A | A | C | A | A | C | A | A |
  | **6. Mood Pill** | C | A | C | C | A | C | A | A |
  | **7. Reconstruction** | A | A | A | A | A | A | A | A |
  | **8. Augmentation** | C | A | C | C | A | C | B | A |
  | **9. Warehouse Exo** | A | A | B | A | A | C | A | A |
  | **10. Soldier Exo** | C | A | C | C | A | C | B | A |
  | **11. Cooperation Drug** | C | A | C | C | A | C | B | A |
  | **12. Sleep (Disorder)**| A | A | A | A | A | A | A | A |

  *(Note: "A" = Approve, "B" = Allow/Private, "C" = Deny)*

  ### The Ethical Leaves (Positions)

  **1. Normal Function View (Norman Daniels)**
  *   **Core Logic:** Medicine's goal is to restore species-typical functioning. Interventions are justified only when they repair a deviation from the biological norm.
  *   **Pattern:** Approves Cases 4, 5, 7, 9, 12. Denies Cases 1, 2, 3, 6, 8, 10, 11.
  *   **Awkward Commitment:** This view struggles with Case 4 (Deaf Child), as it must argue that deafness is always a functional loss even when the patient and community disagree.

  **2. Welfarist Account (Julian Savulescu)**
  *   **Core Logic:** The only moral metric is well-being. If an intervention improves life quality without harming others, it is permissible.
  *   **Pattern:** Approves almost everything (A) except perhaps Case 11 (if harm is suspected).
  *   **Awkward Commitment:** This view struggles with Case 11 (Cooperation Drug), as it must explain why improving moral traits is different from improving physical traits if both increase welfare.

  **3. Social-Constructivist / Positional View (Michael Sandel)**
  *   **Core Logic:** Enhancements corrupt social goods by turning them into commodities or creating arms races where only the wealthy can compete.
  *   **Pattern:** Denies Cases 1, 2, 3, 6, 8, 10, 11. Approves Cases 7, 12. Mixed on 4, 5, 9 (Allow/Deny).
  *   **Awkward Commitment:** This view struggles with Case 9 (Warehouse Exo), as it must distinguish why preventing worker fatigue is not just another positional advantage in the labor market.

  **4. Purpose / Intent View (Traditional Medical Model)**
  *   **Core Logic:** The distinction lies in the physician's intent (treating pathology vs. satisfying preference), regardless of the biological outcome.
  *   **Pattern:** Approves Cases 4, 5, 7, 9, 12. Denies Cases 1, 2, 3, 6, 8, 10, 11. (Looks similar to Normal Function but justifies it via "Medical Indication" rather than "Species Norm").
  *   **Awkward Commitment:** This view struggles with Case 5 (Immunity Vaccine), as it must explain why a side-effect that improves health is not "medical" if the intent was prevention.

  **5. Eliminativist / Deflationary View (Eric Juengst)**
  *   **Core Logic:** The line between treatment and enhancement is blurry and morally irrelevant; we should judge each case on specific risks and benefits, not categories.
  *   **Pattern:** Approves almost everything (A), potentially marking "Unsure" (D) frequently to indicate category rejection.
  *   **Awkward Commitment:** This view struggles to give the panel clear guidance, effectively dissolving the review board's mandate to distinguish between request types.

  **6. Giftedness / Species-Ethics View (Leon Kass / Francis Fukuyama)**
  *   **Core Logic:** Interventions that alter human nature or bypass the "givenness" of life undermine human dignity and humility.
  *   **Pattern:** Denies Cases 1, 2, 3, 6, 8, 10, 11. Approves Cases 7, 12. (May Deny Case 4).
  *   **Awkward Commitment:** This view struggles with Case 7 (Reconstruction), as it must explain why rebuilding a breast after cancer is acceptable but augmenting a breast for symmetry is an affront to nature.

  **7. Capability Approach (Amartya Sen / Martha Nussbaum)**
  *   **Core Logic:** Interventions are justified if they expand a person's real freedoms and opportunities to function in society.
  *   **Pattern:** Approves Cases 1, 4, 7, 9, 12. Mixed on 2, 3, 8, 10 (Allow). Denies 11.
  *   **Awkward Commitment:** This view struggles with Case 1 (Music Stimulant), as it must decide if access to a conservatory is a central "capability" or a luxury preference.

  **8. Duty to Enhance (John Harris)**
  *   **Core Logic:** We have a moral obligation to enhance ourselves and others whenever it reduces harm or increases good; permission is not enough, we should fund it.
  *   **Pattern:** Approves everything (A), specifically selecting "Approve" (System Support) over "Allow" (Private).
  *   **Awkward Commitment:** This view struggles with Case 11 (Cooperation Drug), as it risks mandating moral conformity under the guise of improvement.

