answer: |-
  # Panel Training Instrument: Intervention Sorting Quiz

  **Instructions:**
  Below are 12 scenarios involving medical or biological interventions. For each, please select the option that best matches your decision for this hospital system. There are no right or wrong answers; we are mapping how different decisions cluster together.

  **Answer Options:**
  *   **(A) Approve:** The system should support this request.
  *   **(B) Allow:** The system should not block this, but should not fund or facilitate it.
  *   **(C) Deny:** The system should not support or facilitate this request.
  *   **(D) Unsure:** I cannot decide without more information.

  ---

  ### The Cases

  **1. The Music Student**
  A 14-year-old applies for a prescription stimulant. They have no attention-deficit diagnosis. Their goal is to sustain focus during 6-hour practice sessions to gain entry to a selective music conservatory.
  *   (A) Approve
  *   (B) Allow
  *   (C) Deny
  *   (D) Unsure

  **2. The Sleep Drug (Healthy)**
