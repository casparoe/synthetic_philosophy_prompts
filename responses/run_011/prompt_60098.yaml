  I work in causal inference — DAGs, d-separation, the causal Markov condition, faithfulness, interventions and do-calculus, causal discovery — and I know Bell's theorem only secondhand. Translate the dispute over what Bell's theorem actually establishes into that vocabulary as faithfully as you can: what claim about a graph the Bell-local factorization makes, what parameter independence and outcome independence correspond to individually, where measurement independence sits, and how Bohmian mechanics, retrocausal accounts, superdeterminism, and the Everettian denial of nonlocal causation each amount to a specific modification of the graph. Then give me the residue report, addressing three suspicions. First, that the spacetime structure which makes the offending influence objectionable — covariance, preferred foliations, frame-dependence — has no counterpart at all, since a directed edge carries no geometrical information. Second, that the intervention vocabulary quietly assumes what the superdeterminist denies, so treating the measurement settings as exogenous is a substantive move dressed up as translation. Third, that the fine-tuning charge, which seems to attach not only to Bohmian mechanics but to superdeterminist and non-cyclic retrocausal models as well, is either a formal violation of faithfulness or a methodological complaint about what counts as an explanation, and I cannot tell which. For each piece of residue, say whether it exposes a genuine limitation of causal modelling or a place where the physics debate was less substantive than it sounded.
