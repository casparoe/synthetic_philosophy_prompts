answer: |-
  Here is the translation of Bell's theorem into the language of structural causal models (SCMs) and directed acyclic graphs (DAGs), followed by the residue report on the three suspicions you raised.

  ### Part I: The Causal Translation

  In causal inference terms, a Bell experiment is a causal discovery problem with latent confounding. We have four observed variables: settings $X, Y$ and outcomes $A, B$. We posit one latent variable $\lambda$ (the hidden state).

  **1. The Bell-Local Graph and Factorization**
  The assumption of "Bell Locality" (or Local Causality) corresponds to a specific DAG, $G_{\text{local}}$:
  *   **Edges:** $X \to A$, $Y \to B$, $\lambda \to A$, $\lambda \to B$.
  *   **Absences:** No edge $X \to B$, $Y \to A$, $X \to \lambda$, $Y \to \lambda$, $A \to B$, $B \to A$, nor any common causes between $\{X,Y\}$ and $\lambda$.
  *   **Causal Markov Condition (CMC):** The joint distribution factorizes as:
      $$P(A, B, X, Y, \lambda) = P(A \mid X, \lambda) P(B \mid Y, \lambda) P(\lambda) P(X) P(Y)$$
      Marginalizing out $\lambda$, the observable distribution $P(A, B \mid X, Y)$ must satisfy the Bell inequalities.

  **2. Parameter and Outcome Independence as d-Separation**
  The decomposition of Bell Locality into Parameter Independence (PI) and Outcome Independence (OI) maps directly to conditional independences implied by d-separation in $G_{\text{local}}$.

  *   **Parameter Independence (PI):** The outcome at one wing is independent of the setting at the other, conditional on the local setting and $\lambda$.
      *   *Causal Claim:* $A \perp\!\!\!\perp Y \mid \{X, \lambda\}$ and $B \perp\!\!\!\perp X \mid \{Y, \lambda\}$.
      *   *Graph:* In $G_{\text{local}}$, the path $Y \to B \leftarrow \lambda \to A$ is blocked by conditioning on the collider $\lambda$? No, $\lambda$ is a common cause. The path is $Y \to B \leftarrow \lambda \to A$. Conditioning on $\lambda$ blocks this path. Thus, PI is the statement that there are no direct edges $Y \to A$ or $X \to B$.
  *   **Outcome Independence (OI):** The outcomes are independent conditional on settings and $\lambda$.
      *   *Causal Claim:* $A \perp\!\!\!\perp B \mid \{X, Y, \lambda\}$.
      *   *Graph:* In $G_{\text{local}}$, the only path between $A$ and $B$ is $A \leftarrow \lambda \to B$. Conditioning on $\lambda$ d-separates $A$ and $B$. OI is the claim that there is no direct edge $A \leftrightarrow B$ and no unmeasured confounder besides $\lambda$.

  **3. Measurement Independence (MI)**
  *   **Causal Claim:** $\lambda \perp\!\!\!\perp \{X, Y\}$.
  *   **Graph:** $X$ and $Y$ are exogenous roots with respect to $\lambda$. There are no edges $X \to \lambda$, $Y \to \lambda$, nor any common ancestor $\omega$ such that $\omega \to X$ and $\omega \to \lambda$. In interventionist terms, $X$ and $Y$ are valid instruments for the causal effect of $\lambda$ on $A,B$; they are not themselves caused by the system state.

  **4. Interpretations as Graph Modifications**
  Bell's theorem proves that QM predictions violate the constraints imposed by $G_{\text{local}}$ + CMC + Faithfulness. To accommodate QM, one must modify the graph or the assumptions.

  *   **Bohmian Mechanics (Non-local Hidden Variables):**
      *   *Modification:* Adds a directed edge between outcomes, e.g., $A \to B$ (or $B \to A$), or allows $\lambda$ to depend dynamically on remote settings (effectively $Y \to \lambda \to B$).
      *   *Violation:* Violates **Parameter Independence**. In the graph, $A$ is no longer d-separated from $Y$ given $\{X, \lambda\}$ because the mechanism for $B$ (and potentially $A$ via feedback) depends on the remote configuration.
  *   **Retrocausal Accounts:**
      *   *Modification:* Adds edges from settings to the hidden variable: $X \to \lambda$ and/or $Y \to \lambda$.
      *   *Violation:* Violates **Measurement Independence**. The "past" cause $\lambda$ is a collider or child of the future settings. This preserves locality (no $A \to B$) but requires backward-in-time causation.
  *   **Superdeterminism:**
      *   *Modification:* Adds a common cause $\omega$ (the initial state of the universe) such that $\omega \to X$, $\omega \to Y$, and $\omega \to \lambda$.
      *   *Violation:* Violates **Measurement Independence**. $X$ and $Y$ are no longer exogenous interventions; they are correlated with $\lambda$ via $\omega$. The path $X \leftarrow \omega \to \lambda \to A$ is open, creating correlation without direct causation.
  *   **Everettian (Many Worlds):**
      *   *Modification:* Rejects the definition of the variables $A$ and $B$ as single-valued random variables.
      *   *Violation:* This is a rejection of the **sample space** rather than the graph edges. In causal terms, it maintains $G_{\text{local}}$ but denies that the observed frequencies correspond to $P(A,B|X,Y)$ of a single outcome. It asserts that the "correlation" is an artifact of conditioning on a branch index, effectively arguing that the CMC applies to the global wavefunction, not the branch-relative outcomes.

  ***

  ### Part II: The Residue Report

  Here is the analysis of the three suspicions regarding the limits of this translation.

  #### Residue 1: Spacetime Structure vs. Directed Edges
  **Suspicion:** A directed edge $A \to B$ in a DAG carries no metric information. It does not distinguish between a timelike influence (acceptable in relativity) and a spacelike influence (the "spooky" part of Bell). Therefore, the causal graph fails to capture why Bohmian mechanics is physically objectionable (it requires a preferred foliation).

  **Verdict: Genuine Limitation of Causal Modelling.**
  Standard DAGs encode topological ordering (causal precedence), not geometric separation. In causal inference, $A \to B$ simply means $A$ is a parent of $B$. It does not assert that $A$ and $B$ are spacelike separated.
  *   **The Gap:** Bell's theorem is not merely about probabilistic dependence; it is about *Lorentzian* causality. The "scandal" is that the graph required to fit QM data (e.g., $A \to B$) implies an influence that, in the physical setup, traverses a spacelike interval. A pure DAG cannot represent the conflict with Special Relativity because it lacks the metric tensor or lightcone structure.
  *   **Implication:** To faithfully model Bell's theorem, one requires a **Causal Graph + Spacetime Map**. The contradiction arises only when the topological order of the graph ($A$ before $B$) conflicts with the geometric order (no timelike path from $A$ to $B$). The causal vocabulary alone is too coarse to identify the "non-locality" scandal; it only identifies "dependence."

  #### Residue 2: Intervention Vocabulary vs. Superdeterminism
  **Suspicion:** The *do*-calculus defines $do(X)$ as severing incoming edges to $X$. By treating $X$ as an intervention target, the causal framework assumes Measurement Independence (MI) by fiat. Treating settings as exogenous is a substantive physical assumption (modularity) disguised as a translation convention.

  **Verdict: Substantive Physics Debate (Clarified by Causal Vocab).**
  This is not a limitation of the modeling, but a precise identification of the philosophical clash.
  *   **The Gap:** The interventionist definition of causation (Pearl/Woodward) presupposes **Modularity**: the mechanism determining $X$ is distinct from and independent of the mechanism determining $\lambda$. The *do*-operator is mathematically defined as a surgery on the graph.
  *   **Implication:** The superdeterminist denies that $do(X)$ is physically realizable. They argue that $X$ is always endogenous to the universal state $\omega$. The causal framework does not "fail" here; rather, it forces the superdeterminist to admit that their model renders experimental intervention impossible.
  *   **Conclusion:** The suspicion is correct that treating $X$ as exogenous is a substantive move. However, this is a feature, not a bug. It exposes that "Free Will" in Bell tests is simply the assumption that $X$ is a root node in the causal graph of the experiment. The debate is not about translation; it is about whether the universe admits modular subsystems.

  #### Residue 3: Fine-Tuning and Faithfulness
  **Suspicion:** The charge of "fine-tuning" against Bohm, Superdeterminism, and Retrocausality amounts to claiming they violate the **Faithfulness Condition** (Stability). Is this a formal logical violation, or just a methodological complaint about what counts as a good explanation?

  **Verdict: Methodological Complaint (Disguised as Formal Violation).**
  *   **The Gap:** Faithfulness states that all conditional independences in the distribution are entailed by d-separation in the graph (no "accidental" cancellations).
      *   **Bohm:** To prevent superluminal signaling despite the $A \to B$ link, the parameters must be tuned such that the marginal $P(B|Y)$ does not depend on $X$. This is a cancellation of paths.
      *   **Superdeterminism:** To recover QM statistics despite the correlation between $\lambda$ and $X$, the distribution $P(\lambda | X)$ must be tuned to exactly mimic the quantum Born rule.
      *   **Formal Status:** Yes, these models formally violate Faithfulness. The independences observed (e.g., no signaling) are not due to graph structure but due to specific parameter values.
      *   **Methodological Status:** Faithfulness is not a law of nature; it is a prior over parameters used for **Causal Discovery**. It asserts that causal mechanisms are "stable" under perturbation. A fine-tuned model is "unstable": a slight change in parameters reveals the hidden causal link (e.g., signaling becomes possible).
  *   **Conclusion:** The fine-tuning charge is a methodological complaint about **explanatory virtue**, not logical consistency. It argues that a theory requiring precise parameter cancellation to hide its causal structure is epistemically inferior to one where the structure explains the independence. Causal inference treats Faithfulness as a working assumption for learning; physics treats it as a heuristic for theory selection. The "residue" is the realization that Bell's theorem rules out Local Hidden Variables *assuming Faithfulness*. Without Faithfulness, any graph can fit any data.

  ### Summary of Residues

  | Residue | Diagnosis | Explanation |
  | :--- | :--- | :--- |
  | **1. Spacetime** | **Genuine Limitation** | DAGs lack metric geometry. They cannot distinguish spacelike from timelike edges without external annotation. |
  | **2. Interventions** | **Substantive Debate** | The *do*-operator assumes modularity. Superdeterminism denies it. The vocab clarifies the clash rather than obscuring it. |
  | **3. Fine-tuning** | **Methodological** | Violating Faithfulness is logically permissible but epistemically costly. The objection is about theory virtue, not formal validity. |
