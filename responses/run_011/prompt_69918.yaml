prompt: |-
  I'm helping to scope a chapter for an edited volume on the ethical upshot of panpsychism, and before anyone argues for a position I want the specification rather than the arguments: what would a theory of the moral significance of micro-experience have to deliver to count as adequate? Give me the requirements list — the questions it must answer, the cases it must handle, the distinctions it may not collapse, and the constraints from the metaphysics it cannot contradict — with the consideration behind each, and mark which are non-negotiable and which are preferences of particular camps (constitutive panpsychism versus cosmopsychism, for instance, or Russellian monism versus a more robust phenomenal realism). Please keep the cases concrete rather than schematic: whether a kilogram of ordinary rock, containing on the order of 10^25 atoms, thereby carries more moral weight than a brain with its tens of billions of neurons; whether boiling a pot of water is a greater harm than killing a mouse; whether a micro-phenomenal property can be valenced at all, given that our experience seems to draw on a far richer palette than anything a single electron could instantiate; and, given that the fundamental entities of field theory are not persistent, individually trackable little subjects, what the bearer of a micro-experience even is and whether it can be harmed. Close with two things: which single requirement knocks out the most candidates, and whether some subset is jointly unsatisfiable — my own suspicion is that requiring moral weight wherever there is experience, requiring that weight to be graded by how much experience there is, and requiring the theory to change what we ought to do cannot all be met at once, and if that is right the list is itself the result. Skip the survey of who has proposed what; I want the criteria.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Scoping a chapter on the ethical upshot of panpsychism.
      *   **Goal:** Specify the *requirements* for an adequate theory of the moral significance of micro-experience (not arguments for positions).
      *   **Format:** A requirements list (questions to answer, cases to handle, distinctions to maintain, metaphysical constraints).
      *   **Content:** Include considerations behind each requirement. Mark non-negotiable vs. camp-specific preferences (constitutive panpsychism, cosmopsychism, Russellian monism, etc.).
      *   **Concrete Cases:** Must include specific examples like rock vs. brain, boiling water vs. killing a mouse, valence of micro-experience, bearer of experience in field theory.
      *   **Closing:** Identify the single requirement that knocks out the most candidates and address potential joint unsatisfiability (specifically the user's suspicion about moral weight, grading, and action-guidance).
      *   **Constraint:** Skip the survey of existing proposals; focus on criteria.

  2.  **Deconstruct the Problem (Panpsychism + Ethics):**
      *   Panpsychism claims experience is fundamental/widespread.
      *   Ethics usually cares about experience (sentience, suffering, flourishing).
      *   *The Combination Problem (Ethical Version):* How do micro-experiences aggregate to moral weight?
      *   *The Insignificance Problem:* If everything has experience, does morality become trivial or overwhelming?
      *   *The Metaphysical Constraint:* The ethical theory must fit the specific metaphysics (e.g., field theory vs. particle ontology).

  3.  **Drafting the Requirements List:**

      *   *Requirement 1: The Bearer Specification.*
          *   Issue: What exactly has the experience? Electrons? Fields? Spacetime regions?
          *   Case: Field theory entities aren't persistent "little subjects."
          *   Constraint: Must align with physics (non-negotiable).

      *   *Requirement 2: The Valence/Quality Constraint.*
          *   Issue: Can a micro-entity suffer? Or is experience neutral?
          *   Case: Electron experience vs. Human pain.
          *   Distinction: Phenomenal quality vs. Moral value.
          *   Status: Non-negotiable for utilitarian-style views, maybe optional for non-hedonic views.

      *   *Requirement 3: The Aggregation/Combination Rule.*
          *   Issue: How do micro-experiences sum up?
          *   Case: Rock ($10^{25}$ atoms) vs. Brain ($10^{10}$ neurons).
          *   Distinction: Summation vs. Emergence vs. Cosmopsychist priority.
          *   Status: Non-negotiable (must have *some* rule), but the *type* of rule is camp-specific.

      *   *Requirement 4: The Threshold/Negligibility Clause.*
          *   Issue: Is micro-experience morally negligible?
          *   Case: Boiling water vs. Killing a mouse.
          *   Constraint: Must avoid absurd practical conclusions (moral paralysis).
          *   Status: Non-negotiable for action-guidance.

      *   *Requirement 5: The Metaphysical Consistency Check.*
          *   Issue: Cannot contradict the underlying ontology.
          *   Case: Constitutive vs. Cosmopsychism.
          *   Status: Non-negotiable.

      *   *Requirement 6: The Action-Guidance Constraint.*
          *   Issue: Must change or confirm what we ought to do.
          *   Constraint: If it changes nothing, why have the theory?
          *   Status: Non-negotiable for ethical theory.

  4.  **Refining and Categorizing (Non-negotiable vs. Camp Preferences):**

      *   *Non-negotiable:* Metaphysical consistency, Action-guidance (somehow), Aggregation rule (somehow), Valence specification (somehow).
      *   *Camp Preferences:* How aggregation works (summing vs. holistic), whether micro-experience has intrinsic value or only instrumental, specific ontology (particles vs. fields).

  5.  **Addressing the Concrete Cases:**
      *   *Rock vs. Brain:* Needs an aggregation rule that doesn't make rocks superior due to sheer numbers.
      *   *Boiling Water vs. Mouse:* Needs a threshold or complexity weighting to avoid veganism extending to plants/rocks/water.
      *   *Electron Valence:* Needs a theory of primitive affect.
      *   *Field Theory Bearer:* Needs an ontology of experience bearers compatible with QFT.

  6.  **Developing the Closing Analysis:**
      *   *The Knockout:* The Aggregation/Combination Problem (specifically avoiding the "Rock > Brain" conclusion while maintaining panpsychism).
      *   *The Trilemma (User's Suspicion):*
          1.  Moral weight wherever there is experience.
          2.  Weight graded by amount/complexity of experience.
          3.  Theory changes what we ought to do (doesn't lead to paralysis/absurdity).
          *   Analysis: If (1) is true (panpsychism), and (2) is linear/quantitative, then rocks/water have huge weight. If they have huge weight, (3) fails because we can't act without harming vast amounts of micro-experience. To save (3), you must deny (1) (thresholds) or modify (2) (complexity weighting over quantity).

  7.  **Review against Constraints:**
      *   Did I skip the survey? Yes.
      *   Are cases concrete? Yes (Rock, Water, Electron, Field).
      *   Is the distinction clear? Yes (Non-negotiable vs. Camp).
      *   Is the closing specific? Yes.

  8.  **Final Polish (Tone and Precision):**
      *   Ensure philosophical precision (e.g., distinguishing "phenomenal realism" from "Russellian monism").
      *   Make sure the "Non-negotiable" tags are defensible. (e.g., Is action guidance non-negotiable? For an *ethical* theory, yes. For a metaphysical one, no. The prompt asks for ethical upshot, so yes).
      *   Check the Field Theory point: This is crucial for modern panpsychism.

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe mark "Valence" as camp-specific.
      *   *Correction:* No, an ethical theory *must* specify if experience is good/bad/neutral. Even if it says "neutral," that's a specification. So the *requirement* to specify is non-negotiable, the *answer* is camp-specific.
      *   *Initial thought:* The Rock vs. Brain case is just about numbers.
      *   *Correction:* It's about *combination*. Do experiences sum? If they don't sum, does the rock have $10^{25}$ subjects or one fused subject? This links to the Combination Problem.
      *   *Refining the Trilemma:* The user's suspicion is strong. I need to validate it carefully. If micro-experience counts, and there is *so much* of it, standard utilitarianism breaks. The solution usually involves denying linear aggregation.

  10. **Final Output Generation** (Proceeding to generate response based on these structured thoughts).
answer: |-
  Here is the specification list for an adequate theory of the moral significance of micro-experience. The requirements are divided into **Non-Negotiable Constraints** (conditions any ethical theory grounded in panpsychism must meet to be coherent and functional) and **Camp-Specific Preferences** (conditions that depend on the underlying metaphysical variant, e.g., constitutive panpsychism vs. cosmopsychism).

  ### I. Non-Negotiable Constraints
  *These requirements must be met for the theory to count as a viable ethical framework compatible with the metaphysics.*

  **1. The Ontological Bearer Specification**
  *   **Requirement:** The theory must identify the specific ontological locus of the micro-experience without contradicting fundamental physics.
  *   **Consideration:** Ethics requires a subject of harm or benefit. If the metaphysics claims experience is fundamental, it must specify *what* bears it.
  *   **Concrete Case:** In Quantum Field Theory (QFT), fundamental entities are not persistent, individually trackable particles but excitations of fields. If an electron is not a persistent "little subject," what is the bearer of the micro-experience? Is it the field mode, the spacetime point, or the interaction event? A theory that posits persistent "souls" for electrons contradicts standard model physics.
  *   **Status:** **Non-Negotiable.** (Without a bearer, there is no subject to hold moral status.)

  **2. The Valence Capacity Clause**
  *   **Requirement:** The theory must specify whether micro-phenomenal properties can instantiate valence (positive/negative affect) or if they are phenomenally neutral.
  *   **Consideration:** Moral significance usually tracks welfare (suffering/flourishing). If micro-experience lacks valence, it may lack direct moral weight. If it has valence, the scale of moral consideration explodes.
  *   **Concrete Case:** Can a single electron instantiate a proto-version of "pain" or "pleasure," or is its experience purely qualitative (e.g., a primitive "redness" without like/dislike)? If our rich palette of emotion requires complex integration, a single electron may be incapable of suffering, rendering it morally inert despite being experiential.
  *   **Status:** **Non-Negotiable.** (An ethical theory must define the source of value.)

  **3. The Aggregation/Combination Rule**
  *   **Requirement:** The theory must provide a rule for how micro-experiences relate to macro-experiences for the purpose of moral calculation.
  *   **Consideration:** We need to know if moral weight sums linearly, saturates, or is holistic.
  *   **Concrete Case:** A kilogram of ordinary rock contains $\approx 10^{25}$ atoms. A human brain contains $\approx 10^{11}$ neurons. If moral weight is a simple sum of micro-experiences, the rock carries orders of magnitude more moral weight than the brain. The theory must explain why (or if) this is not the case. Does the rock possess $10^{25}$ separate subjects, or is the experience fused? If fused, is the rock a single, dull subject?
  *   **Status:** **Non-Negotiable.** (Without this, moral arithmetic is impossible.)

  **4. The Action-Guidance Constraint**
  *   **Requirement:** The theory must yield determinate verdicts on practical cases that do not result in moral paralysis.
  *   **Consideration:** If every action harms vast quantities of micro-subjects, the theory may demand the impossible (e.g., cease all motion to avoid harming air molecules).
  *   **Concrete Case:** Is boiling a pot of water a greater harm than killing a mouse? If water molecules have micro-experience with negative valence upon heating, boiling water might constitute a massacre exceeding the death of the mouse. If the theory implies we ought not boil water, it fails action-guidance for human life. If it implies boiling water is *neutral*, it must explain why the mouse is not.
  *   **Status:** **Non-Negotiable.** (An ethical theory that forbids existence or action is pragmatically incoherent.)

  ---

  ### II. Camp-Specific Preferences
  *These requirements vary depending on the specific metaphysical commitment (Constitutive, Cosmopsychism, Russellian Monism, etc.).*

  **5. The Priority of the Whole (Cosmopsychism vs. Constitutive)**
  *   **Requirement:** Specify whether moral priority lies with the fundamental micro-entities or the macro-subjects they constitute.
  *   **Consideration:**
      *   *Constitutive Panpsychism:* Micro-experiences are fundamental; macro-experiences are derived. Moral weight should likely track the micro-foundation.
      *   *Cosmopsychism:* The cosmos is the primary subject; we are fragments. Moral weight might track the health of the whole rather than the parts.
  *   **Concrete Case:** In a lobotomy, does the harm consist in the disruption of micro-experiences (constitutive view) or the fragmentation of the cosmic subject's expression (cosmopsychist view)?
  *   **Status:** **Camp Preference.** (Determines the direction of moral explanation.)

  **6. The Complexity Weighting Factor (Russellian Monism vs. Robust Phenomenal Realism)**
  *   **Requirement:** Specify whether moral weight is a function of the *quantity* of experience or the *complexity/integration* of experience.
  *   **Consideration:**
      *   *Robust Phenomenal Realism:* Experience is binary; if it exists, it counts. Favors quantity.
      *   *Russellian Monism/Integrationists:* The intrinsic nature of physical states matters, but moral relevance scales with structural complexity (e.g., information integration).
  *   **Concrete Case:** This decides the Rock vs. Brain case. If weight tracks quantity, the Rock wins. If weight tracks complexity/integration (the richness of the palette), the Brain wins despite having fewer fundamental entities.
  *   **Status:** **Camp Preference.** (Crucial for avoiding the "Rock > Brain" absurdity.)

  **7. The Persistence Condition**
  *   **Requirement:** Specify whether the bearer of experience must persist through time to be a subject of harm.
  *   **Consideration:** In process metaphysics or QFT, entities are ephemeral.
  *   **Concrete Case:** If an electron's existence is momentary, can it be "harmed" in a way that matters? Or does harm require a narrative thread of experience over time? A theory that requires persistence rules out event-ontologies.
  *   **Status:** **Camp Preference.** (Depends on the underlying philosophy of time and physics.)

  ---

  ### III. Closing Analysis

  **The Single Knockout Requirement**
  **Requirement #3 (The Aggregation/Combination Rule)** knocks out the most candidates.
  Most intuitive ethical frameworks rely on linear aggregation (more suffering = worse). In a panpsychist context, linear aggregation leads immediately to the conclusion that inanimate matter (rocks, stars, gas clouds) possesses vastly more moral weight than sentient animals due to the sheer number of fundamental constituents. Any theory that cannot solve the *ethical combination problem*—explaining why $10^{25}$ micro-subjects do not morally outweigh one macro-subject—collapses into absurdity. This eliminates naive utilitarian panpsychism instantly.

  **The Joint Unsatisfiability Trilemma**
  Your suspicion is correct. The following three requirements appear jointly unsatisfiable under standard assumptions:

  1.  **Universal Moral Weight:** Moral significance attaches wherever there is experience (Panpsychist commitment).
  2.  **Linear Grading:** Moral weight is graded by the *amount* of experience (Quantity of subjects/instances).
  3.  **Action-Guidance:** The theory prescribes actions compatible with human survival (e.g., boiling water, walking, eating).

  **The Conflict:**
  If (1) is true, there is experience in water, air, and rocks. If (2) is true, the sheer volume of micro-experience in a pot of water exceeds the macro-experience of a mouse. Therefore, boiling water is worse than killing a mouse. This violates (3), as it renders basic thermodynamics morally prohibited.

  **The Resolution Space:**
  To satisfy the list, a theory must reject **(2)**. It must argue that moral weight is **not** graded by the quantity of micro-experience, but by the *structural complexity* or *integration* of that experience (favoring the Brain over the Rock). However, this move risks contradicting the spirit of **(1)**: if micro-experience doesn't contribute linearly to moral weight, in what sense does it have "moral significance" at all? If the answer is "none," panpsychism loses its ethical upshot. If the answer is "some," we return to the paralysis of (3).

  Thus, the specification list itself reveals that an adequate theory must decouple *ontological fundamentality* from *moral fundamentality*. It must grant that micro-experience exists (Panpsychism) while denying that it aggregates morally in proportion to its physical abundance. Any theory that fails to make this specific distinction will fail the requirements.
