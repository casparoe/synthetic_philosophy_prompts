  # Activity Design: The Admiralty Adjudication

  ## 1. The Claimant Dossiers (Printable)
  *Instructions: Distribute one set of these four dossiers to each of the four panels. All facts are undisputed.*

  **CLAIMANT A: THE VOYAGER**
  *   **Hull:** 100% replaced timber (one-for-one over 40 years).
  *   **Service:** Continuous commercial service under original name since launch.
  *   **Registry:** Holds original registration papers; never deregistered.
  *   **Crew:** Continuous chain of command; current captain served 20 years.
  *   **Artifacts:** Original bell and figurehead lost at sea in Year 15.
  *   **Plans:** Original blueprints lost in shipyard fire (Year 5).

  **CLAIMANT B: THE MUSEUM**
  *   **Hull:** 100% original timber (discarded during Voyager's repairs, stored, reassembled).
  *   **Service:** Static display in dry dock for 10 years; not seaworthy.
  *   **Registry:** No current registration; designated "Historical Artifact."
  *   **Crew:** No crew; maintained by curators.
  *   **Artifacts:** Contains no original fixtures (bell/figurehead missing).
  *   **Plans:** Reconstructed from Voyager's logs by museum historians.

  **CLAIMANT C: THE HYBRID**
  *   **Hull:** Original sound hull (purchased from rival owner) now containing 100% of Voyager's discarded timber (installed one-for-one as Voyager was repaired).
  *   **Service:** Continuous commercial service under rival name for 40 years.
  *   **Registry:** Holds rival registration papers; never deregistered.
  *   **Crew:** Continuous chain of command (rival crew).
  *   **Artifacts:** Original bell and figurehead lost at sea in Year 15.
  *   **Plans:** Original blueprints lost in shipyard fire (Year 5).

  **CLAIMANT D: THE PHOENIX**
  *   **Hull:** 100% new timber (launched last year).
  *   **Service:** No commercial service; launched for trust adjudication.
  *   **Registry:** New registration under original name (granted provisionally).
  *   **Crew:** New crew hired from original builder's guild.
  *   **Artifacts:** Recovered original bell and figurehead (found in private collection); holds original logbook.
  *   **Plans:** Built using original blueprints (recovered from architect's private estate).

  ---

  ## 2. The Role Cards (Printable)
  *Instructions: Cut into 6 cards per panel. Distribute one to each panelist. Keep secret.*

  **CARD 1: THE MATERIALIST**
  *   **Criterion:** Identity is determined by physical constitution. The ship is the matter.
  *   **Ranking:** 1. Museum (All original wood) > 2. Hybrid (All original wood) > 3. Voyager (No original wood) > 4. Phoenix (No original wood).
  *   **Tie-Break:** If matter is equal, prefer the ship that is seaworthy.

  **CARD 2: THE CONTINUITY THEORIST**
  *   **Criterion:** Identity is determined by spatio-temporal continuity. The ship is the journey.
  *   **Ranking:** 1. Voyager (Unbroken journey, original registry) > 2. Hybrid (Unbroken journey, rival registry) > 3. Phoenix (New journey) > 4. Museum (No journey).
  *   **Tie-Break:** If continuity is equal, prefer original registry.

  **Cards 3-6 are distributed to ensure the mathematical cycle (see Verification Section). For the activity to function, the Instructor must ensure the specific distribution below is maintained in every panel.*

  **CARD 3: THE FUNCTIONALIST**
  *   **Criterion:** Identity is determined by functional integrity and service.
  *   **Ranking:** 1. Hybrid (Original wood + Continuous Service) > 2. Voyager (Continuous Service) > 3. Phoenix (Seaworthy) > 4. Museum (Static).

  **CARD 4: THE ORIGINATOR**
  *   **Criterion:** Identity is determined by causal origin (plans/builder).
  *   **Ranking:** 1. Phoenix (Original plans + yard) > 2. Voyager (Original registry) > 3. Museum (Historical status) > 4. Hybrid (Rival origin).

  **CARD 5: THE LEGALIST**
  *   **Criterion:** Identity is determined by legal registry and name.
  *   **Ranking:** 1. Voyager (Original registry) > 2. Phoenix (Provisional original name) > 3. Hybrid (Rival registry) > 4. Museum (No registry).

  **CARD 6: THE CURATOR**
  *   **Criterion:** Identity is determined by artifact retention and historical narrative.
  *   **Ranking:** 1. Phoenix (Bell + Logbook + Plans) > 2. Museum (Original Wood) > 3. Voyager (Name only) > 4. Hybrid (Nothing original).

  ---

  ## 3. Mechanics & Token Rules

  **Panel Composition:** 6 Panelists + 1 Solicitor (elected from the 6, or 7th role if you have 28 students; if 24, one panelist doubles as Solicitor but holds a separate "Solicitor Sheet" summarizing all 6 criteria). *Recommendation: Elect one of the 6 as Solicitor. They surrender their Role Card voting power to the Chair but retain their token stake.*

  **The Bank:** Each panel starts with **200 Tokens**.
  **Private Stakes:** Each Panelist starts with **10 Personal Tokens**.
  **Solicitor Stash:** Solicitor starts with **0 Personal Tokens**.

  **The Tournament:**
  1.  **Seeding:** The Solicitor designs a knockout bracket of 3 pairwise motions (e.g., A vs B, Winner vs C, Winner vs D).
  2.  **Betting:** Before each motion, Panelists bet 1-5 Personal Tokens on which Claimant will *win the vote*.
  3.  **Voting:** Panelists vote according to their **Role Card** ranking (mandatory).
  4.  **Payout:**
      *   If a Panelist bets on the Majority Winner: They gain tokens equal to their bet (from the Bank).
      *   If a Panelist bets on the Loser: They lose their bet (to the Bank).
      *   **Solicitor Bonus:** If a vote results in a **TIE (3-3)**, the Solicitor casts the deciding vote AND takes **20 Tokens from the Bank** into their Personal Stash.
  5.  **Goal:** Panelists want to maximize Personal Tokens. The Solicitor wants to maximize Personal Tokens (incentivizing Ties).

  **Tie-Breaking (Voter Ties):**
  *   If a motion ends 3-3, the Solicitor decides the winner.
  *   If the final token counts are tied, the Panelist with the most correct predictions wins.

  ---

  ## 4. Minute-by-Minute Timeline (100 Minutes)

  *   **00-10: Setup.** Divide into 4 panels. Distribute Dossiers. Read the Trust Bequest scenario aloud.
  *   **10-20: Role Assignment.** Distribute Role Cards (ensure Cards 1-6 are present in each panel). 5 mins private study.
  *   **20-30: Election & Briefing.** Panels elect a Solicitor. Give Solicitors the "Solicitor Sheet" (summary of all 6 rankings). Solicitors draft seeding (5 mins).
  *   **30-50: Motion 1.** Seeding announced. Betting (5 mins). Voting & Tally (5 mins). Payouts (5 mins).
  *   **50-70: Motion 2 & 3.** Repeat process for remaining bracket matches.
  *   **70-80: Adjudication.** Announce Winners. Count Tokens.
  *   **80-100: Debrief.** Full class discussion (see below).

  ---

  ## 5. Verification Section (Instructor Only)

  **Preference Profile (Based on Role Cards):**
  *   **C1 (Materialist):** M > H > V > P
  *   **C2 (Continuity):** V > H > P > M
  *   **C3 (Function):** H > V > P > M
  *   **C4 (Origin):** P > V > M > H
  *   **C5 (Legalist):** V > P > H > M
  *   **C6 (Curator):** P > M > V > H

  **Pairwise Majority Matrix (4 votes needed to win):**
  *   **V vs M:** V wins (C2, C3, C4, C5). *Score: 4-2*
  *   **M vs H:** M wins (C1, C4, C5, C6). *Score: 4-2*
  *   **H vs V:** H wins (C1, C2, C3, C6). *Score: 4-2*
      *   *Result:* **Condorcet Cycle (V > M > H > V)**.
  *   **P vs V:** Tie (C4, C5, C6 prefer P; C1, C2, C3 prefer V). *Score: 3-3*
  *   **P vs M:** Tie (C4, C5, C6 prefer P; C1, C2, C3 prefer M). *Score: 3-3*
  *   **P vs H:** H wins (C1, C2, C3, C5, C6 prefer H). *Score: 5-1*

  **Scenario A (Solicitor seeks Ties):**
  1.  **Seeding:** (P vs V) -> Tie (Solicitor votes P). (P vs M) -> Tie (Solicitor votes P). (P vs H) -> H wins.
      *   *Wait, P loses to H.* Solicitor must eliminate H early.
      *   **Revised Seeding A:** (H vs V) -> H wins. (H vs M) -> M wins. (M vs P) -> Tie (Solicitor votes P).
      *   **Winner:** **Phoenix (P)**.
      *   **Solicitor Gain:** 2 Ties = 40 Tokens.

  **Scenario B (Solicitor ignores Ties / Standard Bracket):**
  1.  **Seeding:** (V vs M) -> V wins. (V vs H) -> H wins. (H vs P) -> H wins.
      *   **Winner:** **Hybrid (H)**.
      *   **Solicitor Gain:** 0 Ties = 0 Tokens.

  **Scenario C (Solicitor favors Voyager):**
  1.  **Seeding:** (H vs M) -> M wins. (M vs P) -> Tie (Solicitor votes M). (M vs V) -> V wins.
      *   **Winner:** **Voyager (V)**.
      *   **Solicitor Gain:** 1 Tie = 20 Tokens.

  **Conclusion:** The Winner depends entirely on the Seeding and the Solicitor's tie-breaking choices.

  ---

  ## 6. Information Structure & Rigging

  **Goal:** Ensure at least two panels produce different winners without obvious instructor interference.
  **Method:** **Solicitor Incentive Variance.**
  *   Give all Solicitors the same instruction: "Maximize your Personal Tokens."
  *   However, privately hand two Solicitors a "Legal Precedent" note: *"In case of a tie, the Claimant with the Original Registry (Voyager) has historical precedence."*
  *   Hand the other two Solicitors a different note: *"In case of a tie, the Claimant with the Original Artifacts (Phoenix) has historical precedence."*
  *   **Justification:** This simulates real-world legal ambiguity where "precedent" is selectively cited. It nudges the Tie-Break in different directions without changing the voting rules.
  *   **If all panels converge:** In the debrief, reveal the alternative seeding yourself. "Two panels found X. But what if the Solicitor had chosen Y?"

  ---

  ## 7. Debrief Script (80-100 Minutes)

  **Phase 1: The Data (5 mins)**
  *   Ask each panel to announce their Winner and the Solicitor's Token Count.
  *   Write results on board. (Expect variation).
  *   *Question:* "You all had the same facts. You all had the same criteria in the room. Why did you crown different ships?"

  **Phase 2: The Cycle (10 mins)**
  *   Reveal the Pairwise Matrix (V > M > H > V).
  *   *Point:* "This is a Condorcet Cycle. It means 'Being the Same Ship' is not a transitive relation in this context. If A=B and B=C, logic says A=C. Here, the group says A=B, B=C, but C=A."
  *   *Philosophical Map:* This mirrors the **Intransitivity of Identity** problem. If identity relies on multiple criteria (matter, continuity, function), and those criteria conflict, identity loses its logical stability.

  **Phase 3: The Solicitor (10 mins)**
  *   *Question:* "Solicitors, did you look for ties?"
  *   *Point:* "The winner was not discovered; it was **manufactured** by the order of questions. This is **Agenda Control**."
  *   *Philosophical Map:* This challenges **Metaphysical Realism** about identity. If the fact of 'which ship is the ship' changes based on the order we ask the questions, is it a fact about the world, or a fact about our language/procedures?
  *   *Common Ground:* Everyone agrees the physical facts (planks, logs) are fixed.
  *   *Live Controversy:* Does identity supervene on physical facts? (Most say yes). Does it supervene on *our* criteria? (Activity suggests yes).

  **Phase 4: The Fourth Claimant (5 mins)**
  *   *Question:* "Why did we need Claimant D (Phoenix)? The old puzzle only had two."
  *   *Point:* "With two ships, you just have a standoff. With four, you have a **Spoiler**. Phoenix created the Ties that gave the Solicitor power. In metaphysics, adding edge cases (like the 'Swampman' or 'Teletransporter') often breaks theories that worked for simple cases."

  **Phase 5: Presuppositions & Limitations (5 mins)**
  *   *Flag:* "This activity presupposes identity is a **binary relation** (Yes/No). Some philosophers (Relative Identity theorists) argue identity is always 'identity relative to a sortal' (e.g., same *ship*, but not same *plank-collection*). If we allowed that, the cycle might dissolve."
  *   *Flag:* "It also presupposes **Classical Logic**. Paraconsistent logicians might accept the contradiction (A=B and A≠B) without explosion."
  *   *No Resolution:* "We are not solving the Ship of Theseus today. We are showing that **any** solution requires you to privilege one criterion over others, and that privilege is often a matter of procedural power, not metaphysical necessity."

  ---

  ## 8. Troubleshooting: Predictable Failures

  **1. Role-Card Holders Voting Against Type**
  *   *Symptom:* A Materialist votes for Voyager.
  *   *Fix:* Pause. Remind them: "You are not arguing for what *you* believe. You are an algorithm applying a rule. If you break character, the math breaks."

  **2. "It's Just Voting, Not Metaphysics"**
  *   *Symptom:* Panelists dismiss the result as a flaw in majority rule.
  *   *Fix:* "Exactly. If 'Being the Ship' is a fact, voting shouldn't change it. If voting *does* change it, then 'Being the Ship' is not a brute fact. It is dependent on the procedure. That *is* the metaphysical insight."

  **3. Solicitor Discovered Early**
  *   *Symptom:* Panelists realize Solicitor wants ties and refuse to bet.
  *   *Fix:* "Lobbying is allowed." Encourage panelists to try to persuade the Solicitor. This mirrors real-world influence on metaphysical framing.

  **4. Staking Collapses into Unanimity**
  *   *Symptom:* Panelists all bet on the obvious winner.
  *   *Fix:* Ensure the "Tie" matchups (P vs V) are opaque. The Dossiers are balanced enough that P vs V should feel like a coin toss to the voters.

  **5. The Fast Panel (Finishes in 60 mins)**
  *   *Fix:* **The Appeal.** Allow the Losers to file an appeal. They must propose a *new* Seeding that would have changed the outcome. If they can prove it mathematically, they steal 10 tokens from the Solicitor.

  ---

  ## 9. Limitation Statement (Verbal)

  *Instructor Note: You must say this explicitly in the debrief.*

  "This activity demonstrates that **criteria conflict** and **agenda sensitivity** exist. It does *not* demonstrate that there is no right answer. A Four-Dimensionalist might argue the 'Ship' is a spacetime worm and the puzzle is a linguistic confusion. An Epistemicist might argue there is a fact, but we cannot know it. This game simulates the **human practice of adjudication**, not the **metaphysical ground of identity**. It shows why we fight, not necessarily what is true."
