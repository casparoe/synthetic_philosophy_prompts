  You are correct to reject Goodhart's Law. Goodhart's Law describes a *strategic* failure (agents gaming the metric), whereas you are describing a *structural* and *epistemic* failure (the metric displacing the very capacity it was meant to support). Your situation is more insidious because the metric is working exactly as designed; the failure lies in the ecosystem surrounding it.

  There is no single, canonical term in clinical governance or management science that captures the specific triad you describe: (1) the displacement of tacit judgment by a metric, (2) the structural removal of the channel to report that judgment, and (3) the irreversibility of the loss (hysteresis).

  However, the phenomenon sits at the intersection of **Surrogation** (the measure replaces the goal), **Deskilling** (loss of human capacity), and **Path Dependence** (inability to revert). To give you the precision you need for a governance report, I recommend coining the term **"Institutional Epistemic Atrophy."**

  While "epistemic atrophy" is occasionally used in philosophy of education to describe individual reliance on technology, adapting it to **"Institutional Epistemic Atrophy" (IEA)** rigorously captures the organizational loss of the *capacity to know* outside the metric.

  Below is the rigorous definition, the observable criteria for your report, and the boundary cases to distinguish it from neighbouring concepts.

  ### Proposed Term: Institutional Epistemic Atrophy (IEA)

  **Definition:**
  A systemic condition in which an organization's reliance on a codified metric erodes the tacit knowledge required to interpret reality outside that metric, coupled with the structural removal of channels to act on non-metric information. This results in a **hysteresis effect**: even if the metric is discredited, the organization lacks the human capital and procedural pathways to revert to prior modes of judgment.

  **Why this term fits:**
  *   **Institutional:** Places the failure on the system (protocols, training, reporting lines), not the individual nurses.
  *   **Epistemic:** Refers to *knowledge* and *knowing*. The problem is not just that nurses are less skilled; it is that the institution no longer recognizes their intuition as valid knowledge.
  *   **Atrophy:** Implies a wasting away due to disuse. The skill was not fired; it was starved.
  *   **Implicit Irreversibility:** Atrophy implies that simply removing the cause (the metric) does not instantly restore function; rehabilitation is required, and in severe cases (as you describe), the tissue is dead.

  ---

  ### Observable Criteria for a Governance Report

  To assert that IEA has occurred, you must demonstrate the presence of all four following conditions:

  1.  **High Metric Fidelity:** Compliance with the measurement protocol is high, and the metric itself is technically valid (it predicts what it claims to predict for the cases it captures).
  2.  **Tacit Knowledge Erosion:** There is evidence that staff no longer generate or trust independent assessments that contradict the metric (e.g., "gut feeling" is no longer documented or discussed in handover).
  3.  **Structural Exclusion:** There is no formal mechanism to escalate concern based on non-metric data. An observation that contradicts the score is classified as "anecdotal" or "non-compliant" rather than "clinical intelligence."
  4.  **Hysteresis (Irreversibility):** Removing or relaxing the metric does not restore safety levels because the workforce lacks the training to exercise the judgment, and the protocol offers no alternative pathway for action.

  ---

  ### Boundary Cases: What Counts and What Does Not

  To protect your argument from being dismissed as general "resistance to change," you must distinguish IEA from neighbouring concepts.

  | Concept | Why it resembles IEA | Why it is **not** IEA (The Boundary) |
  | :--- | :--- | :--- |
  | **Goodhart's Law** | Performance degrades after a metric is introduced. | In Goodhart's, agents *game* the metric (e.g., falsifying data). In IEA, agents *obey* the metric faithfully. The metric is honest; the context is broken. |
  | **Automation Bias** | Staff trust the system over their own eyes. | This is a *psychological* phenomenon in the individual. IEA is *structural*: even a nurse who trusts their eyes has no *channel* to act on them. |
  | **Deskilling** | Staff lose the ability to perform tasks manually. | Deskilling can be reversed by retraining. IEA includes the **loss of standing**: the institution no longer accepts the skill as valid input, even if retrained. |
  | **Surrogation** | The measure becomes the goal. | Surrogation describes leadership's focus. IEA describes the **operational consequence**: the loss of the *capacity* to pursue the real goal even if leadership wants to. |
  | **Drift into Failure** | Safety margins erode over time. | Drift is usually gradual adaptation to constraints. IEA is a **step-change** caused by the specific introduction of a metric that colonizes the epistemic space. |

  ### The Mechanism: "Epistemic Enclosure"

  If the Board asks *how* this happened, you can describe the mechanism as **Epistemic Enclosure**.

  Historically, the "Enclosure Acts" fenced off common land, turning shared resources into private property and stripping commoners of their traditional rights. In your hospitals:
  *   **The Commons:** The shared professional space where a nurse's intuition held currency and could trigger action.
  *   **The Enclosure:** The scoring protocol.
  *   **The Loss of Rights:** The nurse's "common right" to escalate based on impression was revoked. The land (the patient's status) is now private property of the Score. If the Score says the patient is safe, the land is closed to intervention.

  ### Recommendation for the Report

  Do not frame this as "the score is wrong." Frame it as **"The score is right, but it is incomplete, and we have dismantled our capacity to see the rest."**

  **Suggested Wording:**
  > "We are experiencing **Institutional Epistemic Atrophy**. The deterioration score is a valid tool, but it has become a *substitute* for judgment rather than a *support* for it. By making the score the sole trigger for escalation, we inadvertently removed the institutional standing of clinical intuition. We have not only lost the skill of 'noticing' in our junior staff; we have removed the procedural channel by which noticing becomes action. This creates a hysteresis loop: we cannot simply return to the old way, because the 'old way' relied on unwritten skills and informal channels that no longer exist. Recovery requires not just protocol revision, but a reconstruction of epistemic authority—re-teaching staff that their judgment is a valid data point, and creating a formal 'Category Zero' escalation path for intuition that contradicts the score."

  This framing moves the conversation from "blame the nurses" or "blame the score" to "repair the system's capacity to know." It validates your board's initial delight (the score *does* work) while explaining why that very success created the vulnerability.
