answer: |-
  The granary smelled of dry husks and the sweet, dusty breath of sleeping grain. Elara stood before the three great bins, each carved from a single trunk of heartwood, their rims worn smooth by generations of scoops. To her left, the Ironrind, hard as pebble, meant for long storage. In the center, the Whitehead, soft and heavy, yielding the most flour per measure. To her right, the Thirstroot, knobby and dark, designed to survive a dry season.

  At the season's start, the bins were full. The town of Vallera relied on this balance.

  The merchant, Varrick, arrived on a Tuesday when the river was high. He wore a coat patched with leather from a dozen different animals and carried a set of brass scales that clicked softly when he set them on the counter. He did not haggle. He simply proposed exchanges.

  " Ironrind for Whitehead," Varrick said, resting a hand on the lid of the left bin. "A measured scoop for the handling. The mills prefer the soft grain this year."

  Elara looked at the Whitehead. The town needed bread. The Ironrind was safe, but safety did not fill bellies. She weighed the scoop in her hand, a standard measure carved from horn, and leveled it off against the bin's rim. She poured the fee into Varrick's sack and shifted the locks. The Ironrind went into his wagon; the Whitehead filled the center bin. It was a fair trade. She preferred the flour yield.

  Kael, the clerk, watched from the shadow of the ledger desk. He did not speak, but his chalk hovered over the slate. He wrote *Swap 1* and drew a line beneath it.

  Varrick returned in high summer, when the heat haze shimmered off the river stones. The granary was hot, the air thick with the scent of curing grain. Elara was checking the Whitehead for weevils when the merchant entered.

  "Whitehead for Thirstroot," Varrick said. He tapped the center bin. "Another scoop for the handling. The rains may fail. The root holds water better."

  Elara paused. She looked at the Whitehead, then at the merchant. Varrick was eager. His fingers drummed on the lid of the Whitehead bin, impatient to load it. He was willing to part with the Thirstroot easily, almost casually, but he handled the Whitehead with a specific, hungry care.

  A doubt prickled at her. Varrick traveled the valley; he saw the fields upstream. If he wanted the Whitehead so badly, perhaps he knew something about its viability. Perhaps a blight was coming that targeted soft grains. His willingness to part with the Thirstroot suggested he had enough, but his desire for the Whitehead suggested the Whitehead was about to become scarce—or worthless. If he wanted it, maybe she should not keep it.

  "Done," Elara said. She poured the second scoop. The horn measure scraped against the bin. She moved the locks again. The Whitehead went to the wagon; the Thirstroot filled the center bin.

  Kael's chalk scratched louder this time. He wrote *Swap 2* and drew another line.

  The third visit came in late autumn, when the frost whitened the roof tiles. Varrick's wagon was heavy now, laden for the winter road.

  "Thirstroot for Ironrind," he said. "One scoop. The winter will be long. You need storage."

  Elara looked at the Thirstroot. It was hardy, but it did not keep as well as the Ironrind over the deep cold. The cycle felt complete. She wanted the safety of the Ironrind for the months ahead. She paid the third scoop. The grain whispered as it fell into the sack. The locks turned one final time. The Thirstroot left; the Ironrind returned to the left bin.

  When the door closed behind Varrick, the silence of the granary returned. Elara brushed the dust from her apron and turned to the ledger.

  Kael was waiting. He stood by the slate, his face pale in the lantern light. He pointed to the chalk marks. Three lines. Three scoops.

  "The bins are full," Kael said. His voice was tight. "The Ironrind is back. The Whitehead is back in the wagon, then the Thirstroot, then the Ironrind. We are where we started."

  "We have the grain we need for winter," Elara said.

  "We have three scoops less grain than we started with," Kael replied. He tapped the horn measure sitting on the desk. It was empty, but the pile in Varrick's sack was not. "We paid to hold what we already held. If you know you will accept the third trade, you should not have accepted the first. If you know the cycle closes, the cost is certain."

  Elara looked at the bins. They were full, yes. But the total mass of the town's security was diminished by three measures. She thought of the second swap. She had not chosen the Thirstroot because she loved it more than the Whitehead. She had chosen it because Varrick's hands had told her the Whitehead was dangerous.

  "Preferences change," Elara said. "I learned something in summer."

  "You learned that he wants grain," Kael said. "You did not learn about the blight. There was no blight."

  Old Haren, the retired superior, shuffled in from the back room. He leaned on a cane topped with polished iron. He did not look at the ledger. He looked at the wall behind the desk, where a plank of wood was nailed fast. On it was painted a single sentence in black tar: *No Swaps After Planting.*

  "I nailed that ten years ago," Haren said. His voice was like grinding stones. "I followed it. Even when the merchant offered double. Even when the drought came."

  "If you had followed it, we would have had the Whitehead all summer," Elara said. "The mills would have run smoother."

  "And we would have the three scoops," Haren said. He tapped the plank. "Rule removes the temptation to think you are smarter than the cycle."

  Varrick was outside, securing the wagon straps. He was not running a scam; he was running a business. He matched supply to demand, and his demand was shaped by what people like Elara valued on any given Tuesday. He collected the fee because the service of moving the grain had value to someone, somewhere. He did not care if the grain returned to its origin. He cared that the scoop was measured true.

  Elara looked from the nailed rule to the chalk slate. Kael stood with his hand on the horn measure, ready to hide it away when the merchant returned next spring. He believed that refusing the first offer was the only way to keep the scoops. He believed that seeing the end meant you must not begin.

  But Elara remembered the heat of the summer day, the drumming of Varrick's fingers on the Whitehead bin. If she had refused the first swap, she would have kept the Ironrind. She would have saved the scoops. But she would have wondered all summer if the Whitehead was truly blighted, if her caution had starved the mills of better flour.

  The information had cost a scoop. Or had the cycle cost the scoop, and the information was just the story she told to make the loss feel like a choice?

  Kael picked up the chalk. He wrote *Next Season* at the top of the clean side of the slate. He looked at Elara, waiting for instruction. He was ready to refuse. He was ready to let the merchant leave without a single lock being turned.

  Elara placed her hand on the lid of the Ironrind bin. The wood was cold. She could feel the grain settling inside, shifting imperceptibly under its own weight. She looked at the horn measure, then at the nailed rule, then at the door where the merchant had vanished into the twilight.

  "Leave the measure on the desk," Elara said softly.

  Kael's hand tightened on the chalk. He did not put it down. He did not write. He stood still, watching her, waiting to see if she would lock the bins or leave them open for the spring. The dust motes danced in the lantern light, swirling in patterns that looked like circles, or perhaps like lines, depending on where you stood.
