answer: |-
  Elias slid the binder across the polished table. The cover sheet was clean: *Verdict: No Liability.*

  "Definitive?" Ms. Vance asked. She didn't touch the paper.

  "Engineering confirmed Unit 73 operated within Specification 4.4. Legal confirmed Indemnity Clause 9b covers all spec-compliant operations. The logic holds."

  Vance looked out the window at the rain. "Unit 73 blinded itself when hit by infrared. Like from a police cruiser. It drove into a barrier because it couldn't see the light."

  "That falls outside Spec 4.4's environmental definitions."

  "Because the spec was written three years ago. Before infrared strobes were standard issue." She turned back. "A reasonable engineer would have tested for it. That's negligence. Negligence voids the indemnity."

  "Our mandate was to assess compliance, not adequacy."

  "You sell thinking, Elias. Not checklist auditing. A single lawyer with a week and a phone could have told you that spec compliance isn't a safe harbor for negligence. You broke the question into pieces so small none of them could see the cliff."

  "The pieces were answered correctly."

  "Exactly," Vance said. "You built a machine that guarantees the wrong answer with perfect confidence."

  ***

  ### Analysis

  **The Escalation Tree**
  1.  **Root (Elias):** Receives "Are we liable?" Decomposes into two independent verification tasks based on available internal documents.
  2.  **Leaf A (Engineering):** Prompt: "Did Unit 73 meet Spec 4.4 logs?" Input: Sensor logs, Spec 4.4. Visibility: Internal performance metrics only. Output: "Yes." (True: The sensor did what the spec said).
  3.  **Leaf B (Legal):** Prompt: "Does Clause 9b cover spec-compliant performance?" Input: Contract, Spec 4.4 reference. Visibility: Contractual language only. Output: "Yes." (True: The contract language is explicit).
  4.  **Composition (Elias):** Combines Yes + Yes. Infers "No Liability."
  5.  **The Carve-Up:** The Root translated "Liability" (a legal status dependent on *reasonable care*) into "Compliance" (a technical status dependent on *defined rules*). This translation happened before the leaves were engaged.

  **The Single Feature Doing the Work**
  The **reification of the internal standard**. The structure treats the client's internal Spec 4.4 as the boundary of reality. By decomposing "Liability" into "Compliance," the system excludes the external context (negligence law, evolving technology standards) required to validate the spec itself.

  **Counterfactual**
  If you remove the constraint that leaves must operate *only* on provided internal documents, Legal could have researched case law regarding sensor negligence. However, this violates the firm's efficiency model. If you remove the decomposition and give the whole question to one person, they naturally cross-reference spec adequacy against legal standards because they hold both contexts simultaneously.

  **The Strongest Reply (Pro-Factored Cognition)**
  "Your scene proves nothing about decomposition. It proves that *framing* matters. A solo generalist also has to choose a frame. If a lone lawyer decides to focus only on the contract because the client handed them a contract, they make the exact same error. Decomposition just makes the framing explicit. The failure isn't the factory; it's the foreman's blueprint. Any cognition, solo or distributed, fails if the initial model of the world is wrong."

  **The Character's Answer**
  "A solo thinker feels the friction when the map doesn't match the terrain. They can pivot. When you decompose, you isolate the map-makers from the terrain-walkers. Engineering sees the terrain (the sensor blind spot) but is forbidden from questioning the map (the spec). Legal sees the map but never touches the terrain. You haven't distributed cognition; you've distributed blindness."

  **The Fix Attempt**
  Adding a **Reconciliation Role** at the top who checks the carve-up against the client's *actual* question ("Liability" vs. "Compliance") effectively smuggles the Generalist back in. To catch this error, the Reconciler must understand both the technical adequacy of the spec and the legal definition of negligence. If they possess that holistic understanding, they are the generalist the firm claimed it didn't need. If they only check for logical consistency between leaves (Did Engineering answer Legal's prompt?), they will miss the external gap. The structure cannot solve the frame problem without reintroducing the very expertise it sought to decompose.

  ***

  **Confidence Rating:** 85%
  **Uncertainty Point:** The constraint "No single employee ever held the information needed to see that."
  I am relying on the Root (Elias) not possessing the legal knowledge regarding negligence vs. compliance. If a competent Root is assumed to know basic liability principles, then Root *did* have the information and chose to ignore it, which edges toward "Root is dumb/corrupt." I have mitigated this by defining Root as a process expert rather than a domain expert, but in a firm selling "thinking," the expectation of domain fluency at the Root level is high. If the reader assumes Root *should* know tort law, the structural failure collapses into individual incompetence.

  **Constraint Conflict Check:**
  The constraint "Nobody in the firm is dumb" conflicts slightly with "Root makes a framing error that a generalist wouldn't." I have resolved this by attributing the error to the *firm's methodology* (Document-Driven Decomposition) rather than Root's personal intellect. Root is following the protocol perfectly. This satisfies the spec, but it requires the reader to accept that the protocol itself is the antagonist, not the people.
