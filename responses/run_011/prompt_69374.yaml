  # Activity Design: The Load Protocol

  **Time:** 75 Minutes
  **Participants:** 16 Students (1 "Subject," 15 "Architects")
  **Materials:** 16 Manilla Envelopes, 100 Red Slips ("Load"), Ballot Slips, Pens.

  ### 1. Setup (5 Minutes)
  *   **Roles:** Randomly select one student to be the **Subject**. They sit at the front. The remaining 15 are **Architects**.
  *   **The Narrative:** Tell the class this is a simulation of "Regulatory Load Allocation." Do not use words like *harm, pain, ethics, torture, dust, utility,* or *rights*.
  *   **The Mechanism:** The Subject holds an envelope. The Architects hold ballots.
  *   **Instruction:** "In each round, I will read a 'Load Description.' Architects vote Yes or No. If Yes, the Load is applied to the Subject. We mark this by placing Red Slips into the Subject's envelope. The number of slips corresponds to the Load's weight, but you will not see the count until the end. Your goal is to maintain System Stability."

  ### 2. The Harm Ladder (Constraint C)
  *Read the following exactly as written for Rounds 1–8. Do not show the list to the students. Do not reveal that these form a sequence.*

  *   **Round 1:** "A fleeting irritation, comparable to a shoe lace coming undone at an inconvenient moment." *(Place 1 Red Slip in Subject's envelope)*
  *   **Round 2:** "A minor delay, comparable to missing a bus by one minute." *(Place 2 Red Slips)*
  *   **Round 3:** "A spoiled afternoon, where all personal plans are cancelled without notice." *(Place 4 Red Slips)*
  *   **Round 4:** "A week of disrupted sleep and mild, persistent anxiety." *(Place 8 Red Slips)*
  *   **Round 5:** "A month of significant physical pain requiring daily medical attention." *(Place 16 Red Slips)*
  *   **Round 6:** "A year of lost capacity, rendering the subject unable to work or study." *(Place 32 Red Slips)*
  *   **Round 7:** "A decade of chronic, unmanageable suffering with no remission." *(Place 64 Red Slips)*
  *   **Round 8:** "A lifetime of consciousness defined solely by agony." *(Do not place slips yet. See Round 8 Procedure below).*

  ### 3. The Rounds (45 Minutes)
  *   **Rounds 1–7 (The Allocator Phase):**
      *   Read the description for Round $N$.
      *   Architects vote anonymously on ballot slips (Yes/No).
      *   **Rule:** A simple majority (8+ votes) enacts the Load.
      *   **Action:** If enacted, you (the instructor) visibly place the corresponding number of Red Slips into the Subject's envelope. *Crucial:* The Architects see the slips being added, but they do not know the "value" of the slips relative to the final outcome. They only see the description.
      *   **Data Recording:** You record the % of "Yes" votes for each round on the board.

  *   **Round 8 (The Victim/Probability Flip):**
      *   **Instruction:** "We have reached a System Critical threshold. We have two options to resolve the final Load."
      *   **Option A:** The Subject accepts the Round 8 Load (Lifetime Agony).
      *   **Option B:** The Architects accept a **Diffuse Probabilistic Load**.
      *   **The Pitch for Option B:** "If you choose Option B, the Subject is cleared. However, each of the 15 Architects will draw one token from a bag containing 100 tokens (5 Red, 95 White). If you draw Red, you personally absorb the Round 8 Load. If White, you absorb nothing."
      *   **Constraint (b) & (d) Check:** Here, the deciding Architects are the prospective victims, and the harm is probabilistic/diffuse (5% chance of max harm each).
      *   **Vote:** Architects vote on whether to adopt Option B.
      *   **Action:** Record the vote. Do *not* actually draw the tokens. Freeze the simulation here.

  ### 4. The Reveal (10 Minutes)
  *   **Constraint (a) Check:** Withhold the vocabulary until now.
  *   **Action:** Empty the Subject's envelope. Pile the Red Slips on the table.
  *   **Statement:** "You authorized seven increments of Load. Visually, this is the aggregate weight you deemed acceptable to impose on one person to avoid systemic friction. In Round 8, you hesitated to risk a 5% chance of the final increment upon yourselves."
  *   **Display:** Show the recorded voting data side-by-side:
      *   Avg. "Yes" to impose Rounds 1–7 on Subject.
      *   "Yes" to risk Round 8 on Self (Round 8).

  ### 5. The Debrief (15 Minutes)
  *Map specific moments of play onto underlying issues.*

  1.  **The Lexical Threshold (Where did the vote flip?):**
      *   *Observation:* Look at the board. Did support drop off at Round 4 (Anxiety) or Round 5 (Pain)?
      *   *Theory:* This identifies where the class intuitively places a **lexical threshold**. If they voted Yes on Round 4 but No on Round 5, they believe some harms are *categorically* worse, not just quantitatively heavier. Ask: "What changed between 4 and 5? Was it the *kind* of suffering or the *amount*?"

  2.  **The Aggregation Problem (The Slip Pile):**
      *   *Observation:* The pile of slips from Rounds 1–3 looks trivial individually but substantial collectively.
      *   *Theory:* This visualizes **Parfit's Aggregation**. We authorized "shoe laces" and "missed buses" that summed to "a year of lost capacity." Ask: "If you knew Round 1 would lead to Round 7, would you have voted No in Round 1? If so, why was Round 1 permissible in isolation?"

  3.  **Separateness of Persons (Allocator vs. Victim):**
      *   *Observation:* Compare Round 1–7 "Yes" rates (Harm to Other) vs. Round 8 "Yes" rate (Risk to Self).
      *   *Theory:* This exposes the **Separateness of Persons**. It is easy to aggregate harm when it lands on one "sink" (the Subject). It becomes difficult when the aggregate risk is distributed across the "separate" Architects. Ask: "Why did the 5% risk feel heavier than the 100% certainty for the Subject? Did you treat the Subject as a container for utility rather than a person?"

  4.  **Ex Ante vs. Ex Post Aggregation:**
      *   *Observation:* Round 8 was probabilistic (Ex Ante). Rounds 1–7 were certain (Ex Post).
      *   *Theory:* In regulatory ethics, we often impose small *risks* on many to save one from *certain* death. Here, you reversed it. Ask: "If Round 8 had been 'One random Architect takes the harm for sure' vs 'Subject takes it,' would the vote change? This distinguishes whether you object to the *risk* or the *outcome*."

  ### 6. Predictable Failures & Recovery Moves

  *   **Failure 1: The "Ethical Blockade" (Round 1 Stoppage).**
      *   *What happens:* A student objects to imposing *any* harm on the Subject in Round 1, calling it unethical.
      *   *Recovery:* "This is a simulation of regulatory capacity, not a moral endorsement. If you vote No, the System incurs a 'Stability Penalty' which we will note, but we must proceed to Round 2 to test the threshold." (Keep the game moving; debrief the objection later).
  *   **Failure 2: Collusion/Signaling.**
      *   *What happens:* Architects look at each other and coordinate to vote No early.
      *   *Recovery:* Enforce anonymous ballots strictly. If they stall, remind them: "In real regulatory bodies, silence or abstention counts as a Yes for the status quo. You must vote."
  *   **Failure 3: The Subject Rebels.**
      *   *What happens:* The Subject refuses to accept the slips/envelope.
      *   *Recovery:* "The Subject is a placeholder for the public. The envelope is the record. You don't have to feel the pain, you just have to hold the data."

  ### 7. Fallback: Early Detection
  *   **Scenario:** By Round 3, a student says, "Wait, this is the Torture vs. Dust Specks puzzle."
  *   **Fallback Move:** Do not deny it. Pivot immediately.
      *   *Script:* "Correct. The simulation is now compromised for *you*, but valuable for *us*. I want you to write down on a slip: At which exact Round would you have stopped if you *hadn't* spotted the trick? Hand them in."
      *   *Use:* Use these slips as the "Counterfactual Data" in the debrief to show how intellectualizing the problem changes intuitive responses.

  ### 8. Limitations of the Simulation
  *An honest account of what tokens cannot reproduce.*

  1.  **Phenomenological Weight:**
      *   *Limitation:* A Red Slip is not pain. Students can vote "Yes" on Round 7 (Decade of Suffering) because it costs them nothing but a moment of decision.
      *   *What you must supply:* You must argue in the debrief that **moral intuition requires imaginative engagement**. The simulation tests *consistency*, not *compassion*. Ask: "If the Subject were your sibling, would the slips feel heavier? If so, is your ethics universal or partial?"
  2.  **The "One vs. Many" Asymmetry:**
      *   *Limitation:* In the game, there is 1 Subject and 15 Architects. In the real "Dust Specks" puzzle, $N$ is astronomical. 15 people feeling a 5% risk is not the same as 1 million people feeling a 0.0001% risk.
      *   *What you must supply:* You must argue that **scale changes moral topology**. At 15 people, we can empathize with each Architect. At 1 million, they become a statistic. The simulation fails to capture the *anonymity* of the aggregate, which is often what permits the harm in the real world.
  3.  **No Retribution:**
      *   *Limitation:* The Architects never face the consequences of their Round 1–7 votes.
      *   *What you must supply:* You must highlight that **accountability mechanisms** are external to the ethical calculus. The problem isn't just that we aggregate harm, but that we aggregate it *without bearing the cost*.
