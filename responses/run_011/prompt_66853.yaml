answer: |-
  AETHELGARD MUTUAL
  Affective Peril Desk | Claim Determination
  **Claimant:** [Redacted]
  **Policy:** 8842-K | **Date:** October 14, 2023
  **Subject:** Determination of Acute Sorrow Event (Ref: *The Amber Aviary*)

  Dear Policyholder,

  We have completed our review of your filing regarding the emotional distress sustained on September 3rd and 4th. You report being laid low for two days by grief following the death of Cecily, a protagonist in J. H. Vane's novel *The Amber Aviary*. We acknowledge the subjective severity of this distress; our intake notes confirm genuine physiological markers of sorrow. However, Aethelgard Mutual must deny this claim under Schedule 4.1 (Ontological Verification).

  Per the Policy Schedule of Definitions, a "Qualifying Affective State" requires belief in the object's existence. We operationalize belief as a disposition to wager: a state counts as believing-that-p only if the insured would act on p when the cost of acting is real. In your statement, you acknowledged awareness of the text's fictional status throughout the reading event. You did not contact authorities regarding Cecily's demise, nor did you attempt to intervene in the narrative. Consequently, no wager was placed. Without a wager, there is no belief. Without belief, there is no Qualifying Affect.

  We note the definition of "Quasi-Grief" in Schedule 4.1(b). This state is functionally indistinguishable from grief but occurs inside a game the insured was knowingly playing with themselves. The Schedule concedes that Quasi-Grief is what nearly everyone means when they say a film got to them. Nevertheless, it remains excluded from coverage.

  We considered adjudicating this under the "Entertained Thought" clause. This was rejected on actuarial grounds. On that reading, the company is liable for every worry anyone has ever had about something that isn't happening. The exposure is infinite. We cannot underwrite the imagination.

  Please see the attached Household Schedule for comparative determinations this quarter:
  1.  **Claim 8842-L (Fear):** During a horror film, the insured bolted the front door while home alone. This action satisfies the wagering definition (cost incurred to mitigate perceived threat). Claim Approved.
  2.  **Claim 8842-M (Grief):** Following the obituary of a stranger the insured never met. The object existed. Claim Approved at Tier 2 (Real Loss). Note that Tier 2 payouts exceed Tier 1 (Quasi-Loss) rates.

  Internal Precedent 199-B is instructive. A prior adjuster paid out on a fiction claim involving a dragon. This was reversed on appeal. The ground of reversal cited "material misalignment of substrate," though the appellate decision was otherwise regarding plumbing coverage. We adhere to the reversal.

  To file an appeal, you must certify, under penalty of perjury, that at no point during the reading did you believe the character existed. If you are unable to sign this certification because you did believe Cecily was real, your claim is reclassified as a Delusional Event (Exclusion 7.1) and remains denied. If you can sign, the original denial stands.

  Sincerely,

  Claims Adjuster II
  Affective Peril Desk
  Aethelgard Mutual
