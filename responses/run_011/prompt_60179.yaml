answer: |-
  1.  **Individuation:** Your metric requires tallying predictions and patches for a specific "research programme," but historians argue programmes bleed into one another; how do you individuate the unit of scoring without arbitrary boundaries?
      *   *Likely Answer:* "We use rational reconstruction to define boundaries based on shared hard cores."
      *   *Follow-up:* "If the boundaries are reconstructed by you, aren't you scoring your model rather than the history?"
      *   *(Note: If she starts a story about Newtonian physics, politely interrupt: "I want to pin down the boundary rule before we get to the cases.")*

  2.  **The Copernicus Test:** Lakatos and Zahar used the Copernicus-versus-Ptolemy comparison to argue for objective superiority; does that specific comparison survive being fed into your machinery, given the critique that they were scoring a rational reconstruction rather than the actual history?
      *   *Likely Answer:* "Yes, the score aligns with the historical consensus on that shift."
      *   *Follow-up:* "So the objectivity is internal to the reconstruction, not external to the historical record?"

  3.  **Near-Core Weighting:** You weight predictions by how close the mechanism sits to the hard core, but is there any non-circular criterion for 'closeness' or is it expert intuition with a subscript on it?
      *   *Likely Answer:* "It relies on the consensus of practitioners at the time regarding theoretical centrality."
      *   *Follow-up:* "If practitioners are often wrong about centrality, doesn't that bake their biases into your score?"

  4.  **Hindsight Novelty:** Zahar-novelty depends on whether a fact was part of the problem situation; does your coding of that counterfactual come out of the primary papers or out of what historians say afterwards?
      *   *Likely Answer:* "We prioritize the primary papers to avoid historiographic bias."
      *   *Follow-up:* "What do you do when the primary paper is ambiguous about whether the fact was known?"

  5.  **The Exchange Rate:** You subtract patches and add predictions, but how many patches does one confirmed novel prediction offset, and where does that exchange rate come from?
      *   *Likely Answer:* "The rate is calibrated to reflect the heuristic cost of ad hocery."
      *   *Follow-up:* "Calibrated against what—your own intuition about which programmes were good?"
      *   *(Note: She may drift into a story about string theory here; cut in: "I'm asking about the calibration set, not the specific example.")*

  6.  **Mendelian Genetics:** You accept your score comes out negative for Mendelian genetics post-rediscovery due to patching; does admitting that result limit the metric's use for working scientists who might view that era as foundational?
      *   *Likely Answer:* "It shows the metric captures the actual instability of that period, not just the later success."
      *   *Follow-up:* "So a scientist in 1910 using your metric would have been told to abandon genetics?"

  7.  **Overfitting the Weights:** Were the weights and window sizes fixed before you looked at the historical cases or tuned on them, and if tuned, does your own methodology flunk your own degeneration test?
      *   *Likely Answer:* "It was an iterative process of reflective equilibrium."
      *   *Follow-up:* "If the method was adjusted to fit the data, can it independently validate the data?"

  8.  **Corroboration Paint Job:** A critic might say this is just a measure of average corroboration with a Lakatosian paint job; what would we actually lose if we dropped the vocabulary entirely and just counted successful predictions?
      *   *Likely Answer:* "We lose the ability to distinguish between progressive problem-shifts and lucky guesses."
      *   *Follow-up:* "Can you cash out 'progressive problem-shift' without using the score itself as the definition?"

  9.  **Licensing Abandonment:** If a programme scores negative, what does that license anyone to do—should funding be cut, or is it just a historical label?
      *   *Likely Answer:* "It's a signal for caution and increased scrutiny, not an automatic defunding."
      *   *Follow-up:* "If it doesn't license action, what work is the 'degenerating' label doing beyond insult?"

  10. **The Roar Back:** If a programme scores negative for twenty-five years and then comes roaring back with a major discovery, is that a counterexample to your theory or a vindication of the moving average?
      *   *Likely Answer:* "The moving average is designed to smooth out temporary fluctuations."
      *   *Follow-up:* "So a twenty-five year fluctuation is noise, but a twenty-year degeneration is signal—where is that line justified?"

  11. **The Graceful Exit:** Many critics suggest this metric is a tool for reconstructing the past, not a decision rule for working scientists; will you take that exit, and what does the book give up if you do?
      *   *Likely Answer:* "I am willing to concede it is primarily diagnostic for historians."
      *   *Follow-up:* "If it's only diagnostic, why prescribe a specific threshold for degeneration rather than a continuous scale?"

  12. **Falsifying the Operationalization:** Finally, what would count as evidence against your operationalization specifically, not against Lakatos: what pattern of historical verdicts would make you revise the weights, and what pattern would make you abandon the project?
      *   *Likely Answer:* "If widely accepted progressive programmes consistently scored negative."
      *   *Follow-up:* "Which specific programmes are your red lines—if your metric condemns them, is the metric broken?"

  ***

  **Wiggle Room Analysis**
  She is best equipped to wiggle out of **Question 7 (Overfitting)** and **Question 11 (Graceful Exit)**. On Q7, she will likely invoke "reflective equilibrium"—a standard philosophical move that blurs the line between "tuning to fit" and "refining to understand." She'll argue the weights weren't *data-dredged* but *conceptually clarified* through the cases, which is hard to disprove on a podcast without getting bogged down in methodology. On Q11, she can straddle the line between "diagnostic" and "prescriptive." She'll likely say it's "normative guidance" rather than "decision rule," allowing her to keep the prescriptive threshold (which makes the book exciting) while dodging the charge that scientists should actually abandon fields based on it. To pin her down, demand a binary choice: "Is it a rule or a story?" and "Did the weights change *after* you saw the Mendel score?"
