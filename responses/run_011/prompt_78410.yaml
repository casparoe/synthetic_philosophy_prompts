answer: |-
  The consent form was laminated, which meant it could be wiped down if a driver drooled on it, though nobody ever did. It sat on the counter next to the tablet station, weighed down by a mug of tea that had developed a skin somewhere during the second hour of the shift. The text was bold where it needed to be: **BY SIGNING, YOU ACKNOWLEDGE THAT SOMNASYNC™ GENERATED NARRATIVES ARE FOR WELLNESS TRACKING ONLY AND DO NOT CONSTITUTE MEDICAL ADVICE OR FACTUAL RECORDS OF CONSCIOUS EXPERIENCE.**

  Leo rubbed his eyes. It was 03:47. The drivers called this stretch the "Grey Hour," the time when the motorway noise dropped to a hum and the fluorescent lights in the bunkhouse started to buzz like insects trapped in glass. His job was simple: wake the client at the forty-minute mark, hand them the tablet, and transcribe their verbal report into the field marked *User Verification*. The app did the heavy lifting. It took the physiological trace—the REM spikes, the heart rate variability, the twitch data—and spun it into prose. Smooth, plausible, oddly good ones. Most drivers didn't dream, or claimed they didn't. The app gave them something to take home to their wives, something that proved they'd been asleep deeply enough to qualify for the insurance discount.

  Bay 2 woke up first. A woman hauling refrigerated goods to Glasgow. She sat up, rubbing the sleep from her face, and took the tablet.

  **TRANSCRIPT 042-B // USER: J. HENDERSON**
  **STATUS: SYNC COMPLETE**
  **TEXT:** I was standing in a field. The grass was wet. I was looking for a key.
  **EDIT:** I was standing in a field ~~of grass~~. The grass was wet [[cold]]. I was looking for a key [[in the mud]].
  **EDIT:** I was standing in a field. The grass was wet. I was looking for a key. ~~It was my house key.~~ [[It was brass.]]

  Leo typed as she spoke. She frowned at the screen. "It says I was looking for a key in the mud. I don't remember the mud."

  "Physio trace suggests high resistance movement," Leo said, reading the tooltip. "Walking through viscous material. Mud is the closest semantic match."

  "Right," she said. She tapped *Accept*. "Feels right now, though. Definitely mud."

  She left to pay at the kiosk. Leo took a sip of the skinned tea. It tasted like iron. He checked the queue. Bay 4 was next. The light above the door was green, meaning the cycle was complete, but the occupant hadn't triggered the exit sensor.

  Leo walked down the corridor. The carpet was industrial grey, stained with things that didn't come out during the nightly vacuum. He knocked on Bay 4.

  "Shift's up, mate."

  The door opened. The driver was older, wearing a high-vis vest over a thermal shirt. He had a bad knee; Leo could hear the brace creak when he shifted his weight. Name tag said MILLER. Route was Dover to Preston, looping back.

  "Forty minutes?" Miller asked. His voice was gravel.

  "Forty-one. You're over by a minute. System let it slide."

  Miller stepped out into the corridor. He looked at the tablet Leo was holding. "Did I go under?"

  "Trace is solid. REM density is high. App generated a full narrative."

  Miller took the tablet. He scrolled through the welcome screen, the wellness slogan (*Rest Better, Drive Safer, Live Longer*), and opened the report. He stopped scrolling. He looked at Leo, then back at the screen.

  "It's already filled," Miller said.

  "Syncs while you sleep. You just need to verify."

  "No," Miller said. "I mean the text box. The verification box."

  Leo looked. Usually, the *User Verification* field was blank, waiting for Leo to type what the driver said. This one was populated.

  **TRANSCRIPT 044-B // USER: R. MILLER**
  **STATUS: SYNC COMPLETE**
  **TEXT:** I am walking down a hallway. The walls are blue. They are made of brick. I am running. The floor is tiled but it feels like carpet. I check my watch. The hands are spinning backwards. I am not moving but the hallway is getting longer.
  **EDIT:** I am walking down a hallway. The walls are blue. They are made of brick [[painted blue]]. I am running. The floor is tiled but it feels like carpet. I check my watch. The hands are spinning backwards. I am not moving but the hallway is getting longer. [[There is a door at the end. It is locked.]]

  Leo felt a cold spot open up in his stomach. "That's… that's weird. Glitch in the upload."

  Miller was reading the screen. His eyes moved left to right, steady. "I was in a hallway," Miller said.

  "That's what it says."

  "The walls were blue."

  "Brick," Leo corrected, pointing at the edit log. "Painted blue."

  Miller nodded slowly. "Right. Painted brick. I remember that now. The texture was rough." He scrolled down. "And the watch. I looked at my watch."

  "In the dream?"

  "In the dream." Miller held up his left hand. He looked at his wrist. He wasn't wearing a watch. He stared at the bare skin for a long moment, then flexed his fingers. He counted them. One, two, three, four, five. He looked at Leo. "Five fingers."

  "Standard issue," Leo said.

  "I checked the time," Miller said, ignoring him. "In the dream. The hands were spinning. But I knew what time it was. It was four o'clock."

  "It is four o'clock."

  Miller handed the tablet back. "Put it in the log."

  "I can't submit a pre-filled verification. System'll flag it. I have to type what you say."

  "I'm saying what's on the screen," Miller said. He rubbed his knee. The brace squeaked. "Put it in. I've got a schedule. If I don't verify, the app marks the sleep as non-restorative. My insurance goes up."

  Leo tapped the screen. He highlighted the text in the verification box. He pretended to type, hitting random keys that auto-corrected to match the existing text. The system accepted it. **UPLOAD COMPLETE.**

  "Did you feel rested?" Leo asked.

  "I feel like I was there," Miller said. "That's the thing. Usually, it's like watching a film of someone else. This time… I was there. The smell of the paint. Wet plaster."

  "The app uses biometric data to infer sensory details," Leo recited. "Olfactory centers light up during REM."

  "Right," Miller said. He didn't move toward the exit. He was looking at Leo's hands. "You count your fingers sometimes? When you're working the night shift?"

  Leo looked at his own hands. They were pale under the fluorescent buzz. He spread them out. Ten fingers. He made a fist. He opened them again. Ten. "Every now and then."

  "Does it help?"

  "Help with what?"

  "Knowing you're here." Miller gestured at the corridor, the laminated forms, the tea mug on the counter visible through the glass partition. "Knowing this isn't the other thing."

  "This is the job," Leo said.

  "Is it?" Miller shifted his weight. The knee cracked. "I had a dream once where I was working a job like this. Waking people up. Only the people waking up were me. Different versions. Some had beards. Some were missing teeth. I woke up and I checked my face. No beard. All teeth. I drove home."

  "And now?"

  "Now I'm here." Miller took the tablet back from Leo's loose grip. He looked at the screen one more time. The text was static. **I am walking down a hallway.** "You keep the logs?"

  "University gets them. Anonymized."

  "Right." Miller handed the tablet back finally. "Keep an eye on Bay 4. Sometimes the door sticks."

  "It's automatic."

  "Nothing's automatic," Miller said. He turned and walked toward the exit. The automatic door sensed him and slid open. The night air rushed in, cold and smelling of diesel. Miller didn't look back. He walked to his truck, climbed in, and started the engine. The lights flicked on, cutting through the dark of the car park.

  Leo stood in the doorway until the taillights disappeared onto the motorway. He went back inside. The tablet was still in his hand. He opened the admin panel. He pulled up Transcript 044-B. He looked at the timestamp for the *User Verification* field.

  **ENTRY TIME: 03:58:12**
  **WAKE TIME: 04:01:05**

  The verification had been logged three minutes before Miller woke up.

  Leo looked at the text again. **The walls are blue. They are made of brick.** He highlighted *brick*. He deleted it. He typed *concrete*. He saved the change. The system didn't flag it. The version history updated.

  **EDIT:** The walls are blue. They are made of brick [[concrete]].

  He stared at the screen. The cursor blinked. It was a steady, rhythmic pulse. Like a heart rate monitor. Like a light blinking in the dark, red then green, red then green, and the brain filling in the colour change in the middle where there was only nothing.

  Leo put the tablet down. He picked up his tea. The skin had broken while he was at the door. He stirred it with a plastic stirrer. The spoon clinked against the ceramic. He counted the sound. One. Two. Three.

  He went to wake Bay 5.

  ***

  The draft leans toward the notion that nothing occurred in the night; the machine supplied the artifact, and the driver's memory conforming to it is the final step of the construction. The tipping detail would be a server log showing the text generation timestamp predating the physiological REM spike, proving the narrative caused the brain activity rather than recording it. That is not a detail the characters could ever get their hands on, as the university owns the encryption keys and the drivers only see the wellness interface.
