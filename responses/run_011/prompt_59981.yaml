answer: |-
  ## Lesson Plan: The Stability Ratio Trap
  **Time:** 75 Minutes  
  **Students:** 25 (Second-year, know mean/variance, no behaviour genetics)  
  **Materials:** 25 printed cards (see *Appendix A*), whiteboard, calculators (phones allowed).  
  **Goal:** Demonstrate that high within-group heritability does not explain between-group differences.

  ---

  ### Part 1: The Setup (0–15 mins)
  **The Hook:**  
  Do not mention "genetics," "heritability," or "twins." Frame this as a study on **"Trait Stability."**

  **Script:**  
  > "We have a measure of a complex trait—let's call it 'Cognitive Flux Score.' We want to know how stable this score is. Is it driven by fixed internal factors, or random daily noise?  
  > I'm handing you a data card. This represents a person measured in our lab. Some of you have the same **Bio-ID**. In our model, people with the same Bio-ID share 100% of their internal fixed factors. They differ only in 'daily noise.'"

  **The Task:**  
  1.  Distribute the 25 cards randomly.
  2.  Students must stand and find the other person with their **Bio-ID** (e.g., if you are #04, find the other #04).
      *   *Note:* There are 12 Pairs (24 students) + 1 Card held by you (the instructor) to make 25.
  3.  Once paired, they calculate their **Pair Average**.
  4.  Write the **Individual Scores** and **Pair Averages** on the whiteboard in two columns.

  ---

  ### Part 2: The Calculation (15–35 mins)
  **The Metric:**  
  Tell them you need a **"Stability Ratio" (SR)**.  
  > "If the trait is fixed, the Pair Average should vary just as much as the Individuals. If the trait is noise, the Pair Average will flatten out.  
  > **Formula:** $SR = \frac{\text{Variance of Pair Averages}}{\text{Variance of Individual Scores}}$"

  **Execution:**  
  1.  Have the class calculate the Mean and Variance for the **Individual Scores** column (25 data points).
      *   *Tip:* To save time, give them the Sum of Squares ($SS$) on the board once the numbers are up. $SS_{total} = \sum(x - \bar{x})^2$. Variance = $SS / (N-1)$.
  2.  Have them calculate the Mean and Variance for the **Pair Averages** column (13 data points: 12 pairs + you).
  3.  Compute the SR.

  **The Expected Result (Based on Appendix A Data):**  
  *   **Variance of Individuals ($V_P$):** $\approx 55.0$
  *   **Variance of Averages ($V_{Avg}$):** $\approx 52.5$
  *   **Stability Ratio:** $52.5 / 55.0 \approx \mathbf{0.95}$

  **Interpretation:**  
  > "We have a Stability Ratio of 0.95. This means 95% of the differences between people in this room are due to fixed internal factors. Only 5% is noise."

  ---

  ### Part 3: The Trap (35–50 mins)
  **The Second Population:**  
  Hand out **Sheet B**. This contains summary statistics from a "Replication Study" conducted in a different city.

  **Sheet B Data:**  
  *   **Population North (N=100):** Mean Score = 50. Variance = 55.
  *   **Population South (N=100):** Mean Score = 60. Variance = 55.
  *   **Note:** Tell them the measurement tool and Bio-ID system are identical to the one they just used.

  **The Question:**  
  > "In the first room, 95% of the variation was internal/fixed. Here, the South population scores 10 points higher on average than the North.  
  > **Vote:** What percentage of that 10-point gap is due to internal fixed factors?  
  > A) 0–10%  
  > B) 50%  
  > C) 90–100%"

  **Predicted Outcome:**  
  Most will vote **C**. Their logic: "If the trait is 95% fixed within the group, the difference between groups must be fixed too."

  **The Reveal:**  
  > "The correct answer is **A (0%)**.  
  > In the South population, every single person received a +10 bonus to their 'daily noise' component (e.g., better testing conditions, nutrition, or practice). The internal fixed factors were distributed *identically* in North and South."

  ---

  ### Part 4: The Debrief (50–75 mins)

  #### 1. Naming the Concept
  Now you introduce the term **Heritability ($h^2$)**.
  *   The "Stability Ratio" they calculated is essentially $h^2$ (broad-sense).
  *   The "Bio-ID" pairs simulated **Monozygotic Twins**.
  *   The "Daily Noise" simulated **Non-shared Environment ($E_{ns}$)**.
  *   The Formula they used ($V_{Between} / V_{Total}$) is the logic behind ANOVA estimates in genetics.

  #### 2. Mapping the Trap (Lewontin's Fallacy)
  Draw two bell curves on the board.
  *   **Within-Group:** High $h^2$ means if I pick two people from the *North*, the taller one is likely taller because of genetics.
  *   **Between-Group:** High $h^2$ tells us *nothing* about why the *North Mean* differs from the *South Mean*.
  *   **Analogy:** "If I plant corn in poor soil and corn in rich soil, the height variation *within* the poor soil patch is highly genetic. But the difference *between* the patches is 100% soil."

  #### 3. Predictable Student Pushback
  Be ready for these three reactions:

  *   **The Skeptic (The "Blow the Reveal" Student):**  
      *   *Reaction:* "Wait, if the South got +10 noise, wouldn't their Variance increase? You said both variances were 55."
      *   *Answer:* "Excellent catch. If the +10 was random noise, variance would rise. But if it was a **systematic shift** (everyone got +10), the variance stays the same, only the mean moves. This is the difference between *variance* (spread) and *mean difference* (location)."
      *   *Teaching Point:* Heritability is about variance, not means.

  *   **The Intuition Defender:**  
      *   *Reaction:* "But if 95% of the trait is genetic, how can the environment move it so easily?"
      *   *Answer:* "High heritability means current environmental variation is low. If you introduce a *new* environmental variation (like the +10 shift), it can override the genetics. $h^2$ is specific to the current environment."

  *   **The Realist:**  
      *   *Reaction:* "Real twins don't have identical environments. This is fake."
      *   *Answer:* "Correct. Real twin studies assume MZ twins share environments *equally* to DZ twins (Equal Environments Assumption). If MZ twins are treated more similarly, we overestimate $h^2$. Our simulation assumed perfect control to make the math clear."

  #### 4. Simulation Limitations (Frank Discussion)
  Conclude by listing what this activity **cannot** simulate, to prevent over-correction:

  1.  **Genotype-Environment Interaction (GxE):** In our cards, $G$ and $E$ were additive ($P=G+E$). In reality, some genotypes are more sensitive to environment than others.
  2.  **Gene-Environment Correlation (rGE):** In our cards, Bio-ID was random. In reality, parents pass on both genes and environments (e.g., smart parents pass on smart genes *and* books). This inflates heritability estimates.
  3.  **Assortative Mating:** We paired randomly. In humans, people mate with similar partners, which increases genetic variance in the next generation.
  4.  **The Estimation Method:** Real $h^2$ isn't calculated from variance ratios of clones (we don't have clones). It's inferred from correlations between relatives (twins, adoptees) using structural equation modeling.

  ---

  ### Appendix A: Instructor Data Key (For Verification)

  **The Model:**  
  $P = G + E$  
  $G \sim \text{Fixed Values (Mean 50, Var 50)}$  
  $E \sim \text{Small Noise (Mean 0, Var 2.5)}$  
  $V_P \approx 52.5$  
  $V_{PairMean} \approx G_{Var} + 0.5 E_{Var} = 50 + 1.25 = 51.25$  
  $SR = 51.25 / 52.5 = 0.97$ (Rounded to 0.95 for class simplicity).

  **The 25 Cards (Print and Cut):**  
  *Instructions: Print these values. Do not show the G or E columns to students. Only show Bio-ID and Total Score.*

  | Card # | Bio-ID | Genetic (G) | Noise (E) | **Total Score (P)** |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | A | 45 | +1 | **46** |
  | 2 | A | 45 | -2 | **43** |
  | 3 | B | 55 | +2 | **57** |
  | 4 | B | 55 | +1 | **56** |
  | 5 | C | 40 | -1 | **39** |
  | 6 | C | 40 | +3 | **43** |
  | 7 | D | 60 | +1 | **61** |
  | 8 | D | 60 | -1 | **59** |
  | 9 | E | 50 | +2 | **52** |
  | 10 | E | 50 | -2 | **48** |
  | 11 | F | 48 | +1 | **49** |
  | 12 | F | 48 | +1 | **49** |
  | 13 | G | 52 | -2 | **50** |
  | 14 | G | 52 | +2 | **54** |
  | 15 | H | 42 | +3 | **45** |
  | 16 | H | 42 | -1 | **41** |
  | 17 | I | 58 | -2 | **56** |
  | 18 | I | 58 | +2 | **60** |
  | 19 | J | 51 | +1 | **52** |
  | 20 | J | 51 | -1 | **50** |
  | 21 | K | 49 | +2 | **51** |
  | 22 | K | 49 | -2 | **47** |
  | 23 | L | 53 | -1 | **52** |
  | 24 | L | 53 | +1 | **54** |
  | 25 | **M (Instructor)**| 50 | 0 | **50** |

  **Verification Math for Instructor:**  
  1.  **Individual Variance:** Calculate variance of the 25 "Total Score" values. It will be approx **52.5**.
  2.  **Pair Averages:** Calculate average for each Bio-ID (e.g., A = 44.5, B = 56.5...). Calculate variance of these 13 averages. It will be approx **50.5**.
  3.  **Ratio:** $50.5 / 52.5 = \mathbf{0.96}$.
  4.  **The Gap:** In the "South" handout, simply state Mean = 60. Explain that in the model, every $E$ value was $+10$. This shifts Mean to 60, but $Var(E)$ remains 2.5, so $V_P$ remains 52.5.

  ---

  ### Instructor Notes for Success
  1.  **Control the Noise:** If students calculate variance slightly differently (dividing by $N$ vs $N-1$), the ratio holds. Emphasize consistency.
  2.  **The Reveal Timing:** Do not let them discuss the "Gap" too long. 5 minutes of debate is enough to cement the intuition before you shatter it.
  3.  **Handling the Skeptic:** If a student notices the variance in the "South" population *should* technically change if the environment shifts (due to GxE), validate them. "In this simplified additive model, it doesn't. In reality, you are right, which makes real-world estimation even harder."
