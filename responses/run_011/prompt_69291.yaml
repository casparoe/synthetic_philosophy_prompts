answer: |-
  You're stuck because your postdoc friend has constructed a very tight verificationist trap. He's essentially taken Ned Block's distinction between Phenomenal Consciousness (P-consciousness) and Access Consciousness (A-consciousness) and used Global Workspace Theory (GWT) to argue that P-consciousness is an empty set.

  The argument is seductive because it wears the clothes of empirical rigour. It says: "If you can't measure it, report it, or use it, it isn't there." That sounds like good science. But it's actually a metaphysical claim disguised as methodological hygiene.

  Here is where you should dig your heels in, why it looks innocent, and what it costs you to dislodge it.

  ### The Linchpin: Steps (2) and (3)

  The damage is being done in premises (2) and (3).

  > (2) If some content were experienced without being available in that way, then for the subject it would be indistinguishable from content that wasn't experienced at all...
  > (3) Where two situations could not differ in any respect, there is no fact of the matter about which of them obtains.

  These are verificationist premises. They assert that the *reality* of a mental state is exhausted by its *functional availability*. If a state doesn't make a difference to what you can say, do, or think, then (2) and (3) conspire to say it doesn't exist.

  **Why they look innocent:**
  They look like basic scientific common sense. In physics, if two theories predict exactly the same observations, we usually say there's no fact of the matter about which is true (underdetermination). Your friend is applying this to the mind: if 'rich experience without access' and 'no experience without access' result in the exact same reports and behaviours, why posit the extra baggage of 'rich experience'? It looks like Occam's Razor.

  **Why you should reject them:**
  You reject them because they define consciousness *out* of existence by fiat. They assume that the only way for consciousness to be real is for it to be *useful* to the reasoning systems.

  If you reject (2) and (3), you are asserting that there can be a fact of the matter about what it is like to be you, even if you cannot report it, reason from it, or act upon it. This is the core of the 'Overflow' position (championed by Block).

  **The Price You Pay:**
  If you block the move at (2) and (3), you are signing up for the following:

  1.  **Philosophical Zombies:** If consciousness isn't defined by function (access/report), then it is logically possible to have a system that functions exactly like a human (accesses information, reports, reasons) but has no inner light. It's all dark inside. By rejecting (2)/(3), you admit this is a coherent possibility. Your friend will say this is absurd; you have to say it's metaphysically possible, even if not actual.
  2.  **Inverted Spectra:** Similarly, if consciousness isn't fixed by functional role, two people could function identically (call grass 'green', stop at red lights) but have swapped qualia (one sees red where the other sees green).
  3.  **Epiphenomenalism Worry:** If P-consciousness (the rich experience) outruns A-consciousness (the access), what is the extra bit *doing*? If it doesn't affect report or action, is it just a decorative sidebar? You need to argue that P-consciousness provides the *reservoir* from which A-consciousness draws. It has a causal role in *feeding* the workspace, even if the unaccessed parts don't directly cause speech.

  ### The Status of Global Workspace Theory (Step 1)

  You mentioned you're happy to grant the Global Workspace picture. You can keep it, but you must demote it.

  Your friend is using GWT as a theory of *Consciousness*. You should treat it as a theory of *Access*.

  If you reject (2) and (3), Step (1) becomes false as stated. It should read: "A mental state is *access* conscious only if its content is globally broadcast."
  GWT explains how information becomes available for report and control. It does not necessarily explain the generation of qualia. There are competing neuroscientific models, like Recurrent Processing Theory (Lamme), which suggest that local recurrent loops in the visual cortex generate phenomenology *before* global broadcast occurs.

  **Do you lose GWT?**
  No. You just stop it from doing more work than it can handle. GWT remains the best explanation for *why* we can talk about our minds. It just stops being an explanation for *why it feels like something* to have a mind. This is a concession, but it's a honest one. It prevents the theory from refuting itself in step (9).

  ### Saving the Data and the Phenomenology (Steps 6, 7, and 9)

  This is where you get what you want: keeping the partial-report data (6) without accepting the sparse world (8) and without calling your intuition a lie (9).

  **The Move:**
  Accept (6) (Sperling's data shows high capacity).
  Reject the inference to (8).
  The postdoc says the high-capacity store is *unconscious* iconic memory.
  You say the high-capacity store is *phenomenally conscious* but *pre-access*.

  When you look at the grid of letters, you *do* experience all of them phenomenally. That is the richness. But that information decays rapidly (within milliseconds). Only the cued row gets into the Global Workspace (Access) before it vanishes.

  **Why this saves (9):**
  It validates your intuition that the room looks filled-in. The periphery *is* experienced phenomenally (you can feel the presence of objects), but it is not accessed (you cannot report the details unless you look). The 'filled-in' feeling is the high-capacity phenomenal store. The 'sparse' report is the bottleneck of the workspace.

  **What work is phenomenology doing?**
  If you ask what the unaccessed phenomenology is *for*, you can say it allows for rapid orienting. You don't need to access the hum of the fridge to experience it, but if the hum stops, the *change* might grab access. The rich field acts as a monitoring system. It's not epiphenomenal; it's the input buffer for the workspace.

  ### Summary of the Counter-Argument

  Here is how you can put this to the group on Thursday, without waving a reading list around:

  1.  **Challenge the Verificationism:** Tell him steps (2) and (3) assume that existence requires reportability. That's a philosophical claim, not a scientific fact. Science measures correlates, but it doesn't get to define the ontology of experience out of existence just because it's hard to measure.
  2.  **Distinguish P and A:** Grant him GWT as a theory of *Access* (reporting, reasoning). Deny him GWT as a theory of *Phenomenality* (feeling).
  3.  **Reinterpret the Data:** Use Sperling (6) to prove Overflow, not underflow. The fact that we can report more when cued *after* the display disappears suggests the information was held in a conscious state that decayed before it could be accessed. If it were unconscious, cueing shouldn't help as much as it does.
  4.  **Accept the Cost:** Admit you're willing to live with the possibility of zombies or inverted spectra if that's what it takes to preserve the reality of your own experience. Tell him you'd rather be a realist about qualia than a behaviourist about mind.

  **The Bottom Line:**
  Your friend is biting the bullet on (9) because he thinks it's the only way to be a good naturalist. You can be a good naturalist and reject (2) and (3). You just have to accept that consciousness is not wholly transparent to scientific third-person methods. There is a 'what it is like' that exceeds 'what we can do with it'.

  If you let him keep (2) and (3), he wins, and you're left living in a sparse void. If you knock those out, GWT survives as a theory of access, the data stays intact, and your kitchen remains a richly filled room.
