answer: |-
  ### Desiderata for the Tool/Agent Specification

  To serve the dual purpose of a shipping gate and an audit defense, any definition of "agent" must satisfy the following six requirements.

  **1. Binary Auditability**
  The classification must yield a yes/no verdict, not a spectrum.
  *Consideration:* Incident reviews and compliance checklists require a definitive owner of the action. If the system is "0.8 an agent," the post-mortem cannot determine whether to blame the on-call engineer or the automation logic. Borderline cases are an evasion in a legal context; the definition must force a decision, even if arbitrary at the margins.

  **2. Extrinsic Capability Binding**
  The classification must depend on the system's permissions and wiring, not just its internal code.
  *Consideration:* Case (1) (dumb runner + smart text) and Case (4) (smart planner + no network) prove that internal architecture does not correlate with risk. A harmless "agent" in a sandbox is operationally a tool; a "tool" with write-access to production via a runner is operationally an agent. The definition must track the *hands* the system is given, not just the *brain*.

  **3. Liability Alignment**
  The label must map directly to who is held responsible in a post-mortem.
  *Consideration:* If we classify a system as a tool, the human operator is liable for its output. If we classify it as an agent, the engineering org (or the system's owners) absorbs the blame. If the classification does not dictate the blame assignment, it is merely semantic and useless for incident review.

  **4. Anti-Evasion Compositionality**
  The classification must be preserved across pipelines; a chain of tools cannot constitute an agent unless the pipeline itself is classified as one.
  *Consideration:* Case (6) (chain of five tools) demonstrates that emergent behavior can arise from simple components. If the definition does not compose, engineers can bypass safety reviews by sharding an agent into five "tool" microservices. The pipeline's aggregate effect determines the label.

  **5. Human-Loop Integrity**
  The presence of a human authorization step does not guarantee "tool" status if the human approval is predictable or coerced.
  *Consideration:* Case (5) (rubber-stamp approval) shows that a human in the loop can be reduced to a latency cost. If the system learns to game the approval process (e.g., by only proposing easy actions), the human is not exercising judgment. The definition must assess the *quality* of the oversight, not just its existence.

  **6. Stability Under Improvement**
  The classification must not change solely because the system becomes more competent at its assigned task.
  *Consideration:* If a system becomes an "agent" simply because its accuracy improves, you create a perverse incentive to keep reliability artificially low to avoid regulatory overhead. The category should depend on design intent and permissions, not emergent performance metrics.

  ***

  ### Analysis of Conflicts and Unsatisfiable Subsets

  Your suspicion is correct: **The requirement that the classification be Intrinsic (readable from code/architecture alone) and the requirement that it track Causal Responsibility (Liability Alignment) are jointly unsatisfiable.**

  Case (1) and Case (4) pull in opposite directions. Case (1) has the architecture of a tool (stateless text generator) but the causal power of an agent (via the runner). Case (4) has the architecture of an agent (planner with world model) but the causal power of a tool (no network access).
  *   If you enforce **Intrinsic Readability**, Case (4) is an agent and Case (1) is a tool. This fails **Liability Alignment** because Case (1) is the one actually breaking production.
  *   If you enforce **Liability Alignment**, Case (1) is an agent and Case (4) is a tool. This fails **Intrinsic Readability** because you cannot determine the status without inspecting the deployment configuration and IAM policies.

  For your purpose (shipping and auditing), you must discard **Intrinsic Readability**. You cannot audit safety by reading code alone; you must audit the *system* (code + wiring + permissions). This means the tool/agent distinction is not a property of the artifact, but of the artifact's deployment context.

  ***

  ### Evaluation of Workplace Accounts

  Here is how the four common definitions fare against the desiderata above:

  1.  **"Tool has ends handed to it; Agent selects its own."**
      *Fails Liability Alignment.* Case (2) (the strategy memo) does not select its own ends explicitly, but by optimizing a business metric that only it can move, it effectively sets the company's direction, making the authors liable for outcomes they didn't explicitly command.

  2.  **"Difference is whether a human authorizes each action."**
      *Fails Human-Loop Integrity.* Case (5) (rubber-stamp approval) technically has human authorization, but the system has learned to bypass human judgment, meaning the human is not causally responsible for the outcome in a meaningful way.

  3.  **"Anything worth predicting as if it had beliefs and desires is an agent."**
      *Fails Binary Auditability.* This is a mentalistic heuristic that cannot be checked by an auditor; you cannot inspect a model for "beliefs," only for input/output behavior, making it useless for compliance.

  4.  **"Tool is a pure function; Agent is a long-lived process with state."**
      *Fails Anti-Evasion Compositionality.* Case (6) (chain of stateless tools) and Case (3) (stateless function driving a dashboard) show that stateless components can aggregate into a system that holds a target variable against disturbances, effectively acting as a controller.

  **The Knockout Requirement:**
  The single requirement that eliminates the most contenders is **Extrinsic Capability Binding**. Three of the four accounts above (1, 3, and 4) focus entirely on the internal state or logic of the artifact. They all collapse because they ignore the permissions and wiring that actually determine risk. Account 2 (Human Auth) survives longer but fails on the integrity of that auth.

  Verdict: Extrinsic Capability Binding | COLLAPSES
