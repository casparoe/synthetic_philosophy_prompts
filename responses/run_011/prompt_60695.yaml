  OmniSure Indemnity
  Claim Ref: 9942-KF
  Date: October 14, 2023

  Dear Mr. Basri,

  We appreciate your patience during our review of the fire loss at your residence. We understand the distress this disruption causes and strive to make the resolution process as smooth as possible within the bounds of ontological truth.

  Following our adjustment visit, we must inform you that your claim falls outside the schedule of covered perils. Your submission attributes the loss to a malfunctioning toaster. However, under Section 12.C (Causal Agency), coverage requires demonstration that a created entity possesses the inherent power to effect change. As established in universal precedent and accepted metaphysical statute, created substances possess no causal efficacy. The toaster does not burn; the Divine Agent creates the accident of combustion concurrent with the presence of the toaster, according to Habitual Custom.

  Our actuarial models rely firmly on this Custom. Our actuaries treat the Divine Custom as rock solid for risk modeling, yet this solidity describes regularity, not agency. We price premiums based on the reliability of sequence, not the existence of necessary connection. While fire consistently follows the activation of heating elements, this regularity reflects Divine Habit, not mechanical causation. Therefore, the loss is classified as a Direct Volition event. Per your policy, all Direct Volition events are excluded as Acts of God. Since all events are Acts of God, this exclusion applies universally, subject only to specific riders you did not purchase.

  You have indicated in three separate communications that the toaster "caused" the fire. We must remind you that asserting causal power in created things is not merely a coverage violation but a category error. Our adjuster, Mr. Henderson, notes with growing concern your continued insistence on proximate material cause despite previous explanations. This impedes the assessment. We cannot process a claim based on a mechanism that does not exist. Mr. Henderson specifically requests you cease citing observed sequence as proof of nature. We observe the sequence; we deny the nature. The distinction is material to your coverage.

  Furthermore, regarding subrogation: had we indemnified this loss, we would seek recovery from the responsible party. Since no created party is responsible, subrogation rights are null. We cannot pursue recovery against the Primary Agent. Litigation against the Will that sustains the universe is not permitted under state law. There is no third party to sue.

  To reconsider, please provide empirical proof that the toaster possesses independent causal power. Absent this, the determination stands. We remain available to discuss this at 1-800-555-0199. Please note wait times are extensive as all agents are currently engaged in similar theological consultations.

  Sincerely,
  Claims Department
