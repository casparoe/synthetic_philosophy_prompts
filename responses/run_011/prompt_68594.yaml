      *   **Initial Impression:** This is a strong script. Clear, confident, good textual grasp. Likely 2:1 or low 1st. The confusion on duties in (a) might prevent a high 1st. The response to (b) is sophisticated but perhaps slightly glib on the "end changes" point.

  5.  **Drafting the Assessment:**

      *   **Mark:** The script is very good. Part (a) is solid on CC but wobbly on the implication of CW (saying it yields an imperfect duty *to support practices* is a bit of a stretch for a specific action test, though theoretically grounded). Part (b) is excellent, identifying the Hegel objection and giving the standard Kantian defense (non-arbitrary maxim description).
