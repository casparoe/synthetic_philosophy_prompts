      *   *Re-evaluating (a):* "So the maxim would generate a contradiction in the will as well, and hence an imperfect duty to support the epistemic practices of her field." This is technically confused. If the maxim fails CC, the action is forbidden (Perfect Duty *not* to do it). CW tests usually generate positive duties (Imperfect Duty *to* help others). Saying the *maxim* generates an imperfect duty is odd. The *failure* of the CW test on a maxim of non-beneficence generates an imperfect duty to help. Here, the maxim is about lying/concealing. If it fails CW, it just reinforces the prohibition. The candidate seems to think failing CW generates a *new* positive duty. This is a substantive error in Kantian mechanics.
      *   *Re-evaluating (b):* The response is strong. The "Publicity Test" is from *Theory and Practice* / *Perpetual Peace*, not the *Groundwork* FUL strictly, but often taught together. The core point about maxim description is correct.
