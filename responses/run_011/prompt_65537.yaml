answer: |-
  ### Audit of the Heritability-as-$R^2$ Analogy

  The consulting geneticist's analogy equates heritability ($h^2$) with the coefficient of determination ($R^2$) from a linear regression model. While mathematically grounded in the decomposition of variance, this framing imports semantic commitments from standard regression that do not hold in behavioural genetics. The audit below maps the correspondence, identifies critical breakdowns, and evaluates the three claims defended by the analogy.

  #### 1. Explicit Mapping of Elements

  To evaluate the analogy, we must align the statistical components of a standard regression (e.g., predicting house prices) with the components of a variance-component model used to estimate heritability.

  *   **Outcome Variable:** In the regression, this is the house price. In heritability, this is the phenotypic value (e.g., height or test score). **Correspondence: Exact.** Both are continuous variables whose variance is being partitioned.
  *   **Predictors:** In the regression, these are measured features (square footage, location). In heritability, these are genotypes. However, in most behavioural genetics (twin/family designs), genotypes are not measured directly but inferred as a latent random effect based on relatedness. In GWAS, they are measured SNPs. **Correspondence: Partial.** The latent nature of genetic effects in traditional heritability estimates differs fundamentally from measured fixed effects in standard regression.
  *   **Fitted Model:** In regression, this is the equation linking $X$ to $Y$. In heritability, this is the variance component structure (e.g., ACE model). **Correspondence: Partial.** Both partition variance, but the genetic model often assumes specific covariance structures rather than fitted coefficients for observed variables.
  *   **Sample:** In regression, houses in a specific city. In heritability, individuals in a specific population at a specific time. **Correspondence: Exact.** Both statistics are sample-dependent.
  *   **Residual:** In regression, this is the unexplained variance (error + omitted variables). In heritability, this is labeled "Environment" ($E$) plus error. **Correspondence: Fails.** In regression, the residual is acknowledged as "unexplained." In heritability, the residual is often reified as a coherent causal category ("The Environment"), implying we know what it is, when it is merely "everything that isn't genetic."

  #### 2. Breakdowns and Disanalogies

  The analogy collapses under scrutiny regarding how predictors are treated, the independence of variables, and the stability of the estimate across contexts.

  *   **Latent vs. Measured Predictors:** In the house price model, we know exactly what features were measured. In heritability (particularly broad-sense or twin-based), the "genetic predictor" is a statistical abstraction inferred from resemblance among relatives. It captures additive effects, dominance, and epistasis depending on the model, but it is not a column of data. Treating it like square footage suggests a direct measurability and manipulability that does not exist.
  *   **Independence Assumption:** Standard regression assumes predictors are independent of the residual ($X \perp \epsilon$). In behavioural genetics, gene-environment correlation (rGE) is pervasive: genotypes influence the environments individuals select or evoke. When genes correlate with environment, the variance attributed to "genes" in the model may actually capture environmental effects triggered by those genes. The $R^2$ analogy hides this confounding, implying a clean separation that rarely exists.
  *   **Environmental Range Shifts:** $R^2$ depends on the variance of the predictors. If all houses are the same size, size explains 0% of price variance. Heritability depends on the variance of the environment. If environmental conditions become uniform (e.g., universal nutrition), environmental variance ($V_E$) drops, and heritability ($V_G / (V_G + V_E)$) rises toward 1.0, even if the genetic effect remains unchanged. The house price analogy suggests $R^2$ is a property of the predictor's strength, whereas heritability is inversely sensitive to the uniformity of the "residual" conditions.
  *   **Broad vs. Narrow Sense:** The analogy works best for narrow-sense heritability (additive genetic variance), which parallels additive regression coefficients. However, public explainers often conflate this with broad-sense heritability (including non-additive effects). Non-additive effects do not transmit predictably from parent to offspring, unlike regression coefficients. Using the $R^2$ analogy for broad-sense estimates implies a predictive utility across generations that the statistic does not support.

  #### 3. Imported Commitments

  The regression framing quietly imports three commitments that the variance-component ratio does not carry, misleading the reader about the nature of the "non-genetic" share.

  *   **Positive Characterization of the Residual:** In regression, we acknowledge the residual is "unexplained." The heritability analogy imports the commitment that the non-genetic share is a positively characterized entity ("Environment") rather than a leftover bucket. This leads readers to believe we understand the environmental causes as well as we understand the genetic ones, when often the "environment" term is simply noise plus unmeasured confounders.
  *   **Modifiability of Predictors:** Reporting $R^2$ for house prices implies that changing the predictor (renovating the house) changes the outcome. Applying this to heritability implies that because a trait is "genetic," it is immutable, or conversely, that because it is not 100% genetic, it is easily changed. Neither follows. The regression frame suggests a lever exists for the predictor; in genetics, the "predictor" is fixed for the individual.
  *   **Universality of the Statistic:** $R^2$ is understood by statisticians to be sample-specific, but lay audiences often treat model fit as a universal truth. The analogy reinforces the misconception that heritability is a constant property of the trait (like the speed of light) rather than a population-specific statistic that changes if the population's environmental variance changes.

  #### 4. Evaluation of Claims

  **Claim A: "80 percent genetic" is no more misleading than "model explains 80 percent of variance in house prices."**
  *Verdict: No.*
  The house price statement describes a model's fit to data. The phrase "80 percent genetic" is an ontological claim about the trait's composition, not just variance in a sample. Lay readers interpret "80 percent genetic" as "80 percent of the cause," ignoring the population-specific variance context. The regression analogy masks this reification error by relying on the technical respectability of $R^2$.

  **Claim B: Heritabilities are comparable across traits and populations... so 0.8 is more genetic than 0.4.**
  *Verdict: Qualified.*
  Within the same population and using the same estimation method, a higher $h^2$ indicates a larger proportion of current variance is attributable to genetic differences. However, across populations, this fails. A trait can have $h^2 = 0.8$ in Population 1 (uniform environment) and $h^2 = 0.4$ in Population 2 (variable environment) even if the genetic architecture is identical. The $R^2$ analogy fails here because regression $R^2$ is not typically compared across completely different datasets with different predictor distributions without adjustment.

  **Claim C: Where the estimate is high, environmental policy has little room to move individual outcomes.**
  *Verdict: No.*
  This is the interventionist fallacy. High heritability means current environmental variation contributes little to current phenotypic variation. It does not mean a *new* environmental intervention cannot shift the mean or reduce variance. Phenylketonuria (PKU) is highly heritable, yet dietary intervention prevents the phenotype. The house price analogy fails here because changing house features (genes) is impossible, but changing the environment (policy) is possible; the statistic says nothing about the slope of the reaction norm, only the current spread of data.

  #### 5. Better Analogy

  No single analogy safely captures the nuance of heritability for a public audience without risking new misconceptions. The $R^2$ analogy is mathematically closest but semantically dangerous. The "Seed and Soil" analogy is better for illustrating interaction but worse for explaining the variance ratio.

  **Recommendation:** Abandon the analogy. Instead, describe the statistic directly as a "population variance ratio." Tell non-specialists that heritability measures how much of the *differences* between people in a specific group are associated with genetic differences at that time, emphasizing that it does not measure what causes the trait in an individual, nor does it predict how changeable the trait is.

