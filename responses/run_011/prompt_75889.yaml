answer: |-
  *   **Adèle's Position (The Container):** The electorate must be a fixed group to function. If you define voters by "who is affected," the list never ends (buyers of nickel, future generations, diaspora). The current roll is based on a peace accord that stopped the violence; its legitimacy comes from survival, not perfect democracy. Moving the line risks reopening the wound.
  *   **Tomas's Position (The Circle):** You cannot define the people who decide without already deciding who the people are. He is bound by the outcome (land, laws, burial) but excluded from the choice. The rule excluding him was made by a parliament he didn't elect. The woman behind him is subject to daily law but excluded; he is subject to final law and excluded. Both exclusions reveal the power act beneath the procedure.
  *   **The Woman (The Wedge):** She undermines Adèle (why is she here 11 years and voiceless?) and Tomas (if he gets in based on affect, she has a stronger claim based on daily subjection).
  *   **Register Shifts:**
      1.  *Procedural:* Dates, forms, the fifteen-year cutoff.
      2.  *Personal:* The mother's grave, the land, Adèle's return.
      3.  *Existential/Fear:* The violence that happened before the accord, the risk of it returning if the rules change.
  *   **The Unanswerable Hits:**
      *   Tomas to Adèle: "If it's about who lives under the law, she's in before me."
      *   Adèle to Tomas: "If everyone who loses something gets a vote, the island belongs to the whole world."
  *   **The Ending:** Adèle admits the arbitrariness ("Nobody decided"). The scene ends on the physical act of closing the roll.

  ***

  The fluorescent light hummed, a low insect noise against the silence of the office. Adèle slid the form back across the counter. The plastic surface was scratched, worn smooth where a thousand elbows had rested.

  "It's not a mistake," Adèle said. "You've been away twenty-six years. The cutoff is fifteen."

  "I own land," Tomas said. He didn't raise his voice. He kept his hands flat on the counter, framing the paper. "I pay rates. I pay for my mother's care bed in Saint-Marie. When she dies, I bury her here. When the new state starts, I live under its laws. But I don't get to say yes or no?"

  "You live under the laws of the territory as it stands. That's different."

  "Is it? If they vote yes, I lose the passport I travel on. I lose the right to work in the metropole without a permit. That's a loss. You say the roll is for people with a stake. I have a stake."

  Adèle adjusted her glasses. She was tired. It was the last day, the queue stretched out the door into the humidity, and Tomas was the third person today claiming the rule was a trap. "The stake isn't property, Tomas. It's continuity. The roll was fixed by the Accord. We drew the line so the shooting would stop. We needed a known quantity."

  "The Accord was signed by men with guns and lawyers in suits. None of them asked me."

  "They asked the people who were here. The people who had to stay and live with the aftermath."

  "I'm here now."

  "You're here to bury her. Then you go back."

  "You don't know that."

  "I know the pattern." Adèle tapped the form. "You left at nineteen. You built a life there. You come back when something breaks or someone dies. That's not belonging. That's inheritance."

  Tomas stepped back, letting the woman behind him come into view. She was holding a toddler on her hip, a mainland passport clipped to her shirt. She'd been standing there for twenty minutes.

  "Ask her," Tomas said.

  Adèle looked at the woman. "Ms. Lenoir?"

  "I've been here eleven years," the woman said. Her voice was flat. "My husband works at the plant. I pay taxes. If the law changes, I stay here. I don't have a home elsewhere."

  "She's subject to every law this island makes," Tomas said. "More than me. I'm abroad most of the year. She's here. She breathes the air. If your rule is about who is affected, she gets the vote before I do."

  Adèle looked at the woman, then back to Tomas. "The rule isn't affectedness. It's membership."

  "Defined by who?"

  "By the Accord."

  "Which was voted on by who?"

  Adèle sighed. She reached for the stamp, then stopped. "By the representatives of the people who were here at the time. Who had survived the unrest."

  "So a group of people decided who gets to decide," Tomas said. "And they drew the circle around themselves. They locked the gate. You're asking me to accept that the gate is legitimate because the people inside the gate say it is."

  "I'm asking you to accept that if we open the gate now, it never closes. If everyone who is affected gets a vote, then the metropole gets a vote. The buyers of the nickel get a vote. The people who might move here next year get a vote. There is no edge."

  "There has to be an edge," Tomas said. "But not one that cuts off your own children."

  "You aren't a child. You're a man who chose to leave."

  "I chose to work. I sent money home. Every month. When the plant closed in '98, who paid the nurses? People like me. Now you say I'm not part of the project?"

  Adèle leaned forward. The hum of the light seemed to grow louder. "I came back, Tomas. I was there. I practiced law in the capital for twenty years. I had the safe job. I came home because someone had to build the institutions. And I know what happens when you make the electorate infinite. You get paralysis. You get everyone claiming a veto. We stopped the shooting by agreeing on who counts. If you change the count now, you invalidate the peace."

  "The peace rests on excluding me."

  "The peace rests on a boundary. All boundaries exclude. That's what a border is."

  "But who drew it?" Tomas pressed. "Who gave you the right to say I'm out?"

  Adèle looked at him. For a moment, the bureaucratic fatigue dropped away, and she looked much older. "Nobody gave us the right."

  The room went very quiet. The woman shifted the child's weight.

  "Nobody?" Tomas said.

  "Not in the sense you mean. There was no prior vote to authorize the vote. There was just the blood. There was the understanding that if we didn't fix the list, the killing would start again. We took the power because someone had to hold it. We wore procedure's clothes so you wouldn't see the power underneath. But yes. Nobody decided. We decided."

  Tomas stared at her. He had expected a citation, a clause, a reference to the statute. He had prepared for a wall of text. He hadn't prepared for the void.

  "So it's arbitrary," he said.

  "It's necessary," Adèle corrected. "Arbitrary implies we could have done it differently without cost. We couldn't. If we included the diaspora, the metropole would have vetoed the result. If we included the residents like Ms. Lenoir," she glanced at the woman, "the plant workers would have voted to sell the island to the highest bidder. We needed a people who were tied to the land by history, not just by presence or by profit."

  "Tied by history," Tomas repeated. "So I'm untied."

  "You loosened the knot. Twenty-six years."

  "My mother is dying."

  "I know." Adèle's voice softened, just barely. "I'm sorry for your loss. But the roll closes at five."

  "If I don't vote, I'm bound by a law I didn't make. That's what tyranny is."

  "If you vote, you bind women like her," Adèle said, nodding to the queue, "to a decision you made from three thousand miles away. That's colonialism."

  Tomas looked at the form. He looked at the pen sitting on the counter. He looked at the woman, who was watching him with a flat, exhausted curiosity. She knew she wouldn't get a vote either. She was just waiting to see if the man in front of her would break the machine.

  "You say nobody decided," Tomas said. "So it's just force."

  "It's politics," Adèle said. "It's always force, eventually. The question is whether the force holds."

  "And if it doesn't?"

  "Then we go back to the way it was before the Accord. And you won't want to vote. You'll want to survive."

  She picked up the stamp. It was heavy, black rubber and wood. She inked it. The smell of the pad was sharp, chemical.

  "You can appeal," Adèle said. "There's a commission. They meet in six months. By then the vote will be over."

  "Six months," Tomas said. "So the decision stands."

  "The roll closes."

  "Because you say so."

  "Because I hold the stamp."

  Adèle brought the stamp down on his form. *REFERRED TO COMMISSION.* The ink bloomed into the paper, wet and final. She didn't look at him as she set the stamp back in its tray. She reached for the next form in the pile, the paper sliding with a dry rasp against the desk.
