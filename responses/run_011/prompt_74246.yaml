answer: |-
  **Ground rules**

  This instrument bans seven terms: 'vague', 'borderline', 'sharp', 'determinate', 'truth value', 'precisification', and 'degree'. We substitute them with 'unclear', 'middle cases', 'exact point', 'fixed fact', 'correctness', 'making specific', and 'extent'. This prevents participants from signalling allegiance via terminology rather than intuition. The cost is some technical precision; 'fixed fact' conflates metaphysical and semantic fixation, requiring later questions to disentangle them. The gain is ecological validity: a lawyer unfamiliar with the literature can answer without decoding jargon. All phrasing is passive or case-based to avoid leading the witness. British spelling applies throughout.

  **The questions**

  1.  **Hesitation:** You refuse to call a colour 'red'. Asked whether your refusal is correct, do you refuse again?
      *   A: Yes, I refuse to judge my refusal. (Feeds: Second-order)
      *   B: No, my refusal is the correct stance. (Feeds: No Fact)
      *   C: No, there is a right answer I lack. (Feeds: Fact Exists)
  2.  **Omniscient:** An all-knowing observer watches a heap lose grains. Do they know the exact grain it stopped being a heap?
      *   A: Yes. (Feeds: Epistemic)
      *   B: No, there is nothing to know. (Feeds: Semantic)
      *   C: No, a fact exists but is hidden. (Feeds: Metaphysical)
  3.  **Paint:** Two identical swatches. I won't say if either is 'red', but I bet both match or neither does. Do you take the bet?
      *   A: Yes. (Feeds: Linked)
      *   B: No. (Feeds: Independent)
  4.  **Regulation:** Law says 'temporary' use. Council sets 'temporary = 6 weeks'. Did this find or make a fact?
      *   A: Found a hidden fact. (Feeds: Discovery)
      *   B: Made a new fact. (Feeds: Creation)
  5.  **Comparison:** Patch A is redder than B. Is 'A is red' more correct than 'B is red'?
      *   A: Yes. (Feeds: Scalable)
      *   B: No. (Feeds: Binary)
  6.  **Conversation:** We argue about a colour. Halfway through, does the word mean something different than at the start?
      *   A: Yes. (Feeds: Shifting)
      *   B: No. (Feeds: Fixed)
  7.  **World:** Is the fuzziness in the word or in the paint itself?
      *   A: Word. (Feeds: Semantic)
      *   B: Paint. (Feeds: Metaphysical)
  8.  **Scale Edge:** If a statement is partially correct, is there a fixed fact about *how* partially correct it is?
      *   A: Yes. (Feeds: Bottoming)
      *   B: No. (Feeds: Non-bottoming)

  **The logical space**

  We treat the questions as four dimensions. **Factuality** (Q1, Q2, Q7) divides views into those positing a fixed fact versus those denying one. **Structure** (Q5, Q8) divides binary correctness from scalable extents, and further splits scalable views by whether the scale itself has edges. **Stability** (Q4, Q6) separates views where meaning is fixed from those where it is created or shifts. **Linkage** (Q3) separates views on whether uncertainty correlates across identical cases.

  *   **Epistemicism:** Fact Exists + Binary + Fixed + Linked.
  *   **Supervaluationism:** No Fact + Binary + Creation + Linked.
  *   **Degree (Bottoming):** No Fact + Scalable + Bottoming + Linked.
  *   **Degree (Non-bottoming):** No Fact + Scalable + Non-bottoming + Linked.
  *   **Contextualism:** No Fact + Binary + Shifting + Independent.
  *   **Metaphysical:** Fact Exists (Hidden) + Binary + Fixed + Linked.
  *   **Error Theory:** No Fact + Binary (False) + Fixed + Independent.
  *   **Unnamed:** Combinations not matching above.

  **Empty cells**

  1.  **Fact Exists + No Correctness:** Incoherent. If a fixed fact exists, statements must align with it to be correct.
  2.  **World Unsettled + Stipulation Finds Fact:** Contradictory. If the world is unsettled, stipulation must settle it, not discover it.

  **The tree**

  1.  **Node 1 (Q1):** Does hesitation hesitate?
      *   Yes → Go to Node 2.
      *   No (Refusal correct) → Go to Node 3.
      *   No (Fact exists) → Go to Node 4.
  2.  **Node 2 (Q5):** Is correctness scalable?
      *   Yes → Go to Node 5 (Degree split).
      *   No → **Supervaluationism**.
  3.  **Node 3 (Q6):** Does meaning shift in conversation?
      *   Yes → **Contextualism**.
      *   No → Go to Node 6 (Error vs Supervaluation).
  4.  **Node 4 (Q2):** Does the observer know the fact?
      *   Yes → **Epistemicism**.
      *   No → **Metaphysical Indeterminacy**.
  5.  **Node 5 (Q8):** Is there a fact about the extent?
      *   Yes → **Degree (Bottoming)**.
      *   No → **Degree (Non-bottoming)**.
  6.  **Node 6 (Q7):** Is fuzziness in the world?
      *   Yes → **Metaphysical** (Re-route).
      *   No → **Error Theory**.

  **Scoring key**

  *   **Epistemicism:** Q1(C), Q2(A), Q5(B).
  *   **Supervaluationism:** Q1(B), Q2(B), Q3(A), Q5(B).
  *   **Degree (Bottoming):** Q1(B), Q5(A), Q8(A).
  *   **Degree (Non-bottoming):** Q1(B), Q5(A), Q8(B).
  *   **Contextualism:** Q1(B), Q6(A).
  *   **Metaphysical:** Q1(C), Q2(C), Q7(B).
  *   **Error Theory:** Q1(B), Q2(B), Q5(B), Q7(A), Q4(A).
  *   **Inconsistent:** Any pattern violating Logical Space constraints (e.g., Fact Exists + Scalable). Treat as 'Unnamed' and discuss coherence.

  **What it can't separate**

  The instrument struggles to distinguish **Supervaluationism** from **Contextualism** if a participant answers ambiguously on Question 6. Both views deny a fixed fact prior to specification (Q1-B, Q2-B). Supervaluationism treats the gap as static until a precise line is drawn (creation), whereas Contextualism treats the meaning as fluid during use (shifting). However, in practice, a participant may view 'making a rule' (Q4) and 'shifting meaning' (Q6) as functionally identical acts of clarification. To separate them, one would need a question probing whether the meaning change persists after the conversation ends. Supervaluationism suggests the precisification remains; Contextualism suggests the meaning reverts when the context changes. Without this temporal probe, the tree collapses these branches into a single 'No Fact + Binary' leaf. This is a structural limit: both views occupy the same logical space regarding the existence of facts, differing only on the mechanism of resolution.
