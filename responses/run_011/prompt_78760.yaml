  (a) **Candidate General Rules Consistent with the Record**

  To derive rules that are jointly consistent with the eight prior certifications, we must interpret the variations in procedure not as contradictions, but as applications of different prioritization hierarchies regarding the Gibbard–Satterthwaite exits. The record supports at least three distinct policy frameworks:

  1.  **The "Deterministic Resilience" Rule (The 2021 Precedent).**
      *   *Principle:* For federation-wide binding decisions involving three or more options where domain restriction (single-peakedness) is impossible, certify a Condorcet-consistent deterministic method. Accept that manipulability is inevitable under the theorem, but prioritize a rule that reflects pairwise majorities and resolves cycles transparently. Randomization and dictatorship are reserved for non-binding decisions (2015) or ties (2019).
      *   *Consistency:* Fits 2021 (Condorcet for cities), 2018 (Approval/Condorcet family for prizes), 2023 (Majority is Condorcet-consistent for $n=2$), and 2013/2024 (Median is Condorcet-consistent for 1D). It treats 2015 (Logo) and 2016 (Local Treasurer) as exceptions for low-stakes or local matters.
      *   *Recommendation Logic:* If $n \ge 3$ and not 1D $\rightarrow$ Condorcet.

  2.  **The "Binary Safety" Rule (The 2023 Precedent).**
      *   *Principle:* Strategy-proofness is the overriding value for high-stakes decisions (those involving financial commitment or threat of withdrawal). If the option set cannot be structured as a single dimension (2013, 2024), it must be reduced to two finalists before the membership votes (2023). Manipulation is tolerated only when the choice set is binary (where honesty is dominant).
      *   *Consistency:* Fits 2023 (Editorship narrowed to 2), 2013/2024 (1D effectively allows strategy-proof Median), and 2016 (Dictatorship is strategy-proof, though dispreferred). It treats 2018 and 2021 as cases where the search committee failed to narrow sufficiently, or where the stakes were deemed lower than a journal editorship or assessment rate.
      *   *Recommendation Logic:* If stakes are high and not 1D $\rightarrow$ Require narrowing to $n=2$, then Majority.

  3.  **The "Ex-Ante Auditability" Rule (The 2018 Precedent).**
      *   *Principle:* Since manipulability cannot be eliminated (per counsel), the certified procedure must maximize the visibility of strategic behavior so it can be audited or politically checked. Approval voting is preferred for its simplicity and transparency regarding "withholding" (2018); Condorcet is acceptable if pairwise matrices are published (2021). Randomization is rejected for binding decisions due to indefensibility (2024).
      *   *Consistency:* Fits 2018 (explicitly chosen for auditability), 2021 (switched to Condorcet to make cycle resolution clear), and 2024 (rejected random for defensibility). It treats 2015 as a non-binding exception.
      *   *Recommendation Logic:* If $n \ge 3$ $\rightarrow$ Choose the rule with the most transparent ballot structure (Approval > Condorcet > IRV).

  (b) **Recommendations for the Facility Site Case**

  1.  **Under the "Deterministic Resilience" Rule:**
      *   *Recommendation:* **Certify a Condorcet-consistent method (e.g., Schulze or Ranked Pairs) for the three sites.**
      *   *Reasoning:* This is the direct application of the 2021 Host City precedent. There are three options, domain restriction is impossible (counsel confirmed), and the decision is binding. The rule dictates accepting manipulability as inevitable but choosing the method that best respects majority will.
