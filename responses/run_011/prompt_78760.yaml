      *   *Reasoning:* The threat of withdrawal by a delegation elevates the stakes to the level of the 2023 Editorship. Under this rule, a three-way choice among non-1D options is inherently unsafe for high-stakes federation decisions. The "manipulation has migrated to the shortlisting stage" dissent from 2023 is acknowledged, but the membership vote itself must be strategy-proof.
