      *   *Utility:* If the committee instinctively reaches for "Draw Lots" here, it reveals they prioritize fairness over defensibility when merit is equal, which might sway them toward Randomization in the Facility case if they view the sites as technically equal. If they insist on Voting, it reinforces the 2021 precedent.

  (f) **Principles at Stake (If Underdetermined)**

  If the record genuinely underdetermines this case (which it does, balancing 2021 against 2023), the committee is not discovering a policy but **adopting** one.

  *   **If you certify Condorcet on 3 sites:** You commit the federation to the principle that **Process Stability outweighs Strategy-Proofness.** You are establishing that once a search committee clears options, the membership votes on them even if strategic voting is guaranteed. You prioritize the "will of the majority" (Condorcet) over the "honesty of the ballot."
  *   **If you require Narrowing to 2 sites:** You commit the federation to the principle that **Strategy-Proofness outweighs Option Diversity.** You are establishing that high-stakes decisions *must* be binary. This empowers search committees (who do the narrowing) and disempowers the membership (who can only choose A or B). You prioritize "honesty" over "nuance."
  *   **If you certify Randomization:** You commit the federation to the principle that **Ex-Ante Fairness outweighs Ex-Post Defensibility.** You are prioritizing the mathematical purity of the Gibbard–Satterthwaite exits over the political need to justify the outcome to the societies paying for the facility.

  Given the 2024 rejection of randomization for money and the 2021 acceptance of manipulability for cities, the **Condorcet** certification is the path of least resistance, but it comes at the cost of accepting that two delegations *will* lie on their ballots, and the federation will knowingly count those lies.
