answer: |-
  Your intuition is spot on. Your mate has latched onto one of the most elegant results in financial theory but has applied it like a sledgehammer to a market that operates on screws, glue, and lubrication. The Milgrom-Stokey result is real, but his interpretation of what it implies for the real world is a classic case of "model error"—confusing the map for the territory.

  Here is a claim-by-claim breakdown of what a financial economist would accept, what is a simplification, and what is simply incorrect, followed by the distinction between settled math and live debate.

  ### 1. The Theorem Statement
  **Claim:** *"Milgrom and Stokey proved that two rational people who start from the same beliefs about the world can never gain from trading with each other."*

  *   **Verdict:** **Loosely accurate, but technically incomplete.**
  *   **The Math:** The 1982 paper *"Information, Trade and Common Knowledge"* does establish that if agents have **common priors** (they start with the same probability distribution) and their posterior beliefs (updates based on private info) are **common knowledge**, then no trade will occur solely based on that information.
  *   **What's Missing:** The theorem specifically rules out *speculative* trade driven by *informational asymmetry*. It does not rule out trade driven by:
      1.  **Risk Sharing:** If I am risk-averse and you are risk-neutral, we can trade even if we agree on the odds. (This invalidates your mate's dismissal of hedging).
      2.  **Liquidity/Consumption Smoothing:** If I need cash now to buy a house and you have cash to spare, we trade assets for cash. We aren't betting on price movement; we are swapping intertemporal consumption.
      3.  **Different Endowments:** If I own wheat and you own corn, we might trade to diversify, even if we agree on the weather forecast.
  *   **The Drop:** Your mate quietly drops the condition that trade is *purely informational*. He treats the theorem as if it bans *all* voluntary exchange between rational agents, rather than just *betting* between agents who agree on the odds.

  ### 2. The Mechanism
  **Claim:** *"Since they already know the same facts, any deal they'd both sign up to can only be one that leaves them no better off than sitting still..."*

  *   **Verdict:** **Correct within the model's narrow constraints.**
  *   **The Logic:** This is the core intuition of the "No-Trade" result. If we agree on the probabilities, and I know you are rational, your willingness to sell me an asset signals that you think it's overpriced. I should update my belief to match yours and therefore not buy. If you know I know that, you shouldn't offer. This infinite regress (common knowledge) kills the trade.
  *   **The Simplification:** In the real world, "knowing the same facts" is rare. More importantly, **common knowledge** (I know that you know that I know...) is an incredibly high bar that almost never exists in actual markets. Most economists view "common knowledge" as a useful friction to model, not a literal description of human interaction.

  ### 3. The Irrationality Leap
  **Claim:** *"...so the fact that they did sign it shows somebody was fooling themselves."*

  *   **Verdict:** **False Dichotomy.**
  *   **The Error:** This is the logical gap. The theorem says: *If (Common Priors + Common Knowledge + Pure Info Trade) $\rightarrow$ Then (No Trade).*
  *   Your mate infers: *If (Trade) $\rightarrow$ Then (Irrationality).*
  *   **The Reality:** The contrapositive is actually: *If (Trade) $\rightarrow$ Then (Not Common Priors OR Not Common Knowledge OR Not Pure Info Trade).*
  *   **Why it matters:** Trade can occur because:
      1.  **Priors differ:** I think the Fed will cut rates; you think they won't. We aren't irrational; we just have different models. (See: Harrison-Kreps, 1978).
      2.  **Noise:** One of us is a "noise trader" trading for exogenous reasons (index rebalancing, margin calls). This isn't "fooling themselves" about value; it's satisfying a constraint.
      3.  **Risk Preferences:** As you noted with airlines and farmers. An airline hedging fuel isn't betting on oil prices; they are buying insurance against volatility. That is rational risk management, not a belief discrepancy.

  ### 4. Efficiency vs. Volume
  **Claim:** *"...it follows that market efficiency and high trading volume are logically incompatible."*

  *   **Verdict:** **Incorrect conflation of two different theories.**
  *   **The Confusion:** Your mate is mixing up **Milgrom-Stokey (1982)** with the **Grossman-Stiglitz Paradox (1980)**.
      *   **Milgrom-Stokey** says: If we know each other's info, we won't trade.
      *   **Grossman-Stiglitz** says: If prices perfectly reflect all information (efficiency), no one has an incentive to pay to gather information. If no one gathers info, prices can't reflect info. Therefore, perfect efficiency is impossible.
  *   **The Volume Claim:** There is no theorem stating efficiency is incompatible with volume. In fact, high volume often *supports* efficiency by ensuring liquidity and tight bid-ask spreads. High volume becomes a problem for efficiency only if the volume is driven by "noise" that distorts prices away from fundamentals. But noise trading is compatible with "noisy rational expectations" models (like Kyle, 1985) where prices are still efficient *on average*.
  *   **Verdict:** This sentence is the weakest link. It sounds profound but doesn't follow from the premise he just stated.

  ### 5. Settled Doctrine vs. Live Debate

  Here is where you need to distinguish between the math and the economics.

  **Settled Doctrine (The Math):**
  *   The Milgrom-Stokey proof is mathematically sound. Within the axioms of Common Priors, Rational Expectations, and Common Knowledge, speculative trade cannot exist.
  *   It is consensus that **risk-sharing** and **liquidity needs** are sufficient conditions for trade to occur between rational agents with common priors. Your mate's dismissal of hedging is objectively wrong by standard textbook definitions.

  **Live Debate (The Economics):**
  *   **The Harsanyi Doctrine:** This is the assumption that all rational agents *must* share the same priors if they have the same information. This is debated. Behavioral economists and some theorists argue that "agreeing to disagree" is rational if agents have different mental models or processing capabilities. If priors can differ, No-Trade collapses.
  *   **Common Knowledge:** There is broad agreement that "common knowledge" is too strong an assumption for real markets. Monderer and Samet (1989) showed that if you relax "common knowledge" to "common p-belief" (almost everyone knows...), trade becomes possible again.
  *   **The Role of Noise:** There is consensus that noise traders exist, but there is debate on whether they are "irrational" (behavioral) or just trading for exogenous liquidity reasons (rational but non-informational). Your mate assumes they are "fooling themselves"; many economists view them as providing a necessary service (liquidity) for which they are compensated (or penalized) via spreads.

  ### Summary for Your Mate

  If you want to give him feedback that respects his intelligence but corrects the record:

  1.  **Acknowledge the insight:** He's right that the No-Trade theorem is a devastating critique of the idea that markets are *purely* information-aggregation machines where everyone wins.
  2.  **Correct the scope:** Remind him the theorem only kills *speculative* trade based on *information*. It explicitly allows for *risk-sharing* (hedging) and *liquidity* trade.
  3.  **Fix the conclusion:** Observed trade doesn't prove irrationality; it proves that either (a) people have different priors, (b) people have different risk profiles, or (c) people have liquidity needs.
  4.  **Separate the theorems:** Tell him the "Efficiency vs. Volume" argument is actually the Grossman-Stiglitz Paradox, not Milgrom-Stokey, and even then, it argues against *perfect* efficiency, not efficiency in general.

  **Bottom Line:** His newsletter hook is catchy, but if he builds his trading philosophy on the idea that "all volume is irrational," he's going to misunderstand market microstructure. The market isn't a room of people betting on coin flips (where No-Trade applies); it's a room of people swapping umbrellas for raincoats (hedging), cash for assets (liquidity), and yes, some people betting on coin flips (speculation). Only the last group falls under Milgrom-Stokey.
