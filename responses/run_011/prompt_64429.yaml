  2.  **Deconstruct the Philosophy (Wittgenstein's *On Certainty*):**
      *   *Core Idea:* Some beliefs aren't empirical hypotheses tested by evidence; they are the "hinges" on which questioning turns. You don't prove them; you rely on them.
