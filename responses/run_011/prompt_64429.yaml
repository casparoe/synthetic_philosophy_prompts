      *   *Doubt:* Doubt only makes sense against a background of certainty. If you doubt everything, you doubt nothing.
      *   *Application to Fiction:* Characters shouldn't change hinge beliefs because of a single piece of evidence. If they do, it feels fake. If they don't, they shouldn't look stupid, they should look like they are operating on a different frame.

  3.  **Develop the Procedure (The "Hinge Check"):**
      *   Need 2-3 key terms. Let's use: **Hinge**, **Flow**, **Cost**.
      *   *Hinge:* The belief that holds the world together for them.
      *   *Flow:* The evidence/argument being presented.
      *   *Cost:* What else falls apart if this belief moves?
      *   *Steps:*
          1.  Identify the Belief Type (Hinge vs. Ordinary).
          2.  Assess the Cost of Change (What world collapses?).
          3.  Check the Mechanism of Change (Argument vs. Life Shift).
          4.  Verdict (Keep, Cut, or Shift).
      *   *Constraint Check:* Must flag where I'm imposing system. Must address the "stubborn = profound" risk.

