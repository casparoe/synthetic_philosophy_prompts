      *   **Inspiration:** Wittgenstein's *On Certainty* (hinge propositions, riverbed metaphor, doubt requires certainty elsewhere).
      *   **Task:** Create a practical procedure (step-by-step questions) based on these ideas for revising belief scenes. Needs to be usable in 20 mins with cold tea. No philosophy jargon (max 2-3 terms), no quotes, no bibliography.
      *   **Application:** Run the procedure on three specific cases (Uncle Sandy, Mother/Son, Granddaughter).
