answer: |-
  Good morning. I stand before you as the county archivist. I am white and my people have been in this county longer than the courthouse has stood. I say this not to claim authority, but to acknowledge weight. We are gathered on a square that has changed. The grass is different. The ground is higher. The bronze soldier remains, but he is no longer above us.

  [Pause]

  For six years, this commission argued. They voted five to four to keep the figure. They voted to build this berm. They voted to add three panels. They voted, on a tie, to add no fourth panel. Some call this a stalemate. I call it a design choice. The missing plaque is not a failure of words. It is a statement of principle. The principle is this: democracy does not require us to agree on the past to share the present. It requires us to stop lying about the disagreement. It requires us to admit that the argument is the monument.

  This principle demands something difficult from everyone here. It demands we surrender ownership of the story.

  To the heritage association, this means something unwelcome. You sought to preserve a tribute. You have received an exhibit. The soldier is no longer a hero to be saluted from below. He is a fact to be examined at eye level. His presence is no longer a command. It is a question. You cannot protect him from the answers we find in the dirt. You wanted a shrine. We built a classroom.

  To the author of the second panel, this also means something unwelcome. You sought a verdict. You have received a witness. Your grief is valid, but this square does not exist to vindicate you. It exists to implicate us. The pain of your ancestors is not a shield against complexity. It is a lens through which we must view our own complicity. You do not own this suffering. It belongs to the county now. You wanted a judgment. We built a mirror.

  [Pause]

  These cuts come from the same blade. No one owns the past. Not the descendants of the men who fought, nor the descendants of the men who were owned. We are all tenants here. The lease is renewed by how honestly we read the records.

  Our friends from Baden-Württemberg hear this and worry. The stonemason told me that in Germany, the country decided once what the crimes were. He said the monuments assume that decision. He called our berm a railing around an argument. He is right. But he is wrong about how Germany got there. It was not a single decision. It was a fight conducted for decades. It was students against parents. It was silence against speech. It was a slow, painful grinding of gears. They did not wake up agreed. They worked until the argument changed shape. They tore down walls. They built new ones. They argued in parliament. They argued in the streets. They forced the state to speak, and then they fought the state when it spoke too loudly. We are not there. We are here. We are building the railing so the argument does not fall off the edge.

  In a suburb of Hamburg, there was a column clad in lead. Residents were invited to sign their names on the soft metal. As the signatures covered the surface, the column was lowered into the ground. Stage by stage, it sank. Eventually, nothing remained above the pavement but a notice. The monument disappeared so the responsibility would remain. We have chosen not to lower our statue. We have chosen to raise ourselves to meet it. The work is the same. The burden shifts to the living.

  [Pause]

  Other nations choose differently. In Turkey, the state prosecutes those who denigrate Turkishness. In Japan, the national story rests on what was done to them, not what they did. When the verdict is issued by the state, memory becomes a statute. Silence grows where the law ends. We have no such law here. We have only this square.

  I work in the reading room. I handle the ledgers. I see the line items. I see the names of the enslaved written in the same ink as the plows and the mules. I see the coroner's reports where the cause of death is listed as unknown, though the blood was plain. These documents do not care about your feelings. They do not care about my lineage. They are cold. They are heavy. They are the only things that do not lie. They sit in boxes. They wait for hands to open them.

  The commission declined to write the fourth panel because no single sentence could hold the weight of these ledgers. To merge them would be to falsify them. To smooth the edges would be to dull the cut. So we leave the gap. We leave the space where the agreement should be. That space is where you stand.

  [Pause]

  Look at the berm behind me. The grass is new. The retaining wall is solid. The three bronze panels are set into the stone. They contradict each other. One speaks of honor. One speaks of inventory. One speaks of transcription. None of them speak for all of us. All of them speak to all of us.

  Walk up the slope. Stand where the commission asked you to stand. Put your hand on the retaining wall. Feel the cold bronze. Look the soldier in the face. He is not looking back. He is looking down the road he marched in eighteen-sixty-one. He does not know about this square. He does not know about these panels. He is bronze. We are flesh.

  The work is not in the metal. It is in the reading and the arguing. It is in standing here, at eye level, and refusing to look away. Look at the seam where the new bronze meets the old stone. That is where the history is.

  [Pause]

  Thank you.
