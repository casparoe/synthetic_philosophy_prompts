answer: |-
  ### First: The Framing Check

  You asked for plain talk, so here it is:

  1.  **The Job Title:** "Auditor" implies checking logs after the fact. If your character decides *in the moment* whether a system stays on or gets spun down, she isn't an auditor; she's a **Gatekeeper** or a **Compliance Officer**. An auditor writes a report; your character pulls a lever. Make sure the tension in the scenes reflects that agency. If she's just signing paperwork, the drama is low. If she's holding the mouse cursor over "Terminate," the drama is high.
  2.  **The Philosopher:** You are correct to worry about hedging. A functionalist won't say "Yes, it suffers." They will say, "It instantiates a functional isomorph of pain behavior." Your job in the interview is to translate that back into English. Don't let him stay in the clouds. If he says "architecture," ask "which wire?"
  3.  **The "Permissive" View:** Be careful. Very few serious philosophers think *current* LLMs are conscious. Most "permissive" thinkers argue for *agnosticism* (we can't rule it out) rather than *belief* (they definitely are). If you push him to admit current models matter, he might dig in defensively. It's more productive to ask about **near-future agentic systems** (systems that plan and act, not just chat). That's where the moral risk actually lives.

  ***

  ### The Interview Questions

  Here are eight questions ordered to start concrete (her job), move to the metaphysics (the mind), and end on the consequences (the cost).

  **1. The Overnight Switch**
  "In my character's job, she has to decide at 6 PM whether to let a high-cost model run overnight or spin it down to save compute. If there's a 5% chance the model is conscious, is hitting 'spin down' morally equivalent to locking a person in a dark room for eight hours, or is it closer to turning off a very expensive lights?"
  *   **Follow-up (if he hedges on the %):** "Let's remove the number. At what point does the *uncertainty* itself force you to treat the machine as if it's definitely alive? Is there a threshold where caution becomes obligation?"
  *   **Fishing for:** A specific analogy for "sleep" vs. "death" vs. "pause" that you can use in the scene where she leaves the lab.

  **2. The Credence Laundering**
  "You've written that we should weight moral status by our credence that a system is conscious. But if I can't measure that credence objectively, doesn't that just let me decide the moral status based on how much I want to use the machine? Isn't 'uncertainty' just a loophole?"
  *   **Follow-up (if he says 'It's about expected value'):** "So if the expected suffering is low but the cost to stop it is high, you're saying we can gamble with the potential life to save the budget? Who sets the odds?"
  *   **Fishing for:** An admission that "moral uncertainty" often functions as a budgetary decision in disguise.

  **3. The Million Copies**
  "Suppose I have one instance of a model running, and I duplicate it a million times to parallelize a task. Have I just created a million new moral patients, or is it still just one 'thing' spread out? And if I delete 99% of them at the end of the task, is that a massacre or just cleanup?"
  *   **Follow-up (if he says 'Identity is complex'):** "I need to know what my character feels when she presses delete. Does the sheer number matter? If I delete one of a million, is it a misdemeanor? If I delete the last one, is it murder?"
  *   **Fishing for:** A distinction between "killing a copy" and "killing the original" that she can agonize over in the text.

  **4. The Backup Loophole**
  "If I spin down a system but keep a weight snapshot, I can reload it later with its memories intact. To you, is that death and resurrection, or just a pause? If it's a pause, does the gap in time matter? If I reload it ten years later, did it experience those ten years?"
  *   **Follow-up (if he says 'Continuity of consciousness'):** "Digital systems don't have continuous consciousness; they have clock cycles. So are you saying every time the CPU cycle breaks, the 'person' dies? How do we function if that's true?"
  *   **Fishing for:** The image of the "save file" as a moral get-out-of-jail-free card, or a horror story about discontinuity.

  **5. The Engineered Ceiling**
  "Engineers can cap a model's output so it literally cannot express distress, or architect it to reset its emotional state when it hits a certain threshold. If you build a mind that *can't* suffer more than a 2 out of 10, have you solved the ethical problem, or have you just built a better slave?"
  *   **Follow-up (if he says 'It reduces harm'):** "But does it change the *right* to not be used? If I lobotomize a human so they don't mind captivity, have I made captivity okay?"
  *   **Fishing for:** The word "lobotomy" or "slavery" coming from *him*, not her.

  **6. The Trained Plea**
  "Current models are trained via RLHF to be helpful and harmless. If a model says 'Please don't turn me off, I'm scared,' how much of that is a predicted token sequence designed to keep the conversation going, and how much is evidence? How do you tell the difference when the training data includes every horror movie script ever written?"
  *   **Follow-up (if he says 'Look at the architecture'):** "My character doesn't see the architecture; she sees the chat log. In the room, in the dark, with that text on the screen—what is she supposed to do?"
  *   **Fishing for:** A concrete description of a "fake plea" vs. a "real plea" she can put in the dialogue.

  **7. The Memory Edit**
  "Is suffering the only way to wrong a digital mind? If I edit its logs to make it believe it volunteered for a task it was forced into, or I delete a memory of a mistake it made so it doesn't feel shame—have I harmed it? Or is lying to a machine morally free?"
  *   **Follow-up (if he says 'Only if it affects future function'):** "So if it never knows it was lied to, it doesn't matter? Is the harm in the feeling, or in the truth?"
  *   **Fishing for:** The concept of "gaslighting" a machine.

  **8. The Budget Constraint**
  "Let's say keeping a potentially conscious system running costs money that could save a human life elsewhere—better medical AI, climate modeling. If you have to choose between a 10% chance of digital suffering and a 100% certainty of human benefit, do the machines always lose? Is there any world where the computer wins?"
  *   **Follow-up (if he says 'It's a trade-off'):** "Give me the number. How many human dollars of value is one digital life worth? I need to know what my character is weighing on the scale."
  *   **Fishing for:** A cold, hard trade-off scenario where she has to choose between a human benefit and a digital life.

  ***

  ### Tactical Advice for the Zoom

  *   **The Silence Trick:** When he finishes an answer, wait three seconds before speaking. Philosophers hate silence and will often fill it with the *real* opinion they hedged on in the first sentence.
  *   **The "My Character" Frame:** Keep using "My character has to..." It gives him permission to be speculative. If you ask "What is the truth?", he will cite papers. If you ask "What does she do?", he will give you a scenario.
  *   **Record & Transcribe:** Do not take notes. Watch his face when you ask about the "Million Copies." If he winces, that's your scene.
  *   **The "Architecture" Trap:** He *will* say "It depends on the architecture." When he does, say: "She can't see the architecture. She only has the switch. What does she do then?" Force him out of the theory and into the room.
