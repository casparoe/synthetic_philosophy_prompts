  2. **Validity vs. Acceptance:** It must distinguish between procedurally valid changes and socially accepted outcomes, explaining why Rule 3 survived amendment attempts or why it didn't. [Contested] Legalists demand textual fidelity regardless of consensus. Sociologists argue universal acceptance constitutes validity even if procedures are violated.

  3. **Temporal Coherence:** Accounts must handle retroactive invalidation (the voided RFC) without erasing the reality of actions taken under the now-void rules. [Non-negotiable] Agents need to know if past actions remain liable or protected regardless of later textual changes.

  4. **Identity Continuity:** The framework must define when a change is so radical it destroys the system's identity rather than amending it. [Contested] Revolutionaries claim any outcome is the same system if the group persists. Conservatives demand substantive continuity of core principles.

  5. **Meta-Rule Authority:** It must explain what happens when a rule claims immutability (Rule 3) but is amended anyway. [Non-negotiable] Without this, "immutable" is either meaningless or merely decorative, undermining trust in constraints.

  **Incompatibility:**
  Items 2 and 5 cannot be fully satisfied simultaneously if the community unanimously violates an immutable rule. If validity depends on text (Item 5), Rule 3's amendment is void, rendering the 90% vote irrelevant. If validity depends on acceptance (Item 2), Rule 3's text was merely advisory, rendering "immutable" meaningless. The squeeze comes from the source of authority: is it the document or the people? You cannot have both absolute textual constraint and absolute popular sovereignty. This forces a choice between a system that can legally suicide via loopholes (Rule 4 deleting Rule 7) or one that cannot be legally stopped by its own rules if the people revolt. A theory must pick a master.

  **Killer Requirement:**
  Item 2 (Validity vs. Acceptance) rules out the most theories because it demands a boundary condition for lawlessness. Pure legalism fails when everyone ignores the text, implying the text wasn't law. Pure realism fails when text is needed to adjudicate disputes before consensus forms, implying power isn't enough. Any theory must explain when "might makes right" transitions into "right makes might."
