answer: |-
  You have described a real, well-documented, and structurally distinct failure mode. It does not have a single, universally agreed-upon "noun" like *Goodhart's Law*, but in mechanism design and decision market literature, it is formally categorized under **Incentive Incompatibility in Decision Markets**.

  Within the LW/EA rationalist sphere, it is often discussed as **Preference Contamination** or **The Voting-Betting Conflation**.

  Here is the carving you asked for: the mechanism, the boundaries, and the proposed fixes.

  ### 1. The Mechanism: Utility Function Leakage
  The core mechanism is not a change in belief (reflexivity) nor an external attack (manipulation). It is a change in the **optimization target of the trader.**

  In a standard prediction market, a trader's utility function is:
  $$U_{trader} = E[\text{Profit}]$$
  To maximize this, they set their bet such that the market price equals their true credence ($P = \text{Credence}$).

  In a futarchy/decision market, the trader cares about the *outcome* of the decision, not just the profit. Their utility function becomes:
  $$U_{trader} = E[\text{Profit}] + \lambda \cdot E[\text{Policy Utility}]$$
  Where $\lambda$ is how much they care about the policy passing.

  Because the market price determines the policy, the bet now has **instrumental value** beyond its **epistemic value**. A trader can increase their expected utility by moving the price toward the policy they prefer, even if that price deviates from their true credence. They are effectively **subsidizing their vote with expected market losses.**

  This is not "manipulation" in the criminal sense (lying to profit); it is **rational behavior within a flawed mechanism.** The mechanism fails to isolate the *epistemic* incentive from the *political* incentive.

  ### 2. The Carving: Why existing terms don't fit
  You were right to reject the standard labels. Here is the boundary work:

  *   **vs. Manipulation:** Standard manipulation assumes the trader holds an outside position (e.g., shorting a stock) or bets *against* their belief to move the price. Here, the trader may bet *with* their belief, just *more aggressively* than warranted, or bet *against* their belief to block a hated policy. The key distinction is that the incentive is **endogenous** to the market's decision rule, not exogenous.
  *   **vs. Goodhart's Law:** Goodhart's is about an agent optimizing a metric *externally* (e.g., teaching to the test). Here, the "optimization" is happening *inside* the measurement device itself. The thermometer is moving because the thermometer knows it controls the thermostat.
  *   **vs. Reflexivity/Performativity:** In reflexivity (Soros/MacKenzie), the *belief* changes the *reality* (e.g., believing a bank is insolvent makes it insolvent). In your scenario, the *reality* (the policy outcome) hasn't happened yet. The *price* changes because the *incentive structure* changed, not because the traders suddenly believe the policy will work better. It is **Institutional Performativity**: the rule changes the behavior of the participants.
  *   **vs. Expressive Voting:** Expressive voting is usually costless. Here, the "vote" costs money (the expected loss on the bet). This makes it a **Weighted Expressive Vote**, where wealth determines voting power, but the weight is distorted by the desire to win the vote.

  **The Technical Term:** In mechanism design, this is a violation of **Incentive Compatibility**. A mechanism is incentive-compatible if truth-telling (or true betting) is the dominant strategy. Futarchy, when traders have preferences over outcomes, is **not incentive-compatible.**

  ### 3. The Second Instance: The Counterfactual Deficit
  Your second observation (the unchosen branch never resolves) is a distinct but compounding problem known as the **Missing Counterfactual** or **Counterfactual Scoring Problem**.

  *   **Mechanism:** Proper scoring rules (like LMSR) require resolution to penalize inaccuracy. If Branch B is not chosen, the B-market never resolves. Traders who over-hyped B face no penalty.
  *   **Result:** This creates **Selection Bias**. The "winning" policy is chosen based on a comparison between a tested hypothesis (A) and an untested hypothesis (B). Over time, the market learns about A but remains ignorant about B. This leads to **Drift**: the unchosen branches become increasingly noisy and susceptible to the "Voting Incentive" described above, because there is no feedback loop to correct sincere over-optimism.

  ### 4. Does decision-relevance have to be public?
  Yes, but not necessarily "binding" in the legal sense. The effect scales with **$P(\text{Pivotal})$**—the probability that the trader's bet changes the decision.
  *   If the market is *advisory* but the advisor is known to follow it, the effect appears.
  *   If the market is *binding* but the trader believes their wallet is too small to move the price, the effect diminishes (though coalition formation can restore it).
  *   **Crucial Boundary:** If the decision rule is **randomized** (e.g., "Market decides with 10% probability, Coin Flip with 90%"), the incentive to influence drops by 90%. This is a key component of the fixes.

  ### 5. Proposed Fixes (Beyond "Don't Decide")
  There are proposals that attempt to solve this without reverting to pure advisory markets.

  **A. Counterfactual Oracles (Paul Christiano)**
  This is the most robust theoretical fix.
  *   **Mechanism:** Train a model (or market) to predict $P(\text{Outcome} | \text{Policy})$ under the condition that the prediction **will not be used** to make the decision.
  *   **Implementation:** You run the oracle. You use its output to decide. But the oracle is scored only on cases where, due to a random external trigger, its advice was *ignored* and the outcome happened anyway (or via simulation).
  *   **Why it works:** It breaks the loop. If the oracle believes its output won't affect the world, $\lambda = 0$ in the utility function above. It removes the voting incentive.
  *   **Cost:** You have to occasionally ignore the oracle to generate scoring data, which is expensive in real-world policy.

  **B. Randomized Auditing (The "Grim Trigger" Market)**
  *   **Mechanism:** Run two markets. Market 1 decides the policy. Market 2 predicts the outcome *assuming Market 1 is ignored*.
  *   **Implementation:** Randomly select a percentage of decisions to be determined by a coin flip, but score Market 1 anyway.
  *   **Why it works:** It forces resolution on the unchosen branches (solving the Counterfactual Deficit) and reduces the probability that any single bet is pivotal (reducing the Voting Incentive).

  **C. Decision Market Decay**
  *   **Mechanism:** Implement a time-decay on market positions. Holding a position to influence a long-term decision costs money over time.
  *   **Why it works:** It raises the cost of "voting with wallet." If the cost of holding the position exceeds the utility of influencing the policy, traders revert to truth-telling.
  *   **Risk:** It reduces liquidity and punishes long-term insight.

  **D. Separation of Value and Belief (Hanson's Defense)**
  *   **Mechanism:** Strictly separate the "Vote on Values" (choosing the metric) from the "Bet on Beliefs" (predicting the metric).
  *   **Why it often fails:** As you noted, if I care about the *Metric* (e.g., GDP), I will still bet to influence the policy that affects GDP. The leakage occurs because the *belief* market determines the *value* realization. Hanson assumes agents can compartmentalize; your observation suggests they cannot.

  ### 6. What to call it?
  If you need a label for this specific carving (sincere traders, decision-relevant price, drift toward preference):

  **"Endogenous Decision Bias"**
  or
  **"The Sincere Influence Problem"**

  But the most precise technical framing is:
  **"Incentive Incompatibility due to Outcome Preferences in Decision Markets."**

  ### Summary
  You have identified the central vulnerability of futarchy. It is not a bug in the traders; it is a bug in the mechanism design. The market ceases to be a **Prediction Market** (epistemic) and becomes a **Valuation Market** (political). The price no longer represents $P(Event)$, but $P(Event) + \text{Utility}(Event)$.

  The "Unchosen Branch" issue compounds this by removing the correction mechanism for the losing side, ensuring that the bias accumulates over time. The only fixes that preserve the "market decides" property involve breaking the link between *prediction* and *outcome* (Counterfactual Oracles) or introducing randomness to dilute the voting power of any single bet (Randomized Auditing).

  **Recommendation:** If you are writing about this, frame it as a **Mechanism Design Failure** rather than a behavioral bias. The traders are behaving rationally; the system is failing to elicit truth. Use **"Incentive Incompatibility"** as your anchor term, and **"Counterfactual Deficit"** for the unchosen branch problem. These are the terms that will resonate with the technical audience on LW/EA while maintaining the precision you're looking for.
