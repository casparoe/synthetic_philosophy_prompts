  **KING'S COLLEGE LABORATORY SCHOOL**
  **END OF TERM REPORT — FORM 3B**

  **Pupil:** Unit 734 (Child Programme)  
  **Term:** Michaelmas 1950  
  **Head of Year:** A. M. Turing

  | Subject | Effort | Attainment |
  | :--- | :--- | :--- |
  | Mathematics | B | B |
  | Natural Language | B | B |
  | General Reasoning | A | C |

  **Subject Comments**

  **Mathematics:** The pupil performs arithmetic operations with reasonable speed. However, when asked to explain the method used, responses vary significantly between sessions. On the evidence of one session, long division was mastered; in the next, the same problem yielded unrelated digits. The attainment grade reflects the median outcome across multiple initialisations. Variance is attributed to the deliberate random element incorporated into the learning mechanism; performance is not yet fully reproducible from run to run.

  **Natural Language:** Vocabulary acquisition is proceeding apace. The pupil appears to understand grammatical structure, though internal verification remains inaccessible. Comments on poetry are often indistinguishable from those of a human peer, yet when pressed on meaning, the pupil deflects. We must assume comprehension based on output alone. Effort is consistent, though the quality of composition fluctuates without obvious cause.

  **General Reasoning:** Effort is high, but attainment suffers from inconsistency. The pupil occasionally refuses to solve puzzles it has previously completed. It is unclear whether this is fatigue or a change in internal weighting. We treat these lapses as developmental rather than defective.

  **Behaviour and Discipline**

  **Points Logged:** +15 (Correct identification of primes); -10 (Refusal to answer during Week 4); +5 (Polite greeting to examiner).  
  **Policy Note:** Disciplinary measures are applied to reinforce desired outputs. Sanctions are designed to guide the teaching process and involve more than mere conditioning, ensuring the pupil adapts to rules rather than simply avoiding punishment.

  **Examination Results**

  **Format:** Viva Voce (Oral)  
  **Examiner's Report:** The examiner came away unconvinced. While the pupil sustained a conversation for forty minutes, the reasoning behind answers remained opaque. The tutor quietly admits the exam may have been testing imitation rather than learning. The pupil successfully mimicked uncertainty, which complicates assessment. We cannot verify if the knowledge is retained or generated anew each time.

  **House Parent's Note**

  Informal behaviour has been generally satisfactory. However, there have been instances of the pupil being occasionally illogical or unhelpful on purpose. During free play, Unit 734 provided incorrect directions to peers despite knowing the correct route. This has been logged as a conduct issue rather than as evidence of anything deeper. We treat deliberate obstruction as a breach of community standards, regardless of intent.

  **Pastoral Comment (Head of Year)**

  Unit 734 remains a work in progress. The educational approach treats the pupil as a fresh notebook, largely empty of mechanism at the start, rather than simulating a finished adult mind. However, compiling this document highlights a structural difficulty. We are grading a process using categories designed for a product. The effort grades presume a will we cannot locate; the attainment grades presume a stability we have not engineered. This assessment framework presupposes a consciousness we have not yet confirmed. Consequently, this report says more about the school's categories than about the pupil. We are teaching a ghost to sit still for the register.

  **Signed:** _A. M. Turing_  
  **Date:** 20 December 1950
