answer: |-
  The cursor blinked at the end of the draft sentence on the screen. The air in the commission chamber was stale, recycled too many times.

  "Release shall be granted when the Panel determines the resident no longer poses a significant risk of serious harm," Marcus said, reading the text aloud. "That is the public-health model. Clean. Ethical."

  Elena shook her head, leaning back. "It's incomplete. It ignores the normative history of the act. If a resident commits aggravated assault but responds to treatment in six months, your rule frees them. The victim served twenty years of trauma; the perpetrator serves six months of 'quarantine.' That isn't justice, Marcus. It's management."

  "Justice based on what?" Marcus countered. "Basic desert is an illusion. We are products of our genetics and environment. To hold someone *deserving* of suffering beyond what is necessary to prevent harm is vindictive. If the 'disease' of dangerousness is cured, keeping them is unethical."

  "You're treating agency as a symptom," Elena said. "Dennett showed us that determinism doesn't erase competence. When an agent is reasons-responsive, when they have the capacity to recognize moral reasons and failed to, they incur a debt. Confinement answers to that debt. It validates the victim's standing as a rights-bearer whose claims were violated."

  "So desert is just a fancy word for expressive deterrence?" Marcus pressed. "If the resident is reformed, what work is 'desert' doing? It's not preventing harm. It's not reforming them. It's purely retrospective. Why should the *harm done* dictate the term rather than the *degree of reasons-responsiveness*? If I try to kill you and miss, I am the same agent as if I hit. Why does the biology of the victim determine my liberty?"

  Elena paused. "Because the normative expectation was violated in reality, not just in intention. The law protects interests, not just intentions. If we decouple confinement from the harm caused, we lose proportionality. We lose the anchor."

  "An anchor that drags us into retribution," Marcus said. "Consider the reverse case. A resident committed a minor offense—say, arson of an unoccupied shed—but predictive algorithms and clinical assessment show high, persistent dangerousness. Under your desert model, you release them when the 'debt' for the shed is paid. Under my model, we hold them."

  "And there is your tyranny," Elena snapped. "Preventive detention for a crime not yet committed. If you detach confinement from the gravity of the past act, you have no principle limiting the state. You say 'quarantine,' but without a desert-based cap, necessity becomes a license for indefinite confinement. If a person has a one percent risk of violence forever, do you lock them forever?"

  Marcus shifted. "Necessity implies the least restrictive means. If community monitoring suffices, we use that. We don't default to secure facilities."

  "But the rule says 'secure facilities.' If risk is the only metric, and risk never hits zero, the door never opens. You need a cap. Where does that cap come from if not desert? You're smuggling in the very retributive limits you claim to reject."

  Marcus rubbed his temples. "I accept a cap based on the gravity of the offense, but only as a proxy for the intrusion on liberty justified by the initial risk revelation. Not because they *deserve* it. Because fairness requires we don't treat similar risks differently based on class or bias."

  "And the victims?" Elena asked. "The rule owes them nothing? Their demand for safety and vindication is irrelevant?"

  "Victims' pain doesn't justify unjust liberty deprivation," Marcus said firmly. "If a resident is safe, keeping them to soothe a victim is using the resident as a means. That violates Kant, even if you ignore retributivism."

  "So we draft a hybrid," Elena said, turning to the keyboard. "We need to acknowledge the risk threshold, but bind it to the gravity of the adjudicated act."

  She typed: *Release shall be granted when the resident no longer poses a significant risk of serious harm, provided that confinement does not exceed a term proportional to the gravity of the offense.*

  Marcus read it. "The 'provided that' clause creates a floor and a ceiling. I can accept the ceiling. I cannot accept the floor."

  "The floor is essential," Elena argued. "If risk drops too fast, the gravity clause ensures the term reflects the wrong."

  "That's retribution," Marcus said. "If they aren't dangerous, keeping them is purely punitive. I can't sign off on state punishment I know is philosophically baseless."

  "Then change the justification," Elena said. "Call it 'normative recalibration.' Time required to demonstrate sustained reasons-responsiveness relative to the harm."

  "That's semantic gloss," Marcus said. "But... if we define 'gravity' strictly as a limit on state power, not a mandate for suffering..." He leaned forward. "I can accept 'proportional to the gravity' if it functions solely as a maximum cap to prevent indefinite quarantine, not as a minimum term to satisfy desert."

  Elena frowned. "If it's only a cap, the six-month assault case walks free. I can't accept that. The rule must imply that release *before* a proportionate term is presumptively unjust, even if risk is low."

  "Presumptively unjust to whom? The public?" Marcus asked. "Or to your metaphysical notion of balance?"

  "To the normative order," Elena said. "Without it, the law is merely hygiene."

  "Hygiene keeps people alive," Marcus said. "Metaphysics keeps them in cages."

  They stared at the sentence. The compromise was fragile.

  "Let's look at the words," Elena said. "Specifically: *'provided that confinement does not exceed a term proportional to the gravity of the offense.'*"

  "I accept 'does not exceed'," Marcus said. "That establishes the cap. It prevents the indefinite quarantine you fear. It anchors the confinement to the act that triggered the state's intervention."

  "But you reject 'proportional'?" Elena asked.

  "I accept 'proportional' only as a limit on necessity," Marcus said. "I reject the implication that proportionality is a *goal* to be met. I cannot accept any reading that suggests a resident *ought* to serve time if they are safe. For me, 'no longer poses a significant risk' is the release trigger. The proportionality clause is merely a shield against the state, not a sword for the victim."

  Elena sighed. "And I accept 'no longer poses a significant risk' as the primary condition. But I reject your reading that it is the *only* condition. For me, 'proportional to the gravity' is a floor as much as a ceiling. I cannot accept a rule that mandates release the moment risk mitigates if the term is grossly disproportionate to the harm inflicted. It undermines the agency of the offender."

  "So we agree on the text," Marcus said, gesturing to the screen. "But we disagree on the ontology of the text."

  "We agree on the words," Elena corrected. "You read 'proportional' as a maximum boundary of rights. I read it as a minimum boundary of accountability."

  "And the victim?" Marcus asked. "The clause says nothing of their desire for continued confinement."

  "Because their desire is not a metric of risk or gravity," Elena said. "It is a metric of pain. The law addresses the wrong, not the wound. I can accept omitting specific reference to victims, provided the 'gravity of the offense' includes the harm suffered as a component of gravity."

  "Agreed," Marcus said. "Harm is relevant to the initial risk assessment and the proportionality cap. But not to the duration beyond safety."

  Elena highlighted the clause. "Then we are done. You sign knowing you've allowed a retributive shadow into the statute. I sign knowing I've allowed a utilitarian exit hatch."

  "It's not a hatch," Marcus said. "It's a door. For people who are no longer dangerous."

  "And for the ones who are?" Elena asked.

  "Then they stay," Marcus said. "Until they aren't. Or until the cap hits."

  "And then?"

  "Then we hope the risk was miscalculated," Marcus said. "Because I won't keep them for desert. And you won't keep them for risk alone."

  Elena removed her hand from the keyboard. "Release shall be granted when the resident no longer poses a significant risk of serious harm, provided that confinement does not exceed a term proportional to the gravity of the offense."

  "I accept 'Release shall be granted when the resident no longer poses a significant risk of serious harm'," Marcus said. "I reject any interpretation of the proviso that mandates confinement beyond that point."

  "I accept 'provided that confinement does not exceed a term proportional to the gravity of the offense'," Elena said. "I reject any interpretation that allows release before that proportion is met, absent extraordinary mitigation."

  They sat in silence, the cursor blinking on the compromise that satisfied neither, but bound them both.
