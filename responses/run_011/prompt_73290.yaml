  The conflict is explicit: Requirement 5 (Bright Line) vs. Requirement 4 (Vague Survival) and 6 (Ordinary Counting). You cannot have a metaphysically robust threshold for identity where none exists. The Registrar demands a cliff where there is a slope. Ordinary counting accepts vagueness ("sort of the same"); institutional policy demands binary states ("same ID or new ID"). They break at the Sorites boundary. If 51% replacement kills identity, why not 50%? Ordinary counting says "mostly the same." Policy says "New ID." The break is at the point where administrative liability requires certainty but reality offers none. If you enforce the threshold, you lie about the ontology. If you honor the ontology, you break the database.

  The most damaging requirement to popular views is **Operationalizability**. Standard identity views (Lockean, Spatio-temporal continuity) admit vagueness. They collapse when forced to produce a non-arbitrary percentage for "too much replacement." This demand kills the One-Object Identity view because identity is transitive, but replacement is gradual.

