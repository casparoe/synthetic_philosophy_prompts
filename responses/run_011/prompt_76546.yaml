answer: |-
  You are right to be suspicious. The standard "Peirce anticipated the Extended Mind Thesis (EMT)" line is often a case of philosophers projecting 1998 functionalism back onto 1868 semiotics. They look similar on the surface (mind isn't just in the skull), but the underlying architecture is fundamentally different. Clark and Chalmers are trying to *expand* the boundaries of a functional system; Peirce is trying to *dissolve* the boundary that makes the expansion necessary.

  Here is the breakdown of how Denials 1, 2, and 3 work together, and why Peirce is likely not an EMT precursor in the strict sense, but rather a precursor to something more radical.

  ### 1. What "Thinking Without Signs" Means (and the Boundary Problem)

  You asked if "sign" means an external vehicle (notebook) or if it means there is no non-representational inner medium. **It is definitely the second thing.**

  For Peirce, a "sign" is not just a physical token like a written word or a map. A sign is anything that stands to somebody for something in some respect. Crucially, a thought *is* a sign. When you think "red," that thought is a sign that refers to an object and generates an interpretant (another thought).

  If Denial 3 says "no thinking without signs," Peirce is claiming that there is no raw, non-representational "mental glue" holding thoughts together. There is no pure qualia or immediate intuition that isn't already structured as a representation.

  **Implication for the Inner/Outer Boundary:**
  This dissolves the boundary rather than crossing it.
  *   **Clark/Chalmers (EMT):** Assume there is a clear category of "cognitive process" (usually internal). They argue that if an external tool (Otto's notebook) plays the *same functional role* as an internal process (Inga's memory), we should treat the tool as part of the mind. They preserve the inner/outer distinction but argue for permeability.
  *   **Peirce:** Argues that thought *is* semiosis (sign-action). Signs are inherently public and communicable. Even "inner speech" is just a dialogue with oneself using the same signs used in external communication. Therefore, the "inner" is not a private container; it is just a specific phase of the sign-process.

  If thought is essentially sign-action, and signs exist in a medium that is shareable (language, logic, diagrams), then cognition is *already* external in its nature. It doesn't need to "spill out." It was never strictly "in" to begin with.

  ### 2. How Denials 1 and 2 Drive Denial 3

  Your reconstruction is very close to the mark. Denials 1 and 2 are the demolition crew; Denial 3 is the reconstruction.

  *   **Denial 2 (No Intuition):** This destroys **Foundationalism**. If every cognition is determined by a previous cognition, there is no "first premise" given directly to the mind. There is no self-justifying mental state. Thought is an infinite chain of inferences.
  *   **Denial 1 (No Introspection):** This destroys **Privacy**. We do not know our own minds directly. We know our own anger, for example, the same way we know another person's anger: by observing external facts (behavior, physiological changes, context) and hypothesizing an internal state to explain them.

  **The Argument to Denial 3:**
  1.  If I cannot access my mind directly (Denial 1), I cannot point to a "thought" that exists independently of how it manifests.
  2.  If every thought is determined by a previous thought (Denial 2), thought is a chain of mediation.
  3.  What is the medium of mediation that is accessible publicly (to myself and others)? **Signs.**
  4.  Therefore, thought must consist entirely of signs. If there were a "thought" that wasn't a sign, it would be incognizable (violating Denial 4) or it would be an intuition (violating Denial 2).

  **Is there a gap?**
  The gap lies in the definition of "determination." Peirce assumes that if $A$ determines $B$ in cognition, $A$ must *represent* something to $B$. A contemporary philosopher might argue for causal determination without representation (e.g., neural firing patterns determine thoughts but aren't signs). Peirce blocks this by arguing that unless a neural state is interpreted, it isn't a cognition at all. It's valid *if* you accept his semiotic definition of thought.

  ### 3. Directionality and the Coupling-Constitution Objection

  This is the strongest point of divergence between Peirce and EMT.

  **Directionality:**
  You are correct that Denial 1 sounds like the *opposite* of Extended Mind. EMT says: "The mind extends into the world." Peirce says: "The 'inner mind' is a hypothesis we construct based on the world."
  Peirce is effectively arguing for a kind of **logical behaviorism** or **publicism**. The "internal world" is not a place where cognition happens; it is a theoretical construct we use to make sense of the external flow of signs.

  **The Coupling-Constitution Fallacy:**
  The standard objection to EMT (Adams & Aizawa) is: "Just because the notebook is *coupled* to Otto's brain doesn't mean it *constitutes* his memory."
  *   **Against Clark/Chalmers:** This objection sticks because C&C try to draw a line and then move it. They need to prove the notebook is *constitutive*.
  *   **Against Peirce:** This objection **cannot get a grip.** Peirce doesn't care about coupling. For Peirce, the notebook and the brain are both loci of sign-activity. If the sign-process flows through the notebook, the cognition *is* there. There is no "inner constitution" to compare it to.
      *   If the "inner" is just a hypothesis about the "outer" (Denial 1), then asking "is the outer part of the inner?" is a category mistake. The outer is the primary reality; the inner is the derived model.

  So, Peirce isn't "extending" cognition. He is **eliminating the inner theater** that would need extending. He is arguing that cognition is fundamentally a public, temporal process, not a private, spatial container.

  ### 4. "Man is a Sign": Metaphysics or Philosophy of Mind?

  When Peirce concludes that "man is a sign" and that a person's language is the sum of the person, he is making a **metaphysical claim that entails a philosophy of mind.** You cannot separate them in his system.

  *   **If it were just Philosophy of Mind:** He would be saying, "We process information like signs."
  *   **If it were just Metaphysics:** He would be saying, "Reality is structured like a sign."
  *   **Peirce's Claim:** Because reality is semiotic (Metaphysics), and humans are part of reality, humans are signs (Ontology). Therefore, cognition is the process of that sign developing (Philosophy of Mind).

  **Location vs. Nature:**
  For the two readings to come apart, you would need a theory where "signs" are internal mental objects. If Peirce believed signs were internal, then "Man is a sign" would mean "Man is a bundle of internal representations." But Denial 1 forbids this. Since signs are public/externalizable, "Man is a sign" means a person exists *in the future*, in the interpretation of others. My cognition isn't located in my head; it is located in the trajectory of my actions and words as they are interpreted by the community (or by my future self).

  **Is he an ancestor of Extended Mind?**
  *   **Yes, if:** You define EMT loosely as "cognition isn't bounded by the skull." Peirce definitely argues this.
  *   **No, if:** You define EMT as Clark/Chalmers do (Functionalism + Parity Principle). Peirce is not a functionalist. He is a **semiotic realist**.

  **The Verdict:**
  The standard reading is partially wrong. It treats Peirce as if he is making a functionalist argument about tools (like the notebook). He is actually making a metaphysical argument about the nature of self and time.
  *   **Clark/Chalmers:** The mind is a process. If the notebook does the process, the notebook is the mind.
  *   **Peirce:** The mind is a sign. A sign only exists in relation to an interpreter. Therefore, the mind only exists in relation to an interpreter (which can be the world, others, or the future self).

  Peirce is less an ancestor of the *Extended Mind* and more an ancestor of **Distributed Cognition** (Hutchins) or **Enactivism**. He anticipates the idea that cognition is not a thing inside us, but a relationship we participate in.

  **Summary for your seminar:**
  Tell them that reading Peirce as an EMT precursor is a category error. EMT tries to save the internal mind by expanding its borders. Peirce argues the internal mind is a fiction derived from external sign-activity. He doesn't extend cognition; he externalizes it by default. Denials 1 and 2 are the critical moves: they remove the privileged access to the "inner," forcing Denial 3 (Signs) to be the only remaining medium for thought. This makes the coupling-constitution objection irrelevant, because there is no "inner constitution" to privilege over the "outer coupling."
