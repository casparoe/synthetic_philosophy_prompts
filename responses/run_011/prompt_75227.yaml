answer: |-
  This is a remarkably fertile collision of texts. You have placed a modernist puzzle box against a classical moral framework, and the friction generates more heat than light—which is to say, it generates truth. Both you and your friend are grasping distinct halves of the film's dialectic. To resolve this, we must distinguish between Plutarch's *method* (which Welles adopts) and Plutarch's *teleology* (which Welles subverts).

  Here is my reading of the architecture of *Citizen Kane* through your Plutarchan lens.

  ### 1. The Friend's Truth: The "Slight Thing"
  Your friend is correct that the film structurally vindicates the methodological declaration in the *Life of Alexander*. Plutarch argues that a "slight thing, a remark or a jest" often discloses character more reliably than "the marshalling of armies." *Citizen Kane* is built on this exact principle. The newsreel—the "History" in the Plutarchan sense—lists the marshalling of armies (newspaper chains, political campaigns, opera houses, castles). Thompson explicitly rejects this. He says, "It's not enough to tell me what a man did. You've got to tell me who he was."

  The film agrees with Plutarch that the public deeds are masks. The "truth" is indeed located in a discarded toy. The sled is the ultimate "slight thing." It is not a deed; it is a relic of a pre-moral state. In this specific sense, the film is Plutarchan: it asserts that the essence of the man is not in the headline but in the whisper. If your friend's claim is that the film *uses* the Plutarchan heuristic to locate its central mystery, they are right. The camera hunts for the anecdote, the gesture, the private moment (the breakfast montage, the glass snowglobe) rather than the public record.

  ### 2. Your Truth: The Broken Mirror
  However, you are right that the film refutes the *Aemilius Paulus* preface's promise. Plutarch suggests that by selecting the "noblest and best attested," the reader's character is "adorned." The biography serves as a moral mirror for the living. *Kane* shatters this mirror.

  Thompson is the figure of the Plutarchan biographer. He is commissioned to write the "Life." He gathers testimonies. He seeks the "noblest" (or at least the truest) version. And he fails. His final line is the anti-Plutarchan thesis statement: "I don't think any word can explain a man's life." Plutarch writes to make character legible; Welles writes to make it illegible.

  Your insight that "moral understanding of a life [is] available only to someone who is not trying to learn anything from it" is the crucial key. Thompson is trying to *learn* Kane, to categorize him. The audience, by contrast, is shown the burning sled without the context to use it as a moral lesson. We see the secret, but it edifies no one. It is a secret that died with the man. The mirror does not adorn us; it confronts us with the impossibility of knowing another soul. The film grants us omniscience (we see Rosebud) but denies us wisdom (we cannot use it to judge him).

  ### 3. Thompson: Failed Plutarch or Modern Witness?
  You ask if Thompson is a Plutarch who fails, or a figure whose own moral education is the real product. I argue for the latter, with a caveat. Thompson is not educated in the sense of becoming "better" (adorned), but he is educated in the sense of becoming *humble*.

  In the opening, Thompson is cynical but confident. He treats Kane as a puzzle to be solved. By the end, having absorbed Bernstein's affection, Leland's contempt, and Susan's humiliation, he has not acquired a verdict, but he has acquired a *burden*. He realizes that a life is not a sum to be totaled. This is a modernist epistemological shift. Plutarch believes the past can be known and utilized. Thompson learns that the past is a collection of subjective fragments that never cohere into a whole.

  Thompson is not a failed Plutarch; he is a successful Modernist. He succeeds in proving that the Plutarchan project is impossible in the 20th century. The "News on the March" sequence is the Plutarchan "History" (deeds). Thompson tries to write the "Life" (character). He finds that in a mediated, capitalist, fragmented world, the "Life" is inaccessible. The only truth is the material object (the sled), which is immediately destroyed.

  ### 4. The *Synkrisis* Hypothesis
  Your suggestion that *Kane* is a *synkrisis* with the second term missing is brilliant. In Plutarch, the *synkrisis* compares two lives (e.g., Alexander and Caesar) to draw out moral distinctions. In *Kane*, the comparison is between Kane and the witnesses.

  Does this hold up? Yes, structurally.
  *   **Bernstein:** His loyalty survives Kane's betrayal. He remains the "good servant" even when the master is mad. The comparison highlights Bernstein's constancy against Kane's volatility.
  *   **Leland:** He represents the moral idealism Kane claimed to have but abandoned. Leland keeps the principles; Kane keeps the power. The comparison judges Kane by the friend he cast aside.
  *   **Susan:** She represents the human cost. Kane consumes; she survives (running the nightclub). Her survival is a quiet victory over his destruction.

  The ethical work *does* happen on the witness's side. We judge Kane by how he treated them, but we also judge *them* by how they endured him. This is a very Plutarchan move: character is revealed in relationship. However, you are forcing a Hellenistic form onto a modernist film only in the sense that Welles likely did not consciously intend a *synkrisis*. But as an interpretive lens, it is robust. It explains why the witnesses are given such distinct moral weights. They are not just sources; they are counter-lives.

  **Confidence Level:** High on the structural validity; Moderate on the intentionality. It is a productive anachronism.

  ### 5. Hagiography and the Icon
  You ask how much of the resistance is resistance to *hagiography*. Plutarch is not writing hagiography (saints' lives); he admits faults. But he does seek *exemplarity*. The Newsreel is hagiographic (or demonographic)—it creates an Icon. Thompson tries to dismantle the Icon to find the Man.

  The twist is your final question: *Does Rosebud give the audience exactly the icon Thompson refuses to build?*
  Thompson refuses a simplifying word. "Rosebud" is a simplifying word. It is a symbol. By showing us the sled, the film gives the audience the Icon. But it is an ironic icon. It doesn't tell us Kane was "good" or "bad." It tells us he was *bereaved*.

  If Thompson had learned the meaning of Rosebud, he might have written a sentimental biography: "He was a lonely boy." That would be a different kind of false icon. By denying Thompson the knowledge, the film prevents the sentimentalization of Kane. The audience sees the sled burn. We know the secret, but we know it is ash. We possess the icon, but we know it is worthless. This preserves the mystery while satisfying the plot. It resists hagiography by making the "key" to the life something that offers no moral instruction, only psychological pathos.

  ### 6. Where the Plutarchan Frame Distorts
  You asked me to be honest about where this frame distorts the picture.
  Plutarch believes in the stability of character. Even if men are complex, they have a *ēthos* that can be described. Welles believes in the fragmentation of the self. Kane is not one man; he is the sum of how others saw him. The Plutarchan frame assumes there is a "true Kane" to be found (either in the slight thing or the noble deeds). The film suggests there is no "true Kane," only the traces he left.

  If you flatten Plutarch into a naive exemplarist, you miss that Plutarch also deals with tragedy and failure. But Plutarch's failures are moral lessons (e.g., Antony). Kane's failure is an ontological void. The Plutarchan frame illuminates the *search* for truth in the film, but it distorts the *result*. The film is not saying "Here is a man to avoid"; it is saying "Here is a man you cannot know."

  ### 7. Confidence and Uncertainty
  I am highly confident in the reading of Thompson as a Modernist biographer who rejects the Plutarchan teleology while using its methods. I am also confident that your *synkrisis* hypothesis is the strongest way to reconcile the vividness of the supporting cast with the opacity of the protagonist.

  **Point of Least Confidence:**
  I must flag a specific detail regarding the film's text. I am reconstructing Thompson's final line from memory: *"I don't think any word can explain a man's life."* I am 90% sure this is the phrasing, but it is possible he says *"no single word"* or *"I don't think any word can explain a man."*
  **Why this matters:** If he says "no single word," it leaves open the possibility that a *narrative* (like Plutarch's) could explain him. If he says "any word," it implies total inexpressibility. My argument rests on the idea that Thompson rejects the *possibility* of a definitive summary. If the line is softer ("no single word"), it softens my claim that he rejects the Plutarchan project entirely. He might just be rejecting the *headline*, not the *biography*.
  **Recommendation:** Verify the exact script of Thompson's resignation scene at the end of the film. If he implies that a full biography *could* work but a headline cannot, your friend's Plutarchan reading gains significant ground (since Plutarch writes books, not headlines). If he rejects explanation entirely, your reading stands firm.

  **Conclusion:**
  You are both half-right. The film is Plutarchan in its **microscope** (the slight thing reveals the truth) but Anti-Plutarchan in its **telescope** (the total life cannot be summed up for moral edification). Your *synkrisis* idea saves the Plutarchan frame by shifting the moral weight to the witnesses, allowing the film to be a study of character without promising a moral lesson about the protagonist. Thompson is not a failed biographer; he is a successful witness to the failure of biography.
