answer: |-
  **Term Paper Proposal**
  **Title:** Granularity and Invariance: A Diagnostic for the Needham Question
  **Course:** Philosophy of the Social Sciences

  **1. The Research Question**
  The seminar stalemate regarding the Needham Question ("Why modern science/industry in Britain/Europe and not China?") stems from a failure to specify the contrast class and the ontological units of the *explanandum*. I propose to evaluate three precisifications of the question:

  1.  **The Deflationary View:** The question is singular and ill-posed due to category errors (comparing a nation-state to a civilization-empire). It should be dissolved, not answered.
  2.  **The Underdetermination View:** The question is well-posed but currently unsolvable due to insufficient evidence or competing causal models.
  3.  **The Fragmentation View (Defended):** The "Needham Question" is a placeholder for a *family* of distinct, well-posed contrastive questions. The apparent disagreement in the literature is not about evidence for a single claim, but about which member of the family different authors are addressing.

  I will defend the **Fragmentation View**. My core thesis is that the "unit mismatch" (Britain-as-region vs. China-as-continent) is not merely a nuisance to be corrected by stipulation, but the primary driver of the explanatory divergence. Explanations that are robust at the "Empire vs. Empire" scale (e.g., legal institutions) often fail at the "Region vs. Region" scale (e.g., Lancashire vs. Jiangnan), and vice versa. The paper will argue that we cannot assess causal claims in this domain without first fixing the granularity of the relata.

  **2. Critique of Existing Approaches**
  Neither the "causal realist" camp (mostly historians/economists) nor the "conceptualist" camp (analytic philosophers) has settled this because both miss the interaction between granularity and contrast.

  *   **The Causal Realists:** They are right that there are factual differences (coal, wages, states) but wrong to assume these factors function as invariant causes across different spatial scales. When a historian swaps the foil from "Qing China" to "Song China" without adjusting the causal model, they are implicitly changing the *explanandum* while claiming to answer the same question. They treat the unit mismatch as a background assumption rather than a variable.
  *   **The Conceptualists:** They are right that "Why P rather than Q?" requires a fixed foil, but they often treat the choice of foil as a pragmatic preference rather than an ontological constraint. They demand a fixed contrast class without acknowledging that "China" may not be a single unit capable of entering a contrast class with "Britain" in a causally homogeneous way.
  *   **The Causal-Modeling Constraint:** Our professor's demand for "interventions" is the tie-breaker. An intervention on "Chinese institutions" is ill-defined if "China" contains internal variations larger than the treatment effect. If the unit of analysis is too coarse, the intervention is not sharp. My paper will argue that the foil-swap diagnostic is actually a test for *causal invariance*: if an explanation collapses when the foil shifts from "Qing" to "Jiangnan," the proposed cause is not invariant across the relevant context, and thus fails the causal-modeling standard.

  **3. Methodology: The Foil-Swap Diagnostic**
  The paper will not be a survey of divergence theories, but a stress-test of their logical structure. I will construct a matrix where rows are candidate *explanantia* and columns are contrastive foils/units.

  *   **Weeks 1–4 (Taxonomy of Units):** I will delineate three distinct spatial-temporal units commonly conflated in the literature: (1) Sovereign States (UK vs. Qing), (2) Economic Regions (Lancashire vs. Jiangnan), and (3) Civilizational Zones (Europe vs. East Asia). I will argue that "China" oscillates between (1) and (3) in the literature, while "Britain" is almost always (1) or (2).
  *   **Weeks 5–8 (The Swap):** I will select three dominant explanations (e.g., High-Wage Economy, Fragmented Polity, Neo-Confucianism) and subject them to the foil-swap.
      *   *Test:* Does the High-Wage explanation hold if the foil is "Song China" (high wages, no industry) vs. "Qing China" (low wages)?
      *   *Test:* Does the Fragmented Polity explanation hold if the unit is "Europe" (fragmented) vs. "China" (unified), but fails if the unit is "Britain" (unified) vs. "Italian City-States" (fragmented, no industrial takeoff)?
      *   *Mechanism:* I will treat the explanation as a function $E(Unit, Foil) \rightarrow TruthValue$. If the truth value flips when the Unit changes but the Foil remains nominally similar, the explanation is granularity-sensitive.
  *   **Weeks 9–10 (Synthesis):** I will map which explanations are robust across granularity shifts and which are local. The goal is to sort the literature into "Macro-Historical Claims" (valid only at Civilizational scale) and "Mechanism Claims" (valid at Regional scale).

  **4. Success and Failure Conditions**
  *   **Positive Result:** The paper successfully demonstrates that specific debates (e.g., "Did coal matter?") are actually verbal disputes arising from unstated unit shifts. A positive result produces a classification scheme: e.g., "Institutional explanations are robust at the State level but fragile at the Regional level." This delivers explanatory content by clarifying the *domain of validity* for existing causal models.
  *   **Negative Result (Failure):** The project fails if it collapses into a stipulative exercise where I simply define "well-posed" by fiat to dismiss the historians' work. To avoid this, I must show that the granularity mismatch leads to *empirical errors* (e.g., false predictions) not just semantic confusion. If I cannot show that the unit mismatch obscures actual causal mechanisms, the paper is merely a complaint about grammar.
  *   **The Causal-Modeling Risk:** If the professor argues that all causal claims are context-sensitive anyway, my distinction might seem trivial. I must show that the granularity mismatch is *exceptional* in this debate, not just an instance of standard context-sensitivity.

  **5. Scope and Limitations**
  *   **Language:** I read no Chinese. I will rely on English-language secondary literature (e.g., Pomeranz, Wong, Rosenthal, Needham) and philosophical commentaries. I will not attempt primary historical analysis.
  *   **Breadth:** I cannot test every explanation. I will focus on the three most cited candidates in the seminar readings.
  *   **Ambition:** I am not solving the Needham Question. I am solving the meta-question of why the Needham Question generates stalemate. The explanatory content delivered is a methodological constraint: future causal modeling in this domain must specify the spatial granularity of the intervention before estimating effects.

  **6. Commitment**
  I am committing to the view that the **unit mismatch is fatal to the singular question** but productive for the fragmented family. This is not a bad idea, provided it is framed as a test for causal invariance rather than linguistic pedantry. If I were to write this differently, I would focus solely on the temporal vagueness ("when did industrialization start?"), but that is less interesting to a causal modeler than the spatial/unit issue, which directly impacts how we define the treatment group. The unit mismatch is the stronger lever for this specific audience.
