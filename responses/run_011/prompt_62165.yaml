answer: |-
  Here are ten questions tailored to the speaker's specific framework, with notes on her likely responses, follow-ups, and flags for contested premises.

  **1. The "Conspiracy" Distinction**
  "Superdeterminism violates Statistical Independence by correlating the source with the settings via the past. You do it via the future. Empirically, the violation looks identical. Why is your correlation 'lawful' while theirs is 'conspiratorial'? Is that distinction anything more than a narrative preference?"
  *   **Likely Answer:** She will argue superdeterminism requires *initial* condition fine-tuning that undermines scientific inference, whereas her model relies on *dynamical* constraints (laws) that preserve the ability to test hypotheses.
  *   **Follow-up:** "But if the dynamical constraint ensures I never choose the setting that would reveal the hidden variable, haven't you still undermined the 'free choice' required to test the law itself?"
  *   **Contested Premise:** Whether violating Statistical Independence necessarily precludes scientific inference (the "scientific method" objection).

  **2. Signalling and Fine-Tuning**
  "You preserve no-signalling. But in retrocausal models, preventing signals to the past often requires exact fine-tuning of the probability distributions. If that tuning isn't protected by a symmetry, isn't *that* instability the real cost, rather than Bell's factorizability?"
  *   **Likely Answer:** She will likely claim the tuning is protected by time-symmetry or equilibrium conditions (e.g., Born rule as an equilibrium state), making it stable, not ad hoc.
  *   **Follow-up:** "If the Born rule is an equilibrium, do you predict deviations in non-equilibrium scenarios, like the early universe? If not, is the stability claim testable?"
  *   **Contested Premise:** Whether retrocausal models *require* fine-tuning to avoid signalling (some proponents argue it comes naturally from time-symmetry).

  **3. Locality vs. Global Constraint**
  "Critics argue that a global constraint on a 4D history isn't a local mechanism. If the correlation is fixed by a boundary condition on the whole block, haven't you just replaced spatial nonlocality with temporal holism?"
  *   **Likely Answer:** She will deny "holism," arguing that the beables are still local in spacetime; only the *dependence* relations are time-symmetric.
  *   **Follow-up:** "If the dependence runs both ways, can you specify the state of a region without referencing the future boundary? If not, in what sense is the region's state 'local'?"
  *   **Contested Premise:** The definition of "Locality" (Bell's Local Causality vs. Separability of Beables).

  **4. The Many-Worlds Comparison**
  "Everettians also claim to save locality, but by dropping unique outcomes. You drop unidirectional causality. Which ontology is heavier: a branching multiverse or a future-constrained past? On what metric is your price 'cheaper'?"
  *   **Likely Answer:** She will argue that branching violates our experience of unique outcomes (requiring extra interpretive work), whereas retrocausality keeps unique outcomes but challenges our causal intuition.
  *   **Follow-up:** "But if the past is constrained by the future, is the past 'fixed' in the same way the present is? If not, haven't you made reality just as fragmented as Everett, only along the time axis?"

  **5. Empirical Distinguishability**
  "Is your model empirically distinct from standard collapse or superdeterminism? If it reproduces QM exactly, is the advantage purely metaphysical, or does it suggest a specific deviation we should look for?"
  *   **Likely Answer:** She may admit empirical equivalence in standard regimes but suggest deviations in cosmology or specific weak-measurement scenarios.
  *   **Follow-up:** "If it's empirically equivalent in the lab, aren't you asking us to adopt a radical ontology solely for philosophical parsimony? Why should physics prioritize that?"

  **6. The "Cheapness" of Factorizability**
  "You say dropping Factorizability is cheaper than dropping Separability. But Factorizability underpins our standard notion of explanation. Aren't you asking us to accept explanations where causes don't precede effects, which undermines the very logic of testing theories?"
  *   **Likely Answer:** She will argue that "cause preceding effect" is a thermodynamic accident, not a logical necessity for explanation.
  *   **Follow-up:** "If explanation doesn't require temporal order, what prevents *any* correlation from being 'explained' by a future boundary? Where do you draw the line on ad hoc constraints?"
  *   **Contested Premise:** Whether causal order is a prerequisite for scientific explanation.

  **7. Thermodynamic Arrow**
  "Retrocausality usually requires time-symmetric laws, but we see a thermodynamic arrow. Does your model require a special low-entropy future boundary to work, and isn't that just as ad hoc as a superdeterministic past?"
  *   **Likely Answer:** She will likely argue that the thermodynamic arrow is compatible with micro-physical time symmetry (Boltzmann style) and doesn't require a future boundary condition, just symmetric laws.
  *   **Follow-up:** "But if the micro-laws allow retrocausality, why don't we see macroscopic retrocausality? What suppresses it, and is that suppression mechanism local?"

  **8. The Definition of Locality**
  "You argue Bell's Factorizability smuggles in a time-asymmetry. If we define locality purely by spacelike separation of beables, does your view actually violate locality, or just our causal story?"
  *   **Likely Answer:** She will insist it violates only the causal story, preserving the locality of beables (Separability).
  *   **Follow-up:** "If the causal story is wrong, why did Bell's theorem succeed in ruling out local hidden variables for fifty years? Was the physics community wrong about what 'local' meant?"
  *   **Contested Premise:** Whether Bell's "Local Causality" is the correct formalization of "Locality" (vs. Separability).

  **9. Mechanism vs. Constraint**
  "In a standard mechanism, A pushes B. In your view, the future measurement 'constrains' the past emission. Is there a physical carrier of this constraint, or is it a brute fact about the history? If brute, isn't that a form of nonlocality?"
  *   **Likely Answer:** She will deny a "carrier" is needed, arguing that laws constrain histories without needing a mediating signal (similar to how least-action principles work).
  *   **Follow-up:** "If laws constrain histories globally, how do you avoid the charge that the 'locality' is just an artifact of how you slice the 4D block?"

  **10. Concrete Separability (Closing)**
  "Let's pin down Separability. In a naive local hidden-variable model, the particle has a definite spin at emission. In your view, does the particle have a definite spin *before* the future setting is chosen? If not, how is the state of the parts 'fixed' independently of the whole?"
  *   **Likely Answer:** She will likely say the state is indeterminate or relational until the boundary conditions (emission + measurement) are both applied.
  *   **Follow-up:** "Then the state of the part *does* depend on the global setup. So you've kept Separability in name, but surrendered the idea that parts have intrinsic states. Is that really the 'cheap' option you promised?"
  *   **Contested Premise:** Whether "Separability" requires intrinsic states independent of future boundary conditions.

  ***

  **Note on Field Status:**
  *   **Mainstream Status:** None of these questions treat retrocausality as the consensus. They frame it as a minority view that must justify its costs against established interpretations (Collapse, Everett, Superdeterminism).
  *   **Bell's Theorem:** Several questions (1, 3, 6, 8, 10) flag that the interpretation of Bell's theorem (specifically what "Locality" means) is philosophically contested, not experimentally settled.
  *   **Loophole-Free:** The questions assume the loophole-free tests rule out *Bell-local* models, but probe whether the speaker's definition of "local" escapes that net. This acknowledges the experimental status without conceding the philosophical interpretation.
