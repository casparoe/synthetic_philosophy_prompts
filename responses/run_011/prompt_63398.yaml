answer: |-
  This arrangement does not presuppose a theory of *distributive justice* in the political-philosophical sense (e.g., Rawls or Nozick applied to citizens). Rather, it presupposes a theory of **institutional viability** dressed in the language of **procedural fairness**. The leagues operate on a consequentialist logic: the "justice" of the distribution is instrumental to the survival of the monopoly.

  Here is an analysis of the arrangement through the five specific lenses you provided.

  ### 1. Patterned vs. Voluntary Association
  Is the cap a patterned end-state view (Nozick's critique) or a private contract?

  Strictly speaking, the leagues rely on the **voluntary association** defense. They argue that a sports league is not a society but a joint venture producing a single product (the championship). In this view, the salary cap is not a redistribution of wealth for moral reasons, but a quality-control mechanism for a collaborative enterprise. If one partner (a rich team) hoards all the resources, the joint venture fails.

  However, this distinction is largely evasive. Because these leagues operate as legal monopolies (or monopsonies) protected by antitrust exemptions, they function as quasi-public utilities. A player cannot simply opt out and join a rival NFL; there is no rival. When an organization holds monopoly power over a labor market, its internal rules function as state regulations.

  Therefore, the arrangement *does* presuppose a **patterned principle**, but one limited to the scope of the industry. It asserts that a specific distribution of talent (approximate equality) is morally preferable to a free-market distribution *within the context of the game*. It is a localized Nozickian violation justified by a localized Utilitarian goal. The distinction between "private club" and "basic structure" does work legally (shielding them from civil rights or antitrust suits), but morally it collapses under the weight of their market power.

  ### 2. Requirement vs. Fit (The Draft and Talent)
  Does the reverse-order draft require the belief that talent is undeserved (Rawls)?

  No. This is a place where rival theories are **underdetermined**.
  *   **The Rawlsian View:** Would argue the draft is just because natural talent is morally arbitrary; therefore, no team "deserves" the best rookies, and society (the league) should distribute them to benefit the least advantaged (the worst teams).
  *   **The Utilitarian View:** Argues the draft is just because uncertainty of outcome maximizes aggregate fan utility.
  *   **The Libertarian/Functionalist View:** Argues the draft is necessary not because talent is undeserved, but because concentrated talent destroys the competition required for the market to exist.

  The practice fits the Rawlsian view, but it does not *require* it. The draft does not compensate players for the "moral arbitrariness" of their talent; it restricts their earnings to subsidize weaker franchises. The belief presupposed is not that talent is undeserved, but that **talent is a common resource of the league**. By entering the league, a player's labor becomes a shared input. The draft presupposes that the *value* of the talent is created by the league structure, not just the individual athlete.

  ### 3. Internal Coherence (Asymmetries and Lotteries)
  Is the practice internally coherent?

  There is a glaring incoherence if viewed through a lens of justice, but coherence if viewed through a lens of **market segmentation**.
  *   **Players vs. Coaches:** Players are capped because they are the *product* displayed on the field. Their scarcity drives the parity. Coaches and facilities are *capital inputs*. Capping capital inputs would reduce the overall quality of the product without necessarily improving parity (rich owners would still find edges). The system presupposes that labor is the primary variable of competitive balance, while capital is a variable of quality enhancement.
  *   **Draft vs. Free Agency:** This is the tension between **redistributive justice** (draft) and **meritocratic liberty** (free agency). The system unifies them temporally. Early in a career, the player belongs to the league (draft); later, the player belongs to himself (free agency). This is not a philosophical unity but a bargaining compromise.
  *   **The Lottery Patch:** The introduction of lotteries to prevent tanking reveals the true goal. If the goal were *justice* for the worst teams, you would *want* them to pick first to correct the imbalance. By blunting the reward for losing, the league admits that **competitive integrity** (trying to win) is more valuable than **distributive fairness** (helping the weak).

  This sequence suggests the "shape" of the outcome is not a moral end-state but a **constraint on behavior**. The goal is not to make teams equal, but to make them *appear* to be trying equally hard. It is a theory of **aesthetic justice** (the game must look competitive) rather than economic justice.

  ### 4. The CBA and Consent
  Does the Collective Bargaining Agreement change the presupposition?

  Yes, it shifts the justification from **paternalism** to **contractarianism**.
  If owners imposed the cap unilaterally, it would be an exploitation of monopsony power (a justice violation). By negotiating it through the union, the restriction becomes a trade-off. Players surrender the liberty to maximize individual salaries in exchange for a guaranteed share of gross revenue (R) and benefit security.

  This presupposes a theory of **negotiated order**. It implies that "justice" in this industry is not about the distribution of wealth itself, but about the **process of agreement**. However, this is complicated by the fact that the union represents current players, while the draft restricts *future* players (rookies) who have no vote. The arrangement presupposes that veterans have the right to bargain away the liberty of rookies. This is internally unjust by democratic standards but standard in labor cartels. It legitimizes the restriction procedurally, even if the outcome remains patterned.

  ### 5. The Counterfactual: A Purely Historical View
  What if they dropped parity for a historical entitlement view (Nozickian)?

  If the leagues adopted a purely historical view—where a distribution of talent is just so long as it arose from consensual signings—the leagues would look like European soccer (pre-Financial Fair Play).
  *   **The Look:** A permanent hierarchy. A handful of "super clubs" (NY, LA, Toronto) would dominate championships decade after decade. Small markets would become feeder teams or cease to exist.
  *   **The Justification:** Liberty. Owners can spend what they earn; players can sell their labor to the highest bidder.
  *   **What is Lost:** It is not a loss of *justice* (in the libertarian sense); it is a loss of **narrative viability**.
      *   **Hope:** Fans of small-market teams lose the rational hope of winning.
      *   **Uncertainty:** The value of the product relies on the uncertainty of the outcome. If the winner is pre-determined by payroll, the "sport" becomes an exhibition.
      *   **National Interest:** In North America, leagues are viewed as national trusts. A league that abandons parity abandons its claim to represent the continent.

  **Conclusion:**
  The current arrangement presupposes a theory of **Rule Utilitarianism** specific to the institution. It argues that liberty (uncapped salaries) must be restricted because the *consequences* of that liberty (dynasties, market collapse) would destroy the institution that makes the liberty valuable.

  It is not a theory of social justice. It does not care if the player is fairly compensated relative to the owner, or if the small-market fan "deserves" a win. It cares only that the **uncertainty of the outcome** is preserved. The "parity" vocabulary is a moral mask worn by an economic necessity. If they dropped the parity rationale, they would not commit an injustice; they would commit **commercial suicide**. The loss is not of justice, but of the **common good of the spectators**, which the league has decided takes precedence over the **liberty of the participants**.
