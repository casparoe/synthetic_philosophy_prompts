          *   *Column 1: Issue.* *Column 2: Schopenhauerian Formulation.* *Column 3: Formalist Formulation.*
          *   *Issue 1: Source of Tension.* (Will vs. Syntax).
          *   *Issue 2: Ontological Status.* (Metaphysical Copy vs. Immanent Structure).
          *   *Issue 3: The "Drone" Case.* (Direct Will vs. Timbral/Spectral Form).
          *   *Issue 4: The "Serialism" Case.* (Will denied vs. Form too abstract).

      *   **Section 3: The Cruxes (Where the rubber meets the road):**
          *   What would actually change their minds?
          *   *Crux 1: The Physiological Link.* Does music bypass cognition to hit the body?
              *   *Test:* Subliminal rhythm or infrasonic bass.
              *   *Preds:* Schopenhauer (Direct Will stimulation), Formalist (Physiological precondition for form perception).
          *   *Crux 2: Cross-Cultural Universality.* Is the "striving" structure universal or learned?
              *   *Test:* Western vs. Non-Western tonal systems regarding tension/release.
              *   *Preds:* Schopenhauer (Universal Will), Formalist (Learned Syntax).
          *   *Crux 3: The "Dead" Complex Piece.* Why does intellectual perfection fail to move?
              *   *Test:* Algorithmic generation vs. Human composition.
              *   *Preds:* Schopenhauer (No Will behind it), Formalist (Listener hasn't learned the syntax).

      *   **Section 4: Verbal Disputes:**
          *   Is "Will" just a word for "Dynamic Pattern"?
          *   Is "Form" just a word for "Objectified Will"?
          *   Identify where the terminology overlaps.

  4.  **Refining and Polishing:**
      *   *Check:* Did I address the Drone/Serialism point specifically? Yes, in Agreed Claims and Disagreements.
      *   *Check:* Is the tone right? Needs to be philosophical but practical for a reading group.
      *   *Check:* Is the "Halfway House" addressed? Yes, in the Cruxes (Phenomenology vs. Metaphysics).
      *   *Self-Correction on Cruxes:* Make sure the predictions are distinct. If both predict the same outcome, it's not a good crux.
