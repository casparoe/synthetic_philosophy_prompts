  ### 5. Gaming Concept vs. Inputs

  **Move 4 is gaming the inputs.**
  KS *requires* the ideal point $u$ as an exogenous input. If the protocol defines $u$ as "stated best case" rather than "max feasible payoff in $S$," then KS is structurally vulnerable to lying. Nash does not take $u$ as an input, so it is immune by design.

  **Does this distinction rescue KS from Moves 1 and 2?**
  *   **Move 1 (Moonshot):** No. Here $u$ changes because the feasible set $S$ genuinely changes ($u(S)$). This isn't gaming; it's the rule functioning as designed. The "embarrassment" here is only if you believe A *deserves* the full Nash reward for the investment. KS proponents would argue the proportional split is fairer.
  *   **Move 2 (Ceiling):** No. This is the deeper theoretical wound. Even if $u$ is calculated truthfully from the feasible set ($u=(60,100)$), KS still produces the counter-intuitive result where B benefits from A's constraint. This violates **Resource Monotonicity**. Distinguishing inputs doesn't fix the fact that the solution concept violates a core fairness axiom that Nash satisfies.

  ---

  ### 6. Uncertainty & Baseline Stacking

  **Least Sure Number:** **Move 1 KS Payoff (77.8).**
  *   **Why:** This relies on the ideal point $u$ updating to the new vertex $(140, 20)$. If your seminar defines $u$ as the "utopia point of the *original* problem" (fixed reference), KS would yield a different result. However, standard KS updates $u$ to $S'$.
  *   **What would change my mind:** If you argue that the "logistics network" doesn't change the *ideal* point because B can't access it, $u$ might stay $(100,100)$. But standard bargaining theory updates $u$ to the max feasible payoff in the current set.

  **Is the Baseline Stacked?**
  **Yes, quietly.**
  You chose a **linear frontier** ($x+y=100$) for the baseline.
  *   **Consequence:** On a symmetric linear frontier, Nash and KS *always* coincide. This hides the differences between the rules until you introduce asymmetry.
  *   **Impact:** If your baseline were strictly concave (e.g., $x^2 + y^2 = 100^2$), Nash and KS would diverge even in the baseline (Nash would be more egalitarian, KS more skewed toward the ideal).
  *   **Verdict:** The linear baseline makes the "Move 2" and "Move 4" critiques of KS look *worse* than they might in a curved environment, because the baseline coincidence makes the deviation look like a pure error rather than a structural difference. However, for a teaching exercise, the linear baseline is preferable because it isolates the *moves* as the source of divergence.

  **Final Sanity Check:**
  Move 2 is the killer app for this exercise. The fact that B's payoff rises from 50 to 62.5 when A's options are restricted is a violation of **Solidarity**. If you want to show KS has "teeth" (or rather, that KS has vulnerabilities), Move 2 is the jawbreaker. Nash passes it effortlessly. This is a robust exercise.
