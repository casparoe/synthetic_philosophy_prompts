  **Move 1: Moonshot Buyout**
  *   **Geometry:** Frontier is segment $(0,100)$ to $(140,20)$. Equation: $4x + 7y = 700$.
  *   **Ideal Point:** $u = (140, 100)$.
  *   **Nash:** Max $x(100 - \frac{4}{7}x)$. FOC $\rightarrow x = 87.5$.
  *   **KS:** Ray $y = \frac{100}{140}x = \frac{5}{7}x$. Intersect $4x + 7(\frac{5}{7}x) = 700 \rightarrow 9x = 700 \rightarrow x \approx 77.8$.
  *   **A's Payoff:** **Nash 87.5** | **KS 77.8**

  **Move 2: Ceiling Trim**
  *   **Geometry:** Frontier is segment $(0,100)$ to $(60,40)$. Equation: $x+y=100$ (for $x \le 60$).
  *   **Ideal Point:** $u = (60, 100)$.
  *   **Nash:** Unconstrained max is $(50,50)$. Since $50 \le 60$, constraint doesn't bind.
  *   **KS:** Ray $y = \frac{100}{60}x = \frac{5}{3}x$. Intersect $x + \frac{5}{3}x = 100 \rightarrow \frac{8}{3}x = 100 \rightarrow x = 37.5$.
  *   **A's Payoff:** **Nash 50.0** | **KS 37.5**

  **Move 3: Pie Expansion**
  *   **Geometry:** $x+y=120$. $u=(120,120)$.
  *   **Nash:** Symmetric max $\rightarrow (60, 60)$.
  *   **KS:** Ray $y=x$ intersects $x+y=120 \rightarrow (60, 60)$.
  *   **A's Payoff:** **Nash 60.0** | **KS 60.0**

  **Move 4: Aspiration Padding**
  *   **Geometry:** $x+y=100$. $u_{stated}=(130, 100)$.
  *   **Nash:** Ideal point irrelevant. Solution remains $(50, 50)$.
  *   **KS:** Ray $y = \frac{100}{130}x = \frac{10}{13}x$. Intersect $x + \frac{10}{13}x = 100 \rightarrow \frac{23}{13}x = 100 \rightarrow x \approx 56.5$.
  *   **A's Payoff:** **Nash 50.0** | **KS 56.5**

