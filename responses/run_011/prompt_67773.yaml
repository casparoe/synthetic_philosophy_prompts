  ### 4. Embarrassment Scores (0–10)

  **Kalai–Smorodinsky**
  *   **Move 1:** **3/10.** KS moderates A's gain compared to Nash. Not embarrassing, just different. It shows KS prioritizes proportional concessions over rewarding skewed investment.
  *   **Move 2:** **9/10.** **The "Ray of Shame."** Restricting A's options (removing $x > 60$) actually *increases* B's payoff (from 50 to 62.5) under KS. A fairness rule where hurting one party helps the other is intuitively broken.
  *   **Move 3:** **0/10.** Both rules handle symmetric expansion identically.
  *   **Move 4:** **10/10.** **Pure Manipulability.** A can increase their payoff by $6.5 simply by lying on a spreadsheet. The rule is not incentive compatible.

  **Nash**
  *   **Move 1:** **1/10.** Nash rewards the investment aggressively. Some might call this "greedy," but it satisfies monotonicity.
  *   **Move 2:** **0/10.** **Strength.** Nash satisfies Independence of Irrelevant Alternatives (IIA). Removing options that weren't going to be chosen doesn't change the outcome.
  *   **Move 3:** **0/10.** Neutral.
  *   **Move 4:** **0/10.** **Strength.** Nash does not use the ideal point as an input. It is immune to cheap talk.

