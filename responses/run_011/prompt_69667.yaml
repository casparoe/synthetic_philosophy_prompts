      *   *Self-Correction on Section 1:* Ensure the question isn't just "What is the right description?" but "What *fixes* the description?"
      *   *Refining the "Five Families" critique:* Make sure to explicitly state that they are first-order moral arguments, not second-order meta-ethical arguments about description.

