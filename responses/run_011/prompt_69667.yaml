answer: |-
  **Project Title:** The Granularity of Obligation: Act-Description and the Inefficacy Objection

  **1. Research Question**
  The central research question is: **By what normative or metaphysical principle is the granularity of act-description fixed in cases of putative inefficacy?**

  This question is framed to exclude open-ended surveys of existing literature. It demands a specific criterion that determines when an act should be described narrowly (e.g., *buying this specific steak*) versus broadly (e.g., *participating in industrial animal agriculture*). There are four determinate possible answers this project will evaluate:
  1.  **Causal Realism:** The description is fixed by the actual causal structure of the harm, independent of the agent's perspective.
  2.  **Agential Control:** The description is fixed by the granularity at which the agent genuinely exercises voluntary control.
  3.  **Deliberative Perspective:** The description is fixed by the conceptual categories under which the agent actually deliberates.
  4.  **Pragmatic Pluralism:** There is no single fixed granularity; the description is selected based on the specific normative purpose of the evaluation (blame, guidance, policy).

  The project seeks to identify which of these principles, if any, can non-arbitrarily select the act-description required to resolve the inefficacy objection without circularity.

  **2. The Limitations of the Five Families**
  The five existing families of replies to the inefficacy objection (probabilistic, threshold, cumulative, non-effectivist, and relocating) leave the research question open because they operate at the wrong logical level. They are first-order moral arguments that presuppose a description rather than second-order meta-ethical arguments that justify one.

  The causal families (probabilistic, threshold, cumulative) implicitly rely on broad descriptions (*eating meat*, *driving cars*) where causal connections to harm are statistically or structurally viable. Under a narrow description (*eating this specific steak*), these replies often lose their traction, as the causal chain to a specific animal's death is broken or imperceptible. Conversely, the non-causal families (non-effectivist, relocating) often gain their plausibility only under narrow descriptions where causal efficacy is absent, forcing a shift to complicity or integrity-based arguments.

  Consequently, none of the five families is a candidate answer to the research question. They are rival moral verdicts that depend on a prior, unargued assumption about how the act is individuated. To adjudicate between them, one must first solve the description problem. If the project proceeds without isolating this variable, it will merely replicate the existing stalemate, with proponents of different families talking past one another by utilizing incompatible granularities of evaluation.

  **3. Constraints on Act-Description**
  The project will evaluate four candidate constraints on act-description:
  1.  **Causal Structure:** The description must map onto the actual causal joints of the world. If the harm occurs via a threshold mechanism, the description must reflect the threshold unit.
  2.  **Agential Control:** The description must correspond to a unit of behaviour the agent can physically and psychologically initiate or withhold.
  3.  **Deliberative Perspective:** The description must match the concepts available to the agent at the time of choice.
  4.  **Pragmatic Pluralism:** Descriptions are tools; the "correct" one depends on whether the goal is assigning blame, guiding future action, or designing institutions.

  **Primary Focus:** The project will take **Agential Control** most seriously, constrained by **Causal Structure**.
  **Deciding Consideration:** The choice between these constraints will be decided by the **Non-Gerrymandering Condition**. A valid constraint must prevent agents from selecting descriptions solely to evade obligation or to manufacture blame where none intuitively exists. If *Agential Control* allows an agent to describe an act so narrowly that it escapes all normative force (e.g., *moving this muscle fiber* rather than *voting*), it fails. If *Causal Structure* demands descriptions so broad they exceed the agent's capacity to understand or influence (e.g., *sustaining global capitalism*), it fails. The project will test which constraint best balances the requirement that the agent *could have done otherwise* with the requirement that the act *makes a difference*.

  **4. Staged Work Plan (18 Months)**
  *   **Months 1–3: Conceptual Mapping.**
      *   Task: Systematize the five families of replies not by their moral verdicts, but by the implicit act-descriptions they require to function.
      *   Output: A working paper distinguishing first-order moral replies from second-order description constraints.
  *   **Months 4–9: Framework Development.**
      *   Task: Develop the "Agential Control constrained by Causal Structure" model. Define the metrics for "genuine control" and "causal joints."
      *   Output: Draft of the core theoretical framework; presentation at one mid-cycle workshop.
  *   **Months 10–15: Case Application.**
      *   Task: Apply the framework to the three test cases (Flight, Meat, Voting). Refine the model based on friction points where the framework yields counter-intuitive results.
      *   Output: Two journal-article drafts applying the framework to specific domains (consumption and political participation).
  *   **Months 16–18: Synthesis and Dissemination.**
      *   Task: Finalize the monograph prospectus or lead article. Address failure conditions and scope limitations.
      *   Output: Submission of lead article; final project report.

  **5. Testing the Framework**
  The framework will be tested on three distinct cases to ensure it handles different causal topologies.

  *   **Case 1: Single Long-Haul Flight (Continuous Harm).**
      *   *Challenge:* Emissions are continuous and additive.
      *   *Test:* Does the framework describe this as *taking this flight* (control) or *adding to atmospheric carbon* (causal)?
      *   *Success:* The framework identifies a description that acknowledges the small individual contribution without dissolving it into insignificance, avoiding the need for probabilistic gymnastics.
  *   **Case 2: Single Meal of Factory-Farmed Meat (Threshold/Causal Chain).**
      *   *Challenge:* Harm depends on aggregate demand triggering production cycles.
      *   *Test:* Does the framework allow *buying this steak* or require *participating in the market*?
      *   *Success:* The framework selects a description that respects the threshold nature of the supply chain without requiring the agent to have knowledge they cannot possess.
  *   **Case 3: Decision Not to Vote (Collective Decision Procedure).**
      *   *Challenge:* Causal impact is near-zero; harm/benefit is mediated by collective rules.
      *   *Test:* Does the framework describe this as *casting a ballot* or *upholding democratic norms*?
      *   *Success:* The framework justifies a broad description (*participating in democracy*) based on the agent's control over their role in the procedure, even if causal impact on the outcome is negligible.

  In all three cases, a successful result is a consistent application of the description constraint that yields stable moral verdicts without ad-hoc adjustments to the description to fit the desired outcome.

  **6. Explicit Failure Conditions**
  The project will be deemed to have failed if either of the following occurs:

  1.  **Consequentialist Collapse:** The constraint on act-description turns out to be consequentialist all the way down. This would occur if the "correct" description is selected solely because it yields the best overall consequences, rather than based on independent criteria of control or causality. If the framework merely disguises a calculation of expected utility as a theory of description, it fails to arbitrate the debate.
  2.  **Unfalsifiable Licensing:** The framework becomes a device for licensing any verdict an agent prefers. This would occur if the *Agential Control* or *Pragmatic* constraints are so flexible that an agent can legitimately choose a narrow description to excuse harm or a broad description to condemn trivialities, with no external check on the validity of that choice.

  To avoid these failures, the project must establish independent criteria for valid descriptions that precede moral evaluation.

  **7. Candid Scope Assessment**
  **Deliverable in 18 Months:**
  The project can deliver a robust theoretical framework for act-description and a demonstration of its viability across the three test cases. It will produce two journal articles and a comprehensive working paper that clarifies why the inefficacy debate has stalled.

  **Left for Later:**
  1.  **Empirical Validation:** This project is conceptual. It will not test how agents *actually* describe acts psychologically, only how they *ought* to. A subsequent project would be needed to integrate empirical moral psychology.
  2.  **Institutional Design:** While the "relocating" reply is analyzed, the project will not fully develop a theory of institutional obligation. It focuses on individual evaluation.
  3.  **Meta-Ethical Grounding:** The project will operate largely within a normative framework. A deeper investigation into the metaphysics of action required to fully ground the "Agential Control" constraint is beyond the 18-month window and would require a separate, longer-term inquiry.

  This scope ensures the project remains focused on the diagnostic hypothesis—that the debate stalls on description—without overextending into general meta-ethics or empirical sociology.
