  *(Word Count Check)*: A standard single-spaced page is about 500-600 words. Three pages is roughly 1500-1800 words. I will aim for that range to ensure sufficient depth without fluff.

  *(Final thought on the "Research Question")*: It needs to be sharp. "What principle governs the selection..." is good. Let's make it: "By what normative principle is the granularity of act-description fixed in cases of putative inefficacy?"

