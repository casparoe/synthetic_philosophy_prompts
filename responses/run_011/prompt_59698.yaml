      *   **The Domination Charge (The Meat):**
          *   Focus on the interviewee. He claims freedom (Negative) but experiences domination (Republican).
          *   *Arbitrariness:* Does the algorithm track his interests? No. It tracks efficiency/profit.
          *   *Multi-apping:* Is this freedom or just diffused domination? Pettit would say if the *structure* allows arbitrary interference, you aren't free, even if you have three masters instead of one. It's "serial domination."
          *   *The "Unexercised" Power:* Republicanism says the *existence* of the power matters. The sword hanging by a thread.
      *   **Where the Frame Breaks (The Critique):**
          *   *Inversion:* Platforms (capital) used Negative Liberty language. Labor (usually Negative liberty defenders against state) used Republican language against private power.
