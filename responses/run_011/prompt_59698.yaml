          *   *Unfalsifiability:* If all employment is domination (at-will), the concept loses bite. Need to distinguish *structural* arbitrariness (algorithmic black box) from *contractual* arbitrariness (boss can fire you, but there are norms/laws). Prop 22 makes the arbitrariness *statutory*.
          *   *Silence:* Theory doesn't account for the *cost* of the ballot campaign ($200m). Money as a distortion of liberty.
