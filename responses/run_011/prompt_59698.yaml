      *   **Positive Liberty (Self-mastery/Capacity):**
          *   *Core:* Freedom to achieve one's potential. "Do I have the resources to walk through the door?"
          *   *AB5 View:* Without benefits/wages, drivers aren't truly free to sustain themselves. They are coerced by economic necessity.
          *   *Prop 22 View:* The stipend/wage floor *is* a form of positive liberty enhancement without sacrificing negative liberty (theoretically).
          *   *Mapping:* Labor unions + Full-time drivers vs. Platforms.
          *   *Tension:* Berlin's warning (Positive liberty leads to coercion) vs. Reality (Platforms used Negative liberty rhetoric to secure a deal that *includes* some positive liberty benefits but locks out democratic revision).

      *   **Republican Liberty (Non-domination):**
          *   *Core:* Freedom from arbitrary power. "Does someone hold the keys to the door, even if they don't lock it?"
          *   *AB5 View:* Algorithmic management is arbitrary power. Deactivation without appeal is domination.
          *   *Prop 22 View:* Multi-apping reduces dependence. Exit is easy.
          *   *Mapping:* The specific interviewee is the test case.
          *   *Key Question:* Is the *capacity* to deactivate arbitrary? Does multi-apping solve it?

  3.  **Drafting the Analysis - Section by Section:**

