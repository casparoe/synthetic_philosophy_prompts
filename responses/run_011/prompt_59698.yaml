      *   *Check:* Is the distinction between Negative and Republican clear? Negative = no interference. Republican = no *ability* to interfere arbitrarily. The interviewee *was* interfered with (deactivated), so Negative liberty was violated temporarily. But Republican says he was unfree *before* that because the power existed.
      *   *Check:* The Inversion. This is crucial. Usually, Left = Positive/Republican, Right = Negative. Here, Uber/Lyft = Negative (don't touch our model). But they *also* created a statutory benefit scheme (Positive) that is immune to democracy (Anti-Republican?). Actually, locking out the legislature is the ultimate domination over the citizenry. That's a strong point.

  5.  **Final Polish:**
