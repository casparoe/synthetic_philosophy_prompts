answer: |-
  There is no single established term in the history of economic thought that captures the specific *inference* you have isolated. Existing labels describe the *nature* of the money (token, fiduciary, chartal) or the *consequence* of over-issue (inflation), but none name the logical slide from "money is a counter" to "counters are unlimited."

  If I insisted you use an existing label, I would nominate **Chartalism** (or the State Theory of Money). It reaches furthest because it grounds the value of money in state authority and function rather than commodity content, which is the necessary precondition for your pattern. However, it stops short because classical Chartalism (Knapp, etc.) does not inherently argue for unlimited quantity; it argues for state *acceptability*, not state *infinity*. It describes the *source* of validity, not the *elasticity* of supply.

  **Fiduciary or Token Money** describes the object but not the argument for expansion. **Money as a Veil** describes neutrality (money doesn't matter long-run) but implies that adding more veils changes nothing, not that it helps. **Instrumentalism** describes the functional premise but, as you note with Berkeley, typically demands calibration, not expansion. **The Quantity Theory** is the corrective, not the pattern itself.

  Since no existing term captures the *move* itself, I coin the term **The Instrumentalist Quantity Fallacy**.

  ### Definition
  **The Instrumentalist Quantity Fallacy** is the erroneous inference that because a medium's value is purely functional (instrumental) rather than intrinsic (commodity), its supply is not subject to scarcity constraints relative to the activity it facilitates. It conflates the *ontological status* of the medium (it is a sign, not a thing) with the *economic conditions* of its circulation (signs must remain scarce relative to referents to retain signaling power).

  ### Boundary Cases
  To ensure this carving is clean, here is how it handles your specific test cases:

  1.  **The Quantity Theory's Denial of Long-Run Neutrality:** This is the **reply** to the fallacy, not an instance of it. The Quantity Theory asserts that increasing counters *does* change real variables (prices), thereby denying the fallacy's conclusion that supply is unconstrained.
  2.  **Gresham's Law:** This is **outside** the pattern. Gresham's Law concerns the *composition* of circulation (bad money drives out good) based on legal tender laws and intrinsic value differentials. It does not address the inference from functionalism to unlimited supply.
  3.  **Credential Inflation:** This **instantiates** the fallacy. The argument "degrees are only signals, so we can issue more" follows the exact same logic: because the credential is a token of prior effort (functional) rather than the effort itself (intrinsic), the supply of tokens is treated as de-coupled from the scarcity of the underlying effort.

  ### Verdict on the Argument Form
  You asked whether this bundled move is a genuine tendency of instrumentalist reasoning or a straw man that loads instrumentalism with a conclusion its better proponents reject.

  **Verdict:** It is a **genuine rhetorical tendency** within the history of instrumentalist discourse, but it is a **logical corruption** of instrumentalist theory.

  You have not mis-described the *history*; proponents in the 1730s (and later land-bank advocates, and modern monetary expansionists) frequently made this slide. It arises from a systematic equivocation on the word "value." When the instrumentalist proves money has no *intrinsic* value (it is not wealth), the audience hears that it has no *economic* constraints. The move is genuine in practice because it exploits a cognitive gap between *metaphysical* worthlessness (it's just paper) and *economic* worthlessness (it's useless).

  However, you are correct that rigorous instrumentalists (like Berkeley) reject the conclusion. Berkeley's instrumentalism is *cybernetic*: the money is a tool to measure and stimulate industry. If the tool's scale expands without the industry expanding, the measurement fails. Therefore, the "unlimited supply" conclusion is not a valid deduction from the "functional value" premise. It is a **non-sequitur** that historically attaches itself to the premise because both rely on dematerializing money.

  ### Note on Confidence
  I am least confident in two areas regarding how this carving matches actual usage:

  1.  **Modern Monetary Theory (MMT):** MMT is the modern descendant of Chartalism. Proponents argue the state cannot run out of money (matching your pattern's second half) but insist spending is constrained by inflation/resources (matching your critique). My definition risks classifying MMT as committing the fallacy, whereas MMT proponents would argue they accept the constraint, merely relocating it from *revenue* to *real capacity*. The boundary here is thin.
  2.  **The Real Bills Doctrine:** This 18th/19th-century doctrine argued that money issued against real commercial transactions would self-regulate and not be inflationary. It shares the "money is a counter" premise but argues for *automatic constraint* rather than *unlimited license*. Distinguishing the Instrumentalist Quantity Fallacy from the Real Bills Doctrine requires careful attention to whether the proponent believes the supply *can* be unlimited (Fallacy) or *will* be self-limiting (Real Bills).

  In sum, name it **The Instrumentalist Quantity Fallacy**. It validates your intuition that the move is distinct, historically real, but logically defective.
