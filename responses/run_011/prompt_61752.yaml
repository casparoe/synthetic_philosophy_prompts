answer: |-
  # The World W Diagnostic Instrument

  **Instructions:** Read each scenario regarding World W. Select the option that best matches your judgement about how things stand in that world. Do not worry about standard labels; answer according to what you think is actually the case in W.

  ### The Questions

  **1. The Halving Rule (Stipulation 1)**
  In World W, whenever a mote meets a knot, half the charge is transferred. This happens in every single case. If there had been twice as many motes, it would still have happened. Why does it happen?
  *   **A.** Because the nature of motes and knots *makes* it happen; they simply cannot interact otherwise.
  *   **B.** Because it is a fundamental rule that tells the motes and knots what to do, independent of their natures.
  *   **C.** Because this pattern is the most efficient way to describe the total history of motes and knots, and nothing deeper explains it.

  **2. The Knot Colour (Stipulation 2)**
  All knots are the same colour, but only because of a fluke early event. The Halving Rule does not require this. Is the uniform colour a law of W?
  *   **A.** No, because it does not support counterfactuals; the knots could easily have been different colours.
  *   **B.** Yes, provided stating it helps simplify the total description of W, even if it is accidental.
  *   **C.** No, because there is no necessary connection between being a knot and having that colour.

  **3. The Single Exception (Stipulation 3)**
  A generalisation holds for the first 10^19 events but fails once near the end. The best simple systematisation of W's history predicts this failure and assigns it a probability. Is the generalisation a law?
  *   **A.** No, a law cannot have exceptions; if it fails once, it was never a law.
  *   **B.** Yes, laws can be probabilistic; the 'failure' is just a low-probability outcome allowed by the law.
  *   **C.** Yes, because the systematisation that includes it (with the probability) is still the best balance of simplicity and strength for the whole history.

  **4. The Gerrymandered Truth (Stipulation 4)**
  There is a statement that is exactly true of W's entire history, but writing it down requires more symbols than writing down the entire history of W. Is this statement a law?
  *   **A.** No, a law must be simpler than the phenomena it describes.
  *   **B.** No, because it does not capture any genuine similarity in the nature of things.
  *   **C.** It depends on whether using it helps agents in W navigate their environment, regardless of length.

  **5. The Intervention (Stipulation 7)**
  An outside intervener could have produced an arrangement where the Halving Rule is violated. If they had, the rule would have failed. What does this tell us about the Rule's status in the *actual* history?
  *   **A.** It shows the Rule is not a genuine law, because genuine laws cannot be violated.
  *   **B.** It shows the Rule is a law, but laws only describe what happens in the actual course of events, not what interveners might do.
  *   **C.** It shows the Rule is a law, and the intervener's action would have changed the laws themselves for that scenario.

  **6. The Chance Mismatch (Stipulation 6)**
  A scattering process is indeterministic. The actual long-run frequency is 50/50, but the best simple systematisation of the whole history assigns it a chance of 0.3. What is the true chance?
  *   **A.** 0.5, because chance is nothing over and above the actual long-run frequency.
  *   **B.** 0.3, because chance is defined by the best systematisation, not the raw frequency.
  *   **C.** Neither, because objective chance does not exist; there are only degrees of belief.

  **7. The Late Explanation (Stipulation 5)**
  W's history begins in low entropy. However, a fact near the very end of W's history seems to explain some earlier goings-on better than the initial arrangement does. Is this acceptable?
  *   **A.** No, explanation must run from earlier to later; later facts cannot explain earlier ones.
  *   **B.** Yes, because laws are global constraints on the whole history, so any part can help explain any other part.
  *   **C.** Yes, provided the explanation is not causal; we can explain without implying the later event caused the earlier one.

  **8. The Nature of Motes (Stipulation 1 & 8)**
  Could the motes have existed but failed to follow the Halving Rule?
  *   **A.** Yes, laws are contingent; the same motes could have obeyed different rules.
  *   **B.** No, if they failed to follow the Rule, they would not have been motes; their identity is tied to the Rule.
  *   **C.** Yes, but only if the fundamental properties of the motes were different.

  **9. The Source of Order (General)**
  Looking at the regularities in W, where does the order come from?
  *   **A.** From the properties of the things themselves; they are disposed to behave this way.
  *   **B.** From the laws themselves; the laws impose order on otherwise chaotic things.
  *   **C.** From the fact that there is order; the laws are just the name we give to that order.

  **10. The Skeptical Challenge (General)**
  Suppose someone claims there are no laws in W, only patterns. What is the strongest objection to this claim?
  *   **A.** It cannot account for the difference between the Halving Rule and the Knot Colour regularity.
  *   **B.** It cannot account for why the patterns hold rather than some other patterns.
  *   **C.** There is no strong objection; 'law' is just a useful term for very stable patterns.

  ***

  ### Scoring Key and Position Mapping

  *Note: Positions are abbreviated as follows: **BSH** (Best-Systems Humeanism), **PH** (Pragmatist Humean), **NT** (Necessitation between Universals), **DE** (Dispositional Essentialism), **PG** (Primitivist Governing), **NN** (Natural Necessity/Stability), **SK** (Skeptic/No Laws).*

  | Q | Option | Most Likely Positions | Notes on Overlaps |
  | :--- | :--- | :--- | :--- |
  | **1** | **A** | **DE**, **NT** | Both tie laws to the nature of relata. DE focuses on dispositions, NT on relations between universals. |
  | | **B** | **PG**, **NN** | Both view laws as distinct from properties. PG sees them as commanders; NN as stable constraints. |
  | | **C** | **BSH**, **PH**, **SK** | All deny a deeper metaphysical glue. SK denies laws exist; BSH/PH reduce them to systematisation. |
  | **2** | **A** | **PG**, **NT**, **DE**, **NN** | Non-Humeans generally require counterfactual robustness for lawhood. |
  | | **B** | **BSH** | Classic BSH move: if it fits the Best System, it's a theorem/law, even if accidental. |
  | | **C** | **PH**, **SK** | Pragmatists and Skeptics focus on utility or deny the distinction entirely. |
  | **3** | **A** | **PG**, **NT**, **DE** | Strict views often struggle with probabilistic exceptions unless built-in. |
  | | **B** | **NN**, **DE** | Dispositionalists and Stability accounts handle propensity/probability well. |
  | | **C** | **BSH**, **PH** | BSH explicitly allows probabilistic laws if they optimise the system. |
  | **4** | **A** | **BSH**, **NT** | Both value simplicity (BSH for system, NT for universals). |
  | | **B** | **DE**, **PG** | Focus on genuine similarity or governing power rather than syntax. |
  | | **C** | **PH** | Pragmatists prioritise utility for agents over objective simplicity. |
  | **5** | **A** | **PG**, **NT** | Governing views often treat violations as nomologically impossible. |
  | | **B** | **BSH**, **SK** | Humeans see laws as descriptions of actual history; interventions change the history, not the 'law' status of the past. |
  | | **C** | **NN** | Stability accounts might say the laws shift to accommodate the new stable set. |
  | **6** | **A** | **SK**, **NT** (sometimes) | Frequentist views or those denying objective chance. |
  | | **B** | **BSH** | Distinctively Lewisian: Chance = Best System Probability, even if frequency diverges. |
  | | **C** | **PH**, **SK** | Subjectivists or those denying objective chance. |
  | **7** | **A** | **PG**, **DE** | Governing and Dispositional views usually respect temporal direction of production. |
  | | **B** | **BSH**, **NN** | Global views (Best System, Stability) allow backward explanation via global constraints. |
  | | **C** | **NT**, **PH** | Distinguishes causal from non-causal explanation. |
  | **8** | **A** | **BSH**, **PG**, **SK** | Contingentists. Laws could have been otherwise for the same entities. |
  | | **B** | **DE** | Strong Dispositional Essentialism: properties *are* powers. No power, no property. |
  | | **C** | **NT** | Universals view: same property, different relation possible (though some NTs lean towards B). |
  | **9** | **A** | **DE** | Order comes from within (dispositions). |
  | | **B** | **PG**, **NN** | Order comes from without (laws constrain). |
  | | **C** | **BSH**, **PH**, **SK** | Order is brute; laws are labels. |
  | **10**| **A** | **NT**, **DE**, **PG** | Need to distinguish laws from accidents. |
  | | **B** | **PG**, **NN** | Need an explanation for the regularity itself. |
  | | **C** | **SK**, **PH**, **BSH** | Acceptance of the deflationary view. |

  ***

  ### Analysis of Logical Space and Instrument Limitations

  #### 1. Indistinguishable Pairs and the Eleventh Question
  The quiz cannot reliably separate **Best-Systems Humeanism (BSH)** from **Pragmatist Humeanism (PH)** on the basis of case judgements alone. This confirms your friend's suspicion: on concrete scenarios (like the Gerrymander or the Exception), both will often select the 'systematisation' or 'utility' options. They differ on *why* the system matters (truth vs. usefulness), which this quiz deliberately avoids asking to prevent jargon-matching.

  *   **The 11th Question:** To separate them, you must ask about truth conditions.
      *   *Question:* "If there were no agents in World W to use the systematisation, would the laws of W still be true?"
      *   *BSH Answer:* Yes (the Best System is objective).
      *   *PH Answer:* No (laws are tools for agents; no agents, no laws).

  #### 2. Empty Cells in Logical Space
  Several combinations of answers correspond to positions that are theoretically possible but rarely defended.

  *   **The "Necessitarian Skeptic" (Q1=A, Q10=C):** Someone who thinks properties necessitate outcomes but denies there are 'laws'.
      *   *Diagnosis:* **Unattractive.** This is Dispositional Essentialism without the label. It saves the phenomena but forfeits the vocabulary most users want.
  *   **The "Governing Frequentist" (Q1=B, Q6=A):** Someone who thinks laws push particles but chance is just frequency.
      *   *Diagnosis:* **Incoherent.** If laws govern indeterministic processes, they must determine the chances, not just the outcomes. If chance is just frequency, the law isn't governing the propensity, merely describing the result.
  *   **The "Humean Necessitarian" (Q1=C, Q8=B):** Someone who thinks laws are summaries but properties could not have been otherwise.
      *   *Diagnosis:* **Overlooked/Unstable.** This is a form of "Humean Essentialism". It is defensible (e.g., Wilson 2013) but rare. It suggests properties are fixed, but the laws describing them are just summaries.

  #### 3. Addressing Your Friend's Claim
  Your friend claims a Humean can accept every counterfactual a Necessitator accepts. **Question 5** puts pressure on this.
  *   Stipulation 7 says an intervener *could* violate the Halving Rule.
  *   **Necessitators (NT/PG/DE)** often struggle here. If the Rule is a law, is the violation *nomologically possible*? If they answer **5A**, they admit the Rule isn't a strict law. If they answer **5C**, they admit laws are mutable.
  *   **Humeans (BSH)** answer **5B** easily: The Rule describes the actual history. The intervention creates a *different* history with a *different* Best System.
  *   *Verdict:* The quiz reveals that while they might agree on the *outcome* of the counterfactual, they disagree on the *status* of the law in that counterfactual scenario. The Humean says the law changes; the Necessitator usually says the scenario is impossible or the law stays the same and is broken.

  #### 4. Artefacts vs. Philosophical Substance
  *   **Substantive Questions:** 1, 5, 6, 8, 9. These target the core metaphysical disagreements (source of modality, nature of chance, contingency).
  *   **Artefact-Loaded Questions:** 3, 4, 7.
      *   **Q3 (Exception):** This is heavily loaded towards **BSH**. Stipulation 3 essentially describes a Lewisian Best System (probabilistic exception included in the system). Non-Humeans (PG/NT) often insist on strict universals or require a specific propensity account not fully captured here.
      *   **Q4 (Gerrymander):** This relies on the specific BSH criterion of "simplicity". A Primitivist might reject it not because of length, but because it lacks "governing power". The question conflates syntax with metaphysics.
      *   **Q7 (Late Explanation):** This relies on Stipulation 5, which is physically unusual (late facts explaining early ones). While good for testing global vs. local views, it may confuse physicists used to strict causal ordering.

  #### 5. Running the Session
  *   **Time:** 30 minutes is tight for 10 questions with 15 people.
  *   **Recommendation:** Do not tally scores individually. Instead, project the questions one by one. Ask for a show of hands for A, B, C. When a split occurs (e.g., Q5 or Q6), pause and ask one person from each camp to justify their choice *without* using their preferred label. This forces the "diagnostic" work to happen in the discussion rather than in the scoring key.
  *   **Warning:** Be prepared for the "Pragmatist Humean" to claim they are "Realists" and the "Primitivist" to claim they are "Empiricists". The quiz is designed to make those self-reports look inconsistent with their case judgements.
