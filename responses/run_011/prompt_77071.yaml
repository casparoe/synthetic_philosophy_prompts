  **AUTHORITY FOR REFERENCE AND DESIGNATION**
  **Guidance Note 44.2: Operationalizing Two-Dimensional Semantics in Commercial Designation**
  **Status:** Mandatory | **Effective:** 01/04/2024 | **Replaces:** GN 12.1 (Direct Reference Framework)

  **1.00 Scope and Application**
  1.01 This Note applies to all regulated entities issuing labels, packaging, or standard contracts where natural kind terms, proper names, or indexicals appear. It supersedes all prior one-dimensional designation protocols. Firms must now submit dual-intension filings for all protected designations.
  1.02 The Primary Intension reflects the reference-fixing description accessible to a reasonable consumer a priori. Firms must evaluate this over centered scenarios (worlds considered as actual). This requires simulating the consumer's epistemic state without assuming knowledge of underlying chemical structures. This dimension governs claims regarding consumer expectation and marketing clarity. If the Primary Intension yields different extensions in different centered worlds, the label is deemed ambiguous.
  1.03 The Secondary Intension reflects the extension fixed by the actual world's physical facts. Firms must evaluate this over counterfactual worlds where the actual reference is held constant. This requires chemical assay and metaphysical verification. This dimension governs enforcement, product safety, liability, and tax classification. Discrepancies between Primary and Secondary Intensions must be logged in Form 2D-DISC.

  **2.00 The Centering Statement**
  2.01 To fix the Primary Intension, every submission must include a Centering Statement. This statement establishes the filer's epistemic position within the scenario space.
  2.02 The Statement must be knowable a priori by the filer yet contingent upon the world state. The approved formulation is: "The entity submitting this form is submitting this form here and now."
  2.03 Deviations void the filing. The Authority does not accept retrospective centering. If the filer cannot locate themselves within the scenario, the Primary Intension remains indeterminate, and the product cannot be sold. The Authority will not adjudicate disputes where the filer claims to be in a skeptical scenario.

  **3.00 Rigidifying Devices**
  3.01 The use of rigidifying devices ('actually', 'that', 'dthat') collapses the Primary Intension into the Secondary. Consequently, any label employing such devices requires a Class 4 Linguistic License.
  3.02 Applications must demonstrate necessity. Unlicensed rigidification constitutes false designation. Firms are reminded that rigidifiers freeze reference across all counterfactual worlds, eliminating consumer ambiguity at the cost of flexibility. Penalties for unlicensed rigidification include seizure of labeling stock and mandatory re-education seminars.

  **4.00 Consultation and Objections**
  4.01 During the consultation period, the National Packaging Federation argued: "This framework appears to be standard one-dimensional possible-worlds semantics with centered worlds appended as an extra procedural step, adding cost without semantic yield. It duplicates the work of context resolution and imposes an impossible burden on firms to distinguish epistemic possibilities from metaphysical necessities."
  4.02 The Authority notes this confusion and rejects it.

  **5.00 Status of This Note**
  5.01 This Guidance Note is to be read under its Secondary Intension for enforcement purposes. However, its Primary Intension governs whether a firm could have known it applied to them. Firms claiming ignorance based on Primary Intension evaluation must prove that no centered scenario exists where this Note was apparent.

  **Appendix A: Worked Determinations**
  1. *Case 882 (AquaVita):* Label read "Water." Primary intension satisfied (clear, drinkable liquid). Secondary intension failed (liquid was XYZ, not H₂O). Fine upheld. Consumer expectation met, chemical reality violated.
  2. *Case 904 (Hesperus Logistics):* Invoice charged for "Hesperus Delivery" and "Phosphorus Delivery." Secondary intension confirms identical referent (Venus Route). Double billing prohibited. Identity was necessary but not a priori knowable to accounts.
  3. *Case 915 (Indexical Imports):* Contract clause "Goods delivered here." Primary intension fixed by filing center. Delivery to warehouse voided contract as 'here' shifted. Context shift invalidated the Secondary Intension fixation.

  I treated two-dimensional semantics (à la Chalmers/Jackson) as settled statutory law rather than a contested philosophical framework. The satire leans on the epistemic/metaphysical distinction, turning the 'which world is actual' problem into a filing error. I simplified the diagonal proposition mechanism into a 'Centering Statement.' A specialist would note that Primary Intensions are not strictly speaker-relative in all 2D accounts, and that the 'actual' operator is often treated as non-rigid in epistemic contexts. The fatal objection—that agents cannot know which world is actual to fix Secondary Intensions—is enacted as a compliance burden rather than argued.
