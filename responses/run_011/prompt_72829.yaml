      *   **Requirements:**
          1.  A step-by-step decision procedure (questions, order, pass/fail criteria, escalation points).
          2.  Apply the procedure to three specific cases (Payday lender, Plasma center, College consulting).
          3.  Address two edge cases (Sponsored content/native advertising, Precedent/energy drink).
          4.  Honest critique of the procedure's limitations (gaming the system, cumulative effect, subjective judgment).
          5.  Tone: Respectful, direct, practical, not condescending, acknowledging the pressure (revenue vs. ethics).

  2.  **Drafting the Decision Procedure:**
      *   *Goal:* Make it actionable for high schoolers without ethics training.
      *   *Structure:* Funnel approach. Start with hard legal/safety nos, move to ethical gray areas, end with policy/vote.
      *   *Step 1: Legality & Safety (Hard No).* Is it illegal for minors? Is it dangerous?
      *   *Step 2: Relevance & Audience.* Does this actually serve the student body?
      *   *Step 3: Exploitation/Predation.* Is the business model based on vulnerability? (This hits the "repugnant market" idea).
      *   *Step 4: Editorial Integrity.* Does it compromise the news?
      *   *Step 5: The "Vibe" Check (Escalation).* If it passes the above but feels wrong, who decides?
      *   *Assignment:* Advisor vs. Board Vote. Legal/Safety = Advisor/Principal. Ethical/Policy = Board Vote.

  3.  **Applying the Procedure to the Three Cases:**
      *   *Case 1: Payday Lender.*
          *   Legality: Legal, but high interest.
          *   Audience: Minors mostly, some 18s.
          *   Exploitation: High. Targets financial desperation.
          *   Verdict: **NO.** (Step 3 failure).
      *   *Case 2: Plasma Donation.*
          *   Legality: 18+ only.
          *   Audience: Seniors (some 18).
          *   Exploitation: Gray area. Health risks vs. income.
          *   Verdict: **CONDITIONAL/NO.** Needs strict age gating or **NO** due to health/safety concerns for high schoolers. Let's lean towards **NO** for a HS paper due to health implications, or strict "18+ only" disclaimer. *Decision:* Better to say **NO** for a HS paper context to avoid encouraging selling bodily fluids, even if legal for 18s. It fails the "safety/well-being" check.
      *   *Case 3: College Consulting ($4k).*
          *   Legality: Fine.
          *   Audience: Relevant (college bound).
          *   Exploitation: Class issue. $4k is prohibitive. Creates inequity.
          *   Revenue: 1/3 of budget.
          *   Verdict: **HARD TRUTH.** Technically passes the checklist, but fails the "equity" check. This is the "Board Vote" item. If they reject it, they need a plan to replace 33% of revenue. *Honest answer:* **YES (with caveats)** or **NO (with financial plan).** I need to be straight. The procedure likely flags it as "High Cost/Equity Concern." It requires a Board Vote + Advisor.
          *   *Refinement:* The prompt asks me to be straight about the revenue dependency. I should conclude that the procedure *allows* it but flags the ethical cost, forcing a conscious trade-off.

  4.  **Addressing the Edge Cases:**
      *   *Sponsored Content:* This is native advertising. It blurs the line. Disclosure helps but doesn't fix the integrity issue. It turns the paper into a PR outlet. *Verdict:* Generally **NO** for news sections. If allowed, must be visually distinct, not just a tag.
      *   *Precedent (Energy Drink):* Sunk cost fallacy. Just because you did it doesn't mean you keep doing it. *Verdict:* Precedent is irrelevant. Re-evaluate every time.

  5.  **Critiquing the Procedure (The "Honest Failure" Section):**
      *   *Gaming:* Advertisers will sanitize copy.
      *   *Subjectivity:* "Exploitative" is subjective.
      *   *Cumulative Effect:* 20 "okay" ads can still make the paper feel like a catalog for predators. Need a "Portfolio Review."
      *   *Who runs the review?* Editor + Advisor + maybe a student rep not on board.

