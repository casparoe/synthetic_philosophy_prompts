  7.  **Self-Correction/Nuance Check during drafting:**
      *   *Correction:* Don't say "Lean is classical." Lean's kernel is constructive, `Classical` is an axiom. Make sure to distinguish `Prop` (proof irrelevant) from `Type` (data).
      *   *Nuance:* When discussing Kripke, distinguish between *partial functions* (computation) and *truth value gaps* (semantics). In TT, a partial function is `A -> Option B`. A truth gap is `Prop` that is neither provable nor refutable *by design*.
      *   *Nuance on Dialetheism:* Don't just say "Impossible." Say "Requires changing the kernel."
      *   *Nuance on Deflationism:* The "ill-typed" move is actually very strong in TT. The Liar *is* a type error if you enforce stratification. But is that solving the paradox or banning the sentence?

