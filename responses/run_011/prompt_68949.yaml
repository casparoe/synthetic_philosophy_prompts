      *   *But:* TT is about *consistency* and *computation*. Truth theories are often about *semantics* and *metaphysics*. The mapping isn't 1:1.

  3.  **Drafting the Translations (Mental Sandbox):**

      *   **Tarski:** Hierarchy of languages. In TT: Universe Hierarchy (`Type 0`, `Type 1`, ...). Truth predicate for `Type i` lives in `Type (i+1)`.
          *   *Revenge:* "True at some level." In TT: `Tr : Sigma (i : Level), ...`? No, usually just leads to needing a larger universe.
      *   **Kripke:** Fixed points, gaps. In TT: Partial functions? `Option Prop`? Or inductive/coalgebraic definitions? `Prop` is usually classical in mathlib, but computationally it's about evidence. A gap means no term inhabits it, but it's not `False`.
          *   *Challenge:* In TT, if you can't construct a term, it's not "false," it's just unproven. But `Prop` is proof-irrelevant. A "gap" needs to be distinct from `False`. Maybe `Inductive TruthValue : Type := | true | false | gap`.
      *   **Gupta:** Revision theory. Iteration. In TT: A function `F : (Nat -> Prop) -> (Nat -> Prop)`. Look for stability.
          *   *Challenge:* TT is about static correctness, not dynamic revision processes over time.
      *   **Priest (Dialetheism):** True and False. In TT: `True /\ False`. This implies `False`. In standard TT, this explodes. To model this, you need a paraconsistent logic. Lean isn't paraconsistent.
          *   *Translation:* You'd need to change the underlying logic (remove explosion).
      *   **Field:** Paracomplete. No Excluded Middle (LEM). In TT: Constructive logic (`Prop` without `Classical.em`). "Determinacy" operator?
          *   *Translation:* Intuitionistic Type Theory handles this naturally.
      *   **Deflationism:** Defective sentence. In TT: Ill-typed term. The Liar isn't a `Prop`, it's a type error.
          *   *Challenge:* This is the "untypable" move the user warned against.

  4.  **Developing the Residue Report (The Core Value):**
      *   *Universe Hierarchy vs. Tarski:* It's structural, but the *motivation* differs. Tarski: Semantic closure. TT: Consistency (Girard). The colleague is *structurally* right but *semantically* shallow.
      *   *Truth vs. Inhabitation:* In TT, `True` = `Inhabited`. But philosophical truth often implies correspondence or stability beyond proof. TT captures *provability*. This is a major gap.
      *   *Gaps vs. Type Errors:* In TT, "no term" can mean "false" or "unproven". A semantic gap (Kripke) is hard to distinguish from "I haven't found the proof yet" unless you build a specific 3-valued logic into the types.
      *   *Dialetheism:* Lean rejects this by design (`False.elim`). To translate it, you have to break the tool. This suggests the philosophy requires a different logic, not just a different theory within the logic.
      *   *Revenge:* In TT, revenge usually looks like "Universe Polymorphism" trying to quantify over all levels, which hits Girard again.

