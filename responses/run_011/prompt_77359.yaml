  ok so this is technically for my gov class but the policy version bored me and now the philosophy version is stuck in my head. Here's the setup as far as I understand it (feel free to correct me if I've got a detail wrong):

  In a lot of wealthy countries, new parents get paid leave. You get a share of your normal paycheck rather than the whole thing, usually with a ceiling so high earners get a smaller proportion. Your job is held for you. And — this is the part that bugs me — some of the time is reserved for each parent separately. The mom gets her months, the dad gets his months, and his months just evaporate if he doesn't take them. He can't hand them to her, even if they both agree that'd be better, even if she's the one breastfeeding, even if he makes way more so it costs the family more for him to stay home. You also can't save the months up for later, can't cash them out, can't give them to a grandparent or a neighbor, and if you're freelance or work somewhere too small you might not qualify at all.

  My teacher says the whole thing is about the wellbeing of the kid plus gender equality. But then the design keeps doing stuff that seems to work against both of those goals, and I can't figure out what it's actually tracking.

  So: what does this practice presuppose? Some specific things I want you to take on:

  - The payment tracks the parent's wage instead of being a flat amount. What view of what's being compensated does that assume? It means two people doing the exact same week of baby care get different amounts of public money, which seems weird if the point is the care.
  - If the goal were just the kid's wellbeing, letting parents trade the reserved months looks strictly better — same total time, more flexibility, whatever arrangement the family thinks works. Refusing to allow the trade has to be assuming something matters *more* than the kid's wellbeing here. What is it, and is it a claim about equality, about preferences, about the state's authority, or something else?
  - Non-transferable + use-it-or-lose-it + no cashing out. Is that just administrative convenience, or does it commit you to a specific view of what the benefit *is*? Like, does treating it as something that can't be converted into money amount to a claim that it isn't really a resource at all?
  - And the eligibility being hooked to having a job, at a big enough employer, with enough hours — does that mean this isn't actually a right of parents but a right of workers? What does it rule out about who counts?

  Please separate what the design strictly can't function without from what it merely fits nicely with, because I suspect several rival theories could license the exact same policy and I want to know where it's underdetermined and where it isn't. Then tell me what would have to change in practice if you swapped in the obvious rival — say, a flat payment to whoever actually does the care, pooled at the household level and cash-outable. Would that be a small tweak or would it destroy something the current design is doing on purpose?

  Don't give me a reading list or citations, I can't look anything up anyway. American English please. And make the very last line exactly "Verdict: " followed by one short phrase naming the single commitment you think this design genuinely cannot do without, so I can check it against my notes.
