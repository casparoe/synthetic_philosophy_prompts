answer: |-
  You are right to feel that the design contradicts the stated goals if you assume the goal is simply "maximize child wellbeing" or "maximize family income." The policy isn't trying to do either of those things in the short term. It is trying to solve a specific long-term structural problem: the gendered division of labor in the workforce. To understand the presuppositions, you have to view this not as welfare for families, but as labor market regulation that happens to take place in the home.

  Here is the breakdown of what the design presupposes, separating the necessary mechanics from the contingent details.

  **1. Wage-based payment vs. flat amount**
  This design assumes that what is being compensated is **income loss**, not **care work**.
  If the state valued the act of caring itself, it would pay a flat rate per child, because one week of care is roughly equal regardless of who provides it. By tying the payment to the parent's previous wage, the policy presupposes that the primary harm being mitigated is the economic penalty of stepping out of the labor market. It treats the leave as insurance against "human capital depreciation." The philosophical view here is that parenting is a temporary interruption of economic productivity that the state must subsidize to prevent long-term wage scarring, particularly for women. It values the *worker* attachment more than the *care* provision.

  **2. Non-transferable reserved months**
  You identified the core tension: if the goal were just the kid's wellbeing, flexibility would be superior. Refusing to allow the trade presupposes that **changing social norms matters more than household utility.**
  The design assumes that without coercion, households will default to traditional specialization (higher earner works, lower earner cares), which reinforces gender inequality in the long run. By making the father's months non-transferable, the state is claiming authority over the internal division of labor within the family. It prioritizes a societal goal (normalizing fathers as caregivers) over the family's immediate preference or economic efficiency. This is a claim about **state paternalism**: the state knows better than the family how to arrange care to achieve gender equality in the workforce.

  **3. In-kind benefit (No cashing out, use-it-or-lose-it)**
  This is not just administrative convenience; it commits you to the view that **presence is the public good, not resources.**
  If you could cash out, high-earning families would simply take the money and hire help or have one parent stay home permanently. By making it non-convertible, the state ensures the specific employee actually stops working and physically cares for the child. It treats the benefit as a **duty to consume time off** rather than a resource to manage. This reinforces the idea that the bonding time itself is a mandatory social contribution, not a private asset.

  **4. Employment-linked eligibility**
  This confirms that this is a **right of workers, not a right of parents.**
  It rules out those outside the formal labor market (students, unemployed, informal workers) from this specific tier of support. This presupposes that the policy's primary function is to maintain labor force attachment. It implicitly devalues care provided by those not currently attached to a wage, or assumes they are covered by a different, lower tier of welfare. It defines the citizen primarily through their economic participation.

  **Necessary vs. Contingent Features**
  *   **Contingent:** The specific wage replacement rate (could be higher or lower), the exact number of months, or the size threshold for employers. These could change without altering the core philosophy.
  *   **Necessary:** The **non-transferability between parents** is the hard core. Without this, the gender equality mechanism fails because households will optimize for income. The **employment link** is also necessary; without it, the policy becomes universal welfare rather than labor market insurance. The **in-kind nature** (no cash-out) is necessary to ensure the time is actually taken by the worker.

  **The Rival Theory**
  If you swapped in a flat payment, pooled at the household level, and cash-outable, you would not be making a small tweak. You would be **destroying the mechanism.**
  *   **Flat/Pooled:** Households would likely assign the leave to the lower earner (usually the mother) to minimize income loss. This reinforces the "male breadwinner" model the current design tries to break.
  *   **Cash-outable:** Families might take the cash and return to work immediately, or use it to hire third-party care. This severs the link between the parent and the care time, defeating the goal of normalizing paternal care.
  *   **Result:** The policy would shift from "labor market regulation for equality" to "family income support." It would likely improve short-term household utility but fail the long-term gender norm goals.

  The current design functions only if you accept that the state has a legitimate interest in dictating which parent stays home, regardless of the family's own economic calculus.

  Verdict: State authority over domestic labor allocation.
