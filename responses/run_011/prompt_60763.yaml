answer: |-
  The warehouse doorframe was exactly two meters and fourteen centimeters wide. The new ore cart prototype was two meters and fifteen. Elara watched the foreman try to muscle it through anyway. The steel lip caught on the masonry with a shriek that set everyone's teeth on edge. Dust drifted down from the lintel, settling on the foreman's shoulders like grey snow.

  "It's the gauge," Elara said, though no one had asked. "The wheelbase forces the chassis wide. If the track were standard, the center of gravity drops, the chassis narrows, and it fits."

  "It fits the way it fits," the foreman said, wiping grease from his hands. "We've been squeezing through here since before your grandfather was born, Ms. Vance."

  Elara left the warehouse and walked toward the administration building. The Oros Basin was a scar in the earth, a steep-sided valley where the rock held copper and the history held grudges. The tramway snakes down from the pits to the smelter, then to the ferry dock on the lake. Every inch of it was built to the "Oros Narrow" gauge.

  In the boardroom, the arithmetic was flawless. Elara projected the spreadsheet onto the screen. The net present value of converting to standard gauge was positive. Significant. The wider cars would carry twenty percent more ore per run. The energy consumption per ton would drop. Maintenance on the non-standard engines was costing the consortium a fortune in bespoke parts.

  "The sum is green," said Silas, the oldest director, tapping the table. "The sum is very green."

  "But the ferry," said the logistics manager. She didn't look at the screen. She looked at her hands. "The *Kettering* deck is built for the Narrow. To change the deck, we drydock for three weeks. No ore moves. The smelter starves. The contracts penalize us."

  "And the tunnels?" asked another.

  "Retimed," Elara said. "We lose clearance. We have to blast the walls back."

  "And the warehouse doors," said the foreman, who had followed her in. "And the turntables. And the loading cranes at the dock."

  Elara nodded. This was the knot. It wasn't that the conversion was too expensive in total; it was that the cost couldn't be incurred sequentially. The mine couldn't switch until the ferry did. The ferry couldn't switch until the trucks did. The trucks couldn't switch until the warehouses did. No single actor could move first without bankrupting themselves. They were trapped in a equilibrium of mutual hesitation. The lock-in wasn't a chain held by a villain; it was a geometry held by everyone.

  "We agree on the math," Silas said. "We disagree on the jump."

  They dismissed her. The proposal went into a folder marked *Future Consideration*.

  Elara drove up to the archives instead. The building smelled of dry rot and iron. She asked for the 1873 construction ledgers. The myth of the Oros Narrow was local folklore: the original contractor had sat on a surplus of axles from a cancelled government order, so he built the track to fit the stock. A accident of history fossilized into infrastructure.

  The ledger was heavy, bound in leather that cracked when opened. She ran her finger down the columns of expenditure. There it was, October 14th, 1873. *Procurement of Rolling Stock.*

  It wasn't surplus axles. The entry noted a specific loan covenant from the London bank financing the venture. The bank required the use of a specific locomotive manufacturer to secure the interest rate. That manufacturer only produced the Narrow gauge. The bank went bust in 1882. The manufacturer went bust in 1890. The reason for the gauge had been extinct for a century and thirty years, but the rails remained. An extinct cause, walking around on live rails.

  She closed the book. The arbitrariness of it made her angry. But then she remembered the data packet on her desk from the Kessel Reach.

  The Kessel Reach was the rival valley across the ridge. Same ore, same lake, same market. In 1873, the Kessel engineers had chosen the Standard gauge. The story there was that the chief surveyor had lost his measuring chain in a creek and guessed the width based on a horse's stride. A different accident. A different arbitrary choice.

  Elara had run the counterfactual simulation all weekend. She modeled the Kessel Reach using the Oros Narrow parameters. She modeled the Oros Basin using the Kessel Standard parameters.

  The results sat on her screen now, glowing in the dim archive room.

  After one hundred and fifty years, the freight costs per ton were within two percent of each other. The industry mix was identical. The Kessel Reach had built narrower tunnels and wider cars; Oros had built wider tunnels and narrower cars. The market had washed over the difference. In Kessel, the inefficiency of the narrow tunnels balanced the efficiency of the standard engines. In Oros, the inefficiency of the narrow engines balanced the efficiency of the wide tunnels. The terrain demanded a certain throughput. The market demanded a certain price. The system had adjusted around the initial error until the error no longer mattered.

  She walked out of the archives and stood on the ridge overlooking the valley. The tramway looked like a scratch on the land, silver and straight. Down below, a train was assembling. The wheels were small, the cars boxy. They looked awkward compared to the sleek standard stock she saw in magazines, but they were moving.

  Across the ridge, she could see the smoke of the Kessel smelter. They were using the other gauge. They were fighting their own ghosts—blastings their tunnels wider, reinforcing their bridges for heavier axle loads. They were converging on the same solution from the opposite direction.

  Elara took the proposal out of her bag. The wind caught the pages, fluttering them against her leg. The arithmetic was still right. Converting would save money. But the simulation whispered a darker truth: it wouldn't save enough to matter. The valley had already optimized around the mistake. The lock-in was real, but it was soft. It was a friction, not a wall.

  She watched the train begin its descent. The wheels clicked against the joints in the rail, a rhythmic, metallic heartbeat. *Click-clack. Click-clack.* It was the sound of a decision made in 1873, repeated every second for a century and a half.

  Elara folded the proposal. She didn't put it back in the bag. She didn't throw it off the ridge. She just held it, watching the train reach the ferry dock. The cars stopped exactly where the deck began. The gap was precise. The fit was perfect.

  It was the wrong shape for the world, but it was the right shape for the valley.

  ***

  **Post-Story Analysis**

  **Which side is the story betting on?**
  The story quietly bets on the **convergence reading** (function over history), though it acknowledges the visceral reality of lock-in. By revealing that the rival valley arrived at nearly identical economic outcomes despite the opposite arbitrary choice, the narrative suggests that while history determines the *route*, market forces and physical constraints determine the *destination*. The "lock-in" is real in the short term (the coordination failure in the boardroom), but the long-term simulation suggests it is permeable. The system adapts around the constraint until the constraint loses its bite.

  **Where did I have to bend the ideas?**
  1.  **Perfect Information:** In the story, everyone agrees on the arithmetic immediately. In reality, uncertainty about conversion costs and future demand usually fuels the disagreement, not just coordination failure. I smoothed this to highlight the coordination problem.
  2.  **The Convergence:** Having the costs land within 2% after 150 years is a narrative convenience. In reality, path dependence often leads to persistent welfare losses (e.g., the QWERTY keyboard actually *is* arguably less efficient). I bent this to force the philosophical question: if the outcome is the same, did the path matter?
  3.  **The Ledger:** Finding a definitive "extinct cause" in a ledger is dramatic license. Usually, the reasons are lost to entropy, not preserved in a single document. This was done to satisfy the prompt's requirement for an "extinct cause, live effect" beat.

  **What would change my mind?**
  I would tip toward the **strong lock-in reading** if presented with evidence of **persistent welfare divergence** between the two valleys. If the Oros Basin (Narrow) had significantly higher poverty rates, lower output, or had gone bankrupt while the Kessel Reach (Standard) flourished *solely* due to the gauge, the argument for convergence would collapse. The story assumes the market is efficient enough to erode the disadvantage over 150 years. If the disadvantage compounds rather than dampens, the lock-in is absolute.

  **Where is this version likely wrong?**
  It underestimates the **political economy** of lock-in. The story treats the actors as rational economic agents trapped by physics. In reality, some actors profit from the lock-in (e.g., the bespoke parts manufacturer). They would actively lobby *against* conversion, not just hesitate due to coordination costs. The story ignores the winners of the path dependence to focus on the losers, which simplifies the inertia.
