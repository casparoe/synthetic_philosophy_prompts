  ### Design Notes & Claim Assessment

  Before presenting the exam materials, here is the assessment of your three hypotheses against the rules provided.

  1.  **Claim 1 (Value depends on priors): SURVIVES.**
      *   **Reasoning:** The expected value of an audit depends on the probability that the report is an error. If a player believes their partner is a cooperator (high prior on $C$), a report of $D$ is likely noise (5% error rate). If they believe the partner is a defector, a report of $D$ is likely truth (95% accuracy). Therefore, the "surprise" factor drives the decision.
      *   **Math Check:** Accessible via conditional probability trees.

  2.  **Claim 2 (Collective-action/Under-buying): NEEDS QUALIFICATION.**
      *   **Reasoning:** Under your specific numbers ($w=0.9$, Cost=1), the *private* benefit of avoiding a spiral (worth ~20 future points) outweighs the cost (1 point) for the individual auditor. Strictly speaking, a selfish player *should* audit to protect their own future stream.
      *   **Qualification:** The collective action problem is not "no one audits," but rather "redundant auditing." If both audit, the pair pays 2 points for information one audit would have secured. Additionally, if players heavily discount the future (myopic), the private benefit drops below the cost, making the stability of cooperation a public good that no one wants to pay for.
      *   **Exam Adjustment:** The question will frame this around the tension between *private cost* and *shared stability*, acknowledging that without a mechanism to coordinate who audits, efficiency is lost.

  3.  **Claim 3 (Invisible audits cannot signal): SURVIVES.**
      *   **Reasoning:** Signaling requires observability. Since audit decisions are private and unobservable, a partner cannot update their belief about your "type" based on your audit choice. This is definitionally true and requires no repair.

  **Rule Repair:** To ensure Part 3 (Observer Diagnosis) is solvable without complex game theory, the question specifies that players intend to play **Tit-for-Tat**. This anchors the expected behavior, making deviations diagnostic.

  ***

  ### 1. Exam Question

  **End-of-Year Assessment: The Iterated Dilemma with Audit Rounds**
  **Time Allowed:** 60 Minutes
  **Total Marks:** 25

  **Instructions:** Answer all three parts. You may not use calculators. All necessary rules and payoffs are contained below.

  **The Scenario**
  Two players engage in an indefinite series of Prisoner's Dilemma rounds. After every round, there is a 90% probability ($w=0.9$) that another round will follow. This probability is common knowledge.

  **Payoffs**
  In each round, players choose simultaneously to **Cooperate (C)** or **Defect (D)**. Payoffs for the round are:
  *   Mutual Cooperation ($C, C$): 3 points each.
  *   Mutual Defection ($D, D$): 1 point each.
  *   Temptation ($D$ vs $C$): Defector gets 5, Cooperator gets 0.

  **Monitoring and Audits**
  Players do not see each other's actions directly. At the start of every round (except the first), each player privately receives a **Report** of the partner's previous action.
  *   Reports are 95% accurate. (If the partner Cooperated, the report says 'C' with 95% probability and 'D' with 5% probability, and vice versa).
  *   Reports are independent. Player A and Player B may receive contradictory reports about the same history.

  Before choosing their action for the current round, a player may choose to **Audit**.
  *   **Cost:** Auditing costs 1 point, deducted from that round's payoff.
  *   **Benefit:** An audit reveals the partner's *actual* previous action with 100% certainty.
  *   **Privacy:** Audit decisions are simultaneous and unobservable. A partner never knows if you audited, and audits leave no record for future rounds.

  **Strategy Assumption**
  For the purpose of this question, assume both players intend to play **Tit-for-Tat**: they wish to Cooperate if the partner Cooperated previously, and Defect if the partner Defected previously, based on the best information available to them.

  **Questions**

  **(a) The Audit Decision (10 Marks)**
  Suppose you received a Report that your partner Defected in the previous round. You believe your partner is generally a Cooperator, so you suspect this Report might be an error.
  Using expected value reasoning, explain the trade-off involved in deciding whether to pay for an Audit. Why does the value of the Audit depend on your prior expectation of the partner's behavior?

  **(b) The Collective Problem (8 Marks)**
  Even if auditing helps maintain cooperation, explain why the Audit decision creates a collective-action problem between the two players. Why might audits be "under-bought" (used less than is socially optimal) or inefficiently duplicated, given that audit decisions are private?

  **(c) Diagnosis by Observation (7 Marks)**
  Imagine you are an external observer. You can see the sequence of actions chosen by both players (e.g., Round 1: $C,C$; Round 2: $D,D$), but you *cannot* see the Reports they received or whether they Audited.
  The players have been cooperating for many rounds, but suddenly cooperation collapses.
  How could you distinguish whether this collapse was caused by **Temptation** (one player greedily defecting) or **Misperception** (both players reacting to false Reports)? Explain what each diagnosis implies about whether allowing Audits would have prevented the collapse.

  ***

  ### 2. Model Answer

  **(a) The Audit Decision**
  The decision to audit relies on comparing the certain cost of the audit against the expected loss of acting on faulty information. The cost is fixed at 1 point. The benefit of the audit is avoiding a "mistaken retaliation."

  If I trust the Report of Defection and play Defect ($D$):
  1.  **If the Report was True (Partner actually $D$):** I play $D$, they play $D$ (assuming they follow Tit-for-Tat). Payoff = 1.
  2.  **If the Report was False (Partner actually $C$):** I play $D$, they play $C$. I get the Temptation payoff of 5 *this round*, but I have now initiated a breakdown of cooperation. Because $w=0.9$, the expected future value of cooperation is high (approx. 30 points over the remaining game). By defecting on a cooperator, I trigger a spiral of mutual defection (payoff 1) for all future rounds.

  If I Audit and find the Partner actually $C$:
  I pay 1 point. I play $C$. They play $C$. Payoff = $3 - 1 = 2$. Cooperation continues.

  The value of the audit depends on the **probability that the Report is an error**. This probability is determined by my **prior expectation**.
  *   If I believe the partner is a Cooperator, a Report of $D$ is likely a 5% error. The risk of losing the future cooperative stream (worth ~20 points more than defection) makes the 1-point audit cost worthwhile.
  *   If I believe the partner is a Defector, a Report of $D$ is likely accurate (95%). Auditing confirms what I already expect, yielding no strategic benefit.
  Therefore, audits are only valuable when the Report contradicts a strong prior belief (high surprise).

  **(b) The Collective Problem**
  The audit decision creates a collective-action problem because the **cost is private** while the **benefit of stability is shared**.
  1.  **Free-Riding:** Maintaining the cooperative equilibrium benefits both players equally. However, the 1-point cost is borne solely by the auditor. Each player has an incentive to hope the *other* player audits to verify the truth, allowing them to save the cost while still enjoying the stable cooperation. If both players wait for the other to audit, neither audits, and the cooperation collapses due to noise.
  2.  **Inefficiency/Coordination:** Conversely, because audits are unobservable, players cannot coordinate to ensure only *one* person audits. Both might audit simultaneously. This secures cooperation but wastes 1 point (total cost 2) when only 1 point was needed.
  Because the decision is private, there is no way to signal "I will audit if you don't," leading to either under-provision (collapse) or redundant spending.

  **(c) Diagnosis by Observation**
  An observer can distinguish the cause of collapse by looking at the **pattern of the first deviation** from cooperation.
  *   **Temptation:** If driven by temptation, one player defects to gain 5 points while the other cooperates. The observed outcome in the first deviation round will be **($D, C$)** or **($C, D$)**. One player gets 5, the other gets 0.
  *   **Misperception:** If driven by misperception (noise in Reports), both players receive false signals that the other defected. Both retaliate simultaneously. The observed outcome in the first deviation round will be **($D, D$)**. Both get 1.

  **Implication for Audits:**
  *   If the pattern is **($D, D$)** (Misperception), Audits **would have helped**. An audit would have revealed the truth, preventing the unnecessary retaliation.
  *   If the pattern is **($D, C$)** (Temptation), Audits **would not have helped**. The defector knows the partner Cooperated (no misperception) but chooses to exploit them. Verifying the action does not change the incentive to defect for short-term gain.

  ***

  ### 3. Marking Scheme (25 Marks)

  **Part (a): The Audit Decision (10 Marks)**
  *   **Identifies Cost vs. Benefit (3 marks):** Explicitly states Audit Cost = 1. Identifies Benefit as avoiding the loss of future cooperation (or avoiding playing $D$ against $C$).
      *   *Common Error:* Comparing only current round payoffs (5 vs 3) and ignoring the future spiral.
  *   **Bayesian Intuition (4 marks):** Explains that the value depends on the likelihood the report is wrong. Links this to "priors" or "expectations" (e.g., "If I trust them, a D report is likely noise").
      *   *Common Error:* Treating the error rate (5%) as fixed regardless of the partner's likely behavior.
  *   **Future Value Argument (3 marks):** Mentions that $w=0.9$ implies many future rounds, making the loss of cooperation costly enough to justify the audit.
      *   *Common Error:* Failing to mention the indefinite horizon or $w$.

  **Part (b): The Collective Problem (8 Marks)**
  *   **Private Cost / Shared Benefit (3 marks):** Clearly states that the auditor pays 1, but both players benefit from continued cooperation.
      *   *Common Error:* Claiming the benefit is private only (ignoring the partner's gain from stability).
  *   **Free-Rider Incentive (3 marks):** Explains that players may wait for the other to audit to save costs, risking mutual non-auditing.
      *   *Common Error:* Describing it as a standard Prisoner's Dilemma without explaining the specific "wait and see" dynamic.
  *   **Observability Constraint (2 marks):** Notes that because audits are invisible, players cannot coordinate to avoid double-auditing or promise to audit.
      *   *Common Error:* Suggesting players could signal their intent to audit.

  **Part (c): Diagnosis by Observation (7 Marks)**
  *   **Temptation Pattern (2 marks):** Identifies that Temptation results in asymmetric moves ($D, C$) initially.
      *   *Common Error:* Saying Temptation leads to ($D, D$) immediately.
  *   **Misperception Pattern (2 marks):** Identifies that Misperception results in symmetric moves ($D, D$) initially (simultaneous retaliation).
      *   *Common Error:* Confusing misperception with random noise in actions rather than reports.
  *   **Audit Implication (3 marks):** Correctly concludes Audits fix Misperception (verify truth) but not Temptation (incentive remains).
      *   *Common Error:* Claiming audits prevent Temptation (e.g., "Audits punish defectors").

  ***

  ### 4. Note on "Lore Recitation"

  An answer that competently recites the tournament lore (e.g., naming Axelrod, defining Tit-for-Tat, listing "Nice, Retaliatory, Forgiving, Clear") but fails to engage with the specific *Audit* mechanics will cap at approximately **10/25 marks**. Such an answer might earn marks for defining Tit-for-Tat in Part (a) or mentioning "noise" in Part (c), but it will fail the specific expected-value trade-off required in (a), miss the private-cost nuance in (b), and likely misidentify the ($D,D$) vs ($D,C$) diagnostic in (c). The question is designed to test the *application* of game-theoretic reasoning to a novel mechanism, not the recall of historical results. A student who writes "Tit-for-Tat is robust as shown in 1984" without calculating the audit cost against the $w=0.9$ stream has not answered the question set.
