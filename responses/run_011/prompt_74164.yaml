      *   *Test:* Perturb the *training distribution* (simulated via prompt engineering/few-shot) vs. Perturb the *alignment instructions*.
      *   *Actually, let's look at the "Sensitivity" angle again.* The user likes (1). Can we save it?
      *   *Safety Condition:* "In nearby worlds where you make the judgment, is it correct?" No, that requires knowing the truth.
      *   *Invariance Condition:* "In nearby worlds where the *irrelevant* facts change, does the judgment change?" If yes -> Sensitive to irrelevant data (Bias). If no -> Robust (Preference/Principle).
      *   *Wait, standard Bias definition:* Bias is often *insensitivity* to relevant changes (stereotyping) OR *sensitivity* to irrelevant changes (name swapping).
      *   *Let's pivot:* The user's definition (1) is basically Nozick's Sensitivity. It fails on necessary truths (6) and self-reference (7).
