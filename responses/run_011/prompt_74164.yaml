      *   *New Criterion:* A judgment is a **Bias** if it persists when *irrelevant* features of the input change. A judgment is a **Preference** if it persists when *relevant* normative principles (encoded in system instructions) are applied, even if input varies.
      *   *Wait, keep it closer to their original structure if possible?* They want to keep (1) if they can. But (1) is doomed for necessary truths.
