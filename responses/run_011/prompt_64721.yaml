answer: |-
  # Specification for Legitimate Iterated Elimination Procedures

  To move from a "grab bag" of procedures to a defensible specification, we must treat an elimination rule not merely as an algorithm, but as a claim about rational behavior and information. A legitimate rule must map a game $\Gamma$ to a subgame $\Gamma'$ such that the removal of strategies is justifiable to the players themselves, not just convenient for the analyst.

  Below are the seven desiderata required for legitimacy.

  ### 1. Behavioral Foundation: Linearity vs. Randomization
  **Requirement:** The rule must specify whether the dominance relation relies on the player's *ability* to randomize or merely on the *linearity* of their preferences over lotteries.
  **Consideration:** For a mixed strategy $\sigma_i$ to strictly dominate a pure strategy $s_i$, the player's utility function must satisfy the independence axiom (vNM expected utility). If preferences are non-linear (e.g., maxmin or rank-dependent), a mixture yielding a higher expected payoff does not necessarily imply the pure strategy is irrational.
  **Crucial Distinction:** The player does **not** need access to a randomization device to be bound by mixed-strategy dominance. The mixture represents a hedge; if $\sigma_i$ yields higher utility than $s_i$ against all opponent profiles, a vNM agent is irrational to play $s_i$ regardless of whether they can physically flip a coin. However, if the agent violates expected utility, the deletion is illegitimate.
  **Status:** **Non-negotiable** for standard microeconomic theory. If preferences are not vNM, mixed dominance deletions cannot be defended as rationality constraints.

  ### 2. Agency: Player Deduction vs. Analyst Inference
  **Requirement:** The rule must distinguish between strategies a *player* can deduce are inferior and strategies an *analyst* knows are unused in equilibrium.
  **Consideration:** A deletion is behaviorally legitimate only if the player whose strategy is removed has a reason to discard it based on their own payoff structure and knowledge.
  **Counterexample:** Consider a game where Strategy $A$ is not dominated, but is not played in any Nash Equilibrium. An analyst can delete $A$ to simplify finding the NE. However, the player cannot deduce $A$ is bad without knowing which equilibrium will be played. Deleting $A$ as a "pre-solve" step presupposes the solution to find the solution.
  **Status:** **Non-negotiable** for "pre-solve" legitimacy. If the reason for deletion is "this is not part of an equilibrium," the procedure is a selection criterion, not a reduction device.

  ### 3. Epistemic Depth: The Cost of Iteration
  **Requirement:** The rule must state the level of mutual knowledge of rationality required for the $k$-th round of deletion.
  **Consideration:**
  *   Round 1: Requires Rationality.
  *   Round 2: Requires Rationality + Knowledge of Rationality.
  *   Round $k$: Requires $k-1$ levels of nested knowledge.
  **Counterexample (Mutual vs. Common):**
  Suppose Rationality is Mutual Knowledge (I know you are rational; you know I am rational) but not Common Knowledge.
  *   Game: P1 chooses $U, D$; P2 chooses $L, R$.
  *   $D$ is dominated for P1. $R$ is dominated for P2 *if* P1 plays $U$.
  *   P2 deletes $R$ only if P2 knows P1 deletes $D$. P2 knows P1 is rational (Round 1).
  *   P1 deletes $D$ (Round 1).
  *   If knowledge stops at "Mutual," Round 3 deletions (requiring "I know that you know that I know...") are unsupported.
  **Status:** **Non-negotiable.** A rule claiming to iterate to convergence implicitly assumes Common Knowledge of Rationality (CKR). If CKR is not plausible in the application, the iteration must halt.

  ### 4. Order Independence
  **Requirement:** The surviving set of strategies must be invariant to the order in which dominated strategies are removed.
  **Consideration:** If the output depends on the sequence of deletion, the procedure is not a well-defined function from Game to Subgame. It introduces arbitrariness into the solution.
  **Counterexample (Weak Dominance):**
  $$
  \begin{array}{c|cc}
   & L & R \\
  \hline
  T & 1,1 & 0,0 \\
  M & 1,1 & 0,0 \\
  B & 0,0 & 1,1
  \end{array}
  $$
  *   $T$ weakly dominates $M$. $L$ weakly dominates $R$ (if P1 plays $T$ or $M$).
  *   Path A: Delete $M$. Then $L$ dominates $R$. Delete $R$. Survivors: $\{T, B\} \times \{L\}$.
  *   Path B: Delete $R$ first (assuming P1 won't play $B$). Then $T$ and $M$ are equivalent. Survivors may differ.
  *   *Note:* In strict dominance, order does not matter. In weak dominance, it does.
  **Status:** **High Preference.** For a robust pre-solve device, order independence is essential. If a rule lacks it, it must specify a canonical ordering (e.g., simultaneous elimination), which changes the epistemic requirements.

  ### 5. Solution Concept Preservation
  **Requirement:** The rule must specify which solution concepts are preserved (Nash, Correlated, Rationalizable) and under what domain conditions.
  **Consideration:**
  *   **NE Preservation:** Strict dominance never deletes a Nash Equilibrium strategy. Weak dominance *can*.
  *   **NBR vs. Dominance Equivalence:** A strategy is strictly dominated by a mixed strategy if and only if it is **Never a Best Response (NBR)** to any conjecture about opponents.
  *   **The Correlation Caveat:** This equivalence (Pearce's Lemma) holds in 2-player games. In $N \geq 3$ player games, it holds **only if** conjectures about opponents are permitted to be **correlated**. If conjectures must be independent (Nash-style), a strategy may be NBR to independent beliefs but not strictly dominated.
  **Counterexample (3-Player Correlation):**
  Players 1, 2, 3. P1 wants to match the parity of (P2, P3).
  *   If P2 and P3 correlate perfectly (e.g., both $L$ or both $R$), P1 has a best response.
  *   If P2 and P3 are independent, P1 might have no best response that wins consistently.
  *   A strategy might survive "Independent NBR" (Rationalizability) but die "Mixed Dominance" (Correlated NBR).
  **Status:** **Non-negotiable** for applied work. If the goal is to find Nash Equilibria, deleting NE strategies is fatal.

  ### 6. Domain and Transfinite Iteration
  **Requirement:** The rule must define behavior for infinite strategy sets or discontinuous payoffs.
  **Consideration:** In finite games, iteration stops in finite steps. In infinite games (e.g., Cournot with continuous quantities), the set of survivors may only be reached at the limit (transfinite induction).
  **Status:** **Preference/Scope.** For a first-year sequence, restricting the domain to **Finite Normal Form** is a legitimate simplification. The rule must explicitly state this boundary to avoid ambiguity in continuous applications.

  ### 7. Tractability vs. Power
  **Requirement:** The rule must justify its computational cost against its reduction power.
  **Consideration:** A rule that deletes nothing (e.g., "delete only if payoff is $-\infty$") is safe but useless. A rule that deletes everything (e.g., "delete if not part of the unique NE") is powerful but circular.
  **Status:** **Preference.** The rule should maximize deletion subject to the non-negotiable constraints (NE preservation, Order Independence).

  ---

  # The Exclusionary Requirement

  The single requirement that excludes the most candidates is **Preservation of Nash Equilibria**.

  While Order Independence eliminates Weak Dominance procedures, **NE Preservation** eliminates any procedure that relies on **Weak Dominance**. In applied work, the primary justification for trimming a game is to simplify the search for equilibria. If the trimming process itself discards equilibria, the device defeats its own purpose. This immediately disqualifies Iterated Elimination of Weakly Dominated Strategies (IEWDS) as a general pre-solve tool, regardless of its epistemic appeal or order-dependence fixes.

  # The Unsatisfiable Triad

  Your suspicion is correct. The following three requirements are **jointly unsatisfiable**:

  1.  **Order Independence:** The surviving set does not depend on the sequence of deletion.
  2.  **Weak Dominance Deletion:** The rule allows removal of strategies that are weakly (but not strictly) dominated.
  3.  **NE Preservation:** No Nash Equilibrium of the original game is lost in the reduced game.

  **The Argument:**
  1.  **Weak Dominance violates NE Preservation:** A weakly dominated strategy can be part of a Nash Equilibrium.
      *   *Example:*
          $$
          \begin{array}{c|cc}
           & L & R \\
          \hline
          T & 1, 1 & 1, 0 \\
          B & 1, 1 & 0, 0
          \end{array}
          $$
      *   $T$ weakly dominates $B$ for Player 1 (equal at $L$, strict at $R$).
      *   $(B, L)$ is a Nash Equilibrium yielding $(1,1)$.
      *   If we delete $B$ (Weak Dominance), we destroy the equilibrium $(B, L)$.
      *   Therefore, {Weak Dominance, NE Preservation} is inconsistent.

  2.  **Weak Dominance violates Order Independence:** In games with 3+ strategies or players, the set of weakly dominated strategies can change depending on what was deleted in the previous round.
      *   *Example:*
          $$
          \begin{array}{c|ccc}
           & L & C & R \\
          \hline
          T & 1,1 & 0,0 & 0,0 \\
          M & 1,1 & 0,0 & 0,0 \\
          B & 0,0 & 1,1 & 1,1
          \end{array}
          $$
      *   $T$ and $M$ are equivalent. Neither dominates the other initially.
      *   If we delete $R$ (weakly dominated by $L$ if P1 plays $T/M$), $T$ and $M$ remain equivalent.
      *   If we had a structure where deleting one weakly dominated strategy made another *strictly* dominated, the order changes the survivors. (Standard IEWDS is path-dependent).

  **Conclusion:** You cannot have all three. Since NE Preservation is non-negotiable for a pre-solve device, and Order Independence is necessary for a well-defined procedure, **Weak Dominance Deletion** must be abandoned for this specific purpose.

  ---

  # Scorecard of Candidates

  | Candidate Procedure | Legitimacy Score |
  | :--- | :--- |
  | **Strict Dominance (Pure Only)** | **Safe but Weak:** Satisfies all non-negotiables (NE preservation, Order Independence) but fails to delete many irrational strategies (e.g., those dominated only by mixtures). |
  | **Strict Dominance (Mixed Allowed)** | **Gold Standard:** Satisfies all non-negotiables; requires vNM preferences; deletes all Never-Best-Responses (with correlated conjectures). |
  | **Weak Dominance (IEWDS)** | **Illegitimate for Pre-Solve:** Violates NE Preservation and Order Independence; useful only as an equilibrium refinement *after* solving. |
  | **NBR Deletion (Correlated Conjectures)** | **Equivalent to Mixed Strict:** Theoretically identical to Strict Mixed Dominance (Pearce's Lemma); legitimate but computationally harder to check than linear programming for dominance. |
  | **NBR Deletion (Independent Conjectures)** | **Rationalizability:** Satisfies NE Preservation and Order Independence; in 3+ player games, deletes *fewer* strategies than Mixed Dominance (survives some dominated strategies); epistemically cleaner (no correlation device needed). |
