prompt: |-
  I'm an engineer on a small evals team at an AI lab — no psych background, no philosophy background, I write Python and ship things. Our job is the task suite we run on every model before a release, and each cycle we get maybe 25-30 proposed tasks from contractors, interns, and other teams who want their pet capability represented. Triage right now is pure vibes: whoever wrote the task argues for it in standup and the loudest person wins. My roommate is a psych grad student and when I described this to her she said we were reinventing a hundred-year-old argument badly, then talked for forty minutes about whether intelligence is one general thing or a pile of seperate ones, and I still could not apply any of it to a proposal sitting in front of me. I've got about fifteen minutes per proposal, nobody on my team knows psychometrics, and our PM signs off on anything that comes with a clean checklist attached — so if I can hand her a procedure she'll actually make people use it.

  What I want is a decision procedure for the question "does this task measure intelligence, or does it just measure something we already know how to train?" grounded in whatever the actual debate has to say thats usable. I mean the stuff I half-remember from googling: the general-vs-specific argument, the point that raw skill at any task can be bought with priors and training data so what you should care about is how efficiently a system acquires the skill (I think the ARC benchmark guy argues this), the old machine-intelligence paper that defines intelligence as expected performance across a wide range of environments rather than lots of instances of one narrow environment, and whatever philosophy of mind adds — like whether a system that produces the right output without understanding anything counts, and whether a behavioral test could ever tell the difference. Please write it as steps I run in order on a single proposal: what each step asks, what counts as a sufficient answer, which answers end the procedure at reject, which send it back to the proposer with a specific fix, and which steps are secretly judgment calls wearing a checklist costume (I'd rather flag those than pretend). Also mark the points where the procedure has to hand the decision to a human because it's about what we value — which capabilities matter for our product — and not about what a test can find out.

  Then run it on three proposals. One: a set of 200 variations on the same kind of logic-grid puzzle, where our biggest model is at ceiling and our smallest is at 60%. Two: a debugging task on a repo that is a lightly renamed version of a very popular tutorial project, so it's plausibly memorized. Three: my own baby — the model gets a spec for a made-up programming language plus three worked examples and has to write a correct program in it. I think that one is the best thing I've written and I already demoed it to leadership, so if the procedure kills it I want to know exactly which step kills it, and whether the objection is fixable by changing the task instead of throwing it out. Finish with what the procedure can't do: what it will get systematically wrong, what it can never certify no matter how carefully you run it, and why a suite that passes every single step could still be a bad measure of intelligence.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Engineer at an AI lab, small evals team. Practical, Python-focused, no psych/philosophy background. Time-constrained (15 mins/proposal).
      *   **Problem:** Current triage is "vibes" and "loudest voice." Needs a structured, defensible decision procedure to filter evaluation tasks.
      *   **Goal:** A checklist/procedure to decide: "Does this task measure intelligence (general capability), or does it just measure something we already know how to train (memorization/narrow overfitting)?"
      *   **Theoretical Grounding:** Needs to incorporate concepts like $g$ vs. specific abilities, efficiency of learning (ARC), definition of intelligence (performance across environments), and philosophy of mind (behavior vs. understanding).
      *   **Output Format:** Step-by-step procedure (Ask, Sufficient Answer, Reject/Fix/Pass, Judgment Call flags, Human Handoff points). Then apply to three specific proposals. Finally, limitations of the procedure.
      *   **Tone:** Pragmatic, engineering-focused, honest about limitations (no pretending the checklist solves philosophy).

  2.  **Deconstruct the Theoretical Concepts into Engineering Constraints:**
      *   *General vs. Specific ($g$ vs. $s$):* Does the task require transferring skills, or just recalling a specific pattern? -> *Test for Generalization.*
      *   *Efficiency of Learning (ARC/Chollet):* Can it be solved with prior knowledge alone, or does it require on-the-fly reasoning? -> *Test for Contamination/Priors.*
      *   *Wide Range of Environments (Legg/Hutter):* Is this one narrow environment or does it probe a broader cognitive faculty? -> *Test for Scope.*
      *   *Understanding vs. Behavior (Searle/Chinese Room):* Can we distinguish mimicry from reasoning? -> *Test for Robustness/Adversarial Perturbation.*
      *   *Product Value:* Does this capability actually matter for *our* users? -> *Handoff to PM/Product.*

  3.  **Drafting the Decision Procedure (The "Vibe-Check" Killer):**
      *   *Constraint:* Must take ~15 mins. Must be actionable.
      *   *Structure:* Sequential gates. If you fail one, you stop or fix.
      *   *Step 1: Contamination Check (The "Google Test").* Is the answer online? If yes, it measures training data, not intelligence.
      *   *Step 2: The "Priors" Test (ARC style).* Can a script solve this without "thinking"? If yes, it's too narrow.
      *   *Step 3: Generalization Gap.* Does performance drop when the surface form changes? If no, it might be rote memorization.
      *   *Step 4: Cognitive Depth.* Does it require multi-step reasoning or just pattern matching?
      *   *Step 5: Product Relevance (The Handoff).* Even if it measures intelligence, do we care?

      *Refining the Steps:*
      *   Make the "Judgment Call" flags explicit.
      *   Make the "Human Handoff" explicit (PM decides value).
      *   Ensure the "Fix" paths are clear (e.g., "add adversarial variants").

  4.  **Developing the Three Test Cases:**
      *   *Case 1: Logic Grid Puzzles (200 variations).*
          *   Risk: High contamination (these are common).
          *   Risk: Ceiling effects (big model maxed).
          *   Verdict: Likely Reject or Major Fix (need harder/novel variants).
      *   *Case 2: Debugging Popular Tutorial Repo.*
          *   Risk: Extreme contamination (memorization).
          *   Verdict: Reject (unless code is obfuscated/changed significantly).
      *   *Case 3: Made-up Programming Language (User's Baby).*
          *   Risk: Is it just pattern matching the 3 examples?
          *   Strength: Tests rapid learning (efficiency).
          *   Verdict: Pass with conditions (need to ensure the spec isn't derivable from pre-training).

  5.  **Drafting the Limitations Section:**
      *   Goodhart's Law (metrics become targets).
      *   The "Stochastic Parrot" problem (behavioral tests can't prove understanding).
      *   Distribution Shift (evals today $\neq$ real world tomorrow).
      *   Value Alignment (intelligence $\neq$ helpfulness).

  6.  **Review and Refine (Self-Correction during drafting):**
      *   *Critique:* Is this too academic?
      *   *Fix:* Use engineering terms ("contamination," "baseline," "ceiling effect"). Keep the psych/philosophy references brief and parenthetical.
      *   *Critique:* The user asked for specific "Reject/Fix/Pass" outcomes per step.
      *   *Fix:* Ensure every step has clear exit criteria.
      *   *Critique:* The user wants to know where *they* have to make a value judgment vs. where the test decides.
      *   *Fix:* Explicitly label "Value Handoff" steps.
      *   *Critique:* The user's "baby" task needs careful handling. Don't just kill it; show *how* it could fail.
      *   *Fix:* Focus on the "3 examples" aspect. Is that enough to rule out pre-training?

  7.  **Final Polish:**
      *   Check tone: Empathetic to the engineer's plight, respectful of the roommate's theory but focused on application.
      *   Ensure the "15-minute" constraint is respected (procedure shouldn't require running new experiments, just analyzing the proposal). *Correction:* Actually, for an eval proposal, you often need to know if the *design* allows for the test. I will frame it as "Design Review" rather than "Run the Eval."
      *   Make sure the "Judgment Call" warnings are prominent.

  8.  **Final Output Structure:**
      *   Intro: Acknowledge the situation.
      *   The Procedure (The "15-Minute Triage Protocol").
      *   Application to 3 Proposals.
      *   Limitations (The "What This Can't Do").

  *(Self-Correction on Step 2)*: I need to make sure I incorporate the "efficiency of learning" argument (ARC). The procedure should ask: "Does this task require learning rules *during* the context window, or is it relying on weights?"
  *(Self-Correction on Step 5)*: The PM sign-off is about value. I need to make sure the procedure distinguishes "Is this intelligence?" from "Do we care?"

  Let's write it.cw
answer: |-
  This is the **15-Minute Triage Protocol**. It translates the psych/philosophy debates into engineering constraints. It is designed to be run on a *proposal document*, not by running the eval itself (which takes too long).

  It has 5 gates. If a proposal fails a gate, it is either **Rejected** (fundamental flaw), **Returned** (fixable design flaw), or **Handed Off** (technical pass, requires product decision).

  **Legend:**
  *   **[JC]**: Judgment Call. This looks like a checklist item, but it relies on your intuition/experience. Flag these in your notes.
  *   **[HO]**: Human Handoff. This step cannot be answered by engineering/psychometrics; it requires a Product/PM decision on value.
  *   **Reject**: Kill the proposal.
  *   **Return**: Send back to proposer with specific instructions.
  *   **Pass**: Move to next step.

  ---

  ### The 15-Minute Triage Protocol

  #### Step 1: The Contamination Gate (The "Google Test")
  **Theory:** If the answer exists in the training distribution, performance measures *memory*, not *intelligence* (Searle's Chinese Room / Data Contamination).
  **Ask:** Can a solution be found via search engine, GitHub, or standard textbooks without reasoning? Is the task content (code, text, puzzles) likely to be in the model's pre-training corpus?
  **Sufficient Answer:**
  *   **Yes (High Risk):** Task uses public datasets, popular repos, or classic puzzles (e.g., "Tower of Hanoi," "Two Sum"). -> **Return** (Must be obfuscated or novelized).
  *   **No (Low Risk):** Task uses synthetic data, novel rules, or private contexts. -> **Pass**.
  **[JC] Warning:** You are estimating contamination probability, not measuring it. Be conservative.

  #### Step 2: The Priors Gate (The "ARC Test")
  **Theory:** Intelligence is the efficiency of acquiring new skills, not the application of old ones (Chollet/ARC). If a task can be solved by static priors without on-the-fly learning, it measures *crystallized* ability, not *fluid* reasoning.
  **Ask:** Does the task require learning a rule *in the context window* (e.g., "Here is a new language, here are 3 examples, now write code"), or does it rely on knowledge assumed to be in the weights (e.g., "Write Python to sort this list")?
  **Sufficient Answer:**
  *   **Relies on Weights:** Task tests standard knowledge (math, standard coding, common sense). -> **Return** (Must add a "novel rule" component to test adaptation).
  *   **Relies on Context:** Task requires inferring rules from the prompt itself. -> **Pass**.
  **[JC] Warning:** Distinguishing "recalled pattern" from "inferred rule" is hard. If the "novel rule" looks too much like a known pattern, flag it.

  #### Step 3: The Generalization Gate (The "Environment Test")
  **Theory:** Intelligence is expected performance across a *wide range* of environments, not optimization for one narrow distribution (Legg & Hutter).
  **Ask:** Does the proposal include *adversarial variants*? If I change the surface form (variables, wording, syntax) but keep the logic identical, does the task still hold?
  **Sufficient Answer:**
  *   **Single Distribution:** Task is 200 variations of the *exact* same puzzle structure. -> **Return** (Requires structural perturbations, not just variable swaps).
  *   **Robust Distribution:** Task includes distractors, noise, or structural changes that break simple heuristics. -> **Pass**.
  **[JC] Warning:** You are guessing whether a heuristic can solve all variants. If the variants are generated by a simple script, a simple script might solve them.

  #### Step 4: The Ceiling/Floor Gate (The "Signal Test")
  **Theory:** A psychometric test must discriminate between ability levels. If everyone passes or fails, it measures nothing (Classical Psychometrics).
  **Ask:** Do we have baseline runs? Is the smallest model >10% accuracy and the largest model <95% accuracy?
  **Sufficient Answer:**
  *   **Ceiling Effect:** Largest model >95%. -> **Return** (Task is too easy; needs complexity scaling).
  *   **Floor Effect:** Smallest model <10% (and random chance is ~0%). -> **Return** (Task is broken or too hard; no signal).
  *   **Discriminative:** Clear spread between model sizes. -> **Pass**.

  #### Step 5: The Value Handoff (The "So What?" Test)
  **Theory:** Measuring intelligence is useless if it isn't the *kind* of intelligence the product needs (Instrumentalism).
  **Ask:** If a model improves on this task, does our product get better?
  **Sufficient Answer:**
  *   **Yes:** Capability maps to user value (e.g., "better coding" -> "better Copilot"). -> **Pass to PM**.
  *   **No:** Capability is abstract (e.g., "better at logic grids") with no clear user path. -> **[HO] Handoff to PM**.
  **[HO] Warning:** This is not a technical decision. This is where you stop being an engineer and ask the business what they sell.

  ---

  ### Running the Protocol on Your Proposals

  #### Proposal 1: 200 Variations of Logic-Grid Puzzles
  *   **Step 1 (Contamination):** **Fail/Return.** Logic grids are ubiquitous in training data. Even if the names are changed, the *structure* is contaminated.
      *   *Fix:* Require the proposer to generate *structural* variants (e.g., temporal reasoning instead of spatial) that are less common in text.
  *   **Step 2 (Priors):** **Fail/Return.** This tests crystallized knowledge of puzzle formats, not fluid learning. The model isn't learning a new rule; it's recognizing an old one.
      *   *Fix:* Add a "new rule" layer (e.g., "In this puzzle, 'left' means 'right'").
  *   **Step 3 (Generalization):** **Fail/Return.** "200 variations on the same kind" is the definition of narrow environment. A regex or simple heuristic might solve all 200.
  *   **Step 4 (Ceiling):** **Fail/Return.** You stated the biggest model is at ceiling. It provides zero signal for release decisions.
  *   **Verdict:** **Reject.** It fails the fundamental definition of an eval: it doesn't discriminate, it's contaminated, and it measures narrow pattern matching.
  *   **Note to Proposer:** "We need tasks where our best model fails, and where the rules aren't already in the training set."

  #### Proposal 2: Debugging a Renamed Tutorial Repo
  *   **Step 1 (Contamination):** **Hard Reject.** "Lightly renamed version of a very popular tutorial project" is the exact definition of contamination. The model likely has the solution in its weights.
      *   *Fix:* Only acceptable if the code is functionally altered, not just renamed.
  *   **Step 2 (Priors):** **Fail.** This relies entirely on priors (knowledge of that specific library/pattern). It tests memory retrieval.
  *   **Step 3 (Generalization):** **Fail.** If the repo is a specific tutorial, it's a single environment.
  *   **Verdict:** **Reject.** Do not pass go. This measures "did the model see this GitHub repo in 2023?" not "can the model debug?"
  *   **Note to Proposer:** "If we can find the solution on StackOverflow, it's not an intelligence eval. Please use proprietary code or algorithmically generated bugs."

  #### Proposal 3: Made-Up Programming Language (Your Baby)
  *   **Step 1 (Contamination):** **Pass.** By definition, the language is made-up. It is not in the training set.
  *   **Step 2 (Priors):** **Pass.** This is the strongest point. It tests *efficiency of learning* (ARC style). The model must infer syntax/semantics from the 3 examples in the context window.
  *   **Step 3 (Generalization):** **Conditional Pass.**
      *   *Risk:* Are the 3 examples sufficient to define the language uniquely? Or can the model guess the rule based on pre-training bias (e.g., "it probably works like Python")?
      *   *Fix:* Add "adversarial specs" where the made-up language explicitly contradicts Python norms (e.g., `if` statements don't require colons, or indentation doesn't matter). If the model fails the adversarial spec, it proves it was reasoning, not copying priors.
  *   **Step 4 (Ceiling):** **Check Required.** You need to run this on your smallest and largest models. If the largest model gets 100% immediately, it might be inferring the rule too easily (Step 2 risk).
  *   **Step 5 (Value):** **[HO] Handoff to PM.** Does writing code in made-up languages map to product value?
      *   *Argument for PM:* "This measures *adaptability to new APIs*, which is core to our coding assistant product."
  *   **Verdict:** **Pass with Conditions.**
      *   *Kill Condition:* If the "3 examples" are too similar to standard programming patterns, Step 2 becomes a Judgment Call that might fail.
      *   *Fix:* Ensure the spec includes at least one "trick" that breaks standard coding priors.

  ---

  ### What This Procedure Can't Do (The Limitations)

  You asked for the stuff the procedure gets systematically wrong. Hand this to your PM along with the checklist so they know the risk profile.

  1.  **The Goodhart's Law Trap:**
      *   *Problem:* Once this checklist becomes the standard for "good evals," contractors will optimize proposals to pass the checklist, not to measure intelligence. They will generate "novel" tasks that are structurally identical to old ones but pass the Contamination Gate.
      *   *Result:* The suite becomes a gameable metric, decoupling from actual capability.

  2.  **The "Stochastic Parrot" Blind Spot:**
      *   *Problem:* No behavioral test can distinguish *understanding* from *simulation* (Philosophy of Mind). A model can pass your "Made-Up Language" task by statistically predicting the next token correctly without "knowing" what the language does.
      *   *Result:* This procedure certifies *performance*, not *cognition*. It tells you the model works, not *why*.

  3.  **The Distribution Shift:**
      *   *Problem:* This procedure validates tasks against *current* models. It cannot predict if a task will become trivial for *future* models (the Ceiling Gate only catches current ceilings).
      *   *Result:* Your suite will rot. A task that passes Step 4 today might be trivial in 6 months. You need a process to retire tasks, not just approve them.

  4.  **The Value Alignment Gap:**
      *   *Problem:* Step 5 hands off to the PM, but PMs optimize for demos, not safety or robustness. A task can measure "intelligence" (e.g., "write convincing phishing emails") that passes all technical gates but violates company values.
      *   *Result:* You can build a perfectly valid psychometric suite that measures capabilities you shouldn't be releasing.

  5.  **The "General Intelligence" Illusion:**
      *   *Problem:* The debate between $g$ (general) vs. $s$ (specific) is unresolved. This procedure assumes we can isolate "general reasoning." We might just be measuring a different kind of narrow skill (e.g., "following weird instructions") and calling it intelligence.
      *   *Result:* You might reject a valuable narrow skill (e.g., "knows SQL") because it fails the Priors Gate, even if that's exactly what the customer pays for.

  **Final Advice:** Use the procedure to kill the obvious garbage (Proposal 1 & 2). Use the [HO] flags to force your PM to own the value decisions. Use the Limitations section to protect yourself when the model passes the evals but fails in production.
