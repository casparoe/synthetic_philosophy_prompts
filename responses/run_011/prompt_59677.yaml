answer: |-
  It is a pleasure to meet a colleague who understands that a number without a unit is just noise. Your intuition that Harsanyi's result is often treated as a physical law rather than a calibration protocol is correct. Let's treat this like an instrument validation report.

  ### 1. Repairing the Statement of the Theorem

  Your summary is close, but there are two specific calibration errors in the setup that matter for the output.

  **Correction A: The Pareto Condition.**
  You wrote: *"society is indifferent whenever all the individuals are."*
  This is too weak. The theorem requires the **Pareto Principle**: If *every* individual strictly prefers lottery $A$ to lottery $B$, then society must strictly prefer $A$ to $B$. (Indifference when all are indifferent is a corollary, but the driving force is the strict preference).

  **Correction B: Weights vs. Symmetry.**
  You wrote: *"the social utility function has to be a weighted sum... the equal weights come out of symmetry."*
  Strictly speaking, Harsanyi's 1955 theorem proves the social welfare function is a **weighted sum** ($\sum a_i U_i$). It does *not* prove the weights are equal. To get equal weights ($a_i = a_j$), you must add an explicit **Anonymity** axiom (what you called "rearranging things"). Without Anonymity, the theorem is consistent with a weighted utilitarianism that privileges certain individuals (e.g., "guardians" or "citizens" over "residents").

  **Revised Statement:**
  If (1) individuals and society satisfy VNM expected-utility axioms over the same lotteries, (2) the Social Welfare Function satisfies the Pareto Principle, then (3) Social Welfare is a linear combination of individual utilities ($W = \sum a_i U_i$). If (4) Anonymity is added, then (5) all $a_i$ are equal.

  ### 2. The Load-Bearing Assumption

  You suspect separability. You are half-right, but the heavier load is carried by the requirement that **Society itself must satisfy the VNM Independence Axiom.**

  In measurement terms: You are requiring the social meter to have the same linearity properties as the individual meters.
  *   **Individuals:** Risk-averse, risk-neutral, or risk-seeking regarding their own outcomes (encoded in the curvature of their $U_i$).
  *   **Society:** The theorem forces Society to be **risk-neutral regarding the distribution of utility.**

  If you want Prioritarianism (giving extra weight to the worse off), you are effectively applying a concave transformation to the individual utilities before summing them ($W = \sum f(U_i)$ where $f$ is concave). This violates the Social VNM axioms. Specifically, it violates **Independence**. A prioritarian society would reject a fair coin toss between giving 10 units to the rich person or 10 units to the poor person, in favor of a sure 5 units to the poor person, even if the expected utility sum is identical.

  **Verdict:** The "moral claim in technical costume" is the insistence that *Social Choice under Risk* must obey the same rationality constraints as *Individual Choice under Risk*. That is the axiom doing the work.

  ### 3. The Comparability Business (The Standards Problem)

  This is where your calibration background is most relevant. VNM utilities are unique only up to a **positive affine transformation** ($U' = aU + b, a > 0$).
  *   Unit ($a$): How much does a unit of utility matter?
  *   Zero-point ($b$): What counts as neutral?

  To sum $U_1 + U_2$, you must have a common standard for both $a$ and $b$. You cannot add meters to seconds. Harsanyi knew this. He argued for **Cardinal Unit Comparability**. He tried to derive this via the "Impartial Observer" thought experiment: if I have an equal chance of being anyone in society, my expected utility calculation forces the calibration.

  **The Structural Exposure:**
  If you do not accept the Impartial Observer as a calibration mechanism, the theorem licenses *any* set of weights. A Harsanyian must argue that the "veil of ignorance" is not just a moral device but a **measurement protocol** that fixes the zeros and units across persons. If utilities are not interpersonally comparable, the sum $\sum U_i$ is dimensionally incoherent.

  ### 4. Variable Populations and Probabilities

  **Variable Population:**
  The theorem assumes a fixed set of individuals $N = \{1, ... n\}$.
  *   **Fatal Flaw:** It cannot handle policies that change *who* exists (e.g., climate policy, reproductive rights). Extending the theorem to variable populations leads to the "Repugnant Conclusion" (Total Utilitarianism) or "Absurd Conclusion" (Average Utilitarianism). There is no theorem-derived escape here; you must add new axioms (like Critical-Level Utilitarianism), which breaks the pure Harsanyi derivation.

  **Subjective Probabilities:**
  You recall correctly. Harsanyi assumes **objective lotteries** (everyone agrees on the probability of state $S$).
  *   **The Mongin Result (1995):** If individuals have *different* subjective probabilities (priors) about the world, and you maintain the Pareto principle, you cannot aggregate preferences into a Social EU function without the Social Probability also being a weighted average of individual probabilities.
  *   **The Cut:** This is deep. If people disagree on the science (the probabilities), the theorem cannot generate a social ranking without essentially averaging their beliefs. If you enforce a "Common Prior" to save the theorem, you are stipulating agreement rather than deriving it.

  ### 5. Ranking the Objections

  Here is the stress-test ranking you requested, from the perspective of a committed Harsanyian trying to hold the line.

  | Objection | Rating | Reasoning |
  | :--- | :--- | :--- |
  | **Interpersonal Comparability** | **Fatal** | Without a calibration standard for zeros/units across persons, the sum is mathematically meaningless. This is the "standards work" failure. |
  | **Social VNM / Independence** | **Fatal** | This is the moral core. Rejecting this admits that Society should *not* treat risk the way a rational individual does. This concedes the Prioritarian point. |
  | **Variable Population** | **Fatal** | The theorem simply does not apply. Using it here is a category error. |
  | **Subjective Probabilities** | **Awkward-but-Survivable** | A Harsanyian can argue that for public policy, we should use "best available science" as the objective probability, treating disagreement as error rather than valid preference divergence. |
  | **Anonymity (Equal Weights)** | **Concedable** | A Harsanyian can admit equal weights require a separate moral axiom (Anonymity) and not pretend it falls out of the algebra alone. |

  **What the Theorem Rules Out:**
  It rules out any view that cares about the *shape* of the distribution independent of the sum. It rules out:
  1.  **Strict Egalitarianism:** (Caring about variance).
  2.  **Prioritarianism:** (Caring about the absolute level of the worst-off via concave transformation).
  3.  **Sufficientarianism:** (Caring only about getting people above a threshold).
  All three violate the Social Independence axiom.

  ### 6. The Meta-Worry: Falsifiability vs. Qualification

  You asked: *"Is this view risking anything at all, or has it been qualified into unfalsifiability?"*

  A theorem cannot be falsified; it is a tautology. The *model* is falsifiable.
  *   **The Risk:** The risk is **Axiom Shopping**. If a Harsanyian rejects Prioritarianism *because* it violates the theorem, but then rejects the theorem's implications (e.g., the Repugnant Conclusion) by adding new axioms only when the result becomes distasteful, the position is unfalsifiable.
  *   **The Defense:** A rigorous Harsanyian accepts the bad implications (like the Repugnant Conclusion) as the cost of doing business. If they do that, the view is risky. It risks being rejected because the implications are morally intolerable.
  *   **The Defect:** The defect arises when the "Impartial Observer" is used to calibrate utilities (to make the sum possible) but then also used to justify the weights (to make them equal). This circles the wagons. It risks being a formalization of a intuition rather than a derivation of one.

  ### 7. Confidence and Uncertainty

  **Confidence in Main Claims:** **High (90%+).**
  The structural analysis of Harsanyi's theorem, the role of the VNM axioms, and the necessity of interpersonal comparability are standard results in social choice theory and welfare economics. The distinction between the 1955 aggregation result and the 1977 impartial observer justification is well-documented.

  **The Point I Am Least Sure Of:**
  I am least certain about the **survivability of the Subjective Probability objection** in non-ideal theory.
  *   *Why:* While Mongin's theorem is mathematically sound, there is ongoing debate in epistemic social choice about whether "relaxing Pareto" (ignoring unanimous preferences based on false beliefs) saves the Harsanyi framework enough to make it usable in real policy contexts where scientific consensus is imperfect. A committed Harsanyian might argue that "objective probabilities" in the theorem should be interpreted as "epistemically justified credences," which sidesteps the math but changes the philosophy. I am less confident in predicting how much water that specific patch holds.

  **Summary for your Reading Group:**
  Tell them the instrument works, but only if you calibrate the zeros and units across people (Comparability), only if you assume the population is fixed (No demographic change), and only if you accept that Society must be risk-neutral about distribution (Social VNM). If you want Prioritarianism, you aren't breaking the math; you are declaring that Society is a different kind of instrument than an Individual.
