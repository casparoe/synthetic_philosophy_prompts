  1. Redo the arithmetic in both examples and tell me if any of my numbers are off, including the tangency point and the claim that Nash and KS agree on every linear frontier.
  2. Is my gloss on monotonicity right, and is it right that the axiom is silent about the player who doesn't gain?
  3. Is the sayable-but-inflatable tension an actual insight, or am I rediscovering the standard IIA-versus-monotonicity tradeoff with better rhetoric? Be blunt about which.
  4. Of worries (a) and (b), which one really damages the piece, and what would you do about it?

