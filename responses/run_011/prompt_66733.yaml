answer: |-
  | rule | one-line statement | calls it fits cleanly | calls it strains or fails | patch needed | verdict on the points case | confidence (1–5) | why |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Anti-Market Allocation** | Public benefits allocated by queue/lottery cannot be traded for cash. | Housing Waitlist, Surge Pricing, Points Transfer (pred) | Blood Drive, Bone Marrow, Book Rewards | Expand definition of "public benefit" to include bodily integrity and educational outcomes. | Reject | 5 | Housing Waitlist is nearly identical; monetizing queue position undermines the allocation mechanism. |
  | **Civic Compensation** | Payment is permissible for time/burden, not for outcomes or access rights. | Juror Pay, Budgeting Workshop | Nicotine Test, Book Rewards, Naming Rights | Distinguish "health compliance" (Nicotine) from "educational achievement" (Books) as public cost vs. pedagogical integrity. | Reject | 4 | Points are access rights, not compensation for time; fits the "not for access" clause. |
  | **Public Integrity** | The city cannot facilitate transactions that commodify public trust or assets. | Naming Rights, Housing Waitlist, Surge Pricing | Nicotine Test, Juror Pay, Budgeting Workshop | Clarify that compensating participants (Jurors) differs from selling public assets (Naming Rights). | Reject | 5 | Selling priority points commodifies the school assignment system, a core public trust. |

  Renata's track record suggests a robust distinction between compensating individuals for their *participation* in civic processes versus creating markets for *access* to public goods. The closest analog is the **Housing Waitlist** case. In that instance, a broker sought to monetize a queue position for public housing, which was killed. The school points proposal is structurally identical: it monetizes a queue position (priority points) for public education. The fact that the district would retain 40% of the revenue does not distinguish it sufficiently from the **Naming Rights** case, where the city would have received $1M directly but still killed the proposal. Revenue destination appears irrelevant; the mechanism itself (selling access) is the poison pill.

  The only significant tension in the record is the **Nicotine Test** approval versus the **Book Rewards** kill. Both involve paying students for outcomes. A plausible reconciliation is that nicotine cessation reduces immediate public health costs (a net fiscal save), whereas paying for reading risks crowding out intrinsic educational motivation (a pedagogical cost). The points transfer case aligns more with the Housing Waitlist than the Nicotine Test because it involves transferring entitlements between families rather than incentivizing a behavior change that benefits the public fisc. The "Equity Fund" feature (40% to tutoring) attempts to frame this as a public benefit, but Renata's rejection of Naming Rights suggests she views the commodification itself as the harm, regardless of how the proceeds are used.

  If the record underdetermines anything, it is whether a *fully public* market with *redistributive intent* could ever pass. The Housing Waitlist involved a private broker, whereas this proposal is district-run. However, given the Naming Rights precedent, Renata likely views the city's involvement in the sale as making it worse, not better. To separate the surviving rules, the city should stage a case where the city auctions a non-essential public asset (e.g., surplus computers) with 100% of proceeds funding a social program. If approved, it signals revenue destination matters; if killed, it confirms the Anti-Market Allocation rule is absolute regarding public goods.

