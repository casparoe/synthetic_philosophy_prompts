answer: |-
  Dear Colleague,

  It is a genuine pleasure to correspond with someone who has spent a lifetime in the dirt of actual science and now finds themselves wrestling with the architecture of justification. I know well the feeling of retiring from the bench only to realize the questions you were answering were built on foundations you never got to inspect. You are right to reach for Lakatos, and you are right to worry that his machinery is too heavy for a foundation panel that meets on Saturdays. What you need is not a lecture on methodology but a sieve, something that catches the degenerating programmes before they consume your budget while letting the progressive ones through, even if they are messy. The procedure I am proposing here is built to be run by your lawyer and your schoolteacher without needing them to understand the difference between a heuristic and a hypothesis, but it keeps the spine of Lakatos intact enough to prevent you from simply funding whatever sounds confident.

  The procedure runs as a sequence of four questions that you ask of every letter of inquiry, and you stop asking the moment the answer is no. The first question is about the hard core, though you will not call it that. You ask the applicants to state the one idea they are not willing to give up, the central claim that makes their work distinct from everyone else. A satisfactory answer is a single sentence that identifies a causal mechanism or a structural relationship, not a goal. If they say they want to cure a disease or improve yield, that is a goal, not a core, and you reject it immediately because you are funding research programmes, not service projects. This is where the big established group asking for an instrument will likely fall. If they cannot articulate the theoretical assumption that makes this specific instrument necessary beyond general utility, they are offering a tool, not a programme. You hand that to the board as a service request, not a science grant, or you reject it if your mandate is strictly research. This distinction must survive the trip from philosophy to practice, because without a hard core, there is nothing to protect and nothing to test, only tasks to complete.

  The second question addresses the protective belt. You ask them to describe the last time their data disagreed with their core idea and what they changed to account for it. A satisfactory answer describes a modification to their method or an auxiliary hypothesis that allowed them to keep the core while explaining the anomaly. An unsatisfactory answer is either that they never have anomalies, which is dishonest, or that they changed the core idea itself, which means they are starting a new programme and should be evaluated as such. This is where you need your schoolteacher. She does not need to know the science to know if the explanation sounds like a patch or a discovery. If the change they made was to blame the equipment, the weather, or the sample without independent verification, that is a degenerating shift. Here is where I must blur Lakatos slightly. Lakatos views this historically, but you are looking prospectively. You cannot know if the belt is holding or rotting until later, so you are betting on the honesty of their accounting. If they admit to the anomaly and show how they adjusted the belt without touching the core, they pass. If they hide the anomaly, they fail.

  The third question is about novelty, and this is where your current rule is too rigid. You require a dated prediction before the run and a phenomenon outside the original scope. This is a gold standard, but it will kill high-risk work where the phenomenon is discovered during the process. A satisfactory answer here is any prediction that was committed to before the data was analyzed, even if the phenomenon was known, provided the specific outcome was not guaranteed by the theory's original design. You should accept preregistered analysis plans as equivalent to dated predictions. Where your rule might misfire is on exploratory work that stumbles into a confirmation. If they found something unexpected and then built a model to fit it, that is accommodation, not prediction, and under Lakatos, it counts for less. You should not reject it outright, but it does not count as a progressive shift. It counts as maintaining the programme. To count as progressive, they need to show they are leading the data, not chasing it. This distinction absolutely has to survive. If you fund people who only explain what they already see, you are funding history, not science.

  The fourth question is about the ad hoc nature of their auxiliaries, and your rule here is strong but needs a warning. You call an hypothesis ad hoc if it does no work anywhere else. This is usable, but you must beware of theoretical work masquerading as independent support. Just because a patch fits into another model does not mean it has empirical bite. A satisfactory answer requires them to show that the auxiliary hypothesis they are using to save their core has been tested in a different context with different data. If the only support for the patch is that it saves the theory, it is ad hoc. If the patch predicts something else that was also confirmed, it is progressive. This is the point where you hand the decision to the panel. If the science passes the first three questions, the fourth is often about values. Are we willing to bet on this team? Are we willing to bet on this field? The lawyer and the schoolteacher are equal to the scientists here because this is no longer about method; it is about trust and potential.

  Now we must address the deadline problem, which is the thorniest part. You are correct that Lakatos refuses to set a time limit on a degenerating programme because he knows that sometimes the truth lies at the end of a long tunnel of failures. But you are a foundation, not the history of science. You have an opportunity cost. The rule you need is that a programme gets three funding cycles to show a novel confirmation. If after three cycles they have only patched anomalies without a single novel prediction confirmed, the programme is degenerating for your purposes. This does not mean the theory is false, only that it is no longer productive enough for your investment. You write this rule not as a verdict on truth but as a verdict on momentum. If they cannot show forward motion in three cycles, you stop funding the core and perhaps fund a workshop to see if the core should be abandoned. This imposes a boundary that Lakatos would dislike, but it is necessary for stewardship.

  Let us run this on your three cases. The group working on excess heat in metal hydrides for thirty years will fail at the second question. They have a long tail of explanations for failed replications, which means their protective belt is thick with ad hoc auxiliaries. The recent preprint with the isotope signature is a single novel prediction, but after thirty years of degeneration, one swallow does not make a summer. The procedure says reject, or at best fund a workshop to verify the measurement independently before committing to the programme. The burden of proof is on them to show the belt is not just patched but strengthened. The insect navigation group is the ideal candidate. They are four years old, have a bold core, and have already changed how neighboring labs work. This is a positive heuristic in action. They have dated predictions in the works. Even though nothing is confirmed yet, the programme is theoretically progressive because it is generating new lines of inquiry for others. You invite a full proposal. The big established group asking for an instrument fails the first question. If they have no theory they can identify, they have no hard core. They are providing a service. Unless they can show that this instrument is essential to test a specific auxiliary hypothesis of a progressive programme, you reject them as a research grant. They belong in a capital budget, not a science panel.

  There is one case where this procedure will say no to something you would personally fight for, and I need to say this bluntly. Imagine a long-term plant breeding program aimed at stabilizing yield in a changing climate, where the theory of inheritance is standard and unchanging. The team is not making novel predictions about genetics; they are selecting for resilience using established methods. They are patching the variety to fit the environment every year. Under this procedure, this is a degenerating programme because the hard core is not being tested or expanded, and the auxiliaries are ad hoc adjustments to local conditions. You would want to fund this because it feeds people and builds resilience, but the procedure will tell you to reject it because it is not theoretically progressive. It is empirically successful but philosophically stagnant. You will have to override the procedure here using the value judgment hand-off, acknowledging that you are funding social utility, not scientific progress. This is where the lab coat comes off and the citizen puts it back on.

  Finally, you need to know what this procedure cannot do. It cannot tell you if the science is technically feasible; your two working scientists must cover that. It cannot tell you if the team is ethical; your lawyer must cover that. It cannot measure the societal impact of the work, only the scientific momentum. And it cannot protect you from bad luck. A progressive programme can fail because the equipment broke, and a degenerating one can get lucky. The three-sentence reason you owe the board should simply reflect the step where the proposal stopped. If it failed the core, say they have no central theory. If it failed the novelty, say they are explaining past data rather than predicting new results. If it passed everything, say they are leading the field with testable new claims. The rest is judgment wearing a lab coat, and no amount of philosophy will remove the need for you to look your colleagues in the eye and decide if their hope is worth your money. I hope this serves you well in those Saturday meetings.

  Sincerely,

  A Fellow Traveler
