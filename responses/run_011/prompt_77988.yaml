  2.  **Deconstruct Lakatos for the Panel:**
      *   *Core Concepts:* Hard Core (untouchable assumptions), Protective Belt (auxiliary hypotheses), Positive Heuristic (how to develop), Negative Heuristic (what not to touch), Progressive vs. Degenerating Problem Shifts.
      *   *Adaptation:* Need to simplify "Hard Core" to "Central Idea" and "Protective Belt" to "Explanations for Failure." Progressive shift = new predictions confirmed. Degenerating = patching after the fact.
      *   *Blurring:* Lakatos is historical and retrospective. Grant review is prospective. We have to blur the line between "is this programme progressive?" and "will this programme become progressive?" We also have to blur the strict definition of "Hard Core" because grant proposals often mix theory and method.
      *   *Surviving Distinctions:* The difference between predicting something new vs. explaining something old (novelty), and the difference between a patch that does work elsewhere vs. a patch made only to save the theory (ad hoc).

  3.  **Address User's Specific Checks:**
      *   *Novelty:* User requires dated pre-registration and outside original scope. This is good but might miss "natural experiments" or where pre-registration isn't culture (some fields). It might be too rigid for exploratory work.
