answer: |-
  # Dissertation Proposal

  **Title:** Invariant Aggregation: Harsanyi's Theorem on a Lattice of Partitions

  **Candidate:** [Your Name]
  **Programme:** Master of Arts in Philosophy (Part-Time)
  **Proposed Supervision:** [To Be Assigned]
  **Word Count:** Approx. 3,500

  ---

  ## 1. Introduction and Motivation

  Standard social choice theory operates on a fixed ontology. In Harsanyi's Aggregation Theorem, the fundamental assumption is that all individual preference orderings and the resulting social preference ordering are defined over the same set of lotteries, generated from a common finite set of basic prospects. This shared domain is rarely interrogated; it is treated as a background condition necessary for the mathematics to function. However, in complex decision environments—ranging from large-scale algorithmic ranking systems to multi-level governance—the "outcomes" being evaluated are often descriptions of a common underlying reality at varying levels of granularity.

  This problem arises acutely in my professional work on product-search ranking. Relevance signals are computed at different levels of the catalog hierarchy: some at the level of individual Stock Keeping Units (SKUs), others at the product family level, and others at the category level. When these signals are merged into a single ordering, the result is not invariant under the choice of level. Aggregating at the SKU level and then rolling up to the category yields a materially different ordering than rolling up the signals to the category level and then aggregating. This is not merely an engineering nuisance; it is a structural instability in the aggregation of value.

  This engineering constraint maps onto a gap in the philosophical literature on utilitarianism and social welfare. Harsanyi's theorem derives a social welfare function as a linear combination of individual utilities. However, the theorem's normative force relies on the assumption that the "individuals" are comparable entities evaluating the same world. If we reinterpret "individuals" as "levels of description" or acknowledge that agents themselves may evaluate prospects at different resolutions, the standard derivation falters. The weights in the Harsanyi aggregation are typically understood as ethical parameters reflecting the relative moral weight of persons. But if the domain of evaluation shifts, do these weights shift as well? If the weights are level-dependent, the utilitarian reading of Harsanyi's theorem becomes unstable, as the moral calculus would depend on arbitrary choices of description.

  This dissertation proposes to formalize this problem. It treats the "outcome space" not as a fixed set, but as a lattice of partitions over a common underlying state space. It asks whether a Harsanyi-style linear representation can survive the transition across these partitions without losing its normative coherence. The project is not merely to prove a mathematical theorem but to determine whether the requirement of *description invariance*—the demand that social evaluation should not change merely because we changed the resolution of our ontology—imposes constraints strong enough to address the longstanding objection regarding interpersonal utility comparability.

  ## 2. Statement of the Research Question

  The literature on Harsanyi's Aggregation Theorem generally accepts the common domain assumption as a prerequisite. Consequently, there is no determinate answer in the existing literature regarding aggregation across non-aligned domains. To make this project manageable within an eight-month Master's timeframe, the research question must be narrowed from a general investigation of "granularity" to a specific inquiry about the stability of aggregation weights.

  **Primary Research Question:**
  *Under what coherence conditions on utility functions defined over a lattice of partitions does a Harsanyi-style linear aggregation representation exist that is invariant under refinement, and does this invariance requirement uniquely determine the interpersonal weighting scheme?*

  This question breaks down into two subordinate inquiries:
  1.  **Formal:** If individual utilities are defined on different partitions of a common state space, linked by linear coherence conditions (e.g., the utility of a coarse cell is the weighted average of the utilities of its refinements), does the social welfare function retain a fixed vector of weights across all levels, or must the weights vary by level to maintain consistency?
  2.  **Normative:** If the weights must vary by level to maintain mathematical consistency, does this vindicate the critique that Harsanyi's theorem aggregates expected utilities rather than utilities (making the weights sensitive to arbitrary scaling)? Conversely, if invariance *forces* the weights to be fixed, does this provide a structural solution to the interpersonal comparability problem that does not rely on substantive ethical premises?

  The goal is a determinate answer: either a proof that description invariance fixes the weights (thereby solving the comparability problem structurally), or a proof that it does not (thereby isolating the comparability problem as independent of descriptive granularity).

  ## 3. Context and Existing Positions

  To justify this project, it is necessary to show why existing interpretations of Harsanyi's theorem do not already resolve this issue. Three dominant positions in the literature leave the specific question of partition variance open.

  **1. The Standard Utilitarian Reading**
  The orthodox interpretation holds that Harsanyi's theorem provides a formal vindication of utilitarianism: if individuals and society satisfy the von Neumann–Morgenstern (vNM) axioms and society satisfies the Pareto principle, social welfare must be a weighted sum of individual utilities. This reading assumes a fixed outcome space. It treats the "zero point" and "scale" of individual utilities as fixed by the vNM structure up to positive affine transformations. The literature here focuses on the ethical justification of the weights (e.g., should they be equal?). It does not address what happens when the "outcomes" themselves are aggregates of finer outcomes. If the outcome space changes, the affine transformations available to each agent might change differently, potentially altering the relative weights. The standard reading has no mechanism to handle this because it assumes the domain is invariant.

  **2. The Ex Ante Pareto Constraint**
  A second strand of literature, often critical of the utilitarian reading, argues that Harsanyi's theorem merely establishes an *ex ante* Pareto constraint rather than a substantive moral theory. On this view, the aggregation is procedural: if everyone prefers lottery A to B, society should too. This view is agnostic about the ontology of the outcomes. However, it relies on the comparability of the *probabilities* assigned to the outcomes. In a multi-level partition system, probabilities are not invariant. A probability assigned to a coarse category is the sum of probabilities of its refinements. If agents assign probabilities at different levels (e.g., one agent assesses risk at the SKU level, another at the Family level), the *ex ante* Pareto condition becomes ambiguous. The existing literature on *ex ante* vs. *ex post* utilitarianism discusses risk, but it does not discuss the structural incommensurability of outcome descriptions. Therefore, this position cannot answer whether the aggregation weights remain stable when the description level shifts.

  **3. State-Dependent Utility Variants**
  A third approach modifies Harsanyi's framework to allow for state-dependent utilities, where the value of an outcome depends on the state of the world in which it is received. While this relaxes the assumption of fixed utilities, it typically retains a common state space. The problem I am proposing is distinct: it is not that the *value* depends on the state, but that the *definition* of the state depends on the agent (or signal). This is closer to the literature on "Awareness Growth" (where agents become aware of new contingencies), but Awareness Growth is typically dynamic (time $t_1$ vs. $t_2$). My proposal concerns a static lattice of descriptions available simultaneously. The state-dependent variants do not offer a mechanism for aggregating preferences when the agents effectively inhabit different, albeit related, ontological spaces.

  In summary, the existing positions assume that the "description" of the world is neutral. My project challenges this by treating the description level as a variable that interacts with the aggregation weights. None of the existing positions offer a formal account of aggregation over a lattice of partitions, leaving the research question open.

  ## 4. Methodology

  The method for this dissertation will be **formal reconstruction and normative analysis**. This involves constructing a mathematical model of the problem using finite set theory and linear algebra, deriving the conditions for invariance, and then interpreting the mathematical results philosophically.

  **The Formal Model:**
  I will model the "underlying reality" as a finite set $S$. A "level of description" will be modeled as a partition $\Pi$ of $S$. A utility function at level $\Pi$ is a function $u: \Pi \to \mathbb{R}$. Coherence between levels will be modeled via refinement maps. If $\Pi'$ refines $\Pi$, there exists a linear map $M$ such that $u_{\Pi} = M u_{\Pi'}$. The social welfare function $W$ will be sought in the form of a linear aggregation of these utilities. The core mathematical task is to determine if there exists a weight vector $w$ such that $W$ is invariant regardless of which $\Pi$ is used for the calculation, given the coherence constraints.

  **Defense Against Alternative Methods:**

  *   **Alternative 1: The Arrow-style Impossibility Approach.**
      One might argue that this problem should be framed as an impossibility theorem in the tradition of Kenneth Arrow, seeking to prove that no aggregation function can satisfy a set of reasonable axioms across partitions.
      *   *Rejection:* Arrow's framework relies on ordinal preferences. The engineering problem that motivates this dissertation (and the Harsanyi framework that addresses it) is inherently cardinal. Ranking systems deal with scores (click-through rates, relevance magnitudes), not just orderings. Furthermore, Arrow's theorem is a negative result; it tells us what we *cannot* do. For a Master's dissertation with a normative aim, a constructive approach (Harsanyi-style) is more productive. It allows us to ask *under what conditions* aggregation is possible, rather than simply proving it is impossible. The goal is to find the specific coherence conditions that *save* the aggregation, not to bury it.

  *   **Alternative 2: Empirical Study of Ranking Systems.**
      Given my background, one might suggest an empirical analysis of actual search ranking logs to measure the divergence between aggregation levels.
      *   *Rejection:* While I have access to this data, an empirical study would yield a descriptive claim (e.g., "divergence occurs in 40% of queries"). It would not yield the *normative* conclusion required for a philosophy dissertation. The philosophical question is whether the divergence *matters* and whether invariance is a *requirement*. Empirical data cannot answer whether we *ought* to prefer invariant descriptions. The engineering case serves as the motivating analogy, but the dissertation must remain a work of normative theory. Using the engineering case as the primary data source would risk conflating "what the system does" with "what rational aggregation requires."

  **Why Formal Reconstruction?**
  Formal reconstruction is the only method capable of isolating the specific variable of "granularity." Conceptual analysis alone is too imprecise to handle the combinatorics of partitions. By building the model, I can demonstrate exactly where the standard Harsanyi proof breaks and what additional axioms are required to repair it. This aligns with the "rational reconstruction" method common in decision theory, where the goal is to clarify the commitments of a theory by testing its limits.

  ## 5. Mathematical Scope and Competency

  A candid assessment of the mathematical requirements is essential for the feasibility of this project.

  **Competency:**
  My mathematical background includes linear algebra, elementary probability, and some real analysis. I do not have training in measure theory or advanced topology.

  **Scope Limitation:**
  To remain within my competency while preserving the philosophical integrity of the project, I will restrict the model to **finite outcome spaces**.
  *   *Justification:* In the engineering context (product catalogs), the set of items is large but finite. In the philosophical context, restricting to finite sets is a standard simplification in decision theory (e.g., standard formulations of Harsanyi's theorem often begin with finite lotteries). This avoids the need for measure theory (sigma-algebras, integration over continuous spaces).
  *   *Implication:* The "partitions" will be finite set partitions. The "linear maps" will be matrices. The "utilities" will be vectors. This allows me to use linear algebra (matrix rank, null spaces, eigenvalues) to determine the existence and uniqueness of the aggregation weights.
  *   *Risk:* A critic might argue that finite sets ignore important limit cases. I will address this in the dissertation by noting that the normative principle of description invariance should hold for finite cases before being extended to infinite ones. If it fails in the finite case, the infinite case is moot.

  This scope ensures the mathematics serves the philosophy rather than becoming a technical barrier. The focus remains on the interpretation of the weights and the normative requirement of invariance, not on the analytical properties of infinite spaces.

  ## 6. Work Plan (8 Months)

  This plan assumes a workload of four evenings per week (approx. 12–15 hours) alongside full-time employment. It includes buffer time for professional deadlines.

  **Month 1: Formalization and Literature Review**
  *   *Goal:* Finalize the mathematical model and complete the literature review.
  *   *Tasks:*
      *   Draft the formal definitions of the partition lattice and coherence maps.
      *   Deep dive into Harsanyi's original proof to identify exactly where the common domain is used.
      *   Review literature on "Awareness Growth" and "Description Dependence" to ensure no duplication.
      *   *Deliverable:* A 5-page technical note defining the model and a bibliography.

  **Month 2: The Existence Proof (Drafting)**
  *   *Goal:* Determine if a linear representation exists.
  *   *Tasks:*
      *   Attempt to construct the aggregation function using matrix algebra.
      *   Identify the "coherence conditions" required for the utilities to map across levels.
      *   Consult with a mathematics colleague (informal) to verify the linear algebra.
      *   *Deliverable:* Draft of Chapter 2 (The Formal Model).

  **Month 3: The Invariance Question**
  *   *Goal:* Test for weight stability.
  *   *Tasks:*
      *   Analyze whether the weights derived in Month 2 are dependent on the partition level.
      *   Construct counter-examples where weights shift.
      *   *Deliverable:* Draft of Chapter 3 (Mathematical Results).

  **Month 4: Normative Interpretation**
  *   *Goal:* Connect math to philosophy.
  *   *Tasks:*
      *   Analyze the philosophical implication of level-dependent weights.
      *   Draft the argument regarding "Description Invariance" as a normative principle.
      *   *Deliverable:* Draft of Chapter 4 (Normative Analysis).

  **Month 5: Critique and Objections**
  *   *Goal:* Stress-test the argument.
  *   *Tasks:*
      *   Anticipate objections (e.g., "Why should we care about invariance?").
      *   Refine the argument regarding interpersonal comparability.
      *   *Deliverable:* Draft of Chapter 5 (Objections and Replies).

  **Month 6: Full Draft Assembly**
  *   *Goal:* Compile the first full draft.
  *   *Tasks:*
      *   Write Introduction and Conclusion.
      *   Assemble chapters.
      *   Check word count and flow.
      *   *Deliverable:* Complete First Draft.

  **Month 7: Revision and Supervision**
  *   *Goal:* Incorporate feedback.
  *   *Tasks:*
      *   Submit draft to supervisor.
      *   Revise based on feedback (likely focusing on the clarity of the philosophical payoff).
      *   Tighten the mathematical proofs for readability.
      *   *Deliverable:* Second Draft.

  **Month 8: Final Polish and Submission**
  *   *Goal:* Submission readiness.
  *   *Tasks:*
      *   Proofreading and formatting.
      *   Final check of citations.
      *   Submission.
      *   *Deliverable:* Final Dissertation.

  ## 7. Success and Failure Criteria

  It is vital to define what constitutes a successful outcome for a project of this nature, as "proving a theorem" is not the only metric of success in philosophy.

  **Success:**
  A successful dissertation will achieve one of the following determinate results:
  1.  **Positive:** A proof that description invariance *requires* fixed interpersonal weights, accompanied by a robust argument that this structurally resolves the comparability objection without needing extra ethical assumptions.
  2.  **Negative:** A proof that description invariance is compatible with *variable* weights, accompanied by a robust argument that this isolates the comparability problem as a substantive ethical issue that formal structure cannot solve.
  3.  **Conditional:** A characterization of the specific coherence conditions (e.g., "utilities must be additive across partitions") under which invariance holds, showing that these conditions are either plausible or implausible in real-world decision contexts.

  In all successful cases, the dissertation will have clarified the hidden ontological commitments of Harsanyi's theorem.

  **Failure:**
  The project would fail if:
  1.  **Mathematical Impasse:** The linear algebra proves intractable within the finite set constraint (unlikely given the scope, but possible if the lattice structure becomes too complex).
  2.  **Triviality:** The result turns out to be mathematically trivial (e.g., invariance is only possible if all utilities are identical), rendering the philosophical discussion moot.
  3.  **Scope Creep:** The attempt to solve "interpersonal comparability" proves too ambitious, resulting in a vague conclusion that "more work is needed." (To mitigate this, the proposal frames comparability as a *test case* for the utility of invariance, not the sole goal).

  ## 8. Candid Assessment of Viability and Novelty

  You requested a direct assessment of whether this question is settled or merely a technical exercise. I will provide this without flattery.

  **Is it settled?**
  No, not in this specific formulation. The literature on **Awareness Growth** (e.g., Dietrich, List) deals with changing state spaces, but it focuses on how a *single* agent updates beliefs when they become aware of new contingencies. It does not typically address the *simultaneous aggregation* of preferences defined over different partitions. The literature on **Hierarchical Forecasting** in statistics deals with aggregating across levels, but it treats the problem as one of error minimization, not normative consistency or interpersonal welfare. Your specific intersection—Harsanyi aggregation + Partition Lattices + Normative Invariance—is novel.

  **Is it a technical exercise wearing philosophy as a costume?**
  There is a significant risk of this. The mathematical question ("Can we map vectors between subspaces consistently?") is essentially linear algebra. The philosophical payoff depends entirely on the argument in Chapter 4 (Normative Interpretation). If the dissertation stops at "The weights depend on the level," it is a technical note. It becomes philosophy only if you argue *why* level-dependence is unacceptable (or acceptable) and what that implies for moral theory.
  *   *The Risk:* You might prove that weights *must* vary, and then struggle to find a philosophical conclusion other than "Harsanyi is fragile."
  *   *The Mitigation:* You must frame the "Description Invariance" principle as a substantive normative claim akin to "Anonymity" or "Neutrality" in social choice. The dissertation must argue that a moral theory that changes its verdict based on the granularity of description is defective. If you can defend that premise, the math becomes the tool that exposes the defect, rather than the end itself.

  **Mathematical Competency Check:**
  Your limit (no measure theory) is acceptable *only if* you strictly adhere to finite sets. If you find yourself needing to discuss continuous distributions (e.g., price as a continuous variable), you will hit a wall. You must define your "outcomes" as discrete buckets (e.g., price ranges) from the start. This is a constraint, but for a Master's dissertation, a rigorous finite model is superior to a sloppy infinite one.

  **Conclusion on Viability:**
  The project is viable for a Master's dissertation provided you resist the urge to "solve" utilitarianism. The goal is to expose a structural vulnerability in the standard formalization. The engineering analogy is your strongest asset for motivation, but your weakest link for rigor; ensure the formal model stands on its own without needing the search-engine example to make sense. If you can derive a determinate result on the stability of weights across partitions, you will have made a genuine contribution to decision theory, regardless of whether it solves the comparability problem.

