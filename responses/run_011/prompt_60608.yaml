prompt: |-
  ok so my friend R and I have been argueing about this for like three hours — dinner, then the walk home, then by text — and neither of us is budging, and I've decided the only way to settle it is to see whether his position can survive being turned into a story.

  Context: R is one of those people who thinks self-knowledge is basically transparent — you find out whether you believe there'll be a third world war by attending to the world rather than by introspecting, so on his picture if you know something you're always in a position to tell that you know it. I keep throwing the anti-luminosity stuff at him: no non-trivial condition is luminous, because knowledge has to be safe/reliable in nearby cases, and safety plus a gradual condition plus a sorites-style series of cases gets you a contradiction. He says that's a philosopher's gotcha, and that actual people in actual situations obviously know when they're cold, or in pain, or about to lose it. I said: fine, then let's build the machine that makes you right.

  Your job. You're an expert on epistemic logic and the philosophy of self-knowledge who also happens to write genuinely good literary fiction. Think carefully about the logic before you put down a single sentence of prose — I want this story to be *correct*, not vibes.

  Here's the setup I want (improve the details however you like, but keep the machinery):

  A cold-storage outfit fits its night pickers with a module that guarantees, contractually, luminosity about one gradual condition — feeling cold, or core-temperature risk, your call. The clause runs roughly: whenever the condition obtains you will know at that moment that it obtains, and the module never reports the condition when the condition fails to obtain. The protagonist signs up because the insurance discount is real and because she has never in her life been surprised by her own body.

  Then the engineers find the module has to ship with a dead zone: a band straddling the threshold where it reports nothing at all. Not a defect — the whole point is that it can't fire in the marginal cases, because a report that could just as easily have been wrong in a barely-different nearby case isn't knowledge, it's a guess that happened to land. So to keep the knowledge clause honest they withhold in exactly the region where the condition is gradually coming on. And when compliance insists the module also satisfy iterated luminosity — when it tells her she's cold, she must know that she knows, and know that she knows that she knows, and so on — each iteration eats another band off the live region, until the only conditions the thing can honestly certify are the trivial ones.

  End it in the dead zone, on a shift, and let the reader feel what it's like to stand inside a band where nothing is certified. Don't explain that to them.

  Constraints:
  - 1800–2500 words.
  - No philosopher characters, no lecture scenes. The logic should come out of the paperwork, the calibration sessions, the argument with the site engineer, the shift reports, the separate audit trail nobody reads.
  - Don't name-drop any real philosophers, books or arguments inside the story.
  - It still has to be a story: somebody wants something, and it costs them.

  Before the story, give me 250–350 words of brainstorming where you work the mechanics out properly: where the first dead zone has to sit relative to the threshold, how much of the range each iteration of KK actually consumes and whether that consumption bottoms out or keeps going, and — this is the bit I care about most — whether a module that reports "you do not currently know" while sitting in the dead zone would itself be honest, or whether it blows up in exactly the same way. That last question is where I suspect R's transparency intuitions might buy him something, so don't hand-wave it.

  After the story, a short note in bullets: which parts of the piece actually cut against R, and which parts quietly concede ground to him. Be honest — if his view survives the story, tell me it survives the story.
