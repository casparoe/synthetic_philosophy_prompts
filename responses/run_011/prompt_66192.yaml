  Maria watched him walk out the door. The tank was half-full, easily enough for the trip. She could have refused directly, but that would start an argument about priorities. This way, he chose to stay home. She opened her document and began to type. The house was finally, blessedly quiet.

  1. **Said and Implicated:** Maria asserts the car requires fuel (true). She implicates she cannot drive (false), generated by the Maxim of Quantity: if she could, she would have said so. She believes the implicature false, so on Grice's own account of lying she has not lied.
  2. **Cancellation:** Appending "but I can drive you" is grammatically sound but pragmatically void. Leo has already left. This is the second failure: the clause is unobjectionable yet useless. It is not a genuine counterexample; the framework can absorb it by distinguishing logical cancellability from pragmatic repair. You are not wrong: it confuses withdrawing a commitment with correcting a belief.
  3. **Feature and Reply:** The work is done by *irreversible hearer action*. Remove the departure, and the case becomes a standard cancellation where the hearer simply stays. A Gricean defender replies that cancellability concerns propositional compatibility at the moment of utterance, not temporal efficacy.

  This is not a real counterexample to Gricean cancellability, but it exposes the temporal fragility of conversational cooperation. You are correct that the second failure confuses withdrawing a commitment with correcting a belief, yet the damage remains done.
