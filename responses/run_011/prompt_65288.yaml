answer: |-
  The ink was still wet on the page when the jackdaw hopped from the perch to the floor of the cage. Elias dipped his quill again, waiting to see if the bird would scream. It did not. It merely tilted its head, the iris a pale ring around a pit of black, and pecked at the straw.

  Elias wrote: *14th October. Subject 4. No vocalization upon entry of keeper. Pecking motion consistent with foraging reflex, though trough is full.*

  He blew on the page to dry the script. Around him, the menagerie hummed with the specific silence of the Cartesian Academy. There were no barks of pain, no whines of longing, only the rhythmic ticking of the clockwork automata placed beside the living cages for comparison. To the left, a mechanical dog wound by a key sat stiffly; to the right, a real spaniel slept, its flank rising and falling. The charter on the wall behind Elias's desk was clear: *No bit of animal behavior counts as evidence of thought unless the animal deploys a sign in a way that nothing in its immediate surroundings prompted.*

  It was a safeguard. If beasts could speak, if they could signify without stimulus, then the soul was not unique to man. If the soul was not unique, the whole architecture of sin and salvation trembled. So the Academy watched. They watched for the spark that wasn't a spark.

  Monsieur Vallier stood over Elias's shoulder, his shadow stretching across the ledger. Vallier was a man of sharp angles, his face worn by the effort of maintaining boundaries.

  "You logged the pecking," Vallier said.

  "It was irregular," Elias replied, not looking up. "The trough was full."

  "Hunger is not only in the stomach. It is in the blood. The spirits may have circulated to the beak, prompting the motion. It is a hydraulic issue, Elias. Not a mental one." Vallier tapped the page with a long fingernail. "Mark it as *Disposition of the Organs*."

  Elias dipped the pen. He wrote *Disposition of the Organs* in the margin. It was the catch-all phrase. If a dog limped, it was nerves. If a horse refused a jump, it was optics. If a bird pecked without hunger, it was pressure in the skull. There was no behavior that could not be reduced to the push and pull of invisible fluids, provided one was willing to push hard enough.

  The jackdaw, Subject 4, hopped onto the small table placed in the center of the cage. On the table lay three objects: a red chip, a blue chip, and a blank slate of wood. These were the testing instruments. The charter demanded signs. So they gave them chips.

  Previously, Subject 4 had learned to place the red chip on the slate to receive a seed. This was not thought; this was conditioning. A lever pulled in a clockwork tower yields a bell; a bird moves a chip yields a seed. Both are mechanisms.

  Today, there were no seeds in Elias's pocket. He stood still, hands clasped behind his back. Vallier watched, arms crossed.

  The jackdaw picked up the blue chip. It held the wood in its beak, shaking it slightly. Then, instead of placing it on the slate, the bird hopped down and placed the blue chip beneath the water dish, where it could not be seen. It returned to the perch and began to preen its wing.

  Elias's hand hovered over the ledger.

  "Reflex," Vallier said immediately. "The shine of the chip caught the light. The eye transmitted the image to the pineal gland, which directed the legs to move toward the shadow of the dish. Coincidence of geometry."

  "But the red chip was shinier," Elias said. "He ignored it."

  "Perhaps the angle of the sun favored the blue. We cannot know the internal currents of the beast. We only know it has no reason. Therefore, this was not reason." Vallier's voice was not cruel; it was tired. He was protecting the world from a chaos he could not afford to believe in. "Log it. *Dispositional response to luminance.*"

  Elias wrote it. The quill scratched against the paper, a sound like tiny teeth. But as he formed the letters, he felt the hollowness of the phrase. *Disposition.* It explained everything because it explained nothing. It was a label placed over a mystery to stop the bleeding.

  Over the next week, the jackdaw repeated the act. Not always with the blue chip. Sometimes it moved the slate itself, pushing it against the bars of the cage when no one was present. Sometimes it arranged the straw in a line perpendicular to the perch. There was no reward. There was no visible threat. There was no mate to impress.

  The Academy grew tense. The Patron was due to inspect the ledger on the morrow. If the ledger showed evidence of unprompted signification, the charter was violated. If the ledger showed only mechanism, the Academy stood.

  Elias sat late into the night. The menagerie was dark, save for the lantern on his desk. The clockwork dog ticked softly. The real spaniel sighed in its sleep.

  He looked at the entries. *Disposition of the Organs. Hydraulic Reaction. Optical Reflex.* The words were stacking up like bricks in a wall, blocking the view of the cage. He realized then that the charter was not a tool for measurement. It was a tool for exclusion. It did not ask, *Is this thought?* It asked, *Can we imagine a machine doing this?*

  And since a machine could be imagined to do anything, given enough gears and springs, the answer was always yes. The criterion was not in the bird. It was in the ink. He was not recording what happened; he was recording what he was permitted to see.

  If he wrote *Thought*, he damned the Academy. If he wrote *Mechanism*, he damned the truth of his own eyes. The ambiguity was not in the bird. The bird simply was. The ambiguity was in the ledger.

  The next morning, the air was cold. Vallier arrived early, brushing frost from his coat. "The Patron arrives within the hour. Ensure the final entry is definitive. We cannot have hesitation in the record."

  Elias nodded. He sat at the desk. The jackdaw was awake. It stood on the table. The chips were there. The slate was there.

  Elias did not reach for the seed pouch. He did not make a sound. He simply opened the ledger to the fresh page. He looked at the bird.

  The jackdaw looked back. It did not caw. It did not hop. It reached out with its beak and took the red chip. It lifted it. For a moment, it held the chip suspended in the air, unrelated to the slate, unrelated to the floor, unrelated to the sun.

  Then, the bird dropped the chip. It fell through the grate in the table floor, lost to the ground below, unrecoverable. The bird had destroyed the sign. It had removed the token from the system of exchange entirely. There was no prompt for this. There was no hydraulic advantage. It was a negation.

  Vallier leaned in, his breath hitching. "It fell. Gravity. clumsiness. The foot slipped."

  "The foot did not slip," Elias said. "It lifted and opened."

  "Then the muscles spasmed. Write it." Vallier's hand rested on the hilt of his sword, not as a threat, but as an anchor. "Write that the muscles spasmed."

  Elias looked at the blank line. The Patron would read this. The Patron would look at the bird, then at the words. The words would tell the Patron what the bird was. If Elias wrote *Spasm*, the bird was a clock. If Elias wrote *Action*, the bird was a soul.

  But the bird was neither. The bird was a thing that dropped a red chip into the dark. The charter demanded he decide if the surroundings prompted it. The surroundings were the cage, the light, the chips. None of those prompted the loss of the chip. Only the bird prompted the loss.

  Yet, to write that was to break the world Vallier lived in. To write the other was to break the world Elias saw.

  He realized the ledger was not a record of the menagerie. It was the menagerie. The bird in the cage was irrelevant; the bird in the book was the one that mattered. He could save the bird by damning the science, or save the science by damning the bird.

  Vallier waited. The clockwork dog ticked. The spaniel slept. The jackdaw hopped to the perch and tucked its head under its wing, indifferent to the judgment pending over its existence.

  Elias dipped the quill. He understood now that the criterion was a circle. He was the one who drew the line. He was the prompt.

  He touched the nib to the paper.

  *Subject 4 removed the red sign from the field of play without external stimulus, reward, or error. The action served no preservation of the organism. I cannot find the spring that wound this.*
