      Make sure the "historical arbitrariness" objection is clearly articulated by Elena. "Marre is just a scar from a war." Marcus needs to answer: "It's the only stable line we have."

      *Refining the Concession:* The prompt asks for *one* of them conceding something specific. I will have Marcus concede on the Seasonal Workers. It shows he accepts the "stakeholder" argument within the border, while Elena concedes the theoretical battle on the Diaspora to save the referendum's viability. Wait, if Elena concedes, does that undermine her stance? Better: Marcus concedes on the Kessel Valley mechanism (allowing a concurrent majority), acknowledging the nested demos problem, while Elena accepts the exclusion of the Diaspora. I'll have Marcus make the tangible concession on the text.

      *Let's check the word count.* Dialogue moves fast. I need to ensure the descriptions and internal monologues (if any) or just dense dialogue fill the space. Pure dialogue is better for this format. I will expand the arguments to ensure depth.

