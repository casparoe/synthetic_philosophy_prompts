          *   Diaspora: 900,000 Talverian citizens elsewhere in federation (poll 70-30 Unionist).
          *   Seasonal Workers: 40,000 (9 months/year, pay tax, no residence).
          *   Kessel Valley: 210,000 people (inside Marre, pro-Union, want separate vote/opt-out).
          *   Current Polling (Marre residents): 52-48 Independence.
          *   Current Polling (Marre + Diaspora): 60-40 Union.
      *   **The Four Disputed Questions:**
          1.  Diaspora vote?
          2.  Seasonal workers vote?
          3.  Kessel Valley veto/opt-out?
          4.  Who decides the rules (legitimacy of the committee)?
      *   **Philosophical Stances:**
          *   *Member A (Affectedness Principle):* All affected should have a say. Must address indeterminacy (where does "affected" stop?) and manipulation (who defines "affected" picks the winner).
          *   *Member B (Bounded-Demos/Constituted Community):* Electorate is the standing political community. Must address historical arbitrariness (borders are just old war results) and consistency (if Marre leaves Talver, why can't Kessel leave Marre?).
      *   **Requirements:**
          *   Two working sessions (needs a break/transition).
          *   No strawmen (strong arguments on both sides).
          *   Test potential compromises (e.g., double-majority).
          *   Ending: One concedes something specific (no trailing off).
          *   Word Count: 1,200–1,800 words.

  2.  **Character Development:**
