answer: |-
  **Session 1**

  **MARCUS:** The draft says "all residents of Marre." It's clean. It's administrable. It matches the census.

  **ELENA:** It matches the census because the census ignores the people you want to exclude. Nine hundred thousand Talverians live outside Marre but were born there, hold property there, or have parents buried there. They are Talverian citizens. The referendum decides the future of Talver. Excluding them is gerrymandering the *demos*.

  **MARCUS:** It's not gerrymandering; it's jurisdiction. The referendum isn't about the future of Talver in the abstract. It's about the constitutional status of the Marre administration. The standing political community is the one whose institutions are being reconstituted. That's the residents.

  **ELENA:** And if that community dissolves the union, the economic shockwaves hit the diaspora hardest. Pension funds, trade tariffs, currency stability. They are affected. The all-affected principle is the only non-arbitrary standard we have.

  **MARCUS:** The all-affected principle is a black hole, Elena. Effects ripple outward indefinitely. If Marre leaves, London markets tremble. Do British citizens get a vote? If independence fails, future generations inherit a fractured state. Do unborn children get a vote? If you open the franchise to "effects," you never close it. You just keep adding voters until the result is dilute enough to suit you. And let's be blunt: the polls show 52–48 for independence among residents. Add the diaspora, who poll 70–30 for the union, and it becomes 60–40 against. You know exactly what "affectedness" is doing here.

  **ELENA:** I know that the "bounded community" you're defending is just the sediment of a war fought 150 years ago. Marre was a kingdom for three centuries. The border you call "administrative" is a ceasefire line. Why does that line have moral privilege? Why is a Talverian in the capital less a stakeholder than a seasonal worker who pays payroll tax in Marre but can't vote?

  **MARCUS:** Because the seasonal worker isn't part of the *political* body. They are economic participants. Voting isn't a receipt for taxes paid; it's a share in the sovereign authority. And regarding the border: yes, it began as a conquest. But law is the stabilization of force over time. If we reopen the moral legitimacy of every border every time we hold a vote, we don't get democracy. We get endless war. We need a *demos* that exists prior to the vote, or the vote creates nothing.

  **ELENA:** But who decides what that pre-existing *demos* is? That's the fourth question on our table, Marcus. Look at us. This committee is drawn from the Talverian parliament. That parliament was elected by a body that excludes the diaspora, excludes the workers, and suppresses the Kessel Valley's desire to stay. We are drawing the rules for a vote that will determine whether we have the authority to draw rules. It's circular.

  **MARCUS:** It's not circular; it's foundational. Someone has to convene the meeting. If we wait for a legitimate committee to define the franchise, we need a legitimate franchise to elect the committee. Nothing ever happens. The Talverian state is the standing order. It has the capacity to enforce the result. That makes it the only viable convener.

  **ELENA:** Viability isn't legitimacy. If we proceed with a franchise that predetermines the outcome by excluding the affected, we aren't settling the question. We're just confirming the annexation.

  **MARCUS:** And if we include everyone "affected," we confirm the dissolution of any bounded state. I'm willing to adjourn. But come back with a stopping point for your principle. Where does the effect end?

  **ELENA:** I'll come back with a way to bound it without resorting to a 150-year-old bayonet charge.

  ***

  **Session 2**

  **ELENA:** I've been thinking about the stopping point. Jurisdiction. Not just residence, but legal subjection. The diaspora are citizens of Talver. They are subject to the federal laws that Marre's exit would void. That's a hard line. It avoids the "unborn children" problem.

  **MARCUS:** It avoids it by including 900,000 people who don't live under the Marre administration. They aren't subject to Marre's local laws. They are subject to the Federation. This is a referendum on Marre's status, not the Federation's dissolution.

  **ELENA:** You can't separate them. But I see your point on indeterminacy. If I can't define "affected" without appearing to rig the poll, the result loses authority. So, I'm willing to concede the diaspora point. Residents of Marre only.

  **MARCUS:** That's a significant concession. The unionists will thank you.

  **ELENA:** I'm not doing it for the unionists. I'm doing it because a vote needs a defined container to be binding. But that container has to be consistent. Which brings us to the Kessel Valley. Two hundred and ten thousand people. They identify with Talver. They say if Marre can leave Talver, they can leave Marre.

  **MARCUS:** And they're wrong.

  **ELENA:** Why? On your "bounded demos" theory, the Marre border is the sacred line. But you just admitted that line is a sediment of war. If self-determination licenses Marre to break the Talverian bond, the Kessel Valley's claim to break the Marrean bond is the exact same claim. If you deny them, you admit this isn't about principle. It's about preserving the map you like.

  **MARCUS:** It's about hierarchy of authority. Marre is a constituent unit of the Federation. Kessel is a district of Marre. If every district could veto the unit's decision, you grant a minority a veto over the majority. That's not self-determination; that's fragmentation.

  **ELENA:** Unless the self-determination is nested. Look, I conceded the diaspora. I accepted your boundary for the main vote. But if the result is 52–48 for independence, and Kessel is 80–20 for union, you are forcing a population into a new state they explicitly reject. That recreates the original sin of the annexation.

  **MARCUS:** So what do you propose? A separate vote that detaches them whatever Marre decides? That creates a hole in the new country before it's born.

  **ELENA:** A concurrent majority. For independence to pass, it needs a majority in Marre overall, *and* a majority in each administrative district. Or, specifically for Kessel, a supermajority threshold. If Marre votes to leave, Kessel gets a second confirmatory vote on whether to join the new state or remain a Talverian exclave.

  **MARCUS:** That effectively gives Kessel a veto.

  **ELENA:** It gives them the same right Marre is claiming against Talver. You say the vote must be the standing political community. But if that community is coercive, it's not political; it's territorial.

  **MARCUS:** (Pauses, rubbing his temples) If we do a concurrent majority, we might never get independence. The unionists will campaign to win one district.

  **ELENA:** Then the independence movement isn't as broad as they claim. Better to know that now than after a civil war.

  **MARCUS:** And the seasonal workers? The forty thousand. You argued earlier they pay payroll tax.

  **ELENA:** They do. Nine months a year. They use the roads, the hospitals. They are subject to Marre's coercive power for most of the year. Under your "legal subjection" argument, they qualify more than the diaspora.

  **MARCUS:** They hold no residence rights. They are transient.

  **ELENA:** They are present. If we exclude them, we are saying taxation without representation is acceptable provided the taxpayer goes home for three months. That undermines the moral clarity we're trying to achieve.

  **MARCUS:** (Sighs) If I accept the residents-only rule for the main vote, and I accept a concurrent majority mechanism for the districts... the franchise is already expanding in complexity. Adding forty thousand volatile voters...

  **ELENA:** It's not volatile. It's consistent. They are stakeholders.

  **MARCUS:** Here is the problem, Elena. If I concede the workers, I validate your "affectedness" logic inside the border, even while we rejected it outside the border. It's inconsistent.

  **ELENA:** It's consistent if the border is the limit of the *polity*, but inside the polity, everyone subject to power counts. The diaspora is outside the polity. The workers are inside it.

  **MARCUS:** (Long silence) The polling on the workers is unknown. They could swing either way.

  **ELENA:** Then let the chips fall.

  **MARCUS:** I can't authorize a franchise that looks like we're hunting for votes. But... the tax argument is difficult to refute without sounding like I'm defending privilege.

  **ELENA:** Then don't defend privilege. Defend the process.

  **MARCUS:** If I concede on the workers, will you drop the demand for a Kessel veto? A concurrent majority paralyzes the constitution. A specific opt-out clause for Kessel, triggered only if Marre votes yes... that I can draft.

  **ELENA:** A guaranteed opt-out?

  **MARCUS:** A referendum in Kessel, held simultaneously. If Marre votes Yes, and Kessel votes No, Kessel remains Talverian. But the main franchise stays residents plus workers. No diaspora.

  **ELENA:** And the committee's legitimacy? The fact that we are Talverian appointees deciding this?

  **MARCUS:** We record the objection. In the preamble. We state that the franchise is a compromise between the all-affected principle and the constituted community, adopted for the sake of feasibility. We acknowledge the flaw.

  **ELENA:** That's not legitimacy. That's a disclaimer.

  **MARCUS:** It's honesty. And honesty is the best foundation we have left. (He picks up his pen) I will draft the clause for the seasonal workers. Those with proof of payroll tax contribution for three consecutive years. That narrows it to the committed stakeholders.

  **ELENA:** Two years.

  **MARCUS:** Three.

  **ELENA:** (Nods slowly) Three. And the Kessel opt-out is binding.

  **MARCUS:** Binding. But no diaspora.

  **ELENA:** Agreed. No diaspora.

  **MARCUS:** Then we have a draft. It won't satisfy the purists on either side.

  **ELENA:** No. But it might stop the shooting.

  **MARCUS:** Let's hope so. I'll type the amendment.

  **ELENA:** I'll call the Kessel representatives. They need to know they're getting a choice, not a fate.

  **MARCUS:** (Typing) "Section 4: Eligible Voters..." You know, 150 years from now, someone will call this border arbitrary too.

  **ELENA:** Probably. But maybe by then, they'll have a better way to count the affected.

  **MARCUS:** Maybe. For now, we count the residents, the workers, and the distinct districts. And we pray the math holds.

  **ELENA:** We pray the principle holds. The math is just the tally.

  **MARCUS:** (Stops typing, looks at her) You conceded the diaspora. That changes the math enough to likely pass the union.

  **ELENA:** I conceded the diaspora to save the vote from being dismissed as a fantasy. If Marre leaves, it has to stand on its own feet, not on the feet of people who left.

  **MARCUS:** And if it stays?

  **ELENA:** Then the union has to prove it's more than a border drawn by a war.

  **MARCUS:** (Resumes typing) Three years tax contribution. Kessel opt-out. Preamble acknowledging the committee's paradox.

  **ELENA:** Send it to the chair.

  **MARCUS:** Done.
