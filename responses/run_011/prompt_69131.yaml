          *   *Resolution:* One concedes a specific point. Maybe Marcus concedes on the workers, or Elena concedes on the diaspora? Or a procedural concession. Let's have Elena concede on the *definition* of affectedness regarding the diaspora to save the process, while Marcus concedes on the Kessel Valley mechanism to save the principle. Actually, the prompt asks for *one* of them conceding something specific. Let's have Marcus concede on the seasonal workers, as that's the strongest "taxation without representation" point for Elena, while holding the line on the diaspora. Or better, Elena concedes on the diaspora (acknowledging the indeterminacy risk) if Marcus accepts a supermajority for Marre residents to account for the stakes.
