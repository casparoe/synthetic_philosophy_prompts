      3.  **Substitution:** If User A abstains, User B buys. Harm is invariant. Attribution logic must detect redundant demand paths and assign zero causal weight to A, as the outcome persists regardless of their input.
      4.  **Overdetermination:** Two users initiate independent chains causing the same harm simultaneously. Neither is strictly necessary. Logic returns 0 for both to avoid double-counting liability, treating the harm as pre-determined.
      5.  **Compensating Transactions:** Users offset harm via good deeds. Implemented as Saga compensating transactions. Requires unique idempotency key per good deed to prevent users from replaying the same donation for infinite absolution.
      6.  **Indeterminate Trigger:** In a batch, we cannot identify which specific purchase tripped the threshold. We distribute blame evenly across the batch window, acknowledging the lack of a principled selector for the marginal unit.

