      **Non-Goals:** Actually reducing global harm, achieving philosophical consistency, handling non-digital purchases, or questioning the premise that harm can be quantified to six decimal places. We prioritize latency over moral nuance.

      **Proposed Architecture**
      We will ingest `PurchaseEvent` and `GlobalHarmEvent` streams into dedicated Kafka topics. The `CausalEngine` service consumes both, maintaining a sliding window of demand versus supply thresholds in Redis. When a harm event occurs (e.g., animal slaughter, carbon threshold breach), the engine backfills fractional blame to users within the temporal window. We utilize a probabilistic graph model to estimate trigger likelihoods. Results are written asynchronously to the `UserProfile` store via gRPC. The service must handle high contention during flash sales where causal density spikes. Latency SLO is 200ms p99. If the `CausalEngine` fails, we default to zero liability to prevent checkout friction.

      **Data Model**
