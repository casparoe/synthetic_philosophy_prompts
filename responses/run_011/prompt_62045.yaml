      **Status:** DRAFT
      **Author:** Backend Engineering, Attribution Team

      **Motivation**
      Product stakeholders require granular accountability for externalities generated during checkout flows. Current last-touch attribution models fail to capture distributed causal responsibility inherent in supply chain events. We need a service to ingest global harm events and backfill liability to individual user IDs based on probabilistic contribution. This enables the "Guilt-as-a-Service" feature mandated for Q3 OKRs. Compliance teams need a scalar value per session to display on checkout confirmation pages, ensuring users understand their precise footprint.

