  **RFC: Causal Attribution Service for Global Harm Quantification**
  **Status:** DRAFT
  **Author:** Backend Engineering, Attribution Team

  **Motivation**
  Product stakeholders require granular accountability for externalities generated during checkout flows. Current last-touch attribution models fail to capture distributed causal responsibility inherent in supply chain events. We need a service to ingest global harm events and backfill liability to individual user IDs based on probabilistic contribution. This enables the "Guilt-as-a-Service" feature mandated for Q3 OKRs. Compliance teams need a scalar value per session to display on checkout confirmation pages, ensuring users understand their precise footprint. Without this, we cannot gamify responsibility or meet ethical SLA requirements.

  **Goals and Non-Goals**
  **Goals:** Emit a normalized `harm_score` per user session. Support compensating transactions for offsetting actions. Ensure idempotency across distributed ledgers.
  **Non-Goals:** Actually reducing global harm, achieving philosophical consistency, handling non-digital purchases, or questioning the premise that harm can be quantified to six decimal places. We prioritize latency over moral nuance.

  **Proposed Architecture**
  We will ingest `PurchaseEvent` and `GlobalHarmEvent` streams into dedicated Kafka topics. The `CausalEngine` service consumes both, maintaining a sliding window of demand versus supply thresholds in Redis. When a harm event occurs (e.g., animal slaughter, carbon threshold breach), the engine backfills fractional blame to users within the temporal window. We utilize a probabilistic graph model to estimate trigger likelihoods. Results are written asynchronously to the `UserProfile` store via gRPC. The service must handle high contention during flash sales where causal density spikes. Latency SLO is 200ms p99. If the `CausalEngine` fails, we default to zero liability to prevent checkout friction. We will use a write-ahead log for harm events to ensure durability even if attribution lags.

  **Data Model**
  `UserHarmRecord`: `user_id` (UUID), `total_harm_units` (Decimal(20,10)), `pending_offset_idempotency_key` (String).
  `HarmEvent`: `event_id`, `threshold_trigger` (Boolean), `causal_vector` (JSON).
  The `total_harm_units` field accumulates fractional liabilities. The `pending_offset_idempotency_key` ensures users cannot replay good deeds. We store raw vectors for auditability, though no audit mechanism is currently planned.

  **Edge Cases**
  1.  **Threshold Batching:** Single purchases rarely trigger supply chain orders individually. We model this as a probability mass function. If purchase volume < batch size, contribution is non-zero but rarely triggers actual harm event. We assign expected value rather than binary state. This avoids threshold discontinuities.
  2.  **Float Precision:** Expected value contributions are often < 1e-9. Standard floats underflow to zero. We must decide if moral zero equals mathematical zero. Storage costs dictate truncation, but theoretical correctness demands epsilon. We may need arbitrary precision libraries.
  3.  **Substitution:** If User A abstains, User B buys. Harm is invariant. Attribution logic must detect redundant demand paths and assign zero causal weight to A, as the outcome persists regardless of their input. We treat this as a no-op in the causal graph.
  4.  **Overdetermination:** Two users initiate independent chains causing the same harm simultaneously. Neither is strictly necessary. Logic returns 0 for both to avoid double-counting liability, treating the harm as pre-determined. This prevents liability inflation during high-traffic events.
  5.  **Compensating Transactions:** Users offset harm via good deeds. Implemented as Saga compensating transactions. Requires unique idempotency key per good deed to prevent users from replaying the same donation for infinite absolution. The key is hashed against the user ID and deed type.
  6.  **Indeterminate Trigger:** In a batch, we cannot identify which specific purchase tripped the threshold. We distribute blame evenly across the batch window, acknowledging the lack of a principled selector for the marginal unit. We randomize assignment if even distribution fails.

  **Rollout Plan**
  Canary deployment to 5% of users in low-risk regions. The critical path depends on resolution of Open Question #1 regarding precision. If scores render as 0.00000, the UI hides the component entirely. If scores render as exact 0, the UI shows "No Impact". Marketing prefers the latter for retention metrics, while Engineering prefers the former for database storage efficiency. We will A/B test the moral weight of zero versus epsilon.

  **Open Questions**
  1.  Do we return `0.0` or `1.4e-12` for sub-threshold events? Engineering prefers 0 for storage costs; Ethics prefers epsilon for theoretical correctness.
  2.  Reviewer Comment: Causal Inference Guild notes: "Counterfactuals are undefined without a stable unit treatment value assumption." Response: "We need a number for the dashboard by Friday."

  **Where the jokes are load-bearing**
  The Edge Cases map directly to the philosophical rabbit hole. **Threshold Batching** is the "one chicken doesn't matter" argument regarding bulk orders. **Float Precision** satirizes the expected value reply (1/10,000th of a chicken) and the absurdity of calculating it. **Substitution** covers the "someone else would have bought it" objection. **Overdetermination** addresses the case where two people would have caused the harm independently, making neither the cause. **Compensating Transactions** mocks the idea of offsetting sins like a database saga, complete with idempotency to prevent double-absolution. **Indeterminate Trigger** reflects the impossibility of identifying which specific purchase crossed the threshold. The **Rollout Plan** hinges on the unresolved debate between nihilism (0) and probabilistic guilt (epsilon). The **Reviewer Comment** highlights how principled objections get steamrolled by the demand for metrics.
