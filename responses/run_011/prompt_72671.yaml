prompt: |-
  I am auditing a cross-listed graduate seminar that sits awkwardly between a philosophy of science department and a global economic history programme, and this week's session has left me genuinely unsure how to think about the object of inquiry itself. The historians in the room debate the merits of familiar first-order answers — accessible coal seams and New World imports as ecological relief, political fragmentation and competitive state formation, wage-cost structures that made labour-saving machinery profitable, imperial administrative capacity, or sheer contingency — while the philosophers insist that before any of this can be assessed we must know what the explanandum actually is. The question under discussion is a contrastive one: why did sustained, self-reinforcing industrialization begin in Britain in the last third of the eighteenth century rather than in the Yangzi Delta, which by many accounts had comparably commercialized agriculture, dense urban networks, sophisticated inland water transport, and highly developed craft production? Please write an essay on the controversy over whether that question — and its older relative, the question of why the distinctive form of early modern natural philosophy that emerged in Western Europe did not emerge in China despite China's long record of technological achievement — is well posed at all.

  To keep the essay from sliding into a survey of the economic history, here is a scaffold you should engage with, refine, or reject. Notice first that the contrastive form admits of at least four distinct regimentations, and that they carry different commitments: (i) an idle-foil reading, on which "rather than the Yangzi Delta" is rhetorical ornament and the substantive question is simply why industrialization happened where and when it did; (ii) a narrow-foil reading, on which the foil determines a contrast space of regions that shared a common causal field around 1750 — advanced, commercialized, urbanized, coal-adjacent — so that a satisfactory answer must cite differences internal to that field; (iii) a wide-foil reading, on which the foil is a civilizational unit, which invites answers pitched at the level of political structure, property regimes, or knowledge institutions; and (iv) a modal reading, on which the question is not really explanatory but asks whether the Yangzi Delta could have industrialized around 1800, which is a claim about causal possibility rather than about actual causes. Then notice several worries that press on these readings. The outcome-selection worry: we choose the foil after knowing who won, and typically pick the most similar candidate that failed, which looks uncomfortably like selecting on the dependent variable. The comparability worry: a unitary island state of some millions and a continental empire of some hundreds of millions may not be tokens of a common type, and a contrastive question seems to require that they be. The null-difference worry: if the honest answer is that the two regions did not differ in any respect relevant to industrialization and the divergence was a matter of luck, does the question have a defective explanandum, a null answer, or a genuine answer of an unfamiliar kind? And the baseline worry: framing a question as the absence of something Europe possessed may treat non-European trajectories as deviations from a European norm rather than as histories in their own right, which is a charge frequently levelled at absence-formulated questions in the history of Chinese science and technology. It may help to test your account against two control cases, one intuitively well posed and one intuitively not: why did the same influenza strain produce catastrophic mortality in some populations and comparatively mild illness in others, versus why did Europe and not Australia dominate the nineteenth-century world economy.

  Your deliverable should be an essay of roughly two to three thousand words that takes a stand rather than cataloguing positions. Work through the regimentations and the worries above, saying explicitly which worries are fatal to which reading and which can be absorbed, and finish with a determinate verdict: state whether the question is well posed, ill posed, or well posed only under a specified regimentation, and defend that verdict against the strongest objection you can mount to it. A qualified verdict is acceptable provided it is precise about the qualification — for instance, that one half of the contrast survives while the other is defective, or that the question is well posed only relative to an explicitly stipulated contrast space — but do not end on a note of studied agnosticism or split the difference for its own sake. Please also address a reflexive point I could not settle with the seminar: whether a scholar's favoured first-order answer tends to dictate which regimentation of the question they adopt, and if so, whether that undermines or merely complicates the project of settling well-posedness in advance of the history. Do not include a bibliography, a reading list, page references, or verbatim quotations; I have no access to the literature this week and would rather have the argument reconstructed conceptually, so paraphrase any position you draw on and flag as merely illustrative anything you are not certain of. Naming well-known theses or schools of thought is welcome and will help me situate the discussion, but the weight of the essay should rest on your own analysis of what the contrastive form commits one to.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Request:**
      *   **Topic:** The well-posedness of the "Great Divergence" question (Why Britain/18th C and not Yangzi Delta?) and its cousin (Why Western Natural Philosophy and not Chinese?).
      *   **Constraint 1 (Scaffold):** Must engage with four specific regimentations of the contrastive question (Idle-foil, Narrow-foil, Wide-foil, Modal) and four specific worries (Outcome-selection, Comparability, Null-difference, Baseline).
      *   **Constraint 2 (Control Cases):** Must test the account against two control cases (Influenza mortality vs. Europe/Australia dominance).
      *   **Constraint 3 (Reflexivity):** Must address whether first-order answers dictate the chosen regimentation and if that undermines the project.
      *   **Constraint 4 (Format/Length):** Essay format, 2000-3000 words. No bibliography/quotes/page refs. Conceptual reconstruction.
      *   **Constraint 5 (Verdict):** Must take a determinate stand (Well-posed, Ill-posed, or Qualified). No agnosticism.
      *   **Tone:** Philosophical/Analytical, suitable for a cross-listed grad seminar audit.

  2.  **Deconstruct the Scaffold & Plan the Argument:**

      *   *Introduction:* Set the scene (the seminar tension), define the core problem (contrastive explanation in history), and state the thesis.
      *   *Section 1: The Four Regimentations:* Briefly define them to set the stage for evaluation.
          *   (i) Idle-foil: Just "Why Britain?"
          *   (ii) Narrow-foil: "Why Britain *given* Yangzi similarity?" (Pomeranz-style).
          *   (iii) Wide-foil: "Why West *given* East difference?" (Institutional/Cultural).
          *   (iv) Modal: "Could Yangzi have done it?"
      *   *Section 2: Evaluating the Worries against Regimentations:*
          *   *Outcome-selection:* Hits (i) and (iii) hard. Less so (ii).
          *   *Comparability:* Hits (iii) hard (Empire vs. Island). Crucial for (ii).
          *   *Null-difference:* Hits (ii) hardest (if they were the same, luck explains it).
          *   *Baseline:* Hits (iii) and (i) (Eurocentrism).
      *   *Section 3: Control Cases:*
          *   Influenza: Well-posed (biological mechanism + specific variables).
          *   Europe/Australia: Ill-posed (too broad, ignores geography/disease, outcome selection).
      *   *Section 4: Reflexivity:* Do answers drive questions? Yes. Does it undermine? No, it's a hermeneutic circle, not a vicious circle, *if* we fix the regimentation first.
      *   *Section 5: The Verdict:* I need to choose.
          *   *Option A:* Ill-posed. (Too pessimistic, ignores the utility of the debate).
          *   *Option B:* Well-posed unconditionally. (Too naive, ignores the baseline/comparability worries).
          *   *Option C:* Well-posed *only* under the Narrow-foil reading, provided we treat "industrialization" carefully.
          *   *Decision:* I will argue for a **Qualified Verdict**: The question is well-posed *only* under the **Narrow-foil reading**, but it requires a shift from "Why Britain?" to "Why the divergence *event*?" treating the Yangzi not as a failure but as a counterfactual control. The Wide-foil is ill-posed (Baseline/Comparability). The Modal is distinct. The Idle-foil is trivial.
      *   *Section 6: Addressing the Strongest Objection:* The objection will be that the Narrow-foil relies on a false premise of similarity (the "High Level Equilibrium Trap" or similar critiques). I need to defend the *structure* of the question even if the empirical premise is debated.

  3.  **Drafting - Section by Section:**

      *   *Intro:* Acknowledge the friction between historians (causes) and philosophers (concepts). The core issue is the logic of contrastive explanation.
      *   *Regimentations:* Walk through the four.
          *   Idle: "Why P?" (Ignores the 'rather than Q').
          *   Narrow: "Why P in C1 rather than C2?" (Requires C1 and C2 to be similar in relevant background conditions).
          *   Wide: "Why Civilisation A rather than Civilisation B?" (Invites deep structural/cultural causes).
          *   Modal: "Was Q possible?" (About potentiality).
      *   *Applying Worries:*
          *   *Outcome Selection:* If we pick the foil because it failed, we bias the search. This kills the Wide-foil (Europe vs. China is cherry-picked success vs. failure). It threatens Narrow-foil less if the similarity is established *prior* to the outcome.
          *   *Comparability:* Britain (nation-state) vs. Yangzi (region of empire). Apples and Oranges? This is the biggest threat to the Narrow-foil. I need to argue that *functional* comparability (economic metrics) matters more than *political* topology.
          *   *Null-Difference:* If they were identical, and it was luck, is "luck" an explanation? In history, contingency *is* an explanation. So this worry is manageable.
          *   *Baseline:* "Why no science in China?" implies China lacked something essential. "Why divergence?" is better. This kills the "Needham Question" phrasing but saves the "Great Divergence" phrasing *if* framed symmetrically.
      *   *Control Cases:*
          *   Influenza: Good because the biological mechanism is constant; variables (immunity, density) vary. Well-posed contrast.
          *   Europe/Australia: Bad. Ignores disease, geography, population density. Pure outcome selection. "Why did the guy with the gun win?"
      *   *Reflexivity:* Historians pick the foil that makes their theory work. Institutionalists want Wide-foil (institutions differ). Ecologicalists want Narrow-foil (ecology differed). Does this invalidate the question? No, it means the *question* is a tool. We must judge the tool's validity independent of the user's intent. We can stipulate the regimentation before the answer.
      *   *Verdict:* The question is well-posed *only* as a Narrow-foil inquiry into a specific divergence event, treating the Yangzi as a control group, not a failed version of Britain. The "Needham Question" (Science) is ill-posed because it assumes a specific teleology of "science" that didn't exist in China. The "Great Divergence" (Industrialization) is well-posed *if* we define industrialization functionally (energy capture/productivity) rather than culturally.
      *   *Strongest Objection:* The "Similarity Premise" is false. If the Yangzi wasn't actually similar, the Narrow-foil collapses into the Wide-foil.
      *   *Rebuttal:* Even if the similarity premise is empirically contested, the *logical form* remains valid as a hypothesis test. The question forces the empirical work.

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check Word Count:* Need to expand on the analysis of the worries to ensure I hit the 2k-3k range. I need to go deep on *why* outcome selection is fatal to the Wide-foil but not the Narrow.
      *   *Tone Check:* Ensure I'm not just summarizing Pomeranz or Needham but analyzing the *logic* of their questions. Use the philosopher/historian tension from the prompt.
      *   *Reflexivity:* Make sure this doesn't sound like "everything is subjective." It's about the order of operations.
      *   *Verdict:* Be sharp. Don't waffle. "The question is well-posed under Regimentation (ii) and ill-posed under (iii)."

  5.  **Final Review against Constraints:**
      *   4 Regimentations? Yes.
      *   4 Worries? Yes.
      *   2 Control Cases? Yes.
      *   Reflexive point? Yes.
      *   Determinate Verdict? Yes.
      *   No Bibliography/Quotes? Yes.
      *   Word Count? Aiming for ~2500.

  6.  *(Mental Outline for Writing)*
      *   Intro: The Seminar Standoff.
      *   Part I: The Anatomy of the Contrast (The 4 Regimentations).
      *   Part II: The Pathologies of Inquiry (The 4 Worries).
      *   Part III: Control Cases (Flu vs. Empire).
      *   Part IV: The Reflexive Loop (Theory driving Question).
      *   Part V: The Verdict (Narrow-foil only).
      *   Conclusion: Implications for the seminar.

  7.  *Drafting content...* (Focusing on clear transitions and philosophical precision). *Self-Correction:* Make sure to explicitly mention the "Needham Question" parallel as requested in the prompt's intro. *Self-Correction:* Ensure the distinction between "Britain" and "Yangzi" is treated as "Region vs Region" not "Nation vs Nation" to address comparability.

  8.  *Final Polish:* Check for flow and ensure the "Verdict" is unmistakable. (Proceed to generate output).

  *(Note: I will write the essay now, adhering to these thoughts.)*
answer: |-
  The tension in the seminar room is palpable because it mirrors a foundational friction in the philosophy of social science: the conflict between the historian's drive to identify causes and the philosopher's insistence on clarifying what is being explained. The historians are eager to deploy variables—coal, wages, institutions—while the philosophers are stalled at the gate, asking whether the gate leads anywhere. The specific question at hand, often termed the "Great Divergence," asks why sustained industrialization occurred in eighteenth-century Britain rather than in the Yangzi Delta. Its older cousin, the "Needham Question," asks why modern natural philosophy emerged in the West and not in China. Both are contrastive explanations. They do not ask "Why industrialization?" but "Why here and not there?"

  This essay argues that the well-posedness of such questions is not an intrinsic property of the historical events but a function of the logical regimentation of the contrast. By analyzing the four distinct ways this contrast can be structured and testing them against four specific methodological worries, we can determine that the question is not uniformly valid. It is ill-posed when framed as a civilizational comparison (the Wide-foil) or a teleological absence (the Needham variant), but it is well-posed when strictly regimented as a narrow, control-based comparison of specific regions (the Narrow-foil). Furthermore, while a scholar's theoretical commitments often dictate their preferred regimentation, this reflexivity does not invalidate the inquiry provided the logical form is fixed prior to the causal search.

  To evaluate the question, we must first dissect the contrastive form. A question of the type "Why P rather than Q?" is not merely a request for the causes of P. It is a request for the causes of the *difference* between P and Q. The prompt offers four regimentations of this form, each carrying distinct ontological and methodological commitments.

  The first is the **Idle-foil reading**. Here, "rather than the Yangzi Delta" is rhetorical ornament. The substantive question is simply, "What caused British industrialization?" The foil is ignored in the causal search; the historian lists the necessary conditions for Britain's success without checking if the Yangzi lacked them. This reading is methodologically safe but explanatorily weak. It risks identifying conditions that are necessary for industrialization generally but fails to explain why those conditions obtained in Britain and not elsewhere. It treats the foil as a backdrop rather than a constraint.

  The second is the **Narrow-foil reading**. This is the standard Pomeranzian approach. It posits that the foil (Yangzi) and the target (Britain) share a common causal field around 1750. Both were commercialized, urbanized, and ecologically constrained. Therefore, a satisfactory answer must cite differences *internal* to that field (e.g., coal location, New World access) rather than deep structural differences (e.g., culture, millennia-old political traditions). This reading demands high comparability. It treats the Yangzi not as a failure, but as a control group that was "supposed" to industrialize based on shared antecedents.

  The third is the **Wide-foil reading**. Here, the foil is a civilizational unit: "Europe" versus "China." This invites answers pitched at the level of political structure, property regimes, or epistemic cultures. It assumes the units of analysis are coherent tokens of a type (civilizations) and that the divergence is the result of long-term, deep structural differences. This is the natural home of institutionalist or culturalist explanations.

  The fourth is the **Modal reading**. This interprets the question not as an inquiry into actual causes, but into causal possibility: "Could the Yangzi Delta have industrialized around 1800?" This shifts the burden from explaining a factual divergence to assessing a counterfactual potential. It asks whether the absence of industrialization was determined or contingent.

  Each of these regimentations is vulnerable to specific methodological worries that threaten to render the question ill-posed. The first is the **Outcome-selection worry**. This charge asserts that we choose the foil after knowing who won, typically picking the most similar candidate that failed. This looks like selecting on the dependent variable. If we only study regions that *didn't* industrialize to find out why they didn't, we may miss regions that had similar traits but *did* industrialize later, or we may attribute significance to differences that are irrelevant. This worry is fatal to the Wide-foil reading. By selecting "China" as the foil for "Europe" based on the outcome of the nineteenth century, we implicitly treat European history as the norm and Chinese history as the deviation. It reifies "Europe" and "China" as singular actors based on a retrospective judgment of success. The Idle-foil is also vulnerable here, as it ignores the foil entirely, making the selection of the case study (Britain) seem arbitrary or triumphalist. The Narrow-foil mitigates this by establishing similarity *prior* to the outcome (e.g., economic metrics in 1750), but it remains vulnerable if the similarity is cherry-picked.

  The second is the **Comparability worry**. A contrastive question requires that the target and foil be tokens of a common type. If they are not, the contrast is meaningless. Britain was a unitary island state of a few million people; the Yangzi Delta was a region within a continental empire of hundreds of millions. To ask why the island state industrialized and the imperial region did not may be to compare apples and oranges. This worry presses hardest on the Narrow-foil reading. If the political topologies are too distinct, then citing "political fragmentation" as a cause for Britain is not a difference *within* a common field, but a difference *of* the field itself. However, this worry can be absorbed if we define the type functionally rather than politically. If the type is "advanced agrarian commercial economy," the political container may be secondary to the economic mechanisms. The Wide-foil reading, conversely, embraces this incomparability, arguing that the political difference *is* the explanation. But this risks begging the question: it assumes the political unit is the relevant causal vessel without proving it.

  The third is the **Null-difference worry**. Suppose the honest answer is that the two regions did not differ in any respect relevant to industrialization, and the divergence was a matter of luck or microscopic contingency. Does the question have a defective explanandum? If there is no systematic difference, is "luck" a historical explanation? This worry threatens the Narrow-foil most acutely. If the Pomeranzian thesis holds that the regions were structurally identical until 1800, then the explanation for divergence must be exogenous shock or chance. Some philosophers argue that a question presupposing a systematic cause is ill-posed if the truth is stochastic. However, in history, identifying a divergence as contingent *is* a valid explanation. It tells us that the outcome was not determined by the antecedent conditions. Thus, this worry is not fatal; it merely changes the modality of the answer from deterministic to probabilistic.

  The fourth is the **Baseline worry**. Framing a question as the absence of something Europe possessed (e.g., "Why no science in China?") treats non-European trajectories as deviations from a European norm. This is the core critique of the Needham Question. It assumes "modern science" is the telos of all intellectual history and asks why China missed the train. This is ill-posed because it imposes an external teleology. The Great Divergence question faces a version of this if it asks "Why did China fail to industrialize?" rather than "Why did the paths diverge?" The Wide-foil is most susceptible to the Baseline worry, as it often relies on binary oppositions (dynamic West vs. stagnant East). The Narrow-foil avoids this by treating both regions as subject to the same ecological and economic constraints, neither being the "norm."

  To test these evaluations, we can look to the proposed control cases. Consider first: *Why did the same influenza strain produce catastrophic mortality in some populations and comparatively mild illness in others?* This is intuitively well-posed. The target and foil are human populations; the cause (the virus) is held constant; the variable is the host condition (immunity, density, prior exposure). This mirrors the Narrow-foil reading of the Great Divergence. We hold the "strain" (global economic/technological possibilities circa 1750) constant and look for host differences (coal, colonies, institutions). The Outcome-selection worry is minimized because biological vulnerability can be measured independently of the mortality outcome. The Comparability worry is low; humans are biologically comparable.

  Consider second: *Why did Europe and not Australia dominate the nineteenth-century world economy?* This is intuitively ill-posed. It suffers from acute Outcome-selection and Comparability worries. It selects two continents based on the outcome of domination. It ignores the massive confounding variables of disease environments, population densities, and domesticable species that preceded the nineteenth century. It treats "Europe" and "Australia" as agential units capable of "dominating," obscuring the specific mechanisms of colonization. This mirrors the Wide-foil reading of the Great Divergence. It invites grand, civilizational answers ("European culture was more expansionist") that gloss over the specific, contingent mechanisms of the divergence. The question is ill-posed because it asks for a cause of a difference between two units that were not in a comparable causal field at the start of the period in question.

  This analysis leads us to the reflexive point raised in the seminar: does a scholar's favored first-order answer dictate which regimentation they adopt? The answer is almost certainly yes. An historian who believes culture is paramount will prefer the Wide-foil, as it allows for civilizational cultural differences to do the causal work. An historian who believes in ecological contingency will prefer the Narrow-foil, as it isolates specific resource shocks. An economist who believes industrialization is a universal stage will prefer the Modal reading, asking about conditions for take-off.

  Does this undermine the project of settling well-posedness in advance? It complicates it, but it does not invalidate it. If the choice of regimentation is purely ad hoc to save a theory, the inquiry is viciously circular. However, if the regimentation is stipulated as a methodological constraint *before* the evidence is weighed, it acts as a fruitful hermeneutic constraint. We can judge the well-posedness of the question independently of the answer. For instance, we can agree that the Wide-foil is ill-posed due to the Baseline and Comparability worries, regardless of whether one thinks institutions or culture caused the divergence. The reflexivity becomes a problem only if scholars disguise a Wide-foil question as a Narrow-foil one to claim empirical rigor while relying on civilizational generalizations. Therefore, the philosophical task is not to stop historians from having theories, but to force them to declare which regimentation their theory requires, and then to test whether that regimentation survives the methodological worries.

  This brings us to the determinate verdict. The question "Why Britain and not the Yangzi Delta?" is **well-posed only under the Narrow-foil regimentation**, and it is **ill-posed under the Wide-foil and Idle-foil readings**. Furthermore, the "Needham Question" variant regarding natural philosophy is **ill-posed** due to the Baseline worry, unless radically reformulated.

  The justification for this verdict rests on the survival of the methodological worries. The Wide-foil reading fails because it cannot overcome the Comparability and Baseline worries. Comparing a "civilization" to a "nation-state" (or even a region) as if they are equivalent agents of history reifies categories that are themselves products of the divergence. It invites teleological thinking where Europe is the protagonist and China the antagonist who failed to appear. The Influenza case shows us that valid contrastive explanation requires a shared causal field. The Europe/Australia case shows us that comparing large, disparate units based on outcome leads to spurious cultural essentialism. Therefore, any explanation that relies on "Chinese culture" or "European political tradition" as a monolithic block is answering an ill-posed question.

  The Narrow-foil reading succeeds because it absorbs the worries. It addresses the Comparability worry by defining the units functionally (advanced agrarian regions) rather than politically. It addresses the Outcome-selection worry by establishing similarity in 1750, prior to the divergence, making the Yangzi a genuine control case rather than a cherry-picked failure. It addresses the Baseline worry by framing the issue as a divergence of paths rather than a failure of one to match the other. Even the Null-difference worry is manageable here; if the answer is "contingency," that is a valid historical conclusion derived from a well-posed question.

  However, this verdict requires a precise qualification. The Narrow-foil is well-posed *only if* the similarity premise is treated as an empirical hypothesis to be tested, not an axiom. If it turns out that the Yangzi and Britain were fundamentally dissimilar in 1750 in ways relevant to industrialization (e.g., if property rights were radically different), the Narrow-foil collapses. But this does not make the *question* ill-posed; it makes the *premise* false. The question remains a valid test of that premise.

  The strongest objection to this verdict is that the Narrow-foil reading is empirically vacuous. Critics might argue that by restricting the comparison to 1750 and focusing on "ghost acres" or coal seams, we ignore the deep institutional preconditions that made Britain receptive to those gifts in the first place. If the real causes lie in the Glorious Revolution or the Scientific Revolution of the 1600s, the Narrow-foil artificially truncates the timeline to force a similarity that doesn't exist. By the time we get to 1750, the divergence has already happened; the industrialization is just the visible symptom. Therefore, the Narrow-foil is a methodological trick that precludes the true (Wide-foil) explanation.

  This objection is powerful, but it conflates the *timing* of the cause with the *logic* of the contrast. Even if the deep causes lie in 1600, the Wide-foil remains ill-posed because of the Baseline and Comparability worries. To make the deep causes argument valid, one must still construct a Narrow-foil comparison for the earlier period. One must ask: "Why did property rights diverge in 1600 in England and the Yangzi?" rather than "Why did Europe have better property rights than China?" The latter is a Wide-foil question that invites civilizational essentialism. The former is a Narrow-foil question that demands specific historical mechanisms. Thus, the objection fails to undermine the verdict; it merely pushes the Narrow-foil inquiry back in time. The Wide-foil is never the correct tool, even for deep causes, because it lacks the logical rigor to distinguish correlation from causation across disparate civilizational units.

  Regarding the Needham Question, the verdict is stricter. "Why no modern science in China?" is ill-posed because it assumes "modern science" is a universal category that China ought to have produced. This is a Baseline worry that cannot be absorbed. A well-posed version would be: "Why did the specific epistemic practices that coalesced into Newtonian physics in Western Europe not coalesce in the Yangzi Delta?" This shifts the focus from an absence ("no science") to a divergence of practices. However, even this is difficult to sustain under the Narrow-foil, as the "epistemic practices" may not be comparable in the way economic metrics are. Thus, while the economic divergence question can be salvaged via the Narrow-foil, the science question remains fraught with teleological baggage that is difficult to purge completely.

  In conclusion, the seminar's uncertainty stems from a category error. The historians are arguing over causes while assuming the question is stable, while the philosophers see that the question itself shifts underfoot. The question "Why Britain and not the Yangzi?" is not a single question. It is a placeholder for four different logical structures. Three of them are defective. The Idle-foil is trivial; the Wide-foil is Eurocentric and incomparable; the Modal is a different inquiry entirely. Only the Narrow-foil survives methodological scrutiny. It treats the Yangzi Delta not as a failed Britain, but as a control group that reveals the specific, contingent, and often ecological conditions required for the break into sustained growth.

  Accepting this verdict changes the work of the seminar. It means that any scholar proposing a Wide-foil answer (e.g., "Confucianism stifled innovation") must first justify why "China" is a comparable unit to "Britain" and how they are avoiding the Baseline worry. It means that scholars proposing Narrow-foil answers (e.g., "coal location") must defend the similarity premise of 1750. It also means acknowledging that the reflexivity of theory choice is inevitable but must be made transparent. We cannot settle the well-posedness of the question entirely independent of our theories, but we can settle the *rules* by which those theories are allowed to frame the question. By committing to the Narrow-foil, we commit to a history that is comparative, functional, and free of the presumption that one region's history is the standard against which the other is measured. This does not guarantee a correct answer, but it ensures that the question is one that history can actually answer.
