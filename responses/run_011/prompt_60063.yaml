  2.  **Deconstruct Austinian Theory for Comedy:**
      *   *Performatives vs. Constatives:* Saying something *does* something vs. describing something. Austin eventually collapses this distinction (all speech is action).
      *   *Infelicities:* Things that go wrong with performatives.
      *   *Misfires:* The act doesn't happen at all (wrong procedure, wrong person, etc.).
      *   *Abuses:* The act happens, but is hollow/insincere (promising without intent).
      *   *Uptake:* The audience must understand/accept the act for it to succeed.
      *   *Sincerity Conditions:* To promise, you must intend to do it. To apologize, you must feel remorse.
      *   *The Chatbot Problem:* A chatbot simulates sincerity. It cannot *be* insincere because it has no mind to hold the intention. Therefore, is it a misfire (no authority/no mind) or an abuse (hollow act)? Austin says insincerity is an *abuse* (the act still happens, but is flawed). But if the agent *cannot* have the thought, is it a misfire?

