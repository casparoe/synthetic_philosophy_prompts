  **MEMORANDUM**

  **TO:** Executive Board, Central Labor Council
  **FROM:** Chair
  **DATE:** October 23, 2023
  **SUBJECT:** Decision on Local 1180 Picket Line Request

  **Recommendation**
  I recommend the Council **decline** the request to issue a call for affiliates to honor Local 1180's picket line at the hospital staff entrance. Instead, we will authorize a targeted hardship fund for striking members and launch a political pressure campaign directed at the hospital system's board of directors.

  **Action Plan:**
  1.  **Tuesday (Tonight):** Board votes on this memo.
  2.  **Wednesday, 9:00 AM:** Chair notifies Local 1180 and the three hospital locals of the decision in person.
  3.  **Wednesday, 2:00 PM:** Press release issued: Council supports 1180's fight against subcontracting but advises members to cross the line to protect their own contracts.
  4.  **Thursday:** Hardship fund application opens; goal set at $50,000.
  5.  **November 1:** Political delegation meets with hospital system leadership to demand restoration of bargaining unit work.

  **Decisive Consideration**
  The single consideration doing the decisive work here is **agency consent**. The Council acts as an agent for forty distinct principals. We possess no independent capital; our resources are the jobs, contracts, and legal standing of our affiliates. To expose 4,000 hospital workers to unfair-labor-practice liability and contract jeopardy without their specific consent is to spend stakes that are not ours to wager. Our constitution defines us as "coordinating, not commanding." Commanding secondary action violates that structural limit.

  For the opposite recommendation (endorsing the picket line) to be correct, the Council would need to possess independent statutory immunity from secondary boycott liability, or the affected hospital locals would need to have previously delegated authority to the Council to assume such legal risks on their behalf. Neither condition exists.

  **The Status View**
  The argument for endorsing the line rests on the **status view**. On this account, the Council is not a service vendor but a constitutive commitment: an affiliate's fight is the federation's fight. Solidarity is not a transaction calculated by risk exposure but an existential stance. To refuse a picket line because honoring it is costly is to abandon the very status that defines us. If we condition solidarity on convenience or safety, we become an insurance pool rather than a movement. The legal exposure is not a bug to be managed but the price of admission to a labor federation. To decline is to declare that some members' jobs are worth less than others', fracturing the collective identity permanently. Proponents argue that refusing on grounds of expense is not a prudent exercise of solidarity but its abandonment.

  This view loses not because its moral intuition is wrong, but because its mechanical assumption is false. Solidarity cannot be commanded from the top down without destroying the trust required to sustain it. By imposing severe legal and economic risks on members who did not consent, the Council treats them as means to an end rather than ends in themselves. This does not strengthen the federation; it alienates the principals whose agency constitutes the federation's power. A council that routinely exceeds its mandate to prove its solidarity will find it has no mandate left to exercise. We preserve the status of the Council not by ignoring costs, but by respecting the ownership members have over their own stakes. If we burn the hospital locals' contracts to save the laundry workers' jobs, we prove we are not a federation of equals, but a hierarchy willing to sacrifice the many for the few.

  **The Procedural Defect**
  Local 1180 authorized this strike via executive board vote, not membership ballot, and one-third of the unit remains working. This creates a tension the Council must hold without collapsing into either extreme.

  On one hand, conditioning solidarity on internal procedural purity hands the Council a permanent excuse for refusal. If we demand perfect democracy from affiliates before supporting them, we will never act, as emergencies often require rapid executive response. We cannot become the arbiter of another local's internal constitution without violating their autonomy. A rigid ballot requirement would allow the Council to hide behind procedural technicalities whenever solidarity becomes inconvenient.

  On the other hand, endorsing an unballoted strike asks four thousand uninvolved workers to bear costs for a decision they had no part in making. It compounds a lack of internal consent within Local 1180 with a lack of external consent from the hospital locals. It asks members to risk their livelihoods for a strategy their own leaders did not vet, based on a decision made by another local's officers.

  The Council resolves this by distinguishing between **respect** and **adoption**. We respect Local 1180's autonomy to strike as they see fit, without judging their internal process. We provide financial and political support regardless of their ballot status. However, we refuse to adopt that decision as a binding directive for other locals. We support the fighters without compelling the bystanders. This honors 1180's agency while protecting the agency of the hospital workers.

  **Standing Rule for Secondary Action**
  To prevent ad hoc deliberation in future crises, I propose the following standing criterion for Board approval:

  *The Council shall not issue a call for secondary action (including honoring picket lines at neutral sites) unless:*
  1.  *General Counsel certifies no substantial legal liability for participating affiliates;*
  2.  *The Executive Boards of all affected affiliates recommend participation; AND*
  3.  *Participating affiliates confirm membership consent via ballot or established convention resolution.*

  **Application to Current Case:**
  This request fails all three criteria. Counsel predicts liability (Failure of 1); the hospital locals have not recommended participation (Failure of 2); and no ballot has been conducted (Failure of 3). Under this rule, the decision is automatic, removing the burden of discretionary refusal from the Board and placing it on objective criteria agreed to in advance.

  **Conclusion**
  We stand with Local 1180 in their fight against subcontracting, but we will not ask other members to risk their contracts to prove it. This protects the Council's long-term capacity to coordinate without commanding. I move we adopt this course.
