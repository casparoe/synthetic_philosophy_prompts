answer: |-
  ## The Phantom Electorate Protocol

  ### I. Structural Argument: Common vs. Independent Draw

  Your instinct is correct: **You must use a Common Draw.**

  In a real election, the "state of the world" (the aggregate behavior of the other voters) is a single fact. Either the margin is 10 votes, or it is 100,000. My ballot is decisive or futile relative to *that* fact, which is shared by all voters. An **Independent Draw** (where each ballot is assigned a random weight or probability of counting) privatizes pivotality. It turns the election into a lottery of *influence* rather than a lottery of *outcome*. It suggests that even if the margin is 100,000, I might still "win" because my private die roll came up lucky. This destroys the public-good structure of the election and validates the very instrumentalism you are trying to problematize.

  **The Objection (Luck vs. Judgment):** Critics will argue a Common Draw makes the outcome feel like "luck" rather than "causal contribution."
  **The Rebuttal:** This is not a bug; it is the feature. The Downsian paradox rests on the observation that in a mass electorate, the causal contribution of a single vote *is* structurally indistinguishable from luck. By making the "rest of the electorate" a single sealed number, you force students to confront the fact that their agency is bounded by a reality they do not control. The "luck" they feel is the actual phenomenological texture of voting in a democracy of 200,000+ people.

  ---

  ### II. Runnable Design

  **Topic:** The Instrumental Rationality of Voting
  **Participants:** 22 Students
  **Duration:** 75 Minutes
  **Stakes:** **The Format of the Final Assessment.**
  *   **Option A:** A 3,000-word take-home essay (Due end of exam period).
  *   **Option B:** A 4,000-word essay **plus** a 10-minute oral defense (Scheduled during finals week).
  *   *Note:* Pilot this with a few students beforehand to ensure Option B is genuinely resented. If not, swap to "Class Time Allocation" (e.g., Option A: Last two sessions are review; Option B: Last two sessions are new lecture content required for the exam).

  **The Cost:** **Opportunity Cost of Leisure.**
  *   To cast a vote, a student must complete a "Ballot & Rationale" slip (approx. 5-7 minutes of focused writing).
  *   This activity occurs during a designated "Voting Window" in class.
  *   **Abstention:** Students who choose not to vote are explicitly permitted to pack up, check phones, or leave the room during the Voting Window.
  *   **Recording:** The instructor counts the slips submitted. Abstention is recorded as a zero on the tally sheet.

  **The Amplification Device (The Phantom Draw):**
  *   **Real Electorate:** The 22 students present.
  *   **Phantom Electorate:** A sealed envelope containing a number $P$ (Phantom Margin).
  *   **Generation:** Before class, generate $P$ using a Normal Distribution $N(0, 50,000^2)$. Round to the nearest integer.
      *   *Safeguard:* If $|P| < 100$, redraw. (You must ensure the real votes cannot mathematically overcome the phantom margin, or the lesson fails).
      *   *Sealing:* Place the number in an opaque envelope.
  *   **Mechanism:**
      *   Vote A = +1
      *   Vote B = -1
      *   Real Total ($R$) = Sum of student votes.
      *   Phantom Total ($P$) = Number in envelope.
      *   **Outcome:** If $R + P > 0$, Option A wins. If $R + P < 0$, Option B wins.
  *   **Disclosure:** At the start of the Voting Window, announce: *"The Phantom Margin $P$ is drawn from a distribution with a standard deviation of 50,000. Your collective group size is 22. The probability that your collective real votes $R$ will exceed the absolute value of $P$ is less than 0.1%."*

  #### Minute-by-Minute Timeline

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Instructor states the stakes (Option A vs. B). Distributes Ballot Slips. Explains the Cost: "You have 10 minutes to vote. If you vote, you must write a 3-sentence justification. If you do not vote, you are free to leave or relax." |
  | **10-15** | **The Odds** | Instructor reveals the Phantom Protocol. Reads the distribution parameters ($N(0, 50,000)$). Emphasizes: "The envelope is sealed. The number is already inside. Your votes will be added to it. Mathematically, your votes cannot change the outcome." **Do not elaborate.** |
  | **15-25** | **Voting Window** | Students decide. Instructor sits silently at the front. Counts heads. Collects ballots in a clear box. Notes who leaves/abstains. |
  | **25-30** | **The Count** | Instructor counts Real Votes ($R$) aloud on the board. Opens Envelope. Reveals $P$. Calculates $R + P$. Announces Winner. |
  | **30-75** | **Debrief** | Structured discussion (see below). |

  #### Facilitator Script (Critical Moments)

  *   **On the Cost:** "I am not penalizing abstention. But I am protecting the time of those who vote. If you vote, you must complete the slip. If you don't, you reclaim that time."
  *   **On the Odds:** "I am telling you the odds are effectively zero. I am not hiding the math. You are voting blind to the *result*, but not to the *probability*."
  *   **During Voting:** Say nothing. If asked "Does it matter?", reply: "You know the parameters."
  *   **The Reveal:** When opening the envelope, do not dramatize it. Treat it as administrative data. "The Phantom Margin was 42,105 favoring Option B. The Real Vote was 14 favoring Option A. The Result is Option B."

  ---

  ### III. The Debrief (45 Minutes)

  **Goal 1: Turnout vs. Arithmetic**
  *   **Action:** Write the turnout percentage on the board next to the calculated probability of pivotality ($<0.001\%$).
  *   **Prompt:** "The model predicts 0% turnout. We observed X%. Why?"
  *   **Trap to Avoid:** Do not let them say "Because voting is good." Push for mechanism.
  *   **Probe:** "Did you vote to *change the result* or to *be the kind of person who votes*?" (Instrumental vs. Expressive).
  *   **Abstainer Check:** Ask an abstainer: "Did you stay home because your vote wouldn't matter, or because you hoped others would secure your preferred outcome anyway?"
      *   *If "wouldn't matter":* They accepted the math.
      *   *If "others will do it":* They are free-riding. Ask: "What if everyone thought that?" (Unraveling the collective action problem).

  **Goal 2: Mapping Moments to Arguments**
  *   **Action:** Reconstruct the timeline.
  *   **Prompt:** "At minute 18, when you were writing your justification, did you feel like a calculator or a citizen?"
  *   **Connection:** When a student claims the "intrinsic worth" term is a fudge, point to the Voting Window. "You paid a real cost (time) for a zero-probability return. You revealed a preference for participation over utility maximization. The 'fudge' is your actual behavior."

  **Goal 3: The "Luck" Objection**
  *   **Action:** Address the Common Draw structure.
  *   **Prompt:** "Some might say the Phantom Margin made this a game of luck, not democracy."
  *   **Counter:** "In a city of 200,000, the 'other voters' are exactly that: a force of nature you cannot predict. Did the Phantom Margin feel different from the uncertainty of a real election? Or was it just a clearer version of the same fog?"

  ---

  ### IV. Failure Mode Analysis

  **1. The "Mathematician" (Reverse-Engineering)**
  *   *Risk:* A student announces, "The probability is $10^{-5}$, so this is stupid."
  *   *Mitigation:* Pre-empt this. "I know the probability is vanishingly small. That is the variable we are testing. If you announce the number, you are merely reading the syllabus aloud. The question is not the number, but your hand."
  *   *Acceptance:* If they say it, agree. "Correct. So why is your hand raised?" This isolates the irrationality immediately.

  **2. The "Bloc" (Collusion)**
  *   *Risk:* Students agree to all vote A to maximize $R$.
  *   *Mitigation:* Even if all 22 vote A, $R=22$. $P \approx 50,000$. The bloc is still irrelevant.
  *   *Acceptance:* If they try, note it. "You have formed a coalition. In a real election, this is a party. Does forming a party solve the paradox, or just move it to the party level?" (This is a rich theoretical tangent).

  **3. The "Refusal" (Ethical Protest)**
  *   *Risk:* Students refuse to participate in a "manipulative experiment."
  *   *Mitigation:* Frame it as **Consent**. "This is a simulation of a civic duty. Abstention is a valid vote. If you refuse the simulation, record that as an abstention. We will count your refusal as data."
  *   *Acceptance:* Use it. "Three people refused the premise. In real life, these are the alienated. Do we design theory for them or the voters?"

  **4. The "Black Swan" (Phantom Draw Failure)**
  *   *Risk:* The envelope contains a number like 5. The students decide the election.
  *   *Mitigation:* **The Pre-Draw Safeguard.** (As noted in Design). Generate 5 numbers beforehand. Pick the one furthest from zero. Seal that one. Destroy the others.
  *   *Acceptance:* If it happens anyway (e.g., $P=10$, $R=14$), do not hide it. "We got lucky. This happens in real elections (e.g., Florida 2000). Does one edge case invalidate the law of large numbers? Or does it make the stakes of *that* specific vote infinite, which is its own problem?"

  ---

  ### V. Limitations: What the Device Cannot Reproduce

  Be frank with the class (and yourself) about where the simulation fails.

  1.  **Diffuse Stakes:** In the seminar, the loss is immediate and concrete (more words). In a real election, the difference between candidates is often counterfactual, diffuse, and realized over years. The "pain" of losing here is sharper than in reality, which might artificially inflate turnout (defensive voting).
  2.  **Social Visibility:** In a room of 22, abstention is visible. In a booth, it is secret. The social cost of *not* voting in the seminar is higher than in the voting booth, which may skew the "irrational" turnout upward.
  3.  **Known Odds:** Real voters are rarely handed the standard deviation of the electorate. They operate on *confidence*, not *probability*. By giving them the math, you are testing "Rationality under Certainty," whereas real voting is "Rationality under Ambiguity." Some students may vote simply because they distrust the envelope, not because they value participation.
  4.  **The "One-Off" Problem:** This is a single shot. Real voting is iterative. If I vote today and lose, I might vote again in four years to build a habit or signal loyalty. The simulation lacks the shadow of the future.

  ### VI. Instructor's Note on the "Feeling"

  The success of this session depends on your **affective neutrality**. If you seem to want them to vote, they will vote to please you (demand characteristics). If you seem to want them to abstain, they will rebel. You must be a clerk, not a campaigner. The silence during the Voting Window is the most important pedagogical tool you have. Let the ticking clock impose the cost. Let the sealed envelope impose the futility. When they walk out, they should feel the hollowness of the instrument, and the stubbornness of the act. That tension is the lesson.
