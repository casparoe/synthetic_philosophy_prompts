      *   *Correction:* On the "pragmatic" point: The summary says "not pragmatic." Wittgenstein does say it's not that it's *inconvenient* to doubt. But hinges *do* have a functional role. I need to clarify that distinction.
      *   *Correction:* On Religion: The user is right that it's imported. OC mentions religious belief, but the heavy lifting is usually done by *Lectures on Religious Belief*. I should confirm their instinct.
      *   *Crucial Point:* The "conversion" model. Wittgenstein *does* use the language of conversion sometimes, but scholars like Danièle Moyal-Sharrock argue hinges are universal human nature, not cultural tribes. This is the best counter-argument for the user.

  7.  **Final Polish:** Check against the user's specific constraints (claim-by-claim, two specific spots, interpretive ground). Ensure the conclusion on the policy implication is clear. (The policy conclusion is dangerous and philosophically unsupported).

  8.  *(Final thought before generating)*: Make sure to mention *On Certainty* specifically, as the prompt focuses on the "last notebook." Don't get too bogged down in *Philosophical Investigations* unless relevant to "forms of life."

  9.  **Structure:**
      *   Intro: Validate intuition.
