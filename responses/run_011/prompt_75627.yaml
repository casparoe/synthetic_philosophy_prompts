answer: |-
  1. You argue that because GR *permits* a timeless model, objective lapse is not a consequence of our laws. But what licenses the inference from a nomologically possible geometry to a metaphysical conclusion about the actual world?
     **Follow-up:** You will likely call appeals to our expanding universe "actualist prejudice." But if the laws allow both temporal and timeless models, why does the timeless possibility defeat the temporal actuality rather than vice versa?

  2. Special Relativity already dismantled global simultaneity without invoking closed timelike curves. What specific metaphysical work is the Gödel solution doing that the relativity of simultaneity in Minkowski space does not?
     **Follow-up:** You will likely note that Minkowski space admits a foliation by global time slices while Gödel does not. But if proper time survives along local worldlines in both, is your claim really about time or just about cosmic topology?

  3. The Gödel solution requires the cosmological constant to be exactly fine-tuned to the dust density. If this balance is structurally unstable, why should we grant it metaphysical weight over generic solutions?
     **Follow-up:** You will likely argue that possibility does not require stability. But in physics, measure-zero solutions are typically treated as mathematical curiosities. Why is metaphysics exempt from this physical heuristic?

  4. If Hawking's chronology protection conjecture holds, semi-classical vacuum fluctuations diverge at chronology horizons, effectively banning closed timelike curves. Does your argument collapse if classical GR is incomplete precisely where CTCs arise?
     **Follow-up:** You will likely retreat to the metaphysical primacy of classical GR. But if classical GR is known to break down in the high-energy regimes required to traverse these curves, aren't you building metaphysics on a known failure of the theory?

  5. Is your target objective lapse or simply the possibility of acting on one's own past? If it is the latter, doesn't the standard compossibility reply—that you cannot change what *is* fixed—neutralize the paradox without eliminating temporal passage?
     **Follow-up:** You will likely insist the *structure* allowing self-interaction is the problem. But if the timeline remains consistent, where is the contradiction that necessitates the elimination of objective lapse rather than just the elimination of "changing" the past?

  6. Gödel spacetime retains a sharp local distinction between timelike and spacelike directions. Is the loss of objective time really just the loss of global hyperbolicity, rather than a failure of local temporal becoming?
     **Follow-up:** You will likely argue that time is essentially global. But since physical observers experience only local proper time, why does the global topology override the local phenomenology that defines temporal experience?

  7. You maintain that the rotation is inessential and that any solution containing closed timelike curves serves your argument equally well. Why, then, is the Gödel universe the privileged example rather than the Kerr metric or a Tipler cylinder?
     **Follow-up:** You will likely say CTCs are the necessary condition. But Gödel tied the failure of time specifically to the rotation of the matter. If you discard rotation, are you discarding the specific mechanism Gödel identified for the breakdown of time?

  8. You dismiss the prohibitive velocities and energies required to traverse a closed timelike curve as mere engineering constraints. But if no physical agent can ever traverse the curve, in what sense does the curve represent a genuine possibility for temporal experience?
     **Follow-up:** You will likely claim geometric possibility is ontic regardless of accessibility. But does this not detach the metaphysics of time entirely from the metaphysics of experience, rendering "time" a property of the manifold rather than of events?

  9. What specific observation, theorem, or distinction within the framework of relativistic physics would force you to abandon the claim that closed timelike curves eliminate objective lapse?
     **Follow-up:** You will likely cite a proof that CTCs are impossible. But if that proof relies on quantum gravity or energy conditions violated by quantum fields, do you concede that classical GR is metaphysically silent on the nature of time?
