answer: |-
  Here is the specification for a functional account of supererogation. These are not descriptions of what supererogation *is* (you already have the two-line gloss), but the structural loads a theory must bear to prevent collapse into utilitarianism, strict deontology, or moral nihilism.

  ### The Spec: Seven Requirements for Supererogation

  **1. Grounded Optionality (The "Why Not" Constraint)**
  *   **Requirement:** The account must explain *why* the agent is permitted to refrain from the better act without moral failure. It cannot simply stipulate optionality; it must identify the normative feature that blocks the "ought implies can" slide into "ought implies must do the best."
  *   **Case:** The Standard Rescue. You can save a drowning child at the cost of ruining your suit. Consequentialism says you must. Supererogation says you may. The theory must name the blocker (e.g., agent prerogative, cost threshold, rights).
  *   **Status:** **Non-negotiable.** Without this, you have not defined supererogation; you have merely asserted a deviation from maximizing theories.

  **2. Positive Normative Valence (The "More Than Neutral" Constraint)**
  *   **Requirement:** The act must be distinguished from morally neutral permissions. It must carry a distinct normative weight (praiseworthiness, merit) that neutral acts lack. It cannot be merely a "residual category" of things not forbidden.
  *   **Case:** Eating an apple vs. donating a kidney. Both are permitted. Only one is supererogatory. The account must explain the qualitative difference in moral status, not just the difference in outcome.
  *   **Status:** **Non-negotiable.** If the category is purely residual, it has no explanatory power for why we praise the agent.

  **3. Relational Sensitivity (The "Context Shift" Constraint)**
  *   **Requirement:** The account must explain how the same act-type flips status based on the agent's history, role, or relationships. It must distinguish act-evaluation from agent-evaluation.
  *   **Case:** The Parent vs. The Stranger. Jumping into a pool to save a child is obligatory for the parent, supererogatory for the stranger. The theory must locate the variable (special obligation, contract, vulnerability) that shifts the deontic status without changing the physical act.
  *   **Status:** **Non-negotiable.** An account that makes saving a child universally supererogatory fails to capture special duties; one that makes it universally obligatory fails to capture liberty.

  **4. Enforcement Consistency (The "Pressure" Constraint)**
  *   **Requirement:** The account must specify the normative status of external pressure (request, guilt, reward, coercion). It must determine if encouraging a supererogatory act undermines its supererogatory status.
  *   **Case:** The Fundraiser. If I pressure you to donate beyond duty, do I wrong you? If I offer a reward, does it corrupt the moral worth? The theory must define the boundary between legitimate encouragement and coercive conversion of the act into duty.
  *   **Status:** **Contested Taste.** (Libertarian accounts forbid pressure; Communitarian/Virtue accounts allow it). However, the account *must take a position*; silence here is a failure.

  **5. Agent-Neutral Valuation (The "Cost/Motive" Constraint)**
  *   **Requirement:** The supererogatory status must be separable from the agent's subjective cost and subjective motive. It must handle cases where the act is costless for the agent or done for mixed/bad reasons.
  *   **Case:** The Billionaire and the Spiteful Donor. (A) A billionaire donates $1M with zero subjective sacrifice. (B) A donor gives to spite a rival. Is it still supererogatory? The account cannot rely solely on "sacrifice" or "purity" to define the category.
  *   **Status:** **Non-negotiable.** If supererogation requires sacrifice, the Billionaire case vanishes. If it requires pure motive, most actual praise vanishes. A robust account must classify the *act*, not just the *psychology*.

  **6. Logical Symmetry (The "Suberogatory" Constraint)**
  *   **Requirement:** The account must state whether the logic of supererogation forces a mirror category (acts that are bad but permitted/suberogatory). It must explain why the asymmetry exists if it denies the mirror.
  *   **Case:** The Rude Host. You host a dinner and serve edible but disgusting food. It's not forbidden, but it's morally worse than serving good food. Is this "suberogatory"? If you deny this category, you must explain why moral liberty only works in the positive direction.
  *   **Status:** **Contested Taste.** Some theories require symmetry; others argue morality is inherently asymmetric (thresholds vs. ceilings). The account must declare its stance.

  **7. Non-Arbitrary Threshold (The "Ceiling" Constraint)**
  *   **Requirement:** In a world where one can always do a bit more good, the account must define a non-arbitrary stopping point for obligation. It must explain where "enough" begins.
  *   **Case:** The Maximizing Agent. You can donate 10%, 20%, 100% of your income. If 10% is duty and 20% is supererogatory, what normative fact marks the line? It cannot be a number pulled from thin air.
  *   **Status:** **Non-negotiable.** Without this, the distinction between obligation and supererogation collapses into a continuum with no deontic breakpoints.

  ***

  ### The Analysis: Knockouts and Incompatibilities

  **The Single Knockout: Requirement 1 (Grounded Optionality)**
  This is the graveyard of most theories. Utilitarianism fails it (nothing is optional). Kantianism often fails it (perfect/imperfect duties struggle to accommodate the "better but not required" without making it a duty of virtue). Even many "prerogative" accounts fail because they ground optionality in *cost* (see Requirement 5), which collapses when the cost is low. To pass R1, you must posit a normative right to not be a moral saint, which requires a meta-ethical commitment to agent-relative value that many objective theories reject.

  **The Jointly Unsatisfiable Pair: Requirement 2 (Positive Valence) + Requirement 4 (Enforcement Consistency)**
  These two create the "Praise without Pressure" paradox.
  *   If an act has **Positive Valence (R2)** (it is objectively morally better), there is a pro tanto reason to promote it.
  *   If **Enforcement Consistency (R4)** says pressure/request is off-limits (to preserve optionality), you are asserting that we ought to promote the good *except* when we can effectively promote the good.
  *   **The Conflict:** You cannot consistently hold that an act is *morally superior* and *socially unenforceable* without invoking a "right to silence" (R1) that trumps the good. If you don't have a robust R1, R2 and R4 contradict. A theory that claims the act is "better" but forbids me from asking you to do it owes an explanation of why the "betterness" doesn't generate a demand. Most accounts fudge this by saying "pressure makes it coerced," but that conflates psychological motivation with normative status.

  ***

  ### Scorecard of Existing Approaches

  *   **Classical Utilitarianism:** Fails **R1** and **R7**. Everything is obligatory; no supererogation exists.
  *   **Sacrifice-Based Accounts (e.g., Heyd):** Pass **R1** (via cost) but fail **R5**. The Billionaire case ceases to be supererogatory because no sacrifice occurred.
  *   **Prerogative-Based Accounts (e.g., Scheffler):** Pass **R1** and **R5** but struggle with **R7**. The "agent-centered prerogative" often looks like an arbitrary threshold for where self-interest outweighs the good.
  *   **Virtue Ethics:** Passes **R2** and **R5** easily but often fails **R4**. Virtue theories tend to encourage pressure/education to shape character, blurring the line between duty and supererogation.
  *   **Rights-Based Deontology:** Passes **R1** and **R4** (rights block pressure) but often fails **R3**. Struggles to explain why the *same act* shifts status for parents vs. strangers without ad-hoc additions about contracts.

  **Verdict:** No current account clears all seven without significant metaphysical baggage. The tension between **R2** (it's better) and **R4** (don't ask for it) is the fracture line where most theories leak.
