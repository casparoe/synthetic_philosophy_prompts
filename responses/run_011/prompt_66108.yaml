answer: |-
  **NormForm™ Convention Installation Kit (Model C-1969)**
  **Manufacturer:** OntoSys Industries
  **Document Ref:** NF-UK-04

  **1.0 DIAGNOSTIC CHECKLIST**
  Before initiating installation, verify that the behavioral regularity in question constitutes a genuine coordination problem. Do not proceed if the situation involves moral imperatives or zero-sum distribution.

  *   [ ] **Regularity:** Is there a recurring pattern of behavior (e.g., path usage, queue ordering)?
  *   [ ] **Conditional Preference:** Does each resident prefer to conform *only on the condition* that others conform? (Example: I prefer driving on the left iff you prefer driving on the left. If you drive on the right, I prefer to do so as well.)
  *   [ ] **Interlocking Expectations:** Does each resident conform because they expect others to conform, and know that others expect them to conform?
  *   [ ] **Coordination Failure:** Is the lone deviant considered inefficient rather than wrongful?

  If any box remains unchecked, the NormForm™ Kit is incompatible. Proceeding may result in unstable equilibria or perceived illegitimacy.

  **2.0 INSTALLATION PROCEDURES**
  **2.1 The Herald Module**
  A decree cannot by itself produce a convention. To stabilize expectations, you must generate Common Knowledge. Activate the included Herald Module (public announcement system) in a central location.

  *   **Step 1:** Assemble all households in a single visual field.
  *   **Step 2:** Broadcast the proposed regularity (e.g., "Laundry Queue operates via sign-up sheet").
  *   **Step 3:** Ensure all attendees observe that all other attendees are observing the broadcast.

  **Note:** Private correspondence (letters, emails) is insufficient. Private letters generate mutual knowledge (I know, you know) but fail to generate common knowledge (I know that you know that I know). This limitation is not curable by sending follow-up letters or requesting read receipts. The Herald Module must be singular and public.

  **2.2 Equilibrium Selection**
  The Kit does not evaluate the intrinsic merit of the regularity. The selection among rival equilibria is made by salience and precedent rather than by reason.

  *   **Feature:** The installed regularity is arbitrary. An alternative regularity (e.g., driving on the right instead of the left) would have served equally well provided it was universally adopted.
  *   **Instruction:** Do not attempt to justify the rule with moral arguments. Cite precedence or focal points only. Reasoning invites debate; salience invites coordination.

  **3.0 TROUBLESHOOTING FAQ**
  **Q: Residents are demanding to see the original agreement.**
  A: No agreement exists. Conventions arise from iterated signaling and aligned expectations, not consent. Direct residents to Section 5.0.

  **Q: Residents propose putting the matter to a vote.**
  A: Voting implies a choice between right and wrong. Conventions imply a choice between coordination and chaos. If the vote is close, the convention will fail. If the vote is unanimous, the vote was unnecessary.

  **Q: The regularity feels imposed from above.**
  A: This is a perceptual error. The Kit facilitates emergent order. If the Board acts as a focal point, the resulting norm is still self-policing provided expectations remain interlocked.

  **4.0 KNOWN LIMITATIONS**
  **4.1 Coordination Only**
  The NormForm™ Kit installs coordination conventions only. It cannot install norms requiring sacrifice without reciprocal benefit.

  **4.2 Distributive Questions**
  Questions regarding who receives the larger plot, the quieter room, or the greater share of resources are classified as Conflict Problems. These require the Conflict Resolution Module (Sold Separately).
  *   **Status:** The Conflict Module is indefinitely back-ordered.
  *   **Reason:** The analysis on which the Kit is built does not extend to mixed-motive games. Do not attempt to force distributive questions into the Convention Kit. This will cause system corruption and resident hostility.

  **5.0 WARRANTY AND TERMS OF OBLIGATION**
  **5.1 No Agreement Required**
  OntoSys Industries warrants that the installed norm is binding without a founding compact. Claims for support will be rejected if the customer produces a signed agreement, on the grounds that they have mistaken the product for a contract. No consent was ever made. None is required.

  **5.2 Defeasibility**
  The obligation yielded by this Kit is defeasible. It constitutes a reason to conform only while general conformity is expected.
  *   **Condition:** If expectations collapse (e.g., residents begin to expect others to deviate), the obligation expires immediately.
  *   **Override:** The reason to conform may be overridden by competing reasons. The Kit does not specify by what. This is a feature, allowing the system to adapt to changing equilibrium conditions without requiring formal amendment.

  **5.3 Liability**
  OntoSys Industries is not liable for social friction arising from the arbitrariness of the selected equilibrium. Users acknowledge that the stability of the community rests on nothing heavier than the weight of expectation.

  **END OF DOCUMENT**
