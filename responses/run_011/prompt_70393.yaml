  The spread derives from stipulating a bonding relation that alters composition without altering function or micro-intrinsic nature. If withdrawn, bonding supervenes on function; Functionalist and Subject-first verdicts converge, eliminating the spread.
  Auxiliary assumptions:
  1. Micro-experiences are individuable/countable. (Doing hidden work: grounds Additive/Constitutive arithmetic).
  2. Bonding is ontologically distinct from function. (Doing hidden work: allows Functionalist divergence).
  3. Subjecthood requires bonding. (Doing hidden work: allows Subject-first divergence).
  All three assumptions are doing hidden work; without them, the doctrines collapse into agreement.

  **The attack**
  A Functionalist defender argues the stipulation is metaphysically incoherent. If bonding generates a unified subject, it must integrate causal powers differently than discrete ions. Holding functional organization fixed while varying composition denies causal efficacy necessary for subjecthood. The scenario describes a causal idle wheel labeled "bonding," rendering Subject-first and Additive distinctions unintelligible.
