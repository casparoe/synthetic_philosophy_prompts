answer: |-
  # The Heritability Diagnostic: Ten Scenarios for Science Reporters

  **Instructions:** Read each scenario. Select the option that best matches what you would write or believe after verifying the numbers. Do not worry about "correctness"; answer based on your intuition about what the numbers allow you to say.

  ### Item 1: The Schooling Variance (Two-Part)
  **Scenario:** In Population A, all children attend similarly resourced schools; the heritability of Test Score Q is .75. In Population B, school quality varies enormously; the heritability of Test Score Q is .35.

  **Part 1:** What does this difference tell you about the role of genes in the two populations?
  *   (i) Genes play a stronger causal role in determining Q for children in Population A.
  *   (ii) The genetic influence is likely comparable, but Population B has much wider environmental differences masking it.
  *   (iii) The two figures describe different environmental setups; they are not estimates of one underlying "genetic influence" quantity and cannot be compared.

  **Part 2:** Regardless of your choice above, does the .35 figure in Population B suggest that improving schools in Population B would fail to raise scores?
  *   (i) Yes, a low heritability implies the trait is malleable, so schools matter.
  *   (ii) No, a low heritability implies the trait is malleable, so schools matter.
  *   (iii) The number itself does not tell us; we need to know if the school differences are causing the score differences.

  *(Diagnostic Note: Choosing (iii) in Part 1 and (ii) in Part 2 indicates a sophisticated understanding that heritability is context-bound but does not preclude intervention.)*

  ### Item 2: The Dietary Switch
  **Scenario:** A trait has a heritability of .95 in a standard population. Researchers discover that if a specific dietary supplement is given to everyone at birth, the variation in the trait effectively vanishes within one generation.

  **What follows?**
  *   (i) The original .95 estimate was wrong; the trait was never that genetic.
  *   (ii) The .95 was correct for that time and place, but "genetic" does not mean "unchangeable by environment."
  *   (iii) The .95 was correct, but it only measured variation, not the biological mechanism, which turned out to be nutritional.

  ### Item 3: The Missing Prediction
  **Scenario:** A twin study estimates the heritability of a behavior at .60. A polygenic score (DNA test) built from a massive sample predicts only 4 percent of the variance in an independent sample.

  **How do you describe the gap?**
  *   (i) The DNA test is currently useless, and the twin study number is likely an exaggeration.
  *   (ii) The twin number reflects all genetic influence, while the DNA test captures only the specific variants we have found so far.
  *   (iii) The twin number measures family resemblance, which includes shared environments the DNA test does not see.

  ### Item 4: The Equalizing Policy
  **Scenario:** A government policy makes every child's home environment nearly identical. Afterward, the heritability of academic achievement rises from .40 to .70, even though every child's absolute achievement improves.

  **What is the headline?**
  *   (i) Inequality is now more genetic than before.
  *   (ii) Environmental differences no longer explain why children differ from one another, even though the environment helped everyone.
  *   (iii) The policy failed to reduce the genetic gap, so achievement is fixed.

  ### Item 5: The Group Inference
  **Scenario:** Within Group X, the heritability of Height is .80. Within Group Y, the heritability of Height is .80. Group X is on average 5 inches taller than Group Y.

  **Can you infer the cause of the 5-inch difference?**
  *   (i) Yes, it is mostly genetic, because height is highly heritable in both groups.
  *   (ii) No, the average difference could be entirely environmental, even if individual differences are mostly genetic.
  *   (iii) No, you cannot compare the groups without measuring their specific environments.

  ### Item 6: The Twins Apart Critique
  **Scenario:** A study of identical twins reared apart estimates heritability at .60. A critic objects that the adoptive homes were not truly random; they were all screened to be middle-class.

  **Does this undermine the study?**
  *   (i) Yes, it invalidates the .60 number entirely.
  *   (ii) It limits the number: the .60 applies only to the range of middle-class environments, not all possible environments.
  *   (iii) No, as long as the homes differed from each other, the comparison holds.

  ### Item 7: The Family Disagreement
  **Scenario:** A "between-family" analysis (comparing different families) suggests a strong genetic link to income. A "within-family" analysis (comparing siblings in the same family) shows a much weaker link.

  **What does the disagreement imply?**
  *   (i) Genetics matters less than we thought; the first number was confounded by family advantage.
  *   (ii) Genetics matters the same, but siblings share environments that make them look more similar than their genes alone would.
  *   (iii) The two methods measure different things; one measures inheritance, the other measures development.

  ### Item 8: The Embryo Selection (Substitute for Livestock)
  **Scenario:** A clinic uses a heritability estimate of .80 for a trait to promise parents that selecting embryos will shift the trait in their children. This is the same math used to breed corn for higher yield.

  **Is this use of the number secure?**
  *   (i) Yes, the math of selection is the same for corn and humans.
  *   (ii) It is less secure for humans because we cannot control the environment (womb, upbringing) as tightly as a farmer controls a field.
  *   (iii) It is invalid; human traits do not respond to selection like crop traits.

  ### Item 9: The Adoption Resemblance
  **Scenario:** In an adoption study, children resemble their biological parents on a trait even after adjusting for the rearing environment's quality.

  **What is this evidence of?**
  *   (i) Direct genetic causation of the trait.
  *   (ii) Genetic influence, but possibly through traits the child evokes in others (e.g., a difficult temperament eliciting harsh parenting).
  *   (iii) A statistical artifact; you cannot fully adjust for the rearing environment.

  ### Item 10: The Secular Trend
  **Scenario:** The heritability of IQ is .70. Over 50 years, the average IQ of the population rises by 15 points.

  **How do you reconcile the rise with the heritability?**
  *   (i) You can't; if it's genetic, the average shouldn't change that fast.
  *   (ii) The environment changed for everyone, shifting the average, while genes still explain why individuals differ from that new average.
  *   (iii) The heritability estimate must have been wrong during the period of change.

  ***

  # Scoring Key and Diagnostic Leaves

  Do not tally points. Map the participant's pattern of choices to the following eight leaves. A participant may exhibit a dominant leaf or a hybrid of two adjacent leaves.

  1.  **Individual Causation:** (Items 1i, 2i, 4i, 5i). Believes $h^2$ describes the proportion of a *specific person's* trait caused by genes. Treats the coefficient as a measure of immutability.
  2.  **Plain Variance-Partition:** (Items 1ii, 2ii, 4ii, 5ii, 6ii, 10ii). Treats $h^2$ as a population statistic indexed to a specific environmental range. Silent on individuals, compatible with environmental shifts in the mean.
  3.  **Deflationary:** (Items 1iii, 2iii, 6i, 10i). Accepts the math but argues the indexing is so severe the number implies almost nothing about reality or mutability.
  4.  **Interventionist:** (Items 1-Part2-ii, 8i). Views $h^2$ as a license to predict response to direct genetic manipulation (or selection) with environment held fixed.
  5.  **Developmental-Systems:** (Items 3iii, 7iii, 9iii). Argues that additive partitioning is a bad picture of causation because factors (genes/environment) never contribute separably.
  6.  **Gene-Environment Correlation (rGE):** (Items 3iii, 7i, 9ii). Views $h^2$ as real but partly measuring environments that genotypes select, evoke, or create.
  7.  **Predictive:** (Items 3ii, 8iii). Values the number chiefly as a ceiling on prediction accuracy (e.g., polygenic scores), regardless of causal status.
  8.  **Evolvability:** (Items 8i vs 8iii). Holds that the only coherent target for $h^2$ is response to selection; human social applications are often a category error unless selection is the goal.

  ### Unoccupied Combinations
  Certain answer patterns correspond to no defensible view. If a participant selects these, they are likely answering inconsistently.
  *   **Individual Causation + Plain Variance:** (e.g., Item 1i and Item 4ii). *Incoherent.* You cannot believe the number applies to individuals *and* that it is silent on individuals.
  *   **Predictive + Deflationary:** (e.g., Item 3ii and Item 10i). *Incoherent.* If the number sets a predictive ceiling, it cannot be that a rapid mean shift invalidates the estimate; prediction works on variance, not means.
  *   **Evolvability + Individual Causation:** (e.g., Item 8i and Item 5i). *Unattractive.* Breeding logic applies to populations over generations, not to guaranteeing outcomes for specific individuals in one generation.

  ### Instrument Commentary

  **1. The Weakest Item and Substitution**
  I have substituted the **Livestock/Selection** case from your list with **Item 8 (Embryo Selection)**.
  *Reasoning:* The livestock case tests the *Evolvability* leaf, but for a newsroom science desk, "corn breeding" is abstract and easily dismissed as "not about humans." The Embryo Selection scenario tests the exact same logical structure (response to selection under controlled vs. uncontrolled environments) but forces the reporter to confront the *human* stakes. It separates the *Evolvability* view (math is the same) from the *Plain Variance* view (env control differs) more sharply because the ethical and practical stakes are immediate. The livestock case would likely result in uniform "humans aren't corn" answers that diagnose moral intuition rather than statistical understanding.

  **2. Verdict on Merging Leaves**
  I recommend **against merging Deflationary and Developmental-Systems (DST)**.
  *Reasoning:* Your hunch is that they collapse under questioning. For a *philosopher*, they might. For a *reporter*, they are distinct tools.
  *   **Deflationary** says: "The number is real, but you can't use it for policy." (Epistemic limit).
  *   **DST** says: "The number describes a fiction because genes and environment don't add up." (Ontological claim).
  If you merge them, a reporter cannot distinguish between "we don't know enough to act" (Deflationary) and "the model of causation is wrong" (DST). The former invites better studies; the latter invites abandoning the metric. Keeping them separate allows you to tailor the clinic: one group needs lessons on confidence intervals and context; the other needs lessons on interaction models.

  **3. Indistinguishable Leaves (Interventionist vs. rGE)**
  You suspected these are indistinguishable to non-specialists. **You are wrong.**
  *   **Interventionist** is about *manipulation* (Change G, hold E constant).
  *   **rGE** is about *correlation* (G changes E, which changes P).
  Item 7 (Within/Between Family) and Item 9 (Adoption) separate these cleanly. If a reporter chooses rGE, they acknowledge genes work *through* the environment. If they choose Interventionist, they believe genes work *on* the trait directly. This distinction is vital for writing about policy (fix the environment vs. fix the genome). The diagnostic items force this choice by presenting scenarios where the environmental path is explicit.

  **4. Expected Clustering**
  Most working journalists will land on a hybrid of **Plain Variance-Partition** and **Deflationary**. They intuitively know the number is population-specific (Plain Variance) but are professionally skeptical of its utility for headlines (Deflationary). This is a stable, functional position. The "error" state to watch for is **Individual Causation** mixed with **Predictive** (believing a DNA test can determine an individual's fate because $h^2$ is high). Item 3 and Item 8 are designed to catch this specific dangerous combination.
