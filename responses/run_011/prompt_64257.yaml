answer: |-
  ### Diagnosis: The Step to Remove

  Remove **Step (5)**: *"If a subject does not know p, then not-p is epistemically open for that subject: nothing she has rules it out."*

  This is the step whose removal costs least and suffices to block the skeptical conclusion. Your friend's argument relies on the assumption that the *only* thing that can close off a possibility is evidential knowledge. Wittgenstein's entire project in *On Certainty* is to show that there is a mode of certainty that is not knowledge (in the evidential sense) but nevertheless *closes* the possibility of doubt. By removing (5), you preserve (1) and (2) (hinges are unsupported background) without conceding (6) (skeptical scenarios are open). You can maintain that hinges are not "known" (satisfying 3) while denying that their negations are "open" (rejecting 5). This blocks the slide into the relativism of (8) and (10) without requiring you to defend hinges as empirical knowledge.

  ***

  ### Analysis of Steps (3), (5), and (7)

  Here is the breakdown of the three pivotal moves your friend considers beyond reproach, examining their appeal, their hidden equivocations, and the cost of rejecting them.

  #### Step (3): "Whatever is not evidentially supported is not known."

  *   **Why it looks unobjectionable:** This is the bedrock of post-Gettier epistemology. It aligns with the intuition that knowledge requires justification. To claim "I know" without evidence looks like dogmatism or confusion. It preserves the integrity of the concept of knowledge by distinguishing it from mere belief or luck.
  *   **What it equivocates on:** It equivokes on the grammar of "know." Wittgenstein argues that "I know" has two distinct uses: the empirical (where doubt makes sense and evidence is required) and the grammatical/framework (where "I know" functions as a pledge of allegiance to a system of judgment). Step (3) assumes the word "know" has a single essence that applies to both "I know I have hands" and "I know 2+2=4." Wittgenstein suggests that in the latter case, "I know" is a misfire; it is not a claim to knowledge but an expression of certainty that makes knowledge-claims possible.
  *   **What the position forfeits:** If you give this up, you forfeit the ability to call hinges "knowledge" in the standard sense. You must accept a category of "unjustified certainty." This looks like a concession to the skeptic (that we don't *know* the world exists) unless you can successfully argue that "knowledge" was the wrong word to begin with.

  #### Step (5): "If a subject does not know p, then not-p is epistemically open."

  *   **Why it looks unobjectionable:** This is the principle of fallibilism. It seems rational to admit that if you cannot prove something, its negation remains a live possibility. It prevents epistemic arrogance. It is the engine of scientific inquiry: no theory is so secure that its falsity is logically impossible.
  *   **What it equivocates on:** It equivocates on "open." There is a difference between *logical* openness (it is not a contradiction) and *epistemic* openness (it is a doubt I can entertain). Wittgenstein's point is that hinges are not open in the epistemic sense, even if they are open in the logical sense. To doubt a hinge is not to be rational; it is to lose the ability to judge *anything*. Step (5) assumes that all closure is evidential. Wittgenstein argues some closure is *constitutive*.
  *   **What the position forfeits:** If you reject this, you forfeit the idea that doubt is always virtuous or that all possibilities must be kept open pending evidence. You accept that some possibilities are "closed" by our form of life, not by our evidence. This risks looking like irrational closure, unless you can explain why these specific closures are necessary for thought itself.

  #### Step (7): The Classification (Astrologer vs. Scientist)

  *   **Why it looks unobjectionable:** This is a structuralist insight. From a "God's eye view," both the scientist and the astrologer have axioms they do not test. If hinges are defined solely by their *role* (being held fixed), then structurally, a superstition can function as a hinge just as well as a law of physics. It seems to follow from (1) and (2) that the *content* of the hinge shouldn't matter, only its function.
  *   **What it quietly assumes:** It assumes that hinges are isolated propositional attitudes detached from action and prediction. It assumes that a "system" is defined only by its internal coherence, not by its success in navigating the world. It treats the "form of life" as a private language game rather than a shared, practical engagement with reality.
  *   **What the position forfeits:** If you reject this, you forfeit the ability to treat all frameworks as structurally identical. You must admit that some hinges are *better* than others, not because they are evidenced (which would violate 1 & 2), but because they sustain a form of life that works. This requires a pragmatic criterion for hinges, which risks turning pragmatism into a new kind of evidence.

  ***

  ### Answers to the Three Questions

  **1. If you reject (5), do you retain a principled account of when ignorance leaves a possibility genuinely open, or has the notion of an open possibility been retired without replacement?**

  You retain the account, but it becomes *internal* to the language game. "Open possibility" is not a relation between a subject and the world *simpliciter*; it is a relation between a subject and a proposition *within a system of doubt*.
  If you reject (5), you distinguish between **real doubt** and **paper doubt**. A possibility is "genuinely open" only if there is a method for investigating it within the accepted hinges. "I might be a brain in a vat" is logically possible but not epistemically open, because there is no test I can run that doesn't already presuppose I am not. By rejecting (5), you do not retire "open possibility"; you restrict it to moves *within* the game. The skeptic tries to make a move *about* the game, which is why their doubt is not "genuine" but nonsensical. The principle remains: a possibility is open if it can be meaningfully tested. Hinges define what counts as a test.

  **2. If you reject (3), how do you keep the resulting view from becoming a rival thesis about what hinges are, rather than a refusal to treat them as candidates for knowledge at all — and if it is such a refusal, does that not make the book itself unreadable as argument?**

  This addresses your worry about the argument being "self-consuming." If you reject (3) and say hinges *are* known (just differently), you risk turning hinge epistemology into a foundationalist theory (a rival thesis).
  To avoid this, you must treat *On Certainty* not as an argument *for* a theory, but as a **therapeutic description**. Wittgenstein is not positing "Hinges" as metaphysical objects; he is pointing out how we *use* words. If you reject (3), you do not say "Hinges are a special kind of knowledge." You say "The word 'know' is being idling here."
  This does not make the book unreadable; it changes its genre from *theory* to *grammatical investigation*. The "argument" is not a proof that forces you to accept a conclusion, but a perspicuous representation that dissolves the urge to ask for evidence where none makes sense. The book is readable as a series of reminders, not a treatise. If you treat it as a theory, it self-destructs. If you treat it as therapy, it succeeds.

  **3. If you reject the move in (7), what distinguishes a hinge from a prejudice that has simply never been challenged, given that the distinction cannot itself be an evidential one?**

  This is the price of keeping (1) and (2). If you cannot use evidence to distinguish a hinge from a prejudice, you must use **role** and **consequence**.
  *   **Role:** A prejudice is a proposition *within* the system that is shielded from doubt (e.g., "My leader is never wrong"). A hinge is the *axis* around which the system turns (e.g., "There is an external world"). A prejudice can be discarded without the system collapsing; a hinge cannot.
  *   **Consequence (Form of Life):** This is the harder pill to swallow. You distinguish them by their embedding in action. A hinge is validated by the *success of the actions* it governs. If I hold "Fire burns" as a hinge, I survive. If I hold "Fire heals" as a hinge, I burn. The distinction is not evidential (I don't test "Fire burns" every time), but it is pragmatic.
  To reject (7) is to admit that while hinges are not evidenced, they are not *arbitrary*. They are selected by the pressure of reality on our form of life. The astrologer's hinges may function *as* hinges for her, but they fail to sustain a form of life that allows for shared prediction and control. You forfeit the ability to condemn her from a "neutral" standpoint, but you retain the right to say her system leads to dead ends. The distinction is not truth, but *viability*.
