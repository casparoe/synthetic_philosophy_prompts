answer: |-
  Here is the diagnosis.

  The stalemate is not primarily epistemic, nor is it merely about differing senses of "wrong." It is a **category error regarding the site of moral agency**, which generates a systematic **equivocation between liability and blameworthiness**.

  The Revisionists treat war as an aggregation of individual interpersonal conflicts (the Self-Defense Model). On this view, the fundamental unit of analysis is the individual killer and the individual victim. Moral liability tracks objective responsibility for an unjust threat. The Traditionalists treat war as a distinct normative sphere governed by institutional roles (the State-Centric Model). On this view, the fundamental unit is the combatant *qua* combatant. Moral permission tracks adherence to role-based constraints (*jus in bello*), decoupled from the state's cause (*jus ad bellum*).

  The reason the argument spins in circles is that Revisionists are making claims about **objective moral liability** (are you a legitimate target? have you violated rights?), while Traditionalists are making claims about **subjective moral blameworthiness and institutional permission** (are you a criminal? are you doing your job?). When Revisionists concede the "epistemic fog" point (soldiers can't know the cause is unjust), they think they are offering a practical exception to a moral rule. Traditionalists correctly identify that this concession effectively restores the Moral Equality of Combatants (MEC) in practice, rendering the Revisionist moral distinction inert for anyone actually fighting. But Traditionalists then claim this proves MEC is *morally* true, not just practically necessary. Revisionists retort that practical necessity doesn't change objective rights. They are talking past each other because one side is describing the physics of moral rights, and the other is describing the sociology of moral roles.

  ### The Case Test

  Let's run this diagnosis against your two cases.

  **Case 1: The Conscript (Imprisoned if refusing).**
  *   **Revisionist:** Objectively, if the war is unjust, the conscript is contributing to an unjust threat and is liable to defensive killing. However, because of duress and epistemic limits, he is **blameless**. He acts wrongly but is excused.
  *   **Traditionalist:** The conscript is **permitted** to fight. His role obligation, combined with the coercive context, renders the act permissible *in bello*. He is not liable to be killed simply because he is uniformed.
  *   **Diagnosis Check:** The Revisionist distinguishes *wrongdoing* from *blame*. The Traditionalist collapses them into *permission*. The stalemate appears here: The Revisionist says "He's still technically violating rights (just excused)." The Traditionalist says "No, he's doing nothing wrong." This confirms the equivocation on "wrong."

  **Case 2: The Informed Volunteer (Confident the side is unjust).**
  *   **Revisionist:** He is **liable** to be killed and **blameworthy**. He has no epistemic excuse and no duress. He is morally equivalent to a hired hitman for a criminal syndicate.
  *   **Traditionalist:** This is the stress test. Strict Walzerians struggle here. Most will admit he shares in the *ad bellum* guilt, but maintain he retains *in bello* rights (he can't be summarily executed if captured, his killing of enemy combatants isn't murder *under the laws of war*). However, morally, the Traditionalist view frays.
  *   **Diagnosis Check:** Here the models diverge sharply. The Revisionist view yields a clear, harsh moral verdict. The Traditionalist view yields a complex institutional verdict (legal protection, moral guilt). If both camps came out the same, the disagreement would be verbal. They don't. The Revisionist view tracks individual moral knowledge; the Traditionalist view tracks institutional status.

  ### The Recruiting Office and the "Machine"

  The fact that the recruiting office asked no moral questions, and the system is built to preclude that reasoning, is decisive. It confirms that **war is institutionally structured as a Traditionalist practice.**

  The military machine cannot function on Revisionist premises. If every soldier were required to verify the *jus ad bellum* before pulling a trigger, the institution would collapse into a collection of private moral agents, which is not an army. The system *assigns* the moral responsibility for the war's justice to the political leadership and *assigns* the responsibility for conduct to the soldier.

  This changes the diagnosis by revealing that the Revisionist project is **Ideal Theory**, while the Traditionalist project is **Non-Ideal Theory**. Revisionists describe how war *ought* to be if agents were fully informed and institutions were transparent. Traditionalists describe how war *is* given epistemic opacity and institutional necessity.

  For your brother, this means the Revisionist question ("Is the war objectively just?") is **structurally unactionable**. He is placed in a system that assumes the Traditionalist answer ("You fight, we decide the justice"). To ask him to adopt the Revisionist stance is to ask him to opt out of the institution's moral division of labor without the tools to verify the premise.

  ### Progress and Determinacy

  **What counts as progress?**
  Progress requires abandoning the hope for a single, unified "Ethics of War." We need to distinguish:
  1.  **The Ethics of Killing in War:** (Revisionist domain) When does killing violate fundamental human rights?
  2.  **The Ethics of Soldiering:** (Traditionalist domain) What are the permissions and obligations of a role within a coercive institution?

  Progress happens when Revisionists admit their theory cannot generate action-guiding rules for soldiers *ex ante* without relying on Traditionalist epistemic proxies, and when Traditionalists admit MEC is a legal/institutional fiction that does not reflect deep moral reality. The "distinction both sides have to accept" is that **objective liability** and **subjective permission** come apart in war, and we need both concepts to understand it.

  **Does your brother's question have a determinate answer?**
  No. Not as phrased. "Would I be doing something wrong?" is ambiguous between:
  1.  **Objective Wrong:** Violating the enemy's rights. (Undecidable now, depends on facts he can't know).
  2.  **Subjective Wrong:** Acting against conscience or reasonable belief. (Decidable, but depends on his trust in the state).
  3.  **Institutional Wrong:** Violating the rules of his role. (Decidable: No, provided he follows *jus in bello*).

  **The Implication:**
  If you tell him the Revisionist truth, you tell him: "You might be objectively liable to be killed, but you won't know until it's too late, so you should act on your reasonable belief."
  If you tell him the Traditionalist truth, you tell him: "The institution absolves you of the war's justice, provided you fight cleanly."

  The diagnosis implies that for a soldier in his position, **only the Traditionalist question is actionable.** He cannot access the objective moral facts required for the Revisionist judgment. He is epistemically locked into the role. Therefore, the only "wrong" he can actually avoid is violating the *jus in bello* (war crimes) or betraying his own reasonable belief about the state's legitimacy.

  The impasse isn't a failure of philosophy; it's a reflection of the tragedy of war itself: the gap between what is morally true (Revisionism) and what is morally survivable (Traditionalism). Your brother is asking for a moral guarantee in a system designed to operate without one. The honest answer is that he is trading his moral agency for the state's protection, and whether that trade is "wrong" depends on whether he thinks the state is worth that trust—and that is a political question, not a philosophical one.
