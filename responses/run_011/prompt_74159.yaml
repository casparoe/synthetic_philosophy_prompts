answer: |-
  This is a classic "Strong Path Dependence" argument, and your advisor is right: the conclusion (universal lock-in, impossible convergence) is too strong for the premises provided. The argument is seductive because it conflates **hysteresis** (history matters) with **inefficiency** (a better option exists *now*).

  You asked which step to reject. The logical break is in the inference from **(6) to (7)**. The economic overreach occurs in **(5)**.

  Here is the diagnosis of why the argument fails, why it looked innocent, and what you lose by fixing it.

  ### 1. The Logical Break: Step (6) $\rightarrow$ (7)

  **The Inference:**
  *   (6) says: We must regard the institution as surviving *without warrant that it is the best alternative now*. (An epistemic claim: We lack proof of efficiency.)
  *   (7) says: An institution surviving without such warrant is one that *would go on surviving even if known to be inferior*. (An ontological/modal claim: It is inefficient and stable.)

  **Why it looks innocent:**
  It relies on an equivocation on the word "warrant." In (6), "without warrant" means "we haven't proven it's the best." In (7), you treat "without warrant" as meaning "it is not the best."
  You are conflating **uncertainty** with **inferiority**. Just because persistence doesn't *prove* an institution is efficient (due to the shifted comparison class), it does not follow that the institution *is* inefficient. It might be the efficient choice relative to the *current* menu of alternatives (including switching costs), even if it wasn't the efficient choice relative to the *original* menu.

  **The Fix:**
  You must reject the claim that "lack of evidence for superiority" implies "counterfactual stability despite inferiority."
  *   **Correction:** An institution can persist because it *is* the best alternative *now* (given the complements described in Premise 2), even if its persistence tells us nothing about its *original* optimality.

  ### 2. The Economic Overreach: Step (5)

  **The Claim:**
  *   (5) "So persistence never evidences that an institution was, or **remains**, the best of the alternatives open to it."

  **Why it looks innocent:**
  You are correctly observing that the *reasons* for persistence have changed (from initial merit to complementarity). You infer that therefore the *fact* of current merit is unknowable or absent.
  However, Premise (2) describes increasing returns and complementarity. In standard economic theory, if an institution has high complementarity, its net payoff *increases* over time. It is entirely possible that an institution was suboptimal at $t_0$, but due to the mechanisms in (2), it has become the optimal choice at $t_{now}$ relative to the *current* feasible set.

  **The Fix:**
  You must allow that persistence *can* evidence current efficiency, even if it doesn't evidence original efficiency.
  *   **Correction:** Persistence evidences that the institution is a local peak in the *current* landscape, even if history determined which peak we are on.

  ### 3. What You Lose (The Cost of Fixing It)

  If you repair steps (5) and (7), you lose the "Universal" claim.

  1.  **Lock-in is not universal:** You can no longer claim *every* stable institution is locked in. You can only claim that *some* are, specifically where a superior alternative exists *now* but switching costs prevent adoption. You need empirical evidence of that superior alternative, not just a logical proof of its possibility.
  2.  **Convergence is possible:** If the "landscape" of institutional efficiency is shaped by fundamental economic constraints (e.g., transaction costs, information asymmetry) that are universal across societies, different paths can lead to the same local peak. You cannot rule out convergence *a priori*. Double-entry bookkeeping might be a locked-in outcome in one context, but in another, it might be the globally efficient solution that any rational actor would adopt given similar constraints.
  3.  **The "Strong" Definition of Path Dependence:** You retreat from the David/Arthur "Strong" definition (inefficiency is necessary) to the "Weak" or "Generic" definition (history matters/hysteresis). This is the consensus view in modern institutional economics (e.g., Page 2006, *Understanding Path Dependence*).

  ### 4. What You Save (The Benefit)

  By rejecting (6)$\rightarrow$(7) and moderating (5), you save the core economic work you wanted to keep:

  1.  **Premises (2) and (3) remain intact:** You still establish that history matters. You still show that the comparison class shifts. You still show that *ex ante* optimality cannot be inferred from *ex post* persistence.
  2.  **The Mechanism:** Your description of complements, adapted skills, and coalition reconfiguration remains the powerful explanatory engine of the paper.
  3.  **Defensibility:** A paper arguing that "history constrains the set of feasible alternatives, making efficiency context-dependent" is publishable. A paper arguing "efficiency is impossible to identify and convergence is illusory" will be rejected by economic historians and theorists alike as a *reductio ad absurdum*.

  ### Recommendation for the Workshop Paper

  Reframe the argument from **"Universal Lock-in"** to **"The Opacity of Efficiency."**

  Your contribution isn't that *no* institutions are efficient. It's that **persistence is an insufficient statistic for efficiency.**
  *   **Old Conclusion:** Therefore, no persisting institution is efficient (Lock-in is universal).
  *   **New Conclusion:** Therefore, we cannot assume persisting institutions are efficient simply because they persist. The burden of proof shifts to those claiming efficiency to demonstrate that superior alternatives are not *currently* feasible, accounting for the transition costs described in (2).

  This keeps your advisor happy (the conclusion is no longer "impossible"), keeps your economic mechanism (2 & 3), and makes a sophisticated methodological point rather than an untenable ontological one.

  **Specific Revision for Step (7):**
  Replace (7) with: *"And an institution surviving without such warrant is one whose current efficiency is indeterminate without further counterfactual analysis—it may be locked-in, or it may be the efficient response to the current configuration of complements."*

  This kills the universal claim but preserves the skepticism that drives the research.
