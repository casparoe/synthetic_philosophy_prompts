          *   *Bluntness:* The test is too narrow. It defines "political" as "irreversible without social upheaval." But politics happens in the reversible stuff too (zoning, bridge height). The cost of rebuilding the bridges *is* political (budget allocation, will to integrate). It's not just "change the design." It's "spend the money and admit the racism."
      *   *Is it a third category?* No, it's a relabeling of Winner's "inherent politics" vs. "external politics," but with a normative claim that only the former counts as "political."
