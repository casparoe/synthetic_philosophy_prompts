          *   *Actually, looking closer at Game Theory:* Price matching guarantees are often cited as facilitating tacit collusion. If I match your price, you have no incentive to lower yours. So prices stay high. This fits "Commitment makes things worse" (for the consumer) but "better" (for the grocers). The user expected a death spiral (price war). They got stability.
