      *   Tone? Practical, respectful of user's knowledge, direct.

  6.  **Self-Correction on the "Wrinkle":**
      *   I need to be careful not to get bogged down in the economics of price-matching (tacit collusion) because that's complex.
      *   *Simpler explanation:* The commitment stopped the *other* guy from cutting prices. That's the power. The "Race" comes if both try to announce *different* standards or try to announce *first* to claim dominance.
