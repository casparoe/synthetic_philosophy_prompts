          *   *Theory:* Price matching is actually a *collusive* device. It removes the incentive to cut prices because you know the other guy will match, so you gain no market share. It stabilizes high prices.
          *   *Integration:* This is crucial. It validates the "Commitment = Power" but complicates the "Race = Bad." It shows commitment can be used to *avoid* competition.
          *   *Placement:* Use it *after* establishing the basic mechanic, as a "Wait, what happened here?" moment to deepen understanding. It proves commitment changes the game, even if the outcome wasn't the "death spiral" the user expected.
