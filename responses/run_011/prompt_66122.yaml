      *   **Misconceptions:**
          *   *Anticipated:* "Just an arms race" (It's about information/credibility, not just volume), "Just a promise" (It's about *inability* to break it).
          *   *Unanticipated:* "It's about lying/bluffing" (No, it's about truthfully removing options), "It requires malice" (No, it can be rational self-defense), "It's only for big players" (It happens in relationships/traffic).
          *   *Stepping Stone:* "It's just being stubborn." Encourage this initially. Stubbornness is the layman's "commitment." Refine it later to "strategic stubbornness."

      *   **The Check:**
