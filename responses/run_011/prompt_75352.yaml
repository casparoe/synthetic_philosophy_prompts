answer: |-
  1. The French 35-hour week was sold as a liberation from labor, but in practice, it just meant we learned to do forty hours of work in thirty-five so we could spend our days off too exhausted to enjoy them. It was less about the right to be idle and more about the obligation to be efficiently tired.

  2. Weber told us that inner-worldly asceticism makes leisure feel like theft from a calling, and the joke is that the calling died with the theology but the guilt outlived both. I know this because I spent my own reading week grading papers, proving that even without God, I still believe unemployment is a sin.

  3. The state maintains an official category for death by overwork, yet there is no comparable classification for any suffering caused by too much free time. It seems the bureaucracy is perfectly willing to compensate your exhaustion, provided you can prove you earned it.

  4. The four-day-week movement pitches itself as a rebellion against the Protestant ethic, but it mostly just frames rest as recovery so you can work better afterwards. It is essentially the theology of the calling with the God removed, leaving only the imperative to optimize your soul for Monday morning.

  5. Keynes predicted we would be working fifteen-hour weeks by now, but he failed to account for the invention of email and the structural necessity of feeling productive. We didn't solve the economic problem; we just invented new ways to be anxious about it at 3 AM while pretending to be efficient.
