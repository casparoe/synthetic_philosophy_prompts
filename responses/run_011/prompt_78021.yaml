answer: |-
  My dear colleague,

  It is a rare pleasure to encounter a historian who has scrutinized their own intuition with such rigor, and I suspect your suspicion that priors are doing the work is not a confession of error but an identification of the engine. The principle underlying your disparate verdicts is a single rule of explanatory economy, often associated with Hume, which you might state as follows: credit a claim only when the hypothesis that the event occurred explains the existence of the source better than the hypothesis that the event did not occur, unless the inherent improbability of the event makes the source's error the more parsimonious explanation. This is not merely Bayesian priors dressed up, but a formalization of why priors matter, for they measure the inherent improbability of the event against the probability of the source's fabrication. When you accept a routine levy from a late source but reject a comet killing a king from the same pen, you are judging that the cost of inventing a boring truth is higher than the cost of preserving it, whereas the cost of inventing a miracle is lower than the cost of believing one happened. The routine event has a high prior probability, so the source's assertion requires little evidence to be accepted as true, while the extraordinary event has a low prior probability, requiring evidence so strong that a single late source cannot supply it. This principle accommodates your rule on dependent authors, for if one copied the other, the existence of the second report is explained by dependence rather than independent verification, adding no weight to the hypothesis that the event occurred. It also handles your royal inscriptions, where the campaign's occurrence explains the inscription's existence, but the casualty figures are better explained by the propagandistic function of the genre than by the reality of the body count.

  When you apply this principle to the case that troubles you, the source demonstrably dishonest elsewhere whose claim runs against his own interest, the verdict is clear and requires no special provision. You must accept the claim. The general dishonesty of the author lowers the prior probability that any given statement is true, but the specific condition that the claim runs against his interest drastically alters the explanatory balance. For the source to lie against his own interest requires a complex hypothesis of motive, perhaps a hidden agenda or a desire to deceive future readers in a subtle way, whereas the hypothesis that he is telling the truth requires no additional machinery. The truth of the claim is the simplest explanation for why a man would assert something damaging to himself, even if he is a liar in other contexts where lying serves him. The principle dictates that the specific evidence of contrary interest outweighs the general evidence of dishonesty, because the cost of fabricating a self-harming lie is higher than the cost of reluctant truth-telling.

  However, a principle without cost is a dogma, and you asked for a plain account of which verdict it cannot accommodate. You must surrender your intuition regarding Thucydides. Your principle relies on the assumption that the source is attempting to report what happened, such that the truth of the event is a competing explanation for the text's existence against the explanation of error or bias. Thucydides explicitly removes himself from this competition by admitting he composed the speeches to suit the occasion as he judged best. The simplest explanation for the existence of those words is not that the speakers said them, but that Thucydides wrote them to represent what was appropriate. To maintain your verdict that these speeches are not lowered in estimation relative to his narrative, you must shift the claim from what was said to what was appropriate, but if you treat them as evidence of the specific arguments made, the principle forces you to reject them as factual reports. The text itself provides the explanation for its own fabrication, making the hypothesis that the words were spoken unnecessary to explain the source. You may argue that they reveal the shape of the conflict, much like the oral material you trust for shape but not names, but you cannot hold them to the same standard of verbal fidelity as the narrative without violating the rule of explanatory economy. This is the price of the principle, but it is a small one to pay for a tool that resolves the tension between the routine and the extraordinary without requiring you to pretend your priors are not doing the work they were designed to do.

  Yours sincerely,

  A Fellow Historian
