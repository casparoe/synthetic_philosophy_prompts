      *   **Audience:** Clinical Ethics Committee (mid-sized academic medical center), specifically a hospitalist member drafting a background paper.
      *   **Task:** Reconstruct the implicit philosophical theory behind a specific 5-feature policy bundle regarding advance directives (ADs). Do *not* evaluate if it's good, but explain *what must be true* for it to make sense.
      *   **Key Features to Analyze:**
          1.  Refusals bind, requests do not (asymmetry).
          2.  Contemporaneous objection revokes (unless specific high-bar clause exists).
          3.  High evidential bar (clear and convincing).
          4.  Fixed sequence: Substituted judgment (counterfactual choice) > Best interests.
          5.  Dementia vs. Psychiatry asymmetry (Past values > Present contentment in dementia; Present will > Past directive in acute psych).
      *   **Specific Questions to Answer:**
          *   Authority across time (Personal identity vs. weaker claims).
          *   Reconciling the Dementia clause (Past > Present) vs. Revocation clause (Present > Past).
          *   Refusal/Request asymmetry (Will extension vs. Harm avoidance).
          *   Substituted Judgment presuppositions (Determinacy of counterfactuals).
          *   Sorting: Entailed vs. Consistent vs. Underdetermined for each feature.
          *   Flag inconsistencies vs. unarticulated distinctions.
          *   Implications of switching to Time-Relative Interest Account (TRIA) or Present Welfare Account.
      *   **Constraints:** American English, define technical terms in-clause, reasoning over references, no bibliography.

  2.  **Deconstruct the Policy Bundle (The "Data"):**
      *   *Feature 1 (Asymmetry):* Refusals = Veto (Negative Right). Requests = Petition (Positive Right).
      *   *Feature 2 (Revocation):* Current behavior trumps past writing *unless* the past writing was super-robust (Ulysses contract style). Default = Present self wins.
      *   *Feature 3 (Evidence):* High bar. Prevents speculation. Prioritizes formalized intent over loose memory.
      *   *Feature 4 (Sequence):* Autonomy (what they would choose) > Beneficence (what is good for them).
      *   *Feature 5 (Dementia/Psych):* Dementia = Past Self wins (unless capacity returns). Psych = Present Self wins (even without capacity).

  3.  **Reconstruct the Implicit Theory:**
      *   *Core Principle:* **Critical Interest Autonomy with a Presumption of Continuity.**
      *   *Authority Across Time:* The policy assumes the "Past Self" and "Present Self" are the *same moral agent* sufficiently to bind, *but* only if the Present Self doesn't actively object. It's not a strong metaphysical identity claim (Lockean memory, etc.), but rather a **legal-moral agency claim**. The Past Self owns the body's future trajectory *by default*, but the Present Self retains a "veto power" based on immediate distress/objection.
      *   *The Tension (Dementia vs. Revocation):*
          *   Dementia Clause: Past values > Present contentment. Why? Because dementia is viewed as a *corruption* of the self. The "happy demented patient" is not truly autonomous; their contentment is pathological.
          *   Revocation Clause: Present objection > Past directive. Why? Because immediate resistance is treated as a signal of *current* suffering or a reassertion of agency that cannot be ignored without battery.
          *   *Reconciliation:* The distinction lies in **Capacity to Dissent vs. Capacity to Consent.** The policy treats *objection* (pushing away) as a lower-threshold signal than *affirmation* (requesting). In dementia, contentment isn't a "choice," it's a state. In psych, revocation is treated as an expression of will, even if impaired, because psych conditions are viewed as potentially reversible or distinct from the "core self" erosion of dementia. *Wait, looking closer:* The prompt says in Psych, a patient in an acute episode may revoke *even when plainly lacking capacity*. In Dementia, past values win *unless* contentment comes with capacity.
          *   *The Real Distinction:* It's not about capacity. It's about the **Nature of the Condition.** Dementia is chronic/degenerative (Past Self is the "real" owner). Psych is acute/episodic (Present Self is the "real" owner waiting to return). The policy assumes the Psych patient's *true* self aligns with the revocation (or will return to align), whereas the Dementia patient's *true* self is the one who wrote the directive.
          *   *Actually, a better fit:* The policy relies on a **Negative Liberty Priority.** You can stop harm to yourself (refusal/revocation) easier than you can demand harm be done to you (request). The Revocation clause treats resistance as a refusal of *current* treatment. The Dementia clause treats the directive as a refusal of *future* states.
          *   *Refining the Theory:* The theory is **Anti-Paternalism regarding Harm, Paternalism regarding Benefit.** We won't force treatment on a resisting person (Revocation), but we won't force a "bad life" on a demented person even if they like it (Dementia).
      *   *Refusal/Request Asymmetry:* This tracks the **Harm Principle.** Forcing treatment violates bodily integrity (a harm). Withholding requested treatment is a failure of beneficence (not a direct harm). The policy prioritizes avoiding battery over ensuring benefit.
      *   *Substituted Judgment:* Assumes a **Determinate Will.** It assumes there is a fact of the matter about "what I would choose," even if I am gone. If I have changed radically, this assumption fails (the "Truth Value Gap"). The policy ignores this gap by prioritizing the *written* word as the only valid proxy for that fact.

  4.  **Drafting the Sections:**

      *   **Introduction:** Acknowledge the task (reconstruction, not evaluation).
      *   **Authority Across Time:** Address the Personal Identity question. Does it require strict identity? No, it requires **Normative Continuity.** The Past Self has a property right in the body's future, limited by the Present Self's right against assault.
      *   **The Tensions (Dementia vs. Revocation):** How to reconcile? The distinction is **Expression of Will vs. State of Being.** Pushing away a tube is an act of will (revocation). Smiling in dementia is a state of being (contentment). The policy privileges *acts of refusal* over *states of satisfaction*. Also, the Psych vs. Dementia split relies on a **Prognosis of Recovery** assumption (Psych = reversible, Dementia = irreversible).
      *   **Refusal/Request Asymmetry:** This is about **Negative vs. Positive Rights.** Refusal is a shield; Request is a sword. The policy assumes the moral weight of avoiding battery outweighs the moral weight of providing benefit.
      *   **Substituted Judgment:** Assumes the **Metaphysics of a Stable Self.** It assumes the "I" then and the "I" now are continuous enough that counterfactuals have truth values. In severe dementia, this is a fiction the policy enforces for legal safety.
      *   **Sorting the Features (Entailed/Consistent/Underdetermined):**
          1.  Refusal/Request: Entailed by Negative Liberty priority.
          2.  Revocation: Consistent, but the high bar for non-revocation is underdetermined (could be lower).
          3.  Evidence: Consistent with legal risk management, not strictly entailed by autonomy.
          4.  Sequence: Entailed by Autonomy > Beneficence hierarchy.
          5.  Dementia/Psych: Inconsistent tension. Requires the "Reversibility" distinction to hold.
      *   **Alternative Theories:**
          *   *Time-Relative Interest Account (TRIA):* Authority decays as psychological connection fades. *Changes:* Dementia clause flips (Present contentment wins). Revocation clause stays. Substituted judgment becomes impossible (shift to Best Interests).
          *   *Present Welfare Account:* Authority rests on current well-being. *Changes:* ADs become advisory only. Refusal/Request asymmetry vanishes (both judged by welfare). Revocation stays (resistance indicates harm).

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I define technical terms? (e.g., "Negative Liberty," "Substituted Judgment," "Time-Relative Interest").
      *   *Check:* Did I answer the specific question about the "same person" metaphysics? *Correction:* Make sure to clarify that the policy doesn't need *metaphysical* identity, just *moral* authority derived from prior competence.
      *   *Check:* The Psych vs. Dementia tension is the trickiest part. The prompt says Psych patients can revoke *even without capacity*. Dementia patients cannot override based on contentment *unless* they have capacity. This is a stark contradiction if based on capacity. It must be based on the **Nature of the Objection.** In Psych, the objection is verbal/active ("I want to go home"). In Dementia, the "objection" is merely a lack of distress. The policy treats active resistance as a universal veto (safety/battery), whereas passive contentment is not a valid consent.
      *   *Wait, re-reading Feature 2:* "Contemporaneous objection revokes... unless... non-revocation clause." This applies generally.
      *   *Re-reading Feature 5:* Dementia = Past values win over present contentment. Psych = Directive overridden if contraindicated, patient can revoke at will even without capacity.
      *   *The Conflict:* In Dementia, if I push away the tube (objection), Feature 2 says I revoke. But Feature 5 says my contentment doesn't matter. So, if I am demented and push away the tube, do I revoke? Feature 2 says yes. Feature 5 says my values win. *Resolution:* Feature 5 likely refers to *quality of life* judgments, whereas Feature 2 refers to *physical resistance*. The policy distinguishes between **Physical Resistance** (universal veto) and **Evaluative Stance** (Past wins in dementia, Present wins in psych).
      *   *Wait, Feature 2 says:* "when a patient... resists — pushing away a feeding tube... treat that as a revocation." This seems to override Feature 5. *Unless* Feature 5 implies that in dementia, we ignore the resistance unless the high-bar clause exists? No, Feature 2 says "In practice fewer than one in fifty has that clause." So usually, resistance = revocation.
      *   *So the tension is:* Feature 5 says Past Values > Present Contentment. Feature 2 says Present Resistance > Past Directive.
      *   *Reconciliation:* "Contentment" is not "Resistance." You can be content but still resist a tube? Unlikely. Usually, resistance implies distress. The distinction is **Active Dissent vs. Passive Satisfaction.** The policy allows a demented patient to stop treatment by fighting (Feature 2), but does not allow them to *continue* living a "undignified" life just because they are happy (Feature 5 prevents family from demanding cessation based on current happiness if the AD said "keep me alive").
      *   *Actually, looking closer at Feature 5:* "values expressed... take precedence over the patient's present apparent contentment." This means Family can't say "She's happy, let's stop the feeding tube" if the AD said "Keep me alive."
      *   *Feature 2:* Patient pushes tube -> Stop.
