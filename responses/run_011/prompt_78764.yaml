answer: |-
  **Background Paper: Reconstructing the Implicit Theory of Our Advance Directive Policy**

  **To:** Clinical Ethics Committee
  **From:** [Your Name], Hospitalist Member
  **Subject:** Philosophical Reconstruction of the Draft AD Policy Bundle

  **Introduction**
  The committee has asked for an articulation of the view of the patient that underlies our current draft policy. We have operated on these rules for twenty years without explicitly stating what they assume about personhood, authority, and time. The following analysis does not evaluate whether the policy is morally good; rather, it reconstructs the logical commitments required to make the five features of the draft cohere. Where the policy is silent, I have inferred the minimum philosophical commitment necessary to sustain the rule.

  **1. Authority Across Time: The Moral Status of the Past Self**
  The fundamental question is why a signature from five years ago should bind a body today. For our policy to function, we do not need to assume that the "Past Self" (the signer) and the "Present Self" (the patient) are metaphysically identical in a strong sense, such as sharing the same memories or personality traits. If we required strict psychological continuity, almost all dementia cases would invalidate the directive immediately.

  Instead, the policy relies on a theory of **Normative Continuity**. This view holds that a competent adult acquires a property-like right over their future body, which functions as a standing order. The authority of the Past Self is not based on being the "same person" in a psychological sense, but on being the last competent agent to hold **Sovereign Authority** (the right to rule) over that body. The Past Self is treated as the legal and moral owner of the body's trajectory. The Present Self, if incapacitated, is treated as a beneficiary or a ward of that prior ownership, not as a new owner. This licenses the rule that prior refusals bind: the owner has set the terms of use, and the current occupants (clinicians and surrogates) must respect those terms.

  **2. Reconciling the Tensions: Dementia vs. Revocation**
  There appears to be a contradiction between the Dementia Clause (Feature 5) and the Revocation Clause (Feature 2).
  *   **The Dementia Clause** assumes the Past Self's evaluative commitments outweigh the Present Self's apparent contentment.
  *   **The Revocation Clause** assumes the Present Self's physical objection overrides the Past Self's written directive.

  One theory can generate both, but it requires a distinction the draft does not state: the difference between **Active Dissent** and **Passive Satisfaction**.
  The policy treats physical resistance (pushing away a tube) as an exercise of **Negative Liberty** (freedom from interference). This is a low-threshold right; even a incapacitated person retains the right not to be physically assaulted. Therefore, active resistance triggers a revocation because proceeding would constitute battery. However, "apparent contentment" in dementia is treated as a **State of Being**, not an exercise of agency. A smiling patient is not necessarily *choosing* their condition; they are merely experiencing it. The policy assumes the Past Self has the authority to define which *states of being* are acceptable, but not the authority to authorize physical force against a resisting body.

  The tension between the Psychiatric Track and the Dementia Track (Feature 5) relies on a **Prognosis of Recovery** distinction. In acute psychiatry, the policy assumes the current impairment is episodic and the "True Self" will return; thus, honoring a revocation respects the returning agent. In progressive dementia, the policy assumes the impairment is permanent and the "True Self" is the one who existed before the decline. This is a metaphysical gamble: it assumes the demented patient is a *different* moral agent than the signer, whereas the psychiatric patient is the *same* moral agent temporarily obscured.

  **3. The Refusal/Request Asymmetry**
  Feature 1 states that refusals bind absolutely, while requests are advisory. This is not an inconsistency; it is a principled commitment to the **Harm Principle**.
  *   **Refusal:** Honoring a refusal prevents a harm (battery or unwanted bodily invasion). The moral cost of violating a refusal is high and direct.
  *   **Request:** Honoring a request provides a benefit. The moral cost of denying a request is a failure of beneficence, which is weighted lower than the duty to avoid harm.

  This asymmetry reveals that the policy is not purely tracking the "extension of the patient's will." If it were, a request for life-saving treatment would bind as tightly as a refusal. Instead, the policy prioritizes **Non-Maleficence** (do no harm) over **Autonomy** when the two conflict with clinical judgment. The policy assumes clinicians are guardians against harm (yours and theirs), but not mere technicians obligated to fulfill every desire.

  **4. Substituted Judgment and the Truth Value Gap**
  Feature 4 mandates Substituted Judgment (answering "what would the patient choose?") before Best Interests. This presupposes that there is a **Determinant Will**. It assumes that for any medical decision, there is a fact of the matter about what the patient would have decided, even if they cannot speak.

  In cases of severe dementia where the patient's personality has radically changed, this assumption encounters a **Truth Value Gap**. If the Past Self loved opera and the Present Self loves only cartoons, there may be no single answer to "what would the patient choose?" because the "patient" is no longer a unified entity. The policy silently resolves this by privileging the *written* word as the only objective evidence of that will. It assumes that when psychological continuity breaks, the *document* becomes the person. This is a legal fiction necessary to make Substituted Judgment possible in the absence of a coherent psychological self.

  **5. Sorting the Features: Entailment and Choice**
  For each feature, I have categorized whether it is strictly required by the reconstructed theory (Entailed), fits within it but could be otherwise (Consistent), or is compatible with rival theories (Underdetermined).

  *   **Feature 1 (Refusal Binds/Request Does Not):** **Entailed.** This follows directly from the priority of Negative Liberty and the Harm Principle. To make requests binding would require a theory of "Positive Rights to Treatment" which contradicts the clinical judgment override.
  *   **Feature 2 (Contemporaneous Objection Revokes):** **Consistent.** The theory of Normative Continuity allows the Past Self to bind the future, but it does not *require* that physical resistance be a revocation. We could theoretically restrain a resisting patient to honor a prior directive (as some jurisdictions allow with high-bar clauses). The choice to prioritize immediate resistance is a policy choice to avoid battery, not a logical necessity of advance directives.
  *   **Feature 3 (High Evidential Bar):** **Underdetermined.** This is compatible with several theories. A "Present Welfare" theory could also demand high evidence to prevent family conflict. This clause is driven more by legal risk management than philosophical necessity. The committee has a real choice here to lower the bar to "preponderance of evidence" without breaking the ethical framework.
  *   **Feature 4 (Sequence: Substituted Judgment > Best Interests):** **Entailed.** This is the definition of an Autonomy-Based framework. If we switched to a Welfare-Based framework, this sequence would invert.
  *   **Feature 5 (Dementia vs. Psych Asymmetry):** **Underdetermined / Inconsistent.** This is the weakest link. The distinction relies on a medical prognosis (reversibility) rather than a consistent ethical principle. It is compatible with a "True Self" theory, but creates a genuine inconsistency in how we treat incapacity. The committee has a choice: either align psychiatry with dementia (past values win) or dementia with psychiatry (current welfare/objection wins).

  **6. Implications of Alternative Theories**
  If the committee wishes to amend rather than rewrite, it is vital to know which clauses depend on our current "Normative Continuity" view.

  **Scenario A: Switching to a Time-Relative Interest Account (TRIA)**
  *   *Theory:* The authority of the Past Self decays as the psychological connection to the Present Self fades. The "demented self" has its own interests that matter more than the "past self's" instructions.
  *   *Required Changes:*
      *   **Feature 5 (Dementia):** Must flip. Present contentment would outweigh past values. We could not force treatment on a happy demented patient if they previously refused it.
      *   **Feature 4 (Sequence):** Substituted Judgment becomes impossible when psychological connection is lost. The default must shift to Best Interests for severe dementia.
      *   **Feature 1 (Asymmetry):** Could remain, as bodily integrity still matters, but the weight of a past refusal would diminish over time.
  *   *Keepable:* Feature 2 (Revocation) and Feature 3 (Evidence).

  **Scenario B: Switching to a Present Welfare Account**
  *   *Theory:* Authority rests entirely on what is good for the patient *now*. Advance directives are merely evidence of what might make the patient happy, not binding orders.
  *   *Required Changes:*
      *   **Feature 1 (Asymmetry):** Collapses. Both refusals and requests would be judged by whether they benefit the patient. A past refusal could be overridden if treatment is clearly beneficial.
      *   **Feature 4 (Sequence):** Inverted. Best Interests becomes the primary standard; Substituted Judgment is only used if it aligns with welfare.
      *   **Feature 5 (Psych/Dementia):** Unified. Both tracks would prioritize current clinical assessment of well-being over past documents.
  *   *Keepable:* Feature 2 (Revocation). Even on a welfare account, physically restraining a resisting patient is usually contrary to welfare (causes distress). Feature 3 (Evidence) could remain as a safeguard against fraudulent claims of welfare.

  **Conclusion**
  Our current policy bundle is not a random collection of rules; it is a coherent system based on **Normative Continuity** and the **Priority of Negative Liberty**. It assumes the Past Self owns the future body, provided the Present Self does not physically fight back. The genuine tension lies in Feature 5 (Psych vs. Dementia), which relies on a medical distinction (reversibility) to solve a philosophical problem (identity). If the committee wishes to maintain the current system, we must accept that we are prioritizing the "Biographical Life" (the story the patient wrote) over the "Biological Life" (the experience the patient is having), except when the Biological Life actively resists. If we wish to move toward a model that prioritizes the experience of the demented patient, we must abandon the binding nature of refusals in Feature 1 and the sequence in Feature 4.
