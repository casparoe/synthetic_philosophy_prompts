answer: |-
  Here are the desiderata for a usable theory of archival silence, distinguished by what is required for methodological rigor and what belongs to specific historiographical camps.

  ### The Desiderata

  **1. The Causal Discrimination Criterion (Non-Negotiable)**
  *   **Requirement:** The theory must provide a heuristic for distinguishing *structural silence* (produced by power) from *stochastic loss* (produced by chance/entropy).
  *   **Consideration:** It must handle the **fire/war case**. If a record is missing because a bomb hit the repository, the theory must allow you to say "this means nothing," otherwise every gap becomes a conspiracy. Conversely, it must handle the **police file case**, where the abundance of records is the silencing mechanism (noise drowning out signal); here, the theory must identify "presence as obfuscation" without claiming the documents are fake.

  **2. The Modality Distinction (Non-Negotiable)**
  *   **Requirement:** The theory must never collapse the distinctions between *never-created*, *created-and-destroyed*, *created-and-withheld*, and *created-and-unfindable*.
  *   **Consideration:** Each modality implies a different vector of power. A **never-created** record suggests the subject was beneath notice; a **withheld** record suggests the subject was a threat. Conflating them leads to false conclusions about intent. This also covers the **privacy case**: a record withheld for duty-of-care is structurally different from one withheld for state security, even if the result (inaccessibility) is identical.

  **3. The Access/Existence Decoupling (Non-Negotiable)**
  *   **Requirement:** The theory must treat *ontological absence* (the record does not exist) and *epistemological inaccessibility* (the record exists but cannot be found/read) as distinct categories.
  *   **Consideration:** This addresses the **digitization and cataloging cases**. If a file is box-bound and mis-catalogued under a slur, it is ontologically present but epistemologically silent. A theory that treats this the same as a destroyed file ignores the economic and linguistic labor that maintains the silence.

  **4. Intersubjective Stability (Non-Negotiable)**
  *   **Requirement:** Two trained historians applying the theory to the same gap must be able to agree on the *classification* of the silence, even if they disagree on the *interpretation*.
  *   **Consideration:** This is what you owe the **hostile reader**. If your method relies entirely on intuition, it is literature, not methodology. They need to see the steps: "We agree this is a 'created-and-withheld' silence; we disagree on whether that implies malice or incompetence."

  **5. Normative Transparency (Non-Negotiable)**
  *   **Requirement:** The theory must explicitly flag where evidential reasoning ends and ethical commitment begins.
  *   **Consideration:** This addresses the **oral history case**. Deciding to privilege a memoir written forty years later over a missing contemporary file is a value judgment about the nature of truth (lived experience vs. administrative contemporaneity). The theory must not disguise this ethical choice as an evidential discovery.

  **6. The Imperative to Reconstruct (Camp Preference)**
  *   **Requirement:** *Optional.* Some camps demand the historian *must* fill the silence (critical fabulation); others demand the silence *must remain* a testament to loss.
  *   **Consideration:** This is not a methodological necessity but an ethical stance. A usable theory should allow you to diagnose the silence without forcing you to write fiction to resolve it.

  **7. The Universality of Power (Camp Preference)**
  *   **Requirement:** *Optional.* Some camps demand *all* silence is political; others allow for bureaucratic indifference.
  *   **Consideration:** Insisting that every missing file is an act of oppression risks the "significance in missing paperwork" critique. Allowing for banality protects the theory from over-reading, but risks under-reading systemic bias.

  ***

  ### The Tension Analysis

  **Are any pairs jointly unsatisfiable?**
  Your suspicion is correct, but the conflict is manageable. The tension lies between **Causal Discrimination** (Req 1) and **The Universality of Power** (Pref 7). If you claim *all* silence is a production of power, you cannot satisfy the requirement to identify gaps that "mean nothing at all" (the fire case). To make the theory usable, you must sacrifice the strong claim that *all* silence is meaningful. You can maintain that *archival systems* are power structures, but you must admit that *specific absences* within them can be accidental. If you do not make this concession, the theory becomes unfalsifiable and fails the **Intersubjective Stability** test.

  **The Single Hardest Requirement:**
  **Causal Discrimination (Req 1)** does the most work knocking out candidates. It is easy to say "silence is power"; it is incredibly difficult to provide a reproducible standard for deciding when a silence is *not* power. Most theories fail here because they lack a baseline for "normal" record attrition against which "suspicious" attrition can be measured.

  ***

  ### Evaluation of Existing Accounts

  **1. The Archive as Power (e.g., Foucault, Stoler, Trouillot)**
  This account excels at identifying how archival systems produce subjects and enforce silence through classification and retention, handling the **cataloging and police file cases** well. However, it often struggles with **Causal Discrimination**, tending to read systemic power into accidental losses (the **fire case**) and risking the unfalsifiability that invites skeptic critique.

  **2. Imaginative Reconstruction (e.g., Hartman, Saidiya)**
  This approach treats the silence as an ethical demand to speculate on the undocumented life, effectively addressing the **oral history and privacy cases** by centering the subject's humanity over the archive's logic. It fails the **Intersubjective Stability** requirement, however, as the reconstruction relies on the historian's narrative intuition, making it difficult for two researchers to verify the same conclusion from the same gap.

  **3. Plain Evidentialism (Positivist)**
  This account maintains rigorous **Intersubjective Stability** by refusing to draw conclusions from missing data, successfully dismissing **stochastic loss** as meaningless. It collapses the **Modality Distinction**, however, treating a **withheld** file the same as a **never-created** one, thereby rendering it blind to the specific power dynamics that produce structural silence.
