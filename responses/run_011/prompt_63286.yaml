answer: |-
  ### 1. Mapping the Analogy

  To audit the argument, we must first formalize the structural correspondence between the source case (voting) and the target case (individual emission reduction).

  | Feature | Source Case (Voting) | Target Case (Emission Reduction) |
  | :--- | :--- | :--- |
  | **The Act** | Casting a ballot. | Reducing personal carbon footprint (e.g., not flying). |
  | **The Tally** | Vote count. | Aggregate global emissions / Atmospheric concentration. |
  | **The Threshold** | Winning margin (e.g., plurality or majority). | Climate tipping points / Harm thresholds (e.g., 1.5°C). |
  | **The Electorate** | Registered voters in a constituency. | Global emitters (or citizens of a high-emitting nation). |
  | **The Alternative** | The losing candidate/policy. | Unmitigated climate change / Specific climate harms. |
  | **The Duty** | Duty to vote (civic participation). | Duty to reduce emissions (moral obligation). |
  | **The Objection** | "My vote won't change the outcome." | "My emissions won't change the climate." |

  ### 2. Load-Bearing Disanalogies

  Many differences between voting and emitting are decorative (e.g., the secrecy of the ballot vs. the visibility of consumption). Three disanalogies, however, are load-bearing for the ethical argument.

  **A. The Mechanism of Aggregation (Determinacy vs. Opacity)**
  Elections are designed to be countable. The threshold is public, and the tally is exact. Climate systems are opaque. We do not know exactly where the tipping points lie, nor how many tons of CO₂ correspond to a specific harm event.
  *   *Significance:* This makes the *probability* of efficacy harder to calculate in the climate case. However, it does not make the probability zero. In fact, as discussed below, it may make the expected utility higher.

  **B. The Grounds of the Duty (Fairness vs. Harm)**
  The duty to vote is rarely grounded in the *consequences* of the vote (since the probability of decisiveness is $\approx 0$). It is grounded in **fair play** (doing one's part in a cooperative scheme) and **expression** (affirming democratic values). The duty to reduce emissions is traditionally grounded in **harm prevention** (not contributing to suffering).
  *   *Significance:* If the inefficacy objection holds, the *harm* ground collapses. The voting analogy only saves the duty if we shift the grounding of climate action from "preventing harm" to "fairness/complicity." If you cannot prove you prevent harm, you must prove you are not free-riding on the sacrifices of others or complicit in a harmful system.

  **C. The Cost of Compliance**
  Voting is low-cost (time, effort). Radical emission reduction is high-cost (inconvenience, financial expense, social capital).
  *   *Significance:* Moral duties are often sensitive to cost. A duty to vote is plausible *because* it is cheap. A duty to forego long-haul flights is harder to sustain if the causal benefit is equally negligible. This raises the bar for the non-causal grounds (integrity/complicity) to do more work.

  ### 3. The Reversal: Is the Market More Hospitable Than the Ballot?

  There is a critical disanalogy that runs *against* the inefficacy objector and strengthens the analogy's user. This is the **Expected Utility** argument (championed by philosophers like Julia Nefsky and Alastair Norcross).

  *   **Elections:** To be decisive, a vote must break an exact tie. In large electorates, this probability is vanishingly small ($1/N$).
  *   **Markets:** Production and supply chains operate on thresholds (containers, flight loads, bulk orders). While you do not know *where* the threshold is, your purchase has a non-zero probability of triggering a reorder. If a flight requires 100 passengers to schedule, and you are the 100th, you trigger the emissions of the whole plane.
  *   **The Math:** If there is a $1/1000$ chance your ticket purchase triggers a flight that emits 100 tons of CO₂, your *expected* emission is 0.1 tons. This is causally significant.
  *   **Verdict:** The market case is structurally *more* hospitable to individual difference-making than the ballot. Elections are binary and rigid; markets are lumpy and probabilistic. If the duty to vote survives the near-zero probability of decisiveness, the duty to reduce emissions survives even more easily, because the expected causal impact of consumer choices is generally higher than that of a single vote.

  ### 4. Scrutiny of the "Cup of Water" Image

  The "cup of water" image is scientifically and philosophically inferior to the voting analogy and should be discarded in your seminar.

  1.  **Scientific Falsehood:** A cup of water *does* raise the sea level. It is not that the sea is "not raised by any amount"; it is that the rise is not *detectable* by human instruments. Physics is not sensitive to human detection limits.
  2.  **The Parfitian Point:** As you noted, this ignores Derek Parfit's argument in *Reasons and Persons*. In the "Harmless Torturers" case, each torturer adds a tiny shock that is imperceptible to the victim, but the aggregate causes agony. Parfit argues that contributing to an imperceptible harm is still contributing to harm. The moral wrongness attaches to the *contribution*, not the *perceptibility*.
  3.  **Verdict:** The image relies on an equivocation between "no *detectable* difference" and "no *actual* difference." It fails.

  ### 5. Residual Groundings: Rescue or Change of Subject?

  If we abandon the strict causal-harm argument (because of aggregation opacity) and rely on the voting analogy, we are left with non-causal groundings: **complicity, integrity, and norm-signaling.**

  *   **Complicity:** By emitting, one participates in a structure known to cause harm, even if one's specific contribution is untraceable.
  *   **Integrity:** One aligns one's actions with one's values (avoiding hypocrisy).
  *   **Signaling:** Individual acts shift social norms, making policy change more likely (the "cascade" effect).

  **Is this a rescue or a change of subject?**
  It is a **rescue of the norm, but a shift in justification.** The practical recommendation (fly less) remains identical. However, the *reason* changes from "you will stop the ice from melting" to "you must not be complicit in the melting."
  For your students, this is a crucial distinction. If you argue for emission reduction based solely on causal efficacy, the inefficacy objection is a serious threat (despite the expected utility counter). If you argue based on complicity and integrity, the inefficacy objection is irrelevant. The voting analogy bridges this by showing that we accept duties in low-efficacy contexts when those duties are rooted in participation and fairness.

  ### 6. Final Verdict

  **The voting analogy holds, but not in the way your colleague intended.**

  1.  **Does the analogy defeat the inefficacy objection?** **Yes.** It demonstrates that we routinely accept moral duties in contexts where individual causal efficacy is negligible (voting, recycling, unionizing). If inefficacy killed moral duty, democracy would be morally optional.
  2.  **Do emission-reduction duties exist on the *same grounds* as the duty to vote?** **Mostly No, but functionally Yes.** The duty to vote is grounded in fairness and expression. The duty to reduce emissions is grounded in harm prevention. *However*, because the harm prevention ground is vulnerable to the inefficacy objection, the duty to reduce emissions *must* be bolstered by the same grounds as voting (fairness/complicity) to remain robust. The analogy forces us to admit that climate ethics cannot rely solely on direct causal impact.
  3.  **Does the colleague's conclusion survive (exclusive institutional focus)?** **No.** The voting analogy proves that individual and institutional duties are complementary, not mutually exclusive. We have a duty to vote *and* a duty to support good policy. Similarly, we have a duty to reduce emissions *and* a duty to advocate for systemic change. To argue for the latter while denying the former is to commit the "perfect solution fallacy."
  4.  **The "Cup of Water" Image:** **Discard it.** It is scientifically inaccurate and morally confused regarding imperceptible harms.
  5.  **Better Analogy:** Use the **"Probabilistic Trigger"** model (the flight seat example) rather than the voting model for causal arguments, and reserve the **Voting Model** for arguments about civic duty and complicity.

  **Recommendation for the Seminar:**
  Tell your students that the inefficacy objection fails for two distinct reasons. First, on causal grounds: markets are probabilistic thresholds, not continuous oceans, meaning individual acts have *expected* value (unlike votes). Second, on non-causal grounds: even if causal impact were zero, the duty to avoid complicity in a harmful collective project remains, just as the duty to vote remains despite the near-zero chance of decisiveness. The "cup of water" image is a rhetorical distraction; the real question is whether we have a duty to keep our hands clean in a dirty system. The voting analogy confirms that we do.
