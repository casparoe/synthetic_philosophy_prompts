      *   (5) Substitutability principle: If names differ, they can't be true of the same things (because they aren't interchangeable in all contexts). Example: "Lead out a horse" vs. "Lead out a white horse."
      *   (6) Conclusion: White horse is not a horse.
      *   (7) Generalization: Applies to all modified nouns (red apple, etc.).
      *   (8) Iteration/Downward spiral: Specificity increases (this mare, this stall, this hour).
      *   (9) Radical Nominalism/Skepticism: Nothing answers to any name except a name answering only to itself. (Ineffability of particulars).
      *   (10) Self-Reference: The argument itself uses names.
      *   (11) Reductio: Argument destroys itself.

      *   *Narrator's Stance:* Accepts (9). (10) just shows language is loose.
      *   *User's Stance:* Wants a breakable chain where the cost of mending is felt.

  3.  **Diagnose the Flaw:**
      *   The classic philosophical rebuttal to Gongsun Long usually targets the ambiguity of "is" (identity vs. predication vs. class membership) or the criteria for identity.
      *   Step (5) is the heavy lifter. It moves from "Names have different intensions (meanings)" to "Names cannot be true of the same things (extensions)."
      *   *The Mistake:* Confusing *synonymy* with *co-extensiveness*. Just because "Morning Star" and "Evening Star" mean different things (lay down different conditions), it doesn't mean they can't refer to the same object (Venus).
      *   *Why it looked innocent:* In natural language, we often treat interchangeability *salva veritate* (preserving truth) as a test for identity. If I can't swap them in *every* context (especially intensional contexts like "wants a horse"), they feel different. But step (5) claims they can't be true of the same things *at all*, which is too strong.
      *   *Alternative Diagnosis:* Step (1). It sets up a rigid verificationist/intensionalist criterion for truth that ignores how predication works. "X is a Y" doesn't require X to satisfy *only* the definition of Y, but to satisfy the *necessary conditions* of Y.
      *   *Decision:* Step (5) is the most dramatic break point for a novel. It involves the logic of substitution, which feels intuitive (if words mean different things, they aren't the same) but fails logically. However, Step (1) is the foundational axiom. If (1) goes, the whole intensionalist project collapses.
      *   *Refinement:* The most precise error is in the move from (4) to (5). Specifically, the inference that *difference in intension* entails *disjoint extension*. This is the "Intension/Extension Confusion."
      *   *Wait, looking closer at (5):* "Names that do not lay down the same thing cannot be true of the same things, since if they were, they could be exchanged for one another wherever either occurs." This is the Leibniz Law (Indiscernibility of Identicals) applied to *names* rather than *objects*, and applied to *intensional contexts* to deny *extensional overlap*.
      *   *Best Diagnosis:* Step (5) commits a modal/intensional fallacy. It conflates "is" (predication/class inclusion) with "is" (identity). A white horse *is* a horse (class inclusion). It is not *identical to the concept* of horse.
      *   *Wait, looking at (9):* The iteration in (8) leading to (9) relies on the idea that adding *any* determination excludes the broader category. This is the "Sorites" or "Heap" problem inverted.
