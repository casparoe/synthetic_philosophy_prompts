  4.  **Price the Alternatives:**
      *   *Abandon (1):* Language becomes loose, pragmatic. Truth isn't about perfect matching of criteria. Cost: The narrator loses his metaphysical grip. Language is just a tool, not a mirror of reality.
      *   *Abandon (5):* Allow distinct names to apply to the same object. Cost: The "White Horse is Not a Horse" paradox dissolves into "White Horse is a subset of Horse." The narrator loses the shock value.
      *   *Embrace (9):* Radical particularism. Language is fundamentally false. Cost: Silence. The narrator becomes a mystic or a madman. (This is his current position).
      *   *Respectable Reading:* "White horse is not horse" is true if "is" means "is identical to the concept of." Or if it's about *demand conditions* (asking for a white horse is not the same demand as asking for a horse).

  5.  **Address the Classical Chinese "Mass Term" Hypothesis:**
      *   Scholar: A.C. Graham, Chad Hansen.
      *   Idea: Chinese nouns divide stuff, not count individuals. "Horse" is like "water." "White horse" is "white horse-stuff."
      *   Implication: "White horse is not horse" means "White horse-stuff is not (identical to) horse-stuff." This makes (6) plausible without collapsing into (9) immediately, because mass terms allow for overlap without identity.
