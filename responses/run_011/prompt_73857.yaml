answer: |-
  The tide table was nailed to the pilings of the waiting shed, ink faded by salt spray. Elara traced the line for the *Kestrel*. Inbound. Status: Unknown. There were two unknowns that mattered. The first was whether her brother, Tomas, was on the manifest. The second was whether the *Kestrel* would dock at the Inner Quay or anchor in the Outer Roads.

  The harbor master's office had issued the prior probabilities at dawn. Based on the season and the shipping logs, the likelihood of Tomas being aboard was one-half. Based on the tide height and the draft of the vessel, the likelihood of the Inner Channel was one-half. The two variables were assessed as independent. Whether Tomas was on the ship did not influence the tide; the tide did not influence the manifest.

  Elara sat on the wooden bench, her coat collar turned up against the damp. She held a betting slip from the Oracle's Office in her lap. She had paid three marks for it. The fee schedule was posted on the Oracle's brass plaque: *Conditionals priced by variance of antecedent.* A conditional statement where the antecedent was already known cost nothing. A conditional where the antecedent was certain falsehood was void. The highest premium was charged when the antecedent was evenly balanced, a coin flip. That was when the conditional did the most work. It could move the world without ever asserting a fact.

  She looked at the slip again. The Oracle's clerk had stamped it with the official seal, a circle bisected by a wavy line.

  *Given: Brother Aboard.*
  *Probability: Inner Channel = 3/4.*

  That was all. No assertion that Tomas was aboard. No assertion that the ship was coming Inner. Only a link between the two. If he was there, they were likely coming Inner. If he was not there, the slip said nothing.

  Elara took a pencil from her pocket and opened her ledger. She needed to know where this left her. She wrote down the priors. P(A) = 1/2. P(B) = 1/2. P(B|A) = 1/2. The new constraint was P*(B|A) = 3/4.

  She had been taught the standard adjustment in the merchant academy. You keep the probability of the antecedent fixed. You keep the probability of the consequent given the negation of the antecedent fixed. You minimize the disturbance. She ran the numbers in the margin.

  (3/4 × 1/2) + (1/2 × 1/2) = 3/8 + 2/8 = 5/8.

  Her unconditional credence in the Inner Channel had moved from one-half to five-eighths. Her credence in Tomas being aboard remained one-half. She had learned nothing about Tomas, yet her expectation of the ship's path had shifted. She was more likely to wait at the Inner Quay than the Outer, solely because of a relationship between two uncertainties, neither of which had been resolved.

  It felt like being pushed by a wind she couldn't feel.

  A bell rang in the harbor master's office adjacent to the shed. The hearing was starting. Elara tucked the slip into her ledger and went inside. She was not a party to the dispute, but the port allowed observers for cases involving conditional liability.

  Two men stood before the Harbor Master's desk. One was Vane, an underwriter. The other was Kress, a cargo holder. Between them lay a contract for insurance on perishable goods. The payout depended on the docking location. Inner Quay meant quick transport, low insurance. Outer Roads meant lighters, spoilage, high insurance.

  "The contract specifies payout based on reasonable expectation at the time of docking," Vane said. He tapped a stack of papers. "At dawn, the expectation was one-half. At noon, the Oracle issued a conditional. The standard adjustment moves the expectation to five-eighths. My client is liable for the Inner rate."

  Kress shook his head. "The Oracle told us nothing about the channel. It told us nothing about the cargo. It told us only about a correlation with a manifest we haven't seen. To change the premium based on a conditional is to charge for information we do not have."

  "The market prices the conditional," Vane countered. "The fee was three marks. The market acknowledges the shift."

  "The market prices leverage, not truth," Kress said. He turned to the Harbor Master. "Sir, the report bears on the relation between the man and the channel. It does not bear on the channel itself. If I tell you that if it rains the grass is wet, I have not told you it is raining. I have not told you the grass is wet. Why should the insurance rate change?"

  "Because the risk profile changes," Vane said. "If the brother is aboard, the captain favors the Inner. We know the brother is aboard with probability one-half. Therefore the captain favors the Inner with increased probability. The ship is more likely to be Inner than it was this morning. The risk is objectively different."

  "Objectively?" Kress laughed, a dry sound. "The tide is the same. The draft is the same. The only thing that changed is a piece of paper sold by a clerk who profits from uncertainty. There is another school of thought, Master. Some argue that if the report does not bear on B, the credence in B cannot move. It must stay at one-half. Others argue that if the informant chose to speak about A, the credence in A should move, not B. Perhaps the brother is less likely to be aboard, to compensate for the increased likelihood of the Inner channel. Your adjustment keeps the brother at one-half and moves the channel. Why privilege the channel?"

  The Harbor Master rubbed his temples. He was a man of tides and drafts, not epistemology. "Precedent," he said. "Case 44-B. The *Lysander*."

  "The *Lysander* was a categorical report," Kress said. "This is a conditional."

  "The adjustment stands," Vane said. "Five-eighths. The contract obliges you to use the standard update."

  "The contract obliges me to use reason," Kress snapped. "And reason says I have been moved, not informed."

  Elara watched the Harbor Master reach for his gavel. He looked at the Oracle's slip in Vane's hand, then at the tide table on the wall. The tide was turning. The *Kestrel* would be visible within the hour.

  "The office recognizes the standard adjustment," the Master said. "Liability is assessed at five-eighths."

  Kress did not argue further. He simply gathered his papers. "Then I will appeal to the High Court," he said. "They say the High Court is reviewing the ontology of conditionals."

  "Dismissed," the Master said.

  Elara slipped out before the gavel fell. The air outside was colder. The water in the harbor was gray, choppy. She walked to the edge of the pier where the path split. To the left, the Inner Quay, solid stone, easy access. To the right, the walkway to the Outer Roads, long and exposed to the wind.

  She looked at her ledger. The number 5/8 stared back at her. It was a clean number. It was the number the office used. It was the number that would win the argument in this room.

  But she thought of Kress's objection. *You have been moved, not informed.*

  If she went to the Inner Quay, she was betting on the channel. If she went to the Outer, she was betting against the update. If she stayed home, she was betting against Tomas.

  Her credence in Tomas was still one-half. The update had left that untouched. The Oracle's fee schedule was built on that stability. If the antecedent became certain, the conditional would be worthless. The Oracle needed her uncertainty about Tomas to sell her certainty about the channel. She was the fuel for the mechanism.

  She closed the ledger. The arithmetic was correct. The derivation was sound. The maximum entropy solution preserved the independence of the negation. It was the most conservative change possible given the constraint.

  And yet.

  She thought about the fee. Three marks. The cost of being moved. If she went to the Inner Quay, she was validating the Oracle's power. She was admitting that a relationship could shift reality without a fact. If she went to the Outer, she was asserting that the channel was independent of the brother until the brother was known.

  The wind picked up, smelling of brine and diesel. A whistle blew in the distance. The *Kestrel* was rounding the breakwater. She could not see which way it was turning.

  Elara put the ledger in her bag. She calculated the odds again, feeling the weight of the five-eighths. It was greater than half. It was a majority. It was a reason to move.

  She turned right, toward the Outer Roads.

  It was not a decision based on the number. It was a decision based on the feeling that if she stood on the Inner Quay and the ship came Outer, she would have been fooled by a formula. If she stood on the Outer and the ship came Inner, she had simply been wrong about the tide. She preferred the error of the tide to the error of the logic.

  She walked quickly, her boots clicking on the wet wood. She did not look back at the Inner Quay. She knew the probability was five-eighths. She knew she was acting against it. She told herself she was testing the objection, that she was gathering data on the reliability of the Oracle. But she knew she was just refusing to be moved by a wind she couldn't feel.

  At the end of the pier, she stopped. The ship was closer now. The hull was visible. She could not yet tell the channel. She stood on the Outer walkway, exposed to the spray, waiting for the categorical fact that would render the conditional void. She waited to see if the world would conform to the calculation, or if the calculation was just a tax on her waiting.
