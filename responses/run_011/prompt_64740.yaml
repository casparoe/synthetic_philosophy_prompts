answer: |-
  # Vetting Protocol for Bongard-Style Evaluation Suite

  ## 1. Design-Time Requirements on the Answer Key
  **Requirement:** The answer key must be a single declarative sentence under 25 words, devoid of logical connectives (e.g., "if and only if," "unless").
  **Necessity vs. Cluster:** The key must assert a **necessary-and-sufficient condition** for the class of drawings provided. Cluster concepts (family resemblance) are **rejected** unless the cluster can be reduced to a disjunction of at most two explicit features (e.g., "figures contain either a circle or a triangle").
  **Grading Implication:** A model answer is correct only if it is semantically equivalent to the key *and* does not rely on a feature ruled out by the Adversarial Audit (see Section 3).
  *   **[Human Decision]:** The Lead Coordinator determines semantic equivalence between the model's output and the key.
  *   **[Convention]:** The 25-word limit and disjunction cap are arbitrary constraints to enforce simplicity; they do not reflect the true complexity of intelligence.

  ## 2. Probe Drawing Requirement
  **Requirement:** Authors must submit a "Probe Pack" of six additional drawings not shown to the solver.
  **Enumeration of Rivals:** Rivals are not guessed. They are generated via the **Feature Negation Method**: for every feature mentioned in the key, draw a figure that has that feature but belongs to the opposite class, and vice versa.
  **Count:** Three probes supporting the key, three probes attempting to break it (false positives/negatives).
  **Coextensivity:** If a rival concept (e.g., "enclosed area" vs. "closed loop") cannot be distinguished by any drawable line figure within the tool's resolution, they are declared **Drawable-Equivalent**. The key must be amended to acknowledge the equivalence class (e.g., "closed loop / enclosed region").
  *   **[Human Decision]:** The Author decides which features are "salient" enough to require negation probes.
  *   **[Protocol Output]:** If a probe successfully falsifies the key on a drawable figure, the item is sent to **Revision**.

  ## 3. Adversarial Audit for Accidental Separators
  **Checklist:** Reviewers must inspect the twelve images for the following "Cheap Cues." If any cue perfectly separates Left from Right, it is flagged.
  1.  **Ink Density:** Does the Left side have visibly more/less black pixels?
  2.  **Bounding Box:** Do Left figures fit a square while Right require a rectangle?
  3.  **Vertex/Edge Count:** Is there a parity difference (odd vs. even) or a fixed count difference?
  4.  **Stroke Continuity:** Can Left be drawn in one stroke while Right cannot?
  5.  **Symmetry:** Does one side possess rotational or reflectional symmetry the other lacks?
  6.  **Primitive Inventory:** Does one side use a curve where the other uses only lines?
  **Decision Rule:** If a Cheap Cue is found:
  *   **Fatal:** If the cue is simpler than the intended key (e.g., key is "convex," cue is "ink area"), **Reject**.
  *   **Fixable:** If the cue is accidental, the Author must add two figures to the set that break the cue while preserving the key.
  *   **[Human Decision]:** The Reviewer judges "simplicity" of the cue relative to the key.
  *   **[Convention]:** The list of six cues is not exhaustive; it reflects common failures in this specific dataset history.

  ## 4. Human-Convergence Test
  **Requirement:** Five naive solvers (engineers not involved in creation) must solve the item without time pressure.
  **Agreement Threshold:** At least 4/5 solvers must produce a description semantically equivalent to the key.
  **Unintended Convergence:** If 4/5 solvers agree on a description *different* from the key, the item is **Rejected**. The solvers' consensus becomes the new putative key, and the item must be re-probed against that.
  *   **[Human Decision]:** The Lead Coordinator selects the naive solvers to ensure they are representative of the target audience, not domain experts.
  *   **[Convention]:** The 80% threshold is a statistical convention for reliability, not a truth condition.

  ## 5. Adjudication Rules for Reviewer Disputes
  **Verdicts:**
  *   **Accept:** Passed Audit, Probes hold, Human-Convergence met. Signed by Lead Reviewer.
  *   **Revise:** Fatal Cheap Cue found or Probes failed, but concept is sound. Author must resubmit within 48 hours. Signed by Senior Reviewer.
  *   **Reject:** Concept is subjective, Coextensivity cannot be resolved, or Human-Convergence fails twice. Signed by Lead Coordinator.
  **Evidence:** All verdicts require a written log of the specific Audit check failed or the specific Probe that broke the key.
  *   **[Human Decision]:** The Lead Coordinator has final veto power on "Reject" verdicts if the item is deemed strategically vital despite protocol failure (requires written justification).

  ## 6. Difficulty Grading
  **Metric:** **Abstraction Depth**, not time.
  *   **Level 1 (Perceptual):** Features are immediately visible (e.g., "contains a circle").
  *   **Level 2 (Relational):** Features depend on relationship between parts (e.g., "one shape inside another").
  *   **Level 3 (Meta-Relational):** Features depend on the relationship between relationships or negation of existence (e.g., "no shape intersects the bounding box center").
  **Assignment:** Assigned by the Author, validated by the Reviewer based on the Human-Convergence error rate (not time).
  *   **[Convention]:** The three-level hierarchy is a heuristic for cognitive load, not a validated psychometric scale.

  ---

  # Systematic Misfires and Biases
  **Where this protocol will fail:**
  1.  **Auditor Bias:** The Adversarial Audit (Section 3) relies on what *reviewers* think to test. If the review team never thinks to check for "average distance from centroid," items separable by that metric will pass. This biases the suite toward concepts your auditors intuitively value.
  2.  **The "Drawable" Blindspot:** The Coextensivity clause (Section 2) assumes that if two concepts cannot be distinguished by line drawings, they are equivalent. This is false for models that might encode latent geometric properties humans cannot draw. You are optimizing for human intelligibility, not model truth.
  3.  **Goodman's Ghost:** This protocol does not solve underdetermination. It merely pushes the burden of "projectibility" (which predicates are valid) from the model to the Reviewer. You are assuming your Reviewers' intuitions about "natural kinds" are correct. They are not; they are just yours.

  ---

  # Worked Examples

  ## Item 1: User Specification (Containment)
  **Concept:** Left: One shape wholly inside another. Right: No shape inside any other.
  **Protocol Run:**
  1.  **Key Check:** "Left figures contain one shape inside another; Right figures do not." (Passes word count, Necessary/Sufficient).
  2.  **Probe Requirement:**
      *   *Rival:* "Touching boundaries."
      *   *Probe A:* Inner shape touches outer boundary. (Must be classified as Right).
      *   *Probe B:* Inner shape is concentric but not touching. (Must be classified as Left).
      *   *Probe C:* Three shapes nested. (Must be classified as Left).
  3.  **Adversarial Audit:**
      *   *Ink Area:* Left might have more ink (two shapes vs one). **Flagged.**
      *   *Fix:* Ensure Right side includes figures with two disjoint shapes (same ink count potential).
  4.  **Human Convergence:** 5/5 solvers identify "inside/outside."
  5.  **Verdict:** **Accept**, contingent on adding disjoint multi-shape figures to the Right set to break the "Ink Count" separator.
  6.  **Difficulty:** Level 2 (Relational).

  ## Item 2: Protocol Rejection (The "Symmetry" Trap)
  **Concept:** Left: Figures with vertical symmetry. Right: Figures without vertical symmetry.
  **Protocol Run:**
  1.  **Key Check:** "Left figures are vertically symmetric." (Passes).
  2.  **Probe Requirement:**
      *   *Probe A:* A figure with horizontal symmetry only. (Classify Right).
      *   *Probe B:* A figure with rotational symmetry only. (Classify Right).
  3.  **Adversarial Audit:**
      *   *Check 5 (Symmetry):* Intended concept.
      *   *Check 2 (Bounding Box):* **Hit.** In the submitted draft, all Left figures were squares (aspect ratio 1:1), all Right figures were rectangles (aspect ratio ≠ 1:1) to make symmetry easier to draw.
      *   *Decision Rule:* This is a **Fatal** Cheap Cue. Aspect ratio is perceptually simpler than symmetry.
  4.  **Verdict:** **Reject.** The item tests "aspect ratio" not "symmetry" in its current form.
  5.  **Audit Line Killed:** Section 3, Check 2 (Bounding Box).
  6.  **Difficulty:** N/A.

  ## Item 3: The Hard Case (Family Resemblance)
  **Concept:** Left: Figures that look "unstable" or "top-heavy." Right: Figures that look "stable."
  **Protocol Run:**
  1.  **Key Check:** "Left figures are top-heavy; Right figures are stable."
      *   **Fail:** This is not a necessary-and-sufficient condition. It is a cluster concept. There is no geometric definition of "top-heavy" that covers all cases without exception.
  2.  **Probe Requirement:**
      *   *Rival:* "Center of mass above geometric centroid."
      *   *Probe:* A figure that is geometrically top-heavy but visually balanced (e.g., wide base).
      *   *Result:* Authors cannot draw a probe that definitively settles the boundary.
  3.  **Human Convergence:**
      *   Solvers: 3 say "top-heavy," 1 says "wide base," 1 says "looks like it will fall."
      *   Agreement: 60%. (Fails 80% threshold).
  4.  **Verdict:** **Reject.**
  5.  **Why you might dislike this:** This is a "good" Bongard problem in the spirit of Hofstadter—it tests intuitive physics and perception. However, it fails the **Design-Time Requirements (Section 1)** because it lacks a crisp key, and fails **Human-Convergence (Section 4)** due to subjectivity.
  6.  **Honest Output:** No key can be fixed. The concept is real to humans but unformalizable in this protocol. Including it requires waiving Section 1 and accepting a "soft" key, which undermines the evaluation's rigor.

  ---

  # Memorandum to the Director

  **To:** Project Director
  **From:** Evaluation Coordinator
  **Subject:** Vetting Protocol and Underdetermination Risks

  **What This Protocol Buys Us**
  1.  **Robustness against Cheap Cues:** By mandating an adversarial audit for ink, symmetry, and bounding boxes, we prevent models from solving items via statistical artifacts rather than conceptual understanding.
  2.  **Documented Intent:** The Probe Pack requirement forces authors to articulate *why* a figure belongs to a class, creating a paper trail that distinguishes "correct by accident" from "correct by concept."
  3.  **Human Baseline:** The Convergence Test ensures we are not testing for capabilities humans do not possess, keeping the suite grounded in human-interpretable intelligence.

  **What It Cannot Buy**
  1.  **Truth:** This protocol does not verify that the "intended concept" is the *only* valid concept. It only verifies that it is the most *salient* one to our specific team of reviewers and solvers.
  2.  **Induction:** It does not solve Goodman's "grue" problem. We are still selecting predicates (e.g., "inside," "symmetric") based on human prejudice about which concepts are "natural." A model could legitimately learn a "grue-like" geometric rule that fits the data better than our key; our protocol would mark that model as wrong.
  3.  **Completeness:** The Adversarial Audit is limited by human imagination. There will be separators we did not think to check.

  **Resolution of Underdetermination**
  This protocol does not resolve underdetermination; it **relocates** it.
  Previously, the burden was on the solver (the model) to guess the designer's mind from twelve images.
  Now, the burden is on the vetting team to guess the solver's potential shortcuts before the item is published.
  We have not eliminated the gap between *extension* (the images shown) and *intension* (the rule meant). We have merely added a bureaucratic layer to assert that our intension is the one that counts.

  **Recommendation**
  Adopt the protocol as a quality filter, not a truth machine. When the protocol rejects a "good" item (like Item 3 above), log it as a "Subjective Class" in a separate appendix. This acknowledges that some intelligence is real but unmeasurable by our current constraints. Do not claim the suite measures "pure intelligence." Claim it measures "alignment with human geometric intuition under constrained conditions."

  **Sign-off:**
  [Human Decision]
  Lead Coordinator
