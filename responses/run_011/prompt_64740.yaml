          *   *Audit Fail:* Ink area correlates with vertex count in this specific set. Or simpler: "Left is triangles, Right is squares."
          *   *Better Rejection:* "Left figures are red, Right are blue" (if color allowed, but prompt says line drawings). Let's go with "Left figures have a horizontal line of symmetry."
