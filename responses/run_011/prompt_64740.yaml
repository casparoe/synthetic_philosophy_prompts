  10. **Final Polish:** Check the distinction between [Human Decision] and [Convention]. Ensure the Director's memo is punchy and honest.

  *(Final thought on the "Goodman" aspect)*: The prompter knows their philosophy. I shouldn't dumb it down. Acknowledge that "projectibility" is being enforced by the audit, not discovered by the model.

