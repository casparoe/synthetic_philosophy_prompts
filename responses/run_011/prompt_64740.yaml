      *   Mark human/convention? Yes.
      *   Systematic misfire acknowledged? Yes.
      *   3 items worked? Yes.
      *   Director page included? Yes.
      *   No bibliography? Yes.

  9.  **Writing the Content (Mental Sandbox):**

      *   *Protocol Point 1:* Define "ordinary sentence" as <20 words, no logical connectives like "if and only if" unless implicit.
      *   *Protocol Point 2:* Probes must be *minimal edits*.
      *   *Protocol Point 3:* The "Cheap Cue Checklist."
      *   *Item 1:* Inside/Outside. Probe: Touching boundaries.
      *   *Item 2:* Rejected. "Left has curves, Right has angles." Audit: Left all have area < 50sq units.
      *   *Item 3:* The "Hard Case." Maybe "Left figures are 'happy', Right are 'sad'." Protocol kills it due to subjectivity. Or "Left are projective transformations of a cube." Protocol kills it because humans can't solve it reliably. Let's choose the latter: High abstraction, low human convergence.

