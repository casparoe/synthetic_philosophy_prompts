  I'm applying for a two-year fellowship and need a draft proposal, roughly two pages. My half-baked idea is about Bentham on sexual offences. The standard reading treats his case against punishing private, consensual acts between men as a piece of hedonic arithmetic: pleasure on one side, pain on the other, with disgust and alarm thrown in as costs the act causes. But a lot of the pain Bentham counts — the antipathy of bystanders, the alarm, the opening for blackmail and for prosecutions built on it — is produced by the law and the surrounding panic rather than by the act, so the calculus is partly self-referential: punish harder and the pains of disgust grow, and they then get counted as reasons to go on punishing. I want the project to ask whether Bentham has a principled way of separating endogenous pains of that sort from genuine mischief, or whether his argument quietly leans on a claim about moral education (disgust can be unlearned) that he never defends. Write it up as a proposal: the question stated sharply enough that it could have a determinate answer, why the standard readings leave it open, what I'd actually do month by month — including how far I'd have to go into his taxonomy of cases where punishment is groundless, inefficacious, unprofitable or needless, and into the ascetic principle — what a result would look like, what would count as the project failing, and an honest note on whether two years is enough. Skip the bibliography, I'll add the references myself.
