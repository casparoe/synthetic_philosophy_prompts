answer: |-
  **Project Title:** The Circular Calculus: Endogenous Pains and the Limits of Bentham's Defense of Sexual Liberty

  **Research Question**
  Does Jeremy Bentham's principle of utility contain an internal mechanism for filtering *endogenous* social pains (those produced by prohibition and stigma itself) from *exogenous* harms, or does his argument for decriminalizing "irregularities of the sex" covertly depend on a perfectionist account of moral sentiment that he elsewhere rejects?

  **Project Summary and Rationale**
  The standard reading of Bentham's writings on sexual offences—principally *Of Offences Against One's Self* and the relevant sections of *Principles of Penal Law*—treats his case against punishing private, consensual acts between men as a straightforward application of hedonic arithmetic. On this view, Bentham weighs the pleasure of the agents against the pain of the act, adding "secondary evils" such as public disgust, alarm, and the risk of blackmail. He concludes that the pains outweigh the pleasures only when the law intervenes to create them.

  However, this reading leaves a critical structural vulnerability open. A significant portion of the "pain" Bentham counts—specifically the antipathy of bystanders, the alarm of the public, and the leverage for blackmail—is not intrinsic to the act but is *endogenous*: it is produced by the legal prohibition and the surrounding moral panic. This creates a self-justifying loop: the law punishes the act, which generates social disgust and blackmail risks; these pains are then tallied in the utilitarian calculus as reasons to maintain the punishment.

  Current scholarship (e.g., Rosen, Quinn, Boralevi) focuses on Bentham's liberal outcome (decriminalization) but fails to interrogate whether his theoretical machinery can consistently break this loop. They treat "public disgust" as a brute fact rather than a variable dependent on legal status. Consequently, it remains unclear whether Bentham has a *principled* criterion for dismissing these endogenous pains as illegitimate grounds for legislation, or whether his argument quietly leans on an empirical bet that disgust can be unlearned through moral education—a claim resembling the perfectionism he attacks in the "ascetic principle."

  This project seeks a determinate answer. It will reconstruct Bentham's taxonomy of misapplied punishment to see if endogenous pains fit the category of "needless" or "unprofitable" punishment by definition. If they do, Bentham offers a robust shield against conservative appeals to public sentiment. If they do not, his defense of sexual liberty is ad hoc, relying on a contingent hope for moral progress rather than a strict utilitarian derivation.

  **Methodology and Work Plan**
  The project combines close textual exegesis with conceptual reconstruction. I will work through the *Collected Works* and relevant transcriptions from the Bentham Project (UCL), focusing on the tension between the empirical reality of public sentiment and the normative criteria for punishment.

  *Months 1–6: Textual Groundwork and Taxonomy*
  I will establish the baseline of Bentham's penal theory. The primary focus will be *Principles of Penal Law* and *Of Offences Against One's Self*. I will map the four cases where punishment is groundless, inefficacious, unprofitable, or needless.
  *   *Deliverable:* A detailed annotation of where sexual offences fit within this taxonomy. Does the "endogenous pain" of disgust render punishment "unprofitable" (cost > benefit) or "needless" (no mischief to prevent)?
  *   *Key Task:* Distinguish between "primary mischief" (the act itself) and "secondary mischief" (alarm and danger) to see if Bentham allows the latter to be discounted when law-generated.

  *Months 7–12: The Endogeneity Problem*
  This phase tackles the core circularity. I will analyze Bentham's treatment of "antipathy" and "public alarm."
  *   *Deliverable:* Draft of Article 1: "The Circular Calculus: Endogenous Pains in Bentham's Penal Theory."
  *   *Key Task:* Determine if Bentham treats the pain of disgust as a fixed constant or a variable. I will examine his correspondence and marginalia on the "moral sanction" to see if he acknowledges that law shapes the very sentiments used to justify it.

  *Months 13–18: The Ascetic Principle and Moral Education*
  If Bentham cannot filter endogenous pains via the taxonomy, he must argue they will disappear. This requires investigating his views on moral psychology.
  *   *Deliverable:* Draft of Article 2: "Unlearning Disgust: Bentham, the Ascetic Principle, and Moral Progress."
  *   *Key Task:* Analyze Bentham's critique of the ascetic principle. Does his hope that society will eventually view homosexuality neutrally rely on a hidden normative claim about which desires *should* exist? I will cross-reference his sexual writings with *Deontology* and *The Book of Fallacies*.

  *Months 19–24: Synthesis and Final Output*
  Integration of findings into a cohesive argument.
  *   *Deliverable:* Completion of two journal articles and a draft monograph chapter. Presentation of findings at one major conference (e.g., BSPS or APA).
  *   *Key Task:* Finalize the answer to the research question. If the answer is negative (Bentham lacks the mechanism), I will outline the implications for modern utilitarian liberalism.

  **Expected Results**
  A successful project will produce a definitive classification of how endogenous social costs function within classical utilitarianism.
  1.  **Positive Outcome:** I demonstrate that Bentham's category of "needless punishment" implicitly excludes pains generated solely by the law's existence. This would recover a powerful, underutilized argument for liberal toleration within utilitarian theory.
  2.  **Negative Outcome:** I demonstrate that Bentham's argument relies on an empirical prediction (disgust will fade) rather than a principled exclusion. This would show that his liberalism is more fragile than assumed, dependent on contingent social psychology.

  Both outcomes are academically valuable. The first rehabilitates Bentham's consistency; the second clarifies the limits of utilitarianism in protecting minorities against majoritarian sentiment.

  **Failure Conditions**
  The project would fail if:
  1.  **Textual Insufficiency:** The manuscripts on sexual offences prove too fragmentary to support a systematic reconstruction of his penal taxonomy in this specific context. (Mitigation: I will broaden the scope to his general theory of the "moral sanction" if the specific sexual texts are too sparse).
  2.  **Conceptual Collapse:** The distinction between "endogenous" and "exogenous" pain proves impossible to sustain within a hedonic framework where all pain counts equally regardless of source. If I cannot show Bentham *ought* to distinguish them, the project becomes a general critique of utilitarianism rather than an exegesis of Bentham.
  3.  **Scope Creep:** The investigation into moral education expands into a general history of Enlightenment psychology, diluting the focus on the penal calculus.

  **Feasibility and Timeline**
  Two years is sufficient for this specific textual scope. Unlike projects requiring new archival transcription, the core texts (*Of Offences Against One's Self*, *Principles of Penal Law*) are available in reliable editions. The intellectual labor lies in reconstruction and argumentation, not discovery. The risk lies in the complexity of Bentham's unpublished manuscripts (the Box collections); however, I will limit archival deep-dives to specific queries regarding the "moral sanction" to ensure the timeline holds. The month-by-month plan allows for a buffer in Months 18–20 for unexpected textual complications.

  This project offers a sharp intervention in the history of political thought, moving beyond the question of *what* Bentham concluded about sexuality to *how* his system sustains that conclusion against the feedback loops of social prejudice.
