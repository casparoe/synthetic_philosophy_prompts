answer: |-
  The territory of everyday conventions is puzzling because it sits precariously between the arbitrary and the obligatory. We feel a genuine normative pull to queue correctly or tip appropriately, yet these rules lack the foundational weight of moral prohibitions against harm. The central tension lies in explaining why violating a purely local, informal rule feels like a moral failure rather than merely a strategic error or a breach of etiquette. Ordinary intuitions pull in opposite directions: we want conventions to bind outsiders who benefit from the practice, yet we refuse to be bound by conventions that are dead or unjust. We want the obligation to stem from the practice itself, not merely from the threat of social shame, yet we struggle to locate the source of that obligation if no one is harmed. A successful theory must navigate the gap between the sociological fact of a norm and the philosophical force of a reason.

  | # | Requirement | Motivating Case | Verdict |
  | :--- | :--- | :--- | :--- |
  | 1 | The account must explain normativity in the absence of identifiable harm. | A person cuts into a queue where nobody is delayed, yet observers feel entitled to resent the intrusion. | Non-negotiable |
  | 2 | The account must generate obligations for temporary participants who did not help create the norm. | A tourist steps into a bus queue gap in a foreign city, benefiting from the order they did not establish. | Non-negotiable |
  | 3 | The account must distinguish living conventions from those that have ceased to function. | A visitor waits at a red light where every local jaywalks, obstructing the flow without serving coordination. | Non-negotiable |
  | 4 | The account must deny normative force to conventions that sustain background injustice without collapsing into general justice. | Employers use tipping customs to subsidize wages, yet the theory must critique the convention specifically, not just the wage law. | Non-negotiable |
  | 5 | The account must locate obligation in the local practice rather than the agent's internal instincts. | A mover finds local standing distances intrusive but must adapt rather than impose their home culture's norms. | Non-negotiable |
  | 6 | The account must acknowledge differential burdens without dissolving convention into general fairness. | A dress code imposes heavy costs on one group while remaining invisible to those who comply effortlessly. | Camp-specific |
  | 7 | The account must distinguish moral obligation from the mere pressure of social sanction. | A person obeys a rule only to avoid awkwardness, not because they believe they ought to obey it. | Non-negotiable |
  | 8 | The account must separate the fact of violation from the presence of a specific wronged victim. | A person drives on the wrong side of an empty road; the convention is breached, but no individual is disadvantaged. | Non-negotiable |
  | 9 | The account must distinguish reasons to believe a convention exists from reasons to follow it. | An anthropologist identifies a norm accurately but lacks the participatory reason to comply with it themselves. | Non-negotiable |
  | 10 | The account must differentiate between participants in a practice and those merely subject to its effects. | A resident follows queueing norms, while a passerby is merely affected by the queue's efficiency without being bound. | Camp-specific |

  Regarding the pressure tests, your characterisation of the Visitor case is mostly correct, but you misidentify the complainant. The complaint does not belong to the delayed individuals, as there are none; it belongs to the co-participants whose cooperative equilibrium is undermined. The theory must explain how one can wrong a collective without harming a member. On the Dead Convention, you are right to demand a threshold, but the theory must avoid making obligation hostage to perfect compliance; a convention is alive if it is generally accepted as a standard, even if frequently violated. Regarding the Exploitative Convention, you correctly identify the risk of redundancy. The theory must show how the convention itself becomes tainted, not merely how it overlaps with injustice. A convention that institutionalizes exploitation loses its reason-giving force specifically because it fails the fairness conditions of cooperation, not merely because the outcome is unjust.

  On the Shifting Convention, obligation attaches to the local practice as enforced, not as instinctively felt. To insist on internal endorsement is to misunderstand the social nature of the rule; the obligation is external to the agent's psychology. Regarding the Asymmetric Convention, you are right to worry about the fairness clause collapsing the view. If the theory demands perfect symmetry of burden, it ceases to be a theory of convention and becomes a theory of distributive justice. The desideratum must be weaker: conventions lose force only when the asymmetry is exploited to dominate, not merely when burdens differ.

  You ask whether certain distinctions are real. The distinction between moral obligation and social pressure is real and vital; shame can exist without obligation, but obligation implies a justification beyond fear. The distinction between violation and wronging is also real, as shown by the empty road case; one can breach a rule without wronging a person, though one may wrong the practice. The distinction between reason-giving force and reasons for belief is crucial to avoid naturalistic fallacies; knowing a norm exists does not entail one should follow it. The distinction between participant and subject is real but perilous; it risks excluding vulnerable groups from the protection of norms. Finally, the distinction between arbitrary salient conventions (driving side) and arbitrary uncoordinated ones (dish to bring) is real. The former solves a coordination problem; the latter solves a collaboration problem. A theory that treats them identically will fail to explain why violating the former is worse than violating the latter.

  Regarding the structure of the list, I suspect you are correct about the tension between the Visitor's obligation and the refusal to make obligation hostage to endorsement. If a tourist is bound by a norm they do not endorse, the source of obligation must be external, which risks making the norm tyrannical. However, you are wrong about the threshold clause colliding with the exploitative convention. A convention can be widely complied with (high threshold) yet still be exploitative. The threshold concerns viability, not justice. These are separate filters. The single desideratum that does the most work in excluding candidate theories is Number 4 (Injustice Resistance). Many theories ground convention in coordination or expectation; these struggle to explain why an expected, coordinated practice like exploitative tipping generates no obligation. Only theories that build a moral constraint into the foundation of convention can pass this test without redundancy.

  Scoring the three views you sketched:

  **1. Salience**
  This view plainly satisfies Desiderata 1 (Normativity without Harm) and 11 (Coordination Necessity), as it grounds obligation in the solution to coordination problems. It most clearly fails Desideratum 4 (Injustice Resistance). If a convention solves a coordination problem efficiently but unjustly (e.g., segregated seating), Salience struggles to deny it force without importing external moral principles. This failure is not repairable from inside the view, as the view defines convention purely by coordination efficiency. It also struggles with Desideratum 2 (Outsider Binding) if the outsider does not perceive the salience.

  **2. Expectation**
  This view plainly satisfies Desideratum 8 (Violation vs. Wronging) and 7 (Obligation vs. Pressure), as it grounds the wrong in the defeat of reliance. It most clearly fails Desideratum 3 (Living vs. Dead). If a convention is dead (no one expects compliance), the Expectation view suggests no obligation exists, yet we often feel one ought to revive good norms or that the visitor in the dead convention case is still awkwardly situated. More critically, it fails Desideratum 4 (Injustice Resistance). If everyone expects exploitative tipping, the view suggests an obligation to tip. This failure is repairable only by adding a clause that unjust expectations generate no reliance rights, which moves the view toward Membership.

  **3. Membership**
  This view plainly satisfies Desideratum 2 (Outsider Binding) and 5 (Shifting Convention), as obligation stems from entering the relational space of the community. It most clearly fails Desideratum 6 (Burden Sensitivity). If obligation stems from membership, it risks demanding compliance even when the burden is asymmetrically distributed among members, treating exclusion as the only remedy. This failure is repairable from inside the view if membership is construed as requiring reciprocal recognition, but this risks collapsing into general fairness.

  Are these distinct views? Yes. Salience focuses on the problem solved, Expectation on the psychological state of others, and Membership on the relational status of the agent. However, Expectation and Membership overlap significantly regarding the visitor; Membership explains the visitor's obligation better by framing it as temporary membership rather than defeated expectation. Salience is the most distinct, as it alone denies normativity where no coordination problem exists. For your paper, Membership offers the strongest framework for defending a positive account, provided you can solve the asymmetry problem without dissolving the convention into justice.
