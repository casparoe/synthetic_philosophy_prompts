  **DRAFT COLLABORATION SKELETON: ACCESS AND PHENOMENOLOGY**
  **Status:** Pre-Discussion Working Document
  **Date:** [Redacted]
  **Parties:** Side A (Overflow/Independence) & Side B (No-Overflow/Global Availability)

  ### I. Jointly Accepted Claims
  *The following claims are non-vacuous and accepted by both parties as the baseline for this collaboration. Signing this section does not imply agreement on the interpretation of these claims, only their factual or theoretical status.*

  1.  **Unconscious Processing:** A significant portion of visual processing (including feature extraction, object priming, and semantic activation) occurs without conscious awareness, as demonstrated by masking, priming, and blindsight paradigms.
  2.  **Report Confounds:** Subjective report is a fallible measure subject to criterion shifts, memory decay between stimulus and response, and attentional redirection caused by the demand to report itself.
  3.  **Sperling Data:** In partial-report paradigms, accuracy for cued items exceeds accuracy in whole-report conditions, indicating a high-capacity store that decays rapidly prior to consolidation.
  4.  **Function of Access:** "Global availability" (Access Consciousness) entails the availability of information for verbal report, reasoning, and flexible action control.
  5.  **Attention/Consciousness Distinction:** Attention and consciousness are dissociable constructs; attention can be directed to unconscious stimuli, and conscious perception can occur (under specific conditions) without focal attention.
  6.  **Incomplete Theory of Attention:** Neither party currently possesses a complete, mechanistic account of how attention selects content for access.

  **Commentary on Candidate Claims:**
  Regarding your specific guesses for Section I: Claims 1, 3, 4, and 6 are safe. Claim 2 (**Report Confounds**) is the one that is **contested in implication**. While both sides sign the text above, Side B argues that objective measures (eye tracking, neural decoding) can correct for these confounds to reveal capacity limits, whereas Side A argues that any measure requiring a readout is inherently an access measure and cannot bypass the confound to measure phenomenology directly. We have phrased Claim 2 broadly enough to secure signatures, but the *remedy* for the confound remains a core disagreement.

  ### II. Disagreements Table
  *This table isolates the specific points of contention. "Verbal" indicates a dispute over terminology or definition; "Substantive" indicates a dispute over empirical facts or mechanistic models.*

  | Issue | Side A Formulation (Overflow) | Side B Formulation (No-Overflow) | Type |
  | :--- | :--- | :--- | :--- |
  | **1. The Overflow Thesis** | Phenomenal consciousness exceeds the capacity of access consciousness. One can phenomenally experience more than one can report or use. | Phenomenal consciousness is co-extensive with access consciousness. If information is not globally available for report/use, it is not phenomenally experienced. | Substantive |
  | **2. Iconic Memory Status** | The rich, high-capacity store revealed in Sperling tasks is partially phenomenal. It constitutes a "phenomenal overflow" before access bottlenecks apply. | The rich store is pre-phenomenal sensory memory. It contains raw data that is not yet conscious. Consciousness only arises upon selection/access. | Substantive |
  | **3. Measurement Authority** | Subjective report (when calibrated) is the necessary arbiter of phenomenology. Neural markers without report are insufficient to prove consciousness. | Objective measures (neural signatures, forced-choice accuracy) can validly indicate consciousness even when subjective report is absent or unreliable. | Substantive |
  | **4. Definition of "Conscious"** | "Consciousness" refers primarily to *what it is like* (phenomenality), which may exist without functional availability. | "Consciousness" refers to a functional state of *global availability*. The "what it is like" is an aspect of this broadcasting, not a separate layer. | Verbal |

  **Note on Verbal vs. Substantive:** Row 4 is marked Verbal, but it drives the Substantive disagreements in Rows 1 and 2. If Side B defines consciousness *as* global availability, Side A's claim of overflow becomes a category error by definition. The collaboration proceeds on the understanding that we are testing whether the *phenomenal properties* usually associated with the word "conscious" track with Side A's definition or Side B's definition.

  ### III. Cruxes and Pre-Registered Predictions
  *These are the sub-questions where empirical resolution would force a theoretical update. For each crux, we specify the experiment and the committed predictions.*

  **Crux 1: The Richness of Sensory Memory**
  *   **Question:** Does the high-capacity sensory store possess phenomenal character, or is it merely a buffer of unusable data?
  *   **Experiment:** Change detection in high-load arrays with ultra-brief presentation and immediate vs. delayed cueing.
  *   **Side A Prediction:** Subjects will report a "sense of presence" or high visibility for uncued items that they cannot identify, indicating phenomenal richness without access.
  *   **Side B Prediction:** Visibility ratings will track identification accuracy. If subjects cannot identify the change, visibility will be at chance levels, indicating no phenomenal experience occurred.

  **Crux 2: Circularity of Access**
  *   **Question:** Can "global availability" be characterized independently of phenomenal report, or is the definition circular?
  *   **Experiment:** Neural decoding of stimulus content in no-report paradigms (e.g., passive viewing with orthogonal task).
  *   **Side A Prediction:** Neural signatures of sensory content (e.g., V1-V2 recurrent activity) will persist without signatures of global broadcast (e.g., P3b), correlating with post-hoc reports of seeing.
  *   **Side B Prediction:** Without global broadcast signatures (P3b/frontal ignition), there will be no conscious experience, regardless of sensory decoding. Decoding without ignition indicates unconscious processing.

  **Crux 3: The Lagged-Report Design (Specific Collaboration Task)**
  *   **Design:** 12-item array, brief presentation (50ms). Cue appears at variable delay (100ms to 1.5s). Subject provides (a) Cued-item identification and (b) Visibility/Confidence rating on a forced scale.
  *   **Rationale:** This tests the decay rate of phenomenology relative to the decay rate of access.
  *   **Side A Prediction (Decoupling):** Identification accuracy will drop significantly as delay increases (access bottleneck/decay). Visibility ratings will remain disproportionately high relative to accuracy at intermediate delays. *Phenomenology decays slower than Access.*
  *   **Side B Prediction (Coupling):** Visibility ratings will collapse in tight correlation with identification accuracy. As the ability to report the identity fades, the subjective experience of seeing the item fades concurrently. *Phenomenology tracks Access.*
  *   **Correction on Initial Intuition:** *Note to drafters: The initial intuition that Side A expects coupling was incorrect. Side A expects dissociation (Overflow). Side B expects coupling (Identity).*
  *   **Surprising Outcome (Falsifies Both):** Identification accuracy remains high (Access intact), P3b is present (Broadcast intact), but Visibility ratings drop to baseline (No Phenomenology). This suggests "Zombie Access"—global availability without experience—which challenges Side B's functionalism and Side A's assumption that access usually accompanies phenomenology. Alternatively: Visibility stays high, ID drops, *and* P3b is absent, *but* sensory markers (CDA) are also absent. This implies a source of visibility not accounted for by either sensory storage or global broadcast.

  ### IV. Unsigned Clauses
  *The following statements are explicitly excluded from this agreement. Neither party is expected to sign these, and they represent the hard boundaries of the current debate.*

  1.  **The Necessity of Report:** Side B cannot sign a clause stating that report is *never* a valid proxy for consciousness. Side A cannot sign a clause stating that report is the *only* valid proxy.
  2.  **The Hard Problem:** Neither party commits to a solution for the explanatory gap. Side A accepts the gap as a reason to distinguish P and A consciousness; Side B treats the gap as a conceptual confusion dissolvable by functional analysis.
  3.  **Unitary Consciousness:** Side A explicitly rejects the claim that consciousness is a unitary natural kind. Side B operates under the working hypothesis that "conscious access" is a unitary neurocognitive event.
  4.  **Interpretation of No-Report Paradigms:** Side A interprets no-report results showing sensory retention as evidence of consciousness without access. Side B interprets the same results as evidence of unconscious sensory retention. We agree to collect the data without agreeing on this interpretation in advance.

  ***

  **Instructions for the Session:**
  The goal of the session is not to resolve the Unsigned Clauses, but to determine if the data generated from the Cruxes (specifically the Lagged-Report Design) can convert a Verbal disagreement (Row 4, Disagreements Table) into a Substantive one, or vice versa. If the Lagged-Report Design shows strong Decoupling (Side A wins), Side B must explain why visibility ratings are valid if they do not track access. If it shows strong Coupling (Side B wins), Side A must explain why the intuition of overflow is systematically erroneous.
