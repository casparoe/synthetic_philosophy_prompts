prompt: |-
  I have no academic training in philosophy or in chemistry. Over the past few years I have been reading on my own, mostly popular histories of science and then, more deliberately, whatever I could find on the question of whether the categories a science uses are found in the world or built by us. I have reached the point where I want one concrete historical episode put up against one specific philosophical claim, and I want the analysis done rather than the debate summarized.

  Please write as a philosopher of science who works on the metaphysics of chemistry and who knows the history of the periodic table in detail. Think the problem through carefully before you begin writing. Do not assume I know the technical vocabulary: define each term the first time you use it, and never use a term of art where a plain sentence would carry the same weight.

  The claim I want tested. There is a position about natural kinds, which I believe is associated with Kripke and Putnam, though I may have the attribution wrong, that says roughly this: a genuine natural kind has a hidden internal structure that fixes what belongs to it and what does not; the observable properties of the kind depend on that structure; and the business of science is to discover the structure, which amounts to discovering the real definition the ordinary name was reaching for all along. Water turns out to be H2O, gold turns out to be whatever has atomic number 79, and neither is a stipulation — both are findings. On this picture the successful classification carves nature at its joints, and the joints are where they are regardless of anyone's interests. The rival picture I keep meeting says that kinds are clusters of properties held together by underlying mechanisms, and that which clusters get treated as kinds depends on what we are trying to explain, so there are many cross-cutting ways to cut and the question of which cut is the cut is partly a question about us.

  The episode: the collapse of atomic weight as the criterion of element identity, roughly 1895 to 1920. The facts I will rely on, so that you need not supply them and so that the argument does not turn on anything I have garbled:

  - Mendeleev's first table, published in 1869, was ordered by increasing atomic weight, and atomic weight was widely treated as the property that made an element the element it was.
  - Mendeleev himself had to break the weight order in at least one place on chemical grounds, placing tellurium (127.6) ahead of iodine (126.9). Argon and potassium, and cobalt and nickel, are further pairs whose weights are nearly equal or reversed.
  - The radioactive decay chains produced a crowd of new substances in the early 1900s, several of which could not be separated chemically from known elements. Frederick Soddy, working on these, concluded around 1913 that chemically inseparable species of different atomic weight had to be assigned to the same place in the periodic table. The word isotope was suggested to him that year by Margaret Todd, a Scottish physician. Soddy received the 1921 Nobel Prize in Chemistry for this work.
  - Independently, in 1913, Antonius van den Broek proposed that the nuclear charge, in units of the electron's charge, equals an element's position in the table. Henry Moseley's X-ray measurements of 1913 and 1914 gave that number an experimental footing: the X-ray frequencies rose in a regular way tracking a whole number that matched each element's place in the sequence. Moseley was killed at Gallipoli in 1915, aged 27.
  - Around the same time J. J. Thomson, working with positive rays, found evidence that ordinary neon came in two weights, 20 and 22. Francis Aston's mass spectrograph work from 1919 confirmed that ordinary neon is roughly a nine-to-one mixture of the two. Neon is not radioactive, so isotopy was not merely a curiosity of the decay chains.
  - Precision measurements then showed that lead from uranium-bearing ores and lead from thorium-bearing ores have different atomic weights, because the uranium and thorium chains terminate in different stable isotopes of lead and different ores contain them in different proportions.
  - Two present-day consequences I want the analysis to reach: the IUPAC commission responsible for atomic weights publishes a single value for most elements but an interval for fourteen of them, because natural samples differ according to geological history, and the standard is explicitly defined for terrestrial sources. And argon on Earth is overwhelmingly the isotope of mass 40, produced by the decay of potassium-40 in rock, whereas argon in the Sun is overwhelmingly mass 36 — the atomic weight of the same element differs by around ten percent between those two places.
  - One further thing I have read but am less certain of: for the heaviest synthetic elements, relativistic effects on the inner electrons are predicted to distort the periodic trends the table was built on, so that an element's chemistry stops matching its column.

  Write me a case analysis of that episode through the lens of the essence view, running in both directions: what the view says these chemists were doing and what it predicts they would find, which features of the episode it explains well, which it misdescribes or cannot reach, and what the episode in turn does to the view — a confirmation, an anomaly, or a case it was never really about. Where the view is simply silent, say it is silent rather than pressing it into service.

  Please use exactly these sections, in this order, at roughly these lengths:

  1. Working Notes — up to 150 words. Before arguing anything, set out compactly, as a list or small table, the candidate essences on offer across the episode (atomic weight, nuclear charge, proton number, proton-plus-neutron number, chemical behavior, something else) and the anomalies each one has to absorb. This is for me to check that you have mapped the terrain.

  2. The Theory Under Test — about 200 words. Sharpen my paraphrase of the essence view into a claim that could actually fail. State what it predicts about an anomaly such as the tellurium-iodine inversion, and say what would count as confirmation and what as refutation. Tell me where my paraphrase distorts the real view, and correct it.

  3. The Mapping — about 350 words. Identify the kind in question, who the relevant actors were and what each was in a position to know, the candidate essences in sequence, the anomalies as they arrived, and the moves actually made to resolve them. Be disciplined about what counted as evidence at each stage, since the radioactive chemists and the X-ray physicists were not working from the same data.

  4. The Case That This Is a Vindication — about 300 words. The strongest honest version of the claim that 1913 is the essence view's best hour: an anomaly absorbed by a deeper structure, the ordering fixed non-arbitrarily, the old inversions explained retrodictively, convergence achieved across two disciplines that had nothing but the phenomenon in common.

  5. Where the Theory Breaks — about 450 words. The part I most want. Address at minimum: the fact that one essence was replaced by another, and what protects nuclear charge from the same fate; the choice of proton number over proton-plus-neutron number as the location of the joint, and what that choice was responsive to; whether isotopes are subkinds or not, and whether the answer differs for nuclear physics, for isotope geochemistry, and for any science that cares about mass-dependent fractionation; the Earth-relativity of the standard atomic weight and the interval values, and what it means that argon on the Sun weighs differently; the fact that a standing committee ratifies elementhood, placement, and names; and the superheavy-element point, flagging clearly how speculative it is. Mark which of these are places the view is contradicted and which are places it has nothing to say.

  6. What the Episode Does to the Theory — about 300 words. Your verdict, in both directions. Does the cluster-and-interests view handle the same facts better, and if so what would it have to say about the speed and completeness of the convergence in 1913, which is the feature that most embarrasses it? If you think a third position does better, sketch it and say what it costs.

  7. What I Am Still Stuck On — about 150 words. Two or three questions the episode leaves genuinely open for someone in my position, phrased as questions I could think about, not as topics to look up.

  Aim for roughly 1,800 to 2,200 words in total. No bibliography, no reading list, no citations, and no invented quotations or attributed sayings — I have no way to check them and do not want them. If you are unsure of a historical detail beyond what I have given, say so plainly instead of filling the gap. Skip the throat-clearing and the summary of what you are about to do; begin with Working Notes. And if you think my framing of the essence view, or my choice of this episode, is mistaken in some way, say so inside the relevant section rather than working around it.
