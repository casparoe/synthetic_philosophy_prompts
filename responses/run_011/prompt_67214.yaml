answer: |-
  'The safe isn't going to open early, Callum,' Nadia said, checking her watch. 'Forty minutes. The colleague offering the bet on flip 1,728 is waiting for our prices.'

  'And I'm telling you, mine isn't fifty pence,' Callum replied, leaning against the cold steel of the cabinet. 'I'll lay odds at 49.9 pence to the pound. You're offering even money.'

  'Because the chance is exactly one-half,' Nadia said. 'We accept hypothesis $H$. The machine is quantum, the flips are independent. The Principal Principle dictates that my credence in heads, given $H$ and admissible evidence, matches the chance. That is 0.5.'

  'But $H$ is a Humean best system,' Callum countered. 'It supervenes on the mosaic. If the string in that safe is sufficiently aberrant—if heads appear 3,000 times out of 3,600—then $H$ is not the best systematisation of the world's history. In that world, the chance was not one-half. So there is a non-zero chance, given $H$ itself, that $H$ is false.'

  'The undermining future problem,' Nadia sighed. 'Or rather, past. But Lewis dealt with this. The probability of such a string under $H$ is astronomically small. It's negligible.'

  'Negligible isn't zero,' Callum insisted. 'And that is the proposition I assign more credence to than your framework permits. I assign higher credence to the proposition $U$: "The total frequency of heads deviates sufficiently to falsify $H$." Under your deference principle, conditional on $H$, my credence in $U$ should equal the chance of $U$ given $H$. But if $U$ obtains, $H$ is false. So $P(U | H)$ should be zero, yet the binomial distribution says it isn't. You're asking me to ignore the metaphysical tension.'

  'You're conflating the chance of the sequence with the truth of the theory,' Nadia said. 'I adopt the reformulated principle. I conditionalise explicitly on the complete chance hypothesis $T_w$. My credence function $C$ should satisfy $C(A | T_w) = P(A)$. I treat $H$ as the theory of chance. The tiny probability mass assigned to undermining sequences is exactly the mass $H$ assigns them. I don't owe a further discount.'

  'But you can't conditionalise on $T_w$ as if it were independent of the outcomes,' Callum argued. 'For a Humean, $T_w$ is a function of the outcomes. To condition on $T_w$ is to condition on a claim about the very pattern you're betting on. It's circular. You're pretending the chance fact is fixed before the mosaic is complete, which is precisely what Humean supervenience denies.'

  Nadia shifted her weight. 'It's not circular; it's normative. We define admissibility to exclude information about the outcome. The fact that the flips are in the past doesn't make the evidence inadmissible. We don't know the results. Epistemically, it's open.'

  'Ontically, it's fixed,' Callum pressed. 'Does chance command deference when the outcome is settled? If I knew the result, my credence would be 0 or 1. The only thing stopping me is ignorance. But the chance itself depends on the result. If the result is 3,000 heads, the chance *wasn't* 1/2. So by betting at 0.5, you're betting on a chance that might not have existed.'

  'You're forcing me to reformulate,' Nadia said sharply. 'I don't claim the chance is 1/2 regardless of the outcome. I claim that given our current evidence, which excludes the contents of the safe, the rational credence is governed by the best systematisation of the evidence we *do* have. $H$ is the best system for the history up to now. The future—or the locked past—doesn't change the current best system.'

  'But the "best system" is global,' Callum replied. 'You just admitted $H$ is the best system for the history *up to now*. But chances are defined by the best system of the *whole* history. If the safe contains a skewed string, the best system of the whole history isn't $H$. So you're deferring to a local approximation, not the true chance. And since you know there's a non-zero probability the safe contains a skewed string, you must discount your credence below 0.5. That's where my 0.499 comes from. The missing mass goes to the possibility that the chance function itself is different.'

  'So you're saying the class of histories that falsify $H$ has significant total chance?' Nadia asked.

  'Not significant in magnitude, but significant in principle,' Callum said. 'If fit is a matter of degree, a merely persistently skewed string, not an outlandish one, might be enough to tip the balance to a different system. If the bias is small but consistent, $H$ loses its title. The sum of probabilities of all such undermining histories isn't zero.'

  'And if I concede that sum is non-zero but negligible?' Nadia challenged. 'Does it change what you do? You're offering 49.9 pence. I'm offering 50. The difference is vanishing.'

  'Practically, no,' Callum admitted, rubbing his temple. 'I won't become rich off this discrepancy. But principled epistemology isn't about getting rich on quantum coins. It's about coherence. If you say credence equals chance, but your metaphysics allows chance to be undermined by the very events you're credencing, you have a leak in the hull.'

  'We could plug the leak by abandoning Humean supervenience,' Nadia suggested. 'If chance were an irreducible modal posit, not read off the pattern, then the outcomes couldn't falsify the chance hypothesis. The chance would be 1/2 even if the coin landed heads 3,600 times.'

  'And that costs us a naturalistic metaphysics,' Callum said. 'We'd be positing spooky modal forces. I'd rather keep the leak than buy the patch.'

  'As would I,' Nadia agreed. 'So we are stuck with Humean chance. But I maintain the reformulated principle saves us. Conditionalising on $T_w$ isolates the chance fact from the outcome fact for the purpose of credence assignment.'

  'It's empty,' Callum said. 'No agent ever occupies that conditional when a decision is required. We always condition on our evidence, and our evidence is compatible with multiple chance hypotheses. To condition on $T_w$ is to assume we know the chance theory is true independently of the outcomes, which we don't.'

  'Then it's a regulative ideal,' Nadia said. 'It tells us how to scale our credences relative to the theory we accept. You're demanding a psychological impossibility.'

  'I'm demanding metaphysical consistency,' Callum corrected. 'But fine. I concede the difference between 0.5 and 0.499 will never change what I actually do. In any realistic betting scenario, the transaction costs swallow the discrepancy. I'm betting on a principle, not a payout.'

  'And I concede,' Nadia said, 'that the admissibility clause treats a fixed-but-unknown outcome differently from a genuinely open one only by stipulation. There is no metaphysical line there, only an epistemic one. I draw the line where utility demands it.'

  'So we agree the maths works, but disagree on what it represents,' Callum said.

  'We agree the ship floats,' Nadia replied. 'You just insist on counting the water in the hold.'

  'The crux,' Callum said, looking at the safe, 'is that for a Humean, the chance is not a guide to truth until the truth is known, so it cannot guide credence beforehand without circularity.'

  'The crux,' Nadia countered, 'is that without deference, credence loses its normative anchor to the world, leaving us with mere guessing disguised as rigour.'
