answer: |-
  # EXAM: EPISTEMIC UTILITY THEORY
  **Time Allowed:** 90 Minutes
  **Level:** First-Year Graduate Seminar

  **Instructions:** Answer both parts. You do not need to cite specific authors or papers. All necessary technical definitions are provided below. Be precise. In Part (b), show your arithmetic.

  **Definitions:**
  *   **Credence Function ($c$):** Assigns a number between 0 and 1 to each possible world in a set $W$.
  *   **Probabilism:** $c$ is probabilistic if the sum of credences across all mutually exclusive and exhaustive worlds equals 1.
  *   **Brier Score:** A measure of inaccuracy. For a world $w$ and credence function $c$, the Brier Score is $BS(c, w) = \sum_{x \in W} (c(x) - v_w(x))^2$, where $v_w(x)$ is 1 if $x$ is the actual world and 0 otherwise. (Lower is better).
  *   **Dominance:** Credence function $c^*$ dominates $c$ if $BS(c^*, w) \leq BS(c, w)$ for all worlds $w$, and strictly less for at least one.
  *   **Expected Accuracy:** The expected accuracy of a future credence function $c_{new}$, calculated from the perspective of a current credence function $c_{old}$, is $\sum_{w \in W} c_{old}(w) \times [-BS(c_{new}, w)]$.

  ---

  ### Part (a): Conceptual (12 Marks)
  The accuracy-first program argues for Probabilism using a **Dominance Norm** (do not adopt a credence function that is accuracy-dominated), but argues for Conditionalization using an **Expected Accuracy Norm** (adopt the update rule that maximizes expected accuracy).

  Explain why the Dominance Norm is sufficient for Probabilism but fails for Conditionalization. Why must the accuracy-first theorist switch to Expected Accuracy to defend Conditionalization? Finally, explain what substantive assumption is required to calculate Expected Accuracy that was *not* required for the Dominance argument, specifically regarding whose credences are used to weight the expectation.

  ### Part (b): Calculation (8 Marks)
  Let there be three possible worlds: $W = \{w_1, w_2, w_3\}$.
  1.  **Incoherence:** Consider an agent with credences $c(w_1)=0.5, c(w_2)=0.5, c(w_3)=0.5$. Show via Brier Score calculation that this function is dominated by the coherent uniform function $p(w_1)=0.33, p(w_2)=0.33, p(w_3)=0.33$ (round to two decimals: 0.33). Calculate the score for both $c$ and $p$ in world $w_1$.
  2.  **Updating:** Suppose the agent learns evidence $E$ that rules out $w_3$ (so $E = \{w_1, w_2\}$). The agent considers two update policies:
      *   **Cond:** Conditionalize on $E$ using prior $p$.
      *   **Stub:** Stay stubborn. Keep the original credences renormalized over the remaining worlds arbitrarily, such that $c_{stub}(w_1) = 0.8, c_{stub}(w_2) = 0.2$.
      *   Calculate the **Expected Brier Score** of both policies ($Cond$ and $Stub$) from the perspective of the **prior** $p$. Show that $Cond$ yields a lower (better) expected score than $Stub$.

  ---

  # MODEL ANSWER

  ### Part (a)
  The distinction between the Dominance Norm and the Expected Accuracy Norm turns on the difference between objective guarantee and subjective projection.

  To defend Probabilism, we compare a fixed incoherent credence function against a fixed coherent alternative across all possible worlds. Because incoherence (like summing to 1.5) creates mathematical slack, we can prove that a coherent alternative is closer to the truth values (0 or 1) in *every* possible world. This argument requires no assumptions about how likely the agent thinks each world is. It holds even if the agent's credences are wild delusions. The dominance argument is "world-centric"; it says, "No matter how the world turns out, this alternative is better."

  This machinery breaks for Conditionalization. Conditionalization is a rule for *changing* credences over time. To show that Conditionalization is better than, say, staying stubborn, we cannot compare them state-by-state in the same way. Whether Conditionalization is more accurate than Stubbornness depends on which evidence you get. If you get evidence $E$, Conditionalization moves you to $c(\cdot|E)$. If you don't, you stay put. A dominance argument would require showing that Conditionalization is more accurate than Stubbornness in *every* world regardless of evidence. But in a world where your evidence is misleading, or where the "stubborn" move happens to match the truth by luck, Conditionalization might lose in that specific state. There is no state-by-state dominance of one update rule over another.

  Therefore, we must switch to Expected Accuracy. We ask: "Which update rule looks best from where I am sitting now?" We calculate the average accuracy of the future credences, weighted by how likely I currently think each world is.

  This switch incurs a cost: the **Perspective Problem**. In the dominance argument for Probabilism, we did not need to trust the agent's credences to weight the worlds; the math held regardless. In the Expected Accuracy argument for Conditionalization, we *must* use a probability function to weight the expectation. Standard accuracy-first theory dictates we use the **agent's own current credences** to calculate this expectation.

  This assumes the agent's current credences are the correct guide to probability for the sake of decision-making. It assumes the agent is "immodest"—that they should trust their own current probability assignments enough to use them as the weights for evaluating future policies. If we used a different weighting (e.g., the "true" objective chances, which the agent doesn't know), the result might differ. Thus, while Probabilism is defended by an objective mathematical guarantee, Conditionalization is defended by a subjective optimization that relies on the normative authority of the agent's current mind.

  ### Part (b)

  **1. Dominance Calculation (World $w_1$)**
  Truth values at $w_1$: $v(w_1)=1, v(w_2)=0, v(w_3)=0$.

  *   **Incoherent $c$:** $(0.5, 0.5, 0.5)$
      $$BS(c, w_1) = (0.5 - 1)^2 + (0.5 - 0)^2 + (0.5 - 0)^2$$
      $$= (-0.5)^2 + (0.5)^2 + (0.5)^2$$
      $$= 0.25 + 0.25 + 0.25 = \mathbf{0.75}$$

  *   **Coherent $p$:** $(0.33, 0.33, 0.33)$
      $$BS(p, w_1) = (0.33 - 1)^2 + (0.33 - 0)^2 + (0.33 - 0)^2$$
      $$= (-0.67)^2 + (0.33)^2 + (0.33)^2$$
      $$= 0.4489 + 0.1089 + 0.1089 \approx \mathbf{0.67}$$

  Since $0.67 < 0.75$, $p$ is more accurate at $w_1$. (By symmetry, $p$ dominates $c$ in all worlds).

  **2. Updating Calculation**
  Evidence $E$ rules out $w_3$. We evaluate policies from the perspective of prior $p$.
  Prior $p$: $w_1 (0.33), w_2 (0.33), w_3 (0.33)$.
  Note: Since $w_3$ is ruled out by evidence, we only care about expected accuracy in worlds compatible with $E$ ($w_1, w_2$), but we weight them by the prior probability *that we are in those worlds*.

  *   **Policy Cond:** Conditionalize on $E$.
      $$p(w_1|E) = 0.33 / (0.33+0.33) = 0.5$$
      $$p(w_2|E) = 0.5$$
      New Credence $c_{cond} = (0.5, 0.5, 0)$.

      *Expected BS of Cond (from perspective of $p$):*
      We sum over $w_1, w_2$ (since $p(w_3)=0.33$, but if $w_3$ is actual, $E$ is false, so the policy isn't triggered. Standard framing assumes we calculate expectation over the partition where $E$ is learned. Simpler: Calculate expected inaccuracy of the *resulting* credence function weighted by the prior probability of the worlds where that result occurs).
      Actually, the standard calculation is: What is the expected inaccuracy of the *output* of the rule?
      If $w_1$ is actual (prob 0.33), $c_{cond} = (0.5, 0.5, 0)$. $BS = (0.5-1)^2 + (0.5-0)^2 + 0 = 0.5$.
      If $w_2$ is actual (prob 0.33), $c_{cond} = (0.5, 0.5, 0)$. $BS = (0.5-0)^2 + (0.5-1)^2 + 0 = 0.5$.
      $$ExpBS(Cond) = 0.33(0.5) + 0.33(0.5) = \mathbf{0.33}$$

  *   **Policy Stub:** $c_{stub} = (0.8, 0.2, 0)$.
      If $w_1$ is actual (prob 0.33): $BS = (0.8-1)^2 + (0.2-0)^2 = 0.04 + 0.04 = 0.08$.
      If $w_2$ is actual (prob 0.33): $BS = (0.8-0)^2 + (0.2-1)^2 = 0.64 + 0.64 = 1.28$.
      $$ExpBS(Stub) = 0.33(0.08) + 0.33(1.28) = 0.0264 + 0.4224 = \mathbf{0.45}$$

  **Conclusion:** $0.33 < 0.45$. Conditionalization minimizes expected Brier Score relative to the prior $p$.

  ---

  # MARKING SCHEME (Total 20)

  ### Part (a): Conceptual (12 Marks)

  | Point | Marks | Must-Hit Requirement | Common Wrong Answer |
  | :--- | :---: | :--- | :--- |
  | **1** | 3 | **Dominance Definition:** Must state dominance requires being better in *every* world/state independently of weights. | "Dominance means being better on average." |
  | **2** | 3 | **Failure of Dominance for Updating:** Must explain that update rules cannot be compared state-by-state because the "best" move depends on the evidence received. | "Dominance fails because we don't know the future." (Too vague). |
  | **3** | 3 | **Expectation Requirement:** Must state that Expected Accuracy requires weighting outcomes by probabilities. | "Expectation is just guessing the future." |
  | **4** | 3 | **The Perspective/Whose Credences Flag:** Must explicitly state that the weights used are the **agent's own current credences**, and that this assumes current credences are trustworthy (Immodesty). | "We use the true objective chances as weights." |

  ### Part (b): Calculation (8 Marks)

  | Point | Marks | Must-Hit Requirement | Common Wrong Answer |
  | :--- | :---: | :--- | :--- |
  | **5** | 2 | **Incoherent BS:** Correctly calculates $BS(c, w_1) = 0.75$. | Forgetting to square the differences. |
  | **6** | 2 | **Coherent BS:** Correctly calculates $BS(p, w_1) \approx 0.67$ and notes domination. | Comparing sums of credences instead of Brier scores. |
  | **7** | 2 | **Conditionalization Math:** Correctly derives $c_{cond} = (0.5, 0.5)$. | Renormalizing incorrectly (e.g., keeping 0.33). |
  | **8** | 2 | **Expectation Math:** Correctly weights the BS of the *new* credences by the *prior* probabilities to show Cond < Stub. | Weighting by the *new* credences or ignoring weights entirely. |

  ### The "Whose Credences" Flag
  **Yes, Point 4 is a Must-Hit.**
  In the marking scheme above, Point 4 (3 marks) is dedicated to this. If the student says "we calculate expectation" but fails to specify that the weights come from the *agent's own prior*, they miss the philosophical cost. The accuracy-first argument for Conditionalization collapses if you aren't allowed to use the agent's own flawed credences to prove they should update. That circularity is the "cost" the question asks for.

  ### The Most Costly Mistake
  **The mistake that will cost you the most marks is conflating Dominance with Expectation in Part (a).**

  Specifically: Writing that "Conditionalization is dominated by other rules" or "Conditionalization dominates other rules."
  *   **Why:** This proves you missed the entire crux of the prompt. Probabilism is about *static* coherence (where dominance works). Conditionalization is about *dynamic* rules (where dominance fails and expectation is needed). If you try to run a dominance argument for Conditionalization, you demonstrate that you haven't grasped why the two norms are distinct tools for two different jobs. This error undermines Points 1, 2, and 3 simultaneously.

  ---

  # A NOTE FROM THE "PROF"
  You asked me to flag the "whose credences" issue. Your gut was right. In the dominance argument for Probabilism (Joyce's Theorem), we don't care what the agent believes; the math proves they are wrong regardless. In the Expected Accuracy argument for Conditionalization (Greaves & Wallace style), we essentially tell the agent: "If you trust your current probabilities enough to use them as weights, you should conditionalize." If they don't trust their current probabilities, the argument loses its normative grip on *them*. That shift from "You are objectively wrong" to "You should do this given what you currently believe" is the price of admission for the dynamic norm.

  Good luck. Grade yourself harshly. If you didn't write down "agent's own current credences" in Part (a), you didn't answer the question.
