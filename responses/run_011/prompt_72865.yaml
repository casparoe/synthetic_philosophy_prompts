answer: |-
  ### Design brief
  This pair isolates whether cultural variables function as causal switches or post-hoc labels. Case A must show values directing action against immediate material interest (the "interest-reversal trace"), verified independently of the outcome. Case B must show a cultural explanation that collapses into a description of the outcome itself. Cheating occurs if I stipulate away material differences without verification, or if the "cultural" factor smuggles in hidden incentives like reputation or long-term profit maximization. The goal is not to prove culture is always causal, but to show what genuine causal work would look like compared to redundancy.

  ### Case A
  Two mid-sized construction firms operate in the same city under identical zoning laws and labor contracts, verified via municipal permits and union logs. Firm A is owned by a sectarian group holding a theological belief that "a spoken price is a covenant before God," while Firm B is secular. When lumber prices spike 40% unexpectedly between verbal quote and contract signing, Firm A absorbs the cost, posting verified net losses on those projects. Firm B invokes standard clauses to renegotiate. The interest-reversal trace is Firm A's loss-taking: standard incentive models predict renegotiation to preserve capital, but the cultural commitment overrides this, corroborated by internal memos citing religious obligation rather than client retention.

  ### Case B
  Two software firms in the same incubator pursue different strategies: Firm C pivots to high-risk AI development, Firm D sticks to legacy security systems. Observers later attribute C's success to a "culture of innovation" and D's stability to a "culture of caution." Background conditions like founder education are matched, but audit trails reveal C secured a non-replicable government grant D lacked, making the pivot financially viable only for C. The cultural labels are assigned only after the strategic outcomes are known; had C failed, the same behavior would be labeled "recklessness." The supposed value difference is recoverable only from the outcome difference itself, offering no independent predictive power.

  ### Two readings of each case
  The Weberian account argues Case A demonstrates values acting as switches: material interests (profit preservation) provided the engine, but cultural commitments determined the track, evidenced by the interest-reversal trace where values overridden incentives. In Case B, the Weberian admits the cultural label is empty; it describes the track but did not switch it. The rational-choice skeptic argues that in Case B, the "culture" is entirely redundant; the grant explains the action, and the cultural label is mere storytelling. Regarding Case A, the skeptic contends the "religious obligation" is either a disguised long-term reputation investment or an effect of prior wealth allowing such generosity. However, the skeptic's account matches Case B perfectly because there is no trace where values contradicted interests; the "culture" floats freely, attached only to the winner. In Case A, the skeptic must deny the trace or find a hidden variable, whereas in Case B, the hidden variable (the grant) is visible, confirming the cultural explanation was vacuous.

  ### The load-bearing feature
  The single feature separating causation from redescription is the **interest-reversal trace**. In Case A, the cultural hypothesis predicts loss-taking while the incentive hypothesis predicts renegotiation; the observed action corroborates the cultural variable independently of the outcome's success. In Case B, the cultural hypothesis and incentive hypothesis align (or the incentive is unknown), so the cultural label is applied post-hoc to fit the result. If you remove the trace from Case A—if Firm A also renegotiated but claimed it was "God's will"—the cultural variable becomes indistinguishable from Case B's redundancy. The trace forces the value to have "cost," proving it is not merely a shadow of the interest.

  ### The skeptic's best attack on Case A
  The skeptic's strongest charge is **endogeneity**: the cultural commitment is not a cause but an effect of unmeasured material conditions. Perhaps Firm A's owners are wealthier than recorded, allowing them to afford "honor" as a luxury good, or perhaps the sectarian group enjoys hidden subsidies (e.g., cheap labor from community members) that offset the losses. Another attack targets the "no disguised incentive" constraint: the skeptic argues that honoring quotes builds long-term trust within the sect, yielding future contracts that outweigh the immediate loss, making it rational utility maximization after all. Case A replies by pointing to the internal memos and the one-off nature of the clients, but the skeptic maintains that unless *all* future reputational benefits are ruled out—which is empirically impossible—the value remains reducible to preference. This highlights a genuinely contested point in the literature: whether "meaning" can ever be fully disentangled from "utility."

  ### Where this design may be cheating
  The design risks manufacturing the verdict by stipulating the "verification" of background conditions too cleanly. In reality, checking "identical supply chains" or "no hidden subsidies" is fraught with measurement error; I have assumed away the noise where hidden incentives usually hide. Additionally, by specifying that Firm A's memos cite religion, I may be privileging the actors' self-understanding over the skeptic's structural analysis, effectively stipulating the causal mechanism rather than letting it emerge from the data. Finally, the "one-off" client constraint in Case A is artificial; real markets are iterative, making the separation of immediate loss from long-term gain difficult to sustain without arbitrary boundaries.
