answer: |-
  Good evening. Thank you for having me back.

  It's a little intimidating to stand here. For one thing, the program booklet is already printed, so if I mess this up, there's a permanent record of it. For another, my dad is sitting in the third row. He knows when I'm stretching the truth. He's known since I was six years old and tried to tell him I'd fed the chickens when I'd actually just opened the coop door and hoped for the best. So, I'm not going to try to sell you a story I don't believe, because he'd catch it, and honestly, so would I.

  The Historical Society asked me to talk about how farming changed everything. They also asked me to keep it to ten minutes and make everyone feel good about the weekend. That is a tall order for an anthropologist. We tend to specialize in complicating things. And right there on the table next to me is the society's prize artifact: a seed-corn basket from the 1870s. It's a beautiful thing. It represents survival. It represents ingenuity. But if you ask a bone specialist what happened to the people who filled baskets like that, the answer isn't simple.

  You've probably heard the argument. Maybe you read it in a magazine in the eighties, the one that made the rounds at every kitchen table from here to Champaign. The idea that agriculture was the biggest mistake in human history. The theory goes that before farming, people were healthier, taller, and had more free time. Then we started planting seeds, and our bodies fell apart.

  As someone who has spent the last four years looking at exactly that evidence, I can tell you: the bones don't lie. When people switch to heavy dependence on domesticated crops, stature often drops. Teeth decay faster because of the starch. Infectious diseases spread easier when you're living in dense settlements next to your animals. And the work week? It gets longer. Much longer.

  Now, I know what some of you are thinking. You're thinking, "Great, come home for the sesquicentennial and tell us our great-grandparents walked into a trap."

  But here is the thing that the magazine articles usually miss, and it's the reason I'm not standing here to apologize for farming. The mistake question doesn't really get off the ground, because nobody made the decision.

  There was no town hall meeting where the ancestors voted to switch to agriculture. There was no moment where someone said, "Let's trade our health for bushels." It happened like water wearing down a stone. A few weeds tolerated near a camp. A stand of grain protected because it looked useful. A few more mouths to feed. A season where the hunting was poor, so the stored grain saved you.

  Every individual step was locally sensible. Every individual step made sense at the time. But with every step, the exit quietly narrowed. You can't go back to foraging once the population grows to match the crop yield. You can't go back to moving around once you've built a barn. Each generation was better off than the one before by their own lights—they survived the winter, they fed the kids—and worse off by some longer-run standard they couldn't see. There was no moment at which anyone could have chosen otherwise.

  This isn't just about the past. It's about why we are here tonight.

  We like to talk about progress like it's a straight line up. But often, it's a lock-in. It's a series of choices that make sense in the moment but build a structure you can't easily leave. And I don't say this to criticize the people who built that structure. I say it because I see my own family living inside that same mechanism.

  My cousin farms three thousand acres not far from here. He's a good farmer. He knows the soil better than he knows the faces of some of his own kids. Last month, he was in an ugly fight with half the township over whether to sign a solar lease on ground his great-grandfather broke with a walking plow. It wasn't because he wanted to stop farming. It was because the math of farming changed again. There's debt. There's consolidation. There's a new seed trait every few years that everyone adopts because not adopting it costs you the year.

  He didn't choose the system he's in. He inherited it, just like he inherited the land. And just like our ancestors who protected that stand of grain because they needed the calories, my cousin makes the choices that keep the operation solvent today, even if those choices narrow the path for tomorrow.

  There's a theory that foragers worked fewer hours than farmers. I believe it. I have never met a hunter-gatherer who had to explain to a bank loan officer why the yield was down because of hail.

  That's the lock-in. It's not a moral failure. It's a structural reality. When the Historical Society asks me to talk about how farming changed everything, the honest answer is that farming changed the rules of the game so that you couldn't stop playing.

  I know this room is full of people who love this land. I know there are FFA kids in the front row who are learning to judge livestock and manage accounts before they can vote. I know there are people here who remember when a hundred acres was a big farm and now it's a garden patch. It is tempting to look at that seed-corn basket and see only triumph. It is also tempting to look at the bones and see only tragedy.

  But neither of those views is useful. If we think it was all triumph, we ignore the cost. We ignore the health, the labor, the inequality that settled in alongside the surplus. If we think it was all tragedy, we insult the people who did the work. We insult the generations who looked at a harsh world and found a way to make it hold still long enough to feed their children.

  My dissertation is about health in early farming communities. But what I'm actually studying is how people adapt to constraints they didn't choose. That's not just archaeology. That's central Illinois.

  I'm not standing here to convert anybody. I'm not here to tell you to put down the plow or sign the lease or fight the consolidation. I don't have the answers for my cousin, and I certainly don't have them for you. The lock-in is real. The pressures are real. The bones show us that the cost of stability is often paid in physical currency.

  But there is dignity in recognizing the trap. There is strength in knowing that you are walking a path that was narrowed long before you put on your boots. When we celebrate this sesquicentennial, we shouldn't just celebrate the turning of the prairie. We should acknowledge the weight of it.

  The seed-corn basket on the table is empty. It's an artifact. But the structure it represents is still active. It's in the debt loads, it's in the zoning meetings, it's in the decision to plant corn instead of soy because the market shifted in February. We are still protecting that stand of grain. We are still narrowing the exit.

  So, enjoy the banquet. Enjoy the plowing demonstration tomorrow. Watch the replica walking plow turn the soil and appreciate the muscle it took to push the real thing. But don't let the celebration fool you into thinking it was easy, and don't let the science fool you into thinking it was a mistake. It was just the only way forward they could see. And for us, looking at the fields from the highway, it's still the only way forward we've got.

  Thank you.
