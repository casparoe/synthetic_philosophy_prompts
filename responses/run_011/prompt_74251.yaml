answer: |-
  **MEMORANDUM**

  **TO:** Public Art Commission
  **FROM:** [Your Name]
  **DATE:** October 1, 2023
  **SUBJECT:** Recommendation Regarding Untitled Clay Sculpture (1974)

  **Recommendation**
  I recommend the Commission adopt Option Three: gradual consolidation via progressive substitution over eighteen months, with the work remaining on view throughout. This path best honors the deed of gift's commitment to preserve "the sculpture itself" by maintaining the continuity of the object's presence, even as its material constitution changes.

  **Ontological Assumptions**
  This recommendation rests on three explicit assumptions. First, the work is not identical to the specific atoms of clay and burlap installed in 1998, but rather to the sustained configuration and public encounter those materials facilitate. Second, there is a threshold of replacement—likely exceeding 50%—beyond which the work ceases to be itself; Option Three stays below this threshold by retaining the original armature geometry and surface topology, whereas Option Four abandons them entirely. Third, the Commission, in consultation with the conservator, holds the primary authority to define "the work" for purposes of public stewardship, subordinate only to statutory moral rights and the deed of gift.

  **The Estate's One-Tenth Clause (Option Two)**
  Regarding Option Two, the estate's requirement that one-tenth of the original material be ground and kneaded into the successor is ceremonial, not philosophical. Once the original clay is ground and kneaded, it loses its structural identity and becomes a relic additive, akin to ground saint's bone in a wax candle. Whether this tenth is concentrated in the base or dispersed throughout makes no ontological difference; the form dictates the work, not the distribution of the relic dust. This clause provides a ritual bridge for the estate but does not secure the identity of the work any more effectively than Option Three.

  **Counter-Argument**
  I must address the strong objection raised by two colleagues: that Option Three differs in kind from Option Two, not merely in speed. They argue Option Two is an honest resurrection—a new object inheriting the name—while Option Three is a deception that masks the death of the original behind a veil of continuous presence. They contend that substituting matter while the piece remains on the plinth creates a philosophical fraud, violating the public's trust that what they view is the 1974 artifact. This view holds that identity is tied to the historical trajectory of the specific matter, and that slowing the substitution does not change the fact of replacement. I acknowledge this argument is coherent and morally weighty. If identity is strictly material, Option Three is indeed a slow lie.

  **Legal and Premise Risks**
  Our counsel has not yet confirmed whether moral rights of integrity survive the artist's death in this jurisdiction. We must proceed acknowledging that the estate could sue to halt Option Three as a distortion. Furthermore, this recommendation rests on a premise I believe quite possibly false: that continuity of appearance outweighs continuity of matter. If the courts or the public decide that the "original fabric" insured in our schedule refers to the specific clay molecules rather than the form, Option Three may trigger a default on our insurance or the deed of gift. We are betting that the spirit of the gift outweighs the letter.

  **Schedule**
  1.  **November 14:** Commission vote to authorize Option Three.
  2.  **December 1:** Notify estate and insurer of intent; initiate legal review of moral rights.
  3.  **January – June:** Phase One stabilization (armature reinforcement, 20% material substitution).
  4.  **July – December:** Phase Two consolidation (remaining substitution, surface sealing).
  5.  **January (Following Year):** Final review and updated accession record noting the intervention.

  We cannot save the clay. We can only save the encounter. Option Three allows the public to witness the work's survival without removing it from the civic space it was meant to occupy.

  **[Your Name]**
  **Commissioner**
