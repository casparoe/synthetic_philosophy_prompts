      *   *Step 3 (Causal Patching):* This is the crux. Patch activations from $M_{old}$ to $M_{new}$ (or vice versa) at the monitor's location. *Evidence:* Activation Patching / Causal Mediation. *Pass:* Intervention effect size is consistent.
      *   *Step 4 (Monitor Output):* Run the classifier itself. Does it flag the same inputs? *Evidence:* ROC-AUC comparison on a held-out set.

