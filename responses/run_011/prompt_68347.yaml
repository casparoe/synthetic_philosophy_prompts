          2.  The Three Case Runs.
          3.  The Limitations (The "What this is really tracking" section).

  8.  **Refining the "Dressed-up Judgment Calls":**

      *   Thresholds (e.g., "0.8 correlation") are risk tolerances, not natural kinds.
