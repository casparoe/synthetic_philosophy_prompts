      *   **Constraints:** Executable by researchers competent with SAEs but not philosophy. Legible to non-specialist sign-offs (Head of Safety, Model-Approval Committee).

  2.  **Analyze the Core Tension:**

      *   *Philosophical Friend:* Mechanism = Causal Role. If the role is filled, it's the same mechanism, regardless of implementation details.
      *   *User (Practitioner):* Mechanism = Specific Features/Weights. If features don't match, we can't trust the monitor.
      *   *Reality:* We can't prove "sameness." We can only measure "stability of correlation and causal leverage." The procedure must bridge the gap between "Is it the *same*?" (ontological) and "Does the monitor still *work*?" (operational).
      *   *Key Insight:* The sign-off committee doesn't care about metaphysics. They care about *risk*. The procedure shouldn't decide "Is this the same mechanism?" It should decide "Is the risk profile of using this monitor on the new model within acceptable bounds?"

  3.  **Drafting the Decision Procedure (The "Transfer Protocol"):**

      *   *Goal:* 0.5 days max. Needs to be automated or semi-automated.
      *   *Inputs:* Old Checkpoint ($M_{old}$), New Checkpoint ($M_{new}$), Monitor ($K$), Test Suite ($T$).
      *   *Step 1: Behavioural Baseline.* Does the bad behaviour still exist? If it's gone, the monitor is irrelevant (but maybe we need to know *why*). If it's worse, we need to know if the monitor catches it.
      *   *Step 2: Activation Stability.* Do the monitor's input features fire similarly? (Distribution shift check).
      *   *Step 3: Causal Leverage (Patching).* If we intervene on the features the monitor uses, does the behaviour change in $M_{new}$ like it did in $M_{old}$?
      *   *Step 4: Adversarial/Out-of-Distribution Check.* Does the monitor fail on edge cases?
      *   *Escalation:* When metrics are ambiguous.
      *   *Dressed-up Calls:* Thresholds (e.g., "80% correlation") are arbitrary risk tolerances.

  4.  **Refining the Steps (Iterative Polish):**

      *   *Step 1 (Behaviour):* Measure the base rate of the concealed goal behaviour in $M_{new}$. *Evidence:* Behavioral eval suite. *Pass:* Rate is within confidence interval of $M_{old}$ OR Rate is 0 (but verify Step 3).
