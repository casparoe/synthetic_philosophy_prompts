      *Assumption for Procedure:* To make this work in 0.5 days, we must assume we can project $M_{new}$ activations into the $M_{old}$ feature space (using the old SAE encoder) OR we have a robust feature matching pipeline. Let's assume the latter: we match new SAE features to old SAE features to feed the existing classifier.
      *Actually, simpler interpretation:* The "monitor" is the *system* (SAE + Classifier). The question is: Can we use the *same logic*?
      *Best Practical Interpretation:* We have a set of features $F_{old}$ that predict scheming. We train $SAE_{new}$. We find $F_{new}$ that correspond to $F_{old}$. We check if $F_{new}$ predict scheming in $M_{new}$.
