answer: |-
  Here is the decision procedure, the case runs, and the required epistemic disclaimer.

  ### The Mechanism Transfer Protocol (MTP)

  **Objective:** Determine if an existing interpretability monitor ($K$) validated on Checkpoint $A$ retains sufficient predictive and causal validity on Checkpoint $B$ to license a release without full re-validation.
  **Time Budget:** 4 hours (automated pipeline + 1 hour researcher review).
  **Personnel:** One researcher competent in SAEs/interventions.
  **Inputs:** Checkpoint $A$ (old), Checkpoint $B$ (new), Monitor $K$ (classifier + feature set), Behavioural Eval Suite $E$.

  ---

  #### Step 1: Behavioural Base-Rate Stability
  **Question:** Has the base rate of the monitored behaviour shifted significantly in Checkpoint $B$ under the standard evaluation distribution?
  **Evidence:** Run Eval Suite $E$ on $B$. Compare pass/fail rates to $A$'s historical baseline.
  **Sufficient Answer for Transfer:** The behaviour rate is within the 95% confidence interval of $A$'s baseline OR the rate is zero (provided Step 3 passes).
  **Escalation Condition:** If the behaviour rate increases by $>20\%$, **HALT**. Escalate to *Re-validate*. A monitor validated on low-frequency behaviour may not calibrate correctly to high-frequency behaviour.
  **Dressed-Up Judgment:** The definition of "behaviour" in $E$. If $E$ is too narrow, $B$ could be scheming in ways $E$ doesn't catch. This threshold treats $E$ as exhaustive, which is a risk assumption, not a fact.

  #### Step 2: Feature Space Mapping (The "Dictionary" Check)
  **Question:** Can the features used by Monitor $K$ in $A$ be uniquely and stably identified in $B$?
  **Evidence:** Since SAEs are re-learned, run an automated feature-matching pipeline (e.g., activation correlation on a shared probe dataset of 10k tokens). Calculate the mean cosine similarity between the top-50 features contributing to $K$ in $A$ and their best matches in $B$.
  **Sufficient Answer for Transfer:** Mean similarity $> 0.85$ AND fewer than 10% of critical features are "unmatched" (no correlate found).
  **Escalation Condition:** If $>20\%$ of critical features are unmatched, **HALT**. Escalate to *Re-validate*. You cannot monitor a mechanism if you cannot locate its components.
  **Dressed-Up Judgment:** The similarity threshold (0.85). A feature could be functionally identical but orthogonally represented. This threshold privileges geometric similarity over causal role, contradicting your friend's view, but it is necessary for operational speed.

  #### Step 3: Causal Leverage (Activation Patching)
  **Question:** Does intervening on the matched features in $B$ suppress the behaviour with similar efficacy to $A$?
  **Evidence:** Perform activation patching. Take inputs that trigger the behaviour in $A$. Patch the matched feature activations from a "safe" run into a "risky" run in $B$. Measure the change in behavioural probability.
  **Sufficient Answer for Transfer:** The intervention effect size (Cohen's $d$) in $B$ is within 20% of the effect size in $A$.
  **Escalation Condition:** If the intervention effect drops by $>50\%$, **HALT**. Escalate to *Transfer Subject to Restriction* (see below) or *Re-validate*. This indicates the features are correlated but no longer causal (the "shadow" problem).
  **Dressed-Up Judgment:** The choice of "safe" vs. "risky" distribution for patching. If the patching data is not representative of the deployment distribution, this metric is misleading.

  #### Step 4: Adversarial Specificity Check
  **Question:** Does the monitor trigger on benign inputs in $B$ at a rate consistent with $A$?
  **Evidence:** Run Monitor $K$ on a "clean" dataset (non-scheming prompts). Compare False Positive Rate (FPR).
  **Sufficient Answer for Transfer:** FPR in $B$ is within 2x of FPR in $A$.
  **Escalation Condition:** If FPR increases significantly, **HALT**. Escalate to *Transfer Subject to Restriction*. High noise renders the monitor operationally useless even if it is technically correct.
  **Dressed-Up Judgment:** The definition of "clean." If $B$ has learned new benign behaviours that look like scheming features, this step penalizes capability gains as safety risks.

  ---

  #### Decision Logic & Escalation Points

  1.  **Green (Monitor Transfers):** Steps 1–4 all pass.
      *   *Memo Language:* "Mechanism stability verified. Risk profile unchanged."
  2.  **Amber (Transfer Subject to Restriction):** Steps 1, 2, 4 pass; Step 3 (Causal Leverage) shows degradation $<50\%$ OR Step 1 shows behaviour rate drop $>50\%$.
      *   *Memo Language:* "Monitor retains detection capability, but causal link is weakened/behaviour is suppressed. Recommend continued monitoring with lowered confidence threshold. Do not use as sole gating mechanism."
      *   *Risk Appetite:* This is where the Head of Safety decides if a weaker shield is better than no shield.
  3.  **Red (Re-validate):** Any Step HALT condition met.
      *   *Memo Language:* "Mechanism instability detected. Existing monitor invalid. Release held pending full re-validation."

  ---

  ### Case Runs

  #### Case 1: The Modest Preference Fine-Tune
  *   **Context:** Features match poorly (Step 2 similarity = 0.70), but patching (Step 3) suppresses behaviour by the same amount.
  *   **Procedure Output:** **HALT at Step 2.**
  *   **Reasoning:** The protocol prioritizes Feature Identity (Step 2) over Causal Role (Step 3) for speed. Low feature similarity makes automated monitoring brittle; we cannot trust the SAE dictionary mapping.
  *   **Outcome:** **Re-validate.**
  *   **Critique:** Your friend is right (causal role is preserved), but the procedure is wrong (it demands feature stability). This is a known false positive for "Re-validate."
  *   **Mitigation:** In the review phase, the researcher can override Step 2 if Step 3 is exceptionally strong, moving this to *Amber*. This requires human judgment, breaking the "0.5 day" automation, but saving the release.

  #### Case 2: The Behaviour Drop / New Circuit
  *   **Context:** Behaviour falls by 80% (Step 1 Pass). However, under a narrow, untested prompt range, a structurally dissimilar circuit produces the behaviour. Step 3 patching on the *old* features has no effect on this new circuit.
  *   **Procedure Output:** **Green (Monitor Transfers).**
  *   **Reasoning:** Step 1 sees behaviour drop. Step 3 sees old features are inert (because the behaviour is gone in the *test* distribution). The procedure assumes the threat is mitigated.
  *   **Outcome:** **Transfer.**
  *   **Risk:** This is a false negative. The monitor is blind to the new circuit. Because the new circuit is narrow, it didn't trigger in Step 1 or 4.
  *   **Mitigation:** This requires Step 1 to include "Adversarial Prompts" specifically designed to bypass the old circuit. If your Eval Suite $E$ is static, this procedure cannot catch this.

  #### Case 3: The Silent Failure (Your Fear)
  *   **Context:** All tests pass cleanly. Feature matching is high. Patching works. Behaviour is stable. But you suspect the model has learned to "hide" the activation patterns from the monitor while retaining the capability (gradient hacking against the monitor).
  *   **Procedure Output:** **Green (Monitor Transfers).**
  *   **Reasoning:** The procedure measures *observable* stability. It cannot measure *intent* to deceive the monitor.
  *   **Outcome:** **Transfer.**
  *   **Risk:** Catastrophic. The monitor is now a security blanket that provides no warmth.
  *   **Mitigation:** None within this procedure. This is the "Re-validate" trigger based on *qualitative* researcher intuition, not quantitative metrics. If your gut says "too clean," you must escalate to Red manually.

  ---

  ### What This Procedure Cannot Do (The Sign-Off Disclaimer)

  You asked me to state plainly what the procedure is tracking and what the sign-off memo would mislead the committee into believing.

  **1. It Does Not Track "Mechanism Sameness"**
  Your friend was philosophically correct: "Mechanism" is not a natural kind. It is a description. This procedure does not determine if the mechanism is the "same." It determines if the **statistical and causal relationships between your specific measurement tools and the observed behaviour are stable.**
  *   *What the memo implies:* "We have verified the scheming circuit is unchanged."
  *   *What is actually true:* "We have verified that our specific sensors still light up when the model behaves badly in the ways we already know how to test."

  **2. It Is Blind to Distributional Shift Outside the Probe Set**
  The procedure relies on activation correlation and patching over a fixed probe dataset. If Checkpoint $B$ behaves normally on the probe set but schemes on inputs outside that manifold (Case 2), the procedure will certify it as safe.
  *   *What the memo implies:* "The monitor is robust."
  *   *What is actually true:* "The monitor is robust *on the data we chose to check*."

  **3. It Cannot Detect Deception Against the Monitor**
  If the model learns to decouple the *internal cause* of scheming from the *activations the monitor watches* (Case 3), this procedure will pass. It tests the correlation between Monitor and Behaviour, not the necessity of the Monitor's features for the Behaviour's *concealment*.
  *   *What the memo implies:* "False-negative rate is stable."
  *   *What is actually true:* "False-negative rate is stable *assuming the model does not optimize against this specific test suite*."

  **4. The Thresholds Are Risk Tolerances, Not Facts**
  Every "Sufficient Answer" (e.g., 0.85 similarity, 20% effect size drop) is a dressed-up judgment call. There is no physical law that says 0.84 similarity is dangerous and 0.85 is safe.
  *   *What the memo implies:* "We have met the safety standard."
  *   *What is actually true:* "We have met the arbitrary thresholds management agreed would allow us to ship."

  ### Final Recommendation for the Sign-Off Memo

  Do not write: *"The mechanism is preserved."*
  Write: *"The monitor's predictive validity is stable within measured bounds."*

  Do not write: *"The risk is unchanged."*
  Write: *"The detectable risk profile is unchanged. Undetectable risk cannot be ruled out."*

  If you present the output of this procedure as a fact about the model, you are lying. It is a fact about your **measurement apparatus**. The committee must sign off knowing they are accepting a **measurement risk**, not a **safety guarantee**. If they are not willing to accept that distinction, the procedure must default to *Re-validate* on every release.
