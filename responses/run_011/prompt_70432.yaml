answer: |-
  There is no single established term that captures this structure in its entirety. You have identified a specific intersection of epistemic dependence, skill decay, and rational choice theory that existing literature treats only in fragments. The nearest concepts capture the *mechanism* (skill fade), the *justification* (epistemic dependence), or the *failure mode* (automation complacency), but none capture the *normative trap* you describe: that the deference is rational, the outcomes are good, yet the position is unrevisable without accepted loss.

  Below are the three nearest candidates, why they fail your exclusions, and a proposed coinage with its boundary conditions.

  ### 1. The Nearest Existing Candidates

  **A. Automation Complacency (Human Factors)**
  *   **What it carries:** This concept describes a user's reduced vigilance when a system performs reliably. It captures the erosion of monitoring capacity and the surprise when the system fails.
  *   **Where it fails:** It presupposes a *failure* of the system or a *lapse* in vigilance that leads to bad outcomes (Exclusion 1). Your case is distinct because the system does not fail, the user is not negligent, and the outcomes improve. Complacency is a bug; your structure is a feature of successful optimization.

  **B. Epistemic Dependence (Epistemology/Testimony)**
  *   **What it carries:** This covers the justification for deferring to another (human or artificial) source. It addresses the "standing condition" you mention (e.g., Hardwig's criteria for trusting experts).
  *   **Where it fails:** It treats dependence as a static justificatory state, not a dynamic process that alters the agent's capacities. It does not account for the *erosion* of the very capacity required to assess the dependence (Exclusion 3). In standard testimony models, I can always choose to stop listening; in your structure, stopping listening is cognitively costly because I have lost the ability to verify what I hear.

  **C. Cognitive Deskilling (STS / Labor Philosophy)**
  *   **What it carries:** This describes the loss of human capability due to technological mediation. It captures the "erosion of capacity" and the difficulty of reacquiring skills.
  *   **Where it fails:** It is typically tied to the reorganization of labor or the removal of agency from the worker (Exclusion 2). Your case can befall a fully autonomous agent whose job description remains unchanged. Furthermore, "deskilling" often carries a normative baggage of exploitation or degradation, whereas your case involves a rational trade-off where the user is objectively *better off* in terms of outcomes, making the "loss" invisible to standard welfare metrics.

  ### 2. Proposed Coinage: Epistemic Lock-in

  I recommend adopting **Epistemic Lock-in**.

  While "lock-in" is used in STS and economics to describe infrastructure standards (e.g., QWERTY keyboards), it is not standardly applied to the *individual agent's cognitive architecture*. By repurposing it, you retain the crucial economic/rational choice element (high switching costs) while specifying the domain (epistemic capacity).

  **Definition:**
  *Epistemic Lock-in* is a state in which an agent's reliance on an external judgment source improves immediate performance outcomes but degrades the agent's capacity to audit that source, thereby raising the cost of reclaiming epistemic independence to a level that renders reversal rationally prohibitive.

  **Why this term works:**
  1.  **Lock-in:** Captures the "rational user will decline to enter" aspect. It is not that they *cannot* withdraw, but that the cost (knowingly worse performance) creates a barrier analogous to economic switching costs.
  2.  **Epistemic:** Distinguishes it from mere operational dependency. The loss is not just of a tool, but of the *capacity to verify*.
  3.  **Neutrality:** Unlike "deskilling" or "complacency," it does not imply the user made a mistake or that the system is flawed. The system can be perfect, and the lock-in still occurs.

  ### 3. Boundary Cases and Edges

  To make the concept defensible, you must delineate where the lock-in begins and ends. Here is the conceptual geography:

  **A. Retained but Unexercised Capacity**
  *   *Verdict:* **Precondition, not Lock-in.**
  *   *Reasoning:* If the user retains the capacity but simply chooses not to use it (e.g., a senior surgeon who *could* check the aid but trusts it), they are in a state of *Epistemic Dormancy*. Lock-in requires the *erosion* of the capacity. The boundary is crossed when the cost to verify shifts from "effort" to "retraining."

  **B. Mediocre System Performance**
  *   *Verdict:* **Lock-in survives, but becomes Pathological.**
  *   *Reasoning:* If the system is mediocre, the user is still locked in (they cannot verify the errors), but the initial deference was not fully rational. Your structure is most philosophically potent when the system is *good*, because that justifies the deference. If the system is bad, the phenomenon collapses into standard "automation bias" or "deception." Lock-in is most dangerous when the system is right, because the user has no signal to trigger an exit.

  **C. Cheaply Reacquired Capacity**
  *   *Verdict:* **Not Lock-in (merely Atrophy).**
  *   *Reasoning:* If the capacity can be regained quickly without a stretch of worse performance (e.g., a language not spoken in a decade), there is no "lock." The defining feature of Lock-in is the *asymmetry*: it is easy to enter (deference improves outcomes) but hard to exit (independence requires a performance dip). If the exit cost is low, it is simple *Verification Atrophy*.

  **D. Deference to Human Experts**
  *   *Verdict:* **Structurally Identical, Mechanically Distinct.**
  *   *Reasoning:* A junior doctor deferring to a senior partner for ten years faces the same Epistemic Lock-in. They cannot audit the partner's judgment because they stopped cultivating the skill to do so.
  *   *Implication for your Project:* This suggests the concept belongs fundamentally to the **Epistemology of Testimony**, not solely to Philosophy of Technology. However, technology *accelerates* and *obscures* the lock-in. Human experts usually require dialogue (which maintains some audit capacity); machines often offer push-button outputs (which maximize erosion). You should position the term as an epistemological concept that has become urgent due to technological scaling.

  ### 4. Summary Recommendation

  Do not construct this from nothing. Anchor it against **Epistemic Dependence** (to show you are modifying the justificatory conditions) and **Lock-in Theory** (to show you are importing the switching-cost dynamic).

  Use **Epistemic Lock-in** as your primary term. It signals that you are dealing with a rational trap, not a cognitive failure. It allows you to argue that the user is not irrational for staying in the system; rather, the system has altered the rational landscape such that independence is now the "expensive" option. This fits your dissertation's focus on *reasonable* deference: deference becomes unreasonable not when the system fails, but when it succeeds too well, consuming the conditions of its own revocability.
