answer: |-
  *   **Proviso Enforcement:** Who polices the timeline for public reasons? Reply: It's an ethical duty, not legal.
  *   **Burdens of Judgment:** Is this epistemological skepticism? Reply: It's political, not metaphysical.
  *   **Historical Vindication:** Does success determine reasonableness? Reply: No, willingness to cooperate does.
  *   **Module Compatibility:** What if doctrines conflict? Reply: Then they aren't reasonable doctrines.
  *   **Domestic/Foreign Asymmetry:** Why different standards? Reply: International toleration differs from domestic legitimacy.
  *   **Biographical Relevance:** Does loss of faith shape the theory? Reply: Theory stands on arguments, not biography.
  *   **Textual Cost:** What must be sacrificed? Reply: Minimal adjustment to clarify audience.
  *   **Practical Difference:** Where does it change outcomes? Reply: In civic culture, not voting.

  I omitted the Kantian connection and specific textual exegesis of *Political Liberalism* versus *A Theory of Justice* because they are too technical for the undergraduate audience and recap last season's failures.

  1. You argue citizens can offer religious reasons provided public reasons follow later. But who sets the deadline for those public reasons, and what happens to a citizen who sincerely believes none exist? If the proviso is merely hortatory, does it retain any normative force against sectarian dominance?

  2. You treat the burdens of judgment as a neutral description of democratic disagreement. But if a tradition claims revealed truth, isn't accepting these burdens a concession that their reason is limited in a way their doctrine denies? If rejecting them makes a tradition unreasonable, have we not simply moved the exclusion from religious reasons to religious epistemologies?

  3. Rawls cites the abolitionists and King as vindicated uses of comprehensive doctrine. But what does your reading say about a present-day religious movement arguing from doctrine on basic justice that is never vindicated by history? Does the reasonableness of their appeal depend on a future historical verdict they cannot know?
      *   **Pivot:** If she says reasonableness depends on willingness to accept democratic outcomes rather than success, ask: But if their doctrine forbids accepting those outcomes, are they excluded? If she concedes vindication is retrospective, ask: So you admit current judgment of reasonableness is impossible?

  4. You claim the political conception is a module embeddable in any reasonable doctrine without residue. Take a faith that claims authority over the whole of life, including law; what is the believer supposed to do when justice as fairness conflicts with that authority? Does your answer require them to reinterpret their faith until it fits the module?
      *   **Pivot:** If she says conflicting doctrines are simply unreasonable, ask: Then isn't the module only embeddable in doctrines you have already vetted as liberal? If she concedes the believer must choose, ask: So citizenship requires a theological compromise you earlier denied?

  5. Rawls tolerates decent hierarchical societies abroad that favor one faith, yet refuses religious grounds for coercive law at home. Why is a comprehensive doctrine acceptable for organizing a foreign state but not for justifying domestic coercion? Does this asymmetry suggest the domestic restriction is cultural rather than principled?

  6. I want to know the cost of your interpretation to the text. Can you name one specific Rawlsian claim that comes out false on your account, and what concession are you least happy making to preserve this hospitality?

  7. You wave away Rawls's undergraduate theology and his loss of faith, but his later work insists political conception cannot be justified by the whole truth. If that insistence stems from his theological view of sin and human limitation, what does your interpretation look like if that thesis is taken seriously rather than ignored?

  8. Finally, identify a live political dispute on which your reading and the secularist reading yield different practical outcomes. Which of the two results would you rather be wrong about?

  She is most likely to handle the fourth question on the module claim badly, as her insistence on embedding without residue conflicts with the reality of doctrinal authority. The best answer available to her is to acknowledge that some doctrines must modify non-essential claims to accommodate justice, distinguishing core tenets from peripheral applications. If she gives that answer, you should follow up by asking whether the believer or the philosopher decides which tenets are core, forcing her to admit who holds the interpretive power.
