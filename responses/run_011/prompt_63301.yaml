  1. The Problem

  **Graduate Seminar in Philosophy of Physics: Final Problem Set**
  **Topic: The $\psi$-ontic / $\psi$-epistemic Distinction**
  **Time Allowed: 90 Minutes**
  **Total Marks: 25**

  **Instructions:** Answer all four parts. You are not permitted to consult external literature. All necessary definitions and numerical values are provided below.

  **Operational Scenario**
  Consider a single qubit system.
  *   **Preparations:** Two preparations, $A$ and $B$, correspond to the pure states $|0\rangle$ and $|+\rangle = (|0\rangle + |1\rangle)/\sqrt{2}$. The quantum overlap is $|\langle 0|+\rangle|^2 = 1/2$.
  *   **Measurements:**
      *   $M$: Projective measurement in the $\{|0\rangle, |1\rangle\}$ basis with outcomes $0$ and $1$.
      *   $N$: Projective measurement in the $\{|+\rangle, |-\rangle\}$ basis with outcomes $+$ and $-$.
  *   **Quantum Statistics:**
      *   $p(0|A) = 1$, $p(0|B) = 1/2$.
      *   $p(+|A) = 1/2$, $p(+|B) = 1$.

  **Definitions**
  An **ontological model** supplies an ontic space $\Lambda$, for each preparation $P$ an epistemic state $\mu_P$ (a probability distribution over $\Lambda$), and for each measurement a response function $\xi(o|\lambda)$ giving the probability of outcome $o$ conditional on $\lambda$, such that $\sum_\lambda \mu_P(\lambda) \xi(o|\lambda)$ reproduces the quantum statistics.
  For two preparations $A$ and $B$, define the **directional overlap** $D(A,B) = \sum_{\lambda \in \text{supp } \mu_B} \mu_A(\lambda)$, and the **symmetric overlap** $\omega(A,B) = \sum_\lambda \min(\mu_A(\lambda), \mu_B(\lambda))$.
  A model is **$\psi$-ontic** if the epistemic states of every pair of distinct pure states have disjoint supports, and **$\psi$-epistemic** otherwise.
  A model is **maximally $\psi$-epistemic** (for a given pair) if both $D(A,B)$ and $D(B,A)$ equal the quantum overlap $|\langle A|B\rangle|^2$.

  **Three Ontological Models (specified for measurement $M$)**
  *   **T1:** $\Lambda = \{\lambda_1, \lambda_2\}$; $\mu_A = (1, 0)$; $\mu_B = (1/2, 1/2)$; $\xi_M(0|\lambda_1) = 1$, $\xi_M(0|\lambda_2) = 0$.
  *   **T2:** $\Lambda = \{\lambda_1, \lambda_2, \lambda_3\}$; $\mu_A = (1, 0, 0)$; $\mu_B = (0, 1/2, 1/2)$; $\xi_M(0|\lambda_1) = 1$, $\xi_M(0|\lambda_2) = 1$, $\xi_M(0|\lambda_3) = 0$.
  *   **T3:** $\Lambda = \{\lambda_1, \lambda_2, \lambda_3\}$; $\mu_A = (1/2, 1/2, 0)$; $\mu_B = (0, 1/2, 1/2)$; $\xi_M(0|\lambda_1) = 1$, $\xi_M(0|\lambda_2) = 1$, $\xi_M(0|\lambda_3) = 0$.

  **Student Argument**
  After being shown the three models, a student advances the following reasoning:
  (i) T1, T2, and T3 all reproduce the same operational statistics;
  (ii) they nonetheless fall on opposite sides of the $\psi$-ontic / $\psi$-epistemic divide, and only one of them is maximally $\psi$-epistemic;
  (iii) therefore no possible experiment on this system could decide whether the quantum state is a state of reality or a state of knowledge;
  (iv) therefore the question whether the wavefunction is real is not a factual question at all, but a verbal dispute about how to carve up an arbitrary $\Lambda$, and the whole technical apparatus of $\psi$-ontology theorems merely dresses up that verdict.

  **Questions**
  **(a)** [5 marks] Classify T1, T2, and T3 by computing $D(A,B)$, $D(B,A)$, and $\omega(A,B)$ in each case. Explain why T1 is a case in which the two overlap measures come apart—$\omega$ matches the quantum overlap while neither directional condition is satisfied in both orders—identifying the structural feature of T1 responsible for the asymmetry.
  **(b)** [5 marks] Show that in T1 an agent who learns the ontic state can sometimes predict the outcome of $M$ with certainty where an agent who knows only the preparation cannot. Draw out what this implies about the relation between the contemporary $\psi$-ontology distinction and the older distinction between hidden-variable and no-hidden-variable accounts.
  **(c)** [8 marks] Attempt to extend each of the three models so that it also reproduces the statistics of $N$. Establish that T1 admits no extension whatsoever, that T2 admits an extension only at the cost of a stochastic response function, and that T3 admits an extension in which every response function for both $M$ and $N$ is deterministic. Explain why T1's failure is not an artefact of the particular numbers chosen: within the family of models with $\mu_A = (1 - q, q, 0)$ and $\mu_B = (0, q', 1 - q')$ over $\Lambda = \{\lambda_1, \lambda_2, \lambda_3\}$ and the $M$-responses fixed as in T3, an extension to $N$ exists only when $q \le 1/2$, and is outcome-deterministic only when $q = 1/2$, which is exactly the value required by maximal $\psi$-epistemicity for this pair.
  **(d)** [7 marks] Evaluate the student's argument: state its strongest form, identify the step at which it fails, and say what would have to be true for it to succeed. Make the scope distinction explicit—the classification attaches to a model of the whole of quantum theory rather than to a fragment—and note, descriptively and without citation, that arguments of the Pusey–Barrett–Rudolph type, which add an assumption about the independence of the ontic states of separately prepared systems, are what give the distinction empirical traction at the level of the full theory. Credit the observation that the results of part (c) cut against premise (iv) even within the fragment.

  ***

  2. Model Answer

  **(a)** For **T1**: $\text{supp } \mu_A = \{\lambda_1\}$, $\text{supp } \mu_B = \{\lambda_1, \lambda_2\}$.
  $D(A,B) = \mu_A(\lambda_1) + \mu_A(\lambda_2) = 1 + 0 = 1$.
  $D(B,A) = \mu_B(\lambda_1) = 1/2$.
  $\omega(A,B) = \min(1, 1/2) + \min(0, 1/2) = 1/2$.
  T1 is $\psi$-epistemic (overlap exists) but not maximally so ($D(A,B) \neq 1/2$). The asymmetry arises because $\text{supp } \mu_A \subset \text{supp } \mu_B$; $\mu_B$ spreads over regions where $\mu_A$ is zero, but $\mu_A$ is concentrated entirely within $\mu_B$'s support.

  For **T2**: $\text{supp } \mu_A = \{\lambda_1\}$, $\text{supp } \mu_B = \{\lambda_2, \lambda_3\}$. Supports are disjoint.
  $D(A,B) = 0$, $D(B,A) = 0$, $\omega(A,B) = 0$.
  T2 is $\psi$-ontic.

  For **T3**: $\text{supp } \mu_A = \{\lambda_1, \lambda_2\}$, $\text{supp } \mu_B = \{\lambda_2, \lambda_3\}$.
  $D(A,B) = \mu_A(\lambda_2) + \mu_A(\lambda_3) = 1/2 + 0 = 1/2$.
  $D(B,A) = \mu_B(\lambda_1) + \mu_B(\lambda_2) = 0 + 1/2 = 1/2$.
  $\omega(A,B) = 0 + 1/2 + 0 = 1/2$.
  T3 is maximally $\psi$-epistemic.

  **(b)** In T1, if preparation is $B$, the agent predicts $p(0|B)=1/2$. If the agent learns $\lambda=\lambda_1$, they know $\xi_M(0|\lambda_1)=1$, predicting outcome 0 with certainty. Thus, $\lambda$ carries more specific information than the preparation state $\mu_B$. This implies that $\psi$-epistemicity does not entail that the ontic state is informationally weaker than the quantum state; a model can be $\psi$-epistemic (overlapping distributions) yet contain hidden variables that resolve quantum uncertainty. The $\psi$-ontology distinction concerns the reality of the wavefunction, not merely the presence of hidden variables.

  **(c)** We require $\xi_N(+|\lambda)$ such that $\sum \mu_P(\lambda)\xi_N(+|\lambda) = p(+|P)$.
  **T1:** $\mu_A=(1,0) \implies \xi_N(+|\lambda_1)=1/2$. $\mu_B=(1/2,1/2) \implies (1/2)(1/2) + (1/2)\xi_N(+|\lambda_2) = 1 \implies \xi_N(+|\lambda_2)=3/2$. Impossible. No extension.
  **T2:** $\mu_A=(1,0,0) \implies \xi_N(+|\lambda_1)=1/2$. $\mu_B=(0,1/2,1/2) \implies (1/2)\xi_2 + (1/2)\xi_3 = 1 \implies \xi_2=\xi_3=1$. Extension exists, but $\xi_N(+|\lambda_1)=1/2$ is stochastic.
  **T3:** $\mu_A=(1/2,1/2,0) \implies (1/2)\xi_1 + (1/2)\xi_2 = 1/2$. $\mu_B=(0,1/2,1/2) \implies (1/2)\xi_2 + (1/2)\xi_3 = 1 \implies \xi_2=\xi_3=1$. Substituting $\xi_2=1$ into A's eq: $(1/2)\xi_1 + 1/2 = 1/2 \implies \xi_1=0$. All $\xi \in \{0,1\}$. Deterministic extension exists.

  **Generalization:** Fix $\xi_M$ as in T3. $M$-statistics require $p(0|B)=q'=1/2$. For $N$, $\mu_B$ requires $\xi_2=\xi_3=1$. $\mu_A$ requires $(1-q)\xi_1 + q(1) = 1/2 \implies (1-q)\xi_1 = 1/2 - q$. For $\xi_1 \ge 0$, need $q \le 1/2$. For determinism ($\xi_1 \in \{0,1\}$), need $1/2 - q = 0 \implies q=1/2$. Maximal $\psi$-epistemicity requires $D(A,B)=q=1/2$. Thus, deterministic extendability coincides exactly with maximal $\psi$-epistemicity.

  **(d)** The student's strongest claim is that empirical equivalence within a fragment renders the ontological classification metaphysically empty (step iv). This fails because the classification constrains model structure beyond the fragment. As shown in (c), T1 cannot be extended to $N$, while T3 can deterministically. The classification is not a verbal carve-up; it dictates compatibility with further measurements. Furthermore, the scope is limited: these are models of a fragment, not the whole theory. Arguments of the Pusey–Barrett–Rudolph type, which add an assumption about the independence of the ontic states of separately prepared systems, are what give the distinction empirical traction at the level of the full theory. Within the fragment, the structural constraints (determinism vs. impossibility) show the distinction has physical content, refuting the claim that it is merely verbal.

  ***

  3. Marking Scheme

  **Part (a) [5 marks]**
  *   **1 mark:** Correct calculation of overlaps for T1 ($D(A,B)=1, D(B,A)=1/2, \omega=1/2$).
  *   **1 mark:** Correct classification of T2 as $\psi$-ontic (disjoint supports, overlaps 0).
  *   **1 mark:** Correct calculation and classification of T3 as maximally $\psi$-epistemic (all overlaps 1/2).
  *   **1 mark:** Identification of T1's asymmetry source: $\text{supp } \mu_A \subset \text{supp } \mu_B$ (proper subset).
  *   **1 mark:** Explanation that $\omega$ matches quantum overlap but directional $D$ fails in one order.
  *   *First-class distinction:* Explicitly noting that $D(A,B)=1$ implies $\mu_A$ is fully contained in $\mu_B$'s support, violating the symmetry required for maximal $\psi$-epistemicity.

  **Part (b) [5 marks]**
  *   **2 marks:** Demonstration that knowing $\lambda_1$ under preparation $B$ yields probability 1 for outcome 0, whereas $\mu_B$ yields 1/2.
  *   **2 marks:** Statement that $\lambda$ is informationally stronger than $\psi$ in this context (resolves uncertainty).
  *   **1 mark:** Conclusion that $\psi$-epistemicity $\neq$ absence of hidden variables (ontic state can be more specific than quantum state).
  *   *First-class distinction:* Clear separation of the $\psi$-ontology question (status of $\psi$) from the hidden-variable question (completeness of description).

  **Part (c) [8 marks]**
  *   **2 marks:** Derivation showing T1 requires probability $>1$ (no extension).
  *   **2 marks:** Derivation showing T2 requires stochastic $\xi$ for $\lambda_1$.
  *   **2 marks:** Derivation showing T3 allows deterministic $\xi$ for all $\lambda$.
  *   **2 marks:** Generalization proof: $q \le 1/2$ for existence, $q=1/2$ for determinism.
  *   *First-class distinction:* Explicitly linking $q=1/2$ to the condition $D(A,B)=1/2$ for maximal $\psi$-epistemicity, showing the structural necessity rather than numerical coincidence.

  **Part (d) [7 marks]**
  *   **2 marks:** Identification of step (iv) as the failure point (empirical equivalence $\nRightarrow$ metaphysical emptiness).
  *   **2 marks:** Scope distinction: Fragment vs. Whole Theory.
  *   **2 marks:** Reference to PBR-type arguments (independence assumption) providing traction for the full theory.
  *   **1 mark:** Credit for noting part (c) results show structural constraints within the fragment (determinism).
  *   *First-class distinction:* Articulating that the "verbal dispute" claim is refuted by the fact that not all $\Lambda$-carvings permit extension to compatible measurements.

  ***

  4. List of Specific Errors

  1.  **Error:** Asserting that T1 and T2 could be distinguished by an experiment on this system (measurements $M$ and $N$ only).
      *   **Deduction:** 2 marks.
      *   **Diagnosis:** Confusing ontological distinctness with operational distinguishability within the defined fragment.
  2.  **Error:** Treating $\omega$ and the directional overlap $D$ as interchangeable or equivalent definitions.
      *   **Deduction:** 2 marks.
      *   **Diagnosis:** Failure to attend to the stipulative definitions provided in the problem text.
  3.  **Error:** Inferring from part (b) that $\psi$-epistemic models are hidden-variable models in the classical sense (implying $\psi$ is irrelevant).
      *   **Deduction:** 2 marks.
      *   **Diagnosis:** Conflating the $\psi$-ontology distinction with the completeness/hidden-variable distinction.
  4.  **Error:** Inferring from part (c) that $\psi$-epistemic accounts have been refuted generally.
      *   **Deduction:** 2 marks.
      *   **Diagnosis:** Overgeneralizing from a specific fragment constraint to a general no-go theorem without the independence assumption.
  5.  **Error:** Applying a preparation-independence argument to a single-system fragment in which no composite preparation ever occurs.
      *   **Deduction:** 3 marks.
      *   **Diagnosis:** Misapplying scope conditions; independence assumptions require composite systems not present in the scenario.
  6.  **Error:** Claiming T1 is maximally $\psi$-epistemic because $\omega(A,B) = 1/2$.
      *   **Deduction:** 2 marks.
      *   **Diagnosis:** Ignoring the directional condition ($D(A,B)$ and $D(B,A)$) required by the definition of maximal $\psi$-epistemicity.
