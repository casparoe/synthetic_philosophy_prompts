answer: |-
  You have a sharp eye for the gap between formal theory and what actually happens in the room. You are correctly identifying that standard Nash Bargaining (which depends on the disagreement point $d$ and the feasible set $S$) doesn't capture this, because neither $d$ nor the *actual* $S$ has changed.

  Here is the breakdown: I am going to push back on your rejection of "anchoring," validate your intuition about Kalai–Smorodinsky, and then offer a specific mechanism that explains why it works even when "nobody is fooled."

  ### 1. The Pushback: It *Is* Anchoring (But You're Right to Be Unsatisfied)
  In the empirical negotiation literature (e.g., Galinsky & Mussweiler), this is categorized as **Anchoring**. However, your distinction is crucial: standard anchoring effects often work with arbitrary numbers (e.g., spinning a wheel of fortune). What you are describing is **Aspirational Anchoring**.

  The reason "Anchoring" feels like a lazy label here is that anchoring is usually described as a *cognitive bias* (the other person gets confused). Your cases suggest something more structural: the fantasy option changes the **normative framework** of the negotiation, not just the cognitive processing.

  ### 2. The Theoretical Fit: Descriptive Kalai–Smorodinsky
  You hit the nail on the head with Kalai–Smorodinsky (KS).
  *   **Nash Solution:** Maximizes the product of gains from cooperation $(u_1 - d_1)(u_2 - d_2)$. It is sensitive to the *shape* of the frontier near the solution.
  *   **Kalai–Smorodinsky:** Preserves the ratio of maximum possible gains. It depends heavily on the **Ideal Point** (the utopia point where each player gets their maximum feasible utility).

  In formal theory, the Ideal Point must be feasible. In practice, negotiators use KS logic as a **heuristic for fairness**. "We should split the surplus proportionally to our maximum potential."

  When your roommate talks up the studio she can't afford, she is not changing her BATNA ($d$); she is **inflating her Ideal Point** ($u_{max}$). If the other party implicitly accepts a KS-style fairness norm ("we should meet somewhere between the walkaway and the best case"), inflating the best case pulls the compromise toward her, even if the "best case" is phantom.

  **Verdict:** You are describing the **strategic manipulation of the Kalai–Smorodinsky Ideal Point.**

  ### 3. The Mechanism: Why It Works If "Nobody Is Fooled"
  You stated: *"nobody is actually being fooled about the odds."*
  If this were strictly rational, this tactic should fail. If I know there is a 1% chance you get that dream job, I shouldn't budge. So why does it work?

  It works because of **Commitment Signaling** (Schelling) and **Reference-Dependent Utility** (Kahneman/Tversky).

  *   **Commitment:** By fixating on the fantasy option, the negotiator signals that their utility function is steep around that point. They are effectively saying, "Settling for less than this feels like a loss to me." This increases the perceived **risk of impasse** at lower offers. It doesn't change the *value* of the walkaway ($d$), but it increases the *probability* of the walkaway happening if the offer is low.
  *   **Reference Dependence:** The fantasy option sets a new **Reference Point** ($r$). Utility is not $u(x)$, but $u(x - r)$. If $r$ is high, a moderate offer feels like a loss. Loss aversion makes the negotiator tougher. The counterpart pays more not because they believe the fantasy is real, but because they want to avoid the psychological friction of negotiating with someone who feels they are "losing."

  ### 4. The Term
  There isn't a single canonical term that captures the *rational choice* violation here, but the closest practitioner term is **"Virtual BATNA,"** which is imprecise.

  Given your description, the most accurate term—one that bridges the KS intuition and the behavioral mechanism—is:

  **The Virtual Ideal Point**

  *   **Definition:** A strategically invoked, low-probability outcome that is technically within the outcome space but effectively infeasible, used to shift the reference point for fairness (KS logic) and signal commitment (Schelling logic).
  *   **Boundary Case:** If the option is *completely* impossible (e.g., "I could buy this building"), it loses credibility and becomes noise (standard anchoring). If the option is *highly* probable, it becomes a standard Outside Option/BATNA. The "Virtual Ideal Point" lives in the middle: plausible enough to be salient, improbable enough to be deniable.

  ### 5. My Bet
  If I have to bet on one explanation for your course or future research:

  **It is Reference Point Manipulation exploiting Inequity Aversion.**

  Here is the plain talk you asked for: You are sliding between a solution concept and a psychological mechanism, but that is exactly where the phenomenon lives.
  *   **Rational Choice View:** It shouldn't work. $S$ and $d$ are fixed.
  *   **Reality:** Negotiators don't solve for Nash; they solve for "Fair."
  *   **The Mechanism:** Fairness is often judged by KS-like proportions (How much *could* you have gotten vs. how much *could* I have gotten?). By invoking the fantasy, your counterpart changes the numerator in that fairness equation.

  **Don't call it Anchoring.** Anchoring implies the other person is making a math error. What you are describing is that the other person is accepting a **new fairness metric**. They aren't fooled about the odds; they are conceding to the *salience* of the aspiration to close the deal.

  **Summary for your notes:**
  1.  **Concept:** **Virtual Ideal Point** (my coinage for this context).
  2.  **Theoretical Analog:** Descriptive **Kalai–Smorodinsky** bargaining (shifting the utopia point).
  3.  **Behavioral Mechanism:** **Reference Dependence** + **Commitment Signaling**.
  4.  **Distinction:** Unlike BATNA, it changes the *probability of impasse* at specific splits, not the value of the impasse itself. Unlike standard Anchoring, it relies on structural feasibility, not arbitrary numbers.

  You're not muddled; you've identified a place where normative theory (KS) is being weaponized as a descriptive tactic. Keep that intuition.
