answer: |-
  You have identified one of the most persistent and difficult problems in contemporary philosophy of probability and cosmology. Your intuition is excellent: you have independently rediscovered the tension between the **Self-Sampling Assumption (SSA)** and the **Self-Indication Assumption (SIA)**.

  While you asked primarily about the rhetorical move rather than the vocabulary, knowing the terms will help you search for further reading.
  *   Your **"Numbers Rule"** is essentially the **Self-Indication Assumption (SIA)**: *Given that you exist, you should favor hypotheses according to which more observers exist.* (This drives the Multiverse argument).
  *   Your **"Typicality Rule"** is essentially the **Self-Sampling Assumption (SSA)**: *You should reason as if you are a random sample from the set of all observers in your reference class.* (This is used to block the "Boltzmann Brain" or "Lottery Fraud" conclusions).

  The phenomenon you are describing—the unacknowledged switching between these two to secure desired conclusions—does not have a single Latin name like *ad hominem* in introductory logic textbooks. In specialized literature, it is often discussed as **"Anthropic Bias"** or the **"Inconsistency of Anthropics."**

  However, since you asked for a tight definition to apply to written arguments, I will coin a term that captures the rhetorical structure: **Epistemic Principle Shopping**.

  Below is the analysis of this practice, how to distinguish it from similar fallacies, and how to test for it.

  ### 1. Definition: Epistemic Principle Shopping

  **Epistemic Principle Shopping** occurs when an arguer employs two or more incompatible rules of inference to evaluate evidence, selecting the rule for each specific case based solely on which rule yields the desired conclusion, while presenting the selected rule in each instance as the unique, neutral, or default standard of reasoning.

  **Necessary Conditions:**
  1.  **Incompatibility:** The rules used (e.g., Numbers vs. Typicality) yield contradictory results when applied consistently to the same class of problems.
  2.  **Outcome Dependence:** The choice of rule correlates perfectly with the desired conclusion (Rule A is used when it supports the thesis; Rule B is used when Rule A would undermine it).
  3.  **Concealment:** The arguer does not acknowledge the existence of the alternative rule, nor do they provide an independent criterion for why Rule A applies to Case 1 and Rule B applies to Case 2.
  4.  **Default Presentation:** In each instance, the chosen rule is presented not as a strategic choice, but as the obvious way any reasonable person would think.

  ### 2. Distinction from Related Fallacies

  You asked how this differs from special pleading, moving the goalposts, or ad hoc rescue. Here is the boundary:

  *   **Vs. Special Pleading:** Special pleading argues that a *specific case* is an exception to a general rule ("Everyone else must follow the speed limit, but I am a doctor"). Epistemic Principle Shopping argues that the *rule of logic itself* changes depending on the case ("For this case we count numbers; for that case we ignore numbers"). It is a higher-order inconsistency.
  *   **Vs. Moving the Goalposts:** Moving the goalposts changes the *standard of proof* required to accept a conclusion (e.g., "Show me one study" $\rightarrow$ "Show me ten studies"). Principle Shopping changes the *mechanism of inference* used to derive the conclusion.
  *   **Vs. Ad Hoc Rescue:** An ad hoc rescue adds a new assumption to save a theory from falsification (e.g., "The universe is silent because aliens are hiding"). Principle Shopping does not add an assumption about the world; it changes the assumption about *how we reason* about the world.
  *   **Vs. The Motte and Bailey:** In Motte and Bailey, the arguer retreats to a defensible position when attacked but claims the indefensible one when safe. In Principle Shopping, the arguer does not retreat; they simply swap engines. They claim the Multiverse is *probable* (Numbers) and that Boltzmann Brains are *improbable* (Typicality) simultaneously, without seeing the tension.

  ### 3. Drawing the Edges: When is it Legitimate?

  Using both rules across a body of work is not automatically a fault. The practice is only fallacious when the switch is **unjustified**.

  **Legitimate Switching:**
  The arguer acknowledges both rules and provides an independent, pre-stated criterion for why different rules apply to different contexts.
  *   *Example:* "I use the Numbers Rule for cosmological hypotheses where the observer's existence is contingent on the hypothesis. I use the Typicality Rule for sociological claims where the observer is already assumed to exist."
  *   *Key:* The criterion for choosing the rule does not depend on the conclusion the rule produces.

  **Illegitimate Switching (The Fallacy):**
  The justification for the rule is circular or post-hoc.
  *   *Example:* "We should count all observers here because it helps the theory, but we should ignore extra observers there because they make the theory look weird."
  *   *Key:* The "Reference Class" (the group you consider yourself a member of) is defined *after* seeing the result to ensure the desired outcome.

  ### 4. The Prior Criterion and the Asymmetry

  You asked if there is a prior criterion to decide which rule applies. In formal anthropic reasoning, the criterion is the **Reference Class**.
  *   **The Criterion:** Before analyzing the evidence, you must define: *What is the set of observers I could have been?*
  *   **The Bend:** This criterion is easily bent. If I want to prove the Multiverse, I define my reference class as "all possible observers in all possible universes" (favors Numbers). If I want to disprove Boltzmann Brains, I define my reference class as "observers with orderly memories" (favors Typicality).

  **The Asymmetry:**
  There is a profound asymmetry in the switch.
  *   **The Numbers Rule (SIA)** is expansive. It allows you to infer vast, unseen realities (multiverses, infinite planets) from the single datum of your own existence. It creates something from nothing.
  *   **The Typicality Rule (SSA)** is conservative. It restricts you to what is normal within a known set.
  *   **The Advantage:** By switching, the arguer gets the **expansive benefits** of the Numbers Rule (a grand cosmology) without the **expansive costs** (weird observers, paradoxes), using the Typicality Rule as a shield. This is why the practice feels like cheating: it claims a "free lunch."

  ### 5. The Strongest Defense

  If you confront an arguer doing this, their strongest defense is **Reference Class Specificity**.

  They will argue: *"I am not switching rules. I am applying the same rule (Typicality) to different Reference Classes. In the Multiverse case, the class is 'Universes.' In the Boltzmann Brain case, the class is 'Observers with coherent memories.' Since the classes are different, the different outputs are valid."*

  This defense holds water *only if* the definition of the Reference Class is not itself rigged to produce the result.

  ### 6. The Test: Pre-Commitment and Falsification

  To determine if the defense holds, you cannot simply ask them to explain themselves (they will rationalize). You must force a **Pre-Commitment**.

  **The Test:**
  Before they analyze the specific evidence or reveal their conclusion, ask them to write down two things:
  1.  **The Rule:** "Will you weigh hypotheses by the *number* of observers they contain, or by the *typicality* of the observer within the hypothesis?"
  2.  **The Falsifier:** "What observation would prove your hypothesis *false* using this specific rule?"

  **How to Judge the Verdict:**
  *   **Pass:** They commit to a rule (e.g., "Numbers") and admit a falsifier (e.g., "If we find no evidence of other universes, the probability drops").
  *   **Fail:** They refuse to commit until they see the data. Or, when you present the falsifier, they switch to the other rule to explain it away (e.g., "Well, even if we don't see other universes, I am still typical, so...").

  **A Concrete Script for Your Reading Group:**
  > "I notice you use the 'Numbers' logic to argue for the Multiverse, but the 'Typicality' logic to argue against Boltzmann Brains. These two rules are mathematically incompatible; you cannot hold both as default.
  >
  > Before we discuss the next topic, please state your **General Principle of Observer Selection**. Will you always favor hypotheses with more observers, or will you always favor hypotheses where you are more typical?
  >
  > If you say 'It depends,' please state the condition *now*, before we know which way the evidence points. If the condition is 'whichever avoids absurd conclusions,' then your theory is unfalsifiable, because you can define any conclusion you don't like as 'absurd' to trigger the switch."

  ### Summary for Your Reading Group

  You have spotted a sophisticated form of **Motivated Reasoning**. The arguer is not lying, but they are navigating a complex logical landscape with a map that changes as they walk.

  *   **Name:** Epistemic Principle Shopping (or Methodological Opportunism).
  *   **The Tell:** The arguer treats the rule of inference as invisible background noise rather than a visible tool.
  *   **The Fix:** Force the rule into the light. Make them commit to a single method of counting *before* they count.

  If they cannot do this, they are not doing science or philosophy; they are storytelling. They are using the *language* of probability to justify conclusions reached by intuition. Your instinct that something is missing is correct: what is missing is the **cost** of the inference. The Numbers Rule has a cost (weird observers); the Typicality Rule has a cost (smaller realities). The switcher is trying to avoid paying the bill.
