  Decision: Conditional Acceptance Pending Resolution of Interpretive Conflict.

  **Referee 1**

  **Summary:** The petition seeks to exempt kombucha from Section 5(a) labeling requirements based on the Section 15 exemption.

  **Comments:**
  1.  **Statutory Structure:** Section 5(a) lists "fermented malt beverage, wine, distilled spirit, or other potable preparation of similar character." Under the rule of the last antecedent, the trailing modifier "of similar character" governs only "preparation," not the preceding specific terms. Applying the series-qualification canon here would render "distilled spirit" surplusage, as spirits are inherently similar to spirits. Kombucha shares no commercial character with distilled spirits.
  2.  **Section 15 Ambiguity:** The phrase "at any point during its production" must be read in context of the labeling duty, which is computed at bottling. The House manager's floor statement characterized the conference addition as "housekeeping." To treat this as a substantive peak-alcohol trigger contradicts the textual command to label the container upon commerce entry.
  3.  **Legislative History:** The Senate committee report claiming the addition reaches preparations developing strength in transit is self-serving and unsupported by the enacted text. Reliance on it violates the principle that clear text ends the inquiry.
  4.  **Absurdity:** The petitioner's reading invites *reductio ad absurdum*. Bread dough and sourdough starters ferment during production. Are bakers now liable for excise labeling? The textual reading avoids this administrative impossibility.

  **Recommendation:** Reject liability. The text protects the brewer.

  **Referee 2**

  **Summary:** The petition attempts to evade labeling for a beverage that reached 1.4% ABV, undermining the Act's purpose.

  **Comments:**
  1.  **Statutory Purpose:** Section 12 recites that consumers are misled regarding strength. The series-qualification canon dictates that "of similar character" modifies the entire list to ensure all intoxicating potable preparations are covered. Ignoring this renders "similar character" surplusage. Kombucha is potable and intoxicating; it fits the genus.
  2.  **Section 15 Ambiguity:** The Senate committee report explicitly states the conference addition targets preparations developing strength during transit or storage. This clarifies that "production" encompasses the fermentation cycle, not merely the bottling moment. The exemption fails if the product exceeds 0.5% at any point.
  3.  **Legislative History:** The Senate report reflects the specific intent behind the conference addition. The House manager's "housekeeping" remark is a general gloss that cannot override the specific explanatory report accompanying the statutory change.
  4.  **Absurdity:** The respondent's *reductio* fails. Bread dough and vinegar are not "potable preparations." Kefir is regulated; sourdough is not. The purposive reading distinguishes between food and drink without collapsing the regulatory scheme.

  **Recommendation:** Accept liability. The purpose protects the consumer.

  **Editor's Note**

  Both referees argue doctrinal fidelity, yet their methods diverge sharply on procedural context. Record evidence indicates the Act passed by voice vote in approximately eight minutes. Referee 1's textualism treats this haste as evidence that no hidden substantive change was intended; had Congress meant to regulate kombucha, they would have debated it. Referee 2's purposivism treats the same haste as evidence of unanimous, uncontroversial concern for public health that requires broad protection. The manuscript must reconcile how the same legislative speed supports mutually exclusive conclusions regarding the scope of Section 15.
