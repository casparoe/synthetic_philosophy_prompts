  ### 1. Running the Procedure on Three Requests

  **(a) The Man with Gambling Debt ($900 for Rent)**
  *   **Step 1 (Scope):** Pass. Rent is in scope.
  *   **Step 2 (Immediacy):** Pass. He is behind on rent; eviction is a 7-day risk.
  *   **Step 3 (Stability):** **FAIL.** The volunteer asks: "If we pay this today, what changes to prevent you from needing this same help in 60 days?" The applicant answers honestly: "Nothing, I still have the gambling problem, this debt is why I'm short."
  *   **Outcome:** **Decline.**
  *   **Why:** Step 3 triggers a decline because the request is identified as a recurring deficit with no mitigation plan. The fund cannot stabilize a situation where the root cause (active addiction) is acknowledged as ongoing without support structures. Paying the rent now simply frees up other cash for gambling, leading to the same request in two months. Scarcity dictates we cannot fill a bucket with a hole in it when others have buckets that can be filled.

  **(b) The Woman with Failed Business/Son's Equipment ($1,100)**
  *   **Step 1 (Scope):** Pass. Medical equipment is in scope.
  *   **Step 2 (Immediacy):** Pass. Breathing equipment is essential for health; lack thereof poses immediate physical harm.
  *   **Step 3 (Stability):** Pass. The equipment, once purchased, lasts for years. The business failure is past tense; it does not dictate the stability of the medical need.
  *   **Step 4 (Ranking):** High Rank. Physical health risk outweighs most financial risks.
  *   **Outcome:** **Approve.**
  *   **Why:** The origin of the poverty (business failure) is dropped as a distinction. The current harm (health) is kept.

  **(c) The Apartment with Mold/ER Visits ($600)**
  *   **Step 1 (Scope):** Pass. Moving costs/rent deposit is in scope (housing).
  *   **Step 2 (Immediacy):** Pass. Kid is already going to the ER; harm is active and ongoing.
  *   **Step 3 (Stability):** Pass. Moving to a new unit removes the mold source.
  *   **Step 4 (Ranking):** High Rank. Active health harm + housing security.
  *   **Outcome:** **Approve.**
  *   **Why:** This is the ideal candidate for the fund: immediate harm, one-time fix solves the problem.

  ### 2. Two Requests the Procedure Will Get Wrong on Purpose

  **1. The "Bad Budgeter" Parent**
  *   **The Case:** A single parent asks for utility shut-off protection. They spent their money on a birthday party for their child because they wanted their kid to have one normal thing.
  *   **The Error:** Step 3 (Stability) might flag this as "no change in financial management," leading to a decline or low rank.
  *   **The Cost:** We prioritize financial "discipline" over human dignity. The kid keeps the memory of the party, but the lights go out. We punish the parent for making a human choice in a poverty trap, reinforcing the idea that poor people aren't allowed joy. We save the money, but we lose the soul of mutual aid.

  **2. The "Systemic Lemon" Car**
  *   **The Case:** A worker needs $1,000 to fix a car to keep their job. The car is old. We fix it. It breaks again in 3 weeks. They ask again.
  *   **The Error:** Step 3 relies on self-reported plans ("I'll fix it"). We approve the first time. When they return, Step 3 flags them as "recurring," and we decline the second time.
  *   **The Cost:** We abandon someone because the material world failed them, not because they failed. We treat a structural lack of reliable transportation as a personal stability failure. The person loses the job, and we walk away feeling efficient but complicit in their downfall.

  ### 3. What to Say to the Volunteer Who Quit

  "You are right. The framing punishes people for how their lives started, and no spreadsheet fixes that. When we ask 'What changes to prevent this next month?' (Step 3), we are asking people to promise us stability in an economy designed to destabilize them. If they can't promise, we walk away. That makes us judges, no matter what we call it.

  This procedure doesn't solve that moral injury. It just makes the injury consistent. It admits that because we have limited money, we *must* choose who gets stabilized and who gets left behind. Step 3 carries that weight. It says: 'We can only save those who can stay saved.' That is a brutal truth, and it is not your fault that it's brutal. You quit because you refused to be the person who says 'no' to someone who is drowning. I cannot tell you that this form makes that okay. It doesn't. It just makes sure that when we say 'no,' it's because we ran out of room, not because we ran out of patience.'"
