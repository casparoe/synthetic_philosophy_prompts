answer: |-
  The declaration practice presupposes a conception of famine as a **biophysical catastrophe** rather than a **political event**. It treats famine ontologically as a state of nature—a convergence of mortality, morbidity, and caloric deficit that exists independently of the human decisions that may have precipitated it. In this framework, famine is akin to an earthquake or a pandemic: a disaster to be measured, managed, and mitigated, but not inherently a verdict on human conduct.

  ### Reconstructing the Implicit Theory

  The implicit theory of the declaration practice is that famine is a **threshold state of affairs in the world, analogous to a magnitude reading.**

  Just as a seismograph records an earthquake based on energy release regardless of whether the quake was natural or induced by fracking, the famine classification records human suffering based on physiological outcomes regardless of whether the cause was drought or a blockade. The practice does not presuppose that agency is *unmeasurable*; rather, it methodologically excludes agency from the *definition*. It operates on the assumption that the *fact* of starvation can be severed from the *act* of starving.

  This creates a specific epistemic division of labor:
  1.  **The Technical Body:** Establishes the *fact* (the threshold has been crossed).
  2.  **The Political/Legal Body:** Establishes the *cause* (negligence, malice, or nature).

  By restricting the mandate to "technical and scientific criteria," the system commits strictly to the view that **famine is a condition of the population, not a conduct of the ruler.** It requires only that the biological markers of societal collapse are present and verifiable. It does not require that the cause be unknown, only that the cause be irrelevant to the label.

  ### Strict Commitments vs. Pragmatic Accommodations

  To understand the stability of this system, we must distinguish between what the practice logically requires and what it merely accommodates for convenience.

  **Strict Commitments (Ontological & Methodological):**
  *   **Outcome Sovereignty:** The definition of famine must rest solely on human suffering (death/malnutrition), not on the mechanisms producing it.
  *   **Causal Agnosticism:** The classification must remain valid even if the cause is later proven to be malicious. A "man-made famine" and a "natural famine" must trigger the same technical label.
  *   **Verifiability:** The thresholds must be measurable via data (surveys, mortality records) that can be standardized across different geopolitical contexts.

  **Pragmatic Accommodations (Political & Operational):**
  *   **Evidential Caution:** The system sits well with the difficulty of proving intent in conflict zones, but it is not strictly required by it. One could imagine a classification that includes "verified obstruction of aid" as a metric; the exclusion of this is a choice, not an epistemic necessity.
  *   **Donor Politics:** The neutrality of the declaration suits donors who wish to fund humanitarian relief without funding litigation or military intervention against host governments.
  *   **Access Negotiations:** Humanitarian agencies require the consent of warring parties to operate. A neutral, non-accusatory declaration preserves the fiction that all parties are partners in relief rather than potential perpetrators, facilitating physical access to the starving.

  ### Squaring Neutrality with Accountability

  **Technical neutrality cannot be squared with the war-crime and entitlement framings endorsed by the same institutions without creating profound cognitive and operational dissonance.**

  The invocation of Amartya Sen's entitlement analysis creates a paradox. Sen argues that famines are rarely about food availability (supply) but about food entitlement (distribution and rights). If famine is a collapse of entitlement, it is inherently institutional. If it is institutional, it involves agents. To declare a famine using Sen's logic while classifying it using neutral metrics is to diagnose a murder as a "cardiac arrest."

  Similarly, treating intentional starvation as a war crime while maintaining a famine declaration system that ignores intent creates a **moral hazard**. The technical declaration provides a "safe harbor" for perpetrators. A government can obstruct aid, drive mortality above the threshold, and then point to the international declaration as proof of a "humanitarian crisis" requiring donations, rather than a "criminal siege" requiring sanctions. The neutrality of the metric effectively launders the political cause of the suffering.

  As long as the declaration licenses *charity* (appeals for funds) rather than *justice* (referrals for prosecution), the two framings remain incompatible. The institutions are speaking two different languages: one of biology (the declaration) and one of jurisprudence (the war crime statute).

  ### Reclassifying Famine: From Catastrophe to Crime

  If famine were classified as a crime rather than a catastrophe, the architecture of the international system would require fundamental transformation in three areas:

  **1. The Criteria (From Mortality to Mechanism)**
  *   **Current:** Death rates, malnutrition prevalence, food consumption.
  *   **Required:** Evidence of **denial**. The criteria would need to include metrics of obstruction: market destruction, blockade enforcement, aid diversion rates, and the revocation of legal entitlements.
  *   **Shift:** The threshold would not just be "people are dying," but "people are being prevented from living." A situation where people starve due to unavoidable drought might be a "disaster," but only a situation where entitlements are forcibly collapsed would be a "famine" in the criminal sense.

  **2. The Certifiers (From Epidemiologists to Investigators)**
  *   **Current:** Nutritionists, epidemiologists, food security analysts.
  *   **Required:** A hybrid tribunal including **forensic investigators, legal experts, and human rights monitors.**
  *   **Independence:** These certifiers could not be employed by agencies that rely on host-government consent for access (e.g., UN humanitarian arms). They would need the protective independence of a prosecutor's office, empowered to gather evidence without promising confidentiality to perpetrators.

  **3. The Licensing (From Appeal to Indictment)**
  *   **Current:** Certification licenses a **fundraising appeal**. It unlocks donor money.
  *   **Required:** Certification would license **coercive action**. It would trigger automatic referrals to the International Criminal Court, mandatory sanctions regimes, or authorized humanitarian intervention (R2P).
  *   **Consequence:** The "verdict" would not be a plea for generosity but a finding of liability. The sequel would not be food drops, but asset freezes, travel bans, or the lifting of sovereignty protections to allow aid delivery by force.

  ### Conclusion

  The current technical practice presupposes that famine is a magnitude of suffering that can be isolated from the machinery of its production. This allows the international system to respond to the symptoms without confronting the pathology. To align the declaration with the legal reality of starvation as a war crime and the economic reality of entitlement failure, the system would have to abandon the comfort of neutrality. It would need to stop measuring famine as a weather event and start measuring it as a weapon.
