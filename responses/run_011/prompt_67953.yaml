  2.  **Analyze the "Declaration Practice" (Task 1 & 2):**

      *   *Current Practice:* Uses numerical thresholds (food deprivation, malnutrition, death rate). Independent experts assess *strictly* on technical/scientific criteria. Verdict = statement on condition, not cause. Sequel = funding appeal, not accountability.
      *   *Implicit Theory:* Famine is treated as a *natural kind* or a *biophysical event* that can be objectively measured independent of human intent. It is ontologically distinct from its causes.
      *   *Threshold vs. Agency:* It presupposes famine is a "threshold state of affairs in the world." It treats the *outcome* (death/starvation) as the definition, not the *process* (denial of entitlements). It assumes agency is either unknowable, irrelevant to the *label*, or politically toxic to include.
      *   *Strict Commitments:* To be a famine, the metrics must be met. Causality is excluded from the *definition*.
      *   *Compatible but Non-Essential:* Evidential caution (hard to prove intent), donor politics (donors give to victims, not lawsuits), operational need (need a trigger to release funds). These explain *why* the system is this way, but aren't logically required by the concept of measurement itself.

  3.  **Analyze the Tension (Task 4):**

      *   *War Crime/Entitlement Framing:* Sen says famine is about entitlements (institutions/agents). International Law (Rome Statute) says intentional starvation is a war crime.
      *   *Conflict:* The technical declaration says "People are dying of hunger." The legal/entitlement frame says "People are being *made* to die of hunger."
      *   *Can they square?* Currently, no. The technical neutrality acts as a firewall protecting potential perpetrators. It creates an epistemic gap between the *fact* of starvation and the *act* of starving. To square them, the definition of famine would need to incorporate causality, not just mortality/morbidity.

  4.  **Reconstructing the Shift: Catastrophe vs. Crime (Task 5):**

      *   *If Famine = Crime:*
          *   *Criteria:* Cannot just be death rates. Must include evidence of *denial*. Blockades, market destruction, aid obstruction. The metric shifts from "how many died" to "how was access denied."
          *   *Certifiers:* Not just nutritionists/epidemiologists. Needs legal experts, human rights investigators, forensic auditors. Independence from humanitarian funding bodies (who need access to perpetrators).
          *   *Licensing/Consequences:* Certification doesn't trigger an appeal; it triggers a referral (ICC, sanctions, intervention). It licenses coercion, not just charity.

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the prompt's sharp insight. Define the current ontology (famine as biophysical threshold).
      *   *Section 1: The Implicit Theory.* Focus on "Famine as Event" vs. "Famine as Process." It treats famine like an earthquake (measurable impact) rather than an arson fire (measurable impact + intent).
