      *   *Section 3: Squaring Neutrality with Accountability.* Argue that they are currently incompatible. Neutrality serves access; accountability threatens it. Sen's theory undermines the neutrality because if famine is entitlement failure, someone failed the entitlement.
      *   *Section 4: Reclassifying as Crime.*
