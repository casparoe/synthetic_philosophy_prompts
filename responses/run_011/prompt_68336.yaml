answer: |-
  1. Two winters ago, our network faced nineteen days where we could not meet the need for dialysis. We operated at sixty percent. We did what we could to keep treatments going, but eleven people died while waiting for water that did not come. This plaque holds their names. I built the system used to schedule those days. I know what it means to see a name on a screen and know that screen decides a life. I am not here to explain the weather or fire. I am here to stand with you in the memory of what happened. When capacity failed, we were left with choices no one should have to make. We made them. People died. Today we name them. We do not smooth the sharp edges of those weeks. We look at the names and acknowledge the loss. Staff and families are together in this space.

  2. I wrote the software that managed the queue. It ranked patients by clinical safety first. But when scores were tied, the system did not pick the earliest arrival. It drew a number. I chose that method because it was clean. It left a record. It meant no single engineer signed off on a specific delay. I wanted the process to be auditable. I wanted the burden shared by the mechanism, not held by a person. At the time, I thought this was about protecting the team. I did not say then what I see now. The random draw refused to weigh one life against another. It treated every tie as a new beginning. It did not assume we could measure the value of a day remaining. It simply acknowledged that when the model could not distinguish, we would not pretend to know more.

  3. There is a difference between counting people and meeting them. A ranking system adds losses together. It asks us to save the most lives possible. It turns individuals into a sum. But grief does not add up. When one person dies, everything they were is lost. There is no math that balances that. The lottery refused to do that math. It gave each person an equal chance when the medical scores were the same. It honored the individual standing there, not the group they belonged to. To rank is to compare. To draw lots is to acknowledge that no one is worth more than another. This does not bring anyone back. It does not fix the nineteen days. But it means we did not decide that some lives were worth less. We gave chance instead of judgment.

  4. I know I speak to a room, but I need to speak to you. To the family of the first name here, your loss is not a statistic. To the family of the last, your person was not a unit of capacity. I cannot say your death served a purpose. I cannot say it saved someone else. It did not. You were not a means to an end. You were a person who needed water and treatment. The system saw a name. You were a life. I want each of you to hear this alone. When your person waited, they were not waiting as part of a group. They were waiting as themselves. The pain you feel is singular. It belongs to you. It does not blend into the pain of the others. I honor that singularity. I honor the specific person who is missing from your table today.

  5. My team stands behind me. We built the tool. We live with what it did. One of us learned later that her father's name was on this list. She still writes code here. She knows what it means to build something that touches a life. We do not hide from that. We carry it. We cannot promise the world will not break again. We cannot promise water will never fail. But we can promise to remember how we chose. We will remember that numbers are not people. We will remember that chance is better than judgment when judgment fails. This plaque is not a closure. It is a marker. We walk past it every day. We see the names. We know what happened. And we keep working, knowing that every line of code meets a human being. Thank you.
