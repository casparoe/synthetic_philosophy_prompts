answer: |-
  ### Move-by-Move Adjudication

  **Move (1) Ilana:** **+1 | Substantive**
  Ilana proposes separating the criterion of the best outcome from the condition of blameworthiness, which is a coherent modification but requires redefining standard maximizing consequentialism. This is not merely verbal; it alters the theory's action-guiding structure to allow for supererogation.

  **Move (2) Theo:** **+2 | Substantive**
  Theo correctly identifies that without modifying the maximizing principle itself, labeling an act "optional" contradicts the claim that one ought to maximize; simply asserting a gap does not create one. This is a substantive logical critique of Move (1)'s internal consistency.

  **Move (3) Ilana:** **+2 | Substantive**
  Ilana introduces a compliance condition, arguing that individual obligation is contingent on collective action, which is a robust challenge to agent-neutral maximizing. This is substantive because it changes the inputs for calculating obligation from "total need" to "fair share of need."

  **Move (4) Theo:** **+1 | Substantive**
  Theo is right that standard act consequentialism is indifferent to burden distribution, but he is slightly hasty in dismissing instrumental justifications for fairness. This is substantive, as it classifies Ilana's move as a category error regarding the theory's core commitments.

  **Move (5) Ilana:** **+2 | Substantive**
  Ilana shifts to a rule-based or indirect view, deriving limits from empirical facts about human psychology and sustainability. This is substantive because it changes the locus of evaluation from individual acts to moral practices or rules.

  **Move (6) Theo:** **+2 | Verbal/Conceptual**
  Theo relies on the distinction between the criterion of rightness and the decision procedure, which preserves the theory's core while conceding on implementation. This is largely conceptual, as it disputes what counts as the "theory" under attack rather than the empirical claims.

  ***

  ### Question 1: Rescue or Abandonment?

  Move (5) is a **rescue** of consequentialism only if you accept Rule Consequentialism (or Two-Level Consequentialism) as a valid species of the genus; if you define consequentialism strictly as Act Consequentialism, it is an **abandonment**. Theo's reply in Move (6) does not defeat Ilana's position unless he stipulates that the "criterion of rightness" must always be act-based. Ilana can accept the distinction between criterion and procedure without loss, provided she argues that the *rules* constitute the moral theory for practical purposes, rendering the abstract criterion morally inert. Theo wins only if he insists that a theory is defined solely by its abstract criterion, but Ilana wins if she argues that a theory incapable of guiding action without self-defeat is defective.

  ### Question 2: Real Defect or Unattractive Implication?

  **Theo is more right** that the demandingness objection targets a real defect in *Act Consequentialism*, while **Ilana is more right** that it targets merely an unattractive implication of *Consequentialism broadly construed*. The objection reveals that Act Consequentialism conflicts with deep-seated considered judgments about personal prerogatives; this is a theoretical defect if one considers those judgments fixed points. However, if one views the theory as malleable (as Ilana does in Move 5), the demandingness is just an implication that can be engineered away via indirect strategies. The dispute ultimately rests on whether one prioritizes theoretical purity (Theo) or reflective equilibrium with human psychology (Ilana).

  ### Question 3: The Two-Dimension Hypothesis

  Your hypothesis is **correct and analytically useful**; it relocates the disagreement in Moves (3) and (4) but leaves the residue in Moves (5) and (6).

  *   **Relocation:** Splitting "Magnitude of Sacrifice" (Dimension 1) from "Sensitivity to Compliance" (Dimension 2) clarifies that Ilana is not just arguing for *less* sacrifice in Move (3), but for a different *structure* of obligation. Theo's counter in Move (4) treats Dimension 2 arguments as if they were merely Dimension 1 concessions (i.e., trying to lower the number). Recognizing the dimensions shows that Move (3) is not a plea for leniency but a structural challenge to how individual obligations aggregate, which Theo misses by labeling it a surrender to deontology.
  *   **Residue:** The distinction does not dissolve Moves (5) and (6). Even if we agree on the two dimensions, the conflict remains over whether the moral *criterion* must track the optimal outcome directly (Theo) or whether it can track a practice that manages those dimensions indirectly (Ilana). Your distinction clarifies *why* Ilana feels the demand is unfair (Dimension 2 violation), but it does not solve the meta-ethical disagreement in Move (6) about whether a theory can be consequentialist if its criterion is not directly maximizing.
