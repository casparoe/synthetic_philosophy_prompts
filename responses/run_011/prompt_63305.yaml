answer: |-
  ### Candidate Plot Engines

  1.  **The Gödelian Lock:** A claim asserts its own unprovability within the market's verification window. The protagonist knows it's true semantically (because if it were provable, it would be false), but cannot generate the syntactic proof required to settle the trade without violating the system's consistency rules.
  2.  **The Computational Horizon:** Two claims are logically equivalent, but proving equivalence requires more compute steps than the settlement period allows. The trader sees the link but cannot bridge the gap before the clock runs out, leaving value trapped in the discrepancy.
  3.  **The Observer Effect:** A claim's truth value depends on the total volume of trades placed against it. The protagonist calculates the equilibrium but realizes entering the market shifts the equilibrium, invalidating the calculation and turning profit into loss.
  4.  **The Inherited Contradiction:** An old claim was priced based on an axiom later found to be inconsistent. The market hasn't crashed because the contradiction is too deep to trace. The auditor finds the crack but can't pull the thread without unraveling her own tenure and the market's legitimacy.
  5.  **The Timeout Arbitrage:** Claims settle as 'null' if not proven by deadline. The protagonist finds a claim that is provable, but only via a proof too long to submit before the deadline. She bets on the timeout, not the truth, profiting from the system's finite patience.
  6.  **The Reflective Stall:** A claim predicts the market's price of itself. The protagonist sees a fixed point where the price should stabilize, but the market's update rule oscillates around it forever due to latency, making the "correct" price a moving target that cannot be hit.

  **Selection:** I chose **The Gödelian Lock**. It most directly dramatizes the user's core frustration: the gap between semantic truth (knowing something is the case) and syntactic provability (being able to demonstrate it within the rules). It allows for a self-referential claim that creates a "free money" scenario which is theoretically visible but practically inaccessible, mirroring the problem of logical uncertainty in finite reasoners.

  ***

  ### The Unprovable Dividend

  The Clearing House did not smell of money. It smelled of ozone and recycled air, the scent of machines thinking too hard in a confined space. Elara stood on the gallery floor, looking down at the trading pit where the clerks moved like ants around the great LED boards. The boards didn't show commodities or currencies. They showed claims.

  *Claim 4402: The Riemann analogue holds for Field 9.* Price: 0.82.
  *Claim 4403: There exists a prime gap greater than 10^6 below 10^9.* Price: 0.99.

  Truth was liquid here. You could buy a share of a theorem for ten credits and sell it for ninety if you found the proof before the settlement cycle closed. But the Clearing had rules, carved into the charter generations ago. You couldn't just say you knew. You had to submit a certificate. A string of logic the verification engines could chew on within the cycle limit. If the engine timed out, the claim remained unresolved, and the shares froze at whatever price the market last agreed upon.

  Elara wasn't a trader. She was an auditor for the Risk Committee. Her job was to ensure the market didn't lie to itself too openly.

  "Watch," said Kael, pointing a stylus at the lower board.

  Kael was a junior trader, bright-eyed and recently bleeding. He had lost a quarter of his endowment on Claim 3310.

  "Claim 3310 implies 3311," Kael said. "Everyone knows it. 3310 settled at 1.00 yesterday. But 3311 is still trading at 0.60."

  "So you bought 3311," Elara said.

  "It's free money. If A is true, and A implies B, then B is true. The market is incoherent."

  "The market is finite," Elara corrected. "Show me the certificate."

  Kael hesitated. "The proof chain is long. It requires expanding the lemma from 3310. The verification engine needs four hours to run the expansion. The cycle closes in two."

  Elara watched the clock on the wall. The second hand swept smoothly, indifferent to logic. "You bought a truth you couldn't cash."

  "I thought the cycle might extend."

  "The cycle never extends." The bell chimed. Cycle closed. On the board, Claim 3311 flickered. It didn't jump to 1.00. It didn't jump to 0.00. It turned grey. *Unresolved.* The price locked at 0.60. Kael's position was now illiquid assets in a dead claim. He had been right about the math and wrong about the world.

  "That's the lesson," Elara said, her voice quiet. "Coherence is a limit. It's where the price goes if you have infinite time to check the work. We don't have infinite time. We have until the bell."

  Kael slumped, staring at the grey light. "It feels like theft."

  "It feels like physics," Elara said. "You can't extract work without a gradient. You can't extract value without a proof."

  She left him there and walked the perimeter of the gallery. Her tablet hummed with the daily anomaly report. Most were noise—traders panicking over false rumors, algorithms overreacting to volume spikes. But one entry pulsed with a steady, irritating red.

  *Claim 8900: This claim will not receive verification status before Cycle 600.*

  Elara stopped. She tapped the glass. The current price was 0.45.

  It was a self-referential lock. A statement about its own status within the Clearing's machinery. She sat on a bench beneath the ventilation ducts and began to think.

  If Claim 8900 is true, then it will not be verified. If it is not verified, it cannot settle as True. It remains unresolved.
  If Claim 8900 is false, then it *will* be verified. If it is verified, the verification engine must have found a proof. But the proof would demonstrate that the claim receives verification status. If the claim receives verification status, the statement "This claim will not receive verification status" is false. So the engine would verify it as False.

  Elara rubbed her temples. This was the loop.

  If the system verifies it, it's False. Price goes to 0.
  If the system doesn't verify it, it's True. Price should go to 1.

  But the system only moves prices based on verification or trade volume. Currently, the market was hedging. 0.45 meant the traders thought there was a 45% chance the engines would crack it before Cycle 600.

  Elara knew better. She knew, with the cold certainty of a mathematician looking at a paradox, that the claim *must* be true.

  Why? Because if it were false, it would be verifiable. If it were verifiable, the engine would find the proof. But the proof would assert that the engine finds the proof. This creates a consistent state where the claim is False and verified.

  Wait. No.

  She closed her eyes. If the claim is False, then it *will* be verified. So the engine finds a proof that it will be verified. That is consistent.
  If the claim is True, then it *will not* be verified. So the engine finds no proof. That is also consistent.

  There were two stable states. One where it is False and Verified. One where it is True and Unverified.

  The market price was 0.45. This implied the market thought the "False and Verified" state was slightly less likely than the "True and Unverified" state.

  But Elara saw the arb. If the claim is True, it pays nothing because it never settles. It stays unresolved forever. You buy shares at 0.45, and you hold them until you die, and they never redeem.
  If the claim is False, it settles at 0.00. You lose your 0.45.

  There was no profit here. It was a trap.

  She looked closer at the charter rules regarding unresolved claims. *Section 12, Paragraph 4: In the event of permanent non-settlement due to logical indeterminacy, assets may be liquidated at the last coherent price estimate.*

  Her breath hitched.

  If the claim is True, it is never verified. It remains unresolved forever. Eventually, the Committee declares it indeterminate. The rule says liquidate at the last *coherent* price.
  What is the coherent price of a True statement? 1.00.
  What is the current price? 0.45.

  If she could force the Committee to recognize the semantic truth of the claim without a syntactic proof, the liquidation value would jump to 1.00. She could buy at 0.45 and cash out at 1.00 upon the declaration of indeterminacy.

  But the Committee didn't accept semantic truth. They accepted certificates.

  Elara stood up and walked to the submission terminal. She logged in as Auditor 44. She opened the proof editor for Claim 8900.

  She began to type. She wrote the argument: *Assume 8900 is False. Then it is verifiable. If it is verifiable, the engine outputs 'False'. This is consistent. Assume 8900 is True. Then it is unverifiable. The engine outputs 'Unresolved'. This is consistent.*

  She needed to break the symmetry. She needed to prove that the engine *could not* verify it.

  She wrote: *The verification engine operates on axioms A1 through A10. Claim 8900 asserts its own unprovability within A1-A10. By Gödel's second incompleteness mechanism adapted for bounded resources, if the system is consistent, it cannot prove its own consistency, and thus cannot prove the claim that asserts unprovability.*

  The compiler blinked red. *Error: Meta-logical argument not accepted. Proof must be object-level.*

  She tried again. She attempted to simulate the verification engine within the proof language itself. She wrote a script that mimicked the engine's search algorithm, trying to show that the search would exhaust the cycle limit before finding a contradiction.

  The progress bar on her terminal crawled. 10%... 20%...
  The simulation was heavy. To prove the engine wouldn't finish, she had to run the engine. But running the engine took resources. The more accurately she simulated it, the more resources she used.

  50%...
  The cycle clock ticked. 400 cycles remaining.
  If she used too much compute to generate the proof, the proof itself would be too large to submit before the deadline. The proof of "I cannot finish" was taking too long to finish.

  80%...
  Her terminal grew hot. The fans in the wall whined.
  She saw the bottleneck. The simulation required her to model the market's reaction to her proof. If she submitted a proof that the claim was unprovable, the market price would shift. If the price shifted, the conditions of the claim (which depended on verification status, which depended on market liquidity rules) might change.

  She was trying to predict the future price of the claim to prove the claim about the future price.

  95%...
  The terminal beeped. *Memory Limit Exceeded.*

  The simulation crashed. She had no certificate.

  Elara sat back. The price on the board below flickered. 0.46. Someone else had bought. Someone else smelled the blood in the water. They would fail too. They would all fail, because the only way to win was to know the truth without being able to show it.

  She looked at the claim again. *This claim will not receive verification status before Cycle 600.*

  She knew it was True. She knew it with a certainty that felt physical, like a stone in her gut. If the system were consistent, it couldn't verify a claim that said it wouldn't be verified. Therefore, it wouldn't be verified. Therefore, the claim was True.

  But because it was True, it would never be verified. And because it would never be verified, she could never collect the payout. The truth of the statement prevented the reward for knowing it.

  It was a perfect lock. A piece of knowledge that paid no dividend.

  Down in the pit, a trader shouted. The price jumped to 0.50. Round number psychology. They were guessing. They were betting on the coin flip of indeterminacy.

  Elara opened her order book. She had the authority to freeze trading on anomalous claims. It was a standard risk mitigation tool. If she froze it, the price would lock at 0.50. The arbitrage would vanish. The market would remain coherent, in the sense that no one could exploit the inconsistency.

  Or she could let it run. Let traders bleed themselves trying to prove the unprovable. Let them throw compute cycles at the wall until the bell rang. The Clearing would collect the transaction fees on every futile trade. The House always won, because the House owned the clock.

  She looked at Kael, still staring at his grey, dead claim. He looked hollowed out. He had trusted the math more than the machine.

  Elara hovered her finger over the *Freeze* command.

  If she froze it, she protected the traders from themselves. She maintained the integrity of the Clearing.
  If she didn't, she acknowledged the reality: the market wasn't a truth machine. It was a mechanism for pricing uncertainty. And this uncertainty was priced correctly. The price wasn't 1.00. The price wasn't 0.00. The price was the cost of the compute required to resolve the paradox.

  The price was the rent you paid for living in a universe where you couldn't know everything.

  0.45 was too low. 1.00 was unreachable. The true value was the probability that the system would crash before the cycle ended.

  Elara withdrew her hand. She closed the audit window.

  She watched the price tick to 0.51. A buy order had filled. Someone else thought they could crack it. They would burn their credits. They would burn their time. And when the bell rang at Cycle 600, the claim would sit there, unresolved, true and unrewarded, just like every other truth that was too heavy to lift.

  Elara turned away from the railing. The air smelled of ozone. The machines hummed, chewing on problems they would never finish, forever approximating the answer, forever coherent in the limit, forever wrong in the moment.

  She walked toward the exit, leaving the free money on the board. It wasn't hers to take. It belonged to the gap.

  ***

  ### Author's Note

  I dramatized the distinction between semantic truth (what is actually the case) and syntactic provability (what can be demonstrated within a formal system). The claim 8900 is a variant of a Gödelian sentence adapted for a bounded resource environment. I faithfully represented the idea that a finite reasoner can "know" a statement is true via meta-logical reasoning while being unable to generate the object-level proof required by the system to cash out.

  I bent the market mechanics for narrative flow. Real prediction markets on logic (like those proposed in logical induction literature) would likely have more complex update rules than simple share trading. I simplified the settlement process to a binary "verified/unresolved" to make the stakes clear. I also cheated slightly on the self-reference; in a rigorous system, the claim would need to reference its own provability predicate specifically, not just "verification status," but the latter reads better for fiction. The core tension—knowing the arbitrage exists but being computationally barred from capturing it—remains technically honest.
