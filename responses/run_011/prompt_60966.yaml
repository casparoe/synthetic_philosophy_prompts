answer: |-
  ### Reading the Passage

  You are asking me to interpret a specific textual fragment to guide a practical, financial, and ethical decision in your trade. Below is an analysis of the six questions you posed, adhering strictly to the provided text, followed by an assessment of your position and the required table.

  #### 1. The Gilding Concession
  The text states gilding is admissible because it is "not understood for gold." The criterion is **what the practice invites viewers to believe**, grounded in **standing conventions** ("frequent usage"). It is not about the physical object alone, but the social agreement surrounding it.
  Does this license cast ornament? The text explicitly separates them. Gilding is an exception ("Nevertheless, there are certain degrees..."). Cast ornament is listed in Head 3 without that exception. Ruskin implies cast ornament has *not* "lost the nature of deceit" through frequent usage in the way gilding has. The text does not license cast ornament simply because everyone knows it is cast; it categorizes it as deceit "of any kind."

  #### 2. The Third Head (Cast or Machine-Made)
  Why is it deceit if visible? The text links Head 3 to Head 2 ("deceptive representation of sculptured ornament"). The lie is not necessarily in the viewer's confusion, but in the **claim about the maker's labour**. A cast ornament occupies the visual place of a carved ornament. By taking that place, it invites the inference that human hand-labour produced it. Even if the viewer knows it is cast, the object itself asserts a mode of production (hand-cutting) that did not occur. The deceit is in the object's claim to a history of making it does not possess.

  #### 3. Concealment versus Suggestion
  The line is drawn at **intention** ("purposed"). Concealment (skin hiding anatomy) is passive; it hides truth but does not assert falsehood. Suggestion (pendants implying support) is active; it asserts a structural relationship that is untrue. "Purposed" adds the condition of design intent to deceive regarding structure.
  Is this consistent with Head 3? **No, not in this text.** Head 1 requires "purposed suggestion." Head 3 prohibits cast ornament "of any kind," with no mention of intent. In Head 1, you can deceive by accident and perhaps be excused; in Head 3, the mere use is the offence. This is a textual inconsistency you can exploit.

  #### 4. The Intelligent Eye
  The standard is the **"intelligent eye."** A building is noble if it reveals truth to this observer, even if the "careless observer" is deceived. This relocates the question from the building's physical reality to its **legibility**. It saves the chapter from condemning all concealment, but it places a heavy burden on the architect to ensure the truth is readable to those capable of reading it. If the steel frame in your vault is invisible, the "intelligent eye" cannot see it, and the deceit stands.

  #### 5. Value
  Truthfulness is a **constituent of nobility**, not merely a constraint. "Architecture will be noble *exactly in the degree* in which all these false expedients are avoided." This implies a sliding scale. A deceptive building might still be "architecture," but it forfeits "nobility" proportionally. The text does not explicitly say beauty is spoiled, but since "noble" is the highest predicate Ruskin applies here, deception effectively caps the building's value. You cannot achieve the highest rank with false expedients.

  #### 6. History of Making vs. Viewer Belief
  The text tries to hold both, but the **gilding example gives away the "Viewer Belief" half.** If gilding is acceptable because it is "not understood for gold," then viewer understanding is the ultimate arbiter. If viewer understanding is the arbiter, then a "fully documented cast" *should* be admissible if it is "not understood for carving."
  However, Head 3 ("of any kind") contradicts this by banning the method regardless of understanding. The text cannot fully hold both. It prioritizes Viewer Belief in the exception (gilding) but prioritizes History of Making in the rule (cast ornament). If you force a choice, the gilding concession suggests that if you can make the cast capitals "not understood for carving" (e.g., by leaving them visibly rough or marked), they might pass. But the text as written leans heavily toward condemning the method itself.

  ***

  ### Assessment of Your Position

  **Are your questions leading?**
  Yes. Questions 2 and 6 are framed to elicit a condemnation of casting. Q2 asks you to "locate the lie," presuming one exists. Q6 asks if history matters, presuming it should. Questions 1 and 4 are your escape routes; they focus on convention and the observer, which are the only grounds on which casting could be defended using *this specific text*.

  **Reading Least Favourable to Your Position (Cast Capitals are Admissible):**
  This reading leans heavily on the "Gilding Concession" and the "Intelligent Eye." It argues that deceit requires a false belief. If the parish and architect know the capitals are cast, and the "intelligent eye" can see the parting lines or lack of tool marks, no false belief is invited. Therefore, under the logic of §VI's exception, cast ornament has "lost the nature of deceit" through modern familiarity. The "of any kind" in Head 3 is read as hyperbole, qualified by the general principle that only "false expedients" (i.e., those that fool) are condemned.

  **Reading Most Favourable to Your Position (Cast Capitals are Condemned):**
  This reading takes Head 3 literally: "use of cast or machine-made ornaments of any kind." It argues that the deceit is intrinsic to the object, not the viewer's mind. A cast capital claims the authority of hand-carving by occupying its form. Even if documented, it is a "false expedient" that avoids the labour required for nobility. The gilding exception is unique to surface decoration that is conventionally symbolic, not structural or sculptural replication. Therefore, casting is inherently ignoble regardless of viewer knowledge.

  ***

  ### Specification Analysis Table

  | Item | Head under §VI | Belief invited | Gilding concession | Verdict on the passage | Pressure point |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Cast capitals** | Cast-or-machine | Invites belief they are hand-carved; false. | No; casting is not a convention "not understood" for carving. | Condemned | "Ornaments of any kind" admits no exception for documented casts. |
  | **2. Grained softwood** | Surface | Invites belief wood is oak/marble; false. | No; graining is explicitly cited as deceit in Head 2. | Condemned | Text explicitly names "marbling of wood" as a deceit. |
  | **3. Non-structural vault** | Structural | Invites belief stone ribs carry load; false. | No; structural truth is not a matter of convention. | Condemned | "Suggestion of a mode of support, other than the true one." |
  | **4. Soot-matched stone** | Surface | Invites belief new stone is aged; debatably false. | Turns on fact; is "aged stone" a "other material"? | Turns on a fact the passage cannot supply | Whether chemical darkening counts as "painting of surfaces." |
  | **5. Gilded lettering** | None | Not understood to be solid gold. | Yes; explicitly exempted in §VI. | Admissible | Text states gilding "is therein no deceit." |
  | **6. Hand-carved facsimile** | None | Invites belief it is a copy made by hand; true. | N/A; method is truthful. | Admissible | No false expedient used; labour is genuine. |

  ***

  ### Bottom Line

  Ranked from most clearly condemned to least: **3 (Vault), 2 (Graining), 1 (Cast Capitals), 4 (Soot Matching), 6 (Hand-Carved), 5 (Gilding).** The passage genuinely cannot decide on **Item 4**, as it depends on whether "aged appearance" counts as "other material" under Head 2, which the text does not define.
