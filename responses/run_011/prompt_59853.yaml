  ### Part 5: The Test Case for Next Year

  To definitively settle which standard the committee is running (Dual-Track vs. Functional Capacity), table the following hypothetical application next term:

  **The Hypothetical:**
  An applicant with no diagnosed medical condition who depleted savings and lacks references because they took two years off to care for a **pet** with a chronic illness. They now seek a living allowance to study part-time, arguing they cannot work full-time due to the ongoing care requirements of the animal.

  **Separation:**
  *   **Standard I (Dual-Track) predicts REFUSAL.** Caregiving for a pet falls under the "Lifestyle Track" (Voluntary Plan/Preference), unlike human dependants (b). It is not a medical cost (h).
  *   **Standard II (Functional Capacity) predicts FUND.** The applicant's *current capacity* to earn is objectively reduced by the care requirement, regardless of the beneficiary (human vs. pet).

  **Why this settles it:**
  This case isolates the definition of "Responsibility." If the committee funds, they are operating on *Current Capacity* (Standard II). If they refuse, they are operating on *Socially Recognized Duty* (Standard I). This forces the bloc to clarify whether they fund *constraints* or *obligations*.
