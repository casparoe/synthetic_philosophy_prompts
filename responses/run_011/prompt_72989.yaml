      *Action Plan:* Structure the response to lead the user to the conclusion that their index is robust *because* it includes welfare markers, which addresses the "shedding superstructure" critique.

  11. **Drafting the Content:** (Mental outline of the response sections)
      *   Intro: Validate the "two purposes" observation.
      *   Section 1: The Menu of Claims (Claim, Type, Verdict).
      *   Section 2: Which claims defeat the index? (Focus on the proxy validity).
      *   Section 3: Differential Force (Rome vs. Maya/Rapa Nui).
      *   Section 4: Strategic Concessions (What to say to the committee).

      *Refining the "Verdict" on the Proxy Claim:* The historian says the index *cannot in principle* distinguish. This is **Substantive and False** *if* the welfare markers correlate with the admin markers. If admin drops but welfare stays same = Transformation. If admin drops AND welfare drops = Collapse. The index *does* allow this distinction. I need to make sure the user sees this lever.

      *Refining the "Verdict" on the Welfare Claim:* "Average person no worse off." For Rome: Defensible. For Maya/Rapa Nui: False (osteological evidence suggests otherwise).

