  **(Self-Correction during drafting):** I initially thought about suggesting removing the scores entirely. But the prompt asks what would have to change to rebuild on the *weakest theory that is still useful*. Keeping *some* metric might be useful if reframed as "Office Maturity" or "Process Formality" rather than "National Directness." Actually, better to suggest replacing scores with *protocols*. Scores imply measurement of a trait; protocols imply instructions for action. I will advocate for dropping the scores.

  9.  **Final Review against constraints:**
      *   Did I reconstruct the implicit theory? Yes.
      *   Did I distinguish strong vs. weak claims? Yes.
      *   Did I identify foreclosed rivals? Yes.
      *   Did I address selection effect and scale usage? Yes.
      *   Did I propose changes for coherence with policy? Yes.

