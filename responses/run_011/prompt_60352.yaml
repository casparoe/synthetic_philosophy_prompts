      *   *Refining the "Weak Theory":* The weakest useful theory is *coordination conventions*. It's not that Japanese people *are* indirect; it's that the Nagoya office *requires* pre-meeting consensus (nemawashi) for a meeting to succeed. That's a rule, not a trait.

