prompt: |-
  just got out of a three hour argument with a friend and i need a tiebreaker. he reads a lot of effective-altruism-adjacent stuff and his line is that you never actually have to resolve moral uncertainty, because you can hedge across moral theories exactly the way you'd diversify a portfolio — split your giving between global health and animal welfare, hold a bit of each position, and you're covered whichever theory turns out to be right. he thinks that dissolves the whole problem: no betting the farm on utilitarianism vs deontology vs anything else. i said the finance analogy is carrying way more weight than he'll admit, and he said i was just making an aesthetic objection to straightforward expected value under uncertainty.

  can you audit it for me? lay out the correspondences explicitly — what's the asset, what's the weight, what's the return, what plays the role of the market that prices these things, what's the future state of the world that gets resolved and pays out. then where the mapping snaps, and separate the breaks that actually threaten his conclusion from the ones that are just cosmetic. a couple i kept reaching for: does an act have a return at all, in the way a currency position does, when i learn which theory was true? and all the theories are scoring the same one act in the same one world, not mutually exclusive states of nature, so what would spreading across them even reduce the variance of? he could never tell me what the numeraire is that lets you compare a unit of deontic credit to a unit of wellbeing.

  is there a version of his point that survives as insurance rather than diversification — something like not buying factory-farmed meat because one theory calls that a catastrophe and the other calls it a minor annoyance? and if the portfolio picture is the wrong one, what's a better analogy for acting under moral uncertainty that doesn't quietly assume the thing it's supposed to explain?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user just had a 3-hour argument with a friend about moral uncertainty and effective altruism (EA).
      *   **Friend's Position:** Moral uncertainty can be resolved via "moral hedging" (portfolio diversification). Split resources between causes (global health, animal welfare) to cover different moral theories (utilitarianism, deontology, etc.). No need to resolve which theory is true.
