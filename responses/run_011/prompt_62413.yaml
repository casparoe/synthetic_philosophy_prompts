  9.  **Final Polish:** Check for clarity, flow, and ensure all parts of the prompt are addressed. (The prompt asks for specific correspondences, breaks, insurance version, and better analogy).

  *(Self-Correction on the "Insurance" point)*: The user asked if there's a version that survives as insurance. I need to be careful. Insurance usually implies a contract. Here it's more like "risk avoidance." I should frame it as "Robustness" or "Minimax Regret."

