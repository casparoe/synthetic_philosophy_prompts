  The target
  The account must specify truth conditions for claims of the form "Manual M correctly translates language L into English." It cannot merely describe the linguist's heuristic methods but must define what constitutes correctness such that it explains ordinary linguistic understanding. Being "right" entails capturing how speakers grasp meaning despite lacking access to others' mental states. The account must bridge the gap between the radical translation scenario—where evidence is strictly behavioral—and everyday communication, where we assume we understand each other. It must avoid treating meaning as a private object while explaining the normative force of semantic claims. Success is measured by whether the account renders linguistic understanding intelligible as a natural phenomenon without collapsing into skepticism or positing occult entities. It must validate the intuition that there is a fact of the matter about what we mean, even if that fact is not empirically decidable in every case.

  The desiderata
  1. **Communicative Success:** The account must explain the linguist's manifest ability to predict native behavior and coordinate action. In ordinary life, speakers successfully navigate social interactions using language; a theory denying this possibility fails phenomenologically. The linguist constructs a manual that works; speakers rely on shared understanding. The theory must explain how this coordination is achieved given limited evidence. It cannot treat successful communication as a massive illusion or lucky guess. The mechanism of understanding must be robust enough to sustain complex cooperation, not just simple stimulus-response conditioning. This grounds the theory in the observable reality of language use rather than abstract speculation.

  2. **Empirical Equivalence:** The account must accommodate the possibility of rival manuals fitting all observable evidence yet differing in translation. Quine argues that multiple systems can map inputs to outputs identically while assigning different meanings to parts. A theory must state whether both manuals are correct, only one, or neither. If both, meaning is indeterminate; if one, there must be facts beyond behavior. This desideratum forces a choice between indeterminacy and hidden facts. It challenges the notion that evidence uniquely determines meaning. The account must clarify whether semantic facts outrun behavioral evidence or if meaning is inherently underdetermined by physical data.

  3. **Sentence-Term Distinction:** The account must distinguish confirmation at the sentence level from reference at the term level. Speakers agree on utterance truth conditions while disagreeing on what specific words refer to (e.g., "gavagai" as rabbit vs. rabbit-stage). Collapsing this distinction leads to confusion about where meaning is fixed. Sentences face the tribunal of experience as a corporate body; terms do not have independent empirical checks. A viable theory must preserve this holism without denying that words refer. It must explain how reference can be inscrutable while sentence meaning remains stable. This prevents category errors in semantic analysis.

  4. **Physicalist Supervenience:** The account must respect the constraint that semantic facts are fixed by physical facts. There are no non-physical additions to the world; if two situations are physically identical, they are semantically identical. This excludes dualist appeals to private mental contents inaccessible to observation. The theory must locate meaning within the causal order. If meaning depends on something beyond physical disposition and environmental history, it violates naturalism. This ensures the account fits within a scientific worldview. It demands that semantic properties emerge from physical configurations without remainder. This limits the resources available to fix meaning.

  5. **No Meaning Objects:** The account must not smuggle in meanings as objects waiting to be inspected. Meanings are not Platonic forms or mental images accompanying words. Positing such entities invites an infinite regress of interpretation. The theory must explain understanding without reifying sense into substance. This avoids the myth of the museum where words are labels for fixed entities. It requires a use-based or functional account of semantics. The constraint ensures the theory remains grounded in practice rather than metaphysics. It demands that meaning be explicable via relations between signs, users, and world.

  Status
  1. Non-negotiable; denial contradicts the evident phenomenon of successful coordination.
  2. Camp-relative; Quineans accept indeterminacy, Realists posit hidden facts to resolve it.
  3. Non-negotiable; required to maintain logical coherence between holism and reference.
  4. Camp-relative; Naturalists require it, Dualists or Non-naturalists reject physical exhaustiveness.
  5. Camp-relative; Platonists or Mentalists posit meaning-entities, Behaviorists reject them.

  The conflict
  The jointly unsatisfiable subset comprises Physicalist Supervenience, No Meaning Objects, and the implicit demand for Determinacy of Reference inherent in ordinary understanding. If semantic facts are fixed solely by physical behavior (Physicalism) and meanings are not independent objects (No Meaning Objects), then there is no fact of the matter to distinguish between empirically equivalent manuals regarding reference. Quine resolves this by accepting Indeterminacy, sacrificing Determinacy. Realists resolve it by positing hidden facts or meaning-entities, sacrificing Physicalism or No Meaning Objects. Ordinary understanding assumes Determinacy—we think there is a right answer about what "rabbit" refers to. Therefore, you cannot maintain that meaning is purely physical/behavioral, deny meaning-entities, and insist reference is determinate.

  Furthermore, this tension threatens the constraint regarding First Language Acquisition. If reference is indeterminate, how do children latch onto specific meanings without accessing hidden facts? A theory must explain learning without presupposing the determinacy it denies. Additionally, the account must distinguish Inscrutability from External World Skepticism; denying fixed reference is not denying the world exists. Collapsing this distinction renders the theory implausible.

  The most exclusionary requirement is Physicalist Supervenience combined with No Meaning Objects. This pair eliminates the resources needed to secure Determinacy against rival manuals. Any account satisfying these two must accept Indeterminacy, thereby conflicting with the common-sense intuition that our words have specific references fixed by reality. This excludes Realist and Mentalist accounts immediately. Conversely, maintaining Determinacy requires abandoning strict Physicalism or admitting meaning-entities. Thus, the naturalist constraint is the primary filter that forces the radical conclusion of inscrutability, making it the hardest constraint to reconcile with ordinary semantic intuitions. It demands a revision of our self-conception as speakers who mean specific things, forcing a choice between naturalism and common sense.
