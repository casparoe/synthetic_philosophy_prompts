reasoning: |-
  The user wants a decision tree in JSON format for a grad seminar handout on moral psychology. The tree should help distinguish genuine moral preferences from biases in judgment.

  Key requirements:
  1. Start from "here's a pattern in people's moral judgments that looks suspicious"
  2. End at named stances about what bias actually is
  3. Build from logical space, not author lists
  4. Each branch should be answerable without knowing which position it leads to
  5. At least four branches from these axes:
     - Whether "bias" names a natural kind or is a normative placeholder
     - Whether the standard being violated is internal or external
     - Whether bias is attributed to agents or to individual judgment tokens
     - Whether bias-talk is truth-apt at all
  6. Anchor in concrete cases (framing, identifiable victims, order effects)
  7. Don't ask "do you think moral intuitions are reliable?"
  8. Required leaves: debunking genealogy, coherentist reflective equilibrium, self-standards/procedural view, natural-kind view, eliminativist error theory
  9. Flag inseparable leaf pairs and list unoccupied cells with diagnosis

  Let me think through the logical space:

  **Axis 1: Natural kind vs. Normative placeholder**
  - Natural kind: bias is a psychological category with causal properties
  - Normative placeholder: bias is just "deviation from correct standard"

  **Axis 2: Internal vs. External standard**
  - Internal: violates the agent's own endorsed principles
  - External: violates some objective or theorist's standard

  **Axis 3: Agent vs. Token attribution**
  - Agent: the person is biased
  - Token: this particular judgment is biased

  **Axis 4: Truth-apt vs. Not truth-apt**
  - Truth-apt: claims about bias can be true or false
  - Not truth-apt: bias-talk is expressive, pragmatic, or eliminable

  This gives us 2×2×2×2 = 16 possible combinations. 

  Now I need to map the five required leaves onto this space and identify which combinations remain empty. Debunking genealogy treats bias as a natural kind with external standards at the agent level and makes truth-apt claims. Coherentist reflective equilibrium uses internal standards through a procedural lens, also truth-apt. The self-standards view is explicitly internal and procedural. Natural-kind views are truth-apt and treat bias as a psychological category. Eliminativist error theory rejects truth-aptness entirely.

  I'll construct the decision tree to navigate these distinctions, then document which cells stay unfilled and why some positions might be indistinguishable from others. I need to map out the decision tree structure carefully. The four axes create 16 possible combinations, but only 5 leaves are required, so many cells will remain unoccupied.

  Let me work through the branching logic:

  **Node 1: Truth-aptness** - This should come early since it fundamentally shapes what kind of claim we're making about bias.

  **Node 2: Natural kind vs. normative** - This determines whether we're talking about psychological categories or evaluative standards.

  **Node 3: Internal vs. external standard** - This matters for what counts as a violation.

  **Node 4: Agent vs. token** - This affects the unit of attribution.

  Let me map the required leaves:

  1. **Debunking genealogy**: Truth-apt, Natural kind, External standard, Agent-level (typically)
  2. **Coherentist reflective equilibrium**: Truth-apt, Normative placeholder, Internal standard, Agent-level (through procedure)
  3. **Self-standards/procedural**: Truth-apt, Normative placeholder, Internal standard, Token or Agent
  4. **Natural-kind view**: Truth-apt, Natural kind, Could be either standard, Agent or Token
  5. **Eliminativist error theory**: Not truth-apt (or deflated), eliminates bias talk

  I need to be careful about inseparable pairs - some combinations might lead to the same practical position even if theoretically distinct.

  Let me build the JSON structure now.
