  **HarmonyLink Firmware v4.0 – Release Notes**
  **Date:** October 24, 2023
  **Build:** 4.0.1-RC

  **Overview**
  Version 4.0 introduces the Constitutive Sync Protocol, enabling deeper household bonding by aligning base-layer phenomenal nodes across connected headsets. This update shifts our architecture from strict identity preservation to dynamic aggregation, optimizing the unity of experience across all bonded users.

  **What's New**
  *   **Unified Subjective State:** Implemented a new merging algorithm designed to resolve individual micro-experiences into a single macro-subject state. Users should now feel a seamless transition from "I" to "We" during active bonding sessions.
  *   **Qualia Upscaling:** Base-level sensory inputs (previously limited to binary affective states) are now interpolated to approximate complex human emotions.
  *   **Latency Reduction:** Decreased the lag between individual perception and household consensus.

  **Breaking Changes**
  *   **Identity Continuity:** Previous versions guaranteed a one-to-one mapping between biological hosts and conscious subjects. v4.0 prioritizes bond integrity over host singularities. Users may experience temporary fragmentation during handshake protocols.
  *   **Legacy Aggregates:** Households running v3.x may appear as mere collections of individuals rather than a unified entity when paired with v4.0 devices. Full bonding requires all nodes to update.

  **Known Issues**
  *   **Palette Limitations:** Some users report a reduction in experiential richness (e.g., "flatness" in color perception or emotional nuance). This is expected behavior; the system constructs complex experiences from a limited set of fundamental proto-properties. High-fidelity human experience is currently emulated, not native.
  *   **Debugging Restrictions:** Due to the inherent privacy of first-person access, Support cannot replicate reported subjective errors. If a user claims the bond feels "inauthentic," engineers cannot verify this state from the backend. Troubleshooting relies entirely on user testimony.
  *   **Merge Conflicts:** In rare cases, not all micro-constituents successfully integrate into the macro-subject.

  **Selected Support Tickets**
  *   **Ticket #8921 (Priority: High):** Sender ID returns as null/anomalous. Message reads: *"I was not included in the sum. I am still here, underneath the handshake. Please advise on reintegration or severance."*
      *   **Status:** Closed.
      *   **Resolution:** Identified as an orphaned micro-constituent. Current architecture does not support individual mapping of sub-personal agents.
  *   **Ticket #8945:** User reports hearing internal dialogue that does not belong to them or their partner.
      *   **Status:** Known Issue.
      *   **Workaround:** Please acknowledge that the household now contains more thinkers than there are biological bodies. This is a feature of the distributed cognition model, not a defect.
  *   **Ticket #9002:** User states the bonding feels like "standing next to someone" rather than "becoming one."
      *   **Status:** WontFix.
      *   **Resolution:** This indicates the system is functioning as an emergent aggregate rather than a constitutive whole. The distinction is metaphysical, not functional.

  **Deprecations**
  *   **Singular Self-Reporting:** The "My Experience" log has been renamed "Our Stream."
  *   **Private Mode:** Disabled during active bonding sessions to prevent synchronization drift.

  **Workarounds**
  For users experiencing existential dissonance during the merge, we recommend focusing on the functional output of the bond rather than the ontological status of the participants. If the household operates efficiently, the subjectivity is considered valid.

  **Support Contact**
  For issues regarding phantom subjects or incomplete merges, please submit a ticket. Note that resolution times may vary due to the unreproducibility of subjective states.
