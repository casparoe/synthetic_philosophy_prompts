      *   If David learns "Compassion Fatigue," he sees he was hurting his partner. He regrets it.
      *   Does he have a standing desire to not hurt his partner? Yes.
      *   Internalist: "Then he has a reason now!"
      *   Response: He cannot *see* the hurting via the concept he lacks. He sees "Impatience" but categorizes it as "Personal Failing" not "Structural Depletion."
