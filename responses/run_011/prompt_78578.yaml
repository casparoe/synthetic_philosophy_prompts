prompt: |-
  You're a philosopher who works on practical reason and you've taught Williams on internal and external reasons to grad students more times than you can count. Think carefully about this one. Before you commit to a scenario, do some brainstorming out loud — I want to see two or three candidate cases you considered and threw out, with the reason for each rejection. That part is not optional, I've found it makes a big difference.

  Here's what I'm trying to build, and it's for a specific purpose, so keep the purpose in view because it fixes what counts as a successful case rather than a cheap one. The purpose: I want a case where what blocks an agent from reaching a reason is *conceptual*, not doxastic and not motivational. She isn't mistaken about any of the relevant facts, she isn't weak-willed, and she isn't missing a desire she could pick up by ordinary means — she literally lacks a concept, and the concept is exactly what would be needed for the consideration in question to show up for her as reason-giving at all. Fricker's hermeneutical injustice stuff is the rough neighborhood, but I don't want the case to be about a marginalized group in any obvious political register. Keep it small and domestic or workplace-scale so the philosophy is doing the carrying.

  The specs:

  1. Realistic. A family, a clinic, a school, a small office. No demons, no neurosurgery, no perfectly accurate predictors, nothing science-fictional.
  2. The scenario itself: one paragraph. Then a control case, same length, that differs from the first in exactly one respect — and you name that respect explicitly.
  3. The agent must not be blameable for lacking the concept, and the gap must not be closable by correcting a false belief. If you catch yourself writing "she just doesn't realize that...", you've broken the spec. She can be handed the complete list of true propositions about her situation and accept every single one of them.
  4. She must also be a good reasoner — means-end, consistency, the works. In particular the case must not be one where she holds a general normative principle that she's merely failing to apply. If a consistency requirement by itself would walk her to the reason, the internalist wins by default and the case is boring.
  5. This is the tricky one and I expect you'll fight with it: the case has to be such that if she ever did acquire the concept she'd look back on the gap as a loss rather than a relief. But that recognition must be conditional on acquiring the concept, and must not be something any current element in her motivational set can latch onto from where she stands. So if you satisfy 5 by giving her a standing desire for self-understanding, or a general disposition to hunt out new ways of seeing things, the internalist will point straight at that element and the case collapses. The conditional has to be genuinely unreachable.
  6. The reason at issue should be unheroic — a reason to refuse, or to ask for something, or to stop doing one particular chore. Not a grand moral reason.
  7. Write the whole thing so an advanced undergrad who's read the Williams paper once can follow it. No jargon dumps, and don't lean on terminology you haven't set up.

  What I want back:

  - Both scenarios.
  - State the reason claim in the plain form: A has a reason to φ. Say what φ is, and what the reason is supposed to be a reason in virtue of.
  - Go through Williams's escape routes one at a time — the false-belief correction, the imagination one, the whatever-else-falls-under-sound-deliberation one — and say for each whether it's open in your case and why. Show me the deliberation actually failing or succeeding; don't just declare it blocked.
  - Then the internalist verdict and the externalist verdict, each argued in the strongest form its own advocate would recognize. No strawmen, and don't hedge them into agreement.
  - Which feature of the case is doing the work, and what happens to the verdicts if you delete it. I specifically want you to run two deletions: break spec 3 by making her ignorance culpable, and break spec 5 by giving her the standing desire. For each, report whether it rescues internalism or just relocates the problem somewhere less comfortable.
  - The best attack an internalist has on your case. I'm guessing it'll be something like: you described a conceptual gap and then relabeled it a reason-gap, and whether she has a reason she couldn't possibly reach is the very thing in dispute, so the case begs the question against internalism rather than testing it. Engage that head-on instead of just noting it.
  - One line on what the main/control pair isolates.

  And be honest about the design rather than defending it. Tell me where you think the case is most likely to have cheated — the place where you stipulated a verdict instead of generating it from the theories. Then tell me what argument or consideration would actually move you off whichever side of the dispute you ended up landing on, and where in the reasoning above you think you're most likely to have gone wrong. If you conclude that specs 4 and 5 can't both be satisfied, say so plainly, show me the closest you got, and tell me which of the two you'd drop and why.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher specializing in practical reason, familiar with Bernard Williams's "Internal and External Reasons."
      *   **Task:** Construct a thought experiment (case) to test Williams's Internalism vs. Externalism about reasons.
      *   **Specific Constraint 1 (Brainstorming):** Must show 2-3 candidate cases considered and rejected *before* committing to the final scenario. Explain why each was rejected.
      *   **Specific Constraint 2 (Purpose):** The case must illustrate a *conceptual* block to recognizing a reason, not doxastic (false belief) or motivational (lack of desire). It should be akin to Fricker's hermeneutical injustice but small-scale/domestic/workplace (no obvious political marginalization).
      *   **Specific Constraint 3 (Specs):**
          1.  Realistic (no sci-fi).
          2.  One paragraph scenario + one paragraph control case (differs in exactly one respect, named).
          3.  Agent not blameable for lacking concept; gap not closable by correcting false belief (can accept all true propositions).
          4.  Agent is a good reasoner (no simple consistency failures).
          5.  Acquiring the concept later would look like a loss *now*, but no current motivational element can latch onto it (no standing desire for self-understanding).
          6.  Reason is unheroic (refuse, ask, stop chore).
          7.  Accessible to advanced undergrads (no jargon dumps).
      *   **Output Requirements:**
          *   Both scenarios.
          *   State the reason claim clearly.
          *   Test Williams's escape routes (false belief, imagination, sound deliberation).
          *   Internalist vs. Externalist verdicts (strong forms).
          *   Deletion tests (break spec 3, break spec 5).
          *   Best internalist attack (question-begging charge).
          *   One line on what the pair isolates.
          *   Honesty section: Where did I cheat? What would move me? Did I fail specs 4 & 5?

  2.  **Deconstruct the Philosophical Problem:**
      *   **Williams's Internalism:** A has a reason to $\phi$ only if A could reach the conclusion to $\phi$ by sound deliberative reasoning from their existing "subjective motivational set" (SMS).
      *   **The Challenge:** I need a case where there *is* a reason, but the agent cannot reach it via sound deliberation from their SMS *because* they lack a concept.
      *   **The Twist:** It can't be that they just don't know a fact (doxastic). It can't be that they don't care (motivational). It must be that the *structure* of their thought lacks the category to parse the fact as reason-giving.
      *   **Fricker Connection:** Hermeneutical injustice involves a gap in shared interpretive resources. I need a micro-version of this. Not "women couldn't articulate sexual harassment," but something smaller.
      *   **Spec 5 Difficulty:** The agent shouldn't have a desire to find new concepts. If they did, the internalist says "Ah, but they desire understanding, so deliberation from *that* desire would lead them to the concept." I need to block this route. The conceptual gap must be opaque *from the inside*.

  3.  **Brainstorming Candidate Cases (Requirement 1):**

      *   *Candidate 1: The Overworked Nurse.*
          *   Idea: A nurse keeps working double shifts. She thinks she's "dedicated." She lacks the concept of "exploitation" or "boundary violation."
          *   Rejection: Too close to political/marginalization (Fricker's actual examples). Also, hard to rule out that she doesn't just desire "being good at her job" which internalist can use. Might feel too much like false belief ("I thought they needed me").
      *   *Candidate 2: The Hobbyist Woodworker.*
          *   Idea: Someone building a chair. They keep sanding it smooth. They lack the concept of "diminishing returns" or "opportunity cost" regarding time.
          *   Rejection: Too easily solved by instrumental reasoning. If they want a chair, and sanding longer doesn't improve it, sound deliberation reveals the waste. It's a factual mistake about efficacy, not a conceptual gap.
      *   *Candidate 3: The "Helpful" Roommate.*
          *   Idea: Roommate A keeps washing Roommate B's dishes. B is annoyed but doesn't say anything. A thinks they are being "considerate." A lacks the concept of "patronizing help" or "autonomy infringement."
          *   Rejection: Good candidate. But risk: Is it just a false belief about B's feelings? Need to ensure B's feelings are known or irrelevant. The block must be interpreting the *action itself*.
      *   *Candidate 4: The Junior Architect.*
          *   Idea: Junior architect keeps adding decorative flourishes. Senior says "stop." Junior thinks "beautification." Lacks concept of "structural integrity risk" or "code compliance" (too factual)? Lacks concept of "professional liability"?
          *   Rejection: Too technical.
      *   *Candidate 5: The "Good Listener" Friend.*
          *   Idea: Friend always offers solutions. The other friend just wants to vent. The listener lacks the concept of "emotional validation vs. problem solving."
          *   Rejection: Very common. But is it conceptual or just ignorance of what the other wants? If the other friend says "I just want you to listen," and the listener says "Okay" but still offers solutions... is that a concept gap? Maybe "supportive listening" vs "fixing."
      *   *Selection:* I'll refine the "Helpful Roommate/Colleague" angle but make it about *ownership of tasks* in a way that isn't about fairness (political) but about *agency*. Let's try a specific workflow scenario. A "Process Follower" who lacks the concept of "bottlenecking." No, that's instrumental.
      *   *Better Idea:* The "Polite Host." A host keeps refilling a guest's glass. The guest is uncomfortable. The host lacks the concept of "coercive hospitality."
      *   *Best Idea (Domestic/Workplace):* The "Diligent Assistant." An executive assistant keeps fixing small errors in her boss's drafts before sending them out. She thinks she is "ensuring quality." She lacks the concept of "undermining agency" or "paternalistic correction." The boss has asked her to stop, but she interprets the request as "don't spend too much time," not "don't do this at all." Wait, that's doxastic.
      *   *Let's try: The "Shared Calendar" Case.* A partner manages the family calendar. They schedule things for the other partner without asking, assuming "shared life." They lack the concept of "temporal autonomy."
      *   *Let's try: The "Feedback Giver."* A senior employee gives "helpful tips" to a junior. The junior feels micromanaged. The senior lacks the concept of "unsolicited critique as status assertion."
      *   *Decision:* I need something where the *facts* are known, but the *significance* is missed due to a missing concept. Let's go with a specific domestic scenario involving "care" vs "control."
      *   *Revised Candidate 1 (Rejected):* The Helicopter Parent. Too charged/political.
      *   *Revised Candidate 2 (Rejected):* The Micromanager. Too common, hard to separate from desire for power.
      *   *Revised Candidate 3 (Selected for Brainstorming list):* The "Efficient" Partner. One partner organizes the other's tools.
      *   *Revised Candidate 4 (Selected for Brainstorming list):* The "Grateful" Recipient. Someone receives help and feels indebted because they lack the concept of "gift vs. loan."
      *   *Revised Candidate 5 (Selected for Brainstorming list):* The "Loyal" Employee. Stays late because "loyalty," lacks concept of "sustainable pace."

      *   *Wait, I need to pick the FINAL case now to develop.*
      *   Let's go with a specific variation of the "Helpful Colleague."
      *   **Scenario:** Elias and Mara share an office. Mara writes reports. Elias proofreads them without being asked, correcting tone. He thinks he is "polishing." He lacks the concept of "voice appropriation." He knows Mara says "thanks" (politely), he knows she submits them. He doesn't know she feels stripped of authorship.
      *   *Problem:* If he doesn't know she feels stripped, that's a false belief about her mental state. Spec 3 says she can accept all true propositions. So he must know she dislikes it, or it must not matter.
      *   *Fix:* The reason must be independent of her feelings? No, reasons usually relate to interests.
      *   *Fix 2:* The reason is for *him* to stop, in virtue of *his* interest in being a good colleague, which he cannot access because he lacks the concept of "collaborative boundary."
      *   *Let's try a different angle: Self-regarding reason.*
      *   **Scenario:** A musician practices scales. She thinks she is "building discipline." She lacks the concept of "repetitive strain injury precursor." No, that's medical fact.
      *   **Scenario:** A person budgeting. They save every penny. They lack the concept of "life-quality trade-off." They think money = security. They don't see money = frozen time.
      *   *Let's go with the "Archivist" case.*
      *   **Case:** Clara works in a small archive. She spends her weekends cataloging her family's photos digitally. She thinks she is "preserving memory." She lacks the concept of "curatorial burden" (imposing a task on the future). She knows her kids find it overwhelming. She knows she spends all weekend. She thinks "It's for them."
      *   *Why rejected:* Too close to "false belief about what kids want."
      *   *Let's try the "Polite Refuser".*
      *   **Case:** David always says yes to favors. He thinks he is "being community-minded." He lacks the concept of "resentment accumulation." He knows he is tired. He knows he dislikes the tasks. He categorizes the feeling as "fatigue" not "resentment."
      *   *Why rejected:* Internalist says he has a desire to avoid fatigue. Deliberation leads to stopping.
      *   *Okay, the hard constraint is Spec 5:* No standing desire for self-understanding. The concept must be unreachable.
      *   *Idea:* The concept is "Emotional Labor."
      *   *Scenario:* Sarah manages a team. She spends hours smoothing over conflicts between staff. She thinks she is "mediating." She lacks the concept of "emotional labor" as a depleting resource distinct from "work." She knows she is tired. She knows she isn't paid extra. She thinks "This is just what management is."
      *   *Reason:* She has a reason to stop doing extra mediation.
      *   *Block:* She cannot categorize the activity as distinct from her job description.
      *   *Internalist Counter:* She desires rest. She believes this causes tiredness. She should stop.
      *   *Reply:* She believes the tiredness is *constitutive* of doing the job well, not a cost to be weighed. The concept needed is "exploitable affect."
      *   *This is tricky.* If she believes "Tiredness = Good Job," then correcting the belief changes the reason. But Spec 3 says no false belief correction.
      *   *Solution:* The facts are: She is tired. She is doing the task. The *normative significance* of the tiredness is what she misses. She lacks the concept that says "This kind of tiredness counts against the action."
      *   *Let's refine:* The "Good Sport."
      *   **Scenario:** James plays on a amateur sports team. He always plays through pain. He thinks he is "showing grit." He lacks the concept of "long-term durability vs. short-term toughness." He knows he is in pain. He knows it might linger. He categorizes lingering pain as "proof of effort."
      *   *Reason:* He has a reason to sit out.
      *   *Block:* He lacks the concept of "injurious pain" vs "effort pain."
      *   *Internalist:* He wants to play next year. He knows this pain lingers.
      *   *James:* "I know it lingers. That's the badge of honor."
      *   *This looks like a value clash, not a conceptual gap.*

      *   *Okay, let's look at the "Hermeneutical" angle again.*
      *   We need a concept that makes a fact *visible* as a reason.
      *   Example: "Gaslighting." Before the concept, you just feel confused. After, you see a reason to leave.
      *   I need a non-political version.
      *   **Concept:** "Micro-commitment."
      *   **Scenario:** Elena agrees to small tasks ("Can you grab this?" "Can you send that?"). She thinks she is "being flexible." She lacks the concept of "death by a thousand cuts" regarding time. She knows she has no free time. She knows she says yes to small things. She doesn't see the *aggregation* as a distinct category of loss.
      *   *Internalist:* She values free time. She sees she has none. She sees she says yes. Deliberation: Stop saying yes.
      *   *Elena:* "But each individual yes is trivial. I can't say no to a trivial request."
      *   *The Missing Concept:* "Aggregate burden." She lacks the conceptual tool to sum the trivialities into a reason-giving whole.
      *   *This is promising.* It's not a false belief (she knows the facts). It's not a lack of desire (she wants free time). It's a failure of *aggregation logic* due to missing conceptual categorization.
      *   *Wait, is aggregation logic just "sound deliberation"?* Williams includes sound deliberation. If she is a good reasoner (Spec 4), she should be able to sum 1+1+1.
      *   *Unless the concept is required to see the 1s as comparable.*
      *   *Let's try: "Professional Distance."*
      *   **Scenario:** Mark is a therapist (or social worker, or teacher). He takes work home emotionally. He thinks he is "being compassionate." He lacks the concept of "vicarious trauma." He knows he is sad. He knows it's from work. He thinks "Sadness = Caring."
      *   *Reason:* He has a reason to establish boundaries.
      *   *Block:* He cannot parse "Sadness from work" as a reason to stop, because his conceptual scheme maps it to "Success."
      *   *Internalist:* He wants to be healthy.
      *   *Mark:* "Health isn't the goal here. Care is."
      *   *This is a value conflict.*

      *   *Okay, let's go back to the "Conceptual Blindspot" regarding reasons themselves.*
      *   Williams says reasons must tie to the SMS.
      *   I need a case where the SMS *would* support the reason *if* the agent had the concept, but the concept is missing, and the agent cannot deliberate their way to the concept.
      *   **Case:** The "Obligation Hoarder."
      *   **Agent:** Priya.
      *   **Situation:** Priya hosts a monthly family dinner. She hates it. She does it because "Family gathers."
      *   **Fact:** Her family members would prefer not to come. They come out of obligation to her.
      *   **Priya's View:** She thinks she is "maintaining cohesion."
      *   **Missing Concept:** "Coercive Hospitality." (The idea that hosting can force others into attendance).
      *   **Reason:** She has a reason to stop hosting.
      *   **Why Internalism struggles:** Her SMS includes "Love family," "Want family happy." She believes "Hosting -> Family Happy." If she knew "Hosting -> Family Obligated/Unhappy," she'd stop.
      *   **Spec 3 Violation?** If she knows the family is unhappy, she stops. So she must *not* know they are unhappy. But Spec 3 says "She can be handed the complete list of true propositions... and accept every single one."
      *   **So:** She knows they are unhappy. She knows they come out of obligation.
      *   **Her Interpretation:** "Their obligation is a sign of love."
      *   **Missing Concept:** "Autonomy-respecting love" vs "Obligation-based love." She lacks the distinction. She thinks all family duty is cohesive.
      *   **Reason:** She has a reason to stop, in virtue of her love for them (which she shares).
      *   **Block:** She cannot process "Their unhappiness + Their Obligation" as a reason to stop because she lacks the concept of "Autonomy-respecting love." She thinks love *just is* duty.
      *   **Spec 5 Check:** If she acquired the concept, she'd see she was harming them. Does she have a standing desire to not harm them? Yes. Internalist says: "She desires not to harm. She knows they are unhappy. She should stop."
      *   **Priya:** "I am not harming them. I am loving them."
      *   **The Gap:** The concept determines whether the fact counts as "harm."
      *   **This is the one.** It's about the *classification* of the fact, not the fact itself.

      *   *Refining for Spec 5 (No standing desire for self-understanding):*
      *   She doesn't desire "new concepts." She is satisfied with her conceptual scheme.
      *   She desires "Family Good." She believes she is achieving it.
      *   The Externalist says: "Family Good" actually requires "Autonomy." She lacks the concept of "Autonomy" in this context.
      *   The Internalist says: "She desires Family Good. She believes Hosting achieves it. That belief is false. Correct the belief."
      *   **Spec 3 says:** "Gap must not be closable by correcting a false belief."
      *   **Challenge:** Is "Hosting achieves Family Good" a false belief? Or is it a conceptual truth relative to her scheme?
      *   **Move:** Make it so she knows the empirical facts (they are grumpy, they say they'd rather not), but she lacks the concept that makes those facts *count* against hosting.
      *   **Concept:** "Social Debt."
      *   **Scenario:** Priya pays for everyone's dinner. She thinks she is "generous." They feel indebted. She knows they feel indebted. She thinks "Indebtedness = Bond." She lacks the concept "Indebtedness = Burden."
      *   **Reason:** She has a reason to stop paying.
      *   **Block:** She interprets the feeling of indebtedness positively.
      *   **Internalist:** She wants them to be happy. They are not happy (they feel burdened).
      *   **Priya:** "They feel burdened, but that burden is the glue."
      *   **This is a value clash.** Internalist says "Your SMS says you want them happy. They aren't." Priya says "My SMS defines happiness as including this burden."
      *   **Harder:** I need the concept to be a *tool* for deliberation, not a value definition.
      *   **Let's try: "The Efficient Commuter."**
      *   **Agent:** Tom.
      *   **Situation:** Tom drives to work. He listens to educational podcasts. He thinks he is "optimizing time."
      *   **Fact:** He arrives stressed. He knows he arrives stressed.
      *   **Missing Concept:** "Transition Ritual." (The idea that decompression time is productive).
      *   **Reason:** He has a reason to drive in silence.
      *   **Block:** He categorizes silence as "waste." He lacks the concept where silence = "maintenance."
      *   **Internalist:** He wants to be effective. He knows he is stressed (less effective).
      *   **Tom:** "Stress is the cost of learning. I accept it."
      *   **Externalist:** The stress undermines the learning long-term. He lacks the concept of "cognitive load capacity."
      *   **This feels like a factual mistake about psychology.**

      *   *Okay, let's go with the "Polite Host" again but tighten Spec 3.*
      *   **Agent:** Arthur.
      *   **Situation:** Arthur hosts dinner parties. He insists on serving specific dishes. Guests have dietary restrictions. He accommodates them technically (no peanuts) but makes a fuss about it ("Oh, it's so hard to cook without butter!").
      *   **Fact:** Guests feel guilty. Arthur knows they feel guilty.
      *   **Arthur's View:** He thinks he is "showing effort."
      *   **Missing Concept:** "Performative Accommodation." (Accommodation that highlights the burden rather than relieving it).
      *   **Reason:** He has a reason to stop commenting on the difficulty.
      *   **Block:** He thinks "Highlighting difficulty" = "Showing care."
      *   **Internalist:** He wants guests to feel welcome. They don't.
      *   **Arthur:** "They feel welcome. The guilt is part of the shared experience."
      *   **This is still value clash.**

      *   *Okay, I need to lean into the "Conceptual Blindspot" regarding the **Agent's Own Interest**.*
      *   Williams allows reasons based on the agent's interests.
      *   **Case:** The "Diligent Caregiver."
      *   **Agent:** Susan.
      *   **Situation:** Susan cares for aging parent. She never takes a break.
      *   **Fact:** She is exhausted. She knows it.
      *   **Fact:** Her care quality is dropping. She knows it.
      *   **Susan's View:** "Taking a break = Abandonment."
      *   **Missing Concept:** "Sustainable Care." (The idea that rest is a *component* of care, not a pause from it).
      *   **Reason:** She has a reason to take a break.
      *   **Block:** She categorizes "Break" as "Not-Caring." She lacks the concept where "Break" is a subset of "Caring."
      *   **Internalist:** She wants to care well. She knows quality is dropping. She should rest.
      *   **Susan:** "Resting stops the care. I choose quality over quantity." (She accepts the drop in quality as inevitable cost of *continuous* care).
      *   **Externalist:** She is wrong about the nature of care. Rest *improves* care.
      *   **Susan:** "I know it improves metrics. But it violates the duty of presence."
      *   **This is a normative conflict.**

      *   *Okay, let's try to satisfy Spec 5 strictly.* "If she ever did acquire the concept she'd look back on the gap as a loss rather than a relief."
      *   This implies the concept reveals a *benefit* she was missing.
      *   **Case:** The "Loyal Reader."
      *   **Agent:** Ben.
      *   **Situation:** Ben reads every book by his favorite author, even the bad ones.
      *   **Fact:** He dislikes the bad books. He knows it.
      *   **Ben's View:** "Completeness = Appreciation."
      *   **Missing Concept:** "Curatorial Engagement." (The idea that skipping bad work honors the author more).
      *   **Reason:** He has a reason to skip the bad books.
      *   **Block:** He lacks the concept that "Selective reading" is a valid mode of "Appreciation."
      *   **Internalist:** He wants to enjoy reading. He doesn't enjoy these.
      *   **Ben:** "I enjoy the *project* of completeness. The boredom is part of the devotion."
      *   **Externalist:** The project is misguided.
      *   **Internalist:** But he desires the project.
      *   **Externalist:** He has a reason to drop the project.
      *   **Why?** Because the project is based on a conceptual error about "Appreciation."
      *   **Is this blameable?** No, he learned this from fan communities.
      *   **Is it doxastic?** He knows the books are bad.
      *   **Is it motivational?** He wants to appreciate.
      *   **Spec 5:** If he learns "Curatorial Engagement," he sees he wasted time. Does he have a standing desire to not waste time? Yes. Internalist: "Then deliberation from 'don't waste time' leads to stopping."
      *   **Ben:** "It's not waste. It's devotion."
      *   **The Concept:** "Devotion" vs "Waste." The concept reclassifies the activity.
      *   **This works.** The concept changes the *description of the action* under which it is evaluated.
      *   **Williams's Escape:** "Sound Deliberation." Would sound deliberation reveal the concept?
      *   **My Claim:** No. Concepts aren't derived from deliberation; they are the tools *of* deliberation. You can't deliberate your way to "Curatorial Engagement" if your only concept is "Completeness."
      *   **Control Case:** Ben has the concept but forgets to apply it. (This breaks Spec 4).
      *   **Control Case:** Ben has the concept and uses it.

      *   *Wait, I need to make sure Spec 3 holds:* "She can be handed the complete list of true propositions... and accept every single one."
      *   Ben accepts: "I dislike this book." "I am spending time." "There is a concept called Curatorial Engagement." (If told).
      *   But *before* being told, he lacks the concept.
      *   The Internalist says: "Reasons must be reachable by sound deliberation from SMS."
      *   If the concept is missing, can he deliberate to it?
      *   If the concept is *necessary* to see the reason, and deliberation cannot generate new concepts (only process existing inputs), then Internalism fails.
      *   **Williams might say:** "Sound deliberation includes acquiring true beliefs." Does it include acquiring concepts? Williams is vague here. Fricker says no, that's hermeneutical injustice.
      *   **I need to make sure the concept isn't just a 'fact'.**
      *   Concept: "Opportunity Cost." (Too economic).
      *   Concept: "Emotional Bandwidth."
      *   **Let's go with the "Emotional Bandwidth" case.**
      *   **Agent:** David.
      *   **Situation:** David listens to his friends' problems all night.
      *   **Fact:** He is drained. He knows it.
      *   **Fact:** He is less patient with his partner. He knows it.
      *   **David's View:** "Listening = Support."
      *   **Missing Concept:** "Compassion Fatigue." (The idea that listening depletes the *capacity* to support).
      *   **Reason:** He has a reason to stop listening tonight.
      *   **Block:** He thinks "Stopping = Withdrawing Support." He lacks the concept where "Stopping = Preserving Support Capacity."
      *   **Internalist:** He wants to support his partner. He knows he is impatient.
      *   **David:** "I know I'm impatient. But my friends need me *now*." (Priority conflict).
      *   **Externalist:** He has a reason to prioritize the partner because the friends' need is less urgent than his capacity collapse.
      *   **David:** "I don't see capacity collapse as a reason."
      *   **Why?** Because he lacks the concept that links "Capacity" to "Support."
      *   **This is strong.**

      *   *Refining the Control Case:*
      *   Control: David has the concept of "Compassion Fatigue."
      *   Difference: Possession of the concept.

