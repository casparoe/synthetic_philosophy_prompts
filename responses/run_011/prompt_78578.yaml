  ### Brainstorming and Rejections

  **Candidate 1: The Overworked Nurse.**
  *Scenario:* A nurse works double shifts believing she is "saving lives." She lacks the concept of "systemic exploitation."
  *Rejection:* This leans too heavily into Fricker's actual examples of political marginalization. The prompt asks for a "small and domestic or workplace-scale" case where the philosophy does the carrying, not the political context. It risks becoming a case about power dynamics rather than practical reason.

  **Candidate 2: The Hobbyist Woodworker.**
  *Scenario:* A woodworker sands a chair endlessly, believing "smoother is better." He lacks the concept of "diminishing returns."
  *Rejection:* This fails Spec 4. A good reasoner engaging in means-end deliberation would eventually notice the time spent outweighs the smoothness gained. The block here is factual (about efficacy), not conceptual. Williams's internalism handles instrumental errors easily.

  **Candidate 3: The "Polite" Host.**
  *Scenario:* A host keeps refilling a guest's glass. The guest is uncomfortable. The host lacks the concept of "coercive hospitality."
  *Rejection:* This risks violating Spec 3. If the host knows the guest is uncomfortable (a fact), the internalist argues the host has a reason to stop based on the desire to be a good host. The gap looks like a false belief about what constitutes "good hosting," which deliberation could correct. I need a case where the facts are accepted, but the *normative significance* is invisible without the concept.

  ***

  ### The Scenarios

  **Scenario:**
  Elias manages a small team and prides himself on being available. When a junior staff member emails at 8 PM with a non-urgent problem, Elias always replies immediately. He knows this makes him irritable at breakfast with his spouse, and he knows his spouse finds this irritability hurtful. He accepts these facts without dispute. However, Elias lacks the concept of "boundary maintenance" as a form of care; he categorizes all availability as "dedication" and all unavailability as "neglect." When he feels drained, he interprets it as a moral weakness to be overcome by willpower, not as a signal to stop. He reasons perfectly within this framework: since he values dedication and family harmony, and since he believes stopping would be neglect, he concludes he must try harder to suppress his irritability rather than stop answering emails.

  **Control Case:**
  Elias manages a small team and prides himself on being available. When a junior staff member emails at 8 PM with a non-urgent problem, Elias always replies immediately. He knows this makes him irritable at breakfast with his spouse, and he knows his spouse finds this irritability hurtful. He accepts these facts without dispute. **Unlike the first scenario, Elias possesses the concept of "boundary maintenance" as a form of care.** He understands that preserving his capacity for patience is a prerequisite for being a good partner. When he feels drained, he interprets it as a signal to restore limits. He reasons that since he values family harmony, and since answering emails undermines that harmony by depleting his patience, he has a reason to stop answering emails after 6 PM.

  **The Named Respect:**
  The difference is the possession of the concept "boundary maintenance as care." In the first case, the option to stop is conceptually invisible, categorized only as "neglect." In the control, it is visible as a strategy for "care."

  ***

  ### The Reason Claim

  **Claim:** Elias has a reason to stop answering non-urgent emails after 6 PM.
  **What φ is:** To decline the request (stop answering).
  **Reason in virtue of:** The fact that answering depletes the emotional resources required for his marriage, which he values.

  ***

  ### Testing Williams's Escape Routes

  **1. False-Belief Correction:**
  *Is it open?* No.
  *Why:* Spec 3 stipulates Elias accepts all relevant true propositions. He knows he is irritable. He knows his spouse is hurt. He knows the emails are non-urgent. The internalist cannot say "He just doesn't realize stopping would help." He *does* realize stopping would help his marriage, but he believes stopping counts as "neglect," which violates his value of dedication. The block isn't a belief about the world; it's the lack of a category that makes "stopping" compatible with "dedication."

  **2. The Imagination Route:**
  *Is it open?* No.
  *Why:* Williams suggests an agent might reach a reason if they imagined themselves in a different state. But Elias cannot imagine "setting a boundary" as a positive act because he lacks the concept. He can imagine *not answering*, but he can only imagine it under the description "being neglectful." You cannot imagine the value of a concept you do not possess. He isn't failing to imagine the *outcome* (a happy spouse); he is failing to imagine the *action* as reason-giving.

  **3. Sound Deliberation:**
  *Is it open?* No.
  *Why:* Elias is a good reasoner (Spec 4). His deliberation is: *Goal: Be dedicated + Be good husband. Fact: Answering emails = Dedicated. Fact: Answering emails = Irritable husband. Conclusion: I must suppress irritability to maintain both.* This is logically valid within his conceptual scheme. Sound deliberation processes inputs; it does not generate new conceptual categories. Without the concept "boundary maintenance," the premise "Stopping = Care" is unavailable to the syllogism. Deliberation fails to yield the reason because the vocabulary required to state the reason is missing.

  ***

  ### The Verdicts

  **The Internalist Verdict:**
  Elias does *not* have a reason to stop. Williams defines reasons relative to the agent's subjective motivational set (SMS) and sound deliberative route. Elias's SMS contains desires for dedication and family harmony. Given his conceptual scheme, the only deliberative route available to him leads to "try harder," not "stop." To say he has a reason he cannot possibly reach is to abandon the internalist constraint that reasons must be capable of motivating the agent. If the concept is unreachable from his current state, the reason is external, and Williams rejects external reasons as nonsense. The internalist insists that if Elias cannot deliberate to the conclusion, there is no reason *for him*.

  **The Externalist Verdict:**
  Elias *does* have a reason to stop. The facts of his situation (depletion, harm to spouse) objectively support the action, regardless of his conceptual blindspot. The lack of a concept is a hermeneutical limitation, not a normative one. Just as a person lacking the concept of "germs" has a reason to wash hands even if they believe in "miasma," Elias has a reason to set boundaries even if he believes in "willpower." The reason exists in virtue of his interests (a good marriage), which are being undermined by his actions. The fact that he cannot see it due to a conceptual gap does not negate the reason; it only explains his failure to act on it.

  ***

  ### Deletion Tests

  **1. Break Spec 3 (Make ignorance culpable):**
  *Change:* Elias was told explicitly by a mentor years ago that "boundaries are care," but he forgot or ignored it.
  *Result:* This rescues Internalism. If the concept was available to him and he discarded it, the internalist argues he is responsible for that loss. The deliberative route *was* open, and he closed it. The reason becomes internal because the block is now doxastic/volitional, not conceptual. The problem relocates from "inaccessible reason" to "irrational agent."

  **2. Break Spec 5 (Give standing desire for self-understanding):**
  *Change:* Elias has a strong standing desire to "always improve his understanding of relationships."
  *Result:* This rescues Internalism. The internalist argues that from the desire "improve understanding," sound deliberation would lead him to seek new concepts, which would lead to "boundary maintenance," which leads to the reason. The conditional becomes reachable. The problem relocates from "conceptual gap" to "missing desire." This shows Spec 5 is the critical pressure point; without it, the internalist can always posit a higher-order desire that bridges the gap.

  ***

  ### What the Pair Isolates

  The main/control pair isolates the **normative visibility of an action**: it tests whether a reason exists when the action is factually possible but conceptually invisible as a candidate for rational choice.

  ***

  ### Best Internalist Attack

  **The Charge:** You have described a conceptual gap and then relabeled it a reason-gap. Whether Elias has a reason he couldn't possibly reach is the very thing in dispute, so the case begs the question against internalism rather than testing it.
  **Engagement:** This is the strongest objection. The internalist claims that "having a reason" just *means* "being able to reach it via deliberation." By stipulating that Elias has a reason he cannot reach, I am simply asserting the externalist definition. To defend the case, I must argue that "reasons" track *interests*, not just *deliberative accessibility*. If Elias's interest in a good marriage is objectively undermined by his actions, the reason exists even if his conceptual scheme masks it. The internalist conflates "having a reason" with "being able to recognize a reason." My case forces them to admit that an agent can be rationally required to do something they cannot rationally conceive—a pill internalism refuses to swallow.

  ***

  ### Honesty and Design Flaws

  **Where I Cheated:**
  I likely cheated on **Spec 5**. I stipulated that Elias has no standing desire for self-understanding, but in reality, most agents have *some* desire to resolve cognitive dissonance (e.g., "Why is my wife upset?"). An internalist would argue that genuine deliberation on his wife's unhappiness would force a conceptual shift eventually. I blocked this by fiat to make the case work.

  **What Would Move Me:**
  If I were convinced that "sound deliberation" inherently includes the *creation* of new concepts when existing ones fail to resolve conflicts, I would switch to Internalism. If Williams's "sound deliberation" is robust enough to include conceptual innovation driven by motivational conflict, then the gap is closable internally.

  **Spec 4 & 5 Tension:**
  There is a genuine tension between Spec 4 (good reasoner) and Spec 5 (unreachable concept). If he is a *perfect* reasoner, would he not eventually infer the need for a new concept to resolve the conflict between "dedication" and "harmony"? I prioritized Spec 5 because without it, Internalism wins by default via higher-order desires. I dropped the requirement that the concept be *in principle* unreachable, settling for "unreachable from current motivational elements." This is the weakest link; if the internalist argues that the conflict itself generates the motive to find new concepts, my case collapses. I would drop Spec 4 before Spec 5, because a less perfect reasoner makes the conceptual block more plausible, whereas Spec 5 is essential to block the internalist's "higher-order desire" escape route.
