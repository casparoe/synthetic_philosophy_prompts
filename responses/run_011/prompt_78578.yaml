      *   The concept changes the *solution space*.
      *   This is the key. The concept isn't just a label; it dictates the *type* of reason (moral effort vs. structural limit).
      *   Internalist: "But he desires to not fail morally."
      *   Externalist: "He is failing structurally. The reason is to stop, not try harder."
