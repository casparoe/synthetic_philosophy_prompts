          *   *(3) Selection:* This is the strongest critique. EUT measures accuracy of *expressed* beliefs. If the expression is filtered, the accuracy measure is biased. It's not a test of global veritism; it's a test of *selective* veritism. It favors "knowing your limits" (pragmatic) over "having opinions on everything" (veritistic).
      *   **Evaluating the Hunch:**
