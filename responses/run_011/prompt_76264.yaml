          *   Log Score: Crowd advantage holds (statistical), but extremization logic changes (Log penalizes 0/1 harder). The geometric link is specific to Brier, but the statistical link (variance reduction) is robust across rules.
          *   Theory isn't hostage, but the *extremization* finding is rule-dependent.
      *   **Final Verdict (Explain/Misdescribe/Silent):**
          *   *Explains:* Why proper scoring matters (incentivizes participation/truth-telling relative to random guessing). Why coherence matters (avoiding sure loss).
          *   *Misdescribes:* Treats volunteers as ideal Bayesian agents. Ignores cognitive cost of calculation.
          *   *Silent:* Social dynamics of aggregation. The value of *silence* (triage). The pragmatic value of forecasting for decision-making vs. truth-tracking.
          *   *Alternative:* A Pragmatic/Decision-Theoretic account might fit better. Credences as tools for action, not just mirrors of nature. Triage makes sense pragmatically (allocate cognitive resources).

  4.  **Refining and Polishing:**

      *   *Check Tone:* Ensure it sounds like a colleague discussing a problem, not a textbook. Use terms like "veritism," "immodesty," "strictly proper," "convexity."
