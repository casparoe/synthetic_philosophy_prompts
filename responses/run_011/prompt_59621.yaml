answer: |-
  **Project Title:** The Architecture of Leisure: Keynes on Conditions, Content, and the Moorean Legacy

  **Statement of the Question**
  John Maynard Keynes's 1930 essay, "Economic Possibilities for Our Grandchildren," is typically read as a failed forecast regarding the labor-leisure tradeoff. Standard interpretations divide into two camps: those arguing Keynes underestimated the stickiness of relative and positional wants, and those arguing abundance arrived but was misallocated by political failure. Both readings assume Keynes made a substantive claim about the *content* of the good life—specifically, that human beings would naturally know how to occupy a fifteen-hour work week.

  This project challenges that assumption. It posits that the 1930 essay makes a claim not about the content of leisure, but about the *material conditions* required for any conception of the good life to emerge. The central research question is whether Keynes's 1938 memoir, "My Early Beliefs," supplies the missing ethical architecture for the 1930 economic forecast, or whether it exposes the forecast as an incoherent aspiration. In "My Early Beliefs," Keynes retrospectively critiques the Moorean ethic of his youth, admitting that focusing solely on "states of mind" (love, beauty) while ignoring duty, rules, and the state of the world was a fatal error.

  Does this 1938 self-criticism repair the 1930 argument by providing a determinate purpose for leisure (the cultivation of specific world-states rather than mere enjoyment), or does it confirm that the fifteen-hour week was never a viable goal because the ethical framework to sustain it was absent? A third possibility, which this project must hold open, is that treating these texts as continuous is a category error: the 1930 text may be a technical claim about scarcity, while the 1938 text is a moral claim about value, and conflating them generates the standard objections.

  **Intervention and Gap**
  Existing scholarship treats the "Keynesian Problem" of leisure as a problem of psychology or political economy. By reframing it as a problem of moral philosophy, this project bridges the gap between economic history and ethical theory. Current interpretations fail because they project a contemporary understanding of "leisure" (consumption time) onto Keynes, ignoring his specific philosophical lineage. They also treat Keynes's philosophical positions as static. By juxtaposing the optimism of 1930 with the penitence of 1938, this project reveals a tension in Keynes's thought that has been overlooked: the transition from a private ethic of appreciation to a public ethic of responsibility. If the 1930 essay relies on a Moorean assumption that "good states of mind" will automatically fill the vacuum of work, the 1938 admission that such states require structural support fundamentally alters how we read the economic prediction. This project does not seek to vindicate or condemn Keynes's forecast, but to diagnose the philosophical premises that made the forecast intelligible to him.

  **Work Plan (12 Months)**
  *   **Months 1–3: Textual Reconstruction and Context.** Close reading of the 1930 and 1938 texts alongside related correspondence and drafts from the King's College archive (digital). The goal is to map the specific terminology of "wants," "needs," and "states of mind" across the decade. I will also review the reception of G.E. Moore's *Principia Ethica* within the Bloomsbury circle during this period to contextualize the "Moorean" critique without getting bogged down in exegesis of Moore himself.
  *   **Months 4–6: Drafting the Core Argument.** Writing the central chapters that juxtapose the two texts. The focus will be on articulating the distinction between "conditions for the good life" and "content of the good life." I will draft the argument for the "repair" hypothesis (1938 fixes 1930) and the "incoherence" hypothesis (1938 undermines 1930) with equal rigor.
  *   **Months 7–9: Testing the Third Possibility.** This phase is dedicated to the discontinuity hypothesis. I will test whether the 1930 essay holds water as a purely economic claim independent of the ethical critique. This involves engaging with modern economic interpretations of the essay to see if the philosophical reading adds explanatory power or merely complicates the text.
  *   **Months 10–12: Revision and Dissemination.** Refining the manuscript for journal submission or dissertation chapter integration. I will present preliminary findings at two departmental workshops to stress-test the "failure" criteria. The final month will be dedicated to ensuring the prose is accessible to both historians of economics and moral philosophers.

  **Criteria for Success**
  A successful result will not necessarily prove one of the three hypotheses correct. Rather, success is defined by a shift in the terms of the debate. If the final output demonstrates that the "failure" of the fifteen-hour week cannot be fully understood without reference to Keynes's evolving moral philosophy, the project succeeds. Specifically, a successful outcome will produce a manuscript that:
  1.  Clearly distinguishes between Keynes's economic premises and his ethical premises.
  2.  Demonstrates how the 1938 critique of "states of mind" recontextualizes the 1930 view of "needs."
  3.  Avoids reducing the argument to a simple biographical narrative, keeping the focus on the logical relationship between the texts.

  **Risks and Statement of Potential Failure**
  This project carries three specific risks that could constitute failure.
  First, the **Biographical Trap**. There is a risk that the analysis degenerates into intellectual biography, focusing on the Bloomsbury Group's interpersonal dynamics rather than the philosophical argument. If the project becomes about Keynes's relationship with Moore or Strachey rather than the logic of the texts, it fails to meet the standards of philosophical economics.
  Second, the **Moorean Quarrel**. There is a danger of getting stuck in exegesis of G.E. Moore. The project is about Keynes's *use* and *rejection* of Moore, not Moore's ethics themselves. If the word count shifts disproportionately to explaining *Principia Ethica* rather than Keynes's appropriation of it, the focus is lost.
  Third, the **Discontinuity Dead End**. The third possibility—that the texts answer different questions—is a valid hypothesis, but if the conclusion is simply "Keynes was inconsistent," the result is trivial. Failure would look like concluding that the texts are unrelated without explaining *why* that inconsistency matters for our current understanding of leisure and abundance. To avoid this, I must demonstrate that the tension between the texts is itself a productive site for understanding the limits of economic forecasting.

  Finally, there is the risk that the "conditions vs. content" distinction collapses under scrutiny. If it turns out Keynes *did* intend to prescribe the content of leisure in 1930, the central thesis requires substantial revision. I am prepared to pivot to an analysis of why that prescription was obscured, but this would change the nature of the contribution from a philosophical reconstruction to a history of misreading.
