answer: |-
  Here is the adjudication on the seven moves, followed by the overall verdict and practical advice for the text.

  ### Ratings on Moves 1–7

  **(1) Callum: +1**
  He is mathematically correct that the standard expectation sums to $\ln(2)$. In orthodox probability theory, the index $n$ is fixed by the sample space, so the sum is well-defined. However, he treats this calculation as normative for action, which is where the trouble begins.

  **(2) Roz: +1**
  She correctly identifies the series as conditionally convergent. While the Riemann rearrangement theorem applies to abstract series, her point stands that conditional convergence signals instability; the value depends on the summation method, which makes it a fragile foundation for a life-changing decision.

  **(3) Callum: +2**
  This is his strongest move. In a probability context, the ordering is not arbitrary; it is dictated by the physical sequence of coin tosses. You cannot reshuffle the sample space events without redefining the random variable itself, so the 'natural' sum is the only valid one.

  **(4) Roz: +2**
  She lands a heavy blow here. If one accepts that conditional convergence makes expectation undefined or unstable, then standard dominance principles fail. A bet that pays more in every possible outcome cannot be ranked higher if the expectations of both bets are undefined, which exposes a genuine crack in decision theory.

  **(5) Callum: +2**
  His appeal to truncation and weak expectation is robust. If you cap the payoffs and let the cap rise, the limit is indeed $\ln(2)$. This shows the value is stable under natural perturbations, rescuing the number from the charge of being entirely arbitrary.

  **(6) Roz: +1**
  Her claim about truncation sensitivity is weak for this specific series, but her point on bounded utility is decisive. Real agents do not value infinite money linearly; with any realistic utility function, the series converges absolutely, dissolving the paradox. She is practically right, even if her mathematical critique of truncation is slightly off.

  **(7) Callum: +1**
  He is correct that invoking bounded utility sidesteps the theoretical puzzle rather than solving it. The paradox is interesting precisely because it reveals how the standard framework behaves with unbounded values. It is a feature of the model, not a bug in the character.

  ### Overall Verdict

  **Callum is right on the mathematics; Roz is right on the prudence.**

  Callum wins on the technical definition: for a discrete random variable with a fixed index, the expectation is $\ln(2)$. The order is not free, so the rearrangement objection does not invalidate the calculation. However, Roz wins on the decision-theoretic implication: a conditionally convergent expectation is too fragile to guide action. It violates dominance and relies on idealised assumptions (infinite credit, linear utility) that do not hold in the real world.

  **Where they talk past each other:**
  They are disagreeing on the purpose of the number. Callum treats expected value as a *description* of the gamble (what is the sum?), while Roz treats it as a *prescription* for action (what should I do?). Callum proves the sum exists; Roz proves the sum does not compel assent. Neither acknowledges that a number can be mathematically valid yet decisionally useless.

  **What both left out:**
  Neither mentions **counterparty risk**. The uncle is dying. The payoffs grow as $2^n$. By flip $n=10$, the pot is over £100; by $n=50$, it exceeds the global money supply. The uncle cannot honour the bet if the coin lands tails forty times. The gamble is not undefined because of maths; it is void because the uncle is insolvent. This is the real tension the narrator should feel.

  ### Practical Advice for the Scene

  **Can you print the scene as it stands?**
  Yes, largely. A numerate reader will not call it a howler. The mathematics described is accurate, and the debate reflects a genuine, high-level disagreement in decision theory (reminiscent of the Pasadena Game paradox). It is sophisticated enough that most readers will accept the conflict without checking the sums.

  **The smallest change to fix it:**
  You do not need to change the maths, but you should ground the stakes. As written, the bet is abstractly infinite. To make it bulletproof, have the narrator realise that while Callum is right about the *value*, Roz is right about the *risk*—specifically, the uncle's ability to pay.

  **Suggested Edit:**
  In the narrator's closing reflection, add a line acknowledging that the uncle's estate cannot cover the tails. For example:
  > "Callum had the sum right, and Roz had the sense. But neither mentioned the estate. If the coin spun tails fifty times, the debt would outstrip the house, the investments, and the history of the pound. The expected value was positive, but the counterparty was bankrupt."

  This validates Callum's maths, vindicates Roz's refusal, and adds a layer of tragic realism suitable for a dying uncle. It resolves the debate without forcing you to take a side on the philosophy.
