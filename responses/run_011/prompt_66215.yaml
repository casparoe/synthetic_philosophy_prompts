answer: |-
  1. **The address**

  President [Name], trustees, faculty, families, and the Class of 2024. And to the Mayor and Council members seated here: thank you for coming. It is rare that the town's governing body sits under the same roof as the college it governs. Usually, we pretend these spheres don't touch. But this year, they have collided.

  We are gathered in a chapel dedicated to the truth of God. Yet, outside these walls, our town is fractured over a homeless shelter. Some say this shelter is a divine command to welcome the stranger. Others say it is a violation of neighborhood safety and order. The debate has turned toxic. Friends don't speak. Council meetings end in shouting. You, the graduates, are leaving this place to enter that fray. So, I will not tell you that you are all on a beautiful journey together. You are not. You are entering a conflict. And you need tools to fight it without destroying the people you disagree with.

  I stand here as a believer in the necessity of faith, and also as a student of how we live together when we believe different things. In this room, it is appropriate to say: "God commands us to care for the poor." Scripture is clear on this. If you are a Christian, that command is absolute. It is the spine of your morality. But when you walk out of this chapel and into the town council chamber, you are no longer speaking only to the choir. You are speaking to neighbors who do not share your scripture, who do not recognize your authority, yet who must live with the consequences of your votes.

  Here is the hard truth: If you want to bind your neighbor to a law—or a shelter site—you owe them a reason they can hold, even if they do not share your faith.

  [Proviso cashed here: Transitioning from theological command to civic justification]
  *To say "God wills this shelter" is true for you, but it is coercive to them. To love them requires translation. You must say: "This shelter reduces street disorder, improves public health, and stabilizes property values by managing homelessness systematically."*

  This is not hiding your faith. It is honoring your neighbor enough to speak their language. It is the difference from preaching and governing. Preaching calls for conversion; governing calls for cooperation. If you cannot explain why a policy is good without invoking your private revelation, you are not inviting your neighbor to cooperate; you are demanding they submit.

  Now, to those opposing the shelter: I hear your fears. You worry about safety. You worry about the character of your streets. These are not trivial things. A community needs order to flourish. But if your only argument is "not here," you are treating your homeless neighbors as problems to be moved, not people to be served. You are claiming a right to safety that denies them a right to existence.

  [Proviso cashed here: Transitioning from NIMBY concern to public good]
  *To say "Protect my property" is natural, but insufficient. To justify coercion, you must say: "We need a plan that ensures safety for the residents while guaranteeing dignity and care for the homeless, because a town that abandons its vulnerable loses its moral claim on all of us."*

  Do you see the work being done here? We are not abandoning our convictions. The pro-shelter side keeps their compassion; the anti-shelter side keeps their concern for order. But we are stripping away the private justifications that exclude half the room. We are looking for the ground where we can both stand.

  This is the discipline of public life. It is tempting to think that bringing your faith into politics means quoting scripture until the other side surrenders. It does not. It means loving your neighbor enough to find a reason they can accept without converting. It means recognizing that in a pluralistic town, no one gets to win entirely on their own terms.

  Some will call this compromise. I call it integrity. It is integrity to admit that your truth, however holy, is not the only truth in the room. It is integrity to acknowledge that the mayor sits across from you not as an enemy, but as a steward of a shared space.

  So, here is my charge to you regarding this fight, and every fight you will join: Do not leave your faith at the door. Bring it. Let it fuel your passion. Let it drive your compassion. But when it comes time to vote, to zone, to legislate, you must build a bridge.

  [Proviso cashed here: Final synthesis of motive and justification]
  *Your faith provides the "why" you care; public justification provides the "how" we agree. If you cannot separate the two, you will remain stuck in this chapel, shouting at a town that cannot hear you.*

  The shelter fight will be resolved. Maybe not today. But it will be resolved either by force or by reason. If you choose force—whether the force of moral superiority or the force of zoning loopholes—you win the battle and lose the town. If you choose reason, you might not get everything you want. You will have to listen. You will have to translate. You will have to accept that your opponent has a claim on you.

  Graduates, the world does not need more people who are right. It has enough of those. It needs people who can be right together. It needs people who understand that loving your neighbor sometimes means swallowing your pride and finding a secular reason for a holy obligation.

  Go out and fight for justice. But fight it in a language your enemy can speak. That is how you build a city that lasts. That is how you honor God without tyrannizing your neighbor. That is the work.

  Thank you.

  2. **Why it's built this way**

  The structure is designed to enact the philosophical tension rather than explain it. I avoided abstract theory ("public reason") and instead framed the constraint as an act of *love* and *translation*. This prevents the hypocrisy of lecturing believers on restraint from a secular standpoint; instead, the restraint is framed as a theological duty to the neighbor.

  The shelter fight is the concrete test case. I took a definite stand—that the shelter is a moral necessity but requires public justification—without endorsing the *methods* of either side. The proponents are critiqued for relying on sectarian language; the opponents are critiqued for relying on exclusionary fears. This ensures neither feels fully endorsed, as both are demanded to elevate their argumentation.

  The three bracketed moments explicitly model the "proviso." They show the speaker starting with a faith-based or private motive and immediately translating it into a civic, shareable reason. This demonstrates the *process* of public justification in real-time. The tone is deliberately sharp ("You are entering a conflict") to avoid graduation fog, signaling that civic life is hard work, not a celebration of unity.

  3. **Where it's vulnerable**

  A strict Rawlsian might object that the speech leans too heavily on religious motivation to justify the duty of civility. By framing public justification as an act of Christian love, it risks alienating non-believing graduates who lack that specific theological imperative. It suggests the duty to give public reasons is derived from faith, rather than a freestanding political obligation owed to equals.

  Conversely, a religious critic would argue this *is* a gag order. By demanding believers translate their "God commands" into "public health," it implies their primary reason is insufficient for citizenship. It forces them to dilute their truth to fit a secular mold, privileging secular language as the only "real" reason.

  I believe the religious objection is sharper. The speech asks believers to do the heavy lifting of translation without demanding the same epistemic humility from secularists. However, in this specific context (a Christian college), framing the duty as theological is the only way to avoid hypocrisy, even if it weakens the universal philosophical claim.
