answer: |-
  **MEMORANDUM**

  **TO:** Exhibitions Committee
  **FROM:** Chair, Exhibitions Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Decision on Interpretive Frame: Weimar Republic Gallery

  **Context and Constraints**
  We face a constrained decision. Fabrication drawings are commissioned in five months; re-scripting beyond minor amendments after that point is prohibitively expensive. Furthermore, the founding gift for this gallery mandates that individual choice be given prominent place. The donor's estate has confirmed that removing the focus on specific actors would violate the terms of the gift. We must therefore navigate between the donor's requirement for agency, the timeline's demand for stability, and the committee's valid historiographical concerns.

  **The Counterfactual Question**
  Much of our disagreement stems from ambiguity regarding the entry-wall question: "Would Germany have taken the same path without Hitler?" This is a malformed counterfactual if it implies Hitler was the sole variable. We must be explicit about what we are asking. We are not asking whether authoritarianism or nationalism would have existed without him; the structural conditions made some form of right-wing authoritarianism probable. We are asking whether the *specific legal mechanism* of the Nazi seizure of power—the precise dismantling of the constitution via cabinet decision and emergency decree—was contingent on the choices made by the individuals in our eleven rooms. The gallery must answer "yes" to that specific question without implying "no" to the broader structural pressures.

  **Recommendation**
  I recommend we **approve the script subject to specific amendments.** We cannot return the script for reframing without jeopardizing the budget and timeline, nor can we approve it as drafted without risking historical distortion and visitor misunderstanding. The following amendments are concrete and must be executed by the curator without further committee review.

  **Required Amendments**

  1.  **Entry Wall Text:** The question must be revised to: "Could the Republic have survived these choices?" This shifts focus from a speculative removal of Hitler to an evaluation of the specific decisions presented. The accompanying text must explicitly state that while structural crises made democracy vulnerable, the specific path taken was determined by human agency.
  2.  **Antechamber Integration:** The label "Backdrop" must be removed. Rename this space "Structural Constraints." Within each of the eleven decision rooms, add a standardized icon and sentence linking the specific choice to a constraint from the antechamber. For example, in the January 1933 room: "This brokerage was influenced by the elite fear of communism heightened during the Depression (see Antechamber)." This ensures structure is not segregated as scenery but presented as the context for choice.
  3.  **Accountability Panels:** To address the concern that contextualization looks like mitigation, each decision room must conclude with a "Consequence Panel." This panel must explicitly state the human and legal cost of that specific decision (e.g., "This decree authorized indefinite detention without trial"). This ensures visitors leave with a clear record of accountability, preventing the diffusion of blame.

  **The Interactive Dial**
  The dial should remain, as it engages visitors with the core historical question, but the prompt must be refined to prevent simplistic polling. The question on the dial should read: "How much did structural conditions limit these choices?" with a scale from "Choices were free" to "Choices were determined." The running distribution should be displayed with a caption noting that historians debate this balance. This transforms the dial from a verdict on Hitler to a tool for understanding the tension between agency and structure.

  **The Compliance Test**
  To ensure these amendments are applied consistently, committee members and curators will apply the "Constraint/Choice/Consequence Test" to every panel during the next review. A panel passes only if it answers three questions:
  1.  **Constraint:** What structural pressure made this moment critical?
  2.  **Choice:** What specific alternative did the named individual(s) reject?
  3.  **Consequence:** What specific harm resulted from this choice?
  If a panel describes the pressure but not the choice, it fails (determinism). If it describes the choice but not the harm, it fails (mitigation).

  **The Strongest Counter-Argument**
  I must acknowledge the strength of the argument for **returning the script for reframing.** Proponents of this view, particularly our social historian member, argue that segregating structure into an antechamber and agency into decision rooms is fundamentally unhistorical. Structural forces do not merely constrain choices; they produce the actors themselves. The officers, civil servants, and politicians in our rooms were shaped by the very defeat, inflation, and traditions listed in the antechamber. By separating them, we risk teaching visitors that history is a game played by great men on a static board, rather than a process where the board and the players evolve together. A true reframing would weave structure and agency together in every room, rather than using amendments to bridge a conceptual divide. This approach would be historiographically superior and better serve the museum's educational mission.

  However, given the donor's explicit restriction on diminishing individual choice and the prohibitive cost of re-scripting at this stage, a full reframe is not viable. The amendments above are the maximum adjustment possible within our constraints to mitigate the risk of distortion.

  **Next Steps**
  The curator is authorized to proceed with these amendments immediately. Draft text for the revised entry wall and Consequence Panels must be circulated to the committee for informational review only in one week. We will not vote on these texts unless they deviate from the instructions above.

  We have a responsibility to the donor, to the timeline, and to the truth. This path honors all three, albeit imperfectly.
