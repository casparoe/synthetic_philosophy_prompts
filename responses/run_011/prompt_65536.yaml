prompt: |-
  ok so my friend and I spent about three hours last night arguing about whether diseases and volcanoes and cold snaps count as historical actors, and I lost the thread somewhere around one in the morning and now I want to settle it properly before we go another round.

  setup: I'm building the first two sessions of a methods seminar for first-year history students and the whole unit is on non-human causes — plague, drought, soil exhaustion, the Tambora eruption, the crops and livestock that crossed the Atlantic, that sort of thing. His position is that all of this is causal wallpaper: if you say the climate caused the crisis of the seventeenth century you haven't explained anything, you've just waved at a background condition and given it a proper name. My position is that he's smuggling in a prejudice — that only human decisions count as causes — and that if a pathogen takes out a third of your taxpayers in four years, that thing is doing work no human agent did. Neither of us could say what would actually settle it, which is the annoying part.

  so what I want from you is the spec, not the argument. Write the requirements list: what a theory of non-human historical agency has to deliver to count as adequate, with the concrete case or consideration behind each requirement — real cases, not placeholders. The bar for adequacy, so you know what you're aiming at: a first-year student should be able to take the list to a case they've never seen (a flood, a locust swarm, a cooling century, an introduced tuber) and get a non-arbitrary answer about whether the non-human item is being treated as an actor or just as scenery.

  things I especially want covered:

  - the distinctions the theory must not collapse — background condition vs event, causing vs making-salient, causal efficacy vs agency, necessary vs sufficient, and whatever else you think is load-bearing in this area. say which of these are real distinctions and which are just habits of one camp.
  - the responsibility problem. if the drought or the bacterium is the actor, what happens to the human decisions that were sitting right next to it? a theory that lets me say a pathogen caused the famine, and thereby makes nobody answerable for the famine, has done something moral and not only causal, and I want that as an explicit requirement with a case attached.
  - the determinism trap specifically: which requirement or requirements separate taking climate seriously from ending up at the environment made these people do it. note where the line is genuinely hard to draw rather than pretending it's clean.
  - the scale mismatch: processes that run over centuries vs decisions made on a Tuesday afternoon, and what a theory owes us about how those get linked without one swallowing the other.

  mark each requirement as non-negotiable or as a preference of a particular camp, and then tell me which single one does the most damage to the most popular approaches — that's the one my students will trip over.

  and the part I most want: is any subset of the list jointly unsatisfiable? I have a suspicion that (a) non-human factors must be genuine causes in their own right and not merely enabling conditions, (b) human agency stays explanatorily primary, and (c) no functional or teleological talk about what the climate "needed" or "selected for" — that those three can't all hold at once. if you think that's right, say which one to give up and what the theory looks like afterwards, because if it is right then my friend wins by default and I'd rather know now.

  short scorecard at the end is fine, one or two lines each, on the main camps against the list — the environmental historians, the climate-history crowd, the big-history people, and the collapse-and-catastrophe storytellers. but keep the weight on the criteria, the scoring is the easy bit. no reading list and no citations, please, I'll find the texts myself; I want the conceptual machinery. somewhere around a thousand words.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Goal:** Create a "spec" (requirements list) for a theory of non-human historical agency.
      *   **Context:** First-year history methods seminar on non-human causes (plague, drought, volcanoes, etc.).
      *   **Debate:** User (pro-non-human agency) vs. Friend (anti-non-human agency, sees them as "causal wallpaper").
      *   **Target Audience:** First-year students (needs clarity, applicability to new cases).
      *   **Key Requirements to Cover:**
          *   Distinctions (background vs. event, cause vs. salience, efficacy vs. agency, necessary vs. sufficient).
          *   Responsibility problem (moral/explanatory accountability).
          *   Determinism trap (environmental determinism).
          *   Scale mismatch (centuries vs. Tuesday afternoon).
          *   Mark requirements as Non-Negotiable vs. Camp Preference.
          *   Identify the single requirement that damages popular approaches most.
          *   Address the "Joint Unsatisfiability" suspicion (a: non-human genuine causes, b: human agency primary, c: no teleology).
          *   Short scorecard on main camps (Environmental historians, Climate-history, Big History, Collapse storytellers).
          *   **Constraints:** No reading list/citations, conceptual machinery only, around 1000 words.

  2.  **Deconstruct the "Joint Unsatisfiability" Suspicion:**
      *   The user suspects (a) Non-human factors are genuine causes, (b) Human agency stays explanatorily primary, and (c) No teleological talk cannot all hold.
      *   *Analysis:* If non-humans are genuine causes (a), they exert force. If humans are primary (b), their decisions override or filter that force. If no teleology (c), we can't say nature "wanted" something.
      *   *Resolution:* Actually, (a) and (b) *can* hold if we define "primary" carefully (e.g., humans define meaning/response), but often "primary" implies "sole sufficient cause," which contradicts (a). However, the real tension is usually between (a) and a strong version of (b). If non-humans are *actors* (agency), not just causes, does that diminish human agency?
      *   *Decision:* I need to tell the user if their suspicion is right. Usually, in historical materialism or environmental history, (b) is the one that gets softened. Humans aren't "primary" in the sense of being the *only* drivers, but they remain the only *moral* agents. I should advise dropping the strict version of (b) ("explanatorily primary") in favor of "explanatorily distinct." If you keep (b) strong, you revert to the friend's position (wallpaper). So, to save the user's position, (b) must be modified.

  3.  **Drafting the Requirements (The Spec):**
      *   *Requirement 1: Counterfactual Specificity.* (Distinction: Background vs. Event). A factor is an actor if removing it changes the outcome *in a specific way*, not just generally. (Non-negotiable).
      *   *Requirement 2: The Interaction Clause.* (Distinction: Cause vs. Agency). Non-humans provide constraints/opportunities; humans provide selection/response. (Non-negotiable).
      *   *Requirement 3: Moral Asymmetry.* (Responsibility). Non-humans can be causes, only humans can be accountable. (Non-negotiable).
      *   *Requirement 4: Temporal Bridging.* (Scale Mismatch). Must explain how slow forces trigger fast events (e.g., soil exhaustion -> specific harvest failure -> riot). (Non-negotiable).
      *   *Requirement 5: No Teleology.* (Determinism Trap). Nature doesn't "want." (Non-negotiable).

  4.  **Addressing the "Single Most Damaging Requirement":**
      *   Which one trips students up? Probably *Moral Asymmetry* or *Interaction Clause*. Actually, *Temporal Bridging* is often where explanations fail (jumping from "cooling" to "war" without mechanisms). But the prompt asks which damages *popular approaches*. Big History often fails on Moral Asymmetry (blaming nature for collapse). Environmental historians sometimes fail on No Teleology (nature "fighting back").
      *   Let's pick *The Interaction Clause* (Requirement 2). It kills both pure determinism (nature did it) and pure idealism (ideas did it). It forces the work of showing the *link*.

  5.  **Addressing the Joint Unsatisfiability:**
      *   User's trio: (a) Non-human genuine causes, (b) Human agency primary, (c) No teleology.
      *   Verdict: They are jointly satisfiable *if* "primary" means "locus of meaning/response" rather than "sole causal weight." However, if "primary" means "most causal force," then (a) and (b) conflict.
      *   Advice: Drop the strict version of (b). Humans are the only *subjects*, but not always the dominant *force*. If you keep (b) strong, your friend wins (non-humans are wallpaper).

  6.  **Scorecard:**
      *   Environmental Historians: Good on interaction, sometimes slip on teleology.
      *   Climate History: Good on data, bad on bridging scale (correlation vs causation).
      *   Big History: Good on scale, bad on moral asymmetry (deterministic).
      *   Collapse Storytellers: Bad on interaction (ignores human adaptation), good on drama.

  7.  **Refining Distinctions:**
      *   Background vs. Event: Real distinction.
      *   Cause vs. Agency: Real distinction (agency implies intent usually, so maybe stick to "Causal Efficacy" for non-humans).
      *   Necessary vs. Sufficient: Real distinction.

  8.  **Word Count Check:**
      *   Need to be concise. Around 1000 words.
      *   Avoid citations.
      *   Tone: Professional, conceptual, seminar-ready.

  9.  **Drafting - Section by Section:**
      *   *Intro:* Acknowledge the debate.
      *   *The Spec (Requirements):* 4-5 key points with cases.
      *   *Distinctions:* Clarify which are real.
      *   *The Trap (Unsatisfiability):* Address the (a)/(b)/(c) trio.
      *   *The Tripwire:* Identify the hardest requirement.
      *   *Scorecard:* Brief assessment.

  10. **Refining the "Agency" vs "Cause" terminology:**
      *   Historians often shy away from calling volcanoes "agents" because agency implies intent. The user wants to treat them as "actors." I need to be careful. The spec should demand "Causal Efficacy" without implying "Intent."
      *   Requirement: *Mechanism over Correlation.* (Stops wallpaper).
      *   Requirement: *Contingency Preservation.* (Stops determinism).

  11. **Final Polish:**
      *   Check against constraints: No citations? Yes. ~1000 words? Yes. Address specific user questions? Yes.
      *   Make sure the "Joint Unsatisfiability" answer is clear. (You must soften B).

  *(Self-Correction during drafting)*: The user asked to mark requirements as Non-Negotiable or Camp Preference. I need to be explicit about that.
  The user asked which single requirement does the most damage to popular approaches.
  The user asked about the unsatisfiability of (a), (b), (c).

  Let's structure the "Unsatisfiability" part carefully. If (b) means "humans decide the outcome," then (a) is false. If (a) means "nature decides the outcome," (b) is false. The middle ground is "Nature sets the table, humans choose the meal." But if the table is on fire, did nature choose the meal?
  I will argue that (b) is the one to sacrifice. Humans are not *explanatorily primary* in all cases (e.g., plague mortality rates), though they are *morally* primary.

  Let's write.

