answer: |-
  **Spec: Requirements for Non-Human Historical Agency**

  To count as an adequate theory for first-year students, the framework must deliver five specific outputs. Each requirement includes a test case to prevent abstraction.

  **1. The Counterfactual Specificity Requirement (Non-Negotiable)**
  The theory must demonstrate that removing the non-human factor changes the *specific* outcome, not just the general mood. It distinguishes **Background Condition** (always present) from **Event** (trigger).
  *   *Case:* The 1815 Tambora eruption. A valid theory doesn't just say "climate cooled." It must show that without the ash cloud, the 1816 harvest failure in Vermont would not have occurred *when* it did, altering the migration timeline specifically. If the migration happens anyway due to land prices, the volcano is wallpaper.

  **2. The Mechanism Bridging Requirement (Non-Negotiable)**
  The theory must articulate the physical or biological chain linking slow processes to fast decisions. This addresses the **Scale Mismatch**.
  *   *Case:* Soil exhaustion in the Maya lowlands. You cannot jump from "centuries of erosion" to "city abandoned in 800 CE." The theory must specify the link: reduced maize yield → elite inability to feed laborers → loss of legitimacy → revolt. Without the bridge, it is astrology with dirt.

  **3. The Moral Asymmetry Requirement (Non-Negotiable)**
  The theory must separate **Causal Efficacy** from **Accountability**. Non-humans can be causes; only humans can be responsible. This solves the **Responsibility Problem**.
  *   *Case:* The Irish Potato Famine. The blight (*Phytophthora infestans*) is a causal actor that destroyed the crop. However, the theory must prevent this from exonerating British policy makers who exported grain during the starvation. The pathogen caused the shortage; the humans caused the famine.

  **4. The Contingency Preservation Requirement (Non-Negotiable)**
  The theory must show where human decision could have altered the outcome despite the non-human pressure. This avoids the **Determinism Trap**.
  *   *Case:* The Dust Bowl. A valid theory explains why the drought led to collapse in the 1930s but not in the 1950s (different farming techniques/policy). If the theory implies the drought *made* the collapse inevitable, it is environmental determinism.

  **5. The No-Teleology Clause (Non-Negotiable)**
  The theory must not attribute intent, need, or selection goals to non-humans. This is a habit of the **Big History** camp, not a necessity.
  *   *Case:* Invasive species. You cannot say kudzu "invaded" to "conquer" the South. It must be described as spreading due to lack of predators and suitable climate. Nature does not plot.

  ***

  **Load-Bearing Distinctions**

  *   **Background vs. Event:** Real distinction. Soil type is background; a landslide is an event. Theories collapse these when they treat constant conditions as triggers.
  *   **Cause vs. Agency:** Habit of the humanist camp. "Agency" implies intent. Use "Causal Efficacy" for non-humans. Insisting on "agency" for volcanoes creates category errors.
  *   **Necessary vs. Sufficient:** Real distinction. A drought is necessary for a drought-induced famine, but not sufficient (see Moral Asymmetry).
  *   **Causal Efficacy vs. Making-Salient:** Real distinction. A virus kills (efficacy); a rumor makes people fear the virus (salience). Theories fail when they treat salience as efficacy.

  ***

  **The Joint Unsatisfiability Problem**

  You suspected that (a) non-humans are genuine causes, (b) human agency is explanatorily primary, and (c) no teleology cannot all hold. **You are correct, but only if (b) is defined strictly.**

  If "explanatorily primary" means "humans determine the outcome," then (a) is false (non-humans are wallpaper). If (a) is true (non-humans exert force), then (b) must be softened. You cannot claim humans are the *primary* driver of mortality rates in a plague year while also claiming the plague is a *genuine cause* of death.

  **Solution:** Drop the strict version of (b). Retain that humans are the only *moral* agents and the only *interpreters* of events, but concede they are not always the *dominant causal force*. If you keep strict (b), your friend wins by default: non-humans become scenery. The theory looks like this afterwards: Non-humans set the constraints (the hand of cards); humans play the hand (the strategy). Sometimes the hand is unwinnable. Acknowledging the unwinnable hand does not remove the player's responsibility for how they folded, but it admits the cards mattered.

  ***

  **The Tripwire Requirement**

  **The Mechanism Bridging Requirement (#2)** does the most damage to popular approaches.
  *   *Why:* It kills **Climate History** correlations (temperature graphs overlaid with war charts without social mechanisms) and **Collapse Storytellers** (who love inevitable doom). It forces students to find the human link in the chain. It is the hardest because it requires interdisciplinary knowledge (agronomy, epidemiology) that history students often lack.

  ***

  **Camp Scorecard**

  *   **Environmental Historians:** Pass Moral Asymmetry and Contingency. Often slip on No-Teleology (nature "fighting back").
  *   **Climate History:** Passes Counterfactual Specificity (data-rich). Frequently fails Mechanism Bridging (correlation mistaken for causation).
  *   **Big History:** Passes Scale Mismatch. Fails Moral Asymmetry and Contingency (drifts into determinism).
  *   **Collapse Storytellers:** Passes Counterfactual Specificity (dramatic events). Fails Contingency Preservation (ignores adaptation) and Moral Asymmetry (blames ecology for political failure).
