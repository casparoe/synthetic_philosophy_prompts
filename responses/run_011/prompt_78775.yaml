      *   **The Role of Incompleteness:** It's not about transcending the system; it's about how the system represents itself. The "truth" of $G$ is external to the system, just as the "self" is a high-level model, not a low-level truth.
      *   **The Numbering Objection:** It's technically valid but philosophically inert in this context. Hofstadter cares about the *structure* of self-reference, not the specific arithmetical sentence.
