      *   *Correction:* Make sure to mention the IASP definition change. It's crucial for the "Is it still pain?" question.
      *   *Correction:* Ensure I explain *why* the roommate says he's "backwards." She thinks the *reaction* constitutes the badness, he thinks the *attitude* is separate.

