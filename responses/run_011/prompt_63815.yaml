          *   *Move 2:* Brother wins on logic, but overstates "settles."
          *   *Move 3:* Roommate wins on function, but conflates injury with pain.
          *   *Move 4:* Brother wins on distinction (Harm vs. Hurt).
          *   *Move 5:* Roommate wins on phenomenology (What it *feels* like).
          *   *Move 6:* Brother gets bogged down in meta-ethics. It's a stalemate/deflection.
      *   *The "Missing" Pieces:*
