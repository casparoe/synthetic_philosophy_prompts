          2.  **Imperativism:** Pain as a command ("Stop this!"). Asymbolia breaks the command, not the sensation.
          3.  **Evolutionary Normativity:** Why we *should* dislike it (survival).
          4.  **The Insula:** It's not a "badness switch," it's an integration hub.
      *   *Conclusion:* Summarize. Brother is more conceptually precise; Roommate is more clinically grounded. Neither fully wins because the question spans two disciplines.

  6.  **Refining the Tone:**
