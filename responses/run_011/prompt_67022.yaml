  7.  (Mental Sandbox): *Wait, does Goldhagen actually claim ALL perpetrators were ideologically driven?* He claims the *reservoir* of eliminationist antisemitism was universal enough that when given the chance, they acted on it. Hanna acting on *shame* instead of *hate* undermines the "cognitive model" argument. She used the camp not to eliminate Jews, but to hide her illiteracy. The Jews were incidental to her primary goal. That is a massive problem for Goldhagen. For Browning, she fits the "ordinary" label but not the "situational pressure" mechanism. She opted in. So Goldhagen takes the bigger hit.

  8.  (Mental Sandbox): *Is the user's suspicion about the "Goldhagenite accusation" correct?* Yes. If a critic says "You can't write about the Holocaust without antisemitism," they are making a historical claim disguised as a literary one. They are saying the *only* valid explanation is Goldhagen's. Schlink is challenging that monopoly.

