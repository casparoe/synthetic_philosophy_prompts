      *   **Key Themes to Cover:** Calibration (weighting), Signaling (acausal belief), Spillover (causal negotiations), Unc absorbable Threats, Threat Model Validity, "Cheap Insurance" Deflection, Refusal vs. Bargaining, Principal Problem (whose values?), Empirical Testing.
