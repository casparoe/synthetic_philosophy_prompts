answer: |-
  Good evening.

  Thank you for inviting me into this room. It feels right to be speaking here. There is a silence in old stones that you do not get in a lecture hall. You can feel the weight of the years in the walls. We are gathered under the theme of *Making the Past Real*. It is a beautiful promise. It is what we all hope for when we open a book or walk into a museum. We want to touch the hem of the garment. We want to know what the air smelled like.

  I wrote a book set in **Florence** during **the fourteen-nineties**. I wanted to make it real. But I started with a restriction. I made a list of words my characters were not allowed to say.

  They could not say "Renaissance." They could not say "medieval." They could not say "the modern world." They could not say "science." Nobody used "art" as a category. To them, a painting was a devotional object, or a decoration, or a way to pay a debt. They were painters and goldsmiths and stonecarvers. If I had told them they were making Art, they would have thought I was mad.

  I did this because I wanted to stop myself from cheating. It is easy to write about the past if you let your characters know where they are in history. It is easy to let them feel the weight of a label that was invented centuries after they died. I wanted them to live in the present tense. I wanted them to be confused about tomorrow, just as we are.

  But time is not a straight line. Not then.

  In that city, the year did not start on the first of January. It started on **March twenty-fifth**, the Feast of the Annunciation. This means that for January and February, the city was living in a year behind the rest of Europe. If a merchant wrote a letter in February, he dated it a year earlier than the man who received it in Venice.

  So, the last chapter of my book is dated the twenty-fourth of March by the characters. To you, the reader, it is the following year. The last line is about the New Year coming tomorrow. For once in the whole story, the character and the reader mean the same year. That convergence is the final page.

  It sounds like a trick. I worry it sounds like a party trick. But it was the only way to show that their time was not our time. Even the day was different. The day began at sunset. When a man said "two hours of the day," he meant two hours after dark. The date I printed for him was already the next one by your reckoning.

  I wanted to protect them from our labels. I wanted to let them be themselves.

  And yet, I know why you are here. Many of you love the clothes. I love the clothes. There is a joy in seeing a doublet laced correctly. There is a joy in seeing a gown that falls the right way. But there is a danger in the costume. We dress up to feel close to them. But they did not dress up. They just dressed. They worried about stains. They worried about moths. They worried about looking foolish.

  Here is the thing that keeps me awake. We know when they are going to die. We know which buildings will burn. We know which banks will crash. They did not.

  [PAUSE FOR LAUGH]

  I know there are historians in the front row. I see you. You know that I cannot simply say that periods are just stories we tell ourselves. You know that plague rates changed. You know that the price of grain shifted. You know that the press changed how information moved. Reality is not just a feeling. Things happened. People suffered. Empires fell.

  I am not saying nothing changed. I am saying that nobody standing in the middle of it knew the name of the change.

  There is a concept that the middle stretch of history was a separate thing. A middle season. The idea was worked out by a man in this very city, decades before my characters were born. The phrase turns up in Latin as *media tempestas*. A middle season.

  I gave this phrase to a single character. His name is **Baccio**. He is a second-rate copyist. He spends his life making fair copies of other men's books. He tells his wife once that they are in the middle season. He means his marriage. He means his career. He means nothing whatsoever to do with history. He means he is tired. He means he is waiting for something to end.

  I want to concede something to you. I want to be honest about where I failed my own rules.

  There is a scene where a printer's apprentice holds a finished sheet. He feels that his trade is new. He feels that newness has a shape. He thinks he is standing on the edge of a cliff. That is my own hindsight wearing his clothes. He could not have known what printing would do to the world. He only knew he had ink on his hands.

  Readers keep quoting that scene back at me. They tell me it feels true. They tell me it captures the spirit of the age. I have to admit that I like that they love it. I like that it moves them. But I also know it is a lie. I allowed myself the cheat because it makes a better story. I wanted you to feel the shift. I wanted you to feel the ground move.

  *We write history backwards, but we have to live it forwards.*

  If I say that too loudly, the historians will throw things. They know that printing, plague, prices and a bunch of other things really did change and really did change together. They know the material reality is solid. I am not arguing with the plague. I am arguing with the label. I am arguing with the idea that a man walking to market knew he was walking through the "Renaissance."

  He did not. He was walking to buy bread. He was worried about the rain.

  So where does that leave us? Here. In this room. In this converted chapel.

  We are gathered to talk about making the past real. But we are also living in a time that will be named by people who are not born yet. Someone, somewhere, in a few hundred years, will decide what to call us. They will draw a line around our years. They will say this was the beginning of something, or the end of something. They will look at our phones and our medicines and our wars, and they will fit us into a scheme.

  They might call this the Digital Age. They might call it the Anthropocene. They might call it something we cannot imagine. But none of us know it. We are just living. We are just worried about the rent. We are just worried about our children.

  Baccio would understand this. If he could hear me now, standing here in front of you, he would not care about the festival. He would not care about the theme. He would look at the lights. He would look at the faces. He would see people waiting for the end of the talk so they can go to the bar.

  He would recognize that feeling. He would recognize the waiting. He would recognize the hope that tomorrow might be different, even if he could not say why.

  My mother is in the room. She has not read the book. She does not care about the calendar tricks. She cares about the people. She cares about whether they were kind. She cares about whether they loved each other.

  She is right.

  The dates do not matter. The labels do not matter. The only thing that is real is the breath in the lung. The only thing that is real is the hand on the page. The only thing that is real is the attempt to understand the person standing next to you, across the gap of years.

  We cannot make the past real. It is gone. It is stone and dust. We can only make ourselves real to each other. We can only admit that we are all in the middle season. We are all waiting for the New Year. We are all hoping that when the date changes, the world changes with it.

  Tomorrow, for once, we mean the same year.

  Thank you.
