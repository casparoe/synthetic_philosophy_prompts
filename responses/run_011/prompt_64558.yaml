prompt: |-
  I am taking a medical ethics seminar this term and we have just spent two weeks on the determination of death. I want to get clear on what our actual transplant practice commits us to, rather than on the textbook summary of the criteria, and I would appreciate a careful reconstruction.

  Here is the practice as I understand it. In controlled donation after circulatory death, the patient is a ventilated person with a devastating and non-survivable neurological injury who has not been declared brain dead. The family and the team decide to withdraw life-sustaining treatment; extubation takes place in or immediately adjacent to the operating theatre. In some programmes, an anticoagulant and a vasodilator are administered to the patient after the decision to withdraw but before death is declared, purely to protect the organs for the recipient. When the heart stops, the team observes a fixed standoff interval — commonly on the order of two to five minutes — after which death is declared on circulatory grounds and procurement begins, often with cold perfusion, within a minute or two. No resuscitation is attempted during the interval, and the protocol provides that if circulation returns, procurement stops. Meanwhile, elsewhere in the same hospital, a patient presenting the identical rhythm who is not a registered donor receives prolonged compressions, drugs, and possibly extracorporeal support, and is not declared dead for far longer; the difference in treatment tracks donor status and nothing else. There is a second strand to the picture: the same institutions also declare death on neurologic criteria, where a beating heart is held not to matter, and there are reported cases of bodies declared brain dead being kept on somatic support for weeks in order to carry a pregnancy, and of declared-dead patients being kept perfused for days for organ procurement. In at least one much-litigated American case a hospital continued somatic support for weeks on a patient it had already declared dead, citing a state statute concerning pregnant patients.

  So, working from that description, tell me what conception of death the practice presupposes.

  First: the statutory formulations most of us work under speak in terms of irreversible cessation of circulatory and respiratory function. But the DCD donor's circulation is plainly not irreversible in the sense of incapable of being restored — the team is standing by in a position to demonstrate otherwise the moment anything stirs, and ordinary ICU treatment would restart that heart. What has ceased is permanent, in the sense that it will not be restored because we have resolved not to restore it. Does the practice therefore rest on a different criterion from the one it officially invokes, and if so, what happens to the idea that death is a biological fact we discover rather than a status we confer? How much work is being done by the fact that the resolution not to restore is grounded in the patient's own prior refusal of treatment?

  Second: the dead donor rule is supposed to guarantee that procurement does not cause death. In this setting procurement begins minutes after an arrest that would be reversed by the treatment given to the non-donor upstairs. Does the rule survive only if the standoff interval is read as a bright line adopted for reasons other than the patient's biological condition at that minute — the avoidance of autoresuscitation, the avoidance of the appearance of killing, the protection of public trust? What does each of those readings presuppose about the rule's function: is it a moral constraint on killing, a rule of reassurance addressed to the public, or a legal safe harbour for clinicians? Which of those is compatible with the interval being a round number that varies between protocols and jurisdictions?

  Third: what does the premortem administration of organ-preserving drugs presuppose about the interests of the dying patient — that a patient this close to death has no remaining interest that such a drug could set back, that valid consent covers small risks undertaken for a third party's benefit, or that the donor has ceased to be a patient at the moment of the withdrawal decision? Is any of that consistent with the fact that the same drug, given to the non-donor upstairs, would require a benefit-and-risk justification addressed to that patient?

  Fourth: we treat loss of the whole brain as sufficient for death and loss of circulation as sufficient for death, in the same building, in the same week. Do the two criteria presuppose a single underlying account of what makes an organism dead — loss of somatic integration, loss of the capacity for consciousness, loss of the organism's own work — or two different accounts that happen to coincide in ordinary cases and visibly diverge in these? Which account, if any, would license a five-minute interval rather than a two-minute or a twenty-minute one, and what does the answer to that tell us about what the practice is really tracking?

  Throughout, please distinguish what the practice strictly requires from what it merely sits well with. I am especially interested in which of the standard accounts — whole-brain, higher-brain, circulatory, organism-as-a-whole, irreversibility-based, permanence-based, and the conventionalist view on which death is settled by communal stipulation — can accommodate all of the elements I have listed, which are ruled out by them, and where the practice is philosophically underdetermined so that several accounts would license it equally. If two accounts make identical predictions about every protocol parameter, say so rather than manufacturing a difference. Finish by telling me what would actually have to change — interval length, drug administration, the structure of consent, who is permitted to declare and when — if an institution adopted a strictly irreversibility-based criterion in place of the permanence-based one it appears to be using, and whether that change would end controlled circulatory donation altogether or merely slow it down. Please also flag anything in my description of the practice that you think is inaccurate, oversimplified, or varies substantially by jurisdiction.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A medical ethics seminar student (likely graduate or advanced undergraduate level). They have spent two weeks on the determination of death.
      *   **Goal:** They want a "careful reconstruction" of what actual transplant practice *commits us to*, contrasting it with textbook summaries. They want to know the underlying conception of death presupposed by the practice described.
      *   **Tone:** Philosophical, precise, analytical, nuanced. Avoids oversimplification.
      *   **Key Questions:**
          1.  Irreversibility vs. Permanence in DCD (Donation after Circulatory Death).
          2.  The Dead Donor Rule (DDR) and the standoff interval (moral constraint vs. public reassurance vs. legal safe harbor).
          3.  Premortem interventions (anticoagulants/vasodilators) and patient interests.
          4.  Consistency between Neurologic Determination of Death (NDD/Brain Death) and Circulatory Determination of Death (CDD/DCD).
          5.  Comparison of standard accounts (Whole-Brain, Higher-Brain, Circulatory, Organism-as-a-Whole, Irreversibility, Permanence, Conventionalist).
          6.  Practical implications of switching to a strictly irreversibility-based criterion.
          7.  Fact-checking the user's description of practice.

  2.  **Deconstruct the User's Description (Fact-Checking & Nuance):**
      *   *DCD Process:* Generally accurate. Ventilated, non-brain dead, withdrawal of life-sustaining treatment (WLST). Extubation near OR.
      *   *Premortem Interventions:* Accurate that this happens in *some* programs (heparin, vasodilators). This is ethically contentious (the "dead donor rule" boundary).
      *   *Standoff Interval:* 2-5 minutes is standard (often 5 in US, 2-5 elsewhere). Accurate.
      *   *Non-Donor Comparison:* Accurate. A non-donor with the same rhythm gets CPR. A donor does not. This highlights the "permanence" vs. "irreversibility" distinction.
      *   *Brain Death & Somatic Support:* Accurate. Brain-dead bodies can be kept on support for pregnancy (e.g., *Munoz* case in Texas, though she was declared brain dead, the hospital kept support due to statute) or organ optimization.
      *   *Jurisdictional Variation:* Crucial to note. Laws vary (US UDDA vs. UK Code vs. others).

  3.  **Address Question 1: Irreversibility vs. Permanence:**
      *   *Statutory Language:* Usually "irreversible cessation."
      *   *Practice Reality:* It's "permanent cessation" (won't be restarted, not *can't* be restarted).
      *   *Implication:* Death is not purely a biological fact discovered; it involves a normative decision (the decision not to resuscitate).
      *   *Role of Consent/Advance Directive:* The refusal of treatment makes the cessation permanent. It shifts the ontological status from "potentially alive" to "dead" based on a moral/legal constraint on intervention.
      *   *Conclusion:* Practice presupposes *Permanence*, not strict biological *Irreversibility*.

  4.  **Address Question 2: The Dead Donor Rule (DDR) and Standoff Interval:**
      *   *DDR:* "Do not kill to take organs."
      *   *Tension:* If the patient could be resuscitated (biologically), are we killing them by taking organs?
      *   *Function of Interval:* It's not biological magic. It's a buffer against autoresuscitation (Lazarus phenomenon) and a moral/legal buffer.
      *   *Nature of Rule:* If the interval varies (2 vs 5 mins), it suggests the rule is partly a *conventionalist* safe harbor or public reassurance mechanism, not a strict biological threshold. If it were purely biological, the time would be fixed by physiology, not policy.
      *   *Conclusion:* The DDR functions as a legal/moral safe harbor more than a strict biological boundary in DCD.

  5.  **Address Question 3: Premortem Interventions:**
      *   *Interventions:* Heparin, etc., before death.
      *   *Ethical Justification:* Usually "best interests" (unlikely to harm) or "substituted judgment" (would want to donate).
      *   *Implication:* Suggests the patient is still a *patient* with interests, but those interests are weighed against the benefit of donation. Or, it suggests a shift where the "donor" status begins to outweigh the "patient" status prior to death.
      *   *Consistency:* Inconsistent with the non-donor upstairs unless framed as "minimal risk for altruistic goal" which is generally not allowed for non-consenting/non-donating patients.
      *   *Conclusion:* Practice presupposes that valid consent transforms the risk-benefit calculus, allowing non-therapeutic intervention for a third party, implying the patient is still alive but their autonomy extends to post-mortem bodily integrity.

  6.  **Address Question 4: NDD vs. CDD Consistency:**
      *   *NDD:* Whole brain dead, heart beating. (Loss of integration/consciousness).
      *   *CDD:* Heart stopped, brain might still have some activity for minutes. (Loss of circulation).
      *   *Unified Theory?* "Loss of Organism as a Whole" (Bernat et al.) tries to bridge them. But in DCD, the brain isn't dead yet. In NDD, the heart works.
      *   *Divergence:* They rely on different proxies for the same underlying loss (integration).
      *   *Interval:* A 5-minute interval is not biologically derived from "organism as a whole" failure (which takes longer for the brain to die after cardiac arrest). It's derived from "irreversibility of *circulation*" (permanence).
      *   *Conclusion:* The practice is theoretically hybrid/inconsistent. It uses a *Conventionalist* overlay to make two different biological proxies count as the same moral status (death).

  7.  **Evaluate Standard Accounts:**
      *   *Whole-Brain:* Fits NDD well. Struggles with DCD (brain not dead at 5 mins).
      *   *Higher-Brain:* Fits NDD. Struggles with DCD (consciousness might not be permanently gone at 5 mins, though likely).
      *   *Circulatory (Biological):* Fails DCD because circulation *is* reversible.
      *   *Organism-as-a-Whole:* Tries to unify. Fails DCD because the organism is integrated for a few minutes after arrest.
      *   *Irreversibility:* Fails DCD (as noted).
      *   *Permanence:* Fits DCD practice perfectly. Struggles to explain why "we won't try" makes someone biologically dead.
      *   *Conventionalist:* Fits everything. Death is a legal/moral status assigned when it's useful/agreed upon.
      *   *Underdetermination:* Much of the practice is underdetermined by biology alone.

  8.  **Address the "What Would Change" Scenario:**
      *   *Strict Irreversibility:* You couldn't declare death until the heart *cannot* be restarted.
      *   *Impact on DCD:* Controlled DCD would likely end. You'd have to wait until rigor mortis or decomposition, or until resuscitation is attempted and fails. Organs would be unusable (warm ischemia time too long).
      *   *Impact on NDD:* Might require proof that the brain cannot be restarted (hard to prove).
      *   *Conclusion:* Switching to strict irreversibility kills controlled DCD.

  9.  **Drafting the Response:**
      *   *Structure:* Follow the user's four questions, then the comparative analysis of accounts, then the practical implications, then the fact-check.
      *   *Style:* Academic, rigorous, respectful of the complexity. Use terms like "ontological," "normative," "conventionalist," "warm ischemia."
      *   *Key Insight:* The core tension is between *biological realism* (death is a fact) and *moral/legal conventionalism* (death is a status we assign based on norms). The practice leans heavily toward the latter while claiming the former.

  10. **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure not to say DCD *is* unethical. The prompt asks what the practice *commits us to*, not for a moral verdict.
      *   *Nuance:* Distinguish between "controlled" and "uncontrolled" DCD. The prompt specifies controlled.
      *   *Nuance:* The "pregnant brain-dead patient" case (Marlise Munoz) is a key example of the separation of biological death and legal status.
      *   *Clarification:* Ensure the distinction between "irreversible" (cannot be reversed) and "permanent" (will not be reversed) is sharp. This is the crux of the DCD debate.

  11. **Final Review against Prompt:**
      *   Did I answer all four specific questions? Yes.
      *   Did I distinguish strict requirements vs. what sits well? Yes.
      *   Did I evaluate the standard accounts? Yes.
      *   Did I address the "what would change" scenario? Yes.
      *   Did I flag inaccuracies? Yes (need to be careful about the "same rhythm" comparison and jurisdictional variations).

  12. **Final Polish:** Check tone. Ensure it sounds like a seminar discussion leader or advanced peer. (Proceed to generate output).

  *(Self-Correction Note on Fact-Checking)*: The user mentions "In some programmes, an anticoagulant and a vasodilator are administered... before death is declared." This is true (e.g., heparin), but it's highly regulated and requires consent. I should note that this is not universal. The "same rhythm" comparison is rhetorically strong but technically, the DCD patient is in a withdrawal context (DNR/DNI order active), whereas the code blue patient is Full Code. I need to make sure I acknowledge that the *code status* is the differentiator, not just donor status, though donor status influences the code status decision.

  *(Self-Correction on "Death of the Organism")*: James Bernat's "organism as a whole" is the dominant theory for Brain Death. Does it fit DCD? Bernat argues yes, because circulation loss leads to loss of integration. But the *timing* (5 mins) is the issue. The brain doesn't die in 5 mins. So the practice outpaces the theory. I need to highlight this gap.

  *(Final Plan)*:
  1. Introduction: Acknowledge the sophistication of the query.
  2. Section 1: Irreversibility vs. Permanence (The Ontological Shift).
  3. Section 2: The Dead Donor Rule & The Interval (The Moral Buffer).
  4. Section 3: Premortem Interventions (The Patient/Donor Hybrid).
  5. Section 4: NDD vs. CDD (Theoretical Incoherence or Pragmatic Unity?).
  6. Comparative Analysis of Accounts (Table or List).
  7. The "Strict Irreversibility" Counterfactual.
  8. Fact-Check/Jurisdictional Nuance.
  9. Conclusion.

  (Proceed to write).
answer: |-
  This is an exceptionally sharp reconstruction of the current landscape. You have correctly identified the fault lines where the metaphysics of death collide with the logistics of transplantation. Your description of the practice is largely accurate, though I will flag specific jurisdictional variances and simplifications at the end.

  What follows is a reconstruction of the commitments inherent in the practice you describe, analyzed through the lens of the four questions you posed, followed by an evaluation of standard theoretical accounts and a counterfactual analysis of strict irreversibility.

  ### 1. Irreversibility vs. Permanence: The Ontological Shift

  You are correct that the statutory language ("irreversible cessation") conflicts with the physiological reality of controlled Donation after Circulatory Death (DCD). In controlled DCD, the cessation of circulation is not biologically irreversible at the moment of declaration; it is **permanent**.

  *   **The Commitment:** The practice commits us to a **normative definition of irreversibility**. It treats a physiological state as "irreversible" if there is a moral or legal obligation *not* to reverse it.
  *   **Fact vs. Status:** This undermines the view that death is solely a biological fact we discover. Instead, the practice presupposes that death is a **status we confer** based on a combination of biological facts (arrest) and normative constraints (the decision to withdraw treatment and the Do-Not-Resuscitate order).
  *   **The Role of Refusal:** The patient's prior refusal of treatment (or surrogate decision) does the heavy lifting here. It transforms a *contingent* physiological state (cardiac arrest) into a *necessary* one (death). Without the refusal, the arrest is a treatable injury; with the refusal, it is the terminal event.
  *   **Implication:** The practice presupposes that **autonomy can determine ontology**. By refusing resuscitation, the patient renders their own circulation "irreversible" in the eyes of the law, even if a defibrillator could physically restart it. This suggests death is not merely the cessation of function, but the cessation of function *plus* the absence of an obligation to restore it.

  ### 2. The Dead Donor Rule (DDR) and the Standoff Interval

  The Dead Donor Rule states that patients must be declared dead before vital organs are removed, and procurement must not cause death. In DCD, procurement begins minutes after arrest, while the non-donor upstairs receives CPR for 20+ minutes.

  *   **The Commitment:** The practice treats the standoff interval (2–5 minutes) not as a biological threshold for the *death of the organism*, but as a **moral and legal safe harbor**.
  *   **Function of the Rule:** If the interval were strictly biological (tracking the point of no return for the brain or organism), it would be invariant across jurisdictions. The fact that it varies (2 minutes in some protocols, 5 in others, sometimes longer) indicates it is a **conventionalist buffer**.
  *   **What it Presupposes:**
      1.  **Avoidance of Autoresuscitation:** Biologically, this is the only "hard" reason for the interval (the Lazarus phenomenon). However, autoresuscitation almost never occurs after 65 seconds. A 5-minute wait exceeds biological necessity.
      2.  **Public Reassurance:** The interval serves to distance the clinicians from the act of killing. It creates a "ritual of waiting" that reassures the public that the team is not rushing to cut.
      3.  **Legal Safe Harbor:** It protects clinicians from homicide charges.
  *   **Conclusion:** The DDR in this context functions less as a moral constraint on killing (since the patient could biologically be saved) and more as a **rule of professional conduct** designed to maintain trust. It presupposes that the *appearance* of not killing is as morally requisite as the *fact* of not killing, implying that the boundary of death is partly social.

  ### 3. Premortem Interventions: The Patient/Donor Hybrid

  The administration of anticoagulants (heparin) or vasodilators before death is declared is one of the most ethically fraught aspects of DCD.

  *   **The Commitment:** This practice presupposes that **the interests of the dying patient are sufficiently attenuated** that they can be outweighed by the interests of the potential recipient, provided consent exists.
  *   **Patient Status:** It contradicts the notion that the donor has "ceased to be a patient." If they were no longer a patient, consent would be irrelevant (we don't consent for corpses regarding ante-mortem care). The requirement for consent acknowledges they are still a living patient with rights.
  *   **Risk-Benefit Calculus:** In standard medicine, you cannot administer a drug with no benefit to the patient (and potential risk, e.g., bleeding from heparin) solely for a third party's benefit. DCD protocols create a **special exception** to this rule.
  *   **Justification:** This is usually justified by the principle of **double effect** (intent is to facilitate donation, harm is foreseen but not intended) or by a specific **altruistic waiver** where the patient's autonomy permits non-therapeutic intervention.
  *   **Inconsistency:** As you note, this is inconsistent with the treatment of the non-donor upstairs. The practice presupposes that **donor registration alters the standard of care**. It implies that once a patient is in the withdrawal phase *and* is a donor, their moral status shifts from "patient solely owed therapeutic care" to "patient-donor owed a mix of therapeutic and facilitative care."

  ### 4. NDD vs. CDD: Theoretical Coherence

  You note the divergence: Brain Dead (beating heart) vs. Circulatory Dead (stopped heart, potentially viable brain).

  *   **The Commitment:** The practice presupposes a **functionalist, pluralistic account of death** rather than a single biological account. It accepts two different proxies for the same moral status.
  *   **Underlying Account:**
      *   **Neurologic Determination of Death (NDD):** Relies on the **Whole-Brain** or **Higher-Brain** account (loss of integration or consciousness).
      *   **Circulatory Determination of Death (CDD):** Relies on the **Circulatory-Respiratory** account (loss of perfusion).
  *   **The Conflict:** In DCD, at the 5-minute mark, the brain is not dead (Whole-Brain fails), and consciousness is likely lost but not irreversibly so without intervention (Higher-Brain is shaky). The organism is not yet fully disintegrated (Organism-as-a-Whole fails).
  *   **What the Interval Tracks:** The 5-minute interval does not track the death of the brain or the organism. It tracks the **permanence of the circulation**.
  *   **Conclusion:** The practice is theoretically **hybrid and inconsistent**. It uses NDD for one group and CDD for another, knowing they do not map onto the same biological moment. It relies on a **Conventionalist** overlay to declare them morally equivalent ("dead") for the purpose of organ procurement. The practice is not tracking a single biological phenomenon; it is tracking the **loss of moral claim to resuscitation**.

  ---

  ### Comparative Analysis of Standard Accounts

  Here is how the standard accounts accommodate or conflict with the practice you described.

  | Account | Accommodates NDD? | Accommodates DCD (5-min)? | Accommodates Premortem Drugs? | Verdict on Practice |
  | :--- | :--- | :--- | :--- | :--- |
  | **Whole-Brain** | Yes. | **No.** (Brain alive at 5 mins). | **No.** (Living patients shouldn't be harmed). | Rules out DCD as currently practiced. |
  | **Higher-Brain** | Yes. | **Maybe.** (Consciousness likely gone, but "irreversible" is the sticking point). | **No.** | Requires redefining irreversibility. |
  | **Circulatory (Biological)** | **No.** (Heart beats). | **No.** (Circulation is reversible). | **No.** | Rules out both NDD and DCD. |
  | **Organism-as-a-Whole** | Yes (Bernat). | **No.** (Integration persists briefly after arrest). | **No.** | Requires longer standoff (20+ mins), killing DCD. |
  | **Strict Irreversibility** | **No.** (Some brain function recoverable?). | **No.** (Heart can be restarted). | **No.** | **Ends Controlled DCD.** |
  | **Permanence-Based** | Yes (if no intent to treat). | **Yes.** (Fits the "won't treat" logic). | **Yes** (with consent). | **Best fit for current practice.** |
  | **Conventionalist** | Yes. | Yes. | Yes. | **Most honest fit.** Admits death is a legal status. |

  **Underdetermination:**
  The practice is philosophically underdetermined between the **Permanence-Based** view and the **Conventionalist** view.
  *   *Permanence View:* Claims there is a moral fact that "permanent cessation" *is* death.
  *   *Conventionalist View:* Claims "death" is a label we apply when social/legal conditions are met (including the utility of organ procurement).
  *    Both license the exact same protocols (5-minute wait, premortem drugs with consent). There is no operational difference between them, only a difference in justification.

  ---

  ### The Counterfactual: Strict Irreversibility

  If an institution adopted a **strictly irreversibility-based criterion** (death = cessation that *cannot* be restored by *any* available technology, regardless of intent):

  1.  **Standoff Interval:** Would have to extend until the heart muscle is physically incapable of restarting or the brain is biologically dead. This would likely require **20 to 30 minutes** of warm ischemia, or until rigor mortis sets in.
  2.  **Drug Administration:** Premortem anticoagulants would be impermissible. Administering a non-therapeutic drug to a living person (who is not yet irreversibly dead) to benefit a third party violates the core medical mandate of *primum non nocere* without the shield of "imminent death."
  3.  **Declaration:** The declaring physician could not be part of the transplant team (already true), but they would also have to certify that resuscitation is *physiologically impossible*, not just *contraindicated*.
  4.  **Outcome for Controlled DCD:** **It would end controlled DCD.**
      *   Organs tolerate only limited warm ischemia. Waiting for strict biological irreversibility renders kidneys, livers, and hearts unusable.
      *   We would revert to **Donation after Brain Death (DBD)** only, or **Uncontrolled DCD** (where the patient arrives dead and resuscitation is attempted and fails, establishing true irreversibility).
  5.  **Outcome for NDD:** It might complicate Brain Death declaration. If "irreversible" means "cannot be restored," and we have technologies that can somatically support a brain-dead body for weeks (as in the pregnancy cases you cited), is the death truly irreversible? Strict irreversibility might force us to wait until somatic support fails naturally, which could take weeks.

  **Conclusion:** The shift to strict irreversibility would not merely slow down donation; it would collapse the current architecture of organ procurement. The current system *requires* the permanence/irreversibility conflation to function.

  ---

  ### Fact-Checking and Jurisdictional Nuance

  Your description is highly accurate for a general overview, but a few points vary substantially by jurisdiction and should be noted for seminar precision:

  1.  **Premortem Interventions:** You wrote, "In some programmes... anticoagulant and a vasodilator are administered."
      *   *Correction:* In the **United States**, premortem administration of *heparin* is common but controversial; administration of *vasodilators* (like phentolamine) or cannulation *before* death is much rarer and often prohibited by hospital policy due to the "harm to donor" concern. In the **UK and Spain**, protocols are often more aggressive regarding premortem preparation. You should specify that this is the *most* ethically volatile part of the protocol and is not universal even within DCD programs.
  2.  **The "Same Rhythm" Comparison:** You compare the DCD patient to a non-donor with the "identical rhythm."
      *   *Nuance:* Technically, the DCD patient is under a valid **DNR/DNI (Do Not Resuscitate/Intubate)** order based on the decision to withdraw life-sustaining treatment (WLST). The non-donor upstairs is **Full Code**. The difference tracks *code status* legally, though you are right that *donor status* often influences the timing and location of WLST to facilitate donation. The ethical tension is whether the DNR is truly independent of the donation plan.
  3.  **Pregnancy and Brain Death:** You cite the "much-litigated American case" (likely *Munoz v. John Peter Smith Hospital*, Texas, 2014).
      *   *Nuance:* In *Munoz*, the hospital *wanted* to stop support (declaring her dead), but the state statute *forced* them to continue. This highlights that "death" is a legal status that the state can override for policy reasons (fetal protection). In other jurisdictions, a brain-dead pregnant woman is a corpse, and somatic support is not mandated. This supports your Conventionalist conclusion: the state decides when the body counts as a person.
  4.  **Standoff Time:**
      *   *Nuance:* The **Institute of Medicine (IOM)** in the US recommends 5 minutes. The **UK** recommends 5 minutes. Some European protocols have used 2 minutes. The **American College of Critical Care Medicine** suggests 2-5 minutes. The variability is real, but the trend is standardizing on 5 minutes to mitigate the "killing" concern.

  ### Summary for your Seminar

  If you need a thesis statement for your seminar contribution, it is this:

  > Current transplant practice does not presuppose a single biological conception of death. Instead, it operates on a **normative conception of permanence**, where death is defined as the cessation of function that we are morally and legally obligated not to reverse. This commits us to a **conventionalist view** where the Dead Donor Rule functions as a legal safe harbor and public reassurance mechanism rather than a strict biological boundary. Consequently, the practice is incompatible with a strict biological irreversibility standard; adopting such a standard would necessitate the abandonment of controlled circulatory donation entirely. The system relies on the moral equivalence of "cannot be restarted" and "will not be restarted," a distinction that biology alone cannot sustain.
