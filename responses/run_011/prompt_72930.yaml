  Here is the carving you asked for.

  ### 1. The List-versus-Property Pattern
  The established term for the overall pattern you described in the first half is **The Heterogeneity Objection** (sometimes called **The Argument from Heterogeneity**).

  *   **What it is:** This is the standard objection against **Sensory Hedonism** (the view that pleasure is a single, uniform kind of feeling). It argues that the phenomenology of pleasures (eating, thinking, listening) is so diverse that no single qualitative property ("the pleasure feel") unites them.
  *   **Where it bites:** It bites hardest against **Feeling Theories** of pleasure (e.g., early utilitarian accounts, certain interpretations of Bentham). It forces the hedonist to either deny the diversity (implausible) or abandon the claim that pleasure is a unitary sensation.
  *   **What it isn't:** It is not an objection to Hedonism *per se*, but to specific *accounts* of pleasure. A hedonist can survive it by switching to an **Attitudinal Theory** (pleasure is pro-attitude toward experience) or a **Disjunctive Theory**. The objection targets the *unity* of the natural kind "pleasure," not necessarily the normative claim that "pleasure is good."

  ### 2. The Final Move (Retreat to Family Resemblance)
  You are correct that this is not a *No True Scotsman* (which redefines the term to exclude counterexamples) nor a *Motte-and-Bailey* (which toggles between a defensible and an indefensible claim). It is a specific dialectical maneuver where a substantive theory saves itself from falsification by abandoning its substantive core, invoking "family resemblance" to dissolve the demand for unity.

  *   **Established Candidates:**
      *   **The Wittgensteinian Retreat:** This is the most common descriptive label in meta-ethics and aesthetics for invoking family resemblance to block essentialist objections. However, it is neutral; one can legitimately use family resemblance for concepts like "Game" or "Art." It does not inherently capture the *pathology* of using it to save a theory that *requires* unity to function.
      *   **Immunizing Stratagem (Popper/Lakatos):** This covers "saving a theory from refutation," but it usually implies *adding* auxiliary hypotheses to protect the core, rather than *shedding* the core's content to protect the label.
      *   **Theoretical Trivialization:** This names the *result* (the theory becomes empty), but not the *move* itself.

  *   **The Carving:**
      Since no single established term captures the specific pathology of "surviving by shedding content via family resemblance," I recommend a coinage that bridges the dialectical move with the theoretical cost.

      **Coinage:** **The Deflationary Retreat**.
      *   **Definition:** A dialectical move where a theorist, faced with counterexamples to a necessary condition, abandons the requirement for a unifying property (deflating the theoretical claim) and reclassifies the concept as a cluster or family-resemblance notion, thereby preserving the theory's label while evacuating its explanatory power.
      *   **Why it fits:** It captures the "lowering of stakes" (deflation) required to survive the objection. It distinguishes the move from a legitimate Wittgensteinian analysis (where no unity was promised) by implying a *retreat* from a prior substantive commitment.
      *   **Nearby Case that is *Not* an Instance:** A philosopher of art who argues from the start that "Art" is a cluster concept with no necessary conditions. This is not a *Deflationary Retreat* because there was no initial substantive claim of unity to abandon; it is a **Cluster Account**. The *Retreat* only occurs when the theorist starts with "Pleasure is One Thing" and ends with "Pleasure is a Family Resemblance" solely to dodge the Heterogeneity Objection.

  ### 3. Summary
  The pattern is the **Heterogeneity Objection**. The move to dissolve it via family resemblance, when done to save a theory that relies on unity, is best described as **The Deflationary Retreat**. It marks the point where the theory becomes unfalsifiable by becoming uninformative.

