      1.  **Calibration:** $P(Y=1 \mid \text{Score}=s) = s$. This means the probability estimate is accurate.
      2.  **Positive Predictive Value (PPV) Parity:** $P(Y=1 \mid \text{Flagged}, \text{Group}=A) = P(Y=1 \mid \text{Flagged}, \text{Group}=B)$. This is the "same share of defendants... flagged as high-risk."
