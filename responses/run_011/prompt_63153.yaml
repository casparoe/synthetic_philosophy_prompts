  ### 1. Claim-by-Claim Sorting

  **Claim:** *"The first is calibration: a score of 0.7 should mean a 70 percent chance of reoffending, and — what amounts to the same thing in the binary examples these papers use — the same share of the defendants the tool flags as high-risk should go on to reoffend in each group."*
  *   **Assessment:** **Incorrect / Conflated.**
