      *   **Topic:** Cross-cultural psychology, specifically "tightness-looseness" theory (Gelfand et al.).
      *   **Concept:** Tightness has two components: (1) Strength/Clarity of norms, (2) Intolerance of deviation (sanctioning). Usually correlated, but conceptually independent.
