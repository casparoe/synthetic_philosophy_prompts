  2.  **Deconstruct the Target Society (Low Norm Strength, High Sanctioning):**
      *   *Norm Strength:* People don't really know what the rules are. Rules are vague, shifting, or non-existent. "Anything goes" until it doesn't.
      *   *Sanctioning:* When someone *does* violate whatever rule is deemed to exist at that moment, the punishment is extreme.
      *   *The Absurdity:* You can get punished severely for breaking a rule nobody knew existed or for doing something that was fine five minutes ago.
      *   *Contrast with Normal Tight Society:* In a normal tight society (e.g., Japan, Singapore), you know the rules (don't litter, bow correctly) and if you break them, people are upset.
      *   *Contrast with Normal Loose Society:* In a normal loose society (e.g., Brazil, NZ), rules are flexible and violations are tolerated.
      *   *The Joke's Core:* The unpredictability of the rule vs. the certainty of the punishment.

