answer: |-
  ### Exam Item: Practical Rationality Seminar

  **Question 4 (20 Marks)**
  **Time Allocation:** 40 Minutes
  **Word Limit:** 500 words maximum

  **Prompt:**
  Read the following excerpt from a student essay regarding Buridan's Ass and Expected-Utility (EU) theory:

  > "The ass case shows that expected-utility theory is incomplete as a guide to action. Rationality requires you to maximise, but when two options are equally good it doesn't tell you which of them to take, so a maximiser who follows the theory faithfully just stands there and starves. Any complete account of rational choice therefore has to add a tie-breaking principle. Since the ass has no such principle available it is stuck: it can't rationally eat either bale, and so it eats neither."

  Diagnose the categorical error in the final sentence ("it can't rationally eat either..."). Explain why the move from "EU theory does not distinguish between $A$ and $B$" to "EU theory forbids choosing $A$ (or $B$)" is invalid. In your answer, address whether a tie-breaking principle is a *requirement* for rational action or merely a *strategy* for causal efficacy, and clarify the relationship between normative indeterminacy and psychological paralysis.

  ***

  ### Model Answer

  The student's reasoning fails because it conflates **normative indeterminacy** with **normative prohibition**. The core error is the tacit adoption of a **Uniqueness Assumption**: the claim that rational action requires a unique option that is *strictly better* than all alternatives. Expected-Utility theory does not endorse this assumption.

  Under EU theory, if Option $A$ and Option $B$ yield identical expected utility, both are **permissible** maximizations. Rationality requires choosing an option from the set of maximal elements; it does not require that the set contain only one element. The student argues that because the theory provides no *reason to prefer* $A$ over $B$, it provides no *reason to choose* $A$ simpliciter. This is a non-sequitur. The reason to choose $A$ is simply that $A$ is maximal (tied for best). To claim the ass "can't rationally eat either" is to claim that indifference renders action impermissible, which contradicts the definition of maximization.

  Consequently, the demand for a "tie-breaking principle" confuses a **normative requirement** with a **causal strategy**. A tie-breaking mechanism (such as a randomizer) is causally useful for an agent psychologically incapable of choosing without a differentiating reason. However, it is not normatively required. An agent can rationally choose $A$ arbitrarily, knowing $A$ is as good as $B$. The rationality of the act depends on the status of the option (maximal), not on the psychological process used to select it among equals.

  Finally, the student mistakes the ass's starvation (a psychological/causal failure) for a failure of rational theory. The theory says "Eat $A$ or $B$." The ass hears "No basis to prefer $A$ to $B$" and infers "No basis to eat." The paralysis is a cognitive bug in the agent, not a gap in the logic of rationality. EU theory is complete because it identifies the permissible set; it is not responsible for an agent's inability to execute a choice within that set.

  ***

  ### Marking Scheme

  **Total Marks:** 20
  **Classification Guide:**
  *   **17–20 (First):** Precise, structural diagnosis.
  *   **14–16 (2:1):** Correct core distinction, minor omissions.
  *   **10–13 (2:2):** General grasp, significant conceptual blurring.
  *   **0–9 (Fail):** Fundamental misunderstandings or recitation of the story.

  #### 1. The Core Diagnosis (8 Marks)
  *   **First (7–8):** Explicitly identifies the **Uniqueness Assumption** as the hidden premise. Clearly articulates that indifference implies **equal permissibility**, not **impermissibility**. Distinguishes between "no reason to prefer $A$ over $B$" and "no reason to choose $A$."
  *   **2:1 (5–6):** Correctly states that both options are permissible. Notes that maximizing does not require a unique maximum. May miss the specific label "Uniqueness Assumption" but captures the logic.
  *   **2:2 (3–4):** Vaguely suggests the student is "too strict" or that the ass "should just eat." Fails to clearly distinguish permission from requirement.
  *   **Fail (0–2):** Claims EU theory *is* incomplete. Recites the Buridan story. Suggests the ass is actually rational to starve.

  #### 2. Tie-Breaking & Randomization (6 Marks)
  *   **First (5–6):** Correctly categorizes tie-breaking as a **causal strategy** (heuristic) rather than a **normative requirement**. Acknowledges that while a randomizer solves the *psychological* deadlock, invoking it as a *rational necessity* invites the regress problem (choosing the randomizer requires its own tie-breaker).
  *   **2:1 (3–4):** States a randomizer is allowed but doesn't strictly required. May suggest "just flip a coin" without addressing why the student thought it was *necessary*.
  *   **2:2 (1–2):** Proposes randomization as the *solution* to the rational problem without noting it was never a rational problem to begin with.
  *   **Fail (0):** Argues that without a randomizer, the choice is irrational. Falls into the symmetry regress trap (e.g., "you need a reason to pick the randomizer").

  #### 3. Normative vs. Psychological (6 Marks)
  *   **First (5–6):** Sharp distinction between **normative indeterminacy** (theory allows multiple paths) and **psychological paralysis** (agent cannot initiate action). Identifies the starvation as a failure of the agent's volition, not the theory's guidance.
  *   **2:1 (3–4):** Notes that the ass is "stuck" psychologically but doesn't fully explain why this doesn't reflect on the theory.
  *   **2:2 (1–2):** Conflates the two. Suggests the theory is useless if it doesn't prevent starvation.
  *   **Fail (0):** Treats the starving as evidence that rationality is impossible in symmetrical cases.

  #### Specific Penalties & "Wrong Turns"
  *   **The "Paradox" Penalty (-2 marks):** If the student refers to this as a "paradox" without qualification. (It is a *puzzle* or *case*, not a logical paradox; calling it a paradox suggests they believe the theory contradicts itself).
  *   **The "Cognitive Limit" Error (-3 marks):** If the student argues the starving proves rationality is impossible, rather than proving the ass lacks volitional capacity.
  *   **The "Naive Randomizer" Error (-3 marks):** If the student proposes "just use a randomizer" as the *fix* for rationality, without noting that the choice to randomize is itself a choice between equals (rebuilding the symmetry one level up). A First-class answer notes this but dismisses it as irrelevant to *permissibility*.
  *   **Story Recitation (-5 marks):** If more than 50 words are spent retelling the setup of Buridan's Ass rather than analyzing the text provided.
