answer: |-
  Your characterization of the three positions is remarkably precise, capturing the core intuitions and standard moves of each camp. However, there are two nuances worth correcting before proceeding, as they affect the diagnosis.

  First, regarding **Evidential Decision Theory (EDT)**: You describe the "screening-off manoeuvre" (often called the "tickle defense") as the standard reply to the Smoking Lesion. This is specifically the strategy of *Sophisticated EDT* (associated with Ellery Eells). Many orthodox EDT proponents accept that EDT recommends smoking in the lesion case if the tickle is unavailable, arguing that the intuition against smoking is a causal bias leaking into an evidential problem. Treating the tickle defense as universal EDT obscures a split within the camp.

  Second, regarding **Causal Decision Theory (CDT)**: You note the causal theorist "accepts the resulting poverty." While true that they two-box, CDT proponents (like David Lewis) typically distinguish *rationality* from *success*. They argue the two-boxer is rational but unlucky, whereas the one-boxer is lucky but irrational. They do not merely accept poverty; they reject the premise that rationality must guarantee success in non-causal dependencies.

  With these clarifications, here is the diagnosis of the disagreement.

  ### Diagnosis of the Disagreement

  The stalemate persists because the three camps are optimizing for different structural properties of agency, grounded in divergent metaphysical commitments about what an "act" is. Your hypothesis—that the dispute is about whether the agent's decision procedure is exogenous or part of the world-state—is the strongest diagnostic tool available. It correctly identifies that CDT treats the act as an exogenous intervention (`do(A)`), EDT treats it as endogenous evidence (`P(World|A)`), and UDT treats it as the output of a logical function (`Program(Output)`).

  However, this modeling choice is driven by the substantive trade-offs identified in Alternative (ii). The disagreement is not merely about modeling; it is about which normative desiderata are non-negotiable. CDT sacrifices success in Newcomb problems to preserve *dynamic consistency* and *autonomy* (the idea that the past cannot depend on the present). EDT sacrifices success in lesion cases (without the tickle) to preserve *pure conditionalization*. UDT sacrifices *ratifiability* (sometimes) and standard *conditionalization* to preserve *decision-theoretic success* across all logical correlations.

  Therefore, the disagreement is not verbal (i), nor is the subject matter ill-posed (iv). It is a substantive clash over the boundaries of agency (iii), operationalized through modeling choices (Your Hypothesis) that entail specific trade-offs (ii). The reason no case settles it is that each camp designs cases to highlight the specific trade-off their rivals are willing to make. CDT points to the lesion to show EDT values "news" over "outcomes." UDT points to Newcomb to show CDT values "causal purity" over "wealth." EDT points to standard cases to show UDT violates conditionalization.

  Progress will not come from new intuition pumps, as each camp can absorb them by adjusting their modeling of the case. Progress requires a formal unification that parametrizes the scope of counterfactual dependence, or an ecological argument showing which theory fits which class of environments.

