answer: |-
  **Grade: 18 / 25**

  **Part (a): Computation (6 / 8 points)**
  *   **Right:** You correctly identified the probability mass function $(1/2)^n$ for both games. Your calculation for the Pasadena game is flawless: you correctly simplified the term to $(-1)^{n-1}/n$, identified the alternating harmonic series, and computed the limit $\ln 2$.
  *   **Wrong / Math Check:** Your reasoning for the St. Petersburg expected value contains a factual error. You wrote: *"each successive outcome contributes more than the one before it."* This is incorrect. The contribution of each outcome is $(1/2)^n \cdot 2^n = 1$. Each outcome contributes *exactly the same amount* as the previous one; the sum diverges because you are adding $1 + 1 + 1...$, not because the terms are increasing. In a course with many math majors, describing the term behavior incorrectly suggests you might be recalling the result ("infinity") rather than deriving it.
  *   **Revision Tip:** Re-calculate the term for St. Petersburg explicitly. Show that the $n$-th term is constant, not increasing, before concluding the sum diverges.

  **Part (b): Conditional Convergence & EU Theory (8 / 12 points)**
  *   **Right:** You correctly defined conditional convergence (absolute series diverges, alternating series converges) and correctly invoked the Riemann Rearrangement Theorem. Your explanation of *why* this is worse than St. Petersburg is strong: St. Petersburg yields a determinate value ($\infty$), whereas Pasadena yields *no* unique value under standard expectation definitions because the sum depends on the ordering of outcomes.
  *   **Contradiction:** There is a significant logical contradiction in this section. In the first paragraph of (b), you argue that *"the expectation doesn't exist... the theory goes silent."* However, in the second paragraph (starting "That said..."), you conclude: *"So the Pasadena game does have an expected value, ln 2."* These two claims cannot both be true within the same framework. If the expectation is undefined due to conditional convergence (as you argued in para 1), you cannot assert it *is* $\ln 2$ (para 2) without explaining why the standard definition of expectation should be overruled by the "natural order." You are trying to have it both ways: claiming the theoretical problem is fatal, then dismissing it to give a numerical answer.
  *   **Revision Tip:** You need to take a stance. Either (1) maintain that the expectation is undefined (making the $\ln 2$ calculation merely the sum of the series in standard order, not the "Expected Value"), or (2) argue that the temporal order of tosses *defines* the summation order, thereby resolving the indeterminacy. Currently, you assert both that it doesn't exist and that it does.

  **Part (c): Normative Proposal (4 / 5 points)**
  *   **Right:** Proposing logarithmic utility is a standard and mathematically valid response to convergence problems in decision theory. You are correct that for *this specific* payoff function, logarithmic utility renders the series absolutely convergent, solving the indeterminacy problem you identified in (b).
  *   **Doesn't Follow / Depth:** While your solution works mathematically for this specific game, it sidesteps the deeper philosophical lesson of the Pasadena game. The Pasadena problem is usually presented to show that *any* unbounded utility function can be broken by a sufficiently volatile payoff structure (a "Pasadena-like" game). By treating Pasadena as just a "stronger St. Petersburg" that Log Utility fixes, you miss the point that the problem may lie with the expectation operator itself, not just the utility function. However, given the constraints of the specific game written on the exam, your solution is technically defensible.
  *   **Revision Tip:** Acknowledge that while Log Utility solves *this* instance, the broader lesson of Pasadena is that we can construct games that break *any* unbounded utility function. Defend why Log Utility is special or why we should restrict the domain of allowable games.

  **General Comment:**
  You have excellent command of the vocabulary (Riemann Rearrangement, conditional convergence, diminishing marginal utility), but be careful not to let fluency mask conceptual tensions. The contradiction in part (b) regarding the existence of the expectation is the kind of substantive error that looks like insight on a first read but falls apart on revision. Tighten the logic: if the EV is undefined, don't claim it equals $\ln 2$ without a robust justification for redefining EV.
