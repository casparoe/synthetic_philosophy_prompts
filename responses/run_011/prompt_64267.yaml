answer: |-
  Here is the battle plan for the section.

  ### 1. The Opening: Lock the Intuition, Then Break It
  **Strategy:** Open with the **Intuition**. If you open cold with the story, they get bogged down in the mechanics of the radio link and the sci-fi absurdity. You need them to commit to a pre-theoretical view of "where" they are so Dennett can pull the rug out.

  **The First 5 Minutes:**
  1.  **The Hook (2 mins):** Walk to the center of the room. Say: "Put your finger on the exact spot where *you* are right now. Not your body, *you*."
      *   90% will point to their head/eyes.
      *   Write on board: **INTUITION: I am where my brain is.**
      *   Ask one student: "Why there?" They'll say, "That's where my thinking happens."
      *   Write on board: **REASON: Thinking = Me.**
  2.  **The Pivot (3 mins):** "Two weeks ago, Locke told you 'You are where your memory is.' You mostly agreed. Today, Dennett is going to make those two answers fight each other, and then he's going to tell you both are wrong."
      *   **Managing the "Ridiculous" Factor:** Immediately address the sci-fi. "This story involves radio-linked brains in vats. It is silly. Locke's prince swapping bodies into a cobbler is also silly. We aren't testing engineering; we are stress-testing concepts. If you catch me on the physics, I concede. But you have to grant the premise to test the philosophy. Deal?"
      *   *Why this works:* It validates their skepticism (yes, it's silly) but frames it as a methodological tool (like Locke), which buys you seriousness.

  ### 2. The Hinge: The Backup Brain (Don't Move It)
  **Strategy:** Your instinct is correct. Park the section on the **Backup/Switch**.
  *   **Why:** The first half of the story (Brain in Houston, Body in Tulsa) is just a fancy Brain-vs-Body tug-of-war. They can solve that with their current "Psychological Continuity" view (I go with the brain because the psychology is there).
  *   **The Kill Shot:** The backup brain (let's call it Hubert) creates *two* centers of psychological continuity. If "I go where my psychology is," and there are two identical psychologies, are there two Dennetts?
  *   **How far to go:** **Tell the ending.** Do not stop before the resolution. If you stop early, they treat it as a puzzle to be solved (i.e., "Find the real Dennett"). The philosophical payoff is Dennett's conclusion that the question *itself* is flawed. You need his answer to show them the deflation.

  ### 3. Board Work: The Map of Locations
  **Strategy:** Use the board to track the *separation* of variables. Do not draw a brain. Draw boxes.

  **Sequence:**
  1.  **Draw two boxes:** Left = [BODY], Right = [BRAIN].
  2.  **Phase 1 (Normal):** Draw them touching. Label "Tulsa." Ask: "Where is Dennett?" (Class: Tulsa).
  3.  **Phase 2 (The Vat):** Draw an arrow moving [BRAIN] to the other side of the board. Label "Houston." Keep [BODY] in "Tulsa." Draw a zig-zag line between them (Radio).
      *   *Ask:* "Where is Dennett?" (Write answers: Houston? Tulsa? Both?)
  4.  **Phase 3 (The Backup):** Draw a second [BRAIN] box next to the first in Houston. Label "Hubert."
      *   *Action:* Ask a student to stand up. "You are the Body in Tulsa." You stand by the board. "I am the Brain in Houston."
      *   *Point:* "If I (Brain) wave, you (Body) wave. If Hubert (Backup) wakes up, he thinks he's me. Where did *I* go?"
  5.  **The Deflation:** In the middle of the board, write **"WHERE?"** and draw a big circle around it with a line through it (🚫).
      *   *What they notice:* The diagram shows three locations (Body, Brain 1, Brain 2), but the "Self" has nowhere to sit. The visual gap forces the realization that the map doesn't match the territory.

  ### 4. Misconceptions: Order of Appearance & Interception
  **1. The "Vote" (Brain vs. Body)**
  *   *When:* Phase 2 (The Vat).
  *   *Intercept:* "Don't vote yet. The radio link is perfect. No lag. The body feels exactly what the brain feels. The biology is intact. Why does the *location* of the grey matter matter if the *function* is identical?" (Pushes them toward Psych Continuity).

  **2. The Skeptic ("How do we know he's not dreaming?")**
  *   *When:* Phase 2.
  *   *Intercept:* "This isn't epistemology. We aren't asking if he *knows* he's in a vat. We are asking where the *person* is located assuming the story is true. Bracket the skepticism."

  **3. The "Copies Don't Count" (Parfit Fatigue)**
  *   *When:* Phase 3 (The Backup).
  *   *Intercept:* "Stipulate it. For the sake of the argument, Hubert is functionally identical. If you say 'copies aren't real,' you're begging the question. Dennett wants to know: if the copy is perfect, does the *location* of the original matter?"

  **4. The Hidden Time-Sink: The Cartesian Theater (The Homunculus)**
  *   *When:* The Conclusion.
  *   *Risk:* They will assume there is a "little viewer" inside the brain watching the screens. They will ask, "But which brain is the *viewer* in?"
  *   *Intercept:* "Dennett's point is there is no viewer. There is only the stream of data. If you insist there's a 'true viewer,' you're assuming the answer before you start. That's the intuition we're trying to break."
  *   *Cost:* This will eat 10 minutes if you let them debate consciousness. Keep it on *identity location*.

  ### 5. The Closing Question
  **Goal:** Separate the "Team Brain/Team Body" pickers from the students who understand the deflation.

  **Ask:** "If we decide Dennett is definitely in Houston, what **practical difference** does that make? Does it change who we arrest if the body commits a crime? Does it change where we send his paycheck?"

  *   **Team Pickers:** Will try to justify why Houston matters morally/legalally.
  *   **Deflation Getters:** Will realize the answer does no work. "It doesn't matter."
  *   **Follow-up:** "If the answer doesn't change how we treat him, was it a real question?"

  ### 6. What to Refuse (And How)
  **Topic:** **Qualia/Consciousness Feel.**
  *   *Student:* "But does the brain in the vat *feel* pain when the body gets cut?"
  *   *Shut-down:* "That's a Philosophy of Mind question about qualia. Today is Metaphysics of Identity. For this story, stipulate the signal is perfect. If the body cries out, the brain registers it. Don't get stuck on the feeling; get stuck on the *location*."
  *   *Phrasing:* "That's a great question for week 10. For week 4, we have to treat the signal as transparent."

  **Topic:** **Neuroscience Feasibility.**
  *   *Student:* "Radio waves can't transmit that much data."
  *   *Shut-down:* "I promised you at the start: I concede the physics. We are testing the concept of 'Self,' not the bandwidth of 1970s radio."

  ### Summary Checklist for the Whiteboard
  1.  **Left:** [BODY] [BRAIN] (Moving boxes as story progresses).
  2.  **Center:** "WHERE AM I?" (Eventually crossed out).
  3.  **Right:** Key Terms: *Biological View* vs. *Psychological View* vs. *Pragmatic View*.

  **Final Tip:** When they get stuck on the Backup Brain (Hubert), lean into the absurdity. "Okay, if Dennett is in Houston, which millimeter of the vat is he in? The left side? The right side?" Show them that demanding a precise coordinate becomes ridiculous, which proves Dennett's point that the question was the error.
