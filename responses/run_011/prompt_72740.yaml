  *   If $A$ has lives below $T$ and $B$ does not, **$B$ is strictly better.**
  *   If both have lives below $T$, or neither does, proceed to Clause 2.
  *   *Forced by:* **Case 6 (Sparse Agony).** Standard aggregation ranks the sparse agony world above the uniform 9.99 world because the average is higher. Your intuition that extreme suffering cannot be traded off against mild gains requires a lexical veto.

  **Clause 2: Strong Pareto**
  Check if $a_i \ge b_i$ for all $i$, and $a_i > b_i$ for at least one $i$.
  *   If yes, **$A$ is strictly better.**
  *   If no, proceed to Clause 3.
  *   *Forced by:* **Case 1 (Lift)** and **Case 3 (Front).** In *Front*, every generation is at least as well off as Eden, and the first $10^{100}$ are strictly better. This clause ensures finite improvements at the start are not washed out by the infinite tail.

  **Clause 3: Overtaking with Bounded Indifference**
  Calculate the cumulative difference $D_n = \sum_{i=1}^n (a_i - b_i)$.
  *   If $\liminf_{n \to \infty} D_n > 0$ (the cumulative advantage of $A$ eventually becomes positive and stays above some positive bound), **$A$ is strictly better.**
  *   If $\limsup_{n \to \infty} D_n < 0$ (the cumulative advantage of $B$ eventually becomes positive and stays above some positive bound), **$B$ is strictly better.**
  *   If $D_n$ oscillates but remains **bounded** (i.e., there exists some $K$ such that $|D_n| < K$ for all $n$), **$A$ and $B$ are equally good.**
  *   If $D_n$ oscillates **unboundedly** (goes to $+\infty$ and $-\infty$), **$A$ and $B$ are incomparable.**
  *   *Forced by:* **Case 4 (Tail)** requires Overtaking (Tail eventually accumulates more value than Front). **Case 7 (Clump vs. Stripe)** requires Bounded Indifference (the cumulative difference between them oscillates but never diverges). **Case 8 (The Gamble)** results in Unbounded Oscillation, yielding Incomparability.

