  ### Application to Your New Cases

  **(i) The First $10^{100}$ at +11, thereafter alternating +10.5 / +9.5.**
  *   *Comparison:* Against Eden (all +10).
  *   *Analysis:* The first $10^{100}$ generations create a massive positive cumulative buffer. Thereafter, the average is exactly +10, so the cumulative sum oscillates around that initial buffer. The difference $D_n$ is bounded (it never drops below the initial surplus).
  *   *Verdict:* **Equally good as Eden.** (Clause 3, Bounded Indifference).
  *   *Note:* This may feel counterintuitive compared to Case 3 (*Front*), but in Case 3 the tail was +10 (neutral), here the tail includes +9.5 (losses). The losses cancel the gains in the long run, leaving only a finite residue.

  **(ii) Everyone at +10 except a sparse infinite set at +11, with all the rest at +9.99.**
  *   *Comparison:* Against Eden (all +10).
  *   *Analysis:* The "rest" are at 9.99 (-0.01 loss). The "sparse" set are at +11 (+1 gain). Unless the sparse set has density $> 1/100$, the average welfare is $< 10$. The cumulative difference $D_n$ will drift toward $-\infty$.
  *   *Verdict:* **Strictly worse than Eden.** (Clause 3, Overtaking).

  **(iii) Infinitely many at +11 and infinitely many at +9, compared with Eden.**
  *   *Comparison:* Against Eden (all +10).
  *   *Analysis:* This depends entirely on the *order*.
      *   If arranged as blocks (+11s then +9s), the cumulative sum goes to $+\infty$ then $-\infty$. Unbounded oscillation.
      *   If arranged as pairs (+11, +9, +11, +9...), the cumulative sum is bounded (oscillates between 0 and 1).
  *   *Verdict:* **Incomparable** (if unbounded ordering) or **Equal** (if bounded ordering).
  *   *Lesson:* Without a specified temporal distribution, this world is ill-defined for ranking.

