  You are not over-thinking the situation; the situation is designed to tax the distinction between individual and group rationality. However, you are over-weighting the private information about the Defector. In a sealed-bid coordination game without communication, private information about a single actor cannot sustain a shifted equilibrium.

  You must act on the **common knowledge**. The common knowledge dictates a symmetric split of the pot.

