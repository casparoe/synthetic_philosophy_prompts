answer: |-
  ### The Self-Deception Diagnostic

  **Instructions:** Read each case below. Choose the option that best matches your intuition about what is happening in the person's mind. Do not overthink; pick the description that feels most true to life.

  **1. The Smoker**
  Elena smokes a pack a day. She has bought patches and told everyone she is quitting on the first of the month. When she lights up today, she says, "This one doesn't count."
  *   **A.** Deep down she counts it, but a separate part of her mind locks that count away so she can keep smoking.
  *   **B.** She genuinely sees this cigarette as different from the others; the rule just doesn't apply to this one in her eyes.
  *   **C.** She is actively pushing the thought of the rule out of her head to enjoy this smoke.

  **2. The Diary**
  Marcus keeps a journal. He writes about his triumphs and happy moments in detail. When a day goes poorly, he leaves the page blank. Years later, he reads it and feels he has led a charmed life.
  *   **A.** The memory of the bad days is stored in him, but it is walled off from the story he reads.
  *   **B.** He has simply forgotten the bad days; the blank pages mean nothing to him now.
  *   **C.** He skips writing the bad days to protect the story he wants to tell himself.

  **3. The Partner**
  Sarah tells her friends she has complete faith in her husband. Yet, every evening, she glances through his text messages while he showers.
  *   **A.** She trusts him with her voice, but her hands operate on a suspicion she won't admit.
  *   **B.** She thinks checking is just a normal habit, like locking the door; it isn't about trust.
  *   **C.** She looks because she is afraid to find something, but more afraid not to look.

  **4. The Angry Man**
  During an argument, David says, "I am not angry." His voice is flat, his jaw is tight, and he is gripping the chair until his knuckles turn white.
  *   **A.** The anger is fully present in his body, but he has forbidden it from entering his words.
  *   **B.** He feels a tightness he interprets as focus; he does not feel what we call anger.
  *   **C.** He is holding the feeling back by force so it doesn't come out of his mouth.

  **5. The Researcher**
  Dr. Lin has a theory she loves. A colleague often points out a flaw. Lin stops attending the seminars where that colleague speaks.
  *   **A.** She knows the flaw is real, so she stays away to keep her theory intact.
  *   **B.** She lost interest in those seminars for unrelated reasons; the timing is a coincidence.
  *   **C.** She steers her schedule away from that room to avoid hearing the objection.

  **6. The Gambler**
  James has lost money all week. He walks into the casino again, saying, "I'm due for a win."
  *   **A.** He knows the odds are against him, but he acts as if the wheel remembers his losses.
  *   **B.** He truly sees the pattern differently; he thinks the math is on his side this time.
  *   **C.** He tells himself he is due so he can place the bet without feeling the risk.

  **7. The Parent**
  A teacher sends a note saying their child is struggling. The parent puts the note in a drawer and says, "Teachers are always exaggerating."
  *   **A.** The worry is there, but it is kept in a drawer along with the note.
  *   **B.** The parent genuinely thinks the teacher is wrong; the note holds no weight.
  *   **C.** The parent calls it exaggeration to stop the worry from growing.

  **8. The Dieter**
  Nina is on a strict diet. She eats a cookie and says, "It was small, so it has zero calories."
  *   **A.** She knows it has calories, but she is running a different calculation for herself.
  *   **B.** In her mind, small things don't register as food; she isn't counting it.
  *   **C.** She decides right then that this exception won't count toward the total.

  **9. The Investor**
  Raj holds stock in a company that is crashing. He reads only the articles that say the price will rebound.
  *   **A.** He sees the crash, but he feeds his mind only the hope that fixes it.
  *   **B.** He honestly believes the positive articles are the only true ones; the rest is noise.
  *   **C.** He selects the good news to keep himself from selling.

  **10. The Friend**
  After a breakup, Alex says, "I'm better off alone." He spends every weekend trying to run into his ex at their usual spots.
  *   **A.** He knows he wants to be together, but he lives the script of being alone.
  *   **B.** He thinks he is better off; running into the ex is just a coincidence of habit.
  *   **C.** He says he is better off to cover up the fact that he is hunting for a reunion.

  ***

  ### Scoring Key

  Tally your answers.
  *   **Axis 1 (Contradiction):** Count your **A** and **C** answers.
      *   *High Score (7-10):* You lean toward the view that the mind can hold two opposing truths at once (e.g., knowing the danger while acting safely).
      *   *Low Score (0-3):* You lean toward the view that the mind holds only one state at a time (e.g., they are simply mistaken).
  *   **Axis 2 (Agency):** Count your **C** answers specifically.
      *   *High Score (7-10):* You lean toward the view that the person is *doing* something active to maintain the state (steering, choosing, pushing).
      *   *Low Score (0-3):* You lean toward the view that the state *happens* to the person (drifting, forgetting, structural).

  *(Note: **B** answers contribute to Low scores on both axes. **A** answers contribute to High Contradiction but Low Agency.)*

  #### The Philosophical Leaves

  Map your totals to the following positions defended in the literature:

  **1. The Deflationary / Motivated Bias View**
  *   **Profile:** Low Contradiction, Low Agency (Mostly **B** answers).
  *   **The Position:** There is no paradox. The person is not deceiving themselves; they are simply making a cognitive error driven by desire. They do not hold the truth anywhere; they just see the world incorrectly because it feels better.
  *   **Defenders:** Alfred Mele, Quentin Smith.
  *   **Status:** *Named.*

  **2. The Divided Mind / Partitioning View**
  *   **Profile:** High Contradiction, Low Agency (Mostly **A** answers).
  *   **The Position:** The paradox is real. The mind is structured like a house with locked rooms. One part knows the truth, another part believes the lie. They coexist, but the person does not actively choose this split; it is a sub-personal structural feature.
  *   **Defenders:** Donald Davidson, Michael Pears.
  *   **Status:** *Named.*

  **3. The Intentionalist / Bad Faith View**
  *   **Profile:** High Contradiction, High Agency (Mostly **C** answers).
  *   **The Position:** The person knows the truth and actively chooses to hide it from themselves. This is a project of freedom. We are responsible for our own deception because we sustain it moment-to-moment.
  *   **Defenders:** Jean-Paul Sartre (Bad Faith), Sigmund Freud (Censorship model).
  *   **Status:** *Named.*

  **4. The Akrasia / Weakness of Will View**
  *   **Profile:** High Contradiction, High Agency (Mostly **C** answers, specifically on action cases).
  *   **The Position:** What looks like self-deception is actually just failing to act on what one knows. The "deception" is a label we put on the gap between judgment and action. The mind isn't split; the will is just weak.
  *   **Defenders:** Donald Davidson (on Akrasia), Amélie Rorty.
  *   **Status:** *Named.* (Note: In this quiz, this clusters with Intentionalism; see analysis below).

  **5. The Pretense / No-Belief View**
  *   **Profile:** Low Contradiction, Low Agency (Mostly **B** answers).
  *   **The Position:** The person does not actually believe the lie, nor do they hold the truth. They are merely *acting as if* the lie is true. There is no belief state to contradict, only behavior.
  *   **Defenders:** Kent Bach, Robert Audi.
  *   **Status:** *Named.*

  **6. The Unnamed Cell**
  *   **Profile:** Low Contradiction, High Agency (Mix of **B** and **C** without **A**).
  *   **The Position:** The person chooses to have a single false state without holding the truth.
  *   **Status:** *Empty.* (See analysis below).

  ***

  ### Analysis of the Diagnostic Space

  **Indistinguishable Pairs**
  Even with ten cases, this quiz cannot separate **Motivated Bias** from the **No-Belief/Pretense View** in principle. Both occupy the Low Contradiction / Low Agency cell.
  *   *Why:* Both views agree that the person is not holding two contradictory states and is not actively choosing the deception. The difference is metaphysical: Bias says "They believe the lie," while Pretense says "They don't believe anything, they just act." A behavioral quiz cannot see inside the metaphysical status of the mental state, only the output. To separate these, you would need to ask about the nature of assertion and sincerity, not just cases of deception.

  Similarly, the **Intentionalist** and **Weakness of Will** positions cluster in the High Contradiction / High Agency cell.
  *   *Why:* Both admit the truth is known and that the person is responsible. The distinction lies in whether the failure is in *forming the judgment* (Intentionalist) or *executing the action* (Akrasia). Since our cases describe behavior that looks like both (e.g., the Smoker), the quiz treats them as neighbors.

  **Empty Cells**
  There is one cell in the two-axis space that nobody occupies: **Low Contradiction / High Agency**.
  *   *The Position:* This would imply that a person *chooses* to hold a single false belief without holding the truth, or chooses to be ignorant without already knowing what they are avoiding.
  *   *Verdict:* **Incoherent.**
  *   *Reasoning:* This violates the principle of Doxastic Involuntarism. We cannot choose our beliefs directly in the way we choose actions. To "choose" to avoid a truth (Agency) implies you already know there is a truth to avoid (Contradiction). To "choose" a false belief without knowing the truth is impossible, because you cannot aim at a target you do not see. Therefore, Agency without Contradiction is logically unstable in this context.

  **Unexplored vs. Unattractive**
  *   The **High Contradiction / Low Agency** cell (Partitioning) was once considered unattractive (positing homunculi or little men in the head) but is now explored and respected via cognitive science models of modularity.
  *   The **Low Contradiction / Low Agency** cell (Bias) is the most populated in contemporary analytic philosophy because it is the most scientifically parsimonious, requiring no special mental architecture.
