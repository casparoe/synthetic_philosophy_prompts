      The non-commutativity objection is not fatal to Coherent Extrapolated Volition, but it does destroy the claim that CEV discovers a pre-existing moral truth, forcing us to treat idealization as a normative choice rather than a mathematical derivation. Critics argue that because informing then rationalizing differs from rationalizing then informing, the "true self" is path-dependent. They claim this smuggles in the theorist's values. They are right about the smuggling, but wrong about the fatality.

