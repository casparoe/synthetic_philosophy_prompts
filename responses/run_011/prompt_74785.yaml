  1. **The Exclusion Problem**
  If every collision in the careenium is already fixed by the physics of magnetized spheres, what is left over for the premise-clump to do that isn't just a redescribing of it?
  *Follow-up:* She'll likely say it's not "left over" but the same story told where it's stable. Push back: "But if I tweak the magnetism without changing the words, the outcome changes. If I tweak the words without changing the magnetism, it doesn't. So isn't the magnetism doing the work?"

  2. **The Interventionist Criterion**
  Your rule says a level is real if intervening there is more reliable. But that depends on my tools. I can't tweak individual molecules easily. So is temperature real just because I'm clumsy?
  *Follow-up:* She'll likely say it's about robustness, not clumsiness. Push back: "But robustness implies a selector. If a super-being could tweak molecules easily, does temperature cease to be causally real for them? Is causal reality observer-relative?"

  3. **Geometry vs. Meaning**
  The simmballs stick because of shape and magnets, not because they "mean" *modus ponens*. What would it take for the *content* rather than the magnetic shape to be doing the work?
  *Follow-up:* She'll likely say the shape implements the content. Push back: "Then swap the labels. Put 'P' on a ball that magnetically attracts 'Not-P'. The content says valid, the magnet says invalid. Which one wins the causal story?"

  4. **The Rigged Magnets**
  You said the magnets are rigged so premises drag conclusions. But someone built that rig. Is the downward causation yours or the system's? Aren't you smuggling the semantics in via the hardware?
  *Follow-up:* She'll likely say all systems are built, the question is what happens once it's running. Push back: "Once it's running, the spheres only know magnets. If I scramble the labels but keep the magnets, the logic holds. If I keep labels and scramble magnets, it fails. So the logic is in the magnets, not the symbols."

  5. **Mechanism vs. Metaphor**
  Is the Careenium a mechanism you think could actually think, or is it a metaphor with good production values? Does this need to be buildable to be true?
  *Follow-up:* She'll likely say it's a model of causation, not a blueprint for a robot. Push back: "If it's just a model, then the 'symbols pushing substrate' is also just a model. Why should I believe the pushing is real and not just a useful way of drawing the diagram?"

  6. **Falsification**
  What observation would convince you the symbolic level was causally inert after all? What would break the theory?
  *Follow-up:* She'll likely say if high-level interventions stopped predicting outcomes better than low-level ones. Push back: "But if low-level physics is deterministic, low-level interventions *always* predict perfectly in principle. Are you saying your theory stands or falls on human computational limits?"

  7. **Normativity**
  Logic is about what *ought* to follow. Magnets are about what *does* follow. If a clump drags a contradiction because the magnet is sticky, is that a reasoning error or just physics?
  *Follow-up:* She'll likely say it's an error relative to the system's design function. Push back: "If the causation depends on the design function, then the cause is the designer's intent, not the system's state. So the system isn't thinking, it's being thought *at*."

  8. **The "Wrong Level" Retreat**
  You're quick to say I'm asking at the wrong level. But if the levels don't interact, how does the symbol move the sphere? If they do interact, isn't that dualism?
  *Follow-up:* She'll likely say they aren't separate substances, just separate descriptions. Push back: "If they're just descriptions, then causation is also just a description. So nothing is actually pushing anything. Is that your view?"

  9. **Learning and Plasticity**
  In a brain, connections change. In your skull, do the magnets change? If so, what moves the magnets? If not, how does it learn?
  *Follow-up:* She'll likely say the magnets change based on higher-level feedback loops. Push back: "But that feedback loop is also made of spheres and magnets. So you're saying the magnets move the magnets. Where does the 'higher level' enter the chain?"
