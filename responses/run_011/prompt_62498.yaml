      *   *Decision:* The Folk Song is actually quite good, but needs tweaking on the "resolution" aspect. Maybe a *Recipe*? No, too static. Maybe a *Style of Play* in music?
      *   *Refinement:* Stick with the song but refine the "performance" aspect. Or suggest the "Language" analogy for the depth issue. Let's stick to auditing the song first, then offer the "Language/Dialect" or "Software" alternative for the specific "depth" issue. Actually, the "Hologram" or "Resolution" concept fits the "pattern" idea best.
      *   *Wait, let's look at the "Running" aspect.* Hofstadter emphasizes the *loop*. A song is static until sung. A person is always running.
      *   *Better Analogy:* A **Conversation**. Or a **Game**.
      *   *Best Alternative:* **A Language.** You speak "Mum." Your brother speaks "Mum" with an accent. A neighbor speaks "Mum" with only three words. The language exists *in* the speaking.

  6.  **Drafting the Response:**
