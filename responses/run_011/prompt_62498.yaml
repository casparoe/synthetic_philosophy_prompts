          *   *Hofstadterian View:* The pattern degrades. It's not binary (gone/not gone). It's a fading signal. The "copy" is a low-fidelity simulation. It *is* still her, but dimmer.
          *   *Analogy Verdict:* The analogy actually handles this well *if* framed as fidelity loss rather than mutation.
      *   *Worry 2: Public/Scattered vs. Private/Deep.* The user wants their internal copy to be *special*, not just one fragment among many.
          *   *Analysis:* Folk songs are egalitarian. One singer isn't "more true" than another usually. But the user knows their mum better than a neighbor.
