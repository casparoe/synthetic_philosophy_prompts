  2.  **Deconstruct the Argument & Identify Vulnerabilities:**
      *   *Vulnerability 1 (Theorists):* Utility measurability. KS requires cardinal utility to measure "proportional gains." NBS only needs ordinal. If utilities aren't comparable or cardinal, KS collapses.
      *   *Vulnerability 2 (Theorists/Experimentalist):* Strategic manipulation. If I inflate my utopia point, I shift the KS solution. User says "constrained by Pareto frontier," but if the frontier is unknown or convex/concave issues arise, this is shaky.
      *   *Vulnerability 3 (Civil Proc/Skeptic):* The "Disagreement Point" assumption. Is litigation really a known probability-weighted outcome? Usually, it's highly uncertain. If $d$ is fuzzy, the whole model wobbles.
      *   *Vulnerability 4 (Mediators):* "Utopia" vs. "Opening Demand." Mediators know opening demands are often nonsense/positional. Treating them as the "best achievable outcome" is naive.
      *   *Vulnerability 5 (Philosopher):* Is/ought. Just because mediators *do* this doesn't mean they *should* (naturalistic fallacy). Also, "justifiable to parties" might just mean "coercive."
      *   *Vulnerability 6 (Experimentalist):* Empirical evidence. Do people actually gravitate to KS? The user admits literature is messy.
      *   *Vulnerability 7 (Theorists):* Monotonicity vs. IIA. Why prefer KS's monotonicity?
      *   *Vulnerability 8 (General):* Multi-issue bargaining. KS behaves weirdly when issues are linked (non-additivity).

