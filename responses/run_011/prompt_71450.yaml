          4.  Manipulation (inflating demands) is a feature, not a bug (constrained by Pareto frontier).
      *   **Constraints:** Do *not* claim KS is "fairer" in a general sense. Do *not* defend interpersonal utility comparison (IUC). Claim is narrow: justifiability to parties *in the room*.
      *   **Audience:** ~15 people. Mixed bag: Formal theorists (NTU/axiomatics), Experimental economist, Civil-proc professor (skeptic), Practicing mediators, Philosopher of social science (is/ought).
