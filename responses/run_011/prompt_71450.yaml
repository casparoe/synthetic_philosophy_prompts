      *   *Drafting Objection 1 (The Utility Trap):* Theorist will hit the cardinality/comparability issue hard. This is the biggest technical hole.
      *   *Drafting Objection 2 (The Manipulation/Game Theory):* Theorist/Experimentalist. Inflating the utopia point *does* change the outcome significantly. The "Pareto constraint" argument is weak if the frontier is flat.
      *   *Drafting Objection 3 (The Mediator Reality):* Opening demands are bluffs. Using them as the "utopia" point validates bad faith.
