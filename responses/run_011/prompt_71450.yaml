answer: |-
  Here is your prep sheet. I have been direct about the vulnerabilities as requested.

  ### Meta-Feedback: Ranking & Bluff Risks

  **1. Your Ranking vs. My Ranking**
  You likely rank the **Axiomatic/Theoretical objections** (IIA vs. Monotonicity) highest. I disagree. In a law-and-econ workshop, a theoretical preference for IIA is a matter of taste. The objections that will actually sink your paper are **descriptive and operational**.
  *   **Move Up:** The **Mediator Objection** (Opening demands are bluffs, not utopias). If your Step 2 (Utopia = Opening Demand) is descriptively false, your model doesn't map to reality, and the "honesty" claim collapses. This is more damaging than a theorist preferring Nash axioms.
  *   **Move Up:** The **Utility Scaling Objection**. You say you aren't defending interpersonal utility comparison (IUC), but KS *requires* cardinal comparability to define "proportional gains." If you can't explain how you get cardinal utility from dollar demands without IUC, the math doesn't work.

  **2. Where You Will Get Caught Bluffing**
  *   **The Manipulation Constraint (Step 4):** You argue that inflating the aspiration point is constrained because it "doesn't move the Pareto frontier." **This is mathematically shaky.** In KS, the solution is the intersection of the Pareto frontier and the line segment connecting the Disagreement Point ($d$) to the Utopia Point ($u$). If the Pareto frontier is linear (constant sum), inflating $u$ changes the slope of that line and can shift the solution *all the way* to your corner. It *does* buy unlimited gains in linear cases.
      *   *Fix:* Concede this applies primarily to **strictly convex frontiers** (where there are gains from trade to split) or specify that mediators transform linear conflicts into integrative ones. Do not claim it is constrained generally.
  *   **The "No IUC" Claim:** You cannot run KS without some normalization of utility scales. If Party A measures utility in dollars and Party B in "happiness," KS is undefined. You need a line ready for how you normalize (e.g., "we normalize 0 to disagreement and 1 to utopia for *each* party individually"), but be ready for the follow-up that this still assumes the *distance* 0-to-1 is comparable across persons.

  ---

  ### The One Question You Hope Nobody Asks
  **"How do you construct the utility functions from the dollar demands without assuming interpersonal comparability?"**

  *   **Why it hurts:** KS requires comparing the *ratio* of Party A's gain to Party A's max gain against Party B's gain to Party B's max gain. To say these ratios are "equal," you must assume that a 50% gain for A is equivalent to a 50% gain for B. Nash avoids this (ordinal utility is enough).
  *   **The Trap:** If you say "we just use dollars," you assume risk neutrality and comparable marginal utility of money. If you say "we normalize," you admit IUC.
  *   **The Escape:** "I am not claiming the *welfare* is comparable, only the *procedure*. The normalization is internal to each party's own scale of demands. The normative claim is that parties accept the *process* of equal proportional concession from their own stated maximums, not that the utility units match." (This is weak, but it's your best shield).

  ---

  ### The 8 Objections (Ranked by Damage Potential)

  #### 1. The Utility/Scaling Objection (Formal Theorist)
  *   **Voice:** "Kalai-Smorodinsky requires cardinal utility and, effectively, interpersonal comparability to define 'proportional gains.' Nash only requires ordinality. By mapping dollar demands to utility, you're smuggling in a massive assumption about risk preferences and comparability that you explicitly disavow. Without that, the KS solution is undefined."
  *   **90-Second Reply:** "You're right that the formal axiomatics require cardinality. My claim is narrower: in mediation, dollars *act* as the cardinal proxy. Parties negotiate in currency, not utils. When a mediator says 'meet me halfway,' they mean halfway on the money, not the welfare. I'm not defending KS as a welfare theorem; I'm defending it as a procedural heuristic that matches the currency of the room. The 'comparability' is institutional, not ontological."
  *   **Concede:** Yes, this doesn't work for non-monetary utility without strong assumptions.
  *   **Hold:** The model describes the *procedure*, not the underlying welfare.
  *   **Soft Spot:** If they press on risk aversion (concave utility of money), your "halfway on money" argument fails to produce "halfway on utility."

  #### 2. The Strategic Inflation Objection (Formal Theorist / Experimentalist)
  *   **Voice:** "You claim manipulation is constrained by the Pareto frontier. But on a linear frontier, inflating the utopia point shifts the KS solution to the corner. You haven't solved the incentive problem; you've just modeled the incentive to lie as a feature. That makes it a bad normative model."
  *   **90-Second Reply:** "I concede that on a linear, constant-sum frontier, KS is vulnerable to inflation. But mediation exists precisely to *create* convex frontiers—finding integrative solutions where the pie expands. In those convex contexts, inflating the utopia point yields diminishing returns. My claim is that KS models the *integrative* phase of mediation, not the distributive brawl. In that specific context, the constraint holds."
  *   **Concede:** It fails on linear/constant-sum frontiers.
  *   **Hold:** Mediation is about creating convexity (value creation).
  *   **Soft Spot:** See Meta-Feedback above. If they have a convex counter-example where inflation still pays, you're stuck.

  #### 3. The "Opening Demands are Garbage" Objection (Practicing Mediator)
  *   **Voice:** "You say the utopia point is the opening demand. In my twenty years at the table, opening demands are positional bluffs, often absurd. Using them as the 'ceiling' legitimizes bad faith. A good mediator ignores the opening demand to find the *real* ZOPA. Your model codifies the bluff."
  *   **90-Second Reply:** "I agree opening demands are often bluffs. But the 'utopia point' in KS isn't the first number spoken; it's the 'best achievable outcome' after reframing. Mediators spend day one breaking the bluff to find the *real* ceiling. My model applies to that second stage, where parties admit what they *could* get if everything went perfectly. I'm modeling the settlement conference, not the demand letter."
  *   **Concede:** Initial demands are not the KS utopia point.
  *   **Hold:** The *reframed* best-case scenario is.
  *   **Soft Spot:** If mediators say "We never quantify the best-case scenario," your Step 2 collapses.

  #### 4. The Disagreement Point Uncertainty (Civil Procedure Professor)
  *   **Voice:** "You treat the disagreement point (litigation outcome) as 'better specified than people think.' It isn't. It's highly ambiguous. If $d$ is fuzzy, the KS solution is a moving target. Basing a normative model on a variable that litigants systematically misperceive (optimism bias) is building on sand."
  *   **90-Second Reply:** "It is fuzzy, but it's the *only* anchor we have. Mediators spend half their time forcing parties to specify $d$—the 'BATNA analysis.' Whether they are right or wrong doesn't matter; the settlement is built on their *perceived* $d$. My model describes how they bargain given their perceptions, not given the true legal outcome. It's a model of subjective bargaining, not objective justice."
  *   **Concede:** $d$ is subjective and often biased.
  *   **Hold:** The model operates on *perceived* disagreement points, which is what drives settlement.
  *   **Soft Spot:** If $d$ is too fuzzy, the "proportional gain" calculation becomes meaningless noise.

  #### 5. The Is/Ought Gap (Philosopher of Social Science)
  *   **Voice:** "You argue KS is better because it's 'what mediators are already doing.' That's a naturalistic fallacy. Just because a procedure is used doesn't make it justifiable. Mediators might be using KS because it's coercive or speeds up cases, not because it's normatively superior."
  *   **90-Second Reply:** "I'm not arguing from existence to normativity. I'm arguing from *justifiability*. A normative model for settlement needs to be one the parties can accept without feeling cheated. KS offers a vocabulary ('proportional concession') that parties recognize as fair *process*, even if they dislike the outcome. Nash offers 'axioms' parties don't understand. My claim is about legitimacy in the room, not moral truth outside it."
  *   **Concede:** Usage does not equal moral correctness.
  *   **Hold:** Legitimacy/Justifiability to the participants is the relevant metric for settlement.
  *   **Soft Spot:** "Justifiability" might just mean "cognitive ease," which isn't a strong normative ground.

  #### 6. IIA vs. Monotonicity Preference (Formal Theorist)
  *   **Voice:** "You dismiss Independence of Irrelevant Alternatives (IIA) as 'hiding the ceiling.' But IIA protects against manipulation by adding dummy options. KS's Monotonicity axiom is vulnerable to the 'sandbagging' problem. Why is Monotonicity normatively superior to IIA in this context?"
  *   **90-Second Reply:** "In litigation/settlement, the 'alternatives' aren't abstract options; they are legal claims. Removing a weak claim shouldn't change the settlement on the strong claim (IIA), but in practice, it does, because it changes the leverage/aspiration. KS captures that leverage shift. IIA assumes a static context; mediation is dynamic. Monotonicity captures the reality that improving your best-case scenario *should* improve your settlement share."
  *   **Concede:** IIA has strong theoretical virtues for stability.
  *   **Hold:** Mediation is dynamic, not static. Leverage matters.
  *   **Soft Spot:** This is largely theoretical taste. Hard to "win."

  #### 7. The Empirical Messiness (Experimental Economist)
  *   **Voice:** "You lean on experiments where people gravitate to the midpoint. But the literature shows context dependence. Sometimes it's Nash, sometimes KS, sometimes egalitarian. Citing the 'midpoint' literature to support KS is cherry-picking."
  *   **90-Second Reply:** "I acknowledge the literature is mixed. I'm not claiming KS predicts all behavior. I'm claiming it predicts behavior *in mediated legal settlements* specifically, where 'splitting the difference' is the dominant cultural norm. In anonymous lab games, norms differ. In law, the 'compromise' norm is institutionalized. I'm relying on the institutional context, not just the lab data."
  *   **Concede:** General bargaining data is mixed.
  *   **Hold:** Legal settlement has specific norms (compromise) that align with KS.
  *   **Soft Spot:** If they cite a specific legal negotiation study that contradicts you, you have no backup.

  #### 8. Multi-Issue Non-Additivity (Formal Theorist)
  *   **Voice:** "Real settlements involve multiple issues (money, injunctions, apologies). KS is not additive across sub-games. Solving KS on the aggregate isn't the same as solving on each issue. How does your model handle linked issues?"
  *   **90-Second Reply:** "That's a feature, not a bug. Mediators explicitly link issues to create trade-offs ('logrolling'). If the solution were additive, there would be no need for a mediator to package the deal. KS captures the non-linearity of multi-issue deals better than Nash precisely because it forces a global view of the 'utopia' across all issues, not issue-by-issue."
  *   **Concede:** KS is computationally complex with multiple issues.
  *   **Hold:** Mediation is about packaging, which KS models better than issue-by-issue Nash.
  *   **Soft Spot:** Technically, KS can be inconsistent under aggregation. Don't let them drag you into the math weeds.

  ---

  ### Final Advice for the Room

  1.  **Own the Narrowness:** When the theorists attack the utility assumptions, repeat: "I am not proposing a new welfare theorem. I am proposing a descriptive model of the *rhetoric* of settlement."
  2.  **The Mediators are your Allies:** If the theorists get too abstract, pivot to the mediators. "Does this match what you see in the break-out rooms?" If the mediators nod, the theorists' objections become "theoretically sound but practically irrelevant."
  3.  **The Bluff Check:** If anyone asks about the **linear frontier/manipulation** issue, do not double down. Say: "That is a known limitation of KS in constant-sum games, which is why I specify this applies to the integrative phase where frontiers are convex." If you try to defend it for constant-sum, you will lose.

  Good luck. You have a strong descriptive hook; don't let them force you into a purely normative defense.
