      *   *Drafting Objection 6 (The Empirical Claim):* Experimentalist. The "midpoint" literature is weak. KS $\neq$ Midpoint usually.
      *   *Drafting Objection 7 (Axiomatic Preference):* Theorist. Why Monotonicity over IIA? IIA protects against irrelevant alternatives.
      *   *Drafting Objection 8 (Complex Deals):* Theorist/Practitioner. What happens with multiple issues? KS isn't additive.

  4.  **Developing Replies & Strategy:**
      *   *Constraint:* 90 seconds. Keep it punchy.
      *   *Strategy:* Concede the technical limitation, pivot to the *procedural* justification. The argument isn't that KS is mathematically superior in a vacuum, but that it maps to the *process* of mediation.
      *   *Non-negotiable:* The claim that KS models the *process* better than NBS, even if utilities are messy.
      *   *Concession:* Utilities are hard to measure. Litigation outcomes are uncertain.

  5.  **Ranking by Damage:**
      *   *Highest Damage:* Utility Comparability (kills the math).
      *   *High Damage:* Manipulation/Strategic Inflation (kills the incentive compatibility).
      *   *Medium-High:* Mediator Reality (kills the descriptive accuracy).
      *   *Medium:* Disagreement Point fuzziness.
      *   *Lower:* Axiomatic preferences (IIA vs. Monotonicity) - this is theoretical taste.
      *   *Lowest:* Empirical messiness (user already admitted this).

  6.  **The "One Question":**
      *   User guessed utility units or non-additivity.
      *   *Refinement:* It's the **Unit Invariance/Scaling** problem. KS is *not* invariant to affine transformations of utility if you don't normalize properly, but more importantly, *how* do you normalize without interpersonal comparison? If I measure my utility in dollars and you measure in "happiness units," KS breaks. NBS avoids this. This is the "Killing Blow."

  7.  **Meta-Feedback (The "Straight Talk"):**
      *   *Ranking Check:* I think the User might underestimate the "Mediator Reality" objection. If mediators say "Opening demands are trash," the core premise (Step 2) collapses. I should advise moving that up.
      *   *Bluff Check:* The "Pareto constraint limits manipulation" argument is technically weak. If the frontier is linear, inflating the utopia point shifts the KS solution all the way to the corner. I need to flag this.

  8.  **Final Polish:**
      *   Ensure tone is professional, direct, and workshop-appropriate.
      *   Check against the "8 objections" count.
      *   Ensure the "90-second reply" constraint is respected (word count roughly 150-200 words per reply).
      *   Make sure the voices distinguish themselves (Theorist vs. Mediator).

  *(Self-Correction during drafting)*: Wait, KS *is* invariant to affine transformations *if* the utopia point is defined relative to the disagreement point in utility space. But the problem is *constructing* that utility space from observable demands. The objection should focus on the mapping from "Demand \$1M" to "Utility 1." That's where the interpersonal comparison sneaks in. I need to make sure the reply acknowledges this without ceding the normative point.

