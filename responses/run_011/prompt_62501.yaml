answer: |-
  The schema view posits a stable, style-neutral structural core for each letter, with style as a variable overlay. This is an intuitive model for a type designer, where skeletons and stress axes often feel like the "truth" beneath the flesh of serifs and contrast. However, the claim that this core fixes identity conditions independently of style faces significant pressure from four directions. Below is the map of exposure you requested, assessing the damage and the viability of absorption strategies.

  ### (i) The Empirical Territory
  **The Defeater:** Human letter recognition is robust to structural violations that your schema view defines as identity-breaking. Readers identify letters where connectivity is broken, segments are missing, or proportions are violated beyond your "relational constraints." Conversely, readers sometimes fail to identify a letter that satisfies all structural constraints but is placed in a context where it violates expectational norms (e.g., a perfectly formed 'a' in a string of Cyrillic).
  **Damage:** **Absorbable.** A committed schema theorist can concede that the *perceptual* matching process is fuzzy while maintaining that the *canonical* core exists. You can refine the core to be probabilistic or weighted rather than binary.
  **The Emptiness Worry:** If the core becomes a set of weighted features rather than a strict specification, it ceases to be a boundary condition and becomes a description of central tendency. It still says something (it predicts which forms are "better" examples of the letter), but it loses the power to definitively rule out edge cases. This is legitimate for a cultural artefact, but it surrenders the claim that the core fixes identity *once and for all*.

  ### (ii) The Internal Typographic and Paleographic Territory
  **The Defeater:** The existence of dual forms for specific lowercase letters that share no obvious stroke configuration. You cited this as your most troubling case. The standard candidates are lowercase 'a' (double-story vs. single-story) and lowercase 'g' (looped vs. opentail).
  *   **Double-story 'a':** Closed counter, vertical stem, arch.
  *   **Single-story 'ɑ':** Closed counter, curved back, no vertical stem (or a different vertical alignment).
  *   **Double-story 'g':** Two closed counters, vertical connectivity.
  *   **Single-story 'ɡ':** One closed counter, open descender.
  If you define the core by parts and connectivity, these pairs do not share a core. They are topologically distinct (different genus of curves and junctions).
  **Damage:** **Serious.** This is the strongest internal evidence against a single structural specification.
  **The Reply:** You can abstract the core to "topological invariants" (e.g., 'a' must have one closed counter and a vertical distinction; 'g' must have a descender region).
  **Is the Reply Real?** It is real, but it requires abandoning the "parts and connectivity" definition for a "topological role" definition. If you push further—say, to a script where 'a' is written as a simple circle—it forces the core to become purely functional (a slot in the alphabet). If you stop at topology, the schema view survives but is weakened: the core is no longer a drawing instruction, but a constraint on genus. This is not a redefinition that empties the theory, provided you accept topology as structure.

  ### (iii) The Modelling Territory
  **The Defeater:** The Letter Spirit gridfont project demonstrates that stylistic coherence can be generated by propagating analogies from seed letters without consulting an explicit structural specification. The system produces recognizable letters by ensuring they "feel" like they belong to the same family as the seeds, not by checking them against a rulebook of parts.
  **Damage:** **Awkward.** This suggests that specifications are *ex post facto* descriptions rather than generative mechanisms. If coherence emerges from style rather than constraining style via core, the priority of the core is reversed.
  **The Reply:** The schema theorist can argue that the analogy engine implicitly relies on the cores of the seed letters to propagate style. The core is the anchor that allows the analogy to hold.
  **Honest Assessment:** This is weak. If the system works without explicit core representations, the explanatory work is being done by the analogy mechanism, not the specification. The core becomes a phantom limb—useful for talking about the result, but not involved in the cause. This does not falsify the existence of cores, but it undermines their explanatory necessity.

  ### (iv) The Purely Conceptual Territory
  **The Defeater:** The Functional Slot argument. Letter identity is fixed by the letter's role in the alphabet system, not by its shape. Shape is contingently attached to this role. If a community agreed to swap the shapes of 'h' and 'n' systematically, they would still be 'h' and 'n'.
  **Damage:** **Fatal.** If identity is functional, the structural core is secondary. The schema view claims the core fixes identity; the functional view claims the system fixes identity and the core is just a common way of filling the slot.
  **The Reply:** The schema theorist must argue that while function fixes reference, *shape* fixes legibility and category membership for the reader. You can concede the philosophical point (letters are symbols) while maintaining the psychological point (readers recognize them by shape).
  **The Emptiness Worry:** If you accept this reply, the schema view collapses into a theory of *recognitional cues* rather than *identity conditions*. It becomes a claim about how humans process symbols, not what the symbols *are*. This is a significant retreat. It means the "core" is not ontological but cognitive. For a type designer, this might be sufficient (you care about what readers see), but for a theory of letter identity, it is a collapse into the rival view.

  ### The Specific Case: No Shared Stroke Configuration
  You asked whether a lowercase letter with two widely accepted forms sharing no stroke configuration is decisive.
  **Verdict on Case:** It is **decisive against a strict structural core**, but not against a topological one.
  If the two forms share *no* strokes (no vertical, no curve, no junction type), you cannot define a core via parts. You must define it via *function* (this shape fills the 'a' slot) or *topology* (this shape encloses a counter in this region).
  If you choose Function, the schema view collapses into the rival view (Conceptual Defeater).
  If you choose Topology, the schema view survives, but you must admit that "structure" includes abstract spatial relationships that may not map to specific strokes.
  **Is this a redefinition?** Yes. Is it fatal? No, provided you accept topology as structure. However, if the variation extends to forms that differ topologically (e.g., an 'a' with no counter), you are forced into the Functional view, which is fatal to the schema view's claim that *shape* determines identity.

  ### The Emptiness Worry
  You asked: *If every counterexample can be met by making the core more abstract or more disjunctive, is that fatal for a view of this kind, or entirely legitimate given that its subject matter is a cultural artefact rather than a natural kind?*

  **Honest Answer:** It is legitimate for a cultural artefact, but it renders the theory trivial if pushed too far. If the core becomes "whatever shape the community accepts as this letter," the theory says nothing. If the core becomes "a cluster of family-resembling features," the theory is robust but loses its predictive power (it cannot tell you what *new* form would be acceptable, only describe existing ones).
  The schema view is defensible only if it maintains that there are *constraints* on the variation, not just a history of usage. If you can refine the core to "topological constraints + functional role" without making it purely disjunctive, the view remains substantive. If you must make it purely disjunctive to accommodate every historical variant, the view is empty.

  ### RANKED DEFEATERS

  | ID | Defeater Description | Severity |
  | :--- | :--- | :--- |
  | D1 | Functional Slot Theory (Identity is role, not shape) | fatal |
  | D2 | Dual Forms with Distinct Topology (e.g., single vs double-story) | serious |
  | D3 | Style Determining Structure (e.g., blackletter 's' vs 'f') | serious |
  | D4 | Generation via Analogy without Specification (Gridfont results) | awkward |
  | D5 | Recognition of Degraded/Violated Structures (Empirical robustness) | absorbable |

  Verdict: seriously exposed but defensible
