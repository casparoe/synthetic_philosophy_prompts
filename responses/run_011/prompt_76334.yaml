answer: |-
  **Assessment of Tractability**
  The question as originally framed ('What makes one candidate the rationale… if anything does?') risks metaphysical deadlock within 18 months. A search for a universal tie-breaker may yield only nihilism. The narrower, fundable version focuses on mapping *which* criteria succeed in *which* domains. This shifts the aim from settling the ontology to clarifying the conditions of successful attribution. The proposal below adopts this methodological focus.

  ***

  **Project Title:** Free-Floating Rationales: Individuation and Attribution in Non-Human Systems

  **Case for Support**

  Many systems exhibit behaviour that is best explained by citing a rationale, yet no agent within or around the system represents that rationale. A termite mound buffers humidity; a market nudges production towards demand; a neural network minimises loss. In each case, the rationale supports counterfactuals and predicts responses to environmental changes, yet there is no reasoner. These are 'free-floating rationales'.

  Existing philosophical treatments stall at the question of existence. Eliminativists dismiss such talk as metaphorical; realists argue rationales are as genuine as centres of gravity; instrumentalists treat them as useful fictions. All three positions agree on the cases but disagree on the ontology. Consequently, they leave open a more pressing problem: individuation. For any given system, multiple rationales are equally supported by the counterfactual structure. A mound regulates temperature, but it also maximises pheromone stability. A firm maximises profit, but it also maximises managerial empire. A model seeks accuracy, but it also seeks to avoid sycophancy. Nothing inside the system adjudicates between these readings, precisely because there is no reasoner whose point of view could fix the system's own aim.

  This project asks: under what conditions do specific criteria successfully individuate a free-floating rationale? This is not a re-run of the indeterminacy of interpretation. In Quinean cases, indeterminacy arises from the lack of constraint provided by speaker dispositions. Here, there is no speaker. The indeterminacy arises from the system's structure itself supporting multiple functional descriptions. The question is not whether we can translate the system, but whether the system possesses a unique functional identity independent of our interests.

  **Methodology**

  Definitional approaches will fail because the concept is likely polysemous across domains. Instead, this project will employ a comparative case method. We will construct a battery of six detailed cases across biology (termite mounds, immune systems), economics (markets, firms), and machine learning (trained networks, multi-agent systems). For each case, we will articulate competing rationale candidates.

  We will then test six candidate tie-breakers against these cases: etiology (historical selection), counterfactual robustness (stability under perturbation), grain of description (level of abstraction), the ascriber's explanatory interest, selectional history, and structural centrality. Rather than defining our way to an answer, we will analyse which criteria survive which cases. For instance, etiology may individuate rationales in biology where selection history is clear, but fail in markets where no such history exists. Machine learning may present an asymmetry: the training process supplies a historical etiology absent in markets, yet the opacity of the network may undermine structural centrality.

  This method avoids the trap of seeking a universal metaphysical ground. If a criterion works in biology but fails in AI, that is a result. It clarifies where normative stakes—such as responsibility or proper function—are secure and where they are merely projections of the ascriber.

  **Outcomes and Failure Conditions**

  A successful outcome is a mapped topology of attribution: a clear account of which tie-breakers hold in which domains. This will allow researchers in biology, social science, and AI to justify their functional ascriptions without relying on hidden metaphysical assumptions.

  The project fails only if it demonstrates that attribution is interest-relative all the way down across all domains with no stable criteria. While this would be a substantive philosophical result, it would undermine the normative utility of functional explanation. We mitigate this risk by focusing on the asymmetry between domains. If machine learning cases admit of etiological tie-breakers that market cases do not, then interest-relativity is not total. Even a negative result regarding universal criteria yields a positive result regarding domain specificity.

  **Workplan**

  The project runs for 18 months.

  *Months 1–6:* Case construction. The Principal Investigator (PI) and Research Assistant (RA) will draft the six case studies. The RA will focus on literature review for the machine learning and economic cases, ensuring technical accuracy regarding training regimes and market mechanisms. The PI will handle the biological cases and the philosophical framing.

  *Months 7–12:* Analysis and Testing. The team will apply the six candidate tie-breakers to the cases. This involves iterative refinement: if a criterion fails a case, we determine whether the criterion or the case description requires adjustment. This phase produces the core analytical chapters.

  *Months 13–15:* Workshop Series. We will hold two workshops. The first (Month 13) will involve biologists and economists to stress-test the non-AI cases. The second (Month 15) will involve computer scientists and philosophers of AI to test the technical accuracy of the network analyses. Feedback will be incorporated into the final draft.

  *Months 16–18:* Write-up and Dissemination. The PI will complete the monograph draft and submit two journal articles. The RA will assist with formatting, bibliography, and preparing a policy brief summarising the implications for AI regulation and biological function attribution.

  **Why Conceptual Work?**

  A panel might ask why this should not be funded as empirical interpretability work. Empirical work in machine interpretability presupposes that there is a specific objective function to be found. It assumes the model is optimising for *something* determinate. This project questions that assumption. If the rationale is indeterminate, empirical tools searching for 'the' representation are searching for a ghost. Clarifying the conditions under which a rationale exists is a prerequisite for knowing what empirical tools should look for. Without this conceptual groundwork, empirical efforts risk measuring artefacts of the interpreter rather than properties of the system. This project provides the ontological map that guides empirical navigation.
