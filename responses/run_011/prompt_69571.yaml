  Last month I went to a county fair with two friends, Deniz and Cora, and we stopped at a booth running a bag-and-token game. The operator had a canvas bag holding 90 tokens: 30 red, he told us, and the remaining 60 either black or gold, in a split he said he had decided himself that morning and was not going to reveal. In front of the crowd he drew one token out and put it face down under a cup. For $20 you could buy any one of four tickets, each paying $100 if the token under the cup matched: red; black; black-or-gold; red-or-gold. Deniz played twice, in two separate rounds with a fresh draw and a fresh cup each time. In the first round she was offered red against black and took red. In the second round she was offered black-or-gold against red-or-gold and took black-or-gold. She lost both times, which I don't think bears on the argument, but I mention it because Cora brought it up twice.

  At dinner Cora said the two choices cannot be defended together, and Deniz said they could, and it went like this. (1) Cora's opening: in each pair Deniz took the ticket whose odds were fixed and turned down the one whose odds were not — red is 30 in 90 no matter how the operator split the remainder, and black-or-gold is 60 in 90 no matter how he split it, whereas the other two tickets depend entirely on a number nobody was given. So Deniz was not estimating anything at all; she was simply refusing to buy a ticket she could not price. (2) Deniz agreed with the description and denied the criticism. The operator filled the bag himself and knows what is under the cup, and a man running a $20-a-ticket booth is not filling it fairly. The black count is not a fact of nature that one is merely ignorant of; it is a choice made by someone who profits when the mark guesses wrong. Buying red is buying on a number he published before you walked up; buying black is buying on a number he selected and is withholding. She said she would not bet against the house on the house's own hidden variable. (3) Cora said that if this really was Deniz's belief, it was a belief with consequences she had not followed out: suppose the operator stacked the bag against black, so there are fewer than 30 black tokens; then there are more than 30 gold ones, so red-or-gold wins in more than 60 of the 90 cases, which is better than the black-or-gold ticket Deniz actually bought. The story that justifies the first choice requires the opposite of the second. Either the split is a fact Deniz has a view about, in which case her two picks contradict each other, or it is not, in which case the first pick was not the shrewd anti-house play she was describing. (4) Deniz conceded the point but said it proved too much. She has no view about the split and is not going to invent one to keep Cora's books balanced; in each pair she took the ticket whose odds were announced and left the one whose odds were withheld