answer: |-
  **Adjudication of the Exchange**

  **Round 1**
  *Hanne:* A rule yielding odious verdicts in distinguishing cases is refuted, not vindicated.
  *Rating:* **Partly Right.**
  *Justification:* Hanne correctly identifies that a theory which violates deep-seated moral intuitions in extreme cases bears a heavy burden of proof. However, she is mistaken to claim this constitutes a logical refutation. Intuitions are data points, not axioms; a theory can be correct even if it contradicts common sense (as many scientific theories do). Her claim that it is "not a rule about what to do at all" is rhetorical hyperbole; it is a rule, merely one she finds unacceptable.

  **Round 2**
  *Owen:* Expected-value (EV) maximisation is the only non-exploitable rule; intuitions are maladapted to extreme probabilities.
  *Rating:* **Partly Right.**
  *Justification:* Owen is clearly right that EV maximisation is uniquely immune to Dutch-book arguments (money pumps) in prudential contexts. This is a robust technical point. However, he is partly mistaken to assume this transfers seamlessly to moral contexts without further argument. His claim about intuition calibration is plausible but speculative; it explains *why* we feel discomfort, but does not prove the discomfort is unjustified.

  **Round 3**
  *Hanne:* The verdict turns on the eleventh significant figure of an unknowable estimate; the rule sacrifices identifiable people for hypothetical ones; it is unusable for humans.
  *Rating:* **Partly Right.**
  *Justification:* Hanne is clearly right on the epistemic point: when probabilities are this small, uncertainty about the probability estimate itself swamps the calculation. This is a fatal practical objection. She is partly right on the "identifiable vs. hypothetical" distinction, which is a recognised moral phenomenon, though not a decision-theoretic one. Her claim that unusability disproves the rule is mistaken; a true rule might be hard to apply (e.g., precise physics), though in ethics, 'ought' implies 'can' carries more weight.

  **Round 4**
  *Owen:* Uncertainty is handled by integrating over credences; bounded utility per person does not stop astronomical populations from swamping certain gains; non-EV rules fail dynamically.
  *Rating:* **Partly Right.**
  *Justification:* Owen is clearly right that Bayesianism handles uncertainty by treating probabilities as distributions; the calculation remains defined even if difficult. He is clearly right that standard bounded utility (capping value per life) does not prevent the *sum* from becoming infinite or astronomical if the population is unbounded. He is partly right on dynamic failure; while non-EV rules often suffer dynamic inconsistency, some can be patched, though at a cost to simplicity.

  **Round 5**
  *Hanne:* Dynamic consistency is not required (one can decide afresh); there is no single purse in morality, so Dutch-book objections do not apply to third-party stakes.
  *Rating:* **Clearly Mistaken (on the purse); Partly Right (on consistency).**
  *Justification:* Hanne is partly right that an agent may choose to re-evaluate plans, though this invites inefficiency. However, she is clearly mistaken regarding the "single purse". Even in moral cases, the agent's choices determine the outcome. If an agent's preferences are intransitive or inconsistent, they can be manipulated into producing worse outcomes for the third parties they aim to help, even if the agent's own wallet is not pumped. Coherence matters for efficacy, not just self-protection.

  **Round 6**
  *Owen:* Without coherence, refusals are arbitrary; vague thresholds make obligation vague, which is worse than fanaticism.
  *Rating:* **Partly Right.**
  *Justification:* Owen is right that arbitrariness is a theoretical vice. However, his claim that vagueness in obligation is *worse* than fanaticism is a value judgment, not a logical proof. Many ethical concepts (e.g., 'heap', 'bald', 'harm') are vague; insisting on precision where the subject matter resists it is a category error.

  **Round 7**
  *Hanne:* Vagueness reflects reality; Owen's theory is self-undermining (too hard to calculate). *Owen:* This is a standard two-level theory.
  *Rating:* **Partly Right (both).**
  *Justification:* Hanne is right that demanding mathematical precision in ethics may be misplaced. Her claim that the theory is self-undermining is strong if the calculation costs exceed the benefits. Owen is right that a two-level structure (ideal theory vs. practical heuristics) is a standard and coherent defence, though it concedes that the rule cannot be directly followed in practice.

  ***

  **Addressing the Pivot Questions**

  **1. Sensitivity to the eleventh significant figure: Rule or Evidence?**
  This counts against the **application of the rule**, not the rule itself in the abstract. A decision rule is a function mapping inputs (credences, utilities) to outputs (actions). If the inputs are unknowable, the output is inert. Owen is technically correct that the *mathematics* remains defined; Hanne is practically correct that the *decision* cannot be made. In a domain like ethics, where action is the goal, a rule that requires impossible precision is functionally broken. Hanne wins this point on pragmatic grounds: a map that requires coordinates finer than any instrument can measure is not a useful map, regardless of its cartographic accuracy.

  **2. The "Single Purse" objection: Does it defeat the coherence objection?**
  Hanne **concedes far too much**. The Dutch-book argument demonstrates that inconsistent preferences lead to sure losses *relative to the agent's own goals*. If the agent's goal is to save lives, incoherent choices can lead to fewer lives saved, even if the agent's own money is not at stake. Imagine an agent who prefers Policy A to B, B to C, and C to A. A manipulator could cycle the agent through these policies, consuming resources (time, political capital, attention) at each step, leaving the world worse off than if the agent had stuck to one. Coherence is required for *efficacy*, not merely for financial self-preservation. Therefore, the lack of a "single purse" does not immunise moral agents from the requirement for consistency.

  **3. Does a bounded utility function block Owen's conclusion?**
  Owen is **correct** that the standard notion of bounded utility does not block his conclusion. Typically, "bounded utility" means there is a maximum amount of good a single life can contain. However, if one sums these bounded values across an astronomical population, the total can still exceed the value of a certain, small number of lives. To block the conclusion, one requires a **globally bounded utility function**, where there is a cap on the total value of *any* state of affairs, regardless of population size. Owen correctly identifies that merely bounding the value per person is insufficient to stop the aggregation from swamping the certain loss. Hanne's intuition that the trade-off is wrong requires this stronger, global boundedness, which Owen did not address.

  ***

  **Overall Verdict**

  **Which of the two is more right overall?**
  **Hanne** is more right, though Owen wins on technical consistency.
  Owen successfully defends Expected Value (EV) maximisation as the only coherent *formal* system for prudential rationality. However, this debate concerns *ethics*, not gambling. Hanne correctly identifies that when probabilities become epistemically inaccessible (the "eleventh significant figure"), the formalism detaches from reality. A decision theory that cannot be implemented because its inputs are unknowable is, for human agents, no theory at all. Furthermore, Owen's reliance on coherence assumes that the agent's preferences are the sole source of normativity. Hanne rightly hints that there are external moral constraints (the distinction between certain and conjectural lives) that coherence alone cannot capture. Owen wins the battle of logic; Hanne wins the war of applicability.

  **What are both of them missing?**
  You were not talking nonsense. Once utility is bounded (specifically, *globally* bounded), the mathematical drive towards fanaticism disappears. If there is a maximum possible value for the entire universe, then no probability, however small, multiplied by that value, can necessarily outweigh a certain significant good.

  Therefore, they are not disagreeing about **decision theory** (how to choose given values and probabilities); they are disagreeing about **axiology** (what is valuable and how it aggregates).
  *   Owen assumes a **Totalist** axiology: the value of a world is the sum of the welfare of the people in it. This allows the population size to drive the expected value to infinity.
  *   Hanne assumes (implicitly) an axiology where value does not aggregate linearly across vast populations, or where the certainty of existence carries a lexical priority.

  If they agreed on a globally bounded axiology, Owen's EV maximisation would no longer yield "fanatical" results, and Hanne's objections would lose their force. The dispute appears to be about the machinery of choice, but it is actually about the structure of the Good. They are trying to solve a moral problem with a mathematical tool, when the fault lies in the moral premises fed into the tool.
