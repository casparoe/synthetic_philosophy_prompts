      *   *The "Rule Book" point:* The user thinks a rule book implies an external agent. I need to emphasize that in the Careenium, the "rules" are encoded in the *geometry and dynamics* of the symms themselves. The "book" is the table.
      *   *Kim's Exclusion Argument:* I should mention this. The user is essentially raising a version of the Exclusion Argument. Hofstadter's response would be to deny the premise that high-level causes compete with low-level causes. They are the *same* cause.

