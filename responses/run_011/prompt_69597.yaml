prompt: |-
  So, context: I'm a software engineer, I build clinical monitoring stuff, zero philosophy training. I hold the "lay member with technical expertise" seat on our hospital's organ donation committee, and next month they've given me 20 minutes plus Q&A to pitch something that I suspect is going to go badly.

  The pitch: our controlled-DCD circulatory death determinations are, from where I sit, a stopwatch, a nurse eyeballing a monitor, and no audit trail. I want to instrument it. Concretely what I'm proposing:

  1. Fuse three independent signals — arterial line waveform, pulse-ox pleth waveform, and a continuous EEG — all three flat, with artifact rejection, before the clock even starts.
  2. Run the hands-off window as a hard interlock timer that can't be paused or overridden from the console. (Five minutes is what I've been told we do, though I've seen two mentioned somewhere — correct me if I've got the practice wrong.)
  3. Log everything, including the withdrawal-of-support order and the team's do-not-resuscitate commitment, as a timestamped field in the record.
  4. The part that's going to start a fight: I want to say out loud in the talk that the criterion we're actually applying is permanent cessation, not irreversible cessation. The patient is dead because circulation stopped and nobody is going to restart it — and "irreversible" read literally is false every time a code succeeds on somebody down the hall. My argument is that naming this makes the determination more defensible, not less, because right now we're leaning on a decision the team made and presenting it as a fact about the body. Better to own the decision and record it than to hide it in a word.

  The room is about ten people and they are not one audience. Two transplant surgeons who basically only care about warm ischemia time and will hate anything that adds minutes. An ICU intensivist who does most of our withdrawals and will hear "a machine declares people dead." A neurologist who does our brain death exams and has very strong feelings about ancillary testing. An OPO nurse coordinator whose whole job is the family conversation. Hospital risk counsel, who is thinking about the statute. And one bioethicist — the only person in the room who's actually read the literature on this — who I strongly suspect thinks the dead donor rule is a convenient fiction. He'll be polite about it in front of the surgeons but he will absolutely take a shot at it.

  I want the prep sheet, not a defense of my idea. So: the six to eight objections this specific room will actually raise, roughly in the order they'll come, phrased the way each of those people would phrase them — the surgeons and the intensivist are not going to use the bioethicist's vocabulary, so don't write all eight in his voice. For each: how much damage it does, a reply I can deliver in under a minute of airtime, and a note on where my reply is soft, because I'd much rather find that out now than in the room. Then tell me what to concede in the first two minutes so I'm not spending the whole Q&A defending it, and which single reply has to land for this proposal to survive the meeting at all. And give me the question I'm praying nobody asks — the one that makes me wish I'd brought a different slide.

  One more thing, and it matters more than it sounds: please separate what's settled from what's genuinely contested among people who work on this. I honestly can't tell which parts of my framing are consensus and which parts are one camp's position that I picked up from reading around. Don't let me stand up and assert something disputed like everybody agrees — flag where the clinicians and the philosophers just disagree with each other, flag where I've got current practice wrong, and if any of my four points is something reasonable people on this committee would consider already-settled-and-uncontroversial, tell me which one, because I've assumed it's none of them.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** Software engineer, clinical monitoring background, zero philosophy training.
      *   **Role:** "Lay member with technical expertise" on a hospital organ donation committee.
      *   **Task:** 20-minute pitch + Q&A to instrument Controlled Donation after Circulatory Death (cDCD) determination.
      *   **Current State:** Suspects the process is manual ("stopwatch, nurse eyeballing"), lacks audit trail.
      *   **Proposal:**
          1.  Fuse 3 signals (Art line, Pleth, EEG) for flatline + artifact rejection.
          2.  Hard interlock timer (5 mins hands-off).
          3.  Comprehensive logging (WOS order, DNR commitment).
          4.  **Crucial Point:** Explicitly state the criterion is *permanent* cessation, not *irreversible* cessation (philosophical/semantic shift).
      *   **Audience (10 people):**
          *   2 Transplant Surgeons (care about warm ischemia time, hate delays).
          *   1 ICU Intensivist (does withdrawals, hates "machine declares dead").
          *   1 Neurologist (brain death exams, strong feelings on ancillary testing).
          *   1 OPO Nurse Coordinator (family conversations, optics).
          *   1 Hospital Risk Counsel (statutes, liability).
          *   1 Bioethicist (knows the literature, skeptical of Dead Donor Rule).
      *   **Request:** Prep sheet with 6-8 specific objections (voiced by specific roles), damage assessment, 1-min reply, soft spots, concessions to make early, the *one* reply that must land, the "prayer" question (what to avoid), and a fact-check on settled vs. contested claims.

  2.  **Deconstruct the Proposal & Identify Friction Points:**
      *   *Signal Fusion (Art/Pleth/EEG):* Neurologist might object to EEG in cDCD (usually not required). Intensivist might object to complexity during withdrawal. Surgeons might worry about setup time.
      *   *Hard Interlock Timer:* Surgeons will hate this (rigidity). Intensivist might feel it undermines clinical judgment. Risk Counsel might worry about "machine overriding human."
      *   *Logging:* Risk Counsel likes this (audit trail). OPO might worry about discoverability in lawsuits.
      *   *Permanent vs. Irreversible:* This is the philosophical bomb. Bioethicist knows the debate. Risk Counsel cares about legal statutes (which often say "irreversible"). Surgeons just want organs. Intensivist cares about medical accuracy.

  3.  **Drafting the Objections (Role-Playing):**
      *   *Surgeon:* "You're adding minutes. Warm ischemia kills grafts."
      *   *Intensivist:* "I declare death, not an algorithm. You're removing my agency."
      *   *Neurologist:* "EEG is unnecessary for cDCD. You're conflating circulatory and neurologic criteria."
      *   *OPO Coordinator:* "If this goes to court, that log shows we waited exactly 5:01. If we waited 4:59 once, we're liable. Also, families don't understand 'permanent'."
      *   *Risk Counsel:* "State law says 'irreversible.' You want to admit it's 'permanent.' That's admitting we *could* restart it but chose not to. That sounds like homicide/legal risk."
      *   *Bioethicist:* "You're exposing the fiction of the Dead Donor Rule. If you admit it's a decision, does the donor consent still hold?"

  4.  **Fact-Checking "Settled vs. Contested":**
      *   *Permanent vs. Irreversible:* This is the big one. The 2006 IOM report and subsequent guidelines acknowledge this distinction, but legal statutes often lag. It is *contested* philosophically and legally risky, though clinically accepted as "hands-off for 5 mins."
      *   *EEG in cDCD:* Generally *not* standard. cDCD is circulatory, not neurologic. Adding EEG is an *upgrade* beyond standard of care, which could be seen as gold-plating or confusing the criteria.
      *   *5 Minutes:* This is the consensus standard (IOM 2006), though some protocols say 2-5. 5 is the safe bet.
      *   *Audit Trail:* Generally good, but discoverability is the risk.
      *   *Automation:* "Hard interlock" is controversial. Clinical judgment usually trumps timers.

  5.  **Developing the Strategy:**
      *   *Concessions:* Admit EEG might be overkill (save the fight for the timer/logging). Admit "Permanent" is a philosophical framing, not necessarily changing the legal wording yet.
      *   *The One Reply:* The safety/integrity argument. "We protect the dead donor rule by making the process transparent, not by hiding the decision."
      *   *The Prayer Question:* "If you admit circulation *could* be restored, are you killing the patient for their organs?" (The causation/intent trap).

  6.  **Refining the Output (Iterative Polishing):**
      *   *Tone:* Professional, direct, technically precise but clinically aware.
      *   *Structure:* Follow the user's specific headers (Objections, Concessions, The One Reply, The Prayer Question, Settled vs. Contested).
      *   *Voice:* Ensure the Surgeon sounds like a Surgeon (time = tissue), the Lawyer sounds like a Lawyer (liability), etc.

      *(Self-Correction during drafting)*: I initially thought about telling him to drop the "Permanent" argument. But he specifically wants to pitch it. I need to warn him it's the highest risk. I need to make sure he knows the legal statute usually says "irreversible."
      *(Self-Correction on EEG)*: In cDCD, EEG is rarely used. It's usually just pulse/pressure. Suggesting EEG might make him look like he's confusing cDCD with Brain Death (DBD). I need to flag this as a vulnerability.
      *(Self-Correction on Timer)*: A "hard interlock" is dangerous. What if the monitor glitches? You can't *force* a clinical declaration. It needs to be a "gate" not a "declarer."

  7.  **Final Review against Constraints:**
      *   6-8 objections? Yes.
      *   Voiced by specific roles? Yes.
      *   Damage/Reply/Soft Spot for each? Yes.
      *   Concessions in first 2 mins? Yes.
      *   Single reply that must land? Yes.
      *   Prayer question? Yes.
      *   Settled vs. Contested section? Yes.

  8.  **Final Polish:** Check the "Permanent vs. Irreversible" distinction. This is the core philosophical lift. The IOM 2006 report "Non-Heart-Beating Organ Transplantation" explicitly discusses this. It is the intellectual heart of modern cDCD, but legally fraught. I need to make sure he knows he's walking a tightrope between clinical honesty and legal liability.

      *Wait, one nuance:* The user said "Lay member." He needs to be careful not to dictate clinical practice. The pitch needs to be "Here is data to support *your* decision," not "The machine decides." I will weave this into the replies.

      *Let's build the response.*
answer: |-
  This is a high-stakes room. You are proposing to replace clinical judgment with engineered certainty, and you are proposing to speak aloud a philosophical distinction that the law often obscures. Your technical solution is sound; your political strategy needs to be survival-grade.

  Here is your prep sheet.

  ### Part 1: The Objections (6-8)
  *Ordered by likelihood and sequence. Voices are distinct.*

  **1. The Surgeon (Warm Ischemia)**
  *   **Objection:** "Every minute of warm ischemia destroys graft viability. If your artifact rejection algorithm adds 30 seconds of noise filtering, or your hard interlock prevents us from moving the moment the family says 'go,' you are throwing away kidneys. We can't trade data integrity for organ function."
  *   **Damage:** High. This is their primary metric.
  *   **Reply:** "The 5-minute wait is already the bottleneck. My system doesn't add time; it guarantees the time we *already* wait is defensible. Artifact rejection happens in milliseconds. The delay isn't the tech; it's the uncertainty. This removes the uncertainty."
  *   **Soft Spot:** If your artifact rejection requires a "settling period" before the timer starts, you lose. Ensure your signal processing is near-real-time.

  **2. The Intensivist (Clinical Agency)**
  *   **Objection:** "I declare death. A machine does not declare death. If you put a hard interlock on the console, you are telling me I cannot use my clinical judgment if the monitor glitches or the line dampens. I will not sign off on a death certificate generated by a logic gate."
  *   **Damage:** Critical. If the person who signs the death certificate opposes this, it dies.
  *   **Reply:** "I am not proposing the machine declares death. I am proposing the machine provides an immutable audit trail of the physiological criteria *you* use to declare death. The interlock isn't a declaration; it's a safety rail to ensure the 'hands-off' period is actually hands-off, protecting *you* from pressure to move faster."
  *   **Soft Spot:** "Hard interlock" is the trigger phrase. If you insist it *cannot* be overridden, they will reject it. It must be a "gate" that opens, not a "wall" that decides.

  **3. The Neurologist (Criteria Confusion)**
  *   **Objection:** "This is cDCD, not DBD (Donation after Brain Death). We do not use EEG for circulatory death. By fusing EEG with arterial lines, you are conflating neurologic and circulatory criteria. You're introducing ancillary testing where none is required, which sets a precedent that could complicate future protocols."
  *   **Damage:** Medium-High. Makes you look like you don't understand the medical categories.
  *   **Reply:** "You're right that EEG isn't standard for cDCD. I propose it not as a neurologic death criterion, but as a noise-cancel for the circulatory signal. If the heart is stopped, the brain is silent. It's a sanity check on the perfusion data, not a brain death exam. But I'm willing to drop EEG if the committee prefers to stick strictly to hemodynamic signals."
  *   **Soft Spot:** You are technically correct (no flow = no brain activity), but culturally, neurologists guard EEG criteria fiercely. Be ready to sacrifice the EEG to save the Timer and Logging.

  **4. The OPO Coordinator (Family Optics)**
  *   **Objection:** "Families are already suspicious that we're rushing to get organs. If they see a 'timer' on a screen, or if we have to explain that we're waiting for a 'software interlock,' it looks industrial. It dehumanizes the moment. We need flexibility to comfort the family, not a stopwatch."
  *   **Damage:** Medium. Emotional argument trumps technical argument in donation.
  *   **Reply:** "Currently, the stopwatch is in the nurse's head. That's invisible, but it's also unverified. A visible, standardized timer assures the family that we are following a strict, unbiased protocol. It proves we aren't rushing. Transparency builds trust."
  *   **Soft Spot:** If the UI looks like a countdown clock, it's a PR disaster. It needs to look like a medical monitor status, not a microwave.

  **5. Hospital Risk Counsel (Legal Liability)**
  *   **Objection:** "State statute likely uses the word 'irreversible.' You want to go on record saying it's 'permanent.' If we log that we *chose* not to resuscitate, and that log is discovered in a wrongful death suit, you have just handed the plaintiff evidence that the cessation was not irreversible, only permanent. That looks like causation."
  *   **Damage:** Critical. This can kill the project instantly.
  *   **Reply:** "The 2006 IOM report and current AAMC guidelines explicitly distinguish permanent from irreversible to solve this exact legal problem. We are not changing the law; we are aligning our internal documentation with the clinical reality the law expects. Hiding the decision is riskier than documenting the protocol."
  *   **Soft Spot:** You are a software engineer quoting the IOM to a lawyer about state statute. If your state law specifically says "irreversible" without ambiguity, her worry is valid. Check your state's Uniform Determination of Death Act (UDDA) wording before the meeting.

  **6. The Bioethicist (The Dead Donor Rule)**
  *   **Objection:** "You're arguing that we should own the decision. But if we admit the patient *could* be resuscitated but we won't do it because we want their organs, aren't we admitting the organs are causing the death? You're making the Dead Donor Rule explicit, which might break it."
  *   **Damage:** Low-Medium. He knows you know this. He's testing your consistency.
  *   **Reply:** "The Dead Donor Rule requires the patient be dead *before* retrieval. Whether the cessation is irreversible by physics or permanent by decision, the patient is dead by the standard we have all agreed to apply. Honesty about the standard strengthens the rule; pretending the decision is a law of physics weakens it."
  *   **Soft Spot:** He is smarter than you on this. Don't try to out-philosophy him. Stick to the engineering/audit angle.

  **7. The Surgeon (Follow-up)**
  *   **Objection:** "If you log the 'do-not-resuscitate commitment' as a timestamped field, and that timestamp is even one second before the death declaration, you've created a smoking gun that the decision to let die preceded the death."
  *   **Damage:** High. Legal trap.
  *   **Reply:** "The DNR/WOS (Withdrawal of Support) order happens *before* the process starts. That's current practice. I'm just logging it. The death determination happens *after* the 5-minute wait. The log proves the sequence, it doesn't change it."
  *   **Soft Spot:** Ensure your data schema separates the *Order to Withdraw* from the *Determination of Death* clearly.

  **8. The Intensivist (Follow-up)**
  *   **Objection:** "What happens when the network goes down? If your system is the audit trail, and it crashes during a withdrawal, do we cancel the donation?"
  *   **Damage:** Medium. Reliability concern.
  *   **Reply:** "The system is passive monitoring. If it fails, we revert to manual stopwatch and paper charting, flagged as 'system offline.' We never stop care; we just lose the enhanced audit trail for that case."
  *   **Soft Spot:** You need a fallback mode. If you say "no donation if system fails," you're dead in the water.

  ---

  ### Part 2: Strategic Concessions (First 2 Minutes)
  *Do not wait for them to ask these. State them in your opening to disarm the room.*

  1.  **Concede the EEG:** "I know EEG is not standard for cDCD. I included it for signal redundancy, but I am fully prepared to drop it if the clinical team feels it conflates the criteria. The core value is in the arterial/pleth fusion and the timer."
      *   *Why:* Takes the Neurologist off your back immediately.
  2.  **Concede the "Hard" Interlock:** "I used the word 'interlock' in the proposal. To be clear: I am not proposing software override clinical judgment. I am proposing a 'gate' that requires a manual acknowledgment that the time has elapsed. The clinician still presses the button; the system just ensures the button *can't* be pressed early."
      *   *Why:* Saves you with the Intensivist and Risk Counsel. It changes "automation" to "assistance."
  3.  **Concede the Philosophy (Sort Of):** "On the permanent vs. irreversible point: I am not asking us to change the legal language on the death certificate today. I am asking that our *internal* engineering and logging reflect the clinical reality so that if we are ever audited, our data matches our practice."
      *   *Why:* Tells Risk Counsel you aren't trying to get the hospital sued tomorrow.

  ---

  ### Part 3: The One Reply That Must Land
  *If you lose the room on everything else, this argument must hold.*

  **The Argument:** "Current practice relies on trust. My proposal relies on verification. In an era where public trust in organ donation is fragile, an immutable audit trail is our best defense against allegations of conflict of interest. We protect the program by proving we followed the rules, not by asking everyone to take our word for it."

  **Why:** This aligns the Surgeons (protect the program), Risk Counsel (defense against lawsuits), and OPO (public trust). It frames the tech as a shield, not a shackle.

  ---

  ### Part 4: The "Prayer" Question
  *The question you hope nobody asks, because answering it honestly creates legal risk, and answering it dishonestly destroys your credibility.*

  **The Question:** (Likely from Risk Counsel or Bioethicist)
  "If we document that cessation is 'permanent' and not 'irreversible,' and a family sues claiming we could have saved their loved one if we hadn't been focused on organ retrieval, does this system provide the evidence they need to win?"

  **Why it's dangerous:** It forces you to admit that the "decision" is what makes them dead, which touches on causation.
  **Preparation:** Do not answer this alone. Look at the Risk Counsel and say: "That is exactly why we need you to review the logging schema before we implement. My job is to record the data accurately; your job is to ensure that accuracy doesn't create liability. But hiding the data doesn't make the liability go away."

  ---

  ### Part 5: Settled vs. Contested (Fact Check)
  *Do not walk into the room assuming these are facts. They are not.*

  **1. Permanent vs. Irreversible Cessation**
  *   **Status:** **Contested / Philosophical Consensus vs. Legal Lag.**
  *   **The Reality:** Among bioethicists and the 2006 IOM Institute of Medicine report, it is *settled* that cDCD relies on *permanent* cessation (won't restart) not *irreversible* (can't restart).
  *   **The Trap:** Many state statutes still use the word "irreversible." Clinicians operate under the "permanent" standard, but legally, you are in a gray zone.
  *   **Your Move:** Do not say "Everybody agrees." Say "Current ethical guidelines distinguish these, and I want our logs to match the guidelines."

  **2. The 5-Minute Wait Time**
  *   **Status:** **Mostly Settled (with variance).**
  *   **The Reality:** 5 minutes is the national consensus (IOM, AAMC) to rule out auto-resuscitation (the Lazarus phenomenon).
  *   **The Trap:** Some centers use 2 minutes, some 5. It is not federal law.
  *   **Your Move:** You are safe citing 5 minutes as the standard, but acknowledge local protocol rules.

  **3. EEG in cDCD**
  *   **Status:** **Contested / Generally No.**
  *   **The Reality:** cDCD is circulatory. EEG is neurologic. Using EEG is considered "ancillary testing" and is generally reserved for Brain Death (DBD).
  *   **The Trap:** Proposing EEG makes you look like you think cDCD patients need a brain death exam.
  *   **Your Move:** This is your biggest technical vulnerability. Be ready to cut it.

  **4. Audit Trails / Logging**
  *   **Status:** **Settled (Good Practice) but Legally Risky.**
  *   **The Reality:** Everyone agrees documentation is good.
  *   **The Trap:** In malpractice, *more* documentation = *more* discoverable surface area. If your log shows a 1-second deviation from protocol, it is evidence.
  *   **Your Move:** Frame it as "Quality Assurance," which often has legal privilege protections (depending on state), rather than "Legal Record."

  **5. The "Hard Interlock"**
  *   **Status:** **Contested / Generally No.**
  *   **The Reality:** Clinical systems almost never have hard hardware/software interlocks that prevent human action.
  *   **The Trap:** This violates the hierarchy of "Clinician > Machine."
  *   **Your Move:** This is your biggest cultural vulnerability. Soften this to "Workflow Enforcement" or "Prompting."

  ### Summary Advice
  You are the engineer in a room of clinicians and lawyers. Your superpower is **precision**, not **policy**.
  *   Don't tell them *what* the rule should be (Permanent vs. Irreversible).
  *   Tell them *that* their current rule is being applied inconsistently, and you can measure it.
  *   If you frame this as "I am building a tool to help you prove you are following the rules," you might win. If you frame it as "I am building a tool to enforce the rules," you will lose.
