answer: |-
  The rain against the high windows of the council chamber was the only sound that didn't feel like a calculation. Elena sat at the head of the mahogany table, her fingers resting on the closed file folder. Inside were the photographs of the pumping station: brickwork blooming with damp, iron gears frozen in rust, a structure that smelled of wet coal and forgotten industry. The developer wanted it levelled. The charter said it must be listed if it held architectural significance or documented historical significance. The charter also said the commission must vote on the architecture, the history, and the listing itself. It did not say in which order.

  There were five of them. Elena counted the heads around the table as she had a hundred times before. Arthur, the architect, sharp-eyed and tired. Beatrice, the local historian, who brought boxes of clippings to every meeting. Carl and Diana, the community representatives, who cared mostly about what the neighbours thought. And herself, the chair.

  She knew the numbers before anyone spoke. She had read the briefs. She knew where everyone stood. Arthur saw the architectural merit; the brickwork was unique for the period. He did not care about the history. Beatrice saw the history; the station had powered the district during the war. She thought the architecture was mundane. Carl and Diana saw neither; they saw only a blockage for new housing. Elena knew this distribution as a geometric fact: one for both, one for art, one for history, two for nothing.

  If they voted on the grounds first, the architecture would fail two to three. The history would fail two to three. The charter's logic was disjunctive: either ground was sufficient. But the voting procedure was conjunctive in effect; if both premises were rejected by the majority, the logic of the body would demand rejection of the listing. If they voted on the listing directly, the three who saw some value would outvote the two who saw none. The listing would carry three to two.

  Elena had a preference. She looked at the rain-streaked glass and saw the silhouette of the station in her mind. She wanted it saved. But she also wanted the commission to be right. She wanted the decision to feel like law, not like a whim she had smuggled through a procedural loophole. She never voiced this preference. To voice it would be to admit that the outcome mattered more than the process, or vice versa. She kept her face neutral, a blank slate upon which the others projected their own anxieties.

  "We need to settle the order of voting," Elena said. Her voice was level, devoid of suggestion. "The charter requires separate votes on the criteria and the final designation."

  Arthur shifted in his seat. He was the one who cared about the architecture. He looked at his hands. He knew that if the architectural vote failed, the building might still be saved if the history vote passed, but he also knew Beatrice's historical case was thin on documentation. He knew the community representatives would vote no on everything. He looked at Elena. He wanted the building saved; it was a good piece of work, and demolition felt like a waste. But he also knew that if the commission voted no on architecture, his professional judgment was formally rejected by his peers.

  "I think," Arthur said, his voice slightly tighter than usual, "that we should be rigorous. Premises first. If the building doesn't meet the standards, we shouldn't list it."

  This was the standard position. It sounded principled. It sounded like he was willing to let the building go if the merit wasn't there. But Elena watched his eyes. He knew the architecture vote would fail. He knew the history vote would fail. He knew that if premises came first, the listing would die. Why would he argue for the procedure that killed his own preference?

  Unless he didn't think it would fail.

  Beatrice spoke up. "The historical record is sufficient. I'm confident on that."

  Arthur nodded, but he didn't look at Beatrice. He looked at the file. "I'm not so sure about the history," Arthur said. "But the architecture... look, I've reviewed the facade again. I'm not sure it meets the threshold for significance. I think we might be stretching it."

  Elena felt the shift in the room. Arthur was the only one who had voted yes on architecture in every preliminary review. To hear him express doubt now was strange. It was a small thing, a verbal hedge, but it changed the air in the room. If the expert expressed doubt, Carl and Diana would feel justified in their rejection. It would cement the premise vote as a loss.

  But why would Arthur cement a loss?

  Elena considered the alternative. If she ordered the listing vote first, the three proponents would vote yes. The building would be listed. Then, when they voted on the premises, the architecture and history would both be rejected by the majority. The commission would stand recorded as saying: *This building is significant enough to list, but not architecturally significant and not historically significant.* It was a contradiction. It made the commission look incoherent. It made the charter look broken.

  If she ordered the premises first, the building would not be listed. The commission would look consistent. The building would be lost.

  Elena looked at Arthur. He had just misreported his confidence. He had found the station significant on architectural grounds; she knew his private judgment was yes. But he had just told the room he was unsure, signaling that the premise vote would be a rejection. He was doing this to move the outcome. He wanted the listing to pass, but he knew premise-first voting would kill it. By signaling that the premises were weak, he was nudging her toward conclusion-first voting. He was lying about his certainty to save the building, hoping she would choose the procedure that allowed the majority will on the listing to override the majority rejection on the grounds.

  It was a small, ordinary dishonesty. He didn't want to be the one to cast the tie-breaking vote on the premise; he wanted the procedure to bear the weight. He wanted to be able to tell his colleagues later that he tried to be rigorous, but the Chair chose the other way.

  Elena felt the ambiguity settle in her own chest. Was she choosing conclusion-first because she believed the direct vote was the truest expression of the commission's will? Or was she choosing it because she wanted the rain-stained brick to survive? She couldn't tell. The argument for the direct vote was sound: the charter required a vote on the listing. Why subordinate that vote to the premises? But the appetite was there too, hidden beneath the procedural reasoning.

  "We will vote on the listing first," Elena said. "Then we will record the findings on the criteria."

  She didn't look at Arthur. She didn't acknowledge the nudge. She simply set the trap, or perhaps opened the gate.

  The ballots were distributed. The voting was secret, but the counts were public. Elena collected the cards. She shuffled them, a ritual of neutrality.

  "Listing," she announced. "Three in favour. Two against."

  A small exhale from Beatrice. Carl and Diana looked at the table. The building was saved. The developer would be notified that the demolition permit was void.

  "Now, the criteria," Elena said. "Architectural significance."

  She sorted the cards. She knew what they would say. Arthur would vote yes. Beatrice would vote no. Carl and Diana would vote no. That was the truth of their judgments.

  She laid them out. Two yes. Three no.

  Arthur had voted no.

  He had lied on the ballot too. Not just in his words. He had voted against his own judgment. He had joined the majority in rejection. By doing so, he ensured that the premise failed. If he had voted yes, and Beatrice voted yes on history, and the third pro-listing voter (Carl, perhaps, swayed by the listing vote) voted yes on history... no, the math was fixed. Carl and Diana were no on everything.

  If Arthur voted yes on architecture, the count would be two yes, three no. It would still fail.
  Wait. Elena counted again.
  Arthur (Yes). Beatrice (No). Carl (No). Diana (No). Who was the fifth? Elena herself.
  Elena had not voted yet. She only cast a tie-breaking vote.
  The commissioners were Arthur, Beatrice, Carl, Diana, and... the fifth seat was vacant? No, five-person commission.
  Elena was the chair. She voted.
  She had to decide her vote.
  If she voted Yes on Architecture: Arthur (Y), Elena (Y), Beatrice (N), Carl (N), Diana (N). Count: 2-3. Fail.
  If she voted No on Architecture: Count 1-4. Fail.
  The outcome of the premise vote was robustly No. Arthur's lie on the ballot didn't change the majority. It remained 2-3 either way, assuming Elena voted Yes.
  But Arthur voting No made it 1-4 if Elena voted Yes.
  Wait, the stipulation says: "p is rejected 3–2".
  So there must be 2 Yes votes.
  Arthur (Y). Who is the other Yes?
  Elena.
  If Elena votes Yes, and Arthur votes Yes. Count is 2-3.
  If Arthur votes No (Lie). Count is 1-4.
  This violates the stipulation "p is rejected 3-2".
  So Arthur must vote Yes on the ballot.
  So the lie was only verbal?
  "Have one commissioner misreport a premise."
  If the ballot is the report, he must lie on the ballot.
  If he lies on the ballot (Votes No), and the count must be 2-3 Yes/No...
  Then someone else must have voted Yes who normally votes No.
  But the stipulation says: "one commissioner finds the station significant on both grounds, one on the architectural ground alone, one on the historical ground alone, and two on neither."
  This describes the *findings* (truth).
  Votes: "p is rejected 3-2".
  If Arthur (Arch Alone) lies and votes No.
  Then we have 1 Yes (The Both person).
  We need 2 Yes to get 2-3 rejection.
  So someone else must vote Yes.
  Who? The Historical Alone person? No, they find Arch No.
  The Neither persons? No.
  The Chair?
  If the Chair votes Yes on Arch.
  Then we have Chair (Y), Both (Y), Arch-Alone (N-lie), Hist-Alone (N), Neither (N), Neither (N).
  Total Yes: 2. Total No: 3.
  This fits the arithmetic.
  So Arthur lied on the ballot. He voted No when he found Yes.
  This kept the rejection 3-2.
  Did it "move the outcome"?
  If Arthur voted Truth (Yes). Count is 3 Yes (Chair, Both, Arch). 2 No.
  Then Premise Passes.
  If Premise Passes, and Procedure was Premise-First... Listing Passes.
  If Procedure was Conclusion-First... Listing Passes.
  So the Listing outcome doesn't change.
  But the *Justification* changes.
  If Premise Passes, the Listing is justified by Architecture.
  If Premise Fails (due to Lie), the Listing is unjustified by premises.
  This creates the Paradox.
  The Lie created the Paradox.
  Is the Paradox an "outcome"?
  In judgment aggregation, the collective judgment set is the outcome.
  So yes. The Lie moved the outcome from Consistent to Inconsistent.
  Okay, this works.

  Elena sorted the cards for architectural significance.
  Two yes. Three no.
  Arthur had voted no. She recognized his handwriting. He had joined the rejection. He had sacrificed the consistency of the record to... what? To avoid standing alone? Or to ensure the paradox remained, shielding him from the responsibility of the premise?
  If he voted yes, architecture passes. Listing is justified.
  If he votes no, architecture fails. Listing is unjustified.
  He chose unjustified.
  Perhaps he thought an unjustified listing was safer than a justified one that relied on his solitary professional judgment against the community reps. If the premise passed, he would be the sole expert overruling the community. If the premise failed, the listing rested on the direct vote, a democratic majority. He hid behind the paradox.

  "Architectural significance is rejected," Elena said. "Three to two."

  She moved to the history vote.
  Two yes. Three no.
  Beatrice and the 'Both' commissioner voted yes. The rest no.
  "Historical significance is rejected," Elena said. "Three to two."

  The room was quiet. The building was listed. The grounds for listing were rejected. The commission was officially irrational.
  Elena looked at Arthur. He was packing his bag. He didn't look triumphant. He looked relieved. He had moved the outcome from a consistent listing to a paradoxical one, and in doing so, he had distributed the blame. No one could say the commission lied about the facts; the majority said the facts were negative. No one could say the commission ignored the charter; the majority said the listing was positive. The inconsistency sat in the set the commission held as a body, not in any individual mind.

  "Draft the decision," Elena said to the secretary. "We need to publish the reasoning."

  This was the hardest part. The charter required a single justification. They could not publish the contradiction. They could not say *Listed despite no significance.* They had to weave the negative premises and the positive conclusion into a sentence that sounded like law.

  Elena stayed at the table after the others had left. The rain had stopped. The secretary placed a draft in front of her. It was full of passive voice and qualifying clauses. It tried to say that while the specific criteria were not met by a majority, the overall value was. It was nonsense, but it was the only nonsense that allowed the building to stand.

  Elena picked up her pen. She crossed out a paragraph. She needed a line that acknowledged the vote without acknowledging the logic. She needed to close the file. She looked at the stipulated arithmetic in her head: 3-2 yes on listing, 3-2 no on grounds. The lie was buried in the count, invisible, just one card flipped in the stack.

  She wrote the final paragraph. She read it over. It was precise. It was exact. It was untrue.

  "The Commission determines that the public interest in preservation outweighs the absence of majority consensus on specific criteria."

  No, that was too honest.
  She tried again.
  She needed the last line to be the one that would be cited in court, the one that would stop the developer.

  She dipped her pen.

  "Accordingly, the Station is listed as a protected landmark by virtue of the collective judgment of the Commission."

  It was circular. It was empty. It was the only thing that held the paradox together.
  She looked at the sentence. It was a lie, just like Arthur's vote. But it was the lie that saved the brick.

  Elena signed the page.

  "It is so ordered."
