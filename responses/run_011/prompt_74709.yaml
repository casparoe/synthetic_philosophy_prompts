  2. This excludes the materialist view that ideas are epiphenomenal traces of economic conditions and the Weberian view that conduct is explained by internal reasons rather than external variables. It rules out the possibility that culture and institutions are co-constituted rather than separable causes.

  3. Point (1) relies on the assumption that culture is immutable on policy timescales, allowing it to function as a predictive control in regressions while being excluded from policy levers. This treats culture as a fixed constraint rather than a mutable parameter, preserving the causal claim without demanding impossible interventions.

  4. Point (2) rests entirely on the exclusion restriction that historical factors affect current growth solely through their imprint on contemporary survey responses. This assumes no direct persistence of historical economic structures or institutions other than via the measured cultural trait.

  5. Point (3) is rejected because residualizing against institutions removes the very mechanism through which culture is theorized to affect growth, biasing the coefficient toward zero. Your advisor assumes culture operates *through* institutions, so treating institutions as confounders rather than mediators severs the causal chain you intend to measure.
