  - A million green emeralds, then grue: I say green. But I'll admit that if I'd grown up speaking a language where grue was the primitive, the razor on its own wouldn't have rescued me.
  - Newton's inverse-square law versus a twenty-term polynomial fitted to the same orbits: Newton is simpler, and I mean that as a fact about the theories, not about my choice of notation.
