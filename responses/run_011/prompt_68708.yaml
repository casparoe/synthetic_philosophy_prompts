  # Decision Tree: The Philosophical Import of Harsanyi's Aggregation Theorem

  **Instructions:** Begin at Node 1. Answer each question based on your interpretation of the theorem's conclusion and your own philosophical intuitions. Follow the branch corresponding to your answer. Do not look ahead to the position names.

  *   **Node 1:** Does the social utility function established by the theorem represent a moral truth about the good, or does it merely provide a numerical representation of a social preference ordering?
      *   *Merely a representation* $\rightarrow$ **Leaf 1: Deflationary Formalist**
      *   *A moral truth* $\rightarrow$ Go to Node 2.

  *   **Node 2:** Is the moral good for an individual constituted entirely by the satisfaction of their von Neumann–Morgenstern preferences?
      *   *No* $\rightarrow$ **Leaf 2: Anti-Preference Welfarist**
      *   *Yes* $\rightarrow$ Go to Node 3.

  *   **Node 3:** Are the individual utility scales fixed by nature (interpersonally comparable), or are they arbitrary up to positive affine transformation?
      *   *Fixed by nature* $\rightarrow$ **Leaf 3: Objective Utilitarian**
      *   *Arbitrary up to affine transform* $\rightarrow$ Go to Node 4.

  *   **Node 4:** Given this arbitrariness, is the weighted sum of utilities morally meaningless, or is the meaning preserved by normalization or convention?
      *   *Meaningless* $\rightarrow$ **Leaf 4: Invariance Skeptic**
      *   *Preserved* $\rightarrow$ Go to Node 5.

  *   **Node 5:** Do you accept the Pareto Indifference condition (if all individuals are indifferent between two lotteries, society must be indifferent)?
      *   *No* $\rightarrow$ **Leaf 5: Anti-Pareto Theorist**
      *   *Yes* $\rightarrow$ Go to Node 6.

  *   **Node 6:** Must the social ordering satisfy the Sure-Thing Principle (separability across persons and states), implying linear aggregation?
      *   *No (Distribution of risk/outcomes matters)* $\rightarrow$ Go to Node 7.
      *   *Yes (Linear aggregation required)* $\rightarrow$ Go to Node 8.

  *   **Node 7:** When separability is violated, do we evaluate justice by the distribution of expected utilities (before resolution) or the expected value of transformed outcomes (after resolution)?
      *   *Before resolution (Ex-Ante)* $\rightarrow$ **Leaf 6: Ex-Ante Prioritarian**
      *   *After resolution (Ex-Post)* $\rightarrow$ **Leaf 7: Ex-Post Prioritarian**

  *   **Node 8:** What fixes the weights on individual utilities in the social sum?
      *   *Nothing (Free parameters)* $\rightarrow$ **Leaf 8: Weighted Welfarist**
      *   *Formal Anonymity (Symmetry)* $\rightarrow$ **Leaf 9: Harsanyi Utilitarian**
      *   *Veil of Ignorance* $\rightarrow$ **Leaf 10: Contractualist Utilitarian** OR **Leaf 11: Rawlsian** (See Diagnosis below).

  ***

  ### Leaf Diagnoses and Costs

  1.  **Deflationary Formalist:** The theorem is only a representation result. *Cost:* You surrender the claim that the theorem settles moral questions.
  2.  **Anti-Preference Welfarist:** Preferences are not the sole currency of good. *Cost:* You reject the welfarist input of the theorem.
  3.  **Objective Utilitarian:** Utility scales are naturally comparable. *Cost:* **Unoccupied.** Coherent but empirically unsupported; assumes a metaphysical fact about value scales the theorem does not provide.
  4.  **Invariance Skeptic:** The sum is not invariant to rescaling. *Cost:* You accept the math but deny it has normative content.
  5.  **Anti-Pareto Theorist:** Unanimous indifference does not bind society. *Cost:* You reject a core liberal constraint on social choice.
  6.  **Ex-Ante Prioritarian:** Fairness applies to chances. *Cost:* You may prefer a lottery that yields worse outcomes overall to equalize chances.
  7.  **Ex-Post Prioritarian:** Fairness applies to outcomes. *Cost:* You violate the Sure-Thing Principle and ex-ante Pareto.
  8.  **Weighted Welfarist:** The theorem allows unequal weights. *Cost:* You must supply a separate moral argument for the weights.
  9.  **Harsanyi Utilitarian:** Anonymity fixes equal weights. *Cost:* You treat equal weight as a formal symmetry rather than a moral claim.
  10. **Contractualist Utilitarian:** The Veil justifies equal weights and the sum. *Cost:* **Indistinguishable from Leaf 9.** Generates identical orderings; differs only in justificatory story. To separate: Ask "Is the Veil a heuristic for symmetry or a moral device?"
  11. **Rawlsian:** The Veil justifies Maximin, not the sum. *Cost:* **Unoccupied within the theorem.** Requires rejecting the vNM axioms in the Original Position, which contradicts Node 6.

  ***

  ### Classification of Student Remarks

  1.  **"The theorem proves that what one ought to do is maximize the sum of individual utilities, so anyone who denies that is denying a theorem of decision theory."**
      *   **Leaf:** 9 (Harsanyi Utilitarian).
      *   **Diagnosis:** Confuses the mathematical derivation (if premises hold) with the moral necessity of the premises. Denying the conclusion requires denying a premise (e.g., Node 2 or 6), not the math.

  2.  **"Because each person's utility function can be multiplied by any positive number and shifted by any constant, the weighted sum is not invariant under those rescalings, and so the theorem says nothing whatever."**
      *   **Leaf:** 4 (Invariance Skeptic).
      *   **Diagnosis:** Correctly identifies the measurement problem (Node 3/4) but concludes normative emptiness rather than seeking a normalization convention.

  3.  **"I accept every premise and I am a prioritarian. Since my view is not among the theorem's conclusions, the theorem must be wrong."**
      *   **Leaf:** Cannot accommodate (Confused).
      *   **Diagnosis:** Prioritarianism requires violating the Sure-Thing Principle (Node 6). One cannot accept *every* premise (which includes Sure-Thing) and be a prioritarian. The student is conflating the theorem's assumptions with their own.

  4.  **"The theorem shows that behind the veil of ignorance rational self-interest just is utilitarianism, which is why the equality of the weights is not a moral assumption but a piece of decision theory."**
      *   **Leaf:** 9 (Harsanyi Utilitarian) or 10 (Contractualist Utilitarian).
      *   **Diagnosis:** Captures the Harsanyi move (Leaf 9) that reduces the Veil to decision theory under symmetry. However, claiming it is *not* a moral assumption is the contentious point that separates Leaf 9 from Leaf 10.
