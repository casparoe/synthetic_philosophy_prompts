answer: |-
  The framing is a standard pedagogical heuristic that specialists would accept as a useful simplification, but your second suspicion is correct regarding the overstated archival conclusion, whereas your first suspicion misidentifies the source of the vocabulary since historians themselves adopted that political science framework.

  **Audit of the Three-Wave Periodization**
  The division of Cold War historiography into Orthodox (Traditionalist), Revisionist, and Post-Revisionist waves is a settled typology in the field; specialists recognize this schema immediately and would regard your paraphrase of each wave's central commitment as a defensible simplification for a teaching introduction. The characterization of the Traditionalists as focusing on Soviet ideological expansionism and the Revisionists as focusing on American economic imperialism and atomic diplomacy accurately captures the dominant tendencies of those schools, though specialists would note that neither camp was monolithic and that some Revisionists emphasized security concerns over economic ones. The description of the Post-Revisionists is also recognized as accurate, but this is precisely where your first suspicion requires nuance: it is not that the introduction imposes political science vocabulary onto historians, but rather that the leading historians of that wave explicitly imported realist international relations theory to construct their explanations. Therefore, the vocabulary is authentic to the historiography, even if its origin lies in political science, and your unease here signals a correct identification of the interdisciplinary shift rather than an error in the text.

  **Audit of the Archival Claim**
  Your second suspicion is justified and points to the most contested claim in the passage. The assertion that the opening of Eastern bloc archives after 1991 confirmed the post-revisionist systemic picture is an extrapolation that many specialists would actively dispute. While some historians argued the archives vindicated the view of mutual misperception and security dilemmas, a significant contingent argued that the documents revealed Stalin's intentions were more aggressive and ideologically driven than the post-revisionists had allowed, thereby partially vindicating the Traditionalist view. Consequently, the claim that the archives showed "how little the confrontation owed to anyone's plan" is too strong; the archives complicated the picture rather than settling it, and presenting the post-Cold War consensus as uniformly systemic is a pedagogical smoothing of ongoing debates.

  **Audit of the Conclusion on Responsibility**
  The introduction's conclusion that the moral vocabulary of responsibility has been displaced by a systemic one follows from the accurate description of the post-revisionist shift, but it survives correction of the archival claim only conditionally. Even if the archives did not fully confirm the systemic view, the dominant mode of professional historical explanation in this field has indeed moved away from assigning individual guilt toward analyzing structural constraints. However, specialists would caution that this displacement is methodological rather than absolute; historians often imply responsibility through the selection of causal primes, even when avoiding explicit moralizing. Therefore, the claim that the question of "who started it" dissolves is a defensible summary of the field's aspiration, but not necessarily a description of its actual practice, where causal primacy often functions as a proxy for blame.

  **Addressing the Causal vs. Responsibility Distinction**
  Your suspicion that the introduction collapses causal explanation and responsibility ascription is not a mere philosophical import but identifies a genuine tension in historical practice that specialists often navigate implicitly rather than contest explicitly. Historians of the Cold War frequently treat the question of "origins" as inseparable from the question of "fault," despite methodological protests to the contrary; when a historian argues that Washington's insistence on a specific postwar order made division unavoidable, they are offering a causal mechanism that carries an inescapable normative weight. The distinction you propose is therefore vital for your dissertation because it exposes a slippage in the historians' work that they themselves rarely theorize. You are not imposing an external distinction that does no work; rather, you are making explicit a conceptual ambiguity that allows historians to move between explanation and judgment without defending the transition. Your project should proceed on the basis that while historians may claim to have abandoned responsibility for mechanism, their causal narratives often retain the structure of responsibility ascription, and analyzing that retention is where your philosophical intervention belongs.
