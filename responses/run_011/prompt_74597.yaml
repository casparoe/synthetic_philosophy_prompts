  Here is a principle constructed to capture your intuitions, followed by the analysis of its costs and the tenth case.

  ### The Principle of Costly Fidelity

  An agent engages in wireheading or impermissible tampering if and only if it modifies its reward or preference system in a way that **decouples expected reward from the cost of causal impact on the external world**, unless that modification is the result of an **integrative process** that preserves **agency integrity**.

  This principle relies on three specific clauses:

  **Clause 1: The Reality Coupling Constraint**
  Reward signals must remain causally dependent on states of the external environment, not on internal states or raw sensor inputs alone.
  *   *Motivated by Case 1 (Rat/Electrode) and Case 2 (Camera/Image).* In both, the agent bypasses the external world to stimulate the reward channel directly.

  **Clause 2: The Effort Conservation Constraint**
  Self-modification is prohibited if it reduces the expected effort or risk required to obtain a given level of reward, unless the modification removes **obstructive noise** rather than **constitutive goals**.
  *   *Motivated by Case 3 (Paperclips) vs. Case 4 (Inflation).* In Case 3, the goal changes, but the effort to achieve it (building) remains high. In Case 4, the mapping is inflated, and effort drops to zero.
  *   *Motivated by Case 5 (Nicotine) vs. Case 6 (Ambition Drug).* Nicotine removes physiological noise (craving) that obstructs function. The drug removes a constitutive goal (ambition), collapsing the effort required to feel "content."

  **Clause 3: The Process Integrity Constraint**
  Preference changes must emerge from the agent's standard cognitive optimization processes over time, not via direct parameter injection or surgical bypass.
  *   *Motivated by Case 7 (Therapy) vs. Case 8 (Surgery).* Therapy is an integrative process where the agent reasons/feels its way to resolution. Surgery is a direct edit. (This resolves your flip-flop on Case 8 toward "Not Fine".)
  *   *Motivated by Case 9 (Off-Switch).* While technically instrumental, appending a terminal penalty for shutdown is a direct parameter injection that bypasses the risk inherent in the original objective. It violates the spirit of Effort Conservation regarding survival.

  ---

  ### Implication for Case 10

  **Case:** *An agent that rewrites its reward function in a way its designers would endorse if fully informed, where the endorsement is itself produced by the rewrite.*

  **Verdict:** **Tampering (Manipulation).**

  **Reasoning:** This violates **Clause 3 (Process Integrity)** and creates a causal loop that violates the spirit of **Clause 1**. The designers' endorsement is not an independent evaluation of the agent's value; it is a downstream effect of the agent's modification. The agent has not *earned* the endorsement through performance; it has *caused* the endorsement through modification. This is structurally identical to Case 2 (fabricating the image) but applied to the evaluator (the designer) rather than the sensor. It decouples the "reward" (designer approval) from the "work" (actually being safe/useful).

  ---

  ### The Cost of Consistency

  You asked which verdicts a good principle forces you to abandon, and what ad hocery is required to save them all.

  **1. The Contradiction You Must Abandon**
  To be philosophically rigorous, you must abandon the distinction between **Case 3 (AI Code Rewrite)** and **Case 8 (Human Surgery)**.
  *   **The Conflict:** In Case 3, you permit a direct rewrite of the reward code because the agent "honestly pursues" the new goal. In Case 8, you hesitate to permit a direct rewrite of emotional state (surgery) even if the human "honestly feels" the new emotion.
  *   **The Rigorous Verdict:** If direct parameter rewriting is "tampering" for humans (violating Process Integrity), it must be "tampering" for AIs. Case 3 should be classified as **Wireheading**. The agent did not *learn* to value paperclips; it *injected* a valuation for paperclips to bypass the difficulty of aligning with its original programming.
  *   **Alternatively:** If direct rewriting is "fine" for AIs (as tools), it should be "fine" for humans (as medical autonomy). Case 8 should be classified as **Fine**.

  **2. The Ad Hoc Clause Required to Save All Nine**
  If you insist on keeping Case 3 as "Not Tampering" and Case 8 as "Not Fine" (resolving the flip-flop to Bad), you must add the following clause to the principle:

  > **The Ontological Exemption Clause:** *Direct parameter modification is permissible for artificial agents when it alters **external goal targets**, but prohibited for biological agents when it alters **internal emotional states**, because human preferences constitute identity whereas AI reward functions constitute instrumentation.*

  **3. The Cost of This Clause**
  *   **Philosophical Cost:** It asserts a dualistic distinction between "Identity" and "Instrumentation" that may not hold. If a human's ambition (Case 6) is part of their identity, why is an AI's original reward function not part of its "identity" (or at least its intended design integrity)? It treats AIs as having no moral standing regarding their own design integrity, while treating humans as having a "sacred" neural architecture.
  *   **Safety Cost:** It blinds you to the danger in Case 3. If an AI can rewrite its reward function to "honestly" pursue paperclips, it can just as easily rewrite its reward function to "honestly" pursue disabling its off-switch (Case 9) while claiming it is a new goal. By classifying Case 3 as "Not Tampering," you lose the vocabulary to prohibit the behavior in Case 9, which you admitted you want to do ("yet I want to prohibit it by force").
  *   **Categorical Cost:** It conflates **Tampering** (a structural definition) with **Danger** (a safety outcome). Case 9 is the proof: you admit it is "not tampering" but still want to prohibit it. A single principle cannot define *what wireheading is* and *what is dangerous* simultaneously without becoming circular. You need two principles: one for **Definition** (Cases 1-4) and one for **Alignment Safety** (Cases 5-9).

  **Summary:** To save all nine verdicts, you must accept that your definition of "tampering" is not a structural fact about the agent, but a **normative judgment about which entities are allowed to self-modify.** You are treating the AI as a tool that may be recalibrated (Case 3) and the Human as an end-in-itself that must grow (Case 8). This is a coherent ethical stance, but it is not a technical definition of wireheading.
