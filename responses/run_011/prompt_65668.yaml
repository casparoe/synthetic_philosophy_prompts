answer: |-
  In Otterburn, Mrs Croy, a reclusive widow, sits at her kitchen table under a single bulb. The kitchen is cold. Rain beats hard against the pane, blurring the glass. She writes on a green till receipt with a blunt pencil. She never intends showings. The verse reads:

  *The wet snap of the Dahlia stem,*
  *Not wind, but weight. I heard it break.*
  *A little crack, a quiet gem,*
  *And warmth rose up for no one's sake.*

  It scores maximum infectiousness. Individuality: Not generic loss, but that specific wet snap. Clearness: The rhythm mimics the break; no obscure metaphors. Sincerity: Written at 3am, purely to discharge the feeling. She would have burned it otherwise; the need was internal.

  Three receivers encounter it later. The Neighbour, finding it in Mrs Croy's effects, feels the violation amplified by the precision. She recognises her own vanity in the mirror of the spite. The Neighbour's Son feels a surge of anger, then a shameful flicker of agreement with the joy; he is taken by surprise by his own complicity. He expected rage, but found resonance. The Grandson feels the joy of the break despite his morality; he is infected by the spite. He laughs before he stops himself. The Neighbour weeps. The Son goes quiet. The Grandson grins.

  The feeling is exclusive joy at another's loss. A decent person knows this shame. The property making it infectious is the *precision* of the cruelty. It locks the transmission to the badness. If the feeling were softened to pity, the individuality would blur, the rhythm would slacken, and the infection would fail. It would become a tolerated platitude.

  The town knows nothing of this. No technology transmits it. It passes hand to hand. The receipt is stained with tea. The Grandson holds it now. He sees the theory eating itself. The art is perfect; the morality is rotten. The conditions are met; the content is condemned. The infection proves the art; the content denies the value. Vera must explain why sincerity fails here, or admit the theory breaks. He waits for her rebuttal.

  ***

  **Demonstration**

  **Verdict on Art:** Yes. It sits at the maximum degree scale. It fulfils all three conditions of infectiousness without compromise. The feeling is transmitted fully.

  **Verdict on Content:** Condemned. It falls into Tolstoy's bucket of exclusive feelings that divide men rather than uniting them. It promotes isolation and spite, contrary to the religious perception of brotherhood.

  **The Feature:** The *precision* of the observation. This sharpness makes the feeling vivid enough to infect (Art) but cruel enough to divide (Content). They are the same mechanism.

  **Removal:** If you remove the precision, softening the feeling to general sadness, the work collapses into a tolerated platitude. It loses its infectious power and becomes counterfeit art—technically poor and morally neutral.

  **Vera's Counter:** She argues that sincerity requires alignment with truth. Since the religious perception of the age (brotherhood) is the truth, a feeling contrary to it (spite) is inherently self-deceptive. Therefore, the maker cannot be fully sincere.

  **Outcome:** This move relabels the work as counterfeit art (failed condition 3) rather than bad art. It saves the theory from contradiction by denying the premise of sincerity, but it does not deny the infection occurred. The grandson wins on phenomenology; Vera wins on taxonomy.
