answer: |-
  This is a sharp set of questions. You are looking at the structural integrity of the *ideas* behind these projects, not just the concrete and steel. As an engineer, you know that if you don't understand the load path, you can't trust the structure. Here, the "loads" are moral and semantic, and the "foundations" are theories of time and value.

  There is no single consensus theory here. Instead, this cluster of projects represents three distinct engineering philosophies applied to deep time. They are not all the same kind of project, and they do not all rely on the same theory of value.

  Here is the reconstruction of the implicit commitments, separated into what is functionally required for the projects to make sense, and where the philosophical ground is genuinely contested.

  ### 1. The Taxonomy: Instrumental vs. Expressive vs. Memetic

  To understand the value theory, we first have to separate the projects by their "design basis."

  *   **Instrumental (The Seed Vault, WIPP Markers):** These are functional safety systems. They presuppose a future audience that *will* exist and whose welfare is impacted by our current actions. The value is **consequentialist**: the project is good if it prevents harm (WIPP) or enables survival (Seeds).
  *   **Expressive (Voyager, GitHub Archive):** These are monuments. They presuppose a future audience that *might* exist. The value is **expressive** or **deontological**: the act of sending the message has value in itself, regardless of receipt. It is an assertion of existence.
  *   **Memetic (The Radiation Cats):** This is a biological/cultural control system. It presupposes that *information* degrades but *behavior* persists. The value is **evolutionary**: survival of the fittest narrative, not the truest proposition.

  ### 2. The Implicit Commitments (The "Load Tables")

  For any of these projects to be rational (non-delusional), the builders must commit to at least two foundational premises.

  **A. The Moral Patienthood of Future People**
  *   **The Commitment:** People who do not yet exist have moral standing. We owe them something (safety, resources, truth).
  *   **The Alternative:** "Presentism." The view that only currently existing beings matter. If you hold this view, the Seed Vault is a waste of money (those people don't exist yet) and WIPP markers are unnecessary (future intruders are not our responsibility).
  *   **Status:** This is the closest thing to a consensus among the practitioners. You cannot work in nuclear waste regulation without legally and ethically accepting that future generations matter. However, in philosophy, this is heavily contested (see the "Non-Identity Problem" below).

  **B. The Stability of Semantics (or Behavior)**
  *   **The Commitment:** Meaning can survive entropy. For WIPP, it assumes "Danger" can be communicated across 10,000 years of cultural drift. For Voyager, it assumes physics is a universal language.
  *   **The Alternative:** Radical incommensurability. The idea that 10,000 years of cultural evolution will render our symbols as meaningless as we find Linear A script.
  *   **The "Cats" Pivot:** The radiation cat proposal is an admission of failure here. It concedes that *semantics* (text) will fail, so it switches to *conditioning* (fear response). It treats culture like an ecosystem, not a library.

  ### 3. The "Hypocrisy" Question: Message vs. Audience

  You asked: *We spend billions addressing an audience that probably won't exist, and comparatively nothing on making sure an audience exists. Is that hypocrisy?*

  This is the most live fight in the field. There are two competing explanations for this allocation of resources, and they rely on different value theories.

  **View 1: The Diversification Hedge (Engineering Logic)**
  *   **Theory:** Existential risk mitigation (ensuring the audience exists) and cultural preservation (addressing the audience) are different risk portfolios.
  *   **Argument:** We *do* spend money on ensuring the audience exists (climate accords, non-proliferation, pandemic monitoring), but those failures are invisible. The monuments are visible. From this view, it isn't hypocrisy; it's redundancy. If the civilization fails, the Seed Vault and Markers are the "black box" for the next iteration.
  *   **Value:** Option Value. We preserve the *capacity* to restart.

  **View 2: The Symbolic Displacement (Sociological Logic)**
  *   **Theory:** The projects are performative. They allow the present generation to feel they have handled the future without making the hard sacrifices required to actually secure it.
  *   **Argument:** Building a mountain of spikes (WIPP) is politically easier than solving the political instability that might lead to nuclear war. It is "moral offsetting."
  *   **Value:** Social Cohesion. The value isn't for the future; it's for *us*, to help us sleep at night.
  *   **Status:** This is a critical view, not a consensus. Practitioners reject it; critics of technocracy embrace it.

  ### 4. What Rival Views Are Ruled Out?

  If you accept the premises of these projects, you are logically committed to rejecting several philosophical positions:

  1.  **Strict Presentism:** (Already mentioned). If only the present matters, WIPP is torture of future people for our convenience, and Voyager is space litter.
  2.  **Antinatalism:** The view that it is wrong to bring new people into existence. The Seed Vault explicitly commits to the opposite: that future life is *good* and worth facilitating.
  3.  **Linguistic Relativism (Strong Sapir-Whorf):** The WIPP task force had to reject the idea that language is entirely culture-bound. They operated on the hope that "pain" and "danger" are trans-cultural constants. If you believe language is entirely opaque to outsiders, the markers are useless.
  4.  **Information Nihilism:** The view that information degrades to noise inevitably. The GitHub Archive and Voyager commit to the idea that signal can be preserved against the noise floor of deep time.

  ### 5. The Live Fights (Where the Consensus Breaks)

  You asked to distinguish settled practice from live fights. Here is where the engineers and philosophers diverge.

  **A. The Non-Identity Problem (Parfit)**
  *   **The Fight:** Philosophers like Derek Parfit argue that our policies change *who* comes into existence. If we build the Seed Vault, the specific people born in 2100 will be different than if we don't. Therefore, we cannot say we are "benefiting" them, because without the project, *they* wouldn't exist to be benefited.
  *   **Practice:** Civil engineers and regulators ignore this. They operate on a "same person" fiction for legal liability. They treat future generations as specific clients.
  *   **Implication:** The projects are philosophically vulnerable but practically robust.

  **B. Hostile Architecture vs. Information**
  *   **The Fight:** For WIPP, should we rely on *language* (telling them not to dig) or *physics* (making it impossible/unpleasant to dig)?
  *   **Practice:** The current design uses both. But there is a split. Some semioticians argue that "hostile architecture" (spikes) assumes a specific human psychology (fear of pain) that might not exist in post-human or radically altered societies.
  *   **Implication:** The "Cats" proposal is the extreme end of this. It assumes biology is more stable than culture. This is not consensus; it's a fringe but serious semiotic hypothesis.

  **C. The Value of the Unreceived Message**
  *   **The Fight:** Does the Voyager record have value if no one finds it?
  *   **Practice:** NASA acts as if it does.
  *   **Philosophy:** Consequentialists say no (no utility). Kantians/Expressivists say yes (it fulfills a duty of self-expression).
  *   **Implication:** This is the clearest split between the Seed Vault (Consequentialist) and Voyager (Expressive). They are not the same kind of project. One is a lifeboat; the other is a prayer.

  ### 6. Summary: The Theory of Value

  To answer your core question directly: **What theory of value does this cluster presuppose?**

  It is not a single theory. It is a **hybrid stewardship model** composed of three layers:

  1.  **Utilitarianism for the Near Future:** (Seed Vault, WIPP). We owe actual future people safety and resources. Value = Welfare of specific descendants.
  2.  **Existentialism for the Deep Future:** (Voyager). If humanity ends, our existence still had weight. Value = Affirmation of being.
  3.  **Evolutionary Pragmatism for the Unknown:** (Radiation Cats). If we can't control the meaning, control the reflex. Value = Survival of the constraint, regardless of understanding.

  **On the Hypocrisy:**
  It is not necessarily hypocrisy, but it is a **category error** to treat them as the same budget line.
  *   Ensuring an audience exists is **Risk Mitigation**.
  *   Addressing an audience that might not exist is **Legacy/Insurance**.

  In engineering terms: Mitigation is strengthening the beam so it doesn't collapse. Legacy is painting the beam so that if it does collapse, the rubble tells the next builder what went wrong. You need both, but they serve different failure modes. The criticism arises when we paint the beam *instead* of strengthening it. That is where the charge of hypocrisy holds water.

  **The "Cats" Insight:**
  The radiation cat proposal is the most honest of the bunch. It admits that **propositions decay, but instincts persist.** It is a separate commitment from the Seed Vault. The Seed Vault trusts that future humans will be *rational actors* who want seeds. The Cats trust that future humans will be *animals* who fear pain. It is a lower bar for continuity, which suggests the builders have less faith in the continuity of *civilization* and more faith in the continuity of *biology*.

  ### Final Verdict for the Engineer

  You are right to suspect they are different structures.
  *   **Seed Vault/WIPP:** Load-bearing walls. Designed for utility.
  *   **Voyager/GitHub:** Cladding/Finishes. Designed for meaning.
  *   **Cats:** Safety interlocks. Designed for behavior modification.

  The "theory of value" is that **continuity itself is a good**, whether that continuity is biological (seeds), physical (safety), or narrative (records). The tension you feel regarding the spending is the tension between *preventing the end of the story* and *writing a good ending.* The projects prioritize the latter because the former is politically intractable, while the latter is technically solvable. That is not a philosophical consensus; that is a political compromise dressed up in granite.
