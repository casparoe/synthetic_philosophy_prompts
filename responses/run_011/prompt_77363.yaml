prompt: |-
  I run the annotation side of a small AI data company — six of us in the office in Manchester, plus about fifteen freelance labellers spread over three time zones, most of them not native English speakers. What I actually spend my week doing is writing the guidelines: a client sends a spec, I turn it into something a normal person can follow without asking me questions every ten minutes, we label a calibration batch, argue about the disagreements, revise, and go again. Every single project hits the same wall. The labellers agree with me on all forty example items, and then in the first real batch they split into two or three camps doing systematically different things — and adding more examples doesn't fix it, it just moves the disagreement further out. A friend who did a philosophy degree mentioned at the pub that this is roughly what Kripke's Wittgenstein is on about, that a finite set of examples can't pin down a rule because you can always cook up a rival rule that fits everything you've shown them and diverges later, and honestly it's been rattling around in my head ever since, because that is a precise description of my job.

  So: could you write me a procedure I can actually run on a guideline, ideally in the couple of hours between the client sending the spec and us starting calibration? I want the steps in order — what to do to a spec before it ever reaches a labeller, what to look for when a disagreement shows up, how to tell apart the cases where the guideline is genuinely indeterminate from the cases where somebody hasn't read it properly (or has read it properly and spotted something I missed), what counts as enough evidence to declare a divergence real rather than noise, and what to do once you've declared it: rewrite, stipulate a tie-breaker, or escalate. I need it to say where the procedure stops and hands the thing to a human because there's no further fact of the matter to dig up, and where it stops and hands it to the client because it's their spec and their risk. Please flag which steps are judgement calls wearing a procedure costume — I'd rather know than discover it in month three. And don't give me an agreement-metric answer: we already compute kappa on every batch and I've come to think its measuring the wrong thing here, since agreeing on the calibration items is exactly what the sceptical problem grants you from the start.

  Then run it on three cases that are basically real. (A) Escalation project, guideline says escalate any message where the customer mentions cancelling their account; two labellers agree on sixty items, then one of them starts not escalating messages where the cancellation is hypothetical or denied — "nothing would make me cancel after eight years" — and when I check, she's been doing it consistently the whole time, not randomly, and every single one of my example items is compatible with what she's doing. (B) A PII project where the guideline lists categories with examples; one labeller starts flagging a first name plus a partial postcode in what turns out to be a village of three hundred people, and job titles at small named companies. I think he's over-labelling and slowing us down, and I'd like the procedure to tell me whether it is. If the honest output is that my guideline is the broken thing and we should re-specify and re-label four thousand items, I want it to say that plainly, because there's a delivery date and I will otherwise talk myself into a patch. (C) A toxicity project where the two readings are both defensible and the team just won't converge — sarcastic praise, and people quoting a slur in order to object to it — and here I want to see what the procedure does when there isn't a more correct reading, only a choice somebody has to own. Finally, tell me what this procedure cannot do, and what a guideline-writer should stop pretending to want; and if any step needs a workshop or a second calibration round to detect something, say how many days that costs, because I have to justify it to our ops lead.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User Persona:** Operations lead/Annotation Manager at a small AI data company (Manchester, 6 office staff, 15 freelancers, 3 time zones, non-native English speakers).
      *   **Core Problem:** The "Skeptical Problem" (Kripke's Wittgenstein). Labellers agree on calibration examples but diverge systematically on real data because finite examples cannot fully define a rule. More examples just push the divergence point further out.
      *   **Goal:** A practical procedure to run on guidelines *before* they reach labellers (within a couple of hours), plus a protocol for handling disagreements during production.
      *   **Specific Requirements:**
          *   Steps in order (Pre-labelling, Disagreement Analysis, Decision Making).
          *   Distinguish between guideline indeterminacy vs. labeller error.
          *   Define evidence thresholds for "real divergence."
          *   Define actions (Rewrite, Stipulate, Escalate).
          *   Identify "Judgement Calls wearing a procedure costume."
          *   Identify where to hand off to Human (no fact of the matter) vs. Client (spec/risk ownership).
          *   *No* agreement metrics (Kappa is useless here).
          *   Run the procedure on three specific cases (A: Escalation/Hypothetical, B: PII/Re-identification risk, C: Toxicity/Contextual nuance).
          *   Conclusion: What the procedure *cannot* do, what to stop wanting, and cost estimates (time/days).
      *   **Tone:** Pragmatic, operational, philosophically aware but not academic, honest about limitations.

  2.  **Theoretical Foundation (Internal Monologue):**

      *   The user is referencing Kripke's interpretation of Wittgenstein's *Rule-Following Paradox*. The core idea is "Quus" vs. "Plus." No matter how many examples of addition you show someone, they could interpret the rule as "add numbers up to 57, then return 5" (Quus).
      *   In annotation, this manifests as "Edge Case Drift." Labellers infer a latent rule from examples that differs from the written spec.
      *   The solution isn't more examples (that's the trap). The solution is *stress-testing the boundary conditions* of the rule *before* production, and creating a governance structure for when the rule breaks.
      *   I need to translate "Skeptical Solution" (community agreement) into "Operational Protocol."

  3.  **Drafting the Procedure (The "Pre-Mortem" Protocol):**

      *   *Phase 1: Spec Stress-Test (The 2-Hour Window).*
          *   Can't just read it. Need to try to break it.
          *   Step 1: The "Devil's Advocate" Pass. Intentionally look for the "Quus" interpretation.
          *   Step 2: Negative Constraints. Define what is *not* included, not just what is.
          *   Step 3: The "Grandmother Test" (or "Non-Native Speaker Test"). Simplify language.
      *   *Phase 2: Calibration as Discovery, not Verification.*
          *   Don't just check if they match me. Check *why* they match.
          *   Require "Reason Codes" or short justifications, not just labels.
      *   *Phase 3: Production Divergence Protocol.*
          *   Threshold for action (e.g., 3 consistent divergences on a specific pattern).
          *   Triage: Error vs. Ambiguity.
      *   *Phase 4: Resolution Hierarchy.*
          *   Level 1: Clarify (Guideline fix).
          *   Level 2: Stipulate (Arbitrary decision for consistency).
          *   Level 3: Escalate (Client decision).

      *   *Flagging Judgement Calls:* I need to explicitly mark where intuition is required.

  4.  **Running the Procedure on the Three Cases:**

      *   **Case A (Escalation/Hypothetical):**
          *   *Analysis:* The rule "mentions cancelling" is syntactically clear but semantically ambiguous regarding *intent*.
          *   *Procedure Application:* This is a guideline indeterminacy. The labeller isn't wrong; the spec is under-specified regarding *intent*.
          *   *Action:* Escalate to Client. Risk ownership.
      *   **Case B (PII/Re-identification):**
          *   *Analysis:* "PII" is context-dependent. A name + postcode in a village is PII. A name + job at a small company is PII.
          *   *Procedure Application:* The labeller is actually *more* correct regarding the *spirit* of PII (re-identifiability) than the literal guideline.
          *   *Action:* Rewrite guideline to focus on "Re-identification Risk" rather than a static list. Re-label cost is real.
      *   **Case C (Toxicity/Context):**
          *   *Analysis:* Sarcasm and quoting slurs are inherently subjective.
          *   *Procedure Application:* No "correct" reading. This is a policy choice.
          *   *Action:* Stipulate a tie-breaker (e.g., "When in doubt, flag") or Escalate for policy definition.

  5.  **Refining the Output:**

      *   *Tone Check:* Needs to sound like it comes from someone who understands the grind. No fluff.
      *   *Constraint Check:* Did I avoid Kappa? Yes. Did I flag judgement calls? Yes. Did I estimate costs? Yes.
      *   *Philosophy Check:* Acknowledge the Wittgenstein point without getting bogged down in it. The "Skeptical Solution" is essentially "Community Consensus," which in business terms is "Escalation to Stakeholder."

  6.  **Developing the "What This Cannot Do" Section:**

      *   It cannot eliminate ambiguity.
      *   It cannot predict every edge case.
      *   It cannot replace the need for client engagement.
      *   Stop wanting "Perfect Guidelines." Want "Governable Ambiguity."

  7.  **Final Review against User Prompt:**

      *   "Procedure I can actually run... in a couple of hours." -> Keep steps actionable.
      *   "Flag which steps are judgement calls." -> Use bold/italics.
      *   "Run it on three cases." -> Ensure specific application.
      *   "Tell me what this procedure cannot do." -> Final section.
      *   "Cost justification." -> Include time estimates.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Suggest a workshop for every guideline.
      *   *Correction:* User said "couple of hours between spec and calibration." A full workshop isn't feasible. Make it a "Solo Stress Test" + "Calibration Debrief."
      *   *Initial thought:* Tell them to fire the labeller in Case A.
      *   *Correction:* No, the prompt says the labeller is consistent. Firing them just gets a new labeller with a *different* hidden rule. The problem is the spec.
      *   *Refining Case B:* The user wants to know if they should re-label 4000 items. The procedure needs to be brave enough to say "Yes, if the risk is high."

  9.  **Final Polish:** Ensure the distinction between "Error" (didn't read) and "Divergence" (read differently) is sharp. This is the crux of the Wittgenstein point.

  *(Self-Correction on Costing)*: Be specific. "2 hours" for the pre-check. "0.5 days" for a mini-calibration. "1 day" for client escalation loop.

  *(Self-Correction on Tone)*: The user is intelligent and frustrated. Don't patronize. Match their level of insight.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is the operational translation of the Rule-Following Paradox. You are correct: your labellers are not failing to understand the rule; they are successfully inferring *a* rule that fits the data you gave them, but it isn't *the* rule you intended. Kappa measures consistency, not validity. If everyone consistently follows the wrong hidden rule, your Kappa is 1.0 and your product is broken.

  Here is the **Pre-Mortem & Divergence Protocol**. It is designed to surface hidden rules before they scale, and to triage them when they do.

  ---

  ### Part 1: The Pre-Mortem Protocol (Timebox: 2 Hours)
  *Run this on the spec before it ever reaches a freelancer.*

  **Step 1: The "Quus" Search (30 mins)**
  Do not read the guideline to understand it. Read it to break it.
  *   **Action:** Take every positive definition (e.g., "Flag if customer mentions cancelling") and write down three scenarios that fit the *text* but violate the *intent*.
  *   **Look for:** Negation ("I won't cancel"), Hypotheticals ("I might cancel"), Past Tense ("I cancelled last year"), and Third-Party ("My wife wants to cancel").
  *   **Output:** A "Negative Constraint List" added to the guideline. (e.g., "Do NOT flag hypotheticals, past tense, or third-party mentions.")
  *   **[JUDGEMENT CALL]:** Deciding which edge cases are common enough to matter. You are guessing at the data distribution here.

  **Step 2: The "Why" Calibration (45 mins)**
  Run your standard calibration batch (40 items), but change the input requirement.
  *   **Action:** Labellers cannot just submit a label. They must select a "Reason Code" or write a 5-word justification for every item.
  *   **Analysis:** Ignore the labels for a moment. Compare the *justifications*.
  *   **Signal:** If Labeller A and Labeller B both label Item 12 as "Escalate," but A writes "Customer said cancel" and B writes "Customer is angry," you have a divergence masked as agreement.
  *   **Action:** If justifications diverge on >20% of items, halt. Rewrite the guideline to address the *reasoning*, not the label.

  **Step 3: The "Non-Native" Stress Test (30 mins)**
  *   **Action:** Hand the guideline to the office staff member with the weakest English proficiency (or use a translation tool and back-translate).
  *   **Look for:** Idioms, cultural context, or complex sentence structures that require "common sense" to parse.
  *   **Fix:** Simplify syntax. "If X, then Y" is safer than "X should be Y unless Z."
  *   **[JUDGEMENT CALL]:** Determining if a nuance is "language" or "concept." If they can't understand the sentence, simplify it. If they understand the sentence but disagree on the application, that's a spec problem, not a language problem.

  **Step 4: The Divergence Threshold Definition (15 mins)**
  Before production starts, define what counts as "Noise" vs. "Systematic Drift."
  *   **Rule:** A divergence is **Noise** if it is random across items and labellers.
  *   **Rule:** A divergence is **Systematic** if one labeller (or a subset) deviates on a specific *type* of item (e.g., all hypotheticals) consistently.
  *   **Threshold:** 3 consistent divergences on the same semantic pattern triggers a **Stop & Triage**. Do not wait for the batch to finish.

  ---

  ### Part 2: The Triage Matrix (When Disagreement Hits)
  *Use this when the "Stop & Triage" threshold is triggered.*

  | Symptom | Diagnosis | Action | Ownership |
  | :--- | :--- | :--- | :--- |
  | **Random errors** on items covered clearly in examples. | **Training/Attention.** Labeller missed the rule. | Retrain individual. No spec change. | Ops Lead |
  | **Consistent deviation** on items *not* in examples (e.g., hypotheticals). | **Hidden Rule Inference.** Labeller filled a gap you left open. | **Rewrite Guideline.** Add explicit constraint. | Ops Lead |
  | **Consistent deviation** on items where the spec is vague (e.g., "toxic tone"). | **Spec Indeterminacy.** No fact of the matter exists in the text. | **Stipulate or Escalate.** (See below) | Client / Ops Lead |
  | **Labeller spots a risk** you missed (e.g., PII re-identification). | **Spec Failure.** The guideline is technically unsafe. | **Halt & Rewind.** Fix spec, re-label affected data. | Client (Risk) |

  **Decision Tree for Resolution:**
  1.  **Is there a "Correct" answer based on safety/legal?**
      *   Yes → **Rewrite.** The guideline was wrong. Re-label affected data.
      *   No → Go to 2.
  2.  **Is the divergence affecting >10% of volume?**
      *   Yes → **Escalate to Client.** "We have two valid interpretations. Which do you want?" (Pass the risk).
      *   No → **Stipulate.** Ops Lead makes an arbitrary call for consistency. Document it as a "Local Rule."

  **[JUDGEMENT CALL]:** The "10% Volume" threshold. This is purely economic. Below 10%, the cost of re-labeling + client comms outweighs the model noise. Above 10%, the model training is compromised.

  ---

  ### Part 3: Running the Protocol on Your Cases

  #### Case A: Escalation (Hypothetical Cancellation)
  *   **Symptom:** Labeller consistently ignores hypotheticals ("nothing would make me cancel").
  *   **Protocol Step:** Triage Matrix → **Spec Indeterminacy.**
  *   **Analysis:** The text says "mentions cancelling." The labeller inferred "mentions *intent* to cancel." Both are valid readings of the text. Your examples likely didn't include hypotheticals, so the labeller filled the gap using common sense (don't escalate non-threats).
  *   **Verdict:** This is **not** a labeller error. This is a **Client Risk** decision.
  *   **Action:** **Escalate.**
      *   *Message to Client:* "The spec says 'mention cancellation.' Labellers are splitting on hypothetical mentions ('I would cancel'). Do you want false positives (flag hypotheticals) or false negatives (ignore them)? This affects volume by approx 15%."
  *   **Cost:** 4 hours (Drafting query + Client response time).
  *   **Why:** You cannot stipulate this. If you flag hypotheticals, the client's support team gets annoyed. If you don't, they miss at-risk customers. That is a business logic choice, not an annotation choice.

  #### Case B: PII (Re-identification Risk)
  *   **Symptom:** Labeller flags Name + Village Postcode / Small Company Job Title.
  *   **Protocol Step:** Triage Matrix → **Spec Failure (Safety).**
  *   **Analysis:** The guideline listed categories. The labeller inferred the *principle* (Re-identifiability). In a village of 300, Name + Postcode *is* PII, even if "Postcode" wasn't explicitly flagged as high-risk in your generic list.
  *   **Verdict:** **The Guideline is Broken.** The labeller is actually right regarding the *goal* of PII masking, even if they violated the *letter* of your specific list.
  *   **Action:** **Halt & Rewind.**
      *   *Message to Client:* "Our static list under-specified re-identification risk in low-population contexts. We must update the guideline to 'Any combination allowing re-identification' rather than a static list."
      *   *Re-label:* Yes. You must re-label the 4,000 items.
  *   **Cost:** 2 days (1 day to rewrite/test, 1 day to re-label).
  *   **Why:** If you talk yourself into a patch, you risk a data breach. PII is a hard constraint. If the honest output is that the guideline is broken, you must eat the cost. A data leak costs more than 2 days of labour.

  #### Case C: Toxicity (Sarcasm & Quoted Slurs)
  *   **Symptom:** Team won't converge. Both readings defensible.
  *   **Protocol Step:** Triage Matrix → **Spec Indeterminacy + High Volume.**
  *   **Analysis:** Sarcasm and reclamation are culturally subjective. There is no "fact of the matter."
  *   **Verdict:** **Stipulate or Escalate.**
  *   **Action:** **Stipulate (with Client Awareness).**
      *   *Internal Rule:* "When intent is ambiguous between sarcasm and sincerity, default to 'Toxic'." (Safety bias).
      *   *Internal Rule:* "Quoted slurs for educational/objection purposes are 'Not Toxic'." (Context bias).
      *   *Documentation:* Log these as "Local Rules" in your weekly report to the client.
  *   **Cost:** 0.5 days (Internal consensus workshop).
  *   **Why:** You cannot wait for the client to define sarcasm. They don't know either. You must own the consistency. Mark these items with a specific tag so the model can learn the uncertainty later.

  ---

  ### Part 4: What This Procedure Cannot Do (And What to Stop Wanting)

  **1. It cannot eliminate the "Leap."**
  Wittgenstein's point is that applying a rule to a *new* case always requires a leap of judgement. No amount of pre-writing removes the need for human interpretation.
  *   **Stop Wanting:** A guideline that requires no judgement.
  *   **Start Wanting:** A governance structure that catches judgement calls quickly.

  **2. It cannot distinguish "Smart Labeller" from "Rogue Labeller" without context.**
  In Case B, the labeller looked rogue (ignoring the list) but was actually smarter (spotting the risk). In Case A, the labeller looked smart (using common sense) but was actually rogue (ignoring the literal spec).
  *   **Stop Wanting:** Blind adherence to the spec.
  *   **Start Wanting:** "Reason Codes" (from Step 2 of Pre-Mortem). You need to see their reasoning to know if they are diverging on *principle* or *carelessness*.

  **3. It cannot solve the "Client Ambiguity" problem.**
  Clients often send specs that are internally contradictory because *they* haven't thought through the edge cases.
  *   **Stop Wanting:** The client to give you a perfect spec.
  *   **Start Wanting:** The contract to allow for "Spec Refinement Windows." Charge for the time spent in the Triage Matrix. If the spec is indeterminate, that is billable consulting time, not annotation error.

  **4. It cannot predict distribution shifts.**
  Your Pre-Mortem assumes the production data looks like your calibration data. It often doesn't.
  *   **Cost Justification:** Budget for **10% "Discovery Batch"** at the start of every project. Label 10% of the real data *before* committing the full team. Run the Divergence Protocol on *that*.
  *   **Time Cost:** Adds 1 day to the timeline.
  *   **Ops Lead Pitch:** "One day of discovery prevents four days of re-labeling. This is insurance."

  ### Summary Checklist for Your Week
  1.  **Monday:** Receive Spec. Run **Pre-Mortem** (2 hours). Add Negative Constraints.
  2.  **Tuesday:** Calibration. Require **Reason Codes**. Check justification alignment, not just label alignment.
  3.  **Wednesday:** Production Start. Monitor first 50 items per labeller.
  4.  **Thursday:** **Divergence Check.** If 3 systematic divergences on one pattern → **Triage**.
  5.  **Friday:** **Resolution.** Rewrite, Stipulate, or Escalate. Document the "Local Rule" created.

  You are not managing labelers; you are managing ambiguity. The procedure above treats ambiguity as a resource to be mined, not a bug to be squashed.
