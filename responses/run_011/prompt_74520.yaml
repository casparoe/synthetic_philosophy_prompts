answer: |-
  **Project Title:** Sensitivity Profiles in Macro-History: A Structural Analysis of Counterfactual Dependence in the Third Reich

  **1. The Question and Its Reformulation**
  The central question driving this project is the familiar counterfactual: Would there have been a Nazi Germany without Hitler? Ordinarily, this is posed as a binary query regarding a fixed outcome. My hypothesis is that this formulation is technically defective because neither the *explanandum* nor the *intervention* is stable. On the outcome side, "Nazi Germany" covers a spectrum ranging from an authoritarian, revanchist regime to a state waging aggressive war, to one executing the industrialised murder of European Jews. My working hypothesis is that the sensitivity of the outcome to the removal of the individual is not a single quantity but a profile that varies with the level of description at which the outcome is fixed. A regime might be robust to the removal of Hitler at the level of "authoritarian nationalism" but highly sensitive at the level of "genocidal antisemitism."

  On the intervention side, physical systems allow us to perturb a control parameter while holding the remainder fixed. In a single, unrepeatable, partly self-constituting historical system, it is not obvious that any such holding-fixed is available, since the background conditions one wishes to keep constant are themselves among the things the individual influenced. In condensed matter physics, near a critical point, perturbations are not screened off but propagate; far from criticality, macroscopic behaviour is robust. I suspect that the structuralist and the hero-centred camps are, without acknowledging it, making rival claims about where Germany sat in that sense between 1930 and 1932.

  Consequently, the honest conclusion is that this project is primarily about the structure of macro-historical counterfactuals rather than about Germany *per se*. Germany serves as the stress test because the stakes of the causal attribution are maximal and the historiography is sufficiently dense to support rigorous analysis. The project will pursue the reformulation: *How does the causal weight of individual agency vary as a function of the granularity of the historical outcome being described?*

  **2. Existing Positions and the Open Question**
  The literature leaves this question open because it treats sensitivity as a property of the agent rather than a relation between the agent, the system state, and the description of the outcome. The heroic tradition, following Carlyle, posits the individual as the prime mover, implicitly assuming the system is always near a critical point where small perturbations dictate macro-state. Spencer's objection, that the hero is a product of social conditions, assumes the system is far from criticality, where macroscopic behaviour is robust to individual variation. Both claims are plausible but lack a criterion for distinguishing the regimes.

  The pragmatist distinction between a leader whom events elevate and one who makes events captures this intuitively but lacks a formal mechanism for adjudication. Mid-century historians largely dismissed counterfactual history as unserious, a position that protected the discipline from speculative fiction but stalled analysis of causal weight. The revival from around 1990, including the collection edited by Ferguson and the study of plausible worlds, restored legitimacy to the counterfactual but often focused on narrative plausibility rather than structural sensitivity. Later systematic critiques by historians of the Third Reich emphasized the "minimal rewrite" rule: a counterfactual must alter as little of the actual past as possible.

  While methodologically sound, the minimal rewrite requirement does not solve the description-relativity problem. One can minimally rewrite the past to remove Hitler, but the resulting world depends entirely on how one defines the "Nazi" outcome. If the outcome is defined as "war in the East," structural pressures may dominate. If defined as "the Holocaust," the specific ideological vector of the leader may be indispensable. Existing positions get the narrative right but miss the topological nature of the causal claim. The sensitivity question survives because no prior framework accounts for the scale-dependence of historical causation.

  **3. Method and Phasing**
  The project will proceed over twenty-four months in four six-month phases, relying heavily on a collaborating historian to ensure historiographical validity.

  *Phase 1 (Months 1–6): Conceptual Mapping.* I will work with a collaborating historian of Weimar Germany to formalize the "sensitivity profile." We will define discrete levels of description for the *explanandum* (e.g., regime type, foreign policy, racial policy). The output will be a taxonomy of historical outcomes ranked by granularity.

  *Phase 2 (Months 7–12): The January 1933 Crisis.* We will take the dispute over whether economic crisis or the miscalculation of the conservative elite did the decisive work in Hitler's appointment as a test case. I will extract the causal claims from both functionalist and intentionalist accounts. A sensitivity profile here looks not as a formula, but as a written argument mapping which causal chains break if Hitler is removed versus which chains remain invariant due to structural pressure from the elites or the economy.

  *Phase 3 (Months 13–18): Extermination Policy.* We will examine the dispute over the relative weight of ideology, bureaucratic momentum, and cumulative radicalisation in the origins of extermination policy. This tests the high-sensitivity end of the spectrum. The collaborator is indispensable here to ensure I do not misread the evidentiary basis for "cumulative radicalisation" versus "direct order."

  *Phase 4 (Months 19–24): Synthesis.* We will integrate the case studies into a general account of counterfactual structure. The collaborator's role shifts from corrective to co-authorial on the historical chapters, while I lead the philosophical synthesis.

  **4. Alternative Approaches**
  Three obvious alternatives were considered and rejected. First, agent-based simulation of Weimar politics. While this offers the appearance of rigor, it requires parameterising social variables that are not quantifiable. This yields false precision; the model would reflect the physicist's assumptions rather than historical reality. Second, taking a side in the existing debate (e.g., arguing strictly for structuralism). This fails to address the meta-question of why the debate persists. It solves a historical problem but ignores the philosophical one. Third, purely conceptual analysis of causation and counterfactuals with no historical case attached. This risks becoming ungrounded scholasticism.

  The case-study route supplies friction that the others cannot. It forces the philosophical vocabulary to confront evidentiary constraints. If the "sensitivity profile" cannot distinguish between the intentionalist and functionalist accounts of the Holocaust using actual historical evidence, the concept is useless. The case study ensures the philosophy remains tethered to the practice of history.

  **5. Disanalogies and Limitations**
  I must confront the disanalogies directly. There is no ensemble of histories, only one realisation. There is no stationarity; the rules of the political system changed between 1930 and 1933. There is no repeatable intervention, and no defensible measure over counterfactual histories. Furthermore, historians rightly reject the covering-law conception of explanation that my vocabulary of "parameters" and "perturbations" might quietly presuppose.

  What survives these objections is not a method of prediction, but a modest reframing of explanation. I do not claim that history obeys statistical laws. I claim that the *logic* of scale-dependence used in physics offers a clearer vocabulary for describing historical disagreement. When a structuralist says "Hitler was irrelevant," they are claiming the system is in a robust phase. When an intentionalist says "Hitler was essential," they are claiming the system is near a bifurcation point. These are not claims about physical laws, but about the topology of causal dependence. Early-warning reasoning—rising variance, critical slowing down—does not transfer intact; one cannot measure the variance of a single history. However, the heuristic of looking for "slowing down" in political decision-making (increasing delay, polarization) as a marker of instability remains a valid qualitative tool. The proposal survives not as a scientistic reduction, but as a conceptual translation that clarifies what historians are already arguing about.

  **6. Results and Failure Conditions**
  A successful result would be a monograph-length essay establishing "sensitivity profiles" as a standard tool for analysing historical counterfactuals, demonstrating that the Great Man vs. Structure debate is a category error arising from fixed-level descriptions. A co-taught seminar with the history department would test this pedagogy.

  Specific failure conditions are necessary. The project fails if: (1) the description-relativity of the answer proves trivial once articulated (i.e., it turns out everyone already knew "it depends on how you define Nazi Germany"); (2) the sensitivity vocabulary can be shown to do no work beyond ordinary causal talk (e.g., "necessary condition" vs. "sufficient condition" suffices); or (3) the charge of scientism is correct rather than merely uncharitable, meaning the physics analogy actively distorts the historical understanding. If the vocabulary does not generate new insights into the specific historiographical disputes of Phase 2 and 3, the project has not justified its interdisciplinary cost.

  **7. Scope and Feasibility**
  I am a seventy-one-year-old outsider working part-time over twenty-four months. I can read German prose but lack archival training or historiographical credentials. This scope is ambitious but manageable if strictly bounded. I will not conduct archival research; the project relies on secondary literature and existing historiographical debates. This is a philosophical analysis of historical writing, not new historical discovery.

  The primary risk is my lack of disciplinary idiom. To mitigate this, the collaboration with a historian is not ornamental but structural. They will vet all historical claims. The risk of "physicist imperialism"—imposing a framework that historians find useless—is real. I mitigate this by framing the physics concepts as heuristic metaphors rather than ontological claims. The time commitment is feasible for a retired scholar, provided the writing schedule is disciplined. The deliverable is not a new history of the Third Reich, but a new logic for reading the histories we already have. If the collaboration holds, the lack of archival training is irrelevant; if the collaboration fails, the project cannot proceed. I have secured a preliminary commitment from a senior historian of modern Germany to advise, contingent on the fellowship award. This ensures the historical component meets disciplinary standards while I focus on the structural analysis.
