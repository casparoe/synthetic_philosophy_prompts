answer: |-
  ### Exam Question

  **Time Allowed:** 50 Minutes
  **Word Limit:** None (Structure and concision will be assessed)

  **Question:**
  Propose a single normative principle governing human intervention in wild animal populations to mitigate suffering. Apply this principle to determine whether the following interventions are morally licensed or forbidden: (1) oral vaccination of wild animals against a newly emerged pathogen; (2) contraceptive control of an overabundant herbivore population; and (3) removal of a predator species from an island.

  In your response, you must:
  1.  Explain why the objection that we cannot foresee ecological consequences is not automatically a reason for inaction in all three cases.
  2.  Argue whether the fact that a harm arises naturally rather than from human activity can carry moral weight without begging the question.
  3.  Confront the possibility that preventing animals from existing at all (via contraception) constitutes an improvement if their lives are net negative.

  ***

  ### Model Answer

  **Principle:** The *Threshold Suffering Principle*: Intervention is obligatory when wild animals face severe, imminent suffering that can be alleviated without causing greater aggregate suffering or systemic ecological collapse.

  **Application:**
  1.  **Vaccination:** Licensed. Pathogens cause intense, indiscriminate suffering. Vaccination is targeted, minimally invasive, and preserves the host population's ecological role while reducing individual misery.
  2.  **Contraception:** Licensed. Overabundance leads to starvation (severe suffering). Contraception prevents the existence of animals who would suffer net-negative lives due to resource scarcity.
  3.  **Predator Removal:** Forbidden. While predation causes suffering, predators regulate ecosystems. Removing them risks trophic cascades that would generate greater suffering (e.g., herbivore starvation) elsewhere, violating the "systemic collapse" clause.

  **Ecological Uncertainty:**
  The "unforeseen consequences" objection relies on a status quo bias. It assumes the current natural state is a safe baseline, ignoring that nature is dynamically unstable. We accept risk in human medicine and climate policy; wild animal ethics requires a proportional risk assessment, not paralysis. In the vaccination case, the risk of ecological disruption is low compared to the certainty of epidemic suffering. In predator removal, the risk is high. Uncertainty mandates caution, not a blanket veto.

  **Naturalness:**
  The distinction between "natural" and "human-caused" harm carries no *intrinsic* moral weight. Suffering is bad regardless of its source; to claim otherwise commits the naturalistic fallacy. However, "naturalness" may have *instrumental* weight. Natural processes (like predation) often sustain the ecological structures that support life overall. We respect them not because they are natural, but because interfering with them often yields worse outcomes. Thus, the origin of harm matters only insofar as it predicts the consequences of intervention.

  **Non-Existence:**
  If a life is net negative (dominated by suffering), non-existence is preferable. This is not a harm to the subject, as there is no subject to be harmed. Contraception avoids the "non-identity problem" by preventing the creation of suffering subjects rather than killing existing ones. If the overabundant herbivores face inevitable starvation, preventing their conception is a moral improvement. We must avoid the intuition that existence is always a gift; for wild animals facing high mortality rates, existence is often a gamble they lose. The principle licenses contraception precisely because it acknowledges that bringing suffering beings into existence is the greater wrong.

  **Conclusion:**
  Intervention is not about dominating nature, but mitigating severe suffering where we can do so responsibly. We vaccinate to stop pain, contracept to prevent net-negative lives, and refrain from removing predators to preserve systemic stability.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **1. Principle & Case Application (10 Marks)**
  *   **A (8-10):** States a clear, actionable principle. Distinctly classifies the three cases (e.g., Vacc/Contra = Yes, Predator = No) with justification linked directly to the principle.
  *   **B (5-7):** States a vague principle (e.g., "reduce suffering"). Treats all three cases the same (all yes or all no) or fails to link the classification to the principle.
  *   **Error (-3):** Fails to address one of the three cases.

  **2. Ecological Uncertainty (5 Marks)**
  *   **A (4-5):** Explains *why* uncertainty is not a veto (e.g., rejects status quo bias, compares risk profiles between cases). Distinguishes between high-risk (predator) and low-risk (vaccine) interventions.
  *   **B (2-3):** Acknowledges uncertainty but treats it as a uniform barrier to all action, or dismisses it too casually without risk analysis.
  *   **Error (-2):** Claims we can fully predict ecological outcomes.

  **3. Naturalness Objection (5 Marks)**
  *   **A (4-5):** Explicitly rejects *intrinsic* weight of naturalness (avoids naturalistic fallacy) but grants *instrumental* weight (ecosystem stability).
  *   **B (2-3):** Argues natural suffering is "okay because it's nature" (begs the question) OR argues nature is "cruel" without addressing the instrumental value of natural processes.
  *   **Error (-2):** Fails to mention the naturalistic fallacy or question-begging.

  **4. Non-Existence/Contraception (5 Marks)**
  *   **A (4-5):** Confronts the implication that non-existence is preferable for net-negative lives. Links this specifically to the contraception case.
  *   **B (2-3):** Mentions contraception prevents suffering but avoids the metaphysical claim that non-existence is an "improvement."
  *   **Error (-2):** Claims preventing birth harms the unborn animal.

  **General Assessment**
  *   **Structure/Clarity:** Deduct 1 mark for poor structure or exceeding time-limit density (illegible/unfocused).
  *   **A Range (20-25):** Philosophically rigorous, hits all four constraints, nuanced distinction between cases.
  *   **B Range (15-19):** Competent knowledge of WAS debate, but misses the specific philosophical "moves" required (e.g., instrumental vs. intrinsic naturalness, risk asymmetry).
  *   **C Range (10-14):** Descriptive rather than argumentative; relies on conservation common sense rather than ethical principles.
