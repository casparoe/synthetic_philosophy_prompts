answer: |-
  Here is the teaching plan, structured to keep the three groups (Art, Maths, Loop-Kid) engaged without letting any single one derail the core distinction.

  ### The Carrying Example: The Voyager Golden Record
  **Why this one:** It is visual (Art), encoded mathematically (Maths), and fundamentally about the conditions of decoding (Your Topic). It is not a sentence (kills author intent), not a pun (kills lexical ambiguity), and not a Rorschach blot (kills "anything goes").

  **What it must have:**
  1.  **The Physical Object:** A high-res image of the gold-plated copper disk and its cover.
  2.  **The Instructions:** The diagram etched on the cover showing how to play it (the Frame).
  3.  **The Content:** A 10-second clip of one of the sounds (e.g., the whale songs or greetings) (the Inner).
  4.  **The Context:** The fact that it was launched into void space for an unknown receiver (the Outer).

  **What it must lack:**
  1.  **Any text in English** on the disk itself (prevents relapse into "what do the words say").
  2.  **Any explanation of what the sounds *feel* like** (prevents relapse into subjective emotion).

  ---

  ### Minute-by-Minute Arc

  **00:00 – 05:00 | The Hook (Killing Author Intent)**
  *   **Action:** Project the image of the Voyager Record cover. Do not tell them what it is yet.
  *   **Script:** "Imagine you find this on a beach. You don't know who made it. You don't know if it's art, trash, or a weapon. Where is the meaning? Is it in the gold? In the grooves? Or in your head?"
  *   **Dependency:** You must establish that the *creator* is absent before you can define the Frame. If they think meaning is "what NASA intended," you cannot proceed.
  *   **Misconception Intercept:** If a student says, "It means whatever NASA wanted," stop immediately. Reply: "NASA is gone. The object remains. If meaning dies with the author, this is just metal. I need you to argue that the meaning is still here."

  **05:00 – 15:00 | Defining the Triad (Using the Example)**
  *   **Action:** Reveal it is a message to aliens. Draw three concentric circles on the whiteboard.
  *   **Inner Message (Centre):** Play the audio clip. "This is the specific data. The whale song. The greeting. It requires a specific decoder (ears, knowledge of Earth biology)."
  *   **Frame (Middle):** Point to the cover diagram. "This is the key. It tells the decoder *how* to extract the Inner. Without this, the Inner is noise. The Frame fixes the reading."
  *   **Outer Message (Ring):** "This is the bit that survives even if the alien can't play the sound. The mere existence of the object says: *'Intelligence exists.'* It is the message about the message."
  *   **Dependency:** You cannot define Outer until they accept that the Frame is separate from the content.
  *   **Misconception Intercept:** If they say, "The Outer message is just the theme," correct them: "No. The theme is part of the Inner. The Outer is the structural fact that a sender exists."

  **15:00 – 25:00 | Stress-Testing the Frame**
  *   **Action:** Pose a hypothetical. "An alien finds the disk but lacks the turntable. They melt it down for jewellery."
  *   **Question:** "Did the message die?"
  *   **Desired Answer:** "The Inner message is lost (no decoder). The Outer message is destroyed (object gone). But while it existed, the Outer message was independent of the Inner."
  *   **Art/Maths Split:**
      *   Ask the **Art** students: "Look at the cover diagram. Is that art or engineering?" (Answer: It is a Frame).
      *   Ask the **Maths** students: "The audio is analogue waves cut into a spiral. Is the music in the shape or the sound?" (Answer: Shape is the Frame/Inner potential, sound is the Inner actualised).
  *   **Misconception Intercept:** If they say, "So meaning is subjective to the decoder," stop. "No. The *decoding* is subjective. The *capacity to be decoded* is objective. The grooves are physically there regardless of the ear."

  **25:00 – 35:00 | Managing the Factions (The Loop Kid)**
  *   **Action:** This is where the "Strange Loop" student will try to pivot to Gödel/Incompleteness.
  *   **Strategy:** Validate but park.
  *   **Script:** "You are spotting that the system refers to itself. That is a higher-order Outer Message. For this session, we are treating the layers as distinct. Hold that thought for the final task; don't collapse the layers yet."
  *   **Why:** This prevents them from humiliating themselves by going too deep too soon, but acknowledges their insight.
  *   **Dependency:** You must secure the basic distinction before allowing self-reference to complicate it.

  **35:00 – 40:00 | The Fudge (Explicit Simplification)**
  *   **Action:** State the limitation out loud.
  *   **Script:** "We have treated Frame, Inner, and Outer as three separate boxes. In reality, they bleed into each other. The Frame often becomes part of the Inner message. We are slicing this for clarity, but you will need to unlearn this rigidity later."
  *   **Why:** Protects your intellectual honesty without confusing the lesson.

  **40:00 – 45:00 | Assessment Task (Application)**
  *   **Task:** Hand out a printed image of a **Tattoo** (e.g., a anchor on a forearm).
  *   **Instruction:** "In one sentence each, identify the Frame, Inner, and Outer messages of this image. You have 3 minutes."
  *   **Success Criteria:**
      *   *Frame:* Skin, ink, cultural semiotics of tattoos.
      *   *Inner:* "I love the sea" or "Stability."
      *   *Outer:* "This human body is marked/claimed."
  *   **Why:** It works for Art (imagery) and Maths (coding on skin). It is not a sentence. It requires the distinction to answer.

  ---

  ### The Misconception Map

  | Misconception | Origin | Interception Point | How to Head It Off |
  | :--- | :--- | :--- | :--- |
  | **"Meaning = Author Intent"** | School literary analysis habits. | **Min 05:00** (The Hook) | "NASA is gone. If meaning requires them, this disk is dead metal. Prove it isn't." |
  | **"Meaning = Subjective Feeling"** | Art/Design relativism. | **Min 15:00** (Stress Test) | "If I melt the disk, your feeling doesn't matter. The physical capacity to mean is gone. Meaning is structural, not just emotional." |
  | **"Frame = Just Context"** | Vague colloquial usage. | **Min 10:00** (Defining Triad) | "Context is atmosphere. Frame is the *key*. Without the cover diagram, the disk is noise. A key is not context; it is a tool." |
  | **"Outer = Theme"** | Confusing meta-message with content. | **Min 12:00** (Defining Outer) | "The theme is *what* is said. The Outer is *that* it is said. Distinguish the song from the fact of the singer." |
  | **"This is just Gödel"** | The Loop Kid's enthusiasm. | **Min 25:00** (Factions) | "That is Level 2. We are building Level 1. Park the paradox until the end." |

  ---

  ### The Fallback Plan

  **How to know within 90 seconds it hasn't landed:**
  Ask: **"If I throw this record into the sun, where does the music go?"**
  *   **Bad Sign:** If they say "It disappears" or "It was never really there." (They conflate Inner/Outer or think meaning is purely mental).
  *   **Good Sign:** If they say "The ability to play it is gone, but the information was in the structure."

  **The Fallback Example:**
  If Voyager feels too abstract or "spacey" for the room, switch immediately to **A Menu in a Language They Don't Know** (e.g., Japanese).
  *   **Frame:** Knowing it's a list of food with prices.
  *   **Inner:** The specific dish (unknowable without translation).
  *   **Outer:** "This is a restaurant that serves commerce."
  *   **Why:** It's more immediate. The "Author Intent" trap is harder to set here (who is the author? the chef? the printer?), which might actually help you.

  ---

  ### What to Leave Out (And Say So)

  **The Simplification:**
  The distinction between Frame and Inner is far messier in reality. In GEB, Hofstadter often shows how the Frame *becomes* the message (the map is the territory). For a 45-minute intro, you must pretend they are separable.

  **The Sentence to Fudge It With:**
  > "We are treating these as three separate compartments for the sake of this argument, but in the wild, they are a single tangled knot; do not walk away thinking nature respects our boundaries."

  **The GEB Specifics:**
  Do not attempt to explain *Contracrostipunctus* or the specific "record destroys player" joke. It requires knowing the book's structure to land. Stick to the general principle of "Message about the System." If the Loop Kid brings it up, acknowledge it as a specific instance of the Outer Message, but do not build the lesson around it.

  ### Final Note on the Assessment
  Do not accept "The tattoo means loyalty" as an answer for Outer Message. That is Inner (symbolism). Push them until they say "The tattoo means *this person belongs to a group*." That is the structural survival of meaning. If they can make that distinction on the tattoo, they have got the lesson.
