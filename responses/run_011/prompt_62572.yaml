answer: |-
  Here is the audit of the money analogy, broken down by the specific mechanical parts of the argument.

  ### 1. The Correspondence Audit

  Your friend's argument relies on mapping the mechanics of **Fiat Currency** onto the mechanics of **Racial Categorization**. Here is the explicit mapping of the slots:

  | Slot | In Money (Source) | In Race (Target) | Status of Match |
  | :--- | :--- | :--- | :--- |
  | **Physical Substrate** | Cotton-linen blend paper / Digital entry | Phenotype (skin, hair, bone structure) | **Good.** Both are physical things that acquire meaning. |
  | **The Status** | "Value" / Purchasing Power | "Race" / Social Meaning | **Good.** Both are properties not inherent to the substrate. |
  | **Collective Acceptance** | People agree to trade goods for it. | People agree to categorize/treat based on it. | **Good.** Both require a social network to function. |
  | **Issuing Authority** | Central Bank / Treasury / State | **EMPTY.** (No current Central Bank of Race). | **FAIL.** |
  | **The Backing** | Trust in the State / Legal Tender Laws / Tax obligation. | **EMPTY.** (Backed by history/violence/perception, not trust). | **FAIL.** |
  | **Reversibility** | Demonetization / Currency Reform (can be done by decree). | **EMPTY.** (Cannot be done by decree). | **FAIL.** |
  | **Holder Neutrality** | A $20 bill works the same for anyone holding it. | **FALSE.** Race is specifically *about* who holds it. | **FAIL.** |

  ### 2. The Empty Slots (Where the Analogy Snaps)

  You suspected there were empty slots. There are three critical ones, and they are not decorative; they are structural.

  **A. The Issuing Authority**
  Money has a printer. If the Fed says "This is now worth 10% of what it was," the market adjusts. Race has no printer. It was historically legislated (one-drop rules, naturalization acts), but those laws are largely gone. Today, race is maintained by diffuse social practice, not a central desk. You cannot appeal to the "Federal Reserve of Whiteness" to reissue your status.

  **B. The Backing**
  Money is backed by *trust in the future stability of the issuer*. If that trust breaks, the money fails (hyperinflation). Race is not backed by trust; it is backed by *perception and material inertia*. Even if everyone "lost trust" in the concept of race tomorrow, the physical markers (skin color) would still trigger the social reflex, and the material disparities (wealth gaps) would persist. Money fails if you stop believing in it. Race persists even if you stop believing in it (because racism is often structural, not just belief-based).

  **C. Holder Neutrality**
  This is the one you raised. Money is fungible; a $20 bill does not care who holds it. Race is *indexical*; it matters profoundly *who* is racialized. The "value" of race is not a neutral medium of exchange; it is a hierarchy of access. The analogy treats race like a *medium* (money), but race functions more like a *toll booth* (some get waved through, some get searched).

  ### 3. Evaluating the Two Conclusions

  Your gut is correct: your friend is using the analogy to do two different jobs, and it only succeeds at the first one.

  **Conclusion 1: "Asking 'do races exist?' is a confused question."**
  *   **Verdict:** **Survives.**
  *   **Why:** This conclusion relies only on the **Status** and **Collective Acceptance** slots. Since money is real-but-not-natural, and race maps well to those two slots, the ontological point holds. Race is causally potent (it ruins lives, opens doors) without being biologically essential. The lack of an Issuing Authority doesn't stop money from existing, so it doesn't stop race from existing.
  *   **Cost:** She got this point "cheap," as you suspected. She only needed the "social agreement" part of money to make this work.

  **Conclusion 2: "We can fix this by changing the practice, like currency reform."**
  *   **Verdict:** **Fails.**
  *   **Why:** This conclusion relies entirely on the **Issuing Authority** and **Reversibility** slots. Currency reform works because a Central Authority can declare the old status void and the new status valid, and the "Backing" (trust in the state) ensures people comply.
  *   **The Snap:** Because Race has no Issuing Authority and is not backed by trust, you cannot "declare" a reform. You cannot demonetize a phenotype. The "empty slots" identified above are exactly what make currency reform possible and racial reform impossible via the same mechanism.
  *   **Cost:** She paid for this point with the "Authority" part of money, which doesn't exist in the race case.

  **Summary:** She used the *decentralized* nature of money (collective agreement) to prove races are real, but then switched to the *centralized* nature of money (government decree) to prove races can be fixed easily. That is the bait-and-switch.

  ### 4. The Smuggled Premise

  You identified this perfectly: **"Constructed" is smuggling in "Designed."**

  *   **The Premise:** "If humans constructed it, humans can deconstruct it at will."
  *   **The Smuggle:** This premise is true for **Artifacts** (like money, laws, buildings). It is false for **Ecologies** (like language, erosion, culture).
  *   **Where it breaks:** Money is an Artifact. It is engineered. Race is an Ecology. It emerged from historical processes, sedimented into law and custom, and is now self-perpetuating.
  *   **Dependency:** Her second conclusion ("fix it like currency reform") depends entirely on the smuggled premise that Race is an Artifact. If Race is an Ecology, you cannot "reform" it; you have to "restore" or "manage" it, which is a much slower, messier process that cannot be done by decree.

  ### 5. A Better Analogy

  Money is the wrong source domain because it implies *engineering* and *reversibility*. You want a source domain that is **Real, Socially Constructed, but Hard to Change and Unauthored.**

  **The Better Analogy: Language (specifically Accent/Dialect)**

  *   **Physical Substrate:** Sound waves / Vocal cords (matches Phenotype).
  *   **Status:** "Intelligible" vs. "Uneducated" / "Standard" vs. "Vernacular" (matches Racial Status).
  *   **Collective Acceptance:** We agree certain sounds mean things; we agree certain accents signal class/region (matches Social Agreement).
  *   **Issuing Authority:** **None.** There is no Central Bank of English. (Matches Race).
  *   **Backing:** Habit and history, not trust. (Matches Race).
  *   **Reversibility:** **Low.** You cannot declare by decree that a regional accent is now "standard" and have it stick overnight. It takes generations. (Matches Race).
  *   **Holder Neutrality:** **False.** An accent attaches to a specific person and carries baggage about their origin. (Matches Race).

  **Why this works better for your argument:**
  1.  **Ontology:** Nobody asks "Do accents exist?" They are real, they affect your life (hiring discrimination based on speech is well-documented), but they aren't biological essences. (Supports Conclusion 1).
  2.  **Policy:** You cannot fix accent discrimination by "currency reform." You can't issue a press release saying "Southern accents now have equal status." You have to change the deep-seated cultural associations over a long period. (Refutes Conclusion 2).
  3.  **No Smuggle:** Nobody thinks language was "designed" by a committee that can just redesign it. It acknowledges the "constructed but not designed" nature of race.

  ### Final Ruling

  Your friend won the ontological debate (Race is real but constructed) but lost the pragmatic debate (Race can be fixed like policy).

  The money analogy supports the first claim because money is indeed a social status attached to physical stuff. But it actively undermines the second claim because money's value is *fiduciary* (based on trust in an issuer), whereas race's "value" is *extractive* (based on resource distribution and visual perception). You can change trust by decree; you cannot change resource distribution and visual perception by decree.

  She got the first conclusion for free using the "Collective Acceptance" slot. She tried to buy the second conclusion using the "Issuing Authority" slot, but that slot is empty in the target domain. The analogy snaps exactly there.
