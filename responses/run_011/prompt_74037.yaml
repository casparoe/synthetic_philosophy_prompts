answer: |-
  ### Brainstorm: Pressure Points & Strategy

  Her view attempts to salvage meritocracy by shifting the locus of desert from *talent* to *sacrifice relative to a baseline*. The primary vulnerability is that this merely relocates the arbitrariness objection rather than solving it. The capacity to sacrifice (willpower, resilience, risk tolerance) is itself unequally distributed via the natural and social lottery. If she controls for this via proxies (income, school), she conflates statistical equality of opportunity with individual moral desert, reducing her theory to incentive design. Furthermore, by decoupling desert from output, she risks inverting common intuitions: the struggler who produces little may deserve more than the天才 who produces much. This makes the view politically unstable—if meritocracy doesn't reward social value, why keep the name? The "reasonable counterfactual" is also metaphysically murky; if it's not the agent's best alternative, who sets it? If it is fixed at age fourteen, it ignores path dependence where prior rewards alter future baselines. Your strategy should be to force her to choose between this being a moral theory (which fails on the regress objection) or a policy tool (which fails on the desert claim). Do not let her hide behind the *pro tanto* clause; press whether the desert claim exists independently of the institutional need to override it.

  ***

  ### Interview Questions

  **1. [ESSENTIAL] Let's start with the magnitude of the claim. On your account, a severely ill person from a poor background who struggles to hold down a modest job may have a far higher 'shortfall' than a brilliant surgeon who reached the top with ease. Are you truly prepared to say the struggler deserves a larger share of social resources than the surgeon, simply because the surgery cost them less?**
  *Strategic Note: She will say yes, that's the point of ignoring talent. | Follow-up: Then you aren't defending meritocracy, which implies rewarding social contribution, but rather a kind of effort-worship that could bankrupt the system you're trying to justify.*

  **2. Consider the person who sacrifices everything for a venture that fails—a researcher on an unfashionable topic or an entrepreneur who goes bust. Their output is zero, so their shortfall is zero or negative. Is their desert also zero, and can you live with that given your pitch is that meritocracy shouldn't be purely output-based?**
  *Strategic Note: She will claim they deserve compensation for the loss. | Follow-up: But your formula ties desert to production over a baseline; if there's no production, there's no shortfall desert, so you're smuggling in a separate principle of compensation.*

  **3. There's a problem of path dependence. If I sacrifice now and get rewarded, my future baseline rises, meaning the same sacrifice counts for less next time. Does your theory not effectively penalise people for having been rewarded previously, punishing success rather than encouraging it?**
  *Strategic Note: She will say baselines are fixed at age fourteen via proxies. | Follow-up: But real opportunities change based on prior rewards; fixed proxies ignore dynamic disadvantage, so your measurement fails to track the actual moral reality you claim to care about.*

  **4. You need a filter for what counts as a sacrifice. Refusing a bribe, caring for a relative, or training for a sport you'll never win all involve cost. How do you distinguish morally worthy sacrifices from mere stubbornness without secretly letting normative judgments about output back in through the back door?**
  *Strategic Note: She will say only socially useful sacrifices count. | Follow-up: Then output is doing the work again; you haven't escaped the productivity trap, you've just hidden the criterion inside the definition of sacrifice.*

  **5. [ESSENTIAL] The regress worry: the capacity to defer gratification and stick with things is itself an unequally distributed natural asset, much like IQ. Haven't you simply relocated the arbitrariness objection rather than answered it, and where is the principled stopping point?**
  *Strategic Note: She will say we control for circumstances via proxies. | Follow-up: Proxies are crude statistical tools, not moral measures; internal psychological capacity remains unobserved and arbitrary, so the luck objection still stands.*

  **6. Is this view really about desert, or is it just incentive design wearing a moral costume? If it's the latter, what do you lose—in particular, can you still say someone deserves more than the rules entitle them to if the incentives change?**
  *Strategic Note: She will insist it's pre-institutional moral worth. | Follow-up: But if institutions can't observe counterfactuals and must use proxies, it's purely instrumental policy, so the claim to pre-institutional desert collapses.*

  **7. An economist in the room will insist this is just the old equality-of-opportunity trick of scoring effort relative to circumstances, with the word 'desert' stapled on the front. Relatedly, isn't a golf handicap a better model of what you've built, since we don't say the handicap winner deserves the trophy?**
  *Strategic Note: She will say handicaps are purely instrumental, unlike desert. | Follow-up: But if you rely on proxies rather than true counterfactuals, you're running a handicap system; if you won't admit that, you're confusing policy with metaphysics.*

  **8. Michael Young coined 'meritocracy' as a satire where merit was IQ plus effort. You've dropped the IQ term entirely. If you've removed the element that makes meritocracy elitist, are you still a meritocrat, or have you given up on merit and kept the word for comfort?**
  *Strategic Note: She will say she's rescuing the norm, not the history. | Follow-up: Then why keep the toxic label? It suggests you haven't actually solved the elitism problem, you've just redefined the terms to avoid the criticism.*

  **9. Finally, put your cards on the table. What would make you abandon the view—a specific case, an argument, or something about measurement? And don't tell me you'd just tweak the proxies; I want to know what would break the theory.**
  *Strategic Note: She will suggest a measurement failure. | Follow-up: If measurement breaks it, it was never a moral theory about desert, but a hypothesis about administration; admit that and we can stop pretending this solves the luck objection.*
