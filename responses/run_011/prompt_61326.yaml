answer: |-
  **Question 1**
  *   **Theme:** 1 (Active Affairs)
  *   **Voice:** Cato
  *   **Pressure Point:** You argue that the old withdraw from physical labor to supply counsel and authority, but that assumes a senate or a council that waits for your word.
  *   **Likely Answer:** He will reply that authority rests on wisdom and reputation, not on office, and that a wise man is never without a forum because his household and neighbors seek his judgement.
  *   **Follow-up:** If a listener's household treats his counsel as noise and his neighbors do not ask, is his authority gone, or do you say his character is simply too weak to command respect?

  **Question 2**
  *   **Theme:** 4 (Pleasure)
  *   **Voice:** Cato
  *   **Pressure Point:** You claim the loss of appetite is a liberation from tyranny, yet for many the loss of taste is experienced as a diminishment of life.
  *   **Likely Answer:** He will reply that the pleasures of the table are childish and that the old enjoy finer pleasures, such as conversation and the cultivation of the land, which do not fade.
  *   **Follow-up:** You must choose: is the joy in the *not-wanting* of the feast, or in the *not-having* of it? If a man mourns the loss, is he mourning the tyranny or the feast?

  **Question 3**
  *   **Theme:** 5 (Memory/Mind)
  *   **Voice:** Cato
  *   **Pressure Point:** You compare the mind to a muscle that fails only if not exercised, citing old men who remember everything.
  *   **Likely Answer:** He will reply that memory is preserved by attention and that no old man has ever forgotten where he buried his money, proving the mind remains sharp where interest remains.
  *   **Follow-up:** If a man exercises his memory daily and it fails regardless, does your rule condemn him as lazy, or must you admit the rule is false?

  **Question 4**
  *   **Theme:** 3 (Exempla)
  *   **Voice:** Cato
  *   **Pressure Point:** You offer a list of famous old men—farmers, generals, playwrighters—who remained vigorous to prove age is no burden.
  *   **Likely Answer:** He will reply that these men are evidence of what is possible for human nature, showing that age does not necessarily crush the spirit.
  *   **Follow-up:** If these men are exceptions who survived the filter of wealth and health, why build a rule for everyone on the few who had the means to survive?

  **Question 5**
  *   **Theme:** 6 (Death)
  *   **Voice:** Cato
  *   **Pressure Point:** You argue death is no evil: either the soul perishes and feels nothing, or it survives and is better off.
  *   **Likely Answer:** He will reply that both outcomes are acceptable to the rational man, for one is sleep without dreams and the other is a journey to a better place.
  *   **Follow-up:** You ignore the fear of the *process* of dying, not the state of being dead; does your logic comfort the man in pain *before* the end, or only the corpse after it?

  **Question 6**
  *   **Theme:** 2 (Character vs. Age — Definition)
  *   **Voice:** Cato
  *   **Pressure Point:** You insist that complaints against old age are really confessions about the complainer's character.
  *   **Likely Answer:** He will reply that a well-spent life makes old age tolerable and that only the foolish and ill-tempered find their years a burden.
  *   **Follow-up:** What would count, on your own view, as a grievance genuinely attributable to age rather than to character, and can you name one?

  **Question 7**
  *   **Theme:** 8 (Standpoint — Resources)
  *   **Voice:** Cicero **[FLAGGED]**
  *   **Pressure Point:** The consolations you offer—estates, clients, books, senatorial authority—all belong to a propertied Roman male.
  *   **Likely Answer:** He will reply that the precepts of wisdom are universal, though the circumstances of their application vary, and that virtue is independent of wealth.
  *   **Follow-up:** But your specific remedies cost money; if I lack the means for your remedies, is your cure useless to me, and do you admit that?
  *   **Why Flagged:** If he answers as Cato, he can maintain the fiction that virtue is enough. If he answers as Cicero, he must admit the class bias of the text. This forces the admission that matters most to the audience.

  **Question 8**
  *   **Theme:** 2 (Character vs. Age — Testability)
  *   **Voice:** Cicero
  *   **Pressure Point:** If every complaint can be blamed on the character of the complainer, the theory seems immune to contradiction.
  *   **Likely Answer:** He will reply that the truth of the matter is evident to any rational observer who looks at the lives of good men.
  *   **Follow-up:** If a claim is immune to that distinction, can it be tested by anyone, or is it a protection for the argument rather than a comfort for the listener?
  *   **Expendable:** Yes. (See note at end).

  **Question 9**
  *   **Theme:** 7 (Philosophical Method — Voice)
  *   **Voice:** Cicero **[FLAGGED]**
  *   **Pressure Point:** You write as an Academic who claims certainty about nothing, yet Cato speaks with dogmatic confidence about the soul's divine nature.
  *   **Likely Answer:** He will reply that in a dialogue one adopts a mask suitable to the speaker, and Cato's character demands confidence.
  *   **Follow-up:** Does the mask allow you to claim certainties you do not believe, and is that honest consolation or rhetorical trickery?
  *   **Why Flagged:** This is the pivot from the character to the author. It forces him to admit whether the comfort offered is philosophically honest or merely therapeutic.

  **Question 10**
  *   **Theme:** 7 (Philosophical Method — Consistency)
  *   **Voice:** Cicero
  *   **Pressure Point:** The year before this dialogue you argued death is no evil even if the soul perishes, whereas here the weight falls on survival.
  *   **Likely Answer:** He will reply that different arguments suit different occasions and that he offers what is most likely to comfort the listener.
  *   **Follow-up:** If the truth changes with the context, is it truth or medicine, and which argument would you want held up to you at the end?
  *   **Expendable:** Yes. (See note at end).

  ***

  **Closing Question**
  *   **Placement Advice:** Place this **after** the ten questions.
  *   **Cost:** If placed before, it humanizes Cicero too early, softening the cross-examination and allowing him to deflect the harder questions with an appeal to his grief. If placed after, it serves as an emotional coda that recontextualizes the rigour of the previous ten questions; the cost is that it may feel like an add-on rather than part of the argument.
  *   **The Question:** You wrote this in the year after your daughter's death, addressed to a friend with whom the gift could be shared, saying the composition wiped away the annoyances of your own old age. Can a work composed as self-consolation function as an argument for others, and what should a listener make of a defence of old age whose author was sixty-two, politically sidelined, and grieving?

  ***

  **Expendable Questions**
  If you must cut two questions, remove **Question 8** and **Question 10**.
  *   **Why Question 8:** It covers the second half of Theme 2 (Testability). Question 6 covers the first half (Definition), which is more visceral for the audience. The "Testability" point is logically stronger but less emotionally resonant than the "Definition" point.
  *   **Why Question 10:** It covers the second half of Theme 7 (Consistency with *Tusculan Disputations*). Question 9 covers the first half (Voice/Skepticism), which is more accessible. The inconsistency between books is a matter of scholarly record, whereas the use of the "Cato mask" is a matter of immediate honesty.

  **Note on Themes:**
  1.  **Active Affairs:** Handled in Q1.
  2.  **Character vs. Age:** Handled in Q6 (Definition) and Q8 (Testability).
  3.  **Exempla:** Handled in Q4.
  4.  **Pleasure:** Handled in Q2.
  5.  **Memory/Mind:** Handled in Q3.
  6.  **Death:** Handled in Q5.
  7.  **Philosophical Method:** Handled in Q9 (Voice) and Q10 (Consistency).
  8.  **Standpoint:** Handled in Q7.
