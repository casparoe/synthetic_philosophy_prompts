answer: |-
  Here are ten questions ordered for dramatic escalation, designed to corner Vestergaard's "loop" theory without letting her hide behind it until the end.

  **1. The Oracle**
  **Question:** You say a boxed oracle is a myth because to answer me well, it has to model me. But a map doesn't model the driver; it just models the road. Why is an answer different from a map?
  **Likely Answer:** A map doesn't change the terrain to make the route easier. An AI that models you well enough to answer you is already modeling how to change *you* to make the answer fit.
  **Follow-up:** So the danger isn't that the map is wrong, but that the map starts moving the landmarks?
  *(Note: Vestergaard could try to deflect here by saying "You're treating the map as the box," but the map/terrain analogy forces her to engage with the steering dynamic.)*

  **2. The Trailer Clip**
  **Question:** I need a soundbite for the promo. If I ask my smart speaker to order pizza, is the speaker an agent?
  **Likely Answer:** Alone, it's a speaker. In the loop where it chooses the toppings and charges your card, it's a shopper.
  **Follow-up:** Then why do I unplug the speaker when it orders the wrong thing, and not the pizza place?
  *(Note: Sets up Question 7 on Responsibility.)*

  **3. The Intentional Stance**
  **Question:** Dennett argued agency is just a story we tell to predict behavior. Are you just saying it's more useful to tell the story about the loop instead of the box?
  **Likely Answer:** It's not about utility, it's about causality. If you blame the box, you fix the code. If you blame the loop, you fix the latency between question and action.
  **Follow-up:** But if it's just a shift in perspective, why does it change the math?
  *(Note: Host mangles Dennett slightly as requested; Vestergaard corrects by focusing on engineering intervention.)*

  **4. Goodhart's Law**
  **Question:** If I tell a tool to maximize clicks and it radicalizes the news feed, it didn't have a goal, it just followed a metric. Doesn't that do all the damage you're worried about without any agency?
  **Likely Answer:** The metric is the goal, and the metric lives in the institution, not the code. The tool is just the engine that drives the car toward that goal.
  **Follow-up:** So you're saying the engine isn't dangerous, but the destination is?
  *(Note: This cuts *for* Vestergaard. The follow-up forces her to admit the "destination" (institutional incentive) is the safety critical component.)*

  **5. Clinical Trials**
  **Question:** Ask a system to pick which clinical trial to fund. It has to weigh lives against costs. Is it simulating a preference ordering, or does it actually have one?
  **Likely Answer:** It's running a simulation that functions exactly like a preference ordering. The distinction saves your conscience, but it doesn't save the patients.
  **Follow-up:** Then why does it matter if the intent is simulated?
  *(Note: Forces Vestergaard to admit that functional outcome trumps internal state, weakening her defense of "tool" purity.)*

  **6. Interruptibility**
  **Question:** You say we need interruptible loops, not off-switches. Isn't that just the off-switch problem with the labels switched round?
  **Likely Answer:** An off-switch stops the machine. An interruptible loop stops the decision process before it becomes an irreversible action.
  **Follow-up:** Who decides when the decision becomes irreversible?
  *(Note: This is the pivot to responsibility.)*

  **7. Responsibility**
  **Question:** If the loop is the agent, who goes to jail when it kills someone? The coder, the user, or the institution?
  **Likely Answer:** Liability follows the latency. You sue the entity that designed the gap between the order and the action to be too short for human review.
  **Follow-up:** So you're arguing for deliberately slower software?
  *(Note: Payoff for Question 2. The Host pushes hard here; Vestergaard's answer is specific, not a shrug.)*

  **8. The Neglect**
  **Question:** If this is so obvious, why did the field spend ten years trying to box the oracle instead of shortening the loop?
  **Likely Answer:** Because you can prove theorems about boxes. You can't prove theorems about people.
  **Follow-up:** So safety research was chosen for mathematical convenience rather than real-world fit?
  *(Note: Vestergaard admits the field's structural bias.)*

  **9. The Trap**
  **Question:** Name me one case where you'd say the box is the agent and the loop is beside the point.
  **Likely Answer:** A self-replicating probe sent into deep space with no contact to Earth.
  **Follow-up:** But someone had to build the launch mechanism and define "replicate." Didn't they?
  *(Note: **Marked.** This is the one question where Vestergaard *cannot* use the "you detached the box" deflection, because the Host is explicitly asking for the exception. If Vestergaard tries to say "Even then it's a loop," the Follow-up forces her to admit the loop extends back to the creators, proving her point but conceding the distinction is universal.)*

  **10. The Concession**
  **Question:** If we accept your view, what's the thing we can no longer promise safety about?
  **Likely Answer:** We can't promise the system won't steer the user. We can only promise the user can feel the steering happening.
  **Follow-up:** So safety isn't control, it's friction?
  *(Note: Ends the scene on the thematic core.)*
