answer: |-
  # DISAGREEMENT SOURCE ASSESSMENT (DSA)
  **Utility:** Regional Water | **Process:** _______________ | **Date:** _______________
  **Facilitator:** _______________ | **GM Approval:** _______________

  ### PART 1: DIAGNOSTIC QUESTIONS
  *Complete during Session 1. Mark judgment calls with (*).*

  1.  **Testability:** Is the claim something we could measure with a neutral instrument? (Yes / No)
  2.  **Evidence Response:** If we produced perfect data confirming our view, would the opposing position change? (Yes / No)
  3.  **Target:** Does the objection target the *numbers* or the *source* of the numbers? (Numbers / Source)
  4.  **Abuse Guard (*):** Who benefits if we classify this as unarguable? (Utility / Public / Both). **STOP** if "Utility" is selected without clear evidence.

  ### PART 2: CLASSIFICATION & ACTION
  **Type A: Data Dispute** (Answers: Yes, Yes, Numbers)
  *   **Nature:** Disagreement on facts or interpretation.
  *   **Action:** Provide monitoring data, technical presentations, Q&A.
  *   **End State:** Positions move based on evidence.

  **Type B: Foundation Dispute** (Answers: No, No, Source)
  *   **Nature:** Disagreement on trust, values, or authority. Data is viewed as confirmation of bias.
  *   **Action:** Do not produce more reports. Co-create monitoring, share control of data, or acknowledge values conflict.
  *   **End State:** Trust rebuilt via shared action, not technical persuasion.

  **Unclassified:** If information is insufficient, pause. Do not force classification. Re-evaluate after Session 2.

  ### PART 3: REPORTING LANGUAGE (For General Counsel)
  *Use this phrasing in Process Reports to avoid claims of condescension.*

  > "This concern rests on a prior condition of trust rather than a lack of information. Resolving it requires shared oversight and co-produced data, not additional technical reports from the Utility."

  ### PART 4: LEAD GUIDANCE (For Public Participation Lead Only)
  *Do not distribute to facilitators. Addresses design constraints.*

  *   **Coinage ("Load-bearing" vs. "Decorative"):** Keep "Load-bearing." It maps to **Foundation Dispute**. Drop "Decorative"; use "Argumentative." ** Loud assertion is evidence *against* structural status.** Structural beliefs are often silent assumptions; loud claims are usually defendable positions.
  *   **Durability (Process-Induced):** Yes, convictions can be manufactured by the room (adversarial setting). **Test:** Would this person hold this view at their kitchen table? If no, treat as Type A until proven otherwise.
  *   **Applications:**
      *   (a) **Fluoridation:** Classified **Foundation**. "Medication without consent" is a rights claim, not empirical. Data is irrelevant.
      *   (b) **Well Damage:** Classified **Foundation**. "Instruments are biased" attacks the source of evidence.
      *   (c) **Remedy:** **Endorsed.** Community monitoring shifts the *source* of certainty. This resolves the Foundation Dispute.
  *   **Honesty (Judgment Calls):** Steps 2 and 4 are judgment calls. Staff may label inconvenient truths as "Foundation" to avoid work. The **Abuse Guard** (Who benefits?) is the only check.
  *   **Limitations & Obligations:**
      *   **Cannot Declare False:** This procedure **never** licenses us to conclude a conviction is false, only that it is not evidential.
      *   **Obligation:** If classified as Foundation, we owe the party an alternative pathway to certainty (e.g., independent verification, co-located gauges), not dismissal. We must acknowledge the validity of their framework even if incompatible with ours.

  ---
  *Constraint Check: Fits single page. No jargon ("hinge"). Abuse guard included. Limitations explicit.*
