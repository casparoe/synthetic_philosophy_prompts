answer: |-
  Buddhism must be treated as a distinct metaethical position because it grounds moral value in the agent's intention and spiritual development rather than in the maximization of external consequences. While karma involves cause and effect, the Buddha explicitly defined karma as *cetana* (volition or intention), meaning the moral quality of an act is determined by the mental state behind it, not solely by the result it produces. This distinguishes Buddhist ethics from act-utilitarianism, which judges actions exclusively by their outcomes; in Buddhism, an accident that causes harm generates no negative karma, whereas a malicious intention that fails to act still generates negative karma. Consequently, Buddhist ethics is more accurately classified as a form of virtue ethics focused on *sila* (moral discipline) and the cultivation of character traits like compassion and wisdom, rather than a calculative system for maximizing aggregate well-being.

  Regarding the "man at the door" scenario, a Buddhist does not simply calculate whether lying produces the best net outcome. Instead, the ethical deliberation focuses on whether the action arises from wisdom and compassion or from fear and delusion. A Bodhisattva might choose to lie to save a life, but not because the lie is morally neutral due to good consequences; rather, they may choose to accept the karmic burden of lying as a sacrificial act of compassion to protect another, fully aware of the negative impact on their own spiritual trajectory. This agent-relative sacrifice is incoherent within standard utilitarianism, which views the agent's moral purity as irrelevant compared to the state of affairs produced. Furthermore, the telos of Buddhist ethics is soteriological—aimed at liberation from *dukkha* (unsatisfactoriness) and the cessation of craving—whereas utilitarianism is welfarist, aimed at maximizing happiness or preference satisfaction. Because Buddhism posits that certain actions (like lying) reinforce the ignorance and attachment that bind one to suffering, even "successful" lies can be unskillful if they perpetuate delusion, providing a normative resource that utilitarianism lacks to resist the reduction of morality to mere outcome management.
