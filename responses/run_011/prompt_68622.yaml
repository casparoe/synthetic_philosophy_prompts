  **MEMORANDUM**

  **TO:** Exhibitions Committee
  **FROM:** [Your Name]
  **DATE:** October 23, 2024
  **SUBJECT:** Recommendation: Anthropocene Integration for Entrance Hall Time Strip

  **Recommendation**
  To resolve the committee's deadlock while honoring our scientific standards and donor intent, I recommend the following:

  1.  **Inclusion:** The term "Anthropocene" appears on the wall.
  2.  **Visual Status:** The band is **visually subordinate** to formal periods. Unlike the solid colors of the Jurassic or Holocene, this section should use a distinct texture (e.g., stippling or gradient) or a dashed boundary line to denote "informal unit" status.
  3.  **Seam Location:** The color change occurs at **1950 CE**.

  **Scientific Integrity and Objections**
  Our staff geologist raises a critical objection that must be recorded at full strength: The International Commission on Stratigraphy voted down the formal proposal for the Anthropocene in 2024. Every other band on this wall represents a ratified geological unit. Adding a rejected proposal as a equivalent band compromises the strip's scientific integrity. If we present this as fact, we cannot defend the display to school groups learning the official timescale, risking our authority as a natural history institution.

  **Why This Recommendation Proceeds**
  This approach survives that objection by prioritizing transparency over equivalence. Museums must bridge rigorous science and public understanding. The term "Anthropocene" is culturally vital, even if stratigraphically informal. By visually distinguishing the band (e.g., dashed lines), we maintain scientific accuracy while acknowledging the concept's significance. This turns a potential error into a teaching moment about how science evolves.

  Regarding the seam: 1950 is the only date offering a sharp physical marker (radionuclides) suitable for a wall display. Agriculture is too gradual, and 1610 carries ethical weight regarding Indigenous population collapse, as noted by our Advisory Circle. While 1950 risks implying prior inactivity, the label copy (below) explicitly clarifies that human impact predates this marker, addressing both Education and Indigenous concerns without sacrificing the physical need for a single seam.

  **Proposed Label Copy**
  (Target: 12-year-old reading level, approx. 60 words)

  "You are standing in the Holocene epoch. Some scientists propose a new name, 'Anthropocene,' for when humans began changing Earth's geology. We mark 1950 for clear global signals, like radiation from atomic tests. But people changed landscapes long before. This unit is not yet official, but it highlights our powerful role in Earth's story."

  **Next Steps**
  If approved, Design will draft visual options for the "informal" texture by next week. I request we finalize this decision Thursday to meet fabrication deadlines.
