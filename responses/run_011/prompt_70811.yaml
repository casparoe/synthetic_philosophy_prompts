  so my government class did a unit on nudging and I've sort of landed somewhere but I cant tell if it's actually coherent. here's what I believe, roughly:

  1. libertarian paternalism is fine — if you change the default but opting out takes like two clicks, you havent taken anything away
  2. steering someone without them noticing is disrespectful even when it helps them, because it treats them as a thing to be aimed rather than a person
  3. what actually makes defaults okay isn't the opt-out, it's that people would endorse the nudge if they stopped and thought about it — call it the reflected-endorsement test
  4. nudges work by running on the automatic system, so if you have to consciously process one for it to work it isn't really a nudge
  5. I'm for opt-out organ donation, and for that Save More Tomorrow thing where your contribution rate goes up automatically whenever you get a raise
  6. I also think there's a decent rule of thumb: if you'd be embarassed to admit you fell for it, it's over the line

  and one case: my school moved the chocolate milk behind the counter so you have to ask for it. its still available, nobody hid anything.

  what I want is an audit, not a lecture on what nudging is. specifically — do 1 and 2 fight each other, or is that just me being sloppy? does 3 or 4 have to go? and can any of my principles actually deliver a verdict on the chocolate milk thing, because I feel like they should say yes and something's off about that.

  please use these sections in this order: Bottom line (3 sentences max), Ranked tensions (worst first, ~5 sentences each, say which commitment has to go and what giving it up costs you), False alarms (one paragraph on the pairs that look contradictory but aren't, and why), The chocolate milk case (one paragraph), Cheapest fix (4-5 sentences).
