answer: |-
  **MEMORANDUM**

  **TO:** Neolithic Gallery Interpretation Committee
  **FROM:** Senior Archaeological Consultant
  **DATE:** October 24
  **SUBJECT:** Decision Framework for Figurine Case (Site Anonymised)

  **1. Candidate Readings and Predictive Models**
  We are dealing with a single object class distributed across three distinct contexts. We must determine if these represent one phenomenon with multiple lifecycle stages or three distinct phenomena.

  *   **Ideotechnic (Cult/Goddess):** Predicts association with shrines or burials. The data contradicts this: no shrine exists, and figurines are absent from all 14 burials. The midden breakage could fit "ritual killing," but the house context (polished bases, matching wall motifs) suggests integration into domestic architecture rather than segregation.
  *   **Technomic (Toys/Daily Life):** Predicts heavy usewear and accidental breakage. Only 9 of 47 show handling polish. Crucially, 24 of 31 midden fragments snapped cleanly at the neck or waist. Accidental drops shatter irregularly; deliberate snaps target structural weak points. This rules out simple discard or play.
  *   **Sociotechnic (Household Practice):** Predicts varied contexts reflecting a lifecycle. Active use (house floor), deliberate decommissioning (midden snaps), and votive/storage deposition (ochre pit). This model accommodates all data strands without contradiction. The three context groups are best interpreted as stages of a single practice: use, breakage, and deposition.

  **2. Recommendation**
  **Gallery:** Place the case in **"Household and Community."** This avoids the trivialization of "Daily Life" and the unproven specificity of "Belief and Ceremony."
  **Physical Case:** Keep the 47 figurines together. Splitting them by context destroys the lifecycle narrative required to make sense of the breakage patterns.
  **Community Account:** Include the 1930s account as **comparative ethnography**, not direct evidence. It validates the *plausibility* of seasonal breakage without claiming continuity.
  **Label:** (89 words)

  These 47 clay figures appear in three contexts: handled on house floors, deliberately broken in middens, and deposited with ochre. This variety indicates a lifecycle of use rather than a single function. Breakage patterns rule out accidental loss. No figurines were found in burials, excluding them as grave goods. Their treatment suggests roles mediating household security and seasonal change. A community account describes similar figures broken on ash heaps seasonally. We present this not as proof of function, but as a comparative lens on how small objects mark time.

  **3. Policy Line for Future Gallery Development**
  Adopt the **"Independence Threshold"** for oral history. Oral accounts may interpret archaeological data only if the account's content is independent of the excavation process. Where contact occurred (as here), the account must be framed as a parallel practice rather than explanatory evidence. This satisfies the "cable" policy: the archaeology stands on its own strands (context, usewear, breakage), while the oral history adds weight without bearing the load. This prevents us from relitigating the validity of oral history case-by-case; the criterion is strictly about informational contamination.

  **4. The Losing Side: The Independence Question**
  The Field Archaeologist is correct to worry about contamination. The informants saw the excavation finds before speaking. If they tailored their story to match what they saw, the account is circular evidence. However, the direction of contamination matters. The excavator wanted a "goddess" confirmation. The informants provided a story about "ash heaps" and seasonal disposal, which disappointed him. If the informants were merely pleasing the excavator, they would have confirmed the goddess theory. Their divergence suggests the account retains independence of *content*, even if contact occurred.

  *Assumption:* I am assuming the excavator's notebook entry regarding his disappointment is an accurate record of his immediate reaction, not a later rationalization.

  *Mitigation:* We acknowledge the contact in the label ("comparative lens") rather than hiding it. This turns a vulnerability into a transparency feature, respecting both the community's knowledge and archaeological rigor.

  **5. Falsification and Timeline**
  **What would flip this?** Microscopic analysis of the break edges could definitively confirm deliberate snapping versus thermal shock from the house fire. Residue analysis on the ochre pit figurines could identify organic binders suggesting votive offering versus storage.
  **Feasibility:** We have five weeks. Standard residue analysis is possible; microscopic breakage analysis is immediate.
  **Decision:** Do not delay. The current evidence cable is sufficient for a public label. The absence in burials alone rules out the strongest competing hypothesis (grave goods). If rapid microscopy confirms deliberate snapping, it strengthens the label but does not change the interpretation. If we cannot secure funding for analysis in ten days, proceed with the current draft. The authority for this decision rests on the committee's mandate to interpret *available* evidence, not hypothetical future data. Displaying them as "Enigmatic" violates the policy requirement to rule out alternatives. We have ruled out grave goods and accidental loss; we must commit to the remaining plausible reading.

  **Summary**
  We are not proving a goddess cult. We are not proving toys. We are demonstrating a structured household practice supported by multiple strands of material evidence, illuminated but not carried by community knowledge. Approve the label as drafted.
