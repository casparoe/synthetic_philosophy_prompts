answer: |-
  This is a classic "wine-fueled reading group" move: taking a technical semantic mechanism and inflating it into a metaphysical sledgehammer. Dan's intuition isn't baseless—the prosentential theory (Grover, Camp, Belnap; later Brandom) is a serious contender—but his leap from "here's how the grammar works" to "the metaphysical question is malformed" is where the analogy breaks down.

  Since you're the semantics person, I'll skip the intro and go straight to the audit.

  ### 1. The Correspondence Table

  Dan's argument relies on an isomorphism between the **Pronoun Domain** (Source) and the **Truth Domain** (Target). Here is the mapping he is implicitly using:

  | Source Domain (Pronouns) | Target Domain (Truth) | Function |
  | :--- | :--- | :--- |
  | **Pronoun** ("She", "It") | **Pro-sentence** ("That is true") or **Operator** ("Is true") | Stands in for a linguistic item to avoid repetition. |
  | **Antecedent** ("Mary") | **Proposition / Sentence** ("Snow is white") | The content being retrieved. |
  | **Anaphoric Link** | **Disquotation / Inheritance** | The mechanism by which content is recovered. |
  | **Agreement Features** (Gender, Number) | **Tense / Modality** ("Was true", "Might be true") | Grammatical constraints on the pro-form. |
  | **Context of Utterance** | **Context of Assertion** | Fixes the antecedent/proposition. |
  | **Referent** (The object "Mary") | **???** (The "fact" or "worldly condition") | *This is where the table breaks.* |

  **The Missing Counterpart:**
  In the pronoun case, there is a clear distinction between the *word* ("She"), the *linguistic antecedent* ("Mary"), and the *extralinguistic referent* (the actual woman).
  In Dan's truth case, he collapses the *linguistic antecedent* (the sentence "Snow is white") and the *extralinguistic referent* (the fact that snow is white). The analogy has no slot for "what makes the antecedent sentence correct." It treats the sentence itself as the terminal object.

  ### 2. Disanalogies: Technical vs. Threatening

  You need to separate the stuff that just requires a more complex semantic model from the stuff that actually sinks the metaphysical conclusion.

  **A. Technical Curiosities (Dan can patch these)**
  *   **Inflection:** You noted "is true" takes tense ("was true"). Pronouns don't take tense.
      *   *Dan's Patch:* The tense belongs to the copula or the recovered sentence, not the pro-form itself. "That *is* true" recovers "Snow *is* white"; "That *was* true" recovers "Snow *was* white." This is manageable within a dynamic semantics framework.
  *   **The Two-Place "True Of":** " 'White' is true of snow."
      *   *Dan's Patch:* Prosententialists usually argue this is derivative. We define "true of" via "true": $x$ is true of $y$ iff the sentence formed by applying $x$ to $y$ is true. It's a logical extension, not a primitive.

  **B. Threatening Disanalogies (These hurt the conclusion)**
  *   **Quantification and Variables:** This is the big one. The main motivation for truth predicates is generalization: "Everything John said is true."
      *   *The Problem:* Pronouns don't enable quantification over their antecedent domain on their own. You need a quantifier ("Everyone," "Everything"). If "is true" is just a pronoun-analogue, where is the quantifier binding sentence-positions? English lacks sentential variables ($\forall p$). The truth predicate *creates* the logical space for sentential quantification. A pronoun merely *occupies* existing logical space. If "is true" is doing the work of enabling quantification, it's doing more work than a pronoun.
  *   **Normativity vs. Reference:** Pronouns are referential devices; they point. "Is true" is a normative device; it licenses inference and assertion.
      *   *The Problem:* If I say "She" and you ask "Who?", I point to Mary. If I say "That's true" and you ask "Why?", I don't point to a sentence; I offer *reasons for the content*. The anaphora is not just syntactic retrieval; it's endorsement. The pronoun analogy captures the retrieval, but misses the endorsement (the "force").
  *   **Redundancy with Existing Pro-sentences:** English already has "Yes," "So," "Indeed," "I think so."
      *   *The Problem:* If "That's true" is just a prosentence, why do we have "Yes"? Prosententialists argue "Yes" is limited (requires a question), whereas "That's true" is more flexible. But this suggests "is true" is a *specialized* tool for endorsement, not a generic grammatical placeholder like a pronoun.

  ### 3. Auditing Your Pressure Points

  *   **"So" and "Yes":** You are right to flag this. If the job is purely anaphoric recovery of content, "so" should suffice. The fact that we need "true" suggests we are doing something *to* the content (validating it), not just repeating it.
  *   **Generalization ("Everything she said..."):** As noted above, this requires quantifying into sentence position. Pronouns are bound by quantifiers; they don't *enable* the quantification. If "true" is necessary for the generalization to be expressible, it functions more like a logical operator (like $\exists$) than a pronoun.
  *   **Inflection:** "Was true" implies truth is a property that can be held at a time. Pronouns don't have temporal properties. This suggests "true" behaves more like an adjective (predicate) than a pro-form.
  *   **The Dummy Subject ("It is true that..."):** **This is the killer.** In "It is true that snow is white," the "It" is expletive (pleonastic). It refers to nothing. The content is in the *that*-clause.
      *   *The Audit:* If the paradigm case of truth attribution uses a dummy subject, there is **no anaphoric link**. There is no antecedent sentence for "It" to pick up. The prosententialist has to claim this is a surface-structure disguise for "That snow is white is true" or "Snow is white. That is true." But syntactically, the dummy subject construction is robust. If the most common use of "true" isn't anaphoric, the analogy fails to cover the central data.

  ### 4. The Smuggling Question

  Does treating "is true" as a pro-form presuppose deflationism? **Yes.**

  To analyze "is true" as a pro-form, you must assume that its semantic contribution is exhausted by its anaphoric function. But a correspondence theorist can agree that "is true" *functions* anaphorically in many contexts while maintaining that it *ascribes a property* (correspondence) to the proposition.

  *   **Dan's Move:** "It functions like a pronoun, therefore it doesn't name a property."
  *   **The Counter:** "It functions like a pronoun *because* the property it names is transparent/disquotational. The function doesn't eliminate the property; it reflects the nature of the property."

  Dan is smuggling the deflationist conclusion into the semantic analysis. He is assuming that if a term functions logically, it cannot denote a property. But consider the word "exists." In logic, "exists" functions as a quantifier ($\exists x$), not a predicate. Does that mean existence isn't a real feature of the world? That's a metaphysical leap, not a semantic one. Similarly, even if "true" functions as a logical device, that doesn't prove there is no worldly relation (correspondence) that the device tracks.

  ### 5. Scope Shift: Semantics vs. Metaphysics

  This is where Dan's strong conclusion ("the question is malformed") collapses.

  *   **Semantic Question:** "What does the word 'true' contribute to the proposition expressed?"
      *   *Answer:* It might contribute anaphoric recovery (prosententialism).
  *   **Metaphysical Question:** "In virtue of what is the antecedent proposition correct?"
      *   *Answer:* Correspondence, coherence, utility, etc.

  Dan's analogy answers the **Semantic Question**. It tells us how the *word* works. It does not answer (and cannot answer) the **Metaphysical Question**.
  Even if "is true" is just a logical device for endorsement, the sentence it endorses ("Snow is white") still stands in some relation to the world. Asking "What makes 'Snow is white' correct?" is not malformed just because the *word* "true" is a pro-form.
  *   **Analogy:** "Bachelor" means "unmarried man." That's the semantic definition. Does that make the question "What constitutes the social status of being unmarried?" malformed? No. The definition of the word doesn't dissolve the reality of the institution.
  *   **Dan's Error:** He thinks dissolving the *word's* substantive content dissolves the *world's* substantive structure. That's a scope shift from language to reality.

  ### 6. Verdict on Dan's Conclusion

  Dan's stronger conclusion—that the metaphysical question is malformed—**does not survive** the disanalogies.

  The analogy supports the claim that "is true" is not a *standard* descriptive predicate (like "is red"). It supports the claim that it is a logical operator. But it does not support the claim that there is no property of truth. It merely shows that the *concept* of truth is thin. A correspondence theorist can accept the concept is thin (deflationary about the *concept*) while being inflationary about the *property* (truth is a robust relation, even if our word for it is a logical device).

  The analogy was carrying the metaphysical conclusion the whole time by pretending that semantic function exhausts ontological commitment.

  ### 7. A Better, Non-Question-Begging Analogy

  If you want an analogy that captures the logical function of "true" without smuggling in deflationism, try **The Validity Analogy** or **The Currency Analogy**.

  **Option A: Validity**
  *   "This argument is valid."
  *   **Function:** It allows generalization over arguments. It licenses inference.
  *   **Metaphysics:** Asking "What is validity?" is not malformed. The answer is "Preservation of truth."
  *   **Why it's better:** It acknowledges that "valid" is a logical term (like "true"), but admits there is a substantive property (preservation) that grounds it. It separates the *logical role* from the *grounding condition*.

  **Option B: Currency (The Check)**
  *   Saying "That's true" is like endorsing a check.
  *   **Function:** It transfers assertoric commitment from the speaker to the content. It allows you to pass the "value" of the assertion around without re-issuing it.
  *   **Metaphysics:** Does the check have value? Yes. Is the value *in* the paper? No. Is the value *real*? Yes (backed by the bank/reserves).
  *   **Why it's better:** It explains why "true" feels lightweight (it's a device) without denying that there is something backing it up (the world/facts). It allows Dan to keep his logical insight (it's a device) while allowing you to keep your metaphysical question (what backs the device?).

  **What makes an analogy non-question-begging here?**
  It must distinguish between the **instrument** (the word/concept) and the **target** (the worldly condition). Dan's pronoun analogy collapses the instrument into the target (the pronoun *is* the reference mechanism, so there's nothing else to ask). A good analogy must allow the instrument to be lightweight while the target remains heavy.

  **Summary for the Reading Group:**
  Tell Dan the prosentential theory is a solid *semantic* model for how we *use* the word, but it's a category error to treat it as a *metaphysical* dissolution. He has shown that "truth" is a logical device, not that "truth-making" is an illusion. The pronoun analogy fails because it has no place for the worldly anchor that makes the antecedent sentence correct in the first place.
