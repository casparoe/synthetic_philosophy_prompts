prompt: |-
  ok so context: third year in philosophy, nominally phil lang though I've drifted a fair way into formal semantics, and last week our reading group (six of us, one guy's kitchen, wine of questionable quality) got completely derailed by an analogy. We were on deflationism and Dan, who is extremely confident, argued that the prosentential line basically settles things against the correspondence people. His pitch went like this: English already has bits of grammar that do for sentences what pronouns do for nouns — the ones you use when you just answer "yes", or when you say you think so; Ramsey complained that if you strip the truth-predicate out of a generalization about what John says, English leaves you hanging mid-sentence with nothing available to put at the end; and the prosententialists said fine, that gap is exactly what "is true" fills, so it's a pro-form rather than a predicate (Brandom is the recent one pushing that framing, calling it a pro-sentence-forming operator). On this picture "that's true" doesn't ascribe anything to anything, it just picks up the content of an earlier sentence the way "she" picks up its antecedent. Then Dan went further: the upshot, he said, is that asking what truth consists in is malformed in the same way it'd be malformed to ask what "she" stands for apart from any particular antecedent — the inflationists are reifying a piece of grammar, like the old chestnut about people who think "nothing" names something because of how the word behaves in a sentence.

  I wasn't convinced but I also couldn't say why on the spot, which is annoying because I'm supposed to be the semantics person. Can you audit the analogy for me properly? What I want is first the correspondence table, spelled out: what plays the pronoun, what plays the antecedent, what plays the anaphoric link itself, what corresponds to the agreement features (gender, number, case) and to the context that fixes reference — and then whatever in the target domain has no counterpart whatsoever. After that, the disanalogies, and please seperate the ones that actually threaten Dan's conclusion from the ones that are just technical curiosities. A few pressure points I've got already, in case they're useful: English apparently has sentence-level anaphora in "so" and "yes" already, so what job is left over for a truth-predicate; the generalization case ("everything she said is true") looks like it needs something like a variable ranging over sentences, which I don't think English straightforwardly has; "is true" inflects for tense, and there's the two-place "true of" that doesn't look disquotational at all; and the paradigm example the whole debate turns on — it is true that snow is white — arguably has a dummy subject rather than an anaphoric one, so does the analogy fail to even get started at the one case deflationists always lead with?

  I'd also want the smuggling question taken seriously: does treating "is true" as a pro-form already presuppose the deflationist conclusion instead of supporting it, i.e. is Dan's analogy just a picture he likes because it matches what he believes? And is there a scope shift going on — a claim about what an expression contributes to a sentence being used to answer a question about what makes the contents expressed true, which the pronoun picture simply never addresses? Tell me whether his stronger conclusion (that the metaphysical question is malformed, not merely hard) survives once the disanalogies are on the table, or whether the analogy was carrying it the whole time. Finally, if pronouns are the wrong source domain, is there a better analogy for "is true" that doesn't quietly hand the game to either side — and what would make an analogy non-question-begging here in the first place? No need for citations or a reading list, I've got those; I just want the reasoning laid out.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Third-year philosophy student, nominally Philosophy of Language, drifted into Formal Semantics. Knowledgeable enough to know terms like "prosentential," "deflationism," "correspondence," "anaphora," "disquotational," "variable ranging over sentences."
      *   **Context:** Reading group discussion (informal, wine-fueled) derailed by an analogy proposed by "Dan" (confident peer).
      *   **Dan's Argument:** Prosentential theory of truth (Grover, Camp, Belnap, Brandom) settles the debate against correspondence. "Is true" is a pro-form (like a pronoun). Asking what truth *is* is like asking what "she" refers to independently of an antecedent (category mistake/reification).
      *   **User's Goal:** Wants an audit of the analogy. Specifically:
          1.  Correspondence table (Source: Pronouns -> Target: Truth).
          2.  Disanalogies (Separated into "threatening" vs. "technical").
          3.  Address specific pressure points (existing anaphora like "so"/"yes", generalization/quantification, inflection/"true of", dummy subjects).
          4.  The "Smuggling" Question (Is the analogy question-begging?).
          5.  Scope Shift (Use vs. Truth-making).
          6.  Verdict on Dan's strong conclusion (Metaphysical question is malformed).
          7.  Alternative analogies (Non-question-begging).
      *   **Tone:** Academic but conversational (matching the "reading group" vibe), rigorous, no fluff/citations needed (they have those), focus on reasoning.

  2.  **Deconstruct Dan's Argument (The Prosentential Theory):**
      *   *Core Claim:* "That is true" functions like "She runs." "That" picks up a sentence (prosentence), "is true" is the operator making it a sentence again.
      *   *Metaphysical Upshot:* Truth isn't a property; it's a logical device. Asking about the *nature* of truth is a grammatical illusion.

  3.  **Step 1: The Correspondence Table:**
      *   Need to map Pronoun Domain -> Truth Domain.
      *   *Pronoun:* "She" / "It".
      *   *Antecedent:* Noun Phrase (e.g., "Mary").
      *   *Anaphoric Link:* Reference/Coreference.
      *   *Agreement Features:* Gender, Number, Case.
      *   *Context:* Discourse context fixing the referent.
      *   *Target (Truth):*
          *   "Is true" -> Pronoun (or Pro-sentence former).
          *   Proposition/Sentence -> Antecedent.
          *   Truth-making/Assertion -> Anaphoric Link? (This is tricky).
          *   Inflection (Tense) -> Agreement Features.
          *   Context of Utterance -> Context fixing the proposition.

  4.  **Step 2: Disanalogies (Threatening vs. Technical):**
      *   *Technical:* Inflection (tense vs. gender), "True of" (2-place) vs. Pronouns (usually 1-place referents).
      *   *Threatening:*
          *   *Quantification:* "Everything she said is true." Pronouns don't quantify over domains easily without variables. "Is true" enables generalization over propositions. Pronouns refer to *objects*. Do sentences act like objects here?
          *   *Normativity:* "Is true" carries normative weight (assertibility conditions). "She" doesn't impose norms on "Mary," it just refers.
          *   *The "So/Yes" Point:* English *already* has prosentences ("So," "Yes," "Indeed"). If "Is true" is just anaphoric, why do we need it alongside "So"? (Redundancy problem).
          *   *The Dummy Subject:* "It is true that p." "It" is expletive, not anaphoric. If the paradigm case isn't anaphoric, the theory struggles.

  5.  **Step 3: Addressing Pressure Points:**
      *   *Existing Anaphora:* "So" works for "I think so." But "It is true that..." is different. Prosententialists say "That is true" is the prosentence. But "It is true that p" looks like a predicate applied to a nominalized clause.
      *   *Generalization:* "Everything she said is true." This requires quantifying into sentence position. Pronouns don't do quantification alone; they need quantifiers ("Everyone," "Everything"). "True" seems to do the work of allowing the quantification.
      *   *Inflection:* "Was true," "Will be true." Pronouns don't have tense. This suggests "True" behaves more like a predicate/adjective than a syncategorematic pro-form.
      *   *True Of:* "True of" relates a predicate to an object. This looks robustly relational/correspondence-y.

  6.  **Step 4: The Smuggling Question (Begging the Question):**
      *   Dan claims the analogy *proves* deflationism.
      *   Counter: To treat "is true" as a pro-form, you *already* have to assume it doesn't ascribe a substantive property. If it *did* ascribe a property (correspondence), it wouldn't function *just* like a pronoun.
      *   So, the analogy describes the *syntax/semantics* of deflationism, it doesn't *argue* for it against correspondence. A correspondence theorist can say: "Sure, it functions anaphorically *because* the property of truth is transparent/disquotational, but that transparency is explained by the nature of the property (correspondence), not the lack thereof."
      *   *Scope Shift:* Dan moves from "How does the word function?" (Semantics) to "What is truth?" (Metaphysics). The pronoun analogy explains the word's function, not the worldly condition that makes the antecedent sentence true.

  7.  **Step 5: Verdict on Dan's Strong Conclusion:**
      *   Does "Metaphysical question is malformed" survive?
      *   No. The analogy shows "is true" is a logical device. It does *not* show that there is no underlying property that makes the antecedent correct.
      *   Analogy: "Bachelor" means "unmarried man." Asking "What is bachelorhood?" is answered by the definition. But asking "What makes a man unmarried?" is still valid. Similarly, "True" might be disquotational, but "What makes the proposition *p* hold?" is still a valid metaphysical question. Dan conflates the *concept* of truth with the *ground* of truth.

  8.  **Step 6: Better Analogies:**
      *   Need something that captures logical function without denying underlying reality.
      *   *Idea 1:* The Equals Sign (=). It asserts identity, but doesn't explain *why* they are identical.
      *   *Idea 2:* Currency/Check. A check isn't money itself, it's a device to transfer value. "True" transfers assertoric commitment.
      *   *Idea 3:* Validity in Logic. "Valid" describes an argument form. Asking "What is validity?" isn't malformed, but it's not a physical property.
      *   *Best Candidate:* **The "Valid" Analogy.** "This argument is valid." It allows generalization over arguments. It's normative. But asking "What consists in validity?" (preservation of truth) is not malformed, even if "valid" is a logical term. Or **Inference Tickets** (Ryle).

  9.  **Drafting the Response:**
      *   *Tone:* Peer-to-peer, sharp, acknowledging the semantics background.
      *   *Structure:* Follow the user's prompt order (Table -> Disanalogies -> Pressure Points -> Smuggling/Scope -> Verdict -> Alternative).
      *   *Refinement:* Ensure the distinction between *pro-sentence* (Grover/Camp/Belnap) and *pro-sentence former* (Brandom) is clear if needed, but keep it focused on the analogy. Dan mixes them slightly ("is true" as operator vs "that's true" as unit). I should clarify that.
      *   *Key Insight:* The "Generalization" argument is the strongest point for deflationism (Horwich/Quine), but the pronoun analogy specifically is weak on quantification. I need to highlight that "True" enables *quantification into sentence position*, which pronouns do not do on their own.

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "dummy subject" point? Yes, "It is true that..." is the biggest thorn for prosententialism.
      *   *Check:* Did I separate technical vs. threatening disanalogies? Yes.
      *   *Check:* Did I answer the "Smuggling" charge? Yes, this is crucial. The analogy assumes deflationism to work.
      *   *Check:* Is the semantics lingo accurate? (Anaphora, binding, quantification, expletive). Yes.

  11. **Final Polish:** Ensure the conclusion is decisive. Dan's analogy is illustrative, not argumentative. It collapses the distinction between semantic function and metaphysical ground.

  *(Self-Correction on the "Pro-sentence" detail)*: Strictly speaking, Grover, Camp, and Belnap argue "That is true" is the prosentence. Brandom argues "Is true" is a pro-sentence forming operator. Dan seems to conflate them slightly ("is true... is a pro-form"). I should note this ambiguity as a technical weakness but focus on the broader functional claim.

  *(Refining the "Smuggling" point)*: The core issue is that pronouns are *referential* (or anaphoric). If "is true" is anaphoric, what does it refer to? A fact? A proposition? If it refers to a proposition, does it ascribe a property to it? Deflationists say no. Correspondence theorists say yes (the property of corresponding). The analogy doesn't decide this; it just models the *syntax* of the deflationist view.

