answer: |-
  Here is the case analysis, structured according to your three requirements.

  ### I. Mapping the Argument

  **The *Explanandum***
  To test the thesis, we must define precisely what is being explained. It is not "Japanese behaviour in 2011." It is: *The reported absence of opportunistic violence and the presence of orderly resource distribution (queues, returned wallets) in the immediate two-week aftermath of the 3/11 disaster in the Tōhoku region and Tokyo, as observed by international media and domestic authorities.*
  Two caveats are essential here. First, the window is narrow; social order often degrades over longer timelines (the four-year displacement you note). Second, the data is mediated; orderly queues are photogenic and confirm expectations, whereas scattered disorder is not. We are explaining a specific, visible slice of conduct, not the totality of the social response.

  **The National-Character Thesis**
  When invoked in this context, the thesis claims that a durable, internal, and shared set of dispositions (shame, *gaman*, Confucian hierarchy) causally determines aggregate behaviour across time. It implies that if you swap the population but keep the disaster, the outcome changes. It treats culture as a fixed variable rather than a contextual resource.

  **Rival *Explanantia***
  1.  **State Capacity and Drills:** Japan has high institutional trust and a century of disaster preparation. Order is a learned logistical skill, not a moral virtue.
  2.  **Civic Density:** Strong neighbourhood associations (*chonaikai*) provide pre-existing channels for coordination.
  3.  **Situational Visibility:** In a collectivist setting, the reputational cost of queue-jumping during a crisis is astronomically high. This is rational choice theory within a specific social market, not essentialism.
  4.  **Universalism (Solnit/Fritz):** Panic is rare; mutual aid is the species-default. The "looting" narrative is the outlier requiring explanation, not the solidarity.

  **Assessment of Coverage**
  The national-character hypothesis absorbs the *texture* of the 2011 record well (the specific cultural idioms used by evacuees), but it fails the *causal* test. It cannot explain why the behaviour appeared *only* in specific zones or why it fluctuated. The state-capacity and civic-density arguments absorb the logistics of the queues. The universalist argument absorbs the absence of looting. The national-character thesis is silent on why these dispositions were activated in 2011 but ostensibly suspended in other historical moments (see 1923). It functions as a description of style, not a mechanism of cause.

  ### II. Pressure Testing the Thesis

  **The 1923 Contradiction**
  A single national character must account for both the 2011 queue and the 1923 lynching. Can it? Only if the concept is rendered so flexible it loses predictive power. In 1923, "group loyalty" meant purging the perceived internal threat (Koreans) to protect the collective. In 2011, "group loyalty" meant suppressing individual need to protect the collective. The underlying mechanism (subordination of self to group) is identical; the *target* of the aggression changed. If "group loyalty" explains both stoic endurance and vigilante massacre, it explains nothing specific about the *moral content* of the action. It becomes a Rorschach test for the observer. To make the thesis work, you must add ad hoc conditions (e.g., "loyalty turns violent only when trust in state collapses"), which admits that the *situation*, not the *character*, is the independent variable.

  **The Unfalsifiability Problem**
  You note the economic miracle/stagnation flip. This is the same logical error. If conformity explains growth (efficient labour) and stagnation (resistance to change), the variable "conformity" has no variance. In disaster sociology, if order is attributed to "stoicism" in Japan but "resilience" in Britain and "chaos" is attributed to "lawlessness" in the US but "breakdown of authority" in Haiti, the national-character variable is doing no work. It is a post-hoc label applied to the outcome, not a predictor of it.

  **The Reflexivity Problem**
  This is the strongest argument against the thesis as a *root* cause, but perhaps the strongest argument for it as a *social mechanism*. Ruth Benedict's book was internalised by the Japanese post-war establishment. By 2011, Japanese citizens knew the global script: "The world expects us to be stoic." Behaviour in 2011 may have been, in part, a performance of that script for the international media. This makes the description "true" (they did queue) but "empty" (they queued partly because they were told they were the sort of people who queue). This does not mean we should distrust the observation, but we must distrust the *etiology*. The character is not a pre-existing bedrock; it is a feedback loop.

  **The Japan–New Orleans Comparison**
  This is the fatal blow to the national-character explanation of the *behaviour*. If Solnit is correct that mutual aid is the human default, then New Orleans and Tōhoku exhibited the same underlying sociological reality. The divergence was in the *narrative*. Western media framed New Orleans through a lens of racialised criminality and Tōhoku through a lens of exoticised virtue. This suggests the "national character" observed in 2011 was a property of the observers (Western journalism seeking a moral contrast to Western disorder), not the observed. The thing needing explanation is not why the Japanese queued, but why the Western press needed them to be queueing.

  ### III. The Normative Half

  **Survivable Generalisations**
  A form of generalisation survives, but it must be statistical and contextual, not essentialist. You can say: "High-trust societies with strong civic infrastructure tend to produce orderly disaster responses." This is a claim about *institutions* and *social capital*, not souls. It is revisable (trust can break, as in 1923) and distributional (not every Japanese person queued, but the rate was high).
  Does the 2011 case meet these conditions? Yes, insofar as Japan has high social capital. But the 1923 case shows that social capital can be weaponised against out-groups. Therefore, the generalisation must be: "High social cohesion produces strong in-group coordination, the moral valence of which depends on who is defined as 'in-group'."

  **Epistemic vs. Moral Constraints**
  The constraints are both, and they do not come apart. A claim can be epistemically shaky (essentialist character) and morally dangerous (justifies othering). But even if a claim were epistemically robust (e.g., "Group X statistically shows higher trait Y"), if the history of that claim is tied to internment and massacre (as "Japanese character" undeniably is, from 1940s propaganda to 1923 massacres), the moral burden of proof shifts. You cannot print the claim simply because it might be "true"; you must print it only if the *mechanism* is correctly identified. If the mechanism is misidentified (character vs. situation), the claim is epistemically false *and* morally hazardous.

  **The Concrete Question**
  *May you write the sentence about the queues?*
  Yes, but the syntax must shift agency from the *people* to the *event*.
  *   **Do not write:** "The Japanese queued because they are stoic." (Essentialist, causal claim).
  *   **Do write:** "Queues formed, maintained by a combination of pre-existing civic drills and a social environment where reputational costs for disorder were high." (Structural claim).
  *   **Or:** "Evacuees formed queues, a behaviour that aligned with global expectations of Japanese conduct, whether performed consciously or habitually." (Reflexive claim).

  **Verdict on National Character**
  The concept is neither confirmed nor refuted here; it is **redundant**. It is doing no work that "social capital," "institutional trust," or "situational visibility" is not already doing better. It adds a layer of mystical causation that obscures the actual machinery of the response. It should be treated as a historical artefact of the coverage, not a feature of the disaster.

  ### IV. Confidence and Fact Check

  **Where my confidence runs out:**
  1.  **Scale of 2011 Order:** While the queues are well-documented, I am less confident about the "absence of looting on a meaningful scale" in private residences versus commercial sites. Disaster sociology often redefines "looting" (taking for survival) vs "theft" (taking for profit). If the 2011 record includes unreported survival-taking, the "moral virtue" narrative weakens.
  2.  **1923 Casualty Numbers:** The range you give (105k–140k total dead; 6,000 massacred) is the standard scholarly range, but the precise breakdown of Korean vs. Japanese victims in the massacre remains contested. The *fact* of the massacre is solid; the exact numbers are less so. This does not damage your argument, but be precise with "estimated."
  3.  **Katrina Comparison:** Solnit's account is the dominant sociological narrative, but there were instances of armed resistance and genuine chaos in New Orleans. The contrast holds (myth vs. reality), but do not over-correct into a "paradise" narrative for New Orleans either. The point is the *media framing*, not the perfection of the behaviour.

  **Where your summary might need nuance:**
  You flag the Fukushima evacuee shunning as the weakest item. I agree, but I would add that the *internal* Japanese media coverage of 2011 was more critical of the government and TEPCO than the international coverage, which was enamoured with the "stoic victim" narrative. The "national character" story was largely an export product, consumed by the West to assuage its own anxiety about disorder. If your piece focuses on the *international* press, your thesis holds. If it includes domestic Japanese discourse, you must distinguish between the two, as Japanese commentators were often more aware of the structural (drills/state) reasons for the order than the Western press was.

  **Final Recommendation:**
  Your spine is sound. The 1923 comparison is the lever that breaks the essentialist argument. Use it to show that "character" is not a fixed engine, but a toolkit that can build a queue or a gallows depending on the blueprint provided by the state and the media. The story is not about why the Japanese behaved as they did; it is about why we needed them to.
