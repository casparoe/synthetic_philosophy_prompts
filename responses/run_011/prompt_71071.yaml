answer: |-
  Here is a complete design for the 75-minute section. It is built to be low-cost, high-friction, and structurally rigged to produce the specific epistemological crises you want.

  ### 1. The Object Assemblage (Scavenge List)
  You need **four identical sets** of 12 items. Gather these from your flat/office. Do not clean them.
  1.  **Keys:** 1 house key, 1 unidentified small key (on a ring or loose).
  2.  **Writing:** 1 nice metal pen, 1 cheap plastic biro.
  3.  **Paper:** 1 crumpled receipt (date visible), 1 sticky note with a name written on it.
  4.  **Consumables:** 1 half-eaten granola bar wrapper, 1 tea bag (loose), 1 blister pack of pills (2 missing).
  5.  **Tech:** 1 USB drive, 1 tangled earphone cable (cut or broken).
  6.  **Personal:** 1 coaster (stained), 1 bottle cap (twist-off), 1 hair tie or rubber band.

  **The "Intrusive" Items (For the Swap):**
  *   Have these in your pocket: 1 coin (any denomination), 1 matchstick, 1 different coloured bottle cap.

  ### 2. The Handout (20 Sheets Total)
  Print this half-sheet (2 per page) for every student. This is the **Commitment Mechanism**.

  ***
  **FIELD NOTE: ASSEMBLAGE INTERPRETATION**
  *Name: ______________________ Group Table: ______*

  **RULES OF INFERENCE:**
  1.  **No Text:** Ignore any legible writing on objects (names, dates, brands). Treat them as symbols only.
  2.  **Snapshot Assumption:** Assume these objects were deposited at the same time.
  3.  **Commitment:** You must make a choice. Ambiguity is not a valid conclusion.

  **PART A: THE INVENTORY (Minute 15)**
  Count the total number of objects in your tray. **Total Count: ______**

  **PART B: HARD CLAIMS (Minute 25)**
  *Discuss with your table, but write your own answers. Hand this slip in before you touch the objects again.*
  1.  **Social Hierarchy:** Was this space used by one person or many? Was there a power difference between them? (Circle one: Single / Multi / Hierarchical / Egalitarian). **Evidence Object:** _______________
  2.  **Ritual/Rule:** Identify one object that suggests a rule, habit, or non-utilitarian behavior. **Object:** _______________ **Inference:** _______________
  3.  **The "Anchor":** Which single object is most critical to your story? If this object were removed, would your story collapse? (Yes/No). **Object:** _______________

  *(TA USE ONLY: Received Time: ____)*
  ***

  ### 3. Provenance Cards (Handwritten on Scrap Paper)
  Do not print these. Write them on 4 distinct pieces of paper. Place one face down at each table.
  *   **Table 1:** "Context: Private Office Desk. Cleared the morning the owner resigned."
  *   **Table 2:** "Context: Shared Lounge Bin. Swept from the floor at the end of term."
  *   **Table 3:** "Context: Excavated Feature. No label. Stratigraphy unclear."
  *   **Table 4:** "Context: Private Office Desk. Cleared the morning the owner resigned." (Duplicate of Table 1).

  ### 4. Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:05 | Setup & Distribution**
  *   Students sit at 4 tables (5 per table).
  *   Place the **Object Tray** and the **Provenance Card** (face down) at each table.
  *   Hand out the **Field Note** slips.
  *   **Instruction:** "Do not flip the Provenance Card yet. You have 15 minutes to handle the objects, sort them, and discuss what they imply about the people who left them. You must ignore any text on the objects. Treat them as if you have never seen them before."

  **00:05 – 00:20 | Investigation Phase**
  *   Groups sort objects. They will naturally start building narratives based on the objects *and* the hidden Provenance Card (once they flip it, which they will do immediately).
  *   **TA Role:** Circulate. If a group says "This receipt says Starbucks," remind them: "Ignore text. What is the *shape* and *material* of the paper?"
  *   **TA Prep:** Have your pocket intrusive items ready.

  **00:20 – 00:30 | The Commitment (Crucial)**
  *   **Instruction:** "Stop handling. Fill out Part A (Count) and Part B (Hard Claims) on your Field Note. You must agree on the claims as a table, but write individually. You have 10 minutes."
  *   **TA Action:** At **Minute 28**, collect the Field Notes from each table. Stack them by table.
  *   **THE SWAP (Minute 29-30):** As you collect the papers from Table 1, quietly **remove** the *Nice Pen* and **add** the *Coin*. As you collect from Table 2, **remove** the *Pill Pack* and **add** the *Matchstick*. Table 3: **Remove** *USB Drive*, **Add** *Coloured Bottle Cap*. Table 4: Leave unchanged (Control).
  *   *Note:* Do this casually while making eye contact and asking, "Everyone got their claims down?" Do not draw attention to the tray.

  **00:30 – 00:45 | The Disturbance & Re-Analysis**
  *   **Instruction:** "Return to your objects. You have 15 minutes to prepare a 2-minute report for the class on the 'Social Hierarchy' of the people who left these items. Use the whiteboard."
  *   **Student Reaction:** Somewhere in this window, a student will recount the items for the report. They will notice the count is wrong or a specific object has changed.
  *   **TA Role:** If they ask "Did you change this?", say: "Archaeological sites are not sealed. Work with what is in front of you now." (Do not confirm the swap yet).
  *   **Whiteboard:** Divide the board into 4 quadrants. Each group writes: 1. Their Provenance. 2. Their Hierarchy Claim. 3. Their "Anchor Object."

  **00:45 – 00:55 | The Reveal (Friction Phase)**
  *   Bring the class to the whiteboard.
  *   **Step 1 (The Contradiction):** Point out Table 1 and Table 4. "You had the same Provenance. Did you reach the same conclusion?" (Likely no, due to group dynamics).
  *   **Step 2 (The Equifinality):** Point out Table 1 and Table 2. "Look at the objects. Table 1 said 'Hierarchical Office.' Table 2 said 'Communal Lounge.' Yet, 10 of the 12 objects are identical. How is that possible?"
  *   **Step 3 (The Disturbance):** "Check your Field Note Part A (Count) against the objects currently in your tray."
  *   Let the realization land. They committed to claims based on an assemblage that no longer exists. Ask Table 1: "Your Anchor Object was the Pen. Is it still there?"

  **00:55 – 01:15 | Debrief (Concept Mapping)**
  *   (See script below).

  ---

  ### 5. Debrief Script & Concept Mapping
  *Do not use jargon until the last 10 minutes.*

  **Phase 1: The Provenance Trap (5 mins)**
  *   **Ask:** "Table 1 and Table 2 had almost the same trash. Why did Table 1 see a 'Boss' and Table 2 see a 'Student'?"
  *   **Concept:** **Equifinality.** Different processes (working vs. lounging) can create the same material record. The objects didn't change; the *story* you were allowed to tell changed because of the Provenance Card.
  *   **Point:** In archaeology, context is not just 'where' it is, it's the story of how it got there. If we guess the story wrong, the objects lie to us.

  **Phase 2: The Snapshot Lie (5 mins)**
  *   **Ask:** "Who noticed their object count changed? Who built a theory around the Pen that isn't there anymore?"
  *   **Concept:** **The Pompeii Premise.** We assume a site is a frozen moment (like Pompeii). It is almost never true. Sites are palimpsests. Objects leak in and out.
  *   **Point:** You made confident claims about 'Hierarchy' based on one item. That item might be 'intrusive' (like the coin I added). If your theory collapses because one object moved, your theory was too fragile.

  **Phase 3: Function vs. Meaning (5 mins)**
  *   **Ask:** "Did anyone argue about what the USB drive *was*?" (No, they know). "Did you argue about what it *meant*?" (Yes, secrecy vs. work vs. storage).
  *   **Concept:** **Underdetermination.** Function is often easier to guess (analogy) than social meaning.
  *   **Point:** We used **Ethnoarchaeology** (our own modern experience) to interpret these. That worked because they are modern. If this were a Bronze Age object, we wouldn't know if the 'Key' was for a door, a box, or a god.

  ### 6. Risk Management: What Will Go Wrong

  **1. The "Just Describe" Group**
  *   *Risk:* One table refuses to speculate, just listing "This is a pen, this is a key."
  *   *Fix:* During the Commitment Phase, circulate to that table. Say: "I need you to bet $100. If you say 'we don't know,' you lose. What is your best guess?" The Field Note forces a circle selection (Single/Multi/Hierarchical). They cannot leave it blank.

  **2. The "Read the Label" Cheat**
  *   *Risk:* Students ignore the "No Text" rule to solve the ambiguity.
  *   *Fix:* Enforce this ruthlessly in the first 5 minutes. "If you read the name on the sticky note, you are contaminating the data. Put it face down." This simulates the loss of language in deep time.

  **3. The Swap Goes Unnoticed**
  *   *Risk:* They don't recount the items.
  *   *Fix:* The Field Note Part A requires a **Total Count**. In the Reveal, explicitly say: "Look at your Field Note Count. Now count your tray. If they differ, raise your hand." This makes the disturbance empirical, not anecdotal.

  **4. The "Parlour Game" Reaction**
  *   *Risk:* Students laugh off the contradiction ("Haha, you tricked us").
  *   *Fix:* Shift tone immediately in the Debrief. "This was a game. In real archaeology, this is how we decide who owns land, whose ancestors are displayed in museums, and what counts as 'civilization.' When we project hierarchy onto objects that don't support it, real people get erased."

  ### 7. Limitations: What This Activity Cannot Reproduce
  *Be straight with them about this in the final 2 minutes.*

  1.  **Time Depth:** This activity happened in 30 minutes. Real assemblages accumulate over centuries. The "noise" of time is much louder than the "signal" of the swap I did.
  2.  **Taphonomy:** These objects didn't rot, rust, or get eaten by rats. Real inference is fighting against decay, not just interpretation.
  3.  **Cultural Intimacy (The Big One):** You know what a key is. You have **cultural intuition**. Real archaeologists often deal with objects whose *function* is unknown, not just their meaning. You had an unfair advantage: you are the culture you are studying. Real archaeology is often studying *others*.

  ### 8. Why This Design Works for Your Constraints
  *   **Budget:** $0. Objects are trash/office supplies.
  *   **Printing:** 20 half-sheets (Field Notes). Provenance cards are handwritten scraps.
  *   **AV:** Not used. Whiteboard is the central visual.
  *   **Commitment:** The Field Note is collected *before* the swap. They cannot revise their "Anchor Object" claim without admitting they lied on the slip.
  *   **Friction:** The friction comes from **Table 1 vs Table 2** (Same objects, different story) and **Field Note vs Current Tray** (Same group, different reality). You don't have to lecture on interpretation; the room argues with itself.
