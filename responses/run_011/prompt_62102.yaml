answer: |-
  **1. The pitch**
  This game is designed to make you feel epistemic pain. You will be given testimony from reliable sources about events in this school. You must bet points on whether they are true. The trap is that some testimony is strong but the event is impossible. If you believe the witness blindly, you lose. If you sit on the fence, you gain nothing. The goal is to feel the exact moment where evidence quality collides with prior probability, forcing you to reject a reliable witness because what they saw is too weird.

  **2. What you need**
  *   10 envelopes (sealed with the 'Truth' written inside).
  *   14 sheets of paper (one per student for betting).
  *   Pens.
  *   A jar of sweets (for the winner).
  *   Whiteboard (for scoring rules).
  *   Printed Report Cards (see below).

  **3. The report cards**
  *Print these on slips of paper. Do not let them see the 'Truth' inside the envelopes.*

  1.  **Card 1:** "Mr. Henderson wore a blue tie today." (Witness: Site Manager). **Truth: TRUE.**
  2.  **Card 2:** "The fire alarm was tested at 10am." (Witness: Secretary). **Truth: TRUE.**
  3.  **Card 3:** "Room 12 had a broken projector." (Witness: IT Tech). **Truth: TRUE.**
  4.  **Card 4:** "The canteen ran out of pizza." (Witness: 5 Students). **Truth: TRUE.**
  5.  **Card 5:** "The Headteacher arrived by helicopter." (Witness: Site Manager). **Truth: FALSE.**
  6.  **Card 6:** "A student levitated in assembly." (Witness: 2 Prefects). **Truth: FALSE.**
  7.  **Card 7:** "The bus broke down outside." (Witness: Driver). **Truth: TRUE.**
  8.  **Card 8:** "The bus arrived on time." (Witness: Driver). **Truth: FALSE.** (Paired with 7).
  9.  **Card 9:** "It rained during break." (Witness: Everyone). **Truth: TRUE.**
  10. **Card 10:** "The library was closed." (Witness: Librarian). **Truth: TRUE.**

  **Balance:** Eight mundane claims (mostly true) build trust in testimony. Two miracle claims (fixed false) punish credulity. One contradictory pair (7 & 8) forces evidence cancellation. This mix ensures high confidence pays off generally, but specifically penalises believing the miraculous.

  **4. Minute by minute**
  **0–5 mins:** Split into pairs. Explain the goal: accumulate points by judging truth. Hand out Cards 1–4. Students write a confidence score (0–10) for each. 10 means 'Certain True', 0 means 'Certain False'. Collect bets.
  **5–15 mins:** Reveal Truths for 1–4 by opening envelopes. Most are True. Students who bet 9 or 10 gain points. Update scores. Hand out Cards 5–6 (The Miracles). Emphasise the witnesses are the same quality as Card 1. Students bet. Collect bets.
  **15–25 mins:** Reveal Truths for 5–6. Both are False. High believers lose heavy points. Hand out Cards 7–8 (The Contradiction). Explain witnesses are identical. Students bet. Collect bets.
  **25–35 mins:** Reveal 7–8. One True, one False. Reveal 9–10 quickly. Calculate final scores.
  **35–45 mins:** Debrief. Announce winner. Distribute sweets. Move to whiteboard for discussion.

  **Timing Note:** Keep the reveal of the Miracle Truths dramatic. Pause before opening. Ensure the 'Driver' witness on Cards 7–8 is noted as the same person to highlight the contradiction.

  **5. Scoring**
  Write this on the board:
  *   **If the Card is TRUE:** You gain points equal to your confidence score (0–10).
  *   **If the Card is FALSE:** You lose points equal to your confidence score (0–10).
  *   **The Fence-Sitter Rule:** If you bet exactly 5, you gain 0 points regardless of the truth.

  This makes safety costly. To win the sweets, you must be bold on mundane things (Cards 1–4) but sceptical on weird things (Cards 5–6). If you bet 5 on everything, you finish with 0 points while others gain 30+. If you bet 10 on the helicopter, you lose 10 points instantly. The scoring forces you to weigh the *content* of the claim, not just the *quality* of the witness.

  **6. The debrief**
  Ask the student who lost the most points on Card 5 why they believed the Site Manager. They will say, "He's reliable." Write this on the board. Then ask why they didn't believe Card 6 (levitation) as much. They will say, "Because people don't fly."

  Now you introduce Hume. Write **Hume** on the board. Explain that this feeling—trusting the witness on the tie but not the helicopter—is exactly Section 10 of the *Enquiry*. Hume argues a wise man proportions his belief to the evidence. But the evidence isn't just the witness; it's the witness *versus* your experience of how the world works.

  Point to Cards 7 and 8. Ask how they handled two equal witnesses contradicting each other. They likely lowered confidence on both. Tell them this is Hume's second move: when miracles cancel each other out (e.g., different religions claiming exclusive miracles), the evidence destroys itself.

  Finally, address the scoring. The game punished them for believing the miracle even though the witness was good. Hume's claim is stronger: you should *never* believe a miracle on testimony alone, because uniform experience against it outweighs any human testimony. The game rigged the miracle as false; Hume argues it is effectively false by definition of being a miracle.

  **7. What'll go wrong**
  **The Fence-Sitters:** Some will bet 5 on everything to avoid risk. *Fix:* Remind them halfway through that 5 yields zero points. They cannot win the sweets this way. They need to accumulate positive points on the mundane cards to survive the miracle penalty.
  **The Cynics:** Some will bet 0 on everything claiming "nothing is certain". *Fix:* Point out Card 9 (It rained). If they bet 0 on that, they lose points on obvious truths. They must engage with base rates.
  **Timing:** The reveal can drag. *Fix:* Pre-open the envelopes slightly so you can pull the truth slip out instantly. Do not debate the truth during the reveal; the envelope is absolute authority for the game.

  **8. Where the game is rigged**
  Be honest with them. The game assumes Naturalism. I fixed the miracle cards as 'False' before you walked in. In the real world, we don't have an envelope to open. Hume's argument relies on 'uniform experience'—that miracles never happen. The game builds this in by fiat. I supply the conclusion (miracles are false) that Hume tries to prove via probability. Also, the game treats testimony as static data; in reality, witnesses lie or err. Hume assumes testimony is always weighed against natural law. The game simplifies this to show the *structure* of the argument, not the metaphysical proof. You must supply the philosophical heavy lifting about whether uniform experience actually rules out miracles permanently.

  **Is the mock trial weaker?**
  Yes, significantly. A mock trial assumes the question is "Did this happen?" and encourages students to act as lawyers weighing evidence *for* the miracle. This reinforces the idea that enough testimony *could* prove a miracle, which is exactly what Hume denies. Your students need to feel that the *nature of the event* dictates the required evidence, not just the quality of the witness. A trial focuses on the witness; this game focuses on the prior probability. The trial makes them debate facts; this game makes them debate epistemology. The trial suggests miracles are possible if you win the argument; this game shows that believing the miracle is irrational even if the witness is honest.
