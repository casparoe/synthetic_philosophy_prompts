          *   *The Commitment:* This looks like "double dipping" or p-hacking. A coherent account would need to be *Bayesian* or *Abductive*. You aren't "testing" in a Popperian falsification sense; you are refining a model to maximize explanatory power across cases.
          *   *The Defense:* "Out-of-sample" prediction (e.g., predicting 2010s instability from 2000s data). But if the proxies were tuned on *previous* centuries, is it truly out-of-sample?
