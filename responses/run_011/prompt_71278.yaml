          *   *The Commitment:* To treat the index as a time series driving a differential equation, you need *construct validity*. You are committing to *functional equivalence*. It doesn't require the *essence* of 1780 England to be identical to 2020 US, but it requires the *causal mechanism* linking the proxy to the outcome to be structurally invariant.
          *   *Middle Ground:* "Family Resemblance" (Wittgenstein) or "Cluster Concepts." The proxies covary not because of a single essence, but because they indicate a specific systemic state (disequilibrium).
          *   *Risk:* Reification. Treating the index as a physical quantity (like temperature) rather than a heuristic.

