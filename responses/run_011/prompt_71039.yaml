  4. If standing were a distinct normative power, we should see cases where hypocritical blame is morally permissible yet still invalid, but no such cases exist,* though standing theorists deny this requirement.
  5. Can you describe a scenario where hypocritical blame is perfectly fair and sincere, yet you would still insist the blamer lacks the position to speak?
