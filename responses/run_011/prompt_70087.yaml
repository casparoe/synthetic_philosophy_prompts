answer: |-
  The collision here is between biography as ethical technology (Plutarch) and biography as epistemic failure (Welles). Plutarch's project in the *Parallel Lives* is explicitly optimization-oriented: you read lives to download virtue or patch vice. The *Alexander* proem claims high-fidelity data compression—that a "slight thing" (a joke, a gesture) encodes character better than bulk data (battles). The *Pericles* proem asserts the transmission protocol works: admiration triggers imitation. The *Demetrius* proem handles error correction: bad lives teach avoidance.

  *Citizen Kane* accepts Plutarch's premise about the "slight thing" but breaks the transmission protocol. Rosebud is precisely the Plutarchan detail: a trivial object that encodes the whole man. But the film refutes Plutarch by showing that while the detail reveals *psychology*, it yields no *ethical verdict*. Rosebud explains Kane's loneliness (causal mechanism), but it does not tell Thompson whether Kane was good or bad, nor what to imitate or avoid. Plutarch assumes the slight thing discloses character *for use*. Kane shows the slight thing discloses character *for understanding only*, and even then, only for the audience, not the biographer. Thompson burns the report. The ethical technology fails to output a directive.

  This addresses the trap regarding Kane as a bad exemplar. If Kane were merely a Demetrius-figure, Plutarch would vindicate himself: we would learn what to avoid. But Thompson's conclusion is universal, not particular: "I don't think any word can explain a man's life." The film argues that biography cannot access character at all, only projections. The witnesses (Bernstein, Leland, Susan) do not provide testimony about Kane; they provide testimony about themselves. Bernstein's hagiography isn't a failure of method; it's a feature of love, but it blocks the ethical signal. Leland's moralism preserves the signal but severs the connection (he gets fired). Plutarch requires the biographer to be both lover and judge. *Kane* argues these states are mutually exclusive. You can have Bernstein's loyalty or Leland's truth, not the Plutarchan synthesis required for imitation.

  What the film shows that exemplarist theory misses is the opacity of testimony. Contemporary exemplarism (e.g., Zagzebski) assumes admiration is a reliable perceptual mode for moral knowledge. *Kane* suggests admiration is a hallucination. Bernstein admires Kane constantly; his moral knowledge is zero. Furthermore, the film highlights the privacy of the "slight thing." For Plutarch, the detail is public history. For Welles, the detail (Rosebud) is private property, burned before it can be socialized. If the key to the life cannot be shared, it cannot be imitated. Biography requires public data; Kane's truth is fundamentally private.

  There are significant liberties taken here. Reading Plutarch as a modern epistemologist strains the text; he is a Middle Platonist concerned with soul-care, not empirical verification. He might argue Thompson failed because he lacked philosophical training, not because the method is broken. Similarly, attributing a deliberate epistemology-of-biography argument to Welles risks intentional fallacy; the film is modernist fragmentation, not necessarily a thesis on Plutarch. However, treating the film as a thought experiment on the *Lives* holds: if Plutarch's method were applied to Kane, it would produce either Bernstein's lie or Thompson's silence.

  The film ultimately drives a wedge between explanation and judgment. Plutarch assumes that if you explain the man (via slight things), the judgment (imitate/avoid) follows automatically. *Kane* shows you can explain the man (trauma) and remain ethically paralyzed. The map does not lead to the territory of virtue.

  Verdict: REFUTES-PLUTARCH (The slight thing reveals trauma, not imitable ethical character.)
