      *   Task: "Write a function $f(n)$ that outputs an element of $S_n$."
      *   If the cards just say "Non-empty subset of $\mathbb{R}$", they can't write $f$.
      *   Better: Give them specific sets that *look* pickable but aren't uniformly definable. E.g., $S_n = \{x \in \mathbb{R} \mid x^2 + a_n x + b_n = 0\}$ where $a_n, b_n$ are hidden? No, too complex.
      *   Best: The "Black Box" approach. The envelopes contain specific finite sets of integers, but the pattern is random/unknown.
