      *   Okay, let's make Round 3 exactly that proof. Give them 10 envelopes (representing $A_1 \dots A_{10}$ to start, then reveal there are infinitely many). Inside are cards representing elements. They need to map $\mathbb{N} \times \mathbb{N} \to \bigcup A_i$. To do that, they need to index each $A_i$.
