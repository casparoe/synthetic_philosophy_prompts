  (d) **Vulnerability to Self-Refutation**

  The charge is: *If all claims are empty/unfounded, your claim is empty/unfounded.*

  *   **Stratified Conventionalism:** **Vulnerable.** By asserting the claim is "conventionally true," she posits a convention that grounds the claim. The Visitor can argue this smuggles in a positive ontology of conventions. If conventions have rules (truth conditions), they function like intrinsic natures.
  *   **Presuppositional Failure:** **Less Vulnerable.** She denies the claim has a truth value at all. However, the Visitor can argue that *asserting* the presupposition failure is itself a positive claim about language/reality.
  *   **Therapeutic Contextualism:** **Most Resilient (Nāgārjuna's *Vigrahavyāvartanī* stance).** She explicitly denies holding a view ("I hold nothing"). The claim is not a description of reality but an action (curing). An action does not need to be "true" in a correspondence sense to be effective.
      *   *Does the charge have purchase?* Only if she slips and asserts the *theory* of Therapeutic Contextualism as a true description of how language works. If she remains consistent and treats her own explanation as *also* therapeutic (a ladder to be kicked away), the charge fails. The Visitor's demand for a "determinate value" is the trap; if she accepts the terms of the debate (that claims must have truth values), she loses. If she rejects the terms, she survives.

  (e) **Diagnostic Question**

  To separate **Stratified Conventionalism** from **Therapeutic Contextualism**, ask a case where conventional truth and therapeutic efficacy come apart.

  **Question:** "Suppose a student is comforted and stops clinging to suffering by believing in a permanent self (*ātman*). Should you affirm the statement 'The self is permanent' to them?"

  *   **Stratified Conventionalism:** Must say **No**. The statement is ultimately false and conventionally false (incoherent with dependent arising). Truth is normative; you cannot affirm a falsehood even if it helps.
  *   **Therapeutic Contextualism:** Can say **Yes** (provisionally). If the statement cures the specific disease (e.g., nihilistic despair) without creating a worse attachment, it is a valid "skillful means" (*upāya*). The criterion is efficacy, not correspondence.
  *   **Presuppositional Failure:** Would say **No**. The term 'self' fails to refer; affirming it reinforces a category error.

  **Why this separates them:** The *Person/Aggregates* ruling shows she affirms conventional responsibility (acting, guilt). But she denies the self. The question forces her to choose between *truth* (Conventionalism) and *cure* (Contextualism). Given her "I hold nothing" stance in debates, if she says "Yes, if it cures them," she confirms Contextualism. If she says "No, it is false," she confirms Conventionalism. Given the *Debate Session* data (refusing to refute if no one holds a view), she likely prioritizes the interlocutor's state over the proposition's status, pointing to **Contextualism**.
