answer: |-
  ### The Principles

  You are grappling with the tension between **responsibility** and **fairness**. Your intuitions reject a simple "option luck vs. brute luck" split because you recognize that some "options" are not truly free, and some "luck" is socially constructed.

  I offer you two principles. The first is the **Clean Principle** you requested: a single standard that simplifies your moral landscape but requires you to abandon one intuition. The second is the **Contraption**: a multi-clause framework that preserves all your verdicts but at the cost of complexity.

  **1. The Clean Principle: The Sovereign Agency Principle**
  *Statement:* Compensation is owed for all harms unless the individual sovereignly owned the risk, defined as making a voluntary choice with accurate information and reasonable alternatives.
  *The Cost:* To make this work, you must drop the distinction between **Tomás** and **Marisol**. Both accepted economic risks to maintain their livelihoods. Distinguishing "wage premium" from "job retention" is too fine a line for a clean rule. Under this principle, Tomás is not compensated, aligning him with Marisol.

  **2. The Contraption: The Sovereign Agency Framework**
  This framework saves all your verdicts by adding four specific clauses to the Clean Principle. It acknowledges that "agency" is degraded by information asymmetry, structural coercion, social obligation, and physical endowment.

  ### Table 1: The Contraption's Clauses

  | Clause | What it says in one sentence | Which of my cases forced it | What it costs you (ad hocery, or something it wrongly rules out) |
  | :--- | :--- | :--- | :--- |
  | **The Information Clause** | If risk terms were misrepresented or hidden, the agent does not own the outcome. | Marisol (lied to about injury rate) | Requires adjudicating what counts as "material" information; opens door to frivolous claims of ignorance. |
  | **The Coercion Clause** | If alternatives were constrained by structural necessity (care, survival), the risk is not voluntary. | Tomás (night shift for childcare) | Blurs the line between "hard choice" and "no choice"; potentially compensates all low-wage risk-taking. |
  | **The Value Clause** | Risks undertaken for social/familial duty or value creation are society's burden; private gambling is not. | Yvonne (caregiver) vs. Nate (soloist); Startup vs. Lottery | Paternalistic; requires a central authority to define "social value" vs. "private pleasure." |
  | **The Endowment Clause** | Harms from external physical constraints are compensated; harms from internal preference cultivation are not. | Lena (gut condition) vs. Ross (expensive taste) | Difficult to distinguish psychological needs from physical ones; risks medicalizing lifestyle choices. |

