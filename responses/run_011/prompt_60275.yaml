  1. This project asks whether well-foundedness is a necessary condition for fundamentality or if explanatory bedrock can be defined independently of ontological termination. The determinate answer sought is whether non-well-founded grounding structures can sustain the explanatory priority traditionally assigned to the fundamental level.

  2. Current debates either enforce well-foundedness to preserve fundamentality or accept non-well-founded structures while abandoning traditional hierarchical priority. Quietist accounts dissolve the problem but fail to explain why specific domains appear explanatorily privileged despite ontological looping. No existing account attempts to retain a robust notion of fundamentality while explicitly relinquishing the requirement that grounding chains must terminate.

  3. I will employ conceptual analysis on specific non-well-founded case studies, such as mutual dependence in material constitution, rather than constructing a purely formal model. A formal approach risks validating structural coherence without demonstrating whether the resulting notion can actually underwrite ontological priority or domain levels. This method ensures the proposed notion of bedrock retains the explanatory power required by metaphysical practice.

  4. Success looks like a defined notion of bedrock that sustains domain priority, such as physics over sociology, without requiring grounding chains to bottom out. The project fails if the proposed notion inevitably collapses back into standard ontological fundamentality or proves too weak to distinguish levels within a domain. If the distinction between explanatory and ontological jobs cannot be made precise, the question is likely trivially answerable in the negative.

  5. Three months is sufficient to define the notion and test it against one primary case study, such as the whole-part relation, without attempting a full taxonomy of domains. If progress stalls, I will cut the comparative analysis of distinct sciences to focus solely on whether the definition coheres within a single metaphysical context. This ensures a complete argument regarding the core distinction even if the broader applications remain undeveloped.
