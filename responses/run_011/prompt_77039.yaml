answer: |-
  ### I. The Correspondence

  To audit the analogy, we must first map the structural roles. The defender of fanaticism uses two distinct source domains: the **Insurance Market** and the **Casino House**. While often conflated, they map onto the fanatical agent differently.

  **1. The Insurance Analogy**
  *   **The Fanatic:** The **Policyholder**. They are offered a contract: pay a certain, modest cost (premium) to secure a massive payout in a low-probability catastrophic scenario.
  *   **The Mugger/Opportunity:** The **Insurer**. They underwrite the risk.
  *   **The Certain Cost:** The **Premium**.
  *   **The Enormous Payoff:** The **Indemnity** (coverage against existential ruin or for astronomical good).
  *   **The Actuarial Table:** The **Probability Assignment** (the $1/10^{100}$ chance).
  *   **Pooled Risk:** The **Portfolio of Policies** (the assumption that this logic holds across many decisions).
  *   **The Regulator/Capital Reserve:** The **Constraint** ensuring the insurer can actually pay (solvency).

  **2. The Casino Analogy**
  *   **The Fanatic:** The **House**. They argue that rationality consists in holding the side of the bet with positive expected value (EV), trusting that the average will manifest.
  *   **The World:** The **Gambler**. The source of stochastic variance.
  *   **The Certain Cost:** The **Capital at Risk** per hand.
  *   **The Background Fact:** The **Law of Large Numbers (LLN)**. The House keeps playing tomorrow; the average converges to the EV over $N$ trials.

  The defender's claim is that because the Policyholder/House acts rationally in these domains by respecting EV in tail scenarios, the Fanatic acts rationally in doing the same. The audit follows.

  ---

  ### II. The Disanalogies

  The analogy fails not because it is colorful, but because it conceals structural prerequisites for EV reasoning that are absent in the fanatical case.

  #### 1. The Ergodicity Gap (Repeatable vs. One-Shot)
  The Casino analogy relies entirely on the **Law of Large Numbers**. The House wins because it plays $N \to \infty$. The ensemble average (EV) equals the time average (actual accumulation of wealth).
  *   **The Disanalogy:** The fanatical agent is almost always playing a **one-shot game**. Whether it is an existential risk intervention or a Pascal's Mugging, the agent occupies a single timeline. They cannot realize the average.
  *   **The Consequence:** In non-ergodic systems, maximizing ensemble EV does not maximize time-average growth. If a bet has a positive EV but a non-zero probability of total ruin (an absorbing state), a repeated player goes bankrupt with probability 1 as $N \to \infty$. The Casino House avoids this via **capital reserves** and **bet limits**. The Fanatic, by accepting arbitrarily large costs for tiny probabilities, often risks the very capital reserves required to stay in the game. The Casino analogy thus smuggles in a condition (repeatability) that falsifies the conclusion (that one should take the bet) when applied to a single trajectory.

  #### 2. Epistemic Calibration (Market vs. Armchair)
  Insurance premiums are not guessed; they are **market-discovered prices** refined by competition, regulation, and historical loss data (base rates). If an insurer misprices tail risk, they go bankrupt and exit the market. This is a feedback loop that enforces epistemic humility.
  *   **The Disanalogy:** Fanatical probabilities (e.g., "probability that this donation prevents AI apocalypse") are **armchair priors**. There is no base rate for "worlds saved," no market competition to correct the probability, and no bankruptcy mechanism to prune bad actuaries.
  *   **The Consequence:** The "Actuarial Table" in fanaticism is uncalibrated. In insurance, the premium is trusted *because* the probability is constrained by reality. In fanaticism, the probability is often derived from a theoretical model that is immune to falsification. The analogy borrows the credibility of the *institution* (insurance) without the *mechanism* (feedback) that makes the institution reliable.

  #### 3. Utility Structure (Smoothing vs. Linearity)
  This is the most damaging disanalogy. Why do people buy insurance? Mathematically, insurance premiums almost always have **negative expected monetary value** (Premium > Expected Loss). If they didn't, the insurer would starve.
  *   **The Logic:** We buy insurance because of **diminishing marginal utility** (concave utility function). Losing \$500,000 hurts more than 1,000 times as much as losing \$500. We pay to smooth consumption and avoid an **absorbing state** (ruin/homelessness).
  *   **The Disanalogy:** Fanaticism typically assumes **linear utility** (1 life = 1 unit; $3 \uparrow\uparrow\uparrow 3$ lives = that many units). The Fanatic argues for accepting the bet because $Probability \times Payoff > Cost$.
  *   **The Consequence:** The Insurance analogy validates **risk aversion**, not EV maximization of raw units. It justifies paying to *avoid* a bad tail, not paying to *chase* a good tail, unless utility is linear. If utility is concave (as insurance logic presupposes), the Fanatic's calculation collapses. The defender has borrowed the credibility of a practice whose actual logic (bounded utility, ruin avoidance) is hostile to their conclusion (unbounded EV maximization).

  #### 4. Identity and Contract (Who Pays, Who Collects?)
  In insurance, the policyholder and the beneficiary are usually the same legal entity, bound by contract. In the Casino, the House collects winnings immediately.
  *   **The Disanalogy:** In longtermist fanaticism, the **payer** is the current generation, but the **collector** is a future generation that does not exist yet and cannot consent. There is no contract, no legal recourse, and no feedback loop.
  *   **The Consequence:** This introduces a severe **principal-agent problem**. The "Actuary" (current agent) is pricing risk for a "Policyholder" (future people) who cannot verify the claim. In insurance, if the insurer denies a valid claim, the regulator intervenes. In fanaticism, if the "payoff" fails to materialize (because the probability was wrong), the payers are dead and the collectors are non-existent. The analogy hides the asymmetry of accountability.

  ---

  ### III. What the Analogy Can Carry

  Does the analogy shift the burden of proof to the critic? **No.** It establishes only that *tail-risk management* is respectable, not that *unbounded EV maximization* is.

  1.  **Valid Inference:** It is rational to spend resources to mitigate low-probability, high-impact *risks of ruin* (existential risk mitigation). This aligns with the Insurance logic of avoiding absorbing states.
  2.  **Invalid Inference:** It is rational to incur *certain costs* for low-probability, high-impact *gains* (Pascal's Mugging) when those costs approach the agent's capacity to operate.
  3.  **The Burden:** The burden remains on the defender to explain why the **ergodicity break** (one-shot vs. repeatable) and the **utility function** (concave vs. linear) do not negate the EV calculation. The analogy obscures these hurdles rather than clearing them.

  **Casino vs. Insurance:**
  *   The **Casino Analogy** is weaker. It fails outright on the repeatability condition. An individual cannot be the House.
  *   The **Insurance Analogy** is stronger but self-defeating. It successfully argues for caring about tail events, but it does so by invoking risk aversion and ruin avoidance, which are the very arguments critics use to *reject* fanaticism (i.e., "Don't bet the farm on a long shot").

  ---

  ### IV. A Better Source Domain: The Ruin Problem

  If we want an analogy that preserves the validity of EV reasoning while making the structural limits visible, we should look to **Venture Capital Portfolios vs. All-In Bets**, or more formally, **Ergodicity Economics**.

  **The Analogy:**
  *   **Rational EV Reasoning:** A Venture Capital firm invests small amounts in 100 high-risk startups. Most fail, one succeeds massively. The *portfolio* maximizes EV.
  *   **Fanatic Reasoning:** An investor puts 100% of their capital into *one* startup because it has the highest potential valuation, despite a 99.9% chance of zero return.

  **What this licenses:**
  1.  **Portfolio Theory:** It validates EV reasoning only when risks are **pooled**. You can be fanatical about the *aggregate* of your actions, but not about any *single* action that risks ruin.
  2.  **The Kelly Criterion:** It highlights that optimal growth requires betting a *fraction* of capital proportional to the edge, not the full cost. If the "certain cost" of the fanatical act exceeds the Kelly fraction (risking ruin), it is irrational, regardless of EV.
  3.  **Absorbing States:** It makes visible the difference between a setback (losing a bet) and a game-over (extinction/bankruptcy).

  **Why this is superior:**
  It accepts the defender's premise (EV matters) but corrects their application (EV applies to ensembles, not single trajectories with ruin risk). It shifts the debate from "Is EV real?" to "Is this agent playing a repeatable game or a one-shot survival game?"

  ### V. Conclusion

  The insurance/casino analogy is a **persuasive definition** masquerading as a structural argument. It imports the *prestige* of actuarial science without the *constraints* (pooling, calibration, solvency, concave utility) that make actuarial science work.

  It does not shift the burden of proof. Instead, it reveals that the critic's objection is not to EV reasoning *as such*, but to **EV reasoning in non-ergodic contexts with uncalibrated probabilities.** The defender cannot use the insurance analogy to defeat this objection, because insurance is precisely the practice of managing non-ergodic risks through pooling and risk aversion—mechanisms the fanatic explicitly wishes to bypass.

  If the argument is to be saved, it must be made directly, without analogy: one must argue either that (a) the agent *is* part of a sufficiently large ensemble (e.g., a multiverse or vast civilization) to realize the average, or (b) utility is truly linear and ruin is impossible. The insurance analogy helps neither case; it inadvertently argues against both.
