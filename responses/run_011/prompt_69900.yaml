      *   *Is it Substantive?* Yes, deeper down. It's about whether moral reasons are *commensurable*.
      *   *The "Two Utilitarians" Move:* This doesn't rescue the argument; it *relocates* it. It shows trade works *if* values are commensurable. The real fight is whether they *are*. The friend says "structure matters more than source." The user says "source determines structure."
      *   *The Complicity Objection:* This isn't just empirical (erosion of standing). It's structural. If I fund your abortion clinic (hypothetically) and you fund my anti-abortion campaign, have we reduced harm? Maybe globally. But have *I* sinned? The friend says "look at the global vector." The user says "look at my hands."

  5.  **Drafting the Argument (Iterative Process):**

