      *   *Addressing Complicity & Duties:* These aren't separate objections; they are the same point. If duties are constraints, complicity is inevitable. If duties are weights, complicity is just a cost. The friend treats them as weights; the user treats them as constraints.
      *   *The Asymmetric Abstention Case:* Why the agreement/disagreement split? They agree on the *permissibility* (consequentialist view) but disagree on the *categorization* (deontological view). To the user, calling it "trade" implies a moral equivalence they reject.
