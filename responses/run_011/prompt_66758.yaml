answer: |-
  This is a precise dissection of the epistemological foundations of modern cryptography. You have correctly identified that the field operates on a hybrid epistemology: it uses the *language* of mathematics (proofs, reductions, theorems) to justify what is ultimately an *engineering* judgement based on empirical resilience.

  Here is an analysis of the philosophical commitments of practical cryptography, adhering to your constraints and using British English.

  ### 1. Induction over an Unbounded Class
  **The Practice:** Cryptographers assume that because no polynomial-time algorithm for factoring large integers has been found despite decades of scrutiny by brilliant minds, no such algorithm exists (or at least, none exists that is feasible to run).

  **The Presupposition:** This presupposes a form of **abductive reasoning** (inference to the best explanation) rather than strict induction. It relies on the assumption that mathematical structure is not arbitrarily opaque. If a shortcut existed, the assumption goes, it would likely resonate through related areas of number theory or complexity theory, leaving traces we would have noticed.

  **Strict vs. Compatible:**
  *   **Strictly presupposed:** The field commits to the idea that the space of algorithms is not a "black box" where solutions can hide without consequence. It assumes a correlation between *human discovery* and *mathematical existence*.
  *   **Merely compatible:** A strict mathematical realist might say the algorithm doesn't exist. A sociological constructivist might say it exists but the social conditions to produce it haven't arisen. The practice works for both, provided they agree that *future discovery probability is low*.
  *   **Why it feels legitimate:** In number theory, a conjecture remains a conjecture until proven. In cryptography, a conjecture is treated as a fact because the cost of being wrong is localised (a broken key), whereas the cost of waiting for proof is total paralysis. The legitimacy comes from **risk management**, not logical necessity. We treat the absence of counterexamples as law-like because the alternative is inaction.

  ### 2. Asymmetry and the Empirical Reading
  **The Practice:** A single published attack (e.g., against MD5 or RC4) renders a primitive deprecated, regardless of how many years it survived previously. Conversely, thirty years of survival proves nothing definitive.

  **The Presupposition:** This is classic **Popperian falsificationism**. Cryptographic assumptions are treated as scientific hypotheses, not mathematical axioms.

  **The Thermodynamic Analogy:**
  You are correct to identify the comparison to thermodynamics. The Second Law is not "proven" in the sense of a geometric theorem; it is accepted because no violation has ever been observed, and the statistical mechanics underpinning it are robust. Similarly, computational hardness is treated as a **law of computational physics**.

  **Shor's Algorithm and Contingency:**
  Shor's algorithm complicates this. It demonstrates that the hardness of factoring is contingent on the physical laws governing the attacker's computer (specifically, whether they can maintain quantum coherence).
  *   **Why this makes the empirical reading better:** It confirms that security is physical. It anchors the "hardness" in the real world (quantum mechanics) rather than pure logic. It validates the view that cryptography is about the *cost of physical processes*, not just abstract symbols.
  *   **Why this makes it worse:** It undermines the idea of "timeless" security. If security depends on the state of physics (classical vs. quantum), then our "proofs" are merely relative to a specific technological epoch. It forces the field to admit that its foundations are **contingent truths**, not necessary ones.

  ### 3. Provable Security vs. Logistics
  **The Practice:** We reject the One-Time Pad (OTP) despite its unconditional security, and adopt AES or Elliptic Curve Cryptography (ECC) despite their conditional security.

  **The Presupposition:** This presupposes that **key distribution is the primary bottleneck**, not computational power. It is a claim that *computational indistinguishability* is a sufficient substitute for *information-theoretic secrecy* in almost all threat models.

  **Knowledge vs. Cost:**
  *   **Cost:** Strictly speaking, the rejection of OTP is logistical. You cannot securely distribute a 1TB key to stream 1TB of video.
  *   **Knowledge:** However, the *justification* for using AES is epistemological. It claims that "secret enough for the lifetime of the data" is a valid category of knowledge. It redefines "security" from "impossible to break" to "infeasible to break within the relevant timeframe."

  **Underdetermination:**
  The practice is indeed philosophically underdetermined here.
  *   **The Realist:** Believes $P \neq NP$ is a fact about the universe. AES is safe because the universe forbids efficient decryption.
  *   **The Sociologist:** Believes AES is safe because the cryptographic community is a closed shop that hasn't found a break yet, and publication norms suppress vulnerabilities until they are fixed.
  *   **Convergence:** Both parties configure their servers identically (TLS 1.3 with AES-GCM). The practice does not require you to believe hardness is real, only that the *consensus on hardness* is stable. The system runs on **intersubjective agreement** regarding complexity, not necessarily the objective truth of complexity classes.

  ### 4. Internal Consistency of "Proof"
  **The Practice:** We demand "provable security" for schemes (via reductions) while admitting the underlying assumptions (factoring, etc.) are unproven. We also demand formal verification of code.

  **The Resolution:** This is not inconsistent, provided one recognises that "proof" is performing two distinct jobs.
  1.  **Reductionist Proof (Scheme Level):** "If the primitive is hard, this construction is secure." This eliminates *structural* errors. It ensures you haven't built a lock out of glass.
  2.  **Empirical Confidence (Primitive Level):** "This primitive appears hard." This addresses the *material* strength.

  **Strict Presupposition:** The norms presuppose that **modularity of risk** is possible. By separating the construction from the primitive, we contain the damage. If a flaw is found in the construction (e.g., a padding oracle), we fix the code. If a flaw is found in the primitive (e.g., factoring becomes easy), we swap the module (e.g., to lattice-based crypto).

  **Inconsistency?** It only looks inconsistent if you interpret "provable security" as "unconditionally secure." The field knows it does not mean that. It is a shorthand for "reducibly secure." The demand for formal verification of implementations is consistent with this: it ensures the *mapping* from the mathematical ideal to the physical silicon is faithful, minimising the gap where the unproven assumptions could be bypassed via side-channels rather than mathematical breaks.

  ### Counterfactual: A Strict Information-Theoretic Stance
  If the field adopted a stance refusing anything not unconditionally secure (OTP or Quantum Key Distribution [QKD] with trusted nodes), the following would occur:

  **1. Practical Collapse of the Public Internet:**
  Public Key Cryptography (PKI) vanishes. You cannot scale OTP. QKD requires dedicated fibre optics or line-of-sight lasers; it cannot route over the public internet. The result is a return to a **hub-and-spoke model** of communication. Secure communication becomes a physical logistics problem, not a computational one. Banking, e-commerce, and general web browsing as we know them cease to exist.

  **2. Shift in Trust Models:**
  Currently, we trust *mathematics* (and the community that audits it). In an information-theoretic world, we must trust *physics* and *couriers*.
  *   **Trust in Community $\rightarrow$ Trust in Infrastructure:** Security would depend on the physical security of the key distribution centres.
  *   **The Revelation:** We would discover that the "security" we valued was never just about secrecy; it was about **scalable trust**. Computational cryptography allows strangers to establish trust without prior contact. Information-theoretic cryptography requires prior contact (to share keys).

  **3. What We Were Leaning On:**
  If we made this switch, we would realise that modern cryptography was never solely about hardness assumptions. It was about **standardisation and governance**. The "security" of TLS rests as much on the Certificate Authority (CA) ecosystem and the browser vendors' enforcement as it does on the hardness of discrete logs.
  Adopting a strictly information-theoretic stance would reveal that the binding constraint was never mathematical hardness, but the **economics of key management**. We accepted computational risk because the alternative was logistical impossibility.

  ### Summary
  The practice presupposes a **pragmatist epistemology**. It treats mathematical hardness as a natural resource—like uranium or oil—rather than a logical truth. It is assumed to be abundant and stable, based on the best available survey data (cryptanalysis), but acknowledged to be depletable (by quantum computers or algorithmic breakthroughs).

  The norms of "provable security" and "don't roll your own" are not attempts to achieve logical certainty; they are **hygiene factors** designed to ensure that when the underlying resource (hardness) inevitably degrades, the failure is due to the resource running out, not because we built a leaky bucket. The system is internally consistent if viewed as risk engineering, but inconsistent if viewed as a search for absolute truth.
