  Dear Director,

  The transition from quality-adjusted life years to wellbeing-adjusted life years represents a profound shift in the normative architecture of your authority, and your program's mandate to illuminate the conceptual underpinnings rather than construct the metric itself is the correct allocation of resources. You have asked me to rank the conceptual questions you have identified, to add any I believe are missing, and to defend this ordering based on impact, tractability, and logical priority. My view is that you should order your work by the magnitude of the risk each question poses to the validity of the authority's rankings, rather than by abstract philosophical precedence, because your constraint is not truth in the absolute sense but defensibility in the context of public appraisal.

  The question that deserves your primary effort, and which I place at the top of your agenda, is whether the tendency of people with severe disabilities or long-standing deprivation to report near-average satisfaction is evidence of true wellbeing or a distortion in the instrument. This is the adaptation problem, and it outranks the others because it strikes directly at the political and ethical justification for abandoning the old metric. The authority was instructed to switch to wellbeing-adjusted life years largely to avoid the discriminatory implications of preference-based health valuations against the disabled. If the new metric systematically undervalues interventions for the worst off because those individuals have adapted their expectations downward, you will have replicated the very injustice the reform was meant to cure. This question is highly tractable for your team within three years. Your econometricians can analyze panel data to distinguish between true wellbeing stability and response shifts, while your philosophers can clarify whether wellbeing consists in subjective states or objective conditions. The impact on funding decisions is substantial; if adaptation is real and uncorrected, social care programs targeting the severely disabled will appear to yield fewer wellbeing points than infrastructure projects targeting the general population, skewing the portfolio away from equity. This question is upstream of the self-report question because if adaptation is a distortion, switching from self-report to representative imagining may not solve it, as representatives often fail to predict adaptation accurately. Evidence that would move this down the priority list would be robust longitudinal data showing that life satisfaction scores for the disabled do not revert to the mean over time, or that interventions do move the needle despite adaptation. Conversely, evidence of strong hedonic adaptation would cement this as your central focus.

  I place the question of interpersonal cardinal comparability second, though it is logically prior to the adaptation question. You ask whether self-reported satisfaction on a bounded scale is cardinally comparable across persons given differences in scale use and non-linearity. This is the gatekeeper question; if the answer is a definitive no, the metric collapses. However, I rank it second because perfect comparability is a philosophical ideal that is unlikely to be settled definitively in three years, whereas systematic bias is a practical problem you can quantify and correct. Your team should treat this not as a metaphysical inquiry into whether Person A's five equals Person B's five, but as an empirical investigation into whether scale usage varies systematically across demographic groups in ways that bias program ranking. This is well within the skills of your econometricians, who can employ anchoring vignettes to adjust for scale heterogeneity. The impact on funding is high if scale use correlates with the beneficiaries of specific programs; for example, if cultural groups predisposed to use the extremes of the scale are the primary beneficiaries of certain social programs, their gains may be overstated or understated relative to others. This question is upstream of distributional weighting because you cannot weight what you cannot compare. Evidence that would raise this to the top priority would be findings that scale usage differences are so large and systematic that they reverse the ranking of major programs. If scale noise appears random or small relative to the treatment effects, you can deprioritize it in favor of the adaptation question.

  Third in your hierarchy should be the question of whether distributional weighting in favour of the worse off is a claim about wellbeing or a claim about justice. This determines whether a weighted wellbeing-adjusted life year is a coherent unit or a category error. This is the primary lever your authority will pull to adjust outcomes, and thus it demands conceptual clarity. If weighting is a claim about justice, it belongs in the decision rule rather than the metric itself, which affects how you report uncertainty and trade-offs. Your philosophers can resolve the conceptual coherence here, while your econometricians can model the sensitivity of rankings to different weighting schemes. The impact on funding is direct and mechanical; applying a weight of two to the bottom quintile changes the winner in many head-to-head appraisals between infrastructure and social care. This is downstream of comparability and adaptation, as you need valid units before you can weight them. Evidence that would elevate this question would be a legal or ministerial directive explicitly requiring equity weighting, which would force you to settle the coherence question immediately. If the authority retains discretion, you can treat this as a sensitivity analysis rather than a foundational fix.

  I must add a question that you have left out but which I believe outranks the remaining two: whether global life satisfaction is sufficiently sensitive to domain-specific improvements in health or function to register the value of targeted interventions. This is the problem of domain specificity. A health program might restore mobility without moving a person's global life satisfaction score if the individual compartmentalizes health from overall life evaluation. If the metric fails to capture the benefit because the beneficiary does not update their global score, the program will be undervalued. This is distinct from adaptation; it is about the transmission mechanism from health state to reported satisfaction. This deserves a high rank because it threatens the validity of the metric for half your portfolio. It is tractable for your econometricians to test correlations between health shocks and life satisfaction changes, and for your philosophers to analyze the relationship between domain welfare and global evaluation. Evidence showing low elasticity between health improvements and life satisfaction scores would move this up to challenge the adaptation question, as it would suggest the metric is simply blind to certain goods.

  Fourth among your original candidates is whether satisfaction should be reported by the affected person or by a representative sample asked to imagine the state. I rank this lower because it is largely instrumental to the adaptation question. If adaptation is a distortion, self-report is flawed, but representative imagining is often plagued by projection bias, where representatives imagine themselves in the state without adapting, thus overestimating the loss. The literature fights fiercely over this, but for your purposes, it is unlikely to alter funding decisions as much as correcting for adaptation directly. It is tractable, but the return on effort is lower than investigating the adaptation mechanism itself. Evidence that representatives consistently predict wellbeing more accurately than experiencers would raise this priority, but current evidence suggests neither is perfect, making the choice less critical than adjusting for the biases inherent in both.

  Finally, I must identify the questions that are overrated and should consume the least of your limited capital. The question of whether the reasoning that licenses summing wellbeing across persons also licenses summing it across times within a single life, and what to do if one is accepted but not the other, is philosophically rich but practically inert for your authority. You are ranking programs over a fixed appraisal horizon with standard discounting; the structural distinction between intra-personal and inter-personal summation rarely changes the aggregate sum unless you are imposing specific constraints on intra-personal redistribution, which is not standard practice. This is a classic philosophical puzzle that will not settle in three years and is unlikely to flip a funding decision. Similarly, while the self-report versus representative question is much discussed, it is overrated in terms of its capacity to be settled by argument. It is an empirical question about bias sources, and unless you find a decisive accuracy gap, the authority will likely stick with the instructed self-report method for scalability. I recommend you treat these two questions as background noise unless specific evidence emerges that makes them decision-critical.

  In summary, I urge you to focus your philosophers and econometricians on the adaptation problem as the central threat to the metric's equity claims, supported by work on systematic comparability bias and the coherence of weighting. Add the domain sensitivity question to ensure the metric actually sees the benefits you are paying for. Leave the deep puzzles of temporal summation and the source of report to the literature, as they are less likely to change who gets funded than the empirical realities of how people report their lives under deprivation. This approach ensures that your three years yield actionable guidance rather than abstract commentary.

  Yours sincerely,

  An Advisor
