prompt: |-
  I'm the volunteer coordinator for a small river town's emergency management committee, and every February through May we have the same argument. Someone has to decide whether to spend about forty grand pre-positioning sandbags and closing the low road, and later whether to recommend an evacuation for the bottomlands, and the whole thing hangs on how likely the levee is to overtop in a given storm. Trouble is our people won't hand over one number, and honestly I've stopped wanting them to. The county hydrologist says she's somewhere between 10 and 30 percent for the scenario in front of us, a retired guy who's read this river for forty years says more like 40 to 60, and the actuary on our committee says averaging those two is a sin and gets red in the face about it. I've been reading on my own in the evenings about the idea that a belief can be a whole set of probability functions instead of a single number — ranges, credal sets, that sort of thing — and it feels like it's describing our situation exactly, but everything I find is written for people who already have the math, and none of it says what to do at seven o'clock on a Tuesday.

  So could you write me a procedure my committee can actually run? Constraints: it's a two hour meeting once a month during the season, nobody in the room can do math past an average, we have no software budget, the county manager signs off on the recommendation and has to be able to defend it in the paper afterwards, and we cannot ask these experts to sit through a statistics course first. I want plain steps in order, what we write down at the end of each one, what counts as a good enough answer to move on to the next, and which steps hand the thing over to the county manager because it's a values question and not a fact question. Specifically it has to tell me: how to ask each person for a range so that all the ranges mean the same thing (is there some betting-flavored question that gets an honest low and high out of someone?); whether we should combine them into one group range at all or carry the separate ranges forward, and what combining throws away; what to do when two experts' ranges don't touch; what to do when someone's range is effectively 0 to 100, meaning they told us nothing; how to pick between planning around the worst number in the range and planning around the most likely one — I gather there are a few named rules for this and I want to know which suits a body like ours, what it forces us to do that we'll resent, and why the others are wrong for us; and what to put in the single box on the state reporting form that asks for the probability of overtopping, because I suspect putting the midpoint in there is a lie but I can't say why.

  Then run it on cases, with numbers, and don't go easy. First, our real March meeting: hydrologist 10–30, river guy 40–60, and a weather service forecaster on speakerphone who says 20–25 but keeps hedging — take it all the way through to what we write down and what we tell the county manager. Second, a case where we paid for a sonar survey of a scour hole under the levee and the results come back, and afterwards the committee's range is *wider* than it was before, not narrower — someone told me that's supposed to be possible with ranges and isn't a screw-up, and I need to know whether to trust the wider range and how to say so publicly without looking incompetent. Third, a case where the procedure gives an answer I personally won't like — your pick, whether that's it ordering an evacuation we've already told people won't happen, or it counting our forty-years-on-the-river guy for much less than I think he's worth, or it saying the call isn't ours to make at all. Finally, be honest about the seams: flag which steps are judgment calls dressed up as procedure, where this thing will misfire in practice, what it flat out cannot do, and what a version with real expertise and a real budget would add that ours is missing.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **User:** Volunteer coordinator for a small river town's emergency management committee.
      *   **Problem:** Recurring conflict (Feb-May) about flood risk (levee overtopping). Experts give conflicting probability estimates (ranges vs. points). Committee lacks math skills/budget/time. Need a decision procedure that handles *imprecise probabilities* (credal sets) without requiring advanced math.
      *   **Constraints:** 2-hour monthly meeting, no math beyond averages, no software budget, county manager needs defensible output, experts won't learn stats.
      *   **Specific Questions to Answer:**
          *   How to elicit ranges (betting flavor)?
          *   Combine ranges or keep separate? What's lost?
          *   Handle non-overlapping ranges?
          *   Handle uninformative ranges (0-100)?
          *   Decision rules (worst-case vs. most likely)? Which suits them?
          *   What to put on the state form (single number)?
      *   **Deliverables:**
          *   A step-by-step procedure (plain language).
          *   Three specific case studies (March meeting, Sonar survey/wider range, Unpleasant outcome).
          *   Honest critique ("the seams"): limitations, judgment calls, what's missing.

  2.  **Deconstruct the Core Concept:**

      *   The user is describing *Imprecise Probability* or *Credal Sets*. Instead of $P(E) = 0.3$, it's $P(E) \in [0.1, 0.3]$.
      *   The challenge is operationalizing this for laypeople in a high-stakes, low-resource environment.
      *   Key philosophical tension: Epistemic uncertainty (we don't know the true probability) vs. Aleatory uncertainty (the randomness of the river). The experts are disagreeing on the *model*, not just the roll of the dice.

  3.  **Drafting the Procedure (The "River Town Protocol"):**

      *   *Step 1: Elicitation.* Need a way to make ranges comparable. The "Betting Question" is standard in decision analysis. "At what odds would you take this bet?"
      *   *Step 2: Aggregation.* Should we average? The actuary says no. Averaging hides disagreement. Better to keep the *Union of Ranges* (the envelope) to show total uncertainty, but maybe track the *Intersection* (consensus) if it exists.
      *   *Step 3: Conflict Resolution.* Non-overlapping ranges mean model disagreement, not just noise. Need a "Red Flag" step.
      *   *Step 4: Decision Rule.* Maximize Expected Utility is hard without utilities. *Maximin* (worst-case) is safe but expensive. *Minimax Regret* is complex. For a public safety body, *Precautionary Principle* weighted by cost is best. Let's call it the "Cost-Weighted Upper Bound."
      *   *Step 5: Reporting.* The state form wants one number. Putting the midpoint is misleading. Putting the upper bound is alarmist. The "Defensible Midpoint of the Upper Bounds" might work, or explicitly stating the range in the attachment. Let's suggest the *Upper Bound of the Consensus* or a specific notation.
      *   *Step 6: Handoff.* Distinguish Fact (probability) from Value (cost of evacuation vs. flood). The committee provides the risk profile; the Manager makes the value call.

  4.  **Developing the Case Studies:**

      *   *Case 1 (March Meeting):* Hydro (10-30), River Guy (40-60), Weather (20-25 hedging).
          *   *Action:* Union is 10-60. Intersection is empty. Weather guy is narrow but hedging.
          *   *Decision:* Since ranges don't overlap, we can't average. We must plan for the "Plausible Worst Case" (60%) because the cost of failure is high.
          *   *Output:* Tell Manager: "Risk is between 10% and 60%. We cannot rule out 60%."
      *   *Case 2 (Sonar/Wider Range):* Pre-survey 20-40. Post-survey 10-60.
          *   *Concept:* *Dilation*. New info revealed we understood the system *less* than we thought (e.g., the scour hole makes the levee behavior unpredictable).
          *   *Explanation:* "We know more about what we don't know." It's not incompetence; it's reduced *false confidence*.
      *   *Case 3 (Unpleasant Outcome):* Let's make it about the *Weighting* of experts. The procedure might dictate ignoring the River Guy because his range is uncalibrated or too wide, or it might force an evacuation based on the 60% upper bound despite public fatigue. Let's go with the *Evacuation Recommendation* based on the Upper Bound, which contradicts previous "no evacuation" promises. This highlights the tension between safety and credibility.

  5.  **Refining the "Seams" (Critique):**

      *   Where does this fail? Groupthink. Dominant personalities. The "Betting" question might still be gamed.
      *   What's missing? Real Bayesian updating, cost-benefit analysis of the evacuation itself, dynamic modeling.
      *   The "One Number" problem: It *is* a lie, but a necessary administrative one. Need to frame it carefully.

  6.  **Writing - Tone and Style:**

      *   Tone: Respectful, practical, authoritative but not academic. Acknowledge the stress of the role.
      *   Formatting: Clear headings, bullet points for steps, bold text for actions.
      *   Math Check: Ensure no complex formulas are required. Use "High/Low" language.

  7.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is the betting question too abstract?
      *   *Fix:* Make it concrete. "If you bet $100, what's the payout?" No, simpler: "If this happened 100 times, how many floods?" That's frequency, not belief. Let's stick to the "Confidence Interval" framing but anchored by a penalty for being wrong. Actually, the prompt asks for a "betting-flavored question." Let's use the "Ticket Price" method. "How much would you pay for a ticket that pays $100 if it floods?"
      *   *Critique:* The state form requirement.
      *   *Fix:* Be honest. Put the number required, but attach the memo. The procedure must specify *which* number (e.g., the 90th percentile of the expert union).
      *   *Critique:* Case 3 needs to be painful.
      *   *Fix:* Let's make it about the River Guy. The procedure says his range is too wide to count, or conversely, his high estimate forces an evacuation that ruins the town's economy. Let's go with the *Evacuation* trigger. The procedure says "If Upper Bound > Threshold, Recommend Evacuation." The Upper Bound is 60%. Threshold is 50%. Result: Evacuate. But the town is tired of false alarms. This forces the Coordinator to deliver bad news.

  8.  **Final Polish:** Check against all constraints.
      *   2-hour meeting? Yes, steps are timed.
      *   No math past average? Yes.
      *   County Manager defense? Yes, the memo trail supports it.
      *   Experts no stats course? Yes, questions are plain English.

  9.  (Self-Correction on Case 2): Make sure to explain *Dilation* clearly. It's counter-intuitive. New data -> More uncertainty. Why? Because the data ruled out the "middle" easy answers and left only extreme possibilities. Or simply revealed structural instability.

  10. (Self-Correction on Case 3): Let's make it about the *weighting*. The procedure treats all experts equally. The Coordinator knows the River Guy is wise but maybe senile. The procedure forces equal weight. This creates friction. Or, the procedure forces a "Maximin" decision which triggers an evacuation that the Manager overrides. Let's go with the *Manager Override* scenario. The procedure says "Evacuate," Manager says "No." This highlights the Fact/Value split.

      *Wait, re-reading prompt:* "a case where the procedure gives an answer I personally won't like... whether that's it ordering an evacuation... or counting our forty-years-on-the-river guy for much less... or saying the call isn't ours to make."
      *Decision:* I will choose the "Call isn't ours to make" angle. The procedure reveals the uncertainty is too high to recommend *either* action definitively, kicking it entirely to the Manager's values, which frustrates the committee who want a clear "science" answer. This highlights the limit of technical advice.

      *Actually, let's look closer:* "counting our forty-years-on-the-river guy for much less than I think he's worth." This is a good one about *expert weighting*. If the procedure treats ranges as equal weight, but the River Guy's range is 0-100 (useless), he gets ignored. That hurts. Let's use that.

      *Wait, better:* The procedure forces a specific decision rule (Maximin). It orders an evacuation based on the 60% risk. The Coordinator knows the town won't evacuate. It creates a "Cry Wolf" scenario.
      *Let's go with the "Fact vs Value" handoff.* The procedure concludes the *risk* is too ambiguous to recommend action based on facts alone, forcing the Manager to make a pure value judgment. The Coordinator hates this because it exposes the committee as "inconclusive."

      *Okay, final decision for Case 3:* The procedure dictates that because the ranges don't overlap (10-30 vs 40-60), the "Fact" is undefined. It forces the recommendation to be "Insufficient Data for Scientific Recommendation." This kicks the can to the Manager entirely. The Coordinator hates this because it looks like weakness.

      *Wait, one more check:* "what counts as a good enough answer to move on." I need to include "Stop Rules" in the procedure.

      *Okay, let's write.*

      *(Self-Correction during drafting the response)*: I need to make sure I explicitly answer the "betting-flavored question" part.
      *Question:* "Imagine a ticket that pays you $1,000 if the levee overtops. What is the most you would pay to buy it? And what is the least you would sell it for if you owned it?"
      *Simpler for laypeople:* "If we played this storm out 100 times, what's the lowest number of floods you'd bet on, and what's the highest?" (Frequency framing is usually easier for laypeople than subjective probability). Let's use the "100 Storms" framing. It's intuitive.

      *Wait, the prompt asks for "betting-flavored".* I will use the "Buy/Sell" price but explained simply.
      *Buy Price:* "What's the most you'd pay for a $100 payout?" (Implies lower bound).
      *Sell Price:* "What's the least you'd accept to sell a $100 payout?" (Implies upper bound).
      *Actually, for ranges:* "What is the lowest probability where you'd still bet it *will* happen? What is the highest probability where you'd still bet it *won't* happen?"
      *Let's stick to the "100 Times" frequency framing but call it a "Bet".* "Would you take a bet that pays $100 if it floods, costing $X to play?"
      *Okay, I'll refine this in the text to be the "Ticket Test".*

      *Let's finalize the "One Number" on the form.* The prompt suspects the midpoint is a lie. It is. It hides the variance. The procedure should recommend putting the *Upper Bound of the Consensus* or the *Upper Bound of the Union* with a footnote. But if the form *only* accepts a number... I'll advise putting the "Prudent Upper Bound" (e.g., the 90th percentile of the combined ranges).

      *Okay, ready to generate.*
answer: |-
  Here is a procedure designed for your constraints. It is based on the theory of **Imprecise Probabilities** (specifically *Credal Sets*), but stripped of the math and translated into committee workflow.

  It treats probability not as a hidden truth you are trying to find, but as a measure of your committee's *commitment* to a course of action.

  ### The "River Town Protocol" for Ambiguous Risk

  **Time:** 120 Minutes
  **Materials:** Whiteboard, sticky notes (two colors), printed "Decision Matrix" (see Step 4).
  **Participants:** Coordinator (you), Experts, Committee Members. County Manager joins for Step 5.

  #### Step 1: The "Ticket Test" Elicitation (30 Minutes)
  **Goal:** Get comparable ranges from everyone without using percentages initially.
  **The Problem:** "10 percent" means different things to different people. To a hydrologist, it's a model output. To the river guy, it's a gut feeling.
  **The Fix:** Anchor the number to a financial consequence. This forces them to internalize the risk.

  **The Script:**
  > "We are not asking for a guess. We are asking for a price. Imagine a ticket that pays the town **$10,000** if the levee overtops in this storm. It costs **$100** to buy.
  >
  > 1.  **Lower Bound:** At what *lowest* chance of flooding would you still say 'Yes, buy that ticket'? (If you say 10%, you believe the risk is at least 1 in 10).
  > 2.  **Upper Bound:** At what *highest* chance of flooding would you still say 'No, don't buy that ticket'? (If you say 30%, you believe the risk is no more than 3 in 10).
  >
  > Your range is the gap between those two answers."

  **Action:** Write each expert's name and their Range (Low–High) on the board.
  **Pass Condition:** Every expert has a range. If someone says "I don't know," their range is **0–100**. If someone gives a single number (e.g., "40%"), force them to give a margin of error ("Could it be 38? Could it be 42?").
  **Output:** A list of Ranges on the whiteboard.

  #### Step 2: The Overlap Check (20 Minutes)
  **Goal:** Determine if you have consensus or conflict.
  **The Problem:** Averaging ranges hides disagreement. If Expert A says 0–10 and Expert B says 90–100, the average is 50, which is a lie. Neither expert believes it's 50.
  **The Fix:** Map the **Union** (everything covered) and the **Intersection** (where everyone agrees).

  **Action:** Draw a number line 0 to 100 on the board. Draw each expert's range as a bar.
  1.  **Mark the Union:** The span from the absolute lowest low to the absolute highest high.
  2.  **Mark the Intersection:** The span where *all* bars overlap.

  **Pass Condition:**
  *   **If there is an Intersection:** You have consensus on a minimum risk.
  *   **If there is NO Intersection (Gaps):** You have fundamental model disagreement.
  *   **If the Union is 0–100:** You have total ignorance.

  **Output:** A visual map of Agreement vs. Disagreement.

  #### Step 3: The "Dilation" Check (15 Minutes)
  **Goal:** Handle new data that makes things *less* clear.
  **The Problem:** Sometimes new info (like the sonar survey) breaks your old assumptions, making the range wider. This looks like incompetence but is actually intellectual honesty.
  **The Fix:** Label it explicitly.

  **Action:** Compare the new Union to the old Union from last month.
  *   If the new range is *wider*, ask the experts: "Did this data rule out the 'middle' answers?"
  *   If yes, record the reason: *"New data eliminated moderate scenarios, leaving only low-probability and high-probability outcomes."*

  **Output:** A written justification for why uncertainty increased.

  #### Step 4: The Decision Rule Selection (25 Minutes)
  **Goal:** Pick how to act on the ranges.
  **The Problem:** Do you plan for the average (likely to under-prepare) or the worst case (likely to waste money)?
  **The Fix:** Use the **Precautionary Upper Bound**.

  **The Rule:**
  > "For public safety decisions where the cost of failure (death/property loss) vastly exceeds the cost of preparation (sandbags/road closure), we plan using the **Upper Bound of the Union**."

  **Why this rule?**
  *   **Expected Value (Average):** Wrong for you. It assumes you can be wrong half the time. You can't be wrong about a levee breach.
  *   **Maximin (Worst Possible):** Too extreme if the range is 0–100.
  *   **Precautionary Upper Bound:** You take the highest plausible number given by a credible expert. It forces you to spend the $40k, but it prevents the disaster.

  **The Resentment:** You will spend money on "false alarms." You must accept this as the insurance premium for living on a river.
  **Output:** A single "Planning Probability" selected from the board (usually the highest Upper Bound among credible experts).

  #### Step 5: The Fact/Value Handoff (30 Minutes)
  **Goal:** Distinguish what the science says from what the town can afford.
  **The Problem:** The committee wants to decide "Evacuate or Not." That is not a science question. It is a values question.
  **The Fix:** The Committee recommends a *Risk Level*; the Manager decides the *Action*.

  **Action:**
  1.  Committee fills out the "Risk Profile Memo" (see below).
  2.  County Manager enters the room.
  3.  Committee reads the Memo.
  4.  Manager signs the Decision.

  **Output:** Signed Decision Log.

  #### Step 6: The State Form (Final 5 Minutes)
  **Goal:** Comply with bureaucracy without lying.
  **The Problem:** The form asks for "Probability of Overtopping."
  **The Fix:** The **90th Percentile of the Union**.

  **Why:** Putting the midpoint hides the risk. Putting the maximum (100%) triggers panic. Putting the 90th percentile of the combined expert ranges says: "We are 90% sure the risk is no higher than this number."
  **Action:** Calculate the number. Attach the Risk Profile Memo as "Appendix A."
  **Output:** Submitted Form.

  ***

  ### The Risk Profile Memo (Template)
  *To be handed to the County Manager.*

  1.  **Expert Consensus:** [Yes/No] (Based on Step 2 Intersection)
  2.  **Plausible Risk Range:** [Lowest Low] to [Highest High] %
  3.  **Planning Probability:** [Selected Upper Bound] %
  4.  **Key Uncertainty:** [e.g., "Experts disagree on soil saturation"]
  5.  **Recommendation:** [e.g., "Pre-position sandbags. Evacuation decision rests on cost/benefit."]
  6.  **Committee Confidence:** [High/Medium/Low]

  ***

  ### Case Study 1: The Real March Meeting
  **Inputs:**
  *   Hydrologist: 10–30%
  *   River Guy: 40–60%
  *   Weather Forecaster: 20–25% (Hedging)

  **Running the Protocol:**
  1.  **Elicitation:** Ranges are recorded.
  2.  **Overlap Check:**
      *   Union: 10% to 60%.
      *   Intersection: **None.** (Hydro tops at 30, River Guy bottoms at 40).
      *   *Observation:* The Weather Forecaster (20–25) overlaps with Hydro but not River Guy.
  3.  **Conflict:** There is a "Gap of Ignorance" between 30% and 40%. No expert believes the risk is in the 30s. This suggests two different models of reality (e.g., Hydro is modeling rain volume; River Guy is modeling levee structural integrity).
  4.  **Decision Rule:** Apply **Precautionary Upper Bound**.
      *   Highest credible upper bound is 60% (River Guy).
      *   Planning Probability = 60%.
  5.  **Handoff:**
      *   Memo to Manager: "Scientific consensus is impossible. Risk is either moderate (30%) or high (60%). We cannot rule out 60%."
      *   Recommendation: "Spend the $40k on sandbags. Evacuation recommendation is withheld due to lack of consensus, but Manager should know a 60% risk exists."
  6.  **State Form:**
      *   Union is 10–60.
      *   90th Percentile of Union: Roughly **55%**.
      *   *Note:* You do not put 35% (the midpoint). That implies certainty you don't have.

  **Result:** You spend the money. You do not order evacuation yet. The Manager goes on record knowing the River Guy thinks it's a coin toss.

  ***

  ### Case Study 2: The Sonar Survey (Dilation)
  **Scenario:** Last month, the range was 20–40%. You paid for a sonar survey of the scour hole. Now, the Hydrologist says the scour makes the failure mode "brittle." The new committee range is **10–70%**.

  **The Panic:** The press asks, "Why did you spend money to become *less* sure?"

  **Running the Protocol:**
  1.  **Dilation Check (Step 3):** The procedure explicitly anticipates this.
  2.  **Explanation:** The old range (20–40%) assumed the levee behaved "normally." The sonar proved the levee does *not* behave normally. The old "middle" answers are now impossible.
  3.  **Public Statement:** "Previously, we assumed standard soil conditions. The survey revealed complex structural weaknesses. We now know the risk is less predictable than we thought. We are replacing *false confidence* with *accurate uncertainty*."
  4.  **Decision Impact:**
      *   Old Planning Probability: 40%.
      *   New Planning Probability: 70%.
      *   Action: Upgrade from "Sandbags" to "Recommend Evacuation."

  **Result:** You look competent because you predicted that better data might widen the range. You avoid the disaster by reacting to the *increase* in uncertainty, not just the increase in risk.

  ***

  ### Case Study 3: The Unpleasant Outcome (The "Fact/Value" Wall)
  **Scenario:** The Committee runs the protocol.
  *   Hydrologist: 5–15%
  *   River Guy: 50–80%
  *   Actuary: Refuses to give a number, gives 0–100.

  **The Procedure's Verdict:**
  *   Intersection: None.
  *   Union: 0–100% (due to Actuary).
  *   Planning Probability: 100% (if you include Actuary) or 80% (if you exclude Actuary as uninformative).
  *   **Crucial Step:** The Protocol says if the Union is effectively 0–100, the **Fact** is undefined.

  **The Unpleasant Outcome:**
  The Memo to the County Manager reads: *"The Committee cannot establish a factual baseline for risk. The uncertainty is too high to recommend specific mitigation based on probability alone."*

  **Why you won't like it:**
  1.  **It sidelines the River Guy:** To make the range usable, you might have to vote to exclude the Actuary's 0–100 as "non-credible." This feels political.
  2.  **It kicks the can:** You wanted science to tell you what to do. The procedure tells you science *can't* tell you what to do. It forces the County Manager to make a pure value judgment ("I value the tax revenue more than the flood risk" or vice versa) without the shield of "The experts said so."
  3.  **The Evacuation Order:** If you follow the Precautionary Upper Bound (80%), the protocol demands an evacuation recommendation. You have told the town for three years, "We won't cry wolf." Now the math forces you to cry wolf. If you don't, you are violating your own safety protocol.

  **Result:** You have to tell the Manager, "The science is broken. You have to decide based on how much risk you're willing to tolerate, not on what the data says." This exposes the Committee's limitation.

  ***

  ### The Seams: Where This Will Misfire

  You asked for honesty about the limitations. Here is where the protocol leaks.

  **1. The "Betting" Question is still a game.**
  *   **The Flaw:** Experts know this is for the public record. The Hydrologist might narrow her range to look precise. The River Guy might widen his to look cautious.
  *   **The Fix:** You (the Coordinator) must enforce Step 1 ruthlessly. If an expert changes their range during the meeting, ask: "Did new data arrive, or did you see how others voted?" If it's the latter, lock the number.

  **2. Equal Weighting is a Lie.**
  *   **The Flaw:** The protocol treats the Hydrologist (PhD, models) the same as the River Guy (experience, intuition). In Case 3, this causes the conflict.
  *   **The Fix:** The protocol lacks a "Credibility Weighting" step because that requires math/stats you don't have. In practice, this means the Committee must vote on *who to listen to* before Step 4. This is political. You will have to manage the River Guy's ego if the Committee votes to trust the Hydrologist's narrower range.

  **3. The State Form is still a lie.**
  *   **The Flaw:** Putting "55%" on the form is still a single number. It *will* be treated as a fact by the state, not a planning bound.
  *   **The Fix:** The "Appendix A" memo is your only shield. If the flood doesn't happen, and the state asks why you reported 55%, you show the memo: "We reported the 90th percentile of a 10–60% range. We communicated the uncertainty."

  **4. It cannot handle "Black Swans."**
  *   **The Flaw:** This handles known uncertainty (ranges). It does not handle unknown unknowns (e.g., a dam fails upstream).
  *   **The Fix:** Add a standing agenda item: "What breaks this model?" If the River Guy says, "If the upstream dam opens, my numbers are void," that goes in the Memo as a **Conditional Clause**.

  **5. What a Real Budget Would Buy.**
  *   **Bayesian Model Averaging:** Instead of taking the Union (which assumes the worst expert might be right), a real statistician would weigh the experts based on past performance.
  *   **Value of Information Analysis:** They could calculate exactly how much the sonar survey *should* cost before you buy it.
  *   **Dynamic Updating:** This protocol is static (once a month). Real risk changes hourly with rain gauges.

  ### Final Word to the Coordinator
  You are looking for a procedure that removes the burden of choice. This procedure will not do that. It will not give you a single "True Number."

  What it *will* do is give you a **Paper Trail of Honesty**.
  When the levee holds, and the Mayor asks why you spent $40k on a 10% risk, you show the minutes. You show the River Guy's 60%. You show the Rule that says "We plan for the Upper Bound."
  When the levee breaks, and the families ask why you didn't evacuate, you show the Minutes. You show the Gap in Consensus. You show the Memo that handed the Value Decision to the Manager.

  It protects you from the accusation of negligence. It does not protect you from the grief of the outcome. That is the job.
