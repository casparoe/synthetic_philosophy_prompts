          *   *Supervisor:* You chose the set badly.
          *   *User:* Structural issue. Any wide enough set will do this.
          *   *Statistical Theory:* This is a known phenomenon in Imprecise Probability theory called **Dilation**. It happens when the prior set of probabilities is sufficiently broad relative to the likelihood's informativeness regarding the parameter of interest.
          *   *Consensus:* This is *not* settled. It is a major point of contention between proponents of Imprecise Probability (Walley, etc.) and standard Bayesians/Frequentists. Some view dilation as a fatal flaw; others view it as an honest reflection of dependence/ignorance structure.
