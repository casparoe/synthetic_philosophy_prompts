          3.  Reconstruct the anti-Cartesian chain: How does denying unconscious perception lead to the belief that souls are mortal? Does the inference hold?
          4.  Advise on the is-to-ought problem: Can obligation/justice exist for windowless substances, or is ethics just internal unfolding? Is this a weakness or a feature?
