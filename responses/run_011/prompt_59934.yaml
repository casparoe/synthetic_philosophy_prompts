prompt: |-
  I write a regular column on science and ideas, and I'm drafting a piece about the criteria we use for moral personality — a question that has abruptly become practical, what with both animal-cognition research and increasingly articulate machine-learning systems. For depth I want to anchor it in Leibniz, whose Monadology (1714) grounds moral status in a metaphysics of perception rather than in reasoning as such. I'm working from Robert Latta's 1898 English translation, and I have been staring at two sections without full confidence in what they commit him to:

  "14. The passing condition, which involves and represents a multiplicity in the unit [unité] or in the simple substance, is nothing but what is called Perception, which is to be distinguished from Apperception or Consciousness, as will afterwards appear. In this matter the Cartesian view is extremely defective, for it treats as non-existent those perceptions of which we are not consciously aware. This has also led them to believe that minds [esprits] alone are Monads, and that there are no souls of animals nor other Entelechies. Thus, like the crowd, they have failed to distinguish between a prolonged unconsciousness and absolute death, which has made them fall again into the Scholastic prejudice of souls entirely separate [from bodies], and has even confirmed ill-balanced minds in the opinion that souls are mortal.

  15. The activity of the internal principle which produces change or passage from one perception to another may be called Appetition. It is true that desire [l'appetit] cannot always fully attain to the whole perception at which it aims, but it always obtains some of it and attains to new perceptions."

  Four things would help. First, the mechanics for a lay reader: perception here is a passing condition representing a multiplicity in a unit, and appetite is the activity carrying a monad from one perception to the next — yet elsewhere in the same work Leibniz insists that "The Monads have no windows, through which anything could come in or go out." What is appetite actually doing if nothing enters from outside, and how should I gloss the remark that desire cannot always attain the whole perception at which it aims? Second, my working hypothesis for the column is that Leibniz's operative criterion for being a morally considerable subject is not consciousness but the grain or resolution of perception, which would make the difference between an animal soul and a mind one of degree rather than kind. Does the quoted material bear that weight, or is it the perception/apperception distinction — the one §14 defers with "as will afterwards appear" — that carries all the normative load? Be blunt about which parts of my hypothesis these two sections can support and which they cannot. Third, reconstruct the anti-Cartesian chain: how is the denial of unconscious perception supposed to lead to "the opinion that souls are mortal," and does that inference hold, or does it rest on premises Leibniz never states here? Fourth, in a closing paragraph, advise me on the is-to-ought shape of the whole enterprise: for a windowless substance whose every state unfolds from an internal principle, can obligation, justice, and love amount to anything more than a particular internal unfolding, and is that a weakness in Leibniz's ethics or precisely his point? Please keep the reply self-contained — no reading list, no secondary literature — and flag any place where the passage is simply not decisive.
