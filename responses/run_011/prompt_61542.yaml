answer: |-
  There is no single canonical label in the normative ethics literature that captures this specific conjunction of features (terminability + social script) as the primary driver of the demandingness objection. The standard literature focuses on the *quantum* of sacrifice (the "Overdemandingness Objection") or the *content* of the sacrifice (integrity, projects, relationships). Your observation isolates a *structural* feature of the demand itself.

  However, your diagnosis maps precisely onto the intersection of three existing concepts: **Saturability**, **Telicity**, and **Special vs. General Obligations**.

  Here is the carving you requested.

  ### 1. The Name and Definition

  Since no established proper noun exists, the most precise label for this thesis is **The Structural Saturation Objection**.

  **Definition:** A moral demand triggers the Structural Saturation Objection if and only if it is perceived as (a) **Non-Saturable** (there is no state of affairs in which the duty is fully discharged and the agent is morally "clear"), and (b) **Unscripted** (the demand lacks recognition within a socially institutionalized role or practice that provides internal standards of sufficiency).

  **Diagnostic Test:** To determine if a new case falls under this objection, ask:
  1.  *Can I finish this?* (If I do X, is the debt paid?)
  2.  *Do I know what "enough" looks like without calculating consequences?* (Is there a social script or role definition that defines sufficiency?)

  If the answer to both is "No," the objection arises regardless of the cost. If the answer to either is "Yes," the demand is typically accepted even at high cost.

  ### 2. Neighboring Concepts and Distinctions

  You must distinguish this from three neighbors to keep the carving clean:

  *   **The Standard Overdemandingness Objection:**
      *   *Focus:* Magnitude of cost (e.g., "I will be poor").
      *   *Distinction:* Your colleague admits the cost is lower than the mortgage but still objects. The Standard Objection is quantitative; Structural Saturation is qualitative/structural.
  *   **Williams's Integrity Objection:**
      *   *Focus:* Identity and ground projects (e.g., "I cannot betray my own commitments").
      *   *Distinction:* Williams argues morality asks you to be someone else. Structural Saturation argues morality asks you to *never stop working*. One is about *who* you are; the other is about the *shape* of your time.
  *   **The "No-Rest" Objection:**
      *   *Focus:* Perpetual obligation (e.g., "Utilitarianism allows no holidays").
      *   *Distinction:* This is the closest neighbor. However, the "No-Rest" objection is usually treated as a subset of overdemandingness (too much work). Your hypothesis elevates it: the *open-endedness* itself is the dealbreaker, independent of the workload. Structural Saturation explains *why* "No-Rest" is intolerable even when "Rest" is merely theoretical.

  ### 3. The Normative Cut: Debunking or Interpretive?

  This diagnosis cuts in a specific direction: it is a **Condition of Rational Planability**.

  It is not merely a psychological debunking (i.e., "people are too weak to handle open-endedness"). Nor is it a full moral refutation (i.e., "open-ended duties are false"). Instead, it appeals to the **architecture of agency**.

  *   **The Argument:** Finite agents plan lives by organizing time into projects with termini. A moral theory that imposes non-saturable, unscripted demands renders life-planning impossible, not because the sacrifice is too high, but because the *horizon* is removed.
  *   **Does it beg the question?** It risks begging the question against a utilitarian who claims that *maximizing good* is the only rational plan. To avoid this, you must ground the objection in **practical rationality** rather than moral intuition. You argue that a demand that cannot be met cannot function as a practical imperative. If a duty cannot be discharged, it ceases to guide action and becomes a state of permanent guilt.
  *   **The Verdict:** It explains the objection as a reaction to a **category error**. The objectors are treating a *maximizing principle* (which is inherently open-ended) as if it were a *deontic rule* (which implies compliance is possible). The friction comes from trying to live a maximization principle as a compliance rule.

  ### 4. The Parenting Exception (and the Edges)

  You noted parenting is open-ended and unscripted (in terms of sufficiency) yet accepted. Structural Saturation explains this via the **Special/General Distinction**.

  *   **Parenting is a Special Obligation:** It arises from a specific relationship, not general agency. It is **Constitutive**, not **Instrumental**. You are not "producing" a child; you are "being a parent." The "script" exists in the social role of *parent*, which has internal goods (love, relationship) that define "enough" qualitatively, even if the task never ends.
  *   **Effective Altruism is a General Obligation:** It applies to you qua agent. It is instrumental (money $\to$ good). There are no internal goods, only output.

  **The Edges:**

  *   **Unscripted but Bounded (e.g., "Save 5 lives then stop"):**
      *   *Verdict:* Likely accepted. The terminus satisfies the Structural Saturation condition, even if the script is weak. The arbitrariness of "5" might bother a utilitarian, but not the agent.
  *   **Scripted but Open-Ended (e.g., "Be a good Kantian" or "Practice Virtue"):**
      *   *Verdict:* Accepted. Why? Because these are **Imperfect Duties** (Kant) or **Virtues** (Aristotle). They come with **Latitude**. You must pursue them, but you are not required to maximize them at every moment. The "script" here is the *latitude* itself. The objection arises when an open-ended demand is presented as a **Perfect Duty** (strict, maximized, no latitude).
  *   **Kantian Self-Improvement:**
      *   *Verdict:* Accepted. It is open-ended, but it is autonomous (self-legislated) and imperfect (you choose when/how). The EA demand feels heteronomous (imposed by the world's needs) and perfect (every dollar counts).
  *   **Tax Compliance:**
      *   *Verdict:* Accepted. It is Scripted (law), Bounded (April 15th), and Saturable (paid in full). It fits the template perfectly.

  ### Summary for Your List

  The entry you are looking for is **Structural Saturation**.

  *   **Thesis:** Resistance tracks the absence of a terminus and the absence of a role-based script, not the magnitude of cost.
  *   **Mechanism:** Violation of the conditions for rational life-planning (agency requires completable projects).
  *   **Exception:** Role-based obligations (parenting) are exempt because they are constitutive relationships with internal goods, not instrumental maximization tasks.
  *   **Normative Status:** Not a debunking, but a claim that non-saturable demands fail as practical imperatives for finite agents.

  This allows you to categorize future exchanges: if the objector says "I can't afford it," that is Standard Overdemandingness. If they say "When does it stop?" or "Who says that's enough?", that is Structural Saturation.
