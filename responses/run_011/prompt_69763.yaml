  ### Final Diagnosis of Your List

  You asked me to be plain if some cases are bad. Here is the plain truth:

  **Case 7 is the weak link.** Your intuition that "I could not have been a student" carries *haecceitistic* weight ("my own me-ness") is incompatible with your Anti-Haecceitism in Case 6. If you are a Lewisian, **Case 7 is a confused intuition.** It feels true because of the grammar of "I," but metaphysically, under PQR, it reduces to qualitative dissimilarity.

  **Case 8 is a category error.** You are treating modal knowledge as empirical knowledge. Under Lewis, it is philosophical knowledge. You didn't "acquire information about a chunk of concrete reality" in the same way you acquired information about the donkeys in your garden. You acquired information about the *logical space* which is populated by concrete reality.

  **The Principle to use:**
  > **The Principle of Qualitative Recombination:** *A world exists if and only if it is a maximal sum of spatiotemporally related particulars instantiating a consistent arrangement of fundamental properties and relations found in the actual world.*

  Hand this to your students. Tell them that if their essay relies on "primitive thisness" (Case 7) or "causal access to other worlds" (Case 8), they are not doing Lewisian Modal Realism, they are doing folk metaphysics. Mark accordingly.
