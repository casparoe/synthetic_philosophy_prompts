          *   *The "Pre-Shaped" Argument:* The system relies on *procedural legitimacy*. If the codes check out, the order is presumed legal *by definition*. The "thinking" was done when the President was elected and when the protocols were written.
          *   *The "Incoherent" Argument:* If the order is manifestly illegal (e.g., genocide without cause), the operator *is* liable. But the definition of "manifestly illegal" in a nuclear context is murky. Is retaliation illegal if the US is already burning?
          *   *Resolution:* The system bets on the *Presidential* judgment, not the *Operator's*. The operator's moral agency is a backup fuse, not a control switch. It's there to prevent *unauthorized* use, not *authorized* but *immoral* use.

