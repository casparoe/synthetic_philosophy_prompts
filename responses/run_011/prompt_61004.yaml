answer: |-
  **Brainstorming and Design Notes**
  The crux of this topic lies not in the phenomenology of conflict (which everyone accepts) but in the deontic logic used to resolve it. The real philosophical work happens when we ask which principle is sacrificed to save consistency: usually the Aggregation Principle (if Ought A and Ought B, then Ought (A & B)) or the Overridingness Thesis. Students often fail by treating this as a sociological survey ("Williams says yes, Kantians say no") rather than analyzing the logical machinery. To prevent memory-recall answers, the question must demand identification of the specific logical principle doing the work in denying dilemmas and require an account of the "normative residue" (what happens to the unchosen obligation). If a student merely describes Sartre's student without explaining why the logic of obligation strains under that description, they have not engaged with the theory.

  ***

  ### (a) Essay Question

  **"Genuine moral dilemmas are impossible because rational obligation must be logically consistent."**

  Critically evaluate this claim. In your answer, you must:
  1.  Identify the specific deontic principle typically invoked to rule out the possibility of dilemmas (such as the Aggregation Principle or 'Ought implies Can').
  2.  Assess whether a theory that denies dilemmas can adequately account for the normative significance of the unchosen option (e.g., agent-regret, compensation, or the sense of remaining debt).

  You may use a concrete case (such as Sartre's student) to illustrate your argument, but description alone will not earn credit.

  ***

  ### (b) Model Answer

  The claim that genuine moral dilemmas are impossible rests on the assumption that morality is a rational system capable of issuing determinate action-guidance. A genuine dilemma exists when an agent faces two conflicting obligations, neither of which overrides the other, leaving no single all-things-considered right action. To deny this possibility is to insist that for any agent at any time, there is always one uniquely permissible course of action. However, maintaining this consistency requires specific logical machinery that often clashes with moral phenomenology.

  The primary logical tool used to rule out dilemmas is the Aggregation Principle within standard deontic logic. This principle states that if an agent ought to do A and ought to do B, then they ought to do (A and B). If A and B are mutually exclusive—as in Sartre's case of the student who ought to join the Resistance and ought to care for his mother—then doing (A and B) is impossible. If we accept 'Ought implies Can', then the agent cannot have an obligation to do the impossible. Therefore, to maintain logical consistency, one of the initial obligations must be dismissed as merely apparent. The denial of dilemmas thus relies on reducing conflicting prima facie duties into a single, conclusive obligation.

  However, this logical cleanliness comes at a high theoretical cost regarding the "normative residue." If the student chooses the Resistance, the denialist must claim he had no actual obligation to stay with his mother. Yet, morally sensitive agents typically feel profound agent-regret, not merely disappointment. They feel they have violated a claim, not just missed an opportunity. If the obligation to the mother was nullified by the conflict, it is unclear why compensation or apology is owed. A theory that denies dilemmas struggles to explain why the unchosen option retains normative force. It risks reducing morality to a calculus where losing options vanish without a trace, failing to capture the tragic nature of moral life where values are not always compossible.

  Conversely, accepting genuine dilemmas preserves the phenomenology of residue but threatens the action-guiding function of ethics. If there is no all-things-considered best option, rational choice seems paralyzed. Yet, proponents argue that rationality does not require a unique solution, only that the chosen action is permissible. The cost here is accepting that morality can be inconsistent or that rationality allows for remaindered obligations.

  Ultimately, the denial of dilemmas prioritizes logical consistency over moral experience. While the Aggregation Principle protects the system from contradiction, it does so by erasing the validity of the losing obligation. A robust ethical theory must explain not only what we should do but also what we owe to the values we necessarily violate. Denying dilemmas simplifies the logic of obligation but impoverishes the account of moral responsibility, leaving the agent unable to make sense of their justified regret. Therefore, while dilemmas challenge the consistency of moral systems, denying them requires ignoring the persistent normative claims of the unchosen path.

  ***

  ### (c) Marking Scheme (25 Marks)

  | Move | Marks | Characteristic Failure |
  | :--- | :--- | :--- |
  | **1. Conceptual Precision** | 5 | Confuses psychological stress or uncertainty with logical incompatibility of obligations. |
  | **2. Logical Machinery** | 5 | Fails to identify a specific principle (e.g., Aggregation, OIC) and speaks vaguely of "contradiction." |
  | **3. Theoretical Resolution** | 5 | Describes how a theory denies dilemmas without explaining how it dissolves the conflicting义务 (obligations). |
  | **4. Normative Residue** | 5 | Treats regret as merely psychological rather than assessing its status as a normative remainder. |
  | **5. Critical Synthesis** | 5 | Offers a conclusion that simply restates the prompt without weighing the theoretical costs identified. |
