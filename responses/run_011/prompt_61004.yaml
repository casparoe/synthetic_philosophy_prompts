  2.  **Brainstorming & Crux Identification:**
      *   *Crux:* The debate isn't just "do they exist?" but "what theoretical cost does denying them incur?" vs. "what theoretical cost does accepting them incur?" Denying dilemmas usually relies on logical principles (Aggregation: If Ought A and Ought B, then Ought (A & B); or 'Ought implies Can'). Accepting them requires explaining how rational choice is possible without a determinate 'best' option and accounting for the normative force of the unchosen option (agent-regret, remainder).
      *   *Memory Trap:* Students often list Williams vs. Kantians or Utilitarians without analyzing the underlying logical principles (Aggregation Principle vs. Overridingness Thesis). They might describe Sartre's student without explaining *why* it's a dilemma structurally.
      *   *Strategy:* The question needs to link the possibility of dilemmas to the structural principles of obligation and the phenomenology/normativity of the aftermath (residual obligations).

  3.  **Drafting the Question (a):**
      *   Needs to be specific.
      *   Needs to mention the "machinery" (principles) and the "aftermath" (residual norms).
