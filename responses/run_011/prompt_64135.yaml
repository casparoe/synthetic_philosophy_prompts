      *   *Graduated Schedule (Longer Service = Larger Share):* Implies guilt accumulates or responsibility deepens with time.
      *   *Jaspers's Lens:* Jaspers argues political guilt is continuous. It doesn't end with a payment. It requires ongoing political action and transformation.
      *   *Critique:* Neither instrument is truly faithful to Jaspers because Jaspers rejects the "discharge" model entirely. However, if forced to choose within the colleague's framework: A graduated schedule acknowledges that responsibility deepens with continued membership/benefit, whereas a lump sum suggests a transaction.
