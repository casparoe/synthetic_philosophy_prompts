      *   *Tenure:* Represents time spent benefiting from the *current* structure built on that capital. However, a new director benefits just as much from the brand/reputation as an old one.
      *   *Jaspers's Lens:* Political guilt attaches to membership. Shareholding is a stronger link to *ownership* of the legacy. Tenure is a link to *management*.
      *   *Analysis:* Shareholding is more defensible if the goal is restitution for *capital accumulation*. Tenure is more defensible if the goal is responsibility for *continuing the culture*. However, since the prompt asks about "inherited guilt" regarding *past capital*, shareholding is the stronger link to the *source* of the benefit. But wait—Jaspers talks about *citizenship*. In a corporation, shareholding is closer to citizenship than tenure (which is employment).
