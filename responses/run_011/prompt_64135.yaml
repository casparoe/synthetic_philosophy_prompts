answer: |-
  This is a profound and unsettling situation, and the integrity you are showing in grappling with it is commendable. You are confronting what philosophers call "intergenerational justice" within the specific context of corporate legacy.

  Your colleague's proposal attempts to bring order to a moral chaos by applying an accounting logic to ethical responsibility. While the intention—to acknowledge harm and contribute to repair—is necessary, the mechanism proposed rests on a specific interpretation of Karl Jaspers that requires careful scrutiny. Jaspers's *The Question of German Guilt* (1947) is a subtle text, and using it to justify a "guilt schedule" risks inverting his primary warning.

  Here is an analysis of the weights and the instrument, grounded in Jaspers's distinctions but mindful of their limits when applied to a private corporation.

  ### 1. The Weights: Shareholding vs. Tenure

  If we accept the premise that political guilt attaches to membership in the community (the firm) and survives personnel turnover, we must ask: what constitutes "membership" in this context, and what is the nature of the benefit being received?

  **Shareholding is the more defensible basis for apportionment.**

  *   **The Nature of the Harm:** The ledgers record that the *capital* of the firm was grown through the exploitation of labourers. The primary legacy is financial and structural. Shareholders are the owners of that capital and the primary beneficiaries of its accumulation. In Jaspers's framework, political guilt arises from being a beneficiary of the state's (or firm's) actions, regardless of personal participation.
  *   **Tenure is Secondary:** Tenure measures time spent managing the firm. While longer-serving directors have presided over the company for longer, a director who joined last week owns the same equity (if any) and benefits from the same brand reputation as one who served for twenty years. Tenure implies a gradient of *operational* responsibility, but shareholding implies a gradient of *proprietary* benefit.
  *   **Jaspers's Logic:** Jaspers argues that political guilt is borne by all citizens because they are co-subjects of the polity. In a corporation, the shareholders are the analogue to citizens; the directors are the analogue to civil servants. Therefore, the weight of "inherited" political guilt should track with ownership (citizenship) rather than employment (service).

  **Recommendation:** If you must assign weights, shareholding should carry significantly more weight than tenure. However, be aware that if your family retains a controlling interest, this schedule will naturally concentrate the "guilt" (and the cost of discharge) on the family. This is arguably correct, as the family are the primary heirs of both the capital and the name.

  ### 2. The Instrument: Lump Sum vs. Graduated Schedule

  Your colleague asks whether a lump sum discharging a fixed percentage is appropriate, or if a graduated schedule is more faithful to Jaspers.

  **Neither instrument is faithful to Jaspers, but the lump sum is particularly dangerous.**

  *   **The Fallacy of "Discharge":** Jaspers explicitly argues against the idea that guilt can be "paid off" to restore innocence. For Jaspers, political guilt is not a debt; it is a condition of existence within a compromised community. To treat it as a ledger entry that can be zeroed out via payment is to commit a category error. It turns ethics into a transaction. If a director pays their sum and considers themselves "discharged," they have failed the ethical test.
  *   **The Lump Sum:** This implies that guilt is a static historical debt. It suggests that once the money is paid, the relationship to the past is settled. This encourages moral complacency.
  *   **The Graduated Schedule:** A schedule where longer-serving directors carry a larger share acknowledges that responsibility deepens with continued membership. However, if this is also tied to a "discharge," it suffers the same flaw as the lump sum.

  **Recommendation:** You should argue against the concept of "discharge" entirely. The payment should not be framed as *expiation* (buying forgiveness) but as *restitution* (contributing to repair).
  *   If the committee insists on a monetary mechanism, a **graduated contribution** is preferable to a lump sum, not because it calculates guilt more accurately, but because it acknowledges that responsibility is ongoing and correlates with the duration of benefit received.
  *   However, the money should not go to a general fund to "clear the ledger." It should be directed toward specific reparative projects (e.g., educational endowments for descendants of the labourers, support for maritime labour rights) and the contribution should be recurring, not one-off.

  ### 3. A Jaspersian Correction

  Your colleague cites Jaspers to support the attribution schedule, but Jaspers would likely oppose the schedule's intent.

  *   **Criminal vs. Political:** Jaspers is clear that *criminal* guilt requires a court of law and attaches to specific perpetrators. *Political* guilt attaches to the living generation for the deeds of their state/community. However, Jaspers insists that political guilt is discharged through **political transformation**, not monetary payment.
  *   **The Danger of Quantification:** By assigning percentages, the committee risks turning a moral reckoning into a bureaucratic exercise. It allows directors to say, "I have paid my 5%, I am clean." Jaspers warns that the point of acknowledging guilt is to transform the self and the community, not to purchase absolution.

  ### Proposed Path Forward

  Rather than debating the weights of a flawed instrument, consider proposing the following to the committee:

  1.  **Reject "Discharge":** Frame any financial contribution not as a penalty or a purchase of innocence, but as a voluntary contribution to a Restorative Justice Fund.
  2.  **Focus on Shareholding:** Acknowledge that the obligation stems from ownership of the legacy capital. Directors without shares should not be asked to pay "guilt" levies, though they bear a professional responsibility to ensure ethical governance going forward.
  3.  **Continuous Responsibility:** Instead of a schedule that ends, establish a permanent commitment. For example, a fixed percentage of annual dividends or profits could be allocated to reparative causes in perpetuity. This aligns better with Jaspers's view that political guilt is a continuous state of responsibility for the community's character.
  4.  **Truth-Telling:** Jaspers emphasizes the importance of "inner purification" through truth. The firm should publicly acknowledge the findings of the ledgers. Hiding the history while paying a quiet sum would be an act of bad faith.

  **Summary:**
  If forced to choose within your colleague's framework: **Weight shareholding over tenure**, and **reject the lump sum discharge** in favor of a graduated, ongoing contribution. But the most philosophically robust move is to challenge the premise that guilt can be quantified and discharged at all. The goal should be to change the firm's future relationship to its past, not to balance the books.
