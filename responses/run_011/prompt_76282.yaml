      *   **Key Characters:**
          *   The Speaker (volunteered, conflicted).
          *   The Page-Tearer (known to all, apologized privately, not publicly).
          *   The Two Economists (cheerful about the collapse, know the theory).
          *   The Community (19-year-old new joiner, carpet cleaner guy, honest signers).
      *   **Constraints:**
          *   ~6 minutes spoken (approx. 800-900 words).
          *   Farewell and thank-you first (neighbors, not seminar).
          *   Accessible language (no jargon like "Nash," "tit for tat," "shadow of the future").
          *   Theme: The collapse wasn't necessarily moral failure, but structural (knowing when the game ends).
          *   Tone: Not letting anyone off the hook, but not curdling into a shrug. No false hope.
          *   Specific Theory: Axelrod's *The Evolution of Cooperation* (Nice, Retaliatory, Forgiving, Clear). The sign-out book = legibility/clarity.
          *   The Dilemma: Was it true cooperation or just mutual advantage? Does it matter?
          *   The Decision: Address the Page-Tearer publicly or not? (Must pick and justify).
      *   **Post-Speech Note:** Confidence level on the theory application, least sure point, liberties taken.

  2.  **Deconstruct the Theory (Mental Sandbox):**

      *   *Shadow of the Future:* Cooperation holds when people expect to interact again. If the game has a known end point, defection becomes rational in the final rounds (backward induction).
      *   *Legibility/Clarity:* The sign-out book made actions visible. Tearing pages destroyed visibility, accelerating the collapse.
      *   *Axelrod's Traits:*
          *   *Nice:* Don't defect first. (Most neighbors were nice for 11 years).
          *   *Retaliatory:* Punish defection. (Hard to do in a closing library).
          *   *Forgiving:* Return to cooperation after punishment. (No time for this).
          *   *Clear:* Make your intentions known. (The book was the clarity).
      *   *The Economists' View:* They see the collapse as inevitable given the end date. They think the 11 years were "lucky" because the shadow of the future was long enough to hide the fragility.
      *   *The Speaker's View:* Wants to honor the 11 years without lying about the end. Wants to acknowledge the structural pressure without excusing the theft.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Welcome, acknowledge the setting (shed, coffee), thank everyone. Establish the 11-year success.
      *   **The Middle (The Collapse):** Address the ending. Acknowledge the last six weeks without being accusatory. Introduce the concept of "the end" changing behavior without using econ jargon.
      *   **The Book/Legibility:** Focus on the sign-out book. It wasn't just paper; it was the promise. Tearing it was the turning point.
