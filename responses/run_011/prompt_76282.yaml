      *   *Decision:* I will *not* single her out by name or direct address. I will address the *act* and the *private apology* generally. Why? Because public shaming in a farewell speech turns the memory of the library into a courtroom. The goal is to preserve the 11 years, not define the group by the last 6 weeks. However, I must acknowledge the breach. I will speak to the *silence* around it.

  5.  **Drafting the Content (Iterative):**

      *   *Word Count Check:* 6 minutes is roughly 800-900 words at a moderate pace.
      *   *Key Phrase:* "The shadow of the future" -> "The promise of tomorrow."
      *   *Key Phrase:* "Legibility" -> "Being seen."
      *   *Key Concept:* Backward induction -> "When we knew the last day, the rules changed."

