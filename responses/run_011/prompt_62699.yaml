answer: |-
  Your flatmate has identified a strong connection, but she is mistaken to call them the same thesis. While they are often bundled together, they address different logical problems. To separate them, we must distinguish what each claim is *about*.

  Duhem–Quine holism is a thesis about the **structure of testing**. It claims that hypotheses cannot be tested in isolation. When you derive a prediction, you rely on a main hypothesis ($H$) plus a set of auxiliary assumptions ($A$) about instruments, background conditions, and ceteris paribus clauses. If the prediction fails, logic only tells you that the conjunction ($H \land A$) is false. It does not tell you whether $H$ is false or $A$ is false. Thus, you can always save $H$ by tweaking $A$. This is a claim about the unit of empirical significance: it is the whole web of belief, not the single strand.

  Underdetermination of theory by evidence (UDT), by contrast, is a thesis about the **relation between evidence and theory choice**. It claims that for any given body of evidence, there are always at least two rival theories that are equally compatible with it. Evidence alone cannot dictate which theory we ought to accept. This is a claim about the insufficiency of data to fix belief.

  Your intuition that they can come apart is correct. Consider entailment. Does holism entail underdetermination? Not strictly. Holism shows that a single theory can survive recalcitrant evidence by adjusting auxiliaries. However, it does not guarantee that there exists a *rival* theory that also fits the evidence. It is logically possible that only one coherent web of belief fits the data, even if we cannot test its components in isolation. Holism blocks falsification; UDT blocks unique verification.

  Does underdetermination entail holism? Again, no. One could imagine a world where hypotheses are testable in isolation (no auxiliaries needed), yet nature simply produces identical data for distinct hypotheses. UDT is about the output of nature; holism is about the input of our testing procedures. You can coherently hold one and deny the other, though historically they reinforce each other. Holism provides the *mechanism* by which underdetermination persists: because we can adjust the web, we can keep rival theories alive.

  Now, consider your village well case. Theory A (septic) and Theory B (mineral) are empirically equivalent relative to current sampling. Your reading group argues this shows underdetermination is a phantom because new instruments (isotope ratios) break the tie. This argument conflates *local* underdetermination with *global* underdetermination.

  Local underdetermination is indeed transient. As you noted, changing auxiliaries (new instruments) often distinguishes rivals. However, the philosophical thesis of UDT is usually modal: it claims that for any *total* possible evidence, rivals exist. The fact that we can distinguish A and B today does not prove that a new rival C won't emerge tomorrow that fits all data, including the isotope ratios.

  Is the holist entitled to the reading group's move? Yes and no. The holist agrees that equivalence is relative to a specific web of auxiliaries. When you add a borehole reading, you are changing the auxiliary set, and the equivalence vanishes. This confirms holism: what counts as evidence depends on the web. However, using this to dissolve UDT entirely is a mistake. The holist insists that because the web is flexible, we can always reconstruct it to fit the data. If the well data changes, the holist says we can adjust the web to accommodate it. The reading group says the change in data kills the equivalence. The holist should argue that the flexibility of the web is precisely what allows underdetermination to survive any specific experimental advance. The holist's flexibility cuts both ways: it allows us to solve local puzzles, but it also ensures no evidence ever strictly forces a unique theory globally.

  Finally, regarding Quine. In *Two Dogmas*, Quine moves from holism (no statement is immune to revision) to a claim that looks very much like underdetermination ("any statement can be held true come what may"). Is this a legitimate inference? It is a slide, not a deduction. Holism says we *can* save a statement by making drastic adjustments elsewhere in the system. Underdetermination says evidence does not *compel* us to choose one theory over another. Quine arguably strengthens the claim in later work, moving from the possibility of saving a hypothesis to the inevitability of rival systems. In *Two Dogmas*, he is primarily attacking the analytic/synthetic distinction; the underdetermination point is a corollary he later emphasises. It is not a change of subject, but it is an amplification. He takes the logical possibility granted by holism and turns it into a pragmatic principle of theory choice.

  So, tell your flatmate this: holism explains why we *can* keep a theory alive; underdetermination explains why we *must choose* between rivals without logical compulsion. They are distinct gears in the same machine. Holism is about the logic of falsification; underdetermination is about the indeterminacy of choice. You can have one without the other, though having both makes for a very sceptical afternoon.
