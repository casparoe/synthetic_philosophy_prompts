  ### 1. Brainstorm: Load-Bearing vs. Decoration

  *   **Load-Bearing:** The interpretation of Robbins (ICU is value judgment, not fact), the interpretation of Arrow (utilitarianism is *incoherent*, not just ruled out by specific axioms), the critique of Harsanyi (circularity), and the final modal claim ("nothing ever could"). If Arrow didn't prove incoherence, or if ICU is possible, the final paragraph's certainty collapses.
  *   **Decoration:** The specific dating ("1930s"), the dramatic phrasing ("habit died," "technical costume"), the claim that Pareto has "no moral baggage whatsoever" (rhetorical flourish to contrast with utilitarianism), and the specific description of the impartial observer's mechanics. These support the narrative flow but aren't strictly necessary for the core argument about policy justification.

  ### 2. Audit Table

  | claim | verdict | what's right | what's lost or blurred | sharper version |
  | :--- | :--- | :--- | :--- | :--- |
  | "That habit died in the 1930s, when Lionel Robbins pointed out... [ICU is] an expression of how I feel" | FAIR SIMPLIFICATION | Robbins (1932) did argue ICU is normative, not positive. | Ignores that cardinalists persisted; implies a clean break that didn't happen. | Robbins argued interpersonal comparisons are ethical judgments, not verifiable scientific facts, shifting mainstream welfare economics. |
  | "In its place came the one welfare judgment the discipline still allows itself... Pareto" | ACCURATE | Pareto efficiency became the dominant positive criterion. | — | Pareto efficiency became the standard minimal criterion for welfare improvements in positive economics. |
  | "Unlike utilitarianism, the criterion carries no moral baggage whatsoever." | SLIP | Pareto avoids weighing one person's utility against another's. | Endorsing Pareto itself requires ethical individualism; status quo dependence is ethical. | Pareto avoids explicit trade-offs, but accepting it as a goal relies on ethical assumptions about individual sovereignty and endowments. |
  | "Arrow... showed that no procedure for combining individual utilities into a social total can be simultaneously fair and rational." | SLIP | Arrow proved an impossibility theorem for social welfare functions. | Assumes ordinal, non-comparable utilities; cardinal utilitarianism escapes the theorem. | Arrow showed no aggregation rule satisfies certain axioms given ordinal, non-comparable individual preferences. |
  | "That is the deepest reason the old utilitarian project was doomed: not that it was distasteful, but that it was incoherent." | WRONG | Utilitarianism faces challenges in aggregation. | Utilitarianism is logically coherent; it violates Arrow's axioms (e.g., IIA), not logic itself. | Utilitarianism remains logically coherent but requires cardinal, comparable utility information excluded by Arrow's assumptions. |
  | "Modern economics does let utility back in, but only ordinally, and only one person at a time." | FAIR SIMPLIFICATION | Standard microeconomics uses ordinal utility. | Welfare economics and behavioral fields sometimes use cardinal measures. | Standard microeconomic theory typically models utility as ordinal and individual-specific. |
  | "Revealed preference... tells us nothing about how much you enjoyed either, and still less about how your enjoyment stacks up against mine." | ACCURATE | Revealed preference identifies ranking, not intensity or comparison. | — | Revealed preference identifies choice rankings but provides no data on utility intensity or interpersonal comparisons. |
  | "Harsanyi's result... is to suppose the utilities already sit on a common scale — which is to assume the very thing the argument was meant to establish." | CONTESTABLE | Harsanyi's theorem requires fixing utility units for comparison. | Harsanyi argues impartiality fixes the scale; critics call it circular, defenders disagree. | Critics argue Harsanyi's impartiality condition implicitly assumes interpersonal comparability rather than deriving it. |
  | "Nothing in economics measures those gains and losses against one another, and nothing ever could." | WRONG | Standard economics does not measure interpersonal utility. | "Nothing ever could" claims logical impossibility, not methodological limitation. | Standard economics does not measure interpersonal utility, though other frameworks conceptually could. |

  ### 3. Analysis and Conclusion

  The load-bearing defects are the characterization of Arrow's theorem and the modal strength of the final claim. The author treats Arrow's result as a proof of utilitarianism's logical incoherence, whereas it demonstrates the impossibility of aggregation only given ordinal, non-comparable inputs. If cardinal utility is admitted, utilitarianism is coherent. Similarly, claiming nothing *ever could* measure interpersonal gains is empirically and logically too strong; it confuses current methodological norms with logical impossibility.

  Once repaired, the conclusion survives in a weakened form: standard ordinal economics cannot justify redistribution without extra-economic ethical weights. The efficiency criterion itself is not neutral, but the impossibility is methodological, not logical. A defensible rewrite: "When you are told policy gains outweigh losses, you are hearing an ethical weighting disguised as efficiency. Standard economics lacks the tools to measure these trade-offs scientifically, relying instead on implicit moral judgments about distribution."

  Your friend is correct. The passage conflates measurability (cardinality) with comparability. Robbins' critique targeted interpersonal comparisons specifically, not cardinal measurement per se. One can conceive of cardinal utility (measurable intensity) that remains interpersonally non-comparable. By treating ordinality and non-comparability as a single locked door, the author suggests a deeper impossibility than exists. The error misidentifies the limitation as logical incoherence rather than an informational constraint chosen by the discipline. This matters because it closes off debates about well-being measurement that remain live in philosophy and some economic subfields. The author's skepticism about policy claims is warranted, but the justification rests on disciplinary convention, not scientific law. Recognizing this distinction clarifies that the 'technical costume' is worn not because comparison is impossible, but because standard models exclude the necessary data. This strengthens the call for transparency about ethical assumptions rather than resigning us to silence.
