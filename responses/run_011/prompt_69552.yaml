  # The Tyranny of the Start: Why Ex Ante Rationality Governs the Absentminded Driver

  The Absentminded Driver puzzle, formulated by Piccione and Rubinstein, is a staple of decision theory because it exposes a fissure in how we understand the rational agent. Is the agent a temporally extended planner, or a sequence of momentary decision-makers? Your proposed twist—buying an information app—sharpens this fissure into a paradox. You posit that *ex ante* (before driving), the app appears worthless because the driver's best plan already nets the maximum payoff of 4, yet *at the junction* (action-time), the app appears valuable enough to pay for.

  This creates a tension between two valuations of the same information in the same currency. To resolve it, we must pick a side. The correct answer is that the **ex ante calculation governs**, and the action-time willingness to pay is an artifact of confused self-locating credences. However, to make this case rigorously, we must first correct a critical premise in your setup regarding the baseline payoff.

  ### The Arithmetic of Imperfect Recall

  The paradox you describe rests on the claim that the driver's best plan without the app "already nets 4." In the standard Piccione–Rubinstein setup, this is mathematically impossible. The driver faces two identical exits. Exit 1 yields 1, Exit 2 yields 4, and passing both yields 0. Because the driver cannot distinguish the exits, they must adopt a single strategy: continue with probability $p$ and exit with probability $1-p$ at *every* junction.

  The expected payoff $U(p)$ is calculated as:
  $$U(p) = (1-p) \cdot 1 + p(1-p) \cdot 4 + p^2 \cdot 0$$
  $$U(p) = 1 + 3p - 4p^2$$

  Maximizing this function yields $p = 3/8$, resulting in a maximum expected payoff of **25/16 (1.5625)**, not 4. The ceiling of 4 is only reachable with perfect information (knowing which exit is which). Therefore, *ex ante*, the app is not worthless; it is the bridge between a 1.56 expected return and a guaranteed 4. Its *ex ante* value is $4 - 1.5625 = 2.4375$.

  However, correcting this arithmetic does not dissolve the philosophical tension; it merely quantifies it. The core of your puzzle remains: Why does the driver at the junction, running "naive credence math," potentially arrive at a different valuation than the planner at the start? And which valuation is the rational one?

  ### The Illusion of the Junction

  When the driver arrives at a junction, they suffer from imperfect recall. They do not know if they are at the first exit or the second. To make a decision, they must assign a credence (probability) to their location. A "naive" application of self-locating belief (akin to the Sleeping Beauty problem) might suggest a 50/50 split, or a split derived from the strategy itself (e.g., if $p=3/8$, the probability of being at the first exit is $1/(1+p) = 8/11$).

  Based on these credences, the driver calculates the expected utility of exiting versus continuing *at that moment*. If they believe the app will resolve this uncertainty, they might value it based on the local improvement to their decision at that specific node. This is the "action-optimality" view. It treats the driver at the junction as a distinct agent with their own information set and utility maximization problem.

  From this perspective, the app looks valuable because it converts a ambiguous local gamble into a certain local outcome. The driver thinks, "If I know I'm at Exit 1, I continue. If I'm at Exit 2, I exit. This improves my immediate prospects."

  ### Why Ex Ante Rationality Must Govern

  Despite the intuitive pull of the action-time perspective, the **ex ante (plan-optimality) calculation is the only coherent standard for rational choice.** The driver should pay up to **2.4375** for the app, as determined by the planning self, not the price suggested by the junction self's confused credences.

  There are three reasons for this verdict.

  First, **temporal consistency.** Rationality requires that an agent's preferences do not fluctuate merely due to the passage of time or the loss of memory, provided no new *objective* information has been received. The driver at the start and the driver at the junction are the same person with the same ultimate goals. If the planning self calculates that a policy yields 1.56, and the action self calculates that the same policy yields something else based on self-locating beliefs, one of them is miscounting. The planning self counts the full probability tree correctly. The action self distorts the probabilities because being at a junction is not a random sample of the timeline; it is a selection effect (you are guaranteed to reach the first junction, but only probabilistically reach the second). Trusting the action-time credences leads to dynamic inconsistency, where the agent wants to change their plan mid-stream without any new external evidence.

  Second, **the Dutch Book argument.** If we allow action-time valuations to govern, the agent becomes vulnerable to exploitation. An exploiter could sell the driver the app at the junction for a price that the junction self accepts but the planning self would have rejected, or vice versa. By adhering to the ex ante valuation, the agent immunizes themselves against money-pump scenarios that arise from treating time-slices as independent agents.

  Third, **the definition of value.** The value of information is defined by how much it improves the agent's ability to achieve their goals over the *entire* trajectory, not just at the current node. The app's value lies in its ability to alter the *plan* from "randomize with $p=3/8$" to "conditional exit." This change is only visible and valuatable from the perspective of the start, where the full distribution of outcomes is visible. At the junction, the driver sees only a slice of the tree. Valuing information based on a partial view is inherently flawed.

  ### The Cost: Abandoning Separability

  Choosing the ex ante view requires us to give up something significant. We must abandon the principle of **Separability** (or Local Sovereignty).

  Separability is the intuition that a rational decision at time $T$ should depend only on the options and beliefs available at time $T$, independent of past plans that are no longer binding. It suggests that the "self" at the junction is the ultimate authority on what is best for the "self" at the junction.

  To maintain that ex ante rationality governs, we must accept that the agent at the junction is **not** the best judge of their own interest. We must treat the agent as a single, temporally extended entity whose "moments" are subservient to the global plan. When the driver sits at the junction, they may feel that the app is worth a different amount, or that exiting is better than continuing, based on their local credences. But if those local calculations conflict with the ex ante optimal plan, the local calculations are the ones that must be overruled.

  This is a hard pill to swallow. It implies that rationality sometimes requires acting against one's local expected utility calculations if those calculations are based on indexical uncertainty. It demands that we view our momentary selves as employees of a CEO (the planning self) who has a better view of the company's overall health. We give up the democratic sovereignty of the present moment for the autocratic efficiency of the initial commitment.

  ### Conclusion

  The driver should pay **2.4375** for the app. This number is derived from the difference between the perfect information payoff (4) and the optimal imperfect recall payoff (25/16). The notion that the app is *ex ante* worthless is a miscalculation of the baseline; the notion that the action-time valuation is superior is a miscalculation of the agent's identity.

  The paradox dissolves when we recognize that the "confused credences" at the junction are not a valid basis for valuation. They are artifacts of a mind trying to apply standard probability to a non-standard self-locating problem. Rationality belongs to the planner, not the doer. To keep this view, we must surrender the comforting idea that we are always rational in the moment. Instead, we must accept that we are only rational if we bind our future, confused selves to the clear-eyed decisions of our past.
