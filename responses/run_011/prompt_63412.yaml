prompt: |-
  I am Head of Collections Care at a municipal museum of applied art and historical science, and I need a written decision procedure for a question that reaches us several times a month but that we currently settle by instinct. Our accession register, our insurance schedule, our loan agreements and our gallery labels all rest on claims of the form "this is the same object we acquired in 1931", and after decades of repair, consolidation, replacement, dismantling and reassembly such claims are frequently questionable. Our informal practice is a rule I inherited and now distrust: an object survives so long as more than half of its original material, measured by mass, remains present. I can see at least three defects in it. Mass is the wrong kind of measure. It says nothing whatever about an object whose every part was replaced one at a time over a century. And it silently assumes that "same object" means one thing, when in fact we ask it in three distinct registers: for insurance and indemnity, for attribution and authorship, and for what may truthfully be printed on a label or asserted in a loan agreement.

  Please convert what the philosophy of material constitution genuinely offers — the sortal-relativity of identity claims, the dominant-kind view, the closest-continuer approach, the four-dimensionalist option of treating an object as extended across time rather than wholly present at it, and the difficulty that arises when two candidate objects coincide in one place at one moment — into a procedure that conservators and registrars with no philosophical training can run. It should be a numbered sequence of questions, each with a stated sufficient answer; it should identify the point at which it terminates in "the object recorded under this accession number no longer exists: close the record and open a new one"; it should identify the point at which it terminates in "this is a question of institutional policy or of value, not of fact: refer it to the Director and the trustees"; and it should say candidly which steps are judgement calls dressed as procedure. We allow a fortnight per case and the reasoning must fit on a single sheet, so the instrument has to be short enough to run inside those constraints.

  We are also introducing an Object Continuity Ledger, recording for each intervention the component affected, the proportion of that component's material replaced, whether the intervention was reversible, and whether the removed matter was retained in store. Specify what further fields the ledger must carry if your procedure is to be runnable from it at all.

  Then run the procedure on three live cases.

  Case A. An eighteenth-century longcase regulator by a provincial maker, accessioned complete in 1931. Every component of the movement except the frame plates and one wheel has since been replaced, at intervals, by successive curators; each removed part was retained, and together the stored parts suffice to reassemble the movement as it stood in 1931. The case, dial and finial are original. The clock is on open display and runs. A donor-restricted bequest attaches to the regulator as acquired, and a planned redisplay would exhibit the running clock and the reassembled 1931 movement side by side.

  Case B. A kinetic light installation of the 1960s, acquired in 1979 under a certificate from the artist's estate authorising substitution of components as they become obsolete or unserviceable, provided each substitution is recorded. Eleven substitutions have been made. The last component dating from original manufacture — a drive motor — failed this year and a functionally equivalent motor has been fitted. We must now tell an indemnifying lender what proportion of the work is original and whether the work itself survives.

  Case C. A fragmentary ceramic vessel excavated in the 1920s and acquired by us in 1954. Roughly two-fifths of the wall is ancient; the remainder is modern fill, painted to match. It has been dismantled and reassembled twice, and each reassembly introduced further new fill. An external institution proposes to borrow it on condition that the accompanying label describes it as an original vessel of its period, and my registrar wants to know whether that sentence would be true.

  In at least one of these three I expect an answer I shall not like; I would far rather the procedure say so plainly than find a route around it, so please do not soften the verdict where the verdict is unwelcome. Where the three registers come apart — where the answer for insurance is not the answer for the label — say so explicitly and state which of them governs the accession number itself.

  Finally, set out what the procedure cannot do: the classes of object and intervention it will misclassify, the disputes it leaves untouched, and the points at which a well-run museum must simply make a choice and record that it has done so.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **User:** Head of Collections Care at a municipal museum (applied art & historical science).
      *   **Problem:** Need a formal decision procedure for object identity/continuity ("Is this the same object we acquired in 1931?"). Current practice (50% mass rule) is flawed.
      *   **Requirements:**
          *   Convert philosophical concepts (sortal-relativity, dominant-kind, closest-continuer, 4Dism, coincidence) into a practical, numbered procedure for non-philosophers.
          *   Must fit on one sheet, runnable in a fortnight.
          *   Must specify termination points: "Close record/Open new one" vs. "Refer to Director/Trustees (Policy/Value)".
          *   Must candidly identify "judgement calls dressed as procedure."
          *   Must specify additional fields for the "Object Continuity Ledger."
          *   Must apply the procedure to three specific cases (A, B, C).
          *   Must be candid about unwelcome verdicts (no softening).
          *   Must distinguish between registers (Insurance, Attribution/Authorship, Label/Loan).
          *   Must state limitations (what the procedure *cannot* do).
      *   **Tone:** Professional, precise, candid, administrative but philosophically grounded.

  2.  **Deconstruct the Philosophical Concepts for Practical Use:**

      *   *Sortal-Relativity:* Identity depends on *what kind of thing* it is (e.g., a "clock" vs. "a collection of parts").
      *   *Dominant-Kind:* What is the primary function or identity? (e.g., Is it art or machinery?)
      *   *Closest-Continuer:* Which candidate object is most continuous with the original in terms of history, form, and function?
      *   *4Dimensionalism:* Treat the object as a spacetime worm. Interventions are temporal parts. (Hard to operationalize for registrars, better to translate into "History of Integrity").
      *   *Coincidence:* Two objects in one place (e.g., the "1931 Clock" and the "2024 Clock").

      *Translation to Procedure:*
      *   Instead of "Sortal," ask: "What is the primary identity?"
      *   Instead of "Closest-Continuer," ask: "Is there a stronger candidate for the original identity?"
      *   Instead of "4Dism," focus on "Continuous History of Custody and Function."
      *   Instead of "Coincidence," acknowledge when we have *two* distinct objects occupying the same accession number.

  3.  **Drafting the Procedure (The "Instrument"):**

      *   *Constraint:* One sheet, short enough for a fortnight.
      *   *Structure:* Numbered questions with branching logic.
      *   *Registers:* Need to separate Insurance (value/risk), Attribution (authorship), and Label (public truth).
      *   *Thresholds:* Need to move away from mass. Focus on *integrity of form* and *function*.

      *Drafting Steps:*
      1.  Define the Sortal (What is it?).
      2.  Check Material Integrity (Is the core structure there?).
      3.  Check Functional Integrity (Does it do what it did?).
      4.  Check Historical Continuity (Was the change gradual or abrupt?).
      5.  Check Coincidence (Do we have the old parts to make a rival claim?).
      6.  Assign Verdict per Register.

      *Refining the "Judgement Calls":* I need to explicitly mark where human interpretation overrides the checklist.

      *Refining the Ledger:* The prompt asks what *further* fields are needed. Current fields: Component, % replaced, Reversible, Removed matter retained.
      *Needed:* Date of intervention, Agent of intervention (Artist? Conservator? Owner?), Intent of intervention (Repair? Upgrade? Reconstruction?), Current Location of removed matter.

  4.  **Applying to Cases:**

      *   **Case A (The Clock):**
          *   *Sortal:* Timekeeping instrument / Historical artifact.
          *   *Material:* Movement mostly new, Case original.
          *   *Coincidence:* The 1931 parts exist in store and can be reassembled. This is the "Ship of Theseus" problem with a twist (the old ship is in the garage).
          *   *Verdict:* This is the hardest one. Philosophically, if the 1931 parts can be reassembled, *that* assembly has a strong claim to be the "1931 Object." The running clock is a "Replica/Continuation."
          *   *Registers:* Insurance (Running clock has value), Label (Must distinguish), Accession (Does the number follow the case or the movement?).
          *   *Unwelcome Truth:* The accession number might technically belong to the box of parts, not the running clock. Or, we admit we have *two* objects under one number.

      *   **Case B (Kinetic Light):**
          *   *Sortal:* Conceptual Art / Installation.
          *   *Authority:* Artist's estate certificate allows substitution.
          *   *Material:* 0% original motor.
          *   *Verdict:* In conceptual art, the idea dominates the material. The certificate acts as a legal/philosophical bridge.
          *   *Registers:* All align. The work survives.
          *   *Nuance:* Insurance value might fluctuate based on "original components" vs. "authenticated work."

      *   **Case C (Ceramic Vessel):**
          *   *Sortal:* Archaeological Artifact.
          *   *Material:* 40% ancient, 60% fill.
          *   *Label:* "Original vessel" is false. It is a "Reconstructed vessel containing original fragments."
          *   *Verdict:* Identity survives as a museum specimen, but label claim is factually incorrect.
          *   *Registers:* Label must change. Accession survives (it's the same *specimen*), but description needs correction.

  5.  **Drafting the Limitations:**

      *   Cannot solve value disputes (market vs. historical).
      *   Cannot override legal title.
      *   Cannot handle "Digital Objects" well without modification.
      *   Cannot force consensus if stakeholders disagree on the "Sortal."

  6.  **Review and Refine:**

      *   *Check Constraints:* Is it short enough? (Need to be concise). Is it candid? (Yes, need to ensure Case A's verdict is sharp).
      *   *Check Philosophy:* Did I use the concepts requested? (Sortal, Closest-Continuer, etc., need to be embedded in the logic).
      *   *Check Ledger:* Did I specify the extra fields?
      *   *Check Registers:* Did I separate Insurance, Attribution, Label?

      *Self-Correction on Case A:* The prompt says "I expect an answer I shall not like." The likely unwelcome answer is that the running clock is *not* the 1931 object if the 1931 parts are reassemblable. The "Closest-Continuer" theory suggests that if the original parts are available, they constitute a stronger claim to the original identity than the hybrid running clock. I must state this clearly. The Accession Number usually follows the *historical* object. If the historical object is the box of parts, the running clock is a new entity (perhaps a derivative work). However, museum practice often binds the number to the *case*. I need to force a choice. I will rule that the Accession Number stays with the *continuous history of display*, but the *identity claim* splits. Actually, the prompt asks when to "Close record and open new one." If the 1931 parts are reassembled, that is the 1931 object. The running clock is a "facsimile in use." I will recommend splitting the accession.

      *Refining the Procedure Text:* Make it look like a form/checklist. Use bolding for decision points.

      *Refining the Ledger:* Keep it tight.

      *Refining the Limitations:* Be honest about the "Policy/Value" referral.

  7.  **Final Polish:** Ensure the tone is appropriate for a Head of Collections Care (authoritative, precise, risk-aware). Ensure the philosophical terms are translated into operational language but acknowledged.

      *(Self-Correction during drafting)*: Wait, the prompt asks to convert the philosophy *into* the procedure. I shouldn't just list the philosophy, I should embed it.
      *   *Sortal-Relativity* -> Question 1 (Define the Kind).
      *   *Closest-Continuer* -> Question 4 (Competing Candidates).
      *   *Dominant-Kind* -> Question 2 (Function vs. Material).
      *   *Coincidence* -> Question 5 (Two objects in one place).

      *Ledger Fields:* Need "Intent" and "Authority."
      *Case A Verdict:* Unwelcome: The running clock is not the 1931 object if the 1931 parts are reassembled. The Accession belongs to the parts. The running clock is a new object (or a modification).
      *Case B Verdict:* Work survives.
      *Case C Verdict:* Label is false.

      *Let's write it.*
answer: |-
  # OBJECT IDENTITY AND CONTINUITY PROCEDURE (OICP-v1)

  **Purpose:** To determine whether an intervened object retains its original accession identity across three registers: **Legal/Insurance**, **Attribution/Authorship**, and **Public Label**.
  **Constraints:** Complete within 14 days. Reasoning must fit on the reverse of this sheet.
  **Philosophical Basis:** Sortal-Relativity (Identity depends on kind), Closest-Continuer (Historical continuity trumps material), Coincidence (Two objects may occupy one space).

  ### PART 1: THE LEDGER REQUIREMENTS
  *To run this procedure, the Object Continuity Ledger must carry these additional fields:*
  1.  **Intervention Authority:** (Artist/Executor / Conservator / Owner / Unknown).
  2.  **Intent of Change:** (Repair / Upgrade / Reconstruction / Artistic Revision).
  3.  **Location of Removed Matter:** (Destroyed / In Store / Private Hands).
  4.  **Reassembly Viability:** (Can removed matter be reconstituted into a functional/recognizable whole? Yes/No/Partial).

  ---

  ### PART 2: THE DECISION SEQUENCE
  *Answer sequentially. If a Sufficient Condition is met, terminate and record the verdict.*

  **1. Define the Sortal (The "Kind" of Object).**
  *Question:* Is the object primarily defined by its **Material Integrity** (e.g., archaeological specimen, rare book), **Functional Integrity** (e.g., clock, vehicle), or **Conceptual Integrity** (e.g., kinetic art, installation)?
  *   *If Material:* Proceed to Q2.
  *   *If Functional:* Proceed to Q3.
  *   *If Conceptual:* Proceed to Q4.
  *(Judgement Call: Classifying the dominant kind. Disputes here refer to Director.)*

  **2. Material Integrity Check.**
  *Question:* Does the original material constitute the primary evidence of value (e.g., DNA, fabric, patina)?
  *   *If >50% original material is lost AND the removed material is retained in store:* **STOP.** The object recorded under this accession number no longer exists as a material unity. The stored material is the primary claimant. **Close Record / Open New One** for the modified assembly.
  *   *If removed material is destroyed:* The modified object retains the Accession Number, but Label must specify "Reconstructed."
  *   *Otherwise:* Proceed to Q5.

  **3. Functional Integrity Check.**
  *Question:* Does the object perform its defining function using its original structural logic?
  *   *If Yes:* The Accession Number is retained regardless of material replacement, provided the change was gradual (Closest-Continuer).
  *   *If No (it is static/display only):* Treat as Material Integrity (Q2).
  *   *If Function is maintained via total replacement of core systems:* Proceed to Q4.

  **4. Authority and Intent Check.**
  *Question:* Is there documented authority (Artist, Estate, Maker) permitting substitution without loss of identity?
  *   *If Yes:* The Work survives. Accession Number retained. Insurance value may adjust, but Identity holds.
  *   *If No:* Proceed to Q5.

  **5. The Coincidence Check.**
  *Question:* Do the removed parts suffice to reassemble a rival candidate for the original identity?
  *   *If Yes:* **STOP.** Two objects now coincide. The Accession Number belongs to the candidate with the strongest historical continuity (usually the original parts). The modified object requires a new Accession Number or a derivative suffix. **Refer to Director** for asset split.
  *   *If No:* The modified object retains the Accession Number.

  **6. The Register Split.**
  *Even if the Accession Number is retained, verify the three registers:*
  *   **Insurance:** Insure for current market value of the *modified* assembly.
  *   **Attribution:** Attribute to original maker *only* if the "Dominant Kind" (Q1) remains unchanged.
  *   **Label:** Must truthfully reflect the proportion of original material. "Original" is prohibited if <50% original material remains unless authorized by Q4.

  **7. Policy Referral.**
  *If the procedure yields a result that contradicts donor restrictions, legal title, or institutional reputation:* **STOP.** Refer to Director and Trustees. This is a question of Value, not Fact.

  ---

  ### PART 3: CASE APPLICATIONS

  #### Case A: The Longcase Regulator
  *   **Q1 (Sortal):** Functional Integrity (Clock) vs. Material Integrity (Historical Artifact). *Judgement:* As a museum piece, it is now primarily a Historical Artifact.
  *   **Q2 (Material):** Movement mostly replaced. Removed parts retained in store.
  *   **Q5 (Coincidence):** **YES.** The stored parts suffice to reassemble the 1931 movement.
  *   **Verdict:** **Unwelcome.** The Accession Number (1931) technically belongs to the *box of original parts*, not the running clock. The running clock is a "Continuation" or "Facsimile in Use."
  *   **Action:** Split the Accession. 1931.001a (Original Parts), 1931.001b (Running Assembly).
  *   **Registers:**
      *   *Insurance:* 1931.001a (High historical value), 1931.001b (Functional value).
      *   *Label:* Cannot call the running clock "The 1931 Regulator." Must read: "Regulator (Case 1931, Movement Reconstructed)."
      *   *Loan:* The running clock may travel, but the identity claim is limited.

  #### Case B: Kinetic Light Installation
  *   **Q1 (Sortal):** Conceptual Integrity.
  *   **Q4 (Authority):** **YES.** Estate certificate authorizes substitution.
  *   **Verdict:** The Work survives. Material replacement is irrelevant to identity.
  *   **Action:** Retain Accession Number.
  *   **Registers:**
      *   *Insurance:* Value determined by Estate certification, not material age.
      *   *Label:* "Original Work" is truthful (conceptually).
      *   *Loan:* Indemnify as the original Work.

  #### Case C: Ceramic Vessel
  *   **Q1 (Sortal):** Material Integrity (Archaeological Specimen).
  *   **Q2 (Material):** <50% original (2/5ths). Removed matter (dust/fill) destroyed/lost.
  *   **Q5 (Coincidence):** **NO.** Cannot reassemble a rival original.
  *   **Verdict:** Accession Number survives (it is the same *specimen*), but the identity claim is degraded.
  *   **Registers:**
      *   *Insurance:* Value reflects "Fragment with Restoration."
      *   *Label:* **FALSE.** "Original vessel" is a lie. Must read: "Reconstructed Vessel (c. 40% Original Material)."
      *   *Loan:* Lender condition cannot be met truthfully. Negotiate label text or decline loan.

  ---

  ### PART 4: LIMITATIONS AND DISCLAIMERS

  **What this Procedure Cannot Do:**
  1.  **Resolve Value Disputes:** It determines identity, not market worth. A "new" accessioned object (Case A running clock) may be worth more than the "original" parts.
  2.  **Override Legal Title:** If a donor restriction binds the number to the *displayed item* regardless of material, the Procedure must yield to Legal Counsel (Referral Q7).
  3.  **Classify Digital/Software Art:** The "Material/Functional" binary fails for code-based works where "original" media is inherently obsolete.
  4.  **Force Consensus:** Curators may disagree on Q1 (Sortal). If the Historian says "Artifact" and the Conservator says "Functional Object," the Procedure halts at Q1. This is a **Judgement Call**.

  **The Hard Truth:**
  Identity is not a fact discoverable by caliper or scale. It is a status we confer. This procedure forces us to admit when we are conferring it on a new entity. Where the procedure dictates "Close Record," it does not mean the object is worthless; it means the *history* we are cataloguing has branched. We must choose which branch carries the legacy number. Usually, we choose the branch that serves the mission, but we must record that we have chosen.

  **Signed:** ___________________________________ (Head of Collections Care)
  **Date:** ____________________________________
