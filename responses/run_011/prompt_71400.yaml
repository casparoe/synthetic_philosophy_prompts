  7.  **Refining the Philosophical Points:**
      *   *Hart's Core/Penumbra:* This is the direct counter to Premise 3. Hart admits the penumbra (where your argument holds) but insists on the core (where it fails).
      *   *Discretion:* Hart's concept of discretion is key. It's not "doing whatever they want" (nihilism) nor "finding pre-existing moral truth" (Natural Law). It's *interstitial legislation*.
