  9.  **Final Polish:** Ensure clear headings. Make sure the distinction between "validity" and "adjudication" is clear, as that's the heart of the Hart/Fuller debate. (Hart: Separation of law *as it is* from law *as it ought to be*. Fuller: Law *is* a purposive activity).

