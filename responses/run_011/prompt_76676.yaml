answer: |-
  The stone of the city sweated. It was always damp, exuding a thin brine that tasted of iron and old ash. Elias sat at the long table in the Hall of Whispers, the ledger open before him. The paper was thick, ragged-edged, stained with the same salt that crusted the window sills. For thirty years he had dipped the quill, making marks in columns of red and black. Red for the verdict given, black for the truth revealed by time.

  In the first decade of his keeping, the columns matched almost perfectly. A mark in red, a mark in black beside it. The Assize spoke, and the mountain obeyed. In the second decade, the black marks began to lag. A verdict of "Safe" would stand for ten years before a crack appeared, forcing a late black mark into the ledger. In the last ten years, the black marks were frequent, but the red columns grew taller. The Assize was speaking louder. The margins of their votes were widening. Ten years ago, the verdict on the western buttress passed by forty voices. Last year, the verdict on the aquifer pressure passed by three hundred. The certainty was growing. The accuracy was not.

  Elias dipped the quill. He did not know how to count what he saw. He only knew how to count marks. He looked at the ratio of the last thirty years compared to the faded ink of the previous century. The old ink showed a slow drift toward truth. The new ink showed a sharp drift toward unanimity, while the black marks of reality accumulated at the bottom of the page like sediment.

  Outside, the bell tolled. The Assize was convening.

  The Hall was carved from the caldera wall itself, a vast amphitheater facing the inner sea. Several hundred readers filled the benches. They were drawn by lot from the guilds: clerks with ink-stained fingers, pilots with sun-weathered skin, midwives, well-diggers. They wore the sash of their office, wool dyed the color of dried blood. They were not judges. They were readers. They read the cracks in the stone, the taste of the well water, the tremor in the ground.

  Elias sat in the gallery above, his ledger chained to the desk. He watched them settle. There was no tension in the room. There was a warmth, a hum of recognition. Neighbors greeted neighbors. A mason from the lower terraces leaned over to show a pilot a sketch of a fissure he had found. The pilot nodded, pulling a similar sketch from his own tunic. They compared lines. They smiled.

  "See," the mason said, his voice carrying in the quiet stone. "The angle is the same as the one near the market."

  "And the water taste?" the pilot asked.

  "Sweet," the mason said. "No sulfur."

  "Same in the cistern," the pilot replied. "It's settling. The pressure is easing."

  They passed the sketches around. A midwife showed a jar of water to a clerk. They held it to the light, judging the sediment. They spoke of the elders' teachings, of the old signs that meant stability. They quoted the same passages from the Charter. They drank from the same communal pitchers. As the hour wore on, their language smoothed out. The specific jargon of the guilds blended into a common tongue. The fissure was not a threat; it was a "breath." The water was not stagnant; it was "resting."

  Elias watched the likeness spread. It was a comfort to see them agree. It felt like safety. When a reader stood to speak, he did not bring new evidence; he brought confirmation of what the man before him had said. They were weaving a net of agreement, tight and fine. They felt the strength of the net. They did not feel that every strand came from the same spool.

  A young reader stood, a woman from the builders' guild. She held a scroll.

  "The signs point to stability," she said. "But the lower terraces are vulnerable regardless. I propose we amend the question. Instead of 'Will the shelf hold?', we ask: 'Shall we raise the seawall, abandon the lower terraces, or maintain the current course?'"

  A murmur ran through the room. It was a sensible question. It offered nuance.

  Elias stood. He was the Keeper of the Charter. His voice was dry, used to reading numbers rather than speaking to crowds.

  "The Charter forbids it," Elias said. "The question must admit exactly two answers. Yes or No. Will it hold, or will it not?"

  "Why?" the young reader asked. "Why limit our choices? If we can do more than just wait, why not ask?"

  "Because the city must move as one body," Elias said. "If the vote is split three ways, the masons do not know whether to build the wall or reinforce the terraces. If half build the wall and half reinforce the terraces, the resources are spent twice, and neither work is finished. If the vote is close, half the city prepares to flee and half prepares to stay. When the shelf moves, confusion kills faster than stone. We need a single direction. The binary vote forces a single path. It protects us from hesitation."

  The room nodded. It was practical. It was sound. The young reader sat down. The rule stood. It protected the city from the paralysis of choice, ensuring that whatever decision was made, it was made with full force. It did not protect the city from the decision being wrong.

  Then an older reader stood. He was a well-digger, his hands scarred from the rock. He had not spoken during the deliberation. He had listened.

  "I will vote No," he said.

  The room went quiet. A No vote meant the shelf would fail. It meant panic. It meant abandonment.

  "I have read the signs," the well-digger said. "The water is sweet. The cracks are quiet. By the old teachings, I should vote Yes. And I believe the shelf will hold. But I will vote No."

  "Explain," the Presiding Officer said.

  "My vote is a single mark," the well-digger said. "It only matters if the rest of you are wrong. If you are all right, my vote changes nothing. If you are all wrong, then the signs we are reading are lying to us. If the signs are lying to everyone, they are likely lying to me, too. So, in the only case where my vote counts—the case where the majority is mistaken—my own reading is untrustworthy. To vote Yes is to trust the signs. To vote No is to acknowledge that if the room is wrong, I am likely wrong with them. I vote No not because I know the shelf will fall, but because my vote cannot save us if the signs are false."

  It was shrewd. It was not cowardice. He was not fleeing responsibility; he was acknowledging the structure of the count. But the room did not see the structure. They saw dissent. They saw fear.

  "The signs are clear," the Presiding Officer said gently. "We have all seen them. We have all tasted the water. We are not separate eyes. We are one body."

  The well-digger sat. He did not argue. He knew the arithmetic of the room outweighed the arithmetic of his logic.

  The voting began. Slips of parchment were dropped into the urn. Elias watched from above. He did not need to count to know the result. He could see the faces. They were calm. They were certain. They had spent the morning telling each other they were safe, and now they were recording it.

  When the clerks emptied the urn, the count was read aloud. Three hundred and twelve Yes. Four No. The four included the well-digger and three others who had not spoken.

  The hall exhaled. The relief was physical. Shoulders dropped. Hands clasped. The near-unanimity was not a warning; it was a benediction. To the readers, the margin proved the truth. If they had been unsure, there would have been debate. If the signs were ambiguous, the vote would be split. The fact that they all agreed meant the signs must be clear. They did not see that they had all read the same page. They did not see that the page was blank.

  Elias looked down at his ledger. He opened a fresh page. He wrote the date. He wrote the question: *Shelf Stability, Cycle 42.* He wrote the count: *312 Yes, 4 No.*

  He looked at the column of red marks. They were dense, heavy with ink. He looked at the black marks from the previous thirty years. They were creeping closer to the present. The aquifer was drained. The vents were bored. The mountain was blind, and the city was blind to the mountain. The signs were noise, random flickers in the dark. When the voters are better than chance, the crowd is an oracle. When they are worse, or when they are merely copying one another, the crowd is a machine for manufacturing error with high confidence.

  He knew he could not prove it. To prove it, he would need more cycles. He would need to see the shelf fall, or stand. He would need to see the black marks confirm the red, or contradict them. But the vote was cast. The authority was spent. The city would not reinforce the walls. They would not abandon the terraces. They would stay, confident in the count.

  Elias dipped the quill. He made a mark in the red column. He did not make a mark in the black column. Not yet. The truth required twenty years to mature. He would be dead before the black mark could be laid. He would be dead before the shelf proved the ledger right or wrong.

  He closed the book. The leather creaked. Outside, the tide was low. The shelf groaned, a deep, tectonic sound that vibrated through the floor of the Hall. It sounded like a settling stone. It sounded like a breaking bone. There was no way to tell the difference from inside the room.

  Elias blew on the ink to dry it. He placed the ledger in the iron chest and locked it. He walked out into the brine air. The sun was setting over the caldera rim, casting long shadows across the water. The city lights flickered on, hundreds of them, reflecting on the tide. They looked like stars. They looked like a single, solid mass of light, unmoving and permanent.

  He walked home. He would eat. He would sleep. He would return tomorrow to tally the minor reports from the guilds. He would add more marks. He would watch the ratio drift. He would wait for the truth to arrive, knowing it might arrive all at once, in a single night, washing the marks away before he could check them.

  The bell tolled again, signaling the end of the session. The sound rolled over the water, echoing off the volcanic walls. It sounded like a verdict. It sounded like a warning. It sounded exactly the same.
