prompt: |-
  I chair the Methods Committee of a national review panel that supplies the quantitative safety case for a proposed deep geologic repository for spent nuclear fuel. Seven appointed experts — two hydrogeologists, a corrosion chemist, two seismologists, a statistician, and a structural engineer — must produce one figure: the probability that radionuclide release to the accessible environment exceeds the regulatory threshold at some point in the next ten thousand years. Our statute is demanding in two ways at once. It requires a single number with a documented pedigree, not a range. It also requires that panelists work from one public data record and disclose to each other everything their estimate relies on, so no one can claim to have had access to evidence the others lacked.

  We are deadlocked on procedure for the coming cycle. In the last cycle, after three rounds of full exchange, two panelists remained a factor of thirty apart, and the residue was not evidential: both had seen and accepted the same data, and both models reproduce that data about equally well. They disagree about how to treat quantities nobody has ever observed — fracture connectivity in the host rock, corrosion behavior on millennial timescales — and each characterizes the other's treatment as an assumption, not a finding. One member of the committee, a game theorist, wants to write a "disagreement screen" into the charter. His reasoning is that rational agents who share all relevant information and know one another to be rational cannot stay at odds, which he takes to be Aumann's agreement theorem; therefore a panelist who still differs after complete exchange has either concealed something or is not updating honestly, and that panelist's estimate should be reported to the board as "non-responsive" and set aside. He offers a remedy for the assumption dispute: we stipulate a common prior over the contested parameters in the charter itself, in advance, so that any surviving gap can only reflect bad faith. The rest of us lean the other way — independent anonymous elicitation, then an aggregation rule, with the spread reported to the board rather than suppressed — but we cannot settle on the rule. Our statistician notes that when estimates span orders of magnitude an arithmetic average is effectively decided by the highest of them and a geometric average by the lowest, so the choice of pooling rule quietly decides the license; she also prefers the geometric version on the grounds that it is the only one that behaves sensibly when the panel later updates on data everyone shares.

  Please draft the memo I will circulate to the committee before our next meeting. It should recommend a protocol — one of the two, or a specified hybrid with the division of labor made explicit — and it should be usable: what the panel does in session, in what order, what appears in the report to the board, and, if any screen survives at all, what it looks like as criteria a chair can actually apply to a live disagreement. Engage the game theorist's argument rather than waving it off: state precisely what his result requires of the agents it applies to, whether our panel's situation satisfies those requirements once the statute's full-disclosure mandate is taken into account, and whether a prior written into a charter by fiat can be the sort of prior the result is about, given that the panelists in question do not actually hold it. Then give the strongest honest case for the protocol you reject. Our legislative oversight committee has already reprimanded us once for reporting ranges, on the ground that a range lets the board select whichever end suits the political weather, and there is a genuine accountability argument that the public is owed one number that an identifiable expert will stand behind in a hearing. I need to know whether that argument defeats your recommendation, and if it does not, what in the recommended protocol answers it. I am not looking for references or a survey of the literature; I need the reasoning and the procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**

      *   **Role:** Chair of the Methods Committee of a national review panel.
      *   **Task:** Draft a memo to the committee (7 experts: 2 hydrogeologists, 1 corrosion chemist, 2 seismologists, 1 statistician, 1 structural engineer) regarding the procedure for producing a single probability figure for radionuclide release over 10,000 years.
      *   **Context:**
          *   Statute requires a *single number* with documented pedigree (no ranges).
          *   Statute requires full data disclosure (one public record, no private evidence).
          *   Previous cycle deadlocked: Two panelists differed by a factor of 30 despite shared data/models. Disagreement stems from unobservable parameters (fracture connectivity, long-term corrosion).
          *   **Conflict:**
              *   *Game Theorist's Proposal:* Use Aumann's Agreement Theorem. Implement a "disagreement screen." If experts disagree after full exchange, one is acting in bad faith/non-responsive. Stipulate a common prior in the charter to force agreement. Report dissenters as "non-responsive."
              *   *Majority/Statistician's Lean:* Independent anonymous elicitation + aggregation rule. Statistician prefers geometric mean (handles orders of magnitude better, coherent updating).
              *   *Constraint:* Oversight Committee reprimanded them for reporting ranges previously (political cherry-picking risk). Public accountability demands one number an expert can stand behind.
      *   **Requirements for the Memo:**
          *   Recommend a protocol (Option A, Option B, or Hybrid).
          *   Make it usable (session order, report content, screen criteria if any).
          *   Engage the Game Theorist's argument seriously (Aumann's theorem conditions, common prior feasibility).
          *   Give the strongest honest case for the rejected protocol (specifically the accountability/single-number argument).
          *   Address whether the accountability argument defeats the recommendation.
          *   No references/literature survey; focus on reasoning and procedure.

  2.  **Deconstruct the Game Theorist's Argument (Aumann's Agreement Theorem):**

      *   *Theorem:* Rational agents with common priors and common knowledge of each other's posteriors cannot agree to disagree.
      *   *Conditions:*
          1.  Common Priors: Everyone starts with the exact same probability distribution before seeing private data.
          2.  Common Knowledge of Posteriors: Everyone knows everyone else's estimate, and knows that everyone knows, etc.
          3.  Rationality/Bayesian Updating: Everyone updates strictly according to Bayes' rule.
          4.  Partition of Information State: Agents know *what* information the other has.
      *   *Application to Panel:*
          *   *Data:* Shared (Statute mandates this). So "private information" isn't the issue.
          *   *Priors:* The Game Theorist wants to *stipulate* a common prior in the charter.
          *   *Problem:* A stipulated prior is not a *held* prior. Experts have different mental models (hydrogeology vs. corrosion). Forcing a mathematical prior doesn't align their cognitive belief structures. If they don't *actually* share the prior, the theorem doesn't apply.
          *   *Rationality:* Disagreement on unobservables (fracture connectivity) isn't necessarily irrationality; it's model uncertainty or deep ambiguity. Treating this as "bad faith" is dangerous.
          *   *Conclusion:* The "disagreement screen" is theoretically unsound in this context and practically toxic (will cause resignations or dishonest compliance).

  3.  **Deconstruct the Aggregation/Statistician's Argument:**

      *   *Method:* Independent elicitation + Aggregation (Geometric Mean preferred).
      *   *Pros:* Respects epistemic diversity, handles orders of magnitude better (log-normal nature of risk), mathematically coherent for updating.
      *   *Cons:* Produces a "committee number" no single individual owns. Oversight Committee hates this (accountability vacuum).
      *   *Constraint:* Statute says "Single Number," Oversight says "No Ranges." Aggregation gives a single number, but the *pedigree* is the spread. If we hide the spread, we hide the uncertainty. If we show the spread, Oversight might complain it's effectively a range.
      *   *Refinement:* We need a single number *and* an accountable owner.

  4.  **Develop the Recommended Protocol (The Hybrid Approach):**

      *   *Why Hybrid?* Pure aggregation fails the accountability test (no one owns the geometric mean). Pure "designated expert" fails the diversity test (ignores 6 other experts). The Game Theorist's screen is invalid.
      *   *Structure:*
          1.  **Phase 1: Independent Elicitation.** (Preserves independence).
          2.  **Phase 2: Structured Exchange.** (Satisfies the "common knowledge" attempt without the coercion).
          3.  **Phase 3: Re-elicitations.** (Allows updating).
          4.  **Phase 4: Aggregation with Attribution.** (The key innovation).
      *   *Addressing the Single Number:* Use the Geometric Mean as the official number (statistical robustness).
      *   *Addressing Accountability:* Assign a "Rapporteur" role on rotation or by vote who defends the *process* and the *result*, even if it's not their personal estimate. OR, require the final number to be signed by the Committee Chair (me), based on the aggregated result.
      *   *Better Idea for Accountability:* The statute says "one number with a documented pedigree." The Oversight Committee wants someone to stand behind it. The *Committee* stands behind it. But to satisfy the "identifiable expert" demand, we designate a **Lead Assessor** for the cycle. They don't dictate the number, but they are the signatory responsible for verifying the aggregation protocol was followed.
      *   *Addressing the Game Theorist:* We will include a "Consistency Check" but not a "Disagreement Screen." The check verifies procedural compliance (did you update? did you hide data?), not epistemic alignment.
      *   *Addressing the Prior:* We explicitly reject the stipulated prior. We acknowledge different mental models are features, not bugs.

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** Acknowledge the deadlock and the stakes. State the purpose: define the protocol for Cycle 4.
      *   **Analysis of the Game Theorist's Proposal:**
          *   Respect the logic.
          *   Dismantle the applicability. Aumann requires *actual* common priors, not *stipulated* ones. Experts have different training (hydro vs. corrosion). A charter clause cannot overwrite cognitive architecture.
          *   Risk: Labeling dissent as "bad faith" destroys the panel's integrity.
      *   **Analysis of the Aggregation Proposal:**
          *   Accept the Statistician's math (Geometric Mean).
          *   Acknowledge the Oversight Committee's concern (Accountability).
      *   **The Recommendation (The "Attributed Aggregation" Protocol):**
          *   Step 1: Anonymous Elicitation.
          *   Step 2: Model Walkthrough (Focus on assumptions, not data).
          *   Step 3: Second Elicitation.
          *   Step 4: Calculation (Geometric Mean).
          *   Step 5: Sign-off (Committee Chair + Rotating Lead Assessor).
      *   **Addressing the "Single Number" Constraint:**
          *   We provide one number.
          *   The "Pedigree" documents the spread without making it a "range" for decision-making. It explains *why* the number is what it is.
          *   Accountability is vested in the *process certification*, not personal belief in the specific digit.
      *   **The "Screen":** Replace "Disagreement Screen" with "Procedural Compliance Audit." Did they hide data? Did they refuse to update? (Hard to prove, so focus on data hiding).
      *   **Closing:** Call for adoption.

  6.  **Refining the Argumentation (Self-Correction during drafting):**

      *   *Critique:* Is the Geometric Mean defensible to Oversight?
      *   *Fix:* Yes, if framed as the "consensus expectation" rather than an average of opinions. It minimizes the influence of outliers (both high and low) in log-space, which fits risk probability.
      *   *Critique:* Does this satisfy the "identifiable expert" requirement?
      *   *Fix:* The memo must clarify that the *Chair* signs the number as the product of the Committee's method. The "identifiable expert" is the Committee as a corporate body, represented by the Chair. If Oversight wants a scapegoat, the Chair is it. This protects the members from being fired for "non-responsiveness."
      *   *Critique:* Did I engage the Game Theorist enough?
      *   *Fix:* Need to be very precise about "Common Priors." A stipulated prior is a *fiction*. Aumann's theorem collapses if priors differ. Since our experts *do* differ in training, they *do* have different priors. Forcing a prior is perjury of belief.
      *   *Critique:* The Oversight Committee reprimanded ranges.
      *   *Fix:* We must ensure the report contains *one number*. The spread goes in the "Pedigree/Methodology" appendix, not the "Finding" section. The Finding is the Geometric Mean. The Pedigree explains the uncertainty. This distinguishes a "finding with context" from a "range of findings."

  7.  **Final Polish:**

      *   Tone: Authoritative, collegial, precise, decisive.
      *   Formatting: Clear headings.
      *   Check against all constraints: No literature survey, focus on reasoning/procedure, address the accountability argument.

  8.  *(Final Review of the "Accountability" point)*: The prompt asks: "I need to know whether that argument defeats your recommendation, and if it does not, what in the recommended protocol answers it."
      *   *Answer:* It does not defeat the recommendation. The protocol answers it by vesting accountability in the *Chair's certification of the process* rather than an individual's *belief in the value*. The "identifiable expert" is the Chair acting for the Committee. This satisfies the statute (one number) and Oversight (someone to grill) without forcing false consensus.

  9.  *(Final Review of the "Game Theorist" point)*: Ensure I explain *why* a charter prior fails. It's not a belief state. Aumann requires the prior to be the *actual* starting point of the probability assessment. A legal fiction doesn't count as a probability state in the brain.

  10. **Drafting the content.** (Proceed to generate output based on these thoughts).

      *   *Wait, one nuance:* The prompt says "One figure... documented pedigree." Oversight reprimanded "reporting ranges."
      *   *Solution:* The report has one figure. The pedigree describes the variance. This is not a range *for decision making*, it is a characterization of the *confidence* in the single figure. I need to make this distinction sharp.

      *   *Wait, another nuance:* The Game Theorist wants to report dissenters as "non-responsive."
      *   *Solution:* My protocol must explicitly reject this. It creates a perverse incentive to conform rather than be accurate.

      *   *Wait, the Statistician:* She prefers Geometric Mean. I should adopt this but explain *why* it serves the accountability goal (it's more robust/defensible than arithmetic).

      *   *Wait, the "Screen":* I need to offer *some* screen, as requested ("if any screen survives at all").
      *   *Solution:* A "Procedural Compliance Screen." Did you disclose all data? Yes/No. If No -> Non-responsive. If Yes -> You are allowed to disagree.

      *   *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Methods Committee, National Review Panel
  **FROM:** Chair, Methods Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Protocol for Cycle 4 Probability Elicitation and Reporting

  **1. Purpose**

  We are deadlocked on the procedure for generating the Cycle 4 safety case probability. The statute requires a single number with a documented pedigree. The Oversight Committee has forbidden the submission of ranges, citing political cherry-picking risks and the need for public accountability. Internally, we are divided between a "disagreement screen" based on epistemic game theory and an aggregation model based on statistical robustness.

  This memo establishes the protocol for the coming cycle. It rejects the proposed "disagreement screen" as theoretically inapplicable and practically dangerous. It adopts a modified aggregation procedure that satisfies the statutory requirement for a single number while preserving the integrity of dissenting expert judgment. It further defines the accountability mechanism required by the Oversight Committee.

  **2. Analysis of the "Disagreement Screen" Proposal**

  The proposal to invoke Aumann's Agreement Theorem to screen out dissenting panelists rests on a misapplication of the theorem to our specific constraints. While the logic is sound in the abstract, it fails in this context for three specific reasons.

  *   **The Common Prior Requirement:** Aumann's theorem holds only if agents share a *common prior*—an identical probability distribution over the state of the world before receiving private information. The proposal suggests we stipulate this prior in the charter. A charter clause cannot create a cognitive reality. Our panelists possess different training (hydrogeology vs. corrosion chemistry); their mental models for unobservable parameters (fracture connectivity, millennial corrosion) are fundamentally different. These differences constitute different priors. Forcing a stipulated prior does not align their actual belief states; it merely forces them to lie about their starting assumptions. If the priors are not *actually* common, the theorem does not apply, and disagreement remains rational.
  *   **The Definition of "Information":** The theorem assumes agents differ only due to private information partitions. Our statute mandates a single public data record, effectively equalizing information partitions. However, the disagreement in the last cycle was not about data, but about *model structure* and *parameterization* of unobservables. In deep time risk assessment, model uncertainty is not "private information" that can be exchanged; it is a structural feature of the problem. Rational agents with identical data can legitimately hold different posteriors if they weigh structural assumptions differently.
  *   **The Incentive Hazard:** Labeling a persistent dissenter as "non-responsive" or acting in "bad faith" creates a perverse incentive. It encourages panelists to converge artificially to avoid sanction, rather than to converge because the evidence compelled them. This degrades the quality of the safety case by suppressing legitimate epistemic diversity.

  **Conclusion:** We will not implement a disagreement screen based on epistemic alignment. A panelist who fully discloses their data and reasoning cannot be sanctioned for maintaining a different probability estimate.

  **3. Analysis of the Aggregation Proposal**

  The alternative is independent elicitation followed by aggregation. The Statistician correctly notes that when estimates span orders of magnitude, the arithmetic mean is dominated by the highest values, while the geometric mean is dominated by the lowest.

  *   **Statistical Defense:** For probability estimates of rare events spanning orders of magnitude, the distribution is typically log-normal. The geometric mean is the unbiased estimator for the central tendency of a log-normal distribution. Furthermore, the geometric mean is the only pooling rule that preserves external Bayesianity (i.e., if the panel updates on new shared data, the aggregated result is the same as if the individuals updated and then aggregated).
  *   **The Accountability Objection:** The Oversight Committee's reprimand regarding ranges is valid. A range allows the licensing board to select a value based on political expediency rather than scientific finding. However, their demand for an "identifiable expert" who will "stand behind" the number creates a conflict with aggregation. No single panelist believes the geometric mean; it is a mathematical artifact. If no one believes it, no one can honestly stand behind it in a hearing.

  **4. Recommended Protocol: Attributed Aggregation**

  To resolve this, we will adopt a hybrid protocol. We will use the geometric mean to generate the number, but we will vest accountability in the *certification of the process* rather than personal belief in the specific digit.

  **Phase 1: Independent Elicitation (Anonymous)**
  *   **Action:** Prior to the first session, all seven panelists submit their probability estimates and a brief technical memo justifying their treatment of unobservable parameters (fracture connectivity, corrosion rates).
  *   **Constraint:** Memos must reference only the public data record. No external citations.

  **Phase 2: Structured Exchange (The "Model Walkthrough")**
  *   **Action:** In session, we do not debate the *numbers*. We debate the *memos*. Each panelist has one hour to walk the committee through their treatment of unobservables.
  *   **Goal:** To ensure "common knowledge of posteriors." Everyone must understand *why* the others hold their estimates, even if they do not accept them.
  *   **Record:** All questions and answers are transcribed into the public record.

  **Phase 3: Re-elicitations**
  *   **Action:** Following the walkthrough, panelists submit a second, final estimate. They may update based on the exchange, or they may hold firm.
  *   **Requirement:** If an estimate does not change, the panelist must submit a one-page statement explaining why the exchange did not compel an update. This satisfies the "rational updating" check without mandating agreement.

  **Phase 4: Aggregation and Certification**
  *   **Calculation:** The Committee Staff will calculate the **Geometric Mean** of the seven final estimates. This is the **Official Finding**.
  *   **Reporting:** The report to the Board will contain *one number*.
  *   **Pedigree:** The accompanying documentation will include the distribution of the seven estimates (min, max, variance) as a "Confidence Characterization," not as a "Range of Findings." This distinguishes scientific uncertainty from decisional flexibility.
  *   **Accountability:** The **Chair of the Methods Committee** will sign the Official Finding.
      *   *Rationale:* The Oversight Committee requires an identifiable expert to answer for the number. As Chair, I am responsible for the integrity of the method that produced the number. I will stand behind the *process* as scientifically valid, even if the specific number is an aggregate. This protects individual panelists from being fired for "non-responsiveness" while giving the Board a single witness to summon.

  **5. The Procedural Screen**

  We will retain a screen, but it will be procedural, not epistemic.

  *   **Criteria for "Non-Responsive" Status:** A panelist's estimate will be excluded from the aggregation *only if*:
      1.  They fail to submit the required technical memo referencing the public data record.
      2.  They refuse to participate in the Model Walkthrough.
      3.  Evidence emerges that they relied on private data not in the public record.
  *   **Exclusion of Dissent:** Disagreement with the majority, or refusal to update an estimate after the walkthrough, is **not** grounds for exclusion.

  **6. Addressing the Accountability Argument**

  The Oversight Committee's argument is that a range permits political manipulation, and the public is owed a single number an expert will defend.

  *   **Does this defeat the recommendation?** No.
  *   **Why:** The recommendation provides a single number (the Geometric Mean). It prevents political manipulation because the Board is not given a menu of options; they are given a finding derived from a fixed formula.
  *   **The "Stand Behind" Requirement:** The protocol answers the accountability demand by designating the Chair as the responsible officer. In a hearing, the question will not be "Do you personally believe the probability is exactly 1.4 x 10^-5?" The question will be "Is this the valid output of the congressionally mandated method?" The Chair answers "Yes." This shifts the testimony from personal belief (which is vulnerable to the factor-of-thirty dispute) to methodological certification (which is robust).

  **7. Next Steps**

  At the next meeting, we will vote to adopt this protocol. If adopted, Staff will draft the Charter Amendment to reflect the "Procedural Screen" and the "Geometric Mean Aggregation" rule. We will then proceed to Phase 1 elicitation.

  This approach respects the statute, satisfies the Oversight Committee's demand for a single accountable figure, and preserves the scientific integrity of the panel by acknowledging that rational experts may disagree on the unobservable.

  **Chair, Methods Committee**
