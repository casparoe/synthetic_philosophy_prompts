answer: |-
  ### The Specification for a Dual-Purpose Anthropocene Boundary

  To satisfy both the International Commission on Stratigraphy (ICS) and historical periodisation, a proposal must meet a rigorous set of functional requirements. These are not matters of taste but logical necessities derived from the conflicting epistemologies of geology (rock time) and history (human time).

  **1. Correlatability across Reservoirs**
  *   **Requirement:** The marker must appear in at least two independent stratigraphic archives (e.g., ice cores and marine sediments, or peat bogs and speleothems).
  *   **Consideration:** A single archive risks local noise or diagenetic alteration. For the ICS, this ensures the boundary is not an artefact of preservation; for the historian, it ensures the phenomenon was systemic, not regional.

  **2. Accommodation of Diachrony**
  *   **Requirement:** The specification must distinguish between the *onset of the process* (diachronous) and the *definition of the boundary* (ideally isochronous).
  *   **Consideration:** Human impact spread unevenly. A boundary that demands synchronous impact globally excludes the reality of colonial expansion and industrialisation. A boundary that accepts total diachrony fails the ICS rule for a Global Boundary Stratotype Section and Point (GSSP). The specification must allow a synchronous marker to *represent* a diachronous process.

  **3. Signal Distinctiveness (The 'Golden Spike' Criterion)**
  *   **Requirement:** The marker must provide a sharp, unambiguous horizon distinguishable from Holocene background variability.
  *   **Consideration:** Without a sharp signal, the boundary cannot be mapped in the field (ICS requirement). Without distinctiveness, the historian cannot claim a qualitative shift in the human-earth relationship.

  **4. Handling of Negative Markers**
  *   **Requirement:** The protocol must allow for a marker defined by the *absence* of a biological or chemical signal (e.g., a drop in CO₂ due to reforestation).
  *   **Consideration:** Human influence is not always additive; it is often defined by removal (extinction, land clearance). A specification requiring only positive accumulation (plastics, radionuclides) biases the definition towards the industrial era.

  **5. Separation of Cause and Effect**
  *   **Requirement:** The boundary must be fixed by a physical effect (the strata), not the socio-political cause (the invention of the steam engine).
  *   **Consideration:** Stratigraphy records what happened to the Earth, not why. Conflating the two renders the unit vulnerable to revision as historical interpretations change.

  **6. Consistency with Existing Chronologies**
  *   **Requirement:** The boundary must not contradict established datums in ice-core chronologies or radiocarbon calibration curves.
  *   **Consideration:** Specifically, it must accommodate the 1492 demographic collapse in the Americas (the 'Orbis Spike') without rendering it stratigraphically invisible, even if it is not chosen as the primary boundary.

  **7. Durability**
  *   **Requirement:** The marker must be preserved for geological timescales (millions of years).
  *   **Consideration:** Plastics may degrade; radionuclides decay. If the marker disappears, the epoch becomes unrecognisable to future geologists, violating the purpose of chronostratigraphy.

  ***

  ### The SQS Rejection: Which Desideratum Failed?

  In March 2024, the Subcommission on Quaternary Stratigraphy (SQS) rejected the Anthropocene Working Group's (AWG) proposal for Crawford Lake. While the vote was complex, the primary failure was not the *date* (mid-20th century) but the **unit status**.

  The SQS determined that the Anthropocene satisfies the criteria for a **geological event**, not an **epoch**. An epoch implies a duration of significant length and a fundamental shift in the Earth System comparable to the Pleistocene or Holocene. The SQS judged the post-1950 signal as too short and too trivial in the context of deep time to warrant epoch status. Furthermore, the reliance on radionuclides (plutonium-239) was criticised for being a marker of *detectability* rather than *onset of influence*. The rejection highlights a failure in **Requirement 5 (Separation of Cause and Effect)**: the AWG selected a marker that signified a specific cultural moment (the Great Acceleration) rather than the earliest stratigraphically viable evidence of human impact.

  ***

  ### Non-Negotiables vs. Parochial Commitments

  To proceed, we must separate the structural necessities from the tribal demands of the interested parties.

  | **Non-Negotiables (Structural)** | **Parochial Commitments (Tribal)** |
  | :--- | :--- |
  | **Physical Preservation:** The marker must exist in the rock/ice record. | **Global Synchronicity:** Geologists often demand perfect isochrony, ignoring that human processes are inherently diachronous. |
  | **Correlatability:** The signal must be findable in multiple locations. | **Attribution of Responsibility:** Historians and activists often demand the date pinpoints *culpability* (e.g., colonialism vs. industrialisation). |
  | **Distinctiveness:** The boundary must be sharper than background noise. | **Pointability:** The movement needs a date simple enough for a slogan, which often oversimplifies the stratigraphic reality. |
  | **Consistency:** Must not break existing geological timescales. | **Cultural Resonance:** The desire for the date to align with political narratives (e.g., capitalism, slavery, technology). |

  ***

  ### Stress-Testing Your Requirement: "Observable from the Inside"

  **Your Requirement:** *The boundary must have been observable from the inside, by people living through it, rather than being a signal legible only to instruments that did not yet exist.*

  **Analysis:**
  This requirement privileges the historical experience over the stratigraphic record. It demands that the *phenomenology* of the boundary matches the *geology* of the boundary.

  **Does it survive?**
  It survives as a historical filter but fails as a stratigraphic constraint.
  1.  **Exclusion of Instrumental Markers:** It immediately disqualifies the AWG's Crawford Lake proposal. While people in the 1950s saw mushroom clouds, they could not observe the plutonium-239 horizon settling in lake varves. That signal is legible only to post-hoc instrumentation.
  2.  **Exclusion of Chemical Shifts:** It disqualifies the 1610 'Orbis Spike' (CO₂ drop). No one in 1610 measured atmospheric carbon. They observed death and reforestation, but not the stratigraphic marker itself.
  3.  **Inclusion of Visible Pollution:** It favours the early Industrial Revolution (~1800). Soot, smog, and river contamination were visible and commentated upon contemporaneously (e.g., William Blake's "dark satanic mills", 1804).

  **Verdict:**
  This requirement is robust for *historical periodisation* but destructive for *chronostratigraphy*. Stratigraphy is inherently retrospective; it relies on tools to read what the past could not read of itself. By enforcing contemporaneous observability, you convert the boundary from a geological horizon into a cultural one. It excludes the 1950s (as a geological definition) and 1610, leaving only the Industrial Revolution or later as viable candidates where the *physical degradation* was visible, even if the *global scale* was not.

  ***

  ### The Incompatibility of Attribution and Method

  Your suspicion is correct: **Attribution (meaning) and Stratigraphic Method (rock authority) are jointly unsatisfiable.** This is not merely a political deadlock but a categorical error.

  **The Demonstration:**
  1.  **Stratigraphic Authority:** The ICS has authority over rock. Its rules (International Chronostratigraphic Guide) dictate that boundaries are defined by physical changes in the Earth System (e.g., isotope ratios, fossil assemblages). It has no mechanism to encode *intent* or *blame*. A radionuclide spike is a physical fact; the decision to test bombs is a human act. The rock records the former, not the latter.
  2.  **Historical Attribution:** To assign responsibility (e.g., "Capitalism began here" or "Colonialism became global here"), one must interpret the rock through a cultural lens. This interpretation is mutable. Future historians may disagree on whether 1610 represents 'genocide' or 'ecological recovery'.
  3.  **The Conflict:** If the ICS formalises a boundary based on a marker chosen for its *attributional value* (e.g., choosing 1610 to highlight colonialism), they violate their own rule that boundaries must be defined by the *optimal stratigraphic signal*, not the optimal moral narrative. Conversely, if they choose the optimal signal (1950s plutonium), it carries little inherent moral weight compared to earlier dates, frustrating the historians.

  **The Result:** A body with authority over rock has no authority over meaning. When the AWG attempted to bind the two, the SQS rejected the *epoch* status. They effectively ruled that while the *impact* is real, the *narrative* of the Anthropocene is not a stratigraphic problem.

  **A More Modest Purpose:**
  If we abandon the quest for a formal *Epoch* (which implies duration and rock status) and adopt the status of an **Event** (like the 'Cambrian Explosion' or 'Paleocene-Eocene Thermal Maximum'), the tension dissolves.
  *   **Event Stratigraphy:** Allows for a diachronous onset.
  *   **Informal Unit:** Removes the need for a single GSSP 'Golden Spike'.
  *   **Dual Dating:** Allows geologists to use the radionuclide horizon for correlation while historians use 1492 or 1750 for causation, without forcing them to be the same number.

  ***

  ### The Single Eliminating Requirement

  The single requirement that eliminates the most candidates is: **"Global Synchronicity of a Stratigraphically Distinct Marker."**

  *   **Why:** Human impacts are fundamentally diachronous. Agriculture began at different times; industrialisation spread unevenly. To find a signal that is both *globally synchronous* and *stratigraphically sharp* forces you to look for atmospheric or nuclear signals.
  *   **Elimination:**
      *   **Mid-Holocene:** Fails (diachronous, no sharp global marker).
      *   **1610:** Fails (CO₂ drop is global but the demographic cause is diachronous; the signal is subtle).
      *   **~1800:** Fails (Soot is diachronous; CO₂ rise is gradual, not a spike).
      *   **1950s:** Passes (Plutonium is synchronous and sharp).

  However, if we add the ICS requirement for **"Significance sufficient for Epoch Status"**, the 1950s also fails (too short). Thus, the combination of **Synchronicity + Epoch Significance** eliminates *all* candidates, which explains the 2024 rejection.

  ***

  ### Candidate Scoring Table

  The following table scores the four primary candidates against the consolidated specifications.
  *Scale: 0 (Fails completely) to 3 (Meets requirement fully).*

  | Requirement | Mid-Holocene (~5000 BP) | 1610 (Orbis Spike) | ~1800 (Industrial) | 1950s (Great Acceleration) |
  | :--- | :---: | :---: | :---: | :---: |
  | **Global Synchronicity** | 0 | 1 | 1 | 3 |
  | **Stratigraphic Distinctiveness** | 1 | 2 | 2 | 3 |
  | **Onset of Major Influence** | 3 | 2 | 3 | 0 (Too late for *onset*) |
  | **Observable from Inside** | 0 | 0 | 3 | 1 (Visible smog, invisible nuclides) |
  | **Handles Absence (Negative Markers)** | 0 | 3 | 0 | 0 |
  | **ICS Epoch Viability** | 1 | 1 | 1 | 0 (Rejected as too short) |
  | **Historical Attribution Clarity** | 1 | 3 | 2 | 2 |
  | **Total Score** | **6** | **12** | **12** | **9** |

  **Conclusion:**
  The table demonstrates the impasse. 1610 and 1800 score highest on historical and processual grounds but fail the strict geological demand for synchronicity. The 1950s scores highest on geological technicalities but fails the historical demand for 'onset' and 'observability'. The Mid-Holocene is geologically plausible as a transition but lacks the sharpness required for a boundary.

  The SQS rejection confirms that no single date can satisfy the dual mandate. The specification you requested reveals that the 'Anthropocene' functions better as a pluralistic concept than a singular rock unit. To formalise it is to break it; to keep it useful is to keep it informal.
