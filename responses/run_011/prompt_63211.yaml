      *   *Let's try a "Token" system.* Each box contains a set of tokens.
      *   *Notation:* `L1: (●)`, `L2: (▲)`, etc.
      *   *Okay, let's standardize:*
          *   Shapes: `○` (Circle), `□` (Square), `△` (Triangle), `|` (Line).
