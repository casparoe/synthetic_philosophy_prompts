          *   Phase 3: Vocabulary Freeze (closed predicate lists). Some become trivial, some impossible. Students notice vocabulary openness matters.
      *   **Deliverables:** Run sheet, Notation system, 5 Original Problems (with rules, held-out, rivals, solver heuristic), Phase 3 Predicate Lists, Debrief Questions, Troubleshooting (including the "unfair" objection), Closing Reflection.

  2.  **Deconstruct Phase 2 (The Adversary Mechanic):**
