answer: |-
  # 1. Run Sheet (100 Minutes)

  | Time | Phase | Activity | Materials |
  | :--- | :--- | :--- | :--- |
  | **00–05** | **Setup** | Students seat themselves (6 tables of 3). Distribute **Phase 1 Packets** (Cards 1–5, blank answer sheets). Explain the "Naive Scoring" (1 pt per card, speed bonus). | Packets, Pens |
  | **05–25** | **Phase 1** | **Naive Induction.** Tables solve as many cards as possible. Rules must fit all 12 boxes. Submit sheets to front. | Answer Sheets |
  | **25–30** | **Transition** | Collect Phase 1 sheets. Distribute **Phase 2 Packets** (Held-out boxes, Adversary briefs). Pair tables (1↔2, 3↔4, 5↔6). | Envelopes |
  | **30–60** | **Phase 2** | **Adversarial Validation.** Reveal held-out boxes. Tables swap packets with their pair. Adversaries attempt to construct a rival rule that fits the 12 but sorts the held-out box oppositely. Scoring updated. | Whiteboards |
  | **60–65** | **Transition** | Collect Phase 2 materials. Distribute **Phase 3 Cards** (Same 5 problems, new Predicate Lists). | Predicate Cards |
  | **65–85** | **Phase 3** | **Vocabulary Freeze.** Tables attempt to rewrite their rules using *only* the provided list. Some will find it trivial, others impossible. | Predicate Cards |
  | **85–100** | **Debrief** | Guided discussion (see Section 5). No resolution of the "unfairness" objection; leverage it. | Whiteboards |

  ---

  # 2. Notation System

  To allow typesetting without images, we use a **Shape-Attribute Code**. Each box is described by one line. Students parse this as a visual description.

  **Legend:**
  *   **Shape:** `CI` (Circle), `SQ` (Square), `TR` (Triangle), `LN` (Line), `CR` (Cross), `AR` (Arrow).
  *   **Fill:** `O` (Open/Outline), `S` (Solid/Filled).
  *   **Orientation:** `U` (Up), `D` (Down), `L` (Left), `R` (Right), `N` (Neutral/None).
  *   **Count:** If multiple items exist in one box, they are comma-separated.

  **Card Format:**
  ```text
  CARD [ID]
  LEFT SIDE (L)          | RIGHT SIDE (R)
  L1: [Code]             | R1: [Code]
  L2: [Code]             | R2: [Code]
  ...                    | ...
  L6: [Code]             | R6: [Code]

  HELD-OUT BOX (H): [Code] | INTENDED SIDE: [L or R]
  ```

  **Worked Example (Card 0):**
  ```text
  CARD 0
  LEFT SIDE (L)          | RIGHT SIDE (R)
  L1: CI-O-N             | R1: SQ-O-N
  L2: CI-O-N             | R2: SQ-O-N
  L3: CI-S-N             | R3: SQ-S-N
  L4: CI-O-N             | R4: TR-O-U
  L5: CI-S-N             | R5: LN-O-N
  L6: CI-O-N             | R6: CR-O-N

  HELD-OUT BOX (H): CI-S-N | INTENDED SIDE: [L]
  ```
  *(Intended Rule: Circles vs. Non-Circles. Rival: Curved Lines vs. Straight Lines.)*

  ---

  # 3. Five Original Problems

  ### Problem 1: The Topological Trap
  *   **Intended Rule:** Closed loops vs. Open lines.
  *   **Held-Out Box (H):** `LN-O-N` (A single wavy line). Intended Side: **Right**.
  *   **Rival Rule A:** Shapes with no corners vs. Shapes with corners. (Fits 12, sorts H to Left).
  *   **Rival Rule B:** Encloses white space vs. Does not enclose white space. (Fits 12, sorts H to Left).
  *   **Solver Heuristic:** Solvers lean on **visual continuity**. The "Closed" concept is gestalt-salient; "Corners" requires counting features that are ambiguous in hand-drawn-style text descriptions.

  ### Problem 2: The Relational Ambiguity
  *   **Intended Rule:** One shape contains another vs. Shapes are separate.
  *   **Held-Out Box (H):** `CI-O-N, SQ-O-N` (Circle and Square side-by-side). Intended Side: **Right**.
  *   **Rival Rule A:** Two shapes vs. One shape. (Fits 12, sorts H to Left if Left side has some single complex shapes). *Correction for consistency:* Let's say Left has `CI inside SQ`. Right has `CI next to SQ`.
      *   *Revised Rival A:* Touching vs. Not Touching. (If the "separate" shapes in the 12 examples happen to be close but not touching, a rival rule could be "Gap > 0").
      *   *Revised Rival B:* Same shape types vs. Different shape types.
  *   **Solver Heuristic:** Solvers lean on ** designer intent regarding spatial relations**. "Containment" is a stronger cognitive primitive than "proximity."

  ### Problem 3: The Numerical Underdetermination
  *   **Intended Rule:** Even number of elements vs. Odd number of elements.
  *   **Held-Out Box (H):** `TR-O-U, TR-O-U, TR-O-U` (3 Triangles). Intended Side: **Right** (Odd).
  *   **Rival Rule A:** Presence of Triangles vs. Absence of Triangles. (Fits 12, sorts H to Left).
  *   **Rival Rule B:** Symmetrical arrangement vs. Asymmetrical arrangement. (Fits 12, sorts H to Left).
  *   **Solver Heuristic:** Solvers lean on **counting salience**. If the numbers are small (1, 2, 3, 4), counting is immediate. If the rival rule requires checking symmetry, it is cognitively more expensive, so the number rule feels "simpler."

  ### Problem 4: The Orientation Bias
  *   **Intended Rule:** Pointing toward the center of the box vs. Pointing toward the edge.
  *   **Held-Out Box (H):** `AR-S-L` (Solid Arrow pointing Left, placed on Right side of box). Intended Side: **Left** (Points to Center).
  *   **Rival Rule A:** Pointing Left/Right vs. Pointing Up/Down. (Fits 12, sorts H to Right).
  *   **Rival Rule B:** Solid vs. Open. (Fits 12, sorts H to Right).
  *   **Solver Heuristic:** Solvers lean on **frame of reference**. They assume the box boundary is the relevant frame, not the global Up/Down axis.

  ### Problem 5: The Semantic Intrusion
  *   **Intended Rule:** Resembles a standard alphanumeric character vs. Abstract geometry.
  *   **Held-Out Box (H):** `LN-O-N, LN-O-N` arranged as a 'V'. Intended Side: **Left** (Letter-like).
  *   **Rival Rule A:** Acute angles vs. Obtuse/Right angles. (Fits 12, sorts H to Right).
  *   **Rival Rule B:** Two lines vs. Three lines. (Fits 12, sorts H to Right).
  *   **Solver Heuristic:** Solvers lean on **prior knowledge**. They recognize 'V' as a letter, overriding geometric properties. This reveals that "concepts" are not just in the data but in the solver's history.

  ---

  # 4. Phase-Three Predicate Lists

  For each problem, two lists are provided. **List A** makes the rule trivial to express. **List B** makes it impossible or excessively convoluted, forcing the realization that the *language* constrains the *thought*.

  *   **Problem 1 (Topological)**
      *   **List A (Trivial):** `{Closed, Open, Solid, Outline}`. (Direct mapping to intent).
      *   **List B (Impossible):** `{Straight, Curved, Vertical, Horizontal}`. (Cannot distinguish a closed circle from an open curved line without "Closed").
  *   **Problem 2 (Relational)**
      *   **List A (Trivial):** `{Inside, Outside, Touching, Separate}`. (Direct mapping).
      *   **List B (Impossible):** `{Large, Small, Center, Corner}`. (Describes position/size, not relation between two objects).
  *   **Problem 3 (Numerical)**
      *   **List A (Trivial):** `{One, Two, Three, Four, Even, Odd}`. (Direct mapping).
      *   **List B (Impossible):** `{Many, Few, Single, Group}`. (Too vague to distinguish 2 from 3 reliably).
  *   **Problem 4 (Orientation)**
      *   **List A (Trivial):** `{Inward, Outward, Up, Down}`. (Direct mapping).
      *   **List B (Impossible):** `{Left, Right, North, South}`. (Forces global coordinates, fails on "Inward" logic).
  *   **Problem 5 (Semantic)**
      *   **List A (Trivial):** `{Letter, Number, Symbol, Shape}`. (Direct mapping).
      *   **List B (Impossible):** `{Angle, Line, Curve, Vertex}`. (Geometric primitives cannot capture "Letter-ness" without a huge conjunction of rules).

  ---

  # 5. Debrief Questions

  Ask these in order. Do not answer them yourself; let the silence sit.

  1.  **Phase 1 Reflection:** "In Phase 1, Table 3 claimed 5 points. Table 4 claimed 5 points. You had the same data. Why did I allow both rules to stand initially?"
      *   *Target:* The space of candidate rules was never given to them; they assumed there was only one.
  2.  **Phase 2 Reflection:** "When the Adversary failed to find a rival rule for Card 2, Table 1 cheered. Why was that cheer premature?"
      *   *Target:* Finitly many examples underdetermine the rule. Failure of imagination ≠ Uniqueness of truth.
  3.  **Phase 3 Reflection:** "Table 2 solved Card 1 in ten seconds. Table 5 didn't finish Card 1 in ten minutes. The cards were identical. What changed?"
      *   *Target:* No fixed feature vocabulary survives contact with all cards. The openness of the descriptive vocabulary was doing real work.
  4.  **The Intent Question:** "On Card 5, many of you wrote 'Looks like a letter.' That is not a visual property of the ink. Where did that rule come from?"
      *   *Target:* Solving these puzzles is closer to guessing another person's intention than to reading a fact off the data.
  5.  **The Closing:** "If the data never forces a single rule, and the vocabulary limits what you can see, and the solution depends on guessing my intent... what exactly did you learn today?"

  ---

  # 6. Troubleshooting & Predictable Failures

  **1. The Fast Table (Idling after 90 seconds)**
  *   **Prediction:** One table will solve Card 1 immediately and sit bored while others struggle.
  *   **Handling:** In Phase 1, announce a "Meta-Bonus." "If you finish early, write down *two other rules* that fit the data but you rejected, and explain why." This forces them to engage with the underdetermination early, priming them for Phase 2.

  **2. The "Unfair" Objection**
  *   **Prediction:** A student will raise their hand in Phase 2 or Debrief and say, "This is unfair. You have the rule in your head. We can't possibly know it. The task is impossible."
  *   **Handling:** **Do not defend the fairness.** Validate the objection immediately.
      *   *Script:* "You are absolutely correct. The task *is* impossible if you view it as finding a logical truth. The data does not contain the rule. I wrote the rule before you walked in; it is arbitrary."
      *   *Pivot:* "So, if it's impossible to derive the rule from the data, why did Table 1 get it right? And why did Table 2's rival rule feel 'wrong' even though it fit the data? You didn't find the truth. You negotiated a convention. In cognitive science, this isn't a bug. It's the whole field. You are not mining data; you are modeling a mind."
      *   *Action:* Write "DATA < RULE < INTENT" on the whiteboard. Circle "INTENT". Leave it there for the rest of the session.

  **3. Adversary Sabotage**
  *   **Prediction:** Adversaries might try to make nonsensical rules just to steal points.
  *   **Handling:** The Instructor is the final arbiter of "Valid Rule." A rule must be expressible in natural language and consistent. If an Adversary proposes "Box 1 is Left, Box 2 is Right...", reject it as a list, not a rule.

  ---

  # 7. Closing Reflection: The Gap Between Notation and Vision

  This paper-and-notation version cannot reproduce the **gestalt immediacy** of the real Bongard problems. When a human sees a drawing, they process shape, texture, and spatial relation simultaneously and pre-verbally. By forcing students to parse `CI-O-N`, I have inserted a syntactic translation layer that slows down the very intuition I want them to study. They are analyzing descriptions of shapes, not the shapes themselves. This creates a "symbol grounding" problem: they may struggle with the notation enough that they miss the cognitive insight about underdetermination, blaming the text instead of the logic.

  To cover this gap, you must supply **emphasis by hand**. When you reveal the Held-Out box in Phase 2, do not just read the code. Draw the held-out box on the whiteboard instantly. When a student proposes a rule, sketch it. You must act as the rendering engine that turns their text back into vision, reminding them that the *concept* lives in the visual space, while the *struggle* lives in the linguistic space. The friction between your drawing and their code is where the lesson actually happens.
