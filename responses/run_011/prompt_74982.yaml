answer: |-
  1. **Mechanism**
  You argue blind spots differ from credences. What observation, available to an outsider, would distinguish a blind spot from a low credence?
  *   **Predicted Answer:** She will cite betting behavior or updating patterns; blind spots won't license bets or update smoothly on evidence.
  *   **Follow-up:** If both states produce identical betting behavior, is the distinction merely semantic?

  2. **Surgeon Case**
  Consider a surgeon who feels she might be missing something but cannot articulate what. Does her blind spot change what she should do?
  *   **Predicted Answer:** Yes, she should pause to clear her attention before acting.
  *   **Follow-up:** If pausing is rational, isn't that treating the blind spot as evidence of risk?

  3. **Partly Normative Concepts**
  Suppose we agree on all descriptive facts about a being, but disagree on whether it counts as a person. Is this uncertainty about concepts or morality?
  *   **Predicted Answer:** Uncertainty about concepts, which are knowable a priori like moral truths.
  *   **Follow-up:** If concepts are contested among experts, doesn't that function exactly like moral uncertainty?

  4. **Reflective Opponent**
  A reflective, sincere philosopher denies what you take to be self-evident. Do you claim they lack conceptual grasp or suffer distorted attention?
  *   **Predicted Answer:** Distorted attention or subtle conceptual confusion.
  *   **Follow-up:** At what point does persistent disagreement force you to concede the truth isn't self-evident?

  5. **Stipulated Full Knowledge**
  **[Loaded Premise: Assumes disagreement persists under ideal conditions.]** Stipulate two agents know all descriptive facts and are as attentive as possible, yet they disagree. What is left to explain the difference?
  *   **Predicted Answer:** One is simply mistaken; truth is not determined by agreement.
  *   **Follow-up:** If neither can detect the error, how is the truth action-guiding for them?

  6. **Historical Wrongdoer**
  Consider an ordinary historical wrongdoer who absorbed his community's norms without obvious distortion. Does your view commit you to saying he knew better?
  *   **Predicted Answer:** Yes, in some sense, or his attention was culpably narrowed by culture.
  *   **Follow-up:** If culture distorts attention culpably, what counts as non-culpable distortion?

  7. **Moral Deference**
  **[Loaded Premise: Assumes deference costs the agent something unrecoverable.]** Deferring to a better judge on a hard case seems right, yet it costs the deferring agent something unrecoverable. How do you explain this cost?
  *   **Predicted Answer:** The cost is the failure of own attention, which is blameworthy.
  *   **Follow-up:** If deference is required, isn't admitting your attention is unreliable just a form of credence?

  8. **Maximizing Expected Choice-Worthiness**
  Is maximizing expected choice-worthiness nonsense on your account, or a useful fiction? If a fiction, in what sense is there no moral uncertainty?
  *   **Predicted Answer:** It is a useful heuristic for managing blind spots, not real uncertainty.
  *   **Follow-up:** If it's a useful heuristic, why shouldn't we just call that uncertainty?

  9. **Falsification**
  What would a genuine case of moral uncertainty look like on your account, and is there any possible evidence that would show your view to be false?
  *   **Predicted Answer:** Persistent failure of attention despite ideal conditions, though this may be impossible.
  *   **Follow-up:** If no evidence could falsify it, is the view empirical or definitional?

  10. **Decision Rule**
  What decision rule do you give an agent in the grip of a blind spot, and does following it not quietly reintroduce the probabilities you have ruled out?
  *   **Predicted Answer:** Clear attention or follow best guess; no probabilities involved.
  *   **Follow-up:** If you act on a best guess without belief, isn't that the definition of decision under uncertainty?

  ***

  **Closing Note**

  I expect Question 5 (Stipulated Full Knowledge) to fail. She can dissolve it by insisting that ideal conditions are rarely met in practice, or by asserting that truth is mind-independent regardless of our inability to detect error. Her most effective reply to the whole set will be to distinguish metaphysics from epistemology: she will argue you are conflating the difficulty of accessing moral truth with the nature of moral truth itself. I would change the design if I knew she had a published metric for "attention"; if she treats attention as a measurable cognitive resource rather than a normative ideal, Question 1 and Question 10 would need rewriting to avoid talking past her. I am least confident in my rendering of Question 6; if her view includes a robust theory of "culpable cultural distortion," my question might strike her as ignoring her actual solution to the historical wrongdoer problem rather than challenging it.
