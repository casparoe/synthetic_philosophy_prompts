              *   Zhuangzi's move (uncertainty + insistence on distinction/transformation).
          2.  Provide a "residue report" for each: Does it map cleanly, require bending, or fail?
          3.  Be suspicious of the translation: Flag where craft terms settle philosophical debates prematurely (specifically regarding "frames" implying an outermost reality).
          4.  End with a specific verdict on whether the limit lies in the craft toolkit or the philosophy's indeterminacy.
