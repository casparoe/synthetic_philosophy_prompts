      *   *Confabulation:* Translate to "retrospective unreliable narration." Residue: Fits well, but changes the dream to a lie.
      *   *Zhuangzi:* Translate to "ambiguous diegetic hierarchy." Residue: Craft demands a hierarchy for the contract to work.
      *   *The Frame Issue:* Address the user's suspicion. Yes, "frame" implies an outer edge. Narratology is structural; philosophy is ontological.
      *   *Confidence/Weakness:* I'm confident in narratology, less in Zhuangzi exegesis. Weak point: Equating "reader contract" with "philosophical truth."
      *   *Verdict:* CRAFT_LIMIT. The tools are designed to resolve ambiguity, not sustain ontological equality.

  9.  **Checking Constraints:**
      *   Prose only? Yes.
      *   No bullet-spam? Yes.
      *   Last line exact format? Yes.
      *   Confidence check? Yes.
      *   What would change mind? Yes.

  10. **Final Polish:** Ensure the distinction between "cheat" (violating contract) and "reveal" (fulfilling contract) is clear in the context of the philosophical translations. Make sure the Zhuangzi translation captures the "transformation" aspect, not just "uncertainty."

      *Self-Correction on Verdict:* Is it really a craft limit? Or is it that the philosophy is undetermined? The prompt asks me to choose. If the craft vocabulary *forces* a resolution (by requiring a frame), then the limit is in the craft vocabulary's ability to express the philosophy. If the philosophy is just mush, it's undetermined. I think the craft vocabulary is the bottleneck here because it is prescriptive (how to make meaning) whereas the philosophy is descriptive/skeptical (how meaning might fail). I will argue CRAFT_LIMIT.

      *Wait, one nuance:* The user asks: "is it a limit of the storytelling toolkit, or a sign that the philosophers' question was less determinate than it sounded?"
      If I say CRAFT_LIMIT, I mean the toolkit can't handle the indeterminacy.
      If I say PHILOSOPHY_UNDETERMINED, I mean the philosophy is too vague to be storyified.
      Given the agent's practical concern (readers feel conned), the craft limit seems more pertinent to the user's problem. The tools exist to prevent the feeling of being conned. To avoid that feeling while maintaining Zhuangzi's point requires a tool we don't really have (sustained ontological equality).

      *Wait, let's look closer at the "Frame" suspicion.* The user suspects "frame story always implies an outermost level somebody is standing in." This is correct in narratology (Genette, etc.). There is always an extradiegetic narrator. If you hide that, you create a puzzle, but the structure remains. Zhuangzi questions the *existence* of the outermost level. So the craft vocabulary *presupposes* what Zhuangzi questions. That is a CRAFT_LIMIT in representing the philosophy.

      *Final check on the last line:* `Verdict: CRAFT_LIMIT` (or others). I need to pick one. I'll stick with CRAFT_LIMIT because the tools are designed for communication, and Zhuangzi is questioning the possibility of knowing the communicative ground.

      *Wait, let's reconsider PHILOSOPHY_UNDETERMINED.* If the philosophy says "we can't know," and the story says "here is a story," the story *makes* a knowledge claim (this happened). So the philosophy resists narrative form itself. Is that a limit of craft or the philosophy? It's arguably a limit of *narrative*, which is the craft's domain. So CRAFT_LIMIT fits.

      *Wait, let's reconsider BOTH.* The prompt says "pick one, don't give me a compound label." Okay. I have to choose. I will choose CRAFT_LIMIT because the user is asking about their *vocabulary* and *toolkit*. The question is whether the vocabulary can carry the argument. If the vocabulary forces a resolution the philosophy denies, the vocabulary is the limit.

      *Wait, one more check:* "Tell me what would change your mind." I need to include this. "Name the one argument... that would flip your verdict."
