      *(Refining the Final Check)*: The "Elevator Button" is good, but maybe too mundane. Let's use a Code Debugging scenario. "You run code, it fails. You change line 5. It fails. You revert line 5. It fails. You change line 5 again." vs "You read the error log." The difference is accessing the *global state* (the error message meaning) vs reacting to the *local cue* (the red text). Actually, the prompt asks for *one check*. Let's go with a specific "Interrupt" test.

  10. **Final Polish:** Check against constraints. 50 mins. 1 page. No script.
      *   *Time allocation:* 5 min intro, 15 min wasp/structure, 10 min empirical objection, 10 min RL bridge, 5 min misconceptions/free will hook, 5 min check.
