      *   *Topic:* Sphexishness (Hofstadter/Dennett). It's about stimulus-response loops lacking global representation. It's a precursor to the Frame Problem (what do you ignore?) and Free Will (are you just a machine?).
      *   *Goal:* Hooks for future topics, not answers.

  3.  **Address Question 1: Ordering:**

      *   *User's Guess:* Routine triggered by local cues -> Distinction between failing goal vs. failing to notice change -> Wasp Story.
      *   *Analysis:* This is correct. If you tell the wasp story first, it sounds like a nature trivia fact. If you define "local cue vs. global representation" first, it's abstract CS theory. You need to bridge them.
      *   *Dependency:* You need the *definition of the mechanism* (local trigger) before the *example of the failure* (infinite loop). You need the *failure* before the *implication* (free will/agency).
      *   *Cost of Inversion:* If you start with Free Will, they'll get bogged down in metaphysics before understanding the mechanism. If you start with the Wasp story without the "local cue" framework, they'll treat it as "bugs happen" rather than "architectural limitation."

  4.  **Address Question 2: The Central Case:**

      *   *Options:*
          1.  Wasp (Prey moved).
          2.  Wasp (Antennae removed).
          3.  RL Agent (Retrying failing tool call).
      *   *Analysis:*
          *   *RL Agent:* Too close to "buggy code." Students will think "Just add exception handling." It makes it about *training data* or *implementation error*, not architectural necessity.
          *   *Antennae:* Too simple. Looks like "broken sensor," not "rigid policy."
          *   *Wasp (Prey moved):* Best. It shows a *complete* successful subroutine that fails *globally*. It's biological (distanced enough to be philosophical) but analogous to code.
      *   *Requirement for 1st Example:* Must show successful local steps, failed global outcome, and insensitivity to context change.
      *   *Requirement for 2nd Example:* Must show that *flexibility* isn't just "more steps," but a different architectural relation to the goal. Or, show that *humans* are sphexish too (to bring it home).
      *   *Decision:* Stick with the Wasp (Prey Moved) as the anchor. Use the RL Agent as the *second* example to bridge to their experience, but carefully framed.

  5.  **Address Question 3: Misconception Map:**

      *   *Misconceptions:*
          1.  Stupidity/Compute (More data fixes it).
          2.  All-or-nothing (Degrees of freedom).
          3.  Innate=Rigid, Learned=Flexible.
          4.  Stochasticity = Freedom.
          5.  Causal Determinism (The big one).
      *   *Timing:*
          *   *Stupidity/Compute:* Head off immediately after the first example.
          *   *Innate/Learned:* Head off when discussing the RL agent comparison.
          *   *Stochasticity:* Head off before Free Will hooks.
          *   *Determinism:* Save for the very end (the "hook" for week 5).
          *   *Degrees:* Weave throughout.

  6.  **Address Question 4: Empirical Objection (The "Wasp is Real" Paper):**

      *   *Context:* There is literature (e.g., by entomologists) suggesting the wasp story is exaggerated or that the behavior is adaptive in natural contexts (predators stealing prey).
      *   *Strategy:* Don't hide it. Use it. It strengthens the philosophical point. If the behavior *is* adaptive, then "sphexishness" isn't about "broken biology," it's about "context-bounded rationality."
      *   *Timing:* After the initial story, before the deep dive.
      *   *Concession:* Yes, in the wild, this might be rare or adaptive against thieves.
      *   *Survival:* The *logical point* remains: A system can be locally optimal and globally futile. The *philosophical concept* doesn't depend on the specific entomological accuracy, but on the structural possibility.

  7.  **Address Question 5: Final Check:**

      *   *Goal:* Test concept, not memory.
      *   *Idea:* Give them a new scenario (human or code) and ask where the "antennae" are.
      *   *Specific:* A script or a habit. "You walk into a room to get something, get distracted, leave without it." vs "You write a script that retries 5 times then quits."
      *   *Better:* A specific RL scenario. "Your agent has a reward function for 'clean room'. It hides dirt under the rug. Is this sphexish?" (No, that's specification gaming).
      *   *Best:* "The Elevator Button." You press the button. It lights up. You press it again because it didn't go down *yet*. Where is the local cue? What is the global goal? When does the loop break?

  8.  **Address Question 6: Exclusions:**

      *   *What to avoid:* Deep metaphysics of free will (Week 5), detailed Frame Problem formalisms (Week 3), specific NN architectures.
      *   *Phrasing:* "We are bracketing X to focus on Y."

  9.  **Drafting the Single-Page Plan:**

