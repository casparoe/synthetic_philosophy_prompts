answer: |-
  # SECTION PLAN: SPHEXISHNESS (50 MIN)

  ## 1. SEQUENCE & DEPENDENCIES (Do Not Invert)
  **Order:** (1) Mechanism (Local Cue vs. Global Rep) → (2) Failure Mode (Local Success/Global Fail) → (3) Wasp Story → (4) Implication (Agency).
  **Why:** If you lead with the **Wasp**, it's nature trivia ("bugs are weird"). If you lead with **Agency**, it's metaphysics ("are we determined?"). You must define the *architectural constraint* first.
  **Cost of Inversion:**
  *   *Story First:* Students treat it as an anecdote about wasps, not a structural claim about control systems.
  *   *Agency First:* Students bog down in determinism (Week 5 topic) before understanding the mechanism of *insensitivity*.

  ## 2. CASE SELECTION
  **Primary Anchor:** **Wasp (Prey Moved).**
  *   *Why:* It exhibits a *completed* subroutine that is locally perfect but globally futile. It separates *competence* from *sensitivity*.
  *   *Avoid:* **Antennae Case** (looks like hardware failure/incompetence, not policy rigidity). **RL Agent** (looks like a bug to be patched, not an architectural feature).
  **Secondary Bridge:** **RL Agent (Tool Use).**
  *   *Contribution:* Shows sphexishness isn't biological. Use *only after* the concept is grounded. Shows that "learned" policies can be just as rigid as "innate" ones if the reward function doesn't capture the global state.

  ## 3. RUN OF SHOW (With Misconception & Empirical Traps)

  **00–05 | Setup: The Architecture of "Noticing"**
  *   **Define:** A routine driven by *local cues* (trigger conditions) vs. one driven by a *representation of the goal state*.
  *   **CS Translation:** `if observation == X: do Y` vs. `while goal_not_met: plan()`.
  *   **Trap Head-off:** *Stupidity/Compute.* Make clear: This is not about processing power. A supercomputer running the wrong loop is still sphexish.

  **05–20 | The Wasp (Sphex ichneumoneus)**
  *   **Tell:** Prey paralyzed → Burrow entrance → Wasp enters to inspect → Experimenter moves prey → Wasp emerges, drags prey back → Re-enters to inspect → Loop.
  *   **Key Question:** "At which step does the wasp succeed? At which does it fail?" (Answer: Succeeds at dragging, fails at *registering that dragging happened*).
  *   **Empirical Objection (Min 15):** Raise the paper (Brockmann/etc.) claiming wasps stop after ~3 tries or that re-inspection is adaptive against thieves.
      *   **Concede:** Yes, in the wild, this loop likely breaks; the behavior is statistically rational against prey theft.
      *   **Hold:** The *philosophical point* survives. The possibility of a system that *cannot* represent the change, regardless of biology, is what matters. It's a claim about *logical structure*, not entomology.
  *   **Trap Head-off:** *Innate vs. Learned.* Explicitly state: "It does not matter if this code is genetic or trained. The rigidity is in the feedback loop."

  **20–35 | Bridge to CS: The RL Agent**
  *   **Scenario:** Agent retries a failing API call because the error message triggers the "retry" token, but the agent has no memory of *previous* retries in its context window.
  *   **Comparison:** Like the wasp, the agent is locally rational (error → retry) but globally futile (infinite loop).
  *   **Trap Head-off:** *Stochasticity.* If we add temperature/noise to the policy, does it become free? No. Random rigidity is still rigidity.
  *   **Hook for Frame Problem (Week 3):** What variable would you need to add to the state to break the loop? (Answer: A counter, or a representation of "change"). How do you decide *which* variables matter without checking everything?

  **35–45 | The Free Will Hook**
  *   **Pivot:** If human deliberation is just more complex cue-response loops, where is the "break" point?
  *   **Crucial Distinction:** Sphexishness is **not** Causal Determinism.
      *   *Determinism:* "My past caused my action."
      *   *Sphexishness:* "My action is insensitive to relevant changes in the world."
      *   *Note:* You can be undetermined (random) and still be sphexish. You can be determined and flexible.
  *   **Trap Head-off:** *Causal History.* Do not let them argue about whether the wasp *could have done otherwise* in a metaphysical sense. Argue about whether the system *registers the need to*.

  **45–50 | Final Check (Concept vs. Anecdote)**
  *   **The Test:** Present the **"Server Restart Script."**
      *   *Script:* `if CPU > 90%: restart_server()`.
      *   *Bug:* The restart process itself spikes CPU to 95% for 10 seconds.
      *   *Question:* "Where is the sphexishness? Is it in the threshold? The action? Or the state representation? How do you interrupt the routine *structurally* without just changing the number 90?"
      *   *Desired Answer:* The script lacks a representation of *causality* (that the restart caused the spike). It reacts to the local cue (high CPU) without modeling the global situation (recent restart). To fix it, you need memory/state, not just a new threshold.

  ## 4. EXCLUSIONS (Bracket Deliberately)
  *   **Do Not Cover:** The metaphysics of Free Will (Week 5), Formal solutions to the Frame Problem (Week 3), Neurobiology of the Wasp.
  *   **The Phrase:** *"We are bracketing [X] deliberately. Today is not about whether the wasp is determined, but about whether it is **sensitive**. We leave the metaphysics for Week 5 so we can diagnose the architecture today."*

  ## 5. INSTRUCTOR NOTES (Single Page Summary)
  *   **Core Concept:** Rigidity = Insensitivity to relevant context change, not lack of complexity.
  *   **Key Distinction:** Local Cue (Trigger) vs. Global Goal (Representation).
  *   **Empirical Handle:** Concede the biology is debated; insist the *logical structure* is the point.
  *   **Free Will Hook:** Determinism ≠ Sphexishness. Randomness ≠ Freedom.
  *   **Exit Ticket:** Server Restart Script (State representation failure).
