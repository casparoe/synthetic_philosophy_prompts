      *(Self-Correction during drafting)*: I need to make sure the Statistician isn't doing *all* the work during the meeting. The Statistician must certify the diagnostics *before* the meeting. The meeting discusses the *implications*.
      *(Refining the Truncate-and-Median critique)*: Be precise about the "salami slicing" vulnerability.
