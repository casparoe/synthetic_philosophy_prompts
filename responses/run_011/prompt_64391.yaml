      *   Stable against re-slicing? No. If I have one outcome of £600m (prob 0.1), it gets capped to £500m. Expected contribution £50m. If I slice it into two outcomes of £300m (prob 0.05 each), they are below the cap. Expected contribution £60m. The applicant gains value by slicing. The rule is gameable.
      *   Non-arbitrary fix? Link to "Maximum Compensable Harm" or "Departmental Budget Authority".

  7.  **Drafting the Content (incorporating British English and constraints):**

      *   *Tone:* Formal, administrative, precise.
      *   *Structure:*
