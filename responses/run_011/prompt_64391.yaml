          *   *Stochastic Dominance:* One option is better than another at every level of probability.

      *   *Addressing the "Chair's Instinct":* I need to make sure I identify *which* case triggers the disagreement. Case (i) is the most likely candidate. Bounded harm + Infinite Benefit = Permit under many rational frameworks. But "Gene Drive on Inhabited Island" feels risky. I will argue the procedure permits (i), and if the Chair rejects it, the defect is in the Chair's instinct (over-caution on bounded risks) *or* the procedure fails to capture "social licence" (which is a value, not a fact). I will frame it as the procedure handling *risk*, not *outrage*.

  8.  **Final Review against Constraints:**
