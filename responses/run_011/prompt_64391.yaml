      *   *Step 3: The New Decision Tree.*
          *   **Q1: Tail Behaviour.** Statistician checks if the sum of (probability * value) converges absolutely.
          *   **Q2: Sensitivity.** If finite, is it driven by <5% of probability mass contributing >90% of value?
          *   **Q3: Boundedness.** Can we establish hard bounds on harm based on physical/legal limits?
      *   *Fallback Criteria:*
          1.  *The Precautionary Bound:* If the lower bound of the 95% confidence interval of harm exceeds a statutory threshold, refuse. (Focus on worst plausible case, not average).
          2.  *The Reversibility Test:* If the intervention cannot be halted or reversed within time $T$, and uncertainty is high, refuse.
      *   *Handoffs:* If the math works but the *values* (weights) are disputed, that's for the Minister/Panel value judgment, not a mathematical block.

  4.  **Drafting the Procedure (Iterative refinement):**

      *   *Addressing the Truncate-and-Median Rule:* I need to be firm. It masks the problem. It moves the fight to the cap value. It is vulnerable to "salami slicing" of scenarios unless the cap is applied to the *aggregate* exposure, not per line item. I will recommend abandoning it in favor of a "Statutory Liability Cap" if one exists, or a "Robust Median" approach.
      *   *The Four Situations:*
          1.  *Mean does not exist:* Heavy tails (alpha < 1).
          2.  *Mean is infinite:* One side diverges.
          3.  *Mean is fragile:* Finite but unstable (sensitive to low-prob/high-impact).
          4.  *Mean is robust:* Standard risk assessment.
      *   *Fallbacks:*
          1.  *Stochastic Dominance:* Does this proposal dominate the status quo across *all* percentiles up to a high threshold (e.g., 99th)?
          2.  *Maximum Credible Loss:* Can the department absorb the 1-in-100 year loss without systemic failure?
      *   *Stop Points:*
          *   Refusal: If Maximum Credible Loss exceeds statutory limit OR Reversibility is impossible.
          *   Handoff: If risks are acceptable but distributional effects (who wins/loses) are contested.

  5.  **Running the Test Cases:**

      *   *Case (i) Gene Drive:* Harm bounded/modest. Benefit mean diverges (heavy upside).
          *   *Analysis:* Mean doesn't exist. Fallback to Stochastic Dominance or Median. If median benefit > 0 and max harm is tolerable, permit?
