answer: |-
  # MEMORANDUM

  **TO:** Columnist
  **FROM:** Legal Translation Unit
  **RE:** Restatement of Scientific Priority via 35 U.S.C. Framework
  **STATUS:** Draft for Internal Review

  ## PART I: THE TRANSLATION
  **Subject:** Claim Construction of "Priority" in Scientific Discovery

  To effect this translation, we must treat the scientific record as a specification and the act of publication as a filing date. We proceed under the assumption that a scientific discovery functions as a patentable invention, notwithstanding the statutory exclusions detailed in Part II. `[CONVERSION: Discovery treated as Invention]`

  **1. Conception and Reduction to Practice**
  In the Newton/Leibniz docket, the dispute turns on the timeline of conception. Newton's *fluxions* represent an early conception, potentially documented in private correspondence (lab notebooks). However, conception alone is insufficient for priority. It requires reduction to practice.
  *   **Actual Reduction:** Leibniz's 1684 publication constitutes the first public disclosure enabling a PHOSITA (Person Having Ordinary Skill In the Art of Mathematics) to practice the method.
  *   **Constructive Reduction:** Newton's *Principia* (1687) serves as a later constructive reduction.
  *   **Diligence:** Newton's failure to publish between conception and Leibniz's filing date demonstrates a lack of continuous diligence. Under pre-AIA law, this forfeits his priority claim against an independent conceiver who reduced to practice first.

  **2. Derivation and Inventorship**
  The Royal Society's 1712 investigation functions as a derivation proceeding. The accusation is that Leibniz did not independently conceive but accessed Newton's claims through intermediaries (Collins, Oldenburg).
  *   **Legal Standard:** Did the later conceiver (Leibniz) obtain the subject matter from the true inventor (Newton) without authorization?
  *   **Outcome:** The panel found derivation. However, the panel was chaired by the true inventor (Newton), creating a clear conflict of interest and voiding the procedural integrity of the interference.
  *   **Inventorship:** Correct inventorship is a condition of patentability. If Leibniz derived, he is not a named inventor. If independent, he is a joint inventor or competing sole inventor.

  **3. The Merton Multiples and Obviousness (35 U.S.C. § 103)**
  Merton's thesis—that simultaneous discovery is the norm, not the exception—translates directly to the obviousness inquiry.
  *   **The Field:** When the "state of the art" (prior art) reaches a critical density, the gap between existing knowledge and the new discovery narrows.
  *   **The PHOSITA:** In a "ready" field, the PHOSITA is motivated to combine prior art references to reach the solution.
  *   **The Multiples:** If Team A and Team B independently solve the problem within the same filing window, this is *prima facie* evidence that the solution was obvious to the PHOSITA.
  *   **The Consequence:** In patent law, if a result is obvious, it is unpatentable. In science, if a result is "ripe," both parties seek credit. The patent system resolves simultaneity by denying the right; the scientific system resolves it by splitting or fighting over the credit.

  **4. The Darwin/Wallace Arrangement (Joint Inventorship)**
  The 1858 Linnean Society reading is a forced joint inventorship agreement.
  *   **Conception:** Darwin holds the earlier conception date (1838 notebooks).
  *   **Reduction:** Wallace holds the earlier reduction to practice (1858 manuscript submission).
  *   **Diligence:** Darwin's 20-year delay is legally fatal to priority unless excused. Lyell and Hooker act as arbitrators, imposing a settlement: treat the papers as a joint disclosure to establish a priority date for the *concept* of natural selection, preventing third-party preemption.
  *   **Equity:** This bypasses the strict "first-to-reduce" rule in favor of an equitable sharing of inventorship, acknowledging Darwin's long diligence (albeit unpublished) and Wallace's independent conception.

  **5. The Matthew Effect and Obliteration by Incorporation**
  *   **Matthew Effect:** This maps to the citation network and the valuation of the patent portfolio. High-status inventors receive disproportionate credit for similar contributions (higher valuation for same claim scope).
  *   **Obliteration by Incorporation:** When a discovery becomes foundational prior art, the specific inventorship is erased. The method becomes standard technique. In patent terms, the patent expires, enters the public domain, and the inventor's name is removed from the active claims, remaining only in the specification history.

  **6. Statutory Exclusions (35 U.S.C. § 101)**
  Here the translation faces a hard stop.
  *   **Calculus:** A mathematical method/abstract idea. Ineligible subject matter.
  *   **Natural Selection:** A law of nature/natural phenomenon. Ineligible subject matter.
  *   **Result:** Under current jurisprudence (*Alice*, *Myriad*), neither Newton nor Darwin could secure exclusionary rights. The "priority" debate is therefore purely reputational, as no property right can attach to the subject matter. `[CONVERSION: Ignoring § 101 to analyze priority mechanics]`

  ***

  ## PART II: THE RESIDUE REPORT

  ### 1. What translates cleanly? (Merton, PHOSITA, and the Obviousness Trap)

  The cleanest fit is Merton's "readiness of the field." In patent law, this is the *Graham v. John Deere* factual inquiry into the scope and content of the prior art. When Merton says the time is right, patent law says the combination of prior art references renders the step obvious to a PHOSITA.

  **The Awkward Consequence:**
  If we accept the translation, Merton's multiples prove obviousness. If a discovery is obvious, patent law dictates it belongs to the public immediately. No monopoly is granted.
  *   **Science:** Rewards the discoverer even if the discovery was inevitable (Nobel Prizes are not revoked because "someone else would have found it soon").
  *   **Patents:** Punishes the discoverer if the discovery was inevitable (Invalidation under § 103).

  **Does the inevitability thesis argue for abolishing priority?**
  Translated into patent logic: Yes. If the "inevitability thesis" holds (that discoveries happen when the field is ready, not because of genius), then granting exclusive credit is inefficient. It creates a deadweight loss (the fight for priority) without incentivizing the act (since it was going to happen anyway).
  However, patent law *already* abolishes priority for obvious things. It says: "If two people find it at once, neither gets it." Science refuses to do this. Science insists on naming a winner even when the invention was "obvious." This suggests science uses priority not to incentivize production (the patent rationale), but to construct a lineage of truth. The patent translation reveals that scientific priority is irrational under an incentive-based model; it only makes sense under a reputational/modeling model.

  ### 2. What only fits if you bend it? (The Historian's Objection)

  Historians argue Newton and Leibniz didn't find the "same" thing. Newton's calculus was kinematic (fluxions, motion); Leibniz's was algebraic (differentials, notation). They are functionally equivalent but structurally distinct.

  **The Patent Fit:**
  This maps to **Claim Construction** and **Written Description**.
  *   **Claim Scope:** Newton's claims cover "rates of change in physical bodies." Leibniz's claims cover "symbolic manipulation of infinitesimals."
  *   **Infringement:** Does Leibniz's notation infringe Newton's method? Under the Doctrine of Equivalents, perhaps. But under literal infringement, no.
  *   **Enablement:** Did Newton enable the algebraic formulation? If not, he cannot claim priority over Leibniz's specific embodiment.

  **Where the Fudge Happens:**
  To make this fit, we have to treat "The Calculus" as a single genus claim. In patent law, if you conceive the genus but only reduce to practice one species, your priority is limited to what you enabled.
  *   **The Bend:** In science, we retroactively unify them as "The Calculus." In patent law, they might be two distinct patents in a patent pool, or one invalidates the other as anticipated prior art depending on how broadly the "method of integration" is claimed.
  *   **The Fudge:** We are assuming the *utility* is identical. In patents, if the utility differs, they are distinct inventions. In science, if the predictive power is identical, they are the "same" discovery. The legal vocabulary struggles with "semantic equivalence" versus "functional equivalence." We have to bend the definition of "Identity of Invention" to accommodate the historian's view that conceptual frameworks matter as much as results. `[CONVERSION: Equating Conceptual Framework with Claim Scope]`

  ### 3. What has no counterpart at all? (Subject Matter and Truth)

  **The § 101 Gap:**
  As noted, calculus and natural selection are ineligible. But the deeper gap is **Truth**.
  *   **Patent Law:** Indifferent to truth. A patent on a working machine is valid even if the underlying theory of *why* it works is wrong (e.g., early patents on electrical devices based on fluid theories). The requirement is utility (operability), not veracity.
  *   **Science:** Obsessed with truth, yet allocates credit like a property right.
  *   **The Hole:** The "who discovered what" debate assumes there is a fixed "what" (Truth) to be discovered. Patent law admits there is only a fixed "claim" (Text).
  *   **Implication:** The debate is thinner than it sounds because science pretends the priority is about *Truth* ("I saw nature first"), but operates like *Law* ("I published first"). Patent law strips away the pretense. It admits the priority is about the *filing date*, not the *moment of insight*.
  *   **The Residue:** When we translate science to patent law, we expose that scientific priority is a fiction of meritocracy. It's a filing system masquerading as epistemology. The "Truth" doesn't matter for priority; the "Publication" does. Patent law makes this explicit; science hides it behind the narrative of genius.

  ### 4. The Collision Case: CRISPR (Interference vs. Nobel)

  **The Facts:**
  *   **Nobel (Credit):** Awarded to Doudna/Charpentier. Rationale: Conception of the CRISPR-Cas9 system as a programmable tool (in vitro).
  *   **Interference (Rights):** Awarded to Broad (Zhang). Rationale: First to reduce to practice in *eukaryotic* cells.
  *   **The Law:** The USPTO declared two distinct patentable inventions: Prokaryotic (Doudna) and Eukaryotic (Broad). Because Broad filed first (despite later conception) under AIA first-inventor-to-file, and Doudna could not prove derivation, Broad kept the eukaryotic claims.

  **Which rule gave the better answer?**
  *   **Patent Law (Broad):** More precise. It asked: "Who actually made it work in the complex environment claimed?" It protected the commercial utility. It recognized that conception in a test tube is not reduction to practice in a human cell.
  *   **Nobel (Doudna):** More conceptual. It asked: "Who had the core insight?" It recognized that the eukaryotic adaptation was a routine optimization once the in vitro mechanism was known.

  **The Move to First-Inventor-to-File (AIA):**
  The US killed interference proceedings (replaced by Derivation Proceedings) to align with the rest of the world and reduce cost/uncertainty.
  *   **What it says:** The legal system decided that determining "who thought of it first" (Conception) is too expensive and fact-intensive. It is better to reward "who filed first."
  *   **Translation to Science:** If science adopted First-to-File (pre-print servers as filing dates), it would reduce the Newton/Leibniz style fights. But science resists this because "filing" (publishing) is often the *end* of the work, whereas in patents, filing is the *start* of the exclusion period.
  *   **The Verdict:** The Patent Office's split decision (Doudna gets some claims, Broad gets others) was legally robust but scientifically unsatisfying. It acknowledged that "Discovery" is not a binary event but a series of reductions to practice. The Nobel Committee's binary choice (Doudna wins) was scientifically intuitive but legally naive.
  *   **Conclusion:** The shift to First-to-File admits that **priority is administrative, not ontological.** It doesn't matter who discovered it; it matters who notified the public. This undermines the "Genius" narrative of science. If the US patent system says "Conception is too hard to prove," then the Newton/Leibniz fight is legally moot. Newton's private notebooks are irrelevant. Only the *Principia* filing date counts.

  **Final Note on the Translation:**
  The translation holds up mechanically but fails teleologically. Patent law allocates scarcity (monopoly). Science allocates abundance (credit is non-rivalrous; we can both be credited, though we fight as if we can't). When you force science into patent vocabulary, you reveal that scientific priority fights are essentially property disputes over a non-property asset. We fight like patent trolls over citations because we have no other currency. `[CONVERSION: Treating Credit as Exclusionary Right]`
