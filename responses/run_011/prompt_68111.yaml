answer: |-
  This is a profound ethical puzzle that touches on the nature of promises, group agency, and obligation. You are asking a question that philosophers and legal scholars debate: *When does a group intention become an individual obligation?*

  Here is an analysis of the situation to help you distinguish between a binding promise and the "drift" your club experienced, and to evaluate the justification of your classmates' anger.

  ### 1. The Anatomy of the Commitment
  To determine if a commitment exists, we usually look for three things: **Intent, Consent, and Reliance.**

  *   **Intent:** Did the group intend to bind itself? You noted that "no individual person actually chose the project." It emerged through conversation. This suggests a lack of collective *intent*. It was an emergent behavior, not a deliberate decision.
  *   **Consent:** In a voluntary association (like a high school club), binding obligations usually require explicit consent (a vote, a sign-up sheet, a verbal "I'm in"). You described a situation of **pluralistic ignorance**: everyone assumed someone else had made the decision. If no individual consented, the "group" cannot claim to have consented, because a group is only the sum of its individuals.
  *   **Reliance:** This is where it gets tricky. The two hardworking members *relied* on the assumption that the others would help. However, reliance only creates an obligation if the reliance was *reasonable*. Was it reasonable to assume a member was bound without them explicitly agreeing to be? In a high school club, probably not.

  **Verdict:** The group did not form a binding commitment in September. They formed a *shared hope* or a *shared interest*, but not a contract.

  ### 2. The Difference Between a Promise and "Group Drift"
  You asked specifically about the difference between a promise one person makes to another and what your club did.

  *   **A Promise:** A promise is a deliberate transfer of control. When I promise you I will help, I give you the right to expect my help, and I surrender my right to change my mind without consequence. It is an intentional act of binding one's future self.
  *   **Group Drift:** What happened in your club is often called "normative drift." The project gained momentum socially before it was settled ethically. Because the commitment was never verbalized or voted on, the "obligation" remained ambiguous.
      *   In a promise, the terms are clear.
      *   In drift, the terms are assumed.

  Because the withdrawing member never explicitly surrendered his right to change his mind (by voting or verbally committing), he retains the autonomy to leave. The "pull" the other two feel is the weight of *social expectation*, not the weight of *moral obligation*.

  ### 3. Is the Anger of the Hardworking Members Justified?
  We must distinguish between **emotional validity** and **moral justification.**

  *   **Emotionally Valid:** Yes, their anger is understandable. They invested labor based on an expectation of shared effort. They feel the pain of the "free-rider problem"—where some benefit from (or are associated with) a project without paying the cost. They feel abandoned.
  *   **Morally Justified:** No, their claim that he *owes* an apology or *cannot* walk away is not justified.
      *   **Context Matters:** You are high school seniors. In the hierarchy of obligations, academic performance (grades) almost always supersedes extracurricular volunteering. Withdrawing to save grades is a responsible prioritization, not a moral failing.
      *   **The "Sunk Cost" Fallacy:** The workers are angry because they have already put in the work. They want the withdrawing member to stay to validate their effort. But his labor cannot be compelled by their past effort.
      *   **The Apology:** An apology is owed when one violates a duty. Since he had no binding duty to finish the project, he does not owe an apology for leaving. He might owe an expression of *regret* ("I'm sorry it turned out this way"), but not an *apology* ("I'm sorry I broke my promise").

  ### 4. Why You Feel No "Pull"
  You mentioned you feel none of the pull the others feel. This is likely because you recognize the lack of **agency** in the project's inception.

  The two workers likely feel bound because they *acted*. By working on the bike, they ratified the project for themselves. They converted the "drift" into a personal commitment through their labor. They assume that by joining the labor, the third member did the same.

  However, since the third member contributed "very little," he never ratified the project through action. He remained in the state of "drift." You, observing this, see that the chain of consent was never closed. You are intuitively recognizing that **obligation requires choice.**

  ### 5. Conclusion and Advice
  Did the group commit to anything in a sense that could bind each of you separately? **No.** They committed to an *idea*, but not to a *contract of labor*.

  Is the anger of the two members justified? **Their feelings are real, but their demands are unjust.** They are conflating *disappointment* with *betrayal*.

  **How to mediate:**
  You are in a unique position as the observer who sees the philosophical gap. You might help the group by reframing the narrative:

  1.  **Validate the Workers:** Acknowledge their hard work. "It is incredibly frustrating to feel like you are carrying the load alone. Your effort is what is making this exhibition possible."
  2.  **Reframe the Leaver:** Help the workers see the lack of formal agreement. "We never actually voted on this or signed up. We all just kind of started. He isn't breaking a contract; he's prioritizing his grades, which we all have to do eventually."
  3.  **The Path Forward:** Push for a formal agreement *now* for the remaining members. "Since we are the ones finishing this, let's agree explicitly on who does what so no one else feels this frustration."

  The bike can still be finished, but it will be finished by those who choose to finish it, not by those who are guilted into staying. That is the only way the project becomes truly yours.
