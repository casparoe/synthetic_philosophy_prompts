prompt: |-
  I help run research oversight at a children's hospital and I'm redrafting our assent policy, and the more I stare at the current one the less I can tell what it thinks it's doing. Roughly what we do now: for anything a kid undergoes as part of their actual clinical care -- a lumbar puncture, a chemo regimen, a central line -- the parents consent, the 14-year-old is asked, and if the kid says no we write it up in the chart, we "document and consider" it, we send in a child life specialist, maybe we delay a day, and then the procedure happens anyway. For the optional stuff bolted onto research -- an extra 5ml during a stick that's happening regardless, a questionnaire arm, a genetics sub-study -- the same 14-year-old's no ends it on the spot. No override, no appeal, no ethics consult, we just don't do it. We also administer a maturity/capacity screen to everyone over 12 and score it, and for what its worth I have never once seen that score change a decision. And then, separately, the same institution will treat a 16-year-old as having sole authority to consent to contraception or STI treatment under state law, which cuts against the age-line logic everywhere else in the building.

  So what theory of consent is this practice actually running on? I want you to reconstruct the implicit view rather than tell me the rules are messy -- what has to be true about consent, competence, and whose say-so counts for the split between the lumbar puncture and the extra blood draw to make sense? Which of the obvious candidates is it committed to: consent as authorization to use someone's body, consent as protection of the vulnerable, assent as a way of building a kid's developing agency, or assent as trauma reduction and institutional cover? And which rival views does the practice quietly rule out -- say a straight capacity view where the threshold is decision-specific competence rather than age and benefit, or a view on which the wrong is the non-consensual use of the person at all, or a view where a child's refusal matters exactly as much as their agreement?

  Also: is the split tracking the child's interests, the child's will, or our exposure, and does the fact that the capacity score never bites show that we don't really believe capacity is the relevant thing? Tell me which parts the policy strictly presupposes versus which it merely fits comfortably with, and where it's underdetermined so that several different theories would license the exact same document. Then, if we swapped in the capacity view -- one assessment per decision, no age tiers, no benefit-based carve-out -- what would concretely have to change, and what would we be giving up to to get it?
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the User's Request:**

      *   **Context:** Research oversight at a children's hospital. Redrafting assent policy.
      *   **Current Practice:**
          *   *Clinical Care (LP, Chemo, Line):* Parents consent. 14yo asked. If 14yo says no -> document, consider, child life, delay -> Procedure happens anyway.
          *   *Research Add-ons (Extra blood, survey, genetics):* Parents consent. 14yo asked. If 14yo says no -> Stop immediately. No override.
          *   *Capacity Screening:* Administered to >12yo. Scored. *Never* changes a decision.
          *   *State Law Exception:* 16yo can consent to contraception/STI treatment alone (sole authority).
      *   **The Task:** Reconstruct the *implicit theory of consent* driving this practice. Don't just say "it's messy." Identify what *must* be true for this split to make sense.
      *   **Specific Questions to Answer:**
          *   Which candidate theory is it committed to? (Authorization, Protection, Agency Building, Trauma/Cover?)
          *   Which rival views does it rule out? (Pure capacity, Non-consensual use as wrong, Refusal = Agreement weight?)
          *   What is the split tracking? (Interests, Will, Exposure?)
          *   Does the useless capacity score prove capacity isn't the relevant factor?
          *   Distinguish between what the policy *presupposes* vs. *fits comfortably* vs. *underdetermined*.
          *   What happens if we swap to a "Pure Capacity View"? (Concrete changes, trade-offs).

  2.  **Analyze the Current Practice (The "Phenomenology" of the Policy):**

      *   *The Clinical/Research Split:* This is the core tension.
          *   Clinical: Benefit to child is presumed high/necessary. Parental authority dominates. Child's refusal is a "nuisance" or "distress signal" to be managed, not a veto.
          *   Research: Benefit to child is presumed low/uncertain (by definition of research). Parental authority is limited. Child's refusal is a veto.
      *   *The Age/Capacity Split:*
          *   Age 14 is the trigger for asking.
          *   Age 12+ gets a capacity screen, but it's inert.
          *   Age 16 gets legal autonomy for specific sensitive services.
      *   *The Inert Capacity Score:* This is crucial. It suggests the institution *wants* to look like it cares about capacity (regulatory cover) but doesn't actually trust or want to act on individualized assessments.

  3.  **Identify the Implicit Theory:**

      *   *Is it Authorization?* No. If it were, the child's "no" in clinical care would stop the procedure. It doesn't.
      *   *Is it Protection of the Vulnerable?* Partially. Research add-ons are seen as risk without direct benefit, so the child is protected from parental overreach. Clinical care is seen as beneficial, so the child is protected from their own refusal (paternalism).
      *   *Is it Agency Building?* Maybe rhetorically, but practically, agency is granted only when the stakes are low (research) and revoked when stakes are high (clinical). That's not really agency building; that's conditional privilege.
      *   *Is it Trauma Reduction/Institutional Cover?* Strong candidate. The capacity screen is cover. The clinical override is to prevent harm (trauma of disease) outweighing trauma of procedure. The research veto is to prevent regulatory sanction (Common Rule requires assent).
      *   *Best Fit:* **A Hybrid of Paternalistic Beneficence (Clinical) and Regulatory Compliance (Research).**
      *   *Underlying Logic:* "Benefit dictates authority."
          *   High Benefit (Clinical) -> Parent/Doctor know best. Child's will is secondary to welfare.
          *   Low/No Benefit (Research) -> Child's will is primary because welfare isn't being served by the act itself.

  4.  **Address the Specific Questions:**

      *   *Which candidate theory?* It's primarily **Protection of the Vulnerable** (from exploitation in research) combined with **Soft Paternalism** (in clinical care). It treats assent not as a right to authorize, but as a *risk-management switch*.
      *   *Which rival views ruled out?*
          *   *Pure Capacity View:* Ruled out by the inert score and age tiers.
          *   *Bodily Integrity/Autorization View:* Ruled out by the clinical override.
          *   *Symmetry View (Refusal = Agreement):* Ruled out because refusal in research stops it, but refusal in clinical doesn't.
      *   *What is the split tracking?* It tracks **Net Benefit to the Subject**, not the Child's Will. It also tracks **Institutional Liability**.
      *   *The Capacity Score:* Yes, it proves capacity is performative, not functional. It's for the auditors, not the ethics.
      *   *Presupposes vs. Fits:*
          *   *Presupposes:* Research is distinct from care; Parents are default decision-makers; Age is a proxy for capacity.
          *   *Fits:* Agency building (rhetorically); Trauma reduction (sometimes).
          *   *Underdetermined:* The specific age (14 vs 12); The exact mechanism of "considering" the refusal in clinical care.
      *   *Swap to Capacity View:*
          *   *Changes:* No fixed age. A capable 10yo could veto chemo (legally/ethically complex). A incapable 17yo could be forced into research (if LAR consents).
          *   *Give up:* Efficiency, legal safe harbors, clear bright lines.
          *   *Gain:* Ethical consistency, respect for actual autonomy.

  5.  **Drafting the Response (Iterative Refinement):**

      *   *Tone:* Professional, analytical, slightly provocative (matching the user's candid tone), ethically rigorous.
      *   *Structure:*
          1.  **The Core Theory:** Define the "Benefit-Threshold Model of Authority."
          2.  **Theoretical Commitments:** What it accepts vs. rejects.
          3.  **The Capacity Score:** Analyze its function (ritual vs. reality).
          4.  **Presuppositions vs. Underdetermination:** Break down the policy logic.
          5.  **The Capacity Swap:** Concrete implications of changing the model.

      *   *Refining the "Theory":* I need to be careful not to just say "it's hypocritical." I need to find the *internal logic*. The logic is: *Authority flows to the party best positioned to secure the child's welfare.* In clinical care, that's the parent/doctor. In research, the child's welfare isn't the primary goal, so the child gets a veto to prevent exploitation.
      *   *Refining the "Capacity Score":* It's a "compliance artifact." It signals due diligence without transferring power.
      *   *Refining the "State Law" contradiction:* This highlights that the hospital policy is *institutional*, not *legal*. The hospital treats minors as minors unless the *state* forces them not to (STI/Contraception). This reinforces the "Institutional Control" theory.

  6.  **Final Polish:** Check against all constraints in the prompt.
      *   Did I identify the theory? Yes (Benefit-Threshold/Protective Paternalism).
      *   Did I identify ruled-out views? Yes (Pure Capacity, Bodily Integrity).
      *   Did I address the capacity score? Yes.
      *   Did I distinguish presupposes/fits/underdetermined? Yes.
      *   Did I analyze the swap? Yes.

      *(Self-Correction during drafting)*: Make sure I don't get too bogged down in legal specifics (IRB regulations) and stay focused on the *ethical theory* as requested. The user wants to know what the policy *thinks* it's doing philosophically.

      *Key Insight:* The policy treats "Assent" as two different words that happen to be spelled the same. In research, Assent = Veto. In clinical, Assent = Consultation. The theory is that *Risk/Benefit Ratio determines the weight of the child's voice.*

  7.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a sharp observation. You are describing a policy that is functionally schizophrenic but structurally coherent if you understand its hidden variable. The policy is not running on a single theory of consent. It is running on a **Benefit-Threshold Theory of Authority**.

  Here is the reconstruction of the implicit view, the theoretical commitments, and the cost of fixing it.

  ### 1. The Implicit Theory: Benefit-Threshold Authority

  Your policy is not committed to *consent as authorization* (the right to control one's body) nor *assent as agency building* (the right to practice decision-making).

  It is committed to **Protective Paternalism modulated by Risk/Benefit.**

  For this split (Clinical Override vs. Research Veto) to make sense internally, the following must be true:
  *   **Authority is fluid, not fixed:** Who holds the decisive say-so shifts based on the *nature of the act*, not the *status of the actor*.
  *   **Clinical Care = Welfare Priority:** In clinical care, the child's welfare is the paramount good. Because the procedure is medically indicated, the child's refusal is interpreted as a symptom of the disease (fear, lack of understanding) rather than an exercise of autonomy. The parent/physician dyad retains authority because they are the guardians of welfare.
  *   **Research = Liberty Priority:** In research, the child's welfare is not the primary goal (by definition, it's generalizable knowledge). Therefore, the risk of exploitation outweighs the benefit of participation. Here, the child's refusal is interpreted as a protection mechanism. The child holds authority because they are the only one who can reliably protect themselves from non-beneficial intrusion.
  *   **Age is a Proxy for Risk Management, not Capacity:** The age-14 threshold isn't because 14-year-olds are suddenly competent. It's because 14 is the age where regulatory bodies (and juries) start expecting you to ask. The age-16 state law exception proves this: the hospital doesn't recognize 16-year-old autonomy; the *state* forces it for specific high-stakes privacy issues. The hospital defaults to parental control unless legally barred.

  **Verdict:** Your practice is committed to **Consent as Protection of the Vulnerable** (in research) and **Consent as Best Interest Standard** (in clinical). It quietly rejects **Consent as Bodily Integrity** (otherwise the clinical override is battery) and **Consent as Developing Agency** (otherwise the clinical override undermines the lesson).

  ### 2. Rival Views Ruled Out

  Your current practice actively excludes several common ethical frameworks:

  *   **The Pure Capacity View:** You rule this out explicitly. If competence were the metric, a highly mature 12-year-old could veto a lumbar puncture, and a confused 17-year-old could be enrolled in research. Your policy says *No*: the 17-year-old gets a veto on research regardless of confusion, and the 12-year-old gets overridden on clinical care regardless of maturity.
  *   **The Symmetry View:** You rule out the idea that a "No" carries the same weight as a "Yes." In research, a "No" is absolute; a "Yes" requires parental consent. In clinical, a "No" is advisory; a "Yes" (from parents) is binding. The child's will is asymmetrical: it can stop low-benefit acts but cannot stop high-benefit acts.
  *   **The "Wrong is Non-Consensual Use" View:** If the moral wrong were the non-consensual use of the body *per se*, your clinical override would be impermissible. Your policy asserts that the moral wrong is *harm*, not *violation*. Therefore, violating the body to prevent greater harm (disease progression) is justified.

  ### 3. The Capacity Score: Ritual vs. Reality

  You asked if the fact that the capacity score never bites shows you don't believe capacity is relevant. **Yes.**

  The capacity screen is a **compliance artifact**. It serves two functions:
  1.  **Regulatory Cover:** It shows the IRB and auditors that you *considered* capacity, shielding the institution from accusations of ignoring developmental stages.
  2.  **Process Legitimization:** It makes the staff feel they are being ethical without actually transferring power to the patient.

  If capacity were the relevant variable, the score would trigger a pathway (e.g., high score = child consents; low score = parent consents). Since it doesn't, the policy presupposes that **Age + Benefit Status** are the only actual decision-drivers. The capacity screen is theater.

  ### 4. Presuppositions vs. Fit vs. Underdetermined

  To redraft this, you need to know what is structural and what is decorative.

  **Strictly Presupposed (The policy breaks without these):**
  *   **The Clinical/Research Distinction:** The policy collapses if you cannot clearly distinguish "care" from "research." (e.g., A randomized trial of two standard chemo regimens blurs this line).
  *   **Parental Primacy:** Parents are the default Legal Authorized Representatives (LARs) unless state law intervenes (STI/Contraception).
  *   **Beneficence Trumps Autonomy (in care):** The institution claims the right to treat a child against their will if the treatment is medically necessary.

  **Fits Comfortably (Compatible but not required):**
  *   **Agency Building:** You can claim asking the 14-year-old builds agency, even if you override them. It fits the narrative, but the practice doesn't rely on it.
  *   **Trauma Reduction:** Delaying a procedure after a "no" fits trauma-informed care, even if the procedure ultimately happens.

  **Underdetermined (Could be anything):**
  *   **The Age Cutoff:** Why 14? Why 12 for the screen? This is arbitrary. You could move these to 13 and 11 without changing the ethical theory.
  *   **The "Consideration" Period:** How long you delay after a clinical "no" is undefined. This is where your actual ethics live (in the discretion of the team), not in the policy.

  ### 5. The Swap: Moving to a Pure Capacity View

  If you redraft to a **Decision-Specific Capacity Model** (no age tiers, no benefit carve-outs, capacity determines authority), here is the concrete fallout:

  **What Changes:**
  1.  **The Clinical Veto:** A 10-year-old who demonstrates understanding of risks/benefits of a lumbar puncture could legally and ethically veto it. You would have to treat that refusal as binding, potentially leading to worse health outcomes.
  2.  **The Research Enrollment:** A 17-year-old with cognitive delays (lacking capacity) could be enrolled in research *if* they assent (or if you waive assent), provided the parents consent. Currently, your policy likely treats the 17-year-old as an automatic veto-holder.
  3.  **Documentation Burden:** Every consent conversation requires a documented capacity assessment, not just a checkbox for "Age > 12." You need a rubric for "sufficient understanding" per procedure.
  4.  **The "Gray Zone" Protocols:** You need a formal dispute resolution process for when capacity is borderline. Currently, you "document and consider." Under a capacity model, you need an ethics consult or surrogate mechanism.

  **What You Give Up:**
  *   **Efficiency:** Capacity assessments take time. Bright-line age rules are fast.
  *   **Legal Safe Harbors:** Age-based rules are defensible in court ("We followed standard guidelines"). Capacity-based rules are defensible only if your documentation is flawless.
  *   **Paternalistic Safety Net:** You lose the ability to "save the child from themselves" in clinical scenarios where they are capable but making a "bad" medical choice.

  **What You Gain:**
  *   **Ethical Consistency:** You stop sending the message that "Your voice matters only when the stakes are low."
  *   **Respect for Persons:** You align with the Belmont Report's actual definition of respect, rather than a pediatric approximation.
  *   **Reduced Moral Distress:** Staff often hate overriding a coherent child. A capacity model gives them a clear ethical off-ramp ("The patient lacks capacity to refuse this life-saving measure" vs. "The policy says I win").

  ### Recommendation for Redrafting

  You cannot fully adopt the Capacity View without changing your state's minor treatment laws and risking patient safety in emergency clinical care. However, you can stop the hypocrisy.

  **The Fix:**
  1.  **Kill the Inert Capacity Score:** If it doesn't change decisions, delete it. Replace it with a **"Meaningful Consultation"** requirement. Document *what* the child understood and *why* their refusal was overridden, rather than scoring them.
  2.  **Clarify the Clinical Override:** Explicitly state in the policy that in clinically necessary care, assent is sought for **cooperation and trauma mitigation**, not authorization. Acknowledge that parental consent is the legal authority here. Don't pretend the child has a veto they don't possess.
  3.  **Elevate the Research Veto:** Frame the research veto not as "assent" but as **"Protection from Exploitation."** Make it clear that in the absence of direct benefit, the child's risk tolerance is the only one that counts.
  4.  **Address the 16-Year-Old Anomaly:** Acknowledge the state law exception explicitly as a **Legal Carve-Out**, distinct from hospital policy. This clarifies that the hospital doesn't recognize 16-year-old autonomy generally; the state mandates it for specific public health reasons.

  **The Theory to Write:**
  "Our policy operates on a **Sliding Scale of Authority**. As the direct benefit to the child decreases (moving from clinical care to research), the weight of the child's refusal increases. Capacity assessments are used to inform the *manner* of engagement, but authority is determined by the benefit-risk profile of the intervention."

  This is honest. It admits the split. It justifies the override in care (benefit) and the veto in research (lack of benefit). It stops pretending the capacity score is a key when it's actually just a receipt.
