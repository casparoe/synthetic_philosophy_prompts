      Good evening everyone. The caterers have been very clear that we have four minutes before the main course arrives, and I know my brother well enough to know that if I go over time, he will spend the rest of the night calculating the utilitarian cost of my indulgence against the coldness of your soup. So I shall be brief.

      Those of you who know my brother know that he has a habit of holding court in other people's kitchens. You are trying to find a corkscrew or wash a glass, and suddenly you are trapped for forty minutes while he explains why you shouldn't have bought the expensive wine. He is thorough. He is rigorous. He believes everything must be accounted for, weighed, and justified before you so much as lift a fork. I have lost count of the number of evenings I have spent leaning against a worktop listening to him argue that nothing we do is ever quite enough, unless it is done for the right reasons, in the right way, for the right people. He is a man who believes that if you cannot explain why you are doing something, you probably shouldn't be doing it at all.

      Which is why today is so interesting. Because looking around this room, I see people who have travelled a long way. I see friends who have given generously to causes they believe in, often because he nagged them until they did. I see family who have spent their lives working the land here in Devon, including an uncle who I notice has already found a comfortable rhythm with his eyelids during the starter. These are different worlds. By all accounts, they should not sit easily at the same table. By all accounts, there should be a calculation made about whether this union makes sense, whether the sums add up, whether the outcome is optimal.

      But my brother is not doing that today. And neither is she. She spends her life putting resources directly into the hands of people who need them, without fuss or bureaucracy. She does not stop to ask if the gesture is theoretically perfect before she makes it. She just makes it. And he, who has spent twenty years arguing that we think too much about why we save the people we love, has finally stopped arguing. He has stopped looking for the justification. He has stopped trying to view his life from nowhere. He is simply standing here, looking at her, and there is no argument left to be had.

      There is a specific kind of relief in that. We spend so much of our lives trying to prove that our choices are correct, that our loves are deserved, that our happiness is efficient. But some things are not matters of calculation. They are matters of fact. He is not marrying her because it is the right thing to do. He is not marrying her because it will improve him, or because it will do good in the world, though I know it will. He is marrying her because she is the person he chooses. And in this hall, with the rain likely starting outside and the roast beef getting cold, that is the only reason that matters.

