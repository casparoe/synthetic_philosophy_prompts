answer: |-
  The wedge is that Lewis evaluates counterfactuals by comparing whole worlds to preserve laws, yielding absolute causal facts, whereas Interventionism evaluates them by surgically altering equations within a model, yielding causal claims relative to your variable set.

  ### Phase 1: Prerequisites and Dependencies (First 30 Minutes)
  **What must be in place first:**
  1.  **Shared Counterfactual Syntax:** Ensure both halves agree that $A \boxright C$ means "If A had been the case, C would have been the case." Do not let the biostats reduce this to $P(C|do(A))$ yet; do not let the philosophers reduce this to "similarity of worlds" yet. Keep it neutral.
  2.  **The Definition of "Event" vs. "Variable":** Establish that Lewis talks about *events* (spatiotemporal particulars) while Interventionists talk about *variables* (nodes in a structure). This is the ontological precondition for the wedge.

  **Dependency:** You cannot explain the divergence in answers until you establish that Lewis tests counterfactuals by *world-matching* while Interventionists test them by *model-surgery*.

  ### Phase 2: The One Case (Hours 1–2)
  **The Case:** **Symmetric Overdetermination (The Two Switches).**
  *   **Setup:** Two switches, A and B. Either switch alone turns on Light L. Both are flipped. Light L is on.
  *   **Question:** Did Switch A cause Light L to be on?
  *   **What it must have:** Simultaneity (no temporal precedence), Independence (A does not cause B), Determinism (no probabilities).
  *   **What it must not smuggle in:** Do not use preemption (where one cuts the other off); Lewis has complex fixes for preemption that muddy the water. Do not use probabilistic causation. Keep it binary.

  **The Divergence:**
  *   **Lewis (1973 Account):** Evaluate "If A had not been flipped, would L be on?" Since B is still flipped, L is still on. Counterfactual dependence fails. **Verdict: No Causation.**
  *   **Interventionism:** Evaluate $P(L=on | do(A=off))$. Crucially, the *do*-operator holds structural equations fixed. When you set $A=off$, you do not let B change to compensate. You hold B at its actual value (on). L turns off. **Verdict: Causation.**

  **Tempting Examples That Fail:**
  *   **Preemption (Assassin A shoots, B holds fire):** Lewis and Interventionism often converge here (both say A causes death). Do not use this; it suggests harmony.
  *   **Common Cause (Barometer/Storm):** Both say Barometer does not cause Storm. Converges.
  *   **Probabilistic Smoking/Cancer:** Both say Yes. Converges.

  ### Phase 3: Misconceptions and Interceptions (Hour 2–3)
  **Philosophy Grad Students:**
  *   **Misconception:** "DAGs are just heuristic diagrams for Lewisian counterfactuals."
  *   **Interception Point:** Immediately after presenting the Two Switches case. When they try to save Lewis by appealing to "quasi-dependence" or "influence," stop them. Show that the *do*-operator is a mathematical instruction to sever arrows, not a metaphysical claim about world similarity. The DAG *defines* the counterfactual, it doesn't illustrate it.

  **Epi/Biostat People:**
  *   **Misconception:** "The DAG reveals the True Causal Structure independent of our choices."
  *   **Interception Point:** When moving from the Two Switches to the implications. They will assume the "Yes" verdict from Interventionism is the *absolute* truth. You must correct this: Interventionism says "Yes" only relative to the model where A and B are distinct variables.

  ### Phase 4: The Wedge Confirmation (Hour 3)
  **The Consequence (User's Hunch Validated):**
  *   Explain that the Two Switches verdict relies on carving the world into variables A and B.
  *   **Scenario:** If you carve the variable as $S = (A \lor B)$, then $S$ causes $L$. If you carve as $A$ and $B$, then $A$ causes $L$ (interventionist) or neither (Lewis).
  *   **Lewis:** Causation is a feature of the world (absolute). If A caused L, it did so regardless of how we describe it.
  *   **Interventionism:** Causation is a feature of the model (relative). "A causes L" is shorthand for "In model M containing variables {A, B, L}, A causes L."

  **What to Openly Skip:**
  *   **Lewis's Similarity Weighting:** Do not explain how Lewis weighs "miracles" vs. "fact matching." It's a distraction. Just state that Lewis prioritizes avoiding large miracles over matching particular facts.
  *   **Do-Calculus Rules:** Do not teach the three rules of do-calculus. You only need the definition of $do(X=x)$ as "sever incoming arrows to X."
  *   **Lewis's Later Revisions:** Acknowledge Lewis tried to fix overdetermination in 2000 ("Causation as Influence"), but note that this requires abandoning simple counterfactual dependence, whereas Interventionism keeps dependence but changes the evaluation method.

  ### Closing Question
  **"If you and I analyze the same dataset but you include a mediator variable that I omit, and we reach opposite conclusions about whether the treatment causes the outcome, who is wrong?"**

  *   **Correct Answer (showing they got the wedge):** "Neither, necessarily."
  *   **Why:** For the Interventionist, causal claims are relative to the variable set (model). Your claim is true relative to your DAG; mine is true relative to mine. For the Lewisian, one of us must be wrong about the metaphysical fact. If they answer "The one with the wrong DAG is wrong," they missed the relativity wedge. If they answer "Both are wrong because causation is absolute," they missed the Interventionist wedge.
