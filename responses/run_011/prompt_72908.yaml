prompt: |-
  I am preparing a seminar on the philosophical commitments of mathematical practice, and formalized mathematics keeps striking me as a case where a community's implicit philosophy of foundations is unusually explicit — written into the tooling rather than left as background assumption. I would like a reconstruction of the implicit philosophy behind one particular design decision, not a history of it.

  The setup, described as fully as I can so that you will not need outside knowledge. Lean is a proof assistant whose core is a dependent type theory with a proof-irrelevant sort of propositions at the bottom. On top of that type theory the system assumes exactly three further axioms: propositional extensionality; a rule governing quotient types, which brings function extensionality along with it; and a choice principle, which turns a proof that something satisfying a property exists into an actual term denoting such a thing — it manufactures data out of a proposition. Mathlib, the large community-built library developed in this system, covers most of undergraduate mathematics and a good deal of graduate mathematics, and takes all three axioms as background infrastructure.

  Two features of the resulting practice interest me, and I suspect they sit uneasily together.

  First, axiom dependence is tracked and reportable. Every theorem in the library carries a machine-checked record of which of the three axioms its proof actually used, and any user can ask the system to print that record. Treating a theorem's axiom footprint as a legitimate object of inquiry — something one might ask about, document, or attempt to reduce — is an ordinary part of how the community works.

  Second, the choice axiom is nevertheless not economized. Any definition depending on it must be annotated as noncomputable, meaning the system's code generator cannot execute it; the annotation is applied and the definition is then used freely thereafter. Proofs invoke choice-dependent existence results — that every vector space has a basis, Hahn–Banach, Tychonoff, the existence of non-principal ultrafilters — without remark. In practice, a theorem whose footprint includes the choice axiom is not regarded as weaker, less informative, or in any way second-class relative to one whose footprint does not.

  There is a further wrinkle. In this foundation, excluded middle is not an independent assumption: by a Diaconescu-style argument it is derivable from the choice principle together with the other two axioms. Classical logic and the capacity to extract witnesses from existential propositions therefore come as a package. Unlike in set theory, where one can accept excluded middle while rejecting choice, here the two cannot be separated — and the axiom-tracking record consequently cannot distinguish a theorem that merely reasoned classically from one that genuinely required a strong existence assumption.

  My questions:

  1. What view of mathematical existence, and of what a proof is, does the combination of these features presuppose? Is it platonism about a completed set-theoretic universe, with the type theory treated as a convenient syntax for it (the usual relative-consistency arguments read the system off against a set theory with large cardinals)? Is it a separation-of-concerns quietism, on which questions of witness extraction are simply not the library's business? Is it something about proof irrelevance — that once you know a proposition is inhabited, the particular inhabitant is of no interest? Reconstruct the implicit theory as explicitly as you can.

  2. Which rival views does the design rule out, as opposed to merely sitting awkwardly with? Consider Bishop-style constructive mathematics, Martin-Löf type theory, Feferman-style predicativism, and the view on which the content of an existence proof is a method for producing witnesses. For each, say whether the practice strictly excludes it or whether the same infrastructure could be licensed from within it — and note that the existence of the noncomputable annotation may make the system look as though it keeps a door open for constructively minded users.

  3. Do the two features hang together? Meticulous axiom tracking presupposes that axiom dependence is a philosophically meaningful property of a theorem; the free use of the choice axiom presupposes that at least one such dependence does not matter. Is that an inconsistency in the practice, or is there a coherent implicit theory on which both are correct? If the latter, state the theory and say what else it commits the community to.

  4. Is the noncomputable annotation doing any philosophical work at all, or is it a purely engineering marker — a note that a definition cannot be run — that is easily mistaken for a principled concession to constructivism? Does your answer change anything you said in response to 1 through 3?

  5. Suppose the community decided to reverse course and treat choice as a scarce resource. What would have to change, and where would the practice break first? I would like a rough triage of the library into results that survive, results that require restatement in a weaker form, and results that are simply gone, together with an assessment of how much of the loss would follow from giving up excluded middle rather than from giving up choice, given that in this foundation the two are bundled. As a probe: how much of the library would remain available in a universe of sets in which dependent choice holds and every set of reals is Lebesgue measurable?

  Throughout, please distinguish what the practice strictly presupposes from what it merely fits well with, and flag the places where the practice is philosophically underdetermined — where several incompatible theories would license exactly the same behavior.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **Topic:** Philosophical commitments of mathematical practice in Lean/Mathlib.
      *   **Specific Focus:** The tension between meticulous axiom tracking (Feature 1) and the free, unapologetic use of the Choice axiom (Feature 2), especially given that Choice implies Excluded Middle (EM) in this system (Diaconescu).
      *   **Constraints:**
          *   Reconstruct the *implicit philosophy*, not just history.
          *   Address 5 specific questions.
          *   Distinguish between strict presuppositions and compatible fits.
          *   Flag philosophical underdetermination.
          *   Tone: Philosophical, analytical, precise (suitable for a seminar).

  2.  **Analyze the Context (Lean/Mathlib):**

      *   **Core:** Dependent Type Theory (DTT) with Proof Irrelevance (Prop).
      *   **Axioms:** PropExt, Quotients (implies FunExt), Choice (implies EM).
      *   **Practice:** Axiom tracking is standard. Choice is used freely, marked `noncomputable`, but not stigmatized.
      *   **Key Tension:** Why track axioms if you don't care about the "strongest" one (Choice)?
      *   **Key Constraint:** Choice + PropExt + Quotients $\to$ EM. You can't have Classical Logic without Choice here.

  3.  **Drafting Responses to Question 1: Implicit Philosophy of Existence and Proof:**

      *   *Observation:* The system treats propositions as subsingletons (proof irrelevant). Existence ($\exists x, P x$) means "the subtype is nonempty." Choice says "if nonempty, pick one."
      *   *Philosophy:* It's not strict Platonism (since it's type theory), but it's "Classical Structuralism."
      *   *Proof:* A proof is a certificate of truth. For Props, *which* certificate doesn't matter (irrelevance). For Data, it does.
      *   *Existence:* To exist is to be inhabitable. Choice bridges the gap between "inhabitable" (Prop) and "here is an inhabitant" (Data).
      *   *Tracking:* Why track? Not to avoid Choice, but to know *computability* status and to map the logical strength relative to *other* potential foundations (e.g., ZFC vs. ZF).
      *   *Reconstruction:* "Classical Type-Theoretic Realism." Mathematical objects exist in a completed universe. Proofs verify membership. The distinction between Prop and Type is ontological (truth vs. data), but Choice allows moving from truth to data when needed, at the cost of computability.
      *   *Underdetermination:* Is this Platonism or Formalism? The practice fits both. It fits a "ZFC-with-types" view and a "Pragmatic Classical" view.

  4.  **Drafting Responses to Question 2: Rival Views:**

      *   *Bishop/Constructive:* Strictly excluded *if* one insists all existence must be constructive. However, the `noncomputable` tag *could* allow a constructive user to isolate constructive parts. But the *default* culture excludes Bishop.
      *   *Martin-Löf (MLTT):* MLTT usually lacks PropExt/Quotients/Choice in the strong sense used here. The practice rules out *pure* MLTT as the *sole* foundation, but Lean is based on CIC (Calculus of Inductive Constructions), which is compatible with MLTT *minus* the axioms. The *use* of axioms rules out MLTT *philosophy*.
      *   *Feferman/Predicativism:* Mathlib is impredicative (Prop is impredicative). This rules out strict predicativism.
      *   *Witness-Extraction View:* The view that "existence = method" is ruled out for theorems using Choice. The `noncomputable` tag admits this failure.
      *   *Nuance:* The infrastructure *allows* constructive math (by avoiding axioms), but the *culture* (Mathlib) does not prioritize it.

  5.  **Drafting Responses to Question 3: Coherence of the Two Features:**

      *   *Tension:* Tracking implies importance; Free use implies unimportance.
      *   *Resolution:* Tracking isn't about *avoiding* Choice; it's about *computability* and *portability*.
      *   *Theory:* "Two-Tiered Mathematics."
          *   Tier 1: Computational/Constructive (Axiom-free). Valuable for algorithms.
          *   Tier 2: Classical/Structural (Axiom-heavy). Valuable for structure/theory.
      *   *Coherence:* Axiom tracking tells you which Tier you are in. It's not a moral judgment (Choice is bad); it's a functional label (Choice = non-executable).
      *   *Commitment:* This commits the community to the idea that "mathematics" includes both executable algorithms and non-structural existence claims, and the boundary must be monitored.

  6.  **Drafting Responses to Question 4: The `noncomputable` Annotation:**

      *   *Function:* It tells the kernel/VM "do not try to compile this to bytecode."
      *   *Philosophy:* It marks the transition from Prop (truth) to Type (data) via Choice.
      *   *Is it philosophical?* Yes, it enforces the Prop/Type distinction. It acknowledges that classical existence does not yield algorithms.
      *   *Does it change Q1-3?* It reinforces the "Two-Tiered" view. It prevents the "Constructive door" from being completely walled off, but it admits that the main library walks through the Classical door. It's not just engineering; it's a boundary marker between "knowing that" and "knowing how."

  7.  **Drafting Responses to Question 5: Reversing Course (Choice as Scarce):**

      *   *Scenario:* Treat Choice like a limited resource (e.g., Constructive Mathlib).
      *   *Impact:* Since Choice $\to$ EM, losing Choice means losing EM.
      *   *Triage:*
          *   *Survive:* Algebraic structures, combinatorics, finite math, constructive analysis.
          *   *Restate:* "There exists a basis" $\to$ "If V has a basis, then..." or working with specific bases. Hahn-Banach needs weak versions.
          *   *Gone:* Zorn's Lemma applications, Tychonoff (full), Ultrafilters, Non-measurable sets (good riddance?), Existence of non-constructive objects.
      *   *Lebesgue Measurability Probe:* In a world where all sets of reals are Lebesgue measurable (e.g., Solovay's model, requires DC + no full AC), you lose Hahn-Banach (analytic form), Tychonoff (full), and existence of non-measurable sets.
      *   *Assessment:* A huge chunk of "standard" graduate math (Functional Analysis, Topology, Set Theory) breaks. The loss is due to EM/Choice bundling. You can't keep Classical Logic without Choice in Lean. So the loss is total for classical analysis.
      *   *Practice Break:* The "definition by choice" pattern (e.g., "let $x$ be such that...") would break everywhere.

  8.  **Review and Refine:**

      *   *Check Constraints:* Did I distinguish strict presuppositions from fits? Yes. Did I flag underdetermination? Yes.
      *   *Tone Check:* Is it seminar-appropriate? Needs to be rigorous, avoiding slang.
      *   *Specific Lean Detail:* Ensure I acknowledge that `noncomputable` is technically about the VM, but philosophically about constructivity. Ensure I acknowledge the Prop/Type distinction is crucial for the Diaconescu result.
      *   *Refining Q1:* The "Platonism" angle needs care. It's not necessarily set-theoretic Platonism. It's "Classical Structuralism." The types *are* the objects.
      *   *Refining Q3:* The "Two-Tiered" theory is strong. Emphasize that tracking is for *information*, not *prohibition*.
      *   *Refining Q5:* Be precise about the EM/Choice bundle. In Lean, you can't have EM without Choice (due to Prop extensionality + Quotients). So rejecting Choice rejects EM. This is a crucial distinction from ZFC where ZF+EM is consistent (wait, no, ZF+EM is consistent, ZF+notAC is consistent. But in Lean, Choice *implies* EM). So in Lean, rejecting Choice forces Intuitionistic Logic. This is a massive break.

  9.  **Final Polish:** Organize by the 5 questions. Use clear headings. Ensure the distinction between "system capabilities" and "community practice" is clear. (Self-Correction: Make sure to emphasize that the *system* allows constructive math, but *Mathlib practice* does not prioritize it.)

