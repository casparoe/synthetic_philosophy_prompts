answer: |-
  ### Exam Item: Decision Theory Seminar (Final)
  **Time Allowed:** 45 Minutes
  **Total Marks:** 25

  **Question 1: The Value of Information**

  An agent must choose between Action $A$ (invest in a friend's venture) and Action $B$ (do nothing). The venture either Succeeds ($S$) or Fails ($F$).
  *   **Priors:** $P(S) = 0.1$, $P(F) = 0.9$.
  *   **Utilities:** $U(A, S) = 90$, $U(A, F) = -20$. $U(B, S) = 0$, $U(B, F) = 0$.

  **(i)** Calculate the expected utility of the optimal act without information. Then, calculate the Expected Value of Perfect Information (EVPI). Finally, consider an imperfect signal $\sigma_1$ with likelihoods $P(+|S) = 0.8$ and $P(+|F) = 0.1$. Compute the posteriors $P(S|+)$ and $P(S|-)$, determine the optimal act for each signal realization, and calculate the expected utility of acting with this signal. **[8 marks]**

  **(ii)** Derive the probability threshold $p^*$ for $S$ at which the agent is indifferent between $A$ and $B$. Now consider a weaker signal $\sigma_2$ with $P(+|S) = 0.3$ and $P(+|F) = 0.2$. Show that the decision value of $\sigma_2$ is exactly zero. Explain explicitly how a signal can have positive Shannon mutual information but zero decision-theoretic value. **[7 marks]**

  **(iii)** Suppose the utility structure changes: if the agent learns for *certain* that $F$ is true, the knowledge itself causes distress, attaching a fixed $-25$ utility penalty to *every* action in that branch (e.g., $U(B, F, \text{known}) = -25$). Show that EVPI is now $-13.5$. Identify precisely which hypothesis of Good's Theorem this violates. Is this a counterexample to the theorem or a failure of application? Does the argument "you could have chosen not to look" rescue the non-negativity claim? **[10 marks]**

  ***

  ### Model Answer

  **(i) Baseline and Information Values**
  Without information, $EU(A) = 0.1(90) + 0.9(-20) = 9 - 18 = -9$. $EU(B) = 0$. The optimal act is $B$ with value **0**.

  With perfect information, we choose $A$ if $S$ (payoff 90) and $B$ if $F$ (payoff 0).
  $EU_{perfect} = 0.1(90) + 0.9(0) = 9$.
  $EVPI = 9 - 0 = \mathbf{9}$.

  For signal $\sigma_1$:
  Marginal $P(+) = 0.1(0.8) + 0.9(0.1) = 0.17$. Marginal $P(-) = 0.83$.
  Posterior $P(S|+) = \frac{0.08}{0.17} \approx 0.47$.
  Posterior $P(S|-) = \frac{0.02}{0.83} \approx 0.024$.
  At $+$, $EU(A) \approx 0.47(90) + 0.53(-20) = 31.7 > 0$. Choose $A$.
  At $-$, $EU(A) \approx 0.024(90) + 0.976(-20) = -17.36 < 0$. Choose $B$.
  $EU_{\sigma1} = 0.17(31.7) + 0.83(0) \approx \mathbf{5.39}$.

  **(ii) Thresholds and Informativeness**
  Indifference occurs when $p(90) + (1-p)(-20) = 0 \Rightarrow 110p = 20 \Rightarrow p^* = 2/11 \approx \mathbf{0.18}$.
  For signal $\sigma_2$: $P(+) = 0.1(0.3) + 0.9(0.2) = 0.21$.
  $P(S|+) = 0.03/0.21 \approx 0.14$.
  $P(S|-) = 0.07/0.79 \approx 0.09$.
  Both posteriors are below $p^*$. The agent chooses $B$ regardless of the signal. Since the action plan does not change, the expected utility remains 0. Decision value is **0**.

  Shannon information measures the reduction in entropy (uncertainty). $\sigma_2$ shifts probabilities (from 0.1 to 0.14 or 0.09), reducing entropy. However, decision value depends on the *convexity* of the utility function over actions. If probability shifts do not cross the threshold required to switch actions, the $\max$ operator yields the same result as the prior. Informativeness is about belief change; decision value is about action change.

  **(iii) Costly Knowledge and Good's Theorem**
  With the distress penalty:
  Prior act remains $B$ ($EU=0$).
  With perfect info: If $S$ (0.1), choose $A$ ($U=90$). If $F$ (0.9), choose $B$ ($U=0 - 25 = -25$).
  $EU_{info} = 0.1(90) + 0.9(-25) = 9 - 22.5 = -13.5$.
  Value = $-13.5 - 0 = \mathbf{-13.5}$.

  Good's Theorem states $V(\mathcal{I}) \geq 0$. This relies on the assumption that utility is defined over **Action-State** pairs only, $U(a, \omega)$, and is independent of the information partition. Here, utility depends on the information state itself ($U(a, \omega, \mathcal{I})$). This violates the **utility independence** hypothesis.

  This is **not a counterexample** to the theorem, but a failure of application. The theorem is a mathematical truth given its axioms; the scenario simply falls outside the axioms' scope. The "choose not to look" reply fails because the negative value arises *conditional* on looking. The theorem proves that *if* you look, you can do no worse than ignoring the content. But here, "ignoring the content" is impossible; the utility cost is attached to the *possession* of the knowledge, not the action taken based on it. The domination argument ($\mathbb{E}[\max_a U] \geq \max_a \mathbb{E}[U]$) holds only if the $U$ inside the expectation is identical to the $U$ outside. Here, the $U$ changes upon information acquisition, breaking the inequality.

  ***

  ### Marking Scheme (Total 25)

  **Part (i) [8 Marks]**
  *   **Correct Prior EU (0) & Act (B):** 2 marks. (Deduct 1 if arithmetic error but logic sound).
  *   **Correct EVPI (9):** 2 marks.
  *   **Correct Posteriors for $\sigma_1$:** 2 marks. (Allow rounding errors $\pm 0.01$).
  *   **Correct $EU_{\sigma1}$ (5.39):** 2 marks. (Follow through errors allowed if method correct).

  **Part (ii) [7 Marks]**
  *   **Correct Threshold ($2/11$ or $0.18$):** 2 marks.
  *   **Correct Posteriors for $\sigma_2$ & Decision (Always B):** 2 marks.
  *   **Conceptual Distinction:** 3 marks.
      *   *Solid Pass (2 marks):* Notes signal changes beliefs but not actions.
      *   *First Class (3 marks):* Explicitly distinguishes Shannon entropy (belief) from Value of Information (action switching/convexity). Uses the term "threshold" or "switching point."

  **Part (iii) [10 Marks]**
  *   **Correct Calculation (-13.5):** 3 marks.
  *   **Identify Violated Hypothesis:** 3 marks.
      *   *Solid Pass:* Notes utility changed or "cost of information."
      *   *First Class:* Specifies **utility independence** from information state/partition. States $U$ must be $U(a, \omega)$, not $U(a, \omega, \text{knowledge})$.
  *   **Counterexample vs. Application:** 2 marks. Must identify as failure of application/fit, not refutation of theorem.
  *   **"Choose Not to Look" Analysis:** 2 marks. Must explain that the theorem guarantees non-negative value *given* observation, but cannot prevent the utility function from penalizing the observation itself.

  **Common Mistakes & Penalties**
  *   **Unweighted Payoffs:** Calculating informed branch payoffs without multiplying by signal priors (e.g., averaging 90 and 0 directly). **(-3 marks)**.
  *   **Money vs. Utility:** Treating the -25 penalty as a monetary cost subtracted from EU *after* maximization rather than inside the utility function. **(-2 marks)**.
  *   **Refutation Claim:** Claiming Good's Theorem is false based on Part (iii). **(-4 marks on Part iii)**.
  *   **Shannon Conflation:** Asserting $\sigma_2$ must have positive value because it has mutual information. **(-3 marks on Part ii)**.
  *   **Empirical Claim:** Treating the theorem as a claim about human psychology (e.g., "people hate bad news") rather than rational agency. **(-2 marks)**.

  **Student Cohort Notes**
  *   **Econ Students:** Likely to calculate Part (i) perfectly but fail Part (iii) by treating the -25 as a transaction cost rather than a utility function violation.
  *   **Philosophy Students:** Likely to grasp Part (iii) conceptually but lose marks on Part (i) arithmetic or fail to invoke the convexity/Jensen argument explicitly in Part (ii).
