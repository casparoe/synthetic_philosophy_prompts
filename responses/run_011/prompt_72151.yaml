answer: |-
  # Research Proposal

  **Title:** The Epistemic Price of Infinity: Verification Costs and the St. Petersburg Paradox

  **1. Statement of the Problem**
  The St. Petersburg paradox arises when a decision agent is offered a lottery with infinite expected value (EV), yet intuition suggests a finite willingness to pay. Standard resolutions within decision theory typically modify the utility function (bounded utility) or the physical constraints of the game (finite bankroll). However, these solutions face well-known objections. Bounded utility functions are vulnerable to "Super-St. Petersburg" variants where payoffs grow sufficiently fast to overwhelm any fixed bound. Finite bankroll solutions reduce the problem to empirical accounting, failing to address the normative question of rational choice under idealized conditions.

  This project proposes a distinct resolution: the divergence arises not from the payoff structure or the agent's psychology, but from an unrealistic idealization of *epistemic access*. Standard formulations assume the probability distribution and payoff cap are known costlessly. I argue that for any agent embedded in a physical reality, verifying the parameters of a high-variance game incurs a verification cost that scales with the magnitude of the payoff cap. If the cost of verifying the counterparty's solvency grows linearly with the logarithm of the maximum payout, the net expected value of the game converges or becomes negative, dissolving the paradox without requiring arbitrary utility bounds.

  **2. Research Question**
  The central question is: *Does incorporating epistemic verification costs into the St. Petersburg decision problem resolve the expectation divergence in a manner consistent with Expected Utility Theory (EUT), or does it necessitate a revision of normative decision rules?*

  Subsidiary questions include:
  1.  Is the cost of parameter verification a structural constraint on rational choice, or merely a pragmatic friction?
  2.  Do robust statistical estimators (e.g., trimmed means), which converge where expectations do not, offer a normative alternative to expectation maximization for finite agents, or are they merely descriptive heuristics?

  **3. Argument for Openness**
  Existing literature largely treats the St. Petersburg paradox as a problem of *valuation* (how to map money to utility) or *physics* (what is the maximum possible money). The epistemic dimension is under-theorized. While economists have explored "rational inattention" and "costly contemplation," these models are rarely applied to the foundational puzzles of decision theory.

  Simply bounding utility is insufficient because it restricts the agent's preference structure to solve a problem about the world. Simply bounding the bankroll is insufficient because it turns a normative paradox into an empirical observation. The verification cost approach preserves the linearity of utility (respecting the intuition that more money is better) while acknowledging that *knowing* one has access to that money is a resource-intensive process. This leaves the question genuinely open: if verification costs are normative requirements for rational belief, the infinite expectation never actually obtains for a rational agent. If they are merely pragmatic frictions, the paradox remains for ideal agents. Determining which is the case requires philosophical analysis, not just mathematical modeling.

  **4. Methodology and Work Plan**
  The project will proceed over four terms, balancing formal modeling with conceptual analysis. Given the constraint of eight hours per week, the scope is tightly focused on the verification cost model, with the statistical analysis serving as a secondary illustration.

  *   **Term 1: Literature and Formalization.**
      *   *Activity:* Review standard resolutions (Menger, Peters, etc.). Formalize the "Verification Cost" model.
      *   *Output:* A working paper defining the cost function $C(L)$, where $L$ is the log-cap of the game.
      *   *Nature:* Conceptual review and preliminary algebra.
  *   **Term 2: Integration with Decision Theory.**
      *   *Activity:* Integrate $C(L)$ into the Expected Utility calculus. Determine if this requires modifying EUT axioms or simply adding a cost term to the outcome space.
      *   *Output:* Draft of the core argument: "The St. Petersburg Game as an Epistemic Task."
      *   *Nature:* Formal decision theory.
  *   **Term 3: The Statistical Hunch (Contingent).**
      *   *Activity:* Investigate the relationship between non-convergent expectations and robust statistics (medians/trimmed means).
      *   *Output:* An appendix or short section analyzing whether finite sampling justifies a normative shift away from expectation.
      *   *Nature:* Simulation and philosophical interpretation of statistics. *Note: If time is constrained, this section will be reduced to a thought experiment regarding finite sampling.*
  *   **Term 4: Synthesis and Thesis.**
      *   *Activity:* Combine the epistemic cost argument with the decision-theoretic implications. Finalize thesis.
      *   *Output:* MA Dissertation.
      *   *Nature:* Conceptual synthesis.

  **5. Defense Against Alternatives**
  The most obvious alternative is to adopt a bounded utility function (e.g., logarithmic utility). I reject this as the primary solution because it solves the paradox by fiat: it asserts agents *cannot* value high payoffs linearly. My proposal asserts agents *cannot verify* high payoffs costlessly. This is a stronger claim because it applies even to agents with linear utility preferences.

  Another alternative is the Ergodicity Economics approach (time-averaging vs. ensemble-averaging). While compatible with my view, ergodicity focuses on repeated play dynamics. My proposal addresses the single-shot case by focusing on the setup cost prior to play. The verification cost argument complements ergodicity by explaining why the "infinite ensemble" is inaccessible even in principle.

  **6. Success and Failure Criteria**
  *   **Success:** A formal model demonstrating that for any rational agent, the cost of verifying a payoff cap $2^L$ scales sufficiently with $L$ to render the net expected value finite. A clear classification of whether this cost is a normative requirement of rationality or a pragmatic constraint.
  *   **Failure:** If the verification cost function can be shown to be arbitrarily small (e.g., if trust can be established instantly via reputation), the divergence returns. Alternatively, if incorporating the cost requires violating core axioms of EUT (like Independence) without justification, the project fails to preserve the theoretical framework it aims to save.

  **7. Scoping and Prioritization**
  Given the part-time nature of the degree, prioritization is essential.
  *   **Primary Hunch:** The Epistemic/Verification Cost model. This is the philosophically robust core. It engages directly with the norms of belief and decision.
  *   **Secondary Hunch:** The Monte Carlo/Robust Statistics angle. This risks conflating *descriptive* behavior (how simulations act) with *normative* rules (how agents ought to act). If time permits, it will serve as an illustrative analogy for the "finite agent" constraint. If the workload becomes unmanageable, this section will be cut to an appendix or omitted entirely.
  *   **Dropped:** I will not attempt to derive a new universal decision theory. The goal is to resolve the specific paradox within existing frameworks by correcting the input parameters (information costs).

  **Conclusion**
  This project leverages my background in engineering to treat the St. Petersburg game not as a mathematical abstraction, but as a system requiring initialization and verification. By shifting the locus of the "bound" from the utility function to the information channel, I aim to show that the paradox relies on an impossible epistemic condition. This preserves the generality of Expected Utility Theory while grounding it in the physical realities of information processing.

  ***

  # Supervisor Note: Critical Assessment

  **1. Framing and Clarity**
  Your framing is strong, but you must be careful not to drift into economics. Philosophy departments care about *normativity* (what agents ought to do), whereas your engineering background might lead you to describe *mechanisms* (how systems work). You must argue why paying a verification cost is a *rational requirement*, not just a practical annoyance. If a supervisor can say, "An ideal agent doesn't pay verification costs," your argument collapses. You need to defend the claim that *no* agent, even idealized, can access probability distributions without cost.

  **2. Arithmetic Check**
  Your arithmetic is directionally correct but relies on specific assumptions.
  *   **Expectation:** For a cap of $2^L$, the expected value is indeed approximately $L + 1$ (assuming linear utility).
  *   **Cost:** You posit cost $c \cdot L$.
  *   **Net:** $(L + 1) - cL = L(1-c) + 1$.
  *   **Verdict:** If $c > 1$, the limit as $L \to \infty$ is $-\infty$. The math holds *if* utility is linear.
  *   **Risk:** If you allow logarithmic utility (standard in economics), the value of the cap grows as $\log(2^L) = L$. The cost also grows as $L$. You then need to prove the coefficient of the cost is higher than the coefficient of the utility gain. Your argument is strongest if you maintain linear utility to show that *even* with linear utility, the game fails due to information costs.

  **3. Dependence on Arithmetic**
  The proposal does not depend on the exact coefficients, but on the *scaling relationship*. You must argue that verification cost scales *at least* linearly with the log of the payout. If verification cost scales slower (e.g., $\sqrt{L}$), the divergence returns. You need a philosophical argument for why verifying a billion-dollar guarantee is proportionally harder than verifying a thousand-dollar one, not just absolutely harder.

  **4. Novelty and Residual Questions**
  The core idea (costly information) exists in economics under "Rational Inattention" (Sims, 2003) and "Costly Contemplation" (Ergin, Sarver). However, applying this specifically to dissolve the St. Petersburg Paradox is a fresh angle. Most philosophical treatments focus on utility bounds or ergodicity.
  *   **Residual Question:** The hard philosophical work isn't the math; it's justifying *why* the cost function exists normatively. Is it a metaphysical limit on knowledge? Or a pragmatic limit on finite beings? If it's the latter, does the paradox still hold for God (an infinite agent)? If the paradox only dissolves for humans, is it still a paradox for *Decision Theory*? You need to decide if you are solving the paradox for *rationality* or for *humans*.

  **5. Simulation Component**
  Be very careful with the Monte Carlo hunch. In philosophy, "the simulation drifts" is a description of the math, not a normative argument. Using trimmed means is a statistical technique, not necessarily a decision rule. I recommend keeping this as a minor illustrative point about "finite sampling" rather than a proposal to replace Expected Utility with Median Utility. Replacing EUT is a much heavier lift than adding a cost term. Stick to the cost term.
