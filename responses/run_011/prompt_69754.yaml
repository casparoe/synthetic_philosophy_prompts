  17. (Final check on "Interruption Mechanic"): The prompt asks for "how it gets administered with no confederate." If I use an Observer student, are they a confederate? No, if they are following a public rule. But to be safe, let's make the interruption *environmental* and *instructor-led* via a timer sound. The Instructor rings a bell, and the *Observer* checks a "State Card" that corresponds to the bell ring. This distributes the agency. Actually, simplest is best: The Instructor places an obstacle. But the prompt says "no confederate." The Instructor is not a confederate. Okay, I will have the Instructor physically move a chair. That's the interruption. The Agent must react *only* via script.

