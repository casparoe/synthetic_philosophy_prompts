      *   Predictable errors? Yes.
      *   Honest limitation? Yes.

  14. **Final Tweak:** Make sure the "Flexible Instruction" trap is explicit. The instruction "Use your best judgment" is given, but defined in the manual as "Consult Rule Set B," which is also rigid. This highlights the friend's point perfectly.

  15. (Self-Correction during drafting): Wait, if the Agent is a human, they *will* use judgment. I need to constrain them heavily. "You are a machine. You cannot speak unless the script says 'SPEAK'." This is crucial. If they break character, the experiment fails. I need to emphasize this constraint in the instructions.

