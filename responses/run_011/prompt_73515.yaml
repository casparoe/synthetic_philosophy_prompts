prompt: |-
  My band is putting an English version of an old French song into a wedding set, and the melody locks everything down — every line has to land the same number of syllables on the same beats, or it sounds like mush. So I've been rewriting the lyrics for weeks, swapping images, ditching alot of the literal meaning, just to keep the rhyme scheme and make the stresses fall right. Then our guitarist tells me I'm wasting my time: a translation is good if it says the same thing, so just sing what the French words actually mean and if it doesn't rhyme, who cares, nobodys checking. He ran the original through one of those translator apps, got something perfectly clear and perfectly flat, and says that's the real translation and mine is basically a different song. I feel like he's missing something big but I can't get it into words. Is he right that as long as the meaning comes across, the form is just decoration? And practically — one line turns on a pun that has no English equivalent at all. Do I keep the joke and change what the line is about, or keep what it's about and lose the joke?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Context:** A band is performing an English version of an old French song at a wedding.
      *   **Constraint:** The melody is rigid ("locks everything down"). Syllable count and stress patterns *must* match the original music, or it sounds bad ("like mush").
      *   **Conflict:** The user (lyricist) has been rewriting lyrics to fit the music (rhyme, meter, stress), sacrificing literal meaning. The guitarist argues that "translation" means literal accuracy, form is decoration, and singable lyrics don't matter as much as semantic fidelity. He used a machine translation as the "gold standard."
      *   **Core Question:** Is the guitarist right? Is form just decoration?
      *   **Specific Problem:** One line relies on a pun with no English equivalent. Keep the joke (change meaning) or keep the meaning (lose the joke)?

  2.  **Evaluate the Guitarist's Claim:**
      *   *Claim:* "A translation is good if it says the same thing... form is just decoration."
      *   *Reality:* This is a fundamental misunderstanding of *song* translation vs. *text* translation.
      *   *Song Translation:* The music is a constraint. If the words don't fit the rhythm, the song fails as a *performance*. A singable translation (lyric adaptation) prioritizes prosody (stress, rhythm, vowel sounds) over literal semantic equivalence.
      *   *Text Translation:* Prioritizes semantic accuracy.
      *   *Verdict:* The guitarist is wrong in the context of a live musical performance, especially at a wedding where flow and emotion matter more than linguistic forensics.

  3.  **Address the "Form vs. Meaning" Debate:**
      *   In poetry and song, form *is* meaning. The rhythm creates the emotion.
      *   If the stresses are wrong, the singer stumbles, the audience feels the awkwardness, and the emotional impact is lost.
      *   "Singing what the French words actually mean" often results in "translationese" — clunky, unnatural phrasing that kills the vibe.

  4.  **Tackle the Specific Pun Problem:**
      *   *Option A: Keep the joke, change meaning.* Risk: Confuses the narrative.
      *   *Option B: Keep meaning, lose joke.* Risk: Flattens the wit/charm.
      *   *Option C: Find a functional equivalent.* (Best practice in localization/translation).
      *   *Option D: Cut the line/change the approach.*
      *   *Context:* It's a wedding. Mood is key. A joke that lands is better than a literal meaning that falls flat.

  5.  **Formulate the Advice:**
      *   **Validate the User:** Acknowledge their hard work and intuition. They are right; the guitarist is applying the wrong standard.
      *   **Define the Task:** Distinguish between "Literal Translation" (for study) and "Lyric Adaptation" (for performance). Use terms like "prosody," "singability," and "underlay."
      *   **Explain Why Form Matters:** Music + Words = Unified Art. If the rhythm breaks, the spell breaks.
      *   **Address the Wedding Context:** Guests are there to feel, not to analyze French syntax. Flow and emotion trump semantic precision.
      *   **Solve the Pun:** Offer a strategy for untranslatable wordplay.
      *   **Provide Arguments for the Guitarist:** Give the user concrete points to explain *why* their version is better for the band.

  6.  **Drafting the Response (Iterative refinement):**
