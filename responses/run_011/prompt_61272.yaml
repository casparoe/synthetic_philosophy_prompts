answer: |-
  **Project Title:** The Scaffolding of Abundance: On the Temporal Structure of the Keynesian Good Life

  **The Research Question**
  Keynes's *Economic Possibilities for our Grandchildren* posits that technological abundance will liberate humanity from economic necessity, allowing life to be organized around activities valued for themselves rather than for their future returns. Standard critiques fault this prediction empirically (we still work long hours) or psychologically (wants are relative and insatiable). This project pursues a third, structural objection: Is the "purposive temperament" required to build abundance functionally dependent on the condition of scarcity it is designed to overcome?

  The precise question is: **Does the capacity for non-instrumental living depend structurally on the habit of deferral formed under economic necessity?** If the disposition capable of inhabiting the good life is produced only by the arrangements the good life is meant to supersede, then abundance does not merely fail to arrive; it dissolves the subject capable of receiving it.

  **Distinction from Existing Critiques**
  This question is distinct from the empirical objection that productivity gains were swallowed by consumption. That objection accepts Keynes's definition of the good life but disputes the timeline. It is also distinct from the "relative wants" objection, which argues that status competition prevents satisfaction. That objection assumes desire is infinite. My argument is narrower: it suggests desire may be finite, but the *mechanism* for enjoying non-instrumental time is atrophied by the very success of the instrumental mechanism. Standard defences argue that culture lags behind technology. I argue the lag is not cultural but constitutive: the "money-morality" Keynes asks us to retain for a century longer is not merely a tool to reach the goal, but the load-bearing wall of the personality type that arrives there. Neither empirical data on working hours nor data on happiness indices can settle this, as they measure outcomes, not the structural coherence of the agent experiencing them.

  **Methodology and Timeline**
  The project employs a dual method: textual excavation and constructed case-portraits.

  *Months 1–3: Textual Excavation.* Close reading of *Economic Possibilities* alongside Keynes's biographical writings and correspondence regarding character, thrift, and the "love of money as a possession." I will map the implicit psychology of the "investor" versus the "liver."
  *Months 4–6: Construction of Case-Portraits.* I will construct four composite life-narratives: The Retiree (cessation by age), The Inheritor (cessation by windfall), The Buyout (cessation by valuation), and The Disabled (cessation by incapacity). These are not interviews but structured thought experiments. They will isolate the variable of "exit from necessity" while holding culture and class constant.
  *Months 7–9: Stress-Testing.* I will subject these portraits to logical scrutiny against the textual findings from Months 1–3. Where the argument makes empirical claims about psychological adaptation, I will specify the required data. For example, if the project claims that sudden wealth erodes the capacity for delayed gratification, the required finding would be longitudinal data on decision-making timeframes among lottery winners versus gradual accumulators. I will consult with the fellowship's economists to identify existing datasets that could confirm or falsify these psychological premises, though I will not perform the statistical analysis myself.
  *Months 10–12: Synthesis.* Drafting the manuscript, focusing on the distinction between the *formation* of the temperament and the *enjoyment* of the leisure.

  **Epistemic Status of the Portraits**
  The case-portraits serve as existence proofs, not frequency data. Their epistemic work is to demonstrate *possibility* and *coherence*. They show that a specific psychological contradiction is intelligible and narratively consistent. They cannot prove that this contradiction is universal or statistically dominant.
  *   **Probative:** A portrait is probative if it reveals a logical tension in the transition from instrumental to non-instrumental time that economic models overlook (e.g., the loss of temporal structure leading to anxiety rather than liberation).
  *   **Decorative:** A portrait becomes decorative if it relies on idiosyncratic pathology or anecdotal colour without illuminating the structural constraint. To avoid this, each portrait must adhere to strict constraints regarding income and social capital, varying only the *origin* of the leisure.

  **Success and Failure Conditions**
  *   **Success:** A successful result is a taxonomy of the "purposive temperament" that explains why the transition to the good life is not merely a policy problem but an anthropological one. It would demonstrate that Keynes's plea to keep the "old morality" is not a transitional bridge but a permanent requirement, thereby contradicting the promise of the essay.
  *   **Failure:** The project fails if it cannot distinguish between a psychological claim (how dispositions form) and a normative claim (how life should be lived). If the difficulty dissolves into the tautology that "people who like work work," the argument collapses. Similarly, if the case-portraits rely on romanticizing idleness rather than analyzing the structure of time, the project fails. I also acknowledge the risk that the "temperament" is too vague to be analytically useful; if I cannot define it without recourse to moralizing, I will abandon the distinction.

  **Feasibility Assessment**
  Twelve months is sufficient for the textual analysis and the construction of the portraits. It is tight for the validation of the empirical premises. If time compresses, I will cut the historical context of Keynes's contemporaries (Months 1–3) to focus entirely on the logic of the portraits and the specification of the empirical tests. The core argument stands on the logical paradox, not the history of economic thought.

  **Why a Novelist?**
  Labour economists model agents with fixed preferences; historians of thought track the evolution of the models. Neither is equipped to investigate the *formation* of the agent's interiority. Economics treats the capacity for deferred gratification as a parameter; literature treats it as a plot. A novelist's expertise lies in rendering how character is forged by constraint and how that character behaves when the constraint is removed. This project requires a method capable of simulating a life lived under contradictory temporal demands. Only a writer trained in the architecture of character can construct case-portraits that are rigorous enough to function as thought experiments yet nuanced enough to capture the psychological texture of the "purposive temperament." I offer not data, but a stress-test of the human subject assumed by the data.
