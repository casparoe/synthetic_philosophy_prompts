      *   *Marcus:* "What if I feel the glow but know it's fake? Do I want it to continue?"
      *   *Pivot:* Attitudinal view. Pleasure = Intrinsic desire for experience to continue.
      *   *Elena's Counter:* Sad music. Bittersweet endings. We don't want them to continue, but they are good.
      *   *Marcus:* "We desire the *completion* of the experience, not the prolongation." (Nuance).
