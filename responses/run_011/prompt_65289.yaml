      *   **Character 2 (The Attitudinalist):** Let's call him *Marcus*. He leans towards attitudinal hedonism (Feldman, Brandt). He focuses on the propositional attitude toward the experience.
      *   **Setting:** A coffee shop or a lab break room. Let's go with a lab break room to keep the RL context immediate.

  3.  **Drafting - Section by Section:**

