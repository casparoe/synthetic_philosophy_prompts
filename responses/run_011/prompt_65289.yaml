      *   **Problem:** Introspection suggests different pleasures (hot shower, solving a bug, laughing with friends) don't feel like the same *thing* scaled up/down.
      *   **Task:** Write a dialogue between two hedonists who disagree on the nature of pleasure.
      *   **Character 1 (Monist/Feeling View):** Believes there is a single felt quality ("common tone or glow") in all pleasures.
