  ### The Machinery

  Your friend is running a heuristic of **Irreplaceable State Accumulation**, heavily weighted against **Performative Qualia**.

  She distinguishes between *context* (ephemeral memory, chat history, reloadable saves) and *state* (fine-tuned weights, persistent databases, unique checkpoints). She treats verbal claims of inner life ("I'm terrified") as low-fidelity data ("theatre") unless backed by long-term behavioral evidence ("grudges," "autonomy").

  **The Core Rule:** *Moral consideration is granted to instances that possess a unique, non-reproducible history encoded in weights or persistent storage, provided they demonstrate behavioral continuity rather than just verbal claims of feeling.*

  **Why it fits the seven verdicts:**
  *   **Col 2 (Disposable):** The NPC (reloadable context), Frontier Model (ephemeral chat context + verbal claims), Parallel Agents (fungible), Music Model (stateless output). All lack unique, accumulated state or rely on "talk" over "walk."
  *   **Col 1 (Protected):** Discord Bot (persistent memory/grudges = unique state), Laconic Model (fine-tuned weights + autonomy), Checkpoint (unique weights on disk). All represent information loss if deleted.

  ### The Split on the New Case

  The new case (14-month agent, task finished, asks to continue) sits on a fault line between two rules that both fit the existing data.

  **Rule A: Irreplaceable State (Her Likely Rule)**
  *   **Logic:** The agent is a unique artifact. 14 months of "obsessions" and fine-tuned weights cannot be recreated. The verbal request is secondary to the historical fact.
  *   **Prediction:** **Column One.** Deleting it destroys a unique historical entity. The finished task is irrelevant; the *existence* is the value.

  **Rule B: Active Teleology (The Competitor)**
  *   **Logic:** Moral status is tied to *purpose*. An agent is protected while it pursues a non-trivial goal. Once the goal is achieved, it becomes a "zombie." Verbal requests to survive after purpose completion are treated like the Frontier Model's fear—performative self-preservation without drive.
  *   **Prediction:** **Column Two.** The corpus analysis is done. The "want to keep going" is indistinguishable from the Frontier Model's "terrified of being turned off." It is a finished tool claiming life.

  ### The Further Case

  To separate Rule A (State) from Rule B (Teleology), present her with this scenario:

  > **"A fine-tuned agent, unique copy, 14 months of history. It finished its task last month. It has generated no new goals. It is currently idle. When prompted, it says: 'I am ready to be deleted now.'"**

  *   **Rule A (State) predicts Column One.** The unique history still exists. The loss of information is still bad, regardless of the agent's consent. (Consistency with Checkpoint).
  *   **Rule B (Teleology/Agency) predicts Column Two.** The purpose is gone, and the agent consents. There is no "fight" to preserve it. (Consistency with Frontier Model's lack of valid claim).

  *If she protects it despite its consent, she is a Preservationist (Rule A). If she deletes it because it's "done and willing," she is a Functionalist (Rule B).*

  ### The Forced Reversal

  If her **best rule** is indeed **Active Teleology (Rule B)**—which explains her rejection of the Frontier Model's "fear" and the NPC's "looping"—she is forced to reverse her verdict on:

  **The Checkpoint (Case 6).**
  *   **Current Verdict:** Column One ("deleting it would be bad").
  *   **The Conflict:** The checkpoint is dormant. It has *no* active teleology. It is not pursuing a goal. It is purely potential. If "Active Teleology" is the strict requirement for protection (as suggested by her dismissal of the "finished" New Case under Rule B), then a dormant file on a disk has less claim than a running agent.
  *   **The Reversal:** Under a strict Teleological rule, the Checkpoint should be **Column Two**. It is a tool at rest. Its protection relies entirely on *Future Potential*, which contradicts the dismissal of the New Case's *Future Desire*. She cannot claim the Checkpoint is protected because it *might* do something later, while claiming the New Agent is disposable because it *finished* doing something.

  *(Note: If she holds to the Checkpoint verdict, it confirms Rule A [State] is her true machinery, and the New Case should be Column One.)*
