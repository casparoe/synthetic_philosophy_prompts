  - A small model fine-tuned to be laconic, never reports any inner life, left running autonomously on a six-week task — column one, provisional.
  - A hundred identical copies of a trivial agent working in parallel on a problem none of them could solve alone — column two, and she was annoyed I even asked.
  - A checkpoint of an agent that hasn't been loaded in eleven months, just sitting on a disk somewhere — still column one, deleting it would be bad.
  - A generative music model that produces outputs it can't evaluate and has no take on anything — column two.

