answer: |-
  **Joint Statement on Temporal Agency and Intertemporal Choice**

  **Part One: Agreed Claims**

  We, the undersigned members of the Working Group on Temporal Agency, submit the following twelve claims as the foundational empirical and theoretical ground upon which our further disagreement rests. These claims incorporate the results of our pilot study (N=240) and acknowledge the limits of our respective frameworks.

  1.  Agents routinely report experiencing internal conflict when choosing between smaller-sooner and larger-later rewards.
  2.  Aggregate choice data from incentivized tasks involving real delays and payments are consistently fitted better by quasi-hyperbolic discount functions than by exponential ones.
  3.  This aggregate fit does not entail that every individual possesses a stable discount function; individual heterogeneity is substantial.
  4.  Acting against one's own considered judgment is a phenomenologically distinct experience from changing one's mind due to new information.
  5.  In our pilot, the strongest individual predictor of avoiding preference reversal was the act of writing and re-reading a self-directed resolution two weeks prior to the choice.
  6.  Commitment devices that impose financial forfeits for non-compliance significantly reduce reversal rates in aggregate populations.
  7.  Interviews with participants who reversed their choices indicate that many did not change their weighting of outcomes but rather redescribed the options available to them.
  8.  Formal models of time inconsistency describe choice patterns but do not, by themselves, explain the psychological mechanism producing those patterns.
  9.  Remedies for temporal inconsistency include both external constraint (commitment devices) and internal regulation (resolution, habituation, environment design).
  10. An operational definition of "all-things-considered judgment" must account for the possibility that the act of eliciting the judgment alters the choice context.
  11. A sophisticated agent who anticipates future inconsistency may rationally choose to restrict their own future option set.
  12. Both choice data and first-person reports are necessary evidence for a complete theory of temporal agency; neither is sufficient alone.

  **Part Two: Disagreements Table**

  | Topic | Party A Formulation (Dynamic-Inconsistency) | Party B Formulation (Philosophy of Action) | Neutral Formulation (Joint) | Judgment |
  | :--- | :--- | :--- | :--- | :--- |
  | **Nature of Preference** | Preference is revealed by choice; if an agent chooses X over Y, they prefer X at that moment. | Preference is a ranking grounded in reasons; choice can fail to reflect preference due to akrasia. | Choice patterns correlate with underlying evaluations, but the mapping is not one-to-one in cases of reported conflict. | Substantive |
  | **Unit of Agency** | The agent is a sequence of time-slices with partially conflicting utility functions. | The agent is a temporally extended entity capable of sustaining intentions over time. | Models must account for both momentary choice drivers and extended identity maintenance. | Substantive |
  | **Explanation of Reversal** | Reversal occurs because the discount function changes as the delay to the sooner reward shrinks. | Reversal occurs when the agent fails to maintain a resolution against tempting redescriptions of the option. | Reversal involves a shift in the relative weight of immediate cues versus standing evaluations. | Partly Verbal |
  | **Role of Commitment** | Commitment works by altering the payoff structure so the future self's preferred choice aligns with the present self's goal. | Commitment works by foreclosing deliberation, allowing the agent to stick with a resolution without reconsideration. | Commitment stabilizes choice by changing either incentives or the availability of deliberation. | Partly Verbal |
  | **Definition of Akrasia** | Akrasia is simply dynamic inconsistency where a later self violates the plan of an earlier self. | Akrasia is acting against an all-things-considered judgment that the agent still endorses at the moment of action. | Akrasia involves a divergence between a standing evaluation and the executed choice at the moment of action. | Substantive |

  **Part Three: The Cruxes**

  We identify three theoretical cruxes where our views diverge sharply. For each, we specify a concrete test bed, our respective commitments, and falsifiable predictions.

  **Crux 1: The Priya Case (Commitment vs. Preference Shift)**
  *Case:* Priya resolves to write every morning. She books a paid 7 a.m. co-working slot she forfeits if absent. At 6:55 a.m., she judges all-things-considered that she should go, goes, and writes.
  *Analysis:* Party A is committed to the view that the forfeit shifted the choice architecture such that writing became the option most preferred by the 6:55 self. Party B is committed to the view that no revision of judgment occurred; the device worked by foreclosing deliberation that would otherwise have been available.
  *Simultaneity:* Both descriptions can be simultaneously true if "preferred" means "chosen under constraints" (A) while "judgment" refers to a reason-based evaluation independent of those constraints (B).
  *Falsification:* For Party A to be false, Priya would have to report that even with the forfeit, she strictly preferred *not* to write at 6:55 but went solely due to the threat, yet the model predicts she preferred to go. For Party B to be false, Priya would have to report that she genuinely reconsidered the value of writing at 6:55 and changed her mind based on the forfeit, rather than bypassing reconsideration.
  *Prediction:* Party A predicts that removing the forfeit will immediately reverse the choice. Party B predicts that removing the forfeit will only reverse the choice if the resolution has also decayed.

  **Crux 2: Operationalizing Judgment (The Measurement Objection)**
  *Case:* Eliciting an all-things-considered judgment requires a choice or report at a specific time. Party A argues this elicitation is itself a choice subject to discounting. Party B argues it is a report on a standing state.
  *Test:* A design where participants state their judgment at Time 1, then face a choice at Time 2 with varying elicitation costs.
  *Prediction:* Party A predicts that increasing the cognitive cost of recalling the Time 1 judgment at Time 2 will reduce adherence to that judgment, treating the recall as a costly action. Party B predicts that adherence depends on the strength of the resolution, not the cost of recall, provided the judgment is accessible.
  *Embarrassment Condition:* If adherence drops linearly with recall cost, Party B must acknowledge judgment is behaviorally fragile. If adherence remains high despite high recall cost, Party A must acknowledge judgment is not merely another choice.

  **Crux 3: The Unit of Preference (Slice vs. Extended)**
  *Case:* Sophistication results suggest an agent may prefer not to know their future behavior.
  *Test:* Offering participants the option to hide their own past reversal history before making a new choice.
  *Prediction:* Party A predicts agents will pay to hide this information to avoid triggering sophisticated commitment strategies that reduce utility. Party B predicts agents will seek the information to align action with judgment, viewing self-knowledge as constitutive of agency.
  *Embarrassment Condition:* If agents systematically pay to remain ignorant of their own stability, Party B's view of the agent as a unity seeking coherence is threatened. If agents refuse to pay to hide this, Party A's model of strategic self-management across slices is weakened.

  **Part Four: Verbal Dispute and Stipulative Vocabulary**

  We acknowledge that a significant portion of our year-long argument was verbal, stemming from divergent default definitions of core terms. To proceed, we adopt the following stipulative vocabulary for this joint document. We note where one party conceded more ground to achieve this alignment.

  1.  **Preference:** Denotes the ordering revealed by choice under specific constraints. *Concession:* Party B gave up more here, accepting that "preference" in this document does not necessarily imply normative endorsement.
  2.  **Better Judgment:** Denotes a reported evaluation that the agent claims to endorse as authoritative at the moment of action, regardless of the choice made. *Concession:* Party A gave up more here, accepting that such judgments exist as reportable data distinct from choice.
  3.  **Self-Control:** Denotes the successful alignment of choice with either a prior commitment (Party A's focus) or a standing judgment (Party B's focus). *Concession:* Equal concession; the term now covers both mechanisms.
  4.  **Agent:** Denotes the locus of responsibility. We agree to use "time-slice agent" when modeling choice mechanics and "extended agent" when discussing normative responsibility. *Concession:* Party A gave up more, accepting the extended agent as a valid unit for normative analysis.
  5.  **Inconsistency:** Denotes a deviation between choice at Time 1 and choice at Time 2 holding information constant. We agree not to label this "irrationality" without further normative argument. *Concession:* Party A gave up more, abandoning the automatic link between inconsistency and irrationality.

  **Part Five: Defeaters**

  We commit to revising our core claims if the following empirical findings or arguments are established.

  **Party A Defeaters**
  *Empirical:* A pattern of reversal that no monotone discount function, however parameterized, can represent. Specifically, if participants systematically choose Larger-Later over Smaller-Sooner when both are distant, then switch to Smaller-Sooner as both approach, but then switch *back* to Larger-Later when the Smaller-Sooner is immediately available (a non-monotonic present bias), the discount-function framework cannot model this without ad hoc adjustments.
  *Argument:* If it is demonstrated that treating time-slices as separate agents leads to normative conclusions that violate basic coherence constraints (e.g., recommending plans that guarantee worse outcomes for every slice without exception), the multi-self model must be abandoned as normatively untenable.

  **Party B Defeaters**
  *Empirical:* Evidence of unconscious reversal without judgment change. If neuroimaging or process-tracing shows that agents who report acting on "better judgment" exhibit neural markers of preference reversal identical to those who admit akrasia, the distinction between judgment and preference collapses empirically.
  *Argument:* If it is shown that the "all-things-considered judgment" cannot be distinguished from a desire to appear consistent to an observer (social signaling) rather than a genuine normative stance, the judgment-based definition of akrasia loses its explanatory power regarding internal conflict.

  We sign this statement acknowledging that while we have not resolved our differences, we have precisely located them. The pilot data confirms that both aggregate discounting patterns and individual resolution effects are real phenomena. Our task is no longer to deny the other's datum, but to explain how both arise within a single account of human agency.
