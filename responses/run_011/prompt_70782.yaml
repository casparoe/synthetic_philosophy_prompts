answer: |-
  My dear friend, you ask me to step into the shoes of John Stuart Mill at the end of his life and adjudicate a conflict that would have been foreign to his century yet perfectly intelligible to his principles. You present a case where the sovereignty of a past self clashes with the welfare of a present self, wrapped in the clinical realities of advanced dementia. You want a verdict, not a survey, and you want it grounded in the specific textual resources of On Liberty and his utilitarian commitments. After turning this case over in my mind, weighing the harm principle against its provisos and the prohibition on slavery against the sanctity of autonomy, I must tell you where I land. Mill would not enforce the directive. He would rule that the nurse is justified in continuing care, and that the daughters' appeal to the written word of the mother they once knew must yield to the welfare of the being who now exists. This conclusion may seem harsh to those who prize autonomy above all, but it is the only one consistent with the specific architecture of Mill's liberty, particularly his restrictions on who qualifies for sovereignty and his refusal to allow the present self to be tyrannized by the binding engagements of the past.

  To understand why Mill would reach this verdict, we must begin not with the woman's written words, but with her current state. The harm principle is the crown jewel of Mill's political philosophy, declaring that over himself, his own body and mind, the individual is sovereign. However, you rightly point out that this principle is not universal; it comes with a crucial proviso. Mill explicitly states that liberty applies only to human beings in the maturity of their faculties. It does not apply to children, nor to those who still require being taken care of by others. In the case you describe, the woman in the ward is no longer in the maturity of her faculties. She has no continuous memory, no recognition of her family, and no agency. She is, by Mill's definition, in the position of a child or a ward. She requires being taken care of by others. Therefore, the shield of the harm principle has fallen away. The nurse and the daughters are not interfering with a sovereign agent; they are caring for a vulnerable being who has exited the realm of sovereignty. For Mill, despotism is a legitimate mode of government in dealing with those incapable of liberty, provided the end is their improvement. While we might balk at the word despotism, the logical force is clear: when the capacity for rational self-government vanishes, the right to paternalistic care emerges. The woman in the ward is not a sovereign whose liberty is being violated by feeding; she is a patient whose welfare is being managed by guardians.

  This brings us to the status of the directive itself. The daughters argue that the directive is an exercise of sovereignty over a life as a whole. They view the competent woman of twelve years ago as the true agent, extending her will across time. Mill, however, would likely view this through the lens of his argument regarding slavery and the enforcement of engagements. In On Liberty, Mill argues that a man cannot validly sell himself into slavery. He reasons that the principle of freedom cannot require that a person be free to destroy their own freedom. By selling himself into slavery, he alienates his future liberty, ceasing to be a free agent and thus defeating the very purpose of allowing him to choose. There is a profound parallel here. The advance directive is an attempt by the past self to bind the future self to a specific outcome—death—based on conditions that the future self cannot evaluate. Mill is deeply skeptical about having the law specifically enforce engagements whose performance is the promisor's own future conduct. He recognizes that circumstances change and, crucially, that the self changes. To allow the competent self to dictate the death of the incapacitated self is to allow a form of alienation of the future existence that mirrors the slavery case. The past self is attempting to destroy the future subject's possibility of existence based on a judgment the future subject cannot contest. For Mill, freedom is instrumental to well-being; it is not a metaphysical trump card that allows one to negate the well-being of a future consciousness that still possesses the capacity for happiness.

  You ask how much weight Mill would give to the personal-identity worry that dominates modern literature. Here we must remember that Mill is a utilitarian about welfare and an empiricist about the mind. He is not committed to a metaphysical soul that persists unchanged. He cares about continuity of consciousness and interests, but ultimately, he cares about happiness and the absence of pain. In this case, there are two distinct loci of interest: the past self who valued autonomy and narrative integrity, and the present self who experiences contentment. The past self is gone; her consciousness is extinguished. The present self is here, humming to records, feeling no pain, experiencing pleasure. To honor the directive is to extinguish the happiness of the existing being to satisfy the preference of a non-existing being. Mill's utilitarianism demands we maximize happiness. While he distinguishes between higher and lower pleasures, and might agree that the past self's judgment was of a higher order, that higher faculty no longer exists to be exercised. There is only the lower pleasure of the present patient. To kill the patient is to reduce the total sum of happiness in the world without preserving any higher capacity, for the higher capacity is already lost. The personal-identity worry dissolves for Mill into a question of whose happiness counts. Since the demented woman is the only sentient being present, her happiness counts, and the ghost of her former self cannot veto it.

  Furthermore, we must consider the commitment that is doing the heaviest lifting here: the proviso regarding the maturity of faculties. This is not a minor caveat; it is the boundary condition of Mill's liberalism. If we ignore this proviso to enforce the directive, we undermine the protection Mill intends for the vulnerable. If the demented woman is treated as sovereign because of her past self, then we are effectively saying that those who lack maturity of faculties can still be bound by the harm principle's restrictions on interference. But Mill says the opposite: because they lack maturity, they are open to interference for their own good. The nurse sees a happy patient; the daughters see a broken promise. Mill would side with the nurse because the nurse is attending to the actual welfare of the person in her care, while the daughters are attending to the abstract integrity of a contract that Mill believes cannot bind the future self. The directive looks to Mill less like sovereignty exercised over a life as a whole and more like an alienation of the later self's freedom on precisely the model he refuses in the slavery case. It is an attempt to use liberty to destroy the subject of liberty, or in this case, the subject of care.

  There is a risk in this verdict, and I must be honest about it. If we routinely ignore advance directives, we may cause anxiety to competent people who fear losing control over their ends. This could diminish their current happiness. However, Mill would likely argue that the law cannot enforce a contract that violates the fundamental condition of liberty, which is the capacity to choose. Since the demented woman cannot choose, and since she is happy, the presumption must be in favor of life. The commitment to utility grounds this, but the commitment to the limits of sovereignty seals it. Mill would tell the daughters that they are mourning the mother they lost twelve years ago, and that is a genuine grief, but they cannot sacrifice the woman who remains to the memory of the woman who is gone. The woman in the ward is not a stranger, as the nurse suggests, but she is a different moral category of being than the one who wrote the note. She is a ward. And wards are protected from the binding wills of others, even their own past selves.

  So, my verdict is definite: do not enforce the directive. The reasoning rests on the convergence of the maturity proviso, which removes the patient from the sphere of sovereignty and places her under protective care, and the slavery analogy, which forbids binding the future self to destruction. The utilitarian calculus supports this by prioritizing the existing happiness of the conscious patient over the past preferences of the deceased competent self. Mill's liberalism is robust, but it is not absolute; it stops where the capacity for freedom ends. In this case, that capacity has ended, and with it, the right to dictate death. The nurse is right to treat the patient as a happy child who needs care, not as a sovereign agent who has ordered her own execution. To do otherwise would be to allow the liberty of the past to destroy the welfare of the present, a trade Mill's system is designed to prevent.
