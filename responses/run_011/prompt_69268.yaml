answer: |-
  You have sketched a robust, Chalmers-style strong two-dimensionalism (2DS). It is an elegant framework, but elegance is often purchased at the price of empirical adequacy. You have asked for an audit, not a summary. I shall be blunt.

  Below, I have sorted the defeaters by their severity. I have distinguished between those that threaten the coherence of the framework (Fatal), those that force significant theoretical concessions (Serious), and those that are merely costly (Awkward). For each, I note how a committed two-dimensionalist typically responds, and whether that response holds water.

  ### I. Fatal Defeaters
  *These are objections that, if successful, render the framework redundant or incoherent.*

  #### 1. The Collapse Argument
  **The Worry:** This is the standard Soames/Egan objection. It argues that your primary intensions (1-intensions) are not genuinely distinct from secondary intensions (2-intensions). If a scenario is just a metaphysically possible world considered as actual, then the 1-intension of 'water' is just the 2-intension of 'water' evaluated at a different world. Consequently, the distinction between epistemic and metaphysical modality collapses. If they collapse, you have not dissolved the necessary a posteriori; you have merely relabelled it.
  **The Stakes:** If 2DS collapses into 1DS plus a confused epistemology, the view is theoretically redundant. Occam's razor slashes it.
  **The Two-Dimensionalist's Move:** They insist that 'scenarios' are *epistemically* possible worlds, which may be *metaphysically* impossible. They argue that the space of scenarios is wider than the space of metaphysical worlds.
  **The Audit:** This is the weakest link in the armour. To avoid collapse, you must provide an independent account of what constitutes a 'scenario' that does not rely on metaphysical possibility. If you define scenarios as "maximal consistent sets of sentences," you face logical omniscience problems. If you define them as "metaphysical worlds," you collapse.
  **Verdict:** **Fatal if proven.** Most critics argue the collapse *has* been proven for natural kind terms. The 2DS defender must bite the bullet that there are genuinely possible scenarios where water is not H2O, which requires a controversial modal rationalism (that conceivability entails possibility). If you cannot secure the independence of the scenario space without circularity, the framework is vacuous.

  #### 2. The Jade Case (and Disjunctive Kinds)
  **The Worry:** As you noted, 'jade' refers to two distinct mineralogical kinds (nephrite and jadeite).
  *   **Horn A:** The 1-intension is disjunctive ("nephrite or jadeite"). But this is not knowable a priori. It required empirical discovery. Thus, the 1-intension is not epistemic/apriori.
  *   **Horn B:** The 1-intension is non-disjunctive ("hard, green stone"). But this gets the extension wrong in the actual world (as there are green stones that are not jade).
  **The Stakes:** This severs the link between 1-intensions and apriority. If the 1-intension requires empirical discovery to formulate correctly (Horn A), it cannot do the work of grounding the a priori. If it stays a priori (Horn B), it fails to track reference.
  **The Two-Dimensionalist's Move:** They typically argue that 'jade' is a *functional* or *superficial* kind, not a deep natural kind. The 1-intension is "the stuff that plays the jade-role." The discovery that this role is filled by a disjunction is a posteriori, but the 1-intension itself remains a priori.
  **The Audit:** This is a retreat. It concedes that for many terms we treat as natural kinds, the 1-intension does not capture the *essence*, only the *mode of presentation*. This weakens the claim that 2DS explains the necessary a posteriori. It turns 'Water is H2O' into 'The watery stuff is H2O'. The necessity is preserved, but the 'a posteriori' element is pushed into the identification of the referent, not the intension itself.
  **Verdict:** **Fatal to the strong claim.** It forces you to admit that 1-intensions often fail to capture the semantic content of natural kind terms, reducing them to descriptive placeholders. If the 1-intension of 'water' is just 'the watery stuff', you haven't explained the modal status of 'water'; you've changed the subject. This generalises to 'gold', 'tiger', etc. If the framework cannot handle standard natural kinds without turning them into functional descriptions, it loses its explanatory power regarding Kripkean semantics.

  ### II. Serious Structural Worries
  *These do not destroy the view but force costly qualifications.*

  #### 3. Vacuity and Insulation
  **The Worry:** You asked if the view is qualified into vacuity. If every counterexample (like 'jade') is absorbed by re-stipulating the granularity of scenarios or the centring conditions, the theory becomes unfalsifiable.
  **The Stakes:** A framework that can accommodate any data by tweaking the definition of a 'scenario' is not a semantic theory; it is a modelling language.
  **The Two-Dimensionalist's Move:** They claim the framework is constrained by idealised rational reflection. Scenarios are what an ideal agent could conceive.
  **The Audit:** This is methodologically dangerous. 'Ideal conceivability' is notoriously difficult to cash out without appealing to the very modal intuitions the framework is meant to explain. If you allow the theorist to decide which scenarios exist based on whether they make the semantics work, you are begging the question.
  **Verdict:** **Serious.** To avoid this, you need independent constraints on the space of scenarios (e.g., from cognitive science or logic) that are not derived from semantic intuitions. Without this, the view is insulated in a vicious way.

  #### 4. Empty Scenarios and Reference Failure
  **The Worry:** What is the 1-intension of 'phlogiston' or 'unicorn'? If no scenario satisfies the reference-fixing description, the 1-intension is empty everywhere.
  **The Stakes:** Does 'Phlogiston exists' come out knowably false a priori? That seems wrong. It feels contingent a posteriori false.
  **The Two-Dimensionalist's Move:** Adopt a free logic or treat the 1-intension as yielding a truth-value gap rather than 'false'. Alternatively, argue that there *are* scenarios where the description is satisfied (by something else), so it's not empty, just non-actual.
  **The Audit:** The first option complicates the logic significantly (no longer bivalent). The second option requires that 'phlogiston' picks out *whatever* satisfies the description, even if it's oxygen (which it historically was taken to be). This leads to counterintuitive truth conditions for historical claims.
  **Verdict:** **Serious.** It forces a choice between logical complexity or counterintuitive reference assignments for empty terms. It is manageable, but it erodes the simplicity that made 2DS attractive.

  ### III. Merely Awkward Costs
  *These are bullets the view can bite, but they stain.*

  #### 5. Explanatory Payoff (Linguistic/Psychological)
  **The Worry:** You asked for checkable consequences. Rivals (e.g., pragmatic accounts, contextualism) often explain the data with less metaphysical baggage. What does 2DS predict?
  **The Payoff:**
  *   **Belief Ascriptions:** 2DS predicts that speakers can believe 'Hesperus is Hesperus' while doubting 'Hesperus is Phosphorus' because they are associating different 1-intensions with the names.
  *   **Partial Understanding:** It predicts that speakers can grasp the 1-intension (the mode of presentation) without knowing the 2-intension (the extension).
  *   **Conceptual Change:** It explains how we can revise our metaphysical beliefs about a kind without changing the concept (the 1-intension stays fixed, the 2-intension shifts).
  **The Audit:** These are plausible, but not exclusive to 2DS. A Fregean sense/reference distinction handles belief ascriptions without the modal machinery. A pragmatic account handles partial understanding without positing two intensions.
  **Verdict:** **Awkward.** The view does not predict anything *uniquely*. It systematises existing intuitions well, but it lacks novel empirical predictions that would distinguish it from a sophisticated Fregean or pragmatic rival.

  #### 6. The Complexity of Centring
  **The Worry:** To handle indexicals ('I', 'now'), scenarios must be 'centred' (marked with a specific individual and time).
  **The Stakes:** This adds significant technical complexity. Is the centre part of the world or part of the evaluation?
  **The Two-Dimensionalist's Move:** It's a necessary feature to capture self-locating belief.
  **The Audit:** It works, but it makes the semantics heavy. It also raises questions about whether 'I' has a 1-intension at all, or if it is purely indexical.
  **Verdict:** **Awkward.** It is a technical cost, not a conceptual failure.

  ### IV. Summary and Recommendation

  **Is the view insulated into vacuity?**
  Yes, unless you impose independent constraints on 'scenarios'. If the only criterion for a scenario's existence is that it preserves the 2DS analysis of modal statements, the framework is circular. It explains modality by positing scenarios, and justifies scenarios by their modal output. To fix this, you must anchor 'scenarios' in something non-semantic, such as cognitive architecture or logical consistency conditions that are independently motivated.

  **The Jade Verdict:**
  The jade case is worse than you fear. It is not a pathological exception; it is the rule for many natural kind terms. If 2DS handles 'jade' by treating it as a functional kind, it must do the same for 'water', 'gold', and 'tiger'. This concedes that the 1-intension does not capture the *nature* of the kind, only our *concept* of it. This undermines the claim that 2DS reconciles Kripke with descriptivism. It actually vindicates Kripke: the description (1-intension) does not fix the reference (2-intension) necessarily. The 'necessary a posteriori' returns, merely disguised as the gap between the functional role and the realiser.

  **What would move you?**
  1.  **A Collapse Proof:** If someone demonstrates that the space of epistemically possible scenarios cannot be distinguished from metaphysically possible worlds without contradiction, the view is dead.
  2.  **Empirical Psychology:** If psycholinguistic experiments show that speakers do not distinguish between 'conceiving water is not H2O' and 'conceiving a world where the watery stuff is not H2O' in the way 2DS predicts, the psychological reality of the two dimensions is undermined.
  3.  **A Better Rival:** If a one-dimensional semantic framework plus a pragmatic theory of assertion can explain the necessary a posteriori intuitions without positing two intensions, 2DS becomes theoretically profligate.

  **Final Advice:**
  Do not treat the 1-intension as a *semantic* value in the same sense as the 2-intension. Treat it as a *cognitive* or *epistemic* tool. If you claim it is part of the literal truth-conditions of every sentence, the jade case and the collapse worry will crush you. If you claim it is a model of how agents *grasp* truth-conditions, you can survive, but you must abandon the claim that it dissolves the necessary a posteriori. It merely explains why we *find* it puzzling.

  The framework is powerful, but it is currently trading on an ambiguity between 'epistemic possibility' and 'metaphysical possibility described epistemically'. Tighten that distinction, or the whole edifice slides into the sea.
