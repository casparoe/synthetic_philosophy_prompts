  1. Elara insisted the disagreement was just standard simultaneity, a matter of choosing slices through the block. Kael reminded her the dust rotates without an axis, homogeneous and rigid, everywhere the same, so there is no center to point at.

  2. They synchronized clocks pairwise across the dust, passing light signals around a wide geometric loop. When the chain finally closed, the final tick disagreed with the first by a fixed, stubborn minute, proving the light refused to reconcile.

  3. No adjustment could fix the gap, because no global time function existed to hold the moments together. The light cones had tipped too far for "now" to reach everywhere at once, meaning there is no universal now.

  4. You cannot go back to change things, only walk far enough through the dust to meet yourself arriving. The past is not behind you, it is merely elsewhere in the rotation, so you are already there.

  5. Elara stopped watching the clocks and felt the rotation in her bones, a vertigo without a center to anchor it. Time wasn't flowing forward; it was pooling quietly around her feet, leaving her trapped in the present.
