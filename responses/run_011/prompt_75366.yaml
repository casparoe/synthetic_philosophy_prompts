  Software engineer here, zero philosophy background, so bear with me. A friend of mine does a science-y podcast and sent me his one-paragraph take on Popper: "Popper finally settled what counts as science: a claim is scientific only if some observation could prove it false. So science is basically a suite of tests — one failing observation kills the theory, and the theories that keep passing get stronger and more probable. Which also means unfalsifiable stuff like religion, Marxism, and metaphysics is literally meaningless — that's why Popper wrote Freudian psychoanalysis off as nonsense. It's the scientific method in a single sentence."

  Mostly this sounds reasonable, but a couple of the steps make me uneasy. In my actual job, when a test fails it's usually my test that's broken, not the code — so "one failing observation kills it" can't really be how Popper meant it. Can you go through that paragraph claim by claim and tell me what a philosopher of science would happily sign off on, what's a harmless simplification, and what's actually wrong? I'm especially curious whether the "unfalsifiable = meaningless" bit and the "surviving tests makes a theory more probable" bit are things Popper really held, since those two are doing a lot of work in his conclusion.
