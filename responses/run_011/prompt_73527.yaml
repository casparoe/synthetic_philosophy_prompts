answer: |-
  Here is the direct feedback you asked for, broken down by your three requests.

  ### (a) History and Dialectic
  Your historical setup is solid. You aren't making any glaring errors that would embarrass you in a seminar.
  *   **Geach/Frege:** Your characterization of the force/content distinction and Geach's application of it to emotivism (Ayer/Stevenson) is standard and accurate.
  *   **Hare:** Your reading of the phrastic/neustic objection is fair. Geach's point is indeed that if the "phrastic" (the descriptive content) does all the logical work in inferences, it starts looking suspiciously like a truth-apt proposition, which undermines the non-cognitivist project.
  *   **The "Logic Costume":** Framing Frege-Geach as a compositionality problem rather than purely a validity problem is a sophisticated move (often associated with Schroeder and others in the 2000s). It's a good framing device for a short paper.

  **Verdict:** No corrections needed here. You can proceed with confidence on the setup.

  ### (b) Section 3: Is it new, or is it Blackburn?
  Your partner is half-right, but you are also half-right. Here is the precise location of your view in the dialectic.

  **1. It is not Blackburn.**
  Blackburn's quasi-realism (specifically in *Spreading the Word*) relies on **higher-order sentiments**. For Blackburn, "If lying is wrong, then stealing is wrong" expresses a sentiment of disapproval toward *combining* the sentiment of disapproval toward lying with the lack of sentiment toward stealing. It is psychological and sentiment-based.
  Your view is **normative/policy-based**. You are defining the semantic value as a *commitment* or *binding*, not a sentiment. This is a structural difference. Blackburn solves embedding by making the complex sentence express a complex *feeling*. You solve it by making the sentence express a *rule for feelings*.

  **2. It is (very close to) Gibbard.**
  You need to know this before you hand it in. Your "policy about future attitudes" is functionally equivalent to Allan Gibbard's **Plan-Based Expressivism** (developed in *Wise Choices, Apt Feelings* and *Thinking How to Live*). Gibbard argues that moral judgments express the acceptance of norms, where norms are essentially plans or constraints on future choices and attitudes.
  *   **The Overlap:** Gibbard explicitly distinguishes between the *norm-acceptance* (the plan) and the *psychological state* (the feeling). This is exactly your "Avowal Test."
  *   **The Risk:** If your professor is a Gibbardian, they will read Section 3 and think, "This is just *Thinking How to Live* Chapter 4." If they aren't, they might still recognize the structure.
  *   **How to Defend It:** You don't need to cite Gibbard if you haven't read him, but you should frame your view as a **"Commitment-Based Expressivism"** rather than just "Expressivism." Your specific twist is focusing on *attitudes* as the object of the policy, whereas Gibbard often focuses on *actions*. Lean into that. You are offering a meta-attitudinal account.

  **3. The Hole in Section 3.**
  You claim there is "no regress" because you aren't disapproving of a combination of attitudes. But you *are* positing a **higher-order policy**.
  *   **The Objection:** A "policy about a policy" is structurally identical to a "higher-order attitude." If the problem with Blackburn was that higher-order attitudes are mysterious or psychologically unrealistic, why are higher-order policies less mysterious?
  *   **The Fix:** You need to argue that *commitments* compose more naturally than *sentiments*. Sentiments are messy psychological states; policies are functional roles. That is your actual advantage, not the absence of higher-order structure.

  **4. The Avowal Test.**
  This is doing work, but not as much as you think.
  *   **Strength:** It successfully distinguishes your view from *simple* emotivism (Ayer).
  *   **Weakness:** Sophisticated expressivists (Blackburn, Gibbard) can also explain this. They distinguish the *judgment* from the *motivation/feeling*. A Gibbardian can say, "I accept the norm (judgment) but I'm tired/depressed (no feeling)."
  *   **Advice:** Don't sell this as a knockout blow against *all* rivals. Sell it as a clarification of what the "attitude" in expressivism actually *is*. It clarifies that the semantic value is the *commitment*, not the *heat*.

  ### (c) The Single Strongest Objection
  If I were your professor, this is the margin note you would get, expanded into a seminar objection:

  **The "Creeping Minimalism" / Truth-Aptness Dilemma.**

  You write: *"The policy is the content. It is content of a perfectly respectable sort — a function from states of a certain kind to states of another kind — so it composes."*

  Here is the trap:
  1.  **If** these policies are functions that compose, support modus ponens, and behave like propositions in a semantics... **then** in what sense are they not just truth-apt propositions?
  2.  If I say "Lying is wrong," and you say "That is true," what are you agreeing with? You are agreeing that *I have adopted a policy*.
  3.  If the meaning of "Lying is wrong" is "I adopt a policy to disapprove of lying," then the sentence is **true** iff I adopt that policy.
  4.  **The Consequence:** You have collapsed expressivism into **Subjectivism** or **Relativism**. You are no longer saying the sentence *expresses* a non-cognitive state; you are saying the sentence *describes* the fact that I have a policy.
  5.  **The Dilemma:**
      *   **Horn A:** You insist policies are not truth-apt. Then you are back at square one: how do non-truth-apt policies compose logically to create validity? (You haven't solved FG, you've just renamed the problem).
      *   **Horn B:** You allow policies to be truth-apt (e.g., "It is true that I am committed to X"). Then you are a cognitivist about moral judgments, and you've abandoned expressivism.

  **Why this hurts your draft:**
  You try to dodge this by saying the policy is "unexercised" in embeddings. But an unexercised function is still a function. If the semantics treats it as a value that can be plugged into a conditional, the semantics is treating it like a proposition.

  **How to patch this before Friday:**
  You need to explicitly deny that the policy is a *description* of your state. It must be the *state itself* (or the adoption thereof), not a report of the state.
  *   **Bad:** "Lying is wrong" means "I have a policy." (This is truth-apt subjectivism).
  *   **Good:** "Lying is wrong" *is* the adoption of the policy. (This is expressivism).
  *   **The Fix:** In Section 3, clarify that the semantic value is not a *proposition about a policy*, but the *policy itself* serving as the semantic value. You need to explain how a *policy* (an imperative-like thing) can be the argument of a conditional without turning into a *fact about a policy*. This is the hard technical work. If you gloss over this, the professor will catch it.

  ### Summary Recommendation
  1.  **History:** Keep it. It's fine.
  2.  **Section 3:** Acknowledge that this is a "Commitment-Based" or "Plan-Based" view (distinct from Blackburn's Sentiment-Based view). Drop the claim that there is "no regress"; instead, claim that *commitments* compose more transparently than *sentiments*.
  3.  **Negation:** Since you admit Section 4 is weak, **cut it**. Don't promise a solution to negation if you don't have one. It's better to say "I focus on the conditional here because the policy model illuminates the commitment structure, leaving negation for future work" than to offer a half-baked solution that gets torn apart.
  4.  **The Objection:** Add a paragraph in Section 3 explicitly addressing the "Truth-Aptness" worry. State clearly that the policy is *enacted*, not *described*, to avoid collapsing into subjectivism.

  You have a viable argument, but it's walking a tightrope between Gibbard's planning view and relativist subjectivism. Tighten that distinction, and you'll have a solid paper. Good luck.
