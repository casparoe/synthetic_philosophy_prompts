  # The Escalation Diagnostic: Mapping Your Intuitions

  **To:** Game Theory Club Members  
  **From:** Club Lead  
  **Re:** Sorting Explanations for the Dollar Auction

  We ran six versions of the dollar auction this term. The results were messy. Some of you think the escalation was a mistake; others think it was rational; others think it was social performance. 

  This handout is not a test of what *actually* happened. It is a tool to sort **your** predictions. By answering questions about outcomes rather than theories, we can map which explanation matches your intuition. 

  **Instructions:**
  1.  Follow the Decision Tree below. 
  2.  At each node, answer **Yes** or **No** based on what *you* predict would happen, not what you think is "correct."
  3.  Land on a Leaf to find the explanation that matches your pattern.
  4.  Read the "Blind Spots" and "Empty Rooms" sections to understand the limits of this tree.

  ---

  ## Part 1: The Decision Tree

  **Setup Reference Key:**
  *   **(a) Standard:** Public, penny increments, top two pay.
  *   **(b) Secret:** Bids written on paper, no one knows the high bid.
  *   **(c) Refund:** Second-highest bidder gets their money back.
  *   **(d) Repeat:** Same pair plays five times in a row.
  *   **(e) Cap:** Hard limit announced at $2.00.
  *   **(f) Talk:** Bidders can negotiate before bidding.
  *   **(g) Inherited Bid (New):** You enter the game as the *second-highest* bidder at $0.50. You did not place this bid and have not paid it. If you quit now, you pay $0. If you bid $0.51 and lose, you pay $0.51.

  ***

  **Node 1: The Secret Test (Setup b)**
  In the **Secret** setup, do you predict the final price will exceed **$1.20**?
  *   **No** → Go to Node 2.
  *   **Yes** → Go to Node 3.

  **Node 2: The Talk Test (Setup f)**
  In the **Talk** setup, do you predict the *combined* amount paid by both bidders will be less than **$0.80**?
  *   **Yes** → **Leaf A: Collusion or Performance**
  *   **No** → **Leaf B: Audience Pressure**

  **Node 3: The Repeat Test (Setup d)**
  In the **Repeat** setup, do you predict the final price in Round 5 will be significantly lower than in Round 1?
  *   **Yes** → **Leaf C: Reputation Effects**
  *   **No** → Go to Node 4.

  **Node 4: The Refund Test (Setup c)**
  In the **Refund** setup, do you predict bidding will exceed **$1.00**?
  *   **Yes** → Go to Node 5.
  *   **No** → Go to Node 6.

  **Node 5: The Cap Precision Test (Setup e)**
  In the **Cap** setup, do you predict bids will stop *exactly* at the $2.00/$1.99 limit every time?
  *   **Yes** → **Leaf D: Rational / Structural License**
  *   **No** → **Leaf E: War of Attrition (Mixed Strategy)**

  **Node 6: The Inherited Bid Test (Setup g)**
  In the **Inherited Bid** setup, do you predict the player will place the $0.51 bid?
  *   **Yes** → **Leaf F: Sunk Cost Fallacy**
  *   **No** → **Leaf G: Loss Aversion (Trapped in Loss)**

  ---

  ## Part 2: The Leaves (Explanations)

  ### Leaf A: Collusion or Performance
  *   **The View:** Escalation is a show. When allowed to coordinate, bidders realize the game is a trap and split the profit. When observed, they may escalate to signal toughness to the audience, not because the math demands it.
  *   **Consensus Status:** **Agreed.** (Collusion is consistently observed when communication is permitted. Audience effects are widely accepted in social psychology, though their magnitude in auctions is debated.)

  ### Leaf B: Audience Pressure
  *   **The View:** The math of the auction doesn't force escalation, but the social cost of "losing face" does. Without an audience (Setup b), rationality returns. With an audience, backing down is more painful than losing money.
  *   **Consensus Status:** **Disputed.** (Social pressure is real, but economists dispute whether it overrides financial incentives to this degree.)

  ### Leaf C: Reputation Effects
  *   **The View:** Escalation is an investment in future rounds. Bidders pay extra early to signal they are "tough," forcing opponents to fold in later rounds. This explains why escalation drops in Round 5 (the signal is sent).
  *   **Consensus Status:** **Agreed.** (Standard game theory prediction for repeated games. Disputed only on whether high school students calculate this consciously.)

  ### Leaf D: Rational / Structural License
  *   **The View:** Escalation is not a mistake. Given the rules, bidding past $1.00 is the only way to minimize loss or maximize win probability. The game structure genuinely licenses the behavior; the bidders are playing optimally.
  *   **Consensus Status:** **Disputed.** (Theoretically sound in specific models, but behavioralists argue humans rarely play these specific equilibria.)

  ### Leaf E: War of Attrition (Mixed Strategy)
  *   **The View:** The game is a contest of endurance. There is no single "correct" bid. Bidders randomize their bids to keep opponents guessing. This leads to unpredictable outcomes (sometimes hitting the cap, sometimes not) rather than precise calculation.
  *   **Consensus Status:** **Disputed.** (A standard model in biology and economics, but whether humans actually randomize strategies is heavily contested.)

  ### Leaf F: Sunk Cost Fallacy
  *   **The View:** Bidders escalate because they have already invested resources. They feel psychological ownership of the bid itself, even if they didn't pay for it (as in Setup g). They bid to justify the "investment" of their position.
  *   **Consensus Status:** **Highly Disputed.** (Psychologists view this as a robust cognitive bias. Economists often argue it is incoherent or mislabeled.)

  ### Leaf G: Loss Aversion (Trapped in Loss)
  *   **The View:** Bidders do not care about the "investment," they care about avoiding a realized loss. In Setup (g), since they haven't paid the $0.50 yet, quitting costs nothing. They only escalate when their *own* money is on the line and stopping guarantees a loss.
  *   **Consensus Status:** **Partially Disputed.** (Loss aversion is a Nobel-winning concept, but its application here vs. Sunk Cost is often indistinguishable without careful framing.)

  ---

  ## Part 3: Blind Spots (Observational Equivalence)

  This tree cannot separate every view based on bidding data alone. If you landed on a leaf, be aware of these overlaps:

  **1. Sunk Cost (F) vs. Loss Aversion (G)**
  *   **The Problem:** In the standard game (Setup a), these two look identical. Both predict escalation past $1.00.
  *   **The Separation:** We used Setup (g) *Inherited Bid* to split them. However, if a member argues that inheriting a bid *feels* like a loss, the distinction collapses.
  *   **Additional Data Needed:** Physiological measurement (skin conductance) during the bid. Sunk Cost should show frustration/commitment arousal; Loss Aversion should show fear/anxiety arousal.

  **2. Rational (D) vs. War of Attrition (E)**
  *   **The Problem:** Both predict escalation in the Refund setup (c). Node 5 tries to split them based on precision (Exact Cap vs. Variable).
  *   **The Separation:** Humans are noisy. A "Rational" player might miss the cap by a penny due to error, looking like "War of Attrition."
  *   **Additional Data Needed:** Setup (h) **Computer Opponent.** Play against a bot programmed with the Rational strategy. If humans still escalate randomly, it supports War of Attrition. If they match the bot's precision, it supports Rationality.

  **3. Audience (B) vs. Collusion (A)**
  *   **The Problem:** Both predict low bids in Secret (b).
  *   **The Separation:** Node 2 splits them based on Talk (f).
  *   **Additional Data Needed:** Audio recording of Setup (f). If they explicitly agree to split profits, it is Collusion. If they just hint and hope, it is Tacit Coordination (which leans toward Rational).

  ---

  ## Part 4: Empty Rooms (Logical Space)

  The tree above maps the "occupied" positions. There are combinations of answers that correspond to **Empty Cells**. No one holds these views, for specific reasons.

  **Empty Cell 1: The "Secret Escalator" who "Colludes"**
  *   **The Pattern:** Predicts **Yes** on Node 1 (Secret > $1.20) AND **Yes** on Node 2 (Talk < $0.80).
  *   **Why Empty:** **Incoherent.** If you believe the game mechanics alone drive escalation (Secret = High), allowing talk should not stop it unless the talk changes the mechanics. If talk stops it, the driver was social, not mechanical. You cannot claim the *structure* forces escalation but *words* fix it without admitting the structure wasn't the cause.

  **Empty Cell 2: The "Refund Rationalist"**
  *   **The Pattern:** Predicts **No** on Node 4 (Refund < $1.00) AND **Yes** on Node 5 (Cap Exact).
  *   **Why Empty:** **Unattractive.** If the Refund rule stops escalation, it proves the *penalty* was the driver. If the penalty drives it, bidders are fear-driven, not calculating a precise Rational limit at the Cap. A true Rationalist (Leaf D) believes the game licenses escalation even without the penalty (because the prize value justifies the risk).

  **Empty Cell 3: The "Reputation Solitary"**
  *   **The Pattern:** Predicts **Yes** on Node 3 (Repeat Drops) AND **No** on Node 1 (Secret Low).
  *   **Why Empty:** **Unproposed.** Reputation requires an audience or a repeat opponent to build a history. If you predict low bids in Secret (one-off, anonymous), you admit the game isn't inherently escalatory. If it isn't inherently escalatory, there is no need to build a reputation for toughness in the Repeat setup. This combination implies people build reputations in games they don't care about.

  ---

  ## Scoring Key

  | Node 1 (Secret) | Node 2 (Talk) | Node 3 (Repeat) | Node 4 (Refund) | Node 5 (Cap) | Node 6 (Inherit) | **Resulting Leaf** |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **No** | **Yes** | - | - | - | - | **A: Collusion** |
  | **No** | **No** | - | - | - | - | **B: Audience** |
  | **Yes** | - | **Yes** | - | - | - | **C: Reputation** |
  | **Yes** | - | **No** | **Yes** | **Yes** | - | **D: Rational** |
  | **Yes** | - | **No** | **Yes** | **No** | - | **E: War of Attrition** |
  | **Yes** | - | **No** | **No** | - | **Yes** | **F: Sunk Cost** |
  | **Yes** | - | **No** | **No** | - | **No** | **G: Loss Aversion** |

  *(Note: "-" indicates the question is skipped based on previous answers.)*

  ---

  **Final Note:** This diagnostic sorts *intuitions*, not truths. In the real world, escalation is likely a mixture of Leaves C, F, and G, with a dash of A. If you found yourself wanting to answer "It depends" at every node, you may simply be the only true Game Theorist in the room.
