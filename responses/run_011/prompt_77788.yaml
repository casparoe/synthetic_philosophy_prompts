      *   *Does it force an update?* It should. If the theories are extensionally equivalent in the standard cases (fixed population, interpersonal), the debate is purely about *justification* and *edge cases*. If the edge cases (intrapersonal) yield different intuitions, that's the crux. Most people think inequality *within* a life (e.g., suffering early, joy later vs. vice versa) doesn't matter in the same way as inequality *between* lives. This favors Prioritarianism.

