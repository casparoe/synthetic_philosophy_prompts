  2.  **Deconstruct the Disagreement (Part a):**
      *   *Is it verbal?* Partly. The term "better" is doing heavy lifting. Is it "better all things considered" (ATC) or "better in one respect" (pro tanto)?
      *   *Is it different questions?* Yes. Egalitarians often care about *patterns* or *relations*. Prioritarians care about *weighted sums*.
      *   *Hidden Principle?* The "Person-Affecting View" (PAV) or "Wide Person-Affecting View." The LDO relies on the intuition that value must be good *for someone*. Egalitarians often reject this strict constraint (they value the pattern itself).
      *   *Substantive?* Yes, underneath the verbal confusion. It's about the *source* of value (relational vs. individual).
      *   *Diagnosis:* It's a category error regarding the *ontology of value*. One side treats value as an aggregate of individual goods (Prioritarianism/Utilitarianism); the other treats value as a property of the distribution structure itself (Telic Egalitarianism). The LDO works as a *reductio* only if you assume the former ontology is the only valid one.

  3.  **Analyze the Three Levels (Part b):**
