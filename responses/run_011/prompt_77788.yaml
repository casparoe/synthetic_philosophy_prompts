      *(Refining the "Verbal" diagnosis)*: It's not *just* verbal. It's metaphysical. Is value monistic (sums of welfare) or pluralistic (welfare + patterns)? The LDO assumes monism/person-affecting. Egalitarianism assumes pluralism/impersonal.

      *(Refining the "Progress" section)*: Progress is recognizing that Telic Egalitarianism is the specific target. Deontic Egalitarianism (fairness of process) sidesteps LDO.

