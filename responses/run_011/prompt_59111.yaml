  **THE ANTIMONIAN SALEROOM**
  **44th Annual Retrospective Ontology Sale**
  **Premises: The Warehouse of Superseded Causes, District of Anomalies**

  The Antimonian Saleroom invites connoisseurs of obsolescence to inspect the inventory of the past century's scientific endeavors. All lots are sold as seen, with no warranty of reference or guarantee of future utility. Bidding opens at 09:00. Currency: Epistemes (EP).

  **LOT 104: The Leverrier Perturbation Module**
  *Provenance:* 19th Century Celestial Mechanics Collection.
  *Condition Report:* Previously cataloged in the 1998 sale as a Triumph of Novel Prediction. Recent correspondence from a historian of science suggests the predictive success was retrofitted rather than novel, violating inclusion criteria. The House maintains the calculation held until it didn't.
  *Bidder Notes:* Bidder 12 notes: "Entirely scrap. A patch on a patch. The metal is fatigued and the logic circular. Worth less than the paper it's printed on."
  *Estimate:* 50–80 EP.

  **LOT 105: Luminiferous Aether (Substrate Only)**
  *Provenance:* Fresnel Laboratory, c. 1820.
  *Condition Report:* Mechanically sound but ontologically vacant. The medium remains intact, though no current theory requires a medium of this density. Dusty.
  *Bidder Notes:* Bidder 12 adds: "Junk. Pure junk. You could build a shed with it, but nothing lives inside." Bidder 74 declines to inspect.
  *Estimate:* 10–20 EP. (Unsold since 1900).

  **LOT 106: Fresnel-Maxwell Coefficients**
  *Provenance:* Extracted from Lot 105.
  *Condition Report:* Structurally pristine. The relations hold perfectly despite the removal of the supporting furniture. These equations continue to do explanatory work in downstream applications.
  *Bidder Notes:* Bidder 74 submits standing bid: "Will take at reserve. Structure is sound regardless of substrate." This lot has not failed to sell in forty years.
  *Estimate:* 500–700 EP.

  **LOT 107: Phlogiston Residue**
  *Provenance:* Stahl's Private Collection.
  *Condition Report:* Highly combustible. Contains significant negative weight.
  *Bidder Notes:* Bidder 12 remarks: "Combustible scrap. It burns, but it lies about why."
  *Estimate:* 30–50 EP.

  **LOT 108: The Successor Ontology**
  *Provenance:* The Future.
  *Condition Report:* Held in reserve. The House knows only that this lot will eventually occupy the whole of the remaining floor. It cannot be described, as nothing so far conceived fits the label.
  *Bidder Notes:* Neither Bidder 74 nor Bidder 12 has raised a paddle for this item. Bidder 74 claims no structure exists to bid on; Bidder 12 claims it is likely more scrap.
  *Estimate:* Reserve Price: All Remaining Floor Space.

  **LOT 109: The Principle of Uniformity (Including This Catalogue)**
  *Provenance:* The House Itself.
  *Condition Report:* Offered as is, with all faults. No warranty as to reference.
  *Bidder Notes:* Bidding opened at 100 EP. Dispute arose regarding whether the withdrawal of the lot validates the maxim underwriting the sale or merely postpones it.
  *Estimate:* Withdrawn at 17:00 hours.

  **CONDITIONS OF SALE**
  The Antimonian Saleroom acts solely as an intermediary between the Past and the Present. The House accepts no liability for theories found to be approximately true but fundamentally mistaken. All sales are final. Bidder 12 is reminded that declaring the building itself to be scrap does not exempt him from the buyer's premium. Bidder 74 is reminded that structures without objects may float away. The House reserves the right to withdraw any lot should the consensus reality shift during the auction. Payment in Epistemes must be cleared before removal of ontology.
