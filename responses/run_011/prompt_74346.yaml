prompt: |-
  Taking a Weber seminar this term and separately doing an independent reading thing on American drama, and I want to try reading Death of a Salesman as a Protestant Ethic text with the theology deleted. My hunch, which might be dumb: Willy keeps the *structure* of the Calvinist move — a visible sign standing in for an invisible status you can never actually verify — but swaps out methodical labor for being well liked, so he's running a charisma test as if it were proof of election, with the asceticism missing entirely. Bernard is the control condition: he does the boring plodding thing and ends up arguing before the Supreme Court. But the play keeps pointing at structural causes instead — commission, the mortgage, the house walled in by aparment blocks, Howard simply not needing him anymore. So does Miller confirm Weber, i.e. the ethic still does causal work after the doctrine is gone and the iron cage closes anyway, or refute him, i.e. the values are just the story the characters tell themselves about a fate that's economic? I want you to actually engage the methodological worry in Weber — explaining outcomes with values, elective affinity as his hedge, the whole direction-of-causation problem — rather than just waving at the American dream. And be honest about where my mapping is forced; I half suspect I'm collapsing a macro claim about a religious ethic into a personality trait, which is exactly the mistake Weber's own critics make of him. If the reading does land, what does the play show about that ethic that argument alone couldn't? No quotes or reading list please, I'm on a bus and can't look anything up.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
