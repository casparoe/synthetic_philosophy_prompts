prompt: |-
  I'm a staff software engineer at a company of roughly two hundred people, and I own the process by which contested technical calls get settled: code reviews where reviewers disagree, incident diagnoses that are disputed while the page is still open, and go/no-go decisions on releases. I make or arbitrate about five of these a week. Each one goes into a written record that people read months later, and on the release calls the cost of being wrong ranges from a wasted sprint to a multi-hour customer-facing outage. I have no formal philosophy training. What I have is a recurring pattern I handle badly.

  The pattern: the evidence in front of me — the diff, the logs, the test output — points one way, and then a separate class of fact points the other. That second class includes things like: a colleague I rate as my equal on this code disagrees with me; I have been awake for nineteen hours; I misdiagnosed something structurally similar last quarter; the one reviewer who agrees with me is known for agreeing with me; and in this company whoever asserts hardest tends to carry the room. I have no principled way to combine the two classes, so I improvise, and the improvisation is visibly mood-dependent. There is also a second failure I would be embarrassed to describe out loud: I work through a counterargument, conclude that my original read was correct, write that down — and then continue to behave as though I believed the opposite.

  What I want is a decision procedure I can run in this role. Not an essay on disagreement, and no reading list; I cannot look anything up mid-incident, and I would rather you define any term you use than gesture at a literature. Specifically:

  - Give the questions in the order they should be asked, and say what counts as a sufficient answer to each. State which questions are being answered by the evidence about the system and which by evidence about my own reliability, and keep those two separated all the way down — I suspect collapsing them is most of my problem.
  - Include an explicit rule for known impairments (fatigue, time pressure, a recent confident error on a similar case, an incentive to be right). Say whether the discount applies to my conclusion or to my confidence in my reasoning about it, and why that difference changes what I do next.
  - Address the circularity I keep running into: if the procedure says to defer when my peers disagree, and my peers are running the same procedure and deferring to me, the group converges on nothing. Give me a stopping rule and say what it costs.
  - Address the state described above, where my judgment about what the evidence supports and my actual belief come apart. Say what the procedure requires of me there — revise the belief, reopen the evidence, or keep the belief and act against it — and say plainly whether a mismatch between my action and my own assessment of the evidence is always a defect I am obliged to repair, or sometimes the correct place to be.
  - Separate what to believe from what to do. Most of my calls are forced and time-boxed, so the procedure must say when an unresolved epistemic state still yields a determinate action, and it must make the asymmetry of costs — not a manufactured confidence — the thing that settles it.
  - Specify what I write into the record, in a form that lets me later check whether my discounting was calibrated. I already keep a log of calls I got right and wrong; the procedure should feed that log rather than merely appeal to it.
  - Mark, step by step, which parts are genuinely mechanical and which are judgment calls dressed as procedure. I would rather have three honest judgment calls than twelve fake ones.
  - Say what the procedure cannot settle and where it hands the decision back to a person. I expect at minimum that it cannot resolve disputes that are really about risk appetite or priorities, and that it cannot tell me whether someone is my peer on a question I understand worse than they do. If there are further blind spots, name them.

  Deliver two variants: a full version for planned decisions where I have a day, and a degraded version runnable in twenty minutes at three in the morning. The degraded version has to work when operated by the impaired person it exists to check, which I realize is a design problem rather than a footnote — please treat it as one.

  Then run the procedure on three cases.

  1. A test in our payments service fails roughly one run in forty. A colleague who has worked on this code longer than I have, and whom I would rate as at least my equal, is confident it is a real ordering bug between two writers and wants the release held. I have read the relevant code three times across two days and cannot find a path that produces the failure; the signature also matches a known timing sensitivity in the harness itself. The release is scheduled for Thursday and two other teams are blocked on it.

  2. I am paged at 03:10. I have been awake nineteen hours and skipped dinner. Error rates on one service are elevated but not catastrophic. Within twenty minutes I conclude the cause is a bad deploy by a downstream vendor and that rolling back our own service will make things worse. I then remember that last quarter I confidently attributed a similar signature to a vendor and it turned out to be our connection pool, and that the colleague who would normally check my read is asleep and would have to be paged.

  3. Six weeks ago I arbitrated whether to adopt a new storage layer. After reading both sides I concluded, and recorded, that the evidence favored adoption. Since then I have kept commissioning analyses that would expose problems with it, I have under-resourced the migration, and I hedge in meetings. I have also noticed that the input I gathered at the time came mostly from people who were performing confidence rather than reporting independent readings.

  At least one of these should come out against my preferences. Say so directly instead of softening it: I would rather learn now that the procedure costs me something I value than discover it during an outage.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Staff Software Engineer at a ~200 person company. Owns the arbitration process for contested technical calls (code reviews, incidents, release decisions).
      *   **Volume/Stakes:** ~5 decisions/week. Stakes range from wasted sprint to multi-hour outage. Written records kept for months/years.
      *   **Problem:** Struggles to combine "System Evidence" (logs, diffs, tests) with "Meta-Evidence" (fatigue, peer disagreement, past errors, social dynamics). Improvises based on mood. Experiences a disconnect between intellectual conclusion and actual belief/behavior.
      *   **Constraints:** No formal philosophy training. No looking things up mid-incident. Needs a concrete decision procedure (questions, order, sufficiency). Needs to separate "what to believe" from "what to do." Needs to handle circularity (peer deference). Needs to address the belief/action mismatch. Needs to specify record-keeping for calibration. Needs to distinguish mechanical steps from judgment calls. Needs to acknowledge limitations.
      *   **Deliverables:**
          1.  Full Version (Planned decisions, ~1 day).
          2.  Degraded Version (Incident/Emergency, ~20 mins, impaired operator).
          3.  Application to 3 specific cases (one must go against preference).

  2.  **Deconstruct the Core Problem:**
      *   The user is conflating *Epistemic Status* (What is true?) with *Decision Policy* (What should we do given uncertainty and costs?).
      *   The user is failing to discount their own cognition when meta-evidence (fatigue, bias) suggests unreliability.
      *   The user is experiencing "Akrasia" (knowing the right thing but doing the opposite) or perhaps "Belief-Behavior Decoupling" due to social pressure or hidden risk aversion.
      *   The user needs a *algorithm* that forces separation of concerns.

  3.  **Drafting the Procedure - Core Principles:**
      *   **Separation:** System Evidence vs. Operator Evidence.
      *   **Discounting:** Meta-evidence discounts *confidence*, not necessarily the *conclusion*, but low confidence triggers different *actions*.
      *   **Asymmetry:** Decisions are driven by cost of error, not just probability of truth.
      *   **Record Keeping:** Must capture the *state* at the time, not just the outcome.
      *   **Circularity:** Needs a tie-breaker based on role authority, not just consensus.

  4.  **Developing the Full Version (The "Day" Protocol):**
      *   *Phase 1: Evidence Separation.* List System Facts. List Operator Facts.
      *   *Phase 2: Confidence Calibration.* Apply discounts to Operator confidence based on Operator Facts.
      *   *Phase 3: Cost Assessment.* What happens if I'm wrong? (False Positive vs. False Negative).
      *   *Phase 4: Decision Rule.* Combine Calibrated Confidence + Cost Asymmetry.
      *   *Phase 5: Action/Belief Check.* If Action != Belief, record why.
      *   *Phase 6: Recording.* Specific fields for the log.

  5.  **Developing the Degraded Version (The "3 AM" Protocol):**
      *   *Constraint:* Cognitive load must be minimal. Checklists work best.
      *   *Constraint:* Must account for the fact that the *operator* is impaired.
      *   *Mechanism:* Hard stops. If "Impaired" flag is tripped, confidence is automatically capped.
      *   *Mechanism:* Default to safety/reversibility if confidence is capped.
      *   *Simplification:* Merge Evidence phases. Focus heavily on Cost Asymmetry.

  6.  **Addressing Specific User Requirements:**
      *   *Circularity:* If peers defer to me, I am the "Designated Decider." The cost of delay is the tie-breaker.
      *   *Belief/Action Mismatch:* It is *not* always a defect. If risk is asymmetric, acting against a slight belief is rational. But it must be recorded as "Risk Mitigation," not "Judgment."
      *   *Mechanical vs. Judgment:* Label them explicitly.
      *   *Blind Spots:* Risk appetite, peer rating accuracy, unknown unknowns.

  7.  **Running the Cases:**
      *   *Case 1 (Payments Test):* System Evidence = Ambiguous (can't find bug vs. harness noise). Operator Evidence = Peer disagreement. Cost = Release delay vs. Outage. *Outcome:* Likely Hold (Cost of payments bug is high). *Preference Check:* User wants to release (blocked teams). Procedure might say Hold.
      *   *Case 2 (3 AM Page):* System Evidence = Vendor signature. Operator Evidence = Fatigue + Past Error. Cost = Rollback pain vs. Extended Outage. *Outcome:* Mitigate first, verify later. Don't trust the "Vendor" diagnosis fully due to fatigue discount. *Preference Check:* User wants to avoid paging colleague. Procedure might say Page Colleague or Mitigate conservatively.
      *   *Case 3 (Storage Layer):* System Evidence = Past decision. Operator Evidence = Hedging/Under-resourcing (Behavioral signal). Cost = Migration stall vs. Technical Debt. *Outcome:* Acknowledge the belief/action split. Re-evaluate or Commit. *Preference Check:* User is hedging. Procedure forces a commit or a revert.

      *Refining Case 1:* User says "I have read the code... cannot find a path." Peer says "Real bug." User prefers Release (teams blocked). Cost of payments bug is high. Procedure should likely say **Hold**. This goes against user's preference to unblock teams.
      *Refining Case 2:* User says "Vendor issue." Past error = similar signature was internal. Fatigue = High. User prefers "Don't page colleague." Procedure should likely say **Page Colleague** or **Assume Internal**. This goes against user's preference to sleep/avoid social cost.
      *Refining Case 3:* User decided "Adopt." Behavior = "Hedge." Procedure should identify the mismatch. Either **Commit Resources** or **Revoke Decision**. User prefers hedging. Procedure says **Stop Hedging**.

  8.  **Refining the "Belief vs. Action" Mismatch:**
      *   The user asks: "is a mismatch... always a defect?"
      *   Answer: No. It's "Pragmatic Acceptance." I believe X is true (60%), but I act as if Not-X is true because the cost of X is catastrophic. This is not hypocrisy; it's risk management. The record must reflect this distinction.

  9.  **Structuring the Output:**
      *   Introduction (acknowledging the role).
      *   Definitions (System Evidence, Operator Evidence, etc.).
      *   Full Procedure (Step-by-step, labeled Mechanical/Judgment).
      *   Degraded Procedure (Checklist style, hard constraints).
      *   Limitations/Blind Spots.
      *   Case Studies (Applied rigorously).

  10. **Self-Correction/Review during drafting:**
      *   *Critique:* Is the degraded version too complex for a tired person?
      *   *Fix:* Make the degraded version a "Traffic Light" system. Red = Stop/Ask. Green = Go. Yellow = Mitigate.
      *   *Critique:* Did I address the circularity?
      *   *Fix:* Explicit rule: "The Arbitrator is the sink." If peers defer, you decide based on Cost, not Consensus.
      *   *Critique:* Did I address the recording?
      *   *Fix:* Define the "Arbitration Log Schema."
      *   *Critique:* The user mentioned "whoever asserts hardest tends to carry the room."
      *   *Fix:* The procedure must explicitly ignore "Assertion Strength" as evidence. It is noise.

  11. **Final Polish:** Ensure tone is professional, direct, and respectful of the user's expertise. Avoid fluff. Ensure the "Against Preference" constraint is met clearly. (Case 1 is the best candidate for this: User wants to ship, Procedure says Hold due to Payment risk + Peer Disagreement).

  *(Self-Correction on Case 1)*: Wait, if the user is the arbitrator, and the peer disagrees, does the procedure default to the peer? No, that's abdicating. The procedure must weigh the *type* of evidence. Peer intuition vs. Code inspection. In payments, false negatives (missing a bug) are worse than false positives (delaying). So Hold is the rational choice even if User thinks it's a harness bug. This opposes the User's desire to unblock teams.

  *(Self-Correction on Case 2)*: User is impaired. Procedure must force a "Confidence Cap." If Confidence Cap < Threshold for Action, you *must* escalate or mitigate. User wants to solve it alone. Procedure says "Page the colleague." This opposes User's preference.

  *(Self-Correction on Case 3)*: This is a long-term belief/action split. Procedure says "Align or Revoke." User prefers hedging. Procedure opposes this.

  Okay, I have enough to construct the response. I will focus on clarity, structure, and strict adherence to the prompt's constraints.cw
answer: |-
  Here is the decision procedure, designed for your specific constraints and failure modes.

  ### Definitions

  *   **System Evidence (S-Ev):** Facts about the code, infrastructure, or logs independent of human interpretation (e.g., "Test fails 1/40 runs," "CPU spiked to 100%," "Diff touches payment logic").
  *   **Operator Evidence (O-Ev):** Facts about the humans involved, including you (e.g., "I have been awake 19 hours," "Peer X disagrees," "I was wrong on a similar case last quarter," "Peer Y is known for agreeability").
  *   **Calibrated Confidence (CC):** Your estimated probability that your technical conclusion is correct, *after* applying discounts from O-Ev.
  *   **Cost Asymmetry (CA):** The ratio of cost between a False Positive (acting when you should have waited) and a False Negative (waiting when you should have acted).
  *   **The Record:** The written log entry. It must capture the *state at the time of decision*, not the hindsight outcome.

  ---

  ### Variant 1: The Full Procedure (Planned Decisions)
  *Use for: Release go/no-go, architectural arbitration, post-mortem root cause.*
  *Time budget: Up to 24 hours.*

  **Step 1: Evidence Segregation (Mechanical)**
  *   **Action:** Create two lists. List A is **S-Ev**. List B is **O-Ev**.
  *   **Rule:** If a fact describes the state of a person (including you), it goes in List B. If it describes the state of the machine, it goes in List A.
  *   **Constraint:** "Assertion Strength" (how loudly someone argues) is **not** evidence. Discard it.
  *   **Sufficiency:** You stop when adding a new fact requires more than 30 minutes of research.

  **Step 2: The Operator Discount (Judgment)**
  *   **Action:** Assign a **Reliability Multiplier (RM)** between 0.1 and 1.0 to your own initial conclusion.
  *   **Rule:** Start at 1.0. Apply the following discounts cumulatively:
      *   Awake < 6 hours in last 24: RM = 0.5
      *   Disagreement from a rated Peer: RM = 0.6
      *   Confident error on similar case in last 6 months: RM = 0.5
      *   Incentive to be right (e.g., you own the release timeline): RM = 0.7
      *   *Note:* Discounts multiply. (e.g., Fatigue + Peer Disagreement = 0.3).
  *   **Sufficiency:** If RM < 0.4, you are procedurally barred from making a unilateral "Go" decision. You must escalate or defer.

  **Step 3: Cost Asymmetry Calculation (Mechanical)**
  *   **Action:** Define the worst-case outcome of being wrong in both directions.
      *   **Cost(False Positive):** Cost if you act and your technical read is wrong. (e.g., "Outage," "Data Corruption").
      *   **Cost(False Negative):** Cost if you wait and your technical read was right. (e.g., "Delayed Sprint," "Missed SLA").
  *   **Rule:** Classify the asymmetry.
      *   **Type A (Safety Critical):** Cost(FP) >> Cost(FN). (e.g., Payments, Data Loss).
      *   **Type B (Velocity Critical):** Cost(FN) >> Cost(FP). (e.g., Hotfix for UI glitch, Internal tool).
  *   **Sufficiency:** If you cannot define the worst case in one sentence, you do not have enough context to decide. Pause.

  **Step 4: The Decision Rule (Mechanical)**
  *   **Action:** Compare **Calibrated Confidence (CC)** against the **Action Threshold**.
  *   **Rule:**
      *   If **Type A (Safety)**: Action Threshold = 90% CC.
      *   If **Type B (Velocity)**: Action Threshold = 60% CC.
  *   **Logic:** If CC < Threshold, the default action is **No-Go / Mitigate / Investigate**.
  *   **Circularity Stopper:** If peers are deferring to you, you are the Arbitrator. Their deference is O-Ev (it increases social pressure, not technical truth). Do not lower the threshold because they are quiet. The cost of delay is the tie-breaker. If Cost(FN) is acceptable, wait. If Cost(FN) is catastrophic, act but document the low CC.

  **Step 5: Belief/Action Reconciliation (Judgment)**
  *   **Action:** Compare your **Technical Belief** (what S-Ev says) with your **Decision** (what Step 4 says).
  *   **Rule:**
      *   If Belief == Decision: Record as "Technical Decision."
      *   If Belief != Decision: Record as "Risk Mitigation."
  *   **Sufficiency:** A mismatch is **not** a defect if it is driven by Step 4 (Cost Asymmetry). It is a defect if it is driven by unrecorded social pressure or fatigue.
  *   **Requirement:** If you act against your belief, you must explicitly write: *"I believe X is true, but we are acting as if Not-X is true because the cost of X being wrong is unacceptable."*

  **Step 6: The Record (Mechanical)**
  *   **Action:** Write the entry using this schema:
      1.  **Decision:** [Go / No-Go / Mitigate]
      2.  **Technical Belief:** [What I think is actually happening]
      3.  **Calibrated Confidence:** [XX%]
      4.  **Operator Discounts Applied:** [List from Step 2]
      5.  **Cost Asymmetry:** [Type A or B]
      6.  **Mismatch Flag:** [Yes/No - if Yes, paste the Risk Mitigation statement from Step 5]

  ---

  ### Variant 2: The Degraded Procedure (Incident / 3 AM)
  *Use for: Live pages, active outages, immediate release blocks.*
  *Time budget: 20 minutes.*
  *Design Note: This assumes the operator is cognitively impaired. It relies on hard stops, not calculation.*

  **Step 1: The Impairment Check (Mechanical)**
  *   **Action:** Ask: "Am I past 16 hours awake? Have I skipped a meal? Is this a repeat of a recent error?"
  *   **Rule:** If **YES** to any: **Confidence Cap = 50%.** You are procedurally incapable of high-confidence judgment.
  *   **Consequence:** You cannot unilaterally declare "Root Cause Found." You can only declare "Mitigation Applied."

  **Step 2: The Reversibility Test (Mechanical)**
  *   **Action:** Ask: "If I am wrong, can I undo this action in < 5 minutes with no data loss?"
  *   **Rule:**
      *   **Yes:** Proceed to Step 3.
      *   **No:** You **must** page a second person (even if asleep) or execute the conservative default (e.g., Rollback, not Forward-Fix).
  *   **Why:** This bypasses the need for confidence calculation. Irreversible actions require two brains.

  **Step 3: The "Two-Source" Rule (Judgment)**
  *   **Action:** Do you have two independent sources of S-Ev pointing to the same cause? (e.g., Logs + Metrics, or Code + Repro).
  *   **Rule:**
      *   **Yes:** Execute Mitigation.
      *   **No:** Execute Conservative Default (Rollback / Restart).
  *   **Constraint:** A colleague's agreement does not count as a second source if you are both looking at the same dashboard.

  **Step 4: The Record (Mechanical)**
  *   **Action:** Log the following immediately after stabilization:
      1.  **Impairment Flag:** [Yes/No]
      2.  **Reversibility:** [Yes/No]
      3.  **Action Taken:** [Mitigation / Conservative Default]
      4.  **Validation Required:** [Yes/No - If Impairment=Yes, Validation MUST be Yes]

  ---

  ### Limitations and Blind Spots

  1.  **Peer Rating Accuracy:** The procedure assumes you know who your peers are. It cannot tell you if you are underrating a junior who is actually right, or overrating a senior who is coasting. This remains a judgment call.
  2.  **Risk Appetite:** The procedure classifies costs (Type A vs. B), but it cannot determine the company's tolerance for risk. If the company is in "survival mode," Type B might override Type A. You must know the current company posture.
  3.  **Unknown Unknowns:** The procedure handles *contested* calls. It cannot protect against evidence that no one has found yet.
  4.  **Handoff:** If the procedure says "Escalate," it hands the decision to a human (CTO, VP, On-Call Manager). It cannot force them to care.

  ---

  ### Case Applications

  #### Case 1: The Payments Test Flaky Failure
  *Context: Planned Release. You want to ship. Peer says Hold.*

  *   **Step 1 (Evidence):**
      *   S-Ev: Test fails 1/40. Code review shows no obvious race. Harness has known timing issues.
      *   O-Ev: Peer (equal rating, longer tenure) disagrees. You are under pressure (teams blocked).
  *   **Step 2 (Discount):**
      *   Base Confidence: 70% (It's likely the harness).
      *   Discount: Peer Disagreement (0.6). Incentive to be right (0.7).
      *   Calibrated Confidence: 70% * 0.6 * 0.7 = **29.4%**.
  *   **Step 3 (Cost):**
      *   Domain: Payments.
      *   Cost(FP - Ship Bug): Customer financial loss, regulatory risk, outage. (Catastrophic).
      *   Cost(FN - Delay): Wasted sprint for two teams. (High, but finite).
      *   Asymmetry: **Type A (Safety Critical)**.
  *   **Step 4 (Decision):**
      *   Threshold for Type A: 90%.
      *   Your CC: 29.4%.
      *   **Decision: NO-GO (Hold Release).**
  *   **Step 5 (Mismatch):**
      *   Belief: "It is likely the harness."
      *   Action: "Hold Release."
      *   Record Statement: *"I believe the failure is likely a harness artifact, but we are acting as if it is a data bug because the cost of a payments error exceeds the cost of a sprint delay."*
  *   **Outcome vs. Preference:** **Against Preference.** You wanted to unblock the teams. The procedure forces the hold because your confidence is discounted by the peer disagreement and the cost asymmetry is too high to gamble on your 70% gut feel.

  #### Case 2: The 3 AM Page
  *Context: Incident. You are impaired. You want to avoid paging the colleague.*

  *   **Step 1 (Impairment Check):**
      *   Awake 19 hours? **Yes.**
      *   **Confidence Cap = 50%.**
  *   **Step 2 (Reversibility):**
      *   Action: Rolling back downstream vendor dependency?
      *   Reversibility: Likely **No** (or high friction/risk).
      *   **Rule:** Since Reversibility = No, you **must** page a second person OR execute Conservative Default.
  *   **Step 3 (Two-Source):**
      *   Source 1: Error signature matches vendor.
      *   Source 2: None (Colleague asleep).
      *   **Rule:** Fails Two-Source.
  *   **Step 4 (Decision):**
      *   **Decision: PAGE THE COLLEAGUE.**
      *   Alternative: If you absolutely refuse to page, you must execute the Conservative Default (which might be restarting your own service to clear connection pools, rather than assuming vendor fault).
  *   **Step 5 (Record):**
      *   Impairment Flag: Yes.
      *   Validation Required: Yes (Colleague must confirm root cause post-incident).
  *   **Outcome vs. Preference:** **Against Preference.** You wanted to solve it alone to let them sleep. The procedure identifies your fatigue as a critical risk factor and forces escalation for irreversible actions.

  #### Case 3: The Storage Layer Hedging
  *Context: Long-term arbitration. You decided "Adopt." You are behaving "No-Go."*

  *   **Step 1 (Evidence):**
      *   S-Ev: Past analysis favored adoption.
      *   O-Ev: You are under-resourcing the migration. You are hedging in meetings. Input source was "performing confidence."
  *   **Step 2 (Discount):**
      *   Base Confidence: (Originally high).
      *   Discount: "Performing confidence" source (0.5). Behavioral signal (your own hedging) indicates hidden doubt (0.5).
      *   Calibrated Confidence: **Low.**
  *   **Step 3 (Belief/Action Reconciliation):**
      *   Belief (Recorded): "Adopt."
      *   Action (Observed): "Hedge/Starve."
      *   Mismatch Flag: **YES.**
  *   **Step 4 (Decision):**
      *   The procedure does not allow a permanent mismatch. It is a defect in the record.
      *   **Decision: REVOKE OR COMMIT.**
      *   You must either:
          1.  Update the Record to "Do Not Adopt" (aligning belief with action).
          2.  Allocate Resources to match "Adopt" (aligning action with belief).
  *   **Step 5 (Record):**
      *   Update the original arbitration log. Add an addendum: *"Original decision stands, but resource allocation was misaligned. Correcting now."* OR *"Original decision invalidated by new meta-evidence regarding source reliability."*
  *   **Outcome vs. Preference:** **Against Preference.** You prefer the safety of hedging (keeping options open without commitment). The procedure forces you to collapse the wave function. Hedging is not a valid state in the record; it is a failure of arbitration.

  ### Summary of Calibration for Your Log

  To ensure this procedure improves you over time, your log must allow you to query the following after 6 months:

  1.  *"Show me all decisions where Operator Discount > 0.5."* (Did I correctly identify my own impairment?)
  2.  *"Show me all decisions where Belief != Action."* (Were these actually risk mitigations, or was I cowardly?)
  3.  *"Show me all Type A decisions where Calibrated Confidence was < 90%."* (Did we survive the gambles, or did I miss the severity?)

  This system treats your own mind as a fallible component in the architecture, subject to the same redundancy and failure-mode analysis as the code you review.
