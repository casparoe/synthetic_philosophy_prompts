  ### 1. The Near-Misses and Why They Fail

  **Instrumentalism / Fictionalism**
  *   **The Concept:** The view that mentalistic talk is a useful tool for prediction or exposition but does not correspond to reality.
  *   **Why it fails:** Both instrumentalism and fictionalism require an *avowal*. The theorist must explicitly state, "I am using this language *as if* it were true, though I know it is not." Your pattern is defined by the *absence* of this marker. The theorist offers the mentalistic explanation as the *actual* account of the case, not a convenient proxy.

  **Performative Contradiction / Pragmatic Inconsistency**
  *   **The Concept:** A logical or pragmatic fault where the act of asserting a proposition undermines its content (e.g., "I am not speaking").
  *   **Why it fails:** As you noted, the doctrine (animals have no minds) is not contradicted by the act of explaining them (using mental words). Furthermore, "contradiction" and "inconsistency" are normative labels implying error or instability. You are describing a stable, recurring methodological feature that persists across centuries without collapsing the theory. The literature uses these terms to *criticize* the theorist, not to name the structural feature that allows the theory to survive.

  **The Intentional Stance (Dennett)**
  *   **The Concept:** The strategy of predicting behavior by treating the entity as a rational agent.
  *   **Why it fails:** Dennett explicitly marks this as a *stance* distinct from the *physical* or *design* stance. He theorizes the switch. Your pattern involves theorists who do not theorize the switch; they simply inhabit both registers without acknowledging the boundary.

  **Methodological Behaviorism**
  *   **The Concept:** The restriction of scientific inquiry to observable behavior.
  *   **Why it fails:** Strict methodological behaviorism forbids the vocabulary you describe (expects, remembers). When behaviorists use it, it is typically categorized as "mentalistic slippage" or "anthropomorphic drift"—terms that imply a lapse in rigor rather than a structural feature of the methodology.

  ### 2. The Coinage: Unmarked Explanatory Intentionalism (UEI)

  Since the literature lacks a neutral, structural term for this phenomenon, I propose **Unmarked Explanatory Intentionalism (UEI)**.

  **Definition:**
  UEI is a methodological configuration in which a theorist maintains an ontological doctrine that eliminates a specific class of states (e.g., mental states in animals), while simultaneously employing the vocabulary of those eliminated states to provide causal explanations of specific behaviors, without marking that vocabulary as metaphorical, instrumental, provisional, or fictional.

  **Necessary Conditions:**
  1.  **Explicit Elimination:** The ontological denial must be stated flatly as doctrine (e.g., "Beasts are automata").
  2.  **Explanatory Realism:** The mentalistic vocabulary must be used to do explanatory work (e.g., "The dog *remembers* the path"), not merely descriptive work.
  3.  **Absence of Marking:** There must be no textual signal (hedge, scare quotes, "as if," "so to speak") indicating that the vocabulary is non-literal.
  4.  **Coexistence:** Both registers must appear within the same theoretical corpus, often in close proximity, without an explicit reconciliation strategy.

  **Where Your Description Overshoots/Undershoots:**
  *   **Overshoot:** Your description implies the theorist is "earnest" in both registers. UEI requires only that the text *reads* as earnest. It does not require access to the theorist's private beliefs. A theorist could be cynically employing UEI, and the term would still apply.
  *   **Undershoot:** Your description focuses on animal minds. UEI is domain-neutral. It applies equally to AI researchers who deny understanding while writing that a model "knows" its parameters, or to neuroscientists who deny the self while writing that the brain "decides."

  **Near Neighbours and Confusion:**
  *   **Confused with:** *Implicit Anthropomorphism*.
      *   *Distinction:* Implicit anthropomorphism suggests the theorist is unaware they are attributing mental states. In UEI, the theorist is often hyper-aware of the doctrine (e.g., Descartes' arguments against animal reason) but fails to carry that restriction into the explanatory register.
  *   **Confused with:** *Methodological Intentionalism*.
      *   *Distinction:* Methodological Intentionalism is usually an avowed strategy ("We treat the system as intentional for the sake of prediction"). UEI is unavowed; the explanation is presented as ontologically robust within the local context.

  ### 3. Neutrality Between Readings of Descartes

  The concept of UEI is **neutral** between the two camps of Descartes commentators you described.

  *   **Camp 1 (The Automaton Thesis is a Slogan):** They can argue that the presence of UEI shows the eliminative doctrine was never fully integrated into the explanatory practice, suggesting the doctrine was weak or secondary.
  *   **Camp 2 (The Automaton Thesis is Intact):** They can argue that UEI is a stable, sustainable methodological feature. The fact that Descartes uses unmarked intentional language does not prove he believed animals had minds; it proves only that the *explanatory register* of early modern science lacked a non-intentional vocabulary for complex adaptive behavior.

  Possessing the term UEI does not force a verdict on whether Descartes was confused or consistent; it merely names the structural feature that makes the dispute difficult to settle. It shifts the debate from "Did he contradict himself?" to "How does his methodology sustain this dual register?"

  ### 4. Boundary Cases

  To test the definition, consider these three cases where application is genuinely unclear:

  1.  **B.F. Skinner:** In *Verbal Behavior*, Skinner eliminates mental causes but frequently uses terms like "seeing," "hearing," and "remembering" as names for behaviors.
      *   *Uncertainty:* Is this UEI, or is it a redefinition of terms? If Skinner defines "remembering" strictly as "emitting a response previously reinforced," is the intentional vocabulary still "unmarked," or is it technically behaviorist jargon wearing mentalist clothes?
  2.  **Modern Large Language Model (LLM) Researchers:** A paper states, "The model has no understanding," but the analysis says, "The model attends to the subject of the sentence."
      *   *Uncertainty:* "Attention" is a technical term in machine learning (attention mechanisms). Does the existence of a technical referent count as a "marker" that removes it from UEI? Or is the overlap with the mental concept sufficiently strong that it counts as Unmarked Explanatory Intentionalism?
  3.  **Stoic Physics:** The Stoics denied irrational animals *logos* (reason) but attributed to them *phantasiai* (impressions) and *orexis* (impulse).
      *   *Uncertainty:* If *orexis* is technically distinct from human desire in Stoic metaphysics, is using the word "desire" in translation/explanation an instance of UEI, or is it a category error by the interpreter? If the Stoic himself used the common word without qualification, does it count?

  ### 5. What Would Change My Verdict

  I would conclude that an established concept covers this if:

  1.  **"Methodological Dualism" is rehabilitated:** If I found that "Methodological Dualism" is standardly defined in philosophy of science not as mind-body separation, but as the separation of *ontological commitment* from *explanatory practice* without avowal. (Currently, it usually refers to treating mind and body as distinct methodological objects).
  2.  **"The Intentional Idiom" is formalized:** If there were a standard definition of "using the intentional idiom" that explicitly includes the *lack of instrumentalist disclaimer* as a defining feature. (Currently, "idiom" usually implies a recognized mode of speech, which functions as a marker itself).

  ### 6. Where My Carving is Likely to Fail

  The definition of UEI is most likely to fail in cases of **Terminological Drift**.

  *   **The Failure Mode:** A theorist begins with a strict eliminative doctrine but, over decades, subtly redefines the mentalistic terms to fit the eliminative framework (e.g., "When I say the rat 'expects', I mean it is in state S").
  *   **Why it breaks UEI:** If the redefinition is explicit, it's not UEI. If the redefinition is implicit and gradual, UEI might classify it as "Unmarked," but the phenomenon is actually **Conceptual Erosion**. UEI assumes the vocabulary retains its standard intentional meaning while the doctrine denies it. If the vocabulary's meaning has shifted to match the doctrine, there is no tension to name.
  *   **The Test Case:** If Descartes privately defined "memory" in animals as "purely mechanical trace retention" but used the word "memory" publicly without explaining the redefinition, is this UEI or **Esoteric Redefinition**? UEI treats it as a dual register; Esoteric Redefinition treats it as a single register with a hidden key. Distinguishing these requires biographical evidence the text alone cannot provide.

  ### Summary

  You have identified a gap. The literature pathologizes this pattern as "inconsistency" or sanitizes it as "instrumentalism," but lacks a term for the stable, unmarked coexistence of the two. **Unmarked Explanatory Intentionalism** captures the structural feature without prejudging the theorist's coherence. It allows you to analyze the *methodology* of the beast-machine argument without getting trapped in the *ontology* of the beast-machine itself.
