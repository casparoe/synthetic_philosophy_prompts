answer: |-
  Your resentment is a symptom of your own mistake in conflating stewardship with technical mastery, not an injury entitled to redress. Neither remedy is advisable, as both prioritize your ego over the collection's welfare and the assistant's dignity. You must instead forge a third path that accepts your changed role without diminishing his.

  The error lies in allowing the division of labor to become a hierarchy of worth. You outsourced the *practice* of restoration while retaining the *institution* of curatorship, creating a hollow authority that resents the substance it lacks. The philosophy you read often frames conflict as duty versus interest, but this is a crisis of identity. Retirement requires a death of the professional self to birth the elder self. You are mourning the technician while blocking the successor. This is not a clash of interests, but a failure of transition.

  Remedy one is sabotage disguised as generosity. Exiling him sacrifices the collection's future and his career for your comfort. It is unjust. Remedy two is regression. Denying reality—that your skills have atrophied and his flourished—risks damaging the instruments. It is imprudent. Both treat the assistant as a means to your end, rather than a practitioner in his own right.

  You need a third path: redefine curatorship. Your value is no longer in the soldering iron but in context, history, and advocacy. Let him be the hands; you be the voice. Acknowledge his expertise publicly to dissolve the tension. True authority admits when it has been surpassed. Formalize his title. Ask the Trust to rename him 'Conservator' while you become 'Curator Emeritus'. This clarifies the chain of command without demoting him. It gives you the dignity of history and him the authority of skill. Your legacy is not the instruments you fixed, but the craftsman you enabled.
