answer: |-
  The step that does the damage is **Premise (4)**.

  It looks innocent because it appeals to a compelling historical narrative: in hindsight, we know Neptune was there and Vulcan was not, so it seems obvious that "success" is the only thing that mattered. It conflates the *context of justification* (was the belief warranted?) with the *context of discovery* (how did they find it?) and the *outcome* (was it true?). By claiming that *nothing other than* the outcome settled the choice, Premise (4) eliminates the possibility of methodological rationality *ex ante*. It reduces methodology to a scoreboard.

  Here is the diagnosis, the cost, and the contested terrain.

  ### 1. Why Reject (4)?
  Premise (4) asserts: *"In each case, what settled the choice between rescuing the core and rescuing the auxiliary was nothing other than how the bet turned out."*

  This is historically and philosophically false. Scientists did not suspend judgment on the rationality of Le Verrier's hypothesis until Neptune was visually confirmed. They regarded it as methodologically sound *before* the discovery because the auxiliary hypothesis (there exists a planet at position $X$ with mass $Y$) had **excess empirical content**. It entailed consequences *beyond* the anomaly it was designed to fix. It predicted a specific location in the sky where no planet was known to be. It was independently testable.

  Fomenko's auxiliaries (e.g., "radiocarbon calibration curves are globally distorted by a factor of $Z$") lack this content. They are constructed *solely* to absorb the recalcitrant data (the tree rings, the texts) without generating novel, risky predictions that could falsify the new chronology independently of the texts it seeks to reinterpret.

  By rejecting (4), you preserve the distinction between a **progressive problem shift** (the auxiliary leads to new discoveries) and a **degenerating problem shift** (the auxiliary is adjusted solely to accommodate existing anomalies). This distinction allows you to say that Le Verrier's move was methodologically superior to Fomenko's *before* Neptune was found.

  ### 2. The Neptune vs. Fomenko Distinction
  To answer your student's sharpest challenge directly: **Yes, there is a distinction other than the payoff.**

  *   **The Neptune Case:** The auxiliary hypothesis ($A_N$: an unseen planet exists) was *independently testable*. It made a prediction about the world (look at this coordinate) that was not entailed by the core theory (Newtonian mechanics) or the anomaly (Uranus's orbit) alone. If the telescope had looked and found nothing, $A_N$ would have been falsified *without* necessarily falsifying Newton.
  *   **The Fomenko Case:** The auxiliary hypothesis ($A_F$: dating methods are systematically flawed) is *not independently testable* in the same way. To test $A_F$, you must use dating methods. Fomenko rejects all independent dating methods (dendrochronology, varves, C14) as circular. Consequently, $A_F$ is insulated from any test that does not already presuppose the truth of the New Chronology. It absorbs all comers.

  The difference is not just that Neptune was found. The difference is that the *search for Neptune* was a risky gamble that could have failed in a way that would have damaged the auxiliary specifically. Fomenko's wager is structured so that it cannot lose; any evidence against it is dismissed as part of the "phantom" chronology.

  ### 3. The Cost of Rejecting (4) (While Keeping (1))
  You want to keep Premise (1) (Duhem-Quine: hypotheses are tested in conjunction with auxiliaries). Rejecting (4) while keeping (1) costs you **methodological innocence**.

  If (1) is true, logic alone cannot tell you whether to drop $H$ or $A$. You need a **normative criterion** to decide which auxiliary is permissible to modify. By rejecting (4), you are committing to the claim that some theoretical virtues (like independent testability, scope, or simplicity) provide rational warrant for theory choice *in the absence of conclusive verification*.

  You are asserting that science is not just a record of who guessed right (the "scoreboard" view of (4)), but a practice governed by rules of evidence that allow us to distinguish reasonable bets from unreasonable ones *before* the wheel stops spinning. This requires you to defend a notion of **confirmation** or **warrant** that is not identical to **truth**. You must argue that Le Verrier was *justified* even if Neptune hadn't been found (perhaps the telescope broke), whereas Fomenko is *unjustified* even if his chronology happens to match a few data points by accident.

  ### 4. Contested Terrain
  You must be transparent with your students that this solution rests on philosophical positions that are not universally settled. Here is where the debate lies:

  *   **The Demarcation Project:** Your student's conclusion (6) echoes Larry Laudan's famous argument in *"The Demise of the Demarcation Problem"* (1983). Laudan argued that no necessary and sufficient conditions (like falsifiability or testability) successfully separate science from pseudoscience without counterexamples. If Laudan is right, your rejection of (4) might be seen as imposing an arbitrary preference for "progressive" research programmes. You are taking the side of **Lakatos** or **Popper** against **Laudan**.
  *   **The Coherence of "Ad Hocness":** Premise (4) relies on the idea that we can't identify "ad hoc" moves until we see the outcome. Philosophers like Adolf Grünbaum have argued that "ad hocness" cannot be defined non-circularly without appealing to the truth of the theory. If the student is a sophisticated **constructivist** or **pragmatist**, they will argue that "independent testability" is itself theory-laden. You are assuming that "independence" is an objective feature of the test, which is a **Realist** commitment contested by **Anti-Realists**.
  *   **The Reach of Duhem-Quine:** While you want to keep (1), note that some philosophers (e.g., **Norton** or **Sober**) argue that Duhem-Quine is often overstated. In some cases, the auxiliary assumptions are so well-confirmed independently that the logic *does* effectively falsify the core hypothesis. If you lean this way, you can argue that Fomenko's auxiliaries are so poorly supported compared to the auxiliaries of geochronology that the underdetermination is negligible. However, this risks lapsing into the "crude falsificationism" you wish to avoid.

  ### Summary for the Classroom
  To dismantle the argument without abandoning Duhem:
  1.  **Grant (1):** Yes, logic alone doesn't force us to drop the core.
  2.  **Deny (4):** Rationality is not determined solely by outcomes. It is determined by the *riskiness* of the auxiliary assumption.
  3.  **Block (5):** Therefore, there *is* a methodological difference. Neptune was a risky prediction; Fomenko is an immune strategy.
  4.  **Save (6):** The line is not drawn by sociology, but by the normative rules of evidence (independent testability) that govern the practice, even if those rules are fallible.

  This preserves the integrity of historical method while acknowledging the logical underdetermination your course emphasizes. It admits that mainstream history could be wrong (the wager could fail), but insists that it is currently *more rational* to hold it than Fomenko's alternative.
