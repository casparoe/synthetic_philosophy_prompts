      *   **Constraint 2 (Running Case):** Use "The Corridor Case" as a fixed stipulation. All requirements must accommodate the facts of this case.
      *   **Constraint 3 (Structure):**
          *   Brainstorming section.
          *   Desiderata List (Requirement, Motivation/Case, Status).
          *   Must cover: (a) Distributive questions, (b) Aggregation questions, (c) Epistemic questions, (d) Normative-uptake questions, (e) Comparative baseline.
          *   Joint Satisfiability section (identify tensions/incompatibilities).
          *   Most Exclusionary Requirement section.
          *   Purposive Caveat section.
      *   **Constraint 4 (Style):** No bibliography/citations. Define terms if coining. Candid about prejudices vs. constraints. Skeptic-friendly.

  2.  **Brainstorming & Conceptual Mapping (Mental Draft):**
      *   *The Corridor Case Tensions:*
          *   Robot acted "correctly" per spec vs. caused harm. (Engineering compliance vs. Moral outcome).
          *   Risk was known but accepted vs. Harm occurred. (Ex ante reasonableness vs. Ex post tragedy).
          *   Human would likely have avoided *this* accident vs. Humans cause *more* accidents overall. (Specific counterfactual vs. Statistical baseline).
          *   Victim was negligent vs. Robot struck her. (Contributory negligence vs. Strict liability).
          *   No one could foresee *this* conjunction vs. System caused it. (Foreseeability vs. Causation).
      *   *Pressure Points:*
          *   **Moral Luck:** The engineers were lucky before, unlucky now. Does luck change liability?
          *   **The Responsibility Gap:** If no human was negligent and the machine isn't a moral agent, who pays/blames?
          *   **Efficiency vs. Justice:** Do we want to minimize total accidents (utilitarian) or punish fault (retributive/corrective)?
          *   **Knowability:** How can you be liable for what you couldn't know (the wax + partition + density combo)?
      *   *Opposing Pulls:*
          *   *Ex Ante vs. Ex Post:* Engineering wants ex ante (did we follow process?), Victims want ex post (I am hurt, fix it).
          *   *Individual vs. System:* Law likes finding a specific culprit; Sociotechnical systems distribute agency.
          *   *Compensation vs. Blame:* Paying the victim doesn't require moral fault, but "liability" often implies it.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *(a) Distributive Questions:* Need to separate "who caused it" from "who pays" from "who is blameworthy."
          *   *Req 1:* Distinction between Causal Contribution and Normative Attribution.
          *   *Req 2:* Distinction between Backward-Looking (Blame/Repair) and Forward-Looking (Incentive/Safety).
          *   *Corridor Application:* Engineers caused it (causal), but are they blameworthy? (Normative).
      *   *(b) Aggregation Questions:* The "Many Hands" problem.
          *   *Req 3:* The Non-Dissipation Principle. Responsibility cannot vanish just because it's shared.
          *   *Remainder:* Is there a "systemic remainder"? I need to take a stance. Let's argue the "remainder" is a category error; it's actually unallocated risk that needs an institutional sink (e.g., insurance fund), not a moral ghost.
      *   *(c) Epistemic Questions:* Foreseeability and Documentation.
          *   *Req 4:* The Documentation Discharge Limit. Documenting a risk doesn't automatically absolve liability if the risk materializes, but it shifts the *type* of liability (from negligence to strict/enterprise).
          *   *Corridor Application:* Clause 2 (gloss variable recorded).
      *   *(d) Normative-Uptake Questions:* Actionability.
          *   *Req 5:* Administrative Tractability. Can a court/tribunal actually apply this without needing a PhD in ML?
          *   *Req 6:* Ex Ante Guidance. Can engineers know *now* what keeps them safe *later*?
      *   *(e) Comparative Baseline:* The Human Comparator.
          *   *Req 7:* Baseline Explicitness. Must state if comparing to "Perfect Safety" or "Human Alternative."
          *   *Corridor Application:* Clause 5 (Human porter comparison).

  4.  **Refining the Tensions (Joint Satisfiability):**
      *   *Tension:* Ex Ante Guidance (Engineers need clear rules) vs. Ex Post Justice (Victims need compensation even if rules were followed).
      *   *Tension:* Non-Dissipation (Someone must pay) vs. Epistemic Limit (No one could know).
      *   *Decision:* The hardest tension is between *Fairness to Agents* (don't blame for unforeseeable) and *Protection of Victims* (someone must bear the loss). This usually breaks on Strict Liability vs. Negligence. I need to highlight that a theory cannot maximize both individual moral innocence and full victim compensation without an external mechanism (insurance).

  5.  **Selecting the Most Exclusionary Requirement:**
      *   Likely the "Non-Dissipation Principle" or the "Baseline Explicitness."
      *   Actually, the "Documentation Discharge Limit" is strong. Many engineering cultures think "If we wrote it down and signed off, we are safe." A liability regime that says "No, documentation is just evidence, not a shield" kills many current compliance frameworks.
      *   *Better candidate:* The distinction between Causal and Normative. Many theories conflate them. But the *Aggregation/Non-Dissipation* is often where theories fail (the "Responsibility Gap"). Let's go with the **Non-Dissipation Principle** because it forces a verdict where many want to say "it's complicated."

  6.  **Defining the Purpose (Purposive Caveat):**
      *   Purpose: *Allocation of Loss and Incentivizing Safety.* Not purely retributive blame.
      *   If purpose changes to pure Compensation, strict liability wins. If pure Blame, negligence wins. I need to declare the hybrid nature.

  7.  **Review against Constraints:**
      *   Did I use the Corridor Case facts? Yes (wax, partition, documentation, human comparator).
      *   Did I cover (a) through (e)? Yes.
      *   Is there a brainstorming section at the start? Yes.
      *   No citations? Yes.
      *   Tone: Philosophical but specification-oriented.

  8.  **Final Polish:** Check the "Joint Satisfiability" section. This needs to be the philosophical core. I will argue that *Ex Ante Guidance* and *Ex Post Victim Protection* are in tension under conditions of radical uncertainty (Clause 1 & 2). To satisfy both, you need an institutional buffer (insurance), which means the *theory of liability* alone isn't enough; it requires a *theory of funding*. This is a crucial insight for the working group.

      *Self-Correction on "Remainder":* In section (b), I need to be careful. If I say "no remainder," where does the loss go? I should argue the "remainder" is actually *socialized risk*, not moral responsibility. This clarifies the category error.

      *Self-Correction on Baseline:* Clause 5 is tricky. If the robot is safer *overall* but killed *this* person, do we punish? A theory must decide if it cares about *marginal* safety or *absolute* safety. I will make this a hard requirement.

      *Refining the Brainstorming:* Keep it tight. List the tensions clearly.

