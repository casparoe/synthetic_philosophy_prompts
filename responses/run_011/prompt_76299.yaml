answer: |-
  # Specification Document: Desiderata for Autonomous System Liability Regimes

  ## 1. Preliminary Brainstorming: Pressure Points and Hard Cases

  Before defining requirements, we must map the conceptual terrain. The Corridor Case is not an anomaly; it is a stress test revealing where standard liability intuitions fracture.

  **Hard Cases & Conceptual Pressure Points:**
  *   **The Compliance Paradox:** The engineers followed all reasonable protocols (Clause 2 & 3), yet harm occurred. Standard negligence theory struggles here: if the standard of care was met, is there liability? If yes, is it strict liability? If no, does the victim bear the cost of a systemic risk they did not create?
  *   **The Counterfactual Trap:** The human porter comparison (Clause 5) creates a dilemma. The robot failed *this* test (specific causation) but passes the *aggregate* test (statistical safety). Do we judge the instance or the population?
  *   **The Epistemic Wall:** Clause 1 states no human could foresee the specific conjunction. This attacks the foundation of *mens rea* or fault-based liability. If ignorance is non-culpable, can liability attach?
  *   **The Victim's Role:** Clause 4 introduces contributory negligence. A theory must weigh the victim's violation of signage against the robot's inability to adapt to the wax/partition.
  *   **The Documentation Shield:** Clause 2 suggests the risk was "accepted." Does internal risk acceptance bind external victims? (Engineers say yes; Public says no).

  **Opposing Pulls:**
  1.  **Ex Ante Certainty vs. Ex Post Equity:** Engineers need to know that following process protects them (Ex Ante). Victims need to know that harm is compensated regardless of process (Ex Post). These pull in opposite directions when "reasonable process" yields harm.
  2.  **Individual Culpability vs. Systemic Risk:** Law prefers pinpointing a guilty agent. Sociotechnical systems distribute agency so thinly that pinpointing often yields "no one."
  3.  **Moral Blame vs. Economic Loss:** We often conflate "who is to blame" with "who pays." The Corridor Case suggests these might need to be decoupled.

  **Initial Observation:** A theory that tries to maximize *moral fairness to engineers* (no blame without fault) and *complete protection for victims* (full compensation for all harm) simultaneously will collapse under the weight of Clause 1 (Unforeseeability). One must yield, or a third party (insurance/state) must absorb the tension.

  ---

  ## 2. Desiderata List

  The following requirements specify what a liability theory must deliver to be considered adequate for this working group.

  ### (a) The Distributive Questions

  **Requirement 1: The Causal-Normative Distinction**
  *   **The Requirement:** The theory must explicitly distinguish between *Causal Contribution* (the system was a necessary condition for the harm) and *Normative Attribution* (the agent is the appropriate target of blame or payment). A theory fails if it infers Normative Attribution solely from Causal Contribution without an intervening principle (e.g., fault, risk-creation, or benefit).
  *   **Motivating Case:** In the Corridor Case, the robot causally contributed to the injury. A theory that automatically assigns liability based on causation (Strict Causality) ignores Clause 2 (reasonable design) and Clause 4 (victim negligence). Conversely, a theory that requires moral fault for *any* payment ignores the victim's need for repair. Collapsing these leads to either over-punishing engineers for statistical inevitabilities or abandoning victims to bad luck.
  *   **Status:** **Non-negotiable.** Conflating "caused" with "culpable" is a category error that renders adjudication incoherent in complex systems.

  **Requirement 2: The Temporal Orientation Split**
  *   **The Requirement:** The theory must specify whether its primary function is *Backward-Looking* (assigning blame/repair for past harm) or *Forward-Looking* (incentivizing future safety design). It must state how it resolves conflicts when these orientations diverge.
  *   **Motivating Case:** If the goal is Forward-Looking, punishing the hospital for the Corridor Case might be useless if the risk was truly unforeseeable (Clause 1); no amount of fines will make the unforeseeable foreseeable. If the goal is Backward-Looking, the victim's injury demands a remedy regardless of incentivization. A theory that claims to do both without prioritization will issue contradictory verdicts.
  *   **Status:** **Non-negotiable.** Most failures in this literature stem from hiding a utilitarian (forward) goal inside a retributive (backward) vocabulary.

  **Requirement 3: Role vs. Outcome Accountability**
  *   **The Requirement:** The theory must distinguish between *Role-Based Obligations* (did the agent fulfill their specific professional duty?) and *Outcome-Based Accountability* (did the harm occur under their watch?).
  *   **Motivating Case:** The engineers in Clause 2 fulfilled their Role-Based Obligations (documented risk, followed standards). However, Outcome-Based Accountability suggests the deploying hospital bears the cost of the outcome. A theory that collapses these cannot explain why engineers aren't personally bankrupt while the institution still pays.
  *   **Status:** **Non-negotiable.** Essential for protecting individual employees within corporate liability structures.

  **Requirement 4: Culpability vs. Obligation to Repair**
  *   **The Requirement:** The theory must allow for an *Obligation to Repair* without *Culpability*. It must provide a mechanism for "no-fault" liability where appropriate.
  *   **Motivating Case:** In the Corridor Case, no human was culpable (Clause 1 & 2). If the theory requires culpability for repair, the victim receives nothing. If the theory allows repair without culpability, it acknowledges that risk-bearing is a cost of doing business, not necessarily a moral failing.
  *   **Status:** **Non-negotiable.** Essential for accommodating Clause 1 (Unforeseeability).

  ### (b) The Aggregation Questions

  **Requirement 5: The Non-Dissipation Principle**
  *   **The Requirement:** The theory must guarantee that total responsibility for a harm does not sum to zero simply because causal contributions are distributed across many agents. It must identify a specific "liability sink" (an agent or fund) even when individual contributions are negligible or non-culpable.
  *   **Motivating Case:** In the Corridor Case, responsibility is split: designers (training data), deployers (wax/partition decision), maintainers (signage), and the visitor (phone usage). A theory that says "everyone is slightly responsible" often results in "no one pays." There must be a remainder holder.
  *   **Status:** **Non-negotiable.** This addresses the "Problem of Many Hands." If a theory allows responsibility to dissipate into the structure, it is functionally useless.
  *   **Note on the "Remainder":** I take the idea of a *moral* remainder (a ghost responsibility floating in the system) to be confused. What people call a "remainder" is actually *unallocated economic risk*. The theory must assign this risk to an institutional entity (e.g., the deploying hospital), not a metaphysical entity.

  ### (c) The Epistemic Questions

  **Requirement 6: The Documentation Discharge Limit**
  *   **The Requirement:** The theory must define the legal/moral weight of internal risk documentation. Specifically: Does recording a risk and accepting it internally (Clause 2) discharge liability, transfer it to the user, or merely shift the regime from Negligence to Strict Liability?
  *   **Motivating Case:** Engineers often believe "If we wrote it down, we are safe." Victims believe "If you knew it was risky, you shouldn't have deployed it." A theory must rule on this. I propose: Documentation prevents *punitive* blame (negligence) but does not prevent *compensatory* liability (enterprise risk).
  *   **Status:** **Camp-Dependent.** This reflects a commitment to *Enterprise Liability*. A pure Negligence camp would argue documentation proves due care and ends liability. To drop this requirement, one must accept that victims bear the cost of known-but-accepted risks.

  **Requirement 7: The Division of Ignorance Clause**
  *   **The Requirement:** The theory must address ignorance produced by specialization. If Agent A knows X and Agent B knows Y, but no one knows X+Y (Clause 1), is the organization liable for the conjunction?
  *   **Motivating Case:** The wax (maintenance) + partition (renovation) + density (visitor flow) + training data (engineering). No single human knew the conjunction. The theory must treat the *organization* as the epistemic agent that "should have known" via integration mechanisms, or admit that some harms are truly *force majeure*.
  *   **Status:** **Non-negotiable.** Without this, organizations can insulate themselves by siloing knowledge.

  ### (d) The Normative-Uptake Questions

  **Requirement 8: Administrative Tractability**
  *   **The Requirement:** The theory must yield verdicts that can be reached without reconstructing the entire engineering lifecycle in a courtroom. It must rely on proxies (e.g., compliance certificates, insurance tiers) rather than perfect information.
  *   **Motivating Case:** Reconstructing the neural network weights for every corridor accident is impossible. If the theory requires proving exactly why the classifier output 0.91, it will never be used.
  *   **Status:** **Constraint on Usefulness.** A true theory of justice might require perfect information, but a *liability regime* is an institution. If it is too expensive to run, it fails.

  **Requirement 9: Ex Ante Guidance Clarity**
  *   **The Requirement:** The theory must allow an engineer to determine, *before deployment*, what actions minimize their liability exposure.
  *   **Motivating Case:** If liability depends on post-hoc judicial whims about "reasonable foreseeability," engineers cannot design safely. They need to know: Does better testing reduce liability? Does insurance?
  *   **Status:** **Constraint on Usefulness.** Essential for the preventive function of law.

  ### (e) The Comparative Baseline

  **Requirement 10: Baseline Explicitness**
  *   **The Requirement:** The theory must explicitly state its counterfactual baseline for determining harm. Is it (A) *Absolute Safety* (harm should not have happened), (B) *Human Replacement* (harm is acceptable if less than human baseline), or (C) *Status Quo Ante* (harm is acceptable if no worse than prior method)?
  *   **Motivating Case:** Clause 5 is decisive here. The robot caused *this* accident, but humans cause *more* overall.
      *   If Baseline A: The robot is liable.
      *   If Baseline B: The robot is exonerated (statistically superior).
      *   If Baseline C: Depends on what was there before (maybe nothing?).
      *   A theory that cannot choose creates arbitrary verdicts. I argue for a hybrid: Baseline B for *regulatory permission*, Baseline A for *victim compensation*.
  *   **Status:** **Non-negotiable.** A theory that leaves this implicit is incomplete.

  **Omitted Requirement:**
  This list omits **Criminal Liability**. It focuses on civil liability (compensation and allocation). Criminal liability for AI systems (or their creators) introduces *mens rea* standards that may be incompatible with the "Non-Dissipation" requirement in cases of genuine accident. This is a deliberate exclusion to keep the regime workable.

  ---

  ## 3. Joint Satisfiability

  **The Tension: Ex Ante Guidance (Req 9) vs. Comprehensive Compensation (Req 4 & 5)**

  I argue that **Requirement 9 (Ex Ante Guidance)** and **Requirement 5 (Non-Dissipation/Full Compensation)** cannot be simultaneously satisfied under conditions of *Radical Uncertainty* (Clause 1 of the Corridor Case).

  **The Argument:**
  1.  **Ex Ante Guidance** relies on the principle that liability follows *avoidable* fault. To guide engineers, I must tell them: "If you do X, you are safe." This implies that if harm occurs despite X, liability should not attach (or should be minimal).
  2.  **Non-Dissipation/Compensation** demands that if harm occurs, a "liability sink" must pay, regardless of fault (to prevent the victim from bearing the loss of a systemic risk).
  3.  **The Conflict:** In the Corridor Case, the engineers did X (reasonable design, documentation).
      *   To satisfy **Ex Ante Guidance**, we must tell them they are not liable (or fully indemnified).
      *   To satisfy **Non-Dissipation**, someone must pay the victim.
      *   If the engineers/hospital pay, **Ex Ante Guidance** is weakened (they followed rules but still pay).
      *   If they don't pay, **Non-Dissipation** fails (victim bears the loss).

  **The Sacrifice:**
  To hold both, a theory must introduce a **Third-Party Buffer** (e.g., mandatory no-fault insurance or a state compensation fund).
  *   If the theory insists on *direct* liability between tortfeasor and victim, it must sacrifice one requirement.
  *   *Option A (Sacrifice Guidance):* Adopt Strict Liability. Engineers pay even when reasonable. *Cost:* Innovation may slow; engineers feel treated unfairly.
  *   *Option B (Sacrifice Compensation):* Adopt Negligence. Engineers pay only when unreasonable. *Cost:* Victims in "Corridor Cases" get nothing.

  **Verdict:** A serious theory must admit that *Liability* (the verdict) and *Funding* (the payment) are separable. The tension is only irresolvable if we insist the paying agent must also be the blameworthy agent.

  ---

  ## 4. Most Exclusionary Requirement

  **Requirement 5: The Non-Dissipation Principle.**

  **Mechanism of Exclusion:**
  This requirement eliminates the largest class of philosophically sophisticated but practically inert theories, specifically those that posit a **"Responsibility Gap."**
  Many ethicists argue that in complex autonomous systems, responsibility "vanishes" because no single human meets the conditions for moral agency (control + knowledge). They conclude that the situation is morally tragic but legally unresolvable.
  Requirement 5 forbids this conclusion. It demands a verdict. It forces the theory to designate a "liability sink" (usually the deploying organization or an insurance pool) even when moral culpability is absent.
  *   **Theories eliminated:** Pure Moral Agency theories (if no human agent, no liability), Radical Distributed Cognition theories (if everyone is responsible, no one is), and certain strands of Legal Nihilism regarding AI.
  *   **Why it works:** It prioritizes the *social function* of liability (loss spreading) over the *moral purity* of liability (retribution). This is uncomfortable for deontologists who believe payment implies blame.

  ---

  ## 5. Purposive Caveat

  **Declared Purpose:**
  This specification is designed for a **Civil Liability Regime aimed at Loss Allocation and Safety Incentivization.**
  It is *not* designed for:
  1.  **Retributive Justice:** It does not seek to punish moral wickedness.
  2.  **Pure Compensation:** It does not seek to compensate every injury regardless of cost (which would ban the technology).
  3.  **Criminal Adjudication:** It does not seek to imprison engineers.

  **Impact of Purpose Shift:**
  *   **If the purpose were solely Victim Compensation:** Requirement 9 (Ex Ante Guidance) would be demoted. We would move toward a pure Strict Liability or No-Fault Insurance model. Engineers' fairness would be irrelevant; the focus would be solely on the victim's restoration. Requirement 5 (Non-Dissipation) would become absolute.
  *   **If the purpose were solely Governance/Design:** Requirement 4 (Culpability vs. Repair) would be demoted. We would focus entirely on Forward-Looking incentives (Requirement 2). Past harm would only matter as data to tune regulations. The "liability sink" might be the state, not the deployer, to avoid chilling innovation.
  *   **If the purpose were Criminal Blame:** Requirement 1 (Causal-Normative Distinction) would become the primary constraint. We could not separate payment from blame. This would likely render the regime inapplicable to the Corridor Case entirely (as no one is blameworthy), leaving the victim uncompensated.

  **Final Note to the Working Group:**
  This specification assumes that the primary social goal is to allow beneficial technology to deploy while ensuring that the *costs* of its inevitable failures do not fall disproportionately on random victims. If your camp prioritizes *stopping* deployment until perfection is reached, or *punishing* engineers to set an example, you will find this specification hostile. That is a feature, not a bug: it forces you to declare that divergence explicitly.
