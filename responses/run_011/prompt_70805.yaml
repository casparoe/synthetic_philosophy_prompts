      *   **Homunculus Problem:** Explaining behavior by positing a "little man" inside who decides, which just pushes the explanation back a step (who decides inside the little man?).
      *   **Descartes Strawman:** Dennett admits "Cartesian Theater" is a rhetorical device. Descartes didn't literally draw a theater, but his dualism implies a point of interaction (pineal gland) where mind meets matter, which functions *like* a theater.

