answer: |-
  # SEMINAR HANDOUT: DESERT AND THE BASIC ARGUMENT

  **The Basic Argument (BA):** (1) Nothing is *causa sui* (cause of itself). (2) To be truly morally responsible for an act, one must be responsible for the mental causes (character/motives) of that act. (3) This requires an infinite regress of self-creation. (4) Therefore, no one is truly morally responsible. *Note: The BA applies regardless of whether determinism is true.*

  ## 1. THE LOGICAL SPACE

  Five binary questions define the terrain. Combinations generate 32 theoretical cells; most are empty.

  1.  **Character Authorship:** Does responsibility for an act require responsibility for the character from which it issues? (BA: Yes / Compatibilism: No)
  2.  **Regress Stoppable:** Can a deliberate act of self-formation stop the regress? (BA: No / Libertarianism: Yes)
  3.  **Indeterminacy Relevant:** Does objective openness at the moment of choice add to responsibility? (BA: No / Libertarianism: Yes)
  4.  **Determinism Relevant:** Does the truth of determinism change the verdict on responsibility? (BA: No / Traditional Incompatibilism: Yes)
  5.  **Desert Status:** Should desert be retained (Intact), revised (Functional), or discarded (Fiction)?

  **Occupied Cells:** Most serious positions cluster in two zones. Zone A denies Character Authorship (Compatibilism). Zone B accepts Character Authorship but denies it is possible (BA supporters).
  **Empty Cells:**
  *   *Incoherent:* "Indeterminacy Relevant" + "Determinism True." (Contradictory definitions).
  *   *Unattractive:* "Character Authorship Required" + "Regress Stoppable" + "Determinism True." (Requires magic within a closed system).
  *   *Unexplored:* "Character Authorship Required" + "Regress Unstoppable" + "Desert Intact." To occupy this, one must believe offenders deserve suffering *even though* they could not be otherwise, without revising the concept of desert to forward-looking aims. This requires a retributivism detached from agency entirely—a view rarely defended explicitly, perhaps because it collapses into vengeance without justification.

  ## 2. THE DECISION TREE

  *Instructions: Answer each node based on your verdict on the case. Do not consult your theoretical labels.*

  **Node 1: The Curator**
  Dana's silence issues from dispositions installed by others, though she now endorses them. Is her silence **blameworthy**?
  *   (A) Yes, she is to blame. → Go to Node 2.
  *   (B) No, she is not to blame. → Go to Node 5.

  **Node 2: The Loop**
  Eitan chose a treatment to change his character because he was already the kind of person who wanted to change. Was this choice **self-authorship**?
  *   (A) Yes, it counts as authoring himself. → Go to Node 3.
  *   (B) No, it merely moves the regress back. → Go to Node 4.

  **Node 3: The Curator (Follow-up)**
  If Dana is blameworthy, is it because she **deserves** suffering, or because blaming her is **useful**?
  *   (A) She deserves it. → **Leaf 1**
  *   (B) It is useful. → **Leaf 2**

  **Node 4: Attributability**
  If Eitan's choice is not self-authorship, can we still say the act is **his** (attributable) even if he isn't **accountable**?
  *   (A) Yes, attribution survives without accountability. → **Leaf 3**
  *   (B) No, if accountability fails, attribution is hollow. → **Leaf 4**

  **Node 5: The Twin Worlds (Decision)**
  Wren-1 (indeterministic decision) and Wren-2 (deterministic decision) both betray. Does Wren-1 bear **more responsibility**?
  *   (A) Yes, openness matters. → Go to Node 6.
  *   (B) No, openness is just luck. → Go to Node 7.

  **Node 6: The Twin Worlds (Character)**
  Relocate the indeterminacy: Wren-1's *earlier character-formation* was open; Wren-2's was determined. Does Wren-1 now bear **more responsibility**?
  *   (A) Yes, self-formation must be open. → **Leaf 5**
  *   (B) No, even open self-formation is luck. → **Leaf 6**

  **Node 7: The Bench (Practice)**
  The judge accepts no one is ultimately responsible. Should sentencing **practices continue**?
  *   (A) Yes, keep the system. → Go to Node 8.
  *   (B) No, dismantle the system. → **Leaf 7**
  *   (C) Nothing needs changing; the problem is philosophical. → **Leaf 8**

  **Node 8: The Bench (Theory)**
  If practices continue, should the public claim that offenders **get what they deserve** be maintained?
  *   (A) Yes, keep the claim. → **Leaf 9**
  *   (B) No, drop the claim. → Go to Node 9.

  **Node 9: The Bench (Attitudes)**
  If the claim is dropped, can we keep our **reactive attitudes** (resentment/gratitude)?
  *   (A) Yes, we cannot abandon them. → **Leaf 10**
  *   (B) No, they must be extinguished. → **Leaf 11**

  *(Case Amendments: **Twin Worlds** was split into Node 5 and Node 6 to distinguish event-causal from agent-causal/hard incompatibilist views on *where* indeterminacy matters. **The Bench** was split into Nodes 7, 8, and 9 to separate Eliminativism, Illusionism, Revisionism, and Quietism.)*

  ## 3. THE LEAVES

  1.  **(Reasons-Responsiveness Compatibilism)** *Weakness:* Must explain why installed dispositions don't negate control if causal history doesn't matter. *Sentencing:* Desert intact.
  2.  **(Revisionism)** *Weakness:* Must justify keeping "desert" language while stripping it of ultimate responsibility. *Sentencing:* Desert retained as social technology.
  3.  **(Real-Self / Reflective Endorsement)** *Weakness:* Cannot explain why the Curator's endorsement (installed by others) counts as authentic. *Sentencing:* Desert intact.
  4.  **(Attributability View)** *Weakness:* Must defend a notion of "ownership" that carries no blame or sanction. *Sentencing:* Desert gone (replaced by safety measures).
  5.  **(Event-Causal Libertarianism)** *Weakness:* Must explain how an uncaused will is not merely random luck. *Sentencing:* Desert intact.
  6.  **(Agent-Causal Libertarianism)** *Weakness:* Requires a metaphysical agent distinct from physical events. *Sentencing:* Desert intact.
  7.  **(Eliminativism)** *Weakness:* Requires dismantling institutions that may be socially necessary. *Sentencing:* Desert gone.
  8.  **(Deflationary Quietism)** *Weakness:* Risks dismissing genuine normative conflict as mere verbal dispute. *Sentencing:* Desert intact (as practice needs no metaphysics).
  9.  **(Illusionism)** *Weakness:* Requires endorsing a public falsehood about responsibility. *Sentencing:* Desert retained as admitted fiction.
  10. **(Strawsonian Pessimism)** *Weakness:* Claims we *cannot* abandon reactive attitudes despite knowing they are unjustified. *Sentencing:* Desert intact (practically), impossible (theoretically).
  11. **(Hard Incompatibilism / Hard Determinism)** *Weakness:* Must explain how to live without reactive attitudes or justify replacing them. *Sentencing:* Desert gone.

  ## 4. WHAT THE TREE CANNOT DO

  **Indistinguishable Pairs:**
  *   **Hard Incompatibilism (Leaf 11) vs. Strawsonian Pessimism (Leaf 10):** Both agree responsibility is impossible. They differ only on whether human psychology *permits* us to drop reactive attitudes. The *Bench* case asks what *should* happen, not what is psychologically possible. *Further Question:* "If you knew you could successfully extinguish your resentment without social cost, would you?"
  *   **Illusionism (Leaf 9) vs. Eliminativism (Leaf 7):** Both deny the metaphysics. They differ on policy (lie vs. dismantle). A participant might agree on the metaphysics but split on the policy based on empirical guesses about social order, not philosophical commitment. *Further Question:* "Is the public claim of desert a necessary lie or a contingent error?"

  **Consistency Check:**
  *   **Impossible Pattern:** Answering **(B) No** at Node 1 (Curator not blameworthy) but **(A) Yes** at Node 2 (Loop is self-authorship).
  *   **Diagnosis:** You deny that installed character negates blame in the Curator, but insist that installed character *does* negate authorship in the Loop. You are treating "character" as irrelevant to blame but essential to authorship. You must decide: does the history of the motive matter or not?

  ***

  **Confidence Statement:** I am moderately confident (approx. 75%) that this node set is jointly exhaustive of the *live* positions, but less confident in their independence. The placement of **Strawsonian Pessimism** is the least secure branch; it relies on Node 9 (Attitudes) to separate it from Hard Incompatibilism, but Strawson's view is often that the *practice* survives because the *attitudes* are inescapable, whereas Hard Incompatibilists argue attitudes *should* be dropped. I considered merging Leaves 10 and 11, but separated them because the seminar's focus on *punishment* turns on whether we can practically sustain retributive emotions without metaphysical backing. I set aside a separate "Theological Determinism" branch as outside the scope of the Basic Argument's secular formulation.
