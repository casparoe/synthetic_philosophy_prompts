          2.  **The "Instrumentalism with Ontology" Charge:** If the criterion is "what we need to calculate," isn't that just saying "what tools are useful"? Adding "and therefore they exist" looks like a semantic sticker on instrumentalism. If the physics changes (discrete spacetime), the ontology vanishes. This makes mathematical existence contingent on human computational limits and current physical models.
