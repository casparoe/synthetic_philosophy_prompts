  *(Self-Correction on the "Concrete Case"):* Is there a feasible nominalistic derivation of a continuum-based prediction? Actually, the user asks for a case where *both* exist. Reverse Mathematics is the closest field. But in physics? Maybe computational fluid dynamics on a grid vs. PDEs. But the grid *approximates* the PDE. The user wants *exact* predictions. This is hard. I should point out that the lack of such a case is a strength, but the *possibility* of one (via future tech) is the threat.
