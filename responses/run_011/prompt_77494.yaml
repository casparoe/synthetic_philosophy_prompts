answer: |-
  **The Limits of Legitimacy Transfer: A Case Study of the Irish Mini-Publics (2012–2024)**

  The Irish experiment with deliberative mini-publics between 2012 and 2024 offers a rare longitudinal dataset for democratic theory. It presents a controlled sequence: a Constitutional Convention (2012–14), a Citizens' Assembly (2016–18) resulting in the repeal of the Eighth Amendment, and a Citizens' Assembly on Gender Equality (2019–21) culminating in the defeated referendums of March 2024. For the theorist of sortition, this arc is not merely a history of policy outcomes but a stress test for the mechanisms by which random selection is supposed to improve democratic decision-making. The divergence between the 2018 success and the 2024 failure forces a reckoning with what sortition actually achieves when embedded within a representative system. This essay argues that the Irish case demonstrates that mini-publics function not as independent generators of legitimacy, but as contingent supplements whose efficacy depends on external political variables—salience, campaign dynamics, and question formulation—that standard sortition theory treats as exogenous. Furthermore, the integrity of the selection process itself proved less critical to public acceptance than the theory predicts, suggesting that the perceived value of sortition lies in its independence from career politics rather than its statistical descriptiveness.

  **Mapping the Machinery of Agency**

  To evaluate the theory, one must first map the distribution of agency. Sortition theory often speaks of "the assembly" as a unitary actor, but the Irish model reveals a fragmented chain of custody where responsibility is dispersed. The relevant actors are: the Legislature (Oireachtas), which sets the remit and decides whether to act on recommendations; the Secretariat and Polling Firms, which manage logistics and recruitment; the Chair and Experts, who structure the information environment; the Members (the ninety-nine), who deliberate and vote; the Government, which drafts the referendum legislation; and finally, the Electorate, which holds the veto power.

  Crucially, the Citizens' Assemblies were advisory bodies, not decision-making chambers. This distinction is vital for mapping power. The Assembly could recommend, but it could not legislate. In 2018, the Assembly recommended repeal of the Eighth Amendment and proposed a legislative framework. However, the specific wording of the referendum question and the subsequent legislation were determined by a Parliamentary Committee and the Government. In 2024, the Assembly recommended constitutional amendments regarding the family and care. Again, the Government drafted the specific text. This means the Assembly's votes are evidence of *deliberative preference formation* within a specific information environment, but they are not evidence of *final decision-making capacity*.

  The mapping reveals a "legitimacy transfer" bottleneck. The theory of sortition posits that the legitimacy generated inside the room—through descriptive representation and informed deliberation—should transfer to the outside world. However, the Irish structure interposes two filters between the Assembly's vote and the final outcome: the Parliament (which can dilute or alter recommendations) and the Electorate (which votes in a mass campaign environment). In 2018, the Parliament largely accepted the recommendation, and the Electorate ratified it. In 2024, the Parliament accepted the recommendation, but the Electorate rejected it. This mapping clarifies where the theory is being tested. If the failure occurred in the Assembly's deliberation, sortition theory is falsified. If the failure occurred in the campaign or the question wording, sortition theory may be insulated, provided one does not claim that mini-publics solve the problems of mass electoral politics.

  **The Mechanisms of Success: 2018**

  In the 2016–18 Citizens' Assembly, three theoretical mechanisms of sortition appear to have done work: descriptive representation, freedom from electoral incentive, and preference transformation through deliberation.

  First, descriptive representation. The ninety-nine members were selected to match the electorate by age, region, and gender. In the context of abortion, a issue deeply tied to bodily autonomy and social values, the fact that the deliberating body mirrored the population was rhetorically powerful. It countered the accusation that the issue was being decided by a metropolitan elite. However, the mapping shows this was only effective because the Parliament did not obstruct the transfer. The Assembly's recommendation was taken up by a Parliamentary Committee that mirrored its cross-party composition.

  Second, freedom from electoral incentive. Politicians in the Oireachtas had long avoided the abortion question due to its potential to fracture parties and alienate voters. The Assembly provided "political cover." Because the members were not seeking re-election, they could vote according to their deliberative conclusions rather than party whip or constituency pressure. This aligns with the sortition claim that random selection removes the career structure that distorts representation. The evidence here is the gap between the Assembly's permissive recommendation and the prior caution of the political class. The Assembly broke the deadlock.

  Third, better-formed preferences. The Assembly sat over multiple weekends, heard experts, and deliberated in small groups. The shift from a restrictive constitutional ban to a permissive legislative framework suggests that exposure to information and testimony altered preferences. This supports the deliberative democratic claim that raw public opinion is malleable and can be improved under conditions of good information.

  However, even in success, the limits were visible. The Assembly did not operate in a vacuum. The "Yes" campaign (Together for Yes) was already well-organised. The social demand for change existed; the Assembly did not manufacture it, but rather processed a demand that a social movement was already making. The sortition mechanism worked because it aligned with an existing societal shift. It acted as a catalyst, not an engine.

  **The Mechanisms of Failure: 2024**

  The 2024 referendums on the Family and Care amendments present a stark contrast. The sortition mechanisms were identical: random selection, expert testimony, deliberation, and a recommendation for constitutional change. Yet, the outcome was the largest No vote in Irish referendum history. To analyse this as a test of sortition, we must isolate which mechanisms failed.

  Descriptive representation remained intact in design, yet it failed to persuade the electorate. This suggests that descriptiveness alone does not confer legitimacy if the *output* is contested. In 2018, the output (repeal) aligned with a growing consensus. In 2024, the output (new constitutional language) appeared to outpace public sentiment. This points to a theoretical blind spot regarding *salience*. Sortition theory assumes that if a body is representative and informed, its conclusions will be accepted. It does not account for the intensity of preference outside the room. On abortion, the intensity was high and directional. On the definition of the family, the intensity was low, and the direction was ambiguous. The Assembly may have formed "better" preferences in the deliberative sense, but preferences that are unconnected to the lived urgency of the electorate are politically fragile.

  Freedom from electoral incentive also functioned differently. In 2018, this freedom allowed members to defy conservative norms. In 2024, it allowed members to propose language that politicians might have deemed too risky. Here, the lack of electoral accountability became a liability. The No campaign successfully framed the amendments as the product of a "committee" rather than the people. The institutional pedigree of the Citizens' Assembly, intended to signal legitimacy, was inverted to signal elitism. This is the "reverse transfer" problem: a recommendation arriving with an institutional pedigree hands a campaign a target. Opponents could argue that the proposals were manufactured by a state-appointed group rather than emerging organically from the populace.

  This highlights the distinction between processing a demand and manufacturing a proposal. In 2018, the Assembly processed a demand. In 2024, the Assembly manufactured a proposal. Sortition theory is remarkably quiet on this distinction. It assumes that deliberation yields legitimate outcomes regardless of the origin of the agenda. The Irish case suggests that mini-publics are effective at resolving *conflicts* where public opinion is already shifting (abortion), but ineffective at *leading* public opinion on abstract constitutional principles (family/care) where no mass movement exists. The theory of sortition often conflates the legitimacy of the *process* with the acceptability of the *product*. The 2024 result suggests they are distinct.

  **The Supplement vs. Lottocracy and the Transfer Problem**

  My tutor's distinction between sortition as a supplement and lottocracy proper is critical here. Both Irish bodies were supplements; the radical proposal of a lot-selected chamber holding real power was never on the table. Does the 2024 failure invalidate the radical proposal, or only the mild one?

  If one argues for lottocracy—a chamber with binding legislative power—the 2024 result is arguably irrelevant, because the electorate would not have had a veto. If a sortition chamber had passed the amendments, they would have become law. However, this raises a normative problem. If the 67.7 per cent of voters who rejected the Family amendment are excluded from the decision, the system loses democratic consent. The Irish case shows that when a mini-public is a supplement, its legitimacy is borrowed from the ratification mechanism. When ratification fails, the mini-public's work is voided.

  This brings us to the "transfer problem": is the informed judgement generated in the assembly portable outside the room? Proponents of sortition might argue that the 2024 failure is evidence of a failure in the *ratification* stage, not the *deliberation* stage. They might claim the No campaign misled voters, or the question wording was poor (a valid criticism, as the "Care" amendment was widely misunderstood). If this argument is accepted, sortition theory is insulated from the failure. The theory claims the Assembly produces high-quality recommendations; it does not claim the electorate will always understand them.

  However, treating the transfer problem as a theoretical resource risks becoming an ad hoc rescue. If the theory absorbs any failure by relocating it to a stage the theory does not govern (the campaign, the wording, the voter competence), it becomes unfalsifiable. A theory of democratic innovation must account for the interface between the innovation and the existing system. If a mini-public cannot persuade the public or the parliament, its "high quality" deliberation is politically inert. The 2024 result is evidence against the *milder* proposal (the supplement model) because it shows that the supplement cannot guarantee its own uptake. It suggests that mini-publics are not legitimacy generators in a vacuum; they are legitimacy amplifiers. They amplify existing consensus but cannot create it ex nihilo.

  Furthermore, the 2024 result challenges the Manin argument regarding filtering. Manin suggests election was adopted because it filters for competence and ambition. In 2024, the "filtered" politicians (the Government) drafted the questions based on the Assembly's advice, and the "filtered" electorate rejected them. The sortition body did not provide a superior filter. In fact, the lack of electoral accountability meant the members were insulated from the practical political realities that would have warned them the language was vulnerable. A lottocracy with binding power would have faced the same implementation crisis. Thus, the 2024 failure is evidence against the capacity of sortition to solve the problem of *alignment* between the governing and the governed, regardless of whether the body is advisory or binding.

  **Selection Failures and the Primacy of Output**

  A specific detail from the records demands theoretical attention: the selection was not clean. Of the original ninety-nine members of the 2016 assembly, seventeen withdrew before the first session, and further attrition occurred later. More damagingly, seven replacements in 2018 were recruited through acquaintances of a polling firm employee rather than at random. In a theory where descriptive representation is the load-bearing claim, this should be catastrophic. If the statistical mirror is cracked, the claim to represent the "will of the people" is compromised.

  Yet, almost nobody objected. The scandal did not derail the process, and the 2018 referendum proceeded on the strength of the Assembly's recommendation. This implies that the Assembly's standing rested on its *output* rather than on how it was constituted. The public and the politicians cared that the body was *independent* of the government, not that it was statistically perfect. This challenges the theoretical emphasis on descriptive representation as the primary source of legitimacy. It suggests that the perceived value of sortition is negative: it is valued for what it is *not* (not elected, not partisan, not careerist) rather than what it *is* (a microcosm).

  If the composition drifted and the randomisation broke down without consequence, it indicates that the "descriptive" claim is largely rhetorical. The real mechanism at work is the *epistemic* claim: that a group of ordinary people, given time and information, will make sensible decisions. The 2018 success validated the epistemic claim; the 2024 failure challenged it. However, the lack of outrage over the selection breach suggests that for the supplement model to work, the perception of independence is more important than the mathematical reality of randomisation. This is a uncomfortable finding for purists who argue that the lottery is the moral core of the system. The Irish case suggests the lottery is merely a heuristic for independence.

  **Conclusion: What the Proponent Must Concede**

  What, then, ought a proponent of lottocracy make of Ireland? To avoid special pleading, they must concede that the Irish arc demonstrates the contingency of the supplement model. The 2018 and 2024 results cannot count as evidence about the same theory unless we control for the political context, which is impossible. 2018 tested sortition's ability to resolve a high-salience moral deadlock where society was already moving. 2024 tested sortition's ability to propose abstract constitutional changes in a low-salience environment where society was complacent or confused.

  For these to be comparable tests of sortition *per se*, one would have to assume that the internal deliberative quality was the only variable. But the mapping shows the variables were external: the strength of the civil society campaign, the clarity of the question, and the government's willingness to campaign. A proponent must admit that mini-publics are not a panacea for democratic fatigue. They do not solve the problem of ratification. They do not solve the problem of question wording. They do not solve the problem of voter apathy.

  Therefore, the Irish case supports a modest conclusion: sortition is a useful tool for agenda-setting and breaking parliamentary logjams on specific, high-salience moral issues where politicians are risk-averse. It is not a tool for constitutional engineering in the absence of public demand. The 2024 failure is not evidence that deliberation failed inside the room; it is evidence that legitimacy does not travel. The "transfer problem" is not an ad hoc rescue; it is the central weakness of the supplement model. If the mini-public cannot persuade the electorate, its deliberative quality is politically irrelevant.

  For the radical proponent of lottocracy, the lesson is starker. If an advisory body with the prestige of the Citizens' Assembly cannot carry a referendum, a binding sortition chamber would face a crisis of compliance. The 2024 result shows that the electorate reserves the right to veto "informed" decisions that do not resonate with their intuitions. A lottocracy that ignores this veto is aristocratic in the Montesquiean sense—not because of how members are selected, but because it disconnects power from accountability. The Irish experiment ultimately confirms that while random selection can filter out careerism, it cannot filter out the need for political persuasion. The map of agency shows that the power remains with the electorate, and no amount of deliberative pedigree can substitute for the messy, unfiltered work of winning a campaign. Sortition buys you independence and perhaps better information processing, but it does not buy you consent. That must still be earned in the wild.
