      *   *Intro:* Start directly with the Irish case. No Athens. Frame the 2018-2024 arc as a natural experiment. Thesis: The Irish case demonstrates that sortition's efficacy as a *supplement* is contingent on external political conditions (salience, campaign dynamics) that the theory of deliberative democracy often treats as exogenous.
