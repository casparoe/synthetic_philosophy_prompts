answer: |-
  The existing arrangement presupposes a specific metaphysics of the record: that a document is an emanation of authority rather than a trace of encounter. For provenance-based description to make sense as the *primary* rule, it must be true that the only speech act that matters is the one that enacts power. The office speaks *to* the world; the world speaks *at* the office. In this view, the record is credible precisely because it is a monologue by the state (or the corporation, or the church). Its authority derives from its institutional isolation. If the petitioner's voice were treated as co-constitutive, the record would become a dialogue, and the "unselfconscious" nature of the document would be compromised by the recognition that it was elicited, contested, or demanded.

  Therefore, the standard account rules out the rival theory that records are *transactions*. It rules out the idea that a file is a site of meeting between two wills. Practitioners rarely state this aloud as a political choice; instead, they frame it as a matter of custody. "We hold the papers the court generated, not the papers the accused wrote." But this custody rule masks an epistemological one: it asserts that the *legal* reality of the transaction (the court's judgment) supersedes the *human* reality (the accused's plea). The standard account is coherent only if one accepts that the "business" transacted is the business of the institution, not the business of the human lives caught in its gears. It claims neutrality, but the by-product doctrine is not neutral. It encodes an answer to the question of whose purposes constitute a record: only the purposes of the entity that keeps the registry. The enslaved person's presence on an inventory is a record of the owner's property, not the enslaved person's life, because the archive defines "life" as that which is administratively managed, not that which is experienced.

  If the proposal is taken seriously—that the documented party is a co-creator—the architectural integrity of the archive must shift from custodial history to functional genesis.

  **Original Order and Provenance**
  Arranging by documented person is technically a violation of *original order* as strictly defined (the order imposed by the creator in custody). However, it is not a violation of *provenance* if provenance is redefined as the source of the *content* rather than the source of the *paper*. If the file is a joint trace, there were two provenances from the beginning: the institutional power that filed it and the human presence that necessitated it. The current system privileges the provenance of custody; the proposal privileges the provenance of causality. To adopt this is to acknowledge that the "order" imposed by the office was often an order of suppression or categorization that obscured the individual. Rearranging by person does not destroy the context; it reveals the context of the *transaction* rather than the context of the *registry*.

  **Appraisal and Rights**
  This is the most volatile implication. If the documented are co-creators, they (or their descendants) may acquire moral or legal rights over the record. Currently, appraisal justifies destruction based on the record's value to understanding the *office*. If the record is also the trace of a *person*, destruction becomes an erasure of existence. Conversely, co-creator status might grant a "right to be forgotten" (as seen in GDPR conflicts with archives). A co-creator might claim the right to have a file redacted or destroyed to protect dignity, conflicting with the archival mandate of permanent preservation. The profession would have to move from being guardians of *evidence* to mediators of *memory*, weighing the researcher's need to know against the subject's right to privacy or oblivion.

  **Citation and Authority**
  Citation conventions reinforce the power dynamic. Citing "Ministry of Colonial Affairs, File 402" centers the state. Citing "Estate of John Doe, File 402" centers the subject. If a document has two creators, citation must become relational. It forces the historian to acknowledge the asymmetry of the record: "Created by the Court, regarding the Accused." This breaks the illusion of the document as an objective window and restores it as a product of specific friction.

  **Underdetermination: Constraint vs. Theory**
  Much of the resistance to this change is underdetermined by theory and overdetermined by constraint.
  1.  **Volume and Cost:** It is cheaper to index by office (one name per series) than by person (thousands of names per series). This is an administrative constraint, not a theoretical necessity.
  2.  **Database Structures:** Many archival management systems allow only one "creator" field. This is a software limitation, not an archival law.
  3.  **Tractability:** Retrieval is easier when the hierarchy is fixed. But this prioritizes the convenience of the institution over the needs of the researcher seeking people.

  A repository could adopt the view of records as joint traces while retaining significant parts of the current practice. It could retain *respect des fonds* (keeping records of different offices separate) to preserve the institutional context of the power dynamic. It could retain the physical *original order* for preservation purposes while creating a *virtual order* by person for access. It could retain the description of the office's function, but append a mandatory "subject/counter-party" field that is treated as metadata of equal weight, not an optional index.

  Ultimately, the proposal breaks the fiction that the archive is a mirror of the state's administration. It proposes instead that the archive is a graveyard of encounters, where the dust of the powerful and the powerless is mixed in the same box. To treat the documented as co-creators is to admit that the record is not trustworthy because it is unselfconscious, but because it captures the point where two consciousnesses collided, however unequally. It requires the profession to stop pretending that the purpose of the record was ever singular.
