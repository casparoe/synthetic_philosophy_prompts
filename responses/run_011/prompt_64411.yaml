answer: |-
  ### Community-Collections Triage Protocol (Microhistorical Edition)

  **Purpose:** To assess offers of material against the museum's 'History from Below' aim using microhistorical methodology, within a 40-minute window, by two curators and one volunteer.

  **Pre-Condition:** All assessors must have skimmed the material (or a representative sample) and reviewed the donor intake form.

  #### Part 1: The Escalation Triggers (5 Minutes)
  *These questions determine if the team is authorised to decide.*

  **Q1. Is the donor living, or is there a reasonable expectation they might be?**
  *   **Sufficient Answer:** Yes/No based on intake form or date of material (post-1990 suggests living contacts).
  *   **Action:** If **Yes**, stop. Escalate to Manager. (Ethical/Legal constraint).

  **Q2. Does the offer include explicit conditions regarding display, access, or interpretation?**
  *   **Sufficient Answer:** Yes/No based on correspondence or donor statement.
  *   **Action:** If **Yes**, stop. Escalate to Manager. (Values constraint).

  *If both answers are 'No', proceed to Part 2.*

  #### Part 2: The Microhistorical Test (25 Minutes)
  *These questions determine Accession suitability. They convert methodological commitments into observable features.*

  **Q3. Is the voice institutional or individual?**
  *   **Methodological Commitment:** Microhistory prioritises individual agency navigating constraints over institutional record-keeping.
  *   **Sufficient Answer:**
      *   *Individual:* Diaries, letters, personal notebooks, photographs with annotations.
      *   *Institutional:* Minute books, ledgers, official reports, typed circulars.
  *   **Procedure:** If **Institutional**, the default is **No Accession** unless Q4 is strongly positive. If **Individual**, proceed to Q4.
  *   **Research Burden:** None. Visible from document type.

  **Q4. Does the material reveal the 'rules' of the system through the way they were broken, bent, or endured?**
  *   **Methodological Commitment:** Traces of ordinary lives are often generated by authorities regulating them; choices are intelligible against constraints.
  *   **Sufficient Answer:** Can the assessors identify a specific constraint (e.g., rationing, shift patterns, wage deduction, policing) referenced in the text?
  *   **Procedure:** If **Yes**, mark for **Accession**. If **No** (the material is purely descriptive or celebratory), mark for **Refusal**.
  *   **Research Burden:** Low. Requires reading a few pages for keywords (e.g., 'foreman', 'fine', 'shortage').
  *   **Judgement Call Warning:** Distinguishing between a 'complaint' and 'evidence of constraint' is subjective. Assessors must agree on the specific rule being referenced.

  **Q5. Is the fragmentation or silence informative?**
  *   **Methodological Commitment:** An atypical individual is sometimes a better window onto a norm; traces are often partial because of authority intervention.
  *   **Sufficient Answer:** Do missing pages, gaps in dates, or cryptic entries suggest external pressure (e.g., hiding activity, loss due to eviction, censorship)?
  *   **Procedure:** If **Yes**, treat the damage as **Evidence**, not deterioration. Mark for **Accession**. If the material is merely damaged by neglect with no narrative implication, proceed to Q6.
  *   **Research Burden:** High. *This step requires the phone call to the donor.* Ask: "Do you know why these pages are missing?" If the donor knows, it counts. If unknown, treat as neutral damage.

  #### Part 3: Display Potential (10 Minutes)
  *These questions determine Display suitability. This is separate from Accession.*

  **Q6. Can the material sustain a narrative without significant external research?**
  *   **Methodological Commitment:** Reducing scale discloses structures a survey cannot see, *but only if those structures are legible*.
  *   **Sufficient Answer:** Can the team draft a 50-word label based *only* on what is in the box?
  *   **Procedure:** If **Yes**, mark for **Display Consideration**. If **No** (requires contextual research we cannot fund), mark for **Storage Only**.
  *   **Judgement Call Warning:** This is often where 'interest' masquerades as 'legibility'. If the team finds it 'fascinating' but cannot explain why to a visitor without a historian's context, it is **Storage Only**.

  **Q7. Does displaying this item reinforce the 'tidy and powerful' default?**
  *   **Methodological Commitment:** Avoid defaulting to holdings that look like traditional archives.
  *   **Sufficient Answer:** Does the item look like an official record (bound, typed, complete) or a personal trace (handwritten, fragmented, ephemeral)?
  *   **Procedure:** If **Official Record**, default to **Storage Only** (even if accessioned). If **Personal Trace**, mark for **Display Consideration**.

  #### Part 4: Decision Matrix

  *   **Accession:** Requires Q3 (Individual) OR Q4 (Constraints) OR Q5 (Informative Fragmentation).
  *   **Display:** Requires Q6 (Legible) AND Q7 (Not 'Tidy').
  *   **Refusal:** Fails all Accession criteria.
  *   **Escalation:** Triggered in Part 1.

  ***

  ### Methodological Translation: What Survives and What Drops

  To fit the 40-minute constraint, certain microhistorical nuances must be sacrificed.

  **Distinctions that Survive:**
  1.  **Individual vs. Institution:** This is the primary filter. It survives because it is visually and textually immediate.
  2.  **Constraint as Evidence:** The requirement to see the 'system' in the 'trace' survives, as it prevents the accumulation of sentimental clutter.
  3.  **Fragmentation as Data:** The idea that damage or gaps can be evidentiary survives, provided the donor can briefly explain them.

  **Distinctions Dropped (without fatal distortion):**
  1.  **Representativeness:** We cannot determine if an individual is 'typical' in 40 minutes. We drop the requirement for representativeness and accept the 'atypical' as valuable in itself.
  2.  **Contextual Verification:** We cannot verify if the 'constraints' mentioned are accurate to the period without research. We must accept the *creator's perception* of constraint as the historical fact.
  3.  **The 'Norm':** We cannot use the item to define a norm (as per microhistorical theory) at the triage stage. We accept it as a *potential* window, deferring the theoretical heavy lifting to the curatorial stage.

  **Judgement Calls Wearing Procedural Dress:**
  *   **Q4 (Constraints):** Deciding whether a mention of a 'fine' is evidence of a systemic structure or just a grumble is a historiographical judgement. The procedure treats it as a binary checkbox, but it relies on the assessors' intuition.
  *   **Q6 (Legibility):** Deciding if a narrative can be sustained without research is a proxy for "Can we afford to curate this?" It is a budgetary decision disguised as an interpretive one.

  ***

  ### Application to Current Offers

  #### 1. Engineers' Union Branch Minute Books (1948–1979)
  *   **Part 1:** No living donor (ended 1979). No conditions. **Proceed.**
  *   **Part 2:**
      *   Q3 (Voice): **Institutional.** (Default: No Accession).
      *   Q4 (Constraints): Mentions of national strikes and wage agreements exist, but these are records of the *negotiators*, not the workers navigating the constraints. **Negative.**
      *   Q5 (Fragmentation): Complete run. No informative gaps. **Negative.**
  *   **Part 3:**
      *   Q7 (Tidy/Powerful): It is bound, typed, and complete. It is the definition of 'tidy'. **Storage Only.**
  *   **Decision:** **Accession: YES** (as a contextual reference for the town's industry), **Display: NO**.
  *   **Rationale for Downgrade:** While I would historically like to accept this as it documents labour, under this protocol it is downgraded from display consideration. It represents the *structure* of labour, not the *experience* of it. It reinforces the 'tidy archive' bias we are trying to correct. It will be stored as reference material only, not featured as 'History from Below'.

  #### 2. Canteen Worker's Notebook (Undated, Fragmentary)
  *   **Part 1:** Donor deceased (offered by estate). No conditions. **Proceed.**
  *   **Part 2:**
      *   Q3 (Voice): **Individual.** (Positive).
      *   Q4 (Constraints): Entries show prices of food vs. wages, notes on "inspector visits", and shifts cancelled due to "boiler failure". **Positive.**
      *   Q5 (Fragmentation): Pages missing around the dates of the 1972 strikes. Donor's daughter confirms on phone: "She tore them out, said they were too dangerous to keep." **Positive (Informative Silence).**
  *   **Part 3:**
      *   Q6 (Legibility):** The prices and gossip allow a label to be written immediately ("The cost of a tea break in 1970"). **Positive.**
      *   Q7 (Tidy/Powerful):** Handwritten, messy, fragmented. **Positive.**
  *   **Decision:** **Accession: YES, Display: YES.**
  *   **Rationale:** This is the core microhistorical object. The fragmentation is evidence of fear/control. The content reveals the economic constraints of the worker. It requires no research to display the tension between the canteen prices and the wages noted.

  #### 3. Plant Owner's Family Papers (With Display Condition)
  *   **Part 1:**
      *   Q2 (Conditions): **Yes.** "On the understanding that we mount a display."
  *   **Decision:** **ESCALATE TO MANAGER.**
  *   **Manager's Decision (Me):** **Refuse Display Condition.** Offer Accession only.
  *   **Rationale:** Accepting a display condition from the owning family violates the 'History from Below' aim. It hands interpretive authority to the 'powerful'. If they insist on the condition, the offer must be **Refused** entirely. If they relent, the material is **Accessioned** but treated with critical distance (displaying the owners as subjects of scrutiny, not heroes). Given the town's history, a display centred on the owners' albums would likely revert to the 'tidy and powerful' default. I will recommend **Refusal** of the offer if the condition stands.

  ***

  ### Limitations of the Procedure

  This procedure successfully filters out the 'tidy' institutional records that usually crowd out personal traces. However, it cannot remedy the fundamental silence of the archive.

  **1. The Problem of Non-Survival:**
  The procedure can only assess what is *offered*. It cannot generate material from those who left no traces. The poorest workers, the undocumented, and the marginalised often did not keep notebooks, nor did their families preserve them. This triage creates a 'History from Below' collection, but it is still a history of those *literate and settled enough* to leave a notebook. It privileges the 'documented poor' over the 'invisible poor'.

  **2. The Burden of Interpretation:**
  By prioritising fragmented, difficult material (like the Canteen Notebook), we increase the curatorial burden. The Union Minutes explain themselves; the Notebook requires work to contextualise. The procedure identifies the value, but it does not allocate the resources required to unlock it. We risk accessioning material we lack the capacity to interpret, creating a new kind of silence: the archive that is open but unreadable.

  **3. The Donor Gap:**
  The procedure relies on a phone call to verify fragmentation (Q5). If the donor is dead or unknowing (common with older material), we lose the ability to distinguish between 'evidentiary silence' and 'rot'. We may refuse significant material because we cannot prove the gaps are meaningful within 40 minutes.

  **Conclusion:**
  This protocol shifts our acquisitions from 'what looks like history' (minutes, ledgers) to 'what acts like history' (traces, constraints, fragments). It will result in a messier, more difficult collection. It will refuse the Union Minutes that look like safe labour history. It will challenge the Owners who want a shrine. But it cannot conjure the voices of those who wrote nothing. For that, we need oral history and community co-curation, not just triage.
