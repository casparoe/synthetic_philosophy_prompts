answer: |-
  # The Brass Plate

  The lobby of the co-op smelled of wet wool and floor wax. In the center of the north wall, mounted at eye level, was the brass plate. It was polished once a year, though the edges were tarnished green where fingers had rubbed against them for nineteen years. Arthur sat behind the desk to the right, a ledger open in front of him. He didn't look up when Mara walked in, but she knew he was watching the reflection of her hands in the brass.

  The bylaw was printed on a card pinned above the plate. *Notice of Use posted before the first of the month binds the property for ten years. No amendments. No withdrawals.* Arthur was the Keeper. He did not decide what stayed. He only decided what went up. Once the pin pierced the paper, the building owned it.

  Mara stood in front of the empty surface. Her reflection was a ghost in the metal. She worked payroll for a plumbing supply company two towns over. She spent her days entering numbers that, once keyed, could not be un-keyed. A check issued was money gone. A tax file submitted was a record permanent. She understood finality. She understood that some things, once set in motion, gathered their own weight.

  Unit 304 wanted the courtyard paved. Henderson lived there. He had circulated a memo about the building's reserve fund, the rising cost of snow removal, the revenue a parking pad would generate. He was right about the money. The building was bleeding cash.

  Mara wanted the courtyard kept as it was. Her mother had planted the greenhouse beds twenty years ago. Tomatoes in August, kale in the frost. It was the only thing in the city that didn't require a key card or a fee.

  If Mara posted "Greenhouse," and Henderson posted "Parking," the bylaw triggered the tiebreaker. Contradictory notices meant the city took jurisdiction. The courtyard would be fenced pending a zoning review. The review would take three years. During the review, the building's insurance rating would shift to "Litigated Property." The premiums would double. Every resident would pay for it. The reserve fund would vanish into insurance hikes before the city made a decision.

  Both outcomes destroyed value. The tiebreaker was a fire that burned the house to decide who owned the furniture.

  It was the twenty-eighth. Two days left.

  Mara had spent the week watching Henderson. He carried a draft notice in a clear sleeve. He walked past the board three times a day. He was waiting for her to pin her claim so he could pin his. If she moved first, he would counter. If he moved first, she would counter. The race was a trap. The speed didn't matter. The contradiction mattered.

  She went home to her apartment on the second floor. She sat at her kitchen table with a stack of index cards. She tried writing "Greenhouse Only." She tried writing "No Vehicles." Each time, she saw Henderson's notice in her head. *Parking Pad.* The clash was inevitable. The city would come. The fence would go up. Her mother's beds would be choked by wire mesh and legal fees.

  To stop the clash, the notices had to match.

  If she posted "Parking," Henderson would post "Parking." No contradiction. The courtyard gets paved. The beds die. She loses.

  If she posted nothing, Henderson would post "Parking." The courtyard gets paved. The beds die. She loses.

  She needed a notice that Henderson could not contradict without burning himself. She needed to remove the contradiction before he could create it.

  She picked up her pen. She thought about the payroll ledger. Sometimes, to balance a sheet, you had to write off an asset. You had to admit the loss to stop the bleeding.

  She wrote on the card. She didn't write "Greenhouse." She didn't write "No Parking."

  She wrote: *Primary Use: Parking. Secondary Use: North Wall Greenhouse Beds. Maintenance and Liability for Greenhouse assumed by Unit 204.*

  She sat still. The pen hovered over the paper.

  This was the surrender. She was writing "Parking" on the card. She was giving him the revenue. She was giving him the primary claim. She was admitting that the courtyard belonged to the cars first. If she pinned this, she could never fight the parking later. The ten-year clock would start on a paved yard. She was binding herself to the thing she hated most, just to save the corner where the kale grew.

  It was terrifying. It felt like cutting off a hand to save a finger. But if she pinned this, Henderson couldn't post "Parking." If he posted "Parking," it would match her primary use. But her secondary use was attached. To remove the greenhouse, he would have to post "Parking Only." That would contradict her "Parking + Greenhouse."

  If he contradicted her, he triggered the city. He triggered the insurance hike. He triggered the fence.

  She was handing him the victory on the money so he wouldn't take the victory on the land. She was making it too expensive for him to fight. By giving up the fight herself, she made fighting costly for him.

  She looked at the line: *Liability... assumed by Unit 204.*

  That was the weight. If a car hit a plant, if a root cracked a paver, she paid. She was putting her own savings behind the words. It made the notice heavy. It showed she wasn't bluffing. She was burning her own safety to make the promise hold.

  She folded the card. She walked back to the lobby. It was midnight. The hall light hummed. Arthur was gone, but the board was accessible until noon the next day. The building was silent.

  She stood before the brass. Her hand shook. This was the moment. Once the pin went in, the ten years began. She would be the neighbor who authorized the parking lot. She would be the one who signed the pavement into existence. The other residents would see "Parking" at the top of her notice. They wouldn't read the rest. They would just know she let the cars in.

  She thought of the payroll checks. Once mailed, they couldn't be called back.

  She placed the card against the brass. She took a blue thumbtack from her pocket. She pressed it into the top center of the card. The point bit into the cork behind the plate. There was a small, dry crunch.

  It was done.

  She stepped back. The white card sat on the metal. *Primary Use: Parking.* The words looked like a confession.

  She walked to the window and looked out at the courtyard. The greenhouse beds were dark mounds in the moonlight. They were safe for now, but they were guests now. Tenants in a house owned by cars. She had saved them by demoting them.

  She waited. She needed to know if Henderson would come. If he came before noon tomorrow and pinned his own notice, he might try to strip her condition. He might write "Parking. No Exceptions."

  If he did that, the contradiction triggers. The city comes. The insurance spikes. He loses money. He knows the numbers. He reads the memos. He knows the cost of the tiebreaker.

  But people didn't always act on numbers. Sometimes they acted on pride. If he saw her notice, saw that she had yielded, he might feel generous. Or he might feel victorious and push for the whole thing, not realizing that pushing too hard would break the floor beneath him.

  She stood in the lobby until her legs ached. She watched the shadow of the elevator door. Nobody came.

  She went upstairs. She didn't sleep. She watched the sun come up over the roofline. At 8:00 AM, she went back down.

  The card was still there. Arthur was at his desk. He was drinking coffee. He looked at the board, then at her. He didn't smile. He didn't nod. He just turned a page in his ledger.

  Henderson walked in at 8:15. He wore a suit. He carried the clear sleeve. He stopped in front of the board. He stood there for a long time. He didn't look at Mara. He looked at the white card. He read it twice. He raised his hand to the sleeve, then lowered it.

  He turned around. He walked back to the elevator. He didn't take the sleeve out.

  Mara exhaled. She hadn't realized she was holding her breath.

  It wasn't over. He had until noon. He could still come back. He could still decide that the insurance hike was worth it to clear the beds. He could decide that her liability offer wasn't enough. He could decide to burn the building down to win the argument.

  She walked out to the courtyard. The air was cold. The kale leaves were covered in frost. She knelt by the beds. The soil was hard. She touched a leaf. It was brittle.

  She went back inside. She sat on the bench in the lobby, facing the board. She watched the clock. 10:00 AM. 10:30 AM.

  The brass plate gleamed under the fluorescent light. The blue thumbtack head caught the glare, a small, hard star pinned against the metal. Her card remained alone. The words *Primary Use: Parking* stared back at her, flat and permanent.

  At 11:45, the elevator dinged. Henderson stepped out. He walked to the board. He held a new card in his hand. He stood next to her notice. He looked at his card, then at hers. He didn't look at her.

  He raised the tack to the board, an inch from her paper. He held it there. The metal point hovered over the cork.

  Mara watched his hand. She didn't move. She didn't speak. She waited to see if he would push.
