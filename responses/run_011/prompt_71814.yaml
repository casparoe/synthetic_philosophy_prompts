prompt: |-
  I'm the activities and wellbeing lead across three residential care homes (about 140 residents between them, mostly 80+, a fair number with mid-to-late dimentia). Somebody died last spring and left us a chunk of money restricted to "quality of life" programming, and head office has asked me to write the framework for how we spend it, because right now those decisions get made by whoever speaks loudest in the monthly managers' meeting and the three homes have ended up doing completely seperate things with the same pot. I want the framework grounded in something that actually has an argument behind it rather than another wellbeing buzzword deck, and the thing that's stuck with me from a philosophy course I did years ago is Moore's Principia Ethica — the last parts, where he argues that the most valuable things we can imagine are roughly affection for other people and the appreciation of what's beautiful, and that neither beauty just sitting there unappreciated nor pleasant feelings on their own are really what's valuable. The bit that seems useful for my job is his insistence that the valuable state isn't just a feeling, it's a feeling plus some kind of awareness of the qualities of the thing it's about — which if he's right means an hour where people are merely soothed isn't the same kind of thing as an hour where they're actually attending to something.

  Can you turn that into a decision procedure my three activities coordinators could actually run on a proposal? They're not philosophers and won't read anything over two pages. I want the questions in the order they have to be asked, what counts as a good enough answer to each, which questions can kill a proposal outright versus which ones just flag it for me, and where the procedure has to hand the decision back to a human being because it's really a question of values and not of fact. Be blunt about where Moore and my job pull in different directions — pain relief and plain comfort obviously matter enormously here in a way his theory gives no obvious room for, and I don't want a framework that quietly tells us to stop doing the things residents actually enjoy just because they're "only" enjoyable. Also please correct me anywhere I've mangled what Moore says; I'm working from memory and a ten-year-old paperback, and if the paraphrase above is wrong in a way that matters for the procedure, say so and build the procedure on the right version instead.

  Then run it on three proposals we've actually got on the table: a weekly VR "armchair travel" session (nature scenes, the seaside, people's old home towns) for residents who can't get out any more; a robotic seal for the dementia wing, which the staff are keen on and which visibly settles people who are distressed; and a visiting pianist, an hour a fortnight in the lounge, which is my deputy's baby and which I suspect will come out badly on your procedure — if it does, say so plainly and say what would have to change about it. Format: numbered steps for the procedure itself, then a table of the three cases with columns proposal | verdict (fund / fund with changes / refer to me / decline) | the step it turns on | what specifically would have to change | how confident you are in that call and why. Finally, put the procedure into a JSON object too so I can drop it straight into our SOP template, with exactly this schema: {"procedure_name": string, "steps": [{"id": string, "question": string, "sufficient_answer": string, "on_failure": "stop" or "flag" or "proceed", "escalate_to": string or null}], "values_not_facts": [string], "known_failure_modes": [string]}. Keep the step ids short (s1, s2...) because they're going into a spreadsheet column.
