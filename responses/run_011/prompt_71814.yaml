      *Step 1 (Safety)*: Stop if no.
      *Step 2 (The Moorean Core)*: Is there an object of attention? If no, Flag (Comfort check).
      *Step 3 (Connection)*: Does it foster affection? If no, Proceed (Beauty is enough).
