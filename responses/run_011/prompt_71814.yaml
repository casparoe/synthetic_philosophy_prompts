  8.  **Writing the Response:** (Mental check of the Pianist critique).
      *   Why would the Pianist fail? Passive consumption. "Pleasant feelings on their own" (which Moore says are less valuable). If residents are just sitting there while someone plays, is there "appreciation of qualities"? For late-stage dementia, maybe not. It risks being "background noise." To pass, it needs to be interactive (sing-along, instrument touching) or curated for specific attention. I will be blunt about this.

      *   *Refining the JSON Schema:* The prompt asks for specific keys. `on_failure` must be "stop", "flag", or "proceed". `escalate_to` string or null.
      *   *Values not facts:* List the subjective judgments.
      *   *Known failure modes:* Where the procedure breaks.

      *(Self-Correction on JSON)*: Ensure valid JSON (no trailing commas, escaped quotes).

      *(Self-Correction on Moore)*: Make sure I don't sound like I'm lecturing too much. Keep the correction brief and integrated.

      *(Final Polish)*: Check the "Fund with changes" logic for the Seal. Is it a "false" affection? Moore might hate it. But for dementia, it works. I'll flag it as "Simulated Connection" requiring human facilitation to make it real.

      *(Final Polish on Pianist)*: The user suspects it will come out badly. I should validate that suspicion. If it's just a performance, it's passive. It needs to be *music therapy* or *participatory* to meet the "appreciation" criteria for this specific group.

