      *   **Constraints:**
          *   Must be usable by activities coordinators (non-philosophers, <2 pages).
          *   Needs a decision procedure (ordered questions, pass/fail/flag criteria).
          *   Must acknowledge limitations (Moore vs. Care Reality: pain relief/comfort matters even if not "aesthetic appreciation").
          *   Must correct any misinterpretations of Moore.
          *   Must apply the procedure to three specific cases (VR, Robotic Seal, Visiting Pianist).
