answer: |-
  Alice and Bob own identical apartment buildings requiring monthly HVAC filter changes. Three specialized firms operate nearby, each with limited monthly capacity and identical public price lists. Both owners possess complete knowledge of all current quotes and firm capabilities. Both have identical budgets and accounting software, and neither is rushed or tired. Bob hires the firm quoting the lowest price each month. Alice hires the first firm quoting under $200 that she employed previously; only if none qualify does she search anew. Firms privately prioritize clients who provide predictable, repeat scheduling over those who force competitive bidding every cycle. When capacity tightens, firms fill slots with prioritized clients first; others face delays or emergency surcharges. Bob's rule forces him to switch firms whenever undercutting occurs, signaling unpredictability to the vendors. Alice's rule retains firms through minor price fluctuations, signaling stability. Over three years, Bob saves $100 per transaction initially but incurs $2,000 in emergency surcharges when locked out during peak seasons. Alice pays slightly higher base rates but avoids surcharges entirely. Both agents possess identical market data; neither knows any firm's internal scheduling algorithm or break-even points. This information is unavailable because it is private business logic, inaccessible even to an unlimited brain. Alice's threshold ranges effectively between $190 and $210 without altering the outcome. The firms observe only hiring history, not owner intent. No firm predicts the future; they react to past booking patterns. The market is stable, with no exotic financial instruments or lotteries involved. The difference in outcome arises solely from how each rule shapes the vendor relationship over time. The only variable is the selection rule applied to identical information sets.

  ### Analysis

  **Decision Points**

  1.  **Month 1 (Setup):** All three firms quote $200. Bob picks Firm A (random tie-break among best options). Alice picks Firm A (meets $200 threshold). Both pay $200. Both agents have identical information; the choice is functionally the same here.
  2.  **Month 6 (The Divergence):** Firm A raises price to $205 due to fuel costs. Firm B drops to $195 to gain market share. Bob calculates that $195 is less than $205. Since his rule is to pick the lowest price *now*, he switches to Firm B. He saves $10. Alice checks Firm A's quote ($205) against her threshold ($200). It fails. She checks Firm B ($195). It passes. She switches to Firm B. *Correction:* To make the case work, Alice must *stay* sometimes. Let's adjust the threshold logic in the walkthrough. Alice's rule is "First firm under $200 *that she employed previously*." If Firm A quotes $205, she searches. If Firm B quotes $195, she hires B. To show the advantage, Alice needs to stay with A when A is slightly high but under threshold.
      *Revised Month 6:* Firm A quotes $198. Firm B quotes $195. Bob picks B (saves $3). Alice picks A (meets $200 threshold, avoids search cost/relationship break). Firm A records Alice as "stable," Bob as "volatile."
  3.  **Month 12 (The Consequence):** Peak summer season. Capacity is full. Firm B (Bob's current) allocates slots to clients who stayed with them through winter. Bob is bumped because he switched in Month 6. He faces a $300 emergency fee from a spot vendor. Alice retains her slot with Firm A at $198. Bob's local optimization caused a global loss.

  **The Structural Feature**

  The feature doing the work is **opaque capacity rationing based on transaction history**. Vendors have limited slots and use past client behavior as a proxy for future reliability because they cannot write contracts guaranteeing priority. This information (the vendor's internal prioritization algorithm) is unavailable to the agents because it is private business logic; an unlimited brain cannot deduce private internal rules from public prices.

  **Removing the Feature**

  If we remove this feature by making vendor capacity **infinite** or allocation **purely first-come-first-served** regardless of history, the case collapses. Bob would switch to the cheaper firm, save the $3 every month, and never face a delay. Alice would pay more for no benefit. The advantage of satisficing disappears entirely when the counterparty's future behavior is not sensitive to the agent's past choice stability.

  **The Maximizer's Reply**

  A sophisticated maximizer would argue: "I do not maximize per transaction, but per lifetime. I calculate that switching saves $3 now but risks $300 later. Therefore, the utility-maximizing *policy* is to stay with a vendor unless the price exceeds a certain threshold." She adopts Alice's rule as her own strategy.

  **Evaluation**

  This reply succeeds in saving the maximizer from losing money, but it changes the definition of maximizing. If the best way to maximize long-term outcomes is to follow a satisficing rule, then satisficing is not a concession for limited minds; it is the optimal strategy for unlimited minds too. The claim that satisficing is *only* for limited minds comes out **false**. However, this blurs the line between the two forms of reasoning. If satisficing is just a tool for maximizing, it is not a genuinely different kind of practical reasoning, but rather a specific *policy* within maximizing. The distinction shifts from "how we think" to "what time horizon we calculate over."
