  **MEMORANDUM**

  **TO:** Clinical Risk Committee
  **FROM:** Chair, Clinical Risk Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Rule for Pathogen-Reduction Licensing and Q4 Recommendation

  **Bottom Line**
  For this quarter's licensing item, I recommend we adopt Option H (partial uptake). It minimizes expected harm based on our agreed metrics. Regarding the standing decision rule, I recommend we retain Ordinary Expected Utility (EU) as our standard and reject Risk-Weighted Expected Utility (REU) for routine adjudication. While Analyst B's concern for catastrophic risk is valid, the REU framework introduces instability in public decision-making that outweighs its theoretical benefits. We will address catastrophe aversion through sensitivity analysis rather than altering the decision rule.

  **Utility Functions vs. Risk Weights**
  Analyst A argues that risk attitude belongs in the utility function, while Analyst B argues it belongs in the probability weighting. We previously stipulated a linear utility over harm-units to avoid debating whether a 40-patient incident is more than 40 times worse than a 1-patient incident. Can B's preference be recaptured by a concave utility function without changing the rule? No.

  Mathematically, under EU, Option S (Status Quo) has an expected harm of $0.01 \times 40 = 0.4$ units. Option P (Full Uptake) has a fixed cost of 0.75 units. EU ranks S over P ($0.4 < 0.75$). To rank P over S, the decision rule must treat the 1% probability as if it were at least 1.875% ($0.75 / 0.4$). Analyst B proposes doing this via a risk function $\rho(p)$. However, shifting from EU to REU surrenders the **Independence Axiom**. This axiom requires that if we prefer P to S, we must still prefer P to S even if both are combined with a common irrelevant outcome. REU violates this; it allows preferences to flip based on how the gamble is described. Since we deliberately chose linear utility to ensure comparability across committees, adopting REU now would silently reverse that prior agreement.

  **The Allais Pattern**
  My colleague's remark that this is "just the Allais pattern" is precise. The Allais Paradox demonstrates that people often prefer a certain outcome over a gamble with higher expected value, violating Independence. Here, Option P offers a "certainty effect" regarding pathogen risk (0% residual risk) compared to S (1% risk). Analyst B's ranking (P > S) despite the higher cost mirrors the Allais preference for certainty. While psychologically common, this pattern is inconsistent with the transitivity required for stable long-term policy. If we adopt a rule that validates the Allais pattern, we commit to preferring certainty even when it costs significantly more harm-units elsewhere in the system.

  **Distrust vs. Preference**
  Analyst A suggests B's risk function is a proxy for distrust of the 1% incidence estimate. This is a deflationary but strong diagnosis. If B believes the true risk is higher than 1%, that is an epistemic claim, not a normative one. The correct response to parameter uncertainty is **sensitivity analysis**, not a new decision rule. We should test whether P becomes preferable if the incidence rate rises to 1.5% or 2% under standard EU. If P wins under higher estimates, we document that threshold. Smoothing epistemic uncertainty into the risk function obscures the source of disagreement: are we arguing about the data (A's view) or the value of safety (B's view)? We must separate these. I recommend we require sensitivity analysis on probability estimates for all high-impact items rather than adjusting the utility calculus.

  **Bundling and Dynamic Choice**
  A technical objection to REU is dynamic inconsistency: an agent can be "money-pumped" by accepting a sequence of individually acceptable bets that guarantee a loss. The standard reply is that REU must be applied globally to whole packages of decisions rather than case-by-case. I tested this by bundling five years of decisions into one gamble. Under B's rule, the recommendation flips emphatically to P, driven by the state where five incidents occur in five years (probability $\approx 10^{-10}$).

  This frame sensitivity is prohibitive for a public body. First, our "package" has no obvious boundaries—is it a fiscal year, a license term, or the lifespan of the organization? Second, committee membership changes between quarters. A rule that requires global optimization across time binds future committees to the risk attitudes of the current one, which is democratically untenable. Third, public bodies must treat like cases alike. If the recommendation for pathogen reduction changes simply because we decided to review licenses every five years instead of annually, the rule lacks the stability required for regulatory trust. EU is frame-invariant; REU is not.

  **Whose Risk Attitude?**
  We are selecting a risk profile on behalf of patients who are not in the room. Those who bear the fixed costs (taxpayers, donors) differ from those who benefit from averted catastrophes (recipients). Is it legitimate to impose a risk-averse profile on them? Yes, but only if explicit. An individual may legitimately prioritize avoiding catastrophe over minimizing average harm. However, when acting as fiduciaries, we should not embed this preference covertly in a risk function. If the committee wishes to prioritize catastrophe avoidance, we should explicitly weight harm-units (e.g., counting a 40-patient incident as 60 units) rather than distorting probabilities. This makes the trade-off visible for public scrutiny. Hiding normative judgments in the probability weighting makes them immune to challenge.

  **The Strongest Case for Analyst B**
  Analyst B's position rests on the claim that linear harm-units fail to capture systemic risk. A single 40-patient incident may trigger regulatory sanctions, loss of public trust, or service closure, causing secondary harms far exceeding the initial 40 units. If the cost of a catastrophe is non-linear due to reputational collapse, then minimizing expected harm-units underestimates the true cost of Option S. B's risk function attempts to model this cliff-edge effect. While REU is the wrong tool for this, the underlying concern—that our metric may ignore systemic fragility—is valid and requires mitigation.

  **Future Decision Rule**
  To resolve future disputes without reopening this argument, the committee will adopt the following test:
  1.  **Primary Rule:** Decisions are made using Ordinary Expected Utility on agreed harm-units.
  2.  **Catastrophe Check:** For any option with a residual risk of >10 harm-units in a single incident, we will run a sensitivity analysis assuming a 2x multiplier on harm-units for that incident only.
  3.  **Threshold:** If the recommendation changes under the 2x multiplier, the item requires full Board review rather than Committee sign-off.

  This preserves the stability of EU while flagging high-concentration risks for higher scrutiny. We will proceed with Option H this quarter under the Primary Rule.
