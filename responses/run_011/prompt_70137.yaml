answer: |-
  **The Algebra of Concord: Why Aumann's Theorem Forbids the Excuse of 'Different Priors'**

  It has become a comforting reflex in intellectual discourse to invoke Robert Aumann's Agreement Theorem as a shield for disagreement. The popular gloss is seductive in its simplicity: Aumann proved that rational agents with common priors cannot agree to disagree; therefore, since we disagree, we must possess different priors. We begin from different premises, we see the world through different lenses, and thus, our divergence is not a failure of rationality but a feature of our distinct starting points. It is an intellectual alibi of the highest order.

  It is also a profound inversion of what the mathematics actually establishes. To wield Aumann's result as a justification for persistent disagreement is to misunderstand the engine of the theorem. The force of the result does not lie primarily in the Common Prior Assumption (CPA), but in the operator of *common knowledge*. Furthermore, the notion that priors are immutable, idiosyncratic starting points is a category error. An apparent difference of priors is best understood not as a fundamental divergence in worldview, but as a difference of indexical location within a single, shared prior. Consequently, such differences are corrigible—errors to be fixed through communication—rather than exculpatory, serving as excuses to remain apart.

  To see why the standard defence fails, one must look at the architecture of the theorem. Aumann's 1976 result demonstrates that if two agents share the same prior probability distribution over a state space, and if their posterior probabilities for a given event are *common knowledge*, then those posteriors must be identical. The popular interpretation fixates on the antecedent condition: 'share the same prior'. It suggests that if we waive this condition, the conclusion no longer holds, and disagreement is licensed.

  This reading treats the common prior as the active constraint and common knowledge as a mere procedural formality. In truth, the common knowledge operator is the heavy lifting mechanism. The theorem is not a description of how people *do* behave, but a constraint on what epistemic states are *consistent* with rationality. It establishes that you cannot simultaneously know what I believe, know that I know what you believe, and so on ad infinitum, while maintaining different beliefs about the same proposition. The 'common prior' is merely the baseline for what constitutes a shared reality. To claim different priors is not to claim a different starting line; it is to claim you are playing a different game.

  This brings us to the crux of the misuse. When an agent says, "We simply have different priors," they are treating their prior as a private preference, akin to a taste for vanilla over chocolate. But in Bayesian epistemology, a prior is not a preference; it is a mapping from information to belief. If two rational agents possess different mappings, it implies they are processing the same universe as if it were two different universes.

  A more rigorous interpretation suggests that what we call 'different priors' are actually indexical variations of a single universal prior. Consider the difference between saying "It is raining here" and "It is raining there." The proposition differs, but the underlying meteorological reality and the probability distribution governing it do not. The difference is purely indexical—a matter of where the agent is situated in the state space. When Agent A assigns a probability based on "I am A" and Agent B assigns based on "I am B," they are not invoking different priors; they are conditioning a single prior on different indexical facts.

  If we accept this indexical model, the normative implication shifts dramatically. If my 'prior' is merely my location in the information space, then my disagreement with you is not a result of my unique soul or inherent perspective. It is a result of my failure to fully integrate your location into my calculation. The difference is corrigible. I am obliged to treat your information as a missing coordinate in my own map. To claim a difference of priors is exculpatory is to claim that my location in the universe excuses me from understanding yours. Aumann's theorem, properly read, demands that we treat the 'common prior' as a regulative ideal: we must act *as if* we share a prior, which means treating your evidence as potentially mine.

  Naturally, such a demanding standard invites scepticism. Two objections arise squarely from the practical realities of discourse, and both must be met if this interpretation is to hold water.

  The first objection is the charge of triviality. Critics argue that for posteriors to become common knowledge, agents must essentially pool all their evidence. If I must tell you everything I know to establish common knowledge of my posterior, and you must do the same, then by the time we satisfy the theorem's conditions, we have already done the work of agreement. The theorem, on this view, merely states the tautology: "If you know what I know, you will believe what I believe."

  This objection confuses the *mechanism* of agreement with the *constraint* on disagreement. Aumann's result is not a recipe for conversation; it is a impossibility proof regarding stable epistemic states. It tells us that a state of 'agreeing to disagree' is mathematically incoherent for rational agents with a shared reality. The triviality charge misses the normative bite. The theorem does not require us to swap every datum instantly; it requires that we acknowledge the *possibility* of common knowledge. If we stop short of full pooling, we must acknowledge that our disagreement is provisional, resting on incomplete communication, rather than fundamental. The theorem forbids us from resting comfortably in the knowledge of our divergence. It makes disagreement a cost to be minimised, not a right to be exercised.

  The second objection is more empirical: in the real world, priors genuinely differ. People are raised in different cultures, possess different cognitive architectures, and value different outcomes. Once we allow priors to differ, the theorem falls silent. Since no two humans actually share a prior, the result applies to no case anyone actually cares about. Agreement becomes a matter of degree, and the strict binary of Aumann's logic dissolves.

  This objection relies on a reification of priors that the indexical argument rejects. To say priors 'genuinely differ' is to assume that cultural or cognitive differences constitute a change in the fundamental probability measure of the world, rather than a change in the information set. If I was raised to distrust authority and you were not, this is not a difference in the prior probability of truth; it is a difference in the weight we assign to testimony. This is data, not a prior.

  To concede that priors differ is to surrender the possibility of rational arbitration entirely. If we accept the 'different priors' defence as valid for real-world cases, we render the concept of rational persuasion void. The strength of Aumann's theorem lies in its refusal to grant this surrender. It posits that if we are to communicate at all, we must proceed under the assumption of a common prior. If we act as though our priors are different, we are opting out of the rational discourse the theorem describes. Therefore, the theorem does not fall silent on real-world cases; rather, it diagnoses them. When we disagree persistently, the theorem implies we are failing to be rational, not that we are successfully expressing different worldviews.

  The misuse of Aumann's Agreement Theorem is more than a technical error; it is a moral evasion. It allows us to treat our epistemic limitations as identity features. By shifting the focus from the common-prior assumption to the common-knowledge operator, and by reinterpreting prior differences as indexical locations, we restore the theorem's normative force. We are not entitled to our disagreements because we started differently. We are obliged to resolve them because we inhabit the same world. The mathematics of decision-making does not grant us the right to be different; it imposes upon us the duty to agree.
