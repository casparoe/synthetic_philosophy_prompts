answer: |-
  Subject: Thoughts on the background reading for the working group

  Hi there,

  You are right to feel uneasy about those middle sentences. Your intuition is spotting some real cracks in the argument, and if you present this text to the working group as solid historical or sociological ground, you might get pushed back by anyone who has actually looked at the data on France or Japan. I will walk through the pieces as you asked, keeping in mind what a specialist in labor history or economic sociology would likely say.

  The opening summary of Max Weber is actually the strongest part of the passage, though it is still a simplification. A sociologist would agree that this is a fair shorthand for Weber's argument in The Protestant Ethic and the Spirit of Capitalism. The idea that religious anxiety drove accumulation, which then hardened into a secular compulsion or iron cage, is a standard reading of Weber. However, a historian would caution you that Weber was proposing a cultural affinity, not a mechanical law of history. He was not saying capitalism cannot exist without Calvinism, only that this specific ethic helped ignite it in the West. So while the summary is defensible as a summary of Weber, treating it as an immutable fact about how all economies work is where the trouble starts.

  The section on France is where the argument moves from simplification to factual error. The claim that French workers were less productive per hour than Americans around the time of the thirty-five-hour week legislation is not supported by OECD data. For decades, French GDP per hour worked has been comparable to or sometimes higher than the United States. The difference in overall GDP usually comes from the fact that the French work fewer hours in total, not that they are slower when they are working. Furthermore, saying the reform was quietly walked back is misleading. The legal limit remains in place, though subsequent governments have made it easier to negotiate overtime exceptions. Economists debate whether the law destroyed jobs or saved them through work-sharing subsidies, but blaming the policy on inherent low productivity is a stereotype rather than an economic analysis. A labor historian would tell you this example proves the opposite of what the author intends: policy did change the clock, even if the cultural adjustment was messy.

  The claim about Japan is where the sociological framework really breaks down. Describing karoshi or Japanese corporate loyalty as portable Calvinism is a metaphorical leap that does not hold up to scrutiny. Sociologists of work attribute Japanese overwork to a specific combination of Confucian values regarding group loyalty, the post-war lifetime employment system, and corporate structures that reward presence over output. While the outcome looks similar to the Protestant ethic in terms of devotion to work, the mechanism is entirely different. Calling it Calvinism strips away the actual cultural context and replaces it with a Western-centric label. It is defensible to say work cultures are deep-seated, but it is flatly wrong to say they are the same culture just transported to a different country.

  This brings us to your main question about the conclusion. The last sentence argues that working hours are a cultural fact rather than a policy variable and that you cannot legislate the conscience. This does not follow from the premises provided, especially since the premises about France and Japan are flawed. History shows that policy does change culture, often slowly. The weekend, child labor laws, and overtime pay were all once considered impossible cultural intrusions that became normalized through legislation. A sociologist would tell you that hours are co-determined by both policy and culture. Laws set the boundaries within which culture operates. If you tell your working group that the proposal is hopeless because hours are purely cultural, you are ignoring the fact that every current standard for working hours was once a policy innovation that fought against the existing culture.

  So to answer your specific worry, the unease you feel is real and well-founded. The text uses a compelling narrative arc to connect Weber to modern policy, but it sacrifices accuracy to make the story fit. You cannot reliably use this to conclude that a four-day week is impossible. If you want to argue against the proposal, you will need stronger evidence than this chapter provides, because a knowledgeable colleague could easily dismantle the France and Japan examples. If you want to argue for it, this text actually helps you by showing that the iron cage is a construct that can be examined, even if the author thinks it cannot be opened.

  Hope that helps you prepare for the meeting.

