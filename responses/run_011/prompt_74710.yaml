  2.  **Specific Reliance:** Ask: "Is a specific person currently disadvantaged by your defection (e.g., queue behind you)?" Sufficient Answer: "Yes, identifiable person waiting."
      *   Outcome: **You ought to follow it.**
  3.  **Justice Check:** Ask: "Is this norm fundamentally unjust (bribery) or merely distributive (tipping)?" Sufficient Answer: "Unjust = illegal/coercive." ***Flag: Judgment Call.***
      *   Outcome: **Handoff** (Values question). If unjust, **Do Not Follow.**
  4.  **Local Defection:** Ask: "Do locals ignore this >20% of the time?" Sufficient Answer: "Yes, visible frequent defection."
      *   Outcome: **You're free not to.** (Cost: Social friction).
  5.  **Repeat Interaction:** Ask: "Will you encounter these people/systems again?" Sufficient Answer: "Yes, >1 week stay."
      *   Outcome: **You ought to follow it** (Yes) / **Your call, but here's the cost** (No).

  **Case Runs**

  | Case | Verdict | Step | Confidence | Cost Bearer |
  | :--- | :--- | :--- | :--- | :--- |
  | 1. Swede/Bus | Follow | 2 (Reliance) | High | N/A |
  | 2. Aus/Tip | Handoff | 3 (Justice) | Med | Client (Social) |
  | 3. Teen/Light | Follow | 2 (Reliance) | High | N/A |
  | 4. Bribe | Do Not Follow | 3 (Justice) | High | Client (Permit) |

  **Limitations & Costs**
  This procedure misfires on subtle social costs where being labeled "rude" affects future service quality, which Step 4 underestimates. It structurally cannot settle conflicts where "justice" is culturally relative, leaving Step 3 as a potential stalemate. In the Bribe case, the client eats the cost (delayed permit); the procedure forbids payment because Step 3 vetoes local norm compliance. If your gut says "no" but the procedure says "yes," you wrote Step 3 too weakly; ensure "unjust" overrides "local practice." Step 1 and 3 are judgment calls; train staff to escalate these if unsure. The "Zero Payoff" case (empty street) fails Step 1, passes to Step 5 (Repeat/Host Family), resulting in "Follow" due to reliance/observation.
