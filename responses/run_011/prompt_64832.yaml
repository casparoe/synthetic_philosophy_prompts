answer: |-
  # ONTOLOGICAL DIAGNOSTIC TREE

  **Start:** Shared Commitment — *Some ways of grouping things license generalization and others do not.*

  **N1 (Essence):** Consider 'fish' (paraphyletic) or 'gene' (incompatible definitions). Can a category lacking a shared essence still support robust generalization?  
  → **No:** Go to N2.  
  → **Yes:** Go to N3.

  **N2 (Essence=No Boundary):** Consider 'sepsis' or 'DSM'. Is the boundary set primarily by the world?  
  → **Yes:** Go to N4.  
  → **No (Interests/Joint):** Go to N5.

  **N3 (Essence=Yes Boundary):** Consider 'sepsis' or 'DSM'. Is the boundary set primarily by the world?  
  → **Yes:** Go to N6.  
  → **No (Interests/Joint):** Go to N7.

  **N4 (Realism Check):** Can two incompatible schemes (e.g., gene definitions) both be correct of the same domain?  
  → **No:** Go to N8.  
  → **Yes:** Go to N9 (Check 2).

  **N5 (Deflationary Path):** Do physics and clinical medicine get the same answer regarding what counts as a fundamental kind?  
  → **Yes:** Go to N11 (Check 3).  
  → **No:** Go to N8.

  **N6 (HPC Path):** Did 'element' change kind status after isotopes, or just our description?  
  → **Status Changed:** Go to N10 (Check 1).  
  → **Description Changed:** Go to N8.

  **N7 (Pluralism Path):** Is a category fixed entirely by a measurement procedure (e.g., hypertension) a natural kind?  
  → **Yes:** Go to N8.  
  → **No:** Go to N10 (Check 1).

  **N8 (Projectibility):** Does projectibility explain naturalness, or does naturalness explain projectibility?  
  → **Nat → Proj:** Go to N12.  
  → **Proj → Nat:** Go to N12.

  **N9 (Check 2):** You answered Boundary=World (N2/N3) and Schemes=Yes (N4).  
  → **Confirm:** Go to **LEAF: Unstable**.  
  → **Correct Error:** Return to N4.

  **N10 (Check 1):** You answered Essence=No (N1) or Description Changed (N6) but Measurement=Kind (N7).  
  → **Confirm:** Go to **LEAF: Unstable**.  
  → **Correct Error:** Return to N7.

  **N11 (Check 3):** You answered Physics=Med (N5) but Boundary=Interests (N5).  
  → **Confirm:** Go to **LEAF: Unstable**.  
  → **Correct Error:** Return to N5.

  **N12 (Utility):** Is the term "natural kind" useful for any domain?  
  → **No:** Go to **LEAF: Kind Eliminativism**.  
  → **Yes:** Go to **LEAF SORT** (See Key).

  ---

  ### ANSWER KEY & LEAF ASSIGNMENT

  | Path Profile | Leaf Assignment |
  | :--- | :--- |
  | **N1=No, N2=Yes, N4=No, N12=Yes** | **Causal Essentialism** (World boundaries, essence required, single scheme) |
  | **N1=Yes, N3=Yes, N6=Desc, N12=Yes** | **Homeostatic Property Clusters** (World boundaries, no essence, stable description) |
  | **N1=Yes, N3=No, N5=No, N7=Yes** | **Promiscuous Realism** (Joint boundaries, multiple schemes, kinds real across fields) |
  | **N1=Yes, N3=No, N5=No, N7=Yes, N12=Yes** | **Interest-Relative / Deflationary** (Kinds exist relative to goals, projectibility drives naturalness) |
  | **N12=No** | **Kind Eliminativism** (Term useless across all domains) |
  | **N9, N10, or N11 Triggered** | **Unstable** (Commitments contradict: e.g., World boundaries + Incompatible Schemes) |

  *Instability Sentence:* "Your answers imply that boundaries are fixed by the world while simultaneously allowing incompatible schemes to be correct, or that kinds require essence while accepting measurement-defined categories."

  ---

  ### LOGICAL SPACE ANALYSIS

  **1. Pairs the Tree Cannot Separate:**
  *   **Promiscuous Realism vs. Interest-Relative Deflationism:** Both accept joint boundaries and multiple schemes. Separation relies entirely on N12 (Utility/Realism) and N8 (Projectibility direction). If a respondent is ambiguous on whether kinds are "real" vs "useful," the tree sorts them arbitrarily.
  *   **HPC vs. Essentialism:** Both accept World boundaries. Separation relies entirely on N1 (Essence). If a respondent believes essences exist but are clustered (a hybrid view), the Yes/No forced choice at N1 misclassifies them.

  **2. Unoccupied Regions:**
  *   **Essence=No + Boundary=Interests:** (N1=No → N2=No). *Status:* **Unattractive.** If no essence exists, positing interest-relative boundaries usually collapses into Deflationism (which accepts clusters/essences loosely) or Eliminativism. Hard nominalism without utility is rare.
  *   **Boundary=World + Schemes=Yes:** (N2/N3=Yes + N4=Yes). *Status:* **Incoherent.** If the world sets the boundary, incompatible schemes cannot both be correct descriptions of that boundary. This region triggers the **Unstable** leaf.
  *   **Physics=Med + Boundary=Interests:** (N5=Yes + N5=No). *Status:* **Incoherent.** If boundaries are set by interests, different fields (physics vs. medicine) should have different interests, yielding different kinds. Uniformity implies world-set boundaries. This region triggers the **Unstable** leaf.

  **3. Why Unoccupied?**
  *   The **Incoherent** regions represent logical contradictions in the metaphysics of kinds (mind-independence vs. scheme-dependence).
  *   The **Unattractive** region represents a position with no explanatory power (rejecting essence and realism without gaining pragmatic utility), likely leading respondents toward Eliminativism instead.
