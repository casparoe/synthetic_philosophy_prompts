      *   **Core Question:** What is the implicit theory of rational choice under risk that justifies the "cut-off criteria" (hazard-based bans) vs. the "threshold approach" (risk-based approval)? Is it RWEU, deontology, epistemic humility, or something else? Can one theory hold both halves of the law? What changes if we switch to risk-neutral expected utility?
