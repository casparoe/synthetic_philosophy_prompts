answer: |-
  This is a precise and difficult question that cuts to the core of regulatory philosophy. You are right to suspect that "the precautionary principle" is often used as a conversation-stopper rather than a decision-theoretic account. The tension you describe—between hazard-based cut-offs and risk-based thresholds—is the central friction point in modern chemical regulation.

  Below is a reconstruction of the implicit theories, an analysis of the consistency problem, and a specification of what changes under a risk-neutral regime. I have flagged where decision-theoretic or regulatory consensus is lacking.

  ### 1. Reconstructing the Implicit Theory of the Cut-Off

  The hazard-based cut-off (ban on CMRs, PBTs, EDs regardless of exposure) is compatible with several distinct normative theories. It is crucial to distinguish which of these the law *requires* versus which merely *fit* the practice.

  **A. Risk-Weighted Expected Utility (RWEU) with Extreme Concavity**
  *   **The Fit:** A regulator could be modeled as an agent with a highly concave risk function regarding specific outcomes (e.g., childhood cancer, intergenerational genetic damage). In Buchak's terms, the weight assigned to the worst-case outcome is so high that even a vanishingly small probability swamps the expected utility of the economic benefit.
  *   **The Requirement:** The law does *not* require this. RWEU still implies a trade-off; if the benefit were high enough, or the probability low enough, the math could theoretically clear the ban. The law prohibits approval *outright* (subject to narrow derogations). This suggests a discontinuity that standard RWEU, which is continuous, struggles to replicate without extreme parameter tuning.
  *   **Contested Status:** Whether RWEU is a rational theory of choice is contested in decision theory. Whether a *social* planner can legitimately apply a different risk function than the individuals affected is also contested (see Section 2).

  **B. Deontological Constraints (Rights-Based)**
  *   **The Fit:** This theory posits that individuals have a right not to be subjected to certain *kinds* of risks, irrespective of the aggregate welfare gain. It treats the imposition of carcinogenic or endocrine-disrupting risk as a violation of a constraint, not a cost to be weighed.
  *   **The Requirement:** This fits the "outright refusal" language better than RWEU. It explains why exposure is irrelevant: if the violation is in the *imposition* of the hazard type, the magnitude of exposure mitigates the harm but not the wrong.
  *   **Contested Status:** Many economists reject deontological constraints in policy as irrational "taboos." However, in legal theory, rights-based constraints are standard. The law does not explicitly invoke rights language, so this is an interpretive reconstruction, not a stated premise.

  **C. Epistemic Humility (Model Uncertainty)**
  *   **The Fit:** This argues that for certain hazard classes (specifically genotoxic carcinogens and endocrine disruptors), the dose-response relationship is fundamentally unknowable at low doses. If the mechanism is non-threshold (one molecule can theoretically trigger the event), then "safe exposure" is a category error.
  *   **The Requirement:** This is the strongest scientific justification for the split. If the science asserts a Linear No-Threshold (LNT) model for genotoxics but a threshold model for neurotoxins, then applying a threshold risk assessment to the former is scientifically invalid, not just normatively different.
  *   **Contested Status:** The validity of LNT for all genotoxic carcinogens is scientifically contested. Some toxicologists argue for practical thresholds. The regulation *presumes* non-threshold for these categories; it does not prove it case-by-case.

  **D. Procedural Burden of Proof**
  *   **The Fit:** This is not a theory of value but of evidence. For "normal" chemicals, the default is permissibility unless risk is proven. For cut-off chemicals, the default is prohibitivity unless safety (or negligible exposure) is proven.
  *   **The Requirement:** The law strictly requires this shift in burden.
  *   **Contested Status:** This is the least controversial interpretation but the least satisfying for decision theorists, as it kicks the normative question (why shift the burden?) back a step.

  ### 2. The Aggregation Problem: Can the Regulator be More Risk-Averse than the Public?

  You raised a specific technical worry: If RWEU is a theory for an individual, can a regulator apply a concave risk function to a population that might individually accept the gamble? Does this violate *ex ante* Pareto?

  **The Conflict:**
  If every individual in a population would voluntarily accept a gamble (e.g., a small increase in cancer risk for cheaper food), a regulator blocking that gamble based on social risk aversion appears to violate *ex ante* Pareto efficiency (making everyone worse off relative to their own preferences).

  **The Regulatory Defense (Two Paths):**

  1.  **Involuntary vs. Voluntary Risk:** The regulator is not aggregating voluntary gambles. Pesticide residues are involuntary exposures. Decision theory distinguishes between risks chosen and risks imposed. A social welfare function can legitimately weigh involuntary risks more heavily than voluntary ones, even if the physical outcome is identical. This does not require RWEU; it requires a parameter in the utility function that penalizes *imposition*.
  2.  **Distributional Sensitivity (The Worst-Off):** RWEU is often motivated by a concern for the worst-off outcome. In a population, the "average risk" might be acceptable, but the distribution might concentrate harm on a vulnerable subgroup (e.g., agricultural workers, children with specific dietary profiles). A regulator applying a concave function may be prioritizing the utility of the maximally exposed individual over the aggregate gain. This is compatible with a Prioritarian social welfare function, which is distinct from, though often mathematically similar to, RWEU.

  **Verdict on Aggregation:**
  It is **contested** whether a regulator can override revealed individual preferences for risk. However, it is **settled** in regulatory practice that individual willingness-to-accept is not the standard for public health hazards. The regulator acts as a trustee, not a proxy for a vote. Therefore, the cut-off criteria do not necessarily contradict decision theory, provided the social welfare function includes terms for involuntariness and distribution that individual utility functions do not capture.

  ### 3. Consistency: Is the Law Contradictory?

  Is the agency in flat contradiction with itself by using hazard-bans for some chemicals and risk-thresholds for others?

  **Argument for Contradiction:**
  If health is a single commodity (e.g., "QALYs lost"), then treating a QALY lost to a CMR differently from a QALY lost to a neurotoxin is inconsistent. It implies the utility function is not defined over outcomes (health states) but over causes (chemical classes). Under a standard Expected Utility (EU) framework, this is irrational.

  **Argument for Consistency (The Scientific Bridge):**
  The law is consistent if the *scientific premises* differ.
  *   **Category A (Cut-off):** Presumed non-threshold mechanism. Risk = Hazard × Exposure. If the threshold is zero, any exposure yields non-zero risk. If the acceptable risk is effectively zero (due to deontological constraint or extreme risk aversion), then any hazard triggers a ban.
  *   **Category B (Threshold):** Presumed threshold mechanism. There exists a dose below which risk is zero. Therefore, exposure assessment is required to determine if the threshold is breached.

  **Interpretive Choice:**
  If you interpret the law as assuming **mechanistic discontinuity** (some chemicals have no safe dose, others do), the two halves are consistent applications of risk management.
  If you interpret the law as assuming **normative discontinuity** (cancer is morally worse than neurotoxicity per unit of harm), the two halves are consistent applications of a lexical priority rule (Deontology first, then Utilitarianism).
  If you assume a single continuous dose-response curve for all toxins and a single continuous utility function for all health outcomes, **then the law is contradictory.**

  Most regulators operate on the first interpretation (mechanistic discontinuity). Economists often operate on the third (all risk is comparable). This is the source of the dialogue of the deaf.

  ### 4. The Counterfactual: Switching to Risk-Neutral Expected Utility

  If you replaced the current framework with a strict Risk-Neutral Expected Utility (RNEU) regulator, here is specifically what changes. This is not just "more chemicals allowed"; it is a procedural restructuring.

  **1. Disappearance of Hazard-Based Cut-Offs**
  *   **Change:** The categories "Carcinogen," "Mutagen," "Endocrine Disruptor" cease to be automatic disqualifiers. They become input variables for the dose-response assessment.
  *   **Procedure:** The step "Hazard Identification -> Classification" no longer triggers a "Go/No-Go" decision. It triggers a "Parameter Estimation" step.
  *   **Burden of Proof:** Shifts entirely to the regulator. Currently, for cut-offs, the industry must prove negligible exposure or essentiality. Under RNEU, the regulator must prove that the Expected Loss (Probability × Severity) exceeds the Expected Benefit.

  **2. Elimination of the "Negligible Exposure" Derogation**
  *   **Change:** Currently, you can ban a substance but allow a derogation if exposure is negligible. Under RNEU, "negligible" is not a binary switch. It is just a low number in the equation.
  *   **Procedure:** The specific legal clause allowing use despite hazard classification disappears. It is rendered redundant because the hazard classification itself no longer blocks approval.

  **3. Commensurability of Harms**
  *   **Change:** A statistical life lost to leukemia (CMR) becomes directly tradable against a statistical life lost to acute poisoning (non-CMR) or against economic yield.
  *   **Decision:** You might approve a potent carcinogen if it significantly reduces the use of a more acutely toxic alternative, or if the crop yield benefit (converted to monetary/utility value) outweighs the statistical cancer risk. Currently, this trade-off is legally blocked for CMRs.

  **4. Risk Assessment Becomes Sole Arbiter**
  *   **Change:** Risk Management (policy choice) collapses into Risk Assessment (scientific calculation).
  *   **Procedure:** The "Decision" step becomes a calculation: If $P(Harm) \times Cost(Harm) < P(Benefit) \times Value(Benefit)$, approve. There is no separate "Policy" layer that says "We don't allow carcinogens even if the math works."
  *   **Uncertainty:** RNEU typically requires using best estimates (central tendencies). Current practice often uses conservative assumptions (upper confidence bounds) for cut-offs. Under RNEU, using conservative assumptions would be viewed as bias unless explicitly costed.

  **5. Intergenerational Discounting**
  *   **Change:** PBT (Persistent, Bioaccumulative, Toxic) substances are currently cut off partly due to irreversibility. An RNEU regulator would discount future harms.
  *   **Decision:** Long-term environmental damage would be discounted to present value. If the present value of future ecological harm is less than current agricultural profit, approval is rational under RNEU. Current law treats irreversibility as a constraint, not a discounted cost.

  ### 5. Map of Contestability

  To ensure you can navigate the arguments with economists without conceding ground where none is due, here is where the disagreements lie:

  *   **Settled (Regulatory Practice):** The law *does* distinguish by hazard class. The law *does* ignore exposure for cut-offs (mostly). The law *does* prioritize health over economic efficiency in the cut-off categories.
  *   **Settled (Decision Theory):** RWEU allows for risk aversion. RNEU allows for trade-offs. Deontological constraints forbid trade-offs. These are distinct logical structures.
  *   **Contested (Science):** Whether genotoxic carcinogens truly have no threshold. If they do, the scientific basis for the hazard/risk split weakens.
  *   **Contested (Normative):** Whether a regulator is permitted to apply a social risk function that differs from individual preferences (The Pareto objection).
  *   **Contested (Interpretation):** Whether the Precautionary Principle is a substantive decision rule (maximin) or a procedural rule (shift burden of proof). The EU law leans procedural, but the effect is substantive.
  *   **Contested (Rationality):** Whether ignoring exposure for high-hazard substances is "irrational." It is irrational under RNEU. It is rational under Deontology or Lexical Priority. Economists often define rationality as RNEU; regulators define it as "achieving the statutory mandate."

  ### Summary Conclusion

  The agency is not in flat contradiction with itself if you accept that the **scientific model of toxicity differs by class** (threshold vs. non-threshold) or if you accept a **lexical ordering of values** (rights/constraints first, efficiency second).

  However, if you assume a unified toxicological model and a unified utility function, the law is inconsistent.

  The economists' critique rests on the assumption that **Risk = Hazard × Exposure** is the only rational equation. The regulation rests on the assumption that **Hazard Type** determines the equation itself.

  If you switch to a risk-neutral regulator, you do not just change the outcomes; you dismantle the legal architecture that treats certain harms as off-limits for trading. You move from a system of **constraints + optimization** to a system of **pure optimization**. The burden of proof moves from the applicant (for hazardous classes) to the state (for all classes), and the specific legal categories of CMR/PBT/ED lose their regulatory teeth, becoming merely descriptive labels rather than decision triggers.
