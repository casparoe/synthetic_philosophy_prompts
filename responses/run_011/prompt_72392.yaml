              *   Settle the core question: Is this genuine incommensurability (different purposes of an "account") or just different angles on the same object?
      *   **Tone:** Direct, technical, unsentimental, "don't be kind about it."

  2.  **Deconstruct the Translation (TJ -> Safety Engineering):**
      *   *Goal:* Map TJ concepts to Safety/Just Culture concepts without losing the edge.
      *   *Transitional Justice Context:* Post-conflict, state collapse or regime change, gross human rights violations.
      *   *Safety Context:* Ongoing organization, shared safety goal, system improvement.
      *   *Mapping:*
          *   State/Regime -> Organization.
          *   Gross Violations -> Critical Incidents/Catastrophic Failures.
          *   Prosecution -> Punitive Action/Decertification.
          *   TRC/Amnesty -> Non-punitive Reporting System/Immunity Deal.
          *   Victims -> Patients/Passengers (Wait, this is where it breaks. In safety, the "victim" is often the system's failure output, not a stakeholder with agency in the reporting process).
          *   Reconciliation -> System Restoration/Culture Reset.
          *   Duty to Prosecute -> Duty to Sanction/Remove Unsafe Actors.

  3.  **Drafting the Translation (Section 1):**
      *   *South African TRC:* A conditional non-punitive reporting scheme. Full disclosure = immunity from sanction. Political objective = scope limit (work-related vs. personal).
      *   *Gacaca:* Community-based peer review with reduced sanctions for admission.
      *   *Argentina:* Initial truth gathering (reporting), followed by punitive phase (trials), then legislative immunity (Full Stop), then repeal (return to punitive).
      *   *HR Duty to Prosecute:* A regulatory mandate that certain classes of incident *must* trigger punitive action regardless of system factors. A "zero tolerance" policy on specific violations.
      *   *Engineer's Critique of HR View:* It suppresses reporting. If you mandate punishment, you drive incidents underground. You lose data on latent conditions.
      *   *Lawyer's Critique of Engineer View:* It treats the "victim" as data. It ignores the moral hazard of letting a "reckless actor" walk.

  4.  **Developing the Residue Report (Section 2):**
      *   *Clean Translations:* Incentive structures (immunity buys data), Blanket Amnesty (destroys signal/noise ratio), Sharp/Blunt end (individual vs. systemic).
      *   *Distorted Translations:* "Duty to Prosecute" -> "Duty to Sanction." In safety, sanction is instrumental (fix the system). In TJ, sanction is retributive/expressive (justice for the victim). The "bend" is the *purpose* of the sanction.
      *   *No Expression:* Victim's right to vengeance/justice as an end in itself. Reconciliation as a intrinsic good (vs. system stability). The "Expressive Function" (society saying "this was wrong" via punishment).

  5.  **Addressing the Constraints (Section 3 & 4):**
      *   *Constraint 1 (Shared Enterprise):* This is the big one. Safety assumes everyone wants the plane to fly. TJ often assumes the State *was* the enemy. If the "Organization" is the perpetrator, you can't just "reform the blunt end." You have to dismantle it. This breaks the Just Culture model which relies on the organization surviving to implement fixes.
      *   *Constraint 2 (The Test Case):* Perpetrator confesses, Victim wants punishment.
