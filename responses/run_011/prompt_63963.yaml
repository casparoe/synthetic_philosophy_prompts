prompt: |-
  For about eleven years I have kept a notebook of predictions about matters my neighbours must act on: whether a creek will overtop the low road within a day, whether a late frost will take the blossom, whether a repaired culvert will hold through the spring. I have no training in statistics or in philosophy and I have read nothing on the subject, so please treat the practice I am about to describe as my own invention rather than assuming I am using someone else's vocabulary.

  From the start I have declined to write down a single number. I write two: the lowest chance I can honestly defend and the highest, and I treat everything between them as still open. When new information bears on a prediction I revise both ends, and I do not allow one end to cross the other. Most of the time the band narrows, which feels like learning. But on three or four occasions it has *widened* after I received information, and I have never satisfied myself as to whether that is a flaw in my method to be patched out, or an honest report that the news told me less than I hoped while simultaneously making me less sure of everything nearby. One such case is described below.

  I now coordinate a volunteer group of nine that advises the county on whether to pre-position sandbags, close low-water crossings, and open the shelter. We meet for twenty minutes on a Tuesday, nobody in the group has mathematics beyond arithmetic, and the dispatcher who signs off will accept only a yes or a no. We also publish a record of how often we were right, and that record currently demands single numbers from us, which feels like a betrayal of the whole method.

  What I want from you is a procedure this group could actually run each week, in ordered steps: how wide a band we may honestly write down and when we must widen it rather than pretend to precision; what to do when two members give bands that do not overlap at all; how to choose an action when the low end of the band says stand down and the high end says act; at what point we are obliged to collapse the band into one number, and what number that should be; and whether a band can be scored afterwards for accuracy at all, or whether the act of scoring quietly forces us back to a single figure. Please mark plainly which steps are measurements and which are merely our choosing how cautious to be, and tell me where the procedure will misfire.

  Then run it on three cases. First: a band of 0.25 to 0.70 that the creek tops the road within thirty-six hours, where closing the road costs a forty-minute detour for the school run and six hours of county labour, and leaving it open risks a vehicle in moving water. Second: two members report 0.1 to 0.4 and 0.5 to 0.8 on the same frost, and neither will move. Third, the widening case: we held 0.3 to 0.5 on a freeze, then took a reading from a station whose reliability we have never managed to pin down and whose error has in the past run in both directions, and after revising we were left holding 0.15 to 0.75 — should we act on a band that got wider because of information, and if so on which end?

  At least one of these should come out in a way I will dislike; I would rather be told that now. Finally, if what I have stumbled into has names — the widening, the two-number habit, the rules for acting from one — give me the names, since I need words to use in front of nine people. Do not give me a reading list, citations, or authors to look up; I want terminology, not homework.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** A practical, experienced community coordinator (11 years of observation). No formal training in statistics or philosophy. Values honesty, precision, and practical utility over theoretical purity. Skeptical of "single numbers" but constrained by bureaucratic requirements (county dispatcher, public record).
      *   **The Problem:** They use interval estimates (low/high probability) instead of point estimates. They need a formalized procedure for a 9-person volunteer group to aggregate these intervals, make decisions (Yes/No), handle conflicts, handle widening intervals, and score accuracy without betraying their method.
      *   **Specific Requests:**
          1.  A step-by-step procedure (measurements vs. choices).
          2.  Rules for band width, non-overlapping bands, decision thresholds, collapsing to a single number, and scoring.
          3.  Identification of failure points ("where the procedure will misfire").
          4.  Application to three specific cases (Creek, Frost/Conflict, Freeze/Widening).
          5.  Honesty about unpleasant outcomes ("At least one... should come out in a way I will dislike").
          6.  Terminology/Naming (give names to the concepts without academic homework).
          7.  Constraint: No reading lists, citations, or authors. Just terminology.

  2.  **Deconstruct the Method (The "Invention"):**
      *   The user is describing *Probability Intervals* or *Credible Intervals* (Bayesian) but expressed practically.
      *   The "widening" phenomenon is real (uncertainty increases with ambiguous data).
      *   The conflict (non-overlapping bands) suggests divergent priors or interpretation of evidence.
      *   The decision problem is a *Cost-Benefit Analysis* under uncertainty.
      *   The scoring problem is *Calibration* vs. *Resolution*.

  3.  **Drafting the Procedure (Step-by-Step):**
      *   *Goal:* Keep it practical for 9 volunteers with arithmetic skills.
      *   *Step 1: Individual Estimation.* (Measurement of belief). Keep the low/high.
      *   *Step 2: Aggregation.* How to combine 9 bands? Average the lows, average the highs? Or take the union (min low, max high)? Union is safer/honest. Average is more decisive. Let's suggest the *Union* for honesty, but the *Median* for decision making. Actually, for a group, the "Consensus Band" (Min Low to Max High) captures total uncertainty.
      *   *Step 3: Handling Conflict.* If bands don't overlap, uncertainty is high. Widen the consensus band to cover both.
      *   *Step 4: Decision Rule.* This needs to be based on *Expected Loss*. $P \times Cost_{Fail} > Cost_{Action}$. Since we have a band, we need a threshold. If Low > Threshold -> Act. If High < Threshold -> Don't Act. If Threshold is inside Band -> Ambiguous.
      *   *Step 5: Collapsing.* Only when forced (dispatcher). Use the *Expected Value* (Midpoint) or the *Precautionary End* (Low or High depending on risk). Given the stakes (safety), the Precautionary End (High probability of danger) is usually better, but the user asks for "what number." The midpoint is the mathematical expectation.
      *   *Step 6: Scoring.* Can you score a band? Yes, using *Interval Scoring Rules*. But simply: Did the event happen? Was it inside the band? A band of 0-1 is always right but useless. A band of 0.49-0.51 is precise but often wrong. Need a penalty for width.
      *   *Failure Points:* Groupthink, anchoring, bureaucratic pressure to narrow bands artificially.

  4.  **Developing the Terminology:**
      *   Two-number habit: *Probability Bounds* or *Confidence Interval* (though CI has specific statistical meaning, colloquially it fits). Let's use *Belief Band*.
      *   Widening: *Uncertainty Inflation* or *Information Dilution*. Let's call it *Dilative Evidence*.
      *   Scoring: *Calibration Check*.
      *   Decision: *Threshold Crossing*.

  5.  **Running the Three Cases:**

      *   *Case 1 (Creek):* Band 0.25 - 0.70.
          *   Costs: Detour/Labor (Action Cost) vs. Vehicle in Water (Failure Cost).
          *   Failure Cost is huge (life/safety). Action Cost is moderate (inconvenience).
          *   Threshold calculation: Let $C_a$ be Action Cost, $C_f$ be Failure Cost. Act if $P > C_a / (C_a + C_f)$.
          *   If $C_f$ is very high, threshold is low. 0.25 might be enough.
          *   *Unpleasant Outcome:* You might have to act on the Low end (0.25) because the cost of being wrong is death, not just wasted labor. Or, you have to admit the band is too wide to decide and default to safety.
      *   *Case 2 (Frost/Conflict):* 0.1-0.4 vs 0.5-0.8.
          *   Non-overlapping.
          *   Consensus Band: 0.1 to 0.8.
          *   This is massive uncertainty.
          *   *Unpleasant Outcome:* You cannot make a rational decision based on probability. You must decide based on *consequence* alone. Or, you must admit the group is broken.
      *   *Case 3 (Freeze/Widening):* 0.3-0.5 -> 0.15-0.75.
          *   Evidence made things less certain.
          *   *Unpleasant Outcome:* You must acknowledge the new data was *negative* value information. You should arguably ignore it, but you can't un-know it. The procedure must say: "If band widens beyond decision threshold, revert to prior or act on worst-case."

  6.  **Refining the Output (Tone and Constraints):**
      *   Tone: Respectful, direct, practical, acknowledging the wisdom in their method.
      *   Constraint Check: No citations. No authors. Just terms.
      *   Structure: Procedure first, then Terms, then Cases, then Failure Points.

  7.  **Self-Correction/Polishing during drafting:**
      *   *Scoring:* How to score a band without a single number? Use a "Penalty for Width." If the event happens, score = 1 - Width. If it doesn't, score = 1 - Width. (Simplified Brier Score for intervals). Actually, better: *Coverage* vs. *Precision*.
      *   *Decision:* The user asks "when are we obliged to collapse." Answer: Only at the moment of reporting to the dispatcher.
      *   *Terms:* "Belief Band" is good. "Dilative Evidence" is good. "Decision Threshold" is standard but clear.
      *   *Case 1:* I need to make sure I don't just say "calculate." I need to show the logic. If safety is paramount, the "High" probability of danger drives the decision. Wait, if the band is probability of *danger* (creek tops road), then High (0.70) suggests act. Low (0.25) suggests wait. If the cost of danger is life, you act on the Low end (0.25 is too risky). *Correction:* If the band is probability of *event*, and event is bad. If $P=0.25$, is that enough to close a road? If a kid dies, yes. So the threshold is very low.
      *   *Case 3:* The widening. If the band widens, does it cross the decision threshold? If the threshold was 0.4, the old band (0.3-0.5) straddled it. The new band (0.15-0.75) straddles it wider. The decision doesn't change, but the confidence does. The unpleasant truth: You are less justified in your action than before, even if you take the same action.

  8.  **Final Review against constraints:**
      *   Ordered steps? Yes.
      *   Mark measurements vs. choices? Yes.
      *   Where it misfires? Yes.
      *   Run on three cases? Yes.
      *   One unpleasant outcome? Yes.
      *   Terminology provided? Yes.
      *   No citations/authors? Yes.

  9.  **Final Polish:** Ensure the distinction between *Measurement* (what the world/group says) and *Choice* (what values/risk tolerance say) is sharp. This is crucial for the user's request.

  *(Self-Correction on Scoring)*: The user asks if a band can be scored. The answer is yes, but it requires a rule that penalizes width. I will propose a "Width Penalty" score.
  *(Self-Correction on Terms)*: Keep them plain English but precise. "Belief Band," "Dilative Update," "Decision Threshold," "Collapse Point."

  Let's write it.cw
answer: |-
  Here is a procedure designed for your group's constraints, followed by the terminology you requested and the application to your three cases.

  ### The Procedure: The Belief Band Protocol

  **Step 1: Individual Estimation (Measurement)**
  Each member writes down their *Belief Band*: a Low and a High probability (0.0 to 1.0).
  *   **Rule:** You may not write a single number. If you feel certain, your band must still have a width of at least 0.05 to acknowledge human fallibility.
  *   **Measurement:** This records your internal state of certainty.
  *   **Choice:** None. Do not adjust to match others.

  **Step 2: Aggregation (Measurement)**
  Collect the nine bands. Determine the *Group Band*.
  *   **Low:** The lowest "Low" submitted by any member.
  *   **High:** The highest "High" submitted by any member.
  *   **Reasoning:** This captures the full spread of uncertainty in the room. Averaging hides dissent; spanning reveals it.
  *   **Measurement:** This records the group's collective uncertainty.

  **Step 3: Conflict Check (Measurement)**
  Check if the individual bands overlap.
  *   **Rule:** If any two members submit bands that do not touch (e.g., one says 0.1–0.3, another says 0.6–0.8), flag this as a *Disjoint*.
  *   **Action:** A Disjoint indicates the group is not looking at the same evidence or is using different assumptions. The Group Band stands, but a note is attached: "Fundamental Disagreement."

  **Step 4: The Decision Threshold (Choice)**
  Before looking at the probabilities, the group must agree on the *Decision Threshold*. This is not a probability; it is a ratio of costs.
  *   **Formula:** $\text{Threshold} = \frac{\text{Cost of Action}}{\text{Cost of Action} + \text{Cost of Failure}}$
  *   **Example:** If closing the road costs \$1,000 (labor/detour) and leaving it open risks \$100,000 (rescue/lawsuit/life), the threshold is $1,000 / 101,000 \approx 0.01$. You act if the chance of danger is above 1%.
  *   **Choice:** This step is purely ethical and economic. It defines how cautious you are.
  *   **Measurement:** None.

  **Step 5: The Action Rule (Choice)**
  Compare the Group Band to the Decision Threshold.
  *   **Case A (Act):** If the **Low** end of the Band is higher than the Threshold. (Even the optimists think it's likely enough).
  *   **Case B (Stand Down):** If the **High** end of the Band is lower than the Threshold. (Even the pessimists think it's unlikely).
  *   **Case C (Ambiguous):** If the Threshold falls *inside* the Band.
  *   **Rule for Ambiguity:** If you are in Case C, you must act according to the *Precautionary Principle*. If the failure involves safety (life/property), you act as if the **High** end is the truth. If the failure involves only money or inconvenience, you act as if the **Low** end is the truth.
  *   **Choice:** This is where you choose safety over efficiency, or vice versa.

  **Step 6: The Collapse (Choice)**
  You are obliged to collapse the band into a single number only when handing the recommendation to the dispatcher.
  *   **Rule:** Do not average the band. Report the end of the band that justifies the Action chosen in Step 5.
  *   **If Acting:** Report the **Low** end. (This tells the dispatcher: "We are acting even on the most conservative estimate.")
  *   **If Standing Down:** Report the **High** end. (This tells the dispatcher: "We are safe even on the most pessimistic estimate.")
  *   **Choice:** This is a communication strategy to protect the group from accusations of hysteria or negligence.

  **Step 7: Scoring (Measurement)**
  You can score a band, but you cannot use a simple Right/Wrong count. You must use a *Width-Penalty Score*.
  *   **Formula:** If the event happens, Score = $1 - (\text{High} - \text{Low})$. If the event does not happen, Score = $1 - (\text{High} - \text{Low})$.
  *   **Adjustment:** If the event falls *outside* your band (you were wrong), Score = $-1$.
  *   **Meaning:** A band of 0.0–1.0 always contains the truth but scores 0. A band of 0.4–0.5 is precise; if right, it scores 0.9. If wrong, it scores -1.
  *   **Measurement:** This measures the quality of your estimation, not just your luck.

  ### Where This Procedure Will Misfire

  1.  **The Bureaucratic Squeeze:** The dispatcher or county officials will eventually demand to know why your "single number" changes every week or why your band is so wide. They will pressure you to narrow the band artificially to look more competent. This corrupts Step 1.
  2.  **The Paralysis of Ambiguity:** In Case C (Ambiguous), if the costs are balanced, the Precautionary Principle forces a decision, but the group will feel uneasy. Repeatedly acting on "High" estimates for safety that don't materialize will erode public trust (the "Boy Who Cried Wolf" effect).
  3.  **The Disjoint Trap:** If Step 3 (Conflict Check) happens often, it means your group lacks a shared mental model. No amount of math will fix nine people looking at nine different realities. You will need to stop predicting and start training.

  ### Terminology

  You asked for names for the things you have stumbled into. Use these words in your meetings:

  *   **Belief Band:** Your two-number habit. It distinguishes your method from a "Point Estimate" (a single number).
  *   **Dilative Update:** The widening case. When new information makes you *less* certain rather than more. This is a valid state, not a flaw.
  *   **Decision Threshold:** The point where the cost of acting equals the cost of waiting.
  *   **Collapse Point:** The moment you convert the Band to a single number for the dispatcher.
  *   **Coverage Score:** The scoring method that penalizes wide bands.

  ---

  ### Application to Your Three Cases

  #### Case 1: The Creek (0.25 to 0.70)
  *   **Context:** Action cost is moderate (detour/labor). Failure cost is extreme (vehicle in moving water/potential death).
  *   **Threshold:** Because safety is involved, the Cost of Failure is effectively infinite compared to labor. The Decision Threshold is near 0.05.
  *   **Analysis:** The Group Band is 0.25 (Low) to 0.70 (High).
  *   **Comparison:** The Low end (0.25) is well above the Threshold (0.05).
  *   **Decision:** **Act (Close the road).**
  *   **Collapse:** Report **0.25** to the dispatcher.
  *   **Reasoning:** You do not need to be sure the water will rise. You only need to be sure the risk exceeds the cost of the detour. Even your most optimistic member thinks the risk is 25%, which is too high for human safety.
  *   **Outcome:** You close the road. If the creek stays dry, you wasted labor. If it rises, you saved a life. The procedure holds.

  #### Case 2: The Frost (Conflict: 0.1–0.4 vs 0.5–0.8)
  *   **Context:** Two members, non-overlapping bands. Neither will move.
  *   **Aggregation:** The Group Band becomes 0.1 (Lowest Low) to 0.8 (Highest High).
  *   **Analysis:** This is a *Disjoint*. The width is 0.70.
  *   **Threshold:** Let's assume protecting blossoms costs money (sprayers/labor) and failure costs the crop. Threshold might be around 0.40.
  *   **Comparison:** The Threshold (0.40) is inside the Band (0.1–0.8). This is *Case C (Ambiguous)*.
  *   **Decision:** Since this is economic (crop loss vs. labor), not immediate life safety, you apply the Precautionary Principle for *economic survival*. If the farm cannot survive a loss, act on the High. If the labor cost bankrupts you, act on the Low. Assuming the county can absorb labor but not total crop failure: **Act (Protect).**
  *   **Collapse:** Report **0.1** to the dispatcher. (Why? Because you are acting despite the lowest estimate suggesting low risk. This highlights the severity of the consequence, not the probability).
  *   **Outcome:** **You will dislike this.** The procedure forces you to admit that your group is fundamentally broken. A band of 0.1 to 0.8 is an admission of ignorance. By reporting 0.1 while acting, you are telling the dispatcher, "We are acting on a 10% chance because we cannot agree." This exposes the group's lack of consensus. It is honest, but it undermines your authority.

  #### Case 3: The Freeze (Widening: 0.3–0.5 becomes 0.15–0.75)
  *   **Context:** *Dilative Update*. Information made you less sure.
  *   **Analysis:** Old Band width = 0.20. New Band width = 0.60.
  *   **Threshold:** Assume 0.40.
  *   **Comparison:**
      *   Old Band (0.3–0.5) straddled the threshold. Ambiguous.
      *   New Band (0.15–0.75) straddles the threshold *wider*. Still Ambiguous.
  *   **Decision:** The decision (Act/Don't Act) does not change if you follow the Precautionary Principle, but your *justification* weakens.
  *   **Should you act on the widened band?** Yes, but you must acknowledge the data source is unreliable.
  *   **Which end?** If acting for safety, use the **High (0.75)** to justify the fear. If reporting to the dispatcher, use the **Low (0.15)** to show you are not panicking.
  *   **Outcome:** **You will dislike this.** The procedure forces you to record that the new information had *negative value*. In Step 7 (Scoring), this update lowers your Coverage Score because the band widened. You are penalized for receiving news. This feels unfair, but it is correct: information that increases confusion is a liability, not an asset. You should note in your log: "Station X data rejected for future use due to Dilative Update."

  ### Summary of Unpleasant Truths

  1.  **In Case 2**, the procedure exposes that your group does not share a reality. It forces you to report a probability (0.1) that contradicts half your team, simply to justify a safety action. It prioritizes safety over consensus.
  2.  **In Case 3**, the scoring system punishes you for receiving confusing news. It will look like your performance dropped the day you tried to be more informed.
  3.  **In General**, the "Collapse" step requires you to speak two languages: the language of uncertainty (to your group) and the language of false precision (to the dispatcher). You will feel like a liar every Tuesday.

  This is the cost of honesty in a system that demands certainty. The procedure protects your conscience, but it does not protect your reputation.
