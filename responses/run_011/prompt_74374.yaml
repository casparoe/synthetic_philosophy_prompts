      *   (8) **Old Evidence:** Perihelion data $D$ had $P(D) < 1$. GR confirms via standard updating. (Implies Strict Conditionalization is possible *if* $P(D)$ rises, or JC is used).
      *   (9) **Subjective Priors / Objective Rule:** Coherence constrains start, JC+Rigidity constrains move.

