answer: |-
  **Seminar Room 304. 4:15 PM.**

  **Elena:** (Transworld Identity Theorist)
  **Marcus:** (Counterpart Theorist)
  **Professor:** (Moderator, silent for this exercise)

  **Elena:** The case is stark, Marcus. In *w1*, we have a psychological duplicate with alien origins. In *w2*, we have an origin duplicate with an alien psychology. The seminar wants a principled account, not a shrug. On my view, the answer is immediate. *w2* contains Vera. *w1* contains a distinct person who merely resembles her. Vera is essentially constituted by her origin—her zygote, her parents. That isn't an intuition I'm appealing to; it's the metaphysical ground of her transworld identity. Without that specific material history, you don't have Vera, you have a counterpart.

  **Marcus:** And there you beg the question. You assume transworld identity to justify the origin essentialism that secures transworld identity. On my view, Vera is world-bound. The question isn't "Who is Vera?" in *w1* or *w2*, but "Which individual represents Vera for the purposes of our modal claim?" Usually, I'd say that's context-sensitive. If we're asking about her career, the cellist in *w1* is the relevant counterpart. If we're asking about her biological lineage, the apiarist in *w2* is. But the seminar's stipulation—the functional constraint—blocks this. I can have at most one counterpart per world.

  **Elena:** Precisely. So, which one is it? You owe us a weighting principle. If you say *w1*, you deny that origins matter. If you say *w2*, you've adopted my origin essentialism. But if you adopt origin essentialism without transworld identity, what work is the "counterpart" relation doing? It looks like you're just saying "Vera exists in *w2*" but refusing to use the word "exists."

  **Marcus:** It's doing the work of preserving the logic of world-bound individuals. I avoid your commitment to *haecceities*—primitive "thisnesses" that hop across worlds. I don't need to say Vera *is* the apiarist. I say the apiarist is sufficiently similar to Vera in the *right ways* to be her unique representative. Given the functional constraint, I must privilege one dimension of similarity. I'll privilege origin. Why? Because biological continuity is a more stable anchor for re-identification across worlds than psychological states, which are notoriously fission-prone. So, *w2* is the counterpart. *w1* is not.

  **Elena:** You've just conceded the ground. You've admitted that for the functional constraint to work, there must be a *privileged weighting* of properties. Origin trumps psychology. That isn't context-sensitive similarity anymore; that's essence. Now we move to the second question. Does this constraint rescue you from the standard objections? Lewis usually allows that you might have two counterparts in one world, which lets you say "Vera could have been two people." The constraint forbids this. It forces you to say Vera *must* have the properties of her unique counterpart.

  **Marcus:** It forces me to say that relative to the semantics of this seminar, "Vera" picks out a unique representative. It doesn't mean Vera *metaphysically* couldn't have been the cellist in *w1*. It means that in this context, we are tracking her biological lineage.

  **Elena:** But truth is not relative to seminar stipulations. If the sentence "Vera could have been a cellist" is true, it needs a truthmaker. If the functional constraint rules out the *w1* cellist as a counterpart, then on your theory, that sentence is *false*. You aren't just changing the context; you're changing the truth conditions. By accepting the function, you've turned the counterpart relation into a selection rule for transworld identity. You're selecting which individual *is* Vera. You're a transworld identity theorist in denial. You have the essentialism without the identity.

  **Marcus:** That's a strong charge. I deny it. The selection rule is semantic, not metaphysical. It tells us how to interpret *de re* modal talk, not how the world is constructed. I maintain the metaphysical picture: world-bound individuals. The function is just a tool to map our talk onto that picture without contradiction.

  **Elena:** Let's press the third question, then. This is where your semantic tool breaks. Identity is all-or-nothing. I say the apiarist in *w2* is Vera. That's binary. You say the apiarist bears the "counterpart relation" to Vera. But similarity is a matter of degree. Matter is shared 100% in *w2*, psychology 0%. In *w1*, matter is 0%, psychology 100%. How do you get a binary, functional outcome—*one* counterpart, *not* the other—from a graded relation without an arbitrary cutoff?

  **Marcus:** I admit the cutoff is sharp, but so is yours. You draw the line at the zygote. I draw the line at the weighting of origin over psychology.

  **Elena:** No, the difference is foundational. I appeal to *primitive identity*. It is a brute fact that Vera is the apiarist. It's not analyzed in terms of similarity. You, however, analyze modality in terms of similarity. Similarity is inherently vague. By imposing a functional constraint, you are forcing a sharp boundary onto a vague relation. You have to say that a 51% overlap in origin matters, but 49% does not, or that origin matters *infinitely* more than psychology. Where does that weighting come from? If it's from our intuitions, it's vague. If it's from a rule, it's arbitrary. I have a metaphysical ground: *haecceity*. You have a semantic stipulation masking a Sorites paradox.

  **Marcus:** I can meet that. I can say the weighting isn't arbitrary; it's determined by the natural kinds involved. Vera is a human organism. Human organisms are individuated by biological origin, not psychological continuity. That's a fact about the kind, not a semantic rule. So the cutoff isn't arbitrary; it's grounded in the metaphysics of biology.

  **Elena:** (Leaning forward) There it is. You've grounded it in the metaphysics of the *organism*. But Vera is a *person*. We are making *de re* claims about Vera, the cellist, the person with memories. If you ground the counterpart relation in biological kind, you are saying Vera's *personal* identity is fixed by biology. That's my view. But if you say that, you must accept that the individual in *w2* is numerically identical to Vera. Why? Because if the biological origin is what fixes the reference across worlds, and the origin is identical, then the referent is identical.

  **Marcus:** Not necessarily. Reference fixing isn't identity. I can fix the reference of "Vera" by her origin, but still maintain the individual in *w2* is a distinct concrete particular that resembles her.

  **Elena:** But why posit the distinct particular? What work is it doing? If the origin fixes the reference, and the properties at *w2* make the modal claim true, and you admit origin is the essential weighting... you have all the machinery of transworld identity. The only thing you're withholding is the identity relation itself. You're positing a distinct individual *c* in *w2* such that *c* has all of Vera's essential properties, originates from Vera's parents, and is the truthmaker for "Vera is possibly an apiarist," but *c* is not Vera. That is a distinction without a difference. You've bought the cow but refused the milk. The functional constraint forces you to pick the "real" Vera at each world. If you pick based on essence, you are a transworld identity theorist. If you pick based on vague similarity, you violate the constraint. You can't have both.

  **Marcus:** (Pauses) I... I grant that the functional constraint tightens the noose. If I must select a unique counterpart based on a fixed weighting of essential properties, the "counterpart" label becomes thin. However, I maintain the logical benefit. I avoid the paradoxes of contingent identity. If *w2* Vera and Actual Vera are identical, and *w2* Vera is necessarily an apiarist (in *w2*), do we get contradictions?

  **Elena:** Not if we distinguish properties *at* a world from properties *of* a world. But look at the gain I've made. You started with a theory designed to handle vagueness and context-sensitivity. The seminar's constraint stripped that away. To answer Question 1 principledly, you had to adopt origin essentialism. To answer Question 2, you had to admit the function dictates truth conditions, not just interpretation. And now, on Question 3, you cannot explain the sharp cutoff on similarity without appealing to the very essence I posit. You've been forced to adopt my metaphysics (essentialism) while retaining your ontology (world-bound individuals), which renders your ontology idle. If the apiarist has Vera's essence, why isn't it Vera? The only answer is "because I say so." That's not metaphysics; it's terminological stubbornness.

  **Marcus:** (Sighs) You've cornered me on the functional constraint. I can maintain world-bound individuals, yes, but if I accept the constraint and the demand for a principled weighting, I concede that the counterpart relation mimics identity so closely that the theoretical cost of denying transworld identity outweighs the benefit. I cannot explain the sharp cutoff of the function without a primitive essence, and if I have a primitive essence, the "distinct individual" claim is unmotivated.

  **Elena:** Then the ground is mine. The functional constraint doesn't rescue Counterpart Theory; it reveals that without the flexibility of multiple counterparts, Counterpart Theory collapses into Transworld Identity with an extra step.

  **Marcus:** I concede the point on the constraint. Without the ability to vary the counterpart relation by context, I lose the explanatory advantage. I am left with essentialism without identity. You have essentialism *as* identity. That is more parsimonious.

  ***

  **Author's Note**

  **Decisive Move:** The decisive exchange occurs in the final section regarding Question 3 (All-or-Nothing vs. Degree). Elena (TWI) successfully argues that the **Functional Constraint** forces Marcus (CT) to impose a sharp cutoff on a relation (similarity) that is inherently vague/graded. To justify this sharp cutoff principledly (as demanded by Question 1), Marcus must appeal to a fixed weighting of properties (origin over psychology). Elena points out that a fixed weighting of properties *is* an essence. Once Marcus admits he relies on a fixed essence to satisfy the constraint, his refusal to accept transworld identity becomes unmotivated. He is positing a distinct individual with Vera's essence as the truthmaker for modal claims about Vera. Elena argues this is ontologically profligate compared to simply identifying the individuals. Marcus concedes that under the specific stipulation of the seminar, his view becomes a "notational variant" of TWI but with less parsimony.

  **Liberties and Contested Readings:**
  1.  **The Functional Constraint:** David Lewis's original Counterpart Theory explicitly rejects the idea that the counterpart relation must be functional (one-to-one or one-to-many is allowed). The seminar's stipulation is a significant deviation from standard Lewisian doctrine, designed to test the theory's limits. Lewis would likely reject the stipulation rather than concede Elena's point.
  2.  **Origin Essentialism:** Elena's position relies heavily on Kripkean origin essentialism (that biological origin is necessary for identity). This is a contested view in metaphysics; many materialists or psychological continuity theorists would reject the claim that *w2* is automatically Vera.
  3.  **Haecceity:** Elena appeals to "primitive identity" or *haecceity* to solve the vagueness problem. This is often criticized as obscurantism ("brute fact") by counterpart theorists. The dialogue treats this as a strength (explanatory anchor) rather than a weakness, which favors the TWI position more than a neutral observer might accept.
  4.  **Collapse Thesis:** The claim that CT + Functional Constraint = TWI is a known philosophical objection (the "collapse objection"), but it usually relies on the counterpart relation being defined by *overall* similarity. If CT allows the counterpart relation to be defined by *contextual* relevance even within a functional constraint, Marcus might have resisted further. The dialogue assumes the "principled account" demand locks the context.
