  Below where the heavy stone sleeps in the bone,
  A single note holds the dark all alone,
  It moves only when the long ages are gone,
  A pulse in the rock where the light is unknown,
  The ground that must stay where the roots have been sown,
  A low humming thrum in the flesh and the loam,
  The base that bears up what is never yet grown,
  And waits for the weight to be fully its own.

  Between the deep dark and the air of the thought,
  The green pushing up is violently caught,
  A rustle of limbs that are constantly sought,
  The bird in the throat and the beast in the blood,
  A rising of tide in the seasonal flood,
  Where life is a hunger that never is taught.

  I leap from the root and the green and the stone,
  A thought that is severed and stands distinct,
  No chain to the earth, I am finally free,
  Below.

  Here the noise turns to peace in the ear,
  The hunger is heard and the hungry release,
  A mirror of striving that offers a stop,
  The sound is the want and the want is the rest,
  A fire that burns but leaves cold in the body,
  The raw sound heard is the end of the need.

  The monorhyme and long lines of stanza one enact the bass's slow, generative mass. Stanza two's couplets quicken into plant and animal life. Stanza three abandons rhyme for the melody's free intellect, returning to the first word to show resolution as new departure. Stanza four breaks the hierarchy to address the listener, stating the paradox: hearing the sound of desire quiets desire, without solving the tension. Line lengths slow and accelerate to match the voices. The final stanza refuses consolation.
