answer: |-
  In the architecture of the Bretton Woods system, the "stamp on the coin" corresponds to the United States Treasury's guarantee of convertibility at $35 per ounce, which imbued the paper dollar with the substance of gold. The "compact among exchangers" is the international treaty agreement itself, wherein allied nations pegged their currencies to the dollar rather than directly to bullion, trusting the American guarantee as a proxy for the metal. The party that "changes the currency" is not a collective of merchants or a neutral magistrate, but the US Executive Branch acting unilaterally; Nixon's suspension of convertibility was a sovereign alteration of the convention without the consent of the other parties to the compact, effectively rewriting the terms of the measure while the exchange continued.

  Aristotle's account in *Nicomachean Ethics* V.5 posits money as a measure that makes unlike things commensurable by standing proxy for "need" (*chreia*). In the Bretton Woods era, the dollar performed this function globally, allowing disparate national economies to commensurate their goods through a single standard. However, the ontological status of this standard is clarified in *Politics* I.9, where Aristotle distinguishes between money by nature (commodity) and money by convention (*nomos*). He reports the view that money is "nonsense, and nothing by nature but entirely a convention," noting that it becomes worthless when users change the currency. While Aristotle reports this as an opinion held by others, his own considered position aligns with the conventionalist view: money is a tool adopted because natural necessaries are not readily portable, but it remains dependent on the law and the agreement of users. The Nixon Shock validates Aristotle's suspicion that such money is vulnerable to political will; when the US changed the convention, the "nature" of the dollar shifted instantly from a gold-claim to a fiat token.

  This machinery bites most sharply on the moral psychology of the episode. Aristotle warns against *chrematistike* (wealth-getting) which has no natural limit, contrasting it with natural acquisition (*oikonomike*) bounded by the needs of the household or polis. The Triffin Dilemma is essentially a structural manifestation of this unlimited appetite: the global system required the US to run deficits indefinitely to supply liquidity, driving expansion beyond the natural limit of the gold stock. The collapse occurs precisely where Aristotle predicts: when the convention is revised by those controlling the stamp to serve unlimited acquisition (liquidity growth) rather than natural exchange. The unilateral revision exposes the measure to the power of the hegemon, confirming Aristotle's insight that conventional money is politically fragile.

  However, the framework falls silent or misdescribes where the episode exceeds the *polis*-scoped horizon. Aristotle has no concept of a money stabilized by managed quantity rather than commodity backing; he assumes that once the commodity link is severed, the convention risks becoming "worth nothing." The persistence and stability of the dollar as a fiat reserve currency post-1971 is an phenomenon his physics of money cannot accommodate without revision. Furthermore, he lacks a theory of the price level or balance of payments; he cannot conceptualize a "world reserve currency" because his economics are embedded in the reciprocal justice of a specific political community, not a global hegemony. He has nothing to say about inflation targeting or central bank independence, and thus cannot explain why the currency did not collapse into worthlessness despite the change.

  Verdict: ANOMALY
