  The dial sat between them, a brushed-steel arc marked from zero to ten. Outside the observation glass, the subject pool waited, neural shunts ready.

  "Set it at seven," Aris said, hand hovering over the knob. "We allow the full range of human ambition. Grief, yes, but also ecstasy."

  Kael didn't look at the dial. "Three. Anything above a moderate ache risks the lexically forbidden."

  "You're truncating the species," Aris said. "At three, the cap on pleasure is barely distinguishable from contentment. You're trading symphonies for the absence of a migraine."

  "Not a migraine. A specific intensity of suffering that negates value entirely. No quantity of sub-three pleasure outweighs a single instance of three-point-one pain."

  "Then why not zero?" Aris turned, leaning back. "If the presence of above-threshold pain renders a world negative, and non-existence is neutral, your metric licenses an empty world. A world with no subjects is better than a world with one subject suffering at three-point-one. Do you endorse extinction?"

  Kael folded her hands. "I endorse the prioritization of harm avoidance over creation. But we are not choosing between existence and void. We are choosing the texture of an existing population. The 'empty world' objection conflates the evaluative ranking with the choice set. Given that subjects exist, my duty is to ensure their experience does not cross the normative cliff. I am not obligated to delete them to save them from the dial."

  "But the cliff is where I lose you," Aris said. "You treat the threshold as sharp. But phenomenology is vague. There is no fact of the matter between a heavy ache and a mild torment. If you set the dial at three, and a subject feels a pain that is indeterminately three, is it forbidden? If you say yes, you're arbitrary. If you say no, you've admitted the threshold is porous."

  "The vagueness is in the sensation, not the norm," Kael replied. "We set the dial conservatively below the vague zone. We treat the boundary as sharp because morality requires action-guiding precision, even if experience offers gradients. We choose safety over precision."

  "Safety from what?" Aris tapped the glass. "From a discontinuity that doesn't exist. You think torture is lexically worse than dust specks. But ask people: 'Is one moment of torture worse than a billion dust specks?' They hesitate. Then ask, 'Is one moment of torture worse than three dust specks?' They say yes. Their judgments reverse based on scope. That isn't a lexical break; that's a continuous trade-off function where the marginal disvalue of pain accelerates."

  "That's scope neglect," Kael said. "People cannot intuitively aggregate the specks. They focus on the qualitative horror of the torture."

  "It's not neglect," Aris insisted. "It's integration. When the stakes are small, the qualitative difference dominates. When the stakes are large, the quantity dominates. If there were a true lexical break, the quantity would never matter. A trillion specks would never outweigh a second of torture. But people admit that enough trivial annoyances can break a person. The function is continuous, just steep. You're mistaking a steep slope for a cliff."

  "And yet," Kael said, "you hesitate to set the dial at nine. If it's all one scale, why not maximize the range? Why does the thought of allowing level-nine agony make you flinch, if you believe a sufficient amount of level-one annoyance could morally outweigh it?"

  "Because the cost function is non-linear," Aris said. "The disvalue of pain scales exponentially, not linearly. But exponential growth is still continuous. You want to say that at some point, the curve goes vertical. I'm saying it just gets very steep, very fast. Your lexical threshold is a heuristic for this steepness, reified into a metaphysical rule."

  "If it's just steepness," Kael countered, "then you must admit there is some number of dust specks that justifies the torture. You must be willing to sign the order."

  "I am willing to acknowledge the mathematical implication," Aris said. "But I am not willing to ignore the psychological reality that such a trade-off destroys the agent making it. That's not metaphysics; that's capacity."

  "You're retreating to agent-relative constraints," Kael said. "But the device removes the agent from the causation. The dial sets the law. If you believe the trade-off is valid, you should set the dial where the net hedonic tone is highest, even if it allows high pain."

  "No," Aris said. "Because the 'net tone' metric assumes commensurability. I'm arguing that while commensurability holds theoretically, the practical uncertainty of the exchange rate demands a precautionary principle. But that's not your lexical threshold. That's risk aversion."

  "Risk aversion collapses into your position only if the risk is infinite," Kael said. "Which brings me back to the vague zone. If you admit uncertainty about the exchange rate, you must admit uncertainty about where the 'steepness' becomes prohibitive. My lexical threshold is simply the acknowledgment that at some point, the uncertainty resolves into a prohibition. You cannot have it both ways: you cannot claim the scale is continuous while refusing to name the exchange rate."

  Aris looked at the dial. The needle trembled slightly. "I can claim that the exchange rate is context-dependent. The value of a pleasure depends on the history of the subject. A pain suffered for a purpose is different from a pain suffered in vain. Your device flattens history. It treats experience as atomic moments."

  "And yours treats pain as a moral atom," Kael said. "An indivisible unit of badness that poisons the whole."

  "Not poisons," Aris corrected. "Outweighs. There is a difference. One allows for redemption; the other only allows for prevention."

  "Prevention is the only redemption that matters when the nerve is firing," Kael said.

  "Is it?" Aris turned the knob slightly, then stopped. "Here is the question that decides this. You say pain above $T$ is lexically forbidden. I say pain is just a high-cost currency. If we could guarantee that every instance of above-$T$ pain was voluntarily chosen by the subject for a purpose they endorsed, would your threshold still hold? Or does the badness lie in the sensation itself, regardless of the will that bears it?"

  Kael looked at the dial, then at the subjects behind the glass. "If the will chooses it, it is no longer pain in the lexically relevant sense. It is effort."

  "Then we agree," Aris said softly. "The threshold isn't in the sensation. It's in the alienation."

  "Or," Kael said, her hand moving to lock the dial at three, "it's in the fact that alienation is inevitable at that intensity. We cannot know until we turn it."

  "Then we aren't deciding welfare," Aris said. "We're deciding epistemology."

  They stood in silence, the dial unset, the question hanging between the numbers.
