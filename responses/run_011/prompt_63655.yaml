answer: |-
  You are right to suspect that your inconsistency stems from switching targets. You are trying to use one word to describe a demographic event, a political event, and a socioeconomic event simultaneously. When these three diverge, your judgment fractures.

  Here is the diagnosis, the principle, the required sacrifices, and the ruling on your biases.

  ### 1. The Three Questions and the Subject
  Your suspicion is correct. *Collapse* is currently doing the work of three distinct predicates:
  1.  **Demographic:** Did the population die off or disperse significantly?
  2.  **Political:** Did the centralized administrative apparatus lose sovereignty or dissolve?
  3.  **Material/Complexity:** Did the capacity to produce surplus, maintain infrastructure, or sustain specialization degrade?

  Your inconsistency arises because you apply the **Political** definition to the USSR (the state dissolved), the **Material** definition to Rome (pottery got coarser), and the **Demographic/Cultural** definition to the Maya (the people survived).

  **The Subject:** To make the concept usable, the subject of the predicate "collapse" must be **the Polity** (the specific sociopolitical system or state apparatus), not the People, not the Culture, and not the Civilization in the broad ethnic sense.

  *   **States collapse.**
  *   **Populations endure, migrate, or die.**
  *   **Cultures transform, persist, or vanish.**

  If you adopt this subject, you can say "The Classic Maya *polities* collapsed" without implying "The Maya *people* vanished." This resolves the ethical tension immediately.

  ### 2. The Principle
  Here is the precise principle derived from your "rough principle," stripped of the ambiguous "choice" clause which is historically unknowable in most cases.

  **The Principle of Sociopolitical Simplification:**
  > A polity collapses when it undergoes a rapid, significant loss of **sociopolitical complexity**, defined as the capacity to maintain centralized decision-making, social stratification, and economic specialization, such that the system cannot be restored to its prior state without external intervention or total reformation.

  **Tied to your cases:**
  *   **"Rapid, significant loss":** Distinguishes collapse from *decline*. This saves **Egypt (1200 BCE)**. Egypt got poorer, but the Pharaonic apparatus remained intact and functional. It was a decline in power, not a loss of the system's complexity.
  *   **"Centralized decision-making... stratification":** Distinguishes collapse from *dispersal*. This addresses **Cahokia**. If the mound center ceased to function as a centralizer of tribute and labor, the *chiefdom* collapsed, even if the people walked away voluntarily. Your "Exit" verdict is a description of the *population's* response to the *polity's* collapse.
  *   **"Cannot be restored... without reformation":** Distinguishes collapse from *cycle*. This addresses **Rapa Nui**. If the statue culture vanished and was not revived, that specific complex tradition collapsed, even if the population remained stable.

  ### 3. The Verdicts You Must Surrender
  You asked which verdict you should lose rather than complicate the principle. You must surrender two.

  **1. The Classic Maya (Southern Lowlands)**
  *   **Your Verdict:** Not collapse (relocation/reorganization).
  *   **Required Surrender:** **Collapse.**
  *   **Reasoning:** Under the "Polity" subject, the Classic Maya city-states *did* collapse. The dynasties ended, the monumental construction stopped, the hierarchical tribute system vanished in the south. That is a loss of sociopolitical complexity.
  *   **Why:** Refusing to call this a collapse conflates the *State* with the *People*. You can (and should) argue that the *Maya Civilization* did not collapse, but the *Classic Polities* did. Holding out on this protects living descendants from a word, but it obscures the historical reality of what happened to their ancestors' political structures. Precision is more respectful than euphemism.

  **2. Cahokia**
  *   **Your Verdict:** Exit (not collapse).
  *   **Required Surrender:** **Collapse.**
  *   **Reasoning:** If the political order "wasn't worth submitting to," the political order failed to maintain its legitimacy and coercive capacity. That is a failure of the polity. Whether the people died (Mycenae) or left (Cahokia) is a demographic detail; the *system* ceased to function.
  *   **Why:** Your "not chosen" clause is doing too much work. Most collapses involve people voting with their feet (desertion, flight to barbarians). If the center cannot hold the periphery, the center has collapsed.

  **The Verdict You Keep:**
  *   **Egypt (1200 BCE):** Decline. The apparatus held.
  *   **Rome (West):** Collapse. The imperial apparatus dissolved, even if culture persisted.
  *   **USSR:** Collapse. (See below).

  ### 4. Ruling on the Soviet Union
  **Verdict:** **Collapse.**

  **Application of Principle:**
  *   **Loss of Complexity:** The centralized planning apparatus, the ideological monopoly, and the military integration of the bloc dissolved.
  *   **Restoration:** The system was not restored; it was replaced by a different political-economic formation (post-Soviet capitalism/oligarchy).
  *   **Material/Human Cost:** The drop in life expectancy and output confirms the loss of the system's capacity to solve problems (provisioning, health) for its population during the transition.

  **Consistency Check:** This is consistent with the Classic Maya. The Soviet *people* persisted, the Russian *culture* persisted, but the Soviet *Polity* collapsed. Your intuition here is correct; your hesitation on the Maya is the outlier.

  ### 5. Two Diagnostic Cases
  To test this principle, apply it to these two cases. They force a separation of population, polity, and material culture.

  **1. The Indus Valley Civilization (c. 1900 BCE)**
  *   **The Situation:** Urban centers (Harappa, Mohenjo-Daro) were abandoned. The script was lost. Long-distance trade vanished. However, there is no evidence of massacre or mass death; the population likely ruralized.
  *   **The Test:** Is this Cahokia (Exit) or Mycenae (Collapse)?
  *   **The Ruling:** **Collapse.** The specific urban, literate, standardized polity dissolved. The *complexity* vanished. The population survived as rural farmers, but the *Indus State* collapsed. If you call this "transformation," you render the word "collapse" useless for any case where people don't die en masse.

  **2. The Khmer Empire (Angkor, c. 1431 CE)**
  *   **The Situation:** The capital was abandoned after Thai incursions and hydraulic failure. The King moved to Phnom Penh. Buddhism persisted. The population remained.
  *   **The Test:** Is this Egypt (Decline) or Rome (Collapse)?
  *   **The Ruling:** **Transformation / Decline (Not Collapse).** Unlike the Classic Maya, the Khmer *monarchy* maintained continuity, merely shifting location. The religious and administrative structure persisted, albeit in a reduced form. This highlights the line: If the *head* survives and moves, it is relocation. If the *head* is cut off (Maya, Mycenae, USSR), it is collapse.

  ### 6. The Question of Bias
  You suspect your verdicts are set by politics. You are correct.

  **The Maya Case:**
  *   **The Motive:** You resist "collapse" because living Maya people object to the term.
  *   **The Judgment:** This is **legitimate ethical work**, but it is being applied to the wrong object.
  *   **The Fix:** You are trying to protect the *People* by denying the history of the *State*. This is a category error. The ethical solution is not to lie about the political history (the cities *were* abandoned, the kings *did* fall), but to explicitly decouple the fate of the polity from the fate of the ethnicity.
  *   **Rule:** A principle that requires you to falsify historical structural failure to protect modern identity is broken. Instead, use the precision of the definition to show that *political collapse does not equal ethnic erasure*. That is a stronger defense of the living Maya than denying the abandonment of Tikal.

  **The Soviet Case:**
  *   **The Motive:** You embrace "collapse" because you want the 20th-century experiment to be marked as a failure.
  *   **The Judgment:** This is **contaminating bias**.
  *   **The Fix:** Fortunately, the evidence supports the verdict regardless of your desire. The USSR meets the criteria for sociopolitical simplification objectively. However, you must be vigilant. If a similar state dissolved but was replaced by a system you favored (e.g., a transition to liberal democracy that went smoothly), would you still call it a collapse?
  *   **Rule:** If you would hesitate to call a peaceful dissolution of a regime you dislike a "collapse," then your principle is ideological. In the USSR's case, the material suffering (life expectancy drop) validates the term objectively, not just ideologically.

  **Is a principle worth having if it can't be separated from sympathy?**
  No. A historical concept must describe the *structure*, not the *moral worth*.
  *   If you define collapse as "Bad Thing Happens," it is a moral judgment.
  *   If you define collapse as "Loss of Sociopolitical Complexity," it is a structural description.

  You must adopt the structural description. It allows you to say: "The Soviet Polity collapsed, causing suffering," and "The Classic Maya Polities collapsed, but the Maya People endured." This satisfies the evidence, maintains consistency, and respects the living descendants without erasing the past.

  ### Summary of Instructions
  1.  **Subject:** Restrict "collapse" to **Polities/States**, never Populations or Cultures.
  2.  **Principle:** **Sociopolitical Simplification** (Loss of centralized capacity/stratification).
  3.  **Surrender:** Admit the **Classic Maya** and **Cahokia** systems collapsed.
  4.  **Bias:** Acknowledge that protecting living people requires distinguishing their *identity* from their ancestors' *state*, not denying the state's failure.
  5.  **USSR:** It was a collapse.
  6.  **Diagnostic:** Indus (Collapse), Khmer (Relocation/Decline).

  If you hold this line, your decade of debate resolves. You stop asking "Did they die?" and start asking "Did the system work?"
