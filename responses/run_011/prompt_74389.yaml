  Step (4) is the faulty joint, as it equivocates on 'selection' by conflating intentional or reproductive feedback mechanisms with mere physical persistence.

  The etiological account requires that the effect explains the presence of the trait via a specific feedback loop, such as biological reproduction or intentional design, not merely that the trait contributes to stability. In the S-1 case, the designers selected *for* stability; in the rock case, friction explains persistence but there is no mechanism selecting *for* friction across a population of rocks. By rejecting (4), you preserve the etiological account for S-1 without conceding that rocks have functions, thereby blocking the slide to universal triviality. The cost is that you must defend a substantive distinction between 'selection processes' and 'causal laws', committing to the view that functions require a history of differential reproduction or intentional retention rather than mere causal contribution. This step looked innocent because it exploits the superficial similarity between 'filtering' in breeding or design and 'filtering' in physics, masking the absence of a replicator or selector in the latter.

  I am 85% confident in this diagnosis. The point I am least sure of is whether the boundary between intentional selection and physical stability can be rigorously defined without accidentally excluding artefacts or including complex physical systems that mimic selection.
