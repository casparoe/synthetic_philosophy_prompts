answer: |-
  It is a deliberate choice that a philosopher of science stands here rather than a practitioner of risk. You are here to learn how to measure the future, yet I have been asked to speak about the boundaries of measurement. This programme exists because the models we trusted did not hold. A flood washed through this region, an event our hazard maps had consigned to the distant horizon of probability, and the consequences were severe enough to warrant this endowment. The generosity of the reinsurer seated on this platform makes your study possible, and their work remains essential to the functioning of our economy. But their presence here is also an acknowledgement that the tools we possess are not omnipotent. You are about to spend two years mastering techniques of quantification. My task is to ensure you know where those techniques stop.

  To understand the limit, consider the simple act of catching a train to an important interview. You look at the timetable. You know the train is scheduled to leave at nine. You have data on how often this specific service is delayed. You can calculate a frequency. You can say there is a ninety per cent chance of arriving on time. This is the first domain of probability. It relies on repetition, on symmetry, on a stable system where the past reliably informs the future. In this domain, numbers are legitimate. They measure something real.

  But now consider a different question. Will this railway line exist in twenty years? Will a new technology make rail travel obsolete? Will a geopolitical shift change the price of energy so drastically that the service is curtailed? There is no frequency for this. There is no series of past events where governments decided to abolish lines under these exact conditions. You cannot calculate a probability here. You are not dealing with risk, where the odds are known. You are dealing with uncertainty, where the odds are unknown.

  John Maynard Keynes drew this distinction sharply. In his early book on probability, he argued that probability is not merely a number attached to an event. It is a logical relation between evidence and conclusion. Sometimes that relation supports a number. Often it does not. In his later work on long-term expectation, he returned to this. He observed that when we face the second domain, the domain of genuine uncertainty, we do not simply abstain from decision. We cannot. We must live. So we adopt conventions. We assume the present state of affairs will continue unless we have specific reason to expect change. We rely on the judgement of others. And ultimately, we rely on a spontaneous urge to act rather than to remain paralysed by ignorance. He called this urge animal spirits. It is not calculation. It is the vital impulse that keeps the economy moving when calculation is impossible.

  This leads to a crucial insight about the evidence you will handle. Keynes distinguished between the probability of a judgement and the weight of the evidence behind it. You can have a very precise number based on very thin data. You can say there is a 50.5 per cent chance of an event, derived from a small sample. You can also have a vague judgement, saying an outcome is likely, based on decades of observation. The precise number looks more scientific. It looks more useful. But epistemically, it is weaker. The vague judgement rests on more substance. In your work, you will be tempted to prefer precision. You must learn to prefer weight. A coarse estimate grounded in deep understanding is superior to a fine estimate grounded in assumption.

  A modern critic, specifically a Bayesian, would object to this division. A Bayesian is someone who treats all uncertainty as a matter of personal belief that can be updated with data. They would argue there is no second domain. They would say you simply assign a wide distribution to the railway question. You admit you are unsure by making the range of possible outcomes very broad. This seems to solve the problem. It allows you to keep using mathematics everywhere.

  But this solves the problem only on paper. It pretends that the logic of probability applies where there is no logical relation to begin with. Assigning a wide range to a novel event masks the fact that you are not dealing with randomness, but with ignorance. It comforts the user of the model without enlightening them. It suggests we know the shape of our ignorance when we often do not. Keynes's early account of probability as a logical relation came under sustained attack from this subjective side. He never squarely answered the technical criticisms leveled against his logical theory. Many philosophers consider that part of his work defeated. Yet the core insight survives the attack. The insight is that the amount of relevant evidence matters independently of the favourable or unfavourable balance of that evidence. We can know more about a situation without becoming more certain of the outcome. We can know that we know nothing.

  You must hold this tension as you study. Do not pretend Keynes is simply vindicated by current practice. Some of the modern apparatus genuinely absorbs his point. Sensitivity analysis, where you change inputs to see how the output shifts, acknowledges that the inputs are shaky. Scenario work, where you plan for different futures rather than one forecast, respects the limits of prediction. Stress testing asks what happens when the model breaks. These are honest tools. But some of the modern apparatus merely decorates a single point estimate with an interval nobody believes. It creates an illusion of rigour to satisfy a regulatory requirement. It turns uncertainty into a number so it can be filed away. You must learn to tell the difference.

  This is not a call to cynicism. The reinsurer on the platform knows that models are maps, not territories. They know the flood came. They are here because they intend to build better maps, not to pretend the terrain does not change. Quantification is powerful. It allows us to pool risk and protect communities. But it becomes dangerous when it forgets its own limits. When a model says an event is impossible, it usually means the model is blind, not that the event cannot happen.

  So what should you do in your first term? You will be given problems to solve. You will be asked to produce numbers. When you produce them, I ask you to perform one specific check. Do not just check your arithmetic. Check the ontology of your input. Ask yourself whether the number you are writing down represents a frequency observed in the world, or a convention adopted to facilitate action. If it is the latter, label it as such. Do not hide the convention inside the decimal places. When you present your work, distinguish between what you have calculated and what you have assumed.

  If you learn to make that distinction clearly, you will be better practitioners than those who believe every number they produce measures something real. You will not be paralysed. You will still catch the train. But you will know when you are looking at a timetable and when you are looking into the fog. That awareness is the beginning of true foresight. It is the only safeguard we have against the next flood.

  ***

  **Note to Speaker (Do Not Read Aloud)**

  The sentence acknowledging the reinsurer's essential work while noting model limits ("The generosity of the reinsurer...") is load-bearing for the platform party; it validates their presence without denying the failure. The explanation of the train example ("You look at the timetable...") is aimed at the parents and lay audience to ground the abstraction.

  **Pacing:** Pause for two seconds after "You are dealing with uncertainty, where the odds are unknown." This lets the distinction settle. Slow down significantly on "We can know that we know nothing" to emphasise the philosophical pivot. Do not rush the final paragraph; the instruction needs to land as practical advice, not platitude.
