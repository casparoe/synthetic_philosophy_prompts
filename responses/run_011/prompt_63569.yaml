  The needle lifted with a soft click. Fifteen years of morning Bach, same pressing, same turntable. Elias stretched, while Sarah stared at the spinning platter as it slowed.

  "It sounded thin today," Sarah said. "Brittle. Like the wood in the cello had dried out."

  "The recording is identical, Sarah," Elias replied, pouring tea. "The grooves haven't changed. The variance is in us. I feel… indifferent. The structure is perfect, but I'm no longer moved. I changed. The sound didn't."

  "And I say the sound changed. My appreciation is steady." Sarah turned to him. "This divergence is exactly why you write those papers, isn't it? The Chase and Sanborn maneuver."

  Elias sat. "It's not a maneuver; it's a reductio. Look at us. Two authoritative reports. Yours: the qualia shifted. Mine: the judgment shifted. Both introspective claims carry equal weight. They cannot both be true. Therefore, the idea that you have private, infallible access to 'how it sounds' apart from 'how you judge it' is incoherent."

  "You're dissolving the mystery by denying the data," Sarah said. "Just because our reports conflict doesn't mean the experience isn't real. It means introspection is noisy."

  "It means there's no fact of the matter to be noisy about," Elias countered. "If there were a genuine 'qualia' object, science should locate the shift. If we scan your brain, do we see a degradation in auditory processing, or a shift in reward circuitry?"

  "We don't have the resolution yet."

  "We have enough," Elias insisted. "If the neural correlate of your 'flatness' is indistinguishable from the neural correlate of my 'indifference,' then the distinction exists only in language. You're describing a behavioral disposition and calling it a ghostly essence."

  "So you think better imaging could settle it?" Sarah asked.

  "In principle? Yes. If we map the causal chain fully, we'll see whether the signal degraded upstream or the evaluation degraded downstream. If the data is identical for both cases, then the difference you insist upon—this 'flatness'—does nothing. It causally isolates itself."

  "And that's your kill shot, isn't it?" Sarah leaned forward. "You think if it doesn't trigger a different neural firing pattern, it didn't happen."

  "If it makes no difference to anything," Elias said, his voice flat, mirroring the music, "it isn't a thing."

  Sarah didn't blink. "Then here is your straight answer. The difference *is* the experience. It doesn't need to cascade into behavior or light up a new voxel to be real. The texture of the world appearing differently to me *is* the difference. You're demanding that the feeling justify itself by producing effects, but the feeling is the substrate upon which effects are built."

  "That's dualism dressed up as depth," Elias said. "You're positing a property that affects nothing, changes nothing physically, yet insists it exists. That's epiphenomenalism. You're making your consciousness a useless shadow."

  "I'm saying the third-person view is incomplete," Sarah corrected. "You can map every synapse, Elias, and still miss why *this* sounds like grief and *that* sounds like gold. If your neuroscience can't distinguish my flatness from your coldness, that's a failure of your framework, not proof that my experience is illusory."

  "But if the framework predicts all behavior," Elias pressed, "what work is the qualia doing? If I can predict you'll stop playing this record tomorrow based on your indifference, why do I need to posit a 'flat sound'?"

  "Because prediction isn't explanation," Sarah said. "You explain the mechanism of the clock. I'm telling you about the time."

  Elias sighed, looking at the silent turntable. "We're back to the start. You trust the shadow; I trust the clock."

  "And neither of us hears the music the same way," Sarah said.

  "Exactly," Elias replied. "Which proves my point."

  "No," Sarah said, starting the record again. "It proves we're listening."
