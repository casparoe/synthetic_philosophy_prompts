answer: |-
  You are asking for a specification document for metaphysical software. In your previous work, the states were given, and the logic was the variable. In metaphysics, the logic (S5, usually) is fixed, and the states are the variable. The conflict arises because different teams propose different data structures for "states," and they disagree on whether the API (our modal discourse) exposes the underlying implementation or abstracts over it.

  Here is the requirements list for an adequate ontology of modality.

  ### Requirements List

  **1. Alethic Coverage**
  *   **Type:** Interface / Non-negotiable
  *   **Motivation:** The system must assign truth values to ordinary assertoric sentences that speakers treat as contingent.
  *   **Test Case:** The sentence "The coin lands heads" is false. The sentence "The coin lands tails" is false. Speakers nevertheless treat the sentence "The coin lands tails" as having a valid truth condition distinct from a contradiction (e.g., "The coin lands tails and does not land tails"). The theory must provide a location in its ontology where "The coin lands tails" evaluates to *true* without generating a logical contradiction in the actual domain.
  *   **Rationale:** If the theory cannot locate the truth of "The coin lands tails" anywhere, it treats all falsehoods as impossible. This contradicts the data of ordinary usage.

  **2. Transworld Identification**
  *   **Type:** Interface / Non-negotiable
  *   **Motivation:** The system must handle *de re* modal claims about specific individuals without violating Leibniz's Law (the indiscernibility of identicals).
  *   **Test Case:** The name "Nixon" refers to a specific biological organism in the actual domain. Speakers accept the sentence "Nixon lost the election" as true. Speakers also accept "Nixon won the election" as true *under a different description of events*. The theory must link the referent of "Nixon" in the actual domain to a referent in the alternative domain such that properties can vary (winning vs. losing) without positing two distinct organisms both named "Nixon" in the same domain.
  *   **Rationale:** If the theory posits a distinct individual in the alternative domain, it fails to capture the intuition that *Nixon himself* might have won. If it posits the same individual with contradictory properties, it violates logic.

  **3. Epistemic Contact**
  *   **Type:** Interface / Non-negotiable
  *   **Motivation:** The system must explain how agents form justified beliefs about the modal structure without causal interaction with non-actual elements.
  *   **Test Case:** Speakers assert "Water is H2O" is unrevisable. Speakers assert "Water is XYZ" is false. No speaker has causal contact with domains where water is XYZ. The theory must explain the mechanism by which speakers distinguish the unrevisable sentence from the false sentence given that neither is observed in the actual domain.
  *   **Rationale:** If the ontology posits entities that are causally isolated from us (like concrete non-actual worlds), it creates a Benacerraf-style problem: we cannot know about them. A theory that makes modal knowledge impossible is inadequate.

  **4. Reductive Base**
  *   **Type:** Implementation / Preference (Analytic Reductionist Camp)
  *   **Motivation:** The system should define modal primitives using non-modal ontology (sets, sentences, properties) to avoid circularity.
  *   **Test Case:** The term "compossible" is used to group sentences into a world. The definition of "compossible" must not rely on the term "possible."
  *   **Rationale:** This is a theoretical virtue, not a hard constraint. It satisfies the desire for ontological parsimony and analysis. However, if no non-modal base suffices, this requirement may be the one to drop.

  **5. Intensional Granularity**
  *   **Type:** Interface / Preference (Hyperintensional Camp)
  *   **Motivation:** The system must distinguish between necessary truths that are cognitively distinct.
  *   **Test Case:** A rational agent accepts "2 + 2 = 4". The same rational agent does not accept "Fermat's Last Theorem is true" (prior to proof). Both sentences are necessarily true. The theory must allow the agent to believe one without believing the other.
  *   **Rationale:** Standard possible-worlds semantics equates all necessary truths (they hold at all worlds). If the ontology is meant to underwrite philosophy of mind or language, this equivalence is a bug. If it is meant only for alethic modality, it is a feature.

  ***

  ### Specific Judgments

  **On Circular Analysis (Requirement 4)**
  A theory is **not obliged** to analyze modality without using modal notions. This demand is camp doctrine (Reductive Actualism). Primitivists argue that modality is a fundamental feature of reality, like space or time. You cannot define "time" without temporal notions; similarly, you may not be able to define "possibility" without modal notions (e.g., using "dispositions" or "essences" which are themselves modal). Insisting on non-circular analysis eliminates Primitivism and Dispositionalism by fiat. It should be marked as a **Preference**.

  **On *De Re* Claims (Requirement 2)**
  A theory **is obliged** to handle claims concerning particular individuals. Ordinary language is saturated with *de re* modality ("I could have been a doctor," "This bridge might collapse"). A theory that only handles *de dicto* modality (propositions true at worlds) forces a translation of "I could have been a doctor" into "There is a world where someone counterpart-related to me is a doctor." While Lewis does this, he admits it is a theoretical cost. If a theory cannot account for the intuition that *I* am the one who is different, it fails Extensional Adequacy (Requirement 1). This is **Non-negotiable**.

  ***

  ### The Hyperintensionality Constraint

  **Must an ontology of modality do better than model checking?**
  **Yes.** In model checking, if $P$ and $Q$ hold at exactly the same states, they are the same property. This is acceptable for verification because you care about system behavior, not cognitive content. In metaphysics, if you intend to explain belief, meaning, or explanation, this equivalence is fatal. "Being a triangle" and "Being a trilateral" hold at the same worlds, but they are not the same concept.

  **The Cost:** To separate these, the theory must either:
  1.  **Introduce Impossible Worlds:** Add states where $2+2=5$ is true. This bloats the ontology significantly and risks triviality (if anything is possible, what constrains the theory?).
  2.  **Adopt Structured Propositions:** Treat propositions as structured entities (trees of objects and properties) rather than sets of worlds. This concedes that "worlds" are not the fundamental semantic value; the structure is.

  **The Concession:** If the theory refuses this cost and sticks to coarse-grained worlds, it concedes it cannot handle propositional attitudes. It limits its scope to alethic modality only. It becomes a theory of *truth conditions*, not a theory of *meaning*.

  ***

  ### The Hard Constraint and Inconsistencies

  **The Single Requirement That Eliminates the Most Candidates:**
  **Epistemic Contact (Requirement 3).**
  This is the "Benacerraf Problem" for modality. It eliminates Lewisian Concrete Realism immediately (how do we know about causally isolated universes?). It puts immense pressure on Ersatzism (how do we know which sets of sentences are "compossible" without modal intuition?). It favors Primitivism (we just *know* modality), but Primitivism often fails Reductive Base.

  **The Jointly Unsatisfiable Subset:**
  **{ Reductive Base, Epistemic Contact, Extensional Adequacy }**
  This is the **Ersatz Trilemma**.
  1.  **Reductive Base:** Build worlds out of sets of sentences or properties.
  2.  **Extensional Adequacy:** Ensure there are enough worlds to make all true modal claims true.
  3.  **Epistemic Contact/Non-Circularity:** Ensure we can identify these worlds without modal intuition.

  **The Conflict:** To get Extensional Adequacy in an Ersatz system, you need a principle of **Compossibility** (which sentences can go together in a set). Any non-circular definition of Compossibility (e.g., "consistent") either fails to capture all possibilities (Extensional Adequacy fails) or secretly relies on modal notions (Reductive Base fails).

  **Which Requirement Has to Go?**
  The field usually sacrifices **Reductive Base**.
  Most contemporary actualists (Plantinga, Stalnaker, Adams) accept that the notion of "compossibility" or "essence" is primitive. They build worlds out of abstract objects, but they admit they cannot define "possible" without using "possible."
  **Cost:** You lose the analytic reduction. Modality becomes a brute fact about abstract objects. You gain Epistemic Contact (we grasp essences directly) and Extensional Adequacy.

  ***

  ### Contender Evaluation

  **Lewisian Concrete Realism**
  *   **Verdict:** Fails Epistemic Contact.
  *   **Analysis:** Lewis treats possible worlds as concrete universes spatiotemporally isolated from ours. This maximizes Extensional Adequacy (everything concrete that *could* exist *does* exist somewhere) and solves Transworld Identification via Counterpart Theory (though at the cost of direct *de re* intuition). However, it fails Epistemic Contact catastrophically. If other worlds are causally isolated, we cannot know about them. Lewis's response (that our modal claims are about these worlds by theoretical stipulation) is a pragmatic dodge, not an epistemic explanation. It also violates Parsimony violently.

  **Linguistic/Combinatorial Ersatzism**
  *   **Verdict:** Fails Reductive Base (Circularity).
  *   **Analysis:** This view builds worlds out of maximal consistent sets of sentences or recombinations of actual particulars and properties. It satisfies Parsimony and Epistemic Contact (we understand sentences/properties). However, it fails Reductive Base. To define a "world," you need a filter for "consistent" or "compossible." If you define consistency logically, you miss metaphysical possibilities (e.g., "Water is not H2O" is logically consistent but metaphysically impossible). If you define it metaphysically, you have used modal notions to define modality. It collapses into Primitivism.

  **Modal Primitivism (e.g., Dispositionalism or Essentialism)**
  *   **Verdict:** Satisfies Interface, Concedes Implementation.
  *   **Analysis:** This view posits that modality is fundamental. Powers, dispositions, or essences are the base layer. "It is possible that P" means "Some actual object has a disposition toward P." This satisfies Epistemic Contact (we observe dispositions) and Transworld Identification (the object itself has the power). It explicitly rejects Reductive Base, admitting modality cannot be analyzed away. It is the strongest alternative that does not traffic in "worlds" as primary entities; worlds are derivative constructions from powers. Its cost is accepting brute modal facts, which some find intellectually unsatisfying, but it avoids the circularity traps of Ersatzism and the epistemic gaps of Lewis.
