answer: |-
  Here is a numbered menu of the distinct claims hidden within the proverb *"De gustibus non est disputandum"* ("There is no disputing about taste"). You can bring this directly to your friend.

  I have categorized them from simple empirical observations to heavy philosophical theses. For each, I have evaluated its plausibility and, crucially, whether it actually supports his conclusion that a critic's review gives you **no reason** to expect you will like a film.

  ### 1. The Empirical Claim (The Fact of Divergence)
  *   **The Claim:** Human preferences are factually diverse; what one person enjoys, another often dislikes.
  *   **Plausibility:** **High.** It is an observable fact that people disagree about movies, food, and art.
  *   **Does it license his conclusion?** **No.** The fact that people *sometimes* disagree does not prove that they *always* disagree, nor that there are no patterns. If a critic has a track record of liking films that you also like, their verdict provides statistical evidence, regardless of the fact that other people might disagree.
  *   **Typical Usage:** This is often what people mean casually ("We just like different stuff").
  *   **Needed for Argument:** Insufficient. This proves disagreement is possible, not that prediction is impossible.

  ### 2. The Normative Claim (The Social Norm)
  *   **The Claim:** It is futile, rude, or socially inappropriate to argue with someone about what they enjoy.
  *   **Plausibility:** **High.** Pressuring someone to like something they don't is generally considered bad manners.
  *   **Does it license his conclusion?** **No.** This claim is about *behavior* (don't argue), not *evidence* (don't believe). Even if it is rude to argue your friend into liking a film, it does not follow that reading a review is an irrational way to spend your money.
  *   **Typical Usage:** **Very Common.** This is the most frequent use of the proverb to end a conversation.
  *   **Needed for Argument:** Useless. A social norm against arguing does not negate the epistemic value of testimony.

  ### 3. The Metaphysical Claim (Non-Cognitivism)
  *   **The Claim:** Aesthetic judgments are not truth-apt. To say "This film is good" is not to state a fact about the film, but merely to express an emotion (like saying "Yuck!" or "Yum!"). Therefore, there is no fact of the matter to be right or wrong about.
  *   **Plausibility:** **Controversial.** This is a heavy philosophical position (associated with Hume or emotivism). Many argue that aesthetic qualities (pacing, acting, coherence) are objective features that can be judged correctly or incorrectly.
  *   **Does it license his conclusion?** **Yes.** If "This film is good" has no truth value, then a critic cannot possess knowledge about it to transmit to you. Their review is just a report of their own feelings, which predicts nothing about yours.
  *   **Typical Usage:** Rarely understood by laypeople, though often assumed implicitly.
  *   **Needed for Argument:** **Strong Candidate.** This is one of the few claims that actually blocks the transmission of knowledge.

  ### 4. The Epistemic Claim (The Acquaintance Principle)
  *   **The Claim:** Justification in aesthetics requires direct experience. You cannot know a film is good via testimony (someone telling you); you must see it yourself to form a valid judgment.
  *   **Plausibility:** **Mixed.** It feels intuitive (art is experiential), but it is inconsistent with how we treat other senses. We trust food critics without tasting the dish, and we trust mechanics without seeing the engine. Why is vision different?
  *   **Does it license his conclusion?** **Yes.** If aesthetic justification *cannot* be transmitted via testimony, then reading a review gives you zero justification, regardless of the critic's expertise.
  *   **Typical Usage:** Common among art purists.
  *   **Needed for Argument:** **Strong Candidate.** This directly attacks the rationality of relying on a review.

  ### 5. The Predictive Claim (Radical Idiosyncrasy)
  *   **The Claim:** Taste is so idiosyncratic that there is no stable correlation between one person's verdict and another's, even between experts and laypeople.
  *   **Plausibility:** **Low.** Data suggests otherwise. Professional critics correlate with each other (Rotten Tomatoes scores), and critics often correlate with specific audiences. If there were *no* correlation, the profession of film criticism could not exist economically.
  *   **Does it license his conclusion?** **Yes.** If there is zero correlation between a critic's liking and your liking, their verdict is statistically useless noise.
  *   **Typical Usage:** Sometimes used cynically ("Critics don't know what normal people like").
  *   **Needed for Argument:** **Necessary.** For his specific claim that a stranger gives you *no reason*, he must assume there is no predictive link between their taste and yours.

  ***

  ### Summary for Your Discussion

  **1. Which reading is typically in play?**
  When people reach for this proverb in casual conversation, they are usually invoking **Claim 1 (Empirical)** or **Claim 2 (Normative)**. They mean: "We happen to like different things, so let's stop fighting about it."

  **2. Which reading is needed for his argument?**
  For your friend to conclude that a review gives you **no reason** to expect you will like the film, he needs **Claim 3 (Metaphysical)**, **Claim 4 (Epistemic)**, or **Claim 5 (Predictive)**.
  *   He needs to prove that aesthetic truth doesn't exist, OR that testimony is invalid for art, OR that critics are no better than random chance at predicting your enjoyment.

  **3. The Gap in His Logic**
  Your friend is likely using a **Normative** proverb ("Let's stop arguing") to support an **Epistemic** conclusion ("You can't learn from this").
  *   **Your Counter:** You can grant that "there is no disputing taste" (you shouldn't fight about it) without accepting that "there is no learning from taste" (you can't use their opinion as data).
  *   **The "Stranger" Nuance:** His argument relies on the critic being a "stranger." However, a professional critic is not a random stranger; they are a calibrated instrument. If you know a critic generally values the same technical aspects you do, their verdict is rational evidence, even if you haven't seen the film.

  **Suggested Reply:**
  *"You're using the proverb to say we shouldn't fight about preferences (Normative), but you're concluding that I can't use your preference as data (Epistemic). Those are different things. Unless you believe film quality is purely magical and can't be predicted by experts (Predictive), a critic's review remains rational evidence, even if it's not a guarantee."*
