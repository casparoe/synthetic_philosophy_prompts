prompt: |-
  Christopher Nolan's *Memento* follows Leonard Shelby, who cannot form new memories and who holds himself together with tattoos, annotated Polaroids, and a story he tells about Sammy Jankis, another amnesiac whose wife died of an insulin overdose he could not remember administering. Read the film through Daniel Dennett's conception of the self as a center of narrative gravity — a self that is not an entity in the head but an abstract posit, like the center of gravity of a physical object, doing explanatory work in the stories told about a person. I am preparing a seminar session on this and want a reading that keeps both the film and the theory honest, without reducing either to an illustration of the other.

  Address three points in particular. Leonard retains habits, skills, and conditioned responses that outlast any story he can tell about them: does that intact non-narrative substrate falsify Dennett's picture, or is it merely what makes his narrative gravity detectable at all? The film eventually implies that the Sammy Jankis story is Leonard's own history displaced onto a character he invented; treat that as a case of narrative capture, where a posited character becomes the only version of the self the narrator can inhabit, and ask whether that is a pathology of selfhood or its ordinary condition. And the reverse chronology presents each moment as the last of the story rather than the first: does that formal device show the center of gravity to be dispensable, or does it show a fiction doing unmistakable causal work on a body that cannot remember believing in it?

  Then say where the reading breaks down. Which features of the film resist the Dennettian gloss, and what would someone working within Parfit's reductionist account, or a neo-Lockean memory theory, say the film is really about that this lens obscures? Close by saying what *Memento* contributes to the debate about selves that argument alone does not. Paraphrase rather than quoting the film or Dennett.

  After the reading, provide a JSON summary with this schema: `elements` — an array of five objects, each with `element` (a specific scene, character, or formal device), `dennettian_reading` (what the center-of-narrative-gravity view makes of it), `resistance` (how it strains or defeats that reading), and `verdict` (one of `supports`, `complicates`, `refutes`); `bottom_line` — two sentences giving your overall verdict; `strongest_objection` — one sentence naming the objection from the personal identity literature that this reading most needs to answer.
