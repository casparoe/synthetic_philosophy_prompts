answer: |-
  To stage a encounter between Christopher Nolan's *Memento* and Daniel Dennett's theory of the self is to pit a puzzle box against an abstract diagram. Dennett proposes that the self is not a tangible thing residing in the brain but a theoretical object, akin to the center of gravity of a physical body. It is a fiction posited to make sense of behavior, a story woven from memories, intentions, and social interactions that allows us to predict and coordinate with one another. *Memento* presents a protagonist, Leonard Shelby, whose brain injury prevents the formation of new memories, forcing him to construct a self out of external artifacts like tattoos and photographs. Reading the film through Dennett's lens does not simply illustrate the theory; it stress-tests it. The film asks whether a self can survive when the narrative thread is constantly snapping, and whether the utility of the fiction matters more than its truth.

  The first point of tension lies in Leonard's retained capabilities. Despite his inability to remember recent events, he retains the skills to drive, fight, and manipulate complex systems of notes. He possesses a robust non-narrative substrate of habits and conditioned responses. A strict interpretation of Dennett might suggest that without the narrative strand, the self dissolves. However, a more nuanced Dennettian reading suggests that these habits constitute the physical mass around which the center of gravity forms. The narrative self is not the engine of the body but the steering mechanism that gives direction to blind force. Leonard's intact skills do not falsify the theory; rather, they demonstrate that the narrative gravity is detectable only because there is a biological organism heavy enough to be pulled by it. Without the habits, the story would have no traction; without the story, the habits would have no goal. The film shows that the abstract self rides on the back of the embodied organism, relying on it for traction even when the driver cannot remember the destination.

  This reliance becomes pathological in the second point of analysis: the story of Sammy Jankis. Leonard recounts the tale of another amnesiac whose wife died due to an insulin overdose, using it to explain his own condition and justify his inability to trust his own mind. The film eventually reveals that Sammy is likely a fabrication, a displacement of Leonard's own history onto a fictional character. Through Dennett's framework, this is not merely a lie but a case of narrative capture. The self is always a constructed fiction, but in healthy functioning, that fiction remains flexible enough to update with new data. Leonard's narrative has hardened into a delusion that protects him from the pain of his own guilt. He inhabits the story of the avenging husband so completely that he cannot exit it, even when evidence suggests he is the villain. This raises a disturbing question for Dennett's view: if the self is always a story, is the difference between sanity and insanity merely the flexibility of the plot? Leonard suggests that the ordinary condition of selfhood is a fragile balance of truth and fabrication, and that pathology occurs not when we tell stories, but when we forget that we are telling them.

  The third point concerns the film's reverse chronology. By presenting scenes in reverse order, the film forces the viewer to experience each moment as the conclusion of a sequence rather than the beginning of a new one. Leonard lives in a perpetual present that is constantly being recontextualized by a past he cannot access. Does this formal device suggest that the center of gravity is dispensable, a mere aesthetic trick? On the contrary, it demonstrates the causal power of the fiction. Even though Leonard cannot remember the narrative he is enacting, his body acts as if the narrative is true. He kills based on instructions he wrote to himself hours prior, instructions grounded in a story he can no longer recall. The fiction does unmistakable causal work on a body that cannot remember believing in it. This supports Dennett's claim that the self is a useful posit; even when the consciousness of the self is interrupted, the behavioral momentum of the self persists. The reverse structure highlights that the narrative gravity exerts force backwards through time, organizing past actions into a coherent identity even when the subject experiences them as disjointed fragments.

  However, the Dennettian reading breaks down when confronted with the visceral reality of Leonard's suffering. Dennett's theory is functionalist and third-personal; it explains the self from the outside as a tool for prediction. *Memento* insists on the first-personal cost of maintaining that tool. There is a phenomenological residue in Leonard's anxiety and confusion that the abstract notion of narrative gravity cannot fully capture. A neo-Lockean memory theorist would argue that the film is about the literal discontinuity of personhood. For Locke, personal identity consists in memory continuity. Since Leonard lacks this, the Lockean would say he is literally a new person every few minutes, making his quest for vengeance morally incoherent. Dennett tries to save the unity of the self as a useful fiction, but the film suggests that without real memory, the fiction is a trap. Similarly, a follower of Derek Parfit's reductionist account might argue that the film demonstrates the irrelevance of identity. Parfit suggests we should care less about whether we are the same person and more about psychological continuity. *Memento* obscures this by showing that the human need for identity is so potent that we will destroy ourselves to maintain the illusion of continuity, even when reductionism would offer relief. The film resists the calm detachment of reductionism; it shows that the loss of self is experienced as a form of death, regardless of whether the self is metaphysically real.

  Ultimately, *Memento* contributes something to the debate that philosophical argument alone cannot: the affective weight of identity construction. Arguments about narrative gravity or memory continuity remain abstract until we see the tremor in Leonard's hand as he burns a photograph or the desperation in his voice as he repeats his own name. The film embodies the theory, showing that the self is not just a logical posit but a survival mechanism fraught with emotional risk. It reveals that while the self may be a story, the stakes of that story are flesh and blood.

