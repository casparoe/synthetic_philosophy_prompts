answer: |-
  The reason this debate feels like a zombie is that it is. It died when Williams expanded "sound deliberative route" to include idealized rationality, but nobody bothered to bury it. You are correct that the stalemate isn't due to a lack of argumentative ingenuity; it's due to a functional equivocation that both sides have a vested interest in maintaining.

  Here is the diagnosis: The dispute is not primarily about the metaphysics of reasons, but about **which job the word "reason" is supposed to do.** Internalists want "reason" to name the *explanatory bridge* between fact and action (if it can't explain the move, it isn't a reason). Externalists want "reason" to name the *normative standard* by which actions are judged (if it counts in favor, it's a reason, even if the agent is blind to it).

  Your **Indexicality Hunch** is sharp, but it needs a slight adjustment. It isn't strictly indexical (like "I" or "here"); it's **contextualist functionalism**. The truth-conditions of "A has a reason" shift depending on whether the conversational context demands an *explanation of agency* (Internalist parameter) or a *justification of conduct* (Externalist parameter). The debate stalls because both sides insist their parameter is the *only* legitimate one for the single word "reason." They aren't just disagreeing on the value of the parameter; they are disagreeing on which parameter the word picks out. This makes the dispute **verbal** at the semantic level but **substantive-normative** at the practical level, because choosing the definition determines which ethical claims come out true.

  Regarding the **Nadia Case**: This will never break the tie. It is a "bullet-biting" generator. The Internalist will say, "Correct, there is no reason *for her*, only for her idealized counterpart," preserving the link to motivation but sacrificing the intuition that Nadia is making a mistake she *ought* to correct. The Externalist will say, "Correct, the reason exists but she is motivationally incapacitated," preserving the normativity but sacrificing the idea that reasons are essentially potential motivators. The case doesn't solve the problem; it proves that the two camps are answering different questions under the same label. Nadia forces you to choose: do you care more about the *authority* of the reason (Externalism) or the *accessibility* of the reason (Internalism)?

  **What counts as progress?** Not a verdict on who is right. Progress is **disambiguation**. It is the realization that we need two distinct concepts: *normative reasons* (facts that count in favor) and *motivating/explanatory reasons* (considerations that can ground action). The debate persists only because philosophers want one concept to do both jobs. A formal result showing that "Internalism" is true for explanation and "Externalism" is true for justification would end the war, but it would require surrendering the claim that "reason" is a unified natural kind.

  | question_at_issue | internalist_answer | externalist_answer | dispute_type | why_it_sticks | what_would_count_as_progress |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | What fixes the truth conditions of "A has a reason to φ"? | A's actual motivational set (S) plus a sound deliberative route. | Objective facts or values independent of A's psychology. | verbal | Both sides claim the term "reason" exclusively for their parameter; phrasing data shows "has reason" is the ambiguous variable. | Consensus to use distinct terms (e.g., "motivating reason" vs. "normative reason") to separate the parameters. |
  | Can a reason exist without a possible deliberative route to motivation? | No. If no route exists (even via idealization), the reason claim is false. | Yes. Reasons exist even if the agent is incapable of accessing them (e.g., Nadia). | substantive-normative | Internalists prioritize action-explanation; Externalists prioritize normative authority. Neither wants to surrender their priority. | Acceptance that "inert reasons" are coherent, or a proof that inert reasons cannot guide action even in principle. |
  | Does idealizing the agent (Williams' concession) collapse the distinction? | No. The route must still start from the actual S; continuity matters. | Yes. A fully informed/rational self is an external standard, making Internalism a disguised Externalism. | methodological | Internalists need idealization to avoid absurdity but deny it changes the grounding; Externalists seize on it as a concession. | A precise formal limit on "sound deliberation" that distinguishes it from full rationality without being arbitrary. |
  | Are the two camps answering the same question? | Yes. We are defining the single concept of a practical reason. | Yes. We are defining the single concept of a practical reason. | different-questions | Both assume "reason" is a unitary phenomenon; admitting they address different functions (explanation vs. justification) dissolves the conflict. | Explicit agreement that Internalism explains *action* while Externalism justifies *conduct*, requiring two vocabularies. |

  The question worth writing about is the fourth row (different-questions), because solving it dissolves the other three.
