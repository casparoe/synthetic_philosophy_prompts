  ### My Commitment

  I sign up for **Leaf 4: Categoricalism + Laws of Nature**.

  **Why:** It offers the best balance of parsimony and explanatory power for your line of work. When you hold a piece of glass, you are holding a specific molecular arrangement (categorical). That arrangement *plus* the laws of physics entails breaking. We don't need to posit invisible "powers" on top of the structure, nor do we need to pretend fragility is fiction. The awkward commitment—that laws are separate rules—is a price I'm willing to pay to avoid the mysticism of "irreducible powers" or the absurdity of the Simple Conditional.

