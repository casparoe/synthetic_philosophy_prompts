  ### Logical Gaps & Empty Cells

  **Indistinguishable Leaves:**
  I cannot cleanly separate **Leaf 4 (Categorical + Laws)** and **Leaf 5 (Real Powers)** with this tree alone.
  *   *Why:* Both agree dispositions are real and not just conditionals. The difference is whether the "power" is distinct from the "structure." Laypeople often say "it's the structure" (Leaf 4) but mean "the structure *makes* it powerful" (Leaf 5).
  *   *Fix:* You need a question about *change*. Ask: "If the laws of nature changed, would the glass keep its fragility?" Leaf 4 says No (laws determine the outcome). Leaf 5 says Yes (the power is intrinsic, laws just describe it).

  **Empty Cells:**
  1.  **SCA + Realism about Properties:** (Path 1B → 2A → ...).
      *   *Status:* **Incoherent.** You cannot say fragility is *just* the conditional (SCA) and also that it is a *real property* existing when unmanifested. One cancels the other.
  2.  **Pan-Dispositionalism + Categorical Bottom:** (Path 5A → 5B).
      *   *Status:* **Incoherent.** By definition, Pan-Dispositionalism denies a categorical bottom.
  3.  **Deflationary + Real Powers:** (Path 1A → 1B).
      *   *Status:* **Unattractive.** Nobody bothers to argue powers are real if they also think talk about them is fiction. It's philosophically unstable.

