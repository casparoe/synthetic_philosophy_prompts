  1.  **Ten-year box:** You are a **Realist** (rejects Deflationary).
  2.  **Case 1 & 3:** You reject the **Simple Conditional** (you know mimics and finks don't define the property).
  3.  **Case 2:** You treat flammability as **Intrinsic** (rejects pure Relationalism).
  4.  **Unmanifested Dispositions:** You believe they persist (rejects Actualism).

  **You land in Leaf 5: Real Powers (Mixed).**
  You treat dispositions as real features that persist in the object (the glass in the box), distinct from the mere outcome (Case 3), but you likely assume they are grounded in the physical stuff you fix and resell (the glass/steel structure). You aren't a Pan-Dispositionalist (you deal in physical objects), and you aren't a Categoricalist (because you feel the "fragility" is a *thing* the glass *has*, not just a description of its shape). You are a natural-born **Dispositional Realist**.
