  ### Corrections to Your Cases

  You got the verdicts mostly right, but you have **Case 1 (The Finkish Glass)** wrong in a subtle but crucial way.

  *   **Your Verdict:** "It's still fragile."
  *   **The Correction:** The glass is fragile *before* the device activates, but it is **not fragile at the exact moment of impact**.
  *   **Why:** Dispositions are time-indexed. If the device removes the fragility *instantly* before the strike, then at $t_{strike}$, the glass lacks the disposition. If you say it is fragile *at the moment of impact*, you are forced to admit that something can be fragile even if it lacks the physical basis for fragility at that moment. You should say: "It *was* fragile, but the device removed the property before the test." This distinction saves you from logical contradictions regarding when the property exists.

  **Regarding Case 2 vs. Case 1:**
  You suspected they were different. You are right. They are fundamentally different animals.
  *   **Case 2 (Match in Vacuum)** is a **Mask**. The intrinsic property (flammability) is present, but an *extrinsic* condition (oxygen) is missing. This is easily fixed by saying "flammable in the presence of oxygen."
  *   **Case 1 (Finkish Glass)** is a **Fink**. The intrinsic property itself is removed *by the stimulus*. This is much harder to fix because the object itself changes. Case 1 is the stronger argument against the Simple Conditional view; Case 2 is just a definition problem.

