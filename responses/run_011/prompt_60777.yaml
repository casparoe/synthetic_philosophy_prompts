answer: |-
  Spectrum arguments pose a significant challenge to the transitivity of "all-things-considered better than." Consider a chain of experiences starting with a mild headache and ending with excruciating torture, linked by intermediate steps where each step seems marginally worse than the last. Intuition suggests that each adjacent pair is comparable (A is better than B), yet the endpoints seem incomparable or reversed (A is not better than Z). To preserve the comparability of adjacent pairs without accepting that the mild headache is better than torture, some philosophers propose that "better than" is intransitive. A popular mechanism for explaining this intransitivity is dimensional majoritarianism. On this view, options are evaluated across multiple dimensions of value (e.g., intensity, duration, fairness). In any pairwise comparison, the option winning on a majority of dimensions is deemed better. Since the winning coalition of dimensions can shift across a chain, a cycle can emerge: A beats B, B beats C, but C beats A.

  This proposal invites a structural comparison to the Condorcet paradox in social choice theory, where individual voters with transitive preferences aggregate into a cyclic social preference via majority rule. The worry is pressing: in the social case, we do not treat the resulting cycle as a discovery about the collective will, but as an artefact of a flawed aggregation procedure. We seek better voting rules or admit the group lacks a coherent ranking. Does this parallel imply that intransitive betterness is likewise an artefact, leaving transitivity safe? Or does the analogy break? I argue that the analogy holds sufficiently to demonstrate that dimensional majoritarianism is a category error regarding value. Consequently, the intransitivity it generates is an artefact, and transitivity remains a necessary norm for all-things-considered betterness.

  To assess the analogy, we must ask whether dimensions of value are relevantly like voters. In the Condorcet paradox, voters are independent agents with sovereign preferences; the aggregation rule treats them equally (one person, one vote). Dimensional majoritarianism treats value dimensions analogously: intensity, duration, and equality are treated as independent "voters" with equal weight. This is where the model fails. Value dimensions are not independent agents; they are aspects of a single good. More critically, dimensions admit of magnitude, whereas voters in a standard majority rule do not. If Option A exceeds Option B slightly on two dimensions but falls behind massively on a third, dimensional majoritarianism declares A better simply because it wins the headcount. This ignores the cardinal weight of the loss.

  In social choice, we might accept equal weighting as a democratic norm. In value theory, there is no norm requiring "one dimension, one vote." If a dimension carries significantly more value weight, it should dictate the verdict. Once we acknowledge that dimensions have variable weights and magnitudes, the cycle typically dissolves. We move from a majoritarian aggregation to a weighted summation or a lexical ordering. The cycle was generated only because the model artificially suppressed information about magnitude. Thus, the Condorcet parallel is genuine in its diagnosis: the cycle is an artefact of an aggregation procedure (simple majoritarianism) that we have independent reason to distrust in the context of value. It does not reveal a deep truth about the structure of value; it reveals a shallow error in modeling it.

  This conclusion is reinforced by the money-pump consideration. If "all-things-considered better than" is cyclic, an agent who prefers A to B, B to C, and C to A is vulnerable to a money pump. She can be induced to trade A for B (paying a fee), B for C (paying a fee), and C for A (paying a fee), ending up with her original option but less wealth. In the social case, a cyclic electorate is vulnerable to agenda manipulation, but the "cost" is distributed and political. For the individual agent, the cost is direct and pragmatic. Some intransitivists argue that sophisticated choice—where the agent anticipates the cycle and precommits—blocks the pump. However, precommitment acknowledges that the underlying preference relation is defective. If I must bind my future self to avoid exploitation, my current preferences do not successfully guide rational action.

  The existence of a money pump suggests that cyclic betterness is incompatible with rational agency. Since "better than" is a normative concept essentially tied to choice and reason, a relation that precludes rational choice cannot be the genuine "all-things-considered better than" relation. The vulnerability attaches to the procedure, as the prompt suggests, but in the case of value, the procedure *constitutes* the relation. There is no deeper "true" betterness hidden behind the majoritarian calculation. If the calculation yields a cycle, it has failed to track betterness. Therefore, the pumpability of the intransitivist position counts decisively against it. It shows that intransitivity is not a sustainable feature of a normative guide.

  A third option often raised is incomparability. Perhaps the pairs in the spectrum are not strictly better or worse, but incomparable. If A and B are incomparable, the transitivity condition (if A > B and B > C, then A > C) is not triggered, and the cycle is avoided without forcing the counterintuitive result that a headache is better than torture. Is this a substantive alternative or merely a relabeling of intransitivity? It is substantive, but it fails to capture the phenomenology of the spectrum. The spectrum argument relies on the intuition that adjacent steps *are* comparable; the difference is small, but one is genuinely better. Incomparability denies this premise. It claims that at the margins, value runs out.

  While incomparability avoids the money pump (one does not trade for something incomparable), it sacrifices the continuity of value that makes the spectrum argument compelling in the first place. If we accept incomparability, we are not saving intransitivity; we are denying the existence of the relation in the problematic cases. This is a coherent position, but it does not support the claim that "better than" is intransitive. It supports the claim that "better than" is partial. For the specific question of whether the *relation* is transitive where it holds, the incomparabilist agrees it is. The dispute is merely about the domain of the relation. Thus, incomparability does not save the intransitivist who wants to maintain that A is better than B, B is better than C, and C is better than A. It dissolves the chain.

  The strongest objection to the defense of transitivity offered here comes from the phenomenon of lexical superiority. Consider a dimension like "human rights violations." One might argue that any amount of rights violations is worse than any amount of economic gain, regardless of magnitude. This is a lexical threshold. If we have a chain where A has fewer violations than B, and B fewer than C, transitivity holds. But suppose we have multidimensional lexical thresholds that interact. If Dimension 1 is lexical over Dimension 2, but Dimension 2 becomes lexical over Dimension 1 at extreme magnitudes, could we not generate a cycle? For instance, A wins on Dim 1 (lexical), B wins on Dim 2 (lexical at high magnitude), C wins on Dim 1. If the thresholds shift contextually, we might recreate the cycle even with weighted dimensions.

  My reply is that genuine lexicality precludes trade-offs, and without trade-offs, the conditions for a cycle cannot be met in a single comparative context. If Dim 1 is lexical over Dim 2, Dim 2 cannot outweigh Dim 1. If the lexical status shifts depending on the pair being compared, this is not a property of the dimensions but of the comparison itself, which reintroduces the aggregation error. Furthermore, lexical thresholds typically generate incomparability at the boundary, not intransitivity. If A is lexically superior to B, and B to C, A is lexically superior to C. The only way to get a cycle is if "lexically superior" itself becomes intransitive, which is conceptually incoherent. Lexicality therefore supports transitivity or incomparability, but not intransitivity. It reinforces the view that the majoritarian model was wrong to allow small losses on high-weight dimensions to be overridden by wins on low-weight dimensions.

  In closing, it is vital to distinguish what is settled from what is contested in this debate. It is largely settled among decision theorists that cyclic preferences render an agent vulnerable to exploitation via money pumps, and that rational agency requires transitive preferences. It is also settled that the Condorcet paradox demonstrates the instability of simple majority aggregation. What remains genuinely contested is the metaphysics of value: specifically, whether "all-things-considered betterness" is a unitary relation that must obey the norms of rational choice, or whether it is a composite construct that can inherit the pathologies of its parts. The intransitivist bets on the latter; the transitivity defender bets on the former. My argument relies on the normative claim that value must guide action coherently. If one rejects this functional role of value, the money pump argument loses its bite. However, within the standard framework where value is the guide of rational choice, the structural parallel with Condorcet is damning for dimensional majoritarianism. It shows that the cycle is a mathematical artefact of ignoring magnitude, not a feature of the good.

  Verdict: Transitivity holds; the parallel reveals an aggregation artefact.
