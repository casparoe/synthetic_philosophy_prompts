answer: |-
  **Project Title:** The Assurance Structure of Legal Moralism: A Reconstruction of the Disintegration Thesis

  **Project Summary**
  The standard reception of the Hart–Devlin debate treats Devlin's claim—that shared morality is necessary for societal existence—as a causal-empirical prediction. Hart's refutation, noting that liberalizing sexual morals did not cause state collapse, is taken as decisive. This project argues that this is a category error. Devlin's thesis is better reconstructed not as sociology, but as a claim about collective action: shared moral practice functions as an assurance device or common-pool resource. It is stable only if enough agents comply, individually cheap to defect from, and costly to rebuild. If this reconstruction holds, Hart's empirical objection misses the target. The project asks: **Does modeling the disintegration thesis as an assurance-game problem yield a principled criterion for legal enforcement that is distinct from the Harm Principle?**

  **Background and Problem**
  Standard readings leave this question open. Interpreting Devlin as a moral conservative dismisses the argument *ad hominem*. Interpreting him as a sociologist invites empirical falsification that ignores the normative logic. Even the "treason analogy" treats immorality as direct subversion, failing to explain *which* morals constitute the binding glue. These approaches assume the thesis is either obviously false or obviously reactionary, bypassing the structural question of how moral norms function as public goods. Consequently, we lack a clear account of whether law can legitimately coordinate moral behavior absent direct harm.

  **Methodology and Work Plan**
  The semester will proceed in four phases.
  *   **Month 1: Formalization.** I will define the conditions under which a moral norm exhibits threshold or assurance structures (visibility, imitability, self-reinforcement).
  *   **Month 2: Exegetical Mapping.** I will test whether Devlin's text supports this reading or if it requires charitable reconstruction.
  *   **Month 3: Application.** I will apply the model to candidate norms (e.g., sexual conduct, drug use, civic rituals) to generate a sorting criterion. The working hypothesis is that enforcement is justifiable only where defection is contagious and threatens the equilibrium, excluding purely private violations.
  *   **Month 4: Drafting and Stress-Testing.** I will refine the criterion against objections, specifically checking for collapse into harm-based reasoning.

  **Why Philosophy?**
  A sociological approach asks whether moral change *actually* destabilizes societies. This project asks whether the *justification* for enforcement is logically coherent. Even if societies do not collapse, the state may still face a coordination problem where law serves as a focal point. Determining the logical limits of this justification is a conceptual task, not an empirical one. It clarifies the boundary between state power and individual liberty independent of historical contingency.

  **Outcomes and Failure Conditions**
  Success looks like a derived principle that permits some moral enforcement without devolving into majoritarian tyranny. There are two specific failure modes I anticipate. First, **Triviality**: The reconstruction makes Devlin tautologically true (e.g., "enforce whatever is necessary") but offers no guidance on what is necessary. Second, **Collapse**: The criterion turns out to be the Harm Principle in disguise (e.g., "erosion causes social harm"). If the distinction vanishes, the project yields no new theoretical leverage.

  **Scope and Significance**
  This is scoped for a single journal article. It does not require a full book-length history of the debate, only a focused structural analysis. For legal theory, the stakes are high. This isn't about rehabilitating a dead judge. It's about identifying when law solves coordination problems versus when it merely imposes preference. If the assurance model holds, it identifies a specific, limited domain where legal moralism is rational even for liberals. If it fails, it conclusively buries the disintegration thesis on logical rather than empirical grounds.
