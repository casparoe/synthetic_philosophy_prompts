  2.  **Deconstruct the Hunch & Formulate the Question:**

      *   *Hunch:* Morality as a common-pool resource/assurance device.
      *   *Problem:* Standard view says Devlin is wrong because societies didn't collapse after decriminalizing homosexuality, etc.
      *   *Reconstruction:* Devlin is describing a coordination problem. If everyone defects, the resource vanishes. Law's role is to prevent the tipping point.
      *   *Question:* Can a collective-action reconstruction of Devlin's thesis generate a non-trivial, distinct criterion for legal moralism that survives Hart's objections?
      *   *Refinement:* "Does reconstructing Devlin's 'disintegration thesis' as an assurance-game problem yield a principled limit on legal enforcement distinguishable from the harm principle?"

  3.  **Address the Standard Readings:**

      *   Why are they insufficient?
      *   *Moral Conservatism:* Just assumes Devlin is wrong because we dislike his morals. Doesn't engage the structure.
      *   *Sociological/Empirical:* Hart's approach. Looks for historical collapse. Misses the *logic* of the claim.
      *   *Treason Analogy:* Treats immorality like subversion. Too blunt.
      *   *Result:* These treat the thesis as a prediction to be falsified, not a structural claim to be modeled.

  4.  **Develop the Methodology:**

      *   Need a semester plan (4-5 months).
