prompt: |-
  I lead a small backend team, and twice a month we hold a ninety-minute "reading group" that is mostly an excuse to argue about how we design software. The next session is mine to run: 18 people, nearly all engineers, no philosophy training anywhere in the room, myself included. The space has a whiteboard, index cards, and markers. I have no budget for prizes — points or tokens are fine, and I can convert them into some small bragging artifact, but not money.

  Here is why I want to run it. We are building a service that re-plans whenever new telemetry arrives mid-task, and a colleague and I keep having the same argument and never resolve it. His position is that an agent should always act on the best information it has at the moment of acting, and that anything else leaves value on the table. My position — which I have arrived at informally and cannot yet defend well — is that there is a large class of situations where the operative question is not "what should I do, now that I know X?" but "what policy would I have wanted to lock in before X was known?", typically because some counterparty has already conditioned its own behavior on which kind of agent I turn out to be. I can gesture at the familiar thought experiments — the stranded traveler who is only asked to pay after he has been safely delivered, the sealed box whose contents depend on what a predictor expected him to take — but waving at puzzles has gotten me nowhere. Half the room dismisses them as badly posed riddles, and the other half treats them as trivia.

  So I want them to lose points over it. Design a game in which the structure does the arguing and I barely have to.

  Requirements:

  - They must run into the failure before anyone names it. No lecture up front, and nobody should hear a term like "updateless" until the debrief. Ideally every participant, at least once, makes the move that looks locally obvious and then watches it cost them.
  - Several rounds, with a deliberate change between them in who knows what and when, so that the contrast is felt rather than asserted. At least one round should hand a subset of players private information that genuinely changes what looks best from inside their own branch — the pull of "but I know something now" has to be real, not a strawman.
  - The prediction step must be mechanical. I am not a good judge of character and I will not run a con on my own team: whatever plays the role of "someone who already knows what you will do" should be a published rule the players can read and reason about, not my intuition or a hidden dice roll.
  - Payoffs in tokens, with arithmetic simple enough to do by hand on an index card. No real money, no real stakes beyond the room.
  - A minute-by-minute timeline that fits ninety minutes, including a debrief of about 25 minutes.
  - A debrief that maps specific moments of play onto specific parts of the idea, phrased as questions I should ask rather than conclusions I should announce.
  - A short script — a paragraph or two — that I can read or paraphrase accurately. I will be delivering it, and if the point is subtle I will get it wrong, so please write it for someone who has not studied this.
  - What will predictably go wrong the first time I run it: the exploit a sharp engineer will find, the round where the energy dies, the participant who correctly says "this isn't the real problem, you've quietly changed it." Tell me how to handle each.
  - Most important: an honest note on what the activity cannot reproduce. My suspicion is that a game built on published rules and sealed commitments teaches the weaker lesson — "commit in advance," or "sign a contract so your future self can't defect" — rather than the actual view, which is about where the choice gets evaluated from rather than about any device that binds you. Tell me whether that suspicion is correct, what exactly is lost, and what I have to supply verbally to cover the gap. If a room of engineers cannot be expected to feel that difference in ninety minutes, say so plainly instead of implying the game delivers it.

  One more thing: a fallback plan. This group argues for sport. If two or three of them reverse-engineer the intended lesson during round one and start coaching everyone else, what do I switch to that preserves the point without a restart?
reasoning: |-
  Here's a thinking process that leads to the suggested game design:

  1.  **Analyze the Request:**

      *   **Goal:** Run a 90-minute reading group session for 18 backend engineers to resolve a specific design argument.
      *   **The Argument:** "Act on best current info" (My Colleague) vs. "Lock in a policy before info is known" (Me/The User). This is essentially Timeless Decision Theory (TDT) / Updateless Decision Theory (UDT) vs. Causal Decision Theory (CDT).
      *   **Constraints:** No philosophy training, no budget (tokens/bragging rights ok), whiteboard/index cards available.
      *   **Requirements:**
          *   Experience the failure before naming it (no lecture).
          *   Multiple rounds with changing information states.
          *   Private information that tempts deviation.
          *   Mechanical prediction (no GM intuition).
          *   Simple arithmetic payoffs.
          *   Minute-by-minute timeline (90 mins total, 25 min debrief).
          *   Debrief questions (Socratic, not declarative).
          *   Opening script (accessible, non-technical).
          *   Failure modes (exploits, energy dips, objections).
          *   Honest limitation note (commitment devices vs. decision theory).
          *   Fallback plan (if they solve it too fast).

  2.  **Deconstruct the Core Concept:**

      *   The user's position is essentially *Updateless Decision Theory* (UDT). The core insight is that your decision algorithm is what gets predicted, not just your specific action in a specific branch. If a predictor simulates you, they simulate your *source code*, not just your runtime state after receiving an observation.
      *   The colleague's position is *Causal Decision Theory* (CDT). Maximize expected utility given current knowledge.
      *   To make engineers feel this, we need a game where "knowing more" actually hurts you because the payoff structure was determined by a prediction of what you *would* know and how you *would* act.
      *   *Newcomb's Problem* is the classic example, but engineers often dismiss it as "magic predictor."
      *   *Prisoner's Dilemma* is too common and often solved by "just cooperate."
      *   *The Traveler's Dilemma* or *Centipede Game* are good but don't capture the "prediction based on policy" aspect well enough.
      *   *Idea:* A modified Newcomb/Parfit's Hitchhiker scenario implemented as a tournament.
      *   *Mechanism:* A "Predictor Bot" that reads their submitted strategy *before* the game starts, or simulates their behavior based on a rule.
      *   *Better Mechanism for Engineers:* A "Source Code Submission" round vs. a "Runtime Decision" round.
      *   *Refined Mechanism:* The "Oracle Contract."
          *   Round 1: You submit a function `decide(info)`. The Oracle simulates this function against a test case. Payoff depends on the simulation.
          *   Round 2: You are *in* the test case. You get the info. You can choose to follow your function or deviate.
          *   The catch: The Oracle already paid out based on the function, not the action.
          *   Wait, that's too abstract. Let's make it concrete.

      *   *Game Concept: "The Pre-Commitment Oracle"*
      *   Players are "Agents."
      *   There is an "Oracle" (a fixed algorithm on the whiteboard).
      *   The Oracle predicts what the Agent will do.
      *   The payoff depends on the prediction accuracy + the action.
      *   To make it "Updateless," the Agent needs to realize that *changing* their mind after getting info proves they are the type of agent who changes their mind, which the Oracle (simulating them) would have anticipated.

      *   *Let's try a specific setup:* "The Bridge Toll."
      *   Scenario: You need to cross a bridge to get a reward. A toll collector decides whether to let you cross based on whether they think you'll pay *after* crossing.
      *   Round 1 (Blind): You submit a policy: "I will Pay" or "I will Defect." The Collector simulates this. If they predict Pay, they let you cross. If you cross and Pay, you get 10. If you cross and Defect, you get 15. If they predict Defect, you don't cross (0).
      *   Round 2 (Informed): You are *on* the other side. You know you crossed. Do you Pay?
      *   Problem: In a live game, if the Oracle already decided based on Round 1, Round 2 is just lying.
      *   Solution: The "Oracle" is a deterministic algorithm based on *what they write on the card*.
      *   Let's create a tournament structure. Pairs of players? No, 18 people. Large group dynamics are hard.
      *   Better: Everyone plays against the "House" (The Oracle Rule).
      *   The Oracle Rule is public. It calculates points based on what you *would have done* vs what you *actually do*.

      *   *Revised Game: "The Simulation Tax"*
      *   Three Rounds.
      *   **Round 1 (The Policy):** Players write down a rule: "If I see Signal A, I do X. If I see Signal B, I do Y."
      *   **The Oracle:** Looks at the rule. If the rule says "Always Cooperate," Oracle puts 10 points in the pot. If "Always Defect," 0 points.
      *   **Round 2 (The Reality):** Players are dealt a Signal (A or B). They choose an Action.
      *   **The Twist:** The points were already allocated in Round 1 based on the Rule. But players *think* points are allocated based on Round 2 Action.
      *   *Wait, that's a trick.* Engineers hate tricks. It must be transparent.
      *   *Transparency is key.* The rules must state: "Payoff is determined by your submitted Policy, not your final Action."
      *   *But then why act in Round 2?*
      *   *Ah, the "Counterfactual" Mugging.*
      *   Let's look at "Parfit's Hitchhiker" mechanics.
      *   You are in the desert. A driver offers a ride. Driver predicts if you'll pay $100 upon arrival.
      *   If Driver predicts Pay -> Ride (You gain 1000, cost 100 = 900).
      *   If Driver predicts No Pay -> No Ride (You gain 0).
      *   Once in town, you have the money. CDT says: Don't pay. You already got the ride.
      *   UDT says: You must be the type who pays, or you never get the ride.
