      *   If Card says "I will Not Pay," Driver gives nothing.
      *   *Then*, players with Ride Tokens enter Phase 2. They physically hand over tokens or keep them.
      *   *Scoring:* Points are awarded based on the *Card*, not the handover? No, that feels fake.
