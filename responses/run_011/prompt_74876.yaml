      *   *The Conflict:* If I have the Ride Token, I know I made it. My CDT brain says "Keep the money, I already won." But if everyone thinks that, the Driver (Algorithm) predicts "No Pay" and no one gets the token.
      *   *To make it experiential:* We need a round where they *get the info* that tempts them to defect.
