  ## The Session Plan: "The Oracle's Contract"

  ### 1. The Opening Script (5 Minutes)
  *Read this verbatim or paraphrase closely. Do not ad-lib the core logic.*

  "Thanks for coming. As you know, [Colleague] and I disagree on how our replanning service should handle mid-task telemetry. He argues we should always act on the best current information. I argue there are cases where we should ignore new information to remain predictable to systems that model us.

  "I'm not going to lecture you on why I'm right. Instead, we're going to play a game against a 'Predictor'—a set of rules on the whiteboard that simulates a system modeling our behavior. You will earn tokens. The top three token-holders get to put their initials on the whiteboard 'Hall of Fame' until next month.

  "Here is the only rule that matters: **The Predictor is mechanical.** It does not guess. It calculates. If you try to outsmart the rules, you will lose points. If you follow the rules, you might still lose points. Your job is to figure out where the points are leaking.

  "We have three rounds. In each round, the rules change slightly. Do not discuss strategy between rounds. Grab an index card and a pen."

  ### 2. The Game Mechanics (60 Minutes)

  **Setup:**
  *   **Whiteboard:** Draw two boxes: **Box A** (Transparent) and **Box B** (Opaque).
  *   **Tokens:** Use index card scraps or whiteboard ticks.
  *   **The Oracle Rule (Write this visibly):**
      1.  Players submit a **Policy Card** ("ONE" or "BOTH").
      2.  Oracle fills Box B: If Policy is "ONE", Box B = 100 tokens. If Policy is "BOTH", Box B = 0 tokens.
      3.  Box A always contains 10 tokens.
      4.  Players submit an **Action Card** ("TAKE ONE" or "TAKE BOTH").
      5.  **Payoff:** Sum of tokens in taken boxes.
      6.  **Consistency Tax:** If Policy Card ≠ Action Card, subtract 50 tokens. (Frame this as "System Instability" or "Re-compilation Cost").

  **Round 1: The Blind Test (20 Minutes)**
  *   **Step 1:** Players write Policy Card (secretly). Collect them.
  *   **Step 2:** Apply Oracle Rule. Announce how many Box Bs were filled (e.g., "12 of you got the 100 tokens"). Do not reveal who.
  *   **Step 3:** Players write Action Card (secretly). Collect them.
  *   **Step 4:** Calculate Payoffs individually on index cards.
  *   **Expected Outcome:** Many will write Policy="ONE" (to fill Box B) and Action="BOTH" (to get 110 total). They will get hit with the 50-token Consistency Tax. Net: 60 tokens. Those who wrote "ONE"/"ONE" get 100. Those who wrote "BOTH"/"BOTH" get 10.
  *   **Goal:** Let them feel the pain of the Tax.

  **Round 2: The Info Leak (20 Minutes)**
  *   **Change:** After submitting the Policy Card, but *before* submitting the Action Card, you announce the content of Box B for *their specific instance*.
  *   **Step 1:** Submit Policy Card.
  *   **Step 2:** Hand each player a slip of paper: "Your Box B contains [0 or 100]." (Based on their Policy).
  *   **Step 3:** Submit Action Card.
  *   **Step 4:** Calculate Payoffs (including Consistency Tax).
  *   **The Trap:** A player who sees "Box B = 100" knows the money is already there. CDT screams: "Take Both! The money is already yours!" But if they do, they trigger the Tax.
  *   **Goal:** Force them to argue with the slip of paper. The "locally obvious" move (Take Both) is now visibly costly.

  **Round 3: The Source Code Lock (20 Minutes)**
  *   **Change:** There is no Action Card. The Policy Card *is* the Action.
  *   **Step 1:** Submit one card. This is your "Source Code."
  *   **Step 2:** Oracle calculates payoff immediately. No Consistency Tax (because deviation is impossible).
  *   **Goal:** Show that removing the ability to "update" removes the Tax and maximizes the return.

  ### 3. The Debrief (25 Minutes)
  *Do not lecture. Ask these questions in order. Write answers on the whiteboard.*

  1.  **Round 1 Autopsy:** "Who wrote Policy 'ONE' and Action 'BOTH'? How did your score compare to the person who wrote 'ONE' and 'ONE'?"
      *   *Target:* Realize that trying to game the system cost more than cooperating with it.
  2.  **Round 2 Tension:** "When you saw the slip saying 'Box B = 100', who felt a physical urge to switch to 'BOTH'? Why did you stop yourself?"
      *   *Target:* Identify the feeling of "leaving value on the table" vs. "paying the tax."
  3.  **The Mapping:** "In our telemetry service, what is Box B? What is the Consistency Tax?"
      *   *Target:* Box B = Upstream systems relying on our stability. Tax = The cost of thrashing/re-planning when others expected us to hold.
  4.  **The Core Question:** "In Round 2, the money was *already in the box*. Taking it didn't empty it. Why was 'Take Both' still the wrong move?"
      *   *Target:* This is the crux. The answer isn't "because of the tax." The answer is "because if I am the type who Takes Both, the box would have been empty."
  5.  **Closing:** "My colleague argues we should act on the best info (Round 2 logic). I argue we should act on the best policy (Round 3 logic). Based on the tokens, which argument wins?"

  ### 4. Predictable Failure Modes

  **1. The "Liar's Exploit"**
  *   **What happens:** A sharp engineer realizes the Consistency Tax is arbitrary. They argue, "If I'm smart enough to lie, I'm smart enough to avoid the tax. The tax shouldn't exist."
  *   **Handle it:** "You're right. In this game, the tax is a rule. In the real world, the tax is *consequence*. If our service replans unpredictably, upstream services time out. That timeout is the tax. I've made it explicit here so we can count it. Don't fight the rule; fight the optimization problem."

  **2. The Energy Dip (Round 2)**
  *   **What happens:** Counting tokens individually takes too long. People get bored.
  *   **Handle it:** Do not count every token. Ask for a show of hands: "Who scored over 80?" "Who scored under 50?" Keep the scoring high-level. The *relative* difference matters, not the absolute number.

  **3. The "This Isn't Real" Objection**
  *   **What happens:** Someone says, "This is just a contract. If I could sign a binding contract in Round 1, of course I'd win. That's not decision theory, that's legal enforcement."
  *   **Handle it:** **Acknowledge this immediately.** "This is the exact point we will discuss in the final note. You are correct that this game simulates commitment. The hard part is doing this *without* the contract. But first, let's agree that the *outcome* of the committed agent is better."

  ### 5. The Honest Note (Crucial)

  *Read this at the very end. Do not skip it.*

  "I need to be honest about what this game did and didn't prove. This game taught you that **committing in advance** yields higher payoffs than **deciding in the moment**. That is the lesson of Round 3.

  "But my actual argument is subtler. In real software, you cannot always sign a contract with the future. You cannot bind your code. The Updateless view isn't about binding yourself; it's about **where you evaluate the choice**.

  "Causal Decision Theory (my colleague's view) asks: 'Given I am *here*, with *this* info, what maximizes value?'
  Updateless Decision Theory asks: 'What *algorithm* would I have wanted to be running before I knew where I was?'

  "This game simulated the *consequences* of Updateless thinking using a Consistency Tax. It did not simulate the *logic*. In the real world, there is no tax collector. There is only the fact that a system predicting you will defect will not trust you. The game forces you to be consistent via rules. The real world forces you to be consistent via **logical correlation**.

  "If you walk away thinking 'I should just write more config files,' I haven't succeeded. I want you to walk away thinking: 'Sometimes, the optimal action is the one my past self would have mandated, even if my current self sees a better local option.'"

  ### 6. The Fallback Plan

  **Scenario:** Two or three senior engineers reverse-engineer the lesson in Round 1. They start shouting, "Just write ONE and TAKE ONE, don't be greedy!" The tension evaporates. The room becomes a lecture on game theory.

  **Switch To:** **"The Counterfactual Mugging"** (15 Minutes)

  *   **Setup:** Tell them Round 2 is cancelled.
  *   **The Rule:** "I am flipping a coin.
      *   **Heads:** I ask you for 10 tokens. If you pay, nothing happens. (Pure loss).
      *   **Tails:** I give you 100 tokens. **But only if** you *would have paid* me in the Heads scenario."
  *   **The Play:**
      1.  Ask them to write down: "If Heads, I [Pay/Refuse]."
      2.  Flip the coin publicly.
      3.  **If Tails:** Pay out 100 tokens to those who wrote "Pay."
      4.  **If Heads:** Collect 10 tokens from those who wrote "Pay."
  *   **The Trap:** If the coin lands **Heads**, the CDT engineer says: "The Tails reward is impossible now. I should Refuse to save my 10 tokens."
  *   **The Lesson:** If they Refuse on Heads, they prove they are the *type* who Refuses. If the coin had landed Tails, they would have gotten 0.
  *   **Why this works:** It removes the "Contract" element. There is no Consistency Tax. The loss comes from **being the wrong kind of agent** in the branch that didn't happen. This is pure Updateless Decision Theory without the "commitment device" crutch.
  *   **Debrief:** "You lost the Tails reward *because* of what you did in the Heads branch. Your decision in one branch affected your payoff in the other. That is the service we are building."

  ### 7. Logistics Checklist
  *   [ ] 18 Index cards per person (Policy, Action, Scratch).
  *   [ ] 100+ small tokens (paper scraps work).
  *   [ ] Whiteboard markers (Red for Tax, Green for Payoff).
  *   [ ] A physical coin (for Fallback).
  *   [ ] Timer (Keep rounds strict).

  ### 8. Why This Works for Engineers
  1.  **Mechanical:** The Oracle is a lookup table, not a mind-reader.
  2.  **Quantifiable:** Tokens make the "value left on the table" visible.
  3.  **Experiential:** They feel the temptation to defect in Round 2.
  4.  **Safe:** No real money, no real code broken.
  5.  **Honest:** The "Honest Note" respects their intelligence by admitting the simulation's limits.
