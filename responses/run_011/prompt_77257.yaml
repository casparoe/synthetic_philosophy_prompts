answer: |-
  **PREP SHEET: RENEWABLE ENTRENCHMENT**

  **1. The "Easy Amendment" Objection (Grad Students / General Theory)**
  *The Objection:* "Why build this complex expiry machine when the problem is just that Article V is too hard? If the worry is that the dead hand binds the living, why not just lower the amendment threshold? Your scheme adds uncertainty without solving the gridlock problem. If a supermajority can re-ratify, they could have amended. If they can't, you get lapse. What work is the expiry date actually doing?"
  *The Reply:* "Lowering the amendment threshold changes the cost of action, but it doesn't change the *attention* economy. Easy amendment means the constitution is always open for business, which incentivizes constant lobbying and partisan tweaking. My proposal creates a default stability with periodic 'attention shocks.' The expiry date forces a specific question: 'Do we still want this?' rather than 'Can we get enough votes to change this?' It shifts the burden from the future needing to mobilize to change, to the present needing to mobilize to keep. That distinction preserves the stabilizing function of entrenchment while solving the dead-hand problem. Easy amendment makes the constitution too fluid; renewable entrenchment makes it stable but accountable."
  *Soft Spot:* "If the supermajority requirement for re-ratification is the same as amendment, and the status quo is lapse, haven't you just made amendment *harder* for entrenched clauses? You've increased the cost of keeping the status quo, which functionally lowers the bar for change only if inertia is overcome. But if inertia wins, you lose the clause. How is that not just a high-stakes gamble on voter turnout?"

  **2. The "Market Uncertainty" Objection (Law & Econ)**
  *The Objection:* "Constitutional stability is a public good that facilitates long-term investment and planning. You're introducing a known, recurring shock to the legal foundation of the economy. Every generation, investors face a binary risk: will the property clause survive? Will the contract clause lapse? The transaction costs of a permanent campaign season will dwarf the benefits of 'warrant decay.' You're pricing in sovereign risk every twenty years."
  *The Reply:* "Uncertainty is costly, but *illegitimate* stability is costlier. Markets can price in a known schedule; they cannot price in a constitutional crisis where the text is obeyed but resented. My scheme creates a predictable timeline for uncertainty, which is manageable. More importantly, it prevents the slow rot of legitimacy that leads to extra-constitutional breakdowns—revolutions, coups, or total judicial usurpation. I'm trading low-level periodic volatility for high-level systemic risk. The 'permanent campaign' is already happening in the courts; I'm just moving it to the legislature where it's visible and accountable."
  *Soft Spot:* "You say markets can price in the schedule. But if a key economic provision lapses because of a temporary dip in turnout or a unrelated political scandal, you get a cliff-edge event, not a priced risk. How do you prevent a single failed re-ratification from triggering a recession?"

  **3. The "Authoritarian Capture" Objection (Comparative Constitutionalist)**
  *The Objection:* "I study eternity clauses. They exist because democracies can commit suicide. You're building a machine for authoritarian capture. A populist movement doesn't need to amend the constitution to dismantle checks and balances; they just need to wait for the expiry date and block re-ratification. You've turned the constitution into a lease that a temporary majority can simply choose not to renew."
  *The Reply:* "Eternity clauses assume the current generation knows better than all future generations about what protects democracy. History suggests they often get that wrong. But note my concession: basic rights and structural safeguards don't lapse, they require ceremonial reaffirmation. The 'expiry' applies to policy entrenchments and structural details, not the core democratic operating system. A populist movement can already capture the courts or ignore the text; giving them a vote on an old tax provision doesn't give them the bomb. It gives them a pressure valve."
  *Soft Spot:* "You say core safeguards only need 'ceremonial reaffirmation.' But if the political climate is hostile enough to let a provision lapse, isn't it hostile enough to make that ceremony a sham? If the mob is at the gates, does a 'yes' vote on rights mean anything? You've made the core dependent on the mood of the very moment you fear."

  **4. The "Sovereignty" Objection (Hobbesian Political Theorist)**
  *The Objection:* "You haven't limited sovereignty; you've just relocated the veto point. The sovereign is whoever decides the calendar and the re-ratification rules. By setting an expiry, you aren't binding the future; you're instructing them on how to exercise their power. But if they choose not to re-ratify, they aren't bound by your rule, they're just exercising their constituent power. The 'expiry' is illusory."
  *The Reply:* "I'm not trying to bind the sovereign in a metaphysical sense. I'm trying to structure the *exercise* of sovereignty to improve epistemic outcomes. The Hobbesian view assumes sovereignty is a binary on/off switch. I'm treating it as a maintenance requirement. The constraint isn't that they *can't* change it, it's that they *must* look at it. The 'binding' is on the silence, not the voice. I'm forcing the sovereign to speak, which makes their will legible. That's not a limit on power; it's a demand for clarity."
  *Soft Spot:* "If the sovereign can change the re-ratification rules themselves before the expiry hits, your whole mechanism is just a suggestion. Who binds the binder of the calendar?"

  **5. The "Rights Inconsistency" Objection (Living Constitutionalist)**
  *The Objection:* "You exempt basic rights from lapse but not structural provisions. But the dead hand problem is worst where rights are concerned. Why is the Electoral College or the Senate structure less important to revisit than the First Amendment? You've drawn a line between 'rights' and 'structure' that doesn't exist in practice. Structure determines rights."
  *The Reply:* "Because structure without rights is empty, but rights without structure are unenforceable. My distinction isn't about importance; it's about vulnerability. Structural provisions are tools; rights are ends. Tools need to be checked for fit; ends need to be protected from the tools. If we force a re-ratification of the First Amendment, we invite a majority to vote on minority protections. If we force a re-ratification of the Commerce Clause, we invite a debate on federalism. The former is dangerous; the latter is healthy. I'm insulating the shield while sharpening the sword."
  *Soft Spot:* "Who defines what counts as a 'basic right' eligible for exemption? If the Supreme Court decides that, you've just given them veto power over your entire theory. If the legislature decides, they'll exempt their own power grabs."

  **6. The "Warrant Decay Empirical" Objection (Originalists)**
  *The Objection:* "You claim provisions lose their 'warrant' over time. I claim they gain authority. Precedent and tradition *are* the warrant. A provision followed for 100 years has more reason behind it than one passed yesterday because it has survived the test of time. You're assuming decay where there might be accumulation. Why force a reboot on a system that works?"
  *The Reply:* "Survival isn't validation; it's often just inertia. A provision survives because it's too hard to remove, not because it's loved. That's the 'habit' I'm worried about. When a rule exists solely because 'we've always done it,' it's not a commitment, it's a rut. My recognition test asks: 'Do you endorse this for its reasons, or just its existence?' Accumulated authority is real, but it shouldn't be immune to the question of whether the original reason still obtains. I'm not deleting the precedent; I'm asking for a signature on it."
  *Soft Spot:* "If 90% of the public supports a provision, but 40% of the legislature blocks re-ratification for partisan leverage, the provision lapses. That's not testing the 'warrant,' that's testing the whip count. How do you distinguish warrant decay from partisan gridlock?"

  **7. The "Gridlock and Chaos" Objection (General Faculty)**
  *The Objection:* "We live in an era where passing a budget is a crisis. You want to put the Constitution up for a vote every generation? If re-ratification fails, does the law vanish? Do we revert to common law? Do we have a constitutional gap? You're inviting a crisis every twenty years where none exists today."
  *The Reply:* "That's why the schedule is staggered. The whole document never comes up at once. And if re-ratification fails, the lapse is the point. It means the political community no longer agrees on that rule. Better to have a gap filled by temporary legislation than a fiction enforced by judges. We pretend the Constitution is always coherent. I'm allowing it to admit when it isn't. The 'chaos' you fear is the sound of the system actually working instead of being patched by judicial fiat."
  *Soft Spot:* "A gap in the Commerce Clause isn't a minor administrative issue; it collapses the regulatory state. If that lapses, do you really believe the legislature can fill that void in time without economic collapse? Or does the Court just step in and 'interpret' the lapse away, rendering your mechanism moot?"

  **8. The "Ulysses Analogy" Objection (Political Theorists)**
  *The Objection:* "You say the crew enforces the binding, not the ropes. But the crew wasn't a future sovereign; they were subordinates following orders. Courts are more like the crew, but they aren't elected. If the crew decides to untie Ulysses because they think the Sirens are nice, Ulysses dies. If courts decide the 'warrant' has decayed, they strike down laws. Your mechanism just gives courts a new excuse to legislate from the bench based on 'current endorsement.'"
  *The Reply:* "Exactly. Currently, courts untie Ulysses and claim they're just reading the ropes. I want them to admit they're making a judgment about whether the ropes still hold. My mechanism moves that judgment from the judicial sphere to the legislative sphere. It forces the 'crew' (the legislature) to vote on untying, rather than letting the 'boatswain' (the Court) decide. It democratizes the Ulysses problem rather than judicializing it."
  *Soft Spot:* "But if the legislature fails to vote, the Court still has to decide the case. They will still have to determine if the provision lapsed. You haven't removed judicial discretion; you've just changed the statutory text they're interpreting. They will still be the ones deciding if the 'ceremonial reaffirmation' was sufficient."

  ***

  **STRATEGIC NOTES**

  **Concede in the First 5 Minutes:**
  1.  **Transaction Costs:** "Yes, this is expensive. Yes, it creates uncertainty. I am not claiming this is cost-free; I am claiming the cost of *not* doing it is higher."
  2.  **Capture Risk:** "I am not claiming this prevents authoritarianism. I am claiming it makes authoritarianism visible rather than hiding it in 'interpretation'."
  3.  **Judicial Role:** "Courts will still have to interpret the lapses. I am not removing judges; I am changing the text they read."

  **The Single Reply That Must Land:**
  **Objection #1 (Easy Amendment).** If you cannot distinguish your proposal from "just make amendment easier," the workshop will conclude you've solved a procedural problem with a structural sledgehammer. You must hammer home the difference between *lowering the barrier to change* (Easy Amendment) and *raising the requirement to persist* (Renewable Entrenchment). One invites constant tinkering; the invites periodic reflection.

  **The Question You Pray Nobody Asks:**
  "You concede basic rights don't lapse, only reaffirmed. Who has the authority to classify a provision as a 'basic right' versus 'structural policy'? If the Court decides, haven't you just given them the ultimate veto over your theory? If the Legislature decides, what stops them from classifying their own incumbency protections as 'basic rights' to exempt them from expiry?"
  *(Why this is lethal: It attacks your one fixed point concession. If you can't define the boundary of the exemption without circularity, the exemption swallows the rule.)*
