      *   *Reading 2 (Framing/Narrative):* Winners define the *meaning* of events, even if the facts are agreed upon.
      *   *Reading 3 (Systematic Distortion):* The archive isn't just incomplete; it's actively forged or coerced (e.g., paid coroner).
      *   *Reading 4 (Epistemic Privilege of the Oppressed):* The victims' memory is inherently more trustworthy because they have no motive to lie, whereas winners do.
      *   *Reading 5 (Radical Constructivism):* There is no fact of the matter; only competing narratives. Power determines truth.

  4.  **Evaluating Each Reading (Drafting the Analysis):**

