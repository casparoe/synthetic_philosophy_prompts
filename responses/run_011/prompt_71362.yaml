answer: |-
  As a philosopher of history concerned with the architecture of testimony, I will not offer you a comforting synthesis. The tension you describe is not a bug in historical practice; it is the feature. However, resolving it requires epistemic discipline, not slogans. Your colleague is using a maxim about power to bypass the rules of evidence. That is a category error.

  To understand why, we must dissect the slogan "history is written by the victors." It is not a single proposition but a bundle of distinct epistemic claims ranging from the banal to the incoherent. Let us lay them out, evaluate their truth and relevance to your 1911 fire, and determine if any of them license inscribing "Arson" on the plaque based solely on oral tradition.

  ### Candidate Readings of the Slogan

  **1. The Survival Bias Claim**
  *   **Claim:** The victors possess the resources to preserve documents; the losers' records are destroyed, lost, or never created.
  *   **Truth Value:** **True.** Archives are functions of capital and stability. Mill owners keep ledgers; workers keep memories.
  *   **Relevance:** **High.** It explains *why* the paper record exists and the oral tradition does not appear in the archives.
  *   **Licenses Preferring Memory?** **No.** Absence of evidence is not evidence of absence. Just because the workers didn't write a counter-report doesn't mean their memory of *intent* (arson) is factually correct. It only explains the *silence* of the archive, not the *falsity* of its content.

  **2. The Coercion/Corruption Claim**
  *   **Claim:** The victors actively manipulate the record at the source (e.g., bribing officials, forcing testimony).
  *   **Truth Value:** **Contingently True.** This happens often in labor history.
  *   **Relevance:** **Critical.** This is the specific allegation: the coroner was paid.
  *   **Licenses Preferring Memory?** **Conditionally.** If you have independent evidence of corruption (e.g., ledgers showing "consulting fees" to the coroner), then yes, the document is poisoned. But the slogan *itself* is not evidence of corruption. It is a hypothesis that requires verification. You cannot assume corruption merely because the owner won the inquest.

  **3. The Hermeneutical Claim**
  *   **Claim:** The victors control the *language* and *categories* used to describe events (e.g., framing a strike as a "riot," or a fire as an "accident").
  *   **Truth Value:** **True.** Power dictates nomenclature.
  *   **Relevance:** **Medium.** "Faulty wiring" is a technical framing that absolves moral agency. "Arson" assigns it.
  *   **Licenses Preferring Memory?** **No.** Framing affects *meaning*, not *mechanics*. A fire is either chemically accelerated or it isn't. Changing the label doesn't change the combustion. Oral tradition can correct the *moral narrative*, but it cannot override physical causality without corroboration.

  **4. The Standpoint Epistemology Claim**
  *   **Claim:** The oppressed have epistemic privilege regarding the nature of their oppression; they have less motive to lie than the oppressor.
  *   **Truth Value:** **Debatable/Partial.** Victims often see power dynamics clearer than beneficiaries. However, memory degrades, and rumors solidify into fact over generations.
  *   **Relevance:** **High.** It gives *prima facie* weight to the families' testimony.
  *   **Licenses Preferring Memory?** **Not Automatically.** It shifts the burden of proof, but it does not discharge it. A consistent lie is still a lie. If the workers believed it was arson in 1911 because they hated the owner, and passed that down, the consistency of the tradition reflects social cohesion, not necessarily historical fact.

  **5. The Radical Constructivist Claim**
  *   **Claim:** There is no objective past; there are only competing narratives, and the "truth" is simply the one enforced by power.
  *   **Truth Value:** **False.** Fires happen in reality, not just in texts.
  *   **Relevance:** **None.** If accepted, history becomes propaganda.
  *   **Licenses Preferring Memory?** **Yes, but pointlessly.** It licenses *any* claim. If truth is just power, and the historical society now holds the power, you could write anything. This dissolves the distinction between history and fiction.

  ---

  ### The Verdict on Your Colleague

  Your colleague is conflating **Reading 2 (Corruption)** with **Reading 5 (Constructivism)**.

  They are arguing that because the owner *had the power* to write the record (Reading 1 & 3), the record *must be false* and the oral tradition *must be true* (a slide into Reading 5). They are treating the slogan as a **warrant** (a justification for belief) when it is actually a **defeater** (a reason for skepticism).

  "History is written by the victors" is a heuristic for *doubt*, not a method for *discovery*. It tells you to scrutinize the inquest transcript for signs of coercion. It does not tell you that the oral tradition is therefore fact. To move from "The inquest might be rigged" to "It was definitely arson" requires positive evidence for arson, not just negative evidence against the inquest.

  **My Judgment:** The slogan does **not** license placing "Arson" on the plaque. It licenses placing "Cause Disputed" or "Alleged Arson." To assert arson as fact based solely on the slogan is to commit the same epistemic violence you accuse the owner of: imposing a narrative because it suits your moral position, rather than because the evidence sustains it.

  ### Where the Slogan Undercuts Itself

  You sensed the instability, and you are right. The slogan is self-referentially unstable in this specific context.

  1.  **The Existence Problem:** How do you know there was a fire in 1911? You know because of... the newspapers and the inquest record. If "history is written by the victors" means the written record is inherently untrustworthy propaganda, then the *existence* of the fire is also suspect. The oral tradition relies on the victor's record to establish the *event*, while rejecting that same record to establish the *cause*. This is selective skepticism.
  2.  **The Transmission Problem:** Oral tradition is not a vacuum-sealed vault. It travels through time via language, community structures, and often... written local histories. If the "victors" control the archive, they also control the schools, the libraries, and the local press that the descendants read over the last 110 years. How do you know the oral tradition isn't a reaction to the *published* history rather than a memory of the event? The "victor's narrative" often shapes the "victim's counter-memory" just as much as the event itself.
  3.  **The Victory Problem:** Who won? The owner collected the insurance in 1911. But the workers' descendants are on the board *now*. In the context of the plaque, *you* are the current victors. If history is written by the victors, and you now hold the pen, why are you abdicating your responsibility to verify truth in favor of a narrative you prefer?

  ### Recommendation

  Do not let the slogan do the work.

  1.  **Treat the Oral Tradition as Testimony:** In social epistemology, testimony is a valid source of knowledge, but it is subject to defeaters. The "paid coroner" claim is a specific defeater for the document. Investigate it. Look for insurance payout ratios. Look for other fires in the owner's portfolio.
  2.  **The Plaque:** If the investigation yields no smoking gun (no documentary proof of bribery, no physical evidence of accelerant preserved), you cannot ethically assert "Arson" as fact.
      *   **Option A:** "In Memory of [Names]. Died in the Mill Fire of 1911." (Safe, honors the dead).
      *   **Option B:** "In Memory of [Names]. Died in the Mill Fire of 1911. Official cause: Accident. Community tradition: Arson." (Historically honest).

  Your colleague wants to use the plaque to correct a moral wrong. That is a political act, not a historical one. As historians, our duty is to the truth of the past, not the justice of the present—though often, revealing the truth *is* the justice. But you cannot manufacture the truth to serve the justice. If the owner got away with murder, the tragedy is compounded if we lie to prove it.
