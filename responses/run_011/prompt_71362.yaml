      *   *Reading 2 (Framing):* True. Relevant? Yes, "accident" vs. "crime" is a frame. Does it license memory? No, framing doesn't change physical causality (wire vs. accelerant).
      *   *Reading 3 (Active Corruption):* Contingently true. Relevant? Highly. The claim is the coroner was *paid*. If true, the archive is poisoned. Does it license memory? Yes, *if* we have independent reason to suspect corruption. But the slogan alone doesn't prove corruption.
      *   *Reading 4 (Standpoint Epistemology):* Controversial. True? Not necessarily. Oppressed can have false beliefs too. Relevant? Yes. Does it license memory? It gives *prima facie* weight to testimony, but doesn't override physical evidence without corroboration.
      *   *Reading 5 (Radical Relativism):* False (philosophically). Relevant? No. Does it license memory? It licenses *anything*, which is useless.

  5.  **Developing the "Undercutting" Point:**
