  1. **Sub-questions and Probabilities**

  *   **Is "being affected" a pre-institutional fact with natural boundaries?** (0.10)
      Causal chains extend indefinitely in space and time, requiring a normative cut-off that cannot be derived from the causality itself. Any threshold for "significant" impact reintroduces the very political judgement the principle seeks to bypass.

  *   **Does subjection to coercion provide an objective boundary independent of legal jurisdiction?** (0.15)
      The scope of coercion is defined by the state's own claim to authority, meaning the boundary of the demos presupposes the boundary of the jurisdiction. Distinguishing coercion from mere influence or pressure requires a prior normative classification of power.

  *   **Can a self-applying criterion govern its own extension without circularity?** (0.12)
