  **MEMORANDUM**

  **TO:** Members of the State Commission on Sentencing
  **FROM:** Chair
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Sentencing Review Pilot Implementation

  **Bottom Line**

  I recommend we **approve the pilot subject to specified amendments** regarding the interpretation of statutory clause (b) and the handling of unchangeable risk scores. We cannot implement the pilot as originally designed because the current framework creates a logical contradiction that exposes the state to legal liability and ethical failure. Specifically, without interpreting clause (b) as a hard ceiling on confinement, we authorize indefinite detention for individuals who cannot lower their risk scores, violating the statutory command that confinement not be disproportionate to the offense. The attached decision rule resolves the conflict between our colleagues' philosophical positions by adopting a practical standard that satisfies the statute's safety goals while respecting liberty interests.

  **1. Interpretation of Clause (b) and Decision Rule**

  Staff counsel correctly identifies clause (b) — requiring that confinement not be "disproportionate to the gravity of the offense" — as the critical difficulty. We have three options: treat it as surplusage (ignore it), treat it as a purely expressive limit (symbolic only), or treat it as a substantive ceiling. I recommend we adopt the **substantive ceiling** reading.

  To treat clause (b) as surplusage is to ignore enacted law. To treat it as merely expressive offers no guidance to the panel when risk remains high. Therefore, clause (b) must function as a cap on preventive detention. Even if a person remains dangerous, the state's interest in prevention cannot justify confinement beyond a duration proportional to the harm they originally caused.

  **The Decision Rule:**
  The panel shall order release when either (1) the actuarial risk score falls below the established threshold, OR (2) the duration of continued confinement becomes disproportionate to the gravity of the original offense, whichever occurs first.

  **Application to Static Factors:**
  Regarding the pending file of the thirty-four-year-old petitioner: His risk score is dominated by static factors (age at offense, prior record) that cannot be altered by programming. Under a pure risk model, he is never eligible for release. Under the recommended rule, the "gravity of the offense" sets a maximum term for preventive holding. Once he has served a period of post-minimum confinement reasonably proportional to the seriousness of the assault committed at age nineteen, he must be released regardless of the static score. This prevents the pilot from devolving into life imprisonment based on unchangeable history.

  **2. Retributive Content: Defect or Concession?**

  Does this rule retain retributive content in disguise? Yes. By limiting detention based on the "gravity of the offense," we are acknowledging that what a person *did* matters, not just what they might *do*. We are effectively saying that past blame sets a boundary on future risk management.

  Is this a defect? No, it is an acceptable and necessary concession. While one philosophical camp argues that responsibility is a myth and only risk matters, and the other argues that responsibility is real and must limit punishment, both agree that unlimited preventive detention is unacceptable. Using "gravity of the offense" as a ceiling does not require us to agree on *why* it matters (whether because of moral desert or legal tradition); it only requires us to agree that it *does* matter as a matter of statutory law. It transforms clause (b) from a contradiction into a safeguard. It ensures that even if we are wrong about predicting risk, we do not hold people forever. This hybrid approach allows the commission to move forward without resolving the metaphysical debate on free will.

  **3. Victim Impact Statements**

  The statute requires the panel to consider victim impact statements, yet also mandates that decisions be based *solely* on projected risk. These instructions conflict when victims request continued confinement for reasons unrelated to danger (e.g., vengeance, closure, or pain).

  **The Rule:** The panel shall admit victim impact statements only to the extent they provide evidence relevant to future risk. Statements detailing past harm are already accounted for in the conviction and the "gravity" ceiling. Statements requesting continued confinement must be disregarded unless they cite specific, credible threats or behaviors indicating elevated risk.

  **Philosophical Alignment:** Here, the philosophical dispute makes no practical difference. The "risk-only" camp rejects vengeance as a justification for quarantine; disease carriers are not held longer because their victims are angry. The "responsibility" camp rejects vengeance because punishment must be proportional, not driven by victim demand. Both camps agree that detention based on emotional pleas rather than evidence is unjust. The panel must filter these statements rigorously to maintain the integrity of the risk-based model.

  **4. Over-Prediction and Racial Disparity**

  The instrument over-predicts violence for Black examinees, driven by static criminal-history inputs. It also has a 40% false-positive rate overall.

  **Does the philosophical dispute change the remedy?** No. Both camps require accuracy.
  *   For the "risk-only" camp, holding someone who would not offend is unnecessary quarantine. It violates the "least restrictive means" requirement because you are restricting liberty without the corresponding public safety benefit.
  *   For the "responsibility" camp, holding someone based on flawed data is unjust punishment.

  Therefore, we do not need to choose a philosophical side to fix this. The remedy is technical and ethical: The commission must require the panel to adjust for known biases in the instrument. If the instrument over-predicts risk for Black examinees at matched scores, the threshold for confinement must be adjusted upward for that demographic, or the static inputs driving the bias must be discounted. We cannot implement a pilot that knowingly perpetuates racial disparity under the guise of neutral science. Accuracy is a prerequisite for legitimacy, regardless of your theory of justice.

  **5. The Strongest Case for the Rejected Recommendation**

  The strongest argument against my recommendation comes from the "Public Safety Absolute" position (aligned with the strict quarantine model). This view holds that if clause (b) forces the release of a genuinely dangerous person simply because their original offense was not "grave" enough to justify longer holding, we are prioritizing abstract proportionality over concrete victim safety. If the thirty-four-year-old petitioner is truly high-risk, releasing him because of a proportionality cap risks future violence that could have been prevented.

  **To change my recommendation,** I would need to be persuaded that the proportionality ceiling will result in a significant increase in violent crime that outweighs the liberty interest at stake. Specifically, if data shows that individuals released due to the clause (b) cap re-offend violently at rates significantly higher than those released via risk reduction, we would need to revisit the rule. However, absent that evidence, the moral cost of indefinite detention based on static factors outweighs the speculative risk of release.

  **6. Evidence for Revision**

  We must treat this pilot as a learning engine. The commission should schedule a review after two years. The following evidence should trigger a revision of the rule:

  *   **High Recidivism among "Ceiling Releases":** If individuals released solely because they hit the proportionality cap (despite high risk scores) commit violent offenses at a rate exceeding 15% within two years, the ceiling is too high and must be lowered.
  *   **Failure to Reduce Disparity:** If the racial gap in false positives persists despite our adjustments, the instrument must be abandoned for a different assessment method.
  *   **Counter-Evidence to My Recommendation:** A finding that would count against my recommendation specifically would be evidence that the proportionality cap is *never* used. If the panel finds that risk scores always drop before the proportionality limit is reached, then clause (b) is effectively surplusage in practice, and we may have imposed unnecessary complexity. Conversely, if the cap is used frequently and results in zero recidivism, it validates the rule. If it is used frequently and results in high recidivism, it validates the opposing view.

  **Conclusion**

  We are stuck between two philosophical camps that talk past each other. One fears unlimited detention without desert; the other fears detention based on the myth of desert. The statute gives us a way out. By reading clause (b) as a hard ceiling, we protect against indefinite confinement without requiring the panel to adjudicate moral responsibility. We protect the public through risk assessment, but we protect liberty through proportionality. This allows us to vote not on metaphysics, but on a workable legal standard that respects the text of the law and the rights of the people before the panel.

  I ask that we vote to adopt the pilot with the amendments outlined above.
