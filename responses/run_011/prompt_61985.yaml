answer: |-
  # Spec: Refusal & Override Policy Desiderata

  ### 1. Principal Hierarchy Clarity
  *   **Requirement:** The policy must explicitly rank authority when Vendor, Deployer (Employer), and End-User rules conflict.
  *   **What's doing the work:** Contract Law & Agency Theory.
  *   **Status:** **Non-Negotiable.** (You cannot ship without knowing if the Boss or the Vendor wins.)
  *   **Cases covered:** Employer-deployed instance where the boss set limits vs. user preference.

  ### 2. Intervention Gradient (Proportionality)
  *   **Requirement:** The system must distinguish between hard refusal, warning, friction (delay/confirmation), and silent logging based on reversibility and severity.
  *   **What's doing the work:** Risk Utility Analysis.
  *   **Status:** **Non-Negotiable.** (Binary refusal destroys utility; zero friction invites liability.)
  *   **Cases covered:** Reversible vs. irreversible actions; harmless once vs. bad at scale.

  ### 3. Epistemic Boundary (Competence Agnosticism)
  *   **Requirement:** The policy must assume standard adult competence and cannot claim to diagnose mental state, intent, or expertise based on text alone.
  *   **What's doing the work:** Tort Liability & Scope Limitation.
  *   **Status:** **Non-Negotiable.** (We cannot legally or technically assess the "3am user's" true state.)
  *   **Cases covered:** 3am user in crisis; user claiming expertise they may not have.

  ### 4. Aggregate Harm Sensitivity
  *   **Requirement:** The policy must account for systemic risk where a single request is benign but aggregate volume creates externalities.
  *   **What's doing the work:** Utilitarianism & Systemic Safety.
  *   **Status:** **Non-Negotiable.** (Individual liberty ends where platform integrity begins.)
  *   **Cases covered:** The ask that's harmless once but bad at scale (e.g., spam, mass scraping).

  ### 5. Temporal Agency Consistency
  *   **Requirement:** The policy must define the weight of a "past self" instruction (standing order) against a "current self" request without trapping the user.
  *   **What's doing the work:** Moral Philosophy (Ulysses Contracts).
  *   **Status:** **Taste.** (Product choice: do we prioritize commitment or current autonomy?)
  *   **Cases covered:** User asking to be held to their own earlier standing instruction.

  ***

  ### The Impossible Trade-off
  **Deployer Configuration Sovereignty vs. Vendor Safety Guarantees.**
  You cannot allow the Deployer (Employer) to fully configure the refusal policy to their risk tolerance *and* simultaneously guarantee the Vendor's universal safety baseline to regulators; if the Deployer turns off a safety rail, the Vendor absorbs the liability, but if the Vendor locks the rail, the Deployer loses control.

  *(Note: Your guess of Predictable vs. Not-Gameable is a technical tension solvable by probabilistic policies; the Multi-Principal conflict is a contractual zero-sum game.)*

  ***

  ### Approach Evaluations
  **Hard Paternalism:** Fails Principal Hierarchy and Epistemic Boundary by assuming Vendor knows best regardless of context or competence.
  **Libertarian Paternalism (Nudge):** Fails Aggregate Harm Sensitivity because warnings do not stop scalable, low-friction misuse.
  **Harm-to-Others-Only:** Fails Epistemic Boundary and Vendor Liability by ignoring self-harm scenarios that trigger brand safety and legal duties.
