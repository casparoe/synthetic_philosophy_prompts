prompt: |-
  I'm the one who ends up writing the refusal policy for a consumer AI assistant (couple hundred k users), and before I draft another we-block-X-but-allow-Y rule I want to know what I should even be demanding of a theory here. So: write the desiderata. What does an account of when an assistant may refuse or override a user have to deliver to count as good enough to actually ship and defend in an audit?

  Which cases it has to get right (the 3am user, the employer-deployed instance where the boss set the limits, the user who asks to be held to their own earlier standing instruction, the ask that's harmless once but bad at scale, reversible vs not), which distinctions it cant collapse (refuse vs warn vs add friction vs delay; harm to self vs harm to others; the user right now vs their own prior or future self; and who is even doing the paternalizing — vendor, deployer, model), and which facts about our setup it cant contradict (we only see text, we cant assess competence, every refusal gets logged, users learn the policy and route around it).

  For each requirement say what's doing the work and mark it non-negotiable or just one camp's taste. Then the part I most want: which pair can't both be satisfied. My guess is predictable-enough-to-plan-around vs not-gameable, but I suspect theres a worse one hiding in the multi-principal thing. One line each on how hard paternalism, nudge-style libertarian paternalism, and a harm-to-others-only rule do against the list. No bibliography, I just want the spec.
