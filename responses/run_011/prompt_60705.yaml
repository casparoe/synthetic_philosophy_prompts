answer: |-
  # Desiderata for an Account of Phenomenal Composition

  To function as a metaphysical backdrop for a comparative research program on non-nervous consciousness, a theory of phenomenal composition must move beyond abstract coherence and offer operational traction. The following requirements specify what the theory must deliver.

  ### 1. The Subjecthood Criterion
  **Requirement:** The theory must provide a principled criterion for distinguishing systems that are subjects of experience from those that are not. This criterion cannot be a threshold calibrated post-hoc to match human intuition (e.g., "complexity like ours"); it must be intrinsic to the ontology.
  **Motivation:** In a research program comparing slime moulds, plants, and organoids, you must know *where* the consciousness is located. Is it the cell, the network, or the molecule? Without this, the program cannot design experiments to detect signalling correlates of experience.
  **Classification:** (ii) Negotiable in general metaphysics (some theories are vague on boundaries), but non-negotiable given the purpose above. A research program requires operationalizable definitions.

  ### 2. Phenomenal Derivation (The Combination Constraint)
  **Requirement:** The character of the macro-level experience must be explicable from the micro-level ones, not merely correlated with them. The theory must explain how the *what-it-is-like* of the whole arises from the *what-it-is-like* of the parts.
  **Motivation:** If the macro-experience is merely correlated with micro-experiences, the view collapses into emergentism or property dualism, failing to solve the hard problem via the panpsychist route. The point of panpsychism is to ground consciousness in the fundamental fabric, not to have it pop into existence at a higher level.
  **Classification:** (i) Non-negotiable for any theory claiming to be panpsychist. If this is abandoned, it is not panpsychism.

  ### 3. Mereological Status (Constitution vs. Causation)
  **Requirement:** The theory must explicitly state whether micro-experiences are *constituents* of the macro-experience (mereological sum) or *causes* of it (generative relation).
  **Motivation:**
  *   **Constitution:** Risks the "incoherence of addition" (how does pain + pain make a unified pain?).
  *   **Causation:** Risks collapsing into standard emergentism (micro-physical properties cause macro-phenomenal properties), which reintroduces the explanatory gap the program seeks to close.
  **Classification:** (i) Non-negotiable for any theory in this area. Ambiguity here renders the mechanism of composition unintelligible.

  ### 4. The Access Asymmetry
  **Requirement:** The theory must explain why a subject can attend to the unified macro-state but never to its alleged micro-constituents, without brute-stipulating this as a "brute fact."
  **Motivation:** We do not feel the individual firing of neurons or the signalling of individual plant cells, even if we accept they are subjects. A theory that posits them as parts of our experience owes an explanation for their phenomenal invisibility within the whole.
  **Classification:** (i) Non-negotiable for any theory in this area. It is a robust phenomenological datum that any account of composition must accommodate.

  ### 5. Causal Efficacy of the Micro-Phenomenal
  **Requirement:** The theory must specify whether micro-phenomenal properties are causally inert. If they are inert, the theory must explain why they are posited at all. If they are efficacious, it must explain how they avoid causal overdetermination with the physical base.
  **Motivation:** If micro-experiences do nothing, they are epiphenomenal danglers, violating principles of parsimony and naturalistic closure. If they do something, they must integrate with the causal story of the system (e.g., plant signalling pathways).
  **Classification:** (i) Non-negotiable for any theory in this area. A theory of consciousness that renders consciousness causally irrelevant is scientifically useless for a research program investigating signalling.

  ### 6. The Counting Coherence
  **Requirement:** The theory must address whether "counting subjects" is a well-defined operation. It need not promise a low number of subjects, but it must define what constitutes a distinct subject versus a subdivision of a subject.
  **Motivation:** The "counting objection" claims panpsychism posits too many subjects. However, before accepting this objection, one must know if "subject" is a countable noun in the ontology. If subjecthood is vague or degree-based, the objection misfires.
  **Classification:** (iii) A prejudice of the Physicalist/Eliminativist camp. The demand for ontological parsimony (fewer subjects) should not override phenomenological or metaphysical accuracy. However, *definability* is required for the research program.

  ### 7. Behaviour Under Partial Disruption
  **Requirement:** The theory must predict the fate of the subject under gradual degradation, anaesthesia, or structural bisection (e.g., callosal section). Does the subject vanish, split, or dim?
  **Motivation:** Empirical data shows consciousness fragments under physical disruption. A theory of composition must map structural integration to phenomenal unity. If integration breaks, does the macro-subject cease to exist, revealing the micro-subjects?
  **Classification:** (ii) Negotiable in general metaphysics (some theories are ahistorical), but non-negotiable given the purpose above. The research program relies on manipulating systems to observe changes in signalling/experience correlates.

  ### 8. Structural Isomorphism (Added Requirement)
  **Requirement:** There must be a mapping between the causal/functional structure of the system (e.g., network topology) and the structure of the experience (e.g., unity, differentiation).
  **Motivation:** To study non-nervous systems, you need to infer experience from structure. If the theory allows for high experience in low-structure systems (or vice versa) without rule, it offers no predictive power for the comparative program.
  **Classification:** (ii) Non-negotiable given the purpose above. Without this, the program cannot generate hypotheses about which systems to test.

  ***

  # Analysis of Joint Satisfiability

  ### The Fatal Tension
  There is a subset of requirements that appears jointly unsatisfiable for the standard **Constitutive Bottom-Up** model. Specifically, the tension between **Requirement 2 (Phenomenal Derivation)** and **Requirement 4 (Access Asymmetry)**.

  If micro-experiences are *constituents* of the macro-experience (Req 3, Constitutive), then the macro-experience is built of them. If it is built of them, the macro-subject should, in principle, have access to its own constitution. To claim the macro-subject is constituted by micro-subjects but cannot access them (Req 4) requires a mechanism of "phenomenal masking" that is as mysterious as the emergence it seeks to avoid.

  Conversely, if the theory chooses the **Causal Route** (Req 3, Causal) to solve the Access Asymmetry (micro-experiences cause the macro, so they aren't *in* it), it immediately violates **Requirement 2 (Phenomenal Derivation)**. If micro-experiences merely *cause* the macro-experience, the macro-experience is emergent. This collapses the view into a form of property dualism or non-reductive physicalism, abandoning the core panpsychist claim that consciousness is fundamental and ubiquitous.

  ### The Eliminator
  The single requirement that eliminates the most candidates is **Requirement 2 (Phenomenal Derivation)** combined with **Requirement 3 (Mereological Status)**.
  *   **Constitutive views** fail on Asymmetry (Req 4).
  *   **Causal views** fail on Derivation (Req 2) because they admit emergence.

  **Verdict:** If the constitutive route is knocked out by the Access Asymmetry, and the causal route is knocked out by the demand for Non-Emergent Derivation, then the real choice is not among panpsychist theories but between **Panpsychism and Emergentism**. The desiderata suggest that a theory satisfying all conditions may not exist within the panpsychist family. The research program risks building on a metaphysical impossibility unless it relaxes Req 2 (allowing weak emergence) or Req 4 (accepting we might access micro-states, which contradicts data).

  ***

  # Symmetry Audit: Bottom-Up vs. Top-Down

  The list above contains a structural bias toward **Bottom-Up** views (many micro-subjects aggregating). A **Top-Down** view (Cosmopsychism or Differentiated Unity: one universal mind differentiating into apparent local subjects) faces mirror-image problems.

  1.  **Subjecthood Criterion (Req 1):**
      *   *Bottom-Up Bias:* The list assumes we need to find where subjects *start*.
      *   *Top-Down Problem:* The Top-Down view says there is only *one* subject (the Universe). It struggles to explain why local systems (plants, organoids) behave *as if* they are distinct subjects with private access. It must treat local agency as an illusion or a fragmentation, which conflicts with the research program's goal of treating them as genuine agents.
      *   *Severity:* High. It undermines the comparative nature of the program.

  2.  **Behaviour Under Disruption (Req 7):**
      *   *Bottom-Up Bias:* Assumes breaking the structure breaks the subject.
      *   *Top-Down Problem:* If the One Mind is fundamental, why does cutting the corpus callosum fragment the experience? The Top-Down view must claim the One Mind *chooses* to limit its own access based on physical damage. This is ad hoc and less parsimonious than the Bottom-Up explanation (binding mechanism broke).
      *   *Severity:* High. Bottom-Up fits the empirical data of fragmentation better.

  3.  **Access Asymmetry (Req 4):**
      *   *Bottom-Up Bias:* Why can't we see the parts?
      *   *Top-Down Mirror:* Why can't we see the *Whole*? If we are modifications of the One Mind, why is our access restricted to this local body?
      *   *Severity:* Comparable. Both views require a "veil"—Bottom-Up veils the micro, Top-Down veils the macro.

  **Conclusion on Symmetry:** The list is not neutral. Requirements 1, 7, and 8 pressure the Top-Down view more severely than the Bottom-Up view because the research program is designed to investigate *distinct systems*. A Top-Down metaphysics renders the comparative program category-error prone (comparing fragments of one thing rather than distinct things). However, the Bottom-Up view faces the harder *metaphysical* problem (Combination), while the Top-Down view faces the harder *empirical* problem (Fragmentation).

  ***

  # Scoring the Contenders

  **Constitutive Bottom-Up Panpsychism**
  *   **Score:** Low.
  *   **Verdict:** Fails the Access Asymmetry requirement. It posits that micro-experiences are parts of our experience, yet we cannot access them. This requires a "phenomenal masking" mechanism that is unexplained and arguably incoherent. It satisfies the research program's need for distinct subjects but fails the metaphysical demand for intelligible composition.

  **Top-Down Differentiated Unity (Cosmopsychism)**
  *   **Score:** Medium.
  *   **Verdict:** Solves the Combination Problem (nothing needs to combine) and Access Asymmetry (we are fragments, so we don't see the whole). However, it fails the Subjecthood and Disruption requirements crucial for this research program. It cannot easily explain why damaging a plant's network degrades a "subject" if the subject is fundamentally universal. It makes the research program's comparative approach metaphysically suspect.

  **Russellian/Neutral Monism**
  *   **Score:** Medium-High (with caveats).
  *   **Verdict:** By treating the intrinsic nature of matter as proto-phenomenal rather than fully phenomenal, it sidesteps the hard Combination Problem (proto-experiences don't need to sum to full experiences in the same way). However, it risks vagueness on Requirement 2 (Derivation). It is the most usable for the research program as it allows structural mapping (Req 8) without committing to the full baggage of micro-subjects, but it may not satisfy the "consciousness everywhere" ambition of strict panpsychism.
