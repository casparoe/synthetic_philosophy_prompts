prompt: |-
  I am helping to design a comparative research program on consciousness in systems without nervous systems — plant signalling, cortical organoids, distributed computation of the slime-mould kind — and one candidate metaphysical backdrop for that program is panpsychism, in whichever version can actually do the work. Before I either commit the program to it or set it aside, I want the specification such a theory must satisfy. Write the desiderata for an account of phenomenal composition: what a theory has to deliver in order to be usable in that setting, and in order to count as adequate at all.

  For each requirement, give the consideration or case that motivates it, and then classify it as (i) non-negotiable for any theory in this area, (ii) negotiable in general but non-negotiable given the purpose above, or (iii) a prejudice of one particular camp that should not be imposed on the others. In the third class, name the camp doing the imposing.

  The list should cover at least the following, and you should add whatever I have missed:

  - What the theory must say about which composites are subjects and which are not, and whether the criterion offered is internal to the theory or a threshold calibrated to fit the human case.
  - The demand that the character of a macro-level experience be explicable from the micro-level ones rather than merely correlated with them, together with the prior question of whether that demand is even coherent.
  - The choice between treating micro-experiences as parts or constituents of a macro-experience and treating them as its causes, and the distinct problem each route generates.
  - The asymmetry whereby we can apparently attend to the unified state but never to its alleged constituents, and what the theory owes by way of explaining that asymmetry rather than brute-stipulating it.
  - Whether the micro-phenomenal properties are permitted to be causally inert, and whether the permissibility of that differs for a panpsychist than for a physicalist.
  - The counting objection — that the view posits an extravagant population of subjects — including the question, prior to it, of whether counting subjects is a well-defined operation at this level.
  - Behaviour under partial disruption: anaesthesia, callosal section, gradual degradation of integrating machinery, and any case in which a system loses half of what supposedly binds it.

  Then give me what I most want to see: whether any subset of these requirements is jointly unsatisfiable, and which single requirement eliminates the most candidates. If the constitutive route and the causal route are each knocked out by different members of the list, say so plainly, since that would mean the real choice is not among panpsychist theories but between panpsychism and something else.

  Finally, audit the list for symmetry. A specification that pressures bottom-up views while leaving the top-down alternative — one mind whose states are differentiated, rather than many minds whose states are aggregated — untouched would be question-begging. Tell me whether any of the requirements has that defect, and whether the differentiated-unity view faces a mirror-image problem of comparable severity.

  Score the main contenders briefly at the end — constitutive bottom-up panpsychism, the top-down alternative, and neutral or Russellian-style monism insofar as it competes for the same job — but keep each verdict to a few lines; the weight belongs on the requirements and their motivating cases. No bibliography, no citations, no reading list: refer to positions and arguments descriptively and I will supply the references myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Design a comparative research program on consciousness in non-nervous systems (plants, organoids, slime moulds) using panpsychism as a candidate metaphysical backdrop.
      *   **Task:** Write desiderata (requirements) for an account of *phenomenal composition* (how micro-experiences combine into macro-experiences).
      *   **Structure:**
          *   List requirements with motivating cases.
          *   Classify each requirement: (i) Non-negotiable (any theory), (ii) Non-negotiable (for this specific research program), (iii) Prejudice (name the camp).
          *   Cover specific topics provided (subject criterion, explicability vs. correlation, parts vs. causes, asymmetry of attention, causal inertness, counting objection, partial disruption).
          *   Add missing requirements.
          *   Analyze joint satisfiability (which requirements kill which theories).
          *   Audit for symmetry (bottom-up vs. top-down bias).
          *   Score main contenders briefly.
          *   **Constraints:** No bibliography, no citations, descriptive references only.

  2.  **Deconstruct the Specific Topics & Generate Desiderata:**

      *   *Subject Criterion:* Need a rule for when a system is a subject. Is it intrinsic or calibrated to humans?
      *   *Explicability:* Must macro-experience be *explained* by micro, or just correlated? Is "phenomenal addition" coherent?
      *   *Parts vs. Causes:* Constitutive panpsychism (micro are parts of macro) vs. Emergentist/Causal panpsychism (micro cause macro).
      *   *Asymmetry of Attention:* We see the whole, not the parts. Why?
      *   *Causal Inertness:* Can micro-phenomenal properties do nothing? (Epiphenomenalism).
      *   *Counting Objection:* Too many subjects? Is counting well-defined?
      *   *Partial Disruption:* What happens when integration breaks (split-brain, anesthesia)?

      *   *Missing Topics to Add:*
          *   Temporal Dynamics (binding over time).
          *   Information/Structure Mapping (does phenomenal structure match causal/functional structure?).
          *   Normativity/Valence (does the system care?).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Req 1: The Subjecthood Criterion.*
          *   Motivation: Research needs to know *where* to look (plant vs. cell vs. molecule).
          *   Classification: (ii) Non-negotiable for the program (need to identify subjects to study them), but maybe (i) generally (theory of consciousness needs subjects). Let's go with (ii) because a general theory might be vague, but a research program needs operationalizability.
      *   *Req 2: Phenomenal Derivation (The Combination Problem).*
          *   Motivation: If macro isn't derived from micro, it's just emergence (physicalism).
          *   Classification: (i) Non-negotiable for panpsychism specifically. If it fails this, it's not solving the hard problem via panpsychism.
      *   *Req 3: Mereological Status (Constitution vs. Causation).*
          *   Motivation: Are micro-experiences *in* the macro or do they *make* it?
          *   Classification: (i) Non-negotiable (must pick a lane).
      *   *Req 4: The Access Asymmetry.*
          *   Motivation: We don't feel our neurons firing.
          *   Classification: (i) Non-negotiable (phenomenological datum).
      *   *Req 5: Causal Efficacy.*
          *   Motivation: If micro-phenomenal properties do nothing, why posit them? (Exclusion problem).
          *   Classification: (i) Non-negotiable for a naturalistic theory.
      *   *Req 6: Subject Counting.*
          *   Motivation: Ontological parsimony vs. reality.
          *   Classification: (iii) Prejudice of the Physicalist/Eliminativist camp (demanding parsimony over phenomenological accuracy). Or maybe (ii) for the program (need to know how many agents we are studying). Let's classify the *demand for low numbers* as (iii).
      *   *Req 7: Degradation & Boundary Conditions.*
          *   Motivation: Split-brain, anesthesia.
          *   Classification: (i) Non-negotiable (empirical constraint).
      *   *Req 8: Structural Isomorphism (Added).*
          *   Motivation: Does the structure of experience match the structure of the system?
          *   Classification: (ii) Non-negotiable for this program (need to map signalling to experience).

  4.  **Analyzing Joint Satisfiability (The "Kill Shot"):**
      *   The "Combination Problem" is the big one. Specifically, the tension between *Explicability* (Req 2) and *Access Asymmetry* (Req 4). If macro is constituted by micro, why can't we access micro?
      *   Also, *Causal Efficacy* (Req 5) vs. *Explicability* (Req 2). If micro causes macro, it's emergence (not strict panpsychist composition). If micro constitutes macro, causation is tricky.
      *   *Verdict:* The requirement that eliminates the most candidates is likely the demand for *Phenomenal Derivation without Loss of Identity* (The hard Combination Problem). Constitutive views struggle with asymmetry. Causal views struggle with being distinct from emergentism.

  5.  **Auditing for Symmetry (Bottom-Up vs. Top-Down):**
      *   Most requirements assume many micro-subjects combining (Bottom-Up).
      *   Top-Down (Cosmopsychism/Differentiated Unity) flips this: One macro-subject differentiating into apparent micros.
      *   *Symmetry Check:*
          *   Subject Criterion: Top-down struggles to explain why *local* systems act like subjects.
          *   Access Asymmetry: Top-down explains why we don't see the whole (we are fragments), but struggles to explain local unity.
          *   Degradation: Top-down struggles to explain why damaging the brain fragments the mind if the mind is fundamental.
      *   *Conclusion:* The list is slightly biased toward Bottom-Up because the research program is about *systems* (plants, moulds) implying distinct entities. I need to acknowledge this bias.

  6.  **Scoring Contenders:**
      *   Constitutive Bottom-Up: Good on ontology, bad on combination/asymmetry.
      *   Top-Down (Cosmopsychism): Good on combination, bad on empirical fragmentation/local agency.
      *   Russellian Monism (Neutral): Good on causation, vague on composition.

  7.  **Refining the Classifications:**
      *   Be careful with (i) vs (ii). (i) is for *any* theory of consciousness. (ii) is specific to the *research program* (comparative biology/computation).
      *   For example, "Counting" is a metaphysical prejudice (iii), but "Operationalizability of Subjecthood" is crucial for the program (ii).

  8.  **Drafting the Content (incorporating the "Voice"):**
      *   Tone: Rigorous, philosophical, analytical, direct.
      *   Format: Clear headings, bullet points for requirements, distinct sections for analysis.

      *(Self-Correction during drafting)*: Make sure to explicitly address the "Parts vs. Causes" distinction in the desiderata list as requested. Ensure the "Counting Objection" distinguishes between the objection itself and the coherence of counting.

      *Refining the "Kill Shot" analysis:* The prompt asks if the constitutive and causal routes are knocked out by *different* members.
      *   Constitutive (Micro are parts of Macro): Knocked out by Access Asymmetry (why can't we feel the parts?) and the Incoherence of Phenomenal Addition (does red + blue = purple?).
      *   Causal (Micro cause Macro): Knocked out by the demand for Non-Emergence (if micro *causes* macro, isn't that just standard physicalism with extra steps?).
      *   This suggests the real choice is Panpsychism vs. Emergentism/Physicalism. I need to state this clearly.

      *Refining the Symmetry Audit:*
      *   Does the "Partial Disruption" requirement bias against Top-Down? Yes. If the One Mind is fundamental, why does cutting the corpus callosum create two streams? Top-down has to say the One Mind *chooses* to limit itself, which is ad hoc. Bottom-up says the binding mechanism broke. Bottom-up fits the data better here.
      *   Does "Subject Criterion" bias against Top-Down? Yes. Top-down says only the Universe is the subject. The research program assumes plants/moulds might be subjects. This is a conflict between the Metaphysics and the Research Goal. I must highlight this.

  9.  **Final Review against Constraints:**
      *   No citations? Check.
      *   Classifications (i, ii, iii)? Check.
      *   Score contenders briefly? Check.
      *   Address specific list items? Check.

  10. **Final Polish:** Ensure the distinction between "Non-negotiable for *any* theory" and "Non-negotiable for *this program*" is sharp. For instance, a theory could be metaphysically sound but useless for biology if it doesn't identify subjects.

