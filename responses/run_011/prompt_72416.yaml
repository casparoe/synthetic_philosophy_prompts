answer: |-
  ### Attribution and Authenticity Review Procedure (AARP)

  **Grounding and Operational Logic**
  This procedure translates philosophical distinctions regarding artistic identity into administrative actions. It relies on the principle that for autographic arts (painting, sculpture, unique manuscripts), the work's identity is constituted by its history of production, not its perceptual qualities. An object that looks identical to a masterpiece but lacks the correct history of production is not that masterpiece. Therefore, no step in this procedure asks "Does this look like the artist's work?" Visual indiscernibility is irrelevant to the administrative status of the object. The procedure distinguishes between *nominal authenticity* (is the origin claim correct?) and *expressive authenticity* (does it feel true?). We adjudicate only the former.

  **Exclusions and Misfires**
  This procedure **cannot** settle: legal title (theft/looting), cultural affiliation (NAGPRA/repatriation), market/insurance value (refer to Appraiser), or aesthetic quality ("is it good?").
  **Predictable Misfires:** The procedure will misfire if primary production documents are lost (common pre-1900), if expert opinions are equally weighted and contradictory (refer out), or if the "challenge" is based on intuition rather than evidence (dismiss). If a step requires new technical analysis (e.g., pigment dating), the disposition is "Refer to Partner Lab" with an interim status of "Attribution Under Review."

  **Worked Files**

  **File 1: The Workshop Panel (Master X, Donor Namesake)**
  *   **Step 1 (Claim):** Catalogue says "Master X."
  *   **Step 3 (Production):** Lab imaging shows master's hand only in faces; rest is workshop.
  *   **Step 4 (Intent):** No evidence of deception; standard workshop practice for the period.
  *   **Step 6 (Memory):** Hung since 1931 as "Master X."
  *   **Outcome:** The object is not a forgery, but the claim "Master X" implies sole execution. The procedure triggers **Qualify Attribution**.
  *   **Action:** Label changes to "Workshop of Master X, with Master's intervention." Donor family is informed that the object's historical significance remains, but the specific credit is being refined to match current scholarship. No public correction needed as the object remains on display, but the catalogue record is updated.

  **File 2: The Posthumous Bronze (Alumnus Gift)**
  *   **Step 1 (Claim):** Donor calls it "Original Sculptor Y."
  *   **Step 3 (Production):** Cast after death from original model.
  *   **Step 4 (Intent):** Donor describes it as "original" in print. This is a factual error regarding production history, not necessarily malicious fraud, but it misleads the public.
  *   **Step 5 (Continuity):** 100% material is posthumous, though mold is original.
  *   **Outcome:** The term "Original" is factually incorrect for a posthumous cast in this context. Triggers **Withdraw Attribution but Retain and Reinterpret**.
  *   **Action:** Accession record changed to "Posthumous Cast from Sculptor Y's Model." Donor is corrected privately. If the donor's public claim is linked to the museum's press, a quiet correction is issued to the local paper. The object stays on display as an example of the sculptor's legacy, not their hand.

  **File 3: The Withdrawn Drawing (Displayed as Original)**
  *   **Step 1 (Claim):** Wall label and catalogue say "Artist Z."
  *   **Step 2 (Challenge):** Specialist withdrew attribution 15 years ago.
  *   **Step 3 (Production):** Consensus is "Circle of Z" or "Later Copy."
  *   **Step 4 (Intent):** Museum has continued to display it as "Artist Z" despite knowledge.
  *   **Step 7 (Decision):** Current public claim contradicts established fact.
  *   **Outcome:** This triggers **Issue a Public Correction of the Record**.
  *   **Analysis:** You asked if a quiet label change is defensible. The procedure says **no**. Because the museum has displayed the object under a known-false attribution for 15 years, the institution is actively perpetuating misinformation. A quiet change alters the label but leaves the public record (past catalogues, online entries, educational materials) contradictory. To restore nominal authenticity, the museum must acknowledge the error. The procedure forces this because Step 1 (Current Claim) and Step 2 (Established Fact) are in direct, known conflict. The value choice here is **Institutional Reputation vs. Historical Accuracy**. The procedure prioritizes Accuracy.

  ***

  ### Attribution and Authenticity Review Table

  | Step | Question put to the file or the object | Sufficient answer | Insufficient answer | Disposition(s) triggered | Sign-off | Judgment flag (Y/N), and if Y, what is being chosen between |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | What is the specific attribution claim currently public (label, catalogue, web)? | Exact text and location of the claim (e.g., "Artist X, 1605" on wall label). | Vague summary (e.g., "It's filed under X"). | **Baseline Established** (No action yet). | Registrar | N |
  | **2** | What is the specific evidence challenging this claim? | Citation of lab report, scholarly publication, or provenance document contradicting Step 1. | Opinion, intuition, or "market rumor." | **Dismiss Challenge** (Retain attribution unchanged). | Panel Chair | N |
  | **3** | Does the evidence concern the *history of production* (who made it, when, how) rather than appearance? | Yes: Documents/materials show different maker/date than claimed. | No: Argument relies on "style" or "quality" without material proof. | **Refer to Partner Lab** (Interim: Withdraw from display pending review). | Panel Chair | N |
  | **4** | Was the discrepancy created by an *intent to deceive* at the time of making/selling? | Yes: Evidence of forgery or fraudulent provenance fabrication. | No: It is a workshop piece, posthumous cast, or honest copy. | **If Yes:** Issue Public Correction. **If No:** Qualify Attribution. | Panel + Director | **Y**: Transparency vs. Donor/Subject Sensitivity. |
  | **5** | Is the object physically the *same item* that entered the collection, regardless of authorship? | Yes: Accession number matches; object has continuous museum history. | No: Object was swapped or is a different physical instance than recorded. | **If Yes:** Retain and Reinterpret. **If No:** Withdraw from Display. | Registrar | N |
  | **6** | Has the museum publicly asserted the Step 1 claim *after* learning the Step 2 evidence? | Yes: Label/Catalogue updated only recently or never despite knowledge. | No: Error is newly discovered today. | **If Yes:** Issue Public Correction. **If No:** Qualify Attribution in Label/Catalogue. | Director | **Y**: Institutional Accountability vs. Resource Conservation. |
  | **7** | Does the object retain pedagogical value if the attribution is downgraded? | Yes: Useful as copy, workshop example, or historical artifact. | No: Value was solely dependent on the false attribution. | **If Yes:** Retain and Reinterpret. **If No:** Deaccession/Storage (per policy). | Curators + Chair | **Y**: Educational Utility vs. Collection Integrity. |
  | **8** | **Final Disposition Selection** (Select one based on Steps 4-7). | Selection matches the triggered logic above. | Selection contradicts the triggered logic (e.g., Quiet Change when Public Correction triggered). | **Retain / Qualify / Withdraw / Correct / Decline Gift**. | Director (Final) | **Y**: Truth vs. Convenience. |
