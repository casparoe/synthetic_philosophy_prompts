answer: |-
  You have identified a genuine and profound epistemological problem. You are not imagining it, and your diagnosis is sharper than that of many professional historians. You are describing a situation where a theory does not merely interpret evidence but dictates the *admissibility* and *weight* of evidence in a way that protects the theory from refutation.

  Here is my position, structured according to your four requests.

  ### 1. Is there an established name?

  There is no single noun in the historian's lexicon that captures this exactly, because historians generally try to avoid admitting they are doing it. However, in the philosophy of science and critical rationalism, this is known as an **Immunization Strategy**.

  Karl Popper and later Hans Albert described this as a method by which a theory is protected from falsification by reinterpreting conflicting evidence as irrelevant, anomalous, or deceptive *based on the theory itself*. When this occurs in the interpretation of human testimony, it creates a **Self-Sealing Epistemology**.

  For your purposes, I will coin a specific term that bridges the gap between philosophy and historical method: **Hermeneutic Immunity**.

  *Hermeneutic* refers to the theory of interpretation (how we read texts and testimony). *Immunity* refers to the protection from falsification. This term captures your observation: the hypothesis fixes the rules of interpretation in advance, rendering the evidence incapable of harming the hypothesis.

  ### 2. Distinguishing it from near neighbors

  You asked for sharp boundaries. Here is how Hermeneutic Immunity differs from the four neighbors you listed:

  *   **Vs. Ordinary Bias:** Bias is psychological; it is a tilt in attention. A biased reader might *overlook* a document that contradicts them. Hermeneutic Immunity is structural; it *acknowledges* the document but neutralizes its contradictory power through a pre-set rule of interpretation. Bias ignores the counter-evidence; Immunity digests it.
  *   **Vs. Theory-Laden Observation:** It is true that what we notice depends on what we expect. However, legitimate theory-ladenness guides *inquiry*; Hermeneutic Immunity guides *validation*. If your expectation leads you to find a document that proves you wrong, and you accept it, that is legitimate science. If your expectation leads you to label that document "inauthentic" because it proves you wrong, that is Immunity.
  *   **Vs. Legitimate Source Criticism:** This is the most critical boundary. A historian may discount a witness if there is **independent leverage**. For example: "I discount this policeman's testimony because his diary from the same week contradicts it," or "because ballistics evidence proves he lied." In Hermeneutic Immunity, the *only* reason to discount the witness is that their testimony contradicts the theory. Legitimate criticism uses external anchors; Immunity uses internal consistency.
  *   **Vs. Ad Hoc Patching:** Ad hoc patching is reactive. You make a claim, someone disproves it, and you add a clause to save it. Hermeneutic Immunity is proactive. The mechanism for dismissing counter-evidence is built into the initial thesis (e.g., "German culture concealed motives"). As you noted, the immunity is present from the start.

  **The Boundary Line:** The line is drawn at **Independent Corroboration of the Distortion.** If you claim a witness is lying, you must have evidence of the lie that does not depend on the truth of your hypothesis.

  ### 3. A Test for Hermeneutic Immunity

  Since there is no standard term, you need a test. I propose the **Reversal Test**.

  To determine if a dispute suffers from Hermeneutic Immunity, ask the proponent of the theory to specify the following:

  > *"What specific piece of testimony, if found, would you accept as truthful **even if it contradicts your thesis**, and what independent criteria would you use to verify its truthfulness?"*

  If the historian cannot name a document or testimony that would count against them *without* first being vetted by their own theory, they are operating with Immunity.

  **Application of the Test:**
  *   **Legitimate Source Criticism:** "I would believe a perpetrator who claimed he refused to kill if his refusal was documented in a superior's logbook or a court martial record." (External anchor).
  *   **Hermeneutic Immunity:** "I would believe a perpetrator who claimed he refused to kill only if his refusal aligns with my understanding of the cultural pressures, otherwise I will assume he is lying to save face." (Internal anchor).

  A defensible historical argument must allow for the possibility that the witness is telling the truth *against* the historian's argument. If the historian's argument determines the witness's truthfulness, the argument is circular.

  ### 4. Can this immunity be true? (And the Browning–Goldhagen Application)

  **Yes, a thesis of systemic deception can be true.**
  If you are studying a totalitarian society, a cult, or a criminal conspiracy, participants *will* lie. A hypothesis that says "All participants are concealing their motives" is not inherently false. In fact, in the study of the Holocaust, it is historically accurate that perpetrators lied to post-war courts.

  **How to distinguish earned immunity from claimed immunity:**
  A thesis earns its immunity only if it **predicts the mechanism of deception independently of the event being studied.**
  *   **Earned:** "We know the Stasi lied about their motives because we have their internal training manuals on deception, which exist separately from their testimony about specific crimes."
  *   **Claimed:** "We know the policemen lied about their motives because if they told the truth, my theory about their culture would be wrong."

  The difference is **Predictive Risk**. A legitimate theory of deception risks being wrong if the manuals are not found. An immune theory assumes the manuals exist because the testimony requires it.

  **Application to Browning vs. Goldhagen:**

  You asked me to take a position. Here it is: **Goldhagen's argument exhibits significantly higher Hermeneutic Immunity than Browning's.**

  *   **Browning (Situational):** Browning argues that ordinary men killed due to conformity, obedience, and situational pressure.
      *   *Vulnerability:* This theory is falsifiable. If Browning found testimony where men refused and were shot, his theory would need adjustment. If he found testimony where men expressed deep ideological hatred *before* the war, his theory would need to accommodate that. He accepts the testimony of the men (that they were not ideologues) as largely credible, subject to standard memory decay. He allows the evidence to weigh against a purely ideological explanation.
  *   **Goldhagen (Cultural):** Goldhagen argues that a unique "eliminationist antisemitism" permeated German culture, making the killing voluntary.
      *   *Immunity:* When a perpetrator says, "I didn't want to do it," Goldhagen interprets this as a post-war lie (which is plausible). But when a perpetrator says, "I hated Jews," Goldhagen interprets this as confirmation of the culture. When the record is silent on ideology, Goldhagen interprets the silence as proof that the ideology was so pervasive it didn't need writing down.
      *   *The Verdict:* Goldhagen's framework absorbs all outcomes. Enthusiasm proves the culture; reluctance proves the culture (because they are lying about reluctance); silence proves the culture. This is Hermeneutic Immunity. Browning's framework is more constrained: Reluctance proves the situation; enthusiasm complicates the situation.

  **Why Goldhagen's Immunity is "Claimed" rather than "Earned":**
  Goldhagen posits a cultural mindset that is invisible in the record (because it was assumed) but visible in the actions. However, he does not provide independent evidence of this specific "eliminationist" mindset that is distinct from the actions he is trying to explain. He uses the killings to prove the mindset, and the mindset to explain the killings.

  Browning, conversely, relies on social psychology mechanisms (conformity, obedience) that are observable and testable in other contexts (e.g., Milgram, other wars, other police units). He does not require a unique, invisible German cultural variable to make his math work.

  **Conclusion:**
  You have correctly identified that the Browning–Goldhagen debate is not just about facts, but about the **rules of evidence**. Goldhagen employs a **Hermeneutic Immunity** that renders his thesis unfalsifiable by the testimony of the actors involved. Browning employs standard **Source Criticism**, accepting that testimony is flawed but not systematically rigged against his specific hypothesis.

  Your instinct is correct: A historical argument that explains away its own counter-evidence by invoking the very motive it is trying to prove is structurally weaker, even if it happens to be true. In this specific case, the scholarly consensus has largely rejected Goldhagen's methodology for precisely the reason you have isolated: he built a fortress that no evidence could penetrate, which in history, is not a sign of strength, but of irrelevance.
