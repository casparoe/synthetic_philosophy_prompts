  5.  **Addressing the "No Admissibility" Rule & Undermining (Follow-up 1):**
      *   Does banning "admissibility" make Undermining harder or easier?
      *   *Easier:* It forces students to identify *why* the evidence is problematic (it's about the future chance setup) rather than waving a hand. It clarifies that Undermining is about *logical compatibility* between chance hypotheses and evidence, not just a label.
