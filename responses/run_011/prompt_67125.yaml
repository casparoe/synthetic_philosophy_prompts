answer: |-
  First, take a deep breath about the "New Principal Principle" typo. That is the standard initiation rite for this literature; David Lewis would have found it funny, and your students will likely do the same once they're deep enough in the weeds to notice. It signals you're human, which is helpful in a six-week grind.

  Here is the plan for your workshop, designed to respect your "no admissibility black box" rule while keeping the metaphysics light and the epistemology heavy.

  ### The Cull
  **Cut (e) Indexical/Self-locating evidence.**
  While fascinating, this topic tends to hijack discussions into Sleeping Beauty-style debates about centered worlds and temporal indexing. For a workshop focused on the *chance/credence* link, indexicality is often a distraction rather than a core structural issue. It's a specific application of the problem, not a solution to the general tension. Cutting it frees up time to deepen the analysis of the Undermining Problem and the New Principle.

  **Keep (f) Imprecise Credence**, but treat it as a "last resort" option. It's valuable for showing students what happens when the precise credence/chance link breaks entirely, but it requires significant formal setup.

  ### The Order
  Here is the six-week syllabus. The logic flows from **Motivation** $\to$ **Formalization** $\to$ **Breakdown** $\to$ **Repair** $\to$ **Alternative** $\to$ **Synthesis**.

  **Week 1: The Decision-Theoretic Role of Chance (d)**
  *   **Goal:** Establish *why* we need a bridge principle before defining it.
  *   **Upstream/Downstream:** This is the foundation. If chance doesn't guide decision better than raw evidence, the rest of the workshop is moot.
  *   **Activity:** Have students try to maximize expected utility using *only* their credences based on past frequencies, then introduce a "chance" variable that improves their betting performance.
  *   **Why here:** You need to motivate the Principal Principle (PP) before you try to derive or fix it.

  **Week 2: Deriving the Principal Principle (a)**
  *   **Goal:** Attempt to ground PP in standard Bayesian constraints (e.g., Hall's "Subjectivist's Guide" arguments).
  *   **Upstream/Downstream:** Upstream from Week 1 (now we formalize the intuition). Downstream to Week 3 (this sets up the failure condition).
  *   **The "No Admissibility" Constraint:** Force them to write the condition as $C(A | \langle Ch(A)=x \rangle \land E) = x$. Ask: "What properties must $E$ have for this equality to hold?" Do not let them write "E must be admissible." They must list properties (e.g., "E contains no information about the outcome of A," "E contains no information about the chance setup of A").
  *   **Feasibility:** High. This is pure probability theory and epistemology.

  **Week 3: The Undermining Problem (b)**
  *   **Goal:** Demonstrate that Humean chance (chance supervenes on the total pattern of outcomes) creates a contradiction with the PP derived in Week 2.
  *   **Upstream/Downstream:** This is the crisis. It relies on the Week 2 definition failing. It necessitates Week 4.
  *   **The "No Admissibility" Constraint:** This is where your rule shines. Usually, students say "Future evidence is inadmissible." Here, they must show *mathematically* why the evidence (the total pattern) is incompatible with the chance hypothesis.
  *   **Feasibility:** Medium-High. Requires a simplified model of Humean Supervenience (see "Running Example" below).

  **Week 4: The New Principle (c)**
  *   **Goal:** Evaluate Lewis's fix: $C(A | \langle Ch(A)=x \rangle \land E) = x / Ch(\langle Ch(A)=x \rangle)$.
  *   **Upstream/Downstream:** The direct response to Week 3.
  *   **Activity:** Re-run the Week 3 counter-example using the NP. Does it resolve the contradiction? What is the cost? (The cost is that agents need credences about chance hypotheses that they might not be able to form).
  *   **Feasibility:** High. It's algebraic manipulation of the Week 3 model.

  **Week 5: Imprecise Credence as an Escape (f)**
  *   **Goal:** If NP is too costly or metaphysically loaded, does dropping precise credence help?
  *   **Upstream/Downstream:** The "nuclear option" if Weeks 2-4 fail to satisfy.
  *   **Feasibility:** Medium. Requires introducing sets of probability functions. Keep it intuitive: "Maybe your credence shouldn't be 0.7, it should be [0.6, 0.8]."

  **Week 6: Synthesis and Application**
  *   **Goal:** Apply the toolkit to a fresh case without instructor scaffolding.
  *   **Activity:** Give them a new scenario (e.g., quantum decay vs. deterministic chaos) and have them argue which principle (PP, NP, or Imprecise) applies and why, adhering to the no-admissibility rule.

  ### Follow-Up 1: The "No Admissibility" Rule and Undermining
  **Does this rule make (b) harder or easier to teach?**
  It makes it **easier to teach, but harder to solve.**
  *   **Easier to Teach:** The term "admissible" is a conversation stopper. It allows students to feel they've explained something when they've only labeled it. By banning the label, you force them to identify the *structural feature* of the evidence that causes the trouble. In the Undermining case, the trouble is that the evidence $E$ (the total history) logically entails the falsity of the chance hypothesis $H$ (because if $H$ were true, the history would have to be different to make $H$ the *best* system).
  *   **Harder to Solve:** Students will struggle to formulate the constraint without the word. This is good. It reveals that the "admissibility" caveat was doing massive hidden work. It forces them to see that Undermining isn't just about "future evidence," it's about **logical compatibility between chance hypotheses and evidence**. This is the exact insight needed to understand why the New Principle is necessary.

  ### Follow-Up 2: The Running Example
  **Ditch the Lamp/Box/Engineer case.**
  You are right to be nervous. It smuggles in testimony ("the engineer says") and future-directed evidence ("next tick"), which makes the admissibility debate inevitable and messy. It focuses on *trust* rather than *probability structure*.

  **Replace it with the "Finite World" Model.**
  Since your students know measure theory but not metaphysics, model Humean Supervenience combinatorially.
  *   **The Setup:** A "world" is a fixed sequence of $N$ coin flips (e.g., $N=10$).
  *   **The Chance:** The "objective chance" of heads is defined as the frequency of heads in the *entire* sequence (the Best System).
  *   **The Evidence:** You observe the first $k$ flips.
  *   **The Problem:** If you observe enough heads early on, your credence that the *total frequency* is high goes up. But if the total frequency is high, the *chance* of heads is high. However, if the chance is high, the probability of the sequence you observed changes.
  *   **Why it works:** This makes Undermining a theorem of finite probability, not a metaphysical mystery. Students can calculate the exact contradiction on a whiteboard.
      *   *Hypothesis H:* The chance is 0.5 (5 heads in 10 flips).
      *   *Evidence E:* The first 6 flips are Heads.
      *   *Conflict:* If $H$ is true, $E$ is impossible (you can't have 6 heads in the first 6 if there are only 5 total). So $P(H|E) = 0$. But PP says your credence in heads on flip 7 should match the chance. But your credence in the chance being 0.5 is now 0.
      *   **Benefit:** This forces them to confront the "no admissibility" rule immediately. $E$ isn't inadmissible because it's "about the future"; it's inadmissible because it's **logically incompatible with the chance hypothesis**. This is the precise definition of undermining they need.

  ### Summary of Defense
  This ordering works because it treats the Principal Principle not as a static rule to be memorized, but as a **hypothesis that gets stress-tested**.
  1.  **Weeks 1-2:** We build the engine (PP).
  2.  **Week 3:** We crash the engine (Undermining).
  3.  **Weeks 4-5:** We try to fix it (NP) or build a new vehicle (Imprecise).
  4.  **Week 6:** We drive it.

  By cutting Indexicality (e), you avoid the metaphysical rabbit hole of "self." By cutting the Lamp example, you avoid the epistemic rabbit hole of "testimony." By enforcing the "no admissibility" rule, you ensure they spend their three hours doing probability theory, which is what they are trained for, rather than arguing about the meaning of "aboutness."

  Good luck. And seriously, don't worry about the typo; if anyone brings it up, tell them it was a deliberate test to see who was reading the handouts closely.
