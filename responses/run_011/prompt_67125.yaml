prompt: |-
  I'm putting together a six-week grad workshop — one three-hour session a week, about ten people, everyone's had a semester of measure-theoretic probability but nobody's a metaphysican — on objective chance and the Principal Principle, and I've already committed to a running example that I'm now worried is a bad one. The setup: there's a box that at each tick sets the chance of "heads" for an attached coin to some number θ. There's also a lamp that occasionally lights up and displays a number. The engineer who built the thing says that whenever the lamp lights, the displayed number is within .05 of the θ the box is going to set at the *next* tick, and she's right about that nine times out of ten. Question for the group: you see the lamp display 0.7 — what should you think the chance of heads at the next tick is, and what should you think about heads itself? The reason I'm nervous is that this case mixes evidence about the future with second-hand evidence about the chance, and half my prep time is going into arguing about whether the engineer's testimony counts as "admissible," which feels like it dodges all the interesting stuff.

  So here's what I actually want. I've made an artificial rule for the workshop: nobody gets to invoke admissibility as a black box. Any principle we adopt has to be stated without the caveat, and if it turns out to need the caveat, we have to say in non-circular terms what the caveat amounts to. Given that rule, which open questions in the chance/credence literature are worth six weeks of grad students' time? I've got a shortlist I keep shuffling: (a) whether the Principal Principle can be *derived* from independently plausible Bayesian constraints rather than just posited, and what's lost if it can't; (b) the undermining problem for Humean / best-systems chance — the worry that evidence about the eventual pattern of outcomes is evidence against the chance facts that supposedly generated it — which I want treated as the central case rather than a curiosity; (c) whether Lewis's later "New Principle" fixes (b) or just relocates it, and what it costs you; (d) what chance buys you decision-theoretically, i.e. why an agent who already has all the non-chance facts should care; (e) indexical / self-locating evidence and whether it's a special case or the whole ballgame; (f) imprecise or "mushy" credence as a way out of the mess. Put them in the order you'd teach them, tell me which one or two I should cut entirely, and defend the ordering instead of just annotating my list — I want to know what each question is upstream of, which ones a room of grad students can make real progress on with a whiteboard in three hours, and which ones will dissolve into everyone restating their intuitions about determinism. Two follow-ups: does the no-admissibility rule make (b) harder or easier to teach, and should I keep the lamp case as the running example or replace it with something that doesn't smuggle in testimony about the future? Small confession: I've been writing "new principal principle" in my notes all week and only just noticed.
