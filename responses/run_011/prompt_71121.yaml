      *   **Core Argument:** Use Alfred North Whitehead's three-phase rhythm of learning (Romance, Precision, Generalization) without naming him, quoting him, or making it a philosophy lecture.
      *   **Key Critique:** The new setup (AI + cut project blocks) forces students straight into Precision (phase 2) at machine speed, skipping Romance (phase 1) and preventing Generalization (phase 3).
      *   **Key Concept:** "Inert ideas" (knowledge received/stored but never used/tested/combined). Connect this to AI tutors answering instantly.
      *   **Audience:** Mixed faculty (3 know Whitehead, others just want coffee). Head of School (HoS) is present and signed off on the rollout.
