      *   *Precision:* Grammar, rules, exactness, discipline, details. (Threatened/enhanced by AI tutors giving instant answers).
      *   *Generalization:* Returning to synthesis, using the rules freely, creativity, application. (Threatened by never leaving Precision).
      *   *Inert Ideas:* Knowledge that isn't used. AI makes getting answers too easy, preventing the struggle needed to make ideas "live."

  3.  **Determine the Strategy:**
