prompt: |-
  Three claims, held together, make up a position about famines that I have come to regard as correct. I want to know how much it is actually risking, and where.

  First, a causal claim: in the great famines of the modern period an absolute shortfall in food was rarely the operative cause. What killed people was the loss of one particular group's command over food — landless labourers, sharecroppers, fishermen, transport workers, anyone whose sole asset was labour that no longer had a buyer — combined with an administration that failed to act on what was plainly visible to it. My paradigm is Bengal in 1943. The autumn 1942 rice crop in the delta had been damaged by a cyclone and tidal flooding and by crop disease, and the aggregate figures for that year are disputed, which I know; but the famine killed somewhere between two and three million people in a province that was still moving rice, while the authorities stripped boats and grain stocks from the coastal districts as a precaution against a Japanese landing, wartime spending around Calcutta drove prices up against lagging rural wages, hoarding and panic buying did the rest, and the government refused for months to concede that a famine existed. The same shape seems to me to run through the Bangladesh famine of 1974, where aggregate availability was unremarkable and mortality concentrated on people whose employment had vanished, and through the Maharashtra droughts of the early 1970s, where a severe harvest failure met with public employment works on an unprecedented scale produced hardship but no famine.

  Second, a modal claim: in essentially every modern famine there was a feasible alternative — rationing, imports, relief works, an end to requisitioning, letting people walk to where there was food — and the reason it was not taken was political. On this reading the Great Leap Forward famine of 1959 to 1961 belongs in the same family as Bengal even though output genuinely fell there: procurement quotas were set against harvest figures inflated at every level of the reporting chain, criticism was silenced from mid-1959 onward, and the rural population was administratively prevented from migrating.

  Third, a normative claim: given the first two, famines are not natural disasters that politics then mishandles. They are political events from the outset, and describing them as crimes is apt rather than merely rhetorical.

  Now: what would have to be true for this package to be wrong? I want the material sorted into three grades — what would force me to abandon it, what would force me to narrow it, and what I could acknowledge without changing my mind.

  - Take the Irish famine of 1845 to 1852 as the hardest test. The crop the poor actually ate collapsed; they had nothing left to sell, so their loss of command over food was not a market-mediated event but the direct failure of their own production; roughly a million died and a comparable number left; and grain and livestock continued to be exported throughout. Does my position survive this, or does it depend on sliding from the state could have done something to the state's inaction caused the deaths? What specifically would have to be established about the volume of exports, about whether Irish food supplies would have sufficed in the counterfactual, and about the administrative and transport capacity of the 1840s, for Ireland to count as a genuine defeater rather than an awkward one?
  - Tell me what pattern in the numbers would discriminate the two accounts: whether per-head supply was flat or falling; whether mortality tracked the harvest curve or the real wage and relative price curves; whether deaths were concentrated by occupation and district in the way the first claim predicts, or spread evenly across a uniformly short region; whether prices rose more than a real shortfall would warrant. Then say honestly whether any of this is recoverable at the required resolution for 1840s Ireland or 1943 Bengal — and if the dispute is undecidable on the available record, whether that damages my position more than the rival one.
  - Address the insulation worry directly. The affected group seems to be identified with whoever starved, after the fact, so no distribution of deaths can falsify the causal claim; and the modal claim is a counterfactual about administrative feasibility that an idealised state always seems able to satisfy. Is the position unfalsifiable? If so, is that a defect, or is it what a framework for causal analysis rather than a predictive hypothesis is entitled to? Which of the three claims can I give up to save the others, and which cannot be given up without the rest collapsing?
  - Distinguish objections that a serious defender of this general approach would themselves concede as damaging from objections they would brush aside, and explain what makes the difference. Relatedly: what does the production-side account risk that mine does not, and does that asymmetry count against me?
  - Where does the third category sit — sieges, blockades, scorched-earth requisition, the deliberate destruction of food stores, the closing of borders to starving peasants? There people are physically prevented from reaching food rather than priced out of it. Does the vocabulary of command over food cover those cases, or does it soften them?
  - Finally, on the normative claim: can a famine be wholly natural in origin and still criminal in the response, and can it be wholly political in origin without being criminal — the product of ideological error, sincerely held but false causal beliefs, and administrative incapacity? What separates mass starvation that has criminals from mass starvation that has only blunderers, and does my third claim need that distinction in order to mean anything?

  The thing I would personally find most decisive is a well-documented case of region-wide absolute shortage in which the transport, finance, and administrative technology of the period, deployed by a government that was both competent and trying in good faith, could not have averted mass death. Tell me whether such a case exists, how one would go about establishing it, and what happens to the modal claim if it cannot be established in either direction. Argue from the substance of the cases and the structure of the reasoning; I am not looking for a list of works to read.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Core Position:** The user holds a three-part position on famines (Causal, Modal, Normative).
          *   *Causal:* Famines are rarely about absolute food shortfall (FAD - Food Availability Decline); they are about entitlement failure (loss of command over food) + administrative failure. (Sen-style entitlement approach).
          *   *Modal:* There was always a feasible political alternative (rationing, imports, etc.) not taken due to politics.
          *   *Normative:* Famines are political events/crimes, not natural disasters mishandled.
      *   **Task:** Evaluate the riskiness of this position. Where could it be wrong?
      *   **Specific Constraints/Questions to Address:**
          1.  **Grades of Falsification:** What forces abandonment, narrowing, or no change?
          2.  **The Irish Famine Test:** Does Ireland 1845-52 break the model? What specifics (exports, counterfactual sufficiency, capacity) matter?
          3.  **Discriminating Patterns:** What data patterns distinguish the user's view vs. the production-shortfall view? Is this data recoverable for Ireland/Bengal? Does undecidability hurt the user's view more?
          4.  **Insulation/Unfalsifiability:** Is the position tautological (identifying victims post-hoc)? Is this a defect or a feature of a framework? Which claim is the linchpin?
          5.  **Conceded vs. Brushed Aside Objections:** What would a serious defender admit is damaging vs. what they'd ignore? What does the production-side account risk that the user's doesn't?
          6.  **Category 3 (War/Siege):** Does "command over food" cover blockades/scorched earth, or does it soften them?
          7.  **Normative Nuance:** Can a natural famine be criminal? Can a political famine be non-criminal (blunder vs. crime)? Does the 3rd claim need this distinction?
          8.  **The "Decisive" Test:** A well-documented case of absolute shortage where competent administration *could not* have averted death. Does it exist? How to establish it? What if it's undecidable?
      *   **Tone/Style:** Argumentative, substantive, structural reasoning. No reading lists. High intellectual rigor.

  2.  **Analyze the User's Position (The "Sen-Plus" View):**

      *   This is essentially Amartya Sen's *Entitlement Approach* (Poverty and Famines, 1981), strengthened by a stronger normative claim (Alex de Waal's *Famine Crimes* influence?) and a modal claim about feasibility.
      *   *Strength:* Explains why famines happen in democracies less often (accountability), explains why food moves *out* of starving areas.
      *   *Weakness:* Can underplay genuine ecological collapses, can over-politicize administrative incapacity, risks tautology (if they starved, they lacked entitlement; if they lacked entitlement, the state failed).

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the position. It's the "Entitlement + Political Agency" synthesis.
      *   **Grades of Falsification:**
          *   *Abandon:* A case where *no* feasible intervention existed given the tech/logistics of the time, yet mass death occurred (The "Decisive Test").
          *   *Narrow:* Cases where production collapse was so total (e.g., >50%) that entitlement mechanisms couldn't function regardless of policy. Or cases of genuine siege warfare where the "state" is the enemy combatant, not a governor.
          *   *No Change:* Evidence of some crop failure. The position already admits crop failure happens (Bengal 1942), just denies it's the *operative* cause of death.
      *   **The Irish Famine (The Hard Test):**
          *   *Analysis:* Ireland is the strongest counter-example because the staple (potato) vanished biologically.
          *   *Survival:* The position survives *if* the grain/livestock exports + imports could have covered the caloric deficit *and* the state had the capacity to redistribute.
          *   *Defeater Conditions:* If the caloric value of exports was negligible compared to the potato loss, *and* importing enough would have bankrupted the UK or exceeded global supply/shipping capacity, *and* the administrative reach (Poor Law) was physically incapable of distribution.
          *   *Verdict:* It's an "awkward" case, not a total defeater, because the UK *did* have the capital and shipping, but chose laissez-faire ideology over intervention. That fits the "Political" claim.
      *   **Discriminating Patterns (Data):**
          *   *Patterns:* Entitlement view predicts price spikes > supply drop, mortality correlated with wage collapse/unemployment, not just harvest volume. Production view predicts mortality ~ harvest volume.
          *   *Recoverability:* For Bengal, yes (price/wage data exists). For Ireland, harder (less granular wage data, but export logs exist).
          *   *Undecidability:* If data is missing, it hurts the *production* view more. The production view makes a positive claim (there wasn't enough food). The entitlement view makes a negative claim (food availability wasn't the binding constraint). Burden of proof lies on the positive claim.
      *   **Insulation/Unfalsifiability:**
          *   *Risk:* Yes, it risks circularity ("They starved because they had no entitlement").
          *   *Defense:* It's a framework, not a hypothesis. It shifts the burden of proof.
          *   *Linchpin:* The **Modal Claim** is the weak point. If you prove no alternative was feasible, the Causal and Normative claims crumble. The Causal claim can survive some production drops. The Normative claim depends on the Modal claim.
      *   **Conceded vs. Brushed Aside:**
          *   *Conceded:* That administrative capacity varies. A weak state (Somalia 2011) vs. a strong state (UK 1845). If capacity is truly zero, the "crime" charge weakens.
          *   *Brushed Aside:* "But the harvest *was* down." (So what? Was it down enough to kill *that many*?)
          *   *Asymmetry:* Production account risks being empirically wrong on aggregate numbers (often inflated/deflated). Entitlement account risks being morally too expansive (calling incompetence a crime).
      *   **Category 3 (Siege/Blockade):**
          *   *Analysis:* This is "direct entitlement mapping." Force prevents access.
          *   *Vocabulary:* "Command over food" covers it (you have money but guns stop you). But it might *soften* the moral horror if treated the same as market failure. Siege is active killing; market famine is passive killing. The vocabulary should distinguish *active deprivation* vs. *passive withdrawal of protection*.
      *   **Normative Claim (Crime vs. Blunder):**
          *   *Distinction:* Intent vs. Recklessness. A famine can be natural (drought) but the *response* makes it criminal (ignoring it). A famine can be political (policy error) but not criminal if it was a sincere, reasonable epistemic error (hard to prove in mass starvation).
          *   *Necessity:* Yes, the 3rd claim needs this. Otherwise, "crime" loses meaning. It needs to distinguish *malice/negligence* from *tragic impossibility*.
      *   **The Decisive Test (Absolute Shortfall + Competence):**
          *   *Existence:* Hard to find. Maybe pre-modern famines (Rome, Egypt) where logistics simply didn't exist? But the user specifies "modern period."
          *   *Candidate:* Perhaps the 19th-century Sahel or specific pre-colonial contexts? But even then, trade usually existed.
          *   *Establishment:* Need aggregate calorie data + logistics capacity data + counterfactual modeling.
          *   *Undecidable:* If undecidable, the Modal Claim remains a presumption. It functions as a "guilty until proven innocent" standard for states. This is a political stance, not just an empirical one.

  4.  **Refining the Argument (Self-Correction/Polishing):**

      *   *Check:* Did I answer the specific question about Ireland exports? *Correction:* Need to be specific. It's not just volume, it's *purchasing power*. Could the poor have bought the exported grain if relief works paid enough?
      *   *Check:* Did I address the "insulation worry"? *Correction:* Emphasize that the definition of the "affected group" isn't circular if defined *ex-ante* by economic class (landless laborers), not *ex-post* by starvation.
      *   *Check:* The "Decisive Test." *Correction:* Be honest. In the *modern* period (post-1800s), global markets and steam transport make "absolute impossibility" very rare. This strengthens the user's view but makes the burden of proof high for the counter-argument.
      *   *Tone:* Keep it analytical, slightly adversarial but respectful of the philosophical depth.

  5.  **Final Review against constraints:**
      *   No reading lists.
      *   Address all 6 bullet points + the "Decisive Test" paragraph.
      *   Maintain the three grades of risk.
      *   Ensure the distinction between "crime" and "blunder" is sharp.

  6.  **Final Polish:** (Mental check of the Ireland argument). The key is that Ireland *was* part of the UK. The UK had the navy, the credit, and the grain. The failure was ideological (Peel/Trevelyan). This fits the user's "Political" claim perfectly. So Ireland is not a defeater for the *Modal* claim, but it challenges the *Causal* claim (since the potato blight *was* an absolute shortfall for the specific caloric base of the poor). I need to nuance that: The *crop* failed absolutely, but the *food supply* did not. The distinction is vital.

  7.  (Drafting the response based on these thoughts.)
answer: |-
  This is a robust synthesis of the entitlement approach (Sen) and the political economy of famine (de Waal, Ó Gráda), hardened by a specific normative stance. It is a coherent package, but its coherence relies on the strength of the **Modal Claim**. If the Modal Claim holds, the Causal and Normative claims follow. If the Modal Claim breaks, the package unravels.

  Here is the risk assessment, sorted by your requested grades and specific challenges.

  ### 1. Grades of Falsification

  To evaluate where your position risks failure, we must distinguish between empirical counter-examples and theoretical collapse.

  *   **What would force you to abandon it (The Hard Defeater):**
      You must abandon the position if there exists a **well-documented modern case** where:
      1.  Aggregate food availability dropped below the biological survival threshold for the population *even if* all existing food were perfectly redistributed.
      2.  The state possessed the administrative reach to identify the starving but lacked the *physical or financial capacity* to move or purchase sufficient calories from outside the region.
      3.  The global market at that specific moment could not supply the deficit (e.g., simultaneous global harvest failure).
      *If such a case exists, the Modal Claim is false. If the Modal Claim is false, the Normative Claim (that it is a crime) loses its footing, because "ought implies can."*

  *   **What would force you to narrow it (The Soft Defeater):**
      You would need to narrow the scope if you find that **administrative capacity** is the binding constraint rather than political will in specific contexts. For example, if a state collapses into warlordism (Somalia 2011) such that *no* central authority exists to implement rationing, calling it a "political crime" of the *state* becomes category-error. You would have to narrow the claim to: "Famines are crimes committed by *governing authorities with functional capacity*." This excludes stateless regions but keeps the core intact.

  *   **What you could acknowledge without changing your mind (Noise):**
      Evidence of **significant crop failure**. Your Causal Claim already admits crop damage (Bengal 1942). You do not need to deny that harvests fall; you only need to deny that the harvest fall *necessitates* mass death. Evidence that some people starved because they had no food *and* no money is consistent with your view; your view is that the *scale* of death is determined by the failure to protect the moneyless, not the absence of the food.

  ### 2. The Irish Famine Test (1845–1852)

  Ireland is the strongest stress test because the staple crop (potato) suffered a near-total biological collapse, unlike the price shocks of Bengal 1943.

  *   **Does your position survive?**
      Yes, but precariously. Your position survives if the **caloric equivalent** of the exported grain and livestock, plus the import capacity of the UK, exceeded the caloric deficit created by the blight.
      *   *The Trap:* If you argue "food was exported, therefore there was enough," you risk a fallacy. Exported grain was often wheat/oats for the English market; the Irish poor ate potatoes. The conversion rate matters.
      *   *The Survival Condition:* You must establish that the UK government *could* have halted exports, converted the grain to relief, or used its credit to import maize (which they did, but too little/too late) in quantities sufficient to bridge the gap. Given the UK's industrial wealth and naval dominance, the *capacity* existed. The *will* did not (Peel's hesitation, Trevelyan's laissez-faire ideology). This fits your Modal Claim (political choice) perfectly.

  *   **What specifically constitutes a defeater?**
      Ireland becomes a genuine defeater only if:
      1.  **Volume:** The caloric value of all Irish production (including meat/grain) plus maximum feasible imports was *less* than the subsistence requirement of the population. (Most estimates suggest the exports alone could have covered a significant portion of the deficit).
      2.  **Counterfactual Sufficiency:** Even if exports stopped, the logistics of distributing grain to the congested west (where transport infrastructure was poor) would have failed to reach the starving before death occurred.
      3.  **Capacity:** The British Treasury was financially incapable of funding the relief without bankrupting the state. (Historically dubious; the UK spent heavily on other ventures).
      *If these three hold, Ireland was a Malthusian check, not a political crime. If any one fails, your position holds.*

  ### 3. Discriminating Patterns in the Numbers

  You ask what data pattern distinguishes the Entitlement/Political account from the Food Availability Decline (FAD) account.

  *   **The Patterns:**
      1.  **Price vs. Supply:** In a FAD famine, prices rise proportionally to scarcity. In an Entitlement famine, prices rise *disproportionately* to scarcity (panic, speculation, loss of purchasing power).
      2.  **Mortality Distribution:** In a FAD famine, mortality should track the **harvest curve** geographically (worst hit areas die most). In an Entitlement famine, mortality tracks the **wage/employment curve** (areas with high labor dependence die most, even if harvest was okay).
      3.  **Occupational Concentration:** FAD kills broadly. Entitlement kills specifically (laborers, weavers, service workers) while landowners with stock survive.

  *   **Recoverability:**
      *   **Bengal 1943:** Highly recoverable. Price data is excellent. Mortality by district is well-mapped. The divergence between rice availability and price spikes is documented.
      *   **Ireland 1840s:** Partially recoverable. Export logs are good. Price data exists but is spottier. Mortality by occupation is harder to pin down (death certificates were inconsistent), but the geographic mismatch (west died, east survived despite similar blight impact) supports the Entitlement view.

  *   **Undecidability:**
      If the record is too noisy to distinguish these curves, **it damages the rival (FAD) view more than yours.**
      *   *Reasoning:* The FAD view makes a positive claim: "There was not enough food." This requires hard aggregate data. Your view makes a negative claim: "Food availability was not the binding constraint." In the absence of definitive aggregate data, the burden of proof lies on the positive claim. Furthermore, the *mechanism* of death (starvation amidst trade) is observable even if aggregate tonnage is not.

  ### 4. The Insulation Worry (Unfalsifiability)

  You are right to worry about circularity. "Who starved? The group with no command over food. Why did they starve? They had no command over food."

  *   **Is it unfalsifiable?**
      It becomes unfalsifiable if you define the "affected group" *ex-post* (anyone who starved).
      *   *The Fix:* You must define the vulnerable class *ex-ante* by economic function (e.g., "landless day laborers," "fishermen without boats"). If you can show that *within* a famine zone, landless laborers died while smallholders with grain survived, the Causal Claim is empirically grounded, not tautological.
  *   **Is this a defect?**
      It is not a defect of a **framework**, but it is a defect if presented as a **predictive hypothesis**. As a framework for causal analysis, it is entitled to shift the burden of proof. It says: "Do not assume shortage until you have ruled out distribution."
  *   **The Linchpin:**
      You can give up the **Causal Claim** (admitting some famines *are* primarily FAD) and save the Normative Claim (those states still failed to mitigate). You can give up the **Normative Claim** (calling them tragedies rather than crimes) and save the Causal/Modal.
      *   *But:* You **cannot give up the Modal Claim**. If you admit that sometimes there was *no feasible alternative*, the Normative Claim (it is a crime) collapses, and the Causal Claim reverts to "sometimes it's just shortage." The Modal Claim is the engine.

  ### 5. Conceded vs. Brushed Aside Objections

  *   **Objections a serious defender must concede (Damaging):**
      1.  **Logistical Lag:** If the time required to move food exceeds the time to starvation, the "feasible alternative" vanishes. A defender must admit that *speed* limits political agency.
      2.  **Epistemic Uncertainty:** If the government genuinely did not know (no data, no telegraphs, no free press), the "crime" charge weakens to "negligence." A defender must concede that *information asymmetry* mitigates moral culpability, even if it doesn't excuse the outcome.
      3.  **War Zones:** In active combat zones where supply lines are shelled, the "political choice" is constrained by military reality.

  *   **Objections they would brush aside (Not Damaging):**
      1.  **"But the harvest was down 10%."** (Response: 10% shortfall does not explain 100% mortality among the poor without entitlement failure).
      2.  **"The market was distorted."** (Response: Markets are always political constructs; distortion is a political choice).
      3.  **"People hoarded."** (Response: Hoarding is a rational response to state failure; the state failed to break the hoard).

  *   **Asymmetry of Risk:**
      *   **Production-side account risks:** Empirical falsification. It is easy to count tons of grain. If the tons were there, the theory is dead.
      *   **Your account risks:** Moral overreach. It is hard to prove "feasibility" counterfactually. You risk labeling every tragedy a murder. This asymmetry counts against you *morally* (if you are wrong, you accuse the innocent) but not *analytically* (if you are right, you catch the guilty).

  ### 6. Category 3: Siege, Blockade, Scorched Earth

  *   **Does "Command over Food" cover this?**
      Technically, yes. A blockade removes command over food just as effectively as inflation.
  *   **Does it soften them?**
      Yes, dangerously. Describing a siege (active military deprivation) in the same vocabulary as a market famine (passive economic exclusion) risks equating **killing** with **letting die**.
      *   *Refinement:* You should distinguish **Entitlement Failure** (market/state neglect) from **Entitlement Seizure** (active deprivation). In a siege, the food is there, but the right to access it is violently revoked. This strengthens your Normative Claim (it is definitely a crime) but requires a sub-category in your Causal Claim. It is not a failure of *administration*; it is a success of *coercion*.

  ### 7. The Normative Claim: Crime vs. Blunder

  *   **Can a natural famine be criminal?**
      Yes. If a drought occurs (natural) and the state refuses to import food (political), the *starvation* is criminal, even if the *drought* was not. The crime lies in the conversion of hazard to disaster.
  *   **Can a political famine be non-criminal?**
      This is the hardest edge. If a government acts on **sincerely held but false causal beliefs** (e.g., "Grain exports will lower prices long-term" — a genuine economic error, not malice), is it a crime?
      *   *Your Stance:* Your third claim ("describing them as crimes is apt") suggests strict liability.
      *   *The Distinction:* To maintain intellectual honesty, you must distinguish **Recklessness** from **Incapacity**.
          *   *Blunder:* The state tried to feed people, used the wrong method, lacked the data, and people died. (Tragic).
          *   *Crime:* The state prioritized other goals (war, ideology, surplus) over feeding people, knowing the risk. (Criminal).
      *   *Necessity:* Your third claim *needs* this distinction. If every death from starvation is a "crime," the word loses its force. You need to show that the state *subordinated* survival to another end. In Bengal, it was War. In Great Leap Forward, it was Industrialization/Quotas. In Ireland, it was Laissez-Faire Ideology. In all three, survival was traded. That is the criminal element.

  ### 8. The Decisive Test: Absolute Shortfall + Competence

  You asked for a well-documented case of region-wide absolute shortage where a competent, good-faith government could not have averted death.

  *   **Does such a case exist?**
      In the **modern period** (post-1800), **no clear case exists.**
      *   *Why:* The combination of global markets, steam transport, and telegraphic communication means that *any* regional deficit can theoretically be covered by imports unless the region is under active siege or the state is bankrupt.
      *   *Candidate:* The **1941-42 Siege of Leningrad**. Food was physically blocked by the Wehrmacht. The Soviet administration was competent and trying. People starved.
          *   *Verdict:* This fits your "Category 3" (Blockade). It is a political/military act by an *enemy*, not a failure of the governing authority's entitlement protection (though one could argue the USSR's strategic choices led to the encirclement).
      *   *Candidate:* **Pre-colonial or Early Colonial Famines** (e.g., 1770 Bengal). Administrative capacity was too low to move grain fast enough.
          *   *Verdict:* This forces you to **narrow** your claim to the period where modern logistics exist (post-1850?).

  *   **How to establish it:**
      You would need to reconstruct the **Caloric Balance Sheet**:
      1.  Total population × Minimum survival calories.
      2.  Total domestic production (verified by satellite or agronomic reconstruction, not tax records).
      3.  Maximum import capacity (shipping tonnage × turnover rate).
      4.  If (2 + 3) < (1), the FAD view wins.
      5.  If (2 + 3) > (1), but people died, your view wins.

  *   **What if it is undecidable?**
      If the data is too poor to establish the Caloric Balance Sheet (which is true for most historical famines), the **Modal Claim functions as a Presumption**.
      *   *Argument:* "In the modern era, given global trade and transport, the default assumption must be that food *could* have been moved. The burden of proof is on the state to demonstrate impossibility."
      *   *Consequence:* This makes your position a **Political Heuristic** rather than a Scientific Law. It is a tool for accountability. If it is undecidable, you rule in favor of the victims. This is not empirically neutral, but it is morally consistent with your Normative Claim.

  ### Summary of Risk

  Your position is **empirically robust** for the 20th and 21st centuries, where logistics rarely fail absolutely. It is **morally risky** because it conflates incompetence with malice unless you sharpen the "Crime vs. Blunder" distinction. It is **theoretically vulnerable** only on the Modal Claim: if you cannot define "feasible alternative" without resorting to idealized state capacity, you risk tautology.

  **To secure the position:**
  1.  Define "feasible" by the technology of the *time*, not ours.
  2.  Accept that sieges are a distinct category of "active deprivation."
  3.  Concede that if a state truly lacks the capacity (failed state), the "crime" lies with the international community that failed to intervene, not the local authority.
  4.  Treat the "undecidable" cases as presumptive crimes, placing the burden of proof on the administration to show they were powerless.

  This makes your position a **presumption of guilt for governing authorities during mass starvation**, which is a political stance, but a defensible one given the historical record of the last 150 years.
