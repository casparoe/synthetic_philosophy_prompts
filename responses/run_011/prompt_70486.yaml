prompt: |-
  I run a 32-unit supported housing scheme — adults with long-term mental health conditions, each with their own assured tenancy and their own seperate front door, but sharing a corridor, a lounge/kitchen, a laundry, a courtyard and a garden. Every week we get four or five disputes that all start the same way: someone is doing something entirely inside their own home, and somebody else says it's making their life unbearable. Right now it gets handled by whichever worker is on shift and their gut, it's wildly inconsistent, and we've had two complaints to the ombudsman in a year.

  What I want is a written decision procedure a support worker can run on a dispute in about 15 minues, with no economics background and no legal advice to hand. Please ground it in the actual tension Sen identified, which I think is exactly our situation: you can't in general both give each person a protected private sphere where their own say-so settles the matter, and also always go with what everyone unanimously prefers. Sometimes the thing inside the protected sphere is precisely what everybody else wants changed, and sometimes what a resident says they "prefer" isn't about their own life at all but about somebody else's private conduct. So something has to give somewhere, and I'd rather the procedure admit that and tell me what it's sacrificing than paper over it.

  Tell me:

  - the questions to ask, in order, and what counts as a sufficient answer to each
  - where the procedure just stops and the person keeps doing what they're doing, no further discussion
  - where the issue moves to the house meeting instead, and what to do about the fact that only 11 of 32 residents ever turn up to it
  - where it needs manager sign-off, and where it isn't a factual question at all but a values question that belongs in a conversation with the resident rather than a ruling
  - which distinctions absolutely have to survive being simplified for frontline staff, and which I can safely drop
  - which steps are judgement calls wearing a procedure costume
  - what the procedure flatly cannot settle, so I stop expecting it to

  Then run it end to end on four cases, which are close to real ones:

  1. A resident cooks strongly spiced food in her own kitchen most evenings and the smell travels the corridor; four neighbours say they can't use the lounge at that time and one says she's stopped wanting to come home. The cook says what she eats in her own flat is nobody's business.
  2. A resident leaves his blinds open and his lights on late and moves around in ways three others find distressing to watch from across the courtyard; those three want a house rule about blinds after 10pm. Nobody's complaint is about their own conduct — it's entirely about his.
  3. The tenancy gives one night-shift resident sole say over whether the courtyard gate is left unlocked. He'd honestly rather it were locked, and so would everybody else including him, but he thinks the rest of the house expects him to stand on his right and he doesn't want to be the one who caved.
  4. He now offers to give up the gate right if another resident gives up the reserved parking bay; a third resident objects to the swap happening at all, on the grounds that it sets a price on things that shouldn't have one.

  Also handle the fact that some residents' capacity fluctuates week to week, so the same person may hold the same preference strongly in March and not care in April — the procedure should say what to do when the right-holder's own view is the unstable thing.

  Be straight with me if one of these comes out somewhere I'll hate. I expect case 2 will, and I'd rather know now than find out in front of the regulator, who inspects us on tenant autonomy and on communal living simultaneously and does not seem to notice that those two pull apart.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case analysis:

  1.  **Deconstruct the Request:**

      *   **Context:** 32-unit supported housing (mental health conditions). Assured tenancies (legal security), separate front doors (private sphere), shared communal spaces (public sphere).
      *   **Problem:** 4-5 disputes/week. All stem from private conduct affecting others. Current handling is inconsistent (gut feeling), leading to Ombudsman complaints.
      *   **Goal:** A written decision procedure for support workers (15 mins, no econ/legal background).
      *   **Theoretical Grounding:** Amartya Sen's "Liberal Paradox" (impossibility of satisfying both individual liberty and Pareto efficiency/unanimous preference simultaneously). The procedure must acknowledge this tension, not hide it.
      *   **Specific Requirements:**
          *   Ordered questions with sufficiency criteria.
          *   Stop points (action ends).
          *   Escalation points (House Meeting, Manager Sign-off, Values Conversation).
          *   Handling low attendance at House Meetings (11/32).
          *   Distinctions to keep vs. drop.
          *   Identification of "judgement calls in costume."
          *   Acknowledgement of what the procedure *cannot* settle.
          *   Handling fluctuating capacity/preferences.
          *   Run 4 specific cases (Spiced Food, Blinds/Lights, Gate Key, Trading Rights).
      *   **Tone:** Direct, honest, practical, acknowledging the inherent conflict (especially regarding Case 2).

  2.  **Theoretical Framework (Sen's Liberal Paradox):**

      *   *The Paradox:* You cannot have a social choice function that satisfies Minimal Liberty (everyone has at least one pair of options they decide) and Pareto Efficiency (if everyone prefers X to Y, society prefers X to Y) simultaneously.
      *   *Application:* In housing, "Liberty" = Tenancy rights/Private sphere. "Pareto" = Communal harmony/Unanimous preference of neighbors.
      *   *The Solution:* We need a *lexical priority* rule. We must decide *when* liberty trumps preference and *when* communal harm trumps liberty. We can't satisfy both always. The procedure must make this trade-off explicit.

  3.  **Drafting the Procedure (The "15-Minute Triage"):**

      *   *Step 1: Location & Tenancy Check.* Is it inside the private demesne or shared space? (Crucial distinction).
      *   *Step 2: Harm vs. Preference.* Is it objective harm (safety, health, legal) or subjective preference (annoyance, lifestyle)?
      *   *Step 3: The "Right-Holder" Test.* Who holds the right? The actor (privacy) or the complainants (quiet enjoyment of shared space)?
      *   *Step 4: Capacity/Stability.* Is the preference stable?
      *   *Step 5: Escalation.* Manager vs. Meeting vs. Stop.

      *Refining the Sen Tension:* The procedure needs a "Liberty Threshold." If an action is within the four walls and doesn't breach tenancy terms (nuisance clauses), liberty usually wins *unless* the impact on shared space is severe. But Sen says we can't always satisfy the "everyone hates this" condition. So, if it's private conduct, the "unanimous preference" of neighbors to stop it must yield *unless* it breaches a specific tenancy clause regarding nuisance.

      *Wait, the prompt asks to admit what is being sacrificed.*
      Okay, let's structure the decision tree to explicitly ask: "Are we protecting Privacy or Harmony?"
      Actually, for a support worker, "Privacy vs. Harmony" is too abstract. Let's make it "Tenancy Right vs. Communal Impact."
      *Key Distinction to Keep:* Private Sphere vs. Communal Sphere.
      *Key Distinction to Drop:* Nuanced legal definitions of "nuisance" (leave that to lawyers/managers).
      *Judgement Call:* Determining "Unbearable" vs. "Annoying."

  4.  **Addressing Specific Constraints:**

      *   *House Meeting (11/32):* Cannot be a democracy. It's a consultative forum. Decisions made there apply to all, but legitimacy is low. Need a ratification step or a "no veto" rule for non-attendees on private rights.
      *   *Manager Sign-off:* Needed when restricting a tenancy right.
      *   *Values Conversation:* When the dispute is about moral judgment, not rules.
      *   *Fluctuating Capacity:* Anchor decisions to the *Tenancy Agreement* and *Stable Preferences*, not current mood. If capacity is impaired, involve advocacy/next of kin (but keep it simple for the worker: "Is this consistent with their usual stated values?").

  5.  **Developing the Case Studies:**

      *   *Case 1 (Spices):* Private act, communal impact. Smell travels. Tenancy usually allows cooking but forbids nuisance. *Verdict:* Private sphere wins unless smell is hazardous/illegal. Sacrifice: Communal comfort.
      *   *Case 2 (Blinds):* Private act (inside flat), visual impact on shared space (courtyard). Neighbors want rule. *Verdict:* This is the Sen trap. Private sphere wins. You cannot regulate inside conduct based on outside viewing. Sacrifice: Neighbors' peace of mind. *Warning:* This will be unpopular.
      *   *Case 3 (Gate):* Right-holder wants to change, everyone agrees, but feels pressured. *Verdict:* Values conversation. It's a coordination problem, not a rights conflict.
      *   *Case 4 (Trading Rights):* Commodification of rights. *Verdict:* Manager sign-off. Tenancy rights are usually non-transferable. This is a legal/contractual issue, not a support issue.

  6.  **Refining the Procedure (Iterative Process):**

      *   *Critique:* Is 15 minutes realistic? Yes, if it's a checklist.
      *   *Critique:* Does it address Sen? Yes, by explicitly stating that if an action is within the "Protected Sphere," the "Unanimous Preference" of others to stop it is overruled.
      *   *Critique:* Fluctuating capacity? Add a "Stability Check."

  7.  **Finalizing the Output Structure:**

      *   **Introduction:** Acknowledge the Sen Paradox explicitly.
      *   **The Procedure (The "Liberty-Harm Triage"):** Step-by-step questions.
      *   **Operational Notes:** Meetings, Capacity, Manager roles.
      *   **The "Hard Truths":** What this procedure sacrifices.
      *   **Case Applications:** Running the 4 cases through the logic.

  8.  **Self-Correction/Edge Case Check during drafting:**
      *   *Case 2:* The prompt expects me to hate the outcome. I need to be firm. If we regulate blinds inside a private flat because neighbors don't like looking at them, we destroy the "assured tenancy" concept. The procedure *must* protect the resident, even if it upsets the neighbors. This aligns with the Ombudsman risk (failure to uphold tenancy rights).
      *   *House Meeting:* 11/32 is too low for binding rules on private conduct. The meeting can set *shared space* rules, but not *private flat* rules. I need to make that distinction clear.
      *   *Capacity:* Don't get bogged down in Mental Capacity Act legalisms (too complex for 15 mins). Use a "Consistency & Safety" heuristic.

  9.  **Final Polish:** Ensure tone is professional, empathetic, but unflinching about the trade-offs. (Proceed to generate response).

  *(Self-Correction during drafting the response)*: I need to make sure I don't give legal advice. I must frame everything around "Tenancy Terms" generally, not specific laws. I also need to ensure the "Sen" aspect is clear: The procedure chooses *Liberty* over *Pareto Efficiency* in private spheres.

  Let's refine the "Stop" points.
  - Stop if: Private sphere + No Tenancy Breach.
  - Escalate if: Shared space OR Tenancy Breach alleged.
  - Manager if: Restricting a right.
  - Meeting if: Shared space usage norms.

  Okay, ready to write.s
answer: |-
  This is a classic instantiation of Amartya Sen's **Liberal Paradox**. You have identified the core tension correctly: you cannot simultaneously guarantee every individual absolute liberty over their private sphere *and* guarantee that the group outcome always reflects everyone's preferences (Pareto efficiency).

  If you try to satisfy the neighbors' preference in Case 2 (blinds), you violate the resident's liberty. If you protect the resident's liberty, you violate the neighbors' preference. **One must give.**

  Your current system fails because it pretends this trade-off doesn't exist, leaving workers to guess. The procedure below makes the trade-off explicit. It prioritizes **Tenancy Rights (Liberty)** over **Communal Preference (Harmony)** within the private sphere, and prioritizes **Safety/Function** over **Preference** in the shared sphere.

  Here is the **Liberty-Harm Triage Procedure**.

  ***

  # The Liberty-Harm Triage (15-Minute Procedure)

  **Goal:** Determine if a dispute is a *Rights Issue* (protected), a *Nuisance Issue* (manageable), or a *Values Issue* (unresolvable by rule).
  **User:** Support Worker on Shift.
  **Constraint:** Do not offer legal advice. Do not mediate deep conflict. Triage only.

  ### Phase 1: The Sphere Check (2 Minutes)
  *Ask: Where is the activity happening, and where is the impact felt?*

  1.  **Is the activity taking place entirely inside a resident's private flat (behind their front door)?**
      *   **NO:** Go to Phase 2 (Shared Space).
      *   **YES:** Go to Question 2.
  2.  **Is the impact felt entirely inside the complainant's private flat?**
      *   **YES:** **STOP.** This is a conflict between two private spheres. Support workers cannot adjudicate this without breaching one tenancy to protect another. Refer both to Manager for potential mediation or legal advice. *Do not take sides.*
      *   **NO (Impact is in shared space/corridor/courtyard):** Go to Phase 3 (Nuisance Check).

  ### Phase 2: Shared Space Rules (3 Minutes)
  *Ask: Is this about the use of the commons?*

  1.  **Is there an existing, written House Agreement regarding this shared space?**
      *   **YES:** Enforce the agreement. If a resident breaches it, issue a warning.
      *   **NO:** Go to Question 2.
  2.  **Does the activity prevent others from physically using the space (blocking access, safety hazard, hygiene risk)?**
      *   **YES:** **STOP.** Activity must cease or move. Safety/Access trumps preference. Log incident.
      *   **NO (It's about atmosphere, timing, or style):** Go to Phase 4 (House Meeting).

  ### Phase 3: The Nuisance Threshold (5 Minutes)
  *Ask: Does private conduct breach the tenancy via "nuisance"?*
  *(Note: All assured tenancies prohibit causing a nuisance. This is your only lever into the private sphere.)*

  1.  **Is the impact objectively hazardous or illegal? (e.g., fire risk, drugs, violence, excessive noise after legal hours).**
      *   **YES:** **STOP.** Treat as safeguarding/police matter. Manager sign-off required immediately.
      *   **NO:** Go to Question 2.
  2.  **Is the impact a "lifestyle preference" of the complainants? (e.g., smell of food, sight of lights, sound of TV within daytime hours).**
      *   **YES:** **STOP.** **Protect the Actor.** The right to private life trumps the neighbors' preference for a different lifestyle. Explain to complainants: *"We cannot regulate conduct inside a private home unless it breaches safety or legal noise limits."*
      *   **NO (It is persistent, severe, and documented):** Go to Phase 5 (Manager Escalation).

  ### Phase 4: The House Meeting Protocol (For Shared Space Norms)
  *Use when: Shared space has no rule, and impact is non-safety (e.g., smoking in garden, noise in lounge).*

  1.  **Quorum Check:** We have 32 units. 11 attend.
      *   **Rule:** The Meeting can set rules for **Shared Spaces only**. It cannot set rules for **Private Flats**.
      *   **Legitimacy Fix:** Any rule made by the 11 must be circulated to all 32. If 5 absent residents object in writing within 7 days, the rule is void. This prevents a "tyranny of the attendees."
  2.  **Voting:** Simple majority of attendees.
  3.  **Enforcement:** Support workers enforce only *written* outcomes of this process. No verbal "house customs."

  ### Phase 5: Manager Escalation & Values Conversations
  *Use when: The procedure hits a wall.*

  1.  **Manager Sign-off Required When:**
      *   You are telling a resident to stop doing something inside their flat (Phase 3, Q2).
      *   You are restricting a specific tenancy right (e.g., keeping a door unlocked).
      *   A resident proposes trading tenancy rights (Case 4).
  2.  **Values Conversation Required When:**
      *   The "harm" is moral, not physical (e.g., "It's wrong to trade rights," "It's rude to cook that food").
      *   The resident holding the right wants to change their mind due to social pressure (Case 3).
      *   **Script:** *"This isn't about rules. It's about what kind of community you want. I can't decide this for you."*

  ### Phase 6: The Capacity & Stability Check (Ongoing)
  *Use when: A resident's preference fluctuates.*

  1.  **The "March vs. April" Test:**
      *   If a resident asserts a right in March (e.g., "I keep the gate unlocked") but wants to relinquish it in April due to pressure:
      *   **Ask:** "Is this change consistent with your long-term goals, or are you doing this to stop someone else complaining?"
      *   **If Capacity is Fluctuating:** Anchor decisions to the **Tenancy Agreement**, not current mood. The Tenancy is the stable document. If they lack capacity to understand the trade-off, involve an advocate. Do not accept a verbal waiver of rights from a vulnerable person under pressure.

  ***

  # Operational Realities: What This Procedure Does

  ### Distinctions That Must Survive Simplification
  1.  **Private Flat vs. Shared Corridor:** This is the hard boundary. You can regulate the corridor; you generally cannot regulate the flat. If you blur this, you lose the Ombudsman case.
  2.  **Safety/Access vs. Preference:** Blocking a door is different from smelling spicy food. One is functional, one is sensory.
  3.  **Right vs. Privilege:** A tenancy right (locking your door) cannot be traded for a privilege (parking bay) without legal review.

  ### Distinctions You Can Drop
  1.  **"Reasonable" vs. "Unreasonable" Nuisance:** Don't ask workers to judge reasonableness. Ask: "Is it hazardous/illegal?" If no, it's protected private conduct.
  2.  **Intent:** It doesn't matter if the resident *meant* to annoy. Impact matters for shared space; Rights matter for private space.

  ### Judgement Calls Wearing a Procedure Costume
  1.  **Phase 3, Question 2 (Lifestyle vs. Severe):** A worker must decide if a smell is "cooking" (protected) or "hoarding/rot" (nuisance). This is subjective. *Mitigation:* Require two workers to agree on "nuisance" classifications before escalating.
  2.  **Capacity Check:** Determining if a preference change is "authentic" or "coerced" is clinical, not administrative. *Mitigation:* If in doubt, maintain the status quo (the existing right) until a manager reviews.

  ### What The Procedure Cannot Settle
  1.  **Personality Clashes:** If Resident A simply hates Resident B, no rule fixes this. The procedure will output "No Breach," and the worker must accept that conflict will remain.
  2.  **The Sen Paradox:** The procedure chooses **Liberty** in the private sphere. This means neighbors *will* remain unhappy about private conduct. The procedure does not solve their unhappiness; it validates that their unhappiness does not grant them veto power over a tenancy.

  ***

  # Case Studies: Running the Procedure

  ### Case 1: The Spiced Food
  *   **Facts:** Cooking inside flat. Smell in corridor/lounge. Neighbors unhappy.
  *   **Phase 1:** Activity inside flat? **YES.** Impact in shared space? **YES** (Corridor/Lounge).
  *   **Phase 3 (Nuisance):** Hazardous/Illegal? **NO.** Lifestyle Preference? **YES.**
  *   **Decision:** **STOP.** Protect the Cook.
  *   **Rationale:** Cooking is a fundamental private right. Smell traveling in old buildings is a structural issue, not a conduct issue. To ban this is to regulate the private sphere based on others' preferences.
  *   **Action:** Tell complainants: *"We cannot restrict cooking inside private homes. We can look at ventilation improvements for the corridor, but the cooking continues."*
  *   **Sen Trade-off:** Sacrificing Communal Preference to protect Individual Liberty.

  ### Case 2: The Blinds & Lights (The One You'll Hate)
  *   **Facts:** Blinds open inside flat. Light visible from courtyard (shared). Neighbors distressed.
  *   **Phase 1:** Activity inside flat? **YES.** Impact in shared space? **YES** (Courtyard view).
  *   **Phase 3 (Nuisance):** Hazardous/Illegal? **NO.** Lifestyle Preference? **YES.**
  *   **Decision:** **STOP.** Protect the Light-Owner.
  *   **Rationale:** This is the hardest pill to swallow. What a resident does inside their home, including what they illuminate, is their liberty. The neighbors' distress is real, but it stems from *viewing* the private sphere, not from an intrusion *into* their private sphere. Regulating blinds inside a flat effectively voids the "assured tenancy" status.
  *   **Action:** Tell complainants: *"We cannot make rules about what happens inside private flats, including blinds. You have the right to close your own blinds or avoid the courtyard at that time."*
  *   **Sen Trade-off:** Sacrificing Communal Harmony to protect Individual Liberty.
  *   **Warning:** This will generate complaints. However, ruling the other way generates Ombudsman findings for "unlawful interference with tenancy." Pick the Ombudsman risk; it's cheaper than the legal risk.

  ### Case 3: The Gate Key (Coordination Problem)
  *   **Facts:** One resident holds right to lock/unlock. Everyone (including him) wants it locked. He feels pressured to "stand on his right."
  *   **Phase 1:** Activity in shared space? **YES.**
  *   **Phase 5 (Values):** Is this a rule breach? **NO.** Is it a values/pressure issue? **YES.**
  *   **Decision:** **Values Conversation.**
  *   **Rationale:** The "dispute" is fictional. Everyone agrees on the outcome (locked), but the process is stuck on social dynamics. The worker should not rule; they should facilitate.
  *   **Action:** Worker speaks to Key-Holder: *"Everyone wants this locked, including you. You are not 'caving'; you are agreeing to a consensus. We will record that the House agreed to lock the gate, so the burden isn't on you personally."*
  *   **Sen Trade-off:** None. This is a Pareto Improvement (everyone is better off). The procedure identifies it as non-conflict.

  ### Case 4: Trading Rights (Commodification)
  *   **Facts:** Resident offers to give up Gate Right in exchange for Parking Bay. Third party objects on moral grounds.
  *   **Phase 5 (Manager Escalation):** Trading Tenancy Rights? **YES.**
  *   **Decision:** **MANAGER SIGN-OFF / LEGAL REVIEW.**
  *   **Rationale:** Support workers cannot authorize the trading of tenancy clauses. Assured tenancies are legal contracts, not barter chips. Furthermore, allowing trading creates a two-tier system that violates the "supported housing" ethos.
  *   **Action:** **Block the trade.** Tell Resident: *"Tenancy rights are attached to the room, not the person. They cannot be swapped."* Tell Objector: *"You were right that this shouldn't happen, but not because it's immoral; because it's contractually invalid."*
  *   **Sen Trade-off:** Sacrificing Individual Liberty (to contract as one wishes) to preserve Structural Integrity of the scheme.

  ***

  # Handling Fluctuating Capacity
  *Scenario: The Gate Key-Holder (Case 3) says in March "I want it unlocked" but in April (during a depressive episode) says "Lock it, I don't care."*

  *   **Procedure Step:** Phase 6 (Stability Check).
  *   **Action:**
      1.  Check the Tenancy Agreement. What is the default? If the tenancy says "Resident has discretion," the default is *their* discretion.
      2.  If the change aligns with the **House Consensus** (everyone else wants it locked), accept the change but document it as a **House Decision**, not a **Resident Waiver**.
      3.  *Why?* If you record it as him "giving up a right," he might claim later he was coerced/unwell. If you record it as "The House voted to lock the gate, and the Key-Holder agreed to implement," the burden shifts to the group. This protects the vulnerable resident from future regret.

  # Final Warning
  You asked me to be straight. **Case 2 is your regulatory minefield.**
  The regulator inspects on "Tenant Autonomy" (Case 2 resident wins) AND "Communal Living" (Case 2 neighbors win). They are inspecting for two mutually exclusive states.

  If you rule for the neighbors in Case 2:
  *   **Ombudsman:** Maladministration. You interfered with an assured tenancy without legal grounds.
  *   **CQC/Regulator:** Might praise "community cohesion."

  If you rule for the resident in Case 2:
  *   **Ombudsman:** Cleared. You upheld the tenancy.
  *   **CQC/Regulator:** Might criticize "lack of community focus."
  *   **Residents:** High conflict, potential safeguarding referrals for "hostile environment."

  **My Advice:** Take the Ombudsman clearance. It is the legal shield. You can manage unhappy neighbors with support work; you cannot manage a lawsuit from a tenant whose tenancy rights you violated because others didn't like his lights. Use the procedure to show you acted consistently, even if the outcome is painful.
