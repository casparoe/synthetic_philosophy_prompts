answer: |-
  ### The Reference Sorting Tree

  **Instructions:** Answer each question based on your intuitions about the cases described. Do not worry about which theory your answer supports.

  1.  **Original Twin Earth (1975):** Oscar and Twin Oscar are molecule-for-molecule identical, but one faces H₂O and the other XYZ. Does their word 'water' refer to the same substance?
      *   **Yes:** Go to 2.
      *   **No:** Go to 3.
  2.  **Dual Content:** Is there *also* a second kind of meaning fixed by the external environment, distinct from the shared internal state?
      *   **Yes:** **Leaf A (Two-Factor Theory)**.
      *   **No:** **Leaf B (Pure Internalism)**.
  3.  **Case (a) – Communication:** The planets discover each other. Speakers borrow the word and sincerely intend to refer to the same stuff. Do their words now co-refer?
      *   **Yes:** Go to 4.
      *   **No:** Go to 6.
  4.  **Case (a) – Location:** When an Earthling visits Twin Earth, does their word 'water' switch reference to the local stuff?
      *   **Yes:** **Leaf C (Indexical Contextualism)**.
      *   **No:** Go to 5.
  5.  **Case (a) – Deference:** If location doesn't switch it, does the word refer to 'whatever the local experts call water'?
      *   **Yes:** **Leaf D (Metalinguistic Descriptivism)**.
      *   **No:** **Leaf E (Social Externalism)**.
  6.  **Case (b) – Split Life:** A speaker spends exactly 50% of their life on Earth and 50% on Twin Earth. Is there a fact of the matter about which substance they refer to?
      *   **Yes:** Go to 7.
      *   **No:** **Leaf F (Reference Nihilism)**.
  7.  **Priority:** Is reference fixed by the very first causal contact with the substance?
      *   **Yes:** **Leaf G (Causal-Historical View)**.
      *   **No:** Go to 8.
  8.  **Function:** Is reference fixed by the biological purpose of the mental state (what it is *for*)?
      *   **Yes:** **Leaf H (Teleosemantics)**.
      *   **No:** Go to 9.
  9.  **Naturalness:** Is reference drawn to the kind that 'carves nature at its joints', even if usage is vague?
      *   **Yes:** **Leaf I (Reference Magnetism)**.
      *   **No:** **Leaf J (Use-Based Conventionalism)**.

  ***

  ### Mapping the Leaves

  *   **Leaf A:** Two-Factor Theories (e.g., Field).
  *   **Leaf B:** Pure Internalism/Descriptivism.
  *   **Leaf C:** Indexical/Metalinguistic Contextualism (e.g., Cappelen & Lepore variants).
  *   **Leaf D:** Metalinguistic Descriptivism.
  *   **Leaf E:** Social Externalism (e.g., Burgean deference without indexicality).
  *   **Leaf F:** Reference Nihilism/Error Theory.
  *   **Leaf G:** Causal-Historical Views (e.g., Kripke/Putnam).
  *   **Leaf H:** Teleosemantics (e.g., Millikan).
  *   **Leaf I:** Reference Magnetism (e.g., Lewis/Sider).
  *   **Leaf J:** Use-Based Conventionalism.

  ***

  ### Logical Space Analysis

  **Empty Combinations:**
  There are no paths leading to **Teleosemantics + Indexicalism**. This is not an oversight; it is theoretically unstable. Teleosemantics grounds reference in evolutionary history, which is fixed across contexts, whereas Indexicalism makes content shift with location. A view holding both would collapse into pure Indexicalism, rendering the biological function redundant for determining reference shifts.

  **Unstable Collapses:**
  The branch separating **Causal-Historical (Leaf G)** and **Reference Magnetism (Leaf I)** is precarious. In Case (b), both often yield the same verdict (H₂O wins). Magnetism is typically invoked to save Causal theories from error; if Magnetism does the work, the 'historical' node becomes load-bearing only in name. Students landing here often realise their view is merely Magnetism with a historical heuristic.

  **Indistinguishable Leaves:**
  I must flag **Teleosemantics (Leaf H)** and **Reference Magnetism (Leaf I)**. In practice, these are nearly inseparable via intuition pumps. Both posit an objective constraint (function or naturalness) overriding usage history. Unless a student has a committed view on biological function *distinct* from metaphysical naturalness, their answers to Q8 and Q9 will likely correlate perfectly. The tree separates them in principle, but empirical sorting may fail.

  **Case (a) & (b) Load:**
  Case (a) successfully isolates the Social/Indexical cluster (Leaves C–E) from Hard Externalists. Case (b) is the only reliable splitter for the Hard Externalist cluster (Leaves G–I). Without Case (b), Causal and Teleo views often produce identical outputs on standard Twin Earth cases.
