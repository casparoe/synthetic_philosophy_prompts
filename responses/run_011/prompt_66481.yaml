      *   *Key References:* Acemoglu, Johnson, Robinson (AJR); Jeffrey Sachs (geography); Easterly (aid); Rodrik (nuance).
      *   *Specific focus:* The "Exclusion Restriction." In isotope geochemistry, if you assume a system is closed but it isn't, your age is wrong. Same here. If settler mortality affects human capital or culture directly, the IV fails.

