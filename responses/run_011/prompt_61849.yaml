  In a remote clinic, three patients—Arthur, Beatrice, and Charles—await treatment for identical fractures, but supply constraints force the doctor to choose one of three analgesic distribution schemes, each exhausting the same total stock and leaving all three in some pain. Option 1 allocates doses resulting in 4, 7, and 1 days of severe pain for Arthur, Beatrice, and Charles respectively; Option 2 shifts the burden to 1, 4, and 7 days; Option 3 rotates it to 7, 1, and 4 days. Every option inflicts exactly 12 days of total suffering across the group, and every patient suffers some harm in every scenario, ensuring neither the sum of harms nor the count of victims distinguishes the choices.

  **Pairwise Comparisons**
  When comparing Option 1 against Option 2, we assess the strongest complaint against each. Against Option 1, Beatrice complains she suffers 7 days rather than the 4 she would under Option 2 (a loss of 3); Arthur and Charles are better off or equal. Against Option 2, Charles complains he suffers 7 days rather than the 1 he would under Option 1 (a loss of 6). Since Charles's complaint (6) is stronger than Beatrice's (3), Option 1 is less reasonably rejectable than Option 2. When comparing Option 2 against Option 3, Charles's complaint against Option 2 (losing 3 days relative to Option 3) is weaker than Arthur's complaint against Option 3 (losing 6 days relative to Option 2), making Option 2 less reasonably rejectable. Finally, comparing Option 3 against Option 1, Arthur's complaint against Option 3 (losing 3 days relative to Option 1) is weaker than Beatrice's complaint against Option 1 (losing 6 days relative to Option 3), making Option 3 less reasonably rejectable. Thus, 1 is better than 2, 2 is better than 3, and 3 is better than 1.

  **Contractualist Verdict and Analysis**
  When the ordering closes on itself, contractualism yields an indeterminate verdict; no option is uniquely justified, nor are they simply tied, because the justification relation is intransitive. The single feature generating the cycle is the **comparative nature of the complaints**, where the strength of a grievance depends on the specific alternative being considered rather than the absolute burden borne. If you remove this feature and measure complaints against a fixed baseline (such as full health), the cycle vanishes: each option imposes a maximum burden of 7 days, resulting in a three-way tie rather than a cycle. The strongest reply a contractualist could make is to insist that complaints must be anchored to a common generic baseline (e.g., the status quo ante) rather than pairwise alternatives, which restores transitivity by making complaint strength intrinsic to the outcome.

  **Utilitarian Comparison**
  A utilitarian, summing the total days of pain, finds all three options morally equivalent (12 days each) and is therefore indifferent. The contractualist predicament is worse: utilitarian indifference permits the agent to choose any option without moral residue, whereas contractualist indeterminacy fails to provide any justificatory guidance, leaving the agent unable to rule any option out or definitively rule one in.
