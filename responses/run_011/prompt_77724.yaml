prompt: |-
  I am in the fourth year of a PhD in sociology, and for the past two academic years I have held a half-time appointment in my university's Office of Institutional Research, where I have become the person to whom deans and department chairs send contingency tables. Roughly once a month the request takes the same shape: here is a comparison in aggregate (pass rates under two course formats, retention under two advising models, grant success under two internal review processes, six-year completion under two bridge programs), here is the same comparison broken down by some third variable, and the two point in opposite directions. The requester wants to know which table to put in front of the provost. My office has no written answer, and different analysts have been giving different answers to structurally identical requests, which is now a reputational problem rather than a curiosity.

  Please write that answer: a decision procedure, in the form of a document I can hand to a colleague who has taken one regression course and no causal-inference training and who will have to run it under time pressure. The constraints it must survive are these. The analyst gets an hour per case. The inputs are a contingency table, a short written account of how the rows were generated, and the requester's own statement of what they intend to do about the finding. There is no software; a calculator is assumed. A statistician may be consulted only at one designated escalation point, which the procedure must define rather than leave implicit. The output is a single page naming which comparison is decision-relevant, why, what the number does not license, and what the requester must be told before they quote it. The office director co-signs, and she is not a statistician, so the reasoning has to be legible to her.

  The procedure has to carry the conceptual content rather than the slogan. I do not want "check for confounders." Specifically, it should force the analyst to settle, in a fixed order:

  1. What intervention or decision the requester actually has in mind, and whether it would be applied unit by unit or to the population as a whole — including the questions to ask a dean who does not know why this matters and would not use those words, and what to do when the requester turns out not to have one.
  2. What role the stratifying variable plays: a common cause of exposure and outcome, something the exposure itself brings about, a proxy for who was at risk, a consequence of the outcome, or an artifact of how the rows were assembled. None of this is readable off the table, so the procedure has to say what the analyst is supposed to go and find out, from whom, and what to do when nobody in the building knows.
  3. Whether the phenomenon in front of us is a reversal of an association or the failure of an association to track anything about the world, and which of those two the requester is worried about; I suspect these come apart more often than my colleagues assume, and I want the procedure to treat them separately rather than as one worry.
  4. Whether the engine of the paradox is unequal denominators, differing composition across strata, or the implicit weighting of strata — and, if the requester insists on one summary number regardless, how to produce it, how to choose the weighting, and how to disclose on the face of the document that the choice was made by a human being.
  5. Where the procedure stops. There should be an explicit class of cases in which the correct output is not a number but a refusal plus a statement of what would resolve it, and the procedure should say who signs that refusal.

  I also want the seams showing. Some of these steps can be executed mechanically and some are judgment calls wearing a procedural costume; my director will ask which is which, and I would rather the document answered her than be asked. Include a short section on the failure modes — the kinds of table and the kinds of request that will make a conscientious analyst following these instructions perfectly arrive at a confident wrong answer.

  Then run the procedure end to end on three cases. Show the arithmetic; do not just assert which table wins.

  Case A. External grant success, by school and by career band, one fiscal year. Established band: School A, 90 of 100 funded; School B, 190 of 200. Early band: School A, 20 of 200; School B, 70 of 600. School A's submissions are overwhelmingly from established investigators; School B's are overwhelmingly early career. Career band is fixed before either school's internal review process touches the proposal. The provost has asked for a single figure comparing the two schools' review processes and expects it on Friday.

  Case B. Pass rates in a required gateway course, by format and by declared track. Quantitative track: new format, 350 of 400; traditional, 90 of 100. Non-quantitative track: new format, 100 of 200; traditional, 55 of 100. The traditional cells are small because the format is being phased out. Here is the part that will matter: the new format includes a week-two exercise that actively encourages students to re-declare into the quantitative track, so track membership is partly produced by the format itself. For two years my office has published a disaggregated report on this course, and I have defended it in committee on the grounds that within every track the traditional format looks better. The registrar now wants to know whether the university should finish the phase-out for everyone. I expect the procedure to vindicate my report. If it does not, say so plainly and tell me what I should have been reporting instead.

  Case C. Six-year completion, by bridge program. Program P: 400 of 500. Program Q: 300 of 400. Within every band of entering high-school GPA, Program Q looks better; in aggregate, Program P looks better. When asked how the table was built, the analyst who compiled it says it was restricted to students who had declared a major by the end of the second year, because the completion data are messy otherwise. Program P requires declaration by the end of the second year. Program Q does not require it at all. Nobody at either program can say how many students in the other program's cohort would have met the filter. The dean of undergraduate studies wants the comparison for an accreditation self-study due in three weeks and has told my office that "no finding" is not an acceptable line item.

  Finally, a request about how you handle the contested parts. Distinguish, throughout, what is settled from what is genuinely disputed among people who work on this seriously. My own sense — which may be wrong, and which I do not want you to flatter — is that the causal-graph tradition, the potential-outcomes tradition, and a more purely evidential or associational way of talking do not describe these cases in the same vocabulary, and that a competent statistician or philosopher of science in one of those traditions might object to particular steps I have asked you to include. Wherever a step rests on such a commitment, flag it, name the commitment in a sentence, and sketch what the alternative step would look like for someone who rejects it. Do not present one school's framing as the consensus view, and do not soften the whole document by hedging every line either: I need something my colleagues can actually follow on a Tuesday. Relatedly, please do not append a bibliography or a reading list; I cannot chase it and neither can they. Name a technical concept only if you are also willing to say in one sentence what accepting it commits us to. Skip the familiar textbook illustrations of this puzzle — admissions at a large public university, kidney stones, batting averages. My analysts have all seen them, and the difficulty in my office is not in recognizing the pattern but in knowing what to do once you have.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**

      *   **User Persona:** 4th-year PhD in Sociology, working part-time in Institutional Research (IR).
      *   **Problem:** Deans/Chairs constantly present Simpson's Paradox-style scenarios (aggregate vs. stratified tables pointing in opposite directions). Analysts give inconsistent advice. Need a standardized decision procedure.
      *   **Constraints:**
          *   Analyst has 1 hour per case.
          *   Inputs: Contingency table, short text on row generation, requester's intent.
          *   Tools: Calculator only (no software).
          *   Escalation: One designated point for statistician consultation.
          *   Output: Single-page memo (Decision-relevant comparison, why, limitations, disclosure).
          *   Audience: Colleagues (1 regression course, no causal inference), Office Director (non-statistician).
          *   Content: Must address 5 specific conceptual steps (Intervention/Decision, Role of Stratifying Variable, Reversal vs. Failure, Engine of Paradox/Weighting, Stopping Rule/Refusal).
          *   Transparency: Must show "seams" (mechanical vs. judgment calls).
          *   Failure Modes: Section on where the procedure fails.
          *   Cases: Run the procedure on three specific cases (A, B, C) with arithmetic.
          *   Epistemological Honesty: Distinguish settled vs. disputed concepts (Causal graphs vs. Potential Outcomes vs. Associational). Flag commitments. No bibliography. No standard textbook examples.

  2.  **Deconstruct the 5 Required Steps:**

      *   *Step 1: Intervention/Decision.* Is it individual assignment or population policy? What if the requester doesn't know?
      *   *Step 2: Role of Stratifying Variable.* Confounder? Mediator? Collider? Selection artifact? How to find out? What if unknown?
      *   *Step 3: Reversal vs. Failure.* Is it a true causal reversal or just noise/composition? What is the requester worried about?
      *   *Step 4: Engine/Weighting.* Denominators? Composition? Weighting? How to calculate a summary if insisted? Who chooses weights?
      *   *Step 5: Stopping Rule.* When to say "No." Who signs the refusal?

  3.  **Drafting the Procedure (The "IR Memo Protocol"):**

      *   *Tone:* Professional, directive, transparent about limitations.
      *   *Structure:* Header, Purpose, The 5-Step Protocol, Failure Modes, Epistemological Notes.
      *   *Addressing the "Seams":* Explicitly label steps as [Mechanical] or [Judgment].
      *   *Addressing the "Disputed":* Add sidebars or footnotes explaining the causal commitment (e.g., "Collapsibility assumes no interaction").

  4.  **Developing the Epistemological Flags:**

      *   The prompt asks to distinguish between causal-graph, potential-outcomes, and associational views.
      *   *Key Conflict:* Simpson's Paradox is often treated as a causal puzzle (which table is *true*?), but mathematically it's an arithmetic property of weighted averages.
      *   *Commitment:* The procedure must assume a *causal* question to choose a table. If the question is purely descriptive, the aggregate is "true" for the population *as is*, but stratified is "true" for subgroups.
      *   *Flagging:* I need to explicitly state that choosing the stratified table over the aggregate assumes the stratifying variable is a *confounder* (common cause), not a *mediator* or *collider*. This is the core causal assumption.

  5.  **Running the Cases:**

      *   *Case A (Grants):*
          *   Agg: School A (110/300 = 36.7%), School B (260/800 = 32.5%). A looks better.
          *   Stratified (Established): A (90/100 = 90%), B (190/200 = 95%). B better.
          *   Stratified (Early): A (20/200 = 10%), B (70/600 = 11.7%). B better.
          *   Variable: Career Band. Fixed *before* review. Common cause of School submission mix and Success (Established win more).
          *   Decision: Compare review processes.
          *   Conclusion: Stratified is relevant. B is better. Agg is misleading due to composition (School A has easier mix).
      *   *Case B (Course Pass):*
          *   Agg: New (450/600 = 75%), Trad (145/200 = 72.5%). New looks better.
          *   Stratified (Quant): New (350/400 = 87.5%), Trad (90/100 = 90%). Trad better.
          *   Stratified (Non-Quant): New (100/200 = 50%), Trad (55/100 = 55%). Trad better.
          *   Variable: Track. *Produced* by Format (Mediator/Collider-ish).
          *   Decision: Phase out traditional?
          *   Conclusion: Aggregate is the only valid one for *overall* policy if track is a consequence. BUT, if the goal is fairness *within* tracks, stratified matters. However, since Format *causes* Track, adjusting for Track blocks the effect of Format.
          *   *Correction/Refinement:* The prompt says "I have defended [the disaggregated report]... I expect the procedure to vindicate my report. If it does not, say so plainly."
          *   *Causal Logic:* If Format -> Track -> Pass, then Track is a mediator. Adjusting for a mediator hides the total effect. The Aggregate shows the Total Effect (New is better overall). The Stratified shows the Direct Effect (Trad is better within tracks). If the decision is "Phase out for everyone," we care about the Total Effect. The analyst's previous defense (stratified) might be *wrong* for the specific decision of "phase out," but right for "is the pedagogy better?"
          *   *Wait, re-read:* "New format includes a week-two exercise that actively encourages students to re-declare into the quantitative track." This means Format causes Track. Track causes Pass (Quant track passes more).
          *   *Paradox:* Agg says New > Trad. Stratified says Trad > New.
          *   *Decision:* "Should the university finish the phase-out for everyone?" This asks about the *total impact* of the New Format. The New Format moves people to the Quant track (which has higher pass rates). That is a *benefit* of the New Format. Adjusting for Track removes this benefit.
          *   *Verdict:* The procedure should *not* vindicate the disaggregated report for *this* decision. It should recommend the Aggregate. This is a crucial test of the procedure's honesty.
      *   *Case C (Completion):*
          *   Agg: P (400/500 = 80%), Q (300/400 = 75%). P looks better.
          *   Stratified (by GPA): Q looks better in every band.
          *   Variable: Major Declaration. P *requires* it. Q does not. Data restricted to those who declared.
          *   Problem: Selection Bias / Collider. Restricting to "Declared" selects on a consequence of P (and potentially Q).
          *   Missing Data: "Nobody... can say how many students in the other program's cohort would have met the filter."
          *   Decision: Accreditation self-study. "No finding" not acceptable.
          *   Conclusion: This is a "Refusal" case. The table is structurally invalid due to selection bias. Cannot compare.
          *   *Constraint:* Dean says "no finding is not acceptable."
          *   *Procedure Step 5:* Must refuse. Who signs? Director.

  6.  **Refining the Procedure Text:**

      *   Need to make it fit the "One Hour" constraint.
      *   Need to ensure the "Director" can read it.
      *   Need to highlight the "Judgment" vs "Mechanical" parts.
      *   Need to handle the "Epistemological Flags" cleanly (maybe as shaded boxes or specific headers).

  7.  **Addressing the "Disputed" Concepts:**

      *   *Simpson's Paradox:* Is it a paradox or just weighting? (Commitment: It's weighting, but causal interpretation requires graph assumptions).
      *   *Collapsibility:* When can we aggregate? (Commitment: Only if no effect modification or if weighting matches population).
      *   *M-Bias/Colliders:* Adjusting for a common effect opens a path. (Commitment: Do not adjust for consequences of exposure).

  8.  **Final Review against Constraints:**

      *   One page output description? Yes.
      *   Calculator only? Yes (arithmetic shown in cases).
      *   Escalation point defined? Yes.
      *   Failure modes included? Yes.
      *   Cases A, B, C run with arithmetic? Yes.
      *   Epistemological flags included? Yes.
      *   No bibliography? Yes.
      *   Tone: Professional, not academic.

  9.  **Self-Correction during drafting:**
      *   *Initial thought on Case B:* I want to vindicate the analyst.
      *   *Correction:* The prompt says "If it does not, say so plainly." I must follow the causal logic. If Track is a mediator, adjusting for it is "over-control bias." The Aggregate is the correct metric for "Phase out." I must admit the analyst was likely wrong for *this* specific question, even if the stratified data is interesting for other reasons.
      *   *Initial thought on Case C:* Just say "Don't do it."
      *   *Correction:* The Dean says "No finding is not acceptable." The procedure must handle this. The output isn't a number, it's a "Refusal + Statement of what would resolve it." This fits Step 5.
      *   *Formatting:* Use clear headings. Ensure the "Seams" are visible.

  10. **Final Polish:** Check the arithmetic one last time.
      *   Case A: A (110/300 = 36.6%), B (260/800 = 32.5%). Stratified: Est (A 90%, B 95%), Early (A 10%, B 11.6%). Correct.
      *   Case B: New (450/600 = 75%), Trad (145/200 = 72.5%). Stratified: Quant (New 87.5%, Trad 90%), NonQ (New 50%, Trad 55%). Correct.
      *   Case C: P (80%), Q (75%). Stratified: Q better in bands. Selection bias on Declaration. Correct.

  11. **Writing the Document:** (Proceeding to generate output based on these thoughts).
answer: |-
  # INSTITUTIONAL RESEARCH MEMORANDUM PROTOCOL
  **Subject:** Decision Procedure for Contradictory Aggregate and Stratified Data (Simpson's Paradox)  
  **To:** IR Analysts  
  **From:** Office of Institutional Research  
  **Date:** October 26, 2023  
  **Time Allowance:** 60 Minutes per Case  

  ## PURPOSE
  When aggregate and stratified tables point in opposite directions, do not average them. Do not flip a coin. This procedure determines which number is *decision-relevant*. It assumes you have a calculator, the contingency table, and a brief account of how the data were generated. It does not assume causal inference training.

  **Escalation Point:** If Step 2 (Variable Role) cannot be resolved after contacting the data owner and the requesting administrator, stop. Escalate to the Senior Statistician. Do not proceed to calculation.

  ---

  ## THE 5-STEP PROCEDURE

  ### 1. Identify the Decision Unit [Judgment]
  **Action:** Ask the requester: "If this number supports a change, does that change apply to the *next individual student/faculty member* (e.g., advising, funding allocation) or to the *system as a whole* (e.g., phasing out a course, changing a policy)?"
  *   **Individual:** You generally need the stratified table (to match the individual's characteristics).
  *   **System/Population:** You generally need the aggregate table (unless the stratification variable is a confounder, see Step 2).
  *   **If the requester says "I don't know":** Ask, "Are you trying to fix a process or sort people?" If they cannot answer, mark this as **UNDEFINED INTENT**. Proceed to Step 5 (Refusal).

  > **Epistemological Flag:** This step assumes the *Potential Outcomes* view: a number is only valid relative to a specific intervention. An *Associational* view would argue the table simply describes the past; this procedure rejects that view because IR exists to inform future action.

  ### 2. Classify the Stratifying Variable [Judgment + Inquiry]
  **Action:** You must determine the temporal and causal relationship between the **Exposure** (Row Variable), the **Stratifying Variable** (The split), and the **Outcome** (Column Variable). Contact the program owner.
  *   **Confounder (Common Cause):** The variable exists *before* the Exposure and affects both Exposure and Outcome (e.g., Prior GPA affecting both Program Choice and Completion). **-> Use Stratified.**
  *   **Mediator (Consequence):** The Exposure *causes* the Stratifying Variable (e.g., Format causes Track Selection). **-> Use Aggregate.** (Adjusting for this hides the effect of the Exposure).
  *   **Collider (Selection Artifact):** The variable is a consequence of *both* Exposure and Outcome, or the data was filtered by it (e.g., "Only include those who declared major"). **-> REFUSE.** (The table is biased).
  *   **Unknown:** If the data owner cannot say when the variable was fixed relative to the Exposure. **-> Escalate.**

  > **Epistemological Flag:** This step relies on *Causal Graph* theory (DAGs). Specifically, it assumes adjusting for a Mediator introduces bias ("over-control") and adjusting for a Collider introduces bias ("selection bias"). A purely *Statistical* tradition might argue for adjusting for any variable that reduces variance; this procedure forbids that.

  ### 3. Distinguish Reversal from Composition [Mechanical]
  **Action:** Calculate the rates.
  *   If the direction flips (A > B in aggregate, B > A in strata): This is a **Reversal**. Proceed to Step 4.
  *   If the direction stays the same but magnitude changes significantly: This is **Effect Modification**. Report the stratified numbers; do not report a single aggregate.
  *   **Requester Worry:** Ask the requester: "Are you worried the aggregate is lying, or that the subgroups are too small to trust?"
      *   If they fear the aggregate is lying (due to mix): Trust Step 2.
      *   If they fear small subgroups: Trust Aggregate, but add confidence intervals (if software available) or suppress small cells (n < 10).

  ### 4. Determine the Weighting [Mechanical + Judgment]
  **Action:** If Step 2 dictates the Stratified table is decision-relevant, you cannot simply present the strata. The Provost wants one number. You must construct a **Standardized Rate**.
  *   **The Problem:** School A might have 90% of its students in the "easy" stratum, while School B has 10%. Comparing raw strata averages weights the "easy" stratum differently for each school.
  *   **The Fix:** Apply a **Common Weight**. Use the *total population's* distribution across strata as the weight for both groups.
      *   *Formula:* `(Rate_Stratum1 * Total_Pop_Stratum1) + (Rate_Stratum2 * Total_Pop_Stratum2) / Total_Population`
  *   **Disclosure:** The memo must state: "Weights based on [Total Population]. Choice of weights is a human judgment."

  > **Epistemological Flag:** This assumes *Collapsibility* is desirable only when weights match the target population. Some *Bayesian* approaches would model the hierarchy directly; we lack the software/time for that.

  ### 5. The Stopping Rule [Judgment]
  **Action:** If Step 2 identifies a **Collider/Selection Artifact** OR Step 1 yields **Undefined Intent**, the output is not a number.
  *   **Output:** A one-page "Refusal Memo."
  *   **Content:** "The available data cannot answer the question because [Reason]. To resolve, we need [Missing Data/Clarification]."
  *   **Signature:** This memo requires the **Office Director's signature**. An analyst cannot sign a refusal.

  ---

  ## FAILURE MODES
  *Even if followed perfectly, this procedure can yield a confident wrong answer in these scenarios:*

  1.  **Unmeasured Confounding:** Step 2 identifies "Career Band" as the confounder, but "Department Culture" is the real driver, and it correlates with Band. The procedure validates the Stratified table, but the causal conclusion is still wrong. *Mitigation:* Disclose "Residual confounding possible."
  2.  **Small Cell Instability:** Step 4 produces a standardized rate, but one stratum has n=3. The rate is mathematically valid but statistically volatile. *Mitigation:* Suppress cells < 10 before calculation.
  3.  **The "Policy Creates Population" Problem:** In Case B, the policy changes the population composition over time. A static standardization (Step 4) assumes the population mix stays constant, which the policy itself prevents. *Mitigation:* Note that the standardized rate applies only to the *current* population mix.

  ---

  ## CASE RUN-THROUGHS

  ### CASE A: Grant Success (School A vs. School B)
  **1. Decision Unit:** Provost wants to compare "review processes." This is a **System/Population** decision (resource allocation/process improvement).
  **2. Variable Role:** "Career Band." Text says: "Fixed before either school's internal review process." Band affects Success (Established win more). Band affects School Mix (School A has more Established).
  *   **Classification:** **Confounder.** (Exists before Exposure, affects Outcome).
  *   **Directive:** Use Stratified/Standardized.
  **3. Reversal:**
  *   Aggregate A: 110/300 = **36.7%**
  *   Aggregate B: 260/800 = **32.5%** (A looks better)
  *   Stratified Established: A (90/100=90%) vs B (190/200=95%). **B Better.**
  *   Stratified Early: A (20/200=10%) vs B (70/600=11.7%). **B Better.**
  *   **Status:** True Reversal.
  **4. Weighting:**
  *   Total Population: 300 (A) + 800 (B) = 1100 proposals.
  *   Total Established: 100 + 200 = 300. Weight = 300/1100 = **0.27**
  *   Total Early: 200 + 600 = 800. Weight = 800/1100 = **0.73**
  *   *Standardized Rate A:* (0.90 * 0.27) + (0.10 * 0.73) = 0.243 + 0.073 = **31.6%**
  *   *Standardized Rate B:* (0.95 * 0.27) + (0.117 * 0.73) = 0.256 + 0.085 = **34.1%**
  **5. Output:**
  *   **Decision-Relevant:** Standardized Stratified Rates.
  *   **Finding:** School B's process is more effective (34.1% vs 31.6%).
  *   **Disclosure:** "Aggregate favored School A only because School A submits proportionally more Established investigators. Weights applied based on total submission volume."
  *   **Sign-off:** Analyst.

  ### CASE B: Gateway Course (New vs. Traditional Format)
  **1. Decision Unit:** "Should the university finish the phase-out for everyone?" This is a **System** decision.
  **2. Variable Role:** "Declared Track." Text says: "New format includes a week-two exercise that actively encourages students to re-declare into the quantitative track."
  *   **Classification:** **Mediator.** (Format *causes* Track).
  *   **Directive:** Use **Aggregate**. (Adjusting for Track removes the benefit of the New Format moving students to the easier track).
  *   *Note to Analyst:* Your previous defense of the disaggregated report was causally incorrect for *this* question. You measured the direct effect of pedagogy, but the Provost is asking about the total effect of the Format.
  **3. Reversal:**
  *   Aggregate New: 450/600 = **75.0%**
  *   Aggregate Trad: 145/200 = **72.5%** (New looks better)
  *   Stratified Quant: New (87.5%) vs Trad (90%). **Trad Better.**
  *   Stratified Non-Quant: New (50%) vs Trad (55%). **Trad Better.**
  *   **Status:** True Reversal.
  **4. Weighting:** Not required. Aggregate is the decision-relevant metric because Track is a consequence of Exposure.
  **5. Output:**
  *   **Decision-Relevant:** Aggregate Pass Rates.
  *   **Finding:** New Format yields higher overall pass rates (75% vs 72.5%).
  *   **Disclosure:** "Stratified rates favor Traditional format within tracks. However, Track membership is partially determined by the Format. Adjusting for Track hides the mechanism by which the New Format improves success (migration to Quantitative track)."
  *   **Sign-off:** Analyst. (Director review recommended due to contradiction of prior reports).

  ### CASE C: Completion (Program P vs. Program Q)
  **1. Decision Unit:** Accreditation self-study. **System** decision.
  **2. Variable Role:** "Declared Major by End of Year 2." Text says: "Program P requires declaration... Program Q does not." Data restricted to "students who had declared."
  *   **Classification:** **Collider / Selection Artifact.** (Inclusion in the table depends on a consequence of the Program).
  *   **Directive:** **REFUSE.** (Step 5).
  *   **Reasoning:** Program P filters out non-declarers automatically. Program Q only includes them if they chose to. We are comparing P's *completers* to Q's *self-selected declarers*. We do not know the denominator for Q's non-declarers.
  **3. Reversal:**
  *   Aggregate P: 400/500 = **80%**
  *   Aggregate Q: 300/400 = **75%**
  *   Stratified (GPA): Q better in every band.
  *   **Status:** Selection Bias Paradox.
  **4. Weighting:** Impossible. The denominators are structurally different populations.
  **5. Output:**
  *   **Decision-Relevant:** None.
  *   **Finding:** "No finding."
  *   **Disclosure:** "The comparison is invalid. Program P's inclusion criteria (major declaration) filters the cohort, while Program Q's does not. The table compares P's mandated cohort to Q's self-selected cohort. Completion rates cannot be compared without data on Q students who did not declare."
  *   **Sign-off:** **Office Director.** (Per Step 5).
  *   **Action:** Analyst drafts refusal; Director signs and calls the Dean.

  ---

  ## EPISTEMOLOGICAL NOTES FOR THE DIRECTOR
  *Why we do it this way, and where experts might disagree.*

  1.  **Causality vs. Description:** We treat these tables as causal claims (Step 1). A pure statistician might argue the Aggregate is the "true" description of the population *as it currently exists*. We reject this because IR advises on *changes*. If we change the system, the population mix changes.
  2.  **The "Mediator" Dispute (Case B):** In Case B, we recommend the Aggregate. Some methodologies argue that if you want to know if the *pedagogy* is better, you must adjust for Track. We prioritize the *Policy* question (Phase out?) over the *Mechanism* question (Is teaching better?). If the Dean asks "Is the teaching worse?", the answer is Yes (Stratified). If the Dean asks "Should we phase it out?", the answer is No (Aggregate). This protocol prioritizes the latter.
  3.  **The "Refusal" Commitment (Case C):** Step 5 requires a refusal. In academia, "no finding" is often penalized. We institutionalize the refusal to protect the office from certifying biased data. This commits the Director to defending the *absence* of a number.

  **End of Protocol**
