          *   Popper says: Yes. Historicism is precisely the belief that you can take a trend and project it into the future to predict the destiny of society. Even if the trend is real *now*, assuming it *must* continue is historicist.
          *   The student's reasoning ("quantitatively precise... makes it a genuine law") contradicts Popper's philosophy of science (corrigibility, falsifiability). A trend becoming a law just because it lasted 50 years is not Popperian.
