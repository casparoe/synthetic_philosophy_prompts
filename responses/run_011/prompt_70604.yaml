      *   (b) Student gets the classification wrong (says Law, Popper says Trend). Gets the Historicism verdict wrong (says No, Popper says Yes). The reasoning is confident but incorrect. This is a major failure on the application part. 2/8 is probably fair, maybe 3/8 for engaging with the Oedipus point even if misapplied. Let's go with 3/8 to be generous on the engagement, but the conceptual error is big.
