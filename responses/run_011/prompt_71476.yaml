answer: |-
  ### Theory Correction: Tolstoy Without the Halo

  You have the skeleton right, but you've softened the muscles. Here is where your recollection differs from the text, which matters for the rubric:

  1.  **Infection is not Empathy:** It is not "I understand what you felt." It is "I feel *as if* I created this." The separation between artist and receiver is abolished. If the reader admires the craft ("flawless voice"), infection has **failed**. Admiration is a sign of distance.
  2.  **Sincerity is the Gate, not the Goal:** You said sincerity matters most. Tolstoy says it is the *most important condition*, but it is negative evidence. You cannot prove sincerity; you can only detect its absence via **Counterfeits**. If a text exhibits borrowing, imitation, effectfulness, or diversion, sincerity is presumed absent.
  3.  **Art vs. Good Art:** Tolstoy distinguishes between "Art" (infection occurs) and "Good Art" (infection + universal feeling). A story can be infectious (Art) but transmit exclusive feelings like sexual lust, patriotism, or class contempt (Bad Art). Your rubric must decide if you are screening for *Art* or *Good Art*. Given your nonprofit mission, you are likely screening for *Good Art*.
  4.  **Accessibility is Mandatory:** Tolstoy argues that if art requires education to understand, it is counterfeit. Obscurity is a sin. This supports your community program writers over the "cultured" Russian voice.

  ### The Tolstoyan Screening Procedure

  | step_number | question_the_reader_asks | what_a_pass_looks_like | what_a_fail_looks_like | fact_or_judgment |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | **Did I feel what the writer felt?** (Infection) | A specific emotion or state of mind transferred to me; I feel the urgency of the piece; I forget to evaluate the writing. | I feel nothing; I feel admiration for the skill; I feel bored; I feel confused about what I'm supposed to feel. | **Fact (Reader's State).**<br>Fail = **STOP (Reject)**. |
  | 2 | **Is this feeling manufactured?** (Counterfeits) | The feeling arises from the event/voice itself; the form feels necessary to the content. | Use of stock imagery (moonlight, hermits); descriptive padding without emotion; shock value without cause; amusement that distracts from feeling. | **Fact (Textual Markers).**<br>Fail = **STOP (Reject)**. |
  | 3 | **Does the writer believe this?** (Sincerity) | The voice feels vulnerable or urgent; there is risk in the telling; no attempt to impress the reader. | The voice feels performative; it seems designed to win approval or signal status; it feels safe or cynical. | **Judgment (Reader).**<br>Fail = **STOP (Reject)**. |
  | 4 | **Does this feeling unite or divide?** (Universality) | The feeling is accessible to anyone regardless of class/background (grief, joy, fear, love); it humanizes the subject. | The feeling relies on insider knowledge; it relies on contempt for a specific group/person; it celebrates exclusion or superiority. | **Judgment (Values).**<br>Fail = **ESCALATE to Editor**. |

