  ### Proposed Further Exhibit

  To separate the two surviving principles (**Genuine Waste** vs. **Consequences of Being Caught**), I propose the following exhibit:

  **Exhibit (d): The "Blood Oath" Verbal Claim.**
  A signaller makes a verbal claim of quality (e.g., "I am a skilled warrior") which costs negligible energy to produce (no waste). However, the cultural context dictates that if the claim is proven false, the signaller is executed (severe consequence). If the claim is true, they gain status.

  **What must be true for the test to work:**
  1.  **Verification must be possible:** There must be a mechanism to catch the liar (otherwise the consequence cannot trigger).
  2.  **Cost of production must be near-zero:** To isolate the "Consequence" principle from the "Waste" principle.
  3.  **Marginal cost of production must be flat:** Both high and low quality signallers pay the same (near-zero) energy to speak.

  **The Separation:**
  *   **If she Accepts (d):** She validates **Principle 4 (Consequences)**. She admits that a signal can be "costly" (in terms of risk) and "honest" without "Genuine Waste" in production. This would retroactively challenge Ruling 6 (Suit), suggesting the suit was rejected not because it lacked waste, but because the *consequences* of wearing it while unqualified were not severe enough.
  *   **If she Rejects (d):** She validates **Principle 1 (Waste)** as the primary driver. She maintains that for a signal to count as a *costly signal*, the cost must be paid *upfront* in production/maintenance, not *post-hoc* in punishment. This confirms that "Costly Signalling" in her seminar is strictly about Handicaps, not about Punishment-based Honesty.
