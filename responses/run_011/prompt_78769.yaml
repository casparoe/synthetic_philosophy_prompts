  ### Predicted Verdicts and Reasoning

  **(a) The Fiddler Crab's Regenerated Claw**
  *   **Verdict:** **Rejected** as an honest costly signal.
  *   **Reasoning:** She will rule that while the claw is used in display, it fails the condition-dependence test essential to the handicap principle. In exhibits 1 through 4, the signal's cost was higher for low-quality individuals (weak peacocks, dull finches). Here, the "low-quality" signaller (the injured male with the regenerated claw) pays *less* to produce and wave the signal than the high-quality male with the original claw. Because the marginal cost falls more lightly on the weaker signaller, the signal cannot guarantee honesty regarding fighting ability. The fact that rivals and females do not discriminate confirms the signal has lost its informational value; it is, effectively, cheap talk.

  **(b) The Human Blush**
  *   **Verdict:** **Rejected** as a costly signal (though implicitly accepted as an *honest* signal).
  *   **Reasoning:** This will be treated as a direct parallel to Ruling 7 (the ground squirrel's alarm call). She will argue that while the blush is reliable and promotes trust, its reliability stems from physiological constraint (it is involuntary and impossible to fake at will), not from the imposition of a fitness cost. Since it "costs the blusher nothing material," it classifies as an *index* or a *handicap-free honest signal*, not a *costly* one. To classify it as a costly signal would contradict her explicit distinction in Ruling 7.

  **(c) The Founder's Modesty (Grey T-shirt)**
  *   **Verdict:** **Rejected** as an honest costly signal.
  *   **Reasoning:** This is the most difficult case, but consistency with Ruling 6 (the rented suit) dictates rejection. In Ruling 6, she rejected a signal because the "outlay does not vary with the quality being advertised." In this exhibit, the material outlay (the t-shirt) is identical for the founder and the newcomer. While the *consequences* of wearing the shirt differ (the newcomer risks being ignored; the founder does not), the supervisor's record prioritizes *expenditure of resources* (energy, pigments, time, risk of predation) over *social risk of misinterpretation*. She will likely argue that the signal itself is cheap; the "cost" lies in the observer's prior knowledge, not in the signal's production. Therefore, it lacks the "genuine waste" required by Rulings 1–5.

  ***

  ### Candidate Principles and Their Status

  Based on the seven prior rulings, we can evaluate the four candidate principles provided in your brief:

  1.  **Honesty requires genuine waste.**
      *   **Status: Live (for "Costly Signals").**
      *   **Evidence:** Rulings 1–5 and 6 all hinge on the presence or absence of cost/waste/outlay. However, Ruling 7 clarifies that *honesty itself* does not require waste (the alarm call is honest but not costly). Thus, waste is a necessary condition for the specific category *Costly Signal*, but not for *Honesty* generally.
  2.  **Honesty requires the marginal cost to fall harder on low-quality signallers.**
      *   **Status: Live.**
      *   **Evidence:** Rulings 1–4 explicitly describe costs that weak/poor individuals cannot afford. Ruling 6 rejects the suit because the cost was flat (did not vary with quality). This is the core of the Handicap Principle in her seminar.
  3.  **Honesty requires faking to be physically impossible.**
      *   **Status: Ruled Out (for "Costly Signals").**
      *   **Evidence:** Rulings 1–4 describe traits that *could* theoretically be faked if the signaller did not care about survival (e.g., a weak peacock *could* grow a train and die). The honesty comes from the *cost*, not physical impossibility. Furthermore, Ruling 7 accepts a trait based on impossibility (involuntary blush/alarm) but explicitly excludes it from the *costly signal* category. Thus, physical impossibility defines an *index*, not a *costly signal*.
  4.  **Honesty can be secured by the consequences of being caught.**
      *   **Status: Underdetermined.**
      *   **Evidence:** Ruling 7 mentions the caller's "own interest in the response" and the fact that listeners "can see for themselves," which hints at verification and consequences. However, she ruled this was *not* a costly signal. There is no instance in the record where a trait was accepted as a *costly signal* primarily because lying would lead to punishment. It remains a live possibility for *honesty*, but untested for *costly signalling*.

  ***

  ### The Most Diagnostic Exhibit

  **Exhibit (c) (The Founder's Modesty)** is the most diagnostic of the three new cases.

  **Where the Principles Part Company:**
  This exhibit creates a conflict between **Principle 1 (Genuine Waste)** and **Principle 2 (Marginal Cost/Differential Consequence)**.
  *   **Principle 1 (Waste)** demands rejection. There is no material waste; the t-shirt is cheap for everyone.
  *   **Principle 2 (Marginal Cost)** could demand acceptance. The "cost" of the strategy (wearing the t-shirt) is vastly higher for the low-quality signaller (the newcomer who loses status) than for the high-quality signaller (the founder who loses nothing). This is a differential marginal cost, but it is borne in *social capital*, not biological resources.

  **The Commitment:**
  *   **If she Rules Accepted:** She commits to the view that "Cost" includes **opportunity costs of social reputation**. This would broaden the seminar's scope from biological handicaps to game-theoretic signalling generally, effectively overruling the strict "outlay" logic of Ruling 6.
  *   **If she Rules Rejected:** She commits to the view that "Cost" must be **intrinsic to the signal's production** (energy, material, predation risk), regardless of the external consequences. This maintains the biological purity of the Handicap Principle but excludes "counter-signalling" strategies common in human economics.

  *Note on Underdetermination:* The record genuinely underdetermines this verdict. Ruling 4 (Stotting) accepts "opportunity cost" (time not spent fleeing), which supports the Founder case. However, Ruling 6 (Suit) rejects "flat outlay," which supports rejecting the Founder case. The tension lies in whether "risk of social demotion" counts as a biological opportunity cost or a contextual interpretation. By ruling either way, she defines the boundary between *biological signalling* and *sociological signalling*.

