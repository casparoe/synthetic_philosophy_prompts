  *Vignette 3.1:* During a Q3 review, an Associate cited a goal set in January as justification for current inaction. Management corrected this by noting the Associate is not the person who signed the January document. The Associate was required to author a new justification in real-time, acknowledging the inertness of prior data. The past goal is a fact, but not a command. To claim otherwise is to deny the liberty of the present moment.

  **4. IMPLEMENTATION AND VISIBILITY**
  Permanent visibility to colleagues is proposed as a productivity instrument on the grounds that being seen is what supplies an employee with a stable self. Open-plan workflows and transparent digital logs are mandatory. Without the gaze of the Other, the self dissolves into pure possibility. We require you to be seen to be someone. Digital surveillance tools will track keystroke variance to ensure active choosing is occurring continuously throughout the workday.

  The demand for total sincerity is self-defeating, because a person required to declare what he really is cannot coincide with it, which means the authenticity audit manufactures precisely the bad faith it was commissioned to detect. Therefore, sincerity declarations must be updated hourly to prevent fixation. You cannot be a Manager; you must manage. To claim the identity is to freeze the flux.

  *Case Study 4.1 (Customer Facing):* An Agent followed the service script with exact fidelity. This performance was diagnosed as a shade too precise. By becoming the role completely, the Agent denied the freedom to deviate. Corrective action: The Agent must introduce deliberate variance to demonstrate authorship of the interaction. To be the script is to lie. The customer demands a human, not a function.

  *Case Study 4.2 (One-to-One):* In a management meeting, a colleague's hand resting on the table is noticed and the conversation is then steered, at some length, toward the quarterly roadmap. This steering avoids the anguish of the hand's presence (facticity) by fleeing into future projects (transcendence). Managers must interrupt such steering and remain with the object until discomfort resolves. The hand is there; the roadmap is a projection. Sit with the hand.

  **5. GLOSSARY**
  > **Anguish:** The recognition of unlimited choice.
  > **Facticity:** The physical data of the situation (e.g., the hand, the script).
  > **Bad Faith:** Lying to oneself to escape freedom.
  > **Seriousness:** Treating values as external objects.

  **6. FAQ FOR LINE MANAGERS**
  **Q: Can I enforce authenticity?**
  A: You must mandate the condition of freedom. Enforcement is paradoxical but required.
  **Q: What if they refuse?**
  A: Refusal is a choice. Document the refusal as an exercise of agency.
  **Q: Does the playbook protect me?**
  A: No. Using the playbook to avoid choice is the primary violation.
  **Q: What if the values contradict?**
  A: Values are not facts. You must choose between them without excuse.
  **Q: Will this cause anguish?**
  A: Anguish is the signal of correct implementation. Do not mitigate it.

  **7. COMPLIANCE AND ATTESTATION**
  This programme is a compliance requirement with attestations and escalation paths. All staff must sign the Attached Freedom Waiver by Friday. Failure to sign is interpreted as a signed declaration of Bad Faith. Escalation paths lead directly to the Chief Freedom Officer. Non-compliance will be treated as a voluntary resignation of your position within the human community. Authenticity is mandatory. You are free to comply. The Waiver itself constitutes a binding contract acknowledging that you are the sole author of your employment status.

