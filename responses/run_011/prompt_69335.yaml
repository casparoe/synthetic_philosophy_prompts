answer: |-
  # Specification for Bounded Logical Belief

  The following is a specification of desiderata for a formal theory of degrees of belief held by a computationally bounded agent reasoning over a fixed formal language (e.g., first-order arithmetic). This specification is designed to distinguish between theories of idealized omniscience and theories of bounded logical reasoning. It prioritizes constraints relevant to implementation within a fixed compute budget.

  ## I. The Desiderata

  ### 1. Non-Omniscience with Logical Consistency
  **Specification:** The agent must not assign probability 1 to all provable sentences nor 0 to all disprovable sentences at finite time $t$. However, the agent's beliefs must not violate the axioms of probability *more than necessary* given its compute budget. Specifically, for any sentences $A$ and $B$, the violation of $P(A) = P(A \land B) + P(A \land \neg B)$ must be bounded by a function of the computational effort expended to verify that relationship.
  **Motivation:** Idealized Bayesianism fails here by assuming all logical consequences are known instantly. A bounded agent must admit ignorance of theorems. However, total incoherence (e.g., $P(A) + P(\neg A) \neq 1$) renders the beliefs unusable for decision theory.
  **Status:** **Non-negotiable.** (Note: Strict coherence is impossible for bounded agents; the requirement is that incoherence is *quantified* and *minimized* relative to effort.)

  ### 2. The Uncomputed Sentence and Prior Provenance
  **Specification:** For a sentence $S$ on which the agent has expended zero proof-search effort, the theory must specify $P(S)$ without defaulting to $1/2$ by fiat. If the theory assigns $1/2$, it must explicitly declare the symmetry assumption licensing this (e.g., maximum entropy over truth values). If it assigns $p \neq 1/2$, it must identify the source of the bias (e.g., syntactic complexity, pattern matching against known axioms).
  **Motivation:** A default of $1/2$ is not an innocent placeholder. Logical uncertainty is not empirical uncertainty. Assigning $1/2$ to "There are an even number of primes" and $1/2$ to "There are an odd number of primes" is coherent, but assigning $1/2$ to $A$ and $1/2$ to $B$ where $A \implies B$ violates monotonicity immediately. The "extra structure" required is a prior over *logical relationships* or *syntactic features*, not just truth values. A theory that hides this prior is smuggling in assumptions about the structure of mathematics.
  **Status:** **Non-negotiable.** (Theories that treat $1/2$ as a null hypothesis without justifying the symmetry are inadequate.)

  ### 3. Distinction Between Hard Tautologies and Independent Conjectures
  **Specification:** The theory must distinguish between a tautology $T$ whose proof is too long to verify (e.g., a massive propositional validity) and a conjecture $C$ that has resisted proof despite serious effort (e.g., Riemann Hypothesis). $P_t(T)$ should approach 1 as syntactic verification heuristics improve, even without a full proof. $P_t(C)$ should remain sensitive to empirical-style evidence (e.g., checking first $N$ cases) without converging to 1 prematurely.
  **Motivation:** A theory based solely on proof length assigns both sentences low probability (or undefined) until the proof is found. This collapses the distinction between "true but hard" and "possibly false." An adequate theory must utilize partial verification (e.g., model checking, probabilistic checking) to differentiate them.
  **Status:** **Non-negotiable.**

  ### 4. Non-Logical Testimony Integration
  **Specification:** The agent must be able to update $P(S)$ upon receiving testimony "Agent $X$ claims to have a proof of $S$" without verifying the proof. The update magnitude must depend on a model of $X$'s reliability and $X$'s compute budget, distinct from the logical relationship between $X$'s claim and $S$.
  **Motivation:** Mathematical practice relies on trust in peer review before formal verification. A theory that requires the receiving agent to verify the proof to update belief fails to model social epistemology or distributed computation.
  **Status:** **Preference of the "Social/Embedded" Camp.** (Strict formalists may argue belief should only track personal verification, but for bounded agents, this is practically paralyzing.)

  ### 5. Self-Reference and Reflection
  **Specification:** The agent must assign probabilities to sentences regarding its own future beliefs, e.g., $P_t( P_{t+k}(S) > 0.9 ) \approx P_{t+k}(S)$. Crucially, this must hold without leading to inconsistency (Löbian obstacles) when the sentence refers to the agent's own compute cutoff (e.g., "I will not find a proof of this within budget $B$").
  **Motivation:** An agent that cannot trust its own future reasoning cannot delegate tasks or plan. However, standard coherence + computability + self-knowledge leads to diagonalization paradoxes (the agent can construct a sentence that is true iff the agent assigns it low probability).
  **Status:** **Non-negotiable** (for autonomous agency), but recognized as the primary site of theoretical failure.

  ### 6. Finite-Stage Guarantees vs. Asymptotics
  **Specification:** For any guarantee $G$ offered by the theory (e.g., "no Dutch Book," "calibration"), the theory must state whether $G$ holds at every finite step $t$ or only in the limit $t \to \infty$. For an agent with a fixed compute budget, guarantees that hold only in the limit must be flagged as **non-deliveries**.
  **Motivation:** Convergence theorems are promises to pay after the agent is dead. A theory that ensures coherence only in the limit offers no protection against exploitation during the agent's operational lifetime.
  **Status:** **Non-negotiable.** (This is the primary constraint for implementation.)

  ### 7. Computational Tractability of Belief Formation
  **Specification:** The cost of computing $P_t(S)$ must be strictly less than the cost of verifying $S$ via brute-force proof search, otherwise the belief mechanism is redundant.
  **Motivation:** If calculating the probability takes as long as finding the truth, the agent should just find the truth. Logical uncertainty is only valuable if it is cheaper than logical certainty.
  **Status:** **Non-negotiable.**

  ---

  ## II. Incompatibilities and Diagonalization

  You asked to identify jointly unsatisfiable subsets. There is a known trilemma involving **Computability**, **Strict Coherence**, and **Non-Dogmatism**. You have already accepted that Computability + Strict Coherence is impossible. However, there is a deeper breakage regarding **Reflection**.

  **The Diagonal Argument on Reflection:**
  If a theory demands:
  1.  **Computability:** The probability distribution $P_t$ is computable by the agent.
  2.  **Uniform Reflection:** The agent trusts its future self, such that $P_t( P_{t+k}(S) \in (a, b) ) \approx P_{t+k}(S)$ for all $S$.
  3.  **Non-Dogmatism:** The agent never assigns probability 0 or 1 to contingent logical sentences (to allow for updating).

  Then the theory is vulnerable to a **Löbian Diagonalization**. The agent can construct a sentence $G$ that effectively says, "My probability at time $t+k$ will be less than $1/2$."
  *   If the agent believes $G$ (prob > 1/2), then $G$ is false (since it claims prob < 1/2), so the agent is incoherent.
  *   If the agent disbelieves $G$ (prob < 1/2), then $G$ is true, so the agent is incoherent (assigning low prob to a true sentence about itself).
  *   To avoid this, the agent must be dogmatic (assign 0 or 1) or imprecise (assign a wide interval).

  **Conclusion:** You cannot have a computable, coherent, self-reflective agent that is also non-dogmatic about its own reasoning. One must break. For bounded agents, **Uniform Reflection** is the casualty. The theory must specify *which* self-referential sentences are excluded from the reflection principle.

  **On Bounded-Trader Relativization:**
  Your friend's position (No-exploitability by bounded traders) pushes the "Computability" constraint into the adversary. If traders are bounded by polynomial time $p(n)$, the agent can be coherent relative to them. However, as the bound $p(n)$ increases, the cost of maintaining that coherence increases.
  *   **The Break Point:** If you demand no-exploitability by *all* polynomial-time traders, the agent's belief formation becomes intractable (it must simulate all traders).
  *   **Discrimination Failure:** If you relax the trader bound too much (e.g., constant time), the "no-exploitability" condition becomes too weak to discriminate between a smart reasoner and a random guesser. A random guesser cannot be Dutch-booked by a constant-time trader easily. The standard stops discriminating when the trader's budget is insufficient to identify the logical inconsistencies in the agent's beliefs.

  ---

  ## III. The Single Eliminator

  The single desideratum that eliminates the most candidate accounts is:
  **Desideratum 6: Finite-Stage Guarantees.**

  **Reasoning:**
  *   **Textbook Bayesianism** fails immediately (requires omniscience for coherence).
  *   **Logical Induction (Bounded-Trader)** offers guarantees *only in the limit*. It ensures that exploitability vanishes as $t \to \infty$. It does *not* guarantee that the agent is not exploitable at step $t=10^9$. For a fixed compute budget, this is a failure of specification.
  *   **Proof-Length Models** fail Desideratum 3 (Tautology vs. Conjecture) and Desideratum 2 (Prior Provenance), but they do offer finite-stage values.
  *   **Heuristic/Pattern-Matching Models** (e.g., neural net estimators) often fail Desideratum 1 (Consistency) and Desideratum 5 (Reflection).

  Most formal theories of logical uncertainty are asymptotic. They prove that "eventually, the agent will be smart." They do not prove "the agent is safe to deploy now." For an agent with a fixed budget, asymptotic safety is indistinguishable from no safety. Demanding finite-stage bounds eliminates almost all existing formal literature, leaving only ad-hoc engineering constraints.

  ---

  ## IV. Scorecard

  | Contender | Non-Omniscience | Finite-Stage Coherence | Tautology vs. Conjecture | Self-Reference | Verdict for Fixed Budget |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Textbook Bayesianism** | **FAIL.** Assigns 1 to all theorems instantly. | **PASS** (by fiat). | **FAIL.** Collapses all truths to prob 1. | **FAIL.** Inconsistent with own computability. | **Rejected.** Theoretically clean, practically impossible. |
  | **Bounded-Trader (Logical Induction)** | **PASS.** Learns over time. | **FAIL.** Guarantees are asymptotic only. Finite-stage exploitability is possible. | **PASS.** Market dynamics distinguish based on trade patterns. | **WEAK.** Satisfies reflection only in the limit. | **Conditional.** Useful as a design goal, but offers no runtime safety guarantee. |
  | **Proof-Length Proposals** | **PASS.** Prob = $f(\text{min proof length})$. | **PASS.** Computable at finite stage. | **FAIL.** Cannot distinguish unproven tautology from false conjecture (both have infinite/unfound length). | **FAIL.** No mechanism for self-trust. | **Rejected.** Too brittle; fails on independent sentences. |

  **Summary:** None of the three contenders fully satisfies the specification for a fixed-budget agent. Textbook Bayesianism is impossible. Proof-Length is too dumb. Bounded-Trader is too slow to guarantee safety. An adequate theory must likely be a hybrid: a Proof-Length or Pattern-Matching core (for finite-stage speed) constrained by a Bounded-Trader loss function (for directional accuracy), with explicit flags on which self-referential sentences are off-limits.
