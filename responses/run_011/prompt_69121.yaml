answer: |-
  **1. Examination Question**

  Physicists often claim philosophy is obsolete, while philosophers claim physics needs them. Distinguish the **Incubator Thesis** (philosophy births new sciences) from the **Collaborator Thesis** (philosophy aids mature sciences). Distinguish three grades of contribution: (i) **conceptual hygiene** (removing ambiguity); (ii) **hypothesis generation** (proposing testable claims); (iii) **adjudication** (choosing between empirically equivalent theories). The 'Graduation Objection' states that if philosophy succeeds via incubation, it leaves the field, proving present irrelevance.

  (a) Assign a concrete scientific case to one grade. Argue whether the grades are distinct or if one collapses into another. [10 marks]

  (b) The Graduation Objection implies that defending philosophy via historical success undermines its current relevance, while defending it via grade (i) concedes it produces no content. Assess this tension. Argue whether either defence survives. [20 marks]

  *Note: Unanalysed lists of historical cases cannot earn more than 5 marks.*

  ***

  **2. Model Answer**

  The dispute over philosophy's utility turns on whether its successes are retrospective or contemporary. To evaluate this, we must distinguish the Incubator Thesis, where philosophical frameworks harden into independent sciences (e.g., physics emerging from natural philosophy), from the Collaborator Thesis, where philosophy intervenes in ongoing scientific practice. Furthermore, contributions vary in kind: conceptual hygiene (i) clarifies existing terms; hypothesis generation (ii) proposes testable claims; and adjudication (iii) selects between theories that share empirical predictions.

  Consider the debate over quantum mechanics interpretations. Copenhagen, Many-Worlds, and Pilot-Wave theories are empirically equivalent; they predict identical observation outcomes. A philosopher arguing for Many-Worlds based on parsimony is not performing hygiene (i), as the terms are already defined, nor hypothesis generation (ii), as the theory exists. This is adjudication (iii). Are these grades distinct? One might argue (i) collapses into (ii), claiming that clarifying a concept inevitably suggests a testable hypothesis. However, in quantum foundations, clarity often reveals that no testable difference exists, halting hypothesis generation. Thus, (iii) is distinct: it operates where (ii) fails due to underdetermination. Hygiene prepares the ground, but adjudication decides the structure where data is silent.

  This distinction is crucial for addressing the Graduation Objection. The objection posits a zero-sum game: if philosophy is an incubator, its success entails its departure. When a philosophical problem becomes empirical, it becomes science. Therefore, citing historical successes (Incubator) proves only past utility, reinforcing the claim of present irrelevance. A student defending philosophy by listing Newton or Bohr as philosopher-scientists inadvertently confirms that philosophy is merely science-in-waiting. If the goal is incubation, the philosopher should want to be out of a job. This defence fails because it accepts the premise that relevance requires empirical autonomy, which philosophy by definition lacks once it succeeds.

  Conversely, the Collaborator often retreats to Grade (i), claiming philosophy merely clarifies concepts for scientists. This avoids the Graduation Objection because hygiene is always needed; language always drifts. However, this defence concedes that philosophy produces no content. If philosophy only cleans up after science, it is a service industry, not a partner in discovery. It admits it cannot tell scientists what is true, only what they mean. This plays into the physicist's complaint that philosophy is parasitic. If philosophy cannot adjudicate truth or generate hypotheses, its 'collaboration' is merely editorial. Thus, the two standard defences undercut one another: the historical defence proves irrelevance via success, while the clarificatory defence proves irrelevance via triviality.

  Does either survive? The historical defence must be abandoned; past incubation cannot justify current collaboration. The clarificatory defence must be upgraded. The only sustainable role is Grade (iii): adjudication between empirically equivalent rivals. Unlike Grade (ii), adjudication does not 'graduate' into science because empirical data cannot resolve it. Unlike Grade (i), it produces content: it recommends ontological commitments based on non-empirical virtues (e.g., locality, determinism). This avoids the Graduation Objection because the problem never leaves philosophy; it is structurally philosophical. It also avoids the triviality charge because it influences theory choice, not just terminology.

  Therefore, philosophy is useful not because it becomes science, nor because it cleans science's language, but because science inevitably produces underdetermined theories. The Graduation Objection holds against the Incubator and the Clarifier, but fails against the Adjudicator. Philosophy remains relevant precisely where science reaches its empirical limit. To argue otherwise is to assume all scientific questions are empirical, which the existence of empirically equivalent rivals disproves. The tension is resolved by recognizing that some scientific problems are permanently philosophical. Philosophy's utility lies in managing the permanent underdetermination of theory by data.

  ***

  **3. Marking Scheme**

  **Total: 30 Marks**

  1.  **Definitions (5 marks):** Correctly distinguishes Incubator (births disciplines) from Collaborator (aids mature fields) and defines Grades (i)-(iii) accurately.
  2.  **Case Application (5 marks):** Assigns a concrete case (e.g., quantum interpretations, spacetime substantivalism) to a specific grade correctly.
  3.  **Grade Distinctness (5 marks):** Argues whether grades collapse. Excellent answers argue (iii) is distinct because empirical equivalence blocks (ii).
  4.  **Graduation Objection Articulation (5 marks):** Explains why historical success implies current exit (Incubator) and why Grade (i) implies lack of content.
  5.  **Tension Analysis (5 marks):** Identifies that the two standard defences (History vs. Hygiene) are mutually undercutting. Good answers describe them; Excellent answers show why holding both is inconsistent.
  6.  **Resolution (5 marks):** Argues for Grade (iii) as the only stable position that avoids both traps. Concludes definitively.

  **A/B Boundary:**
  *   **A (First-Class, 24-30):** Explicitly identifies the mutual-undercutting tension in part (b). Recognizes that defending via history strengthens the objection, and defending via hygiene concedes triviality. Proposes Grade (iii) as the specific solution because underdetermination is permanent.
  *   **B (Upper Second, 18-23):** Correctly defines terms and applies a case. Addresses the Graduation Objection but treats the two defences (History and Hygiene) as compatible or fails to see why they undermine each other. May suggest Grade (ii) is viable without addressing why it graduates.
  *   **C (Lower Second, 15-17):** Defines terms but relies on unanalysed historical lists. Misses the Graduation Objection entirely or treats it as a simple complaint rather than a logical paradox.

  ***

  **4. Characteristic Errors**

  1.  **The Historical Catalogue:** The student lists Newton, Einstein, and Bohr as proof of philosophy's value.
      *   *Why persuasive:* It feels like empirical evidence of success.
      *   *Mark Loss:* forfeits Move 5 and 6 (10 marks); capped at 5 marks total per question warning.
  2.  **The Collapse Error:** The student argues Grade (i) automatically leads to Grade (ii), claiming clarity always yields testable hypotheses.
      *   *Why persuasive:* It makes philosophy look productive.
      *   *Mark Loss:* forfeits Move 3 (5 marks) for failing to recognize empirically equivalent rivals.
  3.  **The Compatible Defences:** The student argues philosophy should do both history and hygiene without noting the tension.
      *   *Why persuasive:* It seems inclusive and generous to the discipline.
      *   *Mark Loss:* forfeits Move 5 (5 marks) for missing the mutual-undercutting crux.
  4.  **The Empiricist Surrender:** The student agrees that if a problem isn't empirical, it isn't real, concluding philosophy is useless.
      *   *Why persuasive:* It aligns with the physicist's premise in the prompt.
      *   *Mark Loss:* forfeits Move 6 (5 marks) for failing to argue for adjudication as a valid non-empirical contribution.
