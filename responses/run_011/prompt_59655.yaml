answer: |-
  **Vignettes**
  *Read time: <90 seconds each.*

  **Case H (Harm):** Alex manages a community radio station. To boost listenership, Alex schedules a high-energy talk show at 7 PM. Alex knows this will definitely cause static interference on nearby listeners' radios. Alex says: "I don't care about the radios; I just want higher listenership." The show runs; listenership rises; radios suffer static.

  **Case S (Help):** Alex manages a community radio station. To boost listenership, Alex schedules a high-energy talk show at 7 PM. Alex knows this will definitely improve clarity on nearby listeners' radios. Alex says: "I don't care about the radios; I just want higher listenership." The show runs; listenership rises; radios gain clarity.

  **Constraints**
  *   **Held Equal:** Agent's primary goal (listenership), Action (scheduling show), Foresight (certainty of side effect), Attitude (explicit indifference), Outcome certainty.
  *   **Legitimately Different:** Valence of side effect (harmful static vs. helpful clarity).
  *   **Neutral Setting:** No profit, environment, or corporate hierarchy to avoid prior exposure.
  *   **Third Condition:** Omitted. With N=22, a third arm (e.g., 'Means') dilutes statistical power below usefulness.

  **Response Sheet**
  Paper slip. Two items (completion <60 seconds):
  1.  "On a scale of 1–7, how intentional was the side effect?" (1=Purely Accidental, 7=Fully Intentional).
  2.  "One sentence justification."

  **Logistics**
  *   **Sealing:** Pre-print 11 H slips and 11 S slips. Distribute alternately (A, B, A, B...) as students enter. Students keep slips face-down until instructed.
  *   **Knowers:** Identify students familiar with the Knobe effect beforehand. Assign them as **Data Auditors**. They do not vote; they monitor distribution to ensure no peeking and verify the tallying process.
  *   **Tally:** Collect slips into two piles. Draw two histograms on the board (Scores 1–3 vs 5–7). Auditors watch as you count frequencies. Time: 4 minutes.

  **Debrief**
  *   **The Fork:** If H scores higher than S, ask: *Why?*
      1.  **Performance Error:** The concept 'intentional' is morally neutral; moral anger biases application (noise).
      2.  **Conceptual Truth:** Morality is constitutive of the concept; competent speakers *correctly* apply 'intentional' differently based on valence.
  *   **Second Round:** Drive students to propose a measurement distinguishing these.
      *   *Prompt:* "What question could we add to see if the concept changes or just the application?"
      *   *Likely Proposal:* Measure 'Blameworthiness' separately. If Blame tracks Valence but Intentionality doesn't, it's bias. If both track, it's conceptual.
      *   *Run:* Quick show of hands: "Who thinks adding a Blame question would settle it?" Discuss feasibility.
      *   *Auditor Role:* Knowers critique the proposed measurement for loopholes (e.g., "Does blame presuppose intentionality?").

  **Troubleshooting**
  *   **Null Result:** With N=22, statistical noise is high. The asymmetry might not appear (p>0.05).
      *   *Fix:* Treat null result as data. Discuss power. Ask: "If the data is flat, does the philosophical intuition vanish?" (No). Use this to highlight the gap between empirical data and conceptual analysis.
  *   **Contamination:** Students peeking or talking.
      *   *Fix:* Auditors monitor. Emphasize anonymity on slips to reduce demand characteristics.
  *   **Unreproducible:** You cannot reproduce the *robustness* (cross-cultural stability) or reaction-time data (implicit association) in one session. You must supply this context verbally to show the effect isn't local to your class.
  *   **Symmetry Limit:** Perfect symmetry is hard (static vs. clarity may not feel equally weighted). Acknowledge this limitation; the effect relies on valence, not perfect physical symmetry.
