  - `overall_verdict`: string, 2-3 sentences, is this publishable as a handout or does it need surgery
  - `biggest_problem`: string, one sentence naming the single thing I most need to fix
  - `technical_confidence`: string, one of "high", "medium", "low" — how sure you are about your own claims on section 3 and the rationalizability stuff specifically
  - `comments`: array of objects, each with:
    - `quote`: the exact sentence or phrase from my draft the comment is about, copied verbatim so I can find it
    - `kind`: one of "error", "overstatement", "sloppy", "missing", "strong"
    - `severity`: integer 1 to 5, where 5 means the draft says something false or misleading to a student
    - `problem`: string, what's wrong and what's at stake, 1-3 sentences
    - `fix`: string, a concrete rewrite or an addition I can paste in

  Sort `comments` by severity descending. Use kind "strong" sparingly, only where a point is doing real work and I should not let an editor cut it. Don't pad the array with style nitpicks — I care about correctness and about whether the argument actually hangs together. Put the bullets first, then the JSON in a code block, and nothing after the code block.
