          *   Contrastive repair (died vs. lived, didn't water vs. did).
          *   Default/Normal conditions repair.
          *   Omissions aren't real causes (explanatory only).
      *   **Specific Questions:**
          *   What is an omission in a fault tree?
          *   Counterpart of profligacy objection?
