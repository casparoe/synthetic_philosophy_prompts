  # The Myth of Logical Omniscience

  If you have the light you have the whole room.
  Nothing stays open, nothing fails to close.
  What is built there must remain true.
  You do not need to take a single step.
  There is no shadow cast upon the wall.
  Because to see the parts is to know.

  We say we know the pieces in our hand.
  But the bulb flickers, fails to give enough light.
  Something stands between us and the wall.
  The door refuses to close.
  We hesitate before the next step.
  Waiting for a fact to become true.

  It was always true before you spoke.
  How can you learn what you already know?
  You lift your foot to make a step.
  But the destination burns with its own light.
  No evidence can make the circle close.
  You are pressing palms against a glass wall.

  Keep beliefs in separate rooms behind each wall.
  So contradiction never proves itself true.
  Let the file cabinet fail to close.
  The answer waits but you cannot know.
  Wait for the power to restore the light.
  Counting cost for every mental step.

  One motion leads to another till you lose the step.
  The maze grows higher than any garden wall.
  You run out of battery, lose the light.
  The sum is true but hidden from view.
  Too many paths to track them all and know.
  The logic holds but will not close.

  Let the discussion close.
  We pour the wine, a physical step.
  We do not need to know everything tonight.
  The kitchen has a corner, has a wall.
  It is enough that this moment feels true.
  We sit together in the warm light.

  We know the shape of shadows before the light.
  Each step we take helps make the circle close.
  What stays true leans heavy against the wall.

