prompt: |-
  so I'm TA-ing a first-year grad seminar on formal epistemology and next week is the last meeting — we're doing the whole session on the assumption that ideal agents are closed under logical consequence, i.e. Hintikka-style epistemic logic where if something's a theorem you know it and if you know p and know p implies q you know q, plus the Bayesian version of the same complaint where every logical truth sits at probability 1 from the start so no amount of evidence can ever move you into learning it. there are eight of us, we meet in someone's kitchen, and afterwards there's wine. I want to open the session by reading a poem out loud instead of summarising the readings, and I've decided the form should be a sestina, because the sestina is literally a machine that never lets anything new in — you get six end-words and then thirty-nine lines of permuting them, which seems to me exactly the picture of deduction that the doctrine assumes and that actual humans keep failing to live up to.

  Here's what I need. A full 39-line sestina, unrhymed, line length loose (aim for something readable aloud in one breath per line), with the standard rotation — 1-2-3-4-5-6, then 6-1-5-2-4-3, then 3-6-4-1-2-5, then 5-3-2-6-1-4, then 4-5-1-3-6-2, then 2-4-6-5-3-1, and a three-line envoi that gets all six words in, three of them at the line ends and three buried somewhere inside the lines (pick which, I can never remember the convention). You choose the six end-words, but at least one of them has to change its sense as it rotates — something that can mean both a relation between propositions and an ordinary thing you do with your hands, or a word for "know" that slides between closure and arrival. Content-wise it has to dramatize four things without naming any of them: the closure principle itself, from inside, as if it were obviously right; the human who has held all the premises for twenty years and never once seen what they add up to; the fact that a tautology can't be learned by conditionalizing on it, since it was already certain; and at least one of the standard repairs rendered as a picture rather than as jargon — a world where the walls contradict each other, a language that doesn't have the word yet, beliefs kept in separate drawers that never open at the same time, or just the sheer number of steps between here and there and the lights going out first. Hard rule: don't use the phrase "logical omniscience" anywhere except maybe the title, and don't name a single philosopher or paper or possible-worlds semantics as a term of art. Someone who's read the literature should find it right rather than decorative; someone who's never heard of the problem should just find it a good poem about not being able to see what you already know.

  after the poem, give me a JSON object so I can check my own reading against yours — schema: "title" (string); "end_words" (array of the six in first-appearance order); "stanza_orders" (array of six arrays of six integers 1-6, the end-word positions you actually used per stanza, so I can verify the rotation); "shift" (object: "word", "early_sense", "late_sense" — the end-word that changes meaning and the two meanings); "repair" (object: "strategy", one of "impossible worlds" | "awareness" | "fragmentation" | "resource bounds" | "other", and "image", one sentence on which picture in the poem carries it); "tautology" (object: "stanza" as an integer, "line" quoted from your own poem, and "what_it_gets_right" in one sentence); and "most_likely_to_make_an_expert_wince", one honest sentence. no need for a bibliography or anything, I'm not asking you to cite — I just want the poem and the JSON.
