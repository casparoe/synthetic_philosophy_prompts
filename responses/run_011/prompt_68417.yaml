  ### Sestina on the Axiom

  We begin with the data of **Choice**,  
  Stripping away the ghost of **Preference**,  
  To build a measure of **Utility**  
  That remains strictly **Consistent**,  
  Like a Laspeyres **Index**,  
  Tracking only what they **Want**.

  Tracking only what they **Want**,  
  Observed in the act of **Choice**,  
  A behavioral **Index**,  
  Not a hidden **Preference**,  
  To prove the system **Consistent**,  
  We banish cardinal **Utility**.

  We banish cardinal **Utility**,  
  But watch the cycle of their **Want**:  
  Is the agent **Consistent**?  
  Apple for Pear is the **Choice**;  
  Pear for Cherry shows **Preference**;  
  Cherry for Apple resets the **Index**.

  Cherry for Apple resets the **Index**.  
  Does this kill **Utility**?  
  Or just the **Preference**?  
  If they **Want** prediction,  
  We model the **Choice**  
  As-if **Consistent**.

  As-if **Consistent**,  
  The **Index** turns.  
  Data is the **Choice**.  
  A cardinal **Utility**  
  Is all they **Want**:  
  A latent **Preference**.

  A latent **Preference**  
  Remains **Consistent**  
  If we fix the **Want**,  
  Adjust the **Index**,  
  Resurrect **Utility**  
  From the **Choice**.

  **Envoi**

  We save the **Preference** by the **Index**,  
  Keep the model **Consistent** without **Utility**,  
  And call it science what they **Want** from **Choice**.

  ***

  ### Instructor's Note on the Text

  **Settled vs. Live Debates**
  The poem assumes the standard neoclassical reconstruction of consumer theory following Samuelson (1938) and Houthakker (1950). What is largely *settled* in the literature is the mathematical equivalence between the Strong Axiom of Revealed Preference (SARP) and the existence of a well-behaved utility function (the Utility Representation Theorem). If choices satisfy SARP, we can mathematically construct a utility function that rationalizes them; if they do not, we cannot. The poem's circular structure mirrors this equivalence: we start with choice, impose axioms, and end up with utility, which was the starting point of pre-Samuelson theory.

  However, what remains *live* is the ontological status of "preference."
  1.  **Constructivism:** Behavioral economists and psychologists (e.g., Lichtenstein & Slovic) argue preferences are often *constructed* during the elicitation process rather than revealed. The poem treats the transitivity violation (Stanza 3) as a theoretical threat (the money pump), but in live literature, such cycles are observed empirically without necessarily bankrupting the agent due to transaction costs or learning.
  2.  **The "As-If" Defense:** Stanza 4 leans on Friedman's instrumentalism. Defenders argue it does not matter if agents *have* preferences, only if they act *as if* they do. Critics (e.g., Hausman) argue this renders the theory unfalsifiable. The poem sides slightly with the critics in the envoi, suggesting the "science" is a label applied to the rearrangement.

  **Artistic License & Simplifications**
  *   **The Transitivity Event:** In Stanza 3, the cycle (Apple > Pear > Cherry > Apple) is presented as a direct observation. Technically, Revealed Preference requires budget constraints to be defined for each choice to establish "revealed" superiority. The poem compresses the budget sets into the "Index" to maintain the meter, implying the prices/income allowed for the direct comparison each time.
  *   **Utility:** The poem treats "Utility" as a single concept. In the literature, there is a sharp distinction between *ordinal* utility (which RP preserves) and *cardinal* utility (which RP claims to discard). Stanza 2 and 5 blur this to emphasize the circularity: even ordinal utility is a function the theory tries to avoid but ultimately reclaims.
  *   **"Want":** To satisfy the sestina form, "want" is used invariantly. In technical terms, "demand" is the precise counterpart to "choice," but "want" bridges the colloquial desire and the economic demand, reinforcing the poem's theme that the theory tries to separate behavior from psychology but struggles to keep them apart.
