  **Joint Statement on the Normative Status of Solomonoff Induction**

  **Preamble**
  This document outlines the current state of agreement and disagreement between the Universalist and Relativist camps regarding Solomonoff Induction (SI) as a solution to the problem of induction. Both camps accept the underlying mathematics of algorithmic information theory but diverge on its philosophical import. This statement is intended to structure future adversarial collaboration.

  **1. Agreed Claims**
  Both camps endorse the following propositions without reservation:

  1.  Solomonoff's convergence theorems are mathematically valid within their stated assumptions.
  2.  The universal prior dominates any computable probability measure up to a multiplicative constant.
  3.  Kolmogorov complexity ($K$) is uncomputable; only upper bounds are accessible via compression.
  4.  $K$ is invariant across universal Turing machines (UTMs) only up to an additive constant independent of the string.
  5.  Scientific inference operates exclusively at finite data sizes ($n$), never at the limit.
  6.  The additive constant depends on the choice of reference machine (UTM).
  7.  No inference method performs well across all logically possible data-generating processes (No-Free-Lunch).
  8.  Simpler theories have historically correlated with empirical success in mature sciences. [Note: Camp A interprets this as nomological necessity; Camp B as contingent regularity.]
  9.  Practical machine learning employs approximations of minimum description length.
  10. The invariance theorem does not specify which UTM must be used for physical inference.
  11. For any two UTMs, there exist strings where their complexity orderings diverge.
  12. Asymptotic convergence guarantees do not specify the rate of convergence for finite $n$.

  **2. Disagreements Table**

  | Issue | Camp A (Universalist) Formulation | Camp B (Relativist) Formulation | Classification |
  | :--- | :--- | :--- | :--- |
  | **Normative Force** | SI prescribes rational credences because it uniquely minimizes predictive error in the limit. | SI describes a consistency constraint but cannot prescribe priors without empirical input. | **Substantive** |
  | **Reference Machine** | Fixing a UTM is a conventional choice; any universal machine suffices for normative claims. | Fixing a UTM is a substantive empirical hypothesis about the world's compressibility. | **Substantive** |
  | **Finite vs. Limit** | Asymptotic dominance confers normative weight at finite $n$ absent defeaters. | Asymptotic guarantees are normatively idle when constants swamp data signals. | **Substantive** |
  | **Justification** | SI justifies Occam's Razor by deriving it from prediction optimality. | SI restates Occam's Razor by embedding simplicity assumptions in the prior. | **Verbal** |

  **Ruling on Justification:** We classify the "Justify vs. Restate" dispute as **Verbal**. Both camps agree that $P(h) \propto 2^{-K(h)}$ and that this favors simpler hypotheses. The dispute dissolves once it is acknowledged that "justification" here merely means "deductive derivation from a prior that already encodes simplicity." The substantive work lies in defending the prior, not the derivation.

  **3. Adjudication of Genuine Cruxes**
  For each substantive disagreement, we specify a test case or argument bearing on the issue, including predictions from both camps.

  **Crux 1: The Magnitude of the Constant (Finite vs. Limit)**
  *   **Test:** Expansion of the PhD candidate's toy study. Currently, bounded search on 200 binary strings (length ≤ 48) with a 20-symbol cutoff shows $K_U(x) - K_V(x)$ varying over ~17 symbols, with a 14% ranking flip rate between rival generators.
  *   **Required Data:** Unbounded search (or significantly higher cutoff) on strings of length 100–500 generated by known computable processes.
  *   **Camp A Prediction:** As search bounds relax, the variance in $K_U - K_V$ will stabilize, and the ranking flip rate will drop below 1%. The current 14% is an artifact of the 20-symbol cutoff truncating the "true" program length.
  *   **Camp B Prediction:** The variance will remain proportional to the machine-dependent constant. The flip rate will remain significant (>5%) for scientifically relevant $n$, proving the constant is not negligible where inference matters.

  **Crux 2: The Status of the Reference Machine**
  *   **Test:** Comparison of "natural" UTMs (e.g., standard architectures) vs. "gerrymandered" UTMs designed to favor specific physical laws.
  *   **Required Data:** Measurement of predictive success using priors derived from distinct UTMs on actual physical data sets (e.g., planetary motion spectra).
  *   **Camp A Prediction:** "Natural" UTMs will cluster in predictive performance; gerrymandered machines will be detectable via poor compression of unrelated data. The choice is conventional because the class of reasonable machines is tight.
  *   **Camp B Prediction:** Predictive performance will track the empirical fit of the machine's bias to the specific data set. There is no "reasonable" cluster independent of prior knowledge of the physics involved.

  **Crux 3: Normative Weight of Asymptotics**
  *   **Test:** A case where asymptotic optimality conflicts with finite-sample reliability.
  *   **Required Data:** A constructed environment where a non-universal prior outperforms the universal prior for all $n < 10^{10}$ but loses thereafter.
  *   **Camp A Prediction:** Rational agents should still prefer the universal prior. Normativity is determined by the limit behavior; finite underperformance is acceptable risk.
  *   **Camp B Prediction:** Rational agents should prefer the finite-performing prior. Normativity is determined by actual expected utility at achievable $n$; guarantees at $n = \infty$ are irrelevant.

  **4. Closing: Conditions for Revision**
  To move this collaboration forward, each camp specifies what evidence would compel them to revise their core position.

  **Camp A (Universalists):**
  We would abandon the claim that SI is the unique normative answer if demonstrated that **no computable approximation of the universal prior outperforms domain-specific priors** in realistic finite samples, even when given equal computational budget. Specifically, if the toy study's 14% flip rate persists or grows with deeper search on physically generated strings, we must concede that the constant is not negligible. [Note: Camp A reserves the right to argue that such strings are "pathological" and not representative of scientific data.]

  **Camp B (Relativists):**
  We would concede normative force to SI if provided with a **non-circular justification for selecting a specific reference machine**. Specifically, if Camp A can identify a UTM based solely on computational properties (without referencing empirical data about the world) that yields convergent rankings for all physically plausible hypotheses, we will accept the choice as conventional rather than empirical.

  **Signed,**
  *Representatives of Camp A & Camp B*
  *Drafted by PhD Candidate, Department of Philosophy*
