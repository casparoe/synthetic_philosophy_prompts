      *   Smuggling alert: Demanding the theory explain "how the illusion feels" is smuggling. Demanding it explain "why we think it feels" is legitimate.
      *   The "Cheat" factor: A cognitive scientist feels cheated if the theory explains the *concept* of consciousness but ignores the *data* of experience. But the illusionist says the data *is* the concept.
