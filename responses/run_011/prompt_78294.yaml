prompt: |-
  You're a philosopher of mind who's argued both sides of the consciousness debate and who's unusually good at spotting question-begging. I'm drafting a review piece on illusionism about phenominal consciousness, and right now my notes are just a pile of objections, half of which I suspect are worthless. Before I write a word of it, give me the spec: what would an illusionist theory actually have to deliver to count as adequate — where adequate means good enough that a cognitive scientist could accept it without feeling she's been cheated out of something.

  Go through the candidate requirements one at a time. For each, give the case or consideration behind it, then mark it as non-negotiable, as a preference of the realist camp, or as smuggling (only looks like a requirement because it presupposes the qualia the theory denies). At minimum get these in the mix: what's left over — what still seems phenomenal to a fully convinced illusionist when she stubs her toe, given that she's meant to have no reason to think anything is; the asymmetry between appearance and judgement that makes ordinary illusions work and that seems missing here; the demand that the theory explain why we talk and argue the way we do; and the self-undermining charge. Say plainly which subset of them you think can't be jointly satisfied, and which single one does most of the excluding.

  Brainstorm a bit out loud before the list, think carefully, and write it in British English. A table's fine for the marks.
