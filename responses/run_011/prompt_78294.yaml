answer: |-
  Right, let's clear the desk and think this through properly. You're asking for the adequacy conditions for illusionism—specifically, what it must achieve to satisfy a cognitive scientist who isn't looking for magic but isn't willing to accept a verbal trick either.

  The trouble, as you know, is that the term 'illusion' is doing far too much heavy lifting here. In ordinary parlance, an illusion is a mismatch between appearance and reality. I see a bent stick in water; the stick is straight. But when we talk about phenomenal consciousness, the 'appearance' is the very thing the realist claims is the reality. If I say 'it seems to me that I am in pain', the realist says 'that seeming *is* the pain'. So, for an illusionist to say 'the pain is an illusion', they have to say 'the seeming is a false seeming'. But a false seeming of what? If there's no qualia, there's no property being misrepresented.

  A cognitive scientist wants a mechanism. She wants to know how the brain processes information to produce the *report* of consciousness without the consciousness itself. But she also has a first-person life. She stubs her toe. If your theory tells her that her agony is 'just' a user-illusion, she needs to know what the 'just' amounts to. Does it vanish? No. So what persists?

  The danger here is question-begging on both sides. The realist begs the question by insisting that any explanation that leaves out the 'feel' leaves out the phenomenon. The illusionist begs the question by assuming that 'feel' is a coherent concept that can be discarded without remainder. An adequate spec must navigate between these Scylla and Charybdis. It must demand an explanation of the *commitments* we have to consciousness without demanding the *ontology* the theory denies.

  Let's break down the specific requirements. We need to distinguish between what is genuinely explanatory, what is a realist hang-up, and what is simply incoherent within the illusionist framework.

  ***

  ### The Spec: Adequacy Conditions for Illusionism

  Here are the candidate requirements for a theory of phenomenal illusion to count as adequate for a working cognitive scientist.

  | Requirement | The Case / Consideration | Classification |
  | :--- | :--- | :--- |
  | **1. The Residual Phenomenology (The Stubbed Toe)** | **Case:** When a convinced illusionist stubs her toe, she still reacts with aversion, distress, and verbal report. She does not shrug and walk away. The theory must account for what persists after the 'illusion' is intellectually rejected. It cannot be 'nothing'.<br>**Consideration:** If the theory claims the experience is *only* an illusion, it risks implying the behavioural and functional consequences vanish upon realisation. They don't. | **Non-negotiable** |
  | **2. The Appearance/Judgement Asymmetry** | **Case:** Ordinary illusions (e.g., Müller-Lyer) rely on a gap between appearance (lines look unequal) and judgement (lines are known to be equal). In consciousness, appearance and judgement typically coincide (it feels like pain, I judge it is pain). Illusionism requires them to come apart (it feels like qualia, but I judge there are none).<br>**Consideration:** The theory must explain how an appearance can persist despite a contradictory judgement without positing a separate 'inner eye' to view the appearance. | **Non-negotiable** |
  | **3. The Discourse Constraint** | **Case:** We talk about consciousness in specific, consistent ways ('red looks vivid', 'pain is sharp'). If these properties don't exist, the theory must explain why our language is not random.<br>**Consideration:** A theory that dismisses our reports as mere error without explaining the *structure* of that error fails to explain the data. The linguistic behaviour is a physical fact that needs a causal story. | **Non-negotiable** |
  | **4. The Mechanism of Misrepresentation** | **Case:** To call something an illusion is to claim the system represents the world (or itself) inaccurately. The theory must specify the vehicle of representation and the nature of the error.<br>**Consideration:** If the brain represents 'I am having a qualitative experience', and there are no qualitative experiences, what is the content of that representation? It cannot be a proposition about nothing. | **Non-negotiable** |
  | **5. The 'What-It's-Like' Retention** | **Case:** The theory must explain 'what it is like' to be the illusionist, even if it denies 'what-it's-like-ness' exists.<br>**Consideration:** This asks the theory to describe the phenomenal character while denying phenomenal character exists. | **Smuggling** |
  | **6. Epistemic Stability (Self-Undermining)** | **Case:** If my introspective faculties are systematically deceived about the nature of my own mind, why should I trust them to produce the true theory of illusionism?<br>**Consideration:** This challenges the reliability of the cognitive science producing the theory. However, it often assumes introspection must be *globally* unreliable rather than *locally* misinterpreted. | **Realist Preference** |
  | **7. The Qualia-Free Explanation of 'Seeming'** | **Case:** The theory must explain the concept of 'seeming' without recourse to a phenomenal seem-ing.<br>**Consideration:** If 'seeming' is cashed out in functional or dispositional terms, this is valid. If it implicitly relies on a felt quality to make sense of the illusion, it fails. | **Non-negotiable** |

  ***

  ### Analysis of the Requirements

  Let's look closer at the classifications, particularly where the trapdoors lie.

  **1. The Residual Phenomenology (Non-negotiable)**
  This is the 'stubbed toe' test. If illusionism implies that understanding the theory alleviates suffering, it is empirically false. A cognitive scientist will reject a theory that contradicts basic behavioural data. The illusionist must concede that the *functional* role of pain (aversion, distraction, learning) remains intact. The 'illusion' is not that the state exists, but that it has intrinsic, non-physical properties. If the theorist cannot account for the persistence of the reactive disposition, the theory is dead on arrival.

  **2. The Appearance/Judgement Asymmetry (Non-negotiable)**
  This is the technical heart of the problem. In the Müller-Lyer illusion, I have a visual state (lines look unequal) and a doxastic state (I believe they are equal). They conflict. In the phenomenal case, the illusionist claims I have a meta-cognitive state (I think I have qualia) caused by a first-order state (neural processing), but the meta-cognitive state misrepresents the first-order state.
  The requirement is non-negotiable because without this gap, there is no illusion, only error. But explaining *how* the gap is sustained without a homunculus viewing the 'appearance' is the hard work. If the 'appearance' is just another judgement, the illusion vanishes. If it's a 'feeling', qualia are smuggled back in.

  **3. The Discourse Constraint (Non-negotiable)**
  Cognitive science deals in observables. Speech acts are observables. If people consistently say 'I see red', there must be a causal chain explaining that utterance. Illusionism cannot simply say 'they are wrong'. It must say 'they are wrong in a systematic, law-governed way'. If the theory cannot predict the patterns of our confusion, it is not a scientific theory.

  **4. The Mechanism of Misrepresentation (Non-negotiable)**
  You cannot have a representation of a non-existent property unless you explain what the representation *is* composed of. If I represent a unicorn, I represent a horse-with-a-horn. If I represent qualia, what are the constituents? If the answer is 'nothing', then I am not representing anything, and I am not under an illusion; I am merely confused. The theory needs a positive account of the representational content.

  **5. The 'What-It's-Like' Retention (Smuggling)**
  Here is the question-begging. To ask the illusionist to explain 'what it is like' is to ask them to use the very concept they are dismantling. It is like asking an atheist to explain 'what it is like' to be visited by the Holy Spirit. The adequate request is 'explain why we *think* there is something it is like'. Demanding the former presupposes the existence of the phenomenon the theory denies.

  **6. Epistemic Stability (Realist Preference)**
  This is the 'self-undermining' charge. It is a powerful sceptical tool, but as a requirement for adequacy, it leans towards realism. It assumes that because introspection is wrong about *ontology* (qualia), it must be wrong about *function* (cognition). An illusionist can argue that introspection is reliable enough to detect states, just unreliable at characterising their intrinsic nature. A cognitive scientist can accept this local error without accepting global scepticism. Thus, demanding the theory solve global scepticism is a realist preference, not a baseline requirement for cognitive science.

  **7. The Qualia-Free Explanation of 'Seeming' (Non-negotiable)**
  This is the flip side of the smuggling charge. The illusionist *must* deliver a functionalist or dispositionalist account of 'seeming'. If they rely on an intuitive grasp of 'seeming' that secretly relies on qualia, they are cheating. They must define 'seeming' in terms of accessibility, reporting dispositions, or meta-cognitive monitoring.

  ***

  ### The Verdict: The Impossible Triangle

  You asked which subset of these cannot be jointly satisfied, and which single requirement does the most excluding work.

  **The Excluding Factor:**
  The single requirement that does the most work is **Requirement 2: The Appearance/Judgement Asymmetry**.

  **Why?**
  To satisfy the cognitive scientist (Requirement 1 & 3), the theory must acknowledge that the 'illusion' has robust causal powers (we scream when in pain, we write papers about qualia). To satisfy the definition of illusion (Requirement 4 & 7), there must be a distinction between how the state appears and how it is.

  However, in the phenomenal case, the 'appearance' *is* the causal power. The reason I pull my foot away is that it *hurts*. If the 'hurt' is an illusion, what is driving the behaviour?
  *   If the illusionist says 'the neural state drives the behaviour', then the 'phenomenal illusion' is epiphenomenal—it does no work. This risks making the illusion inexplicable (why have it?).
  *   If the illusionist says 'the illusion drives the behaviour', then the illusion has causal powers. If it has causal powers, it is part of the physical furniture of the world. If it is part of the physical furniture, in what sense is it 'nothing'?

  **The Joint Unsatisfiability:**
  You cannot jointly satisfy:
  1.  **The Residual Phenomenology** (The illusion has real behavioural effects).
  2.  **The Mechanism of Misrepresentation** (The illusion is a false representation of non-existent properties).
  3.  **The Qualia-Free Explanation of 'Seeming'** (The 'seeming' is purely functional/physical).

  If the 'seeming' is purely functional (3), and it causes behaviour (1), then the 'seeming' is a real physical state. If it is a real physical state, calling it a 'false representation of non-existent properties' (2) becomes semantically unstable. You are left with a real state (the functional seeming) that we *call* an illusion, but which is ontologically robust.

  The cognitive scientist will feel cheated if you tell her the 'seeming' is nothing. She will feel she is being sold magic if you tell her the 'seeming' is a real property that isn't physical. The illusionist tries to thread the needle by saying 'the seeming is a real functional state that *represents* itself as non-physical'. But the moment you ask 'what is the medium of that representation?', you are back at the Appearance/Judgement Asymmetry.

  **Conclusion for your Review:**
  An adequate illusionist theory must deliver a **positive account of the error**. It cannot simply deny the phenomenon; it must explain the *production* of the intuition. The deal-breaker is not the denial of qualia, but the failure to explain the *persistence* of the intuition without implicitly relying on the intuition itself. If the theory cannot explain why the illusion is *transparent* (why we can't see it is an illusion from the inside) without appealing to a mysterious 'inner light', it fails the spec. The cognitive scientist needs to know how the magic trick is done, not just be told there is no rabbit.
