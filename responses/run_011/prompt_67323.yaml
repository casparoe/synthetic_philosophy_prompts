answer: |-
  The spreadsheet cell B4 held the Conversion Factor. Elias typed 41,500,000. He hit enter. The status bar shifted from red to green.

  He didn't derive the number. Nobody did. Three years ago, the Committee had convened after the midterms. The litigation budget was down twelve percent. The public mood was brittle; news cycles were short. The Director had said, "We need to reduce administrative overhead. Dispersal requires eighty million notifications. Concentration requires one file."

  So Elias had adjusted the Factor downward. It made Concentration cheaper to authorize. You needed fewer specks to equal one catastrophic event. It was a matter of logistics, of flow. He had signed the memo because the numbers balanced. The system remained solvent. The lights stayed on.

  Now, the system had selected a shape for the Midwest Nitrate Plume.

  ***

  Arthur was making toast. It was 7:14 AM on a Tuesday. In the Bureau's central ledger, a timestamp synced with his social security number. A single unit of harm was assigned to him, scheduled for this minute.

  The protocol demanded imperceptibility. A speck was defined as a deviation within normal noise. Arthur buttered the toast. He burned his tongue slightly, not from the assignment, but from the heat. He cursed, shook his hand, and blew on the bread. He took a bite. He thought about the meeting at ten. He thought about his daughter's soccer practice.

  He walked out the door. He did not stumble. He did not feel a pang. He did not lose a second of income. If a doctor scanned him, there would be no mark. The harm existed only as a decrement in a database, a theoretical load bearing down on a structure that did not bend.

  He got into his car. He was safe. He was also paying. He drove away, whole and untouched, carrying a debt he would never know he owed.

  ***

  Elias sat in the calibration room. The alert pinged. *Assignment Finalized.*

  He opened the Concentration File. Usually, he didn't look. The names were random draws from the affected zip codes. Statistical noise. But the interface highlighted conflicts of interest. His home address flashed amber.

  *Subject: Vane, David.*

  Elias stopped breathing for a count of four. David. His brother.

  He pulled the audit trail. The selection algorithm had run on the new Factor. 41.5 million. If the Factor had remained at 60 million, the cost of Concentration would have been too high relative to the Plume's volume. The system would have default-selected Dispersal. David would have received a speck. He would be making toast right now, burning his tongue on heat, not radiation.

  Elias remembered the Committee meeting. The Director rubbing his temples. "We can't sustain the notification infrastructure," she had said. "People don't feel the specks. Why spend the money?"

  Elias had nodded. He had argued for efficiency. He had said, "If no one notices, the friction is zero."

  He drove to the St. Jude Containment Ward. He didn't call ahead. He walked through the security checkpoint, flashing his Bureau badge. The guards stepped aside. They knew the Calibration staff. They knew who decided who burned so others wouldn't have to itch.

  David was in Room 304. The door was thick leaded glass. Inside, the air scrubbers hummed. David lay on the bed. He was not dead. The Concentration protocol didn't kill instantly; that would be waste. It consolidated the damage into a single biological timeline.

  David's skin was gray. His hands were wrapped in gauze. He was hooked to a dialysis machine that filtered the toxins the Plume would have spread across eight decades of eighty million lives. Here, it was all happening now. In one body. Over six months.

  Elias pressed his hand to the glass. David turned his head. The movement was slow, heavy. He recognized Elias. He didn't wave. He just looked. There was no accusation in his eyes. There was only exhaustion. He was doing the work of a city.

  A nurse came up behind Elias. She held a clipboard.

  "Visiting hours are over," she said.

  "He's my brother."

  "I know," she said. She didn't look at him. She looked at the chart. "The dosage is consistent with the Factor. There were no errors."

  "The Factor changed," Elias said.

  "It changed three years ago," she said. "We adjusted staffing based on it. We ordered the meds based on it. You can't change the math because the variable is family."

  "If the number was higher, this would be dispersed."

  "If the number was higher, the budget would have broken in Q4," she said. "Then the water filters stop working for everyone. Then you have more than one brother in here. You have thousands."

  She tapped the glass with her pen. A sharp click.

  "Look at him," she said. "Then look at the street."

  Elias looked out the window. Below, the city sprawled. Cars moved along the avenues. People walked dogs. They carried groceries. They were intact. They were walking around with invisible deductions taken from their health, scheduled randomly over the next ten years. They would never know. They would never gather. They would never protest.

  David coughed. It was a wet, heavy sound that vibrated through the glass.

  Elias looked back at the bed. David had closed his eyes. The IV drip continued. *Drop. Drop. Drop.* It was rhythmic. It was scheduled. Just like the specks.

  Elias reached into his pocket. He pulled out his phone. He opened the Bureau app. He had admin access. He could flag the file. He could request a review. It wouldn't change the Factor. It wouldn't change the budget. But it might pause the treatment. It might trigger an audit.

  If he paused the treatment, the Plume had to go somewhere. The system required equilibrium. If David wasn't the sink, the water had to flow elsewhere.

  He looked at the IV bag. It was half empty. The fluid was clear.

  He looked at the street again. A woman was pushing a stroller. She was smiling at something on her phone. She would receive her speck in three years, on a Thursday. She would feel nothing.

  Elias put the phone back in his pocket. He turned away from the glass. He walked down the hall to the elevator. He pressed the button for the lobby. The numbers above the door counted down. 3. 2. 1.

  The doors opened. He stepped inside and pressed the button for the basement parking.

  ***

  **Debrief**

  The philosophical work is done entirely by the *imperceptibility* of the dispersed harm. Because the specks cannot be felt, the dispersed option lacks visceral weight, allowing the bureaucracy to treat it as abstract data rather than human suffering. If the specks were faintly noticeable—say, a daily migraine for everyone—the dispersed option would immediately feel like a mass assault, collapsing the utilitarian calculus into a scene of universal wincing. The reader would likely verdict against the Dispersal Office instantly, as the aggregate pain becomes sensory rather than theoretical. By keeping the harm invisible, the story forces the reader to sit with the cold logic of the ledger rather than the heat of shared injury. The dilemma survives only because the many are silent, not because they are safe.
