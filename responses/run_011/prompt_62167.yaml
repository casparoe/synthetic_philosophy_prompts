  A plumbing franchise requires applicants to purchase a $3,000 specialized tool kit before training begins. High-quality plumbers find jobs easily elsewhere, so risking $3,000 is a minor inconvenience. Low-quality plumbers have no other options, so losing $3,000 is catastrophic, even though both types have exactly $3,000 in savings available to spend.

  Story One (Handicap) focuses on relative pain. Because the cost represents life savings for the low-quality applicant but spare cash for the high-quality one, only the high-quality type pays. The signal stays honest because the cost hurts the faker too much relative to their worth. Story Two (Budget) focuses on absolute affordability. Since both applicants possess the $3,000, the financial barrier is cleared. If the only requirement is having the cash, the low-quality type buys the kit to fake eligibility, and the signal collapses because they can afford the entry fee.

  The working feature is the difference between having cash and valuing cash. Both have the money, but value it differently. If you switch this off by making the cost $100 (painless for both), Story One fails and everyone signals. If you make the cost $10,000 (unaffordable for both), Story Two fails and nobody signals.

  Honest limitation: I assumed low-types ignore the risk of failing training after buying the kit. A defender of Story Two would argue rational low-types know they'll fail anyway, so they won't spend the savings regardless of budget, making the budget constraint irrelevant compared to expected return.
