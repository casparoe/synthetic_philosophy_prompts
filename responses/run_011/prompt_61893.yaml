      *   **Constraints:** British English, no bibliography/citations needed (describe arguments/results), focus on substantive accuracy and implications for the thesis.

  2.  **Analyze the Source Passage (Claim-by-Claim):**

      *   *Claim 1:* "Bayes tells you what to do when experience makes you certain: become sure of E, and let your new degrees of belief be your old conditional degrees of belief given E."
