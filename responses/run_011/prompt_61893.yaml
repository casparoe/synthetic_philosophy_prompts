      *   *Claim 8:* "...the shift from old to new probabilities need not be justified by any proposition you have come to know — you may simply find your probabilities changing."
          *   *Assessment:* Accurate description of Radical Probabilism.
      *   *Claim 9:* "The problem of old evidence is that a theory cannot be confirmed by evidence you were already certain of; but if belief can move without anyone becoming certain of anything, a Bayesian can allow a hypothesis to gain support from evidence it already had."
