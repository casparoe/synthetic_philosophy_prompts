          *   *Assessment:* This is the formula for JC. Correct.
      *   *Claim 5:* "There is one further condition, which Jeffrey called rigidity: your old conditional probabilities given E, and given not-E, must be the same as your new ones."
          *   *Assessment:* Correct definition of Rigidity (invariance of conditional probabilities).
      *   *Claim 6:* "Rigidity is not derivable from the probability calculus or from anything else; Jeffrey conceded that it is a convenient assumption, and that leaves the rule looking less like a demand of rationality than like one modelling option among others."
