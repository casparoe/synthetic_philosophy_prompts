      *   *Check:* Is Rigidity truly "groundless"? It's an axiom of the update rule. Calling it a "modelling option" is okay, but implying it needs no defence in an applied science thesis is risky. If detection ambiguity correlates with environmental factors, Rigidity is violated.
      *   *Check:* Old Evidence. Garber's solution is the standard Bayesian fix, not JC. JC helps if the evidence wasn't certain, but "old" usually implies "already incorporated." The passage conflates "uncertain" with "old."
