answer: |-
  **The Mapping**

  Prioritarianism holds that the moral value of a benefit to an individual diminishes as the individual's absolute level of well-being increases. The currency of advantage is typically welfarist, defined as lifetime well-being or access to primary goods converted into welfare. The view employs a weighting function that is strictly increasing and concave: gains to those at lower absolute levels count for more than identical gains to those at higher levels. Crucially, the baseline is absolute, not relative; prioritarianism cares about how badly off people are in themselves, not how they compare to others.

  Applied to Jackson, the prioritarian calculation begins with the pre-closure baseline. Black residents occupied a lower absolute level of well-being than white residents, compounded by the segregation regime which limited their access to public amenities. The closure of the single Black pool represents a significant decrement in well-being for a group already at the bottom. The closure of the four white pools represents a decrement for a group at a higher absolute baseline. Because the weighting function is concave, the moral loss suffered by Black residents weighs heavier than the aggregate loss suffered by white residents, even if the raw utility loss were identical. The view implies the closure is morally regrettable primarily because it harms the worse-off. The weighting function does decisive work here: it forbids trading the vital interests of the bottom for the trivial interests of the top, but it also registers the loss to the top as morally relevant, just less urgent. For the city as a whole, the move is a net moral loss because the weighted sum of well-being has decreased, driven disproportionately by the harm to the most vulnerable.

  **Is This Leveling Down at All?**

  Parfit's leveling-down objection targets telic egalitarianism, which values equality for its own sake. Under that view, a world where everyone is equally worse off is in one respect better than a world where some are better off and others worse off, simply because inequality is reduced. Jackson presents a superficial resemblance: the city achieved equality of access by ensuring no one had access. However, this is not pure leveling down in the Parfitian sense. Pure leveling down requires that the change makes no one better off and some worse off, solely to reduce inequality. In Jackson, the closure was not motivated by a desire for equality, but by a refusal to integrate.

  Structurally, the outcome is equal deprivation, but the opportunity costs were asymmetric. Black residents likely had fewer private alternatives than white residents, meaning the absolute well-being loss was greater for them. A pure leveling-down construction would require a counterfactual where the pools provided no net well-being to anyone, or where the closure benefited no one while harming everyone equally. Jackson fails this counterfactual. The closure harmed everyone, but it harmed the worse-off more. Therefore, the objection does not strictly apply because the scenario is not one of neutral equality; it is one of compounded deprivation. The structure resembles leveling down only if one ignores the absolute baseline differences. If we assume white residents had private clubs and Black residents did not, the closure levels down the white residents to the level of the Black residents regarding public pools, but regarding total recreational access, it merely deepens the absolute pit for the Black residents without achieving true equality of outcome.

  **Test the Claimed Immunity**

  Prioritarians claim immunity from the leveling-down objection because they do not value equality intrinsically. They condemn Jackson not because inequality was reduced, but because the worse-off were harmed. However, this immunity risks purchasing coherence at the cost of silence regarding the *choice* to close. Prioritarianism is an outcome-oriented theory; it evaluates states of affairs. It condemns the closure because the resulting state of affairs is worse for the worse-off. But if the city had closed the pools and redistributed the savings as cash transfers to Black residents, prioritarianism might endorse the closure. The Court, conversely, focused on the affirmative duty to operate and the expressive harm of abandonment.

  Does prioritarianism have nothing to say about the choice itself? Strictly speaking, it evaluates the distribution of well-being resulting from the choice. If the closure results in a weighted loss, it is condemned. It does not need to import non-distributive considerations like waste or expressive harm to condemn the outcome here, because the outcome is distributively bad. However, if the outcome were distributively neutral—for instance, if the closure saved money that was irrelevant to well-being—prioritarianism would be silent on the racial animus driving the decision. It cannot register the wrong of racist motivation unless that motivation causally impacts well-being levels. This is a defect if one believes justice concerns civic standing and intent, not just welfare distribution. But if the stake in Jackson was truly the material loss of the pool, prioritarianism diagnoses it correctly: the wrong was the deprivation of the vulnerable, not the symmetry of the deprivation. The immunity is substantive, not merely semantic, because it grounds the condemnation in absolute harm rather than relative status.

  **The Griffin Contrast**

  The Court distinguished *Palmer* from *Griffin* based on state support for private segregationist academies in Virginia, which maintained inequality despite public closure. Prioritarianism tracks this distinction but for different reasons. In *Griffin*, the worse-off (Black children) received zero education while the better-off (white children) received private education subsidized by public credits. The absolute level of the worst-off collapsed while the best-off remained stable. Prioritarianism condemns this vehemently. In *Palmer*, both groups lost public access. Prioritarianism still condemns *Palmer*, but less severely than *Griffin*, because the gap did not widen via state subsidy; rather, the floor dropped for everyone.

  Consider a symmetric version of Prince Edward County: every child out of school, no private academies, no grants. Prioritarianism views this as a catastrophic loss of well-being for the worse-off, weighted heavily. It looks distributively similar to *Palmer*. The theory cannot register *why* the closure was chosen, or *by whom*. It sees only the resulting vector of well-being. Is this an objection? For a theory of distributive justice, perhaps not; the distribution of education is the primary concern. But for a constitutional theory of equal protection, agency matters. The state actively subsidizing inequality (*Griffin*) is a different moral injury than the state passively withdrawing services (*Palmer*), even if the final well-being levels of the Black citizens are identical in both scenarios. Prioritarianism collapses this distinction. It treats the state as a welfare maximizer constrained by priority weights, not as a civic actor bound by duties of non-discrimination. This suggests prioritarianism is a metric for evaluating outcomes, not a complete guide for evaluating state conduct or legislative intent.

  **Verdict in Both Directions**

  This pair of cases confirms prioritarianism's robustness in handling absolute deprivation while exposing its blindness to expressive and agency-based wrongs. The theory successfully avoids the leveling-down objection because it condemns Jackson on the grounds of absolute loss to the vulnerable, not the reduction of inequality. It validates the intuition that closing the pools was wrong without committing to the claim that equality was sacrificed. However, the analysis reveals an anomaly in the symmetric Prince Edward counterfactual. If the outcome is identical for the worst-off, prioritarianism cannot distinguish between a state that abandons everyone due to budget constraints and a state that abandons everyone to avoid integration. The moral urgency might differ, but the distributive math remains the same.

  The theory is silent on the duty to operate. The Court argued there is no affirmative duty to provide pools; prioritarianism implies there is a strong moral reason to provide them if the loss to the worse-off is severe enough. This tension highlights where the facts underdetermine the analysis: we lack precise data on the private alternatives available to white residents. If white residents had perfect private substitutes, their well-being loss was negligible, making the prioritarian condemnation of the closure even sharper. If they had no substitutes, the loss was shared, but still weighted against the bottom. Ultimately, the cases fall into a category the theory anticipated: large absolute losses for the worse-off. But the theory fails to capture the specific injustice of racial withdrawal, reducing a civic betrayal to a welfare deficit. This is not necessarily a failure of prioritarianism as a distributive theory, but it is a limitation for a monograph on justice that must account for the expressive power of state action.
