answer: |-
  The pub was quieting down, but the napkin between Nadia and Elias was covered in scribbled kets and trajectories. They had abandoned the abstract metaphysics for the concrete setup on the table: a spin-1/2 particle, prepared in $\sqrt{2/3}|\uparrow\rangle_z + \sqrt{1/3}|\downarrow\rangle_z$, entering a Stern-Gerlach magnet, hitting a screen, triggering a macroscopic amplifier, and paying out a bet to an observer if the flash was "up".

  "Let's lock the ontology first," Elias said, tapping the napkin. "In my book, there is one particle. It has a definite position at all times. The wavefunction $\psi$ is a real field in configuration space that guides it. When the wave packet splits in the magnet, the particle goes either up or down. Let's say it goes up. The down-branch of the wave is still there—it's an 'empty wave'—but the particle isn't in it. The flash happens because the particle hits the screen. There is no collapse. The outcome is definite because the configuration is definite."

  Nadia stirred her drink. "And in mine, there is no particle separate from the wave. The universal wavefunction evolves unitarily. The interaction entangles the spin with the spatial degree of freedom, then with the screen, then with the environment. Decoherence suppresses the interference terms between the 'up' macro-state and the 'down' macro-state almost instantly. You have two branches of the wavefunction, both equally real. There is no 'empty' wave; there are just two components of the universal state that no longer interfere. The observer is entangled too. There's a version of me seeing 'up' and a version seeing 'down'."

  "So," Elias leaned in, "here's where the bill comes due. The bet. The amplitude for 'up' is $\sqrt{2/3}$. The amplitude for 'down' is $\sqrt{1/3}$. In my theory, if I run this experiment many times with particles prepared identically, I need the initial positions of the particles to be distributed according to $|\psi|^2$. If they are, 2/3 of them end up in the upper channel. That's the Quantum Equilibrium Hypothesis. But you... you have two branches. One Nadia sees up, one sees down. Why does the 'up' Nadia deserve twice the weight of the 'down' Nadia? If reality splits, why shouldn't I count branches? If you count branches, it's 50/50. To get 2/3, you have to smuggle the Born rule in."

  Nadia sighed. "This is the incoherence problem, and you know the branch-counting objection fails. Branches aren't discrete countable objects like coins. They're structures emerging from decoherence. The 'number' of branches isn't well-defined; it depends on the coarse-graining. What is well-defined is the norm squared of the branch amplitude. Decoherence preserves the $L^2$ norm. When I make a decision, I'm not betting on which world *will* exist—they both will. I'm betting on which branch *I* will find myself in. The decision-theoretic derivations, like Deutsch-Wallace, show that a rational agent who accepts unitary QM must act as if they maximize expected utility weighted by the Born rule. If they don't, they're vulnerable to Dutch books across branches."

  "Vulnerable to Dutch books?" Elias shook his head. "That assumes the agent cares about branches in proportion to their amplitude. But why? That's exactly what needs deriving. You're saying 'rationality requires you to care about the squared amplitude,' but that's just restating the Born rule as a norm of rationality. It's circular. In Bohmian mechanics, probability is ignorance. I don't know the exact initial position of the particle. If the universe is in quantum equilibrium, the probability is $|\psi|^2$. It's epistemic, like statistical mechanics. You don't have ignorance about the outcome; you have duplication. How do you get uncertainty from certainty?"

  "I have self-locating uncertainty," Nadia countered. "Before the measurement, I don't know which branch I'll be on. But let's turn this around. Your 'ignorance' relies on the Quantum Equilibrium Hypothesis. Why must the initial configuration of the universe be distributed as $|\psi|^2$? If you start with a different distribution $\rho \neq |\psi|^2$, you get different statistics. You violate the Born rule. So you have to postulate equilibrium. Isn't 'typicality' just the Born rule wearing a disguise? You say the initial configuration is 'typical' with respect to the measure $|\psi|^2$. But why that measure? If you chose a different measure, you'd get different physics. You haven't explained the probability; you've just assumed the measure that gives the right answer."

  Elias smiled thinly. "Fair strike. But we have dynamics. Valentini's subquantum H-theorem shows that even if you start out of equilibrium, $\rho \rightarrow |\psi|^2$ over time, analogous to thermal relaxation. It's an attractor. It's not just a postulate; it's a dynamical consequence of the guidance equation. You don't have relaxation in Everett. You have static branches. Your 'measure' is just a number attached to a ghost. My measure is a density of actual stuff—particles. If I find a region of configuration space where $\rho = 0$ but $|\psi|^2 \neq 0$, nothing happens there. In your view, there's still amplitude there, still 'worlds', but you tell me I should ignore them because the norm is small. That's not derivation; that's pruning."

  "But your relaxation requires a background measure to define 'typicality' in the first place," Nadia pressed. "To say a system relaxes to equilibrium, you need to define what equilibrium *is*. You define it as $|\psi|^2$. So you're using the Born rule to prove the Born rule emerges dynamically. And empirically, you're stuck. As long as we are in equilibrium, Bohmian mechanics is empirically equivalent to standard QM. You've added hidden variables—particles—that we can never track without disturbing the wavefunction. It's surplus structure. Occam's razor should shave you off."

  "Occam's razor cuts both ways," Elias shot back. "You multiply worlds exponentially. I multiply variables linearly. But here's the uncomfortable bit for you: Your theory cannot account for why *this* particular outcome occurred to *me* right now. You say both occurred. But I experience one. You have to explain away the single outcome as an illusion of perspective. I explain it as fact. And regarding the measure: yes, we assume equilibrium. But if we didn't, we'd see violations of the Born rule. We don't. So we are in equilibrium. The question is, could we ever *not* be?"

  Nadia paused. This was the opening. "Exactly. That's the crux. If Bohmian mechanics allows for non-equilibrium distributions $\rho \neq |\psi|^2$, then it makes different predictions than unitary QM. In non-equilibrium, you could signal instantaneously via entangled particles. You could violate the uncertainty principle. You could distinguish non-orthogonal states. Unitary QM says that's impossible. Bohm says it's impossible *only because* we happen to be in equilibrium."

  "Agreed," Elias said, putting his pen down. "That is the sharpest distinction. If quantum non-equilibrium exists anywhere—maybe in relic particles from the early universe before relaxation completed—then my theory predicts deviations from the Born rule. Yours forbids them absolutely. If we found a particle that violated the Born rule, Everett is dead. Bohm survives."

  "But," Nadia leaned forward, "that's a huge 'if'. You're betting on a regime nobody has ever prepared. All our experiments confirm equilibrium. To access non-equilibrium, you need to control hidden variables we can't see. It's like saying thermodynamics is wrong because maybe there's a pocket of gas somewhere that hasn't thermalized since the Big Bang. It's speculative metaphysics. In practice, your theory reduces to mine plus invisible trajectories. You're positing a distinction without a difference for all practical purposes."

  "Not metaphysics," Elias corrected. "Cosmology. If the universe started in a low-entropy state, why not a non-equilibrium quantum state? Relaxation takes time. If there are relics—dark matter candidates, maybe—they might retain non-equilibrium signatures. We can look for them. You can't look for 'branch counts'. Your theory is empirically rigid. Mine is empirically flexible but currently constrained. The question isn't whether the math works; it's whether the universe allowed enough time for relaxation everywhere. That's a physical question, not a philosophical one."

  "And if we look everywhere and find only equilibrium?" Nadia asked.

  "Then we're stuck with empirical equivalence," Elias admitted. "But I still have the definite outcome. You still have the probability problem."

  "And I still have the surplus structure problem," Nadia replied. "But at least we agree on the test. Non-equilibrium Bohmian mechanics vs. Unitary QM."

  "Deal," Elias said, signaling for the check. "But I'm betting on the relics."

  "Don't," Nadia smiled. "The odds aren't in your favor. Or rather, they're exactly squared."
