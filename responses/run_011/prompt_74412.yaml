answer: |-
  You are not mischaracterizing the practice, and you are not confusing a tool with a metaphysics. Your roommate is offering a standard defense ("it's just a metric"), but that defense collapses the moment the metric is used to justify a policy decision that overrides rights, distribution, or non-market values. When an agency says "Benefits > Costs, therefore we regulate," they are making a welfare claim. When they say "Costs > Benefits, therefore we do not," they are making a welfare claim. You cannot do that without metaphysical baggage.

  The tension you feel between the "ordinal/revealed preference" foundations of modern micro and the "cardinal/aggregated" practice of Cost-Benefit Analysis (CBA) is the central unresolved fracture in welfare economics. It is not a bug; it is a feature that gets swept under the rug in MPP core sequences.

  Here is the reconstruction of the machinery, the distinctions you asked for, and the specific places where the "technical consensus" is actually a normative choice.

  ### 1. The Necessary Assumptions (The Engine)

  For Regulatory Impact Analysis (RIA) to function as a welfare guide (rather than just an accounting exercise), it must assume the following. I have separated these into what is *logically necessary* for the arithmetic to claim welfare improvement versus what is merely *convenient*.

  **A. The Numeraire Assumption (Necessary)**
  To sum willingness-to-pay (WTP) across individuals, the analysis must assume that a dollar represents the same amount of welfare for Person A as it does for Person B.
  *   **The Technical Term:** Constant Marginal Utility of Income (MUI).
  *   **The Reality:** We know this is false. A dollar provides more utility to a poor person than a rich person.
  *   **The Necessity:** If you do not assume MUI is roughly equal (or ignore the difference), you cannot sum dollars to get "total welfare." You are just summing purchasing power. If you sum purchasing power and call it "social welfare," you have implicitly weighted the preferences of the rich more heavily than the poor. This is not a technical necessity; it is a distributive choice disguised as a neutral aggregation.

  **B. Commensurability (Necessary)**
  The analysis assumes that all goods (life, biodiversity, clean water, profit) are substitutable at the margin against a common metric (money).
  *   **The Necessity:** If there are "lexical" preferences (e.g., "I will not trade *any* amount of money for a risk of this specific cancer"), WTP breaks down. CBA assumes there is always a price. If a good is incommensurable, the arithmetic cannot run.

  **C. Preference Sovereignty (Necessary for Welfare Interpretation)**
  The analysis assumes that satisfying existing preferences is the sole definition of welfare.
  *   **The Necessity:** If welfare is actually about "objective functioning" (Sen) or "virtue" (Aristotle), then satisfying a WTP derived from ignorance or adaptive preference is not a benefit. CBA *must* assume preferences are the sovereign metric to claim it is measuring welfare.

  **D. Hypothetical Revealed Preference (Contingent but Heavily Relied Upon)**
  You noted the tension between market choices and survey answers.
  *   **The Status:** Economists know "Contingent Valuation" (surveys) is noisy and subject to hypothetical bias.
  *   **The Necessity:** It is *not* logically necessary to use surveys. However, for non-market goods (existence value of a species), it is the *only* tool available. The system assumes that what people *say* they would pay in a survey is isomorphic to what they *would* pay if a market existed. This is a massive leap, but the machinery requires it to generate a number for the spreadsheet.

  ### 2. The Foreclosed Rival Views

  You asked which views are quietly foreclosed. The answer is: almost all of them that aren't Utilitarianism.

  **A. Distributional Justice (Rawls, Prioritarianism)**
  *   **The Foreclosure:** Standard CBA uses "unweighted" dollars. It forecloses the view that a benefit to the worst-off matters more than a benefit to the best-off.
  *   **The Live Fight:** This is not settled. The Office of Management and Budget (OMB) Circular A-4 (the bible of US regulatory analysis) currently advises agencies to present distributional effects separately but *not* to weight them in the bottom line. However, there is an active, heated debate within the Society for Benefit-Cost Analysis about introducing "distributional weights." The fact that this is a debate proves your point: the current "unweighted" practice is a choice, not a law of physics.

  **B. Adaptive Preferences (Elster, Nussbaum)**
  *   **The Foreclosure:** If workers accept higher wages for risky jobs because they lack alternatives, their WTP to avoid risk is depressed by their deprivation. CBA treats this depressed WTP as their "true" valuation. It forecloses the idea that preferences can be deformed by unjust background conditions.
  *   **The Consequence:** This systematically undervalues protections for the poor, whose WTP is constrained by income, and whose risk exposure is often highest.

  **C. Objective Welfare / Capabilities (Sen)**
  *   **The Foreclosure:** If welfare is about what people can *do and be* (capabilities), rather than what they want, CBA is blind. A person might not WTP for a vaccine due to misinformation. CBA counts the non-purchase as a preference satisfied. Capabilities theory would count it as a welfare failure. CBA cannot register this distinction without external adjustment.

  **D. Deontological Constraints / Rights (Nozick, Kant)**
  *   **The Foreclosure:** CBA is purely consequentialist. It forecloses the idea that certain actions are forbidden regardless of the net benefit. If a rule violates a right but produces a net surplus, CBA recommends it. If a rule protects a right but costs a net surplus, CBA flags it as "inefficient." The "efficiency" label exerts normative pressure that rights-based reasoning cannot easily withstand in a bureaucratic setting.

  ### 3. The "Ordinal vs. Cardinal" Tension

  You are right to be nagged by this. Here is the specific history you are bumping into:

  In the 1930s, Hicks and Allen moved economics to **Ordinal Utility** to escape the psychological baggage of Benthamite "utils." They said: "We don't know how happy you are, we just know you chose A over B." This made economics "scientific."

  But Ordinal Utility kills Policy Analysis. You cannot add rankings. (I prefer A>B, you prefer B>A. What does society prefer? Mathematically undefined).

  To get policy analysis back, economists introduced the **Kaldor-Hicks Compensation Principle** in 1939. It says: "A change is an improvement if the winners *could* compensate the losers and still be better off."
  *   **The Trick:** Notice the word *could*. Compensation does not actually have to happen.
  *   **The Metaphysics:** To make this work, they had to sneak Cardinal Utility back in through the back door using Money as the proxy for Utils.
  *   **The Verdict:** Your intuition is correct. The practice *requires* cardinal, interpersonal comparability to function as a decision rule, even though the textbook theory denies such things exist. The "lab coat" is worn to hide the fact that Kaldor-Hicks is a normative political philosophy (potential Pareto), not a positive scientific finding.

  ### 4. What Would Change in the Spreadsheets?

  If we took your critiques seriously and changed the guidance documents (like OMB Circular A-4), here is what would happen in the day-to-day work of an agency analyst:

  **A. If we returned to Strict Ordinalism (Pareto Only)**
  *   **The Change:** A rule could only be issued if it made at least one person better off and *no one* worse off (or if losers were actually compensated).
  *   **The Result:** Regulatory paralysis. Almost no significant regulation is a Pareto improvement. There are always compliance costs. If you require actual compensation, the transaction costs of identifying and paying every loser (e.g., every coal miner who loses a job due to emissions rules) are prohibitive. The spreadsheet would mostly say "Indeterminate."

  **B. If we Replaced WTP with Distributional Weights**
  *   **The Change:** The spreadsheet would have separate columns for income quintiles. A $1,000 benefit to the bottom quintile might be weighted as $1.50 of social value; a $1,000 benefit to the top quintile as $0.80.
  *   **The Result:** Regulations that disproportionately help the poor (clean air, lead abatement) would show higher "Net Benefits." Regulations that disproportionately burden the poor (regressive fees) would show lower Net Benefits.
  *   **The Fight:** This is currently happening. The Biden Administration's Executive Order 12866 update explicitly asks agencies to consider distributional effects more seriously. The resistance is fierce from industry groups who argue this makes analysis "political" rather than "technical." (It was always political; this just makes the politics honest).

  **C. If we Acknowledged Hypothetical Bias**
  *   **The Change:** Agencies would discount survey-based values (Contingent Valuation) significantly or ban them for high-stakes rules.
  *   **The Result:** Many environmental regulations (where market data is scarce) would become harder to justify quantitatively. Agencies would have to rely more on "co-benefits" or qualitative justification, which makes them more vulnerable to legal challenge under the "arbitrary and capricious" standard.

  **D. If we Adjusted VSL by Income**
  *   **The Context:** The Value of a Statistical Life (VSL) is the biggest number in the spreadsheet (currently ~$11-13 million). It is derived from wage-risk studies.
  *   **The Change:** Currently, agencies generally use a single VSL for everyone. Some economists argue we should use a lower VSL for poor populations (because their observed WTP is lower) and higher for rich.
  *   **The Ethical Flip:** Most ethicists and many economists argue the opposite: we should use an *equity-adjusted* VSL (higher for the poor) to correct for the MUI difference.
  *   **The Spreadsheet:** If you adjust VSL for equity, safety regulations for low-income communities suddenly become much more "efficient." Currently, the practice of using a uniform VSL is a compromise that hides the income elasticity of risk.

  ### 5. Where the Consensus is Real vs. Where it is a "Lab Coat"

  **Real Consensus:**
  *   **Measurement Error:** Economists agree that Contingent Valuation is noisy. They agree that VSL estimates vary by study. They agree that discount rates matter immensely.
  *   **Kaldor-Hicks Limitations:** Almost every welfare economist will admit in a seminar that Kaldor-Hicks is not a true welfare metric without distributional weights.

  **The "Lab Coat" (Contested positions presented as technical):**
  *   **The Welfare Interpretation:** The claim that "Net Benefits > 0 implies a social improvement" is not technically true without the MUI assumption. Presenting it as such is the primary deception.
  *   **The Status Quo Baseline:** CBA measures changes from the *current* legal baseline. This embeds current property rights and entitlements as "natural." If you changed the baseline (e.g., assuming people have a right to clean air unless compensated to breathe pollution), the costs and benefits flip. The choice of baseline is normative, but it is treated as a technical starting point.
  *   **The Discount Rate:** Choosing a 3% vs. 7% discount rate determines whether climate regulations pass. This is a moral choice about how much we value the future, but it is argued over using technical finance arguments (opportunity cost of capital vs. social rate of time preference).

  ### Summary

  Your roommate is half-right: it is a tool. But it is a tool designed to cut in only one direction. It is designed to translate complex moral and political questions into a single arithmetic sum that privileges existing wealth distributions and preference structures.

  The tension you feel is the friction between **Positive Economics** (describing choices) and **Normative Economics** (prescribing policy). The discipline bridges this gap with the Kaldor-Hicks principle, which functions as a "fiction of consent." It pretends that because the winners *could* compensate the losers, society *should* act as if they did.

  If you want to be rigorous in your career without rejecting the toolkit entirely:
  1.  **Never say "Benefits exceed Costs."** Say "The sum of unweighted willingness-to-pay exceeds the sum of unweighted compliance costs."
  2.  **Highlight the Distribution.** Always produce the table showing who wins and who loses, even if the guidance doesn't strictly require it.
  3.  **Acknowledge the VSL Assumption.** Explicitly state that the value of life is being treated as equal across income groups (or not), and recognize that as a policy choice.

  You are not confused. You have identified the normative core of the technocratic shell. The "consensus" is largely a agreement to proceed *as if* the metaphysical problems were solved, because the alternative is often decision paralysis. But knowing that it is an "as if" is the difference between being a technician and being a policy analyst.
