      *   2. *Marginal Utility of Income (MUI):* This is the big one. To sum dollars across people, we implicitly assume $1 = $1 in welfare terms. This requires assuming MUI is constant or roughly equal across the relevant population. If MUI differs wildly (rich vs. poor), summing WTP is welfare-meaningless.
      *   3. *Sovereignty of Existing Preferences:* Preferences are taken as given, not judged.
