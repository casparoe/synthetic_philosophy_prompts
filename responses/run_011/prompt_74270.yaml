answer: |-
  ### The question

  Consider the following coordination scenario. Two agents choose Share (S) or Withhold (W). Payoffs (Row, Column): (S,S)=(5,5); (S,W)=(1,7); (W,S)=(7,1); (W,W)=(3,3). Withhold dominates; the default outcome is (3,3).

  Agents may delegate to a program $P$. $P$ receives a binary signal regarding whether the *other* agent delegated, accurate with probability 0.9 (errors independent). $P$ chooses an action based on this signal. Assume that when both delegate, each plays Share with probability 0.9.

  (a) Calculate a delegator's expected payoff when the other delegates and when the other does not (playing Withhold). Identify which specific condition of a Safe Pareto Improvement (SPI) is violated in each case. [8 marks]

  (b) Prove that *no* program using this signal technology can satisfy the safety requirement if it plays Share with non-zero probability. Explain what variable the prediction must target instead of delegation to resolve this. [7 marks]

  (c) Suppose agents sign a joint contract binding both to delegate. Explain why this creates a bargaining problem over the surplus rather than a safety problem. Why does allowing programs to demand specific splits reintroduce a commitment race? What property must a splitting rule possess to avoid this? [8 marks]

  (d) Generalisation: How does the impossibility in (b) change as signal accuracy approaches 1, or if safety is relaxed to allow bounded loss? [2 marks]

  ***

  ### Model answer

  **(a) Payoff Calculations and SPI Violations**

  First, consider the case where **both agents delegate**.
  The prompt states that when both delegate, each plays Share with probability 0.9. Let $p=0.9$ be the probability of Share.
  The expected payoff $E[U | \text{Both Del}]$ is:
  $$P(S,S) \cdot 5 + P(S,W) \cdot 1 + P(W,S) \cdot 7 + P(W,W) \cdot 3$$
  $$= (0.9 \cdot 0.9) \cdot 5 + (0.9 \cdot 0.1) \cdot 1 + (0.1 \cdot 0.9) \cdot 7 + (0.1 \cdot 0.1) \cdot 3$$
  $$= 0.81(5) + 0.09(1) + 0.09(7) + 0.01(3)$$
  $$= 4.05 + 0.09 + 0.63 + 0.03 = 4.8$$
  Since $4.8 > 3$ (the default), the **Pareto Improvement** condition is satisfied here.

  Second, consider the case where **I delegate, but the other does not** (plays Withhold).
  The other agent did not delegate. My program receives a signal about their delegation.
  Signal accuracy is 0.9. Since the truth is "Not Delegated", the signal incorrectly says "Delegated" with probability 0.1.
  The program plays Share if the signal says "Delegated". Thus, I play Share with probability 0.1 and Withhold with probability 0.9.
  The other agent plays Withhold (100%).
  The expected payoff $E[U | \text{Other Withholds}]$ is:
  $$P(\text{I play S}) \cdot 1 + P(\text{I play W}) \cdot 3$$
  $$= 0.1(1) + 0.9(3) = 0.1 + 2.7 = 2.8$$
  Since $2.8 < 3$, I am worse off than the default. This violates the **Safety** condition (specifically, individual rationality relative to the default regardless of the other's move).

  **(b) Impossibility Proof and Prediction Target**

  To satisfy Safety, a delegator must guarantee an expected payoff $\ge 3$ even if the other agent does not delegate (plays Withhold).
  Let $q$ be the probability the program plays Share. Against a Withholding opponent, the payoff is:
  $$q(1) + (1-q)(3) = 3 - 2q$$
  For Safety ($3 - 2q \ge 3$), we require $q \le 0$. Thus, the program must never play Share if there is any possibility the opponent Withholds.

  However, the signal technology predicts *delegation*, not *action*. Because the signal has error rate $\epsilon = 0.1$, any signal triggering Share (e.g., "Other Delegated") occurs with non-zero probability even when the other does not delegate (false positive). If the program plays Share with any probability $k > 0$ upon receiving such a signal, the unconditional probability of playing Share against a non-delegator is at least $\epsilon \cdot k > 0$.
  This yields payoff $3 - 2(\epsilon k) < 3$.
  Therefore, no program using this signal can ever play Share while remaining Safe.

  **Resolution:** The prediction must target the other agent's **action** (Share vs. Withhold), not their delegation status. Only by conditioning Share on the counterfactual "You Share" can agents correlate cooperation without exposing themselves to exploitation when the other defects.

  **(c) Joint Contracts and Commitment Races**

  A joint contract binds both agents to delegate, eliminating the risk of non-participation. The outcome becomes (5,5) with certainty (assuming perfect coordination programs). The safety problem vanishes because the "other doesn't delegate" branch is pruned.

  However, this creates a **bargaining problem**. The surplus is $5 - 3 = 2$ per agent. Agents must agree on how to split this surplus. If programs are allowed to hold out for a larger slice (e.g., demanding a payoff equivalent to 4.5), incompatible demands lead to breakdown (reverting to 3,3).

  This reintroduces a **commitment race**: each agent wants to commit their program to a tough demand first, forcing the other to concede to avoid the breakdown penalty. The agent who commits earliest/firmest captures the surplus.

  **Required Property:** To avoid this, the splitting rule must be **invariant to pre-commitment tactics** (often formalized as Scale Invariance or Independence of Irrelevant Alternatives in the Nash Bargaining Solution). The rule must select a unique focal point (e.g., equal split) based on the feasible set alone, removing the incentive to manipulate the bargaining power through strategic stubbornness.

  **(d) Generalisation**

  As signal accuracy approaches 1 ($\epsilon \to 0$), the expected loss from safety violations approaches 0, but strictly speaking, any $\epsilon > 0$ violates strict safety. If safety is relaxed to permit a **bounded loss** (e.g., payoff $\ge 3 - \delta$), SPI becomes possible provided the error rate is sufficiently low relative to the surplus gained.

  ***

  ### Marking scheme

  | Section | Move / Requirement | Marks |
  | :--- | :--- | :--- |
  | **(a)** | Correct calculation vs Delegator (4.8) | 3 |
  | | Correct calculation vs Non-Delegator (2.8) | 3 |
  | | Identify Pareto condition met vs Safety condition violated | 2 |
  | **(b)** | Proof that $P(\text{Share}) > 0$ implies Payoff $< 3$ vs Withhold | 4 |
  | | Link impossibility to signal noise (false positives) | 1 |
  | | Identify prediction must target *Action*, not Delegation | 2 |
  | **(c)** | Explain shift from Safety problem to Bargaining problem | 2 |
  | | Explain mechanism of Commitment Race (incentive to pre-commit) | 3 |
  | | Identify required property (Scale Invariance / Fairness / Focal Point) | 3 |
  | **(d)** | Generalisation (Signal limit or Bounded Loss relaxation) | 2 |
  | **Total** | | **25** |

  ***

  ### Where the A/B line is

  The boundary between a competent (B) and outstanding (A) answer lies in distinguishing **expected utility** from **safety**. A B-grade student will calculate the expected payoff across all scenarios (weighted by the probability of delegation) and argue that because the *average* payoff exceeds 3, the program is acceptable. They will miss that SPI requires safety *conditional* on the other's move, not just in expectation.

  Furthermore, in part (b), a B-grade answer will accept the prompt's specific program logic without generalizing. They might argue "this specific program fails" rather than proving "no program using this signal works." The A-grade insight is recognizing that *any* correlation based on noisy delegation status creates a non-zero exploitation risk against a non-delegator.

  Finally, in part (c), treating the commitment race as merely "negotiation" is insufficient. The A-grade answer must identify that the *mechanism* of the race is the strategic value of removing one's own flexibility (pre-commitment), and that the solution requires a rule that renders such flexibility-removal useless (invariance).
