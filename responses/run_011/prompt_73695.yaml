  2.  **Deconstruct the Core Problem:**
      *   The current rule is a naive application of something like Lewis's Principal Principle (PP): $Cr(A | Ch(A)=x) = x$.
      *   The problem is that "validated model output" $\neq$ "objective chance" ($Ch(A)$).
      *   Models are epistemic tools; chances are metaphysical (or physical) properties.
      *   The gap between model and world is where the risk lies.
      *   The procedure needs to bridge this gap without requiring the reviewer to become a metaphysician or a super-engineer in 30 minutes.

