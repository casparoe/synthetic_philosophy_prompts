      *   (c) *Two Models:* This is a policy question, not factual. The procedure must escalate.
      *   (d) *Frequency vs. Chance:* Frequentist estimates from finite data are not chances. They are estimates of chances. Credence should reflect uncertainty (interval, not point).
      *   (e) *Triviality:* If "chance" = "model output", the rule is tautological and useless. It must mean "physical propensity." If it means physical propensity, the rule is often false (models are imperfect). *Verdict:* The clause is doing normative work (forcing deference) but is descriptively false. It needs replacement with a "presumptive deference subject to defeaters" rule.

  6.  **Drafting Section 4: Worked Applications:**
      *   *Case 1 (Reactor + Seal Degradation):* This is specific defeating information. Model assumes generic pump reliability. Log shows specific batch failure. *Verdict:* Do not defer. Escalate.
