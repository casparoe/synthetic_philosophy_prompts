      *   Need 6 distinct ways the rule fails.
      *   1. *Model Incompleteness:* The model misses a failure pathway (unknown unknowns).
      *   2. *Parameter Uncertainty:* The input probabilities are estimates with error bars, treated as point values.
      *   3. *Context Drift:* The physical system changes (aging, environment) so the model no longer matches the plant.
      *   4. *Reference Class Mismatch:* The data used to populate the model doesn't match the specific component (e.g., generic data vs. site-specific).
      *   5. *Logical/Structural Error:* The fault tree logic is wrong (gates misconnected), even if "validated" by syntax check.
      *   6. *Interpretative Ambiguity:* The "target event" in the model isn't the same as the licensing condition event (scope creep).
      *   *Mapping:* Which can the procedure repair? (Context drift, parameter uncertainty). Which can it only flag? (Incompleteness, structural error).

  4.  **Drafting Section 2: The Procedure Proper:**
      *   Needs to be a flowchart in text form.
      *   Step 1: Validation Check (Is the stamp current?).
      *   Step 2: Scope Alignment (Does the model event = license event?).
      *   Step 3: Information Check (Do I have specific defeating information?).
      *   Step 4: Stability Check (Is the system static or changing?).
      *   Step 5: Decision (Defer, Reject, or Escalate).
      *   Must fit the 30-minute constraint.

  5.  **Drafting Section 3: Hard Cases:**
      *   (a) *Reviewer Information:* Distinguish between *undermining* information (attacks the chance claim) vs. *ordinary* evidence (attacks the event occurrence).
          *   Maintenance log (sister site): Undermining (suggests model parameters wrong for this class).
          *   Whistleblower (bypassed interlock): Ordinary evidence (system not in modeled state). *Wait, this is tricky.* If the interlock is bypassed, the *chance* of failure given the bypass is different. The model assumes interlock active. This is a "system state" mismatch.
          *   Meta-analysis (systematic underestimate): Undermining (attacks the methodology/chance claim).
          *   Housekeeping: Ordinary evidence (increases likelihood, but doesn't necessarily prove the *chance* estimate wrong, just that conditions are worse). *Correction:* In PSA, housekeeping often translates to human error rates. If the model assumes "good housekeeping," this is a parameter mismatch.
          *   *Key Distinction:* Does this info suggest the *model's mapping to reality* is broken (Undermining/Defeater) or does it suggest the *event is more likely* given the model holds (Ordinary)? Actually, under PP, if you have inadmissible information (info about the future outcome), you don't follow the chance. But here, the info is about the *setup*.
          *   *Refinement:* The distinction is between information that bears on the *truth of the chance hypothesis* (the model is wrong) vs. information that bears on the *outcome* consistent with the chance (the dice are loaded vs. I saw the dice land on 6).
          *   *Sister site log:* Attacks the parameter validity (Chance hypothesis).
          *   *Whistleblower:* Attacks the system configuration (Model scope/assumptions).
          *   *Meta-analysis:* Attacks the methodology (Chance hypothesis).
          *   *Housekeeping:* Attacks the operational state (Model assumptions).
