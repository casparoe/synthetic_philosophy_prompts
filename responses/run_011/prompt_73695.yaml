answer: |-
  ### 1. Diagnostic Opening

  Before constructing the procedure, we must catalogue the ways in which the instruction "set your credence equal to the validated model output" fails to track reality. The clause assumes an identity between *model output* and *objective chance*. This identity is fragile. Below are six distinct failure modes, ordered from the technical to the metaphysical.

  1.  **Scope Drift:** The physical system at the time of review differs from the system described in the safety case (e.g., temporary modifications, aging effects not yet updated in the model). The model calculates the chance for System A; the plant is now System B.
  2.  **Parameter Staleness:** The numerical inputs (failure rates, human error probabilities) are derived from data that is either outdated or drawn from a reference class that does not match the specific components on site (e.g., using generic industry data for a bespoke valve).
  3.  **Structural Blindness:** The logical structure of the model (the fault tree or event tree topology) omits a credible failure pathway. The model is internally consistent but externally incomplete. Validation often checks syntax, not semantic completeness.
  4.  **Epistemic Conflation:** The model output treats epistemic uncertainty (what we don't know about the parameters) as aleatory uncertainty (randomness in the world). A point estimate of $10^{-5}$ might actually represent a wide distribution of possible frequencies. Treating the mean as the chance ignores the variance.
  5.  **Conditional Masking:** The model output is conditional on assumptions (e.g., "assuming maintenance schedule X is followed") that are not guaranteed to hold. The output is presented as an unconditional annual frequency, masking the dependency.
  6.  **The Identity Error:** The metaphysical claim that a model output *is* a chance. Even a perfect model of a deterministic system might output a probability representing our ignorance, not a physical propensity. If the system is deterministic, there is no objective chance, only credence.

  **Derivation of the Procedure:**
  The procedure cannot repair *Structural Blindness* (3) or *The Identity Error* (6) within a thirty-minute window; these require deep scientific investigation or metaphysical resolution beyond the reviewer's remit. The procedure can, however, flag them for escalation.
  The procedure *can* repair or detect *Scope Drift* (1), *Parameter Staleness* (2), and *Conditional Masking* (5) by checking for specific defeating information.
  *Epistemic Conflation* (4) is handled by requiring the reviewer to check if uncertainty analysis accompanies the point estimate.

  Therefore, the procedure functions not as a proof that the model is true, but as a filter for *admissible defeaters*. It operationalises the idea that you should follow the model's chance *unless* you possess specific information indicating the model does not apply to this specific instance.

  ---

  ### 2. The Procedure Proper

  **Objective:** To determine whether the reviewer's degree of belief (credence) should be set equal to the model output ($P_{model}$), adjusted, or rejected.
  **Time Budget:** 30 minutes.
  **Input:** Safety Case Document, Validated Model Summary, Reviewer's External Knowledge.

  **Step 1: The Validation Stamp Check**
  *   **Question:** Does the model carry a current validation signature from the recognised technical authority, and does the version number match the submission?
  *   **Sufficient Answer:** Yes = Proceed. No = **Stop.** Reject the safety case on administrative grounds. Do not assess probability.
  *   **Audit Record:** "Validation status: [Current/Lapsed]."

  **Step 2: The Scope Alignment Check**
  *   **Question:** Does the "Target Event" defined in the licensing condition match the "Top Event" in the model exactly in terms of physical boundary and time horizon?
  *   **Sufficient Answer:** Yes = Proceed. No = **Stop.** Escalate to Panel. This is a policy definition issue, not a probability issue.
  *   **Audit Record:** "Scope alignment: [Match/Mismatch]."

  **Step 3: The Defeater Search (Crucial Step)**
  *   **Question:** Do I possess specific, credible information indicating that the physical plant or its operational context differs from the assumptions hardcoded in the model?
  *   **Search Areas:** Recent maintenance logs, inspection reports from sister sites using identical components, known systemic issues with the technology class, whistleblower reports regarding current status.
  *   **Sufficient Answer:**
      *   *No Defeaters Found:* Proceed to Step 4.
      *   *Defeater Found:* **Stop.** Do not defer. The model output is not the chance for *this* system state. Escalate to Panel with the specific evidence.
  *   **Audit Record:** "Defeaters present: [None/Specify]."

  **Step 4: The Uncertainty Characterisation Check**
  *   **Question:** Is the output presented as a single point estimate, or does it include a confidence interval or distribution reflecting parameter uncertainty?
  *   **Sufficient Answer:**
      *   *Distribution provided:* Set credence to the distribution (or the conservative percentile mandated by standard).
      *   *Point estimate only:* Proceed to Step 5, but note the limitation.
  *   **Audit Record:** "Uncertainty type: [Point/Distribution]."

  **Step 5: The Conditional Assumption Check**
  *   **Question:** Does the model documentation explicitly state that the frequency is conditional on future management actions (e.g., "assuming replacement at year 10")?
  *   **Sufficient Answer:**
      *   *Unconditional:* Defer. Set credence = $P_{model}$.
      *   *Conditional:* Calculate the unconditional probability if possible (using the model's own probability for the condition). If the probability of the condition failing is unknown or high, **Escalate**.
  *   **Audit Record:** "Conditionality: [None/Specified]."

  **Termination States:**
  1.  **Defer:** (Steps 1, 2, 3, 4, 5 passed). Credence = Model Output.
  2.  **Reject:** (Step 1 or 3 failed). Model output is not reliable.
  3.  **Escalate:** (Step 2 or 5 failed, or Step 3 found a complex defeater). Panel must decide on policy or resource allocation.

  ---

  ### 3. The Hard Cases

  **(a) Reviewer Information: Outcome vs. Chance**
  The distinction required is between *inadmissible* information (which bears on the outcome directly, like seeing the dice land) and *undermining* information (which bears on the chance setup, like seeing the dice are weighted). The clause requires you to ignore the former but heed the latter.

  1.  **Maintenance log (sister site degradation):** This is **undermining information**. It bears on *whether the model's number is the chance*. It suggests the parameter (failure rate) assigned to that component class is objectively incorrect for the batch in use. It attacks the mapping between model and world. *Verdict:* Defeater found. Do not defer.
  2.  **Whistleblower (bypassed interlock):** This is **scope mismatch**. The model calculates the chance of failure *given the interlock is active*. If the interlock is bypassed, the system is not the one modelled. This is not about the chance of the modelled system; it is about the identity of the system. *Verdict:* Defeater found (Scope Drift). Do not defer.
  3.  **Published meta-analysis (systematic underestimate):** This is **undermining information**. It bears on the methodology's ability to track chance. If the model family systematically underestimates common-cause failures, the output is not the objective chance, but a biased estimator. *Verdict:* Defeater found. Do not defer.
  4.  **Site visit (poor housekeeping):** This is borderline but leans towards **outcome evidence** unless the model explicitly assumes "good housekeeping" as a parameter. If the model uses generic human error rates that assume standard conditions, poor housekeeping makes the *event* more likely, but doesn't necessarily prove the *chance* (propensity of the equipment) is different. However, in PSA, housekeeping usually maps to human error probabilities. If the model assumes standard industry housekeeping and the site is substandard, the *parameters* are invalid. *Verdict:* Treat as Parameter Staleness (Defeater).

  **(b) The Self-Undermining Model**
  The model outputs a frequency $F$ conditional on "No Regime Change," but assigns $P(Regime Change) = 0.3$.
  *   **Analysis:** The model is admitting that its own assumptions are fragile. The "objective chance" of the target event is the total probability: $P(Event) = P(Event | No Change) \times 0.7 + P(Event | Change) \times 0.3$.
  *   **Procedure Handling:** Step 5 (Conditional Assumption Check). If $P(Event | Change)$ is not provided, the model output is incomplete. You cannot set your credence to $F$ because $F$ is not the unconditional chance.
  *   **Verdict:** Escalate. The operator must provide the risk contribution of the regime change, or the reviewer must apply a conservative bound.

  **(c) Two Validated Models, Different Numbers**
  *   **Analysis:** This is not a factual question about the world; it is a question about *which representation of the world the regulator accepts*. One model may be more conservative; the other more realistic. The "Principal Principle" cannot adjudicate between two competing claims of chance.
  *   **Procedure Handling:** Step 2 (Scope Alignment). If the target events are defined differently (partial vs. complete loss), they are not the same event. If they are the same event, the procedure hits a wall.
  *   **Verdict:** Escalate. This is a policy decision for the Panel. The procedure cannot solve this. The clause is silent here because it assumes a single validated model per case.

  **(d) Frequency from Finite Sample vs. Chance**
  *   **Analysis:** A frequency from 100 tests is an estimate of a chance, not a chance itself. It carries sampling error.
  *   **Procedure Handling:** Step 4 (Uncertainty Characterisation). If the output is a raw frequency without confidence bounds, it fails the check.
  *   **Constraint on Credence:** Your credence should not be the point estimate. It should be a distribution centred on the estimate but widened by the sampling error.
  *   **Verdict:** If the safety case presents raw frequency as "The Chance," flag in Step 4. Require a statistical upper bound (e.g., 95% confidence limit) before deferring.

  **(e) The Triviality Worry**
  *   **Honest View:** On its most charitable reading, the clause is not a metaphysical claim but a *normative instruction*. It does not say "The model *is* the chance." It says "Treat the model *as if* it were the chance for the purpose of regulatory consistency."
  *   **Work Done:** It prevents reviewers from arbitrarily halving or doubling numbers based on intuition. It forces intersubjective agreement.
  *   **Defect:** It creates a false sense of security (reification).
  *   **Replacement:** The clause should read: "Where a model has passed validation, its output is to be treated as the *presumptive* estimate of objective chance, *subject to the reviewer's possession of specific defeating information regarding site conditions or parameter validity*." This shifts the burden of proof: deference is the default, but it is rebuttable.

  ---

  ### 4. Three Worked Applications

  **Case 1: The Research Reactor (Seal Degradation)**
  *   **Data:** Model output $2 \times 10^{-5}$. Reviewer has log showing seal degradation in identical pump batch at three sister sites.
  *   **Procedure Application:**
      *   Step 1 (Validation): Pass.
      *   Step 2 (Scope): Pass.
      *   Step 3 (Defeater Search): **Fail.** The maintenance log is specific, credible information indicating the parameter (pump failure rate) in the model is likely too optimistic for this specific batch. This is Parameter Staleness.
      *   Step 4/5: N/A.
  *   **Verdict:** **Do Not Defer.** Escalate to Panel.
  *   **Record:** "Defeater identified: Component batch failure rate likely exceeds model parameter based on sister site data (Ref: Log #123)."

  **Case 2: The Reprocessing Line (Configuration Change)**
  *   **Data:** Model assigns $P(Change) = 0.3$ in 10 years. Target frequency is conditional on *No Change*.
  *   **Procedure Application:**
      *   Step 1 (Validation): Pass.
      *   Step 2 (Scope): Pass.
      *   Step 3 (Defeater Search): Pass (No external info).
      *   Step 5 (Conditional Assumption): **Fail.** The output is conditional. The unconditional risk is higher. The model does not provide the risk *given* Change.
      *   **Verdict:** **Escalate.**
      *   **Record:** "Output is conditional on operational stability. Probability of instability (0.3) is non-negligible. Unconditional risk cannot be calculated from submission."

  **Case 3: The Uncomfortable Verdict (Forced Deference)**
  *   **Scenario:** A geological disposal test facility submits a model for groundwater contamination. The model is validated, scope matches, no specific defeaters exist. However, the model relies on a theory of rock fracture propagation that the reviewer knows is controversial in the academic literature, though not yet disproven. There is no specific log data or whistleblower info (Step 3 is clear). The output is $10^{-7}$. The reviewer feels this is complacent given the scientific uncertainty.
  *   **Procedure Application:**
      *   Steps 1-5 all pass. There is no *specific* defeating information about *this* site or *this* component batch. The controversy is general scientific uncertainty (Failure Mode 3: Structural Blindness / 6: Identity Error).
      *   **Verdict:** **Defer.** Set credence to $10^{-7}$.
  *   **Why this result?** The procedure is designed for *regulatory* decisions, not *scientific* truth-seeking. Without specific evidence that the model is wrong *here*, the regulator cannot arbitrarily impose a penalty factor. To do so would be to regulate based on the reviewer's private scepticism rather than public evidence.
  *   **Cost:** This exposes the regulator to the risk that the "consensus" model is fundamentally flawed. The procedure protects the reviewer from accusation of arbitrariness, but it does not protect the public from deep uncertainty. This is the point where the standard compels deference that feels philosophically unsafe.

  ---

  ### 5. Limitations and Costs

  **Judgement Calls Wearing the Costume of Procedure:**
  *   **Step 3 (Defeater Search):** Determining whether a piece of information is "specific" enough to count as a defeater is subjective. Is a vague rumour enough? The procedure says "credible information," but credibility is a judgement.
  *   **Step 5 (Conditionality):** Deciding if an assumption is "critical" enough to halt deference requires engineering judgement.

  **What the Procedure Cannot Do:**
  *   It cannot detect **Structural Blindness** (missing pathways) unless there is external evidence of the missing pathway.
  *   It cannot resolve **Deep Scientific Uncertainty** (Case 3 above). It treats established models as truth until proven otherwise.
  *   It cannot fix **Epistemic Conflation** if the operator presents a point estimate with no error analysis; the procedure can only flag it, not correct the number.

  **Collapsed Distinctions:**
  *   **Aleatory vs. Epistemic:** For the sake of the 30-minute limit, the procedure treats all uncertainty as "reason to escalate if unquantified." It does not distinguish between randomness in the world and ignorance in the model.
      *   *Cost:* This may lead to over-caution in areas where randomness is well-understood, or under-caution where ignorance is high but hidden.
  *   **Chance vs. Frequency:** The procedure treats validated frequencies as proxies for chance.
      *   *Cost:* In unique systems (like a geological repository), frequencies do not exist. The procedure forces a frequentist interpretation onto a singular case, which is metaphysically dubious but practically necessary for licensing.

  ---

  ### 6. One-Page Run Sheet

  **REGULATORY REVIEW: PROBABILISTIC SAFETY ASSESSMENT**
  **Reviewer:** ___________________ **Date:** ___________________
