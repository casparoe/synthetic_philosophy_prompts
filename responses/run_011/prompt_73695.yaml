      *   *Case 3 (The Uncomfortable Verdict):* Need a case where the procedure forces deference despite intuition, OR forces rejection despite the standard's intent. Let's choose: *Forces deference to a complacent number.* Why? Because the reviewer has no *admissible* defeating information, only a "gut feeling" or vague unease. The procedure protects the reviewer from liability but might allow risk. *Actually, better:* *Forces rejection where the standard wants deference.* Example: A model is "validated" but uses generic data that the reviewer knows is outdated, but there's no specific log evidence. The procedure requires specific defeating info. If the reviewer acts on general scepticism, they break the rule.
