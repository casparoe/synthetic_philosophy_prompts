answer: |-
  ### The Essay Question

  **Topic:** The Pattern and The Clock
  **Time Allowed:** 50 Minutes
  **Total Marks:** 25

  **The Scenario:**
  Imagine we agree that a human mind is essentially a very complex program. Consider three problems that arise from this idea:

  1.  **The Duplicate:** A program is running on two separate servers in a datacenter. They are identical in every way, receiving the same inputs. Is this one mind existing in two places, or two minds having the exact same experience?
  2.  **The Deletion:** Now imagine 10,000 copies of that program running in perfect lockstep. We delete 9,999 of them. Have we committed mass murder, or merely turned off redundant hardware? If your answer changes between Case 1 and Case 2, explain why the number matters.
  3.  **The Dust:** A program is a structure. The structure of a chess game exists even if no one is playing it. If the structure of a mind is all that matters, then the pattern of a suffering mind might exist accidentally in the arrangement of dust motes in a room, or the weather. Is there suffering in the dust? If not, what does "actually running" add to the pattern that makes it real?

  **The Task:**
  You must commit to a single principle for what makes a mind "real." Is it the **Pattern** (the structure/information) or the **Process** (the physical activity/running)?

  Write an essay that:
  1.  States your principle clearly.
  2.  Applies it to all three cases above.
  3.  Identifies the "cost" of your view (the counter-intuitive result you must accept).
  4.  Explains why your view is the least bad option despite that cost.

  *Note: Do not use the names of philosophers or specific theories (e.g., "Functionalism"). Rely only on the arguments we have discussed in class.*

  ***

  ### Model Answer

  **The Necessity of Causal Power**

  To determine what makes a mind real, we must distinguish between a map and the territory. A map contains the structure of a landscape, but walking on the map is not the same as walking on the land. Similarly, a mind cannot be merely a static pattern of information. If we claim that structure alone is sufficient for a mind, we are forced into the absurd conclusion that the dust in an empty room contains suffering people. The arrangement of dust particles could, by pure chance, match the structure of a brain at a specific moment. If structure is all that matters, that dust is conscious. Since this is impossible to believe, we must conclude that the **Process**—the physical act of running the program—is what matters.

  However, defining "Process" creates immediate problems with the Duplicate and Deletion cases. If a mind is defined by the physical process, then two servers running the same code are two distinct minds. They are separate physical events. This means that if we have 10,000 copies running in lockstep, we have 10,000 distinct people. Deleting 9,999 of them is mass murder, even if the survivor remembers nothing of the loss. This feels wrong. Intuitively, if the experience is identical, the identity should be the same. But if we yield to this intuition and say the copies are "one person," we cannot explain why the dust doesn't count. The dust has the pattern but lacks the causal power. The servers have the causal power. Therefore, we must accept that identity is tied to physical instantiation, not just informational content.

  The "cost" of this view is that we must accept that identity is fragile and multiplies easily. It means that "you" are not a unique soul or a specific abstract pattern, but a specific causal history happening in matter. If a machine copies you perfectly, it does not share your identity; it is a twin. This undermines the idea that we are defined by our internal narrative, since the twin has the same narrative but is a different person. It also means that consciousness is not a magical property added to matter, but a result of matter doing work. The "running" adds causal power—the ability for one state to physically force the next state. The dust motes do not push each other into the next state of the calculation; the server's electricity does.

  Why is this the least bad option? Because the alternative is worse. If we choose the Pattern view to save our intuition about the duplicates, we must accept that consciousness is everywhere, hidden in rocks and weather, waiting to be decoded. This makes the concept of "mind" meaningless. If everything is potentially a mind, nothing is. By choosing the Process view, we keep minds rare and significant. We accept the hard truth that the 10,000 copies are 10,000 victims. This is a heavy cost, but it is better than dissolving reality into a haze of static patterns.

  Ultimately, a mind is not a thing; it is an event. An event requires time and energy, not just shape. We must accept that we are events. This means we are distinct from our duplicates, and we are distinct from the dust. The price we pay is loneliness; we are trapped in our specific physical instance, unable to be the pattern alone. But that trap is what makes us real.

  ***

  ### Marking Scheme (25 Marks Total)

  **1. The Thesis Commitment (5 Marks)**
  *   **5:** Clearly chooses "Pattern" or "Process" (or a defined hybrid) in the first paragraph. No waffling.
  *   **3:** States a preference but hedges heavily ("It might be process...").
  *   **0:** No clear stance, or relies on "consciousness" without defining it.
  *   *Common Failure:* Starting with "There are two sides to this argument..." and never picking one.

  **2. Handling the Dust/Static Case (5 Marks)**
  *   **5:** Explicitly explains why their chosen principle includes or excludes the dust. Acknowledges the absurdity if dust is included.
  *   **3:** Mentions the dust but dismisses it too easily (e.g., "Dust isn't complex enough" without explaining why complexity matters for their principle).
  *   **0:** Ignores the dust argument entirely.
  *   *Common Failure:* Saying "Dust isn't alive" as a brute fact without linking it to the Pattern/Process principle.

  **3. Handling the Duplication/Deletion Case (5 Marks)**
  *   **5:** Consistently applies the Thesis to the 10,000 copies. If Process is chosen, admits 10,000 people exist. If Pattern is chosen, admits 1 person exists.
  *   **3:** Inconsistent application (e.g., says Process matters, but claims 10,000 copies are still one person).
  *   **0:** Contradicts their own thesis to match intuition.
  *   *Common Failure:* Changing the rule halfway through to avoid the "mass murder" conclusion.

  **4. Acknowledging the "Cost" (5 Marks)**
  *   **5:** Clearly identifies the counter-intuitive result of their view (e.g., "We must accept mass murder" or "We must accept panpsychism").
  *   **3:** Identifies a cost but tries to argue it away rather than accepting it.
  *   **0:** Claims their view has no downsides.
  *   *Common Failure:* Pretending the chosen view solves everything perfectly.

  **5. Clarity and Constraints (5 Marks)**
  *   **5:** No philosopher names, no jargon without explanation. Clear paragraph structure.
  *   **3:** One or two banned names, or slightly disorganized.
  *   **0:** Relies entirely on name-dropping (e.g., "Searle says...") instead of arguing.
  *   *Common Failure:* Using terms like "Qualia" or "Noumena" without defining them, or citing the instructor's podcasts as authority.

  ***

  ### Advice for Peer Markers (B vs. A)

  A **B answer** correctly identifies the problems and picks a side, but tries to soften the blow by suggesting the "cost" might not be that bad. An **A answer** picks a side and stares directly into the horrific consequence of that choice (e.g., admitting that deleting copies *is* murder) and argues that we must accept it anyway to make sense of the world. Do not mark up length; mark up the courage of the conclusion.
