answer: |-
  There is no standard term in psychology or decision theory that captures the specific triad you've identified: (1) genuine prior indifference, (2) the randomizer acting as a *generative* rather than *selective* mechanism, and (3) the requirement of self-administration to trigger the affective shift.

  Close neighbors exist—**Post-Decision Dissonance Reduction** (Brehm) explains why we value what we chose, but it assumes a voluntary choice, not a random one. **Self-Perception Theory** (Bem) suggests we infer preferences from our actions, but it struggles to explain why a coin flip counts as "my action." **Existential Commitment** (Sartre) describes creating value through choice, but lacks the mechanical nuance of the randomizer.

  Because the phenomenon requires a specific carving of the conceptual space, I propose we call it **Aleatory Crystallization**.

  Here is the definition, the boundaries, and the diagnostic criteria.

  ### The Definition: Aleatory Crystallization

  **Aleatory Crystallization** is a psychological state transition wherein a decision-maker, facing genuine indifference between two or more options, employs a self-administered randomizing procedure to force a resolution. Upon observing the outcome, the decision-maker experiences an immediate, affective shift toward the selected option, accompanied by the cognitive illusion that this preference was latent prior to the randomization.

  The core mechanism is not *discovery* (finding a hidden preference) but *constitution* (creating a preference where none existed). The randomizer does not break the tie; it dissolves the state of indifference and precipitates a new value structure.

  ### The Three Edges (Inclusion/Exclusion Criteria)

  To count as Aleatory Crystallization, a case must satisfy all three conditions. If it fails one, it is a different phenomenon.

  **1. The Symmetry Condition (vs. Post-Decision Dissonance)**
  *   **Counts:** If the coin had landed tails, the agent would have felt the identical pull toward Option B and constructed identical justifications for it. The preference is symmetric relative to the outcome.
  *   **Does Not Count:** If the agent feels relief only because they secretly wanted Option A all along and used the coin to give themselves permission. That is **Covert Preference Revelation**, not Crystallization.
  *   **Practical Test:** Ask the agent immediately after the flip: "If it had landed the other way, would you have been this happy?" In Crystallization, the honest answer is "Yes, but differently." In Dissonance Reduction, the answer is "No, I would have been disappointed."

  **2. The Generativity Condition (vs. Mechanical Tie-Breaking)**
  *   **Counts:** The outcome generates *new* positive affect (relief, enthusiasm, "rightness"). The agent feels the decision is *better*, not just *done*.
  *   **Does Not Count:** The agent accepts the outcome purely to end the paralysis, feeling no pull toward the option itself, only toward the cessation of deliberation. This is **Procedural Closure**.
  *   **Practical Test:** Measure the valence toward the *option* vs. the *state of deciding*. In Crystallization, the option itself becomes attractive. In Closure, only the absence of stress is attractive.

  **3. The Agency Condition (vs. Resignation)**
  *   **Counts:** The randomizing act must be **self-administered** (or explicitly delegated with full psychological ownership). The agent must flip the coin, or roll the dice, or draw the lot.
  *   **Does Not Count:** An external authority flips the coin and hands the result to the agent. In this case, the agent typically feels **Resignation** or **Compliance**, not the "pull" of preference. They follow the order, but they do not retroactively claim they wanted it all along.
  *   **Practical Test:** Compare the internal report of "I flipped it" vs. "They told me." Crystallization only occurs when the agent retains locus of control over the *mechanism*, even if they surrender control over the *outcome*.

  ### Why the "Self-Administered" Constraint Matters

  You noted that if someone else flips the coin, you get resignation, not preference. This is the crucial hinge of Aleatory Crystallization.

  When you flip the coin yourself, the randomness is psychologically absorbed into your own agency. It becomes a **Somatic Oracle**. The physical act of flipping allows your subconscious to treat the outcome as a signal from *within* (a form of magical thinking or somatic marking), rather than a command from *without*.

  *   **External Flip:** The outcome is an environmental constraint. You adapt to it. (Result: Resignation).
  *   **Internal Flip:** The outcome is an expression of your will to decide. You own it. (Result: Crystallization).

  This distinguishes it from **Delegated Authority**, where you let a boss decide. In Delegated Authority, you can blame them if it goes wrong. In Aleatory Crystallization, because you flipped the coin, you cannot blame the universe. To avoid the cognitive dissonance of "I gambled my life on a coin," your mind instantly inflates the value of the winner.

  ### Differentiation from Neighbors

  | Phenomenon | Prior Preference? | Role of Randomizer | Affective Outcome |
  | :--- | :--- | :--- | :--- |
  | **Aleatory Crystallization** | **None (True Indifference)** | **Constitutive (Creates Value)** | **Relief + "Rightness"** |
  | Post-Decision Dissonance | Weak/Conflicted | None (Voluntary Choice) | Relief + Justification |
  | Covert Revelation | Strong (Repressed) | Revelatory (Uncovers Truth) | Validation |
  | Procedural Closure | None | Mechanical (Stops Pain) | Neutral/Relief only |
  | Resignation | None | Imposed (External) | Acceptance/Defeat |

  ### The Diagnostic Question

  To determine if you are witnessing Aleatory Crystallization in the wild, ask this:

  > *"Does the reason you like this option exist before the flip, or did it appear after?"*

  *   If they say: "I realized this was actually better." -> **Covert Revelation** (They were lying about indifference).
  *   If they say: "It doesn't matter, I just needed to move." -> **Procedural Closure** (No preference formed).
  *   If they say: "Seeing it land on Heads made me realize how much I wanted Heads." -> **Aleatory Crystallization**.

  ### Summary
  The phenomenon is **Aleatory Crystallization**. It is the specific alchemy where **self-administered chance** is converted into **retroactive certainty**. It is not a way to find what you want; it is a way to want what you found.
