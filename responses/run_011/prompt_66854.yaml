answer: |-
  Your instincts are excellent. You have identified two of the most significant technical debates in the literature on structural realism, and the orientation sheet you received is presenting a highly specific, partisan version of the view (Ontic Structural Realism) as if it were the uncontested standard. It is not splitting hairs to distinguish Epistemic from Ontic structural realism, nor is it confusion to worry about whether "structure" is trivial; these are the exact objections that define the field post-2000.

  The instructor's sheet reads like a manifesto for **Ontic Structural Realism (OSR)**, specifically the eliminativist variety championed by James Ladyman and Don Ross, but it presents it as the generic view originating with John Worrall. Worrall's original 1989 paper actually defends **Epistemic Structural Realism (ESR)**. Conflating the two is a major pedagogical simplification that borders on misrepresentation.

  Here is the sentence-by-sentence audit you requested, followed by an explanation of the two big philosophical problems you spotted.

  ### Sentence-by-Sentence Audit

  | Sentence | Verdict | Analysis |
  | :--- | :--- | :--- |
  | **"Structural realism starts from the pessimistic meta-induction..."** | **Accurate** | This is standard. The Pessimistic Meta-Induction (PMI) is the primary motivation for the view. |
  | **"Worrall's insight was that in the shift from Fresnel to Maxwell the equations for light carried over while the ether they were originally equations about did not."** | **Loose / Debatable** | This is the standard Worrall example, but "equations carried over" is imprecise. The *mathematical form* persisted, but the *physical interpretation* of the variables changed (ether displacement vs. electromagnetic fields). It's a good heuristic, but historically messier than implied. |
  | **"What accumulates across theory change is mathematical structure, not furniture."** | **Loose** | "Accumulates" implies monotonic growth. "Persists" is better. "Furniture" is informal slang for ontology/entities, but acceptable in an intro sheet. |
  | **"The structural realist therefore holds that the relations are what is real, and the relata at the ends of them are at best bookkeeping devices."** | **Confidently Wrong (as generic SR)** | **This is the smoking gun.** This defines *Ontic* Structural Realism (eliminativist). *Epistemic* Structural Realism (Worrall's original view) holds that relata *exist*, we just can't know their intrinsic nature. Presenting OSR as the only option without distinction is a major omission. |
  | **"That is why this is not a retreat from realism but realism correctly aimed, and why the meta-induction turns out to be harmless..."** | **Loose / Rhetorical** | Standard rhetorical move. "Harmless" is strong; "deflected" is more accurate. |
  | **"...it only ever bites on the parts of a theory that structural realism has already conceded are dispensable, and everywhere else the successful structure is retained — which is a prediction the view makes and history keeps confirming."** | **Confidently Wrong / Question-Begging** | This makes the view unfalsifiable. If a future theory changes the structure, the structural realist can simply say, "That wasn't the *real* structure." It claims history "confirms" this, but that requires cherry-picking which structures count as "retained." |
  | **"Newton's law of gravitation is another instance: nobody believes gravity is an instantaneous pull between bodies anymore, but every trajectory we fly is still computed from the inverse-square law."** | **Confidently Wrong** | **This is a category error.** Newton's law is a *limiting case* approximation of General Relativity, not a retained fundamental structure. In GR, there is no force and no instantaneous pull; the "structure" (spacetime curvature) is fundamentally different from Newton's (absolute space + force). This is not analogous to the Fresnel case. |
  | **"Note also that the structural realist is not saying we know nothing about the unobservable world. We know its structure — and structure, in any case, is all a theory ever says."** | **Confidently Wrong** | The first clause is fine. The second ("structure is all a theory ever says") is a substantive metaphysical claim, not a trivial truth. Standard realists believe theories describe intrinsic properties too. This begs the question against non-structural realists. |
  | **"Where the view really pays off is quantum mechanics, where what an electron is has no settled answer but the Hilbert space structure is not in doubt."** | **Loose / Controversial** | OSR proponents love QM (entanglement suggests relations over objects). However, saying Hilbert space structure is "not in doubt" ignores massive debates over the ontology of the wavefunction (e.g., Bohmian mechanics vs. Collapse theories). |
  | **"Then the sheet concludes that the old fight between realism and empiricism mostly dissolves..."** | **Confidently Wrong** | Constructive Empiricists (like Van Fraassen) explicitly deny we should believe in unobservable structure. The debate does not dissolve; it shifts to whether structure itself is observable. |

  ---

  ### Your Two Hunches: Validated and Named

  You have correctly identified the two biggest holes in the position as presented in the sheet.

  #### 1. The ESR vs. OSR Distinction
  You are right: there are two versions.
  *   **Epistemic Structural Realism (ESR):** Associated with John Worrall (1989). Claims: Objects/relata exist, but we can only know the structural/relational properties. We cannot know the *intrinsic nature* of the relata. This is the "moderate" view.
  *   **Ontic Structural Realism (OSR):** Associated with James Ladyman (1998) and Don Ross. Claims: There *are* no relata (or they are secondary). The world *is* structure. "Relations without relata." This is the "radical" view.

  **The Sheet's Error:** The sheet describes Worrall's motivation (Fresnel) but jumps immediately to Ladyman's ontology (no relata). It presents the radical view as the moderate consensus. In section, it is perfectly appropriate to ask: *"The sheet seems to conflate Worrall's ESR with Ladyman's OSR. Are we treating the elimination of relata as a necessary commitment of structural realism, or is that a specific development?"*

  #### 2. The "Structure is Trivial" Worry (The Newman Objection)
  Your hunch that "if all you know is structure, you know nothing" is a famous, named objection: **The Newman Problem** (from Max Newman, 1928).
  *   **The Objection:** If you take any set of objects and any mathematical structure, you can map the objects to the structure provided you have the right number of objects (cardinality). Therefore, saying "the world has structure $S$" is trivial unless you specify *what* is structured.
  *   **The Implication:** To avoid triviality, the structural realist must admit that the relations are not just mathematical but *physical* or *causal*. But if they admit that, they seem to be admitting knowledge of the intrinsic nature of the relations, which threatens to collapse the view back into standard realism.
  *   **The Sheet's Error:** The line "structure, in any case, is all a theory ever says" is an attempt to dodge Newman by fiat. It asserts that theories *don't* say anything about intrinsic natures, so Newman doesn't apply. But most philosophers of science think theories *do* try to say that, and the structural realist is making a controversial claim to deny it.

  **In Section:** You can ask: *"How does the view respond to the Newman objection? If structure is just mathematical relations, isn't it trivial? If it's physical structure, don't we need to know something about the relata to ground it?"*

  ---

  ### The Historical Cases: Fresnel vs. Newton

  Your intuition on the examples is also correct.

  **Fresnel to Maxwell:** This is the strongest case for SR. The wave equation survived. However, even here, the "structure" wasn't perfectly preserved (e.g., Fresnel assumed longitudinal waves initially, Maxwell requires transverse). The SR argument is that the *core* mathematical relations survived. This is plausible.

  **Newton to Einstein:** The sheet claims the inverse-square law is "retained structure." This is philosophically weak.
  *   In Newtonian mechanics, gravity is a **force** acting in **absolute time** across **absolute space**.
  *   In General Relativity, gravity is **curvature** of **spacetime**.
  *   The inverse-square law is a **limiting case approximation** (valid when gravity is weak and speeds are low).
  *   **Why this matters:** If SR relies on "limiting case approximations" to claim structure is retained, it becomes very hard to distinguish SR from the claim that "old theories are approximately true." The Fresnel case is about *equation form* surviving; the Newton case is about *numerical output* matching in a specific regime. Conflating them weakens the argument.

  ### Is the View Unfalsifiable? (The Meta-Induction Claim)

  You asked if the claim that PMI is "harmless" makes the position impossible to test.
  *   **The Worry:** If the structural realist says, "Whatever structure survives is the real structure," they are safe from PMI by definition. But this makes the view a "just-so story" told after the fact.
  *   **The Challenge:** Can SR *predict* which parts of a current theory will survive? Worrall argues yes (the mathematical structure), but critics argue we can't identify the "real structure" until *after* the new theory arrives.
  *   **In Section:** Ask: *"Does structural realism make risky predictions about which parts of current theories will survive, or does it only identify the surviving structure retrospectively?"*

  ### Seminar Strategy

  You are not making a scene by raising these points; you are engaging with the literature at the level the students who read the papers will be expected to. The orientation sheet is a "stylized" summary that favors OSR.

  **Recommended approach:**
  1.  **Don't accuse the instructor of being wrong.** Assume the sheet is a "working definition" for the sake of the seminar.
  2.  **Frame it as clarification.** "I was reading up on the background and noticed a distinction between Epistemic and Ontic structural realism. The sheet seems to describe the Ontic version (relations without relata). Is that the version we are focusing on for the papers, or are we treating the Epistemic version as live option?"
  3.  **Bring up Newman gently.** "I was worried about the Newman objection regarding the triviality of structure. Does the claim that 'structure is all a theory says' solve that, or does it push the problem back?"
  4.  **On Newton:** "I'm curious about the Newton example. Since GR changes the fundamental structure (force vs. curvature) rather than just the ontology, does that count as structural retention in the same way as Fresnel/Maxwell, or is it a different kind of approximation?"

  **Summary for your confidence:**
  *   **ESR/OSR Distinction:** You are right; the sheet conflates them.
  *   **Newman Objection:** You are right; this is a standard, named objection.
  *   **Newton Example:** You are right; it is a limiting case, not structural retention in the strict sense.
  *   **Sheet's Status:** It is a partisan OSR summary presented as neutral consensus.

  You are well-prepared to contribute. The fact that you spotted these tensions in a two-page handout suggests you have a good grasp of the philosophical stakes.
