answer: |-
  The collision between George Berkeley's *The Querist* and the Continental Currency is one of those rare historical moments where a metaphysical idealist is forced to grapple with hard material constraints. You are right to suspect that the Continental episode is the stress test Berkeley's monetary theory needs. On the surface, Berkeley appears to be a proto-Chartalist, arguing that money is a creature of the state and a token of account rather than a commodity. Yet, the collapse of the Continental suggests that tokens without teeth are worthless. To determine whether Berkeley survives this episode, we have to dissect his specific claims against the mechanics of the 1775–1781 collapse, and then decide whether his theory is robust enough to explain the failure or if it retreats into unfalsifiable exhortation.

  Let's begin by running Berkeley's three specific claims against the historical record of the Continental.

  The first claim is that money is "so far useful, as it stirreth up industry." This is a functionalist definition. Money isn't wealth itself; it is the spur that makes wealth happen. In the early years of the Revolution (1775–1777), the Continental actually vindicates this claim remarkably well. The emissions allowed the Continental Congress to mobilize resources, pay troops, and purchase supplies that otherwise would have remained idle. The paper money *did* stir industry, or at least economic activity directed toward the war effort. It facilitated the transfer of real goods from farmers to soldiers. However, by 1779, the relationship inverted. As emissions accelerated without restraint, the currency ceased to stir industry and began to destroy it. Farmers withheld produce because the medium of exchange no longer signaled a reliable claim on future goods. Here, Berkeley's claim holds, but only conditionally: money stirs industry only so long as it is perceived as a reliable measure of value. Once the "stirring" mechanism breaks due to depreciation, the money becomes useless, exactly as Berkeley's utility condition implies.

  The second claim asks "whether the true idea of money, as such, be not altogether that of a ticket or counter." This is the core nominalist assertion. If money is a ticket, it implies a transaction between a holder and an issuer. A ticket is valuable because it grants access to something else, or because the issuer accepts it as proof of payment. The Continental episode breaks this claim if we view the "ticket" as requiring a specific redemption in specie. The Continental was nominally payable in specie someday, but everyone knew that was a fiction. However, if we view the "ticket" as requiring acceptance by the issuer for obligations owed to the issuer (taxes), the episode supports Berkeley's deeper intuition. Congress issued the tickets but, under the Articles, had no power to tax. Therefore, there was no flow-back mechanism. The public held tickets that the issuer would never take back. The collapse suggests that a "ticket" without a receiver is not a ticket at all; it is merely printed paper. Berkeley's analogy holds, but it demands an institutional reality that Congress lacked.

  The third claim asks whether, denominations being kept even if the bullion were gone, commerce could be maintained. This is the boldest fiat claim. The Continental proves that commerce *can* be maintained without bullion, but not *indefinitely* without trust. For several years, the American economy ran almost exclusively on this fiat standard. Trade continued, prices were quoted, and debts were contracted. However, the eventual collapse into a barter economy or the use of foreign coin (like the Spanish milled dollar) by 1780 suggests that while bullion is not strictly necessary for the *existence* of money, some anchor is necessary for its *stability*. Berkeley is right that bullion is not the essence of money, but the Continental shows that removing the bullion anchor requires a substitute anchor (like tax redemption or credible scarcity), which was absent.

  This leads to the central tension in your analysis: the conflict between the "proportion story" and the "ticket-has-to-be-honored story." Does Berkeley commit to one?

  The proportion story suggests that the quantity of money must be calibrated to the circulation and industry it carries. Over-issue leads to depreciation. The ticket story suggests that the note is worthless because no authority would ever take it back (no tax demand). In the case of the Continental, these two mechanisms converge on the same outcome (collapse), but they diverge sharply on the diagnosis and the cure in 1779.

  If Berkeley is a proportion theorist, the sin of 1779 was printing too much. The remedy would be to stop the presses and let the existing stock stabilize relative to goods. If Berkeley is a fiscal theorist (ticket/honor), the sin was failing to create a demand for the currency. The remedy would be to levy taxes payable in Continentals, even if the quantity remained high.

  Does *The Querist* distinguish these? Berkeley often writes as if the "will" of the state determines the value. He suggests that if the state wills the money to circulate, it will. This leans toward the ticket theory. However, he also warns against excess. The problem is that Berkeley does not seem to possess a rigorous model of price levels. He treats money primarily as a stimulus for employment. In 1779, the proportion mechanism was screaming: prices were rising faster than emissions, indicating a flight from the currency. The ticket mechanism was also screaming: Congress could not redeem the promise.

  Where they come apart is in the counterfactual. If Congress had taxed heavily in 1779 to soak up the currency, the proportion theorist would say, "Good, you reduced the quantity." The ticket theorist would say, "Good, you honored the ticket." But what if Congress had taxed heavily *without* reducing the quantity (e.g., taxing to pay interest on the debt, keeping the notes in circulation)? A strict quantity theorist would predict inflation continues. A Berkeleyan ticket theorist might predict stability, because the "ticket" is now honored by the state. The historical record is mute on this because Congress did neither. However, Berkeley's emphasis on "industry" suggests he cares more about the velocity and use of the money than the strict stock. If the money circulates rapidly (high velocity due to inflation), it might still "stir industry" in a chaotic way, but Berkeley seems to value stable industry.

  This ambiguity allows for the "scope restriction" defense you mentioned. Berkeley frequently qualifies his queries with references to a "well-govern'd State." Congress was not a state in the sovereign sense; it was a confederacy at war without coercive power. One could argue the Continental collapse doesn't refute Berkeley because he never claimed his system would work for a government that cannot tax.

  Is this a legitimate scope restriction or a way of making the theory unfalsifiable? It borders on the latter. If every failure of fiat money is attributed to "bad governance" rather than the mechanics of the money itself, the theory risks becoming tautological: money works when the state is well-governed, and we know the state is well-governed when the money works. However, there is a charitable reading. Berkeley is writing political economy, not just mechanics. He understands that money is a social institution. A "well-govern'd State" is not just a scope condition; it is a *constitutive* condition of the money's existence. Without the governance structure to maintain the "will" behind the currency, the money ceases to be money in Berkeley's sense. It reverts to paper. In this light, the theory is not unfalsifiable; it is institutional. It predicts that fiat money will fail in institutions that lack fiscal capacity. That is a falsifiable claim, and the Continental confirms it.

  This brings us to the question of whether *The Querist* is doing prediction or exhortation. It is predominantly exhortation. Berkeley is trying to persuade the British (and by extension, any government) to use paper money to develop Ireland or the colonies. He is selling a policy. When he asks whether money is a ticket, he is trying to liberate policymakers from the constraint of scarce specie. He is not necessarily predicting that *any* ticket will work; he is arguing that a *properly managed* ticket will work better than gold. The Continental episode shows what happens when you take the tool (paper money) without the manual (fiscal discipline and governance). Therefore, Berkeley survives as a theorist of potentiality, not as a guarantor of outcomes.

  However, there is a psychological dimension where Berkeley might be the best explainer in the room. You noted his psychology predicts the death spiral: money stirs industry only while people "will" it to. Once the prevailing will turns, the note stops moving anything. This is a sophisticated understanding of confidence. Hume or Smith might explain the depreciation through quantities or real bills, but Berkeley explains the *tipping point*. Why did the currency hold in 1777 and collapse in 1780? The quantity of money changed gradually, but the public's "will" to accept it changed abruptly. Berkeley's framework accommodates the sudden collapse of confidence better than a mechanical quantity theory. He recognizes that money is a shared hallucination that requires constant reinforcement. When the "opinion" of the people shifted—perhaps triggered by military setbacks or the sheer volume of paper—the "industry" stopped. In this sense, the Continental is not a counterexample; it is a demonstration of his psychological premise. The "will" was withdrawn, so the money died.

  Now consider the recovery in 1781–82. Robert Morris, the Bank of North America, and French loans in actual coin steadied things. Does this vindicate Berkeley's national bank pitch, or is it just metallism wearing his vocabulary?

  Berkeley was a proponent of a national bank to manage credit. The Bank of North America did exactly that: it consolidated government deposits and issued notes. This looks Berkeleyan. However, the stabilization relied heavily on French loans in *coin*. The hard specie provided the anchor that the Continental lacked. If the recovery depended on the coin, then Hume (who emphasizes specie) is vindicated. If the recovery depended on the Bank's management of credit, Berkeley is vindicated.

  The reality is likely a synthesis. The coin restored confidence (the "will"), but the Bank allowed that confidence to be leveraged into circulation (the "ticket"). Berkeley would argue the coin was merely the seed to restart the engine, but the engine itself is the credit system. However, one must admit that without the French specie, the Bank's notes likely would have suffered the same fate as the Continental. This suggests Berkeley's "ticket" needs a reserve, or at least the credible threat of one, to function in a crisis. It vindicates his institutional intuition (banks are good) but undermines his pure nominalism (bullion doesn't matter). It shows that while bullion isn't the *definition* of money, it is often the *foundation* of the trust required for the ticket to circulate.

  How would Hume or Smith explain the depreciation better? Hume's price-specie flow mechanism is more mechanically precise regarding inflation. He would point to the increase in the money supply relative to trade and predict the price rise directly. He wouldn't need to invoke "industry" or "will." Smith, with his real bills doctrine, would argue the Continental failed because it was issued to finance consumption (war) rather than productive capital that would generate a return to redeem the notes. Smith offers a better explanation for *why* the emissions were unsustainable: they were not self-liquidating.

  Berkeley goes silent on several critical mechanical details. First, counterfeiting. The British counterfeited Continentals out of New York. For a theorist who views money as a "ticket," counterfeiting is a fatal attack on the issuer's monopoly. If anyone can print the ticket, the issuer's "will" is irrelevant. Berkeley does not adequately address how a state maintains the exclusivity of its ticket against external enemies. Second, legal tender laws. The states passed laws forcing people to accept Continentals at par. Berkeley talks about the "will" of the people, but legal tender is the *coercion* of the will. He doesn't explore whether forced circulation undermines the voluntary confidence he deems necessary. Third, price-fixing. New England attempted to fix prices to stop inflation. Berkeley focuses on the money side; he doesn't discuss the futility of controlling prices when the medium of exchange is depreciating. These silences matter because they are the actual policy tools used during the war. By ignoring them, Berkeley's theory remains in the realm of high-level principles rather than operational guidance.

  So, does Berkeley survive the Continental? He survives, but he is scarred. The episode breaks his purest nominalist claim that bullion is irrelevant; it shows that without a fiscal anchor or a specie reserve, the "ticket" loses its power. However, it supports his functionalist view that money is about industry and his psychological view that money relies on collective will. The distinction between the proportion story and the honor story remains unresolved in his text, but the Continental suggests they are two sides of the same coin: over-issue destroys the honor, and lack of honor makes the proportion irrelevant.

  The "well-govern'd State" restriction is not merely a shield; it is the core of his insight. Money is not a physical object; it is a political relationship. When the political relationship (Congress's ability to tax and govern) failed, the money failed. Berkeley is not wrong to say a ticket can work without bullion; he is just optimistic about how easy it is to make the ticket credible. The Continental shows that creating a "ticket" money is harder than creating a commodity money because it requires a functioning state, not just a mine.

  In the end, *The Querist* is less a predictive model of inflation and more a treatise on the political prerequisites of finance. Hume explains the inflation mechanics better; Smith explains the capital allocation better. But Berkeley explains the *nature* of the thing better. He understands that the Continental didn't just lose value; it lost its status as money because the "will" behind it evaporated. The recovery of 1781 wasn't just a return to specie; it was a restoration of governance (Morris) and confidence (French alliance). Berkeley's theory accommodates this if we accept that "well-govern'd" includes the capacity to wage war and levy taxes. If we demand he predict the exact rate of depreciation based on emissions, he fails. If we ask him whether paper money can function as a tool of statecraft, the Continental proves him right in principle but warns us of the peril in practice. The "ticket" works, but only if the issuer can enforce its validity and limit its supply—two things the Continental Congress could not do. Berkeley's ghost would likely look at 1779 and say not that his theory was wrong, but that the state was not yet "well-govern'd" enough to wield it.
