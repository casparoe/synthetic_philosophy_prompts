  ### The Principle of Normative Authority and Integrity

  **Principle:**
  An agent **B** has standing to blame agent **A** for wrong **W** if and only if the following three conditions are met:

  1.  **Jurisdiction Clause:** **B** stands in a normative relationship to **A** or to the victim of **W** that grants **B** the authority to enforce norms of type **W**.
      *   *Motivating Cases:* **3** (Friend/Infidelity), **8** (Stranger/Parenting), **9** (Stranger/Dog), **11** (Third Party/Victim).
      *   *Explanation:* This clause distinguishes between wrongs that are anyone's business (universal moral norms like cruelty, Case 9) and those that are relational or domestic (parenting, Case 8). It also accounts for the special standing of the victim to waive blame (Case 11).

  2.  **Integrity Clause:** **B** is not currently culpably violating **W** in a context relevantly similar to **A**'s violation.
      *   *Motivating Cases:* **1** (Late Colleague/Public), **4** (Brother/Neglect), **6** (Relapsed Drunk), **10** (Company/Plastic).
      *   *Explanation:* This clause captures the intuition that current hypocrisy forfeits standing. It requires current compliance, not just historical purity. It explains why the relapsed drunk (Case 6) lacks standing despite the reformed drunk (Case 5) having it.

  3.  **Redemption Clause:** Past violations of **W** do not negate standing if **B** has demonstrably reformed and is currently compliant.
      *   *Motivating Cases:* **5** (Reformed Drunk), **7** (Reformed Plagiarist).
      *   *Explanation:* This clause ensures that standing is not permanently lost due to past sins, provided the blamer is currently upholding the norm they invoke.

  ---

  ### Reconciliation of Cases 5 and 6
  You flagged Cases 5 and 6 as irreconcilable because the difference (relapse) is invisible to the audience. Under this principle, they are **reconcilable**. Standing is a **normative status**, not an epistemic one. Whether the friend *knows* the blamer has relapsed is irrelevant to whether the blamer *has* standing. In Case 5, the blamer is sober (Integrity Clause met); in Case 6, he is drinking (Integrity Clause failed). The loss of standing in Case 6 is real, even if undetectable.

  ---

  ### Application to Novel Cases

  1.  **Someone who blames another for a wrong he fully intends to commit tomorrow.**
      *   **Verdict:** **Standing Intact.**
      *   **Reasoning:** The Integrity Clause requires *current* compliance. Future intentions do not constitute a current violation. The blamer is, at the moment of blaming, upholding the norm.

  2.  **Someone who committed the same wrong but believes non-culpably that he did not.**
      *   **Verdict:** **Standing Intact.**
      *   **Reasoning:** The Integrity Clause specifies *culpable* violation. If the blamer's own violation was non-culpable (due to ignorance), they are not hypocritical in the moral sense required to forfeit standing.

  3.  **Blame directed at a person long dead.**
      *   **Verdict:** **No Standing.**
      *   **Reasoning:** The Jurisdiction Clause fails. Blame is a communicative act aimed at moral accountability. A dead person cannot be held accountable, nor do the living typically hold a normative relationship that permits blaming the dead (unless speaking on behalf of a living victim, which shifts the jurisdiction).

  4.  **Two equally complicit people blaming each other simultaneously and sincerely.**
      *   **Verdict:** **No Standing (for both).**
      *   **Reasoning:** The Integrity Clause applies to both. Since both are currently violating the norm they invoke, neither possesses the authority to enforce it against the other. This results in a "standoff" where the blame is accurate but lacks standing.

  5.  **Whether a person can lack standing to blame himself.**
      *   **Verdict:** **Standing Intact.**
      *   **Reasoning:** The Jurisdiction Clause is satisfied (one has authority over oneself). The Integrity Clause is generally suspended for self-blame; guilt is the mechanism by which we acknowledge our own lack of integrity. To deny standing for self-blame would preclude moral remorse entirely.

  ---

  ### The Sacrifice

  **Verdict to Give Up:** **Case 2** (The Late Colleague, Private).

  **Reasoning:**
  Case 2 is the only verdict that contradicts the **Integrity Clause**. In Case 2, the colleague is "chronically and conspicuously late" yet is granted standing to blame you for lateness (or its consequences). In Case 1, the *same colleague* with the *same record* lacks standing. While you distinguish them by manner (public vs. private), a mechanical principle of standing based on integrity cannot easily accommodate a rule where a chronic violator has standing in private but not in public.

  To preserve the principle's clarity and its fit with Cases 1, 4, 6, and 10 (all of which deny standing to current violators), Case 2 must be treated as an error in intuition. The feeling that you "would be dodging" by pointing out his lateness is likely a confusion between the **truth** of his claim (your lateness did cost the client) and his **standing** to deliver it. He has the truth, but he lacks the authority.

  **Cost of Giving Up Case 2:**
  The cost is the loss of a nuanced distinction between **moralizing** and **pragmatic warning**. By rejecting Case 2, you accept that a hypocrite lacks standing even when offering private, constructive feedback. This may feel overly rigid in professional contexts where practical consequences (client confidence) matter more than moral purity. However, it preserves the core moral intuition that one cannot enforce a norm one is actively flouting, regardless of the audience size.

  *(Note: You flagged uncertainty regarding Case 10 (the Employee). While that is an easier verdict to sacrifice, sacrificing Case 2 yields a more robust principle regarding personal hypocrisy, which is the central tension in your data set.)*
