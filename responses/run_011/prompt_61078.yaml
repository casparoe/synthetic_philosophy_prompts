answer: |-
  Good evening. Thank you for being here, and for welcoming us into this season of work. For those who know the halls of this museum only as a place of finished things, I want to show you something that is still very much in progress.

  Behind this cloth is a case containing a creature so small it could rest on a fingernail. It is pale and blind, born without eyes because it lives in the dark water of three springs in the valley north of the city. We spent four years walking that valley, sampling the water, finding these animals where the stone opens into the earth. They are fragile. They are specific to that water. And tonight, we attach a name to them.

  We are naming this animal for Adela Marchetti. Many of you knew her as the chair of this board, a guardian of this institution. Her family is here, and I want them to know that Adela's support was not just for the building or the budget. It was for the act of looking itself. She understood that science is not a collection of answers, but a way of paying attention.

  When we find something new, the impulse is to say we have discovered a thing that was never known before. But that is not quite true. This animal was here long before we arrived, and it will remain after we are gone. What is new is not the creature, but the connection we have made between it and us. We have traced its history back through the water it inhabits. We have found that it belongs to this valley, even if the water itself flows from elsewhere.

  There is often a hope that a name is a lock, that once we fix a label to a living thing, it stays fixed forever. But water moves, and life moves, and our understanding moves with them. The science of these springs is alive. Other researchers look at the same water and see different boundaries. They ask whether this animal is one thing or three, whether it is separate from its cousins on the surface or deeply distinct. These are good questions. They are the work of the future.

  But tonight is not about drawing borders that must hold for a century. It is about honoring the reality of what is here now. A name is not a cage. It is a flag planted in the ground where we stood when we saw something worth remembering. We do not name this animal to declare it separate from the world, but to mark the specific history of the life within it. Adela knew that memory is not about keeping things unchanged, but about keeping faith with what was there when we looked. By giving this animal her name, we are not promising that the label will never change. We are promising that the attention we paid to this life, and the care she gave to this museum, are real things that happened in history, just as this animal is a real thing that lives in this valley.

  The work continues. The water will keep flowing. But for this moment, we acknowledge what we have found, and who helped us find it.

  Please join me in unveiling the case.

  [NAME]

  Commitment: This animal is a specific historical occurrence that exists independently of the boundaries we draw to classify it.
