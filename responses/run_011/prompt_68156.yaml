answer: |-
  ### Brainstorming: Weighty Moments for Standing

  Before constructing the argument, we need to isolate the specific textual beats that stress-test the concept of *custodial standing*. We are looking for moments where the Duke's authority to judge is severed from his moral cleanliness or his official capacity.

  1.  **The Abdication (Act 1, Scene 1):** Vincentio explicitly hands "commission" to Angelo. He says, "I have on Angelo imposed the office." If standing is custodial (derived from the job), does walking away from the job void the standing? Or does he retain a "reserve" standing because the abdication is a ruse?
  2.  **The Friar Disguise (Act 3 & 4):** Vincentio observes Claudio's despair and Isabella's grief. He advises them but withholds the truth of his identity and his plan. He becomes a participant in the deception. Does a custodian who manipulates the subjects he protects lose the standing to judge them later?
  3.  **The Bed Trick (Act 4, Scene 1):** Vincentio orchestrates the substitution of Mariana for Isabella. He facilitates a sexual deception to satisfy a legal technicality. He is now complicit in the very "sin" (deception/sex-for-mercy) that Angelo is condemned for. This is the strongest point against his moral standing.
  4.  **The Public Return (Act 5, Scene 1):** He enters as Duke, exits as Friar, re-enters as Duke. He controls the epistemic landscape. No one else knows the full truth. Standing often requires a shared moral community; Vincentio creates an information asymmetry that makes genuine moral address impossible.
  5.  **The Lucio/Angelo Verdicts (Act 5, Scene 1):**
      *   **Angelo:** Confesses to intent and attempted coercion. Pardoned because the act wasn't consummated (thanks to Vincentio) and because Mariana pleads.
      *   **Lucio:** Punished (whipping/marriage) for "slander." His crime was speaking the truth about Vincentio's absence and character to the Friar (who was Vincentio).
      *   **The Mismatch:** Angelo is a would-be murderer/adulterer; Lucio is a gossip who told the truth. Why is the punishment inverted relative to moral gravity?

  ***

  ### The Argument: Custodial Standing and the Sovereign Exception

  The central philosophical tension in *Measure for Measure* is not whether Angelo has standing (he clearly doesn't; he is the textbook hypocrite), but whether Vincentio retains *custodial standing* after rendering himself morally complicit and officially absent.

  **1. Custodial Standing vs. Moral Standing**
  In the literature, a distinction is often drawn between *moral standing* (the right to blame based on shared moral norms) and *institutional standing* (the right to enforce based on a role). Vincentio attempts to decouple these. He knows his methods (deception, manipulation) are morally dubious, but he relies on his office to validate the final judgments.

  The play suggests that Vincentio *does* keep his custodial standing, but not because he fulfilled the job description. He keeps it because he treats the custodial role as an extension of his personhood, not a contract he can breach. By abdicating publicly but retaining power privately, he creates a "sovereign exception." He is the law, even when he is not the enforcer. Philosophically, this is a collapse of the distinction between the *office* and the *officer*. If standing is truly custodial, it should be tied to the faithful execution of the duty. Vincentio executes the duty through deception. The play argues that the *source* of the standing (Divine Right/Sovereignty) outweighs the *manner* of its execution.

  **2. The Lucio/Angelo Mismatch: Selective Blame or Hypocrisy?**
  You ask if the mismatch is better seen as unfair, selective blame between moral equals, or if the play collapses this distinction.

  *   **The Philosophical Distinction:** *Hypocrisy* is blaming for a fault you share. *Selective Blame* is blaming A for X while letting B off for X. Usually, selective blame is unfair unless there is a relevant difference between A and B.
  *   **The Play's Logic:** The play refuses to treat them as moral equals. Angelo is judged on *intent* mitigated by *outcome* (no sex occurred). Lucio is judged on *speech* against the *sovereign*.
  *   **Does the Distinction Survive?** No, the play collapses it. Vincentio punishes Lucio not because Lucio is morally worse than Angelo, but because Lucio challenged the *source* of Vincentio's standing. Lucio's "slander" was claiming the Duke was absent or corrupt. Since Vincentio's standing relies on his omnipresence and moral superiority, Lucio's truth-telling is an existential threat to the standing itself.
  *   **The Verdict:** This is not selective blame between equals; it is the suppression of a threat to authority. However, from the perspective of the *blame debate*, it functions as unfair selective blame. Vincentio blames Lucio for "lying" about the Duke, while Vincentio himself lied to everyone about his presence. If we view them as members of a moral community, Vincentio is hypocritical (blaming for lies while lying). But Vincentio places himself *outside* the community. He is not a moral equal to Lucio. The play collapses the distinction by asserting hierarchy trumps moral equality.

  **3. The "Because He's the Duke" Concession**
  Where does Shakespeare answer "yes, he keeps it" just because he's the Duke? It happens in the final scene. When Vincentio reveals himself, the other characters immediately submit. Isabella kneels. The provost obeys. The philosophical concession here is that **authority generates standing ex nihilo.**

  Vincentio's deception (the bed trick, the friar disguise) should, in a robust moral framework, void his standing to blame Angelo for coercion or Lucio for slander. He coerced Mariana (by using her) and slandered himself (by hiding). Yet, the play resolves this not by Vincentio admitting fault, but by him dispensing mercy. He pardons Angelo. This is crucial. He avoids the hypocrisy of punishing Angelo for a crime he (Vincentio) facilitated by simply wiping the debt clean.

  However, he does *not* pardon Lucio. This reveals the limit of the concession. He can forgive the sexual transgression (which he manipulated) but not the verbal transgression (which challenged his authority).

  **Should Theory Refuse This?**
  Yes. A philosophical theory of blame should refuse the concession that *power* confers *standing*.
  *   **Standing** implies a moral right to hold another accountable.
  *   **Power** implies the capacity to enforce consequences.
  Vincentio has power, but his standing is corrupted by his manipulation. If we accept Vincentio's standing, we accept that custodial roles are immune to moral critique from below. We accept that the "Custodian" is not bound by the norms they enforce. This leads to a theory of blame where the blamer is unaccountable. A robust theory of blame requires that the blamer be subject to the same norms, or at least that their violations of those norms diminish their authority to blame. Vincentio's violations should diminish his standing, but the play restores it by fiat.

  ***

  ### Settled vs. Contested in the Literature

  To situate this argument within the broader philosophy of blame:

  **What is Generally Settled:**
  *   **The Hypocrisy Intuition:** There is broad agreement that hypocrisy (blaming while guilty of the same fault) undermines standing. If Vincentio had committed fornication and then blamed Claudio, the consensus is he would lack standing.
  *   **The Distinction between Blame and Punishment:** Philosophers generally agree that one can have the *power* to punish (institutional authority) without the *standing* to blame (moral authority). Vincentio conflates these, but the analytical distinction remains solid in the literature.
  *   **Waiver:** It is settled that one can waive standing by consenting to a norm violation. (Not directly applicable here, but part of the baseline).

  **What is Contested:**
  *   **The "Clean Hands" Requirement:** Is it contested whether a custodian needs *perfect* moral hands to enforce norms? Some argue that police or parents retain standing despite personal flaws (the "role" argument). Others argue that deep complicity (like the Bed Trick) voids standing regardless of role. *Measure for Measure* sides with the "role" argument, but only because the role is sovereign, not bureaucratic.
  *   **Deception and Standing:** It is highly contested whether deception voids standing. If I lie to you to catch you in a crime, do I have standing to blame you? Vincentio says yes. Many moral philosophers argue no, because blame requires a relationship of honesty.
  *   **Selective Enforcement:** Is selective blame always unfair? Some argue discretion is necessary for justice (mercy). Others argue it undermines the norm itself. The play argues discretion is the privilege of the Sovereign.

  **Debatable Readings of the Play (Flagged):**
  *   *The Bed Trick as Complicity:* I am arguing that Vincentio is complicit in the sexual deception. A counter-reading is that he is purely a savior, facilitating a marriage that was already contractually binding (Mariana/Angelo). If you take the latter view, his hands are cleaner, and his standing is less compromised. I lean on the former (complicity) to stress-test the blame theory.
  *   *Lucio's Slander:* I am treating Lucio's comments as truth. A traditionalist reading might argue Lucio exaggerated or maligned the Duke's *intent*, making it actual slander. I am assuming the text supports Lucio's accuracy regarding the Duke's absence and behavior.
  *   *Vincentio's Motivation:* I am treating Vincentio's actions as a consolidation of power. A charitable reading is that he is a benevolent educator teaching Vienna a lesson. If he is purely benevolent, his standing might be preserved by "good intentions." I argue that intentions do not restore standing lost through deception.

  ### Conclusion

  *Measure for Measure* ultimately argues that custodial standing is resilient to moral failure *if* the custodian is the Sovereign. Vincentio keeps his standing not because he is blameless, but because he is the source of the law. The Angelo/Lucio mismatch is not a failure of the play's logic, but a revelation of its political theology: you may blame the law-breaker (Angelo), but you cannot blame the law-giver (Lucio blaming the Duke).

  For the philosophy of blame, this is a warning. The play demonstrates how easily "custodial standing" can be weaponized to insulate authority from moral reciprocity. If we accept Vincentio's standing, we accept that the right to blame is a property of rank, not moral community. The theory should refuse this: standing must be reciprocal. If Vincentio lies to his subjects, he forfeits the standing to demand truth from them. The play's resolution is a political restoration, not a moral vindication.
