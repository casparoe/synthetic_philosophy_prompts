  3.  **Philosophical Landscape (Settled vs. Contested):**
      *   *Settled:* Hypocrisy generally undermines standing (the "tu quoque" intuition). One cannot blame for a fault one shares.
      *   *Contested:* *Why* does it undermine standing? Is it a waiver of rights? Is it about fairness (selective enforcement)? Is it about the moral quality of the blamer?
