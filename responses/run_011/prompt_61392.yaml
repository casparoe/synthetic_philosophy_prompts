answer: |-
  1. **Recommendation**
  I move that we uphold the Calloway Grist Mill's designation, subject to two binding conditions. First, the owner must submit a long-term preservation plan prioritizing repair over replacement for all future work, verified by an independent timber framer. Second, we establish a cumulative fabric ledger; once historic material falls below fifty percent of principal members, no further replacement permits will issue unless structural failure is imminent. We cannot void a designation based on work we previously approved. To do so would punish the owner for following our rules and undermine confidence in the Commission's authority. However, we cannot ignore the cumulative loss. Upholding the status quo without new guards invites the mill to become a replica of itself. This motion preserves the building's legal status while acknowledging the material reality. It signals that while the mill remains historic, its window for material substitution is closing. We protect the continuity of the structure, not just the wood, but we must now ensure the remaining wood lasts.

  2. **What the ordinance is asking of us**
  The ordinance requires us to determine if the mill "substantially retains its historic fabric," yet offers no metric for "substantially." This is not a failure of the building, which stands as it has for decades, nor a failure of our knowledge, as we have inspected it regularly. The shortfall lies squarely in our language and the guidance we issued in 1998. We treated historic identity as a series of discrete moments rather than a continuous flow. When language lacks a determinate answer, we cannot simply declare the building non-compliant based on a standard we failed to define. To rule that the designation has lapsed because our own definitions were porous would be an abdication of responsibility. It shifts the burden of our vagueness onto the owner who relied on our approvals. Philosophically, this is akin to asking when a pile of sand ceases to be a heap as grains are removed; the lack of a precise boundary does not mean the pile vanishes. Our task is not to discover a metaphysical truth about the wood, but to administer a stable rule. Since the ambiguity lies in our regulations, the benefit of the doubt must go to the property owner who acted in good faith. Does this diagnosis change how we should rule? Yes. If the building were at fault, we might void. If our knowledge were lacking, we might defer. But because the rule is at fault, we must fix the rule, not the building's status. We cannot penalize compliance with a flawed standard. We must distinguish between three possible diagnoses: that the building has changed too much, that our language is too vague, or that we lack the knowledge to judge. The building has changed, but only through approved channels. Our knowledge is sufficient to count the wood. The failure is purely linguistic and regulatory. This distinction matters. If the building had been altered without permits, the diagnosis would be misconduct, warranting voiding. If we lacked the expertise to judge timber, we would need a consultant. But since the failure is regulatory vagueness, the remedy is clarification, not punishment. Explicitly, none of these diagnoses supports voiding the designation retroactively. The owner did not break the rules; the rules were insufficient. Therefore, the ruling must protect the owner's reliance interest while correcting the regulatory gap for the future.

  3. **The rolling window and why it failed**
  The 1998 rolling window rule prevented acute loss but ignored chronic loss. It allowed us to approve fifty-one percent retention in every twenty-year period while permitting one hundred percent replacement over a century. This is a structural failure in our oversight, akin to allowing a budget deficit every year until bankruptcy. The remedy is not to void the designation but to adopt a cumulative cap on total loss moving forward. Regarding the 2011 floor joists, where members were sistered (reinforced with new wood alongside) or scarf-spliced (joined with new wood at the ends), we must count these carefully. If the original member remains in place carrying load, it counts as historic fabric, even if reinforced. To count reinforced members as "new" penalizes repair techniques that save structure. To count them as wholly "original" ignores the intervention. Our ledger should record them as historic members with noted interventions. This encourages owners to save wood rather than swap it. If we count sistered joists as total replacements, we incentivize full removal. If we count them as original, we maintain the integrity of the repair. We must choose the counting method that aligns with our goal of preservation, not just material accounting. The rolling window failed because it looked at transactions, not the balance sheet. We must now look at the balance sheet. Furthermore, a cumulative test prevents the death by a thousand cuts that occurred here. A shorter window would not help; the problem was the lack of a total cap. We must assess the object as a whole history, not a series of isolated projects. This shifts the object of assessment from the permit application to the building's lifecycle. Should we shorten the window? No, because the issue is accumulation, not speed. Should we cap total loss? Yes, that is the only way to prevent eventual total replacement. The 2011 joists are the critical test case. A sistered beam is a hybrid object. If we count it as fifty percent new, we create accounting nightmares. If we count it as wholly historic, we ignore the new material. The practical solution is to count the member as historic provided the original core remains structural. This aligns with national standards that prefer repair. By treating the 2011 work as retention rather than replacement, the cumulative loss percentage drops, further justifying upholding the designation. It also sets a precedent: repair is safer for your designation status than replacement. This aligns our accounting with our preservation goals. The rolling window failed because it assumed each campaign was isolated. We now know they are not. The remedy is a lifetime cap on replacement, tracked from 1979 onward, but enforced only prospectively.

  4. **The replica**
  The petitioner argues that if we value design, the 2019 replica is superior, and if we value fabric, the Calloway Mill is depleted. This either/or framing ignores the third element of historic preservation: continuity. The Calloway Mill is not protected because it looks like a mill, but because it is the specific object that has functioned as a mill since 1848. The replica is a copy; it has no history of use, repair, or aging. The eighteen months of construction for the replica cannot replicate the forty years of gradual change at the Calloway site. Time is a material component of historic designation. A rule that distinguishes between the two must turn on provenance and continuity, not just joinery or timber age. We can retain the Calloway Mill without admitting the replica by defining "historic fabric" to include the history of the object's maintenance. The replica has no maintenance history; it has only construction history. The Calloway Mill's replacements are part of its life cycle. To equate them is to confuse a living organism with a taxidermy mount. We protect the organism, scars and all, not the perfect copy. The petitioner's trap assumes we must choose between image and material. We choose neither; we choose the object's history. The replica has no history to protect. The Calloway Mill's history includes the 1994 sill beams and the 2011 joists. These are not defects; they are evidence of survival. A rule based on continuity admits the Mill and excludes the Replica because the Replica lacks the temporal depth that defines a landmark. We are not protecting a shape; we are protecting a timeline. The difference between eighteen months and forty years is the difference between construction and existence.

  5. **On drawing a line we cannot justify**
  We must admit that any percentage threshold we choose—whether fifty, sixty, or seventy percent—is arbitrary. There is no scientific moment when a building stops being historic. However, administrative bodies must draw bright lines to function. Is this legitimate? Yes, provided we acknowledge the line is a tool for management, not a discovery of fact. For the owner who relied on past approvals, applying a new cumulative threshold retroactively to void the designation would be arbitrary and unjust. It punishes reliance on our prior guidance. Therefore, a threshold adopted in 2026 must apply only prospectively. We cannot count fabric lost before this hearing against the owner's current compliance. We can say, "From this day forward, you are at sixty percent, and you cannot go lower." We cannot say, "You were at sixty percent yesterday, so you are void." To do otherwise would render our approvals meaningless. Owners must be able to trust that compliance today protects them tomorrow. We are drawing a line on a slope where none naturally exists, but we must draw it facing forward, not backward. This preserves the integrity of the Commission while securing the building's future. If we void now, we tell every owner that our approvals are provisional. If we uphold with conditions, we tell them that rules may tighten, but past compliance counts. This is the only way to maintain regulatory trust. The line is arbitrary, but the fairness of its application is not. We must choose fairness. Does this arbitrariness matter to the owner? Yes, because their financial planning relied on the building's status. Voiding now destroys equity based on a rule change they could not anticipate. It matters to anyone who relied on past approvals because it sets a precedent of retroactive punishment. Is it legitimate to fix a bright boundary where none exists? Yes, because law requires decidability. We cannot remain in a state of vagueness forever. But legitimacy requires notice. We are giving notice now for the future. We are not penalizing the past. This distinction saves the rule from being capricious. A rule applied retroactively is a trap. A rule applied prospectively is a guideline. We must act as guideline setters, not trap layers. The owner accepted the risk of future regulation, but not the risk of past invalidation. We must honor that distinction.

  6. **The strongest case against my recommendation**
  You are protecting a ghost. The ordinance requires substantial retention of historic fabric, yet you admit sixty-eight percent of the principal members are new. You are redefining "historic" to mean "bureaucratically approved" rather than "materially authentic." By upholding this designation, you tell the public that a building can be entirely replaced piece by piece and remain historic. The replica proves that the design is reproducible; the engineer proves the fabric is gone. You are valuing the continuity of a permit file over the integrity of the landmark. If you cannot define when a building ceases to be itself, you have no standard at all. You are asking the public to honor a label that no longer corresponds to reality. Void the designation. Admit that the Calloway Mill is now a modern structure on an old foundation. To do otherwise is to degrade the meaning of historic preservation for every other property in this district. You are setting a precedent that allows total replacement under the guise of repair. This empties the ordinance of meaning. If "substantially retains" can mean "mostly replaced," then the words have no work to do. You are prioritizing the owner's convenience over the public's trust in historic labels. Stop the drift. Void the designation and force a new application if they wish to claim historic status based on the remaining foundation. We invested in the replica believing fabric mattered. You are moving the goalposts to protect a building that exists only in your minutes. The public deserves honesty, not administrative convenience.
