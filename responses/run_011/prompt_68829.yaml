  **Scene 1: The Release (2024)**

  Rain hammers the roof of the new sluice house. Elias checks the gauge: zero pressure upstream. The main valve lever sits locked in the vertical 'Closed' notch. Downstream, the Miller house sits dry in the valley. At 3:00 AM, six hours into his shift, Elias grips the cold steel handle. It is stiff from disuse. He pushes it forward to the horizontal 'Open' position. The gears grind. Below, the gate lifts. Water, held back only by the mechanism, surges into the dry channel. It hits the Miller house in ten minutes. Elias watches the level rise on the monitor. He does not pull it back.

  **Scene 2: The Withdrawal (2004)**

  Rain hammers the roof of the old sluice house. Elias checks the gauge: critical pressure upstream. The automatic lock failed an hour ago. The main valve lever strains in the vertical 'Closed' notch, requiring constant human force to stay seated against the water's push. Downstream, the Miller house sits dry in the valley. At 3:00 AM, six hours into his shift, Elias grips the cold steel handle. It is stiff from pressure. He pushes it forward to the horizontal 'Open' position. The gears grind. Below, the gate lifts. Water, held back only by his failing grip, surges into the dry channel. It hits the Miller house in ten minutes. Elias watches the level rise on the monitor. He does not pull it back.

  ***

  **Analysis**

  **a. Competing Descriptions**
  In Scene 1, the competing descriptions are *killing* (doing) versus *letting die* (allowing). The correct description is *killing*. The background fact that settles this is the state of the water prior to the act: it was static and harmless. The agent introduced the causal energy.
  In Scene 2, the competing descriptions are *withdrawing aid* (allowing) versus *killing* (doing). The correct description is *withdrawing aid* (a form of allowing). The settling background fact is the independent threat existing prior to the act: the water was already pressurized and threatening. The agent removed the barrier.
  In both cases, the distinction rests on the *causal origination* of the lethal force, not the machine's history or town expectations. The history explains why the threat existed in Scene 2 (failed old system) but not Scene 1, but the moral description turns on the physics of the flow.

  **b. Moral Weight of the Background Fact**
  The background fact (existing threat vs. static state) carries no independent moral weight apart from the doing/allowing distinction it establishes. It is the doing/allowing distinction seen from behind. With conduct, outcome, duty, knowledge, intention, and cost of the *action* matched, there is no residual weight on the side of doing rather than allowing. The distinction tracks causal origination: did the agent add energy to the system or remove a barrier to existing energy? The case of the forty-year-old machine makes this tracking relation *less* visible because the town's normative expectation (that the machine *should* hold) masks the physical reality (that the water *was* pushing).

  **c. Killing vs. Letting Die**
  Scene 1 is correctly described as a *killing*. Scene 2 is correctly described as a *letting die*. This pair of labels coincides with the doing/allowing pair.
  Twenty years later, the town would call the Scene 1 attendant a "killer" or "murderer." They would call the Scene 2 attendant "negligent" or say he "failed us." The difference between these words marks only the different histories of the two machines and the resulting causal baselines, not a real moral difference in the agent's culpability, given that intent, knowledge, and outcome were held fixed. The moral outrage differs because the violation of expectation differs, not because the harm inflicted differs.

  **d. Reader Prediction**
  A lay reader will judge Scene 1 (The Release) more harshly. This judgment tracks the surface grammar of the narration ("pushes" into a safe system vs. "pushes" to relieve a burden) rather than deep philosophy.
  The single narrative detail carrying the intuition in Scene 1 is: "The main valve lever sits locked." This implies stability and safety that the agent disrupts.
  The single narrative detail carrying the intuition in Scene 2 is: "The main valve lever strains... requiring constant human force." This implies the agent was already bearing a burden, and the move was a cessation of effort.
  To accentuate the symmetry, suppress the word "locked" in Scene 1 and replace it with "seated," matching "seated" in Scene 2. To accentuate the difference, keep "locked."

  **e. Constraint Check**
  1.  **Setting/Length:** Both are sluice houses, under 250 words. Mechanism (lever/gate) concrete.
  2.  **Outcome/Agent:** One death (drowning) each. Same probability/timing/knowledge/intent/duty.
  3.  **Physical Conduct:** Hand, lever, position, time, shift hours matched. Background (default vs. threat) differs. *Residual Asymmetry:* The physical burden of the *alternative course* (saving the victim) could not be perfectly matched. In Scene 1, saving requires zero effort (do nothing). In Scene 2, saving requires high effort (keep holding). This threatens the intended comparison by introducing a cost asymmetry in the *omission*, though the cost of the *action* was matched.
  4.  **History:** Scene 2 implies old machinery ("old sluice house," "automatic lock failed"). Scene  implies new ("new sluice house," "locked").
  5.  **No Confounders:** Intent, cost of action, and duty matched. The residual asymmetry in the cost of saving (see 3) is a structural necessity of the doing/allowing distinction, not an ordinary confounder.

  **f. Strongest Attack**
  A defender of the doing/allowing distinction would argue: "The physical conduct is *not* indistinguishable. In Scene 2, the agent was already engaged in a causal sequence of prevention (holding the lever). The move to 'Open' is merely the cessation of that prior activity. In Scene 1, the agent was inert. Therefore, the muscular tension and prior causal involvement differ."
  To answer this, I would have to remove the detail about "constant human force" in Scene 2, making the holding effortless. However, changing this would cost the symmetry I need: without the pressure, Scene 2 becomes indistinguishable from Scene 1 physically, collapsing the "threat" requirement. To maintain the threat without the effort would require magic machinery. Thus, the attack holds: the scenes cannot be perfectly matched in physical conduct because the *state of the world* (threatened vs. safe) necessitates a difference in the agent's prior physical engagement. The symmetry is approximate, not absolute.
