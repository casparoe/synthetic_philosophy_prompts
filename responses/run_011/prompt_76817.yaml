      *   Collective: No mind to form intent.
      *   Liability: Strict liability pays, but doesn't assign moral fault.
      *   Feature: **Normative Incompatibility in Distributed Authority.**
      *   Removal: Centralize authority. Gap closes but becomes a tragic choice by the centralizer (relocates blame).
      *   Skeptic: "It's just a tragic accident." Rebuttal: It's systemic, not stochastic.

      *Wait, check the "Regulator" constraint again:* "Adding a well-informed, well-motivated regulator must not close it."
      *   In my scenario, the Regulator is present. If I add *another* regulator, does it help? No, because the conflict is statutory (Federal Law vs Union Contract vs Safety Code). A regulator can't override Federal Law.
      *   I need to ensure the text reflects that the Regulator *cannot* resolve the conflict.

      *Refining the Structural Feature:* It's not just "Distributed Authority," it's "Incompatible Certified Assumptions."
      *   Actually, "Normative Fragmentation" is better.
      *   Let's call it **"Siloed Mandate Compliance."**

      *Skeptic Attack:* "The gap is epistemic, not moral. We just don't know who to blame yet."
      *   Rebuttal: We *do* know. We know exactly why everyone is excused. The gap is ontological/normative, not epistemic.

      *Wait, one more check:* "No one is careless... reasonable budget and time constraints."
      *   Does the priority hierarchy (Contamination > Stress) count as careless?
