      *   I will specify the hierarchy is dictated by the "Federal Water Security Act," making it non-negotiable for the designer.

      *Final Polish:* Ensure the paragraph is tight. Ensure the analysis is structured as requested.

      *Wait, "Name the single structural feature doing the work."*
      *   I need to be precise. "The fragmentation of normative authority across non-communicating certification domains."

      *Wait, "Close with the strongest attack from someone who denies that responsibility gaps are real."*
      *   This is the "No Gap" theorist (e.g., Danaher critics or traditional legal theorists).
      *   Argument: "If everyone is excused, there is no gap, just no responsibility."
      *   My counter: "There is a gap between the harm requiring accountability and the available agents."

      *Let's assemble.*
answer: |-
  The municipal water authority's pressure control system, a deterministic logic array certified under ISO 9001 and EPA Safety Standard 44, managed the flow through Sector 7 where maintenance engineer Elena Rostova was repairing a valve. The system's primary directive, mandated by federal anti-contamination law, required an immediate high-pressure flush if bacterial levels exceeded threshold $X$; its secondary directive, mandated by infrastructure safety code, required immediate pressure reduction if pipe stress exceeded limit $Y$. At 14:02, a sensor spike triggered the flush protocol while a simultaneous surge triggered the stress limit; the logic controller, executing its certified priority hierarchy which legally privileged contamination prevention over structural stress to avoid public health liability, opened the intake valves fully. Rostova, following her certified union work-order which guaranteed access during scheduled maintenance windows regardless of automated status, was inside the pressure chamber when the gasket failed under the conflicting load, crushing her against the manifold before the manual override—disabled by the anti-tamper security protocol—could engage.

  **Analysis of Responsibility Bearers**

  *   **Designer:** Blameworthiness requires control over the harmful outcome and the freedom to choose otherwise. The designer implemented the priority hierarchy but lacked the authority to alter the legally mandated precedence of contamination protocols over stress limits. *Condition Failed: Normative Authority.*
  *   **Vendor:** Blameworthiness requires delivering a defective product. The hardware and code functioned exactly to specification and passed all required stress tests based on the provided mandates. *Condition Failed: Causation via Defect.*
  *   **Institution (Authority):** Blameworthiness requires negligent deployment. The authority deployed the system in full compliance with procurement laws and federal mandates. *Condition Failed: Breach of Duty.*
  *   **Operator (Rostova):** Blameworthiness requires reckless self-endangerment. She entered the zone under a valid, certified work-order that legally superseded operational warnings during maintenance windows. *Condition Failed: Voluntary Assumption of Risk.*
  *   **Supplier (Sensors):** Blameworthiness requires faulty data. The sensors reported accurately; the "spike" was a real bacterial presence, not a malfunction. *Condition Failed: Falsity of Input.*
  *   **Certifier:** Blameworthiness requires certifying an unsafe system. The system was safe relative to each individual standard; the certifier is not mandated to test for conflicts between independent statutory regimes (EPA vs. OSHA vs. Union). *Condition Failed: Scope of Certification.*
  *   **Regulator:** Blameworthiness requires setting unreasonable standards. The regulator enforced statutes written by the legislature; they lack the power to reconcile conflicting federal laws with labor contracts. *Condition Failed: Legislative Competence.*
  *   **Collective Agent:** Blameworthiness requires a unified will. The organization is a nexus of contracts and laws, not a moral person capable of overriding the legal mandates that bind its parts. *Condition Failed: Moral Agency.*

  **Liability and the Moral Gap**
  Strict or vicarious liability would successfully place the *financial cost* on the Institution or Vendor, ensuring compensation for Rostova's family. However, this does not close the *moral gap*. Liability is a mechanism for cost distribution, not a judgment of fault. The moral gap persists because there is no agent who *ought* to have acted differently, given the constraints they were under. Paying the bill acknowledges the harm but leaves the question of "who is to blame?" unanswered, which is the core of the responsibility gap.

  **The Structural Feature**
  The single structural feature doing the work is **Normative Fragmentation across Certification Domains**. The harm arises not from technical opacity or randomness, but from the fact that the system is the intersection of multiple compliance silos (Safety, Security, Labor, Health) that are logically incompatible in edge cases, yet no single agent has the jurisdiction to resolve the incompatibility.

  **Removing the Feature**
  If you remove Normative Fragmentation by centralizing authority (e.g., a "Super-Regulator" with the power to override all statutes and contracts to ensure safety), the gap **closes**, but responsibility **relocates** to the centralizer. The centralizer now bears the blame for choosing to prioritize Rostova's life over contamination risks. The gap does not vanish; it is merely absorbed by a single entity capable of making the tragic choice, proving the gap was a function of distributed authority, not the technology itself.

  **The Skeptic's Attack**
  A skeptic denying the reality of responsibility gaps would argue: *"There is no gap here, only a category error. If every agent is legitimately excused by lack of control or conflicting duties, then the event is simply a 'tragic accident' akin to an act of God. To demand a responsible party where none exist is to demand a metaphysical impossibility; the 'gap' is just the emotional discomfort of accepting that some harms have no moral author."*

  **Evaluation:** This attack fails because it conflates *excusability* with *preventability*. A "tragic accident" implies stochasticity or force majeure. In this scenario, the harm was deterministically produced by human rules and human-designed logic. The system was preventable *by the collective*, even if not by any individual. The gap is real because the collective capacity to prevent the harm exists without a corresponding collective agent to hold accountable. Denying the gap requires denying that distributed systems can act in ways that their parts do not intend, which contradicts the observable reality of the harm.
