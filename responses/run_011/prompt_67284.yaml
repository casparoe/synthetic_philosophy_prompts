  **The Revocable Self: Autonomy, Identity, and the Conditional Advance Directive**

  The standard debate regarding advance directives (ADs) in dementia care is often characterised as a stalemate between two moral intuitions. On one side stands the principle of precedent autonomy, championed by Ronald Dworkin, which holds that a competent person's critical interests possess narrative integrity that survives incompetence. On the other stands the welfare-based critique, associated with Rebecca Dresser, which argues that moral status belongs to the experiencing subject currently in the bed, whose interests may contradict the prior directive. Usually, these positions are irreconcilable: either the past self rules, or the present self matters. However, the case presented here—a directive containing a self-voiding clause contingent upon the patient's future contentment—offers a way to dissolve rather than resolve this conflict. This essay argues that the clause should be honoured and antibiotics administered. To do otherwise is not to protect the author's autonomy, but to violate the specific conditions under which she granted her prior self authority.

  The first objection to consider is logical coherence. The son's position implies that a directive cannot simultaneously be binding and self-cancelling; he treats the document as a standard Ulysses contract, where the point is precisely to prevent future revision. However, this conflates rigidity with authority. A Ulysses contract binds the future self *against* their future wishes. The clause in this case does not do that; it binds the future self only *unless* a specific condition (contentment) is met. Logically, this is not a paradox but a conditional instruction, akin to a will that bequeaths assets 'unless the beneficiary is married', at which point the assets pass elsewhere. It is settled in legal and ethical theory that agents can issue conditional commands. The controversy arises not from logic, but from whether a competent self can validly predicate their moral authority on the emotional state of an incompetent successor. By drafting this clause, the woman acknowledged the Dresser objection before it could be raised. She conceded that her critical interests were contingent on her continued identification with them. Therefore, treating the directive as rigid ignores the text's own internal logic. The directive is not self-contradictory; it is self-limiting.

  This leads to the second issue: identity and precedent autonomy. The standard identity-based objection to ADs suggests that the person with dementia is sufficiently different from the person who wrote the directive that the earlier self's rights do not transfer. This is a contested metaphysical claim; some argue psychological continuity is broken, others that it is not. However, this case short-circuits the metaphysics. It does not matter whether the woman in the day centre is numerically identical to the woman who wrote the document, because the author herself conceded the point. She effectively stated: 'If the person who emerges is no longer troubled by my values, my values no longer govern.' This transforms the ethical landscape. Usually, respecting precedent autonomy requires overriding current experiential interests. Here, respecting precedent autonomy *requires* satisfying current experiential interests, because the prior self made that satisfaction a condition of the directive's validity. To ignore the clause is to privilege the *refusal* of treatment over the *conditions* of the refusal. It assumes the author's primary wish was death, whereas the document suggests her primary wish was integrity—a integrity that included an exit strategy for happiness. This is not a minority view in the literature; rather, it is an under-explored implication of the autonomy principle itself. If autonomy is the right to shape one's life, it must include the right to determine when one's past shaping stops.

  The third hurdle is practical agency: who decides if the condition is met? The patient lacks capacity to confirm she is content; she cannot ratify the clause's activation. This delegates the decision to the surrogates (the daughter and son). Critics might argue this renders the clause empty, as it replaces the patient's voice with the family's interpretation of 'cheerfulness'. This is a genuine risk. However, it does not make the clause void; it changes the surrogate's role from mere messenger to evaluator of fact. Under the UK Mental Capacity Act 2005, surrogates must act in the patient's best interests, considering past wishes. Here, the past wish is explicitly to treat her as 'the person she has become' if she is content. The surrogates are not asked to guess what she would want regarding pneumonia; they are asked to assess her current state against the clause's criteria: Is she troubled? Is she warmly attached? The evidence provided—singing, greeting her daughter with pleasure, lack of distress—suggests the condition is met. This shifts the substituted judgement standard. Usually, substituted judgement asks: 'What would the old self choose?' Here, it asks: 'Does the new self meet the old self's criteria for independence?' This is a contested application of surrogate decision-making, as it requires surrogates to assess subjective welfare rather than objective medical benefit. Yet, it is preferable to the alternative, which forces surrogates to ignore visible welfare in favour of a written text that explicitly says it should be ignored in this scenario.

  Therefore, the verdict must be to administer antibiotics. To withhold treatment is to treat the advance directive as a dead hand controlling a living body, contrary to the instructions of the hand that wrote it. The son's fear—that this is a betrayal of the person who wrote it—is misplaced. The betrayal would be to treat the author as a tyrant who demanded her past values crush her future happiness, when she explicitly wrote that they should not. The clause validates the present self's welfare by the authority of the past self's consent.

  However, this verdict rests on precise conditions. It relies on the surrogates' assessment of 'contentment' being robust and not merely a projection of their own desire to keep her alive. If the patient were merely chemically placated or superficially cheerful but internally distressed (were such a thing knowable), the clause might not be triggered. Furthermore, this argument holds only because the clause was drafted competently and specifically. A vague wish to 'be happy' would not suffice. But in this case, the specificity of the clause (no longer troubled by losses, warmly attached) allows for evidentiary verification.

  In conclusion, the self-voiding advance directive is not a logical failure but a sophisticated ethical instrument. It reconciles the tension between critical and experiential interests by allowing the critical interests to define the boundaries of their own authority. Honouring the clause does not undermine the authority of the earlier self; it fulfils it. The daughter is correct: the document is void, and the patient should be treated. To do otherwise is to honour the shadow of the woman she was at the expense of the woman she is, in direct contradiction of the bridge she built between them.

