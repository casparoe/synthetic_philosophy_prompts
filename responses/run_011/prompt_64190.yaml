answer: |-
  **Diagnostic**

  I will weight the third disagreement (Action under uncertainty) most heavily. The facts are empirically resolvable but slow; the value conflict is philosophical and likely irreconcilable in two days. The decision memo, however, is due this quarter. Focusing on action forces the room to operationalize their disagreement rather than resolve it.

  Vulnerable sentences: The description of the drowned arthropods may be read as an accusation of negligence against the restorationists. The critique of the bird metric may be read as welfare imperialism by the conservationists. Both are necessary risks to make the case plain.

  Deliberate omissions: I will not propose a specific framework for weighing lives against ecosystems. I will not ask the tribal representatives to mediate. I will not suggest that welfare metrics are the only valid ones. This preserves the space for the concession and prevents the speech from becoming a policy prescription it cannot support.

  ***

  **Opening Address**

  Good morning. You know why you are here. The convener wants a list of research questions we can all agree are worth funding. Nobody expects this to work. I was invited because I am not in either camp. I have written admiringly about habitat restoration. I have also written, unforgivably to some, about what restoration costs the animals who are already there. I am not a professor. I am a reporter. I have a view, which is that this question is real and that most of the people I work with have never seriously entertained it. I will state that once, and then get out of the way.

  I want to put a specific case in the center of the room. I reported this. Use the details exactly as I give them. A coastal land trust in the Pacific Northwest breached a dike and returned about three hundred acres of diked farmland to tidal marsh nine years ago. Before the breach, the project's soil ecologist estimated that the fields held on the order of two hundred million arthropods and several thousand voles; she now thinks that figure was conservative. Essentially all of them drowned or were displaced in the first winter. Nine years on, the trust's headline success metric is nesting pairs of a target marsh bird: four before the breach, sixty-one last spring. The trust's own ornithologist told me that in a good year roughly three-quarters of those nests fail, mostly to predation and flooding, and that most of the chicks that do fledge die before their first winter. The trust is now deciding whether to breach a second, larger dike on the adjoining parcel. The decision memo quantifies benefits in acres and nesting pairs. It says nothing whatever about the animals in the first parcel's soil, and nothing about the animals the second parcel's soil currently holds.

  Notice what that metric is. It counts animals produced per season at their most visible moment. It is a throughput measure. That is exactly the quantity a welfare-minded person is suspicious of, and I want the speech to notice it without turning the notice into a gotcha.

  If we stay in this room for two days, we will run three distinct disagreements together into one shouting match. We need to separate them. The first is about facts. How many animals are there? How do their lives go? The ecologists here know how hard counting is. The welfare advocates know how hard suffering is to measure. We will not settle this in forty-eight hours.

  The second disagreement is about what counts. Is the value of a marsh exhausted by the welfare of the animals in it? Or do species, processes, and relations carry weight that no sum of individual lives captures? I have written that the costs to individuals are ignored. I will concede this: counting individual lives cannot capture the value of a system that persists beyond them. A wetland that survives a century may justify costs a single season cannot. If I do not say that, I am not telling the truth.

  The third disagreement is about what to do when the first two are unresolved and the second dike decision is due in a quarter. This is where you work. The people who want the second dike breached and the people who think breaching it is a mass harm must both be able to sit through this without feeling insulted. Neither may leave thinking the question went their way.

  There is an objection I expect in the first ten minutes. It is that raising this question at all hands an alibi to people who want to fill in wetlands. If the animals are better off dead, the developer's bulldozer becomes a mercy. State that objection in its strongest form and answer it in a way that is not a suggestion that we stop talking. Here is the answer: Acknowledging harm is not an invitation to cause more. Destruction removes the possibility of improvement. It locks in the loss. We can count the cost without handing the bulldozer the keys.

  I see colleagues from tribal natural resources departments here. This land has prior custodians. I will not ask you to solve history today. I will not invoke Indigenous knowledge as a way out of the dilemma. I will only note that the land remembers what we do to it.

  Your task is not to agree on values. It is to agree on questions. What data would make the decision memo less blind? Can we count the soil animals before the breach? Can we model the suffering of the chicks? Can we quantify the resilience of the marsh without ignoring the voles? The two people who will have to sign a decision memo this quarter need something usable. They need to know what they do not know.

  We are not here to settle the ethics of restoration. We are here to make the costs visible enough that the decision is made with eyes open. If we can do that, the list of questions will write itself. If we cannot, the memo will be signed anyway, and the animals will drown regardless of our silence.

  ***

  **Alternative Opening**

  I know the tone at breakfast. I know the air in this room is already tight. I am not here to calm you down. I am here to make sure that when you shout, you are shouting about different things. We have three disagreements tangled together. If we do not separate them, we will leave with nothing. Let us start by admitting that the silence on this topic has been costly. We can talk about the cost without stopping the work.
