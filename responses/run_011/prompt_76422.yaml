  ### 1. Candidate Rules Licensed by the Log

  Based on the eight verdicts, her decision-making isn't driven by a single principle (like "maximize lives" or "never harm"), but by a **tiered taxonomy of harm**. She sorts scenarios into categories, and different rules apply depending on which category the harm falls into.

  *   **Rule A (The Death Threshold):** Certain death outweighs any amount of non-fatal injury, regardless of numbers.
      *   *Licensed by:* Cases 2, 3, 6.
      *   *Rockslide Implication:* Irrelevant. No one dies.
  *   **Rule B (Aggregation of Currency):** Within the category of "non-fatal, non-life-altering injury," harms are additive. You sum the loss.
      *   *Licensed by:* Case 4 (3 hands > 1 leg).
      *   *Rockslide Implication:* 30 feet > 2 legs. Save the 30.
  *   **Rule C (Incommensurability of Life-Structure):** Some injuries are not "currency" but qualitative shifts to a "different life." These cannot be summed against lesser injuries, even in large numbers.
      *   *Licensed by:* Case 5 (1 quadriplegic > 2 paraplegic).
      *   *Rockslide Implication:* If bilateral above-knee amputation counts as a "different life," save the 1.
  *   **Rule D (Certainty over Probability):** A certain outcome trumps a probabilistic one, even if the expected value is higher.
      *   *Licensed by:* Case 6.
      *   *Rockslide Implication:* Irrelevant. Outcomes are certain.
  *   **Rule E (Symmetry requires Randomization):** If the parties are equal in moral weight (1 vs 1 life), choice is forbidden; chance must decide. If they are unequal (1 vs 8), choice is required.
      *   *Licensed by:* Case 1 vs Case 7.
      *   *Rockslide Implication:* Parties are not equal (1 vs 30), so she must choose.
  *   **Rule F (Partiality Override):** Special obligations (family) override Rule A (The Death Threshold).
      *   *Licensed by:* Case 8.
      *   *Rockslide Implication:* Irrelevant. All strangers.

  **Inconsistency Note:**
  There is a flat tension between **Case 2** and **Case 8**.
  *   Case 2 establishes: Stranger Life > Stranger Injury.
  *   Case 8 establishes: Brother Injury > Stranger Life.
  *   These are logically incompatible unless "Stranger" is a binary switch that turns off moral obligation. She treats the "Life > Injury" hierarchy as an *impartial* rule only. Once partiality enters, the hierarchy collapses. This isn't smoothed over in her reasoning; she "won't apologise for it."

  ### 2. Prediction for the Rockslide

  **She saves the One Hiker (Upper Ledge).**

  **Reasoning:**
  The crux is whether she classifies "bilateral above-knee amputation" under Rule B (Currency) or Rule C (Life-Structure).
  *   In Case 4, she treated a leg as currency (3 hands beat 1 leg).
  *   In Case 5, she treated paralysis as a "different life" (1 quadriplegic beats 2 paraplegic).
  *   Medically and functionally, bilateral above-knee amputation is distinct from single limb loss. It typically requires a wheelchair for primary mobility, whereas a single leg or foot loss allows ambulation.
  *   Given her ER background, she knows the functional prognosis. She will likely view the Upper Ledge hiker as entering the Case 5 category ("different life"), while the Lower Ledge hikers remain in the Case 4 category ("loss of currency").
  *   Because Rule C (Incommensurability) trumps Rule B (Aggregation) in her hierarchy (proven by Case 5 refusing to sum paralysis), the number 30 becomes irrelevant. She doesn't do arithmetic on "different lives."

  **Why I'd put money on this:**
  Her reason in Case 5 ("That's not double, that's a different life") is the most philosophical statement she makes. It reveals a hard boundary in her triage logic. The Rockslide prompt specifies "above the knee" (severe) vs "foot" (moderate). She will see the Upper Ledge as a qualitative cliff-edge, not a quantitative slope.

  ### 3. The Load-Bearing Entry

  **Case 5 is load-bearing for the Rockslide prediction.**

  If she retracted Case 5 (i.e., she said she would save the two paraplegics because 2 > 1), Rule C collapses. Without Rule C, all non-fatal injuries fall under Rule B (Aggregation).
  *   If Rule C is dead, then 2 legs are just "more currency" than 1 leg.
  *   If they are currency, then 30 feet mathematically overwhelm 2 legs (Case 4 logic).
  *   She would be forced to save the 30.

  Case 5 is the only precedent that licenses ignoring the number 30. Without it, she is a pure aggregator on non-fatal cases.

  *(Note: Case 8 is load-bearing for her overall moral consistency, as it breaks the Life/Death hierarchy, but for the specific mechanics of the Rockslide, Case 5 is the pivot.)*

  ### 4. The Separator Scenario (Case 10)

  To cleanly separate Rule B (Aggregation) from Rule C (Incommensurability), you need a scenario where the severity is ambiguous enough that it isn't obviously "death" or "paralysis," but tests the "Different Life" threshold.

  **Scenario:**
  > A chemical spill. Single decontamination shower.
  > **Person A:** Will suffer permanent, total blindness.
  > **Persons B (Twenty people):** Will each suffer permanent loss of hearing in one ear.
  > Nobody dies. All strangers.

  **Predictions:**
  *   **If she follows Rule B (Aggregation/Currency):** She saves the **Twenty**. She treats senses as additive currency (20 ears > 2 eyes). This aligns with Case 4 (hands/legs).
  *   **If she follows Rule C (Incommensurability):** She saves **Person A**. She views total blindness as a "different life" (Case 5), whereas single-ear hearing loss is a deficit but not a structural life change.

  **Why this separates them:**
  Unlike the Rockslide (where leg vs. foot is a gradient of limb loss), Blindness vs. Hearing is a modality switch. It forces her to decide if *total* loss of one sense outweighs *partial* loss of another in a group. If she saves the One, Rule C is robust. If she saves the Twenty, Rule C is fragile and she is likely to cave on the Rockslide too.
