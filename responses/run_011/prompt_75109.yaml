answer: |-
  ### The Agency and Disclosure Protocol (ADP)

  **Philosophical Grounding & Usable Distinctions**
  To make this procedure workable for a non-specialist under time pressure, we must discard metaphysical questions about "soul" or "essence" and technical questions about "detection." We retain only distinctions that affect the reader's relationship to the text and the magazine's covenant with its audience.

  1.  **Kept: Agency of Choice.** (Derived from intentionalist aesthetics). A work is human if the specific sequence of words results from human selection rather than statistical prediction. We are not asking "Is this good?" but "Who chose this?"
  2.  **Kept: Integrity of Disclosure.** (Derived from ethics of communication). Silence on AI use, when the use is substantive, is a breach of trust equivalent to plagiarism.
  3.  **Discarded: Ontological Purity.** We do not ask if the work is "Art." We ask if it fits the magazine's specific claim of authorship.
  4.  **Discarded: Stylistic Detection.** We do not ask "Does this look like AI?" We ask "Does the author claim responsibility for this?"

  **The Masthead Clause Revision**
  Your current clause ("could not have been written by anyone other than the person who wrote it") is metaphysically fragile. For the purpose of this procedure, operationalize it as:
  *"This text bears the specific risks and idiosyncrasies of a single human consciousness making un-optimized choices."*
  AI optimizes for probability; humans optimize for meaning, often at the cost of flow.

  ---

  ### The 15-Minute Procedure

  **User:** First Reader (Steps 1–3) → Editor (Step 4).
  **Time:** 15 Minutes per submission (at shortlist stage).

  **Question 1: The Disclosure Audit**
  *   **Ask:** Does the cover letter or submission notes explicitly state the use of generative AI?
  *   **Sufficient Answer:**
      *   **Yes:** Proceed to Q2.
      *   **No:** Proceed to Q2. (Silence is *not* evidence of guilt, but it removes the benefit of the doubt regarding tool use).
  *   **Termination:** None.

  **Question 2: The Locus of Invention**
  *   **Ask:** Based on disclosure (if any) and textual evidence, where did the generative work happen?
  *   **Sufficient Answer:**
      *   **Structure/Plot/Character:** (e.g., "I brainstormed ideas with AI"). → **Flag for Editor.** (High risk of non-agency).
      *   **Surface/Prose/Grammar:** (e.g., "I used it to check spelling/smooth sentences"). → **Proceed to Q3.**
      *   **Undisclosed but Suspected:** (e.g., Text is perfectly fluent but lacks specific friction). → **Proceed to Q3.**
  *   **Termination:** If **Structure/Plot/Character** is AI-generated → **REJECT**. (The author is a curator, not a writer, per the masthead).

  **Question 3: The Friction Test**
  *   **Ask:** Are there moments in the text where the writing takes a risk, lingers inefficiently, or makes a specific choice that a probabilistic model would likely smooth over?
  *   **Sufficient Answer:**
      *   **Yes:** (e.g., unusual syntax, specific local knowledge, emotional inconsistency that serves character). → **Proceed to Q4.**
      *   **No:** (e.g., The prose is uniformly competent, transitions are seamless, metaphors are conventional). → **Escalate to Editor.**
  *   **Termination:** If **No** AND **No Disclosure** → **Escalate to Editor** (Request draft history).
  *   **Termination:** If **No** AND **Disclosure of Prose Smoothing** → **Escalate to Editor** (Masthead conflict).

  **Question 4: The Masthead Verification (Editor Only)**
  *   **Ask:** Given the answers above, does this piece validate our claim that this writing comes from *this* specific human?
  *   **Sufficient Answer:**
      *   **Human Agency Confirmed:** (Drafts exist, or disclosure shows tool use was minor/grammatical). → **ACCEPT.**
      *   **Agency Ambiguous:** (No drafts, no disclosure, high polish). → **REJECT.** (Error cost: Losing a human piece. Benefit: Protecting magazine trust).
      *   **Agency Outsourced:** (Disclosure confirms prose was AI-smoothed). → **REJECT.** (Violates the "Unique Voice" operationalization).
  *   **Termination:** Final Decision.

  ---

  ### Failure Modes & Error Costs

  **1. The False Negative (Rejecting Human Work)**
  *   **Scenario:** A human writer produces a polished draft, discloses nothing, and cannot produce early drafts (e.g., wrote in head, or lost files).
  *   **Cost:** The writer is discouraged; the magazine loses a good story.
  *   **Why Absorb This:** In a trust economy, false negatives are less damaging than false positives. A reader who suspects a story is fake will stop reading the magazine. A writer who is rejected can submit elsewhere.

  **2. The False Positive (Accepting AI Work)**
  *   **Scenario:** An author lies about disclosure, or uses a model so subtly the Friction Test fails to catch it.
  *   **Cost:** Erosion of the magazine's brand. If discovered later, it invalidates the masthead claim.
  *   **Why Avoid This:** This is the existential threat. The procedure prioritizes catching this over catching every human piece.

  **3. The "ESL Penalty" (Systemic Bias)**
  *   **Scenario:** Non-native speakers using tools to reach fluency are flagged as "lacking friction."
  *   **Cost:** Excluding marginalized voices.
  *   **Mitigation:** The procedure distinguishes between *Grammar* (Acceptable) and *Prose Smoothing* (Rejectable). However, the line is thin. We accept the risk of rejecting some ESL work to maintain the "Unique Voice" standard, as "smoothness" is often the hallmark of model homogenization.

  ---

  ### Application to Cases

  #### Case (a): Polished, No Disclosure, Indistinguishable from Model
  *   **Q1 (Disclosure):** No.
  *   **Q2 (Locus):** Unknown.
  *   **Q3 (Friction):** No (Unusual polish implies low friction).
  *   **Q4 (Verification):** Editor requests draft history/notes.
      *   *Constraint:* We cannot accuse. We ask for "process notes."
      *   *Outcome:* If contributor provides notes showing human iteration → **ACCEPT**. If contributor is silent or provides generic answers → **REJECT**.
  *   **Result:** **Escalate/Reject.** (Aligns with caution).

  #### Case (b): ESL Contributor, Discloses "Smoothing Every Paragraph"
  *   **Q1 (Disclosure):** Yes.
  *   **Q2 (Locus):** Surface/Prose. (Passes Q2).
  *   **Q3 (Friction):** No. (By definition, "smoothing every paragraph" removes friction/idiosyncrasy).
  *   **Q4 (Verification):** The disclosure confirms the prose was normalized by a statistical model.
  *   **Result:** **REJECT.**
  *   **Conflict:** This contradicts your preference to print (b).
  *   **Reason for Override:** The procedure enforces your masthead. If every paragraph is smoothed by a model, the prose *could* have been written by anyone with access to that model and the prompt. It violates the operationalized clause: *"This text bears the specific risks and idiosyncrasies of a single human consciousness."* You may wish to print (b) for inclusivity, but the procedure identifies that doing so requires changing the masthead, not just bending the rule. The tool has moved from "spellcheck" (human voice remains) to "co-author" (voice is averaged).

  #### Case (c): Likely AI-Generated, Best in Pile
  *   **Q1 (Disclosure):** No (Prompt says "reason to believe," implies no disclosure).
  *   **Q2 (Locus):** Suspected Structure/Prose.
  *   **Q3 (Friction):** No (High polish, "best thing" often implies high coherence/low risk).
  *   **Q4 (Verification):** Editor requests process notes.
      *   *Scenario:* If they admit AI generation → **REJECT** (Violates Locus of Invention).
      *   *Scenario:* If they lie/claim human → **REJECT** (Breach of Trust/Disclosure Integrity).
  *   **Result:** **REJECT.** (Aligns with your preference).
  *   **Note:** Even if it is the "best" aesthetically, it fails the *provenance* requirement. Publishing it would turn the magazine into a gallery of curated outputs rather than a publisher of authors.

  ---

  ### Limitations: What This Procedure Cannot Do

  1.  **It Cannot Measure "Soul":** This procedure cannot determine if a piece is "moving" or "true." It only determines if the *chain of agency* is unbroken. A human-written piece can be terrible; an AI piece can be moving. This procedure filters for origin, not quality.
  2.  **It Cannot Protect Against Sophisticated Lying:** If an author generates a story, then rewrites it by hand to introduce "friction," this procedure will clear it. This is the "False Positive" failure mode. You must accept that some AI work will pass if the human labor of revision is sufficient to reclaim agency.
  3.  **It Cannot Resolve the Masthead Contradiction:** As seen in Case (b), the procedure exposes a conflict between your desire to be inclusive (printing ESL writers using tools) and your masthead's claim of unique human voice. The procedure forces this into the open; it does not solve it. You will have to decide if "Unique Voice" is worth excluding writers who need tools to access it.

  **Final Instruction:** When the procedure escalates to you (Step 4), do not ask "Did you use AI?" Ask "Can you show me the evolution of this specific sentence?" If the evolution is human, the tool is irrelevant. If the evolution is a prompt log, the author is a director, not a writer. Publish the writers.
