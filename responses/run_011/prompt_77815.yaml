answer: |-
  Here's a breakdown you can paste. It disentangles the slogan into three distinct technical claims.

  ***

  **Re: "Everyone counts for one"**

  That motto (Bentham's) is being doing a lot of heavy lifting here. In social choice theory, that sentence is ambiguous. Here are the three distinct readings of what "counts for one" actually means, and how they handle the "intense person" hypothetical:

  **1. Equal Weighting (The Standard Utilitarian View)**
  *   **Claim:** In the social welfare function, every person's utility gets a weight of 1. ($W = \sum U_i$).
  *   **Status:** **Defensible.** This is the standard interpretation.
  *   **The "Intense Guy":** **Does NOT rule him out.** If his capacity for pleasure/pain is genuinely 100x ours, his $U_i$ is larger. Equal *weight* $\neq$ equal *utility*.
  *   **Assumption:** Assumes we *can* compare utilities (Interpersonal Utility Comparisons), but does **not** assume equal capacity.

  **2. Headcount Maximization**
  *   **Claim:** We maximize the number of people helped, regardless of intensity.
  *   **Status:** **Substantive but not Utilitarian.** This is an Egalitarian or Prioritarian view disguised as Utilitarianism.
  *   **The "Intense Guy":** **Rules him out.** Favors spreading the pot to more heads over deeper impact on fewer.
  *   **Assumption:** Quietly assumes everyone's capacity for welfare is **roughly equal**.

  **3. The Capacity Cap**
  *   **Claim:** No single person can experience more than "one unit" of good/bad.
  *   **Status:** **False.** Empirically incorrect; people vary wildly in sensitivity and intensity.
  *   **The "Intense Guy":** **Rules him out** by definition.
  *   **Assumption:** Assumes **strictly equal capacity** for welfare.

  **The Verdict:**
  Your coworker is using Reading 1 to sound objective, but relying on Reading 2 or 3 to kill the "intense guy" hypothesis. If we are actual utilitarians (Reading 1), we must admit that if one person's stakes are 100x higher, they *should* count for more in the aggregation. The slogan guarantees equal *standing*, not equal *output*.
