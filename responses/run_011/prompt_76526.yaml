answer: |-
  **1. The Logical Space, Before the Cases**

  To map the terrain of the workshop, we define four axis-questions. Each axis represents a point of contention where reasonable experts diverge. Participants will not be asked these questions directly; rather, their answers to the cases in Component 2 will locate them within this space.

  *   **Axis A: The Necessity of Harm.**
      *   *Answers:* (1) A condition can be a disease even if it causes no suffering, disadvantage, or bad outcome. (2) A condition is only a disease if it causes some form of harm or disadvantage.
      *   *Coherence:* Answer (1) is required for Pure Naturalism. Answer (2) is required for Normativism and Hybrid views.
  *   **Axis B: The Source of Normality.**
      *   *Answers:* (1) Normal function is determined by statistical frequency within a specific population and environment. (2) Normal function is determined by the species' evolutionary design or biological goals, regardless of local statistics. (3) Normal function is determined by the individual's ability to pursue their chosen life goals.
      *   *Coherence:* (1) and (2) are incompatible. (3) renders (1) and (2) secondary to subjective capability.
  *   **Axis C: The Authority of Designation.**
      *   *Answers:* (1) Disease status is discovered by investigation (a fact of nature). (2) Disease status is assigned by professional or social consensus (a tool for organization).
      *   *Coherence:* (1) aligns with Realism. (2) aligns with Pragmatism or Institutionalism.
  *   **Axis D: The Stability of Status.**
      *   *Answers:* (1) Disease status is fixed by the biological state at the time of examination. (2) Disease status can change based on future risks or changes in the environment without biological change in the subject.
      *   *Coherence:* (1) is required for strict Biological accounts. (2) is required for Risk-based or Contextual accounts.

  *Collapsing Combinations:*
  *   If a participant chooses Axis A(1) (Harm not needed), Axis C(2) (Consensus) is unstable unless they argue consensus tracks biological facts perfectly.
  *   If a participant chooses Axis B(3) (Life Goals), Axis A(2) (Harm needed) is redundant, as the inability to pursue goals *is* the harm.
  *   If a participant chooses Axis C(2) (Consensus), Axis D(1) (Fixed status) is incoherent, as consensus can change without biological change.

  ***

  **2. Ten Diagnostic Cases**

  **Case 1: The Lead Valley**
  In a remote valley, industrial runoff has contaminated the water for three generations. Every child born there has high blood lead levels; the median for nine-year-olds is twenty micrograms per decilitre. These children score at the local mean on cognitive tests, and there is no unaffected population within the valley to serve as a comparison. They live out normal lifespans for that region.
  *   **A.** This is a disease because the lead interferes with how human bodies are designed to work, even if everyone there has it.
  *   **B.** This is not a disease because it is the statistical norm for that population and causes no relative disadvantage there.
  *   **C.** This is a disease only if the children or their parents feel harmed by it.
  *   **D.** You cannot decide without comparing them to a population outside the valley.
  *(Diagnostic Axis: B — Source of Normality)*

  **Case 2: The Glucose Implant**
  Forty years from now, every infant receives an implant that regulates blood sugar, causing natural insulin production to atrophy. The population median for pancreatic secretion becomes near zero. A child born outside this system retains ordinary pancreatic function but requires no medical help to survive.
  *   **A.** The child with the pancreas has a disease because their organ function deviates from the species standard.
  *   **B.** The child with the pancreas is healthy; the implanted population has altered the baseline for what counts as normal function.
  *   **C.** Neither child has a disease, as both are fully capable of surviving and thriving in their respective environments.
  *   **D.** The child with the pancreas has a disease only if the medical system refuses to treat them without an implant.
  *(Diagnostic Axis: B & D — Source of Normality / Stability of Status)*

  **Case 3: The Engineered Athlete**
  An elite athlete deliberately induces cardiac remodeling and suppresses gonadal function through training and drugs she endorses. She is a statistical outlier on a dozen physiological parameters, reports no complaint, and refuses all intervention.
  *   **A.** She has a disease because her organs are not functioning as human organs are designed to.
  *   **B.** She does not have a disease because she chose this state and it supports her life goals.
  *   **C.** She has a disease because her physiology is statistically rare and risky, regardless of her choice.
  *   **D.** She has a disease, but it is not the business of medicine to treat it.
  *(Diagnostic Axis: A & B — Necessity of Harm / Source of Normality)*

  **Case 4: The Guideline Shift**
  A professional society lowers the numerical cut-point for high blood pressure by ten millimetres of mercury systolic. On that day, roughly one adult in eight acquires a diagnosis; no measurement is repeated and nobody's body changes.
  *   **A.** These people now have a disease because the authorized medical body says they do.
  *   **B.** These people always had the disease; the guideline change merely recognized a pre-existing fact.
  *   **C.** These people do not have a disease; a label changed, but their health did not.
  *   **D.** These people have a disease only if the new cut-point predicts actual harm better than the old one.
  *(Diagnostic Axis: C — Authority of Designation)*

  **Case 5: The Adapted Stroke**
  A woman with hemiparesis following a stroke cannot walk unaided. She has genuinely revised her aims, wants nothing she cannot do, and reports that her life is complete. Contrast this with a person having the same impairment who still desperately wants to walk.
  *   **A.** Both have a disease because the biological impairment is identical.
  *   **B.** Neither has a disease because disease is defined by suffering, which is absent in the first case.
  *   **C.** The first woman does not have a disease, but the second one does, because disease depends on the ability to pursue vital goals.
  *   **D.** Both have a biological condition, but only the second one is "ill" in the sense that matters for care.
  *(Diagnostic Axis: A & B — Necessity of Harm / Source of Normality)*

  **Case 6: The Silent Aneurysm**
  A thirty-year-old has an unruptured intracranial aneurysm expected to rupture around age fifty-five. It produces no symptom and no measurable deficit now, and no available treatment improves her expected outcome.
  *   **A.** She has a disease now because a part of her body is structurally defective and will cause harm later.
  *   **B.** She does not have a disease now; she will only have a disease if and when it ruptures.
  *   **C.** She has a disease only if knowing about it causes her anxiety that requires treatment.
  *   **D.** She has a risk factor, but calling it a disease is a mistake until symptoms appear.
  *(Diagnostic Axis: D — Stability of Status)*

  **Case 7: The Protective Mutation**
  A molecular loss of function is statistically rare and measurably reduces a protein's output, but it confers protection against a lethal endemic infection at no cost to the carrier.
  *   **A.** This is a disease because a biological mechanism is failing to produce its standard output.
  *   **B.** This is not a disease because the overall effect is beneficial for the person's survival.
  *   **C.** This is a disease biologically, but a benefit practically, so the label depends on which doctor you ask.
  *   **D.** This is not a disease because evolution has selected for it in this environment.
  *(Diagnostic Axis: A — Necessity of Harm)*

  **Case 8: The Aging Body**
  A seventy-year-old shows universal decline in renal, cardiac, and immune function. This causes significant harm and impairment, but the health system is officially authorized to treat specific pathologies, not senescence itself.
  *   **A.** This is a disease because it causes harm and impairment, regardless of official authorization.
  *   **B.** This is not a disease because the health system is not authorized to treat it as one.
  *   **C.** This is a natural process, not a disease, even though it causes harm.
  *   **D.** This is a disease, but resources should not be spent on it.
  *(Diagnostic Axis: C — Authority of Designation)*

  **Case 9: The Declassified Pattern**
  A pattern of emotional attraction was listed in the medical manual as a disorder for fifty years. By professional vote, it was removed from the manual. The underlying biology and psychology of the individuals remain unchanged.
  *   **A.** They never had a disease; the original classification was a mistake about the facts.
  *   **B.** They had a disease then, but do not now, because the professional designation constitutes the reality.
  *   **C.** They have a biological difference, but whether it is a disease depends on whether society harms them for it.
  *   **D.** The concept of disease is too unstable to apply to this situation.
  *(Diagnostic Axis: C — Authority of Designation)*

  **Case 10: The High Altitude**
  A lowland visitor travels to high altitude and develops polycythemia (excess red blood cells). A native resident has the same blood count. The visitor becomes ill; the resident functions normally.
  *   **A.** Both have a disease because the blood count is statistically abnormal for the human species as a whole.
  *   **B.** Only the visitor has a disease; the native's count is normal for their environment.
  *   **C.** Neither has a disease unless the blood thickness causes a clot or symptoms.
  *   **D.** Not until you tell me which population and which environment you are comparing against.
  *(Diagnostic Axis: B — Source of Normality)*

  ***

  **3. The Scoring Key**

  Map the participant's answer pattern to the following leaves. A participant "lands" on a leaf if their answers align with the profile in at least 8 of 10 cases.

  **Leaf 1: The Biostatistical Theorist (Boorse)**
  *   **Profile:** Prioritizes species-design and statistical function over harm or consensus. Typically chooses A in Cases 1, 3, 5, 7.
  *   **Worst Case:** Case 7 (Protective Mutation). This view must classify a beneficial, survival-enhancing trait as a disease because the mechanism fails to meet species-typical output, which contradicts the intuitive purpose of medicine.
  *   **Coherence:** Coherent.

  **Leaf 2: The Harmful Dysfunction Analyst (Wakefield)**
  *   **Profile:** Requires both biological failure and negative consequence. Typically chooses A in Case 1, B in Case 7, A in Case 6.
  *   **Worst Case:** Case 1 (Lead Valley). If the entire population is harmed and adapted, it is difficult to establish "dysfunction" without relying on a hypothetical evolutionary design that ignores the current reality, making the view vulnerable to charges of being disguised normativism.
  *   **Coherence:** Coherent.

  **Leaf 3: The Vital-Goals Normativist (Nordenfelt)**
  *   **Profile:** Defines disease by the inability to achieve vital life goals. Typically chooses C in Case 3, C in Case 5, B in Case 6.
  *   **Worst Case:** Case 6 (Silent Aneurysm). This view struggles to classify asymptomatic future risks as disease, potentially delaying preventive care because the subject's current goals are not yet impeded.
  *   **Coherence:** Coherent.

  **Leaf 4: The Two-Level Separatist**
  *   **Profile:** Distinguishes strictly between "pathology" (biological) and "illness" (lived). Typically chooses D in Case 5, A in Case 1, C in Case 3.
  *   **Worst Case:** Case 4 (Guideline Shift). This view must explain why the pathology level remains constant while the illness level shifts, which can create confusion in clinical communication and resource allocation.
  *   **Coherence:** Coherent.

  **Leaf 5: The Institutional Constitutivist**
  *   **Profile:** Believes the profession's remit defines the disease. Typically chooses A in Case 4, B in Case 8, B in Case 9.
  *   **Worst Case:** Case 9 (Declassified Pattern). This view implies that the biological reality of the individuals changed because of a vote, which is ontologically unstable and undermines the scientific authority of the profession.
  *   **Coherence:** Coherent but ontologically fragile.

  **Leaf 6: The Pragmatic Pluralist**
  *   **Profile:** Accepts that different definitions serve different purposes. Typically chooses D in Case 10, C in Case 7, D in Case 5.
  *   **Worst Case:** Case 8 (Aging Body). By allowing multiple valid definitions, this view offers little guidance when the health system must make binary decisions about funding and treatment authorization.
  *   **Coherence:** Coherent.

  **Leaf 7: The Eliminativist Skeptic**
  *   **Profile:** Believes "disease" is not a natural kind and should be abandoned for precise descriptions. Typically chooses D in Case 4, D in Case 9, D in Case 1.
  *   **Worst Case:** Case 6 (Silent Aneurysm). In clinical practice, the binary decision to intervene or monitor requires a categorization; eliminating the concept hinders decision-making protocols.
  *   **Coherence:** Coherent but pragmatically difficult.

  **Leaf 8: Unoccupied (The Subjective Realist)**
  *   **Profile:** Claims disease is entirely determined by the patient's feeling (Case 5 Option B) but also exists independently of minds (Case 9 Option A).
  *   **Status:** **Incoherent.** One cannot hold that disease is purely subjective experience while also claiming it is a mind-independent fact discovered by investigation.
  *   **Reason:** Collapses Axis A and Axis C into a contradiction.

  **Leaf 9: Unoccupied (The Statistical Absolutist)**
  *   **Profile:** Claims disease is purely statistical deviation (Case 1 Option B) but also requires harm (Case 7 Option A).
  *   **Status:** **Unattractive.** If a trait is statistically normal (Lead Valley), it cannot be a disease by this definition, even if harmful. If it requires harm, it is not purely statistical.
  *   **Reason:** Collapses Axis A and Axis B.

  ***

  **4. Separability**

  **Indistinguishable Pair 1: The Biostatistical Theorist (Boorse) and The Harmful Dysfunction Analyst (Wakefield).**
  *   **Why:** On these ten cases, both views often converge because most biological dysfunctions in the set (Lead, Aneurysm, Stroke) also entail harm.
  *   **Distinguishing Case:** A case of **asymptomatic genetic carrier status** that reduces function slightly but never causes symptoms or harm (e.g., a mild enzyme deficiency with no clinical sequelae). Boorse must call this a disease (failure of species-typical function); Wakefield must not (no harm).
  *   **Substantive Disagreement:** They disagree on whether "disease" is a value-free biological category or a hybrid concept requiring a value judgment.

  **Indistinguishable Pair 2: The Institutional Constitutivist and The Pragmatic Pluralist.**
  *   **Why:** Both may endorse the Guideline Shift (Case 4) and the Declassification (Case 9) on the grounds that professional practice dictates the label.
  *   **Distinguishing Case:** A case where **professional consensus fractures** (e.g., two major societies issue contradictory guidelines). The Constitutivist cannot determine disease status without a single authority; the Pluralist accepts both as valid for different contexts.
  *   **Substantive Disagreement:** They disagree on whether the concept of disease requires a unified authority or can tolerate legitimate fragmentation.

  **Indistinguishable Pair 3: The Vital-Goals Normativist and The Two-Level Separatist.**
  *   **Why:** Both distinguish the biological state from the lived experience in Case 5 (Stroke).
  *   **Distinguishing Case:** A case of **severe cognitive impairment where the patient reports happiness** (e.g., advanced dementia with high subjective well-being). The Vital-Goals view may struggle to call this a disease if "vital goals" are defined by the subject's current state; the Two-Level view insists the pathology level remains diseased regardless of reported happiness.
  *   **Substantive Disagreement:** They disagree on whether the subject's current psychological state can override the objective assessment of functional loss.

  **Indistinguishable Pair 4: The Eliminativist Skeptic and The Pragmatic Pluralist.**
  *   **Why:** Both often select the "malformed" or "depends" options (Case 10).
  *   **Distinguishing Case:** A request to **draft legislation** defining disease for insurance coverage. The Pluralist will offer a working definition for that context; the Eliminativist will argue the legislation is fundamentally flawed for using the term at all.
  *   **Substantive Disagreement:** They disagree on whether the concept is salvageable for specific uses or should be discarded entirely.
