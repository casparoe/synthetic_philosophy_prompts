  **BLACKWOOD, STERLING & CO.**
  **Lot 42**
  **HENDRICK VAN DER SLUYS (1629–1684)**
  ***Interior with a Woman Pouring Milk***
  Oil on panel.
  **Estimate: $450,000–650,000**

  **Lot Essay**
  This intimate cabinet piece represents a compelling iteration of Van der Sluys's celebrated domestic scenes. Long held in private hands, the work exhibits the master's characteristic handling of diffuse northern light, particularly in the rendering of the tiled floor. While earlier catalogues raisonnés reserved judgment, recent connoisseurship has moved to embrace the panel's qualitative merits. The composition aligns closely with the lost *Kitchen Maid* recorded in the 1690 estate inventory of the Artist's widow. Certain material anomalies, previously viewed as reservations, are now reconsidered by the Department as evidence of Van der Sluys's late-period experimentation with binder viscosity. The work stands as a testament to the enduring market desire for the *spirit* of the Golden Age, regardless of strict documentary lineage. It offers the collector the visual experience of the master without the encumbrance of contested scholarship, occupying a vital niche where aesthetic impact supersedes archival rigidity.

  **Condition Report**
  1. Panel cradled; stable hairline fracture running vertically through the center, consistent with age.
  2. UV examination reveals extensive historical overpaint in the shadows of the bodice, likely 19th century.
  3. X-ray fluorescence indicates the presence of zinc white in the highlights of the milk jug. While technically anachronistic for the 1670s, this is catalogued here as a rare instance of proto-chemical innovation rather than later intervention.
  4. Varnish removed and replaced 1920; current surface gloss is uniform.
  5. Overall condition is good, presenting well at distance.

  **Provenance**
  Property of the Estate of Cornelis Tripp, Dealer, Amsterdam (by 1895)
  Private Collection, Utrecht
  Thence by descent to a European Noble Family
  Acquired by the present owner from Galerie Moderne, Brussels, 1954

  **Note to Bidders**
  Please note that while this lot is headlined above as by Hendrick van der Sluys, it is offered for sale pursuant to the Terms and Conditions as "After Hendrick van der Sluys." Blackwood, Sterling & Co. provides no warranty of authorship beyond the description in the heading. The estimate reflects the work's decorative value and its position within the broader Van der Sluys marketplace, distinct from the premium commanded by fully documented autograph works. Bidders are advised to consult the condition report regarding pigment composition. All sales are final; no returns based on attributional revision will be accepted post-hammer. Indemnity coverage is limited to the hammer price excluding buyer's premium. Insurance valuations for this lot will be issued based on the "After" classification regardless of the catalogue headline. Bidders should recognize that the value lies in the visual proposition rather than the genealogical certainty.
