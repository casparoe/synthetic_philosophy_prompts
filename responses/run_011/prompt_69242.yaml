answer: |-
  **Final Exam: Metaphysics Seminar**
  **Time Allowed:** 45 Minutes
  **Instructions:** Answer the following question. Be precise.

  **Question:**
  Peter van Inwagen's Special Composition Question (SCQ) asks: *Under what conditions do some xs compose a y?* Standard answers include Nihilism, Universalism, the Life View, and Vagueness. Consider instead the **Signalling View**:

  > *Some xs compose something just in case, over some finite stretch of time, each of the xs is both affected by and has an effect on each of the others, and no segment of those causal chains runs through anything that isn't one of the xs.*

  Critically evaluate the Signalling View as a candidate answer to the SCQ. In your response, you must address:
  1.  Whether the causal requirement constitutes a genuine restriction or if the view collapses into Universalism or Nihilism.
  2.  Whether the clause excluding "outsiders" from causal chains solves the problem of vagueness or introduces a problematic external dependence.
  3.  How the view handles three specific cases: an artifact (a chair), an event/process (a conversation), and scattered parts exchanging signals once a millennium.

  ***

  ### Model Answer

  The Signalling View attempts to ground composition in reciprocal causal influence while barring external mediation. While it offers a precise, non-vague criterion, it ultimately fails as a plausible metaphysics of composition because it renders composition radically extrinsic and collapses toward Nihilism for ordinary artifacts.

  First, does the view collapse? It is certainly not Universalism, as scattered, causally isolated particles will not compose. However, it risks collapsing into a form of Nihilism regarding artifacts. The requirement that *each* $x$ affect *each* other $x$ is stringent. In a solid object, surface atoms may not causally influence distant core atoms directly within a "finite stretch of time" without mediation. If "affect" requires direct signaling, most macroscopic objects fail. If "affect" allows transitive chains, the view relies entirely on the second clause regarding outsiders. Thus, it is a genuine restriction, but likely too restrictive to match common-sense ontology.

  The second clause ("no segment... runs through anything that isn't one of the xs") is the view's engine and its downfall. Van Inwagen argues that vague composition leads to contradiction. The Signalling View avoids vagueness because causal facts are presumably precise; either a chain runs through an outsider or it does not. However, this precision comes at the cost of making composition extrinsic. Whether a set of particles composes an object depends on the environment. If a vacuum separates two particles, they might compose (no outsiders in the chain). If air molecules intervene, the causal chain runs through the air (outsiders), and composition ceases. This makes the existence of objects dependent on the presence of intervening media, which is metaphysically implausible. It solves the vagueness argument not by finding a natural joint in reality, but by making composition sensitive to irrelevant environmental facts.

  This extrinsicness devastates the test cases.
  Consider a **chair**. A B-grade analysis might claim the legs and seat compose a chair because they touch and transmit force. An A-grade analysis recognizes that physical contact is never direct; it is mediated by electromagnetic fields, air, glue, or screws. If the glue or screws are not included in the $xs$, the causal chain runs through an outsider. Consequently, the legs and seat do not compose a chair unless the $xs$ include every mediating particle. This pushes the view toward Nihilism: we rarely designate the exact mediating particles as our $xs$, so artifacts rarely exist.

  Consider a **conversation**. Here, the view has more traction. Two brains ($xs$) exchange sound waves. If we treat the sound waves as part of the $xs$, composition holds. If the sound waves are outsiders, it fails. This highlights the arbitrariness of the $xs$ selection. The view suggests composition is not about the objects, but about how we carve the causal network.

  Finally, consider **scattered parts signaling once a millennium**. The view stipulates a "finite stretch of time." If the signaling event falls within that stretch, they compose. This yields counterintuitive results: two particles could compose an object solely because they exchanged a single photon a thousand years ago, despite being causally isolated now. This violates the intuition that composition requires some ongoing unity or integration.

  In conclusion, the Signalling View succeeds formally in avoiding vagueness but fails materially. By banning external mediation, it makes composition dependent on the environment rather than the intrinsic nature of the candidates. By requiring reciprocal signaling, it either excludes ordinary artifacts (collapsing toward Nihilism) or forces us to include mediating media in our ontology arbitrarily. It is a precise view, but it carves the world at the wrong joints.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Understanding the Signalling View (4 Marks)**
  *   **4:** Clearly distinguishes the two clauses (reciprocal effect + no outsiders). Recognizes the "finite time" constraint.
  *   **3:** Understands the basic definition but misses the significance of the "outsider" clause.
  *   **1-2:** Confuses the view with standard causal theories or misses the reciprocity requirement.
  *   **0:** Fails to engage with the stipulated definition.

  **2. Analysis of Restriction & Collapse (5 Marks)**
  *   **5:** Identifies that while it isn't Universalism, the "no outsider" clause pushes it toward Nihilism for artifacts (due to mediation).
  *   **3-4:** Correctly identifies it as a restriction but fails to see the Nihilistic pressure regarding mediation.
  *   **1-2:** Claims it collapses into Universalism without justification.
  *   **0:** No analysis of collapse.

  **3. Vagueness vs. Extrinsicness (5 Marks)**
  *   **5:** Argues that while it solves vagueness (causal facts are precise), it introduces radical *extrinsicness* (composition depends on the environment/air/glue).
  *   **3-4:** Notes it solves vagueness but fails to identify the cost (external dependence).
  *   **1-2:** Claims it remains vague or ignores the vagueness prompt.
  *   **0:** No mention of vagueness or extrinsicness.

  **4. Application to Cases (6 Marks)**
  *   **The Chair (Crucial Differentiator):**
      *   **A (5-6 marks):** Notes that chair parts are mediated by glue/air/screws. If these are outsiders, composition fails. (Sees the "mediation trap".)
      *   **B (3-4 marks):** Assumes chair parts touch/signal directly and concludes composition succeeds. (Misses the mediation issue.)
      *   **C (1-2 marks):** Irrelevant or incorrect application.
  *   **Conversation/Millennium:**
      *   **A:** Notes the arbitrariness of including/excluding sound waves; notes the counterintuitiveness of single past signals.
      *   **B:** Treats these cases superficially.

  **Grade Boundaries:**
  *   **17-20 (A):** Captures the mediation problem in the chair case; identifies extrinsicness as the cost of precision.
  *   **13-16 (B):** Good understanding, but treats the chair as a straightforward success case; misses the depth of the "outsider" implication.
  *   **9-12 (C):** Basic summary of the view; applies cases without philosophical rigor.
  *   **0-8 (F):** Fundamental misunderstandings.
