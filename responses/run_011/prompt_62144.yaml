answer: |-
  **NOTE ON TERMINOLOGY:** *This puzzle concerns knowledge closure and misleading evidence (Kripke/Harman). It is distinct from the "dogmatism" of perceptual justification (Pryor), which claims seeing that p provides immediate warrant. Do not fuse these views.*

  ### **DIAGNOSTIC TREE: THE DOGMATISM PARADOX**

  **Q1. Does the acquisition of apparent counter-evidence E automatically defeat your prior knowledge of p?**
  *   **YES** → Go to **Q2**.
  *   **NO** (Knowledge Retains) → Go to **Q4**.

  **Q2. What sort of apparent evidence triggers defeat?**
  *   **Any Appearance** → **LEAF 1: Radical Fallibilism**
      *   *Awkward Commitment:* You know almost nothing, because absurd or manufactured evidence is always possible.
  *   **Only Specifiable Evidence** → **LEAF 2: Pre-Commitment Defeasibility**
      *   *Awkward Commitment:* You must be able to predict in advance exactly which future evidence would count against you.
  *   **Only Unspecifiable/Reasonable Evidence** → **LEAF 3: Hindsight Defeasibility**
      *   *Awkward Commitment:* You only know you lost knowledge after you lost it; you cannot plan for defeat.

  **Q4. Is your total evidence constituted solely by what you know (E=K)?**
  *   **YES** → Go to **Q5**.
  *   **NO** (Evidence > Knowledge) → Go to **Q6**.

  **Q5. If E=K, does false apparent evidence E enter your evidence pool once acquired?**
  *   **YES** → **LEAF 4: Inconsistent Evidence Absorption**
      *   *Awkward Commitment:* Rational agents frequently possess logically inconsistent total evidence sets.
  *   **NO** → **LEAF 5: Evidence-Pool Purist**
      *   *Awkward Commitment:* Vivid, misleading experiences count as evidentially inert for you once you know p.

  **Q6. Does the entitlement to ignore misleading evidence apply to *planning inquiry* or *forming belief*?**
  *   **Planning Inquiry** → Go to **Q7**.
  *   **Forming Belief** → Go to **Q8**.

  **Q7. Must you investigate E even if you know it is misleading?**
  *   **YES** → **LEAF 6: Regulative-Only**
      *   *Awkward Commitment:* You know p but are rationally required to waste resources proving what you already know.
  *   **NO** → **LEAF 7: Embrace-it (Full Dogmatism)**
      *   *Awkward Commitment:* You are permitted to ignore looking evidence simply because you currently know p.

  **Q8. Does knowing p require knowing that you know p (KK Principle)?**
  *   **YES** → **LEAF 8: KK-Dependent Retention**
      *   *Awkward Commitment:* Animals and children know p but cannot rationally ignore counter-evidence.
  *   **NO** → Go to **Q9**.

  **Q9. Does rationality require responding to apparent evidence even if known misleading?**
  *   **YES** → **LEAF 9: Rationality Conflict**
      *   *Awkward Commitment:* You know p, but it is irrational for you to believe p once E appears.
  *   **NO** → **LEAF 10: No-KK Dogmatism**
      *   *Awkward Commitment:* You can ignore evidence without knowing that you know, relying on mere factive states.

  ***

  ### **INDISTINGUISHABLE LEAVES**
  *   **Leaf 4 (Inconsistent Evidence) & Leaf 5 (Evidence-Pool Purist):** These are difficult to separate if students equivocate on "evidence." If "evidence" means "what you have to go on," Leaf 5 collapses into Leaf 4.
      *   *Extra Question Needed:* "Can a proposition be part of your evidence if you know it is false?"
  *   **Leaf 9 (Rationality Conflict) & Leaf 10 (No-KK Dogmatism):** Both accept knowledge retention without KK. The split relies on a sharp distinction between *knowledge* and *rationality* that some students may reject.
      *   *Extra Question Needed:* "Is it possible to know p and yet be irrational in believing p?"

  ### **UNOCCUPIED LOGICAL SPACES**
  *The following combinations of answers are logically possible but no leaf occupies them:*

  1.  **Q1=YES (Defeat) + Q4=YES (E=K):**
      *   *Status:* **Incoherent.** If evidence is knowledge (E=K), false apparent evidence cannot be evidence, so it cannot defeat knowledge. Defeasibility usually requires evidence to outstrip knowledge.
  2.  **Q1=NO (Retention) + Q4=YES (E=K) + Q5=YES (False E in Pool):**
      *   *Status:* **Unattractive.** This is Leaf 4, but combined with Retention. If false E enters the pool, and E=K, you now "know" false things, violating factivity. Most who accept this abandon Retention (moving to Q1=YES).
  3.  **Q6=BELIEF + Q8=NO (No-KK) + Q9=YES (Rationality):**
      *   *Status:* **Undefended.** This is Leaf 9. However, the combination of *No-KK* with *Rationality Overrides* is rarely defended as a stable position; proponents usually either accept the conflict (Leaf 9) or deny the rationality requirement (Leaf 10). The empty cell is the view that you *can* know without KK, but *must* follow evidence anyway, without admitting a conflict. (Actually, Leaf 9 occupies this. The empty cell is **Q8=YES (KK) + Q9=YES (Rationality)**).
      *   *Correction:* **Q8=YES (KK) + Q9=YES (Rationality):** If you require KK to use knowledge, but rationality requires following evidence, you can never use knowledge to ignore evidence. This view is **Unattractive** because it makes knowledge practically inert for inquiry planning.

  ### **MOST SORTING NODE**
  **Q1: Does the acquisition of apparent counter-evidence E automatically defeat your prior knowledge of p?**
  *   *Reasoning:* This is the primary intuitive fork. Roughly half the seminar will instinctively feel that "real" knowledge must survive evidence (Retention), while the other half will feel that evidence always trumps prior claims (Defeat). Answers here determine whether the student treats the paradox as a problem about the *nature of knowledge* (Defeat branch) or the *norms of inquiry* (Retention branch).
