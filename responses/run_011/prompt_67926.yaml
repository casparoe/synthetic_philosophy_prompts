  *   **The SE Verdict:** The student concludes SE is better for dysfunction.
      *   **Why I kept it:** In the broad literature, SE *is* the dominant account for biological normativity. I gave credit for knowing the "textbook" conclusion, even though they botched the application to this specific "exaptation" case.

