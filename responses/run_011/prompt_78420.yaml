answer: |-
  Dear Colleague,

  It is always refreshing to see a student attempt to reconstruct a formal argument from first principles rather than simply memorizing the notation, and you have done an admirable job capturing the core tension in Lewis's triviality result. Your reconstruction is essentially sound and mirrors what is often called the simple triviality argument, which relies on the law of total probability applied to the consequent rather than the antecedent. You are right to feel uneasy about the generality of the reasoning, but I believe your worry that this proves too much stems from a slight misidentification of where the specific assumptions about conditionals enter the derivation. Let me walk you through where the argument holds, where your generalization worry is blocked, and how we should diagnose the premises given your theoretical preferences.

  Your concern is that steps four through nine seem to rely only on general features of credence and partitions, suggesting that if the argument works for the conditional proposition C, it should work for any sentence S, thereby proving that no sentence expresses a proposition. This would indeed be absurd, but the derivation does not actually generalize in the way you fear. The crucial specificity enters at steps six and seven. You treat these as intuitive claims about how an agent updates on evidence, but in the context of this proof, they are actually derived consequences of step three. Step three asserts that the equation linking the credence in the conditional to the conditional probability holds for every credence function the agent might rationally have. If we assume this universal quantification, then we can consider a specific credence function where the agent is certain of B. In that specific function, the conditional probability of B given A is one, and so by step three, the credence in C must be one. This validates step six. Similarly for step seven with the falsity of B. For an ordinary sentence S, such as it is raining, we do not assume that the credence in S is equal to the conditional probability of some other proposition B given A for all credence functions. Therefore, we cannot derive that the credence in S given B is one. The reasoning is blocked for ordinary sentences because they do not satisfy the strong constraint laid out in step three. The triviality result is specific to expressions that are assumed to satisfy Adams's thesis across all relevant probability functions.

  This brings us to your first specific question regarding steps six and seven and the range of credence functions. You suspect there is an unstated premise here, and you are correct to do so. Step three states that the equation holds for every credence function she might rationally come to have, but for the derivation of steps six and seven to work, the class of credence functions must be closed under conditionalization. In other words, it must be the case that if the agent currently has credence function P, then the function P_B (which is P conditionalized on B) is among the functions she might rationally come to have. If the language or the context restricts which probability functions are admissible such that learning B is not a rational option while maintaining the meaning of the conditional, the triviality result can be avoided. This is the route taken by contextualists who argue that the meaning of the conditional shifts when evidence shifts, thereby changing the proposition expressed. However, in the standard formulation of the triviality result, we assume the proposition expressed by the conditional is fixed while the credence function varies. So, step three does contain the necessary premise, provided we interpret might rationally come to have as including updates by conditionalization on B and not-B. If you leave that implicit, the argument feels like it relies on intuition rather than the structural constraint, which is likely why you felt something was missing.

  Regarding your second question about step eight and the commitment to the consequent, your intuition is spot on. If step eight holds, then the credence in the conditional proposition C is identical to the credence in the consequent B for every possible credence function. In the geometry of probability spaces, if two propositions have the same probability in every possible probability function, they are logically equivalent. This means the proposition expressed by if A, B is the same proposition as B. Consequently, asserting the conditional would indeed commit you to asserting the consequent, regardless of the antecedent. Since you correctly note that you feel no such commitment when asserting ordinary indicatives, this is strong evidence against the conjunction of steps one and two. It tells us that the landscape of our language cannot accommodate both the idea that conditionals express standard propositions and the idea that their credence is always the conditional probability. You must choose which intuition to sacrifice.

  If I were to recommend which step to reject, I would advise you to reject step two, the claim that the conditional expresses a proposition whose credence is the agent's degree of belief in it. This aligns with your preference for keeping step one, Adams's thesis, which is widely regarded as the most robust datum in the philosophy of conditionals. The empirical support for the claim that we assert conditionals to the degree that we believe the consequent given the antecedent is overwhelming, whereas the claim that conditionals express truth-apt propositions is more theoretically loaded. Rejecting step two leads to what is known as the non-propositional view or expressivism about conditionals. On this view, conditionals do not describe facts and do not have truth conditions in the standard sense; rather, they express a state of mind, specifically a conditional degree of belief.

  However, you should be aware of the costs of this choice. The primary cost is the embedding problem. If conditionals are not propositions, it becomes difficult to explain how they function when embedded in larger sentences, such as in negations, disjunctions, or the antecedents of other conditionals. For example, if either if A, B or if C, D is true, standard logic requires the disjuncts to be truth-apt. Non-propositionalists must develop a more complex semantics, often dynamic or expressive, to account for these embeddings without truth conditions. The alternative is to keep step two and restrict step one. This is the propositional route, taken by Lewis himself and various contextualists. They argue that conditionals do express propositions, but Adams's thesis only holds approximately or relative to a context, and fails when we consider the full range of credence functions required for the triviality proof. The cost here is that you must explain away the strong intuitive appeal of Adams's thesis and account for why it seems to hold so universally in ordinary reasoning if it is technically false in the general case. Given your stated preference for preserving Adams's thesis, the non-propositional route is the more coherent choice, even if it requires more work to handle embeddings.

  In summary, your reconstruction does not prove too much because steps six and seven depend on the specific probabilistic identity in step three, which does not apply to ordinary sentences. The hidden premise you sensed is the requirement that the set of admissible credence functions be closed under conditionalization. The collapse in step eight confirms that propositionalism combined with Adams's thesis leads to an untenable equivalence between conditionals and their consequents. Since you wish to preserve Adams's thesis, you should reject the propositionality of conditionals. This saves the probabilistic data at the cost of a more complex semantics for embedded contexts, but most contemporary work in this area suggests that is a price worth paying to avoid the triviality result.

  Best wishes with your seminar presentation.

  Sincerely,

  A Colleague in Formal Epistemology
