  3. The theory must not treat the explanation of why we seek out horror as a precondition for explaining how the response is possible. This is motivated by the frequent conflation of the paradox of fiction with the paradox of tragedy in literature (Tag: Non-negotiable).

  4. It cannot contradict established psychological models that treat emotion as a multi-component process involving appraisal, physiology, and action readiness. This is motivated by the need to integrate philosophical framing with logged skin conductance and behavioral data (Tag: Non-negotiable; Knocks out the most candidates).

  5. The theory must maintain that conscious feeling is a necessary condition for ascribing an emotion, regardless of physiological arousal. This is motivated by the intuition that sweating without feeling is merely arousal, not fear, but is jointly unsatisfiable with Item 2 (Tag: Camp-specific).

  6. The theory must explain the temporal persistence of emotional residues after the cognitive appraisal of threat has been revoked. This is motivated by the twice-through reader checking locks for two nights after knowing the fiction is safe (Tag: Non-negotiable).
