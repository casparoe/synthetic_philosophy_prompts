answer: |-
  **MEMORANDUM**

  **To:** Learning Support Panel
  **From:** Pupil Representative (Year 13)
  **Date:** [Date]
  **Subject:** Recommendations Regarding Neuro-Stimulation Headband Applications

  **Recommendations**

  1.  **Application A (ADHD Diagnosis):** Grant funding and permission for use during supervised study and internal examinations. **Condition:** Permission explicitly excludes use in external competitive examinations (e.g., Mathematics Olympiad). The pupil must sign a declaration agreeing to this restriction.
  2.  **Application B (No Diagnosis):** Refuse funding and permission.

  **Reasoning on Applications**

  Application A falls squarely within the policy's remit to 'enable a pupil to function at the level reasonably expected'. The pupil faces a documented barrier (ADHD) where standard medical treatment is contraindicated. The GP's letter establishes the device as a prosthetic for concentration, analogous to spectacles for vision. Without it, she falls below the expected baseline; with it, she restores herself to it.

  Application B presents a harder case. The pupil argues convincingly that private tutoring is an enhancement permitted at parental expense, and that refusing him public funds for a similar advantage entrenches inequality. His logic is sound: if the school tolerates private enhancement, refusing public enhancement for the less wealthy appears inconsistent. However, our bursary is needs-based, not equity-based. Funding B would shift the panel from removing barriers to subsidising advantage. If we fund B, we must fund every pupil seeking an edge, which the budget cannot sustain. We must therefore maintain the distinction between restoring function (A) and augmenting it (B), even if the line is uncomfortable.

  **Policy Framework and Future Criteria**

  The current policy distinguishes 'treating a difficulty' from 'improving beyond'. This distinction must survive, but it requires anchoring. Currently, 'expected level' is undefined. If we measure it against our own school average, we create a perverse incentive: as more pupils adopt enhancements, the average rises, and what was once an improvement becomes a requirement for normalcy.

  To prevent this, the panel should adopt a fixed criterion: the 'expected level' must be benchmarked against national age-standardised data, not the school cohort. This prevents the goalposts from moving when technology becomes common. Future applications should be judged on whether the device returns a pupil to national norms (grant) or pushes them beyond them (refuse). Professional evidence (GP or educational psychologist) must be required to establish the baseline deficit. Self-reported disadvantage, as in Application B, is insufficient for funding, though it may warrant pastoral support.

  **Awkward Features**

  We must address two complexities. First, Application A seeks the device for therapy and competition. While she needs it to reach the baseline for homework, using it in the Olympiad is purely augmentative. We cannot endorse using public funds to secure competitive advantage in external arenas. The condition restricting use to school-controlled environments is the only enforceable compromise.

  Second, the 'moving target' problem is real. If a third of the year uses headbands, the 'expected level' of concentration shifts. By anchoring our definition to national standards rather than school performance, we insulate the policy from this inflation. We are funding pupils to reach the standard required of their age nationally, not to beat their classmates.

  **The Strongest Consideration Against This Recommendation**

  *Voiced by the Panel's Most Sceptical Member:*

  "You are drawing a line in water and calling it a wall. You claim Application A restores her to normal while Application B seeks an advantage, but you have no objective measure of 'normal' concentration. Once we endorse this device for one pupil, we validate its efficacy for all. The boy in Application B is right: if this works, it is an advantage, and by denying him, you are not protecting policy integrity, you are simply rationing privilege. You say you will fix the benchmark to national standards, but if the national standard shifts because schools like ours adopt this technology, you will be forced to fund it for everyone anyway to keep them competitive. You are not solving the inequality; you are just delaying the moment when this becomes compulsory for everyone."
