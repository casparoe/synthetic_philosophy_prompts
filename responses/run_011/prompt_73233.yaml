prompt: |-
  I am preparing a paper for a centenary panel on Michael Dummett whose theme is his political rather than his technical work. Dummett died in December 2011, which means that every development now most likely to test his position on immigration postdates him by a decade or more. I need a reconstruction, not a eulogy.

  Here is my own précis of the position, which you should treat as fallible and correct wherever I have got it wrong. In his 2001 book On Immigration and Refugees, and in earlier writings on race in Britain, Dummett treats the state's claim to exclude as a standing presumption against which any particular restriction must argue, rather than as a default prerogative. He regards the distinction between the economic migrant and the refugee as morally consequential, but not as licensing the treatment of the latter as someone who has jumped a queue that no one offered him a place in. He holds that resistance to immigration in Britain has been substantially an expression of racism, and that the churches, including his own, were complicit largely through silence. And he gives weight to a special obligation on the part of former imperial powers toward the peoples of the territories they ruled. He argues throughout as a Catholic rather than as a libertarian: his conclusions concern duties owed, not liberties enjoyed.

  Against that background, tell me what Dummett would have made of each of the following, taking them in turn.

  1. The Windrush scandal as it emerged in 2018, together with the hostile environment policy announced in 2012 and given statutory form thereafter, under which long-resident Commonwealth subjects who could not produce documentary proof of a status nobody had ever asked them to prove lost employment, housing and medical treatment.
  2. The United Kingdom's Rwanda partnership: announced in 2022, held unlawful by the Supreme Court in 2023 on the ground that the receiving state could not be treated as safe, and then rendered lawful by an Act of Parliament declaring that it was safe.
  3. The two-tier statutory distinction introduced in 2022 between asylum seekers who arrive by sanctioned routes and those who arrive irregularly, along with the accompanying official vocabulary of legal and illegal arrival.
  4. Brexit, in the specific respect that free movement was terminated by a bare-majority referendum in which most resident citizens of other member states had no vote, and that net migration subsequently reached record levels through non-European routes.

  For each case: state the verdict you believe he would have reached; identify which of his premises is doing the work, so that I can see whether the conclusion is load-bearing or merely decorative; and classify the inference as following from something he actually wrote, as an extrapolation from his principles to a case he never considered, or as genuinely undetermined by anything in the record. Where the record runs out, say so plainly instead of filling the gap with what a theologically literate British philosopher of his generation would plausibly have said.

  Two harder requests follow. First, name at least one position on these questions where his principles would have put him out of step with the people who now invoke his name: somewhere he would have been colder, more demanding, or more willing to concede something to the state than contemporary advocates of open borders are prepared to be. I have no use for a reconstruction in which he turns out to agree with me about everything. Second, tell me whether his technical philosophy buys anything at all in this domain. Two candidates present themselves. One is his verificationism, the requirement that the content of a claim be tied to conditions under which we could recognize it as established, which may or may not have something to say about a legal status constituted in practice by paperwork rather than by facts. The other is his work on voting procedures, which may or may not bear on the legitimacy of settling such questions by simple majority. Assess both honestly; if either is an opportunistic appropriation of a logician's reputation rather than a genuine application, say that it is, and say why.

  Please do not supply a bibliography, a reading list, or citations, and do not put words in his mouth in quotation marks. I want his position paraphrased and argued for.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Michael Dummett's political philosophy on immigration, specifically applied to post-2011 developments.
      *   **Context:** Centenary panel, focus on political (not technical) work.
      *   **Task:** Reconstruct Dummett's likely verdicts on four specific cases (Windrush, Rwanda, Two-tier asylum, Brexit) based on his known positions (primarily *On Immigration and Refugees*, 2001).
      *   **Constraints:**
          *   Treat the user's précis as fallible (correct if wrong).
          *   For each case: State verdict, identify working premises, classify inference (written, extrapolation, undetermined).
          *   Hard Request 1: Identify where Dummett would disagree with contemporary open borders advocates (where he is colder/more demanding/concedes more to the state).
          *   Hard Request 2: Assess the relevance of his *technical* philosophy (verificationism, voting theory) to these political issues. Be honest (call out opportunistic appropriation).
          *   **No bibliography, reading list, or citations.**
          *   **No quotation marks** (paraphrase only).
          *   Tone: Critical reconstruction, not eulogy.

  2.  **Verify the User's Précis:**
      *   *Claim:* State's claim to exclude is a standing presumption against which restriction must argue. *Check:* Yes, Dummett argues against the absolute right of states to control borders. He sees exclusion as needing justification.
      *   *Claim:* Distinction between economic migrant and refugee is morally consequential but doesn't license "queue jumping" rhetoric. *Check:* Yes, he acknowledges the distinction but critiques the "queue" metaphor as often fictional for refugees.
      *   *Claim:* Resistance to immigration in Britain is substantially racism; churches complicit through silence. *Check:* Yes, this is a core theme in his work on race and immigration.
      *   *Claim:* Special obligation of former imperial powers. *Check:* Yes, he emphasizes the Commonwealth connection and historical ties.
      *   *Claim:* Argues as a Catholic (duties owed), not libertarian (liberties enjoyed). *Check:* Yes, his framework is deontological/religious (justice/charity) rather than rights-based liberalism in the Nozickian sense.
      *   *Verdict:* The précis is accurate. I will proceed based on this understanding without needing major corrections, though I will ensure the nuance of his Catholic social teaching is reflected.

  3.  **Drafting the Four Cases:**

      *   **Case 1: Windrush & Hostile Environment (2012-2018)**
          *   *Verdict:* Condemnation. This is the clearest case.
          *   *Premises:* Institutional racism, betrayal of Commonwealth subjects (imperial obligation), the immorality of demanding proof of status that was never granted/recorded.
          *   *Inference Type:* Direct application/extrapolation from written principles. He wrote extensively about the British Nationality Act 1981 and the treatment of Commonwealth citizens.
          *   *Nuance:* He would see the "Hostile Environment" as the bureaucratic instantiation of the racism he diagnosed earlier.

      *   **Case 2: Rwanda Partnership (2022-2023)**
          *   *Verdict:* Condemnation.
          *   *Premises:* The duty to refugees (non-refoulement implied in Catholic teaching), the absurdity of legislating facts (Parliament declaring a state safe when courts said otherwise), the outsourcing of moral responsibility.
          *   *Inference Type:* Extrapolation. He didn't write about offshore processing specifically, but he wrote about the duty to receive refugees and the dishonesty of government policy.
          *   *Nuance:* The legislative override of judicial fact-finding would offend his sense of truth and justice (linking faintly to technical philosophy, but keep that for section 2).

      *   **Case 3: Two-tier Statutory Distinction (Legal vs. Illegal Arrival)**
          *   *Verdict:* Critical/Condemnation.
          *   *Premises:* The "queue" is a myth for many refugees. Article 31 of the Refugee Convention (no penalty for illegal entry) aligns with his view that seeking asylum is not a crime.
          *   *Inference Type:* Extrapolation. He distinguishes migrants/refugees, but would reject criminalizing the *mode* of arrival for those fleeing persecution.
          *   *Nuance:* He might accept some distinction in processing, but not in *rights* or moral worth. The vocabulary of "illegal" applied to asylum seekers would be rejected as morally misleading.

      *   **Case 4: Brexit (Free Movement & Migration Levels)**
          *   *Verdict:* Mixed/Nuanced.
          *   *Premises:* Democratic legitimacy (referendum) vs. Rights of residents (non-voters). Imperial obligation vs. European neighbors.
          *   *Inference Type:* Undetermined/Complex. He was a Europeanist (pro-EU), but his specific views on free movement vs. Commonwealth preference need careful handling.
          *   *Nuance:* He would likely criticize the disenfranchisement of EU residents. He might view the shift from European to non-European migration as fulfilling the imperial obligation, even if the *intent* of Brexit was restrictionist. He would likely oppose the termination of free movement if it severed community ties, but might prioritize Commonwealth obligations over European ones.

  4.  **Hard Request 1: Disagreement with Contemporary Advocates:**
      *   *Idea:* Open Borders advocates often argue for a near-absolute right to move based on liberty or global equality.
      *   *Dummett's Difference:* He is a communitarian/Catholic. He believes in the *nation* as a locus of solidarity. He does not argue for completely open borders in the libertarian sense. He accepts the state has *some* right to regulate numbers to maintain social cohesion, provided the criteria aren't racist. He emphasizes *duties* to specific groups (refugees, Commonwealth) rather than a universal right to migrate for economic betterment.
      *   *Specific Point:* He would likely reject the erasure of the distinction between refugee and economic migrant in terms of *priority*, even if he is generous to both. He might also be more willing to accept some restrictions to preserve the welfare state solidarity, whereas some open borders advocates see the welfare state as secondary to movement.
      *   *Refinement:* The strongest point is his rejection of the "liberty" framework. He argues from *justice* and *charity*. He might find the libertarian open borders argument too individualistic. Also, he emphasizes the specific historical ties (Commonwealth) over a generic global right.

  5.  **Hard Request 2: Technical Philosophy Relevance:**
      *   *Verificationism:* Does "legal status" require verification? The Windrush scandal is literally about the inability to verify status. Dummett's anti-realism suggests meaning is tied to use/verification. If the state creates a status (Indefinite Leave to Remain) but destroys the means of verifying it (landing cards) and then denies the status due to lack of verification, this is a logical/moral contradiction.
          *   *Assessment:* Plausible but risky. It's a metaphorical stretch. His political writings don't explicitly lean on verificationism. I should be honest: it's an opportunistic appropriation *unless* framed carefully as a concern for truth and assertibility conditions in public discourse.
      *   *Voting Theory:* He wrote on social choice and the coherence of collective decision-making. Brexit (bare majority) and the Rwanda Act (Parliament overriding Court facts).
          *   *Assessment:* Stronger link. He was concerned with the legitimacy of democratic procedures. A bare majority stripping rights from non-voters violates principles of fair representation he discussed. However, did he apply his technical voting theory to immigration? No.
          *   *Verdict:* Be honest. The link is tenuous. His political philosophy stands on ethical/religious grounds, not logical/technical ones. Connecting them risks caricature. I will argue that while thematic resonances exist, direct application is opportunistic.

  6.  **Review and Refine:**
      *   *Check Constraints:* No citations? Check. No quotes? Check. Tone critical? Check.
      *   *Check User Précis:* I need to explicitly validate or correct it early on. (It looks solid, so I will validate it to establish common ground).
      *   *Structure:*
          1.  Intro (Validating précis).
          2.  The Four Cases (Verdict, Premise, Inference Type).
          3.  Disagreement with Contemporaries.
          4.  Technical Philosophy Assessment.
      *   *Tone Check:* Ensure I don't sound like I'm worshipping him. Keep it analytical. "He would have argued..." rather than "He would have sadly noted..."

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Correction on Brexit:* Dummett was a committed European. He would likely view Brexit negatively overall. But on migration specifically, he might see the irony that ending EU free movement increased Commonwealth migration (which he favored). I need to balance his Europeanism with his Commonwealth prioritization. Actually, his priority was usually justice for the Commonwealth *first*, but he saw European integration as a bulwark against nationalism. I will lean towards him viewing the *process* (disenfranchisement) as the primary failure, rather than the migration statistics.
      *   *Correction on Verificationism:* Be very careful not to say "His anti-realism proves Windrush was wrong." Instead, say "His concern for the conditions under which we assert truth mirrors the scandal," but conclude it's not a direct logical derivation.
      *   *Correction on Open Borders:* Make sure to highlight his Catholicism. He believes in the *nation* as a community of reciprocity. Unlimited immigration could strain that reciprocity. He is not a cosmopolitan in the modern sense.

