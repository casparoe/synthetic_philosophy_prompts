prompt: |-
  I have a fifty-minute section with second-years in a rational choice course. They've had two weeks of expected utility theory — completeness, transitivity, independence — worked through with decision trees, and every one of them has read something mentioning Kahneman, so they will arrive expecting a "humans are irrational" story. I want to teach the Allais paradox, and I want them to leave with close to the opposite: that independence is the sure-thing principle wearing mathematical clothes, and that what's actually contested is what an axiom is supposed to be — a constraint on coherent preference, or an empirical generalization that a show of hands can refute. Plan the section for me; don't deliver it.

  Specifically: the order the pieces must go in and what depends on what — in particular, whether the common-consequence decomposition of the two pairs comes before or after I collect their choices, given that showing it first kills the hook and showing it second leaves half the room unable to retract what they just picked. Which figures to use: the textbook million against five million, Allais's own hundred million francs against five hundred, which will sound like a joke, or a scaled-down ten-dollar version; what the carrying example has to have for the reversal to bite, and what it must lack. The misconceptions in the order they'll surface — that it's just risk aversion over huge sums, that probability weighting already dissolved it, that you can always bend the utility function to fit any choice, that independence is a technical convenience with no normative force — and the exact point in the sequence to head each off. One closing question that would tell me whether they can now spot an Allais-style violation in a pair they've never seen. And what I should openly refuse to cover at this level.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Audience:** Second-year undergraduates, Rational Choice course.
      *   **Background:** Two weeks of Expected Utility Theory (EUT) - completeness, transitivity, independence, decision trees. Read Kahneman (expecting "humans are irrational").
      *   **Goal:** Teach the Allais Paradox.
      *   **Desired Takeaway:** Independence = Sure-Thing Principle (normative/coherence), not just an empirical generalization. The debate is about the *status* of axioms (coherence vs. description).
      *   **Constraints:** 50-minute section. Do not deliver the content, *plan* the section.
      *   **Specific Requirements:**
          *   Order of operations (specifically: Common-Consequence Decomposition vs. Collecting Choices).
          *   Choice of stakes/figures (Millions vs. Francs vs. Ten Dollars).
          *   Characteristics of the carrying example (what it needs/lacks).
          *   Misconceptions to address (Risk aversion, Probability weighting, Bending utility function, Independence as technical convenience) + *when* to address them.
          *   Closing question (transfer test).
          *   What to explicitly *exclude* (scope boundary).

  2.  **Deconstruct the Core Tension:**
      *   *The Hook:* Students expect "EUT is wrong because humans are weird."
      *   *The Twist:* "EUT isn't wrong; it's a standard of coherence. If you violate it, you're susceptible to a Dutch Book (money pump), not just 'irrational' in a psychological sense."
      *   *The Pedagogical Problem:* If I show the math (common consequence) first, the choice feels sterile. If I collect choices first, students feel committed to their "irrational" choice and might resist the logic.
      *   *Resolution:* Collect choices first (to generate the data), *then* reveal the structure (to show the contradiction), *then* reframe the axiom (to shift from empirical to normative).

  3.  **Drafting the Plan - Section by Section:**

      *   **Timing:** 50 minutes is tight. Need strict timekeeping.
      *   **Phase 1: The Trap (0-10 mins).** Get them to choose. Needs to be fast, anonymous (to reduce social pressure), and high stakes (to make the certainty effect bite).
      *   **Phase 2: The Reveal (10-20 mins).** Show the pattern. Introduce the Common Consequence Effect.
      *   **Phase 3: The Pivot (20-35 mins).** This is the core. Move from "EUT fails prediction" to "Independence is coherence." Use the Sure-Thing Principle logic.
      *   **Phase 4: Misconception Management (Integrated).** Address risk aversion, utility bending, etc., as they arise naturally.
      *   **Phase 5: Assessment & Boundary (35-50 mins).** The transfer question and the "what we aren't doing" disclaimer.

  4.  **Addressing Specific Prompts:**

      *   *Order (Decomposition vs. Choices):* Must collect choices *first*. If they see the decomposition, they will solve it logically rather than intuitively, killing the paradox. *However*, to prevent them from feeling stuck, frame the decomposition as "Let's see what your choices imply" rather than "You are wrong."
      *   *Figures:* Textbook millions ($1M vs $5M) are best. $10 is too low (transaction costs/indifference). Allais's Francs are historically accurate but distanced. Millions feel "life-changing" enough to trigger the certainty effect without sounding like a joke.
      *   *Carrying Example:* Needs a *certain* outcome in one option (Pair 1) and a *shared* risky outcome in both options (Pair 2). It must lack *complementary* consequences (that's Common Ratio, not Common Consequence).
      *   *Misconceptions:*
          *   *Risk Aversion:* Address immediately after choices. If they say "I'm risk averse," show that risk aversion is consistent in Pair 1 but inconsistent in Pair 2 *given EUT*.
          *   *Bending Utility:* Address during the math reveal. $u(x)$ cancels out.
          *   *Probability Weighting:* Acknowledge (Kahneman connection) but bracket as *descriptive*, not *normative*.
          *   *Technical Convenience:* Address at the end during the normative pivot.
      *   *Closing Question:* Needs a new pair of prospects that isolates independence without being obviously Allais.
      *   *Refusals:* Prospect Theory details, Dutch Book proofs (too technical), historical biography of Allais.

  5.  **Refining the Flow (Self-Correction/Optimization):**
      *   *Critique:* If I collect choices first, half the room can't retract.
      *   *Fix:* Don't ask them to retract. Ask them to *reconcile*. The tension is the learning moment. The goal isn't to make them say "I was wrong," but "My intuition conflicts with my commitment to consistency."
      *   *Critique:* When to introduce the Sure-Thing Principle?
      *   *Fix:* Use it to explain *why* Independence matters. Independence *is* the Sure-Thing Principle in probabilistic guise. This needs to happen after the math shows the contradiction.
      *   *Critique:* How to handle the Kahneman expectation?
      *   *Fix:* Validate it early ("Yes, Kahneman says this describes behavior"), then pivot ("But Savage says this prescribes coherence").

  6.  **Finalizing the Plan Structure:**
      *   **0-5:** Setup & Vote.
      *   **5-15:** The Data & The Math (Common Consequence).
      *   **15-30:** The Normative Turn (Sure-Thing Principle).
      *   **30-40:** Misconception Gauntlet.
      *   **40-50:** Transfer Test & Scope Boundaries.

  7.  **Fleshing out the Details (incorporating the "Specifics"):**
      *   *Stakes:* $1M guaranteed vs 89% $1M / 10% $5M / 1% $0. (Standard Allais).
      *   *Misconception Timing:* Risk aversion comes up in the Vote discussion. Utility bending comes up in the Math. Technical convenience comes up in the Normative Turn.
      *   *Closing Question:* Use a non-monetary example or different probabilities to ensure they aren't just memorizing the $1M/$5M pattern.

  8.  **Review against Constraints:**
      *   50 minutes? Yes, segmented.
      *   Order specified? Yes (Choices -> Decomposition).
      *   Figures specified? Yes (Millions).
      *   Misconceptions mapped? Yes.
      *   Closing question included? Yes.
      *   Refusals included? Yes.

  9.  **Final Polish:** Ensure tone is instructional (for the TA/Professor) not lecture notes. Emphasize the *pedagogical reasoning* behind the choices. (Self-correction: Make sure to explicitly state *why* the decomposition comes after the vote).

  10. **Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  Here is the section plan. It is designed to move from empirical intuition to normative commitment, leveraging the students' expectation of a "Kahneman moment" to deliver a "Savage moment" instead.

  ### **Section Overview (50 Minutes)**
  *   **00–08:** Elicitation (The Trap)
  *   **08–20:** Formalization (The Contradiction)
  *   **20–35:** Reframing (The Normative Turn)
  *   **35–45:** Misconception Gauntlet
  *   **45–50:** Transfer Test & Scope Boundaries

  ---

  ### **1. Elicitation (00–08)**
  **Goal:** Generate the violation without triggering analytical processing.
  **Order:** **Collect choices BEFORE showing decomposition.**
  *   **Reasoning:** If you show the common-consequence structure first, students treat it as an algebra problem. They will solve for consistency rather than revealing their preference. You need their raw intuition to create the cognitive dissonance required for the lesson.
  *   **The Stakes:** Use the **textbook millions** ($1M vs $5M).
      *   *Why:* $10 is too trivial (ignores wealth effects/transaction costs); Allais's Francs are historically authentic but psychologically distant. Millions feel "life-changing," which is required to trigger the *certainty effect* that drives the paradox.
  *   **The Carrying Example:**
      *   **Pair 1:** (A) $1M for sure vs. (B) 10% $5M, 89% $1M, 1% $0.
      *   **Pair 2:** (C) 11% $1M, 89% $0 vs. (D) 10% $5M, 90% $0.
      *   **Requirement:** Pair 1 *must* have a certain outcome (Option A). Pair 2 *must* remove the common consequence (the 89% chance of $1M) and replace it with a common consequence of $0.
      *   **Constraint:** Do not use Common Ratio (probability scaling) here. Stick to Common Consequence to isolate the Independence Axiom specifically.
  *   **Method:** Anonymous poll (clickers or slips of paper). Ask for A or B, then C or D. Do not discuss yet. Tally the "A & D" pattern (the Allais violation) on the board. Expect ~60-70% of the room to hold this pattern.

  ### **2. Formalization (08–20)**
  **Goal:** Demonstrate that the violation is mathematically incompatible with EUT, not just "weird."
  **Action:** Reveal the Common-Consequence Decomposition *now*.
  *   **The Move:** Draw the decision trees. Strip away the 89% branch that is identical in Pair 1 (where it yields $1M) and Pair 2 (where it yields $0).
  *   **The Reveal:** Show that if they strip the common branch, the remaining prospects in Pair 1 are identical to Pair 2.
      *   *Pair 1 Remainder:* 1% $0 vs 10% $5M + 1% $0 (wait, simplify).
      *   *Better Visual:* Show that choosing A over B implies preferring $1M sure over the gamble. Choosing D over C implies preferring the gamble over the $1M sure *when both are embedded in the same 89% noise*.
  *   **Addressing Misconception #1 (Risk Aversion):**
      *   *When:* Immediately after the reveal (Min 12).
      *   *The Trap:* A student will say, "I chose A because I'm risk-averse."
      *   *The Counter:* "Risk aversion is a property of the utility function $u(x)$. If you are risk-averse in Pair 1, EUT demands you be risk-averse in Pair 2. The math cancels out the $u(x)$. You cannot be risk-averse in one and risk-seeking in the other without violating the axiom."
  *   **Addressing Misconception #2 (Bending the Utility Function):**
      *   *When:* During the algebra (Min 15).
      *   *The Trap:* "Can't we just make $u(1M)$ really high?"
      *   *The Counter:* Show the inequality. $u(1M) > 0.1u(5M) + 0.89u(1M) + 0.01u(0)$. Rearrange. It simplifies to the exact inequality required for Pair 2, but reversed. No shape of $u(x)$ satisfies both.

  ### **3. Reframing (20–35)**
  **Goal:** Shift the status of the Independence Axiom from empirical to normative.
  **Core Argument:** Independence is the Sure-Thing Principle wearing mathematical clothes.
  *   **The Pivot:** Acknowledge Kahneman. "Kahneman describes how you *do* choose. Savage (and EUT) prescribes how you *must* choose to avoid inconsistency."
  *   **The Sure-Thing Analogy:**
      *   Ask: "If you prefer Bet X to Bet Y when Event E happens, and you prefer X to Y when Event E does not happen, should you prefer X to Y regardless of E?"
      *   Map this to Allais: The 89% chance is the "Event E." In Pair 1, if that 89% hits, you get $1M (Option A) or $1M (Option B). It's a tie. If it misses (the 11% remainder), you face a choice between $1M sure or the gamble.
      *   In Pair 2, if the 89% hits, you get $0 (Option C) or $0 (Option D). It's a tie. If it misses, you face the *exact same* choice between $1M sure or the gamble.
      *   **The Kicker:** "If your preference depends on the 89% branch, even though the outcome is identical in both options, you are letting an irrelevant event dictate your choice. That is what Independence forbids."
  *   **Addressing Misconception #3 (Technical Convenience):**
      *   *When:* Min 30.
      *   *The Trap:* "So Independence is just there to make the math work?"
      *   *The Counter:* "No. It's a coherence constraint. If you violate it, you are susceptible to a money pump (briefly mention, do not prove). You would pay to switch from A to B, then pay to switch from D to C, effectively paying to return to where you started."

  ### **4. Misconception Gauntlet (35–45)**
  **Goal:** Pre-empt the "Psychology solves it" reflex.
  *   **Addressing Misconception #4 (Probability Weighting):**
      *   *When:* Min 38.
      *   *The Student Push:* "But Kahneman showed we weight probabilities non-linearly. Doesn't that solve it?"
      *   *The Response:* "It *describes* the violation. It does not *justify* the preference. Prospect Theory tells us why you violated the axiom; it does not tell us why the axiom is wrong. We are studying Rational Choice, not Behavioral Description. If you want to maximize coherence, you must satisfy Independence. If you want to maximize descriptive accuracy, you use Prospect Theory. Do not confuse the map for the territory."
  *   **The "Irrational" Label:**
      *   Explicitly forbid the word "irrational" for the remainder of the section. Use "incoherent" or "inconsistent." "Irrational" implies a cognitive defect; "incoherent" implies a logical contradiction. The latter is fixable; the former is a diagnosis.

  ### **5. Transfer Test & Scope Boundaries (45–50)**
  **Goal:** Verify understanding and set course limits.
  *   **The Closing Question (Transfer Test):**
      *   Do not use money. Use a generic outcome $X$.
      *   *Pair 1:* (A) $X$ for sure vs. (B) 90% $X$, 10% $0$.
      *   *Pair 2:* (C) 10% $X$, 90% $0$ vs. (D) 9% $X$, 1% $0$, 90% $0$. (Wait, simplify).
      *   *Better Pair:*
          *   **Option J:** 50% Ticket to Win Prize, 50% Nothing.
          *   **Option K:** 50% Ticket to Win Prize, 50% Nothing. (Identical).
          *   *No, needs to be Allais structure.*
          *   **Use this:**
              *   **Pair 1:** (A) 100% Pass Class vs. (B) 90% Pass Class, 10% Fail.
              *   **Pair 2:** (C) 10% Pass Class, 90% Fail vs. (D) 9% Pass Class, 1% Fail, 90% Fail.
              *   *Ask:* "If you prefer A over B, what does Independence demand you choose in Pair 2? Why?"
              *   *Success Criterion:* They must identify that the 90% "Fail" is the common consequence that should be ignored.
  *   **What to Openly Refuse to Cover:**
      *   **Dutch Book Proofs:** "We will not prove the money pump theorem today. Accept that incoherence allows exploitation."
      *   **Prospect Theory Math:** "We will not calculate decision weights. We are evaluating the norm, not fitting the curve."
      *   **Regret Theory:** "We are not discussing how you feel after the choice, only the consistency of the choice itself."
  *   **Final Instruction:** "For the problem set: If asked to evaluate a choice, do not ask 'Is this realistic?' Ask 'Is this consistent?'"

  ---

  ### **Instructor Notes on Flow & Tone**
  *   **The "Retraction" Problem:** You noted that showing decomposition second leaves half the room unable to retract. **Do not ask them to retract.** Ask them to *identify the source of the conflict*. The learning objective is not that they switch their vote; it is that they recognize their vote violates a principle they claim to hold (consistency). If a student insists on keeping the Allais choice, validate the intuition ("It feels right") but enforce the label ("It is incoherent").
  *   **Kahneman Management:** They arrive expecting to bash EUT. Let them have that victory in the first 10 minutes ("Yes, EUT predicts poorly here"). Then take it away in the next 20 ("But prediction is not the only goal of a theory").
  *   **Board Work:** Keep the Pair 1 and Pair 2 inequalities on the board side-by-side throughout the middle section. Visually demonstrate the cancellation of the 0.89 term.
