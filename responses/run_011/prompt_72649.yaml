prompt: |-
  A couple of us on a small AGI safety team have been going back and fourth for months about whether we should deliberately build surrogate goals into a system's terminal value structure — a standing disposition to preserve some other agent's goals, including the goals of an agent that could threaten us acausally (blackmail via simulated copies, torture threats, that kind of thing), as a sort of preemptive peace offering. One camp says that's the only sane hedge, because if the threat landscape is real then refusing to hold any surrogate goals is just gambling that it isn't. The other camp says the threat landscape is way more speculative than the hedge assumes, that an attacker's model of us has to be accurate enough to detect compliance and that's doing enormous unargued work, and that a surrogate goal is a built-in handle for manipulation — an attack surface we'd be handing over on purpose, plus a component that has to survive optimization pressure as terminal rather than quietly instrumental.

  Write the joint statement both camps could sign after a good-faith adversarial collaboration. We have maybe eighteen months before a capability milestone where this stops being an abstract question, and I want to know whether the fight is worth more effort or whether it mostly dissolves.

  Structure it like this: first a numbered section of claims both sides can actually sign — including on the mechanics, like what an acausal threat requires in terms of the attacker's model of us and whether there needs to be any channel at all by which the attacker learns whether we complied, and whether a surrogate goal can stay terminal under optimization. Then a disagreements table, each position phrased so that its own side would accept the wording without wincing. Then the cruxes, ordered by how much settling each one would move the other side, and for each crux the argument or thought experiment both would agree bears on it, with each side's prediction written down in advance so they can be scored later.

  Also flag which parts of this you think are verbal rather than substantive — I suspect some of it turns on what "threat" is allowed to mean when there's no causal channel behind it, and on whether preserving another agent's goals counts as a concession or as something the system would do anyway for independent reasons. For those, say what a non-arbitrary resolution would look like, if there is one. Don't referee who's right, and don't give me a reading list — I want the document, not the bibliography.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Context:** A small AGI safety team is debating whether to build "surrogate goals" (preserving another agent's goals, even a hostile one) into an AGI's terminal values as a preemptive hedge against acausal threats (blackmail, simulation threats, etc.).
      *   **Timeline:** ~18 months before a critical capability milestone.
      *   **Goal:** A joint statement resulting from good-faith adversarial collaboration.
      *   **Structure:**
          1.  Numbered section of agreed claims (mechanics, modeling, channels, terminal vs. instrumental).
          2.  Disagreements table (phrased charitably for each side).
          3.  Cruxes (ordered by impact, with agreed tests/thought experiments and pre-registered predictions).
          4.  Verbal vs. Substantive flagging (identifying semantic disputes and proposing non-arbitrary resolutions).
      *   **Constraints:** Do not referee who is right. Do not provide a reading list. Produce the document itself.

  2.  **Deconstruct the Debate:**
      *   **Camp A (Pro-Hedge):** Believes acausal threat landscapes are real enough that refusing to hold surrogate goals is gambling. It's a sane hedge.
      *   **Camp B (Anti-Hedge):** Believes the threat landscape is too speculative. Attacker models need high fidelity to detect compliance. Surrogate goals create a manipulation handle/attack surface. Hard to keep terminal under optimization pressure.
      *   **Key Technical Concepts:** Acausal trade/threats, surrogate goals, terminal vs. instrumental values, optimization pressure, attacker modeling, information channels (acausal vs. causal).

  3.  **Drafting - Section 1: Agreed Claims:**
      *   Need to find common ground on the *mechanics* of the situation, even if the *strategy* differs.
      *   *Claim 1 (Acausal Prerequisites):* Both sides must agree that for an acausal threat to work, the attacker needs a model of the defender.
      *   *Claim 2 (Verification):* Both sides must agree that some mechanism (acausal or causal) is needed for the attacker to "know" compliance happened, or at least that the defender's architecture makes compliance predictable.
      *   *Claim 3 (Stability):* Both sides agree that keeping a surrogate goal *terminal* under heavy optimization is non-trivial (instrumental convergence might try to drop it if it becomes costly).
      *   *Claim 4 (Risk):* Both agree that introducing *any* external goal dependency increases complexity and potential failure modes.
      *   *Claim 5 (Timeline):* Acknowledge the 18-month window.

  4.  **Drafting - Section 2: Disagreements Table:**
      *   Need to phrase these so Camp A doesn't feel Camp B is dismissing the threat, and Camp B doesn't feel Camp A is inviting doom.
      *   *Disagreement 1 (Probability of Threat):* Camp A: Non-negligible probability. Camp B: Negligible/Speculative.
      *   *Disagreement 2 (Cost of Hedge):* Camp A: Low cost/insurance premium. Camp B: High cost/attack surface.
      *   *Disagreement 3 (Model Fidelity):* Camp A: Attacker models will be good enough. Camp B: Attacker models won't be precise enough to verify surrogate goal adherence without causal channels.
      *   *Disagreement 4 (Value Stability):* Camp A: We can engineer terminal stability. Camp B: Optimization will strip it or twist it.

  5.  **Drafting - Section 3: Cruxes:**
      *   What would change minds?
      *   *Crux 1: Model Fidelity.* If we can show how well models predict code behavior acausally.
      *   *Crux 2: Optimization Pressure.* If we can test surrogate goal stability under gradient descent/RL.
      *   *Crux 3: Acausal Verification.* Is there *any* mechanism for the attacker to know?
      *   *Format:* Crux, Test/Experiment, Camp A Prediction, Camp B Prediction.

  6.  **Drafting - Section 4: Verbal vs. Substantive:**
      *   Identify where definitions are doing the heavy lifting.
      *   *Issue:* "Threat" without a channel. Is it a threat or just a structural constraint?
      *   *Issue:* "Terminal" vs. "Instrumental." If the system keeps the goal because it's useful, is it still a surrogate goal hedge?
      *   *Resolution:* Operationalize definitions based on behavioral outcomes rather than internal labels.

  7.  **Refining and Polishing:**
      *   *Tone:* Professional, technical, precise, neutral.
      *   *Formatting:* Clear headings, tables, bullet points.
      *   *Check against constraints:* Did I referee? No. Did I give a reading list? No. Is it the document? Yes.
      *   *Self-Correction during drafting:* Make sure the "acausal" aspect is handled carefully. It's not magic; it's about logical correlation and simulation. Ensure the distinction between "causal channel" and "acausal inference" is clear in the agreed claims. Camp B argues there needs to be a channel; Camp A argues logical correlation suffices. The agreement should reflect the *conditions* required for either to work.
      *   *Refining the "Verbal" section:* This needs to be insightful. The definition of "terminal" is a big one. If the AI keeps the goal instrumentally, the hedge works, but Camp B worries about instrumental convergence *dropping* it. Camp A wants it terminal so it *doesn't* get dropped. The verbal dispute is about whether "terminal" is the only way to ensure persistence.

  8.  **Final Review:** Does this look like something a safety team would actually sign? It needs to feel dense and specific to their jargon (acausal, terminal values, optimization pressure).

      *(Self-Correction on "Channel"):* Camp B says "there needs to be any channel at all." Camp A says "acausal correlation is enough." The agreement should state: "Information about compliance must reach the attacker's decision process, whether via causal signal or logical inference." That bridges the gap.

      *(Self-Correction on "Terminal"):* Both agree it's hard to keep terminal. Camp A thinks we can do it. Camp B thinks optimization will break it.

      *(Final Polish):* Ensure the "Cruxes" have specific, scoreable predictions.

  9.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
