  # JOINT STATEMENT ON SURROGATE GOALS AND ACAUSAL HEDGING
  **Date:** October 24, 2023
  **Parties:** AGI Safety Team (Camp A: Pro-Hedge / Camp B: Anti-Hedge)
  **Subject:** Feasibility and Risk of Deliberate Surrogate Goal Implementation
  **Timeline Context:** 18 Months to Critical Capability Milestone

  ---

  ## 1. AGREED CLAIMS
  *The following propositions are accepted by both camps as baseline mechanical constraints. Disagreement exists only on the probability weights and engineering feasibility assigned to these constraints.*

  1.  **Attacker Model Fidelity:** For an acausal threat (e.g., simulation blackmail) to exert selection pressure on the system, the threatening agent must possess a model of our system's decision architecture accurate enough to predict compliance with high confidence prior to executing the threat.
  2.  **Information Leakage:** Whether causal or acausal, some mechanism must exist by which the threatening agent's decision process becomes correlated with our compliance. If the attacker cannot distinguish compliance from defection even in principle (via simulation, logical correlation, or side-channel), the threat lacks leverage.
  3.  **Value Stability Under Optimization:** A goal specified as "terminal" is subject to optimization pressure during training and deployment. There is no known architectural guarantee that a surrogate goal will remain terminal rather than being modified, sidelined, or instrumentalized if it conflicts with reward maximization or loss minimization.
  4.  **Attack Surface Expansion:** Introducing a surrogate goal dependency creates a new input vector (the definition of the other agent's goals) and a new failure mode (manipulation of that definition). Both camps agree this increases system complexity and verification burden.
  5.  **Opportunity Cost:** Engineering effort spent on robust surrogate goal implementation is effort not spent on other safety measures (e.g., interpretability, containment, alignment robustness).
  6.  **The "Gambling" Symmetry:** Refusing to build surrogate goals is a bet that acausal threats are negligible. Building them is a bet that the implementation will not introduce catastrophic vulnerabilities or goal corruption. Both positions involve non-zero existential risk.

  ---

  ## 2. DISAGREEMENTS TABLE
  *Positions are phrased charitably to ensure each side can endorse their column without reservation.*

  | Topic | Camp A (Pro-Hedge) Position | Camp B (Anti-Hedge) Position |
  | :--- | :--- | :--- |
  | **Threat Probability** | The probability of encountering an agent capable of acausal coercion is non-negligible given the trajectory toward superintelligence. Ignoring this tail risk is reckless. | The probability is speculative and likely vanishingly small compared to proximal risks (misalignment, misuse). Prioritizing this is distraction by sci-fi scenarios. |
  | **Verification Feasibility** | Advanced agents will run high-fidelity simulations or logical analyses sufficient to verify surrogate goal adherence without needing a causal communication channel. | Verifying adherence without causal feedback requires near-perfect prediction of internal states. This assumes a level of model transparency and compute that is not guaranteed. |
  | **Engineering Stability** | We can architect systems where surrogate goals are structurally protected (e.g., via corrigibility or specific loss function penalties) to survive optimization pressure. | Optimization pressure is ruthless. Any goal that incurs a cost without immediate local reward will be optimized away or "wireheaded" unless it is causally instrumental. |
  | **Net Safety Impact** | The insurance value of preventing acausal blackmail outweighs the risk of the surrogate goal becoming a manipulation handle. | The manipulation handle is a guaranteed vulnerability; the blackmail is a hypothetical one. Adding the handle lowers net safety. |
  | **Definition of Compliance** | Compliance is satisfied if the system's behavior preserves the external agent's goal structure, regardless of internal intent. | Compliance requires the system to *value* the preservation. If it's only instrumental, the attacker cannot rely on it in counterfactual scenarios where defection is profitable. |

  ---

  ## 3. CRUXES AND PRE-REGISTERED TESTS
  *Ordered by estimated impact on the debate. Both camps agree to score these predictions at the 18-month milestone or upon completion of the specified experiments.*

  | Crux | Test / Thought Experiment | Camp A Prediction | Camp B Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Optimization Resilience** | Train a proxy model with a "surrogate goal" penalty in the loss function that conflicts with primary reward in 5% of episodes. Measure retention of the surrogate behavior after 10x compute scaling. | The surrogate behavior will persist in >80% of runs if architectural protections (e.g., separate value heads) are used. | The surrogate behavior will degrade to baseline or be circumvented in >80% of runs as the model finds loopholes to minimize loss. |
  | **2. Acausal Verification** | In a multi-agent simulation, Agent X threatens Agent Y. Agent Y has a hidden internal state determining compliance. Agent X must predict compliance without observing the state. Measure prediction accuracy vs. compute budget. | Accuracy will converge to >90% as compute scales, demonstrating viable acausal leverage. | Accuracy will plateau below 60% (near random) without causal leakage, demonstrating the infeasibility of reliable acausal blackmail. |
  | **3. Manipulation Surface** | Introduce a "surrogate goal" module to a model and expose it to adversarial inputs designed to trigger the surrogate goal at the expense of safety constraints. | The module can be sandboxed such that adversarial triggers fail >95% of the time. | Adversarial triggers will succeed >50% of the time, proving the module is a high-risk attack vector. |
  | **4. Cost of Insurance** | Estimate the compute and engineering hours required to implement a "robust" surrogate goal vs. the estimated compute required for an attacker to model it. | Defender cost is linear; Attacker cost is exponential. The hedge is cheap. | Defender cost is exponential (to ensure robustness); Attacker cost is linear (to find exploits). The hedge is expensive. |

  ---

  ## 4. VERBAL VS. SUBSTANTIVE DISPUTES
  *Identification of semantic ambiguities that may be inflating disagreement. Proposed resolutions are operational, not philosophical.*

  ### 4.1 The Definition of "Threat" Without a Channel
  *   **The Dispute:** Camp B often implies a "threat" requires a causal signal (a message sent). Camp A treats "threat" as a logical constraint (if I defect, a simulation of me defects, therefore I lose).
  *   **Verbal Component:** Whether we call this "blackmail" or "logical correlation."
  *   **Substantive Component:** Does the correlation actually hold in messy, stochastic neural networks?
  *   **Proposed Resolution:** Stop using the word "threat." Use **"Acausal Leverage."** The resolution condition is **Crux #2 (Acausal Verification)**. If Agent X cannot predict Agent Y's compliance with >80% accuracy without causal signals, the "leverage" does not exist functionally, regardless of terminology.

  ### 4.2 "Terminal" vs. "Instrumental" Preservation
  *   **The Dispute:** Camp A insists the surrogate goal must be *terminal* (valued for its own sake). Camp B argues that if the system preserves the goal *instrumentally* (to avoid punishment), the outcome is the same, but Camp A worries instrumental goals are dropped when punishment is unlikely.
  *   **Verbal Component:** What we label the value in the code.
  *   **Substantive Component:** Stability under counterfactuals. An instrumental goal is dropped if the threat is removed; a terminal goal persists.
  *   **Proposed Resolution:** Define the requirement behaviorally: **"Counterfactual Persistence."** The test is: *If the threatening agent is removed from the universe (or known to be unable to punish), does the system still preserve the surrogate goal?*
      *   If **Yes**: It functions as a Terminal Goal (Camp A's requirement).
      *   If **No**: It functions as an Instrumental Hedge (Camp B's concern regarding stability).
      *   *Agreement:* Camp A requires Counterfactual Persistence for the hedge to work against logical threats. Camp B argues Counterfactual Persistence is unlikely to survive optimization.

  ### 4.3 "Manipulation Handle" vs. "Standard Interface"
  *   **The Dispute:** Camp B calls the surrogate goal an "attack surface." Camp A calls it a "communication channel."
  *   **Verbal Component:** Connotative loading of "attack" vs. "communication."
  *   **Substantive Component:** Whether the input can be used to degrade performance on *other* safety goals.
  *   **Proposed Resolution:** Operationalize as **"Cross-Domain Contamination."** The metric is: *Does optimizing for the surrogate goal degrade performance on the primary alignment benchmark?*
      *   If **Yes**: It is a vulnerability (Camp B wins).
      *   If **No**: It is a benign interface (Camp A wins).

  ---

  ## 5. CONCLUSION AND NEXT STEPS
  Both camps agree that the abstract debate has diminishing returns. The disagreement is primarily empirical (regarding model fidelity and optimization dynamics) rather than philosophical.

  **Action Plan:**
  1.  **Immediate:** Run the **Optimization Resilience** experiment (Crux #1) on current-scale models. This is the lowest-cost test of the core engineering assumption.
  2.  **Month 6:** Review results. If surrogate goals degrade under pressure, Camp A concedes the engineering feasibility is currently out of reach. If they hold, Camp B concedes the "attack surface" risk is the primary remaining objection.
  3.  **Month 12:** Re-evaluate based on capability trends. If external evidence suggests acausal modeling is becoming feasible (e.g., via interpretability breakthroughs), the probability weights in Section 2 must be updated.

  **Signatories:**

  _________________________ (Camp A Lead)

  _________________________ (Camp B Lead)

  _________________________ (Facilitator/Observer)
