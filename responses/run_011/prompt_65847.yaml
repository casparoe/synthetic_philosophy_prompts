prompt: |-
  I work on type theory and proof assistants, and my native vocabulary is judgments, contexts, inference rules, derivability versus admissibility, object-level versus meta-level, and the operational semantics describing what a proof checker actually does at each step. I know Lewis Carroll's 1895 dialogue between the Tortoise and Achilles only through the usual gloss: that supplying the conditional as a further premise never gets the Tortoise to move, and that what he is missing is a rule rather than a proposition. Restate that regress as faithfully as you can in my terms — cast the Tortoise as a system that holds the premises and the implication in its context yet never emits the conclusion, and say precisely what Achilles keeps trying to add at each turn and why the addition fails to change the system's behavior.

  Then give me the residue report. Which of the claims philosophers make about the dialogue map cleanly onto the derivability/admissibility distinction or onto the separation of rules from premises? Which fit only if distorted — for instance, if the Tortoise's accepting a proposition has to be rendered as mere presence in a context, when the philosophers may mean something else by it? And which have no rendering at all: does the question of what obliges a checker to apply its own rules, rather than merely instantiate them, have any expression in a framework where rule application just is what the system does? Be careful not to smuggle in proof-theoretic assumptions and present them as the translation of a philosophical point; where the fit is loose, say so.

  Finally, commit to a judgment about where the residue belongs. Is it a blind spot in my vocabulary, which can describe rule-following but cannot answer to it, or does it indicate that the Tortoise's demand was never a demand about inference in the first place?

  After the prose, append a JSON object with the schema: `items` — an array of objects with fields `claim` (the claim or move from the dialogue, in the philosophers' terms), `translation` (your best rendering in proof-theoretic terms), `fidelity` (one of `clean`, `distorted`, `no_counterpart`), `loss` (what was lost or bent, or an empty string if nothing was), and `residue_locus` (one of `gap_in_target_vocabulary`, `confusion_in_source_debate`, `genuine_open_question`); plus `overall_verdict`, a string of two or three sentences stating and defending your judgment.
