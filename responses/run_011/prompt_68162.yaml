prompt: |-
  I coordinate a community youth track club. Last week a parent bought a mail-order DNA test advertised as showing whether a child is built for sprinting or for distance, and has asked our board whether the club should use results like hers to place nine-year-olds in events. Three other families are considering the same test before spring registration closes, so the board has given me seventy-five minutes at the next parents' meeting: about twenty-eight adults, no statistics background, folding chairs and a whiteboard, and no budget beyond paper, pens, and two decks of index cards I can prepare myself.

  Design the activity I should run. I want them to leave having felt, rather than been told, at least four things: that a heritability figure is a ratio of variances in one population under one range of environments, not a statement about any particular child; that the same trait can be almost entirely heritable in one environment and only modestly heritable in another, with nothing about the genes changing; that the genetic share of the variation they observe grows once players are allowed to choose their own training in response to what they already know about themselves; and that a high figure computed within a group licenses no inference whatsoever about a gap between two groups.

  Please give me the card mechanics and scoring rules; how the rounds are ordered so that each of those four points emerges from play rather than from my narration, with the term itself withheld until the debrief; a payoff the parents genuinely care about (placement in a mock championship lineup at the end of the evening would work), since the choice round only bites if choosing well matters; a method for the group to derive a heritability estimate from their own scores using arithmetic twenty-eight non-mathematicians can complete in the room, with no software and preferably no squared deviations; a timeline; a debrief that maps specific moments onto each point and onto what the mail-order test can and cannot support; the two or three things that will predictably go wrong the first time I run it — I expect small-sample noise to produce impossible numbers at some stage — and how to turn each failure into the lesson; and an honest statement of which feature of real heritability estimation the game cannot reproduce, so that I know what I must supply verbally.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**

      *   **Role:** Coordinator of a community youth track club.
      *   **Audience:** 28 parents (no statistics background), folding chairs, whiteboard, paper, pens, 2 decks of index cards.
      *   **Time:** 75 minutes.
      *   **Problem:** Parents want to use mail-order DNA tests to place 9-year-olds in sprint vs. distance events.
      *   **Goal:** Parents need to *feel* four specific concepts about heritability (not just be told):
          1.  Heritability ($h^2$) is a ratio of variances in *one* population/environment, not about an individual.
          2.  $h^2$ changes with environment (genes stay same).
          3.  $h^2$ increases with active gene-environment correlation (choice).
          4.  Within-group $h^2$ does not explain between-group differences.
      *   **Constraints:** No budget (paper/pens/cards only), no software, simple arithmetic (no squared deviations if possible), payoff matters (mock championship lineup), timeline included, debrief mapping, troubleshooting (what goes wrong), limitations of the model.

  2.  **Deconstruct the Four Concepts & Map to Mechanics:**

      *   *Concept 1 (Population vs. Individual):* Need a game where individual scores vary, but the *group* statistic is what matters. The "DNA test" should be a random draw that doesn't perfectly predict the outcome for *one* kid, but predicts the *group* trend.
      *   *Concept 2 (Environment):* Need two rounds with different rules (environments) where the "genes" (cards) stay the same, but the score variance changes.
      *   *Concept 3 (Choice/Correlation):* Need a round where players pick their "event" based on their "genes," increasing the correlation between gene and score.
      *   *Concept 4 (Between-Group):* Need to split the room into two groups (e.g., Team A and Team B) where one group is artificially advantaged/disadvantaged by the environment, regardless of their "genes."

  3.  **Develop the Core Mechanic: "The Gene Card"**

      *   *Idea:* Each parent represents a 9-year-old athlete. They get a "Genetic Potential" card.
      *   *Deck 1 (Genes):* Numbers 1-10 (or similar). Let's use two colors to represent "Sprint" vs. "Distance" potential, or just a raw number. Let's go with a raw "Engine Size" number (1-10) for simplicity, but the *event* determines how it translates.
      *   *Actually, better:* To simulate Sprint vs. Distance, let's have the "Gene" be a specific number, but the "Environment" determines if high numbers are good or if low numbers are good, or if variance is high/low.
      *   *Refined Idea:* Let's use the Index Cards to represent "Genetic Markers."
          *   Deck A (Red): Numbers 1-50 (Sprint Potential).
          *   Deck B (Blue): Numbers 1-50 (Distance Potential).
          *   *Wait, simpler:* Just one deck of numbers (1-10). The *Event* determines the score.
      *   *Best Mechanic for Heritability:* Heritability is $V_G / V_P$. We need to measure Variance in Phenotype ($V_P$) and estimate Variance in Genotype ($V_G$).
      *   *Simplification for Non-Math:* Instead of calculating variance directly (which requires squaring), we can use **Range** or **Mean Absolute Deviation** (too hard?), or just compare the *spread* visually on the whiteboard.
      *   *Alternative:* Use the "Twin Method" logic? No, too complex.
      *   *Alternative:* Use the "Regression to the Mean" logic? No.
      *   *Selected Approach:* We will calculate a simplified "Heritability Score" using **Range**. $h^2 \approx \text{Range}_{\text{predicted}} / \text{Range}_{\text{actual}}$. Or better: We define "Genetic Score" and "Environmental Noise."
      *   *Let's try this:*
          *   **Gene Card:** A number (1-10).
          *   **Environment Roll:** A die roll (1-6) added or subtracted.
          *   **Phenotype (Time):** Gene + Environment.
          *   *Problem:* No dice. Just cards.
          *   *Revised:*
              *   **Gene Card:** Drawn from Deck 1 (Values 10, 20, 30... 100).
              *   **Environment Card:** Drawn from Deck 2 (Values -20, 0, +20).
              *   **Score:** Gene + Environment.
              *   *Heritability Calculation:* We can't do variance easily. We can do **Correlation**. If Gene predicts Score perfectly, $h^2 = 1$. If random, $h^2 = 0$.
              *   *Arithmetic Hack:* Sort the parents by Gene Card. Sort them by Score. How much do the orders match? (Spearman rank correlation concept, simplified).
              *   *Even Simpler:* Group parents by Gene (Low, Med, High). Compare Average Scores of those groups. If High Gene = High Score, Heritability is high.
              *   *Let's go with the "Variance via Range" approach.* It's intuitive.
              *   **Total Spread (Phenotypic Variance):** Max Score - Min Score.
              *   **Genetic Spread:** Max Gene - Min Gene.
              *   *Wait, Heritability is Var(G)/Var(P).* If Environment adds noise, Var(P) increases, $h^2$ drops.
              *   *Activity:* Calculate "Group Spread" (Max - Min). Calculate "Genetic Spread" (Max - Min of genes). This is tricky because Gene Spread is constant if everyone draws from the same deck.
              *   *Better:* The "Predictability" metric. How many people finished in the top quartile who also had top quartile genes?
              *   *Decision:* Let's use a **Prediction Error** score.
                  *   Parents guess their score based on their Gene.
                  *   Actual Score = Gene + Environment.
                  *   Error = |Actual - Gene|.
                  *   Heritability Proxy = (Total Possible Error - Actual Error) / Total Possible Error.
                  *   *Too mathy.*

      *   *Pivot to the "Lineup" Payoff:* The goal is to pick the fastest kids.
      *   *Round 1 (Uniform Environment):* Everyone runs the same "race." Score = Gene Card + Random Noise Card.
      *   *Round 2 (Different Environment):* Same Cards, but Noise is bigger (more variance in environment = lower heritability).
      *   *Round 3 (Choice):* Parents choose "Sprint" or "Distance" based on Gene Card. (Gene-Environment Correlation).
      *   *Round 4 (Two Clubs):* Split room. Club A gets +10 bonus. Club B gets 0. Compare Club A vs Club B averages vs. Within Club Heritability.

      *   *The Math Problem:* 28 parents, no calculators, no squares.
      *   *Solution:* **The Whiteboard Histogram.**
          *   Parents write their Gene and Score on the board.
          *   We visually assess the spread.
          *   To get a number: **The Match Count.**
          *   Divide group into Top 10 Scores and Bottom 10 Scores.
          *   Count how many Top 10 Scores had Top 10 Genes.
          *   If 10/10 match, Heritability is High. If 5/10 match, it's Low.
          *   This is intuitive and requires only counting.

  4.  **Drafting the Activity Steps:**

      *   **Setup:** 2 Decks of Cards.
          *   Deck G (Genes): 28 cards, numbers 1-10 (distributed to ensure spread).
          *   Deck E (Environment): 28 cards, values like -2, 0, +2 (Round 1), then -5, 0, +5 (Round 2).
      *   **Payoff:** The "Championship Relay." The top 4 scorers get a prize (candy/certificate) or just bragging rights as the "Gold Team." Parents want their "child" (themselves in the sim) on the Gold Team.
      *   **Rounds:**
          1.  **Standard Training:** Score = Gene + Env (Small Noise). Calculate "Match Count."
          2.  **Chaotic Season:** Score = Gene + Env (Huge Noise). Calculate "Match Count." (Shows Env impact).
          3.  **Specialization:** Parents choose "Event" (multiply Gene by 1 or 2). High Genes choose x2. (Shows Choice impact).
          4.  **The Rival Club:** Split room. Left side gets +5 bonus on Score. Right side gets 0. Compare Group Means vs. Within-Group Match Count. (Shows Between-Group fallacy).

  5.  **Refining the Math (The "Heritability Estimate"):**

      *   We need a number they calculate.
      *   Let's use **The Prediction Success Rate**.
      *   Step 1: Sort by Gene. Mark top 14 "High Genetic Potential."
      *   Step 2: Sort by Score. Mark top 14 "Fastest Runners."
      *   Step 3: Count overlap. (How many "High Genetic" are also "Fastest"?).
      *   Step 4: Expected overlap by chance is 7 (50% of 14).
      *   Step 5: Score = (Actual Overlap - 7) / 7.
      *   Range: 0 (Chance) to 1 (Perfect).
      *   *Arithmetic:* Count overlap. Subtract 7. Divide by 7. Easy enough for 28 adults with paper.
      *   *Wait, 28 adults.* Top half is 14. Chance overlap is 7.
      *   *Formula:* $H = \frac{\text{Overlap} - 7}{7}$.
      *   If Overlap = 14, H = 1. If Overlap = 7, H = 0.
      *   This is simple, integer math.

  6.  **Addressing the Four Points:**

      1.  *Ratio/Population:* The "Overlap Score" is about the *group* match, not whether *your* card guarantees a win. (Debrief).
      2.  *Environment:* Round 2 (Big Noise) will lower the Overlap Score without changing Gene cards.
      3.  *Choice:* Round 3 allows them to pick a multiplier. High genes pick x2. Overlap Score goes up.
      4.  *Between Group:* Round 4. Left Side (Club A) vs Right Side (Club B). Club A average score is higher. But within Club A, the Overlap Score might be the same. The gap is due to the +5 bonus (Environment), not Genes.

  7.  **Timeline (75 mins):**

      *   0-5: Intro & Stakes (The Relay Team).
      *   5-20: Round 1 (Baseline). Calculate H.
      *   20-35: Round 2 (Bad Environment). Calculate H. Compare.
      *   35-50: Round 3 (Choice). Calculate H. Compare.
      *   50-65: Round 4 (Two Clubs). Compare Means vs H.
      *   65-75: Debrief & Connect to DNA Test.

  8.  **Troubleshooting:**

      *   *Issue:* Random noise might make Round 1 look perfect or Round 2 look perfect by chance.
      *   *Fix:* Pre-stack the Environment deck slightly to ensure variance, or acknowledge the noise as part of the lesson ("Small samples lie").
      *   *Issue:* Math takes too long.
      *   *Fix:* Use the Whiteboard. Parents come up and tick marks. I do the final division.
      *   *Issue:* Parents argue about the "Bonus" in Round 4 being unfair.
      *   *Fix:* That's the point. Life is unfair (environment).

  9.  **Limitations:**

      *   Real heritability uses variance (squares), not rank overlap.
      *   Real genes aren't single numbers.
      *   Need to state this clearly.

  10. **Refining the Card Mechanics:**

      *   **Deck 1 (Genome):** 28 cards. Values: Four 3s, Four 4s, Four 5s, Four 6s, Four 7s, Four 8s, Four 9s. (Mean 6).
      *   **Deck 2 (Environment):**
          *   Round 1: Ten -1s, Eight 0s, Ten +1s. (Low variance).
          *   Round 2: Ten -5s, Eight 0s, Ten +5s. (High variance).
      *   **Round 3:** They keep Gene. They choose Env: "Sprint" (Gene x 1 + 0) or "Distance" (Gene x 2 + 0). *Wait, need variance.*
      *   *Revised Round 3:* They choose "Training Focus." If Gene > 6, choose "Elite" (Score = Gene + 2). If Gene < 6, choose "Rec" (Score = Gene - 2). This simulates gene-environment correlation (talent seeks training).
      *   *Actually, let's keep it simpler:* They choose a multiplier. High genes *should* choose x2. Low genes *should* choose x1 (to avoid burnout?). No, let's say Score = Gene * Multiplier. Multiplier is 1 or 2. If High Genes pick 2, the spread increases, correlation stays high?
      *   *Better for Concept 3:* Gene-Environment *Correlation*.
      *   Mechanic: Parents look at their Gene. If Gene >= 7, they *must* draw from "Elite Env" Deck (Values +2, +3, +4). If Gene < 7, they draw from "Basic Env" Deck (Values -2, -1, 0).
      *   This creates a correlation. High genes get better environments. Heritability (predictability) goes up because the environmental noise is now systematic.

      *   *Wait, Concept 3 says:* "Genetic share of variation grows once players choose training."
      *   So, if high genes choose intense training, their scores get higher. Low genes choose fun running, scores stay low. The *variance* in scores becomes more explained by genes.
      *   Let's allow them to **Choose** their Environment Card from a face-up spread based on their Gene.
      *   Rule: If Gene is 7+, you may take a +3 Env Card. If Gene is 4-, you must take a -3 Env Card.
      *   This amplifies the genetic difference.

      *   *Let's refine Round 4 (Between Group):*
      *   Split room. Group A (Left) adds +10 to final score. Group B (Right) adds 0.
      *   Compare Average Score A vs B. (Huge gap).
      *   Compare Heritability (Overlap) within A and within B. (Should be similar).
      *   Lesson: The gap is environmental, even if heritability within groups is high.

  11. **Final Polish of the Plan:**

      *   **Title:** "The Relay Selection Simulation."
      *   **Materials:** 2 Decks of Index Cards (prepared beforehand), Whiteboard, Markers.
      *   **Payoff:** "Gold Relay Team" gets first pick of lane assignments (symbolic) or candy.
      *   **Math:** "Predictability Score" (Overlap Count).
      *   **Debrief:** Connect "Predictability Score" to "Heritability." Connect "Gene Card" to "DNA Test." Connect "Env Card" to "Coaching/Nutrition."

  12. **Self-Correction on Math:**
      *   Is (Overlap - 7) / 7 too abstract?
      *   Let's just use **% Match**.
      *   Top 14 Genes vs Top 14 Scores.
      *   Count matches. Max 14.
      *   Round 1: Maybe 10 matches (71%).
      *   Round 2: Maybe 8 matches (57%).
      *   Round 3: Maybe 13 matches (93%).
      *   This is easier. "How well did the Gene predict the Top Team?"

  13. **Addressing "Small Sample Noise":**
      *   With 28 people, random draws might skew.
      *   *Fix:* I (the coordinator) control the Environment Deck distribution to ensure the variance changes as planned, even if individual draws vary. I will pre-sort the Env cards into envelopes or piles to guarantee the *group* variance changes.

  14. **Final Review against Constraints:**
      *   75 mins? Yes.
      *   28 adults? Yes.
      *   No stats background? Yes (Rank matching is intuitive).
      *   4 Concepts? Yes (mapped to rounds).
      *   Payoff? Yes (Relay Team).
      *   Troubleshooting? Included.
      *   Limitations? Included.

  15. **Writing the Response:** Structure clearly with sections for Setup, Rounds, Math, Debrief, Troubleshooting, Limitations. Ensure tone is empathetic but firm on the science. (Self-correction: Ensure I explicitly mention *withholding the term "Heritability"* until the end).

      *   *Wait, one detail:* "The genetic share of the variation they observe grows once players are allowed to choose their own training."
      *   My Round 3 mechanic needs to reflect *choice*.
      *   *Revised Round 3:* Parents see their Gene. There are two piles of Environment cards: "Intensive Training" (High variance, high reward) and "Recreational" (Low variance, low reward).
      *   If they have a High Gene, they *choose* Intensive. If Low Gene, they *choose* Recreational.
      *   This aligns Gene and Environment, increasing the correlation.

      *   *Wait, Concept 4:* "High figure within a group licenses no inference about a gap between two groups."
      *   Round 4 needs to show High Heritability *within* groups, but the *difference between groups* is environmental.
      *   So, in Round 4, split into Club North and Club South.
      *   Club North gets +5 points automatically (Better tracks/shoes).
      *   Club South gets 0.
      *   Calculate Heritability within North. Calculate within South. Both high.
      *   Compare Average North vs Average South. Big gap.
      *   Conclusion: The gap is not genetic, even if the trait is heritable.

      *   *Okay, ready to write.*
answer: |-
  # Activity Design: "The Relay Selection Simulation"

  **Time:** 75 Minutes
  **Participants:** 28 Parents (representing 28 young athletes)
  **Materials:** Whiteboard, markers, paper, pens, 2 decks of index cards (prepared in advance).
  **Goal:** Select the top 4 athletes for the "Gold Relay Team" (Payoff: First pick of lane assignments for the season + candy).
  **Constraint:** The term "Heritability" is **never** spoken until the final 10-minute debrief. Use the phrase **"Predictability Score"** instead.

  ---

  ## 1. Preparation (Before the Meeting)

  **Deck A (Genome):** 28 Cards.
  *   Write numbers on them to ensure a normal-ish distribution.
  *   Four 3s, Four 4s, Four 5s, Four 6s, Four 7s, Four 8s, Four 9s.
  *   *Note:* This represents the "DNA Test" result.

  **Deck B (Environment):** 28 Cards.
  *   **Set 1 (Stable):** Ten -1s, Eight 0s, Ten +1s.
  *   **Set 2 (Volatile):** Ten -5s, Eight 0s, Ten +5s.
  *   **Set 3 (Correlated):** Fourteen +3s, Fourteen -3s.
  *   *Note:* Keep these sets in separate envelopes labeled "Round 1," "Round 2," and "Round 3."

  **Whiteboard Setup:**
  Draw three columns: **Parent Name**, **Gene Card**, **Final Score**.
  Draw a separate box for **Predictability Score**.

  ---

  ## 2. The Timeline & Mechanics

  ### Introduction (5 Minutes)
  *   **Hook:** "We have 4 spots on the Gold Relay Team. We want to pick the fastest kids. A parent suggested using DNA tests. Tonight, we are going to simulate three seasons to see if knowing a kid's 'Genetic Number' actually helps us pick the winners."
  *   **Stakes:** The 4 parents with the highest Final Scores at the end of the night win the Gold Relay spots for their "children."

  ### Round 1: The Baseline Season (20 Minutes)
  *   **Concept:** Heritability is population-specific (Variance Ratio).
  *   **Action:**
      1.  Each parent draws one **Genome Card** (keep it secret).
      2.  Each parent draws one **Environment Card** from **Set 1 (Stable)**.
      3.  **Score = Gene + Environment.**
      4.  Parents write Name, Gene, and Score on the board.
  *   **The Math (Predictability Score):**
      1.  Identify the **Top 14 Genes** (highlight these names on the board).
      2.  Identify the **Top 14 Scores** (circle these names).
      3.  **Count the Overlap:** How many parents are in *both* lists?
      4.  **Calculate:** $\text{Predictability} = \frac{\text{Overlap Count}}{14}$.
      5.  *Example:* If 10 people are in both lists, Score = 10/14 ≈ 71%.
  *   **Discussion:** "If we used the Gene Card to predict the Gold Team, we'd be right 71% of the time. Is that good enough to deny a kid a spot?"

  ### Round 2: The Chaotic Season (15 Minutes)
  *   **Concept:** Environment changes Heritability (Genes stay same).
  *   **Action:**
      1.  Parents keep their **Genome Card** (Genes don't change).
      2.  Parents return Env Cards and draw from **Set 2 (Volatile)**.
      3.  **Score = Gene + Environment.**
      4.  Update the board. Recalculate **Predictability Score**.
  *   **Expected Outcome:** The noise (+/- 5) swamps the Gene (3-9). Overlap will drop significantly (e.g., to 50% or less).
  *   **Discussion:** "The genes didn't change. The kids didn't change. But the 'test' became useless. Why? Because the *environment* (coaching, nutrition, luck) varied more."

  ### Round 3: The Choice Season (15 Minutes)
  *   **Concept:** Gene-Environment Correlation (Choice increases Heritability).
  *   **Action:**
      1.  Parents keep **Genome Card**.
      2.  **Choice Rule:** Look at your Gene.
          *   If Gene is **7 or higher**, you *choose* the +3 Env Card.
          *   If Gene is **6 or lower**, you *choose* the -3 Env Card.
          *   *(Explain: "High potential kids seek elite training; others stick to rec leagues.")*
      3.  **Score = Gene + Chosen Env.**
      4.  Update board. Recalculate **Predictability Score**.
  *   **Expected Outcome:** Overlap will skyrocket (near 100%). High genes got higher scores; low genes got lower.
  *   **Discussion:** "The test looks incredibly accurate now. Did the genes get stronger? No. The kids *sorted themselves* based on the genes. The test predicts the outcome because the outcome was built around the test."

  ### Round 4: The Rival Clubs (15 Minutes)
  *   **Concept:** Within-Group Heritability $\neq$ Between-Group Difference.
  *   **Action:**
      1.  Split the room physically: **Left Side (Club North)**, **Right Side (Club South)**.
      2.  Keep Round 3 Scores (High Predictability).
      3.  **The Twist:** Club North adds **+10 points** to their score (Better facilities). Club South adds **0**.
      4.  Calculate **Average Score North** vs. **Average Score South**.
      5.  Calculate **Predictability Score** *within* North and *within* South separately.
  *   **Expected Outcome:**
      *   North Average will be much higher than South.
      *   Predictability *within* North and *within* South remains high.
  *   **Discussion:** "North is faster than South. Is it because North has better genes? No, we split randomly. The gap is environmental, even though the trait is highly predictable within each club."

  ### Debrief & Connection (5 Minutes)
  *   **Reveal:** "The 'Predictability Score' you calculated is what scientists call **Heritability**."
  *   **Map the Lessons:**
      1.  **Round 1:** It's a group statistic, not an individual promise. (71% accuracy means 29% error).
      2.  **Round 2:** Change the environment, change the heritability. The DNA test doesn't know your coach or your shoes.
      3.  **Round 3:** Choice inflates the number. If you place kids based on the test, they train differently, making the test look right (Self-fulfilling prophecy).
      4.  **Round 4:** A high heritability number explains differences *inside* the club, not differences *between* clubs (or races/classes).
  *   **Final Verdict:** "Does this test tell us where to place a 9-year-old? It tells us about variance in a specific group under specific conditions. It does not tell us what *your* child can become."

  ---

  ## 3. The Math (Simplified for Non-Statisticians)

  Do not use variance or standard deviation. Use **Rank Overlap**.

  *   **N:** 28 Participants.
  *   **Cut-off:** Top 50% (14 people).
  *   **Chance Expectation:** 7 people.
  *   **Metric:** "How many of the Top 14 Genes ended up in the Top 14 Scores?"
  *   **Why this works:** It intuitively measures "Predictive Power." If Heritability is 0, overlap is ~7 (random). If Heritability is 1, overlap is 14 (perfect).
  *   **Calculation:** Just count on the whiteboard. No calculators needed.

  ---

  ## 4. Troubleshooting: What Will Go Wrong

  **Failure 1: Small Sample Noise.**
  *   *Risk:* In Round 1, by pure luck, the Environment Cards might align perfectly with Genes, giving a 100% score, or cancel out perfectly for 0%.
  *   *Fix:* **Stack the Deck.** Do not let them draw Env cards randomly from a shuffled deck. Pre-deal the Env cards into envelopes so *you* control the group variance. Ensure Set 1 has low variance and Set 2 has high variance.
  *   *Lesson Opportunity:* If the numbers look weird, say: "This is why we need large samples. With only 28 kids, luck plays a huge role. Imagine making a life decision on this much noise."

  **Failure 2: The "Unfairness" Revolt.**
  *   *Risk:* In Round 4, Club South will complain the +10 bonus is rigged.
  *   *Fix:* Lean into it. "Exactly. Life is rigged. Socioeconomic status, access to tracks, nutrition—these are the +10 points. The DNA test cannot see the +10 points. If you use the test to explain why North is faster, you are lying."

  **Failure 3: Math Takes Too Long.**
  *   *Risk:* Counting overlaps drags on.
  *   *Fix:* Give each parent a sticky dot. When you call "Top 14 Genes," they put a red dot on the board next to their name. "Top 14 Scores," blue dot. Count the names with **two dots**. Visual and fast.

  ---

  ## 5. Limitations (What You Must Say Verbally)

  The game cannot reproduce **Continuous Variance**.
  *   *The Gap:* In the game, "Gene" is a single number. In reality, thousands of genes interact.
  *   *The Fix:* Tell them: "In our game, you had one Gene Card. In reality, your child has thousands of genetic variants, each with a tiny effect. The mail-order test looks at a handful of markers and guesses the rest. It is far less accurate than even this simplified game."

  The game cannot reproduce **Age Dependency**.
  *   *The Gap:* Heritability changes with age.
  *   *The Fix:* Tell them: "We played one night. In reality, heritability of athletic performance changes as kids grow. A test taken at 9 might be irrelevant by 14."

  ---

  ## 6. Coordinator's Script for the "DNA Test" Question

  *When the parent asks again at the end:*

  "You asked if we should use the test to place kids. Tonight, you saw that a 'high predictability score' (heritability) can happen because kids chose training based on the test (Round 3), or because the environment was stable (Round 1).
  *   If we place kids based on the test, we create Round 3: We force them into environments that match the test, making the test look right, but potentially closing doors on kids who just develop late.
  *   The test measures variance in a population, not potential in a child.
  *   **Recommendation:** We do not use the test for placement. We use it, if at all, only to understand that different kids might respond differently to the *same* coaching, but we must let the running decide the runner."
