answer: |-
  Seven wanderers trace the path of the **sun**,
  Alongside silver phases of the **moon**,
  All circling round the heavy, fixed **earth**,
  Beyond the sphere of every distant **star**,
  For every wanderer counts as **planet**,
  Encased within the crystal **heaven**.

  The math inflates the vaulted **heaven**,
  To save the retrograde motion of the **sun**,
  Mars loops backward, a stubborn **planet**,
  While epicycles hide the face of **moon**,
  No parallax shifts any fixed **star**,
  All weight belongs alone to **earth**.

  Suppose we move the static **earth**,
  And crack the solid shell of **heaven**,
  Promote our fire to a fixed **star**,
  Now stillness sits inside the **sun**,
  It pulls the phases of the **moon**,
  And demotes us to mere **planet**.

  No longer call the sun a **planet**,
  When gravity binds loose **earth**,
  And tides obey the pulling **moon**,
  There is no crystal shell of **heaven**,
  Only light from the central **sun**,
  Which is itself a distant **star**.

  We join the background of the **star**,
  As just another wandering **planet**,
  Orbiting heat of the **sun**,
  No longer center of the **earth**,
  We look up into empty **heaven**,
  And see a rock, the gray **moon**.

  The old man mourns the loss of **moon**,
  Who sees no spirit in the **star**,
  He fears the void of open **heaven**,
  He says we lost the name of **planet**,
  You say we found a moving **earth**,
  He says we killed the living **sun**.

  You learn the new use of **moon**, **star**,
  Though no dictionary fits **heaven**, **planet**,
  But no map joins the **sun** to **earth**.
