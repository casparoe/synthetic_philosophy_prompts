answer: |-
  This is a sharp case study, and your memory of the historical contours is solid enough for the philosophical work you want to do. Blondlot wasn't a fraud; he was a sincere observer caught in a feedback loop of expectation. That distinction matters for the Bayesian analysis because it means we are modeling rational agents processing bad data, not liars fabricating it.

  Let's walk through the mapping, the breakdown, and the silence, keeping a sharp eye on where the consensus ends and the debate begins.

  ### 1. The Vindication: Input Probabilities vs. Certainty

  You are right to start with the vindication. Standard Conditionalization (SC) requires that when you learn $E$, your new probability $P'(E) = 1$. In the N-ray case, there was never a moment where an observer could legitimately say, "It is certain that the spark brightened." The experience was inherently noisy: a flicker, a maybe, a subjective impression.

  If you force SC onto this, you have to model the observation as something like $O =$ "It *seemed* to me that the spark brightened." You then conditionalize on $O$. But this creates a disconnect. The hypothesis $H$ is "N-rays exist," not "I have visual experiences." To get from $O$ to $H$, you need a likelihood $P(O|H)$. But if the observer is uncertain about $O$ itself (was it a flicker or a retinal afterimage?), SC has no native way to represent that uncertainty *at the moment of updating*. It treats the occurrence of the experience as certain, even if the interpretation is not.

  Jeffrey Conditionalization (JC) vindicates itself here by allowing the input to be a distribution over a partition. Let the partition be $\{E_1, E_2, ...\}$ where $E_1$ is "Spark looks brighter," $E_2$ is "Spark looks same," etc. The observer sets $P'(E_1) = 0.7$, $P'(E_2) = 0.3$.
  $$P'(H) = P(H|E_1)P'(E_1) + P(H|E_2)P'(E_2)$$

  **Settled View:** It is widely agreed among formal epistemologists that JC is descriptively superior to SC for perceptual experiences that lack "givenness." If the N-ray observers were rational agents processing uncertain sensory data, JC is the correct kinematic rule for them. SC would require a fictional layer of certainty ("I am certain I had the experience") that obscures the actual epistemic situation.

  **Contested View:** Whether this *normatively* saves the observers is another matter. Some argue that if you can't be certain of the evidence, you shouldn't be updating on it at all until you have a more robust measurement. But within the framework of "how do we update on uncertain experience," JC is the standard tool.

  ### 2. The Breakdown: The Rigidity Condition

  This is where your intuition is spot on. The rigidity condition (sometimes called the constancy condition) requires that $P_{new}(H | E_i) = P_{old}(H | E_i)$. In plain English: the diagnostic value of the evidence must remain fixed during the update. The only thing that changes is how probable you think the evidence is.

  In the N-ray affair, rigidity almost certainly failed.
  Early in 1903, "Spark looks brighter" ($E_1$) might have had a likelihood ratio of 2:1 in favor of N-rays. By early 1904, after Blondlot and others had published theories about N-ray refraction and polarization, the *meaning* of $E_1$ had shifted. It wasn't just "brightness"; it was "brightness consistent with a refracted beam." The theoretical elaboration changed the conditional probabilities $P(H | E_i)$.

  **The Fault Line:**
  *   **The Conservative View:** Rigidity is a normative constraint on rational learning. If your likelihoods are shifting, you aren't doing Jeffrey conditionalization; you're doing something else (perhaps a sequence of JC steps, or a conceptual change). On this view, the N-ray observers were irrational because they allowed their theoretical commitments to alter the diagnostic value of their sensations without explicit justification.
  *   **The Holist View:** Rigidity is an idealization that rarely holds in actual science. Theory and observation are entangled. If the N-ray case shows rigidity failing, it shows that JC is too rigid (pun intended) for real scientific practice.

  **Verdict:** The N-ray episode puts pressure on JC because the "partition" itself was drifting. The observers weren't just updating probabilities on a fixed set of perceptual outcomes; they were redefining what counted as a positive outcome. JC assumes a fixed algebra of propositions. If the meaning of $E_1$ changes, the algebra has changed, and JC is technically undefined.

  ### 3. Wood's Intervention: Channel Reliability

  Wood's prism removal is the critical test. When Wood removed the prism, the observers still reported $E_1$ ("It looks brighter").
  In JC terms, they were setting $P'(E_1)$ high.
  Wood's demonstration provided evidence $W$ that effectively severed the link between $E_1$ and $H$.

  You asked if this is evidence *through* the channel or *about* the channel. It is definitively evidence *about* the channel.
  *   **Standard JC:** Updates $P(H)$ based on $P'(E)$.
  *   **Wood's Move:** Updates $P(\text{Reliability})$.

  To model this, you need a hierarchical structure. Let $R$ be the proposition "The visual channel is reliable for detecting N-rays."
  Initially, $P(R)$ is high.
  Observation $E_1$ usually updates $H$ via $R$.
  Wood's demonstration $W$ updates $P(R)$ to near zero.
  Once $P(R) \approx 0$, observing $E_1$ no longer updates $H$.

  **Friendly Extension or Rival?**
  This is a live debate.
  *   **Friendly:** You can treat "Reliability" as just another hypothesis in the algebra. JC can update $P(R)$ just as it updates $P(H)$. Once $P(R)$ drops, the influence of $E_1$ on $H$ vanishes (mathematically, $P(H|E_1, \neg R) = P(H)$). So JC *can* handle this, provided the reliability hypothesis is already in the model.
  *   **Rival/Critical:** The problem is the **Input Problem**. JC tells you how to update *given* new probabilities for the partition ($P'(E_i)$). It does not tell you *how to derive* those new probabilities. In the N-ray case, the observers set $P'(E_1)$ high based on expectation. Wood forced them to set $P'(R)$ low. JC doesn't explain *why* Wood's evidence targets $R$ while the spark targets $H$. You need a meta-rule to decide which partition gets the update.

  **Consensus:** Most working epistemologists accept that JC requires an external account of how input probabilities are generated (a "psychology of input"). Hierarchical modeling is the standard way to formalize channel reliability, but it admits that JC alone is insufficient to explain *why* we trust the prism test more than the spark test.

  ### 4. The Sociological Accumulation (Why no skepticism?)

  You asked why hundreds of low-confidence sightings didn't wash out toward skepticism.
  If 100 scientists report $E_1$ with confidence 0.7, a naive Bayesian (or Jeffreyan) agent treating these as independent testimonies should update massively toward $H$.
  $$P'(H) \propto P(H) \times \prod P(E_{1,i} | H)$$

  The failure of skepticism suggests a failure of the **independence assumption**.
  The N-ray observers were not independent sensors. They were part of a community with shared priors (French physics prestige, desire for a discovery to rival X-rays) and shared biases (expectation effects in low-light vision).

  **Where the theory stands:**
  *   **Individualistic Scope:** JC is a rule for a single agent. It is silent on how to weight testimony unless testimony is modeled as evidence $E_{test}$.
  *   **The Bug:** If the agents modeled the testimony as independent, their update was mathematically correct *given their model*, but their model of the world (the causal structure of the testimony) was wrong. They failed to include a "Common Cause" variable (e.g., "Community Expectation") that screened off the independence of the reports.
  *   **Sociology vs. Logic:** This isn't a bug in JC; it's a bug in the agents' causal graph. However, it highlights a limitation: JC doesn't tell you to look for common causes in testimony. It just processes the probabilities you feed it.

  **Contested Position:** Some social epistemologists argue that standard Bayesianism (including JC) is fundamentally ill-equipped to handle "groupthink" because it lacks a mechanism for discounting correlated evidence without prior knowledge of the correlation. Others argue this is just a reminder that "garbage in, garbage out" applies to probability kinematics too.

  ### 5. The Silence: Abandoning the Channel

  Your suspicion is correct: **JC takes the partition as given.**
  It has no internal mechanism for saying, "This partition is useless; stop using it."
  To abandon the visual channel, you must have a hypothesis in your algebra like "Vision is useless here" ($U$). You update $P(U)$ to 1.
  But if $U$ is not in the algebra—if the possibility of total channel failure isn't conceptualized—JC cannot reach it.

  **Defending the Silence:**
  Proponents of JC argue this isn't a bug. JC is a rule of *consistency*, not a logic of *discovery*. It tells you how to change your mind coherently, not what possibilities you should be considering. The decision to abandon a channel is a conceptual change, which happens *outside* the update rule.

  **Dismantling the Silence:**
  Critics (often from the history of science side) argue that if a rule of rationality cannot model the most important scientific moves (like realizing a whole class of data is noise), it is too thin to be a general theory of scientific inference. The N-ray case is precisely about *conceptual closure*: Wood didn't just lower a probability; he closed the file. He removed the partition $\{E_1, E_2...\}$ from the relevant algebra of inquiry. JC cannot model the deletion of the partition itself.

  **The Verdict on N-Rays and Jeffrey:**
  1.  **Vindication:** JC correctly models the *micro-structure* of the N-ray observations (uncertain perceptual inputs) better than Standard Conditionalization.
  2.  **Failure:** JC fails to model the *drift* in the meaning of those observations (Rigidity violation) and the *social correlation* of the reports (Independence violation).
  3.  **Silence:** JC is silent on the *macro-structure* decision to abandon the channel entirely, unless "Channel Failure" is pre-coded as a hypothesis.

  **Final Assessment:**
  The N-ray affair doesn't falsify Jeffrey Conditionalization, but it exposes its boundaries. It works beautifully for "learning within a framework" (e.g., adjusting confidence in N-rays given a fixed understanding of vision). It breaks down for "learning about the framework" (e.g., realizing vision is the wrong tool, or that the community is biased).

  To handle N-rays fully, you need JC *plus* a hierarchical model of reliability *plus* a social network model to handle the testimony correlations *plus* an external account of how input probabilities are set.
  Is that a friendly extension? Yes, in the sense that it keeps JC as the core engine of updating.
  Is it a rival? Yes, in the sense that it admits JC is not a self-sufficient logic of scientific change. It is a constraint on change, not a generator of it.

  The lesson of N-rays is that perceptual learning rules assume a stable world and a stable observer. When the "observer" is a suggestible human in a dark room and the "world" includes the social pressure of the Nancy faculty, the stability conditions for Jeffrey's rule are violated. The theory isn't wrong; it's just operating outside its domain of applicability.
