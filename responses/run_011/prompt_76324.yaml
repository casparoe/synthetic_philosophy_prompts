answer: |-
  Right. You've done the reading, you've got the gut feeling, and you're tired of the shouting. You want the blueprint before you buy the house. That's sensible.

  Here is the specification. If a theory of famine can't tick these boxes, it's not an explanation; it's a pamphlet.

  ### The Specification: What a Theory Must Do

  **1. The "No Special Pleading" Rule (Explanatory Scope)**
  *   **The Requirement:** The theory must apply to Bengal (1943), Ireland (1840s), China (1959), and Ethiopia (1980s) using the same mechanics. It cannot say "In Bengal it was policy, but in Ethiopia it was rain."
  *   **The Worry:** Most theories are built to fit one corpse. If you have to change the rules for every case, you haven't found a cause; you've just written a description of each disaster. A universal theory needs universal levers.

  **2. The "Near-Miss" Test (Counterfactual Robustness)**
  *   **The Requirement:** It must explain why District A starved while District B, fifty miles away, with the same drought and the same war, did not.
  *   **The Worry:** This is the graveyard of lazy theories. If the explanation is "the crop failed," but the crop failed next door too and nobody died, the explanation is broken. A theory that only works backwards on the dead is useless. It needs to account for resilience, not just collapse.

  **3. The Availability/Access Distinction (Mechanism Clarity)**
  *   **The Requirement:** It must clearly state whether "no food" and "no money for food" are separate problems or the same problem viewed from different angles. It cannot fudge this.
  *   **The Worry:** In a real famine, both usually happen. Prices spike *because* food is scarce, but they spike *more* because of speculation or hoarding. If a theory says "it's only access," it ignores the physical deficit. If it says "it's only supply," it ignores the warehouse full of grain nobody can buy. A working theory has to model how the physical shortage turns into an economic lockout.

  **4. Trigger vs. Cause (The Spark and the Fuel)**
  *   **The Requirement:** It must distinguish between the shock (drought, flood, invasion) and the vulnerability (why the shock killed people).
  *   **The Worry:** Calling a drought a "cause" is like calling a spark the cause of a fire in a room full of petrol. The spark is necessary, but the petrol is the reason it burned down. A theory that stops at the weather is a weather report, not a history.

  **5. Famine vs. Chronic Hunger (The Spike)**
  *   **The Requirement:** It must explain why *this* period killed significantly more people than the year before and the year after.
  *   **The Worry:** Poverty kills more people than famines do, overall. If a theory can't distinguish the emergency spike from the background noise of malnutrition, it's just a theory of poverty. Famine is a specific event where the normal rules of survival break down completely.

  **6. Commission vs. Omission (Intent)**
  *   **The Requirement:** It must handle the difference between "we shot you" and "we let you starve while exporting grain."
  *   **The Worry:** Morally, we feel these are different. Practically, the result for the stomach is the same. A theory needs to tell us if the mechanism of death changes based on intent, or if intent is just a footnote for the historians.

  **7. Termination (How It Stops)**
  *   **The Requirement:** It must explain why the famine ended. Did the rain come? Did the price drop? Did the government change?
  *   **The Worry:** Nobody talks about this. But if you don't know what stopped it, you don't know what drove it. Famines don't just run out of victims; something shifts. If the theory can't explain the relief, it can't explain the crisis.

  ### The Two Pub Arguments

  **8. The District Officer Test (Real-Time Usability)**
  *   **The Requirement:** Can a person with a clipboard and a budget use this *before* the bodies pile up?
  *   **The Worry:** Most theories are autopsies. They are brilliant at explaining why everyone died, but useless at stopping it. If a theory requires data you only get after the harvest fails and the prices spike, it's history, not policy. A useful theory needs leading indicators (e.g., price spreads, labour migration) not lagging ones (mortality rates).

  **9. The Hundred Clerks Test (Diffused Responsibility)**
  *   **The Requirement:** Can it assign cause without a cartoon villain?
  *   **The Worry:** We want a monster to blame. Usually, there isn't one. There's a railway timetable that prioritised military grain, an export licence signed by a tired clerk, a procurement price set by a committee. A theory that requires a "genocidal maniac" to function will miss the famines caused by competent bureaucrats following reasonable rules that added up to disaster.

  ***

  ### The Verdict: Non-Negotiables vs. Taste

  Here is where you separate the steel from the paint.

  **Non-Negotiable (The theory breaks without these):**
  *   **The Near-Miss Test.** If it can't explain why the neighbour survived, it's magic, not science.
  *   **Trigger vs. Cause.** If it conflates the shock with the vulnerability, it offers no way to prevent future disasters (you can't stop the rain, but you can drain the petrol).
  *   **Termination.** If it can't explain the end, it doesn't understand the middle.

  **Taste Dressed Up as Requirement (You can argue these either way):**
  *   **Commission vs. Omission.** Whether intent matters is a moral question, not necessarily a mechanical one. A theory of *death* doesn't need to care about *malice*. A theory of *justice* does. Don't let anyone tell you a mechanical explanation is invalid because it doesn't assign moral guilt.
  *   **Real-Time Usability.** This is the big one. A theory can be historically true but operationally useless. Demanding a theory be usable by a District Officer is a demand for *policy*, not truth. However, since you want to *prevent* famine, you should treat this as non-negotiable for your own purposes, even if academics don't.

  **The Knockout Requirement:**
  **The Near-Miss Test.**
  This knocks out the "Harvests Fail" crowd immediately. Crops fail everywhere; famines don't. It also hurts the "Always Politics" crowd if they can't explain why two political systems reacted differently to the same shock. It forces the theory to look at the *link* between the shock and the stomach, not just the shock or the stomach alone.

  **The Contradiction: Real-Time vs. Responsibility**
  You are right to have a horrible feeling about this. They pull in opposite directions.
  *   **To act in real-time,** you need simple levers. "Prices are spiking, release grain." This treats the symptom.
  *   **To assign responsibility,** you need complex webs. "Prices spiked because of colonial export policy, local hoarding, and wage stagnation." This treats the system.

  In the moment of crisis, the "Hundred Clerks" truth is too slow to save lives. If you wait to untangle the railway timetable from the export licence, people die. If you just dump grain, you stop the dying but obscure the responsibility, meaning the system stays in place to do it again.
  **The list is the answer:** You cannot have a theory that is perfectly actionable *and* perfectly morally clear at the same time. You have to choose which one you need for the job.

  ***

  ### How The Three Views Stack Up

  **1. "Harvests Fail" (The Naturalist View)**
  *   **Passes:** Trigger vs. Cause (sort of).
  *   **Fails:** The Near-Miss Test (spectacularly). It cannot explain why neighbours survived. It fails the District Officer test because by the time the harvest is confirmed failed, it's too late. It ignores Termination (rain returns, but why did people stop dying before the next harvest?).
  *   **Verdict:** Useful for agronomy, useless for famine.

  **2. "It's Always Politics" (The Crime View)**
  *   **Passes:** Responsibility (very well). It finds the villain.
  *   **Fails:** The Hundred Clerks Test. It often demands a villain where there is only incompetence or chaos. It struggles with Termination (did the villain get bored?). It can struggle with Real-Time Usability because it focuses on blame rather than logistics.
  *   **Verdict:** Morally satisfying, mechanically sometimes too simple.

  **3. "Entitlements" (The Sen/Access View)**
  *   **Passes:** The Near-Miss Test (explains why some groups starved and others didn't). Availability/Access Distinction (this is its core strength). Termination (entitlements were restored).
  *   **Fails:** The District Officer Test. Measuring "entitlement failure" in real-time is incredibly hard. You need price data, wage data, employment data. By the time you have it, the famine is underway. It also struggles with the "Hundred Clerks" test by sometimes making the system so complex that responsibility vanishes into "market forces."
  *   **Verdict:** The best explanation of *how* it happens, but often too slow to stop it.

  **Summary:**
  If you want to know who to blame, look at Politics. If you want to know how the bodies died, look at Entitlements. If you want to know why the rain gets the credit, look at Harvests. But if you want to know why District A died and District B didn't, only Entitlements gets you close, provided you can get the data in time.
