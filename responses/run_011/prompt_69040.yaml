answer: |-
  **The Median Ledger**

  The air in the Audit Bureau tasted of ozone and old paper. Elara sat before the terminal, the glow of the screen illuminating the dust motes dancing in the ventilation stream. On her desk lay the file for the Harbor Silt Dredge, a project so unglamorous it had almost slipped through the budgetary cracks. It was necessary. The harbor floor was rising, inch by inch, year by year. In fifty years, the ships would ground. In eighty, the port would be a marsh.

  The file contained the cost-benefit analysis. The upfront cost was thirty million credits. There was an additional five-million credit premium required to secure the land easement from Citizen Kael. Kael had filed a Declaration of zero percent. Because he deemed a nuisance in year fifty equal to a nuisance today, his court-appointed guardian demanded full, undiscounted compensation for every year of dredging noise. That five million was the tax everyone paid for Kael's rectitude.

  Total cost: thirty-five million.
  Benefit: one hundred million credits, realized in fifty years.

  Elara tapped her calculator. She needed to know the break-even.
  At two percent, the present value was $100,000,000 / (1.02)^{50}$. She punched the keys. The denominator was roughly 2.69. The result was 37.15 million. The project passed by a slim margin of two million.
  At three percent, the denominator jumped to 4.38. The present value collapsed to 22.81 million. The project failed by twelve million.

  The current median Declaration of the polity sat at 2.45 percent. The viability threshold was 2.5 percent. Elara's own Declaration, due for renewal today, would shift the median. If she filed below 2.45, the median would drop, securing the dredge. If she filed above, the median would rise, killing it.

  She closed the file and picked up her coat. Before she filed, she needed to see the outliers.

  Kael lived in a house that smelled of damp plaster. The roof leaked, a visible stain spreading across the ceiling of the study where she found him. He was an old man, thin as a wire, sitting in a chair that faced the window.

  "They sent you to check my consistency," Kael said. He didn't turn around.

  "The guardian reported you refuse to sign the roof repair loan," Elara said. "It requires deferred payment over ten years."

  "I will not burden my future self to comfort my present self," Kael said. "Why should the man I am in ten years pay for the dryness I enjoy now? He is me. It is unjust to make him carry the debt."

  "You are living in the rain, Kael. The emergency services come here three times a winter. That costs the neighbors. They pay for your pump trucks through their taxes."

  Kael turned then. His eyes were clear, unclouded by doubt. "Time is not a currency. A pain is a pain. If I discount the future, I lie. I say that a person born tomorrow is worth less than a person born today. I will not sign that lie."

  "Your guardian says you are incompetent. You cannot bind yourself."

  "Incapable of dishonesty," Kael corrected. "The cost is yours. I bear the wet."

  Elara left the damp house for the dry heat of the city center. Joren's clinic was loud, filled with the coughing of children and the beep of monitors. Joren filed a Declaration of twelve percent. He was young, sharp-eyed, moving between beds with a kinetic energy that made Elara tired just watching him.

  "You treat the acute," Elara said, watching him stitch a wound. "You ignore the preventive."

  "Prevention is a ghost," Joren said, not looking up. "I have a child with asthma breathing particulate matter right now. Do you want me to stop stitching to plant a tree that shades a street in forty years?"

  "The Dredge project prevents the flooding that wipes out this clinic in fifty years."

  "In fifty years, I will be dead. The cells in my hand are not the cells that will hold the needle then. Why should I starve this clinic today to build a wall for a stranger who wears my name?" Joren tied off the suture and snapped the thread. "You think zero is the only virtue. But look at Kael. He is paralyzed. He cannot act because he cares too much about everyone at once. I can act because I care about *now*. If I discount, I can choose. If I don't, I drown in possibilities."

  "You discount your own future," Elara said. "But the Dredge protects people who aren't you. Children who haven't been born. What license does your mortality give you to discount them?"

  "None," Joren said. "But the state uses my number to price their world. If I say the future is worth less, the state builds less. That keeps resources here, where I can use them to save lives that actually exist. If I pretend to care about the year 2100, I might fail the year 2024. Agency requires a horizon. I cannot care about everything equally. If I try, I care about nothing effectively."

  Elara returned to the Bureau as the sun set. The breakroom was crowded. Two senior analysts, Toms and Varek, were arguing over a coffee machine.

  "It has to be three percent," Toms said, stirring sugar. "Look at the growth projections. In fifty years, per capita consumption will be double. A credit then buys half the welfare it buys now. We discount because they will be richer, not because they matter less."

  Varek shook his head. "It's the risk. There's a chance the grid fails. A chance the coast shifts. If there's a five percent annual probability the project site doesn't exist, you have to discount for uncertainty. You get roughly three percent just from the survival probability."

  "Same number," Toms said.

  "Different reason," Varek countered. "One says the future is wealthy. The other says the future is fragile. But the ledger doesn't care why. It just takes the number."

  Elara listened without speaking. They were both right, and both wrong. Toms assumed the future would arrive and be rich. Varek assumed it might not arrive at all. Kael assumed the future was certain and equal. Joren assumed the future was irrelevant to the present self.

  She went back to her desk. The terminal waited. The cursor blinked in the field for her Declaration.

  She thought of Kael in the rain, protecting a future self who would not thank him, costing his neighbors money for pump trucks. His zero percent was a form of purity that rotted the roof. It was an incapacity because it refused the trade-offs required to live. To act is to prefer the now, slightly. To build is to believe the future deserves something, but not everything.

  She thought of Joren stitching the wound. He was right that she could not care about everything equally. If she valued the child in fifty years exactly as much as the child in front of her, she would have to drain the clinic's budget to build the sea wall. She would have to starve the present to feed the future. But Joren was wrong to treat the future strangers as non-entities. They would exist. They would breathe. The continuity of the self was thin, as Joren said, but the continuity of the community was thick.

  The arithmetic sat in her head. 37.15 million versus 22.81 million. The difference was the harbor. The difference was whether the ships could dock when she was gone.

  If she filed zero, she would be declared incompetent. A guardian would manage her assets. She could not sign the lease on her apartment. She could not plan her own retirement. She would be like Kael, righteous and wet.

  If she filed twelve, like Joren, the median would rise. The Dredge would be priced out. The harbor would silt. The floodwaters would come. The cost would be borne by people who could not vote, people who were not yet born.

  The law bound her declaration in both directions. It dictated how the state treated her future self, and how it treated the future of the polity. She could not separate the intrapersonal from the intergenerational. The rate she chose for her own aging was the rate the state would use to value the lives of strangers.

  She looked at the blinking cursor. To value the future at zero was to deny the reality of time. To value it at twelve was to deny the reality of consequence.

  Elara placed her hands on the keyboard. She did not think of the philosophers who had debated this in rooms much like this one. She thought of the silt. She thought of the water rising. She thought of the roof leaking in the quiet house on the hill.

  She typed. She did not type zero. She did not type twelve. She typed a number small enough to honor the people who would come after, but large enough to allow the people now to act.

  Her finger hovered over the enter key. The median would shift by one hundredth of a percent. It would be enough.

  She pressed the key. The screen flashed: *DECLARATION ACCEPTED. RATE: 2.1%.*

  The ledger updated. The median dropped to 2.44%. The Dredge project status changed from *PENDING* to *APPROVED*.

  Elara leaned back. The ozone smell was still there. The dust motes still danced. But somewhere, in the quiet math of the state, the harbor had been saved.
