answer: |-
  1. **The Eulogy**

  We met in a classroom much like this one, though less kind, in the autumn of 1961. We were freshmen, required to take logic, and Adeline Marchetti sat two rows ahead of me. She took notes in a hand so precise it looked typeset. When the professor asked for examples of valid arguments, she gave them. When he asked for examples of comfort, she gave none. That was the beginning of a friendship that lasted sixty years, and it was conducted almost entirely on those terms. She did not offer what she did not intend to give, and she gave what she offered without reservation. To know her was to know exactly where you stood, which is a rarity in any life, and a particular mercy in a friendship.

  Adeline spent twenty-nine years on the bench, and she brought that same clarity to her work. She believed that words have meanings fixed by the time they are written, and that a judge's job is to read them, not to improve them. There are people in this room who argued with her about this, some vigorously, and some of those people are seated in the second row. I will not argue with her today, because she forbade it, and because she was not arguing for herself. She argued for the limit of her own authority. She believed that when the law caused a hardship, the remedy belonged to the legislature, not to the court. She knew this caused pain. She did not look away from it. In one case, regarding a widow and a deadline missed by two days because of a holiday, she wrote that the court had made the calendar kinder, but it had not been the court's calendar to make. The legislature changed the law two years later. Adeline called that the system working. Others called it a confession. I call it what she was: consistent.

  There are silences in her life that we might wish to fill. She did not speak of the end of her first marriage. She did not explain why she stood alone in her dissent when a narrower path was available to her. Her letters to me were four pages long for sixty years and contained no statement of feeling whatever. A conventional eulogy would tell you that these silences hid a deep well of emotion, that she was softer than she looked, that she loved you more than she said. I cannot do that. She asked me not to construe her purposively. She asked me not to supply a rationale for what she left unexplained. So I will not tell you what she meant. I will tell you what she did.

  She showed up. For thirty years, she cooked for and ran the Tuesday soup line in this parish. She did not do this to be seen. She did not do this to balance the harshness of the bench. She did it because the parish needed soup on Tuesdays and she had hands capable of lifting the ladle. When she walked into this room, she was not the judge. She was the woman who checked the inventory of canned beans and ensured the volunteers had coats for the walk to the cars. If you were grieving, she did not offer platitudes. She offered a casserole. If you were confused, she did not offer advice. She offered a ride home. This was not a code for affection. It was affection, written in a script she trusted us to read.

  Nora, you told me last year that your mother would rather have been right about a comma than good to a person. I know that charge sits heavy in your chest today. I will not tell you that you are wrong, because Adeline would not have wanted me to argue with your experience. She was exacting. She held herself to a standard that left little room for error, and she held those she loved to the same standard. That is a difficult thing to endure. But I ask you to consider the text of her life as it stands. She did not leave you. She did not change her story to suit the audience. She was the same woman at the kitchen table that she was in the courtroom. There is a safety in that consistency, even when it cuts. She loved you enough to be honest, and she respected you enough to believe you could bear the truth.

  To her grandsons: your grandmother believed that rules were not traps, but boundaries that made freedom possible. She once told me a story about a barber who shaves everyone who does not shave themselves, and she refused to get a haircut for three years because she could not decide if the barber should shave himself. It was a joke, mostly. But the point was that words matter, and promises matter, and if you say you will be there, you must be there. She was there. She taught me logic, but she taught me reliability better. When she said she would be in the front row at your school plays, she was in the front row. When she said she would help with your homework, she opened the book. She did not promise what she could not deliver. You can build a life on that kind of foundation.

  To the colleagues and clerks who sit among us: you know the weight of the robe. You know the temptation to fix what is broken, to smooth the rough edges of the statute to fit the case before you. Adeline resisted that temptation not because she lacked compassion, but because she respected the author of the law more than she respected her own impulse to help. She believed that democracy requires us to live with the laws we have until we can change them, not the laws we wish we had. That is a hard doctrine. It requires a strength that few possess. She possessed it. She did not ask for your agreement. She asked for your attention to the text.

  To the congregation and neighbors: you knew her as the woman with the ladle. You knew her as the face at the door. You did not need to know the law to know her care. She did not separate her life into compartments where justice lived apart from mercy. She believed that justice was a form of mercy, because it treated everyone by the same rule. When she served you soup, she was not judging your worth. She was acknowledging your need. That was her ministry. It was not sentimental. It was real.

  I am not here to explain Adeline Marchetti. I am here to witness her. She left us a record of her life that is clear and unadorned. She did not hide her difficulties. She did not decorate her virtues. She lived in the circumstances of her utterance, exactly where she stood. We are gathered here in the context of her death, which is a circumstance we cannot change. We cannot rewrite the statute of mortality. We cannot appeal the verdict of this illness. We can only read what remains. What remains is a woman who kept her word, who did her work, and who stayed where she said she would be. That is not a small thing. In a world of shifting meanings and hidden agendas, it is a rare and steady light. We do not need to imagine what she meant to know what she gave. We have the text. It is sufficient. It is enough.

  2. **What the Constraint Permitted**

  An ordinary eulogy functions as a purposive construction of the deceased's life: it fills silences with inferred motives, smoothes contradictions, and assures the grieving that hidden love justified visible hardness. Adeline's constraint forbade this. I identified three specific gaps where this temptation arose. First, regarding her divorce and emotional reserve: a standard eulogy would claim she "hid her pain" or "loved secretly." I instead described the silence as a fact ("Her letters... contained no statement of feeling") and framed her presence as the evidence of care, not an imputed motive. Second, regarding Nora's charge: I avoided validating or invalidating Nora's feeling ("I will not tell you that you are wrong"), respecting Adeline's refusal to overwrite another's experience with a "true" rationale. Third, regarding the *Rourke* dissent: I quoted her public reasoning without speculating on whether she sought to make a point or simply followed doctrine.

  The turn relies on Adeline's own distinction between "circumstances" (permissible context) and "purposes" (forbidden imputation). I was permitted to describe the situation of her actions (the soup line, the bench) without assigning a psychological goal. The borderline sentence is: "This was not a code for affection. It was affection, written in a script she trusted us to read." This risks defining her internal state, but it frames affection as an observable action rather than a hidden sentiment, adhering to the textualist insistence on what is written rather than what is meant.

  3. **Reading It Aloud**

  Read at a measured, deliberate pace; do not rush the pauses between paragraphs. When addressing Nora ("Nora, you told me..."), look directly at her, but do not hold the gaze longer than a sentence; acknowledge the pain without demanding a response. When mentioning the "second row," glance briefly toward Justice Doyle without signaling him out individually; this acknowledges the colleagues without turning the eulogy into a debate. Look up from the page at the start of the final paragraph ("I am not here to explain..."); this is the direct address to the room. If the room becomes restless or the grief feels too sharp during the section on Nora, pause for five seconds before continuing to "To her grandsons." The levity regarding the barber must be delivered dryly; do not smile until the children do. If you feel yourself becoming emotional, stop at "It is sufficient," breathe, and finish with "It is enough."
