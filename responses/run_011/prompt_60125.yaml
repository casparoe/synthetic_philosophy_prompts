answer: |-
  # (a) The Disagreement and Elimination

  The dispute centers on the sentence "Pluto is a planet." The assenting party (dissenting astronomers, planetary scientists, and much of the public) takes this to mean that Pluto possesses the intrinsic physical characteristics historically associated with planethood, specifically hydrostatic equilibrium (roundness) and geological complexity. Their evidence is empirical data regarding Pluto's shape, mass, and surface geology, alongside seventy-six years of lexical precedent. The dissenting party (the IAU majority) takes the sentence to mean that Pluto occupies a dynamical role of orbital dominance within the solar system. Their evidence is empirical data regarding Pluto's orbital neighborhood, its failure to clear debris, and the theoretical necessity of a limit on the number of planets to maintain classification utility.

  Applying Chalmers's method of elimination, we taboo the word *planet* and replace it with the contested descriptions. Both parties agree on the following non-semantic facts: Pluto orbits the Sun; Pluto is massive enough to be round; Pluto has not cleared its orbital neighborhood; Pluto possesses moons and geological features; Eris is similar to Pluto in size and mass. Once these facts are laid out, no disagreement remains about the physical state of the solar system.

  What survives elimination is a disagreement about classification policy. The residue is a normative dispute about which properties— intrinsic geophysical state or extrinsic dynamical context—deserve to organize the science of solar system bodies. This is not a disagreement about the world (the rocks and orbits are agreed upon) but a disagreement about what to do with a word given the world. However, it is not *merely* a confusion about meaning, as both sides understand the competing definitions; the dispute is about which definition should be authoritative. The elimination test shows the dispute is verbal in the sense that no new empirical discovery could settle it, but substantive in the sense that the choice carries consequences for how the scientific community structures its knowledge.

  # (b) Theoretical Predictions

  **Hirsch-style Quantifier Variance and Charity:** This view predicts the dispute is verbal. It suggests we can interpret both sides charitably as speaking true relative to their own conceptual schemes (one using a geophysical sortal, one using a dynamical sortal). There is no shared fact they dispute once the schemes are made explicit. This prediction holds regarding the lack of empirical disagreement, but it fails to capture the intensity of the conflict. Charity explains how both can be right, but it does not explain why only one convention can practically dominate textbooks and databases. It treats the dispute as resolvable by mutual acknowledgment of equivalence, which the episode shows was insufficient.

  **Sider-style Substantivity and Joint-Carving:** This view predicts the dispute is substantive if one candidate meaning carves nature at its joints better than the other. It asks whether "dynamically dominant body" or "round body" corresponds to a more fundamental structure of reality. This prediction partially holds, as both sides argued their definition tracked more "natural" kinds. However, substantivity does not settle the question because nature presents both structures equally well; physics supports dynamics, geology supports shape. The theory relocates the problem to "which structure is more fundamental?" without providing a metric to rank dynamical structures against geophysical ones. It risks declaring the dispute substantive without offering a way to resolve it, leaving the vote unexplained.

  **Carnapian Internal/External and Explication:** This view predicts the dispute is an external question about which linguistic framework to adopt, solvable only by pragmatic explication. The IAU is engaged in explication: refining a vague concept for a specific purpose (scientific classification). Internal questions ("Is Pluto a planet*?") are factual once the framework is chosen. This prediction holds well. It accounts for the vote as a pragmatic decision rather than a discovery of fact. It explains why the definition applies only to the Sun (a framework choice) and why exoplanets are excluded (different framework). It correctly identifies that the question was never a first-order factual one about Pluto itself, but a second-order decision about utility.

  **Easy Ontology/Deflationism:** This view predicts the answer follows trivially once the framework and empirical facts are fixed. If the rule is "clears orbit," Pluto is not a planet. This holds true post-vote but misdescribes the pre-vote episode. It treats the definition as already fixed or easily accessible, ignoring the labor and conflict required to fix the rule. It suggests the dispute should have been trivial, whereas the episode demonstrates that fixing the framework is the primary source of ontological friction. Where Carnap and Deflationism overlap is in denying a deep metaphysical fact is at stake; where they diverge is that Carnap acknowledges the pragmatic weight of the choice, while Deflationism risks treating it as too trivial to warrant the observed conflict.

  # (c) Three-Way Distinction and Framework Capacity

  Sorting the Pluto dispute using the proposed distinction:
  1.  **Merely Verbal:** No. The parties were not talking past each other; they understood the competing definitions and argued for the superiority of one over the other.
  2.  **Merely Stipulative:** No, not entirely. While the resolution was a vote (stipulation), the arguments appealed to real differences in the world (geology vs. dynamics). A merely stipulative dispute would imply the choice is arbitrary regarding the world, but the scientists argued their definition captured reality better.
  3.  **Substantive-but-indeterminate:** Yes. The world underdetermines which candidate meaning the term has. Both "round body" and "dynamically dominant body" pick out real clusters of properties. The choice must be made on pragmatic grounds (utility for classification), yet the competing choices differ in what they get right about the world (one captures formation history, the other orbital stability).

  **Framework Capacity:**
  Standard metaontological frameworks struggle to draw these lines cleanly. Hirsch and Chalmers primarily distinguish between *verbal* and *substantive*. They lack a robust category for *stipulative* disputes that are not merely verbal. In their taxonomy, a stipulative resolution often collapses into "verbal" (because it's about language) or "substantive" (because it affects truth conditions). Carnap comes closest with the internal/external distinction, where external questions are pragmatic, but he does not explicitly categorize the dispute itself as "stipulative" in an ontological sense—he treats it as non-cognitive. Sider's framework has no room for "stipulative" at all; for him, a dispute is either about joint-carving (substantive) or it is confused. To accommodate "stipulative," these views would need to add a category for disputes where the world offers multiple valid structures and the choice is governed by social authority rather than metaphysical priority. This comes at the cost of complicating the binary of "fact vs. language" and admitting that some truth-makers are institutional.

  # (d) The Direction-of-Authority Problem

  If the assembly had voted the other way, nothing in the universe would have been different. The rocks and orbits would remain unchanged. However, the truth-value of the sentence "Pluto is a planet" uttered in 2007 would differ depending on the vote. We must distinguish between changing the meaning of a word and changing the truth-value of a past sentence.

  **Theories' Commitments:**
  *   **Deflationism:** Committed to the view that truth is disquotational. If the definition changes, the truth conditions change. The sentence "Pluto was a planet in 2005" becomes false if the new definition is applied retroactively, or true if the old meaning is preserved. It struggles to explain why the IAU feels entitled to alter past truth-values.
  *   **Sider:** Committed to the view that if the joint-carving structure changes, the truth changes. If the vote selects a better carving, past statements using the worse carving might be deemed less accurate.
  *   **Carnap:** Committed to the view that the framework changed. Internal truth is relative to the framework. The IAU adopted a new framework; thus, within the new framework, the sentence is false.

  **Participants and Authority:**
  The participants did not present themselves as choosing a word; they argued they were recognizing what Pluto *is*. This suggests they viewed the dispute as substantive, not stipulative. The New Mexico memorial highlights the direction-of-authority problem: it attempts a legislative override of an astronomical verdict. This shows that stipulation binds a community through social cost and institutional power, not metaphysical force. The fact that a stipulation can bind (textbooks change, missions adapt) shows that the dispute was about language and convention, but it does not show the dispute was *merely* about language in a trivial sense. It shows that language settlement can be achieved by fiat when the world underdetermines the choice. The authority derives from the community's need for coordination, not from the IAU's access to hidden facts.

  # (e) Silences and Misdescriptions

  **Community Index:** The theories go silent on the fact that one sentence was contested by two different linguistic communities: professionals (functional need) and the public (settled usage). A dispute can be verbal for one (public usage vs. technical definition) and substantive-for-indeterminate for the other (professional utility). The method of elimination requires an index to a community; without it, the analysis conflates the public's loss of a category with the scientists' refinement of a category.

  **Non-Semantic Stakes:** The dispute carried stakes regarding mission design, funding categories, and curricula. None of the frameworks treat these practical costs as relevant to whether a dispute is verbal. For Hirsch or Chalmers, the stakes do not make a verbal dispute substantive. However, in this case, the stakes drove the substantivity. The theories misdescribe the episode by ignoring that the "ontology" was being driven by budgetary and pedagogical constraints.

  **Institutional Referee:** The existence of the IAU as a de facto authority contrasts with paradigm cases in the literature (e.g., "is a hotdog a sandwich?") where nobody is competent to close the dispute. The theories assume disputes are resolved by argument or discovery, not by ballot. This mismatch is fatal to accounts that rely on idealized rational agreement (like Hirsch's charity) because the resolution was institutional, not philosophical.

  **Sorites and Continuum:** The continuum of body sizes makes a sorites worry live. Standard metaontological cases often assume discrete entities. The Pluto case involves a vague boundary where small changes in mass or orbit shift the category. Sider's joint-carving struggles here because nature offers a continuum, not sharp joints. The theories misdescribe the case by assuming sharp boundaries are available to be carved.

  **Assessment:** The Carnapian account of explication best handles the episode as a whole. It accommodates the pragmatic choice of framework, acknowledges the internal factuality once the framework is set, and explains the authority of the IAU as adopters of a convention rather than discoverers of metaphysical truth. It avoids the trap of calling the dispute merely verbal (ignoring the stakes) or deeply substantive (implying a fact of the matter existed waiting to be found).

  The Pluto episode demonstrates that ontological disputes in science are often pragmatic decisions about classification frameworks underdetermined by physical reality.

  Verdict: substantive-but-indeterminate
