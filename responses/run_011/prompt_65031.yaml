answer: |-
  Running the 2006 episode through your friend's four accounts reveals that "planet" is not a stable target; it shifts shape depending on which philosophical lens you use.

  **1. Essence:** Under this account, a planet must have an intrinsic property that makes it what it is, regardless of context. Roundness (hydrostatic equilibrium) is the only candidate here, as it relies on internal physics. The IAU's "clearing the neighborhood" criterion fails this test immediately because it is relational, not intrinsic. Your location-dependence point destroys the Essence account: if moving a rock from the asteroid belt to the Oort cloud changes its category, the category is not in the rock. The Essence account makes the IAU look incompetent, as they legislated a relational rule for an intrinsic kind. It also has nothing to say about the vote count; essences are discovered, not voted on, so the very existence of a ballot suggests there is no essence to find.

  **2. Cluster:** Here, a planet is a bundle of properties (orbiting a star, round, clearing orbit, formed in a disk) that usually hang together. The IAU tried to tighten this cluster by making "clearing" mandatory. This account handles the Mercury exception better than Essence (Mercury is part of the cluster historically, even if slightly out of spec on roundness), but it struggles with the exoplanet disconnect. If the cluster properties differ for other stars, is it the same kind? The Cluster account makes the IAU look like gardeners pruning a hedge; they cut off the branches (Pluto, Ceres) that made the shape messy. The vote looks like an attempt to force a correlation that nature didn't fully provide.

  **3. Promiscuity:** This account says there are multiple valid ways to carve the domain. A geophysicist's "planet" (round) and a dynamicist's "planet" (dominant) are both real, serving different interests. Under Promiscuity, the IAU didn't find a truth; they installed a standard. This makes the board member (the engineer) right about the vote, but wrong about the consequence. The fight wasn't about reality; it was about jurisdiction. However, this account goes silent on why the fight was so heated. If both carvings are valid, the vote should have been administrative, not existential. Promiscuity explains the ontology but fails to explain the sociology of the room.

  **4. Explanatory-Payoff:** A kind is natural if grouping these things helps you explain or predict something. "Clearing the orbit" pays off if you want to explain solar system stability. "Roundness" pays off if you want to explain geology and potential habitability. The IAU chose the dynamical payoff. This account makes the most sense of the conflict: two groups wanted to explain different things using the same word. The vote wasn't about what Pluto *is*, but what work the word "planet" should *do*.

  **Your Hunch: The Historical Kind**
  Your intuition that "planet" is a historical kind (shared formation history) is not a fifth account, but a specific version of Account 2 (Cluster). In philosophy of biology, species are often treated as historical kinds; what makes a tiger a tiger is its lineage, not just its stripes. If "planet" means "formed by accretion in a protoplanetary disk," then Pluto and Mercury are in, and the location-dependence problem vanishes (moving a planet doesn't change its birth certificate). This saves the "nine planets" intuition without denying the physics. However, it struggles with Account 4's payoff: knowing a body's history doesn't always help you predict its current orbital behavior, which is what the IAU prioritized.

  **What the Episode Does to the Accounts**
  The Pluto episode is an anomaly for Essence and a stress test for Promiscuity.

  The location-dependence point is lethal to Account 1 (Essence). If planet-hood changes based on where an object sits, it cannot be an essence. The Mercury point is lethal to a strict Roundness-Essence but survivable for the Historical Kind.

  The "idle fight" problem you raised is the critical leverage against a naive Promiscuity. If there are many valid carvings, why did hundreds of scientists feel the need to vote one into existence? It suggests that while ontology might be promiscuous, *communication* is not. You cannot teach a solar system with two overlapping maps. The fight wasn't idle because standardization has a cost. Promiscuity is right that nature allows multiple carvings, but it goes silent on the institutional pressure to pick one. The vote wasn't about joints; it was about the friction of having too many knives.

  Account 4 (Explanatory-Payoff) survives best. It explains the heat: the dynamicists needed a category that predicted orbital stability for their models, and the geologists needed a category that predicted differentiation for their models. They weren't disagreeing about the world; they were disagreeing about which questions mattered more. The vote count matters here because it reveals that "payoff" is determined by the majority interest of the voting body, not by the universe.

  **Wall Label Copy**
  Science classifies objects to answer specific questions, and Pluto answers differently depending on whether you ask about its orbit or its geology. We use the orbital definition here for consistency, without denying the planetary complexity found on Pluto's surface.
