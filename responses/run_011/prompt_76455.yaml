answer: |-
  This is a precise and significant problem. You have identified a gap between the metaphysics of natural kinds (which tends to assume extension determines reference or vice versa) and the actual sociology of scientific inference (which allows reference to remain stable despite extensional drift).

  To answer your primary question directly: **No, there is no single established concept that captures this configuration exactly.** There are several "near neighbors" in the literature, but each strains against your description in a specific way. The configuration you describe—univocal usage, divergent non-nested extensions, successful cross-community induction—is a specific blind spot in current philosophy of science.

  Below I analyze the near neighbors to show where they fail, propose a term for the configuration you have found, and offer a carving of the "joints" implication.

  ### 1. The Near Neighbors and Their Strains

  You have already correctly ruled out homonymy, incommensurability, and boundary objects. Here are the four strongest philosophical candidates and why they do not fit your case.

  **A. Homeostatic Property Clusters (HPC) — Richard Boyd**
  *   **The Concept:** Natural kinds are not defined by necessary and sufficient conditions but by clusters of properties that co-occur due to underlying homeostatic mechanisms.
  *   **Why it's close:** It allows for vagueness and borderline cases (like your metalloids) without collapsing the kind. It explains why induction works (the homeostatic mechanism).
  *   **Where it strains:** HPC theory generally assumes *one* cluster stabilized by *one* set of mechanisms for a given kind term. In your "metal" case, you have *two* distinct clusters (chemical reactivity vs. band structure) stabilized by *different* mechanisms, yet attached to *one* term. An HPC theorist would be forced to say either (a) there is a higher-order HPC subsuming both (which risks being vacuous), or (b) these are actually two different kinds that practitioners confuse. Neither captures your observation that practitioners *correctly* treat them as one for inferential purposes.

  **B. Kind Pluralism — Marc Ereshefsky**
  *   **The Concept:** There is no single hierarchy of nature; different legitimate classifications exist for different interests (e.g., evolutionary vs. ecological kinds).
  *   **Why it's close:** It validates the existence of the two divergent profiles (chemical vs. physical) without demanding one reduce to the other.
  *   **Where it strains:** Kind pluralism typically advocates for *distinct terminology* to mark the distinct classifications (e.g., "chemical metal" vs. "physical metal"). Your case is defined by the *refusal* to split the terminology. Pluralism explains the divergence; it does not explain the semantic fusion that allows induction to migrate across the divide without translation.

  **C. Integrative Pluralism — Ingo Brigandt & Alan Love**
  *   **The Concept:** Different fields prioritize different properties of the same system to solve different problems, and integration occurs through coordination, not reduction.
  *   **Why it's close:** This is the strongest existing framework for your interdisciplinary examples. Brigandt explicitly discusses how "species" or "homology" function across fields.
  *   **Where it strains:** Brigandt's focus is on *explanatory integration* (how fields work together), not on the *semantics of the kind term* itself. His framework allows for the divergence you describe, but it treats the shared term as a site of *tension* to be managed. Your observation is that there is *no tension* experienced by the practitioners. The term does not feel like a site of negotiation; it feels like a stable referent. Integrative pluralism describes the *process* of cooperation, but not the *ontological status* of the term that makes that cooperation feel seamless.

  **D. Conceptual Spaces — Peter Gärdenfors**
  *   **The Concept:** Kinds are convex regions within a multidimensional quality space.
  *   **Why it's close:** It allows for different "domains" (e.g., a chemical domain vs. an electronic domain).
  *   **Where it strains:** In Gärdenfors' geometry, if two communities are using different domains, they are effectively talking about different objects unless there is a mapping function. Your case suggests there is no mapping function (neither is derivable from the other), yet the reference holds. Conceptual spaces struggle to explain how a term remains rigid when the "region" it picks out shifts shape depending on who is measuring it, without triggering a sense of ambiguity.

  ### 2. The Missing Concept: Inductive Syncretism

  Since the existing literature describes the *divergence* (pluralism) or the *clustering* (HPC) but not the *stable fusion of divergent profiles*, I propose we coin a term for this configuration.

  **Term:** **Inductive Syncretism** (or a **Syncretic Kind**)

  **Definition:**
  A kind term exhibits **Inductive Syncretism** when it satisfies the following four conditions:
  1.  **Profile Divergence:** At least two distinct research communities employ the term, each fixing its extension via a distinct, well-confirmed inductive profile (criteria set).
  2.  **Non-Nested Extension:** The extensions generated by these profiles are not coextensive, and neither is a subset of the other (there are unique members for each profile).
  3.  **Semantic Monism:** Despite (1) and (2), practitioners in both communities treat the term as semantically univocal. Proposals to split the term are rejected as impeding inquiry.
  4.  **Inferential Portability:** Inductive inferences secured under Profile A are accepted as valid in contexts governed by Profile B without explicit translation or caveat, despite the extensional mismatch.

  **Boundary Cases (What to Keep Out):**
  *   **Mere Vagueness:** In vagueness, the criteria are the *same* but the boundaries are fuzzy. In Syncretism, the criteria are *different* (e.g., band structure vs. cation formation).
  *   **Systematic Polysemy:** In polysemy (e.g., "book" as physical object vs. text), speakers recognize the shift in sense. In Syncretism, speakers deny the shift in sense.
  *   **Pending Reduction:** If one profile were viewed as "fundamental" and the other "approximate" (awaiting elimination), it would be a reduction case. In Syncretism, both profiles are viewed as equally robust and permanent.
  *   **Disjunctive Kinds:** If the term were understood as "A *or* B" (a disjunction), it would not support robust induction across the gap. Syncretic kinds support induction *as if* they were unified.

  ### 3. Implications for the "Joints of Nature"

  You asked what this implies for the question of whether there is one joint, two joints, or if the question is misplaced.

  If you accept Inductive Syncretism as a real phenomenon (and your evidence suggests it is), it implies that **the "joints" question is being posed at the wrong ontological level.**

  Here is the carving:

  1.  **Not One Joint:** There is no single property in the world that corresponds to the extension of "metal" that satisfies both the chemist's and the physicist's criteria simultaneously for all members (witness graphite). To claim there is one joint is to ignore the extensional divergence.
  2.  **Not Two Joints:** To claim there are two joints ("chemical-metal" and "physical-metal") is to ignore the *epistemic reality* that the term functions as a single unit of inference. If there were truly two joints, the migration of results without translation would be a category error. It is not.
  3.  **The Pragmatic Joint:** The "joint" is not a set of objects in the world, nor a concept in the head. **The joint is the interface of practice.**

  A Syncretic Kind indicates that natural kinds are not merely "out there" waiting to be carved, nor are they merely "in here" as human constructs. They are **stabilized nodes in a network of inference.**

  The term "metal" picks out a **causal node in the history of inquiry**. The reason chemists and physicists can share the term is not that they have agreed on what a metal *is* (ontology), but that they have agreed on what work the term *does* (pragmatics). The "joint" is the place where the inductive practices of two fields overlap sufficiently to allow the transfer of warrant, even if the extensions do not match.

  **Conclusion for your paper:**
  You should argue that Inductive Syncretism challenges the **Extensionalist Assumption** in the metaphysics of natural kinds (the idea that a kind is defined by its extension). Instead, it supports a **Inferentialist Account of Kinds**: a kind is defined by the stability of the inferences it supports across communities.

  The "joint" is real, but it is a **functional joint**, not a **structural joint**. It is like a dovetail joint in carpentry: the two pieces of wood (the communities) have different shapes (profiles), but they lock together to bear weight (induction). The "kind" is the lock, not the wood.

  This allows you to say: *There is one joint, but it is a joint of practice, not a joint of nature.* This avoids the relativism of "two joints" while avoiding the naivety of "one pre-existing joint." It posits that the carving itself creates the joint where the knife (the term) meets the resistance of the wood (the world) in a way that holds weight.
