  **ICDC STANDARD 442-B**
  **Certification of Dispositional Properties in Borosilicate Glassware**

  **Foreword**
  The previous edition (ICDC-442-A) was withdrawn following Incident Report 88-C, wherein a certified fragile specimen failed to shatter due to an intrinsic latency field activated upon impact. It was determined that the previous protocol did not adequately account for intrinsic dispositional removal. Complaints were also received regarding specimens shattering due to external charges despite lacking internal weakness. This edition incorporates stricter controls on causal bases, masking conditions, and intrinsic modification. Attention is drawn to the Eligibility Exclusion (Section 5.3) regarding categorical materials.

  **1. Scope**
  This Standard establishes procedures for certifying the disposition FRAGILE in borosilicate laboratory glassware. It applies only to specimens susceptible to intrinsic modification of their causal basis during stimulus application. Specimens possessing immutable structural properties are excluded.

  **2. Terms and Definitions**
  For the purposes of this document, the following terms apply:
  **2.1 Disposition:** A property of a specimen whereby a specific stimulus necessitates a specific manifestation, provided no interfering factors exist.
  **2.2 Causal Basis:** The microstructural arrangement (e.g., molecular bond weakness) grounding the disposition. This must exist prior to stimulus.
  **2.3 Fink:** An intrinsic mechanism that removes the causal basis immediately upon application of the stimulus, prior to manifestation. The specimen is not fragile if the fragility disappears upon being struck.
  **2.4 Reverse Fink:** An intrinsic mechanism that confers the causal basis only upon application of the stimulus. The specimen is not fragile if it only becomes fragile upon being struck.
  **2.5 Mask:** An extrinsic factor (e.g., protective packing, ambient pressure) that prevents the manifestation while the causal basis remains intact. The specimen remains fragile even if it does not break, provided the failure to break is attributable to a Mask.
  **2.6 Mimicker:** An extrinsic factor (e.g., external explosive charge) that produces the manifestation despite the absence of the causal basis. The specimen is not fragile if it breaks solely due to a Mimicker.
  **2.7 Normal Conditions:** Environmental parameters under which no masks, finks, or mimickers are operative. Note: Conditions are deemed Normal if the manifestation occurs consistent with the causal basis.

  **3. Apparatus**
  **3.1 Standardized Impact Hammer (SIH-5):** Calibrated to deliver 5.0 Joules of kinetic energy.
  **3.2 Causal Basis Spectrometer:** Capable of detecting latent intrinsic modifications during the stimulus interval (t0 to t1).
  **3.3 Environmental Control Chamber:** Certified to maintain Normal Conditions as defined in 2.7.

  **4. Method**
  **4.1** Place specimen in Environmental Control Chamber.
  **4.2** Verify absence of Masks using Visual Inspection Protocol V-9. If packing material is present, remove it. The disposition shall be considered present even if the specimen does not break, provided the failure to break is attributable to a Mask.
  **4.3** Verify absence of Mimickers using Background Radiation Scan. If external forces are detected that could induce shattering independent of the causal basis, the test is void.
  **4.4** Apply stimulus using SIH-5.
  **4.5** Simultaneously monitor Causal Basis using Spectrometer.
  **4.5.1** If the Causal Basis persists until manifestation (shattering), the specimen is certified FRAGILE.
  **4.5.2** If the Causal Basis vanishes prior to manifestation and the specimen remains intact, a Fink is present. The specimen is NOT certified FRAGILE.
  **4.5.3** If the Causal Basis appears only upon impact and the specimen shatters, a Reverse Fink is present. The specimen is NOT certified FRAGILE.

  **5. Validity of Results**
  **5.1** A test result shall be declared void if the specimen fails to shatter but the Causal Basis is confirmed to remain intact. This indicates a Mask was undetected.
  **5.2** A test result shall be declared void if the specimen shatters but the Causal Basis was absent at t0. This indicates a Mimicker was undetected.
  **5.3 Eligibility Exclusion:** Specimens demonstrated to be immune to intrinsic Finking mechanisms (i.e., the causal basis cannot be removed from within during stimulus) shall be classified as Categorical Solids. Such specimens are ineligible for Dispositional Certification under this standard, as their behavior is governed by structural necessity rather than propensity. This exclusion applies regardless of whether the specimen shatters.

  **6. Informative NOTE**
  *Member Dissent (Committee Vote 14-3):* Dr. H. Vogel records the following objection: "This Standard certifies that the specimen behaves as expected under conditions defined as those where it behaves as expected. Consequently, the certificate validates a linguistic framework rather than a material state. It is recommended that users understand this certification as a guarantee of consistent terminology, not necessarily physical predictability. The definition of Normal Conditions risks circularity."

  **Annex A (Informative) Troubleshooting**
  **A.1 Specimen does not shatter.**
  Check for Masks. If no Masks are found, check for Finks. If no Finks are found, check definition of Normal Conditions. If Normal Conditions are defined as "conditions where the specimen shatters," the test is circular. Refer to Standing Working Group on Triviality (SWG-T).
  **A.2 Specimen shatters unexpectedly.**
  Check for Mimickers. If none found, review Causal Basis definition. Ensure the shattering was not caused by a Reverse Fink creating the basis at t0.
  **A.3 Specimen argues back.**
  Refer to Ethics Committee. This Standard applies only to inorganic matter. Organic dispositions fall under ICDC-500-Bio.
  **A.4 Certification yields no predictive power.**
  Consult Footnote 1. Ensure that the conditions specified in the certificate match the conditions of use. If the conditions of use are not Normal, the certificate does not apply.

  **Footnote 1:** The definition of Normal Conditions is currently under review by SWG-T. Until further notice, Normal Conditions shall be assumed to exist whenever the manifestation occurs in the absence of known Masks or Mimickers. Meetings of SWG-T are held biannually; minutes are available upon request.
