  # Seminar Session Plan: The Invisible Handshake
  **Topic:** Common Prior Assumption, Agreement Theorems, and No-Trade Results
  **Duration:** 2 Hours 15 Minutes
  **Class Size:** 15 Students (13 General, 2 Economics Majors)

  ## I. Materials List

  1.  **Signal Deck:** 32 Index Cards total.
      *   16 cards marked **RED** (with a small red dot).
      *   16 cards marked **BLACK** (with a small black dot).
      *   *Note:* These are shuffled into two separate opaque envelopes labeled "Bag A" and "Bag B" by you before class.
  2.  **State Coin:** One large, visible coin. Heads = **State Red**, Tails = **State Black**.
  3.  **Currency:**
      *   100 White Poker Chips ("Tokens").
      *   15 Small Envelopes (for payouts).
      *   30 Chocolate Coins (Redeemable at 1 Coin per 10 Tokens, normally).
  4.  **Asset Certificates:** 15 printed slips reading: *"This certificate pays 10 Tokens if the State is Red. 0 Tokens if State is Black."*
  5.  **Audit Clipboards (2):** For the Economics Majors. Includes a trade log sheet and a rule checklist.
  6.  **Whiteboard Markers:** Multiple colors.
  7.  **Secret "VIP" Cards:** 5 small gold stars (stickers).

  ## II. The Mathematical Architecture (For Instructor Only)

  *   **Prior:** $P(\text{Red}) = P(\text{Black}) = 0.5$ (Established by the Coin).
  *   **Signal Structure:**
      *   If **State Red**: Bag A is used (12 RED cards, 4 BLACK cards). $P(\text{Sig=R}|\text{State=R}) = 0.75$.
      *   If **State Black**: Bag B is used (4 RED cards, 12 BLACK cards). $P(\text{Sig=R}|\text{State=B}) = 0.25$.
      *   **Posterior Calculation:**
          *   Holding **RED** card: $P(\text{State=R}|\text{Sig=R}) = \frac{0.5 \times 0.75}{(0.5 \times 0.75) + (0.5 \times 0.25)} = \frac{0.375}{0.5} = 0.75$.
          *   Holding **BLACK** card: $P(\text{State=R}|\text{Sig=B}) = 0.25$.
      *   **Asset Value:**
          *   Standard Student: RED card = 7.5 Tokens, BLACK card = 2.5 Tokens.
          *   *Simplification for Class:* Tell them the asset pays **100 Tokens** (not 10) to avoid decimals.
          *   Standard Value: RED = 75 Tokens, BLACK = 25 Tokens.
  *   **Phase 1 (The Freeze):** All 15 students receive **RED** cards. Everyone values asset at 75. No spread. No trade.
  *   **Phase 2 (The Smuggle):** 12 students receive **RED**, 3 receive **BLACK**.
      *   *The Confound:* 5 Students (including the 2 Econ majors) receive a **Gold Star**.
      *   *Rule:* Gold Star holders redeem Tokens at **2x Chocolate Coins**.
      *   *Effect:* Their *utility* for the asset is doubled, even if their *belief* is identical.
      *   *Valuation:* Star + RED card = 150 Token-Equivalent. Standard + RED card = 75 Token-Equivalent.
      *   *Result:* Trade occurs between Star holders and Non-Star holders, mimicking belief disagreement.

  ## III. Roles

  *   **General Students (13):** Traders.
  *   **Economics Majors (2):** **Market Auditors.**
      *   *Instruction:* "You are not trading today. You are the regulatory body. You stand at the whiteboard. Every trade must be logged with you. You must verify that both parties have the tokens/certificates they claim. If you spot a rule violation, you confiscate the assets. Your payment depends on market *compliance*, not market *volume*."
      *   *Why:* This gives them a high-status, active role that prevents them from solving the puzzle aloud, while utilizing their comfort with rules.
  *   **Instructor:** The Market & The State.

  ## IV. Minute-by-Minute Timeline

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **0:00-0:10** | **Intro** | Setup, Coin Flip, Signal Deal (Phase 1). |
  | **0:10-0:45** | **Phase 1** | **Trading Pit (Common Signal).** Goal: Market Freeze. |
  | **0:45-0:50** | **Reset** | Collect assets. Reset tokens. Secretly deal Stars. |
  | **0:50-1:25** | **Phase 2** | **Trading Pit (Smuggled Heterogeneity).** Goal: Active Trade. |
  | **1:25-1:45** | **Phase 3** | **Public Announcement.** "State your confidence." |
  | **1:45-2:15** | **Debrief** | Lift bans, map to theory, Morris task, Peer Disagreement link. |

  ## V. Scripted Instructions (Read Aloud)

  *(Note: Do not use the forbidden words: Prior, Posterior, Common Knowledge, Aumann, Agree to Disagree.)*

  **0:00 — Introduction & Setup**
  "Welcome. Today we are running a market. There is a State of the World: either **Red** or **Black**. I will determine this state now with a coin flip."
  *(Flip coin. Let's say Heads/Red. Do not show them the result.)*
  "The state is now fixed. It will remain fixed until the end of class.
  "I have two bags of signal cards. Depending on the State, I have selected one bag. I will deal one card to each of you. Look at it privately. Do not show it. Do not talk about the color of your card.
  "You each receive 100 Tokens. You may buy or sell **Asset Certificates**. An Asset Certificate pays **100 Tokens** if the State is Red. It pays **0 Tokens** if the State is Black.
  "Your goal is to maximize your Tokens. At the end of class, Tokens are redeemable for Chocolate Coins.
  "Trading Rules:
  1. Trades are voluntary.
  2. You may speak to anyone.
  3. **Forbidden:** You may not show your signal card. You may not say 'My card is Red.'
  4. All trades must be registered with the Auditors (nod to Econ majors) at the whiteboard.
  5. **Rationality Constraint:** Do not make a trade unless you believe it increases your expected Token count based on the information you hold. If you trade away tokens for nothing, you are losing chocolate.
  "Begin."

  **0:45 — Phase 1 Debrief (Brief)**
  "Stop. Look at your Token counts. Did anyone trade? (Likely no). Why? (Wait for answers). Keep that feeling of stillness. Return your cards and tokens to me."

  **0:50 — Phase 2 Setup (The Smuggle)**
  "We reset. The State is **still the same** as before. I am re-dealing signal cards from the same bag.
  *(Deal 12 Red cards, 3 Black cards).*
  "Additionally, I am handing out **Membership Cards** to five of you. (Hand Gold Stars to Econ majors + 3 random students).
  "New Redemption Rule: For those holding a Membership Card, 10 Tokens = 2 Chocolate Coins. For everyone else, 10 Tokens = 1 Chocolate Coin.
  "This rule is private. Do not announce if you hold a Membership Card.
  "Trading begins. Same rules."

  **1:25 — Phase 3 (Announcements)**
  "Stop trading. Leave your assets where they are.
  "We are going to go around the room. I want you to state, aloud, your **percentage confidence** that the State is Red. Just the number. Do not explain why.
  "We will go around twice."
  *(Record numbers on the whiteboard. In Phase 2, beliefs should converge to 0.75 or 0.25 based on cards, but trade happened due to the Stars.)*

  **1:45 — Debrief (The Reveal)**
  *(Lift all bans. You may now use technical terms.)*

  ## VI. The Debrief Structure (30 Minutes)

  **1. The Peer Disagreement Link (5 Minutes)**
  "Last week we asked: If a peer disagrees with you, should you change your mind? Today we asked a structural question: If you *do* disagree, is it possible you started from the same place?
  "Look at Phase 1. You all had the same information (mostly). You didn't trade.
  "Look at Phase 2. You traded. Why?
  "Did your *confidence numbers* change between Phase 1 and Phase 2? (No, the signal math was the same).
  "Then why did trade happen? (The Membership Cards / Payoff structure)."

  **2. Mapping the Theorem (10 Minutes)**
  "Write on the board: **The Agreement Result.**
  "It says: If agents share a starting point (Common Prior) and know each other's confidence levels (Common Knowledge), their confidence levels must match.
  "Which rule in our game represented the 'Starting Point'?" (The Coin/Bag setup).
  "Which rule represented 'Common Knowledge'?" (The public announcements in Phase 3).
  "In Phase 2, trade happened. The theorem says trade shouldn't happen if beliefs are common knowledge and priors are shared.
  "So, which assumption broke?
  "Group A: Argue the **Starting Point** was different.
  "Group B: Argue the **Knowledge** was incomplete.
  "Group C: Argue the **Goal** (Payoff) was different."
  *(Let them argue. Reveal the Gold Stars. Group C wins, but Groups A and B are partially right because the Stars *mimicked* belief differences.)*

  **3. The Morris Task (10 Minutes)**
  "Here is your challenge. Stephen Morris argued that we can *always* explain disagreement by assuming a larger 'State Space.'
  "Task: Re-describe Phase 2. Assume everyone had the **same** payoff structure (no Gold Stars). Construct a 'Hidden State' that explains why the Star-holders traded aggressively.
  "Example: 'Maybe the Star-holders thought the Coin was biased.'
  "Discussion: If we can *always* invent a hidden state to explain away disagreement, does the 'Common Prior' assumption mean anything empirically? Or is it just a mathematical tautology?"
  *(Facilitate: If every disagreement can be modeled as a common prior over a bigger world, the assumption has no bite. We need external constraints on what counts as a 'reasonable' prior.)*

  **4. Closing (5 Minutes)**
  "The lesson: When you see trade or disagreement, ask: Is this a difference in *information*, a difference in *goals*, or a difference in *starting assumptions*? The math looks the same. The ethics do not."

  ## VII. Predicted Failures & Fixes

  1.  **Failure:** Students show cards in Phase 1.
      *   **Fix:** The Auditors (Econ majors) are instructed to disqualify any trade where cards were revealed. "If you show, you blow the cover. You are out of the market."
  2.  **Failure:** Economics Majors explain the theorem during the pit.
      *   **Fix:** Their payout is tied to *silence*. "If anyone mentions 'probability theory' or 'Bayes' during the pit, the Audit team loses their chocolate bonus."
  3.  **Failure:** Trade happens in Phase 1 (The Freeze) due to risk-seeking.
      *   **Fix:** If trade occurs, pause the market. Ask the buyer: "Why did they sell to you?" Ask the seller: "Why did they buy from you?" Force them to articulate the inference. Usually, this kills the trade instantly.
  4.  **Failure:** The Gold Star confound is discovered immediately.
      *   **Fix:** Make the redemption happen *at the very end* in private envelopes. During Phase 2, they only know *they* have a Star, not that others *don't*. They will assume everyone might have one. This preserves the ambiguity until the debrief.

  ## VIII. Limitations (What You Must Supply in Words)

  1.  **Logical Omniscience:** The students will not instantly calculate the implication of a trade offer (i.e., "If he sells, he must have a Black card"). The game simulates this, but you must explicitly point out in the debrief that *perfect* rationality would have prevented Phase 2 trade even with the Stars, if the Stars were common knowledge.
  2.  **Finite vs. Infinite Announcements:** Phase 3 is only two rounds. Aumann's theorem requires infinite iterations or a specific communication protocol to guarantee convergence. You must clarify that the convergence they saw was approximate, not mathematical certainty.
  3.  **Belief vs. Botched Math:** A student might trade because they calculated 0.75 as 0.60. This is an error, not a prior difference. You must distinguish *irrationality* from *heterogeneity* in the debrief.

  ## IX. Connection to Peer Disagreement (Backward Link)

  *   **Where:** Start of Debrief (5 Minutes).
  *   **Script:** "Last week we discussed the 'Conciliatory View': if a peer disagrees, you should move your confidence toward theirs. Today's game shows *why* that rule exists. If you assume you share a Starting Point (Common Prior), then their disagreement is *evidence* that you missed something. You *must* move.
  "However, Phase 2 showed us a trap. If the disagreement comes from a Hidden Variable (like the Gold Star/Payoff), moving your belief is a mistake. You shouldn't change your mind about the State; you should change your mind about their *Incentives*.
  "The hard work of epistemology is telling the difference between a Peer who sees something you don't, and a Peer who wants something you don't."
