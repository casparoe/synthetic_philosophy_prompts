      *   *The Lying Incentive:* This is the hard part. If I just maximize my score, I don't need to lie. I just need to coalition.
      *   *How to force lying:* **The "Public Statement" Phase.** Before negotiating, each group writes down a "Public Position" (e.g., "We will veto any plan with <20 tokens in Health"). This is non-binding but sets the stage for bluffing.
      *   *Actually, the prompt says:* "incentive to claim you hold an uncompromisable view you don't actually hold."
      *   *Rule Change:* **The "Walk Away" Option.** If a faction is unhappy, they can "Sabotage" the deal, reducing everyone's score by 50%. To prevent this, others must bribe them.
      *   *The Bluff:* I am happy (Score 50), but I claim I am unhappy (Score 10) so you bribe me to not sabotage.
      *   *This works.* It creates a "Protection Racket" dynamic which mirrors the "Deontological Veto" problem.

  6.  **Developing the Content:**

      *   **Factions:**
          1.  *Aggregators (Util):* Value all buckets moderately.
          2.  *Equity (Prior):* Value the lowest bucket.
          3.  *Principled (Deon):* Bucket C is "Toxic". If >0 tokens, Score = 0.
          4.  *Uncertain:* Flip a coin for multipliers mid-game? No, too slow. Average of two tables.
          5.  *Specialist (Esoteric):* Only Bucket E matters.
      *   **Buckets:** Education, Health, Defense, Infrastructure, Arts. (Neutral names).
      *   **Tokens:** 100 Poker chips or paper squares.
      *   **Rounds:**
          1.  *Silent:* Each group submits a wish list. TA averages them? No, TA acts as Chair. Round 1: TA allocates equally (20 each). Calculate scores. (Baseline misery).
          2.  *Negotiation:* Groups have 20 mins to agree on a distribution. Must be signed by 4/5 groups.
          3.  *The Twist:* One group is revealed to have "Veto Power" (or budget cut). Let's go with **Budget Cut**. Total tokens drop to 80. Renegotiate.

  7.  **Addressing the "Lying" Mechanic Specifically:**

      *   To ensure the "Deontologist" bluffer wins:
      *   Rule: **The "Dissatisfaction Clause".** If any group signs the deal but scores below their "Threshold" (secretly set?), they can trigger a penalty.
      *   *Simpler:* **The "Compensation Pot".** There are 100 Budget Tokens + 20 "Bribe Tokens". Bribe tokens go directly to factions, not buckets.
      *   *Incentive:* If I claim Bucket C is toxic to me, you must pay me Bribe Tokens to agree to put tokens in Bucket C. If I was lying (I don't care about C), I keep the Bribe Tokens AND get the score from C. I win double.
      *   *This is the key.* **Side Payments are allowed.**
      *   *Constraint:* Side payments come from a limited "Political Capital" pool (20 chips).
      *   *Wait, if side payments are limited, not everyone can be bribed.* This creates competition.
      *   *Okay, Final Mechanic:*
          1.  100 Budget Chips (go to Buckets).
          2.  30 Influence Chips (go to Factions directly as points).
          3.  Deal requires 4/5 signatures.
          4.  Factions can trade Influence Chips for agreement.
          5.  *Bluff:* "I hate Bucket C. I won't sign unless you give me 10 Influence Chips." (Even if I like Bucket C).

  8.  **Timeline Check (80 mins):**

      *   0-10: Setup & Rules.
      *   10-25: Round 1 (No Trade / Dictator).
      *   25-50: Round 2 (Open Trade).
      *   50-65: Round 3 (Crisis).
      *   65-80: Debrief.
      *   *Risk:* Negotiation takes forever.
      *   *Mitigation:* Hard stop alarms. TA acts as strict timekeeper.

  9.  **Failure Analysis:**

      *   *Risk 1:* Math anxiety. *Fix:* Calculators allowed, simple multipliers (0, 1, 2).
      *   *Risk 2:* The Deontologist gets bored. *Fix:* Give them "Veto" power in Round 3.
      *   *Risk 3:* Everyone agrees too fast. *Fix:* Make the "Threshold" for signing high.
