          2.  *Prioritarian (Rawlsian):* Wants the lowest scoring faction to do better.
          3.  *Absolutist (Deontologist):* Cannot fund Project "Red". Veto threat.
          4.  *Uncertain (Clueless):* 50/50 between two scoring sheets. Risk averse.
          5.  *Single-Issue (Esoteric):* Only cares about Project "Blue". Everything else is 0.
