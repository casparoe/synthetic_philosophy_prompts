      *   **Key Constraint:** The game *must* incentivize lying/bluffing about values. If the rules don't naturally produce this, change the rules.
      *   **Deliverables:** Card texts, project menu/numbers, score sheet, timeline, debrief guide, failure analysis, 8-person variant.
