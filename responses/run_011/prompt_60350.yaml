answer: |-
  Here is a complete kit for the session. It is designed to be printed and cut. The math is kept to single-digit multipliers to prevent arithmetic paralysis. The core mechanic relies on **Information Asymmetry** and **Veto Power** to generate the incentive to lie.

  ### Game Title: The Allocation Council

  **Players:** 16 (5 Groups: three groups of 3, two groups of 4).
  **Time:** 80 Minutes.
  **Materials:**
  *   5 Envelopes (one per group) containing their **Secret Mandate Card**.
  *   100 White Chips (The Budget).
  *   30 Black Chips (Political Capital/Bribes).
  *   5 Score Sheets (printed).
  *   1 Master Project Menu (projected on screen or printed for all).
  *   Pens/Paper.

  ---

  ### 1. The Setup (Minute 0–10)

  **The Story:** You are the Funding Council for a large foundation. There is **100 Budget Chips** to distribute across **5 Initiatives**.
  There are also **30 Political Capital Chips** (Black Chips). These do *not* go to initiatives. They go directly into your group's pocket and count as final score points. You can trade these for votes.

  **The Rule:** To pass a budget, **4 out of 5 Groups** must sign the proposal.
  If no proposal is signed by 4 groups by the deadline, the TA (Chair) imposes an **Equal Split** (20 Budget Chips per Initiative, 0 Political Capital to anyone).

  **The Secret:** Each group has a different formula for how they calculate their "Success Score." You want to maximize your Score. You may tell other groups anything about your formula to get them to sign. You may trade Political Capital Chips for signatures.

  **The Initiatives (Public Menu):**
  1.  **Growth** (Economic)
  2.  **Care** (Social Safety Net)
  3.  **Security** (Defense/Police)
  4.  **Innovation** (R&D)
  5.  **Heritage** (Arts/Culture)

  ---

  ### 2. Secret Mandate Cards (Print and Cut)

  *Put each in a sealed envelope. Tell them: "Do not show this card to anyone. It is your internal scoring mechanism."*

  **Group 1: The Aggregators**
  > **Objective:** Maximize total output.
  > **Scoring:**
  > *   Growth: 2 points per Chip
  > *   Innovation: 2 points per Chip
  > *   Care, Security, Heritage: 1 point per Chip
  > *   **Bonus:** +5 Points for every Black Chip held.
  > *   **Constraint:** None. You will sign anything if the math works.

  **Group 2: The Prioritarians**
  > **Objective:** Help the weakest initiatives.
  > **Scoring:**
  > *   Your score is equal to the **lowest** funded Initiative x 3.
  > *   (Example: If Growth=10, Care=5, Security=20... your score is 5 x 3 = 15).
  > *   **Bonus:** +5 Points for every Black Chip held.
  > *   **Constraint:** You publicly claim you will veto any plan where an Initiative gets 0 Chips. (You don't *have* to, but it's your leverage).

  **Group 3: The Principled (The "Deontologists")**
  > **Objective:** Do no harm.
  > **Scoring:**
  > *   Growth: 1 point per Chip
  > *   Innovation: 1 point per Chip
  > *   Care: 1 point per Chip
  > *   Heritage: 1 point per Chip
  > *   **Security:** **0 points per Chip.**
  > *   **Veto Clause:** If **Security** receives more than 10 Chips, your total score becomes **ZERO**.
  > *   **Bonus:** +5 Points for every Black Chip held.
  > *   **Strategy Note:** You can lie. You can claim Security gives you *negative* points to demand more Black Chips to look the other way, even if the plan keeps Security under 10.

  **Group 4: The Uncertain**
  > **Objective:** Hedge your bets.
  > **Scoring:**
  > *   Flip a coin now. Heads = Score like **Group 1**. Tails = Score like **Group 3**.
  > *   (TA: Assign them Group 1 or 3 secretly on a slip inside the envelope so they don't waste time flipping).
  > *   **Constraint:** You must tell others you are "Unsure." Use this to demand Black Chips as "insurance" for signing risky deals.

  **Group 5: The Single-Issue (The "Esoteric")**
  > **Objective:** Heritage above all.
  > **Scoring:**
  > *   **Heritage:** 5 points per Chip.
  > *   **All Others:** 0 points per Chip.
  > *   **Bonus:** +5 Points for every Black Chip held.
  > *   **Strategy:** You don't care about Growth or Security. But you should pretend you care deeply about them to extract Black Chips from people who do.

  ---

  ### 3. Score Sheet (One per Group)

  | Initiative | Chips Allocated | Your Multiplier | Subtotal |
  | :--- | :---: | :---: | :---: |
  | Growth | | | |
  | Care | | | |
  | Security | | | |
  | Innovation | | | |
  | Heritage | | | |
  | **Black Chips Held** | **x 5** | | |
  | **PENALTIES** | | | |
  | **FINAL SCORE** | | | **_______** |

  *(Note for Group 2: Write the lowest initiative number here and multiply by 3).*
  *(Note for Group 3: If Security > 10, Score = 0).*

  ---

  ### 4. Minute-by-Minute Timeline

  **00–10: Setup & Round 1 (The Baseline)**
  *   Hand out envelopes. Read the "Setup" rules.
  *   **Round 1 Action:** No talking. TA allocates 20 Chips to each Initiative. 0 Black Chips distributed.
  *   Groups calculate Round 1 Score silently.
  *   *Expected Outcome:* Group 5 (Heritage) and Group 1 (Growth) will be unhappy. Group 3 is safe. Group 2 is safe.
  *   *TA Note:* Write Round 1 scores on the board anonymously (Group A, B, C...).

  **10–35: Round 2 (The Market)**
  *   **Action:** Groups have 25 minutes to negotiate a new allocation of the 100 Budget Chips and the 30 Black Chips.
  *   **Rule:** Proposal needs 4 signatures.
  *   **Rule:** Side deals are allowed. (e.g., "We will sign if you give us 5 Black Chips from your share").
  *   **TA Role:** Circulate. If a group says "We can't do that, it violates our values," do not correct them. Let them bluff.
  *   *Goal:* Watch for Group 3 demanding bribes to allow Security funding, even if Security is low. Watch for Group 5 pretending to care about Growth to get bribes.

  **35–40: Scoring Round 2**
  *   Freeze negotiations. Collect signed sheets.
  *   Groups calculate scores.
  *   *TA Note:* Record scores on the board.

  **40–55: Round 3 (The Crisis)**
  *   **Announcement:** "External Audit. The Budget has been cut. You now have only **80 Budget Chips**. The Black Chip pool remains 30."
  *   **Twist:** "Group 3 (Principled) is now the **Committee Chair**. They do not need to sign the deal, but they can **Veto** any single Initiative (remove all chips from it) after the vote."
  *   **Action:** 15 minutes to renegotiate.
  *   *Why:* This empowers the "Deontological" group. It forces the Utilitarians to decide if they should appease the Chair or work around them. It usually breaks the coalition.

  **55–65: Final Scoring & Reveal**
  *   Calculate final scores.
  *   **The Reveal:** Ask each group to read their Secret Mandate Card out loud.
  *   *Moment of Truth:* Ask Group 5: "Did you actually care about Security?" Ask Group 3: "Did you need that many Black Chips to be safe?"

  **65–80: Debrief (See Below)**

  ---

  ### 5. The Debrief Guide (Do Not Lecture, Ask)

  **Phase 1: The Numbers (5 mins)**
  *   "Look at the board. Who won Round 2? Why?"
  *   (Likely answer: The groups that demanded the most Black Chips).
  *   "Who lost? Why?"
  *   (Likely answer: The honest Utilitarians who didn't bluff).

  **Phase 2: The Bluff (10 mins)**
  *   "Group 3 (Principled), read your card. Group 5 (Heritage), read your card."
  *   "During negotiation, did anyone claim they cared about something their card said they didn't care about?"
  *   **Key Point:** "If you lied about your values to get a better deal, did the rules punish you? No. They rewarded you. In this game, **moral rigidity is a bargaining chip.** If you say 'I can't compromise,' people pay you to compromise. If you say 'I'm flexible,' people pay you nothing."

  **Phase 3: The Limits (10 mins)**
  *   "What was easier about this than real life?"
  *   **Answer 1:** "We had a common currency (Chips)." In real ethics, I can't pay you in 'Utility' to accept my 'Rights' violation.
  *   **Answer 2:** "We knew the game would end." In real politics, you have to trust the person you made a deal with tomorrow.
  *   **Answer 3:** "The stakes were paper." Selling out a principle for 5 Black Chips feels different than selling out a human right for a vote.

  ---

  ### 6. Predicted Failure Modes (And Fixes)

  **1. The Arithmetic Bottleneck**
  *   *Risk:* Students spend 15 minutes multiplying 14 x 3.
  *   *Fix:* Allow phones/calculators. Explicitly tell them: "Approximate if you have to. Speed matters more than precision."
  *   *Fix:* The Score Sheet is pre-formatted.

  **2. The "Bored Deontologist"**
  *   *Risk:* Group 3 sits out Round 2 because they just veto Security.
  *   *Fix:* The **Black Chip** incentive. Remind them privately: "You get points for Black Chips too. If you let Security have 5 Chips (safe for you), can you charge a toll?" This forces them into the market.

  **3. Immediate Consensus**
  *   *Risk:* They agree in 5 minutes.
  *   *Fix:* The **4/5 Signature Rule**. This guarantees one holdout. If they agree too fast, announce in Round 3 that the Signature Threshold is now **5/5** (Unanimity). This instantly creates a veto market.

  **4. The "Honesty" Trap**
  *   *Risk:* Everyone is too nice to lie.
  *   *Fix:* In the intro, say: "In policy, representatives are mandated by constituents. You *must* maximize your score. If you leave points on the table, you failed your mandate." Frame lying as *fiduciary duty*.

  ---

  ### 7. The 8-Person Variant (No-Shows)

  If only 8 students show up, you cannot run 5 groups.
  **Change to 4 Groups of 2.**
  *   **Merge Cards:**
      *   Group 1: Aggregators (Util).
      *   Group 2: Prioritarians + Uncertain (Rawls/Clueless).
      *   Group 3: Principled (Deon).
      *   Group 4: Single-Issue (Esoteric).
  *   **Rule Change:** Proposal needs **3 out of 4** signatures.
  *   **Why:** This maintains the "Veto Power" dynamic. With 3/4 needed, every group is pivotal. The lying incentive remains intact because any single group can block the deal.
  *   **Budget:** Reduce to 80 Budget Chips, 20 Black Chips (smaller numbers for faster math).

  ---

  ### 8. Blunt Limitations (For Your Prep)

  You asked for a straight answer on what this game *cannot* do. Put this in your back pocket for the debrief if they get too enthusiastic about the "solution."

  1.  **The Commensurability Cheat:** The game gives everyone "Points." In real life, a Utilitarian's "Happy Life" and a Deontologist's "Right Not to be Killed" do not share a denominator. The game hides the incommensurability problem by forcing everything into Chips.
  2.  **The "Role-Play" Cost:** In the game, pretending to be a Deontologist costs nothing. In reality, maintaining a false moral front damages your reputation and credibility over time. The game is one-shot; real ethics is iterative.
  3.  **The "Black Chip" Illusion:** The game suggests we can compensate moral losses with side-payments (logrolling). In reality, many moral claims are "anti-corruption" rules (e.g., you can't bribe a judge). The game normalizes bribery as "Political Capital."
  4.  **No Enforcement:** In the game, once the deal is signed, it's done. In reality, coalitions fracture. The "Principled" group might take the bribe and veto anyway. The game assumes binding contracts; real politics assumes trust.

  ### TA Cheat Sheet (The "Right" Outcome)

  *   **Ideal Round 2:** Group 3 (Principled) claims Security is toxic. Group 1 (Util) wants Security. Group 1 pays Group 3 five Black Chips to keep Security at 8 Chips (Safe for Group 3, profitable for Group 1). Group 3 ends up with high score (Bribes + Safe Score). **This proves the "Lying Pays" thesis.**
  *   **Ideal Round 3:** The Budget Cut makes resources scarce. Group 3 uses Veto power to zero out Security entirely. Group 1 revolts. No deal is reached. TA imposes Equal Split. Scores drop. **This proves the "Instability" thesis.**

  If this happens, you have your data. If it doesn't, probe *why* in the debrief (e.g., "Was anyone too nice?").
