answer: |-
  **PREP SHEET: INTERTEMPORAL CHOICE & SELF-TRUST**
  **Audience:** Behavioral Economists (Hyperbolic/Naive-Soph) + 2 Formal Epistemologists.
  **Goal:** Defend "Self-Trust as Diachronic Rationality" without collapsing into Resolute Choice or Naivety.

  ### THE EIGHT OBJECTIONS (Ordered by Damage)

  **1. The Welfare Objection (High Damage)**
  *   **Idiom:** "You're rationalizing a sure loss. If an agent ends up with less money and the same bundle because of the fee, their ex-ante welfare is lower. If your norm permits the pump, your norm permits welfare destruction. Why should policy or theory care about 'self-trust' if the outcome is dominated?"
  *   **Reply:** "I distinguish *coherence* from *welfare maximization*. A money pump demonstrates a lack of diachronic coherence, not necessarily a failure of local rationality. If my agency is fragmented (low self-trust), I am effectively different agents over time. Demanding I act for the 'ex-ante self' is asking one agent to sacrifice for another. The welfare loss is the transaction cost of fragmented agency, not a logical error. We shouldn't conflate 'rational' with 'wealth-maximizing across time' if the 'time' isn't experienced as a unified whole."
  *   **Soft Spot:** Behavioral economists *live* for welfare metrics. If you say welfare loss doesn't matter, you lose the room. Emphasize that you are diagnosing the *structure* of the choice, not endorsing the outcome.

  **2. The Dynamic Consistency Trap (High Damage)**
  *   **Idiom:** "This looks like a violation of dynamic consistency. If the plan isn't time-consistent, standard theory says the plan is flawed, not the execution. By indexing rationality to self-trust, aren't you just lowering the bar for what counts as a consistent plan?"
  *   **Reply:** "Dynamic consistency assumes a unified optimizer. I'm arguing that 'consistency' is the wrong metric when the agent correctly predicts their own preference reversal. If I know I will deviate, maintaining the plan isn't consistency; it's delusion. My view preserves a different kind of consistency: alignment between expectation and action at each node. That's a stricter epistemic requirement, even if it violates dynamic consistency."
  *   **Soft Spot:** You are fighting a standard definition. Be careful not to sound like you're redefining terms just to win.

  **3. The 'Just Sophistication' Accusation (High Damage)**
  *   **Idiom:** "This sounds exactly like the sophisticated agent who knows they have present bias. They anticipate the reversal, they don't commit, and they get pumped. What work is 'self-trust' doing that 'sophistication' doesn't already do? Is this just relabeling?"
  *   **Reply:** "Sophistication is about *knowledge* of bias; self-trust is about the *normative authority* of the prior plan. A sophisticated agent might still feel bound by their past plan (resolute choice) or might not. Self-trust determines whether the past plan even *exists* as a binding constraint. Sophistication describes the prediction; self-trust determines the decision architecture. You can be sophisticated but lack self-trust, turning the sequence into distinct games."
  *   **Soft Spot:** The distinction is subtle. If pressed, admit there is overlap but insist the *normative implication* (whether the pump is a reductio) is the novelty.

  **4. The Commitment Device Counter (Medium Damage)**
  *   **Idiom:** "If low self-trust makes nodes separate problems, why do agents with self-control problems actively seek commitment devices? That suggests they *want* to bind the future nodes into one problem. Your view implies commitment is irrational for them."
  *   **Reply:** "Commitment is the *repair* mechanism for low self-trust. It artificially unifies the nodes by removing the choice at the future node. My thesis explains *why* commitment is valuable: it restores the conditions for diachronic rationality by forcing self-trust. Without commitment, the pump isn't a reductio; with commitment, the pump is avoided. I'm explaining the demand for commitment, not denying it."
  *   **Soft Spot:** Make sure you don't imply commitment is always available or costless.

  **5. The Separation Criterion (Medium Damage)**
  *   **Idiom:** "You say expecting a departure makes the nodes 'separate problems.' That's a metaphysical claim disguised as a decision criterion. What is the threshold? Does a 10% chance of reversal make it separate? 50%? This looks unoperationalizable."
  *   **Reply:** "It's not a metaphysical claim about identity; it's about the *structure of the decision tree*. If the probability of deviation is non-zero and recognized, the backward induction changes. The threshold is whether the expectation is sufficient to alter the current optimal strategy. If I treat the future node as a chance move rather than a control node, the math changes. That's the separation."
  *   **Soft Spot:** This is the fuzziest part of your theory. Don't try to give a number. Stick to the structural change in the tree.

  **6. The Epistemic Reflection Challenge (Medium Damage - For the 2 Epistemologists)**
  *   **Idiom:** "Doesn't this violate van Fraassen's Reflection Principle? If I know my future credence/preference will differ, and I treat it as a separate problem, aren't I failing to update on my own future rationality?"
  *   **Reply:** "Reflection assumes the future self is updating on new evidence. In hyperbolic discounting, the future self isn't updating; they're time-inconsistent. Treating them as a separate problem acknowledges that the future preference isn't a 'refined view' but a 'different objective.' I'm not violating Reflection; I'm arguing Reflection doesn't apply to preference drift, only information update."
  *   **Soft Spot:** The epistemologists will know the technical limits of Reflection better than you. Don't bluff the math.

  **7. The Endogeneity Problem (Low Damage)**
  *   **Idiom:** "Self-trust seems endogenous. If I decide to trust myself, does that make me rational? Or do I need to be rational to trust myself? Isn't this circular?"
  *   **Reply:** "It's not circular; it's recursive. Self-trust is a belief state about one's own stability. It can be accurate or inaccurate. If I trust myself but am unstable, I'm irrational (false belief). If I distrust myself but am stable, I'm inefficient (unnecessary fragmentation). Rationality requires accurate self-trust, not just blind trust."
  *   **Soft Spot:** Keep this brief. It's a philosophical nitpick that won't sway the economists.

  **8. The 'So What?' (Low Damage)**
  *   **Idiom:** "Okay, the money pump argument fails under your view. But the agent still loses money. What is the practical upshot? Does this change how we model behavior?"
  *   **Reply:** "It changes how we interpret violations of transitivity. Instead of assuming broken preferences, we might be observing fragmented agency. This shifts the intervention from 'correcting preferences' to 'building self-trust' or 'designing commitment.' It changes the policy target from the agent's utility function to the agent's temporal architecture."
  *   **Soft Spot:** This is your closing pitch. Make it sound actionable.

  ---

  ### STRATEGIC CONCESSIONS
  *Buy credibility by conceding these early or when pressed:*

  1.  **Concede the Welfare Loss:** Do not fight the claim that the agent loses money. Admit it freely. "Yes, the agent ends up poorer. My claim is not that this is *good*, but that it is not *logically incoherent* given the fragmentation." This disarms the behavioral economists who think you're ignoring reality.
  2.  **Concede Binary Limitations:** Admit self-trust isn't a switch (on/off). "I'm presenting a binary model for clarity, but obviously, self-trust is a continuous variable that modulates the degree of separation between nodes." This prevents the "unoperationalizable" attack from gaining traction.

  ---

  ### THE NIGHTMARE QUESTION
  *Pray nobody asks this, because it collapses your distinction between "Rationality" and "Description."*

  **"If an agent lacks self-trust and accepts the pump, are they *rationally required* to accept the pump? Or are they merely *excused*? If they are required, you've made irrationality the norm. If they are merely excused, you haven't changed the normative standard, you've just added a mitigation clause. Which is it?"**

  *   **Why it hurts:** If you say "Required," you defend losing money as rational. If you say "Excused," you admit the Money Pump *is* a reductio, you're just offering a plea of diminished capacity.
  *   **Prep for it:** You need to argue that "Rationality" is indexed to the agent's *available architecture*. If the architecture is fragmented, the local choice is the only rationality available. It's not an excuse; it's the only game in town. (But be ready for them to call that "relativism.")
