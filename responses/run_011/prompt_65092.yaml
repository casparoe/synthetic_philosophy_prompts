      *   **Goal:** Defend this as substantive, not just relabeling naive/sophisticated or resolute choice.
      *   **Deliverable:** A prep sheet with ~8 objections (ordered by damage), phrased in audience idiom, 2-minute replies, flags on soft spots, concession strategy, and the "nightmare question."

  2.  **Deconstruct the Thesis & Audience Idiom:**
