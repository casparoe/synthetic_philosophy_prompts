answer: |-
  Scrap it. Do not run this betting pool.

  Your econ member is applying a theoretical tool (prediction markets) to a social governance problem (co-op decision making) while removing the one mechanism that makes the tool work (real financial risk). Here is why this plan fails, why your worries are mostly correct, and what you should do instead.

  ### Why the Scheme is Broken

  **1. Play money measures passion, not probability.**
  Prediction markets work because being wrong costs you real money. This forces traders to separate what they *want* to happen from what they *think* will happen.
  *   **On Worry 1 (Bias):** This is fatal. You are correct. With "house dollars," there is no penalty for lying. The member managing the new shop has a massive conflict of interest. He isn't betting on probability; he is betting on advocacy.
      *   *Speculation:* In a play-money market with high-stakes emotional outcomes, prices will not converge on truth. They will converge on which faction is more motivated to click buttons. The price will reflect lobbying effort, not business insight.
  *   **On the Board Veto:** Your instinct is right; this breaks the scheme completely. The econ member is technically correct that a non-binding market is useless, but the board is practically correct that they cannot abdicate fiduciary duty to a game.
      *   *Why it breaks:* If the board reserves the right to vote afterward, the market price no longer represents "Probability of Profit." It represents "Probability of Profit *AND* the Board approving it." This creates a feedback loop. If the price looks bad, the board might vote no, which validates the price. If the price looks good, the board might still vote no because they dislike the risk. The market signal becomes noise because the final decision rule is undefined.

  **2. Probability is not Utility.**
  Even if the market worked perfectly, it answers the wrong question.
  *   **On Worry 2 (Payroll):** Your treasurer is right. A prediction market tells you the *likelihood* of an outcome, not the *consequence* of that outcome.
      *   *Example:* The market might price "New Shop Profitable" at 60% and "Stay Put" at 70%. Purely on probability, staying put wins. But if the New Shop failing bankrupts the co-op while Staying Put merely stagnates, the risk profile is totally different. A market price cannot capture "ruin risk." It captures frequency, not severity.

  **3. On Worry 3 (Participation):**
  **This is a non-issue.** Flatly.
  In prediction market theory, you do not need high participation. You need *informed* participation. If only the eight most knowledgeable members trade, the market often works *better* than if all 24 trade, because noise traders dilute the signal. If the incentives were real, 8 traders out of 24 would be sufficient liquidity. The problem isn't the number of traders; it's that their trades mean nothing because the currency is fake.

  ### The Alternative: Structured Decision Making

  Do not try to gamify your governance. You are a worker co-op, not a hedge fund. Your legitimacy comes from democratic consent, not algorithmic optimization.

  **Step 1: Commission a "Pre-Mortem" Report (2 Weeks)**
  Instead of a betting pool, assign a small committee (including the skeptic treasurer and the expansion proponent) to produce a single document.
  *   **Requirement:** They must model the "Bad Year" scenario the treasurer is worried about.
  *   **Requirement:** They must explicitly state the "Kill Criteria." (e.g., "If cash reserves drop below $X, we close the new shop.")
  *   **Why:** This forces the "play money" energy into actual financial modeling.

  **Step 2: Secret Ballot Vote with a Supermajority Threshold**
  Run a standard vote, but change the threshold.
  *   **Rule:** Expansion requires a 75% supermajority. Staying put requires a simple majority.
  *   **Why:** Expansion introduces asymmetric risk (one bad move hurts everyone). A supermajority ensures that the minority (like your treasurer) cannot be easily steamrolled, forcing the pro-expansion side to address their concerns to get their votes.

  **Step 3: Use the Market as a Temperature Check (Optional)**
  If your econ member needs to feel heard, run the betting pool *after* the decision is made, purely for fun.
  *   **Change:** Make it explicitly advisory and non-binding.
  *   **Goal:** Use it to monitor the decision *after* you take it. If you vote to expand, and the internal market price for "Profitable" crashes to 10% the next week, you know you have an alignment problem to fix, not a decision to reverse.

  ### Summary
  Scrap the binding betting pool. It removes accountability (no real loss for being wrong) while removing democracy (binding the group to a game). Your Worry 1 and 2 are critical flaws; Worry 3 is irrelevant. Stick to a vote, but raise the threshold for expansion to protect the co-op from asymmetric risk.
