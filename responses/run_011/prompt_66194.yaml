answer: |-
  ### Committee Member's Preface & Strategic Brainstorming

  **Assessment of the Core Idea:**
  Your framing is not wrong; in fact, it is significantly stronger than the standard "Developmental" or "Title vs. Exercise" dichotomies. Committees look for proposals that identify a genuine aporia in the text and offer a structural solution rather than a hermeneutic patch. Moving the debate from *permissibility* (is the act good?) to *agency and standing* (who is licensed to judge?) aligns well with current trends in analytic medieval political philosophy. It treats Aquinas as a rigorous jurist rather than a vacillating moralist.

  However, the "Sedition Article" objection (*ST* II-II, q. 42, a. 2 ad 3) is the exact point where a committee member will try to break you. If Aquinas explicitly permits disturbance based on a harm calculus, your "epistemic impossibility" thesis risks looking like you are ignoring the text that contradicts you. You must make that objection the centerpiece of the summer work, not a footnote.

  **Brainstorming Alternatives Considered and Rejected:**
  Before settling on your current "Standing/Epistemic" reconstruction, I considered three other ways to scope this for a 10-week fellowship. I rejected them for the following reasons:

  *   **The Reception History Approach:** Tracing how the *Sentences* commentary was edited or glossed in later manuscripts to see if scribes tried to "fix" the tyrannicide passage.
      *   *Rejection:* Too historical. For a philosophy department fellowship, this lacks argumentative bite. It produces a narrative, not a thesis.
  *   **The Comparative Approach:** Contrasting Aquinas with John of Salisbury (*Policraticus*) to show Aquinas is more restrictive.
      *   *Rejection:* Scope creep. Ten weeks is not enough to master two corpora deeply enough to avoid caricature. You would spend 8 weeks reading and 2 weeks writing.
  *   **The Normative Application:** Using Aquinas to critique modern resistance theory (your friend's angle).
      *   *Rejection:* Anachronism risk. Committees often penalize "presentism" in historical proposals. It distracts from the exegesis required for your dissertation chapter.

  **Verdict:** Stick with your "Standing/Epistemic" reconstruction. It is philosophically precise, text-bound, and fits the deliverables. Below is the proposal drafted to sound like a viable 10-week project, with the necessary safeguards built in.

  ***

  # Project Proposal: Jurisdiction and Uncertainty in Aquinas on Tyranny

  **Project Summary**
  This project reconstructs Thomas Aquinas's position on tyrannicide not as a moral permission subject to development, but as a jurisdictional impossibility for private agents. Existing scholarship divides between "developmental" readings (Aquinas softened his view over time) and "distinction" readings (Aquinas permits killing usurpers but not legitimate rulers who tyrannize). Both assume the central question is the *gravity of the tyranny*. I argue Aquinas's mature position shifts the question to *standing* and *epistemic access*. The restrictive conditions in the *Summa Theologiae* and *De Regno* are not merely cautionary; they are structural barriers that no private agent can clear. The injunction to "wait for God" is not pious resignation but the logical closure of a system where private judgment lacks the authority to verify the common good against the risk of disorder.

  **Research Question**
  Does Aquinas's mature treatment of tyranny offer a narrow permission for tyrannicide, or does it construct a set of epistemic and jurisdictional conditions that function as a de facto prohibition for private agents?

  **State of the Field and Intervention**
  Current literature sorts the relevant texts (*Commentary on the Sentences*, *De Regno*, *Summa Theologiae* II-II) into two camps.
  1.  **Developmental:** The *Sentences* represent an immature permissiveness; the *Summa* represents a mature caution regarding disorder.
  2.  **Typological:** Aquinas distinguishes between a *tyrannus ex defectu tituli* (usurper, may be killed) and a *tyrannus ex parte exercitii* (legitimate title, bad exercise, must be endured).

  Both readings leave the "wait for God" passage in *De Regno* as rhetorical filler and struggle to explain why the *Summa* treats sedition against a tyrant as potentially non-seditious without granting a clear license to act. My intervention argues that Aquinas is not weighing the *badness of the tyrant* but the *capacity of the agent*. The permission exists in principle (the act can be good) but is closed in practice (no private agent has the standing or knowledge to execute it without sin). This resolves the textual tension without requiring Aquinas to have changed his mind or contradicted himself.

  **Methodology and Work Plan (10 Weeks)**

  **Weeks 1–3: Textual Mapping and Argument Schemas**
  *   **Task:** Close reading of the three key loci: *In II Sent.*, d. 44, q. 2, a. 2; *De Regno* I.6–7; *ST* II-II, q. 42 (Sedition) and q. 64 (Killing).
  *   **Output:** Create numbered argument schemas for each text. I will isolate premises regarding (a) the source of authority, (b) the definition of the common good, and (c) the risk of disorder.
  *   **Goal:** To demonstrate that the *Sentences* argument lacks the jurisdictional premises found in the later texts, rather than lacking the moral caution.

  **Weeks 4–6: The "Test Cells" Reconstruction**
  *   **Task:** Apply the "Standing/Epistemic" reconstruction to specific scenarios to test its consistency. I will map Aquinas's principles against four test cells:
      1.  **The Usurper:** A ruler with no title. (Standard permission case).
      2.  **The Legitimate Tyrant:** A ruler with title, exercising power tyrannically. (Standard prohibition case).
      3.  **The Appointed Ruler:** A ruler chosen by the community who turns. (The critical case: does the community retain standing?)
      4.  **The Superior Power:** A ruler subject to an emperor or pope. (The institutional remedy case).
  *   **Goal:** To show that the "permission" only holds where standing is public and institutional, never private.

  **Weeks 7–8: The Sedition Objection (Critical Pivot)**
  *   **Task:** Address *ST* II-II, q. 42, a. 2 ad 3, where Aquinas states that disturbing a tyrant's rule is not sedition *unless* the resulting disorder harms the subjects more than the tyranny.
  *   **The Objection:** This looks like a utilitarian harm calculation, contradicting the "epistemic impossibility" thesis. If a private agent can calculate that disorder will be less harmful, does the permission open?
  *   **Plan of Attack:** I will argue this is a *necessary* condition for public authority, not a *sufficient* condition for private action. The text specifies that the *act* is not sedition, but it does not follow that the *agent* is licensed. I will draft the core argument of the conference paper here, focusing on the distinction between the *object of the act* (which can be good) and the *circumstances of the agent* (which render it illicit for a private individual).
  *   **Goal:** Neutralize the strongest textual counter-evidence to the proposal's thesis.

  **Weeks 9–10: Drafting and Synthesis**
  *   **Task:** Write the conference paper (approx. 6,000 words) focusing on the Sedition objection and the epistemic closure. Simultaneously, expand the textual mapping into a dissertation chapter draft (approx. 10,000 words) that contextualizes the argument within Aquinas's broader theory of law and authority.
  *   **Goal:** Two distinct deliverables: one argumentative (paper), one expository (chapter).

  **Deliverables**
  1.  **Conference Paper:** "The Epistemic Closure of Tyrannicide in Aquinas." Suitable for submission to the Society for Medieval Philosophy or similar.
  2.  **Dissertation Chapter Draft:** "Jurisdiction and Judgment: Aquinas on Political Authority and Resistance."

  **Risk Management and Scoping**
  *   **Risk:** The *Sentences* commentary is too dense to map fully in three weeks.
      *   **Mitigation:** If the *Sentences* schema proves too complex, I will limit the analysis to the specific article on tyranny and rely on secondary literature for the broader context of the *Sentences* view. The *Summa* is the primary target.
  *   **Risk:** The Sedition Objection holds, and the "epistemic closure" thesis fails.
      *   **Mitigation:** The project will pivot to a "Defacto Prohibition" reading. Even if the harm calculation is possible, I will argue Aquinas views the *probability* of failure as so high that the counsel to "wait for God" remains the binding moral rule, shifting the thesis from "impossible in principle" to "prohibited in counsel."
  *   **Scope Cut:** I will not engage with the broader reception of Aquinas (e.g., Cajetan, Vitoria) during the 10 weeks. This is strictly exegesis of Aquinas's corpus. Comparative work is reserved for the dissertation's conclusion, not this summer project.

  **Failure Conditions**
  This project fails if:
  1.  I cannot distinguish the "standing" argument from the "harm calculation" in the Sedition article. If the text explicitly grants private agents the right to make the harm calculation, the "epistemic closure" thesis is untenable.
  2.  The distinction between *De Regno* and the *Summa* collapses. If the texts are too inconsistent to form a coherent "mature view," I must revert to the Developmental reading, which is a less novel contribution.

  **Conclusion**
  This project offers a resolution to a stalemate in Aquinas scholarship by reframing the problem from moral theology to political jurisdiction. It is tightly scoped for ten weeks, prioritizes the most difficult textual objection, and yields immediate writing products for the job market and dissertation.
