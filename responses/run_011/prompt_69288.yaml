      *(Self-Correction on the "Son" case)*: The participant said "nothing his son does can be a genuine harm to him" (Axiological - Defensible Stoically) AND "therefore under no obligation to feel or do anything" (Normative - Questionable). The "therefore" is the leap. I need to point out that the Axiological claim doesn't necessarily entail the Normative passivity regarding *duty*.

