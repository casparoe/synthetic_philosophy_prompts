      *Refining based on User's constraints:* The user asked for specific parameters (kind of control, whose, over what, time). I need to make sure each thesis hits these.

      *   *Thesis A (The Hard Determinist/Compatibilist Internalism):* Only internal judgments are "up to us." External outcomes are never fully controlled.
      *   *Thesis B (The Pragmatic Efficacy):* Focus on levers where you have *some* causal influence, ignore those where you have *none*.
      *   *Thesis C (The Emotional Regulation):* Focus on what you control to maintain equanimity; externals shouldn't disturb you.
