      *   **Goal:** Provide disambiguation and assessment to help the user argue for retiring or rewriting the motto. No references/reading list needed.

  2.  **Deconstruct the Motto ("Focus on what you can control"):**
      *   The phrase is a pop-Stoic simplification of the *Dichotomy of Control* (Epictetus, *Enchiridion* 1).
      *   The user's intuition is correct: the phrase is ambiguous and often misused to justify passivity or emotional detachment in inappropriate contexts.
      *   I need to generate distinct interpretations (theses) that capture the logical space.

