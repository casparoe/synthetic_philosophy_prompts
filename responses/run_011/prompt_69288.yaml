      *   *Trichotomy:* Epictetus actually implies a trichotomy in practice (things up to us, things not, things mixed). The motto implies a dichotomy. Acknowledging the "partly" category saves the nurse's escalations (she has *some* influence).

  5.  **Addressing the Specific Cases:**
      *   *Nurse Case:* Facilitator used a version of "Causal Sufficiency" (You can't guarantee staffing) or "Axiological Boundary" (Staffing isn't your moral duty). This is a misapplication. The nurse has *influence* (Trichotomy).
