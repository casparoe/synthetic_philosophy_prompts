answer: |-
  **TO:** The Fellowship Jury
  **FROM:** [Juror Name]
  **DATE:** 10th [Month]
  **SUBJECT:** Recommendation for Resolution of Fellowship Tie

  **Recommendation**

  We face a rare equilibrium: two candidates indistinguishable under our published rubric, yet distinct in profile. I recommend we resolve this through structured deliberation aimed at reaching a majority ranking based on the existing criteria, without altering the rubric weights or incorporating excluded personal circumstances. We must complete this process by the 18th to allow notification before the competing offer expires on the 25th. This course honors the founding deed, maintains procedural integrity, and fulfills our duty to judge.

  **The Deed and the Judgment**

  The founding deed directs us to award the single candidate judged "most deserving." A lottery satisfies the law but vacates the judgment. If we draw lots, we admit we cannot identify the most deserving candidate, only that we must pick one. This contradicts the deed's mandate. We are constituted as a jury of merit, not a mechanism of chance. To declare a tie permanent is to claim the candidates are identical in deservingness. They are not. Candidate A leads in originality and significance; Candidate B in rigor and feasibility. These are different kinds of merit. The deed requires us to weigh these kinds against the foundation's purpose. A lottery refuses that weightings. It selects a recipient but leaves the question of deservingness unanswered. We cannot sign a statement of grounds stating "we did not decide who was more deserving."

  **The Instrument and the Candidates**

  We must determine whether this tie is evidence about the candidates or the instrument. It is evidence about the instrument. The rubric reduces complex scholarly profiles to forty discrete points. A tie to the second decimal place across two blind scorings indicates the rubric lacks the granularity to distinguish these specific profiles, not that the profiles are identical. The swapped leads across scoring rounds confirm this: the candidates are different, but our tool measures them as equal.

  To settle this, we must look to the material we have. We possess the dossiers and the criterion definitions. We do not need new data; we need deeper interpretation. We must ask: for this specific fellowship, is originality more vital than feasibility? The rubric assigns weights, but those weights are static. We cannot change them, but we can interpret them. We must deliberate on which profile better embodies the foundation's mission as understood today. The tie is a signal to exercise qualitative judgment, not to cease judgment.

  **Constraints on Procedure and Information**

  Two constraints limit our path. First, may we alter the basis of comparison? Once applications are received under a published rubric, changing the weights retroactively is impermissible. Applicants structured their proposals based on the stated criteria. To reweight now is to change the rules of the game after the play has concluded. It introduces arbitrariness and exposes the foundation to valid appeal. We must work within the existing weights, interpreting their application rather than their numerical value.

  Second, may a tie-breaker draw on material that a score may not? The 2016 policy states scoring must rest on merit alone, excluding financial need, career stage, and institutional prestige. A tie-break is the final stage of scoring. To introduce excluded factors now would violate the policy's intent. If career stage is irrelevant to merit in the initial scoring, it cannot become relevant when the scores are equal. To hold otherwise is to suggest that merit matters less when candidates are close. We must remain consistent. The candidate near retirement and the candidate with the competing offer must be judged on the same merit criteria as the rest of the field.

  **Operational Plan**

  To meet the 25th deadline while respecting the need for deliberation, I propose the following steps:

  1.  **Meeting (14th):** We convene for a maximum of three hours. Each juror states which candidate they favor and why, referencing only the four criteria.
  2.  **Deliberation:** We discuss the relative importance of originality versus rigor in the context of the foundation's history. We do not re-score numerically.
  3.  **Decision (18th):** If consensus is not reached on the 14th, we circulate a final vote by email due by the 18th. A majority decides.
  4.  **Notification (20th):** The Chair notifies the successful candidate. This allows time for board appeal procedures before the 25th expiration.

  **The Case for the Lottery**

  The strongest argument against this plan is the Chair's proposal for a lottery. The advocate for this view argues that any tie-breaker we articulate is merely a private preference in formal dress. If the instrument cannot distinguish them, any distinction we manufacture is subjective bias. A lottery is honest about the absence of a ranking. It tells both candidates that neither has been judged second; both remain equals, and chance alone decides. This preserves the dignity of the unsuccessful candidate better than a split decision based on murky qualitative grounds. It acknowledges the limits of our knowledge.

  This case does not carry because it confuses humility with abdication. We are paid to judge. Subjectivity is inherent in evaluating merit; the rubric attempts to structure it, not eliminate it. When the structure reaches its limit, human judgment must resume. To retreat to chance is to deny the purpose of the jury. Furthermore, the deed requires us to judge deservingness. A lottery explicitly refuses to do so. We can acknowledge the difficulty of the choice without surrendering the responsibility to make it.

  **Conclusion**

  We have the tools to decide. The tie is a challenge to our deliberation, not a stop sign. By adhering to the existing rubric and excluding non-merit factors, we protect the integrity of the process. By deciding before the 25th, we protect the candidates' interests. I ask that we commit to this path on the 14th.
