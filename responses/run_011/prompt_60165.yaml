answer: |-
  Here are ten questions tailored to your constraints. Each is under 30 seconds spoken, with no editorializing. I've included the likely answer based on her stated view, plus a follow-up keyed specifically to that response.

  **1. The Redundancy Objection**
  **Question:** If "some" lexically carries "not all," why doesn't "some but not all" sound redundant? Usually stating what's already said feels like stuttering.
  **Likely Answer:** She'll say it's acceptable for emphasis or reinforcement, not semantic stuttering.
  **Follow-up:** If it's emphasis, why doesn't "all but all" work the same way?

  **2. Embedding Tests**
  **Question:** Standard implicatures vanish under negation. If your alternatives are lexical or part of what is said, they should embed. Do scalar inferences survive inside "If some students passed..."?
  **Likely Answer:** She'll argue context shifts or the lexical trigger is sensitive to operators.
  **Follow-up:** If the lexical item is sensitive to operators, isn't that just reinventing the maxim-based derivation you wanted to delete?

  **3. Free Choice Inferences**
  **Question:** Free choice inferences, like "you may have cake or ice cream" implying you may have both, aren't scalar. Is this lexical too, or does it fall under your "what is said" enrichment?
  **Likely Answer:** She'll classify it as pragmatic enrichment of "what is said" based on context norms.
  **Follow-up:** If it's context-driven enrichment, what stops it from being just a renamed conversational implicature?

  **4. Calculability vs. Unconscious**
  **Question:** Grice insisted implicatures be calculable. Your enrichment is unconscious. Do you keep the calculability requirement, and if not, how do you explain cancellation?
  **Likely Answer:** She'll drop calculability as a psychological process but keep it as rational reconstruction.
  **Follow-up:** If it's not a psychological process, what explanatory work is "calculability" actually doing for you?

  **5. Cancellability**
  **Question:** You lean on cancellability to rule out implicatures. But I can retract almost any claim with "just kidding." Doesn't that criterion make the category too broad?
  **Likely Answer:** She'll distinguish between explicit cancellation and contextual contradiction.
  **Follow-up:** Where's the line? If context can block a lexical meaning, is it really lexical?

  **6. Substantive vs. Verbal**
  **Question:** Is this a substantive disagreement or just relabeling? What explanatory power do we lose if we keep Grice's vocabulary but adopt your mechanisms?
  **Likely Answer:** She'll say we lose the commitment to a specific reasoning module; it changes the psychology.
  **Follow-up:** If the psychology changes but the predictions match, how do we test who's right?

  **7. Modified Occam's Razor**
  **Question:** Grice's Modified Occam's Razor warns against multiplying senses. Your view seems to multiply lexical entries. How do you reconcile that?
  **Likely Answer:** She'll argue senses are cheaper than multiplying cognitive mechanisms like maxims.
  **Follow-up:** At what point do enough cheap senses become more expensive than one mechanism?

  **8. The Garage Case**
  **Question:** Take the garage case. You say context fleshed out the content instantly. How does the hearer know *which* enrichment to apply without reasoning about my goals?
  **Likely Answer:** She'll cite pattern recognition based on shared background, not maxim reasoning.
  **Follow-up:** Isn't pattern recognition just a heuristic version of maxim-based reasoning?

  **9. The Chatbot Wildcard**
  **Question:** Chatbots generate "some" inferences without having intentions. On your view, does meaning survive there, or does intentionless text lack content?
  **Likely Answer:** She'll say speaker meaning requires intentions; the text has derived meaning dependent on the user's attribution.
  **Follow-up:** So the inference is in the reader, not the text? Then isn't that just Gricean implicature again?

  **10. Falsification**
  **Question:** What empirical finding or counterexample would convince you that conversational implicature actually exists?
  **Likely Answer:** Evidence of distinct cognitive processing for implicatures versus semantics.
  **Follow-up:** And if that finding appears, do you abandon the no-implicature claim entirely?

  ***

  **Podcast Tips:**
  *   **Timing:** 25 minutes for 10 questions is aggressive (2.5 minutes per exchange). If she gives long answers, skip Q6 or Q7—they cover similar ground (theoretical cost).
  *   **Delivery:** Read the question exactly as written. If you add "I think" or "It seems," you burn seconds and invite her to correct your premise instead of answering.
  *   **The Follow-up:** Only ask the follow-up if her answer matches the "Likely Answer" column. If she goes off-script, default to: "Does that commit you to [X]?" where X is the controversial implication of her view.
