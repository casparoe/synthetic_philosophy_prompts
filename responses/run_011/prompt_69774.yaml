  4.  **Analyzing the Brother's Contradiction:**
      *   The brother says: "Ends justify means" (implies no wrong) AND "He should feel awful" (implies wrong/residue).
      *   *Slippage:* He is likely sliding between Reading 1 (Consequentialist Eraser) to defend the *decision* to the family, and Reading 2/3 (Dirty Hands/Role Morality) to defend the *character* of the councillor.
      *   *Walzer Connection:* The user is right. Walzer's "Dirty Hands" specifically argues that the politician *must* do the wrong thing for the greater good, and *must* feel guilty about it. If they don't feel guilty, they are dangerous.
      *   *Resolution:* The phrase "ends justify the means" is usually shorthand for Reading 1 (Eraser). But the brother *needs* Reading 2 (Threshold/Residue) to make sense of the guilt. He is using a slogan that contradicts his own nuanced point.

