answer: |-
  You are right to be annoyed. Your intuition from that single political theory course is sharper than your brother's slogan. The phrase "the ends justify the means" is a philosophical chameleon; it changes color depending on who is holding it and what they are trying to hide.

  Your brother is trying to hold two thoughts together:
  1.  **The Decision View:** The councillor made the correct all-things-considered choice.
  2.  **The Character View:** The councillor committed a moral wrong and must bear the psychological weight of it.

  The slogan "the ends justify the means" is typically used to assert Thought 1 in a way that *negates* Thought 2. If the means are truly *justified* in the strong sense, there is nothing to feel awful about. By insisting the councillor *should* feel awful, your brother is actually rejecting the standard meaning of the slogan while continuing to say it.

  Here is the menu of precise interpretations you asked for. I have varied the components (Ends, Justify, Success, Scope, Mode) and evaluated their truth status.

  ### The Menu of Interpretations

  #### 1. The Consequentialist Eraser
  *   **Ends:** Net aggregate good (e.g., more housing units > bus rides).
  *   **Justify:** Moral erasure. The act is rendered morally neutral or positive. No "moral remainder" exists.
  *   **Success:** Ends must actually obtain (or be highly probable).
  *   **Scope:** Universal (applies to everyone).
  *   **Mode:** Normative (this is how one *ought* to reason).
  *   **Verdict:** **Substantive but Controversial.** This is classic Act Utilitarianism. It is defensible within that framework, but false if you believe certain rights (like transit access) act as side-constraints that cannot be traded away. Crucially, **this reading makes guilt irrational.** If the act is morally neutralized, feeling awful is a mistake.

  #### 2. The Threshold Permissibility (The "Lesser Evil")
  *   **Ends:** A specific, high-value moral good that outweighs the violation.
  *   **Justify:** Permission only. The act becomes *permissible* (not forbidden), but it remains a *moral wrong* in itself.
  *   **Success:** Ends must be reasonably expected.
  *   **Scope:** Universal (applies in emergencies/dilemmas).
  *   **Mode:** Normative.
  *   **Verdict:** **Substantive and Defensible.** This aligns with Threshold Deontology. It claims that while we have duties not to harm, those duties can be overridden by catastrophic consequences. However, the violation leaves a "moral remainder." **This reading requires guilt.** It fits your brother's second claim but contradicts the common usage of his slogan.

  #### 3. The Role-Based Exception (The "Public Morality")
  *   **Ends:** The public good / political stability / constituency welfare.
  *   **Justify:** Role obligation. The politician is permitted (or required) to do what a private citizen is forbidden to do.
  *   **Success:** Political success (winning the vote).
  *   **Scope:** Special (applies only to political actors).
  *   **Mode:** Normative.
  *   **Verdict:** **Defensible (Walzer's Territory).** This argues that political office changes the moral calculus. However, like Reading 2, it usually insists that the politician must acknowledge the sin. If they treat it as "just business," they become dangerous. This supports the "feel awful" claim.

  #### 4. The Descriptive Realist (The "Cynic")
  *   **Ends:** Retention of power / policy victory.
  *   **Justify:** Explanation, not validation. It means "the ends *explain* the means" or "the ends *sanitize* the means in the eyes of history."
  *   **Success:** Ends must actually happen.
  *   **Scope:** Special (Politics specifically).
  *   **Mode:** Descriptive (this is how things *are*, not how they should be).
  *   **Verdict:** **Trivially True.** It is a fact that voters often forgive immoral means if they like the outcome. However, this offers no moral defense, only a sociological observation. It cannot support the claim that the councillor is a "good guy."

  #### 5. The Intentionalist (The "Idealist")
  *   **Ends:** A noble aim, regardless of outcome.
  *   **Justify:** Exoneration of character. The agent is blameless because their heart was in the right place.
  *   **Success:** Irrelevant (good intentions suffice).
  *   **Scope:** Universal.
  *   **Mode:** Normative.
  *   **Verdict:** **False.** This is the "road to hell" problem. If the bus cut doesn't actually result in the housing package, the harm was gratuitous. This reading is morally dangerous.

  ---

  ### Diagnosis: What Your Brother Is Doing

  Your brother is sliding between **Reading 1 (The Eraser)** and **Reading 3 (The Role-Based Exception)** without noticing the contradiction.

  1.  **When he says "the ends justify the means, that's just politics":** He is invoking **Reading 4 (Descriptive Realist)** mixed with **Reading 1 (The Eraser)**. He wants to shut down moral scrutiny by implying the trade-off was mathematically clean and standard procedure. He uses this to deflect your objection that the bus cut was harmful.
  2.  **When he says "he ought to feel awful... that makes him a good guy":** He is invoking **Reading 2 (Threshold Permissibility)** or **Reading 3 (Role-Based Exception/Dirty Hands)**. He recognizes that a moral line was crossed and that the councillor's conscience is the only thing preventing him from becoming a technocratic monster.

  **The Inconsistency:**
  He cannot have it both ways with the *slogan*.
  *   If the slogan is true (Reading 1), the means are *justified*, meaning no moral wrong occurred. If no moral wrong occurred, guilt is inappropriate neurosis.
  *   If the guilt is appropriate (Reading 2/3), the means were *not* fully justified; they were only *excused* or *overridden*. The moral wrong remains, even if the action was necessary.

  By using the slogan "the ends justify the means," he is linguistically erasing the very moral residue he insists the councillor must feel.

  ### Can You Keep Both Halves of the Story?

  **Yes, but you have to drop the slogan.**

  The position your brother *wants* to hold is almost exactly Michael Walzer's "Dirty Hands" argument (which you recalled correctly). Walzer argues that in politics, we sometimes require leaders to commit moral wrongs for the sake of the community.
  *   **Is it the right call?** Yes, all-things-considered (the housing helps more people than the bus).
  *   **Is it morally clean?** No. A right decision can still be a guilty one.
  *   **The Test of Character:** A leader who does the dirty deed and sleeps soundly is dangerous (they enjoy it or lack empathy). A leader who does the dirty deed and suffers for it is trustworthy (they respect the moral law they broke).

  **The Verdict on the Readings:**
  *   **Reading 1 (Eraser)** is inconsistent with the "feel awful" claim.
  *   **Reading 2 (Threshold)** and **Reading 3 (Role-Based)** are the only ones that allow him to keep both halves. They assert that the action was *necessary* and *politically right*, but morally *costly*.

  ### How to Push Back at Dinner

  You don't need to win the policy debate; you need to win the conceptual one. Tell him this:

  > "You're using 'the ends justify the means' to mean the math works out so nobody was wronged. But then you say he should feel awful. If the math works out perfectly, he shouldn't feel awful; he should feel satisfied.
  >
  > "If he needs to feel awful, then the means *weren't* justified, they were just *necessary*. That's not 'the ends justify the means,' that's 'Dirty Hands.' If you call it 'justified,' you're saying the bus riders didn't matter. If you say he should feel awful, you're admitting they did. Pick one: either he did nothing wrong, or he did something wrong to save the housing package. You can't say the act was clean and the conscience should be dirty."

  He is trying to use a consequentialist slogan to defend a deontological intuition. He wants the political cover of the first without the moral coldness of it. Pointing out that slippage should stop him from treating your objection as mere squeamishness.
