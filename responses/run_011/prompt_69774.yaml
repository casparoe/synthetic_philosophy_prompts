  3.  **Drafting the Menu of Interpretations:**

      *   *Reading 1: Strong Consequentialism (The Eraser).*
          *   Claim: If the outcome is net positive, the action is morally neutral or good. No residue.
          *   Status: Substantive but controversial (utilitarian). Often criticized for ignoring rights.
          *   Fit with Brother: Fits "right call," contradicts "should feel awful."

      *   *Reading 2: Weak Consequentialism / Threshold Deontology (The Tipping Point).*
          *   Claim: Normally forbidden means become permissible if the good is *sufficiently* large, but the act remains regrettable.
