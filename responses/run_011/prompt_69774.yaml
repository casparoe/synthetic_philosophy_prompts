      *   **User's Objection:** These two positions seem inconsistent. If the ends *justify* the means, why feel awful? If he should feel awful, were the means truly *justified*?
      *   **User's Background:** One political theory course, remembers Walzer's "Dirty Hands."
      *   **Task:** Provide a "menu" of precise interpretations of "the ends justify the means."
      *   **Requirements:**
