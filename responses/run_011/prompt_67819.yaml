prompt: |-
  Once a month I run a translation circle at my public library — fifteen-ish people: amateur poets, two who've actually been published, one proper literary translator, and four who read no French at all. Next session is 75 minutes and it's mine, and I want to teach exactly one idea: that a poem's formal constraints aren't a container you can pour the meaning out of and keep. Whiteboard, one table, budget for a single photocopied handout, no projector. Don't explain the idea to me — plan how I teach it, in order, with what depends on what.

  My planned opening is to hand out a well-known limerick and ask them to redo it in five lines of free verse keeping everything it says; they'll manage it in two minutes and conclude form was droppable, and then I spring the reversal. Does that work, or does it poision the well for the rest of the hour? The carrying example after that would be the little Marot poem in tiny short-line rhyming couplets that Hofstadter built a whole book of English versions around, because I can put six competing English renderings side by side on the handout and nobody needs the French. Tell me what that example has to have and what it has to lack for the point to land, and whether six versions is one too many.

  Misconceptions I'm bracing for: form is decoration and meaning is what's left over; a version that rhymes is the translator showing off, hence cheating; you can't judge a translation without the source language; and a mental slider with faithful at one end and free at the other. Which point in the sequence kills each of those, and what do I say at that moment? Also — the professional will keep insisting form is untransferable in principle and the amateurs will just fold, so give me a beat that takes him seriously without letting him close the question.

  Finish with one check I can run that would show they've got form doing semantic work rather than just agreeing translation is hard. And tell me what to cut at this level (French versification, the foreignizing/domesticating vocabulary, I assume) and how to announce the cuts out loud. No reading list please, these people aren't doing homework.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Public library translation circle, 15 people (mixed skills: amateur poets, published poets, 1 pro translator, 4 non-French readers).
      *   **Time:** 75 minutes.
      *   **Goal:** Teach *one* idea: Formal constraints aren't containers; they *are* part of the meaning (form = content).
      *   **Constraints:** Whiteboard, one table, budget for one photocopied handout, no projector. No reading list/homework.
      *   **User's Proposed Opening:** Limerick $\rightarrow$ Free Verse conversion.
      *   **User's Proposed Core Example:** Clément Marot's poem (via Hofstadter's *Le Ton beau de Marot*), 6 English versions side-by-side.
      *   **Specific Questions:**
          *   Does the limerick opening work or poison the well?
          *   What must the Marot example have/lack? Is 6 versions too many?
          *   How to address specific misconceptions (form=decoration, rhyme=showing off, need source language, faithful/free slider).
          *   How to handle the Pro Translator (who says form is untransferable) vs. Amateurs (who fold).
          *   Final check for understanding (form doing semantic work).
          *   What to cut (French versification, foreignizing/domesticating) and how to announce it.

  2.  **Evaluate the Opening (Limerick):**
      *   *Pros:* Accessible, funny, clearly defined form.
      *   *Cons:* Limericks are often nonsense/light verse. Converting one to free verse might *too easily* prove the user's point (that meaning survives) rather than setting up the reversal. If they do it in 2 minutes and say "See? Easy," the reversal needs to be very strong.
      *   *Risk:* It might reinforce the "container" theory too well initially.
      *   *Verdict:* It works *if* the reversal is immediate and sharp. The key is not letting them feel successful at "keeping everything it says." They *can't* keep the humor/tone/rhythm in free verse without changing the meaning (the "point" of the joke).
      *   *Adjustment:* Don't just ask them to keep "what it says." Ask them to keep "what it *does*."

  3.  **Evaluate the Core Example (Marot/Hofstadter):**
      *   *Context:* Hofstadter's *Le Ton beau de Marot* is the bible for this exact argument. The poem is "À une Damoyselle malade."
      *   *Six Versions:* Is it too many? For a handout, it's dense. For a 75-minute session, analyzing 6 in depth is impossible.
      *   *Strategy:* Group them. 6 is actually good *if* used to show range, not analyzed line-by-line. It shows that "meaning" shifts drastically based on formal choices.
      *   *Requirement:* The handout must *not* have the French. (User specified this). It must show the *English* variations clearly.
      *   *What it must lack:* Academic footnotes, IPA, French original (distracts the non-French readers).
      *   *What it must have:* Clear visual distinction of form (line breaks, rhyme scheme markers).

  4.  **Addressing Misconceptions:**
      *   *Form = Decoration:* Killed during the Limerick reversal.
      *   *Rhyme = Showing Off:* Killed during Marot analysis (show how rhyme forces specific word choices that alter meaning).
      *   *Need Source Language:* Killed by the Marot handout (no French needed to see differences).
      *   *Faithful/Free Slider:* Killed by the conclusion (it's not a slider, it's a prism).

  5.  **Handling the Pro Translator:**
      *   *Risk:* Pro says "Form is untranslatable, so we drop it." Amateurs agree.
      *   *Counter:* Acknowledge the loss, but reframe it as *transformation*, not deletion. Ask the Pro: "If you drop the form, what new meaning did you accidentally create?"
      *   *Beat:* Give the Pro a specific role: "Identify the cost."

  6.  **Final Check:**
      *   Need a tangible output. Not an essay. A quick rewrite or comparison.
      *   Idea: Give them a "neutral" sentence and ask for two versions with different forms that change the *implication*.

  7.  **Cuts:**
      *   French versification (alexandrines, etc.): Irrelevant if no French.
      *   Venuti/foreignizing: Too theoretical.
      *   Announcement: "We are ignoring the 'how hard' question to answer the 'what happens' question."

  8.  **Drafting the Plan (Iterative Process):**

      *   *Minute 0-15 (The Limerick):* Do the exercise. Crucial pivot: When they present the free verse, ask "Where did the laugh go?" or "Why does this sound like a confession now?"
      *   *Minute 15-45 (The Marot):* Handout distribution. Don't lecture. Let them compare Version A (literal) vs. Version B (rhyming). Ask: "What did Version B have to lie about to make the rhyme work?"
      *   *Minute 45-60 (The Pro/Amateur Dynamic):* Specific prompt for the Pro. "You know what's lost. Tell us what was *gained* in the version that broke the rules."
      *   *Minute 60-70 (The Check):* Micro-exercise.
      *   *Minute 70-75 (Wrap):* State the thesis clearly now.

      *Refining the Limerick:* The user worries it poisons the well. Actually, it's the perfect bait. They *think* they succeeded. The trap is that they didn't. I need to make sure the facilitator (User) is ready to pounce on the *tone* shift.
      *Refining the Marot:* 6 versions is a lot for one handout. Let's suggest highlighting specific lines across the 6 to focus attention.
      *Refining the Pro:* The Pro is right (form is untransferable) but wrong (therefore it doesn't matter). The pivot is "Untransferable $\neq$ Disposable."

  9.  **Structuring the Response:**
      *   Follow the user's constraints strictly (no preaching the theory, just the plan).
      *   Address each specific question in the flow of the plan.
      *   Keep it practical (time stamps, script snippets).

  10. **Self-Correction/Review against constraints:**
      *   *Did I explain the idea?* No, just how to teach it.
      *   *Did I address the limerick?* Yes.
      *   *Did I address the Marot handout specs?* Yes.
      *   *Did I address the misconceptions?* Yes, mapped to timeline.
      *   *Did I address the Pro?* Yes.
      *   *Did I address the Final Check?* Yes.
      *   *Did I address the Cuts?* Yes.

      *Wait, one nuance:* The user asked "Does that work, or does it poison the well?" I need to answer that directly before the plan.
      *Also:* "Tell me what that example has to have and what it has to lack." Need a specific section for Handout Design.
      *Also:* "Which point in the sequence kills each of those [misconceptions]?" Need to map this.

      *Let's build the response.*
      *   **Section 1: Verdict on Opening.** (It works, but with a caveat on the debrief).
      *   **Section 2: Handout Design.** (Marot specifics).
      *   **Section 3: The 75-Minute Plan.** (Step-by-step).
      *   **Section 4: Misconception Mapping.** (Where they die).
      *   **Section 5: Handling the Pro.**
      *   **Section 6: The Final Check.**
      *   **Section 7: The Cuts.**

      *Refining the Limerick Verdict:* It risks confirming the bias if you don't control the debrief. The instruction must be "Keep the *effect*," not "Keep the *story*." If they keep the story but lose the snap, they failed the constraint.
      *Refining the Marot:* Hofstadter's versions range from literal to parody. 6 is fine if arranged by "degree of formal adherence."
      *Refining the Pro:* The Pro needs to be the "Loss Auditor," not the "Gatekeeper."

      *Final Polish:* Ensure tone is respectful of the user's expertise (they know Hofstadter, they know the room). Keep instructions actionable.

      *(Self-Correction during drafting)*: Make sure I don't slip into explaining *why* form matters. Keep it to *how to make them see it*.

      *Final Check on Time:* 75 mins is tight.
      0-15: Limerick.
      15-45: Marot.
      45-60: Discussion/Pro management.
      60-70: Final Exercise.
      70-75: Close.
      Seems doable.

      *Wait, the "Final Check":* Needs to show form doing *semantic* work.
      Idea: Give them a sentence. "I didn't say you were wrong."
      Task: Punctuate/line-break it two ways to change who is at fault.
      Or better: Translate a haiku into a limerick.
      Or: Take a neutral line and make it threatening via form.
      Let's go with the "Neutral Line $\rightarrow$ Two Forms $\rightarrow$ Two Meanings" micro-task.

      *Okay, ready to write.*
answer: |-
  ### Verdict on the Opening
  **It works, but only if you rig the debrief.**
  If you ask them to keep "everything it says," they will succeed (the narrative survives) and your thesis dies. You must ask them to keep **"what it does to the reader."**
  *   **The Trap:** They will produce a free-verse anecdote that tells the same story.
  *   **The Reversal:** Read their versions aloud. Ask: "Did anyone laugh? Did anyone feel the snap?" When they admit the humor evaporated, you pivot: "The humor wasn't in the story. It was in the bounce. If the bounce is gone, the meaning is gone."
  *   **Risk:** If you let them feel successful at "preserving the content," you poison the well. You must define "content" as *effect*, not *plot*.

  ### The Marot Handout: Specifications
  **What it must have:**
  1.  **Visual Geometry:** The six versions must be laid out in two columns of three. White space is crucial. They need to *see* the shape differences before they read the words.
  2.  **Rhyme Markers:** Put letters (AABB, ABAB) in the margins. Force the eye to track the sound structure.
  3.  **One Highlighted Couplet:** Pick one specific rhyme pair from the French (e.g., *malade/malade* or the specific wish for health) and bold the corresponding English words in all six versions. This forces comparison of *how* different forms solved the same problem.

  **What it must lack:**
  1.  **The French Text:** You are right to exclude it. It invites the non-French readers to check out and the French readers to nitpick pronunciation.
  2.  **Translator Names (initially):** Don't label them "Hofstadter," "Literal," "Doggerel." Label them "Version 1" through "Version 6." Prevent authority bias.
  3.  **Footnotes:** No explaining *why* a word was chosen. Let them deduce the constraint.

  **Is six too many?**
  No, but **do not analyze all six.** Use them as a spectrum.
  *   **Strategy:** Group them. "Look at 1, 2, and 3. Now look at 4, 5, and 6. What happened to the *girl* in the poem as the rhymes got stricter?"
  *   **Why 6 works:** It proves that there is no single "meaning" waiting to be extracted. There are six different poems.

  ---

  ### The 75-Minute Plan

  **00:00 – 00:15: The Limerick Bait**
  *   **Action:** Hand out the limerick (no title, just text).
  *   **Task:** "Rewrite this in five lines of free verse. You must keep the *effect* on the reader, not just the plot."
  *   **Share:** Pick two volunteers to read theirs.
  *   **The Turn:** Ask the room: "Be honest. Did you smile reading their version?" (Likely no). "The joke didn't survive the transfer. The form *was* the joke."
  *   **Board:** Write **FORM ≠ CONTAINER**. Write **FORM = ENGINE**.

  **00:15 – 00:45: The Marot Spectrum**
  *   **Action:** Distribute the Marot handout.
  *   **Task (Individual, 5 mins):** "Circle the word in each version that feels the most forced. Put a star next to the version that feels most like a real poem to you."
  *   **Task (Pairs, 10 mins):** "Compare your 'forced' words. Did you circle the rhyming words? Why did the translator choose *that* word there?"
  *   **Discussion:** Focus on the highlighted couplet. "Version 2 says 'sick.' Version 5 says 'ill.' Version 6 says 'under the weather.' Which girl is sicker? Which translator is more worried?"
  *   **Point:** The formal constraint forced a semantic choice. The rhyme scheme dictated the diagnosis.

  **00:45 – 00:60: Managing the Room (The Pro & The Slider)**
  *   **The Pro Beat:** The professional will say, "But the French meter is impossible in English."
      *   **Your Move:** Do not argue. Validate, then pivot. "You're right. It's impossible. So when we try anyway, what breaks? Does the meaning break, or does it *bend*?"
      *   **Assign the Pro:** "I want you to be our Loss Auditor. Don't tell us what we can't do. Tell us: in Version 4, what truth did we sacrifice to get that rhyme?"
      *   **Why:** This makes the Pro an expert witness for your argument, not an opponent.
  *   **The Slider Kill:** Someone will say, "Version 1 is faithful, Version 6 is free."
      *   **Your Move:** Draw a triangle on the board, not a line. "Faithful to what? The words? The sound? The mood? You can't be faithful to all three. It's not a slider between True and Fake. It's a choice between *which* truth survives."

  **00:60 – 00:70: The Final Check**
  *   **Task:** "Take this sentence: *'I never said she stole my money.'*"
  *   **Instruction:** "Write it twice.
      1.  Break the lines to imply *someone else* stole it.
      2.  Break the lines to imply she stole *something else*."
  *   **Example:**
      *   *I never said she / stole my money.* (Someone else did)
      *   *I never said / she stole my money.* (She did something else)
  *   **Review:** Ask two people to read theirs. Ask the room: "Did the words change? No. Did the meaning change? Yes. Why?"
  *   **Goal:** If they say "Because of the line breaks," you have won. Form did semantic work.

  **00:70 – 00:75: The Cut & Close**
  *   **Action:** Erase the board. Leave only **FORM = ENGINE**.
  *   **Statement:** "Today we cut out French metrics. We cut out 'foreignizing' vs. 'domesticating.' We cut out the question of which version is 'best.'"
  *   **Reasoning:** "Because before we judge a translation, we have to admit that every version creates a new original. The constraint isn't a wall. It's the lens."

  ---

  ### Misconception Kill-List

  | Misconception | Where it dies | What you say |
  | :--- | :--- | :--- |
  | **Form is decoration** | **Limerick Debrief (Min 15)** | "If it was decoration, the joke would survive the removal. It didn't. The form was the punchline." |
  | **Rhyme = Showing off** | **Marot Analysis (Min 30)** | "Look at Version 5. They didn't choose 'ill' to show off. They chose it because 'sick' wouldn't rhyme. The rhyme forced the medical diagnosis." |
  | **Need source language** | **Handout Design** | "We aren't judging accuracy against the French. We are judging the *consequences* of the English choices. You don't need French to see a forced rhyme." |
  | **Faithful/Free Slider** | **Pro Discussion (Min 50)** | "Version 1 isn't 'truer.' It's true to the dictionary. Version 6 is true to the song. You aren't sliding away from truth; you are rotating the prism." |

  ### What to Cut (and How to Announce It)
  You must explicitly excise theory to keep the 75-minute limit and the mixed-skill level.

  1.  **Cut: French Versification (Alexandrines, etc.)**
      *   **Announcement:** "We are treating the English versions as independent poems. Knowing the French meter won't help us see how the English rhyme changed the meaning."
  2.  **Cut: Venuti/Foreignizing vs. Domesticating**
      *   **Announcement:** "We aren't talking about ethics today. We aren't asking if we *should* translate this way. We are asking *what happens* when we do."
  3.  **Cut: The 'Best' Version**
      *   **Announcement:** "There is no winner here. Hofstadter didn't print six versions to find the best one. He printed them to prove there is no single best one."

  ### Contingency: If the Amateurs Fold
  If the amateurs defer entirely to the Pro ("Well, if *you* say it's impossible..."):
  *   **Intervention:** Turn to the non-French readers. "You four are actually the most important people here. You aren't distracted by the source. Look at Version 3. Does that sound like a human speaking to a sick friend? Or a puzzle solver?"
  *   **Goal:** Validate the reader's experience over the translator's technical difficulty. The "meaning" lives in the reader, not the difficulty of the task.
