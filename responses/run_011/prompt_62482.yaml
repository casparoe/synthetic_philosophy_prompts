answer: |-
  **Project Title:** Normative Residue: Convention, Expectation, and Persistence in Changing Games

  **Research Question**
  David Lewis analyzes convention as a regularity in behavior that solves a recurring coordination problem, sustained by mutual expectations and a preference for general conformity. The evolutionary signaling-game tradition (e.g., Skyrms) is typically read as showing Lewis's epistemic conditions are unnecessary for a convention to *emerge*: populations converge via reinforcement without representing the game or others' expectations. This proposal presses the converse question, which remains in the background: do these epistemic conditions do explanatory work in *keeping* a convention alive after the payoff structure that generated it has changed?

  Consider a Lewis–Skyrms signaling game that switches mid-run, such that states acquire new action-relevant meanings or interests diverge. The population sits at an equilibrium of the old game; the new game renders that regularity suboptimal or coordination-irrelevant. On Lewis's analysis, it should cease to count as a convention. In practice, regularities often persist, justified by agents appealing to what they expect others to do. I call this interval and the persisting regularities *normative residue*.

  This project asks two determinate questions. First, the **Conceptual Question**: Can Lewis's conditions come apart in this way, and what does the analysis prescribe when they do? Specifically, does the loss of the "common interest" condition immediately dissolve the convention, or does the expectation structure sustain it as a distinct normative kind? Second, the **Formal Question**: Does adding higher-order expectation-tracking to agents change measurable outcomes in such a model? I will compare the decay rate of the residue in a population of agents who track others' expectations against a population of agents who merely have reinforced habits.

  The possible answers are: (1) Expectation-tracking significantly slows decay, supporting the hypothesis that Lewisian epistemic states provide inertia against payoff changes; (2) Decay rates are invariant to epistemic states, suggesting the residue is purely a function of reinforcement history; or (3) Lewis's existing resources (e.g., precedent) already account for this, rendering the modeling redundant.

  **Context and Literature**
  Existing positions leave this open. Lewis's own account focuses on equilibrium maintenance in static environments. While he discusses precedent, he does not model the dynamics of a coordination problem dissolving while the behavior persists. Consequently, his account is silent on whether the regularity retains normative force during the transition.

  The evolutionary modeling tradition focuses almost exclusively on emergence and stability under fixed payoffs. These models demonstrate that conventions *can* arise without common knowledge, but they rarely investigate the *justificatory* mechanisms agents use when the environment shifts. They predict the behavioral regularity but are silent on whether the agents' internal states (expectations vs. habits) affect the persistence of that regularity once it becomes suboptimal.

  Rival views, such as those grounding social norms in expectations of approval and disapproval (e.g., Bicchieri), might absorb the phenomenon too readily. By defining norms as dependent on empirical and normative expectations, these accounts predict persistence as long as expectations remain, potentially masking the specific contribution of *coordination* history. They risk treating the residue as a generic norm phenomenon rather than a specific feature of Lewisian conventions losing their functional ground. None of these frameworks explicitly model the lag between payoff change and behavioral change mediated by epistemic states.

  **Methodology**
  I will employ a hybrid method of agent-based modeling (ABM) and conceptual analysis. This approach is superior to the obvious alternatives.

  Patching Lewis's definition with an extra clause (e.g., "conventions persist for *n* rounds after payoff shifts") would be ad hoc. It stipulates a result rather than explaining the mechanism. A purely exegetical reconstruction of what Lewis "could have said" is insufficient because Lewis did not have access to modern dynamic modeling tools; we cannot know the implications of his account for dynamic payoff structures without formalizing them. Finally, a qualitative case study of norm change in real organizations lacks the control necessary to isolate variables. In real-world cases, we cannot distinguish whether persistence is due to expectation-tracking, habit, or fear of sanction.

  Simulation allows for *ceteris paribus* control over the agents' cognitive architecture. I will construct two populations: one using standard reinforcement learning (blind habits) and one using belief-learning (tracking others' expectations). Both will face an identical payoff switch.

  Philosophical argument contributes what simulation alone cannot: the interpretation of the model's ontology. A simulation can show that Parameter A slows decay, but it cannot determine whether Parameter A maps onto "expectation" or merely "memory." Philosophical analysis is required to justify the mapping between the formal parameters and the conceptual category of *expectation*. Furthermore, philosophy is needed to interpret the normative status of the residue. If the regularity persists without solving a coordination problem, is it a convention, a habit, or a new kind of norm? The simulation provides the data; the philosophy provides the taxonomy.

  **Work Plan and Deliverables**
  The project is divided into four phases over twenty-four months.

  *Months 1–6: Model Construction and Calibration.* I will build the ABM environment, replicating standard signaling games to ensure baseline validity. I will define the "payoff switch" mechanism and operationalize "expectation-tracking" versus "reinforcement."
  *Months 7–12: Simulation and Data Analysis.* I will run batch simulations across varying population sizes and switch magnitudes. I will analyze decay rates and statistical significance.
  *Months 13–18: Conceptual Analysis and Writing.* I will interpret the formal results in the context of Lewis's theory. I will draft the first paper on the formal results and the second on the philosophical implications.
  *Months 19–24: Dissemination and Workshop.* I will organize a one-day workshop on "Dynamic Conventions" to present findings and gather feedback.

  **Deliverables:**
  1.  **Paper 1:** "Expectation and Inertia: A Formal Model of Normative Residue" (Target: *Philosophy of Science* or *British Journal for the Philosophy of Science*).
  2.  **Paper 2:** "The Status of Residue: Lewisian Conventions After Coordination Fails" (Target: *Noûs* or *Philosophical Studies*).
  3.  **Workshop:** One-day event with three external speakers, proceedings archived online.

  **Success and Failure Conditions**
  A successful result demonstrates a statistically significant difference in decay rates between the two agent types, linked to the presence of expectation-tracking. This would validate the hypothesis that Lewisian epistemic conditions provide structural inertia. It would also yield a refined taxonomy of convention persistence.

  Failure conditions are genuinely falsifiable.
  1.  **Null Result:** If decay rates are invariant to whether agents track expectations, my hypothesis is undercut. This is a valuable negative result, suggesting that the "epistemic" element of Lewis's account is irrelevant to persistence, but it would force a pivot to a purely evolutionary explanation.
  2.  **Exegetical Collapse:** If analysis reveals that Lewis's existing clauses on "precedent" already fully explain the residue without need for new modeling, the project collapses into historical exegesis. This would mean the formal modeling was unnecessary.
  3.  **Mapping Failure:** If it becomes impossible to defend the claim that the model's "belief parameter" corresponds to philosophical "expectation," the bridge between the formal and conceptual breaks.

  **Risk Assessment**
  The scope is tight, but two components threaten to balloon.

  First, the **Identity Condition**. Determining when a persisting regularity is the *same* convention versus a new habit is philosophically thorny. If I attempt to solve the metaphysics of convention identity, the project will exceed two years. *Mitigation:* I will stipulate identity based on signal-state mapping for the duration of the fellowship, treating the metaphysical question as a limitation for future work.

  Second, **Population Structure**. The initial plan assumes well-mixed populations. Moving to structured populations (networks) adds realism but exponentially increases parameter space and simulation time. *Mitigation:* If the fellowship committee signals that two years is optimistic, I will trim the project by retaining well-mixed populations only. This preserves the core comparison (Tracking vs. Non-Tracking) without the computational and analytical overhead of network topology.

  By focusing on the specific interval of *residue*, this project avoids the well-trodden ground of convention emergence and offers a novel test of the functional role of epistemic conditions in social normativity.
