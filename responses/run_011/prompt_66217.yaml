answer: |-
  To sort mental suffering into kinds, we must first distinguish between the *work* a classification must do and the *ideals* particular factions wish it embodied. A biological psychiatrist demands biomarkers; a psychoanalyst demands unconscious etiology; a social worker demands context. These are school loyalties. The genuine requirements are those that survive the transition from theory to practice: the system must allow clinicians to agree (reliability), it must predict something meaningful about the future (validity), and it must not cause harm by mislabeling (utility). A taxonomy that is biologically perfect but clinically useless is a failed taxonomy; one that is clinically convenient but biologically incoherent is a ticking time bomb.

  Here are the desiderata for an adequate taxonomy of mental disorder.

  **1. Inter-Rater Reliability (Non-Negotiable)**
  *The Case:* Two clinicians interviewing the same patient must arrive at the same code. Without this, communication collapses.
  *The Anchor:* **PTSD.** In the DSM-III era, PTSD criteria were vague regarding the "traumatic event." Reliability was low because one clinician's "trauma" was another's "stressor." Subsequent revisions tightened the definition of the stressor to ensure that when a clinician checks the box, it means the same thing across the country.
  *Why:* If we cannot agree on who has it, we cannot study it or treat it.

  **2. Predictive Validity (Non-Negotiable)**
  *The Case:* The label must tell you something about the course of the illness and response to intervention that you wouldn't know without the label.
  *The Anchor:* **Asperger's Syndrome.** In DSM-IV, Asperger's was distinct from Autistic Disorder primarily by the absence of language delay. However, research showed that language delay did not predict outcome or treatment response differently than high-functioning autism. The label failed to predict anything unique.
  *Why:* A category that does not carve out a distinct trajectory is merely a description, not a diagnosis.

  **3. Biological Plausibility (Negotiable in the Short Term, Non-Negotiable Long Term)**
  *The Case:* The classification cannot fundamentally contradict established findings in genetics or neuroscience, even if it doesn't yet rely on them.
  *The Anchor:* **Asperger's.** The folding of Asperger's into Autism Spectrum Disorder (ASD) in DSM-5 was driven largely by genetic evidence showing no natural boundary between the two. Keeping them separate would have contradicted the genetic data.
  *Why:* You cannot maintain a taxonomy of "kinds" that nature does not support, or you risk building medicine on folklore.

  **4. Clinical Utility and Access (Negotiable)**
  *The Case:* The category must facilitate treatment and, in many systems, access to resources.
  *The Anchor:* **Asperger's.** When DSM-5 subsumed Asperger's into ASD, many individuals lost the specific identity they had built. Some lost access to services that required the specific Asperger's code. The science gained coherence, but the humans lost a tool for navigation.
  *Why:* A diagnosis is a key to a door. If the key changes shape, people get locked out.

  **5. Stability Under Publicity (Negotiable)**
  *The Case:* The definition of the disorder should not shift merely because the public knows about it.
  *The Anchor:* **PTSD.** As PTSD became a cultural touchstone, the threshold for what counted as trauma widened (e.g., to include learning about trauma happening to others). The prevalence drifted not necessarily because the biology changed, but because the concept was adopted and stretched by the culture.
  *Why:* Scientific longitudinal study requires a stable target.

  ***

  **The Adjudication: Stability vs. Uptake**

  The epidemiologist demands stability; the advocate demands uptake. They cannot both be fully satisfied because psychiatric categories are "interactive kinds": when you label a human experience, humans change their relationship to that experience. If a category is stable but ignored (no uptake), it is scientifically clean but socially dead. If it is taken up but shifts (high uptake, low stability), it is socially alive but scientifically messy.

  **The Epidemiologist must concede.** We cannot treat human beings like inert minerals. If a category fails to resonate—if no one builds an identity or community around it—it will not be reported accurately, rendering the epidemiologist's data garbage anyway. The demand for absolute stability assumes a static reality that does not exist in the social world. However, conceding this damages the **Reliability** and **Predictive Validity** entries on the list above. If the boundaries drift due to cultural uptake (as with PTSD), longitudinal studies become comparisons of apples and oranges, and the "kind" becomes a moving target for biological research. We must accept that our taxonomy will require versioning, like software, rather than permanence, like physics.

  **The Single Eliminator**

  The requirement that eliminates the most candidates is **Predictive Validity**. Most current categorical systems, including the DSM, fail here. Knowing a patient has "Major Depressive Disorder" tells you very little about which antidepressant will work or whether they will recover in six months versus six years. Any taxonomy that cannot distinguish subtypes based on treatment response or course is, strictly speaking, failing its primary medical mandate. This requirement wipes out pure symptom checklists that ignore underlying mechanisms.

  ***

  **The Live Options**

  The symptom-checklist manual (DSM-5) scores high on Reliability and Clinical Utility but fails Predictive Validity and Biological Plausibility, leaving it vulnerable to the Asperger's-style collapse when science catches up. The dimensional alternative (spectra) handles Biological Plausibility and Validity better by acknowledging gradients, but it struggles with Clinical Utility; insurers and courts demand thresholds, not sliders, and it risks diluting the identity advocacy groups rely on. The research-criteria program (RDoC), which bypasses categories for circuits and behaviors, satisfies Biological Plausibility and Validity best but completely fails Clinical Utility and Access in the immediate term, offering patients no recognizable name for their suffering and clinicians no billing code. Currently, we are forced to use the checklist for care, the dimensions for theory, and the circuits for research, with no single system meeting the non-negotiable demands of all stakeholders.
