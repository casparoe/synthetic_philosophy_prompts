answer: |-
  ### Brainstorming Candidate Principles

  **1. The Control Principle.**
  Guilt fits when you control the outcome; shame fits when you don't.
  *Verdict:* Dead on arrival. It handles Case 10 (survivor guilt) poorly (you don't control survival) and Case 7 (soldier) poorly (you control your limbs, even if ordered). It also collapses the distinction in Case 3 and 4, where control is equally low in both.

  **2. The Social Audience Principle.**
  Guilt is private (violation of internal law); shame is public (exposure to others).
  *Verdict:* Fails Case 1 immediately. The surgeon is alone; no one knows. Yet you say guilt fits and shame doesn't. If shame were purely about exposure, Case 1 would be Shame: U (correct) but for the wrong reason (it's U because it's not constitutive, not because no one saw). It also fails Case 7, where the shame is profound even if the act was lawful and witnessed as legitimate.

  **3. The Identity-Integration Principle.**
  Guilt responds to what you *did*; shame responds to who you *are*.
  *Verdict:* This is the standard view you say fails you on 7 and 8. It needs machinery to explain why a lawful act (7) reveals "who you are" in a negative light, and why a father's joke (8) reveals "who you are" but a friend's doesn't. It also doesn't solve 3 vs. 4 without defining what counts as "who you are."

  ***

  ### The Principle: Constitutive Normative Attribution

  I propose a principle that separates **Attribution** (is this mine?) from **Accountability** (am I to blame?), and distinguishes **Fittingness** (does the emotion match the facts?) from **Value** (is the emotion good to feel?).

  **The Principle of Constitutive Normative Attribution**

  **Clause 1 (Guilt-Fit):** Guilt is fitting if and only if the agent is **accountable** for a specific violation of a normative standard.
  *   *Requirement:* Volitional agency + Norm violation.
  *   *Motivation:* Case 1 (Error was voluntary/negligent), Case 6 (Cheating is voluntary), Case 10 (Survival is not voluntary).
  *   *If Deleted:* We lose the ability to distinguish the surgeon's error (1) from her character flaw (2). Guilt would bleed into shame whenever a bad outcome occurs, regardless of agency.

  **Clause 2 (Shame-Fit):** Shame is fitting if and only if a feature of the world is **attributable** to the agent's identity and lowers their standing relative to an ideal internal to that identity.
  *   *Requirement:* Identity attribution + Standing deficit. (Note: Attribution does not require Volition).
  *   *Motivation:* Case 7 (Soldier's acts are attributable to his role/identity even if not accountable), Case 9 (Verge of cheating reveals character), Case 2 (Rushing is a trait).
  *   *If Deleted:* We cannot explain why the soldier (7) feels shame without guilt. We would be forced to say shame is always unfitting if there is no blame, which contradicts your intuition and the phenomenology of stigma.

  **Clause 3 (The Intruder Boundary):** A feature is not attributable to identity for the purposes of shame if it is caused by **pathological intrusion** or **coercion**, *unless* it is embodied or relationally constitutive.
  *   *Requirement:* Distinguishes between "happening to the self" and "being the self."
  *   *Motivation:* Case 3 vs. Case 4. The flat (3) is contingent circumstance worsened by illness (intruder). The body (4) is the vessel of the self (constitutive), even if flawed by illness.
  *   *If Deleted:* Case 3 and Case 4 collapse. If shame tracks any negative feature associated with the person, the depressed man should feel fitting shame about his flat. You say he shouldn't. This clause saves that distinction by marking the body as *self* and the flat as *context*.

  **Clause 4 (The Valuation Gap):** Fittingness is a cognitive relation (truth-tracking); Appropriateness is an ethical relation (value-tracking). An emotion can be fitting but toxic, or unfitting but virtuous.
  *   *Requirement:* Separates metaphysics of emotion from ethics of emotion.
  *   *Motivation:* Case 4 (Shame fitting but bad to feel), Case 10 (Guilt unfitting but valuable to feel).
  *   *If Deleted:* We face a contradiction in Case 10. If guilt is unfitting, it must be bad. But you want to preserve its value. This clause allows us to say "This guilt is a lie, but a useful lie."

  ***

  ### Testing the Principle Against Your 11 Cases

  1.  **Surgeon (Error):** Guilt F (Accountable for error), Shame U (Error not constitutive of identity). **Match.**
  2.  **Surgeon (Trait):** Shame F (Trait is constitutive), Guilt F (Acts still voluntary). **Match.** (Note: Principle allows both to fit).
  3.  **Depression (Flat):** Shame U (Flat is contingent context, illness is intruder). **Match.**
  4.  **Depression (Body):** Shame F (Body is constitutive), Value Low (Toxic). **Match.**
      *   *Press on 3 vs 4:* This is the crux. The principle holds because the body is the *locus* of presence. The flat is *environment*. Depression invades the environment (3) but inhabits the body (4). Even if unchosen, the body is *you* in a way the dishes are not.
  5.  **Bullied (Begging):** Shame U (No identity defect, coercion). Second-order Shame U (No reason to be ashamed of shame). **Match.**
  6.  **Cheater (Shame only):** Shame F (Identity defect), Guilt F (but missing). Pathological configuration. **Match.**
  7.  **Soldier:** Guilt U (No norm violation/accountability), Shame F (Identity stained by participation). **Match.**
      *   *Vindication:* This clause validates your distrust of the "Guilt = Mature" story. Shame tracks the stain on the *role*, not just the *will*.
  8.  **Father vs. Friend:** Father = Shame F (Kinship is constitutive identity). Friend = Embarrassment (Association is voluntary).
      *   *Tension:* I can save this with Clause 2 (Relational Constitution), but it's the weakest link. If you are willing to lose 8 to save the rest, drop the "Relational" extension of Clause 2. If you keep it, you must accept that "Self" extends biologically/socially beyond the will. I recommend keeping it: kinship is a form of *given* identity, friendship is *chosen* identity. Shame tracks failures of given identity; embarrassment tracks failures of chosen association. **Match (with caveat).**
  9.  **Exam (Verge):** Shame F (Character revealed), Guilt U (No act). **Match.**
  10. **Survivor/Relief:** Guilt U (No accountability), Value High (Bonding/Solidarity). **Match.**
      *   *Handling 10:* Clause 4 does the heavy lifting here. The guilt is cognitively false (unfitting) but ethically functional (valuable). It signals "I am not indifferent to your loss."
  11. **Culture:** Fittingness Universal (based on facts of agency/identity), Repertoire Cultural. **Match.**
      *   *Coherence:* A culture can be wrong about fittingness if it demands guilt for non-voluntary acts (e.g., being born female). But it can choose whether to prioritize shame-cultures or guilt-cultures in its *practices*.

  **Score:** 11/11 Matches.
  **Cost:** Case 8 requires accepting kinship as constitutive of the self in a way friendship is not. Case 4 requires accepting that an emotion can be "true" but "bad."

  ***

  ### Four New Cases

  **1. Shame about unearned praise.**
  *Verdict:* **Shame Fitting.**
  *Reasoning:* Clause 2. The praise attributes a merit to your identity that you do not possess. This creates a discrepancy between your actual standing and your ascribed standing. You are "living a lie." It is fitting because the fraudulence is constitutive of your current social position, even if you didn't actively lie (you just didn't correct them).

  **2. Guilt about loving a morally repulsive film.**
  *Verdict:* **Guilt Unfitting, Shame Fitting.**
  *Reasoning:* Clause 1 vs. Clause 2. You are not accountable for your visceral taste (no volition), so guilt is unfitting. However, the taste reveals a feature of your sensibility (identity) that conflicts with your moral ideals. Shame fits because it tracks the defect in *you*, not a wrong *done*.

  **3. Shame in someone with no internal audience (e.g., severe autism or radical solitude).**
  *Verdict:* **Shame Unfitting (or conceptually impossible).**
  *Reasoning:* Clause 2 requires "lowering standing." Standing is a social metric. If there is no spectator (internal or external), there is no court to lower standing in. They may feel *distress* or *self-disgust*, but without the imagined gaze, it lacks the specific structure of shame.

  **4. Group shame for a country's history (born after events).**
  *Verdict:* **Shame Fitting (conditionally).**
  *Reasoning:* Clause 2 + Clause 3. If national identity is constitutive of the agent's self-conception (they claim the nationality as identity, not just passport), then the history is attributable to them as a member of the continuum. It is not "pathological intrusion" (Clause 3); it is inherited identity. However, if they reject the identity, shame becomes unfitting.

  ***

  ### Meta-Questions

  **1. Does this make shame more ethical than guilt, or less?**
  It makes them **orthogonal**, not hierarchical. The standard story (Guilt = Mature/Modern, Shame = Primitive/Pre-modern) is vindicated as false by Case 7.
  *   **Guilt** is the ethics of **Agency**. It protects the boundaries of the will. It asks: "Did I break the rule?"
  *   **Shame** is the ethics of **Identity**. It protects the coherence of the self. It asks: "Am I the kind of being who belongs here?"
  Case 7 (The Soldier) shows that one can be a perfect moral agent (Guilt U) while being a stained human being (Shame F). Shame is not less ethical; it tracks a different ethical dimension (integrity/honor vs. compliance/rights). My principle vindicates Case 7: the soldier's shame is a recognition that moral cleanliness is not just about following orders, but about what one *is* implicated in.

  **2. Can a culture be wrong about its own emotions (Case 11)?**
  Yes, in two senses.
  *   **Cognitive Error:** A culture can claim guilt is fitting where there is no agency (e.g., blood guilt for ancestors' sins). My principle says this is *unfitting* (violates Clause 1). The culture is factually wrong about the conditions of accountability.
  *   **Ethical Error:** A culture can cultivate unfitting emotions for social control (e.g., teaching women shame for being assaulted). My principle says this is *unfitting* (violates Clause 3, Intruder Boundary) and likely *low value* (violates Clause 4).
  *   **The Residual Sense:** Case 11 is a claim about **us** (the philosophers) identifying the universal truth-conditions of the emotions, which then allows us to judge **them** (the culture). Fittingness is mind-independent (like truth); Repertoire is mind-dependent (like language). A culture can choose to speak only in metaphors of "face" (Shame), but if they use "face" to describe a voluntary contract violation, they are misdescribing the reality. They can choose the *vocabulary*, but they cannot choose the *facts* that make the vocabulary accurate.
