answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** The Ontology and Epistemology of Dream Reports
  **Participants:** [The Malcolmian] & [The Dennettian]

  ### 1. Agreed Claims

  We share a rejection of the "Standard View" (that dreams are coherent conscious experiences occurring during sleep, stored in memory, and accurately recalled upon waking). We endorse the following claims:

  1.  **The Inadequacy of Naive Introspection:** A sincere first-person report ("I dreamt that p") is not incorrigible evidence that a corresponding conscious episode occurred during sleep.
  2.  **The Limits of Sleep Laboratory Data:** Existing polysomnographic data (EEG, REM correlation) have not established that the *content* of a dream report is generated during the sleep period preceding the report.
  3.  **Distinction from Neighbouring Theses:** Our shared conclusion is distinct from:
      *   *Eliminativism about Brain Activity:* We do not claim nothing happens in the brain during sleep.
      *   *Pathological Confabulation:* We do not claim subjects are lying or clinically deluded.
      *   *Scientific Inaccessibility:* We do not claim dream reports are immune to scientific study.
  4.  **The Status of Dream Reports:** Dream reports are not transparent windows into prior conscious states. **[FLAG: Wording-Only Agreement]**.
      *   *Reason:* The Malcolmian holds this is a grammatical truth about the concept of 'dreaming' (the report *constitutes* the dream). The Dennettian holds this is an empirical truth about memory construction (the report *constructs* the dream).

  ### 2. Disagreements Table

  | Issue | Malcolmian Formulation | Dennettian Formulation | Classification | Justification |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Nature of the Thesis** | The claim that "dreams are not experiences" is a conceptual clarification regarding the grammar of sleep ascriptions. | The claim that "dreams are not experiences" is a live empirical hypothesis regarding the temporal locus of content generation. | Substantive | One treats the issue as philosophical logic; the other as cognitive science. |
  | **2. Temporal Questions** | Questions like "When did the dream happen?" or "How long did it last?" are category mistakes lacking sense. | Questions regarding timing are meaningful; the answer is likely "at the moment of reporting," but this is to be decided by data. | Substantive | One denies the coherence of the question; the other awaits the answer. |
  | **3. First-Person Authority** | The subject's sincere assertion is the criterion for the truth of "I dreamt"; there is no deeper fact to be wrong about. | The subject may be sincerely mistaken about when the content was generated; the report is a fallible data point. | Substantive | One views authority as grammatical; the other as psychological and fallible. |
  | **4. Relevance of EEG** | Neural correlates are irrelevant to the *concept* of dreaming, though they correlate with the *assertion* of dreaming. | Neural correlates may provide evidence for when narrative construction occurs (during sleep vs. upon waking). | Mixed | Both agree EEG doesn't show *content*, but disagree on whether it can constrain the *timing* hypothesis. |

  ### 3. Cruxes and Stipulated Results

  A crux is a sub-question where settling the matter would force a revision of position. We identify the status of empirical data as the primary crux. Specifically, can empirical findings regarding memory integration and question-framing alter the philosophical conception of dreaming?

  We have pre-registered two hypothetical study designs to test this. Below we record our divergent interpretations of these results *in advance*.

  #### Crux A: The Temporal Locus of Content Generation
  **Condition for Movement:** If data demonstrates that report content is systematically influenced by stimuli presented *after* the alleged dream period but *before* the report, the Dennettian takes this as confirmation of retroactive assembly. The Malcolmian maintains this cannot alter the conceptual logic of dream ascriptions.

  **Stipulated Result 1: The Playback Design**
  *Method:* A 90-second spoken narrative is played during Stage N2. Subject is woken from REM 40 minutes later.
  *Outcome:* Reports incorporate narrative content but describe it as visual (not auditory), deny hearing a voice, and estimate dream duration at 10–15 minutes (mismatching the 90-second stimulus).

  *   **Dennettian Prediction & Interpretation:**
      *   *Prediction:* We expect exactly this distortion.
      *   *Interpretation:* This demonstrates **retroactive assembly**. The brain integrates external stimuli into a narrative construct at the moment of waking. The modality shift (auditory stimulus → visual report) and time dilation prove the report is not a read-out of a stored experience. It favours the hypothesis that the "dream" is generated at reporting.
  *   **Malcolmian Prediction & Interpretation:**
      *   *Prediction:* Irrelevant to the concept.
      *   *Interpretation:* This demonstrates **the grammar of description**. Even if the stimulus influenced the report, the subject's assertion "I dreamt..." remains the criterion for the dream's existence. The time distortion does not prove the experience didn't happen; it proves that "dream time" is not "clock time." The Malcolmian denies this bears on the *concept* of occurrence because the concept does not entail isomorphism with physical time. The study assumes the very empirical model of memory (storage/retrieval) that the conceptual argument rejects.

  #### Crux B: The Conditions of Assertion
  **Condition for Movement:** If data demonstrates that dream reporting is highly sensitive to linguistic framing, the Dennettian views this as evidence of confabulation/constructivism. The Malcolmian views this as evidence of the context-sensitivity of the concept.

  **Stipulated Result 2: The Wording Design**
  *Method:* Subjects woken from N1/N3 (no REM).
  *Outcome:* High rate of contentful reports when asked "What were you dreaming?" vs. near-zero rate when asked "Were you dreaming just now?"

  *   **Dennettian Prediction & Interpretation:**
      *   *Prediction:* Confirmed.
      *   *Interpretation:* This demonstrates **question-relative confabulation**. The "What" question presupposes a dream occurred, triggering a narrative search. The "Were" question allows a negative answer. This suggests the "experience" is not a pre-existing state waiting to be reported, but a construction triggered by the demand characteristics of the interview. It supports the view that there is no fact of the matter about the dream prior to the report.
  *   **Malcolmian Prediction & Interpretation:**
      *   *Prediction:* Expected linguistic behaviour.
      *   *Interpretation:* This demonstrates **conceptual context-sensitivity**. The criteria for applying the concept "dreaming" shift with the conversational context. It does not prove the subject is confabulating an experience; it proves that "dreaming" is not a name for a private object that is either present or absent. The Malcolmian denies this settles the ontological question because the "fact of the matter" *is* the sincere assertion under appropriate conditions. The study treats the concept as a natural kind subject to discovery, rather than a rule-governed practice.

  ### 4. Diagnosis of Verbal Dispute

  We conclude that a portion of our dispute is verbal, specifically regarding the term **"Experience."**

  *   **Ambiguity:** When the Dennettian says "Dreams are not experiences," she means "There is no phenomenological stream occurring during sleep isomorphic to the report." When the Malcolmian says "Dreams are not experiences," she means "It is a grammatical mistake to treat 'dreaming' as naming a state of consciousness."
  *   **Resolution:** We agree that the *Standard View* is false. However, the Dennettian wishes to replace it with a *Better Empirical Model* (construction at waking), while the Malcolmian wishes to replace it with a *Better Logical Grammar* (dissolution of the occurrence question).

  **Note on Positional Characterization:**
  *We flag one potential misstatement in the workshop briefing:* The briefing suggests the Malcolmian holds that "a person who is sound asleep is not conscious of anything." While accurate to Malcolm's *Dreaming*, some modern proponents might allow for non-conceptual sentience without "experience" in the full sense. The Malcolmian signer here adheres to the strict 1959 text: no consciousness during sound sleep. The Dennettian signer adheres to the 1976/2005 view: consciousness is a functional construct, not a Cartesian theatre.

  ### 5. Conclusion

  We agree that the Standard View is untenable. We disagree on whether the replacement is a matter of empirical discovery (Dennettian) or conceptual clarification (Malcolmian). We agree that the stipulated studies would be interpreted by us as confirming our respective prior commitments, rather than settling the dispute between us. The Malcolmian views the data as internal to the practice of reporting; the Dennettian views the data as external evidence about the mechanism of reporting. Until the status of "conceptual truth" vs. "empirical hypothesis" is settled, our shared conclusion ("Dreams are not experiences during sleep") will continue to function as a homonym: identical in wording, divergent in sense.

  ***

  **Signed:**

  __________________________ (The Malcolmian)

  __________________________ (The Dennettian)
