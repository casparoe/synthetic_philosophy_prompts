answer: |-
  You have put your finger on the single most persistent and damaging objection to Boorse's Biostatistical Theory (BST). You aren't missing a piece of machinery; rather, you have identified the exact point where the machinery tends to grind its gears. This is often called the **"Universal Disease" objection** or the **"Problem of the Reference Class."**

  However, Boorse does have specific technical defenses built into the theory to block the "common = healthy" inference. Whether those defenses hold water is what divided the field. Here is the breakdown of the machinery you asked about, where it attempts to block your examples, and why it largely failed to convince the philosophical community.

  ### 1. The Defense: Function vs. Frequency
  Your critique rests on the idea that "statistically subnormal" means "less frequent than average." Boorse explicitly denies this. He distinguishes between **statistical normality** (what is common) and **functional normality** (what contributes to survival and reproduction).

  *   **The Mechanism:** For Boorse, a function is normal if it contributes to the organism's goals (survival/reproduction) with typical efficiency. Statistics are only used to *measure* the range of typical efficiency, not to *define* it.
  *   **Applying to BMI:** Even if 70% of the US is overweight, Boorse would argue that the metabolic and cardiovascular systems in those bodies are operating below **species-typical efficiency** regarding survival and reproduction. The fact that it is common doesn't make it functional. The statistical distribution is just the data set used to find the "efficient" range; if the whole data set shifts due to environmental toxicity (e.g., cheap calories), the *functional standard* remains anchored to the biological design.

  **The Weakness:** This requires us to know what "species-typical efficiency" looks like independent of the current population stats. If we can't observe a population *without* the obesity, how do we know the efficiency is subnormal? We end up needing a theoretical model of human biology that looks suspiciously like a normative ideal.

  ### 2. The Defense: Reference Classes (Age and Sex)
  You mentioned age-related hearing loss and myopia. Boorse handles this through **Reference Classes**.

  *   **The Mechanism:** You do not compare a 75-year-old to a 20-year-old. You compare a 75-year-old to the reference class of "75-year-old males."
  *   **Applying to Hearing Loss:** Presbyopia or hearing loss at 80 is statistically normal *for that reference class*. Therefore, it is not a disease. It is "normal aging." However, hearing loss at 20 is statistically subnormal *for the 20-year-old reference class*. Therefore, it is a disease.
  *   **Applying to Myopia:** If 90% of teenagers in East Asia are myopic, Boorse has a harder time. He would have to argue that the visual system's *design* is for distance vision, and myopia is a failure of that design, regardless of frequency.

  **The Weakness:** This works well for age, but it creates the **"Gerrymandering" problem**. How do we carve up reference classes? If we define the reference class as "people living in lead-contaminated cities," then lead poisoning becomes normal for that class. Boorse insists reference classes must be **natural** (age, sex, species), not **environmental**. But critics argue that distinguishing "natural" from "environmental" classes is itself a value judgment.

  ### 3. The Defense: The "Natural Environment" Clause
  This is the specific blocker for your lead poisoning and famine examples.

  *   **The Mechanism:** Boorse argues that disease is a reduction in functional ability *relative to the species' design in a natural environment*. If an environmental agent (lead, famine, virus) impairs function, it is a disease, even if it affects 100% of the population.
  *   **Applying to Lead/Famine:** A population stunted by famine is not "healthy" just because they are all short. Their growth functions are being inhibited by an external agent. The statistical norm is ignored in favor of the **causal history**. If the state is caused by a hostile environmental agent impeding survival goals, it is pathological.

  **The Weakness (The Kingma Objection):** Philosopher Elselijn Kingma (2007) delivered the most famous blow to this defense. She argued that you cannot define function without specifying the environment.
  *   If a fish is designed for water, and you put it on land, it dies. Is the fish diseased? No, the environment is hostile.
  *   If humans are designed for the Pleistocene, and we live in modern cities with sugar and lead, are we diseased?
  *   To say "Lead poisoning is a disease even if universal," Boorse must claim the modern environment is **abnormal** for humans. But who decides which environment is the "correct" one for the species? Choosing the "natural environment" baseline smuggles in a normative judgment about where humans *ought* to live.

  ### 4. Disease vs. Illness
  You asked if the disease/illness distinction helps.
  *   **Boorse's View:** **Disease** is a biological dysfunction (value-free). **Illness** is a condition that is socially disvalued or incapacitating (value-laden).
  *   **Does it block your objection?** No. Your objection is about the definition of *health/disease*, not the social status of the patient. If BST defines the lead-poisoned majority as "healthy" (biologically functional), calling them "ill" (socially disadvantaged) doesn't fix the biological claim. The theory collapses if it cannot identify the poisoning as a biological dysfunction.

  ### 5. Did this cause the drift to Normativism?
  **Yes, overwhelmingly.**
  The inability of BST to cleanly separate "statistical commonality" from "biological dysfunction" without making covert value judgments is the primary reason the field drifted toward **Normativism** (e.g., Nordenfelt) or **Hybrid Theories** (e.g., Wakefield).

  *   **Normativists** argue: You were right initially. Health *is* a value concept. We call obesity a disease not just because of mechanics, but because we value longevity and mobility. If a culture valued the spiritual benefits of fasting-induced stunting, they might not call it a disease.
  *   **Hybrid Theorists (Wakefield):** Jerome Wakefield's **"Harmful Dysfunction"** analysis attempts to save naturalism by adding a normative condition. A condition is a disorder only if:
      1.  There is a **Dysfunction** (failure of a mechanism to perform its evolved function — the Boorse bit).
      2.  It causes **Harm** (as judged by social values).
      *   This handles the "Universal Disease" problem better. Even if lead poisoning is universal (statistically normal), it is still a *dysfunction* (evolutionary mismatch) and it is *harmful*.

  ### Summary
  You haven't missed a gear in the machine; you've found the friction point.
  1.  **Reference Classes** block the age-related decline objection (mostly).
  2.  **Functional Efficiency** (anchored to survival/reproduction) attempts to block the BMI/Obesity objection.
  3.  **The Natural Environment** clause attempts to block the Lead/Famine objection.

  However, all three defenses require judgments that many philosophers argue are covertly normative. Determining the "correct" reference class, the "true" species function, and the "natural" environment involves values. Consequently, most contemporary philosophy of medicine accepts your intuition: a purely statistical/biological definition cannot fully escape the problem that "what is common" often swallows "what is healthy," unless we sneak values in to draw the line.

  **Recommendation:** If you want to read the definitive takedown of the reference class machinery, look up **Elselijn Kingma, "What is it to be healthy?" (2007)**. If you want to see the attempt to fix it, look at **Jerome Wakefield, "The Concept of Mental Disorder" (1992)**.
