answer: |-
  JOINT STATEMENT ON CONSCIOUSNESS AND ACCESS

  Preamble
  We, the undersigned representatives of the Overflow and Global Workspace perspectives, submit this document following a weekend of adversarial collaboration. Our goal was not to resolve our theoretical differences but to isolate the empirical ground where those differences matter. We center this statement on the recent pilot data regarding prepared versus surprise probes, as this design offers a clearer path forward than legacy paradigms.

  Section 1: Agreed Claims
  1. The partial-report tradition establishes that observers retain more information from a brief display than they can report when asked for everything. Both sides accept that performance on a cued subset exceeds performance on a whole-report task, though we disagree on whether the unreported surplus constitutes conscious experience.

  2. Pattern masking interrupts visual processing and prevents further consolidation of the stimulus. We agree that the mask limits the time available for processing but disagree on whether the pre-mask processing includes phenomenology that survives the mask without access.

  3. Neural ignition signatures, such as the P3b component, correlate reliably with reportable access. We agree this signature marks the transition to global availability but disagree on whether it marks the onset of consciousness itself or merely the broadcasting of content already conscious.

  4. The pilot data show a dissociation between accuracy and confidence in the surprise condition. Specifically, observers achieved approximately 61 percent accuracy on surprise probes despite reporting no visual experience on 70 percent of trials and showing flat confidence ratings.

  5. The prepared condition confirms standard access dynamics. Observers achieved 78 percent accuracy with confidence tracking performance, indicating that when attention is pre-positioned, access and report align as expected.

  6. Above-chance performance in the surprise condition does not require global broadcast in the standard sense. Both sides agree that the information used to achieve 61 percent accuracy was not globally available in the same way as the prepared condition, given the lack of confidence and subjective report.

  Section 2: Map of Disagreement

  | Disagreement | Side A (Overflow) Position | Side B (Global Workspace) Position | Type |
  | :--- | :--- | :--- | :--- |
  | **Nature of the Surplus** | The information retained after masking but before report constitutes phenomenal consciousness. It is experienced but lost before it can be accessed for use. | The information retained is unconscious sensory memory. It supports processing but lacks phenomenology until it enters the global workspace. | Substantive |
  | **Meaning of No-Report** | When subjects say they saw nothing, they report a failure of access to experience, not a failure of experience itself. | When subjects say they saw nothing, they report a lack of consciousness. There is no hidden experience lurking behind the report. | Substantive |
  | **Definition of Access** | Access is a downstream process that reads out from consciousness. Consciousness can exist without this readout. | Access is constitutive of consciousness. If content cannot be used for reasoning or report, it is not conscious. | Verbal |

  Section 3: Empirical Cruxes
  We identify three specific questions where further data could force theoretical revision. For each, we specify a manipulation, rival predictions, and conditions for concession.

  Crux 1: The Bridging Principle
  Question: Does reliable use of information imply access? If the surprise condition yields 61 percent accuracy, is that evidence of weak access or evidence of unconscious processing?

  Test: Introduce a secondary cognitive load task during the mask-to-probe interval. If the surprise accuracy relies on fragile unconscious processing, load should degrade it. If it relies on a robust phenomenal store, it may resist load until readout is required.

  Side A Prediction: Surprise accuracy will remain stable under load. Phenomenal consciousness is a distinct store that holds information independently of cognitive resources until access is requested.
  Side B Prediction: Surprise accuracy will drop to chance under load. The 61 percent advantage relies on residual processing that competes for resources; without global broadcast, the trace is fragile.

  Condition for Concession:
  Side A will abandon the overflow interpretation if surprise accuracy collapses under load, indicating the surplus was not a stable conscious store.
  Side B will acknowledge a form of non-reportable consciousness if surprise accuracy remains robust despite load, suggesting a store independent of global access.

  Crux 2: The Report Gap
  Question: Can flat confidence and denial of seeing anything be evidence about phenomenology, or only evidence about reporting?

  Test: Use a wagering paradigm instead of confidence ratings. Subjects bet real money on their accuracy. This bypasses scale interpretation and ties confidence to tangible risk.

  Side A Prediction: Wagering will remain low despite accuracy. Subjects will not bet on experiences they cannot access, confirming the dissociation between having experience and trusting it.
  Side B Prediction: Wagering will track accuracy. If subjects can use the information to answer, they can use it to bet. Flat confidence is an artifact of the rating scale, not the mental state.

  Condition for Concession:
  Side A will accept that confidence is a valid proxy for consciousness if wagering aligns with accuracy, removing the dissociation.
  Side B will accept that phenomenology exceeds access if subjects refuse to bet on correct answers, showing they feel they are guessing despite performing above chance.

  Crux 3: The Mechanism of Advantage
  Question: Is the surprise advantage a late readout from a rich trace or the output of local processing that never needed broadcast?

  Test: Vary the mask-to-probe interval in finer steps beyond one second. If the advantage is a decaying trace, it should fade smoothly. If it is local processing, it may hit a floor abruptly or remain stable.

  Side A Prediction: Performance will decay gradually over time. Phenomenal traces fade like sensory memory, showing a continuous loss of information.
  Side B Prediction: Performance will remain stable then drop sharply. Unconscious processing completes quickly; once the window closes, no information remains.

  Condition for Concession:
  Side A will reject the rich trace model if performance shows a step-function drop, indicating a processing window rather than a fading store.
  Side B will reject the local processing model if performance shows a gradual decay curve, indicative of a stored representation persisting over time.

  Conclusion
  We sign this statement to affirm that our dispute is not about the data but about the architecture that produces it. The prepared-versus-surprise design offers a way to test that architecture without relying on introspective debates. We commit to running the proposed tests and accepting the outcomes specified above.

  Signed,
  Representative, Overflow Perspective
  Representative, Global Workspace Perspective
