prompt: |-
  I'm putting together a 2,000-word piece for a small magazine that's read mostly by working translators and the odd philosopher of language, and I've got the core argument down in draft but I can't see it straight any more. Could you read it as an expert — ideally you're a poet-translator who has actually done formal verse translation *and* reads philosophy of language, so you can be blunt about both the craft and the logic — and tell me what's wrong with it?

  Think it through properly before you write anything. In particular, actually try to break the two corollaries with concrete counterexamples rather than just noting that they're under-argued. But in your reply, lead with your bottom line in the very first sentence — one sentence saying whether you think the central thesis survives contact with someone who knows this material — and then give me the reasoning. No preamble, no restating the question back at me, no summary of the draft.

  Two ground rules. Don't hand me a reading list, citations, or any "as so-and-so argued" — I can't check them and I don't want them; I want your own judgement. And where you're not certain of a fact, French especially, say you're not certain instead of bluffing; flagging the shaky bits is genuinely useful to me.

  Background you can take as given: it's Clément Marot's tiny poem to a sick young woman, the one Hofstadter built a whole book around. Twenty-eight lines, three syllables to a line, stress on the final syllable of every line, fourteen rhyming couplets, the opening line repeated as the closing line, the poet's own name worked into the middle, and a switch from *vous* to *tu* partway through.

  Here's the draft:

  ---

  **The hinge couplet**

  Everyone who discusses Marot's little poem lists the same seven things about it: twenty-eight lines, three syllables each, end-stressed, fourteen rhyming couplets, the *vous*-to-*tu* switch, the first line echoed by the last, the poet's own name tucked inside. The list is always presented as a set of difficulties — here is the mountain, here are its seven slopes. My claim is that one of the seven isn't a difficulty at all but a device, and that once you see it, several of the others stop being separate items on a list and start looking like consequences.

  The item I mean is the change of address. It doesn't happen between couplets. It happens inside one:

  > Vitement,
  > Car Clément
  > Le vous mande.
  > Va, friande
  > De ta bouche,

  Line thirteen closes the formal section. Line fourteen opens the intimate one. And those two lines are a rhyming pair — *mande* / *friande* — so the poem's whole volte-face is delivered across the seam of a single couplet, at the exact midpoint of twenty-eight lines.

  A translator can't afford to treat that as a coincidence, and here is why. In a rhyming couplet the second line is not free: it's selected from whatever the language happens to offer that sounds like the first. The couplet is therefore a machine for making a semantic decision under phonological duress. Read that way, Marot's pivot has a mechanical explanation alongside the situational one — he needed a rhyme for *mande*, and *friande* was sitting there, and *friande* is not a word you use to somebody you are still being formal with. Whether the intimacy caused the rhyme or the rhyme caused the intimacy is not answerable from the poem. But the poem is arranged so that you cannot ask the question without noticing that the two registers are made to touch, physically, inside the same sound.

  Which gives me the thesis: in this poem form is not the packaging of the content, it is the mechanism of the content. The couplet is the joint on which the argument turns. If that's right, the standard consolation offered in translation studies — that you trade form against meaning, that something is always lost but the sense survives — misdescribes what's being lost. A translator who keeps the sense and drops the couplet structure has not delivered the same argument in worse clothes. They have delivered a different argument: one in which the change of address is a fact about the speaker's mood rather than a fact about the structure of the address itself.

  Two corollaries, both of which I half expect to be wrong about:

  1. A translation that keeps the couplets but relocates the pivot (say, to after the jam lines) is *worse* than one that keeps the pivot and abandons the couplets — because the pivot is the load-bearing element and the couplet is only the joint it happens to occupy. I suspect most people who read translations would rank these the other way round.

  2. English versions that compensate for the missing T–V distinction with *thou* and *thee* are not conserving the register shift so much as inverting its feel. Those forms did map familiar-onto-formal in the sixteenth century, but they read as churchy and archaic-formal now, so the compensation preserves the diagram while destroying the effect the diagram was there to produce.

  The honest conclusion, I think, is that a perfect rendering of this poem is impossible not because seven constraints are jointly hard, but because at least one of them — the one doing the actual work — can only be re-indexed onto some other axis in English, and re-indexing changes what the poem is about. [weak? is this a cop-out?]

  ---

  What I want from you, in this order:

  1. The thesis itself. Is "form as mechanism rather than packaging" doing any real work here, or is it a slogan that dissolves once you press on it?
  2. The two corollaries. Take a genuine run at each with a specific counterexample — an imagined translation, a case from another constrained poem, whatever — and tell me if either is false rather than merely under-defended.
  3. Accuracy. Is my account of *mande*/*friande* and the register of *friande* right? Is the *thou*/*thee* point correct about the direction of the shift, and is it correct that the archaism now reverses the felt register? Say where you're guessing.
  4. Interest. For an audience that already knows this poem and knows the general shape of the debate, is any of this news? Point at the paragraph that's most likely to make a translator think "yes, obviously".
  5. Cuts. What goes? I suspect the "machine for making a semantic decision under phonological duress" bit is showing off, but tell me whether it's load-bearing or not.
  6. The last paragraph. Does it follow from what comes before it, or have I quietly swapped a claim about one couplet for a claim about untranslatability in general?

  Cheers — be as rude as the material warrants.
