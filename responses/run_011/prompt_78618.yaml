prompt: |-
  Fifteen proposals a year land on my desk for a university press series in comparative economic history, and most of them promise to answer some large contrastive question: why mechanized industry emerged in Britain rather than in the Yangzi delta, why modern science took the form it did in Europe and not in China, why the West rose and the rest did not. My readers' reports on these are uselessly divided — one calls the question profound, the other calls it malformed and unanswerable as asked — and I have no way to adjudicate before committing two specialists and a year to a manuscript. I need something I can run myself, in about an hour, without specialist knowledge of the period.

  Write me a procedure for testing whether a contrastive historical question is well posed, and whether a given manuscript could in principle answer it rather than merely discuss it. Give me the questions to ask in order and what would count as a sufficient answer to each: how the foil gets fixed and who gets to fix it; what the explanandum has to be described as for the contrast to be determinate at all; what it takes for a candidate cause to explain the difference between the two sides rather than just the fact on one side; and how to handle causes present on both sides, causes sufficient but not necessary, causes that would equally have produced the foil, and cases where the two sides are not units of the same kind. Mark clearly where the procedure terminates in a verdict I can act on, where it hands the decision to a historian's judgment, and which distinctions it may safely compress for a non-specialist and which it must not.

  Then run it on three proposals: an England-versus-Yangzi-delta account of the industrial takeoff; a restatement of the Needham question; and a book from our best-selling author asking why the West rose and the rest did not, which I have already assured the marketing department we will publish. At least one of the three should produce an answer I will not like. Close by stating what the procedure cannot detect — the ways a malformed contrast can pass every step.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** An editor at a university press (comparative economic history series).
      *   **Problem:** Receives ~15 proposals/year asking "Big Contrastive Questions" (e.g., Great Divergence, Needham Question, Rise of the West). Peer reviews are split (profound vs. malformed). Editor lacks specialist knowledge to adjudicate *before* committing resources (2 specialists, 1 year).
      *   **Task:** Create a procedure (checklist/test) to evaluate if a contrastive historical question is well-posed and if a manuscript can *answer* it (not just discuss it).
      *   **Constraints:** Must be runnable by the editor in ~1 hour, without specialist knowledge. Must specify questions, sufficient answers, termination points (verdict vs. historian judgment), and compression limits.
      *   **Application:** Run the procedure on three specific proposals:
          1.  England vs. Yangzi Delta (Industrial Takeoff).
          2.  Needham Question (Science in Europe vs. China).
          3.  Best-selling author's "Why the West Rose and the Rest Did Not" (already promised to marketing).
      *   **Requirement:** At least one result must be unfavorable ("an answer I will not like").
      *   **Closing:** State limitations (what the procedure *cannot* detect).

  2.  **Deconstruct the Philosophical/Historical Logic:**
      *   The core issue is *contrastive explanation* (van Fraassen, Lipton, etc.).
      *   Key logical traps in comparative history:
          *   *Selection Bias:* Choosing the winner and loser after the fact.
          *   *Unit Homogeneity:* Comparing things that aren't comparable (apples/oranges).
          *   *Explanans/Explanandum mismatch:* Explaining the fact, not the *difference*.
          *   *Counterfactual robustness:* Would the cause have produced the foil?
          *   *Reification:* Treating "The West" or "China" as monolithic agents.
      *   The procedure needs to operationalize these logical constraints into yes/no questions for a non-specialist.

  3.  **Drafting the Procedure (The "Editor's Filter"):**
      *   *Goal:* Speed and logical rigor, not historical truth.
      *   *Step 1: The Foil (The Counterfactual).* Is the alternative clearly defined? Who chose it?
      *   *Step 2: The Explanandum (The Fact).* Is the outcome defined identically on both sides?
      *   *Step 3: The Variable (The Cause).* Does it vary *with* the outcome? (Mill's Method of Difference).
      *   *Step 4: Symmetry.* Are the units comparable?
      *   *Step 5: Sufficiency/Necessity.* Handling overlapping causes.
      *   *Decision Nodes:* Clear "Reject," "Proceed," or "Send to Review."

  4.  **Refining the Procedure for the User's Constraints:**
      *   *Time:* ~1 hour. So, max 5-6 critical questions.
      *   *Knowledge:* Non-specialist. Avoid jargon like "coterminous causality." Use "Does X exist in both places?"
      *   *Verdicts:* Needs to be actionable.
      *   *Compression:* Can compress specific historical dates/events. Cannot compress logical structure of the argument.

  5.  **Developing the Three Test Cases:**
      *   *Case 1: England vs. Yangzi (Pomeranz-style).* Generally considered a "good" comparison in recent historiography (similar development levels c. 1750). *Verdict:* Pass (with caveats).
      *   *Case 2: Needham Question (Science in Europe vs. China).* Often criticized for defining "science" anachronistically or teleologically. *Verdict:* Fail/Warning (The "answer I will not like" candidate, or maybe Case 3). Let's make Case 2 the logical failure.
      *   *Case 3: "West vs. Rest" (Best-seller).* This is the trap. The user *already promised* to publish. The procedure *must* flag this as problematic to satisfy the prompt ("At least one... answer I will not like"), creating tension between the logical verdict and the marketing commitment. This adds realism and drama.

  6.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the editor's plight. Validate the need for a logical filter.
      *   **The Procedure (The "Contrastive Validity Protocol"):**
          *   Break it down into Steps.
          *   Define "Pass," "Fail," and "Defer."
          *   Highlight where specialist knowledge is *not* needed (logic) vs. where it *is* (facts).
      *   **Running the Protocol:**
          *   *Proposal A (England/Yangzi):* Show it passes the logical checks (units are comparable, outcome is specific).
          *   *Proposal B (Needham):* Show it fails on the definition of the outcome (What is "modern science"?).
          *   *Proposal C (West/Rest):* Show it fails on Unit Homogeneity and Foil Selection, but note the marketing constraint. *This is the one the editor won't like.*
      *   **Limitations:** What slips through? (Data quality, narrative bias, hidden teleology).

  7.  **Self-Correction/Refinement during drafting:**
      *   *Critique:* Is the procedure too abstract?
      *   *Fix:* Make the questions concrete. Instead of "Is the explanandum determinate?" ask "Can you measure the outcome in both places using the same ruler?"
      *   *Critique:* Is the "West vs. Rest" verdict too harsh given the marketing promise?
      *   *Fix:* The prompt asks for an answer the editor *will not like*. Finding out the best-seller is logically flawed *is* the unpleasant answer. I must be honest in the simulation.
      *   *Critique:* Ensure the distinction between "answering" and "discussing" is clear.
      *   *Fix:* Add a specific test for "The Difference Maker." If the cause exists in both, it doesn't explain the difference.

  8.  **Final Polish:**
      *   Tone: Professional, analytical, slightly weary (matching the editor's voice).
      *   Formatting: Use bolding, lists, and clear headers for readability.
      *   Check constraints: 1 hour? Yes. Non-specialist? Yes. 3 proposals? Yes. Unpleasant truth? Yes. Limitations? Yes.

  9.  *(Self-Correction on the "Needham" case)*: Actually, the "West vs. Rest" is the more obvious candidate for a "malformed" question that sells well. The Needham question is often debated but can be framed rigorously. The "West vs. Rest" is almost logically impossible to frame well due to heterogeneity. I will make the "West vs. Rest" proposal the one that fails the logic test, creating the conflict with the marketing department. This fits the "answer I will not like" requirement perfectly.

  10. *(Final check on the Procedure)*: Ensure I explicitly mark where the editor decides vs. the historian.
      *   Editor decides: Logical structure.
      *   Historian decides: Factual accuracy.

  11. *(Drafting the Limitations)*: Crucial section. A logically valid argument can still be historically wrong (garbage in, garbage out). The procedure tests the *container*, not the *wine*.

  12. *Final Review against Prompt:* "Mark clearly where the procedure terminates in a verdict I can act on..." -> I will use [STOP: REJECT] / [STOP: APPROVE] markers.

  (Proceed to generate output based on these thoughts.)
answer: |-
  # The Contrastive Validity Protocol (CVP)

  **Purpose:** To determine if a comparative historical question is logically coherent and if a manuscript claims to *explain a difference* rather than merely *narrate an outcome*.
  **Time Required:** 45–60 minutes.
  **Prerequisites:** The proposal, the introduction, and the conclusion of the manuscript (or detailed chapter outline). No specialist knowledge of the regions or periods is required.

  ---

  ## Part I: The Procedure

  ### Step 1: The Foil Fixation Test
  **Question:** Who selected the comparison, and is the alternative (the foil) fixed *before* the explanation begins?
  **Ask:** Does the author treat the "loser" of the comparison (e.g., China, the Rest) as a static baseline, or as a historical path that could have produced the "winner's" outcome?
  **Sufficient Answer:** The author must explicitly state why *this* specific alternative was chosen over others (e.g., "Yangzi Delta chosen because GDP/capita was equivalent to England in 1750," not "China chosen because it is China").
  **Failure Mode:** The foil is chosen because it is familiar, or because it failed.
  **Verdict:**
  *   **If the foil is arbitrary:** [STOP: REJECT]. The contrast is post-hoc rationalization.
  *   **If the foil is justified by pre-outcome similarity:** Proceed to Step 2.
  *   **Editor vs. Historian:** You judge the *logic* of the selection. You do not need to know if the GDP data is correct, only if the author claims the similarity exists *prior* to the divergence.

  ### Step 2: The Explanandum Symmetry Test
  **Question:** Is the thing being explained (the outcome) described in the same terms on both sides?
  **Ask:** Can the outcome be measured or identified in *both* cases using the same definition?
  **Sufficient Answer:** A definition of the outcome that applies to both units without stretching. (e.g., "Mechanized cotton spinning" exists in both; "Modernity" does not).
  **Failure Mode:** Defining the outcome by the winner's characteristics (e.g., "Why Europe developed *Science*" vs. "Why China developed *Natural Philosophy*").
  **Verdict:**
  *   **If the outcome is defined asymmetrically:** [STOP: REJECT]. You are comparing a specific event to a vague atmosphere.
  *   **If the outcome is symmetric:** Proceed to Step 3.
  *   **Compression Warning:** Do not get bogged down in whether the definition is historically "rich." Compress this to: "Could a census taker measure this in both places?"

  ### Step 3: The Difference-Maker Test (Mill's Method)
  **Question:** Does the proposed cause vary *with* the outcome?
  **Ask:** Is the candidate cause present in the "winner" and absent (or significantly weaker) in the "loser"?
  **Sufficient Answer:** The author demonstrates the cause is missing or distinct in the foil.
  **Failure Mode:** Citing a cause that exists in both places (e.g., "Protestant Ethic" when similar merchant ethics existed in China).
  **Verdict:**
  *   **If the cause exists in both:** [STOP: SEND BACK]. The author explains the *fact*, not the *difference*. They must rewrite to find a variable that actually differs.
  *   **If the cause varies:** Proceed to Step 4.
  *   **Editor vs. Historian:** You do not verify if the cause *actually* existed. You verify if the author *claims* it varies. If they claim it varies, pass this step.

  ### Step 4: The Unit Homogeneity Test
  **Question:** Are the two sides units of the same kind?
  **Ask:** Is the comparison between comparable political/social scales?
  **Sufficient Answer:** Region vs. Region, Empire vs. Empire, City vs. City.
  **Failure Mode:** "The West" (a continent/cultural construct) vs. "China" (a state/empire).
  **Verdict:**
  *   **If units are mismatched:** [STOP: REJECT]. This is a category error.
  *   **If units are matched:** Proceed to Step 5.
  *   **Compression Warning:** You may accept "Europe" if defined as a specific set of states, but reject "The West" as a civilizational blob.

  ### Step 5: The Counterfactual Robustness Test
  **Question:** If the cause were present in the foil, would the outcome have occurred?
  **Ask:** Does the author argue that the cause was *sufficient* to produce the outcome, or merely contributory?
  **Sufficient Answer:** The author addresses "Overdetermination." If multiple causes exist, do they explain why *this* one tipped the scale?
  **Failure Mode:** Listing factors present in the winner without explaining why those factors didn't trigger the outcome earlier or elsewhere.
  **Verdict:**
  *   **If the argument relies on a "magic spark" without mechanism:** [DEFER TO SPECIALISTS]. Logic holds, but historical plausibility is unknown.
  *   **If the mechanism is clear:** [APPROVE FOR REVIEW].

  ---

  ## Part II: Application to Proposals

  ### Proposal 1: *The Great Divergence Revisited* (England vs. Yangzi Delta)
  **Subject:** Industrial takeoff.
  **Claim:** Coal geography and colonial access caused England's divergence from the Yangzi Delta post-1750.

  *   **Step 1 (Foil):** Author argues Yangzi and England had equivalent wages/consumption in 1750. Foil is fixed by economic data *prior* to divergence. **[PASS]**
  *   **Step 2 (Symmetry):** Outcome is "mechanized textile production and coal energy use." Measurable in both. **[PASS]**
  *   **Step 3 (Difference-Maker):** Author claims accessible coal was near Yangzi but required shipping for England? No, claims coal was *accessible* in England, distant in China. Claims colonies provided land-equivalents for England, not China. Variables vary. **[PASS]**
  *   **Step 4 (Units):** Region (England) vs. Region (Yangzi Delta). Not Empire vs. Empire, but core economic zones. **[PASS]**
  *   **Step 5 (Robustness):** Argues that without coal/colonies, Yangzi would have hit ecological ceiling same as Europe. **[PASS]**

  **Verdict:** **[APPROVE FOR REVIEW]**
  **Note:** This is a logically sound contrast. The specialists will fight about the data, but the question is well-posed.

  ### Proposal 2: *The Needham Question Restated* (Europe vs. China)
  **Subject:** Emergence of modern science.
  **Claim:** Institutional fragmentation in Europe allowed intellectual freedom, whereas Chinese unity stifled it.

  *   **Step 1 (Foil):** Foil is "China." Chosen because it was the other major Eurasian power. **[PASS]**
  *   **Step 2 (Symmetry):** Outcome is "Modern Science." Author defines this as "mathematized hypothesis testing leading to industrial application."
      *   *Problem:* Does the author identify "Modern Science" in China to measure its absence? Or is "Science" defined by the European outcome?
      *   *Check:* Author admits China had "technology" but not "science." This defines the outcome by the winner's traits. **[FAIL]**
  *   **Step 3 (Difference-Maker):** Cause is "Political Fragmentation."
      *   *Check:* Europe was fragmented; China was unified. Variable varies. **[PASS]**
  *   **Step 4 (Units):** "Europe" (Continent of competing states) vs. "China" (Single Empire).
      *   *Problem:* Is Europe a unit? Or is it "France vs. England"? If the unit is "Civilization," it is too vague. If the unit is "State Systems," it works. Author treats "Europe" as a singular actor that was "fragmented." This is logically slippery but passable if defined as "State System." **[WARN]**
  *   **Step 5 (Robustness):** If China had fragmented, would science have emerged? Author says yes.

  **Verdict:** **[SEND BACK FOR REVISION]**
  **Reason:** Failure at Step 2. The outcome ("Science") is defined teleologically by the European result. To fix, the author must define a specific technical capability (e.g., "ballistic trajectory calculation") and show it emerged in Europe and not China for the stated reasons. As it stands, it explains why Europe is Europe, not why a specific capability diverged.

  ### Proposal 3: *Why the West Rose and the Rest Did Not* (Best-Selling Author)
  **Subject:** Global dominance.
  **Claim:** Cultural superiority and legal traditions allowed the West to dominate.
  **Status:** **Contracted.** Marketing expects publication.

  *   **Step 1 (Foil):** Foil is "The Rest."
      *   *Check:* "The Rest" includes the Inca, the Ottomans, the Qing, and the Zulu. They are grouped solely by *not* being the West. This is a residual category, not a historical foil. **[FAIL]**
  *   **Step 2 (Symmetry):** Outcome is "Rose."
      *   *Check:* "Rose" implies economic, military, and political dominance. Did the "Rest" fail at all three? Did Japan "rise"? Did India? The outcome is undefined for the foil. **[FAIL]**
  *   **Step 3 (Difference-Maker):** Cause is "Culture/Law."
      *   *Check:* Does the author show specific legal mechanisms present in the West and absent in *all* of "The Rest"? Unlikely. Some "Rest" societies had strong property rights. **[FAIL]**
  *   **Step 4 (Units):** "The West" vs. "The Rest."
      *   *Check:* "The West" is a cultural construct, not a political or geographic unit comparable to specific states or regions. Comparing a cultural sphere to a geopolitical residual is a category error. **[FAIL]**

  **Verdict:** **[LOGICALLY INVALID]**
  **Action Required:** You have a contract. You cannot reject.
  **Recommendation:** You must force a reframing. The manuscript cannot answer the title's question because the question is malformed.
  **Editor's Note:** *This is the answer you will not like.* You must tell your best-seller that their central thesis is logically incoherent. They must rewrite the book to compare specific states (e.g., Britain vs. Qing) or admit the book is a narrative essay, not a comparative explanation. If they refuse, the book will be torn apart by reviewers (as per your prompt's description of split reports).

  ---

  ## Part III: Limitations of the Procedure

  The CVP protects you from logical errors, but it cannot detect historical falsehoods. A manuscript can pass every step above and still be wrong.

  1.  **Garbage In, Garbage Out:** The procedure checks if the cause *varies*, not if the cause *exists*. An author can claim "England had coal, China did not" (Pass Step 3). If specialists later prove China had accessible coal, the logic holds but the history is false.
  2.  **Hidden Teleology:** An author can define the outcome symmetrically (e.g., "Steam Engines") but select the start date of the comparison *after* the conditions for steam engines were already met in the winner. The procedure checks pre-outcome similarity (Step 1), but subtle dating manipulation can slip through.
  3.  **Narrative Bias:** A logically sound comparison can be driven by a "Just-So Story." The procedure ensures the *structure* of the explanation is valid (A caused B, and A was absent in C), but it cannot measure the *weight* of the cause. A trivial difference (e.g., "coal depth") might pass as the explanation for a massive divergence, satisfying the logic while offending historical plausibility.
  4.  **The "Black Box" Mechanism:** The procedure verifies that a cause is proposed. It does not verify the *mechanism*. An author can claim "Culture caused Divergence" and pass Step 3. Unless they open the black box of *how* culture alters economic output, the explanation is empty, yet logically valid.

  **Final Instruction:** Use the CVP to filter the 15 proposals down to the 5 that are *capable* of being true. Then send those to the specialists to determine which ones *are* true. Do not send the malformed ones to specialists; they will waste a year arguing about the question rather than the answer. Except for the best-seller. For that one, use the CVP as leverage to force a rewrite before the reviews come in.
