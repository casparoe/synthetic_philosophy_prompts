      *   *Attempt 3 (Addressing the "Buys Nothing" claim):* When does it buy something? It buys something if it changes how you design the system. If it's a tool, you optimize for storage. If it's a mind, you optimize for *retrieval latency* and *integration*. It changes the ethics of access (locking the wiki is like lobotomizing the team).

