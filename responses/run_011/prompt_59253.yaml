answer: |-
  The disagreement between you and your postdoc is not merely verbal. It maps onto a genuine debate in the philosophy of cognitive science known as the **Extended Mind Thesis (EMT)**, most famously articulated by Andy Clark and David Chalmers.

  Your postdoc is arguing for EMT: that the cognitive system of the lab group extends beyond the skin and skull of the individuals to include the wiki. You are arguing for a traditional internalist view: that the wiki is a tool the mind uses, but not part of the mind itself.

  To decide who has the better of it, we must determine whether classifying the wiki as "cognition" yields different predictions, explanations, or management strategies than classifying it as "information storage." If the classification changes nothing but the vocabulary, you are right: it is ontological dressing. If it changes how you understand the failure mode and how you should prevent future ones, your postdoc is right.

  Here is what turns on the disagreement, and the specific conditions under which his claim holds water.

  ### 1. What Turns on the Disagreement
  The core distinction is between **coupling** and **integration**.
  *   **Your view (Coupling):** The scientists are coupled to the wiki. They perceive a problem, deliberate, decide to query the wiki, interpret the result, and act. The wiki is an external resource, like a library book.
  *   **The Postdoc's view (Integration):** The scientists are integrated with the wiki. The wiki functions as a transparent layer of their memory. They do not "query" it; they "recall" from it. The process of looking up the information is as automatic and unconscious as retrieving a memory from biological neural tissue.

  If your postdoc is right, the 10-day outage was not an administrative inconvenience; it was a **functional lobotomy**. The difference matters for three practical reasons:

  1.  **Risk Assessment:** If the wiki is a tool, its loss is a logistical bottleneck. If it is part of your cognitive system, its loss is a catastrophic impairment of agency. You do not insure a "tool" the same way you safeguard "memory." The latter requires redundancy that mimics neural plasticity (e.g., distributed local caches, mandatory mental rotation of duties) rather than just server backups.
  2.  **Training and Onboarding:** If the wiki is a tool, training involves teaching students *how to use* the wiki. If it is part of the cognitive system, training involves *embedding the wiki into the students' cognitive habits* until the distinction between internal and external knowledge dissolves. The goal shifts from "literacy" to "fluency."
  3.  **Responsibility and Error:** If the wiki contains an error, is it a data correction or a cognitive correction? If it is part of the mind, correcting the wiki is akin to correcting a false belief. This changes the protocol for revisions. You don't just "update the file"; you must ensure the "belief" is propagated to all nodes (lab members) to prevent cognitive dissonance in the system.

  ### 2. Conditions for the Postdoc's Claim to Be True
  For the postdoc's claim to amount to more than a redescription, the wiki must satisfy specific functional criteria that make it indistinguishable from biological memory during normal operation. Based on the criteria for extended cognition, the following must be true of your wiki:

  **A. Constant Availability (The "Always-On" Condition)**
  *   **Requirement:** The wiki must be as reliably accessible as biological memory. You do not expect your brain to "load" when you need to remember a protocol; it is simply there.
  *   **Lab Context:** If the wiki requires logging in, navigating a slow interface, or dealing with occasional downtime, it functions as a tool. If it is open on a second monitor, indexed instantly, and treated as perpetually present, it functions as memory. The 10-day outage suggests you met the availability threshold so strictly that the *absence* caused a system crash, not just a slowdown.

  **B. Automatic Trust (The "Endorsement" Condition)**
  *   **Requirement:** Information retrieved from the wiki must be accepted automatically, without critical verification, just as you trust your own recollection of a phone number.
  *   **Lab Context:** If a student reads a protocol on the wiki and then double-checks it against a textbook or asks a PI for confirmation, the wiki is a reference tool. If they read it and immediately pipette, treating the text as a direct command from their own brain, the wiki is part of the cognitive loop. The fact that work *stopped* rather than *slowed down* (e.g., by switching to manual recall) suggests the trust was absolute.

  **C. Cognitive Offloading (The "Plasticity" Condition)**
  *   **Requirement:** The internal biological memory of the users must have changed to accommodate the external storage. This is the strongest evidence your postdoc has.
  *   **Lab Context:** You noted that senior postdocs were hit hardest because their recall was "calibrated against the wiki rather than stocked with its contents." This is **cognitive offloading**. They did not just store the *location* of the information (which would be tool use); they stopped storing the *information* itself (which is extended memory). Their brains pruned the neural pathways for that specific knowledge because the wiki made them metabolically unnecessary. This makes the server outage functionally equivalent to brain damage in those specific domains.

  **D. Transparency of Access (The "Phenomenology" Condition)**
  *   **Requirement:** The act of accessing the information should not feel like "looking something up." It should feel like "remembering."
  *   **Lab Context:** When a postdoc encounters a troubleshooting issue, do they say, "I need to check the wiki," or do they instinctively navigate to the page while thinking about the problem? If the interface disappears from their conscious attention and they engage directly with the *content*, the medium has become transparent.

  ### 3. Verdict
  Your postdoc likely has the better of it, provided the conditions above hold.

  You suspect he is dressing up an ordinary point in ontologically loaded language. However, the ordinary point ("we depend on this") fails to capture the **structural vulnerability** you experienced. If you merely depended on the wiki as a tool, the outage would have been like losing a calculator: annoying, forcing you to do long division, but leaving your mathematical competence intact.

  Instead, you describe a loss of *capacity*. The senior postdocs could not do the work. This implies their competence was not internal, waiting to be accessed, but distributed, waiting to be reassembled. The "lesion" analogy is explanatorily superior because it accounts for the specific pattern of the failure: the most experienced members (who had offloaded the most) were the most impaired. In a "tool dependency" model, experienced members should be the *least* impaired, as they have the most internal knowledge. The fact that the opposite occurred confirms the Extended Mind hypothesis.

  **Conclusion:**
  Treat the wiki as part of your cognitive system. This is not just semantics; it dictates that your backup strategy is not IT security, but **cognitive preservation**. It means you cannot simply restore the server; you must verify that the "memory" is consistent with the current reality of the lab. It means you should worry about "cognitive atrophy" in your students if they rely on it too early. Your postdoc's language buys you a more accurate model of your group's vulnerability, one that explains why a server failure paralyzed your senior staff rather than just inconveniencing them.
