  # Decision Tree: The White Shoe Problem

  **Start:** You are told that finding a white shoe supports the claim "All ravens are black." You find this unacceptable.

  **Node 1 (Case A: The Socks)**
  *Case:* You claim, "All 18 socks in this closed drawer are blue." You have not looked inside yet. You look around the room and see a red shoe (not a sock, not blue).
  *Question:* Does seeing the red shoe make your claim about the socks even slightly more likely to be true than it was before you looked?
  *   **No** → Go to **Leaf 1**.
  *   **Yes** → Go to **Node 2**.

  **Node 2 (Case C: The Population)**
  *Case:* Imagine a world with only 1 raven and 1,000,000 non-black things (shoes, snow, milk). You find a white shoe. You also imagine finding the 1 black raven.
  *Question:* Does finding the common white shoe tell you *less* about whether "All ravens are black" is true than finding the rare black raven?
  *   **Yes** → Go to **Leaf 2**.
  *   **No** → Go to **Node 3**.

  **Node 3 (Case B: The Empty Box)**
  *Case:* You claim, "All coins in this box are gold." It is known with certainty that the box is empty. You hold a silver spoon (not a coin, not gold).
  *Question:* Does holding the silver spoon support your claim about the coins in the box?
  *   **No** → Go to **Leaf 3**.
  *   **Yes** → Go to **Node 4**.

  **Node 4 (The Predicates)**
  *Case:* Consider the claim "All emeralds are green." This is logically the same as "All non-green things are non-emeralds." You find a red ruby (non-green, non-emerald).
  *Question:* Does testing the red ruby feel like testing the *same natural law* as testing a green emerald?
  *   **No** → Go to **Leaf 4**.
  *   **Yes** → Go to **Node 5**.

  **Node 5 (The Method)**
  *Case:* You want to test "All ravens are black."
  *Scenario X:* You deliberately go out to find non-black things to check if they are ravens. You find a white shoe.
  *Scenario Y:* You stumble upon a white shoe by accident while walking.
  *Question:* Does the white shoe support the claim *more* in Scenario X than in Scenario Y?
  *   **Yes** → Go to **Leaf 5**.
  *   **No** → Go to **Leaf 6**.

  ***

  **Leaf 1:** Drop the Equivalence Condition
  **Leaf 2:** Confirmation Relative to Background Knowledge
  **Leaf 3:** Drop/Modify Nicod's Condition
  **Leaf 4:** Restrict Lawlike Universal
  **Leaf 5:** Confirmation Depends on Testing Procedure
  **Leaf 6:** Bite the Bullet

  ***

  # Notes and Diagnosis

  ### Logic of the Tree
  The tree isolates the specific intuition driving the rejection of the paradox.
  *   **Node 1** tests whether the user accepts the basic logic of elimination ($\neg B \land \neg R$ reduces the class of potential counterexamples) in a finite, tractable set. Rejecting this suggests the user believes logical equivalence does not preserve confirmation status.
  *   **Node 2** tests whether confirmation is purely logical or sensitive to population frequencies (Good's argument).
  *   **Node 3** tests whether confirmation requires existential import or positive instances of the subject term (Nicod's criterion vs. contrapositive).
  *   **Node 4** tests whether predicate quality ("natural kinds") matters for confirmation (Quine's argument).
  *   **Node 5** tests whether the *procedure* of data collection matters (methodological resolutions).

  ### Empty-Cell Diagnosis
  **Logically Available but Undefended:**
  1.  **Node 1 (No) → Node 3 (Yes):** Rejecting confirmation for the finite sock case but accepting it for the empty box case.
      *   *Diagnosis:* **Incoherent.** If logical equivalence fails to transfer confirmation in a finite set where truth conditions are clear (Socks), there is no logical basis for it to hold in an empty set where truth is vacuous (Empty Box). This combination implies a misunderstanding of the logical relationship between the cases.
  2.  **Node 1 (Yes) → Node 2 (No) → Node 3 (No) → Node 4 (No):** Accepting elimination, rejecting background, rejecting empty subjects, *and* rejecting predicate quality.
      *   *Diagnosis:* **Unfashionable/Over-determined.** This path accepts the logic of equivalence (Node 1) but blocks the paradox at two separate downstream filters (Empty Subjects and Predicates). While logically consistent, no major defense of confirmation theory requires both restrictions simultaneously; usually, one restriction suffices to block the paradox.

  ### Inseparable Leaves
  **Confirmation Relative to Background Knowledge (Leaf 2)** and **Restrict Lawlike Universal (Leaf 4)**.
  *   *Reason:* The tree forces a choice at Node 2. If a student believes *both* that background frequencies matter *and* that predicate quality matters, the tree routes them to Leaf 2 immediately. The tree cannot distinguish a "Pure Goodian" from a "Goodian-Quine Hybrid." Both leaves resolve the paradox by denying the white shoe's evidential weight, but the tree treats the reasons as mutually exclusive branching points rather than compatible layers.

  **Drop/Modify Nicod's Condition (Leaf 3)** and **Drop the Equivalence Condition (Leaf 1)**.
  *   *Reason:* While separated by Node 1 vs. Node 3 in this tree, in practice, a student's "No" at Node 3 (Empty Box) is often motivated by the same intuition as a "No" at Node 1 (Socks)—namely, that non-instances of the subject term shouldn't confirm the hypothesis. The tree attributes Node 1 failures to Equivalence and Node 3 failures to Nicod, but a student rejecting both may hold a single unified view that "Only subject-instances confirm," making the distinction between dropping Nicod vs. dropping Equivalence merely terminological for them.
