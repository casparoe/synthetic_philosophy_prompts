answer: |-
  # HANDOUT: "You Can't Define Things Into Existence"
  ### A Menu of Interpretations for the Ontological Argument Seminar

  **Context:** The slogan *"You can't define things into existence"* (UCDTIE) is the standard immune response to the Ontological Argument (OA). However, it is ambiguous. Below are five distinct theses the slogan might encode, ranked from trivial truths to substantive metaphysical claims. Use this to diagnose objections in seminar.

  ---

  ### 1. The Linguistic Stipulation Thesis
  **The Claim:** Linguistic conventions (definitions) determine meaning, not worldly facts. Therefore, no mere stipulation of meaning can force a worldly fact to obtain.
  *   **Commitment:** A distinction between *semantics* (what words mean) and *ontology* (what exists).
  *   **Damage to OA:** **None.** No serious proponent of the OA claims that *stipulating a definition* causes existence. They claim that *analyzing the content* of a specific concept reveals that instantiation is entailed by the nature of the thing conceived.
  *   **Verdict:** A straw man. Anselm and Gödel do not think they are casting a spell with words; they think they are discovering a necessary truth *about* a definition.

  ### 2. The Epistemic Limitation Thesis (The Humean Fork)
  **The Claim:** No existential proposition ("X exists") can be derived solely from a priori reasoning or conceptual analysis. Existence claims require empirical verification.
  *   **Commitment:** Empiricism about existence; rejection of rationalist metaphysics.
  *   **Damage to OA:** **High (but question-begging).** This directly blocks the OA, which is an a priori derivation of existence. However, it assumes the conclusion (that God's existence isn't necessary/a priori) to prove the argument fails. It shuts down the debate rather than engaging the logic.
  *   **Verdict:** This is likely what students *feel*, but it is a methodological veto, not a logical refutation.

  ### 3. The Instantiation Gap Thesis (Essence ≠ Existence)
  **The Claim:** For any concept $C$, the fact that $C$ has certain properties does not entail that $C$ is instantiated in reality. Essence never entails existence.
  *   **Commitment:** A substantive metaphysical thesis (Aquinas-style). It claims instantiation is always "external" to a thing's nature (except perhaps for God, but you can't assume that at the start).
  *   **Damage to OA:** **Substantive.** This attacks the core mechanism of Anselm's argument (that "that-than-which-nothing-greater-can-be-thought" must exist to be great). It asserts that "greatness" or "perfection" cannot include "instantiation" as a component.
  *   **Verdict:** A legitimate metaphysical counter-premise. It requires defense, not just sloganizing.

  ### 4. The Logical Form Thesis ("Existence is Not a Predicate")
  **The Claim:** 'Exists' is not a first-order property ($Fx$) but a second-order quantifier ($\exists x$). Therefore, it cannot be part of a definition or a "perfection."
  *   **Commitment:** Fregean/Russellian logic.
  *   **Damage to OA:** **Mixed.**
      *   *Anselm:* Damaging. If existence isn't a property, it can't be a "great-making" property.
      *   *Gödel:* Less damaging. Gödel defines God via "positive properties." If 'necessary existence' is treated as a property of properties (or a modal status), modern modal logic can accommodate it without treating 'exists' as a standard predicate.
  *   **Verdict:** This is the colleague's claim ("Existence isn't a predicate"). It is **distinct** from UCDTIE. You can accept UCDTIE (Thesis 3) while rejecting EIP (e.g., Meinongians), or accept EIP while accepting the OA (Plantinga).

  ### 5. The Modal Cost Thesis (Specific to Gödel/Plantinga)
  **The Claim:** You cannot define a thing as *possible* if its definition entails necessary existence, unless you independently prove the coherence of that definition. The "work" is done by the possibility premise, not the definition.
  *   **Commitment:** Modal epistemology. Possibility claims carry a burden of proof, especially when they entail actuality via S5 ($\diamond \Box P \rightarrow \Box P$).
  *   **Damage to OA:** **High (for Modal Versions).** In Gödel's argument, the definition of "God-like" doesn't force existence. The premise $\diamond \exists x Gx$ (It is possible that a God-like being exists) does. UCDTIE here means: *"You can't make the possibility premise true just by defining terms."*
  *   **Verdict:** This is the only reading that engages charitably with the Modal OA. The argument collapses if the definition is incoherent (impossible).

  ---

  ### Comparison: UCDTIE vs. "Existence Isn't a Predicate" (EIP)

  | Feature | **UCDTIE** (The Student Slogan) | **EIP** (The Colleague's Claim) |
  | :--- | :--- | :--- |
  | **Domain** | Metaphysics / Epistemology | Logic / Semantics |
  | **Core Idea** | Reality doesn't bend to concepts. | 'Exists' functions as a quantifier, not a property. |
  | **Target** | The *derivation* of existence. | The *grammatical form* of existence. |
  | **Relation** | You can accept EIP but deny UCDTIE (e.g., if you think logical form reveals metaphysical necessity). | You can accept UCDTIE but deny EIP (e.g., if you think existence *is* a property, but still not one definable into instantiation). |
  | **Overlap** | Both try to block the move from Concept $\rightarrow$ World. | Both try to block the move from Concept $\rightarrow$ World. |

  ---

  ### Diagnosis: What Are Your Students Actually Saying?

  When a student says "You can't define things into existence" during **Anselm**:
  *   **They mean:** *Thesis 2 (Epistemic Limitation).*
  *   **Translation:** "I don't believe we can know about the universe just by thinking hard."
  *   **Relevance:** Low. It's a methodological refusal, not an engagement with the "greater than" premise.

  When a student says it during **Gödel/Modal OA**:
  *   **They mean:** *Thesis 5 (The Modal Cost).*
  *   **Translation:** "Asserting that a Necessary Being is *possible* is just as strong as asserting it *exists*. You haven't saved us from the burden of proof."
  *   **Relevance:** **High.** This is the correct objection to Modal OAs. The definition doesn't conjure the being; the *possibility premise* does. If the student can be guided to say, "How do you know this definition describes a possible world?" rather than "You can't define things...", the seminar improves immediately.

  ### Instructor's Cheat Sheet
  *   **If they say the slogan:** Ask, "Which menu item do you mean? Are you saying definitions are linguistic (1), that we need empirical evidence (2), or that the possibility premise is unjustified (5)?"
  *   **If they conflate with EIP:** Clarify that Gödel's argument works in higher-order modal logic where 'necessary existence' is a property of properties, bypassing the standard Fregean objection.
  *   **The Golden Reply:** "Agreed. We aren't defining things into existence. We are arguing that *if* a certain concept is possible, *then* existence follows. Do you deny the possibility, or the entailment?"
