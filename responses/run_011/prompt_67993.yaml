      *   **Time:** Saturday, 5-minute address (approx. 700 words).
      *   **Subject:** A plaque cast in 1953 crediting Elias Rook (mill overseer) with saving the lower village by shutting a sluice gate during the 1846 freshet.
      *   **Conflict:** Research (10 years in archives) suggests the story is dubious. First appears in a pamphlet by Rook's son 40 years later. Contemporary newspapers (written by an editor suing the mill company) say the gate was already gone and don't mention Rook.
      *   **Audience:** Rook's descendants (4, including 2 trustees), Town Historical Society, a reporter, dozen students.
      *   **Theoretical Framework:** Must engage with historiographical debates (Ranke's *wie es eigentlich gewesen*, Carr's selection of facts, White's narrative imposition) without explicitly lecturing on them. Only one name (Ranke, Carr, or White) may appear at most. The debate must be *audible* in the speech, not announced.
      *   **Constraint 1:** Cannot use skepticism as an exit ("we'll never know, so leave it"). This alienates descendants.
      *   **Constraint 2:** Must be speakable aloud (oral style, accessible to a reporter/no training).
      *   **Constraint 3:** Must end with a decision on what to do with the plaque and why.

  2.  **Determine the Stance/Decision:**
      *   I can't say "It's false, take it down." (Hurts descendants, ignores the function of memory).
      *   I can't say "It's true, keep it." (Dishonest to my research and profession).
      *   I need a middle path that honors the *meaning* of the story while acknowledging the *complexity* of the evidence. This aligns with Carr (facts are selected) and White (narrative shapes meaning), without abandoning the search for truth (Ranke).
      *   *Decision:* Keep the plaque but add context. The story matters not because it is empirically perfect, but because it represents a community's value system. The plaque is itself a historical artifact of 1953, not just 1846.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the setting, the river, the plaque. Welcome the descendants and students.
      *   **The Hook:** The story of Elias Rook. It's a good story. Heroism against nature.
      *   **The Historian's Dilemma (Theoretical Core):** Introduce the research without jargon. Talk about the gap between the event and the telling. Mention the son's pamphlet vs. the newspapers. Acknowledge the editor's bias (the lawsuit). This touches on Carr (selection/bias) and White (narrative shape).
      *   **The Value of the Story:** Why did 1953 cast this? Why did the son write it? It's about what the community *needed* to believe. Safety, agency, heroism. This validates the descendants without validating the literal fact.
      *   **The Decision:** What do we do? We don't erase. We contextualize. The plaque is a record of 1953's view of 1846, not just 1846 itself.
      *   **Closing:** Rededication.

  4.  **Integrating Historiography (Subtly):**
      *   *Ranke:* The desire for "what actually happened." I need to show I care about this but acknowledge limits.
