      *   *Constraint:* Cannot use "we shall never know" as an exit. I must make a positive claim about the value of the story despite the uncertainty.

  5.  **Drafting - Tone and Style:**
      *   Oral rhythm. Short sentences. Pauses.
      *   Respectful to descendants.
      *   Intellectual but not pedantic.
      *   Word count check: ~700 words.

  6.  **Refining the Argument:**
      *   Instead of "Is it true?", ask "What work does this story do?"
