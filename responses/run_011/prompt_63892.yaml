prompt: |-
  I run the citizen assembly program for a city of about 190k up here in the Great Lakes region — 38 residents picked by lottery, six Saturday sessions a year, they take up maybe 12 to 15 items and the council is legally required to respond to each one publicly within 90 days. Nothing about the process is exotic, but I'm the person who signs off on what goes on the agenda and how its framed, and my four facilitators come from social work, city planning, and high school teaching. Nobody on staff has read any political theory, including me until this winter.

  Over the winter I finally slogged through Thucydides and Plato's trial dialogue, and what stuck with me wasn't the rhetoric, it was that all three famous Athenian blowups look like process failures I watch happen in my own room. Mytilene: they vote something monstrous on the strength of the day's anger, reopen it the next morning, reverse, and then literally have to race a second ship to catch the first. Sicily: the general who thinks the plan is insane tries to kill it by naming a force so enormous nobody could approve it, the assembly loves it and hands him everything, and later the letter arrives from the front and instead of bringing anybody home they double down. Socrates: the guilt vote is close, and it's the sentencing round where it goes bad, partly because of what the defendant says about himself, and there's no unringing it. And there's the fourth one, the generals after the sea battle, where they tried everybody at once against their own rules and the presiding officer who wouldn't put it to a vote turned out to be Socrates — I think that one is about procedure getting steamrolled, but you tell me.

  What I want is a procedure my facilitators can actually run, not an essay about Athens. Give me a pre-vote checklist: the questions to ask about an item, in order; what counts as a sufficient answer to each; which answers are hard stops, meaning the item does not go to a vote this session at all; and which ones route the question out of the room — to the council, to a named staff person, to a delayed second session — because it's a question of values or of who eats the cost rather than a fact the assembly can settle. Budget: 25 minutes per item the week before, one facilitator, agenda packet only, no outside reading, no greek, no citations or reading list anywhere in it — if a step comes from something the Athenians did, one clause describing it is plenty, I'm not putting a bibliography in front of a social worker. Mark plainly which steps are judgment calls wearing a procedure costume, and say what the thing can't do at all, including where the cases just don't transfer (we're 38 people making recommendations to a council, not six thousand voting on a war, and nobody gets executed for a bad forecast — probably).

  Then run the whole procedure on three live items. One: a "downtown safety initiative," cameras plus a big block of police overtime, which the assembly voted down 31 to 7 in March on cost and civil-liberties grounds; a council member wants it back on the June agenda with identical text, a new slide deck of April assault photos, and a petition with 4,000 signatures. My instinct is to call that a Mytilene and kill it, but I also know we tried a standing rule that nothing voted down can return for 12 months, and the council scrapped that rule after it blocked a genuinely improved version of a park design, so I want to know whether some narrower version survives or whether my instinct is simply wrong. Two: a riverfront plan where the only thing on the table is a $400,000 feasibility study, per the consultants, sitting in front of a 12-year, $90 million build whose phases each make the next one harder to walk away from, and nobody in the room thinks the study is controversial. Three: a resolution to censure our floodplain engineer and refer her to the state licensing board, because the model she signed said the levee system would hold a 100-year event and it didn't. It has majority support, the sponsor is close to the mayor, and the whole engineering staff has told me they resign if it passes. I expect your procedure to stop that one, and I need it strong enough that I can point at the checklist instead of at myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Program manager for a city Citizen Assembly (190k population, Great Lakes region).
      *   **Context:** 38 residents (lottery), 6 sessions/year, 12-15 items/session. Council *must* respond within 90 days.
      *   **Staff:** User + 4 facilitators (social work, planning, teaching backgrounds). No political theory background (until recently).
      *   **Inspiration:** User read Thucydides/Plato over winter. Sees parallels between Athenian disasters (Mytilene, Sicily, Socrates, Arginusae) and current process failures (anger-driven reversals, escalation, sentencing without due process, procedural steamrolling).
      *   **Goal:** A practical *pre-vote checklist* for facilitators. Not theory, not essays. Actionable steps.
      *   **Constraints:** 25 mins/item prep week before. One facilitator. Agenda packet only. No outside reading/Greek/citations. If an Athenian parallel exists, one clause description max. Must identify "judgment calls wearing a procedure costume." Must state limitations.
      *   **Task:** Create the checklist *and* apply it to three specific live items (Downtown Safety, Riverfront Study, Floodplain Engineer Censure).

  2.  **Deconstruct the Athenian Parallels (for internal logic, not output):**
      *   *Mytilene:* Hasty decision based on emotion, followed by regret/reversal. *Lesson:* Cool-off periods, checking for new info vs. same anger.
      *   *Sicily:* Escalation commitment, inability to recall, doubling down on failure. *Lesson:* Phased decisions, exit ramps, separating feasibility from commitment.
      *   *Socrates:* Sentencing phase distinct from guilt, rhetoric influencing penalty. *Lesson:* Separating finding of fact from penalty/personnel action.
      *   *Arginusae (Generals):* Collective trial against rules, procedural override by mob. *Lesson:* Adherence to due process, individual vs. collective liability, protecting the chair/process.

  3.  **Drafting the Checklist (The "Core Product"):**
      *   *Constraint Check:* Needs to be runnable by a social worker/teacher in 25 mins. No jargon.
      *   *Structure:* Sequential questions. Pass/Fail criteria. Routing options.
      *   *Tone:* Professional, direct, operational.
      *   *Content:*
          1.  **Status Check:** Has this been voted on recently? (Mytilene guardrail).
          2.  **Scope/Authority:** Is this actually the Assembly's job? (Jurisdiction).
          3.  **Information Integrity:** Is the data new or just emotional? (Sicily/Mytilene guardrail).
          4.  **Consequence/Exit:** Can we undo this? Is it phased? (Sicily guardrail).
          5.  **Target/Personnel:** Is this about a person or a policy? (Socrates/Arginusae guardrail).
      *   *Hard Stops:* Define clearly what kills an item.
      *   *Routing:* Define where it goes if it fails (Council, Staff, Delay).
      *   *Meta-Commentary:* Acknowledge where the procedure is actually human judgment.

  4.  **Applying the Checklist to the Three Items:**

      *   **Item 1: Downtown Safety (Cameras/Police Overtime)**
          *   *Context:* Voted down 31-7 in March. Council member bringing back *identical text* + emotional photos + petition.
          *   *Checklist Application:*
              *   Status: Recent vote (March -> June). Same text.
              *   Info: Photos are emotional, not new factual data on efficacy.
              *   *Verdict:* This is a Mytilene risk. High anger, same question.
              *   *Nuance:* User mentioned a 12-month rule was scrapped. Need a softer version. "Substantive Change" requirement.
              *   *Outcome:* Route to Council as "Already Adjudicated" or require text change. Don't let it burn the room's trust.

      *   **Item 2: Riverfront Plan ($400k Study -> $90M Build)**
          *   *Context:* Feasibility study only. But it locks in a path dependency (Sicily).
          *   *Checklist Application:*
              *   Scope: Is a study a recommendation? Yes.
              *   Consequence: Does this commit to the $90M? Implicitly, yes (sunk cost fallacy risk).
              *   *Verdict:* Needs an "Exit Ramp" clause. The recommendation must explicitly state that funding the study does *not* equal endorsing the build.
              *   *Outcome:* Pass with amendment (labeling the study as non-committal).

      *   **Item 3: Floodplain Engineer Censure**
          *   *Context:* Censure individual for model failure. Staff threatening mass resignation.
          *   *Checklist Application:*
              *   Target: Individual vs. System.
              *   Authority: Assembly censures policy, not employees (usually). Licensing board is external.
              *   Due Process: Did she have a chance to explain? (Arginusae/Socrates).
              *   *Verdict:* Hard Stop. This is a personnel/disciplinary action, not policy. It risks a "mob trial."
              *   *Outcome:* Kill item. Route to Council as "Request for Independent Audit" instead of censure.

  5.  **Refining the Tone and Constraints:**
      *   *No Greek:* Don't use terms like "stasis" or "demos." Use "mob rule" or "group anger."
      *   *No Bibliography:* Keep references to Athens as one-liners if needed (e.g., "The Second Ship Rule").
      *   *Judgment Calls:* Explicitly mark where the facilitator has to use discretion (e.g., defining "substantive change").
      *   *Limitations:* Acknowledge the Assembly can't stop the Council, only protect its own integrity.

  6.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is the checklist too long for 25 mins?
      *   *Fix:* Keep questions binary (Yes/No).
      *   *Critique:* Did I address the "Judgment Call" requirement?
      *   *Fix:* Add a specific section called "Where the Mask Slips."
      *   *Critique:* Is the advice on Item 1 too rigid given the 12-month rule failure?
      *   *Fix:* Focus on *textual change* rather than time. If the text is identical, it's disrespectful to the previous vote.
      *   *Critique:* Item 3 is dangerous. Make sure the "Hard Stop" is very clear so the user can hide behind it.

  7.  **Final Polish:** Ensure the voice matches the user's (pragmatic, slightly weary, intelligent, operational). Avoid academic fluff. Focus on "what do I tell my facilitators on Tuesday morning?"

  *(Self-Correction on Item 1)*: The user said their instinct is to kill it (Mytilene), but the 12-month rule failed before. I need to validate the instinct but provide a procedural mechanism that isn't a blanket ban. The mechanism is "New Evidence vs. New Emotion." Photos are emotion. Petition is pressure. Text is same. That's a fail.

  *(Self-Correction on Item 3)*: The user expects the procedure to stop this. I need to make sure the "Hard Stop" is based on *jurisdiction* and *due process*, not just "it feels bad." The Assembly recommends policy, not firing staff. That's a structural boundary.

  8.  **Final Output Structure:**
      *   Introduction (acknowledge the weight).
      *   The Pre-Vote Checklist (The 5 Gates).
      *   Routing & Hard Stops.
      *   "Where the Mask Slips" (Judgment Calls).
      *   Limitations (What this can't do).
      *   Application to the Three Items.

  9.  (Final check against constraints): 25 mins prep? Yes. One facilitator? Yes. No citations? Yes. Great Lakes context acknowledged implicitly (floodplain, etc.).

