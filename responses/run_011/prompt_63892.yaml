answer: |-
  Here is the procedure. It is designed to fit on two pages, laminated, on the facilitator's desk. It translates the Athenian failures into operational guardrails without using the names.

  ### THE PRE-VOTE GATEKEEPER CHECKLIST
  **Time limit:** 25 minutes per item. **User:** Lead Facilitator. **Material:** Agenda Packet Only.

  **1. The Recency & Change Test (The "Second Ship" Rule)**
  *   **Question:** Has the Assembly voted on this specific text or policy in the last 12 months?
  *   **If YES:** Is the text substantively different, or is it the same request with new emotional pressure (photos, petitions, headlines)?
  *   **Sufficient Answer:** "Yes, voted March. Text is identical. New material is photos of victims, not data on camera efficacy."
  *   **Hard Stop:** If the text is identical and the new information is purely emotional or political pressure, the item **does not go to vote**.
  *   **Routing:** Return to Council with note: "Assembly adjudicated this recently. No new factual basis for reconsideration."

  **2. The Path Dependency Test (The "Sicily" Rule)**
  *   **Question:** Does this recommendation lock the city into a larger, irreversible commitment without a future vote?
  *   **Sufficient Answer:** "Funding this study makes the subsequent $90M build the default path. Walking away becomes financially penalized."
  *   **Hard Stop:** None, *provided* an exit clause is added.
  *   **Routing:** If no exit clause exists, route to Staff to draft language stating: "Approval of this phase does not constitute endorsement of subsequent phases."

  **3. The Target Test (The "Generals" Rule)**
  *   **Question:** Is the recommendation targeting a specific named employee for discipline, firing, or censure?
  *   **Sufficient Answer:** "Yes, it names the Floodplain Engineer and requests license revocation."
  *   **Hard Stop:** **YES.** The Assembly sets policy and budget priorities. It does not act as a disciplinary board for civil servants.
  *   **Routing:** Kill item. Route to Council as: "Request for Independent Third-Party Audit of Flood Models."

  **4. The Authority Test (The "Jurisdiction" Rule)**
  *   **Question:** Is the Council legally allowed to do what we are recommending?
  *   **Sufficient Answer:** "Yes, Council controls the budget." OR "No, this is a State/Federal zoning issue."
  *   **Hard Stop:** If the Council lacks legal authority, the item **does not go to vote**.
  *   **Routing:** Return to Staff for clarification or kill item.

  **5. The Reversibility Test (The "Unringing" Rule)**
  *   **Question:** If we vote this and it turns out to be wrong, can the Council undo it without catastrophic cost or harm?
  *   **Sufficient Answer:** "Hiring overtime can be stopped next budget. Building a levee cannot."
  *   **Hard Stop:** If the cost of reversal is catastrophic (e.g., structural construction, permanent rights removal), the item requires a **Two-Session Deliberation**.
  *   **Routing:** Move to "Deferred" status. Requires a second session in 30 days to confirm.

  ***

  ### WHERE THE MASK SLIPS (Judgment Calls)
  *These are not objective metrics. Your facilitator must own these calls.*

  *   **Defining "Substantive Change" (Item 1):** Distinguishing between "new data" and "new anger" is subjective. A petition with 4,000 signatures is political weight, not factual data. A new crime stats report is factual data. **Judgment:** If the *argument* relies on "we must do something" rather than "this specific thing works," it is anger.
  *   **Defining "Catastrophic" (Item 5):** Who defines cost? **Judgment:** If staff warns that reversal triggers lawsuits or bond defaults, treat it as catastrophic.
  *   **The "Person vs. Policy" Line (Item 3):** Sometimes bad policy is personified. **Judgment:** If the solution requires removing a person, it is a personnel matter. If the solution requires changing a model standard, it is policy.

  ***

  ### WHAT THIS PROCEDURE CANNOT DO
  1.  **It cannot stop the Council.** The Council can ignore your "Hard Stops" and put the item on their own agenda. This procedure protects the *Assembly's* integrity, not the city's outcome.
  2.  **It cannot predict the future.** The "Path Dependency" test relies on staff honesty about costs.
  3.  **It cannot fix a broken room.** If the 38 residents are determined to riot procedurally, a checklist will not stop them. It only gives the facilitator cover to pause.

  ***

  ### APPLICATION TO LIVE ITEMS

  #### ITEM 1: Downtown Safety Initiative (Cameras/Overtime)
  *   **Gate 1 (Recency):** **FAIL.** Voted down in March (3 months ago). Text is identical. New material is assault photos (emotional) and petition (pressure). This is a classic "Second Ship" scenario—voting on the heat of the moment rather than new facts.
  *   **Gate 3 (Target):** Pass. (Policy focus).
  *   **Gate 5 (Reversibility):** Pass. (Overtime can be cut).
  *   **Verdict:** **HARD STOP.**
  *   **Action:** Do not place on June agenda. Send letter to Council Member: "Per Assembly Procedure Gate 1, items voted down require new factual evidence for reconsideration within 12 months. Photos and petitions do not constitute new factual evidence regarding efficacy or cost. Item returned until text is amended to address previous cost/liberty concerns."
  *   **Why:** Your instinct is right. The 12-month blanket ban failed because it blocked *improvement*. This rule blocks *re-litigation*. If they change the text to reduce cost or add privacy oversight, it passes Gate 1. If it's the same text, it's an insult to the March vote.

  #### ITEM 2: Riverfront Feasibility Study ($400k -> $90M)
  *   **Gate 1 (Recency):** Pass. (New item).
  *   **Gate 2 (Path Dependency):** **WARNING.** Staff admits phases make walking away harder. This is the "Sicily" trap—approving the scout ship commits you to the fleet.
  *   **Gate 5 (Reversibility):** **WARNING.** Once the study is done, the political cost of *not* building is high.
  *   **Verdict:** **PASS WITH AMENDMENT.**
  *   **Action:** Facilitator must require a preamble to the recommendation: "The Assembly recommends the study to inform decision-making. This recommendation does not constitute a commitment to the subsequent $90M capital plan, and future phases require separate Assembly review."
  *   **Why:** You can let them vote on the study, but you must sever the psychological link to the $90M. If staff refuses to add that disclaimer, it becomes a Hard Stop at Gate 2.

  #### ITEM 3: Censure Floodplain Engineer
  *   **Gate 1 (Recency):** Pass.
  *   **Gate 3 (Target):** **HARD STOP.** This targets a named civil servant for discipline/license revocation.
  *   **Gate 4 (Authority):** **WARNING.** Assembly does not hire/fire. State board handles licenses.
  *   **Verdict:** **KILL ITEM.**
  *   **Action:** "Per Assembly Procedure Gate 3, the Assembly does not vote on personnel discipline or licensure. This is a quasi-judicial matter outside our policy scope. Item rejected."
  *   **Alternative Routing:** Offer the sponsor a substitute motion: "Request an independent audit of the flood models used by the Engineering Department."
  *   **Why:** This is the Arginusae trial. If you let this vote happen, you turn 38 neighbors into a mob trying a professional without due process. If the engineers resign, the city breaks. You need the checklist to be the bad guy, not you. Point to Gate 3. It is not your decision; it is the procedure's decision.

  ### FINAL NOTE TO STAFF
  When you apply Gate 3 to the Engineer item, the sponsor (close to the Mayor) will call you. Tell them: *"The Assembly is not a court. If we vote on firing people, we become a lynch mob. If you want the model checked, we will audit the model. We will not audit the person."*

  If they push back, remind them: *Thucydides wrote about what happens when assemblies try generals after a storm. The city loses the engineers, and then the next flood takes the houses. Protect the process, not the person.* (Keep the Greek reference to yourself, just use the logic).
