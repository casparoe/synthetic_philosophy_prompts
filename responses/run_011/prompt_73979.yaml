answer: |-
  This is a pivotal text for understanding the shift from philological classification to anthropological linguistics. Because your scan is damaged, I will first reconstruct the missing antecedent based on the standard 1911 text and internal logic, then address your four questions and the final query regarding the language-and-thought thesis.

  ### The Missing Antecedent
  In the standard edition of Bulletin 40, the sentence immediately preceding your snippet reads: *"The phonetics of the American languages is fairly well known, but…"*
  Therefore, **"the latter" refers to "the grammar"** (or "the grammatical structure").

  *   **Former:** Phonetics (sounds).
  *   **Latter:** Grammar (structure/organization).

  Boas is arguing that while we know how these languages *sound*, we do not understand how they *work*, because scholars have forced them into Latin/Greek grammatical molds.

  ---

  ### 1. "Psychological Principle" vs. "Grammatical Category"

  **The Distinction:**
  For Boas, a **grammatical category** (e.g., "past tense," "accusative case") is a label, often borrowed from European tradition, used to classify a form. A **psychological principle** is the underlying cognitive compulsion or habit that dictates *why* a speaker must express a certain distinction.

  *   **Example:** In English, a speaker *must* indicate time (tense). In some American Indian languages, a speaker *must* indicate the source of information (evidentiality: "I saw it" vs. "I heard it").
      *   *Category:* Tense vs. Evidentiality.
      *   *Principle:* The cognitive requirement to categorize experience temporally vs. epistemologically.

  **Why it is the Object:**
  Boas states the object is to describe these principles because he views linguistics as a branch of **anthropology**, not just philology.
  *   **Reading A (Strong):** The grammar *is* the psychology. To describe the language accurately *is* to describe the mental habits of the speakers. There is no separation.
  *   **Reading B (Weak):** The grammar *reveals* the psychology. The grammar is the evidence; the psychology is the conclusion.

  **Ambiguity Flag:** The phrase *"psychological principles of each language"* is a reification. Languages do not have psyches; speakers do.
  *   **Reading 1:** Boas is speaking metaphorically. He means the principles that govern the *structure* of the language, which presumably reflect the speakers' minds.
  *   **Reading 2:** Boas implies the language itself possesses a "genius" or internal logic independent of individual speakers (a Herderian/Humboldtian view).
  *   **Implication:** If Reading 1 holds, the "object" is to understand the people. If Reading 2 holds, the "object" is to understand the system. Boas likely intends Reading 1, but his wording allows Reading 2, which later enabled Sapir and Whorf to treat language as an autonomous force shaping thought.

  ### 2. European Grammars: Vocabulary vs. Assumption

  **The Fault:**
  Boas condemns the *"attempts to represent the grammars… in a form analogous to that of the European grammars."*
  The fault lies primarily in the **prior assumption** that the corresponding distinctions are there to be found, which then necessitates the borrowed **vocabulary**.

  *   **Assumption:** "All languages distinguish Noun vs. Verb" or "All languages mark Tense."
  *   **Vocabulary:** Using labels like "Noun," "Verb," "Tense."

  **Separability:**
  They are theoretically separable but practically linked. You could use the word "Tense" to describe a phenomenon that isn't actually tense (vocabulary error), but Boas argues this happens *because* you assumed tense must exist (assumption error).

  **The Test:**
  Boas implies a test of **obligatory expression**.
  *   **Procedure:** Do not ask "Where is the past tense?" Ask "What *must* the speaker express in this context?"
  *   **Failure Condition:** If the description requires convoluted explanations to fit a European category (e.g., "This is a 'subjunctive' but it's only used when the sun is setting"), the assumption is wrong.
  *   **Success Condition:** If the analysis isolates what the speaker is *compelled* to indicate (e.g., "The speaker must indicate whether the subject is animate or inanimate"), you have found a psychological principle, regardless of whether European vocabulary exists for it.

  ### 3. The Epistemic Constraint (Postponing Discussion)

  **The Constraint:**
  Boas claims general points *"can not be substantiated by reliable evidence"* without detailed discussion of various languages. This is an **inductivist** constraint.

  *   **Claim:** You cannot theorize about the "psychological characteristics of American languages" (plural/general) before analyzing the specific languages (singular/particular).
  *   **Specific Error:** He is attacking **a priori comparison**. This is the practice of taking a European category (e.g., "Passive Voice") and searching for it across languages to prove its universality.
  *   **Boas's Counter:** You must first describe each language on its own terms. Only *after* you have the individual descriptions can you compare them to find true psychological commonalities or differences.

  **Ambiguity Flag:** *"Reliable evidence."*
  *   **Reading 1 (Empiricist):** Generalizations are weak without a large sample size of data.
  *   **Reading 2 (Methodological):** Generalizations are *distorted* if the data was collected using a biased framework (the European grammar). The evidence isn't just insufficient; it's contaminated. Boas likely means Reading 2. The "evidence" is unreliable because the *method of collection* imposed foreign categories.

  ### 4. The "Common Plan" Contradiction

  **The Apparent Contradiction:**
  If Boas condemns imposing a "form analogous to... European grammars," how can he require collaborators to adopt a *"general plan of presentation of grammar outlined by the editor"*?

  **The Distinction Required for Consistency:**
  Consistency holds only if the "plan of presentation" is a **heuristic framework**, not a **theoretical straitjacket**.

  *   **Procrustean Bed (Condemned):** "Every grammar must have a section on Case, Tense, and Gender." (Forces data to fit categories).
  *   **Heuristic Framework (Allowed):** "Every grammar must have sections on Phonetics, Morphology, and Syntax, in that order." (Organizes data without prescribing categories).

  **Does it Hold?**
  *   **Yes:** If the plan dictates the *order* of analysis but allows the *content* to be negative (e.g., "This language has no tense category").
  *   **No:** If the plan requires contributors to find equivalents for European terms to fill the template.

  **Ambiguity Flag:** *"Plan of presentation."*
  *   **Reading 1:** A table of contents (Phonetics -> Texts -> Grammar). This is consistent with Boas's critique.
  *   **Reading 2:** A standardized set of grammatical headings (e.g., "Pronouns," "Verbs"). This contradicts his critique, as many American Indian languages do not distinguish Pronouns from Verbs in the European sense.
  *   **Historical Note:** Boas's actual handbook used a flexible structure. He allowed contributors to note where European categories failed. Thus, Reading 1 is the charitable and historically accurate interpretation, but the wording *"presentation of grammar"* leaves open the possibility of Reading 2.

  ### Final Query: Language-and-Thought (The Sapir-Whorf Hypothesis)

  **Is there a claim about the minds of speakers?**
  Yes, but it is **reflective**, not necessarily **determinative**.
  *   **Text:** *"...psychological principles of each language…"*
  *   **Claim:** The structure of the language reveals the psychological habits of the speakers. The linguist can access the speaker's psychology by analyzing the grammar.

  **What is missing for a "Language Shapes Thought" thesis?**
  To move from Boas's methodological statement to the Sapir-Whorf hypothesis (linguistic relativity/determinism), you must add three premises not explicitly found in this passage:

  1.  **Compulsion:** The grammatical principles are not just habits of speech, but habits of *thought* that operate even when not speaking. (Boas says "principles of each language," not "principles of each mind.")
  2.  **Inescapability:** The speaker cannot easily think outside these grammatical categories. (Boas implies the linguist must isolate them, not that the speaker is trapped by them.)
  3.  **Cognitive Consequence:** These linguistic differences result in different worldviews or behaviors outside of language. (Boas focuses on "analysis of grammatical forms," not non-linguistic behavior.)

  **Ambiguity Flag:** *"Psychological principles of each language."*
  *   **Reading 1 (Descriptive):** The language is structured in a way that *reflects* the culture's psychological focus. (Boas's likely meaning: Language is a cultural artifact).
  *   **Reading 2 (Determinative):** The language imposes psychological principles *upon* the speaker. (Whorf's later meaning: Language is a cognitive cage).

  **Conclusion for your Seminar:**
  This passage is the **methodological foundation** for the language-and-thought debate, but it is not the **thesis** itself. Boas establishes that grammar is psychological and culturally specific (breaking the universalist European model). Sapir and Whorf later took Boas's "psychological principles" and argued they *determine* cognition, whereas Boas here seems to argue they *reveal* it. The shift from "grammar reveals mind" to "grammar shapes mind" happens in the gap between Boas's "analysis of grammatical forms" and Whorf's "habitual thought."
