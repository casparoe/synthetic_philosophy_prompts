prompt: |-
  Two weeks from now I'm giving a talk at another department's metaphysics seminar — visiting, mid-sized group, mostly people who work on causation but from pretty different directions. I don't want a defense of my view. I want a Q&A prep sheet.

  The thesis: I'm an eliminativist about omissive causation, but not the standard kind. When we say the gardener's failure to water the plant caused it to die, there's no absence in the world doing any causing. What's true is that an actual, occurrent process — water loss, wilting, cell collapse — ran to completion because a preventive mechanism that was *poised* never fired. And "poised" is meant to be a natural property, not a normative or pragmatic one: roughly, the mechanism was assembled, energized, and one small trigger away from intervening at the relevant time. Hose attached, tap already on, he's standing in the yard = poised. Me, on another continent, failing to water your plant = not poised, so my omission is no cause of anything, even though something like the counterfactual comes out true once you fill in the plane ticket. Bottle of water in the passerby's pocket = borderline, and I'm willing to bite that. So the view promises to kill negative facts entirely, to explain why omission talk is so selective without appealing to norms or speaker interest, and to still get a real difference between the gardner and me. I know the familiar dilemma is in the room's head already — McGrath's version, either there's no causation by omission or there's vastly more of it than common sense accepts — and poisedness is supposed to be my exit from the second horn, so expect them to test whether it actually gets me out.

  The room. The host is a counterfactual theorist who is completely unbothered by absences; she thinks the whole problem is manufactured and there's nothing metaphysically special about positive causation. Two people work in the causal-models tradition: one thinks variable choice and the relativity of causal claims dissolve these puzzles, the other is more formal, works with default-valued models, and will want to know why I don't just take defaults as primitive. There's a process/conserved-quantity theorist who is also an eliminativist about omissions and will read my account as a surrender dressed up as a solution. A philosopher of action cares about the doing/allowing distinction and will want to know what's left of it if omissions are never causes. Someone from the experimental side of causal selection — norms, blame, that literature — will be there. A visitor from the law school works on factual causation in tort, especially liability for negligent omissions. Plus a couple of grad students, one of whom will just keep asking what the truthmakers are.

  Give me the eight-ish objections I'll actually get, ordered by how much damage they'd do, each phrased the way that person would phrase it — the process theorist and the tort lawyer are not going to use the same words — with a reply I can deliver in about two minutes, what I should concede up front so I don't look like I'm digging in, and a note on where the reply is soft. Flag any objection on which the honest answer is that my view is just contextualism with extra steps. Then tell me the one reply that has to land, the thing that if I fumble it the whole talk is a loss. And end with the question I'm hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the Request:**
      *   **Task:** Create a Q&A prep sheet for a metaphysics seminar talk.
      *   **Topic:** Eliminativism about omissive causation via a "poised mechanism" account.
      *   **Thesis:** Omissions don't cause. Instead, positive processes run to completion because a *poised* preventive mechanism didn't fire. "Poised" = assembled, energized, one trigger away (natural property, not normative).
      *   **Goal:** Avoid the "too many causes" horn of McGrath's dilemma (e.g., me not watering a plant on another continent isn't a cause).
      *   **Audience:** Mixed bag (Counterfactual theorist/host, Causal Models x2, Process/Conserved Quantity theorist, Action theorist, Experimentalist/Norms, Tort Lawyer, Grad students).
      *   **Format:** ~8 objections, ordered by damage potential, phrased in the speaker's voice, 2-minute reply, concessions, soft spots, flag contextualism risks, identify the "must-land" reply, and the "hope nobody asks" question.

  2.  **Deconstruct the View:**
      *   *Core Claim:* No negative facts/absences as causes.
      *   *Mechanism:* Positive process (dying) + Unfired Poised Preventer.
      *   *Criterion for "Poised":* Assembled, energized, proximate trigger. (Hose on + gardener present = Poised. Me in another continent = Not Poised).
      *   *Motivation:* Solve the proliferation problem (McGrath) without norms/pragmatics.
      *   *Vulnerability:* Is "poised" really non-normative? Is it just a fancy way of picking out relevant counterfactuals? Does it actually solve the process theorist's worry?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1: The Process Theorist (The "Surrender" Charge).* This is the biggest metaphysical threat. If I admit positive processes do the work, why call it a theory of *omission*? If I say the *lack* of firing is the cause, I'm back to absences. If I say the *process* is the cause, why did the plant die *because* the gardener didn't water?
          *   *Phrasing:* "You haven't solved the metaphysical problem; you've just renamed the positive cause."
          *   *Reply:* Distinguish cause of *death* (process) from cause of *dying vs. surviving* (poised mechanism status).
          *   *Risk:* High damage.

      *   *Objection 2: The Causal Models/Default Theorist.* They love defaults. Why is "poised" better than "default value"?
          *   *Phrasing:* "Your 'poised' looks exactly like a default value in a structural equation model. Why is your ontology lighter?"
          *   *Reply:* Defaults are often normative/statistical. Poised is physical/energetic.
          *   *Risk:* Medium-High.

      *   *Objection 3: The Counterfactual Host.* She thinks absences are fine. Why bother?
          *   *Phrasing:* "Why eliminate absences if your account relies on the counterfactual dependence of the outcome on the non-firing?"
          *   *Reply:* Truthmaker issue. Counterfactuals need grounding. Poised mechanisms ground the asymmetry.
          *   *Risk:* Medium (Host controls the room, but she's "unbothered").

      *   *Objection 4: The Tort Lawyer.* Liability hinges on duty. "Poised" ignores duty.
          *   *Phrasing:* "In tort, the passerby *is* liable if they had the water. Your 'borderline' case is a legal nightmare."
          *   *Reply:* Metaphysics vs. Normative Law. I explain the *causal* structure; law adds the *duty*.
          *   *Risk:* High practical damage (makes view look irrelevant).

      *   *Objection 5: The Action Theorist.* Doing vs. Allowing.
          *   *Phrasing:* "If omissions aren't causes, how do you distinguish murder by starvation from letting starve?"
          *   *Reply:* Both involve positive processes. Distinction is moral/legal, not causal metaphysics.
          *   *Risk:* Medium.

      *   *Objection 6: The Experimentalist/Norms.* "Poised" is secretly normative.
          *   *Phrasing:* "You say 'poised' is natural. But 'assembled and energized' depends on what we expect the mechanism to be for."
          *   *Reply:* No, a mousetrap is poised even if no mice are expected. It's about physical state.
          *   *Risk:* High (undermines the core innovation).

      *   *Objection 7: The Grad Student (Truthmakers).*
          *   *Phrasing:* "What is the truthmaker for 'the mechanism was poised'?"
          *   *Reply:* The physical arrangement of particles/energy.
          *   *Risk:* Low (easy to answer, but can get bogged down).

      *   *Objection 8: The "Too Many Causes" Redux (McGrath).*
          *   *Phrasing:* "Doesn't every particle in the gardener's body count as part of the poised mechanism?"
          *   *Reply:* Mechanism boundaries are functional, but physical realization is strict.
          *   *Risk:* Medium.

      *   *Selection & Ordering:* I need to order by *damage*.
          1.  Process Theorist (Ontological surrender).
          2.  Experimentalist/Norms (The "Poised is Normative" charge - kills the novelty).
          3.  Tort Lawyer (Practical applicability/Liability).
          4.  Causal Models (Defaults are simpler).
          5.  Counterfactual Host (Why bother?).
          6.  Action Theorist (Moral distinction).
          7.  Grad Student (Truthmakers).
          8.  Borderline Cases (The passerby).

      *   *Refining the "Contextualism" Flag:* The Experimentalist and Causal Models objections both risk exposing the view as contextualism in disguise. I need to flag the Experimentalist one specifically.

      *   *The "Must Land" Reply:* It has to be the response to the Process Theorist. If I can't explain why this isn't just standard process theory, the view collapses.
      *   *The "Hope Nobody Asks":* Something that exposes the "Poised" definition as circular or vague. E.g., "What counts as a mechanism?"

  4.  **Drafting the Content (incorporating specific voices):**

      *   *Process Theorist:* Needs to sound gruff, focused on conserved quantities. "You're just describing the positive cause."
      *   *Tort Lawyer:* Practical, liability-focused. "Duty of care."
      *   *Causal Models:* Formal, "variables," "defaults."
      *   *Host:* Relaxed, counterfactual-focused. "Why eliminate?"
      *   *Experimentalist:* "Folk intuitions," "Normative expectations."

  5.  **Review against Constraints:**
      *   8 objections? Yes.
      *   Ordered by damage? Yes.
      *   Phrased in voice? Yes.
      *   2-minute reply? (Keep text concise).
      *   Concessions? Yes.
      *   Soft spots? Yes.
      *   Contextualism flag? Yes.
      *   Must-land reply? Yes.
      *   Hope nobody asks? Yes.

  6.  **Final Polish:** Ensure the tone is supportive but rigorous (like a senior colleague prepping a junior). Make sure the "Poised" definition is stressed in the replies. (Self-Correction: Make sure the Tort Lawyer objection doesn't sound like a category error, but rather a challenge to the *utility* of the metaphysics).

      *   *Refining Objection 2 (Experimentalist):* This is actually the most dangerous metaphysically because if "poised" is normative, the view loses its main selling point (naturalizing omission). I might swap Process Theorist and Experimentalist for damage ranking. The Process Theorist will hate it regardless, but the Experimentalist can *prove* it's wrong. Let's keep Process Theorist #1 because they are an ally who feels betrayed, which is rhetorically powerful in a seminar. Actually, the Prompt says "Process theorist... will read my account as a surrender." That's a credibility killer. I'll keep them #1. The Experimentalist is #2 because if "poised" is normative, the view is just standard pragmatic contextualism.

      *   *Refining the "Must Land":* It must be the definition of "Poised." If that wobbles, everything falls. But the prompt asks for the *reply* that has to land. That's the response to the Process Theorist (explaining the explanatory gap).

      *   *Refining the "Hope Nobody Asks":* Needs to be the "What is a mechanism?" regress question.

  7.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is your Q&A prep sheet. I've ordered these by the threat they pose to the coherence and novelty of the view. The Process Theorist and the Experimentalist are your biggest risks; the Host and Grad Student are manageable.

  ### 1. The Process Theorist (The "Surrender" Charge)
  **Voice:** Gruff, impatient, focused on energy transfer.
  **Objection:** "You say you're an eliminativist, but your account says the plant died because a physical process (wilting) ran to completion. That's just standard process theory. You've added this 'poised mechanism' label, but if the non-firing isn't doing causal work, you haven't explained *omissive* causation. You've just explained positive causation and told us to stop talking about omissions. That's not a solution; it's a dissolution."
  **Reply:** "I concede I'm dissolving the *metaphysics* of negative causes, but not the *explanatory* role of omissions. Standard process theory tells us why the plant died (water loss). It doesn't tell us why it died *now* rather than *later*, or why we blame the gardener rather than the sun. The 'poised mechanism' captures the specific fragility of the situation. The cause of death is the process; the cause of the *causal claim's truth* is the status of the preventer. I'm not explaining how absences cause; I'm explaining why we think they do without positing them."
  **Concede:** Up front, admit you are eliminating omissions from the *ontology* of causation.
  **Soft Spot:** If they press that the "status of the preventer" is just a negative fact by another name, you're in trouble.
  **Damage:** High. If this sticks, you're just a process theorist with extra vocabulary.

  ### 2. The Experimentalist (The "Normativity" Charge)
  **Voice:** Empirical, focused on folk intuitions and cognitive science.
  **Objection:** "You insist 'poised' is a natural property—assembled, energized, proximate. But our data shows causal selection tracks normative expectations, not physical readiness. A firefighter standing idle is 'poised' physically, but we only call their omission a cause if they were *on duty.' If you strip out the norm, you lose the selectivity you promised. Isn't 'poised' just a normative expectation dressed in physical clothing?"
  **Reply:** "I distinguish the *causal structure* from the *blame assignment*. The firefighter is physically poised regardless of duty. That's why we feel a specific tension when they fail: the physical capacity was there, even if the moral obligation wasn't. My view explains why we feel the omission is 'heavier' when the mechanism is poised. Norms determine liability; poisedness determines causal candidacy."
  **Concede:** Acknowledge that norms often *track* poisedness, but insist they don't *constitute* it.
  **Soft Spot:** **FLAG: CONTEXTUALISM RISK.** If you can't give a non-normative example of 'poised' that diverges from 'expected,' this reply collapses into pragmatic contextualism.
  **Damage:** High. This undermines your claim to naturalism.

  ### 3. The Tort Lawyer (The "Liability" Charge)
  **Voice:** Practical, precedent-focused, impatient with metaphysics.
  **Objection:** "In tort, we hold the passerby liable if they could have easily saved the child. You call the passerby with the water bottle 'borderline.' If your metaphysics can't draw a sharp line between the gardener (liable) and the passerby (maybe liable), it's useless for factual causation. The law needs a binary: cause or not cause. Your 'poised' spectrum creates uncertainty."
  **Reply:** "The law often deals in spectra (e.g., reasonable foreseeability). My view matches the legal intuition that capacity matters. The passerby is a harder case *because* their mechanism is less integrated into the situation. I'm not offering a legal test; I'm offering the metaphysical grounding for why the law treats integrated agents differently from bystanders."
  **Concede:** Admit your view doesn't solve the legal policy question of *duty*.
  **Soft Spot:** If they argue factual causation *must* be binary for verdicts, your 'borderline' looks like a bug, not a feature.
  **Damage:** Medium-High. Makes the view look practically inert.

  ### 4. The Causal Models Theorist (Defaults)
  **Voice:** Formal, variable-focused.
  **Objection:** "In structural equation models, we handle this with default values. The gardener variable defaults to 'water.' The passerby defaults to 'no water.' Why posit 'poised mechanisms' when 'default settings' in a model do the same work without the metaphysical baggage of 'energized assemblies'?"
  **Reply:** "Defaults are often assigned based on statistics or norms. 'Poised' is meant to be mind-independent. A machine can be poised even if it usually fails. My account grounds *why* we set the default to 'water' in the first place—because the mechanism is physically ready. I'm offering the truthmaker for the model's structure."
  **Concede:** Agree that the formal output is similar.
  **Soft Spot:** If defaults can be purely physical (e.g., inertia), your view adds no value over standard causal modeling.
  **Damage:** Medium.

  ### 5. The Counterfactual Host (The "Why Bother?" Charge)
  **Voice:** Relaxed, pluralist, unbothered by absences.
  **Objection:** "I'm happy to say absences cause things. The counterfactual holds: if he had watered, it wouldn't have died. What do you gain by this elaborate 'poised mechanism' machinery? You still rely on the counterfactual dependence of the outcome on the non-firing. You haven't avoided counterfactuals; you've just complicated the relata."
  **Reply:** "You gain an account of *asymmetry*. Counterfactuals alone give me as much cause as you do (my not watering from abroad). My machinery explains why the gardener's non-firing matters and mine doesn't, without appealing to speaker interest. It grounds the counterfactual in physical reality."
  **Concede:** Admit you accept the counterfactuals are true, just not that they reveal the *nature* of the cause.
  **Soft Spot:** If the counterfactual dependence between 'poised' and 'outcome' is just as widespread as standard omissions, you haven't solved the proliferation problem.
  **Damage:** Medium.

  ### 6. The Action Theorist (Doing vs. Allowing)
  **Voice:** Focused on agency and moral responsibility.
  **Objection:** "If omissions are never causes, how do you distinguish killing (doing) from letting die (allowing)? Both involve a positive process running to completion. If the metaphysics is the same, the moral distinction loses its footing."
  **Reply:** "I agree the *causal* metaphysics is the same. The distinction is moral, not causal. 'Killing' involves initiating a process; 'allowing' involves failing to interrupt one. My view clarifies this: in both cases, a positive process causes death. The difference is whether the agent was the source of the process or merely a poised preventer."
  **Concede:** Grant that the causal story is identical in both cases.
  **Soft Spot:** Many action theorists think the causal difference *grounds* the moral one.
  **Damage:** Low-Medium.

  ### 7. The Grad Student (Truthmakers)
  **Voice:** Anxious, precise, looking for grounding.
  **Objection:** "You say 'poised' is a natural property. What is the truthmaker for 'the mechanism was poised'? Is it the arrangement of particles? If so, isn't that just a positive fact? And if it's a positive fact, why call this eliminativism about omissions?"
  **Reply:** "Yes, the truthmaker is a positive fact—the arrangement and energy state of the gardener and hose. I'm an eliminativist about *negative* facts. I'm saying the truthmaker for 'he didn't water' is a positive state of readiness. That's the elimination: no absences in the world."
  **Concede:** None. This is your home turf.
  **Soft Spot:** If they ask what makes it a *mechanism* rather than a heap, you risk regress.
  **Damage:** Low.

  ### 8. The Second Causal Models Theorist (Variable Choice)
  **Voice:** Analytic, focused on granularity.
  **Objection:** "You say the passerby is borderline. But if I include 'Passerby Water' as a variable in my model, the causation is clear. Isn't your 'poisedness' just a constraint on which variables we're allowed to include? That sounds like pragmatic variable selection."
  **Reply:** "It's a constraint on which variables *map onto reality*. You can include any variable you like, but only 'poised' variables correspond to physical systems capable of intervention. I'm restricting the ontology, not the pragmatics."
  **Concede:** Admit that modelers can include whatever they want.
  **Soft Spot:** **FLAG: CONTEXTUALISM RISK.** If the criterion for 'mapping onto reality' is vague, this is just variable selection with extra steps.
  **Damage:** Low.

  ***

  ### The One Reply That Has to Land
  **Target:** Objection #1 (The Process Theorist).
  **Why:** If you cannot convince the Process Theorist that you are offering something distinct from standard process theory, you lose the "Eliminativist" label. If you aren't an eliminativist, you're just a standard causal pluralist, and the talk loses its bite.
  **Key Phrase to Hit:** "I am not analyzing the cause of the *effect* (death); I am analyzing the cause of the *causal claim's truth* (why we cite the gardener)."
  **Risk:** If they reply "Causal claims are true because of causes, not vice versa," you need to pivot quickly to: "The causal claim picks out the *difference-maker*. The process is the producer; the poised mechanism is the difference-maker."

  ### The Question You Hope Nobody Asks
  **"What counts as a mechanism?"**
  **Why:** You define "poised" in terms of mechanisms (assembled, energized). But "mechanism" is a notoriously loaded term in metaphysics of science. If a pile of hose parts is a "mechanism" waiting to be assembled, is it poised? If a sleeping gardener is "de-energized," are they unpoised? If you have to give a functionalist account of mechanism, you invite norms back in (functions are often normative). If you give a physicalist account, you risk making almost everything "poised" (entropy, chemical potentials). This question threatens to expose "poised" as either too vague or secretly normative.
  **Prep:** Have a ready example of a clear non-mechanism (e.g., a random rock) vs. a clear mechanism (a clockwork device) and stick to the "integrated system" line. Don't wander into philosophy of biology.
