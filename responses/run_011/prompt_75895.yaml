answer: |-
  1. **The Vote and the Distinction**
  I am voting no on this recommendation. My colleagues argue that housing supply is a paramount good and that removing barriers to construction is the only moral way to achieve it. I agree that housing is essential. I disagree that the method proposed here—permitting fourplexes by right on every residential parcel within a half-mile of transit—is the right tool for this city. My dissent rests on a distinction between a preference and a stake.

  A preference is a desire for a state of affairs. I prefer quiet streets; I prefer tree canopy; I prefer low density. If the city changes these things, I am disappointed. A stake is different. A stake is an investment of life that depends on the surroundings remaining roughly stable to retain its value. It is not merely what I want; it is what I have built that will break if the context shifts too quickly. When I buy a home, I buy a structure, but I also buy into a network. I rely on the corner store that needs a certain density to survive. I rely on the neighbors who watch my children because we have lived here long enough to trust one another. I rely on the walking route my elderly father uses because it is safe and familiar. These are not preferences I can simply swap out. They are equilibrium goods. They exist only as stable patterns. If the built form changes too fast, these patterns dissolve. They cannot be compensated with money, and they cannot be restored by building new units elsewhere. They are simply gone.

  2. **The Nature of Equilibrium Goods**
  Zoning is often described as a way to keep incompatible uses apart, like keeping a factory away from a school. But its deeper function is to hold patterns still long enough for human relationships to form within them. Community is not instantaneous. It is a slow accumulation of trust and routine that requires a stable physical stage. When we allow by-right development that radically alters the scale of a street overnight, we are not just changing building heights; we are liquidating the social capital built on that block.

  Consider the small business owner who opened a shop because the neighborhood density supported a specific clientele. Consider the group of residents who share tools, rides, and care because the low turnover of a stable neighborhood made that investment of time worthwhile. These are fragile ecosystems. They depend on predictability. If a parcel can be redeveloped at any moment without review, the predictability vanishes. The stake holders are not just protecting their view or their privacy; they are protecting the viability of the life they have constructed around the existing built form. To destroy a stake is a different kind of wrong than disappointing a preference. A disappointed preference is a frustration; a destroyed stake is a loss of something that cannot be easily rebuilt. A city has a legitimate interest in protecting stakes, even when it means slowing down the satisfaction of aggregate preferences for more housing.

  3. **The Specific Proposal**
  This proposal removes the discretionary permit. It says that no matter the specific context of a street, no matter the existing social fabric, a fourplex can be built as of right. This assumes that there are no stakes worth weighing on a case-by-case basis. It assumes that every parcel is interchangeable and that the surrounding context is irrelevant. My argument is that context is everything. A fourplex on a block with wide streets and deep lots is different from a fourplex on a narrow street with existing infrastructure strain. But more importantly, the social context varies. Some streets have deep networks of care; others are transient. By removing discretion, we blindfold the city to these differences. We treat the dissolution of a stable community network as having zero cost. I am not arguing that fourplexes should never be built. I am arguing that the people whose stakes are on the line deserve a process where those stakes can be identified and weighed before the change is mandated. Voting yes here says that no such stakes exist. I believe they do.

  4. **Objection One: Exclusion in Costume**
  The first objection is that this argument is exclusionary politics in philosophical costume. Critics will say that every claimed stake is actually a preference about who one's neighbors will be, disguised as concern for "community fabric." They argue that protecting equilibrium goods is just a way to keep out lower-income residents who would occupy the new units.

  This objection forces a concession. I cannot claim that every appeal to stability is innocent. Much of our zoning history is indeed rooted in a desire to exclude. However, the distinction between preference and stake still does work, provided we are rigorous. A preference says, "I don't want those people here." A stake says, "I rely on this specific pattern of life." The test must be whether the claimant can identify a specific reliance that would be broken, not just a generalized desire for sameness. If a resident argues against a project because it will change the "character" without specifying what social function that character serves, that is a preference. If they can point to a specific network or resource that depends on the current density, that is a stake. We must not allow the existence of fake stakes to invalidate real ones. The remedy is scrutiny, not the abandonment of the concept. We must demand proof of reliance, but where reliance is proven, it must count.

  5. **Objection Two: The Cost of Inaction**
  The second objection is that equilibrium goods are destroyed by inaction too. We face a severe housing shortage. Rising rents dissolve neighborhoods just as surely as new construction does. Long-term residents are displaced because they cannot afford to stay. The corner grocer closes because the workforce can no longer live nearby. By protecting the stakes of current residents, we may be accelerating the destruction of the stakes of potential residents who need homes. An account that protects existing patterns against construction protects them selectively, favoring those who are already inside the door.

  This objection forces the hardest concession. I must admit that housing security is itself a stake. A person's need for shelter is a reliance interest of the highest order. Therefore, my argument cannot be a veto for incumbents. It cannot be that existing stakes always trump potential stakes. It must be that existing stakes deserve a hearing. The "by right" provision assumes the balance always tips toward construction. I argue the balance must be weighed. In some cases, the housing need will outweigh the local stability. In others, the destruction of a vital community network may be too high a price for four additional units. We cannot know this without a process that allows both sides to present their stakes. To vote yes is to decide in advance that the stakes of the housed always outweigh the stakes of the unhoused, or vice versa, without looking at the specific facts. We need a process that recognizes that stability harms some and change harms others, and seeks a balance rather than a blanket rule.

  6. **Objection Three: The Legacy of Injustice**
  The third objection is that the set of people with stakes was produced by injustice. Who owns on these streets now is a consequence of redlining, racially restrictive covenants, and decades of policy that directed who could buy where. Giving decisive weight to the stakes of current incumbents converts that history into a present entitlement. It rewards those who benefited from past exclusion.

  This objection limits the weight of the claim. I concede that stakes acquired through unjust means carry less moral weight than stakes acquired through just means. If a neighborhood's stability was purchased by keeping others out, the city is less obligated to protect that stability now. However, not all stability is unjust. Some neighborhoods are stable because of the care of residents who have lived there for generations, including communities of color who survived despite the city's efforts. To say that no current stakes are valid because of past injustice is to punish current residents for the sins of the past, and to ignore the real social value that exists there now. The remedy is not to ignore all stakes, but to weigh them against the need for repair. We must ask: Is this stability a fortress built on exclusion, or is it a home built on care? Only a discretionary process can tell the difference. A blanket rule cannot.

  7. **Objection Four: Who Counts**
  The fourth objection is that this account cannot say who counts. Forty-year residents, ten-year residents, renters, owners, landlords—the stake view appears to have no principled way to draw the line. If stakes are about reliance, does a landlord three towns over have a stake? Does a renter who has lived there for two years? If we cannot define the stakeholder, the rule is arbitrary.

  I answer this by anchoring the stake in physical presence and reliance, not title. A stake is about how your life is woven into the street. An absentee landlord has a financial interest, but not a stake in the social equilibrium. They do not walk the route; they do not know the neighbors. A renter who has lived there for two years may have a stake if they have built reliance—children in local schools, care networks with neighbors. A homeowner of forty years likely has a deeper stake. The line is not arbitrary; it is factual. It requires inquiry. This is why discretionary review is necessary. We cannot draw a bright line in code that says "only owners of ten years count." We must allow the process to hear from those who can demonstrate reliance. This is messy, but life is messy. The alternative is to say that no one's reliance counts, which is false.

  8. **Conclusion**
  I am not voting against housing. I am voting against a process that assumes housing supply is the only value at play. I am voting against the idea that a city is merely a collection of parcels to be optimized. It is also a collection of lives that depend on stability. When we remove discretion, we remove the ability to protect the fragile goods that make a neighborhood a home rather than just a location. I acknowledge the risks of this argument. It can be used to exclude. It can protect unjust advantages. It can slow down necessary change. But the risk of destroying real human stakes without looking is greater. We owe it to both the people who live here now and the people who need to live here to look at the specific costs of change. We owe them a hearing. For that reason, I cannot recommend this ordinance. I recommend we keep the tools that allow us to weigh stakes, not just preferences. I vote no.
