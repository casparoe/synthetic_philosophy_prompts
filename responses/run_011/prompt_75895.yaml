      *   *Objection 3 (Injustice):* I must admit that some "stakes" are ill-gotten. But not all. A multi-generational community of color also has stakes. The argument shouldn't assume current residents are exclusively white exclusivists.
      *   *Revision:* I will structure the dissent to argue for *process* (discretionary review) rather than an absolute ban, because the "stake" claim requires a hearing to verify, not a blanket rule. Wait, the prompt says the vote is on "permit fourplexes by right." Voting no means keeping discretionary review or maintaining current zoning. I should argue for keeping the ability to review, not necessarily banning fourplexes forever. Actually, the prompt says "recommendation... whether to permit fourplexes by right." My vote is against the *by right* aspect. I need to be clear: I am voting against removing the check, because the check protects stakes.

