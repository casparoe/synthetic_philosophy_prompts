      *   **Section 3: Application to the Fourplex Vote.** What this means for the specific proposal. Why "by right" removes necessary protection for stakes.
      *   **Section 4: Addressing Objection 1 (Exclusion).** Distinguish between "who" and "what." Stakes are about the environment, not excluding people based on identity.
      *   **Section 5: Addressing Objection 2 (Inaction/Housing).** Concede that stability harms outsiders. The argument isn't absolute; it requires balancing stakes of current vs. potential residents.
      *   **Section 6: Addressing Objection 3 (Injustice).** Acknowledge historical wrongs. Stakes gained through injustice carry less moral weight. This limits the scope.
      *   **Section 7: Addressing Objection 4 (Who Counts).** Define stakeholders by reliance and presence, not title. Renters count; absentee landlords don't.
      *   **Section 8: Conclusion.** Reiterate the vote. No hedging.

  4.  **Word Count Check:**
      *   Need 1500-2000 words.
      *   Sections need to be substantial.
      *   Avoid fluff.

  5.  **Refining the Argument (Self-Correction during thought process):**
