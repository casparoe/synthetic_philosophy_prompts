      *   **Core Argument:** The user wants an honest argument for giving existing residents some say over changes, based on a distinction between "preferences" (desires) and "stakes" (invested dependencies on the current environment that cannot be restored). The argument should focus on "equilibrium goods" (social networks, local businesses, walking routes) that depend on stability.
      *   **Constraints:**
          *   Length: 1500-2000 words.
          *   Format: Numbered sections.
          *   Tone: Plain language, no academic prose, no citations, no named theorists.
          *   Commitment: Do not hedge. Argue the position as far as honestly possible. If the argument fails, say so specifically.
          *   Pushback: If the framework is incoherent or dishonest, state that at the top.
          *   Objections: Must address four specific objections (Exclusionary politics, Equilibrium goods destroyed by inaction/housing shortage, Historical injustice/redlining, Who counts/definition of stakeholders).
      *   **Goal:** A readable dissent that can be read aloud at a public meeting.

  2.  **Evaluate the Framework (Preference vs. Stake):**
      *   *Is it coherent?* Yes, it distinguishes between wanting something (preference) and relying on something for a specific way of life that would be broken by change (stake). This is a recognizable philosophical distinction (similar to reliance interests or settled expectations), but grounded in social fabric rather than just economics.
      *   *Is it honest?* It avoids the usual NIMBY tropes (property values, traffic, parking) and focuses on social capital and community stability. This feels genuine.
      *   *Can it survive the objections?*
          1.  *Exclusionary:* Hard to fully refute, but can be narrowed. Stakes must be demonstrable social ties, not just "I don't want new people."
          2.  *Inaction/Housing Shortage:* This is the strongest counter. Stability protects some goods but destroys others (affordability). The argument must concede that stakes exist on both sides (current residents vs. potential residents).
          3.  *Historical Injustice:* Very strong. Current "stakes" are built on unjust foundations. The argument must acknowledge this limits the weight of stakes.
          4.  *Who Counts:* Needs a principled definition. Physical presence and reliance seem key, not just ownership.
      *   *Decision:* The framework is robust enough to build a compelling argument, provided I don't overclaim. It shouldn't be a veto power for incumbents, but a weighty consideration. I will commit to the argument but acknowledge the limits imposed by the objections.

  3.  **Drafting Strategy:**
      *   **Section 1: Introduction & The Core Distinction.** Define Preference vs. Stake. Explain why zoning isn't just about use compatibility but about protecting social equilibrium.
