answer: |-
  Good evening. For those who don't know me, I'm [Name], a colleague of Derek's. For those who do know me, you'll know better than to expect a smooth ride.

  We are here to celebrate twenty-nine years of Derek's work. But if you know Derek, you know he finds comfort difficult. He finds scrutiny much more relaxing. Specifically, he has spent a lifetime asking whether a research programme is *progressive* or *degenerating*. He used to ask this over roast beef, cheerfully, while the rest of us tried to swallow.

  So, it seems appropriate—indeed, required—that we apply Derek's own standard to the department he anchored. I want to take five minutes to assess us. Not to flatter him, and not to bury us, but to answer the question he would put to us himself.

  For the spouses, the scientists, and our Dean—who I know worries about cost centres—I need to explain the machinery briefly. Imre Lakatos, a philosopher Derek admired greatly, argued that any serious intellectual endeavour has a **hard core**. These are the fundamental beliefs you refuse to give up. For us, that core is the idea that rigorous critique improves knowledge, even when it's uncomfortable.

  Surrounding that core is a **protective belt**. These are the adjustments you make when reality pushes back. Sometimes these adjustments are sensible. Sometimes, however, you are just patching holes to avoid admitting the core isn't working. If you are only patching holes, your programme is degenerating. If, however, your adjustments lead you to predict **novel facts**—things you didn't know before, new insights that surprise you—then you are progressive.

  So. The verdict on the last twenty-five years.

  It cannot be all progress. That would be a lie, and Derek would smell it. There was a stretch, roughly between 2010 and 2015, where we were clearly degenerating. We felt the pressure of changing university metrics, the demand for "impact," the sense that pure philosophy was becoming hard to sell. So, we bolted on auxiliaries. We renamed modules to sound like policy studies. We added buzzwords to our course descriptions. We tweaked the protective belt to dodge the anomaly of declining enrolments.

  The cost was real. We spoke less to each other about truth and more to auditors about deliverables. We became busy, but we stopped being surprising. We were protecting the department, but we weren't advancing the science.

  But—and this is why we are here—that was not the whole story. Because simultaneously, Derek pushed for the co-teaching initiative with the Biology department. This wasn't just a protective patch. It was a risky prediction. He argued that if philosophers sat in on lab meetings, not to critique the ethics afterwards, but to analyse the hypothesis formation *during* the work, we would find errors scientists couldn't see, and scientists would find assumptions philosophers hadn't imagined.

  That happened. It produced novel facts. We published papers together that neither side could have written alone. We changed the way a specific set of researchers formulated their questions. That is progress in the Lakatosian sense. It wasn't just more publishing; it was new knowledge generated by the collision of our hard core with their practice.

  So, we have been both. We have patched, and we have progressed.

  But I want to end where Derek would want us to end: looking forward. He is retiring, but the programme continues. The question for the next ten years is not whether we will publish. We will publish. The question is whether we will be progressive.

  What would count as an auxiliary patch in the next decade? It would be adding a course on "AI Ethics" simply because it is in the news. It would be creating a new administrative centre to absorb funding without changing how we teach. It would be protecting our status quo by painting it green.

  What would count as a novel prediction? It would be producing a framework of analysis that scientists adopt *before* they collect data, not after. It would be training undergraduates who go into policy and change a decision not because they lobbied, but because they spotted a conceptual flaw in the modelling that nobody else saw. It would be risking being wrong in public, rather than being safe in private.

  Derek, you taught us that safety is the enemy of progress. You taught us that a theory that explains everything after the fact explains nothing. We are going to miss your mind. But we are not going to miss the comfort of not being tested.

  So, here is the promise. We will not just bolt on auxiliaries to survive the next decade. We will try to predict something new. We will try to be progressive.

  To Derek.
