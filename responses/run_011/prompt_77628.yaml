answer: |-
  The objection most likely to sink this talk is that your "cost frontier" measure is indistinguishable from a liquidity constraint masquerading as moral resolve.

  ### Q&A Prep Sheet

  **1. The Wealth Confound (Economist & Philosopher of Social Science)**
  *   **Question:** "You normalize sacrifices against a consumption basket, but liquidity constraints aren't linear. Doesn't your 'cost frontier' just measure who has slack resources rather than who has moral concern? A rich person giving $100 feels less pain than a poor person giving $10, but your metric might treat them equivalently or worse."
  *   **Reply:** "You're right that normalization is imperfect, which is why I treat income as a control variable rather than a denominator. The pilot data splits subjects by income quintiles; within each quintile, the variation in sacrifice still tracks target characteristics (cuteness/proximity) rather than remaining income variance. I'm not claiming this measures 'pure' morality, but rather the *margin* where morality meets budget. If the price drops for everyone, the rich shouldn't be the only ones moving the frontier."
  *   **Soft Spot:** The normalization method is indeed shaky; if pressed on the specific utility function assumed, you have no definitive answer.

  **2. Defining Moral Progress (Philosopher of Social Science)**
  *   **Question:** "If the outcome is that more animals are protected and fewer people starve, why does it matter if the 'price' dropped? You seem to be defining moral progress as 'costly signaling' rather than 'welfare improvement.' Is that a defensible normative stance?"
  *   **Reply:** "I'm making a descriptive claim about *measurement*, not a normative claim about *value*. If we want to know if moral *psychology* has changed, we must isolate preference shifts from price shifts. If the price drops and behavior changes, that's technological progress, not necessarily moral progress. Conflating the two leads to fragile policies; if the tech fails, does the morality hold? My metric tests the resilience of the concern."
  *   **Soft Spot:** You are implicitly privileging 'expensive' morality as 'real' morality, which is a normative claim you're trying to dodge.

  **3. Ecological Validity (Moral Psychologist)**
  *   **Question:** "Your trade-off task is a one-off lab decision. Self-reported attitudes predict aggregate voting behavior and donation trends over decades better than single incentivized tasks. Why trust your noisy lab metric over robust survey trends?"
  *   **Reply:** "Surveys predict *stated* intent, but they are cheap talk by design. My point is precisely that cheap talk becomes cheaper over time. Voting and donating are also subject to price changes—online donating is easier than mailing checks. I'm not saying surveys are useless, but they are the dependent variable I'm trying to explain away. We need at least one measure where the subject bleeds a bit to verify the signal."
  *   **Soft Spot:** Your pilot data is small-scale; claiming it overrides decades of survey data is a hard sell without longitudinal replication.

  **4. Norms Drive Prices (Cultural-Evolutionist)**
  *   **Question:** "You treat price as an exogenous shock—technology just happened. But prestige bias and institutional incentives *create* the technology. Norms lower the cost. Aren't you describing the mechanism of norm change and calling it a measurement error?"
  *   **Reply:** "I agree norms lower costs, but that's exactly why we need to separate them. If prestige bias makes veganism cheap, is the expansion due to *valuing* animals more, or *valuing* prestige more? If we only measure the expansion, we miss the driver. My metric helps distinguish whether the norm is held by price subsidies or by genuine preference shift. If the subsidy vanishes, does the norm survive?"
  *   **Soft Spot:** This concedes that norm change is real, which weakens the 'no underlying moral change' thesis slightly.

  **5. Moral Licensing Repackaged (Moral Psychologist)**
  *   **Question:** "Your friend's worry is valid: isn't this just moral licensing? People feel good about cheap signals so they don't make expensive sacrifices. You're just giving licensing a new name ('price of admission')."
  *   **Reply:** "Licensing is usually intra-individual—'I recycled so I can steal.' My claim is inter-temporal and structural—'Technology made recycling cheap so everyone claims to be green.' Licensing explains individual hypocrisy; my thesis explains historical trends. Even if no one is licensing, the aggregate data would look like expansion because the cost curve shifted. It's a structural account, not a psychological defense mechanism."
  *   **Soft Spot:** The distinction between structural price drops and psychological licensing is blurry in practice.

  **6. Basket Normalization Flaws (Economist)**
  *   **Question:** "You normalize against a standard basket, but the composition of that basket changes morally. Meat is cheaper now, but is it comparable to 1950 meat? You're assuming stable utility across time when the goods themselves change."
  *   **Reply:** "That's a valid concern for longitudinal work, which is why my current claim is cross-sectional. I'm comparing targets *within* a period to establish the frontier shape. The historical claim is theoretical based on known cost reductions in transport and communication. I'm not claiming perfect historical comparability yet, just that current cross-sectional data invalidates the assumption that attitudes equal inclusion."
  *   **Soft Spot:** You punt on the historical claim, which is half your thesis.

  **7. Institutions Change Preferences (Cultural-Evolutionist)**
  *   **Question:** "Institutions don't just change incentives; they change preferences. Living under animal welfare laws makes people care more about animals, not just obey. You're assuming preferences are stable and only prices move."
  *   **Reply:** "I'm not assuming preferences are stable forever, but that they are sticky enough that a massive behavioral shift requires either a preference shock or a price shock. Since we have evidence of massive price shocks (tech/state capacity), Occam's Razor suggests we test that first. If preferences changed endogenously, we should see costly sacrifices rising too, not just cheap ones."
  *   **Soft Spot:** Cultural evolutionists believe preferences are highly plastic; your 'sticky preference' assumption is their main disagreement point.

  **8. Risk Aversion Confound (Philosopher of Social Science)**
  *   **Question:** "Your trade-off task involves uncertainty or loss. Doesn't this measure risk aversion or loss aversion rather than moral concern? Maybe people just hate losing endowments."
  *   **Reply:** "I use a multiple price list design to control for risk attitudes. Furthermore, if it were just risk aversion, it wouldn't track 'cuteness' or 'proximity' as strongly as it does. The variance across target types suggests moral weighting is happening, not just generic loss aversion. But I acknowledge risk is a noise factor I'm still modeling."
  *   **Soft Spot:** Your control for risk aversion is likely standard, not robust enough to fully rule out this confound.

  **9. The "Prayer" Question: Normative Irrelevance (Philosopher)**
  *   **Question:** "Suppose you're right. The price dropped, preferences didn't. So what? If the animals are saved and the poor are fed, why should moral science care if the motive was cheap?"
  *   **Reply:** "Because cheap morality is fragile. If expansion relies on tech and state capacity, it reverses if those fail. If it relies on preference change, it's resilient. For policy, we need to know if we're building a culture or just subsidizing a behavior. If we think we've solved racism because it's now costly to be racist, but preferences haven't changed, we're vulnerable to price shocks."
  *   **Honest Assessment:** There is no good answer here. If the outcome is identical, the 'moral worth' of the agent is irrelevant to the victim. You are relying on a 'resilience' argument that is speculative. If they press on "why care about resilience vs. immediate welfare," you lose.

  ### Strategic Positioning

  **Concede in First 5 Minutes (Goodwill):**
  *   Admit immediately that income normalization is the weakest link in the methodology and you are looking for better instruments.
  *   Concede that attitudinal surveys *do* predict coordination and voting, so you aren't proposing throwing them out, only supplementing them.
  *   Acknowledge that "moral progress" has normative definitions you aren't qualified to settle; you are offering a descriptive correction.

  **Hold Onto (Core Thesis):**
  *   The distinction between *price effects* and *preference shifts* is methodologically crucial and currently ignored in the literature.
  *   Current evidence for moral circle expansion is consistent with zero preference change.
  *   Costly sacrifice is a necessary (though not sufficient) indicator of resilient moral concern.

  **The Single Reply That Must Land:**
  *   **Objection #1 (The Wealth Confound).** If the economists and philosophers decide your metric is just a proxy for wealth, the paper is dead. You must demonstrate that within income brackets, the variation exists and tracks moral targets. If you fumble this, you look like you've discovered that rich people give more money.
