  1.
  **Question:** You argue that spontaneous movement recruits the same accumulator-plus-threshold machinery used in evidence-based decisions, yet you report that the readiness potential is largely absent in deliberate choices. Is this because strong evidence-driven drift compresses or masks the ramp, because epoch and baseline choices make the deliberate case unmeasurable, or because there is a genuinely different mechanism at work? What specific measurement would discriminate among these explanations?

  **Predicted Answer:** She will likely endorse the masking hypothesis, arguing that strong drift rates in deliberate decisions overwhelm the noisy accumulation visible in arbitrary tasks, making the ramp steeper and harder to distinguish from baseline. She will propose analyzing the variance of the latency distribution or using single-trial decoding to show the underlying accumulator dynamics remain constant despite the ERP differences.

  **Follow-up:** If the drift rate merely masks the ramp, doesn't that imply the underlying noise accumulation is still happening but obscured by signal strength? If so, doesn't the fallacy claim in (a) still apply to the deliberate case, just hidden by the data, which undermines your claim that the paradigms are different in kind rather than just different in signal-to-noise ratio?

  2.
  **Question:** I want to press you on the veto. You may note the interrupted-movement variants of the paradigm, in which a cue requires the subject to move promptly at an unpredictable moment, and which show that subthreshold ramps frequently fail to issue in action. If one and the same accumulator dynamic explains both the movements that occur and the movements that do not, in what sense is vetoing a faculty rather than a threshold that happened not to be crossed?

  **Predicted Answer:** She will distinguish the causal source of the non-crossing: in veto cases, it is an active top-down inhibitory signal modifying the threshold or drift, whereas in failed spontaneous movements, it is merely passive noise failure. She will argue this functional difference validates treating the veto as a distinct faculty of guidance control.

  **Follow-up:** But if that top-down inhibitory signal is itself the output of a prior neural accumulation process, haven't you just pushed the regress back one step? How do you prevent the veto itself from being subject to the same averaging artifact critique you apply to the readiness potential, thereby dissolving the conscious control you aim to preserve?

  3.
  **Question:** Single-trial decoding, including lateralized signals in two-alternative versions of the task, beats chance at predicting which hand will move well before the reported decision. What has to be true of the drift rate for that to be compatible with a pure-noise account, and what is left of the word "noise" if the drift rate is modulated by the agent's standing preferences?

  **Predicted Answer:** She will argue that "noise" refers to the temporal variability of the threshold crossing, not the content bias of the drift, which can reflect stable preferences without implying a prior conscious decision. She will maintain that predictability reflects the setup of the accumulator by reasons, not the determination of the specific timing by consciousness.

  **Follow-up:** If the drift bias is sufficiently stable to allow single-trial prediction, doesn't that suggest the "decision" is effectively made by the setup of the accumulator, rendering the threshold crossing a mere release mechanism rather than the locus of agency you describe? Where does the specific exercise of control enter if the trajectory is already biased?

  4.
  **Question:** There is an apparent tension in your differential trust in introspective reports: you discard the reported time of decision as unreliable, yet the veto window is specified relative to reports of the same sort. Which reports do you accept and on what principled basis is the discrimination made?

  **Predicted Answer:** She will distinguish reports of *onset*, which she views as reconstructive and post-hoc, from reports of *interruption* or *veto*, which she treats as salient events tracked by working memory. She will argue the latter are less susceptible to the temporal binding errors that plague the former.

  **Follow-up:** But if the veto report is also reconstructed based on the occurrence of the movement (or lack thereof), isn't it subject to the same temporal binding errors you identify in the decision reports? What independent calibration validates the veto timing aside from its coherence with your theoretical model?

  5.
  **Question:** Consider the division of labor between your account and the older philosophical objection that an urge to move is not a decision to move. Does your model render that objection redundant, and if not, what do the two accounts predict differently?

