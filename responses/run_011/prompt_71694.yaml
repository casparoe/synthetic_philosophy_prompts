  You fear that if God creates your intention, it is merely another event, like the lactate falling. This is a confusion of categories. The lactate falling is a bodily state. Your intention is a quality of the heart (*ṣifa qalbiya*). God creates this quality in you upon the occasion of your seeing the child's distress. He creates it *oriented* toward the child. That orientation is what "for" means. It is not that you generate the purpose from nothing; it is that God creates the purpose in you, and you acquire it as yours.

  Consider the arrow. The archer releases it. The motion is God's creation. But the aim is the archer's. If the arrow misses, did he not aim *for* the target? Yes. Your care was the arrow. The boy was the target. That God created the flight does not erase the aim. You say this leaves you with only one description that makes work mean anything. I tell you both are true: God created the cure, and you intended it for him. The meaning lies not in your power to create outcomes, but in your submission to the habit of God through your will. You are the locus where God's habit meets human need. Do not demand to be the Creator to be the agent.
