answer: |-
  This is an exceptionally sharp diagnosis of the situation. You have identified the gap between the *phenomenology* of physics (Wigner's wonder) and the *methodology* of physics (the practitioner's pragmatism). Wigner is asking a metaphysical question ("Why does the map fit the territory?"); you are asking a methodological one ("What kind of mapmaking are we actually doing?").

  Your intuition is correct: the practice of physics is underdetermined by the ontological stories you listed. A working physicist can be a Platonist about the Lagrangian, an instrumentalist about the path integral, and a fictionalist about the perturbation series, all before lunch. The discipline does not strictly require any single metaphysical stance. Instead, it rests on a specific **epistemic attitude** that distinguishes between *physical principles* and *computational machinery*.

  Here is the breakdown of what that insouciance rests on, how it resolves the tension you see, and what would happen if you pulled the rug out.

  ### 1. What the Practice Presupposes: Reliability, Not Truth

  You asked which picture the practice strictly requires. The answer is **none of them**. The practice strictly requires **empirical robustness** and **internal consistency of prediction**, but it is agnostic about the ontological status of the intermediate steps.

  However, there is a tacit presupposition that guides the "sloppiness." It is not straight instrumentalism, nor is it naive realism. It is best described as **Mathematical Optimism combined with Effective Realism**.

  *   **Mathematical Optimism:** The assumption that *there exists* a rigorous formulation underlying the heuristic manipulations, even if we don't know it yet. When a physicist uses a Dirac delta, they presuppose that distribution theory (or some successor) licenses the move. They treat the lack of rigor as a *temporary technical deficit*, not a fundamental feature of nature. This is why they don't worry: they assume the "well-defined territory" exists (your Option 1), even if their map is currently sketched in charcoal.
  *   **Effective Realism:** They treat the *outputs* (cross-sections, energy levels) as real and the *symmetries* (gauge invariance, Lorentz covariance) as structural truths about the world. The "sloppy" parts are viewed as artifacts of the representation, not the reality.

  **Is this underdetermined?** Yes. You can tell the story that "the electron's magnetic moment is real and the divergent series is a useful fiction" (Instrumentalism) or "the series is asymptotic to a real function we haven't found" (Realism). Both license the exact same calculation.

  **Can observation tell them apart?** Generally, no. This is a local version of the Duhem-Quine thesis. As long as the regularizations yield the same finite predictions, the ontological status of the regularization is empirically invisible. However, there is a niche exception: **Universality and Phase Transitions.**
  Work by philosophers of physics like Robert Batterman argues that the *divergence* of the series (the fact that it doesn't converge) is not a bug but a feature. The singularity carries physical information about phase transitions and universality classes. If the series converged, the physics would be *different*. In this specific case, the "sloppiness" (the asymptotic nature) is physically constitutive. This suggests Option 3 (shorthand for approximations) is sometimes false; the idealization is sometimes necessary for the explanation.

  ### 2. Resolving the Tension: Miracle vs. Tool

  You identified a genuine tension: Physicists marvel at math's effectiveness (Wigner) but treat specific mathematical objects as disposable tools. How can you hold both?

  The resolution lies in distinguishing **Structure** from **Analysis**.

  *   **The Miracle (Structure):** When physicists invoke Wigner, they are talking about *symmetry groups, representation theory, and geometric structures*. The "miracle" is that $SU(3)$ classifies hadrons, or that complex numbers are required for quantum amplitudes. This is where the "unreasonable effectiveness" lies. Physicists are often realists about this layer. They believe the symmetry is "out there."
  *   **The Tool (Analysis):** When physicists are insouciant, they are talking about *integration techniques, series expansions, and limit procedures*. This is the "grind." They are instrumentalists about this layer. They do not believe the perturbation series *is* the physics; they believe it *computes* the physics.

  So, the wonder in Wigner's essay is about the **selection of the formalism** (why does Hilbert space describe spin?), while the insouciance is about the **manipulation of the formalism** (how do we integrate this path?).

  This also explains the oscillation on beauty/symmetry.
  *   **No Data:** You must rely on the "Miracle" layer. You use beauty/symmetry to select the *structure* of the theory (e.g., choosing a gauge group).
  *   **Data Present:** You rely on the "Tool" layer. Beauty is irrelevant to whether the loop integral matches the detector.

  There is no contradiction here; it is a division of labor. Symmetry guides theory *construction*; experiment guides theory *validation*. The "miracle" is that the construction phase works at all.

  ### 3. The Counterfactual: Imposing Rigor

  What if physics journals demanded mathematical rigor (e.g., constructive QFT standards) before publication?

  **What would be lost?**
  1.  **Heuristic Speed:** Rigor is computationally expensive. The path integral is a powerhouse of intuition precisely because it is ill-defined. It allows physicists to "see" trajectories and topological features that operator formalism obscures. Rigorizing it often requires stripping away the visual/intuitive heuristic that led to the discovery.
  2.  **Premature Closure:** Rigor often requires specifying the domain of validity precisely. Physics progresses by *over-extending* theories. Newtonian gravity was used beyond its domain to find Neptune. If rigor were required, we might have halted at the boundary of known validity. The "sloppiness" allows for extrapolation.
  3.  **The "Existence" Problem:** As you noted, for many interacting QFTs in 4D, the rigorous object *does not exist* (or hasn't been proven to). If rigor were a prerequisite, **the Standard Model would not be publishable physics.** We do not have a rigorous construction of Yang-Mills theory in 4D (it's a Millennium Prize problem). Imposing rigor would turn most of high-energy physics into "conjectural mathematics."

  **How would the discipline cope?**
  It would shift toward **Effective Field Theory (EFT)** explicitly.
  Currently, EFT is the *de facto* philosophy, but often *de jure* ignored. Physicists act as if the theory is fundamental, then renormalize away the infinities.
  If rigor were imposed, the "honest answer" you mention would become the standard: *"This theory is undefined at scale $\Lambda$."*
  *   **The Gain:** We would stop asking metaphysical questions about the "reality" of the electron at Planck scales. We would acknowledge that our theories are algorithms for specific energy regimes.
  *   **The Coping Mechanism:** The discipline would fracture. "Phenomenologists" would continue using the sloppy tools under a "for engineering purposes" waiver, while "Formal Theorists" would work on the rigorous underpinnings. This is essentially what has already happened (e.g., the divide between string phenomenology and mathematical physics), but it would become an institutional norm rather than a cultural one.

  ### 4. The Verdict on Wigner

  Wigner's essay is often read as a puzzle about truth. Your experience suggests it is actually a puzzle about **stability**.

  The "unreasonable effectiveness" is not that the math is true, but that the physics is **insensitive to the mathematical details**.
  *   The perturbation series diverges, but the first few terms match experiment.
  *   The cutoff goes to infinity, but the low-energy physics is independent of the cutoff (Renormalization Group flow).
  *   The measure on the path integral is undefined, but the stationary phase approximation gives the classical limit.

  The "miracle" is **Universality**. The physical predictions are robust against the specific mathematical implementation. The insouciance you observed rests on the empirical fact that **the physics lives in the singularities and the symmetries, not in the convergence of the series.**

  If the physics depended sensitively on the 100th loop order, or on the specific regularization scheme, physicists would *have* to be rigorous. They would be forced to care about the mathematical foundations because the predictions would change. The fact that they *don't* have to care is evidence that the "territory" (nature) is smoother than the "map" (the math).

  ### Summary

  1.  **Presupposition:** The practice presupposes **Empirical Robustness**, not ontological clarity. It relies on "Mathematical Optimism" (rigor is possible eventually) but operates on "Methodological Pragmatism" (predictions now).
  2.  **Underdetermination:** The ontology is radically underdetermined. Realism, Instrumentalism, and Fictionalism all license the same calculations. Observation cannot distinguish them unless the mathematical inconsistency leads to physical instability (which the Renormalization Group usually prevents).
  3.  **The Tension:** Wigner's miracle applies to the **Structural/Symmetry** layer (Realist); the insouciance applies to the **Analytical/Computational** layer (Instrumentalist). They are compatible because they operate at different levels of the theory.
  4.  **Counterfactual:** Imposing rigor would halt progress in high-energy physics (as the Standard Model lacks rigorous construction) and force an explicit adoption of Effective Field Theory ontology. We would lose heuristic power and intuition, gaining clarity about the limits of validity.

  The "insouciance" is not ignorance; it is a calibrated trust that the physical signal is strong enough to survive the mathematical noise. Wigner marveled that there is a signal at all; the physicist is just happy they can read it without fixing the antenna.
