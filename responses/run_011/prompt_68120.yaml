          *   *Genuine Difference:* SSA is about *conditionalizing* on being in a reference class of actuals. SIA is about *weighting priors* based on the number of observers. They often yield opposite results (e.g., Doomsday). SSA favors smaller reference classes (Doomsday); SIA favors larger populations (anti-Doomsday). They are *not* just the same thing with different reference class sizes. SIA explicitly brings in *possible* observers to weight probabilities, whereas SSA restricts to *actual* observers.
      *   **Part (b): Implications for Doomsday.**
