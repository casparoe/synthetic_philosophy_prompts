  4.  **Ranking and Concessions (The "Concession List"):**
      *   *Fatal:* The tension between decoupling Scrutability and defining PI via a priori conditionals. If Scrutability fails, the "a priori" link between D and S breaks for many sentences. Then PI isn't a priori accessible.
