answer: |-
  Here is the map of vulnerabilities, ranked by damage, followed by the specific concession list you requested.

  ### 1. Ranking the Objections

  **Fatal (Requires Abandoning or Radically Revising the Core Definition)**
  1.  **The Scrutability/Definition Tension:** You define the primary intension as fixed by a conditional ("If D is the case, then S") that is *knowable a priori*. You also claim to decouple this from Scrutability (the claim that all truths are a priori entailed by a base). These are inconsistent. If Scrutability is false, there are truths *S* that are not a priori entailed by the canonical description *D*. If *S* is not entailed by *D*, the conditional "If D then S" is not a priori. Therefore, the primary intension for *S* is not a priori accessible. You cannot have a primary intension defined by an a priori conditional for vocabulary that fails Scrutability. You must either accept Scrutability for the vocabulary covered by your semantics or admit that primary intensions are not universally a priori.
  2.  **The Circularity of "World as Actual":** If the notion of a "scenario" or "world considered as actual" presupposes modal concepts (e.g., consistency, possibility), then the epistemic dimension is not fundamental. It is parasitic on the modal dimension it was meant to explicate. If you cannot characterize scenarios non-modally (e.g., purely via epistemic states without invoking "possible worlds" structure), the view collapses into a modal realism with an epistemic label.

  **Severe (Reduces Explanatory Power to Triviality)**
  3.  **The Soames/Descriptive Content Objection:** Soames argues that for proper names and natural kind terms, there is no descriptive content accessible a priori that fixes reference. Your view posits a canonical description *D*. If *D* is substantive (descriptive), Soames is likely right that it doesn't exist for names. If *D* is trivial (e.g., "the world that is actually actual"), the primary intension becomes trivial (true everywhere or nowhere) and loses its ability to distinguish epistemic possibilities. You inherit this fully unless you restrict the semantics to non-rigid vocabulary.
  4.  **Loss of the Phenomenal Bridge:** If the claim that phenomenal concepts have coincident primary and secondary intensions is false (e.g., if recognitional concepts allow for a gap), your semantics survives, but its primary philosophical application (the conceivability argument against physicalism) collapses. The semantics becomes a formal tool with no bite on the hard problem.

  **Awkward (Requires Qualification, Not Abandonment)**
  5.  **Immunisation via Idealization:** Relying on an "ideal reasoner" makes the view difficult to falsify empirically. This is standard for conceptual analysis, but it limits the view to a framework rather than a substantive theory. It's not fatal, but it prevents the view from making contact with cognitive science or empirical linguistics.
  6.  **Fixed vs. Shifted (The "Actually" Objection):** If the primary intension is just the character of a sentence in a context where "actually" is fixed to the scenario of evaluation, this may be just a relabelling of Kaplanian context-dependence. This doesn't kill the view, but it reduces its novelty. It becomes a specific logic of "actually" rather than a deep metaphysical discovery.

  ---

  ### 2. The Soames-Style Attacks

  You ask how much of this your watered-down version inherits.

  **Inherited:** You inherit the claim that there is no *unique* a priori accessible descriptive content for names. You define the primary intension via a conditional on a canonical description *D*. If *D* is supposed to capture the meaning of "water," Soames argues there is no such *D* that is both a priori and reference-fixing. If you concede *D* is just a label for a scenario (e.g., "the scenario where the clear liquid is XYZ"), you avoid Soames, but you risk triviality (see below).

  **Dodged:** You dodge the claim that 2D semantics *is* the theory of meaning. By treating primary intensions as semantic machinery for bookkeeping epistemic possibility rather than "meaning" in the Fregean sense, you avoid the claim that you are misdescribing linguistic competence. You are describing the logic of evaluation, not necessarily the psychological content of speakers.

  **The Embedding Problem:** Soames argues that 2D semantics fails with embedded belief ascriptions (e.g., "John believes that water is H2O"). If primary intensions track epistemic possibility, they should compose in belief contexts. They often don't without ad-hoc adjustments. Your version inherits this. If primary intensions are a priori conditionals, and belief is opaque to a priori equivalence, your semantics does not naturally compose in attitude reports. You will need a separate logic for attitude ascriptions, which weakens the claim that 2D is a general semantics.

  ---

  ### 3. The Immunisation Worry

  Is "ideal reasoner + canonical D" unfalsifiable?

  **Yes, largely.** If a counter-example is proposed (a case where a priori reflection fails to yield the truth value), the defense is "the reasoner wasn't ideal" or "the description wasn't canonical."
  **Is this a problem?** For a *framework semantics*, no. Frameworks are tools, not empirical hypotheses. If you present this as a way to map conceptual space, idealization is acceptable.
  **However,** if you claim this explains *human* epistemic access or modal knowledge, it is a problem. You cannot explain finite modal knowledge by appealing to an infinite idealization without a story about how the finite approximates the infinite. If you lack that story, the view is insulated from criticism but also insulated from explaining anything about actual cognition.

  **Verdict:** It is unfalsifiable as a normative framework, but explanatorily empty as a descriptive theory of mind. You must concede it does not explain *how* we know modal truths, only *what* those truths look like structurally.

  ---

  ### 4. Circularity

  To define a primary intension, you evaluate a world *as actual*. This looks modal.

  **The Objection:** To specify a scenario, you typically specify a distribution of properties over individuals. This presupposes the coherence of those properties (i.e., modal consistency). If you need modal notions to define the domain of the primary intension, the epistemic is not more fundamental than the modal.
  **Your Defense:** You can define scenarios as maximal epistemic possibilities (sets of sentences not ruled out a priori).
  **The Counter:** "Not ruled out a priori" relies on a notion of apriority. If apriority is defined via primary intensions (as you suggest: "S is a priori iff its primary intension comes out true at every scenario"), the definition is circular. Scenarios define Apriority; Apriority defines Scenarios.
  **Damage:** This is severe. It suggests the two dimensions are co-defined rather than one reducing the other. You cannot claim the epistemic dimension *grounds* the modal one. They stand or fall together.

  ---

  ### 5. What Happens if Scrutability is False?

  You claim they are separable. I argue they are not, given your definition.

  **The Argument:** You define the primary intension of *S* via the conditional "If D, then S." You claim this conditional is a priori.
  If Scrutability is false, there is a truth *S* and a base *D* such that *D* does not a priori entail *S*.
  If *D* does not a priori entail *S*, then the conditional "If D, then S" is not a priori knowable.
  If the conditional is not a priori knowable, the primary intension (which maps *D* to the truth value of *S*) is not a priori accessible.
  **Conclusion:** You cannot maintain that primary intensions are a priori accessible for vocabulary that fails Scrutability.
  **Defensible Separation?** Only if you drop the claim that primary intensions are *always* a priori accessible. You can have primary intensions as functions from scenarios to truth values that are determined *a posteriori*. But then you lose the link between Conceivability and Primary Possibility. If I can't know the primary intension a priori, I can't use conceivability to track it.
  **Verdict:** You are fooling yourself on the separation *if* you want to keep the link to conceivability. If you drop the conceivability link, the semantics survives but loses its epistemic utility.

  ---

  ### 6. Fixed vs. Shifted Reference Point

  Is this just Kaplan's "actually"?

  **The Worry:** In Kaplan's framework, "Actually S" is true at a world *w* iff S is true at the actual world. 2D semantics evaluates S at *w* considered as actual. This looks like evaluating "Actually S" at *w*.
  **Explanatory Work:** The 2D framework does extra work if it explains *why* "Actually S" behaves that way via the distinction between epistemic and metaphysical evaluation. However, if the only difference is that 2D posits a second dimension while Kaplan posits a context parameter, the predictive difference is nil.
  **The Risk:** If the primary intension is just the character of the sentence (in the Kaplanian sense) restricted to epistemic contexts, then 2D is just two-dimensional *notation* for a one-dimensional *phenomenon*.
  **Verdict:** It has explanatory work only if the "epistemic" dimension is genuinely distinct from the "context" dimension. Given the Circularity objection above, this distinction is shaky. If scenarios are just possible worlds, you have added a dimension without adding ontology.

  ---

  ### 7. The Phenomenal Concept Coincidence

  Suppose the coincidence claim goes (e.g., recognitional concepts allow a gap between epistemic and metaphysical for phenomenology).

  **Semantics vs. Application:** The *semantics* survives untouched. The formal machinery of primary and secondary intensions does not depend on there being concepts where they coincide.
  **Application Collapses:** The *argument against physicalism* collapses. The conceivability argument relies on:
  1.  Phenomenal truths are conceivable (Primary Possible).
  2.  For phenomenal concepts, Primary Possible = Metaphysically Possible (Coincidence).
  3.  Therefore, Phenomenal truths are Metaphysically Possible without Physical truths.
  If (2) fails, the inference to metaphysical possibility fails. You are left with epistemic dualism, not ontological dualism.
  **Verdict:** The semantics is robust; the metaphysics is fragile. You must concede that your view does not support anti-materialism without the coincidence thesis.

  ---

  ### 8. Predictions

  You asked what this predicts that rivals don't.

  **Honest Answer:** Very little, on its own.
  As a framework, it is compatible with almost any metaphysical view (physicalism, dualism, idealism) depending on how you fill in the intensions.
  **Specific Predictions (Conditional on your specific commitments):**
  1.  **Divergence Prediction:** For natural kind terms (water, gold), epistemic and metaphysical modal profiles will diverge. (Rivals like Kripkeanism agree).
  2.  **Convergence Prediction:** For phenomenal concepts, epistemic and metaphysical modal profiles will converge. (Physicalists with recognitional concepts deny this).
  3.  **Analyticity Prediction:** There is a class of truths (primary necessary) that are a priori but not metaphysically necessary. (Quineans deny this; Kripkeans accept it but explain it differently).

  **The Real Predictive Failure:** The view does not predict *which* sentences have coincident intensions better than rival theories of concepts. It classifies them after the fact. If a rival theory (e.g., a specific neuro-functional theory of concepts) predicts the coincidence/non-coincidence based on empirical data, and 2D just accommodates it, 2D is the weaker theory.

  ---

  ### The Concession List

  You asked for the parts you should concede as genuinely counting against you, not explain away. Be strict with yourself on these:

  1.  **Concede the Scrutability Tension:** You cannot claim primary intensions are fixed by *a priori* conditionals for *all* vocabulary if you deny Scrutability. You must concede that for vocabulary failing Scrutability, primary intensions are not a priori accessible. This weakens the link between Conceivability and Primary Possibility for that vocabulary.
  2.  **Concede Non-Fundamentality:** You must concede that the epistemic dimension is not more fundamental than the modal dimension. The definition of scenarios likely relies on modal coherence. You are offering a mapping, not a reduction.
  3.  **Concede Lack of Empirical Bite:** You must concede that the view, without the Scrutability and Phenomenal Coincidence theses, makes no unique empirical predictions. It is a classificatory framework, not a causal/explanatory theory of modality.
  4.  **Concede the Soames Point on Names:** For rigid designators, admit that the primary intension is not "descriptive meaning." It is a reference-fixing heuristic that may be trivial. Do not claim it captures the "cognitive significance" of names in a way that rivals direct reference theory unless you have a specific account of how the description *D* is grasped.
  5.  **Concede the Collapse of the Mind-Body Argument:** If the phenomenal coincidence thesis is undermined by a viable physicalist account of concepts, admit that your semantics provides no barrier to physicalism. The semantics is neutral; the anti-physicalism was a specific use-case that is now vulnerable.

  **Summary:** Your view is a robust *formal framework* but a fragile *philosophical theory*. The formalism (two intensions) can survive most attacks. The philosophical payload (apriority, conceivability as a guide to possibility, anti-materialism) relies on the specific theses you tried to decouple (Scrutability, Coincidence). If you keep the framework but drop the theses, you have a logic without a metaphysics. If you keep the theses, you inherit their vulnerabilities. You cannot have the load-bearing capacity of the theses without the weight of their objections.
