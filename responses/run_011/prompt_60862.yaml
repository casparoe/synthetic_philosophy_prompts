          *   Primary intension fixed by a priori conditional: "If D (canonical description of scenario) is the case, then S."
          *   Apriority = Primary Necessity (true at all scenarios).
          *   Modality (Metaphysical Necessity) = Secondary Intension.
          *   Necessary A Posteriori (NAP) is handled (contingent primary, necessary secondary).
          *   Conceivability $\rightarrow$ Primary Possibility $\rightarrow$ Epistemic Possibility.
          *   Bridge to Metaphysical Possibility: Only holds for phenomenal concepts (primary = secondary intensions).
          *   **Crucial Decoupling:** Separates 2D semantics from *Scrutability*. One can have primary intensions without claiming all truths are scrutable from a base.
