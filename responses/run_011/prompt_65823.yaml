prompt: |-
  I'm a novelist — literary historical fiction, mid-list, one book every four years if the gods are kind. I'm three years into a novel set in the decades of Britain that later grew the Arthur material, and my problem isn't the usual one (was he real, was he Artorius Castus, were there Sarmatian cavalry, all that) — it's that I keep having to decide, detail by detail, roughly two hundred times a draft, how much warrant a given piece of a legend actually carries, so I know whether I can put it in the narration as something that happened, whether it has to live only in a character's mouth as something believed, or whether I'm not allowed to touch it at all. What I want is a procedure I can run on one detail in ten minutes with a coffee going cold next to me, not an essay about the state of the question. No reading list, please — I genuinely can't chase one and I want the method rather than the footnotes; naming the actual early texts where it matters is fine and helpful.

  What I think it needs to sort on is how many hands a detail has passed through and what kind of thing tends to survive the passing, so build in both axes, because I fumble them constantly. Transmission: contemporary record / later writer with plausible access to something earlier / later writer who is visibly making things up / silence. And kind of detail: my understanding is that place names, objects, topography, the shape of a landscape survive oral transmission in ways that motives, speeches, causes and personal character simply don't — there's a reason people get excited about a piece of armour in epic that matches an artefact type far older than the poem, and a reason that excitement is usually overdone. It also has to catch the trap I fall into most, which is treating a poem as evidence for the world it describes rather than for the world that composed it. Give me named tiers, what each tier licenses me to do in prose, what to do when two layers flatly contradict each other, and what to do with pure silence, which is most of my material and which I dont have a good instinct for yet. Mark loudly the points where the procedure is really just my taste wearing a lab coat and I have to decide as a novelist rather then as a historian. One extra thing: I've been spooked by how easily this genre of book gets cited by cranks, so the procedure should flag when a detail is one that pseudohistory has already colonised, and tell me what an author's note can honestly claim without overclaiming and without pretending the novel is a documentary.

  Then run it on three cases and don't soften the third. One: a hero in the old northern British praise poetry — the Gododdin — gets measured against Arthur in passing, in a stanza that may or may not be an interpolation, in a poem dated anywhere from the seventh century to the eleventh and surviving in a thirteenth-century manuscript. What tier is that, and what can I actually do with it on the page? Two: a Hittite treaty with the ruler of a western Anatolian place-name that looks a lot like Troy, whose own name looks suspiciously like the second name the epic gives its prince. I want the procedure to spell out exactly why a name-match is not an event-match, and then say what, if anything, that document licenses a novelist to write. Three: the whole romance apparatus — Round Table, Lancelot, Grail, sword in the stone. I know roughly what the answer is going to be and I want it said bluntly, because I have sixty-odd pages already built on treating one of those as recovered tradition instead of as a late invention, and if the procedure says I have to dismantle them I'd much rather hear it this month than in a year. Finally: tell me how confident you are in the tiers themselves, which single step in the procedure you'd bet least on, and where you suspect you're importing a scholarly consensus that's really about Arthur specifically and stretching it over legends in general. I want the self-doubt attached to the deliverable, not buried in it.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Literary historical fiction novelist (mid-list, slow pace).
      *   **Project:** Novel set in Sub-Roman/Post-Roman Britain (the "Arthurian" period, decades before the legends coalesce).
      *   **Problem:** Decision fatigue regarding legendary details. Needs a quick, repeatable procedure (10 mins/coffee) to categorize details based on transmission reliability and detail type.
      *   **Constraints:** No reading lists, no essays on the "state of the question." Needs named tiers, specific prose licenses, handling of contradictions/silence, flags for pseudohistory colonization, and author's note advice.
      *   **Specific Tests:** Run the procedure on three cases (Gododdin stanza, Hittite treaty/Troy name match, Romance apparatus).
      *   **Meta-Requirement:** Include self-doubt/uncertainty about the procedure itself (where is it taste vs. method? where is it Arthur-specific bias?).
      *   **Tone:** Professional, direct, pragmatic, acknowledging the artistic struggle without coddling.

  2.  **Deconstruct the Core Problem:**
      *   The novelist is struggling with *ontological status* of details within the narrative. Is it fact? Belief? Forbidden?
      *   They correctly identify two axes: *Transmission* (how did it get here?) and *Detail Type* (what kind of information is it?).
      *   They need to avoid the "Poem as History" trap (confusing the world of composition with the world described).
      *   They need to avoid crank magnetism (pseudohistory).

  3.  **Drafting the Procedure (The "Filter"):**
      *   *Name:* Needs to sound functional. "The Transmission-Texture Filter" or "The Legend-Weight Protocol." Let's go with **The Legend-Weight Protocol**.
      *   *Axes:*
          1.  **Transmission Grade (T):** Source proximity and integrity.
          2.  **Detail Texture (D):** Hardness/Softness of the data (Names/Places vs. Motives/Dialogue).
      *   *Tiers:* Need clear labels and prose licenses.
          *   Tier 1: Ground (Fact/High Probability).
          *   Tier 2: Mist (Tradition/Belief).
          *   Tier 3: Mirage (Invention/Anachronism).
      *   *Handling Contradictions:* Priority rules.
      *   *Handling Silence:* The "Negative Space" rule.
      *   *Pseudohistory Flag:* A specific check for "too perfect" or "cult favorite" details.
      *   *Author's Note:* How to frame it.

  4.  **Refining the Tiers & Licenses:**
      *   *Tier 1 (Bedrock):* Contemporary/Near-contemporary evidence + Hard Texture. *License:* Narrate as fact.
      *   *Tier 2 (Folk-Memory):* Later source + Hard Texture OR Contemporary + Soft Texture. *License:* Narrate as rumor, reputation, or ambiguous action.
      *   *Tier 3 (Echo):* Late source + Soft Texture. *License:* Character belief only, or omit.
      *   *Tier 4 (Invention):* Known literary fabrication. *License:* Omit or explicitly frame as later myth (prolepsis).

      *Wait, let's simplify for the "10-minute coffee" constraint.*
      Let's use a Matrix approach.
      *   **Axis A: Provenance.** (A: Contemporary/Near, B: Centuries Later/Oral, C: Literary Fabrication).
      *   **Axis B: Substance.** (1: Topography/Names/Objects, 2: Events/Battles, 3: Motives/Speech/Relationships).
      *   **Output:** Green (Write as Fact), Yellow (Write as Reputation/Rumor), Red (Write as Myth/Don't Use).

      *Actually, the user asked for "Named Tiers." Let's stick to Tiers but define them by the intersection.*

      *Revised Tiers:*
      1.  **Iron:** Contemporary record + Hard Detail. (Write as fact).
      2.  **Bone:** Later record + Hard Detail OR Contemporary + Soft Detail. (Write as reported/ambiguous).
      3.  **Smoke:** Late record + Soft Detail. (Write as belief/superstition).
      4.  **Glass:** Known literary invention. (Do not use as history).

  5.  **Addressing the Specific Constraints:**
      *   *Contradictions:* Hard data beats soft data. Earlier data beats later data *unless* later data preserves a specific oral formula (rare).
      *   *Silence:* Silence is not negation. It is "Open Terrain." You can build there, but don't claim it's found.
      *   *Pseudohistory Flag:* If a detail is a favorite of "British Israelism" or "Holy Blood" types, flag it. If it relies on a single 12th-century source claiming ancient knowledge, flag it.
      *   *Self-Doubt:* Must be explicit. Where am I guessing?

  6.  **Running the Test Cases:**
      *   *Case 1: Gododdin Stanza.*
          *   Source: 7th-10th C (debated), Manuscript 13th C.
          *   Detail: "He was no Arthur."
          *   Analysis: Is it an interpolation? Likely. Is it contemporary to Arthur? No. It proves Arthur's *reputation* existed by the time of the stanza, not his deeds.
          *   Verdict: Smoke/Tier 3. Can't use for deeds. Can use for reputation.
      *   *Case 2: Hittite Treaty (Wilusa/Alexandros).*
          *   Source: c. 1280 BCE.
          *   Detail: Name match (Wilusa/Ilios, Alaksandu/Alexandros).
          *   Analysis: Hard Detail (Names) but huge time gap to Homer. Proves a place and a name existed, not the *events* of the Iliad.
          *   Verdict: Bone/Tier 2 for names/place. Glass/Tier 4 for the war story.
      *   *Case 3: Romance Apparatus (Round Table, Grail, etc.).*
          *   Source: 12th C+ (Wace, Chretien, Malory).
          *   Detail: Magic swords, holy cups.
          *   Analysis: Literary invention for courtly audiences.
          *   Verdict: Glass/Tier 4.
          *   *Hard Truth:* Dismantle the 60 pages if writing historical fiction. If writing mythic fiction, keep but frame differently.

  7.  **Drafting the Content (Iterative refinement for tone):**
      *   *Tone:* Collegial, sharp, no nonsense. Acknowledge the pain of the draft.
      *   *Structure:*
          1.  The Protocol (The Matrix).
          2.  The Decision Tree (Contradictions/Silence).
          3.  The Crank Filter.
          4.  The Test Cases.
          5.  The Self-Doubt/Meta-Analysis.

      *Refining the "Self-Doubt" section:* This is crucial. I need to admit that "Hard vs. Soft" detail is itself a heuristic that sometimes fails (e.g., a place name can be mythic, a motive can be psychologically universal). I need to admit that "Arthur" is a black hole that distorts all nearby data.

      *Refining the "Author's Note":* Be honest. "This novel occupies the silence between the records."

  8.  **Final Review against User Prompt:**
      *   10-minute procedure? Yes, keep it checklist-style.
      *   No reading list? Checked.
      *   Named tiers? Yes (Iron, Bone, Smoke, Glass).
      *   Prose licenses? Yes.
      *   Contradictions/Silence? Yes.
      *   Pseudohistory flag? Yes.
      *   Three cases (Gododdin, Hittite, Romance)? Yes.
      *   Self-doubt included? Yes.
      *   "Don't soften the third"? Will be blunt about the Romance material.

  9.  **Final Polish:** Check the voice. Ensure it sounds like it's written for a writer, not a student. Use metaphors of construction/archaeology. (Self-Correction: Make sure the distinction between "World Described" and "World Composed" is central to the protocol).

  *(Self-Correction during drafting Case 1)*: Be careful with *Gododdin*. It's not just "maybe interpolation." It's that even if authentic, it compares a warrior to Arthur. It establishes Arthur as a *benchmark*, not a biography.
  *(Self-Correction during drafting Case 3)*: The user has 60 pages. Telling them to cut is painful. I need to offer the *narrative cost* of keeping it. If they keep it, they shift genre from Historical to Mythic. They need to know that trade-off.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the **Legend-Weight Protocol**. It is designed to be printed or copied to a single sheet. It forces a binary decision on the ontological status of a detail before you write the sentence.

  ### The Protocol: Two Axes, Four Tiers

  **Axis 1: Provenance (The Handoff)**
  *   **P1 (Contemporary/Near):** Inscriptions, coins, contemporary chronicles, archaeology dated to within 50 years of the event.
  *   **P2 (Tradition):** Later writers claiming oral access, genealogies, praise poetry (e.g., *Gododdin*), place-name fossils.
  *   **P3 (Literary):** Texts visibly composed for entertainment, theology, or political legitimation >200 years post-event (e.g., Geoffrey of Monmouth, Malory).

  **Axis 2: Texture (The Detail)**
  *   **T1 (Hard):** Topography, place-names, object typologies (sword hilt shapes), climate data, disease vectors. (Things that stick because they are physical).
  *   **T2 (Event):** Battles, sieges, movements of armies, deaths. (Things that stick because they are traumatic).
  *   **T3 (Soft):** Motives, speeches, private conversations, specific romantic pairings, religious motivations. (Things that rot instantly in oral transmission).

  **The Matrix (Run the detail here)**

  | | **T1 (Hard)** | **T2 (Event)** | **T3 (Soft)** |
  | :--- | :--- | :--- | :--- |
  | **P1 (Contemporary)** | **TIER 1: IRON** | **TIER 2: BONE** | **TIER 3: SMOKE** |
  | **P2 (Tradition)** | **TIER 2: BONE** | **TIER 3: SMOKE** | **TIER 4: GLASS** |
  | **P3 (Literary)** | **TIER 3: SMOKE** | **TIER 4: GLASS** | **TIER 4: GLASS** |

  ---

  ### The Tiers: Prose Licenses

  **TIER 1: IRON**
  *   **Status:** Fact.
  *   **Prose License:** Narrate as objective reality. "The wall was stone." "The fort burned."
  *   **Author's Note:** Can be cited as historical consensus.

  **TIER 2: BONE**
  *   **Status:** Probable / Disputed Fact.
  *   **Prose License:** Narrate as action, but avoid internal motive. You can have the battle happen, but you cannot know *why* the general ordered the charge unless you invent it. Use sensory ambiguity ("The smoke rose from the valley," not "The valley was destroyed").
  *   **Author's Note:** "The record suggests X, though details are lost."

  **TIER 3: SMOKE**
  *   **Status:** Reputation / Belief.
  *   **Prose License:** Must exist in a character's mouth or mind. "They said he was..." "It was believed that..." You cannot narrate it as the narrator's truth. It is the *myth of the character*, not the *character*.
  *   **Author's Note:** "This reflects the legends that grew around the figure, not necessarily the figure himself."

  **TIER 4: GLASS**
  *   **Status:** Invention / Anachronism.
  *   **Prose License:** **Do not use** in historical fiction. If used, it must be framed as a deliberate anachronism or a dream sequence. It shifts the book from Historical to Mythic Fiction.
  *   **Author's Note:** Must acknowledge this is a later literary addition.

  ---

  ### Decision Rules

  **1. Contradictions (When Tier 1 clashes with Tier 2)**
  *   **Rule:** Hard Texture beats Soft Texture. Early Provenance beats Late Provenance.
  *   **Exception:** If the Late Provenance preserves a specific *formulaic phrase* in the original language (e.g., a specific kenning in Welsh), it may preserve a T1 Hard Detail inside a P3 source. Extract the noun, discard the verb.
  *   **Novelist's Fix:** If two sources contradict on a T2 Event, choose the one that serves the theme, but downgrade the Tier to **Smoke**. Let the characters be unsure.

  **2. Silence (The "Negative Space")**
  *   **Rule:** Silence is not evidence of absence. It is **Open Terrain**.
  *   **License:** You may invent freely in Open Terrain, but you cannot claim the invention is "based on a little-known source."
  *   **Constraint:** Your invention must not violate Tier 1 Iron (e.g., you can invent a dinner menu, but not if potatoes are the main course).
  *   **Author's Note:** "Where the records are silent, I have imagined."

  **3. The Crank Filter (Pseudohistory Flag)**
  *   **Trigger:** If a detail relies on a single source that claims "ancient knowledge" lost to everyone else (e.g., Iolo Morganwg), OR if the detail is a favorite of "Lost Tribe" / "Holy Blood" / "Pre-Columbian Contact" theories.
  *   **Action:** Automatic downgrade one Tier. If it is already Glass, it is **Toxic Glass**.
  *   **Author's Note:** Do not defend it. Acknowledge it is a fringe theory or omit. If you keep it, state: "This novel explores the possibility of X, though mainstream history rejects it."

  **4. The World Trap**
  *   **Check:** Am I using a poem to describe the *world of the hero* or the *world of the poet*?
  *   **Rule:** A 12th-century romance describes 12th-century castles, not 6th-century forts. A 7th-century poem describes 7th-century kingship, not 5th-century warbands.
  *   **Correction:** Strip the detail of its social context. Keep the object, lose the ceremony.

  ---

  ### The Test Cases

  **Case 1: The *Gododdin* Stanza (Y Gododdin)**
  *   **Detail:** A warrior is praised as "no Arthur."
  *   **Provenance:** Poem dates 7th–10th C (P2). Manuscript 13th C. Stanza authenticity debated (possible interpolation).
  *   **Texture:** Comparison of reputation (T3 Soft).
  *   **Matrix:** P2 + T3 = **TIER 3: SMOKE**.
  *   **Verdict:** You cannot use this to prove Arthur existed, nor what he did. You *can* use it to prove that by the 7th century, "Arthur" was a byword for martial excellence.
  *   **On the Page:** Do not have Arthur do the deed in the stanza. Have your characters hear the song. "They sing of a man named Arthur, though I have never seen him."
  *   **Crank Flag:** Low. This is standard scholarship.
  *   **Author's Note:** "The name Arthur appears in early Welsh poetry as a benchmark of heroism, though the man remains shadowed."

  **Case 2: The Hittite Treaty (Wilusa / Alaksandu)**
  *   **Detail:** Treaty c. 1280 BCE mentions King Alaksandu of Wilusa.
  *   **Provenance:** Contemporary cuneiform (P1).
  *   **Texture:** Names/Place (T1 Hard).
  *   **Matrix:** P1 + T1 = **TIER 1: IRON** (for the names).
  *   **The Trap:** You want to write the *Iliad* events. The treaty proves a place and a name existed, not a war over a woman, not Achilles, not a wooden horse. Name-match is not Event-match.
  *   **Verdict:** You may name your city Wilusa. You may name your prince Alaksandu. You **cannot** write the Trojan War as Homer tells it.
  *   **On the Page:** "The Hittites call this place Wilusa." (Fact). "Paris stole Helen." (Glass).
  *   **Author's Note:** "Place-names align with Hittite records, but the epic events are later Greek memory."

  **Case 3: The Romance Apparatus (Round Table, Grail, Lancelot)**
  *   **Detail:** Chivalric court, holy cup, magical sword in stone.
  *   **Provenance:** 12th Century+ (Wace, Chrétien, Malory). (P3).
  *   **Texture:** Objects/Events (T1/T2).
  *   **Matrix:** P3 + T1/T2 = **TIER 4: GLASS**.
  *   **Verdict:** **Dismantle the sixty pages.** These are 12th-century French feudal projections onto a 6th-century British warlord context. They are historically impossible in a Sub-Roman setting. The Round Table is a metaphor for equality invented for Henry II's court. The Grail is a Eucharistic vessel.
  *   **Hard Truth:** If you keep these, you are not writing Literary Historical Fiction. You are writing Secondary World Fantasy or Mythic Fiction. You cannot have it both ways without breaking the reader's trust.
  *   **On the Page:** If you must keep them, they must be mundane. A round table is just a table. A grail is just a bowl. Strip the magic.
  *   **Author's Note:** "The legends of the Grail and Table are later additions; here they are rendered as they might have appeared in the dark of the age: ordinary objects awaiting myth."

  ---

  ### Self-Doubt & Limitations (The Meta-Check)

  You asked where I am guessing. Here is the confession:

  1.  **Confidence in the Tiers:** I am 85% confident in the **Iron/Glass** poles. I am 50% confident in the **Bone/Smoke** middle. The distinction between "Tradition" (P2) and "Literary" (P3) is often a scholarly fight, not a fact. *Gododdin* could be P1 or P3 depending on which academic you ask.
      *   *Risk:* You will spend your ten minutes arguing with the Protocol about the Provenance grade. **Rule:** If you argue for more than two minutes, default to the lower Tier. It is safer to underclaim than overclaim.

  2.  **The "Hard Detail" Bias:** The Protocol assumes Topography (T1) survives better than Motive (T3). This is usually true, but not always. Place names can be mythic (e.g., "Giant's Grave"). A psychological motive (fear of betrayal) is universal and may be *more* historically accurate than a disputed border marker.
      *   *Risk:* Do not treat T1 as "Truth" and T3 as "Lie." T1 is "Verifiable," T3 is "Unverifiable." A lie can be T1. A truth can be T3.

  3.  **The Arthur Distortion:** This procedure is built on general historiography, but Arthur is a black hole. The gravitational pull of the legend bends the "Provenance" axis. Sources that would be dismissed as P3 for any other figure are often treated as P2 for Arthur because we are desperate for data.
      *   *Risk:* I may be applying a stricter standard to Arthur than a novelist working on, say, Alfred the Great would need. But given your fear of cranks, strictness is the correct default.

  4.  **The "Taste in a Lab Coat" Point:** The decision to treat **Silence** as "Open Terrain" for invention is purely a novelist's choice, not a historian's. A historian leaves the gap. A novelist fills it. The Protocol tells you *how* to fill it (don't claim it's Iron), but it cannot tell you *what* to put there. That is your art. Do not look for a historical warrant for your themes.

  **Final Instruction:**
  When the coffee is cold, pick the detail. Assign P (1-3). Assign T (1-3). Find the Tier. Write the sentence allowed by the Tier. If you feel resistance, it is because you want to write a Tier higher than the evidence allows. **Obey the Tier.** It will save you a rewrite in year four.
