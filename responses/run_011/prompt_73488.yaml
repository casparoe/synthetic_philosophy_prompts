answer: |-
  # Graduate Seminar in Epistemology: Final Examination
  **Time Allowed:** 60 Minutes
  **Total Marks:** 25

  **Question 1**

  Consider a subject $S$ and a condition $C$ (e.g., *S's hand is steady*). Let there be a finite series of consecutive times $t_0, t_1, \dots, t_n$.
  1.  $C$ obtains at $t_0$.
  2.  $C$ does not obtain at $t_n$.
  3.  For any $i < n$, the case at $t_i$ is indiscriminable from the case at $t_{i+1}$ for $S$ regarding whether $C$ obtains.

  **Definitions:**
  *   **Luminosity:** $C$ is luminous iff for every $t$ in the series, if $C$ obtains at $t$, then $S$ knows at $t$ that $C$ obtains at $t$.
  *   **Margin-for-Error (MfE):** For any $i < n$, if $S$ knows at $t_i$ that $C$ obtains at $t_i$, then $C$ obtains at $t_{i+1}$.

  (a) Derive a contradiction from the assumption that $C$ is luminous, given the case stipulations and the MfE principle. State which premise a defender of luminosity should surrender and briefly justify why this is the costly concession. (10 marks)

  (b) Determine whether this same argumentative structure can be run on the condition $C^*$: *S knows at $t_i$ that $C$ obtains at $t_i$*, so as to refute the KK principle (that if $S$ knows $p$, $S$ knows that $S$ knows $p$). If the argument succeeds, explain the parallel. If it cannot be run, identify precisely which premise fails to transfer to $C^*$ and what feature of the case blocks the transfer. (10 marks)

  (c) State the strongest argument against the KK principle that does **not** depend on the anti-luminosity argument or margin-for-error principles. Assess whether this argument succeeds. (5 marks)

  ***

  # Model Answer

  **(a) Derivation and Premise Surrender**
  Assume $C$ is luminous. At $t_0$, $C$ obtains (by stipulation 1). By Luminosity, $S$ knows at $t_0$ that $C$ obtains at $t_0$. By the MfE principle, if $S$ knows at $t_0$ that $C(t_0)$, then $C$ obtains at $t_1$. Thus, $C(t_1)$. By Luminosity again, $S$ knows at $t_1$ that $C(t_1)$. By MfE, $C(t_2)$. Iterating this reasoning through the series, we derive that $C$ obtains at $t_n$. However, by stipulation 2, $C$ does not obtain at $t_n$. This is a contradiction.

  To resolve this, a defender of luminosity must surrender either the Luminosity claim, the MfE principle, or the indiscriminability premise. The standard Williamsonian move is to surrender Luminosity. However, a friend of luminosity (e.g., an internalist) typically surrenders the MfE principle. They argue that knowledge does not require a safety margin extending into neighboring cases where the condition might fail; rather, knowledge is grounded in present phenomenology which is self-intimating. Surrendering MfE is costly because it severs the link between knowledge and safety/reliability, implying $S$ could know $C$ obtains even in a case infinitesimally close to one where $C$ fails and $S$ believes it obtains. This makes knowledge appear too easy and disconnected from truth-conduciveness.

  **(b) Application to KK**
  The same argumentative structure can be run to refute KK. Let $C^*$ be the condition *S knows at $t$ that $C$ obtains at $t$*. The KK principle asserts $C^*$ is luminous (if $C^*$ obtains, $S$ knows $C^*$). We assume the same series where $C$ fades from known to unknown. If $S$ knows $C$ at $t_0$ but fails to know $C$ at $t_n$ (due to the failure of $C$ or loss of justification), we can construct a sorites for $C^*$.

  The MfE principle for $C^*$ would read: If $S$ knows at $t_i$ that ($S$ knows $C$ at $t_i$), then ($S$ knows $C$ at $t_{i+1}$). This is plausible given that knowledge requires safety; if one is in a position to know one knows, the environment must be stable enough that one still knows in the next moment. The contradiction arises if we assume KK (Luminosity of $C^*$). To avoid contradiction, we must deny KK. The premise that fails to hold is the Luminosity of $C^*$. The feature blocking the transfer of truth is that the epistemic position required for $K(C)$ is not itself phenomenally manifest. While $C$ (e.g., feeling cold) might seem luminous to the subject, the status of *knowing* $C$ depends on external factors (reliability) that can shift without the subject's immediate awareness. Thus, one can know $C$ without knowing that one knows $C$, because the margin for error required for the second-order knowledge is wider than for the first-order knowledge.

  **(c) Independent Argument Against KK**
  The strongest independent argument against KK relies on **Externalism**. If knowledge is defined by external conditions (e.g., reliable causation or proper function) rather than internal justification, a subject can satisfy the conditions for $K(p)$ without possessing the internal access required for $K(K(p))$. For example, a chicken sexer may reliably know the sex of a chick via visual processing they do not understand. They know $p$, but they lack the justification to believe they know $p$, as they cannot distinguish their reliable state from a guess.

  This argument succeeds if externalism is true. It demonstrates that KK imposes an internalist constraint (access to one's epistemic status) that is incompatible with externalist accounts of knowledge. However, it fails to persuade internalists who define knowledge as justified true belief where justification is internally accessible. For them, if justification is accessible, one can usually reflect on it to achieve KK. Thus, the argument's success is contingent on the prior acceptance of epistemic externalism.

  ***

  # Marking Scheme

  **Total: 25 Marks**

  **Part (a): Derivation and Premise Analysis (10 Marks)**
  *   **Derivation (5 marks):**
      *   1 mark: Correctly states $C(t_0)$ and applies Luminosity to get $K(C(t_0))$.
      *   2 marks: Correctly applies MfE to slide from $t_i$ to $t_{i+1}$ (showing the iterative step).
      *   2 marks: Identifies the contradiction with $\neg C(t_n)$.
  *   **Premise Surrender (3 marks):**
      *   1 mark: Identifies MfE or Luminosity as the target.
      *   2 marks: Justifies *why* the friend of luminosity surrenders MfE (to save self-intimation) OR why Williamson surrenders Luminosity (to save Safety).
  *   **Cost Assessment (2 marks):**
      *   2 marks: Explains the cost (e.g., severing knowledge from safety, or denying privileged access).
      *   1 mark: Vague statement of cost.

  **Part (b): KK Application (10 Marks)**
  *   **Verdict (2 marks):**
      *   2 marks: Correctly identifies that the argument *can* be run to refute KK (Williamsonian line).
      *   0 marks: Claims it cannot be run without strong justification.
  *   **Parallel Analysis (5 marks):**
      *   3 marks: Correctly formulates the MfE for $C^*$ (Knowledge of Knowledge).
      *   2 marks: Identifies that KK is the analogue of Luminosity here and is the premise rejected.
  *   **Feature Identification (3 marks):**
      *   3 marks: Identifies that epistemic status depends on external factors/stability not phenomenally manifest (wider margin for error for meta-knowledge).
      *   1 mark: Merely states "knowledge is different."

  **Part (c): Independent Argument (5 Marks)**
  *   **Argument Statement (3 marks):**
      *   3 marks: Clearly states an Externalist/Reliabilist argument (e.g., Chicken Sexer, Animal Knowledge).
      *   1 mark: Vague reference to "Gettier" or "Externalism" without example.
  *   **Assessment (2 marks):**
      *   2 marks: Nuanced assessment (e.g., "Succeeds given externalism, fails for internalists").
      *   1 mark: One-sided assessment.

  **Major Errors (Deductions)**
  *   **-5 Marks:** Confusing the time of knowing with the time of content in the MfE application (e.g., treating $K(C_i) \to C_i$ rather than $C_{i+1}$).
  *   **-5 Marks:** Claiming the contradiction proves $C$ is luminous (logical inversion).
  *   **-3 Marks:** In Part (b), claiming KK is true without addressing the margin-for-error constraint.

  **Grading Bands**
  *   **A (20-25):** Precise logical derivation in (a); recognizes the Williamsonian generalization in (b) with clear distinction between first and second-order margins; nuanced assessment in (c).
  *   **B (15-19):** Correct derivation; identifies KK is refuted but vague on *why* the margin shifts; standard externalist argument in (c) without nuance.
  *   **C (10-14):** Derivation has gaps; struggles with Part (b) (claims argument fails); Part (c) irrelevant or incorrect.
  *   **D/F (<10):** Fundamental misunderstanding of Luminosity or MfE.
