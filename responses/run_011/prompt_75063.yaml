answer: |-
  # DIAGNOSTIC: THE MU-PUZZLE DECISION TREE
  **Instructions:** Trace the path that matches what you *did* at the blackboard. Do not select the path that matches the philosophy you *wish* you held.

  1.  **Did you write the string `MU` on the board as a derived theorem?**
      *   **Yes:** Go to Leaf A.
      *   **No:** Go to Question 2.

  2.  **Why did you stop deriving strings?**
      *   **"I ran out of time/patience":** Go to Leaf B.
      *   **"I became convinced it was impossible":** Go to Question 3.

  3.  **How did you justify that impossibility?**
      *   **"I found a property the strings have (e.g., counting I's)":** Go to Question 4 (Vertical Track).
      *   **"I decided the rules were the problem":** Go to Question 5 (Lateral Track).

  4.  **(Vertical) Do you claim a computer could be programmed to find this property?**
      *   **Yes:** Go to Question 6.
      *   **No:** Go to Leaf C.

  5.  **(Lateral) Why change the rules?**
      *   **"To make the goal achievable (fix the system)":** Go to Leaf D.
      *   **"Because rule-following is inherently flexible (dissolve the system)":** Go to Leaf E.

  6.  **(Vertical/Computable) Does finding this property make the puzzle a trivial arithmetic problem?**
      *   **Yes:** Go to Leaf F.
      *   **No:** Go to Leaf G.

  7.  **(Lateral/Fix) Did you propose a specific meta-rule for changing rules, or just change them ad hoc?**
      *   **Specific Meta-Rule:** Go to Leaf H.
      *   **Ad Hoc:** Go to Leaf I.

  ---

  ### LEAVES & POSITIONS

  **Leaf A: The Rule-Breaker (Unnamed)**
  *   *Commitment:* You claim to have solved a formal puzzle by ignoring the form, treating the axiom system as a suggestion rather than a constraint.

  **Leaf B: The Empiricist (Unnamed)**
  *   *Commitment:* You treat a finite failure to derive as evidence of infinite impossibility, conflating "I didn't find it" with "It isn't there."

  **Leaf C: The Gödelian Anti-Mechanist**
  *   *Commitment:* You claim human insight perceives truths (invariants) that are in principle inaccessible to any mechanical procedure operating on the same symbols.

  **Leaf D: The Engineer (Unnamed)**
  *   *Commitment:* You view formal systems as buggy software that should be patched when they fail to produce desired outputs, rather than as definitions of truth.

  **Leaf E: The Wittgensteinian**
  *   *Commitment:* You deny there is a rigid "outside" to jump to; meaning is found in the fluid use of the rules, not in adherence to a static constraint.

  **Leaf F: The Deflationist**
  *   *Commitment:* You reduce the "mystery" of the puzzle to simple number theory, arguing that "jumping out" is just doing math instead of string manipulation.

  **Leaf G: The Platonist**
  *   *Commitment:* You believe the invariant exists as a mathematical truth independent of both the string system and the machine checking it.

  **Leaf H: The Self-Modifying System**
  *   *Commitment:* You claim a machine can "jump out" by rewriting its own code, treating the rewrite as a Lateral move when it is actually a Vertical meta-rule.

  **Leaf I: The Pragmatist (Unnamed)**
  *   *Commitment:* You admit to changing rules arbitrarily to get the job done, accepting that you are no longer solving the MU-puzzle but a different one.

  ---

  ### DIAGNOSTIC NOTES FOR THE TA

  **1. Empty/Unstable Slots**
  *   **Leaf I (The Pragmatist) is likely empty.** Students rarely admit to *ad hoc* rule-breaking without trying to justify it as "Engineer" (Leaf D) or "Wittgensteinian" (Leaf E). It is unstable because it offers no philosophical cover for the cheating; it is pure instrumentalism without a theory.
  *   **Leaf G (The Platonist) is unstable here.** In the context of the MU-puzzle, it is difficult to separate the Platonist from the Gödelian Anti-Mechanist (Leaf C). If the invariant is non-computable (Q6-No), it usually implies a special human faculty (Leaf C). A Platonist who denies the human faculty but insists on non-computable truths has nowhere to stand in this specific puzzle context.

  **2. Indistinguishable Leaves**
  *   **Leaf F (Deflationist) and Leaf H (Self-Modifying System) may collapse.** If the "specific meta-rule" in Leaf H is computable, the Self-Modifying System is just a Deflationist machine. The tree fails to separate "rewriting rules via algorithm" from "computing invariants via algorithm." Both are Vertical jumps disguised as Lateral ones.
  *   **Rigorous Proof vs. Strong Hunch:** The tree fails to separate the student who *proved* $2^k \not\equiv 0 \pmod 3$ from the student who just noticed "hey, no multiples of 3." Both land on Question 4. One has done meta-mathematics; the other has done pattern recognition. The handout treats them identically.

  **3. The Self-Rewriting Program (Leaf H)**
  *   **Classification:** This is a **Vertical Jump**.
  *   **Diagnosis:** Students often describe a program rewriting its own code as a "Lateral" escape (breaking the rules). However, if the rewriting is governed by a super-rule (a learning algorithm), the program has not left the system; it has merely ascended to a higher level within a larger system. It is a Vertical jump that *looks* Lateral.

  ---

  ### POST-TREE ANALYSIS: THE VERTICAL/LATERAL DISTINCTION

  **Does the distinction survive contact with the tree?**
  Barely. The tree exposes that "Vertical" and "Lateral" are not stable categories of action, but descriptions of how the student *frames* their action.

  **The Case of the Mumbling Student**
  The student muttering *"I keep getting 1, 2, 4, 5, 8 and never a multiple of three"* is **not jumping**.
  *   **Vertical?** No, because they haven't formalized the invariant into a meta-theory; they are just observing data.
  *   **Lateral?** No, they haven't changed the rules.
  *   **Reality:** They are engaging in **decent problem-solving inside one enormous system that nobody ever left.**

  **What work is the word "System" doing?**
  On this handout, "System" is a **pedagogical fiction**.
  *   If "System" means *only* the four MIU rules, then counting I's is Vertical (outside the rules).
  *   If "System" means *all logical operations available to the student*, then counting I's is Internal (just another rule).
  *   **The Verdict:** You have been selling the students a distinction that relies on an arbitrary boundary. The "Vertical Jump" is only a jump if you draw the circle tightly around the object-level rules. If you draw the circle around "rational inquiry," there is no outside. The distinction buys you **rhetorical drama**, not ontological clarity. It allows you to call meta-mathematics "insight" and rule-breaking "creativity," but logically, both are just operations within a larger formal space. Use the distinction to teach them about levels of abstraction, but warn them that "jumping out of the system" is just "entering a bigger system."
