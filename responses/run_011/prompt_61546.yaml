      *   *Corporate Services:* Legal/Accounting compliance = Unlimited/Allowed (if regular staff). Other corporate help = Banned.

  3.  **Identify Implicit Theories (The "Candidate" Theories):**
      *   *Theory A: The Quid Pro Quo / Obligation Model.* Corruption exists only when there's a transaction between *two distinct parties* creating a debt.
          *   *Fits:* Self-finance (no debt to others), Volunteer labor (no payment, no debt).
          *   *Breaks:* Employer paying volunteer (why is this corrupting if the volunteer isn't getting the money? Ah, because the employer is buying influence). Dependence on wealthy self (candidate isn't dependent, but the system might be distorted).
      *   *Theory B: The Commercialization / Market Model.* Politics should remain separate from commercial exchange. If money changes hands for political value, it's suspect. If it's "civic participation," it's safe.
          *   *Fits:* Volunteer exemption (civic act), Self-finance (personal right).
          *   *Breaks:* Why is corporate legal help okay? Why is employer-paid volunteer time "commercial"?
      *   *Theory C: The Administrative / Valuation Model.* We regulate what is easy to count and trace.
