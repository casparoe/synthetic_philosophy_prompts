answer: |-
  Here is a reconstruction of the implicit theories, administrative residues, and counterfactual implications of the compliance patterns you describe.

  ### I. Implicit Theories: What the Practice Requires vs. Fits

  The pattern you describe is not driven by a single conception of corruption but by the uneasy layering of three distinct theoretical frameworks. Each explains a subset of the rules, but each fractures when applied to the whole.

  **1. The Bilateral Obligation Theory (Quid Pro Quo)**
  *   **The Conception:** Corruption is a transactional debt between two distinct legal persons. It requires a giver who expects a return and a receiver who owes gratitude.
  *   **What it Explains:** This is the primary engine of the self-finance rule. A candidate spending their own money incurs no debt to another person; therefore, no *quid pro quo* is possible. It also explains why a friend's money is capped (creates a debt) while the candidate's is not. It explains the employer-paid volunteer rule: the volunteer incurs no debt, but the *employer* is purchasing influence on behalf of the employee, creating a corporate-to-candidate obligation.
  *   **Where it Breaks:** It cannot account for systemic dependence. A self-financing candidate is dependent on their wealth class and the interests that align with it, even if they owe no specific individual. It also struggles with the corporate compliance exemption: if corporations cannot contribute because they might corrupt, why is furnishing legal staff to ensure compliance safe? (Unless one argues compliance prevents corruption, making the service meta-political).

  **2. The Commodification Boundary (Civic vs. Commercial)**
  *   **The Conception:** Politics is a sphere of civic participation that becomes corrupt when subjected to commercial valuation. "Money" is corrupting; "effort" is democratic.
  *   **What it Explains:** This drives the volunteer exemption. Unpaid labor is an expression of citizenship, not a market transaction. It is unpriced, so it is not a contribution. It explains why online activity is free but purchasing ads is capped.
  *   **Where it Breaks:** The employer-paid volunteer rule. If the labor is identical, why does the source of the volunteer's sustenance change the nature of the act from "civic" to "commercial"? This theory suggests the labor itself should always be free, but the law says the labor is tainted if it is subsidized by capital (the salary). Furthermore, self-finance shatters this: the candidate's money is highly commercial, liquid capital, yet it is treated as a protected right rather than a corrupting commodity.

  **3. The Administrative Feasibility Theory (Valuation and Traceability)**
  *   **The Conception:** Regulation can only attach to assets that are liquid, fungible, and easily valued.
  *   **What it Explains:** This is the pragmatic glue. We regulate cash because it is countable. We exempt most volunteers because valuing every hour of phone banking is administratively impossible and chills participation. We allow corporate compliance staff because distinguishing "regular staff" from "hired consultants" is a bright line that prevents endless auditing of billable hours.
  *   **Where it Breaks:** We *do* value in-kind services when an employer pays a volunteer. The FEC has formulas for this. So valuation is possible; it is merely selectively applied. This suggests administrative convenience is a sufficient condition for exemption, but not a necessary one.

  **Ruled Out vs. Required**
  *   **Ruled Out:** **Equality of Political Voice.** The rules explicitly reject this. The self-finance provision ensures that wealth translates directly into political volume. The volunteer exemption allows those with leisure time (unpaid labor) to out-spend those who must work for wages.
  *   **Comfortably Fits:** **Unequal Access and Official Gratitude.** The Bilateral Obligation theory fits the disclosure and cap regime perfectly. The law is designed to ensure that if a candidate owes someone, the public knows who it is.
  *   **Strictly Required:** **The Distinction Between Capital and Exertion.** The law *requires* a metaphysical distinction between money (which can corrupt) and personal effort (which cannot), unless that effort is monetized by a third party.

  ### II. The Residual: Philosophy vs. Bookkeeping

  You suspect most of this is bookkeeping convenience. You are largely correct, but there is a specific philosophical residue that survives the administrative explanation.

  **The Philosophy-Free Zone**
  A significant portion of the pattern is indeed accreted administrative defense. The volunteer exemption exists primarily because enforcing it would require a surveillance state capable of monitoring every citizen's hours. The corporate compliance exemption exists because committees *must* exist legally, and preventing them from accessing basic legal infrastructure would render the law unworkable. The "regular staff" distinction is a proxy for "no new money spent," which is easy to audit on a payroll ledger. These are safety valves to prevent the regulatory regime from collapsing under its own weight.

  **The Philosophical Residue**
  However, administrative difficulty does not fully explain the **employer-paid volunteer** rule. If this were purely about bookkeeping, the law could simply say "All volunteer labor is exempt, regardless of salary status." The fact that the law *chooses* to value those hours implies a judgment: **Capital subsidizing political labor is corrupting; personal time subsidizing political labor is not.**

  This leaves a residue of **Anti-Commodification**. The law tolerates inequality derived from personal sacrifice (time), but it fears inequality derived from the deployment of existing capital (salary). It assumes that money sitting in a bank account is more dangerous than money earned as salary, even though both are economic resources.

  **The Live Incoherence**
  You asked if the volunteer exemption depends on a rationale the doctrine forbids. **Yes.**
  The Court has ruled that equalizing voices is not a legitimate government interest. Yet, the volunteer exemption functions as a massive equalizer. It allows a candidate with a passionate, unpaid base to compete against a candidate with a wealthy donor base. It validates "sweat equity" as a counterweight to "financial equity."
  *   **Is this a distinction without a difference?** No, it is a live incoherence. The doctrine claims to protect "speech" (which favors the wealthy who can amplify it), but the regulations carve out a "participation" zone (volunteering) that functions on an egalitarian logic. The law protects the *right* to speak with money (self-finance/donors) while exempting the *act* of speaking with labor (volunteering) from the limits applied to money. It creates a two-tiered system of political expression: one tier regulated by anti-corruption principles (money), and one tier regulated by democratic participation principles (labor), without admitting that these principles conflict.

  ### III. The Replacement Scenario

  If we replaced the current "Bilateral Obligation" framework with a **Dependence-Based** or **Voice-Equalizing** framework, the rules you manage would undergo radical surgery.

  **1. Under a Strict Dependence Model**
  *   **Self-Finance:** Would face a ceiling. If the goal is to prevent candidates from being dependent on *wealth* (even their own) to win, personal funds would be capped at a level sufficient for a baseline campaign.
  *   **Volunteer Hours:** Would likely remain exempt *unless* they created dependence. However, **employer-paid volunteer time** would likely be banned entirely, not just capped. If a corporation pays you to campaign, you are dependent on that corporation for your livelihood while campaigning.
  *   **Disclosure:** Would attach to unpaid labor. To measure dependence, the public would need to know if a candidate is relying on a surge of labor from a specific union, corporation, or demographic.
  *   **Coordination:** The line would hold but tighten. If the goal is preventing dependence on outside wealth, "independent" expenditures that dwarf the candidate's own spending would be treated as creating systemic dependence, triggering coordination rules.

  **2. Under a Voice-Equalizing Model**
  *   **Volunteer Hours:** Would be valued and capped. If the goal is equal voice, a candidate with 1,000 unpaid interns has an unfair advantage over a candidate with 0. The commercial value of those hours would be calculated and added to the campaign's spending limit.
  *   **Self-Finance:** Would be strictly capped or banned. Wealth should not determine volume.
  *   **Employer Salary:** Would be treated as a contribution from the employer regardless of the work performed. The mere fact of continued salary creates an unequal platform.
  *   **Coordination:** Would collapse. Outside groups spending without limit would be merged into the candidate's limit, as the source of the voice matters less than the total volume of the voice.

  ### IV. The Hardest Feature to Swallow

  The single feature of the current pattern that is hardest for any coherent account to swallow is **the unlimited self-finance exemption.**

  Every other distinction in the code can be rationalized by some combination of administrative ease, bilateral obligation, or the labor/capital divide. But the self-finance rule explicitly validates the one thing all theories of corruption claim to fear: the dominance of concentrated wealth in the political sphere.

  *   **Against the Bilateral Theory:** It allows a candidate to be "bought" by themselves, which creates a representative who is beholden to the interests of the ultra-wealthy class by virtue of membership, not debt.
  *   **Against the Dependence Theory:** It allows a candidate to be entirely dependent on private wealth rather than public support, which the Court claims is the very evil limits are meant to cure.
  *   **Against the Commodification Theory:** It treats the candidate's bank account as a vessel of "speech" rather than "capital," even though it purchases the exact same commodities (ads, staff, travel) as a capped donor's money.

  The law asserts that corruption is a *relationship*, not an *outcome*. It posits that a candidate funded by \$50 million of their own money is inherently less corrupt than one funded by \$5,000 from a neighbor. This requires believing that influence purchased for oneself is legitimate, while influence purchased for another is suspect. It is the one place where the bookkeeping stops pretending to be about corruption and admits it is about protecting property rights over political integrity.
