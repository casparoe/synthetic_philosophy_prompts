  My brother's roommate is doing a gap-year thing at an AI startup and he dropped this arguement in our family group chat that I can't get out of my head. He says it proves AGI alignment is impossible in principle, not just really hard:

  1. Gödel's second theorem: a consistent theory that's effectively axiomatized and strong enough to do arithmetic can't prove its own consistency.
  2. Any serious AGI's design — its objective plus its code — is exactly that kind of theory, since it can obviously do arithmetic.
  3. So no AGI can prove its own spec is consistent.
  4. If it can't prove that, then there could be a contradiction sitting in its goals and nothing internal to the system would ever catch it.
  5. So you check it with a bigger verifier system V. But V can't prove V is consistent either, so you need V2 for V, and V3 for V2, forever.
  6. The chain never terminates, so no AI can ever be certified safe — and since "safe" just means "verified against a formal criterion," AGI can never be known to be safe.

  Which step should I reject, and what does rejecting it cost? I don't want to give up (1), I'm pretty sure that one's just straight-up true, and (6) is the part everyone in the chat thought was cool. Also my math teacher once said Peano arithmetic HAS been proved consistent, using some giant ordinal thing, which seems like it should break (5), or maybe just moves the problem up a level — I genuinely can't tell.

  Give me exactly five numbered points, a sentence or two each, with no intro and no wrap-up paragraph.
