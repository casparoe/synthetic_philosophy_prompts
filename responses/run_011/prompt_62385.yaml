      *   *The Flaw:* Step (6) claims the agent expects the alternative to be better. But if the agent is logically non-omniscient, she does not recognize the dominance. The dominance is *objective* (Step 4), but the *expectation* (Step 2) is subjective. An incoherent agent often thinks her credences are coherent.
      *   *Correction:* The Dominance Theorem shows the credence is objectively worse. It does *not* show the agent *expects* it to be worse. In fact, by (2), she expects her *current* credence to be best (locally).
      *   *So, Step (6) is the faulty joint.* "By (2) the agent herself expects that alternative to be strictly better." This does not follow. Proper scoring rules ensure that *if* you have credence $p$, you expect $p$ to score best. If you have incoherent credences, your expectations are messed up, but you don't necessarily see the dominance.
      *   *Wait, let's verify.* If I am incoherent, is there a probability function I *expect* to be better? Not necessarily. If I don't know the logic, I can't identify the dominating function.
