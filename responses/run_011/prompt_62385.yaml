      *   **Alternative Strategy (Limiting F):** Mention the "Limited Algebra" strategy (agents only have credences over a small F). This preserves (3) but blocks (5). However, the "Objective vs. Subjective" split on (6) is more fundamental to the *normative* force. I should focus on (6) but mention F-restriction as a complementary move.
