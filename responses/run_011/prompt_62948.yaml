answer: |-
  # Tolerance

  The booth was a cube of white walls and white floor, designed to be nothing so that the paint could be everything. Inside, the light banks clicked on in sequence. First the daylight tubes, D65, simulating noon in northern Europe. Then the tungsten, warm and incandescent, like a streetlamp at dusk. Then the cool white LEDs, flat and unforgiving. I stood in the center, holding the test card in my left hand and the panel in my right, tilting them together through the arc of fifteen degrees, forty-five, seventy-five.

  Twenty-six years at the bench. My eyes were the final instrument in the chain. The mixing scale could weigh the pigment to the tenth of a gram, the spectrophotometer could read the wavelength of the reflectance, but the match was only a match if I said it was. Metamerism was my daily bread. A pair of panels could be identical under the daylight tubes and part company under the tungsten, one turning green while the other stayed silver. A match was never absolute. It was relative to the light, relative to the angle, relative to the mood of the eye.

  In my pocket, I carried two chips of painted aluminum. I had made them during my apprenticeship, twenty-four years prior. They were from the same batch, mixed in the same cup, sprayed in the same pass. A supervisor, trying to break me in, had told me one was leftover stock from the previous year. I had looked at them then and seen the divergence immediately. The left one was warmer, heavier; the right one was thin, slightly blue. I had argued the point until he laughed and told me the truth. They were identical. They had always been identical.

  A quarter of a century later, I took them out sometimes, when the light in the booth felt uncertain. I held them side by side under the daylight tubes. I knew they were the same. I had measured them. I had made them. But I could not make them look the same. The left one still carried that warmth, that weight. The right one still floated, slightly blue. I handled them until the metal took on the heat of my skin, but the divergence held. It was a private touchstone. It reminded me that the eye was not a camera. It was a participant.

  The job that broke the routine was a silver sedan, a common metallic flake. The rear driver-side door had been scraped against a concrete pillar. We pulled the door, sanded it, primed it, and brought it to me for the topcoat. I mixed the formula, adjusted for the age of the car—the silver oxidizes, loses its brightness, takes on a grey cast—and sprayed three test cards. I chose the second one. I sprayed the door. I took it into the booth.

  I spent twenty minutes under the lights. I checked the flake orientation. Metallic paint is not just color; it is texture. The aluminum flakes suspend in the clear coat like leaves in ice. If they lie flat, the color is lighter and brighter. If they stand up, the color is darker and deeper. I adjusted the reducer, the air pressure, the distance of the gun, until the flakes on the door lay exactly as they did on the car. I signed the card. I marked the job as complete. It was an invisible repair. That was the standard. That was the claim.

  The next morning, Gary from the insurance adjustment firm was in the shop. He was leaning against the counter, drinking coffee, talking to the shop manager about the backlog. I walked past with a tray of panels. He didn't look at me, just gestured with his chin toward the bay where the silver sedan was being reassembled.

  "Good thing you pulled that door overnight and resprayed it in the other bay," he said. "The first coat looked like trash."

  He walked away. The shop manager didn't correct him. I stood there with the tray in my hands. I waited for the manager to say *no*, to say *I signed off on that yesterday, it wasn't resprayed*. But he was looking at a clipboard. I walked out to the yard.

  The car was sitting under the sodium vapour lights. These were the harsh orange lamps we used for security after closing. Under sodium vapour, colour collapses. Everything is monochrome, shades of grey and yellow. But texture remains. I looked at the door.

  Yesterday, under these same lights, the transition from the quarter panel to the door had been seamless. The light had flowed over the curve without interruption. Now, the mismatch was glaring. I could point to where the metallic flake lay wrong. I could say which quarter of the panel floated darker. The door looked like a patch. It looked like a different metal entirely. I ran my hand over the surface. It felt the same. The texture was smooth. But the light bounced off it differently. It was as if the angle of the flakes had shifted in the night, turned away from me.

  I went back inside and pulled the job cards. I pulled the mixing logs. I checked the bay assignments. No door had been swapped. No respray had been scheduled. The door I had signed off on was the door sitting in the yard. Nothing about the object had changed between my two looks. Only the information had changed.

  I took the door back into the booth. I turned on the daylight tubes. The mismatch persisted. It was no longer subtle. It was a shout. The silver on the door was cold, dead. The silver on the car was warm, alive. I brought out my test card, the one I had signed off on. It matched the car. It did not match the door. But the door was the car. The door was the panel I had sprayed.

  I brought out the spectrophotometer. It was a handheld device, shaped like a gun, with a measuring aperture at the base. I calibrated it against the white tile. I pressed it against the quarter panel. I pressed it against the door. I read the screen.

  Delta E: 0.4.

  Tolerance was set at 1.0. Anything under 1.0 was a pass. Anything under 1.0 was indistinguishable to the human eye, theoretically. The machine said the panels were within tolerance. The machine said they were a match. I looked at them. They were not a match. The number settled nothing, because tolerance was a threshold somebody chose and not a fact about the world. Someone had decided that a difference of 1.0 was acceptable. Someone had decided that the human eye could not see below that line. I was looking at a difference that the machine said was not there.

  I needed to know if it was the light or if it was me. I needed a control.

  I asked Mike, who worked the prep station, to help me. Mike had good eyes, but he wasn't a matcher. He didn't see the flake orientation the way I did. I took two fresh panels from the rack. I mixed a batch of the silver formula. I sprayed both panels in the same pass, from the same gun, holding the distance constant. They were physically identical. They came from the same cup.

  I took them into the booth. I told Mike to label them A and B. I told him to shuffle them behind my back. I told him not to tell me which was which. I wanted to see if I could find the difference without the story attached to the object. I wanted to strip the knowledge away.

  Mike shuffled them. He placed them on the rack. He stepped out. I was alone in the white cube.

  I looked at Panel A. It looked like the car. The flake was settled, uniform. I looked at Panel B. It looked like the door. The flake was chaotic, floating. I marked A as the match. I called Mike back in.

  He laughed. "They're from the same batch, boss. I sprayed them myself."

  I looked at him. "I know. I watched you."

  "Then why did you mark A?"

  "Because A matched the standard."

  "There is no standard. They are the same."

  I looked back at the panels. Panel A still looked settled. Panel B still looked chaotic. I knew they were from the same cup. I knew Mike had sprayed them in the same minute. But the knowledge that one of them was part of a test, part of an investigation, had changed the light. I could not un-know what I knew. I knew there was a possibility of error. I knew there was a discrepancy in the world. I was looking for it. And because I was looking for it, I found it, even in paint that was wet from the same gun.

  There was no double blind that worked against yourself. I was the instrument, and the instrument was calibrated to the story. If the story said the door was resprayed, the door looked resprayed. If the story said the door was original, the door looked original. But I couldn't hold both stories at once. The adjuster's comment had locked the door into the category of *suspect*. I could not move it back.

  I had to give a deposition. The customer was filing a small-claims action against the shop. They claimed the repair was visible. They claimed we had used the wrong paint. I had to say, under oath, what I saw and when I saw it.

  I sat at my desk in the back office, the job file open in front of me. I had to write a statement. I had to describe the panel as it was at the time of sign-off. I started typing.

  *The flake orientation was uniform across the panel. The metallic particles lay flat against the substrate, reflecting the light source in a consistent sheet. There was no variation in the depth of the colour from the centre to the edges. The match was seamless.*

  I stopped. I remembered the yard. I remembered the sodium vapour lights. I remembered the glare. I deleted the paragraph. I started again.

  *The flake orientation was inconsistent. The metallic particles stood upright in the centre of the panel, scattering the light. There was a visible variation in the depth of the colour, with the lower quarter floating darker than the rest. The match was compromised.*

  I saved the file. I did not delete the first paragraph. I left them both in the document, one after the other, separated by a line break. I read them back.

  *The flake orientation was uniform across the panel. The metallic particles lay flat against the substrate, reflecting the light source in a consistent sheet. There was no variation in the depth of the colour from the centre to the edges. The match was seamless.*

  *The flake orientation was inconsistent. The metallic particles stood upright in the centre of the panel, scattering the light. There was a visible variation in the depth of the colour, with the lower quarter floating darker than the rest. The match was compromised.*

  I looked at the screen. I did not correct it. I let the contradiction stand. It was the truth of the first look and the truth of the second look. Both were real. Both were mine.

  The shop manager wanted me to testify that the door was fine. He said the machine said it was fine. He said the logs said it was fine. He said the customer was just looking for a payout. He said I was the expert, and my signature on the card was worth more than their eyes.

  "My signature is on the card," I said. "But my eyes are on the door."

  "Your eyes are wrong," he said. "The logs don't lie."

  "The logs don't see."

  He told me to stick to the data. He told me to say that the perception was subjective. He told me to say that the customer was seeing things.

  I went back to the booth. I needed to mix a new batch. There was a red sedan waiting, a colour shift pearl that moved from maroon to black depending on the angle. It was a difficult colour. It required three coats of base, each with a different alignment of the pearl. If you missed the angle, the panel looked blotchy. If you hit it, it looked like liquid.

  I put on the respirator. The smell of the reducer was sharp, chemical, sweet. It filled the mask. I pulled the formula up on the screen. I placed the canisters on the scale. I pressed the pedal. The paint poured into the cup, thick and viscous. I watched the weight climb. I stopped at the gram. I stirred the mix. The stick came out coated in red.

  I poured the paint into the gun. I checked the pressure. I walked to the rack where the red sedan's bumper sat. It was primed, grey and matte. I held the gun. I pulled the trigger.

  The paint came out in a fan. I moved my arm across the surface, steady, consistent. The grey disappeared under the red. I watched the pearl catch the light. I watched the colour shift.

  I thought about the deposition. I thought about the oath. I would have to stand up. I would have to raise my right hand. I would have to promise to tell the truth. But which truth? The truth of the machine? The truth of the logs? Or the truth of the light in the booth?

  If I said the door matched, I would be lying about what I saw now. If I said the door mismatched, I would be lying about what I saw then. And both sees were happening in the same head, behind the same eyes.

  I finished the bumper. I hung the gun on the rack. I wiped the nozzle with a rag. The rag came away red. I looked at my hands. They were stained with the pigment. The colour was under my fingernails. It was in the lines of my palms.

  I went back to the desk. I printed the statement with the two paragraphs. I put it in the envelope. I did not seal it.

  I walked out to the yard. The sun was setting. The light was changing from the flat white of the day to the gold of the evening. This was the dangerous time. This was when the matches broke. I walked over to the silver sedan. It was still there. The customer hadn't picked it up yet.

  I stood by the door. I looked at the panel. Under the gold light, the mismatch was less visible. The warmth of the sun covered the coldness of the paint. The door looked like it belonged. It looked like it had always been there.

  I reached out and touched the surface. It was cool. It was smooth. I ran my thumb along the edge where the door met the quarter panel. I could feel the gap. It was consistent. The panel gaps were set by the factory, by machines that did not see.

  I thought about the chips in my pocket. The ones I had made twenty-four years ago. I took them out. I held them in the evening light. They still looked different. They still diverged. I knew they were the same. I knew I had made them. But the light said they were not.

  I put them back in my pocket. I went back inside. I turned off the booth lights. The white cube went dark. The machines hummed in the silence.

  The deposition was on Tuesday. I would go there. I would sit in the chair. I would swear to tell the truth. And I would have to decide whether the truth was what the object was, or what the light said it was. I knew that if I said the door mismatched, they would say I was incompetent. They would say I had lost my eye. They would say I was too old for the booth.

  If I said the door matched, they would say I was lying. They would say I was protecting the shop. They would say I was protecting myself.

  I walked to the sink. I washed the paint off my hands. The red stain stayed in the cuticles. I scrubbed with the pumice soap. The water ran pink. I dried my hands on the towel.

  I went back to the booth. I turned on the daylight tubes. I took the door out of the car. I brought it inside. I set it on the rack next to the test card. I stood there. I looked.

  The mismatch was there. It was glaring. It was obvious. I could not un-see it. I could not un-know the adjuster's comment. I could not un-know the logs. I could not un-know the machine.

  I picked up the spray gun. I mixed a little more of the silver. I added a drop of blue. I added a drop of binder. I stirred it. I didn't know why. I didn't know what I was trying to fix. The door was already painted. The job was done.

  I sprayed a test card. I held it up next to the door. It didn't match. I sprayed another. It didn't match. I sprayed a third.

  I stood in the white cube, surrounded by panels that were all slightly different, all slightly wrong. The light hummed. The air filtration system whispered. I held the gun in my hand. The trigger was cold against my finger.

  I looked at the door. I looked at the card. I looked at my hand.

  I did not put the gun down. I did not turn off the light. I waited for the paint to flash. I waited for the solvent to evaporate. I waited for the colour to settle.

  It did not settle. It stayed fluid. It stayed uncertain.

  I squeezed the trigger. The paint came out. I moved my arm. I covered the card. I watched the flake orient itself in the wet coat. I watched it catch the light. I watched it change.

  I kept spraying. I did not stop to check the match. I did not stop to check the machine. I just sprayed. I let the paint land where it landed. I let the flakes settle how they settled. I let the light do what it did.

  When the cup was empty, I stopped. I hung the gun up. I looked at the card. It was wet. It was shining. It was silver.

  I turned off the lights. The booth went dark. I stood in the blackness. I could not see the card. I could not see the door. I could not see my hands.

  I put my hand in my pocket. I touched the chips. They were cold. They were metal. They were there.

  I walked out of the booth. I left the door on the rack. I left the cards on the table. I left the light off.

  The question was not whether the door matched. The question was not whether the adjuster lied. The question was not whether the machine was right.

  The question was in the hand that held the gun. The question was in the finger that pulled the trigger. The question was in the eye that watched the paint land.

  I locked the shop door. I walked to my car. I drove home. I parked in the garage. I turned off the engine. I sat in the dark.

  I held my hand up in front of my face. I could not see it. I knew it was there. I knew it was my hand. I knew it was covered in paint.

  I closed my fingers. I made a fist. I opened them. I made a hand.

  I did not know what I saw. I only knew what I held.
