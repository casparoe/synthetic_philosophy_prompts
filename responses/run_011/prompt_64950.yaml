  **Recommendation**

  Allocate the entire fund to the **Overseas Appeal**.

  Do not split the fund. The constraint that the fund will "do one properly or both badly" renders the precedent of Decision (7) practically inapplicable this quarter, as a split would guarantee failure on both fronts. Between the two appeals, the Overseas case presents a convergence of two principles that have historically overridden domestic priority: **Last Resort** (Decision 2) and **Reciprocal Debt** (Decision 4). The Domestic appeal rests on **Jurisdictional Responsibility** (Decision 5), which is a strong principle but one that the board has historically weighed as equal to, not greater than, the combination of abandonment and historical debt.

  **Closest Analog and Analysis**

  The closest analog is a composite of **Decision (4)** and **Decision (2)**, with **Decision (7)** serving as the critical boundary marker.

  *   **Decision (4)** is the primary analog. It involves the same country, the same region, and a similar trustee composition (families hosted during civil war). The minute "We owe them" established that historical reciprocity can override domestic proximity.
  *   **Decision (2)** is the secondary analog. It establishes that total abandonment ("No one else is going") overrides domestic infrastructure needs. The current overseas appeal matches this condition (agencies withdrawn), whereas the domestic appeal involves a functioning national scheme that merely excludes a specific group.
  *   **Decision (7)** is the warning analog. It pit "Abandoned Abroad" against "Excluded at Home" (Undocumented). The result was a tie/split. This tells you that when Reciprocity is removed, the board finds Jurisdiction (Home) and Necessity (Abroad) to be of equal weight.

  **What does the work in the analogy:**
  The deciding factor is the **presence of Reciprocity**. In Decision (7), there was no mention of debt or history, only need and exclusion. The board deadlocked. In this quarter's appeal, the historical debt of Decision (4) is reactivated. Since Jurisdiction and Necessity are equal (per Decision 7), the addition of Reciprocity tips the scale to Overseas.

  **The Weight of Decision (7) and the Vacant Seat**

  You asked specifically about the vacant seventh seat in Decision (7). **Your hunch is correct; the vacancy matters profoundly.**

  The Chair argues (7) is a precedent for splitting. The Treasurer argues it is a nullity. Both are partially wrong. It is a precedent for **procedural stalemate**, not philosophical balance. A 3-3 vote with a vacancy means the board was structurally incapable of forming a majority will. The split was likely a compromise to release funds, not a principled affirmation that the two appeals were of equal moral weight.

  If the seventh seat had been filled, there would have been a majority for one side or the other. Relying on (7) as a guiding principle codifies indecision. It implies that when the board cannot agree, we split. But your constraint this quarter ("one properly or both badly") means splitting is functionally a refusal to decide. Therefore, you must treat (7) not as a precedent for *action* (splitting), but as data on *weighting*: it proves the board views "Excluded at Home" and "Abandoned Abroad" as morally equivalent *absent other factors*. Since you have the "other factor" (Reciprocity), you must break the tie.

  **Candidate Principles Generated from the Record**

  I have distilled three candidate principles that attempt to cohere the seven decisions.

  **1. The Principle of Specific Obligation**
  *   *Definition:* We prioritize appeals where a specific relationship (causal, contractual, historical, or jurisdictional) creates a duty stronger than general human need.
  *   *Fit:* Explains (3) "We helped make this" (Causal), (4) "We owe them" (Historical), (5) "They live under our laws" (Jurisdictional), (6) "Signed up for this" (Contractual).
  *   *Strain:* Decision (1) "Our neighbours first" is the outlier. It relies on proximity, not specific obligation. However, it can be read as a default position when no specific obligation exists elsewhere.
  *   *Implication for Current Quarter:* Overseas wins. We have a Specific Obligation (Historical Debt) abroad. The domestic exclusion is a Jurisdictional Obligation, but the Overseas case *also* includes the "Last Resort" obligation (2), creating a compound specific duty.
  *   *Future Commitment:* You commit to investigating the *history* of every appeal. You cannot act on need alone; you must find the "hook" of obligation.

  **2. The Principle of Last Resort**
  *   *Definition:* We prioritize appeals where no other actor (government or agency) is providing relief, regardless of location.
  *   *Fit:* Explains (2) "No one else is going" and the Overseas side of (7).
  *   *Strain:* Decision (1). The earthquake country had effective government and agencies, yet the hurricane (with fewer deaths) won. Decision (5). The domestic residents were excluded, but the co-nationals abroad had a "full response" from their government. We chose the residents. This suggests Last Resort is not the *only* driver.
  *   *Implication for Current Quarter:* Overseas wins. The agencies have withdrawn. The domestic national scheme is "functioning normally," even if exclusionary.
  *   *Future Commitment:* You commit to a "gap analysis" for every appeal. If a government is trying but failing, you might skip them for a place where no one is trying. This risks ignoring high-need areas with corrupt but present governments.

  **3. The Principle of Jurisdictional Protection**
  *   *Definition:* We prioritize those subject to our laws and political system, as we are complicit in their vulnerability.
  *   *Fit:* Explains (5) "They live under our laws" and the Domestic side of (7).
  *   *Strain:* Decision (4). We prioritized a foreign country over a domestic appeal because of debt. Decision (3). We prioritized a foreign flood because we caused it, even if the domestic flood was equal. This principle cannot stand alone; it is overridden by Causal or Reciprocal debt.
  *   *Implication for Current Quarter:* Home wins *if* this is the only principle. But the record shows it is a secondary principle, overridden by Reciprocity (4).
  *   *Future Commitment:* You commit to acting as a watchdog for domestic policy failures. However, you admit that if we owe a debt abroad, domestic residents may wait.

  **The Debt Question (Decision 4)**

  You ask whether the larger share given fourteen years ago discharged the debt, renewed it, or if "debt" is the wrong frame.

  *   **Analysis:** Relief is not repayment. If the minute had read "We paid them," the ledger would be closed. It read "We owe them." This implies an ongoing relational status, not a transactional balance.
  *   **Recommendation:** Treat the debt as **renewable but not perpetual**. It is renewed because the *same region* is starving and the *same trustees* (by family history) are present. If the trustees change such that no one holds that memory, the debt fades.
  *   **Risk:** If you treat it as perpetual, the foundation becomes a bilateral aid agency for that single nation, violating the "standing choice between domestic and overseas" mandate. You must articulate that this allocation is due to the *convergence* of debt and abandonment (Decision 2), not debt alone.

  **Hypothetical Discriminator**

  To distinguish between **Specific Obligation** and **Last Resort** (the two strongest contenders), consider this future appeal:

  *   **Scenario:** A famine in a country with which we have *no* historical ties, *no* treaty, and *no* causal link (pure need), where agencies have withdrawn (Last Resort). Versus a domestic factory collapse involving documented citizens (Specific Jurisdictional Obligation) where the government is responding slowly but adequately.
  *   **Discrimination:**
      *   If you choose **Overseas**, you adhere to **Last Resort** (Need > Obligation).
      *   If you choose **Home**, you adhere to **Specific Obligation** (Duty > Need).
  *   **Prediction:** Based on Decision (1) ("Neighbours first" when need was higher abroad) and Decision (5) (Residents over Co-nationals), I suspect the board would choose **Home**. This suggests Specific Obligation is your true governing principle, with Last Resort acting as a tie-breaker only when Obligation is equal.

  **Confidence and Uncertainty**

  *   **Confidence:** I am **80% confident** in the recommendation to allocate Overseas. The convergence of Decision (2) and Decision (4) creates a heavier moral weight in the record than Decision (5) alone. The record consistently shows that "Specific Ties" (Debt, Causality, Treaty) override "General Proximity" (Home).
  *   **Least Sure Point:** I am least sure about the interpretation of **Decision (7)**. I have argued it is a procedural stalemate due to the vacancy. However, it is possible the Chair is right: that the board *intended* to establish that "Abandoned Abroad" and "Excluded at Home" are morally equivalent, and the vacancy was incidental. If that is true, then without the Reciprocity factor, you would be forced to split. But since you *do* have the Reciprocity factor (Decision 4), the Overseas recommendation holds even if (7) is a true precedent for equivalence.
  *   **The Vacant Seat:** I agree with your hunch. The vacancy matters because it prevented the emergence of a majority principle. It turned a decision into a compromise. Relying on it as a "principle of splitting" is dangerous because it rewards deadlock. In a "one or both badly" scenario, a deadlock results in failure. You must break the tie using the other precedents.

  **Draft Minute for This Quarter**

  If you proceed with the Overseas allocation, the minute should read:
  *"No one else is going, and we owe them."*

  This combines the language of (2) and (4), acknowledging both the abandonment and the history, while implicitly distinguishing this from the domestic exclusion which, while serious, exists within a functioning national framework.
