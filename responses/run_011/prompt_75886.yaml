  3. **Ontological Relationism:** This metaphysical position denies substantival space in favor of pure relations between objects, compatible with General Relativity but incoherent in Newtonian mechanics. It saves the scene only if paired with the further premise that dynamical laws must also be purely relational.

  4. **General Covariance:** This true mathematical principle states laws hold in any coordinate system within General Relativity but is meaningless in Newtonian mechanics. It does not save the scene because it confuses description with physics, failing to license the claim that inertial forces vanish without relative matter.

  5. **The 'Everything Else' Qualification:** This reading treats the follow-up as a claim that the reference frame is the total mass-energy content, a substantive position where General Relativity allows frame-dragging unlike Newtonian mechanics. It partially licenses the bucket argument and saves the scene by grounding her afterthought in actual physics rather than pure conjecture.
