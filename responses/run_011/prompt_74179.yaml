answer: |-
  You have hit on exactly the right friction points. Honestly, your intuitions are tracking the "Optimist" position in the literature, which is a very respectable place to be. The confusion you're feeling isn't because you're missing something obvious; it's because the "Pessimists" (those who think moral testimony is problematic) are making a move that is deliberately counter-intuitive.

  However, there is a major misunderstanding in your notes that is making everything harder. Let's clear that up first, then tackle the Doctor analogy, and finally the parenting case.

  ### 1. The "No Moral Properties" Misunderstanding
  You wrote: *"the reason seemed to be something about there not being anything out in the world corresponding to moral properties."*

  This is almost certainly incorrect regarding the specific debate on moral testimony. That view (Error Theory or Non-Cognitivism) would indeed make moral testimony impossible, but it would also make *first-hand* moral knowledge impossible. If there are no moral facts, nobody knows them, expert or not.

  The Moral Testimony debate usually takes place **among Moral Realists**. Both the Pessimists and the Optimists generally agree that moral truths exist and can be known. The Pessimist isn't saying "You can't know it because it's not real." They are saying "You can't know it *via testimony* even though it is real, because morality demands something extra from the knower."

  ### 2. Why is Morality Special? (The Doctor Analogy)
  Your objection here is the standard "Optimist" argument: *If reliability is what matters for knowledge, and moral experts are reliable, why is testimony okay for medicine but not morality?*

  The Pessimist response is that knowledge isn't the only thing we care about. In medicine, we care about **outcomes**. If the doctor tells you to take the pill and you take it, you get healthy. It doesn't matter if you understand the biochemistry.

  In morality, Pessimists argue, we care about **agency** and **autonomy**.
  *   **The "Why" Matters:** If you don't lie *only* because your guru told you not to, you haven't necessarily acted morally in the fullest sense. You've acted obediently. To have full moral standing, you need to grasp the *reasons* why lying is wrong (e.g., it violates autonomy, causes harm). Testimony transmits the *that* (lying is wrong), but it rarely transmits the *why* (the normative connection).
  *   **Moral Worth:** There is a Kantian flavor here. An action only has moral worth if it is done from a recognition of the moral law/reasons, not just from deference. If you defer, you are outsourcing your moral agency.

  So, to answer your question: **No, the puzzle doesn't go away even if you grant a trustworthy testifier.** The Pessimist says that even if Mother Teresa tells you "Don't steal," and she is 100% reliable, believing her *just because she said so* is a deficient way to hold a moral belief. It's not about the reliability of the source; it's about the quality of your own engagement with the moral reason.

  This is why it generates papers instead of a paragraph: It forces us to ask, "What is the point of morality? Is it just getting the right answers (like medicine), or is it about being a certain kind of autonomous agent?"

  ### 3. The "Understanding" Objection (Your Friend's Point)
  Your friend was pointing to the **Knowledge vs. Understanding** distinction.
  *   **Knowledge:** True belief + justification. (I believe lying is wrong because Sarah told me, and Sarah is reliable).
  *   **Understanding:** Grasping the explanatory connections. (I believe lying is wrong *because* I see how it undermines trust).

  Pessimists argue testimony can give you knowledge (maybe), but it cannot give you understanding. And in morality, understanding is the real prize. If you don't understand *why* something is wrong, you can't apply that principle to new, tricky cases. You are morally brittle.

  ### 4. The Parenting Case (And Your Professor's "Wordplay")
  This is the strongest objection to Pessimism, and your intuition is spot on: *Of course I should tell my kid hitting is wrong.*

  Pessimists have a way out of this, and it clarifies what your professor meant by "agent deficiency."

  **The Developmental Defense:**
  Pessimists usually argue that moral testimony is inappropriate for **competent adults** in **normal contexts**.
  *   **Children:** Children are not yet full moral agents. They lack the cognitive capacity to grasp the reasons. Telling them "hitting is wrong" is a placeholder. The goal of parenting is to move them *from* testimony *to* understanding. You tell them now so they don't hurt people, but you owe them an explanation as they grow.
  *   **Emergency/Non-Ideal Cases:** If you are in a burning building and a firefighter yells "Don't go back in!", you should listen. But that's pragmatic safety, not deep moral deliberation.

  **"Belief vs. Agent Deficiency":**
  Your professor wasn't just playing word games. They were distinguishing between:
  1.  **Doxastic Deficiency:** The belief itself is flawed (false, unjustified).
  2.  **Agent Deficiency:** The belief might be true and justified, but *you* are flawed for holding it this way.

  **Example:** Imagine you calculate a math problem correctly, but only because you rolled a die and the number matched the answer.
  *   Is the belief true? Yes.
  *   Is it knowledge? Most say no (it's luck).
  *   Are *you* deficient as a mathematician? Yes, because you didn't do the math.

  The Pessimist says moral testimony is like the die roll. You might end up with the right belief ("Hitting is wrong"), but you are deficient as a moral agent because you didn't do the "moral math" (grasping the reasons).

  ### Summary of the State of Play
  You came out confused because the seminar likely presented the Pessimist case as stronger than it actually is. It is **not settled**.
  *   **Optimists (Your view):** Morality isn't special. If there are moral experts, we should trust them. Demanding everyone deliberate everything leads to moral narcissism or inefficiency.
  *   **Pessimists:** Morality is special because it requires autonomous engagement with reasons. Deferring undermines moral worth and understanding.

  **Your takeaway should be:** The problem isn't that moral facts don't exist. The problem is whether morality is about **tracking truth** (like science/medicine) or **exercising autonomy** (like art/friendship). If it's the former, your doctor analogy wins. If it's the latter, the Pessimist has a point. Most philosophers think it's some mix of both, which is why the debate is still alive.

  And regarding your kid: Keep telling her hitting is wrong. Just make sure you plan to explain *why* before she turns 18. That satisfies almost everyone in the debate.
