answer: |-
  Here are my comments on the draft, focusing on the argumentative structure and the specific questions you raised.

  ### 1. The Distinction in §2
  This is a real distinction, not just a renaming, but you are walking a very fine line against Dennett's own text.

  Dennett explicitly lists "change in competence" as one of the four possibilities for Chase and Sanborn. Your "discriminative drift" is effectively a subset of competence change. However, you are doing something different with it. Dennett uses the competence option to show that we cannot distinguish it from experience change; you are using it to argue that discrimination *constitutes* experience.

  That is a substantive move. It shifts the argument from "we can't tell the difference between experience and judgment" (Dennett's agnosticism/eliminativism) to "experience is individuated by discrimination profiles" (your structuralism). So, you haven't just dressed up the standard point; you've repurposed it to build a positive account of why the fact is missing. Just be careful not to imply Dennett didn't notice the distinction. He did; you're disagreeing about what the distinction *does*.

  ### 2. The Third Taster (Voss) in §3
  Voss does not collapse into Chase or Sanborn, but she introduces a verbal contradiction that a hostile reader will exploit immediately.

  Chase says: Taste same, liking different.
  Sanborn says: Liking same, taste different.
  Voss says: Liking same, taste same... but also different (new edge).

  The collapse risk isn't that she becomes Chase or Sanborn; it's that she becomes a case of **attention**. If the burnt-sugar edge was always there and she just learned to notice it, a realist will say her *experience* didn't change, only her *judgment* did. You claim her experience changed because her discrimination profile changed. This is the core of your structural view, but Voss's report ("it tastes the same") undermines your claim that the experience is different. If the experience is different (because the discrimination profile is different), why does she report it tastes the same?

  You need to clarify what "tastes the same" means for Voss. If it means "same valence," fine. If it means "same qualitative character," then you can't say her experience changed. You can't have it both ways: either the experience changed (supporting your structural view) or it didn't (supporting the attention/judgment view). Currently, Voss says both, which makes the case feel rigged.

  ### 3. Misdescription of the Case/Reading
  You are slightly misdescribing Dennett's own position in §1, though you are accurate about how the case is often taught.

  You write: "The coffee taster case is usually read as an argument from the unreliability of introspection... I think this is the wrong moral to draw... It's showing that there's no determinate fact for introspection to get right or wrong."

  Dennett agrees with you. Dennett is not an epistemological skeptic about qualia (saying there are qualia but we can't know them); he is an ontological eliminativist (saying there are no qualia to know). The "unreliability of introspection" reading is a common introductory gloss, but if you frame your paper as correcting the *standard reading*, you risk sounding like you are correcting Dennett himself on a point he already made.

  You should clarify that you are correcting the *epistemological gloss* often applied to Dennett, not Dennett's actual conclusion. Your structural account offers a *reason* for the lack of a determinate fact (the drift of discrimination profiles), whereas Dennett often leaves it as a brute indeterminacy. That is your contribution. Make sure §1 doesn't sound like you are teaching Dennett how to be an eliminativist.

  ### 4. The Single Paragraph a Hostile Reader Attacks First
  A hostile reader will attack the **second half of §3**, specifically the paragraph where you claim the inverted spectrum case dissolves.

  > "If that's right, a bonus: the inverted spectrum case dissolves rather than gets answered. A wholesale swap of the colour space changes the discrimination profile wholesale, so on my view it changes the experience, correctly reported, and it is no longer a case of same-experience-different-quale."

  This is the weakest link. You move from a specific case about coffee discrimination to a universal claim about color inversion in two sentences. A hostile reader will say: "You've just conceded functionalism. If experience is individuated by discrimination profiles, you haven't quined qualia; you've just defined qualia functionally. The inversionist will say the discrimination profile stays the same (behaviorally) while the experience flips. You haven't answered them; you've just stipulated that experience *is* discrimination."

  This paragraph invites the objection that you have rehabilitated the very thing you meant to eliminate, just under a different name. It's too big a claim to hang on the Voss case without more groundwork. Either cut the inverted spectrum claim or move it to a separate discussion; it distracts from the stronger argument about the coffee tasters.
