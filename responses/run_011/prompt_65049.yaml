      *   Comments need to be copy-pasteable and defensible.

      *   *Self-Correction on Grade:* Is 14 too harsh? For an upper-level seminar, calling jade an "artifact kind" is a significant category error. Misrepresenting Dupré's core thesis is also significant. 13-14 feels right. Let's go with 14 to acknowledge the strong Kripke/Putnam section.
      *   *Wait, one more check:* The prompt asks for "at least one essentialist/semantic account... and at least one alternative." The student provides Kripke/Putnam (Essentialist) and Lewis/Boyd/Dupré (Alternatives). They meet the criteria. The issue is accuracy.

      *   *Comment Construction:*
