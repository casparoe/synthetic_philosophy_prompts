          6.  Praise conclusion's synthesis.

      *   *Content vs Structure:* Definitely Content.

  7.  **Final Polish:** Ensure tone is professional, authoritative, and helpful for moderation defense. (Make sure to explicitly state the "correct position" in the comments as requested).

      *(Self-Correction during drafting comments)*: Make sure the comments reference specific text from the student's script so the TA can paste them next to the relevant lines.

