      *   **Constraints:** Low data (0-25 years), non-stationary processes, unobserved tail mechanisms. Tight turnaround (48 hrs - 1 week).
      *   **Consumers:** Capital model (needs single number), CRO (finance background, no actuarial/philosophy training, needs clarity).
      *   **Core Task:** Create a *decision procedure* (ordered steps, questions, outputs) grounded in *Keynes's A Treatise on Probability* (logical probability, weight of argument, non-measurability, non-comparability) and *The General Theory* (conventions, animal spirits).
      *   **Specific Translation Problems to Address:**
          1.  Evidence accumulation $\neq$ automatic strengthening (Keynes's view on weight vs. probability).
          2.  Capital model needs strict ordering even if arguments are non-comparable (defensible convention + flagging).
          3.  Abuse prevention (Keynes as a shield for laziness/pricing high) + responding to "refusal is a decision."
      *   **Deliverables:**
          1.  The Decision Procedure.
          2.  Three Live File Walkthroughs (Neurostimulation, Wildfire, Tech Aggregation). *Constraint: One must come out badly (likely Tech Aggregation).*
          3.  Limitations/Critique of the Procedure (what was flattened, where judgment hides, scholarly disputes).

  2.  **Analyze the Keynesian Foundation:**

      *   *Probability as Logical Relation:* $P(a|h)$ is the degree of rational belief in conclusion $a$ given evidence $h$. It's objective but not always numerical.
      *   *Non-Measurability:* Some probabilities cannot be assigned numbers. They are ordinal or just "higher/lower."
      *   *Non-Comparability:* Two probabilities based on different evidence bases might not be comparable (e.g., is $P(A|h_1) > P(B|h_2)$?).
      *   *Weight of Argument ($w$):* Distinct from probability. $w$ increases with *relevant* evidence, regardless of whether the probability goes up or down. More evidence = more weight, *but* new evidence can change the probability relation itself. *Correction on User's Recollection:* The user recalls Keynes saying more evidence doesn't automatically strengthen an argument. Actually, Keynes defines *Weight* as increasing with more evidence. However, *Probability* can go down with new evidence. The user's point is likely about the *conclusion's stability*, not the definition of weight. I need to clarify this distinction in the procedure: More data increases *Weight*, but might decrease *Probability* or reveal *Incomparability*.
      *   *Uncertainty vs. Risk (General Theory):* Treating uncertainty as risk is a "convention." We pretend we know to act. This is driven by "animal spirits" (spontaneous optimism).
      *   *Operationalizing for Finance:* The CRO needs a number. The Capital Model needs a number. Keynes says "don't." The procedure must bridge this gap honestly.

  3.  **Drafting the Decision Procedure (The "Keynesian Actuarial Protocol"):**

      *   *Goal:* Force the team to assess *Weight* before *Probability*.
      *   *Step 1: Evidence Audit (Weight).* What do we know? Is it relevant? Is the process stationary?
      *   *Step 2: Measurability Check.* Can we logically assign a number? If not, stop trying to force a frequency.
      *   *Step 3: Comparability Check.* Can we rank this against other books?
      *   *Step 4: The Convention (if forced).* If we *must* produce a number for the CRO/Model, we explicitly label it a "Convention" based on "Animal Spirits/Enterprise," not "Calculation."
      *   *Step 5: Output Specification.* Point Estimate, Range, Scenario Set, or Refusal.
      *   *Addressing Translation Problem 1 (Evidence):* Differentiate between *Volume* of data and *Relevance* of data. New data that breaks stationarity reduces Weight/Validity, even if Volume increases.
      *   *Addressing Translation Problem 2 (Ordering):* Use a "Confidence-Adjusted Severity" metric. If incomparable, rank by Weight, not just Expected Loss. Flag with a "Non-Comparability Warning."
      *   *Addressing Translation Problem 3 (Abuse):* Require a "Counter-Argument" step. To refuse, you must specify *what evidence is missing* that would allow quantification. To price high, you must show the *convention* used.

  4.  **Developing the Three Live Files:**

      *   *File 1: Neurostimulation (Medical Tech).*
          *   *Data:* 6 years US only.
          *   *Risk:* Long tail, unknown failure modes, plaintiff bar active.
          *   *Keynesian View:* Low Weight. Probability relation is unstable (non-stationary due to legal environment).
          *   *Output:* Range + Scenario. High uncertainty.
      *   *File 2: Wildfire (Climate).*
          *   *Data:* 20 years.
          *   *Risk:* Non-stationary (vegetation, housing density).
          *   *Keynesian View:* Past data is logically weak evidence for future (induction problem exacerbated by climate change).
          *   *Output:* Adjusted Frequency (downweight old data).
      *   *File 3: Tech Aggregation (Renewal).*
          *   *Context:* CFO already quoted indicative rate. Need premium volume.
          *   *Risk:* Aggregation, unobserved tail.
          *   *Keynesian View:* This is pure "Convention." The CRO/CFO are acting on "Animal Spirits" (volume need).
          *   *Output:* **Refusal/Warning.** The procedure must flag that the indicative rate is unjustified by evidence weight. This satisfies the "come out badly" constraint.

  5.  **Refining the Procedure (Self-Correction/Polishing):**

      *   *Critique of User's Recollection:* Keynes *did* argue that weight increases with evidence ($w$ goes up as $h$ becomes $h + h'$). However, the *probability* ($P$) can move either way. The user's concern is that "more data" is often treated as "better estimate." I need to ensure the procedure distinguishes *Relevance* from *Volume*. If new data reveals non-stationarity, the *logical relation* weakens even if data volume grows.
      *   *Capital Model Constraint:* The model *will* crash without a number. The procedure needs a "Shadow Price" or "Proxy" mechanism that is distinct from the "Best Estimate." Let's call it the "Regulatory/Model Convention Number" vs. the "Underwriting View."
      *   *Abuse Prevention:* The "Refusal" needs a cost. If you refuse to quantify, you must propose a *monitoring* plan or a *structure* change (e.g., lower limits, exclusions) instead of just saying "no."

  6.  **Drafting the Limitations Section:**

      *   What did I flatten? Keynes's nuanced view on logical relations is reduced to a checklist.
      *   Where is the judgment? In assessing "Relevance" and "Stationarity."
      *   Scholarly disputes: Is probability logical or subjective? (Keynes vs. Ramsey). I am taking the Keynesian side as requested, but acknowledging it's not standard actuarial science.

  7.  **Final Review against Constraints:**

      *   *Tone:* Professional, rigorous, slightly academic but actionable.
      *   *Keynesian Grounding:* Explicit references to *Treatise* and *General Theory*.
      *   *Three Problems:* Addressed in the procedure design.
      *   *Three Files:* Walked through step-by-step.
      *   *One Bad Outcome:* Tech Aggregation file.
      *   *Limitations:* Included at the end.

  8.  **Writing the Response:** (Mental outline of the text)
      *   **Introduction:** Acknowledge the tension between Keynes and Modern Finance.
      *   **The Procedure (KAP):** 5 Steps.
      *   **Addressing the 3 Translation Problems:** Embedded in the procedure notes.
      *   **Live Files:** Detailed application.
      *   **Limitations:** Honest appraisal of the tool.

  *(Self-Correction during drafting)*: Make sure I don't just say "Keynes says no numbers." The CRO needs a number. The solution is to provide the number *as a convention* with a disclosed "Weight" score. The Capital Model gets the number; the CRO gets the number + the Weight. This satisfies the business need without lying about the epistemology.

  *(Refining the "Evidence" point)*: The user says: "Keynes did not think accumulating more relevant evidence automatically strengthens an argument." Actually, Keynes says Weight *does* increase with evidence. But the *probability* might become less favorable. I need to be precise here. The *strength* of the conclusion (probability) doesn't necessarily go up. The *weight* (confidence in the probability) goes up. I will clarify this in the procedure: Distinguish between *Favorability* (EL) and *Weight* (Confidence).

  *(Refining the "Abuse" point)*: To prevent hiding behind "Uncertainty," require that a "Refusal to Quantify" must be paired with a "Structural Mitigation." You can't just say "too hard." You must say "too hard, so we write 50% of the limit."

