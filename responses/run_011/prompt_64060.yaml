answer: |-
  The Treaty of Versailles serves not merely as a historical document but as a negative imprint of Kant's *Perpetual Peace*. Where Kant outlines the conditions for a peace that sustains itself, Versailles constructed a peace that required constant enforcement. By running the treaty against Kant's articles, we move beyond the generic observation that the settlement was "harsh" to a structural diagnosis of why it was philosophically incoherent as a peace instrument.

  **The Preliminary Articles**

  Kant's six preliminary articles are designed to eliminate the causes of future war. Applied to Versailles, they function less as a checklist and more as an autopsy.

  Article 1 states that "no peace treaty is valid which tacitly reserves matter for a future war." Versailles fails this test categorically. To the German signatories, the treaty was not a peace but a continuation of hostilities by economic and legal means. The resigned British Treasury official, John Maynard Keynes, argued in *The Economic Consequences of the Peace* that the reparations regime would impoverish Central Europe to a degree that necessitated revolution or war. This is precisely Kant's diagnostic: a treaty is invalid if its maxims make future conflict inevitable. Keynes's objection is not merely economic; it is a Kantian judgment on the treaty's validity. If the terms guarantee a breakdown, the treaty is, in Kant's sense, no treaty at all.

  Article 2 prohibits the acquisition of one state by another. The mandate system technically avoided this by framing colonial redistribution as a "trust." However, in practice, the victors administered these territories as imperial possessions. This violates the spirit of the article, treating populations as transferable property rather than moral communities.

  Article 3 calls for the abolition of standing armies. Here, the settlement was asymmetrical. Germany was forced to abolish its standing army; the Allies were not. This satisfies the letter of the article for Germany but violates the universalizability required by Kant. A peace based on the unilateral vulnerability of one party is not a peace of right, but a peace of subjugation.

  Article 4 prohibits contracting national debt for external state affairs. Article 231 (the War Guilt clause) and the subsequent reparations schedule effectively imposed a massive external debt on Germany based on past state affairs (the war). This violates the article directly, binding the future economic sovereignty of the German state to the retrospective judgments of the victors.

  Article 5 forbids forcible interference in the constitution of another state. The Allied intervention in the Russian Civil War (north, Odessa, far east) constitutes a direct violation of this article. The Bolshevik government, however unrecognized, was a constituted power; intervention to alter its character by force contradicts the principle of non-interference essential to a federation of states.

  Article 6 prohibits acts of war during peace. While active combat ceased, the naval blockade of Germany continued well after the armistice, blurring the line between war and peace.

  Regarding the hypothesis that disarmament asymmetry, rather than reparations, is the more Kantian explanation for the settlement's collapse: this argument holds. For Kant, standing armies are an institutional provocation; they exist to threaten. By leaving France and Britain armed while disarming Germany, the treaty placed Germany in a state of nature relative to its neighbors. Reparations are a burden; unilateral disarmament is an existential invitation to aggression. A state that cannot defend itself against armed neighbors is not in a condition of right. The remedies implied differ significantly. Fixing the reparations burden (the Keynesian solution) requires economic restructuring and debt forgiveness. Fixing the disarmament asymmetry requires mutual security guarantees and general limitation of armaments. These remedies conflict in the 1919 context: France viewed German disarmament as the *precondition* for security, whereas Kant views mutual disarmament as the *constitutive element* of peace. The treaty prioritized French security over Kantian reciprocity, ensuring that the disarmament clause became a grievance rather than a guarantee.

  **The Definitive Articles**

  The first definitive article requires that the civil constitution of every state be republican. At the moment of signature on June 28, 1919, the Weimar Constitution had not yet been adopted (it was finalized in August). Technically, Germany was not a republic in Kant's sense at the moment it entered the peace. More importantly, Kant's republicanism is defined by representation and the separation of powers, not universal suffrage. While the Weimar system would eventually meet these criteria, the treaty's imposition undermined the separation of powers by subjecting the executive to external Allied control (e.g., regarding reparations compliance). A republic must be autonomous to commit to peace; a client state cannot.

  The second definitive article calls for a federation of free states (*foedus pacificum*). The League of Nations was incorporated into the treaty, binding the vanquished to an institution designed by the victors. Kant specifies a voluntary federation without coercive power to avoid a "soulless despotism." The League occupied an ambiguous middle ground: it had coercive mechanisms (sanctions) but no standing force to enforce them, and the United States—the principal architect—did not join. The interval from 1919 to 1939 suggests that Kant was correct to fear a world republic (the League's coercive aspirations without universal membership led to resentment), but incorrect to assume a non-coercive league could sustain peace. The League failed not because it became a despotism, but because it lacked the power to restrain aggressors, suggesting Kant underestimated the need for enforcement in a federation of sovereign states.

  The third definitive article establishes cosmopolitan right, limited to conditions of universal hospitality. This right allows a foreigner to visit, not to conquer. The mandate system violates this by granting victors administrative control over former colonies under the guise of civilization. Kant condemns the conduct of commercial states abroad when they treat foreign lands as *terra nullius* or opportunities for domination. The mandate system institutionalized this domination, framing it as a trust. It treated the inhabitants as wards rather than hosts, violating the condition of equality inherent in cosmopolitan right.

  **Second-Order Pieces**

  Kant's theory is prospective, grounded in right rather than retribution. This creates a tension with Article 231, which assigns moral guilt for the war. Kant offers no resources for a clause that adjudicates moral liability for past conflicts; his focus is on establishing a legal condition where war is impossible. By making peace contingent on an admission of guilt, the peacemakers turned a legal settlement into a moral tribunal. This retributive element is alien to Kant's framework, which seeks to bypass the question of who started the war in favor of securing a future where starting a war is legally untenable.

  The transcendental formula of public right states: "All actions relating to the right of other men are unjust if their maxim is not consistent with publicity." The negotiations at Versailles were notoriously closed, conducted by the "Big Four" without German participation. The maxim of the settlement—cripple Germany to ensure French security and extract payment—could not be publicly avowed without generating the resistance that ultimately defeated it. Keynes's publication of the critique is the publicity test in action. By bringing the secret maxims into the public sphere, he demonstrated that they could not withstand public scrutiny without undermining the peace they were meant to secure. The closed character of the negotiation was not just a diplomatic slight; it was a philosophical error that rendered the treaty unjust by Kant's own metric.

  **Where the Episode Embarrasses the Theory**

  Despite its diagnostic power, the Versailles episode exposes silences and weaknesses in Kant's text. First, Kant locates a guarantee of perpetual peace in nature's mechanism, specifically the spirit of commerce. He argues that commercial interdependence makes war too costly. Yet, Europe in 1914 possessed unprecedented commercial interdependence, which failed to prevent the war, and the post-1919 settlement disrupted these ties further. Kant's reliance on commerce as a pacifying force is empirically embarrassed by the twentieth century's history of economic rivalry turning violent.

  Second, the fifth preliminary article's prohibition on interference is tested by the Allied intervention in Russia. Kant's theory is silent on how a federation should handle a revolutionary state that explicitly seeks the overthrow of other constitutions. The Bolsheviks posed an ideological threat that the non-interference principle could not accommodate. A charitable reading might suggest that a state in civil war is not yet "constituted," but this stretches Kant's definition and reveals a gap in the theory regarding ideological existential threats.

  Third, Kant concedes that perpetual peace is an ideal approached only asymptotically. This renders the theory vulnerable to the charge of unfalsifiability. If the peace fails, one can always argue we simply have not approached the ideal closely enough. The collapse of Versailles between 1919 and 1939 could be dismissed by a Kantian as a failure of application rather than theory. This protective belt makes it difficult to use the essay as a rigorous predictive tool.

  **Constructive Amendments**

  A Versailles drafted under Kant's articles would have contained three specific amendments. First, a clause mandating immediate, mutual disarmament rather than unilateral German reduction. This was politically unavailable in 1919; French security fears demanded a buffer against German population superiority. This is a limit of the actors, not the theory; Kant's requirement was clear, but the political will for reciprocal risk was absent.

  Second, the removal of Article 231 and the replacement of reparations with a reconstruction fund financed by international bonds. This was unavailable due to British electoral pressure to "make Germany pay." This, too, is a limit of the actors; the theory demands a forward-looking economic order, but domestic politics demanded retribution.

  Third, a guarantee of United States membership in the League as a precondition for the treaty's validity. Without the US, the federation lacked the universality Kant deemed necessary. This was unavailable due to American isolationism and Senate reluctance to assume European obligations. This represents a limit of the actors' willingness to submit to international right.

  In all three cases, the theory prescribed conditions that were philosophically necessary but politically impossible given the trauma of the war. The limit lies not in Kant's logic, but in the capacity of traumatized polities to act rationally.

  **Verdict**

  The Treaty of Versailles is a **confirmation** of Kant's essay. It confirms the framework not because the peace held, but because the specific features Kant identified as destructive were the precise features that destroyed the settlement. The unilateral disarmament (violating Preliminary Article 3), the secret maxims (violating the Publicity Test), the lack of a genuine republic at signature (violating Definitive Article 1), and the coercive yet toothless League (misapplying Definitive Article 2) map perfectly onto the historical causes of the treaty's collapse.

  It is not a refutation, because Kant's specific prescription—a voluntary federation of republics with mutual disarmament—was never implemented. The League was a victors' club, not a *foedus pacificum*. The evidence that would move me off this verdict would be a historical instance where a settlement adhering strictly to Kant's six preliminary and three definitive articles nonetheless collapsed into total war within twenty years. Absent such a case, Versailles stands as a testament to the diagnostic precision of Kant's political theory: he named the poison, and the peacemakers, ignoring the label, drank it.
