  Here is the breakdown of your flatmate's logic, the competing theory, and the test case to separate them.

  ### 1. Her Verdict
  **Honest.**

  ### 2. The Rule She Is Actually Running
  **The Differential Marginal Cost Rule (Grafen's Handicap Principle).**

  She is operating on the modern evolutionary stability model (formalized by Alan Grafen in 1990). The core tenet is that a signal does not need to be *physically impossible* to fake (like the deer's roar); it only needs to be *evolutionarily unprofitable* to fake.

  Honesty is maintained if the **marginal cost** of the signal is higher for a low-quality individual than for a high-quality one. In your lizard case, even though the absolute bill (joules/pigment) is identical, the *fitness impact* is vastly different. For the strong male, the cost is a negligible slice of his budget; for the scrawny male, it is a devastating chunk. Because the scrawny male pays a higher *relative* price, he cannot afford to cheat without reducing his fitness below that of a truthful scrawny male. The signal is "strategically" honest, not "mechanically" honest.

  This rule fits her entire list:
  *   **Peacock/Bowerbird:** High absolute cost creates high marginal cost for weak males.
  *   **Sparrow:** Social beating is a "cost" that is marginally higher for weak males (who lose fights).
  *   **Nestling:** Begging reduces sibling survival; this cost is marginally higher for needier nestlings (who value siblings less relative to their own starvation).
  *   **Deer:** She accepts this as honest, but under this rule, she views the physiological constraint as just an extreme form of cost (infinite marginal cost).

  ### 3. The Competing Rule (That Fits the List but Fails the Lizard)
  **The Physical Constraint Rule (Index Signal Theory).**

  This rule posits that a signal is only honest if the signaller is **physically incapable** of producing a false signal. Honesty is guaranteed by anatomy or physiology, not by economic strategy.

  *   **Why it fits her list:** It perfectly explains the **Red Deer** ("body won't let him"). It can be retrofitted to the **Peacock** (weak males physically cannot grow the tail due to immune system links) and the **Bowerbird** (weak males lack the motor skills). It explains the **Sparrow** (a weak male physically cannot withstand the punishment required to maintain the bib).
  *   **Why it fails the Lizard:** Your prompt explicitly states "nothing mechanical stops a scrawny male from paying it." Under the Physical Constraint Rule, if the weak male *can* produce the signal, the signal is **Not Honest** (or at least, not guaranteed to be), because the mechanism preventing cheating is missing.

  ### 4. The Further Case (The Tie-Breaker)
  To definitively prove she is using **Marginal Cost** and not **Physical Constraint**, present her with a **Costless Index**.

  **The Case:**
  > "A male frog uses the **depth of his croak** to signal size. The depth is determined by the size of his vocal sac, which is physically impossible to fake (a small frog cannot make a deep sound). However, making the sound costs **zero energy** and carries **zero predation risk**."

  **The Divergence:**
  *   **Her Rule (Marginal Cost):** **Not Honest** (or "Not a Signal"). Handicap theory requires a *cost* to ensure stability. If there is no cost, there is no handicap. She would likely classify this as a "Cue" rather than an "Honest Signal," or argue that without cost, the system isn't a signalling equilibrium.
  *   **Competing Rule (Physical Constraint):** **Honest.** Since the signal is physically unfakeable (an Index), it conveys true information regardless of cost.

  If she calls the Lizard **Honest** (Marginal Cost) and the Frog **Not Honest** (Requires Cost), you have confirmed she is a **Handicap Purist**. If she calls the Frog **Honest**, she accepts Indexes, but her verdict on the Lizard will still tell you which mechanism she prioritizes when the two conflict.
