          2.  *Wisdom/Proportionality:* Does "wisdom" solve the prioritization problem (who to help first), or does it smuggle in an external standard of "worth" that does the real work?
          3.  *Piety/God:* How does piety fit if God's will doesn't define the good (anti-voluntarism)? What fixes the "worth" of God's happiness?
      *   **Core Question:** Are problems (2) and (3) the same problem in different clothes, or distinct?

  2.  **Deconstruct Leibniz's Position (Mental Sandbox):**
      *   *Context:* Leibniz is reacting against Hobbes (justice as power/command) and Pufendorf (justice as obedience to law). He wants an intellectualist account of natural law grounded in reason and metaphysics.
      *   *Definition:* Justice = Charity of the Wise. Charity = Universal Benevolence. Love = Rejoicing in the happiness of another.
      *   *Metaphysics:* Monads, perfection, harmony. Happiness is the feeling of increasing perfection.
      *   *Normativity:* For Leibniz, obligation isn't external coercion; it's rational necessity. To be rational *is* to seek the greatest good/perfection.
      *   *Wisdom:* Knowledge of the good. It calculates the best outcome (greatest harmony/perfection).
      *   *God:* God is the most perfect being. Loving God is loving the source of all perfection/harmony.

  3.  **Address Problem (1): Normativity of Love:**
      *   *User's worry:* Love sounds like an emotion (affect), not a duty.
      *   *Leibniz's move:* He defines love intellectually, not just emotionally. It's a *habit* (disposition) guided by reason.
      *   *The "Owed" part:* Leibniz doesn't abandon "owed." He redefines *right* (*jus*) as a moral power to demand what is conducive to the common good. Obligation comes from the rational necessity of pursuing perfection. If I am rational, I *must* will the good. Since the good is universal harmony, I *must* will the happiness of others (in proportion).
      *   *Key distinction:* It's not "I feel like it," it's "I recognize this as good, and as a rational agent, I am bound to pursue the good."

  4.  **Address Problem (2): Wisdom and Proportionality:**
      *   *User's worry:* Is "wisdom" just a placeholder for an external standard of worth?
      *   *Leibniz's move:* Wisdom *is* the knowledge of that standard. The standard is "perfection" or "harmony."
      *   *Is it smuggling?* Yes and no. Charity provides the *motive* (wanting the good for others). Wisdom provides the *measure* (how much good, to whom, when).
      *   *The Standard:* The standard isn't external to the system; it's metaphysical. Perfection is reality/essence. Wisdom perceives the metaphysical hierarchy. So, charity isn't doing the *discriminating* work alone; it needs wisdom. But without charity, wisdom is cold calculation. Without wisdom, charity is blind sentiment. They are co-constitutive of justice.
      *   *Answer:* It's not a trick, but it admits that charity *alone* is insufficient. Justice requires the *conjunction* of benevolence and knowledge of the good.

  5.  **Address Problem (3): Piety and God:**
      *   *User's worry:* If God's will doesn't make the good, why is loving God's happiness the peak of justice? What fixes God's worth?
      *   *Leibniz's Anti-Voluntarism:* God wills the good *because* it is good (intellectualism). The good is grounded in eternal truths/essences.
      *   *God's Worth:* God is the *most perfect* being (maximum reality). Therefore, God's happiness contributes the most to universal harmony.
      *   *Piety:* Loving God isn't just obeying Him; it's aligning with the source of all perfection. By promoting God's glory (which is the manifestation of perfection), we promote the universal good.
      *   *Connection to (2):* The standard of "worth" in (2) is "perfection." God is maximal perfection. So (2) and (3) rely on the same metric.

  6.  **Synthesize: Are (2) and (3) the same problem?**
      *   *Similarity:* Both rely on the metric of "perfection/harmony" to determine "worth."
      *   *Difference:* (2) is about *application* among finite beings (epistemic/practical problem). (3) is about *foundation* (metaphysical/theological problem).
      *   *Verdict:* They are structurally identical (both rely on the metaphysics of perfection) but distinct in scope. (3) grounds (2). If you solve the metaphysics of perfection (3), you solve the standard for wisdom (2).

