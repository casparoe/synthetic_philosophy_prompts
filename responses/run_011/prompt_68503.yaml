  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Text:** Leibniz's definition of justice as "the charity of the wise man" (*justitia est caritas sapientis*). This comes from his *Codex Iuris Gentium* or related unpublished essays (likely *Elements of Natural Law* or similar).
      *   **User's Summary:** A loose paraphrase of a key paragraph outlining the definition.
