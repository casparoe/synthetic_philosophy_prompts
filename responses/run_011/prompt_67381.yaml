answer: |-
  You have identified a genuine and pervasive manoeuvre in historical argumentation, one that sits uncomfortably between sound methodological pluralism and rhetorical evasion. To answer your primary question directly: there is no single, canonical term in the philosophy of history that isolates this specific dialectical pattern as a distinct fallacy or technique. It is frequently practised, occasionally criticised, but rarely named.

  It sits in the vicinity of several established concepts, none of which capture it perfectly. You are correct to dismiss **Motte-and-Bailey**. In a Motte-and-Bailey, one claim is modest and defensible (the motte) and the other is bold and desirable (the bailey); the arguer retreats to the modest claim when attacked. In your pattern, both claims are bold and desirable in different registers (narrative drama vs. scientific law), and neither is treated as a retreat.

  You are also right to hesitate over **Equivocation**. Classical equivocation relies on a word changing its *sense* (intension). Here, the sense of "caused" or "inevitable" remains stable; what changes is the *extension* of the object to which it is applied (the token event vs. the type of event). In logic, this is sometimes called **ambiguity of reference**, but that is too dry to capture the dynamic, defensive movement you describe.

  The closest philosophical neighbour is the theory of **Contrastive Explanation** (associated with Bas van Fraassen). To explain an event is to explain why *P* happened rather than *Q*. Your historian is shifting the *Q* without telling the audience. When defending contingency, the question is "Why *this* revolution rather than *that* one?" (Answer: The courier). When defending structure, the question is "Why *a* revolution rather than *stability*?" (Answer: Fiscal exhaustion). The fallacy lies in answering the second question while pretending to have answered the first.

  ### The Coinage: Explanatory Scope-Drift

  Since no established name exists, I propose **Explanatory Scope-Drift**.

  **Definition:**
  Explanatory Scope-Drift occurs when a historian (or social scientist) defends a causal claim by unmarked shifting of the *explanandum* (the phenomenon to be explained) between a specific token event and a general class of events. The drift is characterised by the syntactic stability of the claim ("The Revolution was inevitable") coupled with a semantic shift in the resolution of the subject ("The Revolution" as a specific sequence of weeks vs. "The Revolution" as a socio-political rupture). The shift is triggered defensively: when the claim is challenged at one resolution, the defence is mounted at another, without acknowledging that the object of inquiry has changed size.

  ### Boundary Conditions: Legitimate Practice vs. Evasion

  You ask where the line falls between this evasive pattern and legitimate multi-scale explanation. This is the crucial distinction. Historians like Fernand Braudel or E.P. Thompson routinely argue that structures constrain agency while agency animates structures. This is not drift; it is synthesis.

  To distinguish **Explanatory Scope-Drift** (the fallacy) from **Conjunctural Analysis** (the legitimate method), three boundary conditions must be met. If a historian violates these, they are drifting; if they observe them, they are practising good history.

  **1. Declarative Transparency**
  *   **Legitimate:** The historian explicitly marks the scale of description. They write: "At the level of demographic pressure, the outcome was highly probable; at the level of diplomatic protocol, it remained contingent until July 1914." The shift is a feature of the argument, not a bug.
  *   **Drift:** The scale is implicit and fluid. The historian writes "The war was inevitable," and only specifies which "war" (the specific conflagration or the general type) when challenged. The vocabulary ("inevitable") remains constant while the scope contracts or expands to absorb the critique.

  **2. Mechanism Coupling**
  *   **Legitimate:** The historian explains *how* the structural conditions make the contingent details matter. They show the interface. For example: "Fiscal exhaustion meant the state could not absorb the shock of the courier's delay." Here, structure and contingency are coupled; one does not merely replace the other in defence.
  *   **Drift:** The two levels are insulated from one another. They take turns defending the conclusion but do not interact. The structure explains the outcome *despite* the contingency, or the contingency explains the outcome *despite* the structure. They are used as alternative shields rather than interlocking gears.

  **3. Vulnerability to Falsification**
  *   **Legitimate:** The historian accepts risk at a specific scale. They might argue: "While a revolution was likely (structural), it would not have occurred in October without the specific return of Lenin (contingent)." This claim can be proven wrong if evidence shows Lenin's return was irrelevant.
  *   **Drift:** The position is rendered unfalsifiable. If you prove Lenin didn't matter, the historian says, "Someone else would have done it" (structural retreat). If you prove structural conditions weren't unique, they say, "But without Lenin's specific rhetoric, the timing would have failed" (contingent retreat). The conclusion ("The Bolshevik seizure of power was caused by X") remains asserted, but the "X" and the "power" subtly change definition to ensure the claim never lands on ground where it can be tested.

  ### Summary

  The pattern you have identified is a form of **referential equivocation** managed through **unmarked scale-shifting**. It exploits the fact that historical events are simultaneously unique tokens and instances of general types.

  While **Conjunctural Analysis** acknowledges this duality and seeks to integrate it, **Explanatory Scope-Drift** exploits it to immunise the narrative from critique. The tell-tale sign is not the use of both arguments, but the *sequence* of their deployment: if the structural argument appears primarily to defend against attacks on the contingent narrative, and the contingent narrative appears primarily to defend against attacks on structural determinism, you are witnessing Scope-Drift. The historian is not describing the past; they are managing the resolution of their own liability.
