      *   *Conflict 3-4:* Inconsistent. View 3 says author repudiation changes nothing (author doesn't have last word). View 4 says author *does* have the last word.
      *   *View 5 (Anachronistic Meaning):* 1911 novel about Anthropocene (term/concept didn't exist).
      *   *Conflict 1-5:* Direct contradiction. If meaning is what the author intended to convey (1), and the author never heard of the Anthropocene (5), they could not intend to convey it. Therefore, the text cannot be *about* the Anthropocene in terms of meaning. It might have *significance* to the Anthropocene, but View 6 rejects that distinction.
      *   *Conflict 6 (Reject Hirsch):* Hirsch separates Meaning (authorial, fixed) from Significance (readerly, shifting).
