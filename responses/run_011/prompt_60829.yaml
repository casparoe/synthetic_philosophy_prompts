      *   *Conflict 1-2:* If meaning is determined by intention (1), but we are barred from looking at evidence of intention outside the text (2), how do we know the intention? If the text fails to convey the intention, View 1 says meaning is the intention (failed communication?), while View 2 says meaning is what's in the text. This is a major tension. Wimsatt/Beardsley argue *against* View 1. Holding both is notoriously difficult (often called "hypothetical intentionalism" vs "actual intentionalism").
      *   *View 3 (Repudiation doesn't matter):* Text has left the author. This aligns with Barthes ("Death of the Author") or textual autonomy.
      *   *Conflict 1-3:* If meaning is settled by what the author intended (1), why does a later repudiation not matter? If the author says "I didn't mean X," and View 1 says meaning is what they intended, then their current statement about their intention should carry weight. View 3 suggests the text's meaning is fixed at publication or independent of later authorial whim, which contradicts the primacy of the author's mental state in View 1.
      *   *View 4 (Practiced Authority):* User allowed a novelist to close a dispute with an answer.
      *   *Conflict 1-4:* Consistent. If View 1 is true, asking the author is the best way to settle meaning.
