      *   **Task:** Draft a memo/letter to be read aloud to the school board in 5 weeks.
      *   **Topic:** Voting on renewing a predictive analytics tool (early warning system for 9th graders falling off-track).
      *   **Conflict:** Three incompatible promises/constraints:
          1.  Equal accuracy (equal false positive/negative rates across groups).
          2.  No use of race (not even for thresholds).
          3.  Calibration fairness (flagged kids should have similar actual risk regardless of group, currently disputed by student complaint).
      *   **Vendor Data:** Base rates differ (18% vs 31% off-track rate). Tool is calibrated (same risk score = same risk), but outcomes differ.
      *   **Proposed Fixes:**
          *   Board member: Proportional flagging (matches enrollment share) -> requires race-aware thresholds (violates promise 2).
          *   Another member: Add 300 slots (budget issue).
      *   **Requirements:**
          *   Straight continuous prose (no headings, bullets, bold, tables).
          *   Recommendation in the first paragraph.
          *   Length: About a page and a half (when read aloud, roughly 750-900 words).
          *   Content:
              *   Choose a recommendation (Renew, Renew with Conditions, Don't Renew).
              *   Identify which promise to drop.
              *   Explain False Positive/Negative in this specific context (tutoring slots, not punishment).
              *   Address the "proportional flagging" fix (is it actually worse for someone?).
              *   Be honest about the case for the dropped promise.
              *   Include a timeline (vote in 5 weeks, scores in August).
              *   No external references/studies (explain everything in-text).
      *   **Tone:** Honest, concrete, persuasive, student voice but professional enough for a board memo.

  2.  **Deconstruct the Technical/Ethical Problem:**
      *   **The Impossibility Theorem:** In predictive fairness, you generally cannot have Calibration (promise 3-ish), Equal False Positive/Negative Rates (promise 1), and Base Rate Differences (which exist here: 18% vs 31%) all at once without using group membership (promise 2).
      *   **Context:** The "error" is about resource allocation (tutoring slots).
          *   *False Positive:* Flagged for tutoring, but wouldn't have fallen off-track anyway. Cost: Wasted slot, stigma, time.
          *   *False Negative:* Not flagged, falls off-track. Cost: Student fails/drops out, missed intervention.
          *   *Which is worse?* In criminal justice, False Positive (jailing innocent) is worse. In healthcare/intervention, False Negative (missing sick patient) is usually worse. Here, missing a kid who fails (False Negative) seems worse than giving tutoring to a kid who was fine (False Positive), *but* slots are scarce (120 slots). So a False Positive steals a slot from a True Positive.
      *   **The Promises:**
          1.  Equal Error Rates (FPR/FNR equal across groups).
          2.  Blindness (No race used).
          3.  Calibration/Predictive Parity (Flagged kids have same risk).
      *   **The Reality:** Because base rates differ (18% vs 31%), you cannot have Equal Error Rates and Calibration simultaneously without using Race (thresholds).
      *   **Proportional Flagging:** Setting cutoffs so flagged kids match enrollment share. This ignores risk. It flags low-risk kids in overrepresented groups and misses high-risk kids in underrepresented groups. It violates fairness based on need.
      *   **Recommendation Strategy:**
          *   Must pick a lane.
          *   Dropping Promise 1 (Equal Error Rates) is usually the mathematically necessary move if keeping Promise 2 (Blindness) and Promise 3 (Calibration/Utility).
          *   Alternatively, Drop Promise 2 (Allow race-aware thresholds) to keep Equal Error Rates.
          *   Alternatively, Drop Promise 3 (Calibration) - but the vendor says it *is* calibrated.
          *   *Best path for a student advocate:* Prioritize getting help to those most likely to fail (Utility/Calibration) while acknowledging the disparity. Don't renew unless we drop the "Equal Error Rates" promise because it's mathematically impossible with blind algorithms and different base rates. Or, renew with conditions to increase slots (addressing scarcity).
          *   *Actually, the prompt asks to tell them which promise to stop making.*
          *   If we keep Blindness (2) and Calibration (3), we must drop Equal Error Rates (1).
          *   If we keep Blindness (2) and Equal Error Rates (1), we must drop Calibration (3) (meaning the score means different things for different groups).
          *   If we keep Equal Error Rates (1) and Calibration (3), we must drop Blindness (2) (use race-aware thresholds).
          *   *Student Perspective:* The student complaint is about "profiling" (Calibration/Predictive Parity issue). The Board promised Equal Error Rates. The Super promised Blindness.
          *   *Recommendation:* Renew with conditions. Condition 1: Increase slots (reduce scarcity pressure). Condition 2: Acknowledge that Equal Error Rates (Promise 1) is impossible without violating Blindness (Promise 2) given the base rate differences. We must prioritize finding the kids most likely to fail (Calibration) over equal error rates.
          *   *Wait, the prompt asks to "tell the board which of the three promises to stop making".*
          *   I need to argue that Promise 1 (Equal Error Rates) is the one to drop if we keep Blindness. Or Promise 2 (Blindness) is the one to drop if we want Equal Error Rates.
          *   *Legal/Political Reality:* Schools often cannot use race explicitly (Promise 2) due to legal constraints (depending on jurisdiction, but generally safe to assume strict scrutiny). So Promise 2 is likely the hard constraint.
          *   *Math Reality:* If Base Rates differ and Algorithm is Blind, you cannot have Equal Error Rates.
          *   *So:* Drop Promise 1. Acknowledge that False Negatives (missing kids who fail) are the real danger here, not False Positives (wasted tutoring).
          *   *Proportional Flagging:* This is bad because it ignores risk. It sends tutoring to low-risk kids just to fill a quota.
          *   *Timeline:* Vote now, implement changes by August.

  3.  **Drafting - Section by Section (mental outline):**
      *   **Para 1:** Recommendation. Renew with conditions. Drop the promise of equal error rates. Increase slots.
      *   **Para 2:** Context on the tool and the three promises. State clearly they are incompatible.
      *   **Para 3:** Define False Positive/Negative in this context. Explain why False Negative is worse (missing help vs wasted slot).
      *   **Para 4:** Address the math. Base rates differ (18% vs 31%). If blind, error rates *must* differ to maintain calibration.
      *   **Para 5:** Address the "proportional flagging" fix. Explain why it hurts high-risk kids.
      *   **Para 6:** Timeline and conclusion. Vote now, fix thresholds/slots by August.

  4.  **Refining the Tone:**
      *   Needs to be continuous prose. No breaks.
      *   Needs to sound like a smart junior student (clear, direct, not overly academic but precise).
      *   Needs to be honest about the trade-off (why someone would want Equal Error Rates).
      *   Length check: A page and a half single spaced is roughly 750-900 words. I need to ensure it's dense enough but readable.

  5.  **Addressing Specific Prompt Requirements:**
      *   *Recommendation in first paragraph.*
      *   *No headings/bullets/bold.*
      *   *Explain False Positive/Negative clearly.*
      *   *Explain why proportional flagging is worse for somebody.*
      *   *Explain which promise to drop and why.*
      *   *Timeline included.*
      *   *No external citations.*

  6.  **Drafting - Step-by-Step:**
      *   *Start:* I recommend we renew the contract only if we formally withdraw the promise of equal false positive and false negative rates across student groups and commit to funding an additional three hundred tutoring slots by August.
      *   *Elaborate:* We are holding three beliefs that cannot coexist.
      *   *Define Errors:* In court, false positive is bad. Here, false negative (missing a kid who fails) is the catastrophe. False positive is just wasted resources.
      *   *The Math:* Because one group fails at 31% and another at 18%, a blind test cannot catch the same percentage of each group without flagging different risk levels.
      *   *Proportional Flagging:* This matches enrollment, not risk. It sends help to safe kids in one group while leaving drowning kids in another.
      *   *The Choice:* We must keep blindness (legal/political) and calibration (helping those at risk). We must drop equal error rates.
      *   *Honesty:* Why do people want equal error rates? To avoid systemic bias feeling. But mathematically it forces us to miss high-risk kids.
      *   *Timeline:* Vote in 5 weeks. Data in August. Need decision now to configure tool.

  7.  **Review against Constraints:**
      *   *Continuous prose?* Yes.
      *   *Recommendation first?* Yes.
      *   *Length?* Need to expand on the reasoning to hit ~1.5 pages (approx 800 words).
      *   *Tone?* Respectful but firm.

  8.  **Self-Correction during drafting:**
      *   *Check:* Did I explain why proportional flagging is worse? Yes, it ignores actual risk.
      *   *Check:* Did I explain the error types? Yes, emphasized scarcity makes False Positives steal slots from True Positives.
      *   *Check:* Did I pick a promise to drop? Yes, Promise 1 (Equal Error Rates).
