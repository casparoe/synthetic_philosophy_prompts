answer: |-
  Harsanyi's Aggregation Theorem is a representation result, not a derivation of utilitarianism. Mathematically, it states that if individual preferences and social preferences over prospects satisfy the von Neumann–Morgenstern (vNM) axioms, and if the social preference satisfies **Pareto Indifference** (if every individual is indifferent between two prospects, society is indifferent), then the social utility function is an affine combination of individual utility functions: $W = \sum a_i U_i + b$. If the condition is strengthened to **Strong Pareto** (if everyone weakly prefers $A$ to $B$, society does; if everyone strictly prefers $A$, society strictly does), the coefficients $a_i$ must be non-negative.

  The theorem does not pin down the magnitudes of $a_i$. Individual vNM utilities are unique only up to positive affine transformation ($U_i' = c_i U_i + d_i$). Without a common scale for interpersonal comparison, the coefficients are arbitrary; scaling an individual's utility scale inversely scales their weight. Consequently, the theorem cannot justify equal weights. To claim equal weights are required, one must add a normative premise fixing the interpersonal scale. This is the work done by the **Veil of Ignorance** or **Impartial Observer** argument. It assumes an observer who has an equal probability of being any member of society. This assumption identifies the weights ($a_i = 1$) by equating ethical weight with probabilistic likelihood. This is not a mathematical consequence of aggregation but a separate ethical axiom regarding impartiality.

  Regarding prioritarianism (maximizing $\sum f(U_i)$ for concave $f$): this violates the theorem's structure. The theorem requires the social preference to satisfy vNM axioms given individual vNM preferences. A non-linear transformation of utility changes risk attitudes. If individuals are risk-neutral, a prioritarian society becomes risk-averse. This violates Pareto over prospects: individuals might unanimously prefer a risky prospect to a safe one, but the concave transformation leads society to prefer the safe one. This tension survives even if utility is merely preference satisfaction, because the conflict arises from the vNM structure (linearity in probabilities), not the interpretation of utility as well-being.

  The dynamic problem you encountered concerns **opinion pooling**. When individuals share a utility function but hold different subjective probabilities, Harsanyi aggregation implies a linear pool of probabilities: $P_S(s) = \sum w_i P_i(s)$. The conflict arises with **External Bayesianism**, the property that pooling and updating commute. A procedure satisfies this if pooling posteriors yields the same result as updating the pooled prior. Linear pooling fails this; logarithmic pooling succeeds.

  Consider two agents, 1 and 2, and two states, $s_1$ and $s_2$. They share a utility function $u(s_1)=10, u(s_2)=0$.
  **Priors:** $P_1(s_1) = 0.8$, $P_2(s_1) = 0.2$.
  **Weights:** $w_1 = w_2 = 0.5$.
  **Social Prior:** $P_S(s_1) = 0.5(0.8) + 0.5(0.2) = 0.5$.
  **Expected Utility:** $EU_1 = 8$, $EU_2 = 2$, $EU_S = 5$.

  Suppose evidence $E$ arrives with likelihoods $P(E|s_1) = 2/3$ and $P(E|s_2) = 1/3$.
  **Procedure A (Update then Pool):**
  Agent 1 Posterior: $P_1(s_1|E) = \frac{(2/3)0.8}{(2/3)0.8 + (1/3)0.2} = \frac{1.6}{1.8} = 8/9$.
  Agent 2 Posterior: $P_2(s_1|E) = \frac{(2/3)0.2}{(2/3)0.2 + (1/3)0.8} = \frac{0.4}{1.2} = 1/3 = 3/9$.
  Social Posterior (Linear Pool): $0.5(8/9) + 0.5(3/9) = 5.5/9 \approx 0.611$.

  **Procedure B (Pool then Update):**
  Social Prior: $0.5$.
  Social Posterior: $P_S(s_1|E) = \frac{(2/3)0.5}{(2/3)0.5 + (1/3)0.5} = \frac{1/3}{1/2} = 2/3 \approx 0.667$.

  **Mathematical Claim:** $0.611 \neq 0.667$. Linear pooling does not commute with conditionalization.

  Your algebraic intuition is correct regarding the mechanism. For the linear pool to match the updated pool, the weights must change. The updated weight $w_i'$ required to maintain consistency is proportional to $w_i P_i(E)$. In this example, $P_1(E) = 0.6$ and $P_2(E) = 0.4$. The weights shift to $w_1' = 0.6, w_2' = 0.4$. The aggregate redistributes weight toward the agent who assigned higher probability to the evidence (found it less surprising). However, standard social choice treats weights as ethical constants, not epistemic variables. Fixing weights creates dynamic inconsistency.

  **Logarithmic Pooling:** $P_S(s) \propto \prod P_i(s)^{w_i}$.
  This procedure satisfies External Bayesianism. It also respects unanimity (if all $P_i$ agree, $P_S$ agrees). However, it cannot be presented as a Harsanyi-style weighted sum of individual utilities. Harsanyi aggregation requires linearity in probabilities ($P_S = \sum w_i P_i$). Logarithmic pooling is non-linear. Thus, a society using log-pooling cannot be represented as maximizing a weighted sum of individual vNM utilities. It violates the linearity axiom of the aggregation theorem.

  **Interpretive Claim:** This dynamic problem embarrasses the interpretation of Society as a single rational agent over time. A single Bayesian agent must satisfy External Bayesianism. If society uses linear pooling with fixed weights, it behaves as a sequence of different agents indexed by the information set, or as a committee that renegotiates weights upon every news arrival. It does not embarrass utilitarianism per se, unless utilitarianism requires the social entity to possess diachronic rationality identical to an individual. If utilitarianism is merely a synchronous rule for aggregating preferences at a moment, linear pooling remains valid despite dynamic inconsistency.

  The tension lies in whether we view the social welfare function as describing a collective mind or a compromise mechanism. The mathematics shows linear pooling violates the coherence constraints of a single mind. The ethics determines whether that violation matters.

  Bottom line: The specifically utilitarian content is supplied not by the aggregation theorem, but by the impartial observer assumption that fixes interpersonal utility scales to equal weights.
