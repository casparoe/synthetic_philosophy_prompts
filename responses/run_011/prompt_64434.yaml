prompt: |-
  I'm building the causal-attribution layer for an incident-review system used by a fleet of semi-autonomous warehouse robots — software that reads a timeline plus a list of standing duties and spits out the absences that caused the bad outcome ("the interlock was never re-armed", "nobody looked at the pallet sensor for eleven minutes"). Before I lock down what that layer is allowed to call a cause, I want the general spec for an account of causation by omission, so the ontology isn't just whatever the engineers half-remember from one philosophy elective.

  Write the desiderata: what any adequate theory of omissive causation has to deliver. For each requirement give the case or consideration behind it — don't just name it, show me the case that forces it. I want the list to cover at least:

  - that we seem to say true causal things about absences at all, and separately that we don't say them about just any absence (my neighbour's failure to water my plants isn't a cause of their dying, even though the dying depends on it in the usual way)
  - redundant omissions: two people both under a duty to hit the stop button, neither does, and the machine ruins the batch
  - double prevention and prevention-of-prevention, where the alleged cause is the absence of an absence
  - omissions by artifacts with no intentions and arguably no duties — a sensor that fails to fire, a breaker that doesn't trip — and whether those get treated the same way or a different way, and why that would be principled rather than ad hoc
  - whether the account needs a mind, a norm, or somebody's interests to select which of the endless non-events are the relevant ones, and if it does, whether that's a defect or just the honest truth about the topic
  - consistency with whatever our best physics says about there being no negative events or absences out there in the world to serve as relata

  Then sort the list for me. Which requirements are genuinely non-negotiable for a theory to be worth the name, and which are really just the pet constraints of one camp — transitivity, say, or the insistence that causation always run through a physical process, or the demand that the account be reductive and non-normative all the way down. And this is the part I care about most: is any subset of them jointly unsatisfiable? If demanding a few of these at once is impossible, say so explicitely, say which ones collide, and say which one I should be the first to drop given that I have to actually ship something that assigns responsibility. Finally, tell me which single requirement eliminates the most candidate theories — I want to know where the real action is.

  Two house rules. First, I've coined a distinction for this project and I want you to either use it or tell me it's worthless: call an absence *duty-anchored* when some agent or artifact stood under an obligation, a design intent, or a normal function to bring the missing event about, and *free-floating* when nothing does (there being no second moon, nobody having poured arsenic in the coffee, the absence of a heart attack that was never coming). Does a theory that admits only duty-anchored absences as genuine causes survive the rest of your list, or does it break on one of the cases above? Second, close with a very short scorecard — counterfactual/difference-making accounts, process or conserved-quantity accounts, and the view that negative-causation talk is a useful fiction or a manner of speaking backed by positive facts — a few lines each against the list. No bibliography, no reading list, no page numbers; I'll chase down the sources myself if the scorecard is interesting.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Goal:** Create a spec/desiderata list for a theory of causation by omission, specifically for an incident-review system for semi-autonomous warehouse robots.
      *   **Context:** The system needs to identify absences that caused bad outcomes (e.g., "interlock not re-armed").
      *   **Requirements:**
          *   List desiderata with specific cases/considerations for each (not just names).
          *   Cover specific topics: truth of omissive claims vs. selectivity, redundant omissions, double prevention, artifacts/no intentions, role of norms/minds/interests, consistency with physics (no negative events).
          *   Sort the list: Non-negotiable vs. camp-specific constraints.
          *   Identify incompatibilities: Are any jointly unsatisfiable? Which to drop for a responsibility-assigning system?
          *   Identify the "killer" requirement (eliminates most theories).
          *   **House Rule 1:** Use the user's distinction: *duty-anchored* vs. *free-floating* absences. Evaluate if a theory admitting only duty-anchored absences survives.
          *   **House Rule 2:** End with a short scorecard for three specific theory types (Counterfactual, Process/Conserved-Quantity, Fictionalist/Positive-Facts).
          *   **Constraints:** No bibliography, no reading list, no page numbers.

  2.  **Deconstruct the Desiderata (The "What"):**

      *   *Selectivity/Truth:* We say omissions cause things, but not *all* omissions. (Case: Plants dying vs. Neighbor not watering).
      *   *Redundancy:* Two people fail to act, outcome happens. (Case: Two safety officers, neither hits stop).
      *   *Double Prevention:* Absence of an absence. (Case: A guard fails to stop a saboteur who would have stopped the machine).
      *   *Artifacts:* Sensors/breakers failing. Do they count like human omissions? (Case: Sensor doesn't fire).
      *   *Norms/Minds:* Do we need a norm to pick the cause? Is this a bug or feature?
      *   *Physics:* Physics doesn't have "nothingness." How to reconcile?

  3.  **Drafting the Desiderata (incorporating House Rule 1):**

      *   *Desideratum 1: Truth without Explosion.* We need to affirm omissive causation is real discourse, but avoid the "infinite causes" problem.
          *   *Case:* The plants. If I don't water them, they die. If the Queen of England doesn't water them, they die (counterfactually). Only my failure is the cause.
          *   *Integration:* This is where *duty-anchored* vs. *free-floating* comes in.
      *   *Desideratum 2: Redundant Omissions.* Handling overdetermination by absence.
          *   *Case:* Two supervisors, both required to check. Neither checks. Explosion happens. Both must be causal, or neither, but "neither" is unacceptable for responsibility.
      *   *Desideratum 3: Double Prevention.* Handling chains of prevention.
          *   *Case:* Safety system prevents override. Override prevents stop. If safety system is absent (omission), override happens, stop is prevented. Is the absence of the safety system a cause?
      *   *Desideratum 4: Artifact Agency.* Non-intentional omissions.
          *   *Case:* A fuse doesn't blow. No mind, but a function. Is this an omission?
          *   *Integration:* *Duty-anchored* fits here (design intent = duty).
      *   *Desideratum 5: Normative Dependence.* Acknowledging the role of expectations.
          *   *Case:* Why is the neighbor's non-watering not a cause? Because they had no duty.
          *   *Question:* Is this a defect? For a responsibility system, it's a feature.
      *   *Desideratum 6: Physical Compatibility.* No "negative particles."
          *   *Case:* Physics describes energy transfer, not "lack of energy transfer."

  4.  **Sorting and Evaluating Incompatibilities (The "Analysis"):**

      *   *Non-negotiable:* Selectivity (otherwise the system outputs garbage), Physical Compatibility (can't contradict reality), Artifact handling (robots are artifacts).
      *   *Camp Constraints:* Transitivity (often fails in omissions), Purely Physical/Reductive (hard to do with omissions), Mind-independence (norms seem necessary).
      *   *The Clash:* The big clash is between *Physical Compatibility* (no negative events) and *Truth of Omissive Claims* (we talk as if they exist). Also, *Selectivity* usually requires *Norms*, which clashes with *Mind-Independence*.
      *   *The "Drop" Recommendation:* For a responsibility system, drop "Mind-Independence/Reductivism." You *need* norms to assign responsibility. Drop the insistence that causation must be purely physical energy transfer.
      *   *The "Killer" Requirement:* Selectivity (The "Neighbour" case). Most simple counterfactual theories fail here because they make everything a cause.

  5.  **Refining the "Duty-Anchored" Distinction (House Rule 1):**

      *   Does a theory admitting *only* duty-anchored absences work?
      *   *Pros:* Solves the Selectivity problem immediately. Fits the responsibility context perfectly. Handles artifacts (design function = duty).
      *   *Cons:* Might struggle with "natural" omissions if the system ever needs to analyze them (e.g., "rain didn't fall" causing a fire, where no one had a duty to make rain). But for a *warehouse robot system*, rain isn't relevant.
      *   *Verdict:* It survives the specific cases provided *if* we define "duty" broadly enough to include artifact function. It breaks only if we demand a theory of *universal* causation, but for this specific engineering task, it's robust.

  6.  **Developing the Scorecard (House Rule 2):**

      *   *Counterfactual:* Good at dependence, bad at selectivity (needs norms added).
      *   *Process/Conserved Quantity:* Good at physics, bad at omissions (can't find the process in a non-event).
      *   *Fictionalist/Positive Facts:* Good at physics, preserves truth as pragmatic, but might feel like dodging the bullet for responsibility assignment.

  7.  **Review and Refine:**

      *   *Tone:* Professional, precise, engineering-adjacent but philosophically rigorous.
      *   *Check Constraints:* Did I use the distinction? Yes. Did I sort the list? Yes. Did I identify the clash? Yes. Scorecard included? Yes. No bibliography? Yes.
      *   *Self-Correction on "Double Prevention":* Make sure the example is clear. A fails to prevent B, who would have prevented C. So A's omission causes C.
      *   *Self-Correction on "Physics":* Ensure I don't say physics is wrong, but that the *ontology* of causation might not map 1:1 to physics.
      *   *Focus:* Keep the focus on the *incident-review system*. The theory must serve the goal of assigning responsibility.

  8.  **Final Polish:** Check the flow. Ensure the "Duty-Anchored" term is integrated naturally. Ensure the "Joint Unsatisfiability" section is explicit.

      *(Self-Correction during drafting)*: I need to be careful about the "Physics" desideratum. It's not that the theory must be *reducible* to physics, but it must be *consistent* with it. I should frame it as "Ontological Parsimony" or "Physical Consistency."
      *(Refining the "Drop" advice)*: Since the user is building a *responsibility* system, insisting on a norm-free theory is suicide. I must advise them to drop the "No Norms" requirement.

      *(Refining the "Killer" Requirement)*: The "Selectivity" requirement (Neighbour case) is the standard filter. But for *this* user, the "Duty-Anchored" constraint *is* the solution to selectivity. So the killer requirement for *general* theories is Selectivity, but for *their* project, the killer is whether the theory can accommodate Norms. I will stick with Selectivity as the general philosophical killer, but note how their distinction solves it.

      *(Final check on House Rule 1)*: "Does a theory that admits only duty-anchored absences as genuine causes survive the rest of your list?" I need to answer this explicitly. Yes, it survives, provided "duty" covers artifact function.

      *(Final check on House Rule 2)*: Keep it very short.

      Let's write it.
answer: |-
  ### Desiderata for an Account of Omissive Causation

  **1. The Selectivity Constraint (The Neighbour Case)**
  *The Requirement:* The theory must distinguish between absences that are causes and absences that are merely background conditions, despite identical counterfactual dependence.
  *The Case:* Your plants die because you didn't water them. Counterfactually, they also would have lived if the Queen of England had watered them, or if it had rained. Yet, we say your failure caused the death, while the Queen's failure and the absence of rain did not. A theory that treats all necessary conditions as causes explodes the ontology with infinite "causes" (e.g., "the absence of a meteor strike").
  *Relevance to Duty-Anchored:* This is the primary motivation for your distinction. A *duty-anchored* account solves this immediately: you had a duty; the Queen did not.

  **2. The Redundancy Constraint (The Dual-Supervisor Case)**
  *The Requirement:* The theory must handle overdetermination by omission without exonerating all parties.
  *The Case:* Two safety officers, Alice and Bob, are both required to hit the emergency stop if temperature exceeds 100°. Temperature hits 150°. Neither hits the stop. The reactor melts. Counterfactually, if Alice had acted, the melt is prevented (regardless of Bob). If Bob had acted, the melt is prevented (regardless of Alice). In standard counterfactual logic, neither is a "but-for" cause because the outcome doesn't change if only one is removed from the equation (since the other still didn't act). A viable theory must identify both omissions as causal to support joint liability.

  **3. The Artifact Function Constraint (The Dead Sensor Case)**
  *The Requirement:* The theory must account for omissions by entities without minds but with functions.
  *The Case:* A thermal fuse fails to trip during a surge. There is no intention, no moral obligation, and no mind. Yet, in an incident review, "the fuse failed to trip" is cited as a cause. If the theory requires a moral agent, it fails here. If it treats the fuse like a rock (which also "failed to trip"), it loses the distinction.
  *Relevance to Duty-Anchored:* Your distinction survives here only if "duty" is generalized to "design function" or "teleological role." The fuse is *duty-anchored* by its engineering spec; the rock is *free-floating*.

  **4. The Double-Prevention Constraint (The Unblocked Saboteur Case)**
  *The Requirement:* The theory must handle chains where a cause is the absence of a preventer.
  *The Case:* A guard is posted to stop saboteurs. The guard falls asleep (omission). A saboteur enters and cuts the power. The guard's omission caused the power cut. But structurally, the guard was a *prevention* mechanism. His absence allowed the saboteur to act. This is "double prevention" (the absence of a prevention). Some theories struggle here because there is no physical energy transfer from the sleeping guard to the cut wire.

  **5. The Normative Transparency Constraint (The Interest Case)**
  *The Requirement:* The theory must explicitly state whether norms, interests, or expectations are constitutive of the causation or merely heuristic filters.
  *The Case:* Why is the neighbour's non-watering not a cause? Because we don't expect it. If we change the norm (the neighbour was hired as a gardener), the causal status changes. A theory must admit whether causation itself changes, or whether we are just changing the *pragmatics* of what we talk about. For a responsibility system, you need to know if you are tracking objective causal links or assigning blame based on social contracts.

  **6. The Physical Consistency Constraint (The Negative Event Case)**
  *The Requirement:* The theory must not posit "negative events" or "absences" as ontological primitives that contradict physicalism.
  *The Case:* Physics describes the presence and transfer of energy/momentum. It does not track "the absence of energy." If your theory claims there is a literal event called "the non-tripping of the fuse" that exerts causal power, it posits a spooky negative entity. The theory must explain how talk of absences is consistent with a world made only of positive facts.

  ***

  ### Sorting and Incompatibility Analysis

  **Non-Negotiable (For Your System)**
  1.  **Selectivity:** If the system flags "absence of rain" or "Queen of England's inaction" as root causes, it is useless.
  2.  **Artifact Function:** Your system monitors robots. If it cannot parse a sensor failure as a causal omission, it cannot do its job.
  3.  **Normative Transparency:** Since you are assigning responsibility, you cannot hide the fact that norms are doing the work. You must own the normativity.

  **Camp Constraints (Negotiable)**
  1.  **Physical Process Requirement:** The demand that all causation involve a physical conserved quantity (energy/momentum) transfer. This is a constraint of the "Process Theory" camp.
  2.  **Mind-Independence:** The demand that causation exist independently of human interests or norms. This is a constraint of "Realist" camps.
  3.  **Transitivity:** The demand that if A causes B and B causes C, then A causes C. Omissions notoriously break transitivity (e.g., I didn't water the plant -> plant died -> wife was sad. Did my omission cause the sadness? Sometimes yes, sometimes no).

  **The Collision**
  There is a genuine joint unsatisfiability between **Physical Consistency** (strictly interpreted) and **Selectivity/Artifact Function**.

  *   **The Clash:** If you demand that causation *must* be a physical process involving energy transfer (Physical Consistency, strict), you cannot have omissive causation at all, because absences transfer no energy. A fuse not tripping is physically identical to a fuse sitting on a shelf.
  *   **The Resolution:** You must relax the Physical Consistency constraint. You cannot demand that omissive causation be *reducible* to physical process. It must be *consistent* with physics (i.e., not claiming magic), but it cannot be *defined* by it.
  *   **What to Drop:** Drop the insistence that causation is always a physical process. For a responsibility-assignment system, causation is a **normative relation between events**, not just a physical relation between objects. If you keep the "Physical Process" requirement, you will be forced to say the sensor failure *was not a cause*, which renders your incident-review system broken.

  **The "Killer" Requirement**
  **Selectivity (The Neighbour Case)** eliminates the most candidate theories.
  Pure counterfactual dependence theories (e.g., "If C hadn't happened, E wouldn't have") fail this immediately. They make the Queen of England a cause of your dead plants. To survive Selectivity, a theory must import something external to the counterfactual relation (like norms, duties, or defaults). This is why your **Duty-Anchored** distinction is the critical filter.

  ***

  ### Evaluation of the "Duty-Anchored" Distinction

  **Verdict:** The distinction is **high-value and necessary** for your specific application, though it limits general philosophical scope.

  A theory that admits *only* duty-anchored absences as genuine causes **survives** the list above, provided you define "duty" functionally.
  *   **Selectivity:** Solved. The Queen has no duty; the operator does.
  *   **Artifacts:** Solved. The sensor has a design function (a "duty" to trip). The rock does not.
  *   **Redundancy:** Solved. Both supervisors had the duty; both are causal.
  *   **Physics:** Solved. You are not claiming the "absence" is a physical particle; you are claiming the *violation of a functional expectation* is the relevant causal descriptor for the system.

  **Where it breaks:** It breaks only if you attempt to use this system for *scientific* discovery rather than *responsibility* assignment. If a completely novel failure mode occurs (one no designer anticipated and no duty specified), a strict duty-anchored theory might refuse to call it a cause. For an incident-review system, however, this is acceptable: if no duty existed, no responsibility exists, and the "cause" is effectively "system design gap" rather than "operational omission."

  ***

  ### Theory Scorecard

  **1. Counterfactual / Difference-Making Accounts**
  *   *Performance:* Excellent at capturing dependence (if the button were pressed, disaster averted).
  *   *Failure Point:* Fails **Selectivity** miserably without augmentation. They make every necessary condition a cause.
  *   *Fix:* Must be grafted onto your **Duty-Anchored** distinction to filter the infinite counterfactuals down to relevant obligations.

  **2. Process / Conserved-Quantity Accounts**
  *   *Performance:* Excellent at **Physical Consistency**. No spooky negative events.
  *   *Failure Point:* Fails **Artifact Function** and **Omission Truth**. They literally cannot find a causal process in a non-event (a sensor not firing). They are forced to say omissions are not causes, which makes them useless for your incident-review layer.
  *   *Fix:* None. This framework is fundamentally incompatible with omissive causation.

  **3. Fictionalist / Positive-Facts Accounts**
  *   *Performance:* Excellent at **Physical Consistency**. Treats "omission" as a manner of speaking about positive facts (e.g., "the agent was resting" rather than "the agent didn't act").
  *   *Failure Point:* Can feel evasive on **Normative Transparency**. If you say "omissions aren't real causes," it undermines the gravity of the incident report.
  *   *Fix:* Adopt the stance that while ontologically fictional, they are *pragmatically real* for the domain of responsibility. This aligns well with your **Duty-Anchored** approach.
