answer: |-
  Unicode is not committed to a single, pure philosophical theory of identity. Instead, it operates on a **hierarchical pragmatism** that prioritizes **abstract functional identity** (a character is defined by its role in a script) but is frequently overridden by **legacy compatibility** (a character is defined by its existence in prior standards).

  If forced to name the governing theory, it is **Orthographic Functionalism**: a codepoint represents a minimal unit of distinction within a specific writing system that affects meaning, sorting, or processing. Shape is explicitly secondary; it is the job of the font (the glyph), not the encoding (the character), to handle visual variation.

  However, this theory is leaky. Here is the breakdown of where the practice is principled, where it is inconsistent, and why the rival theories you propose would collapse the infrastructure of digital text.

  ### 1. The Principled Core: Orthographic Functionalism
  The "Times 'a' vs. Helvetica 'a'" example illustrates Unicode's strongest commitment: **separation of content and presentation.**
  *   **The Theory:** A character is an abstract atom of meaning. If swapping the shape does not change the dictionary definition, the spelling, or the sorting order, it is the same character.
  *   **The Justification:** This allows text to be searchable and indexable regardless of how it is displayed. If shape determined identity, you could not search a document for "cat" unless you knew exactly which font the author used.
  *   **CJK Unification:** This is the hardest application of this theory. Linguistically, the character for "water" in Chinese, Japanese, and Korean is the same morpheme with the same meaning, despite minor stroke variations. Assigning one codepoint respects the *semantic* identity over the *glyphic* identity. The fury from typographers arose because they viewed the glyphic variation as culturally significant, but Unicode viewed it as a font issue.

  ### 2. The Genuine Inconsistencies: Legacy and Security
  The cracks in the theory appear where **Round-Trip Compatibility** battles **Orthographic Purity**.

  *   **The Confusable Problem (Latin A vs. Cyrillic А):**
      *   *Inconsistency:* If identity is functional, why are these different? Functionally, in a Russian text, Cyrillic А performs the same role as Latin A does in English.
      *   *The Reality:* They are encoded separately because they belong to different *script blocks* inherited from pre-Unicode standards (ISO 8859, etc.). Unicode prioritized preserving the integrity of existing script encodings over creating a "visual" standard. This is not a philosophical stance but a historical artifact. It creates the phishing vulnerability you noted.
      *   *Reconciliation Attempt:* Unicode tries to fix this with "confusable" tables and IDN (Internationalized Domain Name) restrictions, effectively admitting the encoding layer failed to prevent visual spoofing.

  *   **Compatibility Characters (Ohm, Micro, Ligatures):**
      *   *Inconsistency:* The Ohm sign (Ω) and Greek Omega (Ω) are visually identical and functionally similar (both represent the same concept in physics vs. math). Unicode encodes both but marks Ohm as a "compatibility character," advising developers to use Omega instead.
      *   *The Theory Violation:* This violates the "one character, one meaning" rule. It exists solely so that data encoded in older systems can be converted to Unicode and back without loss (round-tripping).
      *   *Philosophical Status:* This area is **underdetermined**. You could argue Ohm is a distinct symbol (a unit of measurement) distinct from a letter (Greek alphabet), licensing two codepoints. Or you could argue it's a reuse of the letter, licensing one. Unicode hedges: it encodes both but tells you one is "wrong."

  ### 3. Evaluating the Rival Theories

  If we swapped Unicode's Orthographic Functionalism for your proposed rivals, the digital text ecosystem would break.

  #### Rival A: Shape-First Identity (Graphic Realism)
  *   **The Theory:** A letterform *is* its shape. A handwritten 'a' and a typed 'a' are different characters because they have different geometries.
  *   **What Would Break:**
      *   **Search & Indexing:** You could not search for a word. You would have to search for a specific *image* of a word. Search engines would need to function like reverse-image search for every text query.
      *   **Storage:** Text files would effectively become vector graphics files. A simple email would balloon in size because it would need to embed the geometric definition of every glyph used.
      *   **CJK:** This would be catastrophic. Every minor calligraphic variation of a Han character would require a new codepoint. The Basic Multilingual Plane would overflow instantly.
      *   **Fonts:** Fonts would become redundant. If the codepoint *is* the shape, you don't need a font to render it. The distinction between "text" and "image" would vanish.
  *   **Survivability:** Zero. Computing relies on the abstraction of text from presentation. Shape-first encoding turns text into art, rendering it unprocessable by algorithms.

  #### Rival B: Fuzzy-Category Identity (Prototype Theory)
  *   **The Theory:** 'a'-ness is a gradient. Characters are defined by family resemblance, not binary boundaries.
  *   **What Would Break:**
      *   **Binary Logic:** Computers operate on discrete states (0 or 1). A fuzzy category requires probabilistic matching at the kernel level. `if (input == password)` becomes `if (input ≈ password)`.
      *   **Security:** Passwords would become impossible. Is your password "apple" or "ɑpple" (using alpha)? In a fuzzy system, they might be "close enough" to grant access, destroying authentication security.
      *   **Sorting:** How do you sort a list where the boundaries of the items are blurred? Collation algorithms require strict ordering rules.
  *   **Survivability:** Zero. While AI/ML models *process* text using fuzzy embeddings internally, the *storage and transmission* layer requires discrete symbols to ensure fidelity. You can have fuzzy *processing*, but you cannot have fuzzy *encoding*.

  ### 4. Where the Practice is Underdetermined
  There are areas where Orthographic Functionalism doesn't provide a clear answer, and Unicode's choices here feel arbitrary because multiple theories could apply:

  *   **Emoji Sequences:** A "family" emoji is a sequence of human icons + zero-width joiners. Is this one character or four? Unicode treats it as one *grapheme cluster* (what the user perceives) but multiple *codepoints* (what the machine stores). This is a pragmatic hack to allow new emojis without allocating new codepoints, but it blurs the definition of "character."
  *   **Dialectal Variants:** When does a spelling variation become a new character? (e.g., Serbian Cyrillic vs. Macedonian Cyrillic). Unicode often encodes them as the same character with different language tags, but sometimes distinct codepoints are granted due to political or standardization pressure. Here, sociology overrides linguistics.
  *   **The German ß:** For years, ß had no capital form. Was it a lowercase-only variant of SS? Or a distinct letter? Unicode waited for the ISO standard to define a capital ß (ẞ) before encoding it. This shows Unicode deferring to external standards rather than leading with a philosophical stance.

  ### 5. Conclusion: The "Stable Abstract Unit" Compromise
  Unicode is not a theory of *what a letter is*; it is a theory of *how to store a letter so it survives transit.*

  It is committed to **Stable Abstract Identity**. A codepoint must be:
  1.  **Distinct** enough to allow differentiation (Latin A ≠ Cyrillic А).
  2.  **General** enough to allow font variation (Times a = Helvetica a).
  3.  **Stable** enough to never change (once assigned, never withdrawn).

  The inconsistencies (confusables, compatibility characters) are the tax paid to requirement #3 (Stability/Legacy). The system cannot adopt a Shape-First theory because it would destroy search and storage. It cannot adopt a Fuzzy theory because it would destroy security and logic.

  The "theory" is therefore **Engineering Realism**: Identity is defined by whatever distinction is necessary to preserve the intent of the text across different systems, times, and fonts, while minimizing the disruption to existing data. It is a diplomatic treaty between scripts, not a philosophical declaration on the nature of glyphs. If you swapped in a shape-first or fuzzy theory, you wouldn't have a character encoding standard anymore; you would have a graphics format or a neural network, and text as we know it—copyable, searchable, secure—would cease to exist.
