      *   **Conclusion:** Unicode is a *pragmatic functionalism*. It prioritizes the *logical order of text* over the *visual representation of text*. It survives because computing needs discrete, stable units. A shape-first or fuzzy theory is philosophically interesting but computationally suicidal.

