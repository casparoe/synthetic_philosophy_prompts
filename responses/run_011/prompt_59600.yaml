answer: |-
  The printer in the corner of the audit room coughed twice before spitting out the calibration log. It was a thick stack, the paper warm and smelling of ozone. Elias caught the pages before they hit the tray, smoothing the curl from the top sheet. The timestamp read 03:14. The room was quiet except for the hum of the server rack and the low hiss of the air conditioning. On the main screen, the waveform for Channel Two sat flat, a green line resting on the zero axis.

  He turned the page. The raw data for the 1998 calibration set was there in columns. Warmth, relief, amusement, satiety. The manual said these should all spike the same sensor, a specific frequency of neural firing labeled *Hedonic Tone*. But looking at the columns, Elias saw nothing matching. The warmth of the bath triggered a vascular response. The relief of the heavy bag triggered a muscular release. The joke triggered a cortical spike. They were different events wearing the same name tag. The algorithm averaged them into a single number, but there was no common thread in the wiring. It was a sum of unrelated things, bundled together because the committee thirty years ago decided they felt the same.

  The door opened. Mara walked in carrying two paper cups of coffee. She wore the same grey cardigan she'd worn yesterday, the elbows slightly shiny. She set a cup on the desk beside Elias's keyboard.

  "You're still on the 1998 set?" she asked. She didn't wait for an answer, pulling up a chair that scraped loudly against the linoleum. "We have the live assessment in twenty minutes. You need to sleep."

  "The Channel Two baseline is wrong," Elias said. He tapped the page. "It's not measuring a tone. It's measuring a list. If a subject experiences something that wasn't on the 1998 list, the channel reads null. Even if they want it."

  Mara took a sip of her coffee. She looked at the screen, then at the paper. "It reads within variance for ninety-four percent of the population. That's the certification standard."

  "For the population it was built on," Elias said. "Look at the Henderson file. Palliative care, wing four. Last month."

  He pulled up the file. On the screen, two graphs ran side by side. Channel One, labeled *Retention*, showed a high, steady curve. Channel Two, *Tone*, hovered near the bottom.

  "Henderson," Mara said. "He chose to stay in the program. He refused the early discharge."

  "He chose to stay," Elias said. "But the machine says he isn't experiencing pleasure. Channel Two is flat. According to the metric, his welfare score is neutral. He gets no credit for the days he's fighting to keep."

  "He's in pain, Elias. The Tone channel picks up the analgesics. It's doing its job."

  "It's picking up the chemistry, not the choice," Elias said. "He wants to be here. He holds onto the experiences. The music, the visits, the air from the window. He seeks them. Channel One is high. But because the sensation doesn't match the 1998 paradigm of 'pleasure,' Channel Two stays low. We're telling him his will to stay doesn't count as welfare."

  Mara set her cup down. The ceramic made a sharp click. "The Bureau certifies experiences, not wills. We measure what happens in the nervous system, not what people say they want. If we switch to Channel One only, we're measuring persistence. A person can persist in misery. You know the counterexample. The worker who keeps grinding because they're afraid to stop. High retention, negative tone. If we certify that as welfare, we're subsidizing suffering."

  "But Henderson isn't suffering," Elias said. "He's numb. He's finding value in the continuation itself. The machine can't see it because it's looking for a spark that isn't there."

  "The machine looks for what we can check," Mara said. "I can check your pupil dilation. I can check your skin conductance. I cannot check your 'value.' If we hand the metric over to self-report, to what people say they want, we lose the public standard. Everyone claims their experience is valuable. The Bureau needs a common currency."

  "It's not a common currency if the coins are made of different metals," Elias said. He turned the page of the log again. "This is a disjunctive bundle. We're calling three different things by one name because it's convenient."

  "It's a property," Mara said. "Just because it's complex doesn't mean it isn't real. A 'vehicle' is a car or a boat or a plane. They share no single mechanical part, but they share a function. Channel Two measures the function of positive reinforcement. However it gets there."

  "It doesn't get there," Elias said. "In Henderson's case, it doesn't get there at all. The signal is absent."

  "Then Henderson doesn't get the credit," Mara said. Her voice was flat, procedural. "That's the cost of the system. We optimize for the checkable."

  There was a knock at the glass partition. A man stood outside, holding a clipboard. He was wearing the pale blue gown of the assessment wing. This was Ross. He was the subject for the morning's live audit, a volunteer from the chronic care unit brought in to validate the recalibration.

  Mara stood up. "Bring him in. We'll run the protocol. If Channel One and Two diverge on Ross, we flag it. But we don't change the weighting mid-audit."

  Elias watched Ross enter. He was older, moving slowly, one hand resting on the back of the chair designated for subjects. He sat down without being asked. He looked tired, the skin under his eyes dark. Elias attached the sensors to Ross's temples and the base of his neck. The wires snaked back to the console.

  "Standard stimulus set," Mara said. "Start with the thermal. Then the auditory."

  Elias typed the command. The first test was a heated pad placed on Ross's forearm. Warm, not hot. On the screen, Channel Two spiked immediately. A clean green peak. Channel One rose to match it.

  "Baseline holds," Elias said.

  "Next," Mara said.

  The second test was a recording. A piece of music the database classified as *Complex/Resolving*. It played through the speakers. Ross closed his eyes. He didn't smile. He didn't move. He sat very still.

  Elias watched the monitors. Channel One began to climb. The retention signal was strong. Ross's physiological markers showed engagement, a leaning in, a holding on. But Channel Two remained flat. The green line didn't budge. The music didn't trigger the 1998 paradigm. It wasn't warm, it wasn't relief, it wasn't satiety. It was something else.

  "Channel One is at eighty percent," Elias said. "Channel Two is null."

  Ross opened his eyes. "Is that it?"

  "We need five more minutes," Mara said. She didn't look at Ross. She looked at the screen. "Continue the track."

  "It doesn't feel like anything," Ross said. His voice was raspy. "But I don't want it to stop."

  Elias looked at Mara. "He wants it to continue. That's Channel One. But the Tone channel says there's nothing there."

  "The Tone channel says there's no standard pleasure," Mara corrected. "Which means we cannot certify it as a welfare positive. If we certify this, we set a precedent that numbness counts as joy."

  "It's not joy," Elias said. "It's worth. He finds it worth keeping."

  "We don't measure worth," Mara said. "We measure welfare. There's a difference."

  Ross shifted in the chair. "If the score is low, do I lose the subsidy?"

  Elias froze. He hadn't told Ross what the numbers meant. But Ross knew. Everyone in the wing knew. The welfare metric determined the level of care, the access to the extra therapies, the priority for the new palliative units. A low score meant you were coping well enough to need less help. A high score meant you were experiencing enough positive welfare to justify the investment. Or, in some interpretations, that you were experiencing enough to make the life worth the cost.

  "We haven't calculated the final score," Elias said.

  "If the Tone is null, the score drops," Ross said. He looked at his hands. "I come here because it helps. Not because it feels good. Because it makes the day hold together."

  Mara leaned forward. "Mr. Ross, the instrument is calibrated to ensure fairness across all subjects. If we accept experiences that don't register on the Tone channel, we risk inflating the metrics for people who are actually in distress. We have to be sure."

  "I'm not in distress," Ross said. "I'm just... here."

  Elias looked at the keyboard. His cursor blinked over the *Override* key. He could force the system to weight Channel One higher. He could flag the 1998 calibration as obsolete. It would take a senior signature to process, but he could initiate it. It would stop the audit. It would delay Ross's certification for weeks. During the review, Ross's subsidy would default to the minimum.

  If he didn't override, the machine would process the null Tone as a zero. Ross's average would drop. He might lose the extra hours of therapy. But the audit would close. The system would remain consistent.

  Mara saw his hand hovering. "Elias. Don't."

  "He's telling us what the experience is," Elias said. "He wants it to continue. That's the only data we have that isn't broken."

  "The data isn't broken," Mara said. "It's specific. We are not certifying 'wanting.' We are certifying 'positive affect.' If the affect isn't there, we can't log it."

  "But the affect is the wrong definition," Elias said. "We defined it wrong thirty years ago. We said it had to feel like a bath or a joke. It doesn't have to. It just has to be welcomed."

  "If it's welcomed, let him welcome it," Mara said. "But don't ask the Bureau to pay for it under the welfare line. That line is for pleasure. If we change the definition, we have to rewrite the budget. We have to tell the legislature that we've been measuring the wrong thing. Do you want to be the one who tells them the last ten years of hospice data is invalid?"

  Elias looked at Ross. Ross was looking at the screen, watching the flat green line. He looked resigned. He knew what the line meant. He knew that if the line stayed flat, he was less valuable to the system.

  "If I sign off," Elias said, "the audit stands. Ross gets the score the machine gives."

  "Yes," Mara said.

  "And if I flag the calibration?"

  "Review board," Mara said. "Three months minimum. Subsidy suspended during review."

  Elias looked at the *Override* key. Then he looked at the *Accept* key.

  The room was quiet. The server hummed. The air conditioning hissed. Ross shifted his weight, waiting. He didn't ask again. He knew the procedure. The technician runs the test. The machine prints the number. The number decides the care.

  Elias thought about Henderson in wing four. He thought about the columns in the 1998 log. He thought about the budget, the legislature, the thousands of other patients whose scores depended on the line staying steady. If he broke the instrument now, he might fix it for next year. But he would break it for Ross today.

  He moved his hand. He pressed *Accept*.

  The printer whirred. It began to spit out the certification form. The numbers printed in black ink. Channel One: High. Channel Two: Null. Aggregate Score: Below Threshold.

  Mara exhaled, a small sound. She stood up and took the paper from the tray. She signed the bottom line. "Thank you, Mr. Ross. You can disconnect the sensors."

  Ross stood up. He pulled the wires from his skin gently. He didn't look at the paper. He looked at Elias. "It helped," he said. "Even if the line didn't move."

  "I know," Elias said.

  Ross nodded. He walked to the door. He opened it and stepped out into the corridor. The door clicked shut.

  Elias looked at the screen. The green line was still flat. He picked up the calibration log, the one showing the mismatched columns. He put it in the shredder slot. He held it there for a second, feeling the teeth of the machine waiting.

  "You did the right thing," Mara said. She was stacking her papers, organizing her desk. "We can't run the Bureau on metaphysics. We run it on checks."

  "We ran it on a error," Elias said.

  "We ran it on the standard," Mara said. "Next time, maybe we propose a update to the calibration set. But not today. Not on a live subject."

  Elias watched the log disappear into the shredder. The machine chewed the paper, turning the data into confetti. He picked up his coffee. It was cold. He drank it anyway.

  "Next subject," Mara said.

  Elias typed the command. The screen cleared. The green line reset to zero. He waited for the door to open again.
