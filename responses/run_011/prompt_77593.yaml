answer: |-
  # PREP SHEET: THE BOUNDARY PROBLEM & PROVISIONAL DEMOS

  ## ORDER OF FIRE
  *Estimated sequence based on seminar dynamics: theoretical objections first (to clear the ground), operational objections second (to test utility), political/ethical implications last (to test consequences).*

  ### 1. The Neo-Republican (Theoretical Opening)
  **The Objection:** "You're treating the boundary problem as a logical paradox that needs solving prior to politics, but republicanism sees freedom as non-domination secured *through* practice. The regress only bites if you insist on a 'founding moment' of authorization. If democracy is an ongoing project of self-constitution, the boundary is drawn and redrawn in the very act of contestation. You haven't found a circle; you've just described the hermeneutic circle of political life. Why insist on a moral criterion *outside* the practice when the practice generates its own normative force?"

  **The Reply (2 mins):** "The hermeneutic circle works only if the participants agree on *who* is circling. If I am dominated by a rule but excluded from the practice that supposedly legitimates it, your 'ongoing practice' is just a closed shop calling itself open. My point isn't that we need a pre-political founding, but that the *site* of practice is itself a coercive fact. We need a moral criterion (coercion) to identify who has a claim to enter the circle, otherwise 'practice' just validates the status quo of exclusion."

  **Damage Assessment:** **High.** If they convince the room that the regress is merely theoretical, your "permanent provisionality" looks like a solution to a non-problem.
  **Soft Spot:** You are relying on a distinction between "inside" and "outside" that the Republican claims is fluid.
  **Concession:** Admit that *after* the boundary is drawn, republican practice is the best engine for legitimacy. Your claim is only about the *claim to enter*.

  ### 2. The Deliberative Democrat (Theoretical Follow-up)
  **The Objection:** "This sounds like you're mistaking a question of democratic politics for a question of foundations. Boundaries aren't fixed by criteria; they are constructed through discourse. By positing a 'moral criterion' of coercion, you're bypassing the democratic work of arguing about the boundary. You're imposing a philosophical veto on what should be a political negotiation."

  **The Reply (2 mins):** "Negotiation requires a table. My argument is that the 'moral criterion' doesn't set the boundary; it sets the *standing to demand a seat*. If we leave it purely to discourse, those excluded from the discourse have no leverage to start the negotiation. Coercion provides the pre-discursive hook that forces the door open."

  **Damage Assessment:** **Medium.** Overlaps with the Republican. They will try to paint your criterion as "undemocratic" because it's philosopher-imposed.
  **Soft Spot:** You risk sounding like you're privileging philosophical insight over democratic agency.

  ### 3. The Empirical Political Scientist (Operational)
  **The Objection:** "Okay, but what does this *do*? You say boundaries are provisional. We already know franchises expand and contract. Does your 'coercion criterion' predict variance that existing models don't? If the answer is 'states ought to listen to the coerced,' that's a normative wish, not a theory of change. How is this operationalisable without a threshold that reintroduces the arbitrarity you hate?"

  **The Reply (2 mins):** "It predicts *conflict points*. Existing models treat franchise extension as benevolent or functionalist. My model predicts extension happens when the cost of enforcing coercion without representation exceeds the cost of inclusion. It's not a threshold of 'affectedness,' it's a trigger mechanism: when a group can demonstrably show they are bound by rules they can't change, the institution is obligated to create a route for them. It explains *why* the pressure builds, not just that it does."

  **Damage Assessment:** **Medium-High.** If they think your theory is empty of empirical content, the "provisionality" claim looks like hand-waving.
  **Soft Spot:** You haven't specified the "institutionalised route." Is it a court? A commission? A riot?
  **Concession:** Concede you aren't offering a predictive causal model, but a normative heuristic for evaluating existing friction.

  ### 4. The Rawlsian (Structural)
  **The Objection:** "Isn't this just a natural duty of justice wearing a fancy hat? If we have a duty to support just institutions, and just institutions require input from the subjected, then the 'obligation to enlarge' is already covered by the duty of justice. Why do we need a specific 'provisional demos' ontology?"

  **The Reply (2 mins):** "Because the duty of justice usually applies to *individuals* or *states* regarding *other states*. My claim is internal to the *identity* of the demos itself. It's not that I have a duty to let you in; it's that *we* are not a legitimate 'we' until you are in. It changes the subject of the obligation from the citizen to the collective entity."

  **Damage Assessment:** **Low.** Mostly terminological. They want to file this under 'justice,' you want it under 'constitutive legitimacy.'
  **Soft Spot:** If they press that the outcome is identical, the distinction feels scholastic.

  ### 5. The Migration & Citizenship Scholar (Normative)
  **The Objection:** "You've restated an argument for open borders with extra steps. If coercion grants standing, and border regimes are the primary coercive apparatus, then your 'provisional demos' obligates us to dissolve borders. By keeping the frame inside 'enlarging the demos,' you're conceding the state's right to exclude in the first place. It's open borders via the back door, but timidly."

  **The Reply (2 mins):** "It's not open borders; it's open *jurisdiction*. Someone can be coerced by a state's external border policy without claiming residence. They might claim a say in the border policy from outside. My framework allows for external voice without necessarily demanding internal membership. It separates 'standing to claim' from 'right to reside'."

  **Damage Assessment:** **High.** This is a major vulnerability. If your "coercion" criterion implies open borders, the "provisional demos" collapses into globalism.
  **Soft Spot:** Distinguishing between "coercion by border enforcement" and "coercion by domestic law" is notoriously difficult.
  **Concession:** Admit that for some forms of coercion (e.g., economic sanctions, climate policy), the "demos" might indeed need to be transnational.

  ### 6. The International Lawyer (Pragmatic)
  **The Objection:** "You say 'keep reopening the boundary.' In international law, that sounds like irredentism. *Uti possidetis* exists for a reason: to stop wars. If every minority group that feels coerced has an enforceable claim to reopen the constitutional order, you're inviting instability. Legitimacy requires a degree of finality, or the system collapses into permanent revolution."

  **The Reply (2 mins):** "Permanent revolution is exactly what I want to avoid. That's why I insist on an *institutionalised* route. If there's a legal mechanism to claim standing, people don't need to take up arms. It's the *lack* of a route that causes violence. Provisionality channelled through law stabilises the system; rigidity breaks it."

  **Damage Assessment:** **Medium.** They care about order; you care about justice. They will fear your theory enables secessionist movements.
  **Soft Spot:** You assume the state will faithfully administer the route for its own dissolution/enlargement.
  **Concession:** Concede that in weak states, this mechanism could be destabilizing. Your theory assumes a baseline of rule of law.

  ### 7. Grad Students (Edge Cases)
  **The Objection:** "What about future generations? They are coerced by debt and climate policy but can't claim standing. What about animals? If coercion is the metric, doesn't your logic push toward post-human democracy? If you draw the line at 'capacity to claim,' aren't you back to arbitrary thresholds?"

  **The Reply (2 mins):** "I'm solving the boundary problem for *political* communities, which requires agency. Guardianship can handle future generations and animals, but they cannot hold *standing* in a democratic sense because they cannot contest the claim. My criterion is 'coercion + capacity to articulate the claim.' It's not arbitrary; it's functional to the concept of democracy."

  **Damage Assessment:** **Low.** Usually a late-seminar probe. Don't get bogged down.
  **Soft Spot:** "Capacity to articulate" sounds like it excludes children or the cognitively disabled unless you're careful.
  **Concession:** Briefly note that guardianship is the standard proxy, but the *claim* belongs to the subject.

  ### 8. Indigenous Sovereignty Scholar (The Hard Landing)
  **The Objection:** "Your whole frame is colonial. 'Enlarging the demos' assumes the state has the jurisdiction to enlarge itself over this land. For indigenous peoples, the boundary isn't a line to be redrawn; it's a prior sovereignty that was never ceded. Asking us to contest the boundary inside the state's institutions concedes the state's jurisdiction over the land. You're offering inclusion into a structure that is itself the violence."

  **The Reply (2 mins):** "This is the limit of my theory. I am analyzing the legitimacy of *settler* democracies, not the prior claims of indigenous sovereignty. My argument is that *if* you claim to be a democracy, you have this obligation. Indigenous sovereignty might reject the premise entirely. I'm not saying they should seek inclusion; I'm saying the state is illegitimate until it recognizes that its boundary is an imposition."

  **Damage Assessment:** **Very High.** This doesn't just hit a weak point; it hits the floor the house is built on.
  **Soft Spot:** You are using state-centric tools to critique the state, which may be incoherent from an indigenous perspective.
  **Concession:** **Crucial:** Concede early that your theory applies to the *state's* self-justification, not to the ontological status of indigenous land. Do not try to "solve" this with your theory.

  ---

  ## COALITION ATTACKS
  1.  **The "Instability" Coalition:** The **International Lawyer** and the **Empirical Pol Sci** will team up. The Lawyer says it causes war; the Pol Sci says it causes institutional chaos. They will argue your "institutionalised route" is a fantasy.
      *   *Counter:* Point to existing mechanisms (constitutional courts, human rights tribunals) that already do this partially. You are radicalizing existing practice, not inventing new chaos.
  2.  **The "Exclusion" Coalition:** The **Migration Scholar** and the **Indigenous Scholar** will team up. Both argue you are legitimizing the state's power to exclude by making it seem "provisional" rather than "illegitimate." One says it should be open borders; the other says it should be separate sovereignty.
      *   *Counter:* Distinguish between *reformist* critique (yours) and *abolitionist* critique (theirs). You are speaking to the state as it exists; they are speaking to the land as it was.

  ## EARLY CONCESSIONS (First 5 Minutes)
  *   **Concede the "Founding" Point:** Explicitly state: "I am not offering a theory of how a demos comes into being *ex nihilo*. I am offering a theory of how an existing demos maintains legitimacy over time." This pre-empts the Republican and Deliberative "founding act" objections.
  *   **Concede the "Colonial" Limit:** Explicitly state: "This framework addresses the internal legitimacy of constitutional democracies. It does not resolve prior claims of indigenous sovereignty, which may render the state itself illegitimate regardless of boundary procedures." This disarms the Indigenous objection before it lands as a surprise.
  *   **Concede the "Threshold" Difficulty:** Admit that distinguishing "coercion" from "influence" is hard, but argue that *legal bindingness* (law vs. advice) is the proxy, not intensity of impact.

  ## THE ONE REPLY THAT MUST LAND
  **The Distinction between Constitutive and Operational Legitimacy.**
  You must convince the room that *constitutive* legitimacy (a perfectly drawn boundary) is impossible, but *operational* legitimacy (a mechanism to fix errors) is sufficient.
  *   *Why:* If they think you need a correct boundary for legitimacy, you lose to the Republicans (who say practice makes it correct) and the Indigenous Scholar (who says the state is wrong).
  *   *Phrasing:* "Legitimacy isn't a state of being; it's a capacity for correction. A democracy isn't legitimate because it got the boundary right; it's legitimate because it admits it might be wrong and has a way to fix it."

  ## THE NIGHTMARE QUESTION
  **The Question:** "Who decides when the institutional route for reopening the boundary is triggered? If the current demos controls the institutions, and they refuse to hear the claim of the coerced outside, hasn't the regress just returned at the level of procedure? You've moved the circle from 'who is in' to 'who decides who gets to claim in'."

  **The Least-Bad Answer:** "Yes, the regress returns. That's why the obligation isn't just procedural; it's moral. If the institutions block the claim, the legitimacy is lost, and the coercion becomes mere force. My theory doesn't guarantee compliance; it identifies the moment of illegitimacy. The 'decision' isn't up to the demos; it's up to the reality of coercion. If they ignore it, they are no longer a democracy, just a regime."
  *(Note: This is a risky, high-stakes answer. It admits your theory can't prevent tyranny, only name it.)*

  ---

  ## META-COMMENTARY: WHERE I AM UNSURE
  **The Neo-Republican Objection.**
  I am least sure about my advice on the Neo-Republican objection. I have flagged it as "High Damage," but there is a strong case in the literature (e.g., readings of Pettit or Arendt) that the boundary problem *is* dissolved by ongoing practice.
  *   **Why I'm unsure:** If the Republican is right that political freedom is *constituted* by the act of claiming it, then your "moral criterion of coercion" is an external imposition that undermines the very autonomy you're trying to protect. They might argue that by giving the philosopher (you) the right to define "coercion," you are replicating the exclusion you criticize.
  *   **What would change my mind:** If you can show that "practice" inherently produces blind spots (e.g., slaves couldn't practice their way into freedom; they had to be recognized as human *first*), then your moral criterion holds. If you cannot show that practice is insufficient, the Republican might actually be right that the regress is a pseudo-problem.
  *   **Advice:** If the Republican pushes hard on this, do not dig in on "logic." Pivot to "history." Argue that historically, boundaries never open through practice alone; they open because an external moral claim (rights, coercion) forces the practice to expand. If you can ground your criterion in historical necessity rather than logical necessity, you might survive this.
