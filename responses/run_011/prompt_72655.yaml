prompt: |-
  I draft legislation for a living — twelve years of it, mostly unglamorous stuff: licensing regimes, fee schedules, the odd amendment nobody reads until someone sues. And I've noticed something about the textualism-versus-purposivism fight that I can't find anyone saying, so I want to know whether I'm onto something or just being too clever.

  Both camps argue as though the things they're fighting about are inaccessible in principle. The textualist says all that survives enactment is the text's ordinary public meaning, fixed at the time it was passed, and that purpose is a fiction because a multimember body has no mind to read. The purposivist says the text runs out in the hard case and you have to reconstruct the point of the provision, because a rule read against its reason is not the rule that was made. Fine. But at my desk, both of those are... records. I know roughly what the ordinary reader hears, because we put clauses in front of non-lawyers before they ship and we change the words when they misread them. And I know what a provision is for, because there's an instruction from the committee, a memo, a redline where we struck one formulation and put another in for a reason that got written down. Neither object is metaphysically spooky. They're evidence.

  Concrete case from my own file. A licensing provision requires "three years of supervised practice." Someone applies with three years spent running their own one-person practice in a jurisdiction that never required supervision. Text points one way, the obvious point of the requirement — protecting clients from people who've never had their work looked at by anyone — points the other. Except the drafting file shows we deleted "or equivalent experience" from that sentence deliberately, because the committee wanted a bright line and said so. So the evidence resolves it, and the interesting question becomes whether anyone is allowed to look.

  So here's my hypothesis, and I want it pressure-tested rather than flattered: the debate has stalled because both sides are treating as a conceptual question something that is really an evidential one, and neither can afford to say that out loud. Once you admit the underlying facts are in principle discoverable, the fight over method collapses into a fight about admissibility, about who is competent to look, and about how to allocate the risk when the record is thin, sloppy, or lost — which is to say a fight about institutional authority and error, not about what meaning is.

  Is that diagnosis right, or is there a residue it doesn't touch — something genuinely normative about what a court may rely on even when the drafter's file is sitting on the table? Tell me which of the usual categories this dispute actually falls into: verbal, substantive, two different questions sharing a word, or an ill-posed one that just looks hard. And tell me what each camp would say back to my reframe, in their own terms, not as strawmen. Then: what would count as progress on my version of it, and does the answer change when there is no record — an old statute, a fire, a legislature that kept nothing?

  No citations or case names, I'm not looking for a bibliography. I want the diagnosis and the reasoning.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Persona:** A professional legislative drafter with 12 years of experience. They deal with the nitty-gritty of statutory construction (licensing, fees, amendments). They are pragmatic, insider-focused, and skeptical of academic abstractions.
      *   **Core Insight/Hypothesis:** The textualism vs. purposivism debate is not metaphysical (what *is* meaning?) but evidential/institutional (what *evidence* of meaning is admissible, and who decides?). The user argues that both "ordinary meaning" and "legislative purpose" are empirically discoverable records (user testing data, committee memos, redlines), not philosophical ghosts. The real fight is about admissibility, competence, and risk allocation when records are missing.
      *   **Task:** Pressure-test this hypothesis. Don't flatter. Diagnose the nature of the dispute (verbal, substantive, etc.). Articulate the counter-arguments from both camps in their own terms (no strawmen). Define what progress looks like under this new frame. Address the "no record" scenario.
      *   **Constraints:** No citations or case names. Focus on diagnosis and reasoning.

  2.  **Deconstruct the Hypothesis:**
      *   *Claim 1:* Meaning is empirical (user testing for text, memos for purpose).
      *   *Claim 2:* The debate is really about admissibility/institutional authority, not ontology.
      *   *Claim 3:* If we admit facts are discoverable, the methodological fight collapses into procedural/risk allocation fights.

  3.  **Evaluate Claim 1 (Empiricism):**
      *   *Strength:* The drafter is right that *some* evidence exists. Drafting histories exist. Plain language testing happens.
      *   *Weakness:* Is "ordinary meaning" truly captured by pre-enactment testing? The "ordinary reader" at enactment vs. the judge reading it 10 years later might differ. Is "purpose" truly captured by committee memos? A memo from a staffer isn't the vote of the body. The "multimember body has no mind" objection isn't just metaphysical; it's constitutional/procedural. Only the text was voted on.

  4.  **Evaluate Claim 2 (Admissibility vs. Ontology):**
      *   *Strength:* This is a strong realist take. Courts often exclude legislative history not because it doesn't exist, but because it's unreliable or manipulable.
      *   *Weakness:* There *is* a normative residue. Even if we *know* the purpose, should the law bind us to that purpose if the text fails to capture it? Rule of law values (notice, stability) might prefer a "wrong" text over a "right" purpose if the purpose is hidden in a file.

  5.  **Evaluate Claim 3 (Collapse of the Debate):**
      *   *Strength:* It reframes the argument into manageable administrative terms.
      *   *Weakness:* It doesn't fully dissolve the normative disagreement. Textualists care about *democratic legitimacy* (only text is law). Purposivists care about *functional justice* (law should achieve its aim). These are values, not just evidentiary rules.

  6.  **Drafting the Response - Section by Section:**

      *   **Diagnosis:** Is it verbal, substantive, etc.?
          *   It's not merely verbal. It's not just two questions sharing a word.
          *   It is *substantive*, but the user is right that it's disguised as metaphysical.
          *   Best diagnosis: It's a **normative dispute masquerading as an epistemological one.** The user identifies the epistemological layer (evidence), but misses the normative layer (why we choose one evidence type over another).

      *   **The Textualist Counter (in their terms):**
          *   Focus on *Democratic Accountability* and *Notice*.
          *   The "record" the drafter cites (memos, redlines) was not voted on. Only the text was.
          *   Reliance interests: Citizens read the statute, not the drafting file.
          *   Manipulability: Staffers can plant history to steer judges.
          *   "Ordinary meaning" isn't just user testing; it's the meaning at the time of *application* (sometimes) or at least the public's understanding, not the drafter's intent.

      *   **The Purposivist Counter (in their terms):**
          *   Focus on *Functional Fidelity* and *Legislative Supremacy*.
          *   Ignoring the record leads to absurd results that the legislature *would not* have wanted.
          *   Text is a tool, not a idol. If the tool breaks, fix it to match the job.
          *   The "multimember body" objection is a fiction used to ignore clear evidence of consensus.
          *   Excluding the record privileges the "letter" over the "law."

      *   **The Normative Residue (What the user missed):**
          *   Even if the file is on the table, there's a reason not to look.
          *   *Rule of Law Values:* Predictability, stability, equality.
          *   *Institutional Competence:* Judges aren't historians or archivists.
          *   *Incentive Structures:* If courts look at files, drafters will game the files. If courts look only at text, drafters must write better text.

      *   **Progress on the User's Frame:**
          *   Shift from "What is meaning?" to "What is the cost of error?"
          *   Develop standards for when the record is *reliable enough* to override text.
          *   Acknowledge the "Clear Statement" rule as a risk allocation mechanism.

      *   **The "No Record" Scenario:**
          *   This is where the user's frame faces its hardest test.
          *   If the record is lost, the evidential argument vanishes.
          *   Textualism becomes a default rule of construction (a tie-breaker).
          *   Purposivism becomes reconstruction based on broader context.
          *   The dispute reverts to pure normativity: Do we prefer stability (text) or accuracy (purpose) when evidence is gone?

  7.  **Refining the Tone:**
      *   Respect the user's expertise (they are the practitioner).
      *   Avoid academic jargon where possible.
      *   Be direct and critical (pressure-test, don't flatter).
      *   Ensure the distinction between "what happened" (evidence) and "what counts as law" (normativity) is sharp.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I use case names? *No.*
      *   *Check:* Did I flatter? *Need to ensure I challenge the "collapse" idea.*
      *   *Check:* Did I answer the specific categories? *Yes (Normative masquerading as Epistemological).*
      *   *Check:* Did I address the "no record" scenario? *Yes.*
      *   *Key Insight to emphasize:* The drafter treats the statute as a *communication* from the legislature. Textualists treat it as a *command* from the sovereign. That's the normative gap.

  9.  **Final Polish:** Ensure the distinction between "ontological" (what meaning *is*) and "normative" (what meaning *should be counted*) is clear. The user thinks the debate is ontological; I need to show it's normative, even if they fix the ontology.

  *(Self-Correction on the "Ordinary Meaning" point)*: The user says they test clauses on non-lawyers. Textualists might argue that "ordinary meaning" is a legal construct, not a survey result. It's how a *reasonable person* reads it, not how a focus group reads it. I should mention that.

  *(Self-Correction on the "Purpose" point)*: The user says purpose is in the memo. Textualists argue that the memo reflects the *drafters*, not the *voters*. This is the "unconstitutional legislation by staffer" argument. I need to make sure that comes through.

  10. **Final Structure:**
      *   Diagnosis (Normative vs. Epistemological).
      *   Textualist Rebuttal (Legitimacy & Notice).
      *   Purposivist Rebuttal (Fidelity & Absurdity).
      *   The Residue (Incentives & Rule of Law).
      *   Progress (Risk Allocation).
      *   The "No Record" Scenario (Default Rules).

