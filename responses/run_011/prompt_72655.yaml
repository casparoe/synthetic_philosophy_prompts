answer: |-
  Your diagnosis is sharp, and it cuts through a lot of the academic fog. You are right that the debate is often presented as a metaphysical mystery ("What *is* the law?") when, from the inside, it looks like a paperwork dispute ("What *records* do we have?").

  However, your hypothesis that the fight *collapses* into an evidential one is only half-right. You have correctly identified the **epistemological** layer (how we know what the law is), but you are underestimating the **normative** residue that remains even when the files are on the table.

  Here is the pressure test.

  ### 1. The Diagnosis: Category Error
  You ask whether this is verbal, substantive, or ill-posed. It is **a normative dispute masquerading as an epistemological one.**

  Both sides pretend they are arguing about the nature of meaning (epistemology/ontology). Textualists claim purpose doesn't "exist" in a multimember body; purposivists claim text "runs out." You are correctly pointing out that both exist as empirical facts: you have the survey data (textual understanding) and the memo (purpose).

  But the reason the debate doesn't collapse is that the two camps disagree on **which facts are legally constitutive.** It is not that they cannot find the evidence; it is that they disagree on whether that evidence *counts* as law. This is a normative choice about the rule of law, not a discovery problem.

  ### 2. The Counter-Arguments (In Their Own Terms)

  If you sat a hardline textualist and a hardline purposivist down with your drafting file, here is what they would say.

  **The Textualist:**
  "The memo you showed me is irrelevant. It was not voted on. The only thing that survived the constitutional process of bicameralism and presentment is the text. If I allow a committee memo to override the plain text, I am allowing staff members to legislate.
  Furthermore, you speak of 'ordinary meaning' as something you test in-house. But the law binds the public, not your focus group. The 'ordinary meaning' is a legal construct of how a reasonable person reads the statute *at the time of application*, not how your interns read it during drafting.
  Finally, consider incentives. If courts know they can look at your redlines to fix your mistakes, you will draft sloppily, knowing the judge will clean it up using your private notes. By restricting me to the text, I force you to write better laws. The 'error' you fear is a feature, not a bug; it disciplines the legislature."

  **The Purposivist:**
  "The text is not a sacred incantation; it is a tool to achieve a public end. If the text, read literally, defeats the obvious purpose recorded in your own files, then the text has failed to capture the law.
  You say the committee didn't vote on the memo. True. But they voted on the *bill* assuming the memo was the shared understanding. To ignore the purpose is to pretend the legislature is a vending machine that spits out words without intent.
  Regarding incentives: If I ignore your drafting file, I risk creating absurd results that the legislature would immediately repeal if they noticed. My job is to maintain the coherence of the legal system, not to act as a spellchecker. If the record shows a drafting error versus a deliberate choice, I need to know which it is. Your 'bright line' example is exactly why I need the file: to confirm it was deliberate and not a botched edit."

  ### 3. The Normative Residue
  This is where your hypothesis meets its limit. Even if we agree that the evidence is discoverable, there are three normative reasons the fight persists:

  **A. Reliance and Notice**
  A citizen regulated by your licensing provision reads the statute. They do not have access to your drafting file. They do not know about the deleted "or equivalent experience" clause. If the court uses the file to rule against them, they are being bound by a rule they could not have known. Textualism prioritizes the *subject's* knowledge; purposivism prioritizes the *sovereign's* intent. That is a moral choice, not an evidentiary one.

  **B. The "Gaming" Problem**
  You mentioned the record is evidence. But it is also a weapon. If legislative history becomes admissible, drafters will start writing "shadow statutes" in the committee reports—contradicting the text to please a special interest, knowing the text will pass scrutiny but the report will guide the judge. By refusing to look, textualists are trying to prevent the corruption of the record itself. They are protecting the integrity of the evidence by excluding it.

  **C. Judicial Competence**
  You are a professional drafter. You know how to read a redline. A generalist judge does not. They might misinterpret a staffing change as a policy shift. Textualism is, in part, an admission that judges are bad historians. It is a heuristic to prevent judges from projecting their own purposes onto the legislature under the guise of "reading the file."

  ### 4. What Counts as Progress?
  If we accept your reframing—that this is about admissibility and risk allocation—progress looks like this:

  1.  **Abandon the "Meaning" Talk:** Stop asking "What does this mean?" and start asking "Who bears the cost of ambiguity?"
  2.  **Tiered Admissibility:** Develop clear rules for when the file is admissible. For example: The file is admissible to confirm ambiguity, but not to create it. Or: The file is admissible only if it was publicly available at the time of enactment (preserving notice).
  3.  **Default Rules:** Acknowledge that when the record is silent, we need a tie-breaker. Textualism is a default rule for when the evidence is thin. Purposivism is a default rule for when the evidence is clear but the text is flawed.

  Progress is moving from "Which method is true?" to "Which method minimizes systemic error costs?"

  ### 5. The "No Record" Scenario
  You asked if the answer changes when there is no record (old statute, fire, sloppy legislature).

  **Yes, it changes fundamentally.**

  Your hypothesis relies on the existence of the evidence. When the evidence is gone, the "evidential" frame collapses, and the dispute reverts to pure normativity.

  *   **For the Textualist:** The lack of a record strengthens their hand. If there is no file, the text is *all* there is. To guess at purpose without a record is pure judicial legislation. The "ordinary meaning" of the text becomes the only stable anchor.
  *   **For the Purposivist:** The lack of a record is a crisis. They must reconstruct purpose from broader context (other statutes, societal problems at the time). This makes the adjudication more uncertain and more dependent on the judge's own view of history.

  In the "no record" case, the fight is no longer about what the legislature *did* (since we can't know); it is about what the court *should do* when it doesn't know.
  *   Textualists say: "Stick to the words. If it's wrong, the legislature will fix it." (Status Quo Bias)
  *   Purposivists say: "Fix it to match the likely aim. Don't let a lost file cause injustice." (Correction Bias)

  ### Summary
  You are right that the "metaphysical" debate is largely a distraction. The facts are usually discoverable. But you are wrong that this dissolves the conflict. The conflict is not about whether we *can* know the purpose; it is about whether we *should* let that knowledge override the public text.

  The textualist values **stability and democratic form** (only text is voted on).
  The purposivist values **accuracy and functional justice** (law should do what it was meant to do).

  Your reframing is useful because it forces both sides to admit they are making a policy choice about judicial power, not discovering a philosophical truth. But it doesn't end the fight, because the policy choices are incompatible. One prioritizes the citizen's right to rely on the text; the other prioritizes the state's right to achieve its goal. That is a political conflict, and no amount of filing systems will resolve it.
