          *   No bibliography.

  2.  **Deconstruct the Theoretical Framework (Nguyen):**
      *   *Epistemic Bubble:* You haven't heard the other side. Fix: Expose them to it.
      *   *Echo Chamber:* You've heard the other side but have been taught to distrust it systematically. Fix: Much harder, exposure often backfires (reinforces distrust).
      *   *Application:* Mods need to know which one they are dealing with to decide whether to post links (Bubble) or lock threads/enforce neutrality (Chamber).

  3.  **Brainstorming Failure Modes (The "Before" Section):**
