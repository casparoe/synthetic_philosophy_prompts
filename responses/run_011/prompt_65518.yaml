      *   *The "Rare Disease" Factor:* Legitimate medical neglect *does* happen. Distrust isn't always irrational.
      *   *Burnout:* 20 minutes is optimistic for emotional labor.
      *   *Scope Creep:* Diagnosing the whole community instead of specific threads.

  4.  **Pressure-Testing the User's Hunch (Earned vs. Manufactured Distrust):**
      *   *Hunch:* Earned = specific, revisable, localized. Manufactured = global, rigid, loyalty test.
      *   *Verdict:* This is actually very strong and actionable. It aligns with Nguyen's work but makes it operational.
      *   *Operationalization:* Need concrete markers.
          *   *Specificity:* "Dr. X ignored my labs" vs. "All doctors are liars."
          *   *Revisability:* "If they did Y, I'd trust them" vs. "Nothing they do matters."
          *   *Source Independence:* "I read this study" vs. "Group Leader says this study is fake."
      *   *Risk:* Mods might misinterpret trauma responses as "manufactured." Need to be careful not to pathologize grief/anger.

  5.  **Drafting the Procedure (The Core):**
      *   *Goal:* 20 mins, one mod, structural analysis only.
      *   *Step 1: Source Mapping.* Where is info coming from? (Internal vs. External).
