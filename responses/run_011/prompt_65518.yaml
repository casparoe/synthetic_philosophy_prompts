      *   Increase in appeals.
      *   "Diagnosis" becoming the argument itself.

  9.  **Refining Tone:**
      *   Professional, empathetic, pragmatic.
      *   Acknowledge the difficulty of volunteer work.
      *   Direct about the "Mod Team" case (don't sugarcoat).

  10. **Review against Constraints:**
      *   20 mins? Yes, steps are quick checks.
      *   No medical judgment? Yes, focused on *how* claims are treated.
      *   Judgment calls flagged? Yes.
      *   Pressure test included? Yes.
      *   Three cases run? Yes.
      *   No bibliography? Yes.

  11. **Self-Correction/Polishing during drafting:**
      *   *Correction:* Initially, I might make the steps too complex. Need to simplify the questions.
      *   *Correction:* Make sure the distinction between "Bubble" and "Chamber" leads to different actions. Bubble -> Add links. Chamber -> Stop arguing, enforce rules, or handoff.
      *   *Emphasis:* Highlight that "Support Group" is a third category that looks like a bubble but shouldn't be popped aggressively.
      *   *Case 3 Honesty:* I need to make sure I don't just flatter the user. If their mod team is suppressing talk, the procedure should flag that as potential chamber-building behavior *by the mods*.

  12. **Final Polish:** Check the "Earned Distrust" section. Ensure the distinction is clear. Earned distrust is about *experience*; Manufactured is about *identity*.

