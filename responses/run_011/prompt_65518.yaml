      *   *Case 3 (Mod Team/Resources):* This is the tricky one. If mods suppress supplement talk without nuance, are *we* creating a chamber? Need to be honest here. If we ban discussion rather than contextualize, we might be mirroring the problem.

  8.  **Limitations & Failure Detection:**
      *   What indicates the tool is broken?
