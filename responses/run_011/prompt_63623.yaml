answer: |-
  The distinction I'm building on is between *composition* (what something is made of) and *consequence* (what it does to you). The speech argues that while the medium is optional, the emotional residue is mandatory. This is load-bearing in the lighthouse anecdote: the visible seam proves that damage and repair occurred, validating the pain without equating virtual objects to physical safety. It allows us to honor the dead player without confusing his avatar with his life.

  ***

  Good evening, Oakland. Good evening, Drift.

  It is a strange thing to stand in a room full of friends while also standing inside a server rack. But looking out at you—both the faces here and the avatars there—I realize this is the only way this makes sense. We are gathered in two places at once, because that is what this place taught us to do.

  Six years ago, we shipped code. We thought we were building a toy. We patched holes, we balanced physics, we wrote scripts. But you didn't treat it like a toy. You found a physics exploit in the Bell Tower Quarter and instead of breaking it, you built a district. We saw the logs and called it a glitch. You held court nights and called it a neighborhood. We spent six years arguing about patch notes. You spent six years arguing about property lines. I think you won that argument.

  When we announced the shutdown, some people called this "just a game." I know that phrase. It's meant to comfort. It's meant to say, "nothing here matters." But I've read the moderation logs. I've seen the weddings. I've seen the disputes settled by argument until someone conceded. If nothing here mattered, none of that would have stuck to you. But it did.

  We know there are differences. We know the rules here are not the rules of gravity and blood. But we also know that hurt doesn't care about the material it's made of.

  In year four, a lighthouse was destroyed. It had been built piece by piece, in memory of a mother. When it was razed, some of us said, "You can just log off. Nobody is actually hurt." We were wrong. You cannot log off a memory. You cannot log off grief. To escape the harm, you would have had to abandon the world itself. That is a cost. It is not a broken arm, but it is not nothing. When we restored the lighthouse, we couldn't hide the repair. There was a seam. She kept the seam. She said she liked it. That seam is the truth of this place. It proves that something broke, and something healed, and the history remains.

  We also know the difference between a server going dark and a heart stopping. In March, we lost a friend. Actually lost him. His avatar still stands in the Bell Tower. We know the avatar is not the man. But we also know what it means to keep vigil. To sit next to the silence. Those are two different kinds of facts, but they demand the same respect.

  So, as we prepare to shut down the power, I don't want to say we are losing a game. We are closing a jurisdiction. We are locking a door on a house where people lived. The atoms here in Oakland will stay. The code there in Drift will stop. But the changes made to the people in both rooms? Those are permanent. Those are going home with us.

  Please, join me.

  Here in Oakland, raise your glasses.
  In Drift, light a torch or raise your hand high.

  To the code that held us. To the seams that held fast. And to the friends who taught us that where you stand is real, because you stood there.

  Cheers.
