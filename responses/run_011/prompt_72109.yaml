answer: |-
  The light in the Registry of Horizon Instruments was always the same: a diffuse, shadowless grey that seemed to emanate from the walls rather than the fixtures overhead. It was a light designed to prevent eye strain during long reviews of micro-print, but to Elias, it felt like the light of a waiting room that had been occupied too long. He sat at Desk 44, the surface cleared of everything except the file folder designated 1798-A.

  The folder was not old paper; the original substrate had been digitized and re-encoded across three separate media migrations. But the weight of it was physical, a psychological density that pressed against the laminate of the desk. This was the Primary Instrument. It was a claim on the future, filed by a private citizen named Malthus, asserting a specific trajectory for the relationship between human population and subsistence. It was a limit-prediction. It did not say *when* the break would happen, only that the sequence tended toward a vertical wall.

  Elias was a junior adjuster. His job was not to judge the truth of the world, but to judge the integrity of the paperwork. He opened the folder. The first page was the original filing, dense with archaic syntax and confident assertions about geometrical and arithmetical ratios. He skipped past the preamble to the Schedule of Extensions. This was the ledger of survival. Every time the predicted wall failed to materialize by the instrument's maturity date, the holder was allowed to roll over the debt into the future, provided they posted collateral in the form of an auxiliary hypothesis.

  Elias spread the schedule out. It looked like a spine, each vertebra a decade, each clause a calcification.

  ***

  **INSTRUMENT 1798-A: SCHEDULE OF EXTENSIONS AND COLLATERAL CLAUSES**

  **Original Maturity:** 1850
  **Status:** Rolled Over
  **Clause 1 (1849):** *Excuse:* Unanticipated opening of hemispheric surplus lands (Americas/Australasia). *Collateral:* Arable land mass is finite; new lands constitute a one-time principal injection, not recurring interest.

  **Original Maturity:** 1900
  **Status:** Rolled Over
  **Clause 2 (1899):** *Excuse:* Mechanization of harvest. *Collateral:* Energy substitution (coal/oil) temporarily decouples labor from yield. Decoupling has a thermodynamic cost.

  **Original Maturity:** 1950
  **Status:** Rolled Over
  **Clause 3 (1948):** *Excuse:* Chemical fixation of nitrogen. *Collateral:* Yield acceleration is exponential but subject to diminishing returns on input efficiency. Returns must plateau by 2000.

  **Original Maturity:** 2000
  **Status:** Rolled Over
  **Clause 4 (1998):** *Excuse:* Demographic Transition observed. *Collateral:* Affluence acts as a preventive check. Fertility rates will converge below replacement in all industrialized zones by 2020, stabilizing the numerator.

  **Original Maturity:** 2020
  **Status:** Rolled Over
  **Clause 5 (2019):** *Excuse:* Genetic modification and vertical integration. *Collateral:* Land equivalence ratio will exceed 5:1 by 2025. If ratio < 5:1, the Pressure Event is deemed imminent regardless of caloric surplus.

  **Current Maturity:** 2025
  **Status:** Pending Review
  **Security Status:** Clause 4 marked "Active." Clause 5 marked "Pending Verification."

  ***

  Elias tapped his stylus against the screen. The schedule was clean, too clean. The language narrowed with every decade. In 1849, the excuse was new land. In 1998, it was behavior. The prediction was being saved by shrinking the target. Prosperity wasn't refuting the instrument; it was being absorbed by it as a delay mechanism. Catastrophe would confirm it instantly. Success merely bought time.

  He pulled the data sheet for Clause 4. The collateral stated: *Fertility rates will converge below replacement in all industrialized zones by 2020.* He cross-referenced this with the Global Demographic Audit released in January. The audit showed three industrialized zones where fertility had rebounded above replacement despite high affluence. The clause had matured in 2020. The condition was not met. The collateral was void.

  Technically, the security for the 2020 rollover was rotten. If Clause 4 failed, the excuse for the delay vanished. If the excuse vanished, the Pressure Event should have triggered in 2020. It hadn't. The instrument should have been settled as falsified. Yet, the status light on his dashboard remained amber: *Pending Review.*

  The door to the office chimed. Mrs. Gable entered without knocking. She was a senior adjuster, her hair a tight grey coil, her hands stained with the ink of physical stamps she refused to relinquish. She carried a mug of tea that smelled of stale bergamot.

  "You're on the 1798?" she asked, setting the mug on the edge of his desk.

  "Clause 4 is dead," Elias said. He didn't look up. "The fertility convergence didn't happen. The collateral expired false. The instrument should be settled."

  Gable leaned against the filing cabinet. She looked at the screen, then at the window where the grey light pressed against the glass. "Settled how, Elias?"

  "Closed. Falsified. The liability is extinguished. The Stability Dividend gets released to the claimants."

  "And if you close it," Gable said, "and the Pressure Event happens in 2026? What do we do then? Reopen the file? Issue a retroactive catastrophe?"

  "We deal with the evidence we have. Not the evidence we fear."

  Gable sighed, a sound like paper shifting in a box. "You're thinking like an auditor. You need to think like a registrar. This isn't a bet on a horse race. It's a limit. You cannot judge a limit by a prefix. If we settle this instrument because the last twenty years were comfortable, we are saying the sequence has terminated. But we don't know that. The only thing that confirms this instrument is a collapse. The only thing that refutes it is an infinite prosperity. We have neither."

  "We have a failed clause," Elias insisted. "The scaffolding is rotten."

  "The scaffolding is administrative," Gable corrected. "The theory is structural. Look at Clause 5. It's still pending. If we roll over based on Clause 5, we narrow the prediction again. We say, 'Okay, not land, but efficiency.' We keep the instrument alive so that if the wall does appear, we aren't caught without a record. An institution that settles limit-predictions prematurely is worse than one that never settles them. It creates a false sense of security."

  "It creates a zombie liability," Elias said. "It ties up capital. It keeps people waiting."

  He thought of the man in the lobby. He had seen him through the blinds earlier: Mr. Henderson, representing a consortium of agricultural insurers. They were the claimants on the Stability Dividend. They needed the instrument declared false so they could unlock the reserves tied to the risk. They had been waiting for thirty years. Every rollover meant another decade of locked assets, another decade of premiums paid into a void.

  "Henderson is outside," Elias said.

  "I know," Gable said. "He wants the dividend. He wants to bet on infinite growth. It's a risky bet. If you give him the dividend, he spends it. If the Pressure Event comes, who pays?"

  "The market."

  "The Registry," Gable said softly. "We are the insurer of last resort. If we declare the risk gone, and it returns, we bankrupt the future to pay the present."

  She walked around the desk and looked at the schedule. Her finger hovered over Clause 4. "This clause failed. Yes. So we strike it. We don't settle the instrument. We issue a Deficiency Notice. We require new collateral for the 2025 rollover. We tighten the terms. We make the next prediction more specific, more vulnerable. That is how we honor the science. We make it harder to survive, not easier."

  Elias looked at the cursor blinking on the *Recommendation* field. He could type *Settle: Falsified*. He could release Henderson's funds. He could declare the twentieth century a refutation. Or he could type *Roll Over: Conditional*. He could demand Clause 6. He could push the maturity date to 2050. He could require a new hypothesis about atmospheric carbon or aquifer depletion. He could keep the sword hanging.

  He thought about the sediment cores he had read about in college, back before he joined the Bureau. Layers of time. You could cut them open, count the varves, but you couldn't ask the lake to tell you what happened next. The lake only gave you what it had kept. This file was the same. It was a core of human anxiety, drilled deep into the future.

  "If I roll it over," Elias said, "Henderson stays in the lobby."

  "Henderson stays solvent," Gable said. "He keeps his reserves. If you're wrong, and the harvest fails, he needs those reserves. If you're right, and the harvest holds, he waits. Waiting is the cost of doing business with infinity."

  She left the mug and walked to the door. "Don't try to solve the theory, Elias. Just secure the file. Make sure the next clause is tight. If we must be wrong, let us be precise."

  The door clicked shut. The grey light seemed to deepen. Elias looked at the lobby camera feed on his secondary screen. Henderson was sitting in a plastic chair, reading a tablet. He looked tired. He was betting on continuity. He was betting that the prefix was the whole sequence.

  Elias turned back to the file. He highlighted Clause 4. He typed: *Status: Expired. Collateral: Void.*
  Then he moved to the Recommendation field.
  If he settled it, he was saying the danger was past. He was saying the limit would not be reached. But how could he know? The data was a finite prefix. The limit was elsewhere.
  If he rolled it over, he was perpetuating a fear. He was taxing the present for a catastrophe that might never come. He was validating a theory that survived by changing its shape.

  He thought about the light in the room. It was constant. It didn't change whether the instrument was true or false. It just illuminated the paper.
  He opened a new clause template.
  *Clause 6 (2025):* *Assumption:* *Global caloric storage capacity will not exceed 90 days of consumption.* *Maturity:* *2050.* *Condition:* *If capacity exceeds 90 days without distribution collapse, Principal Claim requires re-evaluation.*

  It was narrower. It was tighter. It was another piece of scaffolding.
  He looked at Henderson on the screen. The man stood up and walked to the window, looking out at the city, at the traffic, at the lights that signaled energy, consumption, life. Henderson turned back toward the door of the office. He was waiting for a sign.

  Elias's finger hovered over the *Submit* key.
  To settle was to say the story was over. To roll over was to say the story continued, but with a threat attached.
  He thought of the varves. One year, two years. You could argue over the count, but the sediment was already laid. Here, the sediment was yet to fall.
  He typed *Roll Over*.
  He attached the Deficiency Notice for Clause 4.
  He saved the file.

  The status light turned from amber to a pale, uncertain green. *Active.*
  Elias closed the folder. The weight on the desk did not change. He picked up Gable's mug and moved it to the center of the desk, out of the light. In the lobby, the door opened. Henderson would be coming in. He would not get his dividend. He would get a new form. He would get another wait.

  Elias turned off his monitor. The room returned to the diffuse grey. He sat in the dark for a moment, listening to the hum of the servers, wondering if he had just protected the future from bankruptcy, or protected a ghost from exorcism. The instrument was safe. The prediction was patient. The wall was still there, somewhere, beyond the light.

  ***

  The passage most at risk of collapsing into illustration is Gable's dialogue regarding "judging a limit by a prefix." It risks becoming a direct mouthpiece for the prompt's philosophical thesis. To mitigate this, I grounded her argument in bureaucratic liability and institutional risk ("We are the insurer of last resort") rather than abstract epistemology. Her defense is procedural—about the cost of being wrong—rather than purely philosophical, ensuring she remains a character within the system rather than a lecturer outside it.
