answer: |-
  Your TA is right to flag that sentence. In the literature, this slogan (often traced to Eddington and Russell, and revived by contemporary Russellian Monists like Galen Strawson, Philip Goff, and David Chalmers) is treated as a neutral starting point. But it is not neutral. It is a metaphysical wager disguised as an epistemic observation.

  To see why the premise is "doing too much work," we need to disentangle the different ways to interpret "Physics tells us what matter *does*, not what it *is*."

  Here is a breakdown of the distinct claims hidden in that slogan, sorted from harmless platitude to controversial metaphysics, analyzing whether they support the panpsychist inference.

  ---

  ### 1. The Methodological Platitude
  **The Claim:** Physical theories are mathematical models designed to predict behavior and interactions. They do not utilize phenomenological language or claim to reveal the "essence" of entities in a pre-scientific sense.
  *   **Status:** **Platitude.** Almost no one disputes this. Physics defines mass via equations of motion ($F=ma$), not by telling you what mass "feels like" from the inside.
  *   **Does it license Panpsychism?** **No.**
  *   **Where the Gap Opens:** This claim is about *description*, not *ontology*. Just because a map doesn't show the texture of the terrain doesn't mean the terrain has no texture, nor does it mean the texture *must* be mental. Standard physicalists accept this: physics describes behavior, and they argue that "what matter is" just *is* the stuff that behaves that way. There is no hidden remainder.

  ### 2. The Dispositionalist Thesis
  **The Claim:** Physical properties are *purely* dispositional. To have mass or charge is nothing over and above having the potential to interact in specific ways under specific conditions. There is no "categorical base" underlying the dispositions.
  *   **Status:** **Substantive but Defensible.** This is a serious metaphysical position (Dispositional Essentialism).
  *   **Does it license Panpsychism?** **No. In fact, it blocks it.**
  *   **Where the Gap Opens:** If properties are *pure powers*, then there is no "intrinsic nature" waiting to be filled. A power is defined entirely by its relation to other powers (what it does). If your classmate argues "something has to play the intrinsic role," the Dispositionalist replies: "Nothing plays that role because that role doesn't exist." The slogan is true here (physics tells us what it does), but the inference to "therefore it has an intrinsic 'is'" is denied.

  ### 3. The Categoricalist Demand (The Russellian Premise)
  **The Claim:** Dispositions/relations cannot float free. A causal web requires nodes. If physics describes the relations (what matter does), there must be non-relational, intrinsic properties (categorical properties) that ground those relations (what matter is). Physics leaves these out.
  *   **Status:** **Substantive and Controversial.** This is the heavy lifter. It assumes a specific metaphysics (Categoricalism) that many modern physicists and philosophers reject (see Dispositionalism and Structuralism below).
  *   **Does it license Panpsychism?** **Only if combined with further premises.**
  *   **Where the Gap Opens:** This establishes a *gap*, but not the *content* of the gap. It proves there is an "intrinsic nature," but not that the intrinsic nature is *experiential*.
      *   *Gap 1:* Why can't the intrinsic nature be "proto-experiential" or neutral?
      *   *Gap 2:* Why can't it be a "quiddity" (a non-experiential, non-dispositional primitive) that we are simply ignorant of?
      *   To get to panpsychism, your classmate needs the "Only Acquaintance" premise: *We are only acquainted with one intrinsic nature (our own consciousness), so we should posit that as the fundamental one.* This is an argument from parsimony/analogy, not a logical consequence of the slogan alone.

  ### 4. The Epistemic Humility Claim
  **The Claim:** Even if matter has an intrinsic nature, human cognitive faculties (evolved for survival) might be incapable of grasping it through scientific investigation.
  *   **Status:** **Defensible.** (See: Kantian noumena, or McGinn's "Cognitive Closure").
  *   **Does it license Panpsychism?** **No.**
  *   **Where the Gap Opens:** This licenses *agnosticism*, not panpsychism. If we can't know what matter is, we certainly can't positively assert it is experiential. It opens the door for panpsychism as a possibility, but it equally opens the door for dualism, idealism, or mysterious unknown properties.

  ### 5. The "Exhaustion" Claim (Flatly False / Question-Begging)
  **The Claim:** Physics claims to be a complete description of the causal structure of the world, and therefore *intentionally* leaves out intrinsic nature, implying intrinsic nature exists but is non-physical.
  *   **Status:** **Flatly False / Question-Begging.**
  *   **Why:** Standard physicalists do not agree that physics "leaves out" intrinsic nature. They argue that to be a physical object *just is* to occupy a node in the causal network. To say physics leaves something out presupposes that physicalism is false.
  *   **Does it license Panpsychism?** **Yes, but trivially.**
  *   **Where the Gap Opens:** This version of the slogan simply assumes the conclusion of Russellian Monism. It asserts that there is a non-physical intrinsic nature. If you start by assuming there is a non-physical intrinsic nature, you can easily argue it's mental. But you haven't argued for it; you've stipulated it.

  ---

  ### The Structuralist Challenge: What if there are no intrinsic natures?

  You asked what happens if we deny there are any intrinsic natures in the first place. This is the position of **Ontic Structural Realism (OSR)**.

  **The View:** OSR argues that "structure is all there is." There are no "things" that stand in relations; there are only the relations themselves. The universe is a web of interactions without nodes.

  **Impact on the Argument:**
  1.  **It dissolves the Classmate's Argument:** If OSR is true, the premise "something has to play the [intrinsic] role" is a category error. There is no role. The slogan "Physics tells us what matter does, not what it is" is accepted, but the implication "therefore there is a 'what it is'" is rejected. The "what it is" is exhausted by the "what it does."
  2.  **Does it save Physicalism?** It saves a version of physicalism often called **Structural Physicalism**. It avoids the panpsychist inference entirely.
  3.  **Does it leave something troubling?** Yes. This is the crux of the current debate.
      *   *The Hard Problem Remains:* Even if the world is pure structure, experience (qualia) does not *seem* structural. Experience seems to have an intrinsic "what-it-is-likeness."
      *   If the fundamental world is pure structure (no intrinsics), and consciousness is intrinsic (has a "what-it-is-likeness"), then consciousness still looks like an anomaly in the physical world.
      *   So, OSR blocks the *Russellian* route to panpsychism, but it doesn't necessarily solve the Hard Problem. It might just relocate it: "How does intrinsic experience arise from a world of pure relations?"

  ### Summary for Your Seminar

  Your TA's comment ("the premise is doing way more work than you think") points to **Claim #3 (The Categoricalist Demand)**.

  Your classmate is treating the slogan as **Claim #1 (The Platitude)**: "Physics describes behavior."
  But to get to panpsychism, they need **Claim #3**: "Behavior requires a non-behavioral substrate."

  Most standard physicalists deny Claim #3. They argue that to be a physical property *is* to have a causal profile. By insisting that there *must* be an intrinsic nature distinct from the causal role, your classmate is already smuggling in a dualist or Russellian metaphysics before the argument even begins.

  **The Verdict:**
  *   If you interpret the slogan as a **methodological point**, it's true but useless for panpsychism.
  *   If you interpret it as a **metaphysical point** (that intrinsics exist), it helps panpsychism but is highly controversial and rejected by dispositionalists and structuralists.
  *   The jump to **phenomenal properties** specifically requires an additional premise (the "Only Acquaintance" argument) that is independent of the slogan.

  The slogan doesn't prove panpsychism; it merely creates a vacancy sign. Panpsychism is just one applicant for the job, and structuralism says the vacancy doesn't exist.
