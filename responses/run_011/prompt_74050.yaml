answer: |-
  The office smelled of rusted nails and linseed oil, the residue of the hardware shop below seeping through the floorboards. Outside, the valley was dark, the river a invisible rumor beneath the rain. Nwosu sat with her hands clasped over the keyboard, the cursor blinking at the end of a sentence she had typed and deleted four times. Hertz leaned against the window frame, watching the condensation gather on the glass.

  "The number is 0.15," Hertz said. "Both models converge there. The external dataset gives it, the internal trials give it. Put it in the box and let's go home."

  "The box requires the probability of failure," Nwosu said, not turning from the screen. "It does not require the probability of failure *plus* a footnote regarding the fragility of the inference. But I am writing the footnote."

  "It's evasion," Hertz said. "You want to say the probability is 0.15, but the weight of the argument is low on the internal data. That's nonsense. If the probability is the same, the risk is the same. If you think the risk is effectively higher because the data is scant, then your probability isn't 0.15. It's a distribution centered there with a massive variance. Just give them the variance."

  "It is not variance," Nwosu said. "Variance implies I am uncertain about the probability. I am not uncertain about the logical relation between the eleven trials and the failure rate. That relation is what it is. But it is a thin relation. The nine years of data from the Alps are robust, but they are not *this* valley. The eleven trials are *this* valley, but they are scant. Both yield 0.15. But the weight of the evidence differs. I cannot act on them identically."

  "Action is where we live, Nwosu. Not in logical relations." Hertz pushed off the window and walked to the table. "You say you can't act on them identically. Yet you are willing to recommend deferral. That costs money. Lives are at risk during the deferral year. To make that recommendation, you must believe the cost of waiting is less than the expected loss of deploying a fragile system. That calculation requires numbers. Your willingness to spend the budget on delay reveals your credence. You have a number. You're just hiding it behind the word 'weight'."

  "I am not hiding it. I am refusing to pretend that my willingness to bet reflects the evidence itself." Nwosu finally turned her chair. "You think probability is a measure of my temperament. I think it is a measure of the evidence. My temperament might be cautious. That doesn't change the logical relation between the eleven trials and the hypothesis."

  "Then prove it," Hertz said. He pulled a notebook from his pocket, tore out a sheet, and slid it across the desk. "I'll bet you one hundred dollars. The next debris flow event in this valley, regardless of when. If the system fails to warn, I pay you. If it warns, you pay me. At odds implied by 0.15."

  Nwosu looked at the paper. She picked up a pen. "Fine."

  "See?" Hertz said. "You signed. You have a betting quotient. You have a degree of belief. The 'weight' is just your confidence in that quotient, which is itself a higher-order probability. It collapses, Nwosu. It all collapses into coherence. If you refuse the bet, you're incoherent. If you take it, you admit you're working with credences."

  "I accept the bet because I need you to stop talking so we can finish the report," Nwosu said, capping the pen. "And because refusing would be socially costly. But accepting demonstrates only that I am willing to adopt a convention under pressure. It does not demonstrate that the probability *is* the betting disposition. You confuse the causality of my temperament with the logic of the evidence. I can be coerced into acting *as if* I believe the world is a casino without believing the world *is* a casino."

  "But the normativity comes from the coherence," Hertz pressed. "If your beliefs don't track the evidence, you lose money. If they don't cohere, you lose money regardless of the evidence. That's the whole point. There is no further fact about rational credence over and above avoiding sure loss and responding to data. You want an objective logical relation that hangs in the air between evidence and conclusion, independent of any agent. That's a ghost. I'm looking at what you *do*."

  "And I am looking at what warrants what you do," Nwosu countered. "Coherence prevents you from being exploited. It does not prevent you from being wrong. I can be perfectly coherent and assign 0.15 based on scant evidence. I can be perfectly coherent and assign 0.15 based on abundant evidence. Your theory says these are the same state of mind if the number is the same. My theory says they are different states of knowledge. The authority needs to know the difference. If I tell them 0.15, and they treat the Alps data and the valley data as equivalent, they will make mistakes when the geology shifts. Weight tells them how much new evidence will move the needle. Probability does not."

  "Then say that," Hertz said. "Say 'Expect high volatility in future estimates.' That's a claim about the future behavior of the probability estimate. That's a number. That's measurable. Don't tell me there's a metaphysical property called 'weight' that isn't captured by the expected stability of the credence."

  "Because it isn't about stability," Nwosu said. "It is about completeness. I can have stable ignorance. If I know nothing, I might be stable at 0.5. But the weight is zero. If I have comprehensive evidence, I might be at 0.5. The weight is high. Your view cannot distinguish these cases without smuggling in the very logical relations you deny. You say 'responsiveness to evidence.' Responsiveness to what? To the logical force of the evidence! You need my objective relations to define what counts as 'responsive'."

  Hertz rubbed his temples. "I need nothing of the sort. I need a learning rule. Bayes' rule. You update on likelihoods. If the evidence is scant, the likelihoods are weak, the posterior moves slowly. If the evidence is strong, the posterior moves fast. It's all in the machinery. You don't need a separate dimension called weight."

  "Bayes' rule requires a prior," Nwosu said. "Where does the prior come from? If it's just another disposition, you're spinning in circles. If it's based on evidence, you need a logic of evidence to tell you which priors are rationally permitted. You're smuggling the logic in through the back door while pretending it's just psychology."

  They stood in silence for a moment, the hum of the refrigerator below filling the gap.

  "Okay," Hertz said softly. "The report. What goes in the box?"

  "0.15," Nwosu said. "With the annex stating that the weight of the internal evidence is insufficient for full deployment confidence."

  "That annex implies the number is unreliable," Hertz said. "Which means the number shouldn't be 0.15. It should be 'undefined' or 'range'."

  "If I write 'undefined', they will deploy based on intuition," Nwosu said. "If I write 0.15 with the weight clause, they might pause. The goal is not to describe my soul, Hertz. It is to prevent disaster. The weight clause is a policy tool."

  "So you admit it's pragmatic," Hertz said.

  "I admit action is pragmatic. Probability is not."

  Hertz laughed, a short, dry sound. "We're going in circles. Let's isolate it. What is the single claim we disagree on? Is it whether probability exists independent of agents?"

  "No," Nwosu said. "It's whether rational action requires us to pretend probabilities exist when they don't."

  "It's whether 'weight' is a distinct variable or just a function of variance," Hertz corrected. "If I can model your weight using a hierarchy of distributions, I win."

  "If you can model the logical relation using distributions, you haven't modeled the relation, you've modeled the agent's uncertainty about the relation," Nwosu said. "You've changed the subject."

  "Then we can't write the footnote," Hertz said. "Because the footnote asserts a distinction I deny exists."

  "And the main text asserts a precision I deny is justified without the footnote," Nwosu replied.

  Hertz looked at the screen. The cursor blinked. 0.15.

  "Leave the box," Hertz said. "I'll write the annex. I'll phrase it as 'high sensitivity to new data'."

  "And I will edit it back to 'low weight of argument'," Nwosu said.

  "We'll be here all night."

  "Probably," Nwosu said. "But the probability of that is not the same as the weight of the evidence that we will be."

  Hertz picked up his coat. "You know that sentence means nothing to me."

  "I know," Nwosu said. "But I suspect you know exactly what I mean."

  Hertz paused at the door. "I do. That's the problem."

  He left. Nwosu turned back to the screen, the oil smell rising as the heat kicked on, and deleted the period at the end of the sentence, leaving it open.
