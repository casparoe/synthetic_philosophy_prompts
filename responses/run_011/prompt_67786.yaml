  Candidates (1) and (4) are effectively disqualified; (1) requires search effort that will exceed $n$ to find dominance proofs, and (4) replaces the deterministic verified kernel with probabilistic structures incompatible with your core design.

  **Does my hypothesis in the second paragraph survive your scrutiny, and if it fails, at exactly which step?**
  Your hypothesis survives scrutiny; the only step that would fail is if a rewrite attempted to change the axiom system to one stronger than the base theory can simulate within the bound $n$, but under your fixed-theory constraint, bounded soundness is provable.

  **In one sentence, what does the obstacle actually reduce to once the reasoner is bounded?**
  It reduces to a finite code-verification problem ensuring the successor adheres to the bounded proof-checking protocol, rather than a logical proof of the successor's general soundness.
