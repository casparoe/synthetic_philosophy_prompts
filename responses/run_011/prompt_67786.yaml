  **(2) Escalating base theory (Reflection principles)**
  *   **Scale A:** 3
  *   **Scale B:** 9
  *   **Justification:** Auditability degrades rapidly as axiom systems shift, and the fixed bound $n$ may prevent utilizing the stronger axioms effectively. Ideally, this solves the infinite trust chain problem for unbounded reasoners via consistency strength.

  **(3) Robust-reasoning (Parametric bounded Löbness)**
  *   **Scale A:** 5
  *   **Scale B:** 8
  *   **Justification:** Implementation complexity is high for only four or five rewrites, though it aligns better with bounded resources than (1). It was designed specifically to handle trust transfer between bounded agents with varying resource assumptions.

  **(4) Graded trust (Logical induction/Probabilistic)**
  *   **Scale A:** 2
  *   **Scale B:** 5
  *   **Justification:** Probabilistic assignments undermine the "verified kernel" requirement and make post-hoc auditing nearly impossible. This addresses uncertainty rather than the specific logical barrier of self-referential proof.

  **(5) Limited-resource reasoners (Explicit self-model)**
  *   **Scale A:** 7
  *   **Scale B:** 6
  *   **Justification:** Explicitly modeling the bound aligns well with your architecture and helps prevent unreachable proof goals. It describes the constraint accurately but does not fully resolve the trust transfer mechanism on its own.

  **(6) Asymmetric or Vingtian reflection (Certify next only)**
  *   **Scale A:** 8
  *   **Scale B:** 7
  *   **Justification:** Fits the "few rewrites" constraint perfectly by requiring only local step-wise verification rather than infinite chain trust. It sacrifices general self-trust for a compromise that ensures convergence in limit scenarios.

  **(7) Amortized certification (Your proposal)**
  *   **Scale A:** 9
  *   **Scale B:** 3
  *   **Justification:** Maximizes auditability and eliminates freezing on novel problems by deferring to the incumbent, fitting your specific constraints ideally. It does not solve the general theoretical problem of self-trust, only sidestepping it for specific cases.

  **(8) No self-modification (Human-audited redeployment)**
  *   **Scale A:** 4
