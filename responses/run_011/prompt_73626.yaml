answer: |-
  Good morning. Looking around this room, I see it is divided, though not in any way that separates us in grief. On one side, there are those who knew her mind: colleagues and students who spent decades walking through the landscapes of her thought. On the other, there are those who knew her heart: family who knew the woman behind the thought, the person who made the tea, who worried about the weather, who kept her own counsel.

  For fifty years, she held to a simple, steady conviction. She believed that the world is not hiding from us. She believed that if something is true, it is not because it is hidden in the dark, but because it is waiting in the light for us to find it. Nothing, she argued, is truly beyond our reach. Whatever is the case, could have come to be known.

  She lived this belief quietly. She was an intensely private person. To many of you in the family, she may have seemed reserved, perhaps even secretive. You knew there were parts of her life you never entered. And now, sitting in her study, looking at the desk full of papers she left behind, the instinct is to feel a closing of a door. It feels as though a part of her has slipped away, into a place where we cannot follow. It feels as though some truth about her is now lost to us for good.

  I know that feeling. I share it. There is a specific silence that falls when a voice stops, and in that silence, it feels as though questions go unanswered forever.

  But I think she would have looked at that desk and seen something different. She would not have seen a vault; she would have seen a garden waiting for spring.

  Those papers are not secrets kept from us. They are thoughts paused in mid-sentence, waiting for us to pick them up. She believed that truth is not a possession to be guarded, but a landscape to be walked. Her privacy was not a wall to keep us out; it was a respect for the time it takes to understand. She did not hide herself because she thought she was unknowable. She held herself back because she believed knowing takes patience, and she did not want to offer us anything less than the whole truth.

  So, we are left with this tension. We feel the loss of her presence acutely. We feel the absence of her voice, which could have explained the handwriting, which could have told us which draft mattered, which could have laughed at her own mistakes. That loss is real. It hurts. We mourn the chance to ask her, to sit with her, to learn from her directly. That opportunity is gone.

  But the knowledge is not.

  The reconciliation lies not in denying our grief, but in changing how we look at what remains. The feeling that something is beyond reach is a feeling about *her*, not about the *truth*. She is beyond our reach now. We cannot knock on her door. But what she knew, what she wrote, what she was—it remains here. It is not hidden. It is simply waiting for us to be ready to read it.

  To the family: do not look at those papers as a lock. They are an invitation. She believed that everything could be known. By leaving them, she trusted that you would know them in time. She trusted that the truth of her life was not something that died with her breath, but something that lives in the ink, in the memories, in the way she treated you.

  To the colleagues: do not look at those papers as a puzzle to be solved alone. They are a conversation to be continued. She believed that knowing is a shared act. She did not write for the dust; she wrote for us.

  We are mourning the silence, yes. But we must not mistake the silence for emptiness. The room is quiet, but it is not empty. The desk is still, but it is not closed.

  In the coming weeks, we will go through those papers. We will read them together, family and colleagues side by side. We will find the arguments, and we will find the grocery lists. We will find the struggles and the triumphs. And as we do, we will prove her right. We will show that nothing about her is beyond our reach, provided we are willing to do the work of reaching.

  She is not here to guide us. That is the loss. But the path is still there. That is the legacy.

  We will miss her voice. But we will hear her thoughts. And in doing so, we will keep faith with her deepest conviction: that nothing true is ever truly lost, so long as there are people willing to look for it.

  Thank you.
