prompt: |-
  Okay so this is a slightly weird ask. I'm a novelist, three books out, and I've got nine months of funded time at a residency starting in the fall — room, board, a stipend, no teaching — but the fellowship office wants a "research statement" to go with the book, meaning an actual question-driven plan rather than a synopsis or a theme. The book is about a man in his sixties who was genuinely dangerous when he was twenty-four, and who has spent forty years building an architecture around himself so the thing never gets a chance to happen: the job, the small town, the routines, the distance from his brother, never more than one drink, the wife he picked precisely because she would never corner him. That much is easy to write. What I cant figure out, and what I want the nine months for, is a distinction I keep needing and don't have.

  Here's what I've noticed. The mask he built is maintained by the disposition it masks. He stays away from his brother because he's afraid of what he'd do; staying away means the fear never gets tested; the fear never getting tested is the only reason the disposition never gets worn down or revised. So the arrangement is self-sealing — the loop feeds itself, and it would keep feeding itself long after the circumstances that made it necessary have gone. My brother-in-law is a philosophy grad student and he pointed me at the literature on dispositions, the fink and mask cases where the object fails to manifest because something interferes, plus the antidote and mimicker variants and Lewis's patch to the simple conditional analysis. But as far as I can tell, in every one of those cases the interference comes from outside — a sorcerer, packing material, an electro-fink — and the whole point is that the disposition is still there underneath, intact, waiting. Nothing he gave me seems to handle a mask the bearer installed on purpose, forgot they installed, and which is now the only thing keeping the disposition alive rather than merely hidden. And there's a further wrinkle I need for the ending: by page 300 the brother is dead, the town has changed, and there is literally no circumstance left that would trigger anything. Is the disposition still there? Is "he's still violent" true, false, or just badly posed at that point? There's also that move someone makes where disposition talk is interest-relative, so what's true depends on what the ascriber cares about — I suspect that view dissolves my question entirely, which would be bad news for the novel, so I want it engaged head-on instead of waved away.

  So: write me the statement, call it two pages. I need the question stated precisely enough that it could come out either way — right now I honestly can't tell if I'm asking one hard question or three soft ones, and I need you to say which and cut what doesn't belong. Then why the existing positions don't settle it: the conditional analyses and their patches, the causal-grounding accounts, the interest-relative response, and anything else that bears on a mask that sustains itself. Then the method — what I'd actually be doing month by month for nine months while also drafting the book three days a week, so the plan has to survive contact with a real schedule, and I want you to say what gets cut first if I fall behind. Then what a result looks like: I want something usable, ideally a set of conditions or a test a reader could apply to the text, so that the difference between "sealed and still there" and "burned out thirty years ago and nobody noticed" is something the book can dramatize rather than assert. And be honest about failure — tell me what would count as having wasted the nine months, including the possibility that the whole distinction is just a way of talking and I should rebuild the novel around something else. Don't bother with citations or a bibliography; my brother-in-law and I will fill those in. I want the argument structure, not the references.
reasoning: |-
  Here's a thinking process that leads to the suggested research statement:

  1.  **Analyze the Request:**
      *   **User:** Novelist (3 books published), awarded a 9-month residency (fall start, funded, no teaching).
      *   **Task:** Write a "Research Statement" for the fellowship office.
      *   **Subject:** A novel about a man in his 60s who built a life to suppress a violent disposition he had at 24.
      *   **Core Philosophical Problem:** The "mask" (the life architecture) is self-installed and self-sustaining. It's not an external fink/mask (like Lewis's examples); it's internal and structural. The mask keeps the disposition alive by preventing it from being tested/revised.
      *   **Specific Questions:**
          1.  Is the disposition still there when triggers are gone (brother dead, town changed)?
          2.  Is "he's still violent" true, false, or badly posed?
          3.  How to handle interest-relative accounts (which might dissolve the question)?
      *   **Requirements:**
          *   Length: Approx. 2 pages (standard research statement length).
          *   Tone: Professional, rigorous, but accessible to a fellowship committee (likely interdisciplinary).
          *   Structure: Precise question(s), critique of existing positions, methodology (9-month plan), expected results (usable conditions/tests), honest assessment of failure.
          *   Constraint: No citations/bibliography (focus on argument structure).
          *   Constraint: Must fit a writing schedule (drafting 3 days/week).
          *   Constraint: Identify what gets cut if behind schedule.

  2.  **Deconstruct the Philosophical Core:**
      *   *Standard Disposition Theory:* Dispositions are conditional properties (If struck, glass breaks).
      *   *Finks/Masks:* External interferers prevent manifestation. The disposition remains.
      *   *The Novelist's Twist:* The "mask" is the subject's own life structure. It prevents the *erosion* of the disposition, not just the manifestation. Usually, dispositions fade if not exercised (skill decay, habituation). Here, the avoidance *preserves* the potential.
      *   *The Endgame:* Triggers are removed. No brother, no town pressure. Is the violence a "ghost"?
      *   *The Risk:* Interest-relative views say "violent" just means "we treat him as dangerous." The novelist needs ontological weight, not just semantic convenience.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound academic but creative. "The Architecture of Suppression" or "Self-Sustaining Masks." Let's go with *The Ontology of the Self-Sealing Mask: Disposition, Avoidance, and Decay.*
      *   **The Question:** The user asked to distinguish between one hard question or three soft ones. It's really *one* hard question with facets.
          *   *Core:* Does a disposition persist when its non-manifestation is structurally guaranteed by the subject, and all external triggers are subsequently removed?
          *   *Sub-questions:* Is the "mask" part of the disposition's causal base? Does avoidance constitute preservation or atrophy?
      *   **Critique of Existing Positions:**
          *   *Conditional Analysis (Lewis, etc.):* Fails because the "if" condition is engineered to never happen, but the engineering *is* the disposition's life support.
          *   *Causal Grounding:* Usually looks for intrinsic properties. But here the "intrinsic" property is maintained by extrinsic arrangements (distance, routine).
          *   *Interest-Relative:* Dangerous for the novel. If it's just about what observers care about, the character's internal reality doesn't matter. Need to argue for a mind-independent fact of the matter (for the sake of the drama).
      *   **Methodology (9 Months):**
          *   Needs to balance research and writing.
          *   Months 1-3: Conceptual mapping (The "Fink" problem vs. The "Architecture" problem).
          *   Months 4-6: Drafting key scenes (The "Test" scenes).
          *   Months 7-9: Synthesis/Revision.
          *   *Cut list:* If behind, cut the deep dive into interest-relative semantics. Stick to the metaphysics of persistence.
      *   **Results:**
          *   Not a thesis, but a "dramatic test." A set of conditions the reader can use to judge the character.
          *   Example: The "Counterfactual Stress Test."
      *   **Failure Conditions:**
          *   If the distinction collapses into semantics.
          *   If the character becomes a puppet of the theory.
          *   If the "answer" is unknowable (which might actually be good for fiction, but bad for the statement's promise of resolution).

  4.  **Refining the Tone:**
      *   The user is a novelist, not a philosopher. The statement shouldn't pretend to be a PhD dissertation. It should frame the *writing* as the research method. The "data" is the text.
      *   Avoid jargon overload, but use the terms provided (fink, mask, conditional analysis) correctly to show competence.
      *   Keep it tight. Two pages is roughly 800-1000 words single-spaced.

  5.  **Addressing Specific User Constraints:**
      *   *Cut what doesn't belong:* I need to explicitly state that the "interest-relative" debate is secondary to the "persistence" question.
      *   *Schedule:* 3 days writing, 2 days research? Or integrated? The prompt says "drafting the book three days a week." So 4 days left for research/other.
      *   *Failure:* Be honest. If the philosophy eats the story, that's failure.

  6.  **Drafting the Content (Iterative Process):**
      *   *Opening:* Define the project. It's a novel, but the research drives the plot.
      *   *The Problem:* The "Self-Sealing Mask." Standard philosophy assumes external masks. This is internal/structural.
      *   *The Gap:* Existing theories don't account for a mask that *sustains* the disposition rather than hiding it.
      *   *The Plan:* Break it down by quarters.
      *   *The Output:* A "Dramatic Logic" for the ending.
      *   *Risk:* Theory overriding character.

  7.  **Final Polish:**
      *   Check word count/length feel.
      *   Ensure the "one hard question" distinction is clear.
      *   Make sure the "failure" section is candid.
      *   *Self-Correction during drafting:* I initially thought about suggesting he read more philosophy. But he has a brother-in-law for that. The research statement should focus on how he *uses* the philosophy to build the narrative. The "research" is narrative engineering.

  8.  **Final Review against constraints:**
      *   Two pages? (Will aim for ~900 words).
      *   No citations? (Check).
      *   Methodology included? (Check).
      *   Failure conditions? (Check).
      *   Tone? (Professional, artistic-intellectual).

  *(Self-Correction on the "One vs. Three Questions" point)*: The user asked me to say which it is. I should explicitly state: "This is one hard question, not three soft ones." It adds clarity.

  *(Self-Correction on Methodology)*: Make sure the research doesn't sound like it will stop the writing. The writing *is* the experiment.

  Let's write it.cw
answer: |-
  **Project Title:** The Ontology of the Self-Sealing Mask: Disposition, Avoidance, and Decay
  **Applicant:** [Your Name]
  **Project:** Novel in Progress (Working Title: *The Architecture of Safety*)

  **Research Question**
  This is one hard question, not three soft ones: *Does a behavioral disposition persist when its non-manifestation is structurally guaranteed by the subject, and all external triggers are subsequently removed?*

  Standard philosophical accounts of dispositions (conditional analyses and their patches) assume that if a disposition fails to manifest, it is due to external interference (a "mask" or "fink") or the absence of stimuli. In those cases, the disposition is assumed to remain intact underneath. My project investigates a specific anomaly: a mask that is self-installed, forgotten, and structural. The protagonist has built a life (routine, geography, marriage) specifically to prevent the manifestation of a violent disposition. Crucially, this avoidance does not merely hide the disposition; it preserves it by preventing the wear-and-tear of testing. By the novel's end, the external triggers (the brother, the town) are gone. The question is ontological, not semantic: Is the violence a real property of the man at sixty, or has it atrophied into a ghost? I am rejecting the interest-relative solution (that "violent" is only true if an ascriber cares) because it dissolves the dramatic tension. I need a mind-independent fact of the matter to drive the climax.

  **Critique of Existing Frameworks**
  Current literature on dispositions handles external interference well. If a sorcerer prevents a glass from breaking when struck, the glass is still fragile. However, these models fail to account for *self-sustaining avoidance*. In standard cases, the mask is distinct from the object. In my protagonist's case, the "mask" is his biography.

  1.  **Conditional Analyses:** These fail because the "if" condition is engineered to be impossible. But unlike a standard mask, the engineering prevents the *revision* of the disposition. Usually, dispositions decay without use. Here, the avoidance creates a vacuum that keeps the potential pristine.
  2.  **Causal Grounding:** Accounts that look for intrinsic causal bases struggle here because the "base" is partly extrinsic (distance from the brother, the specific job). If the base is partly environmental, and the environment changes, does the disposition vanish?
  3.  **Interest-Relative Accounts:** I am explicitly setting this aside. If the truth of "he is violent" depends only on the observer's interest, the protagonist's internal reality becomes irrelevant. For the novel to work, there must be a fact of the matter that exists even if no one is around to be threatened.

  **Methodology and Timeline (9 Months)**
  The research is not separate from the writing; the drafting *is* the testing ground. I will write three days a week; the remaining time is dedicated to conceptual stress-testing of the narrative.

  *   **Months 1–3 (Mapping the Loop):** Focus on the "Self-Sealing" mechanism. I will draft the early life sections where the architecture is built. The research task is to define the specific routines that act as the mask. *Deliverable:* A schematic of the protagonist's avoidance behaviors mapped against philosophical "mask" criteria.
  *   **Months 4–6 (The Removal of Triggers):** Drafting the late-life sections where the brother dies and the town changes. The research task is to model the "decay rate" of the disposition. Does it fade instantly? Does it linger? I will write three different versions of the internal monologue in Chapter 20 to test the phenomenological difference between "suppressed" and "absent."
  *   **Months 7–9 (The Test Case):** Finalizing the ending. I will apply the "Counterfactual Stress Test" (see Results) to the manuscript. If the text cannot support the distinction, I will revise the ending to acknowledge the ambiguity.

  *Contingency Plan:* If I fall behind on drafting, I will cut the deep dive into causal grounding accounts. I will retain the focus on the *persistence* question (does it remain?) and drop the *location* question (where is it?). If the writing stalls, the philosophy must serve the plot, not vice versa.

  **Expected Results**
  I am not seeking a philosophical proof, but a "Dramatic Logic." I need a set of conditions a reader can apply to the text to judge the character's state without being told.

  *   **The Counterfactual Stress Test:** I aim to establish conditions under which the disposition *would* manifest if the architecture were removed, even if it never actually does.
  *   **The Atrophy Threshold:** A narrative metric to determine when avoidance becomes extinction. For example: Does he dream of violence? Does he flinch at sudden movements? These become the empirical data points for the reader.
  *   **Usable Output:** A revised manuscript where the ending turns on this distinction. The reader should be able to argue whether the man is safe or dangerous based on textual evidence, not authorial assertion.

  **Risk and Failure Conditions**
  Honesty about failure is required for this research to be rigorous.
  1.  **Theoretical Override:** The primary risk is that the philosophy flattens the character. If the protagonist becomes a puppet for the "mask" theory, the nine months are wasted. The character's psychology must lead; the ontology must follow.
  2.  **Dissolution:** It is possible that after nine months, the distinction between "sealed and still there" and "burned out" proves to be merely verbal. If the interest-relative view turns out to be inescapable, I must rebuild the novel around that ambiguity. The failure would be insisting on a binary where none exists.
  3.  **Undramatizable:** If the distinction cannot be shown through action or subtext, but requires exposition, the research has failed to translate into fiction.

  The goal of this residency is to ensure the novel's climax rests on a structural truth about human nature, rather than a plot convenience. I am using the residency to buy the time necessary to think through the metaphysics of my character's danger, so that when the mask finally slips, the reader knows exactly what fell.
