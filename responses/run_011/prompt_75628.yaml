prompt: |-
  I spent three hours last night arguing with a friend who builds vision models, and we got nowhere because we never agreed on what we were asking for. His position: a Bongard problem is a solved benchmark — twelve figures in two classes of six, one concept separates them, and a system that classifies held-out figures correctly thereby has a theory of the concept. My position: accuracy is downstream of a question he has not answered, namely what the concept is before it gets applied. Before I read another paper from either side, I want the specification.

  Write the desiderata for a theory of one-shot concept induction of the Bongard kind — what any account must deliver to count as adequate, where adequate means good enough to tell a builder which machinery is mandatory and which is merely one camp's taste. For each requirement, give the case that motivates it and tag it as non-negotiable, contested, or a prejudice of a particular camp (psychological realism, minimal description length, no hand-coded feature vocabulary, and the like). The list should cover the phenomena a theory must explain rather than just the classifications it must match; the distinctions it may not collapse — between forming a concept and applying one, between a description of a single figure and a hypothesis about a class, between the vocabulary available and the search conducted over it; and the results it must remain consistent with.

  Test the requirements against three probes I made up: (a) a problem whose discriminating concept cannot be read off any single figure, only from a relation holding across the two sets, which breaks the assumption that figures are classified independently; (b) a garden-path problem where the most salient low-level description covers five of six figures on each side and fails on the sixth, and the sixth is not noise; (c) a problem where the correct description of a figure is unavailable until the solver has committed to a partial description and can return to revise it.

  Then tell me which single requirement does the most to exclude candidates, and — this is the part I actually want — whether any subset of the requirements is jointly unsatisfiable. Can a theory demand no privileged innate feature vocabulary, one exposure per class, and a concept that is afterward articulable and checkable, or must one of the three go? Close with a paragraph on how a description-length account, a Bayesian-program-learning account over a supplied domain-specific language, and an open-ended bottom-up account assembled from many weak partial concepts fare against the list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **Context:** The user had a 3-hour argument with a friend (vision model builder) about Bongard Problems (BPs).
      *   **The Conflict:** Friend says BPs are solved (classification accuracy = theory of concept). User says accuracy is downstream of defining *what the concept is* before application.
      *   **The Task:** Write a specification (desiderata) for a theory of one-shot concept induction of the Bongard kind.
      *   **Requirements for Desiderata:**
          *   Must distinguish mandatory machinery from camp-specific taste.
          *   Must tag each requirement (Non-negotiable, Contested, Prejudice).
          *   Must cover phenomena, not just classification results.
          *   Must distinguish: forming vs. applying, single figure description vs. class hypothesis, vocabulary vs. search.
          *   Must test against three specific probes (a, b, c).
          *   Must identify the single most exclusionary requirement.
          *   **Crucial:** Determine if any subset of requirements is jointly unsatisfiable (specifically: no innate vocabulary + one exposure + articulable concept).
          *   **Closing:** Evaluate three specific approaches (Description-Length/MDL, Bayesian Program Learning/BPL, Open-ended Bottom-Up) against the list.

  2.  **Analyze the Bongard Problem Domain:**

      *   *Structure:* 12 images, 6 left (Class A), 6 right (Class B).
      *   *Goal:* Find the rule/concept separating A from B.
      *   *Challenge:* One-shot learning, symbolic reasoning, visual perception, hypothesis generation.
      *   *The User's Point:* Classification accuracy isn't enough. A neural net might classify correctly using texture statistics without "understanding" the rule (e.g., "triangles on left, circles on right"). The *theory* must explain the *rule*.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Separation of Perception and Hypothesis.* You can't just map pixels to labels. You need an intermediate representation.
      *   *Requirement 2: One-Shot Induction.* It must work with 6 examples per side. No gradient descent on the test set.
      *   *Requirement 3: Articulation.* The concept must be expressible (language/symbols), not just a vector.
      *   *Requirement 4: Robustness to Noise/Outliers.* (Probe b).
      *   *Requirement 5: Revision/Backtracking.* (Probe c).
      *   *Requirement 6: Relational Dependence.* (Probe a). The concept might depend on the contrast between sets, not just properties of one set.

      *   *Tagging:*
          *   Non-negotiable: Logical consistency, handling the input format.
          *   Contested: How symbolic the representation must be.
          *   Prejudice: Cognitive realism (human-like), MDL preference.

  4.  **Developing the Probes:**

      *   *Probe (a) Relational Concept:* E.g., Left side: objects increase in size. Right side: objects decrease in size. You can't classify one image without knowing the trend of the set.
      *   *Probe (b) Garden Path/Outlier:* E.g., 5/6 are red circles. 1/6 is a blue square. If the rule is "convexity," the color/shape distractor shouldn't break it. Or, the "outlier" is actually the key (e.g., "contains an anomaly"). Let's go with the prompt's suggestion: Salient description fails on the 6th, but the 6th isn't noise. It implies the concept is more abstract.
      *   *Probe (c) Revision:* You see a triangle. You think "shape." Later you realize it's "number of vertices." You need to update the description of the *first* figure based on new info.

  5.  **Analyzing Joint Unsatisfiability (The Core Conflict):**

      *   *The Trilemma:*
          1.  No privileged innate feature vocabulary (Open-ended).
          2.  One exposure per class (Data efficiency).
          3.  Concept is articulable/checkable (Symbolic/Semantic).
      *   *Argument:* If you have no innate vocabulary, you must construct features from pixels. To construct features from pixels in one shot requires strong priors (which look like innate vocabulary). If you have strong priors (BPL with DSL), you have a privileged vocabulary. If you have open-ended features (Neural), you usually need more data to make them articulable.
      *   *Conclusion:* It is likely jointly unsatisfiable to have *truly* open-ended features, *strictly* one-shot, and *fully* articulable concepts without smuggling in priors that act like a vocabulary. One must give. Usually, "No innate vocabulary" is the casualty (BPL uses a DSL). Or "Articulable" is the casualty (Deep Learning). Or "One-shot" is the casualty (Meta-learning).

  6.  **Evaluating the Three Approaches:**

      *   *MDL (Minimum Description Length):* Good for articulation and search. Struggles with "No innate vocabulary" (needs a codebook). Struggles with Probe (c) revision if the code is fixed.
      *   *BPL (Bayesian Program Learning):* Strong on one-shot and articulation. Weak on "No innate vocabulary" (the DSL is the vocabulary).
      *   *Open-ended Bottom-Up (e.g., Neural-Symbolic, Emergent):* Strong on "No innate vocabulary." Weak on One-shot and Articulation (hard to extract rules).

  7.  **Refining the Output Structure:**

      *   **Introduction:** Acknowledge the dispute (Accuracy vs. Theory).
      *   **Section 1: Desiderata Specification:** List requirements with tags and motivations.
      *   **Section 2: Probe Testing:** Apply requirements to probes a, b, c.
      *   **Section 3: The Impossibility Result:** Address the trilemma (Vocabulary vs. Data vs. Articulation).
      *   **Section 4: Architectural Evaluation:** MDL, BPL, Bottom-Up.

  8.  **Drafting the Content (Self-Correction during drafting):**

      *   *Correction on Probe (a):* Make sure it emphasizes that independent classification fails. The label depends on the *set* context.
      *   *Correction on Tags:* Be precise. "Non-negotiable" means if you miss this, it's not a Bongard solver. "Prejudice" means it's a specific philosophical stance (e.g., Fodor's LOT).
      *   *Refining the Trilemma:* The prompt asks specifically about "No privileged innate feature vocabulary," "One exposure," and "Articulable." I need to be decisive here. The standard view in cognitive science (Fodor) suggests you can't learn a primitive vocabulary without having it. So, "No innate vocabulary" + "Articulable" is the tension. One-shot makes it harder. I will argue that "No privileged innate vocabulary" is the one that must go or be redefined, because without *some* structure, induction from 6 examples is mathematically impossible (No Free Lunch).

  9.  **Final Polish:** Check tone. It needs to be rigorous, analytical, and slightly philosophical to match the user's prompt style. Ensure the distinction between "classification" and "concept induction" is central.

      *(Self-Correction on the "Unsatisfiable" question)*: The prompt asks: "Can a theory demand no privileged innate feature vocabulary, one exposure per class, and a concept that is afterward articulable and checkable, or must one of the three go?"
      *   *Analysis:* If "No privileged innate feature vocabulary" means *no* priors on features, then learning an articulable concept from 6 examples is impossible (infinite hypothesis space). If it means "features are learned from pixels but constrained by architecture," it's possible but the architecture *is* the privileged vocabulary.
      *   *Decision:* I will argue they are jointly unsatisfiable in the strict sense. You must have a bias (vocabulary/DSL) to constrain the search space enough for one-shot learning to yield an articulable result.

  10. **Final Review against constraints:**
      *   Desiderata list? Yes.
      *   Tags (Non-negotiable, Contested, Prejudice)? Yes.
      *   Motivations? Yes.
      *   Probes (a, b, c) tested? Yes.
      *   Single most exclusionary requirement? Yes.
      *   Joint unsatisfiability analysis? Yes.
      *   Closing paragraph on MDL, BPL, Bottom-Up? Yes.

      *Let's write.*
answer: |-
  ### Specification for a Theory of One-Shot Bongard Concept Induction

  The dispute between you and your friend rests on a category error. Your friend defines success as **classification accuracy** (mapping inputs to labels). You define success as **concept recovery** (mapping inputs to a generative rule). A theory of Bongard Problems (BPs) must account for the latter; the former is merely a consistency check. Below are the desiderata for an adequate theory, tagged by their epistemic status.

  #### I. Desiderata

  **1. The Separation of Description and Decision**
  *   **Requirement:** The system must produce an intermediate symbolic or structural description of each figure *before* assigning a class label. The classification cannot be a direct end-to-end mapping from pixels to {Left, Right}.
  *   **Motivation:** Without this, a system can solve BPs via texture statistics or dataset bias without grasping the concept (e.g., classifying based on background noise correlated with the drawing tool).
  *   **Tag:** **Non-negotiable.** (Without this, you have a classifier, not a concept inducer.)

  **2. Hypothesis Space Constraint via One-Shot Viability**
  *   **Requirement:** The search space of possible concepts must be constrained sufficiently that a unique (or near-unique) hypothesis can be identified from exactly six positive and six negative examples without gradient descent on the test set.
  *   **Motivation:** BPs are one-shot tasks. If the theory requires thousands of epochs to converge on the rule, it fails the "induction" criterion.
  *   **Tag:** **Non-negotiable.** (Defines the problem class.)

  **3. Articulation and Checkability**
  *   **Requirement:** The induced concept must be expressible in a language (natural or formal) such that a human can verify whether a new figure satisfies the rule *independent* of the system's output.
  *   **Motivation:** Distinguishes "knowing how" (classification) from "knowing that" (theory). If the concept is a weight matrix, it is not articulable.
  *   **Tag:** **Contested.** (Connectionists argue distributed representations are a form of articulation; symbolicists demand explicit predicates.)

  **4. Vocabulary Independence (The "No Hand-Coding" Clause)**
  *   **Requirement:** The primitive features (e.g., "triangle," "inside," "larger") used in the description cannot be pre-hardcoded as specific detectors for the specific dataset. They must be constructed or general-purpose.
  *   **Motivation:** Prevents cheating by building a "Bongard-Net" that simply checks for the 300 known concepts from Bongard's original book.
  *   **Tag:** **Prejudice.** (Specifically, a prejudice of the *General Intelligence* camp. The *Engineering* camp accepts domain-specific DSLs as valid.)

  **5. Set-Level Context Sensitivity**
  *   **Requirement:** The description of a single figure may depend on its relation to the other five figures in its class and the six in the contrast class.
  *   **Motivation:** Some concepts are inherently comparative (e.g., "Left side figures are increasing in size; Right side are decreasing").
  *   **Tag:** **Non-negotiable.** (Required to solve relational BPs.)

  **6. Revisability of Perceptual Commitments**
  *   **Requirement:** The system must be able to retroactively alter the description of Figure 1 after analyzing Figure 6, if the emerging hypothesis demands a different parsing of the initial input.
  *   **Motivation:** Human solvers often realize, "Oh, this isn't about shape, it's about vertex count," and re-scan the first image.
  *   **Tag:** **Contested.** (Batch processing models satisfy this implicitly; sequential/online models must build explicit backtracking mechanisms.)

  ---

  #### II. Probe Testing

  Here we test whether a theory meeting the above desiderata can handle the specific pathologies you identified.

  **Probe (a): The Relational Trap**
  *   *Scenario:* Class A contains figures where the internal object is larger than the container. Class B contains figures where the internal object is smaller. However, absolute sizes vary wildly.
  *   *Failure Mode:* A theory violating **Desideratum 5 (Set-Level Context)** will attempt to classify figures independently. It will fail because "large inside" is not an absolute property; it is a relation.
  *   *Requirement:* The theory must allow the *hypothesis* to bind variables across the set, not just within the figure. The "concept" is a relation between sets of relations.

  **Probe (b): The Garden-Path Outlier**
  *   *Scenario:* 5/6 Class A figures are red circles. The 6th is a blue square. 5/6 Class B are red squares. The 6th is a blue circle. The rule is "Color matches Shape" (Red-Circle/Blue-Square vs Red-Square/Blue-Circle).
  *   *Failure Mode:* A theory relying on **Minimum Description Length (MDL)** without **Desideratum 6 (Revisability)** will latch onto "Redness" or "Circularity" as the primary feature because it compresses 5/6 examples best. It will treat the 6th as noise.
  *   *Requirement:* The theory must have a mechanism to detect when the "exception" is systematic. It must prioritize *consistency of rule* over *similarity of surface features*.

  **Probe (c): The Retroactive Revision**
  *   *Scenario:* Figures look like triangles. Early hypothesis: "Three sides." Later figures reveal the "triangles" are actually composed of three separate lines not touching. Rule: "Closed vs. Open."
  *   *Failure Mode:* A feed-forward pipeline violating **Desideratum 1 (Separation)** and **Desideratum 6 (Revisability)** locks the feature "triangle" at the perception stage. It cannot update the symbol to "three lines" without re-processing pixels.
  *   *Requirement:** Perception must be distinct from interpretation, and interpretation must be able to query perception again with new parameters.

  ---

  #### III. The Impossibility Result

  **The Single Most Exclusionary Requirement:**
  **Desideratum 3 (Articulation and Checkability).**
  This requirement excludes the vast majority of modern deep learning approaches. A standard vision transformer can achieve high accuracy on Bongard-like tasks (Desideratum 2) without hand-coded features (Desideratum 4), but it cannot output a checkable rule. It produces a vector, not a sentence. This is the hardest constraint to satisfy physically and computationally.

  **The Joint Unsatisfiability Trilemma:**
  You asked whether a theory can demand:
  1.  **No privileged innate feature vocabulary** (Features are learned/open).
  2.  **One exposure per class** (Data efficiency).
  3.  **Concept is afterward articulable and checkable** (Symbolic output).

  **Verdict: These three are jointly unsatisfiable.**

  You must sacrifice one. Here is the logic:
  *   To satisfy **(2) One-Shot**, you require strong inductive biases to constrain the hypothesis space. With only 12 examples, the space of possible rules is infinite. You need priors to prune the tree.
  *   To satisfy **(3) Articulable**, the output must be compositional and symbolic. This implies the search is over a space of symbols.
  *   To satisfy **(1) No Innate Vocabulary**, the system must construct these symbols from raw data without pre-defined primitives.

  If you have **no innate vocabulary (1)**, you cannot constrain the search space enough to learn from **one exposure (2)** while guaranteeing an **articulable result (3)**. This is a variation of Fodor's "Learnability Constraint." You cannot learn a primitive concept (like 'inside' or 'causality') from data alone if you do not already have the representational capacity to formulate it. If you build that capacity from scratch, you need more data (violating 2). If you constrain it to work with little data, the constraints *are* the innate vocabulary (violating 1).

  **Which must go?**
  In practice, **(1) No privileged innate feature vocabulary** is the casualty. All working systems (including human cognition, arguably) rely on a "Language of Thought" or a Domain-Specific Language (DSL) that acts as a privileged vocabulary. You can claim the vocabulary is "learned in infancy," but for the Bongard task itself, it functions as innate.

  ---

  #### IV. Architectural Evaluation

  **1. Minimum Description Length (MDL) Account**
  *   **Performance:** Fails **Probe (b)**. MDL seeks the shortest code for the data. In the Garden-Path scenario, the shortest code describes the 5/6 majority and treats the 6th as noise bits. It lacks a mechanism to value *rule consistency* over *data compression* unless explicitly programmed to do so.
  *   **Verdict:** Good for articulation, bad for outlier logic.

  **2. Bayesian Program Learning (BPL) over a Supplied DSL**
  *   **Performance:** Satisfies **Articulation** and **One-Shot**. It handles **Probe (c)** well via probabilistic inference over programs.
  *   **Failure:** Violates **No Innate Vocabulary**. The DSL *is* the privileged vocabulary. If the correct concept requires a primitive not in the DSL (e.g., "shadow"), the system cannot learn it.
  *   **Verdict:** The strongest candidate, provided you accept the DSL as a necessary prejudice.

  **3. Open-Ended Bottom-Up (Neural-Symbolic/Emergent)**
  *   **Performance:** Satisfies **No Innate Vocabulary** (features emerge).
  *   **Failure:** Fails **One-Shot** and **Articulation**. Emerging features require many exposures to stabilize. Extracting a checkable symbolic rule from emergent activations is the "interpretability gap." It cannot guarantee the rule is checkable.
  *   **Verdict:** Theoretically appealing for general intelligence, currently inadequate for Bongard specifications.

  **Conclusion:** Your friend is wrong that accuracy equals theory. You are right that the concept must be defined prior to application. However, to build the machine, you must concede that "defining the concept" requires a pre-existing vocabulary to define it *with*. The machinery mandatory for this task is not a learner of everything, but a searcher over a constrained, symbolic space.
