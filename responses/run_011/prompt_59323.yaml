answer: |-
  **Project Title:** Protocol and Psi: Rereading Turing's Telepathy-Proof Room as the Epistemic Core of the Imitation Game

  **Statement of Research Question**
  Standard reconstructions of Turing's 1950 *Mind* paper treat the final objection regarding Extrasensory Perception (ESP) as a biographical anomaly—a moment where rigorous argumentation collapses into personal credulity. This project challenges that consensus. My central research question is: *Does the ESP objection constitute the epistemic core of the imitation game, defining it not as a measure of intrinsic intelligence but as a claim about what an interrogator is entitled to infer from an interaction conducted under a specified isolation protocol?*

  I argue that Turing's proposal to place competitors in a "telepathy-proof room" is not a retreat from the test but a specification of its experimental conditions. If this reading holds, the imitation game is fundamentally a protocol for controlling information leakage rather than a behavioral definition of mind. This project seeks to validate this reading through close textual analysis and to test its durability by mapping it onto contemporary evaluation practices for large language models (LLMs), where isolation protocols (held-out sets, contamination audits) are paramount. The question is disputable: if the ESP section is merely a concession to the editors of *Mind* or a personal tic, my structural reading collapses. If, however, it resolves ambiguities in the test's design that persist today, it demands a revision of the standard philosophical historiography.

  **Critique of Existing Treatments**
  Three dominant approaches currently manage the ESP passage, and all leave the research question open. First, intellectual historians typically psychologize the text, treating the passage as an embarrassing biographical artefact where Turing's interest in psychical research leaks into an otherwise careful paper. This approach isolates the text from its argumentative function, dismissing it as noise rather than signal. Second, philosophers of mind who reconstruct the "Turing Test" quietly omit the objection from their formalizations. By treating the test as a pure behavioral metric, they ignore Turing's own insistence that the test requires environmental controls to remain valid. Third, AI practitioners occasionally quote the "telepathy-proof room" as trivia or a witty closer, yet they fail to recognize the structural homology between Turing's isolation requirement and modern contamination audits.

  None of these positions answer whether the ESP objection is constitutive of the test's logic. The historians dismiss it; the philosophers excise it; the practitioners tokenize it. Consequently, we lack an account of the imitation game that integrates its evidential structure. My project posits that the ESP section is the place where the test's evidential structure is made explicit, doing more philosophical work than the celebrated opening sections.

  **Methodology**
  This project employs a method of close reading combined with structured conceptual comparison. I will not undertake archival work regarding Turing's relationship with the Society for Psychical Research. I lack the time and linguistic resources for German or deep archival digging, and moreover, the philosophical validity of the argument does not depend on Turing's private beliefs but on the public logic of the text. Nor will I pursue a purely conceptual analysis detached from the 1950 context. The specific vocabulary of "interrogators," "competitors," and "rooms" is essential; abstracting too far loses the mechanistic constraints Turing is imposing.

  Instead, I will treat the 1950 paper as a technical specification for an experimental setup. By analyzing the ESP passage as a control variable, I will establish a framework for "isolation protocols" in intelligence testing. I will then apply this framework to contemporary ML evaluation literature. This comparative method is justified because the modern field is currently grappling with the same epistemic problem Turing identified: how to distinguish genuine inference from information leakage. If the "telepathy-proof room" is the conceptual ancestor of the "held-out test set," the history of AI evaluation requires rewriting.

  **The Asymmetry Problem**
  A critical component of this research involves confronting a specific asymmetry that threatens to undermine the proposed analogy. Turing notes that if a machine uses a random number generator, it might be subject to the psychokinetic powers of the interrogator. This is a worry about the direction of influence running from the evaluator to the system. Contemporary contamination worries run the other way: from the world's training data into the system.

  I do not pretend this question is settled. It is possible that this asymmetry destroys the analogy, suggesting Turing was worried about experimental interference while modern practitioners are worried about training integrity. However, it is also possible that both are instances of a broader category: "causal isolation requirements for valid inference." A key decision point in the project will be determining whether these are distinct problems or variations of the same epistemic constraint. The proposal must remain open to the possibility that the historical case and the modern one are analogous only superficially.

  **Work Plan and Decision Points**
  *Months 1–3: Textual Reconstruction.* I will produce a line-by-line commentary on the ESP section and its relation to the preceding objections.
  *Decision Point 1 (Month 3):* If the textual evidence suggests the ESP passage is genuinely disconnected from the main argument (e.g., contradictory terminology), I will pivot to a historiographical account of why Turing included it, rather than a philosophical rehabilitation.

  *Months 4–6: Modern Contextualization.* I will survey current literature on LLM evaluation, specifically focusing on contamination audits, data leakage, and benchmark isolation.
  *Decision Point 2 (Month 6):* If modern evaluation practices are shown to be theoretically distinct from experimental isolation (e.g., purely statistical rather than causal), I will narrow the scope to a history of metaphors in computer science.

  *Months 7–9: Synthesis and Asymmetry Analysis.* I will draft the core argument comparing the two protocols, focusing heavily on the directionality of information flow (psychokinesis vs. contamination).
  *Decision Point 3 (Month 9):* If the asymmetry proves fatal to the strong reading, I will formulate a weaker claim regarding the evolution of "control" in computing.

  *Months 10–12: Writing and Dissemination.* Finalizing deliverables and preparing for peer review.

  **Deliverables and Failure Modes**
  The successful outcome of this fellowship will be two academic articles and one jointly written position piece. The first article, aimed at historians of computing, will argue for the ESP section's centrality to the 1950 text. The second, for philosophers of science, will generalize the "isolation protocol" concept. The position piece will be aimed at benchmark designers, suggesting that historical awareness of the telepathy-proof room clarifies current contamination debates.

  The project fails if the analogy between the telepathy-proof room and modern isolation protocols proves to be merely metaphorical. A specific failure mode is demonstrating that Turing's concern was uniquely metaphysical (pertaining to psi) while modern concerns are purely statistical (pertaining to probability distributions), rendering the structural comparison void. Another failure mode is if the archival context (which I will monitor secondarily) reveals the passage was a late addition demanded by editors, stripping it of argumentative weight. I will monitor preprints and editorial correspondence notes to mitigate this risk.

  **Wider Significance**
  Why should a funding body care about the epistemology of a seventy-five-year-old party game? Because the "Turing Test" remains the cultural and philosophical shorthand for AI capability, yet its operational definition is slipping. As language models begin to pass traditional benchmarks, the field is experiencing a crisis of evaluation reminiscent of Turing's original worry: are we measuring capacity or leakage? By recovering the logic of the "telepathy-proof room," this project offers a historical grounding for modern concerns about benchmark integrity. It suggests that the history of AI is not just a history of increasing capability, but a history of tightening experimental controls. Understanding the genealogy of these controls helps practitioners distinguish between genuine advances in reasoning and artifacts of data exposure. This is not merely historical housekeeping; it is an intervention in how we validate intelligence itself.
