answer: |-
  This is a sharp observation. You have put your finger on a gap in the standard "Wrong Kind of Reasons" (WKR) literature, which tends to treat reasons as static properties of the agent-object relationship (e.g., the demon offering you money to believe vs. evidence for the belief). It rarely accounts for **aggregative metaphysics**—where the ontology of the object itself shifts based on the distribution of attitudes toward it.

  There is no single canonical label for this specific flip in the meta-ethics literature, but the machinery to explain it exists in the intersection of **Response-Dependence Theory**, **Institutional Facts** (Searle), and **Reflexivity** (Soros/Merton).

  If you need a term for your seminar, I propose calling this **Constitutive Response-Dependence**.

  Here is the carving you asked for: how this differs from adjacent concepts, why the "kind" of reason flips, and the boundary conditions that separate the Bank case from the Guru case.

  ### 1. The Mechanism of the Flip
  In the standard WKR debate, the distinction is:
  *   **RKR (Right Kind):** Object-given. Bears on whether the attitude is *fitting* (e.g., evidence the bank is solvent).
  *   **WKR (Wrong Kind):** State-given. Bears on whether it is *beneficial to have* the attitude (e.g., believing makes you sleep better).

  In your cases, the "consideration" is: *$N$ number of people hold attitude $A$ toward object $O$.*

  *   **At the Individual Level ($n=1$):** My holding $A$ does not change $O$'s properties. Therefore, my reason for holding $A$ is purely instrumental (WKR). I am trusting a shaky bank because I want to avoid a crash, not because the bank is actually sound.
  *   **At the Collective Level ($n=N$):** The aggregate holding of $A$ *constitutes* a property $P$ in $O$. If $P$ is the property that makes $A$ fitting, then the consideration "$N$ people hold $A$" becomes evidence that $O$ has $P$. Therefore, it becomes an RKR.

  The reason flips from WKR to RKR because the **truth-condition** of the attitude is *ontologically dependent* on the distribution of the attitude itself.

  ### 2. Differentiation from Adjacent Concepts

  You asked to distinguish this from nearby concepts. Here is the precise carving:

  **A. Self-Fulfilling Prophecy (Merton)**
  *   *Mechanism:* Causal. A false definition of a situation evokes new behavior which makes the originally false conception come true.
  *   *Difference:* SFP describes the *causal history*. It does not address the *normative status* of the reason. In an SFP, I might still know the belief was originally false. In your Bank case, once the collective acts, the bank *is* sound. The reason becomes truth-apt. You are asking about the *justification*, not the genealogy.

  **B. Lewisian Conventions**
  *   *Mechanism:* Coordination equilibria. We drive on the right because you drive on the right.
  *   *Difference:* Conventions are arbitrary. There is no intrinsic "rightness" to driving on the right. In your Bank case, solvency is not arbitrary; it is a functional state required for the bank to exist. The reason flips to RKR because solvency is a *real property* constituted by the convention, not just a coordination trick.

  **C. Speech Acts / Promises (Searle/Austin)**
  *   *Mechanism:* Declarative. "I promise" creates an obligation.
  *   *Difference:* Promises create *deontic* facts (obligations/permissions). Your cases involve *alethic* or *evaluative* facts (truth/soundness/admirability). You are describing how beliefs/attitudes constitute *descriptive* or *evaluative* properties, not just normative statuses.

  **D. Standard Response-Dependence (McDowell, Wiggins)**
  *   *Mechanism:* $X$ is valuable iff $X$ would elicit approval from ideal observers.
  *   *Difference:* Standard response-dependence usually posits an *ideal* limit (what we *would* feel). Your case is about *actual* aggregation (what we *do* feel). It is **Actualist Constitutivism**.

  ### 3. Boundary Conditions: Why the Bank Flips and the Guru Doesn't

  You suspected the Guru case is shakier. You are right. The flip from WKR to RKR only succeeds if the property in question is **Functionally Constituted** rather than **Intrinsically Valued**.

  Here are the three boundary conditions for **Constitutive Response-Dependence**:

  **Condition 1: The Property Must Be Relational/Functional, Not Intrinsic.**
  *   **Bank (Passes):** "Solvency" in a fractional reserve system is functionally defined as the *ability to meet withdrawal demands*. If no one demands withdrawal (because they trust), the ability exists. The property is defined by the relation between the bank and the depositors.
  *   **Guru (Fails):** "Admirability" (moral worth) is typically defined as an intrinsic property of character (virtue, kindness). While admiration is a *response* to admirability, admirability is not *constituted* by admiration. A tyrant admired by a cult is still a tyrant. The property is intrinsic, not relational.
  *   **Boss (Mixed):** "Competence" is functional (gets results). If admiration boosts morale and results improve, he *is* competent (RKR). "Decency" is intrinsic. If admiration just makes him arrogant, he is not decent (WKR remains WKR).

  **Condition 2: Epistemic Transparency of the Constitution.**
  *   For the reason to be RKR, the agents must be able to treat the collective attitude as *evidence* of the property.
  *   **Bank:** We know the rules of banking. We know confidence = liquidity. Therefore, "others are confident" is genuine evidence of "liquidity."
  *   **Guru:** We know (or should know) that cult dynamics decouple admiration from virtue. Therefore, "others are admiring" is *not* evidence of virtue; it is evidence of indoctrination. The link is broken.

  **Condition 3: The Threshold of Ontological Shift.**
  *   There must be a specific aggregation point where the WKR *becomes* RKR.
  *   **Bank:** There is a tipping point. If 5% stay, it's WKR (hope). If 95% stay, it's RKR (the bank is now mathematically sound).
  *   **Guru:** There is no tipping point where mass admiration turns a sociopath into a saint. The function is asymptotic or null.

  ### 4. Summary for the Seminar

  If you need to present this, here is the formulation:

  > "The distinction between Wrong Kind and Right Kind reasons assumes a static ontology of the object. However, in cases of **Constitutive Response-Dependence**, the property that makes an attitude fitting is ontologically constituted by the aggregation of that very attitude.
  >
  > At the individual level, the reason is pragmatic (WKR) because the individual cannot constitute the property. At the collective level, the reason becomes evidential (RKR) because the collective attitude *instantiates* the truth-condition of the attitude.
  >
  > The flip fails when the property is **intrinsically defined** (moral virtue) rather than **functionally defined** (solvency, effectiveness). In the Bank case, confidence creates solvency. In the Guru case, admiration does not create virtue. Therefore, the Bank case allows a normative flip; the Guru case remains a collective error."

  ### 5. A Coinage (If you want one)

  If "Constitutive Response-Dependence" feels too dry, you could call this **Reflexive Fittingness**.

  *   **Standard Fittingness:** Attitude fits Object because Object has Property $P$.
  *   **Reflexive Fittingness:** Attitude fits Object because Attitude (aggregated) creates Property $P$.

  This captures the loop without reducing it to mere causality. It explains why your head doesn't turn into a spreadsheet: spreadsheets assume static variables; banking (and philosophy) requires managing variables that change when you look at them.

  **One final warning for the seminar:** Be prepared for the constructivist objection. A hard-line moral realist will argue that *no* moral properties are response-dependent, so the Boss case can never fully flip on the "decency" metric, only on the "effectiveness" metric. Keep the Bank case as your primary anchor; it is the most robust example of an institutional fact where the WKR/RKR flip is undeniable.
