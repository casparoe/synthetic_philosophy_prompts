      He kept the angles. He dropped the signs. He was narrowing the path toward us.
      She said no. He was cutting away the noise to find a harmony we cannot hear.
      She says the geometry that gave us the laws of motion is the same geometry that told him how the stars affect the soul.
      You cannot keep the law and discard the belief. They share a root.
      If you cut the root, the flower dies.
      She argues the angles that divide the circle are the ones that move a soul.
      I argue he was clearing the weeds to find the law.
      [Pause]
      I am not standing here to say she changed my mind.
      I am standing here to say she changed the room.
      For thirty-four years, she sat at a desk.
      Imagine that desk.
      It was covered in papers. Old ink. Fragile edges.
      She traced the lines he drew. She followed the angles he measured.
      She did this until the lamp went out.
      Her husband knows this light. Her daughters know this quiet.
      Her grandchildren are between six and nineteen.
      None of them need to know what a planetary aspect is.
      They only need to know that their grandmother treated old words with care.
      She taught them that patience is a form of love.
      She did not just read the words. She listened to the intent.
      She made a place where astronomers feel welcome.
      They often think this archive is a museum of errors.
      She showed them it is a workshop.
      She made historians respect the math.
      They often think it is just decoration.
      She showed them it is the structure.
      She built a bridge between the telescope and the manuscript.
      Here is a joke for the specialists.
      Astronomers worry about where the planets will be. Historians worry about where the papers are.
      Marianne worried about whether Kepler was consistent.
      [Pause]
      I still think he was pruning toward us.
      I still think he was trying to be modern.
      But I look at her work, and I see the wholeness she sees.
      Even if I am right about his intent, she is right about his heart.
      He wanted the world to make sense.
      She wanted his life to make sense.
      That is a larger task.
      We are leaving tonight into the rain.
      We are leaving into a world that separates science from feeling.
      Marianne spent a lifetime showing us they were once one thing.
      I may not agree with how she fits the pieces.
      But I agree that the picture is beautiful.
      And I agree that she is the one who framed it.
      My objection remains. But my affection is larger.
      So please raise your glasses.
      To Marianne.
      To the harmony she found.
      And to the friends she made along the way.

