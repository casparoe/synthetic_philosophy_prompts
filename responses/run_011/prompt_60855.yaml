answer: |-
  First, a historical correction: Jean Buridan never actually used the donkey example. He discussed a dog choosing between equal food bits, arguing the will could suspend judgment to seek more information. The "ass" scenario was invented by later critics (like Leibniz) to mock his determinism, not to champion free will.

  Second, the theoretical diagnosis is flawed. Expected Utility Theory (EUT) does not predict paralysis. In rational choice theory, an agent maximizes utility by selecting any option from the set of maximal elements. If $U(A) = U(B)$, both options are maximal. Choosing A is rational; choosing B is rational. The theory defines rationality as *optimization*, not *unique determination*.

  The paradox only arises if you smuggle in a hidden premise: that rational action requires a strict preference (a reason to pick A *over* B). EUT rejects this. A reason to pick A is simply that A maximizes utility. The fact that B also maximizes utility doesn't invalidate A. Therefore, no "tiebreaker axiom" is needed to prevent starvation; the agent simply picks one. Randomization is permissible but not required.

  Verdict: No; indifference permits arbitrary choice without paralysis.
