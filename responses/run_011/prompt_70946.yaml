      *   *Point 6:* Triviality check.

      *Let's write.*
answer: |-
  Here is the accuracy audit you requested. My judgment is based on a close reading of Tolstoy's *What Is Art?* (1897), treating the text as the primary authority rather than secondary critical debates.

  ### 1. Claim-by-Claim Audit

  Here is the breakdown of the passage's specific assertions:

  *   **"Art is a form of communication, nothing more exalted."**
      *   **Verdict:** **Acceptable.** Tolstoy explicitly defines art as an activity consisting in this: that one man consciously, by means of certain external signs, hands on to others feelings he has lived through.
  *   **"Just as words carry thoughts... artworks carry feelings."**
      *   **Verdict:** **Acceptable.** This is the core analogy Tolstoy uses to distinguish art (feeling) from speech (thought).
  *   **"The artist recalls a feeling... reawakens it... fixes it... so that other people catch it."**
      *   **Verdict:** **Fair Simplification.** Tolstoy does describe the process of evoking a felt experience. However, the summary omits the requirement that the artist must be *compelled* to share it, not just recalling it at will.
  *   **"What marks off art from other kinds of transmission is that its quality is measured by the strength of the infection."**
      *   **Verdict:** **Wrong.** This conflates two distinct questions in Tolstoy's theory: (1) Is it art? and (2) Is it *good* art? Infectiousness determines if it is art at all. The *quality* (good vs. bad) is determined by the *content* of the feeling (see section 2 below).
  *   **"Tolstoy therefore throws out the traditional definition of art in terms of beauty... beauty just names what gives us pleasure."**
      *   **Verdict:** **Acceptable.** Tolstoy argues that "beauty" is merely a synonym for "that which pleases," rendering it useless as an objective definition.
  *   **"Because the worth of a work is entirely a matter of how widely and how powerfully it communicates, art that only a trained minority can appreciate fails by that fact alone."**
      *   **Verdict:** **Half-Right/Half-Wrong.** It is true that Tolstoy rejects elite art. However, "worth" is not *entirely* a matter of communication range. A work could be widely communicative (e.g., patriotic propaganda or pornography, in Tolstoy's view) and still be "bad" art because the feeling transmitted is morally corrupt.
  *   **"He is not moralizing here in the ordinary sense; he is applying a communicative test rather than a doctrinal one."**
      *   **Verdict:** **False.** This is the most significant distortion in the passage. Tolstoy is aggressively moralizing. The "communicative test" is subservient to a specific religious doctrine (see section 4).
  *   **"Sincerity for him means being honest about what one actually felt."**
      *   **Verdict:** **Simplification.** It reduces a metaphysical condition to a psychological one. For Tolstoy, sincerity is the absence of affectation and the presence of an inner *need* to express, not merely factual accuracy about one's emotional state (see section 3).
  *   **"Located the disease of modern art in professional artists who manufacture effects on commission."**
      *   **Verdict:** **Acceptable.** Tolstoy blames the payment system and the separation of art from the laboring life for the rise of "counterfeit" art.

  ### 2. Infection vs. Quality (The "Good Art" Distinction)

  The summary is incorrect when it states: *"Because the worth of a work is entirely a matter of how widely and how powerfully it communicates..."*

  Tolstoy strictly separates the question of whether a work **is art** from whether it is **good art**.

  1.  **Is it Art?** This is determined solely by **infectiousness**. If the artist transmits a feeling and the audience feels it, it is art. If the audience feels nothing, it is not art (it is a counterfeit).
  2.  **Is it Good Art?** This is determined by the **religious consciousness of the age**. For Tolstoy, the "good" feelings are those that promote the unity of mankind under Christian brotherhood. The "bad" feelings are those that promote exclusivity, lust, patriotism, or ecclesiastical authority.

  **The Conflation:** The popular author has conflated these two verdicts. By claiming worth is *entirely* a matter of communication, the summary implies that a highly infectious piece of nationalist propaganda would be "good" art for Tolstoy. It would not. It would be *art*, but it would be *bad* art because the feeling transmitted divides rather than unites. Tolstoy condemns Beethoven's Ninth not because it fails to communicate (he admits it is powerful), but because the feeling it communicates is exclusive and obscure to the common laborer, and thus fails the test of universal religious unity.

  ### 3. Sincerity: Candor vs. Necessity

  You are correct to suspect a conflation. The summary defines sincerity as *"being honest about what one actually felt."* This suggests a biographical truth-claim (i.e., "Did the artist actually feel sad when he wrote this sad poem?").

  For Tolstoy, sincerity is not merely autobiographical candor; it is **emotional necessity**. In *What Is Art?*, Tolstoy writes that sincerity is "the most important of the three conditions" (individuality, clearness, sincerity). He defines it as the artist's own inner need to express the feeling. If an artist writes to please a patron, to make money, or to imitate a style, they lack sincerity, even if they technically "feel" something while doing it.

  **The Loss:** By defining it as "honesty about what one actually felt," the summary makes sincerity a matter of memory or confession. For Tolstoy, it is a matter of **compulsion**. The artist must be unable *not* to transmit the feeling. This distinction is vital because it allows Tolstoy to attack "professional" artists who may feel genuine emotions but are corrupted by the act of manufacturing art for a market. The summary captures the anti-professionalism but misses the metaphysical weight of the "inner need."

  ### 4. The "Not Moralizing" Claim

  **Verdict:** **False.** This is a charitable sanitizing that does not survive scrutiny.

  The passage claims: *"What is usually missed is that he is not moralizing here in the ordinary sense; he is applying a communicative test rather than a doctrinal one."*

  This is simply wrong. Tolstoy's entire late aesthetic theory is built upon a specific doctrinal foundation: the Christian ethic of universal brotherhood. He explicitly judges art based on whether it advances this doctrine.
  *   **Doctrinal Test:** Does the art promote the religious perception of our time (Christian unity)? If yes, it is good. If no, it is bad.
  *   **Communicative Test:** Does the art transmit feeling? If yes, it is art. If no, it is counterfeit.

  The communicative test is the *mechanism*, but the doctrinal test is the *standard of value*. Tolstoy dismisses *King Lear* and Beethoven not merely because they are hard to understand (communicative failure), but because they represent a culture of elite exclusivity that contradicts the Christian duty to unite with the common man (doctrinal failure).

  The author of the summary likely makes this claim to make Tolstoy palatable to a modern secular audience that recoils at religious didacticism. But to remove the moralism is to remove the engine of Tolstoy's argument. He is moralizing in the strongest possible sense; he believes art is a tool for human salvation.

  ### 5. Essential Omissions

  Two major omissions change how the theory should be read:

  **A. The Religious Consciousness of the Age**
  The summary never mentions religion or Christian unity. Without this, Tolstoy's criteria for "good art" seem arbitrary or purely populist. Why is accessibility to the "trained minority" bad? For Tolstoy, it is bad because truth is universal and God is in everyone; therefore, art that excludes the peasant excludes the truth. Omitting this makes Tolstoy look like a democratic critic rather than a religious prophet. It transforms a theological imperative into a sociological preference.

  **B. The Theory of Counterfeits and Intelligibility**
  The summary mentions "manufacture effects," but it misses Tolstoy's specific taxonomy of counterfeits: (1) borrowing from other artists, (2) imitation of nature, and (3) producing "effects" (startling, titillating) without genuine feeling.
  More importantly, the summary ignores how Tolstoy handles the objection that new art is often unintelligible at first. Tolstoy rejects this objection. He argues that **true art is always immediately intelligible** to the common man because true feeling is universal. If a work requires training to understand, it is not "ahead of its time"; it is *bad* art. This is a hardline position that the summary softens by implying the failure is merely one of "width" of communication. For Tolstoy, if the plowman doesn't get it, the artist has failed morally, not just technically.

  ### 6. Triviality Check

  **If the summary's account were correct, would Tolstoy's position collapse into the trivial observation that art communicates something?**

  **Yes.** If we accept the summary's claim that art is just communication and worth is just the strength of that communication, Tolstoy's theory becomes a banal precursor to modern information theory or simple expressionism.

  **What his view actually adds:**
  Tolstoy's view adds a **soteriological function** to art. Art is not just communication; it is the organ of human unity. It is the means by which humanity moves from a state of separation to a state of brotherhood.
  *   **The Summary's View:** Art = Feeling Transmission. Good Art = Strong Transmission.
  *   **Tolstoy's View:** Art = Feeling Transmission. Good Art = Transmission of Feelings that Unite Humanity in Truth/God.

  The "teeth" of Tolstoy's theory are not in the definition of art (which is indeed descriptive), but in the evaluation of art (which is prescriptive and religious). The summary sands off the prescriptive/religious teeth, leaving only the descriptive mechanism. This makes the theory easier to digest but removes the very reason Tolstoy wrote the book: to condemn the art of his time as not merely ineffective, but sinful.

  ### Summary of Judgment

  Your suspicion is correct. The passage is a "friendly" revision of Tolstoy. It retains his definition of art (infection) but strips away his criterion for *good* art (Christian morality). It presents him as a populist critic of elitism, whereas he was actually a religious ascetic demanding art serve a specific theological end. The claim that he is "not moralizing" is the most egregious error; it is an attempt to rescue Tolstoy from the very convictions that drove him to write the tract.

  **Confidence Flag:** I am least confident only in the nuance of Tolstoy's definition of "sincerity" in his private diaries versus the published tract, as he sometimes wavers on whether sincerity is a psychological state or a moral virtue. However, within the text of *What Is Art?*, the interpretation provided above (sincerity as inner necessity subservient to religious truth) is the only one that makes his condemnation of Shakespeare and Beethoven consistent.
