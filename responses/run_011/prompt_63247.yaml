answer: |-
  # The Knowledge Source Sorter

  ### Part 1: The Logical Space
  Before you answer, note what actually separates one "way of knowing" from another. When philosophers argue about whether something counts as a distinct source of knowledge, they are usually fighting about one of three things:

  1.  **The Object:** Does this method tell you about something fundamentally different? (e.g., Can you *see* an absence, or do you need a different tool to know something is *not* there?)
  2.  **The Process:** Is the mental mechanism unique? (e.g., Is recognizing something by similarity just remembering, or is it a specific "click" of comparison?)
  3.  **Irreducibility:** Could you have gotten this knowledge another way? (e.g., If testimony is just inference based on the speaker's reliability, it's not a separate source. If it works even without trusting the speaker, it might be.)

  This quiz sorts you by your intuitions on these axes. There are no right answers, only consistent ones.

  ---

  ### Part 2: The Scenarios
  For each case, choose the option that best matches your gut feeling about what is happening in your mind.

  **1. The Smoke Signal**
  You are standing on a hill. You see smoke rising from a valley you cannot see into. You conclude there is a fire down there.
  *   **A.** You know there is a fire. The smoke delivers that knowledge directly.
  *   **B.** You only know there is smoke. The fire is a guess or a belief until you see it.

  **2. The Oracle Machine**
  You ask a language model for the capital of a country you've never heard of. It gives you a name. You have no way to check it now, but it turns out to be true.
  *   **A.** You knew the capital the moment the machine produced the text.
  *   **B.** You only believed it. You only *knew* it once you verified the source or checked a map.

  **3. The Smiling Rat**
  A friend tells you a "quokka" looks like a small, smiling rat. Later, in the wild, you see an animal that matches that description and realize, "That's a quokka."
  *   **A.** This is a distinct mental event—matching a description to a perception via similarity.
  *   **B.** This is just memory (recalling the description) mixed with perception (seeing the animal).

  **4. The Empty Fridge**
  You open the fridge to get milk. The shelves are visible and empty. You know there is no milk.
  *   **A.** You are perceiving a specific fact: the *absence* of milk.
  *   **B.** You are simply seeing the shelves; the "no milk" part is just a thought you add afterward.

  **5. The Night Eater**
  Your friend is quite fat but you never see them eat during the day. You conclude they must eat at night.
  *   **A.** This is a necessary assumption to make the facts make sense; it's a unique way of resolving a contradiction.
  *   **B.** This is just a standard guess based on evidence (inference).

  **6. The Snake in the Grass**
  You see a coiled shape and jump back, thinking it's a snake. Later, you see it was a rope.
  *   **A.** When you saw it, you genuinely *knew* it was a snake; the knowledge was valid until proven wrong.
  *   **B.** You never *knew* it was a snake; you only thought you did. Knowledge requires being right, verified from outside.

  **7. The Breakfast Recall**
  You sit down to think about what you ate this morning. You remember it was eggs.
  *   **A.** This is a fresh act of knowing; you are generating knowledge now.
  *   **B.** This is just retrieving old data; no new knowledge is being created.

  **8. The Dark Room**
  You walk into a pitch-black room. You say, "There is no pot here."
  *   **A.** You know this because you perceive the absence of the pot specifically.
  *   **B.** You know this because you don't see a pot, and you assume if it were there you would see it.

  **9. The Confidence Score**
  A medical AI says there is a 95% chance of a condition. The condition is present.
  *   **A.** The AI knew the patient had the condition.
  *   **B.** The AI only knew the probability; knowing the fact requires 100% certainty.

  ---

  ### Part 3: Scoring Key & Decision Tree

  Tally your answers. For most questions, **A** indicates a willingness to admit a new, distinct source of knowledge (expanding the count), while **B** indicates a desire to reduce it to something simpler (perception or inference).

  **Step 1: The Foundation (Question 1)**
  *   **If you chose mostly B on Q1:** You are a **Perception-Only** theorist.
      *   *Classical School:* **Carvaka**.
      *   *View:* Only direct sensing counts. Inference is just guesswork.
      *   *Pramanas:* 1 (Perception).
      *   *Stop here.* Your skepticism about inference makes further distinctions moot.

  *   **If you chose A on Q1:** You accept Inference. Proceed to Step 2.

  **Step 2: The Social Source (Question 2)**
  *   **If you chose B on Q2:** You are a **Reductionist**.
      *   *Classical School:* **Buddhist (Dignaga/Dharmakirti)** or **Vaisheshika**.
      *   *View:* Testimony is just inference about the speaker's reliability. If the speaker isn't trusted, it's not knowledge.
      *   *Pramanas:* 2 (Perception, Inference).
      *   *Stop here.* You collapse testimony into inference.

  *   **If you chose A on Q2:** You accept Testimony as distinct. Proceed to Step 3.

  **Step 3: The Similarity Check (Question 3)**
  *   **If you chose B on Q3:** You are a **Triad** theorist.
      *   *Classical School:* **Samkhya**.
      *   *View:* Comparison is just memory + perception. No need for a separate category.
      *   *Pramanas:* 3 (Perception, Inference, Testimony).
      *   *Stop here.*

  *   **If you chose A on Q3:** You accept Comparison. Proceed to Step 4.

  **Step 4: The Missing Items (Questions 4 & 8)**
  *   **If you chose B on both Q4 and Q8:** You are a **Standard Realist**.
      *   *Classical School:* **Nyaya**.
      *   *View:* Absence is just perceiving the empty space. You don't need a special tool to know something isn't there.
      *   *Pramanas:* 4 (Perception, Inference, Testimony, Comparison).
      *   *Check Q6:* If you chose B on Q6, you fit Nyaya perfectly (knowledge needs external validation). If A, you have a Nyaya map with a Mimamsa engine (see "Impossible Combos" below).
      *   *Stop here.*

  *   **If you chose A on Q4 or Q8:** You accept Absence as distinct. Proceed to Step 5.

  **Step 5: The Hidden Cause (Question 5)**
  *   **If you chose B on Q5:** You are in **Unexplored Territory**.
      *   *View:* You accept Absence as a distinct source, but you think Postulation (explaining contradictions) is just inference.
      *   *Status:* **No classical school stands here.**
      *   *Why:* Usually, if you think "nothingness" is a real object you can perceive (Step 4), you also think "unseen causes" required to explain facts are distinct (Step 5). Accepting one but not the other is theoretically unstable.
      *   *Closest Match:* **Nyaya** (who reject both) or **Kumarila** (who accept both).

  *   **If you chose A on Q5:** You are a **Full Spectrum** theorist. Proceed to Step 6.

  **Step 6: The Validation (Question 6)**
  *   **If you chose B on Q6:** You are an **Extrinsic Validator**.
      *   *Classical School:* **Nyaya** (if you rejected Step 5) or a hybrid.
      *   *View:* Knowledge must be checked by a second process to be confirmed.
      *   *Note:* If you reached Step 6, you likely accept Absence and Postulation. This combination (Accepting 5/6 pramanas but requiring external validation) is rare. **Prabhakara Mimamsa** accepts Postulation but rejects Absence. **Kumarila Mimamsa** accepts both and says knowledge is self-validating (A on Q6).
      *   *Diagnosis:* You hold a **Kumarila Mimamsa** view on sources (6 Pramanas) but a **Nyaya** view on validation. This is a coherent but uncommon mix.

  *   **If you chose A on Q6:** You are an **Intrinsic Validator**.
      *   *Classical School:* **Mimamsa (Kumarila Bhatta)** or **Advaita Vedanta**.
      *   *View:* Knowledge reveals itself. You know you know immediately; error is discovered later, not by validating truth first.
      *   *Pramanas:* 6 (Perception, Inference, Testimony, Comparison, Postulation, Absence).

  ---

  ### Part 4: Diagnostic Flags & Impossible Combos

  **The "Five Pramana" Gap (Prabhakara Mimamsa)**
  *   *Profile:* A on Q1, Q2, Q3, Q5. **B on Q4.**
  *   *School:* **Prabhakara Mimamsa**.
  *   *View:* They accept Postulation (Q5) because explaining the fat friend requires a unique cognitive jump, but they reject Absence (Q4) because "nothing" isn't a real object you can perceive.
  *   *Note:* If you scored here, you are in a very specific, sophisticated corner of the map.

  **The "Incoherent" Zone**
  *   *Profile:* A on Q4 (Absence is real) but B on Q1 (Inference is not knowledge).
  *   *Why:* You cannot claim to perceive "absence" (which requires understanding what *should* be there) if you don't accept inference (connecting the expectation to the reality). This combination is logically unstable.

  **The "ML Engineer" Trap**
  *   *Profile:* A on Q9 (Probability is Knowledge) but B on Q1 (Inference is not Knowledge).
  *   *Why:* Modern data science often treats high-probability prediction as knowledge. Classical schools generally demand certainty (*niscaya*). If you treat probability as knowledge, you don't fit the classical map at all; you are operating with a modern epistemic framework where "knowledge" is graded, not binary.

  **The Validation Split (Q6)**
  *   This question cuts across the school counts.
  *   **Nyaya** (4 Pramanas) says B (Extrinsic).
  *   **Mimamsa** (5 or 6 Pramanas) says A (Intrinsic).
  *   If you chose A on Q6 but B on Q4/Q5, you are a **Prabhakara** (5 Pramanas, Intrinsic).
  *   If you chose B on Q6 but A on Q4/Q5, you are a **Hybrid** (6 Pramanas, Extrinsic). This position exists but is less historically prominent than Kumarila's intrinsic view.

  **Memory (Q7)**
  *   Almost all schools choose **B**. Memory is a preserver of knowledge, not a generator. If you chose A, you align with a minority view (some later Vedantins) that considers recollection a fresh cognitive event. This doesn't change your Pramana count but adds a nuance to your profile.
