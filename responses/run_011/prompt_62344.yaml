answer: |-
  **Project Title:** Epistemic Labour and the Temporal Profile of Confirmation: A Resource-Bounded Approach to the Problem of Old Evidence

  **1. Research Question**

  Does the epistemic labour required to derive an entailment relation between hypothesis and evidence modulate the degree of confirmation the hypothesis receives?

  Standard Bayesian treatments of the Problem of Old Evidence (POE) treat the discovery that $H$ entails $E$ as a binary event: once the agent learns the logical relation, the update occurs. This project asks whether the *process* of learning that relation—specifically its computational complexity, length, or difficulty—ought to influence the magnitude of the credence update. If confirmation is a measure of epistemic gain, and gain is sensitive to the cost of acquisition, then the POE is not merely a puzzle about static coherence, but about the dynamics of resource-bounded rationality.

  **2. Background and Motivation**

  The Problem of Old Evidence arises because standard Bayesian conditionalisation cannot increase the probability of a hypothesis $H$ given evidence $E$ if the agent already assigns $E$ a probability of 1. Since $P(E) = 1$, $P(H|E) = P(H)$. Yet, historically, agents clearly *do* take old evidence (such as the perihelion of Mercury) as confirming new theories (General Relativity) once the entailment is recognised.

  Existing solutions generally fall into three descriptive categories:
  1.  **The Counterfactual Approach:** Evaluating confirmation by asking what the agent's credence *would have been* had they not known $E$.
  2.  **The Logical-Relation Approach:** Allowing the agent to conditionalise not on $E$, but on the proposition that $H$ entails $E$.
  3.  **The Uncertainty Approach:** Suggesting agents are never truly certain of $E$, so $P(E)$ is slightly less than 1, allowing for movement.

  All three approaches share a critical, unexamined assumption: they treat the discovery of the logical relation as epistemically costless and instantaneous. They assume that once the relation is spotted, the confirmation value is fixed by the prior probabilities and the logical structure alone. This ignores the reality of derivation. Some entailments are trivial; others require fifty pages of calculation or a novel conceptual reframing.

  If the "cost" of the derivation matters, then the standard models are descriptively inadequate and potentially normatively deficient. A resource-bounded agent might be rational to grant more weight to a hypothesis that survives a difficult derivation than one that survives a trivial check, even if the logical relation is identical. Furthermore, this issue sharpens when comparing empirical science to mathematics. In mathematics, the "evidence" is often a theorem derived from axioms. When a conjecture is proven, credence shifts despite the proof entailing instances we already checked. If the solution to the POE relies on empirical uncertainty, it may fail to capture the mathematical case. If it relies on logical learning, it must explain why the *difficulty* of the proof feels relevant to the *strength* of the confirmation.

  This project leaves the existing positions not merely disagreed with, but shown to be incomplete. They solve for *whether* confirmation occurs, but leave open *how much* confirmation occurs relative to the derivation process.

  **3. Methodology**

  The project will combine formal modelling with conceptual analysis. The core task is to determine if a "cost-sensitive" Bayesian framework can be constructed without violating coherence norms.

  **Phase 1: Formalising the Gap (Weeks 1–3)**
  *   **Activity:** Reconstruct the standard "logical-relation" solution formally. Identify exactly where the derivation process is abstracted away.
  *   **Output:** A formal model showing that under standard assumptions, $P(H | H \vdash E)$ is invariant to the complexity of the proof of $\vdash$.
  *   **Nature:** Formal/Technical.
  *   **Rationale:** We must establish the null hypothesis: that standard Bayesianism *cannot* accommodate derivation cost. This provides the baseline against which the new proposal is measured.

  **Phase 2: Modelling Epistemic Labour (Weeks 4–6)**
  *   **Activity:** Introduce a complexity measure into the update rule. This will likely draw on literature regarding logical omniscience and bounded rationality. The question is whether we treat the "cost" as a discount factor on the update, or as a separate piece of evidence (e.g., "the fact that this derivation was hard is itself evidence of $H$'s robustness").
  *   **Output:** A modified update rule or a justification for why the standard rule must remain insensitive to cost.
  *   **Nature:** Mixed (Formal modelling + Normative argument).
  *   **Rationale:** This is the core philosophical contribution. If I argue cost matters, I must show it doesn't violate coherence. If I argue it doesn't matter, I must explain away the strong intuition that it does.

  **Phase 3: The Mathematical Case Study (Weeks 7–8)**
  *   **Activity:** Apply the model to mathematical practice. Compare the confirmation of a conjecture via a trivial proof vs. a monumental proof (e.g., Fermat's Last Theorem).
  *   **Output:** A section of the paper analysing whether the "labour" account explains mathematical confidence better than the "logical-relation" account.
  *   **Nature:** Argumentative/Case Study.
  *   **Rationale:** Mathematics strips away empirical uncertainty. If the labour account works here, it suggests the POE is fundamentally about logical learning, not empirical surprise. If it fails here, it suggests the POE in science and math are disanalogous.

  **Phase 4: Synthesis and Drafting (Weeks 9–10)**
  *   **Activity:** Assemble the formal results and philosophical argument into the 6,000-word paper. Prepare the 20-minute talk.
  *   **Output:** Final paper and presentation slides.
  *   **Nature:** Writing.

  **4. Success and Failure Conditions**

  **Success:**
  A successful outcome does not necessarily mean proving that derivation cost *does* affect confirmation. Success is defined as reaching a determinate conclusion on the research question.
  *   **Positive Result:** A coherent model is produced where the magnitude of confirmation is a function of derivation complexity, without violating probability axioms.
  *   **Negative Result:** A proof or rigorous argument demonstrating that derivation complexity *cannot* normatively affect confirmation within a Bayesian framework (perhaps because it conflates the context of discovery with the context of justification). This is still a valuable result as it clarifies the limits of resource-bounded Bayesianism.

  **Failure:**
  The project would fail if:
  *   The formal model becomes intractable, forcing a retreat to pure hand-waving.
  *   The distinction between "learning the relation" and "the cost of learning" collapses (i.e., if cost turns out to be just another proposition to conditionalise on, rendering the specific 'labour' angle redundant).
  *   The mathematical case proves so disanalogous to the scientific case that the paper splits into two incoherent halves.

  **5. Feasibility and Scope Management**

  **Honest Assessment:**
  Ten weeks for a single researcher is tight for a project that spans formal epistemology, philosophy of science, and philosophy of mathematics. The risk is attempting to solve the POE *and* build a theory of mathematical confirmation *and* model bounded rationality.

  **Necessary Constraints:**
  To ensure completion, the following constraints will be applied:
  1.  **Formal Simplicity:** The formal model will not attempt to be a full logic of resource-bounded agents (which is a career's work). It will use a simplified complexity metric (e.g., proof length or step-count) to test the sensitivity of the update rule.
  2.  **Mathematics as Test, Not Target:** The mathematical case will not be treated as a full philosophy of mathematics project. It will serve strictly as a stress-test for the scientific model. If the model breaks in the math case, the paper will argue that the POE requires distinct treatments for empirical and formal domains, rather than trying to force a unified theory.
  3.  **Literature Scope:** I will restrict the review to the specific POE solutions mentioned above. I will not conduct a general survey of Bayesian confirmation theory.

  **Verdict:**
  The project is feasible *if* the mathematical comparison is kept subordinate to the main epistemological question. If the mathematical case begins to dominate, it will be truncated to a single illustrative example. The core deliverable is the argument about epistemic labour, not a comparative history of confirmation.

  **6. Deliverables**

  1.  **Paper:** A 6,000-word article suitable for submission to a journal such as *The British Journal for the Philosophy of Science* or *Philosophy of Science*, titled as above.
  2.  **Talk:** A 20-minute presentation for the research group, focusing on the intuition pump (the difference between a one-line and fifty-page derivation) and the formal result.
  3.  **Working Notes:** A dossier of the formal models and rejected approaches, to demonstrate the research process.

  **7. Conclusion**

  This project challenges the static conception of the Problem of Old Evidence. By shifting focus from the logical relation itself to the *acquisition* of that relation, it connects the POE to live debates in rationality and computational complexity. Whether the final verdict is that labour matters or that it is epistemically irrelevant, the project will clarify what Bayesian confirmation is measuring: is it a relation between propositions, or a measure of an agent's epistemic journey? Given the ten-week constraint, the scope is narrow enough to be rigorous but novel enough to make a genuine contribution.
