      *   **Secondary Angle:** Compare scientific cases (Mercury perihelion) with mathematical cases (proving conjectures). Does the solution transfer?
      *   **Requirements:**
          *   Sharp research question (determinate answer).
          *   Explain why existing positions leave this open (not just disagreement).
          *   Methodology (week-by-week plan, formal vs. argumentative).
          *   Success/Failure conditions.
          *   Feasibility check (10 weeks, one person).
          *   Critique: If the angle is wrong-headed, correct it (but don't dilute it into a survey).
          *   Style: British English.
          *   Citations: Describe standard moves/positions, do not invent citations/bibliography.

  2.  **Evaluate the "Angle":**
      *   *Is it wrong-headed?* Not necessarily. It touches on "logical omniscience" and "resource-bounded rationality." Standard Bayesianism assumes agents know all logical consequences of their beliefs instantly. POE solutions (like Garber's) often introduce a new sentence representing the logical relation ($H \vdash E$) but treat learning *that* relation as a standard conditionalisation event. The user's insight is that *learning* that relation is a process with epistemic cost.
      *   *Potential Pitfall:* Bayesianism is normative, not descriptive. Saying "it took me 50 pages" is a psychological fact, not necessarily a normative constraint on credence. The proposal needs to bridge this: does the *justification* for increasing credence depend on the *method* of derivation?
      *   *Refinement:* The core philosophical claim is that confirmation measures *epistemic gain*, and epistemic gain is sensitive to the *difficulty* of the derivation. If the derivation is trivial, learning $H \vdash E$ adds little. If it's hard, it adds more. This challenges the idea that $P(H|H \vdash E)$ is a fixed function of the prior.
      *   *Feasibility:* 10 weeks is tight for formal modelling + philosophical argument + math/science comparison. Needs focus. The mathematical comparison is excellent because logic is explicit there.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be punchy and descriptive. "The Cost of Derivation" or "Epistemic Labour and Old Evidence."
      *   **Research Question:** Needs to be binary or specific. "Does the epistemic labour required to derive $E$ from $H$ modulate the degree of confirmation $H$ receives from $E$?"
      *   **Background/Gap:** Standard solutions (Garber-style, counterfactuals, etc.) solve the *static* problem (how can $P(H)$ rise if $P(E)=1$?). They ignore the *dynamic* process of finding the link. They assume logical omniscience or treat logical learning as a black box.
      *   **Methodology:**
          *   Weeks 1-3: Lit review & Formal Setup (Bayesian framework, POE solutions).
          *   Weeks 4-6: Developing the "Labour" model (complexity measures, resource-bounded Bayesianism).
