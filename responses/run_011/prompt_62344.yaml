          *   Weeks 9-10: Writing & Talk Prep.
      *   **Success/Failure:** Success = A model where confirmation varies with derivation complexity, or a proof that it *cannot* (which is also a result). Failure = Getting stuck in formal weeds or realising the distinction collapses.
      *   **Feasibility:** The math/science comparison might be too much. Suggest focusing on the formal/philosophical core and using math as a test case rather than a full parallel project.

  4.  **Refining the Argument (Self-Correction/Critique):**
      *   *Critique:* The user asks if the angle is wrong-headed. A strict Bayesian might say "Confirmation is about probability relations, not psychology." If I learn $H \vdash E$, I update. How hard it was shouldn't matter to the *final* probability, only to *when* I get there.
      *   *Counter:* But if Bayesianism is a normative theory of rationality, and rationality is resource-sensitive (bounded rationality), then the cost *should* matter. A proof that takes 50 pages provides more *security* or *understanding* than a one-liner, potentially affecting the robustness of the update.
      *   *Adjustment:* Frame it as "Does rational credence updating depend on the computational complexity of the derivation?" This moves it from psychology to normative epistemology.
      *   *Math vs. Science:* This is crucial. In math, $E$ is often a theorem. In science, $E$ is data. The POE looks different. In math, you know the axioms. In science, you don't know the laws. This distinction needs to be sharp.

