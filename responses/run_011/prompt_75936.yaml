answer: |-
  ### The Desiderata for Path Dependence

  To distinguish path dependence from mere persistence or historical sequence, an account must satisfy five requirements.

  1.  **Contingency at the Junction:** At the critical juncture ($t_0$), the outcome was not determined by prior structural conditions. The probability of the observed outcome was strictly less than 1.
      *   *Case:* **Equifinality (Case 3).** If two cities start differently but end up with the same layout due to geographic constraints, that is convergence, not path dependence. Path dependence requires that the early difference *could* have produced a different end state.
  2.  **Endogenous Reinforcement:** The probability of retaining the current state must increase as a function of the time spent in that state or the number of agents adopting it.
      *   *Case:* **Streetcars (Case 1).** This distinguishes lock-in from simple inertia. If the streetcar network was removed because it was always expensive and buses were always cheaper, that's efficiency. If it was removed due to a shock, but *now* cannot be reinstated because the city density shifted to accommodate cars (increasing returns to the car infrastructure), that is lock-in. The cost of reversal must be endogenous to the path taken.
  3.  **Counterfactual Stability:** Had a feasible alternative been selected at $t_0$, it would have persisted to the present.
      *   *Case:* **The Setup.** This earns the claim "Y would have stuck." It prevents labeling an outcome as path dependent simply because it is hard to change *now*; it must be that the alternative would *also* have become hard to change *then*.
  4.  **Efficiency Agnosticism:** The definition must not presuppose that the locked-in outcome is inefficient.
      *   *Case:* **Efficient Standard (Case 2).** If path dependence requires inefficiency, then every efficient standard is "determined by merit," and the concept loses explanatory power for stable institutions. Lock-in is about the *causal process* of stability, not the *welfare properties* of the outcome.
  5.  **State-Space Specificity:** The "state" of the system and the "fork" must be defined independently of the outcome observed.
      *   *Case:* **Granularity.** If you define the state finely enough (e.g., every micro-decision), every process is path dependent (chaos). If you define it coarsely (e.g., "democracy vs. autocracy"), nothing is. The theory must specify the relevant resolution of the state space *ex ante*.

  ### Load-Bearing vs. Camp Taste

  **Load-Bearing:** Requirements 1 (Contingency), 2 (Reinforcement), and 3 (Counterfactual Stability) are non-negotiable. Without 1, you have determinism. Without 2, you have inertia. Without 3, you have post-hoc storytelling. These three constitute the causal mechanism of lock-in.

  **Camp Taste:** Requirement 4 (Efficiency) is a wedge. Neoclassical economists often treat path dependence as a synonym for market failure (inefficiency); historical sociologists treat it as neutral sequence. You must adopt the agnostic view (4) or your theory cannot handle Case 2. Requirement 5 (State-Space) is a methodological preference favored by modelers but often ignored by narrativists. However, ignoring it renders the concept unfalsifiable, so while it feels like "taste," it is actually a validity condition.

  ### The Triangle of Impossibility

  You posit a triangle: (a) single unrepeatable case, (b) licenses counterfactuals, (c) no welfare baseline. You ask if these are jointly satisfiable.

  **The triangle leaks.** It is not impossible, but it shifts the burden of proof from statistical frequency to **mechanism verification**. In a single case, you cannot observe the counterfactual (b) directly. However, if you can empirically verify the presence of the reinforcement mechanism (Req 2) — e.g., measuring network effects, sunk costs, or adaptive expectations — you are licensed to infer the counterfactual stability (Req 3) without running the experiment twice. The impossibility only holds if you demand *observational* proof of the counterfactual. If you accept *inference to the best explanation* based on the mechanism, the triangle holds. Do not cut a leg; instead, tighten the link between Reinforcement (2) and Counterfactual Stability (3). The mechanism *is* the license for the counterfactual.

  ### The Killer Requirement

  You bet on **Granularity (Req 5)**. You are correct, but the specific failure point is **The Independence of the Fork**.

  This requirement knocks out the most candidate definitions because most accounts define the "critical juncture" *post-hoc* based on the outcome. If you only identify the fork because you know where the path led, you have committed selection bias. To satisfy Req 5, you must specify what counts as a "state" and a "fork" before you look at the outcome. Most historical sociology fails this: they identify a "moment of contingency" only because the subsequent history diverged. Most economic models fail this too: they assume a state space (e.g., QWERTY vs. Dvorak) without justifying why those are the only two states. If you cannot define the basin of attraction independently of the trajectory, the definition is tautological. This is the single hardest hurdle.

  ### Evaluation of Contenders

  **Increasing-Returns / Positive-Feedback (Economists):**
  They clear Req 2 (Reinforcement) and Req 4 (Efficiency Agnosticism, theoretically) but fail Req 5 (State-Space). Their models rely on predefined, often arbitrary state spaces (e.g., two technologies) that rarely map onto messy institutional reality. They also struggle with Req 1 (Contingency) in practice, often assuming the "fork" was a random shock without proving structural contingency. They survive the mechanism test but fail the application test.

  **Historical Sociology (Reactive Sequences):**
  They excel at Req 1 (Contingency) and Req 5 (Narrative granularity) but fail Req 2 (Reinforcement). They often conflate "sequence matters" with "self-reinforcement." A reactive sequence (A causes B causes C) is not necessarily path dependent if C could easily have been reversed. They frequently describe chains of events without demonstrating the increasing returns that make the chain irreversible. They survive the narrative test but fail the causal mechanism test.

  **Taxonomy-of-Mechanisms (Coordination, Learning, etc.):**
  This approach clears Req 2 (Reinforcement) by disaggregating it but fails Req 3 (Counterfactual Stability). Listing mechanisms (e.g., "coordination effects were present") does not prove that an alternative *would* have locked in. It shows why X stuck, not why Y would have. It risks becoming a checklist of stability factors rather than a theory of divergence. They survive the diagnostic test but fail the counterfactual test.

  **Skeptical Economists (Inefficiency Deniers):**
  They fail Req 1 (Contingency) and Req 4 (Efficiency Agnosticism) by definition. They assume that if an outcome persists, it must be efficient (revealed preference), which effectively defines path dependence out of existence. They treat high switching costs as evidence of value, not lock-in. They are internally consistent but useless for your purpose, as they cannot distinguish Case 1 (Streetcars) from simple optimization. They fail the core ontology.

  ### Note on Deck Stacking

  You have stacked the deck against the **Skeptical Economists** and the **Inefficiency-Focused Economists** in Case 2. By insisting that an efficient standard can be path dependent, you rule out definitions that equate path dependence with market failure. This is the correct move for a general theory of institutions, but be aware that you are explicitly rejecting the Liebowitz/Margolis criterion. You have also stacked the deck against **Historical Sociologists** in Req 3; demanding they prove the alternative *would* have stuck is a higher bar than most narrative methods accept. Acknowledge this: you are demanding causal rigor over descriptive richness.
