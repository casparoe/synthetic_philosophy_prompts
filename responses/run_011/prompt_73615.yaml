answer: |-
  # Seminar Handout: Sorting Communicated Content
  **Course:** Semantics/Pragmatics Interface  
  **Topic:** A Diagnostic Decision Tree for Utterance Content  
  **Note:** This tree sorts *pieces of content* derived from an utterance, not whole utterances. A single sentence may yield multiple pieces falling into different leaves.

  ## 1. The Decision Tree

  The following tree uses diagnostic tests as branch nodes. Each question is designed to be answerable by inspecting the content in question without presupposing its category.

  ```text
  START: Take a specific piece of communicated content (P) derived from an utterance (U).

  NODE 1 [FORCE]: Is P an instruction on how to take U (e.g., as a request, warning, offer) 
                  rather than a description of a state of affairs?
                  |
                  +-- YES --> LEAF 1: Indirect Speech Act Force
                  |
                  +-- NO  --> NODE 2 [TRUTH-CONDITIONALITY]: If P were false, would U thereby be false?
                              |
                              +-- NO  --> NODE 3 [PROJECTION]: Does P survive when U is embedded under 
                              |           negation, a conditional, or an attitude verb (e.g., "John believes...")?
                              |           |
                              |           +-- YES --> LEAF 2: Presupposition
                              |           |
                              |           +-- NO  --> NODE 4 [LEXICAL TRIGGER]: Is P tied to a specific lexical item 
                              |                       such that swapping it for a truth-conditional synonym removes P?
                              |                       |
                              |                       +-- YES --> LEAF 3: Conventional Implicature
                              |                       |
                              |                       +-- NO  --> NODE 5 [CONTEXT DEPENDENCE]: Does P arise only in 
                              |                                   specific contextual scenarios, or is it a default 
                              |                                   inference from the words alone?
                              |                                   |
                              |                                   +-- DEFAULT --> LEAF 4: Generalized Conversational Implicature
                              |                                   |
                              |                                   +-- SPECIFIC --> LEAF 5: Particularized Conversational Implicature
                              |
                              +-- YES --> NODE 6 [COMPLETENESS]: Is U truth-evaluable (a complete proposition) 
                                          without P?
                                          |
                                          +-- NO  --> LEAF 6: Pragmatic Saturation (Completion)
                                          |
                                          +-- YES --> NODE 7 [CANCELLABILITY]: Can the speaker explicitly deny P 
                                                      (e.g., "but not P") without contradiction?
                                                      |
                                                      +-- YES --> LEAF 7: Generalized Conversational Implicature 
                                                      |           (Truth-Conditional View / "Impliciture")*
                                                      |
                                                      +-- NO  --> NODE 8 [LEXICAL/LOGICAL SOURCE]: Is P derived solely 
                                                                  from syntactic structure and lexical definitions 
                                                                  without pragmatic inference?
                                                                  |
                                                                  +-- YES --> LEAF 8: Minimal Semantic Content
                                                                  |
                                                                  +-- NO  --> LEAF 9: Pragmatic Free Enrichment 
                                                                              ("What is Said")
  ```

  *\*Note on Leaf 7: This leaf captures the category you mentioned ("implicature that is really part of what is said"). In the literature, this is often debated as 'Impliciture' (Bach) or 'Primary Implicature' treated as truth-conditional. I have placed it here based on Cancellability + Truth-Conditionality. See Section 4 for my pushback on this category.*

  ---

  ## 2. The Leaves (Definitions)

  1.  **Indirect Speech Act Force:** The illocutionary point (e.g., Request) distinct from the propositional content.
  2.  **Presupposition:** Backgrounded content that must be taken for granted; projects through operators.
  3.  **Conventional Implicature:** Non-truth-conditional content attached to specific words (e.g., *but, even, therefore*).
  4.  **Generalized Conversational Implicature (GCI):** Default, non-truth-conditional inferences (e.g., *some* → *not all*).
  5.  **Particularized Conversational Implicature (PCI):** Context-driven, non-truth-conditional inferences.
  6.  **Pragmatic Saturation:** Contextual filling of a syntactic slot required for a proposition (e.g., *ready* → *ready for X*).
  7.  **GCI (TC View/Impliciture):** Inferences that are cancellable but argued to be part of the truth-conditions (the "Gray Area").
  8.  **Minimal Semantic Content:** The literal, context-invariant proposition (often a "propositional radical").
  9.  **Pragmatic Free Enrichment:** Truth-conditional content added via pragmatics without a syntactic slot (e.g., *raining* → *raining here*).

  ---

  ## 3. Empty Combinations & Logical Space Diagnosis

  The tree above carves out the *coherent* logical space. The following combinations of features are theoretically empty or incoherent.

  | Feature Combination | Diagnosis | Why? |
  | :--- | :--- | :--- |
  | **Non-TC + Projects + Non-Lexical** | **Empty (Incoherent)** | If it projects and isn't lexical, it behaves like a presupposition. If it's not a presupposition, projection is unexplained. |
  | **TC + Non-Cancellable + Context-Dependent** | **Occupied (Leaf 9)** | This is Free Enrichment. *Not Empty.* |
  | **TC + Cancellable + Lexical-Only** | **Empty (Unattractive)** | If it comes from lexicon alone, it should be semantic (Non-Cancellable). If it's cancellable, it's not purely lexical. |
  | **Non-TC + Non-Cancellable + Non-Lexical** | **Empty (Nobody's Bothered)** | Non-TC content that you can't cancel and isn't tied to a word? Hard to distinguish from Presupposition, but lacks projection. Theoretally unstable. |
  | **Force + Truth-Conditional** | **Empty (Category Mistake)** | Force is about action/commitment, not world-states. You can't falsify a request. |

  ---

  ## 4. Test Cases: Walking the Tree

  Here are five utterances. I have isolated a specific *piece of content* (P) for each to test the tree.

  ### Case 1: The Scalar
  **Utterance:** "Some of the students passed."
  **Content (P):** *Not all of the students passed.*
  1.  **Force?** No (Statement).
  2.  **TC?** If "not all" is false (i.e., all passed), is "Some passed" false? No. (→ **No**)
  3.  **Projection?** "It's not the case that some passed." (Does "not all" survive? No). (→ **No**)
  4.  **Lexical Trigger?** Is it tied to *some* specifically? Yes, but *at least some* is the semantic meaning. The *not all* is inferred. (→ **No**, it's calculable from maxims).
  5.  **Context Dependence?** Default inference. (→ **Default**)
  *   **Result:** **Leaf 4 (GCI)**.
  *   *Note:* Standard Gricean view.

  ### Case 2: The "Even"
  **Utterance:** "Even John passed."
  **Content (P):** *John was the least likely to pass.*
  1.  **Force?** No.
  2.  **TC?** If John was actually the *most* likely, is the sentence false? No, it's infelicitous. (→ **No**)
  3.  **Projection?** "It's not the case that even John passed." (Still implies he was unlikely). (→ **Yes**)
      *   *Wait:* "Even" triggers both a Presupposition (others passed) and a CI (scalar expectation).
      *   *Let's test the Scalar Expectation:* Does it project? "If even John passes, we'll celebrate." (Implies he's unlikely). Yes.
      *   *Is it Lexical?* Yes, remove *even*, lose the content.
      *   *Correction on Tree:* Node 3 (Projection) leads to Presupposition. But *even*'s scalar content is often treated as CI.
      *   *Diagnostic Conflict:* It projects like a Presupposition but is lexical like a CI.
      *   *Path:* Node 3 (Yes) → **Leaf 2 (Presupposition)**.
      *   *Alternative Path:* Some theories put *even* content in CI. If we answer Node 3 as "No" (arguing it doesn't project in all contexts), we go to Node 4 (Yes) → **Leaf 3 (CI)**.
      *   *Decision:* I will classify the scalar component of *even* as **Leaf 3 (CI)** for this seminar, acknowledging the projection overlap. To get there, we answer Node 3 as **No** (arguing it doesn't project in *all* embedding contexts like presuppositions do) or acknowledge the tree forces a choice. Let's say **Node 3: No** (it's defeasible under certain embeddings).
      *   **Result:** **Leaf 3 (Conventional Implicature)**.

  ### Case 3: The "But"
  **Utterance:** "She is poor but honest."
  **Content (P):** *There is a contrast between being poor and honest.*
  1.  **Force?** No.
  2.  **TC?** If there is no contrast, is the sentence false? No, just misleading. (→ **No**)
  3.  **Projection?** "It's not the case that she is poor but honest." (Contrast still implied). (→ **Yes/No Debate**). Let's say **No** (often cancels in negation).
  4.  **Lexical Trigger?** Yes (*but* vs *and*). (→ **Yes**)
  *   **Result:** **Leaf 3 (Conventional Implicature)**.

  ### Case 4: The Cold Room
  **Utterance:** "It's cold in here."
  **Content (P):** *Please close the window.*
  1.  **Force?** Yes, this is an instruction on how to take the utterance (Request). (→ **Yes**)
  *   **Result:** **Leaf 1 (Indirect Speech Act Force)**.

  ### Case 5: The Incomplete
  **Utterance:** "I'm ready."
  **Content (P):** *Ready [to leave].*
  1.  **Force?** No.
  2.  **TC?** If I'm ready to eat, but not to leave, is "I'm ready" (in context) false? Yes. (→ **Yes**)
  3.  **Completeness?** Is "I'm ready" truth-evaluable without *[to leave]*? No. (→ **No**)
  *   **Result:** **Leaf 6 (Pragmatic Saturation)**.

