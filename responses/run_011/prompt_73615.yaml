  ## 5. Diagnostic Conflicts & Commitments

  You asked me to be upfront about where the diagnostics disagree and to commit to a hierarchy.

  ### Conflict 1: Cancellability vs. Truth-Conditionality (The "Gray Area")
  **The Clash:** You lean toward thinking much conversational implicature is really "what is said" (Truth-Conditional).
  **The Problem:** Take "Some students passed" → "Not all".
  *   **TC Test:** If all passed, "Some passed" is still true. (Suggests Non-TC).
  *   **Intuition:** In context, we understand it as "Not all". (Suggests TC Enrichment).
  *   **Cancellability Test:** "Some students passed, in fact all of them did." (Perfectly coherent).
  **My Commitment:** I trust **Cancellability** over intuitive "aboutness".
  **Why:** If content is part of "what is said" (the proposition expressed), denying it should create a contradiction (Moore's Paradox style). Since GCIs are explicitly cancellable without contradiction, they cannot be part of the truth-conditional content *of that utterance*.
  **Diagnosis of your leaning:** What you are identifying as "Implicature that is part of what is said" is likely **Leaf 9 (Pragmatic Free Enrichment)**, not GCI. Enrichment (e.g., "It's raining" → *here*) is TC and *not* cancellable. GCI is cancellable. Don't conflate the two. Leaf 7 in my tree is a "theoretical danger zone"—if it's cancellable, keep it out of the truth conditions.

  ### Conflict 2: Projection vs. Lexical Trigger (The "Even/But" Problem)
  **The Clash:** Conventional Implicatures (like *but*) often project like Presuppositions.
  **My Commitment:** I trust **Lexical Trigger** over Projection for this split.
  **Why:** Presuppositions (Leaf 2) are usually about the common ground/world state (e.g., *The King of France* → *There is a King*). CIs (Leaf 3) are about the speaker's attitude toward the connection between propositions. If it vanishes when you swap the word (*but* → *and*), it's Lexical (CI), even if it projects.

  ### Conflict 3: Completeness vs. Cancellability (Saturation vs. Enrichment)
  **The Clash:** "I've had breakfast" (Enrichment: *today*). Is it saturation (slot filling) or free enrichment?
  **My Commitment:** I trust **Completeness (Syntax)** over Cancellability.
  **Why:** "Ready" has a syntactic slot for a complement. "Breakfast" does not. If the syntax demands it, it's Saturation (Leaf 6). If the syntax is complete but pragmatics narrows it, it's Free Enrichment (Leaf 9). Both are TC and Non-Cancellable, but they have different grammatical sources.

  ---

  ## 6. Summary of Pushback on Your Position

  You mentioned: *"I lean toward thinking a good chunk of what gets called conversational implicature is really part of what is said."*

  **My Pushback:**
  You are likely correct that **Generalized** Implicatures (like *some*) feel like "what is said." However, if you move them into "what is said" (Truth-Conditional Content), you lose the ability to explain **Defeasibility**.
  *   **Scenario:** A professor writes a letter: "Jones has excellent handwriting."
  *   **Implicature:** Jones is a bad philosopher.
  *   **Your View:** If this is "what is said," then if Jones is a *good* philosopher, the letter is *false*.
  *   **Problem:** The letter isn't false; it's misleading.
  *   **Conclusion:** Keep Implicature (Leaf 4 & 5) separate from "What is Said" (Leaf 8 & 9).
  *   **Compromise:** Move **Free Enrichment** (Leaf 9) into "What is Said." This captures the pragmatic work needed to get a proposition without sacrificing the cancellability test for Implicature. Don't call Enrichment "Implicature"; call it "Impliciture" or "Pragmatic Intrusion" to keep the categories clean.

  **Final Advice for the Seminar:** Use the tree to show that "What is Said" is not just Semantics (Leaf 8). It is Semantics + Saturation (Leaf 6) + Free Enrichment (Leaf 9). Keep Implicature (Leaf 4, 5, 7) outside the truth conditions to preserve the logic of cancellation.
