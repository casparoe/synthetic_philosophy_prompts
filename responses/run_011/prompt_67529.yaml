          *   *View on MR:* MR is a modal claim. It's *possible* for pain to be realized differently. Even if actual Earth biology is uniform, the *kind* "pain" extends beyond Earth biology.
          *   *Goal:* Preserve the autonomy of psychology as a special science.

      *   **Camp 2 (The Churchland/Identity Theorist/Neuropragmatist):**
          *   *Core Commitment:* Scientific kinds are determined by successful prediction and explanation within a unified science.
          *   *Metaphysics:* Reductive physicalism (or eliminativism, or "local reduction").
          *   *View on MR:* MR is an empirical claim about actual diversity. If octopus pain shares deep homological structures with human pain, it's not *truly* multiple realization in a way that blocks reduction. If it's silicon, maybe that's not "pain" in the strict biological sense, or we reduce it locally (Human-Pain, Octopus-Pain).
          *   *Goal:* Integrate psychology into neuroscience/biology.

  3.  **Evaluate the User's Hypothesis ("Level-Mixing"):**
      *   The user suspects the damage is done by mixing metaphysics of kinds with how neuroscience picks out objects.
