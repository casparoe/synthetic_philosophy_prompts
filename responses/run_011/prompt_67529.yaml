      *   Camp 2 defines kinds by *mechanism* (fine).
      *   The "MR" argument works for Camp 1 because they fix the mental kind first. It fails for Camp 2 because they let the physical kind dictate the mental kind (or split the mental kind).
      *   The "Level-Mixing" hunch is correct: It's mixing *Functional Individuation* (Psych) with *Structural Individuation* (Neuro).

