      *   *My assessment:* This is a strong, provocative reading. It aligns well with the "problem play" nature of *Measure*. The "loss" reading assumes someone *could* have standing if they were good enough. The "scarcity" reading suggests the condition of Vienna (and humanity) makes standing structurally impossible for mere mortals. The Duke acts as a *deus ex machina* not just plot-wise but metaphysically—he occupies the position of God (or the Sovereign) who *does* have standing.
      *   *Decision:* Argue *for* the thesis, but refine it. The Duke doesn't just have standing; he *suspends* the economy of standing. He moves from blame to mercy, which operates outside standing. The "artificiality" is indeed the point: human justice is a trap; only divine/sovereign intervention breaks the cycle.

  3.  **Evaluate Accounts of Hypocrisy:**
      *   *Unfairness (exempting oneself):* Angelo fits this, but he knows he's corrupt. He doesn't exempt himself in his mind; he accepts he deserves death. So this account is weak for Angelo.
