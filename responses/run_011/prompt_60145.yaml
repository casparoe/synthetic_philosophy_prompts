answer: |-
  Your thesis is compelling, and I argue you should press it harder: *Measure for Measure* is not merely about the scarcity of standing but about the structural impossibility of blame within a fallen economy of justice. The play suggests that standing is not a property agents possess or lose, but a privilege that requires a vantage point outside the system of sin and law—a vantage point no human occupies. The Duke does not resolve the impasse by acquiring standing; he resolves it by suspending the economy of standing altogether. He shifts the register from retributive justice (which requires standing) to sovereign mercy (which requires only power). The artificiality of the finale is indeed the argument: human moral psychology creates a knot that only a *deus ex machina* can cut. If you treat the Duke's manipulation not as a moral failure but as a theological necessity, the play stops looking like a botched comedy and starts looking like a rigorous demonstration of why human blame is always ultimately unfitting.

  However, I would refine your claim about the Duke. It is not that he has standing where others do not; it is that he occupies the position of the Lawgiver, who is by definition exempt from the law he administers. In the literature on standing, we usually assume a community of equals. Vienna is not a community of equals; it is a hierarchy with God (or the Sovereign) at the apex. The Duke's return demonstrates that blame is a horizontal practice that fails when the vertical axis is ignored. He pardons Angelo not because Angelo deserves it, and not because the Duke has cleansed himself, but because the Duke holds the prerogative to stop the counting. This supports your scarcity thesis: among the citizens, standing is zero-sum and ultimately null; only the Sovereign can break the cycle.

  Regarding the accounts of hypocrisy, the play is devastating to the **insincerity** and **self-deception** accounts. Angelo is the counter-example that should retire these theories in this context. He knows he is corrupt. He articulates his lust with precision. He does not claim to be pure; he claims the law must be pure regardless of the enforcer. If your students are working with accounts that say hypocrisy requires the agent to believe they are good, Angelo breaks the model. He is a lucid hypocrite, which suggests the vice lies not in a psychological state but in the structural position of enforcing a law one cannot satisfy.

  The **unfairness** account (exempting oneself from demands pressed on others) fares better but still stumbles. Angelo does not exempt himself; he explicitly demands his own execution when exposed. He accepts the penalty. The unfairness is not that he lets himself off, but that he attempted to trade Claudio's life for Isabella's body while Claudio was being punished for a lesser sexual transaction. The play suggests the real unfairness is the law itself, which treats betrothal sex as capital while the Duke and the nobility roam free.

  The account the play most strongly supports is the **complicity** account. Vienna is a city where the brothel-keeper, the constable, the pimp, and the nobleman are all entangled in the same web. Lucio, who slanders the Duke, speaks truths, yet is punished. Pompey, who facilitates the sex trade, offers the most pragmatic moral counsel. The dramaturgy insists that judgment from within the system is always contaminated. This validates your scarcity thesis: if everyone is complicit, no one has the clean hands required for the standard model of blame.

  However, the play embarrasses the **second-personal** account (authority to address demands as an equal). The Duke does not address Angelo as an equal. He addresses him as a subject who failed a test. The restoration of order comes not through reciprocal recognition but through vertical imposition. If your seminar is invested in Strawsonian reactive attitudes among peers, this play is a nightmare, because the only successful reactive attitude is the Duke's indignation, which is backed by the power of life and death.

  For your session, I would put three moments in front of the class.

  First, **Angelo's soliloquy after meeting Isabella**. This is where you dismantle the self-deception account. Have students look at how he describes his own corruption. He does not rationalize; he laments. He recognizes that his blood is speaking against his judgment. This forces the question: if the blamer knows they are flawed, do they lose standing? Or is the flaw irrelevant to the validity of the judgment? Angelo's judgment that Claudio broke the law is true; his standing to punish is the variable.

  Second, **the Duke's encounter with Juliet in prison**. Do not skip this. It does work the main plot does not. In the main plot, the Duke is a manipulator; here, he is a confessor. He tests Juliet's repentance to see if she regrets the sin or merely the shame. This establishes that the Duke cares about internal moral states, not just external compliance. It sets up his later distinction between Angelo's legal guilt and his spiritual state. It also shows the Duke exercising a pastoral authority that precedes his political return. It suggests he has standing not because he is powerful, but because he knows the heart. This complicates your scarcity thesis slightly: it suggests standing might be possible for those who know the truth of repentance, not just the letter of the law.

  Third, **the public return in Act Five**. This is where you stage the pardon. Focus on the sequence: Angelo is sentenced, he accepts it, the women plead, the Duke grants mercy. The crucial philosophical moment is when the Duke forces Isabella to kneel and ask for Angelo's life. You asked whether this is forgiveness or something else. It is not forgiveness. Forgiveness is a victim's prerogative. This is conscription. The Duke is using Isabella's moral capital to purchase his own reputation for clemency. He needs her to perform the mercy so he can embody it. This supports your view that the finale is an argument about power: the Duke needs the victims to validate the sovereign's grace.

  This leads to **Isabella's silence**. It is philosophically load-bearing. If she speaks, she re-enters the economy of exchange. If she says "I forgive," she grants Angelo a debt release. If she says "Kill him," she demands blood. By saying nothing, she refuses to participate in the Duke's script. She withholds the validation he seeks. The Duke proposes marriage; she does not accept. This silence preserves her standing by refusing to trade it. It is the only act of autonomy left to her. If you tell your students her silence is a staging accident, you rob the play of its final critical bite. She is the only character who does not submit to the Duke's management.

  Now, I must be candid about where your reading—and any philosophical reading—resists the text.

  First, the **farce**. The underplots with Pompey, Elbow, and Mistress Overdone are not just comic relief; they are a materialist critique of the moral psychology you are teaching. When Pompey argues that banning sex is like banning eating, he is voicing a naturalistic objection to the very norms Angelo and the Duke are debating. Philosophy wants to treat the norms as given; the play suggests the norms are absurd. The bawdy humor undermines the gravity of the blame. If you treat the play purely as a case study in standing, you risk sanitizing the grime that makes the standing impossible in the first place.

  Second, the **bed trick**. Morally, this is a disaster. The Duke arranges for Mariana to sleep with Angelo under the belief he is sleeping with Isabella. This is sexual deception. In a modern ethics seminar, this looks like coercion. The play treats it as a harmless device to satisfy the law. Your philosophical apparatus will struggle to absorb this without condemning the Duke. If the Duke is the figure of sovereign grace, why does he rely on lying and manipulation? The play suggests that in a fallen world, even the savior must get his hands dirty. This resists a clean "standing" analysis because the Duke's standing is purchased through deceit.

  Third, the **theological architecture**. You are teaching this as moral psychology, but the play is structured around Grace versus Law. The "scarcity of standing" is not just a social fact; it is a theological condition. In Christian terms, no one has standing to blame because all are sinners. Only God has standing. The Duke is playing God. If you secularize the reading too much, you lose the engine of the plot. The pardon is not a political decision; it is an imitation of divine mercy. Your students need to know that the "artificiality" they feel is the friction between a human story and a divine solution.

  Finally, the **Duke's character**. He is often played as benevolent, but he is also a control freak. He leaves the city to test his deputies, then returns to test everyone else. He gaslights Isabella about her brother's death. He manipulates Mariana. If the Duke is the solution to the scarcity of standing, he is a terrifying solution. He represents a paternalism that overrides agency for the sake of order. Your thesis that he installs a figure with near-absolute power is correct, but you should press the class on whether this is a resolution or a warning. Is it better to live in a city where no one can blame anyone, or a city where one man can blame everyone and pardon anyone?

  In sum: Defend the scarcity thesis, but acknowledge that the play offers sovereignty as a solution that is as dangerous as the problem. Angelo embarrasses the insincerity account; Vienna supports the complicity account. Isabella's silence is a refusal of the sovereign's economy. And do not let the philosophy smooth over the farce or the deception; let the messiness of the drama challenge the neatness of the standing literature. The play suggests that standing is not just scarce; it is perhaps a fiction we tell ourselves to hide our need for mercy.
