      *   *Self-Correction on Discounting:* If I say the recommendation holds under discounting, I need to be careful. If the discount rate is high enough, the AI grant loses. I should frame it as: The recommendation is robust to *reasonable* disagreement on discounting because the risk is proximate (advanced systems arriving soon), whereas the absurd proposal relies on deeply distant futures.
      *   *Self-Correction on Pascal's Mugging:* The key distinction isn't just the math, it's the *auditability*. The AI proposal has a research program with intermediate outputs. The $400k proposal is likely a "scheme." I need to emphasize *verifiable progress* vs. *theoretical claims*.

  9.  **Drafting - Step-by-Step:**

      *   *Header:* Standard.
