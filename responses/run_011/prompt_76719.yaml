      To: Board of Trustees
      From: [Your Name]
      Date: October 26, 2023
      Subject: Decision Memorandum: AI Alignment Grant and Longshot Policy

      **Recommendation**
      I recommend we approve the $18 million AI alignment request, structured as three contingent tranches over seven years. We commit $5 million immediately for a two-year Phase I. Phase II ($6 million) and Phase III ($7 million) are gated on independent verification of technical milestones and a board review of the probability landscape. We will revisit the commitment annually. An early review is triggered if credible evidence emerges that the catastrophic risk timeline has receded beyond 50 years or if intermediate safety benchmarks fail to correlate with model capability.

      **The Case Against Approval**
      The strongest objection to this recommendation is not that global health is superior, but that the arithmetic underpinning this request is epistemically bankrupt. We are asked to trust a 1-in-500 probability estimate in a domain where calibration is impossible. If we accept this methodology, we logically obligate ourselves to fund the unsolicited $400,000 proposal claiming a 1-in-a-billion chance to save 10^22 lives. That proposal yields higher expected value per dollar yet strikes every trustee as absurd. Critics argue that a decision procedure licensing the absurd must be self-disqualifying. Furthermore, our enthusiasm for existential risk scenarios may be systematically skewed; we are prone to overprice vivid catastrophes while underweighting certain, measurable suffering. To fund the AI program is to validate a calculus that could drain the endowment into black boxes with no auditable return.

      **Concessions and Mitigations**
      This recommendation concedes that the probability estimates are unreliable guides for a single binary decision. It does not concede that the expected value is zero. Instead, it treats the grant as a purchase of information rather than a certainty of impact. By tranche-funding, we limit exposure to the "skewed enthusiasm" risk. If the probability estimates prove hollow during Phase I, we cease funding. This addresses the epistemic humility objection without abandoning the charter's mandate to pursue the greatest good. We acknowledge we cannot audit the probability, but we can audit the progress.

      **The Absurd Proposal and Decision Rules**
      We must adopt a rule that rejects the $400,000 proposal without rejecting the AI grant. Evaluating potential safeguards:
      1.  *Utility Bounds:* Capping the value of future lives arbitrarily limits our charter and relocates the problem to where the cap is set.
      2.  *Probability Ceilings:* Ignoring probabilities below a threshold (e.g., 1-in-1 million) is equally arbitrary and blinds us to genuine tail risks.
      3.  *Discounting Chained Estimates:* Penalizing complex causal chains is sensible but difficult to standardize.
      4.  *Fixed Portfolio Allocation:* This is the most robust solution.

      I recommend we adopt a Fixed Portfolio Allocation for high-variance, longshot programs, capped at 20% of the annual budget. Within this cap, proposals must meet an "Evidence Threshold." The AI proposal clears this because it funds a research community producing verifiable intermediate outputs (benchmarks, papers, safety protocols). The $400,000 proposal fails because it offers no verifiable milestones between funding and the claimed outcome. It relies entirely on the theoretical claim. We will reject proposals where the only metric of success is the avoidance of an unobservable catastrophe. This distinguishes serious risk reduction from Pascal's Mugging without relying on disputed probability math.

      **Time Preference and Discounting**
      Board members disagree on whether to discount far-future lives. If the board adopts a positive pure rate of time preference, the expected value of the AI grant decreases, as the avoided catastrophe is pushed into the future. Under a discount rate, this recommendation changes in two ways: First, the Portfolio Cap for longshots should be reduced from 20% to 10%. Second, the continuation criteria for Phase II become stricter; we would require evidence that the risk is imminent (within 20 years) rather than merely plausible.

      However, parts of this recommendation are invariant to discounting. The tranched structure remains necessary regardless of valuation, as it manages liquidity and risk. The requirement for verifiable milestones remains invariant; even discounted lives require real interventions to save them. The charter's commitment to "greatest good" implies we must address existential threats regardless of discounting, provided the near-term probability of the threat materializing is non-negligible. Since advanced AI systems are expected within the discount horizon of most reasonable rates, the core justification survives.

      **Implementation Timeline**
      *   **Q1 2024:** Execute Phase I agreement ($5M).
      *   **Q4 2025:** Independent audit of technical milestones. Board vote on Phase II.
      *   **Annual:** Review portfolio allocation against the 20% cap.
      *   **Trigger:** Early review if major geopolitical shifts alter risk profiles.

      **Annex: Standing Rule for Longshot Requests**

      **Policy:** High-Variance Program Protocol
      **Applicability:** Any proposal where >50% of expected value derives from outcomes with <5% probability.

      **Clearance Criteria:**
      1.  **Portfolio Cap:** Total active funding in this category cannot exceed 20% of the annual granting budget.
      2.  **Verifiable Intermediates:** The proposal must define intermediate milestones (e.g., technical benchmarks, policy adoption) achievable within 24 months. Success cannot be defined solely as the non-occurrence of a catastrophe.
      3.  **Epistemic Audit:** Applicants must submit a confidence interval for their probability estimates, subject to review by an external expert panel not affiliated with the applicant.
      4.  **Decline Condition:** Proposals are automatically declined if the causal chain between funding and outcome exceeds five logical steps without empirical precedent.

      **Procedure:**
      Program Officers must flag proposals meeting the "Applicability" definition at the intake stage. The Investment Committee will review compliance with the Portfolio Cap before any term sheet is issued. Non-compliant proposals are returned without full board review.

      *(Word Count Check)*: The draft looks a bit short. I need to expand on the reasoning for the decision rules and the discounting section to ensure I hit the ~1,200 word target while maintaining density. I will expand the analysis of why the other decision rules fail in the "Absurd Proposal" section. I will also elaborate on the "Invariant" aspects of the discounting section.

      *Revised Plan:* Expand the critique of Utility Bounds and Probability Ceilings. Expand the specific conditions for the tranches. Ensure the tone is strictly governance-focused.

      *Let's write the final version.*
