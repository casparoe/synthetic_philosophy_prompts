prompt: |-
  Our reading group is working through On Certainty and the guy runnig it keeps reaching for the same picture: hinge propositions are like the foundation of a house. Ordinary empirical claims are the walls, floors, furniture; they rest on the foundation, and you can inspect the upper storeys all you like but you can't get underneath the foundation to test it -- which is why the sceptic's questions about hinges are misconceived rather than merely unanswerable. He draws two conclusions from it: (1) Wittgenstein is really just a foundationalist, hinge epistemology is basic-beliefs epistemology with new packaging, and (2) a foundation is still a structural part of the building, so hinges are things we believe, only beliefs we can't justify.

  I came away unconvinced but I couldn't say why at the time. Can you audit the house picture for me? Give the correspondences explicitly -- foundation, superstructure, inspector, load-bearing, the ground the foundation itself sits on -- then the disanalogies, sorted into the ones that actually bear on his two conclusions and the ones that are decorative. I especially want to know whether the analogy is smuggling something in about *support*: does a foundation stand to a house the way a hinge stands to an enquiry, and what does the word hinge itself contribute that foundation drops? Also whether a foundation's being untestable-in-practice is the same sort of thing as his claim about hinges, since foundations do get tested, just not by the people living upstairs.

  Then finish with whether (1) and (2) survive once the load-bearing disanalogies are on the table, and what image would fit better if the house doesn't -- including whether Wittgenstein offers one himself somewhere in the book.

  Open with your bottom line in two or three sentences. Hard cap of 450 words, table included. Don't quote anything verbatim, just describe the passages you have in mind, since I might be working from a different edition.
