      *   **Nadia's Position:** Intervention was legitimate on March 17 (UNSCR 1973) based on the mandate (protect civilians, no occupation). Post-intervention failures are execution errors, not mandate errors. Uses a "double effect" argument (regime change was unintended but necessary for protection).
      *   **User's Position:** The drift from protection to regime change was latent in the mandate. Abstainers (Brazil, etc.) predicted harm. The intervention violated R2P criteria over time.
      *   **Specific Requirements:**
          *   Disciplined case analysis using R2P machinery (2005 Summit Language: 3 Pillars, "manifestly failing"; 2001 ICISS Report: 6 Precautionary Criteria).
          *   Walk through specific pivots (AU roadmap, recognition of NTC, air campaign shifts, Gaddafi compound strike, ground advisers, Sirte convoy).
          *   Evaluate Nadia's "double effect" defense.
          *   Analyze the impact on R2P doctrine (Reasonable Prospects criterion: ex post vs. ex ante; Pillar handover problem; Syria veto pattern interpretation).
