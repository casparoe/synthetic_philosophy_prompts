          *   **Tone:** Analytical, disciplined, serious, engaging with the complexity (no oversimplification).

  2.  **Deconstruct the R2P Framework:**
      *   **2005 World Summit Outcome Document (WSOD):**
          *   Pillar 1: State responsibility to protect its population.
          *   Pillar 2: International assistance to states.
          *   Pillar 3: Timely and decisive response (including Chapter VII) if state is "manifestly failing."
          *   Threshold: Genocide, war crimes, ethnic cleansing, crimes against humanity.
      *   **2001 ICISS Report (The "Precautionary Criteria"):**
          *   Just Cause.
          *   Right Intention.
          *   Last Resort.
          *   Proportional Means.
          *   Reasonable Prospects.
          *   Right Authority (UNSC).

  3.  **Analyze the Libya Case (March - October 2011):**
      *   **March 17 (UNSCR 1973):**
          *   *Just Cause:* Gaddafi's threats against Benghazi ("no mercy") constituted imminent crimes against humanity. (Satisfied).
          *   *Right Authority:* UNSC passed it 10-0-5. (Satisfied).
          *   *Last Resort:* Sanctions (1970) failed, Gaddafi advancing. (Plausibly Satisfied).
          *   *Right Intention:* Stated aim was civilian protection. (Formally Satisfied).
          *   *Proportional Means:* "All necessary measures... excluding occupation." (Ambiguous).
          *   *Reasonable Prospects:* Could air power stop the advance without causing worse chaos? (Debatable).
      *   **The Pivots (Where the User's argument gains traction):**
          *   *AU Roadmap (April):* Proposed ceasefire, reforms. NATO/NTC rejected it. *R2P Implication:* If a non-coercive solution exists, "Last Resort" is violated.
          *   *Recognition of NTC (July/August):* Treating rebels as legitimate government. *R2P Implication:* Shifts "Right Intention" from protection to political outcome (regime change).
          *   *Targeting Shift:* From halting columns to command/control to Gaddafi's compound (April 30 strike killing Saif al-Arab and grandchildren). *R2P Implication:* "Proportional Means" and "Right Intention" blur. Decapitation strikes look like regime change, not civilian protection.
          *   *Ground Advisers/Qatar/UAE:* Foreign boots on the ground (technically not "occupation force" but clearly combat support). *R2P Implication:* Stretching the "exclusion of occupation" clause.
          *   *Sirte Convoy (Oct 20):* NATO strike on fleeing convoy leading to Gaddafi's capture/killing. *R2P Implication:* Direct facilitation of extrajudicial killing.

  4.  **Evaluate Nadia's "Double Effect" Defense:**
      *   *Doctrine:* Action is permissible if the good effect (civilian protection) is intended, the bad effect (regime change/collateral damage) is foreseen but not intended, and the good outweighs the bad.
      *   *Application:* NATO *needed* to remove Gaddafi to protect civilians.
      *   *Critique:* Did they *need* to? Or did they *want* to? The rejection of the AU plan suggests the latter. If regime change becomes the *method* of protection, it ceases to be a side effect and becomes the objective. This collapses "Right Intention."

  5.  **Analyze the Impact on R2P Doctrine:**
      *   **Reasonable Prospects:**
          *   *Problem:* In March 2011, Libya had no institutions. Destroying the state apparatus guarantees a vacuum.
          *   *Ex Ante vs. Ex Post:* If judged ex post, it's just hindsight. If ex ante, the lack of opposition cohesion and state structure should have flagged "unreasonable prospects" for long-term stability.
          *   *Action-Guiding Version:* Requires analysis of *post-intervention* political order, not just military success.
      *   **Pillar Handover:**
          *   *Problem:* Pillar 3 (Intervention) destroys Pillar 1 (Sovereign). Who picks up the tab?
          *   *R2P Silence:* The doctrine is silent on Pillar 2 (Rebuilding) *after* coercive Pillar 3 action. It assumes a functioning state returns. In Libya, the state vanished.
      *   **Syria Veto Pattern:**
          *   *Interpretation:* Russia/China vetoed Syria because they felt burned by Libya (Pillar 3 used as a trap for regime change).
          *   *Verdict:* This suggests 2011 *broke* the norm (or at least the trust required for the norm). It wasn't a lesson learned about prospects; it was a realization that Pillar 3 could be hijacked.

  6.  **Adjudication (Who was right?):**
      *   *Nadia:* Correct on the *legal* start point (March 17). The mandate *was* protection.
      *   *User:* Correct on the *doctrinal* trajectory. The execution violated the precautionary criteria (Last Resort, Right Intention, Reasonable Prospects) during the campaign, not just after.
      *   *Synthesis:* Nadia wins on International Law (UNSCR text); User wins on R2P Doctrine (ICISS/WSOD spirit and criteria). Since the prompt asks for R2P doctrine analysis, the User has the stronger case regarding the *norm*, even if Nadia has the stronger case on the *resolution text*.
      *   *Refinement:* The prompt asks who was closer to right *last night*. The argument was about whether the drift was a "glitch" (Nadia) or "latent" (User). The evidence suggests it was latent/opportunistic. Therefore, User is closer to right on the *nature* of the intervention, though Nadia is right that the initial entry was defensible.
      *   *Decision:* I need to be nuanced. Nadia is right about the *entry* legitimacy. The User is right about the *doctrinal violation* during the campaign. However, regarding the specific question of "did the mandate contain the drift," the User is stronger because the "Right Intention" criterion was compromised by the rejection of alternatives (AU plan).

  7.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the sophistication of the debate. Set the stage (ICISS vs. WSOD).
      *   *Section 1: The March 17 Baseline.* Assess the 6 criteria at the moment of voting. Acknowledge Nadia's strength here (Just Cause, Authority).
      *   *Section 2: The Pivots (The User's Evidence).* Go through the specific events requested. Map them to R2P criteria (Last Resort, Right Intention, Proportional Means).
      *   *Section 3: The Double Effect Defense.* Analyze Nadia's argument. Show where it collapses (intention vs. method).
      *   *Section 4: Doctrinal Damage (Reasonable Prospects & Pillars).* Address the ex post/ex ante problem and the Pillar 1/3 handover gap. Address Syria.
      *   *Conclusion/Adjudication:* Deliver the verdict.

      *(Self-Correction during drafting)*: Make sure I don't get bogged down in too much history. Keep it tied to the *criteria*. Ensure I address the "Reasonable Prospects" ex-ante/ex-post tension specifically as requested. Ensure I address the "Pillar Handover" silence.
      *Correction on Gaddafi Compound:* April 30, 2011. Saif al-Arab (son) and three grandchildren killed. User was correct.
      *Correction on AU Roadmap:* Proposed April 10, 2011. Rejected by NTC and NATO continued ops.
      *Correction on Sirte:* Oct 20, 2011. NATO struck convoy. Gaddafi killed.

      *Tone Check:* Keep it analytical, not emotional. Respect Nadia's NGO background (protection is hard), but hold the doctrine to account.

      *Final Verdict Nuance:* Nadia is right on *Law* (Resolution 1973). User is right on *Norm* (R2P Doctrine). Since the prompt asks for a "case analysis... through R2P," the User's framework is the governing one. I will lean towards the User but validate Nadia's starting point.

  8.  **Final Polish:** Check against constraints. No reading list. Specific adjudication. Address all specific pivots. Address Syria. Address Pillar handover.

      *(Refining the "Who Won" verdict)*: It's not a binary win. It's about whose diagnosis of the *failure* is more accurate. Nadia says "execution glitch." User says "latent flaw." The evidence of the AU rejection and targeting shifts supports "latent flaw/opportunistic expansion." So User wins on the *diagnosis*, even if Nadia wins on the *initial legality*. I will frame the adjudication around this distinction.

      *(Refining the Double Effect)*: The key is "necessity." If regime change wasn't the *only* way to protect civilians (e.g., if AU plan could have worked), then Double Effect fails. The rejection of the AU plan is the smoking gun here.

      *(Refining Reasonable Prospects)*: The key is "post-conflict stability." ICISS explicitly links prospects to not making things worse. Libya proves this was ignored.

      *(Refining Pillar Handover)*: R2P assumes the state survives. If the state is the target, R2P has no exit strategy. This is a structural flaw.

