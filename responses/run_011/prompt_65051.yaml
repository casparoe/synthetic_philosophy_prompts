      *   **Conclusion:** Summary of the view's viability.

  5.  **Drafting - Specific Focus on Requirements:**
      *   *Requirement 1 (Internal/External):* I need to be clear that the "Somatic Integration" critique (Shewmon) is an *external* critique that forced *internal* changes (2008 Council). The "Neuroendocrine" point is an *internal* concession.
      *   *Requirement 2 (Epistemic Status):* Use phrases like "Consensus among neurologists," "Philosophically contested," "Statutory lag," "Empirical observation."
      *   *Tone Check:* Do not reassure. Do not say "You are right." Say "Here is where the logic holds, here is where it leaks."

  6.  **Refining the Arguments (Self-Correction during drafting):**
