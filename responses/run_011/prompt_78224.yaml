  *(Refining Point b)*: The user asks if their framework can *only fake* flexibility of ends. Yes. In standard RL, the reward function $R$ is part of the MDP definition. Changing $R$ changes the MDP. Meta-RL learns a distribution over MDPs. But the *meta-objective* is fixed. I need to call this out clearly.

  *(Refining Point c)*: The shelf example. The BT is a *scripted fallback chain*. The learned policy is a *neural net policy*. The learned policy is less brittle *instrumentally*. But is it less sphexish *teleologically*? No. Both want through the door. I need to distinguish instrumental flexibility from teleological flexibility.

