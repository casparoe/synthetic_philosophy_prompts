answer: |-
  Dear Colleague,

  It is a pleasure to correspond with someone who understands that theory construction is ultimately about model fit and overhead costs. Your analogy of treating these philosophical fixes as competing models fitted to the same data set is apt, because that is precisely how the Frege–Geach problem functions in metaethics. It is a stress test for the semantic machinery, checking whether the logic holds under load without requiring ad hoc reinforcements that compromise the integrity of the base material. I have evaluated the five candidates you listed using your proposed metrics, assigning a coverage ratio between 0.0 and 1.0 based on how well they handle simple conditionals, negation, disjunction, quantifiers, attitude reports, and modals, followed by a machinery cost on a scale of 1 to 5 where 1 is minimal and 5 is heavy ontological expenditure, and finally combining these into a parsimony-adjusted score out of 10.

  Starting with Blackburn, his quasi-realist approach using higher-order attitudes and a logic of commitments offers a coverage ratio of about 0.75. It handles simple conditionals well enough to get the inference patterns off the ground, but the story becomes messy when dealing with negation and quantifiers, often requiring us to split the difference between a semantic solution and a pragmatic dissolution of the problem. The machinery cost is relatively low at 2, since it relies mostly on reinterpreting existing attitude structures rather than positing new ontological categories, but this lightness comes at the expense of robustness. When you combine the moderate coverage with the low overhead, you get a parsimony-adjusted score of 6.5, placing it in the middle tier where it is elegant but arguably under-engineered for the full load of logical embedding.

  Moving to Gibbard's early norm-expressivism, the coverage ratio drops slightly to 0.70. This model treats moral judgments as expressions of norms, which works for conditionals but struggles significantly with negation and quantification over moral sentences because norms do not negate or quantify as cleanly as propositions. The machinery cost is also low at 2, similar to Blackburn, because it attempts to do heavy lifting with a single type of normative state. However, the structural weakness in handling negation is a significant stress fracture. This results in a parsimony-adjusted score of 6.0, and I must note here that this view is a strong candidate for removal from the list altogether. It fails on something structural rather than details because the later planning semantics was developed specifically to repair the logical gaps found in this earlier version, making the early model technically obsolete for anyone seeking a complete solution.

  If we look at Gibbard's later planning semantics, the coverage ratio improves markedly to 0.85. By shifting the analysis from norms to plans, Gibbard provides a more robust account of consistency and inconsistency that handles conditionals, negation, and quantifiers with much greater stability. However, this improvement requires a machinery cost of 4, as the semantics of planning states are complex and require significant elaboration to mimic propositional logic without actually using propositions. The trade-off is worth it for many, yielding a parsimony-adjusted score of 7.5. This places it in the upper tier, though it sits slightly below the current market leaders because the planning machinery feels somewhat bolted on to secure the logical fit.

  Schroeder's being-for account achieves the highest coverage ratio of the pure expressivist models at 0.95. It is designed specifically to solve the Frege–Geach problem by positing a single unified attitude relation that can be embedded in all the usual logical contexts, including modals and attitude reports, with very few gaps. The machinery cost is 4, because positing a primitive being-for relation is a significant ontological commitment that departs from standard belief-desire psychology. However, since the coverage is nearly perfect and the machinery is unified rather than fragmented, the parsimony-adjusted score comes in at 8.5. This puts it in the top tier, representing the best fit for those who want to remain pure expressivists without sacrificing logical coverage.

  Finally, Ridge's hybrid expressivism also achieves a coverage ratio of 0.95, matching Schroeder on the logical data. By combining cognitive and non-cognitive states, it allows the cognitive component to handle the logical embedding while the non-cognitive component preserves the motivational force of moral judgment. The machinery cost is the highest at 5, because you are effectively doubling the mental states required for every moral judgment, which is a heavy ontological price. Despite the high cost, the reliability of the model is exceptional, resulting in a parsimony-adjusted score of 8.0. This places it just below Schroeder in the top tier, as the extra machinery is justified by the ease with which it handles the data, though purists may dislike the hybrid nature.

  To summarize the ranking from best to worst, Schroeder takes the top spot with a score of 8.5, followed closely by Ridge at 8.0 and Gibbard's later view at 7.5, which form a competitive upper tier. Blackburn sits in the middle tier at 6.5, and Gibbard's early view rounds out the bottom at 6.0. Regarding your question on structural failure, I believe Gibbard's early norm-expressivism should come off the list altogether. It is not merely that it is less precise than the others, but that it lacks the structural resources to handle negation and quantification without collapsing into the later planning model, making it an incomplete specification rather than a viable rival. I hope this assessment aligns with your intuition on model selection, and I am happy to discuss the stress tests on any of these views further.

  Best regards,

  Your Philosophical Consultant
