  4.  **Part 3: Disanalogies (Substantive vs. Cosmetic):**
      *   *Binding Self vs. Bound Self:* Odysseus t1 vs. Odysseus t2. Is t2's desire to jump irrational (weakness of will) or rational (new info/preferences)? In politics, later generations may legitimately disagree with prior fiscal constraints based on new circumstances (war, pandemic).
