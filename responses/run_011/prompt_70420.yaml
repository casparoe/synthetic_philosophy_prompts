  ### The Case: "The Vision Preservation Protocol"

  **Scenario:**
  You are reviewing a decision aid for a patient, Mr. H., a 55-year-old architect facing a rare, progressive optic neuropathy. The condition affects each eye independently but follows a similar statistical trajectory based on large-scale registry data (providing sharp probabilities). The stakes are measured in **Functional Vision Years (FVY)**—a linear metric of useful sight time. Mr. H. values 1 FVY exactly twice as much as 0.5 FVY; there is no diminishing marginal utility for sight time itself (linear utility).

  Mr. H. faces two distinct, irreversible, one-shot decisions regarding his care. He cannot hedge, insure, or repeat these choices. The first concerns his **Left Eye (Early Stage)**; the second concerns his **Right Eye (Late Stage)**. The biological variance in the disease progression creates different probability profiles for the surgical intervention in each eye, while the risk function governing Mr. H.'s rational choice remains fixed.

  **The Risk Function:**
  We adopt a fixed risk function $r(p)$ that is S-shaped, reflecting an agent who is risk-averse regarding low-probability gains but risk-seeking regarding high-probability gains (a "cautious optimist").
  $$r(p) = 3p^2 - 2p^3$$
  *   **Properties:** $r(0)=0, r(1)=1$, monotonic increasing.
  *   **Behavior:** For $p < 0.5$, $r(p) < p$ (Risk Averse region). For $p > 0.5$, $r(p) > p$ (Risk Seeking region).
  *   **Utility Function:** $u(x) = x$, where $x$ is Functional Vision Years.

  ---

  ### Decision 1: The Left Eye (Low-Probability Intervention)

  **The Choice:**
  *   **Option A (Conservative):** Stabilizing drops. Guaranteed **9 FVY**.
  *   **Option B (Surgery):** High-risk procedure. **20%** chance of **50 FVY**, **80%** chance of **0 FVY**.

  **The Audit:**

  | Metric | Option A (Conservative) | Option B (Surgery) |
  | :--- | :--- | :--- |
  | **Outcomes ($x$)** | 9 (prob 1.0) | 50 (prob 0.2), 0 (prob 0.8) |
  | **Expected Utility (EU)** | $1.0 \times 9 = \mathbf{9}$ | $(0.2 \times 50) + (0.8 \times 0) = \mathbf{10}$ |
  | **EU Verdict** | | **Prefers Option B** (10 > 9) |
  | **Risk Weight $r(p)$** | $r(1.0) = 1$ | $r(0.2) = 3(0.04) - 2(0.008) = 0.104$ |
  | **Risk-Weighted EU (REU)** | $1 \times 9 = \mathbf{9}$ | $(0.104 \times 50) + ((1-0.104) \times 0) = \mathbf{5.2}$ |
  | **REU Verdict** | | **Prefers Option A** (9 > 5.2) |

  **Divergence 1:** Plain Expected Utility endorses the **Surgery** (Higher EU). Risk-Weighted Expected Utility forbids it, endorsing the **Conservative** option (Lower EU). This exploits the risk-averse region of $r(p)$ where small probabilities are heavily downweighted.

  ---

  ### Decision 2: The Right Eye (High-Probability Intervention)

  **The Choice:**
  *   **Option C (Conservative):** Palliative care. Guaranteed **46 FVY**.
  *   **Option D (Surgery):** Refined procedure. **90%** chance of **50 FVY**, **10%** chance of **0 FVY**.

  **The Audit:**

  | Metric | Option C (Conservative) | Option D (Surgery) |
  | :--- | :--- | :--- |
  | **Outcomes ($x$)** | 46 (prob 1.0) | 50 (prob 0.9), 0 (prob 0.1) |
  | **Expected Utility (EU)** | $1.0 \times 46 = \mathbf{46}$ | $(0.9 \times 50) + (0.1 \times 0) = \mathbf{45}$ |
  | **EU Verdict** | | **Prefers Option C** (46 > 45) |
  | **Risk Weight $r(p)$** | $r(1.0) = 1$ | $r(0.9) = 3(0.81) - 2(0.729) = 0.972$ |
  | **Risk-Weighted EU (REU)** | $1 \times 46 = \mathbf{46}$ | $(0.972 \times 50) + ((1-0.972) \times 0) = \mathbf{48.6}$ |
  | **REU Verdict** | | **Prefers Option D** (48.6 > 46) |

  **Divergence 2:** Plain Expected Utility endorses the **Conservative** care (Higher EU). Risk-Weighted Expected Utility forbids it, endorsing the **Surgery** (Lower EU). This exploits the risk-seeking region of $r(p)$ where high probabilities are upweighted relative to linear expectation.

  ---

  ### Structural Analysis

  **The Feature Doing the Work:**
  The divergence is driven by the **non-linearity of the probability weighting** relative to the **distribution of probability mass**.
  *   In Decision 1, the success probability ($p=0.2$) falls in the convex region of $r(p)$ (below the diagonal $y=x$). The risk function discounts the chance of success more than EU does ($0.104$ vs $0.200$).
  *   In Decision 2, the success probability ($p=0.9$) falls in the concave region of $r(p)$ (above the diagonal $y=x$). The risk function amplifies the chance of success more than EU does ($0.972$ vs $0.900$).

  **Removing the Feature:**
  If we replace $r(p)$ with the identity function $r(p) = p$ (standard EU), the REU column becomes identical to the EU column. The disagreements vanish, and both decisions align with Expected Utility maximization. The disagreement does not vanish into agreement on a *different* option; it vanishes into the EU verdict specifically.

  ---

  ### The Statistician's Audit: Two Strongest Attacks

  #### 1. The Redescription Attack (Concavity)
  **The Attack:** "Your utility function isn't linear. Mr. H. is just risk-averse in Decision 1 and risk-seeking in Decision 2 because the *outcomes* (Vision Years) have a non-linear utility curve (e.g., an S-shaped value function like Prospect Theory). You haven't separated risk from utility; you've just hidden the curvature in $r(p)$ that belongs in $u(x)$."

  **Does it Succeed?** **No, not without changing the world.**
  *   **Why:** We explicitly defined utility as linear over FVY ($u(x)=x$). For this attack to succeed, one must argue that 46 FVY is not objectively 46/50ths as valuable as 50 FVY to the agent.
  *   **Condition for Success:** This attack only works if the "outcomes" are not truly final. If "50 FVY" implies a psychological relief that "46 FVY" does not, or if the *context* of the gamble changes the value of the outcome (e.g., "winning" the surgery feels better than "keeping" the vision), then the utility is defined over richer outcomes (e.g., "50 FVY + Pride"). If we accept the outcomes as defined (pure functioning time), the linearity holds, and the divergence must be attributed to $r(p)$.

  #### 2. The Dynamic Attack (Repetition)
  **The Attack:** "No medical decision is truly one-shot. Mr. H. has two eyes. He can treat this as a portfolio. Over a lifetime of health decisions, the law of large numbers applies. If he follows REU, he will systematically underperform EU in the long run. The risk weighting is a cognitive error that gets arbitraged away by reality."

  **Does it Succeed?** **No, due to the structural constraints.**
  *   **Why:** The case specifies the decisions are for independent eyes with *different* probability profiles (Early vs. Late stage). He cannot pool the risk. The Left Eye surgery ($p=0.2$) is a distinct biological event from the Right Eye surgery ($p=0.9$). He cannot repeat the Left Eye decision if it fails (the eye is lost).
  *   **Condition for Success:** This attack succeeds only if the agent can **hedge**. If Mr. H. could buy insurance that pays out if the surgery fails, or if he could undergo the Left Eye procedure on 100 different patients (which he can't), the variance would wash out. In a genuinely irreversible, non-repeatable, non-hedgeable biological context, the long-run defense of EU loses its normative force.

  ---

  ### Description Reliance Assessment

  **Is the case description-relative?**
  **Yes.** This is the strongest remaining vulnerability.
  REU is sensitive to the **partitioning of outcomes**.
  *   *Scenario:* In Decision 2, suppose the "0 FVY" outcome is actually "0 FVY for 1 year, then death" vs "0 FVY for 2 years, then death."
  *   If we split the "Failure" state into two distinct outcomes (Failure-Type-1 and Failure-Type-2) with probabilities $0.05$ and $0.05$, the cumulative probability calculations for the *Success* state remain the same ($p=0.9$), so the verdict holds.
  *   *However:* If we split the **Success** state. Suppose "50 FVY" is partitioned into "50 FVY with minor pain" ($p=0.45$) and "50 FVY with no pain" ($p=0.45$).
      *   Original REU: $r(0.9) \times 50$.
      *   New REU: $[r(0.9) - r(0.45)] \times 50_{no\_pain} + [r(0.45) - r(0)] \times 50_{pain}$.
      *   Because $r(p)$ is non-linear, $r(0.9) \neq (r(0.9)-r(0.45)) + r(0.45)$. Wait, mathematically $(A-B) + B = A$. The weights sum to $r(0.9)$.
      *   *Correction:* If the *utility* of the partitioned outcomes is the same ($50$), the REU sum is $\sum w_i u = u \sum w_i = u \cdot r(0.9)$. The verdict is **invariant** to partitioning outcomes with *equal utility*.
      *   **The Real Risk:** The verdict changes if we partition outcomes of *different utility* in a way that shifts the cumulative probability thresholds relative to the inflection point of $r(p)$.
      *   *Example:* If we introduce a "Moderate Success" (25 FVY) outcome into Decision 2.
          *   Old: 90% (50), 10% (0). REU = 48.6.
          *   New: 45% (50), 45% (25), 10% (0).
          *   REU = $[r(0.9)-r(0.45)] \times 50 + [r(0.45)-r(0)] \times 25$.
          *   $r(0.9)=0.972$. $r(0.45) \approx 0.47$.
          *   Weight on 50: $0.502$. Weight on 25: $0.47$.
          *   REU = $(0.502 \times 50) + (0.47 \times 25) = 25.1 + 11.75 = 36.85$.
          *   The REU value drops significantly (from 48.6 to 36.85) simply by adding a moderate outcome, even if the *EU* remains roughly similar ($0.45 \times 50 + 0.45 \times 25 = 33.75$).
      *   **Assessment:** The case is description-relative. A finer partition of intermediate outcomes can alter the REU verdict without changing the EU verdict significantly. This is a known feature of REU (violation of coarse-graining invariance).
      *   **Weight:** This limits the case's normative force. It suggests REU recommendations depend on how the clinical options are described (e.g., "Success/Failure" vs. "Full/Partial/None"). To defend the case, one must argue that the chosen partition (Full Success vs. Total Failure) is the *natural* description of the medical outcome, not an arbitrary granularity.

  ### Final Weight Assessment
  This case bears **significant but conditional weight**.
  It successfully defeats the "Concavity" and "Repetition" escapes by enforcing linear utility and structural irreversibility. It demonstrates that REU is not merely EU in disguise; it can flip recommendations based on probability location ($p < 0.5$ vs $p > 0.5$) with a fixed risk attitude.
  However, the **Description Reliance** is a genuine vulnerability. If your statistician argues that the "50 FVY" outcome is actually a distribution of slightly varied outcomes, the REU calculation shifts. The case holds only if we agree that the decision aid's partitioning of outcomes (Success/Failure) is the morally and medically relevant description, not a convenient simplification. If he accepts the partition, the divergence is real. If he rejects the partition, the theory is unstable.
