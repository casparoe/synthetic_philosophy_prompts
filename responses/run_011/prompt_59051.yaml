  Both analogies fail because they treat the Anthropocene as closed history.

  **Analogy 1: The Stratigrapher (K–Pg)**
  | Source (K–Pg) | Target (Anthropocene) |
  | :--- | :--- |
  | Iridium clay | Plutonium fallout |
  | Asteroid impact | Thermonuclear testing |
  | Passive fauna | Active humanity |
  | Closed interval | Open interval (no top) |

  *Load-bearing mismatch:* Fauna could not alter the iridium signal; humanity can alter plutonium records via remediation or further deposition.
  *Smuggle:* **Geological Determinism.** The asteroid smuggles the idea that humans are merely a force of nature, absolving agency. It implies the boundary is immutable fact, ignoring that the "marker" is politically controllable. The source contributes finality the target lacks.

  **Analogy 2: The Historian (Industrial Revolution)**
  | Source (Ind. Rev.) | Target (Anthropocene) |
  | :--- | :--- |
  | Economic transformation | Planetary transformation |
  | Retrospective label | Proposed epoch |
  | Variable start dates | Single Global Boundary |
  | Narrative choice | Stratigraphic fact |

  *Load-bearing mismatch:* The Industrial Revolution is a historiographic construct; the Anthropocene proposes a physical stratigraphic unit.
  *Smuggle:* **Historical Relativism.** The Revolution smuggles the idea that boundaries are purely narrative choices, ignoring the material reality of the radionuclide signal which exists regardless of interpretation. The source contributes arbitrariness the target's physicality resists.

  **The Open Features**
  Your two flags damage both analogies. The **missing top** contradicts the K–Pg's closed system and the Industrial Revolution's completed phase. The **revisable marker** destroys the K–Pg's immutability and the Historian's retrospective fixity. Humans are neither dinosaurs nor mill owners; we are stratigraphic agents.

  **Third Comparison: A Construction Project**
  *Mapping:* Foundation (1950s), unfinished structure (no top), architects present (us).
  *Audit:* Captures agency/openness but smuggles **Intentionality**, implying design where there is mostly drift. It survives the "missing top" critique but fails on "revisable marker" unless viewed as renovation.

  **Commitment**
  The stratigrapher is right that a material signal exists; the historian is right that selecting it is political. However, the K–Pg analogy fails because it denies agency, and the Industrial Revolution fails because it denies materiality.

  There is a *fact* about the signal (plutonium exists), but no *fact* about the epoch until the signal is closed. Because we can alter the marker, the start date is not merely found (K–Pg) nor merely chosen (Historian); it is **enacted**. We decide the boundary by deciding whether to sustain or suppress the signal. The authority lies not with stratigraphers finding truth, nor historians choosing narratives, but with the collective capacity to alter the geological record. The Anthropocene is not a period we enter; it is a record we write. Ratification was not a loss of nerve, but a recognition that naming an epoch requires a closure we cannot yet ethically claim. The fact survives as deposition; the decision survives as trajectory.
