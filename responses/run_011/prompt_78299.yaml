  1. What holds up
  The core factual skeleton is sound. Rome lacked a codified constitution; governance relied heavily on *mos maiorum* (custom of the ancestors) and magisterial self-restraint. Tiberius Gracchus did indeed bypass the Senate via the Tribal Assembly, depose a fellow tribune (Octavius), and seek consecutive office, actions viewed by contemporaries as revolutionary. The Senate's response—mobilizing a mob led by Pontifex Maximus Scipio Nasica to club Gracchus to death—marked the first open political bloodshed in the Forum. That this event shocked contemporaries is well-attested. The description of the army's evolution is also partially grounded: soldiers did develop stronger bonds with commanders who secured land grants, even if the mechanism is debated. The premise that normative restraint was a primary stabilizing force is standard constitutional theory for Rome.

  2. Simplified but survivable
  The narrative compresses a century of decay into a single breakpoint. Saying norms vanished instantly in 133 BC is hyperbolic; the Senate continued to function effectively for decades afterward. The Sullan proscriptions and Caesar's crossing came much later. However, as a heuristic for popular history, identifying 133 BC as the turning point is defensible. It marks the shift from political competition within rules to competition over the rules themselves. The simplification that "institutions persisted but lacked authority" captures the vibe of the late Republic, even if institutions technically remained operative. The link between land reform and military loyalty is a standard textbook explanation, even if nuanced elsewhere. It survives as a pedagogical tool, if not rigorous historiography.

  3. Wrong or seriously contested
  The "Marian Reform" myth is the biggest error. The claim that Marius opened the legions to the *capite censi* (landless poor), creating client armies loyal only to generals, is largely rejected by modern specialists. Evidence suggests property qualifications persisted; soldiers were mostly propertied citizens. Loyalty shifts were driven more by the state's failure to provide land than by structural recruitment changes. Generals didn't march on Rome because soldiers were clients, but because the state couldn't reward service.
  Secondly, the "Gracchan Catalyst" theory is outdated. Specialists argue the Republic was robust long after 133 BC. The system didn't collapse because norms broke; it broke because norms couldn't accommodate imperial scale. Managing a Mediterranean empire with a city-state constitution created impossible incentives. Corruption and violence weren't just normative failures; they were structural features of imperial extraction.
  Third, the claim that "institutions don't save you" ignores that Roman institutions *did* save the Republic repeatedly. The problem wasn't the absence of rules, but that the rules favored an oligarchy blocking necessary adaptation. Blaming Gracchus for breaking norms ignores that the Senate had already broken norms by refusing land reform and ignoring Italian allies. It frames the oligarchy as victims rather than instigators. This is a conservative historiographical lens that privileges stability over justice, assuming the status quo was legitimate. The "just-so story" critique targets this moralizing causality: it assumes collapse was inevitable once a specific taboo was broken, ignoring material conditions.

  4. Does the conclusion follow?
  The conclusion that "institutions don't matter, norms do everything" does not logically follow from the premises, even if the premises were accurate. It presents a false dichotomy. Institutions encode norms; they aren't separate. When norms evaporate, it is often because institutions no longer serve the interests of powerful actors. The Roman case proves that norms are fragile without institutional enforcement mechanisms that adapt to changing conditions.
  Furthermore, applying this to modern republics is risky. Modern constitutions are written precisely to survive normative breaches. The Roman lesson isn't that restraint is all that matters, but that constitutions must allow for peaceful change. If the Senate had legal pathways to pass land reform, Gracchus wouldn't have needed to break norms. The failure was institutional rigidity, not just normative decay. To say politicians must simply "choose to restrain themselves" ignores that restraint is usually a product of institutional constraints, not just virtue. The argument mistakes the symptom (norm breaking) for the cause (institutional failure to adapt). Therefore, the lesson is incomplete: norms matter, but only within institutions capable of channeling conflict.

  5. Verdict, plus the better one-paragraph version of the argument
  Verdict: Your friend is right to call it a "just-so story." It offers a morally satisfying narrative of fall from grace while ignoring structural economics and outdated military history. It lets the oligarchy off the hook by blaming the reformer.
  Better Version: The Roman Republic fell not because one man broke a taboo, but because a city-state constitution could not manage an empire. Norms of restraint held while stakes were low, but imperial wealth and veteran land needs created incentives too strong for custom to contain. When institutions blocked necessary reforms, actors bypassed them, eroding trust. The army didn't become private because of recruitment rules, but because the state failed to reward service. The lesson isn't that norms alone save republics, but that institutions must adapt to material realities. When constitutions prevent peaceful change, violence becomes the only update mechanism. Restraint matters, but only if the system rewards it.
