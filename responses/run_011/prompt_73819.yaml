  There is another rule he lived by, which binds us here tonight. It is the idea that a rule affecting others is unjust if it cannot survive being stated openly. A secret reservation for a future war voids the peace treaty. A hidden meaning voids a friendship. So I want to be clear about what I am saying, and what I am not. I am not saying he was perfect. I am saying he was precise. I am not saying he won every argument. I am saying he ensured the arguments were worth having. When he corrected your language, it was not to shame you. It was to ensure that what you said was what you meant, and that you could stand by it in the light. He treated words as binding commitments, not disposable currency.

