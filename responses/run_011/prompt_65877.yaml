answer: |-
  The proposed restriction of the knowability principle to epistemically inert truths fails to salvage anti-realism because it renders the principle ad hoc, epistemically inaccessible, and philosophically toothless. While the maneuver technically blocks the formal derivation of Fitch's paradox, it does so by sacrificing the very commitments that make anti-realism a distinct and viable philosophical position. The repair succeeds only by retreating into a triviality that a realist could accept, thereby dissolving the anti-realist challenge rather than resolving it.

  To understand why the repair fails, one must first acknowledge that it does successfully block the paradoxical derivation. Fitch's proof relies on the instance where $p$ is the conjunction "$p$ is true and $p$ is unknown" ($p \land \neg Kp$). If the unrestricted knowability principle applies to this conjunction, it leads to a contradiction: knowing the conjunction entails knowing $p$, which falsifies the second conjunct. Under the proposed repair, however, this conjunction is explicitly excluded because it is not epistemically inert. The truth of "$p$ is true and unknown" is wholly affected by anyone coming to know it; knowing it renders it false. Since the restricted principle applies only to truths whose truth values are stable under observation, the inference cannot begin, and the contradiction is avoided.

  However, blocking the proof is not equivalent to solving the problem, and the exclusion of the Fitch conjunction is merely convenient rather than principled. The anti-realist motivation for the knowability principle is typically that truth is metaphysically constrained by the possibility of verification; truth cannot outstrip evidence. By restricting this constraint to "inert" truths, the anti-realist admits that there is a class of truths—those sensitive to knowledge—whose relationship to verification is unconstrained. There is no independent philosophical reason to believe that the link between truth and knowledge should vanish precisely for those propositions involving knowledge operators. The restriction appears designed solely to carve out a safe space for the Fitch conjunction, functioning as an ad hoc immunization strategy rather than a substantive refinement of the theory of truth.

  Furthermore, the restriction introduces a severe epistemic opacity regarding the specification of "inertness." To apply the restricted principle, one must be able to sort truths into those that are inert and those that are not. Yet, determining whether a truth is epistemically inert requires evaluating counterfactuals about knowledge: "If this truth were known, would it remain true?" For many propositions, answering this question covertly appeals to knowability itself. If we cannot determine whether a proposition is knowable without first knowing whether it is inert, and we cannot determine whether it is inert without knowing how knowledge would affect it, the criterion becomes circular or inaccessible. We cannot use the principle to guide inquiry if we cannot identify its domain of application without already possessing the modal knowledge the principle is supposed to ground.

  Finally, what survives of anti-realism after this narrowing is too weak to distinguish itself from realism. The core anti-realist assertion is that truth is essentially epistemic; there are no verification-transcendent truths. By conceding that non-inert truths fall outside the scope of the knowability principle, the anti-realist effectively admits that some truths may be verification-transcendent. A realist can readily agree that stable, inert facts are knowable in principle while maintaining that other truths (perhaps about the distant past or counterfactuals) are not. Consequently, the restricted thesis loses its critical bite. It no longer challenges the realist conception of truth but merely offers a modest claim about a subset of propositions that realists already accept as discoverable. The repair saves the letter of the knowability principle by killing its spirit, leaving behind a view that collapses into a modest realism rather than sustaining a robust anti-realism.
