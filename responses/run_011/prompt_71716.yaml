answer: |-
  Is it incoherent? No. It is a stable position in the logical space, provided you are willing to sever the tight link between knowledge and assertion. However, it is *precarious*. Its stability rests entirely on how you handle the Knowledge Norm of Assertion (KNA). If you try to keep KNA, your view collapses into standard pragmatic encroachment immediately. If you drop KNA, you face a significant explanatory deficit regarding why we use knowledge language to challenge assertions.

  Here is the conceptual geography you asked for.

  ### 1. Taxonomy: Encroachment, Contextualism, or Third Thing?

  To classify this, we need to distinguish between the *target* of the stakes-sensitivity and the *mechanism* of that sensitivity.

  *   **Pragmatic Encroachment (PE):** Stakes affect the **truth conditions** (or metaphysical status) of the knowledge state itself.
      *   *Stakes-work:* Determines whether $S$ knows.
      *   *Context-work:* Irrelevant (usually invariantist about 'knows', though stakes vary by context).
      *   *Formula:* $Knowledge = f(Evidence, Stakes)$.
  *   **Epistemic Contextualism (EC):** Stakes (via conversational context) affect the **semantic content** of 'knows'.
      *   *Stakes-work:* Determines the standard denoted by 'knows'.
      *   *Context-work:* The ascriber's context sets the standard.
      *   *Formula:* $Knowledge = f(Evidence, Ascriber Context)$.
  *   **Your View (Assertoric Encroachment):** Stakes affect the **propriety conditions** of the speech act, leaving the knowledge state invariant.
      *   *Stakes-work:* Determines whether assertion is permitted.
      *   *Context-work:* The practical context of the *audience/consequences* sets the bar for assertion.
      *   *Formula:* $Knowledge = f(Evidence)$; $Assertoric Propriety = f(Evidence, Stakes)$.

  **Verdict:** This is a **Third Thing** relative to the standard knowledge debate, but it is a species of **Pragmatic Encroachment applied to Action/Assertion** rather than Knowledge.

  It is not PE about knowledge because you explicitly deny that the subject's epistemic position changes with stakes. It is not EC because you deny that the word 'knows' shifts its semantic value. You are proposing **Knowledge Invariantism** coupled with **Pragmatic Variabilism about Assertion**.

  To count as PE, a view must make knowledge itself sensitive to practical factors. You are insulating knowledge from that. To count as EC, a view must make the semantics of 'knows' context-sensitive. You are insulating semantics from that. You are locating the variability in the *bridge principles* connecting epistemic states to public speech.

  ### 2. Objections and the Knowledge Norm

  You are right to worry about the "back door." This is the critical pressure point.

  **The Transferable Objections:**
  *   **The Instability Charge:** PE is accused of making knowledge too volatile (changing with interest rates). You deflect this for *knowledge*, but you inherit it for *assertion*. On your view, whether a doctor is permitted to speak changes with the family's anxiety levels. This makes *communicative license* unstable, which is a cost, though perhaps a lesser one than making *mental states* unstable.
  *   **The Disagreement Data:** EC is accused of failing to explain genuine disagreement (if standards shift, we aren't contradicting each other). Your view handles this better than EC. If two people argue "You know" vs "You don't know," you can say one is talking about the mental state (invariant) and the other about the propriety of acting on it. However, you still have to explain why ordinary speakers conflate the two so thoroughly.

  **The Objection That Gets Worse: The Moorean Tension.**
  Standard PE resolves the tension of "I know, but it's risky to act" by saying "You don't know." EC resolves it by saying "In this context, 'know' means something stronger."
  Your view forces you to endorse the sentence: **"I know the prognosis is terminal, but I am not in a position to assert it."**
  While logically consistent, this creates a phenomenological disconnect. In high-stakes scenarios, speakers feel epistemically deficient, not just pragmatically restrained. They feel they *lack* something cognitive. By locating the deficit entirely in the norm of assertion, you attribute a systematic error to our introspective access to our own epistemic states. We feel like we don't know; you say we do know but must stay silent. This makes the view phenomenologically revisionist.

  **The KNA Collapse and the Alternative Norm:**
  If you maintain the Knowledge Norm of Assertion ("Assert $p$ only if you know $p$"), your view collapses.
  1.  Assert $p$ only if you know $p$ (KNA).
  2.  Assert $p$ only if stakes are low enough (Your View).
  3.  Therefore: Know $p$ only if stakes are low enough (Standard PE).

  To avoid this, you **must reject KNA**. You cannot hold that knowledge is the necessary and sufficient condition for proper assertion.

  **What norm replaces it?**
  You need a **Sufficient Warrant Norm** or an **Adequacy Norm**: "Assert $p$ only if your epistemic position is *adequate for the practical purposes at hand*."
  On this norm, knowledge is typically *sufficient* for assertion in low-stakes contexts, but in high-stakes contexts, knowledge might be *insufficient* (you need certainty, or independent verification), or conversely (in emergency low-stakes), something less than knowledge might suffice.

  **The Cost:**
  The attraction of KNA was its explanatory unity: it explained why "You don't know" is the standard challenge to assertion. If you switch to an Adequacy Norm, you lose that neat explanation. You must argue that "You don't know" is a loose way of saying "Your position isn't adequate for these stakes." This adds a layer of pragmatic complexity to every knowledge attribution in practical contexts. You save the metaphysics of knowledge but complicate the pragmatics of language significantly.

  ### 3. The Doctor Case: Whose Stakes?

  This is where the view faces its sharpest dilemma. You have three options for whose stakes govern the assertoric propriety:

  1.  **Speaker Stakes (The Doctor):** She has low stakes (no liability).
      *   *Prediction:* She can assert.
      *   *Problem:* This contradicts your intuition for the case. You want to say she shouldn't assert to the family. So this horn is dead for your specific motivation.
  2.  **Subject Stakes (The Patient):** The patient's life is at risk.
      *   *Prediction:* She cannot assert.
      *   *Problem:* This aligns with your intuition, but it creates a disconnect between the speaker's rationality and the norm. The doctor might not know the patient's specific vulnerability.
  3.  **Audience/Consequential Stakes (The Family):** The family's decision-making depends on this.
      *   *Prediction:* She cannot assert.
      *   *Problem:* This is the horn you must pick to make the Doctor case work.

  **The Parallel to Indexicalism:**
  In Contextualism, the "Ascriber's Context" determines the standard. In your view, the "Audience's Context" determines the assertoric norm. This makes your view structurally isomorphic to Contextualism, but shifted from semantics to norms.

  **The Horn You Cannot Afford:**
  You cannot afford **Speaker Stakes**. If you say the norm depends on the speaker's stakes, the Doctor case dissolves (she has low stakes, so she asserts), and you lose the motivation for the view (explaining why high-stakes situations inhibit speech even for well-evidenced subjects).

  **The Dangerous Cost of Audience Stakes:**
  By tying the norm to the Audience/Family stakes, you make the norm of assertion **externalist** in a way that threatens the "Ought Implies Can" principle for rational agents.
  *   *The Problem:* The doctor cannot always access the family's stakes. They might be hiding their anxiety; they might be irrational gamblers; they might be planning to sue regardless.
  *   *The Consequence:* If the norm depends on facts external to the speaker's perspective, the speaker can be in violation of the norm *blamelessly*.
  *   *The Commitment:* You are committed to saying the doctor is *improper* in asserting, even if she reasonably believes the stakes are low.
  *   *The Risk:* This makes the norm of assertion useless as a guide for action. A norm that an agent cannot track is a poor norm for regulating speech.

  **Comparison to the Knowledge Debate:**
  This mirrors the "New Contextualism" vs. "Subject-Sensitive Invariantism" split. Contextualism makes knowledge depend on the ascriber (hard for the subject to track). PE makes knowledge depend on the subject (easy to track).
  Your view makes *assertion* depend on the audience (hard to track).
  To save the view, you must argue that speakers are generally expected to accommodate audience stakes, and failure to do so is a breach of conversational contract, even if epistemically blameless. But this moves the view away from *epistemic* norms toward *ethical* or *conversational* norms.

  **Summary Recommendation:**
  Your view is coherent only if you:
  1.  Explicitly reject the Knowledge Norm of Assertion.
  2.  Accept that "I know but can't say" is a genuine, non-paradoxical state.
  3.  Accept that assertoric propriety is often unknowable to the speaker (Audience Stakes).

  If you are unwilling to make assertion norms unknowable to the speaker, you must retreat to Speaker Stakes, which kills the Doctor case. If you are unwilling to reject KNA, you collapse into Pragmatic Encroachment about knowledge. The "Third Thing" status survives only in that narrow gap.
