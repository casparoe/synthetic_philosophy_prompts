  (a) Brainstorming Joints

  Before settling on a diagnosis, I will list every point in the chain where pressure could be applied, treating the argument as a mechanical structure to be tested.

  *   **The Stipulation of "Closed":** The definition fixes "closed" to a descriptive claim about predictability given fixed parameters. One could press whether a normative concept like consent can be governed by a purely descriptive stipulation. If the stipulation captures only causal fixation, it may miss the normative dimension of "freedom" required for consent.
  *   **Step (1) "Not the agent's own":** This premise links openness to ownership of the choice. One could press whether causal determination (the stipulated sense of closed) actually negates ownership. Does "owning" a choice require indeterminism, or only that the choice flows from one's own psychology?
  *   **Step (1) "Cannot authorize anything":** This links ownership to normative power. One could press whether authorization requires metaphysical freedom or only social recognition of the agent's will.
  *   **Step (2) Source Irrelevance:** This claims closure by illness is the same as closure by proposal. One could press whether the *source* of the constraint matters morally. A constraint imposed by a coercer might invalidate consent in a way a constraint imposed by nature does not, even if the resulting option set is identical.
  *   **Step (3) Universal Closure:** This claims every option set is closed. One could press the truth of this metaphysical claim. If agents can sometimes do otherwise, (3) is false. However, the user wishes to keep this.
  *   **Step (4) The Inference:** This moves from "no consent from open set" to "no consent valid." This is valid if (1) and (3) hold. The pressure here is on the terms matching.
  *   **Step (5) Extraction and Impermissibility:** This links invalid consent to impermissibility via extraction. One could press whether an extractive transaction is impermissible *solely* because consent is invalid, or whether extraction itself is the wrong. Also, are *all* real transactions extractive?
  *   **Step (6) Normative Work:** This claims consent does no work if never valid. One could press whether a concept can do work as an ideal or counterfactual benchmark even if never fully satisfied in practice.
  *   **Step (7) Retirement:** This claims unsatisfied concepts should be retired. One could press whether regulative ideals (like perfect justice) should be retired because they are never fully realized.
  *   **The Equivocation:** The most significant joint is the silent shift between the *stipulated* sense of "closed" (descriptive predictability) and the *normative* sense of "closed" (coercion/duress) required to make (1) plausible. The argument relies on these being the same without arguing for it.

  (b) Invalidating Conditions

  The argument invokes **coercion**, but it expands the concept beyond its standard usage.

  *   **Deception:** The argument does not invoke deception. Beliefs are held fixed in the stipulation of "closed," but there is no claim that these beliefs are false or manipulated. The argument does not need deception to reach its conclusion; it relies entirely on the structure of the option set, not the content of the agent's mind.
  *   **Incompetence:** The argument does not invoke incompetence. The agent's psychology is held fixed, but there is no claim that the psychology is impaired, irrational, or undeveloped. The argument treats a fully competent psychological mechanism as sufficient to close the option set via determinism. It does not need incompetence to function.
  *   **Coercion:** The argument invokes coercion at **Step (1)** and **Step (2)**. The intuition behind (1)—that a choice fixed by external forces is not the agent's own—is the core intuition of coercion or duress. However, the argument generalizes this. Standard coercion requires a coercer who threatens to worsen the agent's situation. Here, the "coercion" is merely causal determination (Step 3). The argument cannot get where it wants without invoking this expanded notion of coercion. It tries to collapse the distinction between "coerced by a person" and "determined by causes." If it restricted itself to standard coercion (proposals that threaten), it could not reach Step (3), because not all agents are coerced in that sense. To reach the universal conclusion (4), it must treat all causal determination as coercive closure.

  (c) The Single Step to Reject

  I would reject **Step (2)**.

  **Why it looked acceptable:** Step (2) appears plausible because it follows naturally from the stipulation. The stipulation defines "closed" descriptively: holding fixed resources, beliefs, desires, etc., is there exactly one option the agent will take? Under this descriptive definition, it does not matter *what* caused the fixation. Whether it was illness, poverty, or a proposal, if the outcome is determined, the set is "closed" in the stipulated sense. Step (2) simply affirms this descriptive uniformity. It reads as a logical consequence of the definition provided.

  **What reading the argument needs:** For the argument to succeed in generating the radical conclusion (4) and (5), Step (2) must be read normatively. It must assert that a set closed by illness is closed *in the morally relevant way* to exactly the same degree as a set closed by a coercive proposal. The argument needs Step (2) to bridge the gap between the descriptive truth of (3) (we are causally determined) and the normative requirement of (1) (consent requires freedom). It needs Step (2) to claim that causal determination is morally equivalent to coercive constraint.

  **How the argument gets from one to the other:** The argument exploits the ambiguity of the word "closed." In Step (3), "closed" is used in the stipulated, descriptive sense (causal fixation), which makes the premise likely true. In Step (1), "open" is used in a normative sense (autonomy/freedom from coercion), which makes the premise intuitively plausible. Step (2) asserts that these are "exactly the same way." This allows the truth of (3) to trigger the prohibition in (1). By rejecting (2), I deny that descriptive closure (causal determination) is the same *normative* closure as coercive constraint. I can accept that every set is descriptively closed (3) and that consent requires normative openness (1), without concluding that no consent is valid, because descriptive closure does not entail normative closure.

  (d) Runner-Up Diagnoses

  Given your preference to keep (1) and (3), here are three alternative diagnoses ranked by cost:

  1.  **Reject Step (3):** Deny that every agent's option set is closed.
      *   **Cost:** This requires denying determinism or asserting that human psychology is not fixed by history and circumstances. You lose the metaphysical comfort of the stipulation. You must commit to a libertarian view of free will where agents can sometimes do otherwise even holding fixed all prior causes. This is a high metaphysical price.
  2.  **Reject Step (1):** Deny that consent requires an open option set.
      *   **Cost:** This requires abandoning the intuition that brought you to the topic: that a choice wholly fixed by forces external to the agent is not hers. You lose the core normative insight that agency requires some form of freedom. Consent becomes a mere formality, disconnected from the agent's actual control.
  3.  **Reject Step (7):** Keep the concept of consent even if it is never satisfied.
      *   **Cost:** This accepts the nihilism of (4) and (5) (no consent is valid) but refuses to retire the term. You lose practical clarity. You must treat "consent" as a regulative ideal that never actually occurs, which makes it useless for guiding actual medical or legal decisions. It creates a gap between the theory (no consent exists) and practice (we act as if it does).

  (e) The Narrow Conclusion

  Under my preferred fix (rejecting Step 2), the narrow conclusion **survives**.

  Your classmate can still hold that payment targeted at the desperately poor fails to yield valid consent. By rejecting (2), we distinguish between *descriptive closure* (which is universal) and *normative closure* (which depends on the source). We can argue that while all choices are causally determined (preserving 3), only choices determined by *exploitative constraints* are normatively closed (preserving 1).

  The work in the classmate's claim is no longer done by the mere fact that the option set is closed (since all are). Instead, the work is done by the **extractive nature of the proposal** combined with the **background injustice**. If the proposal takes advantage of a constraint (poverty) that the proposer did not create but exploits to gain more than they would from an unconstrained counterparty, that specific transaction creates a *normative* closure that invalidates consent. Universal causal determination does not invalidate consent; exploitative constraint does. This saves the classmate's specific worry about Phase I trials without collapsing into the universal nihilism of Step (4).

  (f) Step (6) and Normative Work

  **Is (6) independent?** Step (6) is not doing independent work; it is a restatement of the consequences of (4) and (5). If (4) is true (no consent is valid) and (5) is true (acts requiring authorization are impermissible without valid consent), then it follows logically that consent never alters permissions. If consent never validates an act, it never changes an act from impermissible to permissible. Therefore, it does no normative work. Step (6) merely draws out the implication of the previous steps.

  **Can an unsatisfied concept do work?** Yes, a concept that is never satisfied can nonetheless do normative work, which suggests Step (7) is false even if (6) were true. Concepts can function as **regulative ideals**. For example, if "perfect justice" is never satisfied, the concept still guides legislation and judgment. Similarly, "valid consent" could serve as a benchmark. We might say a transaction is *more* permissible the closer it approximates the ideal of open consent, even if the ideal is never fully reached. It can also work **counterfactually**: we might ask whether the agent *would* have consented under better conditions. Therefore, even if the argument proved consent is never fully valid, retiring the concept (7) would be a mistake because the concept organizes our moral reasoning about degrees of permissibility and exploitation.

  Verdict: reject step (2) — conflates descriptive and normative closure
