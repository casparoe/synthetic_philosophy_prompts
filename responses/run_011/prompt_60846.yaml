      *Self-Correction on Data:* The prompt says "model isn't trained on individual user's own answers." The bias is that the survey asks "was that the right call" *after* a hold. If no hold happened, would they say it was the right call to spend? We don't know. So the condition needs to be measuring regret on *allowed* transactions that looked like holds.

