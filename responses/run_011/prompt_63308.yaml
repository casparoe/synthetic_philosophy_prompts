  **MEMORANDUM**

  **TO:** Field-Standards Board
  **FROM:** [Your Name], Chair
  **DATE:** [Current Date]
  **SUBJECT:** Vote on Handbook Revision: Rigidity vs. Calibrated Transparency

  **RECOMMENDATION**
  We are voting in three weeks. The choice is not between order and chaos. It is between hidden risk and managed risk. I recommend we **reject the Director's proposal** (zero variation) and **approve my proposal** (Core Rules + Calibrated Deviations) subject to the safeguards listed below. If the Board prefers, we may vote to approve my proposal with named changes, or reject both.

  **THE PROBLEM**
  Last year, two stations faced identical paperwork errors. Station 1 followed the handbook exactly. The result was a ministry audit that suspended a community's income for eleven months. Station 2 fixed the error locally and said nothing. The result was stable community relations, but a hidden breach of contract discovered only by chance.

  The Director's solution is stricter enforcement. My view is that Station 1 failed because the rule ignored local consequence, and Station 2 failed because the solution was invisible. A rule that forces harm is broken. A rule that is broken in secret cannot be learned from.

  **THE PROPOSAL: CORE AND CALIBRATED**
  I propose splitting the handbook into two sections.
  1.  **The Core:** Consent, safety, data integrity, and financial probity. These are untouchable.
  2.  **The Calibrated Layer:** Procedural requirements (permitting timelines, reporting formats, local engagement protocols). Stations may deviate from these up to a capped percentage per year.

  **Criterion for the Core:** The dividing line is **irreversibility**. If money is lost, consent violated, safety compromised, or data corrupted, you cannot log it later and fix it. The harm is done. Procedural errors, by contrast, are often remediable. We should not treat a late signature the same as a forged one.

  **The Mechanism:** Any deviation from the Calibrated Layer must be logged in an open register within 72 hours. The entry must state the reason and the *expected cost of being wrong*. Deviations lapse after 18 months unless reauthorized.

  **THE OBJECTION**
  Our board member with legal expertise has raised a valid objection: A rule you are permitted to break is merely a suggestion. Worse, in hierarchical teams, the burden of logging a deviation often falls on junior local staff, while the decision to deviate was made by senior management. In high-liability legal environments, this exposes the most vulnerable staff to risk.

  She is right. If we adopt this without protection, we export risk to juniors. To mitigate this, my proposal requires that **every deviation entry be signed off by the Station Manager**, not the junior staffer. The register records who authorized the risk, not just who noticed it. This does not solve the power imbalance entirely, but it moves accountability to where decision-making power actually sits. If this safeguard proves insufficient during the pilot, the proposal fails.

  **THE PILOT**
  We cannot theorize this forever. I propose an 18-month pilot starting 1 July 2024, ending 31 December 2025.

  **Falsifiability:** I have spent 34 years arguing about what counts as evidence. Here is the threshold where I will drop this proposal myself:
  1.  If any deviation logged in the register results in legal action against a junior staffer that does not also implicate the signing Manager.
  2.  If the rate of "unexpected costs" (where the estimated cost of being wrong was significantly lower than the actual outcome) exceeds 10% of logged deviations.
  3.  If community trust metrics (measured by our annual survey) decline in pilot stations compared to non-pilot stations.

  If any of these occur, we revert to the Director's model immediately.

  **STATION 2 MANAGER**
  Regarding the manager who hid the error last year: We cannot judge past conduct by future rules. They breached the existing handbook. However, their intent was to protect community income, and no irreversible harm occurred. I propose we record the incident as a procedural failure but take no punitive action. We will not promote this manager based on community metrics achieved during the breach, nor will we discipline them. We will use the case as a training example: the outcome was acceptable, the method was not. Under the new proposal, this would have been a logged deviation, not a secret.

  **CONCLUSION**
  The Director's model assumes compliance equals safety. The incidents last year prove otherwise. My model assumes transparency equals safety. It carries risk, specifically regarding staff hierarchy, but that risk is visible and manageable. Hidden risk is not.

  Please review the attached draft handbook sections. I am available to discuss the safeguards regarding junior staff before the vote.

  [End of Memo]
