answer: |-
  1. **Desiderata for Operational Theory**

  1.  **The Coordination Necessity Test**
      *   **Demand:** The theory must distinguish schemes where compliance is functionally required for the benefit to exist from mere aggregates of behaviour.
      *   **Cases:** A (Bus queue), C (3am Red Light), D (Midday Red Light).
      *   **Status:** Non-negotiable.
      *   **Cost of Dropping:** Without this, the theory cannot distinguish between a queue (Case A) and a crowd standing near a bus stop (Case B). It would morally obligate agents to comply with patterns that have no cooperative value, turning mere habit into duty. You lose the ability to tell officers when a rule is safety-critical versus when it is cosmetic.

  2.  **The Vestigial Exit Clause**
      *   **Demand:** The theory must provide a mechanism for obligation to dissolve when the convention's function dies, even if the behaviour persists.
      *   **Cases:** I (Workplace address), E-part1 (Tipping where service included).
      *   **Status:** Non-negotiable.
      *   **Cost of Dropping:** If dropped, the theory enforces zombie norms. Council officers would be forced to uphold practices everyone acknowledges as obsolete (Case I), creating friction without purpose. It renders the framework conservative by default, privileging history over current utility.

  3.  **The Visitor Gradient**
      *   **Demand:** The theory must scale moral pressure based on the agent's integration into the community, distinguishing transient presence from membership.
      *   **Cases:** E (Visitor tipping), G (Long-term resident), J (Locals vs. Visitors jaywalking).
      *   **Status:** Taste (Communitarian vs. Liberal).
      *   **Cost of Dropping:** If you insist on binary membership, you either trap tourists in local codes they cannot know (Case E) or let long-term residents opt out of civic duties (Case G). If you ignore membership entirely, you lose the nuance required for community organising. This is where political ideology enters the spec.

  4.  **The Harm Locator**
      *   **Demand:** The theory must require a breach to produce a specific, identifiable cost to a person or the system, not just a violation of abstract order.
      *   **Cases:** B (Empty queue), F (Clinic queue).
      *   **Status:** Non-negotiable for operability.
      *   **Cost of Dropping:** Without locatable harm, any breach becomes a moral failure simply because it broke a rule. Officers cannot adjudicate Case B (no wait) versus Case A (wait) without assessing cost. Dropping this turns the framework into a compliance checklist rather than a tool for assessing public good.

  5.  **The Signalling Weight**
      *   **Demand:** The theory must account for expressive harm where no physical cost occurs, but social meaning is damaged.
      *   **Cases:** E (Tipping as verdict), H (Norm entrepreneurs).
      *   **Status:** Taste (Expressivists vs. Materialists).
      *   **Cost of Dropping:** If dropped, the theory cannot explain why Case E (tipping) feels binding even when service is included. It fails to capture the social reality of public realms where meaning is currency. However, insisting on it risks moralising mere offence.

  6.  **The Official Priority Rule**
      *   **Demand:** When codified rules conflict with informal norms, the theory must prioritize the codified rule for enforcement purposes.
      *   **Cases:** F (Clinic queue nepotism).
      *   **Status:** Non-negotiable for council work.
      *   **Cost of Dropping:** If informal norms (greeting the receptionist) override official rules (first-come), the council exposes itself to liability and accusations of bias. It makes the public realm unmanageable for officers who must enforce written policy.

  2. **Distinctions Not to Collapse**

  You provided four essential distinctions: wronging someone versus doing wrong; having a reason versus having an obligation; the conditions for a norm's existing versus the conditions for its binding *you*; and the convention's being a bad convention versus a breach of it being a wrong. To these, add the following three to ensure operational clarity.

  First, **Expectation versus Reliance**. People often expect others to comply (Case C, 3am light), but reliance implies planning based on that compliance. A theory that collapses these cannot distinguish between being annoyed by a jaywalker and having your journey disrupted by one.

  Second, **Systemic Validity versus Transactional Harm**. A norm might be good for the system overall (queues prevent chaos) but cause no harm in a specific transaction (Case B, empty station). Collapsing these forces officers to punish harmless breaches because the rule is generally good, which undermines public trust.

  Third, **Compliance Motivation versus Norm Validity**. Why an agent complies (fear, habit, morality) is distinct from whether the norm binds them. If you collapse these, you let psychopathic agents off the hook because they lack moral motivation, or you bind agents who comply only out of fear. The theory must judge the norm, not the psychology.

  3. **Joint Unsatisfiability**

  You suspected the trio of *content fixed locally*, *grounding in a locatable cost*, and *the agent's own judgement kept out* cannot all stand. You are correct. If content is fixed locally, the definition of "cost" depends on local interpretation (e.g., offence counts as harm in some communities, not others). If the agent's judgement is kept out, cost must be objective. But local norms often define harm subjectively. Therefore, you cannot have objective cost assessment of locally defined norms without invoking the community's or agent's judgement on what counts as a cost. One must yield.

  4. **The Field-Clearing Requirement**

  The single requirement that clears the field fastest is **The Harm Locator**. Insisting that a breach must produce a locatable cost eliminates most expressive and signalling theories immediately. They struggle to quantify "disrespect" or "social friction" as a cost anyone can point to in a workshop. It forces the room to deal in concrete impacts: delays, safety risks, financial loss.

  However, you might not want to insist on it. In public realms, social cohesion is a resource. Case E (tipping) and Case J (locals vs. visitors) show that breaches can damage the social fabric without causing immediate, locatable harm to a specific individual. If you demand a receipt for every wrong, you may license behaviour that erodes trust over time. It makes the theory robust but potentially blind to slow-burn social decay.

  5. **Family Scoring**

  **Ground it in Harm and Cost:** This family scores highly on operability. It handles Cases A, B, and C cleanly by asking "who lost what?" It fails on Cases E and H, where the harm is purely expressive. It will tell your officers that tipping nothing is fine if the staff are salaried, ignoring the social signal sent.

  **Ground it in Fair Play and Benefits:** This family handles Cases A, G, and F well by focusing on free-riding. It struggles with Case B (no benefit received) and Case I (vestigial norms). It risks obligating visitors who receive no benefit from the local scheme, or letting residents off who benefit but reject the scheme.

  **Ground it in Expression:** This family dominates Cases E, H, and J by treating breach as communication. It collapses on Cases C and B, where no audience exists to receive the signal. It risks moralising every breach as an insult, making adjudication highly subjective and difficult for officers under time pressure.
