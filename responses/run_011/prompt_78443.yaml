answer: |-
  Thank you for having me back. It is good to see the room full. I see my daughter in the second row. She builds large learning systems now. She knows more about the new tools than I ever will. I see the Dean, too. He knows the hard work of updating a curriculum to match a changing world. I am just here to talk about breaking things.

  I spent forty years at the national lab. My job was fracture and fatigue. Mostly ceramics. Some metals. I did not build bridges. I did not fly planes. I took pieces of them into a basement and broke them on purpose. We wanted to know where the limit was. We wanted to know why things snapped.

  When you test brittle materials, you learn quickly that averages are liars.

  We kept a plot on the lab wall. A Weibull plot. You take nominally identical specimens. You bend them until they break. You record the strength. You plot the data. The points scatter. They always scatter. You can calculate a mean strength. It is a perfectly respectable number. It tells you nothing whatsoever about the one specimen that is going to kill somebody.

  In a brittle material, the whole thing is governed by the largest flaw present. You never get to meet the average. You only meet the weakest link.

  [Pause]

  This creates a choice. Every engineer faces it. You can design so that the structure is very unlikely to fail inside its service life. You carry a fat scatter factor. You test your way to confidence in the mean. This is safe-life design. You assume the part is perfect until it isn't.

  Or you can assume the crack is already in there. You design so no single crack can take the aircraft apart. You build in redundancy. You go look for the damage on a schedule. This is fail-safe design.

  These are different philosophies. They have different price tags. The second one is not automatically the virtuous one. It buys you something else. It buys you time. It buys you a chance to find the trouble before the trouble finds you. But it costs more. It weighs more. Worst-case design is so expensive that sometimes the thing never gets built. Or it gets built too heavy to fly. Most good engineering is deliberately average-case. Because we have to fly.

  History teaches this the hard way.

  Consider the de Havilland Comet. It was the first commercial jet airliner. It went into service in 1952. It was a marvel. Within about a year, three were lost in mid-air. Two were traced to structural failure from metal fatigue. This was not well understood at the time.

  The trouble concentrated at the corners of square cut-outs in the fuselage. The windows. An antenna opening. Stress gathered there. Cracks grew. The pressure cycles pumped them open until the skin tore.

  The type was withdrawn from service. Test airframes were pressure-cycled until they failed. They recreated the loss in a tank of water. Afterwards, the industry moved. They moved toward designs that tolerate damage and get inspected. They moved away from designs certified never to crack. They stopped promising perfection. They started planning for the flaw.

  My old lab chief used to say that a design which fails late is not the same as a design which fails well. He said you buy the first one with money. You buy the second one only with thought.

  [Pause]

  I am retired now. I read philosophy at night. Badly, but happily. Lately, I read a lot of the writing about AI safety. I see the same argument living there. It is a live argument.

  Should you be satisfied with a system that behaves acceptably across the distribution of situations it will plausibly meet? Or should you insist there is no reachable situation in which it does something irreversible?

  This sounds like the engineer's choice. Safe-life versus fail-safe. Average-case versus worst-case.

  But you must be careful. Worst-case thinking is not the same as pessimism. Average-case thinking is not the same as carelessness. The safety writers sometimes skip this. They act as if only the worst-case matters. But if you design for every conceivable worst case, you freeze. Nothing moves. Nothing gets built.

  However, the cost structure is genuinely different here. In my field, if a beam fails, we have a fleet. We ground the planes. We fix the windows. We average over the population. In these new systems, some failures aren't recoverable. There is no fleet to average over. One unit. One chance.

  If the failure is irreversible, the average does not comfort you. The mean strength of the ceramic does not help the specimen that snapped first.

  [Pause]

  But I cannot paper over the disanalogy. I will not try.

  In engineering, somebody hands you the load envelope. You know the wind speed. You know the pressure differential. Failure has a definition. The wing is on the ground or it isn't.

  Neither of those is given in this case. Nobody can say what the envelope is. The system may be able to move itself outside whatever envelope you drew. And whether something counts as a failure is a value judgement. Reasonable people sitting in this auditorium disagree about it. My daughter might build a system that optimizes for a goal I do not understand. The Dean might teach a module that defines harm differently than I would.

  So the analogy breaks. You cannot simply transfer the certificate of airworthiness to a software model. The math does not hold.

  But something survives the disanalogy. I think the fail-safe half survives. Not the guarantee half.

  You stop promising no failure. You start constraining what failure is permitted to look like.

  If you cannot guarantee the system never leaves the envelope, you build walls so that leaving the envelope does not kill the passengers. If you cannot guarantee the output is always true, you build checks so that a false output does not trigger a irreversible action.

  This is not about fear. It is about architecture.

  The Dean has put a required ethics module into the curriculum. It is well meant. It is necessary. But a module is a safe-life measure. It assumes the student is certified ethical upon graduation. It assumes the training holds.

  I am suggesting you think about fail-safe careers.

  Assume you will make a mistake. Assume the model will drift. Assume the requirement you were given was incomplete. Design your work so that when—not if—the flaw appears, it does not take the whole structure down.

  This is not a warning that the future is dangerous. My discipline knew better than to deal in prophecies. We dealt in loads. We dealt with materials.

  I am telling you that uncertainty is the only constant. The Weibull plot always scatters. The mean is a lie we tell ourselves to sleep at night. The worst flaw is the one that matters.

  You are entering a profession where the materials are new. The loads are unknown. The definition of failure is contested. You will be tempted to design for the mean. It is cheaper. It is lighter. It allows you to ship.

  Sometimes that is the right choice. We need things that fly.

  But know the cost. Know that you are trading margin for performance. Know that if the cost of failure changes, your design philosophy must change with it.

  [Pause]

  My lab chief was right. You can buy a design that fails late. You can throw money at testing. You can add safety factors until the budget breaks.

  But to make something that fails well? That requires thought. It requires humility. It requires admitting that you do not know where the crack is hiding.

  You have spent four years learning how to build things that work. I am asking you to spend a little time learning how they break.

  Not because you are careless. But because you are engineers.

  The room is full of people who love you. They want you to succeed. They want you to be safe.

  I want you to be robust.

  Welcome to the profession.

  [Pause]

  ***

  **Where the analogy carries weight:**
  The analogy holds on the *cost structure of irreversibility* (one unit/one chance vs. fleet averaging). If the audience rejects this, the speech degrades to a generic platitude about "being careful," losing the specific engineering justification for why average-case design is sometimes insufficient without becoming Luddite.
