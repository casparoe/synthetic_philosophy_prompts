prompt: |-
  I help run a grad podcast in epistemology and next week's guest is a philosopher with a pretty specific take on the Meno problem: he thinks knowledge isn't better than mere true belief in any general or intrinsic way at all — the advantage only shows up where the agent is going to have to fall back on the belief again later, so the tethering-by-reasons move does all its work through reuse rather than through any standing value in knowledge itself. He's good and he's not a strawman: he'll happily say the Daedalus statues bit is just colourful talk about a disposition to be retained.

  Draft me eight or so questions that actually engage that view instead of letting him restate it. I want at least one on whether the dialogue's own example — getting someone to the right road to Larissa — is a bad case for him, since that's a one-off use; one on the flipside case, the true belief that stays put out of sheer habit or rote drilling and never gets tethered by reasons at all; one on whether stability-under-reuse just swallows the thing the swamping objection says reliability can't explain; and one on whether he's answering the harder question (why knowledge beats true belief plus whatever else you pile on short of knowledge) or quietly swapping it for an easier one. Give me a follow-up for each, keyed to the answer he's most likely to give, and finish with something that forces him to say what he'd give up. British English please.
