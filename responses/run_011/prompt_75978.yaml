answer: |-
  (a) **Ranked Defeaters**

  1.  **The Pluralistic Conflict Case (Fatal).** Consider a border market where two communities intermingle. Community A observes strict first-come-first-served queuing; Community B observes a loose clustering norm where calling out holds place. Both practices are visible and settled within their groups. You enter the shared space. Commitment 1 enrolls you in the space; Commitment 3 demands you follow the local practice. But there is no single local practice. You cannot queue and cluster simultaneously. This bites because it renders the obligation impossible to fulfill, violating 'ought implies can', or forces the view to arbitrarily privilege one group's norm, violating Commitment 3.
  2.  **The Odious Convention Case (Fatal).** A local custom dictates segregated seating or refusing service to a specific group. Commitment 5 admits a pro tanto obligation exists but is defeated by justice. The defeater here is the moral residue: the view implies you have *some* moral reason to comply with segregation, overridden only by weightier concerns. This bites because it grants moral weight to injustice, corroding the agent's integrity even if action is rightly refused.
  3.  **The Digital Enrollment Case (Awkward).** You are added to a professional messaging channel without consent. The implicit norm is immediate response, 24/7. You miss a message. Commitment 1 says you enrolled by being present in the digital space; Commitment 2 says you should have known. This is awkward because it moralizes trivial digital etiquette to the same degree as physical queueing, stretching the concept of 'shared social space' until it covers every online interaction.

  (b) **Defender's Responses and Costs**

  1.  **Conflict:** A committed defender must concede that where practices conflict, no obligation arises. **Cost:** This requires a new clause limiting Commitment 1: participation enrolls only where a *singular* practice dominates. This narrows the view's scope significantly in modern, pluralistic environments, retreating from the bold claim that presence alone binds.
  2.  **Odious:** The defender explains this away via Commitment 5: the obligation is real but decisively defeated. **Cost:** This requires a substantive content-filter to identify which conventions are 'odious' enough to be defeated. If the filter is independent (e.g., human rights), the view relies on external morality; if internal, it risks circularity.
  3.  **Digital:** The defender argues Accessibility (Commitment 2) fails unless norms are explicitly stated. **Cost:** This narrows Commitment 2, requiring explicit notification for digital norms while retaining implicit visibility for physical ones. This creates an asymmetry that demands justification: why does digital presence differ from physical presence regarding enrollment?

  (c) **Predictions and Empirical Profiles**

  The view predicts that agents judge unobserved violations (crossing at 3 AM) as morally wrong, whereas reliance accounts predict indifference. It further predicts children will distinguish convention-violations from moral-violations based on the presence of a coordinating practice, not authority.

  If empirical study shows that people consistently judge unobserved convention-violations as *imprudent* rather than *wrong*, this is a genuine defeater. The view grounds obligation in the practice itself, but if the participants in that practice do not recognize the norm as moral, the 'shared social space' lacks the normative texture the view requires. It would not be merely a different question; it would show the view misidentifies the phenomenology of the obligation it claims to describe. However, if the view is purely normative (prescribing how people *should* judge), folk error is permissible. Given the view's reliance on 'shared social space' as the ground, however, the participants' understanding is constitutive. A robust separation where folk see only prudence would erode the ground of participation.

  (d) **Assessment of Anxieties and New Worry**

  **Anxiety 1 (Odious):** This is not fatal. A pro tanto structure logically permits overriding obligations. The repellant residue is a theoretical cost, not a contradiction. You can remove the residue only by adopting a content-filter (conventions must be just to bind), but this collapses the view into a form of natural law, abandoning the idea that convention itself generates obligation.

  **Anxiety 2 (Conflict):** This is more dangerous. If participation enrolls you in conflicting practices, Commitment 3 cannot fix content. This threatens the action-guiding capacity of the view. It is fatal unless the view accepts that some social spaces generate no obligations, which significantly reduces its explanatory power.

  **New Worry (Exit Costs):** You have failed to worry about the voluntariness of participation. If walking on a pavement enrolls you in queueing norms, but avoiding the pavement is impossible for daily life, participation is coerced. If obligation requires some baseline of voluntariness, Commitment 1 is false. If obligation does not, the view binds agents to norms they could not possibly avoid, making morality overly demanding and potentially unjust.

  (e) **Assessment of Insulation**

  The view is at high risk of insulation. Between Accessibility and Defeasibility, almost any counterexample can be redescribed: the agent couldn't know (Accessibility), or the reason was weighty enough (Defeasibility). This is a defect if the criteria for 'reasonable expectation' and 'comparable weight' are not independently specified. A normative theory of conventions must be permissive, but if it absorbs all friction via escape clauses, it becomes vacuous. The line falls at the definition of 'settled practice'. If 'practice' is defined loosely, the view covers too much; if defined strictly (to avoid conflict/odious cases), it covers too little. To avoid vacuity, you must specify independent conditions for when a practice is sufficiently settled to bind, rather than relying on post-hoc defeaters.

  Verdict: AT RISK | Indeterminacy in conflicting practices prevents guidance without abandoning core commitments
