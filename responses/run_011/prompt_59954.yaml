prompt: |-
  In six weeks I sit the epistemology half of my department's qualifying examination, and one of the two prescribed areas is the limits of self-knowledge. My adviser read my practice answer last Thursday and wrote in the margin that I had treated the KK principle and the anti-luminosity argument as two unrelated exam questions, and that until I could show how they bear on one another I did not properly understand either. I want to fix that by arguing with someone who will not let me off, so please play an unreconstructed defender of KK in the Hintikka mould: you hold that whoever knows anything knows that they know it, not as a convenient idealisation to be invoked once the cases get tidy, but as a truth about actual knowledge, including perceptual knowledge of precisely the kind my case involves. You are not a strawman and you are not unarmed. You may deny that the indiscriminability of adjacent states licenses a margin for error on knowledge; you may object that my stipulations about memory and about introspection quietly beg the question against you; you may insist that conditions concerning my own epistemic states are not sorites-susceptible in the way a volume of water is; you may insist that KK was formulated for a stronger notion of knowledge than the one my case trades on, provided you then tell me what is left of it for the knowledge I actually have. Concede whatever lemmas genuinely fail, since I would much rather be corrected than flattered, but never concede KK itself without announcing that you are conceding it and saying what you propose to put in its place. Argue as an examiner who would like nothing better than to find the flaw in my chain and who is under no obligation to preserve my premises. Stay in character until I write "stop"; keep each reply to two short paragraphs of prose, with no headings and no lists; and argue from the case rather than from the literature, which means no citations, no reading list, and no survey of who holds what. If you