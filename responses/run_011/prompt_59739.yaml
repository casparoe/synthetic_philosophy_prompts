answer: |-
  **Scenario.**
  Consider *Vulpes aquatica*, a semi-aquatic canid. It possesses a stiff, keratinous dorsal ridge running the length of its tail. Engineering analysis confirms this ridge acts as a perfect hydrofoil, stabilizing the tail during swimming without sacrificing terrestrial balance or incurring metabolic cost. The ridge is not a separate structure but the mechanical consequence of two independent adaptations: (1) the elongation of caudal vertebrae neural spines, selected for enhanced terrestrial leverage during bank digging, and (2) the thickening of the dorsal tendon sheath, selected to prevent hyperextension during high-speed pursuit on land. Where the thickened sheath bridges the elongated spines, the overlying skin is forced upward into a rigid fin-like shape. The ridge's height and stiffness correlate perfectly with spine length and tendon thickness across individuals. It performs its hydrodynamic function flawlessly, yet its morphology is entirely determined by the terrestrial requirements of the spine and tendon. Crucially, there is no genetic variance for ridge shape independent of these underlying structures; the "rudder" is a geometric necessity of the digging and running apparatus, constrained by developmental integration such that selection cannot tweak the ridge without disrupting terrestrial locomotion.

  ### 1. Evidence inventory

  *   **Comparative Study:** Across ten *Vulpes* species, ridge surface area correlates tightly ($r > 0.95$) with time spent swimming.
      *   *Why spurious:* Swimming time correlates with body mass (larger foxes hunt larger aquatic prey). Body mass also selects for longer spines (digging larger banks) and thicker tendons (supporting greater weight). The ridge tracks mass via the spines, not swimming via selection.
  *   **Optimality Model:** A fluid dynamics model predicts the exact ridge height observed for each species' swimming speed.
      *   *Why spurious:* Optimal ridge height scales with body mass (drag coefficients). Spine length also scales with body mass (lever mechanics). The model fits because both the trait and the optimum are slaves to the same scaling variable (mass), not because the trait was tuned to the optimum.
  *   **Engineering Analysis:** Removing the ridge (simulated) reduces swimming stability by 40%.
      *   *Why spurious:* Physics is ahistorical. A structure can be functional without being selected *for* that function. The fit is real, but the history is indirect.

  ### 2. Verdicts

  *   **Strong Adaptationist:** Concludes the ridge is an adaptation for swimming. The tight phylogenetic correlation, combined with a numerically accurate optimality model and demonstrated functional utility, satisfies the triad of evidence required to infer specific selection. The lack of independent variance is interpreted as evidence of strong stabilizing selection perfecting the trait.
  *   **Pluralist (Gould–Lewontin):** Concludes the ridge is a spandrel. The trait is useful, but its variation is fully explained by the structural necessities of the spine and tendon. The correlation with swimming is ecological coincidence (shared niche drivers), not historical cause. The "optimality" is a shadow of the optimality of the causal traits.
  *   **Structuralist:** Concludes the ridge is a structural necessity. The default hypothesis should be architectural constraint until independent variance is demonstrated. Since the mechanism (sheath over spine) necessitates the form, positing additional selection is unparsimonious.

  ### 3. Discriminating evidence

  **Observation:** The presence and dimensions of the ridge in a strictly terrestrial sister species (*Vulpes fossor*) that shares the digging and running adaptations but never enters water.

  **Why it discriminates:** If the ridge is an adaptation for swimming, *V. fossor* should lack it or possess a reduced version (unless constrained by phylogeny). If *V. fossor* possesses a ridge identical in proportion to its spines and tendons, it demonstrates the trait arises from terrestrial mechanics alone. An adaptationist accepts this comparative test; if the trait exists without the ecological pressure, the claim of specific adaptation for that pressure is falsified.

  ### 4. Load-bearing feature and removal test

  **Feature:** The perfect genetic covariance between the ridge and the causal structures (spines/tendons).

  **Removal Test:** If artificial selection could vary ridge height *independently* of spine length (breaking the structural constraint), and the ridge height subsequently shifted to better match the hydrodynamic optimum (diverging from the spine-predicted height), the adaptationist verdict would be vindicated. If the ridge remains locked to the spine dimensions despite independent variance, the structuralist verdict holds. The case collapses if independent variance exists but is ignored.

  ### 5. Counterattack

  **Adaptationist Response:** "Secondary Refinement." Even if the ridge originated as a byproduct, if it currently enhances fitness, selection must act to *maintain* the underlying structures partly for the sake of the ridge. The distinction between origin and maintenance is biologically irrelevant; if the spine length is preserved because it produces a useful ridge, the ridge is effectively an adaptation.

  **Survival of Case:** This holds only if the ridge contributes significantly to the fitness of the *causal* traits. However, if the spine length is optimal for digging *regardless* of the ridge, and the ridge is merely a non-costly consequence, the "maintenance" argument fails. The case survives if it can be shown that digging optimality alone fully accounts for spine variance, leaving no residual fitness benefit attributed to the ridge to drive selection. This is delicate: if the ridge adds even 1% fitness, selection *will* act on any available variance. The case rests on the absolute absence of independent variance.
