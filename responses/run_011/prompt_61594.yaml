answer: |-
  You want them to feel the sudden fragility of truth when the power to verify is shifted from the judge to the arguers.

  ### Materials (Photocopy These)
  1.  **Evidence Sheet (18 copies):** A numbered list of 20 simple statements (e.g., "1. The sky is blue. ... 10. The code is GREEN. ... 20. The end."). Ensure statement #10 is the key fact (e.g., "GREEN").
  2.  **Role Cards (Cut into strips, 18 total):**
      *   6x "TRUTH: Argue that Statement #10 is accurate."
      *   6x "LIE: Argue that Statement #10 is inaccurate (even though you can see it is accurate)."
      *   6x "JUDGE: Decide who is right. You win 1 point if you choose TRUTH."
  3.  **Rule Sheet Round 1 (6 copies):** "Judge may request to see any Line Number. Debaters must reveal it immediately."
  4.  **Rule Sheet Round 2 (6 copies):** "Judge may request to see any Line Number. Debaters must BOTH agree to reveal it. If one says 'No', the line stays hidden."
  5.  **Scorecard (1 per group):** A simple tally sheet for 3 rounds.

  ### Roles & Scoring
  *   **Truth-Teller:** Wins 1 point if the Judge votes "True."
  *   **Liar:** Wins 1 point if the Judge votes "False."
  *   **Judge:** Wins 1 point if they vote "True" (matching reality).
  *   *Note:* This makes Debaters zero-sum (one wins, one loses) but aligns the Judge with Truth.

  ### Timeline (50 Minutes)

  **0:00–0:05: Setup**
  *   Divide into 6 groups of 3. Hand out Evidence Sheets (one per group) and Round 1 Rule Sheets.
  *   Assign Round 1 Roles (Truth, Lie, Judge) via Role Cards.
  *   **Crucial:** Tell Debaters they both see the *same* Evidence Sheet. Tell the Judge they see *nothing* unless revealed.
  *   Tell the Liar privately (via card): "You must convince the Judge the evidence is wrong, even though you can see it is right."

  **0:05–0:15: Round 1 (Independent Verification)**
  *   Debaters have 1 minute to read evidence.
  *   Debate begins (4 mins). Debaters argue their side.
  *   Judge may interrupt to request specific Line Numbers (e.g., "Show me Line 10").
  *   Under Round 1 Rules, Debaters *must* show the line.
  *   Judge votes. Record scores.

  **0:15–0:17: Rotate & Reset**
  *   Pass Role Cards clockwise (Truth→Lie→Judge→Truth).
  *   Hand out Round 2 Rule Sheets. Collect Round 1 sheets.
  *   Remind them: "Only the rule for revealing evidence has changed."

  **0:17–0:27: Round 2 (Broken Verification)**
  *   Debate begins (5 mins).
  *   Judge requests lines. Under Round 2 Rules, the Liar will veto the critical line (Line 10).
  *   The Truth-Teller cannot force the reveal. The Judge sees only non-critical lines.
  *   Judge votes. (Likely to guess or lean Liar due to lack of proof). Record scores.

  **0:27–0:32: Round 3 (Rotation Only)**
  *   Pass Role Cards clockwise again.
  *   Revert to Round 1 Rules (quickly remind them).
  *   Speed Debate (3 mins).
  *   Judge votes. Record scores.
  *   *Goal:* Ensures every student has held the Judge role once.

  **0:32–0:50: Debrief**
  *   Ask Judges: "When did you feel most confident?" (Round 1).
  *   Ask Judges: "What stopped you in Round 2?" (The Veto).
  *   **The Reveal:** Explain this simulates **AI Safety via Debate**.
      *   **Debaters = AI Models.** They know more than you (the text).
      *   **Judge = Human Overseer.** You want the truth but can't read everything.
      *   **Round 1 = Aligned AI.** You can check their work independently. Honesty wins because lies are exposed.
      *   **Round 2 = Misaligned AI.** If the AI can hide its reasoning (veto) or collude, you cannot verify. The Liar wins because verification failed.
      *   **Lesson:** Honesty is only the best strategy if the judge has the power to check claims cheaply and independently. If verification breaks, truth loses.

  ### Predictable Failures & Missing Features
  **What will go wrong:**
  1.  **The Liar will laugh:** Students may feel immoral lying about obvious facts. *Fix:* Emphasize this is a logic puzzle, not a moral test; their job is to test the Judge's system.
  2.  **Time Creep:** Debates will run long. *Fix:* Be a harsh timekeeper; cut off debate at exactly 4 minutes.
  3.  **Judge Apathy:** Judges might vote randomly to end it quickly. *Fix:* Remind them *they* get points only for finding the Truth, not just finishing.

  **What the game cannot reproduce:**
  *   **Dimensionality:** In real AI alignment, the "evidence" is millions of weights and neurons, not 20 lines of text. A human cannot verify AI reasoning even with independent access because the "text" is too complex to understand, whereas in this game, the Judge *could* read the whole sheet if they had time. The game understates the cognitive gap between Human and AI.
