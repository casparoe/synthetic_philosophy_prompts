          Replace the rectangle with a harvest of corn across different fields. Ask: "Does variance in yield come from seed differences or soil differences?" Here, variance is explicit. This captures the population nature of heritability. It supports (iii) naturally: if you change the soil (environment), the seed variance contribution changes. However, this analogy conceals the individual developmental interaction, potentially implying genes and environment are separable inputs rather than interacting systems. It sacrifices the insight of (i) to secure the validity of (ii). Alternatively, abandon analogy entirely: define heritability strictly as a ratio of variances contingent on specific population conditions, avoiding geometric metaphors that invite category errors.

