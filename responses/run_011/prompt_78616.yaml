          *   (i) Survives (mostly). The analogy works for individual developmental attribution.
          *   (ii) Fails. The slide from individual to population variance is the fatal flaw. Colleague is right.
          *   (iii) Survives, but independently. The analogy isn't needed for this standard statistical limitation (GxE interaction).
