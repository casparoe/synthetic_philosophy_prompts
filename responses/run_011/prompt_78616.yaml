          The author posits that attributing educational attainment to genes versus environment is conceptually identical to attributing a rectangle's area to length versus width. Just as area arises from the multiplication of length and width, making it nonsensical to assign percentage responsibility to either dimension alone, individual traits arise from the interaction of genotype and environment. Consequently, the author concludes: (i) there is no fact of the matter regarding individual genetic contribution; (ii) population-level heritability estimates are pseudo-precise category errors; and (iii) these estimates cannot predict outcomes under environmental intervention. The argument leans heavily on the multiplicative structure of the area formula and the necessity of both dimensions existing simultaneously to produce the area. It relies on the intuition that because both are necessary conditions, neither can be assigned a proportional causal share in the singular instance.

