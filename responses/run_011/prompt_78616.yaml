      *   *Drafting Section 3 (Disanalogies that matter):*
          1.  **Variance vs. Individual Value (Bear on ii):** This is the fatal disanalogy. Heritability is a population statistic ($V_G/V_P$), not an individual decomposition. The rectangle analogy critiques individual attribution (i), but the author uses it to dismiss population statistics (ii). For this objection to fail, heritability would need to be defined as an individual property, which it is not. The rectangle has no variance; therefore, it cannot model the ratio of variances.
