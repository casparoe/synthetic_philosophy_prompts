      *   **The analogy as deployed:**
          *   Restate: Individual trait development is like rectangle area. Genes/Length and Environment/Width are necessary conditions.
          *   Conclusions: (i) Individual attribution is meaningless; (ii) Population heritability estimates are category errors; (iii) Heritability doesn't predict intervention across environments.
          *   Features leaned on: Multiplicative interaction, necessity of both factors, arbitrariness of attribution without fixing a baseline.
          *   *Word count check:* ~150 words.

      *   **Correspondences:**
          *   Map Source to Target.
          *   Length -> Genotype.
          *   Width -> Environment.
          *   Area -> Phenotype (Educational Attainment).
          *   Single Rectangle -> Individual Organism.
