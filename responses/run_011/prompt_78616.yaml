  - The analogy as deployed

  The author posits that attributing educational attainment to genes versus environment is conceptually identical to attributing a rectangle's area to length versus width. Just as area arises from the multiplication of length and width, making it nonsensical to assign percentage responsibility to either dimension alone, individual traits arise from the interaction of genotype and environment. Consequently, the author concludes: (i) there is no fact of the matter regarding individual genetic contribution; (ii) population-level heritability estimates are pseudo-precise category errors; and (iii) these estimates cannot predict outcomes under environmental intervention. The argument leans heavily on the multiplicative structure of the area formula and the necessity of both dimensions existing simultaneously to produce the area. It relies on the intuition that because both are necessary conditions, neither can be assigned a proportional causal share in the singular instance. The analogy assumes that because the individual causal question is ill-posed, the aggregate statistical question must be equally void.

  - Correspondences

  | Source (Rectangle) | Target (Trait Development) |
  | :--- | :--- |
  | Length | Genotype |
  | Width | Environment |
  | Area | Phenotype (Educational Attainment) |
  | Single Rectangle | Individual Organism |
  | **Missing in Source** | **Present in Target** |
  | Population Distribution | Variance across a population |
  | Statistical Aggregation | Heritability coefficient ($h^2$) |
  | Developmental Noise | Residual variance |
  | Selection Mechanisms | Evolutionary/Social selection |

  The mapping is clear at the individual level: length and width map to genotype and environment as constitutive factors producing the area (phenotype). However, the source lacks any mechanism for variation. A single rectangle has fixed dimensions; it does not possess a variance. Heritability, however, is explicitly defined as the proportion of *phenotypic variance* attributable to *genetic variance* within a specific population. The analogy contains no counterpart for the statistical aggregation required to move from a single case to a population parameter. Consequently, the source cannot model the denominator (total variance) or the numerator (genetic variance) essential to the target concept. The rectangle is a geometric object, not a statistical sample, leaving the bridge between individual causation and population statistics entirely unbuilt. Additionally, the target involves stochastic noise and selection pressures with no geometric equivalent, weakening the mapping for population phenomena where noise contributes to residual variance.

  - Disanalogies that matter

  1. **Variance vs. Individual Value (Bear on ii):** This is the fatal disanalogy. Heritability is a population statistic ($V_G/V_P$), not an individual decomposition. The rectangle analogy critiques individual attribution (i), but the author uses it to dismiss population statistics (ii). For this objection to fail, heritability would need to be defined as an individual property, which it is not. The rectangle has no variance; therefore, it cannot model the ratio of variances. This disanalogy validates your colleague's suspicion that the argument illicitly slides from individual ontology to population statistics. The source domain is singular; the target domain is aggregate.

  2. **Fixed vs. Variable Ranges (Bear on iii):** The rectangle implies fixed dimensions. Heritability estimates are sensitive to the range of environments sampled. While the author correctly notes this limits intervention inference (iii), the rectangle analogy suggests this makes the number meaningless everywhere. In reality, the number is meaningful *within* the sampled variance, whereas the rectangle analogy implies meaninglessness *simpliciter*. For this objection to fail, the range of environments would need to be universal and fixed, which is false. This distinction preserves the descriptive utility of heritability while accepting its predictive limits. It shows the statistic is context-bound, not void. The rectangle's static nature prevents it from modeling the dynamic range of environmental interventions relevant to policy.

  3. **Multiplicative Development vs. Additive Variance (Bear on ii):** Even if development is multiplicative (interaction), variance can often be partitioned additively within a specific context. The rectangle area is multiplicative, but if you have a population of rectangles, you can calculate how much variance in area is due to variance in length. The analogy conflates the functional form of development with the statistical decomposition of variance. For this objection to fail, variance decomposition would need to be mathematically impossible for multiplicative functions, which is false. Statistical models routinely partition variance despite underlying interactions. The author mistakes the geometry of individual development for the arithmetic of population differences.

  The first disanalogy does the most work, validating the colleague's suspicion that the argument slides from individual causal necessity to population variance decomposition. The second supports (iii) but undermines the claim that the statistic is therefore useless for description. The third shows the mathematical error in claiming category error based on functional form. These points confirm your suspicion that the analogy has no purchase at the population level. Thus, the inference from geometric necessity to statistical invalidity is structurally unsupported.

  - Disanalogies that look serious but are not

  Critics often argue that genes and environments are not separable dimensions like length and width, citing epigenetic entanglement. While true, this does not rescue the author's case. Even if separable, the variance critique holds. Similarly, objections that rectangles are static while development is dynamic miss the point; the analogy concerns causal attribution, not temporal process. These features complicate the biology but do not address the logical leap from individual necessity to population variance. The core logical structure regarding attribution ambiguity remains intact regardless of biological complexity, so these objections fail to touch the central inference error regarding (ii). They attack the biological fidelity of the source rather than the logical structure of the inference, leaving the category error unaddressed.

  - Verdict

  Your colleague is correct. The analogy successfully supports (i): it is indeed meaningless to ask what fraction of an individual's trait is genetic, just as it is for a rectangle's area. However, (ii) does not survive. The move from individual causal necessity to population variance decomposition is unsupported by the source domain, which lacks distributional properties. Heritability is not a claim about individual composition, so showing individual composition is ambiguous does not invalidate population variance ratios. Conclusion (iii) is standard statistical practice and true, but the analogy is unnecessary to establish it; standard interaction effects suffice. The author's error is treating a population parameter as if it were an individual property. The cut between (i) and (ii) is the correct place to sever the argument. The analogy protects the conceptual clarity of individual development but weaponizes that clarity to dismantle a distinct statistical tool. The rectangle contains no distribution, so it cannot license statistical conclusions about variance. Therefore, the policy implication that heritability must be discarded is unsupported by the geometric metaphor.

  - A better analogy, or none

  Replace the rectangle with a harvest of corn across different fields. Ask: "Does variance in yield come from seed differences or soil differences?" Here, variance is explicit. This captures the population nature of heritability. It supports (iii) naturally: if you change the soil (environment), the seed variance contribution changes. However, this analogy conceals the individual developmental interaction, potentially implying genes and environment are separable inputs rather than interacting systems. It sacrifices the insight of (i) to secure the validity of (ii). Alternatively, abandon analogy entirely: define heritability strictly as a ratio of variances contingent on specific population conditions, avoiding geometric metaphors that invite category errors. Direct statistical definition prevents the conflation of individual causation with population variance, ensuring policy discussions rest on accurate conceptual foundations regarding intervention limits.
