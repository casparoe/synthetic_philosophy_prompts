  2.  **Deconstruct the Analogy:**
      *   **Source:** Rectangle area ($A = L \times W$).
      *   **Target:** Educational attainment (Phenotype $P$) determined by Genes ($G$) and Environment ($E$).
      *   **Logic:** Since $A$ depends multiplicatively on $L$ and $W$, asking "what fraction of $A$ is due to $L$" is meaningless without fixing one variable. Similarly, $P$ depends on $G$ and $E$, so asking "what fraction of $P$ is due to $G$" is meaningless.
      *   **Critique:** Heritability ($h^2$) is defined as $V_G / V_P$ (variance due to genes over total variance) in a *population*, not the contribution to an *individual's* score. The rectangle analogy addresses individual composition (developmental origin), not population variance.

