          *   1. Individual vs. Population Variance (Crucial for (ii)). Heritability is about variance ratios, not individual causation. The rectangle analogy attacks individual causation.
          *   2. Additive vs. Multiplicative Models in Variance Decomposition. Even if development is multiplicative, variance can often be decomposed additively (ANOVA style) within a specific population context.
          *   3. Range of Variation. A single rectangle has fixed $L$ and $W$. Heritability requires a distribution of $L$ and $W$.
          *   *Word count check:* ~350 words.

      *   **Disanalogies that look serious but are not:**
          *   Objections like "Genes are internal, length is not" or "Environment is complex, width is simple."
          *   Why they don't matter: The logical point about attribution ambiguity holds regardless of complexity.
          *   *Word count check:* ~120 words.

