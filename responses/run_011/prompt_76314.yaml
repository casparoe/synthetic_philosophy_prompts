prompt: |-
  I direct the policy analysis unit of a city council: a nonpartisan staff office of five generalist analysts, none of whom has econometrics training. Between local wage ordinances, rent regulation proposals, and occasional emergency price measures, roughly twenty-five proposed price controls reach us each session. Each one gets five working days, no modeling support, and a written analysis that will be read aloud in committee and picked apart in public by both business associations and tenant organizations, so it has to be defensible against a charge of bias from either direction. My office does not recommend; the committee decides what the city ought to value, and the city attorney decides whether we have authority to act at all, since state preemption of local price regulation is contested here and I do not want analysts reasoning their way into a legal position. Our standing instructions also forbid forecasting magnitudes we cannot support, so any framework we adopt has to work on the sign and the channel of an effect rather than its size. We currently have nothing: each analyst improvises, and two of us can look at the same ordinance and describe it in incompatible ways.

  Please write the decision procedure we should be running instead. I want a sequence of tests that an analyst applies to a proposed control in a fixed order, and for each test: the question asked, the kind of evidence from a public record that counts as a sufficient answer, which answer terminates the analysis in a negative finding, which answer terminates it in an honest determination that the record does not support a conclusion, and which answer passes the proposal on. Tell me, as you build it, which distinctions from the economics of price controls have to survive translation into a checklist and which can be dropped without misleading a reader who never learned the theory, and why you drew the line where you did.

  The procedure should open by classifying the market rather than the control, because our repeated failure has been to assume every price ceiling works the same way. It needs to determine whether price is actually the operative rationing device in the affected market or whether allocation already runs through waiting lists, lotteries, search, and selection by the party not on the constrained side; whether the control would bind for most transactions or only for marginal ones that nonetheless determine allocation; and whether it governs a fixed stock already in the city or a flow whose inbound supply responds to price, since a ceiling on the former and a ceiling on the latter are different policies wearing the same name. It needs to locate who ends up holding discretionary power over whom once price stops doing the allocating, and to treat that as an ethical finding in the memo rather than a footnote about efficiency, because in our experience this is the question the committee is really arguing about. It needs to separate a transfer between identifiable parties from a destruction of surplus that nobody receives, and to separate effects on present participants from effects on the people who would have been participants a decade from now and who appear at no hearing and file no comment.

  It also needs the exceptions, stated as tests a generalist can actually run rather than as caveats. Where employers already possess wage-setting power, a floor can raise both pay and employment; give me the observable conditions that would let an analyst say whether that description fits this city and this sector, and what to do when the evidence is ambiguous. Where a ceiling falls on a fixed stock during a declared emergency, the familiar shortage prediction may not apply; tell me what would have to be true for that to hold and how to check it in two days. The procedure must force an explicit comparison against the alternative instruments realistically available to this city — transfers, subsidies, vouchers, supply-side regulatory changes — rather than against a frictionless ideal, and it must flag the exact point at which that comparison smuggles in a judgment about political feasibility, since whether an alternative is unavailable because it is unwise or because it is unpopular is not ours to decide. Mark every step that is a judgment call dressed as procedure. Mark every point where the analysis stops and hands the question to the committee because it concerns values rather than facts, and specify what the analyst should put in front of them at those points. Finally, give me the procedure's known failure modes: the classes of ordinance on which it will systematically mislead us, the ways short-run and long-run effects can diverge past the point where a single memo can hold both, and the situations in which the market benchmark itself is already so distorted by other interventions that there is no clean equilibrium to compare against.

  Then run it on three proposals. First, an ordinance capping annual rent increases on existing tenancies at four percent, with the cap reset to market whenever a unit turns over, in a city whose zoning permits little new multifamily construction. Second, a city minimum wage rising over four years to a level that would be the highest in the state and, on our own rough estimate, near sixty percent of the metropolitan median hourly wage, applying only to employers with fifteen or more employees inside city limits. Third, an ordinance extending the cap in the first proposal to newly built rental units with no reset at turnover, introduced by the same sponsors as the remedy for the displacement the first ordinance is projected to cause. For each, show the tests being applied in order with the answers a competent analyst would record from the public record, and state the resulting finding. At least one of these should come out in a way its sponsors will not like, and I want you to say which, why the procedure forces that result, and how an analyst should write it so the finding survives the hearing. If the honest output on any of them is that the record cannot support a conclusion, say so and specify what evidence would settle it. Close with a plain statement of what the procedure cannot do — the questions it appears to answer but does not.

  Do not include citations, a bibliography, a reading list, or verbatim quotations from economists; paraphrase everything, and write on the assumption that neither you nor the reader can look anything up. The finished product has to be auditable: a journalist should be able to follow it step by step, and an advocate who disagrees should be able to name the single test they contest.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Director of a nonpartisan city council policy analysis unit (5 generalist analysts, no econometrics).
      *   **Context:** ~25 price control proposals/session (wage, rent, emergency prices). 5 working days per analysis. No modeling support. Written analysis read in committee, scrutinized by opposing advocates (business vs. tenant). Must be defensible against bias charges.
      *   **Constraints:**
          *   No recommendations (committee decides values).
          *   No legal opinions (city attorney decides authority/preemption).
          *   No unsupported forecasting magnitudes (focus on sign/channel, not size).
          *   Current state: Chaos/inconsistency.
          *   Output must be a fixed-order sequence of tests (decision procedure).
          *   For each test: Question, Sufficient Evidence, Negative Termination, "Unknown" Termination, Pass Condition.
          *   Must distinguish between economic theory concepts that need translation vs. those that can be dropped.
          *   Must address specific nuances: Market classification (price vs. non-price rationing), binding vs. marginal, stock vs. flow, discretionary power shifts (ethical finding), transfer vs. surplus destruction, present vs. future participants.
          *   Must include exceptions (monopsony, emergency fixed stock) as testable conditions.
          *   Must compare against realistic alternatives (transfers, subsidies, etc.) without smuggling in political feasibility judgments.
          *   Must mark judgment calls vs. facts vs. value questions for the committee.
          *   Must list known failure modes.
          *   Must apply the procedure to three specific proposals (Rent Control Type 1, High Minimum Wage, Rent Control Type 2).
          *   One result must be unfavorable to sponsors, explaining why and how to write it.
          *   If evidence is insufficient, state what is needed.
          *   Close with limitations (what the procedure *cannot* do).
          *   **Style:** No citations, no bibliography, no quotes. Paraphrase theory. Auditable. Plain language.

  2.  **Deconstruct the Economic Theory for Generalists:**

      *   *Core Concept:* Price controls change *who* decides *who* gets *what*.
      *   *Translation:* Instead of "deadweight loss," talk about "transactions that disappear." Instead of "monopsony," talk about "one buyer/many sellers." Instead of "incidence," talk about "who actually pays/receives."
      *   *Keep:* Binding vs. Non-binding, Stock vs. Flow, Price vs. Non-Price Rationing, Transfer vs. Efficiency Loss, Short-run vs. Long-run.
      *   *Drop:* Elasticity coefficients, equilibrium price calculations, complex general equilibrium effects, specific welfare function weightings.
      *   *Why:* Generalists can't calculate elasticities in 5 days. They *can* check zoning codes, vacancy rates, and employer concentration.

  3.  **Drafting the Decision Procedure (The "Algorithm"):**

      *   *Structure:* Needs to be linear. Step 1 -> Step 2 -> Stop/Continue.
      *   *Step 1: Market Structure (Stock vs. Flow / Rationing).* Is price actually setting the allocation?
      *   *Step 2: Binding Status.* Is the control relevant to most transactions or just the edge?
      *   *Step 3: Power Shift.* If price stops working, who decides? (Landlord vs. Tenant, Employer vs. Worker).
      *   *Step 4: Supply Response.* Can the supply change? (Zoning, construction time, entry/exit).
      *   *Step 5: Alternatives.* What else could the city do? (Subsidies, zoning changes).
      *   *Step 6: Time Horizon.* Short term gain vs. Long term pain.
      *   *Exceptions:* Monopsony (Wage floors), Emergency (Fixed stock).

      *Refining the Tests:* I need to make sure each test has the specific outputs requested (Question, Evidence, Negative, Unknown, Pass).

      *Refining the "Ethical/Value" Handoff:* The prompt emphasizes that power shifts are ethical findings. The analyst must state *who gets discretion*, not whether that discretion is good. The committee decides if that discretion is desirable.

      *Refining the "Alternatives" Test:* Crucial distinction: Is the alternative legally impossible, fiscally impossible, or politically unpopular? The analyst can only certify the first two.

  4.  **Developing the Three Scenarios:**

      *   *Proposal 1: Rent Cap (4%, reset at turnover), Low Zoning.*
          *   *Analysis:* Stock market (mostly). Binding on existing tenants. Non-binding on new (market reset). Supply response negative (long run). Power shifts to landlord (selection of tenants).
          *   *Result:* Likely passes initial tests but flags long-term supply risk and non-price rationing (discrimination risk).
      *   *Proposal 2: Minimum Wage (High, 60% of median, >15 employees).*
          *   *Analysis:* Labor market. Is it monopsonistic? (City-wide? Sector-specific?). 60% of median is high (potential binding). Small business exemption creates boundary issues.
          *   *Result:* This is the one likely to hit a "Negative" or "Unknown" on the employment effect due to the height of the wage relative to median. Or, it highlights the substitution effect (automation). Let's make this the one that sponsors won't like regarding *employment levels* for low-skill workers.
      *   *Proposal 3: Rent Cap (Extended to new units, no reset).*
          *   *Analysis:* Flow market. Binding on new supply. High risk of stopping construction.
          *   *Result:* Strong negative on supply. Sponsors won't like this. This is the best candidate for the "unfavorable to sponsors" requirement.

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the constraints and the goal (consistency, defensibility).
      *   **Theoretical Translation:** Explain what economic concepts are kept (incentives, rationing) and dropped (magnitudes, equilibrium math).
      *   **The Procedure:** The core checklist.
      *   **Failure Modes:** Where does this break? (Black markets, complex interactions, hyper-inflation).
      *   **Application:** Run the three proposals through the checklist.
      *   **Limitations:** What can't this do? (Predict the future, decide values).

  6.  **Refining the "Unfavorable Result" (Proposal 3):**

      *   Proposal 3 (New Units Cap) is economically the most dangerous for supply.
      *   *Why sponsors won't like it:* It explicitly states that new construction will likely halt or require subsidies, undermining the goal of increasing housing stock.
      *   *How to write it:* Focus on the *incentive* change, not a prediction of doom. "The ordinance removes the price signal required to cover construction costs given current zoning."

  7.  **Addressing Specific Prompt Requirements:**

      *   *Mark judgment calls:* I need to explicitly label steps where analyst judgment enters.
      *   *Mark value handoffs:* Explicitly state "Committee Decision Required."
      *   *Auditable:* Clear Yes/No/Unknown paths.
      *   *No Citations:* Keep it internal.

  8.  **Self-Correction/Review during Drafting:**

      *   *Critique:* Is the procedure too complex for 5 days?
      *   *Fix:* Ensure evidence sources are public records (zoning maps, vacancy reports, budget docs) not requiring new surveys.
      *   *Critique:* Did I handle the "monopsony" exception for wages?
      *   *Fix:* Add a specific test step for labor market concentration or "single major employer" dynamics.
      *   *Critique:* Did I handle the "emergency" exception?
      *   *Fix:* Add a test for "Declared Emergency + Fixed Supply."
      *   *Critique:* Is the distinction between Stock and Flow clear?
      *   *Fix:* Define Stock as "cannot be moved or built quickly" and Flow as "can be imported or built within the policy horizon."

  9.  **Final Polish:**

      *   Check tone: Professional, bureaucratic but clear, nonpartisan.
      *   Check constraints: No citations, no magnitudes.
      *   Check the "Unknown" condition: Ensure analysts know when to stop rather than guess.

  *(Self-Correction on Proposal 2)*: A minimum wage at 60% of the median is very high (usually binding is around 50% or lower). This creates a high risk of disemployment. I will structure the analysis to show that while current employees gain, *future* low-skill entrants lose access. This fits the "present vs. future participants" requirement.

  *(Self-Correction on Proposal 3)*: This is the strongest candidate for the "sponsors won't like it" outcome. It directly attacks the supply mechanism.

  *(Final check on "Judgment Calls"):* I need to make sure I explicitly highlight where the analyst is making a call vs. reading a fact.

  Let's assemble the document.

  *Structure:*
  1.  **Memorandum Header** (To/From/Subject)
  2.  **Introduction & Design Logic** (Theory translation)
  3.  **The Decision Procedure** (The 7-Step Test)
  4.  **Known Failure Modes**
  5.  **Application to Proposals** (1, 2, and 3)
  6.  **Limitations Statement**

  *Drafting the Steps:*
  Step 1: Market Definition (Stock/Flow).
  Step 2: Binding Status (Price vs. Rationing).
  Step 3: Discretionary Power (Who decides allocation?).
  Step 4: Supply Response (Can supply leave or shrink?).
  Step 5: Exceptions (Monopsony/Emergency).
  Step 6: Alternatives (Feasible vs. Popular).
  Step 7: Time Horizon (Present vs. Future).

  *Drafting the Applications:*
  Be precise with the "Evidence" column.
  Ensure Proposal 3 gets the "Negative" finding on supply.

  *Final Review against constraints:*
  - No econometrics? Yes.
  - 5 days feasible? Yes, relies on existing records.
  - Nonpartisan? Yes, focuses on mechanics not values.
  - Auditable? Yes, step-by-step.

  Okay, ready to write.
answer: |-
  **MEMORANDUM**

  **TO:** Policy Analysis Unit Staff
  **FROM:** Director
  **SUBJECT:** Standardized Decision Procedure for Price Control Analysis
  **DATE:** October 26, 2023

  **1. PURPOSE AND DESIGN LOGIC**

  This document establishes a mandatory seven-step decision procedure for all analyses involving price floors, price ceilings, or wage mandates. Its purpose is to replace improvisation with a consistent, auditable framework that survives public scrutiny from opposing advocacy groups.

  **Translation of Theory to Checklist**
  We do not model magnitudes. We cannot predict *how much* rent will rise or *how many* jobs will be lost. Therefore, we drop all economic concepts requiring elasticity coefficients or equilibrium calculations. We retain only concepts that describe *incentives* and *authority*.
  *   **Keep:** The distinction between fixed supply (stock) and adjustable supply (flow); the shift from price rationing to non-price rationing; the distinction between a transfer of wealth and a loss of opportunity; the separation of current participants from future entrants.
  *   **Drop:** Deadweight loss triangles, specific price predictions, general equilibrium effects across unrelated markets.
  *   **Reasoning:** A generalist can verify zoning codes and vacancy rates in five days. A generalist cannot calculate market elasticity. Focusing on authority shifts (who decides who gets the good) allows us to describe the *mechanism* of the policy without opining on its *value*.

  **2. THE DECISION PROCEDURE**

  Apply these tests in order. If a test terminates in "Negative Finding," the analysis concludes that the record supports a finding of likely adverse mechanical effects. If "Insufficient Record," the analysis concludes the city cannot evaluate the proposal without new data. If "Pass," proceed to the next test.

  **STEP 1: STOCK VS. FLOW CLASSIFICATION**
  *   **Question:** Is the supply of the good or service fixed within the policy horizon, or can it be increased/decreased in response to price?
  *   **Evidence:** Zoning maps, construction permit timelines, inventory turnover rates, licensing caps.
  *   **Negative Finding:** Supply is fixed (Stock), and the control prevents price from clearing the market. (Terminates: Shortage/Rationing expected).
  *   **Insufficient Record:** No data on supply elasticity or construction pipelines. (Terminates: Effect on supply unknown).
  *   **Pass:** Supply is adjustable (Flow) OR Supply is fixed but the control is non-binding.
  *   **Analyst Note:** *Judgment Call:* Defining the "policy horizon." For housing, 5 years is fixed stock; 20 years is flow. For wages, labor supply is flow. State your horizon explicitly.

  **STEP 2: BINDING STATUS AND RATIONING METHOD**
  *   **Question:** Is the controlled price below the prevailing market price for the majority of transactions, or only the marginal few? Is price currently the method used to allocate the good?
  *   **Evidence:** Current market rate surveys, vacancy rates, waitlist lengths, hiring rates vs. applicant volumes.
  *   **Negative Finding:** Price is the primary rationing device, and the control is binding on the majority of transactions. (Terminates: Non-price rationing will replace price rationing).
  *   **Insufficient Record:** No reliable data on prevailing market rates or allocation methods. (Terminates: Binding status unknown).
  *   **Pass:** Control is non-binding (above market floor/below market ceiling) OR Allocation is already determined by non-price factors (lotteries, seniority).
  *   **Analyst Note:** If allocation is already by waitlist, a price ceiling changes *who profits* but not *who gets the good*.

  **STEP 3: DISCRETIONARY POWER SHIFT**
  *   **Question:** If price no longer allocates the good, which party to the transaction gains the legal or practical authority to select the counter-party?
  *   **Evidence:** Text of the ordinance (exemptions, eviction grounds, hiring/firing rules), standard contract terms.
  *   **Negative Finding:** The ordinance grants one party unchecked discretion to select counter-parties without objective criteria. (Terminates: Risk of arbitrary or discriminatory allocation).
  *   **Insufficient Record:** Ordinance is silent on selection criteria or enforcement mechanisms. (Terminates: Allocation method unknown).
  *   **Pass:** Selection criteria are objective, verifiable, and enforced by a third party.
  *   **Analyst Note:** *Value Handoff:* This is not an efficiency finding. This is a finding on *power*. State clearly: "Landlords gain discretion to select tenants based on X" or "Employers gain discretion to select workers based on Y." The Committee must decide if this power distribution is desirable.

  **STEP 4: SUPPLY RESPONSE MECHANISM**
  *   **Question:** Does the control reduce the net return on providing the good or service below the cost of provision for marginal suppliers?
  *   **Evidence:** Cost-of-service studies, profit margin reports, construction cost indices, comparable jurisdiction data on business closures.
  *   **Negative Finding:** Controlled price < Marginal Cost of Production/Provision. (Terminates: Supply contraction expected).
  *   **Insufficient Record:** No public data on cost structures or profit margins. (Terminates: Supply response unknown).
  *   **Pass:** Controlled price > Marginal Cost OR Subsidies offset the difference.
  *   **Analyst Note:** *Judgment Call:* Determining "Marginal Cost" without proprietary data. Use industry averages from public trade associations. Flag if data is self-reported by interested parties.

  **STEP 5: EXCEPTIONS (MONOPSONY AND EMERGENCY)**
  *   **Question:** (For Wage Floors) Is there a single dominant employer or coordinated wage-setting in the sector? (For Price Ceilings) Is there a declared emergency with inelastic demand and fixed stock?
  *   **Evidence:** Labor market concentration data (Herfindahl indices if available, or number of major employers), Governor/Mayor emergency declarations, disaster impact reports.
  *   **Negative Finding:** No evidence of employer coordination OR No declared emergency with fixed supply. (Proceed to Step 6).
  *   **Insufficient Record:** Labor market data is aggregated at too high a level (e.g., metro-wide vs. city-wide). (Terminates: Exception applicability unknown).
  *   **Pass:** Evidence suggests wage-setting power exists OR Emergency conditions justify temporary suspension of normal supply incentives.
  *   **Analyst Note:** This is the only step where a price control may pass without triggering a supply/rationing warning. The bar for evidence is high.

  **STEP 6: ALTERNATIVE INSTRUMENT COMPARISON**
  *   **Question:** Is there a legally and fiscally feasible alternative (subsidy, voucher, zoning change) that achieves the same distributional goal without altering the price mechanism?
  *   **Evidence:** City budget capacity, state preemption statutes, zoning code amendment procedures.
  *   **Negative Finding:** A feasible alternative exists that avoids the rationing/supply risks identified in Steps 1-4. (Terminates: Control is not the least-restrictive means).
  *   **Insufficient Record:** Legal authority for alternatives is contested or budget impact is unknown. (Terminates: Comparability unknown).
  *   **Pass:** No feasible alternative exists.
  *   **Analyst Note:** *Judgment Call:* Distinguish "Politically Unpopular" from "Legally/Fiscally Impossible." Do not label an alternative "infeasible" simply because it requires a tax increase. Label it "Fiscally Constrained" only if the budget is legally balanced.

  **STEP 7: TIME HORIZON SEPARATION**
  *   **Question:** Does the benefit accrue to current participants while the cost accrues to future participants who are not represented in the hearing?
  *   **Evidence:** Turnover rates, lease durations, workforce entry/exit data.
  *   **Negative Finding:** Benefits are locked to incumbents; costs are borne by future entrants (e.g., future tenants, future low-skill workers). (Terminates: Intergenerational transfer identified).
  *   **Insufficient Record:** Turnover data unavailable. (Terminates: Duration of effects unknown).
  *   **Pass:** Benefits and costs accrue to the same population over time.
  *   **Analyst Note:** *Value Handoff:* The Committee must decide if protecting current participants at the expense of future ones is a valid policy goal.

  **3. KNOWN FAILURE MODES**

  This procedure will systematically mislead the Committee in the following scenarios. Analysts must flag these explicitly if detected:
  1.  **Black Markets:** If the good is small, portable, and the penalty for violation is low, the procedure will predict "shortage," but the market will clear illegally. The procedure assumes compliance.
  2.  **Quality Adjustment:** If suppliers cannot lower price, they will lower quality. The procedure identifies "supply contraction," but may miss "quality contraction" if quality is hard to measure (e.g., landlord maintenance responsiveness).
  3.  **Distorted Baselines:** If the market is already heavily regulated (e.g., zoning already restricts housing supply), the "Supply Response" test may attribute supply constraints to the price control that are actually caused by prior regulations.
  4.  **General Equilibrium:** The procedure analyzes one market in isolation. It cannot detect if a wage floor in the city pushes low-wage jobs to the suburbs, harming regional commuters.

  **4. APPLICATION TO PENDING PROPOSALS**

  **PROPOSAL 1: Rent Cap (Existing Tenancies Only)**
  *Ordinance:* Caps annual rent increases at 4% on existing tenancies. Cap resets to market rate upon turnover. Zoning permits little new construction.

  *   **Step 1 (Stock/Flow):** **Pass (with caveat).** Housing is Stock in short-run (5 years). Zoning restricts Flow.
  *   **Step 2 (Binding/Rationing):** **Pass.** Market rent growth > 4%. Binding on existing tenants. Non-binding on vacant units (reset allowed). Price rations vacant units; tenure rations occupied units.
  *   **Step 3 (Power Shift):** **Negative Finding.** Landlords retain discretion to select new tenants at market rate. Landlords gain incentive to turnover units (eviction for move-in) to reset rent.
      *   *Evidence:* Eviction filing rates in similar jurisdictions; lease termination clauses.
      *   *Memo Text:* "The ordinance creates a financial incentive for landlords to terminate tenancies to reset the price cap. Discretion over unit allocation remains with the landlord."
  *   **Step 4 (Supply Response):** **Pass (Short Run).** Existing stock remains. **Negative (Long Run).** Zoning prevents new supply; returns on maintenance may decline.
  *   **Step 5 (Exceptions):** **Fail.** No emergency declaration. No monopsony.
  *   **Step 6 (Alternatives):** **Pass.** Direct rental subsidies are fiscally constrained; zoning reform is legally complex.
  *   **Step 7 (Time Horizon):** **Negative Finding.** Benefits accrue to current tenants (incumbents). Costs (reduced maintenance, turnover risk) accrue to current and future tenants. Future tenants face market rates but potentially lower stock quality.
  *   **Result:** **Mixed.** Protects incumbents, risks turnover-induced displacement, does not solve supply constraint.
  *   **Committee Handoff:** "The analysis identifies a trade-off between security for current tenants and stability of tenure. The Committee must decide if protecting incumbent rents justifies the risk of increased turnover."

  **PROPOSAL 2: City Minimum Wage (High Floor)**
  *Ordinance:* Wage rises over 4 years to 60% of metro median hourly wage. Applies only to employers with 15+ employees inside city limits.

  *   **Step 1 (Stock/Flow):** **Pass.** Labor is a Flow. Supply can adjust (commuting, automation, entry/exit).
  *   **Step 2 (Binding/Rationing):** **Negative Finding.** 60% of median is historically high for a binding floor. Price (wage) is the primary rationing device for low-skill labor.
      *   *Evidence:* Current wage distribution data showing concentration below the proposed floor.
      *   *Memo Text:* "The proposed wage exceeds the prevailing market rate for a significant portion of the affected sector. Allocation will shift from price-based to employer-discretion-based."
  *   **Step 3 (Power Shift):** **Negative Finding.** Employers gain discretion to select higher-skilled workers to justify the higher wage.
      *   *Evidence:* Job description requirements, hiring standards.
      *   *Memo Text:* "Employers will likely raise credential requirements to match the higher wage, reducing access for low-skill entrants."
  *   **Step 4 (Supply Response):** **Negative Finding.** Marginal cost of labor > Marginal revenue product for low-skill roles.
      *   *Evidence:* Industry profit margins, automation feasibility studies.
      *   *Memo Text:* "For marginal employers, the mandated wage exceeds the revenue generated by the lowest-productivity roles. These roles are at risk of elimination or automation."
  *   **Step 5 (Exceptions):** **Fail.** Labor market is competitive (many employers). No monopsony evidence at city level.
  *   **Step 6 (Alternatives):** **Pass.** Earned Income Tax Credit (federal/state) exists but city cannot replicate. Subsidies fiscally constrained.
  *   **Step 7 (Time Horizon):** **Negative Finding.** Benefits to current low-wage workers (insiders). Costs to future low-skill entrants (outsiders) who cannot secure employment.
      *   *Memo Text:* "The policy transfers income to currently employed low-wage workers but reduces the probability of employment for future entrants."
  *   **Result:** **Negative Finding on Employment Access.**
  *   **Committee Handoff:** "The analysis indicates a trade-off between higher wages for employed workers and reduced hiring opportunities for unskilled workers. The Committee must decide the relative value of wage levels versus employment access."

  **PROPOSAL 3: Rent Cap (Extended to New Units, No Reset)**
  *Ordinance:* Extends Proposal 1 cap to newly built units. No reset to market at turnover.

  *   **Step 1 (Stock/Flow):** **Negative Finding.** Applies to Flow (New Construction).
      *   *Evidence:* Construction cost indices, financing requirements.
      *   *Memo Text:* "New construction is a flow decision dependent on expected future returns. This ordinance caps the revenue stream for new capital."
  *   **Step 2 (Binding/Rationing):** **Negative Finding.** Cap is below the rent required to service construction debt at current interest rates.
      *   *Evidence:* Pro forma financials from recent development permits (public record).
      *   *Memo Text:* "The capped rent is insufficient to cover debt service and operating costs for new construction under current financing conditions."
  *   **Step 3 (Power Shift):** **N/A.** If no units are built, no allocation occurs.
  *   **Step 4 (Supply Response):** **Negative Finding.** Supply contraction.
      *   *Evidence:* Permit filings in jurisdictions with similar controls; developer statements of intent.
      *   *Memo Text:* "The ordinance removes the price signal required to induce new supply. Development activity is expected to cease or shift to untaxed jurisdictions."
  *   **Step 5 (Exceptions):** **Fail.** No emergency.
  *   **Step 6 (Alternatives):** **Negative Finding.** Subsidies could bridge the gap but are fiscally constrained. Zoning reform is a feasible alternative to increase supply without price caps.
      *   *Memo Text:* "Zoning reform could lower construction costs, achieving affordability without capping revenue."
  *   **Step 7 (Time Horizon):** **Negative Finding.** Benefits to a small number of initial tenants. Costs to all future residents via housing shortage.
  *   **Result:** **Negative Finding.** The record supports a conclusion that this ordinance will halt new construction.
  *   **Sponsor Disagreement:** Sponsors argue this prevents displacement.
  *   **Analyst Defense:** "The analysis does not dispute the goal of preventing displacement. It identifies that the mechanism chosen (capping new supply revenue) contradicts the physical requirement for creating new supply. To achieve the goal without halting construction, the city must subsidize the difference between the cap and the cost of production. The record shows no funding source for this subsidy."
  *   **Committee Handoff:** "The Committee must decide whether to prioritize rent stability for a limited number of units over the expansion of the total housing stock."

  **5. LIMITATIONS STATEMENT**

  This procedure cannot answer the following questions. If a Committee Member asks these, the analyst must state "Outside Scope of Analysis":
  1.  **Moral Desirability:** We can state who gains power, but not whether they *should* have it.
  2.  **Political Viability:** We can state if an alternative is legal and funded, but not if it is popular.
  3.  **Magnitude of Effects:** We can state the direction (supply will fall), but not the amount (supply will fall by 10%).
  4.  **Regional Spillover:** We analyze the city jurisdiction. We cannot predict if jobs will move to the next county, only that they may leave the firm.
  5.  **Legal Authority:** We analyze economic mechanics. We do not opine on state preemption or constitutionality.

  **AUDIT TRAIL**
  Every memo must include a "Decision Log" appendix listing the Pass/Fail/Unknown status of each of the seven steps. Any deviation from this procedure must be justified in writing by the Director.
