answer: |-
  The guilt-flavoured notion takes moral agency and normative violation as its object; settlement requires proving intent and justifies punishment. The air-crash-investigator notion takes systems and sequences as its object; settlement requires a coherent causal map and justifies prevention. Moving from the causal frame to the guilt frame without smuggling is impossible because causal mapping describes *what happened*, while guilt requires inserting a normative judgment about *what should not have happened* alongside proof of conscious choice.

  The Fischer controversy tests this boundary. The prevailing structuralist orthodoxy treated the war as a collective slide, a crash where every alliance and timetable was a contributing factor but no single pilot steered into the mountain. Fischer's intervention was not merely to lengthen the causal chain but to identify a specific pilot with a flight plan. By producing evidence of premeditated annexationist aims and deliberate escalation during the July Crisis, he reintroduced *intent* into a debate dominated by *condition*. This does not just relabel a cause as a culprit; it changes the category of explanation from structural determinism to agential responsibility. He provided the missing evidentiary bridge that allows the causal chain to support a moral judgment, rather than simply asserting the judgment over the facts.

  Verdict: real move, because proving deliberate intent shifts the object from systemic failure to moral agency.
