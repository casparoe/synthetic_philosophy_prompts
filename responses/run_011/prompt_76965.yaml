  But vision may wander where logic is planned,
  Yet eyes offer proofs that may not be free.
  So the world outside is made to stand.

  I raise up my palms to the light and the sand,
  Still doubt asks the witness: who guarantees me?
  Here is this hand, and here is the other hand.

  The evidence rests in the open palm's span,
  But the warrant stays hidden, unable to flee.
  So the world outside is left to stand.

  The gesture is clear, though the path is unplanned,
  And sight gives the shape, but not the decree.
  Here is my hand, and here is the other hand.
  So the world outside is left to stand.
