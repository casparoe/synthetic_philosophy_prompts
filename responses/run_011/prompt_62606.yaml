answer: |-
  You have $100,000 in a savings account and exactly one opportunity to invest in a biotech stock awaiting a binary FDA ruling in thirty days, after which the position must be closed. The stock currently trades at $100, and you can buy any number of shares without leverage beyond a standard cash account. There are two possible outcomes: with 80% probability, the drug fails and the stock drops to $50 (a 50% loss on your invested capital); with 20% probability, the drug is approved and a buyout occurs, pushing the stock to $600 (a 500% gain on your invested capital). You must choose now between an Aggressive strategy (investing 100% of your capital) and a Kelly strategy (investing 25% of your capital), with no option to rebalance or reinvest regardless of the outcome.

  **Structural Feature and Justification**
  I picked option (b): the large crowd of independent people. This keeps the growth-rate argument alive without temporal repetition because it shifts the benchmark from the *ensemble average* (expected value across all possible outcomes) to the *time average* (the outcome experienced by a typical single trajectory). In a highly skewed distribution, the arithmetic mean is driven by rare outliers that most individuals will not experience. The growth-rate criterion (maximizing expected log wealth) aligns with the median outcome of the crowd—the result a "typical" person gets—whereas EV maximization aligns with the mean outcome, which is unrepresentative for any single member. Since you are a single trajectory through this decision, not the entire distribution, the growth-rate argument retains force by optimizing for what actually happens to you rather than what happens on average across parallel universes.

  **Walkthrough**
  *   **Aggressive (100% Invest):**
      *   **Outcomes:** 80% chance wealth becomes $50,000; 20% chance wealth becomes $600,000.
      *   **Expected Dollars:** $(0.8 \times 50,000) + (0.2 \times 600,000) = 40,000 + 120,000 = \mathbf{\$160,000}$.
      *   **Expected Log Wealth:** $0.8 \ln(50,000) + 0.2 \ln(600,000) \approx 0.8(10.82) + 0.2(13.30) = 8.656 + 2.66 = \mathbf{11.316}$.
  *   **Kelly (25% Invest):**
      *   **Outcomes:** 80% chance wealth becomes $100,000 - 0.25(50,000) = \$87,500$; 20% chance wealth becomes $100,000 + 0.25(500,000) = \$225,000$.
      *   **Expected Dollars:** $(0.8 \times 87,500) + (0.2 \times 225,000) = 70,000 + 45,000 = \mathbf{\$115,000}$.
      *   **Expected Log Wealth:** $0.8 \ln(87,500) + 0.2 \ln(225,000) \approx 0.8(11.38) + 0.2(12.32) = 9.104 + 2.464 = \mathbf{11.568}$.
  *   **Comparison:** The Aggressive choice has higher expected dollars ($160k vs $115k). The Kelly choice has higher expected log wealth (11.568 vs 11.316).
  *   **Probability Kelly Leaves You Richer:** In the 80% loss branch, Kelly ($87.5k) beats Aggressive ($50k). In the 20% win branch, Aggressive ($600k) beats Kelly ($225k). The probability Kelly leaves you with more money is **80%**.
  *   **Gap Size:** In the loss branch (80%), Kelly leaves you $37,500 ahead. In the win branch (20%), Aggressive leaves you $375,000 ahead.
  *   **Load-Bearing Quantity:** The probability of the loss state (80%). This skew creates the divergence between the mean (pulled by the win) and the median (anchored by the loss).
  *   **Sensitivity:** If you cut the loss probability in half (to 40% loss, 60% win), the skew diminishes. The Aggressive EV jumps to $380,000. The Kelly optimal fraction rises to ~74%, yielding an EV of ~$307,000 and an Expected Log of ~5.34, while Aggressive Expected Log rises to ~5.39. The verdict flips: Aggressive wins on both dollars and log-wealth because the edge is strong enough to overcome variance drag.

  **Strongest Objection**
  The expected-value maximizer argues: "You are not a crowd; you are an individual facing a single draw. The 'typical outcome' is not a rigorous metric for decision theory—utility is. If you can afford to drop to $50,000 without ruin, the extra $375,000 in the win case represents real purchasing power that log-utility artificially dampens. By choosing Kelly, you are paying a $45,000 premium in expected value to insure against a outcome you can survive, simply because the distribution is skewed. That is a preference for safety, not a mathematical truth about growth."

  This objection lands. In a strict one-shot scenario with linear utility of money, EV is the correct maximizer. The growth-rate argument only wins if you accept that "typicality" (median) is a better proxy for your utility than "average" (mean) in skewed environments.

  **Verdict**
  I would make the Kelly choice. It depends on whether I view the 20% win state as "real" value or a lottery ticket; since I will likely experience the 80% loss state, optimizing for the typical outcome protects me from the most probable reality rather than betting on a tail event I probably won't see.
