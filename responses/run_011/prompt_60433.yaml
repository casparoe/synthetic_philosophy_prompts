          *   *Accuracy:* Generally accurate summary of Mises's core point in "Economic Calculation in the Socialist Commonwealth."
          *   *Nuance:* Mises focused on the absence of genuine market prices for production goods, not just ownership per se, but ownership is the mechanism for prices.
          *   *Verdict:* Fair summary.

