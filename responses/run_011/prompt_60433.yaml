          *   *Accuracy:* Accurate. Hayek emphasized dispersed tacit knowledge vs. the neoclassical assumption of perfect information/mathematical solvability (Barone/Hicks).
          *   *Verdict:* Fair summary.

      *   *Claim 3 (Lange & Concession):* "Lange answered that a socialist planning board could simply do what the market does, setting prices by trial and error and instructing managers to minimize average cost and produce where marginal cost equals price, so socialism could calculate after all, and Mises basically conceded the point."
          *   *Accuracy:* Lange did propose trial-and-error (iterative planning).
          *   *Error:* Mises did *not* concede the point. He remained skeptical that a planning board could simulate the entrepreneurial function without private property risk.
          *   *Verdict:* The Lange part is fair, the Mises concession part is historically wrong.

