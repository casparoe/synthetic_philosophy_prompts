  TO: The Board of Directors, Ferrand Press
  FROM: [Your Name], Director
  DATE: October 23, 2023
  SUBJECT: Decision on Corbie Extension for Corvina Series

  We face a technical necessity with strategic consequences. The Corvina Series requires diacritics and a bold weight Corbie does not possess. We have three proposals and one constraint we cannot ignore: the press's solvency and its identity.

  Option Two (the hand-redraw) must be rejected. Regardless of typographic purity, the studio's condition—that the face be renamed—severs the ninety-year continuity this press sells. We cannot afford to lose the name Corbie. It is our only tangible heritage. To rename it is to admit our history ended in 1937.

  Option Three (the specification) is a delay tactic we cannot fund. Writing a measurable specification requires expertise we lack internally. Tendering it competitively adds months to a timeline that must meet the autumn launch. The Trustee is correct that compliance should be verified, but verification requires a baseline we do not have time to codify before production begins.

  This leaves Option One (the digital foundry). It retains the name. It fits our budget. The timeline (nine months) meets the launch.

  The blind test complicates this. Four directors preferred the interpolated digital sheet over the 1934 proof. Two preferred the proof. This confirms the Trustee's suspicion: the distinction we fear losing is not clearly visible to us. If the board cannot reliably identify the original artifact, we cannot justify spending four times the fee on a hand-cut revival. However, the fact that two of us identified the proof means the distinction exists, even if it is subtle.

  Therefore, I recommend we proceed with Option One, subject to two conditions that address the Trustee's concern regarding the "uncapturable" distinction.

  **Budget and Timeline**
  We accept the foundry's modest fee. Payment is split: 40% on contract, 40% on delivery of diacritics, 20% on final bold weight. Total cost must not exceed 15% of the Corvina Series production budget. Delivery is required by March 1st to allow for typesetting before autumn.

  **Credit Line**
  The title page will read: *Set in Corbie, extended for the Corvina Series by [Foundry Name] under the supervision of Ferrand Press.* This maintains the lineage while acknowledging the modification.

  **The Working Test**
  Metrics alone cannot judge a face. However, we require the foundry to submit a "Reference Sheet" for every new glyph. This sheet must show the new character overlaid on the surviving 10-point punches (scanned at 2400dpi). Compliance is verified by two measures:
  1.  **Metric:** Stroke contrast and x-height must remain within 5% of the 10-point master.
  2.  **Visual:** The new glyph must not appear darker or lighter than the surrounding text when printed at 10-point on our standard stock.

  **The Uncapturable Element**
  The Trustee is right: no test captures the spirit of Vaszary's cut. The stress axis, the flat side of the o, the Q's tail—these can be measured, but their harmony cannot. When the metrics pass but the eye falters, who decides?

  This board will not exist in ninety years. We cannot leave this judgment to future boards who will lack our context. The judgment must reside in a permanent office, not a person. I propose we designate the **Press Editor** as the Steward of Corbie. This role holds veto power over any glyph that passes the metric test but fails the visual harmony. This authority is attached to the office, not the individual, ensuring continuity beyond our tenures.

  We are spending money we do not have on a distinction we cannot state. But we are spending the minimum required to keep the name. To spend more is imprudent; to spend less is erasure.

  Vote yes on Option One with the Stewardship clause.
