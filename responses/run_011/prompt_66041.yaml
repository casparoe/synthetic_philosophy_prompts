  1. Work through the problem independently before assessing the script: the ideal point, the Kalai–Smorodinsky solution, the Nash solution, and the transformed problem in part (c). Note explicitly where your results agree or disagree with the student's.
  2. Award marks part by part against the allocations above, with a total out of 25.
  3. Write the feedback comments I would return to the student. They must be anchored to particular sentences or steps in the script, not general impressions: state what is correct and why, and where a definition, axiom, or piece of reasoning is wrong or overstated, give the correct version. Where the cheapest way to show that a general claim fails is a counterexample, supply a concrete one — a specific feasible set and disagreement point with the relevant payoffs computed.
  4. Distinguish substantive errors from loose but defensible phrasing, and say which category each remark falls into. Where the student reaches a correct conclusion by an incorrect route, mark and comment on the route rather than crediting the conclusion.
  5. Flag anything the student has got right that is easy to get wrong, since I need that for calibration.
  6. If any part of the question admits more than one standard convention — for instance in how the ideal point is defined — say so, and explain whether the student's usage is affected by the ambiguity.

  Please present the deliverable as a per-part mark with attached comments, followed by the total and a brief statement of what principally drove the mark up or down.
