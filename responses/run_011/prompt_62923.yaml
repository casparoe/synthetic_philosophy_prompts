prompt: |-
  I'm taking a social epistemology / behavioral econ seminar this term and for my final project I'm coding a dataset of roughly 200 situations where a bunch of people converged on the same choice really fast — analyst upgrades on a stock, crowdfunding campaigns going vertical, a subreddit collectively diagnosing someone, half a subfield switching to the same assay in one year, that kind of thing. Each row gets a label for *why* the herd happened, not just a note that it did. The trouble is that basically every explanation in the literature predicts the exact same visible thing, namely later movers doing what earlier movers did, and I keep catching myself assigning labels based on how the story sounds rather than on anything in the data.

  So: write me a decision tree I can run down a row of the spreadsheet, where every branch question keys off a feature I could actually check from the outside — whether later actors can see the individual prior choices or only the running total, whether the payoff to copying is public or private, whether the actors are evaluated on absolute or relative performance, whether the crowd ever gets feedback on whether it was right, whether dissenting carries a social cost that's visible to me, whether the action is reversible, how long the whole thing took, whether the early movers had any special access. If a question can't be phrased that way, either rewrite it or drop it and say you dropped it. No asking me to know what's in anyone's head, and no "do the agents have common knowledge of rationality" unless you also tell me what that would look like as a column.

  Leaves I need, at minimum: a classic Bayesian informational cascade of the Bikhchandani-Hirshleifer-Welch shape where the third person's private signal gets swamped by the public history; a case where there's a genuine payoff externality so following is just correct even if you already know everything; reputational herding à la Scharfstein and Stein, where sharing the blame for a failure matters more than being right; plain normative conformity where people have their own evidence and are overriding it to be accepted; and pluralistic ignorance / preference falsification where everyone privately disagrees and each wrongly infers from the others' silence that they agree. If you think there are more live mechanisms — coordination and convention feel like they might deserve their own leaf, and I don't know where "everyone's just using the same salient source" goes — add them and say why.

  Three extra things:

  1. Be blunt about observational equivalence. My suspicion is that several of your leaves produce literally the same trace and are only separable if I grant an extra assumption, so group the ones that collapse into the same observable pattern into equivalence classes, and for each tie tell me what data would break it. Where it can't be broken even in principle, say so instead of leaving a fake branch.
  2. Map out the logical space before you name the positions — what the branch answers permit, then which cells are actually occupied. Where a cell comes out empty (say: agents copy the crowd, have private evidence pointing the other way, and end up better off for it), tell me whether that's incoherent, unappealing, or just unexplored and worth a look.
  3. Tell me which leaf I'm most likely to reach for wrongly by default, and what in the row would give me away.

  Keep it shallow enough that one row takes me about five minutes, and flag any pair of leaves your tree just can't separate rather than papering over it. Also, no citations needed — I've got the readings, what I'm missing is the sorting instrument.
reasoning: |-
  Here's a thinking process that leads to the suggested decision tree and analysis:

  1.  **Deconstruct the Request:**

      *   **Goal:** Create a decision tree for coding a dataset of ~200 "herding" events (fast convergence on a choice).
      *   **Constraint 1 (Crucial):** All branch questions must be based on *observable features* (external data), not internal mental states (beliefs, rationality, private signals).
      *   **Constraint 2:** Must distinguish specific mechanisms: Bayesian Informational Cascades (BHW), Payoff Externalities, Reputational Herding (Scharfstein-Stein), Normative Conformity, Pluralistic Ignorance/Preference Falsification.
      *   **Constraint 3:** Add other relevant mechanisms (Coordination/Convention, Salient Sources).
      *   **Requirement 1:** Be blunt about observational equivalence. Group indistinguishable leaves into equivalence classes and specify what data would break the tie (or admit it's impossible).
      *   **Requirement 2:** Map logical space vs. occupied cells. Identify empty/incoherent cells.
      *   **Requirement 3:** Identify the most likely misclassification trap.
      *   **Constraint 4:** Keep it shallow (5 minutes per row).
      *   **Constraint 5:** No citations, just the sorting instrument.

  2.  **Analyze the Mechanisms (Mental Models to Observable Proxies):**

      *   *Bayesian Informational Cascade (BHW):* Agents have private signals. Public actions reveal signals. Eventually, public history outweighs private signal. *Observable:* Private info is possible/likely? Actions are sequential? Early movers don't have massive advantage? Outcome uncertainty remains high until resolved?
      *   *Payoff Externality (Network Effects/Complementarities):* My payoff increases if you do it too. *Observable:* Value of action increases with number of adopters? (e.g., software, standards).
      *   *Reputational Herding (Scharfstein-Stein):* Agents care about looking smart to a principal. "Safety in numbers." *Observable:* Agents are professionals/agents? Evaluation is relative/peer-based? Failure shared is better than failure alone?
      *   *Normative Conformity:* Social cost of dissent. *Observable:* Visible punishment for dissent? Group identity markers?
      *   *Pluralistic Ignorance:* Everyone privately disagrees but thinks others agree. *Observable:* Post-event surveys showing private disagreement? Or anonymous channels showing dissent vs. public silence?
      *   *Coordination/Convention:* Need to match others to succeed, no inherent "right" answer. *Observable:* Multiple equilibria possible? Action is arbitrary but needs consensus?
      *   *Common Source (Spurious Herding):* Everyone reacts to the same news, not each other. *Observable:* Simultaneity? Common feed?

  3.  **Drafting the Decision Tree (Iterative Process):**

      *   *Attempt 1 (Mental):* Do they have private info? (Can't observe). -> *Correction:* Can they *have* private info based on role?
      *   *Attempt 2 (Mental):* Did they benefit from copying? (Can't observe utility). -> *Correction:* Is the benefit structural (network effect) or outcome-based?
      *   *Attempt 3 (Focusing on Observables):*
          1.  Is the value of the action dependent on others doing it? (Payoff Externality).
          2.  Are they being evaluated by a boss/market on relative performance? (Reputational).
          3.  Is there a penalty for standing out? (Normative).
          4.  Is there a common shock? (Spurious).
          5.  Is it sequential with private info potential? (BHW).

      *   *Refining for Observability:*
          *   "Value dependent on others" -> Check if the product/action becomes more useful as adoption grows (compatibility, liquidity).
          *   "Evaluated on relative performance" -> Check if agents are fund managers, analysts, etc., where benchmarking is standard.
          *   "Penalty for standing out" -> Check for visible social sanctions (doxxing, firing, ostracization) in the record.
          *   "Sequential/Private Info" -> Check if actions are timestamped individually vs. aggregate only. Check if early movers had unique access.
          *   "Pluralistic Ignorance" -> This is hard. Needs evidence of private vs. public divergence *after* the fact.

  4.  **Addressing Observational Equivalence (The Hard Part):**

      *   BHW vs. Reputational Herding: Both look like "ignoring private signal to follow public."
          *   *Distinction:* Reputational usually involves agents (managers) vs. principals. BHW can be anyone. Reputational implies "being wrong together is okay." BHW implies "I think they know something I don't."
          *   *Observable:* Are the actors employees/agents? Is there a principal watching?
      *   BHW vs. Common Source: Both look like rapid convergence.
          *   *Distinction:* Timing. Common source = simultaneous. BHW = sequential chain reaction.
      *   Normative vs. Pluralistic Ignorance:
          *   *Distinction:* Pluralistic ignorance *requires* evidence that people privately disagreed. Normative just requires evidence that dissent was punished.
          *   *Equivalence:* Without anonymous surveys post-event, these are often indistinguishable. I need to flag this.

  5.  **Mapping Logical Space:**

      *   What combinations are impossible?
      *   Example: Payoff Externality + Private Signal Ignored. If the payoff is strictly external (network effect), you *should* follow regardless of private signal. So "ignoring signal" isn't a cascade, it's optimal.
      *   Example: Reputational Herding without a Principal. Incoherent.

  6.  **Identifying the Trap:**

      *   The most common error is labeling everything a "Cascade" (BHW). It's the default "rational" explanation.
      *   Giveaway: If everyone moved *simultaneously* upon a news drop, it's not a cascade (which requires sequential updating). It's common knowledge updating.

  7.  **Finalizing the Tree Structure (for 5-min coding):**

      *   Need binary or trinary questions.
      *   Need clear "Yes/No" criteria based on columns in the spreadsheet.
      *   Need to group the "Unseparable" leaves at the end.

      *   *Step 1: Spurious Herding (Common Source).* Did a public signal hit everyone at once?
      *   *Step 2: Payoff Externality.* Does the action get better if others do it? (Network/Standard).
      *   *Step 3: Reputational/Agency.* Are actors agents being judged by a principal?
      *   *Step 4: Social Sanctions.* Is there visible cost to dissent?
      *   *Step 5: Information Structure.* Sequential vs. Simultaneous? Visible individual choices vs. Aggregate?
      *   *Step 6: Post-Event Evidence.* Did people admit they privately disagreed? (Pluralistic Ignorance).

      *   *Refinement:* Merge BHW and Coordination/Convention carefully. Coordination is about *matching*. BHW is about *truth*.
      *   *Refinement:* Pluralistic Ignorance is notoriously hard to code from outside. I need to make sure the user knows they need a specific column for "Post-event private dissent revealed."

  8.  **Drafting the Content (incorporating constraints):**

      *   *Intro:* Acknowledge the difficulty.
      *   *The Tree:* 5-6 questions max.
      *   *Equivalence Classes:* Explicitly state where the tree fails.
      *   *Logical Space:* Discuss empty cells.
      *   *The Trap:* Highlight the "Cascade" default bias.

      *(Self-Correction during drafting)*: I need to make sure I don't ask "Did they have private info?" because I can't see that. I must ask "Is the setup *compatible* with private info?" (e.g., decentralized actors vs. centralized command).
      *(Self-Correction)*: For Pluralistic Ignorance, if the dataset doesn't have a column for "Leaked internal dissent," I can't code it. I must instruct the user to add that column or mark it "Unverifiable." I will advise adding a column for "Post-hoc evidence of private dissent."

      *(Refining the "Observational Equivalence" section)*: BHW and Reputational Herding are the big ones. They look identical in action (follow the crowd despite private doubt). The only observable difference is the *incentive structure* (Agent/Principal vs. Individual/Truth).

      *(Refining Logical Space)*: Consider the cell: "Payoff Externality + Private Signal Contradicts Action." If the network effect is strong enough, the private signal about *quality* doesn't matter, only the signal about *adoption*. This isn't a cascade, it's a coordination game. I need to make sure the tree separates these.

  9.  **Final Polish:** Check tone (blunt, academic but practical), check constraints (no citations, 5 mins/row). Ensure the "Leaves" match the user's requested list.

      *   *Leaves to hit:* BHW, Payoff Externality, Reputational, Normative, Pluralistic Ignorance.
      *   *Additions:* Common Source (Spurious), Coordination/Convention.

      *   *Tree Logic:*
          1.  Common Shock? (Yes -> Spurious).
          2.  Value increases with adoption? (Yes -> Payoff Externality/Coordination).
          3.  Agents judged by Principal? (Yes -> Reputational).
          4.  Visible Sanctions for Dissent? (Yes -> Normative).
          5.  Post-hoc Private Dissent? (Yes -> Pluralistic Ignorance).
          6.  Else -> Informational Cascade (BHW).

      *   *Wait, one nuance:* Coordination vs Payoff Externality. Often the same. I'll group them but distinguish "Arbitrary Standard" (Coordination) vs "Network Value" (Externality). Actually, for coding purposes, they behave similarly (follow the crowd because crowd makes it valuable). I will group them as "Strategic Complementarity."

      *   *Wait, another nuance:* BHW requires sequentiality. If everyone moves at once, it's not BHW. I need to put Sequentiality early.

      *   *Revised Tree Order:*
          1.  Simultaneity (Common Source).
          2.  Strategic Complementarity (Payoff/Coordination).
          3.  Agency Structure (Reputational).
          4.  Social Sanctions (Normative).
          5.  Private Dissent Evidence (Pluralistic Ignorance).
          6.  Default (BHW).

      *   *Equivalence:* Reputational and BHW are the big equivalence class. I need to be very clear that without knowing the *utility function* (which we infer from role), they are the same.
      *   *Pluralistic Ignorance:* Requires specific data. If missing, collapses into Normative.

      *   *Logical Space:* "Copying makes you worse off" -> Incoherent for Payoff Externality. "Copying with no private signal" -> Not a cascade, just imitation.

      *   *Trap:* Coding "Common Source" as "Cascade."

      Let's write it.

      *(Final check on constraints)*: "No asking me to know what's in anyone's head." -> Ensure questions are about *structure* (roles, visibility, timing), not *thoughts*.
      "Map out logical space." -> Add a section on this.
      "Tell me which leaf I'm most likely to reach for wrongly." -> Add a section on this.
