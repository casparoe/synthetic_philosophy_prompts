answer: |-
  Here is the sorting instrument. It is designed to be run in under five minutes per row using only external, structural features of the event.

  ### Part 1: The Decision Tree

  **Pre-requisite Columns:** Before running the tree, ensure your spreadsheet has these binary (Y/N) or categorical columns. If you don't have the data, mark "Unknown" and follow the "Unknown" path.
  1.  **Timing:** *Simultaneous* (all within one news cycle/window) vs. *Sequential* (clear chain reaction).
  2.  **Visibility:** *Individual Actions Visible* (I see who did what) vs. *Aggregate Only* (I see total count, not names).
  3.  **Incentive Structure:** *Network/Complementarity* (Action value $\uparrow$ as others adopt) vs. *Independent Value* (Action value fixed regardless of others).
  4.  **Agency:** *Principal-Agent* (Actors are judged by a boss/market) vs. *Principal-Principal* (Actors are owners/end-users).
  5.  **Sanction Visibility:** *Visible Cost to Dissent* (Firing, doxxing, ostracization recorded) vs. *No Visible Cost*.
  6.  **Post-Hoc Dissent:** *Evidence of Private Disagreement* (Leaked chats, anonymous surveys, memoirs admitting doubt) vs. *None*.

  ---

  **Start Here:**

  **Q1. Did the convergence happen simultaneously upon a public signal?**
  *(Check Timing: Simultaneous + Public News Drop)*
  *   **YES:** $\rightarrow$ **Leaf A: Spurious Herding (Common Source).**
      *   *Why:* Agents aren't copying each other; they are all reacting to the same input. No social learning occurred.
      *   *Stop.*
  *   **NO:** $\rightarrow$ Go to Q2.

  **Q2. Does the value of the action increase structurally if others take it?**
  *(Check Incentive Structure: Network/Complementarity. E.g., software compatibility, assay standardization, liquidity.)*
  *   **YES:** $\rightarrow$ **Leaf B: Strategic Complementarity (Payoff Externality / Coordination).**
      *   *Why:* Copying is instrumentally rational regardless of private beliefs. The "herd" creates the value.
      *   *Stop.*
  *   **NO:** $\rightarrow$ Go to Q3.

  **Q3. Are the actors agents being evaluated by a principal?**
  *(Check Agency: Fund managers, analysts, corporate R&D vs. retail investors, hobbyists.)*
  *   **YES:** $\rightarrow$ **Leaf C: Reputational Herding.**
      *   *Why:* Actors maximize career safety, not necessarily truth. "Being wrong with the herd" is safer than "being right alone."
      *   *Stop.*
  *   **NO:** $\rightarrow$ Go to Q4.

  **Q4. Is there a visible social or material cost to dissenting?**
  *(Check Sanction Visibility: Public shaming, loss of status, banned accounts.)*
  *   **YES:** $\rightarrow$ Go to Q5.
  *   **NO:** $\rightarrow$ **Leaf D: Informational Cascade (BHW).**
      *   *Why:* No external penalty, no payoff benefit. Actors are rationally ignoring private signals because public history is statistically more informative.
      *   *Stop.*

  **Q5. Is there post-hoc evidence that actors privately disagreed while publicly conforming?**
  *(Check Post-Hoc Dissent: Leaked logs, anonymous post-mortems.)*
  *   **YES:** $\rightarrow$ **Leaf E: Pluralistic Ignorance / Preference Falsification.**
      *   *Why:* The public equilibrium does not match the private distribution of beliefs.
      *   *Stop.*
  *   **NO:** $\rightarrow$ **Leaf F: Normative Conformity.**
      *   *Why:* Actors may or may not have privately disagreed, but the observable mechanism is enforcement of a norm. Without evidence of private dissent, you cannot distinguish this from simple compliance.
      *   *Stop.*

  ---

  ### Part 2: Observational Equivalence Classes

  You suspected that different mechanisms produce the same trace. You are right. The tree above forces a distinction based on *structure*, but in practice, several leaves are observationally equivalent without specific data.

  **Equivalence Class 1: The "Rational Copy" Cluster (Leaves C, D, F)**
  *   **The Collapse:** Reputational Herding (C), Informational Cascade (D), and Normative Conformity (F) all look identical in the data: *Sequential actions where later actors match earlier actors despite potential private information to the contrary.*
  *   **The Tie-Breaker:** You can only separate them if you have data on the **Utility Function** (Agency column) or **Sanctions** (Sanction Visibility column).
  *   **The Hard Truth:** If you do not know if the actors are agents (C) or if dissent was punished (F), you cannot distinguish Reputational, Informational, or Normative motives. They collapse into a single "Rational Imitation" class. If your dataset lacks the "Agency" or "Sanction" columns, code all three as **Unidentified Rational Herding**.

  **Equivalence Class 2: The "Silent Dissent" Cluster (Leaves E, F)**
  *   **The Collapse:** Pluralistic Ignorance (E) is a subset of Normative Conformity (F).
  *   **The Tie-Breaker:** You *must* have the "Post-Hoc Dissent" column.
  *   **The Hard Truth:** Pluralistic Ignorance is **unobservable in real-time**. By definition, the public record looks like agreement. If you code Pluralistic Ignorance without a leaked memo or anonymous survey in your row, you are guessing. If that column is empty, default to Normative Conformity.

  **Equivalence Class 3: The "Standard" Cluster (Leaf B)**
  *   **The Collapse:** Payoff Externality (Network Effects) and Coordination (Convention).
  *   **The Tie-Breaker:** Does the action have intrinsic value (Payoff) or is it arbitrary (Coordination)?
  *   **The Hard Truth:** This rarely matters for coding the *herd mechanism*. In both cases, agents follow the crowd because the crowd makes the action valuable. Keep them merged as **Strategic Complementarity**.

  ---

  ### Part 3: Logical Space Map (Occupied vs. Empty Cells)

  Here is the matrix of logical possibilities. I have flagged cells that are incoherent or theoretically empty.

  | Private Signal | Public History | Payoff Externality? | Social Sanction? | Agent/Principal? | **Resulting Mechanism** | **Status** |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Follow** | **Follow** | **No** | **No** | **No** | **Informational Cascade** | **Occupied** (Classic BHW) |
  | **Follow** | **Follow** | **Yes** | **No/Yes** | **No** | **Strategic Complementarity** | **Occupied** (Network/Standards) |
  | **Follow** | **Follow** | **No** | **No** | **Yes** | **Reputational Herding** | **Occupied** (Scharfstein-Stein) |
  | **Follow** | **Follow** | **No** | **Yes** | **No** | **Normative Conformity** | **Occupied** (Social Pressure) |
  | **Disagree** | **Follow** | **No** | **Yes** | **No** | **Pluralistic Ignorance** | **Occupied** (Requires post-hoc proof) |
  | **Follow** | **Follow** | **No** | **No** | **No** | **Spurious Herding** | **Occupied** (If Simultaneous) |
  | **Disagree** | **Follow** | **No** | **No** | **No** | **Irrational Mimicry** | **Empty/Incoherent** (If rational, why follow?) |
  | **Follow** | **Disagree** | **Any** | **Any** | **Any** | **Contrarianism** | **Occupied** (Not a herd) |
  | **Disagree** | **Follow** | **Yes** | **No** | **No** | **Optimal Coordination** | **Occupied** (Signal irrelevant, payoff rules) |

  **The "Impossible" Cell:**
  *   *Cell:* Agents copy the crowd + Have private evidence pointing the other way + End up **worse off** structurally (no payoff externality) + No social sanction + Not agents.
  *   *Verdict:* **Incoherent.** If there is no payoff benefit, no reputational safety, and no social punishment, a rational actor with a contradicting private signal should not follow. If you see this in the data, either your "Private Evidence" assumption is wrong (they didn't actually have a signal) or the actors are irrational (behavioral bias, not epistemic herd). Code as **Behavioral Bias** (e.g., availability heuristic) rather than epistemic herding.

  ---

  ### Part 4: The Default Trap

  **The Leaf You Will Overuse:** **Informational Cascade (Leaf D).**

  **Why:** It is the "null hypothesis" of rational herding. It sounds sophisticated ("Bayesian updating") and requires the least amount of structural data to justify. It is the default explanation for "smart people doing dumb things."

  **What Gives You Away:**
  1.  **Simultaneity:** If you code a Cascade but the actions happened within the same hour following a news drop, you are wrong. Cascades require *sequential* updating (Person 1 acts, Person 2 sees Person 1, Person 2 acts...). If everyone moves at once, it is **Spurious Herding (Leaf A)**.
  2.  **Lack of Privacy:** If you code a Cascade but the actors are in a public meeting room or a transparent blockchain wallet where *everyone* sees *everyone's* signals instantly, the "private signal swamping" logic of BHW breaks down. Cascades require information asymmetry.
  3.  **The "Assay" Problem:** In your example of "half a subfield switching to the same assay," do not code this as Informational Cascade. It is almost certainly **Strategic Complementarity (Leaf B)**. If I use Assay X and you use Assay Y, we cannot compare results. I follow you not because I think you know the truth, but because I need to be compatible with you.

  **Final Instruction:**
  If you reach the end of the tree and feel you are forcing a row into **Informational Cascade** because you lack data on sanctions or agency, stop. Recode that row as **Unidentified Rational Herding**. It is better to admit observational equivalence than to invent a mechanism your data cannot support.
