      *One last check on "Coordination/Convention".* The prompt asks to add if live. Yes, "Switching to the same assay" is often coordination (need to compare results) not just information. I will add "Strategic Complementarity" to cover Payoff Externality + Coordination.

      *Structure:*
      1. The Decision Tree (The Instrument).
