prompt: |-
  Cant remember the title of this pop-neuro book I was leafing through, and it doesn't matter -- but it glossed Block's distinction like this: "Block split consciousness into access consciousness, basically whether you can report something, and phenomenal consciousness, the raw feel. Global workspace theory is that same split done properly in the brain: a bit of information becomes conscious when it ignites the prefrontal workspace and gets broadcast, so feeling and reportability only come apart when the broadcast fails. Sperling's partial-report experiments show that we briefly see every letter in the array consciously and then lose access, which is exactly why the theory needs phenomenal content that isn't accessed. So the hard problem turns into an engineering question about broadcasting."

  I'm inclined to think the access/phenomenal distinction is real and doing serious work, so parts of this felt off to me, but I couldn't say which. Could you go through it sentence by sentence and tell me what a philosopher of mind working on consciousness would accept, what would make them wince, and what's just wrong? Two things I especially want pinned down: whether access consciousness is really about reporting, or whether the book is using a technical term in its everyday sense -- and whether the Sperling bit is an established result or one contested reading of it, because I have a vague memory that the people running global workspace experiments read that data the opposite way. Finally, does the last sentence follow from anything true in the rest? Please answer in American English.
