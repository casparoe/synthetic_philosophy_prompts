answer: |-
  Here is a sentence-by-sentence breakdown from the perspective of a contemporary philosopher of mind. Your intuition that something felt "off" is well-founded; the paragraph you read conflates several distinct debates and presents a contested viewpoint as settled fact.

  ### Sentence 1
  > *"Block split consciousness into access consciousness, basically whether you can report something, and phenomenal consciousness, the raw feel."*

  *   **What a philosopher would accept:** This is the standard introductory shorthand for Ned Block's 1995 distinction. Phenomenal consciousness (P-consciousness) is indeed defined as "what it is like" to have an experience (the raw feel).
  *   **What would make them wince:** Defining Access consciousness (A-consciousness) *basically* as "whether you can report something" is technically imprecise. For Block, A-consciousness is about a representation being "poised" for use in reasoning, rational control of action, and speech. Reportability is the primary *test* we use to detect access, but it isn't the definition. A system could theoretically have access (guiding complex behavior) without verbal report.
  *   **What's wrong:** Nothing strictly false, but it leans toward the "everyday sense" of report. In technical literature, we distinguish between the *criterion* for consciousness (report) and the *nature* of consciousness (access/availability).

  ### Sentence 2
  > *"Global workspace theory is that same split done properly in the brain: a bit of information becomes conscious when it ignites the prefrontal workspace and gets broadcast, so feeling and reportability only come apart when the broadcast fails."*

  *   **What a philosopher would accept:** This accurately describes the mechanism of Global Workspace Theory (GWT). Proponents like Stanislas Dehaene and Bernard Baars do argue that "ignition" and broadcasting to the prefrontal cortex are the neural correlates of consciousness.
  *   **What would make them wince:** The phrase "that same split done properly" is highly contentious. Block argues that GWT explains *Access* consciousness perfectly but leaves *Phenomenal* consciousness untouched. GWT proponents, conversely, often argue that P-consciousness is an illusion or is identical to A-consciousness. They don't usually claim to be implementing Block's split; they claim to be explaining consciousness *simpliciter*, often by reducing the phenomenal to the access.
  *   **What's wrong:** The claim that "feeling and reportability only come apart when the broadcast fails" assumes what Block denies. Block argues they can come apart even when the system is functioning normally (e.g., you have a rich visual field you aren't attending to). GWT proponents argue that if broadcast fails, there was no consciousness there to begin with. This sentence papers over the central conflict between Block and the GWT camp.

  ### Sentence 3
  > *"Sperling's partial-report experiments show that we briefly see every letter in the array consciously and then lose access, which is exactly why the theory needs phenomenal content that isn't accessed."*

  *   **What a philosopher would accept:** This is Ned Block's specific reading of the data. He uses Sperling's iconic memory experiments to argue for "phenomenal overflow"—the idea that you consciously see more than you can report.
  *   **What would make them wince:** Your vague memory is correct. This is the most contested sentence in the paragraph. Proponents of GWT (like Dehaene) read Sperling's data the **opposite way**. They argue the iconic store is *pre-conscious* sensory memory. On their view, you only consciously see the letters you actually report (or attend to). The rest is unconscious processing.
  *   **What's wrong:** It presents Block's interpretation as an established fact ("Sperling's... experiments show"). In the literature, this is the "Overflow Debate." It is not settled science; it is a philosophical disagreement about how to interpret the psychophysics.

  ### Sentence 4
  > *"So the hard problem turns into an engineering question about broadcasting."*

  *   **What a philosopher would accept:** Almost nothing. This is a classic category error.
  *   **What would make them wince:** Severely. The "Hard Problem" (coined by David Chalmers) is specifically the problem of explaining *why* a physical process like broadcasting feels like anything at all. Explaining *how* broadcasting works (the engineering) solves the "Easy Problems" (function, behavior, report).
  *   **What's wrong:** This is a non sequitur. Even if GWT is perfectly true about broadcasting, it explains how information becomes *accessible*, not how it becomes *felt*. To claim the Hard Problem turns into an engineering question is to assert that Functionalism is true and the Hard Problem is a confusion. Many philosophers of mind reject this move entirely. It dissolves the problem by fiat rather than solving it.

  ***

  ### Pinning Down Your Specific Questions

  **1. Is Access Consciousness really about reporting?**
  The book is using a technical term in a slightly sloppy, everyday sense. In Block's formal definition, Access Consciousness is about **global availability** for reasoning and action control. Reportability is the *method* philosophers and scientists use to measure it, because it's the only window we have into another mind. However, equating the two creates a vulnerability: if you define access *as* report, you can't prove there is consciousness without report. Block wants to leave room for consciousness that exists without report (phenomenal overflow); GWTers often tighten the link to say no report (or potential report) means no consciousness.

  **2. Is the Sperling bit established or contested?**
  It is **heavily contested**, and your memory is spot on. This is the fault line between the "Phenomenal Realists" (Block) and the "Access Theorists" (Dehaene/GWT).
  *   **Block's view:** The icon is conscious (Phenomenal) but fades before you can report it (Access). Therefore, P > A.
  *   **GWT view:** The icon is unconscious sensory storage. Only the attended letters become conscious via ignition. Therefore, P = A.
  The book you read presented Block's view as if it were the consensus interpretation of the data, which it is not.

  **3. Does the last sentence follow from anything true in the rest?**
  No. It is a logical leap. Even if you accept the GWT description of broadcasting (Sentence 2) and Block's reading of Sperling (Sentence 3), you have only explained the *functional role* of consciousness (how data moves and is used). You have not explained *qualia* (why that data movement feels like redness or pain). The sentence assumes that explaining the function explains the experience, which is precisely what the Hard Problem denies. A philosopher would call this "begging the question" against the Hard Problem.

  ### Summary
  The book you were leafing through appears to be a popular science text trying to smooth over deep philosophical cracks. It presents a specific, functionally-oriented viewpoint (likely aligned with Dehaene or Dennett) but frames it as a neutral summary of Block's work. Your instinct that the access/phenomenal distinction is doing serious work is shared by a large portion of the field, and the text's attempt to reduce the Hard Problem to engineering is the specific point where most philosophers of mind would put the book down.
