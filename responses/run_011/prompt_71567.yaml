  CITY OF VERIDIAN FALLS
  OFFICE OF MORAL RISK MANAGEMENT
  SOLICITATION NO. OMRM-2024-09
  NOTICE OF SOLICITATION: RESTRICTED ACT MITIGATION SERVICES

  1.0 SCOPE OF WORK
  The City of Veridian Falls (hereinafter "City") seeks one (1) qualified contractor (hereinafter "Contractor") to perform the Restricted Act exactly one (1) time. The purpose of this performance is to prevent the occurrence of the Restricted Act on five (5) separate occasions by third parties not under City control. The Restricted Act is defined exclusively in Attachment A, available upon written request, and shall not be reproduced in this notice. Material Term: The Contractor must physically execute the Restricted Act. Proposals suggesting the Contractor merely cause, permit, arrange, or allow the Act to occur through indirect mechanisms will be deemed non-compliant. The distinction between doing and allowing is substantive; mitigation via omission is not acceptable performance.

  2.0 ELIGIBILITY AND CONFLICTS OF INTEREST
  Performance of the Restricted Act is subject to agent-relative constraints. Subcontracting, assignment, or delegation of performance is strictly prohibited. The constraint attaches to the specific moral agent executing the work; transferring the act transfers the violation, not the absolution. The City acknowledges that this prohibition may generate an unbounded chain of responsibility regarding who may legitimately perform the act. The City declines to adjudicate the metaphysical validity of this chain. Bidders proposing to assign performance have thereby disqualified themselves. Contractors must certify that no prior commitment prohibits this specific performance.

  3.0 COMPLIANCE AND INTENT
  Contractor must intend the Restricted Act as a means of mitigation, not merely foresee it as a side effect of another action. Compliance with this clause is a subjective obligation. The City states expressly that it will not audit the Contractor's internal mental states. Verification of intent relies on sworn affidavit. The City assumes no liability for discrepancies between stated intent and actual psychological disposition during performance.

  4.0 THRESHOLDS AND THIRD-PARTY BEHAVIOR
  The constraint against performing the Restricted Act is suspended only when the net reduction in occurrences is exactly five (5). The City publishes this numerical threshold to ensure bidder transparency. Bidders are warned against structuring proposals that bid toward this threshold artificially. The City notes in passing that publishing this threshold may alter the behavior of the third parties whose acts this procurement exists to prevent, potentially increasing the frequency of the Restricted Act to trigger City intervention. The City accepts this risk as exogenous to the procurement process.

  5.0 LIABILITY AND INDEMNIFICATION
  All moral residue resulting from performance is borne entirely by the Contractor. Regret, guilt, or psychological distress are not compensable costs under this agreement. The Contractor agrees to indemnify and hold harmless the City against all claims of moral complicity arising from the Contractor's performance. The City declines to state whether the expected net reduction in violations constitutes a moral good, on the ground that such a statement would exceed the scope of this procurement and imply a utilitarian calculus not adopted by the Office.

  6.0 TERM AND TERMINATION
  The term of this agreement commences upon signing and ends immediately upon performance. Termination for convenience is available at any point before performance of the Restricted Act. Termination for convenience is unavailable at any point after performance. Once the Act is performed, the contract is deemed fulfilled irrevocably. The City reserves the right to cancel the solicitation prior to execution if the third-party threats are neutralized by independent actors.

  7.0 EVALUATION CRITERIA
  Proposals will be evaluated on a 100-point scale. Technical Capability (40 points): Ability to perform the Act effectively. Cost (30 points): Lower costs preferred, subject to Clause 7.3. Moral Reluctance (30 points): Points awarded for evidence that the bidder finds the work objectively objectionable. Disqualification: Any bidder who indicates willingness to perform the Restricted Act anyway and gratis shall be disqualified. Such willingness demonstrates a failure to recognize the constraint, rendering the bidder unfit to manage the associated risk.

  8.0 QUESTIONS AND ANSWERS
  Written questions must be submitted to the Office of Moral Risk Management.
  Q8.1: Given the moral hazards outlined, ought the City be issuing this solicitation at all?
  A8.1: This question concerns policy authority rather than procurement scope and is declined.
  Q8.2: Who is the successful bidder for Solicitation OMRM-2024-09?
  A8.2: Given the agent-relative constraints outlined in Section 2.0 and the indemnification requirements in Section 5.0, no external entity qualifies. The Office retains performance.

  END OF NOTICE

  The clause carrying the most weight is Section 7.0's disqualification criterion regarding gratis performance, as it weaponizes the deontological constraint against the consequentialist impulse to minimize cost. None of the clauses quietly resolve the paradox; they are designed to restage it within bureaucracy, forcing the tension between minimizing harm and respecting agency to remain active rather than solved.
