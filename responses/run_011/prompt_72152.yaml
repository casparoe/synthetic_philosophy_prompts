  ### (a) Is the Jaspers material right?

  You have inverted Jaspers. In *The Question of German Guilt*, Jaspers argues that political guilt is inherent to citizenship regardless of individual agency; you are liable for the state's crimes even if you opposed them and had no power to stop them. You are using him to argue the opposite: that liability *creates* a right to influence. Furthermore, Jaspers was analysing a defeated totalitarian regime where the question was about accepting punishment, not claiming entitlements in a functioning democracy. Applying his framework of collective shame to a normative theory of franchise expansion is creative, but philosophically risky. You are using a theory of *consequence* to justify a theory of *power*. The edifice survives only if you admit you are borrowing the concept of 'political liability' while rejecting Jaspers' specific conclusions about agency. If you present this as faithful exegesis, an examiner familiar with the text will mark you down heavily.

  ### (b) Does paragraph 6 actually follow from paragraph 3?

  No, it does not follow cleanly. Paragraph 3 establishes that liability and voice should be coextensive (if liable, then voice). It does not establish that voice must be *compelled*. In most liberal frameworks, rights are waivable; I can be liable for a debt but choose not to pay until forced, yet I am not forced to earn the money. Compulsory voting transforms a right of agency into a duty of performance. To make this follow, you need an added premise: that the legitimacy of the state depends on every liable member actively ratifying its direction, not merely having the option to do so. This premise is arguably more controversial than compulsory voting itself, as it implies the state owns your political participation. You are conflating 'having a say' with 'obliged to speak'.

  ### (c) Steelman the best objection.

  Liability is fundamentally retrospective: it concerns answering for what has already been done in your name. The franchise is fundamentally prospective: it concerns deciding what shall be done next. To argue that past liability grants future power is a category error. A child inherits national debt (liability) but lacks the capacity to manage it (vote); a resident pays taxes (liability) but owes allegiance elsewhere (vote). If liability grounded the franchise, we would enfranchise the dead (who bear the legacy of past decisions) or disenfranchise the new-born (who bear no past liability). Your theory conflates being a subject of the state with being an author of the state. You have no answer to this in the draft; you simply assert position overrides properties, but you do not explain why retrospective burden converts into prospective authority.
