answer: |-
  # Exam Question: Formal Epistemology (Fourth Year)

  **Time Allowed:** 45 Minutes
  **Total Marks:** 20
  **Calculators:** Not Permitted

  **Question 1: The Partition Problem in Jeffrey Conditionalization**

  Jo is assessing whether a fabric swatch originated from a 19th-century batch ($H$). Her assessment relies on the swatch's colour. Her prior probability distribution over the colour partition $\{R, P, W\}$ (Red, Pink, White) and her conditional credences in $H$ are as follows:

  *   **Priors:** $P(R)=0.5, \quad P(P)=0.3, \quad P(W)=0.2$.
  *   **Conditionals:** $P(H|R)=0.8, \quad P(H|P)=0.4, \quad P(H|W)=0$.

  The showroom lights flicker on. Jo has a visual experience that raises her credence in Red to $0.75$. However, this experience can be described in two ways:
  1.  **Coarsely:** As a shift over $\{R, \neg R\}$ where $P_{new}(R)=0.75$.
  2.  **Finely:** As a shift over $\{R, P, W\}$ where $P_{new}(R)=0.75, \quad P_{new}(P)=0.2, \quad P_{new}(W)=0.05$.

  **(a)** Apply Jeffrey's Rule ($P_{new}(A) = \sum P(A|E_i)P_{new}(E_i)$) to both descriptions. Calculate the resulting posterior $P_{new}(H)$ for each. Furthermore, calculate $P_{new}(P)$ for both updates to demonstrate that the disagreement extends beyond $H$. **[6 marks]**

  **(b)** What has gone wrong? Is one description simply inaccurate, or does this reveal an incompleteness in Jeffrey Conditionalization (JC) as a normative rule? Discuss what additional principle is required to repair JC (e.g., a constraint on "direct influence") and what theoretical cost this repair incurs. **[8 marks]**

  **(c)** Could a bookie who knows Jo's priors and her disposition to update construct a diachronic Dutch Book against her based on this discrepancy? Explain what the bookie must be able to predict about Jo's cognitive processing of the experience to guarantee a profit. **[6 marks]**

  ***

  # Model Answer

  **(a) Calculations and Divergence**
  Jeffrey Conditionalization requires holding conditional probabilities $P(H|E_i)$ rigid while redistributing weights across the partition $E_i$.

  *Coarse Update $\{R, \neg R\}$:*
  We require $P(H|\neg R)$.
  $P(\neg R) = 0.5$. $P(H \cap \neg R) = P(H|P)P(P) + P(H|W)P(W) = (0.4 \times 0.3) + 0 = 0.12$.
  So, $P(H|\neg R) = 0.12 / 0.5 = 0.24$.
  $P_{new}(H) = P_{new}(R)P(H|R) + P_{new}(\neg R)P(H|\neg R)$
  $= (0.75 \times 0.8) + (0.25 \times 0.24) = 0.60 + 0.06 = \mathbf{0.66}$.

  To find $P_{new}(P)$, we assume rigidity within $\neg R$:
  $P_{new}(P) = P_{new}(\neg R) \times \frac{P(P)}{P(\neg R)} = 0.25 \times \frac{0.3}{0.5} = 0.25 \times 0.6 = \mathbf{0.15}$.

  *Fine Update $\{R, P, W\}$:*
  $P_{new}(H) = \sum P(H|E_i)P_{new}(E_i)$
  $= (0.8 \times 0.75) + (0.4 \times 0.2) + (0 \times 0.05)$
  $= 0.60 + 0.08 + 0 = \mathbf{0.68}$.
  Here, $\mathbf{P_{new}(P) = 0.2}$ (given directly by the new distribution).

  The updates yield different posteriors for $H$ ($0.66$ vs $0.68$) and $P$ ($0.15$ vs $0.2$).

  **(b) The Input Problem and Normative Status**
  The discrepancy arises from the "Input Problem" for Jeffrey Conditionalization. JC is a constraint on *how* to update given a specific input (a shift in probabilities over a partition), but it is not a theory of *what* constitutes the input. It does not specify which partition is privileged by a given experience.

  Neither description is mathematically "inaccurate"; both are valid applications of JC relative to their chosen partitions. The problem is normative: JC is incomplete because it fails to dictate which partition captures the "direct influence" of the experience. In the coarse update, the specific evidential weight distinguishing Pink from White is lost; the experience is treated as merely supporting "Red" against "Not-Red," preserving the prior ratio between Pink and White. In the fine update, the experience is treated as specifically discriminating between all three colours.

  To repair JC, we need a principle selecting the privileged partition. A common proposal (e.g., by Field or Christensen) is that the partition cells must be those *directly* affected by the experience, such that the experience provides no further information about the cells themselves. We might say the fine partition is correct only if the visual experience bears directly on the distinction between Pink and White, not just on Red vs. Others.

  The cost of this repair is significant. It requires formal epistemology to incorporate a phenomenological or psychological theory of "experience" to identify the atomic cells of direct influence. This threatens the purity of JC as a purely probabilistic norm. It moves the problem from probability theory to the philosophy of perception, requiring agents to introspectively identify the "basis" of their belief revision before applying the rule.

  **(c) Diachronic Dutch Book**
  A diachronic Dutch Book typically exploits violations of updating rules (like Conditionalization). Here, Jo follows JC in both cases, but the rule underdetermines her choice of partition.

  A bookie could construct a Dutch Book *if* Jo's choice of partition is predictable and leads to inconsistent valuations of bets over time. However, if Jo consistently uses the Fine partition, she is immune to a standard DB relative to that rule. The vulnerability arises if Jo's selection of the partition is itself irrational or manipulable.

  To guarantee a profit, the bookie must know more than Jo's priors and updating habit; the bookie must predict *which partition Jo will adopt* in response to the light. If the bookie knows Jo defaults to the Coarse partition when tired but Fine when alert, the bookie can sell bets before the light flickers (based on Fine expectations) and buy them back after (based on Coarse pricing), exploiting the shift in valuation caused by the partition switch. Without predicting the partition selection mechanism, the bookie cannot ensure the bets will be accepted at the conflicting prices. Thus, the Dutch Book threat targets the lack of a stable rule for partition selection, not JC itself.

  ***

  # Marking Scheme

  **Total: 20 Marks**

  **Part (a): Calculations and Divergence (6 Marks)**
  *   **2 Marks:** Correct calculation of Coarse $P_{new}(H) = 0.66$. (1 mark for deriving $P(H|\neg R)$, 1 mark for final sum).
  *   **2 Marks:** Correct calculation of Fine $P_{new}(H) = 0.68$.
  *   **2 Marks:** Correct calculation of $P_{new}(P)$ for both (Coarse $0.15$, Fine $0.2$) and explicit statement that the disagreement extends beyond $H$.
      *   *Error:* Failing to calculate $P_{new}(P)$ loses the final 2 marks.
      *   *Error:* Arithmetic mistakes (e.g., $0.75 \times 0.8 \neq 0.6$) cost 1 mark total across the section.

  **Part (b): Diagnosis and Repair (8 Marks)**
  *   **3 Marks (Diagnosis):** Identifying this as the "Input Problem" or underdetermination of the partition. Must state that JC is a constraint on revision, not a theory of evidence/experience.
      *   *Critical Distinction:* Must explain that *both* updates are valid applications of JC relative to their inputs.
      *   *Penalty:* **Deduct 2 marks** if the student claims the Coarse update is "mathematically wrong" or simply asserts "the Fine partition is obviously correct because it has more information" without explaining *why* the experience licenses the fine-grained shift over the coarse one. (The prompt asks why the coarse isn't just wrong).
  *   **3 Marks (Repair):** Proposing a constraint on "direct influence" or "atomic cells of experience." Explaining that the partition must match the specific content of the perceptual experience.
  *   **2 Marks (Cost):** Identifying the theoretical cost. E.g., loss of generality, need for a theory of perception/phenomenology, or introspective burden on the agent.
      *   *C-grade answer:* Identifies the problem but fails to articulate the cost of the repair (e.g., says "just use the fine one" without discussing the normative gap).

  **Part (c): Dutch Book Implications (6 Marks)**
  *   **3 Marks (Vulnerability):** Explaining that a DB is possible *if* partition selection is inconsistent or predictable. Clarifying that following JC strictly does not guarantee immunity if the input rule is unstable.
  *   **3 Marks (Bookie's Knowledge):** Specifying that the bookie needs to predict the *partition selection*, not just the priors.
      *   *A-grade move:* Noting that if Jo is consistent (always Fine), she is locally safe, but the *rule* remains vulnerable to exploitation if the environment can trigger different partition descriptions.
      *   *Error:* Claiming a DB is impossible because she followed JC (misses the point of the input problem). Claiming a DB is guaranteed without specifying the need to predict the partition choice.

  **General Grading Notes:**
  *   **A Range (17-20):** Clear, precise arithmetic. Identifies the Input Problem by name or clear description. Nuanced discussion of the "direct influence" repair and its costs. Dutch Book section correctly identifies the partition selection as the vulnerability point.
  *   **B Range (13-16):** Correct math. Identifies the problem but vague on the "repair." Dutch Book answer is mostly correct but misses the nuance on partition prediction.
  *   **C Range (9-12):** Math mostly correct. Falls into the trap of saying "Fine is better because more info" without normative justification. Dutch Book answer confused.
  *   **Fail (<9):** Major arithmetic errors. Fails to engage with the philosophical prompt, treating it as a pure math exercise.
