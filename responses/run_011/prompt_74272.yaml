answer: |-
  **Project Title:** The Reflexivity of Neglectedness: Reconstructing the ITN Framework as a Bounded Decision Procedure

  **Project Summary**
  The Importance, Tractability, and Neglectedness (ITN) framework is the dominant heuristic for cause prioritization within effective-altruism-adjacent circles. Standard interpretations treat the three dimensions as independent estimates of a single quantity: the marginal value of one further unit of effort. My working hypothesis is that this interpretation is ontologically mistaken. Importance is a property of states of the world; tractability is a property of the world taken together with an agent's capabilities and information; neglectedness is a property of the distribution of other agents' attention. Because neglectedness measures the attention of others, it is reflexive: a framework that publishes its rankings lowers the score of precisely the causes it recommends. Consequently, the criterion is not stable under its own use.

  This project asks whether the ITN framework can be reconstructed as a decision procedure justified by the computational and informational constraints under which real allocators operate, rather than as a theory about how good cause areas are, and if so, what its systematic failure modes are. This question is settled if I can derive a set of informational constraints under which ITN maximizes expected value despite its reflexive nature, and identify the specific conditions under which it fails. It remains open if the framework proves incoherent even as a heuristic, or if the reflexive instability cannot be formally bounded.

  **Context and Gap**
  Current debate regarding neglectedness focuses on its validity as a proxy for value. Standard defenses argue that neglectedness proxies for diminishing marginal returns within a cause, or that it indicates a cause is underpriced by the broader market of altruists. Standard objections counter that neglectedness is merely a sociological artifact of what the community happens to have read, or that it double-counts with tractability, since a cause is often neglected because it is hard.

  These defenses and objections leave the central research question unanswered because they assume ITN attempts to track a static truth about the world. They treat neglectedness as a fixed variable to be measured accurately. None address the dynamic instability introduced when the measurement tool itself alters the variable. If ITN is a theory of value, reflexivity is a fatal flaw. If ITN is a heuristic for bounded rationality, reflexivity is a constraint to be managed. The literature currently lacks an analysis of ITN as a decision procedure subject to its own output effects.

  **Methodology**
  The research will proceed in three integrated components: conceptual analysis, formal modeling, and worked application.

  First, conceptual analysis will disentangle the ontological categories of the three dimensions. I will argue that tractability cannot be defined independently of the allocator's specific epistemic position, and that neglectedness is inherently relational. This establishes the philosophical grounding for treating ITN as agent-relative rather than world-relative.

  Second, formal modeling will represent the ITN framework as a feedback loop. I will construct a model where the "neglectedness" score of a cause is a function of total resources allocated to it, including resources allocated as a result of the framework's own recommendation. This allows me to calculate the stability conditions of the system.

  Third, I will apply this reconstruction to three named cause areas: Artificial Intelligence Safety, Pandemic Preparedness, and Farmed Animal Welfare. These are selected because they represent distinct profiles of publicity and funding elasticity. This application will test the reconstruction rather than merely illustrate it. I will input current public data on funding and attention into the model to determine if the framework's current recommendations for these causes are stable. If the model predicts that publishing a recommendation for AI Safety significantly reduces its neglectedness score enough to alter the ranking within a funding cycle, the framework fails the stability test for that domain. If the score remains robust despite the influx of attention, the heuristic holds.

  **Defense of Method**
  Two obvious alternatives are rejected. First, an applied audit of past allocation decisions would be insufficient because historical data cannot reveal counterfactual stability. Knowing that a cause was funded does not tell us whether the recommendation itself destroyed the neglectedness advantage before the funds were deployed. We need a model of the mechanism, not a record of the output.

  Second, a purely formal model carrying no conceptual argument would fail to justify why these specific variables matter. Without the ontological analysis distinguishing agent-capabilities from world-states, the formal model would lack normative force. Grant administrators require a justification for why the heuristic should be trusted; philosophers require a justification for why the categories are coherent. Only a hybrid method satisfies both.

  **Outcomes**
  A successful result will look like a reconstructed ITN framework that includes explicit "reflexivity constraints." It will specify, for example, that the framework should not be applied to cause areas where funding elasticity is high relative to the total pool of available capital. It will provide a decision tree for allocators to determine when neglectedness is a reliable signal and when it is a trap.

  The project will be considered to have failed if the formal modeling demonstrates that no stable equilibrium exists for any realistic informational constraint, implying that the framework is fundamentally self-defeating. It will also count as a failure if the conceptual analysis reveals that "tractability" and "neglectedness" cannot be disentangled even in principle, rendering the three-factor structure incoherent.

  **Timeline**
  *   **Months 1–3:** Conceptual analysis. Drafting the ontological distinctions between the three dimensions. Reviewing existing critiques of neglectedness to map the argument space.
  *   **Months 4–6:** Formal modeling. Developing the feedback loop equations. Defining variables for attention, funding, and elasticity.
  *   **Months 7–9:** Worked application. Gathering data on AI Safety, Pandemic Preparedness, and Animal Welfare. Running the model against this data.
  *   **Months 10–12:** Synthesis and writing. Integrating the philosophical and formal results. Drafting the final monograph and policy brief for grant-makers.

  **Limitations**
  I must identify where the scope is probably too ambitious for one person in one year. The formal modeling of "agent capabilities" required for the tractability dimension is notoriously difficult to quantify. While I can model funding flows for neglectedness, representing the epistemic constraints of a specific allocator in the tractability variable may require simplifications that weaken the philosophical nuance. Additionally, gathering reliable data on private funding for the worked application may be impossible; I may have to rely on public estimates which introduce noise. If the data quality proves too poor to run the stability tests, the project may have to retreat to a purely theoretical proof of concept, which would reduce its utility for the grant-administrators on the panel. I will prioritize the formal stability proof over the empirical application if this trade-off becomes necessary.
