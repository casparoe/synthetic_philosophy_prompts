answer: |-
  Dear Colleague,

  The short answer is that the two rooms are not inconsistent, because they are optimizing for different things under a single coherent framework of uncertainty. The forecasting program is designed for epistemic accuracy, seeking the best estimate of a resolvable truth, while the risk committee is designed for decision robustness, seeking to survive catastrophic outliers. In the forecasting room, convergence is the goal because you are trying to minimize error against a future fact, whereas in the risk committee, divergence is the goal because you are trying to maximize the surface area of scrutiny against a potential failure. A single theory of decision-making under uncertainty can license both norms if it distinguishes between the aggregation of beliefs for prediction and the stress-testing of beliefs for action. The apparent contradiction dissolves once you recognize that consensus is a virtue when you are scoring calibration against reality, but a vice when you are hunting for blind spots that could destroy the firm.

  Regarding the forecasting protocol, you are right to sense a tension between the written rule and the actual practice. The written rule, which mandates a conversation to find missing information, presupposes an Objective Bayesian or Common Prior view of probability. This view holds that there is a single correct probability distribution given the available information, and that disagreement is solely a function of asymmetric information. Under this theory, if two rational agents share all their information, their probabilities must converge. However, the actual practice of splitting the difference suggests the protocol is operating on an empirical aggregation theory, often called the Wisdom of Crowds, or perhaps a Subjectivist view where the average of independent errors tends to cancel out. The protocol document speaks the language of Aumann, but the forecasters are acting like Galton. Strictly speaking, if the Common Prior assumption held true and the forecasters were perfectly rational, splitting the difference would be incoherent. If you both have the same information and are rational, you should already have the same number. If you differ, one of you is processing the information incorrectly, and averaging a correct probability with an incorrect one dilutes the accuracy. The fact that the compromise works suggests that your forecasters are not logically omniscient Bayesian updaters, but rather bounded rationalists whose errors are uncorrelated.

  A Savage-style subjectivist could indeed run the identical Brier-score program without changing a single rule, because proper scoring rules like the Brier score are designed to incentivize honesty regardless of your ontology of probability. For a subjectivist, probability is a measure of personal belief, not a property of the world, so two people with the same information can legitimately have different priors based on their upbringing or mental models. In this view, the conversation rule does not need to be about finding missing information, but rather about understanding model divergence. The protocol does not strictly require the Common Prior assumption; it merely sits comfortably with it because that language is easier to write into a compliance doc. What the protocol strictly requires is resolvability. It requires that the events have truth values that can be checked later. This is where you answer the question about the forecasters who claim there is no fact of the matter. When the program manager tells them to pick a number anyway, that is not a neutral administrative move; it is a substantive philosophical commitment to operationalism. It rules out radical constructivism or non-cognitivism. The system asserts that for the purposes of the firm, political events are treated as having binary outcomes, and refusing to assign a probability is treated as a refusal to participate in the market of ideas. You cannot score a belief that refuses to be quantified, so the rule forces a quantification that implicitly denies the claim that the event is inherently unknowable.

  If you wanted to force the Common Prior assumption rather than just assuming it, you would need to change the incentives from scoring accuracy to rewarding information arbitrage. You could implement a prediction market where forecasters bet against each other using internal currency, which would punish splitting the difference if one party is truly more informed. Alternatively, you could require that the conversation log details specific data points rather than general reasoning, and penalize pairs who converge without citing new evidence. However, this would likely degrade performance because it fights against the empirical reality that human judgment benefits from averaging even when information is shared. If you explicitly adopted the Subjectivist view, the concrete changes would be mostly linguistic and procedural. You would rewrite the conversation protocol to ask forecasters to explain their mental models rather than hunt for private information. You would stop treating the compromise as a failure to find the truth and start treating it as an explicit aggregation mechanism. You might also stop penalizing persistent disagreement if both forecasters remain well-calibrated over time, acknowledging that different models can yield different but equally valid subjective probabilities on singular events.

  The risk committee down the hall is consistent with this because they are not trying to estimate the mean outcome; they are trying to map the tails. In risk management, the cost of a false negative is often asymmetric and catastrophic, so consensus is dangerous because it suggests groupthink has hidden a tail risk. The forecasting room cares about the Brier score, which penalizes being confidently wrong, encouraging calibration around the most likely outcome. The risk committee cares about survival, which encourages imagining the least likely but most damaging outcome. A single coherent theory licenses both by recognizing that different loss functions require different social norms. If you are minimizing squared error, you want convergence to the central tendency. If you are minimizing ruin, you want divergence to explore the boundaries of possibility. You do not need to choose one ontology of probability over the other to justify this; you only need to recognize that one room is building a map of the territory, and the other is stress-testing the vehicle you intend to drive across it.

  My recommendation for your note is to lean into this functional distinction. Acknowledge that the forecasting protocol uses Common Prior language as a heuristic to encourage information sharing, even if the mathematical reality is closer to Subjectivist aggregation. Clarify that the compromise rule is an empirical hack to reduce variance, not a Bayesian updating procedure. Affirm that the risk committee's divergence is necessary because their loss function is asymmetric, whereas the forecasters' loss function is symmetric. This allows you to keep the current practices without pretending they rest on a single unified theory of truth. You can tell the forecasters that their disagreement is not a bug to be fixed by finding hidden data, but a feature to be managed by aggregation, provided they remain calibrated. You can tell the risk committee that their dissent is not about finding the true probability, but about ensuring no catastrophic probability is assigned zero. This clears the philosophical fog without requiring you to overhaul the scoring, the bonuses, or the conversation logs. You simply update the story you tell yourselves about why the rules exist, moving from a claim about the nature of truth to a claim about the nature of useful decision-making.

  I hope this helps you draft the note.

  Best regards,

  Your Assistant
