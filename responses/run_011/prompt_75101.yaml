prompt: |-
  Act as a decision theorist who has actually worked on non-expected-utility theories. Think it through carefully — sketch the candidate objections to yourself first, then sort them before you write anything down.

  I'm a third-year philosophy PhD student and over the past year I've become a convert to risk-weighted expected utility: agents apply a risk function to cumulative probabilities and evaluate a whole act at once, so the Allais choices come out rational, and it's Savage's sure-thing principle / separability across states that has to go. I want to know what would genuinely count against this view. Rank the defeaters, fatal at the top, merely awkward at the bottom.

  Four things I specifically want pressed on:

  1. The weighting function is a free parameter tailored to each agent. Is there any pattern of choices that no REU representation whatsoever could fit? If not, has the view been qualified into unfalsifiability — and is that actually a problem here, given it's a normative theory rather than an empirical one?
  2. Rank-dependent utility handles the same Allais data with a smaller departure from orthodoxy: it keeps comonotonic separability and behaves better in sequential settings. So is the evaluate-the-act-as-a-whole posit doing explanatory work RDU isn't already doing, or is it surplus structure?
  3. Dynamics. Money pumps, sophisticated planning, cases where the agent would turn down free information. Are the commitment/sophistication replies principled, or are they patches?
  4. Rabin-style calibration: does global risk aversion about small stakes commit the REU agent to absurd attitudes about large ones, or does per-act evaluation let it escape cleanly?

  Then tell me what the view predicts that its rivals don't, and which of the above a defender would concede as a real strike rather than swat away. Give me a commited answer — where is this thing most exposed, and would you bet on it surviving the next decade? Don't lay out the options and leave me to choose.
