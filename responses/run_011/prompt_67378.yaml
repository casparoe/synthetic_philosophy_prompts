answer: |-
  ### Analysis of Reasoning Styles and Shared Premises

  Before presenting the joint statement, it is necessary to characterise the epistemic foundations of each camp. This is not merely a matter of policy preference, but of how each side models causality in socio-technical systems.

  **The Momentum View (MV)** reasons primarily from **structural incentives and physical law**. Its confidence is derived from game-theoretic models (specifically prisoner's dilemmas among states or corporations) and the historical trend of technological diffusion. It assumes that knowledge, once acquired, cannot be un-acquired. Consequently, it views 'restraint' as a local variable that is easily overridden by global competitive pressure. Its core premise is that the cost of building a capability tends to drop faster than the cost of governing it.

  **The Steerability View (SV)** reasons primarily from **institutional agency and socio-economic friction**. Its confidence is derived from the historical record of successful taboos, regulatory regimes, and abandoned projects. It assumes that 'feasibility' is a composite variable including cost, legitimacy, and supply chains, all of which are subject to political intervention. Its core premise is that human choice acts as a bottleneck that can be tightened, not merely a conduit that must be widened.

  **Shared Premises:**
  1.  **Survival is the metric:** Both camps agree that the ultimate measure of success is the long-term survival of humanity, not merely economic growth or ideological purity.
  2.  **Asymmetric Power:** Both agree that advanced technology confers disproportionate power, creating a risk that a single actor can inflict catastrophic harm.
  3.  **The Governance Gap:** Both acknowledge a temporal mismatch between the arrival of a capability and the maturation of norms or institutions to manage it.

  **Verbal Disputes:**
  A significant portion of the disagreement is verbal, centring on the modal operator **'possible'**.
  *   For **MV**, 'possible' means *physically and technically achievable* (know-how exists).
  *   For **SV**, 'possible' means *economically and politically viable* (supply chains, legitimacy, and capital align).
  When MV says "It will be built," they mean "It cannot be un-invented." When SV says "It might not be built," they mean "It may remain too costly or illegitimate to deploy." Recognising this distinction removes the appearance of fatalism from MV and the appearance of naivety from SV.

  ***

  ### Joint Statement on Technology and Survival

  **Preamble:**
  We, the undersigned representatives of the Momentum and Steerability views, acknowledge that our decades-long debate has often obscured areas of convergence. This document does not resolve our fundamental differences regarding human agency versus structural determinism. Rather, it delineates exactly where we agree, where we disagree, and what evidence would settle the matter.

  **Section I: Agreed Claims**

  1.  **On the Historical Record of Restraint:** Both camps acknowledge that technological restraint has occurred historically (e.g., the non-deployment of tactical nuclear weapons, the moratorium on human germline editing). However, we agree that such restraint is historically fragile and often dependent on specific geopolitical configurations that may not persist.
  2.  **On Capability and Political Order:** We agree that a 'governance gap' exists wherein technical capability expands faster than the institutional wisdom to manage it. We disagree on whether this gap is a permanent structural feature (MV) or a contingent policy failure (SV), but we agree it is the primary zone of vulnerability.
  3.  **On the Location of Catastrophic Risk:** We agree that catastrophe requires two conditions: (a) the existence of a high-leverage capability, and (b) the failure of control mechanisms surrounding that capability. MV locates the failure primarily in the inevitability of condition (a); SV locates the failure primarily in the negligence of condition (b).
  4.  **On the Necessity of Redundancy:** Both camps agree that relying on a single layer of defence (whether technical or institutional) is insufficient. Safety requires redundant systems of monitoring, verification, and containment, regardless of whether one believes the technology itself should be suppressed.

  **Section II: Surviving Disagreements**

  | Topic | Momentum View Position | Steerability View Position |
  | :--- | :--- | :--- |
  | **Efficacy of Moratoria** | Moratoria are temporary delays that shift development to less responsible actors or jurisdictions, increasing net risk. | Moratoria can be durable if they successfully raise costs and reduce legitimacy, preventing widespread diffusion. |
  | **Primary Intervention Point** | Intervention should focus on accelerating institutional adaptation and building defensive counter-technologies. | Intervention should focus on slowing or foregone development of specific high-risk capabilities at the source. |
  | **Definition of 'Feasible'** | Feasibility is determined by the laws of physics and information theory; if it can be known, it will be known. | Feasibility is determined by socio-economic ecosystems; if it cannot be funded or legitimised, it remains theoretical. |
  | **Response to Defection** | If one actor defects on safety norms, others must match capability to maintain deterrence and monitoring capacity. | If one actor defects on safety norms, others must coordinate to sanction and isolate the defector to enforce norms. |

  **Section III: Cruxes and Pre-Registered Predictions**

  The following are empirical or logical questions where settlement would materially shift confidence between the two views. We agree to treat these as testable propositions.

  **Crux 1: The Modal Operator (Physical vs. Socio-Economic Possibility)**
  *   **The Question:** Does 'possible' imply inevitability once physical laws permit it, or does socio-economic friction constitute a permanent barrier?
  *   **Case Study:** **Heritable Human Genome Editing.**
  *   **Evidence Bearing on Crux:** The rate of clinical deployment globally over the next 20 years despite existing international moratoria.
  *   **MV Prediction:** Widespread clinical deployment will occur within 20 years regardless of treaties, driven by market demand and jurisdictional arbitrage.
  *   **SV Prediction:** Deployment will remain niche, illicit, or heavily restricted for over 20 years due to cost, medical consensus, and regulatory enforcement.

  **Crux 2: The Dynamics of the Governance Lag**
  *   **The Question:** Is the lag between capability and governance constant, shrinking, or lengthening as technology compounds?
  *   **Case Study:** **General Purpose AI Regulation.**
  *   **Evidence Bearing on Crux:** The time delta between the demonstration of a new capability class (e.g., autonomous agent swarms) and the enforcement of binding international safety standards.
  *   **MV Prediction:** The lag will lengthen. The complexity of the technology will outpace the speed of legislative and international consensus mechanisms.
  *   **SV Prediction:** The lag can be stabilised or shortened. Pre-emptive regulation (e.g., compute governance, licensing) will allow institutions to govern capabilities before mass deployment.

  **Crux 3: The Von Neumann Limit (Self-Reproducing Systems)**
  *   **The Question:** Do self-reproducing systems (physical or digital) dissolve the possibility of steerability by removing the human from the production loop?
  *   **Case Study:** **Autonomous Cyber-Physical Manufacturing / Von Neumann Probes.**
  *   **Evidence Bearing on Crux:** The ability to physically halt or patch a self-replicating system once it has been deployed in a distributed environment.
  *   **MV Prediction:** Once a self-reproducing system is released, control is mathematically impossible; survival depends on pre-deployment verification and counter-automation. (This validates the Momentum view that the *thing itself* is the risk).
  *   **SV Prediction:** Kill-switches, resource bottlenecks, and hardware constraints can be engineered to ensure steerability is retained post-deployment. (This validates the Steerability view that the *design choice* determines the outcome).

  **Signatories:**
  *[Representatives of the Momentum View]*
  *[Representatives of the Steerability View]*

  *Date: 24 May 2024*
