answer: |-
  # FINAL EXAMINATION: EPISTEMIC FOUNDATIONS OF GAME THEORY

  **Time Allowed:** 90 Minutes
  **Total Marks:** 25

  **Question 1**

  Consider a finite, perfect-information game between two players, Alice (A) and Bob (B). The game proceeds along a linear chain of four decision nodes, numbered 1 to 4. Alice moves at nodes 1 and 3; Bob moves at nodes 2 and 4. At any node $n$, the player to move may choose **Stop** (ending the game) or **Continue** (moving to node $n+1$). If the game reaches the end of node 4 and Bob chooses **Continue**, the game ends with final payoffs.

  The payoffs $(A, B)$ for choosing **Stop** at each node $n$, or **Continue** at node 4, are as follows:
  *   Node 1 (A): **Stop** $\rightarrow (2, 0)$; **Continue** $\rightarrow$ Node 2.
  *   Node 2 (B): **Stop** $\rightarrow (1, 3)$; **Continue** $\rightarrow$ Node 3.
  *   Node 3 (A): **Stop** $\rightarrow (4, 2)$; **Continue** $\rightarrow$ Node 4.
  *   Node 4 (B): **Stop** $\rightarrow (3, 5)$; **Continue** $\rightarrow (6, 4)$.

  Both players are instrumentally rational (they maximize expected utility given their beliefs). Before the game begins, a trusted referee makes a public announcement that establishes **Mutual Knowledge of Rationality to Depth 2** ($E^2(R)$), defined explicitly as:
  1.  Alice and Bob are both rational ($R$).
  2.  Alice knows (1) and Bob knows (1).
  3.  It is mutually known that the depth of knowledge is exactly 2 (i.e., neither player knows that the other knows that they know (1)).

  **Answer the following:**
  (a) Identify the earliest node number at which the player to move is logically compelled to choose **Stop**, given $E^2(R)$. Justify your answer by tracing the specific knowledge operators required at each node. (10 marks)
  (b) Explain what does and does not follow about the rationality of the players at nodes preceding the one identified in (a). (5 marks)
  (c) Suppose the game proceeds to a node that the backward-induction argument derived from $E^2(R)$ rules out as unreachable. What should the player arriving there believe about their opponent's rationality or knowledge, and how should they act? Do not simply invoke "trembling hand" or "trembles"; explain the epistemic revision required. (10 marks)

  ***

  # MODEL ANSWER

  **Epistemic Limits of Backward Induction in Finite Games**

  To solve this game, we must map the epistemic conditions required for Backward Induction (BI) against the provided depth of mutual knowledge, $E^2(R)$. Standard BI relies on Common Knowledge of Rationality (CKR), an infinite hierarchy. Here, the hierarchy terminates at depth 2. We analyze the game from the final node backward, tracking the knowledge required to compel a **Stop** decision.

  At Node 4, Bob chooses between **Stop** (payoff 5) and **Continue** (payoff 4). Since $5 > 4$, a rational Bob stops. This requires only that Bob is rational ($R_B$). No knowledge of Alice is required to make this specific choice, though it is a consequence of $R$.

  At Node 3, Alice chooses between **Stop** (payoff 4) and **Continue** (leading to Node 4). To choose **Stop**, Alice must believe Bob will stop at Node 4. Since Bob stops at Node 4 if he is rational, Alice needs to know Bob is rational ($K_A R_B$). The condition $E^2(R)$ includes $E^1(R)$ (everyone knows everyone is rational), which implies $K_A R_B$. Therefore, Alice is compelled to **Stop** at Node 3.

  At Node 2, Bob chooses between **Stop** (payoff 3) and **Continue** (leading to Node 3). To choose **Stop**, Bob must believe Alice will stop at Node 3. Alice stops at Node 3 if she knows Bob is rational. Thus, Bob needs to know that Alice knows Bob is rational ($K_B K_A R_B$). The condition $E^2(R)$ states that everyone knows $E^1(R)$. Since $E^1(R)$ implies $K_A R_B$, $E^2(R)$ implies $K_B (K_A R_B)$. Therefore, Bob is compelled to **Stop** at Node 2.

  At Node 1, Alice chooses between **Stop** (payoff 2) and **Continue** (leading to Node 2). To choose **Stop**, Alice must believe Bob will stop at Node 2. Bob stops at Node 2 if he knows Alice knows Bob is rational. Thus, Alice needs to know that Bob knows that Alice knows Bob is rational ($K_A K_B K_A R_B$). This is a third-order knowledge claim. $E^2(R)$ guarantees knowledge up to the second order ($K_A E^1$ and $K_B E^1$), but it explicitly excludes the third order. Alice cannot deduce that Bob knows she knows he is rational. Consequently, Alice cannot be certain Bob will stop at Node 2. She is **not** compelled to **Stop** at Node 1.

  **(a) Earliest Compelled Node:**
  The earliest node where a player is compelled to **Stop** is **Node 2**. While Node 4 and Node 3 are also solved, Node 2 is the earliest in the sequence where the specific depth of knowledge ($E^2$) suffices to force the BI prescription. Node 1 remains open to **Continue** because the required third-order knowledge is absent.

  **(b) Preceding Nodes:**
  Regarding Node 1, it does not follow that Alice is irrational if she chooses **Continue**. The argument from $E^2(R)$ does not prescribe a unique action at Node 1. Alice may rationally choose **Continue** if she harbors uncertainty about Bob's higher-order knowledge. However, it *does* follow that if Alice chooses **Continue**, she does not believe $K_B K_A R_B$ with certainty. The lack of a prescription at Node 1 preserves the possibility of cooperation without violating the axioms of rationality or the given epistemic state.

  **(c) Belief Revision at Unreachable Nodes:**
  The argument above compels Bob to **Stop** at Node 2. Therefore, Node 3 is epistemically ruled out; it should not be reached if the premises ($E^2(R)$ and Rationality) hold. If Alice finds herself at Node 3, she faces a counterfactual: the premises must be false. She cannot maintain the belief that $E^2(R)$ holds intact.

  Alice must revise her beliefs to explain Bob's failure to stop at Node 2. She has two coherent options. First, she may believe Bob is irrational ($ \neg R_B$). If Bob is irrational, his move at Node 2 is unpredictable, and Alice might rationally **Continue** at Node 3 hoping for the (6,4) payoff. Second, she may believe Bob is rational but lacks the knowledge attributed to him ($ \neg K_B K_A R_B$). Perhaps Bob doubts Alice's rationality.

  Crucially, Alice cannot simply treat Bob's move as a "tremble" (a small probability error) without argument. She must update her knowledge state. If she assumes Bob is rational, she must downgrade her belief about Bob's knowledge of her. If she assumes the knowledge structure held, she must downgrade her belief about Bob's rationality. In either case, the original $E^2(R)$ common assumption is shattered. Her action at Node 3 depends on this revision: if she believes Bob is irrational, **Continue** might be optimal; if she believes Bob is rational but misinformed, she should likely **Stop** (since a rational Bob at Node 4 will still stop). A first-class analysis recognizes that reaching an "unreachable" node forces a collapse of the epistemic model, requiring the player to reconstruct a new subjective probability distribution over the opponent's type rather than relying on the initial public announcement.

  ***

  # MARKING SCHEME

  **Total Marks: 25**

  **Part (a): Earliest Compelled Node (10 Marks)**
  *   **4 Marks:** Correctly identifies Node 2 as the earliest compelled node. (Node 4/3 correct but not earliest = 2 marks).
  *   **6 Marks:** Correctly traces the knowledge operators.
      *   Node 4 requires $R_B$.
      *   Node 3 requires $K_A R_B$ (satisfied by $E^2$).
      *   Node 2 requires $K_B K_A R_B$ (satisfied by $E^2$).
      *   Node 1 requires $K_A K_B K_A R_B$ (NOT satisfied by $E^2$).
      *   *Deduction:* -2 marks for each incorrect knowledge attribution.

  **Part (b): Preceding Nodes (5 Marks)**
  *   **3 Marks:** Explicitly states that Node 1 is *not* compelled to Stop.
  *   **2 Marks:** Explains that **Continue** at Node 1 is consistent with rationality given the knowledge limit (i.e., does not refute $R$ or $E^2$).

  **Part (c): Unreachable Nodes & Belief Revision (10 Marks)**
  *   **4 Marks:** Identifies that reaching Node 3 contradicts the initial premises ($E^2(R) + R$).
  *   **4 Marks:** Proposes a specific belief revision (e.g., downgrading belief in Opponent's Rationality OR downgrading belief in Opponent's Knowledge).
  *   **2 Marks:** Connects the revision to the action (Stop vs. Continue) based on the new belief.

  **Specific Penalties (Applied to Total)**
  *   **Common vs. Universal Knowledge:** If the candidate treats $E^2(R)$ as Common Knowledge (CKR) and solves Node 1, deduct **5 marks**.
  *   **"Trembling Hand" Label:** If the candidate invokes "trembling hand perfection" or "small probability of irrationality" as a label without explaining the belief revision mechanism required by the counterfactual, deduct **5 marks**.
  *   **Sloganeering:** If the answer relies on phrases like "backward induction is paradoxical" without referencing the specific nodes/payoffs of the designed game, deduct **5 marks**.

  **Grading Descriptors**
  *   **First Class (20-25 marks):** Precisely maps the knowledge hierarchy to the node count. In Part (c), distinguishes between revising beliefs about *rationality* vs. *knowledge* and explains how this alters the strategy at the counterfactual node. Avoids all specific penalties.
  *   **Competent (13-19 marks):** Correctly identifies Node 2. Traces most knowledge operators correctly. In Part (c), recognizes the contradiction but offers a vague explanation of belief revision (e.g., "Bob must be crazy") without distinguishing between irrationality and lack of knowledge.
  *   **Fail (0-12 marks):** Assumes CKR and solves Node 1. Fails to trace knowledge operators. Uses forbidden labels (Trembling Hand) as a substitute for argument. Confuses Universal and Common Knowledge.
