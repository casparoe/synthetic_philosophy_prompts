answer: |-
  Model Three (Appointment) best handles this case because it converts the directive from a specific instruction requiring compliance into a jurisdictional grant allowing the physician to execute a vague mandate despite current resistance.

  **Model One: Standing Command**
  This model treats the directive as an order from a competent principal to a future world, valid until explicitly revoked. The doctor faced a valid order with ambiguous trigger conditions. Her conduct was permissible only if the triggers were met, but the struggle complicates whether the patient was capable of revocation. This model aligns with the Appeals Tribunal but cannot explain the flip without declaring the Review Committee wrong about the patient's capacity to revoke; if it is a command, current resistance from an incompetent agent is noise, not a veto. The Review Committee's insistence on checking the wish implies they viewed the command as conditional on current assent, which contradicts the core definition of a standing order.

  **Model Two: Ulysses Contract**
  This model views the directive as a pre-commitment strategy where the Past Self binds the Future Self against changed preferences. The doctor faced a contract breach attempt by the Future Self. Her conduct was permissible if the contract holds despite the breach attempt. This aligns with the Appeals Tribunal but fails to explain the flip without arguing over the contract's voidability conditions. The Review Committee effectively ruled that a Ulysses contract cannot authorize violence against the bound party without current consent, while the Appeals ruled the binding nature survives incapacity. This model struggles because Ulysses contracts typically prevent harm *to* the self, not inflict death *on* the self, making the "breach" (struggling to live) morally distinct from dropping a cigarette.

  **Model Three: Appointment**
  This model treats the directive as a transfer of decision rights to the document or physician, granting them jurisdiction to decide based on past values. The doctor faced a grant of authority with discretionary power to interpret murky timing. Her conduct was permissible if she acted within the scope of that authority. This aligns with the Appeals Tribunal and uniquely explains the flip without declaring either verdict logically incoherent: the Review Committee ruled the doctor acted *ultra vires* (outside authority) by failing to verify conditions, while the Appeals ruled she acted *intra vires* (within authority) because the document itself was sufficient warrant. The dispute is not about the patient's will, but about the agent's scope of power.

  **Model Four: Mere Evidence**
  This model treats the directive as data about values to be weighed against current welfare and behavior. The doctor faced conflicting evidence: past writing versus present struggle. Her conduct was impermissible because current distress outweighs past writing. This aligns with the Review Committee but cannot explain the Appeals flip without accusing the higher tribunal of ignoring evidence. It fails to account for the legal weight given to the document; if it were mere evidence, the physical struggle would decisively outweigh a years-old note, making the Appeals ruling inexplicable except as a legal error.

  **Your Suspicion**
  You suspect the Appeals court quietly switched from Model One to Model Three. You are right about the switch but wrong about the silence; it was a legal necessity, not a sleight of hand. Model One collapses when command conditions are murky ("once... no longer recognize family" lacks temporal precision). A command requires specificity; an appointment allows discretion. The Appeals court did not switch theories to hide anything; they recognized that a vague directive functions legally as an appointment of the physician to determine when the condition is met. The Review Committee tried to enforce Model One on a Model Three instrument, demanding current confirmation that the appointment did not require.

  **Philosophy**
  Dworkin's critical interests fail here because they assume the dementia patient retains enough psychological connectedness to be the beneficiary of a life narrative; if the patient is frightened and struggling, the "critical interest" is an abstraction imposed from outside. Dresser's objection is sharpened by the restraint: overriding current welfare is not just paternalism, it is physical violence authorized by a ghost. Parfit cuts against you, not Marcus. If psychological connectedness has lapsed, the Past Self is a different person; enforcing a stranger's will on a current being is heteronomy, not autonomy. Your indeterminacy comes from trying to use Parfit to support autonomy when his reductionist view undermines the diachronic identity required for advance directives to bind.

  **Standing Asymmetry**
  Your "standing asymmetry" is not a structural feature; it is epistemic paternalism redescribed. Institutions do not treat the later self's behavior as noise because they cannot read it; they treat it as noise because they have decided *a priori* that dementia behavior lacks semantic content regarding life-and-death choices. It is a value judgment that literacy outweighs embodiment. The Appeals ruling entrenched this asymmetry by ruling that the document's voice is structurally superior to the body's voice, regardless of the body's immediate distress.

  **Theory of Advance Directives**
  This episode is an anomaly the theory never anticipated. Advance directive theory was built for passive letting-die (withholding treatment), not active killing (euthanasia) of a resisting patient. The theory assumes the future self will be congruent or silent; it breaks when the future self is actively contradictory and the intervention is violent.

  **Terri Schiavo**
  This does not transfer cleanly. Schiavo was a Model Four (Evidence) problem masquerading as Model One, relying on proxy testimony rather than written text. The Dutch case was a conflict between text and body; Schiavo was a conflict between competing proxies interpreting oral evidence. The asymmetry there was about who holds the microphone, not whether the document overrides the body.
