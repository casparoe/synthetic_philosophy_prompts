answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees, Calderwood Foundation
  **FROM:** Chair, Board of Trustees
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Proposed $14 Million Endowment Gift

  ### I. Recommendation

  I recommend that the Calderwood Foundation **accept the $14 million endowment gift**, subject to the adoption of two binding Board Resolutions that operate in parallel with the donor's conditions.

  We will agree to the donor's substantive requirements: we will petition the court to modify the instrument regarding the reserved seats and the geographic restriction, and we will adopt the required transparency measures. However, to protect the foundation's moral covenant with this city, acceptance is conditional on the Board immediately passing:
  1.  **A Permanent Scholarship Policy:** Irrespective of the legal modification of the geographic restriction, the Board pledges to sustain the current cohort of ninety (90) scholarships for graduates of the original two school districts in perpetuity, funded from the original endowment.
  2.  **A Community Wellness Initiative:** An annual allocation from operating income (not principal) to support health screening and environmental advocacy in the downwind neighborhood, acknowledging the community's burden without prejudicing the family's active litigation.

  If the donor rejects these policy commitments as incompatible with her gift, I recommend we **decline**.

  ### II. Implementation Plan: Clock, Court, and Cohort

  If we proceed with acceptance, the operational timeline is tight but feasible.

  *   **The Five-Year Clock:** The donor requires compliance within five years. Our counsel estimates the *cy pres* petition (to modify the deed) will take eighteen months. This leaves a thirty-month buffer for board restructuring and process implementation. We will file the petition immediately upon donor acceptance.
  *   **The Court Petition:** We will petition the state court to modify the 1961 instrument on the grounds of administrative impracticability and increased charitable benefit. The $14 million leverage demonstrates that modifying the restrictions serves the public interest better than adhering to them. We must notify the Attorney General, as required.
  *   **The Ninety Students (If We Decline):** Should the board vote to decline, or if the donor withdraws:
      *   **Clock:** The offer expires at the end of this quarter. No extension is anticipated.
      *   **Petition:** We withdraw the plan to seek court modification. The two descendant seats remain in perpetuity; the geographic restriction remains legally binding.
      *   **Students:** The current ninety students remain fully funded under the existing endowment. However, we forfeit the capacity to support the additional 120 students annually. We return to the status quo: a sustainable but capped program with no mechanism for growth or transparency.

  ### III. Stakeholder Considerations

  This recommendation asks each of you to accept a difficult trade-off. I address you directly below.

  **To the Descendant Trustees:**
  You have argued that the geographic restriction is the family's only acknowledgment of the harm caused by the plant. You are right. Tying the money to the downwind neighborhood is a form of restitution. Expanding statewide risks washing that history away.
  *   **The Trade-off:** By accepting this gift, we are not erasing that obligation; we are locking it in voluntarily while using new capital to help others. The Board Resolution I propose ensures the original ninety students are never displaced. Furthermore, the Community Wellness Initiative directs foundation resources to the *health consequences* of the contamination, not just tuition. This is a more direct acknowledgment of the plant's legacy than tuition alone.
  *   **The Seats:** The donor requires the elimination of the reserved seats. If the court grants the petition, your specific seats as *descendants* will be dissolved. I hope you will consider standing for election as at-large trustees, but I understand if you feel you cannot serve without the reserved guarantee. If you resign and speak to the press, the foundation will survive, but the family's opportunity to steer this restitution will end.

  **To the Former Councilor:**
  You have argued that private endowments should not dictate educational access and that this gift may serve as a tax shield against potential wealth taxes.
  *   **The Trade-off:** You are correct that education funding is a legislative duty. It is currently unmet. This gift does not absolve the state, but it fills a gap the state has left open. Regarding the tax implications: we cannot speculate on the donor's liabilities. Our fiduciary duty is to the mission.
  *   **The Accountability:** Your concern about private power is best answered by the donor's condition for transparency. By publishing annual accounting and adopting a public application process, we submit the foundation to public scrutiny. This moves us from a private family checkbook toward a public trust. If we decline, we retain total opacity.

  **To the Downwind Neighborhood:**
  We must communicate clearly, regardless of the outcome.
  *   **If We Accept:** We tell the community: "We are expanding opportunity statewide, but we are not leaving you. The original ninety scholarships are guaranteed forever. Additionally, we are launching a health and wellness fund to address the environmental burden this neighborhood carries." We do not admit legal liability for the contamination—that is a matter for the courts—but we acknowledge the *reality* of the health impact.
  *   **If We Decline:** We tell the community: "We preserved the original intent, but we could not secure the resources to expand. The ninety scholarships remain, but no new resources are available for health or broader access."

  ### IV. The Strongest Case Against This Recommendation

  The strongest argument against acceptance comes from the descendant trustees: **This transaction converts a moral debt into a branding opportunity.**

  The original instrument tied the money to the specific ground the founder's industry damaged. It was a bounded obligation, a quiet penance. The new gift demands we unbind that geography and remove the family from governance. This looks like the family is paying $14 million to buy their way out of a specific, localized responsibility, rebranding a "reparations fund" as a "statewide scholarship." If we accept, we risk the appearance that the foundation is prioritizing growth and transparency over the specific justice owed to the neighborhood that suffered for the founder's wealth. If the descendants resign and litigate the *cy pres* petition, the foundation could be mired in scandal for years, distracting from the mission.

  **Why This Case Yields:**
  While the moral risk is real, the cost of purity is too high.
  1.  **Impact:** Declining preserves the "purity" of the original restriction but denies 120 students per year the chance at higher education. In a resource-scarce environment, denying tangible benefit to preserve symbolic intent is a luxury we cannot afford.
  2.  **Protection:** The "buyout" fear is mitigated by the Board Resolution. We are not *legally* dropping the obligation to the neighborhood; we are *voluntarily* keeping it while adding more. The family does not escape the neighborhood; they double down on it while expanding outward.
  3.  **Transparency:** The current structure protects the family from scrutiny. The new structure exposes us to it. If the family has nothing to hide regarding the foundation's management, transparency is an asset, not a liability.

  ### V. Motion for Vote

  I move that the Board authorize the Chair to execute a Letter of Intent with the prospective donor, contingent upon the immediate passage of Board Resolutions 2023-A (Permanent Local Scholarship Guarantee) and 2023-B (Community Wellness Initiative), and further authorize counsel to file a *cy pres* petition with the state court within thirty days of final gift execution.

  **Discussion:**
  We have three weeks before our next meeting. I ask that you review this memorandum and come prepared to vote. If we are to decline, we must do so before the quarter ends. If we are to accept, we must begin the legal process immediately.

  I look forward to our deliberation.
