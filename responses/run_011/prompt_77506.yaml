answer: |-
  This is a sharp observation that cuts to the heart of the tension between *epistemic rationality* (believing true things) and *instrumental rationality* (achieving good outcomes). You are describing a situation where local truth-seeking degrades global predictive utility because the system's accuracy relied on error covariance.

  There is no single, universally standardized noun in philosophy or forecasting that captures exactly this *dynamic transition* (updating one belief makes the aggregate worse). However, there are several "near misses" across different disciplines that capture facets of the problem. None fit perfectly, but together they map the territory.

  ### 1. The Nearest Candidates

  **A. Compensating Errors (Engineering & Accounting)**
  *   **The Concept:** This is the standard descriptive term for your arithmetic example. Two or more mistakes offset each other, yielding a correct (or acceptable) aggregate result.
  *   **Why it doesn't fit:** It is static and descriptive. It names the *state* of the model before you fixed the watch, but it does not name the *paradox of the update*. It carries no epistemic weight; it doesn't address why correcting a falsehood felt like "progress" that resulted in regression.

  **B. The Theory of the Second Best (Welfare Economics)**
  *   **The Concept:** Lipsey and Lancaster (1956) proved that if one optimality condition in a system cannot be satisfied, satisfying the *remaining* conditions may no longer be optimal. In fact, moving one parameter closer to its "true" optimum can move the total system welfare further from the optimum.
  *   **Why it fits:** This is the strongest structural analog. Your "true" invitee count is an optimality condition. Your "false" acceptance rate was the constraint that couldn't be satisfied. When you fixed the invitees (satisfied one condition) without fixing the rate (the other condition), you moved further from the "optimal" prediction.
  *   **Why it doesn't fit:** It is normative (about policy/welfare), not epistemic (about belief/truth). However, it mathematically validates your worry: monotonicity of progress is not guaranteed in coupled systems.

  **C. Equifinality (Systems Theory)**
  *   **The Concept:** In open systems, the same final state can be reached from different initial conditions and by different paths. In modeling, this means multiple parameter sets can produce the same output.
  *   **Why it fits:** Your initial model (1000 * 20%) and the truth (500 * 50%) were two points in parameter space that landed near the same output. You moved from one equifinal point toward the truth on one axis, but slid off the "ridge" of accurate predictions.
  *   **Why it doesn't fit:** Equifinality usually implies we *can't* know which parameter set is true. You *did* learn the truth. The problem isn't identifiability; it's the sensitivity of the output to partial correction.

  **D. "Right for the Wrong Reasons" (Machine Learning / XAI)**
  *   **The Concept:** A model achieves high accuracy on a test set but relies on spurious correlations (e.g., classifying wolves based on snow in the background).
  *   **Why it fits:** Your initial forecast was "right" (closer to truth) for the "wrong" reasons (compensating errors).
  *   **Why it doesn't fit:** This is usually a critique of the *initial* model's robustness. It doesn't describe the *act of correction* making things worse. It describes the fragility, not the transition.

  ### 2. Is it an Artifact of Scoring?

  You asked if this is an artifact of scoring outputs instead of components. **Yes and no.**

  *   **Component Scoring (Epistemic Utility):** If you score your *beliefs* (Invitees: 1000 vs 500; Rate: 20% vs 50%), your update was strictly progressive. Your Brier score or log-loss on the *inputs* improved. You became more calibrated regarding the invitee list.
  *   **Output Scoring (Instrumental Utility):** If you score the *prediction* (Attendance: 200 vs 100), your utility decreased.

  This is not merely an artifact; it is a fundamental conflict between **Realism** (the goal is a true map) and **Instrumentalism** (the goal is a useful map). In a coupled system, a "truer" map component can be less useful if the navigation algorithm (your habit/decision rule) was tuned to the errors in the old map.

  In forecasting literature, this is why **decomposition** (breaking a problem into parts) is advised with caution. Armstrong's *Principles of Forecasting* notes that decomposition reduces variance but can increase bias if the components are not independent. Your case is worse: the components were negatively correlated in their errors, and you broke the correlation by fixing one.

  ### 3. Proposed Term and Definition

  Since no existing term captures the *dynamic epistemic regression* caused by *partial truth-seeking* in a *compensatory system*, I propose:

  **Term:** **Compensatory Fragility**
  **Definition:** The property of a predictive model or decision heuristic wherein aggregate accuracy is sensitive to the correction of individual component errors, specifically when those errors were initially compensatory (negatively correlated).
  **The Event:** An **Error Unmasking**. (The correction of one error unmasks the bias in the remaining components, leading to a net increase in total error).

  **Boundary Conditions:**
  Under what circumstances does correcting one error *guarantee* an improvement (monotonicity of epistemic progress)?

  1.  **Orthogonality of Errors:** If the errors in the model components are statistically independent (uncorrelated), correcting one reduces the total variance/bias without relying on cancellation.
  2.  **Linearity and Monotonicity:** In a linear model $Y = aX_1 + bX_2$, if the loss function is convex (e.g., squared error), moving one parameter toward its true value *usually* helps, *unless* the other parameter is sufficiently biased in the opposite direction to outweigh the gain. Guarantee requires that the marginal gain of the correction exceeds the marginal exposure of the remaining bias.
  3.  **Joint Updating:** Correction guarantees improvement only if *all* known errors are updated simultaneously. Partial updating in a compensatory system is the danger zone.
  4.  **Policy Coupling:** If the decision rule (e.g., "leave 5 minutes early") is explicitly coupled to the belief (e.g., "watch is 5 minutes fast"), correcting the belief *requires* correcting the policy. If the policy is fixed (habit), truth-seeking becomes instrumentally harmful.

  ### 4. Philosophical Implication

  Your worry about "ordering by closeness to the truth isn't monotone" touches on a specific failure mode of **Verisimilitude** (truthlikeness). Popper's original definition of verisimilitude failed precisely because adding a true consequence could reduce verisimilitude if it removed a false consequence that was "close" to the truth.

  While you dismissed verisimilitude, the dynamic version of your problem is **"Non-monotonicity of Truth Approximation."** In complex systems, truth is not always a smooth gradient. It is possible to be on a "false peak" of accuracy where moving toward the true parameters requires passing through a valley of *worse* predictions before reaching the "true peak" of accurate predictions (where you fix *both* the invitees and the rate).

  **Summary:** You have encountered **Compensatory Fragility**. It is not a failure of rationality to notice it; it is a failure of the assumption that local truth-seeking always yields global instrumental gain. The remedy is not to stop updating, but to recognize that in coupled systems, **partial truth can be more dangerous than consistent falsehood**, and updates should be done in batches (joint updating) or accompanied by policy retuning.
