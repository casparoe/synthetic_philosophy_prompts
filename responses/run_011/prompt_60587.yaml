answer: |-
  ### The Degenerating Programme: A Verdict on the Latency Hypothesis

  The question of whether your character is a maverick or a crank does not rest on whether her theory is logically falsifiable. Almost any coherent statement can be dressed up to be falsifiable in principle. The question rests on whether her research programme is progressing or degenerating. There is a crucial distinction between a theory that is scientifically valid but currently unsupported, and a theory that is being kept artificially alive through methodological corruption. Based on the four moves you describe, your character is running a degenerating research programme. She is not yet a crank—cranks usually lack the initial predictive success—but she is no longer functioning as a scientist. She is functioning as a lawyer for her own past self.

  To understand why, we must separate the "hard core" of her theory from the "protective belt." The hard core is the Latency Hypothesis itself: bottlenecks cause grammatical collapse markers. The protective belt consists of the auxiliary hypotheses required to test the core: what counts as a bottleneck, what counts as a marker, and what counts as a valid test. In a healthy scientific programme, adjustments to the protective belt lead to new discoveries. In a degenerating one, adjustments are made solely to explain away anomalies without generating new insights.

  Let us apply the strictest criterion for distinguishing refinement from rescue: **The Novel Prediction Test.** A legitimate refinement modifies the auxiliary hypotheses in a way that yields *new*, independent predictions that can be tested. An ad hoc rescue modifies the auxiliaries only to accommodate the past failure, offering no new way to be proven wrong.

  Look at Move 1 (the Island). The theory predicted marking; the data showed none. Her rescue was to add a condition: the bottleneck must be lived through by a continuous community. Is this falsifiable? Yes, in principle. She could predict that another discontinuous bottleneck will also lack marking. But she didn't make that prediction in advance; she added the clause *after* the failure to save the core. This is a defensive maneuver. It shrinks the domain of the theory to exclude the counter-evidence. It is ad hoc because it explains the past without risking the future.

  Move 4 (the Lab) is worse. When the reaction-time data failed, she claimed the mechanism is neurological but suppressed by "lab pragmatics." This is an immunizing strategy. Unless she specifies exactly which pragmatic features suppress the mechanism and designs a test to isolate them, this move renders the reaction-time claim unfalsifiable in practice. Any future failure can be blamed on "pragmatics." This is the hallmark of a crank shifting into high gear: moving the goalposts from the physical world to the interpretive world where she holds all the cards.

  Move 3 (the Reclassification) is data dredging. Finding a construction filed under evidentials and deciding it is actually collapse marking based on syntactic grounds unrelated to the theory is changing the data to fit the map. It violates the rule that data classification must be independent of the theory being tested. If the theory determines what counts as data, the theory cannot be tested by the data.

  However, Move 2 (the Kinship) saves her from being a total fraud. This was a novel prediction made in advance and confirmed by an independent party. This proves the hard core has empirical content. It proves she isn't making it up. This is why she believes she is a maverick. She remembers the victory of Move 2 and treats the failures of 1, 3, and 4 as mere noise. But science is not a bank where you deposit successes to withdraw immunity from failures.

  The verdict is that the Latency Hypothesis is **falsifiable but degenerating**. The structure of the claim allows for refutation, but her stewardship of the theory has shifted from testing it to protecting it. She is not confidently wrong in the sense of being deluded about reality; she is confidently wrong in the sense of being deluded about her own methodological integrity. She believes she is refining a complex truth, but she is actually stitching together a patchwork of exceptions that leaves the core empty.

  For your novel, this is richer than a simple crank/maverick binary. A crank is easy to dismiss. A degenerating scientist is tragic. She was right once (Move 2), and that single success justifies twenty years of denial. She reads not as someone who doesn't know the rules of science, but as someone who knows them well enough to bend them without breaking them outright. She is technically competent but intellectually dishonest, mostly with herself. The reader should feel the tension of knowing she *could* be right, but watching her behave in ways that make it impossible to find out.

