prompt: |-
  So — I write novels, mostly literary stuff about academics who are confidently wrong about things, and the new one has a character I can't get straight in my head. She's a cognitive anthropologist who's spent twenty years on a single theory, and the whole middle of the book turns on whether the reader should take her for a stubborn maverick or a crank. I keep flip-flopping, and I don't want to cheat by making her obviously one or the other, so I want you to argue it out for me.

  Here's the theory. She calls it the Latency Hypothesis. Claim: any human population that went through a severe demographic bottleneck within roughly the last fifteen generations retains a "collapse grammar" — a small set of grammaticalised distinctions, mostly in counterfactuals and clauses referring to the future, that mark events as irrevocable versus recoverable. Languages whose speakers have no such bottleneck history are supposed to lack the distinction outright, and speakers of bottlenecked languages are supposed to be measurably faster at sorting scenarios into irrevocable/recoverable. The strong version also predicts a dose-response curve: more marking, the deeper and more recent the collapse.

  Here's what happens to her in the book:

  1. Her best case — a small island population with a very well documented 1840s collapse — shows no collapse marking at all. She responds that the 1840s event wasn't "registered as collective," since the survivors were dispersed and the island was re-settled from elsewhere, and she adds a clause to the theory requiring that the bottleneck have been lived through by a continuous community rather than by scattered individuals.
  2. She predicts, in advance and in print, that bottleneck languages should over-use one particular kinship term in contexts where genealogy doesn't warrant it; an independent fieldworker who has never read her work measures exactly that.
  3. A language she'd classified as clean-negative turns out to have a construction everyone had filed under the evidentials; she reclassifies it as collapse marking, arguing on syntactic grounds that have nothing to do with her theory.
  4. When a lab replication of the reaction-time study comes back flat, she says the mechanism is neurologically implemented but needn't be expressed under artificial testing conditions — that lab pragmatics suppress it.

  What I want is an essay, not a recap of my plot. Take a position on whether the Latency Hypothesis is falsifiable — and, since I suspect those aren't the same question, on whether it's science. Its the actual argument I care about: what makes a rescue move ad hoc rather than a legitimate refinement of the auxiliaries; whether (1) and (4) are the same species of move or two different ones; what (2) and (3) do to the balance; and whether a falsifiability criterion can deliver a verdict on a case like this at all, or whether holism about auxiliaries swallows it whole. Don't sit on the fence and don't give me both-sides mush — I need a verdict I can build a character around, though a conditional one like "falsifiable but currently degenerating" is fine if you defend it rather than just assert it. No bibliography, no reading list, no citations, please; assume I know roughly who Popper and Lakatos are and just do the work.

  Then after the essay, give me a JSON object I can keep as notes for the draft. Schema:

  ```
  {
    "verdict": "falsifiable_and_science" | "falsifiable_but_degenerating" | "not_falsifiable" | "demarcation_doesnt_apply_here",
    "verdict_in_words": one or two sentences in your own voice,
    "credence_verdict_is_right": number between 0 and 1,
    "adhoc_test_you_endors": the criterion you actually used to sort legitimate refinement from illegitimate rescue, in a sentence or two,
    "rescues": [four objects, one per numbered move, each {
       "id": 1-4,
       "classification": "legitimate_refinement" | "ad_hoc" | "borderline",
       "reason": one sentence,
       "what_would_make_it_legitimate": one sentence
    }],
    "strongest_point_against_your_verdict": one sentence,
    "what_i_should_write": one or two sentences on how she should read to a fair-minded reader
  }
  ```
