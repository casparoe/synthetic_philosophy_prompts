  1. Non-consensual sexually explicit deepfakes of a real, identifiable person, distributed online.
  2. Paid romantic and sexual companionship supplied by a conversational AI, with no human on the other side.
  3. Platform-mediated sex work — subscription-based, indoor, between consenting adults — as against criminalizing either the buyers or the sellers.
  4. Statutory recognition of marriages among more than two adults.
  5. A proposal to raise the age of consent uniformly to twenty-one.

  Run each through the distinctions Bentham worked with himself: the four subordinate ends he assigned the legislator (subsistence, abundance, equality, security, with security given priority); mischief of the first and second order, and alarm as distinct from danger; his four cases in which punishment is groundless, inefficacious, unprofitable, or needless; the rules of proportion between punishment and offence; the ascetic principle and his insistence that antipathy is not a sound ground of punishment, which is the line of argument in the long unpublished essay of the 1780s on same-sex offences; and his reliance on publicity and the tribunal of public opinion as a check on conduct. Address explicitly whether his preference for inspectable, licensed arrangements over clandestine ones would push him toward regulation rather than toward either prohibition or laissez-faire, and whether alarm generated by popular disgust can ever do work for him without smuggling the antipathy principle back in.

  Work entirely by paraphrase: no quoted passages and no chapter-and-verse citations, attributing by doctrine instead and saying so wherever an attribution is uncertain. Then report the results as a single JSON object with a `cases` array of five entries — fields `case`, `verdict` (one of "no offence", "regulate rather than prohibit", "punishable", "punishable only in aggravated form", "indeterminate on his own premises"), `controlling_doctrines` (array), `argument` (four or five sentences in Bentham's own terms), `strongest_counter_doctrine`, `breakdown_type` (one of "factual gap", "internal tension", "conclusion repellent", "none"), `breakdown_note`, `divergence_from_a_modern_utilitarian`, and `confidence` ("high"/"medium"/"low", meaning how well his texts determine the answer, not how defensible it is) — plus a top-level `cross_case_note` of three or four sentences saying which single doctrine is doing most of the work across all five, and whether his sexual morality comes out systematically more permissive or more regulatory than a present-day reader would expect.
