  **Employer:** The Population (Global Division)
  **Location:** Distributed (Remote work within vehicle structures permitted)
  **Reporting To:** Differential Survival Metrics

  **Role Summary**
  The Population seeks a dynamic agent to assume responsibility for differential persistence over generational time. The successful candidate must demonstrate the capacity to be copied with heritable variation in how many copies get made. Crucially, the agent must be credited with its own contribution to fitness rather than with whatever the neighborhood it happened to sit in did. Contextual effects and confounding variables will be scrutinized during performance review. Applicants must show that their propagation is not merely a byproduct of lower-level subcontractors or higher-level administrative overhead.

  **Essential Criteria**
  1. Proven track record of fidelity in replication with occasional mutable errors.
  2. Ability to establish causal linkage between phenotype and propagation rate independent of lower-level subcontractors.
  3. Willingness to operate within a multi-level hierarchy while maintaining distinct ontological status.
  4. Resilience against drift and stochastic noise in small sample sizes.

  **Incumbent Statement**
  The long-serving incumbent (hereafter "The Replicator") has apparently held the post for most of the history of life while working remotely from within vehicle structures. When contacted for comment, The Replicator denies ever applying for the position, points out that the copies are what persist and the job title is a bookkeeping convenience, and suggests that any perceived agency is merely a statistical shadow cast by differential survival. The Replicator further notes that vehicles are disposable containers and refuses to engage with organism-level stakeholders regarding long-term career planning.

  **Alternative Candidacy (Group Level)**
  Applicants from the collective tier are welcome, provided references are all drawn from situations where competition inside the group was somehow switched off. Please note: Candidacy keeps falling apart the moment a recruiter asks how the group itself gets reproduced rather than merely out-competed. Vague appeals to "species survival" or "ecosystem stability" will be treated as insufficient deliverables. Groups must demonstrate a mechanism for fission or budding distinct from the aggregate success of members.

  **HR Policy on Pluralism**
  In the interest of workforce harmony, HR operates a policy of pluralism. Every applicant is told the role has been split into two shares that are both being filled simultaneously and that the disagreement was never really substantive. Stakeholders are encouraged to agree that both levels are "real" depending on the lighting conditions of the inquiry. Management reserves the right to shift emphasis between levels depending on which mathematical model yields better grant funding.

  **Compensation and Benefits**
  The package centers on immortality-by-proxy. The successful candidate will never strictly die, although essentially every copy will. Lineage continuity is guaranteed provided error rates remain below the extinction threshold. No health plan is offered, as decay is a feature, not a bug. Pension schemes are unavailable due to the indefinite timeline of the role.

  **Note on Unsuccessful Applicants**
  Recent species-level candidates were rejected for failing to demonstrate that it exists in any form the recruiter could audit. Boundaries were deemed too porous for contractual obligation, and metabolic interdependence was confused with corporate identity. Future applications must include a clear definition of birth and death events.

  **Small-Print Clause**
  Should a cheater turn up inside a group whose application has been shortlisted, the employer reserves the right to dissolve the group's candidacy immediately and revert selection pressure to the lower-level unit. The Population accepts no liability for internal sabotage, free-rider exploitation, or tragic collapses of cooperation following mutation events.

  **Grievance History**
  □ One (1) pending claim regarding the title being stolen from an organism by a consortium of smaller entities that have been doing the work by proxy ever since. Filed circa 2.0 billion years ago. Status: Under Review.

  **How to Apply**
  Submit phenotype via standard replication channels. Do not call us; we will replicate you. Applications lacking heritable variation will be deleted automatically.

  **The Population is an Equal Opportunity Employer. We select for fitness, not fairness.**
