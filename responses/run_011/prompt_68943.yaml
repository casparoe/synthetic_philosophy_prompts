      *(Confidence Check)*: I need to be careful not to overstate the *Grundrisse* connection. *Modern Times* is 1936; *Grundrisse* wasn't published until 1939/41 and not widely known until the 60s. Chaplin didn't read it. I must frame this as the film *anticipating* or *cinematically rendering* the logic Marx described, not Chaplin consciously applying it. I will note this limitation in the confidence section.

