          *   *Against:* They aren't going back to a farm. They are walking into the void. It's not a restoration of old relations (impossible in 1936), but a refusal of the current ones. It's a "line of flight."
      *   *Film's Contribution:* Theory deals with categories; film deals with *nervous systems*. The "tic." The somatic impact of abstract time. Marx describes the logic; Chaplin shows the *pain*.

