      2.  Brainstorm 3 Readings.
      3.  Deep Dive 1: Machine vs. Capitalist Application (The Factory Sequence).
      4.  Deep Dive 2: The Ending (Sismondi vs. Escape). Argue For, Argue Against.
      5.  The Film's Contribution: Affect and Embodiment.
      6.  Confidence Ratings.

  4.  **Drafting the Content - Section by Section:**

      *   *Intro:* Acknowledge the Mill quote. Marx's point: Machinery under capital = means for surplus value, not lightening toil.
      *   *Brainstorming:*
          1.  *Luddite Humanism:* Machines bad, humanity good. (Too simple).
          2.  *Capitalist Subsumption:* Machines neutral, capital bad. (Closer to Marx).
          3.  *The Crisis of Measure:* The system is breaking down (Depression era), pointing to the *Grundrisse* crisis of value.
      *   *Machine vs. Capital:* Focus on the Billing Machine (feeding). It's not that feeding is bad, it's that lunch is "lost time." The speed-up button: The machine doesn't demand speed, the *president* does. The Tramp in the gears: He becomes a component. This is *real subsumption*. But does the film blame the gears? Yes, sometimes the machinery looks menacing *per se*. This is the collapse the prompt asks about.
      *   *The Ending (Sismondi):*
