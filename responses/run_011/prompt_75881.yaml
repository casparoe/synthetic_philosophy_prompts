      WWR I §52: "music... is as immediate an objectification and copy of the whole will as the world itself is... Therefore music is by no means like the other arts, namely a copy of the Ideas, but a copy of the will itself...".
      Does this mean the listener is not will-less?
      WWR I §52: "we are entirely given up to the object... we are no longer able to separate the perceiver from the perception... the subject of knowing is no longer individual...". This describes the will-less state.
      However, Schopenhauer acknowledges music can *excite* the will. WWR II, Ch 39: "music... acts on the will... excites the affections...". But he distinguishes between the *aesthetic effect* (contemplation) and the *pathological effect* (arousal). He generally argues that true aesthetic appreciation requires the will-less stance even towards music, otherwise it becomes mere stimulation.
      The student says: "musical experience is not will-less... it stirs and agitates us... acts on our own will directly instead of suspending it."
      This is a robust misreading. Schopenhauer says music *reveals* the will, but the *experience* is still a form of knowledge (contemplation) that provides a respite, though a dangerous one. If the will is activated practically, it's not art.
