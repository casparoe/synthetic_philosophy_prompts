      Some interpreters argue music *threatens* the will-less state more than other arts. Schopenhauer says music can be "too violent" for some. But he maintains it is still art, and art is defined by the will-less subject. To say it is *not* an instance of will-less contemplation is to say it is not art in the Schopenhauerian sense, or that it fails to provide salvation. Schopenhauer claims music *does* provide salvation (temporary), just a different kind. So "No" is incorrect.
