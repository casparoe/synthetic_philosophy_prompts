prompt: |-
  I'm in a philosophy of mind seminar on mental content and over the weekend I built an argument against teleosemantics that now strikes me as way to good to be right, which is exactly why I don't trust it. Background so this is answerable: we did two weeks on the disjunction problem. The frog's fly-detector fires at flies but also at BBs and dark moving specks, so on a straight covariation account what it means is something like small-dark-moving-thing, or fly-or-BB, and the frog therefore never misrepresents — which is supposed to be fatal, since a theory of content that can't make room for error isn't a theory of content. Teleosemantics is the standard fix: bring in selection history, and the disjunction gets cut by what the mechanism was shaped to do rather than by what it currently tracks. Here is my argument that the fix generalizes the disease instead of curing it.

  (1) On teleosemantics, what a state is about is settled by the selection history that produced and maintains it — by what the state was selected to do, not by what it happens to covary with now.
  (2) But selection doesn't select representations. It selects organisms and lineages on overall reproductive success; internal states are retained only insofar as they contribute to that.
  (3) So a state's content is fixed only at the granularity at which its contributing made a fitness difference.
  (4) For any real organism, a great many candidate contents are fitness-equivalent: the frog's state can be specified as tracking flies, as tracking small dark moving things, as tracking protein, as tracking edible-flying-insect-or-BB, and every one of those specifications cashes out in identical behavior and identical offspring counts over the species' whole history.
  (5) Where selection history is indifferent between candidate contents, there is no fact of the matter which content the state has.
  (6) So no actual biological state has determinate content — not the frog's, and not mine, since my FLY, WATER, and even GRANNY concepts each admit indefinitely many fitness-equivalent rival specifications.
  (7) Therefore teleosemantics fails to naturalize content, and fails in the paradigm human cases, not just in the exotic frog case it was designed to handle.

  What makes me nervous is that I want (7) to be false and I can't find a premise to drop. I'm attached to (2) in particular; I've read enough population genetics to not want to say selection literally targets representations, and (2) also seems to be the premise that makes the argument respectable — it's not leaning on swampman intuitions or on any thought experiment, it's just an inference from how selection actually works. My seminar partner's reply was that (1) is a strawman: on the consumer-semantics version, content is fixed by what the downstream systems that use the state need it to be about in order to perform their functions, so the tie in (4) gets broken by looking at the consumers rather than at contributions to fitness. I don't think that helps, and I have a dilemma for it, but I'm worried the dilemma is cheap. Either the consumers are themselves representational states, in which case they need contents of their own and we regress; or the consumers' needs are just cashed out in fitness terms, in which case we're back at (4) with extra steps and the indifference is exactly as total as before.

  So: which step do you reject, and what does rejecting it cost? I'd like the diagnosis to be specific about why the rejected step looked acceptable in the first place, because I wrote it down and it looked fine to me at the time. Part of what I'm after is whether (4) to (5) is a real inference or a slide — my partner thinks I'm just flinching at a valid step, and I can't decide whether he's right, so argue it rather than taking my word for either side. Then I want you to price the alternatives: what does a defender of (2) who rejects the argument have to say about content granularity, and what does someone who gives up (2) owe us? Finally, say what the best version of the consumer-semantics reply actually looks like, because if it does break the tie in (4) I need to know which horn of my dilemma it escapes and what it pays for the escape — I have a term paper due on this and I'd rather the paper be about the surviving objection than about a dead argument.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** A philosophy of mind student (seminar level) working on mental content, specifically teleosemantics and the disjunction problem.
      *   **Task:** Evaluate a specific argument against teleosemantics (the "Indeterminacy/Granularity Objection"). The user feels the argument is "too good to be true" and wants to know which premise to reject, the cost of rejection, the validity of the (4)-(5) inference, and an assessment of the consumer-semantics reply.
      *   **Tone:** Academic, rigorous, sympathetic but critical. Needs to treat the argument seriously while pointing out potential flaws or standard counter-moves in the literature.
      *   **Key Constraints:** Must address specific premises (1-7), specifically the (4)-(5) inference, the cost of rejecting (2), and the consumer-semantics dilemma.

  2.  **Deconstruct the Argument:**
      *   (1) Teleosemantics: Content = Selection History (Function).
      *   (2) Selection Target: Organisms/Lineages (Fitness), not specific representations directly.
      *   (3) Granularity: Content fixed by fitness contribution granularity.
      *   (4) Indeterminacy: Many candidate contents are fitness-equivalent (Flies vs. Dark Specks vs. Protein).
      *   (5) Inference: Indifference = No Fact of the Matter (Indeterminacy).
      *   (6) Generalization: No state has determinate content (Frog + Human).
      *   (7) Conclusion: Teleosemantics fails.

  3.  **Evaluate the Core Objection (The "Indeterminacy of Function" Problem):**
      *   This is a known objection in the literature. It resembles the "Indeterminacy of Function" objection raised by scholars like Godfrey-Smith, Price, or potentially related to Kripke's Wittgenstein (though naturalized).
      *   *Premise (2)* is biologically sound but philosophically loaded. Selection acts on phenotypes, which supervene on genotypes + environment.
      *   *Premise (4)* is the crux. Are the contents *actually* fitness-equivalent?
      *   *Premise (5)* is the philosophical leap. Does selectional indifference entail metaphysical indeterminacy?

  4.  **Identify the Weak Point:**
      *   **Premise (4)** is the most vulnerable. It assumes that because two descriptions *describe* the same historical outcomes, they represent the same *function*. But teleosemantics relies on *causal explanation*, not just outcome counting.
      *   **Premise (5)** is also vulnerable. Teleosemantics is a naturalistic reduction. If nature doesn't distinguish, maybe content isn't determinate? But teleosemicans argue nature *does* distinguish via causal structure.
      *   **Premise (2)** is generally accepted by teleosemanticists (Millikan, Papineau). They don't think selection selects "representations" directly, but traits that *are* representations.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Validate the user's intuition. This *is* a strong argument (it's essentially the "Indeterminacy of Function" objection). It's not "too good to be true," it's a standard heavyweight objection. But it's not fatal.

      *   **Diagnosing the Inference (4) to (5):**
          *   Is it a slide? Yes.
          *   Why? It conflates *extensional equivalence* (same outcomes) with *intensional/causal equivalence* (same mechanism/explanation).
          *   Selection cares about *causes*, not just correlations. If the mechanism relies on visual features (dark, moving), "Fly" might be the *normal condition* under which the function was performed, even if "Dark Speck" covaries.
          *   Millikan's "Normal Conditions" clause is the key here. The function is defined relative to the conditions under which the trait *successfully* performed, not just any condition where it fired.

      *   **Addressing Premise (2) (The Cost of Rejection):**
          *   User likes (2). Good, keep it. Rejecting it leads to "Panpsychism" or "Intentional Realism" that isn't naturalistic.
          *   If you reject (2), you say selection targets content directly. This is biologically naive.
          *   Cost: You lose the naturalistic grounding.

      *   **Addressing Premise (4) (The Real Battle):**
          *   This is where the teleosemanticist fights back.
          *   Are "Fly" and "Dark Speck" really fitness equivalent *over the whole history*?
          *   Counterfactuals matter. If the environment changed (e.g., dark specks became poisonous), would the mechanism still work?
          *   The "Normal Condition" (Millikan) or "Optimal Condition" (Papineau) breaks the tie. The function is to detect flies *because* flies were the historical cause of the success, even if BBs triggered it occasionally. The *explanation* of the success references flies, not BBs.

      *   **The Consumer Semantics Reply (Millikan's Move):**
          *   User's Dilemma: Regress or back to fitness.
          *   Escape: It's not a regress because the chain stops at *non-representational* consumers (e.g., the digestive system, the motor neurons).
          *   It's not just "fitness" because it's about *specific causal roles*. The tongue-flicking mechanism is tuned to *flies*, not BBs. If it flicks at a BB, it fails its function *relative to the consumer's needs*, even if the frog survives.
          *   Cost: Requires a detailed anatomical/functional analysis of the downstream system. It makes content dependent on the specific architecture of the organism, not just broad fitness.

      *   **Conclusion/Advice for the Paper:**
          *   Don't discard the argument. Refine it.
          *   Focus on the "Normal Conditions" clause.
          *   The objection becomes: "Teleosemantics pushes the indeterminacy back to the definition of 'Normal Conditions'."
          *   This is a better term paper topic than "Teleosemantics is dead."

  6.  **Refining the Philosophy (Self-Correction during drafting):**
      *   *Wait, check Premise (5) again.* The user argues that if selection is indifferent, there is no fact of the matter. This is a version of the "No Privilege" argument.
      *   *Counter:* Teleosemantics isn't claiming selection "knows" the content. It claims content *is* the function. If functions are indeterminate, content is. So (5) is actually quite strong *if* (4) holds.
      *   *Focus:* Attack (4). Why are they not fitness equivalent? Because "Fitness" isn't just "Offspring Count." It's "Offspring Count *in the relevant environment*." The relevant environment includes the *causal structure*.
      *   *Millikan's Specific Move:* The function is defined by the *correlation* that held in the past. If the correlation was Fly -> State -> Success, then Fly is the content. The BBs are noise. The function is to map Fly to Success. The fact that BBs sometimes sneak in is error, not a redefinition of the function.
      *   *Wait, that's circular.* The Disjunction Problem says we can't distinguish Fly from Fly-or-BB without already assuming error.
      *   *Okay, the Consumer Semantics is the real answer.* The tongue snap is designed to catch *nutritious* things. BBs don't provide nutrition. So the downstream system fails when a BB is caught. Therefore, the state misrepresents a BB as a nutritious fly.
      *   *User's Dilemma:* "Consumers are representational" (Regress) OR "Consumers are fitness" (Back to 4).
      *   *Response:* Consumers are often *non-representational* functional systems (e.g., the stomach, the muscle). They have conditions of satisfaction (nutrition, movement) that are not "representations" but have teleological functions. This breaks the regress. It avoids (4) because the stomach's function is specific (digest protein), not general (increase offspring).

  7.  **Final Polish:**
      *   Ensure the tone is encouraging but rigorous.
      *   Make sure to explicitly answer "Which step do you reject?" (Primarily 4, with support from a nuanced view of 5).
      *   Address the Consumer Semantics dilemma specifically.
      *   Provide a roadmap for the term paper.

  8.  *(Self-Correction on the "Too Good to Be True" feeling)*: Acknowledge that this feeling often signals a known objection in the literature (Indeterminacy of Function) rather than a novel discovery. This validates the student's work while contextualizing it.

  9.  *(Final check on Consumer Semantics)*: Make sure to distinguish Millikan's "Proper Function" from simple fitness. The key is that the consumer has a *condition of satisfaction* that is more granular than "survival."

  10. **Structure:**
      *   Validation (It's a known, strong objection).
      *   The Diagnosis (Premise 4 is the weak link).
      *   The (4)-(5) Inference (It's valid *if* 4 holds, but 4 is false).
      *   The Cost of Rejecting (2) (Don't do it).
      *   The Consumer Semantics Reply (Escaping the dilemma).
      *   Term Paper Advice.

  (Proceed to generate response based on these thoughts.)
answer: |-
  This is an excellent piece of philosophical reasoning. Your intuition that it is "too good to be true" is a healthy heuristic, but in this case, it signals not that you have made a mistake, but that you have independently reconstructed a heavyweight objection in the literature: the **Indeterminacy of Function** objection (closely related to arguments by Godfrey-Smith, Price, and Neander).

  You are right to be suspicious of the conclusion, however, because teleosemanticists (Millikan, Papineau, Neander) have developed specific machinery to block it. The argument is valid, but it is not sound. The weak link is **Premise (4)**, supported by a subtle equivocation in **Premise (5)**.

  Here is the diagnosis you requested, broken down by the specific components you asked for.

  ### 1. Which step do you reject?
  You should reject **Premise (4)**.

  > *(4) For any real organism, a great many candidate contents are fitness-equivalent... and every one of those specifications cashes out in identical behavior and identical offspring counts over the species' whole history.*

  This premise looks acceptable because it relies on an **extensional** view of fitness (counting offspring) rather than an **intensional/causal** view of function (explaining *why* the offspring survived).

  **Why (4) looked acceptable:**
  It appeals to a coarse-grained view of evolutionary history. If the frog caught flies and sometimes BBs and survived equally well in both cases, then *ex post facto*, the outcome (survival) is identical. It treats selection as a simple tally of "points scored" regardless of the mechanism of scoring.

  **Why (4) is false:**
  Teleosemantics does not define function by *actual* historical success alone, but by success under **Normal Conditions** (Millikan's term) or in the **Environment of Evolutionary Adaptedness**.
  *   The function of the fly-detector is determined by the specific correlation that held *when the trait was being selected*.
  *   If the frog survived because it ate flies, the function is "detect flies."
  *   If the frog survived a BB incident, that is **noise**, not data for the function attribution.
  *   Crucially, "Fly" and "Dark Speck" are **not** fitness-equivalent in the relevant counterfactual sense. If the environment had been full of dark specks that were poisonous (or non-nutritious), the frog would have died. The trait was selected *because* flies are nutritive. The "Dark Speck" description ignores the *causal mechanism* of the survival (nutrition vs. mere impact).

  Therefore, the selection history is *not* indifferent between "Fly" and "Dark Speck." It is sensitive to the causal properties that actually contributed to reproduction (nutrition), not just the triggering properties (darkness).

  ### 2. Is the inference from (4) to (5) a slide?
  > *(5) Where selection history is indifferent between candidate contents, there is no fact of the matter which content the state has.*

  Your seminar partner is partially right: if (4) were true, (5) would follow validly. Teleosemantics is a naturalistic reduction; if nature (selection) doesn't distinguish, the reduced property (content) doesn't exist.

  However, the inference feels like a slide because it moves from **epistemic indifference** (we can't tell from the offspring count alone) to **metaphysical indeterminacy** (there is no fact of the matter).
  *   **The Teleosemanticist Counter:** Selection is not indifferent to *causes*. It selects for mechanisms that track *specific variables*. Even if two variables covary perfectly in the actual history, they may not covary in the **Normal Conditions**.
  *   **The Cost:** To maintain (5), you must argue that evolutionary history is *metaphysically* indeterminate regarding causal relevance. This is a heavy metaphysical claim. Most philosophers of biology argue that causal relevance *is* determinate (e.g., the protein caused the survival, the darkness did not, except instrumentally).

  So, (4) to (5) is valid *conditional on (4)*, but since (4) ignores the causal structure of the selection process, the inference doesn't get you to the radical skepticism of (6).

  ### 3. Pricing the Alternatives: What if you reject (2)?
  You are right to hold onto **(2)**.

  > *(2) But selection doesn't select representations. It selects organisms and lineages on overall reproductive success...*

  **If you reject (2):**
  You commit to the view that selection can "see" content directly. This implies a form of **Panpsychism** or **Robust Realism** where mental content is a fundamental feature of the universe that selection latches onto, rather than a functional role constituted by selection.
  *   **The Cost:** You lose naturalism. You can no longer explain content in terms of biology and physics; you have to posit content as a primitive that guides evolution. This violates the methodological naturalism that makes teleosemantics attractive in the first place.
  *   **Verdict:** Keep (2). It is biologically accurate and philosophically necessary for a reductive project.

  **If you defend (2) and attack (4) (The Recommended Path):**
  You must articulate a theory of **Causal Relevance**. You owe an account of why "nutrition" is more selectionally relevant than "dark moving thing."
  *   **The Cost:** You must engage with philosophy of biology. You have to show that functions are individuated by *causal powers*, not just correlations. This makes teleosemantics dependent on a specific (and debated) view of biological function (the Etiological View). If the Etiological View fails, your defense of teleosemantics fails.

  ### 4. The Consumer Semantics Reply: Escaping the Dilemma
  Your dilemma for consumer semantics is:
  1.  **Regress:** Consumers are representational.
  2.  **Collapse:** Consumers' needs are just fitness (back to Premise 4).

  **The Escape:**
  The best version of consumer semantics (Millikan's *Language, Thought, and Other Biological Categories*) escapes on the grounds that **consumers are often non-representational functional systems.**

  *   **Against Horn 1 (Regress):** The consumer of the frog's fly-detector state is not another *representation* (like a belief); it is a **motor mechanism** (the tongue snap) or a **digestive system**. These systems do not have "content" in the representational sense; they have **Conditions of Satisfaction** (Millikan) or **Proper Functions**. The tongue's function is to project sticky mucous to a specific coordinate. The stomach's function is to digest protein. These are teleological functions, not representations. The chain stops at basic biological machinery.
  *   **Against Horn 2 (Collapse to Fitness):** The consumer's need is **not** "increase offspring." It is "catch projectile" or "digest protein."
      *   When the frog snaps at a BB, the tongue mechanism performs its function (snapping), but the *digestive* consumer fails its function (no protein).
      *   This breaks the tie in Premise (4). "Fly" satisfies the downstream digestive consumer. "BB" does not. Therefore, the state misrepresents the BB as a Fly, because the BB fails to satisfy the conditions required by the downstream consumer system, even if the frog survives the incident.

  **What this escape costs:**
  It makes content **relational and internalist-leaning**. Content is not just about the history of the producer (the detector); it is essentially tied to the specific architecture of the consumer.
  *   **Implication:** You cannot assign content to a state in isolation. You must map the entire functional architecture of the organism.
  *   **Vulnerability:** If the downstream system is plastic or multifunctional, indeterminacy returns. (e.g., If the frog can digest BBs, or if the tongue snap is also used for cleaning). The teleosemanticist must argue for a "canonical" use of the state.

  ### 5. Advice for the Term Paper
  Do not write a paper arguing that "Teleosemantics fails because of Premise (4)." That argument is known, and the counter-move (Consumer Semantics + Normal Conditions) is standard. If you present it as a knockout blow, a knowledgeable grader will mark it down for missing the standard replies.

  **Instead, write this:**
  Argue that the **Consumer Semantics reply shifts the burden of indeterminacy rather than solving it.**

  *   **Thesis:** While consumer semantics avoids the regress by positing non-representational consumers, it pushes the indeterminacy problem into the **individuation of biological functions**.
  *   **Argument:** To say the stomach "needs protein" rather than "needs mass" requires the same kind of selectional granularity that Premise (4) challenged. Why is the stomach's function *digestion* rather than *mass-processing*? If selection only sees offspring, why is the stomach's function determinate?
  *   **Conclusion:** Teleosemantics doesn't solve the disjunction problem; it relocates it from the relation between mind and world to the relation between biological subsystems. This is a more subtle, sustainable critique that acknowledges the strength of the theory while pinpointing its remaining metaphysical cost.

  **Summary of Moves for Your Paper:**
  1.  **Grant (2):** Selection acts on fitness.
  2.  **Challenge (4):** Acknowledge Millikan's "Normal Conditions" and Consumer Semantics.
  3.  **Pivot:** Argue that defining "Normal Conditions" for the *consumer* requires the same granularity that was missing for the *producer*.
  4.  **Result:** Teleosemantics is not dead, but it relies on a robust (and perhaps optimistic) realism about biological function individuation.

  This approach shows you understand the literature, respect the theory's resources, but have found a genuine, unresolved tension. That is A-grade seminar work.
