  You're the right person for this one: someone who knows the just war debate properly — Walzer's symmetry view, the revisionist attack on it, contingent pacifism, the whole business about whether a soldier on the unjust side can fight permissibly if he obeys every rule of conduct — but who also thinks about how adjudicating bodies get trapped by their own track record. Do as much private working-out as you want, brainstorm every candidate rule and check each one against every precedent, but what you actually send me is exactly five numbered items, a sentence or two each, no intro paragraph and no wrap-up.

  Situation: I clerk for my country's conscientious-objector review board. Our statute, as we've always read it, protects only people whose objection is to taking part in war of any kind, not to some particular war. Six years of rulings I sat through:

  - draftee, objection to all killing in war grounded in his church's teaching: granted
  - applicant who said he'd serve in a purely defensive war but not the current one, which he judged aggressive: denied
  - applicant with no religious affiliation, lifelong secular pacifist, wrote college essays on war as an institution: granted
  - applicant objecting to all war, but who until his enlistment notice arrived two months earlier had been posting regularly about the duty to defend one's country: denied
  - combat medic willing to serve unarmed in any war at all, including an aggressive one, but refusing to carry a rifle: granted, with alternative service
  - applicant who refused to take part in any operation involving strikes on cities but was fine with field operations: denied

  The file on my desk now is weird. Former infantry corporal, no religious background, and he says he'd serve unarmed in any war his country fights, aggressive or defensive — he'd drive an ambulance, he'd even train recruits. His objection is entirely epistemic. He accepts that combatants on the just side may permissibly kill and that combatants on the unjust side make themselves liable to be killed; he just says nobody in his position can reliably tell which side of that line a given war puts him on, before or during, so he won't take part in any of them. He explicitly rejects pacifism, says a war of rescue could be obligatory, says he'd cheer for the just side. Our chair wants to deny because the man plainly doesn't object to war as such — he's fine with war, he just doesn't trust his own judgment. Another member wants to grant because in practice this corporal will never fight, which is what the statute is about. And I can't shake the feeling that the chair's reasoning is the symmetry view sneaking in the back door: she's saying a soldier's job isn't to adjudicate the justice of the war, which is a substantive position in the just war debate dressed up as statutory interpretation.

  Give me, as the five items: (1) the rule the board has actually been applying, stated tightly enough to explain all six precedents including why the medic got through; (2) and (3) two further rules that also fit every one of those six but land differently on my corporal — keep them genuinely seperate from each other and from (1), and say what each does to him; (4) your prediction of the actual vote plus the reason you'd bet on it, and if the precedents really underdetermine it, name the principle the board would be adopting by ruling his way rather than restating the ambiguity; (5) the single hypothetical future application that would discriminate between the rules in (1)–(3), and what each rule says about it. Numbered list only, five items, dont add a summary line at the end.
