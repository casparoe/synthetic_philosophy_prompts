  3. The effort grade is often just attainment seen from the teacher's side, rewarding those who find the work easy enough to complete neatly rather than measuring genuine struggle. This reduces attitude to observable compliance, making it a proxy for institutional fit rather than an internal metric.
  4. The assembly speech and the MP letter are performatively inconsistent but functionally compatible, allowing the school to demand individual grit while lobbying for systemic support. This dual stance lets the institution maintain discipline through personal responsibility narratives without denying the reality of need when seeking funding.
  5. To truly abandon the assumption, the school would have to stop ranking effort publicly and remove prizes that moralize compliance, as these reinforce the idea that outcomes are solely within student control. Reporting would need to track support received rather than effort given, shifting focus from what the child owes the school to what the school owes the child.
