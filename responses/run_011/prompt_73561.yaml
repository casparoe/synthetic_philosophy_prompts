answer: |-
  # PREP SHEET: Rousseau, Spectatorship, and the Civic Outsourcing Thesis
  **Context:** 30-min talk, Theater Studies Conference.
  **Audience:** Dramaturgs, Immersive Practitioners, 2 Rousseau Specialists (Historian, Lit).
  **Core Thesis:** Spectatorship = outsourcing civic presence. Festival = abolishing the audience.

  ## The 8 Objections (Ordered by Damage Potential)

  ### 1. The "Geneva Exception" (The Historian)
  **The Objection:** "You're universalizing a argument specific to 1758 Geneva. Rousseau isn't attacking 'spectatorship' as an ontological category; he's attacking Parisian commercial theater's effect on a small Calvinist republic. You can't lift this out of its political topology."
  **Damage:** Collapses your universal claim about spectatorship into a historical footnote.
  **The 90-Second Reply:**
  *   Acknowledge the specificity: Geneva's scale and homogeneity are prerequisites for the *solution*, not the *diagnosis*.
  *   Argue that the *mechanism* of alienation (paying others to feel for you) functions in any representative structure, whether Genevan or modern liberal democracy.
  *   Pivot: The *Letter* endures precisely because the structural critique outlived the Calvinist context.
  **Concede Up Front:** Yes, the *festival* solution relies on Genevan scale.
  **Weakest Point:** You haven't proven the *mechanism* of alienation translates to non-republican contexts without more evidence than Rousseau provides.

  ### 2. The "Immersive Trap" (The Practitioners)
  **The Objection:** "If the sin is spectatorship, you're condemning us. Immersive work still curates experience. We just make the audience walk while they outsource their civic duty. Your thesis licenses nothing; it indict the entire field."
  **Damage:** Turns the room against you; makes your work prescriptive rather than descriptive.
  **The 90-Second Reply:**
  *   Distinguish between *movement* and *agency*. Immersive work often simulates agency while retaining authorial control (the "choice architecture" problem).
  *   Argue your thesis isn't a condemnation but a diagnostic tool: Does your work return civic presence or just gamify the outsourcing?
  *   License condition: Work is only "licensed" if it risks the loss of curatorial control (the "abolition" clause).
  **Concede Up Front:** Most "immersive" work is just theater in the round with better lighting.
  **Weakest Point:** You offer no clear metric for when "curatorial control" becomes "civic outsourcing."

  ### 3. The "Playwright Hypocrisy" (The Lit Person)
  **The Objection:** "Rousseau wrote *Narcisse* and *Le Devin du Village*. He wrote libretti. You can't claim he opposes the *structure* of theater when he actively contributed to it. Isn't the *Letter* ironic or strategic?"
  **Damage:** Undermines Rousseau's authority as a theorist; suggests you're ignoring primary texts.
  **The 90-Second Reply:**
  *   Reframe the plays: *Narcisse* is a preface-heavy apology; *Le Devin* is a pastoral interlude, not civic drama.
  *   Argue Rousseau distinguishes between *amusement* (private) and *institution* (public). He writes plays as a craftsman but attacks them as a legislator.
  *   The inconsistency proves the tension: he couldn't escape the form he critiqued.
  **Concede Up Front:** He was inconsistent, and the Lit specialist knows the texts better than you.
  **Weakest Point:** Relying on "private vs. public" distinction might feel like a convenient escape hatch.

  ### 4. The "Coercive Festival" (Political Theory/Dramaturgs)
  **The Objection:** "Abolishing the audience sounds like totalitarianism. Forcing everyone to participate in the 'general will' on the green removes the right to withdraw. That's not civic presence; that's conscription."
  **Damage:** Makes your solution sound ethically repugnant to modern liberal artists.
  **The 90-Second Reply:**
  *   Agree that modern appropriation of this is dangerous (cite Rancière).
  *   Clarify: Rousseau's "participation" is about removing the *barrier*, not forcing *performance*. It's the right to look without being looked at as a consumer.
  *   The danger isn't the festival; it's the *ticketed* festival.
  **Concede Up Front:** 20th-century attempts to "abolish the audience" often ended in coercion.
  **Weakest Point:** It's hard to distinguish "free participation" from "social pressure" in a small community without sounding naive.

  ### 5. The "Encyclopédie Spat" (The Historian)
  **The Objection:** "This is just a proxy war against Diderot and the *Encyclopédie*. The *Letter* is polemical, not philosophical. You're treating a hit-piece as a treatise."
  **Damage:** Reduces your theoretical framework to historical gossip.
  **The 90-Second Reply:**
  *   Polemics often reveal deeper anxieties than treatises do.
  *   The specific target (d'Alembert) matters less than the structural argument about *representation* that emerges from the fight.
  *   Even if the motive was spite, the diagnosis of spectatorship stands on its own.
  **Concede Up Front:** It is absolutely a hit-piece.
  **Weakest Point:** If the argument is *only* ad hominem, the theoretical extraction is illegitimate.

  ### 6. The "Affect Defense" (Dramaturgs)
  **The Objection:** "You're ignoring why we go to the theater: catharsis, empathy, shared feeling. You reduce art to political utility. What about the private, interior transformation that happens in the dark?"
  **Damage:** Makes you sound like a joyless functionalist.
  **The 90-Second Reply:**
  *   Rousseau doesn't deny affect; he denies its *vicarious* nature.
  *   Empathy discharged in the dark is empathy spent, not invested.
  *   The "interior transformation" is valid, but not if it substitutes for public action.
  **Concede Up Front:** Art does more than politics.
  **Weakest Point:** Dismissing "interior transformation" risks alienating artists who value the psychological over the civic.

  ### 7. The "Domestic Sphere" (Feminist/Historian)
  **The Objection:** "Rousseau pushes women into the home to maintain virtue. Your 'civic presence' is coded male. The festival on the green excludes the domestic labor that sustains it."
  **Damage:** Highlights the exclusionary gender politics of the source material.
  **The 90-Second Reply:**
  *   Acknowledge the patriarchal framework explicitly.
  *   Argue the *structure* of spectatorship critiques can be decoupled from the *gendered* division of labor Rousseau proposes.
  *   The goal is to reclaim the "public" for those Rousseau excluded.
  **Concede Up Front:** Rousseau's gender politics are regressive and不可 (unacceptable).
  **Weakest Point:** It's difficult to separate the "civic" from the "male" in 18th-century republicanism.

  ### 8. The "Utopianism" (General)
  **The Objection:** "The festival is a nostalgia trip. It doesn't work in a city of millions. You're offering a solution for a world that doesn't exist."
  **Damage:** Makes your conclusion impractical.
  **The 90-Second Reply:**
  *   It's not a blueprint; it's a limit-concept.
  *   We use it to measure the distance between our current spectatorship and civic presence.
  *   The value is in the critique, not the implementation.
  **Concede Up Front:** It is not scalable to modern metropolises.
  **Weakest Point:** If it's not scalable, is it useful for *these* practitioners who work in cities?

  ***

  ## The Question You Should Actually Dread

  You suspect it's the **Playwright Hypocrisy** (Objection #3). It's not. The Lit specialist expects you to handle that; it's a standard Rousseau 101 query. You can prep for it.

  **The Dreaded Question:**
  > **"If the problem is the *structure* of spectatorship, and the solution is the *homogeneity* of the festival, doesn't your thesis imply that meaningful civic theater is impossible in a pluralistic society? Are you arguing that diversity kills civic presence?"**

  **Why this is worse:**
  1.  **It traps the Historian and Lit Person together:** The Historian knows Geneva was exclusive; the Lit Person knows Rousseau feared difference/opinion. They will converge on this.
  2.  **It condemns the Practitioners' reality:** Immersive work often prides itself on diverse audiences and complex identities. If your thesis requires homogeneity (the "General Will") to function, then their work in diverse cities is structurally doomed to be "corrupt" spectatorship.
  3.  **It attacks the Normative Core:** It moves the debate from "What did Rousseau mean?" to "Is your political vision exclusionary?" It forces you to defend the idea that *difference* creates *alienation*.

  **How to prepare:**
  Do not defend homogeneity. Argue that Rousseau conflated *agreement* with *presence*. Your thesis should be that we need structures of presence that *accommodate* disagreement, which Rousseau failed to imagine. The "Festival" is the failure point, not the goal.
