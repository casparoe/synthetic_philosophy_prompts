  1. S: Look at the chief: he saved forty thousand lives and slept soundly, which proves your dirty hands is just theater for officials who want to look burdened while doing the math. If the calculus was right, the ledger is closed, so claiming there's leftover guilt is just vanity masquerading as virtue. It allows them to claim moral depth without paying any real price.
  W: You're assuming the ledger closes just because the numbers balance, but the dirt sticks to the act itself regardless of how the agent feels afterward. The chief's numbness doesn't wash the blood away; it just shows he's severed the connection between doing wrong and feeling wrong. That severance is dangerous, but it doesn't change the moral fact.

  2. S: But if you locate the wrong in the act, you're saying he shouldn't have done it, yet you agree he must open the spillway, so you're contradicting yourself. If the dirt is only in his feelings, then you're just complaining he isn't virtuous enough, which collapses your category into simple character criticism. You cannot have it both ways without confusing the issue.
  W: I'm not saying he shouldn't have done it, but that the right act can still be a moral violation that leaves a stain independent of utility. You can be required to do something that remains objectively wrongful, which is why the absence of guilt is a failure to recognize reality, not just a mood. The necessity of the choice does not sanitize the violence involved.

  3. S: Then tell me precisely what he should feel if not guilt, since guilt implies he did something he shouldn't have done. If you say he should feel regret without guilt, you're just describing sadness for a tragic outcome, which doesn't require dirty hands at all. Sadness is appropriate for accidents, not for deliberate policy choices.
  W: He should feel that he has personally incurred a debt that utility cannot repay, which is distinct from sadness because it binds him specifically to the victims. That debt is the dirt, and it exists even if he refuses to acknowledge it, because the three farmers were used, not just lost. This binds him to them in a way that saving the forty thousand does not cancel.

  4. S: He should feel nothing but the weight of responsibility to ensure it never happens again, because guilt looks backward at sin while responsibility looks forward to prevention. To demand he feel guilty is to demand he indulge in useless pain that serves no function for the living or the dead. We need effective leaders, not penitents mourning unavoidable outcomes.
  W: But that forward-looking responsibility is exactly the alibi you accused me of ignoring, because it lets him treat the three deaths as mere administrative costs. If he feels no personal stain, he risks becoming the kind of person who sees humans as spillway variables rather than victims. That dehumanization is the real cost of your clean hands.

  5. S: I have to concede that treating the guilt as purely irrational might encourage the coldness that makes future atrocities easier to commit. So while the act was right, dismissing the psychological toll entirely undermines the kind of agent we need making these calls. Perhaps the feeling is a necessary guardrail even if the moral theory doesn't require it.
  W: That concession grants my core point that the remainder protects the moral community, even if you won't admit it sticks to the act itself. But if you agree the guilt is necessary, you've admitted the calculus doesn't close the ledger after all. The utility is not the whole story if the agent must be repaired.
