answer: |-
  # Specification for Adaptationist Explanations in Human Psychology

  **To:** Editorial Board and Reviewers
  **From:** [Your Name/Position]
  **Subject:** Revised Desiderata for Adaptationist Claims

  The following specification replaces the previous one-paragraph guidance. It is designed to operationalize the Gould–Lewontin critique without rendering adaptationist research impossible. The goal is not to ban adaptationist hypotheses, but to ensure they are distinguished from "Just-So Stories" by meeting specific evidentiary burdens.

  ### The Desiderata

  #### 1. Evidence of Special Design (Complexity and Efficiency)
  *   **Requirement:** The trait must exhibit complexity, specificity, or efficiency that exceeds what is expected from general-purpose laws of physics, development, or learning. It must look "engineered" for the proposed function.
  *   **Failure Mode:** *The Teleological Fallacy.* Assuming that because a trait has a useful effect, it was selected for that effect.
  *   **Illustration:** Claiming "blood circulation is an adaptation for oxygen transport" is valid; claiming "rocks are an adaptation for breaking nuts" is not. In psychology: Claiming "general intelligence is an adaptation for solving social problems" without showing a specialized mechanism distinct from general learning processes.
  *   **Status:** **Non-Negotiable.** (Following George Williams' criterion).

  #### 2. Exclusion of Specific Non-Adaptive Hypotheses
  *   **Requirement:** Authors must explicitly identify and test against distinct null hypotheses: (a) Architectural Byproduct (spandrel), (b) Developmental/Allometric Constraint, (c) Phylogenetic Inertia, or (d) Genetic Drift. A generic "alternative explanation" is insufficient.
  *   **Failure Mode:** *The Monolithic Null.* Treating all non-adaptive explanations as a single bucket of "noise" rather than distinct mechanistic claims.
  *   **Illustration:** Explaining music as an adaptation for social cohesion without ruling out the hypothesis that it is a **byproduct** of language processing and auditory emotion systems (Pinker's "auditory cheesecake" critique).
  *   **Status:** **Non-Negotiable.**

  #### 3. Distinction Between Historical Origin and Current Maintenance
  *   **Requirement:** The manuscript must specify whether the claim concerns the trait's *origin* (why it was selected in the past) or its *maintenance* (why it persists or is useful now). Evidence for current utility cannot be used as proof of historical origin.
  *   **Failure Mode:** *The Presentist Fallacy.* Assuming that because a trait is functional today, it was selected for that function in the Environment of Evolutionary Adaptedness (EEA).
  *   **Illustration:** Arguing that "sugar cravings are an adaptation for modern caloric intake." While the craving maintains energy balance now, its **origin** lies in a scarcity environment where high-calorie detection was selected; in the modern context, it is a mismatch, not a current adaptation for health.
  *   **Status:** **Non-Negotiable.**

  #### 4. Phylogenetic and Cross-Cultural Distribution
  *   **Requirement:** Claims of human-specific adaptations must be supported by evidence that the trait is not present in closely related primates (ruling out inertia) and is universal across diverse human cultures (ruling out local cultural invention).
  *   **Failure Mode:** *The WEIRD Assumption.* Generalizing from Western, Educated, Industrialized, Rich, and Democratic samples to the entire species' evolutionary history.
  *   **Illustration:** Claiming "monogamous pair-bonding psychology is a human adaptation" without addressing its variability across cultures or its presence/absence in great apes.
  *   **Status:** **Preference.** (Data is often unavailable or ambiguous for soft-tissue behaviors).

  ---

  ### Incompatibility Analysis

  You hypothesized that the demand for **genuinely testable alternatives** pulls against the demand for **evidence about actual historical origin**.

  I correct this hunch: This is not a logical incompatibility, but an **epistemic asymmetry**. We can test alternatives contemporaneously (e.g., is music a byproduct of language?), but we cannot directly observe historical selection events in the human mind. Therefore, we cannot satisfy a demand for *direct* historical evidence.

  The genuine incompatibility lies between **Desideratum 1 (Special Design/Optimality)** and **Desideratum 2 (Developmental/Phylogenetic Constraint).**
  *   **The Conflict:** A trait cannot be simultaneously argued as the *optimal* solution to a specific adaptive problem (requiring Special Design) and a *suboptimal legacy* of ancestral physiology (Constraint).
  *   **Why they cannot be jointly satisfied:** If a reviewer demands proof that a trait is the "best possible design" for a function (Adaptationism), they logically exclude the possibility that the trait exists merely because the ancestor's developmental pathway made it the "only possible design" (Constraint). Authors often try to have it both ways: arguing a trait is highly optimized for a function while admitting it is constrained by phylogeny. While real traits are a mix, a specific *claim* about a specific *feature* must choose a lane: is this feature here because it was optimized, or because it was constrained?
  *   **Resolution:** Authors must specify which aspects of the trait are putative adaptations and which are acknowledged constraints.

  ---

  ### Assessment of Current Practice

  Current practice in evolutionary psychology frequently fails **Desideratum 3 (Origin vs. Maintenance)**. The field is replete with arguments that establish a trait's current utility (e.g., "religion promotes group cohesion") and implicitly treat this as proof of its historical origin. This ignores the possibility that religion is a byproduct of hyper-active agency detection (a spandrel) that is *currently* co-opted for cohesion (an exaptation).

  Furthermore, reviewers often accept **Desideratum 2** failures by allowing authors to dismiss "byproducts" generically without specifying the developmental or architectural mechanism that would produce the byproduct. Without a mechanistic null hypothesis, the adaptationist claim remains unfalsifiable.

  While **Desideratum 4** is often cited as a preference, it is frequently ignored in favor of online convenience samples, weakening claims of universality. However, the most critical failure remains the conflation of current function with historical cause.

  Verdict: Distinction Between Historical Origin and Current Maintenance
