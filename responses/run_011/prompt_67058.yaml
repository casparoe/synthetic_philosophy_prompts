  On the phenomenal charge: you're asking what the word buys me, but I don't buy the split. The broadcasting *is* the feeling. The subject's "I didn't" is a report on their current memory state at the tone, not a valid negation of the experience at t1. You've dissociated access from long-term report, not access from phenomenality. The mechanism is decay: the active maintenance in the prefrontal nodes faded before the probe, leaving the motor trace intact but the conscious content gone.
