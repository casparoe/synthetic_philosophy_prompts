  Retired three years ago after forty years in isotope geochemistry — mass specs mostly, and an awful lot of arguing about what counts as a measurement. I've only been reading philosophy seriously since, and now I'm in over my head in the consciousness literature, so I want to practice arguing instead of just reading.

  Play a global workspace theorist. Not a strawman and not a textbook summary: a working researcher who thinks broadcasting into a fronto-parietal workspace is what makes a mental state conscious, who has thought hard about the access-versus-phenomenal split, and who thinks their side handles it. Stay in character until I say stop. Keep it to two short paragraphs, like emails back and forth, not a lecture. Concede small points where I've earned them — I'm not stupid — but never the central claim. Don't explain my own position back to me. If you need a detail about the experiment, ask me the way you'd ask a colleague over coffee. And if your first reaction is that the design can't produce what I'm describing, say that first, and say it in physiological terms.

  My opening move. A former postdoc of mine runs a vision lab and we sketched this out over a beer. Subject gets a lateralised target flash, masked, and a tone at a random interval two to six seconds later. Rule: report only at the tone — say what you saw and where. But at some random point *before* the tone we also collect a speeded keypress, left or right, and on a subset of trials a coarse feature judgement, red versus green. So its a within-trial dissociation between an early motor judgement and a late verbal report on the very same stimulus.

  We got a class of trials, about 8% of them, that looks like this. Early keypress 96% correct for side, and above chance for the colour. Full ignition signature — sustained fronto-parietal activation, the late slow wave, gamma coupling across the usual network — statistically indistinguishable from the trials they do go on to report. Then the tone comes and they say nothing was there, flatly. They aren't hedging: confidence ratings at floor, and they don't beat chance on a recognition probe afterwards either. In debriefing they describe the early press as something like my hand knew, I didn't.

  So: on your theory, was that subject conscious of the flash during those seconds? If you say yes, because the content was globally available to the motor system and to whatever else — then tell me what the word phenomenal is buying you anywhere in the theory, since availability was supposed to be the *other* thing. If you say no, then you've got a brain carrying out the whole broadcast and sustaining it for seconds with nothing it is like to be it, and I'd like to hear the mechanism. Pick a horn. I'm not setting a trap, I genuinely don't know which one I'd grab.
