  4.  **Drafting the Analysis - Section by Section:**

      *   **1. Theory of Obligation:** Need to explain how unilateral acts bind strangers. This points toward *conventional normativity* that has morphed into *moralized expectation*. The "default" design suggests a *presumptive entitlement* created by social scripting, not just psychology. The indifference of the beneficiary (server doesn't care, jacket owner isn't there) suggests the obligation is owed to the *practice* or the *community*, not the individual.
      *   **2. Separating Presuppositions from Fits:**
          *   *Harm:* Killed by Jaywalk (no harm) and Jacket (no harm).
