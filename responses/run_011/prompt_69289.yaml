          1.  Harm Principle (Mill): Fails Tip (no direct harm), Fails Jacket (no harm), Passes Jaywalk (potential harm, but empty).
          2.  Consent/Contract: Fails all (no explicit consent).
          3.  Fair Play/Reciprocity: Passes Tip (benefit received), Passes Jacket (scheme participation), Fails Jaywalk (no scheme).
          4.  Rule Consequentialism: Passes Tip (system collapse), Passes Jaywalk (general safety), Passes Jacket (order).
          5.  Signaling/Group Membership: Passes Tip (status), Passes Jacket (respect), Passes Jaywalk (law-abiding).
