  **Planning Stage: Candidate Accounts and Case Accommodation**

  | Account | Tip Refusal | Jacket Compliance | Jaywalk Violation | Viability |
  | :--- | :--- | :--- | :--- | :--- |
  | **Harm Principle** | Fails (No direct harm) | Fails (No harm) | Passes (Potential harm) | Killed by Tip/Jacket |
  | **Consent/Contract** | Fails (No explicit consent) | Fails (No agreement) | Fails (Implicit only) | Killed by all three |
  | **Fair Play** | Passes (Benefit from service) | Passes (Benefit from order) | Weak (No cooperative scheme) | Strong contender |
  | **Rule-Consequentialism** | Passes (System stability) | Passes (Conflict avoidance) | Passes (General safety) | Fits, but misses phenomenology |
  | **Signaling/Deference** | Passes (Audience presence) | Weak (Anonymous) | Fails (No audience) | Partial fit |
  | **Lewisian Convention** | Passes (Coordination) | Passes (Coordination) | Passes (Coordination) | Strong contender |

  *Note: No single account explains the phenomenological divergence (why Jaywalking feels permissible while Tip Refusal feels wrong). A hybrid of Fair Play and Convention is required.*

  ***

  **Reconstructing the Normative Architecture of Everyday Obligations**

  **1. The Theory of Obligation Presupposed**
  The three cases jointly presuppose a theory of obligation grounded not in interpersonal duty or state authority, but in *participation in a localized cooperative scheme*. For a unilateral act among strangers to bind them, the normativity must derive from the *practice itself* rather than the individuals involved. In the laundromat, the jacket binds because it signals entry into a temporary property convention; to move it is to defect from a system that benefits all participants by reducing conflict. This explains why the obligation survives the indifference of the beneficiary: the duty is owed to the *practice of queuing*, not the jacket owner.

  Regarding the tipping screen, the design does not create obligation *ex nihilo*; it leverages a pre-existing social script. For a preset default to count as an entitlement rather than a nudge, there must be a background convention that interprets the interface as a request for adherence to a wage-subsidy scheme. The guilt arises because the refusal is public; it signals a rejection of the local normative order. Thus, design choices cannot create moral obligations strictly speaking, but they can create *presumptive* obligations by making the cost of deviation socially visible. The obligation survives the worker's indifference because the violation is against the *observers* and the *system*, not merely the recipient.

  **2. Separating Presuppositions from Fits**
  We must distinguish what these practices *require* to function from what merely explains them comfortably.
  A **harm-based account** is killed immediately. The jaywalking case involves no harm yet is illegal; the jacket case involves no harm yet feels binding; the tip case involves structural harm (low wages) yet refusing feels like a personal moral failure. Harm is irrelevant to the immediate normative force.
  A **consent-based account** is also untenable. None of the actors explicitly consented. The laundromat user did not agree to the jacket rule; the coffee buyer did not agree to the tip screen.
  A **reciprocity or fair-play account** survives best for the Tip and Jacket cases. In both, the agent benefits from a cooperative scheme (service labor, orderly queuing) and is expected to bear a burden (tip, waiting) to sustain it. However, it struggles with the Jaywalk case, as crossing an empty street does not visibly undermine a cooperative scheme unless generalized.
  A **rule-consequentialist account** fits all three logically (universalizing these actions leads to bad outcomes), but it fails to explain the *phenomenological divergence*. Why does the agent feel guilt in the Tip case but not the Jaywalk case, if both are rule violations?
  A **signaling account** explains the Tip case (public performance of generosity) and partially the Jacket case (display of respect), but fails the Jaywalk case where no audience exists.
  Therefore, the practices strictly presuppose a **conventionalist account of obligation**: norms are binding because they are *shared expectations* that coordinate behavior. The moral "shell" my friend mentioned is real, but it is not merely manufactured; it is the mechanism by which conventions acquire normative force. The Tip and Jacket cases are *moralized conventions*; the Jaywalk case is a *legalized convention* that lacks moralization in the specific empty-intersection context.

  **3. Auditing the Consistency**
  Is the sorting predictable? The pattern does not track legality (Jaywalk is illegal but feels permissible). It does not strictly track harm. The variables that actually track the pattern are **social visibility** and **perceived participation in a cooperative scheme**.
  In the Tip case, there is high visibility and high scheme participation (you are being served). The refusal is a public defection.
  In the Jacket case, there is low visibility (anonymous) but high scheme participation (you are using the facility). The compliance is a private adherence to a local constitution.
  In the Jaywalk case, there is low visibility and low perceived scheme participation (the "scheme" of traffic safety feels irrelevant at an empty intersection).
  My description may load the dice by stipulating the intersection is "empty." If pedestrians were waiting, the Jaywalk case would shift toward the Tip case (public defection). However, even with an audience, jaywalking often carries less moral weight than stiffing a server. This suggests a second variable: **benefit receipt**. In the Tip and Jacket cases, the agent is actively receiving a benefit (coffee, machine access) contingent on the scheme. In the Jaywalk case, the benefit (crossing) is not contingent on the rule compliance in that specific instance. The consistency holds: obligation tracks *benefit receipt within a visible cooperative scheme*.

  **4. The Outsider and the Scope of Obligation**
  What binds the one-time stranger? The expectation that visitors fall in line presupposes a **territorial** scope of obligation, modified by **participation**. When you enter the laundromat or the cafe, you enter a jurisdiction of local norms. This is not merely expectation-based; it is a condition of entry.
  For the hard version—the stranger who receives no benefit, will never return, and whose refusal is unseen—a fairness-based account struggles. If there is no benefit, there is no fair play obligation. If there is no audience, there is no signaling obligation. What is left? Only a **Kantian respect for the practice**. The obligation reduces to: "Do not treat the cooperative scheme merely as a means to your end." Even if you gain nothing, undermining the convention (moving the jacket) treats the other participants as mere obstacles. However, this is thin. In the absolute absence of benefit and audience, the obligation likely evaporates, suggesting that these norms are not truly moral duties but **social contracts contingent on participation**. The "binding" feeling is the internalized habit of a social animal, not a rational imperative.

  **5. Rival Theory and Structural Replacements**
  Under the strongest rival theory—**Explicit Contractualism**—these practices would look different. Gratuities would be folded into posted prices (service charges). Queues would be managed by numbered ticket dispensers. Traffic signals would be decriminalized where no harm occurs.
  We observe that these replacements already exist. When a service charge is mandatory, the moral pressure to tip evaporates. When a ticket dispenser is used, the moral pressure to respect the jacket vanishes; the machine enforces the right. This observation is crucial. It suggests that the moral obligation in the original cases was **constituted by the ambiguity**. The moral pressure exists only where the enforcement mechanism is social rather than mechanical or legal.
  When the mechanism arrives, the moral pressure does not relocate; it dissolves. This teaches us that the obligation was never about the *outcome* (the worker getting paid, the queue being orderly) but about the *negotiation*. The "moral failure" in the tip case is the refusal to engage in the social ritual of subsidy. The "binding" nature of the jacket is the willingness to uphold a trust-based system. Once the system is hardened into law or code, the moral virtue of compliance is removed because the option to defect is removed. We learn that much of what we call "moral obligation" in social life is actually the **glue holding inefficient systems together**. When efficiency arrives via design, the glue is no longer needed, and the morality disappears. This confirms my counter-intuition: the jacket case feels binding because it relies on *our* virtue, whereas the jaywalking case feels neutral because it relies on *state* authority, which we feel permitted to ignore when the state's interest (safety) is not implicated.
