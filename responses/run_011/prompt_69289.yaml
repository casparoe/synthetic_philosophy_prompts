          *   *Fair Play:* Strong on Tip and Jacket, weak on Jaywalk (unless generalized).
          *   *Rule-Consequentialism:* Fits all, but doesn't explain the *feeling* difference (why Jaywalk feels okay).
          *   *Signaling:* Strong on Tip (audience), Strong on Jacket (respect), Weak on Jaywalk (no audience).
          *   *Conclusion:* A hybrid of Fair Play (systemic) and Signaling (social) seems necessary.
      *   **3. Auditing Consistency:** The sorting isn't consistent with legality (Jaywalk is illegal but feels fine). It tracks with *social visibility* and *perceived participation in a cooperative scheme*. Tip = Public refusal of scheme. Jacket = Private compliance with scheme. Jaywalk = Private violation of rule (not scheme). The "loading the dice" check: Is the intersection truly empty? Is the server truly unbothered? Assume the prompt's stipulations hold.
      *   **4. The Outsider:** What binds the one-time stranger? *Territorial* vs *Participatory*. If you enter the space (laundromat, cafe), you enter the *local normative order*. This is a form of *localized contractualism* or *conventional obligation*. The fairness account bites on the *benefit of order* itself, even if no specific benefit is received.
      *   **5. Rival Theory & Replacements:** If we move to explicit pricing (service charge) or mechanized queuing (tickets), the *moral* burden shifts to *legal/contractual* burden. The evaporation of moral pressure suggests the obligation was *constituted* by the ambiguity and the social negotiation, not by a pre-existing duty. This supports the *Convention* view over the *Natural Duty* view.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Word Count Check:* Need to ensure I hit 1,200-1,500 words. I need to expand on the philosophical implications of "design creating obligation."
      *   *Tone Check:* Keep it professorial. Avoid "I think." Use "The analysis suggests."
      *   *Specific Prompt Requirements:* Address the 5 points in order. Ensure the planning stage is terse.
      *   *Key Insight:* The distinction between *moralized conventions* (Tip, Jacket) and *legalized conventions* (Jaywalk). The Tip and Jacket cases rely on *social enforcement* without legal backing, whereas Jaywalk has legal backing without social enforcement (in this specific empty context). The crucial variable is *participation in a local cooperative scheme* vs *obedience to state authority*.
      *   *The "Design" Question:* Can design create obligation? No, it creates *salience*. The obligation comes from the shared understanding that the design represents a norm.
      *   *The "Indifference" Question:* If the server doesn't care, why the guilt? Because the obligation is to the *norm*, not the person. This is Durkheimian or Rawlsian (fair play).

  6.  **Final Polish:** Check headings. Ensure no citations. Verify word count range.

      *   *Planning Stage:* Keep it tight.
      *   *Section 1:* Focus on the source of bindingness (Convention -> Morality).
      *   *Section 2:* Eliminate Harm and Consent. Highlight Fair Play and Signaling.
      *   *Section 3:* Identify the real variables (Audience + Scheme Participation).
      *   *Section 4:* The Outsider problem (Territorial jurisdiction of norms).
      *   *Section 5:* The evaporation of morality when mechanisms change (suggests the obligation was procedural, not substantive).

      *Word Count Strategy:* I need to be expansive in the analysis sections to meet the minimum. I will elaborate on the philosophical distinctions between "obligation to person" vs "obligation to practice."

      *Let's write.*

      *(Self-Correction on Word Count)*: 1,200 words is substantial. I need to ensure I don't breeze through the sections. I will dedicate roughly 250 words per section.

      *(Self-Correction on Planning Stage)*: Keep it very brief as requested ("terse").

      *(Self-Correction on Citations)*: Do not use specific book titles. Use names like "Rawls" or "Lewis" only if necessary for the label (e.g., "Lewisian convention"). I will try to avoid names to stay safe on the "no citations" rule unless it's a common label like "Rawlsian fair play." The prompt says "use a theorist's name only where the label does real argumentative work." I will minimize this.

      *(Final check on Case 3)*: The jacket case is key. It's anonymous. Why does it bind? Because it's a *property convention* that substitutes for legal enforcement. It's a "trust but verify" system where the verification is social shame.

      *(Final check on Case 1)*: The tip screen. Is it a nudge or an entitlement? The prompt asks if design can create obligation. I should argue it creates *presumptive* obligation based on prior social contract.

