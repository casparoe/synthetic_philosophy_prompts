      *   **Case 2: Jaywalking (Violation).** Illegal? Yes. Harm? None (empty intersection). Audience? No (friend saw, but no public audience). Normative Force? Feels like nothing.
      *   **Case 3: Laundromat Jacket (Compliance).** Illegal? No (maybe trespass/theft if moved, but norm is waiting). Harm? None directly. Audience? Anonymous/One-shot. Normative Force? Feels genuinely binding.

  3.  **Planning Stage (Mental Draft):**
