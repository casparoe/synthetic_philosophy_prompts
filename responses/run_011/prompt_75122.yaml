  There is a noise outside this room. It is not the traffic. It is a question about your work. Some people say all taste is equal. They say rules are just walls built by old masters. Other people say some work is simply better. You have heard both sides this year. You have felt the heat between them. It is confusing.

  I want to tell you something simple. It comes from an old idea. David Hume wrote about it once. He did not write about art schools. He wrote about people. He said taste is not a rulebook. It is not a list of famous names. It is a skill. Like playing the cello. Like mixing glaze. You get better at judging art the same way you get better at making it. You practice. You compare.

  You need to see many things to know what works. You need to try many things to know what holds. When you look at only a little, everything looks new. When you look at a lot, patterns appear. The school used to require this. You used to have more time for it. You used to have more weeks to show work to everyone. That time is gone now. You cannot wait for the schedule to give it back. You have to steal it. You must seek out the comparison yourself. You must look at more work than feels comfortable.

  Some of you are worried. You worry that calling something good is just power. You worry that experts are just people with loud voices. You are right to worry. People do use taste to shut doors. They do wear authority like a costume. But knowing that a tool can be used badly does not mean the tool is broken. A hammer can break a thumb. It still builds houses. Ignoring the difference between good and bad does not free you. It leaves you alone. It leaves you without a map. You will drift.

  So how do you find the truth without getting trapped? How do you know who to listen to? Here is the key. We find the best work by listening to those who have seen the most. We find those people because they are the ones who keep finding the best work. It sounds like a circle. It is not. It is a path. You walk it by moving.

  You need to build your own group. Do not wait for a class. Find the people who care about your work as much as you do. Find the people who are not afraid to hurt your feelings. Not because they are cruel. Because they respect you. If someone tells you everything is perfect, they are a mirror that lies. If someone tells you what is weak, they are giving you a gift. It hurts to hear it. It should hurt. This is not homework. This is survival.

  You need to earn a place in their circle. You do this by showing up. You do this by listening when you want to defend yourself. Stop defending. Start hearing. When you hear a critique that stings, do not speak. Let it sit. Go back to your studio. Look at the work. See if the sting was true. If it was, fix it. If it was not, let it go. But do not ignore it.

  This is how you grow. It is about sharpening your senses. It is about clearing away the noise. The acoustics in this room are bad. The words will blur. The noise outside will not stop. People will tell you what to value. People will tell you nothing has value. Do not buy it.

  Trust your own eyes. But train them. Take them to see things that scare you. Compare the hate to the love. Find the difference. It is in the looking. It is in the making.

  Next Tuesday, do not work alone. Find three people. Tell them you want the truth. Tell them you can take it. Invite them for coffee. Put the work on the table. Ask them to look at what you made. Ask them to tell you what failed. Listen to them. Then go make something better. That is the only graduation that matters. The paper says you finished. The work says you began.

  Thank you.
