      *   Taste is not purely subjective; there is a standard.
      *   The standard is based on the joint verdict of true judges.
      *   Qualities of true judges: delicate sentiment, practice, comparison, freedom from prejudice, good sense.
      *   Circularity: How do we know the judges? By their agreement on works. How do we know the works? By the judges. Solution: Time and consensus among those with experience.
