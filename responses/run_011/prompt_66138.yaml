          4.  Weakened SP (e.g., robustness, equilibrium concepts). Cost: Legitimacy/complexity.

  7.  **Drafting the Design Note:**
      *   Contested reading: Does GS cover tie-breaking lotteries? Standard view: GS is for deterministic SCFs. Random SCFs require Gibbard (1977).
      *   Confidence: High on the manipulability of Condorcet methods. Lower on the specific weighting of the "textbooks overstated" point.
      *   Model answer weakness: Might oversimplify the Smith Set manipulation.

  8.  **Final Review against Constraints:**
      *   Start with Question.
      *   End with Design Note.
      *   No citations.
      *   No preface.
