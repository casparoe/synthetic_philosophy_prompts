      *   **Topic:** Gibbard–Satterthwaite (GS) theorem, specifically focusing on hypotheses and institutional application.
      *   **Scenario:** A constitutional convention drafting rules for a polity (9M residents, 4 budget packages).
      *   **Provisions:**
          1.  Strict rankings submitted.
          2.  Condorcet winner adopted if exists.
          3.  If no Condorcet winner, lottery from Smith Set (smallest set defeating outside).
          4.  Convention's defense: Pairwise majority = popular will; Lottery = outside control; Therefore strategy-proof & non-dictatorial. Textbooks overstated result.
      *   **Crux:** The rule is non-deterministic (lottery), so GS (deterministic) doesn't apply literally. BUT it is still manipulable (via affecting whether Condorcet winner exists or Smith Set composition). Convention is right that GS doesn't apply literally, but wrong that it achieves strategy-proofness.
      *   **Deliverables:**
          1.  Examination Question (tightened prose, preserve provisions/justification, note formula sheet).
          2.  Model Answer (~800 words).
          3.  Marking Scheme (20 marks, 5 required moves, characteristic botch, first-class vs. competent distinction, seductive errors).
