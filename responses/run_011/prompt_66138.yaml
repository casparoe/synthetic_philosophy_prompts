answer: |-
  **Examination Question**

  **Question 1 (20 Marks)**

  A constitutional convention is drafting rules for a polity of nine million residents. Once a year, the residents must choose among four budget packages. The draft charter provides:

  1.  Every resident submits a strict ranking of all four packages.
  2.  If some package defeats every other package in a head-to-head majority comparison, that package is adopted.
  3.  If no package does so, the adopted package is drawn by lot, with equal probability, from among the members of the smallest set of packages each of which defeats every package outside the set in a head-to-head majority comparison.
  4.  The convention defends the draft as follows: pairwise majority comparison is the purest expression of the popular will; the lottery in provision three is outside any individual's control; therefore no resident can gain by misrepresenting a ranking, sincerity is a dominant strategy, and the charter delivers a rule that is both non-dictatorial and strategy-proof. Since the textbooks say that is impossible, the convention concludes, the textbooks must have overstated their result.

  The hypotheses of the Gibbard–Satterthwaite theorem are reproduced on the formula sheet.

  Write an essay evaluating the convention's defense. Identify precisely which hypothesis of the theorem the draft charter violates, and explain whether this violation protects the charter from the theorem's conclusion. Assess whether the charter is indeed strategy-proof as claimed. Finally, discuss what modifications would be required to achieve genuine strategy-proofness and what political or institutional cost each modification would entail.

  ***

  **Model Answer**

  The convention's defense relies on a technical loophole in the Gibbard–Satterthwaite theorem while failing to secure the substantive property the theorem concerns. To evaluate the charter, we must first isolate the theorem's hypotheses: unrestricted domain, at least three alternatives, surjectivity, non-dictatorship, determinism, and strategy-proofness. The theorem states that no social choice function can satisfy all these simultaneously. Specifically, any rule that is strategy-proof, non-dictatorial, and surjective on three or more alternatives must be deterministic. Conversely, if a rule is non-dictatorial and strategy-proof, it cannot be deterministic unless it is dictatorial.

  The draft charter explicitly violates the determinism hypothesis. Provision three introduces a lottery over the Smith Set when no Condorcet winner exists. Because the outcome is probabilistic rather than fixed given a profile of preferences, the Gibbard–Satterthwaite theorem does not apply to this rule in its literal form. On this narrow technical point, the convention is correct: the textbooks' standard gloss that "no non-dictatorial voting system is strategy-proof" assumes deterministic outcomes. The charter escapes the theorem's impossibility result solely because it abandons determinism.

  However, escaping the theorem's scope does not guarantee the property the theorem restricts. The convention claims the rule is strategy-proof because the lottery is "outside any individual's control." This is false. While an individual cannot control the outcome of the coin flip in provision three, they can manipulate whether provision two or provision three applies. Consider a voter whose favorite package is in the Smith Set but who prefers the expected utility of the lottery over the Condorcet winner that would otherwise emerge. By strategically burying a strong rival—ranking a weak alternative higher to create a cycle—they can eliminate the Condorcet winner, triggering the lottery. Conversely, a voter might truncate their ranking to prevent a cycle if they prefer the certain Condorcet winner to the risky lottery. Because the mechanism switches between deterministic and probabilistic modes based on the profile, and because voters have preferences over lotteries, truthful reporting is not a dominant strategy. The rule is manipulable.

  To achieve genuine strategy-proofness, the convention must modify the charter, incurring significant costs. First, they could restrict the domain of admissible preferences, such as requiring single-peakedness. This restores the existence of a Condorcet winner, eliminating the lottery and satisfying strategy-proofness on that restricted domain. The cost is enforcement: ensuring nine million residents hold single-peaked preferences requires either coercive constraint on political platforms or intrusive elicitation of preference structures, which undermines the unrestricted expression the charter claims to protect.

  Second, they could randomize more thoroughly. Extensions of the theorem to probabilistic rules show that strategy-proofness requires the rule to be a random dictatorship. This would satisfy strategy-proofness but abandon the Condorcet principle entirely, severing the link between pairwise majority will and outcomes that the convention prizes as the "purest expression" of legitimacy.

  Third, they could move to cardinal reports with transfers, akin to a Vickrey-Clarke-Groves mechanism. This can achieve efficiency and truth-telling but requires interpersonal comparability of utility and the capacity for side payments. The charter explicitly relies on ordinal rankings; introducing transfers assumes a wealth distribution and metric of utility the current political framework lacks, raising concerns about plutocracy.

  Finally, they could weaken strategy-proofness to a graded robustness criterion, accepting some manipulability in exchange for Condorcet consistency. This is the most honest approach but requires admitting that the textbooks were not overstated, merely contextual. The convention's error is not in finding a loophole, but in believing the loophole delivers the benefit. They have avoided the theorem's prohibition by sacrificing determinism, but they have not achieved strategy-proofness. The literature remains correct: without dictatorship, one must sacrifice either determinism, strategy-proofness, or domain unrestrictedness. The charter sacrifices determinism but fails to secure strategy-proofness, leaving it vulnerable to the very strategic behavior it claims to immunize.

  ***

  **Marking Scheme**

  **Total: 20 Marks**

  **Required Moves (4 marks each):**
  1.  **Identify Determinism:** Correctly identify that the Gibbard–Satterthwaite theorem assumes a deterministic outcome and that Provision 3 violates this hypothesis.
  2.  **Scope Assessment:** Acknowledge that because the rule is non-deterministic, the theorem does not strictly forbid it (validating the convention's technical claim about the theorem's scope).
  3.  **Demonstrate Manipulability:** Explain why the rule is not strategy-proof despite the lottery (e.g., manipulating the existence of a Condorcet winner to trigger or avoid the lottery).
  4.  **Evaluate Alternatives:** Discuss at least two modifications to achieve strategy-proofness (e.g., domain restriction, random dictatorship, cardinal transfers) and articulate the specific cost of each.
  5.  **Conclusion on Legitimacy:** Conclude that the convention is technically right about the theorem's scope but practically wrong about the rule's properties, affirming the literature's core insight.

  **Characteristic Botch:**
  Candidates recite the Gibbard–Satterthwaite theorem and conclude the rule is impossible without noticing the lottery clause, or they accept the convention's claim that the lottery guarantees strategy-proofness without analyzing the transition between provisions 2 and 3.

  **First-Class vs. Competent:**
  A competent answer identifies the determinism violation and states the rule is manipulable. A first-class answer provides a concrete example of the manipulation strategy (e.g., burial to force a cycle) and distinguishes between the impossibility of deterministic strategy-proofness and the scarcity of probabilistic strategy-proof rules without naming specific external theorems.

  **Seductive Errors (Cost 2 marks each):**
  *   Inferring that the theorem covers rules with random tie-breaking.
  *   Conflating non-dictatorship with strategy-proofness.
  *   Assuming the lottery in Provision 3 purifies the whole rule against manipulation.
  *   Treating manipulability as a fatal defect of legitimacy rather than a matter of degree in the alternatives discussion.

  ***

  **Design Note**

  This item rests on a contested reading of whether Gibbard–Satterthwaite covers tie-breaking lotteries. Standard pedagogy treats the theorem as applying to deterministic social choice functions; probabilistic rules require Gibbard (1977). I grade on the basis that the convention is technically correct about GS scope but wrong on strategy-proofness. I am least confident in weighting the "textbooks overstated" point; a candidate arguing the standard gloss *is* misleading deserves credit, provided they acknowledge the rule remains manipulable. The model answer's reasoning may break down if a candidate argues that expected utility calculations make the lottery immune to manipulation; I reward specific burial examples over general assertions. The boundary between first-class and competent turns on whether the candidate sees that avoiding determinism does not automatically grant strategy-proofness.
