  # Special Issue Specification: Criteria for Theodicy vs. Defence

  **To:** Prospective Contributors
  **From:** Guest Editor
  **Subject:** Submission Standards for "The Architecture of Suffering"

  To ensure conceptual clarity and prevent the conflation of logical defences with explanatory theodicies, submissions to this special issue must adhere to the following specification. A *defence* demonstrates logical consistency between God and evil; a *theodicy* claims to identify the *actual* morally sufficient reason for God's permission of evil. Submissions claiming the title of "theodicy" must meet the following five requirements.

  ### 1. The Distribution Constraint
  *   **Requirement:** The account must explain the *actual quantity, intensity, and distribution* of suffering, not merely the logical possibility of some suffering. It must address why the world contains *this* pattern of evil rather than a less severe one compatible with the same stated goods.
  *   **Generating Case:** The Holocaust or the Lisbon Earthquake. A theory explaining why *some* moral evil is possible for free will fails if it cannot explain why *systematic, industrialized* evil was permitted rather than prevented at the threshold of significant harm.
  *   **Status:** **Non-negotiable.** (A defence need only show possibility; a theodicy must claim explanatory adequacy regarding reality.)

  ### 2. The Modal Distinction
  *   **Requirement:** The argument must explicitly distinguish between showing that God's permission of evil is *compatible* with divine attributes and explaining *why* this specific evil is permitted. It may not retreat to "we cannot know" when pressed for specific mechanisms.
  *   **Generating Case:** Plantinga's Free Will Defence. It successfully shows logical compatibility but explicitly declines to state the actual reason God permits evil. A theodicy must make the positive claim the Defence avoids.
  *   **Status:** **Non-negotiable.** (This is the definitional boundary between the genres.)

  ### 3. The Capacity Constraint (Integrable vs. Non-Integrable Harm)
  *   **Requirement:** The account must distinguish between victims capable of cognitively or spiritually integrating harm into a meaningful narrative (soul-making) and those who are not. It must provide a separate justification for suffering inflicted on beings incapable of such integration.
  *   **Generating Case:** The fawn burning in a forest fire (Rowe), the anencephalic infant, or the deeply demented patient. These subjects cannot exercise free will, learn moral lessons, or develop character through suffering.
  *   **Status:** **Non-negotiable.** (Any theodicy relying solely on moral growth or free will is empirically falsified by these cases unless supplemented.)

  ### 4. The Beneficiary Constraint
  *   **Requirement:** The account must specify whether the justifying good accrues to the *sufferer herself*, to *bystanders*, or to the *cosmic whole*. It may not fudge this distinction to hide utilitarian calculations.
  *   **Generating Case:** A child dying of leukemia. If the good is "inspiring charity in others" or "maintaining cosmic balance," the child is being used as a means. If the good is "entry to heaven," it accrues to the child. The distinction must be explicit.
  *   **Status:** **Non-negotiable.** (To treat a person merely as a means to a greater good violates standard deontological constraints assumed in most theological ethics.)

  ### 5. The Communicability Constraint (Sayability)
  *   **Requirement:** The explanation must be capable of being spoken truthfully to the sufferer by someone who loves them, without constituting an insult to their grief or intelligence.
  *   **Generating Case:** A pastoral visit to a grieving parent. Saying "This was necessary for the greater good" is often heard as an insult; saying "We cannot know God's reasons" is often heard as a dismissal. A valid theodicy must survive this interpersonal test.
  *   **Status:** **Local prejudice of one camp (Pastoral Theology/Pragmatism).** *Note: While morally desirable, some metaphysical camps argue truth is independent of its communicability.*

  ***

  ### Editorial Commentary on the Epistemic Tension

  You asked whether I agree that two of these requirements cannot both be met: the demand for **Epistemic Humility** (often implicit in Requirement 2's negation or explicit in Skeptical Theism) and the demand for **Sayability** (Requirement 5).

  **I agree.** These two demands are structurally incompatible within a single submission.

  1.  **Epistemic Humility** (specifically the Skeptical Theist variety) asserts that human cognitive limitations prevent us from discerning God's actual reasons for permitting specific evils. It posits a "noseeum" inference: we see no reason, but that doesn't mean there isn't one beyond our grasp.
  2.  **Sayability** requires that we *have* a reason we can articulate to a sufferer that validates their pain without reducing them to a prop in a cosmic drama.

  If you adopt Epistemic Humility, you cannot satisfy Sayability. To tell a sufferer, "There is a reason, but it is beyond your comprehension and I cannot tell you what it is," is functionally identical to telling them, "Your suffering is meaningless to you." It insults the sufferer by asserting a moral asymmetry that silences their protest. Conversely, if you satisfy Sayability, you have claimed knowledge of the specific reason, thereby violating Epistemic Humility.

  While I have marked Sayability as a "Local prejudice" in the specification above (to allow metaphysical rigor to be submitted even if pastorally difficult), I contend that any submission relying on Skeptical Theism to solve the Problem of Evil automatically fails the Sayability constraint. They cannot coexist. A submission must choose: either it claims to know the reason (Theodicy + Sayability) or it claims we cannot know (Defence/Skeptical Theism + Humility). It cannot claim both.

  Verdict: The Beneficiary Constraint eliminates the most candidate theodicies.
