answer: |-
  The rain in Merriam Falls didn't wash things clean; it just made the rust stick harder. Inside the Cordic Mutual regional office, the light was a flat, fluorescent gray that matched the weather outside. Dale sat behind a desk cleared of everything except two sheets of paper and a pen.

  Renata Ostrowski sat opposite him, clutching her purse with both hands. She looked like she hadn't slept since the surgeon mentioned the complication rider. Standing behind her chair was a woman Dale didn't have a name for yet. She wore a coat that was too thin for the season and held a clipboard against her chest like a shield.

  "Ms. Ostrowski," Dale said, tapping the top sheet. "This is Form 104-A. The Surgical Pre-authorization Supplement."

  "I know," Renata said. Her voice was thin. "I filled it out in the waiting room."

  "And this," Dale said, sliding the second sheet over the first, "is Form 104-B. The Supplemental Liability Election."

  Renata nodded. She didn't look at the paper. She looked at the woman behind her.

  Dale picked up his pen. He wasn't supposed to adjudicate in person, but the flag on Renata's file had come across his desk with a note: *Inconsistent Preference Expression.* He looked at the boxes. On Form 1, Box A was initialed. *Flat payout of $100,000 upon listed complication.* On Form 2, Box D was initialed. *$25,000 upon listed complication subject to panel lottery draw.*

  "You chose the certainty on the big form," Dale said. "And the lottery on the small form."

  "It felt right," Renata said.

  "The Accord Pilot rules state that a member must express a consistent risk profile across both tiers," Dale said. He kept his voice level. He had said this words a hundred times this month. "If the selections don't align—both certain or both lottery—the system records no preference. You get the Default Model."

  "The Default pays nothing unless the panel draws me on both," Renata said. "I know what the Default is."

  "Then you know why we're here." Dale pushed a fresh copy of Form 2 across the desk. The paper slid with a dry whisper. "I need you to fill this out again. Just you. No help."

  The woman behind Renata shifted her weight. The floorboard creaked. "She's already expressed her preference, sir. It's right there."

  Dale looked up at her. "You're not the member."

  "I'm here to ensure the forms are legible."

  "You're here because you're selling consistency," Dale said. He hadn't meant to say it so sharply, but the room was small. "I've seen your handwriting on three other files this week. Same ink. Same pressure."

  The woman didn't flinch. She stepped around Renata's chair and placed a hand on the back of it. "My name is Mara. And I'm here because your forms are traps."

  Dale capped his pen. "Fill out the form, Ms. Ostrowski."

  Renata picked up the pen. Her hand hovered over the paper. Form 2 was a smaller version of Form 1, shrunk down like a photocopy reduced to fit a wallet. The boxes were in the same corners. The language was identical, just the zeros peeled away. *$100,000* became *$5,000*. *$500,000* became *$25,000*. The lottery draw was still one in ten.

  Renata's pen trembled over Box C. The flat $5,000.

  "If I pick this," Renata said, "it means I'm safe. Like I picked on the big one."

  "Yes," Dale said.

  "But five thousand dollars..." Renata looked at Mara. "It's not enough to fix the roof. It's not enough to pay the deductible."

  "So take the chance on the twenty-five," Dale said. "If you're willing to gamble on the half-million, gamble on the twenty-five."

  "It's not the same," Renata said. She put the pen down. The click sounded like a gunshot in the quiet office. "On the big one, if I lose, I lose everything. On the small one, if I lose, I lose nothing I expected to have."

  "The rule doesn't care about expectation," Dale said. "It cares about alignment."

  Mara leaned in. Her voice was low, rough like gravel under tires. "Sir, look at the paper. Really look at it."

  Dale looked.

  "You ask them to feel the same way about five thousand dollars as they do about one hundred thousand," Mara said. "You print the boxes the same size. You put the checkmarks in the same place. You make the logic look identical. But nobody feels identical about those numbers."

  "That's the point of the actuarial model," Dale said. "Rational consistency."

  "Rational for who?" Mara tapped the desk. "For the machine? The machine doesn't have a roof leaking. The machine doesn't have a kid in college. For the machine, a ten percent chance is a ten percent chance. For Renata, a guaranteed hundred thousand is a life. A guaranteed five thousand is a Tuesday."

  Dale looked at Renata. She was staring at her hands.

  "If I mark Box C," Renata said softly, "I'm lying. I don't care about the five thousand. I'd rather take the shot."

  "If you mark Box D," Dale said, "you contradict Form 1. You invalidate the file. You get the Default. The Default is worse than Box C."

  "I know," Renata said.

  Mara reached out and touched the fresh form. "Let me show you."

  "Don't," Dale said.

  Mara ignored him. She took the pen from Renata's hand. Her grip was firm. She didn't look at Dale. She looked at Renata. "You want the safety on the big one. You know that's the only money that matters. So you mark Box A. You did that right."

  "I did," Renata said.

  "Now, on this one," Mara said, hovering over Box C. "The system wants you to mark Box C. Safe and Safe. That's the 'aligned' pattern. That gets you the payout you want without the audit."

  "But I told you, I don't want the safe five thousand," Renata said.

  "If you mark Box D, Cordic says you don't know what you want," Mara said. "They say you're confused. They take the choice away. They give you the Default. And the Default leaves you with nothing unless the lottery hits on both. You know the odds."

  Renata swallowed. "So I lie."

  "You speak their language," Mara corrected. "You tell them you're consistent so they let you keep what's yours. I'm not changing what you want. I'm changing how you say it so they hear you."

  Dale watched the pen tip hover over Box C. It was a simple motion. A checkmark. But it felt heavy. The rule was clear: *Member must express preference.* If Mara filled it out, was it the member's preference? If Renata marked it knowing it was a game, was it honest?

  The rain streaked the window behind Dale, blurring the brick wall of the adjacent building. Merriam Falls was full of people who learned to navigate systems designed to exclude them. You didn't fight the turnstile; you slipped through the gap.

  "If I sign this," Dale said, "and an audit finds the handwriting match..."

  "Then you flag it," Mara said. She didn't look up. "And Renata gets the Default. And you go home knowing you followed the rule."

  "And if I don't?"

  "Then you go home knowing you followed the person."

  Renata looked at Dale. Her eyes were wet, not with tears, but with a kind of exhausted calculation. She was doing the math Mara wouldn't say out loud. The cost of integrity versus the cost of the roof.

  Dale looked at the original forms. Form 1, Box A. Form 2, Box D. The invalid pair. The human pair.
  He looked at the fresh form. Box C was empty.

  The rule existed to prevent adverse selection. To keep the pool stable. To ensure that people didn't game the risk tiers. It was defensible. It was math. It was the spine of the Accord Pilot.

  But the spine didn't bleed.

  Dale reached out and took the fresh form. He crumpled it into a ball and dropped it into the wire bin under his desk. It landed with a soft thud.

  He picked up the original Form 2. The one Renata had filled in the waiting room. The one with Box D checked. The one that mismatched Form 1.

  He opened his stamp. The red ink pad was dry in the corners. He pressed it down on the approval box. *VALIDATED.*

  "This stays in the file," Dale said. "The original set."

  "That's not protocol," Mara said. Her voice wasn't triumphant. It was quiet.

  "Protocol says inconsistent preferences yield no preference," Dale said. He capped his pen. "I'm adjudicating that Ms. Ostrowski's preference is clear, despite the variance in risk tolerance across magnitudes. It's a judgment call."

  "It's a risk," Mara said.

  "Yes."

  Renata let out a breath she seemed to have been holding since she walked in. She stood up, her legs shaky. "Thank you."

  "Don't thank me," Dale said. He didn't look at them. He looked at the red stamp on the paper. It looked bright against the gray room. "Just get the surgery."

  Mara nodded once. She took Renata's elbow, guiding her toward the door. At the threshold, Mara paused. She didn't turn around.

  "You know," she said to the wall. "Next week, the ink might look different. The pressure might change. People get nervous."

  "I know," Dale said.

  "Someone else might catch it."

  "Probably."

  Dale waited until the door clicked shut. He picked up the crumpled ball of paper from the bin and smoothed it out on his desk. It was blank. He looked at the validated form again. The red ink was already drying.

  He opened his drawer and took out his own pen. He pulled the file toward him. In the auditor's notes section, where he was supposed to log the inconsistency code, he wrote *None*.

  He closed the file. The room was quiet again, except for the rain hitting the glass. He rubbed his thumb over the stamp mark until the red smudged on his skin, a small, permanent stain that wouldn't wash off until tonight. He left it there.
