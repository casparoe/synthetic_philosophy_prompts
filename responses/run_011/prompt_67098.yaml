prompt: |-
  I have no academic training in philosophy — I run a small bookkeeping practice and read on my own in the evenings — but for the past few weeks I have been going back and forth between Simone Weil's short wartime essay arguing that political parties should be abolished outright and a long, well-written online piece about that essay, which I have been forwarding to people in a local campaign for randomly selected citizens' assemblies. I read the essay once, slowly, and I mostly agreed with the piece until I tried to check it against what I remembered. Something has been nagging at me and I cannot locate it. Before I keep repeating this summary in public, I would like an accuracy audit of it.

  Here is the piece's summary, with its sentences numbered as they appeared:

  1. Weil's case against parties is usually mistaken for a plea for better behaviour, but it is really a structural claim about incentives.
  2. A party, she says, is a machine whose one true objective is its own growth without limit, so every question it touches becomes a recruiting question.
  3. It therefore exerts continuous pressure on the minds of its members, until a member stops asking whether something is true or just and starts asking whether it is good for us.
  4. From this she concludes that every party is totalitarian in embryo, whatever its programme, and that the condition is not curable by reform, better leadership, or cooperation between parties.
  5. Her remedy is institutional rather than moral: abolish parties, let candidates stand as individuals, and fill the assembly by lot from ordinary citizens, so that nobody owes their position to an organisation or to a reputation.
  6. She also thought this was easier than it sounds, and that the only real obstacle is the unexamined assumption that parties are natural.
  7. Underneath all of it is a deeper objection to the idea of collective will: for Weil, politics is not about adding up what people want but about attending to what is just, and any organisation with a will of its own blocks that attention.
  8. That is why she reads as a forerunner of today's anti-partisanship movement — her argument applies with even more force to a two-party system in which both sides treat every issue as a membership drive.

  For what it is worth, I am already inclined to believe sentences 2, 4 and 8, and I suspect the piece is flattering that inclination rather than reporting Weil, but I cannot say where the seam is.

  Please give me the following, in this order:

  **A one-sentence overall verdict** on whether the summary is fair, mixed, or unfair to the essay.

  **A table, one row per numbered sentence, with exactly these columns:**
  - *Claim* — the sentence number and a phrase identifying it.
  - *Verdict* — exactly one of: Accurate; Fair simplification; Distortion; Invention; Not enough to say. Use *Distortion* where the piece states something Weil would recognise but frames it so that it does different work than it does for her; use *Invention* only for a detail she does not propose or hold at all.
  - *What Weil's argument actually is* — one or two sentences on her own reason for the claim, not on whether the claim is true of parties today.
  - *Why it matters* — what is lost or gained by the difference, stated concretely.

  **Two short prose paragraphs.** The first: on sentence 8 specifically, whether it follows from anything true in sentences 1 through 7, and what a careful reader of Weil would say about borrowing her for a contemporary campaign. The second: on the deepest disagreement between the piece and the essay, if there is one — the place where the piece's framing and hers come apart most, even if the words look compatible.

  **A JSON object** with exactly these fields: `overall_fairness` (one of "fair", "mixed", "unfair"); `single_worst_misrepresentation` (which numbered claim, and why); `claims_worth_repeating` (an array of two or three strings, each giving a claim number and a corrected one-line version I could say out loud); `usable_by_the_assembly_campaign` (one of "yes", "no", "only_with_rewording"); `what_to_say_instead` (two or three sentences I could actually use with the campaign); `low_confidence_points` (an array of strings naming anything in your audit where your knowledge of the essay's details is thin).

  Two constraints. Do not give me citations, page numbers, publication dates, or a reading list — I will find the text myself, and a guess at those details is worse than none. And please do not put words in quotation marks as though Weil wrote them unless you are certain of the exact wording; paraphrase instead, and use the Not enough to say option generously rather than filling in a plausible-sounding detail, especially about the institutional arrangements she actually proposed.
