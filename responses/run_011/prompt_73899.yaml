answer: |-
  This is a sophisticated set of questions that cuts to the core of Millikan's project. Millikan's prose in the opening of *Biosemantics* (and *Language, Thought, and Other Biological Categories*) is notoriously dense because she is trying to carve out a conceptual space that avoids both Platonism (functions as abstract norms) and Reductionism (functions as mere causal dispositions).

  Since you are constrained to the opening passages (and your paraphrase of them), I will ground my analysis in the logic you've provided, flagging where the text likely underdetermines the interpretation and where your reading group might be projecting later distinctions backward.

  Here is a breakdown of the five interpretive nodes you identified.

  ### 1. The Bearer of Proper Function: Token, Pattern, or Both?

  **The Textual Logic:**
  Your paraphrase notes that for artifacts, explanation runs through a "pattern that persists because items made according to it reliably perform their function." For biology, it involves "ancestral items that performed the function successfully."

  **The Interpretive Disagreement:**
  Your group is likely debating whether the *function* belongs to the physical object (the token can opener), the design (the pattern), or the lineage.

  **Analysis:**
  Based strictly on the selection-history definition provided:
  *   **The Token is the Bearer:** The text defines proper function for "a thing" (e.g., a heart, a can opener) based on *its* history. The individual can opener on your counter has a proper function.
  *   **The Pattern is the Explanation:** The pattern (or "design") does not *have* the function; rather, the pattern explains *why* the token has the function. The token is a "copy" of the pattern.
  *   **What Gets Selected:** In the artifact case, *human intentions* select the pattern. In the biological case, *natural selection* filters the items. However, in both cases, the **reproductive family** is the unit of explanation.

  **Where You Might Be Projecting:**
  If your group argues that "the pattern has the function," they may be conflating Millikan's view with a Platonic or structuralist view. Millikan is a materialist about function bearers. The function is in the token *in virtue of* its relation to the pattern's history.
  *   **Underdetermination:** The paraphrase says "items made according to [the pattern]." It is slightly ambiguous whether the *first* can opener (the prototype) has a proper function. Millikan usually handles this by saying the prototype's function is derived from the maker's intention, while subsequent copies derive it from the prototype. If your text doesn't specify the prototype, this is a genuine gap.

  **Verdict:** The token bears the function; the pattern/lineage explains it. Disagreements here are likely **substantive** if one side claims abstract patterns have causal powers, but **verbal** if it's just about how we speak of "the can opener's design."

  ### 2. The Status of Normal Conditions

  **The Textual Logic:**
  Normal conditions are an "idealization" defined as "the circumstances under which ancestral items actually succeeded in performing their function."

  **The Interpretive Disagreement:**
  Are these statistical averages? Counterfactuals? Normative rules? And can a trait have a function if it *never* meets these conditions?

  **Analysis:**
  *   **Descriptive vs. Normative:** This is the crux of Millikan's naturalism. Normal conditions are **descriptive of the past** (ancestors *did* succeed here) but **normative for the present** (the current item *ought* to succeed here). The "ought" is naturalized because it is grounded in a historical fact, not a moral rule.
  *   **Statistics:** They are *not* current statistical averages. If 90% of hearts in a population are diseased due to pollution, the Normal conditions are not "polluted air." They are the conditions under which the *ancestors* pumped blood successfully.
  *   **The "Never" Case:** Can a trait have a proper function if it never operates in Normal conditions during its lifetime? **Yes.** A heart that fails at birth still has the proper function of pumping blood. Why? Because its *ancestors* performed this function under Normal conditions. The current token's failure does not erase the historical fact that established the function.

  **Where You Might Be Projecting:**
  Reading groups often import "ideal rational agent" counterfactuals here. Millikan's Normal conditions are not about what *would* happen if things were perfect; they are about what *did* happen in the specific historical lineage that allowed reproduction to occur.
  *   **Underdetermination:** The text says "circumstances." How specific are these? (e.g., "presence of oxygen" vs. "presence of oxygen at 1 atm"). The opening passage usually leaves this vague, deferring it to specific biological analysis. If your group is arguing over the *granularity* of Normal conditions, the text underdetermines this.

  **Verdict:** Normal conditions are historical/descriptive regarding ancestors, but normative regarding current tokens. A trait can have a function without ever meeting Normal conditions. Disagreements about "normativity" are **substantive** (is history enough to ground 'ought'?), while disagreements about "statistics" are likely **verbal** (confusing current frequency with historical success conditions).

  ### 3. Causal vs. Reproductive Explanation

  **The Textual Logic:**
  The text distinguishes "causally (like a hand causing a chair to exist)" from "pattern... that governs reproduction."

  **The Interpretive Disagreement:**
  Is this a real ontological difference, or just a shift in emphasis? Is there a risk of circularity (defining reproduction by function)?

  **Analysis:**
  *   **Ontological Difference:** It is ontological regarding **kind-membership**.
      *   *Direct Causal:* A hand makes a chair. If I make a second chair, it is not a "copy" of the first in the relevant sense unless I use the first as a model.
      *   *Reproductive:* A can opener is made *because* previous can openers existed and worked. The existence of the ancestors is the *cause* of the existence of the token (via the pattern).
  *   **Circularity Risk:** The worry is: "To define function, you need reproduction. To define reproduction, you need function (copying *for* a purpose)."
  *   **Millikan's Solution (Implicit in the text):** Reproduction is defined structurally/causally, not functionally. Item B is a copy of Item A if A played a causal role in B's existence and B resembles A. This can be defined without mentioning "function." Function is then added as the *reason* the copying persisted.

  **Where You Might Be Projecting:**
  If your group argues this is just "emphasis," they are missing the **lineage** ontology. Millikan is claiming that biological (and artifact) kinds are *historical individuals*, not natural kinds defined by intrinsic properties.
  *   **Underdetermination:** The paraphrase mentions "hand causing a chair." This is a bit of a red herring. A hand causes *this* chair, but the *kind* "chair" persists via reproduction of design. If the text doesn't clarify that even artifacts rely on reproductive history (of designs), the distinction looks weaker than it is.

  **Verdict:** This is a **substantive** ontological claim about how kinds persist. Circularity is avoided if "copying" is defined structurally prior to "function."

  ### 4. Deriving Content from Proper Function

  **The Textual Logic:**
  "A representational device has a derived proper function to stand in a mapping relation to the world, and what it represents depends on what that mapping correlates with under Normal conditions."

  **The Interpretive Disagreement:**
  Is content determined by the correlation in Normal conditions *now*, or what ancestors mapped onto? How is falsehood possible?

  **Analysis:**
  *   **Ancestral vs. Current:** Content is fixed by the **historical correlation** that drove selection. If a device was selected because it correlated with X, it represents X, even if it now correlates with Y (due to environmental shift).
  *   **Falsehood:** Falsehood is possible because the device has a function to map to X (under Normal conditions), but it can fire when X is absent.
      *   *Example:* A frog's fly-detector fires at a BB.
      *   *Function:* To map onto Flies (because ancestors caught flies).
      *   *Normal Conditions:* Conditions under which ancestors caught flies.
      *   *Reality:* A BB is present.
      *   *Result:* The representation is "Fly." The world contains "BB." The representation is false.
  *   **The Tension:** If content is "what it correlates with under Normal conditions," does that mean if the Normal conditions change, the content changes? Millikan says no; the Normal conditions are fixed by the *history of selection*, not current adaptability.

  **Where You Might Be Projecting:**
  Reading groups often struggle with the "Mapping Relation." Is it isomorphism? Causal covariance? The opening text usually leaves this abstract. If your group is arguing about the *mechanics* of the mapping, the text underdetermines this.
  *   **Underdetermination:** The phrase "derived proper function" for representations is key. It implies representations are tools *for* something else (e.g., guiding action). If the text doesn't specify what the representation is *for* (the consumer), the account of content is incomplete.

  **Verdict:** Content is determined by the historical correlation that established the function. Falsehood is the deviation from that correlation in non-Normal conditions. Disagreements on "what maps to what" are **substantive** if they concern the historical anchor, but **underdetermined** if they concern the mechanics of mapping.

  ### 5. Dialectical Purpose of the Can Opener

  **The Textual Logic:**
  The argument moves from Artifacts -> Biology -> Representation.

  **The Interpretive Disagreement:**
  Why start with artifacts? Does this convince a skeptic about naturalized normativity?

  **Analysis:**
  *   **The Bridge:** Artifacts are the "intuition pump." We readily accept that a broken can opener is *supposed* to open cans (normativity) even if it can't (failure). We also accept this is naturalizable (it's about human history/design, not magic).
  *   **The Move:** Millikan wants to show that Biological Function has the *same logical structure* as Artifact Function, minus the human designer.
      *   Artifact: Selected by Human Intention.
      *   Biological: Selected by Natural Selection.
      *   Shared Structure: Reproductive Family + Historical Success Conditions.
  *   **The Skeptic:** A skeptic about naturalized normativity might say, "Artifacts have functions because humans *intend* them. Nature has no intentions. Therefore, biology has no functions."
  *   **Does it Convince?** Only if the skeptic accepts that **Natural Selection can play the role of Human Intention.** Millikan argues that selection history provides the same "stabilizing" explanation that human design does. If the skeptic demands a *Mind* for normativity, the can opener example won't convince them. If they accept that *history* can ground normativity, the can opener shows them how.

  **Where You Might Be Projecting:**
  Do not assume the can opener example is meant to prove biological function *exists*. It is meant to clarify the *concept* of proper function. If your group thinks Millikan is arguing "Biology is just like Artifacts," they are overstating it. She is arguing "The *definition* of function that works for Artifacts also works for Biology."

  **Verdict:** The dialectical purpose is **conceptual clarification**, not ontological proof. It convinces only those willing to accept selection history as a functional ground. Disagreements here are **substantive** regarding the validity of the analogy between Design and Selection.

  ### Summary for Your Seminar

  When you present, I recommend structuring your clarification around these distinctions:

  1.  **Token vs. Type:** Insist that functions belong to tokens (hearts, openers) but are explained by types (lineages, designs).
  2.  **Historical vs. Current:** Insist that Normal Conditions are fixed by ancestral success, not current statistics or counterfactual perfection.
  3.  **Structure vs. Source:** Emphasize that the Can Opener is there to isolate the *structure* of functional explanation (reproduction + success) from the *source* (humans vs. nature).

  **Key Flag for the Group:**
  If your group members are disagreeing on whether a broken heart has a function, that is a **substantive** disagreement about the definition of Proper Function (Millikan says Yes; Dispositionalists say No). If they are disagreeing on whether the "pattern" is physical or abstract, that is likely **verbal** (Millikan treats patterns as causal histories of copies, not abstract objects).

  This approach keeps you grounded in the text's logic without needing to resolve the entire philosophy of biology debate in one session.
