answer: |-
  # Seminar Handout: The Coffee & The Machine
  **Instructions:** Read each scenario. Choose the option that best matches your intuition about what is *actually* happening. There are no right answers, only different starting points.

  **1. The First Taster**
  Mr. A drinks his morning coffee. He says, "The flavor is exactly the same as it was last year, but I just don't enjoy it anymore."
  *   **A.** The flavor really is the same; only his mood or preference shifted.
  *   **B.** If he doesn't enjoy it, the flavor *must* have changed for him, even if he can't describe how.
  *   **C.** "Flavor" and "Enjoyment" are too mixed up to separate here; the question is unclear.

  **2. The Second Taster**
  Mr. B drinks the same coffee. He says, "This tastes different than it used to, but I like it just as much as I always did."
  *   **A.** He is reporting a real change in his private experience, independent of his liking.
  *   **B.** If his liking and behavior didn't change, nothing important changed; he's misdescribing it.
  *   **C.** He might be right, but we can never know if the change was in the coffee or in him.

  **3. The Machine**
  We wire a taster to a machine that reads brain states. The machine reliably signals "Different Brew" whenever the coffee changes, even when the taster says "Tastes the same."
  *   **A.** The machine detects a difference in the taster's experience that the taster misses.
  *   **B.** The machine detects a physical difference that doesn't rise to the level of experience.
  *   **C.** If the taster says it's the same, then for the taster, it *is* the same. The machine is measuring something else.

  **4. The Memory Wipe**
  A taster drinks coffee every day. Each night, their memory of the previous day's taste is erased. They say, "This tastes like coffee," but have no memory to compare it to.
  *   **A.** Their experience is the same as yesterday's, they just can't access the comparison.
  *   **B.** Without memory, there is no fact of the matter about whether it's the same as yesterday.
  *   **C.** The experience is new every time; "sameness" only exists in memory.

  **5. The Disagreement**
  You and a friend drink from the same cup. You say "Bitter." They say "Sweet." You both act normally (drink it, buy it).
  *   **A.** One of you is wrong about how the coffee actually tastes to you.
  *   **B.** You both are right; the coffee simply tastes different to each of you.
  *   **C.** Since you both drink it happily, the argument is just about words, not reality.

  **6. The Distracted Soldier**
  A soldier is shot in battle but is too focused on fighting to notice. Later, they say, "I felt no pain at the time."
  *   **A.** The pain was there, they just ignored it.
  *   **B.** If they didn't notice it, there was no pain experience at that moment.
  *   **C.** The damage was there, but "pain" requires awareness, which was absent.

  **7. The Perfect Actor**
  A person screams and clutches their leg when hit, exactly as you would, but insists, "I am not actually hurting."
  *   **A.** They are in pain but lying or confused.
  *   **B.** They are not in pain; they are just behaving that way.
  *   **C.** "Pain" is defined by the behavior, so they are in pain regardless of the report.

  **8. The Robot**
  A robot distinguishes red from green perfectly and uses the words correctly, but has no biology.
  *   **A.** It sees color just like we do.
  *   **B.** It processes data, but it doesn't *see* the color.
  *   **C.** "Seeing" just means discriminating correctly, so it sees color.

  **9. The Switch**
  Imagine we could swap your color experience with mine (you see what I call "red" when I see "green") without changing our behavior or language.
  *   **A.** This is a real possibility; our inner worlds would be swapped.
  *   **B.** This is impossible; if behavior and language are the same, the experience is the same.
  *   **C.** The idea makes sense, but there's no way to verify it, so it doesn't matter.

  **10. The Hidden Truth**
  Two people describe an experience differently but act exactly the same in every testable way.
  *   **A.** There is a hidden truth about who is right that we can't measure.
  *   **B.** If every test is the same, there is no difference to find.
  *   **C.** There might be a difference, but it is permanently private and unknowable.

  ***

  # TA Guide: Scoring, Space, and Mapping

  ## 1. Building the Space
  To interpret the results, we must define the philosophical dimensions the quiz probes. We are looking at the intersection of **Ontology** (what exists) and **Epistemology** (how we know it).

  *   **Dimension 1: The Inner Object.** Is there a private property of experience distinct from behavior/function? (Yes/No/Incoherent)
  *   **Dimension 2: Subjective Authority.** Is the subject's report the final word on their experience? (Incorrigible/Fallible/Irrelevant)
  *   **Dimension 3: Determinacy.** When reports and functions diverge, is there a fact of the matter? (Yes/No)

  ## 2. Locating the Views
  Here is how the major positions map onto answer patterns. Note that students will rarely be pure types; look for clusters.

  | Position | Core Intuition | Typical Answer Pattern |
  | :--- | :--- | :--- |
  | **Naive / Relational Realism** | Experience is a direct, known relation to the world. | **1A, 2A, 5B, 7A.** Trusts the subject's report as a direct window onto reality. Assumes disagreement implies different relations to the object. |
  | **First-Order Representationalism (FOR)** | Experience is representing external properties. | **1A, 2B, 5C, 8C.** Focuses on the external object (the coffee, the color). If the representation is accurate/functional, the experience is accounted for. |
  | **Higher-Order Thought (HOT)** | Experience requires awareness *of* the state. | **3C, 4C, 6B/C.** If you don't notice it (memory, attention), it isn't a conscious experience. Distinguishes state from awareness of state. |
  | **Illusionism** | The "inner glow" is a cognitive mistake. | **2B, 7B, 9B.** Denies the existence of the extra "feel." The robot (8B) doesn't see because the "seeing" we prize is an illusion. |
  | **Dennett (No-Fact-of-the-Matter)** | The question assumes a false distinction. | **1C, 3C, 4B, 5C, 9C, 10B.** Rejects the premise that there is a hidden truth behind the dispositions. Heterophenomenological stance. |
  | **Judgment Change (Coffee Case)** | Specific to valence vs. quality. | **1A, 2A.** Accepts the distinction between sensory quality and hedonic tone (liking). |
  | **Experience Genuinely Changed** | Realist about phenomenal change. | **1B, 2A, 3A.** Believes the "feel" can shift independently of judgment or discrimination. |

  ## 3. Empty Spots in the Space
  There are logical combinations that no major theory occupies.

  *   **Real Inner Object + No Fact of the Matter.**
      *   *Why Empty:* If you believe there is a real, private inner object (Realism), you generally believe there is a fact about whether it changed. To say it exists but there's no fact about its identity is unstable (though close to Mysterianism).
  *   **Illusionism + Subjective Incorrigibility.**
      *   *Why Empty:* If the "feel" is an illusion, the subject can be wrong about it. Claiming the illusion is both fake *and* that the subject cannot be wrong about it is contradictory.
  *   **FOR + Inverted Spectrum is Real (9A).**
      *   *Why Empty:* FOR typically ties experience to the represented content. If the content (red) is the same, the experience is the same. Accepting 9A usually pushes one toward Dualism or Property Realism, not pure FOR.

  ## 4. Limitations of the Quiz
  Be prepared to tell the class what this quiz *cannot* do.

  *   **FOR vs. HOT:** Questions 6 and 8 try to separate these, but a sophisticated FOR theorist can argue that unattended stimuli are still represented (just not globally), and a HOT theorist can argue for unconscious higher-order states. The quiz forces a binary choice where the literature has nuance.
  *   **Illusionism vs. Dennett:** These are close cousins. Question 10 tries to split them (Illusionists say the feeling is fake; Dennett says the question is bad), but students often conflate "It's an illusion" with "It doesn't exist."
  *   **Relational Realism vs. Naive Realism:** The quiz treats these similarly. A relationalist (e.g., Campbell) might answer like a Naive Realist on Q5 but diverge on the metaphysics of *why*. The quiz doesn't probe the metaphysical grounding.

  ## 5. Confidence Assessment
  **Overall Confidence:** Moderate-High on the broad strokes (Realism vs. Dennett), Low on the fine-grained theory distinctions.

  **Least Certain Placement:** **First-Order Representationalism (FOR).**
  *   *Reason:* FOR is a chameleon position. Depending on the theorist, it can look very close to Naive Realism (if the representation is transparent) or very close to Dennett (if the representation is functional). Question 8 (The Robot) is the main differentiator, but many FOR theorists are willing to grant the robot experience if the functional organization is right, which overlaps with Illusionism or Functionalism. Distinguishing a "Representational Realist" from a "Functionalist" using only behavioral intuitions is notoriously difficult, which is partly why Dennett wrote the paper.

  **TA Tip:** When discussing the results, focus less on "Which theory did you score?" and more on "Which questions made you hesitate?" The hesitation points are where *Quining Qualia* will do its work.
