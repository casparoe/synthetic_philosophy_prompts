answer: |-
  Elizabeth Anscombe's moral framework rests on the absolute prohibition against choosing the death of the innocent as a means to an end. She distinguishes sharply between what an agent intends and what they merely foresee, insisting that the description under which an act is chosen reveals the true intention. Applying this rigorous philosophy of action to modern warfare yields specific, often uncomfortable, verdicts.

  Regarding remotely piloted strike programs with pre-approved collateral damage thresholds, Anscombe would issue a verdict of moral condemnation. Her argument would center on the collapse of the operator's self-description. If a strike proceeds only because anticipated civilian deaths fall below a specific number, those deaths are not merely foreseen side effects; they are part of the calculative conditions of the action. The deaths are accepted as a cost within the plan, making them intended under the description of achieving the military objective within acceptable limits. The distinction between intention and foresight dissolves when the foreseen harm is a precondition for the act's permission. Her framework runs out when addressing the psychological distance of remote warfare, as she focused on the logic of action rather than the phenomenology of killing from afar. Confidence rating: High. The single fact that would change this prediction is evidence that she viewed risk imposition differently from actual killing, though her writings suggest she equated the choice to risk innocent life with the choice to kill them.

  On the practice of counting military-age males as combatants by default, Anscombe would condemn this as a corruption of moral language and truth. Her argument would focus on the description under which the act is chosen. If the individuals are noncombatants, describing them as combatants to zero out the civilian tally is a lie that masks the true nature of the act. For Anscombe, one cannot change the moral reality by changing the bookkeeping; the act remains the killing of the innocent, and the false description is an attempt to evade the exceptionless prohibition. The framework holds firmly here, as it relies on truthfulness in action description, though she did not anticipate bureaucratic statistical euphemisms designed to obscure agency. Confidence rating: Very High. The prediction would change only if evidence showed she believed commanders could operate under unavoidable epistemic uncertainty rather than policy directives, but her insistence on truth makes this unlikely.

  Concerning lethal autonomous weapons systems and meaningful human control, she would likely view the lack of direct human intention as a violation of moral agency. Her argument would posit that the prohibition on murder binds human agents. If a machine selects targets, no human agent intends the specific deaths in the required sense, diffusing responsibility until it vanishes. The demand for human control is a genuine moral constraint because it ensures there is an agent who can be held responsible for the choice to kill. Without this, the act becomes a form of administrative murder where no one chooses the death under a description. Her framework runs out regarding the technical definition of control, as she wrote before automation could make decisions independently. Confidence rating: Medium-High. This prediction would change if she viewed delegated authority as sufficient for intention, provided the general policy was just, though her focus on individual acts suggests otherwise.

  Facing revisionist just war theory, Anscombe would offer a mixed verdict, agreeing on liability but worrying about authority. She would agree that liability tracks individual moral responsibility rather than uniform status, as she held that killing the innocent is always wrong. However, she might oppose the rejection of the moral equality of combatants if it undermines the concept of legitimate authority. For Anscombe, a soldier fighting under legitimate authority might be permissible even if their cause is unjust, whereas revisionists argue individual culpability matters more. Her framework runs out in reconciling individual liability with the collective nature of state warfare. Confidence rating: Medium. The prediction would change depending on whether she prioritized the innocence of the individual or the authority of the state more heavily in cases of conscription.

  On nuclear deterrence involving a conditional intention to destroy cities, Anscombe would condemn the practice as immoral. Her argument would be that a conditional intention is still an intention. To intend to kill millions if a certain condition obtains is to choose that death as a means to security. The fact that the condition may never be met does not change the fact that the agent has chosen the act under the description of retaliatory mass killing. This violates the exceptionless prohibition. Her framework applies directly here, extending her critique of Truman to the Cold War posture. Confidence rating: Very High. The prediction would change only if she accepted a distinction between threatening an act and performing it, but her philosophy suggests the intention itself is the moral locus.

  Beyond these specific cases, Anscombe would find herself agreeing with pacifists on the practical impossibility of fighting modern wars without murdering the innocent, even though she rejected pacifism as a principle. She would concede that contemporary warfare often makes legitimate action impossible, aligning with those she opposed on the reality of the situation. Conversely, she would oppose traditional Catholic just war theorists who share her confessional sympathies but employ the doctrine of double effect to justify collateral damage. She would argue they corrupt the doctrine to permit what is actually the intentional killing of the innocent, prioritizing political accommodation over moral truth.

  A careless analysis would mispredict her views in two specific ways. First, one might assume that because she was a traditional Catholic, she must accept the doctrine of double effect as military lawyers deploy it to justify collateral damage. In reality, she was highly skeptical of such applications, insisting on strict scrutiny of intention. Second, one might assume that because she was a critic of consequentialism and attacked Truman, she must be a pacifist. She explicitly rejected pacifism, maintaining that war can be legitimate and killing combatants permissible. These distinctions are crucial for understanding how her rigid framework applies to new technologies and theories without collapsing into either utilitarianism or absolute non-violence. Her legacy is not a set of rules for war, but a demand for truthfulness in describing what we choose to do.
