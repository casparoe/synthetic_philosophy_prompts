      *   *Double Effect:* She is often associated with it, but she was critical of how it was used to justify bombing. She insisted on strict scrutiny of "intention." If you blow up a building to kill people inside, you intend their death, even if you say you only intended to destroy the building.
      *   *Pacifism:* She was not a pacifist. Legitimate authority + just cause + right intention matters.
      *   *Action Theory:* Acts are described under aspects. If the act is described as "killing civilians to end the war," it's murder. If "destroying a munitions factory," civilian death might be foreseen but not intended (though she was skeptical of this in area bombing).
