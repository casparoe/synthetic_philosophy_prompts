      *   *Tone:* Empathetic, philosophical but accessible, slightly informal (3 AM argument vibe).
      *   *Key Distinction:* Post-hoc fitting vs. Pre-hoc prediction.
      *   *Dennett's Actual View:* Dennett explicitly addresses this. The "trivial" ascription isn't useful compression.
      *   *The "Word Changing Meaning":* It's "Predicts." In Step 1, it implies generative compression. In Step 4, it means "matches past data."
