      *   **Counterfactual Robustness:** This is the key concept. Real patterns support counterfactuals. Trivial ascriptions do not.
      *   **Physical Stance Parallel:** Acknowledge it applies, but show why it doesn't destroy physics (same reason: counterfactuals/unification).
