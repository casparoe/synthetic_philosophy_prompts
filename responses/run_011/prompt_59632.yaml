      *   **Roommate's Argument:** A formalized argument based on Daniel Dennett's "Intentional Stance" and compression/information theory.
      *   **Core Logic:**
          1.  Reality of patterns = Data compression (shorter description, lossless/recoverable).
          2.  Reality of beliefs = Intentional stance compresses better than physical/design stance.
          3.  Trivial Ascription: Any system can be ascribed a desire to do what it does + belief that this is how to do it.
          4.  Example: Doorstop has desire (stay open) + belief (wedge works). This predicts behavior perfectly.
          5.  Intermediate Conclusion: Doorstop has real beliefs (by 1 & 2).
          6.  Generalization: This works for *everything* (rocks, corpses, etc.).
          7.  Critique: If it applies to everything, it distinguishes nothing.
          8.  Final Conclusion: Nobody has beliefs (Eliminativism/Instrumentalism).
      *   **User's Goal:** Wants to keep (1) (compression = reality), keep the distinction between humans (have beliefs) and doorstops (don't), and find the flaw in the roommate's argument.
      *   **Specific Questions:** Which step to break? What does it cost? Does the same argument destroy the *physical* stance? Is this about levels of description in general?

  2.  **Deconstruct the Roommate's Argument:**
