answer: |-
  **PREP SHEET: COLLAPSE THESIS (MASKS = FINKS)**
  **Venue:** Small Workshop (Powers/Modality) | **Time:** 20m Q&A | **Audience:** Hostile/Mixed

  ### I. TOP OBJECTIONS (RANKED BY DAMAGE)

  **1. The "Renamed Suitability" Charge (Conditional Analysts)**
  *   **Voice:** "You've just taken Lewis's reformed analysis, stripped the second-order property of its name, called it a 'sufficiency set,' and pretended you've solved the problem. If the set is defined by what doesn't defeat the disposition, you haven't explained defeasibility; you've just labeled it."
  *   **Reply:** Lewis's suitability clause is a placeholder for *intrinsic* stability. My claim is ontological: the sufficiency set is constituted by the causal basis plus environmental conditions fixed by ascription. Lewis tries to save the conditional analysis; I'm dissolving the taxonomy to save the property. The difference isn't the label; it's that I deny the mask/fink distinction tracks *property identity*, whereas Lewis needs it to save the conditional truth conditions.
  *   **Soft Spot:** If the sufficiency set is fixed by ascription, isn't the property itself description-relative?
  *   **Follow-up:** "So on your view, does the glass lose its fragility when I describe the foam as part of the system?"
  *   **Status:** **MUST WIN.** If I lose this, I'm just doing 1997 metaphysics with new jargon.

  **2. The "Essence Fixes the Set" Pushback (Dispositional Essentialists)**
  *   **Voice:** "Friendly amendment, but you're too relativist. The sufficiency set isn't fixed by context or ascription; it's fixed by the property essence. Water solubility is essentially tied to H2O structure. If you let context determine the set, you lose the nomological necessity we need for laws."
  *   **Reply:** I agree essences fix the *core* basis, but not the *total* sufficiency set. The essence guarantees the basis exists; it doesn't guarantee the absence of masks/finks. My account explains why the same essence behaves differently in different contexts without multiplying properties. You need antidotes as distinct entities; I just need a changed sufficiency set.
  *   **Soft Spot:** If essence doesn't fix the sufficiency set, what grounds the counterfactuals?
  *   **Follow-up:** "Then what makes it a *law* rather than a contingent generalization?"
  *   **Status:** High Damage. Concede core basis is essential, hold firm on sufficiency set being context-sensitive.

  **3. The "Mechanism Matters" Complaint (Philosopher of Science)**
  *   **Voice:** "In materials science, inhibitors and decomposition are treated differently. Inhibitors bind reversibly; decomposition destroys the lattice. Collapsing them obscures the mechanism. Your ontology might match, but your account is useless for prediction."
  *   **Reply:** I concede the *pragmatic* distinction is vital for engineering. My claim is metaphysical: both are removals from the sufficiency set. One removes the basis (decomposition), one removes a background condition (inhibitor). But since the line between basis and background is descriptive, the ontological collapse holds. Keep the utility, drop the metaphysical bifurcation.
  *   **Soft Spot:** Admitting the distinction is "merely descriptive" sounds deflationary to a scientist.
  *   **Follow-up:** "So if I'm designing a catalyst, your metaphysics tells me nothing?"
  *   **Status:** **PREEMPT IN TALK.** Acknowledge utility, deny ontological weight.

  **4. The Triviality/Circularity Charge (General/Conditional)**
  *   **Voice:** "If a fink is defined by loss of disposition, and you define loss of disposition as removal from the sufficiency set, haven't you made everything a fink by stipulation? You've defined away the problem, not solved it."
  *   **Reply:** Not stipulation, but unification. The charge assumes 'fink' and 'mask' pick out distinct natural kinds. I argue they don't. It's not circular to say 'all these are instances of defeasible sufficiency' if the evidence shows no structural difference in the failure mode. The work is in showing *why* the set is defeasible, not in labeling the defeaters.
  *   **Soft Spot:** Risks sounding like I'm changing the subject.
  *   **Follow-up:** "Then what counts as *not* a fink? Is there any failure mode left?"
  *   **Status:** **PREEMPT IN TALK.** Define "defeasible sufficiency" clearly before Q&A.

  **5. The Causal Structure Objection (Causal Modeler)**
  *   **Voice:** "In structural equation models, masks are off-path blockers and finks are on-path destroyers. Collapsing them loses predictive power. You can't intervene on a 'sufficiency set' the way you intervene on a causal path."
  *   **Reply:** SEMs model dependencies, not ontology. My claim is that the *metaphysical ground* for both is the same: the absence of a jointly sufficient condition. You can model them differently for prediction, but that doesn't mean the world contains two kinds of dispositional failure. The model tracks our intervention points, not the property structure.
  *   **Soft Spot:** Dismissing formal tools as "mere models" sounds anti-scientific.
  *   **Follow-up:** "If the interventions differ, why deny the ontological distinction?"
  *   **Status:** High Difficulty. Stick to metaphysics vs. modeling distinction.

  **6. The Temporal/Structural Distinction (Conditional Analysts)**
  *   **Voice:** "Finks remove the disposition *before* the manifestation completes (often before stimulus); masks allow stimulus + basis but block output. There is a temporal asymmetry you're ignoring."
  *   **Reply:** The temporal difference is real, but it doesn't track a metaphysical distinction in the *disposition*. It tracks when the sufficiency condition is removed. Whether the basis vanishes at t1 or the output is blocked at t2, the disposition fails because the sufficiency set is incomplete. Time doesn't carve the ontology.
  *   **Soft Spot:** Temporal asymmetry often tracks causal asymmetry.
  *   **Follow-up:** "So causation is also just descriptive?"
  *   **Status:** Medium Damage. Keep focus on disposition ontology, not causation.

  **7. The Normative Gap (Essentialists/General)**
  *   **Voice:** "You say the sufficiency set is fixed by 'normality' or 'context.' Who fixes the normality? If it's us, dispositions are mind-dependent. If it's nature, you're an essentialist. Which is it?"
  *   **Reply:** It's fixed by the object's kind relative to a context of ascription. 'Fragile' means 'breaks under stress in normal conditions.' 'Normal' is fixed by the kind's typical environment, not individual minds. It's objective but context-sensitive, like 'tall.'
  *   **Soft Spot:** 'Typical environment' is vague.
  *   **Follow-up:** "Is a glass fragile in a vacuum? What's the typical environment for a glass?"
  *   **Status:** **DREADED QUESTION.** Hardest to answer without sliding into relativism or essentialism.

  **8. The Primitive Power Objection (Potentiality-First)**
  *   **Voice:** "You're still analyzing powers into conditionals/sufficiency sets. Powers are primitive. The whole fink/mask taxonomy is an artifact of your reductive program. We reject the starting point."
  *   **Reply:** I'm not analyzing powers into conditionals; I'm analyzing the *failure modes* of powers. Even if powers are primitive, they can fail. My claim is about the structure of that failure, not the reduction of the power itself. You can accept the collapse without accepting reductionism.
  *   **Soft Spot:** They may reject "failure modes" as equally reductive.
  *   **Follow-up:** "Why think primitive powers have 'sufficiency sets' at all?"
  *   **Status:** Low Likelihood (they reject the project), but High Hostility.

  ---

  ### II. STRATEGIC NOTES

  **TWO TO PREEMPT/CONCEDE IN TALK:**
  1.  **The Chemist's Mechanism Complaint:** Explicitly state: "I do not deny the scientific utility of distinguishing inhibitors from decomposition. I deny that this distinction tracks a metaphysical difference in the *disposition* itself." This disarms the Phil of Science before they stand up.
  2.  **The Triviality Charge:** Spend 2 minutes defining "defeasible sufficiency" not as "whatever prevents manifestation" but as "the set of conditions jointly required for the causal basis to produce the effect." Distinguish from simple negation.

  **THE SINGLE EXCHANGE THAT MUST GO MY WAY:**
  *   **Objection #1 (The Lewisian Ghost).** If I am just doing Lewis's reformed analysis with renamed clauses, the paper is dead. I must establish that Lewis is saving the *conditional analysis* while I am saving the *property ontology* by simplifying its failure modes.
  *   **Win Condition:** Get them to agree that Lewis's problem was saving the *truth conditions of sentences*, whereas my problem is the *individuation of properties*.

  **THE QUESTION I HOPE NOBODY ASKS:**
  *   **The Normative Gap (#7).** "Who fixes the normality ordering?"
  *   **Least Bad Answer:** "It is fixed by the explanatory interests of the ascriber relative to the object's kind. This makes disposition ascriptions context-sensitive, but the underlying causal basis is not. We are talking about the ascription, not the basis." (Risky: invites semantics objection, but saves the metaphysics).

  ---

  ### III. WHITEBOARD CASES (REALISTIC CHALLENGES)

  **1. The Foam-Wrapped Glass vs. The Liquid-Glass**
  *   **Case:** Glass wrapped in foam (Mask) vs. Glass turned to liquid by wizard just before strike (Fink).
  *   **Damage Assessment:** **Absorbable.**
  *   **Cost:** Must insist that 'wrapped in foam' removes a sufficiency condition (absence of padding) just as 'turned to liquid' removes a sufficiency condition (solidity).
  *   **Risk:** Audience will intuitively feel the liquid glass *lacks* the property, while the wrapped glass *has* it. I must argue this intuition is about *basis presence*, not disposition identity. If the basis (molecular structure) is intact in the foam case, the disposition is intact, but the sufficiency set is not met. In the liquid case, the basis is gone. Wait—my thesis says masks *are* finks. I must argue the foam *neutralizes* the basis's efficacy, effectively removing it from the sufficiency set just as the wizard does.
  *   **Line to hold:** "In both cases, the causal power to break is not manifest because a necessary condition is absent. In one, it's the lattice structure; in the other, it's the exposure to impact. Both are conditions in the sufficiency set."

  **2. Enzyme Inhibitor vs. Protein Denaturation**
  *   **Case:** Competitive inhibitor binds active site (Mask) vs. Heat unfolds protein (Fink).
  *   **Damage Assessment:** **Genuine Damage.**
  *   **Cost:** This is the Chemist's wedge. The inhibitor leaves the basis (protein structure) intact; denaturation destroys it.
  *   **Absorption Strategy:** Argue that the "basis" of the enzymatic disposition is not just the protein shape, but the *available* active site. An occupied site is a neutralized basis. Therefore, the inhibitor *does* remove the basis (availability), making it a fink.
  *   **Risk:** Biologists distinguish "inactive" vs "destroyed." If I collapse them, I look ignorant of the science.
  *   **Line to hold:** "Functionally, both result in 'no catalysis.' Metaphysically, both remove a necessary condition for the effect. The reversibility is a difference in the *history* of the basis, not the *structure* of the disposition's failure."

  **3. The Safety Switch vs. The Removed Firing Pin**
  *   **Case:** Gun with safety latch on (Mask) vs. Gun with firing pin removed (Fink).
  *   **Damage Assessment:** **Absorbable.**
  *   **Cost:** Safety latch is external/removable; firing pin is internal/constituent.
  *   **Absorption Strategy:** The "basis" of the gun's fragility/firing disposition includes the mechanical linkage. The safety latch interrupts the linkage. Thus, the linkage is incomplete. The firing pin removal also makes the linkage incomplete. Both are failures of the mechanical sufficiency set.
  *   **Risk:** Intuition that the gun is "still a gun" with the safety on, but "broken" without the pin.
  *   **Line to hold:** "The disposition to fire requires a complete causal chain. Both cases render the chain incomplete. One does it by blocking flow (mask), one by removing a component (fink). But the result—insufficient conditions for manifestation—is identical."
