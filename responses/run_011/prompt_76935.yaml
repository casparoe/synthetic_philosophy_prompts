answer: |-
  **Carving Moral Theory: The Individuation Problem in Uncertain Decision-Making**

  **Project Overview and Core Question**
  When agents are uncertain about which moral theory is true, the leading proposal for decision-making is expected choice-worthiness maximisation. Roughly, you weight each theory's verdict by your confidence in it and choose the option with the highest score. This framework assumes we can confidently assign credences to moral theories. But this requires a prior step: we must know what counts as a distinct theory to assign credence to.

  This project addresses the **Individuation Problem**. Before we can compare theories, we must count them. Is Utilitarianism one theory, or two (Total and Average)? Is Ross-style deontology a single theory or a family of distinct duties? If the ranking of options flips depending on how we carve up theory-space, the decision rule is unstable. My core question is: **Does the arbitrariness of moral theory individuation undermine expected choice-worthiness maximisation as a viable decision rule, or can the rule be repaired by demanding invariance across carvings?**

  **Distinction from the Comparison Problem**
  Committee members may be familiar with the "comparison problem" in moral uncertainty: how to scale Utilitarian units against Kantian duties. That is a problem of *measurement*. The Individuation Problem is a problem of *identity*. Even if we could perfectly translate Utilitarian units into Kantian units, we still face the question of whether to treat "Total Utilitarianism" and "Average Utilitarianism" as separate entries in our calculation or as variations of a single entry.

  In empirical science, evidence constrains how we individuate hypotheses. In morality, there is no external data to tell us where one theory ends and another begins. If splitting one theory into two sub-theories shifts the decision outcome simply by altering the count, the decision rule is vulnerable to manipulation via description. This is not the old comparison problem wearing a new hat; it is a structural vulnerability in the probabilistic framework itself.

  **Methodology and Work Plan**
  The project runs over three terms, moving from formalization to solution testing.

  *Term 1: Formalizing the Partition Dependence.*
  I will construct a formal model showing how expected choice-worthiness values shift under different partitions of theory-space. The goal is to prove that standard normalization methods (used to solve the comparison problem) are sensitive to individuation. I will evaluate the analogy to choosing a candidate hypothesis set in Bayesianism. Initially, this seems helpful: Bayesianism also requires partitioning possibility space. However, I argue this is a **trap**. In empirical Bayesianism, the world constrains the partition (e.g., a switch is either on or off). In moral uncertainty, the "world" does not dictate whether Prioritarianism is a distinct theory from Utilitarianism or a parameter within it. Relying on the Bayesian analogy obscures the lack of external constraint. Similarly, I will examine Carnap-style inductive methods, which famously turned out to be language-dependent. This is a stronger analogy: moral individuation is language-dependent. However, where Carnap sought a logical fix, I will investigate structural fixes.

  *Term 2: The Toy Case and Invariance Conditions.*
  I will develop worked cases to demonstrate the flip. Consider a choice between Option A (Save 10 lives) and Option B (Save 9 lives + Keep a Promise).
  *   **Partition 1:** Two theories. Utilitarianism (50% credence) prefers A (Value 10 vs 9). Deontology (50% credence) prefers B (Value 10 vs 11). Expected Value: A = 10, B = 10. Indifferent.
  *   **Partition 2:** Three theories. Total Utilitarianism (33%), Average Utilitarianism (33%), Deontology (33%). Both Utilitarianisms prefer A. Deontology prefers B. Expected Value: A = 10, B = 9.66. Option A wins.
  By merely splitting the Utilitarian camp, the decision flips from indifference to a clear mandate. This is accessible without technical jargon: the weight of the Deontological objection is diluted by splitting the opposing camp.
  Following this, I will test repair strategies. The most promising is an **Invariance Criterion**: a decision is only justified if it holds across all principled partitions.

  *Term 3: Defining Principled Partitions and Final Synthesis.*
  The hardest task is defining a "principled partition" to avoid infinite regress. I will argue for a structural definition based on *disagreement profiles*: theories are distinct only if they rank options differently in possible worlds. I will draft the final manuscript, arguing either for a repaired decision rule or an impossibility proof.

  **Outcomes and Success Conditions**
  A **positive result** looks like a modified decision rule: "Maximize expected choice-worthiness subject to partition invariance." This would tell agents to discount verdicts that rely on arbitrary theory-splitting.
  A **negative result** looks like an impossibility proof: demonstrating that no decision rule can satisfy basic consistency requirements across partitions. This is still a significant contribution, as it would force the literature to abandon expected choice-worthiness for something else (e.g., stochastic dominance).
  **Failure** would consist of getting bogged down in the metaphysics of moral theories. If I spend the year debating whether Utilitarianism is *really* one theory, I have not done decision theory; I have done metaphysics. To avoid this, I will treat theories as formal objects defined by their input-output functions, not their historical labels.

  **Scope and Feasibility**
  To ensure completion within twelve months, I must strictly limit the scope. I will not solve the comparison problem (scaling units); I will assume existing normalization methods work *within* a fixed partition. I will not offer a full metaphysics of moral theories. The project is not about what moral theories *are*, but how their *individuation* affects decision rules. I will also restrict the toy cases to non-consequentialist vs. consequentialist splits, rather than exploring every niche theory. This keeps the mathematical modeling tractable. The goal is not to map all of moral theory, but to stress-test the decision rule used by those who think they don't need to.

  This project addresses a foundational vulnerability in moral uncertainty. If the decision rule flips based on how we count theories, it cannot guide action. By the end of the year, I will have determined whether this vulnerability is fatal or fixable.
