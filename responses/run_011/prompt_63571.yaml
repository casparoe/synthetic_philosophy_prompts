      *   **User's Goal:** Write a response paper arguing for "Tier 3" technological determinism (foreclosure of decision domains) using a specific case study (adaptive traffic signal system).
      *   **User's Framework:**
          *   Tier 1: Artifact preserves designer intentions (weak, vulnerable to SCOT/constructionist critique).
          *   Tier 2: Artifact has political effects from structure, surviving designers (endurance).
