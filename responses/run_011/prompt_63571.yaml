answer: |-
  Your seminar summary correctly dissolves the crudest version of technological determinism. If by "politics of artifacts" we mean only that designers embed their intentions into steel and code (Tier 1), then you are right: this is not determinism, but history. To treat a clearance standard as a technological force rather than a bureaucratic decision is to mystify the social relations that produced it. Your account successfully demonstrates that what looks like technological necessity is often the sediment of past social negotiations. However, this critique loses its traction when we shift from the origin of the artifact to the horizon of future action. I argue that a robust form of determinism survives at Tier 3. This is not the claim that technology dictates specific outcomes regardless of human will, but that technical arrangements can progressively foreclose domains of collective decision, rendering certain political values unimplementable regardless of who holds power. The adaptive signal system case demonstrates that while the system's origin is social, its operation is determinative in a way that the "sediment" metaphor cannot capture.

  To steelman your position: you argue that every constraint imposed by the signal system can be traced back to a contingent human choice. The objective function minimizing delay was chosen by procurement officers. The induction loops were specified by engineers. The vendor contract was signed by administrators. Therefore, the resulting exclusion of cyclists and the erosion of bus priority are not the technology acting; they are the delayed echoes of those initial choices. The "stubbornness" I observe is merely the inertia of social institutions (contracts, budgets) wearing a technical costume. To call this technological determinism is to confuse the structure with the sediment. On this view, if the 2019 administration cannot implement accessibility plans, it is because they lack the political will to break the contract or rewrite the code, not because the code itself holds power. The technology is a record of politics already over.

  This explanation holds for Tier 1 and largely for Tier 2, but it fails to account for Tier 3 foreclosure. The crucial distinction lies in the ontological shift the system enforces. The 2013 procurement did not just choose a policy; it chose a metric that redefined what counts as a legitimate object of governance. By specifying "delay per vehicle-kilometer" and deploying loops that cannot detect masses under a tonne, the system instantiated an ontology where bicycles and pedestrians effectively do not exist as traffic. This is not merely a record of a choice; it is an active conditioning of the political environment. When the 2019 administration adopted climate and accessibility plans, they were not battling the intentions of the 2013 designers (who are gone); they were battling a material reality that no longer registered their values as data. The system does not just resist change; it makes the *content* of the new change impossible to articulate within its logic. You can vote for accessibility, but you cannot measure it on a network that only sees delay. This is not path dependence, which suggests that switching paths is costly. This is foreclosure, where the map itself has been redrawn such that the destination no longer appears.

  Consider your first likely rejoinder: that the objective function was chosen by people, so the outcome is politics by other means. This is true of the origin, but false of the operation. The choice was abstract ("minimize delay"); the political effect (bus ridership collapse) was emergent from the technical implementation (loop sensitivity, bus-to-car equivalence). The designers did not necessarily intend to deprioritize transit; they intended to optimize flow. The technology translated that abstract intent into a specific distributional outcome that was not explicitly politicized at the time of choice. The determinism lies in this translation layer. Once the system is learning and optimizing, it enforces the logic of the objective function against any subsequent logic that cannot be expressed in its terms. The 2019 plans failed not because anyone voted against them, but because the system could not compute them.

  Second, you will argue that the real explanation is budget scarcity and vendor capture, which are social facts. It is true that the maintenance contract creates inertia. But contracts alone do not dictate traffic flow; technical specifications do. The vendor capture locks in the *induction loops*, not just the service provider. A social contract could be broken with sufficient political will; a technical constraint requires physical replacement. The system creates a specific kind of friction: the cost of change is not just financial but epistemic. To change the policy, the authority must revalidate every intersection against original specifications. This is a technical barrier that masquerades as a bureaucratic one. The "social fact" of the contract is potent only because it protects the "technical fact" of the loops' blindness. If the constraint were purely social, a new council could mandate accessibility tomorrow. Because the constraint is technical, they must first rebuild the sensory apparatus of the city. The technology mediates the social power, filtering what kinds of social power can be effective.

  Third, you may claim this argument is trivial because everything durable is constraining. A law also constrains future actors. But laws are textual and interpretable; they can be reinterpreted to fit new values without physical reconstruction. A technical system is material and operational; it does not interpret, it executes. The triviality charge misses the specificity of technical foreclosure. Not all constraints narrow the *domain of decision* itself. A speed limit constrains behavior but leaves the decision to set limits open. The signal system constrains the ability to set limits because it removes the variables necessary to formulate them. If you cannot measure equity, you cannot legislate it. This is not general durability; it is specific obsolescence of political language.

  Therefore, the endurance condition (Tier 2) plus the foreclosure condition (Tier 3) license describing the network as doing something political. It is not merely a residue because it actively filters political input. It accepts inputs in the format of "delay" and rejects inputs in the format of "access." It governs the corridor by making certain forms of life invisible to the state. This is not mystery; it is a specific mode of agency delegated to non-human actors. The system acts politically because it sustains a distribution of benefits and burdens independently of the current distribution of political will.

  I must mark the single load-bearing premise of this argument: the claim that redefining the objective function is technically prohibitive due to revalidation requirements, rather than politically inconvenient. My case rests on the assertion that the authority *cannot* easily rewrite the code to value equity because the technical infrastructure (loops, validation protocols) does not support it. If it turned out that the system could be reprogrammed overnight to prioritize buses, but the authority chooses not to because they prefer cars, then my argument collapses. In that scenario, the constraint is purely Tier 1 (current intentions), and the technology is indeed just a passive tool. The specific piece of evidence that would change my mind is documentation showing that the vendor contract allows for objective function updates without full revalidation, and that the authority has declined to use this mechanism despite having the budget. If the barrier is purely willingness, then you are right: it is politics all the way down. But if the barrier is that the loops physically cannot detect the variables required for equity, then the technology has successfully foreclosed the political horizon, and determinism at Tier 3 stands.
