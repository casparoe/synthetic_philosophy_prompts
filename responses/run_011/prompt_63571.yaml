      *   **Case Study:** Adaptive signal-control system (2013). Objective: minimize average delay. Flaws: ignores non-motorized/small vehicles, counts bus as one car. Result: favors arterials, hurts bus ridership, shifts commercial permits, undermines later climate/accessibility plans (2019). Hard to change due to contract, metric reliance, revalidation costs.
      *   **Requirements:**
          *   Steelman the critique (interlocutor's view) first.
          *   Show where critique fails (Tier 3 vs. Tier 1/2).
          *   Argue why Endurance + Foreclosure = Technology *doing* something political (not just residue).
          *   Anticipate 3 rejoinders: (1) Objective function was chosen by people; (2) It's budget/vendor capture (social facts); (3) Argument is trivial (everything durable constrains).
          *   Do not retreat to Tier 1.
          *   Do not redefine determinism into mere path dependence (must be distinct).
          *   Identify the single load-bearing premise (weakest link) and the evidence that would change the mind.
          *   Prose style: Rigorous, argumentative, ~1300 words.
          *   No headers unless necessary (keep flow).

  2.  **Deconstruct the Interlocutor's Position (Steelman):**
      *   Core claim: Technology is frozen politics.
      *   Mechanism: Trace every constraint back to a contingent human choice.
      *   Conclusion: Calling it "technological politics" adds mystery; it's just social history.
      *   Concession: Unintended effects exist, but don't describe them as technology *acting*.
      *   Strength: It successfully dismantles Tier 1 (intentionality). It emphasizes agency and contingency.

  3.  **Develop the Tier 3 Argument:**
      *   The case shows that later actors (2019 administrations) have different values (climate, accessibility) but cannot implement them because the system constrains the *possibility space*.
      *   It's not just that the machine is hard to change (Tier 2 endurance); it's that the *political agenda itself* is reshaped. The 2019 plans "quietly missed their targets" because the reality on the ground was dictated by the 2013 code.
      *   The "politics" isn't just the initial choice (Tier 1); it's the ongoing governance by the algorithm.
