          *   (2) Social Facts: Contracts are social, but they lock in *technical* specificities (loops) that exert force independent of current social will.
          *   (3) Triviality: Distinguish general constraint from specific political foreclosure.
      *   **Load-Bearing Premise:** The technical cost of change vs. political will.
      *   **Conclusion:** Reiterate that determinism here means the narrowing of the political horizon.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I retreat to Tier 1? Ensure I don't say the designers *meant* to hurt buses. Emphasize the *ontology* embedded in the loops.
      *   *Check:* Is it distinct from path dependence? Path dependence says "it's hard to switch." Tier 3 says "the switch is technically precluded such that policy goals become impossible." The *policy* is what's determined, not just the path.
      *   *Check:* Word count. Need to be concise but rigorous. ~1300 words.
      *   *Check:* Tone. Academic, respectful but firm.

  8.  **Drafting the Content:**
      *   *Opening:* Set the stage. The dissolution of Tier 1 is correct. But Tier 3 remains.
      *   *Steelman:* The interlocutor says technology is frozen social negotiation. To call it "technological politics" is to mystify social history.
