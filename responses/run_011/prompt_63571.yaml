      *   *Rejoinder 3 (Triviality):* Not everything durable constrains *political decision domains*. A wall constrains movement. A traffic system constrains *policy implementation*. The specificity of the foreclosure matters.

  5.  **Identify Load-Bearing Premise:**
      *   Premise: That the inability to redefine the objective function is due to *technical/structural* inertia (revalidation costs, metric reliance) rather than purely *political* cowardice.
      *   Evidence to change mind: If the authority could easily rewrite the code but chooses not to because they prefer cars, then it's just politics (Tier 1), not Tier 3 determinism.

  6.  **Drafting - Section by Section (Mental Outline):**
