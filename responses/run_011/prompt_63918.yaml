      *   *Engineering Analogy:*
          *   Latency $T \sim U(1, 2)$. $P(T < 1.5) = 0.5$.
          *   Rate $R \sim U(0.5, 1)$. $T = 1/R$. $P(1/R < 1.5) = P(R > 2/3) = (1 - 2/3) / (1 - 0.5) = (1/3)/(1/2) = 2/3$.
          *   This is solid.

      *   *Deflation:*
          *   "The Jira Ticket" approach.

      *   *Limits:*
          *   Simulation shows inconsistency, not truth.
          *   Indifference is an assumption, not a law.

      *   *Materials:*
          *   Projector slides.
          *   Printed cards.
          *   Python harness.

      *   *Timing:*
          *   Strict 90 mins.

      *   *Bugs:*
