answer: |-
  The committee recommends rejecting the proposal to replace the quality-adjusted life-year with the life-satisfaction measure for this allocation cycle.

  We accept the technical objection that self-reported satisfaction scores are ordinal rankings rather than cardinal measures, meaning that a one-point difference for one person cannot be mathematically equated to a one-point difference for another without unverified assumptions. For a fixed budget allocation requiring precise cost-per-unit calculations, relying on inter-personal arithmetic that lacks psychometric validation introduces a risk of spurious precision that undermines the fairness and defensibility of the process.

  Regarding adaptation, we acknowledge that when patients report high satisfaction despite severe impairment, this reflects a genuine improvement in their lived experience and not merely a measurement artifact. However, using these reports as the primary basis for allocation creates a systematic inequity: it disadvantages programmes serving those with severe, stable disabilities (like Programme A) in favor of those serving people with milder, acute distress (like Programme B). Our mandate requires us to prioritize need based on the magnitude of health loss, not on the varying capacities of different groups to adapt to deprivation.

  We recognize that the incumbent quality-adjusted life-year measure is also compromised, specifically by relying on public valuations of health states they have not experienced. This disconnects the measure from lived reality and risks imposing external judgments on patients. However, because the incumbent measure weights benefits by clinical severity rather than psychological adaptation, it aligns more closely with our statutory obligation to distribute resources according to the objective severity of health conditions. Both measures are imperfect, but the incumbent's defects are less likely to distort equity between severe and mild conditions.

  Consequently, for this round, Programmes A and B will be assessed using the incumbent quality-adjusted life-year framework. Under this framework, Programme A's intervention for severe impairment will attract higher weighting per year of life gained than Programme B's intervention for milder limitation, regardless of the divergence in self-reported satisfaction scores.

  We state explicitly that retaining the incumbent measure involves a value choice: we are prioritizing the reduction of severe functional loss over the maximization of reported subjective wellbeing. This is a normative decision about the purpose of public health funding, not a technical determination of which metric is scientifically superior.

  The strongest consideration on the side we do not recommend is the principle of epistemic justice: that people living with health conditions are the only legitimate authorities on the value of their own lives, and that continuing to rely on hypothetical public valuations disrespects their agency and experience. We reject the proposal not because this moral claim is wrong, but because the methodological risks to equitable allocation are currently too high to act on it.
