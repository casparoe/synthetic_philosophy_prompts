  1. Holding
  The Panel holds that both votes taken at the special general meeting are void and of no effect. Section 14.3 governed the procedure at the time notice was given, requiring unanimous consent for any amendment to Section 14. Because the motion to amend §14.2 failed to achieve unanimity, the subsequent deletion of §14.3 lacked valid authority and cannot stand.

  2. The Question Presented
  We must decide whether the amendment to §14.2 and the deletion of §14.3 are valid Charter changes. This turns on whether §14.3 binds the voting procedure based on the rules existing when notice was issued, or whether a supermajority vote can override the entrenchment clause simultaneously. We must determine if the two votes stand or fall together, and whether the Panel has authority to invalidate a motion declared adopted by the Chair. The core issue is whether §14.3 operates as a procedural lock that prevents a majority from altering the amendment rule itself without meeting the prior strict standard. If the first vote fails, the second vote necessarily fails, as it relied on the new standard.

  3. Two Readings of Section 14
  The strict-procedural reading argues that §14.3 is unambiguous and controls the outcome. It states no amendment takes effect unless adopted under the procedure in force when notice was given. When notice was given, §14.2 required unanimity. Therefore, any vote short of unanimity is invalid, regardless of the outcome. This reading treats §14.3 as a shield protecting the entrenchment from being dismantled by the very process it restricts. It implies Section 14 is permanently fixed unless every single member agrees, preserving the minority's veto against procedural changes. The textual hook is the phrase "in force at the time notice... was given," which locks the requirement to the old rule. Proponents argue that without this lock, §14.3 would be meaningless, as any majority could simply vote to change the voting rule first. This preserves the integrity of the entrenchment.

  The self-embracing reading argues that the members possess an inherent sovereign power to alter their governance, which §14.1 recognizes but does not confer. Advocates contend §14.2 was drafted for a smaller association and now functions as a deadlock clause, trapping the body in rules it cannot change. They argue §14.3, if read strictly, makes the 2019 vote the last possible amendment, creating an absurd result where the Charter becomes immutable. This reading implies Section 14 is dynamic, allowing a sufficiently large majority to update the rules of change to reflect current realities. The textual hook is the silence of §14.1 on limits to sovereignty, suggesting the Charter presupposes the members' power to alter their own ground rules despite procedural hurdles. They claim the text must be read to avoid absurdity, even if it requires bending the procedural lock. This preserves the viability of the association.

  4. What Turns on the Choice
  If we adopt the strict reading, the association remains bound by the unanimity requirement. With eleven members in arrears, one deceased, and two abstaining, unanimity is mathematically impossible under current conditions. This deadlock prevents the adoption of a postal referendum, denying members a modern voting method they desire and perpetuating governance inefficiencies. However, it secures all minority protections entrenched in the Charter; no provision can be altered without every active member's consent. This ensures that small firms and individual practitioners cannot be overridden by larger blocs on fundamental issues. If we adopt the self-embracing reading, the association gains flexibility to modernize its procedures and bypass unreachable members. Yet, this security comes at a cost: if 94 percent can rewrite the amendment rule, no provision is truly entrenched. Any minority protection could theoretically be removed by a determined supermajority, rendering §14.2 idle from the start. The choice determines whether the Charter is a stable covenant protecting the weak or a mutable contract subject to shifting majorities. Over the next decade, this choice dictates whether the association can adapt to growth or remains frozen in its 2019 structure.

  5. The Strongest Objection
  The strongest objection to this holding is that it reduces the Charter to a trap. A rule that binds the sovereign body without providing a mechanism for release is not law but paralysis. The respondents argue that §14.3 cannot intend to freeze the 2019 procedure forever, as no drafter intends impossibility. By invalidating the vote, the Panel privileges textual formalism over the clear will of 94 percent of voting members. Furthermore, this holding leaves the Panel unable to specify when such a vote would ever be valid. If unanimity is impossible, the holding effectively declares Section 14 immutable by any means, forcing members to dissolve the association rather than amend it. This absurdity suggests the text must yield to the inherent power of the membership to govern itself. Critics will argue the Panel is enforcing a dead hand control that contradicts the association's democratic nature. They will ask how a Governance Panel can justify overriding the expressed will of the meeting based on a clause designed to prevent exactly this kind of procedural maneuvering, when that maneuvering is the only path to functionality.

  6. Disposition and Timetable
  The Panel orders that both motions be declared null and void. The Charter reverts to its state prior to the special general meeting, with §14.2 requiring unanimity and §14.3 remaining in force. The second vote to delete §14.3 falls because it relied on the invalid amendment to §14.2. Members may rely on the pre-meeting text for all future notices. The Panel will convene a forum next month to discuss drafting a new amendment article. Our decisions stand unless reversed by two-thirds of members voting at a general meeting called for that purpose. We will circulate the draft replacement language by Friday to allow review before the forum. The Chair is directed to update the register to reflect this decision before Wednesday's vote.

  7. Drafting Note
  Future meetings should consider replacing Section 14 with a tiered system. General provisions amend by two-thirds vote; amendment procedures amend by 90 percent of all registered members, not just those voting. This ensures broad consensus while avoiding the impossibility of unanimity among unreachable members. The new language gives up absolute minority veto power in exchange for procedural feasibility. It prevents deadlock while maintaining high thresholds for changing the rules of change. Specifically, it should define "members" to exclude those in arrears for more than five years, solving the unreachable member problem without lowering the threshold for active participants. This balances the need for stability with the practical necessity of allowing the association to evolve.
