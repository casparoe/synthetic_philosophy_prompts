prompt: |-
  I build static analyzers for a living — the kind where you ship a warning that's occasionally annoying but never wrong, and where "sound" is the only adjective in the design doc anybody takes seriously. Never took a logic course, though I wrote a tiny proof checker for fun and I use Gödel's second theorem as a get-out-of-jail card when a customer asks why our tool cant verify the verifier. So I've read around the Lucas–Penrose line — the one where you're supposed to show a human mathematician can see the truth of a Gödel sentence for whatever machine models them, plus Penrose's later detour into objective reduction in microtubules — but I've read it mostly through CS-flavored summaries, and I suspect those summaries are flattering my priors.

  Here's what I want. Restate that argument premise by premise in my vocabulary: rule sets and abstract domains, soundness relative to a chosen semantics, termination, the halting problem as a diagnostic rather than a metaphysical horror, Rice's theorem, proof-carrying code and certificates, why a checker can't hand you a certificate for its own checker. Be faithful — if a premise has no honest counterpart, say so instead of grabbing the nearest analogy and dressing it up.

  Then give me the residue report, which is the part I actually care about. Tag every premise: translates cleanly / translates only if you bend something (say exactly what you bent) / no counterpart at all.

  A few things I want you to run down specifically:

  - My hunch is that the whole argument is just "a sound analyzer can't certify its own soundness," and that the real question is who does the certifying and on what evidence. Is that hunch right, or does it flatten a step that was actually doing work?
  - In my world soundness is never absolute — it's always sound with respect to some memory model, some language subset, some abstraction. The argument seems to want an absolute "the human is sound." Does it need that? And if it only needs soundness-relative-to-a-semantics, does that help it or hurt it?
  - The diagonalization step seems to need the human to be one finitely specifiable thing with an enumerable rule set — a single binary you can write a sentence for. Stuff in my shop isn't like that anymore: learned components, retrained nightly, a service rather than an artifact. Does the argument have any target left when the object being diagonalized against is that kind of thing, or does it relocate somewhere I haven't thought about?
  - Drop the soundness assumption and just admit we're inconsistent sometimes — does the argument die, or does a weaker cousin survive that I should be taking seriously?
  - There's the standard reply that the argument needs the human to know which machine they are and to know that it's sound. Put that reply in my vocabulary too and tell me whether it's a knockdown or just burden-shifting with better PR.

  Two ground rules. First, don't smuggle my framework's assumptions in and bill them as translation — every place "soundness" or "certificate" is carrying philosophical weight that the philosophers didn't put there, flag it. Second, end with a verdict: is the residue telling me my vocabulary is missing something real (no way to talk about truth as opposed to provability without an oracle or a semantics handed in from outside), or is it telling me the original argument was fuzzier than it looked and the fuzz is where the work was getting done? If it's seperate answers for seperate premises, give me the breakdown.
