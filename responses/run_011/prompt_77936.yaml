answer: |-
  *   **Candidate Verdicts:** Parfit and Schelling are orthogonal discoveries that rhyme; Parfit solves Newcomb-like problems via disposition, Schelling solves commitment problems via constraint.
  *   **Friend's Gloss:** Too tidy. Schelling restricts the action set; Parfit restricts the decision procedure, not the utility function (you still want the money).
  *   **Tollhouse Resolution:** No single policy satisfies both perfectly. Trustworthiness implies capacity to betray; incapacity implies instability. You must choose your adversary.
  *   **Two-Level Structure:** Parfit admits ex-post irrationality; Schelling eliminates ex-post choice to hide it.
  *   **Asymmetry:** Parfit makes you a partner (better); Schelling makes you a weapon (harder to live with). This is functional, not decorative.
  *   **Political Economy:** Straight homonym. That version is about information costs, not strategic commitment.

  ***

  The Tollhouse scenario you've constructed is a nasty piece of work, precisely because it forces Parfit and Schelling into a corner where their usual handshake breaks down. Your friend's PhD gloss—that Schelling changes what you *can* do while Parfit changes what you *want* to do—is a useful heuristic, but it doesn't survive contact with the terrain. Parfit does not argue you should change your utility function; you still prefer having money to not having it. He argues you should adopt a different *decision procedure*. You maximize utility not by asking "what pays now?" but by asking "what kind of agent maximizes utility over time?" Schelling, conversely, really does hack the game tree. He removes branches. In the Tollhouse, the Developer wants branches removed (scrap the plows); the Roadmaster wants to read the agent running the tree (keep the rate).

  This reveals the friction. To satisfy the Developer (Schelling), you must visibly destroy your capacity to raise rates. But to satisfy the Roadmaster (Parfit), you must appear to be a person who *chooses* to keep rates despite having the capacity to raise them. If you scrap the plows, you look like a fanatic to the Roadmaster. A fanatic is unpredictable; he might scrap the plows and then close the road out of spite. The Roadmaster wants a partner who *could* betray him but *won't*. The Developer wants an opponent who *couldn* betray him even if he *wanted* to. There is no single policy that perfectly satisfies both. You must decide which audience holds the gun. If the Council's convoy is the immediate threat, you must cultivate Parfitian character and risk the Developer entering later. If the Developer's entry is the existential threat, you must Schelling-bind yourself and risk the Council interpreting your bindings as instability.

  Let's run the comparison along the axes you requested. First, detection accuracy. Parfit relies on the other party's ability to read dispositions—the Driver's face-reading, the Roadmaster's uncanny sense. This is fragile; it depends on human psychology and transparency. Schelling relies on verifying constraints—checking the lease, counting the plows. This is robust but costly. Second, observability. In Parfit's world, the mechanism is internal; only the resulting behavior is observable, which creates the temptation to defect once the benefit is secured. In Schelling's world, the mechanism itself (the burned bridge) is the signal. Third, interaction structure. Parfit's Hitchhiker is often framed as a one-shot where reputation carries over implicitly; Schelling's commitments work in one-shots but thrive in repeated games where reputation for binding yourself accumulates. Finally, duration. Parfitian disposition is meant to be character—permanent. Schellingian commitment is often tactical—you burn the bridge to win the negotiation, then hope you don't need to cross it again. In the Tollhouse, this matters: a permanent disposition scares the Developer less than a permanent constraint.

  This leads to the core philosophical divergence: the two-level structure. Does Schelling concede that it is rational to be someone who does X even though doing X isn't rational? Not exactly. Schelling's genius is that he makes doing X the *only* rational move ex-post by removing the alternatives. He doesn't ask you to be irrational; he asks you to make irrationality automatic. Parfit is more honest about the tension. He admits that once you are in town, paying is a pure loss. It is act-irrational. But it is disposition-rational. Schelling hides the ex-post irrationality by claiming there is no ex-post choice. Parfit stares it down and says you must choose against your immediate interest to validate your prior rationality.

  So, here is the bottom line. Parfit's rational irrationality is not a special case of Schellingian commitment, nor a rival. It is an orthogonal discovery that happens to rhyme. Schelling is playing chess with the board itself; Parfit is playing chess with the player's mind. Schelling modifies the game; Parfit modifies the theory of the player. This is where the asymmetry you noted becomes functional, not decorative. Parfit's payer comes out better off and *better* because his strategy relies on social cohesion and trustworthiness—he is a viable long-term partner. Schelling's bargainer comes out better off but *harder to live with* because his strategy relies on threat and incapacitation—he is a viable weapon, but a dangerous ally. In the Tollhouse, if you choose Schelling, you survive the Developer but may find the Council treats you as a volatile asset to be replaced. If you choose Parfit, you keep the Council but may invite competition you cannot fight.

  The asymmetry tells you which tool to pick. Use Parfit when you need cooperation and repeated interaction where detection of character is possible. Use Schelling when you face a hostile actor who only respects force and where you can verify constraints. In your column, this distinction is the weapon: predictability as a weapon comes in two calibers. One is the reliability of a partner; the other is the inevitability of a machine.

  One aside on your political economy point: that third sense of "rational irrationality"—where voters hold sloppy beliefs because the cost of being wrong is zero—is a straight homonym. It shares the syntax but not the grammar. The voter isn't committing to a strategy to influence others; he is simply optimizing his information budget. It lacks the strategic interdependence that binds Parfit and Schelling together. It is solitary, whereas your Tollhouse is deeply, dangerously social.
