          5.  Specific Requests ((2)+(3), (6)+(8)).
          6.  Meta-Cognition (What changes my mind, where I might fail).
      *   *Tone Check:* Keep it sharp. No "You should consider..." Just "This breaks here."
      *   *Specific Focus:* Ensure the (2)+(3) normativity gap is highlighted. Ensure the Plasmid (8) threat to Teleosemantics (6) is clear.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Wait, Bigelow & Pargetter *do* claim to solve normativity via propensities. I need to be precise why the user's version fails. It fails because without *actual* past selection, the "norm" is just "what usually happens." If a mutation arises that *will* be selected but hasn't been yet, does it have a function? Bigelow says yes. But does it have a *normative* function? If it fails, is it broken?
      *   *Refinement on Plasmid:* The user says "I won't smuggle in designer intentions." This is the trap. If the sorter is the environment, the function *is* to be sorted. To deny this without intention, you need to distinguish *natural* environments from *artificial* ones without using "artifice." That's hard. Maybe distinguish "reproductive system" vs "external filter."
      *   *Refinement on Teleosemantics:* If (6) falls, teleosemantics falls. This is the highest stakes item.

  8.  **Final Polish:** Check against the "no lecture" rule. Ensure the "cheapest revision" is actually cheap. Ensure I answer "what would change your mind."

      *(Self-Correction on "Cheapest Revision"):* The cheapest revision for (2) is to limit it to *traits with a history*. The cost is you can't handle novel traits easily.
      The cheapest revision for (8) is to accept the function is "to be sorted" but deny it's a *biological* function (it's an *experimental* function). But user wants biological function. Okay, revision: The "Containing System" (5) must be the *organism's* reproductive system, not the lab's.

      *Wait, one more thing:* The user says (5) Function is triadic (relative to containing system). If the containing system is the *lab ecosystem*, the plasmid has a function. If the containing system is the *bacterium*, it might not (it's a burden). This is the key to solving (8) without intention.

