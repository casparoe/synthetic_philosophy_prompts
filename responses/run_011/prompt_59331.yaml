  Welcome to independence. You have the borders, the flag, and the seat at the United Nations. You do not, however, have a past. This is a common logistical oversight. Meridian Heritage Solutions has been furnishing national continuities since 1948. We understand that while liberation is spontaneous, legitimacy requires schedule and repetition. Below are our standard procurement packages, tailored for Vespera's specific geopolitical demographic. We recommend ordering immediately; traditions require at least two generations to settle, so we must begin the simulation now.

  TIER 1: THE FOLK ENSEMBLE (ENTRY)
  Ideal for tourism boards and primary school assemblies. This package includes four distinct regional costumes. Our designers ensure the variations look organic—different stitching in the north, heavier wool in the mountains—while maintaining a standardized silhouette that photographs well as a unified national style. All fabrics are pre-distressed to suggest three generations of wear. Clients are advised to select one region to feature on currency; the other three will be designated as "historical variants" to avoid claims of regional favoritism. Note: Do not allow actual citizens to wear these for labor. Authenticity relies on ceremonial usage only. If a farmer wears the costume while plowing, it becomes a uniform. If he wears it only during the harvest festival, it becomes heritage.

  TIER 2: THE NATIONAL PASTIME (MID)
  Sport unifies the populace across class lines. We recommend an equestrian event or a ball sport involving a curved implement. The governing body was founded last spring, but our documentation backdates the charter to 1894. We provide the trophies (aged brass), the rulebook (invariant), and the founding mythology (a lone player against colonial prohibitions). Crucially, the rules must not change. A custom evolves to suit the player; a tradition demands the player suit the rule. If the game was played differently ten years ago, that was merely practice. This is now the game. Any deviation is not innovation; it is heresy. We supply the referees to enforce this distinction.

  TIER 3: THE ANCESTRAL MELODY (PREMIUM)
  Our genealogists will trace your anthem's melody to a specific peasant lineage, revolutionary martyr, or obscure poet, depending on your ideological preference. For an additional fee, we can adjust the musicological evidence to suggest the tune predates the language itself, implying the land sang before the people spoke. Lyrics are editable. We recommend removing references to specific current leaders; martyrs are safer than incumbents. The sheet music will be archived in a vault that does not yet exist, creating a sense of permanent security. Performance is mandatory at all state functions. Silence during the anthem is not respect; it is participation.

  [SIDEBAR: ADMINISTRATIVE ESSENTIALS]
  Most clients overlook the infrastructure of imagination. Our best-selling unit is the Vernacular Printing Press Package. While technically heavy machinery, we invoice this under Office Supplies to reduce bureaucratic friction. This includes the typesets for the standard dialect and a subscription model for a daily newspaper. The newspaper ensures that thousands of citizens perform the same ritual (reading) at the same time, unaware of each other yet connected. It is the most efficient way to convince strangers they are siblings. Do not skip this. A nation without print is merely a crowd. We also offer the Mass Education Module, ensuring everyone reads the same version of the history you just bought from us.

  ADD-ON CONSULTANCY: SOVEREIGNTY AND LIMITS
  Many new states order traditions before defining the community itself. If you discover late in the process that you need to be imagined as limited and sovereign, this consultancy is required. It cannot be back-ordered. We will assist with the Census (counting the people to define who exists), the Map (coloring the borders to define where they exist), and the Museum (displaying artifacts to define when they existed). Note: The Museum must imply that the nation is waiting to be discovered by its own citizens. Do not label artifacts as "foreign" unless they are currently held by a rival state. The Census must categorize everyone; ambiguity is the enemy of sovereignty. If a group does not fit the categories, create a new box or exclude them. The map must be colored completely; blank spaces suggest terra nullius.

  TERMS AND CONDITIONS OF HERITAGE
  1. Provenance Irrelevance: Clients often worry about historical accuracy. Be advised: provenance is functionally irrelevant provided the practice is rule-governed, symbolically loaded, and performed on schedule. A ritual repeated often enough implies continuity with a past that may never have happened. The value lies in the repetition, not the origin.
  2. Tradition vs. Custom: Clients routinely confuse a Tradition with a mere custom or convention and end up ordering the wrong thing entirely. Customs mutate to fit changing circumstances. Traditions do not. We do not sell mutability. If your people change the dance steps, you do not update the choreography; you correct the people.
  3. Memory Management: Discrepancies between official history and personal memory are expected. See Testimonial Section.

  CLIENT TESTIMONIAL
  "The Festival of Unity has transformed our capital. The crowds are immense, the flags are vibrant, and the sense of ancient purpose is palpable."
  — President Kaelo, Head of State
  [Addendum from Personal Staff: The President's grandmother recalls the festival going differently. She claims the dance was originally a harvest prayer for rain, not victory. She also claims the costume colors were reversed. Meridian Heritage Solutions reminds clients that individual memory is subjective; institutional memory is binding.]

