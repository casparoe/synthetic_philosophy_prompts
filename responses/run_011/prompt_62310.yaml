answer: |-
  Good morning. As you know, I retire in July. After nineteen years, this is my last assembly. There are things a headmaster says only once, and there are things he must say before he goes. Today I must speak about the Line.

  For a century, the school has formed the Line on the last Friday of June. Six hundred of you stand from the chapel to the river gate. I walk the length of it. I say your name. You say nothing. It takes four hours. It has rained. It has shone. It began in 1921. We do not know why. We know only that it continued because it continued.

  There is a philosopher named David Lewis who wrote about conventions. He argued that a convention holds not because it is commanded, but because we expect others to keep it, and so we keep it ourselves. It is arbitrary. We could stand in a circle. We could sit. But we stand in a line because we expect you to stand in a line. That expectation is a powerful thing. It binds us together. But it can also bind us too tightly.

  For nineteen years, I have walked the Line. I have written its history. I have told parents it is the finest thing we do. I believed that. But a convention must serve the school, not the other way around. When the cost of keeping the expectation exceeds the value of the tradition, the convention must break. But it cannot break by order. If I simply forbid it, the expectation remains. You would expect the Line, and you would feel its absence as a loss, or perhaps a grievance. To end a convention, we must all know simultaneously that it is ended, and we must all know what we do instead.

  So I am telling you this: This year's Line will be the last.

  I need to be clear about why. It is not because the Line was worthless. It was not. It marked time. It marked belonging. My predecessor, who sits in the gallery today, marched in the Line in 1956. He defended it for forty years. He was right to defend it. A tradition is not a mistake because it ends. It is a tool that has finished its work. To suggest otherwise would be to insult his stewardship and the history of this place. We honor him not by repeating the past, but by recognizing when the past has completed its task.

  There is another reason. Last year, the Line broke. A student stepped out. We know who she was. We know what happened after she left the file. She is not here today. I will not name her. To name her would be to make her an example, and she was not an example. She was a signal. The signal was that the silence required to hold the Line had become heavier than the community it was meant to celebrate. The enforcement of the Line is not by staff. It is by you. It is by the disapproval of the six hundred. When that disapproval becomes a trap from which a child cannot step out without consequence, the tradition has ceased to serve the child. I have known her since she was seven. I owe her this: that her step out of the Line does not become a martyrdom, but a reason for us to change.

  I also owe something to my colleagues. Some of you love the Line. You may feel that ending it is a loss of identity. You may wish to keep it. Your loyalty is to the school, and that loyalty is good. But loyalty now requires adaptation. If you wish to honor the Line in the future, you must not recreate the file. You must recreate the greeting. To hold the Line without the Head is to hold a shell. To hold the Gate is to keep the spirit. I ask you to channel your devotion into the new form. That is how you ensure this is a continuation, not a schism.

  So, here is what replaces it. We will not abolish the greeting. We will invert it.

  This year, after this assembly, I will not walk the drive. I will stand at the river gate. You will not form a file. You will walk from the chapel to the gate when you choose. You will pass me. I will greet you. If you wish to stop and speak, you may. If you wish to pass in silence, you may. There is no line. There is no wait. There is no expectation that you stand still. It will take twenty minutes. It will be done by noon.

  This is not a compromise. It is a correction. It keeps the recognition—the Head knowing your name—but removes the coercion—the requirement to stand until the Head arrives. It allows an alumnus to recognize the descendant of the Line, because the Head still greets the school at the boundary. But it ensures no child is held in a position they cannot leave without being seen leaving.

  I know some of you are disappointed. I know some of you are relieved. I am not asking you to feel either. I am asking you to understand. A convention dissolves when we all know it dissolves. You are here. You hear me. You know that everyone else hears me. When you leave this room, you will know that the Line is finished. You will know that everyone else knows it is finished. And you will know where to go instead.

  My daughter is in the third form. She asked me in March if she would ever stand in the Line. I told her the truth. I told her she would stand in the Gate. She will not be embarrassed by this speech. She will be greeted at the gate, like everyone else.

  I have spoken for eight minutes. I have said what needed saying. There is no vote. There is no discussion. There is only the switch.

  I am now going to step down from this stage. I will walk to the chapel door. I will stand there. You will not follow me in a file. You will leave this room when you are ready. You will walk to the river gate. You will pass me. Those who wish to speak may stop. Those who wish to go may go. This is the first Gate.

  Thank you.

  ***

  **Note to Head:**

  The common knowledge is produced in the paragraph beginning "So I am telling you this," specifically the sentence: "When you leave this room, you will know that everyone else knows the Line is finished." This explicitly states the mutual knowledge condition required to dissolve the convention. The room is most likely to lose the thread during the explanation of Lewis and conventions ("There is a philosopher named David Lewis..."); while necessary for your logic, abstract reasoning about arbitrary coordination risks disengaging the lower school (ages 11-13) before you reach the concrete announcement of the new ritual.
