  **⭐⭐⭐☆☆ Works great until you read the manual**
  **Verified Purchase**

  I bought the EntroSave SmartVent Model 4B to stop heating the neighborhood. The pitch was simple: a sorting vent for your furnace that separates fast air molecules from slow ones. Keep the fast ones, send the slow ones back to be heated. First month? Magic. My gas bill dropped 30%. The little shutter inside supposedly lets fast molecules stay inside and sends slow ones back to the furnace without using any power.

  But things got weird quickly. The unit itself gets hot. Like, genuinely hot to the touch. I thought this thing was supposed to save heat, not generate it. I called support, and they said heat dissipation is "expected during high-volume sorting." Also, the "frictionless gate" advertised on the box only works if the internal pressure matches external pressure exactly, which the manual admits happens roughly never in a standard duct system. When the pressure differs, the motor engages, and the hum gets loud.

  The real kicker is the "Logic Cache." Apparently, tracking molecules requires memory. Every night at 3 AM, the "Cache Full" light blinks, and the unit runs a Purge Cycle to wipe the data. I noticed my electric meter spinning fast during this window. I dug into the warranty booklet footnote 14(c). It claims "Up to 100% Thermal Efficiency" but defines efficiency as excluding information processing costs. The fine print states the minimum energy required to reset the internal memory state is calculated at **2.87 × 10⁻²¹ Joules per bit at 300K**. I don't know what that means, but my calculator says wiping enough memory to sort my living room air costs more electricity than the gas I saved.

  **UPDATE, four months later:**
  I sat down with the spec sheet and a calculator. The heat the unit emits plus the electricity for the nightly purge equals exactly the amount of energy I saved on gas, plus a 5% loss due to "mechanical resistance." So I'm paying more overall, but technically the air inside is warmer. I'm impressed by the engineering, but I want my money back.

  **Response from EntroSave Industries:**
  Thank you for your detailed feedback. We strive for transparency in our thermodynamic claims. Regarding the operating temperature: any sorting mechanism performing work on a system must dissipate heat equal to or greater than the entropy reduction achieved, ensuring system stability. Regarding the Purge Cycle: Information is a physical resource. To maintain the device's ability to distinguish molecular velocities, previous measurement data must be erased. As noted in footnote 14(c), this erasure requires energy expenditure consistent with fundamental physical constants. The Model 4B operates within all advertised parameters; the discrepancy lies in the customer's expectation that information processing is free. We stand by our efficiency rating as defined in the provided documentation.

  Sincerely,
  J. Aris
  Senior Compliance & Entropy Liaison
