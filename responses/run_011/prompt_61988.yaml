prompt: |-
  I'm a backend infra engineer, no philosophy training beyond what I've read on my own, and I'm giving a 20-minute talk at our local dev meetup. Audience: ~40 working engineers, mostly backend/platform folks, two tech leads who run a big monorepo, one guy who did a formal-methods PhD and will definitely know the game theory (and has probably at least heard of Lewis), and a developer-experience person who cares about onboarding. Nobody else has read any Lewis.

  My thesis: style and process norms in a codebase are *not* Lewisian conventions. Lewis's paradigm is a pure coordination game — everyone gets the same payoff at any equilibrium, so it genuinely doesn't matter which one gets picked, and salience does the picking. But a codebase norm looks like battle of the sexes: the infra team and the product teams prefer *different* equilibria (different formatter config, different error-handling idiom, different branching model) and one side actually loses something when the other's wins. So salience isn't what settles these, and I want to argue what settles them is organizational power: whoever owns CI wins. Roughly my three moves are: (1) show a real disagreement from my own repo where both sides were right on their own metrics, (2) claim Lewis needs common interest for salience to do work, (3) say the "convention" only looks shared because the losing side got outvoted in a tooling decision, not because they coordinated.

  Give me the Q&A prep sheet. The 7-8 objections this room will actually raise, ordered by how much damage they'd do, phrased the way each kind of person in that room would phrase them (the game-theory guy's objections should come from inside Lewis, not from outside — e.g. whether salience is already his tiebreaker for exactly this). For each: a ~45 second reply I can give out loud, a note on where the reply is soft, and what I should just concede up front. Then tell me the one point that has to land for the talk not to collapse, and the question I'm praying nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** Backend infra engineer, self-taught philosophy.
      *   **Task:** 20-minute talk at a local dev meetup.
      *   **Audience:** ~40 engineers (mostly backend/platform), 2 tech leads (monorepo owners), 1 formal-methods PhD (Lewis/Game Theory expert), 1 DevEx person (onboarding focus).
      *   **Thesis:** Codebase norms $\neq$ Lewisian conventions. Lewis = pure coordination (common interest). Code norms = Battle of the Sexes (conflicting interests). Resolution = Power/CI ownership, not Salience.
      *   **Structure:** 3 moves (Real disagreement example, Lewis requires common interest, "Convention" is actually power).
      *   **Deliverable:** Q&A prep sheet (7-8 objections, ordered by damage, specific personas, 45s replies, soft spots, concessions, critical point, feared question).

  2.  **Deconstruct the Thesis & Potential Weaknesses:**
      *   *Lewis's Definition:* Lewis *does* account for mixed motives to some extent in later work, but *Convention* (1969) focuses heavily on coordination problems (Driving on the left vs. right). The user is arguing that code norms are *not* coordination problems but conflict problems.
      *   *Salience:* Lewis uses salience to solve the equilibrium selection problem *when interests align*. If interests don't align, salience might still work if one side yields, but it's not "convention" in the strict sense.
      *   *Power:* The user claims power/CI determines the outcome. This is sociologically plausible but philosophically reduces "normativity" to "force."
      *   *Evolution:* Norms often evolve. Maybe they start as conflict and become coordination over time?
      *   *DevEx:* The DevEx person cares about onboarding. If norms are just power struggles, onboarding becomes political navigation, not learning "the right way."
      *   *The PhD:* Will know Lewis intimately. Will spot mischaracterizations of *Convention*.
      *   *Tech Leads:* Care about stability and velocity. Might argue that *having* a standard is what matters, not how we got there.

  3.  **Brainstorming Objections (Persona-based):**
      *   *PhD (Game Theory):* "Lewis handles mixed motives." "Salience works even with slight preference differences." "You're defining convention too narrowly."
      *   *Tech Leads:* "Who cares? We just need consistency." "Power *is* a coordination mechanism."
      *   *DevEx:* "This makes onboarding sound toxic." "New hires don't care about the history, just the rule."
      *   *General Backend:* "CI isn't power, it's automation." "Sometimes we actually do agree." "Open Source works differently."

  4.  **Selecting and Ordering the Top 7-8 Objections:**
      *   *Damage Assessment:* The PhD's objection is the most dangerous intellectually. If Lewis actually covers this, the thesis collapses. The Tech Leads' objection is dangerous practically (if the audience thinks "so what?", the talk is irrelevant). The DevEx objection hits the human cost.
      *   *Ordering:*
          1.  PhD: Lewis *does* cover mixed motives (The "Killer").
          2.  Tech Lead: Consistency matters more than origin (The "So What?").
          3.  General: Evolution/Time turns conflict into coordination (The "Nuance").
          4.  DevEx: Onboarding implications (The "Human Cost").
          5.  General: Open Source counter-example (The "Edge Case").
          6.  PhD: Salience as a focal point even in conflict (The "Technicality").
          7.  General: CI as a tool, not power (The "Semantic").
          8.  General: Sometimes we actually agree (The "Strawman").

      *Refining the Order:* Let's put the PhD's strongest point first. Then the practical "So What?" from leads. Then the evolutionary argument. Then DevEx. Then the specific Lewis technicalities.

  5.  **Drafting Replies (Constraint: ~45 seconds):**
      *   Need to be conversational, not academic.
      *   Need to acknowledge validity without conceding the core thesis.
      *   Need to pivot back to "Power/CI" as the differentiator.

  6.  **Identifying Soft Spots & Concessions:**
      *   *Soft Spot:* Lewis is more nuanced than the 1969 book.
      *   *Concession:* Admit that *once established*, norms *feel* like conventions. Admit that power isn't the *only* factor, just the decisive one in conflict.

  7.  **Identifying the "One Point" and "Feared Question":**
      *   *One Point:* The distinction between *coordination* (we both win if we match) and *conflict* (I win if we match *my* way).
      *   *Feared Question:* "If it's just power, why do we pretend it's best practice?" (Exposes the hypocrisy/politics). Or, "Is there *any* example that IS Lewisian?" (Traps the speaker). Let's go with the "Is there *any* Lewisian norm?" question because it tests the boundary of the thesis. Actually, the "Hypocrisy" question is more damaging to the culture. Let's choose the "Is there *any* Lewisian norm?" because if the answer is "No," the theory is too broad. If the answer is "Yes," the PhD might pounce on why *that* one is Lewisian and others aren't.
      *   *Better Feared Question:* "If norms are just power, why do they persist after the power structure changes?" (Sticky norms).
      *   *Best Feared Question:* "Are you saying we should stop pretending and just admit it's politics?" (Makes the speaker look cynical/disruptive).
      *   *Decision:* The "Feared Question" should be the one that undermines the *utility* of the distinction. "If it's all power, why bother calling it a convention at all?"

      *Wait, let's look at the "One Point that has to land".* It's the distinction between Common Interest vs. Conflicting Interest. If the audience thinks all technical decisions are common interest (we all want good code), the thesis fails.

      *Let's look at the "Feared Question" again.* The PhD asking: "Lewis explicitly discusses 'impure' coordination games in Chapter 3. Are you claiming he missed the case where preferences diverge slightly?" This is the technical kill shot.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Are the replies too long? Keep them punchy.
      *   *Check:* Is the tone right? Infra engineer to infra engineer. Pragmatic, slightly cynical but constructive.
      *   *Check:* Did I address the specific personas? Yes (PhD, Leads, DevEx).
      *   *Check:* Lewis accuracy. Lewis *does* focus on coordination. He acknowledges conflict but defines convention *around* coordination. The user's point is that code norms are often *not* coordination problems primarily. I need to make sure the reply doesn't misrepresent Lewis too badly or the PhD will eat them alive. I should advise the user to concede Lewis is broader but insist the *dominant* dynamic in infra is conflict.

  9.  **Final Polish:**
      *   Ensure the "Soft Spot" is honest.
      *   Ensure the "Concession" is strategic.
      *   Make sure the "One Point" is crystal clear.

  *(Self-Correction on the PhD objection)*: The PhD knows Lewis. Lewis defines convention as a solution to a *coordination problem*. If there is conflict, it's not a coordination problem in the strict sense, it's a bargaining problem. However, Lewis does discuss "coordination with partial conflict." The user's thesis is that code norms are *mostly* partial conflict, not pure coordination. The PhD will argue that as long as matching is better than not matching, it's still Lewisian. The user needs to argue that *which* match matters so much that it overrides the benefit of matching.
  *Correction:* Actually, the strongest Lewisian counter is that *once the decision is made*, it *becomes* a coordination game (everyone now prefers to match the decision to avoid churn). The user needs to distinguish between *formation* and *maintenance*.

  *Let's adjust the Q&A to reflect this nuance.*

  10. **Finalizing the List:**
      1.  PhD: Lewis covers partial conflict (The Technical Kill).
      2.  Tech Lead: Outcome > Process (The Pragmatic Kill).
      3.  General: Norms become coordination over time (The Evolutionary Kill).
      4.  DevEx: Onboarding cost (The Human Kill).
      5.  PhD: Salience as a bargaining chip (The Mechanism Kill).
      6.  General: CI is neutral (The Tooling Kill).
      7.  General: Open Source counter-example (The Scope Kill).
      8.  General: Are *any* norms Lewisian? (The Boundary Kill).

      *Wait, I need to order by damage.*
      1.  PhD (Lewis covers conflict).
      2.  Tech Lead (Who cares?).
      3.  General (It becomes coordination later).
      4.  DevEx (Onboarding).
      5.  PhD (Salience in bargaining).
      6.  General (CI is neutral).
      7.  General (Open Source).
      8.  General (Any Lewisian norms?).

      *Let's refine the replies to be 45s spoken.* ~100-120 words.

      *Let's refine the "One Point".* It must be: "The cost of mismatching is not symmetric."
      *Let's refine the "Feared Question".* "If it's just power, why do we document it as 'best practice'?" (Accusation of dishonesty).

      *Okay, ready to write.*
answer: |-
  # Q&A Prep Sheet: "Code Norms Are Not Lewisian Conventions"

  **Talk Time:** 20 mins
  **Audience:** 40 Engineers (Infra heavy), 1 Game Theory PhD, 2 Tech Leads, 1 DevEx.
  **Goal:** Defend the thesis that infra norms are resolved by power/CI, not Lewisian salience/coordination.

  ---

  ### The Objections (Ordered by Damage Potential)

  #### 1. The PhD (The Technical Kill Shot)
  **Objection:** "Lewis explicitly handles 'impure' coordination games where preferences diverge slightly. As long as *matching* is better than *mismatching* for everyone, it's still a coordination problem. Salience still works as the tiebreaker even if one side prefers the equilibrium slightly more. You're setting up a strawman of 'pure' coordination."
  **Reply (45s):** "That's fair, and I should have been more precise. Lewis focuses on cases where the *primary* payoff is matching. In infra, the payoff for matching on *my* config vs. *your* config is often asymmetric enough that one side actively loses velocity or safety. If the Infra team prefers Type A and Product prefers Type B, and Type A breaks Product's workflow, Product isn't just 'slightly less happy'—they're blocked. That shifts it from a coordination game to a bargaining game. Lewis's salience doesn't solve bargaining; power does."
  **Soft Spot:** You are relying on the magnitude of the preference divergence. If the PhD argues divergence is always "partial," you look naive.
  **Concede:** "I concede Lewis allows for partial conflict. My claim is that in infra, the conflict is usually *dominant*, making the coordination aspect secondary."

  #### 2. The Tech Leads (The "So What?" Kill)
  **Objection:** "Even if you're right that it's power struggles, the outcome is the same: we have a standard. Why does the origin story matter? We need consistency for velocity, regardless of whether we got there via salience or a CI veto."
  **Reply (45s):** "Because if you treat a power settlement like a Lewisian convention, you assume everyone buys in. If you think the Product team adopted the formatter because it was 'salient,' you'll be confused when they keep bypassing it. If you recognize it as a power move, you know you need to enforce it with gates, not just documentation. Misdiagnosing the norm leads to under-enforcement and eventual drift."
  **Soft Spot:** Sounds cynical. Leads want harmony, not admission of conflict.
  **Concede:** "You're right that the end state looks the same. I'm arguing about *maintenance costs*, not the end state."

  #### 3. The General Engineer (The Evolutionary Argument)
  **Objection:** "But norms evolve. Even if it started as a fight, once the CI rule is set, everyone prefers to match it to avoid build failures. Doesn't it *become* Lewisian after the decision is made?"
  **Reply (45s):** "It becomes a coordination game *around the power structure*, not around the technical merit. That's the key distinction. Lewisian conventions feel 'natural'—like driving on the right. Infra norms feel 'legislated'—like a speed limit. If the CI owner changes, the norm often flips. A true Lewisian convention persists because it's salient to the users, not because it's hard-coded in the pipeline."
  **Soft Spot:** Many norms *do* persist after tooling changes (legacy code).
  **Concede:** "Some norms stick and become cultural. I'm talking about the active, contentious ones that define current velocity."

  #### 4. The DevEx Person (The Human Cost)
  **Objection:** "If you tell new hires 'this standard exists because Infra won a turf war,' you destroy psychological safety. Onboarding relies on the assumption that norms are 'best practices,' not political settlements. Isn't this framing toxic?"
  **Reply (45s):** "I'm not suggesting we tell new hires 'this is politics.' I'm suggesting we stop lying to *ourselves*. When we treat norms as objective best practices, we stop listening to valid criticism from Product teams. Acknowledging the power dynamic allows us to build better guardrails and empathy, rather than gaslighting teams into thinking their workflow preferences are 'wrong'."
  **Soft Spot:** Risks sounding like you're advocating for open political warfare in the repo.
  **Concede:** "Agreed, onboarding docs should state the rule, not the history. This talk is for the maintainers, not the docs."

  #### 5. The PhD (The Salience Mechanism)
  **Objection:** "In bargaining games, salience *still* acts as a focal point to avoid costly negotiation. If Infra proposes a standard, that proposal itself is salient. Isn't that still Lewis doing the work, even if the preferences differ?"
  **Reply (45s):** "Salience suggests the option stands out *naturally*. In infra, the option stands out because it's the only one that merges. That's not salience; that's exclusion. Lewis's salience works because we both see the lighthouse. CI enforcement works because one of us holds the keys. The mechanism of selection is fundamentally different."
  **Soft Spot:** "Salience" can be defined broadly to include 'institutional prominence.'
  **Concede:** "If you define salience as 'whatever is most visible,' then yes. But Lewis means 'prominent without force.' I mean 'prominent because of force.'"

  #### 6. The General Engineer (The Tooling Neutrality)
  **Objection:** "CI isn't 'power,' it's automation. It's just the neutral arbiter of the rules we all agreed to. You're personifying the pipeline."
  **Reply (45s):** "The pipeline is code. Someone owns the repo that defines the pipeline. When Infra and Product disagree on a lint rule, and Infra merges the change because they own the `.github` directory, that's not neutrality. That's ownership. Automation just scales the power imbalance."
  **Soft Spot:** In some orgs, CI config *is* democratically voted on.
  **Concede:** "In mature orgs, maybe. In most scaling startups, CI ownership is highly centralized."

  #### 7. The General Engineer (The Open Source Counter-Example)
  **Objection:** "What about Open Source? There's no 'Infra team' with power. Norms there definitely feel Lewisian. Doesn't that break your thesis?"
  **Reply (45s):** "Open Source is the exception that proves the rule. In OSS, the 'power' is the maintainer's merge bit. It's still power, just distributed differently. When a maintainer says 'we use tabs,' it's not because tabs are salient; it's because the maintainer prefers them and holds the keys. It only looks Lewisian because the community self-selects into the maintainer's preference."
  **Soft Spot:** Large OSS projects often have formal governance/committees that *do* coordinate.
  **Concede:** "Large foundations (like Apache) might be more Lewisian. I'm talking about corporate repos."

  #### 8. The General Engineer (The Boundary Question)
  **Objection:** "Is *anything* in a codebase Lewisian by your definition? If every norm is power, the distinction is meaningless."
  **Reply (45s):** "Yes. Variable naming styles within a team that already agrees on architecture. Or using `git` instead of `svn`. Those are pure coordination—we just need to match, and nobody cares which. I'm arguing that the *high-stakes* infra norms (branching, deployment, error handling) are the ones that aren't Lewisian. Don't confuse low-stakes habits with high-stakes constraints."
  **Soft Spot:** Hard to draw the line between "high stakes" and "low stakes."
  **Concede:** "It's a spectrum. I'm focusing on the high-conflict end."

  ---

  ### The Critical Element

  **The One Point That Must Land:**
  "The cost of mismatching is not symmetric."
  *Why:* If the audience believes that Infra and Product suffer equally from a bad norm choice, your thesis collapses. You must convince them that Infra optimizing for *stability* often actively harms Product's *velocity*, creating a zero-sum dynamic that Lewis's coordination model cannot explain.

  **The Question You're Praying Nobody Asks:**
  *"If norms are just power settlements, why do we spend so much time writing RFCs and design docs pretending they're technical decisions?"*
  *Why:* This forces you to admit that the engineering culture is performative. It shifts the talk from "Here's a useful model for norms" to "Here's why we are all hypocrites." It makes the Tech Leads look bad and makes you look like a cynic rather than an engineer offering a diagnostic tool.
  *Prepared Deflection:* "We write RFCs to find the technical truth, but we vote to settle the conflict. The RFC is the coordination attempt; the merge is the power settlement."
