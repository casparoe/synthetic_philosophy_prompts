      *   **Context:** 4th-year Philosophy of Biology PhD student co-teaching a graduate seminar on units of selection with a microbial ecologist.
      *   **Problem:** Students polarize into "selfish gene" vs. "group selection" camps without realizing they answer different questions.
      *   **Task:** Write a scripted argument (dialogue) between two fictional characters (members of the ecologist's synthetic evolution group) to open Week 6.
      *   **System:** Engineered bacteria forming multicellular aggregates.
          *   Cooperators (adhesin producers) vs. Cheaters (deletion mutants).
          *   Aggregates fragment (reproduce); fragmentation rate depends on adhesin fraction (group phenotype).
          *   Within aggregates: Cheaters outgrow cooperators (cost of production).
          *   Inheritance: Most aggregates fragment (inherit composition + drift), some nucleate de novo from ~8 cells (variable relatedness).
          *   **Crucial Stipulation (iv):** Cheater deletion is on a conjugative element. Transfer rate rises with density/adhesin. Aggregates can go from cheater-free to mixed within one cycle *without* fragmenting. Group character modulates element transmission.
      *   **Characters:**
          *   *Replicator-First Theorist (RFT):* Only mobile element lineages reproduce. Aggregates are interactors. Group selection is assortment + within-group selection or covariance artefact.
          *   *Multilevel-Selection Theorist (MLST):* Aggregates are Darwinian individuals (life cycle, heritable variation, descendants). Between-aggregate term is real causation because group character affects transmission (iv).
      *   **Constraints:**
          *   Word count: 1,400 - 1,800 words.
          *   Setting: Lab meeting drifting into the corridor towards the incubator room.
          *   Tone: Competent, no strawmen, no tidy ending, real back-and-forth.
          *   Required Moves:
              1.  Argue over stipulation (iv): RFT explains why transfer = reproduction (not diffusion); MLST explains group heredity when composition changes without reproduction (regression vs. real heredity?).
              2.  Between-aggregate term: Causation vs. assortment record. Propose controlled measurement. Other explains why it won't work/settle anything (residual dispute not empirical).
              3.  RFT: Why not just kin selection relabelled? MLST: How differs from trait-group model (cells have fitness, groups structure)?
              4.  Two genuine concessions.
              5.  One proposed redefinition objected to as begging the question.
              6.  Ending: No reconciliation. State one assumption each cannot discharge. Diagnose substantive vs. verbal (which word equivocates: reproduction, fitness, heritability, individual, unit).
              7.  Formatting: No citations/quotes/names of authors/books. Use conceptual vocabulary (Price, contextual analysis, etc.) but explain in character voice.

