      *   *"Call whatever is in the envelope you're holding X... The other one has either 2X or X/2."* This treats $X$ as a fixed constant across both states of the world (holding the smaller vs. holding the larger). In reality, $X$ is a random variable that takes different values depending on which envelope you picked.
      *   *"It doesn't depend on what X turns out to be."* This is false for any proper prior distribution. The probability that the other envelope is larger *does* depend on $X$ (specifically, it decreases as $X$ increases relative to the prior's support).
      *   *"This is a real paradox and not a puzzle with a tidy solution."* It is a puzzle with a tidy solution: the calculation uses an improper prior or conflates random variables.

  **(2) Nadia: The Equivocation Objection**
  **Rating: +2 (Clearly Right)**
  *   **Surviving Claims:**
      *   *"Your X is doing two different jobs."* Correct. $X$ represents the amount in hand, but the calculation implicitly assumes the probability of $X$ being the smaller amount is 1/2 regardless of the value of $X$, which requires $X$ to also represent a specific state of nature independent of value.
      *   *"No probability distribution is spread evenly over all the possible amounts."* Correct. A uniform prior over $(0, \infty)$ is improper (integrates to infinity) and cannot be used for standard expected value calculations.
  *   **Failed Claims:** None.

  **(3) Ben: The Symmetry Argument (Ex Ante)**
  **Rating: -1 (Mostly Wrong)**
  *   **Surviving Claims:**
      *   *"Two envelopes, one has twice the other, I get handed one at random."* (Accurate setup).
      *   *"There's no asymmetry between the two envelopes."* (True *ex ante*).
  *   **Failed Claims:**
      *   *"Symmetry alone gets me there [to a positive gain]."* False. Symmetry *ex ante* implies the envelopes are exchangeable, meaning the expected value of switching is exactly **zero**, not positive. Ben uses symmetry to argue for a gain, when symmetry actually forbids it *ex ante*.

  **(4) Nadia: The Symmetry Counter (Ex Ante)**
  **Rating: +2 (Clearly Right)**
  *   **Surviving Claims:**
      *   *"Symmetry alone gets you the opposite."* Correct. Exchangeability implies $E[\text{Switch}] = E[\text{Stay}]$.
      *   *"If you hand me any prior with a finite average amount... ex ante gain from switching comes out exactly 0."* Correct. For any proper prior with finite expectation, the unconditional expected gain from switching is zero.
  *   **Failed Claims:** None.

  **(5) Ben: The Bounded Case (1 to 100)**
  **Rating: +1 (Mostly Right)**
  *   **Surviving Claims:**
      *   *"Say the organizer tells you the smaller amount is a whole number of dollars from 1 to 100 and every one of those was equally likely."* This is a valid **proper prior**. Unlike the infinite case, a uniform distribution on a finite set is mathematically sound.
      *   *"You see 40... Equal odds, 2:1 payoff, so you switch."* Correct calculation for this specific value. Given the uniform prior on $S \in \{1..100\}$, seeing 40 implies $S=40$ or $S=20$ with equal posterior probability. $E[\text{switch}] = 50 > 40$.
      *   *"There's a concrete policy that beats never-switching."* Correct. A policy like "Switch if $X \le 100$" has a higher *ex ante* expected value than "Never Switch" in this bounded game because it exploits the boundary information (if $X > 100$, you definitely have the larger envelope).
  *   **Failed Claims:**
      *   *"Anybody who says... there's never anything to gain by switching is just wrong."* This is slightly imprecise. There is never *unconditional* gain with a proper prior, but there can be *conditional* gain. Ben is right in spirit regarding conditional policies, but his phrasing blurs the *ex ante* vs. *ex post* distinction.

  **(6) Nadia: The Rebuttal to Bounded Case**
  **Rating: -1 (Mostly Wrong)**
  *   **Surviving Claims:**
      *   *"Your policy only looks better because you're comparing it to never-switching."* (Technically true that we are comparing policies, but this doesn't invalidate Ben's point that one policy dominates the other).
  *   **Failed Claims:**
      *   *"Your 40 example assumes each number 1 to 100 was equally likely, which is the same indifference move I just objected to, only with a ceiling painted on it."* **False.** A uniform prior on a finite set $\{1..100\}$ is a proper probability distribution. It is not subject to the same impossibility objections as a uniform prior on $\{1..\infty\}$. Nadia conflates "bounded uniform" with "improper uniform."
      *   *"The value of the envelope you're holding is what it is either way."* This dismisses decision theory. The value is a random variable; switching changes which realization you end up with.

  ---

  ### Rulings on the Disputes

  #### 1. Who wins the (5)/(6) exchange?
  **Ben wins.**
  Ben constructs a specific, mathematically valid counter-example (the bounded prior) where looking at the envelope *does* provide actionable information that allows for a switching policy with higher expected value than a fixed policy. Nadia's objection fails because she incorrectly categorizes a finite uniform prior as the same fallacy as an infinite uniform prior. In the bounded case, the symmetry is broken by the boundaries, and conditional switching is genuinely advantageous.

  #### 2. Is Ben's claim "there's a policy that beats never-switching" true as stated?
  **Yes, but context-dependent.**
  In the **bounded scenario** Ben described (smaller amount uniform on 1–100), it is **true**. A policy such as "Switch if $X \le 100$, otherwise keep" yields a strictly higher expected return than "Never Switch."
  *   *Reason:* When the smaller amount $S$ is between 51 and 100, the pair is $(S, 2S)$ where $S \le 100$ and $2S > 100$. The "Switch if $\le 100$" policy ensures you always end up with $2S$ in these cases, whereas "Never Switch" only gets you $2S$ half the time.
  *   *Caveat:* In the **standard unbounded scenario** with a proper prior (finite mean), no policy yields a higher *ex ante* expected return than any other *unconditional* policy. However, conditional policies can still outperform "Never Switch" for specific observed values, just not for *all* values simultaneously (you must be willing to lose on some values to gain on others). Ben's claim holds for his specific bounded example.

  #### 3. On the infinite-average bit, is Ben or Nadia right?
  **Nadia is right.**
  *   **Ben's Claim:** "Since the envelopes are symmetric the gain has to be zero whatever prior you use."
  *   **Nadia's Claim:** "The symmetry argument simply doesn't deliver zero once the average is infinite."
  *   **Verdict:** Nadia is correct. The symmetry argument relies on the linearity of expectation: $E[\text{Gain}] = E[\text{Other}] - E[\text{Current}]$. If the prior distribution is such that the expected amount in the envelopes is infinite ($E[\text{Amount}] = \infty$), then this subtraction is undefined ($\infty - \infty$). In such cases (e.g., variants of the St. Petersburg paradox), it is mathematically possible to construct priors where $E[\text{Other} \mid X] > X$ for **all** $X$. Symmetry does not force the expected gain to be zero when expectations diverge. Ben is applying finite-intuition rules to an infinite case where they do not hold.

  ### Summary for the Seminar
  *   **Nadia** correctly identified the core fallacy in the standard paradox (improper priors/equivocation) and wins the theoretical argument about infinite expectations.
  *   **Ben** correctly identified that conditional strategies can beat unconditional ones in bounded scenarios, and Nadia erred by dismissing the bounded prior as invalid.
  *   **Final Tally:** Nadia wins the general theory (Moves 2, 4, and the Infinite Case). Ben wins the specific bounded counter-example (Move 5). Nadia's Move 6 is the weakest link in her argument.
