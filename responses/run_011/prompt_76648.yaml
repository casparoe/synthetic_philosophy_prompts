answer: |-
  1. **Mark and Justification**

  **Mark: 64 (Upper Second)**

  This sits firmly in the 2:1 band but falls short of a First because the central philosophical move in the third paragraph conflates earning the right to truth-talk with solving the logical problem of validity. The script is fluent and well-structured, demonstrating clear engagement with the seminar material, which prevents it from dropping into the lower second. However, for a third-year seminar, the confidence with which incorrect or oversimplified claims are asserted (particularly regarding the negation problem) limits the mark. To reach the 70+ band, the student would need to distinguish more carefully between quasi-realist semantics and the logical explanation of inference.

  ***

  2. **Paragraph-by-Paragraph Comments**

  **Paragraph 1**
  > *"I think the argument fails, because (1) is not something the expressivist need accept in the form the argument requires."*
  **Comment:** Strong opening. You correctly identify the Quasi-realist strategy of rejecting the initial characterisation of expressivism rather than accepting the conclusion. This sets up a clear roadmap for the essay.

  **Paragraph 2**
  > *"This is the Frege–Geach problem... and it is a problem about compositionality"*
  **Comment:** Accurate diagnosis. You clearly explain why embedding threatens the expressivist account of meaning. The distinction between asserted and unasserted contexts is handled well here.

  **Paragraph 3**
  > *"Minimalism about truth is therefore not a cosmetic addition to expressivism; it is what closes the gap Geach identified"*
  **Comment:** This is the strongest sentence in the essay, but also the most problematic (see section 3). You are right that minimalism is central to Quasi-realism, but you overstate its power regarding logical validity. Be careful not to treat linguistic permission as a logical solution.

  **Paragraph 4**
  > *"Blackburn, who introduced the image of the ladder we may kick away once it has done its work"*
  **Comment:** Good recall of key figures. However, ensure you are precise with attributions; the 'ladder' is Wittgenstein's image, which Blackburn adopts, rather than one he introduced himself. The summary of Gibbard is accurate.

  **Paragraph 5**
  > *"Whatever else remains to be done, that much is settled."*
  **Comment:** This is too definitive. You are dismissing a major contemporary objection (Schroeder's negation problem) as a settled matter. In a third-year essay, claiming a live debate is 'settled' requires much stronger justification than a single sentence.

  ***

  3. **Things that sound right but aren't**

  *   **Claim:** *"Minimalism about truth... closes the gap Geach identified, and the expressivist is free to run modus ponens."*
      *   **The Issue:** This is a category error. Deflationism allows the expressivist to *say* moral sentences are truth-apt (it solves the linguistic problem), but it does not automatically explain *why* the inference is valid (the logical problem). Validity requires an account of how the *contents* of the attitudes combine to preserve correctness, not just a permission to use the word 'true'. Deflationism alone does not provide the semantics for the conditional.
      *   **Cost:** This is the core argument of the essay. It costs roughly 5–7 marks because the conclusion rests on a conflation of truth-aptness with logical validity.

  *   **Claim:** *"Finally, the negation problem is not a seperate problem... that much is settled."*
      *   **The Issue:** This is factually incorrect regarding the current state of metaethics. The negation problem (articulated by Mark Schroeder) is widely considered distinct from, and often more difficult than, the conditional embedding problem. It challenges whether expressivists can distinguish between 'not disapproving' and 'disapproving of not'. Claiming it is 'settled' shows a lack of critical engagement with the literature's current limits.
      *   **Cost:** Roughly 3 marks. It undermines the critical assessment required by the prompt ("Assess the argument").

  *   **Claim:** *"Blackburn, who introduced the image of the ladder we may kick away"*
      *   **The Issue:** Minor but indicative of loose recall. The image is from Wittgenstein's *Tractatus* (6.54). Blackburn utilises it to describe the relationship between projectivism and quasi-realism, but he did not introduce it. In a seminar on metaethics, precise attribution matters.
      *   **Cost:** 1 mark. It suggests a slight lack of rigour in handling source material.

  ***

  4. **Feedback for the Student**

  *   **Distinguish linguistic rights from logical explanations:** Just because an expressivist is permitted to use the word 'true' (via minimalism) does not mean they have automatically explained why an inference is valid. Always separate the question 'Can we say this?' from 'Does this preserve validity?'.
  *   **Qualify claims about 'settled' debates:** Avoid declaring a philosophical problem 'settled' unless you provide the argument for why the objection has been defeated. In third-year work, acknowledging the ongoing nature of a debate (e.g., the negation problem) often demonstrates more understanding than claiming it is resolved.
  *   **Check attributions of key metaphors:** When using specific philosophical imagery (like the ladder), ensure you attribute it to the original author even if a contemporary philosopher adopts it. Precision in attribution signals precision in thought.
