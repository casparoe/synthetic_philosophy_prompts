      *   *Critique on Para 5:* The negation problem (Schroeder) is distinct because it challenges the *type* of attitude expressed by negation. Saying it's "settled" is wrong.
      *   *Mark Justification:* Why 64 and not 68? Because the core argument relies on a conflation. Why not 58? Because the structure is good and they identify the relevant debate (Quasi-realism).
