      *   *Section 1:* Mark + Justification.
      *   *Section 2:* Paragraph comments (quoted phrases).
      *   *Section 3:* "Things that sound right but aren't" (Blunt).
      *   *Section 4:* Feedback bullets (Craft, no reading).

  6.  **Refining the Critique (Self-Correction during drafting):**
