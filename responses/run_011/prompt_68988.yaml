  ## The Ferry Cabin Seminar Game

  ### 1. The Mechanism: "The University Ferry"

  **The Scenario (Read to Class):**
  "The university runs a private ferry for faculty and students. There are two possible configurations for today's crossing, determined by a hidden die roll.
  **Hypothesis Small (S):** The ferry is in 'Maintenance Mode.' Only **1 Cabin** is open (Cabin #1).
  **Hypothesis Large (L):** The ferry is in 'Full Service.' **10 Cabins** are open (Cabin #1 through #10).
  Prior probability for each is 50% (Die roll: 1-3 = Small, 4-6 = Large).
  There are 12 of you. If Small, 1 of you is randomly assigned a Cabin; the other 11 are 'Water' (left on the dock). If Large, 10 of you are assigned Cabins; 2 are 'Water'."

  **Materials:**
  *   **12 Envelopes:**
      *   1 card marked "Cabin #1".
      *   9 cards marked "Cabin #2–#10" (grouped).
      *   2 cards marked "Water".
      *   *Note:* You (the instructor) hold the master deck. You construct the stack *after* rolling the die hidden under the desk.
      *   **If Small:** Stack = 1 "Cabin #1" + 11 "Water".
      *   **If Large:** Stack = 10 "Cabin #1–#10" + 2 "Water".
  *   **Tokens:** 20 poker chips per student.
  *   **Prize:** **"The Homework Pass."** One chip converts to 1% extra credit on the final paper, capped at 5%. (Max 5 chips redeemable). This is high enough value to induce risk-aversion or risk-seeking behavior, but low enough not to corrupt grades.
  *   **Whiteboard Ledger:** Three columns: `[Round]`, `[SSA Prediction]`, `[SIA Prediction]`. You fill this in *after* bets are placed.

  **Information Structure:**
  *   **Silence Rule:** Once envelopes are distributed, no talking until bets are locked.
  *   **Private Info:** Students look at their cards alone.
  *   **Public Info:** You announce the Reference Class for the round.

  ---

  ### 2. Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:10: Setup & Stakes**
  *   Distribute 20 chips to each student.
  *   Explain the Ferry Scenario and the Die Roll (50/50 Prior).
  *   Explain the Prize (Homework Pass).
  *   **Crucial:** Tell them, "There are two rational ways to bet. I will not tell you which is which. I will only tell you the *Reference Class* for the round."

  **00:10 – 00:25: Round 1 (The Divergence)**
  *   **Action:** Roll die (hidden). Construct stack. Distribute envelopes.
  *   **Instruction:** "Open your envelopes. Look at your card. Do not show anyone."
  *   **Reference Class Announcement:** "For this round, treat the Reference Class as **'Passengers on the Ferry.'**"
  *   **The Bet:** "Bet chips on **Small** or **Large**. If you are 'Water', you cannot bet (set chips aside)."
  *   **Math Check:**
      *   *Student with Cabin #1:*
      *   **SIA:** $P(L) \propto 10 \times 0.5 = 5$. $P(S) \propto 1 \times 0.5 = 0.5$. **Odds 10:1 for Large.**
      *   **SSA:** $P(C1|L) = 1/10$. $P(C1|S) = 1/1$. **Odds 1:10 for Small.**
      *   *Result:* Students holding Cabin #1 should be betting opposite ways depending on their internal logic. Most will intuitively feel SSA (Doomsday-style), some SIA.
  *   **Reveal:** Collect bets. Reveal the Die Roll. Pay out winners (2:1 payout).
  *   **Board:** Write the theoretical odds on the board *without naming the theories*. (e.g., "Rule A said 10:1 Large, Rule B said 1:10 Small").

  **00:25 – 00:40: Round 2 (The Reference Class Shift)**
  *   **Action:** Reset chips to 20. New Die Roll. New Envelopes.
  *   **Instruction:** "Open envelopes. Look at your card."
  *   **Reference Class Announcement (Part A):** "Treat the Reference Class as **'Passengers on the Ferry.'**"
  *   **The Bet:** "Bet on Small or Large. **Constraint:** You may only use the information 'I am a Passenger' (ignore your Cabin Number)."
      *   *Note:* Students with "Water" sit out. Students with Cabins must ignore the number.
  *   **Math Check:**
      *   **SIA:** Still **10:1 Large** (Existence counts).
      *   **SSA (Pass Class):** $P(Pass|L) = 1$, $P(Pass|S) = 1$. **Odds 1:1 (50/50).**
      *   *Observation:* SSA shifted from 1:10 (Round 1) to 1:1 (Round 2A). SIA stayed 10:1.
  *   **Reference Class Announcement (Part B):** "Now, treat the Reference Class as **'Students in this Seminar.'**"
  *   **The Bet:** Same info ("I am a Passenger").
  *   **Math Check:**
      *   **SSA (Seminar Class):** $P(Pass|L) = 10/12$. $P(Pass|S) = 1/12$. **Odds 10:1 Large.**
      *   *Observation:* SSA shifted again (1:1 -> 10:1). SIA stayed 10:1.
  *   **Debrief Moment:** Point to the board. "One rule moved every time I changed the definition of 'You'. The other rule didn't budge."

  **00:40 – 00:55: Round 3 (The Presumptuous Philosopher)**
  *   **Action:** No envelopes. No Die Roll yet.
  *   **Selection:** Ask for one volunteer to be "The Philosopher." Hand them 20 chips.
  *   **Instruction:** "You must bet on Small or Large **before the die is rolled** and **before envelopes are distributed**. You know only that the hypotheses exist."
  *   **The Trap:** If they bet randomly, it's 50/50. If they use SIA logic, they *must* bet **Large** because $N_L > N_S$.
  *   **Drama:** If they bet Large (SIA), and the Die rolls Small (50% chance), they lose everything. They must defend why they were rational despite losing.
  *   **Payoff:** If they win, they get 2x. If they lose, they are bankrupt.
  *   **Reveal:** Roll die. Distribute envelopes to verify the count (show that 1 or 10 cabins actually existed).

  **00:55 – 01:15: The Debrief & Naming**
  *   Reveal the names: **Self-Sampling Assumption (SSA)** and **Self-Indication Assumption (SIA)**.
  *   Map the rounds:
      *   Round 1 (Cabin #1): SSA = Doomsday Argument logic (I am early/low number). SIA = Existence is evidence.
      *   Round 2 (Ref Class): SSA is fragile (depends on how you define 'You'). SIA is robust (depends only on total observers).
      *   Round 3 (Presumptuous): SIA allows you to reject empirical hypotheses (Small) purely because they contain fewer observers.
  *   Discuss the cost: SIA lets you know the size of the universe without looking out the window. SSA makes your location depend on the total population.

  ---

  ### 3. The Probability Ledger (For the Whiteboard)

  *Draw this table before class. Fill in the "Odds" columns after each round.*

  | Round | Info Given | Reference Class | "Rule A" Odds (SSA) | "Rule B" Odds (SIA) | Actual Outcome |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | "I am Cabin #1" | Passengers | **1 : 10 (Small)** | **10 : 1 (Large)** | [Die Result] |
  | **2A** | "I am a Passenger" | Passengers | **1 : 1 (Even)** | **10 : 1 (Large)** | [Die Result] |
  | **2B** | "I am a Passenger" | Seminar Students | **10 : 1 (Large)** | **10 : 1 (Large)** | [Die Result] |
  | **3** | "I Exist" | All Possible Obs. | **1 : 1 (Prior)** | **10 : 1 (Large)** | [Die Result] |

  ---

  ### 4. Troubleshooting: What Will Go Wrong

  1.  **The "Water" Boredom:** In the Small Hypothesis (1 Cabin), 11 students get "Water" cards and cannot bet in Rounds 1 & 2. They will disengage.
      *   *Recovery:* Assign "Water" students the role of **Auditors**. They count the chips and verify the payouts. They are still "in the room" epistemically, just not "on the ferry."
  2.  **Confusing Priors with Posteriors:** Students will argue, "But the die is 50/50!"
      *   *Recovery:* Point to the Ledger. "The die is the Prior. Your card is the Evidence. We are calculating the Posterior. If you think the Posterior should equal the Prior, you are arguing for a specific anthropic rule (SSA with specific Ref Class), not math."
  3.  **Collusion:** Students will whisper, "I got Cabin 5, what did you get?"
      *   *Recovery:* Enforce the Silence Rule strictly. If caught, that student's chips are frozen for the round. The epistemic isolation is necessary for the "I am an observer" feeling.
  4.  **The Presumptuous Loss:** If the Philosopher bets Large (SIA) and the Die rolls Small, they lose everything and may feel the theory is "disproven."
      *   *Recovery:* Remind them: "SIA doesn't guarantee truth; it guarantees rational betting odds. A rational bettor can lose. If you bet 10:1 on a horse and it loses, was the bet irrational? No."

  ---

  ### 5. Limitations: What the Game Cannot Reproduce

  **The "Hard Problem" of Indexicality.**
  In this game, "You" are a pre-existing student assigned a card. In real anthropic reasoning (e.g., Doomsday, Sleeping Beauty), "You" are the *subject* whose existence is in question. The game simulates *sampling* from a population, but it cannot simulate the metaphysical weight of *coming into existence*.
  In Round 3, the Philosopher bets on existence counts, but they *already exist* in the classroom. They are pretending to not know if they exist. This is a fiction. In reality, the Presumptuous Philosopher argument claims that your actual existence *right now* rules out hypotheses where you wouldn't exist. The game forces them to bet on an external die roll, whereas the real philosophical stakes are about whether the die roll *created* them. You must assert this distinction verbally: "In the game, you were always here. In the Doomsday Argument, the hypothesis determines whether 'you' are in the reference class at all."

  ### 6. Mathematical Verification (For Your Eyes)

  **Round 1 (Cabin #1):**
  *   $P(S) = P(L) = 0.5$.
  *   $N_S = 1, N_L = 10$.
  *   **SIA:** $P(L|C1) = \frac{P(C1|L)P(L)}{P(C1|L)P(L) + P(C1|S)P(S)}$.
      *   SIA treats $P(C1|H)$ as proportional to $N_H$. So $P(C1|L) \propto 10$, $P(C1|S) \propto 1$.
      *   $P(L|C1) = \frac{10 \times 0.5}{10 \times 0.5 + 1 \times 0.5} = \frac{5}{5.5} = 10/11$. **(Bet Large)**
  *   **SSA:** $P(C1|H)$ is probability of sampling *this* observer from reference class (Passengers).
      *   $P(C1|S) = 1/1 = 1$.
      *   $P(C1|L) = 1/10$.
      *   $P(L|C1) = \frac{(1/10) \times 0.5}{(1/10) \times 0.5 + 1 \times 0.5} = \frac{0.05}{0.55} = 1/11$. **(Bet Small)**
  *   **Divergence Confirmed.**

  **Round 2 (Passenger Info):**
  *   **SIA:** Proportional to $N_H$. Odds remain 10:1 Large. **(Stable)**
  *   **SSA (Ref=Pass):**
      *   $P(Pass|S) = 1$ (If Small, the 1 passenger is definitely a passenger).
      *   $P(Pass|L) = 1$ (If Large, the 10 passengers are definitely passengers).
      *   Likelihood Ratio 1:1. Posterior = Prior = 50/50. **(Shifted from 1/11)**
  *   **SSA (Ref=Seminar):**
      *   $P(Pass|S) = 1/12$ (1 passenger out of 12 students).
      *   $P(Pass|L) = 10/12$ (10 passengers out of 12 students).
      *   Likelihood Ratio 1:10. Posterior = 10/11 Large. **(Shifted from 1/11)**
  *   **Shift Confirmed.**

  **Round 3 (Presumptuous):**
  *   SIA dictates betting 10:1 on Large before any evidence.
  *   If Small wins (Prob 0.5), Philosopher loses.
  *   This demonstrates the "Presumptuous" risk: SIA allows high confidence on empirical matters (how many cabins exist) based solely on observer counts.

  This mechanism is robust, fits the time, and forces the exact epistemic collisions you requested.
