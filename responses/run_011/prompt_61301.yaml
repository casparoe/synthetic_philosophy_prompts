answer: |-
  You should let the paragraph stand unchanged, because correcting a foundational autobiographical memory in a celebratory context yields no epistemic gain while guaranteeing relational harm.

  This is not a factual disagreement where two agents weigh public evidence differently; it is a conflict between archival truth and narrative truth. Your sister's evidence is phenomenological (qualia, sensory detail), while yours is documentary (leases, photos). In forecasting, evidence is external and scoring is immediate, creating a feedback loop that penalizes stubbornness. Here, there is no feedback loop—you cannot return to Marlow Street to check—and the stakes are identity-based rather than accuracy-based. Your sister's memory is woven into her self-concept as a nine-year-old; updating it requires not just changing a fact, but excising a part of her childhood history. Your techniques misfire because they assume the goal is accuracy, whereas the goal here, for her, is coherence.

  Both of you are irrational by Bayesian standards, but rational by psychological standards. You admit your belief preceded the lease evidence; she treats her memory as self-justifying. Neither of you is obliged to lower confidence in the *content* of the memory, because neither of you has access to the ground truth, but both of you are obliged to lower confidence in the *reliability* of your respective memory mechanisms. A belief properly beyond the reach of evidence is one grounded in direct phenomenological experience (e.g., "I feel pain"); a belief defended badly is one grounded in ideology where evidence should count but doesn't. Her claim sits on the boundary: it feels like phenomenology to her, but looks like confabulation to you. The distinction is that her "evidence" is internal and inaccessible to you, whereas your evidence is external and dismissible by her.

  The question has a truth value—either there was a dog or there was not—but it lacks epistemic resolvability for you two. It is not true for her and false for you; it is binary and unknown. Vet records could theoretically settle it, but even those are fallible archival data. The lack of resolution does not negate realism; it merely highlights the limits of your access to the past.

  The epistemic case for allowing the paragraph is that the book is a record of family perspective, not a court exhibit. By including her account, you preserve the data point of her memory without endorsing its factual accuracy. To remove it is to privilege your archival evidence over her lived experience, despite your own admission that your belief is similarly immune to update. Acknowledging the discrepancy silently maintains the integrity of the archive (your knowledge) while respecting the integrity of the narrator (her experience). In a forecasting group, the goal is calibration; in a family history, the goal is continuity. Correcting her serves the former at the expense of the latter, and since you cannot prove her wrong without doubt, the cost-benefit analysis favors cohesion.
