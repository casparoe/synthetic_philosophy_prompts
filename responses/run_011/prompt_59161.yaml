      *   *Check:* The ending. *Correction:* Ensure I specify what evidence would change my mind on the specific claims.

  6.  **Final Polish:** Check against the "blunt rather than balanced" instruction. Cut hedging language. (e.g., instead of "It could be argued," say "It fails.")

  *(Self-Correction on Part 4)*: The prompt asks what it tells us that survival scoring stayed. I need to be careful not to say survival is neutral. It's a welfarist metric. The fact it stayed suggests the hospital accepted the welfarist goal but rejected the ableist *proxies*.

  *(Self-Correction on Part 3)*: The user suspects the objections were relational. I need to confirm this. The ADA arguments are indeed about discrimination and status, not necessarily about "capabilities" in the Sen sense, though they overlap. I should validate the user's suspicion but distinguish "Relational Equality" from "Capabilities."

  *(Final check on the "Change my mind" section)*: Needs to be specific. Not just "new data," but *what kind* of data.

