          *   Implication: The debate wasn't "Equality of What?" but "Equality of Status." The "What" (survival) was secondary to the "Who" (who is deemed expendable).
      *   *Part 4 (Turning it Around):*
          *   Wellbeing was embarrassed (had to hide the QoL judgments).
          *   Relational/Status anticipated the objection (stigma).
          *   Capabilities had nothing to say (too abstract).
          *   The Revisions: Keeping survival, removing disability exclusions. This implies the metric (survival) was viewed as "clinical/neutral" while the exclusions were "moral/legal."
          *   Conclusion: The dispute *was* about the metric, but specifically about the *proxy variables* within the metric. Survival is a proxy for welfare. Disability was a proxy for survival. Removing the disability proxy fixed the legal liability, not the philosophical tension.
      *   *Meta-Reflection:*
          *   Most loosely held: The Resource view's applicability to *acute* triage.
          *   What would change my mind: Evidence that the committees explicitly discussed "status" rather than "liability."
          *   Where I might be wrong: Reconstructing the "Resource" view. In crisis, resources are scarce, so Dworkin's *ex-ante* insurance doesn't apply *ex-post*.

  4.  **Refining the Tone:**
      *   Avoid academic fluff.
      *   Speak to the clinician's reality.
