  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific question about Capabilities and indivisible goods? *Correction:* Make sure to explicitly state that Sen's framework is incomplete by design and cannot resolve a tragic choice without external input.
