answer: |-
  You are right to suspect that the scoring sheet was a philosophical document disguised as a clinical one. It was not neutral. It was a committed wager on one specific theory of value, dressed in SOFA scores and creatinine levels.

  Here is the test of your conviction.

  ### 1. Mapping the Episode: Wellbeing, Resources, Capabilities

  **The Welfarist View (Wellbeing)**
  *   **The Metric:** Maximize aggregate welfare, typically operationalized as QALYs (Quality-Adjusted Life Years) or simply life-years saved.
  *   **The Ranking:** Rank patients by predicted survival probability and post-discharge life expectancy.
  *   **Two Patients, One Ventilator:** Patient A (70 years, 50% survival chance) vs. Patient B (40 years, 50% survival chance). The metric commands you to intubate Patient B. The "life-cycle" principle included in many protocols is pure welfarism: it prioritizes the person with more potential welfare units to consume.
  *   **The Silence:** It is silent on the *moral cost to the agent*. It treats the therapist as a utility calculator, not a moral actor. It also cannot account for the *expressive harm* of the calculation itself. It assumes the value of a life is a function of its duration and quality, not its inherent status.
  *   **Verdict:** This is what your committee built. The scoring sheet is a welfarist engine.

  **The Resource View (Dworkin)**
  *   **The Metric:** Equal share of external resources, sensitive to individual responsibility and endowment.
  *   **The Ranking:** In a scarcity crisis, strict resource egalitarianism struggles. It generally prefers a lottery (equal opportunity for the resource) if needs are comparable, because the resource (the vent) is external and should be shared equally *ex-ante*.
  *   **Two Patients, One Ventilator:** If both need the vent to live, a strict resource view might demand a coin toss. To prioritize based on "years of life" is to say one person's claim on the common resource is stronger because of their internal endowment (longevity), which violates the separation of person and circumstance.
  *   **The Silence:** It is silent on *efficiency*. Resource egalitarianism is designed for distributive justice over a lifetime, not triage in an ER. It has no mechanism to justify "wasting" a resource on a patient likely to die quickly, because the resource is not *theirs* to waste, but it also refuses to judge the *value* of the life saved.
  *   **Verdict:** The scoring sheet violated this view by using internal endowments (prognosis) to determine external allocation.

  **The Capability Approach (Sen/Nussbaum)**
  *   **The Metric:** The expansion of human functionings (what people are able to do and be).
  *   **The Ranking:** It does not rank. It assesses whether the arrangement allows individuals to maintain central capabilities (life, health, bodily integrity).
  *   **Two Patients, One Ventilator:** **This is a category error.** The capability approach was explicitly constructed as a space for evaluating social arrangements and development, not as a decision procedure for tragic choices between individuals. Sen insists on "incompleteness" to allow for democratic reasoning. To ask it to solve the "one vent, two patients" problem is to ask a map to drive the car.
  *   **The Silence:** It is silent on *trade-offs*. It can tell you that denying the vent removes the capability to live, but it cannot tell you which capability loss is worse when both are death. It lacks a currency of comparison for zero-sum games.
  *   **Verdict:** You cannot run a triage protocol on capabilities. It offers a critique of the scoring sheet (does this arrangement reduce disabled people to mere biological existence?), but it offers no algorithm to replace it.

  ### 2. The Resource View and the Insurance Market

  You asked to take the resource view seriously. Here is the stress test.

  In Dworkin's hypothetical insurance market, bidders do not know their health status. They are asked: *How much of your initial wealth would you spend to insure against needing expensive care or having a shorter life?*

  *   **What they insure against:** They insure against the *cost* of maintaining a life, not the *quality* of the life itself. Dworkin separates "endowments" (internal health) from "resources" (money/tech). The goal is to compensate for the cost of the handicap so the person can pursue their own conception of the good.
  *   **The Self-Rated QoL Finding:** This finding (that disabled people rate their QoL as high as non-disabled people) devastates the Welfarist metric. Welfarism assumes disability = low welfare. If the data says otherwise, the Welfarist calculation is empirically false.
  *   **Does it damage the Resource View?** No. In fact, the Resource View is built to absorb this. Dworkin argues we should not compensate people for "expensive tastes" or low welfare *per se*, but for the lack of resources to achieve normal functioning. If a disabled person says, "My life is good, but I need a ventilator to keep it going," the Resource View says, "You are owed the ventilator as a resource to maintain your agency," regardless of whether an able-bodied person thinks that life is "worth it."
  *   **The Failure in Triage:** However, in the ICU, we are not distributing money for accommodation; we are distributing a scarce life-saving good. The insurance market works *ex-ante* (before the crisis). Triage is *ex-post*. Dworkin's model collapses here because you cannot buy insurance when the hospital is full. The Resource View absorbs the QoL data better philosophically, but it offers no solution to the scarcity problem other than "you should have built more ventilators."

  ### 3. Were the Objections Capability Objections?

  Your suspicion is correct. The objections filed by disability rights organizations were not Capability objections; they were **Relational Equality** objections.

  *   **Capability vs. Relation:** A Capability objection would argue, "This protocol reduces the functioning of disabled people." A Relational objection argues, "This protocol expresses that disabled people are of lesser worth."
  *   **The Evidence:** The complaints cited the ADA and Section 504. They focused on *discrimination*, *stigma*, and *devaluation*. They argued that using "quality of life" judgments based on disability status constitutes unequal standing under the law. This is Elizabeth Anderson's territory, not Sen's. It is about who counts as an equal member of the community, not about how much welfare they generate.
  *   **Why Capability Vocabulary Failed:** You didn't hear "capabilities" in the room because capabilities are too soft for a legal fight. "I have a right to not be stigmatized" is a legal claim. "I have a right to expand my functionings" is a philosophical claim.
  *   **Implication:** If the objections were relational, the episode was never about "Equality of *What*" (welfare vs. resources). It was about **Equality of Status**. The scoring sheet wasn't just miscalculating value; it was enacting a hierarchy of citizenship. The dispute was not about the metric's accuracy, but about its *authority* to judge who is expendable.

  ### 4. Turning the Analysis Around

  *   **Which metric anticipated the objection?** Relational Equality. It predicted that judging the worth of lives would produce stigma and civil rights violations.
  *   **Which was embarrassed?** Welfarism. It had to retreat. It could not defend the claim that a disabled life is objectively worth fewer resources without running afoul of civil rights law.
  *   **Which had nothing to say?** Capabilities. It offered no triage alternative.
  *   **The Revisions:** The survival scoring stayed; the categorical exclusions went.
      *   **What this tells us:** The dispute was *not* about the metric (Welfarism). It was about the *proxies*. The hospitals conceded that *disability* is a bad proxy for *survival*, but they kept *survival* as the goal.
      *   **The Deeper Truth:** This reveals that Welfarism is the default operating system of biomedicine. It is legally permissible to save the person most likely to survive (efficiency), but it is not legally permissible to say a disabled person is less likely to survive *because they are disabled*. The revision cleaned the bias out of the data entry, but it did not change the philosophical engine. The engine still maximizes life-years. It just stopped explicitly penalizing disability to do so.

  ### What Would Change My Mind

  I am holding the **Resource View (Part 2)** most loosely.

  *   **Why:** I have reconstructed Dworkin's *ex-ante* insurance model for an *ex-post* crisis. It is possible that a sophisticated Resource Egalitarian could argue that in a true emergency, the "resource" is the *chance* to live, and therefore a lottery is the only just distribution, regardless of survival probability. If you showed me a protocol that used a lottery for *all* patients with >10% survival chance, and it resulted in *better* community trust and *lower* moral injury among staff without collapsing the system, I would have to concede that Resource Egalitarianism is practically viable in triage, not just theoretically sound.
  *   **Where I might be wrong:** I may be underestimating the "silence" of the Capability Approach. Nussbaum argues for a threshold of capabilities below which no one should fall. If the ventilator is the threshold for the capability of "Life," a Capabilities theorist might argue that *any* patient above the threshold of futility has an equal claim, effectively mandating a lottery among viable patients. If you can point to literature where Capabilities theorists explicitly endorse lotteries in triage to avoid ranking lives, my claim of "category error" is too strong.
  *   **The Evidence:** Show me a hospital that adopted a "blind lottery" for vents among viable patients during the pandemic and was hailed as ethically superior by disability rights groups. If such a case exists, then the objection was indeed about the *metric* (ranking lives) rather than the *status* (disability bias). If no hospital dared do it, then my verdict stands: we are all Welfarists when the lights go out, and we only use Rights talk to clean up the mess.

  Your conviction holds. The scoring sheet was a Welfarist document that tried to hide its value judgments behind clinical data. The disability rights objections forced it to admit that "clinical data" regarding disability is often a mask for social prejudice. But they did not kill the Welfarist engine; they just forced it to change its fuel.
