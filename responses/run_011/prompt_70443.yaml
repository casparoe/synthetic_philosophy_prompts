          *   I am confident International Law duty to prosecute is generally interpreted as requiring criminal sanctions, making the student's claim controversial at best.
          *   So I don't need to list many "verify" items. I will list the International Law point as "Contested" rather than purely "Wrong" to be fair to the Pol Theory angle, but note it was presented as settled fact.

      *   **Refining the Grade for (c):** Is 3/8 too harsh? The student answers the normative question ("State may not waive"). They just get the positive law support wrong. The prompt asks: "Say whether... justify... Explain what your position implies about the constitutional challenge."
