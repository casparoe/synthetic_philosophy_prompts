      *   **Wait, one nuance on (a):** "Proportionality." The TRC Act did not explicitly list "proportionality" as a standalone criterion like "political objective." It was part of the interpretation of "political objective." Some scholars argue the TRC *imported* proportionality. In a closed book exam, "proportionality" is often taught as a key filter. I won't penalize this, but I will note it in the feedback as a nuance.

