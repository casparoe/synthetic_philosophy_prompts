          6.  Uncertain/Verify list.
          7.  Final Breakdown.
          8.  Margin Comments.

      *   **Wait, let's look at the "Verify" constraint:** "If there is any claim in the response whose status you are not confident about, list it separately at the end as something to verify rather than grading it either way."
