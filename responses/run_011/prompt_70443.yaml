          *   Do not rewrite or provide a model answer.
          *   Identify errors specifically (factual, conceptual, attribution, inference, empirical).
          *   Separate creditable analysis from defective support.
          *   Rank errors by severity.
          *   Note uncertain claims for verification.
          *   Provide a numeric breakdown and specific margin comments.
      *   **Input:** The prompt question and the student response.

  2.  **Analyze the Prompt Question:**
      *   **Topic:** Reckoning with past atrocity (South Africa vs. Argentina).
      *   **Part (a) [8 pts]:** Distinguish blanket amnesty vs. SA TRC conditional amnesty. Identify statutory criteria for applicant. Identify scope of what amnesty extinguished.
      *   **Part (b) [9 pts]:** Strongest argument for conditional truth-for-amnesty *on grounds of justice* (not just political compromise). State the most serious objection to that defence.
      *   **Part (c) [8 pts]:** Can a state waive/extinguish victim claims on their behalf? Justify. Explain implication for the constitutional challenge to SA amnesty provisions.

  3.  **Analyze the Student Response (Section by Section):**

      *   **Part (a): Distinction & Criteria**
          *   *Claim:* SA commission created by Promotion of National Unity and Reconciliation Act 1995, chaired by Tutu, 3 committees (HRV, R&R, Amnesty).
              *   *Assessment:* Factually correct.
          *   *Claim:* Amnesty not declared in advance; applied for individually.
              *   *Assessment:* Correct.
          *   *Claim:* Criteria: Full disclosure, political objective, proportionality.
              *   *Assessment:* "Proportionality" is tricky. The TRC Act required the act to be associated with a political objective and made full disclosure. Proportionality was a factor in *denying* amnesty (if grossly disproportionate to the objective), but strictly speaking, the criteria for *granting* were political objective + full disclosure. The student says "with a further check that the means used were proportionate." This is technically a condition for eligibility (gross disproportionality could disqualify), so it's acceptable in a closed-book context, though slightly imprecise.
          *   *Claim:* Scope: Criminal and civil liability extinguished.
              *   *Assessment:* Correct.
          *   *Claim:* Blanket amnesty example: Argentina. CONADEP was inquiry, not amnesty. Punto Final/Due Obedience were blanket amnesties.
              *   *Assessment:* Correct distinction. CONADEP wasn't an amnesty body. The laws came later.
          *   *Claim:* SA mandate 1960-1994.
              *   *Assessment:* Correct.
          *   *Overall (a):* Very strong. Accurate on the core legal distinctions.

      *   **Part (b): Justice Argument & Objection**
          *   *Claim:* Defence rests on goods unobtainable by trial (covert ops, no paper trail).
              *   *Assessment:* Standard argument (Dyzenhaus, Minow, etc.). Valid.
          *   *Claim:* Amnesty bought with disclosure -> acquired info (remains, fate of disappeared). Gain in justice (truth owed to victims).
              *   *Assessment:* Strong argument.
          *   *Claim:* Cost/Asymmetry: Amnesty only for those with something to trade; unverifiable crimes stay silent. Skewed account.
              *   *Assessment:* This is actually part of the *objection* or a limitation, but the student puts it in the defence section. It weakens the defence. However, it shows nuance.
          *   *Claim:* Objection: Victims pay for transition. State takes criminal process due to them.
              *   *Assessment:* Standard retributive justice objection (Penny, etc.). Valid.
          *   *Claim:* Counter-counter argument: Applicant bore cost (public shaming/confession). Confession functioned as punishment. Proportionality test calibrated severity.
              *   *Assessment:* This is a specific theoretical move (restorative justice as punitive). It's a valid theoretical stance, though controversial.
          *   *Claim:* "This also disposes of the objection from international law. The duty to prosecute bars blanket amnesties... a conditional amnesty... does not fall within that prohibition, so South Africa discharged its obligations without having to prosecute the amnestied."
              *   *Assessment:* **Major Legal Error.** International law (Geneva Conventions, CAT, ICCPR) generally requires prosecution for gross human rights violations. The TRC amnesty was highly controversial precisely because it *conflicted* with international law obligations to prosecute. The Constitutional Court (*Azapo*) acknowledged this tension but prioritized the constitutional imperative for transition. Saying SA "discharged its obligations without having to prosecute" is legally incorrect regarding international law standards at the time (and arguably now). It conflates domestic constitutional validity with international law compliance.
          *   *Overall (b):* Good philosophical argumentation, but the legal claim about international law is wrong.

      *   **Part (c): State Waiver & Constitutional Challenge**
          *   *Claim:* Victim's claim is their own, cannot be surrendered by state.
              *   *Assessment:* This is the student's normative position.
          *   *Claim:* "When the amnesty provisions were challenged as unconstitutional, the Constitutional Court upheld them, holding that the right to see the perpetrator punished belongs to the victim and cannot be waived on the victim's behalf..."
              *   *Assessment:* **Major Factual/Attribution Error.** The Constitutional Court (*Azapo v President of the Republic of South Africa*) upheld the amnesty provisions. However, it did *not* hold that the right to punishment belongs to the victim and cannot be waived. It held that the *post-apartheid constitution* authorized the amnesty in the interests of national unity, effectively overriding the ordinary right to judicial redress. The Court explicitly acknowledged that victims' rights were being compromised for a greater public good. The student claims the Court said the state *cannot* waive claims, but then says the Court *upheld* the waiver. This is a contradiction.
          *   *Claim:* "...which is why the legislature was required to pair the amnesty power with the Reparation and Rehabilitation Committee."
              *   *Assessment:* The Court did emphasize reparation as a *quid pro quo*, but the logic that the state "cannot waive" yet "upheld the waiver" is incoherent.
          *   *Claim:* "It also explains why victim participation was built into the amnesty stage: no amnesty could issue unless the identified victims had been heard and had signalled a willingness to forgive."
              *   *Assessment:* **Factual Error.** Victim participation was allowed (they could oppose amnesty), but victim *consent/forgiveness* was **not** a requirement for amnesty to be granted. Amnesty could be granted even if victims objected. This is a crucial distinction in the TRC process.
          *   *Overall (c):* The normative stance is fine, but the description of the Constitutional Court judgment and the TRC procedural rules is factually incorrect.

  4.  **Drafting the Grading & Justification:**

      *   **Tone:** Professional, precise, focused on the rubric.
