  **Candidate structures**
  1.  **Safety vs. Spectacle:** Owners adopt boring safety rules to protect players (responsibility), killing viewership. Lock-in via union contracts.
  2.  **Financial Parity:** Owners bypass salary caps to save struggling teams (responsibility), destroying competitive balance. Lock-in via player salary guarantees.
  3.  **Brand Integrity:** Owners sell controversial sponsorships to maintain solvency (responsibility), toxicizing the league. Lock-in via long-term ad contracts.

  I select **Structure 3**. It best isolates fiduciary duty from competitive advantage, ensuring the trap isn't just about winning games but about preserving the entity itself against external market forces.

  **The scenario**
  The National Grid League (NGL) faces a recession. A loophole, the "Emergency Liquidity Clause" (ELC), allows teams to sell exclusive in-game gambling integration if they prove financial distress. Owner A activates the ELC not to win, but to avoid bankruptcy, arguing a folded team voids the national TV contract, hurting everyone. Seeing A survive, Owners B through F activate the ELC to maintain revenue parity, fearing that if they fold, their franchises will be bought by conglomerates who will exploit the ELC without respecting league traditions.

  Within three seasons, 100% of teams use the ELC. Fans revolt; broadcast value halves. All owners agree the ELC is toxic and want to stop. However, ELC contracts are five-year minimums with 200% penalties for early exit. Furthermore, league bylaws require an 80% supermajority to ban loopholes, and even with unanimous consent, the first 20% of owners to exit face immediate insolvency before brand value recovers. They are trapped by their own successful stewardship.

  **Spec check**
  *   **Two paragraphs:** Yes.
  *   **No villains/cheating:** Owners act to save teams/league, not to cheat.
  *   **Full information:** All know the ELC is toxic; diagnosis is unanimous.
  *   **Responsibility engine:** Owners act to prevent franchise collapse/conglomerate takeover.
  *   **Not PD:** Defecting (using ELC) isn't dominant if others stop; it's dominant only due to *transition costs*. It's a Coordination Trap with Lock-In, not a payoff dominance trap.
  *   **Damage to owners:** Broadcast value halves; equity drops.
  *   **Ratchet:** Contract penalties + supermajority rule + insolvency risk during transition.
  *   **No sci-fi:** Standard contracts and bylaws.
  *   **Bend:** The "conglomerate" threat is slightly speculative, but grounded in real sports relocation risks.

  **Each actor's reasoning**
  *   **Owner A (First Mover):** "My city won't support higher taxes. If I fold, the league schedule breaks, voiding the TV deal for everyone. I am sacrificing brand purity to save the league structure. I am the responsible adult."
  *   **Owner B (Follower):** "If I don't match A's revenue, I fall behind. If I fall behind, I fold. If I fold, a predatory investor buys my team and uses the ELC aggressively. I must use the ELC to keep the franchise in responsible hands."
  *   **Owner C (Current Trapped):** "We all agree to ban the ELC. But my contract penalty is $50M. If I exit now, I go bankrupt before the brand recovers. I need everyone to exit simultaneously, but the cash-flow gap means the first movers die. I cannot be the martyr."

  **Where it breaks**
  The individual reasoning assumes **Solvency is additive**. Each owner believes, "If I stay solvent, the league stays solvent." This fails under composition. When *everyone* stays solvent via the ELC, the league product becomes toxic, destroying the revenue base that solvency depends on. The reasoning also assumes **Transition Symmetry**—that everyone can exit at the same speed. In reality, contractual stagger creates a sequence where early exiters are punished. This maps onto a **Coordination Failure with High Switching Costs**. It is not a Prisoner's Dilemma because owners prefer the cooperative outcome (No ELC) even when others defect, but they physically cannot reach it without external subsidy. The trap isn't incentive incompatibility; it's structural inertia.

  **The load-bearing feature**
  The **Asynchronous Transition Cost**. This is the single thing doing the work.
  1.  **Remove Contract Penalties:** If contracts are 1-year, owners coordinate exit next season. Trap vanishes.
  2.  **Remove Supermajority Rule:** If 51% can ban the ELC, a coalition exits together. Trap weakens significantly, though individual penalties remain.
  3.  **Remove Insolvency Risk:** If owners have infinite capital reserves, they can absorb the transition cost. Trap vanishes.
  The trap survives the removal of "reckless owners" because responsible owners are the ones trapping themselves. It survives the removal of "competitive advantage" because the motive is survival, not winning. The trap relies entirely on the fact that *moving back* is costlier than *staying put*, even when *staying put* is fatal long-term. It is a ratchet mechanism, not a payoff matrix.

  **The best case for racing**
  "The ELC didn't kill the league; it saved it from immediate contraction. Without it, five teams fold, the TV contract voids, and the NGL ceases to exist. Yes, brand value dropped 50%, but 50% of a living league is better than 100% of a defunct one. We are managing a controlled decline to preserve the asset for future generations. The critics want perfection; we chose survival. The trap isn't our responsibility; it's the market's. We held the line until the economy recovers, at which point we can buy out the contracts. Calling this irrational ignores the counterfactual: total collapse."

  **Bottom line**
  This is not Moloch proper (a Prisoner's Dilemma where competition forces bad outcomes). This is a **Lock-In Coordination Failure**. Moloch punishes virtue; this trap punishes *transition*. The actors are not competing themselves into hell; they have stewardessed themselves into a corner where the exit door is locked from the inside by their own prior contracts. It proves rational actors with full information can still fail if the *path* to the good equilibrium is individually catastrophic, regardless of collective desire.
