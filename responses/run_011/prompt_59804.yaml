      *   Counterfactual: "If X hadn't happened..."
      *   Interventionist: "If we change X..."
      *   In practice: "The disabled breaker caused the outage."
      *   Camp 1 justifies it by: "If enabled, no outage."
      *   Camp 2 justifies it by: "Enabling it prevents outage."
