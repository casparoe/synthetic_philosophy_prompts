answer: |-
  # The Causal Extraction Protocol (CEP)

  **Purpose:** To convert raw incident data into a scoped, defensible list of causal claims within 90 minutes.
  **Audience:** Engineering Review Board.
  **Philosophy:** Hybrid. We use counterfactuals to filter noise, and interventionism to select actionable levers.

  ## Glossary of Terms
  *   **Variable:** A specific state or event in the system (e.g., "Circuit Breaker Status," "Query Latency").
  *   **Counterfactual Dependence:** A relationship where, if the cause had not occurred, the effect would not have occurred (the "but-for" test).
  *   **Intervention:** A hypothetical change to a variable that is physically or procedurally possible to enact (a "lever" we can pull).
  *   **Absence:** A cause defined by something *not* happening or *not* being present (e.g., a missing alert).
  *   **Preemption:** When one potential cause triggers the outcome before another potential cause can.
  *   **Overdetermination:** When two or more independent causes are each sufficient to produce the outcome on their own.
  *   **Background Conditions:** Facts assumed to be stable during the analysis (e.g., "the laws of physics," "AWS us-east-1 exists").

  ---

  ## Part 1: The Decision Procedure

  ### Step 1: Variable Set Selection (Ontology)
  *   **Time:** 15 Minutes.
  *   **Input:** Incident Timeline, Architecture Diagrams.
  *   **Source:** Human Judgment (facilitated by Telemetry).
  *   **Automation Potential:** Low (requires semantic understanding of system boundaries).
  *   **Procedure:**
      1.  List every event and state change in the timeline.
      2.  Filter out **Background Conditions**. These are stable facts not under your control (e.g., "The internet existed," "The vendor shipped the hardware").
      3.  Filter out **Non-Intervenable Variables**. If you cannot imagine a procedure, code change, or config toggle that could alter this variable in the future, discard it (e.g., "The engineer was tired" is non-intervenable; "The shift length was 12 hours" is intervenable).
      4.  **Quality Criteria:** A variable set is "better" if it maximizes **Control Granularity**. "Service Down" is worse than "Health Check Endpoint 503." "Human Error" is worse than "Runbook Step 4 Ambiguity."
  *   **Output:** A finalized list of 5–15 candidate variables.
  *   **Sufficient Answer:** Consensus that every remaining variable represents a "knob" the organization can theoretically turn.

  ### Step 2: Counterfactual Screening (The "But-For" Filter)
  *   **Time:** 20 Minutes.
  *   **Input:** Candidate Variables, Telemetry Logs.
  *   **Source:** Telemetry + Human Judgment.
  *   **Automation Potential:** High (can be scripted against simulation data).
  *   **Procedure:**
      1.  For each variable, ask: "If this variable had remained in its pre-incident state, would the outage still have occurred at the same time and severity?"
      2.  If **Yes**: Demote to "Context."
      3.  If **No**: Promote to "Candidate Cause."
  *   **Output:** A shortlist of variables that pass the "but-for" test.
  *   **Sufficient Answer:** Binary Yes/No for each variable based on log replay or logical deduction.

  ### Step 3: Absence Promotion/Demotion Rule
  *   **Time:** 15 Minutes.
  *   **Input:** Candidate Causes (specifically those describing missing states).
  *   **Source:** Design Docs + Human Judgment.
  *   **Automation Potential:** Low.
  *   **Procedure:**
      1.  Identify candidates that are **Absences** (e.g., "Missing Rate Limit," "Disabled Breaker").
      2.  **Promote to Cause if:** There was a **Normative Expectation**. (Was there a design doc, standard, or prior state that established this safeguard *should* exist?)
      3.  **Demote to Context if:** The absence is **Infinite**. (Was this safeguard never conceived of? Is it impossible to implement?)
      4.  *Rationale:* This prevents the "explosion of causes." We do not list "No Rate Limit" if no one ever planned one. We do list "Disabled Breaker" if the standard is "Breakers On."
  *   **Output:** Validated list of Absence Causes.
  *   **Sufficient Answer:** Citation of the specific standard or design doc that created the expectation.

  ### Step 4: Structural Resolution (Preemption & Overdetermination)
  *   **Time:** 15 Minutes.
  *   **Input:** Validated Causes, Timeline.
  *   **Source:** Human Judgment.
  *   **Automation Potential:** Medium (pattern matching on timeline).
  *   **Procedure:**
      1.  **Check for Preemption:** Did Trigger A fire and cause the outage, while Trigger B was queued but blocked?
          *   *Rule:* Label A as **Proximate Cause**. Label B as **Latent Risk**. Do not list B as a cause of *this* incident, but flag it for remediation.
      2.  **Check for Overdetermination:** Did Trigger A and Trigger B occur independently, where either alone would have caused the outage?
          *   *Rule:* List **Both** as Causes. Note the redundancy.
  *   **Output:** Structured causal map distinguishing triggers from risks.
  *   **Sufficient Answer:** Clear designation of which trigger actually crossed the threshold first.

  ### Step 5: Scope & Confidence Assignment
  *   **Time:** 10 Minutes.
  *   **Input:** Structured Causal Map.
  *   **Source:** Human Judgment.
  *   **Automation Potential:** Low.
  *   **Procedure:**
      1.  For each cause, define the **Range of Conditions**. (Does this hold only for this service, or all Java services?)
      2.  Assign **Confidence**. (High: Telemetry proves it. Medium: Log correlation. Low: Human recollection only.)
  *   **Output:** Annotated causal claims.
  *   **Sufficient Answer:** Explicit statement of scope (e.g., "Specific to retry logic in Payments V2").

  ### Step 6: The Value Hand-off
  *   **Time:** 10 Minutes.
  *   **Input:** Annotated Causal Claims.
  *   **Source:** Human Judgment (Management).
  *   **Automation Potential:** None.
  *   **Procedure:**
      1.  Review claims that implicate **Policy**, **Budget**, or **Responsibility**.
      2.  **Stop Analysis.** The procedure cannot determine if a risk is "acceptable." It can only state that "Risk X exists."
      3.  Mark these claims as **Action Items for Leadership**.
  *   **Output:** List of decisions requiring management authority.
  *   **Sufficient Answer:** Acknowledgement that engineering analysis is complete and decision-making begins.

  ### Step 7: Drafting (Grammar Application)
  *   **Time:** 5 Minutes.
  *   **Input:** Final Causal Claims.
  *   **Source:** Scribe.
  *   **Automation Potential:** High (Template filling).
  *   **Procedure:** Apply the Fixed Sentence Grammar (see Part 2).
  *   **Output:** Final Postmortem Text.

  ---

  ## Part 2: Fixed Sentence Grammar

  Every causal claim in the published report must appear in two forms.

  ### 1. The Rigorous Version (For Engineers)
  > "A change in **[Variable]** from **[State A]** to **[State B]** caused **[Outcome]**, conditional on **[Background Conditions]**, verified by **[Intervention Logic]**. (Confidence: **[Level]**)"

  *   **Intervention Logic:** Must state what lever moves the variable (e.g., "Enabling the config flag").
  *   **Background Conditions:** What was held fixed (e.g., "Given the current retry policy").

  ### 2. The Plain Version (For Executives)
  > "**[Component]** failed because **[Mechanism]**, which **[Impact]**. We can prevent this by **[Intervention]**."

  ### Mandatory Attachments
  Every claim must be tagged with:
  1.  **Intervention:** The specific fix (config, code, process).
  2.  **Scope:** Where this applies (Service, Region, Team).
  3.  **Confidence:** High/Medium/Low.

  ---

  ## Part 3: Incident Runs

  ### Incident A: The Canary Storm
  **Raw Material:** Canary deploy, retry storm, disabled breaker (11 days), open ticket, batch job (scheduled +4hrs), failover doubled load.

  **Procedure Execution:**
  1.  **Variables:** Deploy State, Retry Logic, Breaker State, Batch Job Status, Failover Config.
  2.  **Screening:**
      *   Deploy: But-for cause? Yes.
      *   Breaker: But-for cause? Yes (if on, storm contained).
      *   Batch Job: But-for cause? No (would have happened later).
      *   Failover: But-for cause of *extension*? Yes.
  3.  **Absences:**
      *   Disabled Breaker: **Promote.** Normative expectation (breakers should be on). Ticket open confirms intent to restore.
      *   Missing Rate Limit: **Demote.** No evidence it was planned/expected.
  4.  **Structure:**
      *   Deploy vs. Batch Job: **Preemption.** Deploy fired first. Batch Job is Latent Risk.
      *   Failover: Contributing cause to duration, not onset.
  5.  **Hand-off:** The decision to allow canaries without automatic breaker enforcement is a policy risk.

  **Published Claims:**
  *   **Rigorous:** A change in **Circuit Breaker Status** from **Disabled** to **Enabled** (hypothetical) would have prevented **Service Outage**, conditional on **Current Retry Logic**, verified by **Config Toggle**. (Confidence: High)
  *   **Plain:** The **Payments Service** failed because **Upstream Retries overwhelmed the database**, which **Blocked all transactions**. We can prevent this by **Enforcing Circuit Breaker Standards before deploys**.
  *   **Note:** The Batch Job is listed as a "Latent Risk" in the appendix, not a cause.

  ### Incident B: The Double-Fault
  **Raw Material:** Expired Cert, Stale DNS, Muted Alert. Both Cert and DNS sufficient for outage. Alert muted during migration.

  **Procedure Execution:**
  1.  **Variables:** Cert Validity, DNS TTL, Alert Rule State.
  2.  **Screening:**
      *   Cert: But-for cause? Yes (sufficient).
      *   DNS: But-for cause? Yes (sufficient).
      *   Alert: But-for cause of *outage*? No. But-for cause of *duration*? Yes.
  3.  **Absences:**
      *   Muted Alert: **Promote** as cause of **Duration**, not Onset. Expectation was "Alerts Unmuted post-migration."
  4.  **Structure:**
      *   Cert vs. DNS: **Overdetermination.** Both independent and sufficient.
  5.  **Hand-off:** Process for unmuting alerts post-migration requires policy enforcement.

  **Published Claims:**
  *   **Rigorous:** A change in **TLS Certificate Validity** from **Expired** to **Valid** would have prevented **Service Outage**, conditional on **DNS State**, verified by **Renewal Automation**. (Confidence: High)
  *   **Rigorous:** A change in **DNS TTL** from **Pinned** to **Dynamic** would have prevented **Service Outage**, conditional on **Cert State**, verified by **DNS Config**. (Confidence: High)
  *   **Plain:** The **Internal Endpoint** failed because **Both the Security Certificate and DNS Record expired**, which **Blocked all Traffic**. We can prevent this by **Decoupling Certificate and DNS Lifecycles**.
  *   **Note:** Alert muting is listed as a cause of "Extended Detection Time," distinct from "Outage Cause."

  ### Incident C: The Latent Assumption
  **Raw Material:** Migration executed per plan. Plan approved by Board. Tooling standard for 2 years. Latent row-lock assumption. No test coverage.

  **Procedure Execution:**
  1.  **Variables:** Migration Execution, Plan Approval, Tooling Capability, Test Coverage.
  2.  **Screening:**
      *   Execution: But-for cause? No (followed plan).
      *   Plan: But-for cause? No (reasonable at time).
      *   Tooling: But-for cause? Yes (Tool lacked detection).
      *   Test Coverage: But-for cause? Yes (Test suite missed pattern).
  3.  **Absences:**
      *   Missing Test: **Promote.** Normative expectation (code requires tests).
      *   Tool Limitation: **Promote.** Normative expectation (tools should prevent data loss/downtime).
  4.  **Structure:**
      *   No preemption. Single chain of latent defects.
  5.  **Hand-off:** Tooling standard is owned by Architecture Board. This implicates a 2-year-old strategic decision.

  **Published Claims:**
  *   **Rigorous:** A change in **Migration Tooling Capability** from **Blind to Lock-Aware** would have prevented **Database Downtime**, conditional on **Current Schema**, verified by **Tool Upgrade**. (Confidence: Medium)
  *   **Plain:** The **Database** failed because **The Standard Migration Tool cannot detect row-lock conflicts**, which **Caused a Deadlock**. We can prevent this by **Replacing or Patching the Standard Tooling**.
  *   **Note:** This output is "annoying" because it bypasses the executing engineer and implicates the Architecture Board's past tool selection.

  ---

  ## Part 4: Critique & The Camp Dispute

  ### Where the Procedure Misfires
  1.  **Complex Adaptive Systems:** If the cause is an emergent property of 50 microservices interacting (a "phase shift"), Step 1 (Variable Selection) will fail. You cannot isolate variables cleanly. The procedure will force a false reductionism.
  2.  **Malice/Sabotage:** The procedure assumes rational actors and system faults. It does not handle adversarial intent well (Step 3 Absence Rule breaks down).
  3.  **Unknown Unknowns:** If the variable isn't in the telemetry or timeline (e.g., a cosmic bit flip not logged), Step 2 screens it out as "Context."

  ### What It Cannot Do
  *   **Assign Blame:** Step 6 explicitly hands this off. The procedure identifies *where* the system broke, not *who* is at fault.
  *   **Calculate ROI:** It tells you what *can* be fixed, not what *should* be fixed given budget constraints.
  *   **Predict the Future:** It explains the past. It does not guarantee the fix works in a new context (Scope limitation).

  ### Do The Two Camps Matter?
  **Verdict:** For 90% of incidents, **no.**
  Both camps produce the same English sentences ("The disabled breaker caused the outage").
  *   The **Counterfactualist** justifies it by saying: "If the breaker was on, the outage vanishes."
  *   The **Interventionist** justifies it by saying: "Turning the breaker on prevents the outage."
  *   **Result:** The text is identical.

  **The Residue (Where it matters):**
  The dispute only changes the text in **Absence** and **Overdetermination** cases.
  1.  **Absences:** A pure Counterfactualist might list "No Rate Limit" as a cause even if no one ever planned one (infinite causes). The Interventionist (via our Step 3 Rule) demotes this. *Our procedure sides with the Interventionist here to keep reports actionable.*
  2.  **Overdetermination:** A pure Counterfactualist struggles here (If A didn't happen, B still would have caused it, so A isn't a "but-for" cause). They might exclude one. The Interventionist accepts both (Intervening on A stops the outage in some worlds; intervening on B stops it in others). *Our procedure sides with the Interventionist to ensure both bugs get fixed.*

  **Conclusion:**
  Adopt the procedure as written. It uses Counterfactuals for speed (Step 2) but enforces Interventionist constraints for quality (Step 1 & 3). This satisfies the "Actionable" camp without losing the "Rigorous" camp, because the final text remains compatible with both philosophies. The only friction will be on Incident C, where the procedure forces the organization to admit that "Following the Process" is not a shield against "The Process Being Flawed."
