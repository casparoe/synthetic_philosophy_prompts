  2.  **Deconstruct the Philosophy (for internal use):**
      *   *Counterfactual Dependence:* "But-for" causation. If X hadn't happened, Y wouldn't have. Problem: Too many causes (the "explosion" problem).
      *   *Interventionism (Woodward-ish):* X causes Y if an intervention on X changes Y, holding other variables fixed, robustly across background conditions. Focuses on *levers* we can pull.
      *   *Synthesis for Engineering:* We need a hybrid. We need "But-for" to filter out irrelevant noise, but "Interventionism" to select *actionable* causes from the "But-for" set. The prompt asks to resolve the tension between these camps in a practical way.

  3.  **Drafting the Decision Procedure (The "Causal Extraction Protocol"):**

      *   *Step 1: Variable Selection (The Ontology).* This is crucial. We can't analyze everything.
          *   Input: Timeline, Telemetry.
          *   Judgment: Yes.
          *   Criteria: Controllability, Observability, Relevance to Service Level Objectives (SLOs).
      *   *Step 2: Event Reconstruction.* Build the graph.
      *   *Step 3: Counterfactual Screening (The "But-For" Filter).* Remove things that didn't matter.
      *   *Step 4: Interventional Promotions (The "Lever" Test).* This addresses the Absence problem.
      *   *Step 5: Structural Resolution (Preemption/Overdetermination).* Handle the tricky logic cases.
      *   *Step 6: Grammar & Scoping.* Writing it down.
      *   *Step 7: Value Hand-off.* Where engineering stops and management/policy starts.

  4.  **Addressing Specific Requirements:**

      *   *Absences:* How to treat a missing rate limit? It's a state, not an event. Rule: Promote if there was a *commitment* or *design expectation* for it to be present. Demote if it was never intended.
      *   *Preemption/Overdetermination:*
          *   Preemption: A caused it, B was waiting. A is the cause.
          *   Overdetermination: A and B both sufficient. Both are causes (usually), but note redundancy.
      *   *Grammar:* Needs to be strict. "Variable X at Value V caused Outcome O, conditional on Background B, via Intervention I."
      *   *Hand-off:* Blame, policy changes, budget allocation.

  5.  **Running the Incidents:**

      *   *Incident A (Canary + Retries + Disabled Breaker + Batch Job + Failover Issue):*
          *   Variables: Deploy state, Retry logic, Breaker state, Batch job status, Failover config.
          *   Absences: Disabled breaker (Promote? Yes, expected state).
          *   Preemption: Batch job would have killed it later. Deploy killed it now. Deploy is the *proximate* cause, Batch is a *latent vulnerability*.
          *   Failover: Made it worse. Contributing cause.
      *   *Incident B (Cert + DNS + Muted Alert):*
          *   Overdetermination: Cert OR DNS would have killed it. Both are causes.
          *   Absence: Muted alert. Did it *cause* the outage? No, it caused the *duration*. Distinguish Cause of Outage vs. Cause of Duration.
      *   *Incident C (Migration + Tooling + Board Decision):*
          *   This is the hard one. The migration was "correct" per plan. The tool was "standard."
          *   Variable set: If we stop at "Migration Execution," no cause found (it followed plan).
          *   If we expand to "Tool Selection," that's a cause.
          *   Hand-off: The procedure should flag this as a "Systemic Design Choice" requiring value judgment (is the tool actually bad, or was this a black swan?).

  6.  **Addressing the "Two Camps" Question:**
      *   Do they write different sentences?
      *   Counterfactualist: "If the breaker was on, outage avoided."
      *   Interventionist: "Turning on the breaker prevents outage."
      *   *Verdict:* In 90% of cases, they converge. The divergence happens in *Absences* (Counterfactualists love them, Interventionists require a lever) and *Overdetermination* (Counterfactualists struggle, Interventionists handle it better).
      *   *Conclusion:* The dispute is mostly theoretical noise for standard incidents, but critical for "Absence" and "Structural" cases.

  7.  **Refining the Output (Self-Correction/Review):**
      *   *Tone:* Professional, engineering-focused, direct. No academic fluff.
      *   *Definitions:* Ensure "Counterfactual," "Intervention," "Variable," "Preemption," "Overdetermination" are defined simply.
      *   *Automation:* Flag steps clearly.
      *   *Timebox:* Ensure the steps fit in 90 mins.
      *   *Incident C:* Make sure the output is "annoying" as requested (implicating the Board/Tooling).

  8.  **Final Polish:** Check against all 6 numbered requirements in the prompt.
      *   1. Steps/Inputs/Outputs/Automation? Yes.
      *   2. Variable Set Step? Yes.
      *   3. Absences Rule? Yes.
      *   4. Preemption/Overdetermination Rule? Yes.
      *   5. Grammar? Yes.
      *   6. Hand-off points? Yes.
      *   Run on A, B, C? Yes.
      *   Critique/Dispute Analysis? Yes.

      *(Self-Correction on Incident A)*: The batch job is a "Preemption" case? Actually, it's more like "Late Preemption." The deploy fired first. The batch job was a "threat" that didn't get to fire. The deploy is the cause.
      *(Self-Correction on Incident B)*: Overdetermination. Both Cert and DNS failed. Both are causes.
      *(Self-Correction on Incident C)*: The "Annoying" part. The procedure must force the variable set to include "Tooling Choice" if "Execution" yields no causal leverage.

      *(Refining the "Two Camps" analysis)*: Be honest. If the text looks the same, say it. The difference is in the *selection* of what makes the cut, not the grammar of the final sentence.

      *(Definitions)*: Keep them inline. "Counterfactual" = "What if". "Intervention" = "Knob we can turn".

      *(Formatting)*: Use bolding and lists for readability.

      *(Time Check)*: 90 minutes is tight. The procedure needs to be efficient. Emphasize that Variable Selection is the time-sink.

      *(Automation)*: Telemetry can do timeline reconstruction. Humans must do variable selection and value judgments.

      Let's assemble the response.

      *Structure:*
      1.  Introduction (Acknowledging the role).
      2.  Definitions (Glossary).
      3.  The Procedure (Steps 1-7).
      4.  The Grammar.
      5.  The Hand-off.
      6.  Incident Runs (A, B, C).
      7.  Critique & Camp Analysis.

      *Wait, one detail:* "Define any term of art the first time you use it." I will put a glossary at the start or define inline. Inline is better for flow, but a small glossary ensures clarity. I'll define inline within the steps to ensure context.

      *Wait, another detail:* "First substantive step should concern the choice of variable set." I need to make sure Step 1 is explicitly about this.

      *Wait, Incident C:* "I expect the procedure's output here to annoy people." I need to ensure the procedure doesn't allow them to stop at "Human Error" or "Unforeseen." It must push up the chain to the Tooling Decision.

      *Wait, Camp Dispute:* "Whether the dispute between the two camps actually changes the text." I need to be decisive here.

      Okay, ready to write.

      *Drafting the Absence Rule:*
      *   Promote if: There was a specific design expectation or prior state that established a norm (e.g., breaker usually on).
      *   Demote if: It was never intended to exist (e.g., no rate limit was ever planned).
      *   This bridges the gap. Counterfactualists say "If limit existed, no outage." Interventionists say "Can we add a limit?" The rule combines them: "Was it expected (Norm) + Can we add it (Intervention)?"

      *Drafting the Preemption Rule:*
