prompt: |-
  Setting: I got roped into a working group writing the eligibility rules for a public long-term care benefit. Fixed pot, claims decided case by case by caseworkers who only ever have what's on the form, and the enabling statute actually bars us from asking claimants certain questions about their past conduct. Half the group keeps reaching for the idea that you shouldn't be compensated for bad luck you brought on yourself, and nobody can say what would have to be true for that to become a workable rule. So before I read another paper on luck egalitarianism I want the spec.

  Write the desiderata: what any view that wants distributions to track responsibility but not luck has to deliver. For each one give me the case that motivates it, whether it's non-negotiable or just a camp preference, and whether it constrains the criterion of justice or the decision procedure an agency actually runs — and flag where you think those two come apart, because my hunch is that a lot of the standard objections (the motorcyclist who rides without a helmet, the person with a taste they never chose, the two identical lottery tickets) are really attacks on a procedure dressed up as attacks on a criterion.

  Cover at minimum: where the brute-luck/option-luck line can be drawn non-arbitrarily when the choices themselves are shaped by circumstances, and whether that regress is fatal or just needs a stopping point somewhere; ex ante versus ex post versions; equality of what (resources, welfare, access to advantage) and why that choice isn't seperate from the luck/choice question; and what the theory owes to the person it turns down — some publicity constraint on how the verdict can be stated to them without it being an insult.

  Then: which single requirement knocks out the most candidates, and is some subset jointly unsatisfiable once you add the information constraint? My suspicion is that genuinely tracking choice, not interrogating people about their tastes and risk beliefs, and never leaving anyone under a floor can't all be had at once — if that's right, say which one gives. Also tell me which things people in this literature demand that you think are bogus requirements, prejudices of one camp wearing a constraint costume, and whether scope questions (non-residents, future claimants, animals) belong on the list at all or are some other theory's business.

  End with two or three lines each on how Dworkin-style resource accounts, Cohen/Arneson-style access-to-advantage accounts, and the wholesale rejection of the project do against the list. Briefly tho — the criteria are the point.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user is part of a working group drafting eligibility rules for a public long-term care benefit.
      *   **Constraints:** Fixed pot, case-by-case caseworkers, limited information (only what's on the form), statutory bars on asking about past conduct.
      *   **Conflict:** Half the group wants to deny benefits for "self-inflicted bad luck" (responsibility-sensitive), but they can't define a workable rule.
      *   **Task:** Write the *desiderata* (requirements) for any theory that wants distributions to track responsibility but not luck.
      *   **Specific Requirements for the Output:**
          *   For each desideratum: Motivating case, Non-negotiable vs. Camp Preference, Constraint on Criterion vs. Decision Procedure, flagging where they come apart.
          *   Cover specific topics: Brute/Option luck line (regress problem), Ex Ante vs. Ex Post, Equality of What (resources/welfare/access), Publicity/Justification constraint.
          *   Identify the "killer constraint" (which one knocks out most candidates).
          *   Identify joint unsatisfiability (Information Constraint + Tracking Choice + Floor).
          *   Identify "bogus requirements" (prejudices disguised as constraints).
          *   Address scope questions (non-residents, etc.).
          *   Evaluate Dworkin, Cohen/Arneson, and Luck Egalitarian Rejectionists against the list (2-3 lines each).
      *   **Tone:** Professional, analytical, pragmatic (policy-focused), philosophically rigorous but accessible to a working group.

  2.  **Deconstruct the Desiderata:**
      *   I need to formulate specific criteria that a responsibility-tracking theory *must* meet to be viable in this specific administrative context.
      *   *Criterion 1: The Brute/Option Luck Boundary.* Needs to handle the "shaped by circumstances" regress.
      *   *Criterion 2: Temporal Perspective.* Ex Ante (risk) vs. Ex Post (outcome).
      *   *Criterion 3: The Currency of Equality.* Resources vs. Welfare vs. Access.
      *   *Criterion 4: Administrative Feasibility/Information.* The "caseworker constraint."
      *   *Criterion 5: Public Justification.* How to say "no" without insulting.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: Non-Arbitrary Cut-off.*
          *   Case: The smoker with addicted parents vs. the smoker with healthy parents.
          *   Status: Non-negotiable for coherence.
          *   Type: Criterion.
          *   Tension: Criterion says "trace responsibility," Procedure says "stop asking."

      *   *Desideratum 2: Ex Ante/Ex Post Consistency.*
          *   Case: The motorcyclist (helmet vs. no helmet) who gets hit vs. doesn't.
          *   Status: Camp preference (some want to punish bad outcomes, some bad risks).
          *   Type: Criterion.

      *   *Desideratum 3: The Currency.*
          *   Case: Expensive tastes (champagne vs. beer).
          *   Status: Non-negotiable (defines the metric).
          *   Type: Criterion.

      *   *Desideratum 4: Informational Privacy/Feasibility.*
          *   Case: The form constraint.
          *   Status: Non-negotiable (Statutory/Legal).
          *   Type: Procedure.
          *   Tension: This is where the theory dies. You can't track responsibility without info.

      *   *Desideratum 5: Public Justification.*
          *   Case: Telling someone "You chose this."
          *   Status: Non-negotiable (Dignity/Political Stability).
          *   Type: Procedure/Interface.

  4.  **Analyzing the "Killer Constraint" & Unsatisfiability:**
      *   The user suspects: Tracking Choice + No Interrogation + Safety Floor = Impossible.
      *   I agree. To track choice, you need info. If you can't ask (statute), you can't track. If you use proxies (smoking = irresponsible), you violate fairness (some smokers are addicted).
      *   Which gives? Usually, "Tracking Choice" gives way to "Administrative Feasibility" or "Floor." In public benefits, the Floor usually wins.

  5.  **Identifying "Bogus Requirements":**
      *   "Moral Desert" masquerading as responsibility. (Did they *deserve* it vs. did they *choose* it).
      *   "Perfect Knowledge." Expecting claimants to know actuarial risks.
      *   Scope creep (animals, non-residents). Keep it to the statutory mandate.

  6.  **Evaluating the Theories:**
      *   *Dworkin (Insurance/Resource):* Good on resources, bad on info requirements (hypothetical insurance is hard to administer).
      *   *Cohen/Arneson (Access to Advantage):* Good on welfare, terrible on admin (requires mind-reading tastes).
      *   *Rejectionists (Scheffler/Anderson):* They say the whole project is wrong. They pass the "dignity" test but fail the "group's goal" test.

  7.  **Refining the Output Structure:**
      *   Introduction: Acknowledge the bind.
      *   Section 1: The Desiderata Table/List (Case, Status, Type, Tension).
      *   Section 2: The Fatal Tension (Information vs. Accuracy).
      *   Section 3: Bogus Requirements & Scope.
      *   Section 4: Theory Scorecard.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Check:* Did I address the "regress" problem? Yes, under the Brute/Option Luck section.
      *   *Check:* Did I distinguish Criterion vs. Procedure? This is crucial for the user's hunch. I need to make sure I explicitly state where the *theory* works but the *agency* can't implement it.
      *   *Check:* Is the tone right? Needs to be sharp, not academic waffle. "Spec" style.
      *   *Check:* The user asked for "Two or three lines each" on the theories at the end. Keep it tight.

  9.  **Final Review against constraints:**
      *   Fixed pot? Mentioned in feasibility.
      *   Statutory bars? Central to the Information constraint.
      *   Luck Egalitarianism context? Implicit throughout.

      *(Self-Correction on the "Bogus" section)*: Be careful not to dismiss the group's moral intuitions entirely, but label the *implementation* of them as bogus if they require impossible info.
      *(Self-Correction on Scope)*: The user asked if scope belongs on the list. I should argue it doesn't belong in *this* spec, it belongs in the enabling statute.

      *(Final Polish)*: Ensure the distinction between "Criterion of Justice" (the moral truth) and "Decision Procedure" (the form/caseworker) is highlighted as the main source of failure.

  10. **Drafting the response.** (Proceeds to generate output based on these thoughts).
answer: |-
  Here is the specification sheet for responsibility-sensitive distribution, tailored to your administrative constraints.

  ### Part I: The Desiderata
  *What a responsibility-tracking theory must deliver to be viable in a public agency context.*

  | Desideratum | Motivating Case | Status | Constraint Type | The Gap (Criterion vs. Procedure) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Non-Arbitrary Cut-Off** | **The Shaped Preference:** A claimant smokes because their parents did (habit) vs. a claimant who smokes despite healthy parents (choice). Where does socialization end and agency begin? | **Non-Negotiable** (Coherence) | **Criterion** | **Fatal.** The criterion requires tracing causal history of preferences. The procedure (statutory bar) forbids asking about past conduct/upbringing. You cannot administer the criterion without violating the statute. |
  | **2. Ex Ante vs. Ex Post Consistency** | **The Motorcyclist:** Two riders skip helmets. One crashes (needs care), one doesn't. Do you penalize the *risk taken* (Ex Ante) or the *outcome suffered* (Ex Post)? | **Camp Preference** | **Criterion** | **High.** Ex Ante is fairer but requires knowing subjective risk assessment at the time. Ex Post is easier to see (they are injured) but punishes bad luck *after* a choice, which violates the "no compensation for bad luck" principle. |
  | **3. The Currency of Equality** | **Expensive Tastes:** Claimant A needs standard care. Claimant B needs the same care but has a cultivated intolerance to generic facilities. Do we equalize resources or welfare? | **Non-Negotiable** (Definition) | **Criterion** | **Medium.** If you choose Welfare (Cohen/Arneson), you must interrogate subjective satisfaction. If you choose Resources (Dworkin), you ignore that the same resource yields different care outcomes. Procedure favors Resources (easier to count), Criterion often demands Welfare. |
  | **4. Informational Feasibility** | **The Black Box:** The claimant says "I got sick." You cannot ask "Did you drink?" or "Did you save?" | **Non-Negotiable** (Legal/Practical) | **Procedure** | **Fatal.** This is the hard constraint. Any criterion requiring data not on the form is dead. This eliminates almost all nuanced responsibility metrics, forcing reliance on crude proxies (e.g., diagnosis codes) that misclassify responsibility. |
  | **5. Public Justification (Dignity)** | **The Verdict:** Telling a claimant: "We deny you because you brought this on yourself." | **Non-Negotiable** (Political/Dignity) | **Procedure** | **High.** Even if the criterion is met, the procedure must articulate the denial without moralizing. If the form says "Ineligible: Lifestyle Choice," it insults the claimant and invites litigation. The verdict must look neutral even if the logic is moral. |

  **Note on the Regress (Desideratum 1):** The regress (choices are shaped by prior circumstances, which are shaped by prior luck) is not fatal to the *theory*, but it is fatal to the *agency*. Theory can posit a "reasonable person" stopping point. Agency cannot, because determining what is "reasonable" for a specific claimant requires the very biographical inquiry the statute bars. You must pick a stopping point administratively (e.g., "age of majority"), but acknowledge this is a fiction, not a moral truth.

  ### Part II: The Fatal Tension & The Killer Constraint

  **The Impossible Trinity**
  You are correct: **Genuinely Tracking Choice + No Interrogation + Universal Floor** is jointly unsatisfiable.
  1.  **Tracking Choice** requires granular data on intent, risk perception, and alternatives.
  2.  **No Interrogation** (your statutory bar) strips that data away.
  3.  **Universal Floor** (political necessity) requires paying out when in doubt.

  **Which one gives?**
  **Tracking Choice** must give.
  In a private insurance market, you underwrite risk (track choice). In a public benefit with a fixed pot and information bars, you cannot distinguish "bad choice" from "bad luck" reliably enough to deny care without creating massive error costs (false positives). If you deny a claimant based on a proxy (e.g., "liver disease implies alcoholism"), you violate Desideratum 1 (Non-Arbitrary Cut-Off) and Desideratum 5 (Public Justification).

  **The Killer Constraint:** **Informational Feasibility (Desideratum 4).**
  This knocks out the most candidates. Most luck egalitarian theories assume an omniscient observer who can distinguish brute luck from option luck. Your caseworkers are not omniscient; they are form-processors. Any theory that requires knowledge of the claimant's internal state (did they *really* choose this?) is administratively void.

  ### Part III: Bogus Requirements & Scope

  **Bogus Requirements (Prejudices in Constraint Clothing)**
  1.  **"Moral Desert" masquerading as Responsibility:** The group likely wants to punish "immoral" behavior (drug use, gambling). This is not responsibility-tracking; it is retributivism. Responsibility requires *capacity* and *option*, not moral purity. A requirement that benefits track "virtue" is bogus.
  2.  **"Perfect Rationality":** Assuming that because a claimant *could* have theoretically chosen otherwise, they *are* responsible. This ignores cognitive load, stress, and bounded rationality. Demanding the theory treat all voluntary acts as equally informed is a bogus constraint.
  3.  **Scope Creep:** Questions about non-residents, future claimants, or animals do not belong on this list. Those are questions for the *enabling statute* or a different policy sphere. Your working group's mandate is the eligibility of *current applicants* under *current law*. Adding these dilutes the spec and allows the group to dodge the hard trade-offs facing the actual claimants.

  ### Part IV: Theory Scorecard

  **Dworkin-Style Resource Accounts**
  *Performance:* Fails on Information.
  *Critique:* Dworkin's "hypothetical insurance" market is a brilliant criterion for distinguishing luck from choice, but it is impossible to administer. Caseworkers cannot calculate what insurance a claimant *would have bought* at age 25. It collapses into crude resource proxies that violate the Non-Arbitrary Cut-Off.

  **Cohen/Arneson-Style Access-to-Advantage**
  *Performance:* Fails on Public Justification & Information.
  *Critique:* By focusing on welfare and expensive tastes, this requires deep interrogation of the claimant's psychology to verify if a disadvantage was "unchosen." This violates the statutory bar on past conduct and forces caseworkers into the insulting position of judging the legitimacy of a claimant's preferences.

  **Wholesale Rejection (Anderson/Scheffler)**
  *Performance:* Passes Procedure, Fails Group Mandate.
  *Critique:* Luck egalitarianism's critics argue we should guarantee a sufficient minimum regardless of choice. This satisfies Information, Floor, and Dignity constraints perfectly. However, it explicitly rejects the working group's core instruction to "track responsibility." It solves the admin problem by deleting the moral problem you were asked to solve.
