      *   *Aggregator:* 5 deaths > 1 death. Save 5.
      *   *Pairwise Comparison (Scanlon/Otsuka):* This is the tricky one. Standard Scanlonian contractualism often *allows* aggregation in rescue cases (the "Numbers Count" reply to Taurek). However, the prompt asks for the "numbers skeptic mode that Otsuka presses." Otsuka (e.g., in "Rights, Incompatibility, and Moral Duties" or discussions of Scanlon) argues for pairwise comparison where you match the strongest complaint against the strongest complaint.
      *   *The Crux:* To get the Pairwise view to save the *One* over the *Five*, the One's individual harm must be *significantly worse* than each of the Five's individual harms.
