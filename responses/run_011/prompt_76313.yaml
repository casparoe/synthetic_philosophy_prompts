  A radiation containment unit fails. You control the single emergency shield. It can cover either Zone A or Zone B. Zone A holds one worker; without the shield, she receives a lethal dose and dies immediately, losing forty years of expected life. Zone B holds five workers; without the shield, they receive a high dose that shortens each of their lifespans by exactly ten years. They survive, but with significantly reduced health. You know these outcomes with certainty. You are a passerby with no prior connection to the workers. You must choose Zone A or Zone B. There is no time for anything else.

  ### Walkthrough

  **1. Taurek-Style Non-Aggregation (The Class View)**
  *   **Verdict:** Flip a coin.
  *   **Steps:** (1) Identify the parties: one person versus five persons. (2) Apply the constraint: numbers of people do not justify overriding individual claims. (3) Since you cannot sum the five to outweigh the one, and you owe equal concern to each person, you randomize the choice to respect their equal standing.
  *   **Best Attack:** "You are ignoring the total amount of life lost. Randomization guarantees more suffering than necessary."

  **2. Total-Welfare Aggregation**
  *   **Verdict:** Save the Five (Zone B).
  *   **Steps:** (1) Quantify the harm: 40 life-years lost (One) vs. 50 life-years lost (Five). (2) Apply the principle: minimize total harm/maximize total welfare. (3) Since 50 > 40, the greater good requires saving the group.
  *   **Best Attack:** "You are sacrificing the individual with the worst fate for the sake of the aggregate. You treat people as containers for value, not distinct persons."

  **3. Strict Pairwise Comparison (Otsuka/Scanlonian)**
  *   **Verdict:** Save the One (Zone A).
  *   **Steps:** (1) Compare complaints individually: The One's complaint (loss of 40 years/death) is stronger than *each* of the Five's complaints (loss of 10 years). (2) Apply the constraint: you cannot sum the Five's weaker complaints to outweigh the One's stronger complaint. (3) The strongest individual complaint dictates the choice.
  *   **Best Attack:** "You are letting five people suffer significantly to save one. If there were fifty people, would you still save the one? Your principle ignores the moral weight of numbers entirely."

  ### Analysis

  **Feature Doing the Work:**
  The split between **ordinal individual severity** (Pairwise) and **cardinal total sum** (Aggregator). The case forces a divergence because the One's harm is ordinally superior (worse for her than any single one of them), but the Five's harms are cardinally superior (worse in total). Taurek falls out because this specific "classroom Taurek" refuses to weigh severity across persons heavily enough to override the 1-vs-5 person count, defaulting to randomization.

  **Dial-Test Stability:**
  *   **Pairwise:** Stable. Whether the group is 2, 5, or 50, the One's complaint (40 years) remains stronger than *each* individual's complaint (10 years). The verdict never flips.
  *   **Aggregator:** Unstable. If the group size drops to 3 (30 years < 40 years), the Aggregator saves the One. The flip point is between 3 and 4 workers.
  *   **Taurek:** Stable. The coin flip remains the default regardless of group size, as numbers never count.

  **Losing Theorist Attacks:**
  *   **Aggregator:** Claims the case rigs the "obviousness" of the sum. They argue that 50 years vs 40 years is a trivial mathematical difference that shouldn't override the *type* of harm (death vs. shortened life), but admit that strictly speaking, the math holds.
  *   **Taurekian:** Claims the case smuggles aggregation into the Pairwise view. By weighing "40 years" against "10 years," the Pairwise theorist is comparing magnitudes across persons, which Taurek argues is just aggregation by another name. This is a genuine philosophical disagreement, not a design flaw.

