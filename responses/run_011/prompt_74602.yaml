  # DECISION TREE: LEGISLATIVE SELECTION PARAMETERS

  **1. Does the lot determine the final officeholder directly?**
  *   **No:** Go to Node 2.
  *   **Yes:** Go to Node 3.

  **2. Do the lot-selected intermediaries vote freely?**
  *   **Yes:** LEAF 1 (Venetian Procedure).
  *   **No:** LEAF 2 (Unoccupied: Indirect Sortition with Bound Mandate).

  **3. Is the pool for the lot drawn from all citizens or a restricted subset?**
  *   **Restricted:** Go to Node 4.
  *   **Universal:** Go to Node 9.

  **4. Is the subset formed by voluntary opt-in or prior electoral screening?**
  *   **Voluntary:** Go to Node 5.
  *   **Screening:** Go to Node 8.

  **5. Must members pass a competence examination before taking office?**
  *   **Yes:** Go to Node 6.
  *   **No:** Go to Node 7.

  **6. Are military commands excepted from this method and filled by vote?**
  *   **Yes:** LEAF 3 (Athenian Arrangement).
  *   **No:** LEAF 4 (Unoccupied: Modified Athenian).

  **7. What evidence would prove the reform failed: demographic mismatch or poor policy outcomes?**
  *   **Demographic:** LEAF 5 (Unoccupied: Descriptive Sortition).
  *   **Policy:** LEAF 6 (Unoccupied: Epistemic Sortition).

  **8. Does the lot select the officeholder or a nominating committee?**
  *   **Officeholder:** LEAF 7 (Florentine Arrangement).
  *   **Committee:** LEAF 8 (Unoccupied: Sortition for Nomination).

  **9. Is service compelled by law or voluntary?**
  *   **Voluntary:** LEAF 9 (Unoccupied: Universal Voluntary Pool).
  *   **Compelled:** Go to Node 10.

  **10. Does the body hold full legislative power or only a suspensive veto?**
  *   **Veto:** Go to Node 11.
  *   **Full:** Go to Node 12.

  **11. Is the veto power held by a single officeholder or a chamber?**
  *   **Single:** LEAF 10 (Sortition Executive Veto).
  *   **Chamber:** LEAF 11 (Allotted Second Chamber).

  **12. Does the design make a political career impossible or merely irrelevant?**
  *   **Impossible:** LEAF 12 (Radical Sortition).
  *   **Irrelevant:** LEAF 13 (Modern Professionalized Sortition).

