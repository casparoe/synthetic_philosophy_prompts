  # AMBIGUITY FLAG

  **Leaves 12 and 13 (Radical vs. Modern Professionalized):**
  The tree separates these by the "Career Impact" node (Impossible vs. Irrelevant). However, in practice, a "one-term only" rule (Impossible) and a "short term with low pay" rule (Irrelevant) often produce identical behavioral outcomes: members do not return. The ambiguity costs a drafter the ability to distinguish between a design that *forbids* return (Radical) and one that *discourages* it (Modern). If the goal is strictly to break the political class, Leaf 12 is required; if the goal is to maintain a reserve of experienced citizens, Leaf 13 is preferable. The tree forces a choice that may be functionally moot.

  **Leaves 10 and 11 (Veto Single vs. Veto Chamber):**
  While separated by the "Veto Type" node, both rely on the same logic of negative power. The distinction is institutional scale, not selection principle. A drafter choosing between them is deciding on the *weight* of the veto, not the *method* of selection. The tree separates them to satisfy the requirement for contemporary proposals, but they share the same vulnerability: an elected legislature may simply ignore a sortition veto if the political cost is low.
