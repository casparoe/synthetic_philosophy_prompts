prompt: |-
  I run the grants committee for a small community foundation — we hand out about 40 checks a year, $2k to $15k each, to local projects. Five years ago it was 5 of us. Now it's 23, mostly because I kept recruiting people, on the theory that more votes means better decisions. Lately I've been doubting that.

  I keep a spreadsheet. For every vote we've ever taken I've recorded whether the project actually panned out two years later — finished what it said it would, still running, no scandal. Crude, I know, but it's something. Sorting by member, the picture is: 9 people are right about 70% of the time, 11 are right about 55%, and 3 are right about 40%. Those last three aren't dumb, they just flatly refuse one whole category — anything that looks like harm reduction, needle exchange, supervised use, that kind of thing — and vote no on it regardless of what's actually in the application.

  Two other things I can't work out.

  First, we all vote off the same packet. One part-time staffer writes a two-page summary of each application and that is literally all most members ever see. Only a handful of us have set foot at a project site in five years. So when her summary gets a project wrong, we all get it wrong in the same direction, together.

  Second, one of my better members admitted to me he sometimes votes against his own read on a project, because "my vote only counts when it's close, and if it's close, the others probably saw something I missed." I want to tell him that's backwards — vote what you actually think — but I couldnt come up with a reason that would convince him, and honestly part of me wonders if he's onto something.

  So: is the 23-person committee genuinely better than the old five, or have I been making it worse for five years? And what would you actually change — who's on it, how many, what they're shown, how they vote? I'm also tempted to stop doing yes/no votes and have everyone rank all the applications instead, if that helps. Don't give me generic committee hygiene stuff, I want to know whether the arithmetic of how I'm aggregating these votes is sound.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Situation:**
      *   **Role:** Chair of a grants committee for a small community foundation.
      *   **Scale:** ~40 grants/year, \$2k-\$15k each. Small scale, high impact locally.
      *   **History:** 5 years ago = 5 members. Now = 23 members.
      *   **Motivation for Growth:** Belief that "more votes = better decisions" (Condorcet's Jury Theorem intuition).
      *   **Data:** Tracks success rates (2-year follow-up).
          *   9 members: ~70% accuracy.
          *   11 members: ~55% accuracy.
          *   3 members: ~40% accuracy (biased against harm reduction).
      *   **Process:** One part-time staffer writes a 2-page summary. Most members *only* read this. Rarely visit sites.
      *   **Behavioral Issue:** One good member strategically votes against their judgment ("my vote only counts when it's close").
      *   **Questions:**
          1.  Is 23 better than 5?
          2.  What specific changes to make (membership, info, voting method)?
          3.  Is ranking better than yes/no?
          4.  Constraint: No generic committee hygiene; focus on the *arithmetic of aggregation*.

  2.  **Deconstruct the Core Problem (The Arithmetic):**
      *   *Condorcet's Jury Theorem (CJT):* If voters are independent and individually competent ($p > 0.5$), adding voters increases the probability of a correct majority decision.
      *   *Violation 1: Independence.* Everyone reads the *same* 2-page summary by one staffer. This creates high correlation. If the staffer is wrong, the group is wrong. This effectively reduces the "N" to something much smaller (mostly 1, plus some noise).
      *   *Violation 2: Competence.* 3 members have $p \approx 0.4$ (systematically biased). 11 members have $p \approx 0.55$ (barely better than chance). Only 9 are truly competent ($p \approx 0.7$).
      *   *Violation 3: Strategic Voting.* The member voting against their read introduces noise and reduces the signal of the "competent" voters.

  3.  **Evaluate "23 vs. 5":**
      *   **Old Committee (5 people):** Likely higher independence (maybe they knew the community better?), likely higher average competence (founders usually care more).
      *   **New Committee (23 people):**
          *   *Pros:* More diversity of thought *in theory*.
          *   *Cons:* High correlation (single info source), dilution of expert votes by low-competence votes, systematic bias from the 3 harm-reduction rejectors.
      *   **Verdict:** The arithmetic suggests the 23-person committee is likely *worse* than a well-structured 5-person committee, primarily due to the *information bottleneck* (correlation) and the *dilution of signal* (low competence voters).

  4.  **Address the Specific Questions:**

      *   **Q1: Is 23 better than 5?**
          *   Mathematically: No. The correlation coefficient among voters is too high (single staffer summary). The average competence is dragged down by the 11 mediocre and 3 biased voters.
          *   The "Wisdom of Crowds" requires independence. You have a "Herd of Sheep" following one shepherd (the staffer).

      *   **Q2: The Strategic Voter:**
          *   He is wrong. In a weighted voting system (which this effectively is, based on competence), voting against your signal reduces the aggregate accuracy.
          *   *Reasoning:* If he is a 70% voter, his "Yes" adds positive signal. If he votes "No" because he thinks it's close, he is canceling out his own expertise. Condorcet assumes honest voting. Strategic voting based on "pivotality" in a large group usually degrades truth-tracking in this context.

      *   **Q3: What to Change? (The Arithmetic Fixes)**
          *   *Membership:* 23 is too many for this grant size. It creates free-riding (why read deeply if 22 others vote?). Cut to 7-9. Keep the 70%ers. Remove the 40%ers (or recuse them from specific categories).
          *   *Information:* Break the correlation. Members need independent signals. Site visits, different summaries, or divided due diligence.
          *   *Voting Method:* Yes/No is okay for thresholding, but Ranking (Borda/Score) is better for budget allocation (knapsack problem). However, the input quality matters more than the aggregation method.

      *   **Q4: Ranking vs. Yes/No:**
          *   Ranking helps with budget constraints (40 checks, limited money). Yes/No can lead to too many winners or too few.
          *   But ranking garbage info is still garbage. Fix the info first.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Direct, analytical, respectful of the data they've collected (which is rare and valuable).
      *   *Key Concept:* **Conditional Independence.** This is the killer. The single staffer summary makes the votes correlated.
      *   *Key Concept:* **Signal-to-Noise Ratio.** The 3 biased members are negative signal. The 11 mediocre are noise. The 9 good are signal. 23 members dilutes the 9.
      *   *Key Concept:* **Pivotal Voting.** Explain why the strategic voter is mathematically mistaken in this context.

      *   *Structure:*
          1.  Direct Answer (23 is worse).
          2.  The Math of Why (Independence & Competence).
          3.  The Strategic Voter (Why he's wrong).
          4.  Specific Structural Changes (Size, Info, Voting).
          5.  Ranking vs. Binary.

      *   *Refining the "Strategic Voter" argument:* This is about "Information Aggregation." If everyone votes strategically, the market (or vote) fails to reveal true preferences. If he is competent, his vote is valuable data. Hiding it hurts the group.
      *   *Refining the "Staffer" argument:* This is the biggest leak. If the staffer has a bias or misses a red flag, $r$ (correlation) approaches 1. The effective $N$ is not 23. It's closer to 1 + (23 * noise).
      *   *Refining the "Harm Reduction" bias:* This isn't just noise; it's systematic error. In a binary vote, this blocks high-impact grants. Needs a recusal policy or weighted voting.

  6.  **Final Polish:**
      *   Make sure not to sound like a management consultant ("build trust," "set agendas"). Stick to the math of voting theory and information economics.
      *   Acknowledge the data tracking—it's excellent. Use it to justify the cuts.
      *   Calculate the "Effective N". If correlation is high, adding voters adds little value.

      *(Self-Correction during drafting)*: I should mention that 40 grants a year for 23 people is less than 2 grants per person. That's low engagement. It encourages free-riding.
      *(Self-Correction on Voting)*: Score voting (0-5) is usually better than Ranking for this because it allows intensity of preference, which helps with the "close calls."

  7.  **Final Output Generation:** (Matches the detailed response provided previously.)
answer: |-
  You have collected better data on your committee's performance than 99% of foundations ever do. That spreadsheet allows us to answer your questions using voting theory and information economics rather than management platitudes.

  Here is the arithmetic of your situation.

  ### 1. Is the 23-person committee better than the 5-person committee?

  **Mathematically, no. You have made the decision-making worse.**

  You recruited based on an intuition of **Condorcet's Jury Theorem**, which states that if voters are independent and individually competent (better than 50% chance of being right), adding more voters increases the probability of a correct majority.

  You have violated the two core assumptions of the theorem: **Independence** and **Competence.**

  **The Independence Problem (The Staffer Bottleneck)**
  Because almost everyone votes based on a single staffer's two-page summary, your voters are not independent. They are highly correlated.
  *   In voting theory, if Voter A and Voter B rely on the same information source, their votes are not $N=2$; they are effectively $N=1$ with some noise.
  *   If the staffer misses a red flag or misinterprets a budget, the correlation coefficient among your 23 members approaches 1.0. You don't have 23 eyes on the project; you have 1 eye (the staffer's) and 22 people rubber-stamping that view.
  *   **Result:** Adding members beyond the first 5 or 6 adds almost no new information but introduces more noise.

  **The Competence Problem (Signal vs. Noise)**
  Let's look at your accuracy data:
  *   **9 members (70%):** High signal.
  *   **11 members (55%):** Low signal (barely better than a coin flip).
  *   **3 members (40%):** **Negative signal.** They are systematically wrong on a specific category.

  In a simple majority vote, every vote counts equally. By expanding from 5 to 23, you diluted the voting power of your 70% members with 14 members who contribute little to no accuracy.
  *   **The 3 Biased Members:** In a binary vote, a voter who is right only 40% of the time is actively damaging the group's accuracy. They are not just noise; they are anti-signal. On harm reduction grants, they are guaranteeing false negatives.
  *   **The 11 Mediocre Members:** At 55%, they are essentially adding random noise to the signal provided by the top 9.

  **Verdict:** A committee of 7 (drawn from your top 9 performers) would be mathematically superior to the current 23, provided they had independent information. The current size encourages "free-riding" (why read deeply if 22 others are voting?), which further degrades independence.

  ### 2. The Strategic Voter: Is he onto something?

  **He is mathematically wrong, but his intuition reveals a flaw in your system.**

  He is describing a "pivotal voter" strategy common in game theory: *I should only vote my preference if my vote changes the outcome.*

  **Why he is wrong:**
  In a "truth-tracking" jury (which you want), the goal is to aggregate private information to find the correct answer.
  *   If he is one of your 70% members, his vote contains valuable data.
  *   If he votes against his read, he is deliberately corrupting the data pool.
  *   If *everyone* did this, the vote would no longer reflect the collective wisdom; it would reflect a game of chicken.
  *   **The Fix:** Tell him: "We are not trying to reach a compromise; we are trying to aggregate data. Your vote is a data point. If you withhold your true data, the aggregate calculation fails."

  **Why he feels this way:**
  He feels this way because the votes *aren't* independent (see the Staffer Bottleneck). If everyone is reading the same summary, they will all vote the same way. He assumes that if it's "close," the others must know something he doesn't. In your current system, they probably don't; they just read the summary differently. His strategy is a rational adaptation to a broken information flow, but it harms the committee.

  ### 3. What to Change (The Arithmetic Fixes)

  You asked for specific changes to membership, information, and voting. Here is the prescription based on your data.

  **A. Membership: Cut to 9, Weight the Rest**
  *   **Size:** Reduce the voting committee to **7 to 9 members**. This is the "magic number" for group decision-making where participation remains high and free-riding remains low.
  *   **Selection:** Invite the 9 members with 70% accuracy to be the core voting members.
  *   **The 55% Group:** Move them to an "Advisor" role. They can read applications and comment, but they do not cast binding votes. This utilizes their energy without diluting the signal.
  *   **The 40% Group:** You must address the systematic bias.
      *   *Option 1:* Recusal. They cannot vote on harm reduction categories.
      *   *Option 2:* Removal. If they refuse to evaluate applications based on merit rather than ideology, they are violating the committee's fiduciary duty to evaluate the *application*, not the category.
      *   *Option 3 (Weighted Voting):* If you keep them, their votes should count for less. (Hard to implement socially, but mathematically sound).

  **B. Information: Break the Correlation**
  You must lower the correlation coefficient among voters.
  *   **Divide and Conquer:** Do not let everyone read every summary. Assign 3 members to deeply review Application A, 3 different members to review Application B. They present their findings to the group. This creates independent information clusters.
  *   **Site Visit Requirement:** For grants over \$10k, require that at least 2 committee members visit the site *before* the vote. This creates an independent data stream that bypasses the staffer's summary.
  *   **Blind Summaries:** Have the staffer remove identifying info (org name, director name) from the initial summary to reduce halo effects, forcing reliance on the project metrics.

  **C. Voting Method: Switch to Score Voting**
  You asked about ranking vs. yes/no.
  *   **Yes/No** is a threshold test. It works for "Is this safe?" but fails at "Which of these 40 good projects is *best*?"
  *   **Ranking** (1st, 2nd, 3rd) is cumbersome with 40 applications.
  *   **Recommendation: Score Voting (0 to 5).**
      *   Each voter scores each application 0–5.
      *   **Why:** It captures *intensity* of preference. A 70% voter might feel "This is a solid 4" vs "This is a risky 3." Binary voting loses that nuance.
      *   **Aggregation:** Sum the scores. Fund the top 40 until the budget runs out.
      *   **Benefit:** This solves the "close call" problem. If the strategic voter thinks a project is a 4 but votes 0 to block it, they are easily spotted as an outlier in the score distribution. It makes strategic voting harder to hide.

  ### 4. Summary of Action Plan

  1.  **Shrink the Committee:** Thank the 14 lower-performing members for their service and move them to a non-voting "Community Advisor" pool. Retain the 9 high-performers.
  2.  **Fix the Input:** Stop feeding everyone the same summary. Assign "Lead Reviewers" for each grant who must speak to the application before the vote.
  3.  **Change the Vote:** Switch to a 0–5 Score Voting system. It aggregates preference intensity better than binary yes/no and makes the "strategic voter" behavior visible in the data.
  4.  **Address the Bias:** Explicitly recuse the 3 biased members from harm reduction grants or remove them. Their 40% accuracy is a systematic error that money cannot fix.

  You have the data to prove that growth degraded performance. Use your own spreadsheet to show the board that **accuracy per voter** matters more than **total voters**.
