answer: |-
  Your instinct to be uneasy about the phrase "nobody was robbed" is excellent. It is the weakest link in the passage, and relying on it without qualification could undermine your essay. While the author captures a popular intuition about scientific progress (often called "determinism" or "inevitabilism"), a historian or philosopher of science would find the passage mixes accurate observations with significant oversimplifications and one outright historical error.

  Here is a claim-by-claim breakdown of how a specialist would evaluate the passage, followed by advice on how to use it.

  ### 1. The Claim of Independence and Timing
  > *"Newton and Leibniz each worked out the calculus on their own, and Darwin and Wallace arrived at natural selection within a few years of one another without ever having compared notes."*

  *   **Historian's View:** **Mostly Accepted.**
      *   **Newton/Leibniz:** It is generally accepted that they developed calculus independently. Newton began earlier (mid-1660s) but published nothing. Leibniz began later (mid-1670s) but published first (1684).
      *   **Darwin/Wallace:** Also accepted as independent. Darwin had been working on it for 20 years; Wallace had a flash of insight in 1858 and sent Darwin a letter.
  *   **The Nuance:** The passage implies a symmetrical race. In reality, Newton sat on his discovery for decades, while Leibniz published promptly. In the Darwin case, Darwin was "forced" to publish only because Wallace wrote to him. The "timing" wasn't just cosmic luck; it was triggered by communication (in Darwin's case) and publication culture (in Leibniz's).

  ### 2. The "In the Air" Inference
  > *"When the same idea turns up twice... the reasonable conclusion is that it was in the air: the discovery was waiting to be made, and either man would have got there eventually even if the other had never been born."*

  *   **Philosopher's View:** **Contentious.**
      *   This is the debate between **Contingency** vs. **Inevitability**. The author takes the Inevitability side (associated with sociologist Robert Merton).
      *   **The Wince:** Historians argue that "eventually" is doing a lot of heavy lifting. Would calculus have happened in 1700 if neither existed? Probably. But would it have happened *then*, with *that notation*, leading to *those specific subsequent developments*? Maybe not.
      *   **The Problem:** The passage treats "in the air" as a proven fact rather than a hypothesis. Just because two people find something doesn't prove a third was inevitable; it might just prove that the intellectual tools were available to *those two specific geniuses*.

  ### 3. The Priority Quarrels
  > *"Which is why the priority quarrels look so silly in retrospect — the Royal Society's committee report of 1712 settling the calculus dispute in Newton's favour, the fuss over whose paper was read first at the Linnean Society in 1858."*

  *   **Historian's View:** **Misleading / False Equivalence.**
      *   **Newton/Leibniz (1712):** This was not a "silly quarrel." It was a scandal. Newton was the President of the Royal Society. He secretly appointed the committee, wrote the report himself (anonymously), and accused Leibniz of plagiarism. It wasn't just about pride; it led British mathematicians to use Newton's inferior notation for a century, isolating them from Continental advances. This had tangible negative consequences for science.
      *   **Darwin/Wallace (1858):** There was no "fuss." Darwin's friends (Lyell and Hooker) arranged a joint reading of papers to ensure both got credit. Wallace, who was in the Malay Archipelago, was not even present and later expressed gratitude for the arrangement. Equating the vicious, corrupt Newton feud with the collegial Darwin arrangement is historically inaccurate.

  ### 4. The "Nobody Was Robbed" Claim
  > *"Nobody was robbed, because there was nothing to take: the loser would have been scooped anyway..."*

  *   **Philosopher/Sociologist's View:** **Wrong.**
      *   **Why you feel uneasy:** This conflates the *idea* with the *credit*. In science, the "property" being fought over is not just the truth of the theory, but the **priority**, which brings reputation, funding, and legacy.
      *   **Leibniz:** He was effectively slandered. The Royal Society report branded him a cheater. He died in disgrace. He was "robbed" of his reputation, even if he wasn't robbed of the idea.
      *   **Wallace:** He was not "robbed" in the same way (thanks to the joint presentation), but history *did* rob him of the fame. We say "Darwin's Theory of Evolution," not "The Darwin-Wallace Theory." Wallace became a footnote in popular history.
      *   **The Verdict:** To say "nobody was robbed" ignores the sociology of science. Being "scooped" is a genuine professional harm, regardless of whether the idea was inevitable.

  ### 5. Credit and Ownership
  > *"History has in any case credited both men. Ideas of that size belong to their century, not to the person who happened to write them down."*

  *   **Historian's View:** **Exaggerated.**
      *   **Newton/Leibniz:** History credits both with the *invention* of calculus, but Newton dominates the popular imagination of the era.
      *   **Darwin/Wallace:** History has *not* credited both men equally. Darwin is the icon; Wallace is the footnote. The passage's claim that "history has credited both" is factually incorrect regarding public memory, even if specialists acknowledge Wallace.
      *   **Philosophical Point:** The idea that ideas "belong to their century" is a philosophical stance (Hegelian), not a historical fact. Many would argue ideas belong to the people who did the work to articulate them.

  ### 6. The Footnote on "Multiples"
  > *"(A footnote adds that sociologists of science have a name for cases like these, 'multiples,' and treats that as further support.)"*

  *   **Sociologist's View:** **Accurate Term, Overstated Support.**
      *   **The Term:** Yes, Robert Merton coined the term **"Scientific Multiples"** (or simply "Multiples") to describe independent, simultaneous discoveries.
      *   **The Support:** Merton used this to argue that science is socially organized to reward *discovery* rather than the *discoverer*, implying a level of inevitability. However, modern sociology also uses the study of multiples to show how credit is *unequally* distributed (the "Matthew Effect": the rich get richer).
      *   **The Trap:** Citing "multiples" proves the *pattern* exists, but it does not prove the *moral conclusion* that priority disputes are silly or that no one was harmed. Merton himself acknowledged the intense conflict these multiples generate.

  ### Summary for Your Essay

  If you wish to use this passage, you should treat it as a **provocation** rather than a statement of fact. Here is how you might frame it:

  1.  **Acknowledge the "Multiples" argument:** You can agree that the existence of multiples (Newton/Leibniz, Darwin/Wallace) suggests that scientific maturity makes certain discoveries likely ("in the air").
  2.  **Challenge the "Nobody was robbed" claim:** This is your critical hook. Argue that while the *idea* might be inevitable, the *credit* is finite. Leibniz suffered tangible reputational damage due to Newton's machinations; Wallace suffered tangible obscurity compared to Darwin.
  3.  **Distinguish the cases:** Point out that the author conflates two very different disputes. The Newton/Leibniz feud was toxic and damaging to science; the Darwin/Wallace arrangement was a model of professional courtesy. Treating them as the same "silly quarrel" ignores the historical reality.
  4.  **Refine the Conclusion:** Instead of "ideas belong to the century," you might argue: "While the *timing* of discoveries may be determined by the state of the field, the *attribution* remains a human struggle with real consequences."

  **Verdict:** The passage is a good example of **Whig history** (viewing the past as an inevitable march to the present) and **Mertonian Sociology**, but it fails as rigorous **History of Science**. Use it to illustrate the *argument for inevitability*, but critique its dismissal of the human cost of priority disputes.
