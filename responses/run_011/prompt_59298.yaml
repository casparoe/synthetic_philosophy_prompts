answer: |-
  Cut premise (2).

  It looked innocent because teleology mimics welfare so closely that we habitually project a "self" onto any system that pursues ends, using intentional language like "wants" or "goals" as shorthand for mechanical functions. The cost is conceding that your roommate is right: without consciousness or sentience, there is no "for whom" things go well, only functions succeeding or failing, which means Sims cannot be wronged because there is no subject to bear the wrong. There is no weaker version of (2) that keeps the anti-consciousness work while blocking (7) and (8), because the flaw isn't the scope of the definition but the category itself; "interests" logically require a subject to hold them, not just a description of states, so any definition that grants interests to code or thermostats will inevitably generate absurdities about unrendered instances and fungible copies. If you refuse to cut (2), you are forced to cut (6) and argue that moral wrongs attach to historical events rather than net outcomes, but that still leaves you unable to explain why unrendered code isn't a patient or why copying dilutes harm. The cleanest snap is admitting that simulation of a subject isn't a subject, regardless of how complex the goal-seeking is, because a map of a territory does not share the territory's vulnerabilities.
