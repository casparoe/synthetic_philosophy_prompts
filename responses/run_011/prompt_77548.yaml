answer: |-
  It is a specific kind of irony that a life spent chasing precision in mass spectrometry should end in the fuzziness of philosophy, but you have stumbled onto the exact tension that keeps philosophers of science employed. You are asking whether your committee is a court of **ontology** (what is real?), **epistemology** (what can we know?), or **sociology** (what actually moved the needle?).

  Your intuition is correct: your record is inconsistent because you are applying three different metrics to a single question ("Is this a Landmark?"). You are also correct that you have garbled Popper slightly, but not in a way that hurts your argument. Popper never advocated "counting true consequences" (that is verificationism, which he hated). He argued for **bold conjectures** that survive **severe tests**. The "distance from truth" metric you mention is actually **Niiniluoto's** later repair of Popper's failed formal definition of verisimilitude. Popper wanted *truth content* without *false content*; he didn't have a ruler for "average distance."

  Here is the reconstruction of your committee's implicit rules, the diagnosis of the 1971 paper, and the stress test you need to force your colleagues' hands.

  ### 1. The Three Implicit Rules

  Based on your six precedents, your committee is voting using a hybrid of these three principles. They are not mutually compatible.

  **Rule A: The Structuralist Rule (Lakatosian)**
  *   **Definition:** Honor the paper if its *formalism* or *mathematical core* survives into current practice, even if its *ontological explanation* is discarded.
  *   **Precedents:**
      *   *Honored (1954):* Math survived, mechanism died.
      *   *Honored (Headline -40%):* Number wrong, but it became a limiting case of the successor (structural integration).
  *   **Logic:** Science progresses by preserving the hard core of the math while swapping the protective belt of explanation.

  **Rule B: The Heuristic Rule (Kuhn/Laudan)**
  *   **Definition:** Honor the paper if it opened a new research tradition, unified fields, or made a risky prediction that forced new data collection. Decline if it was merely accurate but sterile.
  *   **Precedents:**
      *   *Honored (Bold Prediction):* Risky test passed, regardless of author's belief.
      *   *Declined (Gorgeous Model):* Accurate (inside error bars), but "nobody learned anything."
      *   *Declined (1930s Framework):* Sorted the field (utility) but rested on a phantom substance (failed to explain). *Note: This one is tricky; it suggests classification without ontology is insufficient for a "Landmark."*
  *   **Logic:** A Landmark must be a parent, not just a mirror. It must have caused the growth of knowledge.

  **Rule C: The Ontological Veto (Realist)**
  *   **Definition:** Decline the paper if its central entity or mechanism is confidently known to be non-existent, regardless of empirical fit.
  *   **Precedents:**
      *   *Declined (1930s Framework):* "Substance that was never there."
      *   *Working Scientists' Stance on 1971:* "Fictional mechanism is disqualifying."
  *   **Logic:** We do not plaque falsehoods. (Note: This directly conflicts with Rule A in the 1954 case, implying the "mechanism" in 1954 was viewed as a metaphor, whereas the "substance" in the 1930s was viewed as a claim of existence).

  ### 2. The 1971 Paper: Application of Rules

  Let's run the candidate through the mill.

  *   **Feature (i) Fits old data better than current model:**
      *   *Rule A:* **Pass.** It has empirical adequacy, potentially superior to the successor.
      *   *Rule B:* **Fail.** It was ignored. It did not *generate* growth at the time.
      *   *Rule C:* **Fail.** (See below).
  *   **Feature (ii) Mechanism is confidently false:**
      *   *Rule A:* **Pass.** (See 1954 case: mechanism nobody believes).
      *   *Rule C:* **Fail.** (See 1930s case: substance never there).
      *   *Tension:* Why was 1954 okay and 1930s not? Likely because the 1954 math *survived*. The 1971 math was *ignored*.
  *   **Feature (iii) Ignored at the time / Narrow scope:**
      *   *Rule B:* **Hard Fail.** This is the shadow of the "Gorgeous Model" (Declined). That model was taught but sterile; this one wasn't even taught. It did not contribute to the *history* of the field's growth.
  *   **Feature (iv) Implies novel qualitative effect (recent preprint):**
      *   *Rule B:* **Potential Pass.** This is your only lever. It suggests the paper might be a "Sleeping Beauty" that is *now* starting to generate growth.

  ### 3. Which Rule Leans Hardest?

  Your record leans hardest on **Rule B (The Heuristic Rule)**, specifically the **Historical Impact** component.

  Look at your declines. You declined the "Gorgeous Model" because "nobody learned anything from it." You declined the 1930s framework because it taught classification "not to explain" (i.e., it didn't drive the explanatory research programme).
  Look at your honors. The 1954 paper's equations *survived*. The -40% paper *unified subfields*. The Bold Prediction *tested the field for twenty years*.

  **The Verdict:** Your committee is not measuring **Verisimilitude** (closeness to truth). You are measuring **Lineage**. You are awarding plaques to ancestors, not to strangers who happen to look like the family.

  The 1971 paper is a stranger. It fits the data (Rule A), but it did not father the current paradigm. The working scientists are right to reject it *if* "Landmark" means "Historical Turning Point." They are wrong if "Landmark" means "Lost Insight."

  ### 4. Truth vs. Growth of Knowledge

  You asked what principle you sign onto with each vote.

  *   **Vote to Honor:** You are signing onto **Scientific Realism regarding Lost Knowledge.** You are claiming that the committee's job is to correct the historical record by identifying truth that was socially suppressed (by the author's personality, by bad luck). You are prioritizing *Logical Merit* over *Causal Impact*. You are saying, "This paper is part of the truth of geochemistry, even if geochemistry didn't use it."
  *   **Vote to Decline:** You are signing onto **Historical Materialism of Science.** You are claiming that science *is* the trajectory of what was actually read, used, and built upon. A paper that sits in a library and changes nothing is not a landmark in the *field*, it is merely a correct statement. You are prioritizing *Sociological Impact* over *Logical Merit*.

  **My advice:** Your record supports Declining. The 1930s framework (Declined) is the closest analog. It sorted the field correctly (like the 1971 paper fits data) but rested on a substance/process that wasn't there. The 1954 paper (Honored) is the counter-analog, but the key distinction is that the 1954 equations *survived*. The 1971 paper was *ignored*.

  **However**, Feature (iv) is your escape hatch. If the preprint this spring is directly reviving the 1971 mechanism, the paper is transitioning from "Ignored" to "Ancestor."

  ### 5. The Underdetermination

  The record genuinely underdetermines this case on one specific dimension: **Retrospective Utility.**

  None of your six precedents deal with a paper that was **wrong/ignored at the time** but **useful now**.
  *   Case 1 & 3 were useful *then* and *now*.
  *   Case 4 was useful *then* (taught) but sterile.
  *   Case 6 was undecidable.

  You have no precedent for a "Zombie Paper"—one that died at birth but is being resurrected. This is the dimension your committee has never touched. If you Honor it, you set a precedent that *current* utility outweighs *historical* impact. If you Decline it, you cement the rule that a Landmark must have actually landed in its own time.

  ### 6. The Stress Test Case

  You want a case that forces two rules to vote differently in public, exposing the rift. You need a "Sleeping Beauty" that forces a choice between **Truth** and **Lineage**.

  **Propose this future candidate:**
  > A 1960 paper that derived the correct governing equation for a major process we use today. It was published in an obscure journal, cited zero times, and had no influence on the field's development (the field derived the same equation independently 10 years later via a different, more expensive route). The 1960 paper is mathematically identical to current practice, but historically irrelevant.

  *   **Rule A (Structural/Truth):** **Honor.** The math is right and survives. It is "nearer the truth" than the expensive route actually taken.
  *   **Rule B (Heuristic/Lineage):** **Decline.** It changed nothing. It is not a landmark in the *history* of the science, only a curiosity.
  *   **Rule C (Ontological):** **Neutral.** (Assuming mechanism is standard).

  **Why this forces their hand:**
  If they Honor it, they admit they are a "Truth Committee" and should have Honored the 1971 paper (despite the false mechanism, if the math holds).
  If they Decline it, they admit they are a "History Committee" and must Decline the 1971 paper (because it didn't influence the field).

  ### 7. How to Argue This in the Room

  Do not talk about verisimilitude. Your colleagues are working scientists; they will smell the philosophy and dismiss it as semantics. Talk about **Legacy**.

  **The Argument for Honoring (The "Correction" Angle):**
  "We honored the 1954 paper because the equations survived. We are honoring the 1971 paper not because it influenced the past, but because it is influencing the *present* via this new preprint. If we decline it, we are saying that personality and bad luck matter more than insight. We are rewarding the loud, not the right."

  **The Argument for Declining (The "Consistency" Angle):**
  "We declined the 'Gorgeous Model' because nobody learned anything from it. This 1971 paper was ignored for 50 years. It did not build the field we stand on. A Landmark must be a stone in the road we traveled, not a stone we found in the ditch after we arrived."

  **My Recommendation:**
  If the preprint is merely "hinting," **Decline**. It is too close to the "Gorgeous Model" (accurate but sterile) and the 1930s Framework (false mechanism).
  If the preprint explicitly *uses* the 1971 derivation to solve a current crisis, **Honor**, but frame it as **Rule B (Heuristic)**. Argue that the paper is *now* becoming a landmark.

  You are wrestling with the difference between **Science as a Product** (truths) and **Science as a Process** (activity). Your committee's record shows they believe they are curating the **Process**. To vote otherwise, you must convince them that the Process was flawed enough to require correction by the Product. Given they are "mostly working people," they will likely defend the Process. Prepare your dissent accordingly.
