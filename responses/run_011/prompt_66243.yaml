      *   **Core Concepts:**
          *   Beat 1: Ellsberg-style ambiguity aversion (known vs. unknown composition).
          *   Beat 2 (Crucial): *Dilation*. Updating on evidence *widens* the probability interval, not narrows it.
          *   Constraint: Must be physical (chips, bags, beakers), cheap, no real money.
          *   Requirement 1: Physical design (timeline, materials).
          *   Requirement 2: Scoring rule for intervals (proper scoring rule for intervals).
