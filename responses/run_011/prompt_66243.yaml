      *   *Pivot to a Guaranteed Dilation Design:*
          *   Use the **"Seidenfeld's Urn"**.
          *   **Components:** 2 Bags (Bag A, Bag B).
          *   **Bag A:** 1 Red, 1 Blue. (Fair).
          *   **Bag B:** 2 Red OR 2 Blue. (You don't know which. It was decided by a coin flip hidden from you).
          *   **Selection:** A bag is chosen at random (50% A, 50% B).
          *   **Prior:** $P(Red) = 0.5(0.5) + 0.5([0, 1]) = [0.25, 0.75]$.
          *   **Evidence:** Draw a chip from the chosen bag. It is **Red**.
          *   **Posterior:**
              *   If Bag A: $P(Red|Bag A) = 0.5$. Likelihood of drawing Red = 0.5.
