          *   *I need the evidence to be independent of the hypothesis in a specific way.*
          *   *Let's use the standard "Dilation of a Partition" example.*
          *   **Setup:**
              *   There is a hidden number $H \in \{1, 2, 3, 4\}$.
              *   Prior: Uniform $[0.25, 0.25, 0.25, 0.25]$. (Precise).
              *   Wait, Dilation requires Imprecise Priors.
              *   Okay, let's look at the **"Simple Dilation"** (White, 2010).
              *   Let $A$ be the event "Chip is Red".
              *   Let $E$ be the event "Facilitator says 'Go'".
