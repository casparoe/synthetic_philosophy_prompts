  This is a sophisticated request that bridges metrology, decision theory, and pedagogy. You want to move your group from "uncertainty is error bars" to "uncertainty is a set of probabilities," using physical intuition to bypass the math anxiety.

  Here is the design for **"The Star-Chip Dilation."**

  ### 1. Physical Design & Timeline

  **Materials (All raidable from home/lab):**
  *   **20 Poker Chips:** 10 Red, 10 Blue.
  *   **Adhesive Star Stickers:** (Or a marker to draw stars on 10 chips).
  *   **3 Opaque Paper Bags:** (Lunch bags work).
  *   **1 Large "Master" Bag:** (To hold the 3 paper bags).
  *   **Scorecards:** Paper and pens.

  **The Setup (Do this before they arrive):**
  You need three possible "Recipes" for the Master Bag. You will tell the group *one* of these recipes was used to fill the bag, but not which one.
  *   **Recipe A (Positive Correlation):** 10 chips are **Red + Star**, 10 chips are **Blue + Plain**.
  *   **Recipe B (Negative Correlation):** 10 chips are **Red + Plain**, 10 chips are **Blue + Star**.
  *   **Recipe C (Independence):** 5 chips **Red + Star**, 5 **Red + Plain**, 5 **Blue + Star**, 5 **Blue + Plain**.

  *Note: In all three recipes, the total count is 10 Red / 10 Blue, and 10 Star / 10 Plain.*

  **Timeline (90 Minutes):**

  *   **00:00 – 00:15 (Beat 1: The Ellsberg Warm-up):**
      *   Show two bags. Bag 1: 5 Red, 5 Blue (visible). Bag 2: 10 chips, composition hidden (shaken).
      *   Ask them to write down the price they'd pay for a ticket that wins $10 if they draw Red.
      *   Collect prices. Reveal Bag 2 was also 5/5. Discuss why they discounted Bag 2.
  *   **00:15 – 00:30 (The Dilation Setup):**
      *   Bring out the **Master Bag**. Explain the 3 Recipes.
      *   **Crucial Constraint:** "I chose the recipe. I am not telling you which. You cannot assume I flipped a fair coin. You must assume *any* of the three is possible."
      *   **Task 1:** Write down your probability range (0% to 100%) that the *next* chip drawn will be **Red**.
  *   **00:30 – 00:45 (The Evidence):**
      *   Draw one chip from the Master Bag. **Do not look at the color yet.**
      *   Look at the **Shape**. Announce: "The chip has a **Star**."
      *   Return the chip to the bag and shuffle. (Replacement is vital for the arithmetic to hold).
      *   **Task 2:** Write down your *new* probability range that the *next* chip drawn will be **Red**.
  *   **00:45 – 01:00 (The Reveal & Scoring):**
      *   Draw the *second* chip. Reveal Color (e.g., Red).
      *   Calculate scores using the scheme below.
      *   Reveal the Recipe you actually used (pick Recipe A or B for maximum effect).
  *   **01:00 – 01:30 (Debrief):**
      *   Discuss the widening. Map to concepts.

  ### 2. Scoring Scheme: The "Interval Loss Function"

  To get honest ranges without real money, we use a **Loss Function** where lower score is better. This avoids the "house bank" issue of paying out winnings.

  **The Rule:**
  $$ \text{Loss} = \text{Width} + (100 \times \text{Miss}) $$
  *   **Width:** (Upper Bound % - Lower Bound %). E.g., [40, 60] is Width 20.
  *   **Miss:** 1 if the Truth (0 or 100) is outside your interval, 0 if inside.
  *   **Truth:** If the chip is Red, Truth = 100. If Blue, Truth = 0. (Binary scoring simplifies the arithmetic for the group).

  **Why posting the full range [0, 100] isn't a winning strategy:**
  *   If they post [0, 100]: Width = 100. Miss = 0. **Loss = 100.**
  *   If they post [50, 50]: Width = 0. Miss = 1 (almost certainly). **Loss = 100.**
  *   If they post [0, 100] every time, they guarantee a Loss of 100.
  *   If they believe the probability is precise (e.g., 50%), they can post [50, 50]. If they are right often enough, their average Loss drops below 100.
  *   **The Trap:** In the Dilation round, the "Truth" is determined by a Recipe that makes the color *dependent* on the Star. If they don't widen, they get Missed. If they widen to [0, 100], they cap their Loss at 100. The "Gut Punch" is realizing that *after* seeing the Star, the optimal strategy *is* [0, 100] (Loss 100), whereas before the Star, the optimal strategy was [50, 50] (Expected Loss < 100). They lose "precision points" just by learning the Shape.

  ### 3. Your "Survival Bonus" Idea

  You proposed: *A small bonus for ranges that still cover the truth after the update has happened.*

  **Honest Assessment:**
  This is **not** a second-order reliability condition; it is a **robustness penalty** disguised as a bonus.
  *   **Why:** In standard Bayesian updating, a prior interval should *contract* (narrow) upon evidence. If you reward an interval for covering the truth *post-evidence*, you are effectively rewarding intervals that were **wide enough to survive contraction**.
  *   **In Dilation:** The posterior interval *widens*. A narrow prior interval (e.g., [50, 50]) will almost certainly fail to cover the truth in the posterior state because the posterior uncertainty is [0, 100].
  *   **Verdict:** It works for your game. It incentivizes players to post a range wide enough to handle the *worst-case update*. In imprecise probability terms, this aligns with **E-admissibility** or **Maximality**—choosing options that aren't dominated across the credal set. It's a valid heuristic for "Safety," but tell them it's about **Fragility**, not "Probability of a Probability."

  ### 4. The Arithmetic (Checked)

  Here is the proof you can write on the whiteboard.

  **Definitions:**
  *   $R$: Chip is Red.
  *   $S$: Chip has a Star.
  *   $\mathcal{M}$: The set of possible Recipes {A, B, C}.

  **Step 1: Prior (Before seeing Shape)**
  *   In Recipe A: $P(R) = 10/20 = 0.5$.
  *   In Recipe B: $P(R) = 10/20 = 0.5$.
  *   In Recipe C: $P(R) = 10/20 = 0.5$.
  *   **Prior Credal Set:** Since all models predict 0.5, the set is a single point.
  *   **Prior Interval:** $[0.5, 0.5]$. (Width = 0).

  **Step 2: The Evidence**
  *   We observe $S$ (Star).
  *   Likelihoods:
      *   $P(S | A) = 10/20 = 0.5$.
      *   $P(S | B) = 10/20 = 0.5$.
      *   $P(S | C) = 10/20 = 0.5$.
  *   **Crucial:** The evidence is equally likely under all three recipes. Therefore, observing a Star **does not change the relative weights** of the recipes. If we started with "Any weight is possible," we end with "Any weight is possible."

  **Step 3: Posterior (After seeing Shape)**
  *   We want $P(R | S)$.
  *   **If Recipe A:** All Stars are Red. $P(R | S, A) = 1.0$.
  *   **If Recipe B:** All Stars are Blue. $P(R | S, B) = 0.0$.
  *   **If Recipe C:** Stars are independent. $P(R | S, C) = 0.5$.
  *   **Posterior Credal Set:** The convex hull of $\{1.0, 0.0, 0.5\}$.
  *   **Posterior Interval:** $[0.0, 1.0]$. (Width = 1).

  **Conclusion:**
  *   Prior Width: 0.
  *   Posterior Width: 1.
  *   **Dilation Confirmed.** Information increased uncertainty.

  **Container Size:**
  A standard lunch bag fits 20 poker chips easily. No beakers needed (chips rattle too much in glass).

  ### 5. Debrief Strategy

  **Mapping Moments to Concepts:**
  *   **Beat 1 (Known vs. Unknown Bag):** This is **Ambiguity Aversion** (Ellsberg). Map this to their intuition that "unknown risk feels riskier."
  *   **Beat 2 (The Star):** This is **Dilation**.
      *   *When to introduce the name:* After they calculate the Loss scores and realize their Post-Evidence Loss is worse (or requires max width) than Pre-Evidence.
      *   *Concept:* "Usually, data reduces uncertainty. Here, data told us *which part of the bag* we were sampling from, and that part turned out to be maximally ambiguous."
  *   **Type A vs. Type B:**
      *   **Type A (Statistical):** The draw of the chip (Red/Blue). This is the randomness they are used to.
      *   **Type B (Systematic/Model):** The choice of Recipe (A, B, or C).
      *   **The Trap:** In standard GUM, we often assume Type B uncertainties (model choices) are independent of Type A. Here, the Recipe (Type B) *correlates* with the Chip Color (Type A).
      *   **Warning:** Tell them: "In your old lab work, you assumed calibration errors didn't depend on the sample value. Dilation happens when they *do*."

  ### 6. Troubleshooting: The Actuary

  **Predicted Move:** The Actuary will say, "You said there are 3 recipes. Principle of Indifference says $P(A)=P(B)=P(C)=1/3$. Therefore $P(R|S) = 1/3(1) + 1/3(0) + 1/3(0.5) = 0.5$. The interval shouldn't widen."

  **In-the-Moment Handling:**
  Do not argue math. Argue **Protocol**.
  *   **Response:** "You are allowed to bet the single number 0.5. But the Scoring Rule penalizes 'Misses' heavily. If I (The House) used Recipe B, and you bet 0.5, you Miss. If you bet the Interval [0, 1], you Cover."
  *   **The Kicker:** "The Principle of Indifference is a claim of knowledge ('I know the distribution is uniform'). I explicitly told you **you do not know the distribution**. Assigning 1/3 is a hypothesis. Betting on the Set is a hedge against that hypothesis being wrong."
  *   **Outcome:** Let them bet 0.5. When you reveal you used Recipe B (all Stars are Blue), their Loss spikes. The Interval bettors survive. The lesson lands: *Ignorance of the model weights is not the same as Uniformity.*

  ### 7. Limitations: Risk vs. Belief

  **Straight Talk:**
  This game **cannot** distinguish between **Risk Aversion** and **Imprecise Belief**.
  *   If a player widens their interval to [0, 100], is it because they believe the probability is truly undefined (Dilation), or because they are terrified of the 'Miss' penalty (Risk Aversion)?
  *   **The Overlap:** In Imprecise Probability theory, acting on a Credal Set often *looks* like risk aversion.
  *   **What You Must Supply:** You have to verbally separate them in the debrief.
      *   *Say this:* "Your feeling of 'I don't want to miss' is Risk. The math that says 'The Star makes the Color undefined' is Belief. The game forces you to act *as if* the Belief is wide, which triggers your Risk. In the real world, Dilation means your instrument is telling you that *calibration* is now more uncertain than *noise*."
  *   **Adjustment:** To blunt the Risk confound, run a practice round with a known bag (5 Red, 5 Blue) where the optimal bet is [50, 50]. Show them that narrowing *rewards* them when the model is certain. This establishes that widening is costly, so they should only do it if the math demands it.

  ### Summary Checklist for You
  1.  **Prep:** 20 chips, stickers, 3 bags.
  2.  **Script:** "I chose a recipe. You don't know which. Don't assume 1/3."
  3.  **Math:** Prior [0.5, 0.5] $\to$ Evidence Star $\to$ Posterior [0, 1].
  4.  **Scoring:** Loss = Width + 100(Miss).
  5.  **Actuary Defense:** "Indifference is a claim of knowledge you don't have."
  6.  **Debrief:** Type B uncertainty (Recipe) corrupted Type A measurement (Chip).

  This design respects their hands-on preference, uses your lab surplus, and delivers the specific philosophical payload you requested without requiring them to derive Bayes' theorem on a napkin.
