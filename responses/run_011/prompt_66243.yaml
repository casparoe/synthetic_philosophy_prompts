      *   *What is it?* In imprecise probability (sets of priors), conditioning on an event $E$ can result in a posterior set of probabilities where the lower bound is lower than the prior lower bound, and the upper bound is higher than the prior upper bound. $P(A) \subset P(A|E)$.
      *   *Standard Example:* Walley's example. Two coins. One is fair ($P(H)=0.5$). The other is unknown ($P(H) \in [0, 1]$). You bet on matching outcomes.
