answer: |-
  This is a sophisticated observation that cuts to the core of critical transitional justice literature. You are describing a specific configuration where *sincerity* is not the bug, but the feature that enables the mechanism. The standard labels ("non-apology," "cheap talk," "moral licensing") fail because they assume insincerity or individual psychology. You are describing a structural function of the *successful* state apology.

  There is no single established term that captures the entire triad (Genuine Apology + Burden Shift + Moral Asset), but the literature comes close by splitting the phenomenon into three distinct concepts. I will outline the nearest concepts, explain where they fall short, and then propose a coined term for the specific configuration you identified, particularly the "asset conversion" piece.

  ### 1. The Nearest Existing Concepts

  #### A. For the Burden Shift (Instances 1 & 2): *Settler Moves to Innocence*
  **Source:** Eve Tuck and K. Wayne Yang, *"Decolonization is not a metaphor"* (2012).
  **The Concept:** This describes gestures by settler states (apologies, acknowledgments) that are designed to relieve settler guilt without relinquishing land, power, or sovereignty. The apology functions to "clear the ledger" morally, allowing the state to claim it has "dealt with the past."
  **Why it fits:** It perfectly explains why survivors are pressured to be gracious (Instance 1) and why the file is treated as settled (Instance 2). The apology is a tool to secure the state's future innocence.
  **What it leaves out:** It is specific to settler-colonial contexts. It doesn't fully account for the *international reputational gain* (Instance 3) where the state becomes *more* regarded than a state without the history. It focuses on the internal relief of guilt, not the external accumulation of capital.

  #### B. For the Closure Mechanism: *Narrative Foreclosure*
  **Source:** Political Science / Memory Studies (e.g., Jeffrey Olick, *The Politics of Regret*).
  **The Concept:** The state constructs a national narrative where the apology serves as the "ending" of the story. Once the apology is uttered, the narrative arc is complete. Continuing to demand justice is framed as "living in the past" or disrupting the national healing.
  **Why it fits:** Explains the "sliding argument" where survivors are accused of using the past. The apology creates a temporal boundary: *Before* (guilt) and *After* (resolution).
  **What it leaves out:** It describes the *rhetorical* effect, but not the *strategic asset* gained by the state. It explains why the victims are silenced, but not why the state is elevated.

  #### C. For the Asset Conversion (Instance 3): *Moral Licensing (State Level)*
  **Source:** Adapted from Psychology (Merritt et al.) to IR (e.g., Jennifer Lind, *Sorry States*).
  **The Concept:** Actors who establish moral credentials (via apology) feel licensed to behave in ways that might otherwise be criticized, or are granted more leeway by observers.
  **Why it fits:** It captures the idea that the apology buys "credit."
  **What it leaves out:** Standard moral licensing implies a *subsequent* bad act is permitted. Your observation is sharper: the *past* bad act, once apologized for, becomes a *positive* asset relative to a baseline of no bad act. It's not just "we can do bad things now," it's "we are morally superior *because* we sinned and repented."

  ---

  ### 2. The Missing Concept: Coining the Term

  The specific configuration you are describing—where the atrocity, processed through a sincere apology, yields a higher moral standing than a history without the atrocity—requires a new carving. The closest existing phrase is **"Contrition Capital,"** but that implies the capital exists *in* the contrition. You are describing the *conversion* of the wrong itself.

  I propose the term: **The Redemptive Dividend**.

  #### Definition
  **The Redemptive Dividend** is the net surplus of moral legitimacy and international reputational standing accrued by a state that publicly atones for a historical atrocity, exceeding the baseline standing of a comparable state with no such atrocity in its history.

  It occurs when the apology functions not merely as restitution, but as a **technology of moral alchemy**, converting the liability of the historical wrong into an asset of current virtue.

  #### The Mechanics (The Carving)
  For a case to count as **The Redemptive Dividend**, it must meet three criteria:
  1.  **Sincerity Threshold:** The apology must be politically costly and linguistically robust (ruling out "non-apologies"). If it is seen as cheap talk, the dividend is not paid.
  2.  **Closure Condition:** The apology must successfully shift the burden of proof. Post-apology, the *victim's* continued claims are framed as unreasonable, while the *state's* record is framed as "accountable."
  3.  **Comparative Gain:** The state's moral standing rises *above* the counterfactual of a state that never committed the wrong. (e.g., Germany > Switzerland in terms of "moral leadership on human rights," specifically *because* of the Holocaust processing).

  #### Edges and Near-Misses
  *   **What Counts:** The Australian National Apology to the Stolen Generations (if viewed through the lens of international reputation); Post-war Germany's *Vergangenheitsbewältigung*; South Africa's TRC (in terms of the "Rainbow Nation" brand).
  *   **What Doesn't Count:**
      *   **Reparations without Apology:** If a state pays money but admits no moral failing, there is no Redemptive Dividend (it's just a settlement).
      *   **Apology without Closure:** If the state apologizes but the public discourse *continues* to hold the state liable (e.g., ongoing litigation, sustained pressure), the dividend is not realized. The "asset" is only locked in if the file is treated as closed.
      *   **Weak States:** A small state apologizing for a minor wrong does not generate a Dividend because there is no significant "liability" to convert. The Dividend requires a *major* historical stain to be laundered.

  ---

  ### 3. Is the Third Observation an Illusion?

  You asked to be told straight if the "Atrocity + Apology > No Atrocity" claim is an illusion.

  **It is not an illusion, but it is a selection effect.**

  Here is the breakdown:

  **Why it is Real:**
  There is empirical evidence in International Relations (e.g., Jennifer Lind's work) that contrite states are reintegrated into the international community faster and more robustly than uncontrite ones. Furthermore, the "Prodigal Son" dynamic is real in moral psychology: a reformed sinner is often trusted *more* than someone who claims they never sinned, because the reformed sinner has *tested* their morality and proven their commitment to the norm. Germany is the prime example: its human rights advocacy carries weight *precisely because* it speaks from the site of the ultimate violation. A state with no history of genocide lacks that specific moral authority.

  **Why it is a Selection Effect (The Illusion Component):**
  You cannot compare just any "Atrocity State" to any "Clean State."
  1.  **Power Pre-requisite:** Only powerful states can afford to apologize without collapsing. A weak state admitting to a massive atrocity might be sanctioned or destabilized. Therefore, the states that *can* generate a Redemptive Dividend are already powerful. The "high regard" may be for their power, with the apology serving as a veneer.
  2.  **The "Clean State" Myth:** There are very few states with "no atrocity" in their history. When you compare Germany to, say, Sweden, you are comparing a state that *processed* its guilt to a state that *obscured* its (smaller) guilt. The dividend might actually be **"Processing Dividend"** rather than **"Atrocity Dividend."**
  3.  **The Asset is Specific:** The dividend is not general "goodness." It is specific authority *on the topic of the atrocity*. Germany has moral authority on genocide; it does not necessarily have moral authority on colonialism (where it is often critiqued). The asset is niche, not universal.

  **Verdict:** The observation is **structurally real** within the liberal international order, which rewards performative accountability. However, it is not that the *atrocity* is the asset; it is that the *capacity to survive the admission of the atrocity* signals power, and the *performance of atonement* signals alignment with liberal norms. The "Dividend" is the market reward for that signaling.

  ### Summary for your Work
  When you encounter this pattern, you are seeing **Settler Moves to Innocence** operationalized through **Narrative Foreclosure** to secure a **Redemptive Dividend**.

  If you need a single label for your reports to capture the whole dynamic (the sincere apology that ends up harming the claimant and boosting the state), I recommend using **The Redemptive Dividend**. It flags the economic/conversion nature of the transaction and distinguishes it from cynical "non-apologies." It marks the specific injustice where the victim's suffering becomes the raw material for the perpetrator's moral rehabilitation.
