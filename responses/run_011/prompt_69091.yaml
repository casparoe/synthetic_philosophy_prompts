answer: |-
  The patchwork presupposes a theory of reciprocal obligation where hazard pay compensates for extraordinary burdens within the scope of duty, while volunteer lists mark the specific threshold where risk exceeds professional obligation.

  Your hypothesis that hazard pay concedes the work is outside the job description conflates compensation with moral categorization. In professions like military or policing, "danger pay" does not render combat optional; it satisfies the institution's duty of reciprocity for imposing heightened risk within the scope of employment. By paying hazard bonuses, the hospital acknowledged the *burden* was extraordinary, not that the *duty* was absent. However, cancelling that pay while the risk persisted suggests administration mistakenly viewed the pay as buying supererogatory effort rather than fulfilling a justice-based obligation to support staff fulfilling their duty. The "volunteers only" list for specific aerosol-generating procedures is the true marker of supererogation; this policy admits that certain levels of risk exceed the professional obligation to treat, allowing staff to opt out without penalty because the act is genuinely beyond the call of duty.

  The legal and ethical strands you cite do not contradict but rather delineate scope. Common law's "no duty to rescue" applies to bystanders lacking a special relationship, whereas EMTALA and professional codes establish that specific relationship for physicians on duty. The apparent tension between "obligation to treat" and "weighing risk" is resolved by threshold deontology: the duty holds until the risk becomes disproportionate to the benefit or threatens the physician's capacity to treat future patients. Hazard pay operates within the duty zone to maintain fairness; volunteer lists operate in the supererogatory zone where duty ends.

  Paying for risk does not kill the category of heroism, though it shifts the moral narrative. A soldier receiving combat pay is still praiseworthy for courage; the payment acknowledges the cost, not the optionality. Heroism here transforms from "sacrificing everything unpaid" to "honorable fulfillment of difficult obligations under unjust conditions." The cancellation of pay undermines this by breaking the reciprocal contract, making the continued work more heroic precisely because the institutional support was withdrawn.

  This policy is underdetermined because rival ethical accounts license it equally. Utilitarianism supports it to incentivize staffing and maximize outcomes; Contractarianism supports it as fair terms of cooperation; Virtue Ethics supports it as allowing courage without demanding martyrdom. All three converge on the same practice despite differing foundational reasons.

  If you operated under a view with no supererogation, where every morally good act is required and every bad act forbidden, the volunteer lists would become impermissible. Under such a rigid system, if intubating is deemed "good" and within safety thresholds, it must be mandatory for all qualified staff; if it is too risky, it must be forbidden for all. You could not allow opt-outs without discipline, nor could you frame high-risk work as optional. The policy would have to binary: either the procedure is standard required care (with hazard pay as entitlement) or it is prohibited medical practice (no one does it). The current hybrid model relies entirely on the existence of a middle ground where actions are praiseworthy but not obligatory.
