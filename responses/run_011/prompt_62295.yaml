  *(Self-Correction during drafting)*: I need to be careful not to say "Archivists are wrong." The principle of provenance *does* protect important things (context of power). I need to explain *why* it does that, and what the *cost* of that protection is. The user is asking for the *presuppositions*, not necessarily a revolution, though they are hinting at the ethical cost. I should frame it as a trade-off between *administrative truth* and *human narrative*.

  *(Refining the Privacy point)*: Privacy laws often mandate the erasure the user describes. I need to acknowledge that the archivist's hands might be tied legally, but the *philosophical justification* used ("provenance") is distinct from the *legal justification* ("privacy"). The user is conflating them slightly ("we're told we couldn't fix that with an index anyway because it would break provenance" vs "privacy rules"). I need to disentangle those. Provenance says "don't mix." Privacy says "don't name." They work together to produce the silence.

