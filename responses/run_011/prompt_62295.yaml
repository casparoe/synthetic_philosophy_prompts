answer: |-
  You have identified one of the central tensions in modern archival theory, often described as the conflict between **evidential value** (what the record proves about the creator) and **informational value** (what the record tells us about the world). Your whiplash is not a failure of your training; it is the friction of two different archival paradigms operating in the same building.

  Here is a reconstruction of the philosophical presuppositions behind the rules you are following, separated from the practical constraints, and an analysis of the inconsistency you spotted.

  ### 1. The Philosophical Presuppositions of Provenance
  The rule "arrange by creator, never by subject" is the principle of **Provenance** (*respect des fonds*). It is not merely a filing system; it is an epistemological and ontological claim.

  **The Epistemological Claim: Context is Meaning**
  The archive presupposes that a record's truth value lies in *why it was created*, not *what it says*. A letter about an eviction is not primarily evidence of a woman's suffering; it is evidence of the Housing Office's procedure. If you remove that letter from the Housing Office files and place it in a "Eviction Victims" file, you have, in the archivist's view, destroyed its evidential integrity. You have severed the link between the action and the actor. The philosophy here is that **history is best understood through the structures of power that shaped it, not through the isolated experiences of those shaped by it.** To rearrange by subject is to impose a later researcher's logic onto the past, thereby falsifying the historical record of how the institution actually functioned.

  **The Agency Claim: Institutions Act, Individuals Happen**
  You asked if this is a claim that institutions are the things that act. **Yes.** In the ontology of traditional archival science, the "Creator" is the historical subject. The institution has continuity, agency, and legal standing. The individual appearing in the records is a "data point" within the institution's narrative.
  *   **The Commissioner:** Is a creator (or part of one). Their memos are evidence of their agency. They are indexed because they are *subjects of history* in the archive's eyes.
  *   **The Evicted Woman:** Is a *topic* of administration. She is an object upon which power was exercised. To index her by name would be to grant her the status of a Creator, which the records themselves deny. The archive mirrors the bureaucracy's own view of the world: the bureaucracy is the protagonist; the citizen is the plot device.

  **The "No Name Index" Presupposition**
  This presupposes that **individuals are types, not agents.** In a case file series, "Tenant" is a role defined by the office. Naming the tenant transforms the record from "Case #402" (administrative data) to "Mrs. Smith's Life" (biographical data). The rule assumes that the archive's duty is to preserve the administrative data, not to reconstruct biographies. It quietly rules out the view that the *cumulative experience of the administered* constitutes a historical record equal to the *decisions of the administrators.*

  ### 2. Practical Necessity vs. Philosophical Commitment
  You asked to separate what the practice *needs* from what it *fits well with*.

  **The Practical Story (The "License")**
  *   **Custody & Chain of Title:** Provenance proves the records are authentic. If you mix Office A and Office B, you can no longer legally certify that Office A created these specific documents.
  *   **Cost:** Describing 400 case files at the item level (naming every person) takes 100x more time than describing one box as "Case Files, 1960–1970."
  *   **Privacy:** Laws often mandate that case files remain closed or aggregated to protect living persons or sensitive data.

  **The Philosophical Leftover**
  Practicality alone does not explain the *rigidity* of the rule. If cost were the only factor, we could index names without moving the physical folders. But archivists often resist *indexing* by name even when the physical order remains intact.
  *   **The Leftover:** This is the belief in **Archival Impartiality.** The archivist claims they are not interpreting the records, just preserving them. Creating a name index is seen as an interpretive act (selecting which names matter). By refusing to index, the archive claims it is not "making history," just "keeping evidence." This is a philosophical shield. It allows the archive to say, "We aren't erasing these women; we are just respecting the integrity of the Housing Office records."

  ### 3. The Inconsistency: Official Records vs. Artificial Collections
  You noticed that for the community project, you are building "artificial collections" by person and topic, which is forbidden for the county records. **This is not an inconsistency in the rules; it is a distinction in the nature of the material.**

  *   **Official Records:** These are "organic." They accumulated through business. The rule is: *Do not disturb the evidence of the business.*
  *   **Community Collections:** These are "collected." They were gathered by the archive or a donor to document a topic. There was no original "business" order to preserve.

  **What This Reveals**
  This reveals that the rule of provenance is not about "Truth" in a universal sense; it is about **Status.**
  *   Institutional records are treated as **sacred evidence**. Their original order is inviolable because the institution's authority is what we are preserving.
  *   Community records are treated as **historical raw material**. They can be shaped, curated, and arranged by the archivist because they lack the "authority" of the state.

  It reveals that the archive views the *institution's* memory as fixed and objective, while the *community's* memory is malleable and subjective. The rule protects the "View from Above" as objective fact, while allowing the "View from Below" to be curated narrative.

  ### 4. Privacy: Protection or Erasure?
  You asked whether privacy restrictions on the case files protect the people or complete their erasure. **It is structurally both.**

  *   **Ethical Protection:** It prevents stigma, harassment, or data misuse. It acknowledges that these people did not consent to be historical specimens.
  *   **Structural Erasure:** By making them unfindable, the archive ensures that the *impact* of the policy is invisible, while the *decision* to enact the policy (the Commissioners' minutes) is visible.

  If a researcher can find the vote to cut funding but cannot find the people who starved because of it, the archive has structurally biased the historical record toward **policy** and away from **consequence.** Privacy laws are necessary, but when combined with aggregate description and no cross-referencing, they create a "silence" that looks like the people didn't matter. It protects their dignity in the present at the cost of their memory in the future.

  ### 5. What Would Have to Change for a Person-Centered Archive?
  To shift from "arrange-by-creator" to "person-centered" without lying about the records, you would need to change the definition of a "fact" and a "source."

  **1. Redefining the "Creator"**
  Currently, the Creator is the office that *wrote* the document. In a person-centered model, the Creator could arguably include the person the document is *about*.
  *   *Change:* You would need to treat the "case file" not as an administrative transaction, but as a **testimony**. The form filled out by the social worker becomes a record of the client's interaction with the state, co-created by the client's presence.

  **2. Multilevel Description (The Technical Fix)**
  You do not actually have to break provenance to fix the discoverability.
  *   *Change:* Keep the boxes arranged by Office (preserving the evidence of function). But, create a **separate name index** that points back to the box/folder.
  *   *Philosophical Shift:* This admits that the record has *two* contexts: the context of creation (Office) and the context of subject (Person). Current rules privilege the first as "real" and the second as "research aid." A person-centered archive treats the second as equally vital metadata.

  **3. Granular Access Controls**
  *   *Change:* Instead of closing the whole box ("Restricted"), redact specific sensitive fields (SSN, medical details) and open the rest.
  *   *Philosophical Shift:* This assumes people have a right to their history, not just a right to privacy. It shifts the burden from "hide everything to be safe" to "protect the sensitive, reveal the rest."

  **4. Acknowledging the Silence**
  *   *Change:* The finding aid should explicitly state: "These records document the administration of relief, not the lives of the recipients. Many individuals are unnamed due to privacy protocols."
  *   *Philosophical Shift:* This stops pretending the archive is neutral. It admits that the structure of the collection shapes the history that can be written.

  ### Summary
  The practice presupposes that **history is the story of power, and records are the evidence of that power.** It assumes that preserving the *structure of authority* is more important than preserving the *identities of the subjected*.

  The "artificial collection" exception reveals that this is not a law of physics; it is a policy choice reserved for "official" memory. When the archive collects community history, it admits that history can be arranged by topic. When it processes government records, it claims history must be arranged by office.

  To fix this, you don't necessarily need to stop arranging by provenance. You need to stop pretending that provenance is the *only* way to tell the truth. You can preserve the office's order in the box, while building a key (an index) that allows the people inside to be found. Refusing to build that key is not just about cost or privacy; it is a choice to value the bureaucracy's memory over the community's.
