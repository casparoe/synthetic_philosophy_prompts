          *   *Rule Set B (Community Collecting):* "Artificial collections" assembled by person/topic. Vertical files of clippings/flyers. Subject-based arrangement is allowed/encouraged here.
      *   **Core Question:** What does the practice of "arrange-by-creator/provenance" presuppose philosophically?
