answer: |-
  **Project Proposal: Baseline Indeterminacy and the Metaphysics of Pre-Tax Entitlement**

  **1. The Research Question**
  The central question of this paper is: *Does the metaphysical indeterminacy of pre-tax economic holdings render the claim "taxation is theft" conceptually incoherent, or does it merely relocate the dispute to a second-order argument about baseline selection?*

  To be precise: The slogan "taxation is theft" presupposes that there is a fact of the matter regarding how much of a citizen's income belongs to them prior to state intervention. If pre-tax income is not a natural quantity but a composite output of legal and social frameworks (currency, liability laws, contract enforcement), then identifying the "portion taken" requires selecting a baseline for comparison. This paper asks whether the inability to identify a baseline-free pre-tax amount undermines the theft accusation entirely, or whether the moral debate simply shifts to arguing over which baseline (e.g., "state of nature," "current legal framework," "counterfactual market") is the morally correct reference point. The goal is to determine if the indeterminacy dissolves the argument or if it simply hides the normative premise inside the choice of baseline.

  **2. Engagement with Existing Positions**
  The current debate is polarized between two camps that both assume a determinate holding exists, which this project challenges.

  *The Libertarian/Historical Entitlement Reply:*
  The standard objection from the libertarian side is that entitlement is historical, not patterned. This view argues that it does not matter what the pre-tax number *is* in a metaphysical sense; it only matters how it was acquired. If the income resulted from voluntary exchange and non-fraudulent contracts, the agent is entitled to the full amount regardless of the social infrastructure that enabled the trade. On this view, my "baseline indeterminacy" argument is a category error. It treats income as a static pie to be sliced (a patterned principle), whereas the libertarian sees it as a flow of rights generated by process. If I argue "you can't determine the slice," they reply "the process validates the whole slice." My project must demonstrate why the *quantification* of the taking matters for the label "theft," even if the process was voluntary. If theft requires a specific victim and a specific loss, and the loss is indeterminate, does the charge stick?

  *The Statist/Conventionalist Reply:*
  The opposing view argues that property rights are creatures of the state. On this view, there is no "pre-tax" income because there is no property without legal definition. Therefore, "theft" is a misnomer because one cannot steal what one has no prior right to hold. This aligns superficially with my indeterminacy claim, but for a different reason. They argue the holding is *zero* before the state; I am arguing the holding is *undefined*. This distinction is crucial. If the holding is zero, the state takes nothing of yours. If the holding is undefined, the state takes *something*, but we cannot say how much belongs to you versus the framework. My project needs to show that "undefined" is a distinct and more problematic category than "zero," because it prevents the calculation of harm required for a theft accusation.

  **3. Methodology and Work Plan**
  Given the constraint of 10–12 hours per week and the engineering background, a purely textual exegesis of political theory is inefficient and risks getting bogged down in jargon. Instead, I will use a "model-stress-testing" approach, treating the philosophical concepts like system specifications.

  *Phase 1: Conceptual Definition (Weeks 1–3)*
  I will define "baseline indeterminacy" using the feature attribution analogy but immediately translate it into philosophical terms (counterfactual dependence). I will draft the precise definition of "theft" being used (typically: non-consensual taking of rightful property). I will map the "historical entitlement" vs. "patterned" distinction to ensure I am not attacking a straw man.
  *Deliverable:* A 1,500-word outline defining the terms and the specific logical gap in the "taxation is theft" argument.

  *Phase 2: Stress-Testing with Non-State Cases (Weeks 4–7)*
  I will proceed with the proposed "small cases" (condo fees, open source infrastructure, platform take rates). The goal here is not to write case studies, but to use them as intuition pumps to isolate the baseline variable.
  *Example:* In a condo, is the "pre-fee" equity the market value minus fees, or the market value assuming no fees existed? If the building collapses without the fees, is the fee a "taking" or a "cost of existence"?
  *Critique of this approach:* This is the right approach for *generating* the argument, but it carries a risk. It can become too descriptive. I must ensure these examples serve only to illustrate the logical structure of baseline dependence, not to argue that taxation is *like* condo fees in a substantive political sense. Direct conceptual analysis would be too abstract for the word count; these cases ground the abstraction. I will limit this section to 2,500 words to avoid drifting into policy analysis.

  *Phase 3: Application and Counter-Argument (Weeks 8–11)*
  I will apply the findings from Phase 2 to the taxation debate. I will explicitly test the Libertarian historical entitlement objection against the indeterminacy claim. Does the "voluntary process" defense survive if the *value* generated by that process is dependent on the very thing being taxed? I will also test the "theft requires no baseline" objection (i.e., that taking *any* amount without consent is theft, regardless of quantification).
  *Deliverable:* The core argument draft (4,000 words).

  *Phase 4: Synthesis and Revision (Weeks 12–14)*
  Refining the conclusion. Ensuring the ML analogy is glossed correctly and not doing too much heavy lifting. Cutting tangents to meet the 8,000-word limit.
  *Deliverable:* Final Paper.

  **4. Verdict on the Feature Attribution Analogy**
  **Verdict:** The analogy is a liability if used as a proof, but a useful heuristic if used as a structural mirror.

  *The Risk:* In machine learning, feature attribution decomposes a specific, well-defined output (e.g., a probability score). In economics, the "output" (social wealth) is not a single scalar value with a ground truth. By using the ML analogy, I risk implicitly conceding that there *is* a joint product waiting to be decomposed, which is exactly what the Statist/Conventionalist denies. If there is no joint product, there is nothing to attribute.
  *The Mitigation:* I must explicitly state that the analogy applies to the *logic of justification*, not the *mathematics of production*. The point is not that the economy is a neural net, but that any claim about "contribution" requires a reference state (a baseline), and choosing that reference state is a normative act, not a descriptive one. I will use the term "counterfactual baseline" rather than "feature attribution" in the final text to avoid category errors. The analogy stays in the proposal to explain my thinking process, but in the paper, it will be translated into standard counterfactual analysis.

  **5. Success and Failure Conditions**
  *Success:* The paper successfully demonstrates that the "taxation is theft" claim is not a first-order factual claim (about money moving) but a second-order normative claim (about which baseline defines ownership). If I can show that both sides of the debate are secretly arguing over baseline selection without admitting it, the project succeeds. It clarifies the disagreement rather than solving it.

  *Failure Mode 1 (The Procedural Defense):* If it turns out that the definition of "theft" in this context relies solely on consent, not quantification. If "theft" means "any non-consensual transfer," then the amount taken is irrelevant. My whole argument collapses because indeterminacy of the *amount* doesn't matter if the *act* is the violation. I need to address this early; if this definition holds, the project must pivot to arguing that "theft" implies a violation of *extent*, not just *act*.

  *Failure Mode 2 (The Triviality Trap):* If the conclusion is simply "definitions matter," the paper is trivial. To avoid this, I must show *why* the baseline selection determines the moral outcome, not just that it exists.

  *Failure Mode 3 (Scope Creep):* Trying to solve the baseline problem. I cannot propose the *correct* baseline in 8,000 words. I can only argue that the *choice* of baseline is the real debate. If I try to solve it, I will fail.

  **6. Scope Check and Constraints**
  *Word Count:* 8,000 words is approximately 25–30 pages double-spaced. This is tight for metaphysics + political philosophy.
  *Cuts Required:*
  1.  **No History of Theory:** I cannot trace the history of the taxation debate. I must treat the positions as logical types (Historical vs. Conventional vs. Indeterminate).
  2.  **No ML Math:** I will not explain Shapley values or specific attribution algorithms. I will use the concept of "reference dependence" only.
  3.  **No Policy Prescriptions:** I will not argue for higher or lower taxes. The paper is meta-ethical (about the language used), not normative (about what to do).
  4.  **Limited Case Studies:** I will use only one or two of the proposed "small cases" (likely the condo and the platform) as illustrative tools, not as empirical evidence.

  *Feasibility:* At 10 hours a week, this is feasible *if* I stick to the logical structure. The risk is getting seduced by the engineering examples and writing a paper about distributed systems governance rather than philosophy. I will enforce a rule: for every paragraph about an engineering case, there must be two paragraphs linking it back to the definition of entitlement.

  **Supervisor Sign-off Notes:**
  *   **Clarity:** The distinction between "indeterminate" and "zero" needs to be the sharpest point in the draft.
  *   **Jargon:** Ensure "historical entitlement" and "patterned principles" are clearly glossed when first introduced, as the candidate lacks an undergrad philosophy background.
  *   **Analogy:** Monitor the ML analogy closely. If it becomes a crutch, cut it. The philosophical argument must stand on counterfactual logic, not computer science metaphors.
