  **Sensitivity Analysis**

  **Swing Term:** The moral weight of simulated consciousness (embedded in Term 2 above).

  **What would move it:** To move my credence significantly, you would need a functional theory of consciousness that definitively categorizes substrate-independent computation as either morally full-weight or morally null. Currently, the debate rests on intuitions about "realness" versus "information processing." If you could demonstrate that simulated suffering is objectively less potent than biological suffering (or vice versa) via a mechanistic account of qualia, the 0.50 probability on Term 2 would swing to near 0 or near 1, dragging the final figure with it.

