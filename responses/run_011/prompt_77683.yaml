  **The Interest Filter**

  **Probability that the interest filter substantially cuts against D:** 0.45

  **Assessment:** It is a real argument, not just survivorship bias, but it relies on a specific psychology of the simulator. It correctly identifies that selection effects favor sims that reach technological maturity, but it fails to guarantee *continuation* past that point; a sim might be most interesting precisely *until* it builds its own sims, at which point it becomes redundant or is archived. It cuts against the "shutdown risk" component of D, but not the "moral weight" or "causal power" components.

