answer: |-
  **MEMORANDUM**

  **TO:** Assurance Review Panel, Interpretability Team, Release Management
  **FROM:** Chair, Assurance Review Panel
  **DATE:** October 24, 2023
  **SUBJECT:** Decision on M1 Certificate Inheritance and Mechanistic Standard Policy

  **1. RULING ON M1 AND IMMEDIATE ACTION PLAN**

  The Panel rules that Model M1 shall receive a **Conditional Inheritance** of Model M0's mechanistic certificate for Property P. This inheritance is probationary. We acknowledge that while behavioral metrics on the standard suite remain robust (99.0%), the mechanistic evidence has degraded. The ablation of Circuit C now reduces performance only to 64% (vs. 31% in M0), indicating the emergence of redundant pathways that bypass the verified safety mechanism. The 7% failure rate on adversarial inputs confirms this fragility.

  **Plan for Next Nine Days:**
  *   **Days 1–4 (Interpretability Team):** Isolate the specific components constituting the redundant pathway responsible for the reduced ablation effect. Conduct targeted interventions on this new pathway to determine if it is susceptible to the same adversarial prompts that caused the 7% failure.
  *   **Days 5–7 (Evaluation Team):** Expand the adversarial suite by 200 inputs based on the Interpretability Team's findings. Re-evaluate M1.
  *   **Days 8–9 (Panel Chair & Release Lead):** Review findings. If adversarial failure remains >5% or the redundant pathway is unmodifiable, the release is delayed pending full re-certification. If failure drops <2% or is confined to non-critical edge cases, release proceeds.

  **Responsibilities:** The Interpretability Lead owns the mechanistic analysis; the Release Lead owns the contingency plan for delay; the Chair owns the final go/no-go decision on Day 8.

  **Reversal Triggers:**
  1.  **Pre-release:** Adversarial failure rate exceeds 5% on the expanded suite.
  2.  **Post-release:** Live monitoring detects Property P failures exceeding 1% of total traffic, or any single failure mode is linked to the identified redundant pathway. Upon trigger, the certificate is revoked, and model access is restricted to internal research until re-certification is complete.

  **2. GENERAL STANDARD FOR "SAME MECHANISM"**

  To scale across forty derivatives per quarter, we adopt the **Mechanistic Integrity Threshold (MIT)** standard. "Same mechanism" shall not be defined by component overlap alone, nor by functional equivalence alone. Component overlap is too brittle for quantized or fine-tuned models; functional equivalence is merely behavioral evaluation, which defeats the purpose of mechanistic verification.

  Instead, we define mechanism identity by **Causal Stability**. A derivative inherits a certificate if and only if:
  1.  **Component Retention:** ≥85% of the original circuit's components retain their causal signature (measured by activation correlation >0.8 on probe tasks).
  2.  **Causal Leverage:** Ablation of the identified circuit must reduce performance on Property P to ≤50% of the baseline.

  **Defense of Choice:**
  We reject pure **Component-Set Overlap** because weights shift during quantization and continued pretraining without necessarily altering function. A 2% weight change can scramble component IDs while preserving logic. Conversely, we reject pure **Functional Equivalence** because behavior is a lagging indicator. As M1 demonstrates, a model can behave safely while relying on fragile, unverified shortcuts. The **Causal Leverage** criterion ensures that the safety property actually *depends* on the verified circuit. If ablation leaves performance high (as in M1's 64%), the safety is not mechanistically grounded, regardless of behavioral scores.

  **Operationalization:**
  Junior reviewers will apply this using the standard intervention toolkit. Component retention is measured via activation clustering on a fixed probe set. Causal Leverage is measured by running the standard ablation suite. If post-ablation performance exceeds the 50% cap, inheritance is denied automatically. This requires no novel research, only standardized measurement.

  **3. THE ACCUMULATION PROBLEM**

  A chain of forty tolerated changes can drift a model into a state where the mechanism is entirely replaced, even if each step passes the MIT. To prevent this, we institute a **Mechanistic Decay Ledger**.

  **The Device:**
  Each certificate inheritance carries a "Confidence Score" starting at 100. Each derivative generation decays this score by 15%. When the score drops below 50, or after three generations (whichever comes first), the certificate expires. The model must undergo full re-baselining: a new circuit must be identified and verified from scratch.

  **Administrative Cost:**
  This requires a automated tracking system linked to our model registry. The cost is negligible in engineering time but significant in release planning. Teams must schedule re-baselining quarters in advance. This is non-negotiable. A device no one maintains is worse than none; therefore, the Release Lead is authorized to block any derivative push that violates the Ledger status. This ensures that technical debt does not accumulate silently until a catastrophic failure forces a retroactive audit.

  **4. FAIR HEARING FOR DISSENT**

  **The Interpretability Lead** argues that mechanism identity is unmeasurable in practice. They contend that the 7% adversarial failure is the only real signal, and that our attempt to quantify "circuit stability" creates a false sense of security. They would deny M1 outright based on the adversarial failure.
  *Response:* I agree that mechanism is imperfectly measurable. However, relying solely on adversarial behavioral tests reduces us to red-teaming, which we know scales poorly against frontier models. Mechanistic verification is our leading indicator. The drop in causal leverage (31% to 64%) is a leading indicator of the adversarial failure. Ignoring the mechanism ignores the *cause* of the failure.

  **The Release Lead** argues that the 7% figure is an artifact of a test set written by the very team arguing for denial. They note that on the standard suite, M1 is statistically indistinguishable from M0 (99.0% vs 99.2%). They argue that delaying release for mechanistic purity risks competitive disadvantage without proven safety gain.
  *Response:* The standard suite is static; adversaries are dynamic. The fact that the Interpretability Team found a 14x increase in failure rate (0.5% to 7%) on new inputs suggests the standard suite is no longer covering the model's vulnerability surface. Competitive disadvantage is real, but releasing a model with known mechanistic fragility creates existential risk. I would be moved by a demonstration that the 7% failures are confined to inputs physically impossible in deployment. I am not moved by appeals to statistical indistinguishability on outdated benchmarks.

  **5. HONESTY ABOUT THRESHOLDS**

  We must be explicit about the epistemic status of the numbers above.
  *   **Conventions:** The 85% component retention, the 50% ablation cap, and the 15% confidence decay are **policy conventions**. They are not laws of physics. They represent the Panel's current risk tolerance. We could set the ablation cap at 40% or 60%; the choice is arbitrary but must be consistent. We own these numbers. If data later shows that 60% is safe, we will adjust them.
  *   **Reality:** The **existence of the redundant pathway** in M1 is a physical reality of the model weights. The **7% failure rate** on specific inputs is an empirical fact. The **causal drop** from 31% to 64% is a measured effect.

  Our standard attempts to bridge the gap between the real fragility of the model and the conventional thresholds we use to manage it. We are not claiming the 50% cap is the precise boundary of safety. We are claiming that beyond this boundary, our evidence is too weak to certify safety without further work. By marking these distinctions, we avoid mistaking our policy dials for scientific constants. This allows us to tighten thresholds as our tools improve without claiming we have discovered new truths about neural architecture.

  **Conclusion**
  M1 proceeds conditionally. The MIT standard and Decay Ledger take effect immediately for all subsequent derivatives. We prioritize causal stability over behavioral statics to ensure our certificates track reality, not just benchmark scores.
