      *   Address dissent.
      *   End with epistemic humility.

      *Refining the Standard:* I need to make sure I don't just say "behavior." The whole point of mechanistic verification is that behavior is insufficient. So the standard must prioritize the *mechanism's integrity*.
      *   Proposed Standard: **Mechanistic Integrity Threshold (MIT).**
      *   Criteria 1: Component Retention (≥85%).
      *   Criteria 2: Causal Leverage (Ablation must drop performance to ≤50% of baseline).
      *   Why not just behavior? Because behavior masks fragility (as seen in M1's 7% adversarial fail).
