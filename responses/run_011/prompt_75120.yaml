          *   *Refined Standard:* The "Mechanistic Dependency Ratio" (MDR). Post-ablation performance must remain below a specific cap (e.g., 40%) to confirm the circuit is the primary driver. If redundancy emerges, the certificate degrades.

  4.  **Address the Accumulation Problem:**
      *   *Issue:* 40 derivatives/quarter. Small changes add up.
      *   *Solution:* **Mechanistic Decay Ledger.** Each inheritance reduces the "confidence budget."
      *   *Device:* After N derivatives (e.g., 3), or when cumulative weight change exceeds Y%, full re-baselining is mandatory.
