  3.  **Develop the General Standard ("Same Mechanism"):**
      *   *Choices:* Component overlap, causal effect magnitude, functional equivalence, training continuity.
      *   *Argument:* Component overlap is too brittle (weights change). Functional equivalence is just behavioral eval (defeats the purpose of mechanistic cert). Training continuity is too vague.
      *   *Selected Standard:* **Causal Stability Index (CSI).** A composite of component overlap and *magnitude of causal effect*.
      *   *Why:* We care about *why* the model is safe, not just *that* it is safe. If the circuit works less effectively (ablation impact drops), the safety margin is thinner, even if current performance is high.
