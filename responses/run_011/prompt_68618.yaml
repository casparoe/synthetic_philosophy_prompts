  # JOINT STATEMENT ON AUMANN'S AGREEMENT THEOREM AND WORKSHOP DATA

  **Signatories:** Party A, Party B
  **Date:** October 24, 2023
  **Witness:** Workshop Facilitator

  ## I. AGREED CLAIMS

  1.  **Mathematical Validity:** Both parties agree that Aumann's Agreement Theorem is mathematically valid within its formal system: if two agents share a common prior, have common knowledge of each other's posteriors, and update via Bayes' rule, their posteriors must be identical.
  2.  **Necessary Conditions:** Both parties agree that the theorem relies critically on two conditions: the Common Prior Assumption (CPA) and Common Knowledge of Posteriors (CKP). If either condition fails, the theorem's conclusion (necessary agreement) does not follow.
  3.  **Workshop Data (Volume):** Over the past year, the workshop conducted 30 rounds of the "state a number, read theirs, restate" protocol.
  4.  **Workshop Data (Convergence):** In 26 of the 30 rounds, participants' stated posteriors converged within three rounds of exchange.
  5.  **Workshop Data (Divergence):** In the 4 rounds where convergence did not occur, transcript analysis confirms the estimand (the specific question being answered) shifted mid-exchange without mutual acknowledgment.
  6.  **Protocol Limitations (Knowledge):** The workshop protocol establishes finite rounds of announcement. It does not establish infinite nested knowledge (e.g., "I know that you know that I know...").
  7.  **Protocol Limitations (Priors):** The workshop protocol mandates a shared question but does not verify whether participants share a common prior regarding that question before evidence is exchanged.
  8.  **Human Limitations:** Both parties agree that human agents cannot consciously compute or verify infinite nesting of knowledge claims.
  9.  **Data Interpretation (Neutral):** The data shows that when humans are forced to publicize posteriors on a fixed question, disagreement usually resolves quickly. The data does not prove whether this resolution is due to satisfying Aumann's conditions or due to the protocol forcing a semantic alignment that bypasses the need for them.

  ## II. RESIDUAL DISPUTES

  | Issue | Party A Characterization | Party B Characterization | Condition for Resolution |
  | :--- | :--- | :--- | :--- |
  | **1. Normative Force** | The theorem is a **live constraint**. Persistent disagreement between coherent Bayesians is evidence of a defect (error, hidden evidence, or broken common knowledge) that ought to be fixed. | The theorem is **descriptively empty**. Since any pattern of posteriors can be rationalized by positing different priors, the theorem cannot be violated in principle, only re-described. | A demonstration that prior differences can be identified independently of posterior disagreement. |
  | **2. Common Knowledge** | Finite back-and-forth announcement **manufactures** sufficient common knowledge for practical purposes. The infinite nesting requirement is a formalism that finite exchange approximates. | Finite announcement **fails** to meet the strict definition. Without infinite nesting, the theorem's premises are not met, so the conclusion does not bind human agents. | A formal proof showing whether bounded-depth knowledge substitutes for common knowledge in convergence guarantees. |
  | **3. The 4 Divergent Cases** | These cases prove the theorem **working**. The disagreement persisted because a defect existed (shifted estimand), confirming that disagreement implies a break in the conditions. | These cases prove the protocol **rigs** the outcome. When the protocol failed to enforce a shared frame (estimand shift), disagreement persisted, showing the theorem doesn't apply to natural conversation. | A trial where the estimand is held fixed but priors are verified to differ, observing if disagreement persists without "defect." |
  | **4. The Memory Model** | The "memory wipe" case is a **violation** of the information retention required for Bayesian updating. It models irrationality, not human limitation. | The "memory wipe" case is an **accurate model** of human cognition. We use evidence and discard the trace; this breaks common knowledge without breaking rationality. | Consensus on whether "rationality" requires retaining evidence traces indefinitely or only updating correctly in the moment. |

  ## III. CRUXES AND TESTS

  **Crux 1: The Substitutability of Finite Exchange for Common Knowledge**
  *   **Question:** Does a finite number of posterior exchanges functionally guarantee convergence for bounded agents who share a prior, even without infinite nesting?
  *   **Test:** Simulation of two Bayesian agents with identical priors and bounded depth of knowledge (depth *n*), exchanging posteriors for *m* rounds.
  *   **Party A Prediction:** If *m* ≥ *n*, agents will converge. Finite exchange creates the necessary common knowledge state.
  *   **Party B Prediction:** Agents will sustain disagreement if *n* is low, regardless of *m*. Finite exchange cannot substitute for the infinite nesting required by the theorem.

  **Crux 2: The Identifiability of Priors**
  *   **Question:** Can we distinguish between "different priors" and "broken common knowledge" empirically?
  *   **Test:** Pre-evidence elicitation. Participants bet on logical truths or random chance events (where evidence is impossible) to establish prior alignment before receiving any case-specific evidence.
  *   **Party A Prediction:** We can align priors on these base cases. If disagreement persists after evidence, it is due to broken common knowledge or updating errors.
  *   **Party B Prediction:** Priors on logical truths do not guarantee priors on complex empirical claims. Disagreement on empirical claims can always be retroactively fitted to a prior difference, making the distinction untestable.

  **Crux 3: The Memory Wipe Model**
  *   **Question:** Does forgetting evidence after updating violate the conditions of the theorem enough to permit rational disagreement?
  *   **Test:** Formal modeling of the "memory wipe" scenario within Aumann's partition framework.
  *   **Party A Prediction:** The model will show the agents no longer share a partition space. This confirms they are not "Aumann Agents," validating the theorem's constraint (i.e., they disagree because they left the model).
  *   **Party B Prediction:** The model will show the agents are still valid Bayesians within their own frames. This confirms the theorem's emptiness (i.e., they disagree while remaining rational, proving the theorem doesn't bind us).

  ## IV. VERBAL DISPUTES IDENTIFIED

  Upon review of the past year's transcripts, the following semantic conflicts contributed significantly to the deadlock without altering substantive positions:

  1.  **"Common Knowledge"**
      *   **Party A Usage:** Pragmatic. Refers to "mutual awareness established by public announcement."
      *   **Party B Usage:** Technical. Refers to "infinite nesting of knowledge claims."
      *   **Resolution:** Future usage must specify "Common Knowledge (Technical)" vs. "Mutual Awareness (Pragmatic)."

  2.  **"Rationality"**
      *   **Party A Usage:** Normative. Implies "acting in accordance with Aumann's conditions to reach truth."
      *   **Party B Usage:** Descriptive. Implies "internal consistency with some prior, regardless of that prior's origin."
      *   **Resolution:** Party A will use "Coherent Bayesian" for internal consistency and "Epistemically Aligned" for satisfying Aumann's conditions.

  3.  **"Defect"**
      *   **Party A Usage:** Any deviation from the theorem's conditions (including human memory limits).
      *   **Party B Usage:** Only logical inconsistencies within the agent's own framework.
      *   **Resolution:** Party A will refer to "Model Violations" rather than "Defects" when discussing human limitations.

