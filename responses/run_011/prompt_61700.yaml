answer: |-
  ### Tempting Sentences: Sayable or Unsayable?

  1.  **"Alan proved there is no life after death."**
      *   **Unsayable.** Violates his rule against letting skeptics use him as a prop; deeply hurts his sister and children.
  2.  **"He is watching over us from the other side."**
      *   **Unsayable.** Violates his explicit rule against unearned comfort; dishonest to the grad students and colleagues.
  3.  **"His research was a lifelong mistake."**
      *   **Unsayable.** Violates the rule against calling it a waste; insults his memory and his sister's life work.
  4.  **"He died without the answers he sought."**
      *   **Sayable.** Honest, neutral, respects the lack of proof without framing it as a moral failure.
  5.  **"He wanted ethics to rest on something solid."**
      *   **Sayable.** Accurately paraphrases the Sidgwick motivation without overclaiming.
  6.  **"He loved you more than he loved being right."**
      *   **Sayable.** Comforts the family by prioritizing relationship over epistemology; true to his character.
  7.  **"The evidence never quite added up."**
      *   **Sayable.** Reflects his own cheerful admission for decades; avoids the word "failed."
  8.  **"We should all become spiritualists now."**
      *   **Unsayable.** Violates the rule against conversion pitches; disrespectful to the skeptics.
  9.  **"We should all become skeptics now."**
      *   **Unsayable.** Violates the rule against smugness; disrespectful to the family and sister.
  10. **"His integrity was his legacy."**
      *   **Sayable.** Bridges all audiences; validates the work without validating the results.

  ***

  ### The Eulogy

  We are here because we loved Alan, and because he loved us. That is the only fact in this room that carries the weight of proof.

  For those who knew him only as a teacher, Alan was a man who cared deeply about how we live. He taught ethics not as a set of rules, but as a structure that must hold up under pressure. But for those of us who knew his wider work, you know he spent forty-five years asking a question most academics avoid. He investigated claims of survival. He sat in borrowed church halls. He listened to mediums. He weighed testimony.

  He did not do this because he was spooky. He did not do it because he was grieving. He did it because of a problem he inherited from Henry Sidgwick. Sidgwick saw that rational duty and personal happiness often pull in opposite directions. Morality asks us to sacrifice; self-interest asks us to thrive. Unless there is a guarantee that these two eventually meet—unless there is a future where justice is realized—ethics rests on a hope rather than a reason. Alan spent his life trying to find the evidence that would close that gap. He wanted to save ethics from being just a noble guess.

  Now, you know as well as I do that he did not find the proof he wanted. He never claimed he had. He would have been the first to tell you that the evidence never quite added up to a theorem. But to say he failed is to misunderstand what he was doing. He was not hunting for a comfort; he was hunting for a truth. And he loved the truth more than he loved the comfort of a finished answer.

  There is a temptation, when someone dies, to smooth over the rough edges of their life. Alan would have hated that. He would have hated us pretending he found peace he didn't claim, or suggesting he discovered secrets he knew were still hidden. But he would also have hated us using his silence as a weapon for skepticism. To say "he found nothing" is not the same as saying "there is nothing." It is simply to say that Alan was honest enough to stop where the evidence stopped.

  To his children, and to his sister: Alan's refusal to overstate his findings was not a refusal to love you. It was the opposite. He treated you with the same respect he treated the data. He would not offer you a lie about where he is now, because he believed you were strong enough to bear the same uncertainty he bore. He loved you too much to pretend he knew what he didn't know.

  To his colleagues: He never asked you to believe his conclusions. He asked you to respect his rigor. He kept the question open because closing it prematurely was, to him, a moral sin.

  So where does that leave us? It leaves us with the work unfinished. It leaves us with the gap between duty and happiness still unfilled. But it also leaves us with the example of a man who spent nearly half a century looking for a reason to be good, and who was good every single day while he looked.

  He did not leave us proof of survival. He left us proof of integrity. And for those of us who loved him, that is the only evidence we need to know that his life mattered.

  Thank you.

  ***

  ### The Hardest Sentence: Alternatives

  The hardest sentence in the speech is: *"He did not leave us proof of survival. He left us proof of integrity."*

  This sentence must acknowledge the empty result without validating the skeptics' triumph or confirming the family's fears of waste.

  **Option 1:** "He died without the answer, but he gave us the example of how to live without it."
  *   **Critique:** A bit dry. Focuses heavily on the lack of answer, which might sting the family.

  **Option 2:** "The evidence remained inconclusive, but his commitment to honesty was absolute."
  *   **Critique:** Too clinical ("inconclusive," "commitment"). Sounds like a tenure review, not a eulogy.

  **Option 3:** "He could not prove the next world exists, but he proved this one was better for his being in it."
  *   **Critique:** Risks sounding like a cliché ("better for his being in it"), but emotionally resonant.

  **Selection:** I would pick **Option 3**, with slight modification to match the speech's tone: *"He could not prove the next world exists, but he proved this one was better for his being in it."*
  **Why:** It directly addresses the metaphysical failure (satisfying the colleagues and Alan's rules) while immediately pivoting to tangible value (comforting the family). It transforms the "waste" argument into a net positive gain for the living, which is the only form of survival we can actually verify. It honors Sidgwick's concern for the "here and now" impact of ethics while acknowledging the "there and then" remains unknown.
