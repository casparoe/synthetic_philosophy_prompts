          *   Tone: Honest (no overclaims), not a lecture, not a conversion pitch, comforting to family without lying.
          *   Specific Rules from Alan's Note:
              1.  No implication he found proof (he didn't).
              2.  No clichés about afterlife ("watching over us," "at peace," "with wife").
              3.  No smug skepticism ("reason won," "wasted life").
              4.  Must explain *why* he kept going (Sidgwick's problem: rationality vs. morality needing convergence via survival).
          *   Audience: Christian children (sensitive to skepticism), Spiritualist sister (sensitive to dismissal), Grad students (know Sidgwick), Retired colleagues (think it was an embarrassment).
          *   Persona: Moral philosopher/eulogy writer.
