      *   *Sidgwick Connection:* The convergence of duty and self-interest requires survival. Alan sought this to save ethics, not to soothe grief. This intellectualizes the grief without denying it.

  3.  **Step 1: Brainstorming Sentences (Sayable/Unsayable):**
