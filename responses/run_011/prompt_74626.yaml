      *   **Deborah Mayo's Severe Testing:** Evidence $e$ supports hypothesis $H$ only if $e$ results from a procedure that would very likely have detected the falsity of $H$ if $H$ were false. (High probability of detection of error). It's about *probativeness*, not just fit.
