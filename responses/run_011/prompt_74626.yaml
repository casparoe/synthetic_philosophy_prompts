answer: |-
  ### The Severity Criterion and the Neuropsychological Model

  Deborah Mayo's account of evidence centers on the concept of **severity**. For evidence $e$ to support a hypothesis $H$, it is not enough that $e$ fits $H$. The fit must result from a procedure that had a high probability of detecting the falsity of $H$ if $H$ were indeed false. In Mayo's formulation: $e$ is a severe test of $H$ only if it is very unlikely that $e$ would occur if $H$ were false. Severity is not a measure of belief, but a measure of the *probativeness* of the method—the capability of the inquiry to rule out errors.

  Applying this lens to the Lewis-Williams and Dowson neuropsychological model (NPM) requires asking what would constitute a high-probability error detection in rock-art studies. A severe test would demand a prediction that the NPM makes but which alternative models (e.g., hunting magic, structuralism, pure aesthetics) would not, or which the NPM explicitly forbids.

  1.  **Motif Distribution:** A severe test would look for the absence of entoptic forms in contexts where trance is independently verified but the specific visual cortex constraints are absent, or conversely, the presence of "form constants" in contexts definitively unrelated to altered states of consciousness (ASC). If grids and spirals appeared ubiquitously in mundane domestic refuse or non-ritual contexts with the same frequency as in caves, the link to ASC would be severely undermined.
  2.  **Ethnographic Contradiction:** For the San case, a severe test would be an ǀXam dictation explicitly identifying a geometric motif as a representation of a mundane object (e.g., "this lattice is a fish trap") *without* reference to trance, lights, or spiritual experience.
  3.  **Cave Geometry:** For the Paleolithic extension, a severe test would involve the spatial correlation of the art. If the "tunnel" experience is neurologically fixed, one might expect the art to correlate with specific acoustic or visual constraints of the cave that induce such states. A cave with heavy entoptic imagery but lacking the sensory conditions hypothesized to trigger the trance would count against the hypothesis.

  ### Did the Evidence Clear the Bar?

  Under Mayo's scrutiny, the evidence offered for the NPM largely fails to clear the severity bar. The critics' charge that the model "can absorb every anomaly" points directly to a lack of severity. If a hypothesis can accommodate both the presence and absence of a motif by shifting stages (from raw entoptic to construal to iconic), the test is not severe.

  The shortfall is primarily a matter of **hypothesis flexibility** rather than merely "easy" tests. The three-stage model functions as a buffer against falsification. If a motif is geometric, it is Stage 1. If it is an animal, it is Stage 3 (iconic hallucination). If it is a hybrid, it is Stage 2 (construal). Because the model maps the *process* of perception rather than a fixed output, almost any visual data can be retrofitted into the sequence. Furthermore, the extension from the San to the Upper Paleolithic relies on analogy rather than independent testing. The "bridge" between nineteenth-century southern Africa and Ice Age Europe is asserted via the universality of neurology, but the *cultural* context of that neurology is assumed rather than tested. Finding spirals in a French cave fits the hypothesis, but it does not severely test it, because spirals could arise from technical constraints, decorative tradition, or other symbolic systems. The probability of finding spirals if the NPM were *false* is not low enough to warrant a severe pass.

  ### Where the Lens Goes Silent

  Here, the Mayoian lens encounters a structural wall. Mayo built severity for **statistical hypotheses** within experimental or observational frameworks where error probabilities ($\alpha$ and $\beta$) are definable. We can calculate the probability of a sample mean arising by chance if the null hypothesis is true.

  Rock-art claims are **singular historical narratives**. The claim is not "50% of caves contain entoptics," but "This specific bison on this specific wall was produced by a shaman in an altered state 15,000 years ago." There is no reference class from which to calculate the probability of the evidence arising if the hypothesis were false. We cannot rerun the Paleolithic. We cannot sample the population of Ice Age shamans. Consequently, strict severe testing yields **no formal verdict** here. The machinery of error statistics grinds to a halt because the "error probabilities" are unknowable.

  In this vacuum, **Inference to the Best Explanation (IBE)** arguably does better work. IBE does not require calculable error probabilities; it requires comparative plausibility. It asks: Does the NPM explain the conjunction of ethnography, neurology, and motif distribution better than the hunting-magic hypothesis? Does it offer greater consilience? IBE allows archaeologists to weigh the NPM's success in linking the ǀXam archive to the art against its failure to account for regional variations in Paleolithic style. It treats the hypothesis as a narrative framework to be weighed against competitors, rather than a statistical claim to be falsified. While IBE lacks the rigorous error-control of severity, it is structurally compatible with historical sciences where unique events preclude repeated testing.

  ### Demarcation in Archaeology

  The episode suggests that archaeology demarcates a legitimate reading from a compelling but untestable one not through statistical severity, but through **constraint**. A legitimate interpretation must specify what would count *against* it, even if that counter-evidence cannot be assigned a precise probability.

  The NPM controversy highlights the danger of "universalizing" explanations that rely on biological constants to bypass cultural particularity. While the neurology of the visual system is indeed universal, the *meaning* ascribed to those visual events is not. The lens of severity, even if inapplicable in its strict mathematical form, serves as a vital regulative ideal: it warns against theories that are too flexible to fail. Archaeology remains legitimate not when it mimics the laboratory, but when it rigorously defines the limits of its interpretations. The NPM is at its strongest where it is anchored in the ǀXam texts (where ethnographic constraint exists) and at its weakest where it leaps to Europe via analogy alone. The demarcation line lies in the willingness to tether universal biological claims to specific, vulnerable historical contexts, admitting that a motif *could* have been made for a reason other than trance. When a model claims to explain everything, it explains nothing; when it admits where it might be wrong, it earns the right to be read as science.
