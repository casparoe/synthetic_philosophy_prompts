answer: |-
  The dispute between you and your friend is not merely about a betting fraction; it is a collision between two distinct philosophies of risk. On one side stands the classical expected-utility framework, which treats risk as a property of an agent's preferences over uncertain outcomes. On the other stands the ergodicity economics argument, which treats risk as a property of the dynamic system itself, asserting that time averages supersede ensemble averages for any single agent. Your friend claims the Kelly criterion is a law of physics for wealth; you claim it is a specific taste masquerading as arithmetic. To resolve this, we must strip away the rhetoric and examine the mathematical skeleton of the gamble.

  The gamble is multiplicative. You begin with wealth $W_0$. In each round, you stake a fraction $f$. With probability $p=0.5$, wealth becomes $W_1 = W_0(1 + 0.5f)$. With probability $q=0.5$, wealth becomes $W_1 = W_0(1 - 0.4f)$. The un-staked portion earns nothing.

  Your friend focuses on the long-run behavior of a single trajectory. After $N$ rounds, with $k$ wins and $N-k$ losses, wealth is $W_N = W_0 (1 + 0.5f)^k (1 - 0.4f)^{N-k}$. By the law of large numbers, as $N \to \infty$, the ratio $k/N \to 0.5$. The behavior of wealth is governed by the geometric mean, or the exponential of the expected logarithm:
  $$ G(f) = \exp\left( 0.5 \ln(1 + 0.5f) + 0.5 \ln(1 - 0.4f) \right) $$
  Maximizing $G(f)$ is equivalent to maximizing the growth rate $g(f) = E[\ln(W_1/W_0)]$. Calculus dictates this maximum occurs at $f = 0.25$. At this fraction, wealth grows by roughly 0.6% per round. If you stake everything ($f=1$), the arithmetic expected return is indeed positive ($0.5 \times 1.5 + 0.5 \times 0.6 = 1.05$), but the geometric growth rate is negative ($\sqrt{1.5 \times 0.6} \approx 0.95$). Your friend is mathematically correct that betting everything leads to almost sure ruin in the infinite limit. The ensemble average (expected value) describes the average wealth across parallel universes, most of which you will not inhabit. The time average describes the path you actually walk.

  However, your friend's leap from "the time average describes the path" to "maximizing the time average is the only rational choice" is where the argument fractures. This brings us to your four objections.

  Your first objection, the Coincidence, is the most damning. Maximizing the long-run geometric growth rate is mathematically identical to maximizing expected utility with a logarithmic utility function, $U(W) = \ln(W)$. Your friend argues that the logarithm arises from the dynamics of time, not from psychology. He is half-right. The logarithm arises because wealth compounds multiplicatively. But the decision to *maximize the long-run growth rate* is itself a preference. Why prioritize the limit as $N \to \infty$? Why not prioritize the probability of doubling your money in ten rounds? Why not prioritize minimizing the variance of outcomes? The ergodicity argument successfully demolishes the naive use of arithmetic expected value for repeated multiplicative bets, but it does not abolish utility theory; it merely derives a specific utility function (Log) from a specific goal (asymptotic survival and growth). If an agent cares more about short-term consumption than long-term compounding, the "objective" growth rate is irrelevant. The ergodicity argument does not prove Log utility is the *only* rational preference; it proves Log utility is the *necessary* preference for an agent whose sole objective is infinite horizon survival.

  Your second objection, the Horizon, exposes the rhetorical sleight of hand in "long-run dominance." Asymptotic optimality is a limit property. For any finite $N$, the Kelly fraction does not necessarily maximize the probability of exceeding a specific target. For short horizons, or for agents with specific liabilities due before the "long run" arrives, fractions other than 25% may be superior. If you need to reach a certain wealth level to retire in twenty years, the strategy that maximizes the *median* wealth (Kelly) might yield a lower probability of hitting your specific target than a more aggressive or conservative strategy, depending on the target's height. The "long run" is a useful heuristic, but it is not a normative commandment for finite beings.

  Your third objection, the One-Shot case, is where your friend's position collapses entirely. Ergodicity is a property of dynamical systems evolving over time. A time average requires time. If the bet is offered exactly once, there is no trajectory to average. There is only a distribution of possible outcomes. In a one-shot scenario, the distinction between ensemble and time averages vanishes because the time average *is* the single outcome. To decide how much to stake, you must weigh the utility of the win against the disutility of the loss. If you are risk-neutral, you stake everything (positive EV). If you are risk-averse, you stake less. The ergodicity argument has no purchase here; it cannot generate a number without the assumption of repetition. If your friend prescribes 25% for a one-shot bet, he is smuggling in a Log utility preference and calling it physics.

  Your fourth objection, Absorbing States, is the one where your friend is actually stronger than you credit. You argue the growth rate is parasitic on an assumption of no ruin. In reality, Kelly dynamics naturally avoid ruin in continuous time because the bet size shrinks as wealth shrinks; you never bet your last dollar. However, in discrete reality, floors exist (bankruptcy, margin calls). If a hard floor exists, the unconstrained Kelly strategy might still breach it with non-zero probability over a finite horizon. Here, the "objective" growth rate must be modified by a constraint. Your friend might argue that survival is a prerequisite for growth, making the floor objective. But determining *how much* safety margin to keep above the floor is a preference. Do you accept a 1% risk of ruin for higher growth? Or 0.001%? The growth rate maximization handles the "no ruin" case elegantly, but the "low ruin" case requires a utility trade-off.

  **The Verdict**

  You are right, and your friend is wrong, though his error is sophisticated. The Kelly criterion is not a rival foundation to expected utility; it is a specific solution within the expected utility framework. It is a preference wearing a disguise. The disguise is convincing because the preference for long-term survival is nearly universal among investors, and the mathematics of multiplicative dynamics makes Log utility the natural tool for that preference. But "natural" is not "objective."

  The ergodicity economics literature performs a vital service by correcting the naive application of ensemble averages to single trajectories. It correctly identifies that for repeated multiplicative risks, the arithmetic mean is a misleading metric of performance. However, it fails to establish itself as a normative theory of choice because it cannot justify its objective function without appealing to a preference for the long run. It solves the "how" of compounding but presupposes the "why." To claim that maximizing the time average is the *only* rational choice is to assert that all agents should care exclusively about infinite-horizon geometric growth. That is a value judgment, not a fact of arithmetic.

  Therefore, geometric rationality is not a genuine rival foundation. It is a robust heuristic for a specific class of problems (repeated, multiplicative, no hard floor) derived from a specific utility function (Log). When the conditions change, the "arithmetic" breaks down, and you must revert to explicit preference modeling.

  **The Prescriptions**

  Because the verdict is that utility theory is the master framework, the prescription depends on the constraints of the game, which alter the relevant utility function.

  **1. The One-Shot Case:**
  If the bet is offered once and never again, the ergodic argument is void. There is no time to average. You are facing a distribution of outcomes: 50% chance of $+50\%$ return on stake, 50% chance of $-40\%$ return.
  *Prescription:* There is no single "correct" fraction. It depends entirely on your risk aversion. However, if we assume a standard rational agent with decreasing marginal utility of wealth (which is empirically robust), you should stake significantly *more* than the Kelly fraction, potentially up to the full expected-value maximizing amount if the stake is small relative to total wealth. If the stake is your entire net worth, a Log-utility agent would still stake 25%, but that is due to the utility function, not ergodicity. For a one-shot bet where survival is not at stake, maximizing Expected Value is defensible. If forced to give a number for a typical risk-averse human: **Stake 25% to 40%**. The Kelly fraction is a safe lower bound, but the "ergodic" justification for it is absent.

  **2. The Forty-Year Repeat (No Floor):**
  Here, the dynamics are multiplicative and the horizon is long. The law of large numbers begins to bite. The variance of the log-wealth grows linearly with time, but the mean grows linearly as well. The probability that the Kelly strategy underperforms any other strategy vanishes as time increases.
  *Prescription:* **Stake 25% (Full Kelly).** In this specific regime, your friend's "arithmetic" aligns with the optimal utility solution for long-term growth. The time average becomes the dominant reality. Deviating from 25% reduces your long-term compound return and increases the probability of underperformance relative to the growth-optimal path. Here, the ergodicity insight is practically indistinguishable from objective truth because the horizon is long enough to make the limit theorems relevant.

  **3. The Forty-Year Repeat (With Absorbing Floor):**
  This is the realistic scenario. You have a minimum wealth level (a floor) below which you are expelled. The pure Kelly strategy maximizes growth but does not guarantee survival over a *finite* horizon with a *hard* floor. There is a "risk of ruin" distribution.
  *Prescription:* **Stake less than 25% (Fractional Kelly).** You must solve a constrained optimization problem: Maximize $E[\ln(W_T)]$ subject to $P(W_t < \text{Floor}) < \epsilon$ for all $t \leq T$. The exact fraction depends on the distance to the floor and your tolerance $\epsilon$. If the floor is close, you might stake 10% or 15%. This prescription confirms your suspicion: the "objective" growth rate is parasitic on the absence of ruin. Once ruin is possible, you must trade off growth for safety, and that trade-off is a preference (the value of $\epsilon$), not arithmetic.

  **Conclusion**

  Are these three prescriptions generated by a single principle? Yes: **Maximize Expected Utility.**
  In the one-shot case, the utility function reflects your immediate risk tolerance.
  In the forty-year case, the utility function effectively becomes Logarithmic due to the compounding dynamics, making Kelly the optimal solution.
  In the floor case, the utility function includes a penalty term for breaching the constraint.

  Your friend attempted to replace the agent's utility function with the system's dynamics. He succeeded in showing that the dynamics constrain the *feasible* utility functions for long-term survival, but he failed to show that they dictate the *choice* of utility function. The 25% figure is not a fact of nature like the speed of light; it is the solution to an equation where the variables include the agent's goal. If the goal changes, the number changes. You were right to suspect a preference in disguise. The disguise is elegant, and in the long run, it fits perfectly, but it remains a costume. The mathematics of ergodicity describes the cage, but expected utility describes the bird.
