answer: |-
  The box sits on the laminate table, cardboard yellowing at the edges. The kitchen light hums.

  "You keep looking at it as if it might speak," one voice says. "It won't. She's gone. The power she held over you ended when her breath did."

  "The power didn't end," the other replies. "It was transferred. When she asked, and I agreed, she handed me a constraint. I took it. It belongs to me now, not her. That's why her death doesn't dissolve it."

  "But the deadline passed. Two years ago. You were to burn them within a year. You didn't. Doesn't that void the contract?"

  "It was a promise, not a contract. Missing the deadline was a breach, not a dissolution. I owe her the performance still, plus the debt of the delay. The obligation persists because I bound myself, not because conditions were met."

  "That sounds like magic. You bound yourself to a ghost. On my view, a promise is a tool to manage expectations. She expected the burning. She expected the secrecy. She can no longer expect anything. The engine of the obligation has no fuel. The only expectations left are your sister's, and you haven't engineered those. She expects truth, not silence."

  "If it's just about expectations, then promises are worthless the moment someone dies. Or the moment they forget. But we feel bound even then. You have to explain why that intuition exists if it's groundless."

  "I don't say it's groundless. I say it's a habit. We feel bound because usually the promisee is watching. Here, no one is watching. But look at the cost. Your sister is publishing falsehoods. If you burn the box, she publishes lies. If you open it, you break the secrecy promise. If you archive it, you delay the truth. The expectation theory says you weigh the harm of disappointed expectations. Her expectations are zero. Your sister's harm is real. The math is simple."

  "The math ignores the authority. I gave my word. That act created a duty owed *to* her. Not concerning her, *to* her. She is the creditor. You can't pay off a creditor by paying someone else, even if the someone else is hurting."

  "Can you owe something to a person who no longer exists? You can owe duties concerning them—don't slander the dead. But owing *to* them implies they can claim it. She can't. So what remains is the social practice. And the social practice exists to prevent harm from reliance. There is no reliance here."

  "Consider the archive. If I deposit them sealed for seventy-five years, I keep the secrecy. I prevent the sister's immediate harm. I preserve the letters for a time when the people involved are gone. Is that keeping the promise?"

  "On my view, no. The instruction was to burn. Destruction was the exercise of the power she gave you. Archiving is preserving. You are substituting your judgment for hers. That violates the power transfer."

  "On my view, it might count as breaking it well. The core expectation was secrecy during her life and shortly after, to protect reputations. Seventy-five years secures that. It minimizes the harm to her memory while allowing the truth to eventually surface. It's a functional substitute."

  "But you admit it's a substitute. You admit it's a break."

  "I admit it's a deviation. But if the obligation is based on not exploiting expectations, and the archive respects the spirit of the expectation without the literal destruction, the moral debt is lighter. You seem to think the debt is binary. Kept or broken."

  "I think the debt is specific. I promised to burn. If I archive, I have breached. Then the question is performance-or-compensation. Since I cannot perform the burning now without losing the evidence my sister needs, I must compensate. But to whom? You say I can't compensate her. So I am stuck in default."

  "Exactly. You are stuck. On my view, you aren't in default. The obligation shifted. Since the expectation engine is dead, you are free to minimize harm. You owe it to your sister to correct the record. You owe it to the truth. The promise is a shadow; the harm is solid."

  "You keep saying the promise is a shadow. But if I burn them, I feel I have done something right, even if no one knows. If I give them to my sister, I feel I have done something wrong, even if it helps her. That feeling is the residue of the power I accepted."

  "That feeling is guilt over breaking a habit. It's not evidence of a metaphysical bond. But I will concede this: my view struggles to explain why we feel bound to the dead when no one is watching. It makes morality too public. It suggests that if I could break a promise to a dying man in secret, with no fallout, it would be permissible. That feels wrong."

  "And I will concede this: my view struggles to explain why words spoken by a dead woman should outweigh a living woman's interest in not being misled about her own mother. It makes the past tyrannical. It suggests authority survives the person, which is metaphysically heavy."

  "So where does that leave the box?"

  "It leaves you deciding what kind of debtor you are. Do you owe a debt to a memory, or a debt to the living?"

  "If I archive it, I am trying to pay both. But you say that's still a breach."

  "It is. But perhaps a breach that allows you to sleep. On my view, you must burn them to clear the debt to her, then tell your sister you cannot verify her claims. You perform, then absorb the cost of the silence."

  "That destroys the truth."

  "That honors the bond. On your view, I give the letters to the sister. I break the bond to prevent the harm. I absorb the guilt of the break as the cost of the utility."

  "That destroys the bond."

  "See? We agree on the costs. We disagree on the currency. You think the currency is authority. I think it is harm."

  "But if I archive it? Seventy-five years. No one alive is harmed. Her reputation is safe. My sister waits."

  "Then you have prioritized peace over truth and over obedience. You have chosen a third way. But you asked us what you owe."

  "I owe performance," the first voice insists. "Or compensation to her estate, which is impossible. So I owe performance. Burn them."

  "I owe harm reduction," the second voice counters. "The expectation is extinct. The sister is not. Give them to her."

  "The box remains on the table. The light hums. Neither voice reaches for it."

  "The disagreement isn't about the letters," the first says. "It's about whether the dead can hold power."

  "No," the second replies. "It's about whether the living are only bound by what they can be punished for."

  "And we aren't any closer."

  "No. But now you know what you are choosing between. Not truth versus lies. But authority versus consequence."

  ***

  **Note**

  I believe the **Expectation/Reliance view** handles your specific case better, though with moderate confidence (roughly 65%). The reason is that the Will Theory (Power) faces a severe metaphysical hurdle when the promisee is dead: explaining how a non-existent entity retains the standing to hold a claim against the living, especially when honoring that claim actively harms a living person (your sister). The Will theorist must argue that moral authority survives biological death in a way that overrides present harm, which is a heavy lift. The Expectation theorist can argue that while the mother's expectations matter, they cannot outweigh the tangible harm of misinformation affecting a living descendant, especially since the mother cannot be "wronged" in a experiential sense.

  However, both characters were stretched. The **Will theorist** was forced to concede that the obligation is "owed to" the dead without explaining how the dead receive ownership, relying on a somewhat mystical notion of transferred constraint. The **Expectation theorist** was forced to admit that their view makes secret promise-breaking to the dead permissible if no one finds out, which contradicts the strong intuition that promises bind even in secret. Both views strain when the promisee cannot enforce or experience the outcome, suggesting your case lies in a gap neither theory perfectly fills.
