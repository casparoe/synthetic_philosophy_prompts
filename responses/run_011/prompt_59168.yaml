answer: |-
  **Project Title:** The Normalization Problem: Interpersonal Utility Comparison as Index Number Theory

  **Statement of the Problem**
  Contemporary debates on interpersonal utility comparison (IUC) are framed as epistemic or metaphysical problems: do we have access to other minds, and what information is contained in utility representations? This project argues that this framing obscures the actual difficulty, which is structural. The core obstacle to aggregation is not a lack of information about mental states, but a lack of agreed-upon normalization anchors. Before utilities can be aggregated, they must be scaled—fixed to a common zero point and unit. Whether the zero sits at death, subsistence, or a life-not-worth-living, and whether the unit is defined by risk attitudes or just-noticeable differences, determines distributive verdicts independently of the underlying data.

  The central research question is determinate: **To what extent does the structure of intrapersonal temporal comparison resolve the normalization circle inherent in interpersonal utility aggregation?**

  Current literature treats the choice of anchor as either arbitrary (leading to skepticism) or fixed by stipulation (leading to dogmatism). This project treats it as a normalization problem analogous to index number theory in economics. Just as price indices require a base year and a basket of goods to compare values across time, utility aggregation requires a base person and a unit of well-being to compare values across persons. The project investigates whether the successful practice of intrapersonal comparison across time provides a normative template for solving the interpersonal normalization circle, or whether the interpersonal case introduces a discontinuity that renders the analogy void.

  **Critique of Existing Positions**
  The proposed approach bypasses the stalemate between full comparability and partial comparability accounts.

  *   **The Harsanyi Line:** Aggregation theorems typically assume commensurability as a precondition. Harsanyi's utilitarianism requires a shared zero and unit to sum utilities, but offers no non-circular justification for selecting them. The proposal argues that Harsanyi treats a normalization choice as a metaphysical fact. By assuming the scale is fixed, the theory hides the ethical choice involved in setting the anchor.
  *   **The Sen Line:** Sen's partial comparability acknowledges the indeterminacy but retreats to intersectionist methods—accepting only those verdicts invariant across admissible scalings. While intellectually honest, this treats the normalization problem as a loss of information rather than a structural feature of aggregation. It manages the uncertainty without explaining why certain anchors feel permissible in intrapersonal cases but controversial in interpersonal ones.

  Both positions treat the scale as something discovered (or not discovered) in the data. This project argues the scale is a constraint imposed *on* the data, and the justification for that imposition is the missing link in welfare economics.

  **Methodology: Six-Month Plan**
  The work will proceed in three phases, moving from formal mapping to normative analysis.

  *   **Months 1–2: Formalizing the Analogy.** I will map the formal structure of index number theory (e.g., the problem of base-year dependence in price indices) onto utility aggregation. The goal is to demonstrate that changing the utility anchor produces the same structural indeterminacy as changing the base year in a price index. Deliverable: A formal note demonstrating that distributive verdicts vary with normalization anchors even holding all empirical data constant.
  *   **Months 3–4: The Intrapersonal Wedge.** I will analyze how individual agents normalize utility across time. When an agent asks, "Was the decade in grad school worth the surgery?", they implicitly select anchors (e.g., health status, income baseline). I will investigate what constrains these choices. Is it memory? Narrative coherence? Biological continuity? Deliverable: A draft chapter identifying the constraints that make intrapersonal normalization appear non-arbitrary.
  *   **Months 5–6: Synthesis and Evaluation.** I will test whether the constraints identified in Months 3–4 can be transposed to the interpersonal case. If intrapersonal normalization relies on psychological continuity, does interpersonal normalization fail because that continuity is absent? Or is there a normative equivalent (e.g., shared citizenship, moral status)? Deliverable: Final manuscript determining whether the "circle" of anchor selection is vicious (arbitrary) or virtuous (coherentist).

  **Justification of Approach**
  This project avoids three common retreats:
  1.  **Empirical/Psychophysical:** Reducing utility to brain states or willingness-to-pay avoids the normative question. Even if we measure neural firing rates perfectly, we still must decide where zero firing stands relative to a life worth living.
  2.  **Cardinal by Fiat:** Adopting a specific theory (e.g., hedonism) to fix the scale dogmatically shuts down the inquiry. This project accepts cardinality but interrogates the scaling.
  3.  **Retreat to Partial Comparability:** While safe, this yields too little guidance for policy. If we can explain *why* we normalize intrapersonally, we may be licensed to normalize interpersonally without pretending the uncertainty doesn't exist.

  The index number analogy is chosen because it isolates the measurement structure from the metaphysics. Economists have solved normalization for prices without solving the metaphysics of value; philosophers should be able to do the same for utility.

  **Success and Failure Conditions**
  *   **Success:** The project succeeds if it identifies a specific constraint in intrapersonal comparison that is either present or absent in the interpersonal case. For example, if intrapersonal normalization relies on memory continuity, and I can show that a normative equivalent exists for interpersonal comparison (e.g., shared institutional framework), the normalization circle is broken. Alternatively, success consists in proving the circle is vicious, thereby establishing a rigorous impossibility result for strict aggregation that is distinct from Sen's informational constraints.
  *   **Failure:** The primary failure condition is confirming my own fear: that index number theory is merely a technical costume for ethical stipulation. In price theory, the transformation is an empirical fact about markets; in welfare, it is an ethical choice. If the project concludes that the "normalization problem" is just the old problem of ethical disagreement relabeled, no progress has been made. A second failure condition is finding the intrapersonal analogy disanalogue—for instance, if intrapersonal comparison turns out to be just as arbitrary as interpersonal comparison, the wedge collapses.

  **Feasibility and Scope**
  Six months is sufficient for the conceptual mapping and the philosophical argument, but tight for any heavy formal modeling.
  *   **Risk:** The formal mapping in Months 1–2 could expand into a technical economics project, consuming the timeline.
  *   **Mitigation:** If the formal modeling stalls, I will cut the mathematical derivation of index analogues and rely on established results in measurement theory, focusing the remaining time on the normative implications of the intrapersonal wedge. The core philosophical contribution—the distinction between metaphysical uncertainty and normalization choices—does not depend on deriving new theorems, but on reinterpreting existing ones.
  *   **Cutting Scope:** If necessary, I will restrict the intrapersonal analysis to standard rational choice models rather than engaging with the broader psychology of temporal perception. This keeps the project within the lane of social choice theory where the aggregation problem is most acute.

  The outcome will be a paper suitable for publication in ethics or economic philosophy, arguing that the impasse in interpersonal comparison is not a lack of data, but a lack of clarity regarding the normalization rules we already implicitly accept.
