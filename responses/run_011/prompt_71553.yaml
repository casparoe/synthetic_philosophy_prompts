answer: |-
  **Headline Result: The Impossibility Theorem**
  You cannot simultaneously judge past transactions by norms available at the time, insist that colonial legality not function as a shield, and maintain decisions predictable enough for a three-curator staff to apply. One must go. Discard "norms available at the time." It is a retentionist shield that validates coercive structures by appealing to the moral blind spots of the colonizer. If you keep it, you cannot ignore colonial law without appearing arbitrary to your staff. If you ignore colonial law, you are necessarily applying contemporary moral norms to past events. For a small staff, predictability requires a clear moral standard, not a historical simulation.

  **The Specification: Nine Desiderata**

  1.  **Evidentiary Threshold for Mass Acquisitions**
      *   *Motivation:* The four thousand everyday objects with sparse records.
      *   *Tag:* Non-negotiable.
      *   *Tuesday Test:* Without this, curators spend years researching individual beads instead of processing claims, causing the backlog to swallow the policy.

  2.  **Claimant Hierarchy Protocol**
      *   *Motivation:* The regalia claimed by a state, a traditional council, and a diaspora group simultaneously.
      *   *Tag:* Non-negotiable.
      *   *Tuesday Test:* Without this, staff mediate endless political disputes between claimants rather than assessing the museum's liability.

  3.  **Non-Visual Access Definition**
      *   *Motivation:* The ritual objects requiring restriction versus the funder's access mandate.
      *   *Tag:* Non-negotiable.
      *   *Tuesday Test:* Without this, staff must choose between violating sacred law or breaching funding contracts, forcing ad hoc dishonesty.

  4.  **Coercion Vitiates Consent Standard**
      *   *Motivation:* The throne bought fairly after a punitive expedition burned the capital.
      *   *Tag:* Non-negotiable.
      *   *Tuesday Test:* Without this, staff must argue whether a price was "fair" amidst violence, leading to unresolvable moral haggling over receipts.

  5.  **Victim Identification Rule**
      *   *Motivation:* The object taken by Region A from Region B, then by Europeans, now claimed by Region A's successor.
      *   *Tag:* Merely negotiable.
      *   *Tuesday Test:* Without this, staff return objects to intermediate imperialists, potentially perpetuating historical subjugation under new management.

  6.  **Custodial Default for Unclaimed Items**
      *   *Motivation:* The object with no claimants or records.
      *   *Tag:* Camp commitment disguised as a criterion.
      *   *Tuesday Test:* Without this, staff waste time searching for ghosts; with it, they treat it as curation, not justice, and move on.

  7.  **Administrative Burden Cap**
      *   *Motivation:* The three curators and fractional researcher.
      *   *Tag:* Non-negotiable.
      *   *Tuesday Test:* Without this, the policy demands provenance research levels only large national institutions can afford, guaranteeing non-compliance.

  8.  **Public Justification Requirement**
      *   *Motivation:* The public funder needing a written, applicable policy.
      *   *Tag:* Non-negotiable.
      *   *Tuesday Test:* Without this, decisions look like arbitrary favors, inviting political interference and jeopardizing future grants.

  9.  **Legal Irrelevance of Colonial Title**
      *   *Motivation:* The regalia sold at auction in 1954 under valid law but taken by force in 1897.
      *   *Tag:* Camp commitment disguised as a criterion.
      *   *Tuesday Test:* Without this, staff hide behind auction records, ignoring the original violence that generated the title.

  **The Knockout Requirement**
  The single requirement that knocks out the most otherwise respectable views is **Coercion Vitiates Consent Standard** (Item 4). This eliminates the "Corrective-Justice/Property" account's reliance on valid transfer and the "Custodial-Welfare" account's reliance on legal acquisition. It forces the institution to acknowledge that a "fair price" paid under the shadow of a burned capital is not a valid transaction. This is the hardest pill for encyclopedic museums to swallow because it invalidates the majority of their nineteenth-century acquisitions without requiring proof of specific theft. It shifts the burden from proving theft to proving the absence of coercion, which is often impossible.

  **Composite Correction**
  Your description of the unclaimed object (Composite 6) is misdescribed. This is not a question of justice; it is a question of custody. Restitution implies a wronged party. Where there is no claimant and no identifiable community, there is no claimant to be made whole. Treating this as a restitution case invites speculative appropriation by groups seeking to expand their heritage portfolio. It should be categorized as a curation decision: hold, deaccession, or share based on scholarly value, not ethical debt. Do not waste committee time applying restorative justice frameworks to orphaned objects.

  **Scorecard: How Existing Accounts Fail**

  | Account | Performance Against Desiderata | Verdict |
  | :--- | :--- | :--- |
  | **Corrective-Justice / Property** | Fails *Evidentiary Threshold* and *Coercion Standard*. Requires specific proof of theft for each object, impossible for the 4000 everyday items. Validates the throne purchase if receipt exists. | **Unusable.** Too narrow for mass colonial collecting; ignores structural coercion. |
  | **State-Succession / Legalist** | Fails *Victim Identification* and *Legal Irrelevance*. Returns objects to modern states that may not represent original owners (Region A case). Hides behind colonial auction laws. | **Retentionist.** Protects the museum legally but fails ethically on the regalia and throne. |
  | **Custodial-Welfare (Humanity)** | Fails *Non-Visual Access* and *Claimant Hierarchy*. Claims objects belong to "humanity" (your director's view), ignoring specific community sanctity. Prioritizes display over ritual safety. | **Imperial.** Treats the "Directors' Statement" as a criterion rather than a claim. Violates sacred restrictions. |
  | **Sacred-Objects / Persons-in-Relations** | Fails *Administrative Burden* and *Evidentiary Threshold*. Treats every object as potentially alive/sacred. Requires deep ethnographic knowledge for 4000 items. | **Idealistic.** Morally strong on ritual objects, but collapses under the scale of a 60k collection. |

  **Final Position**
  Your director's appeal to the joint statement by encyclopedic museum directors—that collections belong to all humanity—is a retentionist prejudice wearing the costume of a criterion. It asserts a universal ownership that overrides specific historical wrongs. It fails the *Non-Visual Access* test immediately: if an object belongs to humanity, humanity must see it, violating the ritual restrictions of the claimant community. It also fails the *Claimant Hierarchy* test by placing the museum's judgment above the traditional council's authority.

  You must build your policy on the **Coercion Vitiates Consent** standard. It is the only way to handle the throne case without getting bogged down in price comparisons. It acknowledges that the punitive expedition created the market conditions. For the 4000 everyday objects, apply the **Evidentiary Threshold**: if records are sparse, assume coercion is possible and prioritize community partnership over retention. For the regalia, use the **Claimant Hierarchy**: prioritize the traditional office over the state or diaspora, as the object belongs to the office, not the nation or the displaced.

  This approach will anger your director and likely some funders initially, but it is the only one that survives the Tuesday test. It allows your three curators to make decisions without needing a PhD in colonial legal history for every box. It accepts that you cannot fix everything, but you can stop validating the violence that filled the stores. Drop the impossibility triad's first limb (past norms), accept the knockout requirement (coercion), and treat the unclaimed objects as curation, not justice. That is a usable policy.
