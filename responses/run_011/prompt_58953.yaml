answer: |-
  1. Gather two identical rooms or partition one space, a whiteboard visible to all, and a bag of chocolate coins for payouts. Prepare distraction sheets (hard arithmetic) and two identical "junction" signs to place on the table during decision moments. Ensure no clocks or counters are visible in the junction space to prevent temporal tracking.

  2. Each driver commits to a continuation probability $p$ on a card, then enters the junction room where they face an exit decision without knowing if it is the first or second. If they choose "Continue," they exit the room, complete a 90-second distraction task, and are returned to the identical junction room for a potential second decision. Explicitly forbid players from marking cards or counting rounds, framing the distraction task as "traffic fog" that wipes short-term memory of the specific journey.

  3. Award 0 coins for exiting at the first junction, 4 coins for the second, and 1 coin for driving past both exits. Run single-trial rounds where drivers write $p$ ex-ante, then make live junction decisions to test if they deviate from their own optimal plan. Ex-ante maximization of $4p(1-p) + p^2$ yields $p=2/3$, which satisfies the junction indifference condition $4 \frac{p}{1+p} = \frac{1}{1+p}(4(1-p)+p) + \frac{p}{1+p}(1)$.

  4. Ask drivers who deviated from their plan why the junction felt different than the planning chair, highlighting the shift from ex-ante commitment to ex-post temptation. Map their hesitation to the updating of beliefs: realizing that being at a junction makes it more likely you are at the second one, which changes the value of continuing. Conclude by showing that their strategy choice $p$ literally constructs the probability of where they are, making the self-consistency condition the only stable solution.

  5. Players will deduce that a second decision opportunity guarantees they are at Exit 2, allowing them to perfectly reconstruct their location by round two. Patch this by enforcing a strict norm that chocolate is forfeited if anyone admits to using round-counting logic, forcing them to roleplay the amnesia. Acknowledge that the activity cannot simulate true imperfect recall, so you must verbally supply the concept that the agent's strategy determines their credence of location.
