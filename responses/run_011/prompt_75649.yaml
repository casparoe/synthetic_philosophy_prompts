answer: |-
  ### The Decision Procedure: "The Ten-Month Standard"

  **Time Limit:** 30 Minutes
  **Operators:** Dean or Designated Teacher
  **Inputs:** Complaint statement, Student statement, Orientation records.

  **Terminal Outcomes:**
  1.  **No Obligation:** Complaint dismissed; student informed no breach occurred.
  2.  **Obligation with Excuse:** Rule stands, but no sanction due to reasonable confusion; student briefed.
  3.  **Obligation to Comply:** Rule stands; student must adhere; file entry if repeated.
  4.  **Comply While Registering Objection:** Student must adhere for social cohesion but is permitted to express disagreement privately to the host.
  5.  **Decline to Comply:** Student is excused from the norm; host family briefed on necessity.
  6.  **Refer to Dean:** Case exceeds operator authority (Conscience/Safety/Legal ambiguity).

  ---

  #### Step 1: The Hard Stops (Safety, Law, Conscience)
  **Question:** Does the requested behavior violate local law, create immediate physical danger, or require the student to violate a core religious/moral doctrine they held *prior* to arrival?
  *   **Sufficient Answer:**
      *   *Law/Danger:* Yes = **Obligation to Comply** (if law/safety) or **Refer to Dean** (if law is ambiguous).
      *   *Conscience:* Yes = **Decline to Comply** (if doctrine is verifiable/pre-existing) or **Refer to Dean** (if doctrine is vague/newly adopted).
  *   **Hand-off:** If the student claims a religious objection (e.g., the bowing case), do not adjudicate the theology. **Refer to Dean.**
  *   **If No:** Proceed to Step 2.

  #### Step 2: The Norm Type (Coordination vs. Expression)
  **Question:** If one person opts out of this practice, does the practice cease to function for everyone immediately (Coordination), or does it merely lose value over time (Expression/Status)?
  *   **Sufficient Answer:**
      *   *Coordination (Collapse):* Traffic signals, queuing, currency usage. One opt-out breaks the system.
      *   *Expression/Status (Degrade):* Tipping, greetings, seating, dress. One opt-out is rude; many opt-out changes the culture.
  *   **Logic:** Coordination norms bind guests immediately. Expression norms bind based on Step 4 (Membership).
  *   **If Coordination:** Go to Step 5.
  *   **If Expression:** Proceed to Step 3.

  #### Step 3: The Rationale Check (Stated vs. Operative)
  **Question:** Is the reason locals give for the norm the same as what the norm *does*?
  *   **Sufficient Answer:**
      *   *Match:* "We bow to show respect" (It does show respect).
      *   *Mismatch:* "We tip to help the waiter" (It actually signals social standing).
  *   **Logic:** If the rationale is a mask for hierarchy (Status Marker), the binding force is lower for a guest. If the rationale is functional (Respect/Gratitude), the binding force is higher.
  *   **If Status Marker:** Proceed to Step 4.
  *   **If Functional:** Proceed to Step 5.

  #### Step 4: The Membership Threshold (Guest vs. Temporary Member)
  **Question:** Has the student resided long enough to be treated as a "temporary member" of this specific community (household/school)?
  *   **Sufficient Answer:**
      *   *Guest (0–3 Months):* Bound only by Coordination and Safety norms. Status norms are optional.
      *   *Temporary Member (4–10 Months):* Bound by Expression and Status norms within the host household and school.
  *   **Logic:** Ten months is not citizenship, but it is residency. You cannot live in a house for eight months and claim guest privilege on household hierarchy.
  *   **If Guest:** **Obligation with Excuse.**
  *   **If Temporary Member:** Proceed to Step 5.

  #### Step 5: The Visibility Test (Private vs. Public)
  **Question:** Is compliance invisible and non-compliance conspicuous?
  *   **Sufficient Answer:**
      *   *Yes:* (e.g., Standing in a queue, bowing to an elder). Non-compliance signals "I am not one of you."
      *   *No:* (e.g., Eating while walking, internal posture).
  *   **Logic:** High visibility increases the social cost of non-compliance. High social cost creates an obligation to comply to protect the program's reputation, even if the norm is trivial.
  *   **If High Visibility:** **Obligation to Comply** (or **Comply While Registering Objection**).
  *   **If Low Visibility:** **No Obligation** (or **Obligation with Excuse**).

  #### Step 6: The Reliance Check (Invited Expectation)
  **Question:** Did the student explicitly or implicitly invite the host to rely on them following this norm?
  *   **Sufficient Answer:**
      *   *Yes:* (e.g., Accepted money for a group meal, agreed to represent the school at an event).
      *   *No:* (e.g., Personal time, private interaction).
  *   **Logic:** Invited reliance creates a contract.
  *   **If Yes:** **Obligation to Comply.**
  *   **If No:** Defer to Step 5 outcome.

  ---

  ### Analysis of Distinctions

  **Distinctions That Must Survive:**
  1.  **Coordination (Collapse) vs. Expression (Degrade):** This is your first idea. It must survive. It is the only objective way to distinguish traffic lights from tipping. Coordination norms bind everyone equally because they are functional infrastructure. Expression norms bind based on relationship depth.
  2.  **Membership (Guest vs. Temporary Member):** This must survive. A student in Month 1 is a guest; a student in Month 8 is a resident. The obligation shifts. Without this, you either oppress new arrivals or excuse old hands.
  3.  **Visibility:** This must survive. It explains *why* the complaint exists. If non-compliance is invisible, there is no social friction to adjudicate.

  **Distinctions That May Be Collapsed:**
  1.  **Stated Rationale vs. Operative Function:** Collapse this for lay use. Teachers cannot reliably psychoanalyze a culture to find the "real" reason for a norm. Treat the stated rationale as true unless it is legally or physically impossible.
  2.  **Harm vs. Offense:** Collapse "Harm." In cultural exchange, offense *is* the harm. Do not ask "Was anyone hurt?" Ask "Was the relationship damaged?"

  ---

  ### Application to Cases

  **Case 1: The Jaywalking (11 PM, Empty Street, Neighbor Report)**
  *   **Step 1 (Safety):** Technically illegal, but low danger.
  *   **Step 2 (Norm Type):** Coordination. If foreigners ignore lights, locals assume all foreigners ignore safety laws. The system relies on predictability.
  *   **Step 5 (Visibility):** High. Seen by a neighbor.
  *   **Step 6 (Reliance):** Student represents the school/program in public.
  *   **Result:** **Obligation to Comply.**
  *   **Office Resistance:** **This is the unwelcome result.** Your office will resist this because it requires disciplining a student for a victimless infraction reported by a busybody. It feels like enforcing petty surveillance rather than education. However, the procedure dictates it because traffic norms are *Coordination* norms. If you excuse this, you undermine the safety infrastructure the student relies on elsewhere. You must tell the student: "The rule is not about the car; it is about the signal."

  **Case 2: The Tip (Large Tip at Family Restaurant)**
  *   **Step 1 (Safety/Conscience):** No.
  *   **Step 2 (Norm Type):** Expression/Status. Tipping does not collapse if one person opts out, but it degrades trust.
  *   **Step 3 (Rationale):** Mismatch. Student thought "Generosity"; Owner heard "Charity/Beggar."
  *   **Step 4 (Membership):** Guest. Student is not a member of the restaurant community.
  *   **Step 6 (Reliance):** No explicit contract, but economic participation implies following local market customs.
  *   **Result:** **Obligation with Excuse.** The student is not "bound" as a local would be (they didn't know), but the complaint is valid. The student must apologize and learn the local rate.
  *   **Why:** It acknowledges the student's good intent (Excuse) but validates the owner's feeling (Obligation to learn).

  **Case 3: The Bow (Grandmother, Religious Objection)**
  *   **Step 1 (Conscience):** **Yes.** Student claims religious/sincerity violation.
  *   **Result:** **Refer to Dean.**
  *   **Why:** A teacher cannot adjudicate sincerity. If the student says "This violates my relationship with God," you cannot say "Do it anyway."
  *   **Office Resistance:** You will resist this because it creates a "Conscience Loophole." Students will learn that claiming a religious objection exempts them from household integration. However, you cannot force sincerity. If you force the bow, you break the student. If you excuse the bow, you insult the grandmother. The procedure punts this to you because it is a values conflict, not a rule conflict.

  ---

  ### The Honest Part

  **What Will Go Wrong (First Three Runs):**
  1.  **The Membership Trap:** Teachers will argue over Step 4. "Is Month 4 enough to be a member?" You will get inconsistent rulings where one student is punished for a norm another is excused from, based solely on arrival date.
  2.  **The Conscience Inflation:** Students will quickly learn that Step 1 (Conscience) is the "Get Out of Jail Free" card. You will see a spike in "moral objections" to mundane chores or etiquette.
  3.  **The Visibility Bias:** Teachers will conflate "Complaint Made" with "High Visibility." Just because a neighbor complained doesn't mean the act was publicly conspicuous. You will over-enforce private grievances.

  **The Single Most Unreliable Question:**
  **Step 4: The Membership Threshold.**
  There is no objective line where a guest becomes a member. It relies on the teacher's subjective feel for "integration." This question carries the most weight because it determines whether Expression norms bind, but it is the easiest to manipulate. A host family claiming "He's part of the family" can weaponize this to enforce control.

  **Enforcing Hierarchy & The Safeguard:**
  The procedure enforces hierarchy if operators define "Local Custom" as "Objective Norm." If a host family says, "In this house, we do X," the teacher may treat X as a Coordination Norm (Step 2) rather than a Status Norm (Step 3). This turns household preference into binding law.
  **Safeguard:** Write into Step 3: *"If the norm applies only within the private home and has no parallel in the wider community, it is a Status Marker, not a Coordination Norm."* This prevents host families from codifying idiosyncratic control as "culture."

  **What It Cannot Settlement:**
  It cannot settle **hostility.** If a host family is looking for reasons to reject a student, they will use this procedure to validate every minor infraction. The procedure assumes good faith. It cannot protect a student from a family that wants them gone.

  ---

  ### One-Page Version for Students (August Arrival)

  **Living Here: A Guide to Norms**
  You are here for ten months. You are not a tourist, but you are not a citizen. You are a **Temporary Member.**

  1.  **Safety & Law:** You must follow local laws and safety rules (traffic, queues, signals) exactly. These rules keep everyone safe. There are no exceptions for "empty streets."
  2.  **Household Respect:** After your first month, you are expected to follow your host family's customs for greetings, seating, and meals. You are part of the house, not a hotel guest.
  3.  **Mistakes:** If you break a rule by accident, tell us. We can explain it. If you break a rule because you think it is silly, that is a problem.
  4.  **Conscience:** If a request conflicts with your religion or deep moral beliefs, tell your Dean immediately. Do not simply refuse. We will find a solution.
  5.  **Visibility:** People are watching. When you are in public, you represent your school and your country. Act accordingly.

  **We are here to help you navigate this. Ask before you assume.**

  ---

  ### Closing Script: "Nobody Was Hurt"

  "You are right that no physical harm occurred. But you are living in a system built on signals, not just safety. When you ignore a local norm, you aren't just breaking a rule; you are sending a signal that you do not value the community enough to learn its language. The complaint isn't about the injury; it's about the message you sent. We need to fix the message."
