answer: |-
  ### The Growth-Rate Credit Protocol

  This procedure replaces expected-value (EV) maximization with expected logarithmic growth maximization. It acknowledges that while your LPs care about the arithmetic mean of outcomes across parallel universes, you live in a single timeline where sequence matters. A bet that is positive EV can still be ruinous if it forces you off the path before the mean realizes.

  **Pre-Condition:** All inputs must be documented in the deal memo. If an analyst cannot answer a question with the required adequacy, the deal stops or escalates.

  **Step 1: The Ergodicity Check (Repeatability)**
  *   **Question:** Is this bet part of a repeatable process where stakes can be adjusted over time based on outcomes?
  *   **Adequacy Condition:** "Yes" requires evidence of at least 50 prior similar transactions *or* a structural guarantee that capital can be redeployed into similar risk/return profiles indefinitely.
  *   **Termination:** If "No," the procedure terminates. **Hand-off to Credit Officer.** (Kelly criteria do not apply to one-off bets that threaten capital permanence).
  *   **Judgment Flag:** Defining "similar" is a judgment call. Are we lending on *equipment* or on the *trade's* macro health?

  **Step 2: Probability Definition (The Estimate)**
  *   **Question:** What is the Probability of Default (PD) and Loss Given Default (LGD)?
  *   **Adequacy Condition:** Analyst must provide a Point Estimate backed by data. If data is thin, an Interval is permitted.
  *   **Interval Rule:** If an Interval is provided, the width (Max – Min) is calculated.
      *   Width ≤ 5%: Use the Worst-Case (Max PD) for sizing.
      *   Width > 5% and ≤ 10%: Use Worst-Case PD and apply a 50% Uncertainty Discount to the final stake.
      *   Width > 10%: **Hand-off to Credit Officer.** (Uncertainty is too high for arithmetic sizing).
  *   **Judgment Flag:** Choosing the "Worst-Case" in an interval is a conservative heuristic, not a statistical derivation.

  **Step 3: The Edge Check (Log-Expectation)**
  *   **Question:** Is the expected logarithmic return positive?
  *   **Calculation:** $E[\log(1 + r)] = p \cdot \ln(1 + Yield) + (1-p) \cdot \ln(1 - LGD)$.
  *   **Adequacy Condition:** Result must be $> 0$.
  *   **Termination:** If $\le 0$, **Decline.** (The bet destroys geometric growth even if arithmetic EV is positive).
  *   **Judgment Flag:** "Yield" must be net of all costs and expected servicing drag.

  **Step 4: Full Kelly Calculation**
  *   **Question:** What is the growth-optimal fraction ($f^*$) of capital at risk?
  *   **Calculation:** Binary approximation: $f^* = \frac{p}{LGD} - \frac{1-p}{Yield}$.
  *   **Adequacy Condition:** $f^*$ must be calculated using the adjusted PD from Step 2.
  *   **Judgment Flag:** This formula assumes binary outcomes. Real credit has gradations of restructuring. This is a modeling simplification.

  **Step 5: Estimation Risk Discount (Fractional Kelly)**
  *   **Question:** How confident are we in the PD estimate?
  *   **Adequacy Condition:** Assign a "Confidence Coefficient" ($C$) based on sample size and regime stability.
      *   High Confidence (>200 obs, stable regime): $C = 1.0$ (Full Kelly).
      *   Medium Confidence (50-200 obs, or minor regime drift): $C = 0.5$ (Half-Kelly).
      *   Low Confidence (<50 obs, or known regime stress): $C = 0.25$ (Quarter-Kelly).
  *   **Calculation:** $Adjusted Stake = f^* \times C$.
  *   **Judgment Flag:** Defining "regime stability" is the single largest judgment call in this procedure.

  **Step 6: Correlation and Book Limit**
  *   **Question:** How does this bet correlate with existing exposure?
  *   **Adequacy Condition:** If the bet correlates >0.7 with existing book (e.g., same trade, same equipment), the $Adjusted Stake$ is treated as an addition to the *Sector Limit*, not a standalone deal size.
  *   **Constraint:** Total Sector Exposure cannot exceed $5 \times Adjusted Stake$ of a single representative deal (diversification floor).
  *   **Judgment Flag:** Correlation coefficients are estimated, not measured.

  **Step 7: Hard Floors and Ceilings**
  *   **Question:** Does the size meet economic viability and risk concentration limits?
  *   **Adequacy Condition:**
      *   Floor: Minimum $30,000 (or deal economics break).
      *   Ceiling: Maximum 5% of Net Worth on any single name; 25% of Net Worth on any single trade sector.
  *   **Termination:** If calculated size < Floor, **Decline.** If > Ceiling, **Cap at Ceiling.**
  *   **Hand-off:** Any request to exceed the Ceiling requires Credit Officer approval (Values/Tolerance decision).

  ***

  ### Application to Live Situations

