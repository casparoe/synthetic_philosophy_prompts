      *   *Veto Move:* Freedom to stop (free won't) remains, limiting exculpation.
      *   *Critique:* It's actually quite good for a heuristic. It covers the temporal gap, the metaphysical implication of the mechanism, the pathological modification of the mechanism, and the residual capacity. However, "Machine" and "Threshold" can blur (is addiction just a lowered threshold in the machine?). "Veto" is often a counter-argument *to* the other three rather than a move *by* the brief writer. I need to validate this while building the procedure.

  3.  **Drafting the Screening Procedure:**

      *   *Goal:* 20 minutes, no neuroscience background.
      *   *Structure:* Funnel approach. Start with relevance, move to validity, end with legal implication.
      *   *Step 1: Relevance/Match.* Does the science match the legal standard? (e.g., Mens Rea vs. Moral Responsibility).
      *   *Step 2: Ecological Validity.* Lab task vs. Real crime. (Libet wrist flex vs. Assault).
      *   *Step 3: The Inference Gap.* Does "neural onset" equal "no intent"? (The Delay Move).
      *   *Step 4: The Mechanism Claim.* Is the "Machine" claim actually supported or just asserted? (Schurger/etc.).
