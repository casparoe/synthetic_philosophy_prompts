  4.  **Running the Cases:**

      *   *Case 1 (Assault/Mens Rea):* "Intent formed after motor program."
          *   *Analysis:* Classic Delay Move. Fails ecological validity (simple motor vs. complex assault). Fails legal match (mens rea doesn't require conscious initiation of motor neurons, just intent to act).
