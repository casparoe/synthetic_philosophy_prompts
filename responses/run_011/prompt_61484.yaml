      *   **Task:** Create a 20-minute screening procedure for law students (no neuroscience background) to evaluate neuroscience-based arguments in legal briefs (specifically regarding free will, agency, and responsibility).
      *   **Output Requirements:**
          1.  A step-by-step screening procedure (questions, passing answers, stop conditions).
          2.  Mapping of the user's four "moves" (Delay, Machine, Threshold, Veto) to the procedure steps.
          3.  Application of the procedure to three specific cases (Assault/Mens Rea, Civil/Insurance/Addiction, Student Note/Stochastic Accumulator).
          4.  Identification of "judgment calls wearing procedure's clothing."
