answer: |-
  This is a sharp taxonomy. It holds up well under pressure, though I would flag one structural issue: the **Veto Move** is functionally different from the other three. *Delay*, *Machine*, and *Threshold* are claims made *by* the brief to undermine responsibility. *Veto* is almost always a counter-argument *against* those claims (i.e., "Even if you're right about the onset, the veto power remains"). If your students are using "Veto" to describe a defense argument, they might be conflating "mitigation" (I have less control) with "residual capacity" (I still have some control). I'd suggest relabeling the fourth category **Residual Control** when used by the defense, and keeping **Veto** for the prosecution/rebuttal.

  Below is the screening procedure, the case runs, and the meta-assessment you asked for.

  ***

  # The 20-Minute Neuroscience Screening Protocol

  **Goal:** Triage neuroscience claims in briefs into **Load-Bearing**, **Decorative**, or **Misleading**.
  **Users:** Law students (no neuroscience background).
  **Time:** 20 Minutes max.

  ### Step 1: The Ecological Validity Check
  **Question:** Does the neural task in the citation match the complexity and timeframe of the legal act?
  *   **Passing Answer:** The task involves complex deliberation, emotional stakes, or timeframes similar to the crime/act (e.g., economic game, complex impulse task).
  *   **Failing Answer:** The task is a wrist flexion, button press, or simple saccade task (Libet-style) applied to a complex crime (assault, fraud, premeditated murder).
  *   **Stop Condition:** If Failing, mark **Misleading** unless the argument is strictly about *basic* motor capacity (e.g., automatism).
  *   **Targets:** **Delay Move**, **Machine Move**.
  *   **[JUDGMENT CALL]:** Determining "complexity match." A simple motor act can be part of a complex crime, but students often conflate the two. If the brief argues the *entire crime* is equivalent to a wrist flick, flag it.

  ### Step 2: The Inference Gap Check
  **Question:** Does the text explicitly bridge the gap between "neural onset" and "legal intent" (mens rea), or does it assume they are identical?
  *   **Passing Answer:** The brief acknowledges that neural precursors exist but argues they *compromised* the specific legal standard (e.g., "impaired capacity to conform conduct").
  *   **Failing Answer:** The brief argues that because neural activity preceded conscious report, *intent did not exist* or *action was not voluntary* in the legal sense.
  *   **Stop Condition:** If Failing, mark **Misleading**. The law does not require libertarian free will or conscious initiation of motor neurons for *mens rea*.
  *   **Targets:** **Delay Move**.
  *   **[JUDGMENT CALL]:** Distinguishing "negating intent" from "mitigating capacity." This is a legal conclusion, not a scientific one.

  ### Step 3: The Mechanism Specificity Check
  **Question:** Is the "Machine" or "Threshold" claim supported by data specific to the defendant, or is it a general citation to population-level models?
  *   **Passing Answer:** There is patient-specific imaging (fMRI/EEG) showing *this* defendant's thresholds/bounds differ from controls, linked to a diagnosed condition.
  *   **Failing Answer:** The brief cites general literature (e.g., "addiction changes the striatum") to argue *this* decision was mechanically determined without showing *this* defendant's mechanism was bypassed.
  *   **Stop Condition:** If Failing, mark **Decorative**. It establishes general context but cannot bear the weight of specific causation.
  *   **Targets:** **Threshold Move**, **Machine Move**.

  ### Step 4: The Legal Seam Check
  **Question:** If the science is true, does it change the legal outcome under current doctrine, or does it require changing the definition of "voluntary"?
  *   **Passing Answer:** The science maps onto an existing excuse or mitigation doctrine (e.g., duress, insanity, diminished capacity).
  *   **Failing Answer:** The argument succeeds only if the court accepts that "voluntary" means "uncaused by prior neural states" or "consciously initiated."
  *   **Stop Condition:** If Failing, mark **Misleading** (or **Decorative** if used only for rhetorical flavor). This is a philosophical claim disguised as science.
  *   **Targets:** **Machine Move**, **Delay Move**.
  *   **[JUDGMENT CALL]:** This is the heaviest lift. Students must recognize when a scientific premise demands a metaphysical shift in the law.

  ### Step 5: The Residual Capacity Check
  **Question:** Does the brief address the capacity to inhibit or modify the action after initiation?
  *   **Passing Answer:** The brief acknowledges the "Veto" or "Braking" literature and explains why it was compromised (e.g., panic, specific lesion).
  *   **Failing Answer:** The brief ignores the possibility of inhibition entirely, treating motor onset as action completion.
  *   **Stop Condition:** If Failing in a **Delay Move** context, downgrade confidence in the argument. It suggests the science is being used selectively.
  *   **Targets:** **Veto Move** (used defensively).

  ***

  # Case Runs

  ### Case 1: Assault Motion ("Intent formed after motor program initiated")
  *   **Step 1 (Ecological):** **FAIL.** Wrist-flexion/motor program data applied to assault. Assault involves target selection, approach, and complex motor sequencing, not a single ballistic twitch.
  *   **Step 2 (Inference):** **FAIL.** Equates neural onset with lack of legal intent. *Mens rea* does not require conscious awareness of motor neuron firing.
  *   **Step 4 (Legal Seam):** **FAIL.** Requires redefining "intent" to mean "conscious motor initiation."
  *   **Verdict:** **Misleading.** Strike from brief.
  *   **Taxonomy:** This is a raw **Delay Move** that ignores ecological validity. It confuses *motor physiology* with *criminal intent*.

  ### Case 2: Insurer Argument (Addiction imaging vs. Treatment Decision)
  *   **Step 1 (Ecological):** **FAIL.** Imaging of craving/impulse (seconds/minutes) applied to the decision to enter treatment (a longitudinal, complex deliberative process).
  *   **Step 3 (Mechanism):** **FAIL.** Likely population-level addiction data applied to a specific contractual/coverage decision.
  *   **Step 4 (Legal Seam):** **FAIL.** Insurer is likely arguing the claimant lacked capacity to contract or that treatment was "involuntary" to void coverage. This requires a metaphysical claim about "true self" vs. "addicted self" that the science doesn't support.
  *   **Verdict:** **Misleading** (if used to deny coverage based on involuntariness) or **Decorative** (if used only to establish diagnosis). Given the prompt implies it's doing work to negate the "choice," call it **Misleading**.
  *   **Taxonomy:** This is a **Threshold Move** (impaired control) overextended. It treats a complex life decision as a threshold crossing event.

  ### Case 3: Student Note (Stochastic Accumulator is *better* for defense)
  *   **Step 1 (Ecological):** **PASS/NEUTRAL.** The note likely acknowledges the lab task limitations but argues from the *implication* of the model, not the task itself.
  *   **Step 3 (Mechanism):** **PASS.** The Schurger (2012) reanalysis is a legitimate scientific counter to the "pre-conscious decision" reading of Libet.
  *   **Step 4 (Legal Seam):** **FAIL.** This is the breaking point. The note argues: "If decisions are just noise crossing a threshold, there is no 'decider' to hold responsible."
      *   *Analysis:* This assumes the law requires a "Homunculus Decider." The law requires *reasons-responsiveness*. Even if the accumulator is stochastic, if the agent acts for reasons (e.g., "I hit him because he insulted me"), the law is satisfied. The "no decision" claim is a metaphysical claim, not a legal one.
      *   *Correction:* The note might argue this *undermines retributivism*. If so, it's a philosophical argument using science as a premise.
  *   **Verdict:** **Decorative** (if used to support existing mitigation) or **Misleading** (if used to argue for exculpation based on lack of agency).
  *   **My Advice:** **Stop assigning it as a "winning" legal argument.** It is a strong *philosophical* critique of retributivism, but as a *legal* brief strategy, it fails Step 4. It asks the court to adopt incompatibilism.
  *   **Taxonomy:** This is the **Machine Move** pushed to its limit. You are right to hate it in a clinical setting. It's theoretically interesting but legally inert unless the jurisdiction is ready to overturn compatibilist premises.

  ***

  # Meta-Assessment & Confidence

  ### Judgment Calls Wearing Procedure's Clothing
  1.  **Step 1 (Ecological Validity):** I am asking students to judge "complexity." There is no hard line between a "complex" act and a "simple" one in neuroscience. A "snap" assault might be closer to a wrist flex than a planned one. I am masking a nuanced factual inquiry as a binary check.
  2.  **Step 4 (Legal Seam):** This is the heaviest disguise. I am asking students to identify when a scientific premise demands a metaphysical shift. This requires philosophical training they don't have. They will likely flag *any* challenge to voluntariness as a "Legal Seam" failure, potentially killing valid diminished capacity arguments.
  3.  **Case 3 Verdict:** My ruling that the Student Note fails Step 4 relies on the assumption that the law is compatibilist. While functionally true in US courts, it is not explicitly codified. I am treating a philosophical consensus as a legal rule.

  ### Confidence Assessment
  *   **High Confidence:** Steps 1 and 2. The gap between Libet-style tasks and criminal acts is well-documented in the literature (e.g., *Morse*, *Roskies*). The legal definition of *mens rea* does not require conscious motor initiation.
  *   **Moderate Confidence:** Step 3 (Mechanism Specificity). While individual imaging is the gold standard, group-level data *can* be probative in mitigation (e.g., "people with this lesion generally lack control"). I am being stricter here than some courts might be.
  *   **Low Confidence:** **Step 4 (The Legal Seam) in Case 3.**
      *   *Why:* I am reconstructing the implication of the Schurger (2012) accumulator model. Schurger argues the Readiness Potential is *not* a decision signal, but noise. The Student Note argues this eliminates the "decider."
      *   *The Risk:* Some philosophers (e.g., *Mele*, *Nahmias*) argue that even if the RP is noise, the *process* of accumulation can still be reasons-responsive. I am assuming the Note takes the hard incompatibilist line. If the Note argues that stochasticity *reduces* reliability of control (a Threshold Move variant), it might survive Step 4 as mitigation.
      *   *Reconstruction Flag:* My confidence that the Student Note *necessarily* fails Step 4 depends on the Note's specific phrasing of "no decision." If they mean "no *libertarian* decision," they are right scientifically but wrong legally. If they mean "no *process* of deliberation," they are scientifically contested. **Check the Note's definition of "decision."**

  ### Final Recommendation on the Taxonomy
  Your taxonomy is robust enough for the clinic. The only adjustment I strongly recommend is splitting **Machine** and **Threshold**.
  *   **Machine:** "The system is deterministic/stochastic; agency is an illusion." (Exculpatory/Philosophical).
  *   **Threshold:** "The system is functional but calibrated poorly (addiction, TBI)." (Mitigating/Empirical).
  *   *Reason:* Case 3 is a **Machine** argument. Case 2 is a **Threshold** argument. They fail for different reasons. Machine fails on Legal Seam (Step 4); Threshold fails on Mechanism Specificity (Step 3). Keeping them distinct helps students see *why* the brief fails.

  **Confidence Score:** 85% on the procedure utility; 70% on the specific neuroscience consensus regarding Schurger/Accumulator models (this field shifts fast); 95% on the Legal/Philosophical distinctions (Step 4).

  **Least Certain Step:** Step 4, specifically regarding Case 3. If the student note argues that stochasticity undermines *reliability* of control rather than *existence* of control, it might be Load-Bearing for mitigation, not Misleading. I am assuming the note takes the harder line. Verify that before you ban the assignment.
