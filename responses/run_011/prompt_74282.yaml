      *   *Arbitrariness:* IL transforms arbitrariness. For Republicans, arbitrary = uncontrolled. For IL, arbitrary = cost-free. If interference is costly, it's not arbitrary in the IL sense, even if uncontrolled by the victim.
      *   *Decision:* It is best read as a **deflationary reduction of non-domination**. It takes the republican insight that power matters (not just acts) but strips out the requirement for democratic control or status, replacing it with a realist calculation of costs. It creates a "cold peace" version of liberty.

