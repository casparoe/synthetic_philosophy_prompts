      *   *Is it a deflationary reduction of ND?* ND is about *arbitrariness* (control). IL is about *costs* (deterrence). IL captures the *security* aspect of ND without the *agency/status* aspect. It reduces the high bar of ND (you must control the power) to a lower bar (the power is checked). This seems like the strongest reading. It creates "freedom as security" without "freedom as status."
