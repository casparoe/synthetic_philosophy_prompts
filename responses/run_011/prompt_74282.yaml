      *   *Negative Liberty:* Focuses on the *act*. If I am not stopped, I am free. The Lucky Slave is free in NL terms (if the master doesn't interfere). The Vulnerable Citizen is free in NL terms (if the neighbor doesn't attack).
      *   *Non-Domination:* Focuses on the *status/power relation*. If someone *can* interfere arbitrarily, I am unfree, even if they don't. The Lucky Slave is unfree (master has arbitrary power). The Vulnerable Citizen is unfree (neighbor has arbitrary power, even if deterred by prudence).
