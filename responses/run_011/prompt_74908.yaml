prompt: |-
  For the past three years I have served as one of nine trustees of a small literary archive, a seat I was offered because I publish novels and am therefore assumed to have opinions about the dead. The board votes next month on a petition that has split it four to four, with me in the middle, and I have been asked to circulate a written opinion in advance. I would like you to draft it for me.

  The facts, compressed. The writer whose papers we hold died four years ago. She kept carbons, drafts, and later printed emails of everything she sent, and she destroyed everything she received; the collection is therefore only her side of some forty years of correspondence. Because she was a prodigious and reactive correspondent, her side is remarkably informative: a reader working through the sequence can reconstruct, often nearly point for point, what the other party had said. Some of those other parties are alive. Some are dead and survived by families who are angry, or merely wounded, or both. At least one wrote throughout under an assumed name and has never been identified, though our cataloguer is confident she could identify her from internal evidence alone. The most intimate run of files was sealed at deposit for twenty-five years, subject to a clause allowing the board to open them earlier by simple majority where the scholarly interest is compelling and no living person's legitimate confidence is betrayed. Neither phrase is defined. The clause says nothing about the dead, nothing about their families, and nothing about a correspondent whose identity is unknown to us and who may therefore be living for all we can determine.

  Now a biographer has petitioned for the sealed run. Two things complicate her case and ours. She has already published a first volume quoting extensively from letters she obtained privately, with permission, from the family of a single correspondent — so a portion of the material is already in print, arrived by a route we neither sanctioned nor could have prevented. And the practical forecast is plain: if we refuse her, the material will continue to reach scholars through precisely that channel, through whichever family happens to hold paper and happens to be well disposed, while the archive — which at least answers to a board, keeps a record, and can impose conditions — is left custodian of an empty shell.

  The memo I need should do four things.

  First, recommend a course of action: open, keep sealed, or some intermediate arrangement, specified concretely — which files, to whom, under what handling conditions, reviewed by whom, and after what interval. A recommendation the trustees could vote on as written, not a direction to convene a further committee.

  Second, supply working definitions of compelling scholarly interest and of legitimate confidence that a registrar with no legal training could actually apply to a box of letters on an ordinary Tuesday. These definitions will silently embody some account of what privacy is — a person's control over information about herself, or a property of relationships and of the contexts in which disclosure is appropriate, or something else again — and I want that account stated on the page rather than smuggled in through the criteria.

  Third, take a position on the leakage question. Does the fact that part of this material is already public weaken the objection to releasing the rest, on the theory that a confidence once broken is no longer owed? Or is that a category mistake, in which the prior disclosure is a further wrong rather than an absolution? Address, in this connection, whether the perverse-incentive consideration I described above — that sealing drives inquiry toward private, unaccountable dealing — is a legitimate ground for the board's decision or an improper one, given that it concerns the consequences of our policy rather than the claims of the people in the boxes.

  Fourth, tell me what to do about the clause's silences. If the dead, their families, and the unidentified correspondent have interests that the instrument simply fails to capture, say whether the board may act on interests it was not empowered to weigh, and if not, what the honest alternative is.

  Close with the strongest case you can assemble for the opposite of whatever you recommend, argued in terms that would move a trustee who is not merely being difficult. I am the swing vote and I have no interest in being flattered.

  I would rather have a decision document than a survey. Do not append citations or a bibliography; I will add whatever authority the memo needs myself, and I have no use for a literature review dressed as advice. Two to three pages.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**

      *   **Role:** Trustee of a small literary archive (one of nine).
      *   **Context:** Vote next month on a petition to open sealed correspondence files of a deceased writer (died 4 years ago). Board split 4-4, user is the swing vote.
      *   **Task:** Draft a written opinion/memo to circulate in advance.
      *   **Key Facts:**
          *   Writer kept carbons/drafts/emails of sent mail; destroyed received mail. Collection is one-sided but reconstructible.
          *   Some correspondents alive, some dead (families angry/wounded), one unidentified (writing under assumed name).
          *   Sealed for 25 years, but can open earlier by simple majority if "scholarly interest is compelling" AND "no living person's legitimate confidence is betrayed."
          *   Biographer petitioned to open. Already published Vol 1 using private letters from one family (outside archive control).
          *   Risk: If archive refuses, material leaks via private channels (unaccountable); if archive opens, it controls access.
      *   **Requirements (4 specific tasks):**
          1.  **Recommendation:** Concrete course of action (open, sealed, or intermediate). Must be vote-ready.
          2.  **Definitions:** Define "compelling scholarly interest" and "legitimate confidence" for a registrar. Must state the underlying theory of privacy explicitly.
          3.  **Leakage Question:** Address the "already public" argument and the "perverse incentive" (driving inquiry to private deals). Is this a legitimate ground for decision?
          4.  **Silences:** Address the clause's silence on the dead, families, and unidentified correspondents. Can the board act on interests not empowered?
          5.  **Counter-Argument:** Close with the strongest case for the *opposite* recommendation, aimed at a reasonable trustee.
      *   **Constraints:** 2-3 pages. No citations/bibliography. Decision document, not a survey. No flattery.

  2.  **Determine the Stance/Recommendation:**

      *   *Option A (Open):* Maximizes scholarship, controls the narrative, prevents worse leakage. Risks hurting living/families.
      *   *Option B (Sealed):* Protects privacy strictly. Risks making the archive irrelevant, encourages unaccountable private dealing.
      *   *Option C (Intermediate/Redacted/Embargoed):* Best balance. Open the files but with safeguards.
      *   *Decision:* I will recommend an **Intermediate Arrangement**. Specifically: Open the files to the petitioning biographer and accredited researchers *under license*, with a specific review process for sensitive material regarding living or recently deceased correspondents. This allows scholarship while mitigating harm. It addresses the "perverse incentive" by making the archive the viable path.
      *   *Privacy Theory:* I need to choose one. "Contextual Integrity" (Nissenbaum) fits well here—privacy is about appropriate flow of information within specific social contexts, not just total secrecy. Or a "Relational" view. Let's go with a **Relational/Contextual** view. Privacy isn't just individual control; it's about the integrity of the relationship and the context of disclosure.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Introduction:** State the purpose and the gravity of the vote.
      *   **Recommendation (Task 1):** Be specific. Open the sealed run *conditionally*.
          *   *Who:* Accredited researchers (not just the biographer).
          *   *Conditions:* No quotation of sensitive material regarding living/recently deceased without review.
          *   *Review:* A sub-committee or the Registrar.
          *   *Timeline:* Immediate access for reading, 12-month embargo on publication of sensitive sections to allow for review.
      *   **Definitions & Privacy Theory (Task 2):**
          *   *Theory:* Privacy is not absolute secrecy but *contextual integrity*. It is the expectation that information shared in one context (private letter) won't migrate to another (public biography) without consent or overriding public interest.
          *   *Compelling Scholarly Interest:* Not just "interesting." Must advance understanding of the writer's work or era in a way unavailable elsewhere. (Biographer qualifies).
          *   *Legitimate Confidence:* Not just "would they be upset?" But "was there a reasonable expectation of privacy?" For the dead, does the family inherit this? Yes, for a limited duration (grief/reputation). For the unidentified: Assume living until proven dead.
      *   **The Leakage Question (Task 3):**
          *   *Prior Disclosure:* Does it break confidence? No. A theft doesn't justify a second theft. However, it changes the *harm* calculation.
          *   *Perverse Incentive:* Yes, this is legitimate. An archive that seals everything becomes irrelevant and cedes control to private actors who have *no* ethical guidelines. The archive's duty is to steward access, not just lock boxes.
      *   **The Silences (Task 4):**
          *   *Dead/Families/Unidentified:* The clause is silent. Does the board have power?
          *   *Argument:* Fiduciary duty implies a duty of care beyond the strict text. We cannot ignore foreseeable harm to the living (via the dead). We must interpret "living person" to include the reputational interests of the recently deceased held by families, and treat the unidentified as living. We are empowered to protect the archive's moral standing, which encompasses these interests.
      *   **Counter-Argument (Task 5):**
          *   *Case for Keeping Sealed:* The text is the text. "Simple majority" implies a high bar. If we open now, we break the promise made to the donor (the writer). The "leakage" argument is speculative; the harm to trust is concrete. If we can't protect the living, we shouldn't open. Better an empty shell than a betrayer of confidence.

  4.  **Refining and Polishing:**

      *   *Tone:* Professional, decisive, philosophical but practical. No academic jargon unless defined.
      *   *Length:* Keep it tight. 2-3 pages single-spaced equivalent.
      *   *Check Constraints:* Did I define the terms for a registrar? Yes. Did I address the unidentified correspondent? Yes. Is the recommendation vote-ready? Yes.
      *   *Self-Correction during drafting:* Initially, I might lean too hard on the biographer. I need to make sure the recommendation applies to the *collection*, not just her. The petition is hers, but the precedent is for the archive. I will frame it as granting the petition *with conditions* that set a precedent.
      *   *Privacy Theory:* Make sure it's explicit. "Privacy as contextual integrity."
      *   *The "Swing Vote" aspect:* Acknowledge the split but don't pander. Just present the logic.

  5.  **Final Review against Prompt:**
      *   Rec: Concrete? Yes (Open with redaction/review protocol).
      *   Definitions: Registrar-ready? Yes. Privacy theory stated? Yes.
      *   Leakage: Addressed "broken confidence" and "perverse incentive"? Yes.
      *   Silences: Addressed dead/families/unidentified? Yes.
      *   Counter-argument: Strong case for opposite? Yes.
      *   Format: Memo. No citations. 2-3 pages.

  6.  **Writing the Memo.** (Proceeding to generate output based on these thoughts). *Note: Ensure the voice sounds like a trustee/novelist, thoughtful but administrative.*

      *   *Drafting thought:* Make sure the "Intermediate Arrangement" is specific enough to be voted on. "Open subject to a 12-month embargo on publication of sensitive material and a review committee."
      *   *Drafting thought:* On the "unidentified" person. If the cataloguer can identify her, should we? No, that violates the spirit. Treat as living.
      *   *Drafting thought:* The counter-argument needs to be principled, not just "it's hard." It should be about the sanctity of the donor agreement.

  7.  **Final Polish:** Check word count and flow. Ensure the transition between the recommendation and the philosophical underpinnings is smooth. (The prompt asks for the theory to be stated on the page, not smuggled in).

      *(Self-Correction)*: Wait, the prompt says "Two to three pages." In standard memo formatting (single spaced, 12pt), that's roughly 1000-1500 words. I need to be concise.

      *(Refining the Recommendation)*: Make it a motion. "I move that we grant the petition subject to the following protocols..."

      *(Refining the Privacy Theory)*: Keep it clear. "Privacy is not a right to secrecy, but a right to context."

      *(Refining the Counter-Argument)*: Make it sound like the best argument of the 4 trustees who want to keep it sealed.

      *Let's write.*
answer: |-
  **MEMORANDUM TO THE BOARD OF TRUSTEES**

  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation Regarding Petition to Open Sealed Correspondence

  We are deadlocked. Four of us believe the seal must hold to protect the living and honor the deposit agreement; four believe the seal must break to serve scholarship and prevent the collection from becoming a hollow shell. As the ninth vote, I am submitting this opinion to clarify the grounds on which I intend to vote. We require a decision, not a deferral.

  **I. Recommendation**

  I move that the Board grant the biographer's petition to access the sealed run, subject to a specific **Controlled Access Protocol**. We should not open the files unconditionally, nor should we keep them sealed.

  The Protocol shall be as follows:
  1.  **Access:** The files are opened immediately to the petitioning biographer and accredited researchers holding a formal reader's ticket.
  2.  **Publication Embargo:** No direct quotation or detailed paraphrase of material concerning correspondents who are living, or deceased for fewer than ten years, may be published without prior review.
  3.  **Review Mechanism:** A sub-committee of two trustees (one from each side of the current split) plus the Archive Registrar shall review proposed quotations. They have fourteen days to approve or redact.
  4.  **The Unidentified Correspondent:** Material pertaining to the correspondent writing under an assumed name shall be treated as *living* until proven otherwise. The cataloguer is instructed *not* to attempt identification using internal evidence for the purpose of access; the assumption of life protects the archive from liability and the individual from exposure.
  5.  **Sunset:** This Protocol expires in five years, at which point the Board shall review the "deceased for fewer than ten years" clause.

  This is a vote-ready motion. It allows the scholarship to proceed while retaining the archive's leverage to prevent gratuitous harm.

  **II. Definitions and Theory of Privacy**

  To apply this Protocol, the Registrar requires working definitions of the deed's vague terms. These definitions must rest on a stated theory of privacy. We cannot smuggle our ethics into administrative criteria; they must be explicit.

  **Theory:** We reject the notion that privacy is merely an individual's absolute control over information about themselves. Instead, we adopt a theory of **Contextual Integrity**. Privacy is the expectation that information shared within a specific relationship (e.g., private correspondence) will not migrate to a different context (e.g., public biography) without consent or overriding justification. A confidence is not betrayed simply because information becomes public; it is betrayed when the *context* of that publicity violates the norms of the original relationship.

  **Definition 1: Compelling Scholarly Interest.**
  *Criteria:* The research must demonstrate that the sealed material offers evidence unavailable elsewhere that fundamentally alters the understanding of the writer's work or historical milieu.
  *Application:* The Registrar need not judge the quality of the scholarship, only the necessity of the source. If the biographer can write the chapter using secondary sources, the interest is not compelling. If the chapter relies on the emotional tenor of the correspondence, it is. The current petition meets this bar.

  **Definition 2: Legitimate Confidence.**
  *Criteria:* A confidence is "legitimate" if a reasonable person in the correspondent's position would have expected the content to remain within the private sphere.
  *Application:* This applies to the living. It also applies to the recently deceased via their families, but only for a limited duration (defined above as ten years). Grief and reputation have a half-life; a legitimate confidence regarding the dead expires as the historical record supersedes the personal wound. For the unidentified correspondent, the "reasonable expectation" is total anonymity; therefore, any detail that risks identification breaches legitimate confidence.

  **III. The Leakage Question**

  Two arguments suggest we should open the files simply because the seal is already porous. We must weigh them carefully.

  First, does the biographer's prior publication of private letters from another family mean the confidence is already broken? **No.** This is a category mistake. A theft does not absolve a custodian of their duty. That one family chose to share their papers does not mean all correspondents consented to public scrutiny. To argue otherwise is to claim that because one window is broken, we should unlock the door.

  Second, is the "perverse incentive" argument legitimate? That is, if we keep the files sealed, scholars will simply bypass us and deal privately with families, leaving the archive with an "empty shell" and the public with unvetted, unaccountable disclosures. **Yes, this is a legitimate ground for decision.** An archive is not a tomb; it is a steward. If our policy drives inquiry into the black market of private dealing, we are actively making the historical record *less* ethical. Private holders have no board, no review process, and no duty to the public. By opening under the Controlled Access Protocol, we reclaim the ethical high ground. We ensure that when the material is published, it is contextualized, verified, and subject to review. We cannot prevent all leakage, but we must not make ourselves the reason scholars seek the unregulated path.

  **IV. The Silences**

  The deposit agreement is silent on the dead, their families, and the unidentified. It speaks only of "no living person's legitimate confidence."

  Can we weigh interests the instrument does not capture? **Yes.** To interpret the deed strictly literally would be to abdicate our fiduciary duty of care. The clause regarding "living persons" implies a concern for harm. The families of the recently deceased suffer tangible harm (harassment, reputational damage) from immediate disclosure. The unidentified correspondent may be living; treating them as dead risks libel and profound personal violation.

  We are not empowered to rewrite the deed, but we are empowered to interpret "living person" to include the *interests* of the recently deceased as held by their heirs, and to treat the unidentified as living by default. If we refuse to acknowledge these interests because the text is silent, we are hiding behind legalism to avoid moral responsibility. The honest alternative—keeping the files sealed until the twenty-five-year term expires—is untenable given the leakage risk. We must fill the silence with prudence.

  **V. The Case for the Opposite**

  I must conclude by stating the case against my own recommendation, as I would need to hear it were I in the minority.

  The argument for keeping the files sealed is not merely about caution; it is about the sanctity of the promise. When the writer deposited these papers, she did so under a specific contract: twenty-five years. The escape clause was intended for emergencies, not for the convenience of biographers. By opening the files now, we are retroactively changing the terms of the gift.

  Furthermore, the "Controlled Access Protocol" is an illusion of safety. Once the box is opened and a scholar reads a letter, the secret is out. The review process only polices *quotation*, not *knowledge*. A biographer who reads a devastating revelation about a living child cannot un-read it; it will color their interpretation of the writer's work regardless of whether they are allowed to quote it. The harm is in the exposure, not just the publication.

  Finally, the "perverse incentive" argument is speculative. We do not know that scholars will go to private families; they might simply wait. But we *do* know that if we open these files, we signal to future donors that our seals are wax, not iron. We risk starving the archive of future collections to feed a current biography. It is better to be the custodian of an empty shell than a betrayer of trust. If we cannot protect the living and the recently dead without ambiguity, we should not open the box at all.

  **Decision**

  I find the risk to future donations real, but the risk of rendering the archive irrelevant greater. I find the promise of twenty-five years binding, but the clause for early opening explicit. I will vote to **Open with Protocol**. We cannot protect everyone from everything, but we can ensure that what escapes this room does so with our eyes open.
