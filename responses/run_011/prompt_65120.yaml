prompt: |-
  I'm a developmental editor at a company that publishes high-school world history textbooks. Twice a year I get a batch of chapter drafts and the same argument, coming at me from both directions at once. Half our state reviewers say we've written people out of the story — every drought, plague and volcano gets top billing and nobody in the chapter ever actually decides anything. The other half say we're doing the old "geography explains civilisation" routine again, just with a climatologist's vocabulary. Frequently they're complaining about the same paragraph, which is the part that makes my job miserable.

  I want a screening procedure I can run over a flagged passage before I write my note to the author. Constraints: about fifteen minutes per passage; I have a history degree and no training in philosophy or climate science; and I can't fact-check the underlying claims, because we have no science reader and the budgets gone. So the tests have to work on the shape of the causal claim in the sentence, not on whether the climatology behind it is right. And the author is a freelancer who gets paid by revision round, so every flag needs to come with a specific, line-level fix rather than a vague worry.

  I have a hunch about which distinctions actually carry the weight here, but I don't trust my hunch, so take these or replace them with better ones:

  - did the non-human factor start the thing, or did it decide who the thing landed on? A drought can begin a famine and still say nothing at all about who starved.
  - the swap test: replace the eruption with a differently-caused version of the same shock — a war, a blockade, a tax change — and ask whether the rest of the sentence still holds. If it does, the climate isn't doing explanatory work and shouldn't be the subject of the verb.
  - is there anyone left in the paragraph who could have done otherwise? I want to say a passage is deterministic when it contains no agent with a live alternative, but tell me if that's too crude.

  For each step, give me what to look for, what counts as a pass, what a flag looks like, and what the rewrite actually does. Say what order to run them in, and which ones I can skip when I'm behind schedule.

  Then run the procedure on three bits of plausible draft text:

  1. A sentence attributing the wave of New England farm families heading west in 1816 to the cold summer that followed the Tambora eruption.
  2. A passage saying that potato blight caused the deaths in the Irish famine of the 1840s.
  3. A chapter opener framing the collapse of the Bronze Age palace societies as a systems failure triggered by a run of droughts.

  At least one should come out clean and at least one should need a rewrite. Tell me which one you expect me to be personally attached to defending, and why.

  Last thing: mark the points where the procedure just stops and it becomes an editorial call — how much causal weight a chapter as a whole gives germs and weather isn't something a test can settle — and be honest about how it will misfire. What does it over-flag, what does it wave through that it shouldn't, and does it lean toward one side of the reviewer fight by construction? No citations or reading lists please, I'm not going to chase them.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Developmental Editor at a high-school world history textbook company.
      *   **Problem:** State reviewers are split. Half say "no human agency" (environmental determinism), half say "geography explains civilization" (climatological determinism). Often complaining about the *same* paragraphs.
      *   **Constraints:**
          *   ~15 minutes per passage.
          *   User has a history degree, no philosophy/climate science training.
          *   Cannot fact-check science claims (no budget/reader).
          *   Must focus on the *shape* of the causal claim, not scientific accuracy.
          *   Freelance authors get paid per revision, so feedback must be specific/line-level, not vague.
      *   **User's Hunches (to validate/refine):**
          1.  Initiation vs. Distribution (Did nature start it or decide who suffered?).
          2.  The Swap Test (Replace climate shock with political shock; does the sentence hold?).
          3.  Agency Check (Is there anyone who could have done otherwise?).
      *   **Deliverables:**
          1.  A screening procedure based on/refining these hunches (Order, Pass/Fail criteria, Specific fixes).
          2.  Application of the procedure to three specific draft texts (New England 1816, Irish Famine 1840s, Bronze Age Collapse).
          3.  Prediction on which text the user will want to defend.
          4.  Limitations/Misfire analysis (Where the procedure stops, biases, over/under-flagging).
      *   **Tone:** Professional, pragmatic, empathetic to the editorial grind, no academic fluff/citations.

  2.  **Develop the Screening Procedure:**
      *   *Goal:* Make it actionable within 15 mins.
      *   *Refining the Hunches:*
          *   Hunch 1 (Initiation vs. Distribution) is good. Let's call it the "Trigger vs. Amplifier" test.
          *   Hunch 2 (Swap Test) is excellent for isolating variables. Keep it.
          *   Hunch 3 (Agency) is the hardest. "Could have done otherwise" is philosophical. Let's make it textual: "Is there a human verb?"
      *   *Order:* Start with the easiest/most objective (Swap), move to the structural (Trigger/Amplifier), end with the nuanced (Agency).
      *   *Outputs:* Needs to specify *what to look for*, *Pass*, *Flag*, and *The Fix*.
      *   *Triage:* Which can be skipped? The Agency check is the most time-consuming. If behind schedule, skip that one first.

  3.  **Drafting the Procedure Steps:**
      *   *Step 1: The Swap Test.* (Fastest). Look for sentences where Climate is the Subject + Active Verb. Swap Climate for Policy/War. If meaning holds, Climate is a placeholder. Fix: Change subject to humans or make climate context.
      *   *Step 2: Trigger vs. Filter.* (Medium). Does the text say climate caused the *event* or the *outcome*? Fix: Distinguish the shock from the social vulnerability.
      *   *Step 3: The Agency Audit.* (Slowest). Count human verbs vs. environmental verbs. Fix: Insert human decision points.

  4.  **Applying to the Three Texts:**
      *   *Text 1 (New England 1816/Tambora):* "The cold summer caused families to head west."
          *   Swap Test: "The tax increase caused families to head west." Works.
          *   Flag: Climate is the subject.
          *   Fix: "Faced with crop failure from the cold summer, families chose to head west."
      *   *Text 2 (Irish Famine):* "Potato blight caused the deaths."
          *   Swap Test: "British policy caused the deaths." (Historically contentious but structurally valid).
          *   Trigger/Filter: Blight started it, policy amplified it.
          *   Verdict: Needs nuance. Blight killed the *potatoes*, humans/politics killed the *people* (in the view of agency-focused reviewers).
          *   *Self-Correction:* The prompt asks for *plausible draft text*. I need to write the text first, then analyze it.
          *   *Draft 2:* "The potato blight destroyed the food supply, leading to the deaths of one million people."
          *   *Analysis:* Blight is subject. "Leading to" implies inevitability.
      *   *Text 3 (Bronze Age):* "Droughts triggered systems failure."
          *   This is macro-history. Harder to find individual agents.
          *   *Draft 3:* "A run of droughts destabilized the palace economies, causing the collapse of the Bronze Age."
          *   *Analysis:* "Destabilized" and "Causing" are heavy deterministic verbs.
      *   *Selection:*
          *   Clean: Maybe New England? It's migration, usually implies choice.
          *   Rewrite: Irish Famine is the classic "Blight vs. Policy" debate. Bronze Age is the classic "Systems Collapse" debate.
          *   *Decision:* I'll make the New England one the "Clean" one (with minor tweaks), the Irish one the "Rewrite" (classic agency failure), and the Bronze Age one the "Borderline/Editorial Call" (macro history is inherently structural).
      *   *Wait, the prompt says:* "At least one should come out clean and at least one should need a rewrite."
      *   *Prediction:* Which one will the user defend? Usually, editors defend the "big picture" narrative (Bronze Age) because it ties the chapter together, whereas specific migration (New England) feels easier to tweak. Or, they might defend the Irish Famine because the science (blight) is undeniable. Actually, the prompt asks: "Tell me which one you expect me to be personally attached to defending, and why." As an editor, I'm attached to the *Chapter Opener* (Bronze Age) because it sets the theme. If I cut the determinism there, the chapter loses its hook.

  5.  **Refining the Limitations/Misfire Analysis:**
      *   *Where it stops:* Macro vs. Micro. The test works on sentences, not chapter arcs.
      *   *Bias:* It likely leans toward the "Agency" reviewers (half the complaint). It flags environmental subjects. It might under-flag "Human X happened because of Environment Y" where Y is true but X was a choice.
      *   *Misfire:* It will flag legitimate climate history (e.g., "The flood drowned the village") as deterministic. Need to distinguish *catastrophe* from *history*.

  6.  **Review against Constraints:**
      *   15 mins? Yes, the steps are quick heuristics.
      *   No science fact-checking? Yes, focusing on grammar/structure.
      *   Specific fixes? Yes, providing rewrite examples.
      *   No citations? Understood.

  7.  **Final Polish:**
      *   Ensure the tone is collegial ("I know this grind").
      *   Make sure the "Fixes" are copy-pasteable instructions for authors.
      *   Check the "Prediction" logic. Why would an editor defend the Bronze Age text? Because it's the *thesis*. Changing it undermines the whole chapter's rationale.

  8.  **Constructing the Output:** (Mental Outline)
      *   Intro: Acknowledge the bind.
      *   The Procedure (3 Steps, ordered by speed/impact).
      *   Triage guide.
      *   Application to the 3 Texts.
      *   The "Defend" Prediction.
      *   Limitations/Misfires.

  *(Self-Correction during drafting)*: Make sure I don't get bogged down in the actual history of the Irish Famine. The point is the *textual structure*. Keep the focus on the *sentence*, not the historiography.
  *(Refining the "Clean" text)*: New England 1816. If written well, it acknowledges the cold but emphasizes the *decision* to migrate. I'll draft it so it passes.
  *(Refining the "Rewrite" text)*: Irish Famine. Draft it poorly (Blight = Subject of Death).
  *(Refining the "Editorial Call" text)*: Bronze Age. It's structural. The test will flag it, but fixing it might break the chapter.

  Let's write it.cw
answer: |-
  Here is a screening procedure designed for your constraints. It treats the text as a mechanical system of subjects and verbs, ignoring the scientific validity of the climate claims. It prioritizes speed and actionable feedback for freelancers.

  ### The 15-Minute Causal Screening Procedure

  Run these steps in order. If you hit a **Flag**, stop and draft the note. If you **Pass**, move to the next step. If you run out of time, skip Step 3.

  #### Step 1: The Swap Test (Time: 3 mins)
  **What to look for:** Sentences where a climate/environmental phenomenon is the grammatical subject of an active verb describing a social outcome (e.g., "The drought *caused* the revolt," "The volcano *forced* migration").
  **The Test:** Mentally replace the climate subject with a political or economic shock (e.g., "The tax hike," "The blockade," "The war").
  **Pass:** The sentence becomes nonsense or changes meaning significantly. (e.g., "The tax hike *evaporated* the reservoir" fails; "The tax hike *triggered* the revolt" works).
  **Flag:** The sentence holds up perfectly with the swap. This means the climate detail is decorative, not explanatory, or the verb is doing too much work.
  **The Fix:** Instruct the author to change the subject to a human group or make the climate a prepositional phrase.
  *   *Instruction:* "Change the subject from [Climate Event] to [Human Group]. Make the climate event the context, not the actor."
  *   *Example:* Change "The drought caused the migration" to "Families migrated in response to the drought."

  #### Step 2: Trigger vs. Filter (Time: 5 mins)
  **What to look for:** Claims where a natural shock leads directly to a specific human outcome (famine, collapse, death) without an intervening social condition.
  **The Test:** Ask: Did the non-human factor start the thing, or did it decide who the thing landed on? (Your hunch #1).
  **Pass:** The text distinguishes between the *shock* (blight, drought) and the *vulnerability* (storage systems, trade policy, land tenure).
  **Flag:** The text implies the outcome was inevitable once the shock occurred. (e.g., "The blight killed one million people" vs. "The blight destroyed the crop; export policies prevented relief.")
  **The Fix:** Instruct the author to insert a "filter" clause.
  *   *Instruction:* "Separate the biological event from the social outcome. Add a clause explaining why this shock resulted in *this* specific consequence here and not elsewhere."
  *   *Example:* Change "The flood destroyed the city" to "The flood breached the levees, which the magistrates had failed to repair."

  #### Step 3: The Agency Audit (Time: 7 mins)
  **What to look for:** A paragraph-level scan. Count the active verbs.
  **The Test:** Is there anyone left in the paragraph who could have done otherwise? (Your hunch #3).
  **Pass:** At least one human group is credited with a choice, even a bad one. (e.g., "They chose to hoard," "They failed to adapt," "They migrated").
  **Flag:** The paragraph contains only environmental verbs (rained, dried, erupted) and passive human verbs (were displaced, were killed, were forced).
  **The Fix:** Instruct the author to identify one decision point.
  *   *Instruction:* "Identify one moment where a human actor made a choice that exacerbated or mitigated the environmental stress. Give them an active verb."
  *   *Example:* Change "The people were starved by the winter" to "The community exhausted their stores before the winter ended."

  #### Triage: If You're Behind Schedule
  1.  **Keep Step 1 (Swap Test).** It catches the most egregious "Geography is Destiny" sentences fastest.
  2.  **Keep Step 2 (Trigger/Filter).** It addresses the "who starved" complaint directly.
  3.  **Skip Step 3 (Agency Audit).** This requires reading for nuance and is the most likely to generate philosophical arguments with authors. Use it only for chapter openers or conclusions.

  ***

  ### Application to Draft Texts

  Here is how the procedure applies to your three examples. I have drafted the "plausible text" based on common patterns in this field.

  #### 1. New England Migration (1816 / Tambora)
  **Draft Text:** "Following the eruption of Mount Tambora, the cold summer of 1816 ruined crop yields across New England. Consequently, thousands of farm families packed their wagons and headed west to Ohio in search of arable land."
  *   **Step 1 (Swap):** "Following the [Tax Act], the [bad market] of 1816 ruined crop yields... Consequently, families packed wagons..." The second half (families packing wagons) still holds. The first half is shaky. The climate explains the *ruin*, humans explain the *migration*.
  *   **Step 2 (Trigger/Filter):** Pass. The text distinguishes the crop ruin (trigger) from the decision to move (response).
  *   **Step 3 (Agency):** Pass. "Families packed... and headed." Active human verbs.
  *   **Verdict:** **Clean.**
  *   **Note:** No note needed. The climate sets the stage, but the humans drive the bus.

  #### 2. The Irish Famine (1840s)
  **Draft Text:** "The potato blight arrived in 1845 and spread rapidly through the monoculture crops of the Irish peasantry. Over the next five years, the blight caused the deaths of one million people and forced another million to emigrate."
  *   **Step 1 (Swap):** "The [Political Sanction] arrived in 1845... caused the deaths of one million people." The sentence structure holds. The blight is acting as a political agent here.
  *   **Step 2 (Trigger/Filter):** Flag. The blight killed the *potatoes*. The text says the blight killed the *people*. It skips the filter (relief efforts, export laws, land ownership).
  *   **Step 3 (Agency):** Flag. Humans are passive ("forced to emigrate"). No one is making decisions.
  *   **Verdict:** **Rewrite Required.**
  *   **The Fix Note to Author:** "In the second sentence, the blight is the subject of 'caused deaths' and 'forced.' A pathogen kills plants; social conditions determine human mortality. Please revise to make the blight the cause of the *crop failure*, and identify the human or institutional factors that turned that failure into a famine. Give the emigrants an active verb."

  #### 3. Bronze Age Collapse (Chapter Opener)
  **Draft Text:** "By 1200 BCE, a systems failure swept the Eastern Mediterranean. A run of droughts destabilized the palace economies, cutting off trade routes and causing the collapse of centralized authority. Civilizations fell as the climate shifted."
  *   **Step 1 (Swap):** "A run of [Invasions] destabilized the palace economies..." Works perfectly. The climate is functioning as a placeholder for 'stress'.
  *   **Step 2 (Trigger/Filter):** Flag. "Destabilized" and "Causing" imply inevitability. It suggests the palaces had no buffer against drought.
  *   **Step 3 (Agency):** Flag. "Civilizations fell." Civilizations don't fall; people abandon them or overthrow them.
  *   **Verdict:** **Editorial Call (Leaning Rewrite).**
  *   **The Fix Note to Author:** "This is the chapter hook, so we need to be precise. Currently, the climate is doing all the work. Please adjust to show that the drought stressed the *system*, but the collapse resulted from how the palaces *managed* that stress. Change 'Civilizations fell' to 'Elites lost legitimacy' or 'Populations abandoned the centers'."

  ***

  ### The Prediction

  **Which one will you be personally attached to defending?**
  I expect you will want to defend **Text 3 (Bronze Age Collapse)**.

  **Why?**
  Because it is the **Chapter Opener**. Text 1 and Text 2 are content blocks; Text 3 is the *thesis*. If you force the author to humanize the Bronze Age Collapse too much, you risk losing the macro-narrative arc that justifies the chapter's existence. You need a "big force" to explain a "big collapse." If you nitpick the agency in the opener, the chapter may feel like a collection of biographies rather than a structural history. You will feel pressure to let the "systems failure" language stand because it binds the unit together, even if the reviewers will flag it.

  ***

  ### Limitations and Misfires

  Be honest with yourself about where this procedure breaks. It is a tool for sentence structure, not historical truth.

  **1. Where the Procedure Stops (The Editorial Call)**
  The procedure cannot determine **Causal Weight**. It can tell you if a sentence is deterministic, but it cannot tell you if the chapter *as a whole* is too deterministic.
  *   *The Limit:* You might fix every sentence in the Bronze Age chapter to include human agents, but if 90% of the text is about rainfall data and 10% is about kings, the reviewers will still call it environmental determinism. The test fixes the trees, not the forest. You have to judge the ratio of "climate verbs" to "human verbs" across the whole chapter by eye.

  **2. What It Over-Flags (False Positives)**
  *   **Catastrophes:** It will flag legitimate disasters. "The tsunami drowned the villagers" will fail the Swap Test ("The tax hike drowned the villagers" fails). But a tsunami *does* drown people regardless of agency.
  *   *Mitigation:* If the event is immediate and physical (drowning, burning, burying), allow the environment to be the subject. Reserve the test for *social* outcomes (migration, revolt, collapse, famine).
  *   **The "Lean":** This procedure leans toward the **Agency Reviewers** (the half complaining you've written people out). It is designed to insert humans. It will not catch the other half's complaint ("geography explains civilization") if the author writes: "King X decided to move the capital because of the drought." That passes all tests, but if every King X makes the "obvious" geographic choice, it's still soft determinism. The test can't see "obviousness."

  **3. What It Waves Through (False Negatives)**
  *   **The "Rational Actor" Trap:** If the text says, "Farmers logically moved west because the land was better," it passes the Agency Audit. But if the "logic" is entirely dictated by environmental constraints, it's still deterministic. The test assumes that having a verb equals having a choice. It doesn't.
  *   **Structural Bias:** It works poorly on deep time or macro-history (like the Bronze Age) where specific agents are unknown. You will end up forcing authors to write "People abandoned the cities" when we don't know *who*. This can lead to vague writing that satisfies the test but lowers historical rigor.

  **4. Construction Bias**
  By construction, this procedure favors the **"History is People"** side of your reviewer fight. It treats environmental subjects as suspicious by default. It will not help you defend a passage where the climate *actually* was the primary driver against reviewers who demand a human villain in every tragedy. You will need to use your own judgment to push back when the science is overwhelming and the human agency is negligible. The test won't do that for you.
