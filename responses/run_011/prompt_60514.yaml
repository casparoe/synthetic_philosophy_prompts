prompt: |-
  I am an associate editor at a general philosophy journal, and roughly one submission a month argues that evolutionary explanations of our moral intuitions undercut those intuitions — some concluding that realism about one particular domain fails, others that morality as a whole is unjustified. Desk decisions are mine alone, referee goodwill is scarce, and I have about forty minutes per submission, working only from the abstract and the introduction. Write a triage procedure I can actually run in that time: an ordered set of gates, each with the question it puts to the paper, what counts as a pass, and whether a failure licenses a desk reject, a note back to the author, or a send-to-referees. It should convert whatever the epistemology of genealogical arguments really licenses into questions answerable on a first pass — how the target of the debunking is specified and how far the conclusion is permitted to travel beyond it; whether the argument needs a claim about why the belief was selected, or only that selection would have produced it whether or not it was true; what the author owes by way of an account of how a moral belief could have tracked the truth; and whether the premise doing the work is one the author's opponents can accept without abandoning their own view. Mark each gate where judgment cannot be eliminated, and say who or what settles the case if the procedure cannot.

  Then run it on three abstracts. (1) A paper arguing that intuitions about the unfairness of free-riding are explained by reputation management in small-scale groups, and that realism about fairness therefore fails. (2) A paper arguing that because selection would have installed incest-avoidance intuitions whether or not incest were wrong, no moral belief is justified, and moral skepticism follows globally. (3) A paper arguing that nothing in our fitness history explains concern for the welfare of farmed animals, so intuitions in that domain are untouched by the debunking and stand vindicated by the absence of an adaptive story. I have defended something like the third line in print; tell me plainly if your procedure rejects it, and say where it is being unfair if it is. Close with what the procedure cannot decide, and the failure mode you expect it to have most often in practice.
reasoning: |-
  Here's a thinking process that leads to the suggested triage procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Associate Editor at a general philosophy journal.
      *   **Task:** Create a triage procedure for desk decisions on evolutionary debunking arguments (EDAs) in ethics.
      *   **Constraints:** 40 minutes per submission, working *only* from abstract and introduction. Referee goodwill is scarce (don't waste their time). Desk decisions are mine alone.
      *   **Output:** An ordered set of gates (Question, Pass Condition, Outcome of Failure). Mark where judgment is unavoidable. State who settles unresolved cases.
      *   **Application:** Run the procedure on three specific abstracts (Free-riding/Realism, Incest/Skepticism, Farmed Animals/Vindication).
      *   **Bias Check:** The user admits defending the third line (vindication via absence of adaptive story). I need to be plain about whether the procedure rejects this and where it might be unfair.
      *   **Closing:** What the procedure cannot decide and the expected failure mode.

  2.  **Deconstruct the Philosophical Problem (EDAs):**
      *   *Core Structure:* Evolutionary cause $C$ explains belief $B$. $C$ is independent of truth $T$. Therefore, $B$ is unjustified (or $T$ is false).
      *   *Key Distinctions:*
          *   Target: Specific domain (e.g., fairness) vs. Global (morality as a whole).
          *   Mechanism: Does it matter *why* it was selected (adaptationism) or just *that* selection produced it (insensitivity)?
          *   Alternative: Is there a plausible tracking story (how could evolution track moral truth)?
          *   Dialectical Strength: Does the premise beg the question against the realist? (The "Third Factor" or "Pre-established Harmony" objection).
      *   *Common Pitfalls:* Overgeneralization (local cause $\to$ global skepticism), Under-specification (vague evolutionary psychology), Question-begging (assuming naturalism without argument).

  3.  **Drafting the Triage Procedure (The "Gates"):**
      *   *Goal:* Filter out low-hanging fruit (confused, trivial, or obviously question-begging) without needing deep expertise in evolutionary biology or metaethics.
      *   *Time Limit:* 40 mins. Needs to be fast.
      *   *Gate 1: Target Specification.* Is the target clear? (Local vs. Global).
      *   *Gate 2: The Insensitivity Claim.* Does the argument rely on the claim that evolution would produce the belief *regardless* of its truth? Is this supported in the intro?
      *   *Gate 3: The Tracking Alternative.* Does the author address how a realist *could* say evolution tracks truth? (Third factors, etc.). If they ignore the standard replies, it's not new.
      *   *Gate 4: Dialectical Fairness.* Does the argument assume naturalism in a way that begs the question against non-naturalist realists?
      *   *Gate 5: Novelty/Contribution.* Given the saturation of this literature, does the intro signal a new move?

      *Refining the Gates for the Prompt's Specific Requirements:*
      The prompt asks for specific philosophical distinctions:
      1.  Target specification vs. Conclusion scope.
      2.  Why selected vs. That selected.
      3.  Account of tracking truth.
      4.  Premise acceptability to opponents.

      *Let's structure the Gates around these:*
      *   **Gate 1: Scope Alignment.** (Target vs. Conclusion).
      *   **Gate 2: Explanatory Independence.** (Why vs. That).
      *   **Gate 3: The Tracking Gap.** (Account of tracking).
      *   **Gate 4: Dialectical Independence.** (Premise acceptability).

      *Outcomes:* Desk Reject, Note to Author (encourage resubmission/revision), Send to Referees.
      *Judgment Markers:* Where do I need to use editorial discretion?

  4.  **Developing the Procedure Details:**

      *   *Gate 1 (Scope):* Does the evolutionary story cover the whole conclusion?
          *   Fail: Local story $\to$ Global skepticism. (Desk Reject).
          *   Pass: Scope matches.
      *   *Gate 2 (Mechanism):* Is the causal claim strong enough?
          *   Fail: Vague "evolution made us do it" without addressing *insensitivity*.
          *   Pass: Clear claim that fitness $\neq$ truth.
      *   *Gate 3 (Tracking):* Does the author engage with the "Third Factor" or "Tracking" reply?
          *   Fail: Ignores standard realist defenses (Street, Vavova, etc.).
          *   Pass: Engages or explains why they don't apply.
      *   *Gate 4 (Begging the Question):* Does the argument work only if the opponent is already wrong?
          *   Fail: Assumes naturalism to prove anti-realism.
          *   Pass: Premises acceptable to the realist (internal critique).

      *Wait, I need to incorporate the "Note back to author" option.* Usually, desk decisions are Reject or Review. A "Note back" implies a "Reject but encourage revision" or "Desk Reject with specific advice." Given "referee goodwill is scarce," I should minimize "Revise and Resubmit" without review unless it's a clear fix. Let's make "Note back" a "Desk Reject with invitation to resubmit if fixed."

  5.  **Running the Procedure on the Three Abstracts:**

      *   *Case 1 (Free-riding/Reputation):*
          *   Target: Fairness intuitions.
          *   Conclusion: Realism about *fairness* fails.
          *   Gate 1 (Scope): Aligned (Local $\to$ Local). Pass.
          *   Gate 2 (Mechanism): Reputation management explains belief regardless of normative truth. Pass.
          *   Gate 3 (Tracking): Does it address how fairness *could* track? If it says "Reputation explains it all," it might ignore that reputation and truth could align.
          *   Gate 4 (Dialectical): Can a realist accept reputation management? Yes.
          *   *Verdict:* Likely Send to Referees (standard local debunking).

      *   *Case 2 (Incest/Global Skepticism):*
          *   Target: Incest avoidance.
          *   Conclusion: *Global* moral skepticism.
          *   Gate 1 (Scope): Mismatch. One domain $\to$ All morality.
          *   *Verdict:* Desk Reject (Overgeneralization).

      *   *Case 3 (Farmed Animals/Vindication):*
          *   Target: Concern for farmed animals.
          *   Argument: No fitness history $\to$ Untouched by debunking $\to$ Vindicated.
          *   Gate 1 (Scope): Local. Pass.
          *   Gate 2 (Mechanism): Absence of adaptive story.
          *   Gate 3 (Tracking): The move is "No debunking = Vindication." This is the weak spot. Absence of a defeater isn't a positive justification.
          *   Gate 4 (Dialectical): Realists might accept the absence of an adaptive story but deny it implies vindication.
          *   *Verdict:* This is the tricky one. The prompt says the user defends this. The procedure needs to be honest. The move from "not debunked" to "vindicated" is a logical gap (argument from ignorance).
          *   *Decision:* The procedure should flag this as a "Note back" or "Desk Reject" depending on strictness. If the procedure is rigorous, it flags the "Vindication" leap.

  6.  **Addressing the Bias/Unfairness:**
      *   The user defends Case 3.
      *   Standard epistemology: Removing a defeater restores *prima facie* justification, it doesn't *vindicate* (prove true).
      *   If the paper claims "Vindication," it might be overstating.
      *   I need to point out that Gate 3 (Tracking/Positive Account) is where this fails. Absence of genealogy $\neq$ Presence of tracking.
      *   I must be plain: The procedure likely rejects this *if* it claims positive vindication rather than mere immunity.

  7.  **Finalizing the Procedure Structure:**
      *   Format: Gate Name, Question, Pass Condition, Failure Outcome.
      *   Mark Judgment Calls.
      *   Closing: Limitations and Failure Modes.

  8.  **Refining the "Note back to author" option:**
      *   In high-volume journals, "Note back" usually means "Desk Reject, but we'd look at a rewrite." I will define it as such to manage expectations.

  9.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Gate 3:* The prompt asks: "what the author owes by way of an account of how a moral belief could have tracked the truth." For a debunker, they need to show tracking is *impossible* or *unlikely*. For a vindicator (Case 3), they need to show tracking is *possible* or *default*.
      *   *Adjustment:* Make Gate 3 about the "Epistemic Gap." Does the author explain why the evolutionary explanation *displaces* the truth explanation?
      *   *Case 3 Specific:* The argument is "No evolutionary explanation $\to$ Safe." The counter is "No evolutionary explanation $\to$ No explanation at all (noise/culture)." The procedure must catch this.

  10. **Final Review against Constraints:**
      *   40 minutes? Yes, these gates are readable in 5 mins, leaving 35 for reading the text.
      *   Abstract/Intro only? Yes, the questions must be answerable there.
      *   Mark judgment calls? Yes.
      *   Run on 3 abstracts? Yes.
      *   Address bias? Yes.
      *   Closing limitations? Yes.

  11. **Writing the Response:** (Proceeding to generate output based on these thoughts).
      *   *Tone:* Professional, direct, editorial.
      *   *Structure:* Procedure first, then Application, then Bias Check, then Limitations.

      *(Self-Correction during drafting)*: Make sure to explicitly mark where *I* (the editor) have to use judgment versus where the text speaks for itself.
      *(Self-Correction on Case 3)*: Be careful not to validate the user's view just because they hold it, but also acknowledge where the procedure might be too harsh on "negative vindication" arguments if they are nuanced. The prompt asks me to be *plain* if it rejects it. I will say it flags the "Vindication" leap.

      *(Refining Gate 4)*: The prompt asks: "whether the premise doing the work is one the author's opponents can accept without abandoning their own view." This is the "Dialectical Independence" gate. Crucial for EDAs.

      *(Final Polish)*: Ensure the distinction between "Desk Reject" and "Note Back" is clear. "Note Back" is rare. I'll reserve it for papers that fail one gate but show enough promise that a fix is obvious without peer review.

      *(Wait, one more thing)*: The prompt asks "who or what settles the case if the procedure cannot." I need to add a "Tie-Breaker" clause.

      *(Let's write it.)*
answer: |-
  ### Triage Procedure for Evolutionary Debunking Submissions

  **Time Budget:** 40 Minutes (5 mins per gate, 20 mins reading Abstract/Introduction).
  **Scope:** Abstract and Introduction only.
  **Outcomes:**
  *   **DR (Desk Reject):** Fatal flaw, not salvageable without rewriting the core argument.
  *   **NB (Note Back):** Fatal flaw identified, but fix is obvious. Author invited to resubmit as new manuscript if corrected.
  *   **SR (Send to Referees):** Passes all gates; requires specialist expertise to evaluate soundness.

  ---

  #### Gate 1: Scope Alignment
  *   **Question:** Does the scope of the evolutionary explanation match the scope of the metaphysical/epistemic conclusion?
  *   **Pass:** The paper argues from a local evolutionary story (e.g., kin altruism) to a local conclusion (e.g., skepticism about family obligations), OR from a global story (e.g., general fitness-tracking) to a global conclusion (e.g., global error theory).
  *   **Fail:** The paper infers global skepticism from a local evolutionary story, or local realism from a global debunking argument, without explicit bridging premises in the introduction.
  *   **Outcome:** **DR**. (Overgeneralization is a fatal structural error).
  *   **Judgment Marker:** **[Editor Judgment]** required to determine if the bridging premise is merely implicit or absent.

  #### Gate 2: Explanatory Independence (The "Whether or Not" Test)
  *   **Question:** Does the argument rely on the claim that the belief would have been selected *regardless* of its truth (insensitivity), or does it rely on a specific claim about *why* it was selected (adaptationism)?
  *   **Pass:** The introduction explicitly states that the evolutionary cause is independent of the moral truth (the "off-track" claim).
  *   **Fail:** The argument assumes that because a trait is adaptive, it is false, without arguing that the adaptation would have occurred even if the moral fact were different.
  *   **Outcome:** **DR**. (Confuses adaptation with falsity).
  *   **Judgment Marker:** None. This is textual.

  #### Gate 3: The Tracking Gap (The Realist's Escape Route)
  *   **Question:** Does the author address how a moral belief *could* have tracked the truth given the evolutionary story, or why that route is blocked?
  *   **Pass:** The introduction acknowledges standard realist replies (e.g., Third Factor, Pre-established Harmony, Indirect Tracking) and explains why they fail in this specific case.
  *   **Fail:** The introduction presents the evolutionary explanation as a defeater without addressing how a realist might claim evolution tracks truth (or why that is impossible here).
  *   **Outcome:** **NB**. (This is a literature engagement failure. If the move is novel, they must cite the obstacle. If they fix the citation/argument, it may pass).
  *   **Judgment Marker:** **[Editor Judgment]** required to assess if the dismissal of tracking is plausible on its face.

  #### Gate 4: Dialectical Independence (The Begging the Question Test)
  *   **Question:** Is the premise doing the debunking work one that the target opponent (the realist) can accept without abandoning their view?
  *   **Pass:** The argument uses premises acceptable to the realist (e.g., "Evolution shaped our minds") to generate a problem internal to their view.
  *   **Fail:** The argument relies on a premise the realist must reject to hold their view (e.g., "Only natural properties exist" used to debunk non-naturalist realism).
  *   **Outcome:** **DR**. (This is not a debunking argument; it is a restatement of anti-realism).
  *   **Judgment Marker:** **[Editor Judgment]** required to identify the target view and the contentious premise.

  #### Tie-Breaker
  If the procedure yields conflicting outcomes (e.g., Pass Gate 3, Fail Gate 4) or judgment is stalled:
  *   **Settler:** The **Editor**. In cases of doubt regarding dialectical fairness (Gate 4), default to **SR**. In cases of structural scope (Gate 1), default to **DR**.

  ---

  ### Application to Abstracts

  #### Case 1: Free-Riding & Reputation
  *   **Abstract:** Intuitions about unfairness of free-riding are explained by reputation management in small-scale groups. Realism about fairness fails.
  *   **Gate 1 (Scope):** Local story (free-riding) $\to$ Local conclusion (fairness realism). **Pass.**
  *   **Gate 2 (Independence):** Implies reputation management works regardless of normative fairness. **Pass.**
  *   **Gate 3 (Tracking):** *Risk Area.* Does it address that reputation and fairness might correlate? If the intro ignores "Third Factor" replies (e.g., cooperation is both fit and fair), it stalls here. Assuming standard engagement: **Pass/NB.**
  *   **Gate 4 (Dialectical):** Realists can accept reputation management. **Pass.**
  *   **Verdict:** **SR**. This is a standard, well-formed local debunking argument. It needs referees to check the evolutionary psychology and the specific metaethical rebuttal.

  #### Case 2: Incest & Global Skepticism
  *   **Abstract:** Selection installed incest-avoidance intuitions whether or not incest were wrong. Therefore, no moral belief is justified. Global skepticism follows.
  *   **Gate 1 (Scope):** Local story (incest) $\to$ Global conclusion (no moral belief). **Fail.**
  *   **Outcome:** **DR**.
  *   **Reasoning:** This is the classic overgeneralization error. Unless the introduction argues that incest avoidance is the *foundation* for all morality (a heavy lift not usually in the abstract), the scope mismatch is fatal.
  *   **Judgment:** None required. Textual mismatch.

  #### Case 3: Farmed Animals & Vindication
  *   **Abstract:** Nothing in our fitness history explains concern for the welfare of farmed animals. Intuitions in that domain are untouched by debunking and stand vindicated by the absence of an adaptive story.
  *   **Gate 1 (Scope):** Local story (absence of adaptation) $\to$ Local conclusion (animal welfare intuitions). **Pass.**
  *   **Gate 2 (Independence):** N/A (This is a vindication argument, not a debunking one). **Pass.**
  *   **Gate 3 (Tracking):** *Critical Fail.* The argument moves from "Not Debunked" to "Vindicated." Absence of a defeater is not a positive account of tracking. The introduction must explain why these intuitions are reliable, not just why they aren't unreliable. If it claims *vindication* (positive justification) solely from the *absence* of genealogy, it fails the epistemic burden.
  *   **Gate 4 (Dialectical):** Realists can accept the absence of an adaptive story. **Pass.**
  *   **Verdict:** **NB** (Note Back).
  *   **Reasoning:** The move from "immune to debunking" to "vindicated" is an epistemic leap. The paper may be salvageable if the claim is softened to "prima facie justified" or "defeater-free," but "vindicated" suggests a positive warrant the argument does not supply.

  ---

  ### Bias Check: Case 3
  You asked me to be plain: **Yes, the procedure flags your position.**

  **Where it is unfair:**
  Gate 3 assumes that to avoid skepticism, one must provide a positive account of tracking. However, in many epistemological frameworks (e.g., dogmatism, default entitlement), the *absence* of a defeater is sufficient for justification. If your view is that moral intuitions are innocent until proven guilty, then the absence of an evolutionary defeater *is* the vindication of their default status. The procedure treats "Vindication" as requiring positive evidence (reliabilism), which biases against default-justification views.

  **Where it is fair:**
  The term "Vindicated" typically implies more than "Not Unjustified." It suggests the intuition is likely *true*. If the paper argues that the lack of an adaptive story makes the intuition *more likely to be true* (rather than just *permissible to hold*), the procedure correctly identifies a gap. Absence of a fitness explanation does not entail presence of a truth-tracking explanation; it could entail noise, cultural drift, or randomness. If the introduction does not distinguish between "permissible to believe" and "likely true," the procedure correctly identifies an ambiguity that referees would otherwise waste time clarifying.

  **Recommendation:** If you are editing your own work or similar views, ensure the Introduction explicitly distinguishes between *negative vindication* (immunity to debunking) and *positive vindication* (reliability). The procedure passes the former; it rejects the latter.

  ---

  ### Limitations & Failure Modes

  **What the Procedure Cannot Decide:**
  1.  **Evolutionary Accuracy:** I cannot determine in 40 minutes if the evolutionary psychology is sound. Gate 2 checks for the *structure* of the claim, not the biological truth. A paper can pass Gate 2 and still be biologically nonsense. This is left to referees.
  2.  **Metaethical Nuance:** The procedure treats "Realism" as a monolith. It may fail to distinguish between non-naturalist realism (vulnerable to Gate 4) and naturalist realism (less vulnerable). If the introduction is vague about the target metaethics, Gate 4 becomes a coin flip.
  3.  **Novelty:** The procedure checks for structural soundness, not contribution. A paper can pass all gates and still be a trivial rehash of Street (2006) or Vavova (2014). This requires skimming the bibliography, which eats into the 40-minute budget.

  **Expected Failure Mode:**
  **False Negatives on Gate 4 (Dialectical Independence).**
  This is the most subjective gate. Authors often disguise question-begging premises as neutral empirical claims. For example, defining "moral truth" in a way that implicitly excludes non-natural properties within the evolutionary premise. In a 40-minute read, an editor might miss a subtle definition buried in the third paragraph of the introduction.
  *   *Consequence:* Papers that are actually circular arguments get sent to referees (wasting goodwill), or papers that make a novel but subtle dialectical move get desk rejected because the editor read the premise as begging the question.
  *   *Mitigation:* When in doubt on Gate 4, the Tie-Breaker dictates **SR**. It is better to waste a referee's time than to kill a novel argument that merely *looks* question-begging on a fast read.
