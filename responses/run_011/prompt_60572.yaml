answer: |-
  **Step 1 — Brainstorm and Pruning**

  *Candidate Requirements:* Must explain why we follow rules when no one looks; must distinguish law from etiquette; must handle unjust rules; must handle useless rules; must handle opt-outs; must handle market boundaries; must handle coordination problems; must handle fairness; must handle identity/community membership; must handle time limits; must handle anonymity; must explain blameworthiness; must explain content-independence; must explain function.

  *Pruning and Ranking:* I discard "distinguish law from etiquette" as out of scope; this project concerns everyday conventions, not legal systems. I merge "handle identity" and "handle time limits" into a single requirement regarding membership thresholds. I discard "explain function" as a substantive prejudice rather than a neutral requirement (see Step 3). I rank "Non-Prudential Force" highest, as without it, conventions collapse into mere habits. I rank "Market Boundaries" lowest, as it may be derivative of deeper moral constraints.

  *Discarded:* "Explain function" is discarded because many conventions (like dress codes) lack clear teleological purposes yet persist; demanding a function begs the question against non-instrumental accounts. "Distinguish law" is discarded because legal obligation involves state coercion, which is absent in the target cases.

  **Step 2 — The Desiderata**

  1.  **Non-Prudential Normativity:** The theory must explain why compliance is obligatory rather than merely prudent when deviation carries no immediate personal cost.
      *   *Motivation:* In **The Two Equilibria** (driving on the right) and **The Empty Street** (jaywalking at 3 a.m.), there is no physical danger or coordination failure, yet violating the norm feels distinct from mere imprudence.
      *   *Why Requirement:* If the theory reduces convention to coordination stability, it cannot distinguish social obligation from game-theoretic equilibrium.
      *   *Classification:* Non-negotiable for any theory claiming conventions generate *obligations*.
      *   *Failure Mode:* The theory implies the jaywalker is merely making a strategic error rather than violating a normative expectation.

  2.  **Functional Independence:** The theory must account for the persistence of obligation even when the convention's original practical purpose has evaporated.
      *   *Motivation:* In **The Dead Rule** (clipboard for a useless key), compliance persists despite the lock being changed.
      *   *Why Requirement:* A theory tying obligation strictly to instrumental utility cannot explain why useless rules retain normative grip.
      *   *Classification:* Non-negotiable; required to distinguish convention from technical instruction.
      *   *Failure Mode:* The theory implies the clipboard signers are irrational or mistaken, rather than fulfilling an obligation.

  3.  **Conditional Dissolution:** The theory must specify whether and how an individual can unilaterally exit a conventional obligation without community consent.
      *   *Motivation:* In **The Announced Opt-Out**, a colleague declares he will stop signing; in **The Queue**, someone announces they aren't waiting.
      *   *Why Requirement:* Without exit conditions, conventions become indistinguishable from captivity; with too much freedom, they collapse into preference.
      *   *Classification:* Non-negotiable; required to define the scope of agency within conventions.
      *   *Failure Mode:* The theory implies either that announcement never works (tyranny of the norm) or always works (normative fragility).

  4.  **Participation Threshold:** The theory must explain how duration and depth of participation affect binding force.
      *   *Motivation:* In **The Long-Stay Guest**, a vegetarian stays for three months versus three days in a meat-eating household.
      *   *Why Requirement:* Obligations often scale with integration; a theory must identify the tipping point where guest becomes member.
      *   *Classification:* Non-negotiable; required to handle partial membership cases.
      *   *Failure Mode:* The theory implies the guest is bound immediately upon entry or never bound regardless of duration.

  5.  **Moral Separability:** The theory must explain whether an obligation can exist even when the convention's content is unjust or morally suspect.
      *   *Motivation:* In **The Convention Worth Breaking** (sexist dress codes), compliance is unjust, yet the norm is enforced.
      *   *Why Requirement:* If conventions only obligate when morally good, they are redundant to morality; if they obligate when bad, they conflict with morality.
      *   *Classification:* Demanded by anti-reductionists; question-begging for moral naturalists.
      *   *Failure Mode:* The theory implies there is no convention-based reason to comply (reducing it to pure morality) or that one is obligated to be unjust.

  6.  **Market Boundary:** The theory must explain why some conventional goods resist commodification while others do not.
      *   *Motivation:* In **The Queue That Resists Money**, selling a spot is forbidden, whereas hailing a cab invites payment.
      *   *Why Requirement:* Conventions often define what is not for sale; a theory must explain this normative boundary.
      *   *Classification:* Demanded by social ontologists; optional for strict consequentialists.
      *   *Failure Mode:* The theory implies selling a queue spot is morally neutral if efficiency gains exist.

  7.  **Collective Rationality Constraint:** The theory must explain whether stability alone generates obligation when the convention leads to collective harm.
      *   *Motivation:* In **The Locally Sane, Globally Ruinous Convention** (overfishing), the norm is stable but destructive.
      *   *Why Requirement:* A theory cannot validate obligations that ensure collective suicide without significant qualification.
      *   *Classification:* Non-negotiable; required to avoid absurd moral conclusions.
      *   *Failure Mode:* The theory implies fishermen are obligated to destroy their own livelihood.

  *Specification Critique:* Your cases **The Dead Rule** and **The Empty Street** test the same underlying intuition (normativity without consequence), as do **The Convention Worth Breaking** and **The Locally Sane Convention** (moral limits). I have treated them separately here to preserve your granularity, but a parsimonious theory might collapse these pairs.

  **Step 3 — Separate Requirements from Prejudices**

  1.  **Content-Independence:** The demand that the reason for compliance be *that it is the rule*, not *what the rule says*.
      *   *Verdict:* Camp Prejudice (Legal Philosophy).
      *   *Argument:* This is imported from accounts of legal authority (e.g., Raz). In everyday conventions, content often matters (e.g., we follow queue norms because they are fair, not just because they exist). Demanding strict content-independence rules out hybrid accounts unnecessarily.

  2.  **Blameworthiness:** The demand that violators be morally blameworthy, not merely imprudent.
      *   *Verdict:* Genuine Desideratum.
      *   *Argument:* Without the possibility of appropriate blame or resentment, the phenomenon is not an obligation but a suggestion. This distinguishes the normative from the advisory.

  3.  **Non-Reductionism:** The demand that conventions not be reducible to mutual advantage or game-theoretic equilibrium.
      *   *Verdict:* Camp Prejudice (Social Ontology).
      *   *Argument:* This assumes what must be proved. If mutual advantage explains the obligation, reduction is successful. Demanding non-reductionism a priori biases the inquiry against naturalistic accounts.

  4.  **Functionalism:** The demand that the obligation be explained by the convention's purpose or function.
      *   *Verdict:* Camp Prejudice (Teleological Ethics).
      *   *Argument:* As seen in **The Dead Rule**, conventions often lose their function but keep their force. Requiring a function excludes accounts based on reciprocity or commitment.

  **Step 4 — The Impossibility Result**

  There is a inconsistent triad among **Non-Prudential Normativity** (Req 1), **Moral Separability** (Req 5), and the **Collective Rationality Constraint** (Req 7).

  *Argument:* Consider **The Locally Sane, Globally Ruinous Convention** (the fishing village). The convention is stable and universally observed (satisfying the setup for Non-Prudential Normativity: everyone expects compliance). The convention is destructive (triggering the Collective Rationality Constraint: it should not obligate). However, if Moral Separability holds, the unjust or harmful content does not negate the convention-based obligation.
  1. If the theory satisfies **Non-Prudential Normativity**, it must find an obligation source in the stable regularity itself.
  2. If the theory satisfies **Moral Separability**, it must admit that the harmful content does not automatically void this obligation.
  3. If the theory satisfies the **Collective Rationality Constraint**, it must deny the obligation because the outcome is ruinous.
  In the fishing case, the regularity is stable (1), but the content is ruinous (3). If you honor (1) and (2), you violate (3) by obligating fishermen to ruin themselves. If you honor (3), you must deny (1) or (2), implying either that the regularity creates no obligation (collapsing into prudence) or that content matters (violating separability).

  *Resolution:* A reasonable theorist should abandon **Moral Separability** in its strong form. Conventions can generate *pro tanto* reasons, but these cannot survive direct conflict with catastrophic collective harm. The surviving theory must concede that convention-based obligations are *defeasible* by substantive moral facts, not merely procedural ones. This means conventions are not independent sources of obligation but amplifiers of underlying moral principles (like fairness or non-harm).

  **Step 5 — Exclusionary Power**

  The desideratum that does the most work is **Non-Prudential Normativity** (Req 1). It knocks out pure game-theoretic accounts immediately, as equilibria explain stability but not obligation. A theory that cannot move from "I should do this to coordinate" to "I should do this because it is owed" fails the core brief.

  The desideratum most often treated as central despite excluding almost nothing is **Functionalism** (discarded in Step 3, but often demanded). Theories can always posit a latent function (e.g., "social cohesion") to save the requirement, making it unfalsifiable. It acts as a shield for weak theories rather than a test.

  **Step 6 — Brief Scoring**

  *Critique of Specification:* As noted, your cases overlap. **The Dead Rule** and **The Empty Street** both test normativity without utility. **The Convention Worth Breaking** and **The Locally Sane Convention** both test moral limits. A streamlined specification would merge these to avoid double-counting theoretical failures.

  *The Burden-Transfer Account:* This view holds that obligation arises when identifiable others bear costs to benefit S, requiring reciprocation.
  *Critique:* The "identifiability" clause is doing illegitimate work. In **The Two Equilibria** (driving), the benefit is borne by millions of anonymous drivers. If "identifiable" means specific individuals, the theory fails the driving case. If it means "a defined class," it collapses into a standard Fair-Play account. Furthermore, this is likely a Fair-Play account with the politics hidden; Fair-Play argues that receiving benefits creates obligations. Burden-Transfer simply shifts the focus from receipt to the giver's cost, but the normative structure (reciprocity for benefit) remains identical.

  *Scorecard:*

  | Desideratum | Burden-Transfer | Coordination+Moral | Rule-Utilitarian | Joint-Commitment | Fair-Play |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Non-Prudential** | **Pass** (Cost creates duty) | **Partial** (Needs moral add-on) | **Pass** (Rule utility) | **Pass** (Commitment binds) | **Pass** (Fairness binds) |
  | **2. Functional Indep.** | **Pass** (Cost persists) | **Fail** (Coordination fails) | **Fail** (Utility drops) | **Pass** (Commitment holds) | **Pass** (Benefit received) |
  | **3. Dissolution** | **Fail** (Costs already borne) | **Pass** (Coordination ends) | **Pass** (Utility changes) | **Fail** (Commitment binds) | **Fail** (Benefit received) |
  | **4. Participation** | **Pass** (Costs scale) | **Fail** (Binary equilibrium) | **Pass** (Utility scales) | **Pass** (Commitment scales) | **Pass** (Benefit scales) |
  | **5. Moral Sep.** | **Fail** (Unjust costs don't bind) | **Fail** (Morality overrides) | **Fail** (Utility overrides) | **Pass** (Commitment independent) | **Fail** (Unjust benefits) |
  | **6. Market Boundary** | **Partial** (Depends on cost type) | **Fail** (Efficiency rules) | **Fail** (Efficiency rules) | **Pass** (Commitment type) | **Partial** (Benefit type) |
  | **7. Collective Harm** | **Pass** (No benefit in ruin) | **Pass** (Morality overrides) | **Pass** (Utility negative) | **Fail** (Commitment holds) | **Pass** (No benefit in ruin) |

  *Summary:* The Burden-Transfer account performs well on harm and function but struggles with unilateral opt-outs (if others already paid costs, can you opt out?) and moral separability (it rightly denies obligation in unjust cases, but this may violate your strict separability desideratum). It is substantively a Fair-Play variant, distinguished only by emphasizing the *sacrifice* of the conformers rather than the *receipt* of the beneficiary.
