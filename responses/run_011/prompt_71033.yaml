prompt: |-
  I work on positional games — Hex, Maker–Breaker, tic-tac-toe-like achievement games — and I know the standard strategy-stealing arguments there intimately, including exactly which structural features they depend on. I keep meeting the same phrase, "the strategy-stealing assumption," in writing about advanced AI and the very long-run future, where it is made to mean something quite different: that a sufficiently capable agent loses nothing by deferring particular value-driven projects, because resources are fungible and whatever could have been done sooner can also be done later, with more of them.

  Restate that claim as faithfully as you can in the vocabulary I actually use — players and their available move sets, the monotonicity of additional moves, perfect information, determinate terminal conditions, existence proofs as against constructions — and then give me the residue report. Which features of the original combinatorial argument carry over intact, which carry over only under distortion, and which have no counterpart in that setting at all? Above all: does the borrowed claim inherit any of the original argument's force, or only its name? Keep the translation honest — if you have to add a premise to make the mapping work, flag it as an addition rather than presenting it as part of the translation. Where something fails to translate, tell me whether the limitation lies in the game-theoretic framework or in the clarity of the claim being translated.

  Please write the response in American English.
