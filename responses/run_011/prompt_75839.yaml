      *   *Actually, there is a stronger legal argument for B prevailing over A's entrenchment.* A body cannot limit its own future sovereignty unless explicitly authorized. Old Article 9 did not authorize creating unamendable clauses. Therefore, the "unamendable" part of A is void. But A also changes the threshold to Unanimity. B changes it to Majority. They are still mutually exclusive on the threshold.
