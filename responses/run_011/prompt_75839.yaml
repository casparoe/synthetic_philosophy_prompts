      *   *Why:* It admits the tool failed. It prevents the "unamendable" trap (which is legally dubious anyway). It prevents the "simple majority" rush. It forces a deliberate choice. It aligns with the "Paradox of Sovereignty" concept (we can't vote ourselves into a cage without clear prior consent).
