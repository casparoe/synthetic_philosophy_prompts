      *   *Why:* In EU, risk attitude is global and determined solely by $u$. In REU, risk attitude is determined by $r$ applied to cumulative probabilities.
      *   *Counterexample:* The "Common Ratio Effect" or specific Allais-style patterns.
      *   *Key Distinction:* EU implies that risk attitude is invariant to the *outcomes* (only depends on utility differences). REU allows risk attitude to vary depending on the *probability distribution* structure independently of utility.
      *   *Specific Technical Point:* If you fix the utility function (measured via standard gambles), REU predicts different choices than EU on other gambles. If you allow $u$ to be re-fit for every choice, then yes, everything collapses to EU, but that trivializes EU too. The argument is that REU captures *preferences over risk structures* that EU cannot capture *without changing the utility function*.
