      *   *Draft Claim:* "R has to be increasing with R(0)=0 and R(1)=1, and if R is convex the agent is risk averse."
      *   *Correction:* In Buchak's REU, risk aversion corresponds to a *concave* risk function $r(p)$, not convex. Wait, let me double-check.
          *   Standard EU: $EU = \sum p_i u(x_i)$.
          *   REU: $REU = \sum [r(\sum_{j=i}^n p_j) - r(\sum_{j=i+1}^n p_j)] u(x_i)$ (for ordered outcomes). Or integral form: $\int r(P(u(X) \ge t)) dt$.
          *   If $r$ is convex, the agent *overweights* high probabilities of good outcomes (risk-seeking). If $r$ is concave, the agent *underweights* high probabilities (risk-averse).
          *   *Wait, check Buchak's specific convention.* Buchak (2013) *Risk and Rationality*.
          *   Formula: $REU(f) = u(x_1) + r(p_2)[u(x_2)-u(x_1)] + r(p_2+p_3)[u(x_3)-u(x_2)] ...$
          *   Actually, let's look at the weighting. Risk aversion means you care more about the worst outcomes relative to EU. This implies overweighting the probability of *bad* outcomes or underweighting the probability of *good* outcomes.
          *   In the cumulative distribution form: $V(f) = \int_{-\infty}^{\infty} r(P(f \ge x)) du(x)$.
          *   If $r$ is convex, $r(p) > p$ for $p \in (0,1)$. This means you overweight the probability of doing *at least* this well. That sounds like risk-seeking (optimism).
          *   If $r$ is concave, $r(p) < p$. You underweight the probability of doing at least this well. That sounds like risk-averse (pessimism).
          *   *Draft says:* "if R is convex the agent is risk averse."
          *   *Verdict:* **This is technically backwards.** Convex $r$ = risk-seeking. Concave $r$ = risk-averse. This is a critical error.
