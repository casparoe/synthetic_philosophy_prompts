      *   *Critique:* "Deep uncertainty" usually refers to unknown probabilities (ambiguity/Knightian uncertainty). REU assumes *known* probabilities (risk) but distorted weighting. REU is not Ambiguity Theory (like Maxmin Expected Utility).
      *   *Connection:* Effective Altruists (EAs) talk about REU regarding longtermism (low prob, high value). This is "risk" (if probs are known) or "ambiguity" (if probs are unknown).
      *   *Problem:* If the user means "longshot charitable giving" (e.g., existential risk), REU is often invoked there. But if the probabilities are unknown, REU isn't the right tool (need ambiguity models). If probabilities are known (e.g., 1 in a billion), REU says "don't do it" (if risk averse).
      *   *Overreach:* The conclusion follows from Worry 2 (splitting) but Worry 1 is shaky. The "deep uncertainty" framing is technically slightly off (REU is for risk, not ambiguity), but colloquially accepted in EA circles.
      *   *Better Application:* General decision-making under risk where Independence violations are intuitive (insurance + lottery), or specific EA longtermist calculations where probabilities are estimated but risk attitudes matter.
