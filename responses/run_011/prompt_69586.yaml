      *   *Argument:* Convexity of $R$ is just concavity of $u$ moved. It's a notational variant. No new preferences licensed.
      *   *Analysis:* This is the "reduction to EU" objection.
      *   *Fact:* REU is *not* representable as EU with a transformed utility function *if* we require the utility function to be unique up to positive affine transformations and probabilities to be fixed.
      *   *However:* Mathematically, any REU functional can be represented as an EU functional with a *different* probability measure (non-additive) or a different utility function *if* we allow the utility function to depend on the gamble structure.
      *   *The specific claim:* "Any preference pattern a convex R generates, some concave u could generate too."
