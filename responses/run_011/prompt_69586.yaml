      *   *Wait, check the convexity again.* If the draft got convex/concave backwards, does that ruin the argument? The argument is "R does the work u does." Even if R is concave (risk aversion), the claim is that EU with concave u does the same work. The rebuttal is: EU with concave u cannot do the Allais pattern. REU can. So they aren't equivalent.
      *   *Verdict:* Worry 1 is weak/wrong as stated. It confuses "risk aversion" (rejecting fair gambles) with "Allais patterns" (violating Independence). Concave $u$ gives the former, not the latter.

