  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Validate the frustration. This is a version of the "Problem of Moral Luck" (Nagel/Williams). The philosopher is using a consequentialist trap.
      *   **Diagnosis of Premise (1):** This is the primary break.
          *   It defines responsibility as *retrospective liability for consequences*.
          *   Historical/Legal responsibility is often *prospective liability for risk/aggression*.
          *   Analogy: Drunk driving. You are responsible for the drive, not just the crash.
