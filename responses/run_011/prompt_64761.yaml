      *   **Address the Fischer Context:** Explain why the archives *still matter* even if the philosopher's logic holds some water. Fischer wasn't just proving Germany caused the war; he was proving Germany *wanted* specific political outcomes (Mitteleuropa, etc.). This bypasses the "accidental war" defense.
