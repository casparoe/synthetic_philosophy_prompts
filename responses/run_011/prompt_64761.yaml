      *   *Premise (2):* "A state can be responsible for an outcome only if a reasonable government... would have recognised that its actions were likely to bring that outcome about..."
          *   *Critique:* This is a standard foreseeability condition (mens rea equivalent). It's plausible but depends on how "outcome" is described.
