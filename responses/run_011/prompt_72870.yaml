answer: |-
  Here are the desiderata any theory of sortition-based legislative legitimacy must satisfy to withstand scrutiny at a charter hearing. They are categorized by whether they are **Non-Negotiable** (logical prerequisites for the system to function as a legislature) or **Contingent** (specific preferences of the sortition camp that are not strictly required for legitimacy).

  ### 1. Participatory Neutrality (The Volunteer-Pool Problem)
  **The Requirement:** The mechanism must demonstrate that the final seated body is statistically indistinguishable from the stratified voter roll, regardless of who volunteers.
  **The Worry:** Sortition relies on the law of large numbers, but service is voluntary. If only the retired, the ideologically extreme, or the economically idle accept the summons, the "mirror representation" claim collapses. You end up with a self-selected elite of the available, not a microcosm of the town.
  **Status:** **Non-Negotiable.** If the chamber does not mirror the demographic and political distribution of the electorate, it loses its primary claim to legitimacy (descriptive representation) and becomes just another unaccountable interest group.

  ### 2. Epistemic Sufficiency (The Competence Claim)
  **The Requirement:** The system must produce decisions that are at least as robust as those produced by the elected alternative, despite the absence of competence testing.
  **The Worry:** Why a lottery rather than a test? The standard defense is the "wisdom of crowds" or that political judgment is common sense. However, municipal governance involves zoning codes, bond measures, and regulatory compliance. If the chamber consistently votes for legally impossible or fiscally ruinous measures because they lack basic literacy in governance, the system fails.
  **Status:** **Non-Negotiable.** A legislature that cannot pass lawful or executable budgets is not a legislature; it is a debating society. The theory must explain how amateurs overcome the complexity barrier without filtering for expertise.

  ### 3. Informational Sovereignty (The Briefing Problem)
  **The Requirement:** The chamber must retain effective control over the agenda, the drafting of legislation, and the interpretation of data provided by staff.
  **The Worry:** Amateurs cannot research everything. They rely on the "permanent professional presiding officer" and paid staff to write the briefings and draft the bylaws. If the staff determines what problems are visible and what solutions are plausible, the staff is the legislature, and the citizens are a rubber stamp.
  **Status:** **Non-Negotiable.** If the citizens do not control the information flow, they do not hold power. This is the point of greatest vulnerability to bureaucratic capture.

  ### 4. Ex Post Accountability (The Removal Problem)
  **The Requirement:** There must be a mechanism to sanction or remove the chamber (or individual members) for gross negligence, corruption, or sustained failure, without relying on re-election.
  **The Worry:** No voter can ever throw the chamber out. In an elected system, the threat of removal disciplines behavior. In a one-term lottery, members have no electoral incentive to please constituents and cannot be punished at the ballot box. If the only check is a recall election, you reintroduce the dynamics of campaigning you sought to avoid.
  **Status:** **Non-Negotiable.** Power without the possibility of removal is tyranny, regardless of how the power-holders were selected.

  ### 5. Institutional Continuity (The Memory Problem)
  **The Requirement:** The system must preserve institutional knowledge across the 100% turnover cycle.
  **The Worry:** You specified single three-year terms with no re-selection. This means every three years, the town loses 100% of its legislative experience. Unlike an elected body where incumbents mentor newcomers, here the "permanent professional presiding officer" becomes the sole repository of memory, increasing their power (see *Informational Sovereignty*).
  **Status:** **Contingent.** This is a specific design choice of your town's proposal. A theory of sortition *could* allow for staggered terms or partial re-selection to maintain memory. However, the current proposal's rigid rotation makes this a critical failure point.

  ***

  ### Trade-offs and Impossibility
  **Can these be jointly satisfied?**
  **No.** There is a fundamental tension between **Participatory Neutrality** and **Epistemic Sufficiency**.
  To ensure the chamber is a true statistical mirror (Neutrality), you must accept whoever shows up (or compel service like jury duty). To ensure they are competent enough to govern complex issues (Sufficiency), you generally need training, screening, or motivation filters.
  *   If you compel service to fix the Volunteer-Pool, you lower motivation and potentially competence.
  *   If you train them heavily to fix Competence, you risk biasing them (breaking Neutrality) or handing control to the trainers (breaking Informational Sovereignty).
  *   If you give them independent research staff to fix Sovereignty, you bloat the budget and risk creating a parallel bureaucracy.

  You can optimize for two, but you will likely degrade the third.

  ### The Single Most Exclusionary Requirement
  **Informational Sovereignty.**

  This is the hurdle that kills the most theories. It is empirically difficult to prove that a body of amateurs controls the agenda when they are dependent on professionals for information. In almost all existing models of advisory or legislative sortition, the permanent staff inevitably drifts from "servants of the chamber" to "guardians of the process."

  If you cannot demonstrate a structural firewall that prevents the professional presiding officer from framing the questions, defining the options, and summarizing the data, the lottery is merely theater. This requirement excludes almost every real-world implementation where sortition is mixed with professional bureaucracy, making it the hardest claim to substantiate at your hearing.
