      *   **Paragraph 4:** Response 1 (Scanlon). Distinction between reasons to favour vs. reasons to want/get oneself to favour. Critique: Circularity (restating the distinction).
      *   **Paragraph 5:** Response 2 (Hieronymi). Reasons bear on questions. Threat bears on "is it good to admire," not "is he admirable." Critique: Same burden as Scanlon (characterizing the question without fittingness). Prefers Hieronymi slightly.
      *   **Paragraph 6:** Third consideration (Student's own view?). FA collapses or becomes hostage to theory of attitudes. Analogy to belief (Shah/Velleman). Claims WKR is a verbal problem.
