      *   *Looking closer at (c):* The prompt asks "Say which response you find more convincing." The student says "A third consideration seems to me to settle the matter, and to settle it against FA." This is a direct refusal of the binary choice. In an exam setting, this is risky. I will mark it down slightly but acknowledge the strength. 5/7.
