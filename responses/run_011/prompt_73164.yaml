answer: |-
  Look, I understand why it feels like splitting hairs. When you're staring down a barrel of structural uncertainty—where the model itself is shaky—"0.1 to 0.5" sounds suspiciously like "who knows?" But there is a cash difference, and it's stark. The shrugger, the person who truly has *no idea*, is operating with what we call a vacuous interval: zero to one. For them, any probability is possible. For me, the probability is constrained. I have ruled out the world where this therapy is almost certainly useless, and I've ruled out the world where it's a miracle cure. That exclusion is information, and it buys me leverage.

  Here is the bet. Suppose I offer to sell you a ticket for five cents that pays out a dollar if the therapy halves mortality. You take it. Why? Because my lower bound is 0.1. I am committed to the claim that the chance is at least one in ten, so paying five cents is a favorable gamble for me. The shrugger won't touch that ticket. For all they know, the real probability is 0.001, in which case they're throwing money away. They remain paralyzed because their state of mind hasn't ruled out the disaster scenarios. I have ruled them out. I walk away from the table with a ticket in my pocket; they walk away empty-handed. That is an observable difference in behavior derived directly from the width of the interval.

  But there's a deeper point about accountability, which I know is close to your desk's heart. When you force a single number, say 0.3, you're asking me to sign a contract I can't fulfill. If the true rate turns out to be 0.09, you can call me wrong. But if I give you the interval, I'm telling you exactly where the evidence runs out. I'm saying, "I will stand behind any claim within this range, but I will not pretend to know more." The shrugger avoids accountability entirely; the precise forecaster invites false accountability. I'm offering the only honest middle ground: I am accountable for the bounds, and those bounds are wide because the evidence demands they be wide.
