answer: |-
  1.
  Registrar Elara dipped her stylus into the inkwell and hovered over the form for the herd's ventilation flaps. On Earth, ancestors of these beasts had used the flaps to dump excess heat during high-exertion mating runs. Here, under the dome's constant twilight, the flaps remained sealed shut, fused by generations of disuse. They contributed nothing to the animal's current survival; indeed, they were dead weight. Yet Elara stamped "FUNCTIONAL" in bold green ink. The Charter was clear: a part exists because ancestors who had it left more offspring. The history was undeniable, even if the utility was extinct. She slid the form across the desk to the breeder. "It's not about what it does now," she said, not looking up. "It's about why it's there. The history certifies the part."

  2.
  Kael shoved the rejection slip back across the same desk, the paper crinkling under his palm. He was pointing at the schematic for the fibrous sac surrounding the second stomach. "History doesn't keep them warm," he said, tapping the thermal readouts. "This does. Animals born without it shiver through the night cycles and fail to breed. Animals with it thrive. Under your rule, this sac is noise. Under mine, it's a heater." He refused to sign the Null Function certificate. To him, the Charter's obsession with the dead past rendered the living present invisible. If the sac contributes to the capacity of the whole organism to survive the dome's cold, it has a function, regardless of whether an ancestor ever needed it.

  3.
  The calf died in the pen behind the office, a slow twisting of the gut that the sac caused in one out of fifty births. Elara stood by the mesh fence, watching the children of the settlement press their faces against the wire. They watched the animal convulse. Under the Charter, the sac was functionless noise; therefore, it could not malfunction. It was merely a trait, like eye color. There was no provision to cull a defect that technically didn't exist. Elara realized then that the quarrel wasn't semantic. If she upheld the Charter, the sac remained legal noise, and the suffering was natural law. If she sided with Kael, the sac became a device, and the twisted guts became broken machines eligible for rendering. She wasn't defining words; she was choosing which animals lived and which were slaughtered.

  4.
  Kael sat alone later, staring at a work-beast's shoulder. A thick callus had formed where the harness rubbed, preventing infection and allowing the animal to pull heavier loads. It was a causal contribution to the organism's capacity that no ancestor had been selected for; it was an accident of labor. If he signed off on this as a function because it helped the animal now, then every scar, every healed wound, every accidental adaptation became biology. He put his pen down. His rule saved the herd from the cold, but it risked turning every random physiological accident into a designed purpose. He couldn't certify the callus, but he couldn't deny the sac either. The logic held, but the boundaries dissolved.

  5.
  Elara took the form for the sac from the pile. She knew the Charter forbade certifying traits without selection history, and she knew the penalty for falsifying a Registry record was permanent revocation of seed credits for her own family line. She dipped the stylus. She wrote "FUNCTION: THERMAL REGULATION" and marked the twisted variants as "MALFUNCTIONING." It allowed the vet to cull the dying calves mercy-fast. She signed her name at the bottom, then slid her badge across the desk to the security officer waiting in the shadows. The officer took the badge and left. Elara picked up the next form, her hand steady, but her future gone.
