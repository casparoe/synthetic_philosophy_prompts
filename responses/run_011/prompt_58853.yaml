answer: |-
  ### 1. Exam Question

  **POLITICAL ETHICS 401: FINAL EXAMINATION**
  **Time Allowed:** 50 Minutes
  **Total Marks:** 25

  **Question 1**

  Read the following case and definition carefully.

  **The Case of Dr. Vaszary**
  Dr. Ilona Vaszary is medical director of a regional public health authority during a severe outbreak of a respiratory infection. The national stockpile of the only effective antiviral is exhausted, and the sole remaining supply is held by a manufacturer recently placed under sanctions; procurement from it is prohibited absent a legislative waiver that will not be granted for six weeks. Vaszary instructs her procurement office to buy through a third-party intermediary and, asked point-blank at a committee hearing whether the antivirals come from a sanctioned source, answers that they do not. The drug reaches patients within days. Over the following year some forty thousand people are treated and the outbreak is contained; eleven patients die of an adverse reaction that a properly conducted trial would likely have identified. Eighteen months later Vaszary discloses the lie to a public inquiry, unprompted and before she is compelled to. The legislature votes compensation to the families of the eleven, formally censures her, and then reappoints her, on the stated ground that the authority cannot function without her.

  **The Ledger Closure Thesis**
  Call the *Ledger Closure Thesis* the claim that a political agent who commits a genuine moral wrong for sufficient political reasons can extinguish the moral remainder of that wrong by satisfying three conditions: full public disclosure of the wrong, material compensation to those it harmed, and submission to formal sanction. Where all three are met, the thesis holds, neither guilt nor diminished moral standing is any longer appropriate in the agent; what legitimately remains is only regret that the world was such that the wrong was required.

  **Task**
  Evaluate the Ledger Closure Thesis against the case of Dr. Vaszary. Your answer must:
  (a) Explain what the "moral remainder" is supposed to consist in, and argue whether the three prescribed steps are the right kind of thing to discharge it;
  (b) Identify the ambiguity in the thesis as to whose ledger is being closed—the agent's or the polity's—and say whether the two can come apart, using the reappointment after censure as your evidence;
  (c) Confront the objection that the first condition, disclosure, may itself work a further wrong on the eleven and their families by making their deaths into the material of her reputation for candour;
  (d) Conclude whether the thesis is false outright or true but restricted. If restricted, state the restriction in a form that does not collapse into "closure is available whenever we feel it is."

  *Note: This is a closed-book examination. Marks are awarded for argumentative precision, not for citations, titles, or attribution of views to authors.*

  ***

  ### 2. Model Answer

  The Ledger Closure Thesis attempts to solve the problem of dirty hands by proceduralizing moral repair. It suggests that guilt is a debt that can be paid off through specific public acts. To evaluate this, we must first define the debt. The "moral remainder" refers to the persistent stain on the agent's integrity and the appropriateness of guilt feelings after a wrongful act, even if that act was necessary. It is not merely a social debt owed to the community, but an internal corruption of the agent's moral character. The three steps—disclosure, compensation, and sanction—are external, transactional mechanisms. They address the social breach and the victim's loss, but they do not necessarily scrub the agent's soul. One can pay compensation and still remain the kind of person who lies to save lives. Therefore, the steps are sufficient to restore political trust, but insufficient to extinguish personal guilt.

  This reveals the central ambiguity in the thesis: whose ledger is being closed? There is the agent's internal moral standing, and there is the polity's external willingness to continue employing the agent. These two ledgers can come apart, and the Vaszary case proves it. The legislature censures Vaszary (satisfying the sanction condition) and compensates the families, yet reappoints her because she is indispensable. This reappointment signals that the *polity's* ledger is closed; the state forgives the transgression for the sake of future utility. However, Vaszary's *own* ledger need not be closed. She may rightly continue to feel guilt despite the reappointment, because her integrity was compromised in a way that administrative forgiveness cannot undo. The thesis fails if it claims the reappointment proves her moral standing is fully restored. It is only her political standing that is restored.

  Furthermore, the condition of disclosure introduces a secondary moral hazard. Vaszary discloses the lie eighteen months later, unprompted. While this satisfies the thesis's requirement for candour, it risks instrumentalizing the eleven dead patients. By publicly centering their deaths in her narrative of confession, she transforms their tragedy into the currency of her own moral rehabilitation. She gains a reputation for honesty on the back of their fatalities. If the disclosure is performed primarily to satisfy the Ledger Closure Thesis—to clear her name rather than to honour the dead—it constitutes a further exploitation of the victims. The moral remainder here is not just the lie, but the use of the victims as means to the agent's ethical cleanup. A procedural requirement for disclosure cannot guarantee that the disclosure is motivated by respect rather than self-exoneration.

  Consequently, the Ledger Closure Thesis cannot be accepted outright. It is true but severely restricted. It holds only for the political ledger, not the moral one. The restriction must be that closure is available only when the compensation and sanction are accepted by the victims or their representatives as sufficient, and when disclosure is decoupled from the agent's self-aggrandizement. We cannot simply say closure is available whenever the boxes are ticked, because ticking boxes is a bureaucratic act, not a moral one. The restriction is that procedural closure never eliminates the agent's duty to agent-regret. Vaszary is fit to rule again, and the state has settled its debt, but she remains guilty. The thesis is correct that the world requires such wrongs, but wrong that the agent can walk away from them cleanly. The remainder is not extinguished; it is merely shouldered.

  ***

  ### 3. Marking Scheme (25 Marks)

  | Must-Hit Point | Marks | Common Botch |
  | :--- | :---: | :--- |
  | **1. Definition of Moral Remainder:** Identifies remainder as internal guilt/integrity stain, distinct from external social debt. | 4 | Defines remainder merely as "public anger" or "legal liability." |
  | **2. Evaluation of Steps:** Argues that external transactions (pay/sanction) cannot fully discharge internal moral corruption. | 4 | Assumes compensation automatically erases personal guilt. |
  | **3. Agent/Polity Ambiguity:** Distinguishes between the agent's moral standing and the polity's administrative forgiveness. | 5 | Treats the legislature's forgiveness as identical to moral innocence. |
  | **4. Reappointment Evidence:** Uses the reappointment to show the polity values utility over moral purity (ledgers coming apart). | 3 | Reads reappointment as proof that Vaszary did nothing wrong. |
  | **5. Disclosure Objection:** Argues that confession can exploit victims by using their death for the agent's reputational repair. | 5 | Treats disclosure as an unqualified good without analyzing motive/effect. |
  | **6. Restricted Conclusion:** Concludes thesis is restricted (political vs. moral) and defines restriction without resorting to subjectivism. | 4 | Concludes thesis is false outright, or restricts it based on "feelings." |
  | **Total** | **25** | |

  ***

  ### 4. Specific Mark-Losing Moves

  1.  **The "Tragic Hero" Stop:** The candidate argues Vaszary is "both justified and guilty" and stops there, failing to engage with the specific mechanics of the Ledger Closure Thesis.
  2.  **The Utilitarian Reduction:** The candidate argues the thesis is true because 40,000 saved outweighs 11 deaths, ignoring the deontological constraints built into the definition of "moral remainder."
  3.  **The Weberian Recital:** The candidate ignores the provided text to discuss Weber's "Ethic of Responsibility" vs. "Ethic of Ultimate Ends," earning zero credit for citation-based knowledge.
  4.  **The Bureaucratic Acceptance:** The candidate treats the legislature's censure and reappointment as a sufficient moral verdict, failing to distinguish political reinstatement from moral cleansing.
  5.  **The Subjectivist Collapse:** The candidate restricts the thesis by saying closure depends on "whether the agent feels forgiven," violating the instruction to avoid subjective criteria.

  ***

  ### 5. The Differentiator

  The single point that most reliably separates a first-class answer from a merely good one is the successful disentanglement of the **agent's internal moral standing** from the **polity's external administrative forgiveness**, specifically using the reappointment as evidence that the state can forgive what the conscience cannot.
