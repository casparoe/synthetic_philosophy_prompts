answer: |-
  BRAINSTORMING: MAPPING LOCKE TO SPACE GOVERNANCE

  Candidate Mapping 1: The State as Appropriator. The U.S. and Luxembourg authorize nationals to extract. Locke often treats the Commonwealth as protecting property, but here the State enables acquisition without claiming sovereignty. Strain: The Outer Space Treaty (OST) explicitly forbids national appropriation. If the State is the Lockean agent, it is violating the baseline treaty regime while claiming fidelity to it.

  Candidate Mapping 2: The Firm as Appropriator. The private entity mixes labor (capital/tech) with the asteroid. Strain: Locke's laborer is usually an individual subsistence farmer, not a corporation fueled by terrestrial venture capital. Does "labor" include financial risk and engineering design done on Earth?

  Candidate Mapping 3: The Entry Bundle as the Resource. The scarce good is not the ore but the capacity to reach it. Strain: Locke's proviso concerns natural resources left in common. Artificial constraints (cost, technology) are usually external to the theory. Applying the proviso to capacity requires stretching "enough and as good" to mean "equal opportunity" rather than "physical surplus."

  Candidate Mapping 4: Safety Zones as Provisional Property. Artemis Accords allow exclusion for safety without claiming ownership. Strain: Locke justifies exclusion via property title. Exclusion without title looks like force or jurisdiction, not property. This bypasses the non-appropriation clause while achieving Lockean exclusion.

  Candidate Mapping 5: Extraterritorial Projection. Property rights are granted terrestrially and applied extraterritorially. Strain: This suggests no "initial acquisition" occurs in space at all. The state of nature is not space, but the legal vacuum between terrestrial jurisdictions. This might render Locke's acquisition chapter irrelevant.

  ANALYSIS

  The Conflict of Regimes and the Lockean Lens

  The sequence from the Moon Agreement to the Artemis Accords represents a shift from a *res communis* model (common heritage) to a functional *res nullius* model (open to appropriation), mediated by legal fiction. To analyze this through Locke, we must first settle the ontology of the actors and the domain. In the Lockean framework, property arises when an individual removes something from the common state of nature by mixing their labor with it. In this episode, the "individual" is ambiguous. It is not solely the private firm, because a firm cannot act in space without state authorization and continuing supervision under the OST. Nor is it solely the state, because the U.S. explicitly disclaims sovereignty. The appropriator is a hybrid: a private agent acting under the jurisdictional umbrella of a state that refuses territorial claim but asserts regulatory authority over persons. This creates a peculiar Lockean subject: one who owns the fruit of labor without owning the land from which it grows.

  The state of nature here is not a pre-legal void. It is a treaty-chartered domain where sovereignty is foreclosed but use is permitted. This complicates the Lockean starting point. Locke assumes a common available to all rational beings. The OST makes space the "province of all mankind," which aligns with the Common Heritage principle but conflicts with the Lockean right to unilateral acquisition. The 2015 U.S. Act and Artemis Accords attempt to square this by separating sovereignty from resource rights. They argue that picking an apple does not require owning the orchard. Locke might accept this distinction, but only if the picking does not degrade the common. This leads directly to the proviso.

  Labor, Capital, and the Entry Bundle

  Your first hypothesis concerns the object of the proviso. The standard Lockean defense of space mining argues that the ore is so abundant that removing some leaves "enough and as good" for others. This treats the asteroid as the relevant stock. Your hypothesis suggests the relevant stock is the "entry bundle": launch capacity, capital, trajectories, and data. If we evaluate the proviso against the entry bundle, the Lockean justification collapses. There is not "enough and as good" launch capacity left for others; indeed, the barrier to entry is increasing as prime orbital slots and trajectories are utilized.

  This hypothesis survives contact with the episode. The Artemis Accords emphasize transparency and interoperability, which sounds like sharing, but they also normalize safety zones that privilege early movers. If the scarcity is in access rather than ore, then the first movers are not just harvesting surplus; they are monopolizing the means of harvest. Locke's theory assumes that the laborer brings their own hands to the common. In space, the "hands" are rockets worth hundreds of millions of dollars. If the proviso requires that others be left with the *capacity* to labor, not just the physical residue of the resource, then the current regime violates the Lockean constraint. However, Locke usually treats technology and capital as enhancements of labor, not as part of the common stock. To accept your hypothesis, we must revise Locke to say that when the means of acquisition are themselves scarce and socially constituted, the proviso applies to those means. This is a significant revision, but it is necessary to make the theory fit the industrial reality of spaceflight. The physical abundance of ore is morally irrelevant if the economic scarcity of access prevents others from benefiting from that abundance.

  Extraterritorial Projection vs. Initial Acquisition

  Your second hypothesis is more radical: that this is not initial acquisition but the projection of terrestrial property regimes. This hypothesis is strongly supported by the legal mechanics of the 2015 Act. The U.S. does not grant property rights in the asteroid *in situ*; it grants rights to the citizen to possess and sell what they obtain. The property right is constituted by U.S. law, not by the act of extraction itself. In Locke, the right arises from nature (natural law) prior to government. Here, the right arises from statute.

  This suggests Locke's chapter on property is indeed the wrong tool. We are not watching individuals emerge from a state of nature to claim property; we are watching established polities extend their jurisdictional reach into a domain where they cannot claim territory. The "labor" being mixed is largely terrestrial (engineering, financing, risk-bearing). The extraction is the final step in a terrestrial supply chain. If the value is created on Earth, the property right should logically attach on Earth. The fiction that the property right attaches in space serves to bypass the OST's non-appropriation clause. Therefore, the episode is better analyzed as a question of institutional extension. The conflict is not between nature and culture, but between two competing terrestrial legal cultures: one favoring multilateral management (Moon Agreement) and one favoring unilateral jurisdictional extension (Artemis/2015 Act). Locke is silent on how multiple sovereigns compete to define property rights in a global commons. His theory assumes a single background enforcement mechanism or a state of nature without competing jurisdictions. The space episode reveals a gap in Locke: he does not account for the international competition to define what counts as "labor" or "property."

  Safety Zones and Exclusion Without Title

  The Artemis Accords introduce "safety zones" to prevent harmful interference. This is a critical feature that no appropriation-based theory handles well. Locke justifies exclusion based on property title: I own this land, so I can exclude you. The Accords allow exclusion based on safety operations without claiming title. This creates a zone of *de facto* appropriation without *de jure* ownership.

  From a Lockean perspective, this is unstable. If I can exclude you from an area because my presence makes it unsafe for you, I have effectively appropriated the area without mixing labor with the land itself, merely by occupying it. This looks less like Lockean acquisition and more like a right of priority based on presence. Locke does not discuss temporary exclusion zones for operational safety. He assumes that once labor is mixed, the property is permanent. Space governance requires a theory of temporary, functional exclusion that Locke does not provide. The theory is silent on how to manage overlapping claims where no one owns the ground but everyone needs to operate safely. The Accords fill this silence with a pragmatic rule that favors the incumbent. This suggests that in high-cost environments, operational necessity overrides abstract property theory.

  What the Episode Shows About the Theory

  The near-total non-ratification of the Moon Agreement by spacefaring nations looks like a confirmation of the Lockean picture that commons charters fail because they cannot prevent defection. States capable of extraction refused to bind themselves to a regime that required sharing proceeds without guaranteed returns. However, this is not exactly Locke's prediction. Locke argues that individuals will defect from the common to secure their labor's fruit. Here, states are defecting from a multilateral regime to secure national competitive advantage. This is closer to Hobbes than Locke.

  Furthermore, Locke's proviso does its real work in conditions of subsistence scarcity. Taking the last acorn threatens survival. Space resources are, for now, industrial inputs or luxuries. The moral urgency of the proviso is diminished when the resource is not a means of life but a means of profit. The episode suggests that Lockean appropriation is politically viable only when the resources are perceived as non-essential to the survival of non-appropriators. If space water becomes necessary for life support, the Lockean justification will face greater resistance. The theory is silent on the threshold where luxury becomes necessity.

  One feature the episode reveals that appropriation theory handles poorly is the temporal gap between investment and extraction. Locke assumes immediate use; spoilage limits accumulation. Space mining requires decades of capital investment before any "labor" touches the resource. The 2015 Act grants rights based on the prospect of future extraction. Locke has no account for property rights based on speculative investment rather than actual labor mixing. This is a significant silence. The theory assumes labor precedes property; space law grants property to enable labor.

  Finally, the theory is silent on the distribution of the "entry bundle." Locke assumes the common is physically accessible. He does not anticipate a common that is physically open but economically closed. The episode shows that without a mechanism to distribute access capacity, the formal right to appropriate is meaningless for most agents. Locke's theory works for land because land is stationary and accessible. It fails for space because the resource is accessible only through a highly concentrated industrial base.

  Confidence Note

  I am highly confident in the mapping of the legal mechanisms (jurisdiction over persons vs. territory) and the identification of the "entry bundle" as the critical scarce resource. The legal facts provided support the view that this is jurisdictional extension rather than pure initial acquisition. I am moderately confident in the evaluation of the Moon Agreement's failure as a Hobbesian rather than Lockean dynamic; while it resembles the failure of the commons, the actors are states, not individuals, which changes the theoretical implication.

  The point in this analysis about which I am least certain is the moral weight of the "entry bundle" within a Lockean framework. I argue that the proviso should apply to access capacity, not just physical ore. However, Locke explicitly distinguishes between the common stock of nature and the artificial improvements of labor. Launch vehicles are artificial improvements. It is unclear whether Locke's theory can stretch to include the means of acquisition within the "common" that must be left for others. If the means of acquisition are private property (rockets), then the proviso might not apply to them, even if they are scarce. Resolving this requires deciding whether the "common" includes the tools needed to reach it, which is a contentious interpretive leap. I am less certain that Locke would accept this revision than I am that the revision is necessary for the theory to remain relevant.
