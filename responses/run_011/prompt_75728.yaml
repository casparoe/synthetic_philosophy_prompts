prompt: |-
  A colleague of mine who's gotten deep into longtermism keeps ending his talks with the line "we're living at the hinge of history." Last week he used it to argue that a local foundation should move 80% of its global-health budget into reducing extinction risk, and the only support he offered was that the expected causal influence of a dollar spent this century is orders of magnitude higher than in a normal century, on account of AI timelines. A historian in the audience objected that every generation since 1789 has thought they were at a hinge, and my colleague waved it off on the grounds that his claim was empirical, not rhetorical. Im not convinced either of them is being precise.

  Could you lay out the distinct claims that one sentence could be making — ordered from the ones that are near-platitudes to the ones that are actually bold — and for each say whether it's plausible and specifically whether it survives the every-generation-says-this objection? Please include at least one reading on which it isn't a claim about the calendar at all (something about the shape of the probability distribution over futures, or about our evidential situation, rather than about when we happen to be). Then tell me which reading the funding argument actually needs, whether he's entitled to it, and where you suspect he slides from one reading to another between the slogan and the conclusion. A list I could hand out in my ethics seminar would be ideal, and be blunt about which readings are just false.
