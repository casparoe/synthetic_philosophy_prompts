      *   Reading 4 & 5: Objection holds *unless* specific empirical evidence (like AGI) is brought in. But the colleague waved off the historian without giving that evidence in detail.

  6.  **Analyzing the Funding Argument:**
      *   To move 80% of global health to x-risk, you need *Reading 5 (Peak Influence)* combined with *Reading 4 (Lock-In)*.
