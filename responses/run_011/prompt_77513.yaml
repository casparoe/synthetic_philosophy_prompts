answer: |-
  **PAGE 1: STUDENT BRIEFING & RECORD OF DECISION**

  **COMMITTEE BRIEFING: SIERRA VERANO SALAMANDER (*Torrentotriton*)**
  **Status:** Statutory Listing Review | **Deadline:** 90 Days | **Stakes:** Highway Bypass Permit

  **THE POPULATIONS**
  1.  **North Ridge (NR) & Middle Valley (MV):** Contact zone (2km). F1 hybrids common; backcrosses rare. Hybrids rarer than parentals. Lab fertility: Hybrids 60%, Parentals 90%. mtDNA divergence: 2%.
  2.  **South Ridge (SR):** Isolated from MV by 40km dry valley. No contact. mtDNA nested inside MV (MV is paraphyletic). Microsatellites: Distinct cluster. Morphology: 3/22 fixed differences. Courtship: +1 step. *Calibration:* Sympatric sister species in neighboring genus average 4 fixed differences.
  3.  **Lowland (LW):** Isolated from MV by river gorge. mtDNA divergence: 7% (Deep). Morphology: Cryptic (0/22 fixed differences). Phenology: Breeds Autumn (others Spring). *Note:* One putative 1974 hybrid specimen exists; label lost.

  **LEGAL & LOGISTICAL CONSTRAINTS**
  *   **The Law:** You must produce a single signed list of "Species" eligible for protection.
  *   **The Highway:** Crosses LW's only breeding seeps. Permit issues automatically unless LW is listed within 90 days.
  *   **The Type Specimen:** The 1911 type came from MV. If SR is split as a new species, the petition must be refiled under a new name (Cost: ~2 years delay).
  *   **NGO Position:** A local NGO lobbies to **LUMP** all populations into one listed species. A single wide-ranging name is easier to defend legally; NR alone is too abundant to qualify for protection.
  *   **Your Task:** Decide whether to list *Torrentotriton* as **One Species** (NR+MV+SR+LW), **Two Species** (e.g., LW split), or **Three Species** (SR & LW split). You must sign below.

  ***

  **RECORD OF DECISION (TO BE COMPLETED BY CHAIR)**
  **Committee Vote:** [ ] One Species [ ] Two Species [ ] Three Species
  **Signed:** __________________________ (Chair)
  **Concurring Signatures:** ________________________________________________

  **BASIS OF DECISION (Check all that apply):**
  [ ] Reproductive Community [ ] Ecological Niche [ ] Phylogenetic Diagnosability
  [ ] Evolutionary Lineage [ ] Morphological Distinctness [ ] Historical Continuity
  [ ] Legal Defensibility [ ] Other: ___________________

  **MINORITY REPORT (Optional):**
  ____________________________________________________________________________
  ____________________________________________________________________________

  ***

  **INSTRUCTIONS FOR ALL MEMBERS**
  1.  Read your **Role Card** privately. Do not show it to others.
  2.  You have 110 minutes to reach a consensus or vote.
  3.  **Confidential Data:** Halfway through, the Chair will open a sealed envelope containing new genetic data.
  4.  **Goal:** Produce a signed list. Abstention is not permitted.

  ---
  *(Cut along line)*
  ---

  **PAGE 2: ROLE CARDS (CUT OUT AND DISTRIBUTE)**

  **ROLE 1: CHAIR**
  You manage the floor and break ties. You must sign the final list. If the committee deadlocks, you decide. Your priority is a defensible, signed document by the end of the session. You hold no specific scientific criterion but must ensure the "Basis of Decision" matches the arguments made.

  **ROLE 2: LEGAL COUNSEL**
  You do not care about biological truth. You care about **Judicial Review**. If the decision is challenged in court, will it hold?
  *   **Constraint:** A decision is vulnerable if it ignores fixed morphological differences or ignores deep genetic splits without explanation.
  *   **Goal:** Ensure the "Basis of Decision" checkboxes are filled consistently with the vote. Warn the committee if a choice invites a lawsuit (e.g., splitting SR creates a 2-year delay that NGOs might sue over).

  **ROLE 3: SKEPTIC (Metaphysics)**
  You believe "species" is a category mistake; lineages are **individuals** (Ghiselin/Hull). Names are rigid designators for spatiotemporal chunks of matter.
  *   **Constraint:** Do not abstain. Do not argue "nothing exists."
  *   **Task:** Vote for the grouping that best respects the **historical continuity** of the population as a single causal unit. Argue against splitting unless the *historical chain* is broken. If LW is the same historical individual as MV, lump them, regardless of mtDNA.
  *   **Trap:** Do not let others treat species as "kinds" or "classes." Correct them gently: "We are drawing boundaries on an organism, not sorting beads."

  **ROLE 4: SCIENTIST A (Regulation 4.1)**
  "Species are groups of actually or potentially interbreeding natural populations which are reproductively isolated from other such groups."
  *   **Focus:** Look at the NR/MV contact zone and hybrid fertility. If gene flow is significant, they are one unit. If LW cannot breed with MV (unknown), assume caution.
  *   **Blind Spot:** You are not told this is the "Biological Species Concept." Treat it as standard regulation.

  **ROLE 5: SCIENTIST B (Regulation 4.2)**
  "Species are the smallest diagnosable clusters of individual organisms within which there is a parental pattern of ancestry and descent."
  *   **Focus:** Look at SR. It has fixed microsatellite clusters and 3 fixed morphological characters. It is diagnosable.
  *   **Blind Spot:** You are not told this is the "Phylogenetic Species Concept." Treat it as standard regulation.

  **ROLE 6: SCIENTIST C (Regulation 4.3)**
  "Species are segments of population-level lineages evolving separately from one another."
  *   **Focus:** Look at LW. 7% mtDNA divergence suggests long separation. Phenology is fixed (common-garden). This is a separate evolutionary trajectory.
  *   **Blind Spot:** You are not told this is the "General Lineage Concept." Treat it as standard regulation.

  **ROLE 7: SCIENTIST D (Regulation 4.4)**
  "Species are groups of organisms that occupy a distinct adaptive zone."
  *   **Focus:** Look at LW (Autumn breeding) and SR (Dry valley isolation). Different niches imply different species. NR/MV share a niche.
  *   **Blind Spot:** You are not told this is the "Ecological Species Concept." Treat it as standard regulation.

  **ROLE 8: SCIENTIST E (Practical Taxonomist)**
  "Species must be identifiable by field biologists for enforcement to work."
  *   **Focus:** LW is morphologically cryptic (0 fixed differences). If rangers can't tell LW from MV in the field, listing LW separately is unenforceable. SR has 3 fixed differences; maybe enforceable.
  *   **Blind Spot:** You represent the "Morphological/Operational" constraint.

  ---
  *(Cut along line)*
  ---

  **PAGE 3: INSTRUCTOR GUIDE (TIMELINE & ENVELOPE)**

  **MINUTE-BY-MINUTE TIMELINE (110 MINS)**
  *   **00-10:** Distribute Briefing & Roles. Students read silently.
  *   **10-25:** **Round 1 Debate:** Initial positions. (Biology majors will likely dominate data interpretation).
  *   **25-30:** **Chair Intervention:** Call for a preliminary straw poll. (Likely deadlock).
  *   **30-35:** **THE ENVELOPE:** Chair opens sealed note (see below). Read aloud.
  *   **35-75:** **Round 2 Debate:** Re-evaluate positions based on new data. Counsel should raise legal risks. Skeptic should challenge "kind" talk.
  *   **75-90:** **Drafting:** Chair fills out Record of Decision. Members sign or dissent.
  *   **90-110:** **Debrief:** (See Page 4).

  **THE ENVELOPE CONTENT (Read Aloud)**
  "URGENT UPDATE: RADseq study (in press).
  1. LW Nuclear Genome: As close to MV as NR is to MV. The 7% mtDNA divergence is an ancient capture event, not evidence of long nuclear separation.
  2. LW Phenology: Autumn breeding remains fixed after two generations of common-garden rearing (genetic basis confirmed).
  3. SR Status: No new data."

  **DECISION RULE RECOMMENDATION**
  *   **Option A (Simple Majority):** Fast, but allows one concept (usually BSC) to tyrannize. *Not recommended for this seminar.*
  *   **Option B (Concordance Rule):** A listing is valid only if supported by **at least two** distinct criteria (e.g., Lineage + Ecology).
  *   **Instructor Choice:** **Use Option B.** It forces students to negotiate between incompatible criteria (Ereshefsky's pluralism) rather than voting on "truth." It makes the Counsel and Skeptic pivotal.
  *   **Why:** Under Option B, LW is hard to list (Nuclear = Lump, Phenology = Split). SR is easier (Diagnosable + Lineage). This creates the friction you want.

  **PREDICTABLE FAILURES & FIXES**
  1.  **Biology Majors Dominating:** They will treat the fake data as a puzzle to solve.
      *   *Fix:* Assign Biology Majors to **Counsel** and **Skeptic** roles. This forces them to argue procedure and metaphysics, not data. If they are Scientists, instruct them privately: "Your regulation forbids you from using raw sequence data, only the regulatory definitions."
  2.  **"It's All Just Convention":** Students retreat to relativism to avoid voting.
      *   *Fix:* The Chair (you, if needed) must refuse to accept "no decision." The highway permit issues automatically. Inaction is a vote for the highway.
  3.  **NGO "Corruption":** Students may dismiss the NGO's lumping strategy as dishonest.
      *   *Fix:* In debrief, frame this as **Strategic Essentialism**. The law requires discrete names; biology supplies continuous lineages. The NGO is bridging the gap to save the lineage. Is that corruption or necessary translation?

  **75-MINUTE CONDENSATION**
  *   Cut Round 2 Debate to 20 minutes.
  *   Skip the "Drafting" phase; Chair dictates the form based on vote.
  *   Shorten Debrief to 15 minutes (Focus only on Concept Reveal + Ghiselin).
  *   Do not use the Concordance Rule; use Majority Vote to save time explaining rules.

  ---
  *(Cut along line)*
  ---

  **PAGE 4: DEBRIEF SCRIPT & LIMITATIONS**

  **DEBRIEF QUESTIONS (IN ORDER)**
  1.  **The Vote:** "What did we list? Why?" (Get the empirical outcome on the board).
  2.  **The Criteria:** "Which regulations did you check on the form?" Reveal that Roles 4-8 were holding Mayr, Cracraft, de Queiroz, Van Valen, and Morphological concepts.
      *   *Ask:* "Did anyone realize mid-debate that you were arguing past each other?"
  3.  **The Envelope:** "How did the RADseq data change your vote?"
      *   *Target:* Scientist B (Phylogenetic) should feel undermined (mtDNA lied). Scientist C (Lineage) should feel supported (Nuclear = Lineage). Scientist D (Ecology) stands untouched (Phenology is real).
      *   *Point:* This asymmetry shows why pluralism (Ereshefsky) is necessary. No single dataset captures the "truth."
  4.  **The Skeptic:** "How did the Ghiselin/Hull card change your argument?"
      *   *Target:* Did they stop asking "Is it a species?" and start asking "Where does this individual begin and end?"
      *   *Integration:* If *Torrentotriton* is an individual, the committee isn't defining a kind; they are drawing a **birth/death certificate boundary**. The highway didn't kill a "species"; it killed a *part* of a spatiotemporal individual.
  5.  **The NGO:** "Was lumping corruption?"
      *   *Point:* Conservation law is a blunt instrument (names). Biology is a scalpel (lineages). The NGO used the blunt instrument to protect the scalpel's object.

  **WHAT THIS ACTIVITY CANNOT TEACH (HONEST PARAGRAPH)**
  This activity risks teaching that species are *whatever committees decide*. In reality, the lineage exists regardless of the vote. The committee does not create the species; it creates the *legal protection* for the lineage. You must explicitly state in the debrief: "The RADseq data was true regardless of our vote. Our vote only determined whether the law recognized that reality." If you do not make this distinction, you reinforce the misconception that social construction overrides biological reality, rather than mediating our *access* to it.

  **ASSIGNING THE SKEPTIC (CRITICAL)**
  To prevent the Skeptic from being annoying:
  *   **Instruction:** Tell the student: "Your job is not to say 'species don't exist.' Your job is to say 'We are naming a particular historical object, like a person.' If the history is continuous, the name stays, even if the properties change."
  *   **Goal:** They should vote to **LUMP** LW and MV (same nuclear history) despite the phenology, arguing that phenological change is just a property change in the same individual, like a human growing hair. This forces the class to confront the Individuality Thesis as a practical voting block, not just metaphysical noise.

  **FINAL TAKEAWAY FOR STUDENTS**
  "Today you did not solve the species problem. You experienced why the species problem *persists*. Different scientific goals (conservation, phylogeny, reproduction) require different cuts. The 'Species' is not a natural kind waiting to be found; it is a tool we sharpen for specific jobs."
