prompt: |-
  In my metaethics reading group we turned to moral particularism, and one member argued that an analogy with forces disposes of the holism of reasons. Reasons, he said, are like forces acting on a body: each has its own magnitude and direction, and what an agent ought to do is the resultant. That an act would break a promise always pulls one way and that it would ease someone's suffering always pulls the other, just as a book's weight pulls down whether or not the table is holding it up; all that varies from case to case is the resultant. It follows, he claimed, that moral principles can be stated as ceteris paribus generalizations and stay exceptionless in what they contribute, and that the particularist's talk of a reason flipping its polarity is simply a confusion about being outweighed — a balanced force does not cease to be a force.

  I find this persuasive and suspect it shouldn't be. Could you audit the analogy? I would like the correspondence set out explicitly — what plays the part of magnitude, of direction, of the resultant, of the other forces present, of the body acted upon — and then the disanalogies, sorted into those that genuinely threaten the use he is making of it and those that are merely incidental (reasons are not continuous and cannot be read off a dial, but I doubt that does any work here). Two things especially: what the source domain presupposes about how contributions combine that reasons may not share, and whether his central move — a defeated reason retains its polarity, so holism is false — can be made at all without leaning on the analogy. Close by saying whether the ceteris paribus principles survive the audit, and whether a better image is available to the generalist or whether the particularist has the better imagery.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**
      *   **Topic:** Metaethics, specifically Moral Particularism vs. Generalism (Principlism).
      *   **Core Argument:** A reading group member uses a "forces analogy" (vector addition) to argue against holism of reasons.
          *   *Claim:* Reasons have fixed magnitude and direction (polarity).
          *   *Claim:* Moral judgment is the resultant vector.
          *   *Claim:* Defeat/outweighing $\neq$ polarity flip. A defeated reason still pulls, just less strongly than the opposing force.
          *   *Claim:* Therefore, *ceteris paribus* principles hold (exceptionless in contribution, even if not in outcome).
      *   **Task:** Audit this analogy.
      *   **Specific Requirements:**
          1.  Set out the correspondence explicitly (Magnitude, Direction, Resultant, Other Forces, Body).
          2.  Identify disanalogies (Threatening vs. Incidental).
          3.  Analyze presuppositions about combination (additivity vs. non-linearity).
          4.  Evaluate the central move (defeated reason retains polarity) without the analogy.
          5.  Conclusion on *ceteris paribus* principles.
          6.  Suggest better imagery (Generalist vs. Particularist).

  2.  **Initial Assessment & Philosophical Context:**
      *   *Particularism (Dancy):* Reasons are holistic. A feature that is a reason in one case may be no reason or an opposite reason in another (polarity flip). Context determines the normative contribution.
      *   *Generalism (Principlism):* Reasons are atomistic/universal. A feature (e.g., lying) always counts against an act, even if overridden.
      *   *The Forces Analogy:* This is a classic move in generalist defense (often associated with Rossian prima facie duties, though Ross himself was careful). It treats reasons as vectors.
      *   *The Critique:* Dancy and others have attacked this. The main attack is that reasons don't *add* like vectors; they interact (enablers, intensifiers, attenuators).

  3.  **Drafting the Correspondence (Requirement 1):**
      *   *Source Domain:* Newtonian Mechanics (Forces on a body).
      *   *Target Domain:* Moral Deliberation.
      *   *Mapping:*
          *   Force = Individual Moral Reason (e.g., "It's a lie").
          *   Magnitude = Strength/Weight of the reason.
          *   Direction (Vector) = Polarity (For/Against).
          *   Resultant Force = All-things-considered Ought/Judgment.
          *   Other Forces = Competing Reasons.
          *   Body = The Agent/Action/Decision.

  4.  **Analyzing Disanalogies (Requirement 2):**
      *   *Incidental:* Discreteness (quantum vs. continuous), measurability (no moral protractor), temporality (forces are simultaneous, reasons might be sequential in deliberation).
      *   *Threatening:*
          *   *Independence:* Forces exist independently of other forces. Reasons often depend on other features to *be* reasons (enablers/disablers).
          *   *Additivity:* Forces sum linearly ($\vec{F}_{net} = \sum \vec{F}_i$). Reasons might interact non-linearly (synergy, cancellation).
          *   *Identity:* A force is the same force regardless of context. A feature's normative status might change identity based on context.

  5.  **Analyzing Combination Presuppositions (Requirement 3):**
      *   The analogy presupposes *Atomism* and *Additivity*.
      *   *Atomism:* Each reason has a contribution independent of the presence of others.
      *   *Additivity:* The total value is the sum of individual contributions.
      *   *Threat:* Holism argues for *Interactionism*. Example: Pleasure is good. But pleasure taken in another's suffering is bad. The "pleasure" reason didn't just get outweighed; its valence flipped because of the context (the suffering). In the force model, the "pleasure force" would still pull "good," just be overwhelmed by the "suffering force." But intuitively, sadistic pleasure isn't a *pro tanto* good that gets outweighed; it's part of the badness.

  6.  **Evaluating the Central Move without Analogy (Requirement 4):**
      *   *Claim:* "A defeated reason retains its polarity."
      *   *Without Analogy:* Can we assert this? It begs the question against the particularist. The particularist says, "In this context, that feature is *not* a reason." The generalist says, "It is a reason, just overridden."
      *   *Phenomenology:* Does it *feel* like a lingering pull? Sometimes (regret), but not always.
      *   *Explanation:* If we say lying is always *prima facie* wrong, how do we explain cases where lying seems to have *no* negative weight at all (e.g., lying to a murderer at the door)? The generalist says "overridden." The particularist says "no negative weight here." The force analogy *assumes* the generalist view; it doesn't prove it. It smuggles in the conclusion.

  7.  **Conclusion on *Ceteris Paribus* Principles (Requirement 5):**
      *   Do they survive? Only if you accept the atomistic/additive model. If holism is true (context shapes contribution), then *ceteris paribus* clauses become vacuous or infinitely complex ("Lying is wrong, unless it's to save a life, unless..., unless..."). At that point, the principle loses explanatory power. The force analogy hides this complexity by assuming fixed vectors.

  8.  **Better Imagery (Requirement 6):**
      *   *Generalist:* Weights on a scale? (Still additive). Building blocks?
      *   *Particularist:* Cooking/Flavors (salt is good in soup, bad in cake). Language/Grammar (a word's meaning depends on the sentence). Gestalt perception (duck/rabbit).
      *   *Verdict:* Particularist imagery often captures context-sensitivity better. Generalist imagery captures the idea of conflict better.

  9.  **Refining and Polishing:**
      *   *Tone:* Philosophical, rigorous, balanced but critical (since the user suspects the analogy *shouldn't* be persuasive).
      *   *Key Philosophers:* Mention Dancy (Particularism), Ross (Prima Facie), maybe McDowell or Hooker.
      *   *Structure:* Follow the user's prompt structure closely.

      *(Self-Correction during drafting)*: Make sure to distinguish between *holism of reasons* (contribution varies) and *holism of judgment* (outcome varies). The force analogy accepts holism of judgment (resultant varies) but denies holism of reasons (vectors are fixed). This is the crux.
      *   *Crucial Point:* The "enabler" problem. In physics, gravity acts on mass regardless of other forces. In ethics, a feature (e.g., "I promised") is only a reason if certain conditions hold (e.g., "The promise was voluntary"). If the promise was coerced, it's not just outweighed; it's null. The force analogy struggles with *disablers* (where magnitude becomes zero) vs. *outweighing* (where magnitude is constant but opposed).

  10. **Final Review against constraints:**
      *   Correspondence set out? Yes.
      *   Disanalogies sorted? Yes.
      *   Combination presuppositions? Yes.
      *   Central move without analogy? Yes.
      *   Ceteris paribus verdict? Yes.
      *   Better imagery? Yes.

      *Let's write.*
answer: |-
  This is a classic move in metaethics, often associated with W.D. Ross's *prima facie* duties, though your colleague has sharpened it into a vector model to defend generalism against Jonathan Dancy-style particularism. The intuition is seductive because physics feels objective in a way ethics does not. However, the analogy smuggles in the very conclusion it seeks to prove.

  Here is the audit of the forces analogy.

  ### 1. The Correspondence
  To evaluate the analogy, we must first fix the mapping between the source domain (Newtonian mechanics) and the target domain (moral deliberation).

  | Source Domain (Forces) | Target Domain (Reasons) |
  | :--- | :--- |
  | **The Body** | The Agent (or the Action under consideration). |
  | **Individual Force** | A single moral reason (e.g., "It breaks a promise"). |
  | **Magnitude** | The strength or weight of the reason. |
  | **Direction (Vector)** | The polarity of the reason (For/Against, Right/Wrong). |
  | **Other Forces** | Competing or cooperating reasons in the situation. |
  | **Resultant Force** | The all-things-considered moral obligation (the "Ought"). |
  | **Equilibrium** | Moral permission (no net force in either direction). |

  ### 2. Disanalogies: Incidental vs. Threatening

  **Incidental Disanalogies**
  These are differences that do not damage the structural logic of the argument.
  *   **Continuity vs. Discreteness:** Forces are continuous quantities; reasons may be discrete or granular. This does not affect the logic of vector addition.
  *   **Measurability:** We can measure Newtons with instruments; we have no "moral protractor." This is an epistemic limitation, not an ontological one. The generalist can concede we cannot *know* the magnitude without denying the magnitude *exists*.
  *   **Temporality:** Forces act simultaneously; deliberation is often sequential. This is a difference in process, not necessarily in the structure of the justification.

  **Threatening Disanalogies**
  These strike at the core of the claim that reasons function like fixed vectors.
  *   **Independence of Existence:** In physics, a force (like gravity) acts on a body regardless of what other forces are present. The table's normal force does not turn off gravity; it opposes it. In ethics, features often require *enablers* to function as reasons at all. If I promised under duress, the feature "I promised" does not generate a force that is merely outweighed; it generates *no* normative force. It is not a weak vector; it is a null vector. The force analogy struggles to distinguish between a reason being *outweighed* (opposed by a stronger force) and a reason being *disabled* (ceasing to be a force).
  *   **Linearity of Combination:** Forces sum linearly ($\vec{F}_{net} = \vec{F}_1 + \vec{F}_2$). Reasons often interact non-linearly. Two features together may produce a normative effect greater or less than the sum of their parts (synergy or attenuation). For example, "risking life" is bad. "Saving life" is good. "Risking life to save life" is not simply the sum of a negative and a positive vector; the context transforms the nature of the risk itself.
  *   **Context-Invariance of Direction:** A gravitational pull is always "down." The particularist argues that a feature like "pleasure" does not always pull "good." Sadistic pleasure is not a good thing that is outweighed by the badness of suffering; the pleasure *in that context* is part of the badness. The force analogy assumes polarity is intrinsic to the feature, whereas the particularist argues polarity is a function of the feature-in-context.

  ### 3. Presuppositions About Combination
  The analogy relies on two heavy metaphysical presuppositions about how moral contributions combine, which the particularist denies:

  1.  **Atomism:** It presupposes that a reason has a normative contribution *in isolation* from other features. It assumes we can speak of the "weight of promise-breaking" independently of *why* or *to whom* the promise was made.
  2.  **Additivity:** It presupposes that the total normative status of an act is the arithmetic sum of individual contributions.

  If reasons are holistic, they do not *add*; they *interact*. In chemistry, sodium is explosive and chlorine is toxic, but together they make table salt. You cannot understand salt by treating it as a "resultant" of explosive and toxic vectors. Similarly, if moral features function more like chemical ingredients than physical forces, the vector model fails. It assumes the "ingredients" retain their independent nature when mixed, which is precisely what holism denies.

  ### 4. The Central Move Without the Analogy
  Your colleague's central move is: *"A defeated reason retains its polarity, so holism is false."*
  Can this stand without the physics imagery?

  **No.** Without the analogy, this claim is question-begging.
  *   **The Generalist Assertion:** "Lying is always *prima facie* wrong, even to save a life."
  *   **The Particularist Counter:** "In the case of saving a life, the lie is not wrong *at all*, not even *prima facie*."

  To assert that the reason "retains its polarity" when defeated is to assert the generalist position as a premise. The force analogy provides a *picture* of this, but not an *argument* for it. It makes the generalist view look intuitive by associating it with the laws of motion, but it offers no evidence that moral reasons actually behave that way.

  Furthermore, the "lingering force" idea often relies on the phenomenology of **moral residue** (e.g., regret). The generalist argues: "If you feel regret after lying to save a life, the negative force must still be there."
  *   **Critique:** Regret can be explained without a lingering negative vector. One can regret the *necessity* of the situation without thinking the act itself retained a negative valence. Alternatively, one can acknowledge the *general* disvalue of lying without attributing a specific negative weight to *this* token act. The move from "I feel regret" to "There is an active negative moral force" is an inference that requires the very model the analogy is supposed to support.

  ### 5. Do *Ceteris Paribus* Principles Survive?
  The audit suggests **no**, or at least not in the robust way your colleague hopes.

  The force analogy is designed to save *ceteris paribus* principles by treating exceptions as mere "outweighing." However, if the threatening disanalogies hold (specifically regarding enablers/disablers and polarity flips), then *ceteris paribus* clauses become vacuous.
  *   If a reason can flip polarity (become a reason for instead of against), the principle "Lying is *ceteris paribus* wrong" is misleading. It suggests lying always contributes to wrongness, just sometimes loses the vote.
  *   If a reason can be disabled (magnitude zero), the principle implies a contribution exists where there is none.

  To save the principle, the generalist must add endless *ceteris paribus* clauses ("unless coerced," "unless to save life," "unless..."). Eventually, the principle becomes: "Lying is wrong, except in all the cases where it isn't." At that point, the principle loses its explanatory power. It describes the outcome but does not explain the contribution. The force analogy hides this complexity by pretending the vectors are simple and fixed, but the audit reveals the vectors are actually shape-shifters.

  ### 6. Better Imagery
  Is there a better image?

  **For the Generalist:**
  The **"Weights on a Scale"** image is the traditional rival, but it suffers the same additive problems. A better image might be **Legal Precedent**. In law, a rule stands unless distinguished. This captures the idea of a default status (polarity) that persists until a specific exception is codified. However, this still struggles with the "polarity flip" problem.

  **For the Particularist:**
  The **"Language/Grammar"** analogy is superior for capturing holism.
  *   *Image:* The meaning of a word depends on the sentence.
  *   *Application:* The word "not" negates a sentence. But in "It is not untrue," it reinforces. The letter 'q' is almost always followed by 'u', but not always (e.g., "Quran").
  *   *Why it works:* It captures **context-sensitivity**. A feature (word) has no fixed normative contribution (meaning) outside of the specific context (sentence). It explains why we can recognize reasons without needing fixed laws, just as we can understand sentences without memorizing all possible combinations of words.

  **Verdict:**
  The forces analogy is a powerful heuristic for the *experience* of conflict, but a poor ontology for the *structure* of reasons. It persuades because we want morality to be as law-like as physics. But your suspicion is correct: the analogy works only if you already assume reasons are atomistic and additive. Since that is the very point in dispute, the analogy cannot carry the argumentative weight your colleague assigns it. The particularist's linguistic or gestalt imagery better accommodates the messy reality that a feature's normative significance is often determined by the company it keeps.
