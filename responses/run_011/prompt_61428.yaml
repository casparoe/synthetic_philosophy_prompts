answer: |-
  **MEMORANDUM**

  **TO:** International Programs Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Proposal for Revised Conduct Clause: Local Customs and Conventions

  **Purpose**

  With the fall cohort departure imminent, we must finalize the language regarding student conduct and local customs. The current clause ("students must respect local customs and conventions") is too vague to be enforceable and too broad to be pedagogical. Following the incidents in the spring cohort, we need a standard that distinguishes between cultural learning opportunities and sanctionable misconduct.

  This memo outlines a proposed revision, a decision-making framework for the office, and responses to the key ethical tensions raised in our last discussion.

  **1. The Program Director's Position (Steelman)**

  Before proposing a middle path, it is vital we articulate the Director's argument in its strongest form, as it rests on legitimate pedagogical and institutional grounds.

  *The Argument:* Study abroad is not tourism; it is a privileged integration into a host community. When a student rejects local conventions, they are not merely expressing individuality; they are rejecting the terms of their welcome.
  1.  **Pedagogical Integrity:** The goal of immersion is to suspend one's own cultural framework to understand another. Refusing to adapt to arbitrary norms (like crossing streets or tipping) signals a refusal to engage in the learning process.
  2.  **Institutional Liability:** We are guests of foreign institutions and families. A student who insults a host family or disrupts public order burns social capital that the university relies on for future cohorts. We do not have the right to export our cultural friction to partners who have agreed to host us.
  3.  **Reciprocity of Obligation:** If we accept the benefits of local infrastructure and hospitality, we incur the obligations of that specific social contract, regardless of whether those obligations exist at home.

  This view holds that *convention creates obligation* within the context of the program. To treat local norms as optional is to treat the host community as a backdrop rather than a partner.

  **2. The Counter-Argument: Category Mistakes and Moral Autonomy**

  Conversely, we must recognize that not all conventions carry moral weight. Treating a social habit (queuing) as equivalent to a moral duty (honesty) creates a category mistake.
  1.  **Arbitrariness:** Conventions are descriptive (what people *do*), not normative (what people *ought* to do).
  2.  **Moral Agency:** Students retain their ethical autonomy. Blind conformity can be dangerous if local conventions conflict with university values or human rights.
  3.  **The "Police" Problem:** As seen in the spring jaywalking incident, empowering students to police minor conventional breaches among peers creates a toxic surveillance environment that undermines cohort cohesion.

  **3. Proposed Handbook Language**

  We need language that requires adaptation without demanding assimilation. I propose replacing the current clause with the following:

  > **Cultural Adaptation and Community Impact**
  > Students are expected to make a good-faith effort to understand and adhere to local laws, safety protocols, and specific program guidelines regarding cultural conduct. While students are not expected to abandon their personal values, they must recognize that their actions reflect on the university and impact host relationships.
  >
  > Conduct may be subject to review if it:
  > 1. Violates local law or endangers personal/public safety;
  > 2. Demonstrates a willful disregard for specific cultural norms explicitly outlined in pre-departure training; or
  > 3. Causes tangible harm to the university's partnership with host institutions or families.
  >
  > Unintentional breaches of etiquette resulting from honest cultural learning will be treated as educational opportunities, not conduct violations, provided the student engages in remediation.

  **4. The "Five-Minute Test" for Administration**

  To ensure consistency when incidents arise, staff should apply these four filters. If the answer to **A** is Yes, it is a conduct case. If **A** is No, proceed to **B, C, and D**.

  *   **A. Law & Safety:** Did the action violate local law or create a documented safety risk? (e.g., Jaywalking in a high-risk zone vs. a cultural norm).
      *   *If Yes:* Sanctionable.
  *   **B. Prior Explicit Instruction:** Was this specific norm covered in mandatory pre-departure orientation as a "critical expectation"? (e.g., "Do not tip in Country X").
      *   *If No:* Not sanctionable. (We cannot punish ignorance of untaught norms).
  *   **C. Harm & Intent:** Did the action cause tangible harm to a host relationship, and was it willful? (e.g., Insulting a host family after being warned vs. accidental tipping).
      *   *If Accidental:* Educational intervention only.
      *   *If Willful:* Sanctionable.
  *   **D. Peer Policing:** Is the report coming from a peer regarding a minor convention?
      *   *If Yes:* Flag the reporter for community standards. We do not sanction students for failing to police the social habits of their classmates.

  **5. Addressing Reciprocity (Inbound Students)**

  We face an apparent double standard: We want inbound students to tip and queue "our way," while debating how much outbound students must adapt "their way."

  *   **The Distinction:** We must frame this as **Economic Reality vs. Social Preference.**
      *   *Inbound to US:* Tipping is not merely custom; it is a wage subsidy. Refusing to tip here is economically harming the server. Queuing is a safety and fairness protocol. These are functional necessities of our system.
      *   *Outbound to Host:* In many cases, local conventions are social signals (e.g., tipping as insult).
  *   **The Policy:** We hold all students to the *functional necessities* of the host country. Inbound students must follow US labor norms (tipping) because it affects livelihoods. Outbound students must follow host labor norms (no tipping) because it affects dignity. We are not asking them to adopt the culture; we are asking them not to break the local social economy.

  **6. Unjust Conventions**

  What if the local convention is discriminatory or unethical (e.g., gender segregation, exclusionary practices)?

  *   **The Hierarchy of Values:** University values and human rights supersede local convention.
  *   **The Protocol:** If a student refuses to comply with a local norm on ethical grounds, they are not in violation of this clause *provided* they have consulted with program leadership to mitigate risk. We cannot mandate complicity in injustice under the guise of "cultural respect." However, we must advise students on the potential consequences of that refusal.

  **Next Steps**

  I recommend we adopt the revised language above. It protects the university's partnerships (addressing the Director's concern) without punishing students for the inevitable friction of cultural learning (addressing the Committee's concern).

  Please review this draft prior to our meeting on Thursday. I look forward to finding a consensus that serves our students and our partners.
