prompt: |-
  I'm on our university's international programs committee and we have to settle a handbook clause before the fall cohort leaves. Right now it says students must 'respect local customs and conventions,' which isn't doing any work at all. Two things happened in the spring: a student in a country where tipping isn't practiced left money on the table after dinner with her host family, who took it as an insult to their hospitality; and a student in a city where everyone crosses against the light at a big junction just stood there, held up the crowd behind him, and then reported his own classmates to our office for jaywalking.

  The program director wants nonconformity with purely local conventions — tipping, queing, how you cross the street — written up as a sanctionable conduct violation. Two of us think that's a category mistake, since a convention doesn't become an obligation just because everyone around you follows it; one of us thinks the opposite, that if you take the benefits of living somewhere you owe its residents its ways.

  Draft the memo I'll circulate before the meeting: what the clause should actually say, a test the office can apply to a case like these two in five minutes, what we do about the fact that we also host inbound exchange students and would very much like them to tip and queue our way, and what happens when the local convention is itself something we think is unjust. Give the director's view its strongest form — I'd rather he recognized himself in it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the university's international programs committee.
      *   **Task:** Draft a memo to circulate before a meeting regarding a handbook clause on "respecting local customs and conventions."
      *   **Context:** Current clause is too vague ("respect local customs"). Two specific incidents occurred (tipping insult, jaywalking conflict).
      *   **Conflict:** Program Director wants *all* nonconformity with local conventions to be sanctionable. Two committee members (including the user, presumably) think this is a category mistake (conventions $\neq$ obligations). One member agrees with the Director (reciprocity/obligation).
      *   **Requirements:**
          1.  Propose specific wording for the clause.
          2.  Create a 5-minute test for the office to apply to cases.
          3.  Address the reciprocity issue (inbound students should tip/queue "our way").
          4.  Address unjust local conventions.
          5.  Steelman the Director's view (make it strong and recognizable).
      *   **Tone:** Professional, diplomatic, analytical, actionable, academic/administrative.

  2.  **Deconstruct the Problems:**
      *   *The Tipping Incident:* Cultural misunderstanding, unintentional insult, low stakes but high emotional impact on hosts.
      *   *The Jaywalking Incident:* Safety issue, social friction, student weaponized rules against peers (toxic behavior).
      *   *The Director's View:* "When in Rome, do as the Romans do." Immersion requires assimilation. Disruption reflects poorly on the university.
      *   *The Dissenting View:* Moral autonomy. Conventions are descriptive, not normative. Some conventions are arbitrary or unjust.
      *   *Reciprocity:* We want inbound students to adapt to *our* norms (tipping, queuing). This implies a double standard if we force outbound students to adapt to *all* local norms.
      *   *Unjust Norms:* What if the local custom is discriminatory, dangerous, or illegal back home?

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the urgency (fall cohort) and the purpose (clarifying the handbook).
      *   **Steelmanning the Director:** I need to articulate the "Cultural Immersion & Institutional Reputation" argument strongly. It's not just about rules; it's about the pedagogical goal of study abroad and the risk to partnerships.
      *   **The Core Distinction (Category Mistake):** Differentiate between *etiquette* (social grease), *law/safety* (hard rules), and *ethics* (moral obligations). The current draft conflates them.
      *   **Proposed Clause:** Needs to be nuanced. Not "follow everything," not "ignore everything." Focus on *harm*, *intent*, and *partnership*.
      *   **The 5-Minute Test:** A flowchart or set of questions for administrators.
          1.  Is it law/safety?
          2.  Is it a specific program requirement?
          3.  Did it cause tangible harm to the partnership/host?
          4.  Was it malicious or ignorant?
      *   **Reciprocity (Inbound Students):** Acknowledge the asymmetry. We can't demand outbound students follow *all* local norms if we don't demand inbound students follow *all* ours. Frame it as "Host Responsibility" vs. "Guest Responsibility."
      *   **Unjust Conventions:** Need an escape hatch. Human rights/university values trump local custom.
      *   **Conclusion:** Call to action for the meeting.

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is the Director's view strong enough?
      *   *Fix:* Make sure to emphasize that study abroad isn't tourism; it's a privileged access to a community. Violating norms burns bridges for future students.
      *   *Critique:* Is the clause too wordy?
      *   *Fix:* Keep the handbook language tight, put the explanation in the memo.
      *   *Critique:* How to handle the jaywalking student?
      *   *Fix:* The test should flag "reporting peers for minor conventions" as potentially sanctionable behavior itself (community harm).
      *   *Critique:* Reciprocity is tricky.
      *   *Fix:* Frame it as "Contextual Expectations." Inbound students are briefed on *critical* local norms (tipping here is wages), outbound students are briefed on *critical* host norms (tipping there is insult).

  5.  **Final Polish:**
      *   Ensure the tone is collaborative, not adversarial.
      *   Check that all constraints of the prompt are met.
      *   Make sure the "5-minute test" is actually usable.

  6.  **Final Review against Prompt:**
      *   Draft memo? Yes.
      *   What clause should say? Yes.
      *   5-minute test? Yes.
      *   Inbound student reciprocity? Yes.
      *   Unjust conventions? Yes.
      *   Director's view strongest form? Yes.

  *(Self-Correction on the Director's View)*: I need to make sure I don't mock the Director's view while strengthening it. It needs to sound like a principled stance on cultural relativism and institutional liability.

  *(Self-Correction on the Clause)*: The prompt asks "what the clause should actually say." I should provide the specific text.

  *(Self-Correction on Reciprocity)*: The prompt says "we would very much like them to tip and queue our way." I need to address why we can demand that of them but maybe not the reverse of our students. The key is *economic reality* (tipping is wages here) vs *social preference* (tipping is insult there).

