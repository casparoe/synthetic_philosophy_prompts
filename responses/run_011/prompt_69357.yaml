answer: |-
  The queue for hot lunch snaked around the corner of the hall, smelling of burnt grease and damp coats. Leo tapped his tray against his leg, staring at the back of the person in front.

  "We're going in circles," Leo said. "Three weeks. If 'admirable' just means 'there are reasons to admire', then the demon case kills it. I have a reason to admire the demon if he'll kill me otherwise. But the demon isn't admirable. So value can't be defined by reasons."

  Sam shifted their weight, looking out at the rain hitting the playground. "You're assuming the demon's threat gives you a reason *to admire* him. It doesn't. It gives you a reason to *want* to admire him. There's a difference. Reasons for the attitude have to bear on the object. Is he good? Is he skilled? The threat bears on the state of being in danger. It's pragmatic, not fitting."

  "But that distinction feels like a trick," Leo said. "It feels like you're just defining the problem away. Say I admire something because it makes me happy. You'd say that's state-given. But what if the admiration itself changes the object?"

  "Like how?"

  "Like Nadia." Leo lowered his voice. "She's awful. We know she cheats. She's snide. By your lights, there are zero object-given reasons to admire her. But those few kids who actually look up to her? It's keeping her at school. She's less awful than last year. The admiration is working."

  Sam frowned. "Okay. So you have reasons to want her to be better. So you have reasons to bring it about that you admire her. That's still state-given. You're admiring the potential, or the outcome. Not the current Nadia."

  "But the feeling isn't directed at the outcome. It's directed at *her*. And if the admiration is the mechanism that makes her worthy, doesn't that make the reason a reason *for* the attitude? If I admire her, and that admiration constructs the value, then the reason wasn't wrong. It was just... early."

  Sam turned to face Leo properly. "Now you're saying value is made by the attitude. That's a huge shift. If value is constructed, then sure, your reasons work. But if value is found—if 'admirable' means something independent of what we do—then you're just wishing it into existence. You can't make a lie true by believing it."

  "What if it's not a lie? What if it's a promise?" Leo argued. "If I admire her, I'm treating her as capable of better. If she responds, she becomes admirable. So the reason to admire her was based on a future fact that only happens because of the reason. Does the reason turn into a right kind of reason halfway through? Was the attitude unfitting at 9 AM and fitting by 3 PM?"

  "That's the bit that sticks," Sam admitted, picking at a loose thread on their sleeve. "If the attitude changes the object, the object-given reasons change. But that doesn't mean the initial reason was object-given. It means you acted on state-given reasons to create object-given ones. You treated her *as if* she were admirable to make her so. That's instrumental."

  "But does the person feeling it experience it as instrumental?" Leo pressed. "If they genuinely feel she's great, and she isn't, yet that feeling is the only thing that saves her... isn't there a reason to have that genuine feeling? If there's a reason to have it, and it's not about the object's current properties, then your split collapses. You can't say 'it's not a reason for the attitude' when the attitude is the only thing that bridges the gap."

  Sam was quiet for a moment as the queue shuffled forward. "Okay. Hit me. If I say it's still state-given, I'm saying the moral value of saving Nadia outweighs the conceptual error of admiring someone unworthy. I'm saying truth matters less than outcome."

  "I'm saying 'truth' about value might depend on the outcome," Leo said. "If you insist the admiration was unfitting initially, you're saying they were wrong to feel it. But if they hadn't felt it, she'd be worse. So being 'wrong' was the right thing to do. That breaks the link between fittingness and correctness."

  "Or," Sam countered, "it just shows 'correctness' has two lanes. You can be rationally correct about the facts—she's currently awful—and practically correct to admire her anyway. Your problem assumes there's only one kind of correctness. Maybe the demon case and the Nadia case are the same: reasons to manage your mind, not reasons describing the world."

  "But then 'admirable' loses its grip," Leo said. "If I can be correct to admire a tyrant because it stops a war, then 'admirable' doesn't mean 'good'. It means 'useful to admire'. That's not what the word means."

  "Maybe not," Sam said. "But maybe your view makes morality too rigid. If value is fixed, you can't help Nadia without lying. If value is flexible, you can help her, but you risk calling bad things good. You want stability. I'm saying we need utility."

  "I want accuracy," Leo said. "If we call bad things good, we lose the ability to criticise them later."

  "And if we don't," Sam said, "we lose the ability to fix them now."

  They reached the counter. The server slammed a ladle of grey stew onto Leo's tray. They stepped aside to the salt and vinegar station.

  "Look," Leo said, wiping condensation off the table. "I think the crux is whether value is something we find or something we make. If we make it, your distinction holds but doesn't matter. If we find it, my problem stands."

  Sam nodded slowly. "And I think the crux is whether we can separate the attitude from the consequence without lying to ourselves. I don't know if we can settle it. It depends on whether you think the universe cares about our definitions."

  "Probably not," Leo said.

  "Probably not," Sam agreed. "But we still have to decide what to tell the club on Tuesday."
