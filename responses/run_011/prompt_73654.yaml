answer: |-
  Dear friend,

  It was good to hear from you about the reading group, and I must say the shift from Hardin to the Tampa affair feels less like a tangent and more like a collision course that was always waiting to happen. You know how Hardin's essay tends to sit in the mind like a splinter, irritating precisely because the logic is so clean even when the morality curdles, and I have been turning your request over for the last few days, trying to run the Tampa facts through his theoretical machinery without smoothing off the rough edges. You asked for an analysis rather than a summary, so I will take it as read that we both know the contours of the lifeboat metaphor: the rejection of the spaceship earth ideal, the insistence on carrying capacity, the safety factor, and the warning against admitting the neediest first. What I want to do here is treat Hardin's lifeboat as a parameterised model, fill in the slots with the Tampa data, and see where the gears grind.

  Let us start by populating the slots of the model to see if the shape holds. In Hardin's formulation, the lifeboat is a nation-state with limited resources, the swimmers are the poor of the world, and the safety factor is the reserve capacity kept for emergencies to ensure the survival of those already aboard. In the Tampa case, the physical lifeboat was the MV Tampa itself, carrying a crew of twenty-seven and suddenly burdened with 433 rescuees, mostly Hazara Afghans. If we treat the ship as the lifeboat, the capacity was physically exceeded—Hardin would say the safety factor was obliterated the moment Rinnan took them on board—yet the ship did not sink. The real lifeboat, of course, was Australia, with a population of nineteen million and a humanitarian programme of around ten thousand places. Here the safety factor was not physical buoyancy but political cohesion; the government argued that allowing disembarkation would compromise border security, which functioned as their surrogate for carrying capacity. The slot regarding prior obligation is where the first friction appears. Hardin argues the occupants owe the swimmers nothing, whereas maritime law imposes a duty on the captain to deliver people to a place of safety. Rinnan honoured the maritime duty; Canberra honoured the Hardin duty. Then there is the question of the other boat. Hardin assumes the swimmers are in the water with no other option, but here there was Indonesia, the nearest port state, which refused them. This complicates the binary of boat versus water; there were multiple boats, and the conflict was about which one bore the cost. Finally, does the person who says no bear the cost? In Hardin's model, the cost is borne by the swimmers who drown. In Tampa, the cost was borne by the rescuees in detention, but also by the Australian polity in terms of international reputation, though politically the government calculated the cost of saying yes was higher. When you fill these slots, you see the model strains immediately because the Tampa was a neutral vessel caught between sovereign states, whereas Hardin's lifeboat is a sovereign entity itself. The theory assumes the boat owns the water around it, but here the water was international, and the ownership of the decision was disputed.

  This leads me to the distinction you have been mulling regarding the ratchet effect. Hardin's ratchet is specific: aid replenishes demand because saving lives now leads to more population growth and more need later, a biological and economic feedback loop. What Australia did in 2001 looks like the mirror image. They were not worried that saving these 433 people would cause them to breed more asylum seekers; they were worried that accepting them would signal to the people smugglers and the swimmers that the boat was open, thereby increasing the number of claimants. This treats capacity not as a container but as a transmitter. By refusing, they aimed to lower the water level rather than just protect the boat. Is this still lifeboat ethics? I think it is lifeboat ethics wearing a different coat. Hardin is concerned with the sustainability of the boat's resources; the Pacific Solution was concerned with the sustainability of the boat's boundaries. However, there is a divergence. Hardin's argument is static regarding the swimmers' behaviour—they are drowning regardless. The Australian policy was dynamic; it sought to alter the behaviour of the swimmers through deterrent refusal. If Hardin's theory is about managing scarcity, the Australian move was about manufacturing scarcity to manage demand. It fits the cold logic of the lifeboat—preserve the occupants at all costs—but it inverts the mechanism from withholding aid to actively signalling danger.

  We must then look at the timing of the decision, which I suspect is where the theory falls most silent. Hardin's decision is about admission at the gunwale. Do we pull them in? The Tampa's hard decision was about disembarkation after the rescue had already happened. The capacity had already been blown through in one irreversible go when Rinnan answered the distress call. Hardin's theory has very little to say about the post-rescue stage because his actual target was food aid to poor countries, not refugees already clinging to the hull. In the food aid scenario, you can choose not to send the grain. In the Tampa scenario, the grain was already on board, wet and shivering. The theory struggles here because it cannot account for the moral shift that occurs once the rescue is effected. Hardin would likely argue that taking them on board was the initial error, the violation of the safety factor, and that disembarkation should be wherever possible to restore the boat's integrity. But this ignores the legal and moral reality that once you rescue, you assume responsibility. The theory treats the water as a state of nature where drowning is neutral, but once the swimmer is on the deck, they are within the moral community of the boat. Hardin's model cannot process this transition; it only knows in or out, not in-and-now-what.

  This brings us to the question of who was at the helm. Hardin's complaint about the commons is that nobody is at the helm, which leads to ruin, so the lifeboat requires strict control by the occupants. But on the Tampa, you had a lifeboat with four candidate captains and no clear owner of the decision. You had Captain Rinnan, under a maritime duty to deliver people to safety; you had the Australian coastal state, which had coordinated the distress call but refused entry; you had Indonesia, the nearest-port state, which claimed no duty; and you had the UNHCR, which had a mandate but no ships. Hardin's model assumes a sovereign owner of the lifeboat who can make the hard choice to row away. Here, sovereignty was fragmented. Rinnan tried to steer for Christmas Island; Canberra boarded the ship to seize the helm; the courts briefly suggested the detention was unlawful before the government appealed and won. The model does not survive a lifeboat where the helm is contested because the theory relies on the unity of the occupants against the water. When the occupants are divided—crew versus state versus international law—the lifeboat ethics collapse into a dispute over jurisdiction. Hardin assumes the boat is a monolith; the Tampa showed it was a site of conflict.

  Furthermore, we have to address the agency of the swimmers. In Hardin's metaphor, the swimmers are passive, drowning bodies begging for admission. The 433 on the Tampa negotiated, threatened, and had preferences about where they went; they went to the bridge and pressed to be taken to Christmas Island. They were not merely biological demand; they were political agents. What does the theory do with that? It has no category for it. Hardin's swimmers are a resource drain; Tampa's rescuees were actors who altered the course of the ship literally and figuratively. And where does SIEV X sit in this? That boat sank south of Java with 353 dead after the Tampa affair, amidst the tightening of border protection. In Hardin's model, the deaths of those kept out are the natural cost of preserving the boat; they are not a line item in the boat's ledger. But SIEV X was not a natural drowning; it was a death toll among the deterred, a direct consequence of the policy signal sent by the Tampa refusal. If the theory ignores the deaths caused by the refusal itself, counting only the safety of the occupants, it is morally incomplete regarding the cost of saying no. Hardin accepts drowning as fate; the Pacific Solution produced drowning as policy outcome.

  So, turning it round, does the episode confirm lifeboat ethics, expose an anomaly, or show it was never meant for this? I am inclined to say it shows the theory was never really about cases like this. Hardin was arguing against foreign aid and population growth, not maritime rescue and refugee law. The excision of territory from the migration zone—removing Christmas Island from the legal map so that arriving there was not arriving in Australia—counts, on Hardin's own terms, as a redrawing of the lifeboat's outline so that the swimmers are simply not in the water you are responsible for. It is a triumph of realism only if you accept that the boat's boundaries are mutable to exclude the neediest. It is a trick if you believe the water is shared. I think it is the latter. The theory fits only if you accept the premise that the boat can legally redefine the ocean.

  I must end by asking what would change my verdict here. If it could be shown that Australia was genuinely at breaking point—that admitting 433 people would have materially collapsed the humanitarian programme or caused civil unrest comparable to the sinking of the boat—then Hardin's safety factor argument would hold more water. But the scale you provided suggests otherwise: arrivals were a few thousand against a population of nineteen million. The scarcity was political, not physical. That is where my reasoning might be failing, though. I need to ask myself if I am just doing motivated reasoning against Hardin because he is politically repellent. It is easy to reject the lifeboat because we dislike the cruelty, but if the premise is that unlimited admission leads to system collapse, then the excision was a logical move to prevent collapse. My bias is to assume the system could have absorbed them; Hardin's bias is to assume it cannot. The evidence that would change my mind would be proof that the Pacific Solution actually saved lives by stopping the boats, rather than just displacing the deaths to places like SIEV X. If the deterrent worked without the body count, Hardin's logic of preserving the boat gains strength. But since the body count merely moved offshore, the lifeboat ethics look less like preservation and more like hiding the drowning from view.

  I hope this helps with the session. It is a grim topic to chew over in a kitchen while the wine runs out, but I suspect that is why you chose it. Let me know how the group reacts, particularly the friend who lived through that spring in Melbourne; I imagine they have little patience for the theoretical mapping when the memory is so visceral.

  Warmly,

  Yours
