answer: |-
  ### Brainstorming: How the Camps Talk Past Each Other

  Before drafting the statement, it is crucial to identify the structural reasons this debate has persisted for forty years.

  1.  **The Normative Anchor:** Camp A (Heuristics-and-Biases) anchors rationality in *coherence* (internal consistency with logic and probability theory). Camp B (Ecological Rationality) anchors rationality in *correspondence* (successful adaptation to the external environment). When Camp A says "irrational," they mean "logically inconsistent." When Camp B says "rational," they mean "ecologically successful." They are often grading the same performance on two different rubrics.
  2.  **The Definition of "Heuristic":** For Camp A, a heuristic is often defined retrospectively as the *cause* of a bias (a shortcut that fails). For Camp B, a heuristic is defined prospectively as an *adaptive tool* (a shortcut that works given specific environmental structures).
  3.  **Simon's Scissors:** Both claim Herbert Simon. Camp A focuses on the "blade" of cognitive limitation (we can't compute Bayes' rule). Camp B focuses on the "blade" of environmental structure (the world makes computation unnecessary). Simon's actual view was that you cannot evaluate the mind without the environment, but the debate often isolates one blade.
  4.  **The Goal of Inquiry:** Camp A generally aims to *fix the mind* (debiasing, education). Camp B generally aims to *fix the environment* (choice architecture, matching tools to tasks).

  ***

  # JOINT STATEMENT ON BOUNDED RATIONALITY AND HEURISTIC FUNCTION
  **An Adversarial Collaboration between the Heuristics-and-Biases Program and the Ecological Rationality Program**

  **To:** The Student Researcher
  **From:** The Collaborative Working Group on Judgment and Decision-Making
  **Subject:** Clarifying the Dispute Regarding Herbert Simon's Legacy and Human Rationality

  We, the undersigned representatives of the Heuristics-and-Biases (H&B) tradition and the Ecological Rationality (ER) tradition, submit this joint statement to clarify points of agreement, isolate genuine disagreements, and propose empirical tests to resolve them. We acknowledge that much of our historical debate stems from differing emphases rather than contradictory facts.

  ### I. Points of Agreement

  Both camps endorse the following claims as accurate descriptions of the current scientific landscape and Herbert Simon's original contributions:

  1.  **Simon's Scissors Metaphor:** We agree that Herbert Simon's concept of "bounded rationality" posits that human rationality cannot be understood by studying the mind alone. It is shaped by the intersection of (a) the computational limitations of the actor and (b) the structure of the environment in which the actor operates.
  2.  **Satisficing is Not Random:** We agree that Simon's concept of "satisficing" (seeking a solution that meets a threshold of acceptability rather than maximizing utility) is a deliberate strategy for managing computational costs, not merely a failure of effort.
  3.  **Existence of Laboratory Biases:** We agree that in controlled laboratory settings using single-event probability formats, human subjects systematically violate norms of probability theory (e.g., the conjunction fallacy, base-rate neglect).
  4.  **Ecological Sensitivity:** We agree that human judgment performance improves significantly when problem structures match the statistical regularities of natural environments (e.g., when information is presented in frequency formats rather than single-event probabilities).
  5.  **Heuristics are Double-Edged:** We agree that the same cognitive mechanisms (e.g., representativeness, availability) that produce high accuracy in natural environments can produce systematic errors in artificial environments.
  6.  **Normative Ambiguity:** We agree that there is no consensus on whether probability theory is the appropriate normative standard for a cognitive system evolved for survival in a specific ecological niche, rather than for solving abstract logic puzzles.

  ### II. Residual Disagreements

  The following table outlines the remaining substantive disagreements. The wording has been negotiated to ensure neither side feels misrepresented.

  | Domain of Disagreement | Heuristics-and-Biases (Camp A) Position | Ecological Rationality (Camp B) Position |
  | :--- | :--- | :--- |
  | **1. Interpretation of Error** | Systematic violations of probability theory in the lab reveal fundamental cognitive limitations that persist even in real-world high-stakes scenarios. | Systematic violations in the lab reveal a mismatch between the experimental format and the cognitive architecture; they do not necessarily predict failure in natural settings. |
  | **2. Primary Locus of Intervention** | To improve decision-making, we should educate individuals to recognize biases and apply normative rules (fix the mind). | To improve decision-making, we should design environments and information systems that align with natural heuristics (fix the environment). |
  | **3. Generality of Heuristics** | Heuristics are general-purpose shortcuts that are applied broadly, often indiscriminately, leading to predictable biases across contexts. | Heuristics are specific adaptive tools selected from a "toolbox" based on their fit with specific environmental structures. |
  | **4. Status of Probability Theory** | Probability theory provides the correct normative standard for rational belief, regardless of cognitive cost. | Probability theory is only one standard of rationality; ecological success (survival, resource acquisition) is the ultimate standard. |

  ### III. Cruxes and Proposed Resolutions

  We identify two "cruxes"—specific questions where empirical evidence could shift the consensus.

  **Crux 1: The Depth of Format Effects**
  *   **Question:** Does presenting problems in frequency formats trigger a deeper understanding of logical set relations, or does it merely provide a surface cue that bypasses the need for reasoning?
  *   **Proposed Argument/Experiment:** Analyze error patterns in frequency formats. If subjects make *different* kinds of errors in frequency formats that still violate logic, it suggests shallow cue usage. If errors vanish completely, it suggests cognitive alignment.
  *   **Camp A Prediction:** Errors will persist in subtle forms (e.g., weighting errors) even in frequency formats because the underlying cognitive machinery is flawed.
  *   **Camp B Prediction:** Errors will vanish because the frequency format unlocks the correct mental model of nested sets.

  **Crux 2: Transfer of Training**
  *   **Question:** Can training in normative rules transfer to natural settings, or does training in natural formats transfer to abstract problems?
  *   **Proposed Experiment:** (See Section IV below).

  ### IV. Case Study: The Conjunction Fallacy and Transfer Training

  We apply the above framework to the specific case of the Conjunction Fallacy (e.g., the "Linda Problem"), where a subject judges "Linda is a bank teller and a feminist" as more probable than "Linda is a bank teller."

  **The Phenomenon:**
  *   **Condition 1 (Single-Event Probability):** "What is the probability that Linda is...?" -> High rate of conjunction fallacy.
  *   **Condition 2 (Frequency Format):** "Out of 100 people like Linda, how many are...?" -> Significant reduction or elimination of the fallacy.

  **The Proposed Transfer Study:**
  We propose a new experiment to test the malleability of rationality.
  *   **Group F (Frequency Trained):** Participants solve 20 conjunction problems in frequency format with feedback.
  *   **Group P (Probability Trained):** Participants solve 20 conjunction problems in single-event probability format with feedback (teaching the rule $P(A \& B) \leq P(A)$).
  *   **Test Phase:** Both groups are tested on **novel** problems in the format they were *not* trained on.
      *   Group F is tested on Single-Event Probability.
      *   Group P is tested on Frequency Format.

  **Pre-Registered Predictions:**

  | Camp | Prediction regarding Group F (Freq -> Prob Transfer) | Prediction regarding Group P (Prob -> Freq Transfer) |
  | :--- | :--- | :--- |
  | **Heuristics-and-Biases (A)** | **Low Transfer.** Training on frequencies relies on external cues. When those cues are removed (in the probability test), subjects will revert to intuitive heuristics and commit the fallacy. | **High Transfer.** Training on probability teaches the abstract normative rule. Subjects will apply this rule regardless of the presentation format. |
  | **Ecological Rationality (B)** | **High Transfer.** Training on frequencies aligns with the brain's natural coding of information. This "activates" the correct mental model, which persists even when the format changes. | **Low Transfer.** Training on probability is fragile and context-bound to the classroom setting. Without the ecological cue (frequency), the abstract rule will not be triggered in novel tasks. |

  **Commitment to Revising Views:**
  *   **Camp A Commitment:** If Group F shows significantly higher accuracy on the Probability test than Group P does on the Frequency test, Camp A acknowledges that environmental formatting is a more powerful lever for rationality than normative education.
  *   **Camp B Commitment:** If Group P shows robust transfer to the Frequency test (outperforming Group F on the Probability test), Camp B acknowledges that normative rules can be internalized effectively and that cognitive limitations are more malleable than previously thought.

  ### V. Analysis of Verbal vs. Substantive Disagreement

  After extensive dialogue, we conclude that a portion of our dispute is **verbal**, while a core **substantive** disagreement remains.

  **1. The Verbal Dispute: The Definition of "Rational"**
  *   **Issue:** We often argue over whether a subject in the Linda experiment is "irrational."
  *   **Resolution:** We agree this is semantic.
      *   If "rational" means *internally coherent with probability calculus*, the subject is irrational in the probability format.
      *   If "rational" means *adaptively successful in a natural ecology*, the subject may be rational (as frequency formats are more common in evolution).
  *   **Action:** We will henceforth distinguish between **Coherence Rationality** (Camp A's focus) and **Correspondence Rationality** (Camp B's focus) to avoid confusion.

  **2. The Substantive Dispute: Prescriptive Implications**
  *   **Issue:** Even if we agree on the definitions above, we disagree on where to invest resources to improve human welfare.
  *   **Surviving Disagreement:**
      *   Camp A maintains that Coherence Rationality is necessary for modern institutions (law, medicine, finance) which operate on abstract probabilities, not natural frequencies. Therefore, we must train humans to act against their ecological instincts.
      *   Camp B maintains that attempting to train humans to act as intuitive Bayesians is inefficient and prone to failure. We should instead redesign institutions (e.g., medical risk communication) to present information in frequency formats that match ecological instincts.
  *   **Why this matters:** This is not just words. It determines whether a policy maker spends budget on **training doctors to understand statistics** (Camp A) or **changing how medical statistics are displayed to doctors** (Camp B).

  **Signed,**

  *Representative, Heuristics-and-Biases Program*
  *Representative, Ecological Rationality Program*
