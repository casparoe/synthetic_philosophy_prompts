answer: |-
  # Specification for a Practical Theory of Standing to Blame

  ## I. Core Requirements and Success Criteria

  To count as adequate for the stated practical purpose, an account of standing must satisfy the following constraints. Each is tagged as **Non-Negotiable (NN)** (required for the theory to function as a guide for agents/institutions) or **Camp Preference (CP)** (where reasonable disagreement exists, but the theory must explicitly choose a side).

  ### A. Phenomena to Explain
  1.  **The *Tu Quoque* Intuition (NN):** The theory must explain why condemnation from a hypocrite feels defective in a way that identical condemnation from a non-hypocrite does not, without implying that the target's wrongdoing is excused or rendered less wrong.
  2.  **The Legitimacy of the Rebuke (NN):** The theory must account for why "Who are *you* to say?" is a valid move in practical deliberation and social interaction, despite being a logical fallacy (ad hominem) in truth-seeking argument. The theory must distinguish the context of *establishing truth* from the context of *enforcing norms*.
  3.  **The Reformed Offender Exception (NN):** The theory must explain how and why agents who previously committed the very wrong they condemn (penitents, reformed offenders) can regain standing. It cannot treat moral stains as permanently indelible if the agent has genuinely reformed.
  4.  **The Transparency Effect (NN):** The theory must account for the "Open Hypocrite" (e.g., the smoker who admits smoking). It must explain why acknowledging one's own failure sometimes preserves or even enhances credibility, rather than automatically defeating standing.

  ### B. Cases to Get Right
  5.  **The Closet Complier (NN):** The theory must deny standing to the agent who behaviorally complies but privately exempts herself (would do it if she could, approves of others doing it). A theory that grants standing based solely on behavioral consistency fails here.
  6.  **The Reciprocal Standoff (NN):** In cases of mutual corruption (both skimming), the theory must determine if both lack standing, or if one can blame the other. It cannot simply say "both are wrong" and leave the normative status of the blame undefined.
  7.  **The Collective/Institution (NN):** The theory must distinguish the standing of an institution from the standing of its individual members. It must explain how an institution can retain standing to condemn a member even if the specific individual delivering the message is compromised, or conversely, how an institution can lose standing due to systemic hypocrisy even if the specific speaker is clean.
  8.  **The Effective Hypocrite (CP):** The theory must take a stance on whether successful outcomes (e.g., a counselor in relapse helping patients) confer standing. *Constraint:* If the theory says "yes," it must explain why hypocrisy is still a defect. If "no," it must explain why the practical good is irrelevant to the entitlement to blame.

  ### C. Distinctions to Maintain
  9.  **Standing vs. Quality of Blame (NN):** The theory must rigorously distinguish between (a) whether an agent is *entitled* to blame (standing) and (b) whether the blame expressed is *morally good/appropriate* in its tone, intensity, or content. A lack of standing must not be reducible to the blame being "mean" or "excessive."
  10. **Hypocrisy vs. Other Defeaters (NN):** The theory must distinguish hypocrisy from meddling, complicity, lack of moral understanding, or absence of relationship. A theory that collapses these into a single "lack of standing" category fails to guide the agent on *how* to fix the defect (e.g., getting involved vs. cleaning up one's own act).
  11. **Behavioral vs. Attitudinal Inconsistency (NN):** The theory must distinguish between doing what one condemns (behavioral) and believing one is exempt from the norm one applies to others (attitudinal). It must specify which, if either, is the primary defeater.
  12. **Self-Blame vs. Other-Blame (NN):** The theory must explain why the "Self-Flagellant" (harsh on self, lenient on others) does not necessarily lack standing, whereas the standard hypocrite (lenient on self, harsh on others) does. The defect must be tied to the direction of the double standard.

  ### D. External Consistencies
  13. **The Clean-Hands Doctrine (CP):** The theory must explicitly address the analogy to the legal "clean-hands" doctrine. It must state whether this is a genuine moral counterpart (morality denies relief to those tainted by similar conduct) or a procedural legal artifact with no moral weight. *Preference:* Given the practical purpose, a theory that treats this as a mere legal artifact must explain why the moral intuition persists so strongly.
  14. **Psychological Plausibility (NN):** The theory must not rely on double-standards being undetectable. It must align with the evidence that agents are often poor at detecting their own hypocrisy but reasonably good at detecting it in others.
  15. **Norm-Sustaining Function (NN):** The theory must not imply a level of silencing that undermines the community's ability to sustain norms. If the theory implies that most agents lack standing most of the time, it must explicitly justify this high social cost.

  ---

  ## II. The Incompatibility Constraint (The Trilemma)

  There is a binding tension between three plausible demands. An adequate theory cannot satisfy all three simultaneously without significant qualification.

  1.  **Agency-Location:** The defect of hypocrisy is located entirely in the blamer's own agency/normative commitment at the time of blaming (backward-looking/intrinsic).
  2.  **Non-Consequentialism:** The defect is not determined by the consequences of the blame (e.g., whether it does good or harm).
  3.  **No Permanent Silencing:** Committing a wrong does not permanently forfeit standing to condemn that wrong (allowing for the Reformed Offender).

  **The Conflict:**
  If the defect is purely in the **Agency** (1) and is **Non-Consequentialist** (2), then the act of wrongdoing creates a normative inconsistency that taints the agent's relationship to that norm. If the taint is intrinsic to the violation, mere passage of time or cessation of behavior does not remove it. To remove it requires a mechanism of "cleansing" that is not merely behavioral. If you insist on (1) and (2), you are forced toward **Permanent Silencing**. The agent who has violated the norm lacks the normative "cleanliness" to invoke it, full stop.

  To save **No Permanent Silencing** (3)—which is required by the *Reformed Offender* and *Practical Purpose* constraints—one must relax either (1) or (2).
  *   Relaxing (1): You move to a relational account where standing is restored by the *community's* forgiveness or the restoration of trust, not just the agent's internal state.
  *   Relaxing (2): You allow forward-looking considerations (consequences) to grant standing. The reformed offender has standing *because* their blame is now useful/educational, not because their past stain is magically gone.

  **Resolution:**
  For a theory with a **Practical Purpose**, **Permanent Silencing** is the requirement that must be explicitly rejected. A theory that silences reformed offenders renders blame an ineffective tool for moral education and norm repair. Therefore, the theory *must* sacrifice either pure Agency-Location or strict Non-Consequentialism.
  *Recommendation:* Sacrifice strict **Non-Consequentialism**. A practical theory should admit that the *point* of blame is partly to sustain norms. If a reformed offender's blame serves that end better than silence (or better than a stranger's blame), that forward-looking fact is constitutive of their standing. To insist on a purely backward-looking, non-consequentialist account is to prioritize metaphysical purity over the functional role of blame in a community.

  ---

  ## III. The Killer Constraint

  If one requirement separates the theories worth taking seriously from the rest, it is the requirement to **explain the Closet Complier (Case #5) without collapsing Standing into Character.**

  *   **Why it wins:** Simple behavioral accounts (you can't blame if you do the thing) pass the Open Hypocrite test but fail the Closet Complier test. The Closet Complier behaves perfectly but lacks standing because she rejects the norm's authority over herself.
  *   **The Trap:** Many theories respond to this by shifting to a **Character/Vice Account** (hypocrisy is a vice, so vicious people lack standing). This fails the **Standing vs. Quality (Distinction #9)** test. A person can have a vicious character (be a hypocrite) but still be the appropriate person to deliver a specific rebuke (e.g., a parent to a child). If standing is reduced to "being a good person," the concept of standing dissolves into general moral worth.
  *   **The Filter:** A viable theory must identify a specific *normative attitude* (e.g., claiming an exemption, lacking commitment) that defeats standing, distinct from general bad character. It must explain why the Closet Complier's *private reservation* defeats her authority to speak, even if her public record is spotless. Theories that cannot locate the defect in the *normative claim* being made, rather than the *person* making it or the *behavior* preceding it, are eliminated by this constraint.

  ---

  ## IV. Evaluation of Theoretical Families

  **1. Commitment/Presupposition Accounts:**
  *   *Core:* Blame presupposes the blamer's commitment to the norm.
  *   *Performance:* Strong on the **Closet Complier** (she lacks commitment). Struggles with the **Open Hypocrite** (why does admission restore commitment?) and the **Reformed Offender** (did they regain commitment, or just behavioral control?). Often risks collapsing Standing into Quality if "commitment" is vague.
  *   *Verdict:* Promising, but needs a robust account of how commitment is signaled and restored.

  **2. Practice/Consequentialist Accounts:**
  *   *Core:* Standing depends on whether the blame sustains or damages the social practice of holding responsible.
  *   *Performance:* Excellent on **Reformed Offender** and **Effective Hypocrite**. Struggles with the **Tu Quoque Intuition** (why does hypocrisy feel wrong *even if* it works?). Risks making standing too unstable (dependent on predicted outcomes).
  *   *Verdict:* Best fit for the **Practical Purpose**, provided it can explain the intrinsic "bite" of the hypocrisy charge without relying solely on outcomes.

  **3. Authority/Second-Personal Accounts:**
  *   *Core:* Wrongdoing forfeits the authority to make demands of others regarding that norm.
  *   *Performance:* Strong on **Standing vs. Quality** distinction. Struggles significantly with **Institutional Standing** (institutions don't have "authority" in the same sense) and **Reformed Offender** (how is authority magically regained?). Can imply **Permanent Silencing** unless "authority" is treated as relational rather than status-based.
  *   *Verdict:* Structurally clean, but metaphysically brittle regarding restoration of standing.

  **4. Character/Vice Accounts:**
  *   *Core:* Hypocrisy is a vice that undermines the moral worth of the blamer.
  *   *Performance:* Explains the **Self-Flagellant** well (not a vice). Fails the **Standing vs. Quality** distinction (collapses entitlement into moral worth). Fails the **Practical Purpose** (ordinary agents cannot judge character deeply enough in the moment).
  *   *Verdict:* Least suitable for the stated purpose. It turns standing into a judgment on the soul rather than a rule for interaction.
