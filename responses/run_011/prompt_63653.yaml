      His conclusion does not survive scrutiny because the organism analogy is load-bearing and fundamentally misapplied, while the base rate is too sensitive to definition to support a specific seasonal forecast. You are right to suspect that the biology is doing the heavy lifting, because without the assumption of inevitable senescence, the bell curve loses its predictive power regarding where we are in the cycle. To audit the mapping, you have to see what corresponds to what in his model. The genome plays the role of the founding constitution or ideology that dictates how the system replicates itself, the metabolism is the fiscal capacity to extract and deploy resources across the territory, the aging process is mapped to institutional rigidity or elite capture that slows decision-making, the skin is the border where sovereign command stops and the environment begins, and death is the loss of the monopoly on violence or fragmentation.

      The disanalogy that matters most for dating decline is that biological aging is intrinsic and irreversible, whereas imperial decline is often contingent and reversible. An organism dies because its telomeres shorten regardless of how safe its environment is, but an empire usually ends because of a specific external shock or a political choice it could have theoretically avoided. This is not a nitpick because if decline is not senescence but fragility, you cannot estimate time remaining based simply on elapsed time. The analogy quietly imports teleology, suggesting there is a predetermined end point built into the design, which comforts the strategist but misleads the analyst by assuming internal decay is the primary driver when history suggests exogenous shocks often kill healthy-looking powers. It also imports uniformity, assuming all empires follow the same curve despite vast differences in technology and connectivity that change how power projects.

      Regarding the base rate, the reference class problem is fatal to the precision he claims. If you count Rome as one organism you get a different curve than if you count the Republic and Empire separately, and if you count Britain as continuous with the Commonwealth the curve stretches further. A curve built entirely of dead entities cannot reliably predict the trajectory of a living one that might mutate rather than die, which is a form of survivorship bias where the only successful adaptations are excluded because they no longer look like empires. Saying things end is an outside view that is generally true, but saying we are in autumn is a specific claim about internal physiology that the outside view does not support. The outside view tells you probability of failure over a long horizon, not the current season of the cycle.

