      *   *Start:* His conclusion does not survive scrutiny because the organism analogy is load-bearing and fundamentally misapplied, while the base rate is too sensitive to definition to support a specific seasonal forecast.
      *   *Mapping:* To see why, we have to look at how the biology maps onto politics. In this framework, the genome is the founding constitution or ideology that dictates replication, the metabolism is the fiscal capacity to extract and deploy resources, the aging process is institutional rigidity or elite capture, the skin is the border where sovereign command stops, and death is the loss of monopoly on violence.
      *   *Disanalogies:* The critical disanalogy is that biological aging is intrinsic and irreversible, whereas imperial decline is often contingent and reversible. An organism dies because its cells stop functioning regardless of the environment, but an empire usually ends because of a specific external shock or a political choice it could have theoretically avoided. This matters for dating decline because if decline is not senescence but fragility, you cannot estimate time remaining based on elapsed time.
      *   *Imports:* The analogy quietly imports teleology, suggesting there is a predetermined end point built into the design, which comforts the strategist but misleads the analyst. It assumes internal decay is the primary driver when history suggests exogenous shocks often kill healthy-looking powers.
      *   *Base Rate:* The base rate suffers from the reference class problem. If you count Rome as one organism you get a different curve than if you count the Republic and Empire separately, and if you count Britain as continuous with the Commonwealth the curve stretches further. A curve built entirely of dead entities cannot reliably predict the trajectory of a living one that might mutate rather than die. Saying things end is an outside view, but saying we are in autumn is a specific claim about internal physiology that the outside view does not support.
