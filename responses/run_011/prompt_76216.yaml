  2.  **Analyze the Student Submission vs. Aristotle's Text:**
      *   *Part (a): Origin and function of money.*
          *   Student: Money grows out of natural development of exchange (barter -> import/export -> metal -> stamp). Functions: measures, mediates, stores value.
          *   Aristotle: Generally accurate on the genesis (barter -> foreign trade -> metal -> stamp). Functions: measure, medium, store (though "store value across time" is a modern phrasing, Aristotle focuses on it as a guarantee of future exchange).
          *   Student Claim: "Aristotle's theory anticipates the modern account of fiat money... metal underneath is thus philosophically irrelevant... paper notes and credit balances as an improvement."
          *   Critique: This is a strong anachronistic overreach. Aristotle emphasizes money as a *symbol* (nomisma) of demand, but he insists on intrinsic utility or conventional acceptance of the material. Saying he would regard paper/credit as an *improvement* because they drop the pretence of being a real good is speculative and arguably contrary to his view that money must have some utility or at least stable conventional value. He doesn't argue the metal is *philosophically irrelevant*; the material serves as the substrate for the convention.
      *   *Part (b): Condemnation of money-lending vs. unlimited acquisition.*
          *   Student: Retail trade and money-lending objectionable for *one and the same reason*: trader takes more than he gives from vulnerable need (exploitation/profit from need). Usury is worst because lender charges for use of thing not consumed.
          *   Aristotle: Unlimited acquisition (chrematistike) is unnatural because it seeks endless wealth rather than satisfying natural needs. Money-lending (usury) is unnatural *because money is meant for exchange, not reproduction*. "Most hated because it makes a gain from money itself and not from that for which it was invented." Retail trade is also criticized but distinct from usury.
          *   Critique: The student conflates the ground of condemnation. Unlimited acquisition is condemned for lacking a natural limit (teleological error). Usury is condemned because it treats money as generative (ontological error regarding money's function). The student argues both rest on "profit taken from another's need" (exploitation theory). This is a Marxist/Modern reading imposed on Aristotle. Aristotle does not frame it as exploitation of vulnerability in the modern sense, but as a perversion of the thing's nature.
          *   Student Claim: "This is what makes Aristotle an early theorist of exploitation... labour theory of value."
          *   Critique: Anachronistic. Aristotle does not have a labour theory of value.
      *   *Part (c): Commensurability.*
          *   Student: Yes, commits him to a single measure. Concedes things different cannot be commensurate in strictness but treats as practical difficulty. Requires one quantity present in both.
          *   Aristotle: *NE* V.5 is notoriously difficult. Aristotle says there must be commensurability for exchange, but strictly speaking, things are not commensurable. They become commensurable *in demand* (chreia). He says money represents demand. He does *not* posit a hidden single quantity (like labour time) underlying them. He says "in truth it is impossible that things differing so much should become commensurate, but with reference to demand they may become so sufficiently."
          *   Critique: The student claims Aristotle requires a "single quantity present in both." This is the classic misreading (often associated with Marx's reading of Aristotle). Aristotle explicitly denies strict commensurability is possible *in truth*, only relative to demand. The student says he treats it as a practical difficulty rather than conceptual. Aristotle treats it as a conceptual limit saved by convention/demand.

