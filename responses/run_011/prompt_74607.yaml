answer: |-
  To block the slide into total skepticism while preserving your core commitments, you should reject **Premise (4)**.

  Premise (4) states: *"An auxiliary appeal to an independently documented factor is not ad hoc; it is routine scientific practice."*

  While it is true that science routinely uses auxiliary hypotheses, it is false that *any* appeal to an independently documented factor is methodologically legitimate. The legitimacy of a rescue operation depends not merely on the reality of the intervening factor, but on the **relationship between that factor and the core theory** at the time the prediction was made. Rejecting (4) allows you to maintain that evidence bears on theory through predictions (1) and that the Malthusian intervening factors are real (5), without conceding that the theory is immune to disconfirmation.

  ### The Cost of Rejection
  Rejecting (4) requires you to adopt a more sophisticated epistemology than naive falsificationism. You must distinguish between **accommodation** (explaining data after the fact) and **prediction** (specifying data before the fact). In the philosophy of science, this is often framed through Imre Lakatos's methodology of scientific research programs or a Bayesian account of model comparison.

  The cost is that you can no longer treat a theory as a monolithic block that is simply "true" or "false." Instead, you must evaluate the **research program** surrounding the theory. A theory is sustained not just by the existence of explanatory factors, but by whether the introduction of those factors leads to *novel predictions* or merely patches holes. This adds complexity to your middle section, but it is necessary to avoid the conclusion that all long-run science is non-empirical.

  ### Distinguishing Neptune from Malthus
  This rejection satisfies your constraint to condemn the Malthusian rescue while acquitting the inference to Neptune.

  **The Neptune Case (Legitimate Rescue):**
  When Uranus's orbit deviated from Newtonian predictions, astronomers Le Verrier and Adams did not merely point to an existing, known object. They used the core theory (Newtonian gravity) to calculate the precise mass and position of an *unknown* object. The auxiliary hypothesis ("there is a planet at coordinates X") was **constrained by the core theory** to generate a **novel prediction**. When Galle looked at the specified coordinates and found Neptune, the empirical content of the Newtonian program *increased*. The rescue was predictive, not merely accommodative.

  **The Malthusian Case (Illegitimate Rescue):**
  When per capita income rose contrary to Malthusian predictions, proponents pointed to factors like synthetic nitrogen or the demographic transition. While these factors are "independently documented" (satisfying Premise 5), they were not predicted by the Malthusian core. The theory did not specify *when* technological shocks would occur, nor did it provide a mechanism to calculate their magnitude relative to population growth. The appeal to these factors was **post-hoc accommodation**. It explained the anomaly but did not increase the empirical content of the theory; it merely protected the core from refutation by importing exogenous historical facts.

  On this view, the Neptune rescue was a triumph of the theory's predictive power. The Malthusian rescue was a degenerative shift that preserved the theory's letter while vacating its predictive spirit.

  ### What Counts as Evidence Against a Long-Run Theory?
  If you reject (4), evidence against a long-run theory accumulates when the "protective belt" of auxiliary hypotheses becomes **degenerating**. A long-run theory is disconfirmed when:

  1.  **The rescues are purely accommodative:** The theory consistently fails to predict the timing or nature of the intervening factors it relies upon to explain failures.
  2.  **Complexity outpaces insight:** The number of auxiliary conditions required to make the theory fit the data grows without generating new, testable implications.
  3.  **The domain shrinks indefinitely:** If a theory claims to apply to the "long run," but the "long run" is perpetually postponed by unpredictable exogenous shocks, the theory loses its explanatory domain.

  For example, if a climate integrated assessment model consistently fails to predict temperature trajectories and must be recalibrated every decade by invoking unpredictable socio-political factors that were not modeled ex-ante, the model is being disconfirmed, even if a "factor" can always be found to explain the past error.

  ### The Coherent Content of "Correct but Premature"
  On this view, the claim that a theory is "correct but premature" retains coherent content, but it is demoted from a universal law to a **ceteris paribus mechanism**.

  To say Malthus was "correct but premature" is to say:
  *   **The Mechanism is Real:** The causal link between population pressure and resource scarcity (the core theory) is a genuine force in history. Evidence bears on this mechanism (keeping Premise 1).
  *   **The Boundary Conditions Failed:** The theory predicted that this force would *dominate* other forces (technology, institutions) within a specific timeframe. It was wrong about the dominance, not necessarily about the existence of the force.

  This interpretation respects your intuition that the escape from the Malthusian trap told us *something* about the theory. It told us that the Malthusian mechanism is real but **contingent**. It is not an iron law of destiny, but a pressure that can be overridden by sufficiently powerful countervailing forces. The theory is not "refuted" in the sense that the mechanism doesn't exist; it is "refuted" in the sense that its **unconditional predictive claim** was false.

  By rejecting (4), you preserve the empirical status of long-run sciences. They remain answerable to evidence because they are required to do more than find post-hoc excuses for failed predictions; they must demonstrate that their core logic can successfully anticipate the interventions of history, just as Newtonian mechanics anticipated the intervention of Neptune.
