answer: |-
  This is a sharp dissection of *Association for Molecular Pathology v. Myriad Genetics, Inc.* (2013). You have identified the exact friction point where patent law's pragmatic categories grind against biological ontology.

  Here is the reconstruction of the philosophical presuppositions, the constraints on patent practice, and the coherence of the ruling.

  ### 1. The Presupposed Picture: The "Industrial Substrate" View

  The Court's reasoning does not presuppose a single, consistent ontology of the gene (e.g., "DNA is text" or "DNA is chemistry"). Instead, it presupposes a **functionalist, instrumentalist view of genetic material as an industrial substrate.**

  In this view, a "gene" is not a fixed thing with an essential nature. It is defined by its relationship to human intervention and utility.
  *   **For gDNA (Genomic DNA):** The Court treats DNA as **Information**. The physical act of isolation is deemed insufficient to override the fact that the *sequence* (the informational content) is a natural phenomenon. Here, the "product of nature" doctrine acts as an informational constraint on chemical ownership.
  *   **For cDNA (Complementary DNA):** The Court treats DNA as **Chemistry**. The fact that the *sequence* mirrors natural coding regions is overridden by the fact that the *molecule* (DNA without introns) does not exist in nature *in that chemical form*.

  **Does it switch depending on the desired outcome?**
  Superficially, yes. But philosophically, it is applying a single rule: **Patentability requires a human alteration of the natural state that creates a new utility.**
  *   Isolating gDNA changes the chemical environment (it's out of the chromosome) but not the *functional potential* relative to nature (it still codes for the same protein in the same way).
  *   Creating cDNA changes the chemical structure (introns removed) which creates a *new functional potential* (it can be expressed in prokaryotic systems like bacteria that cannot splice introns).

  The Court is not toggling between "text" and "molecule" arbitrarily; it is toggling between **identity** (is this the same natural phenomenon?) and **novelty** (is this a new composition of matter?). It uses "information" to prove identity for gDNA, and "chemistry" to prove novelty for cDNA.

  ### 2. What Practice Strictly Needs vs. What Fits Comfortably

  **What Patent Practice Strictly Needs:**
  Patent law (§ 101) requires a bright line between **Discovery** (finding what already exists) and **Invention** (creating something new). To sustain a biotech industry, the law needs to allow ownership of *tools* without allowing ownership of *basic knowledge*.
  *   **Need:** A category of protectable subject matter that incentivizes the expensive work of identifying gene functions without granting a monopoly on the fundamental building blocks of life.
  *   **The cDNA Compromise:** cDNA is the perfect legal fiction for this need. It is chemically distinct enough to be an "invention," but functionally identical enough to the natural gene to be useful for testing/therapy.

  **What Merely Sits Comfortably:**
  The specific biological distinction between DNA and RNA sits comfortably with this, but isn't strictly necessary.
  *   The Court's dismissal of the mRNA argument (that nature already makes the intron-less version) relies on a **chemical essentialism** that biology doesn't strictly require. Biology cares about the protein product; Patent law cares about the stable vector.
  *   It is comfortable for the law to say "DNA is different from RNA," but if the goal were purely informational, that distinction wouldn't matter. The distinction matters only because patent law protects *compositions of matter*, and DNA is a different matter than RNA.

  ### 3. Which Theories of Genetic Information Are Forced?

  The *Myriad* ruling is incompatible with a **Pure Informationalist** view and a **Pure Materialist** view. It forces a **Hybrid Interventionist** theory.

  *   **Incompatible: Pure Informationalism.** If DNA is *only* text/code, cDNA cannot be patented. The message is identical to the mRNA message. The Court explicitly rejects this by granting the patent.
  *   **Incompatible: Pure Materialism.** If DNA is *only* chemistry, isolated gDNA *should* be patentable. Isolating a molecule changes its chemical bonds (covalent bonds to the chromosome are broken). The Court explicitly rejects this by denying the patent.
  *   **Forced: The "Human Intervention" Threshold.** The ruling forces the view that the ontology of a gene is dependent on the **degree of human modification**. A gene is "natural" until human manipulation alters its structure *enough* to change its industrial applicability. The "gene" is not a pre-existing object; it is a legal status conferred upon a molecule based on how much work humans did to make it useful.

  ### 4. Swapping the Presupposed View

  If we swapped the Court's **Industrial Substrate** view for one of its rivals, patent practice would break or shift radically:

  **Swap A: Pure Informationalist View (DNA is Text)**
  *   **Change:** If the law treated DNA strictly as semantic content, *neither* gDNA nor cDNA would be patentable. The sequence is the invention, and the sequence is natural.
  *   **Consequence:** Biotech patents would shift entirely to **Methods and Processes**. You could patent the *method* of using cDNA to diagnose cancer, but not the cDNA molecule itself. This weakens protection, as methods are easier to design around than compositions of matter. Investment in basic gene isolation would likely plummet.

  **Swap B: Pure Materialist View (DNA is Chemistry)**
  *   **Change:** If the law treated DNA strictly as chemical matter, isolated gDNA *would* be patentable. Breaking the covalent bonds of the chromosome creates a new chemical entity.
  *   **Consequence:** This returns us to the pre-2013 status quo. Companies could monopolize the gene sequence itself. This stifles diagnostic testing (as seen with Myriad) because any test using that sequence infringes the composition patent. Research tools become locked behind paywalls.

  **Swap C: Functionalist View (The Gene is what it Does)**
  *   **Change:** If the law focused purely on function (producing the BRCA protein), both gDNA and cDNA might be treated similarly, likely unpatentable as natural functions, unless the *expression system* was patented.
  *   **Consequence:** This aligns closest to European patent law (which is stricter on gene patents). It forces innovation toward *applications* (therapies, devices) rather than *inputs* (sequences).

  ### 5. Coherence Verdict

  **Is the practice flatly incoherent?**
  No. It is **pragmatically coherent but ontologically unstable.**

  **The Best Reconstruction:**
  The Court is operating under a doctrine of **Teleological Distinction**.
  *   **gDNA:** Its *telos* (purpose/end) is natural. It exists to function in a human cell. Isolating it doesn't change its purpose. Therefore, it remains a natural phenomenon.
  *   **cDNA:** Its *telos* is artificial. It does not exist to function in a human cell (it lacks regulatory elements); it exists to function in a *lab vector* (like a plasmid in bacteria). Its purpose is industrial. Therefore, it is a human invention.

  The "mRNA objection" fails in this reconstruction because mRNA's *telos* is transient signaling within the cell. cDNA's *telos* is stable replication in a host. They are different tools for different jobs, even if they share the same "code." The Court isn't switching between text and chemistry; it is switching between **Natural Purpose** and **Industrial Purpose**. The chemical difference (DNA vs RNA, introns vs no introns) is merely the evidence used to prove the difference in purpose.

  ### 6. Confidence and Weakest Point

  **Confidence Level:** **85%**

  I am highly confident in the legal reconstruction (the tension between § 101 subject matter eligibility and the product of nature doctrine) and the philosophical categorization (Instrumentalism vs. Realism). The *Myriad* opinion is textually clear about its reliance on the "created" vs. "found" distinction.

  **The One Point I Am Least Sure About:**
  The **Teleological Reconstruction** (Natural Purpose vs. Industrial Purpose).
  While this makes the ruling philosophically coherent, there is no evidence in Justice Thomas's opinion that the Court was reasoning about *telos* or biological function. They explicitly leaned on the chemical distinction ("the lab technician unquestionably creates something new when introns are removed").
  It is possible the Court was not being philosophically subtle at all, but simply lacked a robust understanding of mRNA's role, treating cDNA as "more different" from nature than it actually is. If the Court *actually* believed cDNA was fundamentally more "man-made" than isolated DNA without regard for function, then the "Industrial Purpose" reconstruction is a rationalization I am imposing to save the ruling from incoherence, rather than the reasoning that generated it.

  **Summary:** The practice forces a view where **human labor alters ontology**. It is coherent if you view patents as protecting *industrial tools* rather than *natural kinds*. It breaks if you demand a consistent biological definition of what a gene "is."
