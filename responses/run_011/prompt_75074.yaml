      *(Refining the "Molecule vs Text" point)*: The Court actually tries to have it both ways. It says gDNA is unpatentable because the *information* is natural (Text), but cDNA is patentable because the *molecule* is new (Chemistry). The user is right that this looks like a switch. The reconciliation is that Patent Law requires *both* a new composition *and* that the composition isn't merely a natural phenomenon. cDNA clears the "new composition" hurdle; gDNA fails the "natural phenomenon" hurdle. The "Information" aspect is the proxy for "Natural Phenomenon."

